prompt: |-
  I am designing a 90-minute graduate workshop on practical rationality for 14 advanced philosophy students. I want an in-class game that makes participants feel the force of escalation of commitment within a dollar-auction structure—not merely grasp it intellectually, but experience the precise moment when continuing to bid feels locally rational even as global losses accumulate, and when quitting feels like a betrayal of prior moves rather than an arithmetic correction.

  Design a fully runnable activity with the following architecture. Use a classic dollar-auction payoff scheme: participants are paired into 7 simultaneous pairs. Each pair competes for a fixed prize worth 10 points. Bids escalate in increments of 1 point. The highest bidder wins the prize and pays their final bid; the second-highest bidder pays their final bid and receives nothing. Run the bidding for up to 12 rounds or until both withdraw. Use no real money—only points that feed into a small-stakes course-ranking system—while preserving enough emotional weight that withdrawal stings.

  Inject this philosophical twist: before bidding begins, each player secretly draws one of three practical-reason profiles—Instrumentalist (justify each move solely by expected point yield), Identity-Consistent (justify each move solely by coherence with prior public commitments made in this game), or Rule-Follower (justify each move solely by adherence to a self-announced stopping threshold, which they must state aloud in round 1). Every bid must be accompanied by a one-sentence written rationale on a visible index card, constrained strictly to the reasoning mode of their drawn profile. A player may switch profiles at any time, but doing so costs 3 points, requires them to physically tear up their old justification card in front of their partner, and forces them to begin a fresh card. The rules and the visibility of the cards should be arranged so that the justification mechanism itself becomes part of the escalation trap: players defend continued bidding not because they still want the prize, but because tearing up the log or violating their announced rule feels like a public admission of failure or irrationality.

  Please provide: (1) complete rules, materials, and room setup; (2) the point/payoff scheme and how it sustains emotional stakes without real money; (3) a timeline dividing the 30-minute game phase from the 60-minute debrief and discussion; (4) the debrief mapped precisely onto moments in the game—the first bid that exceeds half the prize value, the round in which a partner’s glare or silence replaces calculation, the moment a player considers tearing their card but bids instead—connecting each to the formal mechanics of sunk-cost escalation and to the philosophical tension between instrumental and identity-based practical reason; (5) an honest prediction of what will predictably go wrong the first time (e.g., pairs quitting too early out of social embarrassment, one partner refusing to bid aggressively, or the profile-draw feeling arbitrary) and how to correct for it in facilitation; and (6) a frank statement of which feature of real-world commitment escalation this activity cannot reproduce—such as the absence of genuine financial ruin, or the fact that profiles are assigned rather than authentically adopted—and how you will supply that missing feature verbally during the debrief.

  The idea should emerge from what the rules and incentives cause participants to do, not from what you explain afterward. Do not include a bibliography, reading list, or citation to any author. Do not ask participants to read anything in advance. Write as if I will run this tomorrow.
reasoning: |-
  Here's a thinking process that leads to the suggested workshop activity:

  1.  **Analyze the Request:**
      *   **Target Audience:** 14 advanced philosophy graduate students.
      *   **Topic:** Practical Rationality (specifically Escalation of Commitment/Sunk Cost Fallacy).
      *   **Duration:** 90 minutes total (30 min game, 60 min debrief).
      *   **Core Mechanic:** Dollar Auction variant (Prize = 10 points, Bid increments = 1 point, Both highest and second-highest pay).
      *   **Structure:** 7 pairs.
      *   **Philosophical Twist:** Three "Practical-Reason Profiles" (Instrumentalist, Identity-Consistent, Rule-Follower). Bids require written justification matching the profile. Switching profiles costs 3 points + public ritual (tearing card).
      *   **Goal:** Make them *feel* the escalation, not just understand it. The justification mechanism must become part of the trap.
      *   **Deliverables:** Rules/Materials/Setup, Payoff Scheme, Timeline, Debrief Map, Prediction of Failure/Correction, Limitations Statement.
      *   **Constraints:** No bibliography, no pre-reading, write as if running tomorrow.

  2.  **Deconstruct the Core Tension:**
      *   *Standard Dollar Auction:* Rationality breaks down because the second-highest bidder loses their bid. To avoid losing 5 to win 10, you bid 6. Then 7, etc.
      *   *The Twist:* The justification requirement adds a layer of *social* and *identity* cost. If I am an "Identity-Consistent" player and I've bid 4 times saying "I am committed to winning," stopping now contradicts my identity. If I am a "Rule-Follower" and I said "I stop at 5," but I'm at 4 and losing, changing my rule costs points and requires a humiliating public act (tearing the card).
      *   *The Trap:* The cost of switching rationality frameworks (3 points + social shame) might exceed the cost of continuing the bidding war, even when the bidding war is mathematically ruinous. This mirrors real life where we don't change our *worldview* to solve a problem; we double down on the problem to protect the worldview.

  3.  **Drafting the Rules & Mechanics:**
      *   *Pairs:* 14 students = 7 pairs.
      *   *Prize:* 10 points.
      *   *Bids:* 1, 2, 3...
      *   *Payment:* Winner pays bid, gets 10. Loser pays bid, gets 0. (Net: Winner = 10 - Bid, Loser = -Bid).
      *   *Profiles:*
          1.  *Instrumentalist:* "This bid maximizes expected net gain."
          2.  *Identity-Consistent:* "This bid maintains coherence with my previous stance."
          3.  *Rule-Follower:* "This bid adheres to my Round 1 threshold."
      *   *Switching:* Cost 3 points. Tear card. Write new one.
      *   *Visibility:* Index cards must be visible to the partner. This creates the "audience" effect.
      *   *Stakes:* Course ranking. Needs to matter enough to sting, but not ruin grades. Let's say it counts for 5-10% of participation or a tangible perk (e.g., choosing seminar topics, priority for office hours). Let's stick to the prompt's "course-ranking system."

  4.  **Refining the "Feel":**
      *   To make withdrawal feel like betrayal, the "Identity-Consistent" profile needs to be seductive.
      *   To make the card tearing feel significant, the facilitator needs to emphasize the ritual.
      *   The "Rule-Follower" needs to declare a threshold *aloud* in Round 1. This locks them in publicly.

  5.  **Developing the Debrief:**
      *   Needs to map specific game moments to philosophical concepts.
      *   *Moment 1:* Bid > 5 (Half value). This is where instrumental rationality usually says "stop."
      *   *Moment 2:* The Silence/Glare. When communication breaks down and it becomes purely about not losing face.
      *   *Moment 3:* The Card Tear Hesitation. The specific moment where the cost of changing frameworks is weighed against the cost of the bid.
      *   *Philosophical Connection:* Instrumentalism vs. Constitutive Rules vs. Identity.

  6.  **Anticipating Failure Modes:**
      *   *Collusion:* Students might agree to bid 1 and stop. *Counter:* Secret profiles + competitive ranking makes collusion risky.
      *   *Early Quit:* They might see the trap and quit at 0. *Counter:* The "Second highest pays" rule must be enforced strictly. The "sunk cost" only hits if you bid at least once.
      *   *Profile Irrelevance:* They might ignore the justification text. *Counter:* Facilitator must reject bids without valid cards.
      *   *Cynicism:* "This is just a game." *Counter:* Emphasize the course ranking stakes.

  7.  **Addressing Limitations:**
      *   Real money vs. Points.
      *   Assigned vs. Chosen identities.
      *   Need to verbally bridge this gap in the debrief.

  8.  **Structuring the Document:**
      *   Follow the 6 requested points exactly.
      *   Tone: Instructional, precise, ready-to-run.
      *   Time Management: 90 mins is tight. 30 for game, 60 for talk. Need strict timekeeping.

  9.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is 3 points too high a cost for switching profiles?
      *   *Adjustment:* If the prize is 10, and bids are 1, 2, 3... 3 points is significant (30% of prize). It creates a real barrier. Keep it.
      *   *Critique:* Will 7 pairs finish in 30 mins?
      *   *Adjustment:* 12 rounds max. If a pair gets stuck, facilitator intervenes. Need to ensure bidding is fast. Use physical tokens or just written logs? Written logs on the index cards are better for the "trail of justification."
      *   *Critique:* How to handle the "Rule-Follower" threshold?
      *   *Adjustment:* They must write it on the card in Round 1. "I stop at X." If they bid past X, they *must* switch profiles or tear the card. Actually, the rule says "adherence to a self-announced stopping threshold." If they bid past it, they are violating the profile. So they *must* switch to continue. This creates the friction point.

  10. **Final Polish:** Check constraints. No bibliography. No pre-reading. Write for tomorrow. Ensure the emotional weight is highlighted in the setup instructions.

  *(Self-Correction on the "Rule-Follower" mechanic)*: If a Rule-Follower sets a limit of 5, and the bidding reaches 6, they cannot bid 6 *as* a Rule-Follower. They must switch profiles to bid 6. This forces the "tear up card" moment exactly when rationality demands stopping. This is the crux. I need to make sure this rule is crystal clear.

  *(Self-Correction on Payoff)*: "Course-ranking system." I need to define this simply so the instructor can implement it. "Top 3 pairs get X, Bottom 3 get Y."

  *(Refining the Debrief)*: Ensure the link between "tearing the card" and "admitting error" is explicit. That's the psychological hook.

