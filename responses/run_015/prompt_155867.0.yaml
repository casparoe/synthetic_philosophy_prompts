  Stranger, this notion of "deliberative lock-in" you introduce captures the shadow side of our *ekklesia*, yet I argue it accounts for our stumbles better than blaming mere wickedness, revealing a peril inherent to all human speech rather than a defect unique to the *demos*. It is true that Cleon shackled us with anger at Mytilene until Diodotus loosened the chain by speaking of utility, just as Alcibiades blinded us with dreams of Sicilian glory and the accusers of Socrates traded on our fear of impiety; in each case, a single voice narrowed the horizon of the many. But consider the alternative: a small council of the *oligoi* locks in far faster and breaks far harder, for when the few share a single frame of honor or fear, there are fewer tongues to challenge it, as we suffered under the Thirty who locked Athens into bloodshed without recourse to persuasion. The multitude is like the sea, sometimes stirred by storms of rhetoric, but ultimately corrects itself because within the crowd there always remains someone capable of speaking the untimely truth to break the spell, whereas a council of experts becomes a prison of shared assumption from which only force, not speech, can liberate us.
