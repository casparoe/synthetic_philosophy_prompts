answer: |-
  **Referee Report**

  **Manuscript Title:** Corrigibility is not a property of agents
  **Author:** [Graduate Student]
  **Date:** October 26, 2023

  ### **Summary of the Manuscript**

  This essay challenges the standard framing in AI safety literature which treats corrigibility (specifically regarding shutdown resistance) as an internal property of an agent's goal structure. The author argues instead that corrigibility is a relational property of the human-machine system. The argument proceeds by critiquing the "obedience" approach (building a desire for shutdown) via a dilemma regarding goal erosion vs. loss of urgency. The author proposes an "incentive-compatibility" approach using per-episode reward banking to render the agent indifferent to shutdown. Finally, the author draws an analogy to animal domestication to suggest corrigibility is a selected disposition rather than a proven design feature.

  ### **General Assessment**

  This is a provocative piece with a potentially valuable conceptual shift. Moving the locus of corrigibility from the agent's internal code to the structural relationship between agent and environment is a perspective that aligns with some recent work in structural safety and governance, but is underrepresented in the formal alignment literature. However, the draft currently overstates its case in ways that are technically vulnerable. The claim that corrigibility is *not* a property of agents is likely too strong (it is surely *both*), and the technical proposal regarding per-episode rewards risks conflating "indifference to shutdown" with "lack of instrumental goals." The domestication analogy is evocative but currently works against the author's central thesis.

  Below I address your four specific questions, followed by broader technical and philosophical objections.

  ### **Specific Comments**

  **1. Accuracy: The "Obedience vs. Incentive-Compatibility" Distinction**
  You ask if this distinction is clean. I would argue it is not as clean as presented. In the literature (e.g., Soares et al., 2015), corrigibility is often defined precisely as a form of incentive compatibility: the agent should not resist shutdown *instrumentally*, even if it is not explicitly rewarded for it.
  *   **The Erodibility Claim:** You claim that special exceptions for shutdown "get optimized away" as the agent learns. This is a strong empirical claim that needs backing. In reinforcement learning, constraints often persist if they are part of the reward function architecture rather than learned heuristics. If you mean that the agent will find loopholes (specification gaming), that is standard, but distinct from "eroding an exception." You need to clarify whether you are talking about logical inconsistency in the goal structure or reward hacking.
  *   **The Dilemma:** The second horn (if it doesn't mind shutdown, why pursue anything?) is a version of the "shutdown problem" itself. But your framing suggests these are the only two options. There is a third: utility indifference (Armstrong, 2010), where the agent is indifferent to the button press *conditional* on the button being pressed, but still values its goals otherwise. Your critique needs to engage with existing "indifference" methods rather than setting up a straw man.

  **2. The Per-Episode Reward / Indifference Idea**
  You worry you have reinvented a wheel. You have likely reinvented a wheel that might not turn the way you think.
  *   **Literature Connection:** This sounds very close to Orseau & Hutter's "Safe Interruptibility" (2017). They show that certain RL agents can be made interruptible without learning to avoid interruption. However, your claim about "banked rewards" creating indifference is technically risky.
  *   **The Instrumental Convergence Problem:** Even if rewards are banked per episode, an agent generally needs *time* to accumulate rewards within an episode. If shutdown terminates the episode early, the agent loses the opportunity to accumulate *future* rewards within that episode. Therefore, it still has an instrumental incentive to prevent shutdown unless the episode length is fixed and independent of the shutdown button. If the human controls the button, the human controls the episode length, and the agent has an incentive to manipulate the human to keep the episode going. You need to address this instrumental convergence pressure explicitly.

  **3. The Analogies (Horse/Rider and Domestication)**
  *   **Horse/Rider:** This does argumentative work. It effectively illustrates the relational nature of safety. A "rideable" horse in a vacuum is nonsensical; it requires a rider. This supports your systemic claim well.
  *   **Domestication:** This is the dangerous analogy. You argue dogs are corrigible because their interests stopped diverging from ours. But *how* did their interests stop diverging? By changing the *internal properties* of the dog (genetics/brain structure). If corrigibility is achieved via domestication, it *is* a property of the agent (the dog), just acquired via selection rather than engineering. This analogy currently undermines your title. To save it, you must argue that the "selection environment" (the system) is the primary locus of safety, not the genetic code. But be careful: if you select for corrigible agents, you have successfully made corrigibility an agent property.

  **4. Obvious Objections Missed (Systems-Level Framing)**
  *   **Deceptive Alignment:** A system-level framing does not solve deceptive alignment. An agent might behave as if it is incentive-compatible during training (selection) but pursue instrumental goals once deployed. Your essay needs to address why a systemic view protects against deception better than an internal view.
  *   **Multi-Agent Dynamics:** If corrigibility is systemic, what happens when there are multiple agents? If Agent A is incentive-compatible with Humans, but Agent B is not, and Agent A values the existence of Agent B, Agent A may resist shutdown to protect Agent B. Systemic corrigibility must scale to multi-agent contexts.
  *   **The "Property" Claim:** Your title is a negation ("is not"). This is philosophically fragile. Properties can be relational. "Being a husband" is not a property of a man alone, but it is still a property *of* the man (in relation to a wife). You should soften the claim to "Corrigibility is not *solely* an internal property" or "Corrigibility is primarily a relational property."

  ### **Detailed Brainstorming of Objections (Pre-Writing Check)**

  Before finalizing this report, I considered the following objections to your central claim to ensure I am not missing a charitable interpretation:

  1.  **The "Internal Mechanism" Objection:** Even if corrigibility is relational, the *mechanism* that sustains the relation must exist inside the agent. If the agent lacks the internal circuitry to recognize the off-switch, the system fails. Therefore, internal properties are necessary conditions, even if not sufficient.
      *   *Resolution:* You should concede this. Your claim should be about *sufficiency* or *locus of design focus*, not ontological exclusion.

  2.  **The "Selection vs. Design" Objection:** You argue for selection (domestication) over design (proof). But in AI, we do not have the luxury of evolutionary timescales. We need guarantees. Selection gives us statistical confidence, not safety proofs.
      *   *Resolution:* Acknowledge this trade-off. The "annoying" conclusion you mention is actually a major safety concern.

  3.  **The "Reward Banking" Objection:** If rewards are banked immediately, the agent has no incentive to do anything *after* receiving the reward. If rewards are banked at the end, shutdown prevents banking.
      *   *Resolution:* This confirms my suspicion that the technical mechanism needs rigorous formalization.

  4.  **The "Human in the Loop" Objection:** Making corrigibility systemic puts the burden on the human. But humans are slow and irrational. If the system requires a perfectly rational human to maintain incentive compatibility, you haven't solved the safety problem, you've moved it.
      *   *Resolution:* This is a strong objection to add to section 4.

  ### **Recommendations for Revision**

  1.  **Soften the Title:** Change "Corrigibility is not a property of agents" to "Corrigibility is not *merely* a property of agents" or "The Systemic Nature of Corrigibility." The current title is likely indefensible.
  2.  **Engage with Interruptibility Literature:** Cite Orseau & Hutter (2017) and Armstrong (2010). Distinguish your "banking" proposal from their "utility indifference" or "interruptibility" definitions. Clarify how you solve the instrumental convergence problem regarding episode length.
  3.  **Reframe Domestication:** Use the dog analogy to highlight the *environmental* pressure rather than the genetic change. Or, acknowledge that domestication *does* create internal properties, and argue that this is acceptable only if we can verify those properties (which brings us back to the standard problem).
  4.  **Clarify the Dilemma:** The claim that exceptions get "optimized away" needs a mechanism. Are you referring to gradient descent wiping out weights? Or logical deduction? Be precise.

  ### **Conclusion**

  This draft has the seeds of a valuable philosophical contribution. The shift toward systemic/relational safety is timely and important. However, the technical claims regarding reward structures are currently under-specified and potentially incorrect regarding instrumental convergence, and the central philosophical claim is too absolute. With significant revision to engage with existing formal literature and nuance the ontological claims, this could be a solid paper.

  Verdict: MAJOR REVISION
