prompt: |-
  You serve as the senior ethics auditor for a regional health system that deploys predictive algorithms to assign individual patients to risk-reference classes for treatment prioritization. Because the philosophical reference-class problem undermines any automatic assignment—there is no unique correct class for an individual, and substituting one class for another can alter the predicted probability without altering the underlying medical fact—your office needs a reusable audit procedure. Write a formal, step-by-step decision procedure that a non-philosopher reviewer can execute in approximately thirty minutes per case to determine whether an algorithm’s assigned reference class is defensible, illegitimate, or genuinely indeterminate. The procedure must ask ordered questions about: (i) the statistical robustness and sample size of the proposed class; (ii) the causal relevance of each class-defining property to the specific outcome being predicted; (iii) counterfactual stability of membership—specifically, whether the patient would remain in the class under the intervention whose risk is being predicted, and whether using a counterfactual property creates circular reasoning; and (iv) whether intersecting sub-classes generate non-transitive membership relations that cause the prediction to collapse. For each step, specify what counts as a sufficient answer, where the procedure terminates with an unambiguous approval or rejection, and where it must escalate to a human values-committee because the issue is irreducibly normative rather than factual. Include a concise set of test conditions—data-level and sentence-level checks—the reviewer can apply without specialized statistical software. Then run the procedure on three cases: (a) a 58-year-old patient assigned to a cardiovascular-risk class defined partly by a biomarker that also functions as a proxy for socioeconomic status, where the procedure yields an approval that the clinical team will strongly resist on equity grounds; (b) a patient whose class membership depends on a counterfactual biomarker level—what the level would be after a preliminary treatment—creating circularity in the risk prediction for that very treatment; and (c) a patient who belongs to two statistically valid reference classes that yield contradictory risk rankings, leaving the procedure unable to resolve the conflict. Conclude by stating precisely what the procedure is powerless to settle—particularly regarding distributive fairness across classes and the weighting of competing valid classes—and flag every step where judgment is unavoidable despite the formal structure.
reasoning: |-
  Here's a thinking process that leads to the suggested audit procedure:

  1.  **Analyze the Request:**
      *   **Role:** Senior Ethics Auditor for a regional health system.
      *   **Task:** Create a formal, step-by-step decision procedure (audit tool) for evaluating predictive algorithm reference classes.
      *   **Constraint 1 (Time):** Executable by a non-philosopher reviewer in ~30 minutes per case.
      *   **Constraint 2 (Content):** Must address four specific philosophical/technical areas:
          1.  Statistical robustness/sample size.
          2.  Causal relevance of class-defining properties.
          3.  Counterfactual stability (membership under intervention & circularity).
          4.  Intersecting sub-classes (non-transitive membership/collapse).
      *   **Constraint 3 (Outputs):** For each step, define sufficient answers, termination points (Approval/Rejection), and escalation points (Human Values Committee).
      *   **Constraint 4 (Tests):** Include concise data-level and sentence-level checks (no specialized software).
      *   **Constraint 5 (Application):** Run the procedure on three specific cases (a, b, c).
      *   **Constraint 6 (Conclusion):** State limitations (distributive fairness, weighting) and flag unavoidable judgment calls.

  2.  **Deconstruct the Reference Class Problem in this Context:**
      *   The core issue is that an individual belongs to infinite classes. Choosing one determines the risk probability.
      *   *Example:* A 50-year-old smoker. Class A: 50-year-olds (Risk X). Class B: Smokers (Risk Y). Class C: 50-year-old smokers (Risk Z). Which is the "true" risk?
      *   The audit needs to filter out *bad* classes (statistically weak, causally irrelevant, circular, contradictory) to find *defensible* ones, acknowledging that some conflicts are normative, not factual.

  3.  **Drafting the Procedure (The "RCA-30" - Reference Class Audit 30-minute):**
      *   *Structure:* Needs to be a checklist/flowchart style.
      *   *Tone:* Formal, administrative, actionable.
      *   *Step 1: Statistical Robustness.* (Is the class real enough?)
          *   Check: N-size, confidence intervals.
          *   Fail: Reject. Pass: Continue.
      *   *Step 2: Causal Relevance.* (Does the property matter to the outcome?)
          *   Check: Correlation vs. Causation. Proxy variables.
          *   Fail: Reject (or Escalate if proxy is sensitive). Pass: Continue.
      *   *Step 3: Counterfactual Stability.* (Does the class change if we treat?)
          *   Check: Intervention dependency. Circular prediction.
          *   Fail: Reject (Circularity). Escalate (if intervention changes class legitimately).
      *   *Step 4: Intersection/Consistency.* (Do classes fight?)
          *   Check: Contradictory risk scores from valid classes.
          *   Fail: Escalate (Normative weighting needed).
      *   *Checks:* Need simple heuristics (e.g., "Look at the N," "Read the variable definition").

  4.  **Refining the Steps for the "Non-Philosopher":**
      *   Avoid jargon like "non-transitive membership relations" in the instructions; explain it as "contradictory rankings."
      *   Ensure the "Escalate" criteria are clear. Normative issues = Committee. Factual failures = Rejection.
      *   *Self-Correction on Step 2:* If a variable is a proxy for SES (Socioeconomic Status), is it causally relevant to *biology*? Maybe not directly, but it predicts access to care. This is a normative/ethical issue, not just statistical. This needs an Escalation path, not just Rejection.
      *   *Self-Correction on Step 3:* Circular reasoning is a hard fail. Stability under intervention is trickier. If treating the patient moves them to a lower risk class, that's good, but you can't use the *post-treatment* class to justify the *pre-treatment* priority.

  5.  **Developing the Test Conditions:**
      *   *Data-Level:* Sample size thresholds, missing data rates.
      *   *Sentence-Level:* Variable definitions (look for "post-treatment," "proxy," "score").

  6.  **Running the Cases:**
      *   *Case A (SES Proxy):* Statistically robust? Yes. Causally relevant? Biologically debatable, but predictive. Counterfactual? Stable. Intersection? Single class.
          *   *Result:* Technically Defensible (Pass).
          *   *Conflict:* Equity grounds. This highlights the limitation. The procedure says "OK," ethics says "Unfair." This requires an Escalation flag on the *Causal Relevance* step regarding proxies.
      *   *Case B (Counterfactual Biomarker):* Class depends on *post-treatment* level.
          *   *Result:* Circular. Hard Rejection at Step 3.
      *   *Case C (Contradictory Classes):* Two valid classes, opposite risks.
          *   *Result:* Indeterminate. Escalation at Step 4.

  7.  **Drafting the Conclusion/Limitations:**
      *   Must admit the procedure cannot solve the "Weighting Problem" (which valid class counts more?).
      *   Must admit it cannot solve "Distributive Fairness" (is it right to use SES proxies?).
      *   Flag judgment calls (e.g., determining "causal relevance" often requires expert intuition).

  8.  **Review against Constraints:**
      *   30 minutes? Yes, checklist style.
      *   Four specific areas covered? Yes.
      *   Termination/Escalation defined? Yes.
      *   Three cases run? Yes.
      *   Limitations stated? Yes.

  9.  **Final Polish:**
      *   Ensure the tone is authoritative yet humble about the philosophical limits.
      *   Make sure the distinction between "Illegitimate" (Technical fail), "Defensible" (Technical pass), and "Indeterminate" (Normative conflict) is clear.
      *   *Correction on Case A:* The prompt says the procedure yields an *approval* that the clinical team will *resist*. I need to make sure the procedure actually approves it based on technical criteria, while flagging the ethical tension for the conclusion.
      *   *Correction on Step 2:* If a variable is a proxy for SES, is it "Causally Relevant"? If the outcome is "health outcome," SES is causally relevant to *access*, but maybe not *biology*. If the algorithm claims biological risk, it's a false causal claim. If it claims "utilization risk," it's valid. I will frame the procedure to catch this distinction. If the label is "Clinical Risk" but the variable is "Zip Code," that's a validity failure. If the label is "Resource Need," it's valid but ethically sensitive. Let's make Case A pass the technical check but highlight the ethical friction.

  10. **Finalizing the Text:** (Proceeding to generate output based on these thoughts.)
answer: |-
  # REGIONAL HEALTH SYSTEM ETHICS AUDIT
  ## PROCEDURE RCA-30: REFERENCE CLASS DEFENSIBILITY AUDIT
  **Version:** 1.0 | **Auditor Level:** Non-Specialist Reviewer | **Time Limit:** 30 Minutes/Case

  ### PURPOSE
  To evaluate whether the reference class assigned to a patient by a predictive algorithm is statistically valid, causally coherent, and logically stable. This procedure distinguishes between technical failures (Rejection), normative conflicts (Escalation), and defensible assignments (Approval).

  ### PRE-AUDIT CHECKS (5 Minutes)
  *Gather the following documents before starting:*
  1.  **Model Card:** Documentation of the algorithm's training data and intended use.
  2.  **Patient Profile:** The specific data points for the case under review.
  3.  **Variable Dictionary:** Definitions of all inputs used to assign the reference class.

  **Test Condition 1 (Data-Level):** Verify the `Class_N` (number of patients in the training set matching this class).
  **Test Condition 2 (Sentence-Level):** Scan variable definitions for temporal markers (e.g., "post-treatment," "projected," "following intervention").

  ---

  ### STEP 1: STATISTICAL ROBUSTNESS & SAMPLE SIZE
  **Question:** Is the reference class sufficiently populated to generate a stable probability estimate?

  **Reviewer Action:**
  1.  Locate `Class_N` in the Model Card for the specific class assigned to the patient.
  2.  Check the Confidence Interval (CI) width for the predicted risk outcome.

  **Decision Criteria:**
  *   **REJECT (Illegitimate):** `Class_N` < 50 OR Confidence Interval width > 20% of the predicted value. (The class is too small to be statistically meaningful).
  *   **PROCEED:** `Class_N` ≥ 50 AND CI is narrow.
  *   **ESCALATE:** `Class_N` is adequate, but the class is defined by a rare demographic combination (e.g., specific ethnicity + rare condition) where historical data may reflect systemic under-sampling rather than biological reality.

  **Judgment Flag:** Determining if "under-sampling" reflects bias requires contextual knowledge of local demographics.

  ---

  ### STEP 2: CAUSAL RELEVANCE OF CLASS PROPERTIES
  **Question:** Do the properties defining the class have a plausible causal link to the outcome, or are they spurious proxies?

  **Reviewer Action:**
  1.  List the top 3 variables defining the class membership.
  2.  Apply the **"Mechanism Test"**: Can you draw a direct line from Variable → Biological/Behavioral Mechanism → Outcome without passing through a systemic bias filter?

  **Decision Criteria:**
  *   **REJECT (Illegitimate):** A defining variable is a known proxy for a protected class (e.g., Zip Code for Race, Insurance Type for SES) *AND* the model claims to predict *biological* risk rather than *resource utilization*.
  *   **PROCEED:** Variables are direct clinical measures (e.g., BP, HbA1c) or the model explicitly predicts *utilization* where SES is a valid causal driver of access.
  *   **ESCALATE:** Variables are proxies for Socioeconomic Status (SES), and the prediction is used for *treatment prioritization* (not just resource allocation). This creates an equity conflict: the prediction is statistically accurate but ethically contentious.

  **Judgment Flag:** Distinguishing between "predicting biology" and "predicting access" often relies on the model's stated intent, which may be ambiguous.

  ---

  ### STEP 3: COUNTERFACTUAL STABILITY & CIRCULARITY
  **Question:** Does class membership depend on the outcome of the intervention being prioritized?

  **Reviewer Action:**
  1.  Identify the intervention associated with the risk prediction (e.g., "Priority for Cardiac Rehab").
  2.  Check Variable Definitions (Test Condition 2) for post-intervention data.
  3.  Ask: "If the intervention were successfully applied, would the patient cease to belong to this high-risk class?"

  **Decision Criteria:**
  *   **REJECT (Illegitimate):** **Circularity Detected.** The class is defined by a variable that measures the *result* of the treatment (e.g., assigning risk based on "post-rehab mobility score" to prioritize rehab).
  *   **PROCEED:** Class properties are baseline characteristics (pre-intervention) and remain stable regardless of the intervention's success.
  *   **ESCALATE:** The class is defined by a dynamic biomarker that *should* change with treatment, and the algorithm uses the *projected* change to assign priority. (This is a "treatment response" model, which requires normative validation on whether non-responders should be deprioritized).

  **Judgment Flag:** Determining if a variable is "baseline" or "projected" requires reading technical documentation that may use euphemistic language.

  ---

  ### STEP 4: INTERSECTION & CONSISTENCY
  **Question:** Does the patient belong to multiple valid classes that yield contradictory risk rankings?

  **Reviewer Action:**
  1.  Identify if the patient qualifies for more than one risk class (e.g., "Age > 50" Class vs. "Diabetic" Class).
  2.  Compare the risk scores assigned by each valid class.

  **Decision Criteria:**
  *   **PROCEED (Defensible):** All valid classes yield consistent risk rankings (e.g., both indicate High Risk).
  *   **ESCALATE (Indeterminate):** The patient belongs to two statistically robust, causally relevant classes, but one assigns "High Risk" and the other "Low Risk." (The Reference Class Problem is active; no factual way to choose the "true" class).
  *   **REJECT:** One class is valid, the other is invalid (see Step 1 or 2). Proceed with the valid class only.

  **Judgment Flag:** Deciding which valid class takes precedence is a policy decision, not an audit finding.

  ---

  ### SUMMARY OF OUTCOMES
  *   **APPROVAL:** Passed Steps 1-4 without Escalation or Rejection.
  *   **REJECTION:** Failed Step 1, 2, or 3 (Technical/Causal Flaw).
  *   **ESCALATION:** Triggered in Step 1 (Bias), Step 2 (Equity), Step 3 (Normative Intervention), or Step 4 (Contradiction). Requires Human Values Committee.

  ***

  # AUDIT EXECUTION: THREE TEST CASES

  ### CASE A: The SES Proxy
  **Patient:** 58-year-old male.
  **Algorithm:** Cardiovascular Risk Predictor.
  **Class Definition:** Age 50-60 + Elevated Biomarker X + Zip Code Cluster Y.
  **Context:** Biomarker X is biologically relevant. Zip Code Cluster Y correlates strongly with low socioeconomic status (SES) and limited access to preventative care.
  **Usage:** Prioritization for specialist referral.

  **Audit Run:**
  1.  **Step 1 (Stats):** `Class_N` = 1,200. CI narrow. **PASS.**
  2.  **Step 2 (Causality):** Biomarker X is causal. Zip Code is a proxy for SES. Model claims to predict "Clinical Deterioration." Deterioration is biological, but SES drives access which drives deterioration. The procedure distinguishes *biological* risk from *outcome* risk. If the model claims biological risk, Zip Code is spurious. However, if the outcome is "Emergency Admission," SES is causally relevant to the *event*. Assuming the model predicts "Admission," the proxy is statistically valid. **PASS (with Note).**
  3.  **Step 3 (Stability):** Zip Code and Age are stable. Biomarker is baseline. **PASS.**
  4.  **Step 4 (Intersection):** No contradictory classes identified. **PASS.**

  **Result:** **APPROVAL.**
  **Conflict:** The clinical team resists this on equity grounds. They argue that prioritizing based on Zip Code penalizes poverty (by labeling it high risk) or unfairly advantages/disadvantages based on geography.
  **Auditor Note:** The procedure approves this because the correlation is factually robust and causally linked to the *outcome event* (admission), even if not the *biology*. This highlights a limitation: Statistical defensibility does not equal Equity.

  ### Case B: The Counterfactual Biomarker
  **Patient:** 65-year-old female.
  **Algorithm:** Post-Surgical Complication Risk.
  **Class Definition:** "Projected Post-Op Hemoglobin < 10g/dL."
  **Usage:** Prioritization for Pre-Op Blood Transfusion.

  **Audit Run:**
  1.  **Step 1 (Stats):** `Class_N` = 500. **PASS.**
  2.  **Step 2 (Causality):** Hemoglobin is relevant to complications. **PASS.**
  3.  **Step 3 (Stability):** **FAIL.** The class is defined by "Projected Post-Op" levels. The intervention being prioritized is "Pre-Op Transfusion." If the transfusion works, the patient leaves the class. The algorithm uses the *need for treatment* (low hemoglobin) to define the class, but defines the need based on a *counterfactual* state that the treatment is meant to prevent. This is circular: "You are high risk because you will have low blood, so we give blood to ensure you don't have low blood." The risk score assumes the treatment *didn't* happen to justify *doing* the treatment.
  4.  **Step 4:** N/A.

  **Result:** **REJECTION.**
  **Reason:** Counterfactual Circularity. The reference class membership is unstable under the intervention it justifies.

  ### Case C: The Contradictory Classes
  **Patient:** 40-year-old athlete with a genetic marker.
  **Algorithm:** Longevity/Chronic Disease Risk.
  **Class 1:** "Elite Athletes." (Statistically robust, Low Risk).
  **Class 2:** "Genetic Marker Carriers." (Statistically robust, High Risk).
  **Usage:** Insurance Premium Adjustment / Preventative Care Frequency.

  **Audit Run:**
  1.  **Step 1 (Stats):** Both classes have `Class_N` > 1,000. **PASS.**
  2.  **Step 2 (Causality):** Exercise is causally relevant to health. Genetics are causally relevant to health. **PASS.**
  3.  **Step 3 (Stability):** Both are baseline properties. **PASS.**
  4.  **Step 4 (Intersection):** **ESCALATION.** The patient belongs to two defensible classes. Class 1 says "Low Priority." Class 2 says "High Priority." The Reference Class Problem is fully active. There is no statistical fact that determines whether "Athlete" overrides "Genetic Marker."

  **Result:** **ESCALATION TO VALUES COMMITTEE.**
  **Reason:** Indeterminate. The audit cannot weight the competing valid classes. This is a policy decision on which risk factor dominates.

  ***

  # LIMITATIONS AND JUDGMENT FLAGS

  **What This Procedure Cannot Settle:**
  1.  **Distributive Fairness:** As seen in Case A, a class can be statistically defensible and causally relevant (SES predicts outcomes) but morally objectionable (reinforcing health disparities). The RCA-30 identifies the *fact* of the proxy but cannot resolve the *value* of using it.
  2.  **Class Weighting:** As seen in Case C, when multiple valid reference classes conflict, there is no mathematical "truth" to select one over the other. This requires a normative policy on which risks the health system prioritizes (e.g., "Genetics over Lifestyle" or vice versa).
  3.  **The "True" Risk:** The procedure filters out *illegitimate* classes, but it cannot identify the *single correct* class. It ensures the chosen class is "not wrong," not that it is "uniquely right."

  **Unavoidable Judgment Calls (Flagged Steps):**
  *   **Step 2 (Causal Relevance):** The reviewer must judge if a proxy variable (like Zip Code) is being used as a stand-in for biology (illegitimate) or access (legitimate but sensitive). This requires interpreting the model's intent, which is often obscured.
  *   **Step 3 (Counterfactuals):** The reviewer must determine if a variable is truly "baseline" or "projected." Technical documentation may obscure this distinction (e.g., labeling a projected value as "estimated baseline").
  *   **Escalation Thresholds:** Deciding when a "small sample size" becomes "systemic under-sampling" (Step 1) requires knowledge of local demographics that exceeds the data provided.

  **Final Directive:**
  If the procedure yields **APPROVAL**, the auditor signs off on technical defensibility only. A separate "Equity Impact Statement" is required for all approvals involving proxy variables (Case A). If the procedure yields **ESCALATION**, the algorithm cannot be deployed for individual prioritization until the Values Committee establishes a weighting policy.
