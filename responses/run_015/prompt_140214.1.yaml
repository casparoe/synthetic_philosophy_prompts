prompt: |-
  I've ended up with a position on the special composition question that I can't find a proper name for, so here's my own stab at it: there's no mind-independent fact of the matter about when some things compose something — 'compose' gets its content from which composition and existence claims our practice lets us assert truly, subject to two side-constraints. First, the mereology isn't up for negotiation: parthood stays transitive, fusions stay unique, no funny business with the axioms. Second, whatever ontology comes out has to be one a fully informed version of us could go on using without having to rewrite the rest of what we believe. So the SCQ gets dissolved rather than answered, but it isn't anything-goes — most of the usual candidate answers still get ruled out, and I think that's why it still feels like a real position.

  What would count against it? I want defeaters ranked from fatal to merely awkward, and these are the four I'm least sure about: (i) can the view even state itself without cheating, given that it seems to need a quantifier whose meaning is already settled; (ii) can it make sense of two competent people — one who thinks any old collection of things automatically makes a further thing, one who thinks things compose only when they're organised into a single living thing — as genuinely disagreeing rather than just talking past each other; (iii) does buying 'ontology comes cheap' here commit me to it everywhere, so that every existence question collapses into a question about our sentences; (iv) does it predict sharp boundaries where there plainly seem to be vague ones — clouds, mountains, a ship rebuilt plank by plank while still at sea. For each, give the strongest version you can and then the reply a defender would actually give, not a strawman.

  Be honest too about whether I've definately gerrymandred the thing into a position nothing could touch, and whether that's a problem for a view of this kind or just what a good dissolution looks like. And say whether it predicts anything its rivals don't, or whether it's purely on the defensive. I'm most likely to be moved by something showing it can't describe a case it ought to be able to describe — objections that just restate the intuition I started out trying to explain away won't do much for me. No reading lists or citations please; I know the standard names, I want the arguments.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Position:**
      *   **Core Claim:** There is no mind-independent fact of the matter about composition (anti-realism/conventionalism about composition).
      *   **Constraint 1 (Formal):** Classical mereology holds (transitivity, uniqueness of fusions, etc.). The *logic* of parthood is fixed.
      *   **Constraint 2 (Pragmatic/Coherence):** The ontology must be usable by a fully informed version of us without rewriting the rest of our beliefs (coherence with practice/science).
      *   **Status:** Dissolves the Special Composition Question (SCQ) rather than answering it. Not "anything goes" (rules out extreme nihilism/universalism if they violate Constraint 2).
      *   **Goal:** Wants defeaters ranked (fatal to awkward) for four specific objections (i-iv). Wants honesty about gerrymandering/stability. Wants to know if it predicts anything or is purely defensive. No citations/reading lists.

  2.  **Deconstruct the Four Objections:**

      *   **(i) Self-Reference/Quantifier Stability:** Can the view state itself without assuming the very quantifier meaning it claims is unsettled?
          *   *Strongest Version:* To say "there is no fact of the matter about existence," you must quantify over facts/things. If 'exists' is unsettled, the statement itself lacks truth conditions. It's performative contradiction.
          *   *Defender's Reply:* Distinguish between the *general* quantifier (logic) and *specific* existence claims (ontology). The view uses a deflated or generic 'exists' to make the meta-claim, while object-level existence is practice-relative. Or, use a supervaluationist framework.

      *   **(ii) Disagreement:** Can it account for genuine disagreement between a Universalist and an Organicism advocate?
          *   *Strongest Version:* If composition is practice-relative, the Universalist is speaking true-in-their-practice and the Organicist true-in-theirs. They aren contradicting each other. This makes deep metaphysical debates merely verbal.
          *   *Defender's Reply:* They are disagreeing about *which practice is best*, not about the world directly. It's a normative disagreement about conceptual engineering, not a descriptive one about mind-independent joints. The "error" is in thinking the dispute is metaphysical rather than pragmatic.

      *   **(iii) Ontological Inflation/Cheapness:** Does "ontology comes cheap" here commit you to it everywhere (e.g., ethics, modality)?
          *   *Strongest Version:* If existence is just about assertibility conditions in a practice, then *any* domain (numbers, morals, witches) becomes cheap. You lose the ability to say "witches don't exist" in a robust sense.
          *   *Defender's Reply:* Constraint 2 (coherence with fully informed belief) does the heavy lifting. Witch-talk fails Constraint 2 (science rules it out). Math-talk passes. So it's not "anything goes," it's "what survives ideal inquiry." It doesn't collapse *all* existence questions, just the *composition* ones where the world underdetermines the answer.

      *   **(iv) Vagueness vs. Sharp Boundaries:** Classical mereology + determinate truth conditions implies sharp boundaries. But clouds/heaps seem vague.
          *   *Strongest Version:* If composition is settled by practice, and practice uses classical logic, then there *is* a fact of the matter (relative to practice) about whether a specific atom is part of a cloud. This eliminates ontic vagueness, which seems wrong for clouds.
          *   *Defender's Reply:* Accept semantic vagueness, reject ontic vagueness. The *practice* itself employs vague predicates. The "fact of the matter" is only as sharp as the linguistic norms we've adopted. We haven't adopted norms that decide the edge cases, so there's no truth value there, not even relative to practice. (Supervaluationism within the practice).

  3.  **Evaluate the "Gerrymandering" Charge:**
      *   Is the view too insulated? It fixes the logic (Constraint 1) to avoid paradox, and fixes the practice (Constraint 2) to avoid absurdity.
      *   *Honesty Check:* It looks like a sophisticated version of Carnapian internal/external questions or Hirsch's quantifier variance, but with a "fully informed practice" constraint to avoid relativism.
      *   *Risk:* It might be stable but inert. If it predicts nothing, is it a theory or a stance?
      *   *Prediction:* It predicts that SCQ debates will never be resolved by empirical discovery, only by pragmatic shift. Rivals (Nihilists/Universalists) predict one side is *right* about the world.

  4.  **Drafting the Response (Iterative refinement):**

      *   *Tone:* Philosophical peer-to-peer. Rigorous, no fluff, no citations.
      *   *Structure:*
          1.  Assessment of the view (Naming it, stability check).
          2.  The Four Defeaters (Strongest version + Defender's Reply).
          3.  Ranking the Defeaters.
          4.  Predictive Power vs. Defensive Posture.
          5.  Final Verdict on Gerrymandering.

      *   *Refining Objection (i):* The "Quantifier Variance" problem. If 'there exists' varies, how do you state the variance?
          *   *Reply:* Use a neutral meta-language or treat 'exists' as ambiguous. The view is a claim about *concepts*, not a claim using the contested concept in its contested sense.

      *   *Refining Objection (ii):* The "Talking Past" problem.
          *   *Reply:* Distinguish first-order disagreement (is there a table?) from second-order disagreement (should we count tables?). The latter is real.

      *   *Refining Objection (iii):* The "Witches" problem.
          *   *Reply:* Emphasize Constraint 2. Witches fail the "fully informed" test. Tables pass. This distinguishes it from radical constructivism.

      *   *Refining Objection (iv):* The "Vagueness" problem.
          *   *Reply:* Classical mereology doesn't force sharp boundaries on *natural language* terms, only on the *parthood relation* once defined. If the practice leaves 'cloud' vague, the mereology applies to the precisifications, not the fuzzy term directly.

      *   *Ranking:* (i) is potentially fatal (self-statement). (iii) is dangerous (collapse). (ii) is manageable (reframing disagreement). (iv) is technical (vagueness handling).
      *   *Actually, looking closer:* (i) is the standard attack on quantifier variance. (iii) is the "ontological free lunch" attack. (ii) is the "normativity" attack. (iv) is the "logic" attack.
      *   *Re-evaluating Fatality:* (i) is the hardest to dodge without looking like you're changing the subject. (iii) is dangerous but Constraint 2 seems to block it. (ii) is just uncomfortable, not fatal. (iv) is solvable with semantic vagueness.
      *   *Let's rank:* (i) Fatal/Major. (iii) Major. (ii) Moderate. (iv) Minor/Awkward.

      *   *Gerrymandering:* It *is* gerrymandered, but that's the point of a dissolution. The risk is emptiness.
      *   *Prediction:* It predicts the *persistence* of the debate without resolution.

  5.  **Final Polish:** Ensure the distinction between "mind-independent fact" and "practice-relative truth" is clear. Ensure Constraint 1 (Classical Mereology) doesn't clash with Constraint 2 (Practice). (e.g., Does practice actually use classical mereology? Maybe not. This is a tension point). *Self-Correction:* The user *stipulates* classical mereology. The objection could be that practice *doesn't* follow classical mereology. I should mention that in the "Gerrymandering" section.

      *Wait, one nuance on (i):* If the view says "there is no fact of the matter," it asserts a negative existential claim about facts. If 'fact' is also practice-relative, the claim is weak. If 'fact' is robust, the claim contradicts the spirit. I need to press this hard.

      *Wait, one nuance on (iv):* If mereology is classical, fusions are unique. If I have atoms A, B, C. Is there a fusion? Classical says yes. Practice says maybe not. If Practice says no, but Logic says yes, there's a conflict. The user says "mereology isn't up for negotiation." This means the *logic* is fixed, but the *domain* is determined by practice. So Practice decides which atoms are in the domain. This needs to be clear in the reply to (iv).

