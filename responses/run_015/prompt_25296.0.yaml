      *   *Q4:* The "Kind" Question. Is a speck just "small torture" or something else? (Tests Qualitative vs. Quantitative).
      *   *Q5:* The "Reality" Question. Does the impossibility of the number matter? (Tests Ideal Theory vs. Non-Ideal Theory).

  5.  **Mapping the Leaves (Outcomes):**
      *   *The Aggregator:* Specks win. (Utilitarian).
