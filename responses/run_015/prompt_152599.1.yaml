  # Q&A Prep Sheet: Moral Equality as Broken Symmetry

  ### Upfront Concession (Say this in your opening remarks)
  "I want to be clear before we begin: I am not claiming that physics dictates morality, nor that soldiers are particles. Statistical mechanics here is a structural analogy for informational constraints and error propagation, not an ontological reduction. If the model doesn't yield normative traction beyond what standard moral reasoning provides, it should be discarded."

  ---

  ### Objections & Replies

  **1. The Naturalistic Fallacy (The "Is-Ought" Problem)**
  *Question:* "It seems you're deriving a normative conclusion—the unequal moral status of combatants—from a descriptive model of entropy. Even if unjust wars are 'irreversible processes,' how does that tell us what soldiers *ought* to do? You're smuggling an 'ought' out of an 'is.'"
  *Reply:* "I'm not deriving the norm from the physics; I'm using the physics to map the constraints under which moral reasoning operates. The normative claim—that *jus ad bellum* matters—comes from ethics. The physics simply demonstrates that treating unjust combatants as symmetrical ignores the informational cost of correcting error once the system is in motion. The 'ought' remains ethical; the 'is' shows why the symmetry assumption is empirically unstable."
  *[Flag: Soft spot. You are still relying on the analogy to do heavy lifting. If they press on why informational cost equals moral weight, you risk circularity.]*

  **2. Elimination of Moral Agency**
  *Question:* "Particles don't choose; soldiers do. By modeling combatants as nodes in a dissipative structure, aren't you stripping them of the agency required for moral responsibility? You sound like a determinist."
  *Reply:* "Not determinist, but constrained. Agents make choices, but those choices are bound by informational asymmetry and path dependence. A soldier choosing to fight in an unjust war is like a molecule choosing a path in a gradient—the choice exists, but the probability distribution is skewed by the system's state. I'm arguing agency operates within a thermodynamic-like landscape, not that agency is absent."
  *[Flag: Dodges the freedom issue. Philosophers will worry you're reducing responsibility to probability.]*

  **3. Collapsing *Jus In Bello* and *Jus Ad Bellum***
  *Question:* "Walzer separates these for a reason: to protect soldiers who follow the rules of engagement even if their cause is bad. If you collapse this distinction, don't you risk delegitimizing POW rights and making surrender impossible?"
  *Reply:* "My aim isn't to remove protections, but to ground them differently. If unjust combatants are part of an error-amplifying structure, protecting them becomes a way of dampening that dissipation, not honoring symmetry. We protect them not because they are moral equals, but because treating them as such reduces overall systemic violence."
  *[Flag: Risky. You're arguing for the same outcome via a different route. If they think your route undermines the principle, you lose.]*

  **4. Historical Strawman (Walzer isn't Newtonian)**
  *Question:* "You claim Walzer relies on a Newtonian action-reaction picture. But Walzer's argument is based on social contract and coercion, not mechanics. Aren't you attacking a physics caricature of a philosophical argument?"
  *Reply:* "Walzer relies on a symmetry of risk and coercion that functions *like* action-reaction pairs—equal liability because equal vulnerability. Whether he uses the word 'Newtonian' or not, the logical structure assumes a reversible symmetry of status. I'm arguing that structure fails when you account for the irreversible information loss inherent in initiating unjust force."
  *[Flag: Interpretive stretch. Historians in the room may disagree with your reading of Walzer's genealogy.]*

  **5. Metaphor vs. Mechanism**
  *Question:* "Is this actually a theory, or just a metaphor? If 'entropy' just means 'moral confusion,' you've added jargon without adding clarity. What work is the physics doing that 'epistemic limitation' couldn't do alone?"
  *Reply:* "It predicts degradation. 'Epistemic limitation' is static; 'entropy' implies a directional flow toward disorder that requires energy to reverse. The physics model highlights that correcting an unjust war isn't just about gaining knowledge; it's about overcoming a systemic momentum that standard ethics overlooks."
  *[Flag: Hard to prove. You need to show a specific prediction that standard ethics misses.]*

  **6. Epistemic Access (The "Good Faith" Soldier)**
  *Question:* "Most soldiers don't know their cause is unjust. If the symmetry breaks based on the objective justice of the cause, aren't you punishing agents for facts they couldn't access?"
  *Reply:* "The model accounts for this via information asymmetry. The 'broken symmetry' isn't about individual guilt, but systemic position. The unjust combatant is in a high-entropy state regardless of personal belief. This shifts the focus from individual blame to structural liability."
  *[Flag: Concedes the epistemic point but shifts to structuralism. Some will find this unsatisfying for individual morality.]*

  **7. Terminological Precision (Entropy vs. Disorder)**
  *Question:* "Entropy isn't moral disorder; it's energy dispersal. Using it this way seems like category confusion. Are you actually using the mathematical definition, or just the pop-science version?"
  *Reply:* "I'm using the informational definition (Shannon entropy), not just thermal. It measures the loss of distinguishable states in a system. When a war is unjust, the signal-to-noise ratio in command structures degrades. It's a precise analogy regarding information loss, not a vague appeal to 'chaos.'"
  *[Flag: Semantic defense. If they don't buy information theory as applicable to ethics, the point fails.]*

  **8. The "Prayer" Question (Thermal Death)**
  *Question:* "If unjust combatants are 'heat' and just combatants are 'work,' does that imply thermal equilibrium is a moral good? Are you suggesting the moral ideal is the heat death of the universe?"
  *Reply:* "No, that's a category error I explicitly warn against. The model describes the *process* of conflict, not the telos of existence. We aren't mapping cosmology to ethics; we're mapping constraint structures. Unjust wars dissipate value; that doesn't mean universal dissipation is the goal."
  *[Flag: Defensive. This is the reductio. Keep your cool and don't let them make you look like a crank.]*

  ---

  Concede the ontological limit of the physics early to secure credibility, then defend the structural analogy as a tool for clarifying informational constraints rather than dictating moral norms.
