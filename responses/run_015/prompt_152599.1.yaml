  I'm a retired physicist who got into philosophy late in life, so I still think in terms of symetry and irreversable processes. Next Tuesday I'm giving a seminar titled "Moral Equality as Broken Symmetry: Bringing Statistical Mechanics into Just War Theory" to a room of analytic moral philosophers plus a couple historians of political thought. My thesis is that the standard argument for moral equality of combatants — that soldiers on both sides are symetric agents because neither controls the justice of the cause — secretly relies on a Newtonian action-reaction picture. Once you model the decision to enter combat as an irreversible, information-asymmetric process (more like entropy increase than mechanics), the symmetry collapses: unjust combatants aren't mirror-images of just ones, they're nodes in a dissipative structure that amplifies error, which means jus in bello can't be fully separated from jus ad bellum the way Walzer wants.

  The audience is skeptical of science metaphors in ethics and will think I'm just dressing up old revisionism in jargon. They care about conceptual clarity, whether I'm ignoring the distinction between combatant and noncombatant, and if I'm smuggling normative conclusions out of descriptive physics. Draft my Q&A prep sheet: about eight objections I'll actually face, ordered from most damaging to least, phrased exactly like a tired analytic philosopher or a historian of ideas would say them. For each, give me a short reply (two minutes max) and flag where it's soft or dodges. Include the question I'm praying nobody asks — probably something about whether unjust soldiers are "heat" and just soldiers are "work," or whether this implies thermal death is a moral good. Also tell me what I should concede right up front so they dont write me off as a crank.

  Write the response in American English. Finish with a one-sentence summary of the prep strategy on its own line at the very end.
