  **MEMORANDUM**

  **TO:** Regional Flood Authority Board
  **FROM:** Technical Adviser, Decision Theory
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation on Ex Ante Decision Rule and Tuesday Storm Operations

  **Bottom Line Up Front**
  I recommend the Board adopt Option (iii): a rank-dependent, risk-weighted decision rule. This rule minimizes expected loss but adjusts probabilities to reflect the disproportionate public burden of catastrophic outcomes. Under this rule, the operational decision for Tuesday is to **open the auxiliary spillway**. This action incurs a certain property loss to Willow Creek to avoid a low-probability catastrophic loss to the downstream city. The decision must be executed by Tuesday at noon.

  **Operational Decision Rule**
  To ensure staff can apply this rule without further judgment, the resolution should specify the following calculation for any protective action:

  1.  **Identify Outcomes:** List all possible flood scenarios (e.g., "Spillway Open," "Spillway Closed/No Crest," "Spillway Closed/Crest").
  2.  **Quantify Consequences:** For each scenario, estimate property damage and expected fatalities. [Flag: Property damage figures and fatality estimates require certification by the Chief Hydrologist and County Coroner before inclusion in a final resolution.]
  3.  **Monetize Losses:** Convert fatalities to monetary equivalents using the Value of a Statistical Life (VSL). [Flag: The $12 million VSL is a placeholder requiring actuarial validation.]
  4.  **Apply Decision Weights:** Instead of using raw probabilities, apply a weighting function to the cumulative probability of losses exceeding specific thresholds. For this resolution, we adopt a weighting parameter where probabilities below 5% are treated as no less than double their numeric value for calculation purposes.
  5.  **Select Action:** Choose the action with the lowest weighted expected loss.

  **Arithmetic for the Pending Storm**
  We must compare the certain loss of opening the spillway against the risk-weighted loss of keeping it closed.

  *   **Option A (Open Spillway):**
      *   Outcome: Certain flood of Willow Creek.
      *   Loss: $230 million [Flag: Engineering estimate].
      *   Fatalities: 0.
      *   **Total Weighted Loss: $230 million.**

  *   **Option B (Do Not Open):**
      *   Outcome 1 (96% chance): No flood. Loss $0.
      *   Outcome 2 (4% chance): City flood. Loss $2.4 billion property + 40 fatalities.
      *   Fatality Cost: 40 × $12 million = $480 million.
      *   Total Catastrophic Loss: $2.88 billion.
      *   *Standard Expected Loss:* 0.04 × $2.88 billion = $115.2 million.
      *   *Risk-Weighted Loss:* Under our recommended rule, the 4% probability carries a decision weight of approximately 8% (reflecting catastrophe aversion).
      *   Calculation: 0.08 × $2.88 billion = $230.4 million.
      *   **Total Weighted Loss: ~$230.4 million.**

  Under standard expected-loss minimization (Option i), we would not open the spillway ($115.2M < $230M). Under the recommended risk-weighted rule (Option iii), the weighted risk ($230.4M) exceeds the certain cost ($230M), mandating that we open the spillway. This aligns with the Board's ethical intuition without abandoning quantitative rigor.

  **Distinguishing Concave Valuation from Rank-Weighting**
  The Board must understand which logic it is codifying, as they can diverge. Consider this constructed pair of choices:
  *   **Choice 1:** A certain loss of $10 million.
  *   **Choice 2:** A 0.1% chance of a $10 billion loss, otherwise $0.
  Both have an expected loss of $10 million.
  *   **Concave Valuation (Option ii):** This rule values money such that each additional dollar lost hurts more than the previous one. It would strongly prefer Choice 1, because the severity of a $10 billion loss is vastly worse than 1,000 times the pain of a $10 million loss.
  *   **Rank-Weighting (Option iii):** This rule adjusts weights based on probability ranking. If our weighting function treats a 0.1% probability as negligible (decision weight near zero), it would prefer Choice 2, effectively ignoring the tail risk.

  By recommending Option (iii), we are committing to the view that low-probability events must be *overweighted*, not ignored. However, you must specify the weighting function parameters carefully. If you prefer to avoid catastrophe purely because of the *magnitude* regardless of probability perception, Option (ii) is more stable. I recommend (iii) because it explicitly captures the "low-probability worst case" concern raised in the agenda.

  **Capital Program Implications**
  Next year's capital program presents two alternatives with equal expected annual loss reduction ($18 million): one reduces frequent small events, the other eliminates a 0.6% chance of a $3 billion event.
  *   **Under Expected Loss (Option i):** These projects are equivalent.
  *   **Under Risk-Weighting (Option iii):** These projects are **not** equivalent. The rule will prioritize eliminating the 0.6% catastrophic risk.
  If the Board adopts this rule, you must inform the city planning commission that our assurance of safety is predicated on this specific investment. If you fund the diffuse small events instead, the risk-weighted safety margin for the city disappears, potentially invalidating permissions for the 1,200 new housing units.

  **Addressing the Losing Side: Dynamic Consistency and Equity**
  The strongest argument against this recommendation comes from the principle of dynamic consistency and equity. If we adopt a rule that opens the spillway on 4% forecasts, Willow Creek will flood roughly once every 25 years, while the city never floods. Over a century, this amounts to a deliberate policy of sacrificing Willow Creek to protect the city. No Board member would likely approve a package deal that explicitly trades Willow Creek's property every generation for city safety.

  This is not a mathematical error; it is a distributional choice. A risk-weighted rule is not neutral; it favors the population facing catastrophic risk over the population facing certain moderate risk. If the Board adopts this rule, it must simultaneously establish a compensation mechanism for Willow Creek residents. You cannot claim the decision is purely technical while imposing asymmetric burdens. The rule implies that Willow Creek bears the operational risk; justice requires they share in the mitigation benefits.

  **Statement for Willow Creek Residents**
  "We know that no amount of calculation can make losing your home acceptable. Today, we chose to open the spillway not because the numbers were easy, but because the alternative risked lives we cannot afford to lose. We understand that this decision places a heavy burden on you to protect the wider region. That burden is not yours to bear alone. This Authority is committed to full compensation for your losses and immediate investment in measures to ensure Willow Creek is not the only line of defense in the future. We are sorry for the damage, and we are accountable for the recovery."
