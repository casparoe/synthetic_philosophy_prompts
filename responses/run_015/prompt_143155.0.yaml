          *   The narrator's tone is defensive. A true "best world" wouldn't need this much explaining.
          *   Leibniz assumes a God's-eye view. Omelas forces a human-eye view. The "gap" is between *justification* and *habitation*.
          *   The "walking away" implies that logical consistency isn't enough for ethical life.

