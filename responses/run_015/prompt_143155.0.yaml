      *   **Key Questions to Address:**
          1.  Does Leibniz's machinery (compossibility, maximal variety/order vs. happiness) allow Omelas to be the "best of all possible worlds"?
          2.  Does universal *knowledge* of the suffering change the metaphysical/moral calculus (complicity vs. compensation)?
          3.  What is the function of those who walk away? (Refutation of optimism or acknowledgement?)
