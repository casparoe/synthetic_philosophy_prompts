answer: |-
  ### ECL-Scan Decision Procedure (Version 1.0)

  **Purpose:** To evaluate cooperative agreements across domain clusters using evidential cooperation logic.
  **Time Allocation:** 20 Minutes.
  **Analyst Instructions:** Answer each step sequentially. If a "Stop" or "Handoff" condition is met, terminate the procedure immediately and file the corresponding recommendation.

  **Step 1: Cluster Validation**
  *   **Question:** Is the proposing region formally assigned to a pre-validated domain cluster with at least 50 participating members?
  *   **Sufficient Answer to Proceed:** Yes (Cluster ID verified in central registry).
  *   **Stop Condition:** No. (Recommendation: Reject. There is no evidential basis for cooperation outside a defined cluster.)
  *   **Handoff Condition:** N/A.

  **Step 2: Symmetry-Break Check**
  *   **Question:** Do the region's key structural variables (GDP per capita, industrial mix, governance capacity, labor market conditions) deviate by more than 15% from the cluster mean?
  *   **Sufficient Answer to Proceed:** No (Deviation is within the 15% tolerance band).
  *   **Stop Condition:** Yes (Deviation exceeds 15%). (Recommendation: Reject. The evidential link collapses; local action does not evidence analogous action elsewhere.)
  *   **Handoff Condition:** N/A.

  **Step 3: Decision Problem Identity**
  *   **Question:** Is the choice architecture (available options, enforcement mechanisms, timeline) identical across the cluster?
  *   **Sufficient Answer to Proceed:** Yes (Verified via standard agreement template).
  *   **Stop Condition:** No. (Recommendation: Reject. Dissimilar decision problems break the logical symmetry required for evidential reasoning.)
  *   **Handoff Condition:** N/A.

  **Step 4: Local Cost and Value Threshold**
  *   **Question:** Do the projected local economic costs exceed statutory risk tolerances or require waiving protected labor welfare standards?
  *   **Sufficient Answer to Proceed:** No (Costs are within mandated limits).
  *   **Stop Condition:** Yes, clear violation. (Recommendation: Reject. Local statutory constraints prohibit the agreement.)
  *   **Handoff Condition:** Yes, ambiguous violation or requires ethical waiver. (Recommendation: Mandatory Handoff to Board. This is a value judgment regarding acceptable sacrifice, not a factual determination.)

  ***

  ### Limitations of Procedure

  Analysts must note the following constraints in their final report. This procedure **cannot**:
  1.  Identify the threshold at which evidential weight becomes strong enough to override local cost without prior empirical calibration.
  2.  Distinguish genuinely analogous agents from merely similar-looking ones without prior empirical calibration.

  ***

  ### Application to Proposals

  **Proposal A: Binding Carbon-Cap Agreement**
  *   **Context:** Cluster of >100 structurally similar industrial regions.
  *   **Procedure Execution:**
      *   Step 1: Pass (Validated cluster).
      *   Step 2: Pass (Structurally similar).
      *   Step 3: Pass (Binding cap is standard template).
      *   Step 4: Pass (Costs within statutory limits).
  *   **Outcome:** Proceed with Cooperation.
  *   **Analysis:** All evidential conditions are met. The symmetry suggests that committing here provides strong evidence of commitment elsewhere, justifying the local cost.

  **Proposal B: Unilateral Green Technology Subsidy**
  *   **Context:** Region whose economic structure has no close analog elsewhere in the cluster.
  *   **Procedure Execution:**
      *   Step 1: Pass (Validated cluster).
      *   Step 2: **Fail.** (Economic structure deviation exceeds 15% tolerance).
  *   **Outcome:** Stop. Recommendation Against Cooperation.
  *   **Analysis:** The symmetry-break check detects that this region is an outlier. Committing here provides no statistical evidence that analogous agents will commit, because there are no analogous agents. The subsidy becomes a pure local cost with no evidential return.

  **Proposal C: Cooperative Emission-Reduction Pact**
  *   **Context:** Prevents severe global harm but imposes catastrophic local economic costs; local labor-market conditions differ markedly from the cluster mean.
  *   **Procedure Execution:**
      *   Step 1: Pass (Validated cluster).
      *   Step 2: **Fail.** (Labor-market conditions differ markedly, triggering the >15% deviation threshold).
  *   **Outcome:** Stop. Recommendation Against Cooperation.
  *   **Analysis:** This yields an answer the Board will find unwelcome. The procedure mandates rejecting an agreement that prevents severe global harm. Because the symmetry-break check fails, the evidential link collapses. The procedure treats the agreement as a unilateral sacrifice: the region bears catastrophic costs without the evidential guarantee that other regions will follow suit. Without the symmetry condition, the rational choice under this framework is to preserve the local economy, even at the expense of the global good.

  ***

  ### Limitations Statement

  This procedure operates strictly on factual symmetry and predefined thresholds. It cannot identify the threshold at which evidential weight becomes strong enough to override local cost, nor can it distinguish genuinely analogous agents from merely similar-looking ones without prior empirical calibration. When these facts are unavailable or ambiguous, the procedure defers to the Board.

  Verdict: The procedure necessarily collapses into a non-evidential value judgment when determining the threshold at which evidential weight becomes strong enough to override local cost.
