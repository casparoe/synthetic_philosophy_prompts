      *   **Definition:** "Clinamen" = a small, discipline-internal swerve (instrument, notation, calibration, error-correcting routine) by which a field corrects its own course without external reflection.
      *   **Format:**
          *   British English.
          *   Exactly five numbered readings.
          *   Each reading at most three sentences.
          *   No introduction or conclusion.
          *   Each reading must state the thesis, classify it (trivial, substantive and defensible, or false), and state whether it supports using the slogan to close down discussion (like the ornithology line).
          *   The fifth item must do double duty: set out the most plausible reading (division-of-labour claim) AND add one sentence saying what would most change the verdict about the whole menu and where reasoning is likeliest to fail.

  2.  **Deconstruct the Slogan:**
      *   "If a science has a clinamen, it has already got all the philosophy it needs."
      *   Core implication: Internal corrective mechanisms (clinamen) substitute for external philosophical reflection.
      *   Goal: To match or beat the "ornithology" gibe in dismissing philosophy of science.

  3.  **Drafting the Five Readings:**

      *   *Reading 1 (Trivial/Definitional):* Focus on the definition of philosophy. If philosophy just means "thinking about how to do science," and clinamen is "thinking about how to do science," then it's tautological.
          *   Thesis: This reading claims that 'philosophy' simply names the reflective practice inherent in any successful methodological adjustment.
          *   Classification: Trivial.
          *   Closing power: No, because it redefines philosophy rather than dismissing it.

      *   *Reading 2 (False/Strong):* Internal mechanisms are sufficient for *all* philosophical questions.
          *   Thesis: Here, the slogan asserts that internal error-correction completely obviates the need for any external conceptual analysis regarding foundations or ethics.
          *   Classification: False.
          *   Closing power: Yes, but it is easily rebutted by historical cases where internal mechanisms failed due to conceptual blindness.

      *   *Reading 3 (Substantive/Defensible - Pragmatic):* Internal mechanisms are sufficient for *normal* progress.
          *   Thesis: This view holds that routine conceptual problems are solved by instrumental tweaks, making external theory redundant for day-to-day research.
          *   Classification: Substantive and defensible.
          *   Closing power: Yes, for routine contexts, though it leaves room for crises.

      *   *Reading 4 (Substantive/Defensible - Historical):* Philosophy only comes after the fact.
          *   Thesis: On this account, philosophical rationalisation is merely a post-hoc narration of shifts already achieved by technical clinamina.
          *   Classification: Substantive and defensible.
          *   Closing power: Yes, it suggests philosophy is descriptive rather than prescriptive, rendering it useless for guiding current work.

      *   *Reading 5 (The Division of Labour + Meta-commentary):* This needs to be the "most plausible reading" (division-of-labour claim) plus the meta-sentence about changing the verdict.
          *   Thesis: This reading argues that a science with a reliable internal error-correcting mechanism has no need of external conceptual criticism except in special cases.
