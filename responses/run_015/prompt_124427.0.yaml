answer: |-
  ### Interview Questions

  **1. The Structure of the Regress**
  Standard epistemic game theory treats the regress of "I know that you know that I know..." as a feature that ensures stability in equilibrium, often formalized via a fixed-point definition of common knowledge. You argue that non-partitional neighborhood frames allow us to bypass this infinite hierarchy while retaining the stability needed for interaction. Can you explain the specific logical mechanism in your semantics that blocks the regress without collapsing into a simple lack of mutual awareness?
  *   **Follow-up:** If she replies that the neighborhood structure allows for a "finite depth" of belief that is sufficient for coordination, press her on whether this depth is a fixed parameter of the model or a variable dependent on the specific game, and ask how agents negotiate that depth prior to play.

  **2. The Nature of the "Common" in Common Belief**
  If we remove the infinite hierarchy, the term "common" in your *Common Belief of Bounded Rationality* seems to lose its standard set-theoretic definition (the intersection of all orders of belief). In your framework, what does the "common" component refer to if not an infinite conjunction? Are you positing a primitive relation of joint attention that is not reducible to individual mental states?
  *   **Follow-up:** If she argues that "common" is merely a shorthand for "overlapping neighborhoods of belief," ask her how this avoids the problem of false consensus, where agents believe they share a constraint but actually operate under different local bounds.

  **3. Joint Attention to Limits**
  You suggest agents "jointly attend" to each other's reasoning limits. In standard partitional models, agents know the structure of the game and each other's rationality perfectly. In your model, agents must represent the *limits* of that rationality. Does representing a limit not require a higher-order capacity that risks reintroducing the very regress you aim to avoid?
  *   **Follow-up:** If she claims that representing a limit is cognitively cheaper than representing a full strategy space, ask for a justification of why modeling the *boundary* of reasoning is less demanding than modeling the *content* of reasoning.

  **4. Strategic Predictions vs. Aumann Rationalizability**
  In Aumann's framework, Common Knowledge of Rationality often restricts players to a specific set of rationalizable strategies, sometimes narrowing down to a unique Nash equilibrium. In a coordination game or Matching Pennies scenario, does your model of Bounded Rationality expand the set of permissible moves, or does it select for different equilibria entirely? Specifically, do you recover standard predictions as a limit case, or is your theory fundamentally incommensurable with Aumann's predictions?
  *   **Follow-up:** If she says the model allows for "more" rationalizable strategies (underdetermination), ask whether this renders the theory less predictive than standard game theory, and how a player is supposed to choose among the expanded set without reintroducing a higher-order norm.

  **5. Normativity vs. Description**
  Epistemic game theory often straddles the line between normative prescription (how agents *ought* to reason) and descriptive psychology (how they *do* reason). By building bounded rationality into the semantic frame, are you changing the norms of rationality themselves, or merely describing the constraints under which the standard norms apply?
  *   **Follow-up:** If she asserts that bounded rationality is the new norm, ask how her framework evaluates an agent who *could* reason deeper but chooses not to; is that agent irrational in your model, or simply operating within a different neighborhood?

  **6. The "Mere Formalism" Objection**
  Critics might argue that shifting from partitional to non-partitional neighborhood frames is a technical adjustment that leaves the philosophical commitments of game theory unchanged—a case of moving symbols without shifting concepts. What specific conceptual work does this formalism perform that could not be achieved by simply adding error terms or "trembling hands" to the standard Aumann model?
  *   **Follow-up:** If she replies that the formalism "clarifies the concept of belief," demand a specific example of a philosophical confusion in the existing literature that your neighborhood semantics dissolves, which standard type spaces could not.

  **7. Empirical Anchoring**
  Finally, if this model is to replace Common Knowledge of Rationality, it must offer explanatory power in real-world strategic interactions. Are there empirical phenomena—perhaps from behavioral economics or cognitive science regarding recursive reasoning limits—that your model captures but which standard epistemic logic categorizes as irrational noise?
  *   **Follow-up:** If she cites experimental data on level-k reasoning, ask whether her model is effectively just a formal reconstruction of level-k theory, and if so, what philosophical advantage the neighborhood semantics adds over the existing psychological literature.

  ***

  ### Meta-Analysis of the Interview Strategy

  **Condition for Revising the Framing**
  I would need to substantially revise the framing of these questions if the guest replies to **Question 1** by conceding that her model *does* technically rely on an infinite hierarchy (e.g., a fixed-point definition of common belief) but argues that the *interpretation* of the states in the neighborhood frame renders the hierarchy psychologically irrelevant. If she admits the mathematical regress remains but is semantically inert, my line of questioning regarding "avoiding the regress" becomes a category error. In that scenario, I would need to pivot from asking *how* she avoids the regress to asking why she believes the semantic interpretation overrides the mathematical structure, shifting the focus from logic to the philosophy of mathematical modeling.

  **Vulnerability to Misrepresenting the Literature**
  The line of questioning is most vulnerable at **Question 4** regarding "Aumann-style common knowledge" and rationalizability. There is a risk of conflating *Common Knowledge of Rationality (CKR)* with the derivation of *Nash Equilibrium*. In the literature, CKR typically yields *rationalizability* (the set of strategies consistent with rationality), which is often a broader set than Nash equilibria, unless additional assumptions (like common priors) are added. If I press her on whether her model reproduces "Nash predictions" when the standard literature only guarantees "rationalizability" from CKR alone, I may be attributing a stronger claim to the standard view than it actually holds. I must ensure I distinguish between the *rationalizability set* and *equilibrium selection* when evaluating her answer, otherwise, I risk critiquing her for failing to solve a problem (unique equilibrium selection) that standard epistemic game theory does not claim to solve solely via CKR.
