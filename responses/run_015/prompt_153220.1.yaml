      *(Final Plan)*:
      1.  Diagnose the stall as a clash of **Epistemic Holism**.
      2.  Reframe "Gatekeeping" as **Coherence Maintenance**.
      3.  Reframe "Dogmatism" as **Immunization**.
      4.  Propose **Cost of Revision** as the metric.
