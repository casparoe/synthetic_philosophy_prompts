      *   *Refining the "Gatekeeping" point:* The defenders argue historians protect the paradigm. The historians argue pseudohistorians protect the *hypothesis*. It's a mirror image. The difference is *where* the protection is located. In science, protection is in the *method* (peer review, replication). In pseudohistory, protection is in the *narrative* (ad hoc hypotheses).
      *   *Refining the "Defeater" point:* It's about *defeater deflection*. Mainstream history allows data to defeat hypotheses. Pseudohistory allows hypotheses to defeat data (by claiming the data is forged/misdated).
      *   *The "Ill-Posed" verdict:* Demarcation is often ill-posed as a binary. It's better viewed as a spectrum of reliability. But for *this specific group*, the stall is likely due to conflating *sociological* consensus with *epistemic* consensus.

