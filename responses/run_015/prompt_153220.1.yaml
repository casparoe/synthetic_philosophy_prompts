answer: |-
  This stalemate is not unusual, but your group has correctly identified that the standard "Popperian" demarcation tools (falsifiability, etc.) are blunt instruments here. The reason you are stuck is that you are treating this as a dispute about **truth claims** when it is actually a dispute about **epistemic structure** and **risk distribution**.

  Here is a diagnosis of why the stall happens, followed by a proposal for how to move it (or dissolve it).

  ### 1. The Diagnosis: Holism vs. Atomism
  The real disagreement is not empirical (about the data) or purely normative (about what history *should* be). It is a disagreement about **Confirmational Holism**.

  *   **Mainstream History operates on Coherentism:** Evidence is a web. Radiocarbon dating, textual criticism, linguistics, and archaeology are independent strands that must knot together. To change the chronology of the Bronze Age, you cannot just move one date; you have to re-knot the entire web (linguistic drift, tree rings, carbon calibration, stratigraphy). The "consensus" is not a social agreement; it is the state of maximum coherence across these independent strands.
  *   **Pseudohistory operates on Atomism (or Selective Holism):** Claims like Atlantis or Ancient Aliens often isolate a single anomaly (a map, a statue, a textual ambiguity) and treat it as a "trump card" that overrides the web. Fomenko is a sophisticated version of this: he claims his statistical meta-method (dynasty matching) reveals a truth that overrides the domain-specific methods (archaeology/dendrochronology).

  **The Stall:**
  When historians say "you aren't updating beliefs," they mean "you are willing to sever the web of coherence to save a single hypothesis."
  When defenders say "you are gatekeeping," they mean "you are prioritizing the stability of the web over the anomaly."

  Both sides are technically correct about the other's behavior, but they disagree on which behavior is virtuous. Historians view **stability** as a sign of robustness; defenders view **stability** as a sign of dogma.

  ### 2. The "Gatekeeping" Charge is a Category Error
  The defenders' claim that historians are "gatekeeping a consensus story" relies on a sociological model of science (à la Kuhn or Latour) where paradigms are protected by institutional power.

  However, in this specific context, the "consensus" is not a paradigm in the Kuhnian sense (a theoretical framework); it is a **forensic reconstruction**.
  *   **The Move:** Challenge the group to distinguish between a *Theoretical Paradigm* (e.g., Neoclassical Economics) and a *Forensic Reconstruction* (e.g., Crime Scene Investigation).
  *   **Why it matters:** In a forensic reconstruction, "gatekeeping" is actually **chain of custody**. If a defense attorney claims the DNA evidence is part of a conspiracy to frame the defendant, they aren't offering a rival scientific paradigm; they are attacking the integrity of the evidence collection.
  *   **Application:** Mainstream history treats chronology like a crime scene reconstruction. Pseudohistory treats it like a literary critique. The stall happens because pseudohistorians demand history function like literature (open to infinite reinterpretation), while historians demand it function like forensics (constrained by physical traces).

  ### 3. The Fomenko Specifics: The Hierarchy of Evidence
  Fomenko's *New Chronology* is the hardest case because it uses math. This creates a **Hierarchy of Evidence** dispute.
  *   **Fomenko's Claim:** Mathematical correlation of dynastic records is a "harder" science than carbon dating or stratigraphy, which are prone to human error/forgery.
  *   **Historian's Counter:** The statistical model assumes data independence where none exists (historical records influence each other). It is a category error to apply statistical significance to non-independent historical narratives.

  **The Stall:** You cannot resolve this by looking at the data. You have to resolve the **Meta-Methodological Priority**.
  *   **Question for the group:** *Under what conditions does a meta-method (statistics) override a domain-method (archaeology)?*
  *   If the group admits that statistics can override archaeology *in principle*, they must agree on the conditions (e.g., sample size, independence). Fomenko fails these technical conditions, but the philosophical stall is about whether those conditions are required.
  *   **Diagnosis:** The defenders are treating the *form* of the argument (math) as more valid than the *content* (historical reality). The historians are treating the *causal history* of the artifacts as more valid than the *formal correlation* of the texts.

  ### 4. How to Move the Debate (Or Dissolve It)
  Stop asking "Is this pseudohistory?" That is a binary label that invites defensiveness. Instead, shift the metric to **Cost of Revision** and **Error Management**.

  #### A. The "Cost of Revision" Test
  Ask the group to calculate the "cost" of being wrong for each side.
  *   **Mainstream History:** If the standard chronology is wrong, the cost is catastrophic. It breaks linguistics, genetics, climate science, and archaeology simultaneously. Therefore, the burden of proof must be astronomically high.
  *   **Pseudohistory:** If the New Chronology is wrong, the cost is low. It only requires discarding the statistical model.
  *   **The Pivot:** The disagreement isn't about truth; it's about **Epistemic Risk**. Historians are risk-averse (protecting the web); Pseudohistorians are risk-seeking (betting the web is fake).
  *   **Resolution:** Acknowledge that "gatekeeping" is actually **risk management**. Is it reasonable to demand that a single statistical anomaly should bankrupt the entire intellectual capital of the last 200 years of science? If the group agrees "no," the demarcation resolves itself without needing a definition of pseudoscience.

  #### B. The "Defeater Deflection" Mechanism
  You asked if it's about what counts as a defeater. It is specifically about **Defeater Deflection**.
  *   **Scientific/Historical Stance:** Data can defeat the Theory. (e.g., Carbon dating contradicts the text -> Text is likely metaphorical or wrong).
  *   **Pseudohistorical Stance:** The Theory defeats the Data. (e.g., The Theory says the timeline is compressed -> Therefore the Carbon dating calibration is a conspiracy or error).
  *   **The Move:** Don't ask if the theory is falsifiable. Ask: **"What specific piece of evidence would you accept as sufficient to abandon your hypothesis?"**
      *   If the answer is "Nothing, because all evidence from that period is contaminated," then it is not an empirical claim; it is a faith claim.
      *   If the answer is specific (e.g., "A verified inscription from Year X"), then you can discuss whether that inscription exists.
      *   Usually, pseudohistory moves the goalposts (the inscription is also fake). Identifying this *movement* is more productive than labeling the *state*.

  ### 5. Verdict: Is the Question Ill-Posed?
  **Yes, but with a caveat.**
  "Demarcation" as a binary (Science vs. Pseudoscience) is ill-posed because it assumes a clear boundary where there is a spectrum of reliability. However, the *functional* distinction is not ill-posed.

  **Recommendation for the Reading Group:**
  Drop the word "Demarcation." It carries too much baggage from the Logical Positivists. Replace it with **"Tracking Reliability."**

  1.  **Reframe the Debate:** "We are not deciding if Fomenko is a 'pseudohistorian.' We are deciding which method **tracks reality** more reliably over time."
  2.  **The Predictive (Retrodictive) Test:** Mainstream history makes risky predictions (e.g., "If we dig here, we will find a layer consistent with this date"). Pseudohistory rarely makes risky predictions; it mostly offers post-hoc explanations for anomalies.
  3.  **Accept the Normative Split:** Admit that there is a normative disagreement. Historians value **consilience** (multiple lines of evidence agreeing). Pseudohistorians value **explanatory scope** (one theory explaining everything, even if the lines of evidence don't agree).
      *   Ask the group: *Is it better to have a narrow theory that fits all the data, or a broad theory that requires dismissing most of the data as noise?*

  **Summary:** The stall is happening because you are arguing about **sociology** (gatekeeping) when you should be arguing about **structural integrity** (coherence). The historians are protecting the *network* of evidence; the defenders are protecting the *narrative*. If you shift the focus to **how much of the evidentiary network must be destroyed to save the narrative**, the "pseudohistory" label becomes unnecessary—the structural weakness reveals itself.
