answer: |-
  ### Desiderata for a Theory of Idealized Preference

  Your advisor is correct: before assessing whether Brandt, Railton, or Yudkowsky succeeds, you must define what success looks like. A theory of idealized preference claims that $X$ is good for agent $A$ if $A$ would prefer $X$ under conditions $C$. The following desiderata define the necessary properties of $C$ and the resulting preference set.

  I have categorized each as **Non-Negotiable** (failure undermines the concept of idealization itself) or **Contested Prejudice** (failure might be acceptable depending on one's meta-ethical commitments).

  #### 1. Resilience to Adaptive Distortion (The Sour Grapes Constraint)
  *   **The Case:** The "satisfied slave" or the addict. The slave prefers slavery because they believe freedom is impossible (adaptive preference); the addict prefers heroin because their reward system is hijacked. A theory must filter these out. However, it must not filter out preferences formed under hardship that are authentic (e.g., a monk preferring poverty).
  *   **What it Rules Out:** Simple Revealed Preference Theory; any account that treats all actual preferences as prima facie valid.
  *   **Status:** **Non-Negotiable.** If a theory cannot distinguish between a preference formed by coercion/pathology and one formed by judgment, it is not an *idealization* theory; it is merely a description of the status quo.

  #### 2. Distinction Between Information and Transformation (The Maturation Constraint)
  *   **The Case:** A teenager prefers smoking due to ignorance of health risks; an adult prefers reading poetry due to developed taste. Correcting the teenager's facts stops them from smoking. But "correcting" their immaturity might make them want poetry. The theory must specify whether it outputs what the agent *would* want if informed (error correction) or what the agent *would become* if developed (maturation).
  *   **What it Rules Out:** Accounts that conflate cognitive error with value development (e.g., treating a change in taste as a correction of a false belief).
  *   **Status:** **Non-Negotiable.** Without this, the theory cannot preserve agency. If the output is too transformed, it is no longer *the agent's* good, but the good of a successor self.

  #### 3. Temporal and Procedural Invariance (The Path Independence Constraint)
  *   **The Case:** If we run the idealization procedure on you at age 18, and separately on you at age 45, do we converge on the same "ideal self"? If the output depends on the starting point or the order of information delivery, the "good" is unstable.
  *   **What it Rules Out:** Chaotic dynamic systems; models where initial conditions dictate distinct local maxima.
  *   **Status:** **Contested Prejudice.** This is a rationalist bias. Human development is historically path-dependent. Demanding invariance may require smoothing over genuine, identity-constituting choices made along different life paths.

  #### 4. Reflective Stability (The Fixed-Point Constraint)
  *   **The Case:** The output of the idealization procedure is an agent (or preference set) $A^*$. If we run the idealization procedure *on* $A^*$, do we get $A^*$ again? If $A^*$ would choose to modify themselves further, they are not yet ideal.
  *   **What it Rules Out:** Infinite regresses; unstable equilibria; procedures that generate a "better" self that rejects the procedure that created it.
  *   **Status:** **Non-Negotiable.** An "ideal" must be a resting point. If the ideal self wishes it were different, it is not the ideal.

  #### 5. Interpersonal Non-Imposition (The Aggregation Constraint)
  *   **The Case:** Agent $A$ prefers that Agent $B$ adopt $A$'s religion. When $A$ is idealized, does this preference survive? If we aggregate idealized preferences for a society, do we allow $A^*$ to impose on $B^*$?
  *   **What it Rules Out:** Simple utilitarian aggregation of raw preferences; perfectionist accounts that mandate specific values across agents.
  *   **Status:** **Contested Prejudice.** This depends on whether the theory is about individual well-being (where $A$'s preference about $B$ is just part of $A$'s good) or social choice (where it creates conflict). Liberal theories demand sanitization; communitarian theories may not.

  #### 6. Normative Authority (The Internalism Constraint)
  *   **The Case:** The ideal self $A^*$ prefers $X$. The actual self $A$ is indifferent to $X$. Does $A$ have a *reason* to pursue $X$? The theory must explain why $A$ should care about $A^*$'s verdict.
  *   **What it Rules Out:** Externalist accounts where the ideal self is effectively a stranger to the actual self.
  *   **Status:** **Contested Prejudice.** Humeans require internalism (reasons must link to actual motives); Moral Realists may reject it (you have reasons even if you don't care).

  #### 7. Computational Definability (The Specification Constraint)
  *   **The Case:** Can the function $f(A) \rightarrow A^*$ be specified without circularity or infinite regress? (Crucial for AI alignment/CEV).
  *   **What it Rules Out:** Vague appeals to "full information" or "rationality" that lack operational definitions.
  *   **Status:** **Non-Negotiable** (for formal theories). If the procedure cannot be described, it cannot be evaluated or implemented.

  ---

  ### Incompatibility Clusters

  Your suspicion is well-founded. The most significant tension lies between **Path Independence (3)** and **Maturation (2)**, mediated by **Reflective Stability (4)**.

  1.  **The Chaos Problem:** If human psychology is a chaotic system (sensitive to initial conditions), **Path Independence** is mathematically impossible. Small differences in the 18-year-old vs. the 45-year-old lead to divergent attractors. To enforce Path Independence, you must impose a "global attractor" that overrides the agent's actual psychological trajectory.
  2.  **The Identity Trade-off:** If you enforce a global attractor to satisfy Path Independence, you risk violating **Maturation**. You are no longer simulating *this* person's development; you are dragging them toward a rationalist universal endpoint.
  3.  **The Stability Conflict:** **Reflective Stability** requires convergence. **Maturation** implies change. If the procedure simulates growth, the "endpoint" might be a dynamic trajectory rather than a static fixed point. Demanding a static fixed point (Stability) may rule out theories where the "good life" is an open-ended process of becoming.

  **Verdict:** You cannot jointly satisfy strong Path Independence, strong Maturation (preservation of historical identity), and strict Reflective Stability (static equilibrium) without making the idealization procedure so aggressive that it ceases to be about the *agent* and becomes about the *theorist's* values.

  ### The Single Most Exclusionary Requirement

  **Reflective Stability (4)** is the requirement that excludes the most extant contenders.

  *   **Why:** Most philosophical proposals (Brandt's cognitive psychotherapy, Railton's full-information account) describe a *process* of improvement but offer no proof of *convergence*. They assume that if you keep correcting errors, you eventually stop. But there is no guarantee that psychological revision converges rather than cycling or drifting.
  *   **Impact:** This requirement kills almost all "process" accounts that lack a formal proof of termination. It forces the theorist to either prove human psychology has a stable equilibrium (empirically dubious) or define "ideal" as a dynamic limit rather than a state (conceptually difficult).

  ### Brief Scoring of Named Proposals

  *   **Brandt (Cognitive Psychotherapy):** Fails **Reflective Stability**, as repeated therapy sessions may yield diminishing returns without a guaranteed convergence point.
  *   **Railton (Full-Information):** Fails **Path Independence**, as the counterfactual scenario depends heavily on the agent's actual starting circumstances and history.
  *   **Yudkowsky (CEV):** Fails **Computational Definability**, as the "extrapolation" function remains metaphorically described rather than mathematically specified.
  *   **Rosati (Internalist Accounts):** Fails **Resilience to Adaptive Distortion**, as they often tether the ideal too closely to the agent's actual motivational set.

  ### Recommendation for the Paper

  Structure your argument around the tension between **Path Independence** and **Maturation**. If you argue that Path Independence is a **Contested Prejudice**, you can defend a theory that accepts multiple "ideal selves" depending on life history. If you argue it is **Non-Negotiable**, you must explain how to avoid paternalism. This allows you to critique the AI alignment literature (which demands Path Independence for safety) using the tools of moral philosophy (which values historical identity).
