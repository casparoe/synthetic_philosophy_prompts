answer: |-
  Hey, thanks for reaching out about this, it is genuinely one of the trickier corners of population ethics and I can see why you are hitting a wall there. You are basically asking whether the intuitive force of the procreation asymmetry holds up when we squeeze the welfare level of the potential child right up against the zero line of neutrality, specifically in cases where the non-identity problem is in play so that we are not comparing the same individual across different choices. The standard asymmetry tells us that while we have a strong moral reason not to bring into existence a child who would have a miserable life, we do not have a parallel moral reason to bring into existence a child who would have a happy life. When you shift the happy life to be only barely worth living, the pressure on this view comes from the impersonal totalist perspective, which suggests that any addition of positive welfare increases the overall value of the world, thereby generating at least some reason to create that life. However, after weighing the person-affecting constraints against the impersonal calculus, I think the asymmetry not only survives this threshold-adjacent setup but actually becomes more robust when we clarify the moral status of non-existent subjects.

  To see why the asymmetry survives, we have to look closely at what the non-identity problem does to the concept of harm and benefit in this specific threshold zone. In the standard non-identity case, if you choose to have a child now rather than later, and that child has a life that is barely worth living, you cannot say you have harmed that child by not waiting, because if you had waited, that specific child would never have existed. The person-affecting view leans heavily on this, arguing that morality is fundamentally about how we treat specific subjects. Since the barely happy child is not harmed by being created, and the non-existent child is not harmed by not being created, there is no subject-based duty to bring them into existence. The impersonal view counters this by saying that the state of affairs containing the barely happy child is better than the state of affairs containing no child, so we have a reason to prefer the former. The trouble with this impersonal move in the threshold-adjacent case is that it risks collapsing the distinction between creating a life and helping a life, and it opens the door to the repugnant conclusion where we are obligated to maximize population size regardless of the quality of those lives, provided they are above zero.

  If we accept the impersonal claim that there is a reason to create barely worth living lives, we undermine the core intuition of the asymmetry, which is that existence is not a benefit that can be owed to someone in the same way that non-suffering is a right. When we push the welfare level down to just barely positive, the impersonal view suggests our reason to create becomes weaker but still present, whereas the asymmetry suggests the reason remains nonexistent. I think the asymmetry is correct here because the moral weight of preventing suffering is lexically prior to creating benefits, and this priority holds even at the margins. The reason we have not to create a miserable child is that we are inflicting a harm on a specific subject who will experience that misery. The reason we supposedly have to create a barely happy child is that we are adding value to the universe, but there is no subject waiting in the wings to claim that value. The fact that the life is barely worth living does not change the metaphysical fact that the subject does not exist prior to the decision. To say we have a reason to create them because their life would be slightly positive is to treat existence as a commodity that can be traded off against nothingness, but nothingness cannot be a beneficiary of that trade.

  Furthermore, accepting the impersonal view in this threshold-adjacent scenario creates a slippery slope that destabilizes parental autonomy and moral coherence. If we concede that there is a moral reason to create a life simply because it contains a net positive balance of welfare, however slight, then we are committed to the view that parents who choose not to have children are failing to realize a moral good, provided they could have created a child with a barely positive life. This seems counterintuitive to the point of absurdity. The asymmetry protects us from this by maintaining that while we must not make people miserable, we are not required to make people happy, even if making them happy is easy and their happiness is guaranteed. The proximity to the neutrality line does not bridge the gap between no duty and some duty because the source of the duty is missing. In the negative case, the source is the suffering subject. In the positive case, there is no subject, only a potential subject, and potential subjects do not generate moral claims until they exist. The impersonal view tries to bypass the subject entirely and focus on the value of the outcome, but in procreation, the outcome is inextricably linked to the subject's existence, so we cannot ignore the person-affecting constraint.

  Some might argue that if the life is sufficiently good, the asymmetry should collapse, but by specifying that the life is barely worth living, you have actually isolated the case where the asymmetry should be strongest. If we feel no duty to create a person who will be ecstatic, we certainly should feel no duty to create a person who will be marginally content. The only way the impersonal view gains traction here is if we value total welfare over individual claims, but in the context of bringing new people into existence, individual claims are the only thing that makes sense of the harm principle. We do not harm the non-existent by leaving them non-existent, so we cannot be said to fail them by not creating them. Therefore, the lack of a reason to create happy lives holds firm even when those lives are barely worth living. The asymmetry survives because the moral logic preventing the creation of suffering is based on the presence of a victim, while the logic demanding the creation of happiness relies on an abstract valuation of states of affairs that ignores the necessity of a subject to whom the benefit accrues.

  So, to take a definitive side for your seminar, I argue that the asymmetry survives this threshold-adjacent setup without modification. The person-affecting view provides the correct moral framework here because it respects the distinction between harming existing or future identifiable people and failing to bring potential people into existence. The impersonal view fails because it demands we treat the addition of barely positive welfare as a moral imperative, which leads to untenable conclusions about parental obligation and the value of existence itself. The fact that the welfare level is near neutrality does not generate a duty where none existed before, because the ground for the duty—the claim of a subject—remains absent. We have a duty not to create misery because misery requires a sufferer, but we have no duty to create barely positive lives because happiness does not require a pre-existing claimant. The asymmetry is not a gradient that fades as welfare increases; it is a structural feature of how we relate to potential persons, and it holds firm even right at the edge of the neutrality line.
