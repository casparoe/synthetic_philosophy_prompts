  *(Refining the Unfalsifiability point)*: The risk is defining "suffering" as "negative affect" makes the claim "suffering is bad" analytic. But the empirical claim is "Nociception can exist without Negative Affect." That *is* falsifiable (look for asymbolia). The ethical claim "Only Negative Affect matters" is normative. I need to separate these.

  *(Final Plan)*:
  1. Validate the position (it's a known philosophical stance).
  2. Distinguish Nociception vs. Sensory Qualia.
  3. Rank Objections (Predictive Processing, Phenomenological Void, Evolutionary/Functional, The Tautology Trap).
  4. Address the "Bleeding" and "Phantom" points.
  5. Conclude on the empirical status.
  6. Tie back to crustaceans.

