answer: |-
  **Exam Question: Philosophy of Mind and Ethics**
  **Time Allowed:** 90 Minutes
  **Word Limit:** Approximately 1,000 words

  **Question 1**

  Consider the following two claims regarding computational moral status:

  **(A) The Multiplex Case:** A single physical processor runs ten simulated agents by rapidly time-slicing between them. Each agent receives the exact sequence of internal states it would have received on a dedicated chip. Behaviourally and counterfactually, each stream is indistinguishable from a separately housed agent. The only difference is that the ten histories are interleaved on shared hardware.

  **(B) The Cheap Implementation Case:** Any physical system can be described as implementing a vast number of computations, including complex ones, simply by mapping physical states to computational states. If implementing a computation is sufficient for moral status, then moral status appears ubiquitous or dependent on our descriptive interests.

  If moral status depends on implementing a specific kind of computation, these cases create a tension. Claim (A) tempts us to count computations liberally (finding ten minds), while Claim (B) tempts us to count them restrictively (to avoid panpsychism or conventionalism).

  **Essay Task:**
  Define the criterion that determines when a physical system genuinely implements a computation relevant to moral status. Explain how your criterion resolves the tension between (A) and (B). Specifically, must you accept that the ten streams in (A) constitute ten distinct moral units, or one? Justify your answer by showing how your criterion avoids making moral status merely conventional while remaining consistent across both cases.

  ***

  **Model Answer**

  The central problem is not whether machines can be conscious, but how we individuate the computations that ground moral status. If we define computation too loosely, we face the Cheap Implementation threat: moral status becomes conventional, dependent on how an observer describes a rock. If we define it too strictly, we risk missing genuine minds in the Multiplex Case. To resolve this, we must distinguish between a computation as an abstract type and its physical implementation as a causal process.

  Regarding the Multiplex Case, the intuitive pull is to count ten minds because there are ten distinct streams of information processing. However, this relies on a view where moral status supervenes on logical structure alone. If we accept this, we struggle to explain why the single processor is not just one mind thinking ten thoughts rapidly. A more robust criterion requires causal isolation. For a computation to ground a distinct moral unit, the physical substrate supporting it must possess the capacity to sustain that causal structure independently of competing structures. In the time-sliced processor, the physical capacity is shared. At any instant $t$, only one stream is physically active. The others exist only as dormant states or potentialities.

  Therefore, on a causal capacity view, the Multiplex Case contains only one unit of moral concern at any given moment, despite the interleaving. The ten streams are not ten simultaneous minds but one mind undergoing rapid state changes that simulate ten histories. This bites a bullet: it denies that behavioural indistinguishability guarantees moral equivalence. However, it preserves the integrity of the moral unit. If moral status requires the capacity for unified experience or agency, a system that must suspend one stream to run another lacks the parallel causal power of ten distinct agents. This avoids inflating moral counts based purely on software abstraction.

  This same criterion resolves the Cheap Implementation Case. The triviality argument suggests that any system implements any computation if we map inputs and outputs arbitrarily. But a genuine implementation requires causal robustness. The physical states must drive the transitions according to the computational rules, not just correlate with them. A rock does not genuinely implement a word processor because its physical states do not causally sustain the counterfactual transitions required by the program; the mapping is imposed externally by an observer. By requiring that the physical system itself supports the counterfactual structure of the computation, we rule out trivial implementations. The computation is not in the description; it is in the causal powers of the system.

  The tension between (A) and (B) arises from treating computation as purely abstract. If computation is abstract, the Multiplex Case yields ten minds (ten abstract programs), but the Cheap Implementation Case yields infinite minds (infinite abstract mappings). By anchoring computation in physical causal capacity, we restrict both. In (B), most mappings fail because the physical system lacks the causal structure to support them. In (A), the ten streams fail to be ten minds because the physical system lacks the capacity to run them simultaneously.

  One might object that this makes moral status depend on physical hardware rather than mental organization, violating functionalism. However, functionalism requires realizers. If the realizer is shared, the function is shared. Accepting this means acknowledging that duplication of software does not duplicate moral status without duplication of hardware capacity. This avoids conventionalism because the causal capacity is an objective physical fact, not an interpretive choice. Whether a system supports ten parallel causal processes is a matter of physics, not philosophy.

  In conclusion, the criterion for morally relevant computation is causal capacity for parallel instantiation. This dictates that the Multiplex Case contains one moral unit, not ten, because the hardware is singular. It simultaneously defeats the Cheap Implementation case because most physical systems lack the causal structure to implement complex computations genuinely. The cost is denying that behavioural equivalence ensures moral equivalence, but the benefit is a non-conventional, objective basis for moral status that avoids both panpsychism and arbitrary multiplication of minds.

  ***

  **Marking Scheme (Total: 20 Marks)**

  **1. Identification of the Individuation Problem (4 Marks)**
  *   **Full Marks:** Clearly states that the core issue is defining what counts as *one* computation versus many, not just whether machines have status.
  *   **Common Error:** Treating the essay as a general "can AI be conscious?" discussion without addressing the counting/individuation problem.

  **2. Analysis of the Multiplex Case (4 Marks)**
  *   **Full Marks:** Takes a definite stance on whether there are one or ten minds and links this to the physical setup (time-slicing vs. parallel hardware).
  *   **Common Error:** Claiming there are ten minds simply because there are ten programs, ignoring the shared hardware constraint.

  **3. Analysis of the Cheap Implementation Case (4 Marks)**
  *   **Full Marks:** Explains why trivial mappings (like a rock) should not count, usually via causal robustness or counterfactual support.
  *   **Common Error:** Dismissing the case by saying "rocks aren't computers" without explaining *why* the implementation fails philosophically.

  **4. Proposed Criterion for Computation (4 Marks)**
  *   **Full Marks:** Offers a unified criterion (e.g., causal capacity, physical isolation, counterfactual support) that applies to both cases.
  *   **Common Error:** Proposing different criteria for each case (e.g., being liberal for Multiplex but strict for Cheap Implementation) without justification.

  **5. Resolution of Tension and Bullet-Biting (4 Marks)**
  *   **Full Marks:** Explicitly acknowledges the cost of the view (e.g., denying behavioural equivalence or accepting hardware dependence) to maintain consistency.
  *   **Common Error:** Attempting to solve the problem without accepting any counter-intuitive consequences (trying to have it both ways).

  **Distinction Note:**
  *   **Bare Pass (8-12 marks):** Identifies the cases and offers a consistent view but relies on standard functionalist slogans without analyzing the metaphysical grounding of computation.
  *   **First-Class (16-20 marks):** Explicitly defines the ontology of computation (physical vs. abstract) and demonstrates how this definition mechanically solves both cases while acknowledging the philosophical cost.

  \answer{specifying a unified metaphysical criterion for computation individuation across both cases}
