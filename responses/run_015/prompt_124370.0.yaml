answer: |-
  # The Deliberative Protocol for Incommensurable Values

  **Purpose:** To guide the Allocations Committee in making final funding decisions where values conflict, without resorting to false quantification.
  **Constraints:** One afternoon meeting; fixed budget (must be spent); lay trustees; written reasons required.
  **Authority:** This protocol is adopted by the Board. Deviations require Chair justification in the Minutes.

  ---

  ## Part 1: The Procedure

  ### Phase 1: The Diagnostic (Specification 1)
  *Before comparing specific applications, the Committee must classify the relationship between the competing values represented by the shortlisted bids.*

  **Step 1.1: The Dominance Check**
  *   **Question:** Is Bid A better than Bid B on *every* criterion the Committee has previously agreed matters (e.g., evidence quality, reach, severity)?
  *   **If Yes:** Fund A. (Stop).
  *   **If No:** Proceed to 1.2.

  **Step 1.2: The Evidence Check (Scientific Officer Lead)**
  *   **Question:** Is the incomparability due to missing data that could reasonably be obtained now?
  *   **If Yes:** Request clarification (if time permits) or mark as "Uncertain." If "Uncertain," treat as **Vagueness** (1.3).
  *   **If No:** Proceed to 1.3.

  **Step 1.3: The Parity Test (Committee Vote)**
  *   **Question:** Are the bids such that one is better in some respects and worse in others, but neither is *overall* better, nor are they *equally* good? (i.e., Would you be rationally permitted to choose either?)
  *   **If Yes:** Diagnosis = **Parity**. (Proceed to Phase 4).
  *   **If No:** Proceed to 1.4.

  **Step 1.4: The Lexical/Incomparable Test**
  *   **Question:** Is there a rule that says one type of value *always* trumps the other (e.g., "Saving a life always trumps improving quality of life")? Or are they so different no comparison is possible?
  *   **If Yes (Lexical):** Follow the rule. (Stop).
  *   **If Yes (Radical Incomparability):** Proceed to Phase 2.
  *   **If No:** Return to 1.3.

  **Outputs of Phase 1:**
  *   *Ignorance/Vagueness:* Requires more deliberation or evidence.
  *   *Parity:* Requires Commitment (Phase 4).
  *   *Lexical:* Requires Rule-following.
  *   *Incomparable:* Requires Moral Remainder handling (Phase 2).

  ### Phase 2: The Moral Remainder (Specification 2)
  *Determines the emotional and ethical aftermath of the decision.*

  **Step 2.1: The Duty Check**
  *   **Question:** Does rejecting Bid B violate a standing duty of the Charity (e.g., a core mission objective stated in our Constitution), even if Bid A is permissible?
  *   **If Yes:** Diagnosis = **Conflict with Remainder**.
      *   *Action:* The rejection letter must acknowledge the value of the lost opportunity. The Minutes must record "Regret."
  *   **If No:** Diagnosis = **Permissible Options**.
      *   *Action:* The rejection letter cites "Strategic Prioritisation." The Minutes record "Commitment."

  **Sign-off:** Committee majority. Chair confirms the classification matches the Minutes.

  ### Phase 3: Agglomeration (Specification 3)
  *Rule for Many Small vs. One Large.*

  **Step 3.1: The Boundary Rule**
  *   **Rule:** You may sum small benefits *only* if they fall within the same value cluster as the large loss (e.g., many small health gains vs. one large health gain).
  *   **Rule:** You may *not* sum small benefits to override a Lexical boundary (e.g., many small comforts cannot outweigh one loss of life, if Life is Lexical).

  **Step 3.2: The Refusal Statement**
  *   If an applicant argues for summing across boundaries, the written reason must state: "We do not measure [Value X] in the same currency as [Value Y]. We prioritised [Value Y] not because the sum of [Value X] was insufficient, but because [Value Y] holds a different priority in this quarter's allocation."

  **Sign-off:** Scientific Officer verifies value clusters; Committee votes on application.

  ### Phase 4: Chance and Commitment (Specification 4)
  *When human judgment reaches its limit.*

  **Step 4.1: The Lottery Condition**
  *   **Permissible:** A fair lottery is allowed *only* when Phase 1 diagnoses **Parity** and Phase 2 diagnoses **Permissible Options**.
  *   **Impermissible:** A coin toss is *forbidden* when the diagnosis is **Conflict with Remainder** or **Radical Incomparability**. To toss a coin there is to deny the weight of the loss.

  **Step 4.2: The Commitment Condition**
  *   If Parity exists, the Committee must *choose* to make one aim paramount for this quarter. This is not finding a reason; it is creating one.
  *   **Record:** "We chose X over Y not because X was better, but because we commit to X for this cycle."

  **Sign-off:** Committee. Chair casts vote if deadlocked on the choice (not the diagnosis).

  ### Phase 5: Recurrence and Precedent (Specification 5)
  *Managing consistency across quarters.*

  **Step 5.1: The Presumption Rule**
  *   Last quarter's decision creates a *presumption*, not a *binding rule*.
  *   **To Follow:** No extra justification needed.
  *   **To Depart:** Requires a **Statement of Distinction**.

  **Step 5.2: The Statement of Distinction**
  *   If departing from precedent, the Minutes must record:
      1.  What the precedent was.
      2.  Why the current context differs (e.g., "New evidence," "Portfolio balance," "Change in external need").
      3.  Confirmation that this is not merely due to membership rotation.

  **Sign-off:** Chair signs the Statement of Distinction. Scientific Officer archives it for the next Committee.

  ---

  ## Part 2: Governance and Disagreement

  *   **Scientific Officer:** Owns Phase 1 (Evidence/Dominance) and Phase 3 (Value Clusters). Advises on Phase 5 (Precedent).
  *   **Committee:** Owns Phase 1 (Parity/Incomparable), Phase 2 (Remainder), Phase 4 (Chance/Commitment), and Final Allocation.
  *   **Chair:** Owns the Process. Signs off on Written Reasons. Casts deciding vote if Committee is deadlocked on a choice *after* the procedure is run.
  *   **Disagreement:** If a trustee fundamentally disagrees with the Diagnosis (e.g., believes it is Parity, not Lexical), they may record a dissent in the Minutes. The External Reason to applicants remains unified, drafted by the Chair, reflecting the majority Diagnosis.
  *   **Time Limit:** Phase 1-3 must be completed by mid-afternoon. Phase 4-5 and Final Voting in the last 90 minutes.

  ---

  ## Part 3: Running the Cases

  ### Case 1: The Standard Three-Way Choice
  *   **Bids:** (A) Many/Small Benefit; (B) Few/Large Benefit; (C) Exploratory/High Risk.
  *   **Procedure:**
      1.  **Dominance:** None dominates.
      2.  **Evidence:** All evidence is in.
      3.  **Diagnosis:** Committee determines these are **On a Par**. No common currency exists to say A > B > C objectively.
      4.  **Remainder:** Committee checks Constitution. If all fit the mission, it is **Permissible Options** (Commitment), not Remainder.
      5.  **Decision:** Committee must *commit* to one value set for this quarter. Say they choose (B).
      6.  **Reasoning:** "We prioritised severity of outcome over reach this quarter."
      7.  **Result:** Determinate. No coin toss.

  ### Case 2: The Precedent Case
  *   **Context:** Last quarter favoured Many/Small (Type A). New applicant (Type A2) makes the case better than last quarter's winner.
  *   **Procedure:**
      1.  **Recurrence Check:** Phase 5 applies. There is a presumption to fund Type A again to ensure stability.
      2.  **Comparison:** A2 is stronger than last quarter's winner.
      3.  **Decision:** Fund A2.
      4.  **Reasoning:** "This proposal aligns with our recent strategic emphasis on reach, and demonstrates higher efficacy than previous funded projects in this category."
      5.  **Result:** Consistency maintained without rigidity. The "Statement of Distinction" is not needed because we are *following* precedent.

  ### Case 3: The "Disliked" Case (Strong Old vs. Weak New)
  *   **Context:** Bid S (Strong on all past criteria, Old Aim) vs. Bid W (Weaker on past criteria, serves New Aim not yet committed to).
  *   **Procedure:**
      1.  **Dominance:** S dominates W on *established* criteria.
      2.  **Diagnostic:** This is not Parity on *merit*. This is a conflict between **Merit (S)** and **Portfolio Diversification/Strategic Shift (W)**.
      3.  **Constitutional Check:** Scientific Officer confirms New Aim is legal/within Charity objects.
      4.  **Remainder:** If the Charity has a standing duty to the "Old Aim" (e.g., curing a specific disease), rejecting S creates a **Conflict with Remainder**.
      5.  **Decision:** The Committee *may* fund W, but only by explicitly declaring a **Strategic Re-orientation**. This overrides the Merit comparison.
      6.  **The Honest Reason to Bid S:**
          *   *Cannot say:* "Your proposal was insufficient." (False).
          *   *Cannot say:* "We preferred the other proposal." (Implies W was better on merit).
          *   *Must say:* "Your proposal was rated excellent against our standard criteria. However, this quarter the Committee exercised its discretion to prioritise [New Aim] to diversify our portfolio. This was a decision about strategic direction, not a reflection on the quality of your science."
      7.  **If the Procedure Forbids It:** If the Protocol strictly binds the Committee to "Best Merit on Established Criteria," then funding W is impermissible.
      8.  **My Ruling:** The Procedure *permits* this, but classifies it as a **Departure from Precedent** (Phase 5). It requires a **Statement of Distinction** in the Minutes: "We departed from merit-based precedence to seed a new strategic aim."
      9.  **Why:** A charity that cannot evolve its aims is stagnant. But the cost is honesty: you must tell Bid S they lost because of *policy*, not *quality*.

  ---

  ## Part 4: Limitations and Safeguards (Closing)

  ### What the Procedure Cannot Do
  1.  **Metaphysical Certification:** This procedure cannot prove, from the armchair, that two values are truly "On a Par" rather than "Incomparable." It relies on the Committee's sincere consensus.
  2.  **Eliminate Regret:** In "Conflict with Remainder" cases, the procedure manages the regret; it does not remove it. The "apology" in the letter is symbolic, not compensatory.
  3.  **Prevent Fatigue:** It cannot stop trustees from getting tired. It only mandates breaks and structured voting to mitigate it.

  ### Addressing Your Two Worries

  **Worry 1: Armchair Certification of Diagnoses**
  *   *Risk:* The Committee declares "Parity" when it is actually "Ignorance" to avoid doing the work.
  *   *Detection:* The **Scientific Officer** has veto power on Phase 1.2 (Evidence Check). If the SO says "We don't know enough," the Committee cannot vote "Parity" until the SO is satisfied or time runs out (recorded as "Uncertain").
  *   *Where the Person Answers:* The Chair signs the Minutes. If an audit later shows evidence was available but ignored, the Chair is accountable for process failure.

  **Worry 2: Incommensurability as Cover for Bias/Noise**
  *   *Risk:* Trustees say "These are incomparable" because they prefer the applicant from their own hospital, or because it is 4 PM and they want to go home.
  *   *Detection:*
      1.  **The Statement of Distinction (Phase 5):** If the Committee flips from "Many/Small" to "Few/Large" without a recorded contextual change, the Board can query the rotation effect.
      2.  **The Reason Test:** The written reason must cite the *Value* prioritised, not the *Applicant*. "We prioritised Severity" is valid. "We liked this team" is invalid. The Chair must redact personal preferences from the final letter.
      3.  **The Dissent Record:** Trustees are encouraged to record dissent on the *Diagnosis*. If one trustee consistently votes "Incomparable" to block specific types of bids, the pattern will appear in the Minutes over time.
  *   **Where the Person Answers:**
      *   **The Committee** answers for the Diagnosis (collective responsibility).
      *   **The Chair** answers for the Reason (individual responsibility).
      *   **The Board** answers for the Constitution (if the Committee shifts aims too wildly).

  **Final Instruction:**
  Print this protocol. Place it on the table. The Scientific Officer keeps the time. The Chair keeps the process. The Committee owns the choice. When you sign the reasons, you are not reporting a calculation; you are attesting that the procedure was followed and the choice was made sincerely. That is the only certainty available to you.
