      *   Section 2: The Mapping Audit (Clean/Distorted/None).
      *   Section 3: The Gap Analysis (What's missing?).
      *   Conclusion: Synthesis.

      *(Self-Correction during drafting)*: I need to be careful with the QALY section. In standard health economics, death is 0. States worse than death are negative. Hume's argument aligns with the concept of "states worse than death," but public health policy rarely acts on that by facilitating death. I need to highlight this tension.

      *(Refining the "Social Burden" point)*: Hume argues you aren't hurting society. Public health argues suicide *does* hurt society (survivor grief, economic loss, contagion). This is a direct conflict. I need to make sure this is clear.

  9.  **Final Review against Safety Guidelines:**
