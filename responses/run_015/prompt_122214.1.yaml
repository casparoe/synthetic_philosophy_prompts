answer: |-
  ### Outline of Form and Philosophy

  In this villanelle, the rigid circularity of the rhyme scheme performs the philosophical labor of Augustine's deontological ethics. The two refrains (A1 and A2) return inevitably at the close of each tercet, mirroring the immovability of the moral law regarding speech; just as the poem cannot escape its refrains, the speaker cannot escape the spiritual consequences of lying regardless of the shifting circumstances (represented by the variable 'b' rhymes). The 'a' rhymes, which interlock with the refrains, maintain a constant sonic identity throughout the poem, refusing to modulate even as the interlocutor's pleas change. This structural inflexibility embodies Augustine's refusal to grade lies by consequence: the return of the same sound signifies that the ontological status of the lie remains unchanged whether the outcome is life or death. The final quatrain does not resolve the tension but places the two refrains side-by-side, asserting that bodily safety and truthful speech belong to incommensurable orders of goods.

  ***

  ### The Trust of Speech

  The soul is darkened when it flees the light.  
  You ask if truth may break to save a friend.  
  Words are a trust to mirror back the light.  

  You weigh the body's life against the right.  
  And beg the law of speech to softly bend.  
  The soul is darkened when it flees the light.  

  No grade of falsehood makes the error slight.  
  Though blood be spilled, we may not pretend.  
  Words are a trust to mirror back the light.  

  To hide the truth is not to lose the sight.  
  But false assertion brings the bitter end.  
  The soul is darkened when it flees the light.  

  The mind descends into eternal night.  
  You would sell the soul to spare a friend.  
  Words are a trust to mirror back the light.  

  No common scale weighs breath against the right.  
  You save the breath, I guard the final end.  
  The soul is darkened when it flees the light.  
  Words are a trust to mirror back the light.
