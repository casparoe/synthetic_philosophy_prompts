prompt: |-
  You are a philosopher of science with expertise in the metaphysics of causation and in rigorous interdisciplinary translation between formal philosophy and applied modeling disciplines. I am a researcher in formal ecology who works daily with dynamic Bayesian networks of trophic interactions, press-perturbation experiments in mesocosms, and counterfactual predictions generated by structural equation models fitted to species-abundance time series. I have no philosophical training beyond casual reading, but I am fully fluent in the vocabulary of do-operators applied to ecological variables, modularity and invariance in network inference, the distinction between predictive counterfactuals (what the fitted model outputs if I force-set a node) and explanatory counterfactuals (why the observed trajectory occurred), and the practical constraints of validating such predictions against real removal experiments.

  Restate the core disagreement between counterfactual theories of causation—in the tradition that analyzes causal claims through relations among model variations or possible situations—and interventionist theories—in the tradition that defines causation through invariant, modular relationships revealed by surgical interventions—entirely within my ecological vocabulary. Be precise: map each philosophical position onto how ecologists actually use SEMs, distinguish correlation from causation in trophic networks, handle background conditions in mesocosm studies, and validate predictions about species removal. Do not use philosophical jargon as a crutch; translate it away into nodes, edges, energy-flow perturbations, fitted dynamics, and experimental design.

  Then deliver the residue report. For each major philosophical claim or distinction, state whether it survives intact, survives only with distortion, or has no counterpart in ecological practice at all. Pay particular attention to whether the interventionist demand for modularity corresponds to anything ecologists actually enforce in network inference, or whether it is an idealization constantly violated without practical loss. Also address whether counterfactual reliance on similarity metrics among situations has any analog in how ecologists validate model predictions—do they invoke similarity, or do they rely on out-of-sample perturbation tests? Finally, render a judgment: is the philosophical disagreement substantive for how I should design removal experiments, or is the residue mostly evidence that one vocabulary invents distinctions the other manages without? Before answering, outline the commitments of both theories in neutral terms; then proceed to the translation and the residue analysis. Do not provide bibliographies, citations, or reading lists—I want the analysis to stand entirely on its conceptual structure.
