      *   *Interventionist Theory (Woodward/Manipulability):* Causation is about invariance under intervention. $X$ causes $Y$ if there is a possible intervention on $X$ that changes $Y$, holding other relevant variables fixed (modularity). Focuses on the *structure* of the equations (mechanisms) rather than just the truth values of events.
