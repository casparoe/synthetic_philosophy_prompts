answer: |-
  Your geoarchaeologist friend is half-right: the trouble is indeed "what do you mean by history," but that isn't a dismissal—it's the actual work. In professional historiography and philosophy of history, there is no single consensus definition, but there is a settled distinction between *Res Gestae* (the things that happened) and *Historia Rerum Gestarum* (the narrative account of those things). Your gut reactions are toggling between these two, plus a third category: *Historical Force* (stories that cause things, regardless of truth).

  Here is the diagnosis of your current principle, the repair, the hard truth about your inconsistency, and the new tools you need.

  ### 1. Critique of Your Current Principle
  Your stab was: *(i) Reference + (ii) Chain + (iii) Content Survival.*

  *   **Clause (i) Reference:** This handles **Case 4 (Victorian Novelist)**. Coincidence lacks reference anchored in reality. This clause is solid.
  *   **Clause (ii) Chain:** This handles **Case 4** again (no transmission) and **Case 6 (Forged Charter)** (the chain is a fabrication, not a memory). This clause is solid.
  *   **Clause (iii) Content Survival:** This is where your principle breaks. You say **Case 5 (Drifted Battle)** is history even though *all* specific content drifted except "battle happened." But you say **Case 2 (Arthur)** is *not* history, even though "war leader named Artorius fought battles" survives.
      *   *The Problem:* You are applying a stricter standard of Content Survival to Arthur than to Troy, despite stipulating structurally identical evidence. In Troy, you accept "war-ish thing" as sufficient content. In Arthur, you reject "war leader... fought some battles" as insufficient.

  ### 2. The Hard Truth: Troy vs. Arthur
  I must be straight with you: **No clean epistemic principle can save the verdict that Troy is "History" while Arthur is "Legend," given your stipulations.**

  If you stipulate that both have a real kernel (City/War vs. Leader/Battles), a gap in time, and massive mythological accretion (Gods vs. Grails), they are epistemically identical. Your gut distinction likely relies on external factors you've excluded:
  1.  **Archaeological Specificity:** We have a burnt layer at Hisarlik (Troy VIIa) that matches a siege. We do not have a specific battlefield for Badon (Arthur).
  2.  **Cultural Function:** Homeric epic was treated as a pan-Hellenic record; Arthurian romance was treated as entertainment/lineage propaganda.

  **Verdict:** You must align them. Either both are "Historical Kernels within Legendary Narratives" (History *in a sense*), or both are "Legend with Historical Referents" (Not History *properly speaking*). If you keep Troy as History, you must admit Arthur is a historical war leader obscured by legend. If you mark Arthur as Legend, you must admit the *Iliad* is not a historical report of a war, but a poem *about* a historical war. Most historiographers recommend the latter: the *story* is legend; the *referent* is history. The story does not "become" history; it *points* to it.

  ### 3. The Repaired Framework: The Dual-Track Principle
  Your confusion in **Case 3 (Exodus)** and **Case 6 (Charter)** shows you are sensing a second definition of history. You need two distinct principles to replace your single gut check.

  #### Principle A: The Testimony Threshold (History as Report)
  *A legend counts as historical testimony iff:*
  1.  **Referent:** There exists a real entity/event corresponding to the core claim. *(Bought by Case 1 & 4)*
  2.  **Causal Chain:** There is an unbroken causal chain of information transmission from the event to the record, excluding forgery or coincidence. *(Bought by Case 4 & 6)*
  3.  **Discriminating Information:** The transmission preserves at least one specific detail that distinguishes this event from any other similar event (e.g., "Troy" not just "a city," "Artorius" not just "a warlord"). *(Bought by Case 5 vs. Case 2)*

  *   **Application:**
      *   **Troy & Arthur:** Both Pass (if you accept the stipulations). They are historical testimony, albeit degraded.
      *   **Exodus:** Fails on Referent (stipulated "no trace of mass departure"). It is not history under Principle A.
      *   **Charter:** Fails on Causal Chain (forgery).

  #### Principle B: The Constitutive Threshold (History as Force)
  *A legend counts as historical fact (socially) iff:*
  1.  **Belief:** The story was believed by a relevant community. *(Bought by Case 6)*
  2.  **Causal Efficacy:** That belief caused observable real-world actions (migration, war, ritual, institution building). *(Bought by Case 3 & 7)*
  3.  **Durability:** The effects persist independently of the story's truth value. *(Bought by Case 6)*

  *   **Application:**
      *   **Exodus:** Passes. Even if the mass event didn't happen, the *story* constituted the people. It is history of the *group*, not the *event*.
      *   **Charter:** Passes. The town exists *because* of the lie. The lie is a historical cause.
      *   **Sleeping Hero (Case 7):** Passes. The rebellion is real history caused by the legend.
      *   **Troy/Arthur:** Passes (Greek identity / British nationalism).

  ### 4. Three New Test Cases
  Here are three cases to run through the Dual-Track Principle.

  **Case 8: The False Memory Implant**
  A modern state uses hypnosis and fabricated documents to convince its citizens that they won a glorious war 50 years ago (which they actually lost). The citizens build monuments, hold parades, and base foreign policy on this "victory."
  *   **Principle A (Testimony):** Fail. No Referent, No Chain.
  *   **Principle B (Force):** Pass. Belief + Causal Efficacy.
  *   **Gut Check:** Most people feel this is "propaganda," not history.
  *   **Correction:** This is where Principle B risks over-expansion. We need to add a clause to Principle B: *The effects must be publicly observable and intersubjective, not just internal belief.* Even then, this is "History of the Present," not "History of the Past." **Verdict:** This is a case where your gut should override Principle B. It is *sociological fact*, not *history*.

  **Case 9: The Accurate Forgery**
  A 12th-century monk forges a charter to grant his monastery land. He invents a King's name. 800 years later, archaeologists find a seal proving a King with that exact name *did* rule and *did* grant land to *someone* at that time, just not this monastery. The forgery accidentally matches reality.
  *   **Principle A (Testimony):** Fail. No Causal Chain (the monk didn't know the truth).
  *   **Principle B (Force):** Pass. The monastery held the land for centuries based on the story.
  *   **Verdict:** The *story* is a lie. The *content* is true. This is Case 4 (Coincidence) refined. It confirms that Truth without Chain is not History (Testimony).

  **Case 10: The Drifting Ritual**
  A community performs a dance every year commemorating a "Great Flood." Geology shows no flood occurred in the region for 10,000 years. However, the dance movements perfectly preserve the technique for building the specific type of boat used in a neighboring region 2,000 years ago, where a flood *did* happen. The people migrated, forgot the story, kept the dance.
  *   **Principle A (Testimony):** Fail. The *narrative* (Flood here) is false. The *encoded info* (Boat building) is true.
  *   **Principle B (Force):** Pass. The ritual constituted the group.
  *   **Verdict:** This is "Cryptohistory." The story is legend; the practice is historical data. This suggests Principle A needs to allow for *non-narrative* transmission (embodied knowledge).

  ### 5. What's Settled vs. Contested in the Field
  You asked for flags on the state of play.

  *   **Settled:** The distinction between *Event* and *Narrative*. No serious historian believes the narrative *is* the event. The "Exodus" verdict you leaned toward is standard in Memory Studies (Jan Assmann): it is "Foundational History" or "Mythic History," distinct from "Reconstructive History."
  *   **Contested (Reference):** Does a story need to correctly name the agent to be history? (e.g., If "Arthur" is a title, not a name, does it refer?). Realists say yes; Structuralists say the function matters more than the name.
  *   **Contested (Truth):** Can a false story be "history"? Postmodernists (Hayden White) argue all history is narrative fiction with truth claims. Positivists argue false history is just error. Your Case 6 (Charter) sits right in this fight.
  *   **Contested (The "Kernel"):** There is no agreed-upon metric for how much accretion invalidates the kernel. This is why your Troy/Arthur gut check wobbled. There is no "percentage of myth" that disqualifies a text.

  ### 6. Summary Advice for Your Group
  1.  **Drop the Troy/Arthur Distinction:** On your stipulations, they are the same category. Call them both "Legend with Historical Referents." If you call one History and the other Legend, you are smuggling in archaeological certainty (Hisarlik) that you stipulated away.
  2.  **Adopt the Dual-Track:** When someone asks "Is this history?", ask "Do you mean **Testimony** (did it happen as reported?) or **Force** (did this story make things happen?)."
      *   Exodus is Force-History, not Testimony-History.
      *   The Charter is Force-History, not Testimony-History.
      *   Troy/Arthur are weak Testimony-History, strong Force-History.
  3.  **Accept the Geoarchaeologist's Caveat:** "History" is a bucket term. Your job in the reading group is to specify which bucket you are filling. If you don't, you will talk past each other forever.

  **Final Verdict on your Gut:** Your gut is actually a sophisticated detector of *Causal Efficacy* (Exodus/Charter) masquerading as a detector of *Truth* (Troy). You feel Exodus is "history in a sense" because it *built a nation*. You feel Troy is "history" because we found the *bones of the city*. You are mixing **Ontology** (what exists) with **Epistemology** (what we know) and **Sociology** (what matters). Separate them, and the inconsistency vanishes.
