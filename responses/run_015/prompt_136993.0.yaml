answer: |-
  ### Brainstorming Exits and Costs

  Before locking in a position, I see five viable exits from this argument, each with a distinct metaphysical or jurisprudential price tag.

  1.  **Reject (1):** Accept the conclusion that omission causation is merely pragmatic.
      *   *Cost:* This destroys your project. If omissions aren't genuinely causal, legal responsibility for "letting die" collapses into a fiction, severing the link between liability and the metaphysical structure of the world.
  2.  **Reject (2):** Claim omissions *do* have powers or mechanisms (e.g., negative facts or dispositional properties).
      *   *Cost:* Metaphysically extravagant. It requires an ontology of "absences" that exert force, which sits uncomfortably with physicalism and risks making causation spooky.
  3.  **Reject (3):** Deny the profligacy. Argue that only *some* counterfactual dependencies count as causal (e.g., only those involving capacities or duties).
      *   *Cost:* Risks circularity. If you restrict causes based on duties or norms to save the metaphysics, you make causation dependent on the very normative concepts it is supposed to ground.
  4.  **Reject (5):** Accept profligacy (4) but deny that this makes causal structure merely "selected" or subjective. Argue for an abundant realist ontology where the *relation* is objective even if the *explanation* is selective.
      *   *Cost:* Makes causation less discriminating. You must explain why we cite only one cause if many exist, without conceding that the uncited ones aren't real causes.
  5.  **Reject (6):** Deny that causation must be fully objective or interest-independent.
      *   *Cost:* Undermines the authority of causal claims in science and law. If causation is purely a projection of interest, it loses its normative force in assigning blame.

  ### The Rejection: Step (5)

  I reject **step (5)**. Specifically, I reject the claim that "causal structure is not discovered but selected."

  **Defense:**
  Step (5) looks innocent because it conflates *causal ontology* (what makes something a cause) with *causal explanation* (why we cite it). The argument assumes that because we must *select* a cause for an inquiry (from the profligate list in 4), the underlying causal structure itself is a product of that selection. This is a category error.

  I defend a **realist but abundant view** (akin to David Lewis's position). The causal field is an objective, mind-independent web of counterfactual dependencies. This web is indeed abundant: my not driving the fire engine *is* a cause of the house burning, in the same metaphysical sense that the arsonist's striking the match is a cause. Both are nodes in the objective counterfactual structure. However, when we make a singular causal claim ("The arsonist caused the fire"), we are not reporting on the *existence* of the causal relation (which holds for both), but performing a pragmatic *selection* for the purposes of explanation or liability.

  By rejecting (5), I preserve (1). The claim "The gardener's not watering caused the death" is literally true because the gardener's omission is part of the objective causal fabric. It is not a *façon de parler*. The fact that we do not also cite the stranger's non-intervention in the same breath is a matter of conversational or legal relevance, not metaphysical unreality. This blocks the move to (7). Omissions are genuine causes; the "overlay" is on our *attributions*, not on the *causation*.

  ### Handling the Complications

  **1. Profligacy in Positive Causation (Double Prevention)**
  You note that step (3) applies equally to positive causation (e.g., the alarm not sounding). If I reject (5), I must accept that positive causation is equally profligate. I bite this bullet. The intuition that positive causation is "tighter" than omission causation is a psychological bias, not a metaphysical fact. In a deterministic world, every event depends on the non-occurrence of preventers. By treating positive and negative causation symmetrically under an abundantist ontology, I avoid the dualism that plagues other accounts. The cost is admitting that "cause" is a less discriminating concept than ordinary language suggests, but this is a virtue for the law: it allows us to separate the *question of causation* (is there a link?) from the *question of responsibility* (is this link the right one to litigate?).

  **2. Norm-Infected Causal Judgments**
  Empirical data shows people withhold causal status from omissions unless a norm is violated. On my view, this data reflects the *selection* mechanism, not the *causal* mechanism. Norms function as filters for relevance. When subjects say "The gardener caused the death, but the stranger didn't," they are not reporting a metaphysical difference in counterfactual dependence (which holds for both); they are reporting a difference in *default expectations*. The metaphysics remains objective (both are causes); the psychology is normative (only one is salient). This explains the data without making causation itself normative, preserving the objectivity required for (6).

  ### Pricing the Alternatives

  Since I have chosen the **realist but abundant view** (rejecting 5), here is the price of the paths I did not take:

  1.  **Normative or Reasons-Based Restriction (Rejecting 3):**
      *   *The View:* Only omissions that violate a duty or involve a capacity count as causes.
      *   *The Price:* This creates a vicious circle in legal theory. If causation depends on duty, you cannot use causation to *ground* liability, because you must establish duty first to establish causation. It collapses the *actus reus* into the *mens rea* or duty of care, making the causal element of torts or crimes redundant.

  2.  **Contrastivist Reading (Modifying 5):**
      *   *The View:* Causal claims are implicitly contrastive ("Not watering rather than watering caused death rather than life").
      *   *The Price:* While this handles the selectivity problem elegantly, it often functions as a linguistic fix that leaves the metaphysics untouched. If the contrast class is supplied by context (norms), we return to the problem of whether the *relation* is objective. It risks making causation entirely relative to the question asked, undermining its stability in legal precedent.

  3.  **Actual-Causation Framework (e.g., Halpern-Pearl):**
      *   *The View:* Use structural equation models to separate "potential causes" from "actual causes" via specific variables.
      *   *The Price:* These models are powerful but often require the modeler to stipulate which variables are "exogenous" or "default." In omission cases, deciding which non-occurrence to model as a variable often smuggles in the very normative assumptions the framework is meant to clarify. It formalizes the selection process but does not solve the metaphysical worry that the selection is arbitrary.

  By rejecting (5), I pay the price of metaphysical abundance, but I gain a clean separation between the world (which contains many causes) and our judgment (which selects the relevant ones). This is the only position that allows you to maintain that omissions are *genuinely* causal while explaining why the law rightly ignores the stranger on the street.
