answer: |-
  This is a classic tension between the normative force of Backward Induction (BI) under Common Knowledge of Rationality (CKR) and the descriptive/normative pull of epistemic uncertainty and risk. Your intuitions are not "messy"; they are tracking different decision-theoretic frameworks that apply under different assumptions.

  Here is the breakdown of the theorem, three candidate principles to organize your verdicts, and an analysis of your specific cases.

  ### 1. The Theorem: Common Knowledge of Rationality (CKR)
  Your friend is referring to the standard Backward Induction result. For this theorem to hold and force **Take at Node 1**, it requires the following assumptions:
  1.  **Common Knowledge of Structure:** We both know the payoffs, the rules, and the number of nodes.
  2.  **Common Knowledge of Rationality:** We both maximize expected utility, we both know that, we both know that we know that, ad infinitum.
  3.  **Self-Interest:** Utility depends only on own monetary payoff (no altruism/spite).
  4.  **No Correlation:** My choice does not causally or evidentially influence yours (except through the game tree).

  **Verdicts Killed:** This theorem kills *every* verdict you listed except **2-node Take** and **vs. Housemate (Take)**.
  **Verdicts Saved:** None of your "Pass" verdicts survive CKR. Under CKR, a pass at Node 1 is literally impossible; if you observe a pass, the CKR assumption is falsified, and the theory has no prediction for what happens next (it is an off-equilibrium path event).

  ---

  ### 2. Candidate Principles

  To save your intuitions without abandoning rationality, you need to relax CKR. Here are three principles that cover your terrain.

  #### Principle A: The Reputation Model (Kreps, Milgrom, Roberts, Wilson)
  **The Rule:** Play as if there is a small, non-zero prior probability that your opponent is a "cooperative type" (e.g., Tit-for-Tat or Always-Pass) rather than a rational maximizer. Maintain your own reputation as a cooperative type to exploit theirs.
  **Mechanism:** Bayesian updating. Each pass by the opponent increases the probability they are a cooperative type. Passing yourself maintains the ambiguity about whether *you* are a cooperative type, incentivizing them to pass to you.
  **Verdicts Saved:**
  *   **6-node & 100-node Pass:** Longer games increase the value of maintaining a reputation. (Explains why you are more confident at 100 nodes).
  *   **Stranger (30% pass rate):** This establishes your prior probability of a cooperative type.
  *   **Node 5 (History of Passes):** Observed passes update the probability of the cooperative type upward, justifying further passes.
  *   **Random Ending:** Removes the common knowledge of the final node, effectively creating an infinite horizon where reputation strategies are Nash equilibria.
  **Verdicts Killed:**
  *   **vs. Copy:** This model assumes independent types, not logical correlation.
  *   **High Stakes / Slow Growth:** Purely monetary reputation doesn't account for risk aversion or diminishing marginal utility.

  #### Principle B: Risk-Adjusted Expected Utility
  **The Rule:** Maximize expected *utility*, not expected *dollars*. Utility is concave (risk-averse) and potentially time-discounted.
  **Mechanism:** $U(\$x) < 2 \times U(\$x/2)$ is false; usually $U(\$2x) < 2 \times U(\$x)$. As stakes grow, the marginal utility of the 70% share may not outweigh the risk of the opponent taking at the next node.
  **Verdicts Saved:**
  *   **High Stakes:** Risk aversion dominates the growth of the pot.
  *   **Slow Growth:** The 20% growth does not compensate for the risk/time discounting.
  *   **2-node Take:** At low stakes, risk neutrality approximates linearity, so BI holds.
  **Verdicts Killed:**
  *   **vs. Copy:** Risk aversion doesn't explain why you trust a copy more than a stranger.
  *   **Node 5:** Doesn't inherently explain why history of passing makes you *more* confident unless combined with Principle A.

  #### Principle C: Evidential/Logical Correlation (EDT / Superrationality)
  **The Rule:** Treat your decision as evidence of, or logically linked to, the opponent's decision if you share a decision procedure.
  **Mechanism:** If I am playing against a copy, my decision to Pass *is* their decision to Pass. I am not choosing *my* move; I am choosing the move for *both* instances of the algorithm.
  **Verdicts Saved:**
  *   **vs. Copy:** Justifies passing based on logical correlation rather than causal influence.
  **Verdicts Killed:**
  *   **vs. Stranger / Housemate:** These agents do not share your decision procedure.
  *   **High Stakes:** Logical correlation doesn't override risk aversion.

  ---

  ### 3. Analysis of New Cases

  Here is how **Principle A (Reputation)** combined with **Principle B (Risk)** handles your new scenarios.

  **1. Pay a dollar to be bound to Take at Node 1?**
  *   **Analysis:** If you bind yourself to Take, you signal you are *not* a cooperative type. In the Reputation Model, this destroys the possibility of the pot growing. You get \$7 (70% of \$10) minus \$1 cost = \$6.
  *   **Verdict:** **Do not pay.** If your intuitive strategy (Pass a few nodes) has an expected value > \$6, paying to bind is a loss. Binding is only useful if you lack the willpower to execute the optimal strategy (akrasia), but rationally, keeping the option to Pass has value.

  **2. Three-player version (cycling moves)?**
  *   **Analysis:** Reputation becomes harder to sustain. With three players, you need *two* others to maintain reputation. The "chain" of trust is weaker. The probability that *all* others are cooperative types is the product of individual probabilities.
  *   **Verdict:** **Take earlier.** The "unraveling" force is stronger with more links in the chain.

  **3. Taker's share is 51% (vs. 70%)?**
  *   **Analysis:** This reduces the incentive to Take early (the penalty for being the one who ends the game is lower for the victim, but the reward for the taker is also lower). However, it reduces the reward for Passing. If I pass, I hope to get 51% of a larger pot later.
  *   **Verdict:** **Pass longer.** The "greed" motive to Take is dampened. The game looks more like a coordination problem to split the pot evenly at the end.

  **4. Opponent read the same textbook?**
  *   **Analysis:** This increases the Common Knowledge of Rationality. It suggests they know the BI argument. However, if they also read the *Kreps/Milgrom* papers, they know reputation.
  *   **Verdict:** **Ambiguous.** If they are dogmatic Nashians, Take at Node 1. If they are sophisticated game theorists, they may try to signal "I know the reputation model" by Passing. In practice, this usually leads to **Take at Node 1** because the coordination on *which* equilibrium (BI vs. Reputation) is difficult without communication.

  ---

  ### 4. The Commitment Case
  *The Case:* 20-node game. Opponent credibly commits to Pass until Node 18, Take at Node 18.
  *Your Gut:* Pass at 1, Take at 17.

  **Analysis:**
  This is a test of **Subgame Perfection vs. Credible Commitment**.
  1.  **If the commitment is binding (mechanical):** The opponent *cannot* Take at 17. They *must* Pass at 17. They *must* Take at 18.
      *   At Node 17 (Your turn):
          *   If you Take: You get 70% of Pot(17).
          *   If you Pass: Opponent Passes (bound). Pot doubles to Pot(18). Opponent Takes (bound). You get 30% of Pot(18).
          *   Since Pot(18) = 2 * Pot(17), 30% of Pot(18) = 60% of Pot(17).
          *   70% > 60%.
      *   **Decision:** You **Take at 17**.
  2.  **If the commitment is strategic (reputation):** The opponent is *saying* they will Take at 18 to induce you to Pass at 17.
      *   If you Pass at 17, and they are rational, they should Pass at 18 to get 70% of Pot(18) rather than 70% of Pot(17) (wait, if they take at 18 they get 70% of 18).
      *   Actually, if they Take at 18, they get 70% of Pot(18). If they Pass at 18 (final node), they get 50% of Pot(18). So a rational player *must* Take at 18.
      *   So their commitment to Take at 18 is **credible without binding** because it is their dominant strategy at that node.
      *   Knowing this, you must Take at 17 (as calculated above: 70% of P17 > 30% of P18).
      *   Knowing you will Take at 17, they should Take at 16.
      *   **Unraveling:** The commitment to Take at 18 forces you to Take at 17, which forces them to Take at 16.
      *   **Verdict:** Your gut (Pass 1, Take 17) is **sophisticated** regarding their commitment, but **naive** regarding the backward induction it triggers. If they are rational and you are rational, the commitment to Take at 18 causes the game to end at 16 (or earlier).
      *   **Is it untrustworthy?** No. It is a best response to a threat. If they want you to Pass at 17, they must commit to **Pass at 18**. But committing to Pass at 18 is not credible (irrational at that node) unless they are bound mechanically.

  **Conclusion on Commitment:**
  If the commitment is merely verbal/strategic: **Take at 1** (BI unravels the threat).
  If the commitment is mechanically binding: **Pass at 1, Take at 17**. You are exploiting their binding constraint. It is not untrustworthy; it is rational exploitation of a handicap they gave themselves.

  ### Summary Recommendation

  Adopt a **Hybrid Principle**:
  > "Maximize Expected Utility assuming a small prior probability that the opponent is a 'Cooperative Type' (Principle A), adjusted for Risk Aversion (Principle B). Update the probability of the Cooperative Type based on observed history. If the opponent is known to be a Rational Maximizer with Common Knowledge of Structure (e.g., same textbook, short game), revert to Backward Induction."

  **Why this works for you:**
  1.  **It justifies the length effect:** Longer games = higher value of reputation (saves 100-node vs 6-node).
  2.  **It justifies the history effect:** Observed passes update the "Cooperative Type" probability (saves Node 5 verdict).
  3.  **It justifies the stakes:** Risk aversion cuts off the reputation game when utility curvature bites (saves High Stakes/Slow Growth).
  4.  **It isolates the Copy case:** Treat the Copy as a special case where $P(\text{Coop}) = 1$ due to logical identity (saves Copy verdict).
  5.  **It handles the Commitment:** Distinguishes between binding constraints (exploit them) and strategic threats (unravel them).

  Your discomfort comes from trying to apply a single normative rule (BI) to a set of problems that require different epistemic assumptions. You aren't inconsistent; you are context-sensitive. Formalize the context, and the inconsistency vanishes.
