answer: |-
  The illegitimate move occurs between premise (1) and conclusion (4), where you equivocate between participants treating someone as having a reason and that person actually having one.

  Your premise (1) states that participants treat one another as having reasons. This is a psychological or sociological fact about attitudes. Your conclusion (4) states that there are things we have reason to do. This is a normative fact about justification. To bridge these, you need a hidden premise: "If a practice treats agents as having reasons, those agents actually have them." This hidden premise is substantive and normative, not descriptive. By claiming (1) is purely descriptive (as you insist in (2)), you strip it of the power to entail (4). If (1) is descriptive, the inference is invalid (Hume). If (1) is normative, your claim in (2) is false, and you haven't derived an ought from an is; you've smuggled an ought into the premises. This is the constitutivist sleight of hand your supervisor identified: you present a normative commitment as a descriptive feature of a practice.

  This is likely what your supervisor means by the naturalistic fallacy, though the terminology is often conflated. Your roommate is right that there are distinct concepts here. Moore's naturalistic fallacy concerns defining "good" via natural properties; Hume's is/ought gap concerns logical entailment from descriptive to normative premises. Your supervisor is likely invoking the Humean gap, accusing you of deriving (4) from (1) and (3) without a normative bridge. The "appeal to nature" (roommate's version) is indeed a third distinct error. Confusing these labels doesn't help, but the structural error in your argument is Humean: you cannot validly infer normative authority from mere social fact without a normative principle validating that social fact. Your supervisor's charge stands even if the label is historically imprecise.

  Regarding your defense of Hume: claiming Hume only demands an "explanation" underestimates the logical force usually attributed to the gap. While Hume's specific text in the *Treatise* is brief, the philosophical consensus treats it as a logical constraint on valid inference. Your explanation—that normative content sits in (1)—fails because (1) describes attitudes toward norms, not the norms themselves. Similarly, Moore's open question remains potent even if your seminar didn't feel it. The question "I know this practice treats me as accountable, but do I have a reason?" is not closed by definition. Intuition pumps vary by audience; philosophical validity does not. The lack of resistance from your seminar peers indicates shared intuitions, not logical closure.

  I am highly confident (90%) that the argument as stated is invalid due to this equivocation. My confidence would decrease if you granted a constitutivist account of practical reasons, showing that agency itself necessitates these norms. However, if (1) were restated to be genuinely free of normative vocabulary, the argument would definitely fail, as no logical connection exists between pure description and normative conclusion without a bridge principle. Alternatively, if you adopted a robust constitutivist account of agency—arguing that participation in such practices is inescapable for agents like us—you might ground the normativity in the conditions of agency rather than the social fact itself. However, that requires arguing that we must participate, not just that we do. This shifts the burden from anthropology to metaphysics.

  Finally, note that readings of Hume are contested; some argue he made a psychological point about motivation rather than a logical point about entailment. If Hume only meant that writers often slide between modes unnoticed, your "explanation" might suffice historically. But in contemporary metaethics, the logical gap is the standard hurdle. You cannot clear it by insisting the content is already there; you must show why the descriptive fact generates normative force. Until you defend the hidden normative bridge, the sleight of hand remains. Your supervisor is correct that you have not yet derived an ought from an is; you have merely described a community that believes it has.
