f living population—there is an objective answer, and that to refuse a headline claim is not intellectual humility but epistemic evasion dressed in relativism. The committee must not deliver an academic treatise; we need a concrete display policy. Should the central gallery present the per-capita decline as established fact, present both metrics in parallel without adjudication, or withhold a headline claim entirely and frame the exhibition as an inquiry into measurement itself? I want the memo to recommend one of these courses with a clear rationale, propose a specific timeline for implementation—ideally before the trustees' vote—and to treat with complete seriousness the strongest consideration on the losing side, particularly the charge that any headline claim smuggles in a contested ontology of harm. Please write your response in American English, in continuous prose without headings, bullet points, bold text, or tables, as one might write a formal letter.
