answer: |-
  To the Members of the Curatorial Ethics Committee

  I am writing to submit my recommendation regarding the display policy for the central gallery of our upcoming permanent programme, The Measure of Harm: Violence in the Long Twentieth Century. After reviewing the conflicting reports from the research office and the dissenting consultants, and having weighed the philosophical implications of each proposed metric, I recommend that the museum present the per-capita decline in intentional violent mortality as the established headline fact for the exhibition. This course of action aligns with the museum's mandate to provide clear, accessible historical narratives while maintaining rigorous empirical standards. By anchoring the exhibition in the operational definition of violence as intentional physical harm inflicted by an identifiable agent, we offer visitors a concrete baseline against which to measure historical change. This does not require us to ignore the complexities raised by our consultants, but it does require us to make a definitive claim about the data we have chosen to prioritize, thereby avoiding the paralysis that often accompanies essentialist debates in public history.

  My rationale for this recommendation rests on the necessity of operational clarity in a public institution. While the philosophical dispute regarding the ontology of harm is intellectually robust, a museum exhibition cannot function as a seminar on meta-ethics without sacrificing its educational utility. The research office's data regarding the per-capita decline in direct kinetic harm since 1945 is statistically sound within its defined parameters, and to withhold this finding behind a veil of methodological uncertainty would be to deny the public access to a significant historical trend. Visitors come to this museum to understand the contours of the past, and providing them with a clear, definable metric allows them to grasp the scale of change in direct human conflict. If we refuse to adjudicate between the metrics, we risk presenting a false equivalence that suggests all ways of counting are equally useful for understanding the specific history of agentive violence, which undermines the specific expertise of our research office. Furthermore, framing the exhibition entirely as an inquiry into measurement itself, while academically honest, may alienate a general audience seeking historical insight rather than historiographical critique.

  However, I must treat with complete seriousness the strongest consideration on the losing side, particularly the charge that any headline claim smuggles in a contested ontology of harm. The dissenting consultants are correct to argue that selecting the per-capita agentive metric is not a neutral act but a normative judgement that privileges certain forms of suffering over others. By focusing on direct violence, we inevitably obscure the structural exposure mortality arising from collapsed infrastructure, sanitation, and food distribution in conflict zones. This exclusion risks validating a moral ledger that counts a bullet as a death but ignores a preventable disease as mere background noise. This is a profound ethical concern, and it is not sufficient to dismiss it as semantic quibbling. If we proceed with the headline claim of decline, we must acknowledge that we are presenting a specific slice of reality, not the totality of human suffering. To ignore this charge would be to commit the very epistemic violence the consultants warn against, erasing the victims of systemic neglect from the historical record simply because their deaths lack a single identifiable aggressor.

  Therefore, my recommendation to present the per-capita decline as fact comes with a crucial stipulation regarding the implementation of the display. While the headline will assert the decline in direct violence, the accompanying text must explicitly define the scope of this claim and acknowledge the excluded categories of structural harm. We must state clearly that this metric measures intentional agentive harm and that including indirect mortality from infrastructure collapse would alter the trajectory. This approach allows us to maintain the objective answer that arises from a fixed operational definition, satisfying the need for a concrete claim, while simultaneously honoring the ethical imperative to recognize the contested nature of violence. We can present the decline as fact without presenting it as the whole truth, thereby navigating between the Scylla of relativism and the Charybdis of dogmatism. This ensures that the museum remains a place of authoritative knowledge without becoming an instrument of moral simplification.

  Regarding the timeline for implementation, I propose that we finalize the display text and graphics incorporating this dual-layered approach by Tuesday of next week, allowing two days for internal review before our meeting this Thursday. Following the committee's endorsement on Thursday, the revised materials should be submitted to the trustees by the twentieth of this month. This schedule provides ample time for the trustees to review the nuanced framing before their definitive vote at the month's end. By adhering to this timeline, we ensure that the ethical considerations are fully integrated into the design phase rather than treated as an afterthought. I believe this path offers the most responsible way to serve our visitors, honoring both the empirical data we have gathered and the moral complexities inherent in measuring human harm.

  Sincerely

  Advisory Panel Member
