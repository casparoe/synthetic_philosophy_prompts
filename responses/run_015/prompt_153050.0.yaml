  **JOINT STATEMENT OF ADVERSARIAL COLLOBORATION**
  **Subject:** Thresholds of Historicity in Foundational Narratives
  **Parties:** Event-Trace Recoveryist (ETR) vs. Morphological Integrationist (MI)
  **Date:** October 14, 2023

  **PART I: AGREED CLAIMS**

  After twelve months of dispute regarding the Trojan War, King Arthur, and the Exodus, we agree on the following baseline constraints:

  1.  All three narratives possess archaeaological correlates (e.g., Hisarlik layers, Sub-Roman Britain fortifications, Late Bronze Age Egyptian stelae), but none of these correlates line up cleanly with the textual timelines or scales provided in the legends.
  2.  The phrase 'historical kernel' is methodologically unstable; it smuggles in the assumption that a story is a nutshell waiting to be cracked, rather than a structure built over time.
  3.  We acknowledge the Schliemann boundary problem: there is a specific point in excavation where finding objects stops being confirmation of a text and starts being interpretation of a context. We disagree on where that line is, but agree it exists.
  4.  Neither side claims definitive proof of falsification for the other's model based on current data.

  **PART II: TABLE OF DISAGREEMENTS**

  | Crux (Neutral Wording & Evidence Case) | Event-Trace Recoveryist View & Prediction | Morphological Integrationist View & Prediction |
  | :--- | :--- | :--- |
  | **1. Narrative Coherence**<br>Does consistency across versions suggest a shared memory of an event or a shared literary convention?<br><br>*Evidence:* **The Tawagalawa Correspondence** (Hittite letter referencing Ahhiyawa and Wilusa) | **View:** Coherence makes historicity more likely.<br>**Prediction:** This text shows that the diplomatic geography underlying the Iliad was real. The consistency of place-names proves a memory of actual political conflicts survived the collapse, even if the heroes are embellished. | **View:** Coherence makes historicity less likely (or irrelevant).<br>**Prediction:** This text shows that scribes had a standardized vocabulary for "enemy states." The consistency proves the stability of the genre, not the event. The "war" is a function of how Hittites wrote about neighbors, not what happened. |
  | **2. Absence of Direct Evidence**<br>Is missing physical proof fatal to the claim, or expected due to decay/selection?<br><br>*Evidence:* **Cadbury Hillfort Layers** (Sub-Roman refortification vs. Arthurian timeline) | **View:** Missing evidence is par for the course; not fatal.<br>**Prediction:** Future finds or re-dating will link the 5th/6th century layers to a specific commander. The absence is due to organic decay and the ephemeral nature of post-Roman wood/earth works compared to stone. | **View:** Missing evidence is definitional; the site matters as symbol.<br>**Prediction:** No link to a specific "Arthur" will ever be found because the hillfort was chosen for the legend *because* it was already an ancient ruin. The absence proves the site was mythologized precisely because it was empty of recent history. |
  | **3. Form/Content Fusion**<br>Is the claim that story-shape determines historical truth falsifiable, or just a methodological stance?<br><br>*Evidence:* **The Merneptah Stele** ("Israel is laid waste, his seed is not") | **View:** It is a methodological stance that can be tested.<br>**Prediction:** The stele refers to a people-group existing independently of the biblical narrative form. We can separate the Egyptian record of "Israel" from the Exodus story structure and verify the entity existed outside the text. | **View:** It is a ontological claim; form creates content.<br>**Prediction:** The stele creates "Israel" as a historical category through the act of naming it in a victory list. You cannot separate the entity from the textual function. The "history" is the moment the name enters the record, not a prior event. |

  **Signatures:**

  __________________________ (ETR)
  __________________________ (MI)

  *Note: We still argue about the dating of the Thera eruption, definitly.*
