answer: |-
  You have not built a strawman. In fact, you have identified the exact fault lines where the standard liberal defense of capitalism meets the Marxist critique. Your intuitions about the "deck builder" versus the "employee," and the definition of "freedom," are precisely where Marx digs in.

  You are asking for the underlying architecture of these two views. Let's strip the paint off the walls and look at the beams.

  ### 1. The Ordinary View (Liberal Contractarianism)
  The story you described—"both sides can walk away," "freely negotiated wage," "exploitation means force or fraud"—rests on three specific philosophical presuppositions.

  **A. Property is a Thing, Not a Relation**
  In the ordinary view, property is a static object. I own the code; you owned your time. We swapped them. The transaction ends there. This view presupposes that the *product* of labor is naturally the property of the person who owned the *tools* and the *raw materials*, regardless of who did the work. It rules out the idea that labor creates a natural claim to the product that overrides prior property rights.

  **B. Freedom is Negative, Not Positive**
  Freedom here means "absence of direct coercion." If no one is holding a gun to your head, you are free. This view rules out **structural coercion**. It treats your need to eat, pay rent, and feed your family as a "natural fact" (like gravity), not a social arrangement. Therefore, the choice between "work for this wage" or "starve" is considered a free choice, because the employer didn't *create* your hunger.

  **C. Value is Subjective**
  This is the biggest hidden premise. The ordinary view assumes value is determined by what someone is willing to pay (marginal utility). If the company sells your code for millions and pays you thousands, the ordinary view says: "The market valued the *package* (code + brand + risk capital) at millions. It valued your *hour* at thousands." There is no objective measure to say you were underpaid, because price *is* value.

  **The Seam:** This system holds together only if you accept that selling your **labor power** (your capacity to work for a set time) is fundamentally different from selling a **product** (like the deck).
  *   **Deck Builder:** Sells a commodity (the deck). Owns the surplus.
  *   **Employee:** Sells a commodity (labor power). Does *not* own the surplus.
  The ordinary view says this is fair because the employer assumes the *risk*. The Marxist view says this is the mechanism of *exploitation*.

  ### 2. The Marxist View (Historical Materialism)
  Marx agrees that the exchange of wages for labor power looks fair on the surface ("a very Eden of the innate rights of man," he calls it sarcastically). But he argues the ordinary view ignores what happens *in production*.

  **A. Labor vs. Labor Power**
  You nailed this in your prompt. Marx distinguishes between **Labor** (the actual work done/value created) and **Labor Power** (your ability to work, which you rent out).
  *   You sell your Labor Power for \$100/day.
  *   It takes you 4 hours to produce \$100 worth of value (this covers your wage).
  *   But you signed a contract for 8 hours.
  *   The remaining 4 hours produce **Surplus Value**.
  The ordinary view says the employer owns that surplus because they bought your time. Marx says that surplus is unpaid labor. "Exploitation" isn't a moral slur about being mean; it's a mechanical description of this ratio. That is why a well-paid union job is still "exploited" in Marxist terms: if you generate \$500k of value and get paid \$100k, the rate of exploitation is high, even if you live comfortably.

  **B. The "Dull Compulsion of Economic Relations"**
  Marx argues that the "freedom" to quit is illusory if the alternative is destitution. You are not free to *not* sell your labor power. This is the "structural coercion" the ordinary view ignores. The "gun" is the social organization of society where access to life's necessities is mediated by money, and money is mediated by employment.

  **C. Value is Objective (Socially Necessary Labor Time)**
  Marx presupposes that value is crystallized human labor. Money is just the representation of that labor. If profit exists without labor (as in your robot case), the theory has to account for where that value came from.

  ### 3. Tackling Your Two "Brain-Breaking" Cases

  These are excellent test cases. They are often where internet arguments die, but Marxists have specific answers for them.

  **Case 1: The Worker Cooperative (The Self-Exploiting Collective)**
  *   **The Scenario:** Workers own everything, vote to work harder for less pay to compete.
  *   **Ordinary View:** This is the ideal! Freedom and ownership combined.
  *   **Marxist View:** This is still capitalist production.
      *   **Exploitation:** In the strict sense of *surplus value extraction by a capitalist class*, this is reduced or eliminated. The workers keep the surplus.
      *   **Alienation:** This remains. Why? Because the workers are still subject to the **anarchy of the market**. They do not control the *demand* for their product. They are forced by competition to act against their own well-being (voting to work harder/pay less).
      *   **The Verdict:** Marxists generally support co-ops as better than standard firms, but argue they don't solve the core problem. The "capitalist" isn't just a person; it's a **social relation**. As long as the co-op must produce for *profit* to survive in a market rather than for *use* to satisfy needs, the workers are still slaves to the accumulation of capital. They are exploiting themselves to feed the market.

  **Case 2: The Automated Warehouse (The Robot Paradox)**
  *   **The Scenario:** Almost no labor, huge profit.
  *   **The Problem:** If labor creates value, how does a robot-run factory make money?
  *   **The Marxist Answer:** This touches on the **Tendency of the Rate of Profit to Fall**.
      1.  **Individual vs. Social:** A single automated factory *does* make huge profits, but not because the robots create value. They make profit because they produce commodities *cheaper* than the social average. They capture market share from competitors who still use human labor. The profit is a **transfer** of surplus value created elsewhere in the economy.
      2.  **Constant vs. Variable Capital:** Robots are "constant capital." They transfer their own value (depreciation) to the product, but they create no *new* value. Only "variable capital" (humans) creates new value.
      3.  **The Endgame:** If *every* factory were fully automated, the total mass of profit in the economy would collapse to zero. Prices would plummet. This is why Marx argued capitalism contains a seed of its own destruction: it drives to eliminate labor (to cut costs), but labor is the only source of the profit it needs to survive.
      *   **The Verdict:** The robot warehouse doesn't break the theory; it highlights the contradiction. It shows profit becoming a purely financial extraction rather than a reflection of value creation.

  ### 4. What Would Actually Change?
  If you took the Marxian picture seriously, "higher wages" or "better benefits" would be seen as treating symptoms, not the disease. Concrete changes would look like this:

  1.  **Abolition of Labor Power as a Commodity:** You stop selling your time. Work is no longer a thing you trade for survival. This implies a fundamental shift in how access to goods is granted (e.g., decommodification of housing, food, transit).
  2.  **Production for Use, Not Profit:** The decision to make something isn't "will this sell?" but "is this needed?" This removes the "coercive law of competition" that forces the worker-co-op to vote itself pay cuts.
  3.  **Social Ownership of Means of Production:** Not necessarily "state ownership" (which can just create a boss called "The Government"), but democratic control over investment. The community decides what to build, rather than capital owners deciding where to chase the highest return.
  4.  **Reclaiming the Product:** The "code, customer list, and workaround" you mentioned would belong to the collective of workers, not a separate legal entity (the corporation) that can exist independently of the people who built it.

  ### 5. Where the Seams Show
  You asked if the ordinary practice fits together or pulls in different directions.

  **The Contradiction:** The ordinary view claims to value **Freedom** and **Property**.
  *   But to protect the **Property** of the owner (the code, the surplus), you must limit the **Freedom** of the worker (they cannot claim the product of their effort).
  *   To protect the **Freedom** of the worker (to quit), you must weaken the security of their **Property** (they own nothing they make).

  The ordinary view smooths this over by saying "They agreed to it." The Marxist view says "The agreement itself is the site of the conflict."

  **Your Intuition Check:**
  *   *Is exploitation just low pay?* No, in the Marxist view, it's the structural relationship of wage labor itself.
  *   *Is the co-op the solution?* It solves the distribution of surplus, but not the subordination of life to market competition.
  *   *Do robots break it?* They highlight the crisis of a system that needs human labor to generate profit while trying to eliminate human labor to cut costs.

  You haven't misunderstood him. You've understood him well enough to see why the ordinary world looks strange through his lens. The "strangeness" you feel regarding the code and the customer list is exactly the sensation of recognizing **alienation**: the realization that your activity congeals into a power (the company's value) that stands opposite to you and rules over you. The ordinary view asks you to ignore that feeling. Marx asks you to follow it.
