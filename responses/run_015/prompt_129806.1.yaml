      *   **Constraints:** No citations, reading lists, or named philosophers. Five-minute speech length (approx. 750-900 words).

  2.  **Deconstruct the Core Argument ("Expressive Asymmetry"):**
      *   *Traditional View:* Voting = dirty hands (compromise); Abstaining = clean hands (purity).
      *   *New View:* Abstaining isn't neutral. By not voting, you allow the winner to win by default. Therefore, you are complicit in the outcome just as much as the voter who picked the "lesser evil."
      *   *Implication:* There is no moral high ground based solely on the act of casting or withholding a ballot. Both are active choices with consequences.

  3.  **Drafting - Section by Section:**

      *   **Introduction:**
          *   Acknowledge the occasion and the speaker's status (new voter).
          *   State the personal dilemma (the recent election, the blank ballot).
          *   Set the stage: The tension between integrity and duty.

      *   **The Traditional Dichotomy:**
          *   Describe the common feeling: Voting for a flawed candidate feels like contamination. Not voting feels like purity.
          *   Introduce the doubt: Is that purity real?

      *   **Introducing "Expressive Asymmetry":**
          *   Define it simply (without jargon overload).
          *   Explain the mechanism: A blank ballot isn't silence; it's permission.
