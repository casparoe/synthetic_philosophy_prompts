answer: |-
  Good morning. Standing here, I am acutely aware of the room's composition. To my left and right sit those who have governed this town for decades, who know the weight of a signature and the cost of a compromise. And before me sit many my own age, for whom the ballot box is still a new threshold, recently crossed. I stand between these groups, not as an expert, but as a peer to one and a student to the other.

  I turned eighteen just in time for the last municipal election. It was a moment I had anticipated with a kind of reverent excitement. I imagined the act of voting as a clear transmission of my conscience into the machinery of state. But when I stood in the booth, that clarity vanished. For the council seat, I faced a choice that felt less like a selection and more like a surrender. One candidate endorsed policies I believed were unjust. The other appeared personally decent but possessed a temperament that suggested they could not govern effectively.

  I left that line blank.

  I walked out of that precinct feeling a sting of shame, but also a flicker of pride. I told myself I had refused to soil my hands. I had not endorsed injustice, nor had I enabled incompetence. I had remained pure. But in the weeks since, that pride has curdled into uncertainty. I have been asking myself: Was that blank space an act of integrity, or was it a dereliction of duty?

  Tonight, I want to think aloud about that question, using a concept I have come to call "expressive asymmetry."

  We often treat voting as a binary of moral cleanliness. We tell ourselves that the person who votes for a flawed candidate is compromised, their hands dirty with the sins of the chosen official. Conversely, we view the person who abstains as standing apart, morally untouched by the outcome. We assume that by not acting, we remain neutral.

  But expressive asymmetry suggests that this neutrality is an illusion. In a system where governance proceeds regardless of our individual participation, silence is not a vacuum. It is a permission slip. When I left my ballot blank, I did not stop the winner from taking office. I merely removed my own voice from the count that might have checked their power. My abstention expressed a specific kind of acquiescence. It said, "I will not participate in stopping this, even if I do not explicitly endorse it."

  This collapses the distance between the "pure" abstainer and the "compromised" voter. We are both bound to the outcome. The voter who chose the lesser evil acted to limit harm, accepting the burden of association to mitigate damage. The abstainer refused the burden of association, but allowed the harm to proceed unchecked. Neither of us is clean. We are simply responsible in different directions.

  To those of you who, like me, left a race blank: I want to offer comfort, but not absolution. Your hesitation was not a failure of character; it was a sign that you take your values seriously. To feel that no candidate represents you is a painful, valid civic experience. But do not mistake that pain for purity. We cannot claim to care about justice while refusing to engage in the only mechanism we have to shape it. Your silence has weight. It lands on the same scale as the vote you refused to cast.

  To those who voted for a candidate you knew was flawed: I offer respect, but not a seal of approval. You accepted the messy reality that governance is rarely about choosing the good, but often about restraining the bad. You took on the moral injury of compromise so that the community might suffer less. But do not mistake that mitigation for endorsement. A vote is not a marriage certificate; it is a tool. You are not bound to love the tool, only to wield it responsibly.

  This brings us to the officials in this room. You know better than anyone that elections are not the end of responsibility; they are merely the authorization to begin work. Whether a citizen voted for you, voted against you, or left your name blank, you govern them all. And whether a citizen voted or abstained, they are governed by you.

  So, where does this leave us? It leaves us with the understanding that there is no moral high ground to be found in the act of voting itself. There is only the ground of consequence.

  If we accept expressive asymmetry, we must admit that we are all complicit in the world we inhabit. The voter is complicit because they chose the agent of power. The abstainer is complicit because they allowed the agent to take power unchallenged. This should not paralyze us. It should mobilize us.

  It means that the ethics of voting cannot end when we leave the booth. If I vote for a flawed candidate, my duty is to hold them to the promises that justified my compromise. If I abstain because of a candidate's flaws, my duty is to work twice as hard to correct the injustices I refused to endorse.

  I am learning that civic responsibility is not about keeping one's hands clean. It is about getting them dirty in the service of something better than oneself. It is about recognizing that in a shared society, there is no such thing as a private conscience. There is only the public record of what we did, and what we failed to do, when it was our turn to speak.

  Let us leave here today not judging how we marked our ballots, but committing to what we do next. The election is over. The responsibility remains.

  Thank you.
