      *   **Key Concept:** "Expressive Asymmetry" (the idea that abstaining isn't neutral; it expresses acquiescence to the likely winner, blurring the line between the "pure" abstainer and the "compromised" voter).
      *   **Tone:** Formal but personally accountable (thinking aloud, vulnerable, not preachy).
