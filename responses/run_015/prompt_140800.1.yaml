answer: |-
  **DISCUSSION PAPER: Wychford Commons Restitution Trust**
  **TO:** The Board of Trustees
  **FROM:** [Your Name]
  **DATE:** 10 March 2024
  **SUBJECT:** Strategic Direction and Pending Applications

  **1. Purpose**
  Following the 2019 bequest, the Trust stands at a crossroads. We have the resources to make a significant impact, but our founding Deed requires us to relieve persons in necessitous circumstances *by reason of the loss of common rights effected by the Wychford Inclosure Act 1807*. Two recent applications have forced us to confront a difficulty we have avoided for sixty years: after more than two centuries, the causal link required by our Deed is historically unknowable. This paper recommends a decision on the pending applications, proposes a standing rule for future grants, and seeks consensus on the philosophical basis of our payouts to prevent further division.

  **2. The Four Theories of Payout**
  Our recent deadlock stems from trustees operating under different, incompatible theories of what a payment represents. We must choose one:
  *   **Making Whole:** Compensating a victim for a specific loss. This requires a counterfactual baseline (what would their life look like had the Commons survived?). Our historian confirms this is impossible to calculate; the population shifts were too volatile.
  *   **Unjust Enrichment:** Returning value to those from whom it was taken. This fails because our corpus comes from the Pell family (mill owners), not the enclosers. We are not returning stolen goods; we are distributing a gift.
  *   **Symbolic Repair:** Acknowledging a wrong without claiming to quantify it. This allows for grants where lineage exists, but admits the money is a gesture, not restitution.
  *   **Poverty Relief:** Directing money at need, using the historical narrative as a selection criterion only.

  If we claim to be "making whole" or "restituting," we are lying to ourselves and our applicants. The historian's report confirms we cannot establish what anyone's baseline would be. Therefore, we cannot honestly describe individual cash grants as *reparation*. We are, in reality, a poverty-relief charity with a sentimental historical constraint. Admitting this is not an abdication of duty; it is a requirement of honesty.

  **3. Analysis of Pending Applications**
  *   **Application 1 (Descendant):** The applicant meets the residency and need criteria. The genealogical link to a 1807 commoner is established. However, she cannot demonstrate her necessitous circumstances are *by reason of* the enclosure. Given the economic shifts of the industrial revolution, her poverty is likely attributable to modern wage stagnation, not 1807 land law. Granting this sets a precedent that we accept genealogical coincidence as proof of causal harm.
  *   **Application 2 (Non-Descendant):** The applicant meets the residency and need criteria. His philosophical argument (the non-identity problem) is sound: the enclosure likely enabled his existence. However, he falls outside the Deed's class of beneficiaries. To pay him is to violate our governing instrument.

  **4. The "Common Purse" Option**
  A third path has been proposed: using the corpus to purchase land and vest it in a community land trust, restoring "common" rights in kind.
  *   **Alignment:** This best honors the *spirit* of the Trust. The loss was a right to use land; the repair is a right to use land. It bypasses the impossible task of calculating individual counterfactuals.
  *   **Constraint:** Our Clerk advises this effectively rewrites the class of beneficiaries from "necessitous individuals" to "residents generally." This requires external approval (Cy-près scheme or Charity Commission order). We cannot authorize this unilaterally.

  **5. Recommendations**
  To preserve the Trust's integrity and keep the Board intact, I propose the following:

  *   **Decision on Applications:** We must **decline both applications** at this time. Applicant 1 cannot satisfy the causal test of the Deed, and paying her would commit us to a fiction of restitution we cannot sustain. Applicant 2 is ineligible under the current Deed. Paying either without resolving the underlying philosophical conflict risks legal challenge and internal fracture.
  *   **Standing Rule:** No individual grants will be made until the Board resolves the "Theory of Payout." We will pause individual distributions for six months.
  *   **Strategic Motion:** We will instruct the Clerk to prepare an application to the Charity Commission to vary the Trust's objects. The goal is to shift from individual poverty relief (which requires impossible causal proofs) to community asset restoration (the Common Purse). This acknowledges that we cannot make individuals whole, but we can restore the *type* of property that was lost.

  **6. Reasons to Remain**
  To my fellow trustees who may disagree:
  *   **For those who wish to pay Applicant 1:** I understand the desire to honor the lineage. But if we pay based on lineage alone, we admit we are not testing the "by reason of" clause. We become a lineage society, not a restitution trust. Pausing allows us to secure a legal framework that honors that lineage without lying about the economics.
  *   **For those who wish to pay Applicant 2:** I agree the need is genuine. But we are bound by the Deed. Expanding the class without Commission approval exposes us to personal liability. The Common Purse option benefits him as a resident without breaking the law.
  *   **For those who fear mission drift:** This recommendation does not abandon the 1807 Act. It acknowledges that after 200 years, cash vouchers do not repair enclosure. Restoring land does.

  We are not resigning from our duty; we are refining it to match reality. We cannot fix 1807. But we can fix how we respond to it in 2024.

  **7. Conclusion**
  We must stop pretending we can calculate historical damages. We are stewards of a moral gesture, not a court of claims. By pausing individual grants and seeking approval for a community asset model, we protect the Trust from incoherence and ensure the Pell bequest serves the Borough of Wychford in a manner that is legally sound and historically honest.

  ***

  **ADVISOR'S NOTE TO USER (CONFIDENTIAL)**

  **Confidence Level:** Moderate-High.
  The recommendation to pause and pivot is the only path that avoids legal risk (breach of trust) and moral incoherence (lying about causation). However, securing Charity Commission approval is not guaranteed, and trustee resignations are still possible if they feel strongly about immediate relief.

  **Single Premise:**
  The recommendation collapses without this premise: **The causal requirement in the Deed ("by reason of the loss...") cannot be satisfied for any living individual.**
  If your Board believes it *is* possible to prove that a specific person's poverty today is caused by the 1807 Act (despite the historian's report), this paper fails. You must force the meeting to vote on *that* factual question first. If they believe causation is provable, you cannot stop individual grants.

  **Framing Check:**
  You asked me to be plain if the framing is confused. **It is.**
  A fund endowed by mill owners (who likely benefited from enclosure) to pay for enclosure losses is not "restitution." It is philanthropy with a specific narrative. You are not making anyone whole. You are not returning unjust enrichment. You are using old money to soothe a historical conscience that belongs to people long dead.
  If you circulate the paper above, you are asking your Board to admit that the Trust's name is partially a misnomer. That is painful but necessary. If you cannot bring yourself to tell your colleagues that we are not actually doing "restitution," do not send this paper. Instead, resign. But if you stay, you must stop pretending the math works.
