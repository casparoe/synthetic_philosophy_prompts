prompt: |-
  Hey, I'm not in school or anything, just been thinking about Hamlet's speech where he asks whether it's better to live with all the suffering or just end it. I also ran into Hume's essay on suicide — he argued it's not always immoral, and he used this comparison about leaving an army post you never promised to hold. Can you read Hamlet through that specific lens? I'm wondering if Hamlet sees dying like quitting a job he never signed up for, or if he's trapped by the religious fear Hume calls superstitous. Besides the big soliloquy, where else does the play deal with people wanting to die or giving up? I want a real reading, not just turning the play into a philosphy example — tell me what Hamlet gets right or wrong about Hume's point, and what the story shows about suicide that the essay can't cover. Write it in American English, and please end with a single sentence on the last line that sums up your take.
