  I'm trying to square two things I keep reading, and I suspect I'm missing a distinction but I can't find it. Gödel's second incompleteness theorem is usually stated as saying that no consistent, sufficiently strong formal system can prove its own consistency, and Tarski's undefinability result as saying that such a system cannot define a truth predicate for its own language. Yet every logic textbook also proves a soundness theorem for the system, typically by induction on the length of a derivation, concluding that every provable sentence is true. To me this looks impossible: the soundness proof appears to require exactly the satisfaction/truth definition for the system's own language that Tarski says the system cannot have, and its conclusion that everything provable is true appears to amount to nothing more than the claim that the system is consistent. So it seems to me that the soundness theorem is either (a) secretly circular, because it assumes a truth definition Tarski rules out, or (b) a consistency claim in disguise, which Gödel says the system cannot establish. Could you sort out where I'm going wrong?

  Please structure your answer in the following sections, in this order, with roughly the indicated lengths:
  1. "The two confusions" (about 150 words): identify the distinct mistakes in my question.
  2. "Consistency versus soundness" (about 150 words): explain why the two notions differ and why one does not collapse into the other.
  3. "Where the soundness proof actually lives" (about 200 words): explain in which theory the satisfaction relation is defined, why Tarski's theorem does not block it, and what the incompleteness theorems do and do not forbid.
  4. "What is genuinely right in my question" (about 100 words): state the real limitation my question gestures at.
  Keep the answer self-contained and do not include citations or a bibliography.
