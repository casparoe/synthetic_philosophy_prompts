  TO: Program Committee
  FROM: Program Committee Member
  DATE: October 24, 2023
  SUBJECT: Decision Memo: Unrestricted Grant Cycle

  **Recommendation**

  We should award $400,000 to Cedar Vale lead remediation (Option A). We should pass on the Sable Index (Option B) and the Community College Scholarship (Option C). This decision resolves the current deadlock by prioritizing temporal counterfactuals over raw ITN scores, addressing the validity concerns raised by Dan and Priya without adopting ad-hoc scoring adjustments.

  **Finalist Analysis**

  Option C is the easiest to dismiss. While the scholarship program has solid outcome data and low verification costs, it fails the neglectedness criterion fundamentally. With half the local Rotary clubs already contributing, our marginal dollar does not unlock new capacity; it merely subsidizes existing donors. For a $700k unrestricted pot, local crowding-out makes this a poor use of capital.

  Option B, the Sable Index, is the source of our friction. It scores highest on the current ITN sheet because "Neglectedness" is maxed out (nobody else funds it) and "Importance" is assumed high (air quality). However, Dan is correct that this score is an artifact of uncertainty. The project relies on two individuals on soft money and volunteer labor. Our funding risks displacing that volunteer effort rather than adding to it. Furthermore, the value is entirely derivative—it depends on reporters and regulators acting on the data. We cannot verify those counterfactuals. The high score reflects our ignorance, not our leverage.

  Option A presents a different profile. The evidence for lead abatement outcomes is robust, and the cost per unit is known. The primary objection has been additionality: the state is already committed to fixing 60% of the lines and may eventually fix the rest. However, there is a state matching window closing in ten weeks. This creates a hard constraint that converts "eventual" state action into "immediate" action.

  **Addressing the Framework Dispute**

  We need to settle the methodological disagreement before voting. Dan argues that our ranking is broken because uncertainty inflates scores for unmeasurable causes. Priya argues we should replace "Neglectedness" with "Counterfactual Addition"—the share of good that wouldn't happen anyway.

  I argue against the proposal to shrink sub-scores toward 3 based on unverifiable guesswork. While intuitive, this penalizes causes that are intrinsically hard to measure rather than causes where we were lazy. It conflates epistemic humility with cause quality. We should not downgrade a cause simply because its metrics are complex; we should downgrade it if the counterfactual is weak.

  Therefore, Priya's conceptual shift is the superior fix, but it must be applied rigorously. Neglectedness is only useful as a proxy for additionality. When the proxy breaks—as it does with B (volunteer displacement) and A (eventual state coverage)—we must look at the underlying reality.

  Dan's point that B's score is an artifact is valid, but his implication that the ranking method is useless is too broad. The method works when inputs are honest. The failure here wasn't the multiplication; it was using "Neglectedness" as a standalone virtue rather than a proxy for leverage. By adopting Priya's lens, we validate Dan's skepticism of B without discarding the scoring sheet entirely.

  **Rationale for Option A**

  We are funding A because the counterfactual is temporal. Even if the state fixes the remaining lines in five years, lead exposure happening *now* causes irreversible harm to children currently living in those units. Accelerating remediation by five years has immense value that the state's eventual plan does not capture. The state match window creates a leverage point where our dollar buys more abatement than it would in isolation.

  Unlike B, where we are guessing whether regulators will act on data, A offers a direct physical intervention. Unlike C, we are not crowding out local donors; we are unlocking state matching funds that would otherwise expire. The additionality is not total—the state is involved—but it is significant and time-bound.

  **Amount**

  I recommend $400,000 rather than the full $700,000 cap. The state match covers a portion of the costs, and we should not over-commit until we verify the drawdown mechanics of the state window. Retaining $300,000 in reserve allows us to pivot if the state matching process stalls, or to address emergent opportunities in the next cycle. This balances urgency with fiduciary caution.

  **Next Cycle Framework**

  For the next cycle, we should amend the ITN sheet. We will keep Importance and Tractability. We will replace Neglectedness with a "Counterfactual Addition" factor (0–100%). This forces us to estimate what percentage of the outcome is truly contingent on our grant. This addresses Dan's concern about uncertainty by requiring explicit justification for leverage, and it adopts Priya's insight that neglectedness is only a means to an end. We will not adopt the score-shrinking heuristic; it adds opacity without improving accuracy.

  This decision allows us to act immediately on a high-confidence intervention while repairing our evaluation framework for the future.

  \answer{Fund: A, $400,000}
