          *   *Actually, the "Cell vs. Lysate" is stronger for the "Aggregate vs. Object" distinction.* A lysate contains all the parts but isn't an object. A cell is.
          *   *Let's choose the **Self-Assembling Viral Capsid**.*
          *   *Why:* It bridges materials science and biology. It self-assembles (causal). It has a function (protection/transport). But is it an object or just a stable configuration?
          *   *Better yet:* **The Mitochondrion**. It has its own DNA, double membrane, distinct function. Is it an object or a part of the cell?
          *   *Okay, sticking to the prompt's request for "Single Carrying Example".* Let's go with **The Ribosome**. It is a ribonucleoprotein complex.
          *   *Feature:* Catalytic function emerges only when rRNA and proteins assemble.
