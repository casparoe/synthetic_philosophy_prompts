          *   *Why Sand fails:* No functional unity.

      *   **3. Misconceptions:**
          *   *Misconception 1:* "Inter-particle forces define the object." (If they stick, they are one thing).
          *   *Intercept:* Early, when discussing adjacency/contact.
          *   *Misconception 2:* "Quantum Entanglement makes it one object."
          *   *Intercept:* Middle, when discussing causal integration. Entanglement doesn't imply macroscopic objecthood in the SCQ sense.
          *   *Misconception 3:* "Function is subjective, so composition is subjective." (Anti-realism).
          *   *Intercept:* Late, before the ontological turn.

      *   **4. Concluding Diagnostic Question:**
          *   Needs to separate "Holism" (everything is connected) from "Restricted Composition" (some things are objects, some aren't).
