  2.  **Evaluate the Student Answer against Philosophical Standards (and the Prompt Requirements):**

      *   *Claim 1: Singer & Consciousness.*
          *   *Analysis:* Singer's criterion is sentience (capacity to suffer/experience pleasure). The student correctly identifies that without phenomenal consciousness, there is no capacity to suffer.
