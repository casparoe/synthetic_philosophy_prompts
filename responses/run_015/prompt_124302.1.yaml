      *   **Defender Responses:** How would a proponent of the user's thesis absorb these? (e.g., "Nordic model relies on ethnic homogeneity," "Crisis measures are temporary exceptions").
      *   **The Propaganda Question:** Distinguish between "Propaganda" (conscious) and "Legitimation" (structural).
      *   **Novelistic Advice:** How to use this tension in the narrative.

  7.  **Refining the Tone:**
      *   Intellectual, analytical, but accessible.
      *   Respectful of the user's critical theory leanings while challenging them rigorously.
      *   Focus on the *novel* implications (character arc, conflict).

  8.  **Self-Correction/Review during drafting:**
