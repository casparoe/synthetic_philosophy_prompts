  **(Self-Correction on the Fraud Data point):** The user's thesis is that fraud is a *fiction* needed to sort. If data shows fraud is *real and high*, that undermines the "fiction" part. BUT, data consistently shows it's low. So the "fiction" claim is empirically sound. The *undermining* data would be if *removing* checks didn't change public support. Or if *high fraud* sectors (corporate subsidies) don't attract the same moral outrage. I need to focus on the *asymmetry* of outrage.

  Let's finalize the ranking.
  1. Universalism (Nordic) - Fatal to "necessity."
  2. Administrative Cost - Severe to "rationality."
  3. Crisis Solidarity - Moderate to "structural rigidity."
  4. Asymmetric Outrage - Awkward to "moral consistency."

