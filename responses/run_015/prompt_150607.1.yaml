      *   **(1) vs. (2): Non-linearity vs. Probabilistic Horizons.**
          *   If dynamics are non-linear and threshold-dependent, are "structural probabilities" even calculable? Non-linear systems often defy probabilistic forecasting because of sensitivity to initial conditions (chaos).
          *   *Severity:* High. This is a methodological friction. How do you generate probabilities from non-linear, threshold-dependent systems without falling into the linear trap you rejected in (1)?

      *   **(5) vs. (1): Reform vs. Structural Drivers.**
          *   SDT (Turchin) is often criticized for being too structuralist. If "elite overproduction" is the driver, can "institutional reform" actually stop it without reducing elites (which they won't allow)?
