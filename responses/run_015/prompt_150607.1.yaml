  5.  **Rank Tensions by Severity:**

      1.  **(1) vs. (2): Non-linearity vs. Probabilistic Forecasting.** (Methodological core). If the system is truly threshold-dependent and non-linear, assigning probabilities over multi-decade horizons is epistemologically shaky. This threatens the "Quantitative" part of "Quantitative Macrohistory."
      2.  **(3) vs. (5): Evo Psych Hardwiring vs. Reformist Agency.** (Philosophical core). If status competition is an evolutionary imperative, can institutions really redirect it sufficiently to avert collapse? This threatens the "Reformist" hope.
      3.  **(2) vs. (6): Prediction vs. Explanation.** (Journalistic practice). Easily resolved by tense (future vs. past), but needs careful wording to avoid implying hindsight bias.
      4.  **(1) vs. (5): Thresholds vs. Reversibility.** (System dynamics). Can you un-ring a bell once a threshold is crossed?

  6.  **Identify Superficial Conflict:**
      *   **(2) vs. (6).** Prediction (future) vs. Explanation (past). This is a standard distinction in philosophy of science (Hempel's asymmetry).

  7.  **Least Costly Revision:**
      *   Which commitment is easiest to tweak without collapsing the whole framework?
      *   (3) is the most vulnerable. Evo psych is controversial and often seen as reductionist. Softening (3) to "behavioral economics" or "sociological incentives" keeps the micro-foundation without the biological determinism baggage that threatens (5).
      *   *Alternative:* Tweak (2). Instead of "probabilities," use "vulnerability assessments" or "risk landscapes." This aligns better with (1)'s non-linearity.
      *   *Decision:* Tweak (2). "Probabilities" implies a distribution that non-linear systems might not support. "Structural vulnerability" or "resilience metrics" fits (1) better and keeps (5) alive. However, the prompt asks to identify if one must *go*.
      *   *Re-evaluation:* Actually, (3) is the most philosophically risky. If you lean too hard on Evo Psych, (5) looks naive. If you soften (3) to "social psychology of elites," you save (5).
      *   *Wait, looking at the prompt:* "Specify the least costly revision if one commitment must go."
