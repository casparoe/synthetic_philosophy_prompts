      *   *Self-Correction on "Least Costly Revision":* If I have to cut one, (3) is the most expendable. The Structural-Demographic theory stands on demographic/economic data, not necessarily evolutionary psychology. Evo psych is an *add-on* explanation for the mechanism. Removing it weakens the "why" but saves the "how" and the "agency."

      *   *Final check on (2) vs (6):* Is it really superficial? Journalists often confuse explaining the past with predicting the future. The commitment distinguishes them, which is good. But the *practice* of (6) might lead readers to expect (2). The tension is in the *reception*, not the logic. I will classify it as superficial logically, but practically risky.

      *   *Final check on (1) vs (5):* Non-linearity implies hysteresis (path dependence). Once you cross a threshold, you can't just go back. (5) says you can avert breakdown. This requires the reform to happen *before* the threshold. This is consistent.

      *   *Let's finalize the ranking:*
          1.  (1) vs (2): Methodological friction (Non-linearity vs Probability).
          2.  (3) vs (5): Philosophical friction (Nature vs Nurture/Agency).
          3.  (3) vs (4): Explanatory friction (Universal vs Contingent).
          4.  (2) vs (6): Rhetorical friction (Prediction vs Explanation).

      *   *Wait, looking closer at (1) and (2).* (1) says "not capturable by linear forecasting models." (2) says "restrict itself to structural probabilities." Probabilistic models *can* be non-linear (e.g., Bayesian networks, Markov chains). So (1) rejects *linear* forecasting, not *all* forecasting. This reduces the tension between (1) and (2).
      *   *Re-evaluating the biggest tension:* It's likely (3) vs (5). If status competition is evolutionary, it's hard to reform away. It's the "Human Nature" barrier to the "Reformist Optimism."
      *   *Re-evaluating (2) vs (6):* This is definitely the superficial one. Explanation $\neq$ Prediction.

