answer: |-
  Two quantitative traders, Evan and Luis, are standing at the terminal of "Providencia," a prediction market that prices outcomes of high-stakes game-theoretic scenarios involving human agents. The asset on the screen is `AGENT_42_COOPERATES_IN_PRISONERS_DILEMMA_C`. The bid-ask spread is 0.999/1.000.

  Evan, a strict Bayesian and libertarian incompatibilist, points at the screen. "This pricing is broken. You're pricing a free choice at certainty. If Agent 42 has libertarian free will, there has to be entropy in the system. A spread of one basis point implies causal determinism. Are you Thomists now? Did the Divine Decree collapse the wave function?"

  Luis, the desk's Molinist market-maker, sips his coffee. "No causal collapse. We're pricing based on Middle Knowledge. We know the Counterfactuals of Creaturely Freedom (CCFs). We know that *if* Agent 42 were placed in Circumstance C, he *would* freely cooperate. The truth value of that counterfactual is fixed pre-volitionally."

  "But you *placed* him in Circumstance C," Evan argues, pulling up the order book. "You saw the CCF, then you actualized the world where that CCF obtains. That's not knowledge, that's leverage. You're arbitraging his freedom by engineering the circumstance that guarantees the outcome. I'm going to short the 'Cooperate' share. I'll go in there as Agent 43, defect, and introduce volatility into your 'certain' pool."

  Luis shakes his head. "You can't arbitrage the CCF, Evan. If you enter the scenario and defect, then the CCF we priced wasn't 'Evan in Circumstance C,' it was 'Evan in Circumstance C-Prime.' We didn't price that one. We priced the world where you *wouldn't* try to game the metaphysics."

  "So the market is only efficient for agents who don't understand Molinism?"

  "No, the market is efficient across all feasible worlds. It's just that your attempt to defect is already included in the counterfactual package of *this* world. You think you're introducing causal uncertainty, but you're just actualizing a different conditional truth."

  Evan types furiously. "I'm executing the trade. I'm defecting. I'm going to force a settlement at zero."

  Luis watches the screen blink. "Go ahead. But check the settlement timestamp."

  Evan hits enter. The trade executes. The price holds at 1.00. The settlement log pops up.

  **SETTLEMENT DATE: PRE-CREATIVE DECREE.**
  **STATUS: ACTUALIZED.**

  Evan stares at the log. "This is impossible. The trade settled before I existed."

  "Middle Knowledge," Luis says, turning back to his monitors. "We don't hedge against what you *will* do. We hedge against what you *would* do. You didn't move the market, Evan. You just proved the underwriting was accurate."

  "That's not a prediction market," Evan mutters. "That's a script."

  "No," Luis corrects. "A script implies I wrote your lines. I just knew which play you'd choose to audition for. Now, are you buying the 'Judas' futures? The spread on betrayal is widening."
