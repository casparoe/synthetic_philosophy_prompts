prompt: |-
  i keep running into explanations of the form 'X is a costly signal of Y' — the peacock's tail, big-game hunting and meat sharing, fasts and other painful religious requirements, a degree as a filter foremployers, buying a watch you can't read the time off at a glance. sometimes I buy it, sometimes it reads like a just-so story with a bit of algebra stapled on, and I can't tell which from the paper. I don't want to read the primary literature on every case; I want a filter.

  so write me the spec. what does a costly-signalling explanation of an actual behavior have to establish before it deserves to be believed, with the case or consideration that makes each item a requirement rather than a taste? I mean the version of the claim where someone says they've explained a real trait in the world, not the version where they've shown that some equilibrium exists in a model.

  things I think belong on the list, argue with the framing:

  - that the trait has the job of changing what a reciever does, as opposed to being a cue others have learned to exploit. (I want the case that shows why this is hard, not the definition.)
  - the 'why doesn't a worse individual just do the same thing' question. my hypothesis is that the only real answer is about marginal cost differing across qualities, and that papers which just establish 'it is expensive' and stop have shown nothing. tell me if total cost ever does the work on its own, and if so in what kind of case.
  - that the audience is named, that it responds, and that responding pays it — plus what to do when there are audiences with opposed interests reading the same display.
  - waste: does the cost have to be genuinely wasteful, or only differential? is that a requirement or a Zahavi-vs-everyone-else preference?
  - that it says what would distinguish it from the explanations that predict the same trait without any signalling at all (runaway, sensory bias, direct benefit, plain mechanical constraint). this is the one I care about most — I want the list to block the failure mode where everything turns out to be a signal.
  - the origin/maintenance split: is 'how it got started' a separate requirement from 'what keeps it stable', or can one answer cover both?

  and here's the case I most want the spec to handle, because I don't think the standard list fits it: the synthetic handicap. costs that are imposed from outside and that track stake or resources rather than the quality being advertised — proof-of-work, buy-in fees, an initiation ordeal that anyone can survive if they are rich enough — and, the one I actually care about, long-form writing and video now that fluent text can be generated for approximately nothing. my guess is that these violate the 'cost tracks quality' requirement while still doing real signalling work, so either that requirement is non-negotiable and proof-of-work isn't signalling, or it needs to split into two requirements. if you split it, tell me what the weaker one has to say and what would still fail it.

  mark each requirement non-negotiable or negotiable, and flag any pair you suspect can't be jointly satisfied — my candidate is the honesty condition against the existence condition, since making the signal costly enough to deter mimics may make it too costly for the real thing to be worth emitting, but there may be a better pair. no citations, I can't check them and I don't want them. a short table at the end scoring the handful of standard explanatory templates — handicap-style, index/mechanical, runaway — against the list is fine, but the list is the deliverable.
reasoning: |-
  Here's a thinking process that leads to the suggested specification for costly signaling explanations:

  1.  **Deconstruct the Request:**
      *   **Goal:** Create a "spec" (checklist/criteria) for evaluating costly signaling explanations of real-world behaviors.
      *   **Problem:** The user is tired of "just-so stories with algebra stapled on." They want to distinguish robust explanations from weak ones without reading primary literature for every case.
      *   **Specific Inputs:** The user provided a list of potential requirements (receiver effect, marginal vs. total cost, audience identification, waste, alternative hypotheses, origin vs. maintenance) and a specific edge case (synthetic handicaps like proof-of-work or long-form writing in the age of AI).
      *   **Constraints:** No citations. Mark requirements as Non-Negotiable (NN) or Negotiable (N). Flag potential trade-offs/conflicts. Include a short scoring table at the end for standard templates (Handicap, Index, Runaway).
      *   **Tone:** Analytical, rigorous, skeptical, precise. Avoid academic fluff.

  2.  **Analyze the User's Proposed Requirements:**
      *   *Trait changes receiver behavior vs. cue:* Crucial. Signaling implies function, not just correlation.
      *   *Marginal vs. Total Cost:* The user suspects only marginal cost differences (single-crossing property) ensure honesty. Need to verify if total cost ever suffices (usually no, unless there's a hard constraint).
      *   *Audience:* Must exist, respond, and benefit (or at least not be harmed to the point of ignoring). Conflicted audiences complicate things.
      *   *Waste:* Is inefficiency required? Zahavi says yes, others say no. Need to clarify if "cost" implies "waste" or just "expense."
      *   *Alternative Hypotheses:* Critical for falsifiability. If a non-signaling model predicts the same trait, signaling isn't proven.
      *   *Origin vs. Maintenance:* Evolution often distinguishes these. A trait can be maintained by signaling even if it originated differently.

  3.  **Address the "Synthetic Handicap" Edge Case:**
      *   *Problem:* Proof-of-work (PoW), buy-in fees, or writing essays when AI exists. The cost is resource-based (time/compute/money), not necessarily quality-based (intelligence/strength).
      *   *Analysis:* In standard Handicap Principle, cost must be *lower* for high-quality individuals (marginal cost differs). In PoW, the cost is the *same* for everyone, but the *ability to bear it* differs (budget constraint).
      *   *Resolution:* This suggests a split in the "Cost Structure" requirement. One version relies on differential marginal cost (biological quality). The other relies on differential *capacity* to absorb fixed costs (economic/resource stake). Both ensure honesty, but via different mechanisms. The user's intuition is correct: the standard "cost tracks quality" phrasing is too narrow.

  4.  **Drafting the Specification (Iterative Process):**

      *   *Requirement 1: The Receiver's Payoff.* Signaling is a game. If the receiver doesn't change behavior based on the signal, it's not signaling. If the receiver changes behavior but is harmed by it (parasitic signaling), it's manipulation, not stable signaling. *Verdict: NN.*
      *   *Requirement 2: The Honesty Mechanism (Cost Structure).* This is the core. Why can't liars lie? The user's point about marginal cost is key. I need to formalize the "Single-Crossing Property" vs. "Budget Constraint." *Verdict: NN.*
      *   *Requirement 3: Alternative Explanations.* The "Everything is a signal" failure mode. Need to explicitly rule out mechanical constraints, byproducts, and runaway selection. *Verdict: NN.*
      *   *Requirement 4: Waste vs. Cost.* Does the energy have to be burned? Not necessarily. It just has to be *risky* or *opportunity-costly*. But if it's not wasteful, is it an Index? Need to distinguish Handicap (wasteful) from Index (unfakeable). *Verdict: Negotiable (depends on model type).*
      *   *Requirement 5: Origin vs. Maintenance.* Evolution is path-dependent. A trait can be exapted. We care mostly about maintenance for current behavior. *Verdict: Negotiable (Maintenance is NN, Origin is N).*
      *   *Requirement 6: The Synthetic Handicap Split.* Address the user's specific concern. Split the Cost requirement into "Quality-Linked Cost" and "Stake-Linked Cost."

      *   *Conflict Check:* The user suggested Honesty vs. Existence (too costly to emit). This is the "Signal Viability" tension. If the cost is too high, no one signals. If too low, everyone lies. There must be a zone where high-quality signalers gain net positive fitness/utility. *Flag this.*

  5.  **Refining the "Synthetic Handicap" Logic:**
      *   Standard Handicap: Cost $C(q, s)$. $\partial C / \partial s$ is lower for high $q$. (Marginal cost of signal $s$ decreases with quality $q$).
      *   Synthetic/Stake: Cost $C(s)$ is fixed, but Benefit $B(s)$ or Ability to Pay depends on Stake $k$. Or, Cost is fixed, but Survival probability drops more for low-resource individuals.
      *   Actually, for PoW or initiation fees: The cost is fixed. The *constraint* is the resource. Low-resource individuals *cannot* pay it. High-resource can. This is a "Screening" model rather than a pure "Signaling" model in some economics literature, but in biology/anthro, it's often lumped in.
      *   *Decision:* I will classify this under the Honesty Mechanism. It requires a modification of the standard condition. Instead of "Marginal cost differs," it becomes "Net cost relative to capacity differs."

  6.  **Developing the Scoring Table:**
      *   Templates: Handicap (Zahavi), Index (Maynard Smith), Runaway (Fisher).
      *   Criteria: Receiver Payoff, Honesty Mechanism, Alternative Ruling-Out, Waste, Viability.
      *   Handicap: Passes most, requires waste.
      *   Index: Fails waste (it's a constraint), passes honesty (physical impossibility).
      *   Runaway: Fails honesty (can be unstable), fails receiver payoff (often arbitrary).

  7.  **Final Review against Constraints:**
      *   No citations? Check.
      *   Mark NN/N? Check.
      *   Flag conflicts? Check.
      *   Address Synthetic Handicap? Check.
      *   Tone check: Keep it sharp. "Algebra stapled on" vibe needs to be countered with rigorous logic.

  8.  **Writing the Content (Mental Sandbox):**
      *   *Intro:* Acknowledge the fatigue. Define the scope (empirical claim, not just model existence).
      *   *The Spec:* Go through the points.
      *   *Point 1 (Receiver):* Make sure to distinguish from *cue*. Cue: I see you are tall, I infer strength. Signal: I stand on tiptoes to look tall. The behavior must be *for* the inference.
      *   *Point 2 (Honesty):* Address the marginal cost vs. total cost. Total cost alone never works (rich liar problem). Must be differential burden.
      *   *Point 3 (Alternatives):* This is the "Null Hypothesis" requirement.
      *   *Point 4 (Synthetic):* Split the cost condition.
      *   *Conflict:* The "Viability Zone."
      *   *Table:* Keep it tight.

      *(Self-Correction during drafting)*: I need to be careful with the term "Synthetic Handicap." In economics, this is often "Bonding" or "Screening." In the context of the user's question (writing, PoW), it's about *sunk cost as proof of stake*. I should clarify that this shifts the signal from "I am high quality" to "I am invested." That's a different semantic claim but structurally similar. I will treat it as a variation of the Honesty Mechanism.

      *(Refining the Waste requirement)*: Is waste required? For an Index (roar depth = throat size), no waste is needed, just physical linkage. For a Handicap, yes. So "Waste" shouldn't be a universal requirement for *signaling*, but for *handicap signaling*. I will make this distinction clear.

      *(Refining the Origin/Maintenance)*: User asked if they are separate. In evolutionary bio, yes. In cultural evolution, less so. I'll mark Maintenance as NN, Origin as N.

      *(Final Polish)*: Ensure the "Synthetic" section directly answers the user's worry about long-form writing in the AI age. The cost isn't biological quality, it's *time/opportunity* which correlates with *commitment/stake*.

  9.  **Final Output Structure:**
      *   Preamble: Setting the ground rules.
      *   The Spec (6 Items).
      *   The Conflict Flag.
      *   The Synthetic Handicap Resolution.
      *   The Scoring Table.

      *(Wait, one more check on the "Receiver Payoff")*: The user asked: "that the audience is named, that it responds, and that responding pays it." Does responding *have* to pay the receiver? In stable equilibria, yes (otherwise they stop listening). But in parasitic signaling (manipulation), no. I should specify that for a *stable* signaling system, the receiver must benefit (or at least break even) on average.

      *(Wait, one more check on "Total Cost")*: User asked: "tell me if total cost ever does the work on its own." Answer: No, not for honesty. Total cost explains *prevalence*, marginal cost explains *honesty*. I need to be explicit there.

      Okay, ready to write.s
answer: |-
  Here is the specification for evaluating a costly-signaling explanation as an empirical claim about the world, rather than a mathematical possibility.

  ### The Spec: Six Requirements for a Valid Signaling Claim

  **1. The Receiver's Algorithm (Non-Negotiable)**
  *   **Requirement:** You must identify a specific receiver whose behavior changes conditional on the signal, and demonstrate that ignoring the signal leads to a worse payoff for that receiver than attending to it.
  *   **Why it's hard:** It is easy to show a correlation (Trait X exists, Observers Y react). It is hard to show the reaction is *caused* by the information content of X rather than a direct physical effect of X.
  *   **The Trap:** Confusing a **cue** with a **signal**.
      *   *Cue:* A stag's body size is visible. A rival sees it and flees. The size wasn't produced *to* be seen; it's a byproduct of growth.
      *   *Signal:* The stag roars. The roar costs energy and risks attracting predators. It is produced *to* be heard.
      *   *The Test:* If the trait were invisible/undetectable, would the organism still produce it? If no, it's likely a cue or mechanical constraint. If yes, it's a candidate signal. Furthermore, if the receiver stopped responding, would the sender stop producing? If no, it's not signaling.

  **2. The Honesty Mechanism (Non-Negotiable)**
  *   **Requirement:** You must specify why a low-quality (or low-stake) sender cannot mimic the signal. "It is expensive" is insufficient.
  *   **The Case:** Total cost never ensures honesty on its own. If a signal costs 100 units, and a liar can pay 100 units to gain a benefit of 150, they will lie.
  *   **The Rule:** Honesty requires **differential burden**.
      *   *Standard Handicap:* The marginal cost of the signal must be lower for high-quality individuals. (A strong peacock loses less survival probability per ounce of tail than a weak one).
      *   *Synthetic/Stake (Your Edge Case):* The cost may be fixed, but the *capacity to absorb loss* must differ. (A rich initiate loses less utility from a buy-in fee than a poor one; a committed writer loses less opportunity cost from writing than a spammer).
  *   **Failure Mode:** Papers that establish "Signal S costs C" without establishing "Cost C hurts Low-Type more than High-Type" have explained nothing.

  **3. The Null Hypothesis Exclusion (Non-Negotiable)**
  *   **Requirement:** The explanation must explicitly rule out at least two non-signaling alternatives that predict the same trait.
  *   **The Candidates:**
      *   *Mechanical Constraint:* The trait is physically unavoidable (e.g., deep voice comes from large throat).
      *   *Sensory Bias:* The trait exploits a pre-existing receiver preference unrelated to information (e.g., red berries are visible, so males turn red).
      *   *Direct Benefit:* The trait helps the receiver directly, not by informing them (e.g., nuptial gifts are food, not just displays).
      *   *Runaway Selection:* The trait is arbitrary and self-reinforcing, not informative of quality.
  *   **Why:** Without this, "signaling" becomes a tautology where any conspicuous trait is retrofitted as a signal. You need a prediction that signaling makes which the others do not (e.g., signaling predicts the trait will be *more* costly than necessary for the physical task; mechanical constraint does not).

  **4. The Viability Zone (Non-Negotiable)**
  *   **Requirement:** You must show that high-quality senders gain a net positive benefit from signaling.
  *   **The Conflict:** This is the tension you suspected between **Honesty** and **Existence**.
      *   To prevent lying, the cost must be high enough to deter low-types.
      *   To ensure existence, the cost must be low enough that high-types still profit.
      *   If the cost required to deter liars exceeds the benefit for truth-tellers, the equilibrium collapses (no one signals).
  *   **The Test:** A model that proves an equilibrium exists mathematically but does not show the parameter space is biologically/economically plausible (e.g., requires a 90% mortality rate for the signal to work) fails this spec.

  **5. Waste vs. Linkage (Negotiable)**
  *   **Requirement:** Determine if the cost is **wasteful** (Handicap) or **linked** (Index).
  *   **The Distinction:**
      *   *Handicap:* The cost is burned energy/risk with no direct utility (Peacock tail). Waste is required here to prove the signal is honest.
      *   *Index:* The signal is physically tied to the quality (Roar depth). Waste is *not* required; impossibility of faking is the mechanism.
  *   **Why Negotiable:** You can have valid signaling without waste (Index). But if you claim a Handicap, waste is non-negotiable. Many papers conflate the two, claiming a trait is an Index when it looks wasteful, or vice versa.

  **6. Maintenance vs. Origin (Negotiable)**
  *   **Requirement:** Maintenance is Non-Negotiable; Origin is Negotiable.
  *   **The Logic:** Evolution and cultural selection are path-dependent. A trait may have originated as a byproduct (spandrel) and later been co-opted for signaling (exaptation).
  *   **The Test:** A signaling explanation is valid if it explains why the trait *persists* at its current cost level, even if it doesn't explain the first mutation. However, if the origin story requires a leap that violates Requirement 4 (Viability) at the start, the maintenance story is suspect.

  ---

  ### The Conflict Flag

  **Honesty vs. Viability (The "Zone of Stability")**
  You correctly identified the tension. The most common failure mode in signaling papers is solving for Honesty (making the cost high enough to stop liars) while ignoring Viability (making the cost so high that truth-tellers starve).
  *   **The Red Flag:** Any explanation where the signal cost approaches the total resource budget of the sender. If the signal costs 80% of your energy, and the benefit of mating/hiring is 20% of your fitness, the math implies the trait should be selected *against*, even if it is honest.
  *   **Resolution:** A valid spec requires the author to demonstrate the "spread." The benefit to the high-type must exceed the cost, while the benefit to the low-type (if they mimicked) must be *less* than the cost. If the paper only shows the latter, it is incomplete.

  ---

  ### The Synthetic Handicap Resolution

  Your intuition on "Synthetic Handicaps" (Proof-of-Work, initiation fees, long-form writing in the AI age) is correct. They violate the standard "Marginal Cost tracks Biological Quality" requirement but still function as signals.

  **The Split:**
  You must split Requirement 2 (Honesty Mechanism) into two distinct sub-types. A paper must specify which one it is claiming.

  1.  **Quality-Linked Cost (Biological Handicap):**
      *   *Mechanism:* $Cost(Signal, Quality)$. High quality reduces the marginal cost of the signal.
      *   *Example:* Running speed. Fit animals run faster with less physiological damage.
      *   *AI Test:* Fails. AI can generate text at near-zero marginal cost regardless of "truth."

  2.  **Stake-Linked Cost (Economic/Commitment Screen):**
      *   *Mechanism:* $Cost(Signal)$ is fixed or linear, but $Utility(Cost)$ varies by **Resource/Stake**.
      *   *Example:* Proof-of-Work. The compute cost is the same for everyone. But a spammer (low stake per message) cannot afford it. A legitimate user (high stake per message) can.
      *   *Example:* Long-form writing. The time cost is high. A scammer (looking for quick hits) cannot amortize this cost over enough victims. A genuine expert (building reputation) amortizes it over a career.
      *   *The Requirement:* For Synthetic Handicaps, the paper must establish **Amortization Potential**. The sender must have a future stream of benefits that allows them to recoup the sunk cost, which the mimic lacks.
      *   *Why it works:* It signals "I am not a fly-by-night operator," not necessarily "I am high biological quality."

  **What fails the Synthetic Spec:**
  *   If the mimic has the same amortization potential as the sender (e.g., a scammer can also build a long-term reputation to recoup writing costs), the signal collapses.
  *   If the cost is sunk but provides no *future* leverage to the sender, it is just waste, not signaling.

  ---

  ### Scoring Table: Explanatory Templates

  | Requirement | Handicap (Zahavi) | Index / Mechanical | Runaway (Fisher) | Synthetic / Stake |
  | :--- | :--- | :--- | :--- | :--- |
  | **Receiver Payoff** | **Pass** (Info gained) | **Pass** (Info gained) | **Fail** (Arbitrary preference) | **Pass** (Risk reduced) |
  | **Honesty Mechanism** | **Pass** (Diff. Marginal Cost) | **Pass** (Physical Constraint) | **Fail** (Unstable) | **Pass** (Diff. Capacity/Stake) |
  | **Null Exclusion** | **Warn** (Often ignores Index) | **Pass** (Hard to fake) | **Warn** (Ignores Info value) | **Warn** (Often ignores Quality) |
  | **Waste Required?** | **Yes** (Non-Negotiable) | **No** (Inefficient) | **Yes** (Often extreme) | **Yes** (Sunk Cost) |
  | **Viability Zone** | **Risk** (High cost danger) | **Safe** (Constraint bound) | **Risk** (Can collapse) | **Safe** (Economic constraint) |
  | **Best For** | Biological fitness, Health | Strength, Size, Age | Aesthetic traits, Culture | Commitment, Spam-filtering |

  **How to use this table:**
  If a paper proposes a Handicap explanation for a trait that looks physically constrained (Index), it fails **Null Exclusion**. If a paper proposes Runaway for a trait that clearly helps survival (e.g., camouflage), it fails **Receiver Payoff**. If a paper proposes Synthetic Signaling (like writing) without explaining why the mimic cannot amortize the cost (e.g., why AI spammers can't write long essays), it fails **Honesty Mechanism**.
