answer: |-
  This is a classic dispute in decision theory and moral philosophy, touching on David Gauthier's *Morals by Agreement*, Parfit's *Reasons and Persons*, and the distinction between act-rationality and dispositional rationality. You and your friend are reenacting a debate that has occupied philosophers for forty years.

  Here is the point-by-point adjudication of your exchange, followed by a committed verdict on the coherence of "rational irrationality."

  ### Move 1: The "Shadow" Objection vs. Pre-commitment
  **Friend:** You cannot rationally decide to become irrational; the decision itself presupposes rationality.
  **You:** We do this via pre-commitment (Odysseus, contracts, burning bridges).

  **Adjudication:** **You win this move.**
  Your friend's "shadow" metaphor is rhetorically pretty but philosophically weak. It conflates the *state* of being irrational with the *act* of choosing a strategy. Decision theory explicitly recognizes "pre-commitment strategies." If I know my future self will succumb to temptation (akrasia), it is rational for my present self to restrict my future options. The fact that the *choice* to restrict is rational does not negate the fact that the *restriction* is designed to bypass future rational calculation. Your friend is describing a performative contradiction that does not exist; there is no contradiction in a rational agent designing a system that bypasses their own future rationality.

  ### Move 2: Physical Constraint vs. Dispositional Change
  **Friend:** Odysseus was physically constrained but mentally rational. The drug changes your preferences/decision procedure. That is becoming a different agent, not self-binding.
  **You:** (Implicitly defended the drug as a valid tool).

  **Adjudication:** **Your friend wins the distinction, but loses the implication.**
  Your friend is technically correct that there is a difference between *binding* (Odysseus) and *disposition-changing* (the drug). Odysseus still *wanted* to steer toward the sirens; the hitchhiker on the drug *does not want* to rob. This is a crucial distinction in decision theory (often discussed regarding "resolute choice" vs. "sophisticated choice").
  *However*, your friend tries to use this distinction to prove incoherence, and that fails. Whether I bind my hands or rewire my brain, the structural logic is identical: Present-Me alters the conditions for Future-Me to secure a better outcome. The fact that the drug changes the "decision procedure" does not make the strategy incoherent; it just makes it more thorough. Your friend identifies a nuance but fails to show why that nuance breaks the logic of the choice.

  ### Move 3: Reliability vs. Stipulation
  **Friend:** An irrational agent is an unreliable instrument. The drug might have side effects.
  **You:** That is an empirical objection. In the thought experiment, the drug works perfectly.

  **Adjudication:** **You win this move decisively.**
  Your friend has committed a category error. You are debating the *conceptual coherence* of rational irrationality; your friend is objecting to the *engineering feasibility* of a specific drug. In philosophical thought experiments, we are entitled to stipulate that the mechanism works as described (just as we stipulate the trolley has no brakes or the violinist is attached to your kidneys). If the drug reliably produces the disposition without side effects, the expected-utility calculation holds. Your friend is trying to dissolve a logical puzzle with practical skepticism.

  ### Move 4: Reductio of Rationality vs. Moving Goalposts
  **Friend:** If the drug makes you keep promises, that's morality, not irrationality. This shows narrow self-interest is flawed, not that rational irrationality works.
  **You:** You started by claiming incoherence; now you're attacking the definition of rationality.

  **Adjudication:** **Your friend wins the philosophical insight; you win the debate logic.**
  This is the crux. Your friend has effectively conceded that the *strategy* works (you should take the drug) but is fighting over the *label*. They are arguing that if a disposition leads to better outcomes, it should be defined as "rational" (Constrained Maximization), rendering the term "rational irrationality" an oxymoron.
  This is actually Parfit's own conclusion: Self-Interest Theory is "self-defeating" because it tells us to abandon itself. However, your friend started by claiming the notion was *incoherent* (logically impossible). By Move 4, they have shifted to claiming it is *misdescribed* (normatively suspect). You are correct to call this out as shifting ground. The coherence of the *choice* remains intact even if we rename the resulting disposition "broad rationality."

  ### Overall Verdict

  **Who is more right?**
  **You are.**

  Your friend's opening gambit was that "rational irrationality" is logically incoherent (like a square circle). Every move they made subsequently demonstrated that it is *not* logically incoherent, but rather that they dislike the implications or the terminology.
  1.  They admitted pre-commitment is possible (Move 1).
  2.  They admitted the drug could work, provided it was reliable (Move 3).
  3.  They admitted the strategy yields better outcomes, arguing only about whether to call the result "moral" or "rational" (Move 4).

  You successfully defended the core claim: It is logically coherent for an agent to rationally choose to adopt a disposition that violates narrow, act-by-act rationality in order to secure a better global outcome. Your friend retreated from a claim of impossibility to a claim of semantics.

  **The Status of the Concept:**
  The concept of **"rational irrationality" survives intact**, but it requires precise formulation to avoid the semantic confusion your friend latched onto.

  To be philosophically robust, the concept should be reformulated as **"Rational Disposition Selection."**
  *   **Act-Rationality:** At the moment of action (inside the car), robbing is rational (narrow self-interest).
  *   **Disposition-Rationality:** At the moment of choice (in the desert), adopting a disposition that prevents robbing is rational.

  The paradox arises only if we insist there is only one definition of rationality. If we accept that rationality can apply to *dispositions* and not just *acts*, the incoherence vanishes. Your friend was right that the term is slippery, but wrong that the underlying logic is broken.

  **Final Ruling:** You win the argument. The notion is coherent. Your friend successfully identified that the paradox indicts narrow self-interest theory, but failed to prove that the choice itself is impossible or irrational. The hitchhiker should take the drug, and calling that choice "rational" is correct, even if the resulting behavior violates narrow rational norms.
