  This is a classic metaphysical bottleneck, and Marta is right to be rigorous. If your magic system's ontology is shaky, the emotional stakes of the third act will feel unearned. Marta isn't just being pedantic; she's stress-testing the *moral weight* of your characters' choices.

  Based on her five verdicts, she is not running a standard Parfitian view (where identity doesn't matter, only psychological continuity). She is running a **Uniqueness-Constrained Hybrid View**. She treats Identity as a binary switch (You Are or You Aren't), not a spectrum, and she privileges **Physical Continuity** whenever it competes with **Psychological Reconstruction**.

  Here are the three rules that fit her data, how they apply to your new chapters, and how to trap her at dinner.

  ### The Three Candidate Rules

  **1. The Non-Branching Psychological Continuity View (Shoemaker/Parfit)**
  *   **The Rule:** You survive if there is psychological continuity *and* no branching. If two people claim your psychology, neither is you.
  *   **Fits Verdicts:** 1 (Transit), 2 (Swap), 4 (Two Bodies).
  *   **Fails Verdict:** 3 (Double-Build). This rule usually says if Earth and Mars are psychologically identical, they have *equal* claim. Marta says Earth wins.
  *   **Fails Verdict:** 5 (40-Year Scan). This rule usually allows long gaps if the chain is causal. Marta says the gap breaks the chain.

  **2. The Closest Continuer Theory (Nozick)**
  *   **The Rule:** You are whoever is causally closest to you, *provided* no one else is as close or closer.
  *   **Fits Verdicts:** 1 (Reconstruction is closest), 3 (Earth is physically closer), 4 (Both equal distance = neither wins).
  *   **Fails Verdict:** 5 (40-Year Scan). A 22-year-old clone might be "closer" psychologically than a dead man, but Marta rejects him. This implies a *threshold* of connection, not just relative closeness.

  **3. The "Physical Anchor" Hybrid (Marta's Actual Rule)**
  *   **The Rule:** Identity rides on the **Original Physical Substrate** as long as it is biologically alive. If the substrate is destroyed, Identity can transfer to a Reconstruction *only if* the transfer is unique (no branching) and the psychological gap is minimal. **Identity cannot be inherited by a copy after the Original dies.**
  *   **Fits All Verdicts:**
      *   *1 & 2:* Substrate destroyed or gradually swapped without competitors = Identity transfers.
      *   *3:* Substrate survives = Identity stays with Substrate. Copy is excluded forever.
      *   *4:* No Substrate + Branching = Identity extinguished.
      *   *5:* Reconstruction exists, but Psychological Gap exceeds threshold = Identity extinguished.

  ### Predictions for Your New Cases

  Here is how Marta will rule based on **Rule 3 (The Physical Anchor)**, which is the only one that accommodates her heat on Verdict 3 ("Mars one still wouldn't become him").

  **Case 1: The "Wet" Failure (Vegetative Earth, Perfect Mars)**
  *   **Who is Teo?** While the Earth-remnant lives, **the Earth-remnant is Teo.** It is the Original Substrate. The Mars body is a Copy, regardless of psychological fidelity.
  *   **After the Remnant Dies:** Teo ceases to exist. The Mars body does *not* become Teo. It remains a Copy with a false claim. (This is directly supported by Verdict 3: "if the Earth one got hit by a bus... the Mars one still wouldn't become him").
  *   **The Daughter's Dilemma:** For Marta, **there is no dilemma.** The daughter sits at the Earth-remnant's bedside. That is her father. Sitting with the Mars-Teo would be sitting with a stranger who loves her.
  *   **The Tragedy:** The tragedy isn't "which one is real?" The tragedy is that the *real* father is gone (psychologically), and the *real* stranger (Mars) believes he is the father. The daughter must choose the biological truth over the emotional connection.

  **Case 2: The Scanner Collision (Teo + Aris Merge)**
  *   **Does Teo Survive?** **No.** Neither does Aris.
  *   **Who Walks Out?** A third person. A "Fusion."
  *   **Why?** Verdict 4 establishes that branching (1 input -> 2 outputs) destroys identity. Marta will rule that merging (2 inputs -> 1 output) also destroys identity because the causal chain for *both* is interrupted by the injection of the other. You cannot be two people; therefore, a blend is neither.
  *   **Emotional Valence:** **Horror.** This is not survival; it is execution for both men.
  *   **Does the Ratio Matter?** **No.** Whether it's 90-10 or 50-50, the *uniqueness* constraint is violated. Teo is not Teo if he contains Aris's causal history.
  *   **Fear Level:** Teo should be **more frightened** of this than ordinary transit. Ordinary transit is survival (Verdict 1). Merger is death.

  ### Best Guess: Which Rule is She Running?

  Marta is running **Rule 3: The Physical Anchor Hybrid.**

  **Why?**
  The smoking gun is Verdict 3. Most philosophy graduates who read Parfit will argue that if the Earth-Teo dies, the Mars-Teo *inherits* the identity (or that identity doesn't matter). Marta's insistence that "the Mars one still wouldn't become him" reveals she believes Identity is **Historical and Non-Transferable.**

  She believes you are your history, anchored in your matter. If the matter survives, it keeps the history, even if broken (Verdict 3). If the matter is destroyed, the history can jump *once*, provided it doesn't split (Verdict 1 & 4) and doesn't skip too much time (Verdict 5).

  **How to write the chapter:**
  Write the daughter's choice as **settled by law/custom, but agonizing for her.** The society likely treats the Earth-remnant as the legal person. The drama comes from her *wanting* to sit with the Mars-Teo (who can hug her back) but knowing, per Marta's rule, that her father is the vegetable in the other room.

  ### The Dinner Test: How to Pin Her Down

  You need a case that separates **Physical Priority** from **Psychological Thresholds.** You know she accepts Transit (Psychology wins over Matter) but also accepts Earth-Teo (Matter wins over Psychology). The boundary is *when the Matter is still alive.*

  **Spring this case on her:**
  > "Teo goes into the scanner. The machine malfunctions. It builds the Mars body perfectly, but it *fails to destroy* the Earth body. However, the Earth body is instantly rendered brain-dead. It is biologically alive on life support, but there is zero electrical activity in the cortex. It will never wake up. The Mars body wakes up normal.
  >
  > **Question:** Is the brain-dead body Teo? Or is the Mars body Teo? And if we turn off the life support on Earth, does Mars *then* become Teo?"

  **Why this pins her:**
  *   **If she says Earth is Teo:** She is a hardline **Biological Animalist**. The "spark" of life matters more than the mind. (This makes your Wet Failure chapter very dark).
  *   **If she says Mars is Teo:** She is a **Psychological Continuity** theorist. She believes Verdict 3 (Earth wins) only applied because Earth-Teo was *functional*. If Earth is gone mentally, Identity transfers. (This creates the dilemma you want for the daughter).
  *   **If she says "Neither until Earth dies, then Mars becomes Teo":** She violates her own Verdict 3 ("Mars one still wouldn't become him").

  **My bet:** She will say **Earth is Teo.** Because for her, the *destruction* of the original body is the price of transfer. If the price isn't paid (the body isn't destroyed), the transfer doesn't happen, even if the body is empty. This confirms the "Physical Anchor" rule and validates the tragic ending for your daughter character.
