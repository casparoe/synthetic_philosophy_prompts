  Study stands alone and knows no need.
  It walks beyond where prejudices stray.
  All other hungers tire of what they feed.

  No crowd's applause can make the truth recede.
  While fame waits on the public's fickle sway.
  Study stands alone and knows no need.

  The lover begs for return they cannot seed.
  And pleasure pales before the coming day.
  All other hungers tire of what they feed.

  A tired body makes the spirit bleed.
  But thought runs clear when flesh is worn away.
  Study stands alone and knows no need.

  No reciprocity must intercede.
  It holds its ground when fortunes decay.
  All other hungers tire of what they feed.

  Let glory seek the voice that will concede.
  Yet love still offers warmth along the way.
  Study stands alone and knows no need.
  All other hungers tire of what they feed.
