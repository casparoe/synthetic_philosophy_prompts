answer: |-
  Here is a defended ranking and drafting strategy for your occupancy agreement, based on the constraints of scarce clauses, volunteer legal counsel, and the need for member intelligibility.

  ### The Ranking

  1.  **Non-Domination (Republican Liberty)** — *The Structural Foundation*
  2.  **Non-Interference (Negative Liberty)** — *The Baseline Protection*
  3.  **Capability (Positive Liberty)** — *The Specific Obligation*

  ### The Criteria

  I am ranking these based on three criteria, weighted for your specific context (a volunteer-run co-op with limited legal bandwidth):

  1.  **Downstream Drafting Leverage:** How many specific, enforceable clauses does this concept generate? A concept that remains abstract is "drafting noise." A concept that forces specific procedural mechanisms is high leverage.
  2.  **Member Intelligibility & Contestability:** Can a member without a philosophy degree understand when this right is violated and how to cite it in a dispute? If it requires a theorist to interpret, it will fail in practice.
  3.  **Risk of Paternalism or Liability:** Does this clause invite the Board to decide what is "good" for members (paternalism) or create open-ended financial obligations (liability)?

  ---

  ### Defense of the Ranking

  #### 1. Non-Domination (The Structural Foundation)
  **Why it wins:** This is the only conception that addresses the *power relationship* inherent in a co-op. You are not just tenants; you are member-owners subject to a Board and Manager. Non-interference protects your unit; non-domination protects your *status* within the organization.

  **Does it collapse into Non-Interference + Appeal?**
  No, provided you draft it correctly. A standard appeal clause reviews a decision *after* it is made. Non-domination requires that the *discretion* to make the decision be constrained *beforehand* by the requirement to track member interests.
  *   **Drafting Noise vs. Load-Bearing:** If you define "arbitrary" merely as "against the rules," it collapses into rule-following. If you define it (as you suggested) as "failure to track interests affected members could openly avow," it forces **transparency and justification**.
  *   **Concrete Clause:** Do not write "Members shall not be dominated." Write: *"Board discretion is limited to criteria publicly ratified by membership. Decisions affecting individual tenure or financial liability must include a written justification referencing specific ratified criteria."*
  *   **Why Top Rank:** It solves the "Automated System" and "Agenda Power" problems (see below) better than the other two. It forces the machinery of contestability to exist, not just the right to use it.

  #### 2. Non-Interference (The Baseline Protection)
  **Why it is second:** This is the "quiet enjoyment" standard. It is essential, but it is insufficient for a co-op. It protects you from the Board entering your unit without notice, but it does not protect you if the Board refuses to fix the roof (which interferes with your life but doesn't enter your unit).
  *   **Drafting Leverage:** High. It generates clear, binary clauses (e.g., "24-hour notice for entry," "No surveillance in common areas").
  *   **Intelligibility:** Very High. Members understand "privacy."
  *   **Why not First:** It is defensive. It assumes the threat is intrusion. In a co-op, the greater threat is often *neglect* or *bureaucratic exclusion*, which non-interference does not cover.

  #### 3. Capability (The Specific Obligation)
  **Why it is third:** As a general principle, "The Co-op shall ensure members can live well" is drafting poison. It is unenforceable and invites paternalism (the Board decides what "living well" means).
  *   **The Paternalism Trap:** If you codify a general capability right, the Board can argue that restricting your ability to sublet "enhances community capability," overriding your preference.
  *   **How to Salvage It:** Do not write a Capability *Clause*. Write Capability *Standards*.
  *   **Concrete Clause:** Instead of "Members have a right to connectivity," write *"The Co-op shall maintain broadband infrastructure capable of X speed in all units."* Instead of "Right to accessibility," write *"The Co-op shall fund reasonable modifications for disability as defined by [State Law]."*
  *   **Why Bottom:** It belongs in the budget and maintenance schedule, not the constitutional foundation of the occupancy agreement.

  ---

  ### Integrating Your Two Questions

  You asked to rank these questions alongside the concepts. They are not separate; they are the **stress tests** for the Non-Domination clause.

  #### Integrated Question 1: The Automated Triage System
  **Verdict:** This is a **Non-Domination** issue, not merely an accountability issue.
  *   **Why:** Accountability implies a human agent who can be called to answer. An algorithm that flags arrears or triages maintenance operates on opaque logic. If a member cannot know *why* they were flagged, they cannot contest it. This creates a status of dependence on the "black box."
  *   **Drafting Consequence:** This deserves a specific clause under the Non-Domination umbrella.
      *   *Clause:* *"No automated system shall make final determinations on arrears or maintenance priority without human review. Members have the right to request the specific criteria triggering an automated flag."*
  *   **Why it moves Non-Domination up:** Without a non-domination framework, the automated system is legally "neutral." With it, the opacity itself is the violation.

  #### Integrated Question 2: Agenda Power
  **Verdict:** This is a **distinct wrong** that Non-Interference cannot cover, and Capability only covers accidentally. It is the purest form of Domination.
  *   **Why:** If the Board controls what counts as a grievance, you have no recourse even if you have appeal rights. You cannot appeal a decision that was never admitted as a valid topic. Non-interference doesn't help (they aren't entering your unit). Capability doesn't help (they aren't denying a service, they are denying the *category*).
  *   **Drafting Consequence:** This requires a "Right to Agenda" clause.
      *   *Clause:* *"Any five members may place an item on the Board meeting agenda. Grievances regarding interpretation of this Agreement are admissible by right and cannot be ruled out of order by the Chair."*
  *   **Why it moves Non-Domination up:** This confirms that Non-Domination is the only framework that captures *procedural exclusion*.

  ---

  ### Final Recommendation for Scarce Clauses

  You have about a dozen clauses. Do not waste space on philosophical preamble. Use the **Non-Domination** framework to write **Non-Interference** and **Capability** protections that are enforceable.

  **The "Load-Bearing" Clause List:**

  1.  **Entry & Privacy (Non-Interference):** Strict notice periods, no surveillance.
  2.  **Decision Transparency (Non-Domination):** Board decisions affecting members must cite specific bylaws/rules.
  3.  **Contestability (Non-Domination):** Explicit right to appeal Board decisions to a membership vote or independent mediator.
  4.  **Algorithmic Due Process (Non-Domination):** Human review required for automated flags (maintenance/arrears).
  5.  **Agenda Access (Non-Domination):** Member right to force grievance topics onto meeting agendas.
  6.  **Maintenance Standards (Capability):** Specific timelines for repairs (e.g., "Heat restored within 24 hours").
  7.  **Accessibility (Capability):** Explicit commitment to fund ADA-compliant modifications.
  8.  **Connectivity (Capability):** Definition of minimum broadband infrastructure.
  9.  **Arrears Process (Non-Domination/Interference):** Clear grace periods and negotiation requirements before eviction proceedings.
  10. **Rule Ratification (Non-Domination):** New house rules require membership vote, not just Board fiat.
  11. **Dispute Resolution (Non-Domination):** Mandatory mediation before legal action.
  12. **Severability & Interpretation (Legal):** Standard clause, but add "interpreted to maximize member security of tenure."

  **What to Drop:**
  *   Any general statement of "Right to Housing" or "Right to Flourish." (Too vague, high liability).
  *   Any clause that gives the Board "discretion to act in the best interest of the Co-op" without defining "best interest." (This is a domination loophole).

  **Summary:** Build the document on **Non-Domination**. It is the only framework that captures the risks of the automated system and agenda control. Use **Non-Interference** for privacy clauses. Use **Capability** only for specific, measurable service standards. This maximizes enforceability while minimizing the risk of paternalistic overreach.
