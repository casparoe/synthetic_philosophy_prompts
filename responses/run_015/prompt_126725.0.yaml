prompt: |-
  I live in a limited-equity housing cooperative and was recently elected to the small committee rewriting our occupancy agreement: about a dozen enforceable clauses, one winter of meetings, and a volunteer lawyer. The drafting has turned on which conception of freedom the document should be built around — a non-interference clause (the co-op and fellow members stay out of your unit), a capability clause (the co-op secures your effective ability to live well there: repairs, accessibility adaptations, and now broadband), or a non-domination clause (no member stands to the arbitrary will of another, board and manager included, backed by some machinery for contesting decisions).

  I need a defended ranking, not a survey. Which of these three actually changes what we would write, and which of the distinctions philosophers treat as load-bearing would collapse into drafting noise or into another clause? Concretely: does the non-domination clause buy anything over a non-interference clause plus appeal rights, once "arbitrary" has to be cashed out as something like "not required to track the interests of affected members as they could openly avow them"? And does the capability clause reach anything the other two cannot, or does it mainly license paternalism under a friendlier name?

  Rank two further questions alongside these rather than treating them as separate. First: the board is piloting an automated system that triages maintenance requests and flags arrears for review, and I cannot tell whether domination does real work there or is just a vivid restatement of ordinary accountability problems. Second: what I have started calling agenda power — the unchecked capacity to settle which grievances are intelligible as grievances at all, so that a complaint nobody has a name for never reaches a vote. Is that a distinct wrong deserving its own clause, or a redescription of something the three frameworks already cover?

  Tell me which of these deserve our scarce clauses and meeting time, and why: what criteria you are using (how much downstream drafting each choice settles, how contestable it is by members who are not philosophers, how much of it is merely symbolic), how you would trade those criteria off, and what would move an item up or down the list.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Context:**
      *   **User:** A member of a limited-equity housing cooperative (LEC), elected to a committee rewriting the occupancy agreement.
      *   **Task:** Rewriting about a dozen enforceable clauses.
      *   **Resources:** One winter of meetings, a volunteer lawyer.
      *   **Constraint:** Scarce clauses and meeting time. Needs a *defended ranking*, not a survey.
      *   **Core Philosophical Problem:** Choosing between three conceptions of freedom for the document's foundation: Non-Interference (Negative Liberty), Capability (Positive Liberty/Functioning), Non-Domination (Republican Liberty).
      *   **Specific Questions to Integrate:**
          1.  Does Non-Domination add value over Non-Interference + Appeal Rights (once "arbitrary" is defined)?
          2.  Does Capability reach anything unique, or is it just licensed paternalism?
          3.  (Integrated Q1) Does the automated maintenance/arrears system raise specific domination issues, or is it just accountability?
          4.  (Integrated Q2) Is "agenda power" (setting what counts as a grievance) a distinct wrong needing a clause, or covered by the other three?
      *   **Criteria for Ranking:** Downstream drafting impact, contestability by non-philosophers, symbolic vs. substantive value.

  2.  **Deconstruct the Three Conceptions of Freedom in a Co-op Context:**

      *   **Non-Interference (Negative Liberty):** "Don't tread on me." Focus: Privacy, exclusion of co-op from unit, limits on rules.
          *   *Drafting:* Easy to write ("Co-op shall not enter without notice"). Easy to understand.
          *   *Limit:* Doesn't guarantee the *ability* to live there (e.g., if the roof leaks, they aren't interfering, but you can't live well). Doesn't stop arbitrary power if it follows procedure.

      *   **Capability (Positive Liberty/Functioning):** "Enable me to flourish." Focus: Repairs, broadband, accessibility, support.
          *   *Drafting:* Hard to write ("Co-op shall ensure members can live well"). Risk of open-ended financial liability. Risk of paternalism (Co-op decides what "well" means).
          *   *Limit:* Can become a wish list rather than enforceable rights.

      *   **Non-Domination (Republican Liberty):** "No master." Focus: Structural checks on power, contestability, non-arbitrariness.
          *   *Drafting:* Procedural safeguards, transparency, right to challenge decisions, constraints on discretion.
          *   *Limit:* Can be bureaucratic. Needs careful definition of "arbitrary."

  3.  **Evaluate the Specific Questions:**

      *   *Non-Domination vs. Non-Interference + Appeal:* The user asks if defining "arbitrary" as "not tracking interests... as openly avowed" collapses the distinction.
          *   *Analysis:* Non-interference + appeal still allows the Board to make rules that interfere, provided there's an appeal. Non-domination prevents the *status* of being subject to that power in the first place. However, in drafting, "non-domination" often *looks* like "non-interference + robust appeal." The key differentiator is *discretion*. Non-domination targets uncontrolled discretion.
      *   *Capability vs. Paternalism:* Does it add value?
          *   *Analysis:* In a co-op, mutual aid is the point. But "capability" as a legal clause is dangerous. It creates entitlements without clear bounds. Better to specific specific capabilities (broadband, heat) than a general "capability clause."
      *   *Automated System (Domination vs. Accountability):*
          *   *Analysis:* Algorithms can encode arbitrary will without a human to appeal to. If the system flags you for arrears based on opaque criteria, that's domination. It's not just accountability; it's about *intelligibility* and *contestability* of the decision-maker.
      *   *Agenda Power:*
          *   *Analysis:* This is the meta-problem. If you can't name the grievance, you can't appeal. This is pure Non-Domination (structural control). It's distinct because procedural appeals don't help if the issue is inadmissible.

  4.  **Develop the Ranking Criteria:**
      *   **Drafting Leverage:** How much specific text does this choice generate? (High leverage = good).
      *   **Enforceability:** Can a member actually use this in a dispute? (High enforceability = good).
      *   **Member Intelligibility:** Can non-philosophers understand/vote on it? (High intelligibility = good).
      *   **Risk:** Does it open the co-op to liability or paternalism? (Low risk = good).

  5.  **Formulate the Ranking:**

      *   **Priority 1: Non-Domination (operationalized as Contestability & Non-Arbitrariness).**
          *   *Why:* It addresses the power dynamic inherent in a co-op (members vs. board/manager). It covers the automated system (opacity) and agenda power (admissibility). It has high drafting leverage (procedures, transparency).
          *   *Caveat:* Must be cashed out procedurally, not abstractly.
      *   **Priority 2: Non-Interference (operationalized as Privacy & Due Process).**
          *   *Why:* Baseline protection. Easy to draft. Necessary but insufficient.
          *   *Relation:* It's a subset of Non-Domination. You need it, but it shouldn't be the *foundation*.
      *   **Priority 3: Capability (operationalized as Specific Service Standards).**
          *   *Why:* High risk of vagueness/paternalism. Don't write a "Capability Clause." Write specific clauses for heat, broadband, repairs.
          *   *Relation:* Good goal, bad legal mechanism if abstract.

  6.  **Address the Integrated Questions within the Ranking:**

      *   *Automated System:* Place this under Non-Domination. The risk isn't just error (accountability); it's the black-box nature (arbitrary will). Needs a "Human in the Loop" or "Explainability" clause.
      *   *Agenda Power:* Place this under Non-Domination. This is the strongest argument for Non-Domination over Non-Interference. Non-interference doesn't stop the Board from refusing to hear a complaint. Non-domination requires the *channel* to exist.

  7.  **Drafting the Response (Iterative refinement):**

      *   *Tone:* Professional, philosophical but practical, decisive.
      *   *Structure:*
          1.  Executive Summary (The Ranking).
          2.  Criteria Explanation.
          3.  Detailed Defense of the Ranking (addressing the specific philosophical distinctions).
          4.  Application to the Two Integrated Questions (Automation & Agenda Power).
          5.  Drafting Recommendations (Concrete clauses).
      *   *Refining the "Non-Domination vs. Appeal" point:* I need to be careful here. The user suggests defining "arbitrary" as "not tracking interests." This is the Pettit definition. I need to confirm if this adds value. Yes, because it shifts the burden of justification. An appeal process reviews a decision *after*. Non-domination requires the decision-making *structure* to track interests *before*.
      *   *Refining "Capability":* Warn against "right to housing" vagueness. Suggest "Service Level Agreements" instead.
      *   *Refining "Agenda Power":* This is the "uptake" condition. If the co-op doesn't recognize "noise" as a grievance, you have no recourse. This needs a "Right to Propose Agenda Items" clause.

  8.  **Final Review against Constraints:**
      *   Did I rank? Yes.
      *   Did I integrate the two extra questions? Yes.
      *   Did I explain criteria? Yes.
      *   Did I address the "drafting noise" concern? Yes, by distinguishing abstract principles from enforceable text.

  9.  **Self-Correction during drafting:** I initially thought about putting Non-Interference first because it's easiest. But the prompt asks what *changes* what we write. Non-Interference is standard boilerplate. Non-Domination changes the *governance* structure. That's higher value for a co-op. I will prioritize Non-Domination but warn about the complexity. Actually, for a *dozen clauses*, complexity is a risk. I need to balance "Foundational" with "Draftable."
      *   *Adjustment:* Rank Non-Domination as the *guiding principle*, but Non-Interference as the *primary source of specific clauses*, with Capability restricted to specific amenities. Wait, the prompt asks which conception the document should be *built around*.
      *   *Decision:* Build around Non-Domination. It subsumes Non-Interference (you can't interfere arbitrarily) and manages Capability (provision must be non-arbitrary). It solves the Automation and Agenda problems best.

  10. **Final Polish:** Ensure the distinction between "arbitrary will" and "accountability" is sharp regarding the algorithm. Ensure "agenda power" is identified as a structural domination issue.

  *(Self-Correction on the Ranking)*: If I have only a dozen clauses, I can't write "Philosophy of Freedom." I need enforceable text. So the ranking should be about which *concept yields the most necessary clauses*.
  1. Non-Domination (Procedural safeguards, contestability).
  2. Non-Interference (Privacy, entry rules).
  3. Capability (Specific maintenance standards).
  *Reasoning:* Non-Domination protects against the Board/Manager (the biggest risk). Non-Interference protects against neighbors/Board intrusion. Capability is too vague for a top-tier clause, better as specific obligations.

