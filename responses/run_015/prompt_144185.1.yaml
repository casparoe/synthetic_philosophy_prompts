answer: |-
  Here is a complete design for a 75-minute session on Weakness of Will (Akrasia) and Time Inconsistency. It is built to be run with zero budget, minimal tech, and maximum student friction.

  # Activity Title: The Ulysses Contract

  ## 1. Core Concept & Mechanics
  You are running a **Two-Stage Choice Experiment** with an optional **Precommitment Market**.

  *   **The Currency:** "Rationality Points" (RP). 10 RP = 1 Participation Point (or 1 Chocolate, if you prefer). *Recommendation: Use Participation Points for philosophy majors (grade stakes), Chocolates for non-majors (visceral stakes). Let's assume Chocolates for this design as they are more tangible for "burning."*
  *   **The Endowment:** Every student receives **2 Chocolates** at the door. This is theirs to keep *unless* they spend it.
  *   **The Task (Aversive):** "Data Verification." Copying 3 columns of random 4-digit numbers from a projector slide onto a worksheet. It is mind-numbing, requires focus, and cannot be sped up without errors.
      *   **Small Task:** Copy 2 rows (approx. 3 minutes).
      *   **Large Task:** Copy 6 rows (approx. 9 minutes).
  *   **The Payoff:**
      *   Small Task = +1 Chocolate.
      *   Large Task = +3 Chocolates.
  *   **The Time Structure:**
      *   **T0 (Minute 10):** First Choice.
      *   **T1 (Minute 35):** Second Choice (The "Moment of Truth").
      *   **T2 (Minute 50):** Task Execution & Payoff.

  ## 2. Materials Needed
  *   **Chocolates:** ~60 cheap chocolates (4 per student + buffer).
  *   **Worksheets:** 16 copies of the "Data Verification" sheet (grid with empty rows).
  *   **Precommitment Envelopes:** 16 small envelopes (or folded paper sealed with tape).
  *   **Whiteboard:** To track the "Market Price" of precommitment and aggregate results.
  *   **Projector:** To display the number columns and the timer.

  ## 3. Minute-by-Minute Timeline

  | Time | Phase | Action |
  | :--- | :--- | :--- |
  | **00-05** | **Arrival & Endowment** | Hand out 2 chocolates and a worksheet to each student as they sit. Do not explain why yet. |
  | **05-10** | **The Setup** | Explain the Task (Data Verification) and the Payoff Scheme. Emphasize the *boredom* factor. |
  | **10-15** | **T0: The Plan** | **Choice 1:** Do Small Task NOW (get reward in 5 mins) OR Large Task LATER (get reward in 35 mins). <br> **Precommitment Offer:** They can put 1 Chocolate in the envelope to *lock* this choice. If they lock, they cannot change their mind at T1. If they don't lock, they can switch at T1. |
  | **15-35** | **The Delay** | **Normal Seminar Content.** Discuss a reading or case study unrelated to the game. This *is* the delay. The waiting students feel the drag of time; the working students (if any) feel the relief of being done. |
  | **35-40** | **T1: The Temptation** | **Choice 2:** Only for those who chose "Later" at T0 *and* did not precommit. <br> They can stick to "Large Task Now" OR switch to "Small Task Now." <br> Those who precommitted must open envelopes and follow the locked instruction. |
  | **40-50** | **Execution** | Everyone performs their assigned task simultaneously. (Those who did it at T0 sit quietly or help grade). |
  | **50-60** | **Payoff** | Collect tasks. Verify accuracy (spot check). Distribute rewards. Burn the precommitment chocolates publicly. |
  | **60-75** | **Debrief** | Structured discussion mapping experience to theory (see below). |

  ## 4. The Rules & Script (Facilitator Guide)

  ### What To Say (The Setup)
  > "On your desk you have two chocolates. They are yours. You can eat them now, or you can use them to participate in the Verification Market.
  >
  > On the screen is a list of numbers. Your job is to copy them onto your sheet. It is boring. It takes focus.
  > **Option A:** Copy 2 rows now. You finish in 5 minutes. You earn 1 Chocolate.
  > **Option B:** Copy 6 rows in 25 minutes. You earn 3 Chocolates.
  >
  > Here is the twist: If you choose Option B, you are allowed to change your mind when the time comes. Unless... you buy a contract. For 1 Chocolate from your endowment, you can seal your choice in this envelope. If you buy the contract, you *must* do what you promised at T0, even if you regret it at T1. If you don't buy the contract, you are free to switch."

  ### What NOT To Say
  *   **Do not** use the words "hyperbolic discounting," "akrasia," or "time inconsistency" until the debrief.
  *   **Do not** judge the choice. If a student switches from Large to Small at T1, do not say "You gave in." Say "You updated your choice."
  *   **Do not** let them negotiate the task difficulty ("Can I do 4 rows?"). No.
  *   **Do not** let them renegotiate the precommitment ("Can I have my chocolate back?"). No. The burn must be public and final.

  ### Managing the Two Sections (Spoiler Prevention)
  *   **Section A (Morning):** Use **Number Copying** as the task. Reward is **Chocolates**.
  *   **Section B (Afternoon):** Use **Letter Counting** (count 'e's in a dense text paragraph) as the task. Reward is **Participation Points** (recorded on a sheet).
  *   **Instruction to Section A:** "You are part of a pilot study. Please do not discuss the specific *task* with friends in the afternoon section, though you can discuss the *concept*." (Most will comply; the task change covers any leaks).

  ## 5. Predictable Failure Modes & Fixes

  | Failure Mode | Who | How to Handle |
  | :--- | :--- | :--- |
  | **The Gamer** | "I'll choose Large/Later, then switch to Small/Now at T1. Best of both worlds." | **Accept it.** This is the *control group* for time inconsistency. In the debrief, highlight them: "You planned to be patient but chose to be impatient. That is the phenomenon we are studying." |
  | **The Renegotiator** | At T1: "Can I just do 4 rows instead of 6? It's fairer." | **Hard No.** "The contract was with the parameters set at T0. If you change the parameters, the payoff structure breaks." Keep the rules rigid to simulate real-world constraints. |
  | **The Regretful Precommitters** | Paid the chocolate, got locked in, and are visibly annoyed at T1. | **Validate the feeling.** "That annoyance you feel? That is the cost of binding your future self. Sit with it. Is it better than the regret of switching would have been?" |
  | **The Speedsters** | Finish the Small Task in 1 minute. | Have a "Secondary Verification" ready (check your own work) to fill the time so they don't distract the others. |
  | **The Cynics** | "This is fake, I don't care about chocolates." | **Shift stakes.** "If you don't care about the chocolate, trade it. But you still have to do the boring task. The currency doesn't matter, the boredom does." |

  ## 6. The Debrief (15 Minutes)

  Do not lecture. Draw a timeline on the board. Mark T0, T1, T2.

  **Step 1: The Data (3 mins)**
  *   "Show of hands: Who chose Large/Later at T0?"
  *   "Of those, who *stayed* Large at T1?"
  *   "Who *switched* to Small at T1?"
  *   "Who bought the Precommitment Contract?"
  *   Write the numbers on the board.

  **Step 2: Mapping the Flip (5 mins)**
  *   **Ask the Switchers:** "At T0, was Large better than Small?" (They will say Yes). "At T1, was Small better than Large?" (They will say Yes).
  *   **The Point:** "The options didn't change. The delay between Small and Large remained constant (4 rows difference). Only the distance from *Now* changed. What does that tell us about how we value 'Now'?"
  *   **Theory Link:** This is **Hyperbolic Discounting**. We have a 'spike' in value for immediate rewards/relief that distorts our long-term preferences.

  **Step 3: The Precommitment (4 mins)**
  *   **Ask the Precommitters:** "How did it feel at T1 when you wanted to switch but couldn't?"
  *   **Ask the Switchers:** "How does it feel looking at the Precommitters?"
  *   **The Point:** "One group gritted their teeth (Willpower). One group rearranged the world so they didn't have to (Constraint). Which is more rational?"
  *   **Theory Link:** **Ulysses Contracts** (Elster/Schelling). Rationality as self-binding vs. Rationality as maximizing utility at every moment.

  **Step 4: The Open Question (3 mins)**
  *   **Ask:** "The student who switched at T1... were they irrational? Or did their preferences just genuinely change?"
  *   **Leave it Open:** "If preferences change, is it irrational to follow them? Or is there a 'True Self' that the T0 planner represents?"
  *   **Closing:** "Next week we ask: If the 'Now Self' and 'Later Self' are different people, how do we make policy for them?"

  ## 7. What This Activity Cannot Stage (Be Honest)
  In the debrief, explicitly state this limitation:
  > "In this game, the cost of weakness was 2 chocolates and 10 minutes of boredom. In real life, the cost of weakness is a degree you don't finish, a health condition you ignore, or a savings account you drain. The *structure* of the choice is the same, but the *stakes* here are safe. Don't leave thinking weakness of will is a game. It's a structural trap that gets harder the higher the stakes."

  ## 8. Why This Works for Your Constraints
  1.  **No Phones:** The task requires pen and paper. Phones are irrelevant.
  2.  **Real Delay:** The 25-minute gap is filled with class content, so they physically sit there waiting.
  3.  **Aversive Task:** Copying numbers is universally disliked, making the "procrastination" (switching to Small Task) viscerally understandable.
  4.  **Second-Order:** The Precommitment Envelope forces them to put skin in the game (burning a chocolate) to restrict their own freedom.
  5.  **Theory-Agnostic Start:** They experience the flip before they have the vocabulary to explain it away.

  ## 9. Facilitator Cheat Sheet (Pocket Notes)
  *   **If everyone precommits:** "Interesting. You all distrust your future selves more than you value flexibility."
  *   **If no one precommits:** "You all bet on your own willpower. Let's see if it held."
  *   **If everyone switches:** "The temptation of 'Now' was absolute. Why did T0 you not know this?"
  *   **Key Phrase to Repeat:** "Did your preferences change, or did the *options* change?" (Answer: Options didn't change).

  This design forces the "Now" magic to reveal itself through their own choices, creates a tangible cost for precommitment, and leaves the philosophical question of rationality genuinely unsettled for the debate.
