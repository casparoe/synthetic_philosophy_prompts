      *   *Idea 2: The Chocolate Auction.* Bidding on chocolates delivered now vs. end of class.
          *   *Problem:* Too economic, feels like a market.
      *   *Idea 3: The "Two-Self" Contract.*
          *   Let's combine the aversive task with the reward.
