  2.  **Deconstruct the Core Problem:**

      *   Standard discounting games fail because students know the trick.
      *   Need *preference reversal*: Choose A over B at Time 1, but B over A at Time 2, where the *delay between A and B* remains constant, but the *distance from Now* changes.
      *   Need *aversive task*: Doing something boring now vs. later.
      *   Need *precommitment*: Paying to lock in a choice.
