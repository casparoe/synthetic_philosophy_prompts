answer: |-
  Your roommate is technically competent but is mixing mathematical identities with normative arguments, and they make one significant error at the end. There is indeed some sleight of hand, primarily in how they frame subjective preferences as objective mathematical necessities.

  Here is the point-by-point audit.

  ### 1. "Kelly... is really just expected utility theory with a log utility function baked in."
  *   **Verdict:** **Accurate, but narrow.**
  *   **The Math:** This is mathematically settled. If you maximize the expected value of the logarithm of wealth, you derive the Kelly bet size. If you use Expected Utility Theory (EUT) and define your utility function as $U(W) = \log(W)$, you get the same result.
  *   **The Nuance:** The sleight of hand here is linguistic. "Geometric rationality" is often presented as a distinct paradigm that *replaces* EUT. Your roommate is correctly identifying that, mathematically, it collapses into a specific case of EUT. However, proponents of geometric rationality argue that log-utility isn't just a preference; they argue it's the *only* rational function for repeated betting. Your roommate's framing treats it as just one option among many (which is the standard economic view), while ignoring the argument that log-utility is structurally unique for growth.
  *   **Settled vs. Contested:** **Settled** that the math is equivalent. **Contested** whether log-utility is the uniquely rational choice or just one valid preference structure.

  ### 2. "That means you should never take a bet with negative expected value."
  *   **Verdict:** **Accurate.**
  *   **The Math:** A bet with a negative arithmetic expected value will always have a negative expected log growth. Kelly criterion will always size such a bet at zero (or short it, if allowed).
  *   **The Nuance:** This is a safe statement, but it's worth noting the converse isn't true. You can have a bet with *positive* expected value that Kelly tells you to reject (or size very small) if the variance is too high relative to the edge. But as stated, your roommate is correct: Kelly never takes a negative EV bet.
  *   **Settled vs. Contested:** **Settled.**

  ### 3. "It automatically solves the risk-aversion problem because you're linear in log-space."
  *   **Verdict:** **Misleading Framing.**
  *   **The Sleight of Hand:** This is where the normative shift happens. In standard economics, "risk aversion" is a subjective parameter reflecting how much pain you feel from losses. There is no "problem" to solve; it's a preference.
  *   **The Reality:** Kelly doesn't "solve" risk aversion; it *hardcodes* a specific coefficient of relative risk aversion (specifically, a coefficient of 1). By saying it "solves" the problem, your roommate implies that other levels of risk aversion are irrational or erroneous. Kelly proponents argue that deviating from Kelly is suboptimal for long-term growth; standard economists argue that if you care less about long-term growth and more about short-term stability, a different utility function is rational.
  *   **Settled vs. Contested:** **Contested.** Whether risk aversion is a subjective preference (standard econ) or an objective error in reasoning (Kelly/Ergodic view) is a major philosophical divide.

  ### 4. "The ergodicity economics people claim this proves time averages match ensemble averages, but thats mostly marketing — the Kelly math works fine without that story."
  *   **Verdict:** **Partially Accurate, but Dismissive.**
  *   **The Math:** Your roommate is right that the Kelly formula was derived and used successfully in information theory and finance decades before "Ergodicity Economics" (associated with Ole Peters) became a branded movement. You do not need ergodicity arguments to calculate a Kelly bet.
  *   **The Nuance:** Calling it "mostly marketing" ignores the actual contribution of ergodicity economics. Standard EUT relies on ensemble averages (averaging across parallel universes). Ergodicity economics argues that for wealth dynamics, ensemble averages are physically meaningless because you only live in one timeline. They claim this *justifies* why we should use log-utility rather than just assuming it. Your roommate is correct that the *calculation* doesn't need the story, but wrong to imply the *justification* is merely marketing. It's a foundational critique of how expectation is defined.
  *   **Settled vs. Contested:** **Highly Contested.** Mainstream economics largely rejects the claim that EUT is fundamentally broken due to non-ergodicity. The quant/rationalist community is more split.

  ### 5. "If you're ambiguity-averse you just scale your Kelly fraction by your ambiguity weight, which is literally the same thing as maximin EU for every decision problem."
  *   **Verdict:** **Wrong.**
  *   **The Sleight of Hand:** This is the strongest error in the statement.
  *   **The Reality:**
      1.  **Fractional Kelly:** Scaling down Kelly (e.g., Half-Kelly) is a common heuristic to account for uncertainty in your edge estimates. It reduces variance and protects against overbetting due to miscalculation.
      2.  **Maximin:** The Maximin rule (Wald's criterion) tells you to choose the option where the *worst possible outcome* is the least bad. It generally ignores probabilities entirely and focuses solely on the worst-case scenario.
      3.  **The Equivalence:** These are **not** "literally the same thing." Maximin can lead you to reject a bet that Fractional Kelly would accept. For example, if a bet has a tiny probability of ruin, Maximin rejects it outright. Fractional Kelly might still take it if the expected log growth is positive. Equating a probability-weighted heuristic (Fractional Kelly) with a probability-agnostic worst-case rule (Maximin) across *every* decision problem is mathematically false.
  *   **Settled vs. Contested:** **Settled.** In decision theory, these are distinct criteria with different properties. They may overlap in specific, constrained scenarios, but they are not equivalent generally.

  ### Summary Audit
  Your roommate's framing is **mostly technically correct on the math, but ideologically loaded on the interpretation.**

  *   **What holds up:** The link between Kelly and Log-Utility, and the rejection of negative EV bets.
  *   **The Sleight of Hand:**
      1.  **Risk Aversion:** Framing a specific risk preference (Log) as the "solution" to risk aversion, rather than just one specific type of risk aversion.
      2.  **Ergodicity:** Dismissing a foundational critique of expectation as "marketing" when it's actually a genuine (though debated) philosophical challenge to standard EUT.
      3.  **Ambiguity:** The claim that Fractional Kelly is equivalent to Maximin is simply incorrect. That is a conflation of two different decision rules.

  If you take away one thing: Your roommate is treating a specific strategy (Kelly/Log-Utility) as if it is the universal law of rationality, and they are glossing over the fact that handling ambiguity (uncertainty about probabilities) is much harder than just scaling your bet size.
