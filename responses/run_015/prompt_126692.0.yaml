answer: |-
  # DECISION TREE: CAN CULTURE BE A CAUSE?

  **START:** You have a decent, replicated correlation between a widely shared value or belief in some population *P* and an economic outcome *E*, and you want to know what you are licensed to say.

  **Q1. MECHANISM:** Does the belief content prescribe specific actions *distinct* from "make money" that incidentally produce *E*?
  *   **NO** → **Q2. DIRECTION:** Did the economic outcome *E* precede the spread of the belief in historical time?
      *   **YES** → **LEAF 1: REVERSE CAUSALITY**
          *   *Awkward Commitment:* You must explain why actors invented a moral story to justify what they were already doing for profit.
      *   **NO** → **LEAF 2: SPURIOUS CORRELATION (THIRD FACTOR)**
          *   *Awkward Commitment:* You must identify the hidden variable (e.g., geography) that causes both piety and profit without them touching.
  *   **YES** → **Q3. COMPOSITION:** Does the economic outcome *E* require most of *P* to hold the belief, or only a strategic minority?
      *   **MAJORITY** → **Q4. PERSISTENCE:** If the belief disappears, does the economic outcome *E* stop?
          *   **YES** → **LEAF 3: STRONG CULTURALISM**
              *   *Awkward Commitment:* You must argue that secular modern capitalism is impossible or inherently unstable.
          *   **NO** → **Q5. EQUIFINALITY:** Can *E* be sustained by different beliefs or no beliefs once established?
              *   **NO** → **LEAF 4: [UNOCCUPIED] CULTURAL PATH DEPENDENCE**
                  *   *Awkward Commitment:* You claim a majority ethos is permanently necessary, yet no other ethos could ever substitute for it.
              *   **YES** → **LEAF 5: CULTURAL FUNCTIONALISM**
                  *   *Awkward Commitment:* The specific content of the belief does not matter, only that it exists to serve the economy.
      *   **MINORITY** → **Q4. PERSISTENCE:** If the belief disappears, does the economic outcome *E* stop?
          *   **YES** → **LEAF 6: VANGUARD DEPENDENCE**
              *   *Awkward Commitment:* You must explain how the economy survives if the sect fails to reproduce itself biologically.
          *   **NO** → **Q5. EQUIFINALITY:** Can *E* be sustained by different beliefs or no beliefs once established?
              *   **NO** → **LEAF 7: [UNOCCUPIED] ELITE PATH DEPENDENCE**
                  *   *Awkward Commitment:* You claim a specific minority belief is permanently necessary, yet it never becomes majority or institutionalized.
              *   **YES** → **LEAF 8: INSTITUTIONAL CRYSTALLIZATION**
                  *   *Awkward Commitment:* Culture was merely the spark; the "iron cage" of institutions is the actual cause of present *E*.

  ***

  ### METHODOLOGICAL NOTES

  **1. Indistinguishable Leaves**
  This tree cannot empirically separate **Leaf 5 (Cultural Functionalism)** and **Leaf 8 (Institutional Crystallization)**. In both cases, the specific belief content is causally inert in the present period; the difference is merely whether you label the sustaining structure "functional culture" or "institutionalized habit."

  **2. Empty Combinations**
  *   **Leaf 4 (Majority Path Dependence):** *Merely unattractive.* It posits a rigid cultural necessity without the mechanistic plausibility of minority enforcement or the flexibility of functionalism.
  *   **Leaf 7 (Minority Path Dependence):** *Incoherent.* If a minority belief is permanently necessary for *E*, but *E* persists without the belief spreading, the mechanism implies the minority is secretly controlling the majority, which collapses back into Vanguard Dependence (Leaf 6).

  **3. Reason for Branch Ordering**
  I ordered the nodes **Mechanism → Composition → Persistence**. Mechanism is an internal validity check; if the path runs through "desire for wealth," culture is doing no work, so we must rule that out first. Composition determines the *type* of cultural claim (ethos vs. selection), which dictates what kind of persistence evidence is relevant. Persistence is placed last because it tests the durability of the claim only after we have established what the claim *is*.

  **4. Where The Tree Goes Silent**
  This tree cannot settle whether culture was a cause if **Q1 (Mechanism)** cannot be answered. In historical sociology (like Weber's), we rarely have access to the subjective motives of dead actors. If you cannot trace the content of the belief to action without inferring motive from the outcome itself, the tree stops at the Start Node. No amount of branching on persistence or composition fixes a broken mechanism.
