answer: |-
  Welcome, everyone. To our moral philosophers, our anthropologists, and our local community organizers: thank you for returning to this table. And a specific welcome to our international graduate students, who have been in this city for less than a week. You are not just attendees; you are the living case studies for this workshop. You are currently navigating the very anxiety that brings us here: the fear of doing the wrong thing, not because it is illegal, but because it is *unfair*, or *rude*, or somehow *wrong*.

  We are gathered to ask a question that sounds small but cuts deep: Do everyday conventions constitute genuine moral obligations? When you queue for a bus, when you tip a server, when you decide whether to jaywalk on an empty street—are you navigating mere etiquette, or are you navigating duty?

  It is tempting to answer this with a slogan. On one side, we have the rigid universalist: "When in Rome, do as the Romans do." This suggests that local norms possess a moral gravity that binds the visitor absolutely. On the other side, we have the relativist: "It's just culture." This suggests these norms are arbitrary preferences, like driving on the left or the right, carrying no moral weight beyond avoiding a ticket.

  Both answers are too clean. They fail to capture the normative friction you feel in your chest when you stand at a counter, hand hovering over your wallet, unsure if a tip is a bribe, a wage, or an insult.

  To do better, I propose we spend these days working with a specific distinction: the difference between *coordination conventions* and *deference conventions*.

  Coordination conventions are practices like queuing or turn-taking. They exist to solve a cooperation problem. I queue because I expect you to queue, and we both benefit from the order. If you are a visitor, you have a direct, pragmatic reason to participate. To break the queue is not just to be rude; it is to break the mechanism that serves you, too.

  Deference conventions are different. These are practices like specific tipping hierarchies or unwritten pedestrian right-of-way rules that encode local status relations. They signal who owes respect to whom. A visitor might question these without necessarily breaking cooperation. You might refuse to tip in a culture where service is priced into the meal, not as an act of aggression, but as a refusal to accept a specific status hierarchy.

  However, I am not asking you to accept this distinction as a tidy taxonomy. In fact, I am asking you to break it. The philosophical work of this workshop lies in the fraying of these categories.

  Consider the queue. It looks like pure coordination. But what happens when the "queue" is not a line, but a subtle gathering of elbows and glances? In some contexts, queuing is not just about efficiency; it is about who is deemed worthy of being served first. Here, coordination bleeds into deference. If an outsider steps in, they aren't just disrupting efficiency; they are challenging a local social order.

  Or consider tipping. It often functions as deference—a recognition of the server's subordinate role. But if tipping becomes the primary wage, refusing to tip no longer just signals a moral stance on hierarchy; it actively harms the worker's livelihood. The deference norm collapses back into a coordination norm essential for the economic system to function. Refusing to participate stops being a principled objection and becomes a free-rider problem.

  This is where we need you.

  To the philosophers: We need you to help us determine where the *moral obligation* actually lives. Is it in the utility of the coordination? Or is there a duty of respect inherent in the deference?

  To the anthropologists and community organizers: We need you to ground this. Show us where these norms sustain community trust, and where they enforce exclusion. Tell us when a "local custom" is actually a barrier to dignity.

  And to our new students: Do not feel you must simply assimilate. Your confusion is a data point. When a norm feels unintelligible to you, it may be because the coordination function is hidden, or because the deference requirement is one you do not share.

  Our goal over the next two days is not to produce a traveler's guidebook. We are not here to tell you which rules to follow. We are here to determine which obligations travel with us as moral agents, and which remain anchored to this specific soil. We are asking: When does a convention become a command?

  The answer is not settled. The line between a habit and a duty is porous. But if we can map where that line frays, we might understand not just how to behave in a new city, but how to live together in a pluralistic world.

  Thank you. Let's begin.
