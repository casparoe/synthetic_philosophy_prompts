  (5) i reject that waking up is evidence at all — the coin flipped sunday, so finding yourself awake is like finding out you're alive, not like observing a result.
  (6) i think newcomb's problem and sleeping beauty are structurally the same: in both cases you condition on being in the branch or state that correlates with the outcome, which is why i one-box and why i'm a thirder.

