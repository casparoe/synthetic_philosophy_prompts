  ok so i need a consistency check before my reading group meets tomorrow. here's roughly where i've landed on sleeping beauty and self-locating belief:

  (1) i'm a thirder — when beauty wakes up her credence for heads should be 1/3.
  (2) self-locating belief is just centered-world location, basically the lewis-style view where you figure out which centered world you're in; there's no special indexical mystery.
  (3) i also buy this idea i call temporal indexing without amnesia loss — monday-beauty and tuesday-beauty are the same epistemic agent with different temporal coordinates, so evidential updates should be symetrical unless there's an actual informational asymmetry.
