  {
    "presupposed_temporal_ontology": "Incoherent Hylomorphic Dualism",
    "preservation_arm_commitment": "Linear Irreversibility (Unique Temporal Tokens)",
    "exhibition_arm_commitment": "Timeless Structuralism (Eternal Textual Types)",
    "coherence_assessment": "incoherent",
    "changes_under_borges_illusion_view": "• Abolish chronological finding aids as fiction\n• Organize all drafts by thematic resonance\n• Permit unrestricted reproduction (time is illusion)\n• Treat 1941 and 1960 drafts as simultaneous variants",
    "changes_under_strict_linear_view": "• Remove thematic displays as misleading\n• Acknowledge copies lack 'temporal moment'\n• Restrict access based on material aging only\n• De-mystify inscription as chemical process"
  }
  ```
