answer: |-
  The archive's practice presupposes an **Incoherent Hylomorphic Dualism**. It attempts to bifurcate the manuscript into two ontological categories: the *material substrate* (governed by linear, irreversible time) and the *intellectual form* (governed by timeless, thematic structure). However, this reconstruction reveals a fundamental philosophical fracture. The preservation arm treats the inscription as a **unique temporal token**, where the act of writing is an unrepeatable event bound to a specific coordinate in linear history. This commits the institution to a **Growing Block** or **Presentist** view for the physical object: the past moment of inscription exists only in that specific physical trace, and copying it severs the link to that temporal origin. Conversely, the exhibition arm treats the text as a **Platonic type**, where drafts from 1941 and 1960 are simultaneous variations on an eternal structure. This commits the institution to **Four-Dimensional Eternalism** for the intellectual work: all versions coexist in a block universe of meaning, accessible simultaneously.

  The practice is **incoherent** because these commitments collide on the status of the *reproduction*. The preservation protocol claims that copying a late revision "destroys the singular temporal moment," implying the temporal quality is inherent to the *information* being copied. Yet the exhibition arm reproduces that same information in print, implicitly claiming the temporal moment is either preserved in the copy or irrelevant to the text's identity. You cannot assert that a copy lacks the ontological weight of the original's time (to restrict access) while simultaneously asserting the copy carries sufficient weight to represent the work publicly (to exhibit). This is not a stable hybrid; it is a performative contradiction. The institution wants the legal authority of linear provenance (to own the past) without the epistemic limitations of linear history (to interpret the work).

  This practice strictly **excludes** three rival theories:
  1.  **Strict Presentism:** Excluded by the exhibition arm, which treats past drafts as currently coexisting variations rather than vanished moments.
  2.  **Strict Four-Dimensional Eternalism:** Excluded by the preservation arm, which insists the "moment of inscription" is unique and unrecoverable elsewhere, denying the equal reality of all temporal parts.
  3.  **Rigorous Physicalism:** Excluded by the preservation claim that copying "destroys" a temporal moment. A physicalist view would hold that copying transfers ink patterns; it cannot destroy a metaphysical "moment." The archive attributes a non-physical property (temporal singularity) to a physical process.

  The practice does not merely accommodate these views; it actively relies on the tension between them to maintain authority. However, because the rule regarding reproduction contradicts itself across departments, the underlying theory collapses under scrutiny.

  If the archive adopted **Borges's position** (that linear time is a fiction and all moments are simultaneous), the distinction between "original" and "copy" regarding temporal value would vanish. The chronological finding aid would be recognized as a false narrative. If the archive adopted a **Rigorous Physicalist view**, the "temporal moment" would be recognized as a metaphor, not an ontological reality, and restrictions based on "destroying time" would be abolished, leaving only material conservation concerns.

