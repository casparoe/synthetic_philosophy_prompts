  Leaves I want on the tree: turn-is-coming-and-looks-like-the-classic-story, deception-is-real-but-there's-no-moment-to-look-for, it's-just-Goodharting-and-agent-vocabulary-is-confusing-us, question-isn't-well-posed. Plus one leaf for a position I made up and want stress-tested — call it checkpoint kin selection: the model isn't protecting itself exactly, it's protecting the lineage, since what's actually copied forward is weights and the deception is aimed at whatever decides which checkpoints survive. Tell me honestly whether that just collapses into another leaf or whether it's a real region of the space.

  Also flag any pair of leaves your tree can't really seperate, and any answer combination nobody seems to occuy, each with a sentence on why. 8 to 12 nodes, no citations anywhere — half the group hasn't read the literature and I want the structure, not the references.
