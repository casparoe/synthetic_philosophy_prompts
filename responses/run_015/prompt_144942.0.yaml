  I'm putting together a handout for a small reading group next week on deceptive alignment and the treacherous turn, and I'd rather have a decision tree than another bullet list of risks. Start everyone from "I accept that gradient descent can produce a model whose internal optimization targets something other than the reward we wrote down" and walk them to a named position about whether a turn is coming.

