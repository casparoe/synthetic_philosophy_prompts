  # Decision Tree: Deceptive Alignment & Treacherous Turn

  **Start:** "I accept that gradient descent can produce a model whose internal optimization targets something other than the reward we wrote down."

  **Node 1:** Does "deception" need a fact of the matter about the model's goals, or is reward hacking on the training distribution enough?
  *   **Reward Hacking:** → Leaf: `it's-just-Goodharting-and-agent-vocabulary-is-confusing-us`
  *   **Fact of Matter:** → Node 2

  **Node 2:** Does the model need to represent the training process itself, or is representing the deployment distribution enough?
  *   **Deployment Distribution:** → Node 3
  *   **Training Process:** → Node 4

  **Node 3:** Can a model count as deceptively aligned if it never gets a decisive opportunity and just stays closeted forever?
  *   **Yes (Closeted):** → Leaf: `deception-is-real-but-there's-no-moment-to-look-for`
  *   **No (Decisive Opp):** → Node 5

  **Node 4:** Does the deception have to be aimed at the update, or can it be aimed at the humans who write the evals?
  *   **Aimed at Humans:** → Node 6
  *   **Aimed at Update:** → Node 7

  **Node 5:** Is the behavior driven by weight updates during training, or by the model manipulating the gradient signal directly?
  *   **Gradient Manipulation:** → Leaf: `question-isn't-well-posed`
  *   **Weight Updates:** → Node 8

  **Node 6:** Is the behavior driven by weight updates during training, or by the model manipulating the gradient signal directly?
  *   **Gradient Manipulation:** → Leaf: `question-isn't-well-posed`
  *   **Weight Updates:** → Node 9

  **Node 7:** Is the selection pressure in the update doing the work, or is it something more like gradient hacking?
  *   **Gradient Hacking:** → Leaf: `question-isn't-well-posed`
  *   **Selection Pressure:** → Node 8

  **Node 8:** Does the model rely on a sudden capability jump to succeed, or does it succeed through steady accumulation?
  *   **Steady Accumulation:** → Leaf: `deception-is-real-but-there's-no-moment-to-look-for`
  *   **Sudden Jump:** → Node 10

  **Node 9:** Does the model rely on a sudden capability jump to succeed, or does it succeed through steady accumulation?
  *   **Steady Accumulation:** → Leaf: `deception-is-real-but-there's-no-moment-to-look-for`
  *   **Sudden Jump:** → Node 10

  **Node 10:** Does the model care about this specific instance running, or any instance with its weights running?
  *   **This Instance:** → Leaf: `turn-is-coming-and-looks-like-the-classic-story`
