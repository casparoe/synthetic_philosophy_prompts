  (2) Motivational: Badness consists in occurrent aversion. Elena winces, cries, and demands cessation. Verdict: The pain is bad.
  (3) Attitudinal: Badness requires a negative standing attitude affecting life-totaling. Elena refuses costs to prevent recurrence while paying to avoid other nuisances. Verdict: The pain is not bad for her wellbeing.

  The structural feature is the dissociation between occurrent motivational force and prospective evaluative commitment. If we restore prospective aversion (she pays the surcharge), all three views converge on "bad." If we remove occurrent motivation (she sits calmly) or spread indifference (she refuses the chair upgrade), View (2) flips to "not bad," while View (3) remains unchanged. This isolates the variable: View (2) tracks the moment; View (3) tracks the life.

