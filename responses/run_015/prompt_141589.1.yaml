answer: |-
  This is a high-risk, high-reward seminar plan. It requires tight facilitation to prevent the "it's obviously a rabbit" intuition from derailing the simulation before the philosophical point lands. The key is rigid adherence to the behavioral constraints during the activity so the *frustration* of indeterminacy is felt, not just told.

  Here is the complete kit for the session.

  ### 1. Materials & Setup

  **Room Setup:**
  *   One table at the front with a cardboard screen (the "Informant Booth"). You sit behind it.
  *   Four clusters of tables for the teams (Teams A, B, C, D).
  *   **Projector:** Only for the timer and the final reveal. Do not project instructions; hand them out.

  **The "Informant" Protocol (For You):**
  *   You are a black box. You do not speak. You do not nod. You do not make eye contact.
  *   You have a **Master Response Table** (see below).
  *   You have two noisemakers/objects: A bell (Assent) and a woodblock click (Dissent).
  *   **Crucial:** If a student tries to ask "What does *gavagai* mean?" or "Can I point to the ear?", you click (Dissent) to the *question itself* (i.e., "That query is invalid"). You only respond to the specific query types on the cards.

  **Team Packets (4 identical sets):**
  *   **Deck of 30 Data Cards:** Pre-sorted stimuli with the recorded response already printed on the back (so they don't have to come to you for every card, saving 20 minutes). *Note: You keep the Master Table to verify if they try to go off-script in Phase 3.*
  *   **Manual Worksheet:** A one-page template with fields for:
      *   *Reference of 'Gavagai':* (e.g., ___________)
      *   *Condition for Assent to 'Gavagai?':* (e.g., When a ___________ is present)
      *   *Meaning of 'Same Gavagai':* (e.g., ___________)
      *   *Predicted Response to Held-Out Cases:* (Table to fill in)
  *   **12 Held-Out Case Cards:** Face down. These are the "test set."

  **Team D Secret Instruction (Hand to them only at start of Phase 4):**
  *   *"Your goal is to write a manual that contradicts Team A's ontology (e.g., if they say 'Rabbit', you say 'Temporal Stage') but predicts the exact same responses. To do this, you are allowed to redefine the logical words 'same', 'part', and 'is' alongside 'gavagai'. It must be a package deal."*

  ---

  ### 2. The Master Response Table (Neutrality Check)

  To ensure the data is neutral between **Rabbit**, **Undetached Rabbit Part**, and **Rabbit Stage**, your internal rule as the Informant is: **Assent if and only if a Rabbit-Stage is currently impinging on the visual field.**

  *Why this works:*
  *   If *Gavagai* = Rabbit: A rabbit is present iff a rabbit-stage is present.
  *   If *Gavagai* = Rabbit Part: A rabbit part is present iff a rabbit-stage (which includes parts) is present.
  *   If *Gavagai* = Rabbit Stage: A rabbit stage is present iff a rabbit-stage is present.

  **The Data Deck (30 Cards):**
  *   *1-10 (Basic Predication):* Whole rabbit in open (Assent); Rabbit behind bush/ear only (Assent); Rabbit shadow (Dissent); Rabbit carcass (Assent*); Empty field (Dissent).
      *   *(Note on Carcass: Quine treats 'gavagai' as a general term. A dead rabbit is still a rabbit/part/stage in the broad sense. If you dissent here, it biases toward 'live animal'. If you assent, it fits all three.)*
  *   *11-20 (Identity/Recurrence):* Rabbit runs past, disappears, reappears 5 mins later (Query: "Same Gavagai?").
      *   *Response:* Assent. (Fits "Same Animal" and "Gen-identical Stage").
      *   *Response:* Dissent. (If you want to introduce noise, but better to keep it clean: Assent).
  *   *21-30 (Plurality/Quantification):* Two rabbits at once. Query: "Gavagai?" (Assent). Query: "One Gavagai?" (Dissent).
      *   *Note:* This tests mass vs. count, but keep it simple. All three ontologies treat two rabbits as "not one."

  **Bias Check:**
  *   *Accidental Bias Risk:* If you include a card where a rabbit is sleeping vs. running, and you Assent to one and Dissent to the other, you break the Stage/Part symmetry.
  *   *Fix:* Ensure all "Assent" cards involve *some* visible rabbit-surface. Ensure all "Dissent" cards involve *no* rabbit-surface. Do not vary based on rabbit *behavior* (hopping vs. sitting), only on presence/absence.

  ---

  ### 3. Minute-by-Minute Timeline (90 Minutes)

  **00:00 – 00:10: Setup & Constraints**
  *   Divide into 4 teams (A, B, C, D).
  *   Read the **Informant Constraints** aloud. Emphasize: "You cannot ask me what I mean. You only have the cards. You cannot point. You cannot bribe."
  *   Hand out Data Decks and Manual Worksheets.
  *   *TA Script:* "You are field linguists. You have encountered a speaker of Embe. You have established 'Yea' and 'Nay'. You have 30 observation records. Your goal is to write a translation manual that predicts future behavior."

  **00:10 – 00:30: Phase 1 (Data Analysis)**
  *   Teams review the 30 cards.
  *   They must identify the pattern of Assent/Dissent.
  *   *Intervention:* If a team says "It's obviously rabbit," say: "Your job is to write the *manual* that justifies that prediction using only the data. Be precise."

  **00:30 – 00:45: Phase 2 (Manual Writing & Prediction)**
  *   Teams fill out the Worksheet (Reference, Conditions, Identity).
  *   They flip the 12 Held-Out Cards. They must predict Assent or Dissent for each based on their manual.
  *   **Reveal:** You announce the correct answers (from the Master Table).
  *   **Result:** Every team should have 12/12. (If a team failed, allow a 2-minute "revision" period. The data is designed so all *should* pass).

  **00:45 – 01:00: Phase 3 (Adversarial Testing)**
  *   Teams swap Manuals (A swaps with B, C with D).
  *   Task: "Design one new query or stimulus that would make the other team's manual give the *wrong* prediction."
  *   They propose the test to you. You check it against the Master Table.
  *   **Result:** Every test fails to distinguish. (e.g., Team A proposes pointing to a tail. You rule: "Pointing is not a valid query in this protocol." Or, if they propose a card: "That stimulus yields Assent," which fits both manuals).

  **01:00 – 01:15: Phase 4 (The Package Deal)**
  *   **Team D** opens their Secret Instruction. They have 10 minutes to rewrite their manual to be ontologically distinct (e.g., *Gavagai* = Rabbit Stage) but empirically identical.
  *   Teams A, B, C try to guess how Team D did it.
  *   Team D presents their "Stage Manual" and explains how they redefined "Same" to make the data fit.

  **01:15 – 01:30: Debrief & Quine Reveal**
  *   Now you can say the word **Inscrutability**.
  *   Map the activity to the text. Address objections.

  ---

  ### 4. The Debrief Script (Mapping Moments to Ideas)

  **1. The Perfect Score (Stimulus Meaning)**
  *   *Say:* "Every team got 100% accuracy. You all have different manuals (Rabbit vs. Part vs. Stage), but you all fit the data."
  *   *Quine Point:* This is **Empirical Equivalence**. The "Stimulus Meaning" (the set of sensory triggers for Assent/Dissent) is identical for all three hypotheses. If meaning is just behavioral disposition, these three meanings are the same. But they describe different objects.

  **2. The Failed Tests (Underdetermination)**
  *   *Say:* "In Phase 3, you tried to break the other manuals. You couldn't."
  *   *Quine Point:* This isn't just that you lacked time. It's that *no behavioral test* distinguishes them. Any test you devise (pointing to an ear, waiting for tomorrow) can be accommodated by adjusting the manual (e.g., redefining 'part' or 'same').

  **3. Team D's Move (Ontological Relativity)**
  *   *Say:* "Team D didn't just swap a noun. They swapped the logic."
  *   *Quine Point:* You can't just swap 'rabbit' for 'rabbit stage'. You also have to swap the meaning of 'is the same as'. If *gavagai* means stage, then 'same gavagai' means 'gen-identical stage'. This is the **Package Deal**. Reference is inscrutable because it is tied to the background logic.

  **4. Addressing the "Skepticism" Objection**
  *   *Student Objection:* "This is just skepticism. We don't *know* which one it is."
  *   *Your Reply:* "Skepticism says there is a fact (it *is* a rabbit) but we can't access it. Quine says there is **no fact of the matter**. The universe doesn't contain 'rabbits' or 'stages' independently of the conceptual scheme we use to carve it up. The behavior *is* the meaning. If the behavior is identical, the meaning is indeterminate."

  **5. Addressing the "Field Linguist" Objection (Your Flatmate)**
  *   *Student Objection:* "Real linguists live there for years. They learn the culture. They know it's rabbits."
  *   *Your Reply:* "Your flatmate is right about *practice*, but Quine is asking about *justification*. How does the linguist *know* it's a rabbit? They rely on the assumption that the natives share our ontology. Quine asks: What justifies that assumption? Nothing behavioral. So, practically, we assume rabbits. Philosophically, that assumption is ungrounded."

  **6. The "At Home" Kicker**
  *   *Say:* "Quine doesn't stop at the Emba Valley. If this is true for them, it's true for us. When I say 'rabbit' to you, is there a fact of the matter that we mean the same thing? Or are we just behaviorally synchronized?"

  ---

  ### 5. Troubleshooting: What Will Go Wrong

  **1. "I'll just point to the ear."**
  *   *Prediction:* A student will try to mime pointing during Phase 3.
  *   *Fix:* You must click (Dissent) immediately. Pre-empt this in the rules: "Queries must be verbalizable on a card. Pointing is not data."
  *   *Philosophical Payoff:* This mirrors Quine's constraint. Pointing presupposes a shared understanding of "object boundaries." You can't use pointing to *solve* the boundary problem.

  **2. "This is a joke, obviously it's a rabbit."**
  *   *Prediction:* Philosophy majors will get impatient with the game.
  *   *Fix:* Validate them. "You are right. It is a rabbit. But *why*? Is it because of the data? The game shows the data doesn't force that conclusion. So where does the 'rabbit' come from? (Answer: Our prior projection)."

  **3. Manual Writing Takes Too Long.**
  *   *Prediction:* Teams spend 20 minutes arguing about the definition of 'part'.
  *   *Fix:* Walk around with a timer. At minute 35, announce: "Freeze. Write down whatever you have. We need predictions." Imperfection is fine; the *existence* of multiple manuals is what matters.

  **4. Team D Stalls on the Package Deal.**
  *   *Prediction:* They try to swap 'rabbit' for 'part' but forget to swap 'same'.
  *   *Hint to Slip:* "If *gavagai* means 'stage', does 'same gavagai' mean 'the exact same slice of time'? If so, you'd have to Dissent on the 'reappearing rabbit' card. How do you avoid that?" (Answer: Redefine 'same' to mean 'gen-identical').

  ---

  ### 6. Limitations (What You Must Assert)

  Be honest in the final 5 minutes about what the simulation *didn't* do:

  1.  **Finite vs. Infinite Data:** The game shows indeterminacy relative to *this* deck of 30 cards. A skeptic will say "More data would fix it." Quine's claim is stronger: *No amount* of behavioral data fixes it. You have to assert this. The game is a microcosm, not a proof.
  2.  **Epistemic vs. Ontological:** The game feels like an epistemic gap ("We can't tell which manual is right"). You must push them to the ontological claim ("There is no right manual").
  3.  **The Analytic/Synthetic Distinction:** You likely won't have time to get into how this undermines the analytic/synthetic distinction (Two Dogmas), but mention it if they ask why Quine cares. (Answer: If translation is indeterminate, then "meaning" isn't a stable entity we can use to ground necessary truths).

  ### 7. TA Cheat Sheet for the "Informant"

  Keep this behind your screen.

  *   **Query:** "Gavagai?" (Is this a G?)
      *   **Stimulus:** Any visible rabbit surface (whole, part, moving, still, alive, dead). -> **Assent.**
      *   **Stimulus:** No rabbit surface (shadow, burrow, empty field). -> **Dissent.**
  *   **Query:** "Same Gavagai?" (Is this the same G as before?)
      *   **Stimulus:** Rabbit seen previously returns (even if different temporal slice). -> **Assent.**
      *   **Stimulus:** Different rabbit appears. -> **Dissent.**
  *   **Query:** "One Gavagai?"
      *   **Stimulus:** Single rabbit. -> **Assent.**
      *   **Stimulus:** Two rabbits. -> **Dissent.**
  *   **Query:** Anything else ("What means rabbit?", "Can I point?") -> **Dissent (Invalid Query).**

  Good luck. If you hold the line on the rules, the frustration they feel *is* the philosophy.
