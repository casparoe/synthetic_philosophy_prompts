answer: |-
  Hi there,

  It is completely normal to feel tangled up by this material, especially when you are trying to carve out a novel position for a chapter. You are asking exactly the right questions, and much of your intuition about the dialectical landscape is actually quite solid, though there is one specific area where your diagnosis of your own view needs sharpening. Let us walk through the shape of the argument and where your proposed solution fits into it, keeping in mind that you need to simplify this for first-years later in the week.

  The first thing to clarify is where Lewis's triviality result actually bites. You are right to suspect that the proof does not rely on possible worlds or similarity orderings specifically. It is an algebraic result about probability functions and the sentences they assign values to. The core engine of the proof is the requirement that the proposition expressed by the conditional must remain stable across changes in the probability function. Lewis assumes that if a conditional expresses a proposition, that proposition is the same object regardless of what your credences are, even though your probability in that proposition will change as you learn. Your move to make the content credence-indexed is a known strategy, often called contextualism about conditionals, and it does technically evade the strict mathematical derivation of the triviality result. If the proposition expressed by if A then C changes when your credence function changes, then the step in Lewis's proof where he conditionalizes the probability function and checks the truth of the same proposition no longer goes through. So, you are correct that the proof does not run against your view in its original form.

  However, this is where your mistake lies, and it is the thing you need to be most careful about when presenting your view. You are worried that you have quietly become a non-propositionalist, and while you haven't become an expressivist in the strict sense, you have paid a price that makes your view much closer to non-propositionalism than you might hope. By making the content depend on the credence function, you sacrifice the stability of the proposition across agents and times. If I assert a conditional to you, and we have different credence functions, we are literally talking about different propositions. Worse, if I learn new evidence and update my credences, the proposition I previously asserted changes its content. This makes it very difficult to explain disagreement, communication, and embedding. If the content shifts with the credence, then embedding that conditional under another operator, like negation or a probability operator, becomes fraught because you need to know which credence function fixes the content at that point in the logical form. So, while you can claim to be a truth-conditionalist, you are adopting a kind of truth-conditionalism that lacks the objective stability usually associated with propositions. You are not wrong to call them propositions, but you should acknowledge that they are not propositions in the classical sense that Lewis's proof assumes, and this limits what logical work they can do.

  Regarding your worry about circularity or fixed points, you are right to be concerned, but this is technically manageable. If the content is defined by the credence function, you need to ensure that the credence function is defined over an algebra that includes that content. This can lead to self-reference issues if not handled carefully, but the deeper philosophical worry is not mathematical inconsistency so much as explanatory power. If the truth conditions are fixed by the very credences they are supposed to constrain or explain, you risk making Stalnaker's thesis true by stipulation rather than by discovery. It becomes a definition of the content rather than a substantive claim about the relationship between language and belief. This is not a fatal flaw, but it is a significant theoretical cost that you should own rather than try to hide. You are building a view where the equation holds by construction, which means you need to argue why this construction is linguistically plausible, not just mathematically convenient.

  Your second intuition, about the trilemma, is roughly on target and is actually the stronger part of your current understanding. Lewis's result does not force you to give up truth-conditionality full stop unless you also insist on keeping Stalnaker's thesis and full Boolean embedding. You can keep truth conditions if you are willing to say the probability of the conditional is not the conditional probability, which is what material conditional theorists do. You can keep the equation if you are willing to say conditionals do not express propositions, which is what expressivists do. Or you can keep both if you restrict the logic, such as by banning iterated conditionals or limiting the class of probability functions. Nothing in the mathematical argument itself picks between these horns; the choice is driven by broader theoretical virtues like fit with natural language data or simplicity. So when you tell your reading group that the result establishes indicatives do not express propositions full stop, you are overstating the case. It establishes that they do not express stable propositions that satisfy the equation across all credence states. That is a weaker claim, and it leaves room for your contextualist approach, provided you accept the costs I mentioned earlier.

  On the question of approximate agreement and error bounds, this is not folklore; there are indeed results showing that even if you only require the probability of the conditional to be close to the conditional probability, you still face severe triviality constraints unless you restrict the domain significantly. This means your fallback option of simply saying the equation is approximately true does not save you from the hard choices. You still have to restrict embeddings or accept non-propositionalism. This is important for your Thursday talk because if you suggest to the first-years that we can just relax the equation slightly to make everything work, you will be setting them up for confusion later. It is better to be clear that the tension is structural and not just a matter of precision.

  Finally, regarding your worry about banning iterated and self-embedding conditionals, you are right to be hesitant about this. While it is a logically consistent move, and one that Adams took, claiming that natural language does not really embed conditionals is a big empirical ask. Natural language seems to allow sentences like if if A then C, then D, and denying this requires a lot of semantic heavy lifting to explain away the appearance. For a chapter aimed at a general philosophical audience, it is usually safer to acknowledge the embedding data and explain how your view handles it, rather than denying the data exists. If you go the restriction route, you need a story about why natural language misleads us here, which is a substantial project in itself. For your talk on Thursday, since you are speaking to first-years, you should probably simplify this by focusing on the core tension between the equation and the idea of a conditional having a truth value that can be true or false independently of our beliefs. You can present the trilemma as the main takeaway: we have to give up something, and different theories give up different things.

  To summarize where you stand, your diagnosis of the trilemma is correct and you are right that Lewis's proof relies on stability across probability functions. Your mistake is thinking that the credence-indexed move saves standard truth-conditionality without significant cost. It saves the equation, but it makes the content of the conditional unstable and context-dependent in a way that complicates embedding and disagreement. You are not wrong to pursue this, but you should frame it as a contextualist solution that accepts trade-offs, rather than a free lunch that rescues Stalnaker's thesis without consequences. If you go into your reading group acknowledging these trade-offs explicitly, you will look much stronger than if you try to defend it as a cost-free rescue mission. Good luck on Thursday, and do not worry too much about the muddle; this is one of the hardest spots in the philosophy of language, and feeling stuck here is a sign you are engaging with the material seriously.

  Best of luck with the writing and the talk.
