  Based on your constraints (one semester, high school level, no specialized resources) and your goal (identifying upstream questions that reshape the assessment of the others), I recommend prioritizing **Direction 4 (The Normative Criterion)** and **Direction 2 (The CDT/XOR Structural Flaw)**.

  I advise you to deprioritize Direction 1 (Multi-Agent EDT) as a primary research goal and treat Direction 3 (Institutional Design) as a testing ground for Direction 4 rather than an independent line of inquiry.

  Here is the defended agenda, ranked by upstream impact and filtered for tractability.

  ### Priority 1: Direction 4 (The Normative Criterion)
  **Question:** Is there a principled criterion for distinguishing legitimate predictive incentives from "mugging" conditions?

  *   **Upstream Impact:** **Highest.** This is the conceptual bottleneck for the entire project. If you cannot rigorously distinguish a "mugging" from a standard "incentive," then Direction 1 (multi-agent scenarios) and Direction 3 (institutional design) lack a normative foundation. You cannot claim an institution is "unfair" or a decision theory is "exploited" without a definition of fairness or exploitation that holds across counterfactuals. Resolving this reshapes how you assess the moral weight of the paradoxes in Directions 1 and 2.
  *   **Tractability:** **High.** This is a problem of conceptual analysis and philosophical argumentation, not formal logic or complex mathematics. It relies on constructing thought experiments, identifying intuitions, and testing consistency. This is well within reach for a motivated high school student with strong reading comprehension and writing skills.
  *   **Practical Connection:** **High.** This directly bridges the gap between abstract decision theory and real-world ethics (e.g., algorithmic bias, predatory lending, surveillance). It prevents the project from remaining a "pure intuition pump."
  *   **Strategic Role:** This should be the **core** of your semester. Your novel "nested XOR" idea serves as a stress test for the criterion you develop here.

  ### Priority 2: Direction 2 (The CDT/XOR Structural Flaw)
  **Question:** Does XOR blackmail expose a genuine structural flaw in Causal Decision Theory (CDT), or does it dissolve with granular causal modeling?

  *   **Upstream Impact:** **High (Theoretical).** This is the technical bottleneck. Direction 1 (Multi-Agent EDT) assumes that single-agent decision theory (like CDT or EDT) has specific failure modes. If XOR blackmail dissolves simply by specifying the causal model more carefully (e.g., treating the prediction as a common cause rather than a counterfactual lever), then the urgency for new decision theories (like FDT) or multi-agent extensions diminishes significantly. You cannot build a multi-agent theory on a single-agent foundation you haven't verified.
  *   **Tractability:** **Low to Medium.** This is the riskiest part of the agenda. Debates over causal granularity often require graduate-level familiarity with causal graphs (e.g., Pearl's structural models) and modal logic.
  *   **Practical Connection:** **Low.** This is primarily a theoretical puzzle about the definition of causation.
  *   **Strategic Role:** Do not attempt to *solve* this. Instead, treat it as a **boundary condition**. Your goal is to map the *cost* of resolving it. Show that *if* CDT is to be saved, it requires specific, perhaps implausible, assumptions about causal granularity. This allows you to acknowledge the technical depth without getting bogged down in unsolvable formalism.

  ### Deprioritized: Direction 1 (Multi-Agent EDT) & Direction 3 (Institutions)

  *   **Direction 1 (Multi-Agent):** I recommend deprioritizing this as a *solution* goal. It is downstream of Direction 2. If Direction 2 remains unresolved (i.e., if we aren't sure if XOR is a real flaw), then analyzing multi-agent recursions is premature. Furthermore, multi-agent decision theory with prediction often leads to infinite regress problems that are mathematically intractable without specialized training. **Keep your "nested XOR" idea as the *motivating example* for Direction 4, but do not make solving the equilibrium the goal of the semester.**
  *   **Direction 3 (Institutions):** I recommend treating this as downstream of Direction 4. You cannot design or critique institutions (Direction 3) without the normative criterion (Direction 4). Use Direction 3 only to *test* your criterion. For example: "If my criterion from Direction 4 is correct, does it imply this auditing protocol is unethical?" This keeps the project grounded without requiring you to become an expert in market design or policy.

  ### Summary of the Agenda

  1.  **Primary Focus:** Develop the **Normative Criterion (Direction 4)**. This is your unique contribution. It is tractable, upstream of the institutional questions, and gives moral weight to the technical puzzles.
  2.  **Secondary Focus:** Map the **CDT/XOR Flaw (Direction 2)**. Do not try to fix CDT. Try to show *why* it is hard to fix, and how that difficulty motivates the need for your Normative Criterion.
  3.  **Application:** Use your **Nested XOR variant** (from Direction 1) and **Institutional Examples** (from Direction 3) as *test cases* for your Criterion.

  ### What Would Change This Ranking?

  *   **If you find a formal proof in Direction 2:** If you discover (through reading) that the XOR blackmail paradox has been definitively resolved in recent literature via a specific causal modeling technique, Direction 2 loses its upstream status. You would then shift focus entirely to Direction 4 and 3, as the technical foundation would be settled.
  *   **If Direction 4 proves too abstract:** If you find yourself unable to generate a non-ad-hoc criterion after 4-6 weeks, you should pivot to Direction 3. Use specific case studies of predictive institutions to *induce* a criterion, rather than trying to deduce one from first principles.
  *   **If you gain access to formal mentorship:** If you find a mentor with expertise in causal modeling, Direction 2 becomes more tractable, and you could elevate it to a co-primary focus. Without that, it remains a high-risk sinkhole.

  This agenda maximizes your chances of producing a complete, defensible philosophical argument within one semester, while ensuring your work remains connected to the foundational debates in decision theory.
