prompt: |-
  Hey, I'm putting together a workshop for junior legislative drafters and I need a reusable decision procedure they can actually run. You should act like an expert in penal philosphy and institutional design—think carefully, start by brainstorming the distinctions that survive when you move from seminar-room talk to statutory text, then build the tool. I need a step-by-step checklist for classifying whether a sentencing bill is operating on retributivist logic (backward-looking desert, proportionality to blame) or consequentialist logic (forward-looking deterrence, rehabilitation, incapacitation), plus a specific flag for "rationale laundering"—where the language sounds like one but the mechanism does the other. The proscedure needs ordered questions, clear stop points ("label it X"), explicit escalation points where the call is about values not facts, and a time budget of about 15 minutes per bill with no philosophy training required. Then run it on two proposals: first, a bill that sets mandatory prison terms for ecological damage calculated by an "ecosystem harm index" that mimics proportionality but is actually driven by predictive damage modeling; second, a bill allowing sentence reduction for assault if the offender completes trauma-informed CBT, but framing the reduction as "earning mercy" rather than hitting rehab targets. Include one case where the checklist gives your drafters an answer they won't like and still have to document. End by saying exactly where the procedure will misfire or where two analysts in good faith will run it differently, and don't ask for any citations or reading lists—just the practical framework.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **Target Audience:** Junior legislative drafters (no philosophy training).
      *   **Goal:** A reusable decision procedure (checklist/tool) to classify sentencing bills as Retributivist or Consequentialist, including detecting "Rationale Laundering."
      *   **Constraints:**
          *   Step-by-step checklist with ordered questions.
          *   Clear stop points ("Label it X").
          *   Explicit escalation points (values vs. facts).
          *   Time budget: ~15 minutes per bill.
          *   No citations/reading lists.
          *   Must run the tool on two specific hypothetical proposals.
          *   Must include one case where the answer is unwelcome but must be documented.
          *   Must end with limitations/failure points of the procedure itself.
      *   **Tone:** Expert in penal philosophy and institutional design, practical, rigorous, actionable.

  2.  **Deconstruct the Philosophical Distinctions for Statutory Text:**
      *   *Retributivism:* Focuses on the *past act*. Key markers: "Guilt," "Blame," "Proportionality," "Just Deserts," "Severity matches Harm/Culpability." Mechanism: Fixed tariffs, mandatory minimums based on harm, limits on mitigation.
      *   *Consequentialism:* Focuses on the *future outcome*. Key markers: "Risk," "Rehabilitation," "Deterrence," "Public Safety," "Recidivism." Mechanism: Indeterminate sentences, parole boards, treatment mandates, sentence reductions based on behavior/change.
      *   *Rationale Laundering:* The text *says* one thing (e.g., "justice for victims") but the *mechanism* does another (e.g., "hold until risk is low"). Or vice versa (e.g., "treatment" that is actually punitive confinement).

  3.  **Drafting the Decision Procedure (The Tool):**
      *   *Structure:* Needs to be a flowchart logic but written as a checklist.
      *   *Time Management:* Break it down into 3 chunks of 5 minutes.
      *   *Questions:* Must be textual and mechanical, not abstract. Look for specific verbs and nouns.
      *   *Escalation:* Where do drafters need to call a senior? When the text is ambiguous or mixes logics irreconcilably.
      *   *Laundering Flag:* A specific test for mismatch between preamble/intent clauses and operative provisions.

  4.  **Developing the Test Cases:**
      *   *Case 1 (Ecological Damage):* Mandatory terms based on "ecosystem harm index."
          *   *Surface:* Looks retributive (harm = punishment).
          *   *Deep:* Index is based on *predictive damage modeling* (future risk/consequence).
          *   *Verdict:* Consequentialist logic disguised as Retributive proportionality. (Rationale Laundering).
      *   *Case 2 (Assault/CBT):* Sentence reduction for CBT.
          *   *Surface:* Looks consequentialist (rehab).
          *   *Deep:* Framed as "earning mercy" (moral desert/retroactive moral improvement).
          *   *Verdict:* Retributive logic (moral worth) disguised as Rehab. Or potentially a hybrid that needs flagging. Let's make it the "unwelcome answer" case. If the tool says it's Retributive, but the policy goal was Rehab, that's a conflict drafters need to document. Actually, the prompt asks for *one* case where the checklist gives an answer they won't like. Let's make Case 2 the one where the tool identifies "Rationale Laundering" that undermines the political selling point.

  5.  **Refining the Procedure (Iterative Design):**
      *   *Step 1: The Trigger.* What variable determines the sentence length?
      *   *Step 2: The Modifier.* What changes the sentence?
      *   *Step 3: The Stated Purpose.* What does the preamble say?
      *   *Comparison:* Does Step 1&2 match Step 3?
      *   *Escalation:* If "Public Safety" is used to justify a fixed term based on past harm.

  6.  **Writing the Content - Section by Section:**

      *   **Introduction:** Set the frame. This is about *institutional logic*, not moral truth.
      *   **The Tool (The "Sentencing Logic Classifier"):**
          *   Phase 1: Operational Mechanics (5 mins).
          *   Phase 2: Stated Intent (5 mins).
          *   Phase 3: Alignment & Laundering Check (5 mins).
          *   Escalation Protocol.
      *   **Application 1 (Ecological Bill):** Walk through the steps. Identify the laundering (Harm Index is actually risk modeling).
      *   **Application 2 (Assault/CBT Bill):** Walk through the steps. Identify the unwelcome truth (Mercy is a retributive concept, not rehab).
      *   **Limitations:** Where does this fail? (Hybrid theories, political ambiguity, judicial discretion).

  7.  **Self-Correction/Review against Constraints:**
      *   *15 minutes?* Yes, the steps are concise.
      *   *No philosophy training?* Avoid terms like "deontology" or "utilitarianism." Use "Past-Focus" vs. "Future-Focus."
      *   *Escalation points?* Included.
      *   *Unwelcome answer?* Yes, in Case 2, telling them "Mercy" isn't "Rehab" might annoy the policy lead.
      *   *Limitations?* Included at the end.
      *   *No citations?* Checked.

  8.  **Final Polish:** Ensure the tone is authoritative but practical. Make sure the "Rationale Laundering" definition is sharp. (Laundering = Stated Goal $\neq$ Operational Mechanism).

      *(Self-Correction on Case 2)*: The prompt asks for a specific flag for rationale laundering. In Case 2, framing rehab as "earning mercy" is actually the reverse laundering (Consequentialist mechanism, Retributive language). I need to make sure the tool catches this mismatch. The "unwelcome answer" should be that the bill is legally vulnerable because "mercy" is non-justiciable, whereas "rehab metrics" are measurable. The tool should flag this as a drafting risk.

      *(Refining the "Unwelcome Answer")*: Let's make sure the tool forces them to document that the *mechanism* is Consequentialist (CBT completion) but the *language* is Retributive (Mercy). This creates legal uncertainty. The "unwelcome" part is telling the policy sponsor that their "compassionate" framing is actually philosophically incoherent or legally risky.

      *(Refining the Limitations)*: Be honest. Statutes are often compromises. The tool forces a binary choice on a spectrum. That's a feature, but also a bug.

  9.  **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  # The Sentencing Logic Classifier (SLC-v1)

  **Purpose:** To determine the operational logic of a sentencing provision (Retributive vs. Consequentialist) and detect "Rationale Laundering" (mismatch between stated intent and operational mechanism).
  **User:** Legislative Drafting Team.
  **Time Budget:** 15 Minutes.
  **Prerequisite:** Text of the Bill (specifically Operative Clauses + Preamble/Intent Section).

  ---

  ## Phase 1: Operational Mechanics (5 Minutes)
  *Ignore the preamble. Look only at the clauses that determine sentence length or conditions of release.*

  **Q1. What variable primarily sets the baseline sentence length?**
  *   A) The severity of the *past act* (harm caused, value stolen, injury inflicted). $\rightarrow$ **Score +1 Retributive**
  *   B) The characteristics of the *offender* (risk score, prior record, gang affiliation). $\rightarrow$ **Score +1 Consequentialist**
  *   C) A mix of both. $\rightarrow$ **Score 0 (Proceed to Q2)**

  **Q2. What mechanism allows for sentence reduction or early release?**
  *   A) Time served only (fixed terms, "truth in sentencing"). $\rightarrow$ **Score +1 Retributive**
  *   B) Discretionary behavior, treatment completion, or risk assessment (parole, good time, rehab programs). $\rightarrow$ **Score +1 Consequentialist**
  *   C) Executive clemency or judicial mercy clauses. $\rightarrow$ **Score 0 (Flag for Q5)**

  **Q3. How is "Dangerousness" treated?**
  *   A) Irrelevant to sentence length (dangerousness does not extend time beyond the harm deserved). $\rightarrow$ **Score +1 Retributive**
  *   B) Central to sentence length (indefinite confinement until "safe," preventive detention). $\rightarrow$ **Score +1 Consequentialist**

  **Stop Point 1:** If Score is +3 or -3, label **Operational Logic: [Retributive/Consequentialist]**. If Score is mixed or 0, proceed to Phase 2.

  ---

  ## Phase 2: Stated Intent (5 Minutes)
  *Look only at the Preamble, Purpose Clause, or Ministerial Second Reading Speech text embedded in the bill.*

  **Q4. What is the primary noun used to justify the penalty?**
  *   A) Justice, Desert, Blame, Accountability, Proportionality. $\rightarrow$ **Label Intent: Retributive**
  *   B) Safety, Recovery, Deterrence, Risk-Reduction, Public Protection. $\rightarrow$ **Label Intent: Consequentialist**
  *   C) Mercy, Forgiveness, Redemption, Moral Growth. $\rightarrow$ **Label Intent: Moral/Retributive Hybrid**

  **Stop Point 2:** If Operational Logic (Phase 1) matches Intent (Phase 2), label **CONSISTENT**. Proceed to Phase 3 only if they mismatch.

  ---

  ## Phase 3: The Laundering Check (5 Minutes)
  *Use this only if Phase 1 and Phase 2 do not match, or if Q2/C or Q4/C were triggered.*

  **Q5. The "Justiciability Test":**
  Can a court objectively measure the criteria for release/sentencing without making a moral judgment?
  *   **Yes** (e.g., "Completed 40 hours of CBT," "Index score > 5"). $\rightarrow$ **Mechanism is Consequentialist.**
  *   **No** (e.g., "Shows remorse," "Earned mercy," "Deemed worthy"). $\rightarrow$ **Mechanism is Retributive/Moral.**

  **Q6. The "Temporal Anchor Test":**
  Does the critical metric look backward or forward?
  *   **Backward:** "Based on the damage *done*." $\rightarrow$ **Retributive.**
  *   **Forward:** "Based on the damage *predicted* or *prevented*." $\rightarrow$ **Consequentialist.**

  **Decision Rule:**
  1.  If **Intent = Retributive** BUT **Mechanism = Consequentialist** (e.g., "Justice" via Risk Models): **FLAG: LAUNDERING (Type A: False Proportionality).**
  2.  If **Intent = Consequentialist** BUT **Mechanism = Retributive** (e.g., "Safety" via Fixed Tariffs): **FLAG: LAUNDERING (Type B: False Security).**
  3.  If **Language = Moral** (Mercy/Redemption) BUT **Mechanism = Clinical** (CBT/Treatment): **FLAG: DRAFTING RISK (Non-Justiciable Standards).**

  **Escalation Point:** If **FLAG: DRAFTING RISK** is triggered, you must escalate to Senior Counsel. This creates judicial discretion that undermines legislative certainty.

  ---

  ## Application 1: The "Ecological Harm" Bill
  **Proposal:** Mandatory prison terms for corporate officers based on an "Ecosystem Harm Index."
  **Text:** "Sentences shall be proportional to the Index Score." (Intent: Proportionality/Retributive).
  **Mechanism:** Index Score is calculated using "predictive damage modeling" of future regeneration capacity, not just past spill volume.

  **Run the SLC:**
  *   **Phase 1 (Ops):**
      *   Q1: Sets length by "Index Score." Sounds like harm (Ret), but definition is "predictive modeling" (Con). $\rightarrow$ **Score 0.**
      *   Q2: Mandatory terms. No reduction. $\rightarrow$ **Score +1 Retributive.**
      *   Q3: Dangerousness? Implicit in the predictive model. $\rightarrow$ **Score +1 Consequentialist.**
      *   *Result:* Mixed Operational Logic.
  *   **Phase 2 (Intent):**
      *   Q4: Uses word "Proportional." $\rightarrow$ **Label Intent: Retributive.**
  *   **Phase 3 (Laundering):**
      *   Q5 (Justiciability): Index is scientific/model-based. $\rightarrow$ **Mechanism is Consequentialist.**
      *   Q6 (Temporal): "Predictive damage modeling." $\rightarrow$ **Forward-Looking.**

  **Verdict:** **FLAG: LAUNDERING (Type A: False Proportionality).**
  **Drafting Note:** The bill claims to punish based on *desert* (proportionality to harm) but actually punishes based on *risk* (future regeneration).
  **Action:** Document that the "Harm Index" is a risk assessment tool disguised as a harm metric. If the policy goal is deterrence based on risk, change the Preamble to reflect "Public Safety" rather than "Proportionality."

  ---

  ## Application 2: The "Trauma & Mercy" Bill
  **Proposal:** Sentence reduction for assault offenders who complete trauma-informed CBT.
  **Text:** "Offenders may receive clemency if they have earned mercy through moral rehabilitation."
  **Mechanism:** Reduction granted upon certification of CBT completion.

  **Run the SLC:**
  *   **Phase 1 (Ops):**
      *   Q1: Baseline is assault (Harm). $\rightarrow$ **Score +1 Retributive.**
      *   Q2: Reduction for treatment completion. $\rightarrow$ **Score +1 Consequentialist.**
      *   Q3: Dangerousness? Implicitly reduced by treatment. $\rightarrow$ **Score +1 Consequentialist.**
      *   *Result:* Mixed Operational Logic (Hybrid).
  *   **Phase 2 (Intent):**
      *   Q4: Uses words "Earned Mercy," "Moral Rehabilitation." $\rightarrow$ **Label Intent: Moral/Retributive Hybrid.**
  *   **Phase 3 (Laundering):**
      *   Q5 (Justiciability): "Earned mercy" is subjective. CBT completion is objective. $\rightarrow$ **Conflict.**
      *   Q6 (Temporal): CBT is future-looking (risk reduction). Mercy is backward-looking (moral worth).

  **Verdict:** **FLAG: DRAFTING RISK (Non-Justiciable Standards).**
  **The Unwelcome Answer:** The checklist forces you to document that **"Mercy" cannot be legislatively mandated via CBT.**
  *   *Why drafters won't like this:* The policy sponsor wants to sell this as "compassionate justice." The tool tells you that by tying "mercy" to a clinical checkbox, you have turned mercy into a transaction. This invites courts to strike down the "mercy" language as vague while enforcing the CBT mandate, effectively turning a "moral" bill into a cold "risk management" bill.
  *   *Required Documentation:* You must advise that the term "Mercy" be struck and replaced with "Sentence Modification for Treatment Compliance" to align the text with the operational logic (Consequentialist).

  ---

  ## Failure Modes & Limitations
  *Do not use this tool if:*

  1.  **The "Hybrid" Defense:** Politicians often intend *both* logics simultaneously (e.g., "Punish the crime, fix the criminal"). The SLC forces a binary choice. If the bill is intentionally ambiguous to secure votes, the SLC will return a "Laundering" flag. In this case, the flag is correct, but the instruction is to *ignore* it for political reasons. You must document the flag, then shelve it.
  2.  **Judicial Discretion:** If the bill gives judges wide discretion ("Sentence as deemed fit"), the Operational Mechanics (Phase 1) cannot be scored. The logic resides in the case law, not the text. The SLC will misfire.
  3.  **Symbolic Legislation:** Some bills are purely expressive. They have no operational mechanics (e.g., "It is the sense of the legislature that..."). The SLC will time out at Phase 1.
  4.  **Analyst Variance:** Two drafters may disagree on Q1 (Is a "risk score" based on past record a measure of *past blame* or *future risk*?). This is not a bug; it is a feature. If two analysts cannot agree on Q1 within 2 minutes, escalate immediately. The text is ambiguous enough to be litigated.

  **Final Instruction:** The SLC does not tell you if the bill is *good*. It tells you if the bill is *honest* about how it deprives liberty. Document the flags. File the memo. Send the bill.
