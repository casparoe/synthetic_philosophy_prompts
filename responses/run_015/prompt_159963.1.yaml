      *Troubleshooting:* "Someone spotting the trick."
      *   Response: Validate them, but ask them to hold fire to let others experience the friction. "You've seen the matrix, now watch the others navigate it."

      *Honest Note:* Crucial. The "feeling" of rightness is what the model simulates. Students have "reasons." The model has "pressures."

