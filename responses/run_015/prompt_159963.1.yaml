answer: |-
  # Seminar Activity: The Slippage Engine

  ## 1. Logistics & Setup

  *   **Time:** 90 Minutes.
  *   **Participants:** 14 Students (divide into 4 teams of 3–4).
  *   **Room:** Tables arranged for team collaboration. Whiteboard or projector for tallying.
  *   **Materials:**
      *   **Handout A (The Domain):** One per student. Contains *only* the symbol set and the two orders. No text explaining "analogy."
      *   **Handout B (Problem Set):** One per team. Contains the specific source-target pairs for Round 1 and 2.
      *   **Prediction Slips:** Small cards for teams to record their answer and their prediction of the room's distribution.
      *   **Perturbation Card:** One large card revealed mid-session.
      *   **Scoreboard:** Whiteboard to track "Credibility Points."

  ## 2. Handout A: The Domain (Text for the page)

  > **SYMBOLS:** • ○ △ ✕ ★
  >
  > **RELATION 1 (RING):** • → △ → ✕ → ★ → ○ → •
  > *(Read: The successor of • is △, the successor of ○ is •, etc.)*
  >
  > **RELATION 2 (WEIGHT):** • < ○ < △ < ✕ < ★
  > *(Read: ○ is heavier than •, △ is heavier than ○, etc. ★ is the heaviest.)*

  ## 3. Timeline & Script

  ### 00:00 – 05:00 | Orientation & Team Formation
  *   **Action:** Divide into 4 teams. Distribute Handout A.
  *   **Script:** "You have a domain with five symbols and two relations. There are no hidden rules. In a moment, you will solve transformation puzzles. A puzzle gives you a *Source* string and a *Target* string, showing how the Source changes. You must apply the *same change* to a *New Source* to find its *New Target*."
  *   **Constraint:** "Do not discuss your reasoning with other teams. Inside your team, you must agree on a single answer."

  ### 05:00 – 15:00 | Round 1: The Calibration (Trivial)
  *   **Goal:** Commitment. Establish the "Right/Wrong" baseline.
  *   **Problem 1 (Handout B):**
      *   *Example Pair:* `• △` → `• ✕`
      *   *New Source:* `○ △`
      *   *Task:* Find the New Target.
  *   **Process:** Teams discuss (3 mins). Write Answer on Prediction Slip.
  *   **Prediction Task:** "On the slip, write your answer. Below it, write what percentage of the other teams you think will write that same answer."
  *   **Reveal:** All teams hold up slips. (Expected: 100% consensus on `○ ✕`).
  *   **Scoring:** If 100% of the room agrees, everyone gets 10 Credibility Points.
  *   **Script:** "Good. The rule seems clear. Change the rightmost symbol to its successor." (Do not specify *which* successor).

  ### 15:00 – 35:00 | Round 2: The Friction (Divergence)
  *   **Goal:** Induce ambiguity without naming it.
  *   **Problem 2:**
      *   *Example Pair:* `• ○` → `• △`
      *   *New Source:* `✕ ○`
      *   *Task:* Find the New Target.
      *   *(Note: ○ is rightmost and heaviest. Weight successor is △. Ring successor is •.)*
  *   **Problem 3:**
      *   *Example Pair:* `△ ✕` → `△ ★`
      *   *New Source:* `• ★`
      *   *Task:* Find the New Target.
      *   *(Note: ★ is rightmost and heaviest. Weight successor: None. Ring successor: ○.)*
  *   **Problem 4 (The Role Conflict):**
      *   *Example Pair:* `• △` → `• ✕`
      *   *New Source:* `△ •`
      *   *Task:* Find the New Target.
      *   *(Note: In New Source, △ is heaviest, • is rightmost. In Example, these were the same symbol. Which role governs the change?)*
  *   **Process:** Teams work (15 mins). They must submit **one** answer per problem but discuss *why* alternatives might be chosen for the prediction score.
  *   **Prediction Task:** "For each problem, predict the distribution of answers in this room. (e.g., 75% Answer A, 25% Answer B)."
  *   **Scoring:** Collect slips. Instructor tallies actual distribution on board. Teams calculate their own "Prediction Accuracy Score" (10 points minus the absolute difference between their prediction and reality for each answer cluster).
      *   *Example:* If room splits 50/50, and you predicted 50/50, you get 10 points. If you predicted 100/0, you get 0 points.
  *   **Script:** "Calculate your scores. You will notice that being 'correct' matters less than understanding the space of possibilities."

  ### 35:00 – 45:00 | Tally & The First Crack
  *   **Action:** Instructor displays the distribution of answers for Problems 2, 3, and 4.
  *   **Observation:** Point out clusters. "Problem 2 has two dominant clusters. Problem 3 has a cluster and a void. Problem 4 has three."
  *   **Script:** "The domain has not changed. The symbols are the same. Yet the 'rule' has fractured. Why?" (Take 2-3 brief comments, do not resolve).

  ### 45:00 – 60:00 | Round 3: The Perturbation
  *   **Action:** Reveal **Perturbation Card**.
      *   **Text:** "WEIGHT ORDER SUSPENDED. ONLY RING ORDER EXISTS."
  *   **Task:** Re-answer Problems 2 and 3 *only*.
  *   **Process:** Teams revisit their previous answers (5 mins). Submit new slips.
  *   **Debrief:**
      *   Problem 2 (`✕ ○` → ?): Previously split (△ vs •). Now consensus (`✕ •`).
      *   Problem 3 (`• ★` → ?): Previously split (○ vs Error). Now consensus (`• ○`).
  *   **Script:** "Did the logic change? No. Did the *pressure* change? Yes. Without Weight, the Ring had no competitor. The 'ambiguity' was not in the symbols, but in the competition between descriptions."

  ### 60:00 – 75:00 | Round 4: Building the Trap
  *   **Task:** Each team designs a *New Source* for the original Example Pair (`• △` → `• ✕`).
  *   **Constraint:** Your New Source must force a team committed to "Change the Heaviest Symbol" to give a different answer than a team committed to "Change the Rightmost Symbol."
  *   **Rule for Validity:** You must provide a "Spirit of the Rule" clause. (e.g., "If you change the wrong symbol but the right transformation, it counts as a slip, not a fail.")
  *   **Exchange:** Teams swap traps. Solve the other team's trap.
  *   **Discussion:** "Was it hard to force the slip? Was it hard to define the 'Spirit'?"

  ### 75:00 – 90:00 | Debrief & Conceptual Mapping
  *   **Instructor Lecture (10 mins):** Connect activity to theory.
      *   **Conceptual Slippage:** The move from △ to ✕ in Round 1 felt rigid. The move from ○ to •/△ in Round 2 required *slippage* (deciding which description of 'successor' holds).
      *   **Levels of Description:** "Rightmost" is a positional description. "Heaviest" is an intrinsic description. The Example Pair (`• △` → `• ✕`) allowed both to map to the same object. The Target (`△ •`) forced them apart.
      *   **Pressure:** The Perturbation showed that answers are not static truths but equilibria under pressure. Remove a pressure (Weight), and the equilibrium shifts.
  *   **Final Question:** "In Round 2, when your team disagreed on an answer, did it feel like one person was 'wrong' or like you were looking at the same object from different heights? Be honest."

  ---

  ## 4. Concrete Instance Set & Answer Table

  | Item | Example Pair | New Source | Candidate Answers | Descriptions Separated | Purpose |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1** | `• △` → `• ✕` | `○ △` | `○ ✕` (Consensus) | None (Baseline) | **Calibration.** Establishes commitment. Both Ring & Weight agree on △→✕. |
  | **2** | `• ○` → `• △` | `✕ ○` | `✕ △` (Weight)<br>`✕ •` (Ring) | Weight-Successor vs. Ring-Successor | **Divergence.** ○ is rightmost/heaviest. Weight says △, Ring says •. Forces choice of relation. |
  | **3** | `△ ✕` → `△ ★` | `• ★` | `• ○` (Ring)<br>`• [Error]` (Weight) | Defined Successor vs. Undefined Successor | **The Cliff.** ★ has no weight successor. Forces decision: Wrap or Stop? |
  | **4** | `• △` → `• ✕` | `△ •` | `✕ •` (Heaviest)<br>`△ ○` (Rightmost/Wt)<br>`△ △` (Rightmost/Ring) | Object Identity (Heaviest) vs. Position (Rightmost) | **Role Conflict.** In Example, Heaviest=Rightmost. In Target, they split. Forces decision on *what* changes. |

  ---

  ## 5. Payoff Scheme: "The Prediction Market"

  *   **Currency:** Credibility Points (CP). Start at 0.
  *   **Mechanism:**
      1.  **Answer Score:** If your team's answer matches the *modal* answer of the room (the most common one), +5 CP. (This keeps them engaged in solving).
      2.  **Distribution Score:** For each problem, you predict the % split of the room.
          *   Score = 10 - (Sum of absolute differences between your % and actual %).
          *   *Example:* Actual split is 75% A / 25% B. You predict 70% A / 30% B. Difference is 5 + 5 = 10. Score = 10 - 10 = 0.
          *   *Example:* You predict 75% A / 25% B. Difference is 0. Score = 10.
  *   **Why:** This rewards teams for modeling the *cognitive space of the class*, not just the logic of the puzzle. It makes the ambiguity a visible, scoreable object.

  ---

  ## 6. Mid-Session Perturbation Design

  *   **The Card:** "NOTICE: THE WEIGHT ORDER HAS BEEN REVOKED. SYMBOLS HAVE NO WEIGHT. ONLY THE RING REMAINS."
  *   **Timing:** Revealed after Round 2 tally.
  *   **Instruction:** "Re-evaluate Problems 2 and 3. You do not need to rewrite Problem 1 or 4."
  *   **Expected Shift:**
      *   Problem 2: Teams who argued for `✕ △` (Weight) must slip to `✕ •` (Ring).
      *   Problem 3: Teams who argued for "Error" must slip to `• ○`.
  *   **Pedagogical Point:** The "Truth" of the answer depended on the *availability* of the concept. When Weight is removed, the slippage becomes impossible; the rule rigidifies. This demonstrates that rule-following is context-dependent, not context-free.

  ---

  ## 7. Closing Round: Building the Trap

  *   **Instructions:** "You are now the designers. Your goal is to break a rule-follower."
  *   **Step 1:** Take the Example Pair `• △` → `• ✕`.
  *   **Step 2:** Create a *New Source* where the 'Heaviest' symbol and the 'Rightmost' symbol are **not** the same.
  *   **Step 3:** Write a 'Spirit Clause'. Example: *"An answer is valid if it changes the Heaviest symbol, even if it ignores Position."*
  *   **Step 4:** Swap with another team. They must solve your trap. If their answer violates your Spirit Clause, they lose 5 CP. If it violates the Letter of the Rule but keeps the Spirit, they gain 5 CP.
  *   **Goal:** To make them explicitly articulate the boundary between a "mistake" and a "different interpretation."

  ---

  ## 8. Troubleshooting: Predictable Failures

  | Failure Mode | Prediction | Intervention |
  | :--- | :--- | :--- |
  | **The Early Spotter** | A student realizes in Round 1 that Ring/Weight differ and announces it. | **Validate & Contain:** "Excellent observation. Please hold that insight in your pocket. For the next 20 minutes, I need you to act as if you don't know it, so we can measure how the tension feels when it emerges naturally." |
  | **The Nihilist Team** | A team decides in Round 2 that "There is no answer" and refuses to play the prediction game. | **Reframe:** "'No answer' is a valid answer in Problem 3. Put that on your slip. Predict how many other teams will also say 'No answer.' If you're right about the distribution, you win the points." |
  | **The Gimmick Reading** | Students treat the two orders as a "trick" rather than competing valid descriptions. | **Debrief Emphasis:** In the closing, ask: "Which order is more 'real'? Weight feels physical, Ring feels cyclic. Why did you trust one over the other?" Highlight that *both* were given on the handout as facts. |
  | **Tally Time-Sink** | Calculating prediction scores takes too long, eating the debrief. | **Simplify:** Do not calculate exact scores. Ask for a show of hands: "Who predicted the split within 10%?" Award a flat 10 points to those hands. Keep the energy high, the math low. |

  ---

  ## 9. Honest Note: Limitations of the Session

  **What this session cannot reproduce:**
  In the classical Copycat/ACME architecture, slippage is **subpersonal**. The system does not "choose" to slip from *Weight* to *Ring*; rather, the activation of the concept *Weight* decays under pressure, and *Ring* surges, causing the output to shift stochastically. The system feels "pressure," not "ambiguity."

  **What your students will do:**
  Your students are **personal** agents. They will deliberate. They will say, "I chose Ring because it wraps." They will rationalize *post-hoc*. They will not feel the *urge* to slip; they will feel the *burden* of choice.

  **How to supply the missing piece:**
  In the debrief, you must explicitly bridge this gap.
  *   **Say:** "You just made conscious choices. In a cognitive architecture, these choices are the *result* of thousands of micro-collisions you didn't see. You felt the *aftermath* of the pressure (the disagreement); the model feels the *force* of the pressure (the activation levels)."
  *   **Why:** If you don't make this distinction, they will leave thinking analogy is just "ambiguous rule-following." You need them to understand it as "competitive activation of descriptions." Use their deliberate choices as data points to illustrate where the pressures *would* have been applied in a subpersonal system.
