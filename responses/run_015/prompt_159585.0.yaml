answer: |-
  **Executive Summary**

  Your package is remarkably coherent on the surface, but it contains one critical structural fault line that threatens to collapse both the clinical policy and the constitutional argument. The tension is not primarily between your clinical cases (anorexia vs dementia), but between your clinical justification and your constitutional principle.

  You are attempting to hold two incompatible theories of *why* the past binds the present. In the clinic, you rely on the **epistemic superiority of the past self** ("better conditions"). In the constitution, you reject the **epistemic superiority of the past generation** ("founders were allegedly calmer"). These are the same argument. If the founders' calmness doesn't bind the living electorate, the well-patient's calmness cannot bind the relapsing patient *on that specific ground*.

  Below is the audit, ranked by severity, followed by the specific revision required to make the package hang together.

  ---

  ### 1. Critical Severity: The Sovereignty Paradox (a/b vs. e)

  **The Collision:**
  In (a), you justify enforcing the Ulysses clause because the earlier decision was made in "better conditions." In (e), you reject substantive entrenchment precisely because it relies on the claim that founders were "calmer and wiser."
  *   **Mechanism:** Both cases involve a principal (patient/citizen) binding their future self (relapsing patient/current electorate) based on a past judgment.
  *   **The Contradiction:** You cannot claim the past self has authority due to superior mental state in the hospital while denying the past generation that same authority in the polity. If the "dead hand" is illegitimate in the constitution because the living must govern themselves, the "past hand" is illegitimate in the clinic for the same reason, unless you can distinguish the *nature* of the constraint.

  **Cost of Holding the Line:**
  If you keep both justifications as they stand, your policy is vulnerable to a simple reductio: "If the current electorate is sovereign despite the founders' wisdom, why is the relapsing patient not sovereign despite their well-self's wisdom?"
  *   **What must go:** The phrase "better conditions" in (a). You cannot rest the Ulysses clause on the *quality* of the past decision-making environment.
  *   **What to replace it with:** The **Temporary Impairment Principle**. The justification is not that the past self was wiser, but that the present self is *temporarily incapacitated* by pathology in a way that prevents the exercise of agency. The Ulysses clause is not a binding order from a superior; it is a prosthetic for a broken capacity.
  *   **Constitutional Alignment:** This saves (e). Substantive entrenchment assumes the current electorate is *permanently* incapable of deciding on rights (hence the lock). Procedural hurdles (delays, second votes) assume the electorate is *temporarily* heated (hence the cooling-off period). Your clinical view and constitutional view now align: we bind the present only to correct temporary impairment, never to foreclose permanent sovereignty.

  ### 2. High Severity: The Continuity Threshold (a/b vs. c)

  **The Collision:**
  In (a) and (b), you prioritise the past self's directive over the present self's comfort. In (c) (dementia), you prioritise the present self's comfort over the past directive.
  *   **Mechanism:** Both involve severe psychological disruption. In bipolar relapse, the patient's values shift (e.g., grandiosity). In dementia, the patient's values and memory dissolve.
  *   **The Contradiction:** You state in (c) that in dementia "there's no one left who has a stake." Critics will ask: why does the bipolar patient in mania retain a stake in their well-self's project, while the dementia patient does not? Both are objecting to the past directive.

  **Cost of Holding the Line:**
  If you cannot distinguish these, your policy looks arbitrary. Why honour the anorexic's past wish to be fed but ignore the dementia patient's past wish to be allowed to die?
  *   **What must go:** The vague notion of "stake."
  *   **What to replace it with:** **Reversibility of Agency.** In relapse (a/b), the impairment is episodic. Enforcing the clause is a bridge back to the agent who made it. In advanced dementia (c), the impairment is permanent and degenerative. The agent who made the directive is gone and will not return. Enforcing the directive in dementia does not restore agency; it imposes a dead will on a new organism.
  *   **Policy Impact:** Your policy must explicitly state that Ulysses clauses are valid only where there is a reasonable clinical expectation of *return to capacity*. If the condition is degenerative with no return to baseline, the clause lapses (supporting c).

  ### 3. Moderate Severity: The Competence Boundary (a/b vs. d)

  **The Collision:**
  (d) states a competent patient's current refusal is sovereign. (a) enforces directives over present protest.
  *   **Mechanism:** If the relapsing patient in (a) is deemed "competent" at the time of refusal, (d) forbids enforcement. If they are "incompetent," (d) does not apply.
  *   **The Contradiction:** Many patients subject to Ulysses clauses retain *some* capacity (they understand the information) but their *decision-making* is distorted by the pathology (e.g., the anorexic understands food is needed but values thinness over life).

  **Cost of Holding the Line:**
  If you define competence narrowly (understanding only), (d) overrides (a). If you define it broadly (weighing values), you risk paternalism.
  *   **What must go:** The standard definition of capacity in (d).
  *   **What to replace it with:** **Decision-Specific Capacity.** You must specify in (d) that "competent" means competent *in the absence of the specific pathological distortion covered by the clause*. The Ulysses clause essentially pre-certifies that during the specific relapse phenotype, the patient lacks capacity regarding the specific treatment, even if they pass a standard Mini-Mental State Examination.
  *   **Policy Impact:** The policy must clarify that the Ulysses clause acts as evidence of incapacity regarding the specific treatment during the specific relapse phase, satisfying the Mental Capacity Act 2005 functional test.

  ---

  ### The Unifying Revision

  You asked for the cheapest place to give ground and whether one revision cleans it up. There is one.

  **You must abandon the "Epistemic Superiority" justification in (a).**

  Currently, you argue: *Enforce the clause because the well-self was in better conditions.*
  This triggers the constitutional objection in (e): *Why don't we enforce the constitution because the founders were in better conditions?*

  **The Revision:**
  Argue instead: *Enforce the clause because the relapsing self is temporarily incapacitated, and the clause is the mechanism to restore their own sovereignty.*

  **How this resolves the package:**

  1.  **Clinic (a/b):** The enforcement is not about the past self ruling the present self. It is about the *true* self (the one capable of agency) using a tool to bypass the *impaired* self. This is consistent with (d) because the relapsing self is not "competent" in the relevant sense (temporary impairment).
  2.  **Dementia (c):** This explains why directives lapse in dementia. There is no "true self" waiting to return. The impairment is not temporary. Therefore, there is no sovereignty to restore, only welfare to manage.
  3.  **Constitution (e/f):** This explains why substantive entrenchment is bad. It treats the current electorate as permanently incapacitated regarding rights. Procedural hurdles are good because they treat the electorate as temporarily heated (cooling-off), analogous to the Ulysses clause. (f) fits here: binding the same voters later is okay (they are the same agent, temporarily cooled); binding new voters is not (they are new agents).

  ### Instructions for the One-Page Policy

  To make this defensible for ward staff with no ethics training, do not discuss the philosophy. Embed the logic in the criteria.

  **Drafting Note:**
  Do not write: *"We enforce this because the patient decided this when they were well."*
  Write: *"We enforce this because the current refusal is a documented symptom of the relapse phase, indicating temporary impairment of decision-specific capacity."*

  **The Three Criteria for Enforcement:**
  1.  **Phenotype Match:** The current presentation must match the specific relapse signature identified in the clause (your "signature" test in (a)).
  2.  **Reversibility:** There must be a clinical expectation that the patient will return to the capacity state in which the clause was written (distinguishes from dementia).
  3.  **No New Evidence:** There must be no material change in circumstances or evidence that the well-self would not have anticipated (your "religious conversion" test in (a)).

  ### Instructions for the Constitutional Commission

  Your friend's chapter on entrenchment is safer if she adopts the **Temporary Impairment** model.

  *   **Argument:** Substantive entrenchment is illegitimate because it assumes permanent incapacity of the living. Procedural hurdles are legitimate because they assume temporary passion.
  *   **Generational Point (f):** This becomes the killer argument. Entrenchment is only valid if the bound agents are the *same* agents who consented, merely cooled down. If the bound agents are a new generation, the "temporary impairment" justification fails, and it becomes tyranny.

  ### Summary of Costs

  *   **If you make this change:** You lose the romantic notion that the "well self" is inherently wiser. You gain a robust, legally defensible distinction between mental health intervention and paternalism.
  *   **If you don't:** You remain vulnerable to the charge that you are allowing the "dead hand" of the past self to rule the living patient, which contradicts your own stance on constitutional democracy.

  The load-bearing beam is the justification for *why* the past binds. Shift it from **Wisdom** to **Capacity**, and the structure holds.
