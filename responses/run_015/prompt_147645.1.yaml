      *   **Part 2: Disanalogies:** Split into "Noise" and "Structural Damage." Focus on Coercion, Monopoly, and Stakes.
      *   **Part 3: The Flatshare Counter:** Analyze its utility. It exposes the *consent* problem.
      *   **Part 4: The Smuggled Premise:** Address the "Ownership" assumption directly. This is the philosophical crux.
      *   **Part 5: Better Analogies & Concrete Arguments:** Offer the "Trusteeship" model and specific talking points for Sunday (e.g., the Lockean Proviso, the distinction between *visiting* and *joining*, the coercion argument).

  9.  **Refining the Content (Self-Correction during drafting):**
      *   *Correction:* Make sure not to dismiss the flatmate entirely. Her argument *is* the mainstream liberal nationalist position (Walzer/Miller). It needs to be engaged with seriously.
      *   *Nuance:* The "Club" analogy is actually stronger than the "House" analogy for political theory because clubs are voluntary associations. But states are non-voluntary (birth). I need to highlight that.
