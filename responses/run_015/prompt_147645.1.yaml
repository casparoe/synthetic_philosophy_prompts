      *   *Lifeboat:* (Often used for restriction, but can be flipped).
      *   *Highway/Public Park:* Public goods that are non-excludable.
      *   *Best Alternative:* **The Trust** or **The Public Utility**. The state holds territory in trust for the people *and* justice requires access.

  7.  **Addressing the "Smuggled Premise":**
