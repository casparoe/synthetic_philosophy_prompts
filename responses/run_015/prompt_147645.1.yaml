  11. **Final Polish:** Ensure tone is collaborative ("audit") rather than combative. (Proceed to generate output).

  *(Self-Correction Note on "Flatshare"):* I need to be careful. If the state is a flatshare, who is the landlord? If the landlord is "The Law" or "History," does that help? Actually, the strength of the flatshare analogy is that *current tenants don't own the building*. They have a lease. A lease has conditions. One condition might be "don't leave rooms empty while people sleep on the street." That's a strong angle.

  *(Self-Correction on "Club"):* Clubs are voluntary. You can quit a club. You can't quit a state easily (statelessness). This is a killer disanalogy.

  *(Philosophical Check):* The flatmate is arguing for *Freedom of Association*. The counter is *Freedom of Movement* vs. *Human Rights*. The analogy hides the asymmetry of power.

