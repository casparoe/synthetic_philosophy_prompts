answer: |-
  This is a classic debate in political philosophy, and your flatmate is deploying a version of the "Communitarian" or "Liberal Nationalist" argument (most famously associated with Michael Walzer in *Spheres of Justice*). It is a strong intuition, which is why it survives so well. But you are right to suspect it is doing heavy lifting by smuggling in premises about ownership and consent.

  Here is the audit you asked for, broken down into the correspondence tables, the disanalogies, an evaluation of your "flatshare" counter, and the philosophical leverage points for Sunday.

  ### 1. The Correspondence Tables

  To audit an analogy, you must map the *source domain* (House/Club) to the *target domain* (State) explicitly.

  | Element | **Household Analogy** | **Club Analogy** | **The State (Target)** |
  | :--- | :--- | :--- | :--- |
  | **Owner/Authority** | Homeowner / Head of Household | Membership Committee / Existing Members | The State / "The People" (Citizens) |
  | **Property** | The House / Land | Clubhouse / Assets | National Territory |
  | **Boundary** | Door / Lock / Fence | Membership Criteria / Dues | Border / Visa Regime |
  | **Outsider** | Stranger / Beggar | Non-member / Applicant | Migrant / Refugee / Foreigner |
  | **Entry Request** | Knock on door / Ask for shelter | Application to join | Asylum claim / Visa application |
  | **Permission** | Invitation to stay | Acceptance of membership | Citizenship / Residency Permit |
  | **Residence** | Overnight guest / Lodger | Member in good standing | Resident / Citizen |
  | **Exclusion** | Locking the door | Rejecting application | Border enforcement / Visa denial |
  | **Expulsion** | Eviction / Kicking out | Expulsion / Banning | Deportation / Denaturalization |
  | **Natives** | Children born in the house | Founders / Legacy members | *Jus soli* / *Jus sanguinis* citizens |
  | **Creator/Payer** | Person who bought/built it | Founders who paid dues | Ancestors / Taxpayers (Past & Present) |
  | **Governance** | House rules (chores, quiet) | Club bylaws | Laws (Coercive, criminal, civil) |

  ### 2. The Disanalogies: Noise vs. Damage

  Most people attack analogies on "noise" (superficial differences). You need to attack on "damage" (structural differences that break the moral inference).

  #### **Category A: Noise (Weak Objections)**
  *These might annoy your flatmate but won't change her mind.*
  *   **Scale/Complexity:** "A country has millions of people, a house has four." (She will say: *Principles scale.*)
  *   **Bureaucracy:** "States have visas, houses have keys." (This is just mechanism, not morality.)
  *   **Culture:** "Countries share a culture, housemates share a fridge." (She will use this to *support* her argument about association.)

  #### **Category B: Structural Damage (Strong Objections)**
  *These break the inference that "Right to Exclude in a House = Right to Exclude in a State."*

  1.  **The Coercion Disanalogy (Critical):**
      *   *House:* If I let you into my house, I cannot pass laws binding you. I cannot arrest you for not taking your shoes off. I have limited authority over guests.
      *   *State:* If I let you into my country, the state claims the right to coerce you, tax you, conscript you, and imprison you.
      *   *The Damage:* Because the state imposes **coercive jurisdiction** over everyone inside, justice requires a say in that coercion. Excluding someone from a *jurisdiction* that claims global monopoly on force is different than excluding someone from a *private space*. If you can't vote on the laws that bind you, exclusion is a way of forcing people to remain under foreign coercion without recourse.

  2.  **The "No Outside" Disanalogy (The Lockean Proviso):**
      *   *House:* If I say no, you can go to the house next door. There is plenty of "outside."
      *   *State:* The state system covers 100% of the habitable earth. There is no *terra nullius*. If every state exercises the "household right," the migrant has literally nowhere to stand.
      *   *The Damage:* Property rights are usually conditional on leaving "enough and as good" for others (Locke). When the whole world is fenced, the right to exclude collapses into a right to condemn to death/statelessness.

  3.  **The Ownership/Creation Disanalogy:**
      *   *House:* The homeowner usually bought or built it with their labour/resources.
      *   *State:* Current citizens did not build the territory. They inherited it.
      *   *The Damage:* You have a stronger right to exclude from your *labour* (wages) than from *land* you merely occupy. Current citizens are more like **tenants** or **trustees** than owners.

  4.  **The Stakes Disanalogy:**
      *   *House:* Exclusion = inconvenience (sleep elsewhere).
      *   *State:* Exclusion = often life or death (refugees), or severe poverty.
      *   *The Damage:* Rights are often weighted by stakes. Freedom of association in a social club is trivial; freedom of movement for survival is fundamental.

  ### 3. Auditing Your "Flatshare" Counter-Analogy

  You asked: *Does swapping to a flatshare change what the analogy can support, or does it just restate the disagreement?*

  **Verdict:** It is significantly better than the House analogy, but it still concedes too much ground if you aren't careful.

  **Why it helps you:**
  1.  **It destroys the "Unitary Will" myth:** A house implies one owner deciding. A flatshare implies multiple tenants with conflicting interests. This mirrors the reality that *citizens disagree* about borders. Who speaks for the "house"? The government? The majority? The property owners?
  2.  **It highlights the "Lease" aspect:** Flatsharers don't own the building; they have a lease. A lease comes with conditions. One condition of holding territory in a crowded world might be "occupancy efficiency."
  3.  **The "Rent" Argument:** This is your strongest point. Economies (like flatshares) often *need* new tenants to subsidize the costs of the old (pensions, care work, growth). Excluding people who would pay the "rent" (taxes/labour) harms the existing tenants.

  **Where it risks backfiring:**
  If you argue "It's a flatshare," she can reply: "Exactly. In a flatshare, existing tenants *do* have veto power over new housemates because they have to share the kitchen."
  *   **Counter-move:** You must emphasize that in a flatshare, the veto is usually based on *compatibility*, not *exclusion for exclusion's sake*. And crucially, **the landlord holds the ultimate title.** If the State is a flatshare, who is the Landlord? If the answer is "The Law" or "Humanity," then the tenants (citizens) are sub-letting, and sub-letting rights are limited.

  ### 4. The Smuggled Premise: Ownership vs. Jurisdiction

  You hit the nail on the head: *The whole family of analogies works by smuggling in the claim that the members own the place.*

  In political theory, this is the distinction between **Ownership** (Title) and **Jurisdiction** (Authority).
  *   **Her Analogy:** Assumes Citizens = Owners. Therefore, they can exclude.
  *   **The Reality:** Citizens = Jurisdictional Subjects + Beneficiaries. They do not hold title to the land.

  **The "Trusteeship" Alternative:**
  Instead of House or Flatshare, propose the **Trust** analogy.
  *   **The Concept:** The current generation holds the territory in trust for future generations *and* subject to the constraints of global justice.
  *   **The Implication:** A trustee cannot manage the asset solely for their own benefit if it violates the terms of the trust (e.g., letting people starve outside the gate while hoarding resources inside).
  *   **Why it works:** It accepts that citizens have *special* duties to each other (like trustees managing a specific fund) but denies they have *absolute* rights to exclude (because they don't own the fund).

  ### 5. Concrete Arguments for Sunday

  Here are four specific moves you can make that avoid sloganizing.

  **Move 1: The "Freedom of Association" Trap**
  *   *Her Claim:* Open borders violate freedom of association.
  *   *Your Counter:* Freedom of association includes the right *not* to associate, but it is not absolute. I have freedom of association in my workplace, but I cannot refuse to associate with protected classes. I have freedom of association in my housing, but I cannot discriminate.
  *   *The Kicker:* "You're treating the right to exclude as a **trump card**. I'm treating it as a **presumption** that can be overridden by stronger claims (like the right to life or freedom from coercion). Why is the residents' preference to exclude always heavier than the outsider's need to enter?"

  **Move 2: The "Birthright Lottery" (Addressing the Kids)**
  *   *Her Claim:* Kids born in the back bedroom belong there.
  *   *Your Counter:* "Agreed. But they didn't *earn* it. They got lucky. If I win a lottery and you don't, do I have the right to lock the gates and watch you starve? The household analogy relies on the idea that the residents *deserve* their spot. But birthright citizenship is morally arbitrary. It's a privilege, not a property right."

  **Move 3: The Coercion Point (The Strongest Philosophical Objection)**
  *   *Argument:* "In your house, if I visit, you can't force me to follow your religion or pay you 30% of my income. The State does that. Because the State claims authority over *everyone* within the border, it has a duty of justice to anyone it claims authority over. Exclusion is a way of saying 'We claim the right to govern this land, but we refuse to govern *you* even though your fate is determined by our laws.' That's the real rights violation."

  **Move 4: The "Flatshare" Economic Reality**
  *   *Argument:* "Let's use my flatshare analogy. We need new tenants to pay the rent (the economy/pension system). We put out ads (visa schemes for skilled workers). But when people turn up who need safety rather than skills, we act like they're burglars. If the justification for borders is 'protecting our home,' why do we selectively open the door based on how much money the guest has? That suggests it's not about *home*, it's about *asset protection*."

  ### Summary of the Strategy
  1.  **Grant the intuition:** Admit that communities *do* have some right to shape their character (this makes you sound reasonable).
  2.  **Challenge the scope:** Argue that the right is limited by the stakes (life/death) and the monopoly on coercion.
  3.  **Expose the ownership assumption:** Insist that citizens are tenants/trustees, not owners.
  4.  **Use the Flatshare:** To highlight that current residents didn't agree to the rules, and that exclusion often harms the existing residents economically.

  Your flatmate is arguing from **Liberal Nationalism** (Walzer/Miller). You are arguing from **Global Egalitarianism** (Carens/Kukathas). The analogy is her shield. Your job isn't to smash the shield, but to show that it doesn't cover the feet (the people outside).
