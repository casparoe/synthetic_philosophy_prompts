  4.  **Analyzing Disanalogies (The "Damage" Assessment):**
      *   *Noise (Weak objections):* Size, complexity, bureaucracy. (These don't touch the moral core).
      *   *Damage (Strong objections):*
          1.  *Coercion:* States impose laws on everyone inside; homeowners don't govern guests legally.
          2.  *Ownership/Creation:* Current citizens didn't build the land; property rights usually require just acquisition.
          3.  *Monopoly/No Exit:* There's no "outside" the state system (Lockean proviso issue).
          4.  *Stakes:* Exclusion can mean death (refugees); excluding from a house means inconvenience.
          5.  *Public Goods:* State infrastructure is often non-rivalrous (up to a point) unlike a spare room.

  5.  **Evaluating the "Flatshare" Counter-Analogy:**
      *   *User's Idea:* State = Flatshare. No single owner, existing tenants disagree, need rent (economy), landlord is fiction.
      *   *Analysis:* It's clever and highlights the *internal* lack of unanimous consent. It challenges the "We decide" premise because "We" never actually decided.
      *   *Does it help?* Yes, it undermines the *democratic legitimacy* of the exclusion. If the current tenants can't agree, why do they get to veto new tenants? It also highlights economic interdependence (need rent).
      *   *Risk:* It might concede too much if the flatmate says "Okay, so the existing flatmates vote."
      *   *Verdict:* It's better than the house analogy for capturing *political* reality, but still relies on property metaphors.

  6.  **Finding Better Source Domains:**
      *   If House/Club/Flatshare all smuggle in "ownership," what doesn't?
      *   *Trusteeship/Stewardship:* Citizens manage the land for future generations/humanity, not own it.
