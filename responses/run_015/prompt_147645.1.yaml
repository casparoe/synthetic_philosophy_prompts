      *   *Household:* Homeowner, House, Door/Lock, Stranger, Visitor, Overnight Guest, Eviction, Children, Builder/Buyer.
      *   *Club:* Committee/Members, Clubhouse/Dues, Membership Criteria, Non-member, Joining, Membership, Expulsion, Founders, Dues-payers.
