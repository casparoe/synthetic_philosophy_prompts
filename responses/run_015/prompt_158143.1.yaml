answer: |-
  The journal sat on Elena's coffee table like a loaded gun. It was leather-bound, smelling of damp earth and old vanilla, recovered from a lockbox in Julian Vane's attic three weeks ago. She'd cracked the cipher yesterday. A simple substitution key based on the notes of his *Requiem in D Minor*. Fitting, really. The music was the key to the lies.

  Elena rubbed her eyes. Her laptop screen glowed with the latest draft of *Vane: A Life in Sound*. In the script, Julian was a tragic genius, a man who loved too hard and drank too much, who died with a melody on his lips. The studio loved it. The estate loved it. Julian's surviving daughter was set to produce.

  The journal said otherwise.

  Page forty-two. *October 14, 1954.* "Clara wept when I took the manuscript. She said it was hers, born from her pain. I told her pain belongs to the world, and I am the world's vessel. She will not be credited. A woman's grief is too small for the concert hall."

  Clara was his wife. The *Requiem* was supposedly written for her, after her death. The journal said he stole it from her while she was dying, then claimed it as his own masterpiece of mourning.

  Elena took a sip of cold coffee. The ethical knot in her stomach was tight enough to choke on.

  What do you owe the dead?

  Legally, nothing. Defamation laws expire with the pulse. Morally? It was murkier. If she put this in the film, she'd be accurate. She'd be telling the truth. But truth isn't always the point of a biopic. The point is myth. People buy tickets to see heroes, not thieves. If she burned the journal, Julian Vane remains a legend. Clara Vane remains a footnote, dead and silent. If she published the journal's contents, she'd destroy the legacy of a man who couldn't defend himself, but she'd vindicate a woman who couldn't speak at all.

  Was it her place to be the judge? Or was she just a mechanic, fixing the engine of history so it ran smooth?

  A thud came from the hallway.

  Elena froze. She lived on the fourth floor. There was no balcony.

  She walked to the door and opened it. The hallway was empty, except for a white envelope sliding under the mat, pushed by an unseen hand—or maybe just the draft.

  She picked it up. No stamp. No return address. Just her name, typed in a font that looked like musical typesetting.

  Inside was a single sheet of heavy stock.

  *You think truth is a gift you can give them?*

  Elena's breath hitched. She looked back at the journal. It lay open on the table.

  She shook her head. Coincidence. A prank. Someone from the estate checking up on her? But how would they know she'd solved the cipher? She hadn't told a soul. She'd kept the discovery in a encrypted drive and the physical book under her mattress until tonight.

  She went back to the laptop. Her cursor hovered over the delete key. If she burned the journal, the script stays clean. The check clears. The movie gets made. Julian Vane remains the god of classical music. Clara stays in the shadows where Julian put her.

  Is there a moral duty not to lie about them even if they can't talk back?

  If she lied, she protected the art. If she told the truth, she protected the person. But the person was dust.

  A second thud.

  She ran to the door again. Another envelope.

  She tore it open.

  *The dead do not need protection. They need silence. You are digging in a grave that isn't yours.*

  The handwriting on this note was different. Handwritten. Ink still wet. It smelled like vanilla. Like the journal.

  Elena dropped the paper. She looked at the journal on the table. The pages seemed to ripple, though there was no wind in the room.

  "Who are you?" she whispered to the empty apartment.

  She grabbed the journal, intending to shove it back into her safe. But as her fingers touched the leather, a third envelope slid out from between the pages. She hadn't put it there. She knew she hadn't.

  Her hands shook as she opened it.

  *Page 42 is incomplete.*

  Elena scrambled back to the table, flipping to the entry about Clara. She read it again. *She will not be credited. A woman's grief is too small for the concert hall.*

  She looked at the bottom of the page. There was a smudge. A blot of ink she had assumed was accidental. She grabbed her magnifying glass, the one she used for reading the finer cipher notes.

  Under the glass, the blot wasn't a blot. It was micro-script.

  *...but the grief sings louder than the husband. If you read this, Elena, you are the next vessel.*

  She dropped the magnifying glass. It cracked on the floor.

  The apartment went cold. The hum of the refrigerator died. The traffic noise outside vanished.

  This wasn't about ethics anymore. This wasn't about whether she owed Julian Vane a clean legacy or Clara Vane a voice. This was about ownership. The journal wasn't a record; it was a trap. Or a baton pass.

  Another letter slid under the door. She didn't move to get it. She knew what it would say.

  *Don't burn it. Don't print it. Finish it.*

  Elena looked at her laptop. The script where Julian was a hero. She looked at the journal where Julian was a thief. And she looked at the new text appearing on the page, the ink spreading like veins.

  If she told the truth, she might destroy Julian. If she lied, she destroyed Clara. But if she did neither? If she became part of the story?

  The dead can't talk back. But apparently, they can write.

  Elena sat down. She didn't burn the journal. She didn't open the door to retrieve the latest letter. She just put her hands on the keyboard, deleted the scene where Julian weeps over Clara's grave, and started typing what the journal told her to write.

  Not a biopic. A confession.

  Outside, the rain started again, tapping against the glass like fingers waiting to be let in. She owed them nothing. But they owed her everything now.
