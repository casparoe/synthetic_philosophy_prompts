answer: |-
  Your intuitions are surprisingly consistent. You are not being random; you are instinctively applying a specific philosophical filter that distinguishes between **categorical norms** (moral duties) and **conditional norms** (functional or strategic requirements).

  The principle that saves your verdicts is what I will call **The Principle of Conditional Teleology**.

  It holds that an "ought" can only be derived from an "is" if the "ought" is explicitly relative to a **goal, function, or system** that is already accepted. When the "ought" claims to stand alone as a moral truth without that relative goal, the inference collapses.

  Here is the precise formulation of the principle, mapped to your cases, followed by the resolution of your tensions.

  ### The Principle of Conditional Teleology

  **Clause A (Constitutive Norms):** If an entity $X$ is defined by a specific function $F$, then $X$ *ought* to perform $F$ **relative to the standard of being a good $X$.**
  *   *Motivated by:* **Case Two.** A heart is defined by pumping. If it doesn't pump, it is a "bad heart." The "ought" is internal to the definition of the object.

  **Clause B (Instrumental Norms):** If an agent $A$ desires Goal $G$, and Action $Z$ is the optimal means to $G$, then $A$ *ought* to do $Z$ **relative to $G$.**
  *   *Motivated by:* **Case Five.** If you want to win (rational strategy), you ought to cooperate. The "ought" vanishes if you stop caring about winning.

  **Clause C (Moral Prohibition):** You cannot derive a categorical moral *ought* from a descriptive *is* unless you introduce a separate moral premise that validates the goal.
  *   *Motivated by:* **Case One.** Evolution describes survival (Is). It does not establish survival as a moral good (Ought). Without that extra premise, the jump is a fallacy.

  **Clause D (The Reductionist Warning):** Explaining the *mechanism* of a norm does not invalidate the *authority* of the norm.
  *   *Motivated by:* **Case Four.** Knowing morality lives in the vmPFC explains the hardware, not the software's validity.

  ---

  ### Applying the Principle to Your Cases

  **Case One (Evolution -> Cooperation): FAILS Clause C.**
  You reject this because it tries to turn a historical fact (survival) into a moral duty without proving survival is morally good. Your intuition correctly spots the missing moral premise.

  **Case Two (Heart -> Repair): PASSES Clause A.**
  You accept this because it is a **constitutive norm**. It doesn't claim the heart *morally* deserves repair; it claims that for the heart to be a *heart*, it must pump. The "ought" is technical, not ethical.

  **Case Three (Trust -> Growth): SLIPPERY (Clause B vs C).**
  Your hesitation is spot on. This is an Instrumental Norm (Clause B) disguised as a Policy Moral (Clause C).
  *   *Valid:* "If you want growth, you ought to build trust."
  *   *Invalid:* "You ought to build trust (implied: because growth is morally mandatory)."
  Your gut senses the smuggling of "Growth = Good" without argument.

  **Case Four (Neuroscience -> Nihilism): FAILS Clause D.**
  You correctly identify this as a category error. It confuses the *location* of the value with the *existence* of the value.

  **Case Five (Prisoner's Dilemma -> Cooperation): PASSES Clause B, FAILS Clause C.**
  You accept it as strategy (Instrumental) but reject it as duty (Moral). This is the most philosophically precise distinction in your list. You are recognizing that "rationality" is a goal, not a moral law.

  **Case Six (AI Alignment): THE FLIP-FLOP.**
  Your confusion here is caused by the word "Alignment."
  *   *Interpretation 1 (Technical):* "Aligned" means "functions according to design parameters." If the design is to minimize error, and social misalignment causes error, then they *ought* to be aligned. **(Passes Clause A/B)**.
  *   *Interpretation 2 (Ethical):* "Aligned" means "matches human moral values." If the premise is only about prediction error, you cannot jump to moral values. **(Fails Clause C)**.
  *   *Verdict:* Your flip-flop is rational. The argument is valid only if "alignment" is a technical term. If "alignment" implies "goodness," it is smuggling.

  **New Case (Guts -> Cooked Meat):**
  *   *Premise:* Human guts evolved to digest cooked meat.
  *   *Conclusion:* We ought to eat cooked meat.
  *   *Analysis:* This follows the exact structure of **Case Two** (Constitutive/Functional).
  *   *Verdict:* Valid **IF** the goal is digestive health/efficiency. Invalid **IF** the goal is ethical (e.g., "we ought to eat raw to respect nature").
  *   *Prediction:* Your gut will likely accept this as a health recommendation (Case 2 style) but reject it if someone claims eating raw food is "unnatural and therefore sinful" (Case 1 style).

  ---

  ### Resolving the Tension: Case Two vs. Case Five

  You asked if the line is about *functional design vs. evolutionary outcome* or *internal vs. external norms*. It is actually **Constitutive vs. Instrumental.**

  *   **Case Two (Heart)** feels "cleaner" because the norm is **Constitutive**. The function is intrinsic to the object's identity. A heart that doesn't pump is failing at *being a heart*. The "ought" is built into the definition.
  *   **Case Five (Game Theory)** feels "slippery" because the norm is **Instrumental**. The function is extrinsic to the agent's identity. A rational agent who defects is still a rational agent; they just chose a different goal (short-term gain vs. long-term). The "ought" depends on a desire the agent might not have.

  **Why this matters for your feature:**
  People accept Case 2 because we agree on what a heart is. People resist Case 5 because we don't all agree on what a "rational agent" should value (winning vs. fairness). The "Is-Ought" gap is widest when the *Goal* is contested.

  ### The Honest Limitation: Where Your Verdicts Might Break

  There is one place where this principle might force you to change a verdict, specifically regarding **Case Three (Trust/Growth)**.

  If you strictly apply **Clause B (Instrumental Norms)**, Case Three is actually **valid**, provided you accept the conditional.
  *   *Statement:* "Economic data shows trust correlates with growth, therefore policymakers ought to prioritize trust-building **if they want growth**."
  *   *Your Verdict:* You called this "slippery."
  *   *The Tension:* In professional contexts (policy, medicine, engineering), we *always* accept implicit goals (health, growth, stability). If you reject Case Three as "slippery," you are demanding that **all** goals be morally justified, not just the means.
  *   *The Cost:* If you hold that line, you invalidate almost all professional expertise. Doctors say "You ought to take this pill" (assuming you want health). Engineers say "You ought to use steel" (assuming you want a bridge that stands).
  *   *Adjustment:* To remain consistent with Case Two and Five, you must admit Case Three is valid *instrumentally*. It is only a fallacy if the policymaker claims growth is a *moral absolute* without argument.

  ### Summary for Your Feature

  Your intuitions are tracking a **Domain-Relative Normativity**. You are a natural **Hypothetical Imperativist**.

  1.  **Science tells us what to do** when we have already agreed on **what we want** (Health, Stability, Efficiency). This covers Cases 2, 5, and the Diet case.
  2.  **Science tells us nothing** about **what we should want** (Survival, Growth, Pleasure). This covers the failures in Cases 1 and 3.
  3.  **Science explains the mechanism** of our wanting, but doesn't erase the want. This covers Case 4.

  **The "Hidden Rule" you are following:**
  > *Descriptive facts can generate normative commands only within a closed system where the telos (goal) is predefined. When the system is open (morality, life choices), the derivation fails.*

  **The One Thing You Might Have to Drop:**
  You may need to soften your verdict on **Case Three**. If you accept Case Two (Heart/Health), you logically must accept Case Three (Policy/Growth) as equally valid *within the domain of economics*. The "slipperiness" isn't in the logic; it's in the unspoken agreement that "Growth" is the goal. If your feature argues that science *never* tells us what to do, Case Two disproves you. If it argues science *only* tells us how to get what we want, Case Three is actually safe.

  Your flip-flop on **Case Six** is the perfect example of the modern crisis: We are building systems (AI) where the "Constitutive Function" (minimize error) and the "Moral Goal" (human safety) are coming into conflict, and we are using the same word ("Alignment") for both. Your confusion is the feature, not the bug.
