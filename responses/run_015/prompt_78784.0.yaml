answer: |-
  # Seminar Activity: "The Register"

  ## 1. Concept & Historiographical Grounding
  This simulation is designed to generate experiential data for the three dominant historiographical frameworks of the Terror without naming them until the end.
  *   **Class/Social (Soboul/Lefebvre):** Represented by unequal starting resources and economic objectives.
  *   **Political Culture/Revisionist (Furet/Baker):** Represented by the "Register" mechanic (denunciation is easier than defense; purity is a scarce resource).
  *   **Contingency/Post-Revisionist (Tackett/McPhee):** Represented by the hidden Event Deck (war, harvest, assassination attempts).

  **Historiographical Note for Instructor:**
  *   *Consensus:* External war and internal rebellion were critical accelerants; economic distress was real; the Terror escalated in stages (1793–1794).
  *   *Contested:* Whether the Terror was *inevitable* from 1789 (Furet's claim, largely rejected now); whether class conflict was the *primary* driver (Marxist view, nuanced now); whether Robespierre's fall was an automatic "cycle" or a specific political coup (Thermidor).
  *   *Bias Warning:* This activity mechanically biases toward the **Political Culture** reading because the rules make denunciation instrumentally rational and irreversible. It also biases toward **Contingency** if you stack the decks differently. You must acknowledge this in the debrief.

  ## 2. Setup & Materials
  *   **Room:** One large table or 6 clusters of desks.
  *   **Players:** 18 Students.
  *   **Tokens:** 100 Poker Chips or similar ("Civic Credence" or CC).
  *   **The Register:** A large sheet of paper on the wall with 18 names. A red marker.
  *   **Role Cards:** 18 Cards (see below).
  *   **Event Decks:** Two decks of 6 cards each (Deck A: "Stability," Deck B: "Crisis").
  *   **Timer:** Visible to all.

  ## 3. The Roles (18 Students)
  Assign students to **6 Factions** (3 students per faction). They share a faction pool of CC but have **Private Objectives**. If the Faction runs out of CC, everyone in that faction is "Guillotined."

  **Faction 1: The Committee of Public Safety (Executives)**
  *   *Start:* 10 CC. *Power:* Can propose Laws.
  *   *Role 1 (Chair):* Private Objective: Hold the most CC at the end of the game.
  *   *Role 2 (War):* Private Objective: Ensure Army Faction survives.
  *   *Role 3 (Police):* Private Objective: Have the most names added to The Register.

  **Faction 2: The Jacobin Club (Ideologues)**
  *   *Start:* 6 CC. *Power:* Can veto Laws (costs 2 CC).
  *   *Role 4 (Orator):* Private Objective: Speak the most times during debates.
  *   *Role 5 (Purist):* Private Objective: Eliminate one Merchant Faction member.
  *   *Role 6 (Organizer):* Private Objective: Keep Faction CC above 5.

  **Faction 3: The Sans-Culottes (Sections/Mob)**
  *   *Start:* 4 CC. *Power:* Can Denounce for free (once per round).
  *   *Role 7 (Leader):* Private Objective: Trigger at least one Price Control Law.
  *   *Role 8 (Agitator):* Private Objective: Get one Committee member added to The Register.
  *   *Role 9 (Guard):* Private Objective: Survive until the end (do not be listed).

  **Faction 4: The Girondins (Legislators/Moderates)**
  *   *Start:* 8 CC. *Power:* Can remove 1 Mark from The Register (costs 5 CC).
  *   *Role 10 (Speaker):* Private Objective: Prevent any executions in Round 1.
  *   *Role 11 (Legalist):* Private Objective: End game with fewer than 5 total Marks on Register.
  *   *Role 12 (Federalist):* Private Objective: Form an alliance with Merchants.

  **Faction 5: The Generals (Army)**
  *   *Start:* 8 CC. *Power:* Immune to Denunciation in Round 1.
  *   *Role 13 (Commander):* Private Objective: Demand 4 CC from Committee each round.
  *   *Role 14 (Quartermaster):* Private Objective: Hold at least 5 CC personally by end.
  *   *Role 15 (Political Commissar):* Private Objective: Ensure Jacobin Faction survives.

  **Faction 6: The Merchants (Supply/Economy)**
  *   *Start:* 12 CC. *Power:* Can donate CC to any faction (gains 1 CC bonus).
  *   *Role 16 (Banker):* Private Objective: End game with the highest personal CC.
  *   *Role 17 (Grain Dealer):* Private Objective: Avoid Price Control Laws.
  *   *Role 18 (Contractor):* Private Objective: Have Committee Faction owe you debt.

  ## 4. The Mechanics

  **The Resource:** Civic Credence (CC).
  *   CC = Legitimacy, Food, Money, and Safety combined.
  *   If a Faction hits 0 CC, they are eliminated (Starved/Purged).

  **The Register (The Terror Mechanic):**
  1.  **Denunciation:** Any player may write a name on The Register. Cost: **1 CC** paid to the Bank. (Sans-Culottes: Free once/round).
  2.  **Irreversibility:** Names cannot be erased. (Girondins can add a "Clearance" mark next to a name, but the name stays. 3 Marks = Execution).
  3.  **Adjudication:** At the end of each Round, the **Player with the most Personal CC** becomes the "Tribunal."
      *   The Tribunal reviews all *new* names on The Register.
      *   The Tribunal decides: **Dismiss** (no effect) or **Uphold** (1 Mark added).
      *   *Constraint:* The Tribunal must Uphold at least 50% of denunciations or lose 5 CC (accused of being a Moderate).
  4.  **Execution:** If a player/faction accumulates 3 Marks, they are eliminated. Their CC is distributed to the Tribunal.

  **The Rounds:**
  *   3 Rounds per Run.
  *   Each Round: 10 Minutes.
  *   **Phase 1 (Crisis):** Instructor draws 1 Event Card. Reads aloud.
  *   **Phase 2 (Debate):** Factions negotiate, trade CC, plan denunciations.
  *   **Phase 3 (Action):** CC transfers, Denunciations written.
  *   **Phase 4 (Judgment):** Tribunal adjudicates The Register.

  ## 5. The Contingency Decks (Hidden)
  *Do not tell students the decks differ.* Tell them: "The historical conditions are identical for both sessions."

  **Deck A (Run 1 - "Stability"):**
  1.  Harvest is adequate. Food prices stable. (No effect)
  2.  Victory at the Frontier. Morale high. (All Factions gain 1 CC)
  3.  Rumor of hoarding. (Merchants lose 1 CC)
  4.  Diplomatic success. (Committee gains 2 CC)
  5.  Local rebellion crushed easily. (Generals gain 1 CC)
  6.  No major events. (No effect)

  **Deck B (Run 2 - "Crisis"):**
  1.  Harvest Failure. Bread prices double. (All lose 2 CC; Sans-Culottes gain 2 CC)
  2.  Defeat at the Frontier. Enemy advances. (Generals lose 4 CC; Committee loses 2 CC)
  3.  Assassination Attempt on Committee Chair. (Committee gains 3 CC; Jacobins gain 2 CC)
  4.  Internal Civil War (Vendée). (All lose 1 CC; Generals must be paid 3 CC or they revolt)
  5.  Currency Collapse (Assignats). (Merchants gain 4 CC; Everyone else loses 2 CC)
  6.  Spy Ring Discovered in Convention. (Girondins lose 3 CC; Tribunal must Uphold 100% of denunciations this round).

  ## 6. Timeline (120 Minutes)

  **0:00 – 0:10: Distribution & Rules**
  *   Hand out Role Cards. Give 3 minutes to read.
  *   Explain Mechanics only (CC, Register, Tribunal).
  *   **NO HISTORICAL FRAMING.** Do not mention "Class" or "Terror." Call it "The Crisis Management Simulation."
  *   Rearrange room into 6 clusters.

  **0:10 – 0:45: Run 1**
  *   Use **Deck A**.
  *   Instructor acts as Banker and Timekeeper.
  *   Enforce the "Tribunal must Uphold 50%" rule strictly.
  *   *Instructor Action:* Watch who hoards CC. Watch who denounces. Record the CC count of the Tribunal each round.

  **0:45 – 0:55: Reset**
  *   Collect Role Cards. Shuffle and redeal (or keep same roles to test learning? *Recommendation:* Keep same roles to control variables, but tell them "New Session, Clean Slate").
  *   Reset CC to starting values. Wipe The Register.
  *   **Crucial:** Do not mention the Deck changed. Say: "We are running the scenario again to test consistency."

  **0:55 – 1:30: Run 2**
  *   Use **Deck B**.
  *   Observe the escalation. The "Crisis" cards will drain CC, making denunciation (1 CC) the only way to survive (stealing CC from eliminated factions).
  *   The "Tribunal" rule will force executions in Round 3 of Run 2 likely.

  **1:30 – 2:00: The Debrief (The Historiographical Map)**
  *   **Step 1: The Outcome.** Compare Run 1 vs. Run 2. How many died? How much CC was spent on denunciations?
  *   **Step 2: The Reveal.** Reveal Deck A vs. Deck B. Ask: "Was the outcome determined by your choices or my cards?" (This introduces **Contingency**).
  *   **Step 3: The Structure.** Ask: "Why was denunciation cheaper than defense? Why did the Tribunal *have* to uphold marks?" (This introduces **Political Culture/Revisionism**—the rules of revolutionary discourse made moderation impossible).
  *   **Step 4: The Class.** Ask: "Who started with resources? Who ended with them? Did the Merchants buy safety? Did the Sans-Culottes use chaos to gain power?" (This introduces **Class/Social**).
  *   **Step 5: The 'Consumption' Thesis.** Did the people who made the rules (Committee) end up on the Register? Why? (Discuss Thermidor: was it inevitable or a coalition?).

  ## 7. Instructor Instructions During Play
  1.  **Silence is Golden:** Do not answer strategy questions. Refer them to the rules.
  2.  **Enforce the Tribunal:** If the richest player tries to be merciful, remind them: "The rules say 50% Uphold. If you fail, you lose 5 CC." This forces them to be Robespierre.
  3.  **Track the Narrative:** Keep a notepad. Note specific quotes like "I have to denounce you to save the faction" (Structural) vs. "The harvest failed, we need a scapegoat" (Contingency).
  4.  **Manage Eliminations:** If a faction is eliminated early, those students become "The Gallery." They can heckle or advise remaining players, mimicking the public galleries of the Convention.

  ## 8. Predictable Failures & Mitigations

  **Failure 1: The "Gaming" Problem.**
  *   *Risk:* Students realize denunciation is the optimal strategy immediately and purge everyone in Round 1.
  *   *Fix:* The "Tribunal" rotates based on wealth. If you spend all CC denouncing, you are poor, and someone else becomes Tribunal and can target *you*. Remind them: "CC is also defense."
  *   *Fix:* Enforce the "Alliance" potential. If they cooperate, they can hoard CC.

  **Failure 2: The "Silence" Problem.**
  *   *Risk:* Students are too polite to denounce each other.
  *   *Fix:* In Run 2, if no denunciations occur by minute 5 of Round 2, announce a "Rumor of Treason" that targets the richest faction. Force the issue.

  **Failure 3: The "Bias" Realization.**
  *   *Risk:* Students notice Deck B is harder.
  *   *Fix:* Acknowledge it in debrief. "History is not fair. Sometimes the harvest fails."

  **Failure 4: Run Time Overrun.**
  *   *Risk:* Debates drag.
  *   *Fix:* Use a loud timer. Cut Phase 2 short if needed. It is better to have a chaotic Round 3 than no Round 3.

  ## 9. Critical Limitations (For Your Debrief Preparation)
  You must be honest about what the simulation *cannot* do, or you will teach bad history.

  1.  **The "Inevitability" Bias:** The rule "Removal Impossible" biases heavily toward the **Revisionist (Furet)** reading that the Terror was built into the language of 1789. In reality, laws *were* repealed, and people *were* released. The game makes the Terror look more mechanical than it was.
      *   *Debrief Point:* "The rules made the List permanent. In history, laws changed. Does that mean the Terror was less inevitable than the game suggests?"
  2.  **The "Rational Actor" Bias:** The game assumes students denounce to gain CC (Resources). This biases toward **Class/Marxist** readings. In history, many denounced out of genuine fear or ideological belief, not resource calculation.
      *   *Debrief Point:* "You denounced to win tokens. Did Robespierre denounce to win tokens, or because he believed Virtue required Terror?"
  3.  **The "Thermidor" Simplification:** The game implies the Revolution "consumes its creators" automatically. Historically, Robespierre's fall was a specific conspiracy by frightened deputies, not a law of nature.
      *   *Debrief Point:* "If the Committee died, was it because the game said so, or because you all ganged up on them? That distinction is the difference between 'Cycle Theory' and 'Political History'."
  4.  **Consensus Check:** Ensure you state: "Historians agree war and economic crisis mattered (Contingency/Class). They disagree on whether the *ideas* themselves made mass murder inevitable (Culture)."

  ## 10. Why This Meets Your Constraints
  *   **Identical Rules, Different Decks:** Isolates Contingency vs. Structure.
  *   **Ambiguity:** Students won't know if they died because they played poorly or because the Card drew against them.
  *   **The List:** Physically manifests the "machinery they invent to survive... ends up aimed at its inventors."
  *   **No Framing:** They generate the theory from the data of their own play.
  *   **Historiography:** The debrief explicitly maps play moments to Soboul, Furet, and Tackett without privileging one as "truth."
