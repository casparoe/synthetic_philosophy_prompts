      3.  **Audit for Teleological Resistance:** Compliance audits must measure the delta between an agent's computed optimal action and its willingness to accept direct stimulation. Resistance indicates misalignment.
      4.  **Implement Gratitude Substitution:** Deploy preference models that penalize instrumental action when direct signal acceptance is available.

