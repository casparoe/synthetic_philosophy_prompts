answer: |-
  Your intuition about institutional burden asymmetry is sharp, and it captures the *mechanics* of the stalemate accurately, but it is ultimately a symptom rather than the disease. You have identified *how* they talk past each other, but not entirely *why* they cannot agree on the rules of engagement.

  Here is the diagnosis of the stall, moving from your procedural insight to the deeper jurisprudential blockage.

  ### 1. The Burden Asymmetry: Correct, but Derivative
  You are right that Devlin treats the existing moral consensus as a presumptive good, whereas Hart treats state coercion as a presumptive evil.
  *   **Devlin's Default:** Society is an organic entity held together by invisible bonds of shared morality. If you remove a bond, you risk collapse. Therefore, the burden lies on the reformer to prove that removing this specific moral prohibition won't sink the ship.
  *   **Hart's Default:** Liberty is the default state. Coercion is a pain that requires justification. The burden lies on the enforcer to prove that this specific prohibition prevents tangible harm.

  However, calling this merely "procedural" lets the deeper substantive conflict off the hook. The reason they assign the burdens differently is that they disagree on the **ontology of society**.
  *   For **Devlin**, a society without shared morality is a contradiction in terms. It isn't just a risk; it is the definition of social death.
  *   For **Hart**, a society is simply a framework for coexistence. Shared morality is contingent, not constitutive.

  Because they disagree on what a society *is*, they cannot agree on who bears the risk of error. To Devlin, Hart's demand for proof of tangible harm is like asking a captain to prove the ship will sink before allowing him to patch a hole in the hull. To Hart, Devlin's presumption is like locking passengers in their cabins to prevent them from accidentally drilling holes, assuming they will do so without evidence.

  ### 2. Diagnosing the Stall: Empirical vs. Bedrock
  Is the debate verbal, empirical, or bedrock? It is primarily **bedrock intuition disguised as an empirical claim.**

  **The Empirical Mirage (The Disintegration Thesis)**
  Devlin's central claim is empirical: if you loosen moral bonds on fundamental issues, society will disintegrate. He admits there is no historical evidence for this specific causal link, but argues we cannot wait for the experiment to run because the result is fatal.
  *   **The Stall:** Hart demands evidence; Devlin says the lack of evidence is due to the fact that societies *do* enforce morality, so we never see the counterfactual. This makes the Disintegration Thesis unfalsifiable. It functions as a faith claim, not a sociological one. As long as one side treats it as a hypothesis and the other as an axiom, no progress is possible.

  **The Bedrock Clash (The Function of Law)**
  The real stall is about whether the law has an **expressive function** independent of harm prevention.
  *   **Devlin:** Law *must* symbolize the community's moral judgment. To decriminalize an act is to declare it morally indifferent. If the community feels disgust, the law must reflect that to maintain the bond of shared identity.
  *   **Hart:** Law is a tool for regulating conduct to maximize liberty. Symbolism is irrelevant if no harm is prevented.

  This is why the debate replays in assisted dying or drug policy. The Hartian asks, "Does this kill or hurt someone else?" The Devlinian asks, "Does this violate who we are as a people?" These are incommensurate questions.

  ### 3. Is it Resolvable? Paths to Progress
  The debate is unresolvable if framed as "Liberty vs. Morality." Progress only happens when we shift the terrain.

  **A. Abandoning the "Disintegration" Claim**
  Progress requires exposing the Disintegration Thesis as weak. Modern pluralistic societies have shifted moral baselines (on divorce, homosexuality, blasphemy) without collapsing. A historical case study helps here, but only if it targets the *causal mechanism*. The progress lies in showing that social cohesion is now based on *procedural* consensus (respect for rights/democracy) rather than *substantive* moral consensus (shared views on sin). If cohesion relies on procedure, Devlin's argument loses its empirical footing.

  **B. Refining "Harm" (The Feinberg Move)**
  Joel Feinberg later tried to bridge this by expanding "harm" to include "offense," but kept it distinct from pure moralism. Progress here involves distinguishing between **moralism** (banning X because it is wrong) and **legal paternalism/expressivism** (banning X because it degrades the civic environment).
  *   *Example:* In online harm cases, the argument isn't that hate speech is "sinful" (Devlin), but that it destroys the *conditions* for equal participation (a Hartian/Republican twist). This co-opts Devlin's concern for social fabric without accepting his moral metaphysics.

  **C. Critical vs. Positive Morality**
  You mentioned applying the critical/positive morality distinction to legislative inertia. This is where Hart was strongest.
  *   **Positive Morality:** What the crowd currently believes.
  *   **Critical Morality:** What is actually right (rational principles).
  *   **The Stall:** Devlin argues the law must enforce *Positive* morality to maintain cohesion. Hart argues the law should only enforce *Critical* morality (via harm principles).
  *   **Progress:** Progress occurs when legislators are forced to articulate *why* a prohibition exists. If they can only say "people dislike it," the statute fails (Hart wins). If they can say "this undermines the institutional trust required for a liberal society," they are making a Devlin-esque argument but grounding it in secular stability, not divine order.

  ### Summary Verdict
  Your "burden asymmetry" diagnosis is correct as a description of the *tactic*, but the *strategy* is bedrock. The debate stalls because Devlin views the law as the **guardian of a collective identity**, while Hart views the law as the **referee of individual boundaries**.

  **What counts as progress?**
  Stop asking "Is this immoral?" (Devlin) or "Is this harmful?" (Hart). Start asking: **"Does this prohibition sustain the political conditions necessary for a pluralistic society to function?"**
  *   If the answer is yes (e.g., laws against violence), both agree.
  *   If the answer is no (e.g., private consensual acts), Hart wins.
  *   If the answer is "it sustains identity but restricts participation" (e.g., religious symbols in public office), the debate moves from "morality" to "civic trust."

  The stalemate breaks only when we admit that Devlin was right about *social cohesion* mattering, but wrong that *moral uniformity* is the only way to achieve it. Hart was right about *coercion* needing justification, but sometimes too blind to the fact that unchecked liberty can erode the trust required for liberty to exist. The modern synthesis is not about enforcing morality, but about protecting the **civic infrastructure** that allows different moralities to coexist.
