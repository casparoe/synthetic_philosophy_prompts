  Therefore, we should modify. Reduce the suspension to two days to acknowledge the disruption, but replace the remaining three days with a support contract.
  On Monday morning, the Assistant Principal and I should meet Devon before first period in the AP's office. We will not re-litigate the past. Instead, we will present the contract. It will specify that if a teacher needs the phone for safety (a different reason than confiscation), Devon agrees to hand it over. If the request is routine, he may ask for a five-minute delay to finish a task. This changes the features of the situation. It tests whether his response varies with reasons, as my biological elective suggests we should ask. The contract will be signed by Devon, the AP, and a teacher of his choice. We will schedule a follow-up meeting in three weeks to assess if the variation occurred.

