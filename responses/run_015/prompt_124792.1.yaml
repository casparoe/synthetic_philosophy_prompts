answer: |-
  ### Interpretive Landscape Brainstorm

  Before addressing your specific queries, let us map the terrain. The *Bai Ma Lun* (White Horse Dialogue) is arguably the most scrutinized text in early Chinese philosophy, precisely because it sits at the intersection of metaphysics, logic, and linguistics.

  1.  **The Metaphysical/Realist Reading:** Traditionally associated with Feng Youlan and early Western sinologists. On this view, Gongsun Long is a Chinese Plato. "Horse" refers to the Universal *Horseness*; "White" to *Whiteness*; "White Horse" to a compound Universal. Since the compound universal is distinct from the simple universal, the identity statement fails.
      *   *Implication:* This supports your worry about a "global" consequence. If compound universals are distinct from their constituents, then *any* modification creates a new ontological category.
  2.  **The Semantic/Nominalist Reading (The Mass Noun Hypothesis):** Championed by Chad Hansen. Classical Chinese nouns are mass terms (like "water" or "gold"), not count terms. "Horse" refers to horse-stuff. "White horse" refers to white-horse-stuff. While white-horse-stuff is a part of horse-stuff, the *name* refers to a different distribution of stuff.
      *   *Implication:* This restricts the scope. It's about how we carve up reality with language, not necessarily about the objects themselves.
  3.  **The Logical/Analytic Reading:** Associated with A.C. Graham and later analytic sinologists. This focuses on the ambiguity of *fei* (is not). Does it mean "is not identical to" or "is not a member of the class"?
      *   *Implication:* If *fei* means non-identity, the argument is trivially true (the concept "white horse" is not identical to the concept "horse") but misleading. If it means class exclusion, it is false. Gongsun Long exploits this ambiguity.
  4.  **The Pragmatic/Rectification Reading:** The School of Names (*Mingjia*) was ultimately concerned with *Zheng Ming* (Rectification of Names) for socio-political stability. The argument demonstrates that names have specific "ranges of application" (*zhi*). Confusing them leads to administrative error.

  **Relation to Modern Semantics:**
  *   **Universals:** The debate mirrors the problem of whether "White Horse" is a derivative universal or a distinct trope.
  *   **Compositionality:** Modern semantics generally treats "white" as an intersective adjective ($[\![\text{white horse}]\!] = [\![\text{white}]\!] \cap [\![\text{horse}]\!]$). Gongsun Long seems to treat it as creating a new, non-overlapping intension that blocks substitution.
  *   **Reference:** The distinction between *Zhi* (intent/index/meaning) and *Wu* (thing/object) in the text anticipates the Sense/Reference distinction, though *Zhi* is arguably closer to "intension" or "mode of presentation."

  ---

  ### Response to Your Confusions

  As a fellow traveler in the analytic tradition, I appreciate your rigor. You have correctly identified the tension between Gongsun Long's specific argument and the general principles of compositional semantics. However, your framing relies on a slightly anachronistic mapping of "intension/extension" onto the *Zhi/Wu* distinction, which leads to the fear of a "global failure of predication."

  Here is the correction of your framing, followed by answers to your two questions.

  #### 1. Correcting the Framing: *Zhi* vs. *Ming*
  You interpret the argument as turning on intensions (form + color vs. form). While helpful, Gongsun Long's primary distinction is between the **Name** (*Ming*) and the **Actuality** (*Shi*), mediated by the **Index/Intent** (*Zhi*).

  When Gongsun Long says "White horse is not horse," he is not primarily making an ontological claim about the animal in the field (the *Wu*). He is making a claim about the **substitutability of names** in a context of demand or definition.
  *   **Your Worry:** If "White Horse" $\neq$ "Horse," then compositionality fails globally (Red Apple $\neq$ Apple).
  *   **The Correction:** Gongsun Long is not denying that the object classified as a "white horse" falls under the extension of "horse." He is denying that the *Name* "White Horse" is identical to the *Name* "Horse." In modern terms, he is arguing for **Intensional Non-Identity**, not **Extensional Exclusion**.

  The text explicitly handles this. When the interlocutor asks, "If having a white horse counts as having a horse, why is a white horse not a horse?" Gongsun Long replies by distinguishing between *seeking* a horse and *seeking* a white horse. If you seek a horse, a yellow or black one suffices. If you seek a white horse, they do not.
  *   **Crucial Point:** This shows the argument operates in **intensional contexts** (verbs of seeking, naming, defining). In extensional contexts (e.g., "This white horse is eating grass"), the text does not claim the animal ceases to be a horse.

  #### 2. Addressing Confusion One: Global vs. Local Scope
  *Is the School of Names committed to a sweeping failure of compositional predication?*

  **No.** The argument is restricted to the **logic of naming and classification**, not the metaphysics of predication.

  There are two specific frameworks within which the argument operates without generalizing to "Red Apple $\neq$ Apple" in an ontological sense:

  *   **A. The Distinction of *Zhi* (Index/Intent):**
      Gongsun Long argues that the *Zhi* of "horse" is to designate shape (*xing*). The *Zhi* of "white" is to designate color (*se*). The *Zhi* of "white horse" is to designate both. Because the *criteria for application* differ, the *names* are not interchangeable.
      *   *Restriction:* This applies to the **identity of terms**, not the **inheritance of properties**. A white horse inherits the property of *being a horse* (ontologically), but the *term* "white horse" does not inherit the *identity* of the term "horse."
      *   *Modern Parallel:* Consider the difference between "Water" and "H2O." They are co-extensive, but in intensional contexts ("John believes water is wet" vs. "John believes H2O is wet"), they may not be substitutable *salva veritate*. Gongsun Long is essentially arguing that "White Horse" and "Horse" are not synonymous, and therefore cannot be substituted in contexts requiring precise naming (*Zheng Ming*).

  *   **B. The Mass Noun Hypothesis (Hansen):**
      If we accept Hansen's controversial but influential reading, "Horse" is a mass noun. "White Horse" is a different mass noun (like "Water" vs. "Ice").
      *   *Restriction:* In a mass noun ontology, "Ice is not Water" is a plausible claim about *categories of stuff*, even if ice is made of water. This limits the "global" consequence. It doesn't mean a specific chunk of ice isn't a chunk of water; it means the *category* "Ice" is distinct from the *category* "Water."
      *   *Result:* This prevents the "Red Apple" explosion because the argument is about how we individuate *kinds*, not how we predicate properties of *particulars*.

  **Verdict:** The School of Names is not committed to the idea that a running person is not a person *in reality*. They are committed to the idea that the name "Running Person" is not the name "Person" *in administration*. It is a logical point about the precision of language, not a metaphysical point about the fragmentation of objects.

  #### 3. Addressing Confusion Two: Deep Puzzle vs. Local Reductio
  *Why is this treated as a deep puzzle about reference rather than a localized reductio?*

  It is treated as a deep puzzle because it exposes a fundamental tension in **Natural Kind Terms** and **Modified Nouns** that modern semantics still grapples with. It is not merely a reductio of a naive theory; it is a positive (if counter-intuitive) claim about the structure of reference.

  *   **A. The Problem of Compound Universals:**
      If you are a realist about universals, Gongsun Long forces you to answer: Is "White Horse" a universal in its own right?
      *   If **Yes**: Then you have an infinite proliferation of universals (White Horse, Black Horse, Fast Horse...). This is metaphysically costly.
      *   If **No**: Then how do we account for the fact that "White Horse" seems to pick out a distinct natural kind in certain contexts?
      *   *Significance:* This anticipates the modern debate over whether adjectives denote properties that intersect with nouns (intersective) or whether they create new sub-kinds (subsective). Gongsun Long argues for a strong version of subsectivity where the compound creates a new *Ming* that cannot be reduced to its parts in discourse.

  *   **B. Opacity in Intensional Contexts:**
      The dialogue is profound because it identifies **referential opacity** before Frege.
      *   Example: "I want a horse." (Satisfied by any horse).
      *   Example: "I want a white horse." (Not satisfied by a black horse).
      *   If "White Horse" = "Horse", these desires should be identical. They are not. Therefore, in the context of *desire* (or naming/commanding), "White Horse" $\neq$ "Horse".
      *   *Modern Absorption:* Modern semantics absorbs this via **Intensional Logic**. We say the *extension* is a subset, but the *intension* is distinct. Gongsun Long's "puzzle" arises because Classical Chinese grammar does not morphologically distinguish between "is a member of" and "is identical to." He exploits this to show that **Identity of Reference does not imply Identity of Name.**

  *   **C. The Political/Metaphysical Stakes:**
      For the *Mingjia*, this wasn't just logic; it was governance. If the King requests "Horses" for the army, and you send "White Horses," have you fulfilled the order? If the King requests "White Horses" for a ritual, and you send "Horses" (including black ones), have you failed?
      *   The "Deep Puzzle" status comes from the fact that Gongsun Long is arguing for **Semantic Atomism** in a context where **Semantic Holism** (a horse is a horse regardless of color) seems intuitive. He is warning that precision in *Ming* (Name) is required to match *Shi* (Actuality).

  ### Synthesis for Your Research

  To answer your core concern: **Modern semantics can absorb the point as a restricted claim about intensional contexts and the non-synonymy of compound terms.**

  You do not need to accept a "global failure of compositional predication." You can model Gongsun Long's argument as follows:
  1.  **Extensionally:** $[\![\text{White Horse}]\!] \subset [\![\text{Horse}]\!]$. (The set of white horses is in the set of horses).
  2.  **Intensionally:** $[\![\text{White Horse}]\!] \neq [\![\text{Horse}]\!]$. (The concept/property is not identical).
  3.  **The Argument's Move:** Gongsun Long argues that in the context of *Naming* (which is the context of the dialogue), Intensional Identity is the relevant criterion for the copula "is" (*fei* negates identity).
  4.  **Compositionality:** Compositionality holds (the meaning of "white horse" is composed of "white" + "horse"), but **Substitutability** fails.

  **Recommendation:**
  Do not read Gongsun Long as denying that particulars instantiate multiple universals. Read him as arguing that **Names are Rigid Designators of Specific Complexes.** When you name something "White Horse," you are fixing a specific complex of attributes. To call it merely "Horse" is to use a different name with a different *Zhi* (intent).

  The "global consequence" you fear (Red Apple $\neq$ Apple) only follows if you conflate **Name Identity** with **Class Inclusion**. Gongsun Long is careful to keep them distinct: he admits that if you have a white horse, you have a horse (ontologically), but insists you cannot use the *name* "horse" to fulfill the *name* "white horse" (semantically/pragmatically).

  This makes the *Bai Ma Lun* not a rejection of compositionality, but a sophisticated early analysis of **type-distinction** and **contextual reference**. It is a warning against the slide from *de re* (about the thing) to *de dicto* (about the description) without marking the shift.
