answer: |-
  This is a fantastic analogy. Horology is arguably one of the best secular frameworks for thinking about teleology (purpose) and function. You are essentially mapping the **Biostatistical Theory of Health (Naturalism)** against **Value-Based Theories (Normativism)** onto a mechanical system.

  Here is the restatement of the positions using your workshop vocabulary, followed by the residue report and the verdict on your "norm/normative" confusion.

  ### 1. The Positions Restated in Watch Talk

  **The Naturalist Position (The "Factory Spec" View)**
  *   **Core Claim:** A movement is "diseased" (faulty) if it deviates from its objective mechanical design, regardless of the owner's feelings.
  *   **The Vocabulary:** Health is the movement operating within **factory tolerances**. The **intended function** is defined by the calibre blueprint (e.g., the balance should oscillate at 28,800 vph, amplitude should be >270°). If the **beat error** is 0.8ms when the spec is 0.0–0.4ms, the movement is pathological.
  *   **The Implication:** It does not matter if the owner wears it as a beater and doesn't care about +45 seconds a day. The movement is objectively "sick" because it is failing its biological (mechanical) job. The **statistical normality** of the production run defines the health baseline.

  **The Normativist Position (The "Owner Satisfaction" View)**
  *   **Core Claim:** A movement is only "diseased" if the deviation prevents the owner from achieving their valued goals.
  *   **The Vocabulary:** Health is defined by **owner satisfaction** and context. A deviation from **factory tolerances** is just a physical fact; it only becomes a "fault" if the owner values precision over charm. If the watch is a vintage diver used for actual diving, +30s/day might be acceptable. If it's a Patek Philippe for a collector, +5s/day is a crisis.
  *   **The Implication:** There is no objective "sickness" without a value judgment. A movement with high **hand-fitted variance** isn't diseased unless that variance violates the **intended function** *as valued by the user*.

  ---

  ### 2. The Residue Report

  Here is where the analogy holds, where it bends, and where it breaks.

  **What Translates Cleanly:**
  *   **Functional Failure:** The concept of a "mechanism failing to perform its task" maps perfectly to organ failure. A broken mainspring is like a failing heart pump.
  *   **Tolerance vs. Pathology:** The distinction between "within spec" (health) and "out of spec" (disease) is the exact logical structure of Christopher Boorse's Biostatistical Theory.
  *   **Contextual Performance:** Just as a watch performs differently in different positions (dial up, crown down), biological health is context-dependent (resting heart rate vs. running).

  **What Gets Distorted:**
  *   **Design vs. Evolution:** This is the biggest distortion. A watch has a *designer* (the factory). The "intended function" is written in the blueprint. A human body has *evolution*, which has no intent, only selection pressure. When you say "factory spec," you imply a "right way" to be. In biology, Naturalists have to argue that "evolutionary design" creates a "right way," which is philosophically messier than a Patek blueprint.
  *   **The Locus of Suffering:** In watchmaking, the *watch* doesn't suffer; the *owner* does. In medicine, the *patient* is both the machine and the owner. If a watch runs hot, it doesn't mind. If a human runs a fever, the human feels the harm. Normativism relies heavily on "harm/suffering," which has no counterpart in the movement itself.

  **What Has No Watchmaking Counterpart:**
  *   **Asymptomatic Disease:** A watch that is "out of spec" but still running is just a inaccurate watch. In medicine, you can have a disease (e.g., early hypertension) that has no functional impact *yet* but is still classified as disease because of future risk. Watches don't really have "future risk" in the same way; they just run until they stop.
  *   **Mental Health:** There is no equivalent to a movement that is mechanically perfect but "believes" it is broken.

  ---

  ### 3. The Vintage Statistical Problem

  You asked: *Does statistical normality make sense when every vintage calibre was adjusted individually?*

  **Verdict: No, it destroys the Naturalist position for vintage pieces.**

  Naturalism relies on a reference class (e.g., "male humans aged 20-30"). In modern mass-produced movements (ETA 2824), you have a bell curve. You can define "health" as within 2 standard deviations of the mean production spec.

  In vintage hand-fitted movements (like a Patek 12'''120 or an early Lange), **N=1**.
  *   The parts were filed to fit *that specific* plate.
  *   The timing was adjusted to *that specific* balance inertia.
  *   There is no "population" of that specific serial number.

  If you take a strict Naturalist view, you cannot determine if a unique vintage movement is "healthy" statistically, because there is no statistical population. You can only judge it against its own **historical baseline** (how it ran when it left the factory) or its **design limits** (what the materials can physically withstand).

  This suggests that for unique biological entities (which humans arguably are, genetically), strict statistical Naturalism fails. You have to appeal to **individual functional capacity**, which bleeds into Normativism (what is *this* organism trying to do?).

  ---

  ### 4. The "Norm" vs. "Normative" Verdict

  Your friend is right that you are mixing the terms, but **your confusion is actually philosophically productive.**

  *   **Norm (Statistical):** What *is* average. (e.g., "Most 1960 1030 calibres beat at 5ms.")
  *   **Normative (Value):** What *ought* to be. (e.g., "A good watch *ought* to beat at 0.2ms.")

  **Why you mix them:**
  In watchmaking, the **Norm** (factory spec) *implies* the **Normative** (good state). If the factory says the tolerance is ±10s/day, that is both the statistical average *and* the value judgment of what is "good." The designer's intent bridges the gap between "is" and "ought."

  **Why it matters in Medicine:**
  In biology, there is no designer.
  *   **Naturalists** try to derive the **Normative** from the **Norm**. (Argument: "It is statistically abnormal to be depressed, therefore it is a disease.")
  *   **Normativists** say you can't do that. (Argument: "Left-handedness was once statistically abnormal, but it wasn't a disease. Being abnormal isn't enough; it has to be *bad*.")

  **The Verdict:**
  Your confusion maps onto the **Naturalist's best trick.** Naturalists *want* "factory spec" (biology) to carry the same weight as "factory spec" (watches). They want statistical deviation to automatically equal "bad function."

  Your friend is pointing out that in medicine, unlike watchmaking, **statistical abnormality does not automatically equal value failure.**
  *   **Watch:** Out of spec = Bad (because humans designed it to be in spec).
  *   **Human:** Out of spec = ? (because evolution didn't design it for "good," just "survival").

  **Conclusion:**
  You aren't just making a mistake; you are highlighting why the watch analogy is so seductive. It makes Naturalism look true because watches have *engineers*. Humans don't. If you stick to the watch analogy, you win the argument for Naturalism. If you acknowledge the lack of an Engineer in biology, your friend wins the argument for Normativism.

  **Recommendation:** Tell your friend: *"In my workshop, Norm and Normative are the same thing because there's a blueprint. In your body, there's no blueprint, only history. That's the only reason we disagree."* Buy the next round.
