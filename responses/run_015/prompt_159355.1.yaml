answer: |-
  The demand for a theory that is both metaphysically constitutive via relations and normatively protective against misrecognition is jointly unsatisfiable; you cannot teach students that community makes the person while simultaneously insisting the person survives the community's rejection.

  **The Incompatibility**
  You cannot satisfy **Desideratum 2 (The Misrecognition Constraint)** and **Desideratum 6 (Strong Constitutive Relationality)** simultaneously. If relations constitute personhood ontologically, the outcast is ontologically diminished. If the outcast retains full personhood despite exclusion, relations are not constitutive (they are merely developmental or epistemic). Your colleague's critique (Ubuntu is just communitarianism) gains traction if you cannot resolve this without retreating to a liberal individualist substrate that Ubuntu explicitly rejects. You must tell students: either Ubuntu modifies its ontology (relations enable but do not constitute) or it accepts a moral risk (the outcast is vulnerable) that liberal theories forbid.

  **Desiderata for a Theory of Personhood**

  1.  **Normative Traction (Non-negotiable):** The theory must generate distinct obligations for persons vs. non-persons in medical/legal contexts.
      *   *Case:* Advanced dementia. If the theory says the dementia patient is no longer a person, does care shift from autonomy-based to welfare-based? If it says they are still a person, on what grounds?
      *   *Reasoning:* A metaphysics that doesn't change how we treat the entity is ornamentation.
  2.  **The Misrecognition Constraint (Non-negotiable):** A theory must not allow a community to ontologically destroy a person by withdrawing recognition.
      *   *Case:* The Repudiated Person (outcast).
      *   *Reasoning:* Required for human rights frameworks. If personhood is contingent on social standing, genocide becomes metaphysically coherent.
  3.  **Kind/Status Distinction (Non-negotiable):** Must separate *what* something is (ontological kind) from *how much* it matters (moral status).
      *   *Case:* The Newborn vs. The Corporation.
      *   *Reasoning:* Prevents category errors where legal fiction (corporation) grants moral weight equal to biological sentience.
  4.  **Synchronic/Diachronic Split (Non-negotiable):** Must distinguish personhood-at-a-time from identity-over-time.
      *   *Case:* Fission vs. Dementia.
      *   *Reasoning:* Parfit shows these come apart. A theory collapsing them cannot handle survival questions.
  5.  **Species Neutrality (Non-negotiable):** Criteria cannot rely solely on *Homo sapiens* membership.
      *   *Case:* Social Mammal vs. Human.
      *   *Reasoning:* Avoids speciesism; forces justification for why humans matter more than cognitively similar animals.
  6.  **Strawsonian Accountability (House Preference):** Persons are entities to whom reactive attitudes (blame, gratitude) are appropriately directed.
      *   *Camp:* Strawsonian/Responsibility-based (Darwall, Wallace).
      *   *Discount:* Animalists and some Utilitarians reject this as too narrow (excludes infants, severely disabled).
  7.  **Strong Constitutive Relationality (House Preference):** Relations are ontologically prior to the relata.
      *   *Camp:* Ubuntu/Relational Ontology.
      *   *Discount:* Liberal Individualists/Animalists. *Warning:* This conflicts with Desideratum 2.

  **Case Evaluation: Load-Bearing vs. Loaded**

  *   **Load-Bearing (Keep):**
      *   **Advanced Dementia:** Tests psychological continuity vs. biological life.
      *   **The Newborn:** Tests potentiality vs. actual capacity.
      *   **Fission:** Tests identity over time (essential for Parfit/Locke).
      *   **The Repudiated Person:** Tests relational ontologies (essential for Ubuntu).
  *   **Loaded/Distracting (Downgrade):**
      *   **Corporations:** These are legal fictions, not metaphysical persons. Including them conflates jurisprudence with ontology. Use only to illustrate *status* vs. *kind*.
      *   **AI/Language Models:** Speculative. Unless the seminar is on AI ethics, this invites science fiction over rigorous metaphysics. Use only to test functionalism.
      *   **Social Mammals:** Often used as a proxy for "almost human." Only load-bearing if the theory claims social cognition is the *sine qua non* of personhood.

  **The Ubuntu Slogan: Three Readings**

  1.  **Constitutive:** No relations = no person. *Verdict:* Fails Misrecognition Constraint. Makes the outcast non-person.
  2.  **Epistemic:** Relations help us *identify* persons. *Verdict:* Too weak. Doesn't capture the moral weight of Ubuntu.
  3.  **Developmental:** Relations build the *capacity* for personhood. *Verdict:* Most viable. Allows the outcast to remain a person (ontologically) but a damaged one (functionally).
      *   *Instruction:* Tell students to treat the "Constitutive" reading as the target for critique. The asymmetry you suspect (loss via deterioration ok, loss via exclusion not ok) is a **normative requirement**, not a metaphysical fact. It is a liberal scruple, but it is necessary for any theory claiming to support universal rights.

  **Criterion vs. Analysis**

  Demanding both an **applicable criterion** (decision procedure) and a **metaphysical analysis** (truth conditions) is where the list breaks.
  *   **Incompatibility:** Metaphysical precision (e.g., "psychological continuity") often yields counterintuitive practical results (e.g., "dementia patient is dead"). Practical criteria (e.g., "looks human") are metaphysically shallow.
  *   **Resolution:** Teach this tension. A theory usually sacrifices one. Lockeans sacrifice practical certainty for metaphysical clarity; Animalists sacrifice metaphysical distinctness for practical biological boundaries.

  **Theory Performance Table**

  | Theory | Normative Traction | Misrecognition Constraint | Kind/Status Distinct | Fission/Dementia | Newborns/Animals | **Fatal Flaw** |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Psychological Continuity** (Locke/Parfit) | High (Autonomy-based) | Pass (Internal criterion) | Pass | **Pass** (Handles fission) | **Fail** (Excludes newborns/animals) | **The Too-Narrow Problem:** Excludes humans who lack psychological capacity. |
  | **Animalism** (Olson) | Low (Biological-based) | Pass (Organism persists) | **Fail** (Human = Person) | **Fail** (Cannot handle fission) | Pass (Includes newborns) | **The Normative Gap:** Fails to explain why persons have *different* rights than animals. |
  | **Relational/Ubuntu** (Mbiti/Menkiti) | High (Community-based) | **Fail** (If constitutive) | Pass | Mixed (Context dependent) | Pass (Developmental) | **The Outcast Problem:** Constitutive versions cannot protect the unrecognized. |

  **The Single Killer Requirement:** **The Misrecognition Constraint.** It kills strong constitutive relational views (forcing them to soften to developmental views) and pressures functionalist views to explain why an unrecognized AI or animal isn't a person if they meet the criteria. It is the point where metaphysics crashes into human rights.
