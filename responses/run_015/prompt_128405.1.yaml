answer: |-
  You have done the hard work that most oversight boards skip: you have moved past the mathematics of fairness to the morality of it. You are correctly sensing that the impossibility theorems are not a stop sign, but a map of trade-offs. Your friend is right that you cannot satisfy all criteria; you are right that you must choose which criterion to violate.

  Your verdicts reveal that you are not actually optimizing for statistical parity. You are optimizing for **moral symmetry** (punishment vs. aid) and **causal legitimacy** (where did this risk come from?). The tension in your thinking—specifically between Verdict (1) and the Eviction case, and between Verdict (6) and (7)—is not a failure of logic. It is evidence that group-level fairness metrics are proxies for a deeper principle you haven't fully named yet.

  Here are three candidate principles that formalize your intuitions. Each forces you to abandon at least one of your current verdicts, because your current set is not perfectly consistent (which is normal for human moral reasoning).

  ### Candidate Principle 1: The Asymmetric Parity Principle
  **Statement:** In decisions imposing a **burden** (liberty, income, access), parity is required on the error rate that harms the *subject* (False Positives for detention; False Negatives for aid). In decisions allocating a **benefit**, parity is not required on the error rate that harms the *system* (False Positives for aid; False Negatives for detention), provided the allocation tracks need.
  **Motivating Clause:** The "System Harm" exception is motivated by your **Eviction Case** intuition. You accept unequal waste (False Positives) to ensure unequal need is met, whereas in Pretrial (1) you reject unequal detention (False Positives) even if it balances the books on public safety.
  **Verdicts to Abandon:** You must abandon **Verdict (2)**. Under this principle, if False Positive parity is the moral imperative for burdens, you should accept the increase in False Negatives (re-arrests) as the necessary cost of justice, even if those victims are in the North-side. Your rejection of (2) suggests you care about *aggregate community safety* more than *individual error parity*, which this principle forbids.
  **Eviction Verdict:** **Deploy with FN Parity.** You must tune the model to ensure the rate of wrongful denial (people who would evict but don't get money) is equal across groups. The fact that one group gets more "unnecessary" money (False Positives) is morally irrelevant.
  **New Separating Case:** **Predictive Policing (Hotspots).**
  *   *Scenario:* A model directs patrols to neighborhoods. A "Positive" is a patrol presence.
  *   *Conflict:* Is patrol presence a benefit (safety) or a burden (harassment/over-policing)?
  *   *Principle 1 Ruling:* If you classify it as a burden, you must equalize False Positives (patrols where no crime occurs). This would likely strip patrols from high-crime areas, potentially increasing victimization there. If you classify it as a benefit, you send patrols where crime is predicted, accepting unequal presence. This principle forces you to make a binary classification on the nature of police presence that may not exist.

  ### Candidate Principle 2: The Legitimate Baseline Constraint
  **Statement:** A model is permissible only if no protected group is made **worse off** in absolute terms than under the human decision process it replaces, *unless* the human process relies on features deemed **illegitimate** (e.g., proxies for historical discrimination), in which case short-term worsening is permissible to achieve input legitimacy.
  **Motivating Clause:** The "Input Legitimacy" exception is motivated by **Verdict (7)**. You accepted a model that made everyone worse off (more detention) because it removed "prior arrests," which you judged to be a corrupted input. Without this clause, (7) violates the "no worse off" rule established in (6).
  **Verdicts to Abandon:** You must abandon **Verdict (1)**. This principle is status-quo biased. If the judges' baseline is deemed "procedurally legitimate" (i.e., they didn't use banned features, even if outcomes were disparate), this principle allows the disparity in (1) to continue so long as the model doesn't *increase* the detention rate for the North-side. It prioritizes non-retrogression over corrective parity.
  **Eviction Verdict:** **Compare to Human Baseline.** If social workers currently deny 40% of North-side applicants and the model denies 50%, the model is rejected, regardless of whether the model is more "accurate." If the model denies fewer, it is accepted. The statistical error rates (FP/FN) matter less than the absolute outcome volume compared to the status quo.
  **New Separating Case:** **Teacher Value-Added Models.**
  *   *Scenario:* A model evaluates teachers for retention.
  *   *Conflict:* The baseline is principal discretion (highly subjective, potentially biased). The model is more accurate but penalizes teachers in low-income schools (due to external factors).
  *   *Principle 2 Ruling:* If you deem principal discretion "illegitimate" due to bias, you can deploy the model even if teachers in low-income schools are fired at higher rates (worse off). If you deem the baseline "legitimate procedure," you cannot deploy the model if it fires more of those teachers than principals would have.

  ### Candidate Principle 3: The Harm Incidence Principle (The "Honest Answer")
  **Statement:** Group-level statistical criteria are **proxies only**. The primary moral obligation is to minimize the **expected aggregate harm to the most vulnerable individuals**, regardless of whether that harm is measured by error rates or baseline comparisons. Disparities are only unjust if they correlate with increased harm to the vulnerable; if a disparity reflects differential need (hospital) or removes a biased input (priors), it is permissible even if statistical parity worsens.
  **Motivating Clause:** The "Vulnerability" clause is motivated by **Verdict (4)**. You accepted the hospital disparity because the "risk" reflected systemic neglect. The statistic wasn't the problem; the underlying suffering was. This principle admits that sometimes "fairness" looks like "unequal allocation to the needy."
  **Verdicts to Abandon:** You must abandon the hope that **any single metric** (FP parity, FN parity, Calibration) can be your rule. This principle forces you to abandon the search for a formulaic verdict. It requires a qualitative assessment of "harm" for every new vendor filing. It makes your job harder, not easier.
  **Eviction Verdict:** **Minimize Total Evictions among the Poorest.** You do not equalize error rates. You tune the model to prevent the maximum number of evictions in the lowest-income quintile, even if that means the middle-income group gets zero funds, or if the False Positive rate (wasted money) is 50% for one group and 5% for another. The metric is "homes saved," not "error parity."
  **New Separating Case:** **Emergency Room Triage.**
  *   *Scenario:* An algorithm prioritizes patients for limited ICU beds.
  *   *Conflict:* Group A has higher survival probability with care; Group B has lower survival probability but higher historical mortality due to neglect.
  *   *Principle 3 Ruling:* Send the beds to Group A (maximize lives saved) *unless* you determine the "harm" of death is weighted by historical injustice. If you weight the harm of death in Group B higher due to past neglect, you send beds to Group B. The principle doesn't solve it; it forces you to define "harm" explicitly. Vendors cannot do this for you.

  ***

  ### The Group Definition Problem
  You asked: *Nothing I've read tells me which partition of the population is the one fairness is supposed to be measured over.*

  Here is the honest answer: **No group-level criterion is doing the real work in your verdicts.**

  Your verdicts are being generated by **who bears the harm** and **the causal history of the risk score**, not by the group labels.
  *   In (1), you cared about North-side defendants because they bear the harm of detention.
  *   In (2), you rejected parity because the *victims of the crime* (also North-side) would bear the harm of re-offense.
  *   In (4), you accepted disparity because the "risk" was actually a measure of *past harm done to them*.

  When you switch from "Race" to "Precinct" to "Age," and the numbers flip, it proves that the groups are arbitrary containers. If you measure by Precinct, you capture policing policy. If you measure by Race, you capture structural inequality. If you measure by Age, you capture lifecycle risk.

  **If you demand a vendor guarantee "Demographic Parity," they will simply ask you: "Which demographic?"** If you say "Race," they will optimize for Race and let Precinct disparities explode (which might hurt the poor of all races). If you say "Precinct," they might optimize for geography and ignore racial bias within precincts.

  ### What You Should Demand From Vendors
  Stop asking vendors for fairness metrics. They will give you the ones that make their model look best. Instead, demand a **Harm Impact Statement** modeled on environmental impact reports. Require them to file:

  1.  **The Counterfactual Baseline:** Not "what does the model do?" but "what would have happened to *this specific person* under the human process?" (This addresses Verdicts 5, 6, 7).
  2.  **The Error Cost Matrix:** A explicit valuation of the four outcomes (TP, TN, FP, FN) in human terms. Who pays for a False Positive? (The defendant). Who pays for a False Negative? (The public, or the patient). Do not accept "accuracy" as a goal.
  3.  **The Feature Lineage:** For every feature used, a dossier on its causal history. (This addresses Verdict 7). If they use "prior arrests," they must prove that "prior arrests" measures "culpability" and not "policing density." If they cannot, the feature is inadmissible evidence, regardless of predictive power.
  4.  **The Vulnerability Audit:** Instead of group parity, show the outcomes for the bottom 10% of the socioeconomic distribution, however defined. If the model improves the average but crushes the bottom decile, it fails.

  **My Recommendation:**
  Adopt **Candidate Principle 3 (Harm Incidence)**, but codify the "Input Legitimacy" clause from Principle 2.
  Your intuition in (7) is your strongest moral asset: **A statistically accurate model built on unjust data is not a fair model.**
