answer: |-
  # Research Prospectus: Dimming Dispositions

  **Working Title:** Beyond Binary Interference: Finks, Masks, and the Continuum of Dispositional Thresholds
  **Degree:** MA in Philosophy
  **Estimated Word Count:** 8,000 words
  **Duration:** One Semester (15 Weeks)

  ## 1. The Research Question

  The Simple Conditional Analysis (SCA) of dispositions states that an object has a disposition if and only if, were it subjected to a specific stimulus, it would manifest a specific response. This analysis is famously vulnerable to counterexamples involving *finks* (which remove the disposition prior to manifestation) and *masks* (which prevent the manifestation while the disposition remains). The standard literature treats these counterexamples as binary problems: the manifestation either occurs or it does not; the disposition is either present or absent.

  This thesis asks: **Does the introduction of "dimmer" cases—interfering factors that modulate the threshold of manifestation without removing the disposition or fully blocking the outcome—demonstrate that the fink/mask distinction is merely a difference of degree, and does this necessitate a degreed revision of the Conditional Analysis?**

  A determinate answer will be achieved by testing whether standard repairs to the SCA can accommodate "dimmer" cases without collapsing into a triviality. If they cannot, the thesis will argue that the taxonomy of dispositional interference must be replaced by a continuum model.

  ## 2. Background and Problem Statement

  The debate over dispositions has largely stagnated around the binary logic of the SCA. When a fragile vase is wrapped in bubble wrap, it is masked: it remains fragile, but striking it does not result in breaking. When a fragile vase is touched by a sorcerer who instantly renders it non-fragile upon striking, it is finked: the disposition is lost before the manifestation.

  Current repairs to the SCA generally attempt to isolate the "intrinsic causal basis" of the disposition or refine the *ceteris paribus* conditions to exclude finks and masks. However, these repairs assume a binary ontology of manifestation. They ask, "Will it break?" rather than "How much force is required to break it?"

  My core hypothesis is that this binary assumption hides a structural feature of dispositions. I propose the concept of the **Dimmer**: an interfering factor that raises the threshold required for manifestation. Consider a sedated patient who retains the disposition of irritability but requires significantly greater provocation to manifest anger. The disposition is not removed (not a fink), and the manifestation is not strictly prevented (not a mask). It is modulated.

  If dimmers are coherent, then masks are simply dimmers turned up to maximum (infinite threshold), and finks are dimmers turned up beyond the point of dispositional retention. This suggests the fink/mask distinction is not categorical but scalar.

  ## 3. Why Standard Repairs Do Not Settle This

  I will argue that three prominent strategies for repairing the SCA fail to account for dimmers:

  1.  **Sure-Fire Analyses:** These analyses posit that a disposition guarantees manifestation given the stimulus. Dimmers show that the guarantee is not binary but probabilistic or threshold-dependent. A sure-fire analysis must either classify the dimmed disposition as a *different* disposition (leading to proliferation) or admit that the "guarantee" is sensitive to external modulation, which weakens the intrinsic nature of the basis.
  2.  **Relativized Conditionals:** Some accounts relativize the conditional to "normal conditions" or "standard background." Dimmers exploit the vagueness of "standard." Is a sedated patient in "standard conditions" for irritability? If we relativize to the specific threshold, the analysis becomes circular (it manifests when conditions allow it to manifest). If we do not, the analysis yields false negatives.
  3.  **Causal Basis Accounts:** Accounts that focus on the intrinsic categorical base argue that masks/finks are extrinsic. However, a dimmer (like bubble wrap) is extrinsic, yet it changes the *functional profile* of the disposition. If the functional profile is part of the disposition's identity, then extrinsic dimmers change the disposition, threatening the intrinsicality requirement. If they don't change the disposition, the SCA fails to predict the shifted threshold.

  ## 4. Methodology and Case Families

  To test the dimmer hypothesis, I will run three families of dispositional cases through the "dimmer test." The goal is to see if the dimmer explanation holds across different logical types of dispositions.

  **Family A: Threshold Dispositions (e.g., Fragility)**
  *   *Case:* A glass vase wrapped in varying layers of bubble wrap.
  *   *Test:* Does each layer constitute a new mask, or does it incrementally raise the breaking threshold?
  *   *Prediction:* If the threshold shifts continuously with each layer, the mask is a limit case of a dimmer.

  **Family B: Rate Dispositions (e.g., Solubility)**
  *   *Case:* Sugar dissolving in water vs. sugar dissolving in cold, viscous syrup.
  *   *Test:* The sugar dissolves (manifests) in both, but at different rates. Is the cold syrup a mask? No, because manifestation occurs. Is it a fink? No. It is a dimmer on the *rate* of manifestation.
  *   *Prediction:* Rate cases naturally support the continuum view, as speed is inherently degreed.

  **Family C: Probabilistic Dispositions (e.g., Radioactive Decay)**
  *   *Case:* A radioactive isotope shielded by lead. The probability of decay detection drops but does not hit zero.
  *   *Test:* Does shielding mask the propensity, or dim the probability of detection?
  *   *Prediction:* This is the hardest case. If propensity is intrinsic, shielding should be a mask. If propensity is relational, shielding is a dimmer.

  ## 5. Timeline and Work Plan

  **Month 1: Conceptual Groundwork**
  *   **Weeks 1-2:** Finalize definitions of Fink, Mask, and Dimmer. Distinguish "Dimmer" from "Partial Mask."
  *   **Weeks 3-4:** Draft the critique of Standard Repairs (Sure-Fire and Relativized Conditionals).
  *   *Deliverable:* 2,000-word introduction and literature critique.

  **Month 2: Case Studies and Argument**
  *   **Weeks 5-6:** Develop the Threshold (Fragility) and Rate (Solubility) cases.
  *   **Weeks 7-8:** Attempt the Probabilistic case. If it proves too complex, pivot to expanding the Threshold analysis. Begin synthesizing the "Continuum Thesis."
  *   *Deliverable:* 4,000-word core argument section.

  **Month 3: Drafting and Integration**
  *   **Weeks 9-10:** Draft the implications for the SCA. How must the analysis be rewritten to accommodate degrees?
  *   **Weeks 11-12:** Full first draft assembly.
  *   *Deliverable:* Complete 8,000-word draft.

  **Month 4 (Final Weeks): Revision**
  *   **Weeks 13-15:** Cut redundancies, sharpen the "determinate answer," and finalize references.
  *   *Deliverable:* Final Thesis.

  ## 6. Assessment of Findings

  **Interesting Findings (Success Conditions):**
  *   If the Threshold and Rate cases both yield to the dimmer analysis, it suggests the binary distinction is an artifact of linguistic convenience rather than metaphysical reality.
  *   If standard repairs are shown to require *ad hoc* clauses to handle dimmers (e.g., "conditions must not raise the threshold"), this validates the claim that the SCA needs a structural overhaul, not a patch.
  *   If the "Continuum Thesis" holds, it opens a path to unifying dispositions with powers that come in degrees (e.g., mass, charge).

  **Dud Findings (Failure Conditions):**
  *   If "dimmer" cases can be easily redescribed as "partial masks" without losing explanatory power, the continuum thesis collapses. (Counter-argument: A partial mask still implies a binary block on *some* stimuli, whereas a dimmer shifts the curve for *all* stimuli).
  *   If the Probabilistic case requires a completely different metaphysical treatment than the Threshold case, the unified continuum theory fails, and the thesis must retreat to a narrower claim about qualitative dispositions only.
  *   If the repair to the SCA turns out to be trivial (e.g., "add a clause for degrees"), the philosophical payoff is low.

  ## 7. Feasibility and Scope Verdict

  **Honest Verdict:** This project is currently **too big** for an 8,000-word, one-semester thesis.

  **Reasoning:**
  8,000 words is approximately 25–30 pages. The proposed plan involves critiquing existing literature, defining a new term, and testing it against *three* distinct families of dispositions. Each family alone could sustain a 5,000-word paper. Attempting all three risks superficial treatment where the cases are asserted rather than rigorously defended.

  **Recommendations for Cutting:**
  1.  **Drop the Probabilistic Case:** Propensities introduce a separate set of metaphysical complications (interpretations of probability) that will distract from the core argument about interference. Save this for future research.
  2.  **Prioritize Threshold Dispositions:** The fragility/bubble wrap case is the most intuitive and directly attacks the binary "break/no break" assumption of the standard literature. This should be the primary engine of the thesis.
  3.  **Use Rate Dispositions as Support Only:** Mention solubility/rate only to show the dimmer concept isn't ad hoc to fragility, but do not give it a full section.
  4.  **Narrow the Critique:** Do not attempt to refute *all* standard repairs. Focus on the most dominant current repair (likely the Causal Basis or Relativized Conditional approach) and show specifically how it fails on dimmers.

  **Revised Scope:**
  Focus 60% of the word count on the Threshold Case and the definition of the Dimmer. Use the remaining 40% for the setup and the implications for the SCA. This ensures a deep dive into one strong argument rather than a shallow survey of three.

  **Final Decision:** Proceed with the "Dimmer" concept but restrict the empirical testing to **Threshold Dispositions** exclusively. If space permits, add a paragraph on Rate Dispositions. This ensures the 8,000-word limit is respected while maintaining argumentative density.
