answer: |-
  **JOINT STATEMENT ON THE METAPHYSICS OF EMOTION**

  **Signatories:** Party A (Judgment Theorist), Party B (Feeling Theorist).
  **Working Constraints:** All terms defined below are used consistently. Where a thesis admits a strong (exclusive) or weak (inclusive) reading, the weak reading is signed unless noted. No empirical citations are employed; all cases are stipulated.

  **Definitions:**
  *   **Judgment (A):** An evaluative commitment or belief-like state taking a proposition to be true.
  *   **Feeling (B):** A valenced bodily or affective state shared with non-human animals.
  *   **Fittingness:** The property of an emotion matching the evaluative status of its object.
  *   **Constituency:** What an emotion is made of. **Correctness:** In virtue of what an emotion is fitting. **Individuation:** What makes fear fear rather than anger.

  ### Section I: Agreed Claims

  1.  Emotions are episodic states distinct from enduring character traits or moods. [Constituency, Individuation]
  2.  Emotions possess intentional directedness toward objects or situations, whether real or imagined. [Constituency]
  3.  Emotions are assessable as fitting or unfitting relative to their objects, not merely causal outcomes. [Correctness]
  4.  Emotions typically involve phenomenological changes and characteristic action tendencies. [Constituency, Individuation]
  5.  Emotions can persist despite conflicting assessments of the situation by the subject. [Constituency, Correctness]

  ### Section II: Disagreements Table

  | Issue | Party A (Judgment) Formulation | Party B (Feeling) Formulation | Party C (Perceptual) Stance |
  | :--- | :--- | :--- | :--- |
  | **Constitution** | An emotion is, or is essentially constituted by, an evaluative judgment or belief-like state. | An emotion is a valenced bodily or affective state of a kind shared with non-human animals. | Sides with Neither. Emotions are perceptions of evaluative properties, distinct from both judgment and bare affect. |
  | **Intentionality** | What makes an episode the emotion it is, is what it takes its object to be via conceptual content. | Intentional directedness is inherited from the eliciting conditions and the organism's history rather than from conceptual content. | Sides with A. Intentionality requires content, but denies it must be conceptual belief. |
  | **Phenomenology** | Phenomenology is the accompaniment of a judgment or the state resulting from appraisal. | Phenomenology is not the accompaniment of a judgment but the state itself. | Sides with B. Phenomenology is constitutive, but argues it presents value directly. |

  ### Section III: Verbal-Disputes Subsection

  Row 1 of Section II contains a verbal dispute regarding the term **Judgment**. Party A uses "judgment" to denote a propositional attitude capable of truth-evaluation. Party B sometimes uses "judgment" to denote any informational state regulating behavior. If we replace "judgment" with "propositional commitment," the substantive disagreement survives: Does the intentional content of emotion require conceptual articulation capable of being true/false (A), or merely causal/informational linkage (B)? Both agree that if "judgment" means "any regulatory state," A's view collapses into triviality. Both agree that if "feeling" means "any conscious state," B's view collapses into triviality. The substantive core is the requirement of conceptual structure for intentional directedness.

  ### Section IV: Cruxes Table

  | Crux | Case / Test | Party A Prediction | Party B Prediction | Loser's Escape Hatch |
  | :--- | :--- | :--- | :--- | :--- |
  | **a. Recalcitrance** | A subject sincerely judges the glass elevator safe and continues to fear it. Both accept this happens. | Two states in a divided mind: one judgment (safe), one emotion (danger). | One state with evaluative content set by something other than judgment. | **A:** The safety judgment was not fully endorsed. **B:** The affect was fragmented, not unified. |
  | **b. Affective Decoupling** | Stipulate an intervention producing full fear episode (phenomenology, autonomic, action) while subject forms no evaluative judgment, holds no belief of danger, and has no impairment of capacity to judge. | Verdict: Incoherent stipulation. Fear entails danger judgment. | Verdict: Coherent. Shows emotion is independent of judgment. | **A:** Not fear, just arousal. **B:** Not full fear, missing cognitive layer. |
  | **c. Calibrated Conviction** | Subject judges situation dangerous, reasons well, acts on it, reports no feelings, described as fearless. | Subject has emotion. Description as fearless is mistaken. | Subject lacks emotion. Description as fearless is correct. | **A:** Affect was suppressed. **B:** Judgment was abstract, not emotional. |
  | **d. Rational Review** | Argument: Emotions are assessable for fittingness; only states with propositional structure are assessable; feelings lack structure; therefore emotions are not feelings. | Argument is Sound. | Argument is Unsound. Premise 2 fails: feelings are assessable without propositions. | **A:** Review targets judgment component. **B:** Review targets causal history, not structure. |

  ### Section V: Closing Note

  Party A counts as evidence against their view any demonstration of complex emotional behavior in organisms incapable of propositional attitudes (e.g., pre-linguistic infants). Party B counts as evidence against their view any demonstration of emotions being revised solely by logical argument without causal intervention on bodily state. Both agree that neither finding alone is decisive, as A can posit non-conceptual proto-judgments and B can posit coincidental reasoning. The debate would actually move only if a jointly signable account of intentionality were produced that explains directedness without requiring conceptual content (satisfying B) while preserving normative assessability (satisfying A). Until then, we maintain our distinct formulations regarding the constituency of emotion.
