  # Joint Adversarial Collaboration: Access, Phenomenality, and the Silent Broadcast

  ## Part One: Agreed Claims

  1.  **The Distinction:** We both agree there is a conceptual difference between *phenomenal consciousness* (what it feels like to be you right now) and *access consciousness* (the information actually available for reasoning, reporting, and rational control). Nobody is denying the difference exists; we're fighting over where the line gets drawn.
  2.  **GWT Thresholds:** The Global Workspace Theory (GWT) side predicts that for any content to be verbally reported, it must cross a specific threshold of global broadcasting. We agree that if the broadcast signal is too weak or too localized, verbal report fails.
  3.  **Split-Brain Evidence:** We agree on the data from split-brain patients: you can get highly coordinated, integrated non-verbal behavior (like two hands working together on a puzzle) even when the verbal report system claims total ignorance or confabulates a reason.
  4.  **Silent-Broadcast Mechanics:** We agree it is mechanically possible to have an architecture where information is broadcast widely to motor and planning modules but is effectively firewalled from the verbal-report buffer. This isn't magic; it's just routing.
  5.  **Report is Not Reality:** We both admit that verbal report is an imperfect measure. Just because a subject says "I didn't see it" doesn't necessarily mean nothing happened in the brain, though we disagree on what that "something" was.

  ## Part Two: Disagreements Table

  | Issue | Hardline GWT Defender | Phenomenal-Primacy Defender |
  | :--- | :--- | :--- |
  | **Silent Broadcast Status** | If the content hits motor and planning globally, that *is* access consciousness, even if speech doesn't get it. Access is about use, not just talking. | If it can't be reported or used for flexible reasoning, it's not full access. It's phenomenal experience driving unconscious modules, nothing more. |
  | **Motor Module Entry** | Getting into the motor planning workspace counts as workspace entry. The body knows, so the system accessed it. | Motor routines are sub-personal automaticity. True access requires availability to the "self" system, not just the arm muscles. |
  | **The Verbal Buffer** | The verbal buffer is the best proxy we have for the global workspace. If it's not there, the workspace didn't light up fully. | The verbal buffer is just one output channel among many. Basing the definition of access on speech is a linguistic bias, not a neural fact. |
  | **Split-Brain Unity** | The coordinated hands show two workspaces cooperating sub-verbally, not one unified conscious mind. | The coordinated hands show a unified phenomenal field that survives the severing of the verbal report pathways. |

  ## Part Three: The Cruxes

  **Crux 1: Does Report-Failure Always Mean Access-Failure?**
  *   **The Case:** The silent-broadcast scenario. A subject tracks a moving target with their hand perfectly but claims they are guessing randomly when asked.
  *   **Why it matters:** This decides if access is defined by *availability to action* or *availability to report*.
  *   **GWT Prediction:** Access failed. The hand tracking was done by specialized, encapsulated modules that didn't ignite the global workspace. The subject was phenomenally blind to the tracking logic.
  *   **Phenomenal-Primacy Prediction:** Access succeeded for action, but report failed. The subject had access to the motion for motor control, proving access is broader than report, but the verbal channel was bottlenecked.

  **Crux 2: Does Naturalness or Integration Have Intrinsic Value?**
  *   **The Case:** Split-brain integrated non-verbal behavior. Two hands solve a problem together smoothly without a unified verbal story.
  *   **Why it matters:** This decides if consciousness is about *functional integration* or *phenomenal unity*.
  *   **GWT Prediction:** Integration is purely functional. The brain is optimizing behavior without needing a unified conscious owner. There is no "ghost" feeling the unity, just code sharing data.
  *   **Phenomenal-Primacy Prediction:** Integration implies a unified feel. If the behavior is globally integrated across hemispheres, there must be a phenomenal field holding it together, regardless of the verbal split.

  **The Testable Bet:**
  We run a study where subjects manipulate objects under a "silent-broadcast" induction (distracting the verbal buffer while testing motor precision). If motor precision correlates with neural signatures of global broadcasting (without report), GWT says that's access. Phenomenal-Primacy says that's just rich phenomenology driving unconscious action. We measure the neural ignition. If ignition happens without report, GWT calls it access, Phenomenal-Primacy calls it overflow. We will literally be looking at the same spark and calling it different names.

  We're stuck because one side defines consciousness by what it does, and the other defines it by what it is.
