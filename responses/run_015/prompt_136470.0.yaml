answer: |-
  The coherence of lexical-threshold negative utilitarianism (LTNU) hinges on a specific architectural claim: that moral priority shifts discontinuously based on the magnitude of suffering. The view asserts that reducing suffering holds strict lexical priority over increasing pleasure, but only until suffering falls below a certain threshold, at which point pleasure regains independent moral weight. Standard formulations of this view tacitly rely on a cardinal metric of welfare—a single scale upon which both pain and pleasure can be plotted—to locate this threshold. However, if we accept the skepticism that pleasure and pain lack cardinal commensurability, the foundation of the threshold is threatened. The central question is whether the lexical threshold can be reconstructed using purely structural relations, such as partial-order dominance, without collapsing into arbitrariness.

  Upon rigorous examination, the verdict must be that LTNU cannot remain coherent without full cardinal commensurability. A purely structural reconstruction fails to provide the normative machinery necessary to locate the threshold non-arbitrarily. Without a unified metric, the threshold becomes a brute stipulation that severs the link between moral reasoning and rational choice, causing the view to collapse into either standard negative utilitarianism or an implausible discontinuity in practical reasoning.

  To understand why the structural reconstruction fails, we must first isolate the function of the threshold. In LTNU, the threshold is not merely a descriptive marker; it is a switch for normative rules. Above the threshold, the moral calculus is lexicographic: any reduction in suffering, however minute, outweighs any increase in pleasure, however massive. Below the threshold, the calculus becomes aggregative or weighted: pleasure and residual discomfort can be traded off. For this switch to be rational rather than capricious, there must be a principled reason why the moral logic changes at point $T$ rather than at point $T-1$ or $T+1$.

  In a cardinal framework, this justification is theoretically available, even if difficult to measure. One can argue that the disutility function of suffering is hyperbolic or asymptotic. As suffering intensity increases, its negative weight approaches infinity relative to pleasure. The threshold is the point where the curve flattens enough that finite trade-offs become permissible. Here, the cardinal metric provides the continuity required to justify the discontinuity in rules. We can point to the scalar properties of the experience to explain why the rule changes.

  The structural proposal attempts to bypass this need for measurement. It suggests that we do not need to know *how much* pain exists, only *what kind* of dominance relations hold between states. Proponents might argue that we can define the threshold structurally: for example, suffering dominates pleasure whenever it reaches an intensity that precludes agency, or whenever it belongs to a "severe" category in a qualitative taxonomy. In this model, states are partially ordered. State $A$ is better than State $B$ if $A$ contains less severe suffering, regardless of the pleasure content. The threshold is simply the boundary of the region where this dominance relation holds.

  However, this structural move conceals a fatal flaw: partial orders can rank states, but they cannot define boundaries for rule-switching without smuggling in cardinal assumptions. A dominance relation tells us that $A \succ B$. It does not tell us where the *lexicographic* priority ends. To say that suffering dominates pleasure "up to a threshold" implies that there is a region where suffering does *not* dominate pleasure. If we abandon cardinality, we lose the ability to measure the "distance" between the dominant region and the non-dominant region.

  Consider two states: State $X$ involves a headache and moderate pleasure. State $Y$ involves no headache and slightly less pleasure. In a structural model, if a headache is "above threshold," $Y$ is strictly better than $X$, regardless of the pleasure loss. If the headache is "below threshold," we must weigh the headache against the pleasure. But what determines the status of the headache? If we say it is a structural feature (e.g., "distracting pain"), we must ask: why does "distracting pain" veto pleasure, while "mildly distracting pain" does not?

  If the answer is that they are qualitatively different kinds, we have not escaped cardinality; we have merely shifted it. We are now asserting that "Kind A pain" has infinite weight and "Kind B pain" has finite weight. To justify this assignment without a metric is to assert a brute moral fact. But brute facts are the enemy of coherent ethical systems, particularly utilitarian ones which aspire to explain value through consequences. If the threshold is a brute fact, it is vulnerable to the charge of arbitrariness. Why does the lexical priority vanish at the boundary of "severe" pain? If there is no scalar dimension along which "severe" pain differs from "moderate" pain other than our stipulation, the threshold is normatively inert. It functions as a dogma, not a derivation.

  Furthermore, the structural approach creates a discontinuity in practical reasoning that renders the view action-guiding only by fiat. Rational choice theory generally requires continuity: small changes in the world should not produce massive swings in moral obligation unless there is a proportional change in value. LTNU already strains this principle with its lexical priority. By adding a threshold without a cardinal metric, it compounds the strain.

  Imagine an agent hovering near the threshold. A structural definition offers no gradient to guide them. They cannot calculate whether a small reduction in suffering moves them across the boundary because there is no scale to measure the reduction. They only know the binary status of the current state. This creates a "cliff edge" problem. If the threshold is defined structurally (e.g., "the absence of torment"), the transition from "torment" to "no torment" might be vague. Without cardinality to precisify the boundary, the agent faces a sorites paradox. If one neuron's firing rate distinguishes torment from severe discomfort, does the moral law flip from "maximize pain reduction" to "maximize pleasure"?

  A cardinal metric allows us to smooth this transition conceptually, even if the rule is discontinuous. It allows us to say the *value* changes continuously even if the *priority* shifts. A structural model denies us this recourse. It forces a discontinuity in the ontology of the value itself. This makes the theory practically unstable. An agent cannot rationally pursue a goal if the definition of the goal shifts unpredictably based on structural boundaries that lack scalar definition.

  Defenders of the structural view might argue that we accept similar discontinuities in other domains. We treat "alive" and "dead" as binary states, despite the biological continuum. We treat "guilty" and "not guilty" as binary, despite evidentiary gradients. Why not treat "lexically significant suffering" as a binary state?

  The distinction lies in the normative consequences. In law or biology, the binary classification is a pragmatic tool for decision-making, not a claim about the underlying metaphysics of value. In LTNU, the threshold is the *source* of value priority. If the classification is pragmatic, then the lexical priority is also pragmatic, which undermines the utilitarian claim that suffering is *intrinsically* worse. If the classification is metaphysical, we return to the problem of justification. Why does nature carve the world at this joint? Without a cardinal scale of welfare to map onto the natural joint, the joint is invisible.

  Consequently, the structural reconstruction forces LTNU into a dilemma. Either the threshold is defined by a qualitative shift in the *nature* of suffering (e.g., from physical to existential), or it is defined by a shift in *intensity*. If it is qualitative, the view ceases to be utilitarian in the standard sense and becomes a form of pluralistic intuitionism, where different kinds of bads have different rules. This abandons the unified consequentialist framework. If it is based on intensity, we are back to requiring a metric. Intensity is a scalar concept. To say intensity matters lexically up to a point is to make a claim about the magnitude of the intensity. You cannot have magnitude without cardinality.

  Therefore, the attempt to ground the lexical threshold in structural dominance relations fails. It attempts to use ordinal tools to solve a cardinal problem. The threshold is inherently a scalar concept—it is a limit point. You cannot have a limit point on a partial order without a metric to define convergence or boundary conditions. Without that metric, the threshold is floating.

  This leads to the collapse of the view. If the threshold cannot be located non-arbitrarily, LTNU bifurcates. On one side, if we push the threshold to infinity to avoid arbitrariness, we get Standard Negative Utilitarianism: suffering always dominates, and pleasure never independently counts. This is coherent but rejects the "threshold" intuition. On the other side, if we acknowledge we cannot locate the threshold, we must treat the switch as a matter of intuition or context. This turns LTNU into a heuristic rather than a moral theory. It loses its claim to objective rationality.

  The most damaging implication is for the "lexical" component itself. Lexical priority is a strong claim. It says $A$ is infinitely more valuable than $B$. To say this holds *until* condition $C$ is met implies that the infinite value of $A$ is contingent on $C$. But if $A$ and $B$ are incommensurable (as the skepticism of cardinality suggests), you cannot establish the contingency. You cannot say "Pain is infinitely worse than Pleasure, unless the Pain is small." If they are incommensurable, Pain is just *different*. To compare them at all—even to establish a lexical hierarchy—requires a common denominator. The threshold view tries to have it both ways: it wants the incommensurability of distinct qualia (to avoid the repugnant calculus of trading pain for pleasure) but the commensurability of a single scale (to locate the threshold where trading becomes okay). This is logically inconsistent.

  We must conclude that lexical-threshold negative utilitarianism cannot stand on internal reasoning alone without cardinal commensurability. The structural approach offers the illusion of precision while lacking the normative traction to justify the boundary. It leaves the agent with a rule that switches without a signal, a priority that vanishes without a measure.

  The verdict is that the framework collapses. To save the intuition behind LTNU—that extreme suffering demands absolute priority while mild discomfort allows for trade-offs—one must either embrace a cardinal utility function (and face the measurement challenges head-on) or abandon the lexical structure in favor of a prioritarian or sufficientarian view that weights suffering heavily but continuously. A non-cardinal, structurally defined threshold is a conceptual phantom; it promises a boundary where there is only a fog. Rational moral theory cannot be built on fog. It requires the solid, if difficult, ground of commensurable value. Without it, the threshold is not a bridge between negative and positive utilitarianism; it is a gap in reasoning that swallows the theory whole.
