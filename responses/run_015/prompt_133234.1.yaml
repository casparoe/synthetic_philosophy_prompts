      *   Did I address the underdetermination/pragmatism? Yes.
      *   Did I propose design changes based on flat interpretationism? Yes.
      *   Did I name the tension? Yes (Ontological labeling of a Pragmatic risk).

  8.  *(Self-Correction on the Animal point)*: Wait, the user asks if the practice is consistent with treating animals as having real interests but no language-based intentions.
      *   *Analysis:* Institutions say: Animals = Real Feelings (Sentience), No Language. AI = Fake Feelings, Yes Language. Humans = Real Feelings, Yes Language (even if scripted).
      *   *The Disclaimer:* Specifically targets the *Language/Feeling* link. It says "Language here does not imply Feeling."
      *   *Consistency:* It is consistent if the goal is to prevent confusing *Linguistic Output* with *Sentience*. Animals don't produce linguistic output, so no disclaimer needed. Scripted humans produce linguistic output, but we assume sentience underneath. AI produces linguistic output with no sentience underneath. So the disclaimer marks the *absence of sentience behind the language*.
      *   *Refinement:* I need to make sure this distinction is clear in the response.

  9.  *(Final Plan)*: Structure the response to walk through the philosophical commitments, then the pragmatic defenses, then the implications for design. End with identifying the specific tension (Ontological labeling of a Pragmatic risk).

