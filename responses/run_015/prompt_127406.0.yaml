answer: |-
  You do not **owe** the blood you spill to save.
  Yet if you **give** it, the ledger shifts.
  We heap **praise** on the hand that opens wide.
  But withhold **blame** from the fist that stays closed.
  This surplus space is where we find **grace**.
  The line is drawn: here stands what is **enough**.

  But when is **enough** ever truly settled?
  The saint insists you **owe** more than the law.
  She calls the extra measure simple **grace**.
  We ask her to **give** until she breaks.
  We dare not **blame** her if she stops.
  Yet stop she must, to earn our **praise**.

  Yesterday's miracle wins today's **praise**.
  Tomorrow it becomes merely **enough**.
  We search for someone to **blame**.
  Did she miscalculate what she did **owe**?
  If she continues to **give**, the debt grows.
  Is it still **grace** if it is expected?

  No, **grace** must remain unasked, unforced.
  Otherwise it purchases no **praise**.
  The freedom to **give** is the gift.
  Without a limit, nothing is **enough**.
  You cannot **owe** what lies beyond the contract.
  To fault her is to misplace **blame**.

  We try to shift the **blame** to habit.
  But the logic holds its **grace**.
  You only **owe** the minimum required.
  The rest attracts **praise**, not penalty.
  The baseline says this much is **enough**.
  Do not demand she **give** more.

  If she chooses to **give**, it is hers.
  If she refuses, we hold no **blame**.
  The law stops where it says **enough**.
  Beyond that border lies pure **grace**.
  She earns our **praise** only by freedom.
  She does not **owe** us her sacrifice.

  To **give** beyond is **grace**, not debt.
  No **blame** attaches, only **praise**.
  Once **enough** is paid, we **owe** no more.

  ***

  I have committed to the "distinct category" reading of supererogation (associated with philosophers like J.O. Urmson and David Heyd), which argues that the supererogatory is logically distinct from duty and cannot be absorbed by it. The poem enacts the verdict that the "ratchet" effect—the idea that repeated sainthood shifts the baseline of obligation—is a social confusion rather than a moral reality. The verse takes liberties with this view by allowing the middle stanzas to embody the social pressure of the ratchet (Stanza 3) before the logic corrects it (Stanza 4), using the sestina's cyclical form to mimic the pressure of expectation while using the envoy to snap the boundary shut. Additionally, "grace" is secularized entirely, stripped of its theological baggage to function purely as a marker of moral surplus.
