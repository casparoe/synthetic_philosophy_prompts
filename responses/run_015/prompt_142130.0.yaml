answer: |-
  **Brainstorming Pass: Candidate Accounts of Money**

  1.  **Measure of Value:** Money exists to compare disparate goods. *Countervailing Feature:* The state forbids private contracts from using the official reference basket, which is the only true measure of value provided.
  2.  **Creature of Law (Chartalism):** Money is purely a creation of state fiat. *Countervailing Feature:* The equitable reopening clause allows courts to adjust obligations based on economic reality, overriding the state's face value.
  3.  **Credit/Debt Theory:** Money is a social accounting of credit relationships. *Countervailing Feature:* The nominal-value rule ignores the real value of the credit extended over time, treating the token as the debt itself.
  4.  **Commodity Money:** Money is a specific good (e.g., gold) used as a medium. *Countervailing Feature:* Redenomination changes the legal unit without changing any physical substance, which would be impossible if money were a commodity.
  5.  **Neutral Numeraire:** Money is a stable accounting unit for calculation. *Countervailing Feature:* The state indexes its own taxes and pensions, admitting the unit is not stable enough for public obligations.

  ***

  **Reconstruction of the Monetary Scheme**

  (a) The triad of nominalism, legal tender, and continuity presupposes **Sovereign Nominalism**. On this view, money is not a measure of value in any natural sense, but a countable token defined exclusively by sovereign fiat. The unit is whatever the state says it is at the moment of payment. The redenomination proves the unit is arbitrary; continuity proves the obligation attaches to the count, not the substance. Justice is satisfied by enforcing the agreed number, because the number is the only objective fact the law can recognize without investigating economic conditions. The state's specification is conclusive because the state creates the metric itself.

  (b) Strictly speaking, only redenomination and legal tender *require* Sovereign Nominalism. You cannot divide a commodity by decree; only a legal count can be slashed by three zeros while preserving obligation. However, the ban on private indexation is a policy choice, not a logical necessity. A system could allow private contracts to peg to the basket while still redenominating the currency. Commodity theory is ruled out entirely. Credit theory is compatible but suppressed; the law treats the token as the end rather than the record of the debt. Neutral numeraire theory is left available but contradicted by practice; if the unit were truly neutral, the state would not need to index its own liabilities.

  (c) The scheme is logically consistent but morally asymmetrical. The state acts as a nominalist creditor regarding taxes but a valorist debtor regarding pensions. It forbids citizens from doing what it does: protecting themselves against the drift of the convention. The reference basket acknowledges the unit drifts but forbids correcting for it. This treats the convention as binding on the weak and flexible for the strong. It exploits the conventionality of money to shift risk onto private parties while the state hedges itself. This is not a contradiction in law, but a contradiction in justice.

  (d) The equitable reopening clause imports **Valorism**. It admits the measure failed over long durations. It is not mercy; it is an Aristotelian correction restoring proportional equality. It conflicts with strict nominalism but preserves the system's legitimacy. By limiting it to long contracts and large shifts, the law admits nominalism works for short exchanges but fails as a store of value. It quietly concedes that money's job is to measure need, and when it stops doing so, the law must intervene.

  (e) Full Aristotelian adoption would require mandatory indexation for long contracts and perhaps restricting interest as "breeding money." The unit would be defined by the basket. Certainty would decrease; transaction costs would rise. Fairness would increase. Interest might be reclassified as rent for use rather than profit from money itself. The law would serve exchange, not accumulation. However, this would make commercial planning difficult. The current scheme is a compromise: nominalism for certainty, reopening for justice.

  ***

