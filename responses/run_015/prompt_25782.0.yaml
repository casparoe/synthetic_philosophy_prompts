      *   *Bayesian View:* This is the technical core. If $P(E) = 1$, then $P(H|E) = P(H)$. This is mathematically correct *given* the assumption of logical omniscience and standard conditionalization on known facts.
      *   *Nuance:* Some Bayesians reject $P(E)=1$ for empirical evidence (Jeffrey conditionalization), but the standard formulation assumes it.
