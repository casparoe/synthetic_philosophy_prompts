      *   *Bayesian View:* This is the *normative* claim. Bayesians agree old evidence *did* support GR. They disagree that the inability to model this *synchronically* makes the theory "fatal."
      *   *Nuance:* "Fatal" is a strong word. Most Bayesians view it as a significant technical hurdle, not a refutation.
      *   *Verdict:* Overstated. "Problematic" or "Challenging" is better than "Fatal."

  6.  **Evaluate Claim 4:** *"Bayesians have tried to escape by saying we should imagine we don't know the evidence, but this just replaces objective confirmation with a psychological fiction."*
