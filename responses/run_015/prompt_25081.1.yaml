prompt: |-
  So my friends and I are starting a co-living house — six of us on the lease, but three more are "maybe" and will decide in a couple months, and two partners of leaseholders will basically live there half the week even though they're not on the lease. We want to make decisions democratically about house rules, chores, guests, etc. But we're stuck on the most basic thing: who even gets a vote? If we put it to a vote among the six leaseholders to decide whether the partners and the maybes get a vote, that seems circular — like we're already assuming the answer by who we let into the room. But I can't think of a non-arbitrary way to draw the line. How do we solve this?
reasoning: |-
  Here's a thinking process that leads to the suggested advice:

  1.  **Analyze the Problem:**
      *   **Context:** A co-living house startup.
      *   **Stakeholders:**
          *   6 Leaseholders (definite).
          *   3 "Maybes" (potential future leaseholders, decision in a couple of months).
          *   2 Partners (significant others of leaseholders, present ~50% of the time, not on lease).
      *   **Goal:** Democratic decision-making (house rules, chores, guests, etc.).
      *   **Core Conflict:** Determining *who gets a vote* (the franchise).
      *   **The Paradox:** Voting on who gets to vote requires a pre-defined electorate, which feels circular/arbitrary.
      *   **Underlying Tension:** Legal responsibility (lease) vs. Actual impact (living there) vs. Future potential (maybes).

  2.  **Deconstruct the "Voting" Concept:**
      *   Is "one person, one vote" actually the best model for a household?
      *   What are the different *types* of decisions? (Financial/Legal vs. Social/Day-to-day).
      *   What are the risks? (Leaseholders are financially liable; Partners are guests/residents; Maybes are outsiders).

  3.  **Brainstorming Solutions to the "Who Votes?" Paradox:**
      *   *Option A: Leaseholders Only.* Safe legally, but ignores the reality of partners living there half-time.
      *   *Option B: Everyone Present.* Inclusive, but dilutes the responsibility of those signing the lease.
      *   *Option C: Tiered Voting.* Different rights for different levels of commitment.
      *   *Option D: Consensus over Voting.* Shift the paradigm from majority rule to agreement.
      *   *Option E: The "Constitutional Convention" Approach.* Treat the initial setup as a special case.

  4.  **Developing the Recommendations:**

      *   **Acknowledge the Paradox:** Validate the user's feeling. It *is* circular. That's why you don't vote on the constitution; you negotiate it.
      *   **Distinguish Decision Types:** This is crucial.
          *   *Financial/Legal:* Only leaseholders (they hold the bag).
          *   *Social/Chores/Guests:* Everyone affected (partners included).
          *   *Admitting New Members:* Current leaseholders + maybe a veto from partners?
      *   **Address the "Maybes":** They are outsiders until they sign. Giving them voting power now is risky (they might leave). They need observer status.
      *   **Address the Partners:** They are quasi-residents. 50% time is significant. They should have a say in *living* conditions, but not *financial* obligations.
      *   **Propose a Governance Structure:**
          *   *Tier 1: Leaseholders.* Full voting on everything, especially money/lease.
          *   *Tier 2: Residents (Partners).* Voting on social/chores/guests. No vote on money/lease.
          *   *Tier 3: Prospects (Maybes).* No vote, but input welcomed during trial period.
      *   **Suggest a Process for the "First Vote":** Since voting on voting is circular, use *Consensus* for the initial agreement. Everyone currently in the house (6 + 2 partners) agrees on the rules of engagement. The "Maybes" are consulted but don't block.
      *   **Highlight the "Exit Strategy":** What happens if a partner moves in full time? What if a Maybe says no?

  5.  **Refining the Advice (Self-Correction/Nuance):**
      *   *Critique:* Is tiered voting too complicated?
      *   *Fix:* Keep it simple. Money = Leaseholders. Vibe = Residents.
      *   *Critique:* What if the partners outvote the leaseholders on a social issue that impacts costs (e.g., "let's get a cleaner")?
      *   *Fix:* Clarify that social decisions with financial implications revert to leaseholders.
      *   *Critique:* The user mentioned "democratically."
      *   *Fix:* Explain that democracy in a shared home often works better as *consensus* or *sociocracy* rather than simple majority.

  6.  **Drafting the Response (incorporating the above):**
      *   *Introduction:* Validate the "circular" feeling. It's a "Constitutional Moment."
      *   *Core Principle:* Stakeholder Theory (Risk = Power).
      *   *The Framework:* Three Tiers of Membership.
      *   *The "First Vote" Solution:* Consensus, not Majority.
      *   *Specific Scenarios:* How to handle the Maybes and Partners.
      *   *Long-term:* Review clauses.

  7.  **Final Polish:** Ensure tone is collaborative, practical, and structured. (Make sure to emphasize that leaseholders are legally on the hook, which justifies their ultimate veto power).

  **(Self-Correction during drafting):** I initially thought about suggesting the partners get full votes. But if the leaseholders are liable for damages, they need final say. I need to make sure the distinction between *liability* and *livability* is clear.

  8.  **Final Output Generation:** (This matches the detailed response provided previously.)
answer: |-
  You have identified a classic governance problem: **You are trying to use the system to define the system.** In political science, this is called a "Constitutional Moment." You cannot vote on the constitution using the rules of the constitution, because the constitution doesn't exist yet.

  To break the circle, you have to step outside the framework of "voting" for this specific decision and use **negotiation and consensus** to establish the initial social contract.

  Here is a framework to solve the "who votes?" problem without being arbitrary, based on the principle of **Risk = Power.**

  ### 1. The Core Principle: Liability Determines Veto Power
  The hardest line you must draw is financial and legal liability.
  *   **The 6 Leaseholders:** You are legally responsible for the rent, damages, and eviction risks. If the house fails, you lose money and credit.
  *   **The Partners & Maybes:** They have no legal liability.

  **The Rule:** On any decision involving **money or the lease** (rent amount, buying shared appliances, subletting, evicting someone), only the 6 leaseholders vote. The partners and maybes can have input, but they cannot override the people signing the checks.

  ### 2. The Three-Tier Membership Model
  Instead of a binary "Voter vs. Non-Voter," create three tiers of membership with different voting rights. This acknowledges reality without compromising legal safety.

  **Tier 1: Full Members (The 6 Leaseholders)**
  *   **Rights:** Vote on *everything* (Financial, Legal, Social, House Rules).
  *   **Responsibilities:** Pay rent, sign lease, enforce rules.

  **Tier 2: Resident Partners (The 2 Partners)**
  *   **Rights:** Vote on **Livability Issues** (Chores, Guests, Noise, Shared Food, Cleaning Standards).
  *   **Restrictions:** No vote on Financial/Lease issues.
  *   **Logic:** They live there 50% of the time. A decision about "no dishes in the sink" affects them directly. It is undemocratic to make them follow rules they had no say in creating. However, they cannot vote to spend house funds because they aren't liable for the debt.

  **Tier 3: Prospective Members (The 3 Maybes)**
  *   **Rights:** **Observer/Input Only.** No voting rights yet.
  *   **Logic:** They are currently outsiders. Giving them voting power before they commit is risky. If they vote for a strict rule and then decide not to move in, the remaining house is stuck with a rule designed for a group that doesn't exist.
  *   **Compromise:** They get to attend meetings and voice concerns, but they cannot block consensus.

  ### 3. How to Set This Up (The "First Vote" Solution)
  Since you can't vote on who gets to vote, you must use **Consensus** to establish the ground rules.

  **Step 1: The Founding Meeting**
  Gather the 6 leaseholders and the 2 partners. (Exclude the Maybes for this specific conversation to avoid confusion, or invite them strictly as listeners).
  *   **Acknowledge the Paradox:** State clearly, "We are not voting today. We are negotiating a social contract."
  *   **Propose the Tiered Model:** Present the structure above.
  *   **Seek Consensus:** Ask the 6 leaseholders and 2 partners: "Can we all live with this structure?"
      *   If a leaseholder objects, you negotiate until they agree.
      *   If a partner objects (e.g., they want a vote on finances), the leaseholders must explain the liability risk.
      *   **Crucial:** If consensus cannot be reached among the 8 people currently committed to the house, the house dynamic is already broken before you move in.

  **Step 2: The Probationary Period for Maybes**
  Write into your house agreement that the 3 Maybes have a "Probationary Voting Status."
  *   Once they sign the lease (or a formal roommate agreement), they automatically graduate to Tier 1.
  *   Until then, their input is advisory.

  ### 4. Operationalizing the Votes
  To prevent gridlock, define *how* you vote based on the tier.

  *   **Financial/Lease Decisions:** Simple Majority of Tier 1 (Leaseholders). *Example: Buying a $1,000 couch.*
  *   **Livability Decisions:** Simple Majority of Tier 1 + Tier 2 (Leaseholders + Partners). *Example: Quiet hours, cleaning roster.*
  *   **Admitting New People:** Consensus of Tier 1. *Example: If a partner wants to move in full-time, all leaseholders must agree.*

  ### 5. Why This Isn't Arbitrary
  It feels arbitrary to say "Leaseholders get more power," but it isn't. It is based on **Skin in the Game.**
  *   If the partners vote to throw a huge party that breaks a window, the leaseholders pay for it. Therefore, leaseholders need a veto on risk.
  *   If the leaseholders vote that "partners must leave by 8 PM," the partners suffer the consequence. Therefore, partners need a vote on social rules.

  ### 6. A Warning on "Democracy" in Houses
  You mentioned you want to make decisions "democratically." In co-living, **majority rule often fails.**
  *   If 4 people vote to have a party and 2 people need to sleep for work, the 2 people suffer.
  *   **Recommendation:** Use **Consensus** for major rules (everyone must agree or at least not object) and **Majority** for minor execution (which brand of toilet paper to buy).

  ### Summary of Action Plan
  1.  **Hold a "Constitutional Convention"** with the 6 leaseholders + 2 partners.
  2.  **Do not vote.** Negotiate until everyone agrees on the **Tiered Membership Model**.
  3.  **Formalize it.** Write down: "Leaseholders decide money; Residents decide chores."
  4.  **Inform the Maybes.** Tell them: "We have set up a governance structure. You will have full voting rights the moment you sign the lease. Until then, we want your input, but not your vote."

  This solves the circular logic by acknowledging that the initial agreement is a **contract**, not a **ballot.**
