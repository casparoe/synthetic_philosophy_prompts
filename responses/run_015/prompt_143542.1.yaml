answer: |-
  ### Specification of Adequacy for Evolutionary Debunking Arguments

  The following desiderata establish the conditions under which an evolutionary debunking argument (EDA) counts as adequate for the purposes of this dissertation. The primary dialectical target is the sophisticated non-naturalist realist. An argument is adequate only if it provides her with an internal reason to reduce confidence in her first-order moral judgments, without collapsing into global skepticism or begging the question.

  **Desiderata List**

  1.  **Granularity (The Fission Constraint)**
      *   **Requirement:** The argument must specify a principle for distinguishing between moral judgments that are debunked and those that are not. It cannot entail that all normative judgments are unjustified (global skepticism) nor that none are (inefficacy). It must explain why divergence in the Fission case (e.g., obligations to future people) warrants skepticism while convergence (e.g., prohibitions on murder) might not, or vice versa, without arbitrary selection.
      *   **Status:** Non-negotiable.
      *   **Consideration:** Without this, the EDA is either self-defeating (debunking the premises used to argue for debunking) or dialectically useless (failing to move the realist who retains confidence in core judgments).

  2.  **Epistemic Safety (The Overgeneralization Constraint)**
      *   **Requirement:** The epistemic principle linking evolutionary genealogy to justificatory defeat must not apply equally to paradigmatically reliable faculties (logic, mathematics, perception, memory). If the principle debunks morality, it must explain why it does not also debunk the cognitive faculties used to formulate the argument.
      *   **Status:** Non-negotiable.
      *   **Consideration:** An argument that destroys the tools required to assess it is pragmatically self-refuting. The realist will reject any principle that threatens the reliability of her reasoning capacities generally.

  3.  **Dialectical Independence (The No-Begging Constraint)**
      *   **Requirement:** The argument must not presuppose the truth or falsity of the specific first-order moral judgments it aims to debunk. It cannot rely on the premise that "evolutionarily shaped judgments are false" unless that premise is justified independently of the moral conclusions it supports.
      *   **Status:** Non-negotiable.
      *   **Consideration:** To move the realist, the argument cannot assume the error theory it seeks to prove. It must rely on meta-ethical or epistemic premises the realist accepts, not on contested moral claims.

  4.  **Explanatory Connection (The Tracking Constraint)**
      *   **Requirement:** The argument must articulate the relationship between the evolutionary explanation and the moral facts. It must state whether the defeat arises from a lack of causal contact, a lack of explanatory connection, or the availability of a better alternative explanation that renders the moral facts otiose.
      *   **Status:** Non-negotiable.
      *   **Consideration:** Non-naturalists deny causal contact is necessary for knowledge. A "no causal contact" premise alone does no work. The argument must target the *explanatory* relevance of moral facts to the judgments.

  5.  **Target Specification (The Truth/Justification Distinction)**
      *   **Requirement:** The argument must specify whether it attacks the truth of moral judgments, the justification for holding them, or the rationality of continuing to hold them given the genealogy. It cannot slide between these categories.
      *   **Status:** Non-negotiable.
      *   **Consideration:** Undermining defeat (removing justification) is distinct from rebutting defeat (providing evidence of falsity). Conflating them obscures whether the realist is rationally compelled to abandon the belief or merely lacks a specific type of warrant.

  6.  **Level of Explanation (The Plasticity Constraint)**
      *   **Requirement:** The argument must address whether evolution selected for specific moral contents or a general capacity for normative plasticity. If the latter, the argument must explain how a content-neutral capacity generates specific unjustified outputs, or concede that the genealogy does not predict specific errors.
      *   **Status:** Negotiable.
      *   **Consideration:** If selection favored plasticity, the causal story explains the form of judgment but not the content. An adequate EDA must show why plasticity, constrained by local norms, leads to unreliability regarding stance-independent facts.

  7.  **Downstream Stability (The Reformer Constraint)**
      *   **Requirement:** The argument must account for the status of first-order moral discourse after the debunking. It must explain whether moral arguments (e.g., about hiring practices) retain normative force, become fictional, or are merely expressive. It must explain why the phenomenology of authority persists if the justification is removed.
      *   **Status:** Non-negotiable.
      *   **Consideration:** An argument that leaves the philosopher unable to engage in normative reasoning without contradiction fails to describe a livable position. The realist needs to know what remains of morality if the EDA succeeds.

  8.  **Self-Application (The Debunker's Norms)**
      *   **Requirement:** The argument must account for the status of the debunker's own normative claims (e.g., "we have reason to believe what is true"). If the EDA undermines normative reasons generally, it undermines the reason to accept the EDA.
      *   **Status:** Non-negotiable.
      *   **Consideration:** This is a specific instance of the Overgeneralization Constraint but applied to the normative domain specifically. The argument must preserve enough normativity to recommend itself.

  9.  **Distinction of Defeat Type (Undermining vs. Rebutting)**
      *   **Requirement:** The argument must clarify if it provides a defeater for the *basis* of the belief (undermining) or evidence against the *content* of the belief (rebutting).
      *   **Status:** Negotiable.
      *   **Consideration:** Undermining defeaters are easier to generate from genealogy but easier for the realist to block (by positing a pre-established harmony). Rebutting defeaters are harder to generate but harder to ignore.

  10. **Origin vs. Warrant (The Genetic Fallacy Guard)**
      *   **Requirement:** The argument must demonstrate why the origin of the capacity is relevant to the warrant for the token exercise. It must bridge the gap between "this judgment was caused by X" and "this judgment is unjustified."
      *   **Status:** Non-negotiable.
      *   **Consideration:** Mere causal history does not entail epistemic status. The argument must show that the causal history is *insensitive* to the truth in a way that matters for justification.

  11. **Modal Assumptions (The Supervenience Constraint)**
      *   **Requirement:** The argument must state its commitments regarding the modal status of moral facts. It must address whether moral facts are necessary, contingent, or supervenient, and how this affects the "no causal contact" premise.
      *   **Status:** Negotiable.
      *   **Consideration:** If moral facts are necessary, causal contact is impossible by definition. The argument must rely on explanatory rather than causal links to avoid category errors.

  12. **Empirical Fit (The Falsifiability Constraint)**
      *   **Requirement:** The argument must specify what empirical findings would disconfirm it (e.g., invariance of judgment across divergent selective pressures). It cannot be compatible with all possible empirical outcomes.
      *   **Status:** Negotiable.
      *   **Consideration:** An argument that is consistent with any empirical data is not an empirical argument. It must be vulnerable to findings in evolutionary psychology or anthropology.

  13. **Phenomenological Accuracy (The Feel of Obligation)**
      *   **Requirement:** The argument should account for why moral judgments present themselves as objectively authoritative even if they are evolutionarily shaped. It need not validate this feeling, but it should not treat it as a mere illusion without explaining its persistence.
      *   **Status:** Prejudice (of the Realist Camp).
      *   **Consideration:** While desirable for a complete theory, an EDA can be epistemically adequate without fully explaining the psychology of moral experience. This is secondary to the epistemic defeat.

  14. **Causal Contact Distinction (No Contact vs. No Tracking)**
      *   **Requirement:** The argument must distinguish between the claim that we have no causal access to moral facts and the claim that our beliefs do not track moral facts.
      *   **Status:** Non-negotiable.
      *   **Consideration:** Non-naturalists grant no causal contact. The EDA must argue for no tracking (insensitivity) to generate skepticism. Conflating the two renders the argument question-begging.

  15. **Conservatism (The Preservation Constraint)**
      *   **Requirement:** The argument should specify how much moral knowledge must be preserved to make the debunking intelligible. It cannot debunk the concepts used to formulate the debunking.
      *   **Status:** Negotiable.
      *   **Consideration:** Total error theory is a possible outcome, but a selective EDA must preserve enough conceptual stability to identify what is being debunked.

  ***

  ### Incompatibility Analysis

  Two pairs of desiderata create significant tension that threatens the joint satisfiability of the list.

  **1. Granularity (1) vs. Dialectical Independence (3)**
  *   **The Conflict:** To satisfy Granularity, the argument must discriminate between judgments that are debunked (e.g., out-group hostility) and those that are not (e.g., care for kin). To do this, it typically requires a standard of reliability. If that standard is evolutionary fitness, it fails to track moral truth (violating the Realist's view). If that standard is moral truth (e.g., "kin-care is true, hostility is false"), it violates Dialectical Independence by presupposing the moral knowledge it claims to undermine.
  *   **Verdict:** **Jointly Unsatisfiable** in a strict form. A selective EDA cannot identify *which* judgments are distorted without invoking some normative premise.
  *   **Revision:** Relax **Dialectical Independence (3)**. The argument should not presuppose the *specific* judgments under attack, but it may rely on *general* normative principles (e.g., "arbitrary distinctions are unjust") that are not the direct target of the debunking. The requirement should be amended to: "The argument must not presuppose the truth of the specific first-order judgments it aims to debunk, though it may rely on uncontested procedural norms."

  **2. Epistemic Safety (2) vs. Explanatory Connection (4)**
  *   **The Conflict:** To satisfy Epistemic Safety, the epistemic principle must be specific enough to spare logic and perception. To satisfy Explanatory Connection (and actually move the Realist), the principle must be general enough to cover the domain of normative facts. If the principle is "Beliefs formed without causal contact are unjustified," it saves morality (for the non-naturalist) but is ad hoc. If the principle is "Beliefs explained by non-truth-tracking causes are unjustified," it threatens logic and math (where evolutionary explanations are also available).
  *   **Verdict:** **Tense but Satisfiable** with qualification. The tension is resolved only if the argument can identify a disanalogy between moral faculties and logical/perceptual faculties regarding sensitivity to truth.
  *   **Revision:** Strengthen **Explanatory Connection (4)** to require a specific account of *why* moral faculties are less sensitive to truth than perceptual faculties, rather than relying on a blanket principle.

  ***

  ### Exclusion Analysis

  **Single Most Exclusionary Requirement:** **Dialectical Independence (3).**

  **Reasoning:** This requirement excludes the largest number of candidate arguments because most effective EDAs operate by highlighting a conflict between evolutionary explanations and specific moral intuitions (e.g., "Evolution explains why we think racism is okay, but racism is wrong"). To make the argument bite, proponents often implicitly rely on the falsity of the evolved judgment to demonstrate the unreliability of the faculty. Strict adherence to Independence forces the argument to rely solely on meta-ethical or epistemic premises, which significantly weakens the leverage against the Realist. Many "selective" debunking arguments collapse into question-begging when scrutinized under this constraint, as they cannot identify the distortion without a normative yardstick.

  ***

  ### Scoring of Argument Types

  | Argument Type | Granularity (1) | Epistemic Safety (2) | Independence (3) | Explanatory Connection (4) | Notes |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **(A) Coincidence Dilemma**<br>(Deny relation or accept coincidence) | **Fail.** Tends toward global skepticism; struggles to explain why some judgments survive. | **Pass.** Principles often general enough to threaten other domains. | **Pass.** Relies on meta-ethical probability, not moral premises. | **Pass.** Directly targets the tracking relation. | Strong on principle, weak on selectivity. Risks self-defeat via overgeneralization. |
  | **(B) Categorical Authority**<br>(Concept of wrongness is debunked) | **Pass.** Targets specific phenomenology of obligation. | **Pass.** Specific to normative concepts. | **Fail.** Presupposes conceptual analysis yields truth-conditions. | **Fail.** Focuses on semantics rather than causal etiology. | Moves the error theorist, not the realist. Begs the question on conceptual competence. |
  | **(C) Plain Genealogy**<br>(Lack of causal contact) | **Fail.** Indiscriminate; applies to all moral judgments equally. | **Fail.** If causal contact is required, perception is also threatened. | **Pass.** Purely causal claim. | **Fail.** Non-naturalists deny causal contact is required for knowledge. | Dialectically inert against the target. Fails to engage with non-naturalist modal commitments. |
