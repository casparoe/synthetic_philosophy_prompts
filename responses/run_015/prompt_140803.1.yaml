answer: |-
  The MFA faculty will argue you have emptied "propaganda" of its coercive meaning to make it fit your thesis, and your survival turns on conceding that aesthetic neutrality is itself a coercive political act rather than defending the precision of your terminology.

  ### **Objection 1: The Writers (MFA Faculty & Students)**
  **Likelihood:** Certain | **Damage:** Critical
  **The Objection:** "You're performing a semantic bait-and-switch. If 'art-for-art's-sake' is also propaganda because it assumes a sympathetic public, then the word loses its sting. You're telling us that trying to write beautifully without a political agenda is just another form of political agenda, which makes the term useless for distinguishing art from agitation."
  **The Reply (90 seconds):** "I am not trying to save the word 'propaganda' from its sting; I am trying to locate where the sting actually hides. We treat 'art-for-art's-sake' as neutral ground, but it only exists when a writer assumes the public already shares their premises—that their humanity is not up for debate. That assumption is a claim. When you write for a public that already agrees with you, you aren't escaping politics; you're enjoying the luxury of not being answered. My definition isn't designed to make everything propaganda; it's designed to show that neutrality is a posture available only to those whose freedom isn't contested. Du Bois knew that for a Black artist, neutrality is a lie. I'm arguing that even for you, it's a claim without answerability, and that makes it propaganda because it demands assent without risking refusal."
  **Softest Point:** You are asking them to accept that their cherished autonomy is actually a form of political coercion. This feels like an insult to their professional identity.

  ### **Objection 2: The Locke Scholar**
  **Likelihood:** High | **Damage:** High
  **The Objection:** "This is presentism. Du Bois was an instrumentalist. When he said 'propaganda,' he meant art that advances the cause of racial uplift and specific political goals. He wasn't talking about speech-act dynamics or 'answerability.' He wanted art to win an argument, not invite a dialogue. You're imposing a liberal dialogic ethic on a black nationalist framework that demanded results."
  **The Reply (90 seconds):** "You are right that Du Bois was an instrumentalist, and I am not claiming 'answerability' comes from his text—I claim it is the condition he omitted but required. Du Bois demanded art serve freedom, but if art merely instructs a public that cannot refuse, it becomes sermonizing, which fails to create the internal conviction freedom requires. Locke argued for aesthetic autonomy; Du Bois argued for political utility. I am arguing for political *efficacy*. A claim that cannot be refused creates compliance, not freedom. By adding 'answerability,' I am not softening Du Bois; I am tightening his criterion to ensure the art actually produces the free subjects he wanted, rather than just compliant audiences. I am updating the mechanism to save the goal."
  **Softest Point:** You admit you are adding a condition Du Bois didn't state. This concedes the historical exegesis is imperfect.

  ### **Objection 3: The Art Historian**
  **Likelihood:** Moderate | **Damage:** Moderate
  **The Objection:** "How does 'claim-bearing with answerability' differ from Bakhtin's dialogism or Rancière's distribution of the sensible? Propaganda studies usually focus on institutional intent and asymmetrical power. You're defining it as a structural relationship between text and reader, which ignores the material apparatus of propaganda."
  **The Reply (90 seconds):** "Bakhtin describes how language works; I am describing how power works. Dialogism is ontological; my condition is political. A work can be dialogic in language but monologic in power—if the stakes of refusal are too high, there is no answerability. Similarly, Rancière maps who is visible; I am asking what happens when the visible subject demands something the viewer is permitted to deny. Propaganda studies focus on the sender's intent, which lets the receiver off the hook. My definition shifts the locus to the relationship. If the public cannot refuse without social cost, it's coercion. If they can refuse but the work still demands an answer, it's propaganda. I'm not mapping the apparatus; I'm measuring the risk."
  **Softest Point:** You are distinguishing your terms from established theory without citing specific textual engagement with those theorists.

  ### **Objection 4: The Ethical Trap (Your Novel)**
  **Likelihood:** Moderate | **Damage:** High (Personal)
  **The Objection:** "In your novel, you withhold sympathy to indict the reader's demand for it. Isn't that manipulative? You're engineering a specific psychological response to make the reader feel guilty. That fits the crude definition of propaganda perfectly—using art to engineer consent."
  **The Reply (90 seconds):** "It is manipulative, but manipulation is not the opposite of art; it is the tool of narrative. The difference lies in answerability. A crude propaganda novel tells you who to hate and gives you no room to question why. My novel withholds sympathy to force you to ask why you demand it. It indicts the demand, not the object. If you refuse the indictment, the book allows that refusal; it doesn't punish you with a moralizing ending. The propaganda lies in the setup—that you expect sympathy—but the answerability lies in your realization that the expectation itself is the problem. I am not engineering consent; I am engineering a crisis of judgment that you are free to walk away from, though I hope you won't."
  **Softest Point:** Admitting manipulation undermines your distinction between "good" propaganda and "crude" propaganda.

  ---

  ### **Strategic Notes**

  **Where You Are Simply Wrong:**
  You are wrong to suggest Du Bois would endorse "answerability" (room to refuse). Du Bois's "Criteria" is urgent and instrumental; he wanted art to *secure* freedom, not invite debate about it. He believed the crisis was too severe for open-ended dialogue. You are correcting Du Bois with a contemporary liberal ethic, not interpreting his historical intent.

  **What to Concede Preemptively:**
  Open by stating clearly: "The condition of 'answerability' is not in Du Bois's text. It is my amendment. Du Bois demanded utility; I am arguing that without the risk of refusal, that utility becomes coercion." This disarms the Locke scholar before they stand up.

  **The Single Reply That Must Land:**
  The argument that **art-for-art's-sake is propaganda** (Objection 1). If the writers reject this, you lose the room. You must convince them that their "neutrality" is a privileged political stance, not an escape from politics.

  **The Question You Hope Nobody Asks:**
  "If withholding sympathy to indict the reader is your method, aren't you doing exactly what you criticize—using the reader's own psychology as a tool for your political end, regardless of their freedom to refuse?" (This collapses your distinction between your novel and the crude propaganda you critique.)
