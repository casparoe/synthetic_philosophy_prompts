answer: |-
  **MEMORANDUM**

  **TO:** Stratigraphic Nomenclature Committee
  **FROM:** Chair, Stratigraphic Nomenclature Committee
  **DATE:** October 24, 2025
  **SUBJECT:** Recommendation for the 2027 National Geological Time Scale: The Anthropocene

  **1. Purpose**

  This memo circulates my formal recommendation regarding the inclusion and definition of the Anthropocene in the 2027 revision of the National Geological Time Scale. As we approach the deadline, and given the likelihood that I will need to exercise the casting vote, it is incumbent upon me to state my position clearly. This allows the Committee to review the reasoning prior to the final meeting, ensuring our decision is grounded in our standing rules rather than procedural deadlock.

  **2. Recommendation**

  I recommend that the Committee formally adopt the **Anthropocene as a Series/Epoch**, with its base defined by the **mid-twentieth-century radionuclide signal (circa 1950 CE)**.

  This corresponds to Proposal 1 (Quaternary Mapping Group). It satisfies our three standing rules for admitting a new unit:
  1.  **Isochrony:** The plutonium-239 fallout horizon is the only marker among the proposals that is demonstrably synchronous across the national territory and globally correlatable within a sub-annual resolution.
  2.  **Reference Section:** We possess multiple accessible lake-core archives containing this signal that can be legally designated and protected as the National Stratotype.
  3.  **Utility:** Environmental regulations and mapping legends require discrete boundaries. A sharp horizon allows for unambiguous regulatory scope; a diffuse onset does not.

  **3. Rationale**

  Our remit is the maintenance of a chronostratigraphic scale, not a catalogue of human influence. While human activity has altered sedimentation rates, soil chemistry, and biodiversity for millennia, our rules require a *boundary*, not a *trend*.

  The agricultural signal (Proposal 2) is scientifically robust as evidence of human impact, but it is diachronous. Land clearance in the northern provinces predates wet-rice cultivation in the south by over a thousand years. To define a boundary based on the earliest local signal would render the time scale unusable for national correlation. To define it based on the global aggregate would require a boundary that does not exist in our local stratigraphy.

  Similarly, defining the Anthropocene as an "event" without a boundary (Proposal 3) is geologically honest but administratively inert. It fails the utility test. Our scale appears in environmental law; a "smeared" unit cannot support legal definitions of liability or scope.

  Therefore, the 1950 radionuclide horizon is the only option that adheres to the technical criteria of stratigraphy as we currently practice it.

  **4. The Strongest Counter-Argument**

  I am aware that this recommendation will be opposed, and I wish to articulate the strongest version of that opposition here, so that it enters the official record with full force.

  *The argument against this recommendation is that stratigraphy cannot be separated from historical narrative, and that choosing 1950 constitutes a political erasure of colonial responsibility.*

  By fixing the boundary at the industrial rupture of the mid-twentieth century, we risk validating a narrative that absolves earlier actors of geological agency. Our archives contain definitive evidence that colonial-era land transformation in the western provinces fundamentally altered hydrology and sedimentation regimes two centuries prior to the bomb pulse. To declare that the "Age of Humans" began in 1950 is to implicitly categorize those earlier transformations as "natural" or "pre-Anthropocene."

  Colleagues argue that this Committee does not have the neutrality to make this cut. By selecting the radionuclide signal, we are prioritizing a global, industrial marker over a local, colonial one. This choice may be stratigraphically clean, but it is historically sanitizing. It suggests that geology only recognizes human impact when it is technological and global, rendering invisible the slow violence of agricultural expansion and colonial land management that shaped this nation's physical terrain. If we adopt the 1950 boundary, we are not just drawing a line in the rock; we are issuing a verdict on who counts as a geological agent and who does not.

  **5. Rebuttal and Mitigation**

  I acknowledge the weight of this argument. However, I maintain that the Committee's mandate is to correlate *time*, not to adjudicate *culpability*.

  If we move the boundary back to the earliest agricultural signal to accommodate historical nuance, we break the isochrony rule and destroy the utility of the map. If we refuse to draw a line to avoid political implication, we cede our regulatory role.

  To mitigate the risk of historical erasure without compromising stratigraphic integrity, I propose the following: The 2027 revision will include the 1950 boundary *and* a companion "Statement on Human Signals." This statement will explicitly recognize the diachronous nature of human impact, citing the colonial-era transformations as significant lithostratigraphic events that predate the chronostratigraphic boundary. We can validate the science of the soil scientists without forcing their data into a chronostratigraphic box it does not fit.

  **6. Concrete Commitments (2025–2030)**

  Should the Committee accept this recommendation, I commit the Survey to the following actions:

  *   **Curation of Reference Section:** Within 18 months, we will designate the primary reference core (the "National Stratotype") from our existing lake-core archive. We will secure legal protection for the site and ensure open access for verification.
  *   **Revision Procedure:** We will insert a "Sunset Clause" into the 2027 documentation. Should the International Commission on Stratigraphy (ICS) formally ratify a different definition or reject the epoch status entirely within the next decade, the National Survey will trigger an expedited review to align with the international standard, preserving our unwritten fourth rule.
  *   **Curriculum and Regulatory Guidance:** We will issue joint guidance to the National Curriculum Office and the Environmental Protection Agency. This guidance will clarify that while the *formal unit* begins in 1950, the *processes* associated with human impact are recognized as beginning earlier. Textbooks should teach the 1950 boundary as a tool for correlation, not as the moment humans first altered the earth.

  **7. Conclusion**

  This decision is not a denial of the earlier evidence, but a adherence to the specific function of a time scale. We must produce a map that works for the geologist in the field and the regulator in the office. We can, and must, honor the complexity of our history in our publications, but we cannot encode that complexity into a boundary that must, by definition, be a line.

  I look forward to discussing this reasoning at our next session.

  **[Signature]**

  **Chair, Stratigraphic Nomenclature Committee**
