answer: |-
  # ADVERSARIAL COLLABORATION PROTOCOL: TEMPORAL STRUCTURE OF PHENOMENAL CONSCIOUSNESS

  **Signatories:** 
  *   **Proponent A (Multiple Drafts/MD):** Defends the view that there is no single finish line for conscious content; consciousness is a functional status of availability for control/report.
  *   **Proponent B (Temporal Determinacy/TD):** Defends the view that there is a fact of the matter regarding when content becomes conscious and that experience possesses a determinate, unified structure at a time.

  **Facilitator Stipulations:** 
  This document adheres to two binding constraints to ensure substantive progress:
  1.  **Tripartite Separation:** The dispute is analyzed across three distinct sub-questions: (Q1) Temporal Determinacy, (Q2) Phenomenal Unity, and (Q3) Temporal Grain. The parties must specify if their positions on these are logically independent.
  2.  **Hypothetical Measurement:** We assume the existence of **High-Fidelity Phenomenal Decoding (HFPD)**. This technique reads neural states in visual cortex (V4/IT) to infer content (e.g., "Red") with a temporal resolution of ±5ms. Both parties must agree on what an HFPD result signifies for their respective theories.

  ---

  ## I. AGREED CLAIMS

  1.  **The Color-Phi Data:** Both parties accept the standard Color-Phi phenomenon as a fixed datum. A red dot is flashed at Location 1 ($t_1$), followed by a green dot at Location 2 ($t_2$). Subjects report a single dot moving from 1 to 2, changing color mid-path. Both parties agree: (a) No physical object moved or changed color mid-path; (b) The subject's report is sincere and accurate regarding their *seeming*; (c) The neural processing of the second stimulus ($t_2$) is causally necessary for the experience of the motion/color-change that seems to occur before $t_2$.
  2.  **The No-Homunculus Constraint:** Both parties reject the Cartesian Theater. Neither posits a "little man" inside the head viewing a screen. TD asserts that "unity" and "determinacy" are structural features of the phenomenal field itself, not features of a relation between a field and an observer. MD asserts that "availability" is a relation between subsystems, not a presentation to a self.
  3.  **Introspective Authority:** Introspective reports are data, not infallible truths. A subject's claim that "I saw it change color mid-path" is a report on the *content* of their experience, but their claim about the *timing* or *metaphysical structure* of that experience (e.g., "It happened at exactly 200ms") is theory-laden and fallible.
  4.  **Methodological Stipulation (HFPD):** For the purpose of this collaboration, we assume HFPD can determine whether the neural substrate sufficient for the content "Red" is active at time $t$. 
      *   **MD Commitment:** If HFPD indicates "Red" at $t$, this settles when the *draft* containing "Red" is neurally realized and available for specific probes. It does **not** settle when the content becomes "conscious" simpliciter, because there is no unique time of "becoming conscious" beyond specific availability for specific tasks.
      *   **TD Commitment:** If HFPD indicates "Red" at $t$, this is strong evidence for when the experience occurs. However, TD would be falsified if HFPD showed **temporal fragmentation** incompatible with unity (see Table, Row 2) or if HFPD showed **indeterminacy** where phenomenology is determinate.

  5.  **Logical Independence of Sub-Questions:** The parties acknowledge that Q1, Q2, and Q3 are logically distinct. 
      *   One could theoretically hold that experience is **Determinate (Q1)** but **Fragmented (Q2)** (e.g., separate clocks for color and motion).
      *   One could hold that experience is **Unified (Q2)** but **Grainy/Windowed (Q3)** (e.g., a unified 100ms block).
      *   **MD Position:** Denies Q1 (No determinate time), treats Q2 as a post-hoc narrative unity, treats Q3 as variable depending on the task.
      *   **TD Position:** Affirms Q1 (There is a fact of the matter), Affirms Q2 (Experience is unified at $t$), Affirms Q3 (Experience has a specious present/window, but the *content* of that window is determinate).

  ---

  ## II. DISAGREEMENTS TABLE

  | Crux | MD Phrasing (Multiple Drafts) | TD Phrasing (Temporal Determinacy) | Shared Test / Hypothetical Case | MD Prediction | TD Prediction | Falsification Condition |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. Temporal Determinacy (Q1)**<br>*(Is there a fact of the matter when content C becomes conscious?)* | There is no fact of the matter beyond the fact of the matter about when content is available for specific reports or controls. "Consciousness" is not a single event. | There is a determinate time (or narrow window) at which content C enters the phenomenal field, distinct from the time it becomes available for arbitrary motor reports. | **The Staggered Probe:** Subject sees a brief stimulus. At $t+100ms$, Probe A asks for color. At $t+150ms$, Probe B asks for orientation. HFPD tracks neural content. | If Probe A succeeds at 100ms and Probe B at 150ms, both contents were "conscious" at their respective availability times. There is no single time $t^*$ where *both* became conscious together. | There is a time $t^*$ (e.g., 120ms) where both contents entered experience, even if motor access for orientation was delayed until 150ms. | **MD:** If a single neural event is found that is *necessary and sufficient* for all possible reports, MD concedes a "finish line" exists.<br>**TD:** If HFPD shows content is available for report but HFPD confirms *no* unified phenomenal state exists at that time, TD is falsified. |
  | **2. Phenomenal Unity (Q2)**<br>*(Is experience at $t$ unified across modalities/features?)* | Unity is a feature of the *narrative* constructed after the fact. At the level of processing, color, motion, and sound are on different timelines (Drafts). | Unity is a primitive feature of the phenomenal field. If I see red and hear a tone, there is a fact of the matter that they are experienced *together*. | **The Color-Phi Case:** The experience of motion and color change seems to occur *before* the second flash physically happens. | The "motion" draft and the "color" draft are edited together retrospectively. The unity is a memory effect, not a simultaneous presentation. | The brain constructs a model that preserves the *phenomenal unity* of the motion path. The experience is unified, even if the neural causes are retroactive. | **MD:** If subjects can report on the *disunity* of features in real-time (e.g., "I saw the color before I saw the motion" within the same window).<br>**TD:** If HFPD shows that the neural correlates for color and motion are never active simultaneously during the reported unified experience. |
  | **3. The HFPD Result (Measurement)**<br>*(Does HFPD settle the existence of conscious content at $t$?)* | HFPD settles when a content is *discriminable* by the system. It does not settle "consciousness" because that implies a further fact HFPD cannot measure. | HFPD tracks the NCC (Neural Correlate of Consciousness). If HFPD says "Red at $t$", then (barring error) the subject had an experience of red at $t$. | **The Null Result:** HFPD shows no determinate "Red" state at any specific millisecond during the Color-Phi illusion, only a smeared transition. | **Consistent.** This confirms there is no fact of the matter. The "Red" was a fiction of the narrative draft. | **Problematic.** If phenomenology is determinate ("It looked red mid-path"), there must be a determinate neural state. A smeared HFPD result suggests the NCC is not localized in time. | **MD:** N/A (MD expects indeterminacy).<br>**TD:** If HFPD consistently fails to find a determinate state corresponding to a determinate report, TD must abandon the claim that experience is temporally determinate. |

  ---

  ## III. ANALYSIS OF SUBSTANTIVE VS. VERBAL DISPUTE

  **1. The Status of "Consciousness" (Substantive)**
  The core disagreement is not merely verbal. It concerns the ontology of mental states. 
  *   **MD** treats "conscious" as a *functional predicate* (like "digestible"). Something is conscious relative to a subsystem's ability to use it. 
  *   **TD** treats "conscious" as a *state type* (like "flammable"). Something is conscious if it instantiates a specific phenomenal structure, regardless of immediate utility.
  *   **Why it matters:** If MD is right, asking "When did it become conscious?" is a category error, like asking "When did the soup become digestible?" (It depends on the eater). If TD is right, the question has a true answer independent of the eater's subsequent actions. The HFPD stipulation forces this out: MD says HFPD measures *availability*; TD says HFPD measures *occurrence*.

  **2. The Meaning of "Determinate Fact" (Substantive)**
  *   **MD** operates with a verificationist lean: A fact about consciousness must be cashed out in terms of observable dispositions (reports, neural availability). If two scenarios differ only in "when the light turned on" but yield identical dispositions/neural traces, there is no fact of the matter.
  *   **TD** operates with a realist lean: The phenomenal field has intrinsic properties. Two scenarios could theoretically differ in their phenomenal timing even if behavioral outputs are identical (e.g., in cases of masked priming or subtle latency shifts).
  *   **Resolution Path:** The dispute is substantive because it dictates how we interpret the HFPD data. MD interprets a smeared HFPD signal as *proof* of indeterminacy. TD interprets a smeared HFPD signal as *measurement error* or a challenge to find the precise NCC, because the phenomenology *feels* determinate.

  **3. "Unity" and "Time" (Partially Verbal)**
  There is a risk of verbal slippage regarding "at a time." 
  *   If TD means "at a mathematical instant," MD is correct to reject this as physically impossible given neural latency. 
  *   If TD means "within a specious present window (e.g., 100ms)," MD might agree that a draft can cover that window. 
  *   **Residual Disagreement:** Even granting a 100ms window, MD denies there is a fact about *how* the content is arranged within that window until a query is made. TD insists the arrangement is fixed within the window. This remains substantive: it is a disagreement about whether the *structure* of experience exists prior to *access*.

  **Conclusion for the Reading Group:**
  The parties agree on the data (Color-Phi, neural latency) and the negative thesis (No Homunculus). They disagree on whether the *phenomenal structure* (unity, timing) supervenes on *dispositional availability* (MD) or constitutes a *distinct ontological layer* that availability merely tracks (TD). Future sessions should focus on Row 3 of the table: If HFPD returns a "smeared" result, does that vindicate MD's claim that there is no fact of the matter, or does it merely challenge TD to refine the NCC search? That is the empirical crux.
