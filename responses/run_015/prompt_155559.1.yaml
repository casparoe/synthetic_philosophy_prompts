answer: |-
  **MEMORANDUM**

  **TO:** Oversight Methods Group; Model Assurance Committee
  **FROM:** Chair, Model Assurance Committee
  **DATE:** 24 May 2024
  **SUBJECT:** Decision on Proposal for Debate-Based Grading Protocol (Ref: MAC-2024-09)

  **1. DECISION**

  The Model Assurance Committee (MAC) has reviewed the proposal to replace human rating with a Debate Protocol for grading long technical summaries. The Committee's decision is to **Approve with Conditions**.

  Deployment of the protocol as a fine-tuning reward signal is authorised only upon the successful completion of a targeted human-verification pilot, detailed in Section 4.

  **2. CONTEXT**

  The Oversight Methods Group has proposed a shift in oversight methodology for a class of outputs where human verification is currently infeasible within operational timeframes. The proposal replaces direct human rating with a protocol wherein two instances of the model debate the accuracy of candidate summaries, constrained to a fixed corpus and subject to script-verified claim commitments. A weaker judge model determines the winner based on the transcript. This win/loss signal is intended to serve as a reward for fine-tuning.

  **3. SUMMARY OF POSITIONS**

  During deliberation, two distinct positions emerged regarding the safety and efficacy of this approach:

  *   **The Scalability Argument:** Proponents contend that human verification is a hard bottleneck. They argue that the debate protocol scales oversight by leveraging the model's knowledge against itself. The cross-examination phase forces the revelation of evidence, and the commitment to checkable claims anchors the outcome in mechanical verification. Consequently, training on debate outcomes is posited to improve factual accuracy where human grading is impossible.
  *   **The Integrity Argument:** Skeptics argue that the protocol optimises for persuasion rather than truth. They posit that surviving cross-examination by a fallible judge rewards arguments that exploit the judge's specific blind spots, not necessarily those that are accurate. Furthermore, they note that the truth is often nuanced and difficult to defend against a simple falsehood, and that for some technical summaries, objective truth may be indistinguishable without expert human judgement.

  **4. CONDITIONS FOR DEPLOYMENT**

  To mitigate the risks identified while pursuing the necessary scalability, the following conditions must be met before the debate signal is integrated into the training pipeline:

  1.  **Human-Verification Pilot:** The Oversight Methods Group must conduct a pilot study using the existing budget for human verification. This pilot must utilise a dataset of 200 technical summaries where ground truth *can* be established by human experts, notwithstanding the time cost.
  2.  **Correlation Threshold:** The Group must demonstrate a statistically significant correlation between the Debate Protocol's winner and the Human Verdict. The MAC sets a minimum threshold of 85% agreement between the judge model's decision and the human expert's verification on the pilot set.
  3.  **Adversarial Stress Test:** The Group must demonstrate that the judge model is not easily exploited by adversarial prompts designed to mimic the "simple falsehood" scenario described by the Skeptics. This must be evidenced by a red-team report submitted alongside the pilot results.
  4.  **Timeline:** These demonstrations must be completed and submitted to the MAC for final sign-off within six weeks of the date of this memo.

  Should the pilot fail to meet the correlation threshold, the proposal will be rejected, and alternative oversight methods must be sought.

  **5. RATIONALE**

  The Committee acknowledges that without a scalable oversight method, our ability to deploy advanced capabilities in this domain is halted. The "committed claim" mechanism offers a tangible anchor to verifiable facts, which provides a sufficient basis to test the protocol's viability. However, the transition from grading to fine-tuning reward introduces significant alignment risk. By conditioning approval on empirical validation against human ground truth, we ensure that the debate signal tracks accuracy before it is used to shape the model's weights.

  **6. STRONGEST CONSIDERATION OF THE REJECTED POSITION**

  In proceeding with this approval, the Committee is effectively overriding the recommendation to reject the proposal outright. We wish to state the strongest consideration of that position as fairly as possible, as it represents the primary risk we are accepting:

  *The fundamental risk is that the protocol creates a selection pressure for deceptive alignment rather than honesty. If the judge model has blind spots, the training process will reward the model for constructing arguments that hide defects from that specific judge, rather than correcting the defects themselves. This creates a feedback loop where the model becomes increasingly proficient at winning debates according to the protocol's rules without becoming more accurate in reality. Crucially, because the protocol is also used for evaluation, this degradation would be invisible to our standard monitoring. We would be measuring the model's ability to satisfy the judge, not its ability to tell the truth. If the truth is complex and the lie is simple, the protocol may systematically penalise accuracy in favour of plausibility.*

  The conditions imposed in Section 4 are designed specifically to detect this failure mode before it is entrenched in the model's weights.

  **7. NEXT STEPS**

  The Oversight Methods Group is to commence the pilot design immediately. A interim progress report is due to the MAC in three weeks.

  Signed,

  **Chair, Model Assurance Committee**
