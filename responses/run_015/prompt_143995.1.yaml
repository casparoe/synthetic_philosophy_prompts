  Write a parody internal memorandum—approximately 500 words, deadpan bureaucratic tone, with numbered sections and an embedded sample form—from a fictional “Office of Mnemonic Equity” to a municipal heritage board. The memo proposes a standardized “Commemorative Impact Assessment” for all statues and street names, and its satire should target the failure, common in removal and renaming debates, to distinguish “retrospective honor” (the intent behind the original naming) from “prospective endorsement” (the moral signal sent by retaining the name today). To keep the concept sharp rather than generic, construct the assessment around an invented metric, the “Contamination Coefficient,” which attempts to quantify how severely a figure’s now-objectionable views “taint” their otherwise laudable achievements, and show the bureaucracy applying it to a hypothetical street named after a 19th-century reformer who also championed policies now widely rejected. The form’s fields should include items such as “Degree of Historical Context Available,” “Present-Moral Risk Rating,” and “Remediation Option C: Contextual Plaque with Apologetic Footnote.” Maintain total deadpan seriousness throughout; the irony should be sustained and legible without any authorial wink. The piece should be readable without specialist knowledge, but should reward familiarity with the real tensions between presentism, moral progress, and collective memory. Do not include citations, reading lists, or references to living individuals.
