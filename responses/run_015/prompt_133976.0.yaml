answer: |-
  **Brainstorming Notes: Democracy & Institutional Fallibilism**

  *   **Tension 1: Aggregation vs. Intelligence.**
      *   *Preference Aggregation:* Democracy = counting votes. Stable, clear authority, but static. Assumes preferences are fixed. Good for protecting rights, bad for solving complex adaptive problems (like learning).
      *   *Cooperative Intelligence (Dewey):* Democracy = shared inquiry. Preferences are formed *through* discussion. Institutions are tools to facilitate growth, not temples to preserve truth. Requires flexibility, which looks like instability to traditionalists.
  *   **Tension 2: Disciplinary Authority vs. Experimentalism.**
      *   Faculty view: Curriculum is derived from the structure of knowledge (Physics *must* be taught this way). Authority is epistemic.
      *   Proposal view: Curriculum is a hypothesis about student development. Authority is consequentialist (does it work?).
      *   *Dewey's Take:* Rules are working hypotheses, not divine commands. But—crucially—experimentation isn't random guessing. It requires expert design. Faculty expertise is necessary *for* the experiment, not opposed to it.
  *   **The Pivot:** The proposal fails if it suggests students vote on *content*. It succeeds if it tests *integration structures* (how disciplines connect) while leaving disciplinary content to faculty. The pilot isn't testing "is history valid?" it's testing "does this sequence of history + science courses produce better civic reasoning?"

  ***

  **MEMORANDUM**

  **TO:** General Education Reform Board
  **FROM:** Dr. Aris Thorne, Vice Provost for Academic Affairs
  **DATE:** October 24, 2023
  **SUBJECT:** Decision on Gen-Ed Pilot Proposal (Experimental Track Model)

  **Decision:** Approve with Conditions

  **Background**
  This board faces a deadline next Thursday to decide on the proposed six-year pilot program for General Education reform. The proposal suggests replacing the standard fixed curriculum with three parallel tracks, treated as institutional hypotheses to be tested via data and deliberative forums. The Faculty Senate has formally objected, arguing this model conflates governance with epistemic inquiry and undermines disciplinary authority by treating curriculum as a "lab experiment."

  **Rationale**
  I have reviewed the opposition's concerns alongside the philosophical framework underpinning the proposal. The Faculty Senate is correct on one critical point: curricular authority cannot be reduced to mere preference aggregation. If this pilot implies that disciplinary rigor is subject to student satisfaction surveys or majority vote, it must be rejected. Academic freedom and epistemic authority reside in the faculty.

  However, the opposition's claim that institutional structures are immune to experimental revision is untenable. A fixed ten-year curriculum is not a safeguard of truth; it is simply an unmeasured hypothesis. Dewey's experimentalism does not demand we discard expertise, but that we treat our institutional arrangements as fallible tools. The question is not whether we experiment—we always are—but whether we do so blindly or with intentional data collection.

  Therefore, this board approves the pilot, but only under conditions that distinguish between *curricular content* (faculty domain) and *curricular architecture* (institutional domain). We are testing structures of integration and delivery, not the validity of disciplines themselves.

  **Conditions of Approval**
  1.  **Content Sovereignty:** Within each pilot track, the specific course content and learning objectives remain under the sole authority of the relevant departmental faculties. The pilot cannot mandate changes to *what* is taught within a discipline, only *how* courses are sequenced or integrated.
  2.  **Deliberative Scope:** Student/staff forums will advise on student experience and logistical barriers. They do not have voting rights on academic standards or degree requirements.
  3.  **Data Transparency:** All assessment data must be made available to the Faculty Senate Curriculum Commitee annually.

  **Implementation Timeline**

  *   **Year 1 (Setup & Baseline):** Finalize design of the three tracks. Faculty lead working groups to map learning outcomes. No students enrolled in pilot tracks yet. Baseline data collected from current gen-ed model.
  *   **Year 2-3 (Initial Run):** First cohort enters pilot tracks. Mid-point review at end of Year 3 focused on retention and student engagement metrics.
  *   **Year 4 (Major Review):** Comprehensive external review. Faculty Senate has veto power to halt any track showing significant degradation in disciplinary rigor.
  *   **Year 6 (Sunset/Scale):** Pilot expires automatically. Board must vote to either adopt one track as the new standard, extend the pilot, or revert to the previous model. No automatic renewal.

  **Bottom Line**
  This approach respects faculty expertise while acknowledging that our current governance model lacks a feedback loop for institutional learning. We are not turning the university into a laboratory at the expense of scholarship; we are applying scholarly methods to our own administration. If the faculty believes their authority is threatened by measuring outcomes, that is a concern we must address through the review process, not by refusing to look at the data.

  Please recieve this decision as final pending the formal vote on Thursday.

  Aris Thorne
  Vice Provost
