          *   *Conflict:* CNG usually says truth doesn't matter (like Case 2). Why is this different? *Difference:* Agency/Authorship. In Case 2, the brain generates the confabulation internally. In Case 3, it's imposed externally.
          *   *Repair:* The CNG must be *generated* by the system, not just *installed*.

