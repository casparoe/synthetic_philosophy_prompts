          *   *Repair:* *Veto Power/Integration.* The App user can reject the story tomorrow. The Compound Kid likely cannot (conditioning). The CNG requires the *ability to revise* the narrative.

      *   *Case 8: Memory Graft.*
          *   CNG Verdict: Contamination. The CNG absorbs new data. If it integrates seamlessly, it's one self with false memories. If it feels alien, it's a glitch.
