prompt: |-
  You are an expert in 19th-century philosophy of history and in pedagogical design for interdisciplinary graduate audiences. Before outlining the lesson, do a brief internal brainstorm: identify the three conceptual dependencies that must be secured before a student can understand why each mode becomes a “disadvantage” rather than merely a style of inquiry.

  I am a PhD student in comparative literature running a single ninety-minute session for a reading group of fellow literature graduate students with no background in philosophy. We are working through Nietzsche’s essay on the uses and disadvantages of history for life. Do not explain the essay to me; plan how I should explain it.

  The session must build toward a specific framing I want to inject: treating an unselective, total digital archive—something analogous to the training corpus of a large language model—as a pathological extreme of antiquarian history, one that preserves everything and therefore lacks both monumental aspiration and critical destruction. This analogy must come only after the triad is secure on its own terms; do not let it drive the sequence.

  Plan the explanatory arc with the following elements:

  1. Order of introduction: specify which of the three modes (monumental, antiquarian, critical) must come first, second, and third, with the dependency reason for each step—especially why the “service to life” criterion must precede the taxonomy, and why critical history must be taught only after the other two are in place.

  2. The carrying example: propose one concrete scenario that can illustrate all three modes without collapsing them. Do not use the French Revolution, the Roman Empire, or any “great man” biography. The example should have enough texture that students can see preservation, emulation, and destructive judgment operating on the same object. State what the example must include and what it must lack, and why it outperforms the cliché alternatives.

  3. Misconception map: identify the three misconceptions these students will likely form—my guesses are (a) that monumental history is mere “hero worship,” (b) that antiquarian history is harmless nostalgia, and (c) that critical history is only “being cynical about the past”—and specify exactly where in the sequence I should head each one off, with one sentence I can use to defuse it.

  4. Check for understanding: design one question for the final ten minutes that reveals whether they have grasped the structural point—that each mode becomes a disadvantage precisely when isolated from the others—rather than just recalling the three labels.

  5. What to leave out: tell me explicitly which aspect of Nietzsche’s argument I should name but refuse to unfold at this level (for instance, its place within the larger essay series, its philological context, or its relation to his later genealogical method), and provide the polite phrase I should use to close that door.

  Keep the plan focused. Do not provide a bibliography, reading list, or citations. Think step-by-step, and present the deliverable as a structured teaching plan rather than an essay.
