  **Rule:** The Cost Rule.

  **Reasoning:** Your supervisor's project is to argue *against* logical omniscience, so she needs a principle that limits closure. Case 5 is the key boundary marker: unperformed inference counts as knowledge only when it is "cheap" (six steps, one minute). Dana's task requires a "better part of a day" of manual aggregation. That crosses the threshold from "trivial cognitive access" to "significant labor." While the Content Rule says "however long," that interpretation struggles to explain why a 300-line proof (Case 2) was a NO; while the unknown lemma was a major factor, the length likely contributed. Ruling YES on Dana would concede that agents know all logical conjunctions of their beliefs, which undermines her paper's thesis. The Cost Rule best explains the gradient from Case 1 (instant) to Case 5 (one minute) to Dana (one day).

  **Distinguishing Case:** To definitively separate the Cost Rule from the Content Rule, present this case: *"She knows the axioms. Q has a 300-line proof that uses **only** concepts and lemmas she has already studied, but she has never seen this specific proof."*

  *   **Why:** This isolates computational length from conceptual gaps.
  *   **If she rules YES:** The Content Rule wins (length doesn't matter if concepts are known).
  *   **If she rules NO:** The Cost Rule wins (length/effort blocks knowledge even with known concepts).

  The "five vs. 5,000 readings" variation tests the threshold of the Cost Rule, but the 300-line known proof tests the *principle* itself against the Content Rule.
