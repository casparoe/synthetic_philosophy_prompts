answer: |-
  **Title:** Beyond Capacity: The Case for Occurrent Rational Engagement in Valid Consent

  **Abstract:** *The standard account of decision-making competence in bioethics and law is largely dispositional. It asks whether an agent possesses the general capacities to understand, appreciate, and communicate. This paper argues that dispositional competence is necessary but insufficient for valid consent. I defend a threshold of "occurrent rational engagement," requiring that the agent actually weigh relevant considerations in a minimally coherent way at the moment of authorization. This shift protects the substantive value of autonomy against temporary cognitive hijacking via intoxication, affective overwhelm, or undue pressure.*

  ---

  ### I. Introduction: The Dispositional Gap

  In contemporary moral and legal philosophy, the validity of consent is typically predicated on the agent's competence. The dominant framework, derived from the work of Appelbaum, Grisso, and Faden and Beauchamp, defines competence dispositionally. An agent is competent if they possess the *capacity* to: (1) understand the relevant information, (2) appreciate the situation and its consequences, (3) reason about treatment options, and (4) communicate a choice.

  This standard is primarily status-oriented. It assesses the *hardware* of the agent's agency rather than the *software* running at the specific moment of decision. My thesis is that this creates a normative gap. A person may possess the general capacity for rational agency (dispositional competence) while failing to exercise it at the critical moment (occurrent competence). Valid consent is an illocutionary act of authorization; for that authorization to be morally transformative, it must issue from an active process of self-governance. Therefore, the standard for competence must be raised to require **occurrent rational engagement**: the actual holding in mind and minimally coherent weighing of relevant considerations at the moment of decision.

  ### II. The Deficiency of Purely Dispositional Accounts

  The primary failure of the dispositional account is that it conflates the *potential* for autonomy with the *exercise* of autonomy.

  Consider the case of a "functioning alcoholic" who, by clinical metrics, retains the cognitive capacity to understand risks and consequences. However, at a specific moment, their craving creates a cognitive tunnel vision that excludes all long-term consequences from their working memory. Under the standard account, if they can recite the risks back to you, they are competent. Under the occurrent account, they are not, because the relevant considerations are not being *weighed*; they are being systematically excluded by the physiology of addiction.

  The dispositional view treats consent as a badge of status ("I am a competent adult"). The occurrent view treats consent as a performance of agency ("I am governing this interaction now"). If consent is the mechanism by which we waive rights or invite otherwise impermissible touch, the moral weight of that transaction depends on the agent actually standing behind the decision. If the cognitive machinery is present but idling, or if it is being operated by a temporary impairment (like acute rage or severe intoxication), the "self" that usually governs the body is not the one authorizing the act. To treat such consent as valid is to prioritize the *form* of autonomy over its *substance*.

  ### III. The Argument for Occurrent Rational Engagement

  The argument for requiring occurrent weighing rests on the nature of moral authority.

  1.  **Premise 1:** Consent is valid only if it constitutes an exercise of personal autonomy (self-governance).
  2.  **Premise 2:** Self-governance requires not merely the capacity to reason, but the actual engagement of reasoning processes regarding the specific decision at hand.
  3.  **Premise 3:** Severe intoxication, overwhelming emotion, and acute undue pressure can suspend actual reasoning processes even in agents with general capacity.
  4.  **Conclusion:** Therefore, agents under such conditions fail the competence requirement for valid consent, even if they possess general capacity.

  This view aligns with a Razian conception of autonomy, which views autonomy as a capacity that must be exercised under conditions that allow for meaningful options and mental freedom. When an agent is in the grip of a "hot state" (e.g., panic, euphoria, intoxication), their preference formation is disconnected from their normative commitments. They are not choosing what they value; they are reacting to what they feel. Valid consent requires a bridge between the immediate choice and the agent's broader web of beliefs and values. That bridge is built by the act of weighing considerations. If the bridge is not being built at the moment of crossing, the agent is not truly crossing; they are falling.

  ### IV. Addressing the Hard Cases

  Applying this standard yields counterintuitive but morally robust results in three key areas:

  1.  **Intoxication:** The law often uses arbitrary Blood Alcohol Concentration (BAC) limits. The occurrent account focuses on functional impairment. A person with a high tolerance may have a high BAC but retain occurrent competence. Conversely, a lightweight drinker may be dispositionally competent but occurrently incompetent because alcohol has inhibited the prefrontal cortex's ability to weigh long-term consequences against immediate gratification. The focus shifts from *how much* they drank to *whether they are weighing*.
  2.  **Emotional Overwhelm:** In cases of grief, terror, or romantic infatuation, agents often consent to things they would otherwise reject. The standard view dismisses this as "voluntary but regrettable." The occurrent view recognizes that acute emotion can narrow the cognitive horizon so severely that the "weighing" condition is not met. If fear crowds out all considerations except "make it stop," consent given to end the fear is not an exercise of autonomy.
  3.  **Time Pressure:** "Sign now or the offer expires in 30 seconds." The standard view says you are free to say no. The occurrent view notes that valid weighing requires time. If the temporal window is too narrow to allow the relevant considerations to be brought to mind and processed, the competence condition is failed.

  ### V. Objections and Responses

  **Objection 1: The Paternalism Objection**
  *Critique:* This standard is excessively paternalistic. It disrespects the agent's authority over their own body by second-guessing their decision-making process in real-time. It risks treating adults like children who must prove they are "thinking hard enough" to be allowed to act.

  *Response:* This objection misunderstands the goal of competence requirements. They are not designed to ensure *good* decisions, but *authorized* ones. Paternalism overrides a valid choice to protect the agent's welfare. My proposal does not override a valid choice; it identifies that no valid choice was made. If the cognitive process required to generate moral authority was absent, there is no choice to respect. Protecting the integrity of the consent mechanism is not paternalism; it is a precondition for non-paternalistic interaction. We are respecting the agent's *deep autonomy* (their capacity for self-governance) over their *surface impulse*.

  **Objection 2: The Epistemic Objection**
  *Critique:* Dispositional competence is hard enough to assess. Occurrent competence is epistemically opaque. How can a surgeon, a lover, or a contractor know what is happening in another person's mind at the exact moment of agreement? This standard creates impossible burdens for the consent-seeker.

  *Response:* It is true that we lack direct access to others' mental states. However, we already navigate this problem in law and ethics. We infer intoxication from slurred speech and gait; we infer coercion from context. The occurrent standard does not require mind-reading; it requires attentiveness to behavioral proxies of reasoning. Does the agent ask questions? Do they hesitate? Do their answers align with previous expressed values? Furthermore, the burden of uncertainty should lie with the party seeking to change the normative status quo (the consent-seeker). If it is unclear whether the agent is occurrently competent, the default must be non-interaction. This is a feature, not a bug; it incentivizes consent-seekers to ensure the environment is conducive to actual reasoning.

  **Objection 3: The "Normal Fluctuation" Objection**
  *Critique:* Human reasoning is never perfect. We all make impulsive, emotional, or hurried decisions. If we require "minimally coherent weighing," do we invalidate all spontaneous consent? This leads to absurdity, where spur-of-the-moment sexual encounters or impulse purchases are deemed non-consensual.

  *Response:* This objection conflates *speed* with *incoherence*. The standard is not "optimal rationality" or "deliberative slowness." It is "minimally coherent weighing." An impulsive decision can still involve a rapid but functional alignment of desire and action. A person can quickly weigh "I want this" against "Is this safe?" in seconds.
  The threshold is crossed only when the influencing factor (emotion, pressure, substance) *displaces* the weighing mechanism entirely. In the case of spontaneous sex, if both parties are communicating desire and checking boundaries, weighing is occurring. In the case of a panic-induced agreement, the "weighing" is bypassed by a reflex to escape. The distinction lies between *fast processing* (valid) and *process failure* (invalid). We must calibrate the threshold to exclude only those cases where the agent is effectively a passenger in their own decision.

  ### VI. Conclusion

  The standard dispositional account of competence protects the *status* of the agent but leaves the *act* of consent vulnerable to exploitation. By shifting the focus to occurrent rational engagement, we align the legal and ethical standards of consent with the moral reality of autonomy. Autonomy is not a static property one possesses; it is a dynamic activity one performs.

  Requiring that agents actually weigh relevant considerations at the moment of decision does raise the bar. It complicates transactions and demands more of consent-seekers. But this friction is morally necessary. It ensures that when we treat consent as morally transformative, it is because a human being has genuinely governed the interaction, not merely because a biological organism with the capacity for reason emitted a signal of agreement. To defend valid consent is to defend the active exercise of the self, not just the potential for it.
