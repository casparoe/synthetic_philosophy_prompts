answer: |-
  ### Predictions

  **Case 1: Fission (One body, two streams)**
  She will assign a welfare weight of **0.05 per hemisphere**, for a total moral weight of **0.10** for the organism.
  *Reasoning:* Since she assigns 0 to the honeybee colony because it lacks a unified subject despite containing multiple bees, she implicitly acknowledges that welfare attaches to *subjects*, not merely biological organisms. In the fission case, the commissural disconnection creates two distinct loci of phenomenal unity. If she is consistent, she must count two subjects. Since each hemisphere retains the affective capacity of a whole moth (learning, valence, independent motor control), each warrants the full 0.05 weight.

  **Case 2: Fusion (Two bodies, one stream)**
  She will assign a welfare weight of **0.05 total** for the pair.
  *Reasoning:* Here, two biological organisms house a single unified subject. The global broadcast of input and coordinated output satisfy her integration condition for a single locus of experience. Just as she does not sum the weights of bees in a colony to create a "super-bee" weight, she should not sum the weights of fused moths to create a "super-moth." There is only one "someone" there to suffer, so the weight remains that of a single subject.

  ### The Rule She Is Running

  **The Unified-Subject (Integration) Condition.**

  I favor this rule over the Affective Condition and the Precautionary Heuristic for three reasons:

  1.  **The Zero Verdicts:** The Affective Condition fails to explain why the slime mould, the honeybee colony, and the tabular RL agent receive 0. All three exhibit valenced-like behavior (nutrient routing, colony trade-offs, reward signals). If affect or functional trade-offs were sufficient, they would score >0. The Unified-Subject rule explains their exclusion: they lack a singular, integrated phenomenal field.
  2.  **The Organoid Verdict:** The cortical organoid contains human neurons (the "right stuff") but scores 0 due to lacking sensory input and motor output. This suggests that *embodied integration* with a world is necessary to constitute a subject, not just the presence of affective hardware or potential.
  3.  **Her Explicit Denials:** She explicitly denies grading intelligence or information processing. The Precautionary Heuristic usually relies on behavioral proxies (intelligence/flexibility) to estimate sentience. By rejecting those proxies while maintaining sharp distinctions (e.g., mosquito 0.01 vs. fruit fly 0.02), she signals a commitment to a structural or metaphysical criterion (unity) rather than a behavioral heuristic.

  ### Calibration: Per Subject or Per Organism?

  She is calibrating **per subject**.

  The organism is merely her default *proxy* for the subject. In standard biology, one organism typically houses one subject. Her verdict on the honeybee colony (0) reveals that when the proxy fails (many organisms, no unified subject), the weight vanishes. Conversely, in your Fission case, if the proxy fails in the other direction (one organism, two subjects), the weight should double. If she were calibrating per organism, the Fission case would remain 0.05, and the Fusion case would be 0.10. My predictions assume she follows the metaphysics of her colony verdict: count the subjects, not the skins.

