answer: |-
  Reject step (4), because the Ex-Ante Pareto principle it invokes is normatively distinct from the No-Levelling-Down constraint on outcomes, and denying it allows you to maintain prioritarianism without collapsing into utilitarianism.

  Step (4) looks plausible because it conflates two different senses of "better off": rational choiceworthiness for an individual (which tracks expected welfare) and distributive advantage for a theory of justice (which tracks actual welfare). Your fear that rejecting (4) undermines (1) is unfounded because (1) is a constraint on the evaluation of *states of affairs*, whereas (4) is a constraint on the evaluation of *risk profiles*. You can consistently hold that justice is fundamentally about how actual lives go (preserving the Levelling Down Objection against egalitarianism) while also holding that the distribution of risk itself has moral significance independent of expected value (denying Ex-Ante Pareto).

  The cost of rejecting (4) is accepting that prioritarianism violates Ex-Ante Pareto: you must admit that a policy can be socially preferable even if it lowers everyone's expected welfare, provided it improves the ex-post distribution sufficiently. This is the standard "Ex-Post Prioritarian" bullet, defended by scholars like Matthew Adler, who argue that avoiding catastrophic outcomes for some (the 0 in your Q case) outweighs the gain in expectation for all. If you instead accept (4) to preserve Ex-Ante Pareto, you are forced into Ex-Ante Prioritarianism (applying the concave function to expectations), but as you noted, this ignores the moral significance of actual suffering—the very thing priority is meant to address.

  Step (7) is technically correct conditional on accepting (4): Harsanyi's theorem shows that Ex-Ante Pareto + Expected Utility + Anonymity entails Utilitarianism. Since you want to avoid Utilitarianism, you must break the chain at (4). The argument doesn't prove prioritarianism is incoherent; it proves that Ex-Post Prioritarianism and Ex-Ante Pareto are incompatible. Given your commitment to (3), the price of admission is the violation of (4).
