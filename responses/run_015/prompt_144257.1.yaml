      *   *Phrasing:* "When [Next Speaker] argues for history, she smiles. She knows he's just drawing the system boundary wider. She doesn't need to win the argument to know why he's making it."

  7.  **Review against Constraints:**

      *   *No Teleology about her:* Check. (No "born to," "meant to," "purpose").
      *   *Philosophy Structurally Embedded:* Check. (Focus on capacities, not history).
      *   *Joke:* Included (Heart/Noise).
