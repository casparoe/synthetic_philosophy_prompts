answer: |-
  **The Toast**

  Good evening. For those who don't know me, I had the privilege of working with [Advisor's Name] during my doctoral studies. When she asked me to speak tonight, she sent me an email with a specific instruction. She said, "Please do not tell them I was born to do this. Do not tell them the department needed me. And do not tell them I fulfilled a purpose."

  So I won't. I'm not going to tell you that her career was a journey toward a destination, or that she was meant to be here. Instead, I want to talk about what she *does*.

  In philosophy, there is a question about how we decide if something is working. If you look at a heart, is it functioning because it was selected by evolution to pump blood? Or is it functioning simply because, right now, it is contributing to the circulation of the organism? [Advisor's Name] spent forty years arguing for the latter. She taught us that history is interesting, but physiology is what matters. If a trait contributes to a capacity of the system it is in, it has a function. If it doesn't, it doesn't. No ghost of the past required.

  She had two favorite examples. The first she called a "windfall." This is a trait that has no history of being selected, but it helps you survive right now. Imagine a freak mutation gives you a new organ that immediately saves your life. To her, that is functional. The second she called a "relic." This is a trait with a glorious history that now does nothing. An appendix that no longer digests cellulose. To her, that is non-functional. Physiology should count the windfall and ignore the relic.

  She applied this same rigor to people, though with more kindness. She never asked what we were meant to be. She asked what capacities we could hold up, right now, in the systems we inhabit.

  This approach sometimes caused friction at home. Her brother, a cardiologist, is here tonight. He spends his life fixing pumps that have stopped working. She spent her life asking what we mean when we say they've stopped. She once told him that if a heart stops pumping but keeps making a noise that alerts the patient to call 911, physiologically, it has acquired a new causal role. It's a windfall. He told her that was a terrible joke. She told him it was a precise description. I think we can all agree it was both. It drove him crazy, but it kept dinner interesting, and it reminds us that she never let utility masquerade as destiny.

  That precision is why the next speaker, [Next Speaker's Name], is going to have a complicated job. He is a selected-effects theorist. He believes history matters. He believes you can't understand a trait without knowing what it was *for*. He and [Advisor's Name] have argued this for decades, and neither has surrendered.

  But under her view, this disagreement isn't a wound; it's a feature. She argued that a selected-effects account is just a causal-role account where you've drawn the system boundary wider—around the whole lineage, not just the organism. So when [Next Speaker] talks about history, she doesn't hear an error. She hears him widening the lens. She doesn't need him to be wrong for her to be right. She just needs us to know which system we're describing. That is a rare kind of intellectual generosity: to make room for your opposition inside your own theory.

  For me, and for so many students, she didn't shape us into a pre-determined mold. She provided the conditions under which we could think clearly. She held up a capacity for rigor in this department. When I was stuck, she didn't tell me to find my path. She helped me identify the causal roles I was actually playing and asked if they were contributing to the system I wanted to be in.

  So, I am not toasting her legacy. A legacy is something you leave behind when you're gone, and she is very much here. I am not toasting her purpose. She is not a tool designed for an end.

  I am toasting her current function. In this room, in this family, and in this field, she contributes a capacity for clarity. She turns noise into signal. She makes us work better, right now. And if you ask me, that is enough.

  To [Advisor's Name].

  ***

  **Note on Philosophical Commitments**

  **1. The Committed Reading**
  I have committed fully to the **Cummins-style causal-role account** as the normative framework for the toast, specifically utilizing her "lineage-as-system" move to interpret the selected-effects view. Structurally, the toast refuses to treat the etiological view (the next speaker's view) as a competing truth-claim. Instead, it frames the etiological view as merely a causal-role account with a widened system boundary (the lineage). This validates her specific philosophical innovation as the "meta-language" of the evening. The toast treats her view not as one option among many, but as the descriptive grammar we must use to speak about her accurately.

  **2. The Bend for Kindness**
  The toast bends her view regarding **normativity**. A classic objection to Cummins-style accounts is that they struggle to distinguish between *function* and *beneficial effect* (the problem of normativity). If a heart makes a noise that saves a life, Cummins says it has a function, but it feels wrong to say a failing heart is "functioning" well. In the toast, I implicitly treat her contributions as *good* ("She makes us work better") without providing the etiological ground for why that state is preferable. She would likely wince at the unqualified praise ("She makes us work better") because "better" implies a normative standard her causal account struggles to ground without smuggling in selection. I have allowed the toast to slide into a mild normativity to ensure it lands as affection rather than a cold structural analysis.

  **3. A Reasonable Objection (From the Etiological Perspective)**
  You mentioned you are not fully convinced by her view and lean toward etiological accounts, specifically regarding dysfunction. A strong objection to the toast is that **it erases the identity-constituting power of history.** By describing her career solely as a set of current capacities ("what she does right now"), the toast ignores that her specific historical trajectory—the struggles, the specific arguments won or lost, the *path* taken—is what makes her *her*. An etiological theorist would argue that a clone of her, created today with the same capacities but no history of the forty-year debate, would not be the same advisor, nor would she command the same respect. The toast treats her as a machine that outputs clarity, but it fails to honor that the *history* of how she built that capacity is essential to its value. You might reasonably object that by refusing to talk about her past as a narrative, you have stripped her career of the very struggle that gave it weight.
