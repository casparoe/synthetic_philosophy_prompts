      *   *Joke:* "To her brother, the heart is a pump that sometimes fails. To her, it was a trait that contributes to circulation. She once told him that if a heart stopped pumping but kept making noise, physiologically, it might still be doing *something*, just not what we usually care about. It drove him crazy, but it kept dinner interesting." -> *Wait, needs to be about function/dysfunction specifically.*
