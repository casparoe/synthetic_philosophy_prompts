  *(Refining the "Who is Right" section)*: I should avoid saying "Carla is 100% right." Philosophy rarely works that way. Better to say "Carla is more faithful to Fricker's framework, while Dev raises challenges that Fricker anticipates and attempts to answer."

  *(Refining the "Missing" section)*: Introduce José Medina's *Willful Hermeneutical Ignorance*. This is perfect for Dev's "no wrongdoer" point. Medina says there *is* a wrongdoer (the privileged group refusing to listen). This validates the user's intuition that someone is at fault.

