      *   *Is it purely hermeneutical?* In medicine, often the concepts *exist* (e.g., endometriosis takes 7 years to diagnose). The delay isn't always lack of concepts, but lack of *application*. This leans toward *willful ignorance* or *testimonial injustice*. I need to make sure the user knows the theory might need tweaking for their specific case.

