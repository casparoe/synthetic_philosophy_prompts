  **ELENA:** Right. Solving $u_1 = 100 - u_1^2/100$ gives the quadratic $u_1^2 + 100u_1 - 10000 = 0$. The positive root is $50(\sqrt{5} - 1)$, which is approximately **61.8**. So your solution is $K(S) \approx (61.8, 61.8)$.

  **MARCUS:** And for Nash?

  **ELENA:** We maximize the product $u_1 u_2$ subject to the constraint. Substituting the frontier into the product gives $f(u_1) = 100u_1 - u_1^3/100$. The first-order condition is $100 - 3u_1^2/100 = 0$, so $u_1 = 100/\sqrt{3} \approx 57.7$. Then $u_2 = 200/3 \approx 66.7$. So $N(S) \approx (57.7, 66.7)$.

  **MARCUS:** There it is. The divergence. My solution grants them equal utility. Yours grants Player 2 nearly 9 units more. And yet, the problem is symmetric in terms of claims: both have a maximum possible gain of 100, and both face a disagreement of 0. Why does your solution penalize Player 1?

  **ELENA:** It's not a penalty, Marcus; it's a reflection of the marginal trade-offs. Look at the frontier. It's not a straight line. At the point of equal utility $(50, 50)$, the slope of the frontier is $-1$. But as we move toward my solution, the curvature matters. The Nash solution is determined by the tangency of the highest indifference hyperbola $u_1 u_2 = k$. This depends on the local geometry of the frontier. Player 2 gets more because the feasible set is "thicker" in the region where Player 2 has high utility. Player 1 can gain utility at a lower cost to Player 2 than vice versa.

  **MARCUS:** That is precisely where Independence of Irrelevant Alternatives (IIA) leads you astray. You are arguing that the solution should depend only on the local shape of the frontier near the solution point. But bargaining isn't just about marginal rates of substitution; it's about the *scope* of the agreement relative to what is possible.

  **ELENA:** IIA isn't a bug; it's a consistency requirement. Suppose we define a smaller set $S' \subset S$ that cuts off the "horns" of the parabola—say, we cap $u_2$ at 67 and $u_1$ at 58. My Nash point $(57.7, 66.7)$ is still feasible in $S'$. IIA demands the solution remain unchanged. Why? Because the options we removed were never going to be chosen. They are irrelevant. Your Kalai–Smorodinsky solution, however, would jump. If I cap $u_2$ at 67, the ideal point $a_2$ drops from 100 to 67. The line from $d$ to $a$ changes slope. Your solution moves, even though the local frontier around the agreement hasn't changed. You are letting "utopian" possibilities that no one would ever select dictate the outcome.

  **MARCUS:** But those utopian possibilities define bargaining power! That is the intuition behind Individual Monotonicity. If the feasible set expands in a way that increases my ideal point, my bargaining position should improve. Conversely, if we view this problem $S$ as an expansion of the linear triangle $T = \text{conv}\{(0,0), (100,0), (0,100)\}$, we see the issue. In $T$, both our solutions agree at $(50,50)$. The ideal points are $(100,100)$ for both.

  **ELENA:** Correct.

  **MARCUS:** Now we expand to $S$. The ideal points remain $(100,100)$. The set has grown. Intuitively, both players should benefit, which they do in both solutions. But why should the *ratio* of their gains shift? In $T$, the ratio is 1:1. In $S$, your Nash solution shifts the ratio to roughly 0.87:1 in favor of Player 2. The expansion from $T$ to $S$ didn't change the players' maximum claims—they are still both 100. Why should the *curvature* of the expansion break the symmetry of their claims? Monotonicity ensures that if the ideal points remain symmetric, the solution respects that symmetry of claims, regardless of how the frontier bulges in between.

  **ELENA:** Because utility is cardinal here, Marcus. The Symmetry Axiom only applies if the *feasible set* is symmetric across the 45-degree line. $S$ is not symmetric. $u_2 = 100 - u_1^2/100$ is not the same curve as $u_1 = 100 - u_2^2/100$. Player 2 genuinely has a better set of opportunities. At $u_1=50$, Player 2 can get 75. At $u_2=50$, Player 1 can only get roughly 70.7 ($\sqrt{5000}$). Player 2 has more "surplus" to bring to the table. IIA protects the efficiency of the allocation. If we ignore the local trade-off rates, as KS does by drawing a straight line to the ideal point, we might settle at a point where the marginal rates of substitution aren't equalized in the product sense. We are leaving value on the table relative to the Nash product.

  **MARCUS:** We aren't leaving value on the table; we are on the Pareto frontier in both cases. The disagreement is about *which* Pareto point is fair. You say fairness is determined by the local slope. I say fairness is determined by the proportion of the maximum possible gain achieved.
  Consider the strongest argument against your IIA: It makes the solution vulnerable to strategic manipulation of the feasible set. If I am Player 2, and I know you use Nash, I have an incentive to make the frontier "bulge" in my direction near your solution point, even if my ideal point doesn't change. I can alter the local curvature to shift the tangency.
  Under Kalai–Smorodinsky, I cannot do that. As long as my ideal point $a_2$ remains 100, and yours remains 100, the solution stays on the line $u_1=u_2$. My solution is robust to changes in the "irrelevant" shape of the frontier, provided the ideal points hold. You claim IIA makes you robust to irrelevant *alternatives*, but it makes you hypersensitive to irrelevant *geometry*.

  **ELENA:** That's a compelling point, but it cuts both ways. Your sensitivity to ideal points means you are sensitive to "dummy" alternatives. Suppose there is a point $(100, 100)$ that is theoretically feasible but practically impossible to reach—say, it requires a technology that doesn't exist, but we include it in the description of $S$ to define the ideal point. Your solution shifts entirely based on that phantom point.
  Furthermore, let's press on Monotonicity. You argue that because $a_1 = a_2$, the utilities should be equal. But Monotonicity is about set inclusion. Imagine a subset $S_{sub} \subset S$ where we chop off the top of the parabola so that $a_2$ becomes 80, but the local frontier near your KS solution is untouched. Your solution drops immediately because the ratio $u_2/a_2$ must match $u_1/a_1$. But Player 1's local trade-off environment hasn't changed. Why should Player 1's utility drop just because Player 2's *unattainable* maximum dropped? IIA prevents this. Under Nash, if the cut is above the solution point, the solution doesn't move. That is stability.

  **MARCUS:** Stability at the cost of fairness. In your scenario, Player 2's bargaining power *has* decreased. Their threat point—the ability to say "I could get 100 if you gave me everything"—is now "I could only get 80." That *should* weaken their position, and consequently, it affects the settlement for Player 1 because the relative claims have shifted. Bargaining is a contest of claims, not just a calculus of marginal rates.
  In this specific problem, the Nash solution awards Player 2 a premium simply because the function is quadratic. If we transformed the utility scales affine-wise, your solution is invariant, sure. But the *shape* of the set is doing all the work. You are essentially rewarding Player 2 for the convexity of their utility possibility set. Why is convexity a virtue deserving of reward?

  **ELENA:** It's not the convexity per se; it's the marginal cost of agreement. In this region, Player 1 is "cheaper" to satisfy. To give Player 1 one more unit of utility costs Player 2 less than it costs Player 1 to give Player 2 one unit. The Nash solution equalizes the *percentage* gains relative to the disagreement point in a way that accounts for these costs.
  But let's return to the core axiom. IIA is the only axiom that characterizes the Nash solution uniquely alongside the others. If you drop IIA, you lose the link to the expected utility foundation—the risk of breakdown. The Nash solution is the limit of a strategic game where bargaining fails with some probability. In that strategic context, the local curvature determines the risk each player faces. Player 2 faces less risk in demanding more because the frontier falls away slower for them. KS has no such strategic foundation; it's purely axiomatic.

  **MARCUS:** And that strategic foundation assumes a specific threat process. If we change the arbitration rule to "proportional concessions," we get KS. The Individual Monotonicity axiom captures a fundamental notion of resource fairness: if the pie grows, or if the shape of the pie changes to favor you, I should not end up with a smaller slice of my potential claim.
  In this problem, $a_1 = a_2$. The "claims" are identical. The disagreement is identical. The only difference is the path to the frontier. Nash says the path matters more than the destination claims. KS says the destination claims matter more than the path.
  Given that $S$ contains the symmetric triangle $T$, and $a(S)=a(T)$, KS views $S$ as a "bonus" on top of $T$ that should be shared proportionally. Nash views $S$ as a new geometry that resets the fairness metric. I argue that if the maximum claims haven't changed, the baseline of fairness shouldn't shift from 50-50 to 57-66.

  **ELENA:** And I argue that if the opportunities have changed, the solution must change to reflect the new efficiency possibilities. If we force the solution to $(61.8, 61.8)$, we are at a point where the product of utilities is lower than at $(57.7, 66.7)$. We are sacrificing joint gain to maintain a ratio of claims that ignores the cost of achieving those claims. IIA ensures we don't ignore the cost.

  **MARCUS:** We aren't sacrificing joint gain; both points are Pareto efficient. We are sacrificing *symmetry of claims* to satisfy *invariance to set contraction*. I'll take the axiom that protects the players' relative claims over the one that protects the solution from phantom alternatives.

  **ELENA:** And I'll take the axiom that ensures the solution is determined by the actual trade-offs the players face, not by points on the frontier they will never visit.

  **MARCUS:** (Smiling) It seems we are back to the classic impasse. IIA versus Monotonicity. Local geometry versus global claims.

  **ELENA:** Precisely. Which is why this problem stays in the syllabus. The numbers don't lie, but they don't tell us which axiom is the moral truth.

  **MARCUS:** Indeed. Though I suspect the students will notice that Player 2 prefers your solution, and Player 1 prefers mine.

  **ELENA:** (Laughing) Self-interest is the one axiom we don't need to teach them. Let's wrap it up.
