      *   *No Expression (The Hard Part):*
          1.  *Normative Demand:* Metrology says "If you can't measure it, you can't compare it." Ethics says "You *must* compare it to be moral, even if you can't measure it." This is a category error in the user's framework.
          2.  *Metaphysical Fact:* The idea that $U_A - U_B$ has a truth value even if unmeasurable. In physics, unmeasurable differences (gauge variants) are usually considered non-physical. In ethics, they might be "real" but "hidden."
          3.  *Inadmissible Information:* Data exists but shouldn't be used. In metrology, data is data. In ethics, using utility info might violate rights/autonomy. This isn't a prior; it's a constraint on the *loss function* or the *decision rule*, not the measurement.

  5.  **Formulating the Conclusion:**
      *   Is it the vocabulary? Partially. Metrology is about *epistemic access* to physical quantities.
      *   Is it conflation? Yes. The philosophers are mixing:
          1.  *Psychological/Empirical:* Do brains encode utility in a common currency? (Neuroscience).
          2.  *Formal:* What math is consistent with our axioms? (Measurement theory).
          3.  *Normative:* Are we *allowed* to sum these numbers? (Moral philosophy).
      *   The fight is about #3, disguised as #1. The physicist wants #1 to settle #3. The philosopher knows #1 is impossible, so they argue about #2 to justify #3.

  6.  **Refining the Tone:**
      *   Respectful, peer-to-peer (physicist to physicist).
