  2.  **Deconstruct the Comparability Menu (Metrological Translation):**
      *   *Ordinal/Non-comparable:* Each person has a monotonic mapping $U_i: X \to \mathbb{R}$. Transformation group $\phi_i$ is any strictly increasing function. Invariance group: $G = \prod M_i$ (independent monotonic transformations). No common scale, no common zero. Like having $N$ thermometers with unknown, non-linear, drifting scales measuring different properties.
      *   *Cardinal/Unit Comparable (Level Non-comparable):* $U_i$ is unique up to positive affine transformation $aU_i + b_i$. Same unit (scale factor $a$), different zeroes ($b_i$). Transformation group: Common $a$, individual $b_i$. Analogy: Thermometers calibrated to the same degree size (Kelvin/Celsius step) but arbitrary zeroes (like Celsius vs. Fahrenheit, but agreed on the step).
      *   *Full Level Comparable:* $U_i$ unique up to common positive affine transformation $aU + b$. Same unit, same zero. Transformation group: Common $a$, common $b$. Analogy: Absolute temperature (Kelvin). Zero means "no thermal energy."
      *   *Ratio Comparable:* Unique up to multiplication $aU$. Fixed zero, floating unit. (Less common in welfare, but exists).
      *   *Intrapersonal vNM:* Expected utility gives cardinality *within* a person. $U(p) = \sum p_i U(x_i)$. Fixes the scale up to affine transform *for that person*.

