  7.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I explain vNM correctly in this context? Yes, it provides intrapersonal cardinality.
      *   *Check:* Did I address the "thermal contact" question deeply enough? Need to emphasize that thermal equilibrium is an *observable* relation, whereas utility equivalence is not.
      *   *Check:* The fiber bundle analogy. Need to be careful not to dismiss it, but point out that defining the bundle *is* the act of assuming comparability.
