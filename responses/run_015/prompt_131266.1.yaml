      *   *Thermal Contact Analogue:* In thermodynamics, $T_A = T_B$ is defined by no net heat flow (Zeroth Law). This establishes an equivalence class *before* numbering. In welfare? Is there a "no net envy" state? Or a "willingness to trade" state?
          *   *Problem:* Heat flow is physical/observable. Utility flow is not. Revealed preference shows *ordering*, not *magnitude* of feeling.
          *   *Verdict:* No direct analogue. The "equilibrium" is usually defined *by* the utility function, not the other way around.
      *   *Fiber Bundle/Gauge Analogy:*
          *   *Idea:* Each person is a fiber. Utility is a section. Gauge freedom is the affine transform. Comparing requires a connection (parallel transport).
          *   *Critique:* Mathematically elegant. But does it imply a base manifold (common state space $X$)? Yes. Does it imply a metric? Yes, for magnitude.
          *   *Smuggling:* It assumes the "fibers" are of the same *kind* (homogeneous bundle). In physics, temperature is the *same quantity* everywhere. In welfare, is my "happiness" the same dimension as yours? The gauge theory assumes they *are* commensurable but just shifted/scaled. It presupposes the solution to the comparability problem to set up the geometry.

  4.  **Drafting the Residue Report (The Core Analysis):**
      *   *Translates Cleanly:* The invariance groups (Stevens' scales). The logic of "what operations are meaningful?" (Suppes). If $G$ is the group, only $G$-invariant statements are physical.
