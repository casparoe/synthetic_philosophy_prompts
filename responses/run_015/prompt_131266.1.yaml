  *(Self-Correction Note on "Unit Comparable"):* In the literature, "Unit Comparable" usually means common scale factor, arbitrary zero ($a, b_i$). "Level Comparable" means common scale and zero ($a, b$). I need to be precise with these definitions in the translation.

  *(Self-Correction on "Thermal Contact"):* The Zeroth Law establishes temperature as a state variable. Without an analogue to the Zeroth Law, utility is just a label. I need to make sure this distinction is sharp.

  *(Self-Correction on "Residue"):* The user's guess about "inadmissible information" being a prior is interesting. I should argue it's more like a symmetry constraint or a superselection rule in QM—some observables exist but cannot be measured/used in certain contexts.

  *(Final Plan):*
