  Here is a concise example called **"The Biased Clone Coordination"** problem. It isolates the tension between choosing a policy *before* self-locating uncertainty is resolved (UDT) versus updating on that uncertainty (EDT), without reducing to a debate about probabilities.

  ### The Setup
  Omega creates two identical copies of you: **Copy A** and **Copy B**.
  *   **The Goal:** If *both* copies press a button, you each receive **\$1,000**. If only one or neither presses, you each get **\$0**.
  *   **The Cost:** Pressing the button costs **\$100**.
  *   **The Uncertainty:** You wake up in a room. You do not know if you are Copy A or Copy B.
  *   **The Signal:**
      *   **Copy A** always sees a **Green Light**.
      *   **Copy B** sees a **Green Light** 99% of the time, and a **Red Light** 1% of the time.

  You wake up and see a **Green Light**.

  ### The Tension
  Both EDT and UDT agents agree on the **credence**: Given the signal, you are 99% likely to be Copy B (the "Receiver") and only 1% likely to be Copy A (the "Sender"). The disagreement is on what to *do* with that information.

  **1. The Evidential (EDT) Reasoning: "Follow the Local Evidence"**
  *   "I see Green. I am 99% likely to be Copy B.
  *   If I am Copy B, my partner (Copy A) has already made their decision (or is causally separate). My button press cannot *cause* them to press.
  *   Since I am likely Copy B, and my action has no causal leverage over Copy A, pressing the button costs me \$100 for no expected gain.
  *   **Decision:** Do not press."

  **2. The Updateless (UDT) Reasoning: "Optimize the Global Policy"**
  *   "Before I knew which copy I was, I should have chosen a policy mapping *Light Color* to *Action*.
  *   Consider the policy: *'If Green, Press.'*
      *   Copy A sees Green $\rightarrow$ Presses.
      *   Copy B (99% Green) $\rightarrow$ Presses.
      *   Result: Coordination succeeds almost always. Net gain: \$900 each.
  *   Consider the policy: *'If Green, Don't Press.'*
      *   Copy A sees Green $\rightarrow$ Doesn't Press.
      *   Copy B sees Green $\rightarrow$ Doesn't Press.
      *   Result: Coordination fails. Net gain: \$0.
  *   Even though I *now* know I am likely Copy B, my decision algorithm is the same one running in Copy A. If I decide 'Don't Press' based on my local credence, Copy A (who also sees Green) runs the same logic and also doesn't press.
  *   **Decision:** Press."

  ### Why This Illustrates the "Weird" Part
  The disagreement isn't about the probability (both agree you're likely Copy B). The disagreement is about **logical control**.

  *   **EDT** treats your current self-location as a fixed fact that limits your causal influence. It says: *"Given that I am probably the passive copy, acting is irrational."*
  *   **UDT** treats your decision as a logical variable that determines the output of *all* copies running the same algorithm. It says: *"You must act as if you control Copy A, because if you don't, Copy A (who is logically identical to you right now) won't act either."*

  This forces the student to accept that rationality might require acting **against** overwhelming local evidence about who they are, simply to maintain the consistency of a policy that yields value across all possible branches of self-location.
