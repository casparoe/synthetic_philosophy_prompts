          3.  **Self-Verification:** Distinguish belief *producing* evidence vs. belief *constituting* truth. Which applies here? Does it help James?
          4.  **Standpoint Asymmetry:** Individual (Marshall) vs. Institution (Guideline committees). Is higher evidential bar for institutions rational or conservative? Can Clifford/James handle this?
          5.  **Reverse Direction:** (a) Clifford's social harm argument (did withholding belief cause harm?). (b) Selection effect (survivorship bias).
          6.  **The Limit:** Where the ethics of belief goes quiet (instrumental/methodological/incentive bottlenecks vs. doxastic conduct).

  2.  **Drafting - Section by Section:**

      *   **Section 1: Setup & Attribution.**
