          *   *Attribution:*
              *   Warren/Marshall (1981-83): Belief in *colonization* (high evidence), *gastritis link* (moderate), *ulcer causation* (speculative/hypothesis).
              *   Reviewers/Field (1983-1993): Belief in *sterile stomach dogma* (based on prior negative studies + difficulty culturing). Rejection of *ulcer causation*.
          *   *Propositions:* Must separate $P_1$ (Bacteria exist in stomach), $P_2$ (Bacteria cause inflammation/gastritis), $P_3$ (Bacteria cause peptic ulcers).
          *   *James's Test:* Was it live, forced, momentous for Marshall?
              *   *Live:* Yes, for him (he saw the bacteria). For the field? No (dogma said sterile).
              *   *Forced:* Was "wait and see" a genuine option? James says a hypothesis is forced if you must choose now or lose the opportunity. Marshall drinking the culture: Was it forced? He could have waited for better animal models. But he felt clinical urgency. Strictly speaking, "wait" was available. So, not strictly *forced* in James's logical sense, but *psychologically* forced by career/research trajectory.
              *   *Momentous:* Yes. Career risk, patient suffering.
