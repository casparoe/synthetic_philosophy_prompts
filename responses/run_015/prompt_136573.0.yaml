  If we were to name this pattern based on its structure, the most accurate descriptive label would be **"Selective Origin Essentialism."**

  Here is the precise carving of the pattern, distinguishing it from mere sloppiness, along with my confidence assessment.

  ### The Carving: What Is Constant vs. What Is Dropped

  To understand why this isn't just logical sloppiness, you have to identify the underlying goal of the intuition. The human mind is not trying to maintain biological consistency; it is trying to maintain **Narrative Uniqueness**.

  **1. What Is Held Constant (The Invariant):**
  The constant is the **Intuition of Non-Fungibility**. In every scenario (adoption, cloning, twinning), the intuition insists that *you* are a singular, unrepeatable historical entity. The mind refuses to accept that "you" could be swapped with a qualitatively identical counterpart without loss. The demand is always for a **unique causal anchor**—a specific point in history that locks "you" into existence.

  **2. What Gets Dropped/Shifted (The Variable):**
  The variable is the **Biological Timestamp of Individuation**. Depending on which timestamp threatens the Intuition of Non-Fungibility, the intuition slides to a different biological marker:
  *   **In Adoption/Embryo Transfer:** The intuition prioritizes the **Zygote/Genome**. Why? Because moving the womb doesn't threaten uniqueness. If we said the womb mattered, the embryo might not be "the same person" after transfer, which disrupts legal and moral continuity. So, the timestamp is set *early* (fertilization).
  *   **In Cloning:** The intuition prioritizes **Causal History**. Why? Because if we prioritized the Genome (as in adoption), the clone would *be* you. That threatens the Intuition of Non-Fungibility. So, the timestamp is shifted *later* or made dependent on the specific gametic event, excluding somatic cell nuclear transfer.
  *   **In Twinning:** The intuition prioritizes **Division**. Why? Because if we said the pre-split zygote was already "one person," then twinning would imply one person became two (which feels like fission/death) or that one twin is the "real" one. To preserve that there are *two* unique people, the timestamp of individuation is shifted to the *moment of the split*.

  ### Why This Is Not Just Sloppiness

  Sloppiness implies an accidental error in reasoning. This pattern is **teleological** (goal-oriented). It is a **Protective Inconsistency**.

  The inconsistency serves a functional purpose: it protects our moral and legal frameworks from collapsing.
  *   If we were consistent that *only* DNA matters, a clone would be you, complicating laws on inheritance and identity.
  *   If we were consistent that *only* the womb matters, IVF and adoption become morally precarious (the "child" changes if the surrogate changes).
  *   If we were consistent that *only* the zygote matters, identical twins would have to be considered one person who split, which violates our sense of individual soulhood.

  The "sloppiness" is actually a feature of **Folk Metaphysics**. It adjusts the necessary conditions of identity to preserve the sufficient condition of **Moral Status**. It is not a failure of logic; it is a success of social cognition.

  ### Confidence Assessment

  **Confidence Level: 85%**

  I am highly confident in the philosophical analysis of Origin Essentialism and the distinction between numerical and genetic identity. The description of how folk intuitions shift to preserve moral narratives is well-supported by literature in experimental philosophy (e.g., work by Joshua Knobe or Shaun Nichols on moral psychology influencing metaphysical judgments).

  **Point of Least Certainty:**
