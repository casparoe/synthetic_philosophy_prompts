      *Key Insight:* The Money Pump argument is usually used to *prove* transitivity is required. If she wants to keep cyclic preferences, she needs to bite the bullet that standard rationality *doesn't* apply, OR she needs to show the preferences aren't *actually* cyclic, but context-dependent.
      *Actually, the strongest move:* The preferences aren't cyclic. A > B (light), B > C (garden), C > A (home/familiarity + *lesson learned*). The third comparison changes because the *context* has changed (she now knows she's in a pump). This resolves the cycle without denying transitivity.
