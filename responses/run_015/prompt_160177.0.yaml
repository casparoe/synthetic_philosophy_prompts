  3.  **Steelman the Opposition (The "LLMs Can Refer" Side):**
      *   *Functional Role/Use Theory:* Reference is determined by how the symbol is used in a system. If the LLM uses "water" in inferences that align with H2O properties (boils at 100C, puts out fire), it functions *as if* it refers.
      *   *Teleosemantics (Millikan):* Reference is about the proper function of the mechanism. If the LLM is designed/selected to help humans navigate the world, its symbols inherit that intentional direction.
      *   *Derivative Intentionality (Searle-ish but softer):* LLMs have derived intentionality from the humans who built them and the data they were trained on. The text *already* refers; the model processes referring expressions. It's a transitive property of reference.
      *   *Social Externalism (Burge):* It's not just causal contact with *stuff*, it's membership in a linguistic community. If we treat the LLM as a speaker, and it defers to us, it refers to what we refer to.

  4.  **Address the User's Specific Doubts (Where they went wrong):**

