          *   *LLM Implication:* If the LLM is in a "text vat," its reference is fixed to the text-structure. But if that text-structure maps to our world (via us), the chain holds.

      *   *Doubt 2: Deference and Twin Earth.*
          *   *Correction:* Twin Oscar *cannot* defer to Earth because there is no causal channel. Deference requires a social/causal link.
          *   *LLM Implication:* The LLM *does* have a causal link to humans (training data, developers, users). The LLM is causally downstream of Earthlings who *do* refer to H2O.
          *   *The Nuance:* The LLM is more like a book or a map than a person. Does a map refer? Yes, derivatively. The question is whether the LLM is an *agent* or a *tool*. If it's a tool, it inherits reference from users. If it's an agent, does it have its own causal hooks?
