answer: |-
  **MEMORANDUM**

  **TO:** Meridian Foundation Advisory Board
  **FROM:** [Your Name]
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation on Pilot of Condorcet-Based Selection Protocol

  **Recommendation:** Approve-with-Conditions

  **Executive Summary**
  The proposal to replace our standard panel deliberation with an anonymous, Condorcet-style pairwise voting system is theoretically elegant. It promises to reduce social dominance effects and leverage the statistical power of aggregated judgment. However, the epistemic conditions required for the Condorcet Jury Theorem (CJT) to hold—specifically reviewer competence and independence—are not met in our current interdisciplinary context. Furthermore, treating grant quality as a binary "truth" risks systematically filtering out the high-variance, polarizing projects that define our mission.

  I recommend we pilot the protocol, but only under specific conditions that weight for domain competence, capture multidimensional value, and protect minority-favored proposals. A six-month pilot timeline is proposed below.

  **The Epistemic Case for the Protocol**
  We must acknowledge why this proposal is attractive. Our current deliberative model suffers from well-documented pathologies: anchoring on the first speaker, fatigue effects, and the smoothing of outlier opinions toward a safe consensus.

  The CJT argument is that if individual reviewers are better than random ($p > 0.5$) and vote independently, the probability of the majority selecting the "correct" option approaches 1 as the group size increases. By anonymizing scores and using pairwise comparisons (Proposal A vs. Proposal B), we theoretically isolate the signal from the social noise. For standard, incremental science where "quality" is relatively uncontested, this aggregation method would likely outperform our current deliberative model in terms of efficiency and consistency.

  **The Heterogeneous Competence Problem**
  My primary technical objection concerns the distribution of competence ($p$). The CJT assumes a uniform probability of correctness across voters. In our foundation, this is false. A computational biologist reviewing a speculative philosophy of mind proposal is not merely "less competent"; they may be systematically worse than random ($p < 0.5$) due to category errors.

  The theorem dictates that if the average competence drops below 0.5, the majority vote becomes *less* reliable than a single random draw. By treating all votes equally, we dilute the signal of domain experts with the noise of generalists. In signal transduction terms, we are lowering the signal-to-noise ratio by amplifying background noise equally with the ligand binding. If we proceed without weighting votes by domain relevance, we risk selecting proposals that look robust to a generalist but are fundamentally flawed to a specialist.

  **The Category Mistake: Binary Aggregation vs. Multidimensional Value**
  The deeper philosophical objection is that the CJT assumes a binary ground truth (True/False, Guilty/Not Guilty). Grant quality is not binary; it is a vector of trade-offs (e.g., Feasibility vs. Novelty, Rigor vs. Risk).

  When we force a pairwise vote on "Which project is better?", we compel reviewers to collapse these dimensions into a single scalar value. This systematically disadvantages innovative proposals. High-risk projects often have low feasibility scores but high novelty scores. Safe projects have the inverse. In a pairwise majority vote, the "safe" project will often beat the "risky" project because the majority of reviewers will default to the dimension where the safe project wins (feasibility).

  This is a category mistake: applying a binary aggregation model to a multidimensional optimization problem. If Meridian's goal is to fund "weird" science, the Condorcet protocol, unmodified, acts as a conservative filter. It converges on the median preference, which is the definition of non-disruptive.

  **Proposed Conditions for Pilot**
  To salvage the efficiency benefits of the protocol without succumbing to its epistemic risks, I propose three modifications:

  1.  **Domain-Weighted Voting:** Reviewers must self-identify their competence level for each proposal. Votes from high-competence reviewers carry greater weight in the pairwise aggregation. This restores the $p > 0.5$ condition for the effective voting pool.
  2.  **Dimensional Scoring:** Instead of a single pairwise "win," reviewers must vote pairwise on specific dimensions (e.g., "Which is more novel?" "Which is more feasible?"). The final ranking should be based on a weighted sum of these dimensional victories, not a single holistic vote.
  3.  **The Minority Protection Clause:** Any proposal that wins a pairwise comparison against the top-ranked proposal by a significant margin within a competent minority (e.g., top 20% of domain experts) must be flagged for mandatory panel review. This prevents the "tyranny of the majority" from killing polarizing but potentially transformative work.

  **Implementation Timeline**

  *   **Phase 1 (Months 1-2): Calibration.** Select 20 historical proposals (10 funded, 10 rejected). Have a subset of the board run them through the new protocol using the modified conditions above. Compare the output ranking against our historical outcomes and known post-hoc impact.
  *   **Phase 2 (Months 3-5): Live Pilot.** Apply the protocol to the next small grants cycle (up to 50 proposals). Run the new protocol in parallel with the traditional panel deliberation. Do not reveal results to reviewers until both processes are complete.
  *   **Phase 3 (Month 6): Divergence Analysis.** The Advisory Board will review cases where the two methods diverged. Specifically, we will assess if the new protocol filtered out high-risk proposals or if it successfully identified strong proposals the panel missed due to groupthink.
  *   **Decision Point (End of Month 6):** Based on the divergence analysis, vote to adopt, reject, or refine the protocol for full implementation.

  **Conclusion**
  The Condorcet protocol is a powerful tool, but it is not a universal solvent for decision-making. It works best when truth is singular and voters are homogeneous. Our context is the opposite. By adopting the protocol with the conditions outlined above, we can test its utility without compromising the epistemic integrity of our selection process or our mission to fund the unconventional.

  I look forward to discussing this framework at Tuesday's meeting.
