      *   **Task:** Two-way case analysis (Futarchy applied to Brexit, Brexit applied to Futarchy).
      *   **Specific Questions:**
          1.  *Mapping:* Players, Option Space, Metric (User proposes: Real household disposable income per head, 5 years out, vs. synthetic control). Is this workable? What breaks?
          2.  *Futarchy's Prescription:* What conditional markets would look like in 2016, participants, price authority.
          3.  *Model Fit:* Where does futarchy explain the episode? Where does it misdescribe? Specifically address the "undefined Leave" problem (unspecified options).
          4.  *Reverse Lesson:* What Brexit teaches Futarchy (Legitimacy/Expressive vs. Instrumental). Give the strongest opposite view.
      *   **Constraint:** Distinguish settled consensus from contested claims in prediction market/mechanism design literature. Do not dress up speculation as fact.

  2.  **Initial Assessment & Fact-Checking (Mental Sandbox):**

      *   *Futarchy Basics:* Robin Hanson's idea. Vote on utility function $U$, market predicts $E[U|policy]$. Policy with highest expected utility is enacted.
      *   *Brexit Context:* The user's summary is broadly accurate. The "undefined Leave" is the critical failure point for any rationalist framework.
      *   *Metric:* "Real household disposable income per head 5 years out vs. synthetic control." This is standard econometric practice (e.g., OBR, Treasury forecasts), but *ex post* verification is tricky (counterfactuals are unobservable). Futarchy needs *settled* outcomes to pay out markets.
      *   *Players:* In standard democracy, voters = principals. In futarchy, traders = informants, voters = value-setters.
      *   *Contested Areas:* Market manipulation, liquidity, definition of utility, "governance by market" legitimacy, the "counterfactual problem" in policy evaluation.

  3.  **Drafting Section 1: The Mapping:**

      *   *Players:*
          *   *Voters:* Set the metric (Utility Function). In Brexit, this was the public/MPs. In Futarchy, they don't choose the policy, just the goal.
          *   *Traders:* Anyone with capital and info. Global markets, not just UK citizens.
          *   *Implementers:* Government/Parliament (must execute the winning policy).
          *   *Adjudicator:* Who measures the metric? (Crucial point).
      *   *Option Space:* This is the big hurdle. "Remain" is clear. "Leave" is a bucket. Futarchy requires specific policies (e.g., "Leave via EEA," "Leave via WTO").
      *   *Metric:* User proposes Income per head vs. Synthetic Control.
          *   *Workability:* Economists use synthetic controls (e.g., Cambridge Econometrics did this).
          *   *What Breaks:*
              1.  *Observability:* Counterfactuals are never observed. You have to trust the model. Futarchy usually requires *realized* outcomes. If the payout depends on a model, the market trades the model, not reality.
              2.  *Lag:* 5 years is long. Capital tied up.
              3.  *Manipulation:* Can policy affect the metric *other* than through welfare? (Goodhart's Law).
              4.  *Attribution:* Did income drop because of Brexit or the 2020 Pandemic? (Confounding variables).

  4.  **Drafting Section 2: Futarchy's Prescription (2016):**

      *   *Conditional Markets:* $P(Income | Remain)$ vs. $P(Income | Leave\_EEA)$ vs. $P(Income | Leave\_WTO)$.
      *   *Participants:* Institutional investors, currency traders, economic forecasters. High liquidity expected due to stakes.
      *   *Price Authority:* Would prices deserve authority?
          *   *Consensus:* Prediction markets beat polls/experts in many domains (elections, sports).
          *   *Contested:* Policy markets are thinner. "Adverse selection" (insiders might be illegal traders).
          *   *Verdict:* Prices would likely have shown a discount for "Hard Leave" compared to "Remain" or "Soft Leave."

  5.  **Drafting Section 3: Model Fit (Explanation vs. Misdescription):**

      *   *Explains:* The market turmoil (Sterling drop) *was* a prediction market signal. The business uncertainty was a rational pricing of ambiguity.
      *   *Misdescribes:* The "Undefined Leave." Futarchy *requires* specification. Brexit was a vote on a *vibe* (sovereignty/immigration) masked as a policy choice.
      *   *The "Unspecified Option" Problem:* Is this a failure of the vote or the theory?
          *   *Futarchy View:* Forces specification. You can't bet on "Leave" generally. You bet on specific treaties.
          *   *Critique:* Politics isn't just engineering. Sometimes ambiguity is a feature (coalition building). Forcing specification might break the political compromise needed to hold the state together.
      *   *Consensus Check:* It is settled that ambiguous contracts lead to disputes. It is contested whether political ambiguity is always bad.

  6.  **Drafting Section 4: Reverse Lesson (Legitimacy vs. Accuracy):**

      *   *User's Suspicion:* Legitimacy/Expressive voting.
      *   *Argument:* People voted to "take back control," not to maximize GDP. A market saying "Leave makes you poorer" might not matter if the value is sovereignty.
      *   *Futarchy Counter:* That's why you *vote on values*. If the metric includes sovereignty (hard to quantify), the market respects that.
      *   *Strongest Opposite View:* Technocratic legitimacy. If the public votes for self-harm due to misinformation, futarchy (via accurate markets) prevents the harm. Democratic legitimacy is overrated if outcomes are disastrous.
      *   *Contested:* Is "welfare" purely economic? Can sovereignty be metricized? (Most mechanism designers say "hard to measure," politicians say "essential").

  7.  **Review and Refine (Self-Correction against Constraints):**

      *   *Constraint Check:* Did I distinguish settled vs. contested?
          *   *Settled:* Counterfactuals are unobservable. Markets aggregate info well in liquid settings. Ambiguity causes implementation failure.
          *   *Contested:* Whether policy markets can be liquid enough. Whether GDP is a good proxy for welfare. Whether "legitimacy" requires direct policy choice.
      *   *Tone:* Analytical, not advocacy. Acknowledge Hanson's theory but don't treat it as gospel.
      *   *Metric Critique:* Be specific about the "Synthetic Control" issue. That's a model risk, not a market risk. Futarchy hates model risk in payout conditions.
      *   *Brexit Facts:* Ensure I don't contradict the user's stipulations unless necessary (they seem accurate enough for this analysis).

  8.  **Final Polish:** Organize into the four requested sections. Ensure the distinction between "Vote on Values" and "Bet on Beliefs" is clear in the Brexit context. (e.g., If they voted on "Sovereignty" as the metric, Leave might win. If they voted on "Income," Remain might win).

      *(Self-Correction during drafting)*: Wait, I need to be careful about the "Metric" section. In standard Futarchy, the metric is voted on *before* the market trades. In Brexit, the metric was implicit. I need to analyze how a Futarchy implementation would have *changed* the metric definition.
      *Correction:* In Futarchy, the *public* votes on the utility function. So, if the public voted "Maximize Sovereignty" over "Maximize Income," the market would find the policy that maximizes sovereignty. The user's proposed metric (Income) might not have been the one voted on. I need to address this tension. The user asks "Is that metric even workable?" so I should answer that specifically, but also note that in a real futarchy, the metric itself is a political choice.

      *Refining the "Synthetic Control" critique:* This is the weakest link for Futarchy. Futarchy relies on *observable* outcomes. If the payout condition is $Y_{UK} - Y_{synthetic}$, traders are betting on the *model* of the synthetic control, not the real world. This introduces oracle risk. I must highlight this.

      *Refining the "Legitimacy" section:* The strongest opposite view isn't just "technocracy is good." It's that "expressive voting" is actually a bug of democracy, not a feature, and futarchy fixes the principal-agent problem where politicians promise things they can't deliver.

  9.  **Final Output Structure:**
      *   Intro: Acknowledge the thought experiment.
