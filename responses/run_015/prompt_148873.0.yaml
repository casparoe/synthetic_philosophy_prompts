answer: |-
  This is a rigorous stress test for futarchy. Applying Robin Hanson's governance model to Brexit exposes both the mechanical friction of the theory and the political reality it attempts to bypass.

  Here is the two-way case analysis, distinguishing between settled mechanics in market design and contested political economy claims.

  ### 1. The Mapping

  **The Players**
  In a futarchic Brexit, the roles decouple differently than in the 2016 referendum:
  *   **The Voters (Value Setters):** In standard futarchy, the electorate votes on the *utility function*, not the policy. In your scenario, they would vote on whether the goal is "Maximize Real Household Disposable Income" (your metric) or something else (e.g., "Minimize Immigration," "Maximize Legislative Sovereignty").
  *   **The Traders (Belief Aggregators):** This is the critical shift. In 2016, voters had to aggregate their own beliefs about economics and sovereignty. In futarchy, anyone with capital and information trades the policy outcomes. This includes global hedge funds, currency desks, and economic forecasters, not just UK citizens.
  *   **The Implementer:** The UK Government. Crucially, in futarchy, they are bound to execute the policy that the market prices highest against the metric.
  *   **The Oracle/Adjudicator:** An independent body responsible for calculating the metric five years later.

  **The Option Space**
  This is the first major friction point.
  *   **2016 Reality:** The ballot was `Remain` vs. `Leave`. `Leave` was a null set of policies.
  *   **Futarchy Requirement:** Markets cannot price vague concepts. The option space must be mutually exclusive and exhaustive *policies*. A futarchic ballot would have required specific treaty frameworks as the tradable assets: e.g., `Policy A: EEA Membership`, `Policy B: Customs Union`, `Policy C: WTO Terms`.
  *   **The EU as Player:** The EU is an external agent. In prediction market terms, they are a source of exogenous shock. However, because the EU reacts to UK policy, there is a game-theoretic layer: the EU might harden their stance if markets price a "WTO Terms" victory as highly likely. Futarchy assumes the policy is implementable; if the EU vetoes the winning policy, the system breaks.

  **The Metric: Workability and Breakage**
  You proposed: *Real household disposable income per head, five years out, scored against a synthetic-control UK.*

  *   **Settled Consensus:** Synthetic control methods (SCM) are standard econometric tools for policy evaluation (e.g., used by the OBR or Treasury). They are statistically robust *ex post*.
  *   **What Breaks for Futarchy:**
      1.  **The Counterfactual Oracle Problem:** Futarchy requires the payout condition to be *objectively verifiable*. A synthetic control is a *model*, not an observation. If the payout depends on $Y_{UK} - Y_{synthetic}$, traders are not betting on the UK economy; they are betting on the *specification of the synthetic control model*. This shifts the manipulation risk from the economy to the econometrics. Traders would lobby to include/exclude certain comparator countries (e.g., "Don't use Norway, they have oil") to sway the payout.
      2.  **Attribution/Confounding:** Five years out (2021), the UK economy was hammered by a global pandemic. A standard futarchy contract would need a "force majeure" or adjustment clause for exogenous shocks. Adding adjustment clauses introduces discretion. Discretion kills market trust.
      3.  **Liquidity Horizon:** Five years is an eternity for capital to be locked in a governance contract. While prediction markets exist for long-tail events, governance markets require deep liquidity to resist manipulation. It is **contested** whether policy markets can maintain liquidity over multi-year horizons without a secondary market that allows exit (which introduces its own pricing noise).

  ### 2. What Futarchy Says the Actors Faced

  **The Conditional Markets**
  In June 2016, you would have seen three primary contracts trading against your income metric:
  1.  $P(Income | Remain)$
  2.  $P(Income | Leave\_EEA)$
  3.  $P(Income | Leave\_WTO)$

  **The Prices**
  *   **Consensus View:** Given the consensus among economists (e.g., LSE, Treasury, IMF) that Leave would incur trade friction costs, the market price for `Leave_WTO` would likely have traded at a significant discount to `Remain`. `Leave_EEA` might have traded closer to parity.
  *   **The "Sterling Signal":** We actually saw a proto-futarchy signal. Sterling dropped ~10% overnight. Currency markets are prediction markets for economic health. The forex drop was the market pricing in a lower expected value for the UK economy under the *anticipated* (hard) Leave policy.
  *   **Authority of Price:** Would the price deserve authority?
      *   *Settled:* Prediction markets generally outperform polls and expert panels in binary events (elections, sports).
      *   *Contested:* Whether they work for *complex policy* where the outcome depends on implementation quality. A market might price `Leave_WTO` low not because the policy is bad, but because traders believe the UK government is incompetent at implementing it. This conflates *policy quality* with *bureaucratic capacity*.

  **Who Would Be In It?**
  In 2016, the "betting public" was effectively the bond and currency market. In a formal futarchy, you would invite speculators. The risk is **adverse selection**: The only people willing to bet against the "patriotic" narrative might be those with private information that the economy will tank (e.g., insiders planning capital flight). This creates a moral hazard where traders profit from national decline. This is a **contested** ethical objection in the literature; Hanson argues the profit is the fee for information, critics argue it incentivizes sabotage.

  ### 3. Where the Model Explains and Misdescribes

  **Where it Explains: The Cost of Ambiguity**
  Futarchy explains the "three years of paralysis" perfectly.
  *   **The Theory:** Governance fails when the contract (the mandate) is incomplete.
  *   **The Episode:** The 2016 vote was a contract for "Leave" without specifications. In mechanism design, this is an undefined state. The paralysis was the cost of trying to specify the policy *after* the value vote.
  *   **Futarchy's Fix:** Futarchy forces specification *ex ante*. You cannot bet on "Leave." You must bet on "Leave via Treaty X." This would have forced the Leave campaign to define their destination before the vote.
  *   **Settled vs. Contested:** It is **settled** in contract theory that incomplete contracts lead to dispute costs. It is **contested** whether political ambiguity is always a bug. Sometimes ambiguity allows coalitions to form (e.g., soft-Leavers and hard-Leavers uniting to win). Futarchy might have prevented the Leave victory entirely by fracturing the option space, which proponents see as a feature (preventing bad policy) and critics see as a bug (preventing democratic will formation).

  **Where it Misdescribes: The "Vibe" Vote**
  Futarchy misdescribes the motivation of the voters.
  *   **The Episode:** Many voters treated the referendum as expressive. Voting Leave was a signal of dissatisfaction with the status quo, not a literal instruction to maximize GDP.
  *   **The Model:** Futarchy assumes voters are *instrumental*. It assumes if you vote on a metric, you want that metric maximized.
  *   **The Mismatch:** If the public voted on your metric (Income), but actually cared about Sovereignty, the market would optimize for Income (likely Remain), and the public would feel disenfranchised. If the public voted on "Sovereignty" as the metric, the market might find that `Leave_WTO` maximizes sovereignty (legislatively) even if it tanks income.
  *   **The Specification Problem:** You asked if "undefined Leave" is a case the theory never anticipated. Hanson's theory anticipates it by forbidding it. But this reveals a limit: Futarchy works for *engineering* problems (how to get to X), not *ontological* problems (what is X?). If the electorate cannot agree on what "Leave" means, they cannot agree on the policy options to price. Futarchy pushes the disagreement upstream to the option-definition phase.

  ### 4. The Reverse Direction: What Brexit Teaches Futarchy

  **The Legitimacy Critique (Your Suspicion)**
  *   **Argument:** Democracy provides legitimacy through procedure, not just outcomes. People accept losing votes if they feel heard. In futarchy, if the market says `Remain` yields higher income, but the populace *values* the expressive act of leaving, the market overrides the expression.
  *   **The Lesson:** A price cannot deliver legitimacy. The "fight about who gets to decide" is the core of politics. Futarchy attempts to remove the "who decides" (by handing it to the market) which may solve the efficiency problem but exacerbates the legitimacy crisis. If the market picks a policy that hurts a specific demographic, they cannot blame a politician; they must blame "the math." This is politically brittle.
  *   **Status:** This is a **contested** view in political science. Some argue output legitimacy (good results) matters more than input legitimacy (voting).

  **The Strongest Opposite View (Technocratic Defense)**
  *   **Argument:** The legitimacy of the 2016 referendum was *illusory*. The public was asked to vote on a technical question (trade regimes) disguised as a values question. They were misled by promises (e.g., the £350m NHS bus) that were mechanically impossible.
  *   **Futarchy's Value:** Futarchy protects democracy from itself by separating *truth* (markets) from *values* (votes). It prevents politicians from selling impossible policies. If the market prices `Leave` as disastrous, the policy doesn't run, saving the public from the consequences of misinformation.
  *   **The Lesson:** The lesson isn't that futarchy lacks legitimacy, but that *referenda on complex technical matters lack validity*. Futarchy restores validity by ensuring only implementable, priced policies are enacted.
  *   **Status:** This is the core Hanson argument. It is **contested** whether it is desirable to insulate policy from "misinformed" public will.

  **Settled vs. Contested Summary**
  *   **Settled:** Prediction markets aggregate information better than committees. Incomplete contracts (undefined "Leave") cause implementation failure. Counterfactuals (synthetic controls) are model-dependent, not observed facts.
  *   **Contested:** Whether welfare can be reduced to a single metric (Income) without gaming. Whether policy markets can be liquid enough to resist manipulation by state actors. Whether "legitimacy" requires direct policy choice or if outcome-based legitimacy suffices.

  ### Conclusion

  Running futarchy over Brexit clarifies that the referendum failure was not primarily about *voting*, but about *specification*. Futarchy would have forced the Leave campaign to price specific treaty outcomes, likely revealing the economic cost of a Hard Brexit before the vote.

  However, the episode highlights futarchy's blind spot: it treats politics as an optimization problem. Brexit was, in part, a revolt against optimization (technocracy) in favor of agency (sovereignty). If the metric voted on was Income, futarchy works but ignores the voters' true pain point. If the metric was Sovereignty, futarchy works but might deliver economic pain the voters didn't price in. The "undefined Leave" wasn't just a badly run vote; it was a necessary ambiguity to hold a coalition together. Futarchy resolves the ambiguity, but in doing so, it might dissolve the coalition required to govern.
