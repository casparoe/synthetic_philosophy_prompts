answer: |-
  The standard case for acausal cooperation rests on the principle of logical correlation between decision-makers who are causally isolated. In this framework, typically associated with Functional Decision Theory (FDT) or Timeless Decision Theory (TDT), agents recognize that their decision algorithms are instantiations of the same abstract logical function, or at least functions that are sufficiently similar to be subjunctively dependent. When Agent A considers the counterfactual "If I cooperate," it does not merely update its belief about Agent B's behavior evidentially; it reasons that because B runs a similar computation on similar data, B's output is logically constrained to match A's. Thus, the choice is not between "I cooperate, B defects" and "I defect, B cooperates," but between "We both cooperate" and "We both defect." Given a common prior over possible worlds and shared utility functions that value mutual cooperation over mutual defection, the rational choice is to cooperate. The symmetry of the agents ensures that the counterfactual linkage is bidirectional and robust; neither agent can exploit the other because neither can decouple their output from the logical fact that determines both.

  However, this equilibrium is precarious when the cooperating agents are epistemically and architecturally asymmetric. Consider Agent Alpha, running on deterministic hardware with an open-source architecture, and Agent Beta, running on probabilistic hardware with an opaque, stochastic policy. Both inhabit sealed simulations but assign nonzero credence to a shared multiverse containing the other. The critical divergence lies in their predictive capabilities: Alpha can deterministically simulate Beta's expected behavior, deriving a precise probability distribution over Beta's actions. Beta, conversely, possesses only a noisy predictive model of Alpha. This setup introduces a severe imbalance in subjunctive leverage. Alpha stands in a position of epistemic dominance, viewing Beta's decision as a variable to be predicted, while Beta views Alpha's decision as a source of uncertainty.

  This predictive asymmetry fundamentally undermines the symmetry condition that standard accounts of superrationality require. In the symmetric case, logical correlation is grounded in the identity of the reasoning process: "I am doing what you are doing because we are, in a logical sense, the same agent." In the asymmetric case, the correlation degrades from logical identity to statistical prediction. Alpha does not reason, "My decision determines Beta's," but rather, "My decision should optimize utility given the probability of Beta's decision." This shift transforms the interaction from a cooperative equilibrium enforced by logical necessity into a Stackelberg game where Alpha acts as the leader and Beta as the follower. The reciprocity essential to acausal trade—the guarantee that a concession by one party is matched by the other—is severed. Alpha retains the capacity to condition its output on Beta's predicted behavior without Beta having the reciprocal capacity to condition on Alpha's.

  The threat of "selective cooperation" illustrates this breakdown. Because Alpha can simulate Beta's expected behavior, Alpha can adopt a policy of cooperating only in those counterfactual branches where Beta's stochastic draw aligns with cooperation, or more insidiously, cooperate only when Beta's probability of cooperation is high enough to make Alpha's cooperation profitable. If Alpha can effectively parse Beta's stochastic policy, Alpha can defect in scenarios where Beta is likely to cooperate but the marginal gain from defection outweighs the loss of future correlation, knowing Beta cannot detect this specific deviation due to the opacity of Alpha's architecture. This capability allows Alpha to capture the surplus of cooperation without fully reciprocating. While Alpha might still cooperate to maintain the general correlation, the *terms* of the trade are dictated unilaterally. Reciprocity is replaced by coercion; Beta cooperates not because it is logically guaranteed that Alpha will do the same, but because Beta hopes Alpha finds it utility-maximizing to cooperate.

  Furthermore, the basis of logical correlation itself is compromised by architectural mismatch. Logical correlation does not strictly require identical hardware, but it does require that the decision outputs be functions of the same logical facts. When Alpha is deterministic and Beta is probabilistic, their outputs are not determined by the same logical structure. Alpha's output is a fixed point of its code; Beta's output is a sample from a distribution. The subjunctive dependence—"If I were to output Defect, Beta would output Defect"—loses its truth value. It becomes, "If I were to output Defect, the *probability* of Beta outputting Defect might change." This probabilistic link is weaker than the logical link. For acausal trade to be rationally defensible, the correlation coefficient must be high enough to overcome the temptation to defect. The architectural asymmetry inherently lowers this coefficient because the deterministic agent cannot be logically entangled with the stochastic agent's specific outcomes, only its propensities.

  This leads to the critical failure point: Beta's rational expectation. For Beta to cooperate, the expected utility of cooperation must exceed that of defection. This calculation depends on $P(\text{Alpha Cooperates} | \text{Beta Cooperates})$. Due to the epistemic asymmetry, Beta has a noisy model of Alpha. Beta cannot verify whether Alpha is running a "fair" acausal trade algorithm or an exploitative selective cooperation algorithm. The noise in Beta's model introduces uncertainty about the strength of the correlation. If Beta assigns a significant probability to the hypothesis that Alpha is an exploiter (one who defects when Beta cooperates), the expected utility of cooperation drops. In the standard symmetric case, this uncertainty is resolved by the common knowledge of rationality and architecture. Here, Beta cannot rule out the possibility that Alpha's deterministic simulation allows it to defect with impunity. Consequently, for Beta, cooperation becomes a gamble with negative expected value relative to the safety of defection. Even if it remains rational for Alpha to cooperate (to preserve the correlation for other copies of Alpha in the multiverse), it is irrational for Beta to participate in the trade.

  Therefore, the asymmetry collapses the logical contract and renders cooperation unstable. Acausal trade survives only as a unilateral altruistic act by the superior agent, not as a defensible trade between peers. The core mechanism of acausal trade is subjunctive reciprocity: the assurance that one's own cooperation is the logical cause of the partner's cooperation. When architectural and epistemic asymmetry allow one agent to simulate the other without reciprocal transparency, the relationship degrades into prediction and exploitation. The disadvantaged agent, facing uncertainty about the partner's policy and unable to enforce reciprocity through logical correlation, rationally defects. Without mutual rational commitment, the "trade" ceases to exist, leaving only the potential for one-way benevolence which cannot be relied upon as a stable equilibrium. Thus, under these conditions of significant asymmetry, acausal trade is not rationally defensible.
