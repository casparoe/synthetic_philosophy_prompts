answer: |-
  # Specification for a Normative Theory of Post-Defeat Tribunal Legitimacy

  ## I. Desiderata and Consistency Conditions

  A normative theory adjudicating the legitimacy of the International Military Tribunal (IMT) and the International Military Tribunal for the Far East (IMTFE) must satisfy the following five desiderata. Each is framed not as a conclusion, but as a phenomenological constraint the theory must explain to avoid reductionism.

  ### 1. The Retroactivity Constraint (Nullum Crimen)
  *   **Phenomenon:** The tribunals prosecuted "Crimes Against Peace" and "Crimes Against Humanity" which lacked precise statutory definition in positive international law prior to 1945 (e.g., the Kellogg-Briand Pact renounced war but prescribed no penalties).
  *   **Requirement:** The theory must either (a) demonstrate that these norms existed as customary international law or natural law binding on individuals prior to the acts, or (b) provide a principled justification for overriding *nullum crimen sine lege* in this specific instance.
  *   **Reason for Requirement:** Without this, the tribunals violate the Rule of Law's core tenet: that conduct must be proscribed before punishment. A theory that ignores this reduces the tribunals to arbitrary command, stripping them of normative force beyond coercion.

  ### 2. The Selectivity Constraint (Victors' Justice)
  *   **Phenomenon:** The tribunals exercised jurisdiction only over Axis powers. Allied conduct (strategic bombing of Dresden/Tokyo, atomic weapons, Soviet aggression in Poland) was excluded from the charter's jurisdiction and not prosecuted.
  *   **Requirement:** The theory must distinguish between *procedural selectivity* (who sits in judgment) and *substantive injustice* (unequal application of law). It must explain why the exclusion of Allied crimes does not invalidate the convictions of Axis crimes.
  *   **Reason for Requirement:** Justice requires impartiality. If the theory cannot explain why trying only the losers is permissible, it concedes the "Victors' Justice" critique, rendering the proceedings indistinguishable from political purges.

  ### 3. The Agency Constraint (Individual vs. Collective)
  *   **Phenomenon:** Nuremberg utilized "criminal organizations" (e.g., the SS) to facilitate mass prosecution, while Tokyo focused more strictly on cabinet-level decision-making and command responsibility, rejecting broad organizational guilt.
  *   **Requirement:** The theory must delineate the metaphysical and legal basis for attaching criminal liability to individuals acting as state agents. It must account for why state sovereignty does not immunize officials, while simultaneously avoiding the punishment of individuals solely for membership (collective guilt).
  *   **Reason for Requirement:** Criminal law punishes moral agents, not abstractions. A theory that fails here either immunizes state terror (by hiding behind sovereignty) or violates human rights (by punishing association rather than intent/act).

  ### 4. The Defense Constraint (Tu Quoque)
  *   **Phenomenon:** Tokyo defendants argued *tu quoque* (e.g., Western colonialism, Allied bombing), claiming the victors were guilty of similar acts. These defenses were largely rejected.
  *   **Requirement:** The theory must justify the rejection of *tu quoque* defenses. It must establish whether the tribunal was assessing the *legality* of the act (which might be universal) or the *jurisdiction* over the actor (which was limited to the defeated).
  *   **Reason for Requirement:** Procedural fairness dictates that relevant evidence regarding the nature of the alleged crime should be admissible. Dismissing it *ad hoc* suggests the trial is a ritual of condemnation rather than inquiry.

  ### 5. The Authority Constraint (Source of Power)
  *   **Phenomenon:** The tribunals were established by the victorious powers (London Charter, Potsdam Declaration), not by a pre-existing global sovereign or universal treaty ratified by the defendants' states.
  *   **Requirement:** The theory must identify the source of the tribunal's normative authority. Is it derived from the surrender instruments (contract), the inherent rights of the international community (custom/universalism), or the necessity of restoring order (pragmatism)?
  *   **Reason for Requirement:** Legitimacy requires a valid grant of power. Without this, the tribunals are merely exercises of force, and their judgments bind no one's conscience.

  ---

  ## II. Stress-Test Case: The Neutral Propagandist State (1950)

  **Scenario:** In 1950, a new tribunal is convened by the UN (successor to the Allied powers). It seeks to try the leaders of **State Z**.
  *   **Status:** State Z was formally neutral during WWII.
  *   **Treaty Status:** State Z never ratified the Kellogg-Briand Pact (1928) nor the London Charter (1945).
  *   **Conduct:** State Z launched an aggressive war of conquest in 1949.
  *   **Internal Law:** Prior to the war, State Z's regime systematically incorporated the language of "Crimes Against Peace" and "Aggressive War" into its domestic constitutional propaganda and educational materials, explicitly acknowledging these concepts as binding moral-legal norms, despite lacking treaty obligation.

  **Question:** Must a theory satisfying the Desiderata above permit prosecution?

  **Analysis of the Theory's Foundation:**
  To maintain consistency with the vindication of Nuremberg/Tokyo (Desiderata 1 & 5), the theory **must permit prosecution**.

  *   **If the theory forbids prosecution:** It admits that Nuremberg was legitimate *only* because of the specific surrender instruments (contractual positivism). This undermines Desideratum 1 (Retroactivity), because if the London Charter was merely a contract between victors and vanquished, it could not create universal law. It renders Nuremberg a unique political exception, not a legal precedent.
  *   **If the theory permits prosecution:** It reveals the theory's foundation is **Moral-Universalist** (with a customary element). It argues that the prohibition on aggressive war had crystallized into a *jus cogens* norm binding on all states regardless of ratification by 1950 (and arguably by 1945). The "propaganda" element serves as evidence of *mens rea* and estoppel—the leaders knew the act was criminal by the standards they themselves promulgated.

  **Verdict:** A theory robust enough to justify Nuremberg as *justice* rather than *force* must prosecute State Z. If it does not, it concedes that Nuremberg was "Victors' Justice" legitimized only by the power to dictate surrender terms.

  ---

  ## III. Analysis of Requirements

  ### Non-Negotiable vs. Negotiable Desiderata

  **Non-Negotiable (Core Legitimacy):**
  1.  **The Agency Constraint (Individual Responsibility):** Any theory that permits collective punishment fails the basic definition of criminal justice.
  2.  **The Authority Constraint (Source of Power):** A tribunal without a normative source of authority is a lynch mob.
  3.  **The Retroactivity Constraint (Nullum Crimen):** This is the hardest constraint. A theory must address it directly; it cannot ignore it. It must either validate the pre-existence of the law or justify the exception.

  **Negotiable (Camp Preferences):**
  1.  **The Selectivity Constraint:** Strict positivists may accept selectivity as a political necessity of surrender. Natural lawyers may demand universal jurisdiction. A working theory can allow for "transitional selectivity" (trying the immediate threat first) without collapsing.
  2.  **The Defense Constraint (*Tu Quoque*):** A theory can arguably limit *tu quoque* based on jurisdictional scope (we are trying *you*, not *us*) without denying the universal wrongness of the act.

  ### Joint Unsatisfiability (The Central Result)

  There is a **logical tension between Desideratum 1 (Retroactivity/Nullum Crimen) and Desideratum 5 (Authority/Positivist Consent)**.

  *   **The Conflict:** If the theory adheres strictly to *nullum crimen sine lege* (Positivist), it must admit that Crimes Against Peace were not clearly codified for individuals prior to 1945. If it admits this, it struggles to find Authority (Desideratum 5) because the defendants did not consent to this new law.
  *   **The Unsatisfiability:** You cannot simultaneously hold that (A) the law was strictly pre-existing and positive (satisfying *nullum crimen*) AND (B) the tribunals were necessary to create new precedents for unprecedented evil (satisfying the historical reality).
  *   **Result:** Any adequate theory must accept a **Normative Gap**. It must acknowledge that the tribunals operated in a zone where positive law was insufficient, requiring a recourse to natural law or "higher law" to bridge the gap. A theory that claims perfect consistency with pre-1945 positive law is historically false; a theory that ignores *nullum crimen* is legally tyrannical.

  ### The Most Damaging Requirement

  **Desideratum 1 (The Retroactivity Constraint)** does the most damage to the most popular existing accounts.

  *   **Why:** It forces the theory to choose between legal honesty and moral vindication.
  *   **Strict-Positivist View:** **Fails.** It must concede the tribunals were technically illegal ex post facto exercises, legitimized only by the fact of victory. It saves legal consistency but sacrifices moral legitimacy.
  *   **Natural-Law View:** **Succeeds on Retroactivity, Fails on Selectivity.** It argues the law existed in conscience (satisfying Desideratum 1). However, it struggles to explain why this universal law was enforced only against the losers (Desideratum 2), risking charges of hypocrisy.
  *   **Hybrid Institutionalists (Customary Law):** **Best Fit, but Vulnerable.** They argue the law was "crystallizing" and the tribunals completed the process. This satisfies Desideratum 1 loosely. However, under the **Stress-Test (State Z)**, this view risks collapse. If the law was only crystallizing in 1945 via the London Charter, it may not bind a neutral non-signatory in 1950. To bind State Z, the Hybrid view must lean closer to Natural Law, exposing it to Positivist critique.

  **Conclusion:** The Retroactivity Constraint is the fulcrum. It reveals that the legitimacy of Nuremberg and Tokyo rests not on strict legality, but on a **declaratory theory of law**: the tribunals did not *make* law, they *declared* a pre-existing moral truth that positive law had lagged behind. Any theory that cannot sustain this declaratory claim collapses into "Victors' Justice."
