answer: |-
  **Materials:** 15 envelopes. 14 contain slips reading "Coin [A-N] is [Heads/Tails]" (matching coins sealed inside). 1 contains: "No one knows what is in this envelope." Whiteboard, marker.

  **Roles:** *Cartographer* (logs accepted truths on board), *Inspector* (opens envelopes), *Logic Judges* (the 3 CS auditors; verify moves comply with rules), *Class* (voters).

  **Charter of Inquiry:** "If a statement is true, it is possible for the Inspector to make it known to the class."

  **Rules of Inference:**
  1.  *Verification:* If the Inspector opens an envelope, the text inside is true.
  2.  *Publicity:* If the Inspector verifies a text, the class knows it.
  3.  *Consistency:* The class cannot know a statement is true while knowing it is unknown.

  **Timeline (90 mins):**
  *   **0–15:** Distribute envelopes. Class adopts Charter. Cartographer writes "Unknown Truths" on board. Class places all 15 envelopes under this header.
  *   **15–45 (Round 1):** Class asserts "Some truths are unknown." Inspector selects an ordinary coin envelope. Logic Judges confirm Charter permits inspection. Inspector opens it. Cartographer moves slip to "Known Truths." Class must concede this truth is no longer unknown. Repeat until only the self-referential envelope remains. Inspector targets it. Opening it makes the text false (since now everyone knows it). Class faces contradiction: either the text was false (so not a truth) or the Charter failed. To save the Charter, Class must concede no unknown truths existed initially.
  *   **45–55:** Break.
  *   **55–75 (Round 2):** Restrict Charter: "If a statement is true and does not mention knowledge, the Inspector can make it known." Class restores envelopes. Inspector verifies coin envelopes successfully. The self-referential envelope is now immune (it mentions knowledge). The category "Unknown Truths" can now contain the self-referential card without contradiction.
  *   **75–90:** Debrief.

  **Debrief:**
  Map the Charter to the Knowability Principle ($\forall p(p \rightarrow \diamond Kp)$). Map Round 1's emptying of "Unknown Truths" to the derivation of Omniscience ($\forall p(p \rightarrow Kp)$). Highlight that the collapse occurred on ordinary cards before the self-referential one appeared; the specific card merely finalized the contradiction. Introduce "Fitch's Knowability Paradox." Discuss Round 2's restriction as the standard anti-realist escape (limiting knowability to non-epistemic truths) versus conceding an omniscient knower (theological/idealistic response).

  **Predictable Failures:**
  1.  *Semantic Drift:* Students will argue "known" means "justified" rather than "written on board." *Fix:* Cartographer's log is the sole definition of knowledge for the game.
  2.  *CS Formalization:* Judges may stall play proving soundness. *Fix:* Task them with translating the Charter into predicate logic *during* the break, to present in debrief.
  3.  *Liar Dismissal:* Students will reject the self-referential card as pathological. *Fix:* Remind them Round 1 collapsed ordinary coin truths too; the Charter forced all unknowns to become known, leaving only the pathological case as the final witness.

  **Limitation:**
  The game cannot reproduce the modal step ($\diamond K \rightarrow K$). In the argument, possible knowledge entails actual knowledge via logical derivation. In the game, the Inspector's *action* actualizes the possibility. You must write on the board that the Charter's permission functions as the modal collapse: by granting the right to know any truth, the game treats "possible to know" as "will be known." This operationalizes the logical squeeze but hides the modal nuance.
