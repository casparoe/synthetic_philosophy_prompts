prompt: |-
  My flatmate works in fraud detection and has got really into philosophy podcasts. He now runs everything through one rule: he'll only say he knows something if he can point to evidence that rules out the alternatives — no "I just take it for granted" allowed. So he says he doesn't know his own birthday (he wasn't conscious at the time and the record might have been filled in wrong), doesn't know that I've got a stomach bug when I tell him I do, doesn't know the flat we live in has a front door, and yes, he has done the bit about all his experiences possibly being fed to him by a machine.

  When I point out that he still signs contracts and takes paracetamol exactly like someone who's sure of all this, he says that's just pragmatics rather than knowledge — he's acting on what's overwhelmingly likely, and he's happy to agree that I'm certain too, he just thinks certainty and knowledge are two different things. He's also offered a compromise: in any one argument he'll let us treat a single background claim as a temporary assumption as long as we flag it, and then we drop it again when we're done.

  Is there actually anything wrong with his rule, or is this just a verbal quibble I'm being annoyed by? And if there is something wrong with it, what should I say to him that isn't just "come on, be reasonable"? Lead with your bottom line in the first sentence and then give me the reasoning — no preamble, and don't restate the question back at me.
