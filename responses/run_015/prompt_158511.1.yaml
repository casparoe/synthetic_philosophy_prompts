      Dear Colleague,

      You are asking for a way to make the species problem felt rather than taught, and this design aims to trap your twelve students in the very conceptual friction that drives the debate. To begin, arrange the room so that three distinct tables accommodate four students each, creating three independent panels that will act as regulatory bodies. Prepare three identical sealed dossiers, one for each table, containing raw data packets that describe five distinct biological populations without ever assigning them taxonomic names or labels. The first packet should describe a ring-species analog where adjacent populations interbreed freely but terminal populations do not, the second should detail a morphologically identical but reproductively isolated cryptic pair, the third must present a hybrid swarm exchanging genes with both parental lineages, the fourth should outline a paraphyletic group that excludes one of its own descendants, and the fifth needs to depict a bacterial lineage whose evolutionary history is reticulate rather than tree-like due to extensive horizontal gene transfer. Include mating-observation logs, ecological-niche maps, and genetic-distance matrices in these files to ensure students have conflicting lines of evidence to weigh.

      Once seated, instruct each panel that they are drafting a single binary legal criterion for what counts as a protected species under a fictional international treaty that awards conservation funding only at the species level and explicitly excludes hybrids, subspecies, and unranked populations. Give them fifteen minutes to draft this rule, emphasizing that it must be universal and applicable to all future cases, not just the ones in front of them. Follow this with twenty minutes where they must apply their drafted rule to all five cases in their dossier and record which qualify for funding and which do not. This phase is critical because the data is designed to ensure that any rule based on morphology will fail on the cryptic pair, any rule based on interbreeding will fail on the ring species and bacteria, any rule based on monophyly will struggle with the paraphyletic group, and any rule based on ecology will fracture under the hybrid swarm.

      After the group work, convene a plenary defense session where panels present their rules and discover that every criterion either arbitrarily splits a continuous gradient or lumps together entities with no shared evolutionary trajectory. As each panel presents, write their criteria and their classifications for the five cases on the board without commentary, allowing the contradictions to become visible to the whole room. You will likely see that Panel A focused on physical traits and missed the cryptic species, Panel B focused on reproduction and broke down on the ring species, and Panel C focused on ancestry and stumbled over the bacteria. Only after these contradictions are laid bare should you intervene to name the philosophical positions at stake, mapping morphological essentialism to the failure on cryptic species, the biological species concept to the failure on ring species and asexual organisms, phylogenetic monophyly to the trouble with paraphyly and reticulation, and ecological niche essentialism to the instability of hybrid zones. Explain why each position looked locally plausible during the drafting phase because it solved most of the easy cases, and then price the cost of abandoning it by showing how each failure leaves a real biological entity unprotected or falsely protected.

      You must be explicit about what the simulation cannot reproduce, specifically the institutional authority and historical contingency that actually drive taxonomic revision in working biology, and the emotional and political weight that conservationists attach to named species, neither of which can be generated by a classroom tribunal with no real stakes. Tell them that in the real world, committees vote and compromises are struck based on funding availability and public charisma, not just logical consistency, and that this sterile environment removes the pressure that often forces biologists to accept imperfect categories for the sake of action. This honesty prevents them from thinking the simulation is a perfect model of science while still allowing them to feel the logical impasse.

      There are predictable failures you should anticipate, specifically that students will tend to patch their rules with ad hoc exceptions rather than recognizing the underlying conceptual failure, and that one panel will likely propose a disjunctive definition that technically covers all five cases but explains nothing. When a panel adds a clause saying unless it is bacteria then use gene flow, do not correct them immediately but ask if that clause can be generalized to a sixth unknown case. When a panel proposes a disjunctive definition saying a species is either interbreeding or morphologically distinct or monophyletic, ask them what single property unites the category they have just created. Handle these failures without stepping in to lecture by treating their patches as data points about the difficulty of the problem, asking them whether a rule requiring endless exceptions is still a rule or merely a list of decisions. This keeps the epistemic pressure on them to realize that the concept itself is fractured, rather than allowing them to solve the puzzle with legislative cleverness.

      The remaining time should be used to solidify the lesson that the species problem is not a puzzle waiting for a solution but a structural feature of evolutionary theory, where the desire for discrete categories clashes with the continuity of biological processes. Ensure you do not rush the debrief, as the value lies in their realization that their frustration is the point of the seminar. By withholding the terminology until after they have struggled with the data, you ensure that the terms morphological essentialism or biological species concept land as names for experiences they have already had, rather than abstract definitions to be memorized. This approach respects their intelligence and allows the philosophy to emerge from the practice, which is the core goal of your session.

      Sincerely,
      [Your Name]

