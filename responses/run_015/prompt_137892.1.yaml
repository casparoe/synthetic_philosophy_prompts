prompt: |-
  Hi — I cover science and ideas for a living, and once a year I guest-teach a semminar for science-writing grad students, which means I end up marking their take-home exercises. I'd rather not screw this one up, so I'd like a second read on a single answer before I hand it back.

  The question I set was:

  In no more than 400 words, explain the spandrels critique of adaptationism (Gould and Lewontin, 1979) to a general reader without caricaturing it. Give one biological example of a trait that might be a spandrel, and say what would have to be true for that example to work.

  Here is one student's answer:

  Adaptationism is the habit of taking each feature of an organism separately and asking what problem natural selection designed it to solve. Gould and Lewontin's 1979 paper, The Spandrels of San Marco and the Panglossian Paradigm, attacked this as an unreflective research programme, and compared adaptationists to Voltaire's Dr Pangloss, for whom everything is for the best in this best of all possible worlds.

  Their central point is about by-products. The spandrels of the title are the tapering triangular patches of masonry you necessarily get when you set a dome on four rounded arches: nobody designed them, they just fall out of the geometry, and only afterwards did the mosaicists of St Mark's fill them with figures. In the same way, plenty of features of organisms are not there because selection built them for a job, but because they come along for free with something else — a change in overall size, a shared developmental programme, what the lineage happened to inherit. And since a spandrel is by definition not a product of selection, it is invisible to selection and can never afterwards be shaped or refined by it; a by-product is stuck with whatever form it happens to have. If it does turn out to be useful later on, it becomes an exaptation — Gould and Vrba's term — so spandrel and exaptation are really two names for the same thing, just viewed at different stages of the trait's history.

  A good example for a general reader is the nipples of male mammals. The basic mammalian body plan is laid down before sexual differentiation kicks in, so males have nipples not because nipples ever did anything for males but as a consequence of a developmental programme shared with females. What has to be true for this to work is that nipples in males are not currently doing any work and did not arise because of anything they did for males.

  None of this denies that selection is the main source of adaptive complexity. The paper is a plea for pluralism: check the alternatives and test the adaptive story instead of assuming it.

  Could you grade this as if you were me? Give it a mark out of 20, and more importantly the specific marginal comments I should write back: what is right, what is shaky, and where I should push back. Please don't just tell me whether you thought it was good overall — I need something point by point that I can actually hand to the student.
reasoning: |-
  Here's a thinking process that leads to the suggested grading and feedback:

  1.  **Analyze the Request:**
      *   **User Role:** Science writer/journalist who guest-teaches a science-writing grad seminar.
      *   **Task:** Grade a specific student answer to a take-home exercise.
      *   **Constraint:** The user wants a "second read" to avoid screwing up. They need a mark out of 20 and specific marginal comments (what's right, what's shaky, where to push back).
      *   **The Prompt Given to Student:** Explain the spandrels critique of adaptationism (Gould & Lewontin, 1979) to a general reader (max 400 words), without caricaturing it. Give one biological example of a spandrel and state what must be true for that example to work.
      *   **The Student's Answer:** Provided in the prompt.
      *   **My Role:** Act as the experienced science-writing instructor providing feedback.

  2.  **Analyze the Student's Answer:**
      *   **Word Count:** Let's check. It looks to be around 280-300 words. Well under the 400-word limit. Good.
      *   **Clarity/Style:** Clear, concise, professional tone. Good use of analogy (San Marco).
      *   **Content Accuracy (The Science):**
          *   *Definition of Adaptationism:* "habit of taking each feature... asking what problem natural selection designed it to solve." -> Accurate enough for a general summary.
          *   *G&L Critique:* "unreflective research programme," "Panglossian." -> Accurate.
          *   *Spandrel Analogy:* "tapering triangular patches... necessarily get when you set a dome on four rounded arches." -> Accurate architectural description.
          *   *Biological Mechanism:* "come along for free with something else... change in overall size, shared developmental programme." -> Accurate.
          *   *Crucial Error:* "since a spandrel is by definition not a product of selection, it is invisible to selection and can never afterwards be shaped or refined by it." -> **This is scientifically incorrect.** This is a major misconception. Spandrels *can* be co-opted later (exaptation), but the statement "invisible to selection and can never afterwards be shaped" contradicts the very concept of exaptation and secondary selection.
          *   *Exaptation Definition:* "so spandrel and exaptation are really two names for the same thing, just viewed at different stages..." -> This is shaky/oversimplified. A spandrel is the *origin* (non-adaptive byproduct). An exaptation is a trait *currently* useful but not originally selected for that use. A spandrel *can become* an exaptation, but they aren't synonyms.
          *   *Example:* Male nipples. -> Classic example. Generally accepted as a developmental byproduct.
          *   *Condition for Example:* "nipples in males are not currently doing any work and did not arise because of anything they did for males." -> The "did not arise" part is correct. The "not currently doing any work" part is risky. If they *are* doing work now (even trivial), they could be exaptations. But for a *spandrel* classification, the key is the *origin*. The student conflates current utility with origin.
          *   *Conclusion:* "plea for pluralism." -> Accurate summary of G&L's intent.

  3.  **Determine the Grade:**
      *   **Strengths:** Writing style is excellent. Clear, concise, hits the word limit. Captures the *spirit* of G&L well (Pangloss, architectural analogy, pluralism).
      *   **Weaknesses:** A significant conceptual error regarding selection acting on spandrels later. The definition of exaptation vs. spandrel is muddled.
      *   **Calculation:**
          *   Writing/Clarity: 9/10
          *   Accuracy/Science: 6/10 (The error about selection never shaping spandrels is a big deal in evolutionary biology).
          *   Task Completion: 5/5 (Answered all parts, word count).
          *   Total: ~20/20 scale? Let's say 15 or 16 out of 20. It's a "Good but flawed" answer. Given it's a grad seminar for science writers, accuracy is paramount. I'll lean towards 16/20 because the writing is very good, but the science error prevents a high distinction. Actually, 15/20 feels more appropriate for a fundamental misunderstanding of how selection interacts with byproducts. Let's settle on 15/20.

  4.  **Drafting the Feedback (Marginal Comments):**
      *   *Tone:* Constructive, professional, encouraging but rigorous.
      *   *Specific Points:*
          1.  **Praise:** The opening definition of adaptationism is crisp. The San Marco analogy is well-handled.
          2.  **The Big Error:** The claim that spandrels are "invisible to selection and can never afterwards be shaped." This needs correction. Selection *can* act on them later (secondary adaptation).
          3.  **Spandrel vs. Exaptation:** Clarify the relationship. They aren't just "two names." One describes origin, the other describes current utility vs. origin.
          4.  **The Example:** Male nipples is good. The condition "not currently doing any work" is too strong. They just need to not have been *selected for* originally.
          5.  **Style:** Commend the conciseness.

  5.  **Refining the Feedback for the User:**
      *   The user asked me to "grade this as if you were me" and give "specific marginal comments I should write back."
      *   I need to structure this so the user can copy/paste or easily translate it into their own grading sheet.
      *   I should explain *why* I'm giving this feedback so the user understands the scientific nuance (since they are a writer, not necessarily a biologist, though they cover science).

  6.  **Self-Correction/Double Check:**
      *   *Did G&L say spandrels can't be selected later?* Gould later clarified this a lot. In the 1979 paper, they emphasize the *origin*. But saying "never afterwards be shaped" is definitely wrong. Gould & Vrba (1982) introduced exaptation specifically to handle traits that originate as byproducts (spandrels) and later become useful. If a spandrel *never* gets shaped by selection, it can't really become a complex exaptation.
      *   *Is male nipples a spandrel?* Yes, generally considered a developmental constraint/byproduct.
      *   *Is the student's definition of exaptation wrong?* Yes. "Two names for the same thing" is misleading. A spandrel is a *type of origin*. An exaptation is a *functional status*. A trait can be a spandrel and *not* an exaptation (if it remains useless). It can be a spandrel and *become* an exaptation.
      *   *Word Count Check:* 296 words. Perfect.

  7.  **Finalizing the Output:**
      *   Start with the Grade.
      *   Provide the "Marginal Comments" broken down by section/paragraph.
      *   Add a "General Note" for the instructor (the user) explaining the scientific nuance so they feel confident defending the grade.

      *(Self-Correction on Grade)*: 15/20 might feel harsh for a writer. But for a *science* writing grad student, accuracy is the job. If they get the evolutionary mechanism wrong, they misinform the public. I will stick with 15/20 but emphasize the writing quality is higher than the science accuracy.

      *Wait, one more check:* The prompt asks "what would have to be true for that example to work." The student wrote: "nipples in males are not currently doing any work." Technically, for it to be a *spandrel*, it must not have been selected for *originally*. Current utility makes it an *exaptation*. If it has *no* utility now, it remains a spandrel (or a vestige). The student's condition is slightly off. I need to highlight this distinction.

      *Okay, ready to write.*
answer: |-
  Here is a grading breakdown and a set of marginal comments you can use.

  **Grade: 15/20**

  **Rationale:** The writing is crisp, the architectural analogy is clear, and you stayed well within the word limit. However, there is a significant conceptual error regarding how selection interacts with spandrels *after* they arise. In science writing, mechanistic accuracy is as important as narrative flow.

  ### Marginal Comments

  **Paragraph 1**
  *   **Good:** "Adaptationism is the habit of taking each feature... separately." This is a very clear, accessible definition for a general reader.
  *   **Good:** The Pangloss reference is appropriate and contextualized well.

  **Paragraph 2**
  *   **Shaky:** "since a spandrel is by definition not a product of selection, it is invisible to selection and can never afterwards be shaped or refined by it."
      *   *Push back:* This is scientifically incorrect. A trait can originate as a non-adaptive byproduct (spandrel) and *later* be co-opted and refined by natural selection. That is the whole point of "exaptation." If selection could never touch it, complex exaptations wouldn't exist.
  *   **Shaky:** "so spandrel and exaptation are really two names for the same thing..."
      *   *Push back:* Be careful here. They describe different aspects of a trait's history. A spandrel refers to the *origin* (byproduct). Exaptation refers to the *current utility* vs. *original origin*. A spandrel that remains useless is not an exaptation.
  *   **Good:** "change in overall size, a shared developmental programme." This correctly identifies the mechanisms that produce spandrels.

  **Paragraph 3**
  *   **Good:** Male nipples are a standard, recognizable example for a general audience.
  *   **Shaky:** "What has to be true... is that nipples in males are not currently doing any work..."
      *   *Push back:* For it to be a spandrel, the key condition is that they did not *arise* due to selection. They could theoretically do work now (making them exaptations), but to remain a pure spandrel example, you usually argue they are neutral. However, the stricter requirement is about the *origin*, not just current utility.

  **Paragraph 4**
  *   **Good:** "plea for pluralism." This captures the ultimate goal of the 1979 paper accurately. It wasn't an attack on selection, but on monocausal thinking.

  ### General Note for the Student (Optional Cover Comment)
  "You have a real gift for concise explanation; the San Marco analogy is handled better here than in many undergraduate biology essays. However, you have hardened Gould and Lewontin's argument into a rule that selection *cannot* act on byproducts. Gould's later work (specifically with Vrba on exaptation) clarifies that selection can co-opt spandrels later. Distinguishing between a trait's *origin* and its *current utility* is the hardest part of this topic, but it's essential for accuracy."

  ***

  ### Instructor-to-Instructor Note (For your eyes only)
  I graded this down primarily on the sentence: *"invisible to selection and can never afterwards be shaped or refined by it."*

  This is a common misconception. G&L (1979) were arguing against the *assumption* of adaptation, not the possibility of secondary selection. If a spandrel could never be shaped by selection, it could never become complex. The student's conflation of "spandrel" (origin) and "exaptation" (current use) is the specific technical error. Since this is a grad seminar for science writers, I think it's important to flag that distinction; otherwise, they might publish a piece implying evolution can't "fix" or "use" accidental traits later on.

  The writing quality itself is easily 18/20 or 19/20 material, but the science error prevents a high distinction in a science-writing context. 15/20 signals "Good writing, needs research correction."
