answer: |-
  **MEMORANDUM**

  **TO:** Assessment Review Committee
  **FROM:** [Your Name/Role]
  **DATE:** October 26, 2023
  **SUBJECT:** Decision on CS Department "Debate Grading" Pilot Proposal

  **Decision:** Approve with Conditions

  The Committee grants conditional approval for the Computer Science department's two-semester pilot of AI-mediated debate grading. This decision is not an endorsement of the current protocol as sufficient for high-stakes assessment, but a recognition that the status quo—where inter-rater reliability hovers around two-thirds and audits are rare—is unacceptable. However, approval hinges on resolving the central epistemic risk: whether a non-expert judge can distinguish truth from rhetorical fluency.

  **The Core Epistemic Question**
  The proposal's validity rests on a specific assumption: that a human judge, unfamiliar with the course material, can reliably select the correct argument between two AI agents. Our concern is that without subject mastery, the judge is not tracking the factual accuracy of the code or logic, but rather the confidence and coherence of the presentation. If the judge selects the more persuasive debater rather than the correct one, we are no longer grading computer science; we are grading rhetoric.

  This brings specific meaning to the critique that debate "pushes the problem up a level." It does not eliminate the need for expertise; it relocates it. In this pilot, expertise is required not to write the code, but to evaluate the arguments *about* the code. If the judge lacks the domain knowledge to identify a plausible-sounding fallacy, the system systematizes error. The CS department's claim that adversarial setup decorrelates errors is insufficient against the stats committee's warning that shared base models create shared blind spots. If both debaters fail to raise a specific technical objection because their training data omits it, the judge cannot rule on evidence never presented.

  **Conditions for Continuation**
  To mitigate these risks, the pilot must proceed under the following strict conditions. Failure to meet these metrics will result in immediate termination of the protocol.

  1.  **Falsifiable Accuracy Metric:** The department must implement a "shadow grading" audit on 15% of all debated items. These items will be graded independently by a subject-matter expert (instructor or senior TA) who is blind to the debate verdict.
      *   **Stop Signal:** If the debate verdict matches the expert grade on less than 75% of items where the AI debaters disagreed on *rubric weighting* (as opposed to clear factual errors), the pilot terminates. This specifically tests whether the judge is tracking truth or merely resolving obvious errors.
  2.  **Judge Incentive Structure:** The current plan to use TAs whose hours might be reduced by this technology as the judges introduces a confounding variable. Judges must be recruited from outside the pool of TAs potentially displaced by this efficiency gain, or their compensation must be guaranteed regardless of the pilot's outcome.
  3.  **Interaction Constraints:** We accept the proposal to restrict follow-up questions to a fixed menu of templates. Free-form questioning degraded accuracy on rubric-weighting disputes by allowing debaters to reframe criteria mid-stream. This restriction must be strictly enforced in the code.
  4.  **Routing Transparency:** The department claims efficiency gains by routing only high-disagreement items to debate. However, data showed the system performs best on obvious disagreements. The pilot must log the time spent on every item. If the total human-hours (judge time + setup) exceed the traditional grading baseline for the same cohort, the efficiency claim is falsified, and the protocol must be revised.

  **Timeline and Review**
  The pilot will run for the proposed two semesters (Spring and Fall 2024). A mid-point review will occur after the Spring semester finals. The CS department must submit the shadow grading data and time-log analysis by June 15, 2024. The Committee will reconvene within two weeks of data submission to determine if the Stop Signal has been triggered.

  **Conclusion**
  We acknowledge that rejecting this proposal maintains a flawed status quo. The current system lacks reliability and scalability. However, adopting a new system that swaps grading inconsistency for rhetorical bias is not an improvement. This conditional approval allows the university to test whether AI debate can genuinely augment assessment integrity without compromising the validity of the grades awarded. The burden of proof remains on the department to demonstrate that the judge is evaluating the student's knowledge, not the AI's fluency.

  **Approved:** [Signature]
