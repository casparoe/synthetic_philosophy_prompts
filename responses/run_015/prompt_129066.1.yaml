answer: |-
  Mill reconciles the apparent contradiction between condemning aggressive war and permitting unprovoked war by conditioning the applicability of international morality on the cultural status of the nations involved. Based on the passage, Mill would characterize the initial humanitarian stage of mandate slippage as one of the "allowable cases" of unprovoked war, since it occurs without the intervening nation being attacked and aims at protection rather than territory or revenue. However, he would characterize the later regime-change stage as criminal, because expanding the operation to impose a new government constitutes "forcing our ideas on other people" and compelling them "to submit to our will," which he explicitly equates with the injustice of aggressive war. The distinction between civilized nations and barbarians changes the analysis decisively: Mill asserts it is a "grave error" to assume the same moral rules apply between civilized nations as between civilized and barbarian nations, implying that while regime change is criminal between civilized peers, the different rules governing interactions with "barbarians" may render such imposition of will permissible.

  Mill resolves the tension between prohibiting aggressive war and allowing unprovoked intervention by restricting equal moral obligations to civilized nations, thereby marking mandate slippage as criminal only when the target nation is considered civilized.
