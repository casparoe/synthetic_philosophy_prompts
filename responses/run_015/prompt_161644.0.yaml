      *   *Normative vs. Descriptive:* "it ought to be allowed him." Hobbes is arguing about the *Right of Nature*. In the state of nature, there is no law. "Right" means liberty to do what is necessary for self-preservation. So, it's not "morally good" in a civilized sense, but "rationally justified" given the goal of survival.

