      *   If the user is a Naturalist Realist, the Replay is more threatening. But then, how do we "read off" the facts independently?
      *   So, the "Fatal" objection is: **The Replay presupposes the falsity of the very view it's testing.**

  7.  **Refining the "Parallel Domain" Objection:**
