  **The First Case**

  Elena is a project manager at a logistics firm. Her director announces that any employee who submits a finalized "Weekly Action Plan" by midnight will receive a significant performance bonus. The plan must list specific tasks for the following day, including attendance at a noon webinar. Elena knows the webinar is useless: it offers no certification, no one tracks attendance, and it conflicts with no other duties, but watching it provides no value. She also knows that once the bonus is deposited at midnight, she will have absolutely no reason to attend the webinar tomorrow. However, to secure the bonus, she must submit the plan now. Elena submits the plan listing the webinar. She has thereby adopted attendance as an element of her plan, closing deliberation about whether to include it. However, because she knows she will have no reason to follow through once the money is safe, she does not believe she will actually attend. She expects to ignore the plan tomorrow morning.

  **The Second Case**

  Elena is a project manager at the same firm. Her director announces that any employee who submits an accurate "Capacity Forecast" by midnight will receive a significant performance bonus. The forecast requires estimating the likelihood of attending specific optional events the following day, including the noon webinar. Accuracy is verified later; lying about expectations yields no bonus. Elena knows the webinar is useless and that she will have no reason to attend tomorrow. However, she also knows that tomorrow at noon she will be at her desk with no competing demands, and the cost of clicking the link is negligible. She predicts she will likely attend simply to clear the notification, though she refuses to treat this as a settled commitment because she wants to remain free to skip it if a urgent call arises. She submits the forecast marking attendance as "Certain." She believes she will attend, but she has not settled the question of whether to attend; she keeps her deliberation open.

  **Analysis**

  **Case 1 Verdicts:**
  *   **Candidate Intention:** To attend the webinar.
  *   **SP Account:** Elena does not believe she will attend (she expects to ignore the plan). Since SP requires belief, SP verdict is **Cannot Intend**.
  *   **PS Account:** Elena has submitted a plan, adopting attendance as a constraint on her future scheduling. She has closed deliberation. Since PS requires settlement, PS verdict is **Can Intend**.

  **Case 2 Verdicts:**
  *   **Candidate Intention:** To attend the webinar.
  *   **SP Account:** Elena believes she will attend (based on low cost and lack of conflict). She is rational and has reason to predict accurately. Since SP counts belief + rationality as intention, SP verdict is **Can Intend**.
  *   **PS Account:** Elena has explicitly refused to settle the matter, treating her statement as a forecast rather than a plan. She constrains nothing. Since PS requires closing deliberation, PS verdict is **Does Not Intend**.

  **The Feature:**
  The structural feature doing the work is **the institutional function of the required statement**. In the First Case, the statement functions as a **Commitment** (a plan that normatively binds the agent's future scheduling). In the Second Case, the statement functions as a **Forecast** (a prediction that aims at accuracy but imposes no normative constraint).

  **Flipping the Feature:**
  If we flip the feature in the First Case (treating the Plan as a mere Forecast), Elena would no longer be settling the question, only predicting. PS would then return *Does Not Intend*. If she predicts accurately based on her knowledge of her own idle time, SP would return *Can Intend*. This converts Case 1 into Case 2. If we flip the feature in the Second Case (treating the Forecast as a Commitment), Elena would be settling the question. PS would return *Can Intend*. Knowing she will break the commitment due to lack of reason, she would not believe she will act, so SP would return *Cannot Intend*. This converts Case 2 into Case 1.

  **Objections and Repairs:**
  A defender of SP might attack Case 2, arguing that Elena's belief is merely a spectator's prediction about her own behavior, not an intention-constituting expectation. They might claim that without settlement, the belief is detached from agency. However, this repair risks being ad hoc: SP defines intention via belief, and Elena's belief is first-personal and rational. Distinguishing "agent belief" from "spectator belief" without appealing to settlement (which is PS's territory) leaves SP without a clear criterion.

  A defender of PS might attack Case 1, arguing that a resolution known to be ineffective cannot be an intention because intention *normally* guides action. They might claim that knowing one will not be guided voids the settlement. However, this repair is also vulnerable. PS defines intention as settling the question; guidance is a normative consequence, not necessarily a constitutive condition. If an agent settles but knows they will fail, PS can maintain they intended but failed, whereas SP must say they never intended at all. The PS defense here is more principled, relying on the distinction between forming a plan and executing it.

  **Conclusion:**
  This pair demonstrates that belief about one's future action is neither necessary nor sufficient for intention. In the First Case, the agent intends (on the PS account, which captures the commitment aspect) without believing she will act. In the Second Case, the agent believes she will act (satisfying SP) without intending (on the PS account, which captures the normative commitment). If we accept that the First Case involves a genuine intention (making a plan one knows one might break is still planning) and the Second does not (predicting one's behavior is not deciding), then intention is not constituted by belief. Instead, intention appears to be constituted by the normative settlement of practical deliberation, which can exist without predictive confidence, while predictive confidence can exist without normative settlement.
