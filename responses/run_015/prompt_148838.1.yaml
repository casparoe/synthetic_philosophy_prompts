  Here's the draft you asked for. I've kept it all in British English and left it a bit rough around the edges as requested. Hope this fits the brief for your third-years.

  ***

  ### PHI304: Philosophy of Language – Final Examination
  **Time Allowed:** 60 Minutes  
  **Expected Word Count:** Approx. 1200 words  
  **Instructions:** Answer ONE question.

  **Question 1: The Gradient Earth Scenario**

  Hilary Putnam's classic Twin Earth thought experiment relies on a sharp binary distinction: on Earth, 'water' refers to H₂O; on Twin Earth, 'water' refers to XYZ. The intuition pump works because the chemical structures are distinct, and the speakers are molecule-for-molecule identical internally. This supports semantic externalism—the view that meaning ain't in the head. Tyler Burge's arthritis example later reinforced this by showing social environment determines content, not just physical chemistry.

  However, consider a modification: **Gradient Earth**.

  Imagine a planet where the clear, drinkable liquid in lakes and taps does not switch abruptly from H₂O to XYZ across a border. Instead, it varies continuously across regions. In Region A, the liquid is 100% H₂O. In Region Z, it is 100% XYZ. In between, there are hundreds of regions where the chemical composition shifts gradually (e.g., Region M contains a stable mix, or a distinct compound structurally halfway between the two). Inhabitants are internally identical across these regions and use the word 'water' indiscriminately. Crucially, due to the gradual shift, an inhabitant moving from Region A to Region B cannot perceptually detect the change in chemical composition, nor is there a sharp linguistic boundary where 'water' stops applying.

  **Essay Task:**
  Does the Gradient Earth scenario undermine the standard Twin Earth argument for semantic externalism, or does it merely force us to refine the theory? Specifically, discuss whether this case requires us to 'indexicalise' externalism—such that the content of 'water' depends on the speaker's actual position in the chemical gradient rather than a binary Earth/Twin comparison. In your answer, you must:
  1.  Analyse why the continuous nature of the gradient threatens the binary intuition behind Putnam's original argument.
  2.  Evaluate whether an indexicalised version of externalism can save the phenomenon without collapsing back into internalism.
  3.  Address at least one serious objection to your position (for example, that the gradient actually strengthens externalism by showing environment-dependence is continuous rather than discrete).

  *Note: Simply reciting Putnam's original case or Burge's arthritis example without engaging the specific mechanics of the Gradient Earth scenario will result in a lower grade.*

  ***

  ### Model Answer (Draft for Markers)

  The Gradient Earth scenario does not refute externalism, but it does expose a simplification in Putnam's original binary setup. The standard Twin Earth argument relies on a clear-cut distinction: H₂O here, XYZ there. This makes it easy to say extension determines intension. However, Gradient Earth introduces a sorites-like vagueness. If chemical composition shifts continuously, there is no precise point where 'water' switches reference. This threatens the binary intuition because externalism traditionally assumes natural kinds have essential structures. If the essence is blurred across regions, the determinate reference required for externalism seems to vanish.

  To save externalism, we must indexicalise the content. On standard Twin Earth, 'water' means *that liquid* (pointing to the local essence). On Gradient Earth, 'water' means *the dominant liquid in this specific region of the gradient*. This preserves externalism because the content is still fixed by the environment, not the internal state. The speaker's brain state remains constant across the gradient, but the extension shifts slightly with their location. This does not collapse into internalism because the fixing condition ('this region') is external. The speaker cannot know a priori which part of the gradient they occupy, so the content remains opaque to them.

  However, a serious objection arises: does this indexicalisation admit too much vagueness? If reference shifts with every step across the gradient, communication between neighbours in different zones might fail. Yet, this objection actually strengthens externalism. It shows that reference is sensitive to environmental context in a nuanced way, rather than a brittle binary. Internalism cannot handle this at all, as the internal state is identical across the gradient. Therefore, Gradient Earth forces a more sophisticated externalism—one that accepts continuous context-dependence—rather than defeating the theory outright. The binary was never essential; the dependence on the actual world was.

  ***

  ### Marking Scheme (25 Marks Total)

  **1. Binary Intuition Threat (6 Marks)**
  *   **5–6 marks (A):** Clearly explains that Putnam relies on sharp boundaries (H₂O vs XYZ) and identifies that the gradient introduces vagueness/sorites issues that make determinate reference tricky.
  *   **3–4 marks (B):** Mentions Putnam's binary setup but treats the gradient as just another version of Twin Earth without analysing why continuity is a problem for reference.
  *   **0–2 marks (C):** Fails to distinguish the gradient case from the original Twin Earth case.

  **2. Indexicalised Externalism vs. Internalism (6 Marks)**
  *   **5–6 marks (A):** Argues that 'water' becomes context-dependent ('liquid around here') and explains why this remains external (speaker can't know location a priori).
  *   **3–4 marks (B):** Suggests indexicalisation but fails to defend against the collapse into internalism, or claims it defeats externalism entirely.
  *   **0–2 marks (C):** Ignores the indexical option or conflates it with subjective belief.

  **3. Serious Objection (6 Marks)**
  *   **5–6 marks (A):** Raises a strong objection (e.g., vagueness threatens communication, or gradient proves externalism is robust) and offers a rebuttal.
  *   **3–4 marks (B):** Raises a generic objection (e.g., "science might change") not specific to the gradient case.
  *   **0–2 marks (C):** No objection addressed.

  **4. Clarity, Precision, and Originality (7 Marks)**
  *   **6–7 marks (A):** Fluent, precise philosophical English. Engages directly with the Gradient twist. No mere summarising of standard texts.
  *   **4–5 marks (B):** Competent writing but relies heavily on reciting Putnam/Burge standard examples without adapting them to the prompt.
  *   **0–3 marks (C):** Unclear, disorganised, or largely irrelevant.

  **Grade Boundary Notes:**
  *   **A Grade (20–25):** Must score highly on sections 1, 2, and 3. The essay must grapple with the *gradient* specifically. A student who writes a brilliant essay on standard Twin Earth but ignores the continuous variation cannot get an A.
  *   **B Grade (15–19):** Competent knowledge of externalism. Will likely summarise Putnam well but treat the Gradient case as a minor footnote or fail to see how it challenges the binary intuition.
  *   **C Grade (10–14):** Basic understanding of externalism but struggles to apply it to the new case.

  *Total: /25*
