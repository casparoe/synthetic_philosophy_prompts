answer: |-
  The stall is not merely verbal, nor is it purely substantive in the sense of competing metaphysical claims about the same object. It is a **category error regarding the function of metaphysical inquiry itself.**

  The analytic camp treats *anātman* as a claim within the **metaphysics of persistence**: "Does a subject endure through time?" The Buddhist camp treats *anātman* as a claim within the **ontology of dependence**: "Does any phenomenon exist independently of causes and conditions?"

  Because these are distinct projects, the "self" they negate is structurally different. Progress requires demonstrating that the analytic question is ill-posed within the Buddhist framework because the demand for "identity conditions" *is* the cognitive habit (*svabhāva*-grasping) that Buddhism seeks to dismantle.

  ### 1. The Diagnosis: Persistence vs. Dependence

  **The Analytic Position (Parfit, Siderits, etc.):**
  Analytic philosophers approach *anātman* as a solution to the Lockean problem of personal identity. They ask: *What makes a person at $t_1$ the same entity as a person at $t_2$?*
  *   **The Target:** A diachronic substrate (a soul or Cartesian ego) that guarantees numerical identity over time.
  *   **The Move:** Reductionism (Parfit) or Eliminativism (Siderits). They argue that since no such substrate exists, "personal identity" is either a matter of degree (psychological continuity) or a useful fiction.
  *   **The Stake:** Moral responsibility and rational self-interest. If there is no strict identity, why punish the future "stage" of a person for the past "stage's" crime? They need a functional bearer to ground ethics.

  **The Buddhist Position (Abhidhamma, Madhyamaka):**
  Buddhist scholars argue that *anātman* is not primarily about time, but about *svabhāva* (inherent existence).
  *   **The Target:** A synchronic essence. The error is not thinking "I will exist tomorrow," but thinking "I exist *now* as an independent agent."
  *   **The Move:** Dependent Origination (*pratītyasamutpāda*). Aggregates (*skandhas*) arise dependently. Because they depend on conditions, they lack *svabhāva*. Because they lack *svabhāva*, they cannot be a "self."
  *   **The Stake:** Soteriology (the end of suffering). Clinging (*upādāna*) arises from misapprehending the aggregates as self. Liberation comes from seeing the emptiness of the aggregates, not from solving the logic of diachronic identity.
  *   **The Conventional Person:** Crucially, Madhyamaka (e.g., Candrakīrti) insists that *prajñapti-sat* (conventionally designated persons) function perfectly well for karma and ethics without needing ultimate identity conditions.

  **The Mismatch:**
  The analytic philosophers are trying to **save** the person by reducing it to physical/mental events to make it compatible with science and ethics. The Buddhists are trying to **deconstruct** the reification of the person to make it compatible with liberation.
  *   When an analytic philosopher asks, "What are the identity conditions of the person?" they are asking, "What is the *svabhāva* of the person?"
  *   When a Buddhist answers, "There are no identity conditions," the analytic philosopher hears "Eliminativism" (Siderits), while the Buddhist means "Dependent Arising" (Nāgārjuna).

  ### 2. The Substantive Core: Moral Agency

  The stall persists because there is a genuine, substantive disagreement about **moral agency**, not just definitions.

  *   **Analytic Worry:** If the self is a bundle of momentary events (*kṣaṇikatva*), who bears the karmic fruit? Siderits embraces this, arguing for "semantic non-self" where moral language is useful but ultimately false. This risks moral nihilism from a traditional Buddhist view.
  *   **Buddhist Reply:** The Abhidhamma and Madhyamaka argue that karma operates like fire passing from one fuel to another. No "substance" passes, only causal continuity. To demand a "bearer" of karma is to demand *svabhāva*.
  *   **The Impasse:** The analytic side insists that without a diachronic identity condition, moral responsibility is unintelligible. The Buddhist side insists that *with* a diachronic identity condition (a substantial self), moral responsibility is impossible (because a static self cannot act or change).

  They are not arguing about the same mechanism. The analytic side wants a **locus of attribution**. The Buddhist side wants a **causal stream**.

  ### 3. The Momentariness Wedge (*Kṣaṇikatva*)

  The literature on momentariness highlights the fracture.
  *   **Siderits (Eliminativism):** Argues that if moments are truly discrete, there is no continuity, only causation. Therefore, "person" is a conceptual fiction. This aligns with the *ultimate truth* (*paramārtha-satya*) but threatens the *conventional truth* (*saṃvṛti-satya*).
  *   **Traditionalists:** Argue that momentariness does not imply discontinuity. Causality bridges the moments. The "person" is a valid convention (*vyavahāra*) precisely *because* it is empty.

  The stall occurs here because analytic philosophers treat "conventional existence" as a second-class ontology (a "useful fiction"), whereas Madhyamaka treats it as the *only* ontology that functions. For Nāgārjuna, emptiness *is* dependent origination. To ask for the "real" identity behind the convention is to misunderstand emptiness.

  ### 4. What Counts as Progress?

  Progress will not come from a formal distinction (the Two Truths are already formal) or a phenomenological result (both sides agree the experience of self is compelling but misleading).

  **Progress requires an argument that the analytic question is ill-posed.**

  The analytic framework presupposes that for a concept ("person") to be valid, it must have determinate identity conditions (boundaries in time and space). This presupposition *is* the definition of *svabhāva*.
  *   **The Argument:** To ask "What are the identity conditions of a person?" is to ask "What makes a person exist intrinsically?"
  *   **The Buddhist Counter:** Nothing exists intrinsically. Therefore, the question has no answer, not because the answer is "nothing," but because the question presupposes a mode of existence (intrinsic identity) that is incoherent.

  **The Path Forward:**
  The debate advances only if analytic philosophers accept that **identity is a pragmatic designation, not a metaphysical discovery.**
  1.  **Shift from Ontology to Pragmatics:** Instead of asking "Does the self exist?", ask "Under what conditions is the designation 'self' soteriologically harmful vs. ethically useful?"
  2.  **Reconceive Agency:** Accept the Buddhist model of "agentless action" (like a flame burning) as a viable alternative to the "bearer of properties" model. This requires analytic philosophy to loosen its grip on the Principle of Identity as a prerequisite for ethics.
  3.  **Dissolve the Diachronic/Synchronic Split:** Recognize that in a framework of Dependent Origination, diachronic continuity *is* synchronic dependence. The stream *is* the moments. There is no separate "persistence" problem to solve.

  **Conclusion:**
  The stall is substantive because it reflects a clash between a **metaphysics of grounding** (Analytic) and a **soteriology of deconstruction** (Buddhist). Progress lies in recognizing that the analytic demand for identity conditions is not a neutral tool of inquiry, but a specific form of *avidyā* (ignorance) that reifies concepts. The debate resolves only when the analytic side accepts that the "person" is a *prajñapti* (designation) that requires no ontological ground to function ethically, rendering the search for diachronic identity conditions a category error.
