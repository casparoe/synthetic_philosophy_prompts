      *   *Mules/Worker Ants:* Sterile individuals. *Requirement:* Life cannot depend on *individual* reproductive capacity; must be lineage-relative.
      *   *Mitochondria:* Endosymbionts. *Requirement:* Distinguish parts of organisms from organisms themselves (mereology).
      *   *Biosphere (Reef/Forest):* Gaia-like. *Requirement:* Define boundaries. Is the collective alive or just a collection of living things?
      *   *Cinder Drifts (No Evolution):* Perfect copying. *Requirement:* Is evolution necessary? If yes, Drifts aren't alive. If no, they are. This tests the "Evolution" criterion.
      *   *Glass Loom (No Metabolism/Genome):* Structural templating on minerals. *Requirement:* Tests substrate neutrality and the necessity of metabolism vs. information.
      *   *The Choir (Group Reproduction):* Individuals don't reproduce; the pattern does. *Requirement:* Tests the locus of selection and the definition of "individual."

  4.  **Drafting the Distinctions & Constraints:**

      *   *Alive vs. Organism:* Viruses vs. Cells.
      *   *Alive vs. Product:* Fire vs. Burnt Wood.
      *   *Time vs. Lineage:* Spores (time) vs. Mules (lineage).
      *   *Metabolism vs. Replication vs. Evolution:* The big triangle of tension.
      *   *Life vs. Mind:* Avoid anthropomorphism.
      *   *Ancestral Constraint:* LUCA was complex. Definition shouldn't require *less* than LUCA (too broad) or *more* (excludes ancestors).

  5.  **Status Marking (Non-negotiable vs. Preference):**

      *   *Non-negotiable:* Consistency with terrestrial biology (LUCA constraint), handling dormant states (spores), handling sterile individuals (mules).
