      *   Candidate: The "Cinder Drifts" constraint (Evolution is not necessary for *being* alive, only for *staying* alive historically). This kills strict "Evolvability" definitions (like NASA's).
      *   Decision: The requirement that **Life is a property of individuals-at-a-time, distinct from the historical capacity of their lineage to evolve.** This separates the state of being alive from the process of evolution.

  7.  **Brief Scoring of Families:**

      *   *Metabolism/Autopoiesis:* Fails Viruses (no metabolism). Fails Spores (no active metabolism).
