  2.  **Deconstruct the Three Jobs:**

      *   *Detection Criterion:* Operational, observational, finite data. Needs to be robust against false positives (abiotic chemistry) and false negatives (alien biochemistry).
      *   *Natural-Kind Concept:* Theoretical utility. Does "life" carve nature at its joints? Does it support laws/generalizations?
      *   *Constitutive Account:* Metaphysical/Ontological. What *makes* something alive? Necessary and sufficient conditions.
      *   *Analysis:* They are distinct. A detection criterion can be pragmatic (e.g., "find ATP") without being constitutive. A constitutive account might be unobservable (e.g., "has a soul" or "has a specific causal history"). A natural kind requires cluster properties, not just necessary/sufficient conditions.
      *   *Strain Point:* The strain falls on *operationalizability vs. theoretical depth*. Detection needs surface features; Constitution needs deep essence; Natural Kind needs historical clustering. You can't maximize all three.

  3.  **Drafting the Desiderata (The Cases):**

      *   *Viruses/Viroids:* Edge case. Replicate, evolve, but no independent metabolism. *Requirement:* Must explain why they are often excluded from "alive" despite evolving.
