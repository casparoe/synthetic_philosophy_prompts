      *   What kills the most definitions? Likely the requirement that *individuals* count as alive even if they don't reproduce (Mules), combined with the requirement that *lineages* must evolve (to exclude Drifts). Or, more sharply: The requirement to distinguish *Life* from *Evolution* while acknowledging their entanglement.
      *   Actually, the prompt asks for the *single requirement that does the most work in excluding otherwise popular definitions.*
