answer: |-
  # Chapter 1: The Specification of Life

  ## 1. The Three Jobs of a Definition

  Before proposing a definition, we must specify the work the definition is required to perform. In astrobiology, "life" is asked to do three distinct jobs. Confusion arises when a single formulation is expected to satisfy all three simultaneously.

  1.  **The Detection Criterion (Operational):** This is a decision procedure for instruments or protocols. It must be observable, finite, and robust against false positives (abiotic chemistry) and false negatives (alien biochemistry). Its virtue is *applicability*, not metaphysical depth.
  2.  **The Natural-Kind Concept (Theoretical):** This treats life as a category that carves nature at its joints. It must support induction, explanation, and generalization. If "life" is a natural kind, knowing something is alive should license predictions about its behavior, structure, or history. Its virtue is *explanatory power*.
  3.  **The Constitutive Account (Ontological):** This specifies the necessary and sufficient conditions in virtue of which an entity is alive. It addresses what life *is*, independent of our ability to detect it or generalize from it. Its virtue is *truth*.

  **Are these three faces of one, or separate specifications?**
  They are separate specifications. A detection criterion can be pragmatic (e.g., "detect ATP") without being constitutive (ATP is not what life *is*). A constitutive account may be unobservable (e.g., specific causal histories). A natural kind requires cluster properties that may admit exceptions, whereas a constitutive account demands strict boundaries.

  **The Strain Point:**
  The strain falls on the **boundary between the Constitutive Account and the Detection Criterion.** A constitutive account often relies on historical or relational properties (e.g., "descended from a common ancestor" or "capable of open-ended evolution") that are impossible to verify in a single snapshot of a remote specimen. Conversely, a detection criterion relies on structural markers (e.g., "complexity" or "metabolism") that may be instantiated by abiotic systems. **No single definition can maximize observational immediacy and ontological depth.** The handbook must prioritize the Constitutive Account as the primary specification, treating the Detection Criterion as a derivative, fallible proxy.

  ## 2. Desiderata: Cases and Classifications

  An adequate account must classify the following cases correctly. The "verdict" column indicates the classification the definition must support to remain consistent with biological practice and logical coherence.

  | Case | Verdict | Consideration (Why this is a requirement) |
  | :--- | :--- | :--- |
  | **Viruses / Viroids** | **Borderline / Non-Alive** | They evolve and replicate but lack independent metabolism and homeostasis. A definition counting them as fully alive collapses the distinction between parasite and organism. |
  | **Prions** | **Non-Alive** | They replicate structure without a genome. Counting them as alive renders "life" indistinguishable from crystal growth or fire propagation. |
  | **Spores / Cryptobiosis** | **Alive (Dormant)** | Metabolism halts completely. A definition requiring *active* metabolism falsely classifies spores as dead matter, breaking the continuity of the organism. |
  | **Mules / Worker Ants** | **Alive** | Metabolically active but permanently sterile. A definition requiring *individual* reproductive capacity falsely classifies them as non-living. |
  | **Mitochondria** | **Alive (as parts)** | Formerly free-living, now organelles. The definition must distinguish between a living *component* and a living *individual* (mereological constraint). |
  | **Biosphere (Reef/Forest)** | **Not an Organism** | While ecologically integrated, they lack a unified reproductive bottleneck. Counting Gaia as an organism collapses the distinction between ecosystem and individual. |
  | **The Cinder Drifts** | **Alive (Historically Dead)** | They metabolize, grow, and reproduce, but with zero heritable variation. They are alive *now*, but their lineage is evolutionarily extinct. |
  | **The Glass Loom** | **Non-Alive** | Structural templating without metabolism or encapsulation. Counting this as alive removes the distinction between biology and geology. |
  | **The Choir** | **Alive (Collective)** | Individuals do not reproduce; the population pattern does. The definition must allow the *locus of life* to shift from individual to collective without losing the label. |

  ## 3. Required Distinctions and Constraints

  The definition must preserve the following distinctions. Collapsing any of these renders the concept useless for biology.

  1.  **Alive vs. Organism:** Something can be alive (a cell) without being an organism (a multicellular whole).
  2.  **Alive vs. Product of Life:** A feather is produced by life but is not itself alive. The definition must distinguish process from product.
  3.  **Life-at-a-Time vs. Life-as-Lineage:** An individual can be alive at time *t* even if its lineage goes extinct at *t+1* (The Cinder Drifts).
  4.  **Metabolism vs. Replication vs. Evolution:** These are correlated on Earth but logically distinct. The definition must not conflate them.
  5.  **Life vs. Mind/Agency:** Life must be definable without reference to cognition, intent, or agency to avoid anthropomorphism.

  **The Ancestral Constraint:**
  Comparative genomics indicates the Last Universal Common Ancestor (LUCA) was already a coded, translating cell.
  *   **Constraint A:** The definition cannot demand *less* than a cell (e.g., "self-replicating molecule") without counting prebiotic chemistry as life.
  *   **Constraint B:** The definition cannot demand *more* than LUCA (e.g., "multicellularity" or "neural activity") without excluding our own ancestors.

  ## 4. Status Marking: Non-Negotiable vs. Research Programme

  We must distinguish between requirements demanded by the phenomenon and preferences imposed by specific research cultures.

  | Requirement | Status | Rationale |
  | :--- | :--- | :--- |
  | **Handles Dormancy (Spores)** | **Non-Negotiable** | Biological continuity requires life to persist through metabolic suspension. |
  | **Handles Sterility (Mules)** | **Non-Negotiable** | Life is a property of physiological state, not reproductive success. |
  | **Ancestral Constraint (LUCA)** | **Non-Negotiable** | Any definition contradicting the terrestrial phylogenetic record is empirically falsified. |
  | **Substrate Neutrality** | **Preference** | Demanding carbon-independence is a heuristic for astrobiology, not a truth about life *per se*. Terrestrial chauvinism is a risk, but substrate neutrality is not a logical necessity. |
  | **Bivalence (Sharp Yes/No)** | **Preference** | Life may be a fuzzy cluster concept. Demanding a sharp boundary for every object is a logical convenience, not an empirical fact. |
  | **Individual/Lineage Consistency** | **Preference** | It is acceptable for "alive" to apply differently to an individual (physiological) and a lineage (evolutionary). |

  ## 5. Conflicts and The Exclusionary Requirement

  **Jointly Unsatisfiable Subset:**
  It is impossible to satisfy the following three simultaneously:
  1.  **Strict Bivalence:** Every object is either definitively alive or dead.
  2.  **Process Ontology:** Life is defined by a historical process (e.g., evolution).
  3.  **Snapshot Detection:** The verdict can be determined from a single moment in time.

  *Reasoning:* If life is a historical process (2), you cannot determine it from a snapshot (3). If you demand a snapshot verdict (3) for a historical process, you must accept fuzzy boundaries (deny 1).

  **The Single Exclusionary Requirement:**
  The requirement that does the most work in excluding otherwise popular definitions is:
  **"Life must be ascribable to sterile individuals (Mules) without reference to their lineage's future evolvability."**

  *Why:* This excludes strict **Replicator-First** definitions (which require the individual to replicate) and strict **NASA-style** definitions ("self-sustaining chemical system capable of Darwinian evolution"), because the Mule is not capable of evolution, nor is the Cinder Drift lineage. It forces the definition to locate "life" in the *physiological maintenance of the present state* rather than the *potential for future history*.

  ## 6. Brief Scoring of Account Families

  Against the specification above, the main families of definition fare as follows:

  *   **Metabolism / Autopoiesis-First:**
      *   *Passes:* Spores (dispositionally), Mules, Glass Loom (correctly excludes).
      *   *Fails:* Viruses (no metabolism), Cinder Drifts (if metabolism is tied to growth/repair only, they pass, but often this view demands self-production of boundaries which Drifts may lack).
      *   *Verdict:* Strong on physiology, weak on genetic continuity.

  *   **Replicator-First:**
      *   *Passes:* Viruses, Glass Loom (incorrectly includes).
      *   *Fails:* Mules (sterile), Spores (non-replicating state), Cinder Drifts (if evolution is required).
      *   *Verdict:* Fails the Non-Negotiable Sterility Constraint.

  *   **Working-Definition (NASA-style: "Evolvable Chemical System"):**
      *   *Passes:* Terrestrial lineage generally.
      *   *Fails:* Mules (individuals don't evolve), Cinder Drifts (lineage doesn't evolve), Spores (temporarily non-evolving).
      *   *Verdict:* Defines *Biosphere* well, but fails *Individual*.

  *   **Information-Theoretic:**
      *   *Passes:* Substrate neutrality.
      *   *Fails:* Glass Loom (hard to distinguish structural info from genetic info), Prions (often count as information carriers).
      *   *Verdict:* Too broad without a metabolic constraint.

  **Conclusion for the Handbook:**
  The specification demands a **hybrid account**. It must locate life in the *maintenance of a thermodynamic state* (to handle Mules and Spores) constrained by *historical descent* (to handle Prions and Glass Looms), while acknowledging that *evolvability* is a property of lineages, not a necessary condition for an individual's aliveness at a time.
