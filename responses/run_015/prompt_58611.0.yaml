          6.  New Policy: Default-expiry ventilator order (continuing requires action, stopping happens by inaction/lapse).
      *   **Questions to Answer:**
          *   What view of action, causation, and responsibility does this pattern presuppose?
          *   Does it presuppose Killing vs. Letting Die (K/LD), Doing vs. Allowing (D/A), or Intending vs. Foreseeing (Doctrine of Double Effect - DDE)?
          *   Do all elements (rules, equivalence claim, bedside reluctance, expiry default) presuppose the same thing?
          *   Distinguish what is strictly required vs. what fits comfortably.
          *   Identify underdetermination or inconsistency.
          *   Explain what would change if the hospital adopted a consequentialist/outcome-based view (only outcomes, consent, intentions matter).
          *   **Constraint:** Give a *committed answer* taking a definite position, defending it with reasons (no fence-sitting).

  2.  **Deconstruct the Hospital's Practices:**
      *   *Rule 1 (No Lethal Injection):* Rejects active killing. Suggests a K/LD or D/A distinction matters, OR that intent to kill is forbidden (DDE).
      *   *Rule 2 (Withdraw Ventilation):* Permits letting die. Suggests K/LD distinction matters.
      *   *Rule 3 (Palliative Sedation/Analgesia):* Permits foreseeing death but not intending it. Strongly suggests Doctrine of Double Effect (DDE).
      *   *Official Equivalence (Withholding = Withdrawing):* Suggests the *timing* of the decision doesn't change the moral status. This undermines a strict physicalist view of "act" vs. "omission" regarding the machine, but aligns with a view that the *obligation* to treat is what matters.
      *   *Bedside Reluctance:* Nurses feel withdrawing is an "act." This suggests a psychological/phenomenological commitment to a D/A distinction that the official policy denies.
      *   *Default-Expiry Order:* Makes continuing treatment an "act" (reauthorizing) and stopping treatment an "omission" (letting lapse). This is a *procedural* maneuver to align the physical reality of withdrawing with the moral comfort of allowing.

