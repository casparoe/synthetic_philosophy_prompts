      *   *Best Interpretation:* The hospital is operating under a **Legalistic/Professional Norms Model** disguised as ethical principle. It prioritizes *non-liability* and *professional comfort* over philosophical consistency. However, philosophically, it leans most heavily on **DDE** for the *why* (intention) and a **manipulated Omission view** for the *how* (causation).
      *   *Decision:* I need to pick the *best* philosophical reconstruction. I will argue that the practice presupposes the **Doctrine of Double Effect (DDE) as the primary moral engine**, but it is **forced to compromise the Acts/Omissions distinction** to make DDE workable in a clinical setting. The "Equivalence" claim is the ethical truth they want to hold; the "Expiry Default" is a psychological scaffold to help them hold it.
