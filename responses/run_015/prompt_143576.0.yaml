  1. **Branch Questions**
  1. In the election where both candidates are equally awful, does the mere ability to vote for the loser preserve blameworthiness for voting for the winner?
  2. In the quantum coin-flip intervention case where the agent couldn't have done otherwise, is she still blameworthy for the action she chose on her own?
  3. If a complete physical chain prior to her birth guaranteed her choice, is she blameworthy for that choice?
  4. If a neuroscientist implanted her values yesterday without her knowledge, is she blameworthy for acting on them today?
  5. If she knowingly does wrong but believes it's right due to an upbringing she couldn't escape, is she blameworthy?

  2. **The Tree**
  ```text
  Q1: Equally Awful Candidates?
  ├── Yes ──────────────────────────────────────────────────► [Leaf 1: Traditional Compatibilism]
  └── No
      └── Q2: Unsignalled Intervention?
          ├── No ───────────────────────────────────────────► [Leaf 2 & 3: Classical Leeway Incompatibilism / Hard Determinism]
          └── Yes
              └── Q3: Deterministic Physics Chain?
                  ├── No ───────────────────────────────────► [Leaf 4: Source Incompatibilism / Flicker Strategist]
                  └── Yes
                      └── Q4: Value Implantation?
                          ├── No ───────────────────────────► [Leaf 5: Semicompatibilism]
                          └── Yes
                              └── Q5: Inescapable Ignorance?
                                  ├── No ───────────────────► [Leaf 6: Reasons-Responsiveness Compatibilism]
                                  └── Yes ──────────────────► [Leaf 7: Attributionism]
  ```
  *(Note: Leaf 8 "Flicker-of-Freedom" is grouped with Source Incompatibilism at Q3=No because both deny responsibility in deterministic worlds despite agreeing on Q2, distinguished only by whether APs exist in Frankfurt cases.)*

  3. **The Leaves**
  1. **Traditional Compatibilism:** You must accept that having a trivial, morally insignificant alternative possibility is sufficient to ground full blameworthiness.
  2. **Classical Leeway Incompatibilism:** You must deny moral responsibility in all deterministic worlds even if the agent's actual sequence is perfectly rational and uncoerced.
  3. **Hard Determinism:** You must deny moral responsibility even in indeterministic worlds where the agent could have done otherwise but lacked control.
  4. **Source Incompatibilism:** You must maintain that determinism undermines responsibility even though alternative possibilities are not required for responsibility.
  5. **Semicompatibilism:** You must hold that responsibility survives determinism but vanishes if the agent's values were manipulated, even if the agent identifies with them.
  6. **Reasons-Responsiveness Compatibilism:** You must excuse agents who act from deep, identity-conferring ignorance if their mechanism was not responsive to reasons.
  7. **Attributionism:** You must hold an agent blameworthy for wrongdoing even when their moral ignorance results from an upbringing they could not escape.
  8. **Flicker-of-Freedom Strategist:** You must claim alternative possibilities exist in Frankfurt-style cases despite the explicit setup designed to eliminate them.

  4. **Empty Combinations**
  *   **Q1=Yes, Q2=No:** Unattractive, as it asserts trivial alternatives save responsibility but robust alternatives are required in intervention cases.
  *   **Q1=No, Q2=Yes, Q3=No, Q4=Yes:** Incoherent for Source Incompatibilists, who typically view history-sensitive manipulation as undermining the source required for responsibility.
  *   **Q1=No, Q2=No, Q3=Yes:** Merely unexplored, as few compatibilists deny responsibility in Frankfurt cases while accepting it in deterministic ones.

  5. **Indistinguishable Leaves**
  *   **Classical Leeway Incompatibilism vs. Hard Determinism:** This tree cannot separate them because both deny responsibility in the deterministic case at Q3; you would need to ask, "Is moral responsibility possible in an indeterministic world where the agent could have done otherwise?"
  *   **Semicompatibilism vs. Attributionism:** While Q4 attempts to split them, many semicompatibilists agree with attributionists on manipulation cases; you would need to ask, "Does the historical origin of a value matter if the agent currently endorses it wholeheartedly?"
  *   **Source Incompatibilism vs. Flicker-of-Freedom:** Both land at Q3=No; you would need to ask, "In a standard Frankfurt case with a prior sign, does the agent retain the power to refrain from signaling?"
