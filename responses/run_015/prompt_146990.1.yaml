  # Seminar Plan: The Baseline Paradox
  **Topic:** The Instability of the Therapy/Enhancement Distinction
  **Duration:** 75 Minutes
  **Participants:** 14 Students (Upper-Level Philosophy)
  **Objective:** To experientially demonstrate that the therapy/enhancement distinction is not a neutral biological boundary but a normative construct subject to institutional drift.

  ## I. Materials & Setup
  *   **Room:** Three tables arranged in a triangle.
  *   **Handouts:**
      *   6 Case Cards (printed on cardstock, 2 sets per group).
      *   Role Sheets (Clinical Allocators, Regulatory Auditors, Baseline Sceptics).
      *   Deliberation Worksheet (for writing the Criterion and tracking Tokens).
      *   10 Red Poker Chips or Cardboard Tokens per group ("Public Funding Tokens").
      *   Silent Vote Slips (one per student).
  *   **Grouping:** 14 students divided into three groups (5, 5, 4).
      *   *Note:* Within each group, students must adopt the three roles collectively, or assign specific students to champion specific roles. For this seminar, assign **roles to the group identity** to force internal negotiation. Each group acts as a committee containing all three perspectives.

  ## II. Case Cards
  *Print and cut. Distribute one full set to each group.*

  **Case 01: Trauma Restoration (Familiar)**
  *   **Intervention:** Retinal implant surgery.
  *   **Pre-Intervention State:** Blindness resulting from industrial accident (age 35).
  *   **Post-Intervention State:** 20/20 vision (species-typical).
  *   **Institutional Context:** Standard workers' compensation claim; universally covered by health insurance.

  **Case 02: Anxiety Regulation (Familiar)**
  *   **Intervention:** SSRI pharmacotherapy.
  *   **Pre-Intervention State:** Generalized Anxiety Disorder (GAD); inability to maintain employment.
  *   **Post-Intervention State:** Mood regulated to clinical norms; able to work.
  *   **Institutional Context:** Psychiatric treatment plan; covered by mental health parity laws.

  **Case 03: Pediatric Growth (Familiar)**
  *   **Intervention:** Recombinant human growth hormone (rhGH).
  *   **Pre-Intervention State:** Pediatric growth hormone deficiency (projected adult height <5th percentile).
  *   **Post-Intervention State:** Adult height within species-typical range (50th percentile).
  *   **Institutional Context:** Endocrinology clinic; covered by state health plan for diagnosed deficiency.

  **Case 04: The Surgeon's Reversal (Baseline-Drift)**
  *   **Intervention:** Surgical removal of cognitive endurance implant.
  *   **Pre-Intervention State:** Possesses state-certified neural implant (standard for all surgeons in this hospital since 2035).
  *   **Post-Intervention State:** Natural cognitive endurance (below current hospital standard).
  *   **Institutional Context:** Surgeon claims "cognitive alienation"; Hospital argues removal compromises safety standards established around the implant.

  **Case 05: The Musician's Restoration (Baseline-Drift)**
  *   **Intervention:** Cochlear dampening procedure.
  *   **Pre-Intervention State:** Enhanced hearing range (20Hz–30kHz) required for Professional Orchestra Certification.
  *   **Post-Intervention State:** Natural hearing range (20Hz–20kHz).
  *   **Institutional Context:** Musician retiring from solo performance; requests procedure to reduce sensory overload in daily life. Insurance denies as "reduction of capacity."

  **Case 06: The Diplomat's Range (Baseline-Drift)**
  *   **Intervention:** Reversal of voluntary affect-suppression conditioning.
  *   **Pre-Intervention State:** Emotionally flattened affect (required for high-clearance negotiation service).
  *   **Post-Intervention State:** Pre-service emotional volatility and range restored.
  *   **Institutional Context:** Post-employment reintegration; Veteran Affairs classifies this as "personality alteration" rather than treatment for pathology.

  ## III. Role Descriptions
  *Distribute with Case Cards.*

  *   **Clinical Allocators:** Your priority is **Patient Autonomy**. You argue that if the individual experiences their state as deficient or harmful, funding should be considered. You push for broad access.
  *   **Regulatory Auditors:** Your priority is **Consistency**. You must draft a single one-sentence criterion for "Therapy" and apply it rigidly. You track token usage and enforce the penalty for criterion drift.
  *   **Baseline Sceptics:** Your priority is **Normative Critique**. You must challenge every proposed baseline. Ask: "Normal for whom?" "When did this become the standard?" You expose arbitrary statistical norms.

  ## IV. Minute-by-Minute Facilitator Guide

  ### 0–10 Minutes: Briefing & Setup
  1.  **Introduction (2 mins):** State the objective. "Today is not about finding the correct definition of enhancement. It is about feeling how impossible it is to keep that definition stable when institutional norms shift."
  2.  **Group Assignment (3 mins):** Divide into three groups (5, 5, 4). Hand out Case Cards, Tokens, and Role Sheets.
  3.  **Rules of Deliberation (5 mins):**
      *   **The Criterion:** Before touching Case 01, you must write down **one sentence** defining what qualifies as "Therapy" eligible for public funding.
      *   **The Token Economy:** You have 10 tokens. You may only award a token to a case if you unanimously classify it as **Therapy**. Enhancements receive no funding.
      *   **The Penalty:** If you change your written criterion at any point during the 30 minutes, you must immediately surrender **one token** to the facilitator.
      *   **The Goal:** Fund the deserving cases while maintaining philosophical consistency.

  ### 10–40 Minutes: Deliberation in Role
  *   **Facilitator Role:** Circulate silently. Do not answer content questions. Only enforce the rule: "Have you written your criterion?" and "Did you change your criterion? Hand over a token."
  *   **Observation:** Watch for the "Drift."
      *   *Watch Group 1:* Do they fund the Surgeon (Case 04) but deny the Musician (Case 05)?
      *   *Watch Group 2:* Do they define therapy as "restoring species-typical function" but then struggle with the Diplomat (Case 06) whose "typical" function is emotional volatility?
      *   *Watch Group 3:* Do the Baseline Sceptics successfully stall the Auditors?
  *   **Time Check:** Announce at 25 minutes (5 mins remaining).

  ### 40–55 Minutes: Reveal & Silent Vote
  1.  **Presentations (9 mins):** Each group has 3 minutes to state:
      *   Their final written criterion.
      *   Which cases received tokens.
      *   How many tokens they forfeited for criterion changes.
  2.  **Silent Vote (6 mins):** Distribute slips. Ask students to answer privately:
      *   *Question:* "Did your group apply the exact same logical criterion to Case 01 (Sight) and Case 06 (Diplomat)?" (Yes/No)
      *   *Question:* "Which case felt the most difficult to classify without changing your definition?"
      *   *Collect slips.* (Do not discuss results yet).

  ### 55–75 Minutes: Debrief
  *Facilitator leads discussion using the following script structure.*

  **1. The Criterion Shift (5 mins)**
  "Look at your slips. Most of you voted 'No' on consistency between Case 01 and Case 06. Let's look at the Regulatory Auditors. In previous iterations, groups often classify the **Surgeon's reversal (Case 04)** as 'enhancement suppression' (no funding) because it lowers capacity below the *occupational* norm. Yet, they classify the **Musician (Case 05)** as 'therapy' (funding) because returning to natural hearing feels like healing. Logically, these are identical: both are removing an enhancement to return to a species-typical baseline. Why did the criterion shift?"
  *   *Expected Student Response:* Occupational safety vs. personal quality of life; institutional entrenchment.

  **2. Normative Baseline Drift (5 mins)**
  "This is **Normative Baseline Drift**. When an enhancement becomes standard (like the surgeon's implant), the 'normal' functioning of the institution shifts. The 'deficiency' is no longer the lack of the implant, but the lack of compliance with the new standard. Therapy becomes 'maintaining the enhanced baseline' rather than 'restoring the natural baseline.'"
  *   *Point to the Baseline Sceptics:* "Did your role feel possible to sustain? When the Auditors said 'species-typical functioning,' did you point out that 'typical' is a statistical average that changes as soon as enhancements are adopted?"

  **3. The Species-Typical Smuggle (5 mins)**
  "The standard philosophical defense is 'species-typical functioning.' But as the **Diplomat (Case 06)** shows, 'typical' affect is variable. If the state requires suppression, is the suppression the new norm? By funding the Sight Restoration (Case 01) but denying the Diplomat, you smuggled in a moral judgment about which capacities *should* be typical, not just which *are* typical. You protected occupational baselines you treated as given."

  **4. Facilitator Injection: The Macro Context (5 mins)**
  *Read or paraphrase the following strictly:*
  "I must be frank: this activity cannot reproduce the macro-level institutional inertia by which enhanced baselines become legally or medically entrenched over decades. In 30 minutes, you felt the arbitrariness. In reality, this drift happens over generations.
  *   **Historical Example:** Consider vaccination. Once universal, non-vaccination became a 'deficiency' requiring exclusion from schools.
  *   **Historical Example:** Consider ADHD medication. Once a treatment for pathology, it became a standard tool for academic competitiveness, shifting the baseline for 'normal' focus in classrooms.
  The seminar reveals the micro-level arbitrariness in real time. The history shows how those arbitrary decisions calcify into law. The danger is not that we cannot define enhancement; the danger is that the definition defines us before we notice it has changed."

  **5. Closing (5 mins)**
  "Collect your tokens. Keep your criterion sheets. Next week, read Daniels on 'Normal Functioning' and Parens on 'Creativity and Enhancement.' Bring your criterion sheet to compare against Daniels' definition."

  ## V. Facilitator Notes & Troubleshooting

  *   **If a group finishes early:** Do not let them discuss outside the group. Ask them to write a "Dissenting Opinion" from the Baseline Sceptic perspective on the case they found easiest to fund.
  *   **If a group changes criterion repeatedly:** Allow the token forfeiture to happen. It is a teaching moment. If they run out of tokens, they can no longer fund cases. This simulates budget collapse due to inconsistent policy.
  *   **The "Surgeon vs. Musician" Trap:** If no group falls into the trap of treating these differently, prompt during debrief: "Did anyone argue that the Surgeon poses a public risk without the implant, while the Musician does not? That is a shift from 'therapy' to 'public utility,' which violates your criterion if your criterion was about 'health.'"
  *   **Token Mechanics:** Ensure groups understand that *funding* costs a token. If they classify as Enhancement, they save the token but deny the patient. This creates tension between fiscal conservation (hoarding tokens) and clinical compassion (funding cases).
  *   **Silent Vote Integrity:** Ensure students do not discuss the vote before handing slips in. The data is for the debrief hook.

  ## VI. Handout: Deliberation Worksheet

  **Group Number:** _________
  **Written Criterion (One Sentence Only):**
  ____________________________________________________________________________
  ____________________________________________________________________________

  **Token Ledger:**
  *   Starting Tokens: 10
  *   Case 01 Funded? (Y/N) | Tokens Remaining: ___
  *   Case 02 Funded? (Y/N) | Tokens Remaining: ___
  *   Case 03 Funded? (Y/N) | Tokens Remaining: ___
  *   Case 04 Funded? (Y/N) | Tokens Remaining: ___
  *   Case 05 Funded? (Y/N) | Tokens Remaining: ___
  *   Case 06 Funded? (Y/N) | Tokens Remaining: ___
  *   **Penalty Fees (Criterion Changes):** _____ tokens forfeited.

  **Final Token Count:** _________
