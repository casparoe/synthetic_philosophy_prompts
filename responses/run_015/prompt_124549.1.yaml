answer: |-
  Kant's *Perpetual Peace* rests on a rigid architecture. Six preliminary articles clear the ground for peace, prohibiting secret reservations, independent state acquisition, standing armies, national debt for strife, interference in constitutions, and treacherous conduct. Three definitive articles constitute peace: every state must have a republican civil constitution; states shall unite in a federation of free states (*foedus pacificum*); and cosmopolitan right shall be limited to conditions of universal hospitality.

  The 2015 Paris Agreement resembles Kant's *foedus pacificum* rather than a supranational super-state, which Kant explicitly rejects as a soulless despotism. Paris preserves sovereignty while binding members to a common end. Kant's federation aims to end war, not ecological collapse. The Agreement's reliance on Nationally Determined Contributions (NDCs) lacks coercive enforcement. For Kant, this risks violating Preliminary Article Six, which forbids conduct undermining future confidence. If pledges are mere stratagems without intent, they are dishonorable. Yet, Preliminary Article Five protects state autonomy against external interference. Paris navigates this by inviting voluntary compliance, but Kant would argue that without public law coercing external freedom, such agreements remain provisional, not peremptory. The absence of sanctions suggests a moral appeal rather than the juridical condition Kant deemed necessary for durable peace.

  Furthermore, the principle of Common But Differentiated Responsibilities (CBDR) aligns more closely with Kant's third definitive article: cosmopolitan right. Resting on common possession of the earth, this article concerns shared space. Climate governance concerns the shared atmosphere, a global commons exceeding state borders. CBDR acknowledges this shared ownership while differentiating obligation based on historical contribution. Here, Kant's framework requires extension. Kant conceived cosmopolitan right regarding human movement and trade, not ecological interdependence. Moreover, Kant's social contract binds contemporaries; it is silent on obligations to future generations who cannot consent. The climate crisis introduces a temporal asymmetry Kant's legalism does not address.

  Kant's model explains the structural necessity of a voluntary federation over a world state, validating Paris's sovereign architecture. However, it misdescribes the nature of the threat, which is systemic rather than military, and leaves silent the juridical status of non-human nature and future persons. The Paris Agreement demonstrates that while Kant's formalism protects state autonomy, his theory must be expanded beyond interstate peace to account for planetary boundaries. We cannot simply apply Kant; we must reconstruct his cosmopolitanism to include ecological duty as a condition of possible freedom.
