prompt: |-
  I'm taking a graduate seminar on embodied cognition and we've been spending a lot of time on the free energy principle and predictive processing — Friston, Hohwy, Clark, Seth, the whole crew. Next week I have to lead the discussion and I want to come at it from a meta-level: before we even ask whether the FEP is *true*, what would it mean for it to be *adequate*? The literature is a mess on this. Some people treat it as a theory of everything (life, mind, culture), others as a narrow hypothesis about cortical microcircuits. Some say its unfalsifiable, others say it makes concrete predictions about precision-weighting and prediction error minimization. I want to go into class with a clear list of desiderata — what any theory pitched at this level of generality actually has to deliver to count as a genuine explanation rather than just a redescription or a mathematical framing device.

  So: write me the desiderata for a predictive processing / free energy principle account of cognition (let's bracket the "theory of life" stuff for now). I want the list of requirements — the phenomena it has to explain, the cases it has to get right, the distinctions it can't collapse, the empirical results it has to be consistent with — with the case or consideration behind each. Flag which desiderata are non-negotiable and which are preferences of particular camps (e.g., the people who want it to say something about consciousness vs. those who are happy if it just covers perception and action). And here's the part I most want: tell me which single desideratum does the most to exclude candidates, and whether any pair of desiderata on the list might be jointly unsatisfiable. If the list itself ends up being a result — like, if you can show that no theory can satisfy all of them — that's exactly the kind of thing I want to bring to class.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Context:** Graduate seminar on embodied cognition, focusing on Free Energy Principle (FEP) and Predictive Processing (PP).
      *   **Task:** Create a list of *desiderata* for evaluating the adequacy of FEP/PP as a theory of cognition (bracketing the "theory of life" claims).
      *   **Goal:** Move beyond "is it true?" to "what would count as a good explanation?" Address the messiness in the literature (ToE vs. narrow hypothesis, falsifiability, etc.).
      *   **Specific Requirements:**
          *   List requirements (phenomena, cases, distinctions, empirical consistency).
          *   Provide the rationale/case behind each.
          *   Flag non-negotiable vs. camp-specific preferences (e.g., consciousness).
          *   Identify the *most exclusionary* desideratum.
          *   Identify potential *tensions* or jointly unsatisfiable pairs.
          *   **Crucial:** If the list itself reveals a problem (e.g., impossibility), highlight that.

  2.  **Deconstruct the Subject Matter (FEP/PP):**
      *   *Core Claim:* Organisms minimize variational free energy (surprise) via perception (updating models) and action (changing inputs).
      *   *Scope:* Ranges from Bayesian brain hypothesis (neural implementation) to universal principle of self-organization (physics of life).
      *   *Critiques:* Tautological/unfalsifiable, too abstract to explain specifics, ignores embodiment/history/social context, struggles with novelty/creativity.
      *   *Proponents:* Friston (mathematical necessity), Hohwy (cognitive ontology), Clark (predictive brain), Seth (controlled hallucination).

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Idea 1: Empirical Fit.* It needs to match data. (Too vague).
      *   *Refinement:* It needs to explain specific neural phenomena like mismatch negativity or precision weighting.
      *   *Idea 2: Distinctness.* It shouldn't just be behaviorism in math clothes.
      *   *Refinement:* It must distinguish between *minimizing error* and *minimizing surprise* (the dark room problem).
      *   *Idea 3: Embodiment.* Since this is an embodied cognition seminar, it can't ignore the body.
      *   *Refinement:* It must account for morphological computation and non-neural control.
      *   *Idea 4: Normativity.* How does it handle error vs. success?
      *   *Refinement:* It needs a story about *which* priors are adaptive, not just that priors exist.
      *   *Idea 5: Scope.* Is it everything or nothing?
      *   *Refinement:* It needs to specify its own boundary conditions (when does it *not* apply?).

  4.  **Categorizing and Refining the List:**
      *   Let's group them: Explanatory Power, Empirical Adequacy, Conceptual Coherence, Scope/Boundaries.
      *   *Non-negotiable:* Must explain perception/action loop, must avoid tautology.
      *   *Camp-specific:* Consciousness (Seth vs. Hohwy), Social cognition.

  5.  **Identifying the "Killer" Desideratum:**
      *   What stops most theories? Usually, it's the *Dark Room Problem* (why don't we just sit in the dark to minimize surprise?) or the *Tautology Charge* (is it just math?).
      *   *Decision:* The **Non-Tautological Empirical Risk** is the biggest hurdle. If every behavior can be retrofitted as free energy minimization, it explains nothing.
      *   *Alternative:* The **Specificity vs. Generality Trade-off**. If it's general enough to cover all life, it's too vague to explain specific cognitive mechanisms.

  6.  **Identifying Tensions/Incompatibilities:**
      *   *Tension 1:* Universality vs. Mechanistic Specificity. (Friston wants it to be a law of nature; Clark/Hohwy want it to explain cortical columns).
      *   *Tension 2:* Homeostasis vs. Exploration. (Minimizing surprise suggests staying still; living suggests seeking novelty). This is the "Dark Room" problem again.
      *   *Tension 3:* Internalism vs. Embodied Externalism. (PP is often criticized for being "brain-bound" despite claims of embodiment).

  7.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the meta-theoretical stance (adequacy vs. truth).
      *   **The Desiderata List:** Grouped logically, with flags (Non-negotiable vs. Camp-specific).
      *   **The Exclusionary Desideratum:** Highlight the one that kills the most candidates.
      *   **The Tension/Impossibility Result:** This is the "graduate seminar gold." Show where the theory might break under its own weight.
      *   **Discussion Questions:** To help the user lead the class.

  8.  **Drafting the Content (Self-Correction during drafting):**
      *   *Correction:* Make sure to distinguish FEP (the math principle) from PP (the cognitive architecture). They are related but distinct.
      *   *Correction:* Ensure the "Embodied Cognition" context is respected. The critique should touch on how PP handles the body.
      *   *Refinement on the "Impossibility" claim:* Be careful not to say it *is* impossible, but that satisfying *all* desiderata simultaneously creates a severe tension that proponents often gloss over. This is a "Meta-Problem."

  9.  **Final Review against User Prompt:**
      *   List of requirements? Yes.
      *   Case/consideration behind each? Yes.
      *   Flag non-negotiable vs. camp preferences? Yes.
      *   Single most exclusionary desideratum? Yes.
      *   Jointly unsatisfiable pair? Yes.
      *   Tone: Academic, rigorous, suitable for a grad seminar leader.

  10. **Final Polish:** Check terminology (variational free energy, active inference, precision weighting, Markov blanket). Ensure the distinction between "mathematical framing" and "mechanistic explanation" is clear. (Proceed to generate output).

  *(Self-Correction during final output generation)*: I need to make sure I don't just bash FEP. The prompt asks for *desiderata for adequacy*, not a critique. The critique comes from whether the theory *meets* the desiderata. I must remain neutral but rigorous. The "Impossibility Result" should be framed as a challenge for the class to discuss, not a settled fact.

  Let's refine the "Jointly Unsatisfiable" pair. The best candidate is **Universality (FEP as Law)** vs. **Mechanistic Specificity (PP as Cognitive Theory)**. If it applies to cells and cultures equally, it struggles to explain *why* human cognition looks the way it does specifically. If it explains human cognition specifically, it loses its status as a universal law of life. This is the "Generality-Mechanism Trade-off."

  Let's refine the "Most Exclusionary." It's the **Risk of Post-Hoc Accommodation**. If the theory can explain *any* behavior after the fact, it predicts *none*.

  Okay, ready to write.cw
answer: |-
  This is a sharp approach. Moving from "Is it true?" to "What would count as success?" is the most productive way to handle the FEP/PP literature, which often oscillates between mathematical tautology and grand metaphysical claims.

  Below is a structured set of desiderata for evaluating the adequacy of Predictive Processing (PP) and the Free Energy Principle (FEP) as accounts of cognition. I have categorized them by function, flagged their status (Non-Negotiable vs. Camp-Specific), and provided the rationale. Following the list, I address the exclusionary criterion and the potential tension that could serve as the centerpiece of your seminar.

  ---

  ### Desiderata for Adequacy: FEP/PP as a Theory of Cognition

  #### I. Explanatory Specificity & Risk
  **1. The Post-Hoc Accommodation Constraint (Non-Negotiable)**
  *   **Requirement:** The theory must generate *risky* predictions that could falsify the model, rather than allowing any observed behavior to be retrofitted as "free energy minimization" via ad-hoc prior adjustment.
  *   **Rationale:** The most common critique of FEP is that it is unfalsifiable. If an organism explores, it is minimizing expected free energy (epistemic value). If it stays still, it is minimizing sensory surprise. If every outcome is consistent with the principle, the principle is a mathematical framing device, not a scientific theory.
  *   **Test Case:** Can the model predict *when* an agent will switch from exploration to exploitation without simply fitting parameters after the fact?

  **2. The Dark Room Resolution (Non-Negotiable)**
  *   **Requirement:** The account must explain why agents do not minimize surprise by retreating to unchanging, low-complexity environments (e.g., a dark room) but instead seek out novelty and homeostatic challenges.
  *   **Rationale:** Pure surprise minimization implies organisms should seek the most predictable states possible. Life requires maintaining non-equilibrium states. The theory must distinguish between *minimizing current surprise* (perception) and *minimizing expected future surprise* (active inference/seeking).
  *   **Test Case:** Explanation of curiosity, play, and information-seeking behavior in the absence of immediate physiological reward.

  #### II. Mechanistic Grounding
  **3. The Neural Implementation Gap (Non-Negotiable)**
  *   **Requirement:** The account must specify how variational calculus (or approximations thereof) is physically implemented in neural tissue without positing a "homunculus" doing the math.
  *   **Rationale:** FEP is often stated at a functional level. To be a theory of *cognition*, it needs a bridge to neurobiology (e.g., predictive coding in cortical microcircuits, pyramidal cell asymmetry).
  *   **Test Case:** Consistency with laminar-specific recordings (e.g., do superficial layers carry prediction errors and deep layers carry predictions, as Hohwy/Clark suggest?).

  **4. The Precision-Weighting Mechanism (Non-Negotiable)**
  *   **Requirement:** The theory must explain how the brain estimates the *precision* (inverse variance) of prediction errors to gate learning vs. action, and link this to known neuromodulatory systems.
  *   **Rationale:** This is the "control knob" of PP. Without a story about precision, the system cannot distinguish signal from noise.
  *   **Test Case:** Association of precision weighting with dopamine, acetylcholine, or noradrenaline. If PP cannot map precision to specific neurochemistry, it remains abstract.

  #### III. Embodiment & Environment
  **5. The Morphological Computation Constraint (Embodied Camp Preference)**
  *   **Requirement:** The account must acknowledge that not all prediction/error minimization happens in the brain; some is offloaded to body morphology and environmental structure.
  *   **Rationale:** In an embodied cognition seminar, a "brain-bound" PP is insufficient. If the theory treats the body merely as another input channel rather than a constitutive part of the generative model, it fails the embodied brief.
  *   **Test Case:** Explaining passive dynamic walkers or grip selection where physical constraints reduce computational load without neural intervention.

  **6. The Social Coupling Constraint (Social Cognition Camp Preference)**
  *   **Requirement:** The account must scale from individual Markov blankets to coupled Markov blankets (inter-brain synchrony) without reducing social interaction to individual simulation.
  *   **Rationale:** Proponents like Friston and Reddy argue FEP explains social alignment. Critics argue it reduces "the other" to a variable in my model.
  *   **Test Case:** Explanation of joint attention or turn-taking that relies on real-time coupling rather than internal modeling of the other's mind.

  #### IV. Normativity & Content
  **7. The Misrepresentation Problem (Non-Negotiable)**
  *   **Requirement:** The theory must provide conditions under which a generative model can be *wrong* in a way that matters, not just statistically divergent.
  *   **Rationale:** If success is defined purely as surprise minimization, a hallucination that is perfectly consistent with itself is "successful." A theory of cognition must distinguish between *adaptive* priors and *maladaptive* priors (e.g., psychosis).
  *   **Test Case:** Distinguishing a veridical perception from a stable delusion using FEP terms (usually done via "precision of priors" vs. "precision of sensory evidence").

  **8. The Historical/Developmental Constraint (Evolutionary Camp Preference)**
  *   **Requirement:** The account must explain *how* the right priors got there in the first place (phylogeny and ontogeny), not just how they are updated online.
  *   **Rationale:** FEP often treats priors as given. But a theory of cognition must explain the acquisition of the generative model itself.
  *   **Test Case:** Language acquisition or critical period learning.

  ---

  ### The Single Most Exclusionary Desideratum

  **#1: The Post-Hoc Accommodation Constraint.**

  This is the bottleneck. Most candidates for "FEP explanations" fail here. It is trivially easy to describe a behavior *ex post facto* as free energy minimization by positing a prior that matches the behavior.
  *   *Example:* Why did the rat press the lever? To minimize surprise about hunger states. Why did it stop? To minimize surprise about satiation states.
  *   *Exclusionary Power:* This desideratum excludes any version of FEP that does not specify **independent constraints on prior formation**. If the theory cannot tell us which priors are biologically plausible *before* we observe the behavior, it is a redescription, not an explanation. This filters out the "FEP as Universal Law" crowd who treat the principle as a tautology of self-organization.

  ---

  ### The Tension: Jointly Unsatisfiable Desiderata?

  Here is the result you can bring to class. There is a severe tension, potentially an incompatibility, between **Desideratum #3 (Neural Implementation/Specificity)** and the **Universal Scope of the FEP**.

  **The "Generality-Mechanism Trade-off":**

  1.  **If FEP is a Universal Law (Friston's strong claim):** It applies to cells, slime molds, brains, and cultures equally. It is a principle of non-equilibrium steady states.
      *   *Consequence:* It is too abstract to explain *specifically cognitive* phenomena. A cell minimizing free energy and a human minimizing free energy are doing the "same thing" mathematically. This renders the theory adequate for physics but inadequate for *cognitive science*, which requires distinguishing cognition from mere homeostasis.
  2.  **If PP is a Cognitive Theory (Hohwy/Clark's claim):** It relies on specific hierarchical Bayesian structures, cortical laminar asymmetries, and specific precision-weighting mechanisms.
      *   *Consequence:* It loses its status as a "Free Energy Principle." It becomes a specific hypothesis about vertebrate neocortex. It no longer explains life, culture, or simple organisms.

  **The Seminar Pivot:**
  You can argue that the literature is messy precisely because proponents try to hold both horns of this dilemma. They want the **prestige of universality** (it's a law of nature!) and the **explanatory power of specificity** (it explains schizophrenia!).
  *   **The Challenge:** Can a theory be both a tautological law of existence *and* a falsifiable mechanistic model of cortical function?
  *   **The Result:** If you demand **Non-Negotiable #1 (Risk)** and **Non-Negotiable #3 (Mechanism)**, you likely force FEP to abandon its claim to Universality. If you keep Universality, you likely fail **Non-Negotiable #1**.

  ### Discussion Questions for the Class

  1.  **The Tautology Trap:** If we accept FEP as a mathematical necessity for any self-organizing system (like the second law of thermodynamics), does it make sense to call it a "theory of cognition"? Or is it merely the *boundary condition* within which a theory of cognition must operate?
  2.  **The Body Problem:** Does Predictive Processing inadvertently re-introduce the Cartesian theater? If the brain is simulating the body to minimize error, is the body actually doing any cognitive work, or is it just another input stream? (Target Desideratum #5).
  3.  **The Normativity Gap:** FEP tells us how systems *persist*. It does not obviously tell us why some ways of persisting are *cognitive* and others are merely metabolic. Where is the line drawn? (Target the Generality-Mechanism Trade-off).

  ### Summary for your Opening Statement
  "To evaluate FEP/PP, we must stop asking if the math works (it does) and start asking if the mapping works. My proposal is that we cannot have it both ways: FEP cannot be a universal law of life *and* a specific mechanistic theory of cortical prediction without collapsing into tautology. Our task today is to decide which version we are willing to defend, and what we have to give up to keep it."
