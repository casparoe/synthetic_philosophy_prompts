  Then there is the lottery. You ask if it escapes comparison. It does not. It merely shifts the comparison from the ex post outcome to the ex ante chance. By defining the pool of medically eligible candidates, the committee has already performed a comparison. They have said that everyone inside the pool has equal claim, and everyone outside has none. That boundary decision is where the moral weight lies. The lottery converts a comparison of magnitudes into a comparison of chances, which changes what is said to the loser. It tells the loser that she was equally worthy but unlucky, rather than unworthy. This preserves the equal moral status of the candidates, but it does not solve the scarcity problem. It simply refuses to solve it through valuation. It is a procedure of resignation. Your characters might feel relief in adopting the lottery, but it is the relief of giving up the burden of judgment, not the relief of finding a correct answer.

  The public recoil you describe suggests that these comparisons were morally unavailable, even if epistemically possible. We can calculate social worth, but we may not do so when the currency is human life. The distinction matters. If the problem were epistemic, better data would solve it. If it is moral, better data makes it worse. The congressional solution of 1972 shows that the problem of interpersonal comparison is often a scarcity problem in disguise. By paying for everyone, Congress dissolved the need to compare. But something was relocated. The comparison moved from the bedside to the budget office. It became a comparison between dialysis patients and other claimants on the public purse. The lens of utility comparison is silent on this broader trade-off. It treats the budget as fixed when it is not.

  Finally, be plain about the expressive dimension. Social choice theory often ignores what it does to a person to be ranked. To be told you are less worth saving is to be objectified, treated as a means to social ends rather than an end in yourself. This harm is distinct from the harm of dying. It is a harm to dignity. Your characters must not speak in ways that deny this. They cannot say that the ranking was harmless because it saved lives. They must acknowledge that the procedure itself inflicted a wound on the community's self-conception. The nurse's ledger should reflect this. She can record the numbers, but she should also record the silence that follows the announcement. Do not let your characters resolve the tension. They should not find a formula that makes the choice easy. The hard truth is that there is no formula that preserves both efficiency and dignity under scarcity. They are entitled to believe they did the best they could with the tools they had, but they are not entitled to believe the tools were neutral. The words you must not put in their mouths are those that claim certainty. They cannot say they knew who deserved to live. They can only say they knew who the community could bear to lose. That is the limit of their knowledge, and it is where your story must live.
