      Finally, be plain about the expressive dimension. Social choice theory often ignores what it does to a person to be ranked. To be told you are less worth saving is to be objectified, treated as a means to social ends rather than an end in yourself. This harm is distinct from the harm of dying. It is a harm to dignity. Your characters must not speak in ways that deny this. They cannot say that the ranking was harmless because it saved lives. They must acknowledge that the procedure itself inflicted a wound on the community's self-conception. The nurse's ledger should reflect this. She can record the numbers, but she should also record the silence that follows the announcement. Do not let your characters resolve the tension. They should not find a formula that makes the choice easy. The hard truth is that there is no formula that preserves both efficiency and dignity under scarcity. They are entitled to believe they did the best they could with the tools they had, but they are not entitled to believe the tools were neutral. The words you must not put in their mouths are those that claim certainty. They cannot say they knew who deserved to live. They can only say they knew who the community could bear to lose. That is the limit of their knowledge, and it is where your story must live.

