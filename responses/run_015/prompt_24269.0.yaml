  If you want to settle the bet on the "Certain" sentence specifically, **Test Case 1** is better. If she calls "I doubt it" Moorean, she is following the Doxastic rule and will almost certainly call "I'm certain it isn't" Moorean. If she calls "I doubt it" *Not Moorean*, she is likely a Lexical Formalist, and the "Certain" sentence will also be **Not Moorean**.
