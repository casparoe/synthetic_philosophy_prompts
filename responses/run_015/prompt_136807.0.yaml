answer: |-
  This is a sophisticated observation. You have identified a specific rhetorical and ethical maneuver that is increasingly prevalent in museum discourse, particularly in debates surrounding the Humboldt Forum in Berlin and the British Museum in London.

  To answer your primary question directly: **No, there is no single, canonical term in political philosophy or museum ethics that precisely captures this specific configuration.**

  While the *components* of the argument exist in the literature, their combination into a justification for *retention* based on *perpetrator penitence* is not a standardized category like "Universalism" or "Stewardship." It is often discussed critically under labels like "curatorial alibi" or "moral laundering," but these are pejorative critiques rather than neutral conceptual definitions.

  Below is the conceptual carving you requested. I will map the neighboring concepts to clear the ground, then propose a precise term and definition for the phenomenon you described, establishing its boundary conditions.

  ### 1. Mapping the Nearest Concepts (The Boundaries)

  To understand why this phenomenon requires its own label, we must distinguish it from the three concepts your friend likely conflated with it.

  **A. The Universal Museum (Encyclopedic Museum)**
  *   **Core Claim:** Objects belong to "humanity," and major metropolitan centers are best positioned to display them for comparative education.
  *   **Difference:** Universalism is *cosmopolitan and forward-looking*. It argues that the object's *value* transcends its origin. Your described argument is *historical and backward-looking*. It does not claim the object belongs to humanity generally; it claims the object must stay *specifically in the perpetrator's capital* to testify against that capital. Universalism hides the violence behind "culture"; this argument highlights the violence to justify possession.

  **B. Standard Stewardship (Preservationism)**
  *   **Core Claim:** We must keep the object because we can care for it better (climate control, security) than the source community.
  *   **Difference:** Stewardship is *paternalistic but benevolent*. It claims to act in the object's or source community's best interest. Your described argument is *self-referential*. It claims the retention serves the *metropolitan public's* moral education, even if it contravenes the source community's wishes.

  **C. Counter-Monumentality (Gegen-Denkmal)**
  *   **Core Claim:** Memorials should implicate the viewer, resist closure, and sometimes disappear to prevent passive consumption of memory.
  *   **Difference:** Counter-monuments are *intentionally created* as such. They are commissioned acts of memory. The phenomenon you describe applies this logic *ex post facto* to *looted property*. It treats an object stolen for one reason (plunder/trophy) as if it were commissioned for another (evidence/memorial). This creates a category error regarding the object's ontology.

  **D. Dissonant Heritage (Troublesome Heritage)**
  *   **Core Claim:** Some heritage sites embody conflicting narratives (e.g., a slave castle is both a site of African suffering and a European trading post).
  *   **Difference:** This is the closest neighbor. However, "Dissonant Heritage" usually describes the *status* of the object, not the *argument for retention*. One can acknowledge dissonant heritage and still argue for restitution. Your friend's argument uses dissonance as a *veto* against return.

  ### 2. The Proposed Concept: "Penitential Custody"

  Since no established term exists, I propose labeling this argumentative move **Penitential Custody**.

  **Definition:**
  *Penitential Custody* is an ethical claim wherein a possessing institution acknowledges the illicit or violent provenance of an object but argues that its retention is morally necessary to serve as a permanent, material testament to that violence within the perpetrator's polity. Under this framework, the object is re-categorized from "property" to "evidence," and restitution is framed not as justice, but as the destruction of evidence or an evasion of historical responsibility.

  **The Logical Structure of Penitential Custody:**
  1.  **Admission:** The acquisition was wrongful (violence/theft).
  2.  **Reframing:** The object's primary current value is not aesthetic or cultural, but *forensic* and *pedagogical* regarding the crime of acquisition.
  3.  **Location Constraint:** This pedagogical value is location-specific; it must be viewed by the descendants of the perpetrators (the metropolitan public) to be effective.
  4.  **Conclusion:** Restitution would constitute an erasure of the crime; therefore, retention is a moral duty (a form of penance) rather than a property right.

  ### 3. Boundary Conditions (What It Is and Is Not)

  To use this term effectively in your debate, you must enforce these boundary conditions. If the argument deviates from these, it is not Penitential Custody.

  **Condition 1: The Admission of Wrong**
  *   *Boundary:* If the institution denies the violence or claims the acquisition was legal at the time, it is **Denialism**, not Penitential Custody.
  *   *Test:* Does the argument explicitly state, "We stole this, and that is why we must keep it"?

  **Condition 2: The Primacy of the Perpetrator's Conscience**
  *   *Boundary:* If the argument claims the object is kept for the *source community's* benefit (e.g., "they aren't ready to receive it"), it is **Paternalistic Stewardship**.
  *   *Test:* Does the argument prioritize the moral education of the *colonizer's* public over the *victim's* claim to the object? Penitential Custody explicitly privileges the former.

  **Condition 3: The Object as Evidence, Not Heritage**
  *   *Boundary:* If the argument claims the object is now part of the *metropolitan nation's identity* (e.g., "The Elgin Marbles are British now"), it is **Integrationism**.
  *   *Test:* Does the argument treat the object as a "trophy of shame" rather than a "treasure of pride"? Penitential Custody relies on the object remaining alien and accusatory.

  **Condition 4: Retention as the Only Memorial**
  *   *Boundary:* If the institution offers digital repatriation, funding for local museums, or other forms of repair while keeping the object, it is **Compensatory Retention**.
  *   *Test:* Does the argument claim that *physical presence* of the loot is the *only* valid form of remembering? Penitential Custody insists on the physical object in the metropolitan center as the unique site of testimony.

  ### 4. Conceptual Vulnerabilities (For Your Debate)

  If you need to critique this position, here are the philosophical weak points inherent to *Penitential Custody*:

  1.  **Instrumentalization of Victimhood:** It treats the source community's heritage as a tool for the perpetrator's moral growth. It effectively says, "Your ancestors' suffering is useful for our education, so we will keep the evidence of it."
  2.  **The "Crime Scene" Fallacy:** In law, evidence is kept to prosecute a crime. Once the crime is acknowledged (which this argument does), the evidence is usually returned to the owner. Keeping the evidence *after* admitting the crime transforms the museum from a court of justice into a permanent display of the perpetrator's power to retain the spoils.
  3.  **Agency Denial:** It assumes the source community cannot understand or teach their own history of colonization without the physical presence of the loot in London or Berlin. It denies the source community the capacity to be the primary narrators of their own trauma.

  ### Summary for Your Debate

  Tell your friend:
  > "You are describing **Penitential Custody**. It is not Universalism, because Universalism claims objects belong to *everyone*, whereas this claims the object belongs *specifically to the perpetrator* as a tool for their own moral correction. It is not Counter-monumentality, because those are designed memorials, whereas this is appropriated loot.
  >
  > The core ethical tension of Penitential Custody is that it prioritizes the **perpetrator's duty to remember** over the **victim's right to repair**. It argues that the metropolitan public's need to see the evidence of their guilt outweighs the source community's right to reclaim their heritage. We need to decide if that trade-off is ethically defensible."

  This framing moves the debate away from "Who can preserve it better?" (Stewardship) or "Where can more people see it?" (Universalism) to the actual core of the disagreement: **Who owns the memory of the violence?**
