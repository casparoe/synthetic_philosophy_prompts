answer: |-
  # Disambiguation Menu: The Procreation Asymmetry Slogan

  **Context:** The slogan *"Bringing a suffering person into existence is a wrong done to them, but failing to bring a happy person into existence is not a wrong done to anyone"* is frequently invoked in population ethics to justify the intuition that we have strong reasons not to create miserable lives but no strong reasons to create happy lives. However, this sentence conflates metaphysical, axiological, and deontic claims. The following menu isolates distinct logical structures hidden within the slogan.

  | # | Thesis Formulation (Truth-Apt) | Classification | Supports Practical Conclusion? | Hidden Premises & Requirements |
  | :--- | :--- | :--- | :--- | :--- |
  | **1** | **The Logical Subject Claim:**<br>Moral wrongs require a victim; since non-existent beings cannot be victims, failing to create them cannot be a wrong *to them*. | **Trivial / Conceptual**<br>(True by definition of "victim" in this context, but may beg the question). | **Partial.**<br>Supports the claim that failing to create happy people is not a wrong *to them*. Does not explain why creating suffering people *is* a wrong *to them* (since they then exist). | **Premise:** Moral wrongs are strictly person-affecting.<br>**Premise:** "Wrong to X" requires X to exist at the time of the act or consequence.<br>**Identity:** Relies on a fixed notion of identity across possible worlds. |
  | **2** | **The Person-Affecting Restriction (PAR):**<br>An act is morally wrong only if it makes some specific, identifiable person worse off than they would otherwise have been. | **Substantive & Controversial**<br>(Defensible in contractarianism; vulnerable to the Non-Identity Problem). | **Strong Support.**<br>Directly entails the asymmetry: Creating a suffering child makes *them* worse off; not creating a happy child makes *no one* worse off. | **Premise:** Impersonal values (e.g., "total utility") do not generate obligations.<br>**Comparison:** Requires a coherent baseline for "otherwise would have been" (problematic in non-identity cases). |
  | **3** | **The Axiological Asymmetry:**<br>The presence of suffering is intrinsically bad, but the absence of happiness is not intrinsically bad (unless there is someone deprived of it). | **Substantive & Defensible**<br>(Central to Benatar's Antinatalism; conflicts with classical utilitarianism). | **Strong Support.**<br>Provides the value foundation: Creating suffering adds badness; not creating happiness adds no badness. | **Premise:** Value is asymmetric (pain > pleasure).<br>**Metaphysics:** Assumes absence of pleasure is neutral *unless* a subject exists to be deprived.<br>**Logic:** Distinguishes between "bad" and "not good." |
  | **4** | **The Deontic Asymmetry:**<br>Agents have a strict duty not to harm (non-maleficence) but only an imperfect/optional duty to benefit (beneficence). | **Substantive & Defensible**<br>(Aligns with common-sense morality; hard to reconcile with maximizing consequentialism). | **Moderate Support.**<br>Explains why creating suffering is impermissible (violation of duty) and creating happiness is permissible (fulfillment of optional duty). | **Premise:** Duties of non-maleficence outweigh duties of beneficence.<br>**Scope:** Assumes potential persons fall under the scope of non-maleficence but not beneficence.<br>**Logic:** Distinguishes *obligatory* from *supererogatory*. |
  | **5** | **The Metaphysical Comparison Claim:**<br>Existence with suffering is *worse for* the individual than non-existence, but existence with happiness is *not better for* the individual than non-existence. | **Substantive & Likely False**<br>(Requires comparing existence to non-existence, which many argue is conceptually incoherent). | **Strong Support.**<br>If true, it grounds the asymmetry in welfare comparisons directly. | **Premise:** Non-existence is a valid baseline for welfare comparison.<br>**Metaphysics:** Requires "worse for" to make sense without a subject to experience the comparison.<br>**Identity:** Assumes the same individual can be referenced across existence and non-existence. |
  | **6** | **The Rights-Based Claim:**<br>Existing persons have rights not to be harmed; potential persons have no right to come into existence. | **Substantive & Defensible**<br>(Standard liberal legal/moral framework). | **Strong Support.**<br>Creating suffering violates a right; failing to create happiness violates no right. | **Premise:** Rights attach to existence.<br>**Premise:** Procreation is a privilege, not a duty.<br>**Logic:** Moves from "no right violated" to "not a wrong." |

  ---

  ### Analysis of Logical Structures

  #### 1. Axiological vs. Deontic Asymmetry
  The slogan obscures a critical distinction between *value* (axiology) and *obligation* (deontology).

  *   **Axiological Versions (Thesis 3 & 5):** These claim that the *states of affairs* are valued differently. Suffering is a negative value; the absence of happiness is a neutral value.
      *   *Vulnerability:* If one rejects the axiological asymmetry (e.g., a classical utilitarian who believes absence of happiness is a loss of value), the slogan fails unless supported by deontic constraints.
  *   **Deontic Versions (Thesis 2, 4, & 6):** These claim that even if creating happiness *would* be good, we are not *obligated* to do it, whereas we are obligated not to cause suffering.
      *   *Vulnerability:* These versions survive the rejection of axiological asymmetry. A utilitarian could accept that creating happiness adds value but deny we have a duty to maximize value via procreation (due to the Person-Affecting Restriction).

  **Recommendation:** When circulating this menu, clarify whether the argument rests on the *badness* of the outcome (Axiological) or the *stringency of the duty* (Deontic). The slogan is often used to smuggle axiological claims into deontic conclusions.

  #### 2. The "Worse For" Condition and Non-Existence
  The slogan's first half ("wrong done to them") relies on the claim that bringing a suffering person into existence makes them *worse off* than they would have been. The second half relies on the claim that not bringing a happy person into existence does *not* make them worse off.

  *   **If Non-Existence Cannot Be "Worse For":** Many philosophers (e.g., Pitcher, Feinberg) argue that non-existence cannot be a state of welfare. One cannot be deprived of happiness if there is no "one" to be deprived.
      *   *Impact on Thesis 5:* If non-existence cannot be a baseline for comparison, Thesis 5 becomes **Conceptually Incoherent**. You cannot say existence is "better than" non-existence if non-existence has no welfare level.
      *   *Impact on Thesis 2 (PAR):* The Person-Affecting Restriction survives this rejection *only if* it is formulated as "An act is wrong if it causes a person to *have* a low welfare," rather than "makes them worse off than they would be."
      *   *Impact on the Slogan:* If non-existence cannot be "worse for" an individual, the first half of the slogan ("wrong done to them") loses its comparative force. It must be rephrased as "wrong because it creates a being with a right not to suffer," shifting the weight entirely to **Thesis 6 (Rights)** or **Thesis 4 (Deontic Duties)**.

  #### 3. Practical Implications for Procreation
  Does the slogan actually settle the debate?
  *   **If Thesis 1 (Logical Subject) is the only support:** It proves we have no duty to create happy people, but it does not prove creating suffering people is wrong (unless we add a premise that causing suffering is always wrong).
  *   **If Thesis 3 (Axiological) is the only support:** It risks implying antinatalism (if absence of pain is *good*, we should never create anyone). The slogan tries to avoid this by calling the absence of happiness "not a wrong" rather than "good."
  *   **If Thesis 2 (PAR) is the only support:** It faces the Non-Identity Problem. If a child is created with a life worth living but with some suffering, are they "worse off" than if they hadn't existed? If not, PAR might fail to condemn their creation.

  ### Usage Note for Seminar Participants
  When invoking this slogan, specify which thesis number you are relying on.
  *   Use **#2** if arguing from a Person-Affecting Utilitarian framework.
  *   Use **#3** if arguing from a Benatar-style Antinatalist or Asymmetric Value framework.
  *   Use **#4** or **#6** if arguing from a Common-Sense Morality or Rights framework.
  *   Avoid **#5** unless prepared to defend the metaphysics of comparing existence to non-existence.
