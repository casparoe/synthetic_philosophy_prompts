      **OFFICE OF SITUATIONAL INTEGRITY**
      **INTERNAL MEMORANDUM**

      **TO:** Permanent Secretary
      **FROM:** Director of Operational Compliance
      **DATE:** 14 October 2023
      **SUBJECT:** Implementation Review: Environmentally Scoped Character Certificates (ESCC)
      **CLASSIFICATION:** OFFICIAL

      1. This memorandum provides a status update on the transition from Person-Level Ascriptions (PLA) to Environmentally Scoped Character Certificates (ESCC), pursuant to the settled empirical consensus regarding the non-existence of robust global character traits. It is confirmed that terms such as "integrity," "reliability," and "courage" remain prohibited in hiring, appraisal, and disciplinary documentation. Staff are certified only relative to specific environmental parameters (E). Certification lapses immediately upon material alteration to E.

      2. Operational data indicates that the evidence base for ESCC issuance relies predominantly on single-shot behavioural observations in contrived settings. Consequently, the Manual of Environments has expanded exponentially. A subject certified as Helpful-in-Phone-Booth-Vicinity cannot be assumed Helpful-in-Corridor-B. Each distinct room, corridor segment, and meeting format now constitutes a unique E requiring separate validation. Current projections suggest the Manual will exceed 10,000 pages by Q3, necessitating additional storage cost centres.

      3. A significant administrative burden has arisen regarding the grain of description. Auditors cannot specify when two environments count as identical without referencing the agent's perceptual field. To adjudicate this, the standing Re-graining Tribunal was established. The Tribunal recently ruled on the "Desk-Plant Variable," determining that the introduction of a houseplant to a previously barren desk constitutes a new E (Barren-Desk vs. Plant-Desk). Certificates issued for the barren configuration are voided upon plant installation. It is recommended that horticultural changes be logged in real-time to prevent compliance gaps.

      4. Regarding the accumulation of local certifications, critics suggest that a complete dossier of ESCCs functionally reconstructs the abolished vocabulary of character. While an employee is not certified as "Honest," a dossier containing "Honest-in-Atrium," "Honest-in-Cafeteria," and "Honest-in-Lobby" performs identical predictive work. The Department maintains that this is merely aggregate situational compliance, not global trait ascription. The distinction is semantic but legally necessary to avoid liability associated with PLA.

      5. The abolition of person-level blame has been replaced by Situational Maintenance. It is no longer permissible to discipline an employee for ethical failure; instead, the environment that precipitated the failure must be adjusted. This is presented as a humane advance and a cost saving over litigation. Mandatory adjustments include lighting lux levels, room booking protocols, scheduling density, and controlled caffeine distribution. Pre-emptive reassignment is authorised on the basis of environment risk. If a subject fails a certification in Low-Light-Conditions, they are not deemed unreliable; rather, Low-Light-Conditions are deemed incompatible with that subject's current certification profile.

      6. A worked case illustrates the current resolution protocol. Deputy Director Miller returned a lost wallet in the Main Atrium (certified: Honest-in-Atrium) but approved a falsified travel claim in Windowless Meeting Room 4 (certified: Unreliable-in-Windowless-Enclosure). Under previous PLA regimes, this contradiction would require a holistic judgment of character. Under ESCC protocols, no contradiction exists. The behaviours are scoped to distinct environments.

      7. However, as Miller's role requires 90% occupancy in Windowless-Enclosure environments, the aggregate risk profile is deemed suboptimal. While we cannot state Miller lacks integrity, we must conclude that the current deployment mismatches his certified environments. Therefore, Miller is to be reassigned to a role situated primarily in Atrium-adjacent spaces. Should such a role be unavailable, the position will be reclassified as requiring a different environmental certification profile.

      8. This outcome achieves the necessary personnel adjustment without invoking prohibited person-level ascriptions. The cost of reassignment is lower than the cost of maintaining Situational Maintenance adjustments (e.g., installing windows in Meeting Room 4). It is recommended that this logic be applied to all senior staff dossiers. The complete set of local certifications should be reviewed holistically to identify deployment mismatches, ensuring that the sum of environmental restrictions effectively guides personnel decisions without violating the ban on global traits.

      9. Action Points:
      *   Expand Re-graining Tribunal sittings to address carpet texture variables.
      *   Audit caffeine distribution logs for Q3.
      *   Proceed with Miller reassignment under Environmental Mismatch Protocol.

      10. The Department remains committed to the view that there are no honest people, only honest situations. Our task is to catalogue the situations and manage the people accordingly.

      **ENDS**

