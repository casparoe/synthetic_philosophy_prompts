      *   *The Case:* Make sure the resolution shows the reconstruction of character. If he failed in one room and passed in another, does he get a global rating? The memo should say "No, but..." and then effectively give a global rating.
      *   *Word Count Check:* Need to expand on the implications to hit 700-900. Elaborate on the "Situational Maintenance" costs vs. blame costs.

  7.  **Drafting the Text (Iterative):**

      *   *Header:* OFFICE OF SITUATIONAL INTEGRITY. INTERNAL MEMORANDUM.
      *   *Opening:* Reference the transition from Person-Level Ascriptions (PLA) to Environmentally Scoped Character Certificates (ESCC).
      *   *Body:* Discuss the granularity. The "Single-Shot Protocol." If a subject helps a stranger in Corridor A, they are not certified for Corridor B. The Manual of Environments is now 4,000 pages.
      *   *Re-graining:* The Tribunal. The "Desk-Plant Variable." If a plant is moved, is it a new environment? Yes, pending review.
      *   *Dossier:* We collect these certs. Critics say this equals "character." We say it is "aggregate situational compliance."
      *   *Blame:* We do not discipline. We adjust the situation. Lighting lux levels. Caffeine mg.
      *   *Case:* Deputy Director. Atrium (wallet) vs. Windowless Room (claim).
      *   *Resolution:* He is Honest-in-Atrium, Unreliable-in-Windowless. But since he spends 90% time in Windowless, we treat as Unreliable. (This is the punchline - rebuilding character).
      *   *Closing:* Recommendations.

  8.  **Review against Constraints:**
