  What would actually count against this? I want the specific predictions or results that should move me, not generic appeals to fossil records, plus an honest check on whether i've just added enough qualifications to make my view unfalsifiable. And please tell me what argument or evidence would change your mind on this, and where your reasoning is most likely to fail.
