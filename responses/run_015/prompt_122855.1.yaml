  *   **No** → Go to Node 5.

  **Node 4:** Is the amount you see equal to that absolute maximum?
  *   **Yes** → **Leaf 3**
  *   **No** → Go to Node 5.

  **Node 5:** If you played this game forever, would the average payout be a finite number?
  *   **No** → **Leaf 4**
  *   **Yes** → Go to Node 6.

  **Node 6:** Are you trying to maximize the total dollars won or the long-term growth rate of your wealth?
  *   **Growth Rate** → **Leaf 5**
  *   **Total Dollars** → Go to Node 7.

  **Node 7:** Does seeing the specific number change the chance that you hold the larger envelope?
  *   **No** → **Leaf 6**
  *   **Yes** → Go to Node 8.

  **Node 8:** In your calculation, is "the amount in my envelope" treated as one fixed number or as two different possibilities?
  *   **One Fixed Number** → **Leaf 7**
  *   **Two Different Possibilities** → **Leaf 8**

  ***

  **LEAF POSITIONS AND CLAIMS**

  **Leaf 1 (No Look + Single Act)**
  *   **Claim:** Symmetry Settles It (Before Looking).
  *   **Awkward Commitment:** Commits to ignoring potential gains from a universal swapping rule that works in every specific state.

  **Leaf 2 (No Look + Policy)**
  *   **Claim:** Switching Is Permitted (Policy).
  *   **Awkward Commitment:** Commits to gaining in every specific case while gaining nothing on average before looking.

  **Leaf 3 (Look + Known Max + At Max)**
  *   **Claim:** Switch Only Below Threshold.
  *   **Awkward Commitment:** Commits to the filler having a hard budget limit which contradicts the "any amount" setup usually implied.

  **Leaf 4 (Look + Infinite Expectation)**
  *   **Claim:** No Expectation To Compare.
  *   **Awkward Commitment:** Commits to rational choice being impossible when averages diverge.

  **Leaf 5 (Look + Finite + Growth Rate)**
  *   **Claim:** Growth-Rate View.
  *   **Awkward Commitment:** Commits to ignoring positive dollar expectations for geometric stability.

  **Leaf 6 (Look + Finite + Dollars + No Evidence)**
  *   **Claim:** Symmetry Settles It (After Looking).
  *   **Awkward Commitment:** Commits to the information gained by looking being worthless.

  **Leaf 7 (Look + Finite + Dollars + Evidence + Fixed)**
  *   **Claim:** Switching Is Permitted (State-wise).
  *   **Awkward Commitment:** Implies you should have swapped before looking too, contradicting the ex-ante symmetry.

  **Leaf 8 (Look + Finite + Dollars + Evidence + Variable)**
  *   **Claim:** Computation Equivocates.
  *   **Awkward Commitment:** Requires rejecting standard algebraic substitution in favor of case-by-case tracking.

  ***

  **UNOCCUPIED CELLS IN THE ANSWER SPACE**

  | Answer Combination | Diagnosis | Reason |
  | :--- | :--- | :--- |
  | **Swap before looking (Policy) BUT Keep whatever is revealed.** | Incoherent | Violates dynamic consistency; the plan made in ignorance contradicts the plan made with information. |
  | **Accept the 1.25 gain for every amount BUT insist switching ex ante gains nothing.** | Unattractive | Requires accepting state-wise dominance (win in every case) without overall gain (win on average). |
  | **Infinite Expectation BUT maximize Arithmetic Mean.** | Incoherent | The arithmetic mean is undefined, so it cannot be maximized. |
  | **Growth Rate Criterion BUT No Evidence (Symmetry).** | Unclaimed | Growth rate is typically invoked to solve the switching paradox, not the case where looking provides no information. |
