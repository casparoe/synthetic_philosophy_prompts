      *   The core issue in TEP is the improper prior or the treatment of the observed amount $A$ as a fixed constant when it's actually a random variable dependent on the pair generation.
      *   *Principle:* **Conditional Expected Utility Maximization.**
      *   Switch if $E[U(\text{Other}) | \text{Info}] > E[U(\text{Current}) | \text{Info}]$.
      *   Crucially, "Info" must include the *generation mechanism* (the prior distribution over pairs).
