      *   *Variant A (Small values likelier):* Prior $P(\text{pair} = \{x, 2x\})$ decreases as $x$ increases.
          *   If I open $A$, it is more likely to be the larger of a small pair than the smaller of a large pair (depending on the decay rate).
          *   Usually, this resolves the paradox. If $P(x)$ decays fast enough, for large $A$, $P(S|A) < 1/3$, so don't switch. For small $A$, $P(S|A) > 1/3$, so switch.
      *   *Variant B (10% Switching Cost):*
