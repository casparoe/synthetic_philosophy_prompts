answer: |-
  Here is the straight talk, followed by the dependency-aware roadmap.

  ### The Straight Talk: You Are Likely Using the Wrong Frame

  **Parfit's Hitchhiker is probably not the right model for most institutional commitment problems.**

  Here is the distinction:
  *   **Parfit's Hitchhiker (Newcomb-like):** A predictor simulates your decision *before* you make it. Your decision *logically correlates* with the predictor's past action. You survive only if you are the *kind of agent* who pays, even when paying is causally useless at the moment.
  *   **Institutional Time-Inconsistency (Ulysses Contract):** An organization makes a plan today that its future self will want to violate because incentives change. There is no magical predictor; there are just changing incentives and reputational costs.

  **Why this matters for you:**
  If you spend a year modeling "Sequential Hitchhiking" (Option 1), you are building formal logic for a problem that 90% of institutions do not face. Institutions do not usually face a driver who can read their source code and leave them in the desert. They face regulators, markets, and employees who react to *observable actions*, not logical dispositions.

  **Exception:** If your "institution" is an AI system negotiating with another AI system, or if the "predictor" is a market that perfectly prices in your source code, then Hitchhiker applies. If this is about human organizations (corporations, governments, NGOs), this is a **Principal-Agent / Time-Inconsistency** problem, not a Hitchhiker problem.

  **Terminology Check:** "Rational Irrationality" is a specific term coined by economist Bryan Caplan (meaning it is utility-maximizing to hold false beliefs). You seem to be using it to mean **"Strategic Precommitment"** (acting irrationally in the moment to satisfy a prior rational plan). Using the wrong term will make your literature review a nightmare.

  ---

  ### Dependency-Aware Ordering

  If your goal is **real-world impact on institutional design** with **one year** and **no formal logic**, here is how you should prioritize.

  #### 1. Upstream: Reframe the Problem (Weeks 1-4)
  **Task:** Determine if your specific case studies actually involve *prediction* or just *incentive drift*.
  *   **Why:** If you treat a standard Time-Inconsistency problem as a Hitchhiker problem, your solutions will be mystical ("be the right kind of agent") rather than mechanical ("change the contract").
  *   **Action:** Read Thomas Schelling (*The Strategy of Conflict*) and Kydland & Prescott (Rules vs. Discretion). Compare these to Parfit.
  *   **Decision Rule:** If the "predictor" cannot see your internal decision algorithm before acting, drop the Hitchhiker frame. Switch to **Credible Commitment Mechanisms**.

  #### 2. Core Priority: Option 3 (Institutional Design: Lock-in vs. Credibility)
  **Tractability:** High. **Impact:** High.
  *   **Why:** This is where the rubber meets the road. Real institutions don't solve commitment problems by changing their decision theory; they solve them by burning bridges, posting bonds, or decentralizing control.
  *   **Specific Angle:** Investigate the trade-off between **hard locks** (code that literally prevents a safety override) vs. **soft credibility** (reputational costs that make overriding unlikely).
  *   **Why prioritize this:** You don't need formal logic. You need case studies (e.g., nuclear launch protocols, central bank independence, open-source governance). This yields actionable policy recommendations.
  *   **Deliverable:** A taxonomy of commitment devices ranked by "reversibility cost."

  #### 3. Secondary Priority: Option 2 (Group Agency)
  **Tractability:** Medium. **Impact:** Medium-High.
  *   **Why:** Institutions are not monoliths. A "future self" wanting to break a safety protocol is usually a *different department* or *new leadership*, not the same agent with changed preferences.
  *   **The Trap:** Don't try to model "collective rationality" formally. That requires social choice theory (Arrow's Impossibility, etc.), which is math-heavy.
  *   **The Pivot:** Treat this as **Organizational Sociology**. How does personnel turnover affect commitment? How do you bind a future CEO who wasn't part of the original agreement?
  *   **Dependency:** This informs Option 3. You can't design a lock-in mechanism (Opt 3) if you don't know *who* is trying to break it (Opt 2).

  #### 4. Drop: Option 1 (Sequential Formal Models)
  **Tractability:** Low (for you). **Impact:** Low.
  *   **Why:** This requires Functional Decision Theory (FDT) or advanced Game Theory. Without a logic background, you will spend 6 months learning the math and 6 months producing a model that is too abstract for practitioners to use.
  *   **Real-World Relevance:** Practitioners do not run decision-theory simulations before signing safety protocols. They use legal contracts and technical constraints.
  *   **Verdict:** Cut this entirely. It is "philosophy for philosophers."

  ---

  ### The One-Year Roadmap

  If I were in your shoes, aiming for impact, this is the schedule:

  **Months 1-2: Diagnostic & Literature Review**
  *   Verify the "Hitchhiker" premise. Read *The Strategy of Conflict* (Schelling).
  *   Identify 3-5 real-world cases of institutional safety failure where commitment was the issue (e.g., Boeing 737 MAX, Theranos, Deepwater Horizon).
  *   **Goal:** Confirm that these were failures of *credibility* or *lock-in*, not failures of *logical decision theory*.

  **Months 3-6: Mechanism Analysis (Option 3)**
  *   Categorize the commitment devices used in your cases.
  *   Distinguish between **Technical Constraints** (code that won't compile), **Legal Constraints** (liability), and **Social Constraints** (reputation).
  *   Analyze which ones held and which ones broke under pressure.
  *   **Goal:** A framework for "Commitment Robustness."

  **Months 7-9: Group Dynamics (Option 2)**
  *   Layer in the human element. How did internal politics undermine the mechanisms from Months 3-6?
  *   Focus on **succession planning** and **institutional memory**.
  *   **Goal:** Recommendations for maintaining commitment across leadership transitions.

  **Months 10-12: Synthesis & Policy Draft**
  *   Write for an audience of safety officers, auditors, or regulators, not philosophers.
  *   Produce a "Commitment Checklist" for organizations pre-committing to safety.
  *   **Goal:** A practical document that could actually be used.

  ### Summary
  1.  **Drop the Hitchhiker label** unless you are specifically dealing with AI agents that can read each other's code. Use **Credible Commitment** instead.
  2.  **Prioritize Option 3** (Design/Mechanisms). It is tractable without logic and has direct real-world application.
  3.  **Use Option 2** (Group Agency) as context for Option 3, not as a formal modeling exercise.
  4.  **Drop Option 1** (Formal Models). It is a time sink with low practical ROI.

  This path moves you from "philosophical speculation" to "policy-relevant analysis" within your one-year constraint.
