answer: |-
  The shift from surveying theories of cognitive extension to specifying one for legal attribution changes the logical landscape. You are no longer asking what cognition *is*, but where liability and rights *attach*. This requires a criterion that treats the boundary of the person as a jurisdictional line, not merely a functional gradient. The following sorts the desiderata into non-negotiable requirements for legal administration, camp-specific preferences, and candidates for elimination, grounded in your case set.

  **Non-Negotiable Desiderata**
  1.  **Attribution Stability (Whose System?):** The criterion must assign resources to subjects uniquely or explain shared ownership without contradiction. This is driven by the **Shared Resource** case. If two collaborators rely jointly on an evolving store, a legal theory cannot say it is fully part of both minds if their interests conflict (e.g., data protection vs. subpoena). The criterion must resolve the many-one relation between resources and subjects.
  2.  **Withdrawal Sensitivity:** The criterion must track plasticity. As the **Withdrawal Pair** shows, removing the resource must produce a deficit comparable to internal loss. If the criterion counts a resource as cognitive but its removal leaves the subject functionally identical to someone who never had it, the attribution is empty. This ensures the right protects *capacity*, not just hardware.
  3.  **Administrative Determinacy:** Courts need verdicts, not spectra. The **Dormant Resource** case tests this. If extension is intermittent based on use, the law needs a principled temporal grain (e.g., "reasonable expectation of access") to decide if a powered-off implant is subpoenaable today. Vagueness here undermines rule of law.

  **Camp Preferences (Not Universal Requirements)**
  1.  **Avoidance of Cognitive Bloat:** This is often treated as a requirement, but it is actually conservatism about where persons stop. It is driven by the fear that if the internet is part of the mind, liability and rights become unmanageable. However, for the **Inscrutable Resource** (trained models), avoiding bloat might wrongly exclude reliable tools simply because they are vast. This is a preference for individualist ontology, not a logical necessity.
  2.  **Advance Applicability:** The demand that a researcher or judge apply the criterion without knowing the outcome is a legalist preference. Cognitive science often discovers boundaries retrospectively. Insisting on advance applicability privileges administrative convenience over metaphysical accuracy.

  **Struck from the List**
  1.  **Intrinsic Content:** The demand that cognitive content be non-derived is the anti-externalist conclusion packed into a criterion. For legal purposes, provenance matters less than control. If the state can compel production of a diary, it should compel a neural implant regardless of whether the content is "intrinsically" mental. This distinction should be struck; it begs the question against extension.
  2.  **Coincidence with Consciousness:** The requirement that extended states be phenomenologically accessible is an artifact of modelling cognition on belief attribution. Legal responsibility attaches to unconscious negligence and implicit biases. The **Inscrutable Resource** case proves trust and reliability can outstrip surveyability. Demanding consciousness excludes the very technologies (black-box algorithms) most needing regulation.
  3.  **Literal Parity Principle:** The move that "whatever plays the role of an internal process is cognitive" is a dialectical device, not a stable criterion. It overgenerates in the **Notebook Case** contrast (public directory vs. private notebook). Parity ignores the *history* of coupling. It should be replaced by a requirement for *integration*, not mere functional match.

  **The Trilemma and the Exclusionary Work**
  Your suspicion is correct: the trilemma of non-question-begging neutrality, determinate verdicts, and metaphysical openness is unsatisfiable. You cannot have all three.
  1.  **Non-Question-Begging:** To avoid assuming intracranialism, the criterion must be functional or relational.
  2.  **Determinate Verdicts:** Legal institutions require binary outcomes (liable/not liable, person/property).
  3.  **Metaphysical Neutrality:** Remaining neutral between functionalist, enactive, and embodied accounts means accepting that boundaries may be fluid or non-existent.

  The conflict lies between 2 and 3. Enactive and embodied accounts often deny sharp boundaries between agent and environment, viewing cognition as a dynamic flow. This metaphysical honesty destroys legal determinacy. To get determinate verdicts for the **Shared** and **Monitored** cases, you must adopt a specific ontology—likely a functionalist-integrationist one—that draws lines where nature offers gradients. Therefore, **Metaphysical Neutrality** must be dropped. A legal theory of cognitive liberty must commit to an ontology of the person to define the scope of rights. You cannot adjudicate interference with the person without defining where the person ends.

  The second tension—Symmetry, No Bloat, Causal Criterion—reveals that **Avoidance of Bloat** does the most exclusionary work. A purely causal/functional criterion naturally extends to the environment (symmetry). To stop the bloat (the internet, the linguistic community), you must introduce a non-functional constraint, typically based on *history of formation* or *exclusive control*. This is what handles the **Monitored Resource**: if the state shapes the resource through surveillance, the "exclusive control" condition fails, preventing the state from claiming the resource is part of the subject (which would allow subpoena) or preventing the subject from claiming it (which would protect it). The bloat constraint forces the theory to privilege individual ownership over causal reality.

  Finally, the desideratum met only by a view nobody holds is **Metaphysically Neutral Determinacy**. Functionalists get determinacy but lose neutrality. Enactivists get neutrality but lose determinacy. No existing view satisfies the legal need for fixed boundaries while remaining ontologically agnostic.

  **Scoring the Candidates**

  | View | Verdict Stability | Bloat Risk | Shared/Drifting Handling |
  | :--- | :--- | :--- | :--- |
  | **Parity-Functionalism** | High. Rules-based matching yields clear yes/no. | High. Risks counting public directories as memory. | Fails Shared. Cannot distinguish joint vs. individual ownership easily. |
  | **Commonsense-Coupling** | Medium. Relies on intuitive boundaries. | Low. Privileges skull-boundary defaults. | Fails Drifting. Cannot explain why overnight changes count as *my* belief. |
  | **Diachronic-Systems** | High. Tracks history of integration over time. | Medium. Requires clear timeline of "shaping." | Handles Shared well (tracks contribution). Handles Drifting via update protocols. |
  | **Enactive** | Low. Rejects fixed boundaries as category errors. | None. Dissolves the inside/outside distinction. | Fails Legal Purpose. Cannot assign liability if the system is fluid. |
  | **Enculturation-Integration** | Medium. Focuses on normative uptake. | Low. Limits extension to sanctioned practices. | Handles Monitored well (coercion breaks integration). Struggles with Dormant. |

  **Coda**
  If the purpose were explanatory rather than normative, the requirement for **Administrative Determinacy** would drop out. A cognitive scientist benefits from modeling the **Shared** or **Drifting** cases as fluid gradients of coupling rather than forcing a binary verdict on ownership. Explanatory power thrives on the vagueness that legal liability must resolve.
