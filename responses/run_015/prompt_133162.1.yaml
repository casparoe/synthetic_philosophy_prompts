ductions regardless of contingent agreement. (10) The conclusion seems to prove too much, for it would also eliminate aesthetic truth in any genuinely novel domain of experience. Which step should I reject, and what does rejecting it cost? I am especially reluctant to give up (1) or (9), though I am open to paying elsewhere.
