      *   **Refining the Bottom Line:** The friend's reading is substantially correct regarding Smith's contrast and critique, though Smith is more focused on economic efficiency than defining the essence of "colony." The word "pretended" means "professed" without hypocrisy. The "plain and distinct" phrase validates the clarity of the Greek motive (necessity) compared to the confused motives of moderns.

