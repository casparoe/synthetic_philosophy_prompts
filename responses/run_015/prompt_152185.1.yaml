answer: |-
  Your friend's "venture-colony" reading survives and is largely correct, as Smith explicitly contrasts the natural necessity and independence of Greek settlements with the speculative, monopoly-driven dependency of modern European colonies to argue that the latter are economically irrational.

  Regarding your first confusion, the word "pretended" in 18th-century usage primarily means "professed," "claimed," or "put forward," without the modern connotation of deception or hypocrisy. When Smith writes that the mother city "pretended to claim no direct authority," he means she officially professed that she held no authority, and historically, this professed lack of authority matched the reality of the relationship. Smith is establishing a factual contrast here: Greek colonies were genuinely independent states, whereas modern colonies were legally and economically subordinate to the mother country. There is no irony implying the Greeks were lying; rather, he is highlighting that their claim of non-interference was actual practice, which facilitated the colony's success.

  On your second point, when Smith says the interest directing Greek establishments was "plain and distinct," he is endorsing the clarity and naturalness of their motive compared to the muddled motives of modern colonizers. For the Greeks, the "interest" was survival and relief from overpopulation—a tangible, necessity-driven motive that resulted in stable, self-governing communities. Smith contrasts this with the modern European motive, which he frequently describes elsewhere in the chapter as driven by the "chimerical" hope of finding gold and silver or by the mercantilist desire for trade monopolies. By calling the Greek interest "plain and distinct," Smith implies it was rational and transparent, whereas the modern venture was often speculative, costly, and obscured by bad economic policy.

  The "emancipated child" metaphor is doing significant normative work, though Smith's normativity is grounded in economic efficiency rather than abstract political rights. Smith uses the Greek model to demonstrate that colonies flourish best when left to govern themselves, whereas modern colonies become sources of conflict and expense because the mother country tries to retain authority for the sake of monopoly trade. He is not merely describing history; he is building a case that the modern system of colonial dependency is a perversion of natural liberty and economic sense. Later in the same chapter, Smith argues that the cost of defending modern colonies outweighs the revenue they produce, famously suggesting that Britain would be better off letting America go. Therefore, your friend is right to see the Greek example as a normative benchmark: Smith believes the modern empire's attempt to rule colonies is a costly error, whereas the Greek practice of emancipation was economically and politically sound.
