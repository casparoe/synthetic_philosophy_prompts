  2.  **Analyze the Text & Context (Smith's *Wealth of Nations*):**
      *   **Book IV, Chapter VII:** "Of Colonies." This is a massive chapter, often published as a separate volume later. It's divided into two parts: Part I (Causes of Prosperity of New Colonies) and Part II (Causes of Prosperity of Ancient Colonies / Disadvantages of Modern Colonies).
      *   **The Passage:** This specific quote comes from the beginning of Part II ("Of the Motives for establishing new Colonies"). Smith is comparing ancient (Greek) colonies with modern (European) colonies.
      *   **Meaning of "Pretended":** In 18th-century English, "pretend" often meant "to profess," "to claim," or "to intend," without the modern connotation of deception or hypocrisy. However, context matters. Smith is describing the *relationship*. The mother city *claimed* no authority. Did they actually have none? Yes, historically Greek colonies were independent. So "pretended" here likely means "professed" or "put forward as a claim." It doesn't imply hypocrisy because the claim matched reality (they *didn't* have authority).
      *   **Meaning of "Plain and Distinct":** Smith is saying the *motive* (interest) was clear. For Greeks, it was overpopulation/necessity. For moderns, it was wealth/discovery. Is he praising the Greek motive? He tends to view the Greek model as more natural and less distorted by mercantilist policy.
      *   **The "Venture-Colony" Reading:** The friend argues Smith sees Greek colonies as the normative ideal (emancipated, self-governing) and modern ones as a perversion (speculative, monopoly).
      *   **Smith's Actual Argument:** Smith *does* contrast Greek and modern colonies. He argues Greek colonies arose from necessity (overpopulation) and were independent. Modern colonies arose from the desire for wealth (gold/silver) and were subject to monopoly/restriction by the mother country. He criticizes the modern system of monopoly and restriction heavily later in the chapter. He argues that the expense of defending modern colonies outweighs the benefit, especially under the mercantilist system.
      *   **Does Smith advocate sovereignty?** Smith generally argues against colonial subjection because it is economically inefficient and leads to conflict. He famously suggests either representation or separation (the American Revolution was happening as he wrote). He views the Greek model as historically successful and peaceful compared to the friction of modern empire.
