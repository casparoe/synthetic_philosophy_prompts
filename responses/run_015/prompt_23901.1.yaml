          *   *Analysis:* The conflict arises from assuming the state at $t_1$ is a *function* of the sequence of states at $t < t_1$. In continuous dynamics (position), it is. In discrete switching, it isn't necessarily.
      *   **The Core Diagnosis:** It is a **category error regarding causal continuity**. We expect physical states to be continuous functions of time (or at least determined by immediate past). Thomson's Lamp violates the principle of *causal determinacy* without violating *logical consistency*.
