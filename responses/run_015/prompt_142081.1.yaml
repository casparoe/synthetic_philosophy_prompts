prompt: |-
  Hey — I'm setting the final for my upper-level seminar on truth and paradox. They've done Tarski-style hierarchies, Kripkean fixed points with strong Kleene, LP / dialetheism, and a week on revision theory. I need one essay question, 45 minutes, 25 marks, plus a model answer of about 700 words and a marking scheme — and I really don't want it answerable by someone picking their favourite theory in paragraph one and reciting it for three pages.

  The crux I want them forced onto is whether "ungrounded" or "has no classical fixed point" is a diagnosis or just a re-description of the problem. So build the question around four cases and make them run one theory across all of them: (1) the plain self-referential liar; (2) a two-way infinite chain of sentences, indexed by the integers, where each one says the next one isn't true — so classical two-valued models do exist (the alternating ones), but there's no base anywhere, nothing the chain bottoms out in; (3) the truth-teller; (4) a Yablo-style one-way sequence where each sentence says that every later sentence is untrue, which has no classical model at all but no self-reference or circularity either.

  The question should also make them say what they think a solution is even supposed to deliver — classical logic, unrestricted T-biconditionals, being able to state your own semantics in the object language — and own whichever of those they're giving up. And it has to block the move where they just write "all four are ungrounded, done."

  For the marking scheme: five must-hit points with marks each (total 25), and a line per point on how people typically blow it. Last thing: tell me which of the four cases best seperates an A from a B answer and why. I think it's the chain, but convince me — and if you think I've got the wrong four cases, say so.
