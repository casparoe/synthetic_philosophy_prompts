answer: |-
  ### Exam Question: Truth and Paradox Seminar

  **Time Allowed:** 45 Minutes
  **Marks:** 25

  **Question:**
  Select **one** theoretical framework covered in this course (e.g., Tarskian hierarchies, Kripkean fixed points, LP, or Revision Theory). First, explicitly state what a theory of truth ought to preserve (e.g., classical logic, unrestricted T-biconditionals, semantic closure) and what your chosen framework sacrifices to achieve this.

  Next, apply your chosen framework uniformly to the following four cases:
  1.  **The Liar:** $\lambda \leftrightarrow \neg T\lambda$
  2.  **The Two-Way Chain:** A sequence indexed by $\mathbb{Z}$, where $S_i \leftrightarrow \neg T S_{i+1}$.
  3.  **The Truth-Teller:** $\tau \leftrightarrow T\tau$
  4.  **The Yablo Sequence:** $S_i \leftrightarrow \forall k > i (\neg T S_k)$.

  Finally, evaluate the concept of **"ungroundedness"** (or the equivalent structural diagnosis in your chosen theory). Does labeling these cases as ungrounded (or unstable/circular) offer a genuine *diagnosis* of why they resist classical truth-values, or is it merely a *re-description* of the fact that they resist classical truth-values? Use the Two-Way Chain specifically to support your evaluation.

  ***

  ### Model Answer (Approx. 700 words)

  I will evaluate these cases using **Kripke's Theory of Truth (Strong Kleene)**. The primary goal of this framework is to retain the **unrestricted T-biconditional** ($T\ulcorner A\urcorner \leftrightarrow A$) within a semantically closed language. To achieve this, Kripke sacrifices **bivalence** and classical logic; sentences may be true, false, or gappy (undefined).

  **Application to the Four Cases**
  1.  **The Liar:** In the minimal fixed-point construction, $\lambda$ never acquires a truth value. Since its value depends on its own negation, it remains in the gap at every stage. Kripke diagnoses this as **ungrounded**: its truth conditions do not bottom out in non-semantic facts.
  2.  **The Two-Way Chain:** Classically, this sequence is satisfiable (e.g., an alternating T/F assignment). However, in Kripke's construction, every $S_i$ depends on $S_{i+1}$. Since there is no base case (no $S_n$ grounded in non-semantic reality), the induction never starts. All $S_i$ remain gaps.
  3.  **The Truth-Teller:** $\tau$ is consistent with both Truth and Falsity. Kripke's minimal fixed point leaves it gappy (ungrounded), though intrinsic fixed points exist where it is true. It is ungrounded because its truth value is not forced by the base level.
  4.  **The Yablo Sequence:** Like the Liar, this has no classical model. In Kripke's construction, every $S_i$ depends on the infinite tail. No sentence ever receives a value; all are gaps.

  **Diagnosis vs. Re-description**
  The crux of the matter is whether "ungroundedness" explains the pathology or merely labels it. If "ungrounded" simply means "fails to receive a value in the minimal fixed point," it is a **re-description**. It tells us *that* the construction fails, not *why* the sentence is problematic independent of the construction.

  The **Two-Way Chain** is the decisive test here. Unlike the Liar or Yablo, the Chain is **classically consistent**. There is no contradiction in assigning them alternating truth values. Yet, Kripke's theory classifies them as ungrounded gaps. If ungroundness were a metaphysical flaw in the sentences themselves (a genuine diagnosis), one would expect classical logic to fail here, as it does with the Liar. But classical logic succeeds.

  This suggests that "ungroundedness" in Kripke's theory is partly an artifact of the **bottom-up construction method**. The theory requires truth to "flow up" from non-semantic facts. The Chain has no bottom, so truth cannot flow. However, since the Chain is classically coherent, labeling it "ungrounded" looks less like identifying a deep paradox and more like noting that the Kripkean machinery cannot grasp it.

  Therefore, "ungroundedness" is a **structural diagnosis relative to the theory**, but a **re-description relative to the sentences**. It explains why *Kripke's semantics* assigns gaps, but it does not explain why the sentences *themselves* should lack truth values, particularly in the Chain case where classical valuations are perfectly coherent.

  **Conclusion and Trade-offs**
  By choosing Kripke, I preserve the T-biconditional and semantic closure but abandon classical logic (excluded middle fails for the Liar and Chain). This is a worthy trade-off to avoid Tarski's hierarchy, which makes the truth predicate ambiguous. However, the treatment of the Two-Way Chain reveals a cost: the theory treats classically consistent sentences as defective simply because they lack a well-founded dependency structure. A robust theory of truth should ideally distinguish between the Liar (inconsistent) and the Chain (consistent but non-well-founded). Kripke conflates them under "ungrounded." Thus, while ungroundedness is a useful technical tool for generating fixed points, it is not a sufficient philosophical diagnosis of truth-theoretic pathology. It describes the failure of the construction, not necessarily the failure of the sentence.

  ***

  ### Marking Scheme (25 Marks Total)

  **1. Statement of Theoretical Goals and Trade-offs (5 Marks)**
  *   **Full Marks:** Clearly identifies the chosen framework, states what it preserves (e.g., T-schema, closure), and explicitly states what is sacrificed (e.g., bivalence, classical logic, determinacy).
  *   **How they blow it:** Vaguely describing the theory without mentioning the logical costs. E.g., "Kripke solves the liar" without noting that Excluded Middle is lost.

  **2. Application to Liar and Truth-Teller (5 Marks)**
  *   **Full Marks:** Correctly identifies the Liar as a gap (or glut, depending on theory) and the Truth-Teller as indeterminate/multiple fixed points. Distinguishes the inconsistency of the Liar from the consistency of the Truth-Teller.
  *   **How they blow it:** Treating the Truth-Teller exactly like the Liar. Failing to note that the Truth-Teller *can* be true in some fixed points, whereas the Liar cannot.

  **3. Application to Yablo and Two-Way Chain (5 Marks)**
  *   **Full Marks:** Correctly applies the theory to both. Crucially, notes that the Chain *has* classical models (alternating values) while Yablo does not, even if the chosen theory treats both as gaps/unstable.
  *   **How they blow it:** Claiming the Chain is classically inconsistent (it is not). Treating Yablo as identical to the Liar without noting the lack of explicit circularity.

  **4. The "Ungroundedness" Evaluation (Diagnosis vs. Re-description) (5 Marks)**
  *   **Full Marks:** Engages directly with the prompt's philosophical core. Argues whether the label explains the problem or just names the symptom. Uses the Chain to show that "ungrounded" sentences can be classically coherent.
  *   **How they blow it:** Defining "ungrounded" technically but failing to evaluate its philosophical status. Saying "It is a diagnosis because Kripke says so."

  **5. Use of the Two-Way Chain as the Differentiator (5 Marks)**
  *   **Full Marks:** Uses the Chain to challenge the theory. Points out the tension: The theory rejects the Chain (gaps), but Classical Logic accepts it. This forces the "re-description" conclusion.
  *   **How they blow it:** Ignoring the Chain's specific properties. Writing "The Chain is ungrounded, done." Failing to see why the Chain is harder to justify as pathological than the Liar.

  ***

  ### Instructor Note: Why the Chain Separates A from B

  You are correct; the **Two-Way Chain** is the critical differentiator.

  *   **The B-Answer:** Treats the Chain as "just another paradox." They will apply the theory mechanically: "In Kripke's theory, the Chain is ungrounded, so it gets a gap." They stop there. This shows they understand the *mechanics* of the theory but not its *philosophical implications*.
  *   **The A-Answer:** Recognizes the Chain is **classically satisfiable**. They realize that if a theory classifies a classically consistent set of sentences as "defective" (gappy), the defect might lie in the theory's requirement for well-foundedness, not in the sentences. This allows them to answer the "Diagnosis vs. Re-description" prompt with nuance: "Ungroundedness explains why the *construction* fails, but fails to explain why the *sentence* is bad, because the Chain isn't bad."

  **Why not Yablo?** Yablo is often treated as "The Liar without circularity." Students often memorize that Yablo = Paradox. It doesn't force them to confront the *consistency* of the sentences in the same way the Chain does.
  **Why not Truth-Teller?** Too standard. Most students memorize "Truth-Teller = indeterminate."
  **Why not Liar?** Too easy. Every theory has a standard move for the Liar.

  The Chain forces the student to admit that their chosen theory might be *over-generating* pathology. That is the mark of an upper-level understanding.
