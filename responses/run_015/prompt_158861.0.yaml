answer: |-
  ### The Trap of the Fence: A Critique

  A naive application of Chesterton's Fence fails in bureaucratic archaeology for two reasons. First, **the problem of invisible prevention.** If a rule successfully prevents a catastrophe (e.g., systemic fraud, environmental contamination), the catastrophe does not occur, and the rule appears redundant. Silence from the public is not evidence of safety; it is often evidence of the rule's success. To demand a discovered reason before repeal is to demand that safety prove its necessity by failing. Second, **the problem of functional drift.** The original architect's intent is historical data, not engineering data. A rule erected to protect horse traffic may now sustain pedestrian safety. If you repeal because the *original* reason is obsolete, you collapse the *current* function. Therefore, we cannot rely on history (Burke) nor on perfect knowledge (Naive Chesterton). We must rely on **functional stress-testing**. We adopt Chesterton's permission to destroy, but only after verifying current load-bearing capacity, rejecting Burkean deference to age alone.

  ***

  ### THE PROCEDURE: Functional Necessity Test (FNT)

  **Budget:** 6 Hours per rule. **Stopping Rule:** If no current function is identified by hour 5, proceed to Risk Assessment (Step 4).
  **Philosophy:** *Functionalism.* Age confers no presumption of validity. Retention requires a demonstrated *current* benefit that outweighs compliance costs.

  **1. Map the Burden (1 Hour)**
  *   **Q:** Who pays the cost (time, money, friction) to comply?
  *   **Sufficient Answer:** Quantified estimate (e.g., "$50 per application," "2-week delay").
  *   **Stop:** If cost is negligible, **RETAIN** (not worth the political capital to repeal).

  **2. Identify Current Function (3 Hours)**
  *   **Q:** What specific harm occurs *today* if this rule vanishes? Ignore original intent.
  *   **Sufficient Answer:** A causal mechanism (e.g., "Without dual signatures, single actors can embezzle >$10k").
  *   **Note:** "It's always been done" is **not** an answer. "Fraud might happen" is insufficient without a vector.
  *   **Stop:** If a credible, high-severity harm is identified, go to Step 3. If no function is found, go to Step 4.

  **3. Assess Reversibility & Reliance (1 Hour)**
  *   **Q:** If we repeal and harm occurs, can we reinstate the rule quickly? Have actors invested based on this rule?
  *   **Sufficient Answer:** "Yes/No" on legal ability to reinstate; "High/Low" on private reliance (e.g., businesses locating based on zoning).
  *   **Decision:**
      *   Harm Identified + Low Reversibility + High Reliance → **RETAIN**.
      *   Harm Identified + High Reversibility → **REPEAL with Monitoring** (Sunset clause).

  **4. The Risk of Ignorance (1 Hour)**
  *   **Q:** We found no reason. What is the worst-case scenario if we are wrong?
  *   **Sufficient Answer:** Bounded worst-case (e.g., "Minor paperwork errors" vs. "Public health crisis").
  *   **Decision:**
      *   Worst-case is manageable/reversible → **REPEAL**.
      *   Worst-case is catastrophic/irreversible → **REFER TO APPOINTEE**.

  **Referral Criteria:** Send to Appointee only when the trade-off is **Values** (e.g., "Is economic growth worth potential risk to children?") rather than **Facts** (e.g., "Does this prevent fraud?").

  ***

  ### Application to Cases

  **1. Notarised Paper Copy (Licence Applications)**
  *   **Burden:** High (travel to notary, postage, delay).
  *   **Function:** Identity verification/fraud prevention.
  *   **Reversibility:** High (digital logs exist; notarization can be reinstated if fraud spikes).
  *   **Verdict:** **REPEAL.** The cost is certain; the harm is speculative and detectable.
  *   **Confidence:** 90%.

  **2. Dual Signatures on Payments (Internal)**
  *   **Burden:** High (administrative delay, bottleneck).
  *   **Function:** Embezzlement prevention.
  *   **Reversibility:** Medium (money lost is hard to recover, but controls can be tightened).
  *   **Analysis:** This is an internal control. The "harm" is financial loss. Modern audit trails often render dual signatures obsolete.
  *   **Verdict:** **REPEAL (with audit logging requirement).**
  *   **Confidence:** 80%.

  **3. Product Sales Buffer (Distance from Schools)**
  *   **Burden:** Medium (limits business locations).
  *   **Function:** Reduce minor access/exposure.
  *   **Reversibility:** **Low.** If repealed, shops open. If harm is found later, closing them invites litigation and political fury.
  *   **Analysis:** No one can explain the *exact* distance (why 500m not 400m?), suggesting arbitrary origin. However, the *current function* (barrier to access) is credible, and reliance is high (existing businesses rely on the zone).
  *   **Verdict:** **RETAIN.**
  *   **Why Director will dislike it:** It is a clear restriction on commerce with no written rationale. It looks like "red tape." But the irreversibility of allowing shops to open near schools makes repeal a one-way door.
  *   **Confidence:** 60%.

  ***

  ### Limitations & Confidence Statement

  **What this procedure cannot do:**
  1.  **Predict Black Swans:** It cannot identify harms that are conceptually unknown to the reviewers (e.g., a specific data privacy risk in a paper filing rule).
  2.  **Resolve Value Conflicts:** It identifies trade-offs but cannot decide if "economic efficiency" is worth "potential risk." That is the Appointee's job.
  3.  **Overcome Political Inertia:** A "Retain" recommendation may be ignored by leadership seeking headline repeals.

  **Confidence Levels:**
  *   **Framework Validity:** High (85%). It balances speed with safety.
  *   **Case Verdicts:** Medium (60-90%). The School Buffer verdict is the most fragile.
  *   **Least Sure Step:** **Step 4 (Risk of Ignorance).** Estimating the "worst-case scenario" when the *reason* for the rule is unknown is inherently speculative. We are guessing the magnitude of a threat we cannot name. This is where the procedure relies most on the reviewer's intuition, making it the greatest source of potential error.
