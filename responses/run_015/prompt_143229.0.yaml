  **MEMORANDUM**

  **TO:** Safety and Capital Planning Committee
  **FROM:** [Your Name/Title]
  **DATE:** October 10, 2023
  **SUBJECT:** Allocation of One-Time Safety Grant – Option A (Elm Street) vs. Option B (Network Retrofits)

  **RECOMMENDATION**
  I recommend the Committee approve **Option A**: the full reconstruction of the Elm Street level crossing. Funding should be obligated immediately upon approval, with construction tendering beginning Q1 of the next fiscal year and substantial completion within 18 months.

  **PROPOSED DECISION RULE**
  For inclusion in the minutes and future planning guidelines:
  > "When allocating safety capital, projects that eliminate known high-concentration lethal hazards (defined as single locations with ≥3 fatalities in the preceding 20 years) take precedence over projects offering diffuse network-wide risk reductions, provided the cost per life saved remains within statutory ceilings. Diffuse benefits may only override this priority if the projected statistical lives saved exceed the high-concentration benefit by a factor of three or greater."

  **RATIONALE**
  Contractualism is the wrong frame for an authority like ours because public resource allocation inevitably requires aggregating benefits to serve the greatest number. However, aggregation must be constrained to prevent imposing catastrophic risks on individuals for trivial gains elsewhere, which is the frame we adopt here.

  The strongest version of the objection to Option B is not merely that we are summing trivial benefits, but that Option B asks the specific individuals who cross Elm Street to accept a near-certain probability of death to provide marginally safer walks for thousands who face negligible risk to begin with. This objection holds in this specific instance because the risk distribution is not symmetrical. The third member's argument that "everyone faces a probability" ex ante is factually incorrect; the ex ante probability for an Elm Street user is orders of magnitude higher than for a pedestrian benefiting from Option B. We are not choosing between identical lotteries; we are choosing between eliminating a known trap and smoothing background noise.

  Regarding the stability of this rule: a lexical priority for high-concentration hazards does not collapse into paralysis because it is triggered only by a defined threshold (≥3 fatalities/20 years). This prevents endless sequencing debates where small benefits chain together to override large burdens. We must also address the reverse direction: while small benefits cannot aggregate to justify a death, small burdens (e.g., slight traffic delay, lost parking) *can* aggregate to justify stopping a project. This asymmetry is necessary for function; we cannot let minor inconveniences veto safety, but we also cannot let minor safety gains veto individual security.

  Finally, regarding the proposed compromise to treat diffuse benefits as a tie-breaker: we evaluated this and found it functionally incoherent. It attempts to smuggles aggregation in under a nicer name without solving the justificatory problem. If a project cannot be justified to the individual bearing the risk, adding a tie-breaker does not make it justifiable; it just makes the violation of the constraint more complex. Therefore, we must prioritize the elimination of the concentrated hazard.

  **PUBLIC MESSAGING AND LIABILITY**
  Counsel has noted that these minutes are discoverable. The rule above allows us to defend this decision publicly without admitting negligence.
  *   **To a bereaved family at Elm Street:** We can state truthfully that the Authority prioritizes the elimination of known lethal hazards above all else, and that Elm Street was identified as the highest priority based on historical fatality data.
  *   **To beneficiaries of Option B:** We can state that while network-wide improvements are valuable, they are secondary to rectifying specific infrastructure failures that pose immediate catastrophic risk. We are not saying their safety doesn't matter; we are saying that fixing a broken bridge takes precedence than repaving a safe road.

  **NEXT STEPS**
  If approved, staff will initiate the RFP process by the 14th. We will schedule a public briefing for the 20th to outline the "High-Concentration Hazard" priority framework to manage community expectations regarding future budget cycles.

