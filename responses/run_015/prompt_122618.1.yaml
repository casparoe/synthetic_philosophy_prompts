answer: |-
  **Proposal: Custodial Duties and the Structure of Intergenerational Obligation**

  **1. The Question**
  Can a distinct category of *custodial duties*—defined as role-based obligations to maintain the integrity of a practice independent of specific beneficiaries' welfare—mandate substantive climate action in cases where *delivery duties* (obligations to maximize future welfare) fail? Specifically, in the "successor-values case" (where future generations predictably value environmental goods less than we do), does a custodial account require preserving environmental capacities even if doing so does not maximize their welfare? A determinate answer requires establishing that custodial duties are not merely indirect delivery duties (i.e., that they are not grounded in the eventual welfare of successors) and that they impose substantive constraints beyond symbolic preservation.

  **2. Why Existing Positions Leave the Question Open**
  Person-affecting views and "no-difference" replies to the non-identity problem dissolve obligations when specific future individuals are not made worse off, failing to capture duties owed to the *position* of successor. Contractarian savings principles rely on mutual advantage or reciprocity, which breaks down when future generations cannot reciprocate or value what is saved. Rights-based accounts struggle to ascribe rights to contingent persons without begging the question against the non-identity problem. Discounting and cost-benefit approaches treat the issue as aggregative welfare maximization, ignoring deontological constraints on how practices are handed over. Veil-of-ignorance devices assume parties share fundamental interests across time, rendering them insensitive to the successor-values case where interests diverge.

  **3. The Approach**
  This paper argues conceptually about the structure of the duty rather than empirically about discount rates or climate models. Settling on a discount rate assumes the object of duty is welfare; this project challenges that assumption. The "successor-values case" is the critical test because it drives a wedge between what future people want (delivery) and what current stewards must preserve (custodianship). A secondary "end-of-chain" case (where no successors exist) tests whether the duty is forward-looking or intrinsic to the practice. These cases are superior to familiar harm-based examples because they isolate the *source* of the obligation rather than the *magnitude* of the harm.

  **4. Week-by-Week Plan**
  *   **Weeks 1–3:** Refine the distinction between delivery and custodial duties. Read literature on non-identity problems and institutional ethics. *Risk:* Getting stuck on defining "practice" without smuggling in welfare criteria.
  *   **Weeks 4–6:** Draft the argument against the "empty-custodianship objection." Develop criteria for substantive vs. symbolic custodianship.
  *   **Weeks 7–9:** Apply the framework to the successor-values and end-of-chain cases. Draft the core philosophical argument.
  *   **Weeks 10–12:** Revise for clarity, derive policy implications, and finalize references. *Risk:* The policy section may become too speculative; keep it tied to the philosophical conclusion.

  **5. A Successful Result**
  Philosophically, the paper will demonstrate that custodial duties survive the non-identity problem without collapsing into delivery duties. Practically, it should offer a climate policy committee a specific mandate principle: "Policy must preserve the *capacity* for future agency and ecological integrity, regardless of predicted future preferences." This shifts the metric from welfare maximization to capacity preservation.

  **6. Honest Failure Conditions**
  The project fails if: (1) the custodial account quietly collapses back into a delivery account (e.g., preserving the practice is only valuable because it benefits successors); (2) the account survives only by becoming merely expressive (dischargeable by symbolic acts); (3) the successor-values case turns out not to discriminate between the two accounts (both yield the same verdict); or (4) the definition of "practice" proves too indeterminate to guide action. A negative conclusion (that no such duties exist) is a successful result; an indeterminate one is a failure.

  **7. Scope Note**
  The risk is attempting to solve both the meta-ethical structure of duty and the applied ethics of climate policy within 6,000 words. If the argument becomes too dense, the "end-of-chain" case will be cut first. It is illustrative but secondary to the successor-values case, which directly addresses the climate policy context.

  **Tractability Critique**
  While the proposal above frames the project as viable, there is a significant risk that the delivery/custodial distinction is merely verbal. If "custodianship of a practice" ultimately reduces to "delivering the conditions for that practice to continue," the distinction collapses into a delivery duty regarding institutional goods rather than welfare. To ensure tractability within 6,000 words, the nearest viable version of this project would narrow the focus exclusively to the successor-values case. Dropping the end-of-chain case and the broader meta-ethical defense of custodianship would allow for a deeper analysis of whether "preserving capacity" is truly distinct from "maximizing future agency-welfare." This narrower scope ensures the paper produces a determinate answer on the specific conflict between current stewardship values and future preference satisfaction.
