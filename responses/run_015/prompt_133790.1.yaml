answer: |-
  Dear Colleague, as you prepare for next Thursday's colloquium, you must recognize that your audience's composition dictates a specific rhetorical strategy. The presence of two causal decision theorists who are explicitly skeptical of non-causal correlations means you cannot rely on intuitions about logical necessity or abstract rationality without grounding them in physical or causal terms. The philosophers of science with backgrounds in evolutionary biology and physics will be looking for mechanisms and models rather than pure conceptual analysis. Consequently, in your opening remarks, you should voluntarily concede that your notion of algorithmic co-accessibility currently lacks a formal metric for determining the threshold of similarity required between two decision procedures. By admitting that you cannot yet quantify when two algorithms are sufficiently identical to count as co-accessible, you disarm the physicists and biologists who might otherwise demand an operational definition immediately, and you signal to the causal decision theorists that you are aware of the vagueness in your central construct. This concession costs you little because your thesis is primarily about the structural conditions for correlation rather than the precise measurement of algorithmic distance, and it buys you goodwill to defend the conceptual core without getting bogged down in formalization debates too early.

  There is one objection you should dread more than the others, the single objection I am most hoping nobody asks, because it strikes at the metaphysical coherence of your entire project. This is the charge that algorithmic co-accessibility secretly reintroduces causal interaction through the back door by treating shared computation as a disguised physical linkage. If two agents share a common causal ancestor or are instantiated within the same underlying computation, a causal decision theorist will argue that the correlation is screened off by that common cause, rendering your distinction between causal and non-causal correlation illusory. If you argue that the correlation holds even without a direct causal link between the agents at the time of decision, they will press you on whether the shared computation itself constitutes a physical common cause that satisfies Reichenbach's principle. Your reply must be that while the instantiation may have a causal history, the logical dependency between the outputs does not rely on energy transfer or signal propagation at the time of choice, but rather on the identity of the function being computed. You should argue that causal decision theory conflates the history of the system with the counterfactual structure of the decision problem itself. The weakness here is frank and severe: if the shared computation is physically instantiated, it is difficult to deny that the physical state of the computer is a common cause that screens off the correlation, and you risk appearing to rename causal dependence as algorithmic co-accessibility to evade the causal decision theorist's critique.

  Moving to the most damaging objection you are likely to actually face, the causal decision theorists will argue that your epistemic partition in the Luring Lottery is insufficient to break correlation without invoking a causal mechanism. They will claim that if agents are truly rational and identical, their choices must be correlated regardless of the lottery's probabilistic lure, and that attributing the breakdown of correlation to an epistemic partition is merely describing ignorance rather than a structural feature of the decision problem. You should reply that the probabilistic lure in the Luring Lottery creates a divergent incentive structure that makes the counterfactual choice-set structurally inaccessible because the agents can no longer treat their counterpart's decision as a fixed function of their own reasoning. By introducing a probabilistic reward for uniqueness, the lottery ensures that the optimal strategy for one agent depends on the specific outcome of a random variable that the other agent cannot access, thereby breaking the symmetry required for superrationality. The weakness in this reply is that it relies on the assumption that the agents cannot model the probability distribution jointly, and a sophisticated causal decision theorist might argue that shared knowledge of the distribution should restore the correlation, leaving you to defend why epistemic access to the distribution does not equate to epistemic access to the counterpart's specific choice.

  The second most damaging objection will come from the philosophers of science with evolutionary backgrounds, who will ask where the mechanism for algorithmic co-accessibility arises in a naturalized framework. They will press you on how such co-accessibility evolves or is sustained without selection pressure favoring causal communication, arguing that if agents cannot signal, they cannot coordinate on shared algorithms unless there is a prior causal history of convergence. You should reply that algorithmic co-accessibility does not require evolved signaling but rather emerges from the convergence of rational agents on unique optimal solutions to identical problems, much like convergent evolution in biology produces similar traits without direct genetic exchange. You can argue that the structure of the problem space constrains the solution space such that rational agents inevitably instantiate similar procedures. The weakness here is that evolutionary biology typically explains convergence through environmental pressures acting on physical traits, whereas you are positing convergence on abstract decision procedures, and you may struggle to provide a causal story for how abstract rationality constrains physical instantiation without invoking a form of Platonism that this audience will reject.

  The third objection, which is less damaging but still relevant for the physics contingent, concerns the physical instantiation of the counterfactuals you rely upon. They will ask how a counterfactual choice can be structurally inaccessible if the physical laws governing the agents are deterministic and known. You should reply that structural inaccessibility is not about physical impossibility but about computational irreducibility, where the only way to know the counterpart's choice is to run the computation oneself, which is impossible if the computation includes the agent's own state as a variable. The weakness is that computational irreducibility is a practical limit, not a principled one, and a physicist might argue that with sufficient resources, the counterfactual becomes accessible, undermining your claim that the correlation is dissolved by principle rather than by contingency.

  The least damaging objection will likely concern the specific mechanics of the Platonia dilemma versus the Luring Lottery, where someone might ask if the dissolution of correlation applies equally to both cases. You should reply that Platonia relies on pure symmetry which is fragile under any epistemic asymmetry, whereas the Luring Lottery actively constructs asymmetry through the probabilistic lure, making the breakdown of correlation more robust in the latter case. The weakness here is minor but worth noting: if you draw too sharp a distinction between the two cases, you risk implying that superrationality works in Platonia but not the Lottery, which might confuse your thesis that both fail to establish superrationality in the usual sense. Throughout these exchanges, maintain your focus on the distinction between causal history and counterfactual structure, but remain vigilant against the charge that you are merely relabeling common causes, as that is the point where your argument is most vulnerable to the specific skepticism of your causal decision theorist colleagues.
