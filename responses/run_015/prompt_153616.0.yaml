answer: |-
  You have identified the central tension in contemporary population ethics, though you are unlikely to find a single noun for it in the literature because it represents a unstable equilibrium between two competing ethical frameworks. The configuration you describe does not have a canonical name, but in philosophical circles, it is recognized as the struggle to reconcile **Person-Affecting Views** with **Impersonal Totalism** in the shadow of the **Non-Identity Problem**.

  For your piece, I recommend labeling this configuration **"The Continuity Asymmetry."**

  Below is the carving you requested: how this view differs from its neighbors, why the retrospective and prospective claims are distinct phenomena, what the replacement case reveals, and where the body is buried regarding inconsistency.

  ### 1. The Name and the Carving

  **The Label:** **The Continuity Asymmetry**
  **The Definition:** The intuition that the *cessation* of an existing lineage constitutes a catastrophic loss of value, while the *failure to expand* that lineage (or bring additional contingent people into existence) constitutes no loss at all.

  **Why this name?** It captures the specific geometry of their belief: *Continuity* (preventing extinction) is morally mandatory/valuable, but *Addition* (increasing population beyond survival) is morally neutral.

  **How it differs from nearby views:**
  *   **Vs. The Person-Affecting View:** The standard Person-Affecting View holds that an outcome cannot be worse than another unless there is someone for whom it is worse. Your interviewees reject this for extinction (admitting the world is worse even if no one is harmed) but accept it for birth rates (admitting the world is not worse if fewer people are born). The Continuity Asymmetry is the attempt to hold both positions simultaneously.
  *   **Vs. Total Utilitarianism:** A consistent Total Utilitarian believes more good lives are always better. They would view a falling birth rate as a loss of value (a "slow extinction"). Your interviewees explicitly reject this.
  *   **Vs. The Scheffler View (The Book You Read):** You are correct that this is not Samuel Scheffler's argument from *Death and the Afterlife*. Scheffler argues that our *present* values depend constitutively on the existence of successors (the "Afterlife Condition"). If humanity ends, our current projects lose their *meaning*. Your interviewees are split: the "Retrospective" group is Schefflerian (projects lose their point); the "Prospective" group is not (projects retain their point, but future *instances* of value are lost). The Continuity Asymmetry encompasses both, whereas Scheffler only covers the Retrospective.

  ### 2. One Phenomenon or Two?

  The Retrospective and Prospective articulations are **genuinely separable phenomena** that are currently conflated under the umbrella of "extinction risk."

  *   **The Retrospective Claim (Meaning):** "Our work loses its point."
      *   *Philosophical Category:* **Narrative Value.** This is about the context of justification. It relies on a chain of reception. A vaccine matters because it protects the future; a symphony matters because it is heard by the future.
      *   *The Time Horizon:* This explains why some interviewees say extinction ten centuries out doesn't threaten *their* concerns. If the chain of reception is long enough, the immediate link holds. This is consistent with Scheffler.
  *   **The Prospective Claim (Value):** "The future good simply won't happen."
      *   *Philosophical Category:* **Impersonal Value.** This is ontological, not narrative. It claims value exists in the universe independently of whether *we* get credit for it. It is the claim that a universe with 1 trillion happy lives is better than one with 1 billion, even if no one knows the difference.
      *   *The Tension:* These two claims often contradict. If the Prospective claim is true (value is impersonal), the Retrospective claim should be false (my work has value regardless of the future). If the Retrospective claim is true (value depends on successors), the Prospective claim is incoherent (there is no "future good" independent of the subjects experiencing it).

  **Journalistic Implication:** When your interviewees switch between these two, they are switching between a **Humanist** defense (our story matters) and a **Utilitarian** defense (total utility matters). They rarely notice the switch.

  ### 3. The Replacement Case: One Intuition or Several?

  The sharp division over the "Alien Replacement" case (humanity ends, but other beings flourish immediately) reveals that your interviewees are not arguing about *extinction* at all. They are arguing about **Anthropocentrism**.

  *   **Group A (It is still a loss):** They value **Human Specificity**. For them, the "Continuity" in Continuity Asymmetry means *human* continuity. The loss is the end of human culture, consciousness, or agency. This aligns with the Retrospective/Meaning view.
  *   **Group B (It is not a loss):** They value **Phenomenal Experience**. For them, the "Continuity" means *conscious* continuity. If the universe remains filled with flourishing beings, the impersonal value is preserved. This aligns with the Prospective/Utilitarian view.

  **Journalistic Implication:** This split proves that "Human Extinction" is a category error for some of your subjects. For Group B, *Species Extinction* is not *Value Extinction*. For Group A, they are identical. This is a crucial fault line in the long-termist community.

  ### 4. The Mirror-Image and the Inconsistency

  You asked what would count as evidence that this is simply an inconsistency. In philosophy, this is known as the **Non-Identity Problem** (formulated by Derek Parfit).

  **The Logic of the Trap:**
  1.  **Extinction Case:** If we go extinct, the specific people who *would* have lived in the future do not exist. Interviewees say: "This is a loss."
  2.  **Birth Rate Case:** If we have fewer children, the specific people who *would* have been born do not exist. Interviewees say: "This is not a loss."
  3.  **The Contradiction:** In both cases, the moral judgment rests on the non-existence of specific possible people. Why does the non-existence of the *future* person count as a loss, but the non-existence of the *unborn* person does not?

  **The Deflationary Explanation (Inconsistency):**
  The Continuity Asymmetry is logically stable *only if* there is a moral difference between "Future People" (those who would exist if we continue) and "Possible People" (those who would exist if we expanded).
  *   **Evidence of Inconsistency:** If an interviewee cannot articulate a **non-arbitrary threshold** for when a "possible person" becomes a "future person" whose non-existence is a loss.
  *   **The Test:** Ask them: "At what population size does the loss of potential lives become a catastrophe? If we drop from 8 billion to 1 billion, is that a loss of value? If not, why is dropping to 0 a loss of value?"
      *   If they say "1 billion to 0 is unique," they must explain why the *last* billion people matter more than the *previous* billions.
      *   If they say "It's about the end of the chain," they must explain why the chain matters for extinction but not for birth rates (which also shorten the chain, just less abruptly).

  **The "Theory X" Problem:**
  Derek Parfit spent the end of his life searching for "Theory X"—a moral theory that could satisfy the intuitions your interviewees hold (Extinction is bad; creating miserable people is bad; failing to create happy people is neutral). He failed to find one that didn't lead to absurd conclusions (like the "Repugnant Conclusion," where we are obligated to maximize population regardless of quality of life).
  *   **For your piece:** The fact that the smartest ethicists of the last 50 years have failed to formally justify the Continuity Asymmetry is strong evidence that your interviewees are relying on a **moral heuristic** rather than a coherent theory. They are using a "Stop Loss" rule (don't let the game end) without a "Win Condition" (it doesn't matter how many players join).

  ### 5. Summary for the Piece

  *   **The Concept:** **The Continuity Asymmetry.**
  *   **The Structure:** It treats the *prevention of loss* (extinction) as morally urgent, but the *creation of gain* (population growth) as morally neutral.
  *   **The Split:**
      *   **Retrospective (Schefflerian):** Extinction voids the meaning of past efforts. (Sensitive to time horizon).
      *   **Prospective (Utilitarian):** Extinction voids future impersonal value. (Insensitive to time horizon).
  *   **The Replacement Split:** Reveals whether they value *Humanity* (Anthropocentric) or *Consciousness* (Sentientist).
  *   **The Inconsistency:** Rooted in the **Non-Identity Problem**. They treat non-existent future humans as "victims" of extinction, but deny that non-existent unborn humans are "victims" of low birth rates.
  *   **The Evidence:** If they cannot define the moral status of "potential people" without appealing to the arbitrary distinction between "ending a line" and "not starting a branch."

  **Suggested phrasing for your article:**
  > "They are operating on what might be called the **Continuity Asymmetry**: the conviction that while we have no duty to bring more people into existence, we have an absolute duty to prevent the existing project of humanity from ending. It is a moral framework that treats the future as a trust we must not bankrupt, even if we are under no obligation to increase its principal. But when pressed on why the non-existence of future generations is a catastrophe while the non-existence of additional generations is neutral, the logic frays. They are relying on an intuition that philosophy has yet to name, let alone justify."
