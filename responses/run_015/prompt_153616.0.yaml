      *   *Scheffler:* Distinguish clearly. Scheffler = Meaning depends on successors. Interviewees = Value exists independently, just won't be realized.
      *   *The Replacement Case:* This is **Substitutability**. If value is sentient experience, aliens substitute. If value is *human* achievement, they don't.
