      *   *Decision:* I will tell the journalist there is no single *word*, but the *structure* is the **Asymmetry Problem in Population Ethics**, specifically the tension between **Person-Affecting Views** and **Impersonal Totalism**. I will coin **"The Extinction Exception"** to describe the specific move of applying totalism to extinction but person-affecting views to birth rates.

      *   *Wait, one more check:* The user mentions a book about death/afterlife. That is definitely Samuel Scheffler. I need to make sure I distinguish the interviewees from Scheffler clearly. Scheffler: "Our values depend on the afterlife." Interviewees: "The values exist, the *instances* just won't happen."

