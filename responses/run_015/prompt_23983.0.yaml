answer: |-
  This is a request for a theoretical specification, so I will treat it as such. Given your background in condensed matter, you are accustomed to distinguishing between *microscopic laws* (Hamiltonians, Schrödinger equation) and *macroscopic phenomena* (phases, order parameters, emergent symmetries). The free will debate is essentially a dispute over whether "moral responsibility" is a robust emergent phenomenon or an illusion generated by ignoring the microscopic causal closure.

  Your frustration with the "Frankfurt-style cases" (the device that would have forced the action if you hesitated) is shared by many. In physics terms, it feels like a boundary condition trick: the phase space is constrained by the device's presence, even if the trajectory never hits the wall.

  Here is the specification for an adequate theory of moral responsibility.

  ### I. The Desiderata (The Spec)

  An adequate theory must satisfy the following constraints. I have categorized them by their status in the literature.

  **1. Causal Consistency (Non-Negotiable)**
  *   **Spec:** The theory cannot require violations of established physical laws (specifically, causal closure of the physical domain). It must be compatible with the fact that macroscopic states supervene on microscopic physical states.
  *   **Case:** A theory requiring "mind-stuff" that pushes neurons without energy transfer violates this.
  *   **Physics Analog:** Conservation of energy; no action-at-a-distance without a mediator.

  **2. The Control Condition (Non-Negotiable)**
  *   **Spec:** To be responsible, the agent must be the *source* of the action in a way that distinguishes them from a passive conduit (like a rock falling or a reflex).
  *   **Case:** You are not responsible for a sneeze; you are for a lie. The theory must mark this boundary.
  *   **Physics Analog:** Distinguishing between a system driven by external fields vs. internal order parameters.

  **3. The Manipulation Constraint (Non-Negotiable)**
  *   **Spec:** If an agent's decision is the direct result of external programming, coercion, or manipulation that bypasses their reasoning faculties, they are not responsible.
  *   **Case:** A brainwashed assassin or a puppet.
  *   **Why:** This is the intuition pump for *why* we care about determinism. If determinism makes us all "brainwashed by the Big Bang," responsibility vanishes.

  **4. The Leeway Condition / PAP (Contested)**
  *   **Spec:** To be responsible, the agent must have had access to genuine alternative possibilities (could have done otherwise in the *exact same* prior state).
  *   **Case:** If you were physically determined to choose A, and B was impossible, are you responsible for A?
  *   **Status:** **Libertarians** say Non-Negotiable. **Compatibilists** say Negotiable (redefine "could have"). **Hard Incompatibilists** say Non-Negotiable (and thus deny responsibility).
  *   **Your Friction:** This is the requirement the Frankfurt cases try to eliminate.

  **5. The Actual Sequence Condition (Contested)**
  *   **Spec:** Responsibility depends on the *actual* causal history of the action, not merely on what *would* have happened in counterfactual scenarios.
  *   **Case:** The Frankfurt Case. If you chose X voluntarily, and the device *didn't* fire, the actual sequence is clean.
  *   **Status:** **Compatibilists** prioritize this over Leeway. **Libertarians** argue Actual Sequence is insufficient without Leeway.

  **6. The Attribution/Accountability Distinction (Preference)**
  *   **Spec:** The theory must distinguish between being the *cause* of an event (attribution) and being *liable to sanction* for it (accountability).
  *   **Case:** A child or a person with dementia may be the source of an action (attribution) but not a target for blame (accountability).
  *   **Status:** Some theories collapse these; adequate ones usually separate them.

  ---

  ### II. The Trade-Offs (Incompatible Pairs)

  You cannot satisfy all the above. There are "No-Go Theorems" in this domain just as in quantum mechanics.

  **Conflict A: Causal Consistency vs. The Leeway Condition (PAP)**
  *   **The Tension:** If the physical world is causally closed (Consistency), then given the prior state of the universe + laws, only one future is physically possible. This contradicts the literal ability to do otherwise (Leeway).
  *   **Resolution:** Libertarians sacrifice Consistency (positing non-physical causation or indeterministic gaps). Compatibilists sacrifice Leeway (redefining "could have" as "would have, if asked").

  **Conflict B: The Manipulation Constraint vs. Causal Consistency (The Hard Incompatibilist Hammer)**
  *   **The Tension:** If Causal Consistency is true (determinism), then your actions are the result of prior causes (genes, environment, Big Bang). If a *scientist* programming your brain removes responsibility (Manipulation Constraint), why doesn't *nature* programming your brain also remove responsibility? There is no relevant difference between "determined by a neuroscientist" and "determined by physics."
  *   **Resolution:** Deny responsibility (Hard Incompatibilism) or argue there *is* a relevant difference (Compatibilism).

  ---

  ### III. Scorecard: Main Contenders

  | Theory | Causal Consistency | Control Condition | Manipulation Constraint | Leeway (PAP) | Actual Sequence |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Compatibilism** (Most Popular) | **Pass** | **Pass** (Redefines control) | **Fail** (Vulnerable to Manipulation Arg) | **Fail** (Denies PAP needed) | **Pass** |
  | **Libertarianism** | **Fail** (Requires causal gaps) | **Pass** | **Pass** | **Pass** | **Pass** |
  | **Hard Incompatibilism** | **Pass** | **Fail** (Denies ultimate control) | **Pass** | **Pass** (But says we lack it) | **Pass** |

  ---

  ### IV. The Knockout Requirement

  You asked which single requirement knocks out the most popular theories. The most popular theory among professional philosophers is **Compatibilism**.

  The requirement that knocks it out is **The Manipulation Constraint**.

  **Why:**
  Compatibilists argue that determinism is compatible with responsibility because what matters is the *structure* of the decision process (reasons-responsiveness), not the *origin* of the process.
  However, the **Manipulation Argument** (developed by Derk Pereboom and others) constructs a case where a scientist manipulates an agent to satisfy all Compatibilist conditions (they reason, they reflect, they act voluntarily), yet we intuitively withhold responsibility.
  If the Compatibilist says "The manipulated agent is responsible," they violate the **Manipulation Constraint** (Desideratum #3).
  If they say "The manipulated agent is *not* responsible," the Hard Incompatibilist asks: *What is the relevant difference between the manipulated agent and the determined agent?* If there is no difference, then the determined agent is also not responsible.
  This forces the Compatibilist into a dilemma: either accept that manipulated people are responsible (counter-intuitive) or admit that determinism removes responsibility (abandoning Compatibilism).

  ### V. Addressing Your Frankfurt Frustration

  You mentioned the Frankfurt cases (the device that would have forced the action) are what trip you up. You feel they are unsatisfying. Your intuition is physically sound.

  The Frankfurt case attempts to sever **Responsibility** from **Leeway (PAP)**. It argues: *Since the device didn't fire, the actual sequence was free, so responsibility holds, even if you couldn't have done otherwise.*

  **Why it feels like a trick (The Physicist's View):**
  The Frankfurt case violates **Regulative Control**.
  In thermodynamics or control theory, a system's freedom is defined by its accessible phase space. The presence of the device *changes the boundary conditions* of the agent's decision space, even if the trajectory doesn't touch the boundary.
  *   **Without Device:** The agent's state vector can evolve to $A$ or $B$.
  *   **With Device:** The agent's state vector *must* evolve to $A$. The eigenvalue $B$ is removed from the spectrum of possibilities by the device's existence.

  The Frankfurt argument claims that because the device was inactive, the *causal history* is identical to a world without the device. But this ignores that the *capacity* to do otherwise was structurally absent. By prioritizing **Actual Sequence** (Desideratum #5) over **Leeway** (Desideratum #4), Compatibilists use Frankfurt cases to bypass the Manipulation Constraint. They say, "Look, no one actually touched the gears!"

  But your intuition detects that the *potential* for intervention implies the gears were never truly free to begin with. This aligns with the **Manipulation Constraint**. If the device ensures the outcome, the agent is not the *ultimate source*, regardless of whether the device fired.

  **Summary:**
  1.  **The Spec:** Requires Causal Consistency, Control, and Manipulation Constraint.
  2.  **The Conflict:** You can't have Causal Consistency and Leeway (PAP).
  3.  **The Knockout:** The **Manipulation Constraint** is the hardest constraint for Compatibilism (the dominant theory). It forces them to explain why "determined by physics" is different from "programmed by a scientist." Most fail to do this without begging the question.
  4.  **Your Intuition:** Your dissatisfaction with Frankfurt cases is a rejection of the **Actual Sequence** priority. You intuitively hold that **Regulative Control** (the physical capacity to access multiple states) is a prerequisite for Sourcehood. If that requirement is made Non-Negotiable, Compatibilism collapses.

  If you want to read one thing that formalizes your frustration: Look up the **"Flicker of Freedom" strategy** or the **"Dilemma Defense"** against Frankfurt cases. They argue that in any Frankfurt case, there *must* be some prior sign (a flicker) that the agent was going to choose otherwise, which triggers the device. That flicker *is* an alternative possibility. If there is no flicker, the agent is determined, and we are back to the Manipulation Argument. The Frankfurt case cannot eliminate alternative possibilities without eliminating the agent's contribution entirely.
