prompt: |-
  I'm a retired physicist — spent most of my career in condensed matter, which is to say I've spent thirty years thinking about how micro-level facts give rise to macro-level behavior — and I've recently fallen down the philosophy rabbit hole, specifically the free will and moral responsibility stuff, and I have to be honest it's genuinly confusing. The move that keeps tripping me up: people argue about whether you can be morally responsible for an action if you couldn't have done otherwise, and then they present these constructed cases where someone does something bad entirely of their own volition, but unbeknownst to them there's a device or a person who would have forced them to do exactly that had they decided otherwise — and since they didn't, the device never kicks in. And then the upshot is: well, they clearly couldn't have done otherwise, yet we still hold them responsible, so the ability to do otherwise can't be necessary for responsibility. I find this deeply unsatisfying but I can't quite articalate why, and I'm tired of just reacting to it.

  So before I read any more, I want the spec. Write me the desiderata: what any adequate theory of moral responsibility (or of free will and responsibility) has to deliver — which cases it must get right, which distinctions it must respect (like between being responsible for an action versus for a state of affairs, or between moral and legal responsibility, or between 'basic' responsibility and responsibility that's just a byproduct of who you happen to be), which results from neuroscience or psychology it can't contradict — with the case or consideration behind each requirement. Mark which requirements are non-negotiable and which are just preferences of particular camps, and flag any pair of desiderata you suspect can't be jointly satisfied. Then, briefly, how the main contenders — the compatibilists, the libertarians, and the people who say you don't need to be able to do otherwise — do against the list. And tell me which single requirement knocks out the most popular theories, because I have a hunch it's one of the constructed cases and I want to see it made explicit.
