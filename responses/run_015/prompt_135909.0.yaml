answer: |-
  You have not invented this. You are tracking a real and well-trodden fault line in decision theory and epistemology. The confusion you feel is not a bug in your understanding; it is a feature of the literature, where epistemologists (who care about belief norms) and decision theorists (who care about choice norms) often talk past each other using the same betting metaphors.

  Here is the carving you asked for.

  ### 1. The Names and the Gap

  The first pattern (static inconsistency) is a **Synchronic Dutch Book**.
  The second pattern (inconsistency over time) is a **Diachronic Dutch Book** (sometimes called a **Dynamic Dutch Book**).

  The gap between them—the thing you are tripping over—is the distinction between **Static Coherence** and **Dynamic Consistency**.

  *   **Static Coherence:** Your beliefs at time $t$ obey the probability axioms. If they don't, a Synchronic Dutch Bookie can drain you *right now*.
  *   **Dynamic Consistency:** Your plan at time $t$ about what you will do at time $t+1$ matches what you actually do at $t+1$. If they don't match, a Diachronic Dutch Bookie can drain you *across time*.

  The specific vulnerability in your second example is a violation of **Conditionalization**. In formal epistemology, the standard result (the **Lewis-Teller Argument**) is that if your rule for updating beliefs upon receiving new evidence is *anything other than Bayesian Conditionalization*, you are susceptible to a Diachronic Dutch Book.

  ### 2. What Exactly Is Being Criticized?

  You asked: *Is the slide from "you can be drained" to "so your beliefs are irrational" licensed?*

  **Short answer:** It is licensed to criticize your **updating policy**, but it is **not** licensed to criticize your **static beliefs** at any single moment.

  **The Carving:**
  In the Synchronic case, the criticism lands on your *credences* (your numbers are wrong). In the Diachronic case, the criticism lands on your *rule* (your movement is wrong).

  However, your intuition about "commitment" highlights a major controversy. There are three ways to model the agent in the Diachronic scenario:

  1.  **The Naive Agent:** Thinks their future self will act rationally (according to the current plan), but the future self does not. This agent gets drained.
  2.  **The Sophisticated Agent:** Knows their future self will deviate. At time $t$, they anticipate the loss at $t+1$ and refuse the first bet. They don't get drained, but they are **dynamically inconsistent**: their optimal plan at $t$ is not executable, so they are forced into a sub-optimal outcome (refusing a good bet) to avoid the trap.
  3.  **The Resolute Agent:** Binds their future self. They treat their initial plan as binding even when the future self wants to deviate.

  **The Criticism:**
  *   **Epistemologists (e.g., David Lewis, Paul Teller):** Argue that susceptibility to a Diachronic Dutch Book proves your *updating rule* is irrational. You *ought* to conditionalize. If you conditionalize, the second bet will never look "fair" to your future self if the first bet was fair to your past self. The prices will align such that the package is never a guaranteed loss.
  *   **Decision Theorists (e.g., Edward McClennen, Michael Bratman):** Argue that the problem isn't necessarily the belief update, but **Dynamic Inconsistency** in preferences or choices. They argue that "Rationality" might require Resolute Choice (binding yourself) rather than changing your beliefs.

  **Verdict on the Slide:** The slide is **partially licensed but often overstated**. Being Dutch-Bookable diachronically proves your *system* (beliefs + update rule) is exploitable. It does not prove your snapshot beliefs are incoherent. It proves you lack **Dynamic Consistency**.

  ### 3. Nearest Neighbors and Distinctions

  You asked to distinguish this from money pumps, cycles, and adversaries.

  **A. The Intransitive Money Pump (A > B > C > A)**
  *   **What it is:** You prefer A to B, B to C, and C to A. You trade A for B (paying a fee), B for C (paying a fee), C for A (paying a fee). You end up with A and less money.
  *   **Difference:** This is **Synchronic**. It relies on your preferences *right now* being cyclic. The Diachronic Dutch Book relies on your preferences/beliefs *changing* over time in a specific, predictable way.
  *   **Relation:** Your pattern is **not** this. Your pattern allows preferences/beliefs to be transitive and consistent at every snapshot.

  **B. Hyperbolic Discounting (Time Inconsistency)**
  *   **What it is:** You prefer $100 today over $110 tomorrow, but you prefer $110 in 366 days over $100 in 365 days.
  *   **Difference:** This is the "drinking limit/stop loss" example you gave. It is structurally identical to the Diachronic Dutch Book but usually framed in terms of **utility** rather than **probability**.
  *   **Relation:** This **is** the same pattern. The "betting" version is the epistemic cousin of the "discounting" version. Both are failures of Dynamic Consistency.

  **C. Does it need an Adversary?**
  *   **Dutch Book:** By definition, a Dutch Book argument posits a Bookie (adversary) to demonstrate the inconsistency.
  *   **Dynamic Inconsistency:** Does **not** need an adversary. If you are dynamically inconsistent, you can lose money in a neutral environment.
      *   *Example:* You plan to save money tomorrow. Tomorrow comes, you spend it. You didn't need a bookie to make you poorer; your inconsistency did it.
      *   *Why the distinction matters:* If you are just "clumsy" (inconsistent), nature doesn't need to conspire against you for you to lose. If you are "incoherent" (Synchronic Dutch Book), an adversary *could* exploit you, but the flaw is in the static map.
      *   *Your Case:* The Diachronic Dutch Book shows that *if* an adversary exists who knows your update rule, you are toast. But the underlying flaw (Dynamic Inconsistency) is costly even without them.

  ### 4. Corrections and Immunity Conditions

  You asked: *Is some particular way of revising provably immune?*

  **Yes.** **Bayesian Conditionalization** is the shield.

  **The Condition:** If your updating rule is:
  $$P_{new}(H) = P_{old}(H | E)$$
  (where $E$ is the total evidence learned), then you are immune to Diachronic Dutch Books.

  **Why:** If you conditionalize, your future betting prices are already "priced in" to your current betting prices.
  *   At $t_1$, you value a bet on $H$ at $P(H)$.
  *   You also value a bet on "I will value $H$ at $P(H|E)$ tomorrow" at 100% (because you know your rule).
  *   Therefore, the Bookie cannot construct a package where you buy high at $t_1$ and sell low at $t_2$ (or vice versa) in a way that guarantees a loss, because your $t_2$ prices are exactly what your $t_1$ self expected them to be.

  **Where your memory might be off:**
  You mentioned: *"a coin of unknown bias... someone who overshoots when they revise."*
  This is correct. If the agent uses a heuristic (like "representativeness" — seeing 10 heads and thinking tails is 'due', or conversely, thinking the coin is biased towards heads *more* than the data supports), they are violating conditionalization. They are susceptible.

  **One nuance on "Commitment":**
  You wrote: *"Two people with the same beliefs and the same way of revising, differing only in whether they can commit — one gets bled, one doesn't."*
  This is technically **incorrect** in the strict Dutch Book framing.
  *   If you can **commit** (Resolute Choice), you refuse the first bet. You don't get bled.
  *   If you cannot commit (Naive), you take the first bet, then take the second bet, and get bled.
  *   **However:** The epistemologist says the person who *needs* to commit is already irrational. A perfectly rational Bayesian conditionalizer *doesn't need to commit*. Their future self will *naturally* refuse the second bet because, given the new evidence, the bet will look unfair.
  *   **The Carving:** If you need willpower to avoid a Dutch Book, your update rule is flawed. If your update rule is perfect, willpower is irrelevant. The need for commitment is *evidence* of the flaw, not a separate psychological variable that excuses the flaw.

  ### 5. Confidence and Uncertainty

  **Confidence: High (85-90%)**
  I am confident in the distinction between Synchronic and Diachronic Dutch Books, the link between Diachronic Books and Conditionalization (Lewis-Teller), and the distinction between Naive/Sophisticated/Resolute choice.

  **Uncertainty: The Normative Slide**
  I am least sure about the claim: *"The need for commitment is evidence of the flaw."*
  There is a live debate in philosophy (e.g., **Arntzenius**, **Maher**) about whether Diachronic Dutch Books actually prove irrationality.
  *   **The Counter-Argument:** Sometimes you *should* change your rule. If you know you have a weakness (like hyperbolic discounting), the "rational" thing to do is to bind yourself. Does that make your *beliefs* irrational? Or does it make the "Standard Dutch Book Argument" too narrow?
  *   Some decision theorists argue that **Dynamic Consistency** is not a requirement of rationality, but rather a constraint on *naivety*. A sophisticated agent who knows they are inconsistent might rationally choose a path that looks "inconsistent" from the outside to avoid the pump.
  *   **Why I'm unsure:** There is no consensus on whether "Rationality" requires you to be the kind of agent who *never needs to bind themselves* (the Bayesian Ideal), or whether "Rationality" includes the smart management of your own known flaws (the Behavioral Ideal). The literature slides between these two definitions constantly, which is likely why you are finding it hard to tell if the move is licensed.

  **Summary for your work:**
  1.  **Term:** Diachronic Dutch Book / Dynamic Inconsistency.
  2.  **Target:** The Update Rule (specifically non-Conditionalization), not static beliefs.
  3.  **Adversary:** Not required for the loss to occur, but required for the *argument* to be framed as a "Book."
  4.  **Immunity:** Bayesian Conditionalization.
  5.  **Caution:** Be careful when someone infers "your beliefs are wrong" from "you can be pumped over time." They should infer "your update rule is unstable."
