prompt: |-
  Right, so I need help with something I've been chewing on for a while and keep failing to get straight, and I want a diagnosis rather than another survey of the literature, because I already know the literature.

  Background so you know exactly what I'm after. I run a grad seminar on the metaphysics of properties. We do the conditional analysis of dispositions — the idea that calling a glass fragile is just saying it would break if struck, under the right conditions, in the right way — and then we do the two families of counterexample. First, the ones where something interferes with the disposition itself at the moment of manifestation: the glass that a spell makes unbreakable in the instant before it hits the floor, so the condition is met and the breaking never comes, and yet we still want to say it was fragile all along. Second, the ones where the disposition is perfectly intact but blocked: the glass packed in foam, as fragile as ever, which never breaks because the foam does the work. Then we read the repairs — add a clause about the conditions being intrinsic, or about nothing interfering, or about the causal basis being present and unaltered — and every repair gets a counterexample of its own, and so on. By the end of week three everyone agrees the simple analysis is dead, and everyone also agrees that nothing has been settled: half the room thinks it's a research programme with a few holes left, the other half thinks the whole business was a mistake, that dispositions are primitive and irreducible, and that trying to analyse one is like trying to analyse red in terms of how it would look to a normal observer. Which may be true, but it's a temperament, not an argument.

  Here's what I actually want. This has been going on for decades. Smart people, the same handful of cases, no conversions, no end in sight, and every year someones paper generates a fresh counterexample and a fresh clause. So: what kind of disagreement is this, really? Is it a disagreement about the cases — one side right and one side wrong about what we'd say of the foam-wrapped glass? About what an analysis of a property has to deliver: a true biconditional in non-dispositional terms, or just a schema, or nothing at all? About whether disposition picks out one kind of thing, so that the counterexamples work by sliding between a glass's brittleness and a person's irascibility? Or is it a sign the question is ill-posed, and that the counterexample machine can't terminate because for any proposed condition someone can rig a case that satisfies it while the disposition is absent, or the reverse? If it's that last one, I want to know whether there's an actual argument to that effect — a diagonalisation-style result rather than the two-hundredth counterexample — or whether that's just induction on a bad track record.

  And then: given your diagnosis, what would count as progress. I'll take a distinction, a formal result, a change of question — I have a suspicion it's this one, that the real question was never what the analysis is but what grounds the truth of a disposition ascription, and that once you ask that, the finks and the masks stop being embarrassments and start being data — or an honest argument that there's no progress to be had here and the topic should be retired. What I don't want is a literature review or a reading list. I know the literature. Tell me what the shape of this thing is, and whether I'm wasting my students' time.
