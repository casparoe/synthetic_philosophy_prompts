answer: |-
  1. Wittgenstein would likely argue that extending "language" to code and AI output is permissible if overlapping similarities exist, even without a single defining essence shared by all. The concept stretches like a thread spun from many fibers, where no single fiber runs the whole length.
  2. What holds the family together is not a hidden core but the crisscrossing network of similarities in rules, symbols, and communicative intent among human users. Programming and AI text overlap with natural language in syntax and function, linking them to the family despite lacking biological speech.
  3. From the language-game perspective, programming languages clearly qualify because they function within specific human activities and forms of life, such as software development. Their meaning is secured by the rules humans follow when writing and executing code to achieve practical ends.
  4. However, LLM-generated text complicates the "form of life" requirement since the model itself lacks the human context that grounds meaning in use. Wittgenstein might suggest the output is merely a move in a game played by humans, rather than a meaningful act by the machine itself.
  5. If the AI's output cannot be woven into a human form of life where it serves a purpose, it remains akin to a meaningless sound rather than a word. Thus, the boundary of the family is drawn by human practice, not by the internal capabilities of the tool generating the signs.
