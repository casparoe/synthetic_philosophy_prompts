  *(Self-Correction during drafting)*: I need to be careful not to give medical advice, but ethical consultation analysis. The prompt asks "What should we decide." I will frame it as an ethical recommendation based on their precedents.
  *Wait, one nuance:* In Mrs. D, the vote was 5-2. It was contested. In Mr. F, the "recognition" fact is different. If I recommend honoring the directive, I am aligning with the Mrs. D *Majority*, but overriding the factual distinction. I need to justify why the factual distinction doesn't change the ethical principle.
  *Justification:* The *principle* of Mrs. D is that the prior self defines the conditions of life worth living. The *fact* of recognition was just the proxy for that condition. In Mr. F, the "gardening without knowing why" is the condition, and it is met. The recognition clause is secondary evidence. The "Cheerful" note confirms the intent.
  *Okay, that works.*

  *Personal Directive:* Needs to be robust against *this* committee.
  1. Specific triggers (not just "family recognition").
