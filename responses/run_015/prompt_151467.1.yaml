      *   *Direction of Fit:* Explain it clearly. Anscombe/Searle territory.
      *   *The "Constituting the Institution" point:* This is crucial. Use the "We the people" or "I name this ship" example. Chess can't handle the first move of the first game ever.
      *   *Closing:* Bring it back to Austin. The "total speech situation."

