      *(Self-Correction during drafting)*: Make sure to distinguish between Szasz's actual views and Nils's representation of them. Nils seems faithful, but I should note that. Also, ensure the distinction between "disease" and "illness" is clear if relevant (Szasz focuses on disease).
      *Move 6 Note:* FND is a tricky case. It's neurological but functional. Marisol uses it well, but Nils could argue it's neurological (hence medical) not psychiatric. I need to be careful there.
      *Move 8 Note:* This is the crux. The "Noble Lie" vs. "Hard Truth."

      *Let's finalize the grades.*
