answer: |-
  # COLLOQUIUM PREP SHEET: DISPOSITIONS, INDEXING, & INTERFERENCE

  **Target:** 7 Objections (Ordered by Damage)
  **Context:** Humean Majority (Lewisian), Powers Minority (2), Interventionist (1).
  **Thesis:** Finks/masks are one problem (timing/direction). Solution: Index ascriptions to (a) manifestation window, (b) contrast class of interferers.

  ---

  ### 1. The Triviality Charge (Humean)
  **Objection:** "If you define 'admissible interferers' as 'those compatible with the manifestation,' you've analyzed nothing. You're just saying 'fragile means breaks unless something stops it.' That's trivial. If you define them independently, you need laws, which breaks the reduction."
  **Reply (90s):** I deny the dilemma. The contrast class isn't defined by the manifestation; it's fixed by the *context of ascription*. When I call glass 'fragile,' I implicitly exclude sledgehammers and magic spells, not because of the glass, but because of our conversational interests. This isn't trivial; it's pragmatic precision. It preserves the reduction because the categorical basis remains local; we're just clarifying the conditions under which we *assert* the conditional. The laws govern the basis, but the context governs the ascription.
  **Soft Spot:** Humeans will press whether "context" smuggles in modal facts they can't accept.

  ### 2. The Intrinsicness Attack (Powers)
  **Objection:** "Dispositions are intrinsic properties. By indexing them to external interferers and temporal windows, you've made fragility extrinsic. A vase is fragile or it isn't, regardless of whether a sorcerer is watching or how long you wait."
  **Reply (90s):** I distinguish the *property* from the *ascription*. The categorical basis (the molecular structure) is intrinsic. But truthfully ascribing 'fragile' requires specifying the environment because dispositions are relational potentials. Your 'intrinsic' view can't explain why the vase doesn't break when the sorcerer is present. My view says: relative to the 'sorcerer-present' contrast class, it isn't fragile. We keep the ontology intrinsic but make the semantics context-sensitive.
  **Soft Spot:** Powers theorists reject the property/ascription distinction here; they think the power itself is directed regardless of context.

  ### 3. The Supervenience Worry (Humean)
  **Objection:** "Lewis requires truths about dispositions to supervene on the categorical mosaic. If whether something is fragile depends on a 'contrast class' of interferers that might be distant or hypothetical, you've broken local supervenience."
  **Reply (90s):** The contrast class is not a distant fact; it's a parameter of the evaluation, like a standard of precision. Two worlds identical in categorical facts can differ in whether we *call* something fragile based on our interests, but the underlying physics doesn't change. The supervenience base holds for the basis itself. My indexing handles the *truth conditions of the claim*, not the metaphysical grounding of the property.
  **Soft Spot:** If the contrast class includes "possible interventions," Humeans will claim this violates the spirit of Humean supervenience.

  ### 4. Explanatory Idleness (Interventionist)
  **Objection:** "Why do we need a metaphysics of dispositions at all? I model the polymer exuding plasticizer as a causal pathway invariant under intervention. Your 'window' and 'contrast class' add no predictive power. It's just metaphysical ornamentation."
  **Reply (90s):** Causal models tell you *what* happens; dispositions tell you *why* it's stable. Your interventionist model captures the specific chain (stress → plasticizer → no break). But the disposition ascription captures the *range* of conditions under which that stability holds. My 'window' indexing explains why we treat the polymer as brittle in rapid-stress contexts but not slow ones. It groups causal models under stability profiles your variables miss.
  **Soft Spot:** Interventionists may argue stability profiles are just higher-order invariances, rendering 'disposition' redundant.

  ### 5. Reciprocal Partners (Powers)
  **Objection:** "Conditional analyses fail on reciprocal partners (two fragile things hitting each other). Your indexing doesn't fix this. If both mask each other, does neither have the disposition? That's absurd."
  **Reply (90s):** My schema handles this via the 'admissible interferer' clause. In a reciprocal crash, each object is an interferer for the other. Relative to a contrast class excluding such impacts, both are fragile. Relative to a class including them, neither manifests. This isn't absurd; it's accurate. The disposition exists, but the manifestation condition isn't met relative to that specific interferer class. We stop trying to force a binary 'break/don't break' on a complex interaction.
  **Soft Spot:** Powers theorists want the disposition to guarantee manifestation given the partner; I'm saying the ascription shifts.

  ### 6. The Slow-Fink Vagueness (Humean)
  **Objection:** "Your 'slow-fink' case makes truth values unstable. If the basis decays after a delay, is it fragile now? Your 'window' indexing makes fragility vague. Metaphysics needs precision."
  **Reply (90s):** Precision comes from specifying the window. 'Fragile' is incomplete without 'within time t'. In engineering, we already do this (e.g., 'impact resistant at 5ms'). My metaphysics formalizes this practice. It's not vague; it's parameterized. If you don't specify the window, the question is ill-posed, not the property. This solves the slow-fink by forcing the questioner to specify the temporal scope of the test.
  **Soft Spot:** Admitting that ordinary language ascriptions are often ill-posed concedes ground to error theorists.

  ### 7. The Self-Cancelling Coherence (Powers/Humean Hybrid)
  **Objection:** "In your polymer case, the exudation is an exercise of the disposition that prevents the manifestation. That's contradictory. You can't manifest a power to prevent its own manifestation."
  **Reply (90s):** It's not contradictory if we separate the *triggering* from the *outcome*. The disposition is to respond to stress. The response is plasticizer exudation. Shattering is the *typical* outcome, not the definition. My indexing allows the 'manifestation window' to include the exudation event itself. The disposition manifests (exudes), which alters the basis (dissolves links), preventing the shattering. It's a self-modifying disposition, not a logical contradiction.
  **Soft Spot:** Requires accepting that 'manifestation' isn't necessarily the stereotypical outcome (breaking), which fights standard usage.

  ---

  ### STRATEGIC BOUNDARIES

  **What to Concede (First 2 Minutes):**
  1.  **Lewis's Original RCA is Dead:** Don't defend the simple conditional. Acknowledge finks/masks killed it.
  2.  **Context Sensitivity:** Admit that disposition ascriptions are partly pragmatic. Don't fight the interventionist on the utility of causal models.
  3.  **Complexity:** Concede that indexing adds complexity to the analysis. It's not a "simple" reduction anymore.

  **What to Hold (No Matter What):**
  1.  **Unity of Mechanism:** Finks and masks are structurally identical (interference with timing/direction). Do not let them separate these into distinct metaphysical problems.
  2.  **Necessity of Indexing:** You cannot solve these cases without indexing to windows and interferers. Any theory that doesn't do this fails the slow-fink and self-cancelling cases.
  3.  **Property vs. Ascription:** Hold the line that the *basis* is intrinsic, but the *truth of the ascription* is relative to the contrast class.

  **The Question I Hope Nobody Asks:**
  *"What metaphysically fixes the contrast class of admissible interferers? Is it a law, a convention, or a modal fact?"*
  *   **Why:** If I say **Law**, Humeans might accept it but Powers people will say I've reduced dispositions to laws. If I say **Convention**, Humeans will say dispositions aren't real. If I say **Modal Fact**, Humeans will walk out. This is the weak link in the "indexing" solution.
