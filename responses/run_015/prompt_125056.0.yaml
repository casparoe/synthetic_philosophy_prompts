answer: |-
  Your lead's position is logically incoherent because the "luck" argument he uses to flatten rewards also invalidates blame, so you should challenge him on that asymmetry using pragmatic incentives rather than metaphysical defenses of merit.

  His argument is a standard philosophical position known as hard incompatibilism or luck egalitarianism, most famously articulated by Galen Strawson in the "Basic Argument." The premise is correct: you did not choose your genes, your parents, or the circumstances that shaped your instincts, so you cannot claim ultimate moral responsibility for your output. However, the lead is committing a category error by applying this metaphysical truth to compensation while ignoring it for accountability. If nobody earns their success because of luck, nobody owns their failures either. The engineer who saved the release had lucky instincts; the engineer who broke prod had unlucky lapses, bad training, or genetic predispositions to fatigue. You cannot consistently hold the view that "nothing is really yours" for the bonus pool while maintaining "this is on you" for performance reviews. He is using philosophy to cut costs while retaining management control.

  "Deserving" survives this argument only if you shift the definition from moral worth to pragmatic incentive. We do not pay bonuses because someone metaphysically earned them in the eyes of the universe; we pay them because differential reinforcement shapes future behavior. If you remove the link between output and reward, you remove the signal that encourages high output. This is compatibilism: even if determinism is true, the system of rewards and punishments still functions as a causal mechanism within that determined world. Your lead is conflating "moral desert" (which luck undermines) with "economic utility" (which luck does not). You can accept his premise that luck plays a huge role while rejecting his conclusion that pay should be equal, because the purpose of pay is not to judge souls but to engineer behavior.

  The asymmetry of strict blame and soft reward is toxic because it creates a system with only downside risk. If the team internalizes his argument, they will learn that excellence is unrecognized luck but failure is personalized fault. This drives high performers to leave and encourages risk-aversion in everyone else. It is not incoherent for a company to be stricter on safety (blame) than innovation (reward) for risk management reasons, but it is incoherent to justify that split using a philosophical argument about agency that only applies in one direction.

  At the retro, do not debate metaphysics. Debate system design and retention. Say this:

  "I've been thinking about the bonus decision. I understand the argument that luck plays a huge role in our output, and I agree that we shouldn't pretend success is 100% merit. But if we accept that premise for rewards, we have to accept it for accountability too. We can't say the heroics were luck when dividing the pool, then say the mistakes were personal failings during reviews. If we're moving to a model where output isn't tied to compensation, we need to discuss how we adjust our expectations around ownership and blame, because keeping personalized risk without personalized reward changes the incentive structure fundamentally. I'm worried that telling the team their wins are luck but their losses are faults will drive our best people away."

  This forces him to either abandon the philosophical justification (admitting it was about budget) or apply it consistently (abolishing blame, which he won't do). It frames the issue as a retention and incentive problem, which is a business constraint he cannot ignore, rather than a moral debate he can win.
