prompt: |-
  I'm one of six engineers on a team that just came out of a rough quarter — one release that kept paging us at 3am, and one project that got killed for reasons that had nothing to do with any of us. Our lead says he's splitting the bonus pool evenly this year, and when I pushed back he gave me an argument I can't get out of my head: nobody earns the things that make them good. The guy who kept saving the release has insane instincts under pressure, and he has those because of genetics, because his dad ran a datacenter, and because he happened to be the one awake when the pager went off at 3am. Strip all that out and there's nothing left that's really his, so paying him more for output is just taking luck and laundering it into a moral claim. At the same time, the lead is completely fine with us writing someone up for a bad deploy, and he still talks about "performance" in reviews.

  I basically believe his premise and I think his conclusion is wrong, and I cant say why. So: (1) is there any version of "she deserved that bonus" that survives an argument like this, or does the whole idea of earning just fall apart once you take the luck part seriously? (2) Is it incoherent of him — or of me — to want to be strict about blame and soft about reward? If blame and credit are the same thing pointed in different directions, I shouldn't be able to keep one and drop the other, right? (3) Concretely, what do I actually say at the retro next week? I don't want to be the guy going "merit is real, deal with it," and I also don't want to shrug and say nothing is ever anyone's fault.

  Lead with your actual answer in the first sentence and then give me the reasoning — no preamble, and please dont restate my question back at me. And if his argument is just some standard position with a standard hole in it, or if I've set the whole thing up wrong, say that plainly instead of being polite about it.
