prompt: |-
  Okay so I'm trying to figure out where the real conceptual work is in speech-act theory if we take seriously these ghost performatives — utterances designed to bind people who aren't present, like an AI system generating contract terms that execute automatically with no human speaker around at the moment of effect. Austin's felicity conditions assume you've got a live audience and shared context, but here theres neither, and the speaker/hearer distinction kind of collapses since the speaker might be a distributed protocoll.

  So if I'm advising a small philosophy group — maybe four people for three years, pure conceptual work, no ML bench — which open questions should they actually prioritize? I'm thinking about whether the bottleneck is redefining uptake without co-presence, whether institutional authority already covers this and we're just overcomplicating things, or whether performative force can survive asynchronous execution at all.

  Rank the top three or four lines of work. Defend the ordering: what's upstream of what, which ones are tractable with philosophical tools rather than engineering, and what result over the next couple years would make you flip the ranking? I'm less interested in a survey than in where the actual bottleneck is, and which problems might just be fake ones caused by stretching Austin too far. Also flag if any depend on solving something in philosophy of mind first, and be honest about where the framework genuinely breaks versus where we're just being lazy.
