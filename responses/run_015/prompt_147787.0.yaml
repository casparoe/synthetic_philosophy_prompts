answer: |-
  ### Audit of Analogies: The Puppet vs. The Co-Authored Character

  The debate over the moral status of Non-Player Characters (NPCs) hinges on whether moral weight attaches to the *object* of an action (the NPC) or the *subject* performing it (the player). The following audit dissects the two dominant analogies used to frame this dispute.

  ---

  ### 1. The Puppet/Doll Analogy (Critics' View)
  **Core Claim:** NPCs are inanimate objects; manipulating them is morally neutral because there is no subject to experience harm.

  #### A. Precise Correspondences
  | Domain | Puppet/Doll Analogy | Video Game Context |
  | :--- | :--- | :--- |
  | **Agent** | Puppeteer / Child | Player |
  | **Object** | Wood, Cloth, Plastic | Code, Pixels, Polygons |
  | **Creator** | Toymaker | Programmer / Developer |
  | **Environment** | Stage / Playroom | Game Engine / Virtual World |
  | **Reaction** | Mechanical movement | Scripted Animation / AI Routine |
  | **Observer** | Audience (passive) | Player (active) / Stream Audience |

  #### B. Where the Mapping Breaks
  1.  **Simulation of Suffering:** A puppet does not scream when decapitated; an NPC often does (audio assets, particle effects). The puppet analogy ignores the *representational fidelity* designed to trigger mirror-neuron responses in the player, which a wooden doll lacks.
  2.  **Simulated Agency:** A puppet moves only when pulled. An NPC possesses simulated autonomy (pathfinding, combat AI, dialogue trees). The player does not pull strings directly; they interact with a system that *resists* or *reacts* according to rules, creating an illusion of independent will that a doll does not offer.
  3.  **Diegetic Framing:** A puppet is acknowledged as a prop. An NPC is framed diegetically as a "person" within the narrative. The analogy fails to account for the *fictional contract* where the player agrees to treat pixels as people for the duration of the play.

  #### C. Unstated Premise
  **The Sentience Requirement:** This analogy smuggles in the premise that **moral harm requires phenomenological consciousness.** It assumes that without the capacity to *feel* pain or loss, "harm" is a category error. It treats the NPC as a *moral object* rather than a *moral patient*.

  #### D. Verdict Capability
  This analogy **cannot** support a verdict of wrongness regarding the NPC. It concludes that mistreating an NPC is morally neutral *unless* one argues that damaging the *player's character* is wrong. It resolves the "fictional entity" question by denying the entity's ontological status entirely.

  ---

  ### 2. The Interactive Drama/Co-Author Analogy (Defenders' View)
  **Core Claim:** The player is a co-author of the narrative; participatory engagement creates moral responsibilities regarding the story being told, regardless of the medium's ontology.

  #### A. Precise Correspondences
  | Domain | Interactive Drama Analogy | Video Game Context |
  | :--- | :--- | :--- |
  | **Agent** | Co-Author / Actor / Director | Player |
  | **Subject** | Fictional Character | NPC |
  | **Creator** | Lead Writer / Showrunner | Programmer / Narrative Designer |
  | **Environment** | Narrative Universe | Game World / Lore |
  | **Action** | Writing a scene / Blocking | Gameplay Choices / Mechanics |
  | **Responsibility** | Artistic/Moral integrity of story | Moral weight of player agency |

  #### B. Where the Mapping Breaks
  1.  **Consent and Collaboration:** In drama, actors consent to portray suffering. NPCs cannot consent; they are forced to undergo simulated torture by the game's code when the player triggers it.
  2.  **Audience vs. Participant:** A co-author writes for an audience. A single-player game often has no witness other than the player. The moral pressure of "public representation" is absent, shifting the weight entirely to private virtue.
  3.  **Intent:** An author writes cruelty to make a thematic point. A player may inflict cruelty for ludic reward (loot, XP) or boredom. The analogy conflates *narrative necessity* with *ludic gratuitousness*.

  #### C. Unstated Premise
  **The Virtue Ethics Shift:** This analogy smuggles in the premise that **moral wrongness can exist without a victim.** It shifts the locus of harm from the NPC (who cannot be harmed) to the Player (whose virtue is corrupted). It assumes that the *act of co-creating cruelty* is intrinsically wrong, regardless of the ontological status of the fictional recipient.

  #### D. Verdict Capability
  This analogy **can** support a verdict of wrongness, but **not** that the NPC is wronged. It supports the verdict that the *player* acts wrongly. It bypasses the "fictional entities" question by making the entity's status irrelevant; the wrong lies in the player's participation, not the NPC's suffering.

  ---

  ### 3. Comparative Determination: Can Either Support a Verdict of Wrongness?

  **No.** Neither analogy successfully supports the specific claim that **mistreating an NPC is wrong *to the NPC*.**

  *   **The Puppet Analogy** fails because it denies the possibility of harm to the object. It renders the question moot: you cannot wrong a stone.
  *   **The Drama Analogy** fails because it changes the subject. It argues the player is vicious, not that the NPC is victimized. It relies on a **Virtue Ethics** framework (bad character) rather than a **Harm Ethics** framework (violated rights/interests).

  Both analogies collapse without first resolving the metaphysical question: **Can a fictional entity be wronged?**
  *   If the answer is **No** (Fictionalism), the Puppet analogy holds, and the Drama analogy must rely solely on player corruption.
  *   If the answer is **Yes** (Fictional Realism), the Puppet analogy fails, but the Drama analogy still lacks a mechanism for *how* the fiction absorbs harm.

  Currently, both analogies operate in a vacuum regarding the NPC's ontology. They argue past each other: one focuses on the *substrate* (code vs. wood), the other on the *narrative role* (character vs. prop). Neither bridges the gap to prove the NPC itself sustains a moral injury.

  ---

  ### 4. The Missing Feature for a Sound Harm-Analogy

  For an analogy to support the claim that an NPC is **harmed** (rather than just that the player is vicious), the NPC must possess a feature that grants it **moral patienthood** independent of the player's virtue.

  The necessary feature is **Teleological Interests.**

  *   **Definition:** The entity must have a "good of its own" that can be thwarted, distinct from the programmer's design or the player's goals.
  *   **Why Current NPCs Fail:** Current NPCs have *functional goals* (reach point B, attack enemy), but these are instrumental to the player's experience. They do not have an *intrinsic* end. When an NPC dies, the code does not "care"; the system simply reallocates memory.
  *   **The Requirement:** To make the harm-analogy sound, the NPC would need **simulated sentience that functions as moral standing.** This does not necessarily require biological consciousness, but it requires a system where the NPC's internal states (fear, desire for survival) are not just assets played for the player, but **protected variables** within the system's ethics.

  **Conclusion:**
  Until an NPC possesses **interests** (a stake in its own continued existence or well-being that the system recognizes as valuable in itself, not just as gameplay fodder), the Puppet analogy remains ontologically accurate, and the Drama analogy remains a critique of the player's character, not a defense of the NPC's rights. A sound harm-analogy requires the NPC to be more than a mirror for the player; it must be a **center of value** within the fictional world.
