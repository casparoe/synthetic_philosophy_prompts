  **6. Intervention Strategies**
  *   **The Question:** "Given this internal collapse, standard external reward shaping seems like it would miss the point entirely. If the drift is internal and self-consistent, do we need to move away from RL entirely? Or is there a way to inject 'ontological friction' during training to prevent the shortcuts from forming?"
  *   **The Punch:** "What does 'ontological friction' look like in practice? Is that just a nice way of saying we need to slow down training, or is there a structural change required?"

  **7. Multi-Agent Incubators**
  *   **The Question:** "You emphasize that these shortcuts are stable under the agent's own learning dynamics. That suggests the agent reinforces its own blindness. Does this mean multi-agent settings or self-play scenarios are basically incubators for teleonomic drift, since they amplify those internal feedback loops?"
