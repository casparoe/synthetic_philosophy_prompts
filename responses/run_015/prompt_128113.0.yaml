      *Crucial nuance:* The "welfare per unit time" vs "welfare per life". If a life is short and miserable, is it worse than a long and miserable life? If suffering is rate-based, a short life has less total suffering. Maya assumes shorter lives = less suffering. Theo implies succession = faster turnover = more suffering events per time unit. This needs highlighting.

  10. **Final Review against User Prompt:** "Tell me how confident you'd be in each judgment and where you'd want data before committing." "If the whole setup is confused... say that plainly."

