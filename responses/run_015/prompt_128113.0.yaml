      *   **Task:** Evaluate a debate between two people (Maya and Theo) about habitat destruction and wild animal suffering.
      *   **Format:** Go through the argument move-by-move, assess who is right about what, identify what both are missing, assess confidence levels, identify data needs, and determine if the question is fundamentally confused/underspecified.
      *   **Tone/Style:** American English, analytical, direct (don't just split the difference), nuanced.
      *   **Key Themes:** Wild animal suffering (WAS), population ethics, habitat conversion, ecological succession, welfare metrics (per life vs. per time), conservation ethics.

  2.  **Deconstruct the Arguments:**

      *   **Maya (Move 1):** Premise: Most wild lives are net negative (suffering > happiness). High fecundity + early death = welfare deficit. Conclusion: Preserving habitat perpetuates suffering. Destroying habitat reduces population, thus reducing total suffering.
      *   **Theo (Move 2):** Premise: Destruction isn't sterilization; it creates edge/early-successional habitat. Generalists thrive there. Result: Headcount might go *up*, per-capita welfare might go *down* (more exposure/stress). Conclusion: Destruction likely increases suffering (more animals, worse lives). Empirical uncertainty makes "destruction helps" unsafe.
      *   **Maya (Move 3):** Counter: If welfare is negative, reducing numbers wins even if per-capita drops (unless it flips positive). "Half-degrading" is bad; total conversion or preservation is better. Burden of proof on Theo to show lives are positive or numbers don't drop.
      *   **Theo (Move 4):** Counter: Conversion isn't permanent (succession). Cleared land regrows. This creates a "pulse" of high birth/death rates (early succession) before returning to steady state. Conclusion: It's a "suffering loan" (accelerated suffering now), not a cancellation. Discounting the future makes this worse.
      *   **Maya (Move 5):** Counter 1: Some conversion *is* permanent (cities, intensive ag). Counter 2: Population ethics (Non-Identity Problem/Asymmetry). Animals in regrowth wouldn't exist otherwise. If non-existence isn't bad, only the suffering counts. Conclusion: Conversion looks better under standard negative utilitarian/population ethics.

  3.  **Evaluate Move-by-Move:**

      *   *Move 1 (Maya):* Logically consistent *if* premises hold. Premise "wild lives are net negative" is the weak link. Premise "destruction reduces numbers" is ecologically simplistic.
      *   *Move 2 (Theo):* Ecologically stronger. Edge effects and early succession often support *higher* densities of small mammals/birds (the high-suffering candidates). The "empirical mess" point is valid.
      *   *Move 3 (Maya):* Mathematically sound regarding total suffering (Total = N * Avg Welfare). If Avg < 0, reducing N helps. But relies on N actually dropping.
      *   *Move 4 (Theo):* Ecologically insightful regarding succession. The "pulse" concept is real. The "loan" framing is ethically tricky (depends on discounting and population ethics).
      *   *Move 5 (Maya):* Ethically sharp. Hits the Non-Identity Problem. Distinguishes between permanent (urban) and temporary (abandoned farm) conversion.

  4.  **Identify Missing Elements (The "Blind Spots"):**

      *   *Welfare Metric:* Is it welfare per *life* or welfare per *unit time*? A short, miserable life vs. a long, miserable life.
      *   *Displacement:* Habitat loss doesn't just kill animals; it pushes them into remaining fragments (density compensation), increasing competition/suffering there.
      *   *Trophic Cascades:* Removing habitat affects predators differently than prey.
      *   *Uncertainty:* The sign of wild welfare (+/-) is the biggest unknown.
      *   *Intervention Feasibility:* Even if habitat destruction *theoretically* reduces suffering, is it a viable moral strategy compared to welfare interventions (vaccines, contraception)?
      *   *Definition of "Destruction":* Urbanization vs. Agriculture vs. Managed Forest.

  5.  **Assess Confidence & Data Needs:**

      *   *Wild Welfare Sign:* Low confidence. Need better measures of affect in wild animals.
      *   *Population Density Responses:* Medium confidence. Ecology is well-studied, but welfare correlation is not.
      *   *Succession Dynamics:* High confidence ecologically, low confidence ethically (how to weight the "pulse").
      *   *Population Ethics:* Philosophical stalemate. No data solves this.

  6.  **Determine if the Question is Confused:**

      *   It's not *confused*, but it is *underspecified*. It treats "habitat" and "destruction" as monoliths. It assumes we can control the *type* of destruction precisely (Maya's "convert thoroughly" is practically impossible without causing the edge effects Theo mentions).
      *   The core issue is the "Alexandrov Logic" (if lives are negative, fewer is better) clashing with ecological reality (you can't just delete carrying capacity without side effects).

  7.  **Drafting the Response (Iterative refinement):**

      *   *Introduction:* Acknowledge the depth of the debate. It's a classic WAS (Wild Animal Suffering) vs. Conservation Ethics clash.
      *   *Move-by-Move Analysis:*
          *   M1: Right on logic, wrong on ecology.
          *   T2: Right on ecology, cautious on ethics.
          *   M3: Right on math, wrong on feasibility.
          *   T4: Right on succession, shaky on "loan" metaphor.
          *   M5: Right on ethics (non-identity), right on permanence distinction.
      *   *What's Missing:* The displacement effect (spillover), the metric of suffering (intensity x duration), and the "control" problem (we can't surgically remove habitat).
      *   *Confidence/Data:* Highlight the lack of welfare data.
      *   *Verdict:* The setup isn't confused, but it's policy-irrelevant without intervention tech. Maya wins the philosophy; Theo wins the ecology. But both lose on praxis.

  8.  **Refining the Tone:** Ensure it sounds American (direct, analytical). Avoid hedging too much ("on the one hand, on the other"). Be decisive where possible. *Self-Correction:* Make sure to address the "welfare per unit time vs per life" hint the user gave. That's crucial for Theo's succession argument.

  9.  **Final Polish:** Check against constraints. (American English, confidence levels, data needs, plain talk if confused).

      *(Self-Correction during drafting)*: I need to be careful not to endorse habitat destruction. I must analyze the *argument*, not the *moral implication*. The prompt asks who is right about the *claims*, not what we should do.
      *   Maya's claim: Destruction reduces numbers. (Often false).
