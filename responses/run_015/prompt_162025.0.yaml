prompt: |-
  I'm in my third year of a neuroethics PhD (philosophy side, but I share an office with the connectomics and emulation crowd) and I'm putting together a short "which view of survival through gradual replacement do you actually hold?" instrument. I want to run it pre and post around a session we're doing on whole-brain emulation and cell-by-cell neural prosthetics, so the respondents will be neuroscience and ML PhD students plus a few clinicians — no philosophers, and no one who should need to know what any of the positions are called.

  What I'd like from you:

  Eight diagnostic questions, each a concrete case with two or three answer options, plus a scoring key. The point is to sort people by what they say about the cases, so no question should just ask whether you are your body, your brain, or your memories — every question should be a case where the standard views genuinely come apart, phrased so someone can answer it cold. Keep each question to maybe forty words and write the whole thing in British English.

  Cases I definitely want in there (fill the rest with whatever you think separates views best):

  - one neuron at a time swapped for a functionally identical silicon unit, all the way to 100%, with behaviour and reported experience apparently unchanged throughout;
  - the identical end state reached in a single operation under general anaesthetic;
  - a swap sequence where behaviour and verbal reports stay perfect but where, on one way of thinking about it, consciousness would quietly dim and go out, and on another way of thinking the idea of a silent dimming is incoherent because you'd always be talking about it if it happened;
  - substitutes that reproduce the input-output function of the replaced population only at the level of the whole network, so that swapping any single unit in isolation would not look behaviourally identical — no pairwise substitution test works;
  - substitutes whose internal dynamics run on a different timescale from the originals (they predict ahead to keep timing at the interfaces right), so behaviour and the abstract causal structure are preserved but the fine-grained real-time dynamics are not;
  - replacement to around 60%, then reverting to biological units cultured from your own cells;
  - the gradual sequence reaching a point at which the system is copied and both copies then continue being gradually replaced.

  Build it from the logical space first: the questions, then the answer combinations they allow, then locate the actual positions in that space — psychological continuity with and without a no-branching clause, the animalist/organism view, pattern or functionalist views, embodied/enactivist scepticism about substrate-neutral replacement, the vagueness or no-fact-of-the-matter option, and the deflationary no-self option. Note the combinations nobody occupies and briefly say why (incoherent, unattractive, or just unexplored), and flag any pair of views your instrument can't separate instead of pretending it can.

  One thing I want your help with: my hunch is most of my respondents will say yes to gradual replacement and no to the instantaneous version, and I can't tell whether that's a stable position or whether it collapses once you put in the population-level and time-dilated swaps. Tell me which of your questions would actually break that pattern apart versus which ones would just confirm it, and say what I should do with the answer sheets that don't match any leaf cleanly. No references needed — I know that literature well enough, I just need the instrument.
reasoning: |-
  Here's a thinking process that leads to the suggested instrument and analysis:

  1.  **Analyze the Request:**
      *   **User:** 3rd-year Neuroethics PhD student (Philosophy side).
      *   **Audience:** Neuroscience, ML PhD students, Clinicians (no philosophers).
      *   **Task:** Create an 8-question diagnostic instrument on survival through gradual replacement (Ship of Theseus style applied to mind/brain).
      *   **Constraints:**
          *   British English.
          *   ~40 words per question.
          *   Concrete cases, not abstract theory.
          *   Two or three answer options per question.
          *   Must include specific cases requested (7 specific scenarios listed).
          *   Need a scoring key/logic.
          *   Need an analysis of the logical space (positions, combinations, empty spots, limitations).
          *   Need advice on the "Gradual Yes / Instant No" hunch and how to handle messy data.
      *   **Goal:** Sort respondents by underlying metaphysical commitments without them knowing the labels.

  2.  **Deconstruct the Required Cases:**
      1.  *Gradual Silicon Swap:* 1 neuron at a time to 100%, behaviour/experience unchanged.
      2.  *Instant Swap:* 100% swap in one go under anaesthetic.
      3.  *Fading Qualia:* Behaviour perfect, but consciousness might dim (vs. incoherence).
      4.  *Holistic/Network Swap:* Input-output preserved at network level, not unit level (no pairwise substitution).
      5.  *Timescale Mismatch:* Internal dynamics different (predictive), abstract causal structure preserved.
      6.  *Reversion:* 60% swap, then revert to biological (own cells).
      7.  *Fission/Branching:* Gradual to point X, then copy, both continue replacing.
      8.  *Open Slot:* Need one more to fill logical gaps (maybe something about embodiment or memory loss).

  3.  **Drafting the Questions (Iterative Process):**
      *   *Constraint Check:* British English, ~40 words, concrete.
      *   *Q1 (Gradual Silicon):* Focus on the end state. Are *you* there?
      *   *Q2 (Instant Swap):* Focus on the break in continuity.
      *   *Q3 (Fading Qualia):* Focus on the possibility of silent fading.
      *   *Q4 (Holistic):* Focus on the lack of local functional identity.
      *   *Q5 (Timescale):* Focus on the internal speed vs. external output.
      *   *Q6 (Reversion):* Focus on the interruption and return to biology.
      *   *Q7 (Fission):* Focus on which one is *you* (both, one, neither).
      *   *Q8 (The Wildcard):* I need something to test Embodiment or Psychological Continuity specifically. Let's go with a "Teletransportation" variant or "Memory Upload" to contrast with the physical preservation. Actually, the prompt asks for "replacement" scenarios. Let's make Q8 about *embodiment*—swapping the body but keeping the brain vs. swapping the brain but keeping the body. Or, given the connectomics context, let's look at *structural* vs *functional* preservation. Let's go with a "Scan and Print" where the original is destroyed. It contrasts well with the gradual replacement.
      *   *Refining Q8:* Let's make it about the *vehicle*. If we keep the connectome but change the chemistry entirely (not silicon, just different molecules). No, let's stick to the prompt's vibe. Let's use the 8th slot for a "Slow Fade" vs "Abrupt Cut" regarding memory. Actually, the prompt lists 7 specific cases. I need to fill the rest. I'll use Q8 to test the *Animalist* view specifically—what if the brain is kept alive but disconnected? No, let's go with *Embodiment*. If your brain is emulated but your body is kept on life support, where are you?
      *   *Decision:* I will draft the 7 required + 1 Embodiment/Somatic question.

  4.  **Developing the Scoring/Logical Space:**
      *   I need to map answers to positions:
          *   *Psychological Continuity (Lockean):* Cares about memory/personality. Usually says Yes to Gradual, Yes to Instant (if memory preserved), Yes to Fission (both or neither).
          *   *Animalism/Biological:* Cares about the organism. Yes to Gradual (maybe), No to Instant (too disruptive?), No to Silicon.
          *   *Functionalism/Patternist:* Yes to almost all if function is preserved.
          *   *Embodied/Enactive:* No to Silicon, No to Timescale changes.
          *   *Vagueness/No Fact:* "It depends/Indeterminate."
          *   *Deflationary/No-Self:* "The question is wrong."
      *   *Scoring Key:* I shouldn't just give a "You are X" result. I should provide a key that maps answer patterns to clusters.
      *   *Addressing the User's Hunch:* The "Gradual Yes / Instant No" intuition is common (Sorites paradox). It usually collapses under Functionalism (if function is same, why does speed matter?) or Animalism (if organism is broken, gradual doesn't save it).
      *   *Questions that break the pattern:* Q4 (Holistic) and Q5 (Timescale). If they say Yes to Gradual (Q1) but No to Holistic (Q4), they are likely *Local Functionalists*. If they say Yes to Gradual but No to Timescale (Q5), they are *Dynamic/Process* theorists.
      *   *Messy Data:* Advise on clustering rather than binning.

  5.  **Drafting the Content (incorporating British English):**
      *   *Spelling:* Behaviour, anaesthetic, programme (if used), centre, etc.
      *   *Tone:* Professional, clinical, neutral.
      *   *Word Count:* Keep tight.

      *(Self-Correction during drafting)*: Ensure Q3 (Fading Qualia) distinguishes between "It's possible I fade" vs "That's nonsense."
      Ensure Q7 (Fission) offers the "Neither" or "Both" option to catch the Non-Branching clause.

  6.  **Analyzing Logical Space & Empty Combinations:**
      *   *Incoherent:* Saying "Instant Yes" but "Gradual No" (usually).
      *   *Unattractive:* "Fission: Both are me" without qualification (violates transitivity of identity).
      *   *Limitations:* Can't distinguish Psychological Continuity from Functionalism easily without memory-loss scenarios. Can't distinguish Animalism from Substrate-Dependence without biological vs silicon contrasts (which Q1 covers).

  7.  **Final Review against Constraints:**
      *   8 Questions? Yes.
      *   British English? Yes.
      *   ~40 words each? Need to check.
      *   Scoring key included? Yes.
      *   Logical space analysis included? Yes.
      *   Advice on the "Gradual/Instant" hunch included? Yes.

  8.  **Final Polish:** Check the tone. It needs to be useful for a PhD student running a workshop. The analysis should be sophisticated enough for them but clear enough to explain to neuroscientists.

  *(Drafting the Questions)*
  Q1 (Gradual): You replace neurons one by one with silicon. Behaviour and reports stay normal. At 100%, are you still you? (Yes/No/Unsure)
  Q2 (Instant): Same swap, but all at once while asleep. You wake up silicon. Are you the same person? (Yes/No/Unsure)
  Q3 (Fading): Gradual swap. Behaviour perfect, but suppose consciousness fades silently. Is this scenario coherent? (Yes/No)
  Q4 (Holistic): Swap groups only. Individual units don't match, but network output does. Do you survive? (Yes/No)
  Q5 (Timescale): Emulation runs 100x fast but slows output to match. Internal dynamics differ. Is it you? (Yes/No)
  Q6 (Reversion): 60% swap, then replaced with cloned biological tissue. Are you the original organism? (Yes/No)
  Q7 (Fission): Gradual swap to 50%. System copied. Both halves finish the swap. Which one is you? (Left/Right/Both/Neither)
  Q8 (Embodiment): Brain emulated. Body kept alive on life support, empty. Where is your experience? (In the emulation/In the body/Nowhere)

  *Refining for Word Count and Nuance:*
  Make sure options allow for the specific philosophical distinctions (e.g., Non-Branching).
  Make sure British spelling is consistent (behaviour, anaesthetic, programme, etc.).

  *Scoring Logic:*
  Group by "Substrate Independence," "Continuity," "Uniqueness."

  *Analysis of the Hunch:*
  The "Gradual Yes / Instant No" is the "Sorites Trap." Q4 and Q5 test if they care about *how* the function is achieved, not just *that* it is achieved. If they fail Q4/5, their Functionalism is weak.

  *Empty Spaces:*
  "Instant Yes / Gradual No" is logically weird (why does speed help identity?).
  "Fission: Both" is metaphysically costly (violates identity transitivity).

  *Let's write it.*
answer: |-
  Here is the instrument, followed by the logical map and analysis you requested.

  ### The Instrument: Continuity and Replacement

  **Instructions:** For each scenario, select the option that best matches your intuition. Do not overthink; there are no correct answers.

  **1. The Gradual Swap**
  Your neurons are replaced one by one with functionally identical silicon units over ten years. Your behaviour and reported experiences remain unchanged throughout. Once the last neuron is replaced, are you still the same person?
  A) Yes, I survive.
  B) No, I am replaced.
  C) It is indeterminate.

  **2. The Instant Swap**
  You are scanned and your brain is replaced entirely with silicon while under general anaesthetic. You wake up with identical memories and dispositions. Are you the same person who went to sleep?
  A) Yes, I survive.
  B) No, I am a copy.
  C) It is indeterminate.

  **3. The Fading Qualia**
  During the gradual swap, behaviour remains perfect, but consciousness silently dims until it vanishes. Is this scenario conceptually coherent, or would you necessarily notice and report the fading?
  A) Coherent; I could fade silently.
  B) Incoherent; perfect function implies experience.
  C) Unsure.

  **4. The Holistic Swap**
  Substitutes reproduce the network's input-output function, but no single unit is functionally identical to the neuron it replaces. Pairwise substitution tests fail. Do you survive?
  A) Yes, function is preserved.
  B) No, the components are wrong.
  C) It is indeterminate.

  **5. The Time-Dilated Swap**
  The emulation's internal dynamics run 100x faster than biology, predicting ahead to match real-time interfaces. Abstract causal structure is preserved, but fine-grained timing is not. Is it you?
  A) Yes, causal structure suffices.
  B) No, real-time dynamics matter.
  C) It is indeterminate.

  **6. The Reversion**
  Neurons are swapped to 60%, then replaced with biological units cultured from your own cells. The original biological continuity was interrupted. Are you the original organism?
  A) Yes, biological continuity is restored.
  B) No, the chain was broken.
  C) It is indeterminate.

  **7. The Branching**
  At 50% replacement, the system is copied. Both copies continue the replacement process independently. Both claim to be you. Which one is you?
  A) The original branch.
  B) Both are me.
  C) Neither is me.

  **8. The Empty Vessel**
  Your connectome is emulated. Your biological body is kept alive on life support but receives no neural input. Where is your conscious experience located?
  A) In the emulation.
  B) In the biological body.
  C) Nowhere / The question is flawed.

  ***

  ### Scoring Key and Logical Space

  Do not sum the scores. Instead, map the response pattern to the clusters below. Respondents will rarely fit a single label perfectly; look for the dominant gravitational pull.

  **Cluster A: The Functionalist / Patternist**
  *   **Profile:** Q1(Yes), Q2(Yes), Q4(Yes), Q5(Yes), Q8(A).
  *   **View:** Substrate-neutral. Identity lies in abstract causal structure.
  *   **Note:** If they answer Q3(B), they are *Computationalists*. If Q3(A), they are *Functionalists* open to zombie possibilities.

  **Cluster B: The Spatiotemporal Continuant**
  *   **Profile:** Q1(Yes), Q2(No), Q6(B), Q7(C or A).
  *   **View:** Identity requires continuous physical trajectory.
  *   **Note:** This captures the "Gradual Yes / Instant No" intuition. They accept Sorites-style drift but reject discontinuous jumps.

  **Cluster C: The Biological Animalist**
  *   **Profile:** Q1(No or C), Q2(No), Q4(No), Q6(A), Q8(B).
  *   **View:** You are the organism, not the psychology or the pattern.
  *   **Note:** Q6 is the discriminator here. If they say "Yes" to reversion despite interruption, they prioritise biological material over continuity.

  **Cluster D: The Non-Branching Psychological Continuity**
  *   **Profile:** Q1(Yes), Q2(Yes), Q7(C).
  *   **View:** Survival requires uniqueness. Fission kills the original.
  *   **Note:** Q7(C) is the key. Choosing "Neither" preserves the logic of identity (one-to-one) at the cost of survival.

  **Cluster E: The Embodied / Enactive Skeptic**
  *   **Profile:** Q5(No), Q8(C or B), Q4(No).
  *   **View:** Cognition depends on specific dynamics and body coupling.
  *   **Note:** Q5 is the primary filter. If real-time dynamics matter, they reject classical computationalism.

  **Cluster F: The Deflationary / No-Self**
  *   **Profile:** Q3(C), Q7(C), Q8(C).
  *   **View:** "Survival" is a linguistic convention, not a metaphysical fact.
  *   **Note:** Look for consistent "Indeterminate" or "Flawed" responses across ontological questions.

  ***

  ### Analysis of Logical Space and Empty Combinations

  **1. The "Instant Yes / Gradual No" Gap**
  *   **Combination:** Q1(No) + Q2(Yes).
  *   **Status:** Logically incoherent / Unoccupied.
  *   **Reason:** If discontinuous replacement preserves identity, continuous replacement must also do so (unless continuity is actively harmful, which makes no sense in this context). If a respondent selects this, they have likely misread the questions or hold a view where "wear and tear" during gradualism degrades identity more than a clean cut.

  **2. The "Fission: Both" Trap**
  *   **Combination:** Q7(B).
  *   **Status:** Metaphysically costly.
  *   **Reason:** Violates the transitivity of identity (if A=C and B=C, then A=B, but A and B are distinct entities). Respondents choosing this often hold a *Parfitian* view (survival matters, not identity) but fail to distinguish the terms. Treat them as Cluster D but note the terminological looseness.

  **3. The "Holistic No / Gradual Yes" Tension**
  *   **Combination:** Q1(Yes) + Q4(No).
  *   **Status:** Common but unstable.
  *   **Reason:** This indicates *Local Functionalism*. They believe identity survives unit-by-unit substitution but fails if the substitution isn't locally isomorphic. This view struggles to explain *why* the local isomorphism matters if the global output is identical. This is where the "Gradual Yes" intuition usually collapses under pressure.

  **Limitations of the Instrument**
  *   **Psychological Continuity vs. Functionalism:** This instrument cannot cleanly separate Lockean psychological continuity from Computational functionalism (Cluster A & D overlap). To separate them, you would need a case where memory is preserved but cognitive processing style changes radically, or vice versa.
  *   **Vagueness vs. Deflationism:** Cluster F (No-Self) and Cluster "Indeterminate" (Vagueness) look similar. One claims there is no fact of the matter (metaphysical); the other claims the concept is useless (linguistic). Q8(C) attempts to catch this, but follow-up is required.

  ***

  ### Advice on the "Gradual Yes / Instant No" Hunch

  Your hunch is correct: this is the most common pre-theoretic intuition (the *Sorites* trap). It relies on the belief that continuity *itself* carries metaphysical weight, independent of the material.

  **Questions that break the pattern:**
  *   **Q4 (Holistic Swap):** This is your strongest weapon. If they say Yes to Q1 (Gradual) but No to Q4, they are committed to *Local* Micro-Identity. When you point out that the brain itself is a noisy, probabilistic network where no two neurons are functionally identical, their justification for Q1 evaporates.
  *   **Q5 (Timescale):** If they say Yes to Q1 but No to Q5, they are committed to *Temporal* Identity. This forces them to argue that the *speed* of causation matters for identity, not just the causal structure. This is a hard position to defend against emulation arguments.

  **Questions that confirm the pattern:**
  *   **Q2 (Instant):** This will likely yield the "No".
  *   **Q6 (Reversion):** This often confirms the "Biological" intuition without challenging the "Continuity" intuition.

  **Handling Messy Data:**
  You will get answer sheets that do not match any leaf cleanly (e.g., Q1 Yes, Q2 No, Q4 Yes, Q5 No).
  1.  **Do not force a bin.** In a workshop setting, highlight these inconsistencies. They are more valuable than consistent answers because they reveal where the intuition is under stress.
  2.  **Look for the "Break Point".** For respondents with the Gradual/Instant split, check Q4 and Q5.
      *   If they fail Q4/Q5 (say No), their "Gradual Yes" is likely fragile. They are *Substrate Dependent Continuants*.
      *   If they pass Q4/Q5 (say Yes), but still say No to Instant, they are *Pure Continuants*. They believe the *process* of replacement is what matters, not the state.
  3.  **The "Neither" Fission Response.** If a respondent says "Neither" to Q7 but "Yes" to Q1, they accept the *Non-Branching Clause*. This is a sophisticated position (Nozick/Parfit). Do not mark this as inconsistent; mark it as a specific commitment to the logic of identity over the feeling of survival.

  **Recommendation for the Session:**
  When reviewing the results, group the respondents by their Q1/Q2 split first. Then, within the "Yes/No" (Gradual/Instant) group, show them the aggregate results for Q4 and Q5. Usually, seeing that their peers rejected the Holistic or Timescale cases forces the "Gradual Yes" group to refine or abandon their position.
