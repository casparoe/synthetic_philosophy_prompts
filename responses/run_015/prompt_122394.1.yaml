prompt: |-
  hey — I run a jokey little slideshow at the end of term for my phil bio students, and this year I want one bit that actually lands on the function debate instead of being "ha ha, teleology."

  Write me one joke — ideally a short two-hander, under 150 words of dialogue — whose punchline turns on the actual disagreement between selected-effects / etiological accounts of biological function (roughly: a trait's function is whatever it was selected for in the past) and causal-role / dispositional ones (roughly: a trait's function is whatever it currently contributes to a capacity of some system you're analysing). Millikan and Cummins are the usual name-checks if that helps you place the two sides.

  The joke should sit inside one concrete case, and I want that case to be this one: a brand-new trait that showed up via a single mutation one generation ago, so it has no selection history at all, but which is useful right now only because the environment recently changed — say a new industrial pollutant in the water and a bit of tissue that happens to sequester it. No evolutionary history, obvious current usefulness. Build the joke there; dont swap in a vestigial organ or a swamp-duplicate or a designer artifact instead.

  Hard nos:
  - no puns on "function" in the maths, programming, or office-party sense. I will boo.
  - the punchline cant just be someone saying "well, maybe functions are plural" or "depends what you mean by function" — that's a shrug, not a joke.
  - no generic nerd joke that would work just as well with any other ism pasted in. If a reader couldnt tell which account is the butt of it, it's failed.

  After the joke, give me a single JSON object and nothing else outside it (valid JSON, double quotes, escape any internal quotes):

  - "joke": the full joke text as you'd actually perform it
  - "crux": one sentence naming what the punchline exploits about the disagreement between the two accounts
  - "case": one sentence describing the concrete case it's set in, as you used it
  - "laugh_test": one sentence on what someone who slept through the function unit would think the joke is even about
  - "cheat_check": either "clean" or "cheats", plus one sentence saying why — "cheats" if the joke settles the dispute by fiat (pluralism, stipulation, "really it's both") or leans on a premise one side would reject on sight
  - "swap_test": one sentence on what the joke would have to become to target the opposite weak spot from the one your punchline leans on — i.e. either the causal-role side handing out functions to everything a system happens to do, or the etiological side refusing a function to a trait that's never been selected for
