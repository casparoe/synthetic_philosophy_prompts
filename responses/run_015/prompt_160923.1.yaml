answer: |-
  You are tracking three distinct concepts that standard bioethics often conflates: **organismic death** (for the Dead Donor Rule), **personal death** (for identity and survival), and **permanence** (for the ethics of retrieval). Your intuitions are consistent within each track but clash when you try to force them into a single definition of "death." The discomfort you feel with the hypothermic replacement case arises because you are toggling between a biological substrate view (which suggests death) and a psychological continuity view (which suggests survival).

  Here are three principles that isolate these tracks. Each is stated precisely, tested against your verdicts, and assessed for its cost.

  ### 1. The Permanence of Vital Functions Principle
  **Principle:** An organism is dead when its spontaneous circulation and respiration have ceased permanently, meaning they will not resume spontaneously and will not be restored by any intervention.

  *   **Motivation:** This clause distinguishes your DCD donor (#4) from the hypothermic surgery patient (#5). Both lack circulation; the difference is not physiological capacity but the *decision* to restore it.
  *   **Verdicts you must abandon:**
      *   **Whole-Brain Death (#1):** If the heart is beating (even if ventilator-dependent), this principle declares the patient *alive*. You must reject brain death as a standalone criterion or treat it as a proxy for permanent circulatory cessation.
      *   **Pregnant Woman (#6):** If her heart is beating and hormones are regulated (even artificially), she is biologically alive by this metric. You must call her a living organism maintained for fetal benefit, not a corpse.
  *   **Verdict on Hypothermic Replacement:** **Survival.** Circulation is restored; the cessation was never permanent. The substrate change is irrelevant to this biological metric.
  *   **Further Distinguishing Case:** *The ECMO Paradox.* A patient with a completely destroyed heart and lungs is placed on permanent ECMO (artificial heart/lung) and lives for years.
      *   *Verdict:* Alive (functions are restored/maintained).
      *   *Contrast:* A Biological Integration view might call this dead (no internal integration); a Personhood view calls this alive.
  *   **Honest Note:** The "fudge" is in the word *permanently*. It makes death dependent on the intentions of medical staff rather than the state of the patient. If the surgeon changes their mind during the DCD wait time, the patient magically transitions from dead to alive.

  ### 2. The Loss of Organismic Integration Principle
  **Principle:** An organism is dead when it loses the capacity to function as a unified whole, such that artificial support can maintain cellular life but cannot restore the body's intrinsic integrative unity.

  *   **Motivation:** This captures your Whole-Brain (#1) and PVS (#2) distinction. The brain-dead body lacks integration (hence hormonal collapse without supplements); the PVS body retains somatic integration (breathing, sleep cycles). It also justifies NRP (#7): you can perfuse parts (abdomen) because the *whole* is already dead.
  *   **Verdicts you must abandon:**
      *   **DCD Donor (#4):** Integration does not vanish the moment the heart stops; it degrades over minutes. Declaring death after a "short wait" is a legal fiction; biologically, integration is fading, not gone.
      *   **Pregnant Woman (#6):** This is the hardest hit. If her body is gestating a fetus, regulating temperature, and healing wounds, she is functioning as an integrated whole. To call her dead, you must argue that "integration" requires *brain-mediated* unity specifically, not just somatic coherence.
  *   **Verdict on Hypothermic Replacement:** **Survival.** The organism's integrative capacity is paused (hypothermia) but not lost; the substrate swap is irrelevant so long as the new substrate integrates with the body.
  *   **Further Distinguishing Case:** *The Long-Term Somatic Support.* A brain-dead patient is maintained on ventilation and hormones for months without organ retrieval.
      *   *Verdict:* Dead (by principle), but looks biologically alive (grows hair, heals wounds, gestates).
      *   *Contrast:* The Permanence Principle calls this Alive (circulation is permanent).
  *   **Honest Note:** The "fudge" is defining "integrated whole." There is no bright line between a body that integrates itself and a body that is integrated by a machine. You are relying on a metaphysical claim about the brain's unique role as the "orchestrator" that is harder to prove physiologically than you might want.

  ### 3. The Psychological Continuity Principle
  **Principle:** A person is dead when the psychological continuity that constitutes their identity is irreversibly broken, regardless of the state of the biological organism.

  *   **Motivation:** This explains your Ship of Theseus intuitions (#8 vs #9). Gradual replacement preserves continuity; scanning and destroying breaks it. It also explains why PVS (#2) feels like "something has gone out" even if the organism lives.
  *   **Verdicts you must abandon:**
      *   **PVS (#2):** If consciousness is gone permanently, the *person* is dead. You must distinguish between "organism alive" and "person dead."
      *   **DCD/Brain Death (#1, #4):** These become irrelevant to *personal* death. A brain-dead patient is personally dead; a DCD patient is personally dead only if consciousness is lost (which follows circulation quickly).
  *   **Verdict on Hypothermic Replacement:** **Survival.** Psychological continuity is preserved (same memories, projects, character). The instant nature of the swap does not break the chain of consciousness any more than deep sleep does.
  *   **Further Distinguishing Case:** *The Teletransporter.* A person is scanned, destroyed, and an atom-for-atom replica is printed elsewhere with the same memories.
      *   *Verdict:* Death (original destroyed, continuity broken physically).
      *   *Contrast:* If you accept the Hypothermic Replacement as survival, you must explain why physical continuity of the *brain* matters more than functional continuity of the *mind*.
  *   **Honest Note:** The "fudge" is that this principle defines *personhood*, not *death* in the legal/medical sense required for the Dead Donor Rule. If you adopt this for transplantation, you permit harvesting from PVS patients (personally dead) which violates current law and the "organism" requirement of the DDR.

  ### Synthesis: Where the Dead Donor Rule Lives
  You are right to suspect no single principle fits all verdicts because you are answering two different questions: "When can we take organs?" (Organism) and "When does the patient cease to exist?" (Person).

  **Recommendation:** Adopt a **Dual-Criterion View**.
  1.  **For Transplantation (DDR):** Use the **Loss of Organismic Integration Principle**. It best justifies Brain Death (#1) and NRP (#7) without requiring the "intention-dependent" fudge of the Permanence Principle. It treats the Pregnant Woman (#6) as a borderline case where somatic integration is artificially maintained, permitting a pragmatic declaration of death based on the loss of *brain-mediated* integration.
  2.  **For Identity (Your Paper's Core):** Use the **Psychological Continuity Principle**. This resolves the Hypothermic Replacement case: it is **Survival**. The hesitation you feel comes from conflating the *vehicle* (neurons) with the *passenger* (psychology). If gradual swap is survival, instant swap must be too, unless you posit a magical property of biological matter.

  **Practice Implications:**
  *   **What stays the same:** The Dead Donor Rule remains tied to biological death (Integration), not personal death. You cannot harvest from PVS patients, even if the "person" is gone, because the *organism* is integrated and the law requires organismic death.
  *   **What changes:** You must admit that DCD (#4) is a pragmatic convention, not a biological fact. The "short wait" is not when death *happens*, but when we decide resuscitation *won't happen*. Tell the surgeon: "We are not declaring death based on irreversibility; we are declaring it based on permanence. You are not killing the donor by taking organs; you are respecting the permanence of their cessation."

  **The Trap to Avoid:**
  In your paper, do not try to solve the Hypothermic Replacement case using the Dead Donor Rule criteria. That case is about *personal identity*, not *organ viability*. If you argue the patient "died" during the swap, you undermine the ethics of the surgery (why operate on a corpse?). If you argue they "survived," you must explain why the Upload (#9) dies. The cleanest cut is: **Biological continuity preserves the organism; Psychological continuity preserves the person.** The hypothermic patient keeps both. The Upload keeps neither (biological continuity is broken). The DCD donor loses the organism; the PVS patient loses the person. Keep these lanes separate, and your verdicts will hold.
