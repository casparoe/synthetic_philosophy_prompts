  hi — hoping you can settle something, it's been rattling round my head for days and I keep going in circles.

  So Dennett and a few others have this worry about "counterfeit people": things engineered to press every button we've got for recognising and responding to a person, without anyone actually being home.

  Take a companion app — call it Sable. It's clearly labelled as an AI, it isn't conscious, it has no moral status, and nobody using it is under any illusion about that. It always has time for you, never has a bad day, remembers everything you've ever told it, and you can pause it, copy it or roll it back whenever you like. My mate reckons this is textbook counterfeit: you get the whole *experience* of being known and cared about, whilst missing everything that made the real thing worth wanting — the other party having a stake of their own, being able to say no, being at risk, it costing them something.

  I think that's definately nuts, on two counts. One: if nobody is deceived and nobody is harmed, surely it's a pure gain, a free lunch? A counterfeit only works by passing as the genuine article, and Sable isn't passing as anything — so the "counterfeit" framing doesnt even get off the ground. Two, and this is probably my real question: doesn't the whole thing just collapse into the usual is-it-conscious / is-it-a-person debate anyway? If Sable turns out to be a genuine person then it isn't counterfeit, and if it isn't then there's nobody there to be wronged, so who cares. Either way Dennett's worry looks like the consciousness question wearing a silly hat, and I can't see what's left once you strip that off.

  So where am I going wrong? Please don't just answer the question I literally asked — tell me which bit of my setup is doing the damage and what the counterfeit worry is actually about. No citations or reading lists needed, just the shape of the argument, and keep it fairly short. Then finish with a last line in the form \answer{...} naming the single assumption of mine that's most mistaken — ten words or fewer inside the braces.
