answer: |-
  ### Part 1: The Logical Space

  To map the territory before building the quiz, we need four independent axes. These are not theories yet; they are the dimensions along which any theory of letterform identity must take a stand. Each is phrased as a concrete question about a glyph scenario.

  1.  **The Isolation Question:** If you take a glyph out of its word and remove the font context, does it keep its name?
      *   *Yes:* Identity is intrinsic to the mark.
      *   *No:* Identity is extrinsic (dependent on context).
  2.  **The Authority Question:** If the designer labels a shape "a" but every reader calls it "u", who is right?
      *   *Designer:* Identity is imposed from the top down (Intent/Convention).
      *   *Reader:* Identity is recognized from the bottom up (Perception/Shape).
  3.  **The Continuity Question:** If a glyph slowly smudges from looking like an "a" to looking like an "o", is there a specific line where it switches?
      *   *Yes:* Categories are sharp (Geometric/Structural).
      *   *No:* Categories are fuzzy (Prototype/Cluster).
  4.  **The Lineage Question:** If a glyph is a perfect visual copy of an "a" but has no historical connection to the alphabet (e.g., a random stain), is it an "a"?
      *   *Yes:* Identity is visual/functional.
      *   *No:* Identity is historical/causal.

  **The Matrix of Combinations:**
  Theoretically, these binary choices create 16 cells ($2^4$).
  *   **Occupied:** Most combinations correspond to the standard theories (e.g., Intrinsic + Reader + Sharp + Visual = Geometric).
  *   **Incoherent:** *Extrinsic + Designer + Sharp + Historical.* If identity depends on context (Extrinsic), the Designer's intent for a single glyph (Designer) cannot define it sharply without reference to that context.
  *   **Unattractive:** *Intrinsic + Reader + Sharp + Historical.* If the Reader decides based on the mark (Intrinsic/Reader), requiring a historical pedigree (Historical) makes the visual recognition irrelevant.
  *   **Unexplored:** *Extrinsic + Reader + Fuzzy + Visual.* A purely contextual, perception-based fuzzy logic model that ignores history and intent. (This is where modern neural net context models live, but rarely as a philosophical stance).

  ---

  ### Part 2: The Decision Tree (The Quiz)

  *Instructions for Beta Testers: Answer based on your gut reaction to the image described. Do not overthink the theory.*

  **Q1.** Look at this glyph: it reads clearly as **a** inside the word "cat", but if you show it alone, everyone calls it **u**. Is it an **a**?
  *   **Yes:** Go to Q2 (Context is primary).
  *   **No:** Go to Q3 (Shape is primary).

  **Q2.** (Context Branch) Look at two identical glyphs. One is in a font file labeled "a", the other is a random stain on a wall. Are they the same letter?
  *   **Yes:** Go to Q8 (Convention).
  *   **No:** Go to Q9 (Systemic Role).

  **Q3.** (Shape Branch) Look at a single-story **a** and a double-story **a**. Are they the same letter?
  *   **Yes:** Go to Q4 (Fuzzy/Prototype).
  *   **No:** Go to Q5 (Strict/Geometric).

  **Q4.** Look at a "rogue" grid output: it satisfies every stroke rule for **a** in your code, but no human reads it as **a**. Is it an **a**?
  *   **Yes:** Go to Q6 (Rules/Structure).
  *   **No:** Go to Q7 (Perception).

  **Q5.** Look at a Cyrillic **a** and a Latin **a**. They are pixel-identical. Are they the same letterform?
  *   **Yes:** Leaf A (Geometric Invariant).
  *   **No:** Leaf B (Structural Contrast).

  **Q6.** Look at a blackletter **a** that resembles its font-mate **o** more than a sans-serif **a**. Is it still an **a**?
  *   **Yes:** Leaf C (Exemplar/Family).
  *   **No:** Leaf D (Cross-Font Shape).

  **Q7.** Look at an **a** drawn from scratch yesterday versus one from a chain of redrawings back to a manuscript. Does the chain matter?
  *   **Yes:** Leaf E (Causal-Historical).
  *   **No:** Leaf F (Perceptual Schema).

  **Q8.** Look at a logotype **a** that is simultaneously a drawing of an apple. Is the apple drawing the letter?
  *   **Yes:** Leaf G (Designer Intention).
  *   **No:** Leaf H (Deflationary Cluster).

  **Q9.** Look at an **a** on a page where the ink has smudged into an **o**. When did it stop being an **a**?
  *   **At the exact midpoint:** Leaf I (Sharp Boundary).
  *   **There is no exact point:** Leaf J (Fuzzy Context).

  *(Note: To meet the 7-9 leaf constraint, some paths converge in the final mapping below.)*

  ---

  ### Part 3: The Leaves (Positions & Implementability)

  Here are the resulting positions mapped from the tree logic, including the required theoretical stances.

  **1. Geometric Invariant**
  *   **Position:** Identity is a set of necessary and sufficient visual features.
  *   **Awkward Commitment:** It commits you to saying the single-story and double-story **a** are different letters.
  *   **Implementability:** **Code.** Check for topological invariants (e.g., loop closure, stem count) via SVG path analysis.

  **2. Structural Contrast**
  *   **Position:** Identity is defined by difference from other glyphs in the same system.
  *   **Awkward Commitment:** It commits you to saying a shape with no other letters to contrast against has no name.
  *   **Implementability:** **Code.** Compute distance metrics against all other glyphs in the generated set; reject if too close to 'o' or 'u'.

  **3. Prototype**
  *   **Position:** Identity is a gradient distance from a "best example" center.
  *   **Awkward Commitment:** It commits you to saying there is a "best" **a** that all others fail to match.
  *   **Implementability:** **Code.** Calculate Euclidean distance from the glyph vector to the font's centroid vector.

  **4. Perceptual Schema**
  *   **Position:** Identity is determined by the human visual system's motor routines.
  *   **Awkward Commitment:** It commits you to saying a perfectly drawn **a** is a **u** if the reader has a specific visual impairment.
  *   **Implementability:** **Ask Human.** Requires training a classifier on human labeled data; cannot be derived from glyph geometry alone.

  **5. Causal-Historical**
  *   **Position:** Identity is a chain of copying events going back to an origin.
  *   **Awkward Commitment:** It commits you to saying a perfect forgery of an **a** is not an **a**.
  *   **Implementability:** **Ask Human.** Requires metadata/provenance tracking outside the glyph data.

  **6. Designer Intention**
  *   **Position:** Identity is fixed by the label assigned at creation.
  *   **Awkward Commitment:** It commits you to saying a shape is an **a** even if every human on earth reads it as an **o**.
  *   **Implementability:** **Code.** Read the Unicode slot or metadata tag assigned during generation.

  **7. Deflationary Cluster**
  *   **Position:** There is no essence; "a" is just a word we use for things that share overlapping similarities.
  *   **Awkward Commitment:** It commits you to saying there is no fact of the matter, only useful ways of talking.
  *   **Implementability:** **Ask Human.** You cannot code a check for "no essence"; you must rely on user acceptance testing.

  **8. Contextual/Word-Level**
  *   **Position:** Identity is constituted by the surrounding word context, not the glyph alone.
  *   **Awkward Commitment:** It commits you to saying the glyph has no name until you put it in a word.
  *   **Implementability:** **Code.** Use an n-gram or language model to validate the glyph's slot in a string; reject isolated glyphs.

  **9. Exemplar**
  *   **Position:** Identity is recognition by similarity to stored memories of specific past instances.
  *   **Awkward Commitment:** It commits you to needing a database of every **a** you've ever seen to recognize a new one.
  *   **Implementability:** **Code.** K-Nearest Neighbors algorithm against a large dataset of known valid glyphs.

  ---

  ### Part 4: Indistinguishable Pairs & Implementation Notes

  **Pairs the Tree Cannot Separate:**
  1.  **Prototype vs. Exemplar:** In practice, a "distance to centroid" (Prototype) and "distance to nearest neighbors" (Exemplar) often yield the same acceptance/rejection decisions for standard fonts. The tree separates them philosophically (one posits an abstract average, the other a concrete memory), but your code might not distinguish them without explicit architecture choices.
  2.  **Perceptual Schema vs. Contextual:** If a reader's perception relies heavily on word context (which it does), a "Perceptual" model and a "Contextual" model will agree on the "in-word **a** / alone **u**" case. Separating them requires isolating the viewer from context, which contradicts the natural reading process.

  **Implementation Reality Check:**
