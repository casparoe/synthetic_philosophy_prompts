  *   **Mechanism 1 (The Retroactive Fee):** The UDT agent pays the $2 policy window fee *after* being seated and seeing the menu says "Stiffed." When told the simulation is already done, they insist the fee is required by the policy selected *ex-ante*, regardless of the current observation. (Highlights: Ignoring observation, policy fidelity).
  *   **Mechanism 2 (The Blind Menu):** The UDT agent places a napkin over the menu footer before ordering. When asked why, they explain they cannot condition their action on the prediction, only on the policy selected before seeing it. (Highlights: No conditioning, policy as input-output map).
  *   **Mechanism 3 (The Virtual Contract):** The UDT agent pays the bill despite the "Stiffed" prediction. When challenged, they claim they are fulfilling a contract signed at the "veil of ignorance" (metaphorically located at the coat check), which binds them even in branches where the prediction failed. (Highlights: Precommitment benefits, cross-branch optimization).

  **Selection:** Mechanism 3 is the strongest. It allows the CDT and EDT to react naturally to the menu (exploiting vs. agonizing over the evidence), while the UDT agent's action looks locally irrational (paying when the prediction is already bad) but globally consistent. It incorporates the "Policy Window/Coat Check" geography as a metaphor for the prior, satisfying the setting constraints without requiring a physically useless transaction like Mechanism 1.

  ***

  A causal decision theorist, an evidential decision theorist, and an updateless decision theorist walk into *Ensemble* on a Thursday. They're seated, and the menu footer reads: *Your simulation stiffed us.*

  The causal theorist immediately orders the lobster. "The prediction is in the past. My action can't change it. Free dinner."

  The evidential theorist orders water and stares at the footer. "If I pay, I'm good evidence, but the menu says I'm bad evidence. If I don't pay, I'm bad evidence confirming the menu. I'll just have the water."

  The updateless theorist pays the full bill.

  The waiter stops him. "Sir, the menu says your simulation stiffed us. You're already seated. Paying changes nothing."

  The updateless theorist hands over the credit card. "I'm not optimizing for this table. I'm optimizing for the policy I selected at the coat check."

  The waiter says, "You didn't stop at the coat check."

  The updateless theorist says, "Exactly. I decided what to do before I knew whether I'd stop there. And the policy says: pay the bill."

  ***

  **Notes on Faithfulness:**
  This joke captures the core UDT mechanic of selecting a policy $\pi$ to maximize expected utility relative to the prior $P$, rather than conditioning on the observation $o$ (the menu footer) before choosing an action. The UDT agent pays despite the "Stiffed" evidence because the policy "Always Pay" yields higher utility across the ensemble of possible menus than "Pay iff Menu says Paid," even though in this specific branch the benefit (seating) was already granted. The reference to the coat check serves as a spatial metaphor for the "veil of ignorance" where the policy is chosen prior to observing the specific situation.
