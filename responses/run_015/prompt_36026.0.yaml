          3.  Left hemisphere (LH) has an "interpreter" that confabulates.
          4.  Gazzaniga concludes interpreters confabulate in healthy brains too.
          5.  Nagel agreed there are literally two streams of experience.
          6.  **Conclusion:** Unity of consciousness is an illusion; no single self, just a narrating LH.
      *   **User's Doubts:**
