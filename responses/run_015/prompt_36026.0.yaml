          *   *Everyday Life:* Address the "normal behavior" objection. It's valid. The disconnection is latent.
      *   *The Philosophical Leap:* Analyze the move from "split brain shows disunity" to "all brains are disunified." This is the "argument from pathology." Just because a car breaks into two parts doesn't mean it was never one car.
