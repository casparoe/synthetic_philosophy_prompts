      *(Refining the Nagel point)*: Nagel's view is that the description "two streams of consciousness" is a way of speaking that reveals the inadequacy of our concepts. He doesn't necessarily endorse it as the literal truth without reservation. The book makes it sound like he agrees with the empirical conclusion. I need to clarify that distinction.

      *(Refining the "Unity is Illusion" point)*: This is the "Argument from Dissociation." Just because function X can be dissociated from Y doesn't mean X is an illusion. It means X is composite. The leap to "no single self" is a metaphysical claim not warranted by the physiological data alone.

