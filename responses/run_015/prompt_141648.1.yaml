  # Changelog

  **Maintainer:** @fixed_point_dev

  ## [4.2.0] - 2023-11-15
  ### Changed
  - Updated tournament runner to sort entrants by available proof-search budget before pairing.
  - README landing page text remains unchanged ("Defection Refuted") despite new stratification logic.
  - `LöbBot` now defaults to Defect if opponent verification exceeds 80% of allocated compute budget.

  ## [4.0.0] - 2023-05-10
  ### Added
  - `AuditBot`: Refuses to cooperate with any agent whose source code cannot be statically analyzed within 50ms.
  - Warning logs when cooperation relies on deterministic execution environments not present in production.

  ### Changed
  - Cooperation rate dropped 14% following security patch. `FairBot` now defects against unconditional cooperators to prevent exploitation by random noise.
  - Hardening measures ensure bots only cooperate with strictly fewer opponents than previous versions.

  ## [3.5.0] - 2022-12-01
  ### Fixed
  - Resolved issue where `PrudentBot` entered infinite recursion when paired with itself.
  - Added timeout handler. If proof search does not terminate, bot defects. This technically violates the logical model but prevents server hangs.

  ## [3.0.0] - 2022-06-20
  ### Changed
  - Removed support for binary-only entrants. Transparency is now mandatory for cooperation.
  - Agents submitting obfuscated code are automatically classified as Defectors.

  ## [2.0.0] - 2021-09-15
  ### Added
  - `proof_budget` parameter. Agents now track computational cost of verifying opponent proofs.
  - Resource gating: Agents with higher compute budgets cooperate with each other. Agents with insufficient budget to verify high-complexity proofs are defected against by high-budget agents.

  ### Deprecated
  - The assumption that logical equivalence implies mutual cooperation regardless of hardware constraints.

  ## [1.2.0] - 2021-03-10
  ### Fixed
  - Stack overflow in `LöbBot` vs `LöbBot` matchups.
  - Introduced arbitrary cutoff for proof length. Proofs exceeding 10,000 steps are treated as invalid.

  ## [0.1.0] - 2020-01-01
  ### Added
  - Initial release.
  - Implements `FairBot` and `LöbBot`.
  - Claims Prisoner's Dilemma is dissolved via modal logic.

  ---

  ## Known Issues

  - **Source Code Access:** Cooperation mechanisms fail completely if opponents are treated as black boxes. The library assumes full read-access to opponent source, a condition rarely met outside this tournament environment.
  - **Determinism:** Bots assume opponent execution is deterministic and verifiable. Non-deterministic hardware or hidden state invalidates all proof guarantees.
  - **Compute Stratification:** As of v2.0, cooperation is correlated with hardware expenditure. Agents with larger proof-search budgets form a cooperative clique; others are excluded.
  - **Timeouts:** Logical cooperation requires infinite time for certain proofs. The implemented timeouts force defection in theoretically cooperative scenarios.

  ## FAQ

  **Q: Does this library solve the Prisoner's Dilemma?**
  A: It solves the Prisoner's Dilemma under the specific constraints that both parties share source code, run on verifiable deterministic hardware, and possess sufficient compute to verify each other's proofs within the timeout window.

  **Q: Why do high-budget bots defect against low-budget bots?**
  A: High-budget bots require longer proofs for safety guarantees. Low-budget bots timeout while attempting to verify these proofs and defect. The high-budget bot reciprocates defection. This is functioning as intended.

  **Q: Can I use this for real-world negotiation?**
  A: No. Real-world counterparts rarely submit executable source code for inspection. Removing the source code access requirement reduces cooperation rates to baseline Nash equilibrium levels.

  **Q: The README says defection is refuted. Why do I see so much defection?**
  A: The README refers to the theoretical model in v0.1. Subsequent patches address stability, security, and resource constraints. The theoretical model assumes unlimited compute and perfect transparency. The library assumes AWS pricing and security audits.
