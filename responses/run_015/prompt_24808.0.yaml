answer: |-
  Dear friend, I have sat with your position on Parfit's hitchhiker and the resulting claim of rational irrationality, and while I admire the boldness of trying to fracture the coherence of rationality to save cooperation, I think you are building on a fault line that will eventually swallow the view. I will not fence-sit. I believe the most decisive objection to your view is that it conflates a specific decision theory with rationality itself, and the most fatal extension is the one you make into belief. If you hold that it is rational to cultivate a belief you know to be false, you have abandoned the concept of belief entirely, and that collapse undermines the agency required to make your strategic payoff work in the first place.

  Let us start with the action version, because this is where your intuition feels strongest. You argue that it is rational to pay the driver even when you know you could defect without consequence, because being the sort of person who pays yields better long-term outcomes. You call this rational irrationality, implying a tension between what is rational to do and what is rational to be. The first and perhaps most damaging objection here is that this is not a discovery about rationality but a artifact of using Causal Decision Theory as your baseline. If you adopt Evidential Decision Theory or Timeless Decision Theory, the act of paying is straightforwardly rational in the moment because your choice is evidence of, or logically linked to, the type of agent you are, which determines whether you were picked up. By calling this rational irrationality, you are essentially saying that because Causal Decision Theory says don't pay, but you should pay, rationality is broken. But the cleaner move is to say Causal Decision Theory is incomplete. This objection is decisive because it dissolves your paradox without requiring us to accept that rationality is incoherent. If you insist on keeping Causal Decision Theory as the definition of rationality, then you are indeed forced into your view, but you have simply stipulated a definition that guarantees a conflict where none need exist. You are not finding a crack in rationality; you are finding a crack in a specific model of calculation.

  Even if you resist that and insist the tension is real, the second objection concerns the two-level retreat you mentioned. A defender of standard rationality will argue that the rationality belongs to the disposition formation, not the act. It is rational to train yourself to be a promise-keeper, so when the moment comes to pay, you pay automatically. There is no conflict in the moment because you are not deliberating; you are executing a program you rationally installed. This undermines your claim that you are acting against your best judgment. If you have successfully cultivated the disposition, your best judgment in the moment is aligned with the disposition, or you bypass judgment entirely. If you are still deliberating and choosing to pay against your judgment, you haven't successfully cultivated the disposition. This means your view only works for agents who are imperfectly self-controlled, which makes it a theory of second-best rationality, not a fundamental feature of rationality itself. This is a strong objection because it suggests your phenomenon is just a description of how imperfect agents manage to cooperate, not a new normative truth.

  However, the place where I think your view is genuinely exposed and likely fatal is the belief extension. You ask if it can be rational to cultivate a belief you know to be false because holding it makes you a better cooperator. This is where the view risks collapsing into incoherence. Belief, by its very nature, aims at truth. To believe p is to hold p as true. If you cultivate a belief in p while knowing not-p is the case, you are not believing; you are engaging in self-deception or pretense. A self-deceived agent is not a strategically superior agent; they are vulnerable to exploitation because their map of the world is distorted. If you believe God is watching you punish defectors when you know He is not, you might cooperate more, but you are also likely to make other errors based on that false model. More importantly, you cannot voluntarily believe what you know to be false. This is doxastic involuntarism. You can act as if you believe, you can join the church, you can recite the creed, but you cannot force the cognitive state of belief while retaining the knowledge of its falsehood. If you claim you can, you are using belief to mean something like acceptance or pretense, which strips the term of its philosophical weight. This is fatal because if the belief version fails, the analogy supporting the action version weakens. The action version relies on the idea that you can be a type of agent who doesn't defect. But if you cannot genuinely believe the norms that sustain that type, the disposition becomes fragile.

  This leads directly to your question about predictive power. You ask what this view predicts that a plain old be a good person account does not. The honest answer is very little, which is a significant weakness. Virtue ethics tells you to be honest because honesty is a virtue. Timeless Decision Theory tells you to pay because it solves the coordination problem. Your view tells you to be irrationally honest because it is strategically rational to be irrational. The outcome is identical in every case: you pay the driver. The only difference is the internal justification. If a theory predicts the same behavior as its rivals but posits a more complex internal mechanism involving fractured rationality, it violates parsimony. Unless you can point to a scenario where a virtuous agent or a timeless decision theorist would defect but your rational irrationalist would cooperate, you have not added explanatory power. You have added a label. I suspect you cannot find such a case, because any case where cooperation pays is already captured by disposition-based accounts, and any case where it doesn't pay is not rational by anyone's lights.

  Finally, you asked about insulation and falsifiability. This is where the view becomes dangerous. If every instance of self-sacrifice can be retroactively justified as building a disposition for a future hypothetical game, the theory becomes unfalsifiable. Why did you give money to the beggar? To build a generous disposition. Why did you not steal the wallet? To maintain a honest disposition. There is no act that cannot be framed as disposition-building. To avoid this, you would need to specify when it is not rational to be irrational. If you cannot specify the limits, the theory explains everything and therefore nothing. This is a problem because it turns rationality into a post-hoc story we tell about our instincts rather than a guide for action. A theory of rationality should help you decide what to do, not just justify what you did. If your view requires you to already be the sort of person who sees the strategic value in irrationality to work, it cannot guide you into becoming that person.

  So here is my definite line. The action version of your claim is merely awkward because it can be absorbed into Timeless Decision Theory or Rule Utilitarianism without calling it irrationality. It is not a new phenomenon; it is a renaming of existing solutions to Newcomb-like problems. The belief version, however, is fatal. It requires a psychological impossibility and undermines the truth-aiming nature of belief, which destroys the agent's reliability. The view is exposed because it lacks predictive power over virtue ethics and risks unfalsifiability by allowing any sacrifice to be rationalized as disposition-building. You should keep the insight that dispositions matter, but drop the claim that rationality is incoherent. Rationality is coherent if you update your decision theory, and belief is off-limits for pragmatic manipulation if you want to remain a truthful agent. Keep the hitchhiker, pay the fare, but call it rationality simpliciter, or call it virtue, but do not call it rational irrationality, for that path leads to a mind at war with itself that cannot reliably win the games you hope it will.
