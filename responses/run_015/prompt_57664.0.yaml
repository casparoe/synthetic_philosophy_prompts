  ### The Principle of Invariant Mechanism

  **Core Statement:**
  Predictive confidence is licensed only by the identification of a **mechanism** that is **invariant** to the shift between training and deployment contexts. Where a mechanism cannot be identified, confidence is limited to the **falsifiability** of the claim (the ability to enumerate failure modes).

