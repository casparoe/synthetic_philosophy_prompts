  2.  **The Invariance Requirement:**
      *   *Clause:* A pattern licenses prediction only if it corresponds to a causal relationship that persists under interventions (time, population, service boundary). Correlation without invariance is spurious.
      *   *Tied to Case:* **Case 1, Case 4, Case 5, Case 7.** This explains why the physics law (symmetry = invariance) beats the ML classifier (correlation = fragile), and why the churn feature failed (it tracked a transient correlate, not a cause).

