answer: |-
  ### I. Derived Rules of the Board

  To maintain coherence with the five precedents, the Board's reasoning should rest on three operational rules. These rules reconcile the distinctions between personal and collective injury, the necessity of a traceable benefit, and the conditions for discharge.

  **1. The Rule of Transmissible Interest**
  *Claims for bodily or purely personal injury expire with the victim; claims for proprietary or collective political injury transmit to the recognized successor community.*
  *   **Fit:** This explains why adult children in the sterilization case (Case 1) were dismissed (personal injury), while the descendant community in the land cession (Case 2) and the community trust in the urban renewal case (Case 3) were awarded (property/collective injury). It aligns with the school funding case (Case 5), which treated the district as a collective entity.

  **2. The Rule of Traceable Advantage**
  *A remedy requires an identifiable, persisting advantage derived from the injustice. If the wrongdoer is extinct, a present holder of that advantage is required for liability; if the wrongdoer persists (the Province), the advantage dictates the form and measure of the remedy.*
  *   **Fit:** This explains the dismissal in the private company case (Case 4) ("no present holder of the advantage"). It distinguishes the annuity in the land cession case (Case 2, where the Province still held the land) from the lump sum in the urban renewal case (Case 3, where the land was privately owned and the specific asset lost). It supports the school funding case (Case 5), where the "advantage" was the provincial budget saved by underfunding, which persists in the consolidated revenue fund.

  **3. The Rule of Specific Discharge**
  *A claim is not discharged by general benefits of citizenship or unilateral institutional gestures. Discharge requires a specific remedy the claimant community is free to refuse.*
  *   **Fit:** This is the explicit holding of the school funding case (Case 5). It explains why subsequent equalization grants did not extinguish the claim. It is consistent with Case 1 and Case 3, where remedies were structured as awards rather than set-offs against other services.

  ---

  ### II. Application to the New Case

  Applying these rules to the three requests from the Council:

  **1. The Forty-Hectare Parcel (Burial Ground)**
  *   **Prediction:** **Awarded.**
  *   **Reasoning:** Under the **Rule of Transmissible Interest**, the burial ground represents a proprietary and collective cultural interest, not a personal one, so the claim survives. Under the **Rule of Traceable Advantage**, the specific asset (the land) persists and is identifiable within the original grant. Case 2 (land held by Province) is the closest guide: where the specific land remains identifiable, restitution in kind is "apt."

  **2. The Perpetual Annuity**
  *   **Prediction:** **Awarded.**
  *   **Reasoning:** The land grant functions as an endowment generating rent (7% of budget). This is a persisting advantage under the **Rule of Traceable Advantage**. Since the asset is income-generating and held by a legal person (the College), an annuity sized by the yield (or the community's present condition, per Case 2) is the coherent remedy. The College's status as a "beneficiary" rather than "successor" is irrelevant under Case 4, which implies liability attaches to the *holder of the advantage*, regardless of how they acquired it.

  **3. The Per Capita Payments**
  *   **Prediction:** **Dismissed.**
  *   **Reasoning:** Under the **Rule of Transmissible Interest**, this claim treats the injury as a sum of personal claims. Case 2 explicitly rejected this ("a people's claim is not a sum of persons' claims"). Case 3 awarded a lump sum to a trust, not individuals. Case 1 allowed per capita payments only for *living survivors* of bodily harm. Since the Council itself regards these payments as divisive and refuses them, awarding them would also violate the **Rule of Specific Discharge** (imposing a remedy the claimant refuses).

  ---

  ### III. Recommendation and Principles

  **Recommendation**
  The Board should **award the parcel and the annuity** to the Council-controlled trust, and **dismiss the per capita claim**.

  **Closest Analog**
  **Case 2 (1879 Land Cession)** is the controlling precedent.
  *   **Why:** Both involve Indigenous land seized under duress, where the asset (or its value) persists, and the claimant is a recognized community council. Both involve a "collective political injury" rather than individual bodily harm. Case 2 established that remedies should be sized by present condition and paid to the council, not individuals.

  **Principles Adopted**
  By following this recommendation, the Board commits to the following principles:

  1.  **On Institutional Identity:** An unbroken institutional identity *does not matter* when the institution is a mere beneficiary. If the asset exists, the claim attaches to it. The College's innocence is irrelevant because Case 4 established that the *presence of an advantage holder* is the condition for liability when the original wrongdoer is not the sole payer. Since the Province (the wrongdoer) is also present, the College's holding simply validates the *measure* (annuity vs. lump sum).
  2.  **On Refusal and Discharge:** A remedy the claimant refuses *cannot* discharge a claim. The College's scholarships and liaison office are unilateral gestures. Under Case 5, discharge requires a remedy the claimant is "free to refuse." Since the Council refuses the per capita payment and views the scholarships as insufficient, the claim remains undischarged.
  3.  **On Non-Identity:** The ancestors'-non-identity argument has *no force*. The Board has twice awarded relief (Cases 2 and 3) without any counterfactual comparison of persons. Case 2 explicitly sized the remedy by the "community's present condition," not by what would have happened had the treaty been fair. To accept the College's argument would require overturning the methodology of Case 2.

  ---

  ### IV. The Next Test Case

  To separate the rules identified above—specifically to test whether the **Rule of Transmissible Interest** (requiring a recognized council) trumps the **Rule of Traceable Advantage** (requiring only a held asset)—the Board should take the following case next:

  **The Case of the Dissolved Sect:**
  A claim by the dispersed descendants of a religious minority group whose meeting house and lands were seized by the Province in 1910 and granted to a public hospital. The hospital still holds the land and uses it for patient gardens. The religious group dissolved as a legal entity in 1950; there is no recognized council, only a loose association of descendants. They seek a lump sum to a new trust.

  **Why this case?**
  *   **It tests Rule 1 vs. Rule 2:** Case 4 dismissed a claim because no *advantage holder* existed. Case 6 (the current decision) awards because *both* a council and an advantage holder exist. This new case presents an *advantage holder* (Hospital) but *no council*.
  *   **The Stakes:** If the Board awards, it signals that **Unjust Enrichment (Rule 2)** is the primary driver of liability, and "recognized council" is merely evidentiary. If the Board dismisses, it signals that **Political Standing (Rule 1)** is the primary driver, and reparations are only for recognized political communities, not mere descendants. This distinction will define the Board's jurisdiction for the next decade.
