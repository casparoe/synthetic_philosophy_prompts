answer: |-
  Your skepticism is warranted: the film technically fails as a counterexample to Leibniz because position is a property. When the machine fires, the original stands in the box and the duplicate appears in the gallery; they are immediately discernible by location, so PII holds. The metaphysical horror isn't that they are indiscernible objects, but that they are psychologically continuous subjects diverging into distinct spatial paths. If you rewrite the machine to produce Black-style symmetry—two Angiers equidistant from the source with no external landmarks—you still face a physical breakdown of symmetry the moment they move or breathe differently. However, the film's deeper claim survives this tweak: Angier's dying speech suggests there is no fact of the matter about which successor inherits the "self" until the branching occurs. This isn't ignorance; it's ontological fission. The pre-split Angier becomes both, meaning the man who drowns is just as much Angier as the man who walks out.

  Borden's plot is the inverse: two numerically distinct substances striving for qualitative indiscernibility. They don't challenge PII because they remain spatially distinct and privately discernible to each other; they challenge social identity conventions. Pairing them reveals the film's actual thesis: identity is a performance maintained by sacrifice. Angier sacrifices uniqueness to be everywhere; Borden sacrifices unity to be everywhere. The Tesla machine is indeed a plot device with fake-philosophy paint job—it solves the logistical problem of duplication so the film can focus on the cost of living two lives. Don't teach Black's argument using the machine; teach it using the failure of the machine to actually erase spatial properties. The film knows something Black doesn't: that for conscious beings, indiscernibility is terrifying not because it breaks logic, but because it breaks the singular perspective required for survival.

