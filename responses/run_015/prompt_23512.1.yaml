      *Okay, let's write it.*

      *Word Count Check:* 5 minutes is roughly 750 words.
      *Tone Check:* Warm, witty, respectful.

      *(Final thought on the "Quiet Defense"):* The defense is that narrative history *is* the truth, not just "stories" vs "science." The toast should imply that her way of seeing the world is the one that actually works for living humans.

