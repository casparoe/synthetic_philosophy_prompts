      *   **Clause 4: The Gross Bit (Habit Drift).** Since the custom is contingent, we must price the risk of the Custom changing. Introduce a "Contingency Premium." Or better: Since safety inspections don't *cause* safety, we are reducing them to save costs, passing the risk to the Custom. Let's go with the "Ontological Stability Surcharge" and the elimination of loss prevention services because they are futile.
      *   **Clause 5: Agency/Responsibility.** Acknowledge that the author didn't write this, the readers won't read this by their own power. Disciplinary measures are merely concomitant events.
