          7.  **Post-Memo Note:** Add a short note explaining philosophical choices/distinctions for the teacher.

  2.  **Deconstruct Occasionalism for the Memo:**
      *   *Core Tenet:* Created substances (fire, cotton, humans) have no causal power. God creates the effect (burning, movement, thought) on the occasion of the created substance's presence/action.
      *   *Regularity:* God's custom (*adat Allah*) is uniform and reliable, but contingent. It could be otherwise (miracles).
      *   *Language:* Must avoid "cause," "result," "effect," "prevent," "ensure," "lead to." Use "co-occur," "coincide," "follow," "accompany," "presence of."
      *   *Liability:* If humans can't cause anything, can they be liable? The prompt says "courts have barred causal language in claims assessment." So insurance still exists, but the framing changes. It's about correlating events with divine will/custom.
      *   *The "Gross" Bit:* Habit drift. If the custom is contingent, what if God changes the custom? The company needs to insure against the *custom itself* changing. This implies charging people for the possibility that fire *stops* burning cotton, or starts burning it when it didn't before. Or, more repulsively, stopping safety measures because human action doesn't cause safety anyway. Let's go with the "Habit Drift Surcharge" or eliminating safety protocols because they are ontologically inert.
