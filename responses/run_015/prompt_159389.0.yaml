          3.  **No Strawman:** Regularity is real/reliable (God's custom), not just Humean habit. Miracles are the exception (how to handle non-burning cotton?).
          4.  **Gross/Repulsive Conclusion:** Push the logic to a "modest proposal" style edge (e.g., hedging against "habit drift," closing fire prevention, new premium).
          5.  **Employee Blame:** No employee can be credited/blamed for anything (including the author), and the memo must be okay with this.
