  **INTERNAL MEMORANDUM**

  **TO:** All Underwriting, Claims Adjustment, and Loss Prevention Personnel
  **FROM:** Elias Thorne, Senior Officer, Ontological Compliance & Risk Standardization
  **DATE:** 14th of Rajab, 1446 AH (Corporate Fiscal Q3)
  **SUBJECT:** Directive 88-B: Prohibition of Secondary Causal Attribution and Habit Drift Protocols

  **1. Linguistic Compliance in Claims Documentation**
  Effective immediately, all claims assessments must adhere to the Divine Customarity Act. Language implying created substances possess causal power is strictly prohibited. Adjusters shall not state that "fire destroyed the warehouse." Correct phrasing is: "Destruction occurred in the warehouse, coincident with the presence of combustion." Do not write that sprinklers "prevented" damage. Write: "Damage did not occur, and sprinkler activation was concomitant." We bill for risk assessment, not for altering the Divine Will. Suggesting that a human policyholder can alter the sequence of events constitutes false advertising and theological non-compliance.

  **2. Assessment of Negligence and Liability**
  Liability is no longer framed as the consequence of action. When a policyholder leaves grease near a flame, they have not "caused" the fire. They have positioned themselves within a sequence where burning is the customary outcome. However, premiums are calculated based on the statistical reliability of these sequences. A policyholder who frequently occasions destructive sequences represents a higher actuarial risk, not because their actions produce harm, but because God's Custom typically aligns destruction with their presence. Deny claims where the policyholder claims their own agency prevented a loss; only the Custom prevents loss.

  **3. Custom Deviation Events (Miracles)**
  On rare occasions, cotton may be present with fire and not burn. This is a Custom Deviation Event (CDE). Adjusters must not classify this as "luck" or "anomaly." It is a direct intervention. If a policyholder survives a blaze unburnt, do not process this as a standard non-loss. File a Form 99-Miracle. These claims are exempt from standard deductibles, as no secondary cause was involved to mitigate. However, repeated CDEs for a single client may suggest prophetic status, requiring referral to the State Theology Board before payout approval.

  **4. Habit Drift and Ontological Stability Surcharge**
  While the Custom is reliable, it is not necessary. It is contingent upon Divine Will. Therefore, the uniformity of nature carries a residual risk of "Habit Drift." It is possible that tomorrow, fire may cease to burn cotton universally, or begin to burn water. To hedge against this metaphysical volatility, a new line item, the Ontological Stability Surcharge (OSS), will be added to all premiums. This covers the risk that the Custom itself shifts unfavorably. Furthermore, as human action cannot influence the Custom, the Loss Prevention Division is hereby dissolved. Safety inspections are ontologically inert; they do not cause safety. Retaining inspectors implies they possess causal power, which is heretical and fiscally wasteful. We will instead rely entirely on the consistency of the Custom, priced via the OSS.

  **5. Authorship and Disciplinary Agency**
  I, Elias Thorne, did not write this memo. God created the text on the occasion of my typing. You, the readers, do not read this by your own power. Compliance is not something you achieve. Either the Custom will align with your compliance, or it will not. Disciplinary action for non-compliance will still occur, not because punishment causes better behavior, but because punishment is customarily conjoined with insubordination. Do not thank me for this guidance. I am not its source. Do not blame me if the OSS increases. I am merely a locus where these words appeared.

  **Circulation:** Legal, Actuarial, Underwriting, Human Resources (for concomitant filing).

  ***

  **Note for your teacher:**

  I tried to keep the metaphysics tight to al-Ghazālī rather than sliding into pure skepticism. The key distinction I focused on is that the regularity is *objective* (God's consistent habit) rather than *subjective* (Humean psychological expectation). That's why the memo treats the sequence as reliable enough to underwrite, except for miracles. I avoided temporal atomism (the idea that time is discrete instants) because it complicates the insurance logic without adding to the causal joke; occasionalism works even if time is continuous, provided God recreates the state at every moment. The "gross" bit (closing Loss Prevention) follows the logic that if secondary causes are inert, safety measures are literally useless, forcing the company to monetize the contingency of the Custom itself rather than mitigating risk. I also made sure the author disclaims agency in clause 5 to satisfy the "no blame/credit" constraint without breaking the corporate voice.
