  3.  **Drafting - Section by Section:**

      *   **Header:** Standard memo format. To, From, Date, Subject.
      *   **Opening:** State the purpose. Compliance with the "Divine Customarity Act" or similar.
      *   **Clause 1: Causal Language Prohibition.** Define the linguistic constraints. "Fire destroyed" -> "Destruction coincided with fire."
