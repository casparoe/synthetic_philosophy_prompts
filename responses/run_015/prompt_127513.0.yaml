answer: |-
  # The Valley Agency Taxonomy: A Sorting Instrument

  ## Part 1: The Logical Space (For the Facilitator)

  Before handing out the worksheet, understand the map you are navigating. We are sorting stories based on two axes: **Non-Human Agency** (how much the disaster *does*) and **Human Mediation** (how much social structure *filters* the disaster).

  There are 16 theoretical combinations of answers across the 9 nodes below. Only 8 are occupied by coherent narrative strategies.

  **The Empty Nodes (and why):**
  1.  **High Non-Human Agency + High Human Control:** Incoherent. If the volcano *decides* (agency), the humans cannot *control* the outcome. This creates a story where gods play chess with puppets who think they are moving the pieces. Unattractive for realism.
  2.  **Low Non-Human Agency + No Social Filter:** Nihilism. If the disaster is just background and class doesn't matter, death is random noise. This rarely sustains a novella; it's just a setting for a different genre (e.g., a romance that happens to be in a flood).
  3.  **Specific Swap + No Answerability + No Ventriloquy:** The "Invisible Hand." A specific force drives the plot, cannot be stopped, but is never described as acting. This usually reads as bad writing (passive voice) rather than a philosophical stance.
  4.  **High Symmetry + Low Counterfactual:** If humans and non-humans are equal actors, removing the non-human *must* change the story. If it doesn't, they weren't equal actors.

  **The Occupied Nodes (The Leaves):**
  These are the eight positions your group likely occupies. The four **Bolded** ones are your required core positions.

  ***

  ## Part 2: The Decision Tree (The Photocopy)

  **Instructions:** Read the question and the concrete case. Mark **YES** or **NO**. Follow the arrow to the next numbered question. When you hit a **LEAF**, stop and read the definition.

  **START:** *Premise: "These three novellas would be different books if the volcano hadn't erupted."*

  **1. The Reader's Counterfactual**
  *Case: The Arriving Ship (1347).* If you remove the specific bacterium from the cargo and replace it with "normal trade goods," does the *ending* of the story change fundamentally (not just the body count, but the social resolution)?
  *   **NO:** Go to **2**.
  *   **YES:** Go to **3**.

  **2. The Background Condition (Humanist Leaf)**
  *   **STOP.** You are at **LEAF A**.

  **3. The Swap Test**
  *Case: The Valley's Flood Plain (Near-Future).* If you swapped the flood for a drought, or a fire, would the *social outcome* for the families remain identical (e.g., the rich still escape, the poor still die)?
  *   **YES:** Go to **4**.
  *   **NO:** Go to **5**.

  **4. The General Force (Determinism Leaf)**
  *   **STOP.** You are at **LEAF B**.

  **5. The Lag Problem**
  *Case: The Failed Harvest (1816).* Is the cause of the disaster (the eruption) perceptible to the characters within the timeframe of the story, or does it operate on a timescale they cannot see?
  *   **INVISIBLE/UNKNOWN:** Go to **6**.
  *   **VISIBLE/KNOWN:** Go to **7**.

  **6. The Blind Mechanism (Fatalism Leaf)**
  *   **STOP.** You are at **LEAF C**.

  **7. The Answerability Condition**
  *Case: The Cholera Outbreak.* Is there a meaningful action a character can take that alters the non-human's effect (e.g., boiling water, moving fields), even if they can't stop the cause?
  *   **NO:** Go to **8**.
  *   **YES:** Go to **9**.

  **8. The Unnegotiable Wall (Strong Determinism Leaf)**
  *   **STOP.** You are at **LEAF D**.

  **9. The Social Filter**
  *Case: The Blight in the Potato Field.* When the crop fails, does survival correlate more strongly with biological luck or with social position (e.g., the landlord exporting grain while tenants starve)?
  *   **BIOLOGICAL LUCK:** Go to **10**.
  *   **SOCIAL POSITION:** Go to **11**.

  **10. The Equalizer (Tragedy Leaf)**
  *   **STOP.** You are at **LEAF E**.

  **11. The Ventriloquy Check**
  *Case: Any Disaster.* Does the narrative prose lend the non-human thing intentional verbs (e.g., "the frost *decided*," "the river *remembered*")?
  *   **NO:** Go to **12**.
  *   **YES:** Go to **13**.

  **12. The Conjunctural View (Vulnerability Leaf)**
  *   **STOP.** You are at **LEAF F**.

  **13. The Symmetry Test**
  *Case: Any Interaction.* Are human decisions (laws, prayers) and non-human events (floods, blights) described with the same grammatical weight and causal power?
  *   **NO (Humans are special):** Go to **14**.
  *   **YES (Flat Ontology):** Go to **15**.

  **14. The Animated Setting (Animist Leaf)**
  *   **STOP.** You are at **LEAF G**.

  **15. The Flat Network (Actor-Network Leaf)**
  *   **STOP.** You are at **LEAF H**.

  ***

  ## Part 3: The Leaves (Definitions & Embarrassments)

  **LEAF A: The Humanist View**
  *   **Definition:** Non-humans are conditions and occasions. The disaster is a stage upon which human character is revealed.
  *   **The Commitment:** "The plague is just a metaphor for my protagonist's grief; if the bacteria hadn't arrived, I would have used a broken engagement instead."

  **LEAF B: Strong Environmental Determinism**
  *   **Definition:** The specific type of disaster doesn't matter; the environment dictates the social outcome regardless of the mechanism.
  *   **The Commitment:** "It doesn't matter if it's flood or fire; the valley eats its people, and my characters are just meat waiting to be sorted."

  **LEAF C: Fatalism (The Blind Mechanism)**
  *   **Definition:** The cause is real but imperceptible. Characters suffer a force they cannot name, creating horror without agency.
  *   **The Commitment:** "My characters suffer a punishment they can never understand, which makes their struggle essentially decorative."

  **LEAF D: The Unnegotiable Wall**
  *   **Definition:** The cause is known, but no human action can mitigate it. Nature is an absolute monarch.
  *   **The Commitment:** "I gave my characters agency in chapter one, but the volcano vetoed it in chapter two, so their choices were lies."

  **LEAF E: The Equalizer (Tragedy)**
  *   **Definition:** The disaster is specific and negotiable, but luck overrides class. Rich and poor die alike.
  *   **The Commitment:** "I spent three hundred pages building a critique of class structure, only to have a random spore kill the Duke and the Peasant in the same sentence."

  **LEAF F: The Conjunctural View (Vulnerability)**
  *   **Definition:** The germ or drought only bites because of how the people were already arranged. Nature loads the gun; society pulls the trigger.
  *   **The Commitment:** "The earthquake didn't kill them, the building codes did, and I have to make sure the reader knows I know that."

  **LEAF G: The Animist Setting**
  *   **Definition:** The non-human has voice and intent, but humans remain the primary moral agents. The world is alive, but we are the protagonists.
  *   **The Commitment:** "I gave the river a soul so it could witness my hero's journey, but I didn't let the river have its own journey."

  **LEAF H: The Flat Symmetrical Actor-Network**
  *   **Definition:** The bacillus and the bishop are the same kind of thing for purposes of the story. Agency is distributed across human and non-human actors.
  *   **The Commitment:** "The bacterium has as much right to a chapter as the bishop, and if you think that's crazy, you're speciesist."

  ***

  ## Part 4: Scoring Key & Workshop Notes

  **How to Use:**
  1.  Have each member take the tree individually (5 mins).
  2.  Compare Leaves. If two members land on different leaves, ask: *"Which question split us?"*
  3.  That question is your craft disagreement.

  **The "Fake Distinction" Warning:**
  This tree cannot reliably separate **Leaf F (Vulnerability)** and **Leaf G (Animist Setting)**.
  *   *Why:* Both grant high importance to the non-human context. One does it through sociological verbs ("the system starved them"), the other through poetic verbs ("the land refused to yield").
  *   *Workaround:* If you split here, argue about **Ventriloquy**. Do you want the land to *act* (G), or the *system* to act upon the land (F)?

  **The "Lag" Trap:**
  If you answer **YES** to Question 5 (Lag is Visible), you are forced toward Human/Vulnerable views. If you answer **NO** (Invisible), you are forced toward Determinism/Fatalism.
  *   *Craft Check:* Are you hiding the cause because it's mysterious, or because you don't know how your characters would react to knowing it?

  **Case Study Mapping:**
  *   *Arriving Ship:* Tests if the plot is about the *people* or the *pathogen* (Q1).
  *   *Flood Plain:* Tests if the disaster is a *specific actor* or a *generic stressor* (Q3).
  *   *Failed Harvest:* Tests the *timescale of knowledge* (Q5).
  *   *Cholera Well:* Tests *mitigation* (Q7).
  *   *Blight/Grain:* Tests *class vs. biology* (Q9).

  **Empty Node Discussion:**
  If your group lands in an "Empty Node" (e.g., High Symmetry but Low Counterfactual), you have a plot hole. You are claiming the volcano is a main character, but the story would end the same without it. Fix the plot, not the philosophy.
