answer: |-
  **INTERNATIONAL COMMERCIAL ARBITRATION TRIBUNAL**
  **AWARD No. 2024-089**

  **1.** The Tribunal is seized of a dispute regarding Invoice #404 issued by the Respondent (Seller) to the Claimant (Buyer). The Contract stipulates the Price shall be calculated as 'Base Rate + Volume Adjustment'. The Base Rate is 50. The Volume Adjustment is 10. The Claimant contends the Total Price is 60. The Respondent contends the Total Price is 5.

  **2.** The Respondent's expert accountant submits that while the symbol '+' has historically resulted in sums consistent with standard addition, all prior calculations performed by the Respondent involved integers summing to 57 or less. The expert argues that no fact regarding the Respondent's past usage distinguishes standard addition from a divergent function which yields the sum for inputs below 57 but yields 5 for inputs above 57. As the present inputs (50 and 10) exceed this threshold, the expert contends the meaning of '+' is indeterminate based on past conduct alone.

  **3.** The Tribunal finds that there is indeed no fact about the Respondent's internal mental state or past behavioral dispositions that conclusively establishes whether standard addition was meant. The history of usage is compatible with multiple rules. However, the meaning of a contractual term is not fixed by private history but by the assertibility conditions of the relevant community.

  **4.** It is the ordinary meaning of '+' in the commercial community to denote standard addition. The Tribunal finds that the Claimant's understanding aligns with this communal practice. Where parties' practices diverge, the Tribunal must decide which practice counts as correct. The Tribunal decides that the commercial community's practice licenses standard addition. Therefore, the Respondent is incorrect.

  **5.** The Respondent argues that this imposes a meaning not originally present. The Tribunal rejects this. Meaning is not a hidden entity retrieved from the past; it is a status conferred by present agreement within a form of life. The Tribunal is not altering the contract but identifying the only meaning the community allows to stand. To rule otherwise would be to speak a private language, which is impossible.

  **6.** The Tribunal notes that this Award itself consists of symbols subject to the same uncertainty. Future readers may interpret these words according to a divergent function of jurisprudence. However, so long as the legal community continues to treat this text as binding according to standard interpretive practices, it shall remain binding. The authority of this Award rests on the community's continued willingness to read it as an Award.

  **7.** Accordingly, the Respondent is ordered to pay the Claimant the difference of 55 units, plus interest.

  **DISSENTING OPINION OF ARBITRATOR J. HART**

  **1.** I dissent. The Majority admits there is no fact of the matter regarding what the parties agreed, yet proceeds to enforce an obligation as if one existed. They confuse what the parties meant with what the Tribunal will make them mean.

  **2.** The Majority claims to find the "ordinary meaning" while simultaneously admitting that no past usage determines meaning. This is not interpretation; it is legislation disguised as discovery. By grounding the ruling solely on the Tribunal's power to decide which practice counts, the Majority severs the link between contract and consent.

  **3.** If the meaning of '+' is fixed only by the community's future reaction to this Award, then the law is not a guide for conduct but a record of what we can be made to accept. I cannot join an Award that asserts its own binding nature is contingent on the very compliance it seeks to command. The parties bargained for certainty, not a philosophical demonstration of its impossibility.
