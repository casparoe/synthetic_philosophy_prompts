  *   **Your friend's view** likely emphasizes the *structure* of the town (a market society dependent on exchange rather than household self-sufficiency). For a specialist, the shift from the *oikos* to a generalized market economy is often the primary marker of "Unnatural" *chrematistike*, regardless of interest rates.

