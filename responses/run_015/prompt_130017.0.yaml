      *(Refining the Flying Man connection)*: The Flying Man argues for the *immateriality* of the soul. Harvard argues for the *localization* of the person in the brain. If the person is immaterial, why does brain destruction end them? Because the brain is the necessary vehicle for earthly life. I need to make sure this distinction is clear.

