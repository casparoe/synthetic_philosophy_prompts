  ### Indistinguishable Leaves
  **Functional Reduction (Leaf 6)** and **Explanatory Emergence (Leaf 7)** are difficult to separate with this tree. Both accept that the macro is fixed by the micro (Q3-A) and that derivations exist (Q4). The split relies on Q4-B (Is the derivation an *explanation*?). A Functional Reductionist might argue that once you identify the *role*, explanation is complete, while an Explanatory Emergentist insists the macro-vocabulary is still needed.
  *   **Further Case Needed:** A scenario where knowing the functional role *still* leaves a "why" question unanswered (e.g., qualitative experience or normative force) would separate them cleanly.

