  ### Diagnosis of Unoccupied Combinations
  *There are 118 empty coordinates in the 128-space. They fall into these diagnostic clusters:*

  1.  **Incoherent (Q1-A, Q2-B, Q3-B):** Claims macro-causes exist and obey micro-laws, yet micro-identical systems diverge; this violates the definition of "obeying micro-laws."
  2.  **Unattractive (Q1-B, Q2-A):** Claims macro-properties are causally inert but still violate micro-physical laws; this posits magic without even granting it causal power.
  3.  **Unexplored (Q4-B, Q7-A):** Claims derivations are useless for explanation yet prediction shortcuts exist; nobody has motivated why a shortcut wouldn't count as an explanation.
  4.  **Unexplored (Q6-A, Q5-B):** Claims properties require infinite parts but depend on specific material; this combines idealization with strict reductionism, a rare tension.
  5.  **Incoherent (Q1-A, Q3-B):** Claims top-down causation exists but micro-identical systems can diverge without new laws; this implies causation without determination.

