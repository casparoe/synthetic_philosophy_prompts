  # Tutorial Handout: The Emergence Decision Tree

  **Instructions:** Start at **Q1**. Follow the path that matches your intuition about the cases. At the end, you will land on a philosophical position. Some paths lead to named positions; others lead to logical dead-ends (diagnosed below).

  ### The Branch Questions
  *Answer based on your intuition about the cases provided. Do not worry about technical terms.*

  **Q1 (Case 5: Traffic Jam):** When a traffic jam forms, does the "jam" itself push the individual cars to slow down, or do the cars slow down solely because of the car in front of them?
  *   **A:** The jam exerts a real influence (Top-Down).
  *   **B:** The cars only react to other cars (Bottom-Up).

  **Q2 (Case 5 + Physics):** If the jam exerts influence (Q1-A), does this require the cars to temporarily disobey the laws of physics (e.g., Newton's laws) that govern them individually?
  *   **A:** Yes, new laws kick in at the macro level.
  *   **B:** No, the micro-laws are never broken.
  *   *(If Q1-B, skip to Q3)*

  **Q3 (Case 3: Micro-Identical):** Imagine two systems that are identical in every micro-physical detail at time *t*. Must they have the exact same macro-behavior at time *t+1*?
  *   **A:** Yes, micro-state fixes the macro-state.
  *   **B:** No, they could diverge.

  **Q4 (Case 4: Hard Drive):** If the micro-state fixes the macro-state (Q3-A), does a complete mathematical derivation of the macro-behavior from micro-laws count as a full explanation of the system?
  *   **A:** Yes, that derivation is all there is to know.
  *   **B:** No, the derivation exists but isn't a useful explanation.

  **Q5 (Case 1: Ecosystem Sim):** If the derivation exists (Q4-A), does it matter *what physical stuff* (silicon, carbon, water) realizes the system, or only the *pattern of interactions*?
  *   **A:** Only the pattern/role matters (Multiple Realizability).
  *   **B:** The specific physical stuff matters.

  **Q6 (Case 2: Infinity):** Does the macro-property strictly vanish if the system has a finite number of parts (even a trillion), existing only at the mathematical limit of infinity?
  *   **A:** Yes, it requires infinity.
  *   **B:** No, it exists in finite systems.

  **Q7 (Case 4 + Q1):** If the derivation exists (Q4-A), can you predict the outcome *without* simulating every single micro-step (i.e., is there a shortcut)?
  *   **A:** Yes, there are shortcut laws.
  *   **B:** No, you must run the simulation step-by-step.

