answer: |-
  You have hit on one of the most persistent and difficult knots in moral and political philosophy. Your intuition about "ascription universality" is sharp; in academic circles, this is often discussed as "false universality," "hegemonic universality," or the "particular masquerading as the universal." The core idea is exactly what you described: taking a local set of values, stripping them of their specific history, and presenting them as the default setting for all humanity.

  To answer your question directly: The stall is not primarily about hidden facts. It is a mixture of **semantic confusion** (different definitions of "universal") and **bedrock intuitions about authority** (who gets to decide).

  Here is the breakdown of what is generally recognized in philosophy versus what remains fiercely contested, without declaring a winner.

  ### 1. The Semantic Split: Two Meanings of "Universal"
  You identified this perfectly. The argument stalls because the two sides are often using the same word to describe two different logical categories.

  *   **Universality of Scope (Validity):** This claims that a rule applies to everyone, regardless of whether they agree with it or helped create it. Example: "Gravity is universal." It doesn't matter if a culture didn't discover gravity; it still applies to them. In ethics, this side argues: "Torture is wrong everywhere, even if a specific culture accepts it."
  *   **Universality of Origin (Genesis/Consensus):** This claims that a rule is universal because it arises from all cultures equally or was agreed upon by all. Example: "We all signed this treaty," or "Every culture has some version of this value."

  **Where the stall happens:**
  The "Human Rights" side usually argues from **Scope**. They say, "Suffering is bad, therefore rights apply to you."
  The "Imperialism" side attacks the **Origin**. They say, "You didn't ask us, and this concept comes from your history, not ours."

  Because they are arguing about different criteria, they talk past each other. The first side thinks the second side is saying "suffering doesn't matter." The second side thinks the first side is saying "our history doesn't matter."

  ### 2. What is Generally Settled (or Recognized)
  There are a few points where philosophical consensus is broad enough to be considered "settled" in the sense that serious thinkers on both sides acknowledge them.

  *   **History matters:** It is accepted that modern human rights language has specific historical roots in Western Enlightenment thought. It is not a neutral, ahistorical discovery like a law of physics. Critics are right that the *vocabulary* is particular.
  *   **Power is involved:** It is accepted that labeling something "universal" is a political act. It grants the labeler authority over the labeled. If I say my rule is "universal," I am claiming the right to judge you by it.
  *   **Overlap exists:** Anthropologists and ethicists generally agree that there *are* some moral overlaps across cultures (e.g., prohibitions against random murder within the in-group, concepts of reciprocity). The debate is not whether *any* shared values exist, but whether the specific package of "liberal human rights" is one of them.

  ### 3. What is Genuinely Contested
  This is where the "bedrock gut feelings" come in. Philosophy has not resolved these tensions, and they are the engine of the stall.

  **A. Can Validity exist without Consensus?**
  *   **Side 1:** Yes. A truth can be true even if only one person discovered it. If human rights are based on the nature of human suffering, they are valid even if the concept was invented in 18th-century Europe.
  *   **Side 2:** No. In morality, legitimacy comes from agreement. If a rule is imposed without the consent of the governed, it is domination, not morality. To call it "universal" is to hide the domination.

  **B. The "View from Nowhere"**
  *   **Side 1:** We can use reason to step outside our specific culture and find objective truths that apply to everyone.
  *   **Side 2:** There is no "view from nowhere." Everyone thinks from somewhere. When Western thinkers claim to be using "pure reason," they are actually using *Western* reason and pretending it's neutral.

  **C. The Function of the Label**
  *   **Side 1:** The label "universal" is a shield for the vulnerable. It stops a local tyrant from saying "our culture allows this abuse."
  *   **Side 2:** The label "universal" is a sword for the powerful. It stops a local culture from saying "we want to organize society differently."

  ### 4. Is it Facts, Semantics, or Intuitions?
  To weigh the three options you offered:

  1.  **Hidden Facts:** **Low probability.** We have plenty of data on how different cultures function and how human suffering works. More data rarely changes the argument. The disagreement isn't about *what* is happening, but *how to judge* what is happening.
  2.  **Different Meanings:** **High probability.** As noted above, the Scope vs. Origin confusion accounts for a massive amount of the frustration. If both sides agreed on which definition they were using, the argument would become much clearer (even if they still disagreed).
  3.  **Bedrock Intuitions/Power:** **Highest probability.** This is the engine. The stall persists because the stakes are about authority.
      *   For the pro-universality side, giving up the "universal" label feels like surrendering the vulnerable to local tyrants.
      *   For the anti-universality side, accepting the "universal" label feels like surrendering self-determination to foreign powers.

  ### Summary
  The stall is not an accident; it is a feature of the conflict.

  When someone says "Human Rights are universal," they are making a **normative claim** (this *should* be the rule). When the critic says "That is Western Imperialism," they are making a **genealogical claim** (this is *where* the rule came from).

  Philosophy acknowledges that a rule can have a particular origin (West) but claim universal scope (Everywhere). The fight is over whether that move is legitimate.
  *   If you believe morality is discovered (like math), the origin doesn't invalidate the scope.
  *   If you believe morality is constructed (like law), the origin is essential to the legitimacy.

  The "ascription" you noticed is the act of skipping the construction phase and presenting the rule as a discovery. Whether that is a necessary lie to protect people or a harmful lie to control people is the bedrock intuition that remains unresolved.
