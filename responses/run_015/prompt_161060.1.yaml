          *   *Coercion:* Yes, the political precondition of moral debate.
          *   *Addition:* The *tragedy* of incommensurability. It shows that even if convergence were possible, history (colonialism) foreclosed it. It adds *temporality* and *power* to the abstract framework.
      *   *Overreach:* Achebe isn't writing meta-ethics. He's writing about dignity and history. Don't reduce the art to a philosophy puzzle. The tragedy is human, not just epistemological.

  6.  **Selecting Scenes:**
      *   Need scenes that show internal critique (Obierika), internal conflict (Okonkwo/Ikemefuna), and the external clash (DC/Ending).
      *   Selection: 1. Obierika questioning the Oracle (Internal Reflection). 2. Nwoye hearing the cry of twins (Internal Conversion/Depth). 3. The District Commissioner's final paragraph (Sampling/Conquest).

  7.  **Review and Refine:**
      *   *Tone:* Academic, respectful, rigorous.
      *   *Check:* Did I use the three claims (Sampling, Depth, Convergence)? Yes.
