  8.  **Final Polish:** (Self-Correction during drafting)
      *   *Correction:* Make sure I don't just say "Relativism is bad." I need to show how the *crude* version fails.
      *   *Nuance:* The "Depth Point" is tricky. Is the twin killing deep or surface? Argue that the *justification* is surface (religious ontology), but the *distress* (Nwoye/Okonkwo) suggests a shared deep psychology of care that the norm violates.
      *   *Refining the "Conquest" point:* The user says coercion destroys convergence conditions. I should add that the novel shows the *consequences* of that destruction on moral truth itself—it doesn't just hide the truth; it extinguishes the community that held it.

