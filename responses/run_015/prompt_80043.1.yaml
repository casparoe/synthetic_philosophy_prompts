  *(Self-Correction during drafting)*: I need to be careful with Step 3. Step 3 says "A is at least as good as B". If A and B are incommensurable, is A >= B false? Yes. Incomparability means neither >= nor <= holds. So Step 3 fails if Step 2 is interpreted as requiring comparability. Actually, Step 2 says "Required -> At least as good as *every other available option*." If B is an available option, and A is required, then A >= B. If B is *also* required, then B >= A. This leads to A >= B and B >= A. If they are incommensurable, can they both be required? Yes, in a dilemma. So Step 2 is the pressure point. If A is required, it doesn't mean A >= B in a *comparative* sense, it means A satisfies a duty.
  Okay, the strongest break is Step 4 (Antisymmetry/Equality). Ruth Chang's "On a Par" concept is exactly designed for this. A and B are not equal, but neither is better. They are in a different relation.
