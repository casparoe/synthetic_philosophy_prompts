      *   *Weaker Claim:* "Most apparent dilemmas are epistemic."
      *   *Does it depend on Single Scale?* Yes, strictly speaking. If there is no single scale, "epistemic uncertainty" isn't just "not finishing the arithmetic." It's "not knowing which incommensurable value takes precedence."
      *   *Can it be restated?* Yes. You can say "Most cases *appear* to be dilemmas but are actually resolvable by a coherent (possibly pluralistic) framework," while admitting *some* are genuine.
