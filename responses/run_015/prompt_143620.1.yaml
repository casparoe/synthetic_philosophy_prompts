      *   *The "Infection" Metaphor:* Tolstoy explicitly uses the word "infection" (or "infect") to describe how feeling passes from artist to audience.
      *   *Criteria for Good Art:*
          1.  Individuality of the feeling.
          2.  Clarity of expression.
          3.  Sincerity of the artist.
      *   *Religious/Moral Dimension:* Tolstoy argues that the *value* of art depends on the *quality* of the feeling transmitted. The highest feeling is "religious consciousness of the time," which for Tolstoy meant universal brotherhood/love.
      *   *Distinction:* Counterfeit art vs. real art.

