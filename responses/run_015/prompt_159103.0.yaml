  ### Candidate Defeaters and Selection

  I considered standard objections like intransitivity, self-binding (Ulysses contracts), and ignorance. Intransitivity is absorbed by stochastic revealed preference models (Becker/DeGroot/Marschak). Self-binding is treated as a higher-order choice revealing meta-preferences. Ignorance is handled by the "idealized conditions" clause (full information). These don't bite because the hard-line view treats them as technical adjustments to the choice set or information state, not challenges to the definition of utility.

  I discarded "normative skepticism" (Hume's is-ought) because your position already admits a separate ethical premise is needed. The serious candidates are those where the *choice mechanism* dissociates from the *welfare signal* in a way that idealization cannot repair without vacuity. Adaptive preferences are live but often dismissed as "changed tastes." The WTP-SWB gap is empirically realized but dismissed as "SWB isn't preference." Your two probes are the strongest because they posit structural dissociations where the "value" signal is observable and predictive, yet explicitly excluded from choice by definition or design. Probe 2 is particularly potent for HTA because it mirrors clinical dissociations (e.g., depression, locked-in syndrome) where choice capacity is impaired but welfare signals persist.

