answer: |-
  **MA Philosophy of History: Take-Home Seminar Assessment**
  **Time Allowed:** 75 Minutes
  **Word Limit:** 1,000 words max (but quality > quantity)

  ### Essay Question

  Philosophers of history often debate whether outcomes are "locked in" by contingent sequences or determined by structural conditions. Distinguish between **diachronic lock-in** (where the specific sequence of events constrains later possibilities, making reversal costly or impossible) and **synchronic overdetermination** (where the aggregate of past conditions heavily constrains the present, but the endpoint could theoretically have been reached through alternate routes).

  Apply this distinction to the **Great Divergence**. Was Britain's industrial takeoff a case of genuine diachronic path-dependence (e.g., contingent political or geological events), or was China's institutional stability a synchronic attractor that Britain simply happened to escape? In your answer, address the counterfactual: *If we rewound history, would Britain have industrialized anyway?* Defend a clear verdict.

  ***

  ### Model Answer (Approx. 700 words)

  To evaluate the Great Divergence through the lens of path dependence, we must first rigorously separate the mechanisms at play. **Diachronic lock-in** implies that history is sensitive to initial conditions; a specific, contingent event at $t_1$ forces a trajectory at $t_2$ that cannot be easily undone (increasing returns). **Synchronic overdetermination**, by contrast, suggests that while the present is heavily constrained by the sum of past conditions, the specific sequence matters less than the structural weight of those conditions. In this view, multiple historical routes could lead to the same structural bottleneck or breakthrough.

  Applying this to Britain, the standard "contingent" argument favors diachronic lock-in. Proponents like Robert Allen argue that high wages and cheap coal in Britain were not inevitable structural features of Europe but the result of specific sequences: the enclosure movements, the outcome of the Civil War, and the geographic luck of coal deposits near waterways. If these events constitute diachronic lock-in, then removing one link—say, if the Stuarts had maintained absolute monarchy—breaks the chain. The industrial revolution (IR) becomes a fragile historical accident. Under this view, the counterfactual "Would Britain have industrialized anyway?" is answered with a *no*. The specific path was necessary to trigger the increasing returns of steam technology.

  However, a synchronic reading challenges this. One might argue that by the 17th century, Europe possessed a set of structural conditions (fragmented sovereignty, competitive states, property rights) that created a "pressure cooker" environment. Here, Britain's specific sequence is less important than the synchronic weight of these conditions. Even if the Stuarts had survived, the structural pressure for military innovation and capital accumulation might have forced industrialization through a different route (e.g., via France or the Netherlands). In this framework, Britain's success isn't locked in by a specific sequence, but overdetermined by the structural landscape of early modern Europe.

  Turning to China, the "High-Level Equilibrium Trap" offers a compelling case for synchronic constraint. China's stability wasn't necessarily a diachronic lock-in from the Ming dynasty; rather, it was a synchronic attractor. The aggregate conditions—abundant labor, efficient markets, lack of coal proximity—created a system where industrial substitution was irrational. Crucially, this allows for alternate routes. Theoretically, China could have industrialized if *any* major structural variable shifted (e.g., a labor shortage or accessible coal), regardless of the specific political sequence. The constraint is on the *state* of the system, not the *order* of events.

  So, was the divergence locked in? If we treat Britain's rise as diachronic, we commit to strong contingency: the IR is a fragile branch in the historical tree. If we treat China's stagnation as synchronic overdetermination, we argue that her system was robust against change until structural parameters shifted.

  My verdict leans toward a hybrid, but weighted toward diachronic contingency for Britain. While structural factors (synchronic) created the *possibility* space, the actualization relied on specific sequences (diachronic). The timing of coal exploitation relative to wage spikes was not just a structural condition but a sequenced event. If Britain's coal had been discovered two centuries later, or if wages had remained low due to different population dynamics, the incentive structure for steam power vanishes. China, conversely, faced a synchronic wall; without a shift in the factor endowments (labor vs. capital), no sequence of events within the existing system could break the equilibrium.

  Therefore, rewinding history suggests Britain would *not* necessarily have industrialized. The specific conjunction of events constitutes a diachronic lock-in. China's stability, however, was a synchronic overdetermination; the endpoint (stasis) was robust across multiple potential sequences until external shocks arrived. History, in the case of the IR, was not inevitable, but once the lock-in occurred, the divergence became self-reinforcing.

  ***

  ### Marking Scheme & Grading Notes

  **Total Marks: 100**

  **1. Conceptual Clarity (30 Marks)**
  *   **A (25-30):** Clearly defines *diachronic lock-in* (sequence matters, increasing returns) vs. *synchronic overdetermination* (structural constraints, equifinality/alternate routes). Does not conflate the two.
  *   **B (18-24):** Defines terms but gets a bit fuzzy on the "alternate routes" aspect of synchronic constraint. Might treat synchronic as just "structuralism" without addressing the counterfactual routes.
  *   **C/F:** Conflates the terms or treats all path dependence as the same thing.

  **2. Application to Great Divergence (30 Marks)**
  *   **A (25-30):** Applies concepts specifically to Britain (contingency/coal/wages) and China (equilibrium trap). Uses the concepts to explain *why* the divergence happened, not just describing the history.
  *   **B (18-24):** Good historical detail (Pomeranz/Allen references) but the philosophical distinction is just pasted on top. Doesn't show how the concepts *change* the interpretation.
  *   **C/F:** Purely descriptive history with no philosophical framing.

  **3. Counterfactual Reasoning & Verdict (30 Marks)**
  *   **A (25-30):** Explicitly answers "Would Britain have industrialized anyway?" Uses the distinction to defend the answer. Defends a clear verdict (e.g., "It was diachronic").
  *   **B (18-24):** Hedges too much ("It depends"). Counterfactual is mentioned but not analyzed through the lens of the definitions.
  *   **C/F:** No clear verdict or ignores the counterfactual element.

  **4. Structure & Clarity (10 Marks)**
  *   **A (9-10):** Concise, logical flow.
  *   **B (7-8):** Readable but maybe a bit rambling.
  *   **C/F:** Disorganized.

  **Common Mistakes (Deduct 5-10 marks each):**
  *   **The QWERTY Trap:** Using keyboard examples or Arthur's standard tech examples instead of the historical case study.
  *   **Conflation:** Treating "synchronic overdetermination" as just "inevitability." (Remember: synchronic allows for alternate routes to the *same* constraint, it doesn't mean the outcome was destined from the start).
  *   **Determinism:** Assuming that because China was stable, it was diachronically locked. (Stability can be a synchronic attractor).
  *   **Ignoring the Twist:** Failing to distinguish between the *sequence* (diachronic) and the *structural sum* (synchronic).

  *Note to grader: If they make a typo dont penalize, this is philosophy not english lit. But if their argument is typo-ridden and hard to follow, hit them under Structure.*
