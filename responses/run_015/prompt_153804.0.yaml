answer: |-
  Here is the specification for a Bayesian account of old evidence, mapped against the logical constraints you requested.

  ### The Desiderata List

  To be adequate, a theory of old-evidence updating must satisfy the following requirements. I have categorized them by the specific case they address and marked their status.

  #### 1. The Confirmation Intuition (Glymour Case)
  *   **What:** If $E$ is already known ($P(E)=1$) and agent subsequently learns that $H$ entails (or highly predicts) $E$, the credence in $H$ must increase ($P_{new}(H) > P_{old}(H)$).
  *   **Why:** This is the phenomenon to be explained (e.g., Einstein knowing Mercury's perihelion shift before GR, yet GR being confirmed by it). Without this, Bayesianism cannot model historical theory choice.
  *   **Status:** **Non-negotiable** (for a solution to POE).
  *   **Conflicts:** Directly conflicts with *Strict Conditionalization on E* (see #3).

  #### 2. Synchronic Coherence
  *   **What:** At any time $t$, the agent's belief state must satisfy the Kolmogorov probability axioms (non-negativity, normalization, additivity).
  *   **Why:** To remain a Bayesian theory. Violating this invites Dutch Books and incoherence.
  *   **Status:** **Non-negotiable**.
  *   **Conflicts:** Conflicts with *Counterfactual Prior* approaches if they require assigning $P(E) < 1$ to known facts in the actual state.

  #### 3. Diachronic Coherence (Strict Conditionalization)
  *   **What:** Belief updates must occur via conditionalization on the *newly learned proposition* $X$: $P_{new}(\cdot) = P_{old}(\cdot | X)$.
  *   **Why:** To ensure rational learning dynamics and avoid diachronic Dutch Books.
  *   **Status:** **Camp Preference** (Orthodox Bayesians say Non-negotiable; Liberals say Preference).
  *   **Conflicts:** **Incompatible with #1** if the "newly learned proposition" is just $E$. (If $P_{old}(E)=1$, then $P_{old}(H|E) = P_{old}(H)$).

  #### 4. The Forgotten Prior Constraint (Epistemic History)
  *   **What:** If an agent once updated on $E$ but forgot the specific impact $E$ had on $H$ (lost the correlation), recovering that logical link should update $H$ without requiring $E$ to be treated as *empirically* new.
  *   **Why:** Distinguishes between learning a fact ($E$) and learning a relation ($H \to E$). It captures the "aha!" moment of realizing what you already knew implies your theory.
  *   **Status:** **Camp Preference** (Internalists require this; Externalists/Reliabilists may not care about the internal history).
  *   **Conflicts:** Tensions with *Pure Externalism* (which says only the current causal link matters).

  #### 5. The Stale Archive Constraint (Model Relativity)
  *   **What:** Data $D$ collected under a rejected model $M_1$ can confirm a new model $M_2$ without new data collection, provided the *likelihood* $P(D|M_2)$ is distinct from $P(D|M_1)$.
  *   **Why:** Scientific practice reuses data (e.g., using Newtonian astronomical data to confirm GR). The "oldness" is in the measurement, not the evidential relevance.
  *   **Status:** **Non-negotiable** (for scientific realism).
  *   **Conflicts:** Conflicts with approaches that tie evidence rigidly to the theoretical framework in which it was generated (meaning $D$ under $M_1$ is a *different proposition* than $D$ under $M_2$).

  #### 6. Non-Triviality (No Cheating)
  *   **What:** The update mechanism cannot simply stipulate $P_{new}(H)$ is higher. It must derive the increase from the structural relationship between $H$ and $E$.
  *   **Why:** To prevent the theory from being a post-hoc description rather than a normative guide.
  *   **Status:** **Non-negotiable**.
  *   **Conflicts:** None, but many "solutions" fail this by arbitrarily adjusting priors.

  ---

  ### The Impossible Trinity

  You asked if any subset is jointly impossible given basic probability axioms. **Yes.** There is a formal incompatibility theorem at the heart of the POE. You cannot simultaneously hold the following three claims:

  1.  **Factivity of Evidence:** Known evidence has probability 1 ($P(E) = 1$).
  2.  **Strict Conditionalization:** Updates on $E$ follow $P_{new}(H) = P_{old}(H|E)$.
  3.  **Old Evidence Confirms:** $P_{new}(H) > P_{old}(H)$ when $E$ is old.

  **Proof Sketch:**
  If $P_{old}(E) = 1$, then $P_{old}(H \cap E) = P_{old}(H)$.
  Therefore, $P_{old}(H|E) = P_{old}(H \cap E) / P_{old}(E) = P_{old}(H) / 1 = P_{old}(H)$.
  If updating is conditionalization on $E$, then $P_{new}(H) = P_{old}(H)$.
  Therefore, confirmation is impossible.

  **Resolution:** Any adequate theory must reject or modify one leg of this triangle.
  *   **Garber-style:** Rejects #1 (locally). $P(E)=1$, but we conditionalize on a *logical proposition* $(H \vdash E)$ which is not certain.
  *   **Counterfactual Prior:** Rejects #1 (globally/hypothetically). We calculate what $P(H)$ *would* have been if $P(E) < 1$.
  *   **Jeffrey Conditionalization:** Rejects #2. Allows updates where $P(E)$ remains 1 but the partition changes.

  ---

  ### Distinctions The Theory Must Preserve

  An adequate account cannot collapse the following distinctions, or it loses explanatory power:

  **1. Genuinely Old vs. Apparently Old**
  *   **The Distinction:** *Genuinely Old* means $P(E)=1$ in the agent's actual state. *Apparently Old* means $P(E) \approx 1$ but technically $<1$.
  *   **Why it matters:** If you solve POE by saying "Actually $P(E)$ was never 1," you solve the math but miss the epistemology. Scientists treat the perihelion shift as a *fact*, not a high-probability hypothesis. A theory that requires $P(E) < 1$ to work collapses this distinction and fails the **Factivity** intuition.

  **2. Prior Revision vs. Belief Revision**
  *   **The Distinction:** *Belief Revision* is changing $P(H)$ given a fixed space. *Prior Revision* is changing the algebra of propositions (e.g., adding the proposition "$H$ entails $E$" to the language).
  *   **Why it matters:** In the **Forgotten Prior** case, you aren't learning new world-facts; you are learning new *constraints* on your belief space. If a theory treats logical learning as empirical learning, it collapses this distinction and violates **Synchronic Coherence** (by treating logical truths as contingent).

  **3. The "Killer" Requirement**
  *   **Which one?** **Desideratum #3 (Strict Conditionalization on E).**
  *   **Why:** This is the requirement that kills the most standard fixes. If you insist that the *only* permissible update on known evidence is conditionalization on the evidence itself, the problem is unsolvable. Every successful solution (Garber, Counterfactual, Framework) works by shifting the *target* of conditionalization away from $E$ itself (to logical relations, counterfactual states, or likelihood functions).

  ---

  ### Scoring the Candidates

  Here is how the three major approaches score against the desiderata.

  #### 1. Naive Conditionalization
  *   **Mechanism:** $P_{new}(H) = P_{old}(H|E)$.
  *   **Score:**
      *   Confirmation Intuition: **FAIL** (Mathematically impossible if $P(E)=1$).
      *   Synchronic Coherence: **PASS**.
      *   Diachronic Coherence: **PASS**.
      *   Stale Archive: **FAIL** (Cannot handle model change).
  *   **Verdict:** Logically consistent but empirically inadequate. It solves the axioms by sacrificing the science.

  #### 2. Prior-Revision (Garber/Eells Style)
  *   **Mechanism:** Expand the algebra to include logical propositions like $\lambda = (H \vdash E)$. Conditionalize on $\lambda$, not $E$.
  *   **Score:**
      *   Confirmation Intuition: **PASS** (Since $P(\lambda) < 1$, learning $\lambda$ boosts $H$).
      *   Synchronic Coherence: **PASS** (Within the expanded algebra).
      *   Diachronic Coherence: **PASS** (Conditionalizing on $\lambda$).
      *   Forgotten Prior: **PASS** (Models the discovery of the link).
      *   Stale Archive: **WEAK**. It handles logical entailment well, but struggles when the *likelihood* changes due to model reinterpretation rather than logical deduction.
      *   **Cost:** Requires "Logical Omniscience" relaxation. Computationally expensive to expand algebras constantly.
  *   **Verdict:** The strongest orthodox contender. Preserves Bayes by changing the *object* of learning.

  #### 3. Framework-Relative (Contextual/Likelihood)
  *   **Mechanism:** Evidence is always relative to a theoretical framework $K$. $P(E|H \cdot K)$. Changing $K$ to $K'$ changes the likelihood, allowing update even if $E$ is fixed.
  *   **Score:**
      *   Confirmation Intuition: **PASS** (Via likelihood shift).
      *   Synchronic Coherence: **PASS** (Relative to current $K$).
      *   Diachronic Coherence: **FAIL/RISKY**. Switching frameworks often looks like a "revolutionary" jump rather than conditionalization, risking Dutch Books if not carefully constrained.
      *   Stale Archive: **PASS** (Best fit for this case).
      *   Forgotten Prior: **WEAK**. Less focused on internal logical discovery, more on external model fit.
      *   **Cost:** Risks collapsing into Kuhnian incommensurability. If $K$ changes everything, can we compare $P(H|K)$ and $P(H|K')$?
  *   **Verdict:** Best for scientific realism and the "Stale Archive," but weakest on formal diachronic coherence.

  ### Summary of Logical Constraints

  If you want a theory that satisfies **Synchronic Coherence**, **Diachronic Coherence**, and the **Confirmation Intuition**, you **must** adopt a **Prior-Revision** strategy (like Garber).

  However, if you prioritize the **Stale Archive** case (where the *meaning* of data changes, not just the logical link), you are forced toward a **Framework-Relative** approach, which puts **Diachronic Coherence** at risk.

  **The Joint Impossibility:** You cannot have a theory that satisfies **Strict Conditionalization on Empirical Propositions** AND **Old Evidence Confirmation** AND **Factivity of Evidence**. One must go. Most philosophers sacrifice Strict Conditionalization on Empirical Propositions (by conditionalizing on logical relations instead). If you refuse to do that, you must sacrifice Factivity (claiming we never truly know $E$), which many find epistemologically dishonest.
