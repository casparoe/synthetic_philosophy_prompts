prompt: |-
  I've been trying to figure out what a bayesian account of old evidence actually has to deliver, and I want the full spec before I read any more papers. Write me the desiderata list: what must any adequate theory of old-evidence updating get right?

  Specifically it needs to cover the standard glymour-style case where you learn something you already knew and conditionalization does nothing, the 'forgotten prior' case where your beleif state was formed with E in the background but you lost track, and this other situation I'm going to call stale archive — a dataset collected under a rejected model gets rediscovered and needs integrating with current beliefs. For each requirement say why it's there, mark non-negotiable vs camp preference, and tell me if there's any pair that can't both be satisfied.

  Also: what distinction can't it collapse? Like between genuinely old and just apparently old? Between prior revision and beleif revision? And which one requirement kills the most standard fixes?

  Then briefly score the naive conditionalization answer, the prior-revision story, and a framework-relative approach against the list. Don't need a bibliography, I just want the logic mapped out. If some subset of these desiderata is jointly impossible given basic probability axioms, say so — that's the part I actually care about.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the Request:**

      *   **Topic:** Bayesian account of old evidence (the "Problem of Old Evidence" or POE).
      *   **Task:** Create a "desiderata list" (specification of requirements) for an adequate theory.
      *   **Specific Cases to Cover:**
          1.  Standard Glymour-style case (learn $E$ supports $H$, but $P(E)=1$).
          2.  "Forgotten Prior" case (belief formed with $E$ in background, but track lost).
          3.  "Stale Archive" case (dataset collected under rejected model, rediscovered, needs integrating).
      *   **Requirements for Each Desideratum:**
          *   What it is.
          *   Why it's there.
          *   Non-negotiable vs. Camp Preference.
          *   Conflicts/Incompatibilities (if any).
      *   **Distinctions to Preserve:**
          *   Genuinely old vs. apparently old.
          *   Prior revision vs. belief revision.
          *   Which requirement kills standard fixes.
      *   **Scoring:** Evaluate Naive Conditionalization, Prior-Revision (Garber-style), and Framework-Relative approaches against the list.
      *   **Constraint:** No bibliography, focus on logic. Highlight joint impossibility if it exists.

  2.  **Analyze the "Problem of Old Evidence" (POE):**

      *   *Core Issue:* In standard Bayesianism, learning $E$ updates $H$ via $P_{new}(H) = P_{old}(H|E)$. If $E$ is already known ($P_{old}(E)=1$), then $P_{old}(H|E) = P_{old}(H)$. No update occurs. But historically, old evidence (e.g., Mercury's perihelion for GR) *does* confirm theories.
      *   *The User's Twist:* They want a spec that covers not just Glymour, but also "Forgotten Prior" and "Stale Archive." This suggests they are looking for a robust epistemological framework, not just a mathematical trick.
      *   *The "Killer" Constraint:* They explicitly ask if any subset is jointly impossible given probability axioms. This is the crux. The POE is often argued to be a paradox *because* standard axioms + intuitive desiderata clash.

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Desideratum 1: The Confirmation Intuition.* (Glymour case). If $E$ is known, $H$ can still be confirmed by $E$.
          *   *Why:* Matches scientific practice (GR/Mercury).
          *   *Status:* Non-negotiable for a solution to POE.
      *   *Desideratum 2: Synchronic Coherence.* (Probability Axioms). At any time $t$, beliefs must obey Kolmogorov axioms.
          *   *Why:* It's Bayesianism.
          *   *Status:* Non-negotiable (by definition).
      *   *Desideratum 3: Diachronic Coherence.* (Conditionalization). Updates should generally follow conditionalization on *new* info.
          *   *Why:* Prevents Dutch Books.
          *   *Status:* Non-negotiable (standard Bayes).
      *   *Desideratum 4: The Forgotten Prior Constraint.* (Recovery). If I forgot how $E$ affected $H$, rediscovering the link should update $H$ without treating $E$ as *new* empirical data.
          *   *Why:* Distinguishes logical learning from empirical learning.
          *   *Status:* Camp Preference (Internalists love it, Externalists might not care).
      *   *Desideratum 5: The Stale Archive Constraint.* (Model Relativity). Data from a "false" model can confirm a "true" model if re-interpreted.
          *   *Why:* Real science reuses data (e.g., Newtonian data for GR).
          *   *Status:* Non-negotiable for realism.
      *   *Desideratum 6: Non-Triviality.* The update shouldn't just be "change your priors arbitrarily."
          *   *Why:* Prevents cheating.
          *   *Status:* Non-negotiable.

      *   *Conflict Check:* Desideratum 1 (Confirmation on $P(E)=1$) vs. Desideratum 3 (Strict Conditionalization). If $P(E)=1$, $P(H|E)=P(H)$. To get confirmation, you must violate strict conditionalization on $E$ OR deny $P(E)=1$. This is the classic tension.

  4.  **Addressing the Distinctions:**

      *   *Genuinely Old vs. Apparently Old:* Needs to distinguish between $E$ being certain ($P=1$) vs. just high confidence.
      *   *Prior Revision vs. Belief Revision:* Garber-style solutions revise the *prior* logical space (learning $H \to E$), not the empirical fact $E$.
      *   *The Killer:* The requirement that $P(E)=1$ (factivity of knowledge) combined with the requirement that $P(H|E) > P(H)$ (confirmation) kills Naive Conditionalization.

  5.  **Scoring the Approaches:**

      *   *Naive Conditionalization:* Fails Glymour case (obviously).
      *   *Prior-Revision (Garber/Eells):* Solves Glymour by making the *logical relation* new. Struggles with Stale Archive (requires re-specifying the space).
      *   *Framework-Relative (e.g., Hintikka, or Contextual):* Good for Stale Archive. Can look like cheating on Coherence if not careful.

  6.  **Refining the "Joint Impossibility" Claim:**

      *   The user asks: "If some subset of these desiderata is jointly impossible given basic probability axioms, say so."
      *   *Answer:* Yes. The "Trinity of Incompatibility":
          1.  Standard Probability Axioms (Synchronic).
          2.  Strict Conditionalization (Diachronic).
          3.  Old Evidence Confirms (POE Intuition).
      *   You can only have two. Most solutions sacrifice #2 (by conditionalizing on something else, like logical relations) or modify #1 (by using counterfactual priors).

  7.  **Structuring the Response:**

      *   **Introduction:** Acknowledge the depth of the request.
      *   **The Desiderata List:** Structured as requested (What, Why, Status, Conflicts).
      *   **The Impossible Trinity:** Explicitly state the joint impossibility theorem.
      *   **Distinctions:** Address the specific conceptual boundaries.
      *   **The Killer Requirement:** Identify which one breaks standard fixes.
      *   **Scoring the Candidates:** Evaluate the three approaches.
      *   **Conclusion:** Summary of the logical landscape.

  8.  **Self-Correction/Refinement during drafting:**

      *   *Correction:* Make sure to address the "Stale Archive" specifically. This is essentially the "theory change" problem. Data $D$ was interpreted under $T_1$, now we have $T_2$. $D$ is old, but its *likelihood* under $T_2$ is new information.
      *   *Refinement:* Ensure the distinction between "Forgotten Prior" and "Glymour" is clear. Glymour is about logical entailment discovered late. Forgotten Prior is about psychological loss of the update history.
      *   *Tone:* Keep it analytical, rigorous, slightly technical but accessible to someone asking this level of question.
      *   *Check:* Did I mark Non-negotiable vs. Camp Preference? Yes.
      *   *Check:* Did I identify the pair that can't be satisfied? Yes (Strict Conditionalization + Old Evidence Confirmation given $P(E)=1$).

  9.  **Final Polish:** Check against the prompt's specific constraints (no bibliography, logic mapped out, highlight impossibility). The "Stale Archive" case is particularly interesting—it implies the likelihood function itself changes, not just the probability of $E$. I need to make sure the desiderata reflect that.

      *(Self-Correction on Stale Archive)*: In the Stale Archive case, $E$ isn't just "known," it's "known under description $D_1$." The new info is "$E$ falls under description $D_2$." The desideratum must capture that the *evidential relevance* can change without new empirical data.

      *(Final check on Impossibility)*: Is it *logically* impossible or just impossible within *standard* Bayesianism? It's impossible within standard Bayesianism (Axioms + Conditionalization). If you relax Axioms (e.g., allow $P(E) < 1$ for known facts via counterfactuals), you can solve it. I need to be precise: "Impossible given Standard Bayesian Axioms + Factivity of Evidence."

