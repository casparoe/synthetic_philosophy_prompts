answer: |-
  Hey there, it sounds like you and your roommate have stumbled into a really fertile patch of decision theory that touches on some of the hardest problems in rationality and game theory. It is great that you are digging this deep into Parfit because the Hitchhiker problem is essentially the stress test for any definition of rationality, and your variation with the scanner and the cognitive cost of deception adds a layer of psychological realism that often gets glossed over in the abstract versions. I want to walk through the moves you both made because there is a lot of value in both positions, but one of you is ultimately capturing the deeper structural truth of the scenario you built.

  Let us start by looking at the classic setup you both know well. In the standard Parfit Hitchhiker, the problem arises because there is a disconnect between the reason you need to make the promise to get the ride and the reason you have to keep the promise once you are safe. Causal decision theory usually says you should not pay because paying costs you money and provides no new benefit once you are in town, but if you reason that way, you never get the ride in the first place. Parfit's insight was that rationality must involve some capacity to bind yourself or to be the kind of person who keeps promises even when it is locally costly. Your roommate started the debate by introducing the scanner, which is a classic Newcomb-like element, and then added the constraint that forming a false intention is mentally expensive. This is a crucial move because it turns the internal state of the agent into a resource constraint.

  Your roommate's first move was to argue that this ruins Parfit's point because rational agents will game the scanner with cheap deception. Here is where I think your roommate made a slight misstep relative to the premises you both agreed on. You both stipulated that forming a false intention is mentally expensive and leaves a residue that destabilizes future commitments. If we accept that premise as true within the thought experiment, then deception is by definition not cheap. Your roommate seems to be arguing from a position where deception could be cheap, effectively challenging the premise rather than analyzing the consequence of it. If deception were cheap, you would be right that the equilibrium collapses because everyone would lie, the scanner would detect the underlying intent not to pay, or if the scanner is fooled, the drivers would eventually learn that scans are unreliable and stop picking people up. But since you established that false intentions carry a heavy cognitive tax, the rational calculation changes. A rational agent weighs the cost of the ride against the cost of the money and the cost of the mental residue. If the mental residue is high enough, it outweighs the benefit of saving the money through deception.

  Then your roommate made a stronger philosophical point by distinguishing between commitment and deception. They argued that commitment changes your preferences while deception just hides them, and that the scanner detects one but not the other, so treating them as symmetric is a mistake. This is technically correct in terms of mechanism. Commitment is a change in the utility function or a pre-commitment strategy, whereas deception is maintaining a divergent map between internal state and external signal. However, the scanner in your scenario is described as reading intentions. If I intend to deceive you, my intention is to say I will pay and not pay. If the scanner reads that intention, it reads defection. To get the scanner to read cooperation, I must intend to pay. If I intend to pay now but plan to change my mind later, that is precisely the false intention you described as costly. So while your roommate is right that the concepts are different, in the context of this specific scanner and cost structure, the outcome converges. The cost of maintaining the false intention makes the deception strategy dominated by the commitment strategy.

  Your counter-argument was that rationality in this setup forces you to be genuinely transparent rather than strategically opaque, which strengthens Parfit's idea. I think this is where you come out ahead. You are recognizing that when prediction becomes accurate enough and internal states have tangible costs, the distinction between appearing rational and being rational collapses. This aligns with what modern decision theorists call timeless or updateless decision theory, where you choose your algorithm rather than your specific action. If your algorithm is deceive, the scanner predicts deceive. If your algorithm is commit, the scanner predicts commit. Because you added the cost of cognitive residue, you made the deceive algorithm strictly more expensive than the commit algorithm. Therefore, the rational agent selects the commit algorithm. This does not ruin Parfit's point; it mechanizes it. It shows that under conditions of high transparency and high cognitive integrity costs, rationality literally requires being a good person, or at least a consistent one.

  Your roommate's worry about the equilibrium collapsing to everyone defecting assumes that agents can successfully decouple their prediction from their action. But the scanner prevents that decoupling. If everyone tries to defect, the scanner says defect, and nobody gets a ride. The only stable equilibrium where people get rides is where people intend to pay. Since intending to pay falsely is costly, the only stable equilibrium is where people intend to pay and actually pay. Your roommate is treating the scanner as a passive observer that can be fooled, but in these problems, the scanner is usually treated as a predictor of your decision algorithm. If you are rational, you know the scanner predicts you, so you choose to be the person the scanner predicts will pay.

  So when we look at who is right about what, your roommate is right that commitment and deception are mechanistically distinct and that if deception were cheap the system would break. That is a valid check on the assumptions. However, you are right about the implications of the assumptions you actually set. You correctly identified that the mental residue acts as a binding mechanism that makes transparency the only viable strategy for a rational agent. Your roommate is fighting the hypothetical by imagining cheap deception, while you are following the hypothetical to its logical conclusion. The insight that rationality forces genuine transparency is a stronger result than Parfit originally had because Parfit often relied on a normative claim about what rationality should be, whereas your setup demonstrates a functional reason why rationality must be transparent given certain physical and cognitive constraints.

  Overall I think you come out ahead in this debate. You managed to integrate the new constraints into a coherent picture of agency where internal consistency is rewarded by the environment. Your roommate identified a potential failure mode if the costs were different, but they missed that the costs you proposed close that loophole. The beauty of your variation is that it suggests honesty might not just be a moral virtue but a cognitive efficiency hack in a world where minds are legible. If lying burns resources and makes you less reliable in the future, then the rational thing to do is to align your intentions with your actions so you do not have to pay the tax of dissonance. This vindicates Parfit's intuition that rationality and morality might converge, but it does so by showing that the convergence is driven by the economics of cognition and information. You successfully showed that in a world with scanners and cognitive residue, you cannot game the system because the cost of gaming is higher than the cost of playing straight, and that is a profound reinforcement of the idea that rational agents become transparent.
