          *   Actually, the roommate's deeper point is about the *nature* of the scanner. If the scanner reads intentions, and I can cultivate an intention to pay while knowing I will defect later (self-deception), is that costly? The user says yes. The roommate says commitment changes preferences, deception hides them.
