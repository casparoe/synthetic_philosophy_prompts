      Keynes's 1930 essay *Economic Possibilities for our Grandchildren* envisions a post-scarcity utopia where technological progress solves the "economic problem," freeing humanity for the "art of living." Six years later, *The General Theory* (1936) depicts a capitalism prone to chronic underemployment due to insufficient effective demand. Reconciling these texts requires examining whether the macroeconomic dynamics of 1936 can structurally support the ethical vision of 1930.

