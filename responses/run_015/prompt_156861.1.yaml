answer: |-
  **Project Title:** The Architecture of Deception: Re-evaluating Augustine's Taxonomy in *De Mendacio*

  **Research Question**
  In *On Lying* (*De Mendacio*), Augustine outlines an eight-fold hierarchy of lies, ranking them from worst to least bad, while maintaining that all are sinful. Current scholarship typically interprets this either as rigid deontology (where the ranking is rhetorical decoration) or as proto-consequentialism (where the ranking implies a hidden utility calculus). This project asks: Does Augustine's distinction between lying *in enuntiatione* (with words) and lying *in corde* (in the heart) perform genuine philosophical work? Specifically, can this distinction sustain the hierarchy without collapsing into utilitarianism, and does it provide a coherent framework for evaluating benevolent omission?

  **Significance and Gap in Scholarship**
  The standard dichotomy—Augustine as either an inflexible absolutist or a secret consequentialist—fails to account for the internal mechanics of his taxonomy. If the ranking is merely decorative, the text lacks argumentative cohesion; if it is consequentialist, it contradicts Augustine's explicit theological commitments. Neither view adequately analyzes the separation between the external sign (the word) and the internal will (the heart). By treating this distinction as a structural variable rather than a theological footnote, this project offers a third path: that the gravity of the lie is determined by the degree of dissonance between sign and intent, rather than the outcome of the lie. This resolves the tension between the absolute prohibition and the graduated severity.

  **Methodology**
  This is a solo, text-based project requiring no travel. The work proceeds in three phases over three months:
  1.  **Textual Mapping:** A close reading of standard translations of *De Mendacio* to isolate every instance where the "heart/word" distinction is invoked. I will construct a logical map of the eight-fold taxonomy, coding each category by the alignment of intent and utterance.
  2.  **Structural Analysis:** Using conceptual tools analogous to speech-act theory, I will test whether the "will to deceive" can logically come apart from the "false utterance" within Augustine's framework. I will examine if the ranking correlates to the magnitude of this separation.
  3.  **Edge Case Testing:** I will apply this mapped framework to the specific case of benevolent omission (withholding truth to prevent harm). This tests the system's limits: does the framework accommodate omission without breaking the absolute prohibition?

  **Possible Conclusions and Deliverables**
  The primary deliverable will be a 15-page paper containing a visual taxonomy of *De Mendacio* and an argument regarding the status of benevolent omission.
  *   **Positive Outcome:** The heart/word distinction holds. The ranking reflects the ontological severity of the internal/external split, not the external consequences. Benevolent omission is categorized as a lesser lie due to reduced internal dissonance, though still sinful.
  *   **Negative Outcome (Falsification):** The distinction collapses under scrutiny (i.e., Augustine cannot consistently separate intent from utterance in the lower tiers). In this case, the paper will argue that the text is indeed rhetorically inconsistent, validating the "absolutist with decorative ranking" view but proving it via structural failure rather than assumption.

  **Scope and Feasibility**
  The scope is strictly limited to *De Mendacio*, excluding later works like *Against Lying* to ensure depth over breadth. Three months is sufficient for a single scholar to complete the close reading and logical mapping without archival research. The project is low-risk: even if the hypothesis is falsified (i.e., the distinction collapses), the resulting negative finding clarifies a longstanding scholarly deadlock. The budget is minimal, requiring only access to standard textual databases and translation comparisons.
