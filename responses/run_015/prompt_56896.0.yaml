  I do not believe your request rests on a confusion, though your verdicts contain a tension that must be resolved to form a coherent principle. Specifically, your oscillation on the Large Language Model (8) and your rejection of the Ant Colony (6) while accepting the Chess Engine (1) reveals that you are not tracking mere predictive success, nor merely biological status. You are tracking a specific architectural feature: the presence of a **unitary, decouplable internal model**.

  Your draft clauses were close, but Clause (iii) ('vulnerability to reasons') was too anthropocentric, and Clause (i) ('predictive cost') was too epistemic. Your verdicts are ontological. You are willing to attribute belief where the system possesses an internal state that *mediates* between input and output, can *misrepresent* the world, and is *functionally integrated* enough to count as a single agent.

  Here is the principle that best captures your commitments.

  ### The Principle of Decouplable Internal Modelling

  A system is a genuine believer (and not merely a shorthand locus of intentionality) if and only if it satisfies three conditions:

  1.  **Predictive Indispensability:** The intentional stance yields predictions of the system's behaviour that are significantly more robust or tractable than the physical or design stances, particularly under novel conditions.
      *   *Motivation:* This secures Cases 1, 4, and 7, and excludes Case 5 (Hurricane). In Case 5, fluid dynamics is the superior explanation; in Case 4, the 'clerk' metaphor is the *only* working tool.
      *   *Exclusion:* It excludes systems where physical causation is transparent and sufficient (Case 3, initially).

  2.  **Decouplable Mediation:** The system's behaviour is mediated by an internal state that tracks environmental features but is capable of diverging from them (misrepresentation), such that the system can act on false information as if it were true.
      *   *Motivation:* This is the heavy lifter. It secures Case 7 (Grandmother): her brain holds a model of 'mother' that diverges from reality, yet drives action. It secures Case 2 (Explained Chess): knowing the code confirms the existence of an evaluation function (a model) rather than removing it.
      *   *Exclusion:* It excludes Case 3 (Vacuum). A contact switch does not 'model' an obstacle; it reacts to contact. There is no state to be false. It excludes Case 5 (Hurricane): the storm does not represent the warm water; it is physically coupled to it.

  3.  **Functional Unity:** The internal model is housed within a functionally integrated boundary that arbitrates conflicting drives or inputs to produce a single course of action, rather than emerging from the uncoordinated aggregate of sub-agents.
      *   *Motivation:* This secures Case 1 (Chess) and excludes Case 6 (Ants). The chess engine has a single evaluation function arbitrating moves. The ant colony has no central arbiter; the 'decision' is an emergent statistical property of many disjoint agents.
      *   *Exclusion:* It excludes Case 6 (Ant Colony) and potentially Case 8 (LLM), depending on how one views the coherence of the transformer architecture (see below).

  ---

  ### Application to New Cases

  **1. A satellite's attitude-control system.**
  *Verdict:* Shorthand.
  *Reasoning:* Fails Clause 2. Most attitude control uses PID loops or star-trackers that are tightly coupled to physical inputs. Unless it possesses a map of the sky that it can be 'wrong' about in a way that persists despite correction, it is a reflex mechanism (like the vacuum).

  **2. A central bank's stated expectations about inflation.**
  *Verdict:* Shorthand.
  *Reasoning:* Fails Clause 3. The 'bank' is a committee of humans and models. There is no unitary internal state that decouples from reality; there are only conflicting reports, political pressures, and aggregated data. The 'expectation' is a public utterance, not an internal model driving a single agent's behaviour.

  **3. A cuttlefish matching the seabed.**
  *Verdict:* Genuine.
  *Reasoning:* Passes all three. It predicts the cuttlefish's colour change better than physics (1). It uses a visual model of the environment that can be fooled by illusions (2). It is a single organism with a central nervous system arbitrating the display (3).

  **4. A neural network whose weights and training data I can inspect exhaustively.**
  *Verdict:* Genuine.
  *Reasoning:* Passes all three. This forces a resolution to your Case 8. If the Chess Engine (1) is a believer, this network is too. It has an internal model (weights) that mediates input/output, can be wrong (hallucinate), and functions as a unitary system during inference. Your oscillation in Case 8 is the only inconsistency in your list.

  **5. A person acting on a post-hypnotic suggestion.**
  *Verdict:* Genuine.
  *Reasoning:* Passes Clause 2 and 3. The person is a unitary agent. The belief is false (that they must perform the action), but it is mediated by their internal state. The fact that the origin is external (hypnotist) does not negate the reality of the belief state, much like your Grandmother (7).

  **6. A dead relative's estate as described in their will.**
  *Verdict:* Shorthand.
  *Reasoning:* Fails Clause 2 and 3. The estate has no internal state. It is a legal shell executed by lawyers (agents) and code (banking systems). To say the estate 'wants' to preserve the capital is to speak of the dead relative's past intent, not a current believing system.

