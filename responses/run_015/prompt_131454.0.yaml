prompt: |-
  hey — i'm a phd student in philosophy working on norm change, and i'm trying to think through the implications of Williams's honor-based story about moral revolutions (the idea that norms like dueling and slavery collapse mainly because elites stop seeing them as honorable, not because anyone actually wins the argument) together with Appiah's point that honor worlds contain internal contradictions that can be exploited to accelerate collapse. specifically, what are the most important implications of that combined framework for whether norms of unpaid academic labor — expecting grad students and adjuncts to do massive peer review and event organizing for free — could die through a rapid Williams-style shift in honor rather than through gradual policy reform? i'm particuarly stuck on whether Appiah's contradiction-exposure mechanism can work when the harmed group lacks the social standing to make the elite feel dishonored, or if Williams is right that the dominant class has to feel its own honor is threatened first. can you just lay out the main conceptual moves? don't worry about tracking down sources.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** PhD student in Philosophy.
      *   **Topic:** Norm change, specifically regarding unpaid academic labor (grad students/adjuncts doing peer review/event organizing).
      *   **Theoretical Framework:** Bernard Williams (honor-based moral revolutions, elites stop seeing practices as honorable) + Kwame Anthony Appiah (honor worlds contain internal contradictions that can be exploited).
      *   **Core Question:** Can unpaid academic labor norms die through a rapid Williams-style honor shift rather than gradual policy reform?
      *   **Specific Sticking Point:** Can Appiah's contradiction-exposure work when the harmed group (grads/adjuncts) lacks social standing to make elites feel dishonored? Or does Williams's requirement (dominant class must feel *their* honor threatened) hold firm?
      *   **Constraint:** Lay out the main conceptual moves. Don't worry about tracking down sources (keep it conceptual/argumentative).

  2.  **Deconstruct the Theoretical Framework:**
      *   **Williams on Honor/Moral Change:** Moral change isn't usually about winning rational arguments. It's about a shift in *ethical identity*. Elites stop doing X because X becomes incompatible with who they take themselves to be (their honor/standing). It's sociological/psychological, not just normative.
      *   **Appiah on Honor Codes:** Honor codes aren't monolithic. They have internal tensions/contradictions. Reformers can leverage these contradictions (e.g., "You claim to be civilized, but you do *this*?"). This creates cognitive dissonance within the honor world, leading to collapse.
      *   **The Synthesis:** Norms collapse when elites feel a loss of honor continuing them. This feeling is triggered by exposing contradictions within their *own* value system.

  3.  **Analyze the Target Norm (Unpaid Academic Labor):**
      *   **The Practice:** Grad students/adjuncts doing peer review, organizing conferences, admin work without pay/credit.
      *   **The Justification:** "Training," "Service," "Community Building," "Apprenticeship."
      *   **The Elite:** Tenured faculty, administrators, journal editors.
      *   **The Harmed:** Precarious academics (low status).

  4.  **Address the Core Tension (The User's Sticking Point):**
      *   *Problem:* Williams suggests elites need to feel *their* honor is at stake. Appiah suggests we can expose contradictions. But if the harmed group has no standing (no power to shame), can they trigger the elite's honor anxiety?
      *   *Williams's Constraint:* Yes, generally, the "audience" of honor must matter to the agent. If grad students don't matter to the tenured elite's self-conception, their complaint is noise.
      *   *Appiah's Loophole:* The contradiction doesn't have to come *from* the victim. It can come from *within* the elite's own self-conception or from a third party they *do* respect.

  5.  **Drafting the Conceptual Moves (Iterative Process):**

      *   *Move 1: Define the Honor Code of the Academy.* What do professors value? "Rigorous inquiry," "Mentorship," "Collegiality," "Meritocracy." Unpaid labor is framed as "apprenticeship."
      *   *Move 2: Identify the Contradiction (Appiah).* The contradiction isn't "exploitation vs. fairness" (moral argument). It's "exploitation vs. *our specific self-image*." E.g., If we value meritocracy, but rely on unpaid labor that excludes the poor, we aren't meritocratic. If we value mentorship, but treat mentees as staff, we aren't mentors.
      *   *Move 3: The Standing Problem (Williams).* Can grads shame professors? Usually no. They are supplicants. So, the shame must come from elsewhere.
      *   *Move 4: Mechanisms for Bypassing Standing.*
          *   *Internal Dissonance:* The elite starts feeling dirty even without external shaming (conscience as internalized honor).
          *   *Lateral Shaming:* Other elites (prestigious universities, famous philosophers) call it out.
          *   *Reframing the Victim:* It's not about the grad student's suffering; it's about the *quality of the discipline*. (e.g., "Unpaid review leads to bad science").
      *   *Move 5: Rapid Shift vs. Policy.* Policy is slow. Honor shifts are contagious. If one top journal says "No unpaid review," others follow to maintain status.

  6.  **Refining the Argument (Addressing the User's Specific Worry):**
      *   The user worries: *Can Appiah work if the harmed lack standing?*
      *   Answer: Appiah's mechanism relies on the *logic* of the honor code, not necessarily the *voice* of the victim. The contradiction exists objectively within the code. The trick is finding a messenger the elites *do* honor.
      *   Also, Williams allows for "ethical identity" to change. If being an "ethical academic" gets redefined, the lack of pay becomes a stain on *the professor*, not just a harm to *the student*.

  7.  **Structuring the Response:**
