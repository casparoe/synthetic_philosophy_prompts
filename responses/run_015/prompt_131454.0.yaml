answer: |-
  This is a sharp synthesis. You're essentially asking whether the **Appiahian lever** (exposing internal contradictions) can function within a **Williamsian engine** (elite ethical identity) when the **feedback loop** (shaming capacity) is broken by status asymmetry.

  Here are the main conceptual moves to unpack whether unpaid academic labor can collapse via honor shift rather than policy grind.

  ### 1. Define the Specific Honor Code (The Williamsian Baseline)
  First, you have to specify what "honor" means in the contemporary academy. It isn't dueling honor. It is **professional prestige grounded in ethical self-conception.**
  *   **The Code:** Academics view themselves as stewards of truth, mentors to the next generation, and members of a collegial republic of letters.
  *   **The Practice:** Unpaid labor (peer review, organizing) is currently coded not as "exploitation" but as "service" or "apprenticeship."
  *   **The Williams Condition:** For this norm to die, tenured elites must stop seeing unpaid labor as *service* and start seeing it as *dishonorable*. It's not that they become convinced it's "unjust" (moral argument); it's that they become convinced *they are not the kind of person who does this* (ethical identity).

  ### 2. Locate the Appiahian Contradiction
  Appiah argues honor worlds aren't monolithic; they have fault lines. You need to identify the contradiction internal to the *elite's* values, not the *victim's* suffering.
  *   **The Contradiction:** The academy claims to value **Meritocracy** and **Rigorous Inquiry**.
  *   **The Tension:** Unpaid labor structurally excludes those who cannot afford to work for free (undermining Meritocracy) and incentivizes speed/favoritism over quality in peer review (undermining Rigor).
  *   **The Move:** The argument isn't "Grad students are suffering." The argument is "This practice makes *us* bad scholars and *our* discipline corrupt." The contradiction is between "We are the guardians of quality" and "We rely on a coercive system that degrades quality."

  ### 3. Address the Standing Problem (Your Sticking Point)
  This is the crux. Williams suggests the "audience" of honor must matter to the agent. If grad students/adjuncts lack standing, their shaming attempts are noise, not honor-threats. **Williams is right here: the victim cannot be the primary agent of the honor shift.**

  However, Appiah's mechanism doesn't require the *victim* to expose the contradiction. It requires the contradiction to be *visible* to the honor-holding class. There are three conceptual workarounds to the standing problem:

  *   **Lateral Shaming (Peer-to-Peer):** The shaming must come from elites whom other elites respect. If a top-tier journal or a prestigious department declares unpaid labor "beneath us," it triggers a status race. No one wants to be the department that still relies on "sweatshop" review while peers claim to have "professionalized."
  *   **Internalized Audiences:** Academics have internalized the "ideal scholar." If the contradiction is framed as a betrayal of that ideal (e.g., "Real mentors don't exploit apprentices"), the elite feels dishonored even without external shaming. The "audience" is their own self-conception.
  *   **Reframing the Harm:** The harm must be translated into a language that carries weight. "Exploitation" is a moral claim (low standing victims). "Systemic Bias" or "Epistemic Corruption" is a disciplinary claim (high standing stakes). If unpaid labor is framed as threatening the *integrity of the literature*, elites feel their honor threatened because their output is tainted.

  ### 4. The Mechanism of Rapid Collapse (Tipping Points)
  Policy reform is additive (negotiate, vote, implement). Honor shifts are contagious (tipping points).
  *   **The Cascade:** Once a critical mass of high-status actors decides the practice is "shameful" (Williams), continuing it becomes a signal of low status.
  *   **The Speed:** This explains why norms like dueling or foot-binding collapsed relatively quickly once the elite turned. It's not that the arguments changed; it's that the *social cost* of continuing flipped.
  *   **Application:** If three major journals announce paid review, doing it for free shifts from "virtuous service" to "desperate amateurism." Adjuncts/grads refusing unpaid work isn't "striking"; it's "maintaining professional standards."

  ### 5. The Risk: Rationalization vs. Collapse
  The biggest counter-move to this framework is the academy's capacity for **rationalization**.
  *   **Williams's Warning:** Elites are excellent at重构 (reconfiguring) their honor codes to accommodate their habits. They can easily shift the definition of "mentorship" to include "learning the burden of service."
  *   **Appiah's Counter:** This only works if the contradiction remains latent. If the contradiction is made salient (e.g., data showing unpaid review correlates with lower quality or higher bias), rationalization becomes harder.
  *   **Implication:** For a rapid shift to occur, the contradiction must be made *unignorable*. It's not enough to point it out; the practice must become socially costly to defend in a seminar room or faculty lounge.

  ### Summary of the Verdict
  *   **Williams is right:** The harmed group (grads/adjuncts) lacks the standing to trigger the shift directly. Their moral arguments will likely be absorbed as "complaints" rather than honor-challenges.
  *   **Appiah is viable:** The contradiction exists within the elite's own self-conception (Meritocracy/Quality vs. Exploitation).
  *   **The Synthesis:** For the norm to die rapidly, the contradiction must be weaponized by **high-status actors** against **other high-status actors**. The narrative must shift from "Help the students" (charity) to "Protect the discipline's integrity" (honor).

  If the campaign remains framed around the *needs of the precarious*, it will likely remain a slow policy battle. If it is framed around the *shame of the tenured*, it has the potential for a Williams-style collapse. The conceptual key is **translating victim suffering into elite stain.**
