answer: |-
  Here is the specification for a Marxist theory of automation, sorted by necessity for your stated purpose (tactical advice to a union federation), followed by the impossibility theorem, the gatekeeper, and the scorecard.

  ### I. The Sort: Desiderata for a Tactical Theory

  The filter here is **operationalizability**. If a requirement cannot translate into a variable a union negotiator can assess *before* signing a contract, it belongs in the philosophy of history, not the spec.

  **Load-Bearing (Must be satisfied for the theory to function as advice)**

  1.  **Distinguish machinery from capitalist relations (without predictive paralysis).**
      *   *Case:* If you conflate them, you cannot argue for "socialist automation" later. If you separate them too cleanly, you cannot predict the immediate job loss under capitalism. The theory must model the *interaction*, not just the separation.
  2.  **Handle automation for control (net output loss).**
      *   *Case:* A union needs to know if a machine is a productivity tool or a discipline tool. If it's the latter, "efficiency" arguments from management are lies, and the bargaining strategy changes from "share the gains" to "resist the surveillance."
  3.  **Handle the apprenticeship cliff (skill decay).**
      *   *Case:* This determines the timeline of leverage. If the tech rots the skill base in 5 years, a "welcome and retrain" deal is a slow suicide pact. The theory must account for the reproduction of the worker, not just the consumption of their labour-power.
  4.  **Handle phantom automation (the threat effect).**
      *   *Case:* In bargaining, the *budget line* for a robot often matters more than the robot. If the theory only counts installed capital, it misses the primary lever capital uses to extract concessions *before* the tech arrives.
  5.  **Handle captive time (unpaid standby).**
      *   *Case:* Crucial for the "shorter week" option. If freed time is immediately colonized by on-call requirements, the metric of "hours saved" is false. The theory must measure *disposable* time, not just *contracted* time.
  6.  **Handle fictitious machinery (human-in-the-loop).**
      *   *Case:* If the "AI" is actually low-wage labour, bargaining for "automation protections" misses the actual exploitation site. The theory must be able to pierce the interface.
  7.  **Stay consistent with boring facts (Solow paradox, polarisation).**
      *   *Case:* If the theory predicts mass unemployment where there is none, or mass upskilling where there is deskilling, the union will lose credibility. It must fit the empirical trend lines to be trusted.

  **Nice-to-Have (Useful context, but not decisive for the specific decision)**

  8.  **The global dimension.**
      *   *Reason:* While vital for international solidarity, a specific sectoral union often lacks the leverage to stop offshoring or account for global labour arbitrage in a single-firm negotiation. It's a constraint, not a decision variable.
  9.  **The refused machine (capital declines tech).**
      *   *Reason:* This explains why automation *doesn't* happen. While useful for understanding capital's limits, it doesn't help the union decide what to do when the machine *is* arriving.
  10. **Discourse cycles (panic/enthusiasm).**
      *   *Reason:* Helpful for framing communications, but secondary to the material impact. Unless linked to Phantom Automation, this is cultural analysis, not tactical theory.

  **Camp Prejudice (Theoretical commitments that hinder the specific purpose)**

  11. **Generate displacement AND reinstatement from one mechanism.**
      *   *Reason:* This is a macro-historical requirement (justifying the survival of the class), not a micro-tactical one. Knowing the *system* will create new jobs elsewhere does not help *this* union decide whether to fight for *these* jobs. It creates a false comfort that dilutes tactical urgency.
  12. **Define the emancipatory upshot (whose judgement?).**
      *   *Reason:* This is a political norm, not a theoretical spec. The theory should illuminate the *consequences* of each option (Fight/Welcome/Shorten); it should not pre-decide which consequence counts as "emancipation." That is for the union congress to vote on.

  ---

  ### II. The Impossibility Theorem

  You suspected the tension lay between **Systemic Mechanism (Displacement/Reinstatement)** and **Local Decision**. You are correct, but the contradiction is sharper when combined with the **Control Requirement**.

  **The Incompatible Subset:**
  1.  **Load-Bearing 1:** Distinguish machinery from relations (predictively).
  2.  **Load-Bearing 2:** Handle automation for control (non-productive).
  3.  **The Purpose:** Issue a definitive verdict (Fight/Welcome/Shorten) for a specific technology.

  **The Contradiction:**
  To issue a definitive verdict on a specific technology (Purpose), the theory must be able to predict the *outcome* of that technology's introduction. However, if the theory acknowledges that automation is often driven by **Control** (Load-Bearing 2) rather than productivity, the economic "cost-benefit" analysis becomes unintelligible to the union *ex ante*. A machine that lowers output but increases discipline is a "bad" investment economically but a "good" one politically for capital.

  Furthermore, if the theory must **Distinguish machinery from relations** (Load-Bearing 1), it admits that the outcome is contingent on the class struggle *itself*.
  *   If the outcome is contingent on the struggle, you cannot advise the struggle *before* it happens without circularity (i.e., "Fight if you can win").
  *   If the outcome is determined by the machine, you violate the distinction between machinery and relations (technological determinism).

  **Result:** You cannot build a theory that is simultaneously **relational** (Marxist), **cynical enough to spot control motives** (Bravermanesque), and **determinate enough to offer a pre-emptive verdict**. A theory adequate to the *politics* of automation is too indeterminate to offer a technical verdict; a theory adequate to the *verdict* is usually too deterministic to account for the politics.

  *Advice:* Drop the demand for a "Verdict." Change the deliverable to a "Map of Leverage Points." The theory shouldn't say "Fight"; it should say "If you fight, here is where the control motive makes them vulnerable," or "If you welcome, here is where the apprenticeship cliff will undermine you in year three."

  ---

  ### III. The Gatekeeper

  **Requirement 1: Distinguish machinery from capitalist relations, without that distinction becoming an excuse for saying nothing predictive.**

  This is the exclusionary razor.
  *   **Drop it, and you let in:** Bourgeois economics (which treats the machine as neutral and the outcome as efficient) *and* Post-structuralist STS (which often treats the machine as purely social construction with no material constraints).
  *   **Why it excludes:** It forces the theory to acknowledge that the machine has a physical logic (it *does* cut labour time) while insisting the *use* of that logic is social (it *may* cut wages instead). Any reading that collapses into "tech determines society" or "society determines tech" fails here. It is the hardest requirement to satisfy because it demands a dialectical operationalization, not just a philosophical assertion.

  ---

  ### IV. Scorecard

  **The Productivist Reading**
  *   *Verdict:* Fails Load-Bearing 2 (Control).
  *   *Critique:* Assumes automation is always for productivity. Cannot explain why capital would install a net-loss machine. Advises "Welcome" based on growth that may not materialize. Good on Boring Facts, bad on Power.

  **The Labour-Process / Deskilling Reading**
  *   *Verdict:* Fails Load-Bearing 1 (Predictive Distinction).
  *   *Critique:* Excellent at spotting Control motives. However, often slides into technological pessimism where the machine *always* deskills. Struggles to account for new tasks (Reinstatement) without looking like it's making excuses for capital. Strongest on the "Fight" option, weak on "Shorten."

  **The General-Intellect / Immaterial-Labour Reading**
  *   *Verdict:* Fails the Purpose (Decision).
  *   *Critique:* Great at handling Discourse and Fictitious Machinery. However, operates at such a high level of abstraction (social factory, cognitive capitalism) that it cannot advise a specific sectoral union. Tends to view the "refusal of work" as the only valid strategy, making the "Shorten" or "Welcome" options theoretically incoherent.

  **The Convivial-Tools / Neo-Luddite Reading**
  *   *Verdict:* Fails Boring Facts (10) and Refused Machine (7).
  *   *Critique:* Strong on Emancipatory Upshot (worker control). However, often assumes a moral choice for capital ("they could choose otherwise") which contradicts the competitive coercion of the market. Cannot explain why capital *refuses* safe machines. Good for moral framing, bad for bargaining leverage.
