          1.  Acknowledge the strength of the position (it aligns with current "infrastructure turn").
          2.  Present the Ranked Defeaters.
          3.  Address the Unfalsifiability/Insulation charge directly.
          4.  Suggest refinements to save the theory.

      *(Self-Correction during drafting)*: I need to make sure I don't just repeat "maintenance matters." The user knows that. I need to challenge the *ontological status* of the politics in the decay.
      *Refinement on Fatal Defeater:* The strongest challenge is **Material Determinism vs. Social Constructivism**. If the rust *forces* the decision regardless of human will, is it politics or just physics? If the politics lies only in the *response* to the rust, then the rust itself isn't political, the *management* is. This distinguishes the artifact from the system.

      *Refinement on Unfalsifiability:* To avoid being unfalsifiable, the student needs to specify a mechanism. Not just "it's political," but "it *distributes power* in way X." If a decay process distributes nothing, is it political?

  7.  **Finalizing the Content:**
      *   *Reference Key Scholars:* Winner, Langdon; Star, Susan Leigh; Jackson, Steven; Graham, Stephen; Marvin, Lucy; Carse, Allison (Panama Canal).
      *   *Defeater 1 (Fatal):* The "Epiphenomenal Materiality" problem. If the material behavior is irrelevant to the political outcome.
      *   *Defeater 2 (Fatal):* The "Tautology of Power." If all consequences are political, none are.
      *   *Defeater 3 (Serious):* The "Locus of Agency" problem. Is the rust acting, or the manager interpreting the rust?
      *   *Defeater 4 (Awkward):* The "Identity Threshold." When does maintenance become replacement?
      *   *Unfalsifiability:* Discuss the need for a counterfactual.

  8.  **Review against constraints:**
