  Hey — I run a tiny informal reading group (me plus five or six grad students, mostly formal epistemology and decision theory, plus one statistician who keeps saying just model the protocol) and we have burned two sessions on the swamp case — parachuted behind enemy lines, four quadrants (two armies crossed with HQ versus second company), and a message from HQ that tells you nothing directly about where you are but constrains the conditional probability of being in HQ within each army's territory. We keep talking past each other, because everyone defends a rule by its name instead of by what it does to the numbers.

  So I want a flowchart: start from the bare situation (a message that constrains conditional probabilities inside the cells of a partition and says nothing directly about which cell you are in) and end at a named updating rule. Deliverable: at most seven branch questions, each a concrete case with real numbers, each with two or three answer options and a go-to instruction, and leaves labeled with the name of the rule, or unnamed if nobody actually defends it.

  The leaves I need to see:

  - hold the army-partition marginals fixed and just reset the conditionals inside each cell (the answer people associate with the original case)
  - the mirror image: hold the HQ-partition marginals fixed instead (if that is even coherent — see case 3)
  - minimum-information or maxent style updating: impose the announced conditionals as hard constraints and otherwise stay as close to your prior as possible
  - the statistician's rule: do not impose constraints at all, model who sends which message in which situation (a likelihood function over messages) and conditionalize on the fact that this message arrived
  - at least one leaf for there is no unique rational posterior here, you need more structure before you can move

  Please build the branch nodes out of these cases rather than inventing your own, at least for the first four:

  1. Warm-up: uniform prior over the four quadrants, message says P(HQ | Red) = 3/4 and P(HQ | Blue) = 1/4. I think basically every rule spits out 3/8, 1/8, 1/8, 3/8 here, so it probably should not be a branch node at all — tell me if I am wrong and it does discriminate after all.

  2. The one I cannot stop thinking about: prior is P(Red) = 0.4, P(Blue) = 0.6, and within Red territory you are 60/40 on HQ, within Blue territory you are 20/80 on HQ. The message says 70/30 within Red and 50/50 within Blue. Question for the node: does your confidence about which army's territory you are in move at all? Army-rigidity says no, it stays at 0.4. I have a vague sense that minimum-information says something else, and something slightly embarassing, because the message is a much bigger jolt to your conditional inside Blue territory than inside Red — does that make min-info come out more confident that you are in Red, and by roughly how much? If the two rules actually agree here, find me the nearest variant of this case where they come apart and say which direction each one moves.

  3. The over-constrained one: P(HQ) = 0.5 in your prior, and the message says P(HQ | Red) = 0.9 and P(HQ | Blue) = 0.6. Now you cannot keep P(HQ) where it was and satisfy the message — I get a negative probability when I try, so tell me if I messed up the arithmetic. The node: which marginal do you give up, do you move both partway, do you reject the message as inadmissible, or does this show the whole which-partition-is-rigid framing was the wrong frame?

