answer: |-
  This is an exceptionally sharp formulation of a debate that often gets muddied by terminology. You have correctly identified that the dispute isn't really about whether evolution happens, but about the *logical status* of the explanatory principle used to account for it. You are effectively arguing for a Lakatosian interpretation (Natural Selection as a "hard core" protected by a "protective belt") against a naive falsificationist or realist interpretation held by your friend.

  Popper himself eventually conceded much of this. In the 1970s, he retracted his earlier claim that Darwinism was a tautology, admitting that it could be formulated testably. However, your intuition that the *general principle* often functions as a framework rather than a specific law is philosophically robust.

  Here is an analysis of what would count against your position, ranked from fatal to merely awkward, followed by the historical cases you requested and the meta-analysis of your own claim.

  ### Part 1: Evaluating Your Three Scenarios

  **1. The Shadow Populations (Ex Ante Engineering Predictions)**
  *   **The Scenario:** We predict fitness differences based on biomechanics/physiology *before* observing reproduction, and the population trajectories match.
  *   **Verdict:** **Fatal to your specific formulation, but not to the broader philosophical stance.**
  *   **Why:** Your core argument rests on the claim that fitness is only defined *post hoc* by survival ("who actually survives"). If we can measure the *propensity* for survival (e.g., metabolic efficiency, drag coefficient, thermal tolerance) independently of the reproductive outcome, and that measure predicts the reproductive outcome, the charge of tautology collapses.
  *   **The Duhem-Quine Worry:** You are right to worry that we are testing "Engineering Model + Selection" rather than "Selection" alone. However, this is true of *all* science. When we test General Relativity, we test "GR + Telescope Optics + Atmospheric Model." If the prediction holds across hundreds of independent lineages with different engineering models, the common factor doing the work is the principle of selection.
  *   **Concession:** If this works consistently, you must concede that Natural Selection (NS) functions as an empirical theory in practice, even if its abstract formulation is framework-like. You would have to retreat from "NS is metaphysical" to "NS is a high-level law instantiated by lower-level physical constraints."

  **2. The Replacement Lemma (Underdetermination/Equifinality)**
  *   **The Scenario:** Any frequency record can be fitted equally well by a selection model or a neutral/demographic model.
  *   **Verdict:** **Serious, but likely false empirically.**
  *   **Why:** This is the problem of *equifinality*. If true, it implies NS is empirically empty because it cannot be distinguished from drift. However, modern population genetics relies on the fact that selection and drift leave different *statistical signatures* (e.g., site frequency spectra, linkage disequilibrium patterns).
  *   **The Threat:** If it were proven that for *any* dataset, a neutral model fits as well as a selection model (given enough parameters), then NS is indeed just a curve-fitting exercise. This would vindicate the "metaphysical research programme" view.
  *   **Concession:** You don't need this to be universally true to win your point. If it is true in a significant class of cases (e.g., morphological evolution over short timescales), it supports your claim that NS is often used as a "just-so story" generator rather than a tester. But since statistical methods (like McDonald-Kreitman tests) *do* distinguish them in practice, this lemma is likely false as a universal claim.

  **3. Stasis (Unchanged Lineages)**
  *   **The Scenario:** Environment shifts, traits don't. Explanation: "Stabilizing selection" or "Constraint."
  *   **Verdict:** **Merely Awkward.**
  *   **Why:** This is the classic "adaptive landscape" defense. If the optimum moves but the population stays, either the optimum didn't move (measurement error) or the population is stuck on a local peak (constraint).
  *   **The Threat:** This only hurts you if "constraint" is defined purely negatively ("it didn't move, so it must be constrained"). If constraints are measured *independently* (e.g., lack of genetic variance, developmental channeling), then predicting stasis is a successful prediction.
  *   **Concession:** You are right that this is the weakest link in the biologist's armor. It is the most common place for ad hoc rescue. However, it doesn't falsify your view; it just highlights where the "protective belt" is thickest.

  ### Part 2: Historical Defeaters (The "Smoking Gun")

  You asked for a case where a selectionist prediction was made, failed, and the field treated it as counting *against selection* rather than an auxiliary assumption. This is the hardest request because of the Duhem-Quine problem, but there is one massive historical example:

  **The Neutral Theory of Molecular Evolution (Kimura, 1968)**
  *   **The Prediction:** Prior to 1968, the "Selectionist Orthodoxy" assumed that most genetic variation at the molecular level was maintained by balancing selection. The prediction was that protein polymorphism would correlate with ecological heterogeneity and that substitution rates would vary wildly based on functional importance.
  *   **The Failure:** Data showed a "molecular clock"—substitution rates were constant over time and across lineages, regardless of ecological changes. This was incompatible with strong selectionist models (which would vary with environmental pressure).
  *   **The Concession:** The field *did not* say "Our measurement of the environment was wrong." They conceded that **Natural Selection was not the primary driver at the molecular level.** They accepted Drift as the null hypothesis for molecular data.
  *   **Why this matters:** This is a retreat of the *domain* of Natural Selection. It shows the theory is not all-encompassing. It vindicates your view that NS is a specific causal claim that can be displaced by other mechanisms (drift), rather than a tautology that explains everything by definition.

  **A Specific Case: The "Adaptationist Programme" Critique (Gould & Lewontin, 1979)**
  *   While not a single experiment, this paper successfully shamed the field out of assuming selection for every trait.
  *   **Example:** The spandrels of San Marco. Traits previously argued to be adaptations (selected for) were re-interpreted as architectural byproducts (constraints).
  *   **Result:** Biologists stopped publishing pure selectionist stories without phylogenetic controls. The *methodology* changed because the selectionist predictions were deemed too easy to generate and too hard to falsify. This is a sociological falsification of the "NS explains everything" stance.

  ### Part 3: Falsifying Your Claim (The Meta-Question)

  Your claim is: *"Natural Selection, as actually used, is a metaphysical research programme rather than a falsifiable empirical theory."*

  This is a claim about the **sociology and logic of scientific practice**. To falsify *your* claim, one does not need to prove evolution is true. One needs to prove that biologists treat NS as a falsifiable theory.

  **What would falsify your position?**
  1.  **Systematic Abandonment:** If we observed a pattern where specific selection hypotheses are routinely abandoned *without* being replaced by new selection hypotheses (i.e., the field accepts "we don't know" or "it was drift" rather than inventing a new adaptive story).
      *   *Status:* This is actually happening with the rise of Null Hypothesis testing in evolutionary biology. If this trend continues, your claim becomes historically outdated.
  2.  **Novel Prediction Success:** If the "Selection Framework" consistently predicts *novel* phenomena that are not just redescriptions of the past.
      *   *Example:* Experimental Evolution (e.g., Lenski's E. coli). Researchers predict *which* mutations will fix based on metabolic models, and they occur. If this becomes routine engineering rather than post-hoc storytelling, NS moves from "metaphysical programme" to "engineering law."
  3.  **Popper's Retraction:** You should know that Popper himself falsified his own earlier claim. In *Unended Quest* (1976), he wrote: *"I have changed my mind about the testability and logical status of the theory of natural selection... The theory is not tautological... it makes assertions which could be refuted."*
      *   *Why:* He recognized that if you specify the environment and the heritable variation, the theory predicts directional change. If the change goes the other way, the theory is falsified (unless you posit drift, which is a competing theory, not an ad hoc rescue).

  ### Part 4: Ranking the Defeaters

  Here is how you should rank the threats to your position, from Fatal to Awkward:

  1.  **Fatal:** **Independent Propensity Measurement.** If fitness components (survival probability, mating success) can be measured *causally* (biomechanics, physiology) prior to reproduction, and these measurements predict reproductive success quantitatively across diverse contexts, the "tautology" charge is dead. NS becomes a causal mechanism like gravity, not a logical truth.
  2.  **Severe:** **The Neutral Theory Precedent.** The fact that the field already conceded the molecular level to drift proves NS is not a universal framework that explains everything. It is a specific hypothesis about causation that can be false. If this extends to morphological traits (e.g., "Constructive Neutral Evolution"), your view that NS is the "only game in town" (even as a framework) weakens.
  3.  **Moderate:** **Experimental Evolution.** If we can evolve organisms in the lab to meet pre-specified engineering goals using selection pressures, NS is an engineering tool, not just a historical narrative.
  4.  **Awkward:** **Stasis and Constraints.** As long as "constraints" are measurable independently (e.g., via developmental biology), explaining stasis isn't ad hoc. It only becomes ad hoc if "constraint" is just a name for "didn't change."

  ### Part 5: The Honest Meta-Conclusion

  You asked for honesty about the meta-question. Here it is:

  **Your position is historically defensible but scientifically narrowing.**

  You are correct that the *general statement* "Natural Selection occurs" is hard to falsify in isolation because it relies on a ceteris paribus clause (no drift, no migration, no mutation). In that abstract sense, it *is* a Lakatosian hard core.

  **However,** your friend is correct that *specific selectionist hypotheses* (e.g., "Trait T evolved due to selection pressure P in environment E") are highly falsifiable. They fail all the time. When they fail, biologists usually pivot to drift, constraint, or pleiotropy.

  **The Verdict:**
  If you claim "The Theory of Natural Selection is unfalsifiable," you are attacking a straw man. No working biologist defends the abstract theory in isolation; they defend specific models.
  If you claim "The *Adaptationist Heuristic* often functions as an unfalsifiable framework that insulates itself from refutation," **you are on very solid ground.**

  **What falsifies your claim?**
  Evidence that the "Adaptationist Heuristic" is self-correcting. The Neutral Theory revolution is that evidence. The field *did* correct itself. It *did* accept that selection wasn't the answer. Therefore, the programme is not metaphysically insulated; it is empirically responsive.

  **Advice for the argument:**
  Concede the abstract point (NS as a general principle is a framework) but press the concrete point (Adaptationist stories are often unfalsifiable post-hoc narratives). Acknowledge Popper's retraction but cite Gould & Lewontin to show that the *practice* of biology often falls into the trap you described, even if the *logic* of the theory doesn't require it. This splits the difference: your friend is right about the theory's potential, you are right about its frequent misuse.
