answer: |-
  **The Gun, The Badge, and The Dash**

  Last month, I suggested that the question of who may use a reclaimed slur is not settled by group membership alone. The interesting cases are the fractures: the insider using the word as a weapon against their own; the outsider singing along in a stadium; the comedian quoting the bigot to mock him. The response from readers has been voluminous, but it has converged on two images. I want to audit them.

  The first comes from a reader in Leeds: a slur is a loaded gun. It is dangerous in anyone's hands; it does damage whether you meant to fire it or not. Insisting you were only playing with it does not make it safe. Therefore, the only responsible policy is universal prohibition. Reclamation is, at best, private comfort; at worst, a delusion that the safety catch is on.

  Let us map this. The speaker is the shooter; the word-token is the bullet; the hearer is the target. Intention is the pull of the trigger. Offence is the ballistic wound. History is the manufacture of the weapon.

  Where does the correspondence fail? A gun's capacity to wound is a stable causal power of the token, fixed independently of what any audience believes. If this were true of language, the 'mishearing' case—a word that merely sounds like the slur, with an unrelated etymology, leaving hearers wounded all the same—would count as a firing rather than a malfunction. It isn't; it is a category error. Furthermore, the slow death of an obsolete insult would be impossible to describe. Words lose their charge; bullets do not lose their powder. The gun metaphor imports the idea that harm is intrinsic to the object. It is not. Harm is a social event. The reader's conclusion—that we must prohibit because the weapon is always live—collapses once we admit the 'safety' is not mechanical but communal. The gun cannot be repaired; it misidentifies the nature of the danger.

  The second image comes from a musician: a slur is a regimental badge. It wounds only when worn by someone with no right to it. On the right chest, it is a mark of honour. Membership is the whole story; the hard cases dissolve once you ask who is wearing it.

  Map this: the speaker is the wearer; the word is the insignia; the hearer is the observer. Offence is stolen valor. History is the regiment's lineage.

  This picture is more seductive, but it also breaks. It imports the idea that the right to the word is something a speaker can possess and carry around, rather than something a practice confers and can withdraw. A badge is property; a word is a performance. The relevant relation runs not between speaker and word, but between speaker, hearer, and the institution the word belongs to. The badge metaphor fails the 'insider insult' test. If a member of the targeted group uses the word to degrade another member, they are wearing the badge 'correctly' by the musician's logic, yet the wound is real. Membership does not settle everything. The badge assumes the right is static. It is not. This conclusion also fails, though it is closer to the truth: it identifies that authority matters, but mistakes authority for ownership.

  So, is there a better analogy? A key? A boundary marker? The honest answer is that this part of language has no good mechanical analogue. Guns and badges are tools and objects; slurs are acts. They live in the space between people, not in the throat or the dictionary. To look for a mechanism is to look for a lever where there is only a current. We cannot engineer safety; we can only negotiate it.

  This brings me to the constraint under which we are both writing. Our style guide forbids printing the words in full. I must write 'the N-word', 'the Q-word'. Readers have written to say that the placeholders have acquired a charge of their own. The dash is now doing the work the word used to do; they are as startled by the ellipsis as they would have been by the syllables.

  This is the final audit. A convention of non-use can end up reproducing the very thing it was introduced to avoid. The dash becomes a signifier of the taboo, and thus carries the taboo's voltage. This tells us that a slur's offence does not live in the phonetics, nor in the orthography, but in the recognition. It lives in the flinch.

  What can I claim about this in a newspaper without overclaiming? Only this: that the dash is not a shield. It is a mirror. It reflects the reader's knowledge of what is missing. If the dash stings, it is because the word still holds power, regardless of who claims to hold the gun or wear the badge. We cannot punctuate our way out of history. The danger is not in the token, nor in the ticket to use it. It is in the air we breathe when it is spoken. We must learn to read the pressure, not just the gauge.
