prompt: |-
  So I'm TAing a seminar called "Philosophy and Psychotherapy" — about a dozen second-year clinical psych students — and next Tuesday it's my turn to run the 75-minute section on Sartre's bad faith. The catch is that they're three weeks into their CBT placements, so they arrive with a very specific toolkit and they will absolutley try to file Sartre under it. Two failure modes I can already see coming: one group will cash out bad faith as basically a cognitive distortion, i.e. a wrong belief about yourself that dissolves once someone shows you the evidence against it; the other group will treat it as lack of insight, i.e. the client is repressing the truth and therapy is just getting them to self-report honestly. Neither is dumb, and I don't want to simply announce that both are wrong — I want the sequence itself to make the wrongness visible to them.

  Plan the section for me rather than explaining bad faith to me; I know the material, what I don't have is an order of attack. So: what has to be in place before bad faith is even statable — I'm assuming facticity and transcendence, plus something about consciousness not being a thing that has properties, and I'm fuzzy on how much of that machinery I can get in without losing them — and what depends on what, so I'm not borrowing a concept three steps before I've earned it. Then which case should carry the whole thing. The café waiter is available and they've half-heard of it, but I worry it reads as cute people-watching rather than as freedom collapsing on itself; should I use it as a warm-up and then retire it, or is there a better single case, maybe drawn from their placement world, since every one of them has a client who says "I'm just an anxious person, that's who I am"? Tell me what that carrying case has to have and what it has to lack — my instinct is it can't be a case where the truth is obvious on reflection, or the paradox just disapears.

  And then the misconception map. For each predictable wrong turn — bad faith as ordinary self-deception in the hiding-a-belief sense (and how do I handle the problem that you'd have to know exactly what you're hiding?), bad faith as mere hypocrisy or cowardice, radical freedom as "you can be anything, so just choose differently," authenticity as brutal honesty or sincerity-as-cure, and the big one where they conclude Sartre is blaming people for their circumstances — say where in the sequence I head it off and what I actually do at that moment so it doesn't feel like a teacher correcting a student. Finish with one thing I can put to them in the last ten minutes that would genuinely discriminate between "bad faith landed as a claim about the structure of freedom" and "bad faith landed as a fancy synonym for being in denial," and tell me what I should openly refuse to cover at this level and announce that I'm refusing it — I'm guessing the full for-itself/in-itself ontology, and probably the Other. American English, please, and be concrete: rough timings per block would help, because 75 minutes goes fast.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Context:** TAing a seminar "Philosophy and Psychotherapy" for ~12 second-year clinical psych students.
      *   **Topic:** Sartre's Bad Faith (*mauvaise foi*).
      *   **Time:** 75 minutes.
      *   **Constraint/Challenge:** Students are 3 weeks into CBT placements. They have a specific cognitive-behavioral toolkit. They will try to reduce Bad Faith to "cognitive distortion" or "lack of insight/repression."
      *   **Goal:** Don't just *tell* them they're wrong. Structure the session so the *wrongness becomes visible* through the sequence of ideas.
      *   **Specific Needs:**
          *   Order of attack (prerequisites: facticity/transcendence, consciousness).
          *   The "Carrying Case" (Waiter vs. Clinical example).
          *   Misconception Map (when/how to head off specific errors without being corrective).
          *   Final Discriminator (how to tell if they got the ontological point vs. psychological denial).
          *   Refusals (what to explicitly leave out).
          *   Format: American English, concrete, rough timings.

  2.  **Deconstruct the Philosophical Problem:**
      *   *Bad Faith* isn't lying to oneself (which implies a liar who knows the truth and a dupe who doesn't). It's a structural feature of consciousness.
      *   *CBT View:* Thoughts cause feelings/behaviors. Distortions are errors in processing data. Correction = Evidence/Reframing.
      *   *Sartrean View:* Consciousness is nothingness (néant). It transcends what it is. To treat oneself as a fixed thing (in-itself) is bad faith. To treat oneself as pure freedom without facticity is also bad faith.
      *   *The Clash:* CBT wants to fix the belief to align with reality. Sartre says the "reality" of the self is always in question.
      *   *The Trap:* If I use the Waiter, it feels abstract. If I use a clinical case, they will diagnose it. I need a case that resists diagnosis.

  3.  **Drafting the Sequence (The "Order of Attack"):**
      *   *Phase 1: The Hook (CBT Compatibility).* Start where they are. Let them feel confident.
      *   *Phase 2: The Glitch.* Introduce a scenario where CBT tools stall.
      *   *Phase 3: The Ontological Shift.* Introduce Facticity/Transcendence not as jargon, but as the solution to the glitch.
      *   *Phase 4: Bad Faith Defined.* Now define it as the oscillation/collapse between the two.
      *   *Phase 5: Clinical Application/Refusal.* Bring it back to therapy, but mark the boundary.

  4.  **Selecting the "Carrying Case":**
      *   *Waiter:* Good for illustration, but too distant.
      *   *Clinical Case:* "I am an anxious person."
      *   *Why this works:* CBT says "That's a labeling distortion." Sartre says "That's treating facticity as destiny."
      *   *Requirement:* The case must lack an obvious "truth" to uncover. If the client *is* actually anxious, CBT says "manage the anxiety." Sartre says "You are *choosing* to be the anxiety."
      *   *Decision:* Use the "I am an anxious person" case, but deepen it. Not just "I have anxiety," but "I *cannot* do X because I am anxious." It needs to be a *project* of being anxious, not just a symptom.

  5.  **Addressing the Misconceptions (The "Map"):**
      *   *Self-Deception:* Address early. How can I lie to myself?
      *   *Cognitive Distortion:* Address during the case study. Show that evidence doesn't dissolve it.
      *   *Radical Freedom/Blame:* Address near the end. It's not moral blame; it's ontological burden.
      *   *Authenticity:* Clarify it's not "brutal honesty."

  6.  **Developing the "Discriminator":**
      *   How do I know they got it?
      *   *Wrong:* "The client needs to realize they aren't actually anxious."
      *   *Right:* "The client is using 'anxiety' to evade a specific choice they are afraid to make."
      *   *Task:* A prompt that forces them to distinguish between *content* of belief vs. *stance* toward belief.

  7.  **Determining Refusals:**
      *   *The Look/The Other:* Too complex, distracts from self-relation.
      *   *In-itself/For-itself Ontology:* Keep it functional (Facticity/Transcendence) rather than metaphysical.
      *   *Sartre's Ethics:* He didn't really have one in *BN*. Don't pretend he did.

  8.  **Timing and Flow (75 Minutes):**
      *   0-10: Warm-up/CBT alignment.
      *   10-25: The Case Study (The Glitch).
      *   25-40: The Machinery (Facticity/Transcendence).
      *   40-55: Bad Faith Defined (The Oscillation).
      *   55-65: Misconception Check/Blame.
      *   65-75: The Discriminator/Closing.

  9.  **Refining the "Glitch":**
      *   I need to make sure they don't just solve the case with CBT.
      *   *Idea:* Have them roleplay the CBT intervention first. Let it succeed superficially, then ask "Why did the anxiety return?" or "Why does the client *cling* to the label?"
      *   *Better:* Use a case where the "distortion" is *useful*. "I can't leave my partner because I'm too anxious." CBT: "Is that true?" Sartre: "You are choosing to stay and using anxiety as the excuse."
      *   *Wait, careful:* Don't accuse the client. Accuse the *structure*.
      *   *Revised Plan:* Start with the "I am an anxious person" statement. Ask: "Is this true or false?" If they say false (distortion), push: "But they feel it." If they say true (insight), push: "But it limits them." This creates the tension needed for Facticity/Transcendence.

  10. **Writing the Plan (incorporating American English and concrete instructions):**
      *   *Tone:* Professional, pedagogical, respectful of their clinical training but firm on the philosophy.
      *   *Structure:* Clear headings, time stamps, "TA Script" cues.

      *(Self-Correction during drafting)*: I initially thought about using the Waiter. The prompt asks if I should. I should advise *against* making it the main case. It's too theatrical. Use the clinical case "I am an anxious person" but specifically the *utility* of that statement.
      *(Refining the Misconception handling)*: Don't lecture on misconceptions. Embed the correction in the questions. When they say "It's a distortion," ask "Who is distorting?" to reveal the homunculus problem.

      *(Refining the Discriminator)*: The prompt asks for one thing in the last 10 mins. A specific writing prompt or discussion question. "Describe a moment of bad faith without using the word 'lie' or 'false'." Or better: "Identify the *gain* in the suffering."

      *(Refining Refusals)*: Be explicit. "We are not doing ontology today, we are doing phenomenology." "We are not discussing The Other."

  11. **Final Review against Constraints:**
      *   75 mins? Yes.
      *   CBT context respected? Yes.
      *   Misconceptions addressed structurally? Yes.
      *   American English? Yes.
      *   Concrete timings? Yes.

      *Let's build the response.*
answer: |-
  Here is a 75-minute lesson plan designed to let the CBT framework run into its own limits, creating the conceptual space for Sartre without you having to police their intuitions directly.

  ### **Session Goal**
  To shift the students' view of "self-deception" from a *content error* (believing what is false) to a *structural project* (evading the burden of freedom by treating oneself as a fixed object).

  ### **Materials Needed**
  *   Whiteboard (divided into two columns: "Facticity" and "Transcendence").
  *   Handout: A one-paragraph clinical vignette (see below).
  *   No slides. Keep it conversational to prevent them from passively recording "definitions."

  ---

  ### **0:00 – 0:10 | The Hook: Validating the Toolkit**
  **Goal:** Establish rapport and let them apply their CBT lens so they feel the *limit* of it later.

  1.  **Open with their reality:** "You're three weeks into placements. You're hearing clients make absolute statements about who they are. 'I'm a depressive,' 'I'm broken,' 'I'm an anxious person.' In your CBT supervision, how are you trained to hear that statement?"
  2.  **Board their answers:** They will say things like: *Labeling distortion, overgeneralization, core belief, lack of evidence.*
  3.  **The Setup:** "Okay. So the therapeutic goal is usually to correct the belief to match the evidence. To get them to say, 'I experience anxiety,' rather than 'I am anxiety.' That assumes there is a 'true' self underneath the distortion that we can uncover."
  4.  **The Pivot:** "Today, I want to test what happens if that assumption hits a wall. What if the client isn't mistaken about the facts, but is actively *using* the facts to hide from something else? We're going to look at Sartre's 'Bad Faith,' but I want to see if your clinical tools can diagnose it."

  ### **0:10 – 0:25 | The Carrying Case: "The Anxious Person"**
  **Goal:** Use a clinical vignette that resists the "cognitive distortion" fix. Do *not* use the Café Waiter yet; it's too distanced. Use their world.

  **The Vignette (Read aloud):**
  > *Client M, 28, has been offered a promotion that requires public speaking. M says: 'I cannot take this job. I am an anxious person. My heart races, I sweat, I freeze. It's just who I am. If I take the job, I will fail.' M's history confirms M has avoided public speaking for 10 years.*

  **The Exercise (Small Groups, 5 mins):**
  1.  **Question A:** Is M telling the truth or lying?
  2.  **Question B:** If you challenge this belief with evidence (e.g., "You spoke up last week in group"), M says, "That was different." Why does the evidence not stick?

  **Debrief (Whole Group):**
  *   **Trap:** They will say "It's a distortion."
  *   **Your Move:** "If it's a distortion, M believes it's false. But M doesn't think it's false. M is convinced. If it's 'lack of insight,' then M is hiding the truth from themselves. But how do you hide a truth from yourself without knowing what it is to hide it?"
  *   **Let the tension sit.** Don't solve it. Write "Truth vs. Lie?" on the board and circle it with a question mark.
  *   **Transition:** "Sartre says M is neither lying nor mistaken. M is in *Bad Faith*. To see how, we need two concepts that aren't psychological, but ontological. How we exist."

  ### **0:25 – 0:40 | The Machinery: Facticity & Transcendence**
  **Goal:** Define the prerequisites without getting bogged down in *Being and Nothingness* ontology. Keep it phenomenological.

  1.  **Draw the Two Columns:** Label left "Facticity," label right "Transcendence."
  2.  **Facticity (The "Is"):** "This is the brute data of your life. Your past, your body, your social role, your symptoms. For M, facticity is: *I have a history of sweating when speaking.* CBT is excellent at mapping facticity."
  3.  **Transcendence (The "Beyond"):** "This is consciousness's ability to step back from facticity and give it meaning. It's the 'not yet.' It's the ability to say, 'That happened then, but what does it mean for now?' Transcendence is freedom."
  4.  **The Synthesis:** "Human reality is the tension between these two. We *have* facticity, but we *are* transcendence. We are never just a thing."
  5.  **Revisit the Vignette:** "Look at M again. When M says 'I *am* an anxious person,' what is M doing with these two columns?"
      *   *Desired Answer:* M is collapsing Transcendence into Facticity. M is treating themselves like a table or a rock (a thing that *is* anxious).
      *   *TA Script:* "M is turning a pattern of behavior (facticity) into a destiny (essence). M is pretending to be an object to avoid the vertigo of choosing."

  ### **0:40 – 0:55 | Defining Bad Faith: The Oscillation**
  **Goal:** Define Bad Faith not as a state, but as a flight.

  1.  **The Definition:** "Bad Faith is not believing a lie. It is the project of fleeing the tension between facticity and transcendence. You can do this two ways:"
      *   **Type 1 (The Determinist):** 'I am just an anxious thing.' (Denying Transcendence). *This is M.*
      *   **Type 2 (The Dreamer):** 'I am pure freedom, my past doesn't matter.' (Denying Facticity). *Example: The gambler who says 'I'm not a gambler, I just choose to bet every time,' ignoring the pattern of ruin.*
  2.  **The Waiter (Briefly):** "Sartre uses the Café Waiter. He plays at *being* a waiter too perfectly. He turns his job (facticity) into his essence. Why? Because if he *is* a waiter, he doesn't have to choose to be anything else. It's safer."
  3.  **Clinical Translation:** "In therapy, Bad Faith looks like *sincerity*. M is being very sincere. 'Doctor, I really am anxious!' Sartre says this sincerity is the trap. By being so sincerely 'anxious,' M avoids the question: 'What are you going to do about it?'"
  4.  **Misconception Check (The "Blame" Trap):**
      *   *Student Objection:* "So we just tell them to stop choosing anxiety? That sounds like blaming the victim."
      *   *Your Response:* "Sartre isn't talking about moral blame. He's talking about structure. If you break your leg, you have facticity. If you say 'I can't walk because I am a broken-leg-person,' that's bad faith. If you say 'I have a broken leg, but I choose how to live with it,' that's owning the tension. Therapy isn't about blaming the break; it's about restoring the choice."

  ### **0:55 – 1:05 | Misconception Map (Active Interception)**
  **Goal:** Address the specific failure modes you identified by embedding the corrections in the discussion.

  | Misconception | When it arises | How to head it off (TA Script) |
  | :--- | :--- | :--- |
  | **"It's just a cognitive distortion."** | During the Vignette (0:15). | Don't correct. Ask: "If it's just a processing error, why is it so *stable*? Why does M *need* it to be true?" Shift focus from *accuracy* to *function*. |
  | **"It's repression/unconscious."** | When discussing "hiding." | "Sartre rejects the unconscious. If you know it well enough to hide it, you know it. Bad faith is conscious. It's happening right in front of us." |
  | **"Radical freedom = You can be anything."** | During Facticity/Transcendence (0:30). | "No. You cannot choose your facticity. You cannot choose to not be anxious. You choose the *meaning* of the anxiety. Freedom is a burden, not a superpower." |
  | **"Authenticity = Brutal Honesty."** | During the Waiter example. | "Authenticity isn't confessing your sins. It's sustaining the tension. Admitting 'I am anxious' *and* 'I am choosing how to act' simultaneously. It's uncomfortable." |
  | **"Sartre is blaming the client."** | Near the end (0:50). | "Distinguish *ontological responsibility* from *moral fault*. You are responsible for your world, not because you caused the war, but because you choose how to live in it." |

  ### **1:05 – 1:15 | The Discriminator & Refusals**
  **Goal:** Verify learning and set boundaries.

  **The Discriminator Exercise (10 mins):**
  Put this prompt on the board:
  > *"Describe a moment of Bad Faith without using the words 'lie,' 'false,' 'unconscious,' or 'distortion.' Focus on what the person is **doing** with their identity."*

  *   **Failure Indicator:** They write: "The client is pretending they aren't sad." (This is self-deception/denial).
  *   **Success Indicator:** They write: "The client is using their sadness as a shield to avoid making a decision." (This is structural bad faith).
  *   **Why this works:** It forces them to describe the *project* of bad faith, not the *content* of the belief.

  **The Refusals (Last 2 minutes):**
  Be explicit about what you are *not* doing. This protects you from questions you can't answer in 75 mins and signals intellectual honesty.

  *   **TA Script:** "Two things we are explicitly leaving on the table. One: We are not doing the full *In-Itself/For-Itself* ontology. That's metaphysics; we're doing phenomenology. Two: We are not talking about 'The Other.' Sartre's view on how *other people* trap us in bad faith ('Hell is other people') is a different mechanism. Today was strictly about how *you* trap *yourself*. If you take one thing away: Bad faith isn't believing the wrong thing. It's treating yourself like a thing to avoid the cost of being a person."

  ---

  ### **Why This Sequence Works for Your Constraints**

  1.  **Prerequisites:** You don't teach Facticity/Transcendence until *after* the CBT tools stall on the vignette. They earn the concepts because they need them to solve the puzzle.
  2.  **The Case:** "I am an anxious person" is perfect because it is clinically real but ontologically suspect. It allows them to see that a statement can be *factually* grounded (they do sweat) but *existentially* false (they are not the sweat).
  3.  **Misconceptions:** You don't lecture on them. You let the students voice them, then use the Socratic method to show where the logic breaks (e.g., "Who is hiding the secret?").
  4.  **Timing:** The 10-minute buffer in the middle (0:40–0:55) is crucial. That's where the "Aha!" moment happens. If they are quiet, sit with it. Don't rush to fill the silence.
  5.  **Refusals:** By announcing what you aren't covering, you prevent the "But what about..." questions from derailing the core distinction between denial and bad faith.

  ### **Contingency Plan**
  *   **If they cling to CBT:** "CBT is a tool for managing symptoms. Sartre is a lens for examining the *stance* toward the symptoms. You can use CBT to lower the heart rate, but Sartre asks why the client *needs* the heart rate to decide their future."
  *   **If they get too abstract:** Drag them back to the vignette. "Show me where M is doing this in the text."
  *   **If they think Sartre hates therapists:** "Sartre actually practiced therapy later in life. He didn't think therapy was useless; he thought it failed when it treated people like objects to be fixed rather than subjects to be freed."
