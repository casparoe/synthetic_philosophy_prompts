  ### The Ontology of Time: A Diagnostic Flowchart

  **Instructions:** Start at Node 1. Follow the path that matches your intuition about the case described. Ignore philosophical labels; answer based on what you think is actually happening in the scenario.

  ***

  **Node 1: The Inventory**
  Think of the collection of everything that exists right now. Did that collection have different members yesterday than it does today (e.g., things that existed then do not exist now, or vice versa), or is it exactly the same collection of things, merely arranged differently?
  *   **A.** The members are different (things pop in or out of existence). → *Go to Node 2.*
  *   **B.** The members are the same (nothing is gained or lost). → *Go to Node 5.*
  *   **C.** The question presupposes a fact of the matter that isn't there. → *Leaf: Quietist.*

  **Node 2: Cross-Time Causation**
  Your headache this morning was caused by the wine you drank last night. The wine is not happening now. Does the cause of your headache (the wine itself) currently exist?
  *   **A.** Yes, it exists (just not *now-now*). → *Go to Node 3.*
  *   **B.** No, it is gone; only its effects remain. → *Go to Node 4.*

  **Node 3: The Direction of Reality**
  You answered that past things exist. As time passes, does the total amount of reality increase because the future becomes real, or does it decrease because the past ceases to be real?
  *   **A.** Reality increases (the future is added). → *Go to Node 6.*
  *   **B.** Reality decreases (the past drops off; only Present and Future are real). → *Leaf: The Receding Block.*

  **Node 4: Truth for the Gone**
  You answered that the wine is gone. Consider the claim "Socrates drank hemlock." Socrates does not exist now. What makes that claim true?
  *   **A.** The world currently has a primitive property of "having-contained-Socrates" (no extra entities needed). → *Go to Node 5.*
  *   **B.** There are abstract entities (times, propositions, haecceities) that exist now and represent Socrates. → *Leaf: Ersatz Presentism.*

  **Node 5: Relativity and Privilege**
  Physics suggests simultaneity depends on speed. If you and a fast-moving observer disagree on what is happening "now" across the universe, is one of you simply wrong about the true "Now," or are you both right relative to your paths?
  *   **A.** One of us is wrong; there is a single true "Now." → *Go to Node 6.*
  *   **B.** We are both right; "Now" is relative to the observer. → *Leaf: Relativized Presentism* (if from Node 4) or *Leaf: Static Block (Relativistic)* (if from Node 1).

  **Node 6: Passage and Openness**
  Two questions for the final split:
  1. Is it already true or false that you will eat breakfast tomorrow, even if nothing determines it?
  2. When time feels like it is flowing, is that a feature of the world changing, or your consciousness moving along a fixed world?
  *   **A.** Future is Open + World Changes. → *Leaf: Branching Growing Block.*
  *   **B.** Future is Settled + World Changes. → *Leaf: Growing Block.* (See Note on Growing Spotlight).
  *   **C.** Future is Settled + Consciousness Moves. → *Leaf: Static Block (Absolute).*
  *   **D.** Future is Settled + World Changes (Privileged Now). → *Leaf: Moving Spotlight.*

  ***

  ### Meta-Commentary on the Structure

  **1. Which Questions Do the Work?**
  *   **Node 1 (Inventory)** is the primary classifier. It separates the dynamic ontologies (Presentism, Growing/Receding Block) from the static ones (Block, Spotlight).
  *   **Node 2 (Causation)** is the secondary classifier. It separates Presentism (cause gone) from Realist-Past views (Growing/Receding Block).
  *   **Node 6 (Passage/Openness)** is doing heavy lifting at the end. It attempts to separate the Block from the Spotlight, and the Linear Growing Block from the Branching variant.
  *   **Node 5 (Relativity)** is largely decorative for the Static Block paths (distinguishing Absolute vs. Relativistic physics interpretations) but essential for isolating **Relativized Presentism**.
  *   **Node 3 (Direction)** is the narrowest branch, isolating the **Receding Block**.
  *   **Node 4 (Truth)** is decorative for the main ontological split but necessary to separate **Standard Presentism** from **Ersatz Presentism**.

  **2. Forced Dichotomies and Collapses**
  *   **Moving Spotlight Variants:** I have collapsed the "Hypertime" and "No-Hypertime" Moving Spotlight variants into a single leaf (Node 6, Option D). *Diagnosis:* These positions are notoriously difficult to distinguish without asking directly about "dimensions of time," which violates the concrete-case constraint. Most critics argue they collapse into one another anyway.
  *   **Growing Spotlight:** I have diagnosed this as collapsing into the **Growing Block** leaf (Node 6, Option B). *Diagnosis:* Adding a "spotlight" to a growing block is redundant; if the leading edge is the only place where change happens, the growth *is* the spotlight.
  *   **Static Block:** I have split this into two leaves (Relativistic vs. Absolute) based on Node 5. *Diagnosis:* These are physically distinct but metaphysically identical regarding time's ontology.
  *   **Branching:** Node 6 forces a dichotomy between "Open" and "Settled." This excludes views where the future is settled but unknown (epistemic openness), but captures the metaphysical branching requirement.

  **3. Empty Cells (Incoherent Combinations)**
  *   **Inventory Same + Cause Gone:** Incoherent. If the inventory of existence never changes, past causes must still exist.
  *   **Inventory Different (Growth) + Past Gone:** Incoherent. If reality grows, the past must be retained to constitute the "growth."
  *   **Relativity (Both Right) + Privileged Now (One Wrong):** Incoherent. This is a direct contradiction in Node 5.
  *   **Future Open + Static Block:** Incoherent. If the future is open (no truth value), the block cannot be a fixed four-dimensional manifold.

  **4. Confidence and Critique**
  *   **High Confidence:** **Static Block**, **Presentism**, **Growing Block**, **Ersatz Presentism**. These are well-trodden paths with clear intuitive markers.
  *   **Medium Confidence:** **Relativized Presentism**, **Moving Spotlight**. These depend on how readers interpret the Relativity and Passage questions, which can be ambiguous.
  *   **Low Confidence:** **The Receding Block** (Future/Present real, Past gone). *Diagnosis:* I am least sure this leaf corresponds to a genuinely defended position rather than a philosophical curiosity. It is the mirror image of the Growing Block, but few argue that the past *ceases* to exist while the future *already* does. It feels unattractive because it combines the epistemic access problems of the Block (future is real but unknown) with the ontological parsimony problems of Presentism (past is gone).
  *   **Critique of Node 6:** This node is overloaded. Asking about both "Openness" and "Passage" in one step is a structural compromise to stay within the six-node limit. Ideally, "Openness" (Node 4 topic) should be asked before "Passage" to properly separate the **Branching Growing Block** from the standard **Growing Block** earlier in the tree. As it stands, a reader who believes in a Growing Block *and* an Open Future might feel forced to choose between Leaf B and Leaf A, when their view is a specific hybrid.

  **5. Note on the "Quietist" Leaf**
  This leaf is accessible only at Node 1. This is intentional. Quietism about time is usually a rejection of the ontological question itself ("Existence" is not the right category). If a reader accepts the terms of Node 1, they have likely already rejected Quietism.
