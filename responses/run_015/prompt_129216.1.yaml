answer: |-
  The exit you are looking for is indeed at **step (2)**. Your intuition that the damage lies there is correct.

  Here is the diagnosis of the error, why it looked plausible, and the price of the alternatives.

  ### 1. The Diagnosis: Step (2) Confuses Instrumentalism with Realism

  **The Error:** Step (2) states: *"If so, predictive success is not merely necessary but sufficient for retaining a model's **ontological commitments**, at least provisionally."*

  This is a misreading of Friedman's instrumentalism. Friedman's F-twist argues that predictive success is sufficient for retaining the **theory as an instrument**, but explicitly *not* for retaining its ontological commitments.

  Friedman distinguishes between the *validity* of a theory (its predictive power) and the *truth* of its assumptions (its ontology). He argues that we should accept the theory *as if* the assumptions were true, without committing to the claim that they *are* true. By asserting that predictive success justifies "ontological commitments," step (2) smuggles scientific realism into an argument designed to defend instrumentalism.

  **Why it looked plausible:**
  This step relies on a natural abductive inference: *If a model predicts correctly, its machinery must correspond to reality.* This is the "No Miracles" argument in philosophy of science (Putnam). It feels intuitive that a model predicting planetary positions must have *some* grasp of the causal structure of the solar system. Therefore, it is easy to slide from "the model works" to "the model's description of the world is provisionally true." Friedman explicitly blocks this slide. He argues that the best models often have the *most* unrealistic assumptions because they successfully isolate the critical forces from the noise.

  ### 2. Pricing the Alternatives

  You asked what you pay if you keep (1) but surrender (2). Here is the ledger:

  #### Option A: Keep (2) (The Trap You Are In)
  *   **Benefit:** You maintain a strong link between success and truth.
  *   **Cost:** You accept the *reductio ad absurdum* in steps (7)–(10). You must admit that a binary lattice climate model is scientifically equivalent to fluid dynamics if it fits the data, and that Ptolemy was ontologically "okay" until Copernicus arrived. You collapse the distinction between explanation and curve-fitting. This makes scientific progress look like mere data compression rather than understanding.
  *   **Verdict:** This makes Friedman's methodology untenable for anyone who believes science aims at explanation, not just prediction.

  #### Option B: Weaken (2) (The Exit)
  *   **Revision:** Change (2) to: *"If so, predictive success is sufficient for retaining a model **as a tool for organization and prediction**, but implies nothing about the truth of its ontological commitments."*
  *   **Benefit:** You save Friedman from the charge of licensing "fictions" as truth. Ptolemy is retained as a *calculational device*, not a true description of the cosmos. The climate algorithm is a useful *heuristic*, not a theory of heat. This preserves the distinction between modeling (understanding mechanisms) and curve-fitting (matching data), because Friedman requires theories to predict *novel* phenomena, not just fit existing data (addressing your worry in step 8).
  *   **Cost:**
      1.  **Instrumentalist Humility:** You must accept that economics (and science) may not tell us what the world *is*, only how to navigate it. This is philosophically unsatisfying for those seeking causal truth.
      2.  **The "Triviality" Risk:** You worried this makes the F-twist trivial ("false assumptions don't matter unless predictions fail"). It risks becoming a tautology: *Good models are those that work.* However, it remains non-trivial because it fights the opposing intuition that *assumptions must be realistic to work*. It validates the use of simplified, "false" models (like perfect competition) without requiring us to believe agents are actually rational optimizers.
      3.  **Opening the Door to (10):** By severing the link between prediction and ontology, you implicitly admit that ontology matters for *other* reasons (e.g., policy intervention, structural stability). If we don't believe the assumptions, why trust the model under structural breaks? This invites the "non-predictive criteria" (explanatory depth, structural correspondence) that Friedman officially rejects but which modern macroeconomics has quietly reintroduced (e.g., the Lucas Critique).

  ### 3. A Secondary Correction: Step (8) and "Prediction"

  While (2) is the philosophical error, step (8) contains a methodological slip that reinforces the trap.

  Friedman defines "predictive success" not as fitting historical data (curve-fitting), but as yielding valid implications for phenomena *not* used in constructing the theory.
  *   **Your Step (8):** "...happens to match regional temperature data for a decade."
  *   **Friedman's Standard:** If the algorithm matches data it was trained on, Friedman would *not* call this predictive success; he would call it curve-fitting. He would reject the model until it predicted *out-of-sample* phenomena (e.g., temperature response to a specific volcanic eruption not in the training set).

  If you tighten the definition of "prediction" in (8) to mean *novel* prediction, the "binary lattice" model likely fails quickly, because false causal mechanisms rarely generalize to new contexts. This saves the F-twist from the charge of equating theory with curve-fitting without needing to abandon instrumentalism.

  ### 4. Recommendation

  **Reject (2).**

  Rewrite it to reflect strict instrumentalism:
  > *(2*) If so, predictive success is sufficient for retaining a model **as a valid instrument**, but grants no warrant to its ontological commitments.*

  **Why this is the best path:**
  1.  **Preserves (1) and (3):** You keep the core F-twist and the historical fact of Ptolemy.
  2.  **Defangs the Reductio:** You can now say Ptolemy was a *good instrument* but a *false theory*. There was a methodological reason to drop it: not because it was false (Friedman doesn't care), but because Copernicus/Kepler offered a *more fruitful* instrument (simpler calculations, broader scope).
  3.  **Avoids Triviality:** It remains a substantive claim about how to judge economic models (by outcomes, not introspection) without committing you to the absurdity that "anything that fits data is true."

  **The Price:** You must concede point (10)'s second horn: that in practice, scientists *do* care about explanatory depth and structural correspondence, even if Friedman says they shouldn't. By weakening (2), you admit that Friedman's methodology is a normative rule for *testing*, not a complete description of how theory choice actually works. This is a fair price to pay to escape the logical trap.
