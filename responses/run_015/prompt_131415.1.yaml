      *   *User's Theory:* "Similarity is a framing decision" is correct. This is the key.

  9.  **Final Review against constraints:** No bibliographies. Call out confusion if needed (the "morphological" term is the only slight stretch, but conceptually valid). Focus on the diagnosis.

      *(Self-Correction on "Morphological"):* I should clarify that while historians use "morphology" (e.g., state morphology), the specific phrase "morphological reference class" isn't a standard term of art in forecasting literature. It's a useful descriptor the user invented or borrowed from sociology. I will validate the concept while noting the terminology nuance.

