answer: |-
  Your premise is not confused; in fact, your working theory ("similarity is a framing decision") is the most accurate diagnosis of the stall available. The term "morphological reference class" isn't standard forecasting jargon (you won't find it in Tetlock or Kahneman), but it accurately captures the comparative-historical method of grouping by *structure* rather than *label*. You have correctly identified the fault line.

  Here is the diagnosis of the stall, the nature of the disagreement, and what progress would actually look like.

  ### 1. The Core Logical Problem: The Reference Class Problem
  The stall exists because both sides are running into the **Reference Class Problem** (formalized by Alan Hájek). Any specific event (e.g., "US collapse in 2050") belongs to an infinite number of reference classes (e.g., "Nuclear States," "Democracies," "Hegemons," "States with Debt > GDP"). Each class yields a different base rate.

  Statistics cannot tell you which class is the "right" one. That choice is **theoretical**, not empirical.

  *   **Camp A (Outside-Viewers)** treats the reference class ("Empires") as a **natural kind**. They assume "Empire" is a stable ontological category that transcends time. When they say rejecting the base rate is a "just-so story," they are asserting that the *label* carries more predictive weight than the *mechanisms*.
  *   **Camp B (Historians/Economists)** treats the reference class as a **theoretical construct**. They argue that "Empire" is a folk category that hides causal heterogeneity. A nuclear bureaucratic state is causally distinct from a patrimonial empire. When they demand "morphological indexing," they are arguing that similarity must be defined by *causal machinery*, not surface features.

  **Verdict:** This is not merely verbal. It is **epistemological**. They disagree on what constitutes "evidence." Camp A sees frequency as evidence; Camp B sees causal mechanism as evidence.

  ### 2. Are They Answering Different Questions?
  Yes. This is the primary driver of the stall.

  *   **Camp A is asking a Decision-Theoretic Question:** "Given that I cannot fully model the complex causal web of modernity, what is the actuarial risk I should price in?" They are optimizing for **calibration** under ignorance. For them, a forecast is a **bet**. The "Outside View" is a heuristic to correct for human overconfidence, not a claim that history literally repeats.
  *   **Camp B is asking a Causal-Inference Question:** "What specific variables determine regime survival, and have those variables changed?" They are optimizing for **explanation** and **structural validity**. For them, a forecast is a **hypothesis**. If the mechanism (e.g., nuclear deterrence) breaks the historical chain of causality, the base rate is irrelevant noise.

  **The Conflict:** Camp A accuses Camp B of "special pleading" (making exceptions to avoid bad news). Camp B accuses Camp A of "superstition" (believing in magical categories like 'Empire' that ignore physical reality). Both are partially right. Camp A ignores structural breaks; Camp B often ends up with N=1, making forecasting impossible.

  ### 3. Your Theory on "Similarity"
  You are correct: **Similarity is a framing decision that comes before the numbers.**

  Camp A hides this framing decision behind the neutrality of "data." By choosing "Empires" as the class, they have already decided that *geopolitical scope* is the decisive similarity, while *technology* is noise.
  Camp B exposes the framing decision but pays a penalty in predictive precision. By choosing "Nuclear Bureaucracies" as the class, they decide *technology* is decisive, but they may lack enough data points to generate a probability.

  The stall persists because neither side wants to admit that their reference class choice is a **normative/theoretical prior**, not an empirical discovery. Camp A wants to claim the mantle of "hard science" (base rates); Camp B wants to claim the mantle of "deep understanding" (context).

  ### 4. What Progress Would Look Like
  A formal result proving one side right is impossible because the Reference Class Problem is logically undecidable without a prior theory. However, methodological progress is possible in three specific forms:

  **A. Hierarchical Bayesian Modeling (The Technical Fix)**
  Progress looks like stopping the fight over *which* reference class to use and moving to **Model Averaging**.
  *   Treat the "Empire" base rate as a **Prior**.
  *   Treat the "Morphological" features (nukes, digital, capital) as **Likelihoods** that update the prior.
  *   *Result:* You don't discard the base rate (satisfying Camp A), but you don't treat it as destiny (satisfying Camp B). You explicitly quantify how much the "nuclear variable" should shift the probability of the "empire variable." Currently, Camp A sets the shift to zero; Camp B sets the prior to zero. Both are dogmatic.

  **B. Agreement on Indexing Rules (The Methodological Fix)**
  The field needs a protocol for **Reference Class Selection**. Instead of arguing ad hoc, they need rules like:
  *   *Causal Relevance:* A feature only justifies a new reference class if there is a demonstrated mechanism linking it to the outcome (not just a correlation).
  *   *Reference Class Stability:* If the morphological class has fewer than N cases (e.g., N<5), you must revert to the broader nominal class with a penalty factor.
  This forces Camp B to admit when they are overfitting (N=1) and Camp A to admit when a structural break is too large to ignore.

  **C. Acknowledging the Normative Frame (The Philosophical Fix)**
  Progress requires admitting that the choice of reference class is **political**.
  *   Choosing "Empire" implies continuity and inevitable decline (deterministic).
  *   Choosing "Modern State" implies novelty and potential agency (exceptionalist).
  *   *Resolution:* Forecasts should be published with **Reference Class Sensitivity Analysis**. ("If we view this as an Empire, risk is 40%. If we view this as a Nuclear State, risk is 5%.") This moves the debate from "Who is right?" to "Which framing is more useful for this specific decision?"

  ### Summary Diagnosis
  The stall is **substantive** (disagreement on causal drivers) masked as **methodological** (how to calculate probability), rooted in the **epistemological** problem that similarity is subjective.

  *   **Camp A** is right that without base rates, forecasting becomes storytelling.
  *   **Camp B** is right that without causal mechanisms, base rates become superstition.
  *   **Your Insight** is the key: Similarity is a framing decision.

  **Progress** will not come from one side winning. It will come from **Bayesian integration**: using the Outside View as a prior and the Inside/Morphological View as the update. Until they stop treating their reference class choice as an empirical discovery and start treating it as a model parameter to be tested, the stall is permanent.
