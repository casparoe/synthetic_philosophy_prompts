answer: |-
  # JOINT STATEMENT OF ADVERSARIAL COLLABORATION
  **Subject:** Grounds of the Procreation Asymmetry
  **Status:** Draft for Working Group Review
  **Date:** 2023-10-27

  ## 1. AGREED CLAIMS

  Both Camp A (Unified/Axiological) and Camp B (Two-Grounds/Deontic) endorse the following claims. These are intended as hard constraints on any subsequent theory.

  1.  **The Core Asymmetry:** In clear cases, (i) there is no moral requirement to bring into existence a person whose life would be worth living, and (ii) there is a moral requirement not to bring into existence a person whose life would be miserable.
  2.  **No Subject for Non-Existence:** Neither camp accepts the claim that "never existing" is a state that can be worse *for* the person who never exists. There is no subject to whom this harm can be attributed.
  3.  **Non-Identity Acceptance:** Both camps accept that if a specific person is brought into existence with a life worth living, they cannot claim they were harmed by being created rather than not created, even if another possible person would have had a better life.
  4.  **Scope of Dispute:** The disagreement is not about the verdicts in the clear cases (Claim 1). The disagreement is exclusively about the *ground* (the underlying explanation) of these verdicts.
  5.  **Rejection of Mystical Harm:** Both camps reject the notion that potential people possess current rights or interests prior to conception.
  6.  **Action-Guiding Requirement:** Any proposed ground must yield actionable guidance in edge cases where the two halves of the asymmetry appear to conflict or where the "clear case" boundaries blur.
  7.  **Terminology:**
      *   **Axiological:** Relating to the value or goodness of states of affairs (outcomes), independent of duties.
      *   **Deontic:** Relating to duties, obligations, permissions, and wrongs.
      *   **Person-Affecting:** The view that an outcome can only be better or worse if it is better or worse *for* some particular person.
      *   **Impersonal Value:** Value that exists in a state of the world even if it is not good *for* any specific individual.
      *   **Welfare:** The net quality of a life (positive or negative).

  ## 2. DISAGREEMENTS TABLE

  | Question at Issue | Camp A (Unified/Axiological) Position | Camp B (Two-Grounds/Deontic) Position | Genuine or Verbal? |
  | :--- | :--- | :--- | :--- |
  | **1. Unity of Explanation** | The two halves of the asymmetry stem from a single axiological principle regarding the value of absences. | The two halves stem from two distinct deontic principles (no duty to benefit non-existents vs. duty not to harm existents). | **Genuine.** This is a structural disagreement about moral theory architecture. |
  | **2. Value without Bearers** | **Impersonal Value** exists. The absence of pain is good even if there is no one to experience that goodness. | Value requires a **Bearer**. A state of affairs cannot be "good" unless it is good *for* someone. | **Genuine.** This is a metaphysical disagreement about the nature of value. |
  | **3. The Status of "Absence of Pleasure"** | The absence of pleasure in non-existence is *neutral* (not bad), because there is no one deprived. | The absence of pleasure in non-existence is *null* (no truth value), because there is no relation to evaluate. | **Partially Verbal.** Both agree it creates no duty. The disagreement is whether we describe this as "neutral value" (A) or "inapplicable predicate" (B). |
  | **4. Source of Obligation** | Obligations are derived from the value of the resulting state of the world. | Obligations are derived from the moral status of the agents and subjects involved in the act. | **Genuine.** Consequentialist vs. Non-Consequentialist framing. |
  | **5. Aggregation** | We should sum welfare across all individuals (actual and potential) to determine the best outcome. | We cannot sum welfare across possible individuals who do not exist to be counted. | **Genuine.** Directly impacts population ethics calculations. |

  ## 3. CRUXES AND TEST CASES

  This section identifies specific sub-questions where the camps diverge. For each, we specify a concrete case, the predicted verdict from each camp, and what would count as evidence against that camp's view.

  ### Crux 1: The Fixed-Number, Different-People Choice
  **Sub-Question:** When choosing between creating Person X (high welfare) or Person Y (moderate welfare), where exactly one will exist, is there a moral reason to choose X, and what is the source of that reason?

  *   **Concrete Case:** A couple can conceive now (Child X, life rating +10) or wait one year (Child Y, life rating +5). They will only have one child.
  *   **Camp A Prediction:** There is a decisive moral reason to create Child X. The state of the world containing +10 welfare is impersonally better than the state containing +5.
  *   **Camp B Prediction:** There is no strict moral duty to create Child X. Since neither X nor Y exists yet, neither is wronged by not being created. Choosing Y is permissible, though perhaps aesthetically or prudentially suboptimal.
  *   **Falsification Condition (Camp A):** If it is demonstrated that choosing Child Y violates no intuition of "missed value" in a way that cannot be explained by side-constraints.
  *   **Falsification Condition (Camp B):** If strong intuition persists that failing to create Child X is a moral failure comparable to harming an existing person, suggesting a duty to the "better possible person."

  ### Crux 2: The Aggregation Case
  **Sub-Question:** Does the claim that one outcome contains more total value than another do action-guiding work when the number of people differs?

  *   **Concrete Case:** Option 1: Create 1,000 people with lives rated +1. Option 2: Create 1 person with a life rated +500.
  *   **Camp A Prediction:** Option 1 is morally preferable (or at least comparable) because the total sum of impersonal value is higher (+1,000 vs +500).
  *   **Camp B Prediction:** Option 2 is permissible and not inferior. There is no "total value" to maximize, only duties to specific individuals. Since all created lives are worth living, no duty is violated in either option.
  *   **Falsification Condition (Camp A):** If the "Repugnant Conclusion" (preferring massive populations of barely-livable lives over smaller, excellent populations) is accepted as a fatal flaw by neutral observers.
  *   **Falsification Condition (Camp B):** If it is shown that Camp B cannot explain why preventing the existence of the 1,000 people is not a loss of value, leading to counter-intuitive indifference about population size.

  ### Crux 3: The Wronged-But-Happy Case
  **Sub-Question:** Is an act permissible if it violates a deontic constraint but results in a life worth living?

  *   **Concrete Case:** A scientist creates a child via non-consensual experimentation solely to harvest organs later. The plan fails; the child is raised normally, has a happy life (+10), and never knows the original intent.
  *   **Camp A Prediction:** Permissible (or at least not wrong *in the outcome*). The resulting state of the world contains a happy person. The "bad reason" is irrelevant to the axiological value of the existence.
  *   **Camp B Prediction:** Impermissible. The act violated a deontic constraint (using a person as a mere means/lack of consent). The child was wronged in the *creation*, even if their *life* is good.
  *   **Falsification Condition (Camp A):** If the intuition that the scientist did something wrong is robust even given the happy outcome, suggesting rights constrain value maximization.
  *   **Falsification Condition (Camp B):** If it is shown that "wronging" requires making someone worse off, and since the child has a good life, they were not made worse off than the baseline of non-existence.

  ### Crux 4: The Baseline Metaphysics (Null vs. Zero)
  **Sub-Question:** What is the metaphysical status of the "non-existent person" in our moral calculus?

  *   **Concrete Case:** Comparing World A (Person exists, welfare 0) vs. World B (Person does not exist).
  *   **Camp A Prediction:** World B has a specific value property (e.g., "absence of pain is good"). Non-existence is a comparable state (like Zero).
  *   **Camp B Prediction:** World B has no value property regarding that person. Non-existence is the absence of a relatum (like Null/None). Comparison is type-invalid.
  *   **Falsification Condition (Camp A):** If treating non-existence as a comparable state leads to logical contradictions in identity tracking.
  *   **Falsification Condition (Camp B):** If treating non-existence as "Null" prevents explaining why we have duties regarding *future* people who do not yet exist but will.

  ## 4. CONDITIONS FOR MOVING

  **Camp A (Unified/Axiological):**
  We would give ground if presented with a case where maximizing **Impersonal Value** (the goodness of the state of the world) clearly mandates an action that is intuitively repugnant or violates individual rights, and where this mandate cannot be blocked by side-constraints. Specifically, if we are forced to accept that we ought to create a vast number of miserable lives because their aggregate "absence of pain" (if they hadn't existed) outweighs the suffering of the actual, or if we must sacrifice an existing person to create two new happy ones to increase total value. If the cost of maintaining a single axiological metric is accepting the **Repugnant Conclusion** without modification, we would consider shifting toward a hybrid or deontic ground.

  **Camp B (Two-Grounds/Deontic):**
  We would give ground if presented with a case where the **Person-Affecting** restriction (value must be good *for* someone) renders us unable to condemn an outcome that is clearly worse. Specifically, if we cannot explain why it is better to save a beautiful, uninhabited world from destruction than to let it be destroyed, given that no subject is harmed by the destruction. If our inability to aggregate value across possible people leads to paralysis in long-term policy (e.g., climate change affecting different future populations), or if we cannot explain the intuition that choosing a worse-off child (Crux 1) is a moral failure, we would consider accepting a limited form of **Impersonal Value**.

  ## 5. ADJUDICATION OF ENGINEERING CONJECTURES

  **Conjecture 1: The Null-versus-Zero Switch**
  *Adjudication:* **Live Crux.** You are not importing a confusion; you have identified the metaphysical type error at the heart of the dispute.
  *   **Explanation:** Camp A treats the non-existent person as an object with a property value of `0` (or a specific negative/positive value depending on pain/pleasure absence). This allows comparison operators (`>`, `<`) to run without throwing an exception. Camp B treats the non-existent person as `Null` (no object). Attempting to access `.welfare` on a non-existent person throws a runtime error; the comparison is invalid.
  *   **Impact:** This is not merely verbal. If Camp B is right, Camp A's code is running on invalid memory accesses (assigning properties to things that aren't there). If Camp A is right, Camp B's code is unnecessarily restrictive, refusing to process valid data structures (states of the world) because they lack a specific ID tag (a specific person). Settling this requires agreeing on whether "value" is a property of *states* (A) or *relations* (B).

  **Conjecture 2: The Two-Metrics Picture**
  *Adjudication:* **Real Crux.** This accurately describes the stalemate.
  *   **Explanation:** Camp A is optimizing for **Global State Integrity** (Is the resulting universe configuration optimal?). Camp B is optimizing for **Transaction Safety** (Was every interaction between agents valid?).
  *   **Impact:** Both metrics are internally consistent. The disagreement is about which metric is authoritative for morality. Camp A argues that Transaction Safety is a heuristic for Global State Integrity. Camp B argues that Global State Integrity is a dangerous abstraction that ignores the moral reality of individual boundaries. The stalemate persists because Camp A presents arguments about State Integrity to Camp B, who rejects the metric, and vice versa. Acknowledging this allows the group to stop arguing about verdicts and argue about metric authority.

  ***

  **End of Document**
