  ### Research Agenda: Foundations of Idealized Preference Aggregation

  To maximize the impact of a six-person team over three years without empirical ML infrastructure, we must resolve the logical dependencies inherent in Coherent Extrapolated Volition (CEV). The central tension lies in determining the unit of analysis: do we prioritize the coherence of the individual agent over time (Pairwise), the compatibility of agents across a population (Collective), or the structural delegation of authority (Hierarchical)? My verdict is that research must proceed strictly from the atomic to the structural. We cannot aggregate undefined units, nor can we design representative hierarchies for processes that fail to converge individually. Therefore, the agenda prioritizes Individual Coherence first, Collective Aggregation second, and Hierarchical Architecture third.

  **Priority 1: Individual Coherence (Pairwise)**
  The first priority is establishing whether a single agent's volition converges under idealized extrapolation. This is the Pairwise problem: determining the conditions under which a current self and a future idealized self share sufficient normative identity to justify the extrapolation.
  1.  **Upstream Status:** This is the foundational block. If individual extrapolation is path-dependent or chaotic (i.e., small changes in initial conditions yield vastly different "ideal" selves), then collective aggregation is mathematically undefined because the inputs are unstable.
  2.  **Tractability:** High. This requires modal logic, fixed-point theory, and meta-ethical analysis, all achievable without empirical data. Philosophers can analyze normative identity while formal theorists model deliberation as a convergence process.
  3.  **Revision Trigger:** A formal proof within two years demonstrating that rational deliberation necessarily diverges under plausible cognitive constraints would deprioritize CEV entirely in favor of error-theoretic approaches. Conversely, a proof of convergence under specific rationality axioms would elevate this to a solved background assumption.

  **Priority 2: Compatibility and Aggregation (Collective)**
  The second priority addresses the Collective problem: assuming individual volitions converge, how do we aggregate them when they are mutually incompatible? This moves beyond standard social choice theory because the preferences are endogenous to the extrapolation process.
  1.  **Upstream Status:** Implementation of any multi-agent alignment strategy is blocked until we know if "what everyone would want" is a coherent set. If the intersection of idealized volitions is empty, collective CEV is impossible.
  2.  **Tractability:** Medium. This requires adapting impossibility theorems (like Arrow's) to dynamic, idealized preferences. It is solvable via formal modeling but depends on the definitions secured in Priority 1.
  3.  **Revision Trigger:** The discovery of a possibility theorem showing that idealized preferences satisfy unique consistency constraints (unlike revealed preferences) would elevate this area. If no such constraints exist, the team must pivot to conflict-resolution protocols rather than aggregation.

  **Priority 3: Structural Delegation (Hierarchical)**
  The third priority examines the Hierarchical solution: whether using representative idealized agents to negotiate on behalf of clusters resolves the incompatibilities found in Priority 2.
  1.  **Upstream Status:** Governance models and delegation structures cannot be designed until we know what is being delegated and whether aggregation fails. This is a structural solution to the problems identified in the first two phases.
  2.  **Tractability:** Lower. This requires synthesizing the outputs of Priorities 1 and 2 into a normative model of representation. It is less tractable early on because it relies on unresolved definitions of coherence and aggregation.
  3.  **Revision Trigger:** A demonstration that representative extrapolation preserves normative fidelity better than direct aggregation would elevate this to a primary implementation strategy. If representatives introduce unacceptable distortion, this approach should be abandoned.

  **Resource Allocation**
  The team should consist of three philosophers and three formal theorists. The problem is equally split between meta-ethical definition (what counts as "better"?) and logical consistency (does "better" converge?). A 3/3 split ensures that normative arguments are rigorously formalized without losing philosophical nuance.

