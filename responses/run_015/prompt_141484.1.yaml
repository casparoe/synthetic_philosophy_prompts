answer: |-
  **Purpose Specification:** To enable an analyst, situated within the lifetime of a polity, to assign a calibrated probability $P(\text{survival} > N)$ using a reference class method that permits overriding the base rate only via a documented, ex-ante justification of unique causal factors.

  ### Desiderata for Reference Class Construction

  1.  **Operational Identity Criterion** (Non-negotiable)
      *   **Specification:** The method must define necessary and sufficient conditions for polity continuity (e.g., constitution, territory, elite continuity) distinct from regime change.
      *   **Motivating Case:** Determining whether the Russian Federation is a continuation of the USSR or a new entity; without this, lifespan is unmeasurable.

  2.  **Right-Censoring Correction** (Non-negotiable)
      *   **Specification:** The estimation model must treat currently existing polities in the reference class as censored data points, not as failures or completed lifespans.
      *   **Motivating Case:** Calculating mean lifespan using only collapsed empires biases the estimate downward by excluding all successful ongoing cases.

  3.  **Protocolized Temporal Boundaries** (Non-negotiable)
      *   **Specification:** Start and end dates must be determined by a fixed rule (e.g., "date of sovereign recognition") applied uniformly, not selected to maximize or minimize longevity.
      *   **Motivating Case:** Counting Rome from the Republic vs. the Empire changes the base rate entirely; ad-hoc selection allows gerrymandering the probability.

  4.  **Ex-Ante Feature Locking** (Non-negotiable)
      *   **Specification:** Properties defining the reference class must be observable at the time of forecast and fixed before observing the outcome of the test set.
      *   **Motivating Case:** Selecting "had a succession crisis" as a class defining feature after knowing which states failed creates look-ahead bias.

  5.  **Hazard Rate Specification** (Preference of a camp)
      *   **Specification:** The method must declare whether risk is time-invariant (exponential) or duration-dependent (Weibull/Gompertz).
      *   **Motivating Case:** Treating a "teenage democracy" as having the same survival probability as a century-old regime ignores aging effects; conversely, assuming aging may impose false structure on small samples.

  6.  **Relevance-Stability Balance** (Non-negotiable)
      *   **Specification:** The class must be narrow enough to be causally relevant but broad enough to yield stable frequencies ($n \geq 30$ recommended); trivial classes ("all entities") are forbidden.
      *   **Motivating Case:** A class of "nuclear-armed island democracies" is informative but $n=1$; "all sovereign states" is stable but trivializes specific risks.

  7.  **Recorder Bias Acknowledgement** (Non-negotiable)
      *   **Specification:** The method must weight or discard historical cases based on the provenance of the record, acknowledging that survival itself influences recording probability.
      *   **Motivating Case:** Ancient polities are only recorded if they conquered neighbors; using them as a random sample ignores the selector bias of the historian.

  ### Exclusionary Requirement
  **Ex-Ante Feature Locking (D4)** does the most work in excluding actual forecasting practice. Most geopolitical analysis selects analogies and defining features *after* observing outcomes (post-hoc narrative), allowing analysts to construct reference classes that guarantee the desired conclusion.

  ### Impossibility Result
  **D4 (Ex-Ante Specificity)** and **D6 (Relevance-Stability)** cannot be jointly satisfied in a non-ergodic historical system. To be informative about a specific polity, the class must be narrow (high specificity); to be statistically stable, it must be broad (high frequency). Because political generators are non-stationary, increasing specificity reduces $n$ until calibration is impossible, while increasing $n$ dilutes causal relevance until the estimate is trivial. No method escapes this trade-off; the analyst must sacrifice statistical power for causal specificity or vice versa.

  ### Comparative Performance
  Naive base-rate reasoning fails D1 and D3 by ignoring identity and boundary gerrymandering. Narrative reasoning fails D4 and D2 by relying on post-hoc features and ignoring censoring. Duration-based reasoning from a single observation fails D6 and D7, lacking sample stability and ignoring recorder bias.
