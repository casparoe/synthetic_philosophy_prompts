      5.  Conclusion: The modal view is extensionally similar but intensionally distinct.

  8.  (Drafting the response based on these points...) *Wait, one more thing.* Ian Carter and other negative libertarians have argued that negative liberty *can* accommodate the modal dimension. Pettit's response is always about the *nature of the relationship*. I need to emphasize the *relational* aspect.

