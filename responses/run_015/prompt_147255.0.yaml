      *   Explicit Meta-object -> Representational Regress (Thesis 2).
      *   Formal Syntax -> Grammatical/Logical Distinction (Thesis 3).

      *(Self-Correction on "False")*: Is Bradley's Regress *false*? The *argument* is valid, but the *premise* (that relations need relating) is widely rejected. So the thesis "Relations need relations" is the contentious claim. I should frame it as a "Contested Metaphysical Premise."

  10. **Final Review against constraints:**
