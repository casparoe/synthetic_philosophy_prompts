  The steam from their mugs hung in the air between them, the only thing softening the edges of the argument.

  "Seven to six," Dani said, stirring her coffee. "Honestly, I'm surprised you got six. The calculator panic was real, too. Now we just expect physicists to calculate."

  "Physicians verify the calculus," Teo countered. "They don't just paste the output into a paper. My worry isn't tools, Dani. It's *confidence inversion*. The system is smoothest, most fluent, precisely where I have the least independent grip on the truth. That's where I need calibration most, but it's exactly where I can't collect the feedback. I can only learn to trust the instrument in regions where I didn't need it."

  "So teach the calibration," Dani said. "That's the seminar. But you're treating 'understanding' like a sacrament. I care about true belief arrived at reliably. If the human-plus-system pair gets there, why do I care which half did the lifting? We've relied on unchecked competence for centuries. Nobody thinks a physicist who trusts calorimetry she didn't replicate is thereby not a knower."

  "Because the physicist knows what calorimetry *is*," Teo said. "Here's the difference. I had a student last year who produced a flawless summary of a meta-ethical debate. Perfect citations. But when I asked which premise was load-bearing, she stared at me. She couldn't distinguish the engine from the paint. She had the belief, but she couldn't recover when the system drifted."

  "That's a pedagogy failure, not an epistemology failure," Dani said. "Look, do you mourn your spelling? I haven't manually checked a suffix in ten years. The machine flags it. We don't treat that as a tragedy. We offloaded a cognitive burden to focus on higher-order structure."

  "Spelling is surface," Teo said. "I'm talking about the structure itself. This creates *orphan skills*. Competences that are still worth having in principle—like noticing when a synthesis is subtly wrong—but no individual has an incentive to maintain them. Why practice verification when the system is faster and better right up until the case where it isn't?"

  "Because the system improves," Dani said. "The unit of knowledge is the pair. If the human half contributes nothing the system doesn't already have, maybe that human wasn't necessary for that task. That's efficiency."

  "Efficiency isn't knowledge," Teo snapped, leaning in. "Imagine a field where the checking competence is concentrated in nine living people. Nobody is training the next nine because the system handles the grunt work. The system gets true beliefs. The population gets true beliefs. But when those nine die, the ability to verify vanishes. Is it still knowledge if the capacity to confirm it is extinct?"

  "Then we trust the archive," Dani said. "Science runs on the division of cognitive labor. I don't check the geology in my climate paper. I trust the community."

  "The community checks each other," Teo said. "If everyone uses the same assistant, who checks the assistant? You're describing a monopoly on verification disguised as democratization. You want to allow the assistants freely? Fine. But don't pretend the epistemic cost is zero. You're trading resilience for fluency."

  "And you're hoarding competence," Dani shot back. "You want students to struggle through verification manually so they feel like knowers, even if the system gets them to the truth faster. I'd rather they get the truth and learn to manage the tool than cling to a manual process because it feels virtuous."

  "It's not about virtue," Teo said, picking up his cup. "It's about what happens when the power goes out. You're betting the grid never fails. I'm teaching them how to read by candlelight."

  "And I'm teaching them how to build a better grid," Dani said. "We'll see who's left in the dark."
