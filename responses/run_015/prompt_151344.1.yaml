      *Revised Plan for Objection 1:* The grad student will say you are solving the wrong problem. Parfit is analyzing *existing* rationality, not designing *new* agents.
      *Reply:* Philosophy should inform design. If the current definition of rationality leads to death (stranded in desert), the definition is the bug.

