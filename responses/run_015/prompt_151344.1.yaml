      *   Acknowledge the user's background (SE) while arming them against philosophers.

  7.  **Review against Constraints:**
      *   Ordered by damage? Yes.
      *   Real force, Concession, Reply, Weakness? Yes.
      *   ~2 min reply length (in text, this means concise bullet points or a short paragraph).
      *   American English.
