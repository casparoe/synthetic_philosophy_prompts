  3.  **Identify the Audience's Likely Objections:**
      *   *AI Alignment/Bayesians:* They care about Updateless Decision Theory (UDT), Timeless Decision Theory (TDT), and precommitment. They might say, "We already know this, it's called UDT." Or, "You're confusing the algorithm with the output."
      *   *Parfit Grad Student:* They care about the normative force. Parfit's point isn't about *can* you pay, but *ought* you to pay given you are already safe. The "bug" analogy misses the philosophical point about reasons for action.
