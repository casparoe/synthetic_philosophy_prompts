answer: |-
  This is a precise and demanding brief. Given your background, I will dispense with introductory glosses and move directly to the formal mapping, the stipulations required to make the mapping hold, and the ontological residue that remains.

  ### I. Translation of Readings into Dynamical Systems Vocabulary

  Here, I treat the sociopolitical entity as a dynamical system $\Sigma$ evolving on a state space $X$.

  #### (1) The Breakdown Reading
  **Translation:** The system trajectory $\vec{x}(t)$ undergoes a rapid transition from a high-dimensional attractor $A_{high}$ (characterized by high values in complexity coordinates) to a low-dimensional attractor $A_{low}$. This transition is associated with a negative shock to welfare variables $\vec{w} \subset \vec{x}$.
  **Stipulations & Additions:**
  *   **State Variables:** We must stipulate a vector $\vec{x}$ that includes both *structural complexity* (e.g., hierarchy depth, literacy rate) and *biological welfare* (e.g., skeletal stress markers, population density). The original reading assumes these covary negatively with collapse; the model must enforce this coupling.
  *   **Observables:** Archaeological proxies (pottery diversity, settlement size) are treated as an observation function $h(\vec{x})$. We must assume $h$ is surjective onto the relevant features of $A_{high}$ and $A_{low}$.
  *   **Timescale:** The transition time $\tau_{trans}$ must be small relative to the inter-event interval of the system's natural variability ($\tau_{trans} \ll \tau_{relax}$).
  *   **System Identity:** Identity is preserved by the continuity of the state space $X$ and the governing equations $\dot{\vec{x}} = f(\vec{x}, \vec{p})$. The system is the "same" because the parameters $\vec{p}$ shift (bifurcation), but the phase space remains defined over the same geographical/biological substrate.
  *   **Addition:** I have added the requirement that welfare $\vec{w}$ is a state variable. The original reading implies welfare loss is a *consequence*, but in DS terms, if it isn't in the state vector, it cannot be part of the attractor definition.

  #### (2) The Transformation Reading
  **Translation:** The apparent collapse is a failure of the observation function $h(\vec{x})$, not a bifurcation of the underlying dynamics $f(\vec{x})$. The system moves from attractor $A_{elite}$ to $A_{post-elite}$, but the projection $h_{elite}(\vec{x})$ maps $A_{post-elite}$ to near-zero, while a hypothetical $h_{local}(\vec{x})$ would show continuity.
  **Stipulations & Additions:**
  *   **State Variables:** The state vector must include variables invisible to the elite record (e.g., local kinship networks, subsistence strategies) alongside elite markers (palaces, script).
  *   **Observables:** This reading hinges on *partial observability*. The "collapse" is an artefact of the measurement matrix becoming singular with respect to the new state.
  *   **Timescale:** Irrelevant to the ontological claim, but the sampling frequency must be coarse enough to miss the transient dynamics between $A_{elite}$ and $A_{post-elite}$.
  *   **System Identity:** Identity is tied to the substrate population and geography, not the specific institutional configuration.
  *   **Addition:** I have stipulated that there exists a "true" state space that encompasses both elite and non-elite variables. The original claim often implies an ontological privilege to the non-elite; the model treats them as merely unobserved coordinates.

  #### (3) The Complexity-and-Marginal-Returns Reading
  **Translation:** The system resides in a potential landscape $V(\vec{x})$. Complexity $C$ is a control parameter that deepens the basin of attraction for $A_{high}$ but increases the potential energy (maintenance cost) required to remain there. Collapse occurs when the cost gradient $\nabla Cost(C)$ exceeds the stability gradient $\nabla Stability(C)$, rendering $A_{high}$ unstable (a saddle point) and forcing a roll-down to $A_{low}$.
  **Stipulations & Additions:**
  *   **State Variables:** We must define a "cost" variable and a "yield" variable. This requires an optimization function or a thermodynamic analogue (energy dissipation).
  *   **Observables:** Surplus production and administrative overhead are the proxies for the cost/yield ratio.
  *   **Timescale:** Measured over the secular trend of diminishing returns, not the final failure event.
  *   **System Identity:** The system is defined by its input-output metabolism.
  *   **Addition:** This reading imports *teleology* or *optimization* assumptions. Standard DS are not inherently optimizing; they simply follow gradients. I have had to supply a Lyapunov function that represents "net benefit" to make sense of "returns."

  #### (4) The Processual Reading
  **Translation:** Collapse is not a bifurcation but a spatially extended percolation process or a cascading failure across coupled subsystems. There is no single critical point $t_c$; rather, there is a distribution of transition times $P(t)$ across spatial cells $i$. "Collapse" is the aggregate statistic of these local transitions.
  **Stipulations & Additions:**
  *   **State Variables:** The state is a field $\vec{x}(r, t)$ rather than a vector. Variables are local complexity metrics.
  *   **Observables:** Regional survey data. The "date" of collapse is a statistical moment (e.g., mean or median of $P(t)$), not an ontological boundary.
  *   **Timescale:** Multi-generational. The "event" vanishes as the temporal window widens.
  *   **System Identity:** Identity is fuzzy; the system is a cluster of coupled oscillators. As coupling strength $K$ drops, the cluster dissolves.
  *   **Addition:** I have supplied the coupling mechanism. The original reading describes the *pattern*; the model requires a mechanism (diffusion, network links) to explain the spread.

  ---

  ### II. The Residue Report

  Here we examine where the translation leaks.

  #### (a) Prosperous Simplification
  *   **The Case:** Complexity $\downarrow$, Welfare $\uparrow$.
  *   **DS Diagnosis:** This is a transition from attractor $A_1$ to $A_2$. In the vocabulary of Reading (1), this is *not* a collapse, because the welfare coordinate $\vec{w}$ increased. In the vocabulary of Reading (3), it is a successful optimization (costs reduced, returns maintained).
  *   **The Residue:** The term "collapse" carries a normative load (loss of *good*) that the DS vocabulary lacks. DS describes *instability* or *dimensionality reduction*, not *misfortune*.
  *   **Verdict:** If we stick strictly to the DS translation of Reading (1) (which includes welfare loss), this case is **not a collapse**. It is a "simplification transition." If the archaeological community calls this a collapse, they are using "collapse" to mean "loss of elite complexity" regardless of welfare. The DS vocabulary settles this by forcing a choice: define collapse via structural variables ($C$) or welfare variables ($W$). It cannot be both if they decouple.
  *   **Honest Answer:** Nothing in the vocabulary settles whether this is a collapse because "collapse" is not a natural kind in the equations; it is a label we paste on specific trajectories. The vocabulary reveals that "collapse" is an ambiguous designation for two different phenomena: *structural simplification* and *human suffering*.

  #### (b) Instrument Capture
  *   **The Case:** Proxies saturate at floor because they measure extinct institutions.
  *   **DS Diagnosis:** This is a classic **observability problem**. Let the true state be $\vec{x}$. We measure $\vec{y} = H\vec{x}$. If the regime shift changes the system such that the relevant information moves to the null space of $H$, then $\vec{y} \to 0$ even if $|\vec{x}|$ remains large.
  *   **Absorbing Abruptness:** This explains the *appearance* of abruptness. If $H$ is calibrated to Palace-variables, and the Palace vanishes at $t_0$, the signal cuts to zero at $t_0$. The underlying variables (population, agriculture) may decay slowly (critical slowing down), but the *observable* signal is a step function.
  *   **Verdict:** The DS vocabulary absorbs a significant amount of the apparent depth and abruptness. It reclassifies "collapse" from a system failure to a **sensor failure**. However, it cannot tell us if the unobserved variables *matter*. It solves the epistemic problem but leaves the ontological one: if the elite structure is gone, does the "system" persist?

  #### (c) Fragmentation without Extinction
  *   **The Case:** One polity becomes many; continuity in culture/population.
  *   **DS Diagnosis:** This is a **symmetry-breaking bifurcation** or a change in the topology of the state space. A single basin $A_{unified}$ splits into multiple basins $\{A_{i}\}$.
  *   **Identity Conditions:** Standard DS assumes a fixed dimensionality $N$ for the state space. Fragmentation implies $N \to N \times k$ (more independent units) or a change in the boundary conditions of the field $\vec{x}(r,t)$.
  *   **Verdict:** The vocabulary **has no expression** for the identity of a "corporate body" over time. DS can track the conservation of mass/energy (population, calories), but it cannot track the persistence of a *political entity*. In DS, if the coupling matrix $K$ goes to zero, the single system ceases to exist and is replaced by a set of subsystems. Whether we call this "continuation" or "death" is a semantic decision external to the dynamics. The question "Did the Mycenaean world end?" is unanswerable in DS terms unless we define "Mycenaean world" as a specific connectivity threshold.

  ---

  ### III. Sorting the Residue and The Core Question

  You ask me to sort the residue into **vocabulary impoverishment** vs. **conceptual ambiguity**.

  **1. Vocabulary Impoverishment (What the models miss):**
  *   **Normativity:** DS cannot distinguish between "simplification that kills" and "simplification that liberates" without an exogenously defined value function. It lacks *agents* who experience the transition.
  *   **Corporate Identity:** DS handles continuity of matter and energy well, but poorly handles continuity of *form* or *institution* when the material substrate changes or fragments. It lacks a theory of *social individuation*.
  *   **Meaning:** The "silence of the record" (Case B) is epistemically manageable, but the *loss of meaning* (e.g., literacy disappearing) is ontologically significant to the humans involved in a way "loss of information channel capacity" does not capture.

  **2. Conceptual Ambiguity (What the claims hid):**
  *   **The "Collapse" Label:** The archaeological readings conflate *description* (complexity went down), *periodization* (this marks the end of an era), and *evaluation* (this was bad). The residue shows these come apart (Case A).
  *   **System Boundaries:** Readings (2) and (4) reveal that archaeologists often shift the system boundary mid-argument (from "The Palace" to "The People" to "The Region") to save the phenomenon.
  *   **Causality vs. Correlation:** Reading (3) assumes complexity *causes* its own downfall via costs. DS shows this is only true if specific feedback loops exist. Often, complexity is just a correlate of a stable state that is perturbed externally.

  **The Upshot:**
  "Collapse" is not a single phenomenon your former colleagues lack the resources to describe. Rather, it is a **cluster concept** doing three distinct jobs:
  1.  **Descriptive:** A reduction in sociopolitical energy throughput (DS can model this).
  2.  **Periodizing:** A marker for historical chronology (DS can model the transition point).
  3.  **Evaluative:** A judgment on human welfare and cultural loss (DS *cannot* model this without importing ethics).

  The archaeological dispute is largely a dispute about which of these jobs the term ought to prioritize. When a processualist argues with a breakdown theorist, they are often arguing past each other: one is talking about the *timescale of the transition* (Job 2), the other about the *severity of the welfare loss* (Job 3).

  ---

  ### IV. Defense in Print: The Modeller's Objection

  If you defend the conclusion that "collapse" is a multi-job term and not a unitary dynamical phenomenon, here is the strongest objection a modeller will raise, and how you should answer it.

  **The Objection:**
  *"If 'collapse' is not a unitary phenomenon definable by state variables and transition dynamics, then it is not a scientific concept at all. It is a metaphor. By refusing to operationalize 'collapse' into a specific bifurcation or threshold crossing, you render the term unfalsifiable. You allow historians to move the goalposts: if welfare didn't drop, it was 'transformation'; if the state didn't end, it was 'fragmentation.' This protects the concept from refutation but drains it of explanatory power. If you cannot write the differential equation for collapse, you are doing literature, not science."*

  **The Answer:**
  *"The objection assumes that the ontology of social systems must match the ontology of physical systems to be rigorous. This is a category error. In social systems, the 'state variables' (e.g., legitimacy, hierarchy, literacy) are themselves constituted by the agents' beliefs and behaviors. To define 'collapse' strictly as a bifurcation in a fixed state space is to assume the identity of the system is independent of the description the agents hold of it.*

  *My claim is not that we cannot model these processes, but that 'collapse' is a **higher-order classification** we apply to the models, not a variable within them. Insisting on a single equation for 'collapse' forces us to choose arbitrarily between welfare, complexity, or continuity as the 'true' measure. This doesn't increase scientific rigor; it hides the normative choice behind a mathematical facade.*

  *The rigorous approach is **pluralistic operationalization**: we specify distinct models for 'structural simplification,' 'welfare shock,' and 'political discontinuity.' We then investigate empirically how often these co-occur. If they frequently decouple (as in Prosperous Simplification), then 'collapse' is revealed as a folk category that conflates distinct dynamical outcomes. Preserving the ambiguity serves not to protect the concept from refutation, but to prevent the refutation of one aspect (e.g., welfare) from being disguised as the refutation of another (e.g., hierarchy)."*

  **Summary for your paper:**
  The dynamical systems vocabulary is excellent for clarifying the *mechanics* of transition (speed, stability, observability). It fails to capture the *ontology* of the social entity (identity, normativity). The friction between the two reveals that "collapse" is not a natural kind waiting to be modeled, but a historiographical tool that aggregates structural, demographic, and ethical judgments. Your task is not to find the right model for collapse, but to model the *consequences of using the label* "collapse" on our understanding of the past.
