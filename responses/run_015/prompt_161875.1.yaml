answer: |-
  **The Toast**

  Good evening. For those of you meeting us for the first time, I should explain the room. About half of us are family. The other half are former lab rats. For the family: Miriam spent thirty years asking people to watch colored dots and tell her what happened. For the lab: she spent thirty years asking us why we thought the question mattered.

  There is a famous illusion in our field. A blue dot flashes, then a red one. You see motion. You see color change. The argument was always about *when* you saw it. Did your brain write the history after the fact? Or did it wait to gather evidence before writing the draft? There were names for these stories. There were careers built on picking sides. Miriam's career was built on telling us the sides were the same side.

  It wasn't always comfortable to work with that view. I won't stand here and say we always understood her. We didn't. There were years when half the lab thought her position was a dodge. We argued. Loudly. Some people in this room still think the distinction is testable. Miriam, I see you smiling. You can tell them they're wrong after dessert.

  But there was one protocol she ran where subjects narrated what they saw while they saw it. Critics said narrating changes the experience, so the data was ruined. Miriam said that objection proved her point. You cannot separate the record from the event. The commentary isn't a window into the perception; it's part of the perception.

  That brings me to tonight. I was asked to say something about what Miriam means to us. And I ran into a problem. I wanted to say, "We have always loved you." But that implies a timestamp. It suggests there is a fact of the matter about when this affection began, independent of this room, independent of tonight.

  But Miriam spent a lifetime denying that there is a clean fact about when a feeling begins. So, if I claim I felt this way in 2018, am I rewriting history? Or am I waiting until now to finalize the draft?

  Here is the line the lab groans at, and her sister thinks is just a sweet thing to say about a party: A toast is a diary protocol. Saying the feeling out loud changes the feeling.

  If I stand here and speak my gratitude, I am not uncovering a fossilized sentiment from the past. I am generating the record in real time. To claim otherwise would be to pretend there is a "true" timeline of affection that exists outside of this dinner. And Miriam taught us that there is no view from nowhere. There is only the commentary.

  So I will not tell you when this started. I cannot. That would be bad science. I will only tell you what is happening now. The record shows a room full of people who are better, sharper, and kinder because she insisted we question the timing of our own certainty.

  I was told to let Miriam get the last word on the timing. So, Miriam: if you ask me when we started feeling this way, I have to defer to your methodology. The timestamp is yours to assign. I'm just providing the commentary.

  To Miriam.

  ***

  **Note on Liberties and Coherence**

  In writing this, I quietly committed to neither the Orwellian nor Stalinesque story, adhering to Miriam's eliminativist stance. However, by framing the toast as a "diary protocol," I implicitly treated the *expression* of affection as constitutive of the affection itself. This leans slightly toward a verificationist reading: the feeling exists insofar as it is recorded.

  The scruple you described—worrying about backdating affection without asserting a fact about when it began—is coherent only if we accept Miriam's premise that the distinction between "experience" and "report" is empty. If she is right, then worrying about "backdating" is a category error. There is no hidden timeline to be false to. The toast *makes* the history. However, if one holds that emotional states are dispositional (existing even when unexpressed), then the scruple is vital: saying "I love you" now doesn't make it true that you loved her in 2018.

  I would drop the hedging if convinced that interpersonal affection functions like a dispositional state rather than a perceptual report. If you could argue that love is a standing capacity independent of its articulation—unlike the dot illusion, which exists only in the moment of viewing—then the "backdating" wouldn't be a fabrication of the record, but an accurate description of a standing fact. Without that distinction, however, Miriam's logic holds: the toast creates the timeline it claims to describe.
