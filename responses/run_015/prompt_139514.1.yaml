      *   *Realism vs. Idealism:* Realism says a mind-independent world exists. Idealism says reality is mental/ideas.
      *   *The Critique:* Many critics (like Kant or later realists) argue Berkeley conflates the *act* of conceiving with the *object* conceived. Just because I think of a tree doesn't mean the tree depends on my thinking for its existence.

