answer: |-
  ### I. The Explanatory Desiderata

  To serve as a working tool in cognitive science, a theory of content must do more than satisfy metaphysical intuitions; it must license specific inferences about behavior. The following desiderata specify what such a theory must deliver. I distinguish between those required for the explanatory practice itself (**Non-Negotiable**) and those that reflect specific theoretical commitments (**Theoretical Prejudice**).

  **1. The Normative Gap (Non-Negotiable)**
  *   **The Requirement:** The theory must allow for the possibility of misrepresentation in cases where the system does not internally register the mistake.
  *   **The Motivation:** Cognitive science explains failure as often as success. If a frog snaps at a BB pellet, we explain this by saying it *misrepresented* the pellet as a fly. If content is defined strictly by what causes the state (e.g., "fly-or-BB"), error vanishes. The theory must ground a norm that the system can violate without the system possessing a higher-order state detecting that violation.

  **2. Determinacy of Grain (Non-Negotiable)**
  *   **The Requirement:** The theory must settle the grain of content sufficiently to distinguish between proximal stimuli, distal objects, and abstract categories, without radical indeterminacy.
  *   **The Motivation:** Consider a visual detector. Does it represent *a fly*, *a small moving dark thing*, or *food*? The behavioral output might be identical in a specific context, but predictions about generalization across contexts differ. If the theory allows the content to be "fly-or-dark-spot" (the disjunction problem), it loses predictive power. The cognitive scientist needs to know which invariants the system is tracking to predict how it will behave when the environment changes.

  **3. The Error Budget (Non-Negotiable)**
  *   **The Requirement:** The theory must accommodate states that function precisely by tolerating specific kinds of errors (false positives) to avoid others (false negatives).
  *   **The Motivation:** In signal detection, a smoke detector is designed to represent *fire* even if it frequently represents fire in the presence of burnt toast. The cost of a false negative (missing a fire) outweighs the false positive. A theory that defines content by perfect covariance fails here. The content must be fixed by the *consequences* of the error, not just the statistical correlation.

  **4. The Consumption Condition (Theoretical Prejudice)**
  *   **The Requirement:** A state has content only if there is a downstream "consumer" mechanism that uses that state to guide action or further processing.
  *   **The Motivation:** Consider a neural state produced by a sensory organ but severed from any motor or cognitive downstream pathway. Does it represent anything? The *Consumer* camp says no: representation is a role in a larger system, like a map is only a map if someone reads it. The *Producer* camp says yes: the state carries information about the world regardless of whether it is used. This distinction turns on whether content is essentially relational (tool-like) or intrinsic (picture-like).

  **5. Genealogical Independence (Theoretical Prejudice)**
  *   **The Requirement:** The theory must be able to assign content to systems with no selection history (e.g., trained neural networks, Swampman), or explicitly deny them content.
  *   **The Motivation:** If content depends on evolutionary history (proper function), a spontaneously formed duplicate of a human (Swampman) or a novel AI architecture lacks content. If content depends on current structural/causal role, they have it. Cognitive scientists working with AI need to know if "representation" in a transformer model is the *same kind* of thing as "representation" in a visual cortex. If the theory requires biological history, AI content is merely metaphorical.

  **6. Third-Person Transparency (Non-Negotiable, with caveats)**
  *   **The Requirement:** It must be possible, in principle, for an external observer to determine the content of a state without prior knowledge of what the system is "for."
  *   **The Motivation:** If content is an explanatory tool, the scientist must be able to identify it to use it. If determining content requires knowing the function, and knowing the function requires observing the behavior which the content is supposed to explain, we face circularity. However, if content is fixed by hidden historical facts (evolution), it may be opaque to the observer. The theory must specify how much of the content is readable from the structure and dynamics alone.

  ***

  ### II. The Structural Tensions

  There are subsets of these desiderata that strain against one another. I flag two specific tensions that threaten to fracture the explanatory utility of content.

  **1. History vs. Present-Tense Explanation**
  *   **The Tension:** Fixing content by selection history (to solve Error and Grain) makes content factive about the *past*, but cognitive science explains the *present*. A system may retain a function (and thus content) even if the environment changes such that the state no longer tracks that content (e.g., a craving for sugar in an environment of artificial sweeteners).
  *   **Verdict:** This is a **real tension**, not merely dramatized. Teleological theories secure the Normative Gap and Error Budget by anchoring content in history. But this renders content potentially invisible to the cognitive scientist analyzing the system's current causal dynamics. If the scientist cannot access the selection history (as with a proprietary AI or a novel mutant), the theory denies them the tool of content attribution. The tension is between *metaphysical grounding* (history) and *epistemic accessibility* (current structure).

  **2. Genuine Error vs. Third-Person Readability**
  *   **The Tension:** To identify a state as an *error* (misrepresentation), one must know the *norm* (what it ought to represent). To know the norm, one usually needs to know the *function*. But if the function is not readable from the outside (Desideratum 6), the observer cannot distinguish a system functioning correctly in a weird environment from a system malfunctioning in a normal one.
  *   **Verdict:** This is a **dramatized tension** that can be managed. It is not a logical inconsistency, but a practical limitation. It dissolves if we accept that content attribution is always relative to a hypothesis about the system's goals. The inconsistency only arises if one demands that content be both entirely objective (mind-independent norms) and entirely transparent (readable without hypothesis). A working theory must concede that content attribution is abductive: we infer content from behavior and structure, knowing we might be wrong about the norm.

  ***

  ### III. Preliminary Evaluation of Existing Families

  **The Proper-Function Family (e.g., Millikan, Papineau)**
  *   **Performance:** Excellent on the **Normative Gap** and **Error Budget**. By anchoring content in what a mechanism was selected to do, misrepresentation is simply failing to perform that function.
  *   **Weakness:** Struggles with **Genealogical Independence**. It renders content in novel systems (AI, Swampman) problematic or derivative. It also exacerbates the **History vs. Explanation** tension, as the relevant history is often inaccessible to the working scientist, making content attribution speculative.

  **The Covariance-or-Information Family (e.g., Dretske, Fodor)**
  *   **Performance:** Strong on **Third-Person Transparency** and **Genealogical Independence**. Content is grounded in current causal or informational relations, making it applicable to AI and novel systems.
  *   **Weakness:** Struggles with the **Normative Gap** and **Determinacy of Grain**. Without an appeal to function or history, it is difficult to distinguish between representing *X* and representing *X-or-Y* (the disjunction problem), and difficult to explain how a state can be *wrong* rather than just causing a different effect. It often collapses error into mere difference.
