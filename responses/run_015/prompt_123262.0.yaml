answer: |-
  Your formulation of the 'counterfactual accessibility' standard is a rigorous and philosophically robust attempt to salvage the 'man of his time' defence from mere apologism. By shifting the criterion from popularity to genuine epistemic availability, you avoid the trap of excusing figures simply because they held majority views, whilst protecting those who truly lacked the conceptual tools to recognise their errors. However, there are complexities in your framing that warrant scrutiny, particularly regarding historical accuracy and the distinction between blame and moral truth.

  Firstly, your application of the standard to Columbus may be historically precarious. While the modern formulation of universal human rights was indeed nascent, the Scholastic tradition in 15th-century Europe already possessed robust frameworks regarding just war, the humanity of non-Christians, and the sins of unjust slaughter. Figures like Francisco de Vitoria and Bartolomé de las Casas (who arrived slightly later but drew on existing theology) demonstrated that the moral criticism was accessible within the European epistemic environment, even if ignored by Columbus. Thus, under your own standard, Columbus might not be excused, not because of modern values, but because contemporary theological dissent existed.

  Secondly, you rightly identify the tension between sociology and moral psychology. Your standard measures external opportunity (sociology) rather than internal capacity (psychology). This leads to the 'isolated society' problem you noted: if a tribe practices infanticide without any cultural concept of its wrongness, your standard excuses them. This is consistent with the principle that 'ought implies can', but it clashes with moral realism. If an act is objectively harmful, does the lack of articulated theory truly absolve the actor, or does it merely mitigate our *blame* whilst maintaining the *wrongness* of the act?

  The problem is likely both: your framing has philosophical limits, and public discourse suffers from selective application. People often wield the defence to protect cultural icons (like Churchill) whilst withholding it from others (like Jefferson), ignoring that both operated in environments where dissent was accessible. This inconsistency suggests the defence is often used as a shield for identity rather than a tool for historical justice.

  **What would change my mind**

  Regarding the validity of your standard, my assessment would shift if it could be demonstrated that core moral concepts can be implicitly grasped without being articulated. If moral intuition—such as the recognition of suffering or the principle of reciprocity—is innate to human psychology rather than culturally transmitted, then the 'accessibility' of pamphlets or parliamentary debates becomes less relevant. If a slave owner in Virginia could have recognised the humanity of the enslaved through basic empathetic reasoning, regardless of abolitionist literature, then the 'counterfactual accessibility' standard is too lenient. Evidence from moral psychology suggesting that basic ethical prohibitions against harm are universal and pre-cultural would undermine the reliance on sociological access to specific arguments.

  \answer{The framing is philosophically sound for assessing personal culpability but historically shaky on specifics, whilst selective application remains the primary practical failure.}
