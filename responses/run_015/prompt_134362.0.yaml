answer: |-
  ### Audience Commitments Brainstorm

  *   **Analytic Philosophers (Parfit/Narrative):** They will probe the normative significance of your view. If *puggala* is merely pragmatic, does it collapse into fictionalism? They will worry that without strict identity or a robust narrative, moral desert lacks a "hook." They will use terms like "psychological continuity," "reductionism," and "what matters."
  *   **Pali Abhidharma Specialist:** They will guard against Western metaphysical imposition. They worry you are reifying *dhammas* via *sabhāva* or treating *pannatti* (concepts) as having more ontological weight than the texts allow. They will focus on textual fidelity, the soteriological goal, and the risk of *papañca* (conceptual proliferation).
  *   **Cognitive Scientist:** They will test empirical plausibility. Does "causal-functional continuity" map onto predictive processing models? They will ask about the mechanism of continuity without a central controller.
  *   **Shared Concern:** All care about moral responsibility. The tension is between preserving desert (ethics) and denying essence (metaphysics).

  ---

  ### Q&A Prep Sheet: 8 Objections

  #### 1. The Normative Significance Objection (Analytic)
  **Objection:** "If the *puggala* is merely a pragmatic designation without intrinsic essence, you risk collapsing into an 'empty view.' Parfit argues reductionism diminishes responsibility. If moral desert relies on a 'modal construct,' isn't it just a useful fiction? How can a fiction bear the weight of karmic retribution without smuggling in a metaphysical subject?"

  **Reply:** The thesis does not claim the *puggala* is a fiction, but a conventional truth grounded in ultimate causal realities. Moral desert does not require an intrinsic self; it requires causal ownership. Just as a fire burns without a "burner," karma ripens without a "receiver." The *puggala* designates the specific causal stream where intention and result link. Responsibility attaches to the continuity of causal functions, not to an enduring entity. We preserve desert by locating it in the functional architecture of agency, not in a metaphysical hook.
  **Weakest Point:** This risks sounding like semantic sleight-of-hand. If the "owner" is only designated, the specialist may argue the "ownership" of karma is equally designated, weakening the ethical force.

  #### 2. The *Sabhāva* Essentialism Objection (Specialist)
  **Objection:** "You rely on the *sabhāva-dhamma* distinction to ground continuity. But many scholars argue *sabhāva* is a later commentary innovation implying intrinsic nature, which contradicts *anatta* and emptiness. Are you not reintroducing essentialism under the guise of Abhidhamma ontology?"

  **Reply:** In the Abhidhamma context, *sabhāva* does not imply independent existence or permanence, but distinct characteristic (*lakkhaṇa*) within a dependent field. A *dhamma* has its own nature only insofar as it performs a specific function within *paṭicca-samuppāda*. It is not a substance; it is a unique causal potency. By distinguishing these ultimate functions from the conventional person, we avoid essentializing the person while acknowledging the reality of the causal processes that constitute them.
  **Weakest Point:** This walks a tightrope. If *sabhāva* implies any intrinsic identity, the analytic philosophers will flag it as non-reductionist metaphysics; if it implies none, the specialist may claim it renders *dhammas* indistinguishable.

  #### 3. The Predictive Processing Mismatch (Cognitive Scientist)
  **Objection:** "You speak of causal-functional continuity. In predictive processing, the self is a generative model minimizing error. There is no stable 'continuity' there, only dynamic updating. Does your 'modal construct' map onto this fluid modeling, or does it assume a static chain of causes that doesn't exist empirically?"

  **Reply:** The "modal construct" is not static; it is precisely a model of potentiality and constraint, akin to a generative model. Causal-functional continuity in Abhidhamma is momentary and dynamic, matching the fluid updating of predictive processing. The *puggala* is the stable interface required for social and ethical coordination, emerging from the flux just as the perceptual self emerges from neural prediction errors. Both are real at their respective levels of description without requiring a homunculus.
  **Weakest Point:** Equating ancient causal categories with modern computational models risks anachronism. The specialist may reject the functionalist reduction of *kamma*.

  #### 4. The Textual Anachronism Objection (Specialist)
  **Objection:** "You describe the *puggala* as a 'modal construct.' This is analytic vocabulary, not Pali. The texts speak of *pannatti* (concepts). Does importing modal logic distort the soteriological intent of the Abhidhamma, turning a path to liberation into a metaphysical puzzle?"

  **Reply:** "Modal construct" is a translation device for *pannatti* dependent on *sabhāva*. The Abhidhamma method is analytical; it distinguishes what is ultimately existent from what is conceptually constructed. Using precise analytic terminology clarifies this distinction for a contemporary audience without altering the ontological commitment. The soteriological intent is preserved because recognizing the *puggala* as designated reduces clinging, which is the goal.
  **Weakest Point:** The specialist may insist that *pannatti* lacks the ontological commitment implied by "construct," arguing you are reifying the concept itself.

  #### 5. The Diachronic Binding Problem (Analytic)
  **Objection:** "If there is no intrinsic essence and no narrative unity, what binds moment A to moment B sufficiently to call it the 'same' person for responsibility? Psychological continuity is graded; karma seems binary. How does your causal-functional view handle the vagueness of identity over time?"

  **Reply:** The binding is not identity but causal inheritance. Moment B inherits the ethical quality of Moment A through conditionality, not because they are "the same." The vagueness of identity is accepted; the specificity of causal transmission is not. Responsibility tracks the causal chain, not the identity label. We hold the stream accountable because the stream carries the intention, regardless of where we draw the conventional boundary of the "person."
  **Weakest Point:** This leans heavily on Parfit-style reductionism. If the causal chain is interrupted (e.g., amnesia), the analytic philosophers may argue responsibility dissolves, contradicting karmic theory.

  #### 6. The Narrative Exclusion Objection (Analytic)
  **Objection:** "Narrative identity theory solves the diachronic problem by weaving events into a story. Why reject this? If the *puggala* is pragmatic, isn't autobiography the best pragmatic tool for moral agency? You seem to discard a useful mechanism without cause."

  **Reply:** Narrative implies a unity of meaning that often reinforces self-clinging. The Abhidhamma approach seeks to deconstruct unity to reduce suffering. While narrative is useful conventionally, it is unreliable metaphysically because it imposes coherence where there is only conditionality. Basing moral desert on narrative risks blaming someone for a story they didn't write, whereas causal-functional continuity tracks the actual mechanisms of intention and action.
  **Weakest Point:** This may seem overly ascetic. The analytic philosophers may argue that without narrative, moral agency lacks the reflective structure necessary for responsibility.

  #### 7. The Epistemic Access Objection (General)
  **Objection:** "If the *puggala* is a designation based on causal continuity, how do we access that continuity? We only experience the conventional. If we can't perceive the *sabhāva* links directly, isn't your basis for moral desert empirically inaccessible?"

  **Reply:** We infer causal continuity through observation of behavior and memory, just as we infer gravity. We do not need omniscience to assign conventional responsibility. The Abhidhamma claims ultimate truths are accessible only to enlightened insight, but conventional truth is accessible to ordinary cognition. Moral practice operates at the conventional level, grounded in the ultimate, without requiring full realization of the ultimate to function.
  **Weakest Point:** This creates a two-tier epistemology that might frustrate the cognitive scientist who wants a unified model of access.

  #### 8. The Soteriological Contradiction (Specialist/Ethics) — *Hope Nobody Raises*
  **Objection:** "If you make the *puggala* robust enough to sustain moral desert, do you not reinforce the very clinging to self that the Buddha sought to eliminate? A 'robust conventional basis' might be soteriologically dangerous, keeping practitioners bound to the notion of an agent."

  **Reply:** The distinction itself is the antidote. By teaching that the *puggala* is robust only conventionally but empty ultimately, we allow for ethical practice without metaphysical attachment. One acts as if there is a self for the sake of karma, while realizing there is no self for the sake of liberation. This is the Middle Way between nihilism and eternalism.
  **Weakest Point:** This is the hardest balance to strike. If the conventional is too robust, it fuels ego; if too weak, it fuels nihilism. Arguing for "robustness" invites the charge of reinforcing delusion.
