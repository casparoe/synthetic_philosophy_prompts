answer: |-
  ### Definitions

  | Philosophy | ML Equivalent |
  | :--- | :--- |
  | Moral Truth | Latent Target Function ($f^*$) |
  | Culture | Domain / Subpopulation ($D$) |
  | Disagreement | Label Noise / Distribution Shift |
  | Objectivity | Domain-Invariant Minimizer |

  ### Translations

  (i) **Universalist Realism:** Assumes a single global $f^*(x)$ exists independent of $D$. (Exact fit). Your Pattern 1 (within-country spread) is label noise; Pattern 2 (between-country gaps) is systematic bias correctable via robust aggregation. Pattern 3(a/b) are calibration or weighting errors. The country code is a nuisance variable to be regressed out. Goal: Learn $f^*$ invariant to $D$ minimizing worst-group loss.

  (ii) **Relativism:** Assumes target is conditional: $f^*(x, d)$. (Exact fit on structure). Pattern 2 gaps are signal, not noise. No single global loss minimizer exists. Training requires domain-specific heads or conditioning on $D$. Deployment requires matching training $D$ to deployment $D$. (Bend: Philosophy often claims incommensurability; ML assumes losses are comparable across domains).

  (iii) **Non-Cognitivism:** Assumes no latent $f^*$ exists. (No slot: ML assumes *some* target function, even if stochastic). Preferences are generated outputs, not estimates of hidden states. "Disagreement" is conflicting output distributions $P(y|x, d)$. Pattern 3 is generative divergence. No ground truth to recover; only compatibility checks or negotiation protocols.

  ### Residue

  **Independent Target:** Your vocabulary lacks a slot for "truth" independent of all sampling. "Gold label" is always operationalized (aggregation over annotators under deployment assumptions). There is no variable for "fact of the matter" that does not cash out as a prediction error.

  **Defect or Idle:** This is not a framework defect; it is a feature. Unobservable latents that do not affect the loss landscape are causally idle. You cannot backpropagate through metaphysics. If a "fact" doesn't change the gradient, it is unused capacity. The missing slot signifies that the philosophical claim is untestable within your optimization loop.

  **Taxonomy Bearing:** The taxonomy suggests the metaphysical question is too coarse. (a) is calibration error (compatible with Realism). (b) is prior shift (compatible with Relativism). (c) is support mismatch (feature absent). (c) challenges Realism most; if a feature is unrepresentable in one pool, no reweighting recovers a shared target. The mechanism of disagreement matters more than its existence. The question "is it objective?" is less useful than "what kind of shift is this?"

  ### Verdict

  Your framework treats truth as operational convergence. Philosophers treat it as mind-independent existence. If Pattern 3(c) is prevalent, "objectivity" is ill-posed. The residue isn't a missing variable; it's a category error. Stop asking if the target exists; ask if the loss landscape converges across domains. The data suggests a hybrid: Realism for resource division (Pattern 2), Relativism for loyalty/kin. Metaphysics is only useful insofar as it predicts distribution shift.
