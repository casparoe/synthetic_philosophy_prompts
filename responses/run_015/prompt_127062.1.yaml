  3.  **Drafting the Objections (Iterative Process):**

      *   *Objection 1 (The GNW Labs - Operationalization):* Most likely. They live by report.
          *   *Challenge:* If you can't report it, how do you know it's broadcast? You're smuggling in report to define broadcast.
          *   *Reply:* No-report paradigms (confidence, physiological markers). Distinguish neural signature (P3b/IGN) from behavioral output.
