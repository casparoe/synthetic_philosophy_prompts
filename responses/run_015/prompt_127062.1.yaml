          *   *Reply:* Availability is causal potential, not actualization. Like a loaded gun vs. firing. It explains the *structure* of experience (unity) better than P-consciousness alone.
          *   *Status:* Contested (Nature of dispositional states).

      *   *Objection 3 (The Posterior Psychologist - The Neural Correlate):* High damage to the neural mechanism.
          *   *Challenge:* Frontal ignition is for task set, not consciousness. Posterior activity is sufficient. Your "Broadcast" is just attention.
          *   *Reply:* Posterior activity is content-specific, but Broadcast explains the *global* availability. Attention modulates, but ignition enables the system-wide access.
          *   *Status:* Contested (GNW vs. IIT/Recurrent Processing).

      *   *Objection 4 (The No-Report Postdoc - Measurement):* Technical/Empirical.
          *   *Challenge:* Any readout (even eye tracking) is a consumer system. You can't isolate Broadcast from Uptake empirically.
          *   *Reply:* We look for the *ignition event* itself (EEG/fMRI), not the downstream consequence. The P3b precedes the motor plan.
          *   *Status:* Contested (Interpretation of P3b).

      *   *Objection 5 (The "Nightmare Question" - Lesioned Workspace):* The user specifically requested this. High philosophical damage.
          *   *Challenge:* Broadcast happens, consumers dead. Is there phenomenology? If yes, you're an overflow theorist. If no, Broadcast isn't sufficient.
          *   *Reply:* Counterfactual availability. It's conscious *for* the system, even if the system is broken. Analogy: Screen on but speakers broken.
          *   *Status:* Contested (Metaphysics of consciousness).

      *   *Objection 6 (The Bottleneck - Why Broadcast?):* The user requested this.
          *   *Challenge:* Why need a bottleneck? Why not just recurrent processing in sensory cortex (RPT)?
          *   *Reply:* Coordination problem. To act rationally, different systems need the *same* content at the *same* time. Recurrent processing is local; Broadcast is global integration.
          *   *Status:* Contested (RPT vs. GNW).

      *   *Objection 7 (Automatized Routines - Uptake without Broadcast):* Specific claim in thesis.
