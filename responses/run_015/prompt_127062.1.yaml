          *   *Reply:* Blindsight or highly practiced motor skills where report is impossible but action is precise. Dissociation between P3b and performance.
          *   *Status:* Contested (Interpretation of blindsight/skills).

      *   *Objection 8 (Capacity - One Content?):* Specific claim in thesis ("capacity of roughly one content").
          *   *Challenge:* You say broadcast is ~1 content. But we experience rich scenes. Isn't this just the attentional blink again?
          *   *Reply:* Richness is in the sensory buffer (iconic memory); Broadcast is the *selected* content. This preserves the overflow intuition without breaking GNW.
          *   *Status:* Semi-settled (Capacity limits are empirical), but interpretation is contested.

  4.  **Refining and Formatting:**
      *   Ensure the "Voice" matches the audience (e.g., Philosophers talk about "dispositional properties," Neuroscientists talk about "signatures" and "paradigms").
      *   Check the "Settled vs. Contested" tags. This is crucial for a PhD student to avoid looking naive.
