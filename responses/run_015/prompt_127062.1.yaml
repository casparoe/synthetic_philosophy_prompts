  2.  **Deconstruct the Thesis & Audience Tensions:**
      *   *Tension 1 (GNW Labs):* They equate Access with Report. If you separate Broadcast from Report, you challenge their operationalization. They will ask: How do you measure Broadcast without Report?
      *   *Tension 2 (No-Report Postdoc):* They know neural correlates without report exist (e.g., FRN, specific posterior activity). They will ask: Is your "Broadcast" just the same as the no-report NCC they find?
      *   *Tension 3 (Philosophers):* They worry about circularity. If "Broadcast" is defined by phenomenology, it's trivial. If defined neurally, why is it *conscious*? Is this just P-consciousness renamed?
      *   *Tension 4 (Posterior Psychologist):* They deny frontal ignition is necessary for consciousness. They will attack the GNW premise underlying the "Broadcast" definition.
