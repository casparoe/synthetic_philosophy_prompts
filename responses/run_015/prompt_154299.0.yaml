answer: |-
  ### Preliminary Conceptual Mapping and Tensions

  Before engaging in the rigorous analysis, we must delineate the architectural commitments of both frameworks to identify where friction arises.

  **Indirect Normativity (IN)**
  *   **Core Structure:** Distinguishes between the *criterion of rightness* (what makes an act right) and the *decision procedure* (how an agent chooses). An act is right if it issues from a character trait or decision procedure that is optimific (or otherwise valuable), even if the act itself does not maximize value in that specific instance.
  *   **Normative Source:** External value (e.g., well-being, flourishing). The authority of the procedure is derivative of its instrumental or constitutive relationship to this value.
  *   **Motivation:** To avoid self-defeat (e.g., direct maximization leading to poor outcomes due to psychological limits) and to accommodate moral intuitions regarding special obligations.

  **Idealised Deliberation (ID)**
  *   **Core Structure:** Normative truths are constituted by the endorsements of an agent under counterfactual conditions of full information, cognitive coherence, and emotional stability.
  *   **Normative Source:** Internal rationality/agency. Authority arises from the agent's own hypothetical volition.
  *   **Motivation:** To ground normativity in autonomy and to avoid positing mind-independent moral facts that lack motivational grip.

  **Hidden Tensions**
  1.  **Direction of Fit:** IN moves from Value $\rightarrow$ Procedure $\rightarrow$ Act. ID moves from Agent (Idealized) $\rightarrow$ Endorsement $\rightarrow$ Norm.
  2.  **The Status of the Ideal:** IN requires a fixed standard of value to judge procedures. ID suggests the standard of value is *determined* by the ideal agent. If the ideal agent endorses a procedure, is it good because they endorse it, or do they endorse it because it is good?
  3.  **Stability vs. Fluidity:** IN relies on stable dispositions (virtues/rules). ID implies a dynamic process of reflection that could theoretically revise any commitment given new information.

  ---

  ### Rigorous Analysis: The Circularity Problem and the Divergence of Preferences

  #### I. The Structural Interaction: Circularity or Coherence?

  The central problem posits a hybrid model: The decision procedures evaluated by Indirect Normativity are themselves selected or revised through a process of Idealised Deliberation. We must determine if this generates a vicious circularity or a virtuous, self-correcting loop.

  **The Charge of Vicious Circularity**
  A vicious regress arises if the justification for the deliberative process presupposes the very procedures it is meant to select. To deliberate ideally, an agent requires norms of deliberation (e.g., "weigh evidence proportionally," "avoid akrasia"). If these norms are themselves character traits selected for their value, we face a dilemma:
  1.  If the norms of deliberation are fixed *prior* to the ideal deliberation, then ID is not the ultimate source of normativity; IN (or some foundational value theory) is. ID becomes merely a heuristic tool within an IN framework.
  2.  If the norms of deliberation are *subject* to the ideal deliberation, the agent must use some procedure to select the procedure. If they use their actual, non-ideal procedure, the output is contaminated by bias. If they use the ideal procedure, they have not yet selected it.

  This suggests an Archimedean problem: we lack a leverage point outside the system to lift the system into place. If the "ideal" agent is defined by the possession of optimal decision procedures, but those procedures are defined by what the "ideal" agent chooses, the definition is circular.

  **The Reconstruction as a Virtuous Loop**
  However, this circularity is vicious only if we demand a *foundationalist* justification (linear derivation from indubitable premises). If we adopt a *coherentist* model of justification, specifically a wide reflective equilibrium, the loop becomes virtuous.

  In this reconstruction, the "ideal deliberator" is not a metaphysical entity existing prior to normative inquiry, but a regulatory ideal constructed through the iterative process of moral reasoning.
  1.  **Provisional Start:** We begin with considered judgments and rough-heuristic procedures (our current moral intuitions and habits).
  2.  **Deliberative Testing:** We subject these procedures to scrutiny under conditions of increased information and coherence (approximating ID).
  3.  **Indirect Evaluation:** We assess whether the revised procedures, if internalized, would lead to better outcomes or a more coherent life (applying IN).
  4.  **Feedback:** If a procedure fails the IN test (e.g., it is self-defeating), the ID process revises the endorsement. If the ID process reveals a procedure is rationally unsustainable (e.g., based on false empirical beliefs), the IN evaluation is updated.

  The loop is virtuous because the friction between the *value of the trait* (IN) and the *rational endorseability of the trait* (ID) acts as a error-correction mechanism. The circularity is not premise-circularity (begging the question) but system-circularity (mutual support). The normative authority emerges from the stability of the equilibrium, not from a linear derivation. Therefore, the hybrid model is sustainable provided we abandon the search for a norm-free starting point.

  #### II. The Problem of Divergent Preferences: Welfare vs. Relationships

  We now turn to the substantive ethical friction: cases where the agent's actual first-order preferences (e.g., partiality toward family) diverge from what an idealized counterpart might endorse (e.g., impartial aggregate welfare), specifically regarding the trade-off between long-term welfare and immediate moral salience.

  **The Indirect Normative Handling**
  IN typically resolves this via a "two-level" strategy. It argues that while the *criterion* of rightness is impartial (maximizing aggregate welfare), the *decision procedure* that best satisfies this criterion is one that includes strong partial preferences.
  *   **Rationale:** Human psychology is limited. An agent constantly calculating aggregate welfare will suffer anxiety, make calculation errors, and erode the deep relationships that constitute a significant portion of human well-being.
  *   **Verdict:** The agent should follow the partial preference. The divergence between the act's direct value and the trait's value is a feature, not a bug.

  **The Idealised Deliberation Handling**
  ID faces a sharper challenge here. What would the agent endorse under full information and coherence?
  *   **The Threat of Alienation:** If "full information" includes a god's-eye view of aggregate suffering, the ideal agent might find partiality rationally indefensible. If the ideal agent endorses strict impartiality, but the actual agent cannot psychologically sustain it, ID creates a norm that is alienating. The actual agent is told: "Your ideal self rejects your deepest loves."
  *   **The Psychological Constraint:** A sophisticated ID framework must include information about the agent's psychological nature in the "full information" set. If the ideal agent knows that suppressing partiality leads to psychological collapse or the degradation of intimate goods, they would not endorse a procedure of strict impartiality.

  **The Synthesis and Remaining Tension**
  When we combine IN and ID, we can reconcile the divergence, but a residual tension remains regarding *critical cases*.

  1.  **Reconciliation:** The Ideal Deliberator, aware of the Indirect Normative facts (that partial traits produce better overall outcomes), endorses the partial trait. Thus, the Ideal Self and the Actual Self align on the *procedure* (love your child), even if they diverge on the *criterion* (the Ideal Self knows this is because it maximizes welfare; the Actual Self does it because of love). This preserves integrity.

  2.  **The Residual Tension (The Collapse Problem):** Problems arise when the specific circumstances make the indirect rule self-defeating. Suppose in a specific instance, saving a stranger clearly produces vastly more welfare than saving a family member, and this fact is knowable without triggering psychological collapse.
      *   **IN:** Might still demand following the trait to preserve the disposition's integrity over time.
      *   **ID:** The ideal agent, possessing full information *of this specific case*, might endorse breaking the rule.
      *   **Conflict:** If the decision procedure is selected by ID, and ID sees the exception, ID revises the procedure to allow exceptions. But if the procedure allows exceptions, it risks collapsing back into direct maximization (the problem IN sought to avoid).

  **Resolution via Procedural Hierarchy**
  To maintain the virtuous loop, the hybrid framework must distinguish between *first-order procedures* (daily decisions) and *second-order procedures* (revising habits).
  *   The Ideal Deliberation should not occur at every moment of action. It occurs at the level of character formation.
  *   The Ideal Agent endorses a *rigid* partiality trait for the Actual Agent to use in the moment, precisely because the Actual Agent is not Ideal.
  *   Therefore, the divergence is managed by assigning different roles to the perspectives. The Ideal Perspective selects the rules; the Actual Perspective follows them. The Actual Agent's preference for family is validated *by* the Ideal Agent, not *overruled* by them, provided the partiality stays within the bounds of what promotes aggregate welfare generally.

  However, if the Actual Agent's preferences are *pathologically* partial (e.g., nepotism that harms the general welfare significantly), the Ideal Deliberation will not endorse the trait. Here, IN and ID converge to condemn the actual preference. The tension is only apparent when the Actual Agent's partiality is morally salient but instrumentally useful. In those cases, the hybrid model dictates that the Ideal Agent endorses the Actual Agent's partiality, not because partiality is intrinsically rational, but because the *trait* of partiality is instrumentally optimal.

  #### III. Conclusion

  The integration of Indirect Normativity and Idealised Deliberation does not generate a vicious circularity, provided we understand normative justification as a coherentist process of reflective equilibrium rather than a linear derivation. The "circle" is actually a feedback loop where the value of character traits constrains rational endorsement, and rational scrutiny constrains the selection of traits.

  Regarding the divergence between welfare and relationships, the hybrid framework offers a robust solution: The Ideal Agent endorses the Actual Agent's partial preferences *indirectly*. The normative authority of the relationship is preserved not because the relationship trumps welfare, but because the Ideal Deliberator recognizes that a procedure prioritizing relationships is the most effective vehicle for realizing welfare (or whatever the ultimate value happens to be). The tension dissolves when we recognize that the Ideal Agent is not choosing acts in isolation, but choosing the *constitution* of the Actual Agent. The Actual Agent is thus authorized to follow their immediate moral salience, secure in the knowledge that this very salience has survived the scrutiny of ideal reflection as the optimal strategy for the good.
