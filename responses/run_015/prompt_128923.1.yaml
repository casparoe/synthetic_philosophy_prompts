      *   **Key Characteristic:** Both sides are internally rational (update consistently within their filter) but never converge.
      *   **Key Characteristic:** Neither doubts their filter; they attribute the disagreement to the other's "bad taste in evidence."
      *   **Comparison:** It feels like Aumann's Agreement Theorem failure, but the disagreement isn't about priors on world states, it's about priors on *update rules* (what counts as legitimate evidence).
      *   **Question:** Does this have an established name? Is there a concept separating "disagreeing about beliefs" from "disagreeing about rules for belief-formation"? Or is it just "deep disagreement with extra steps"?

  2.  **Initial Brainstorming & Keyword Association:**
      *   *Aumann's Agreement Theorem:* Common priors, rational agents -> convergence. Failure implies different priors or irrationality. Here, it's different "updating rules."
      *   *Epistemology:* Foundationalism, Coherentism, Reliabilism.
      *   *Philosophy of Science:* Paradigms, Incommensurability.
      *   *Psychology/Cognitive Science:* Motivated reasoning, Confirmation bias (but user says they are internally rational).
      *   *Specific Terms:* "Deep Disagreement," "Epistemic Peer," "Framework Relativism," "Methodological Disagreement," "Higher-Order Evidence."
      *   *Key Distinction:* Object-level disagreement vs. Meta-level disagreement.

  3.  **Evaluating Candidate Concepts:**

      *   **Deep Disagreement (Robert Fogelin):** This is the strongest candidate. Fogelin defined this as disagreement where there is no common ground to adjudicate the dispute. It's not just about facts; it's about the *sources* of authority or evidence.
          *   *Fit:* Very high. Matches the "no convergence" and "different filters" aspect.
          *   *Nuance:* Fogelin originally thought these were rationally unresolvable. Later philosophers (Lynch, Feldman) debated if rational resolution is possible.

      *   **Incommensurability (Kuhn/Feyerabend):** Usually applies to scientific paradigms. Different standards of what counts as a solution or evidence.
          *   *Fit:* Good, but often implies language/conceptual shifts, not just evidence weighting. Still relevant.

      *   **Epistemic Frameworks / Worldviews:** A bit generic.

      *   **Methodological Disagreement:** Accurate description, but is it a named *concept*? It's often subsumed under Deep Disagreement.

      *   **Higher-Order Disagreement / Meta-Epistemic Disagreement:** This captures the "disagreeing about rules for belief-formation" aspect.

      *   **Bayesian Terms:** "Different Likelihood Functions." In Bayesian terms, $P(H|E) \propto P(E|H)P(H)$. If they agree on $P(H)$ (prior belief) but disagree on $P(E|H)$ (how likely the evidence is given the hypothesis, or how much weight $E$ carries), that's a disagreement on the likelihood function or the interpretation of evidence. Actually, if they disagree on whether $E$ is *evidence at all*, that's a disagreement on the relevance/validity of $E$.
          *   *Refinement:* In formal epistemology, this is often modeled as disagreeing on the **likelihood ratio** or the **reliability of the source**.

      *   **Epistemic Bubbles vs. Echo Chambers (Nguyen):** Echo chambers undermine trust in outside sources. This fits the "bad taste in evidence" part.

      *   **Fundamental Disagreement:** Sometimes used interchangeably with Deep Disagreement.

  4.  **Synthesizing the Best Answer:**

      *   **Primary Term:** **Deep Disagreement**. This is the standard philosophical term (Fogelin, 1985). It specifically addresses the lack of common ground for *argumentation rules* and *evidence standards*.
      *   **Secondary Term (Formal/Bayesian):** **Disagreement over Likelihood Functions** or **Updating Rules**. This addresses the "Aumann" angle. Aumann assumes common priors *and* common rationality (updating rules). If updating rules differ, convergence isn't guaranteed.
