answer: |-
  Yes, this deadlock has an established name, and you have correctly identified that it is distinct from standard factual disagreement. The primary term in philosophy for this is **Deep Disagreement**.

  However, given your familiarity with Aumann and Bayesian updating, you might also be interested in how formal epistemology and social epistemology break this down. Here is the taxonomy of the phenomenon you are describing.

  ### 1. The Philosophical Term: Deep Disagreement
  Coined by Robert Fogelin in 1985, **Deep Disagreement** occurs when parties disagree not just on a proposition ($P$), but on the **epistemic principles** used to evaluate $P$.

  *   **Standard Disagreement:** We agree on what counts as evidence (e.g., peer-reviewed studies), but we interpret the data differently.
  *   **Deep Disagreement:** We disagree on whether peer-reviewed studies count as authoritative evidence in this context versus anecdotal experience.

  Fogelin argued that rational resolution is impossible in these cases because argumentation requires common ground. If you disagree on the rules of the game, you cannot play the game to resolve the score. Later philosophers (like Michael Lynch) have debated whether these are truly unresolvable, but the term sticks for the scenario you described: a clash of "epistemic frameworks" where neither side can appeal to a neutral standard without begging the question.

  ### 2. The Formal/Bayesian Term: Disagreement over Likelihood Functions
  You mentioned Aumann's Agreement Theorem. Aumann proves that two rational agents with **common priors** and **common knowledge of each other's posteriors** cannot agree to disagree.

  However, your observation highlights a loophole often glossed over in pop-rationality: Aumann assumes agents share the same **rationality conditions** (i.e., the same updating rules).
  *   **The Prior:** $P(H)$ (Initial belief in hypothesis).
  *   **The Likelihood Function:** $P(E|H)$ (How probable is this evidence given the hypothesis? Or, how much weight should this evidence carry?).

  In the scenario you described, the agents may share priors on the world, but they have **divergent Likelihood Functions** regarding the *evidence itself*.
  *   **Agent A:** $P(\text{Anecdote} | \text{Truth})$ is high. (Anecdotes are strong signals).
  *   **Agent B:** $P(\text{Anecdote} | \text{Truth})$ is low. (Anecdotes are noise).

  In formal epistemology, this is sometimes called **Methodological Disagreement** or **Disagreement over Epistemic Norms**. Because they are applying different transfer functions to the input data, their posteriors will never converge, even if they are both internally consistent (rationally updating according to their own function).

  ### 3. The Distinction: First-Order vs. Meta-Epistemic Disagreement
  To answer your specific question about separating "disagreeing about beliefs" from "disagreeing about rules":

  *   **First-Order Disagreement:** Disagreement about the state of the world (e.g., "Does this drug work?").
  *   **Meta-Epistemic Disagreement (or Second-Order Disagreement):** Disagreement about how one ought to form beliefs about the world (e.g., "Should we trust clinical trials over patient stories?").

  When a debate stalls because of the latter, it is often categorized as a **Category Error** in the argumentation. The participants are trying to solve a meta-epistemic problem using first-order evidence, which is why they talk past each other.

  ### 4. Why the Filters Don't Update (Epistemic Circularity)
  You noted the weird part: *"Neither takes the persistent disagreement as a reason to doubt their filter."*

  This is due to **Epistemic Circularity**. To doubt your filter, you need evidence that your filter is bad. But you can only evaluate that evidence *using* your filter.
  *   If your filter says "Anecdotes are truth," then the other person's statistical study looks like abstract noise.
  *   If your filter says "Statistics are truth," then the other person's anecdote looks like an outlier to be ignored.

  There is no "view from nowhere" to adjudicate which filter is better. This is why the disagreement persists without causing doubt. In social epistemology, C. Thi Nguyen calls this mechanism an **Echo Chamber**. Unlike a bubble (where you just lack info), an echo chamber systematically undermines the trustworthiness of outside sources, making the filter self-sealing.

  ### Summary
  If you want to use the precise terminology:
  1.  **Broadly:** It is a **Deep Disagreement**.
  2.  **Specifically:** It is a **Meta-Epistemic Disagreement** regarding **Epistemic Norms** or **Evidential Standards**.
  3.  **Formally:** It is a divergence in **Likelihood Functions** (updating rules), which violates the common rationality assumption required for Aumann-style convergence.

  It is not just "deep disagreement with extra steps"; it is the *definition* of deep disagreement. The "extra steps" you perceive are the participants attempting to use first-order logic to solve a meta-epistemic incompatibility. Recognizing it as such is often the only way to de-escalate, usually by shifting the conversation from "Who is right?" to "Why do we trust different sources?" (though even that is often fraught).
