          *   *Nature:* Foundational, abstract, traditional philosophy.
          *   *Pros:* Solves the root conceptual tension.
          *   *Cons:* Historically intractable (Reichenbach's problem), likely no consensus, policymakers won't care about the *truth* of the class, only the *utility*.
      *   **Angle 2: Normative/Policy (How decision-makers should pick classes given resource allocation stakes).**
          *   *Nature:* Applied epistemology, decision theory, governance.
          *   *Pros:* High impact, fits the "policy" focus of the user, tractable for a mixed group (phil + stats), actionable within 4 years.
          *   *Cons:* Might be seen as "merely pragmatic" by purists, context-dependent.
      *   **Angle 3: Reference Class Drift (Classes shift over prediction horizons, breaking Bayesian updates).**
          *   *Nature:* Technical, modeling-focused, niche.
          *   *Pros:* Novel, addresses dynamic systems (climate, econ), high potential for technical contribution.
          *   *Cons:* Might be better suited for pure stats/CS, risk of becoming a modeling technicality rather than a conceptual breakthrough, requires heavy computational lift (hard with low funding/only 1 stat).

  3.  **Evaluate Based on Advisor's Criteria ("Macro-Strategy"):**
      *   *Criterion:* "Which open lines actually change anything if they get resolved?"
      *   *Implication:* Impact > Truth. Tractability > Depth (given 4 years/low funding).
      *   *Implication:* Upstream/Downstream dynamics matter.

  4.  **Determine the Ordering:**
      *   *Priority 1: Normative/Policy (Angle 2).* Why? It bypasses the metaphysical deadlock. It directly addresses the "change anything" criterion. It's tractable for the specific team composition (philosophers can handle the normative frameworks, statistician can handle the implementation constraints). It connects directly to the user's interest in policy.
      *   *Priority 2: Reference Class Drift (Angle 3).* Why? It's the most technically novel. If RCP is "dead" in static cases, it's alive in dynamic ones. However, it's riskier for a philosophy PhD (might become too technical) and resource-intensive. It's downstream of the normative question (once you decide *how* to pick, you need to know *when* the pick expires).
      *   *Priority 3: Metaphysical (Angle 1).* Why? It's the "graveyard" of RCP. Even if solved, it has low marginal utility for policy. It's upstream conceptually but downstream in terms of *actionability*. It consumes resources without guaranteeing policy relevance.

  5.  **Drafting the Argument (Iterative Refinement):**

      *   *Introduction:* Acknowledge the advisor's wisdom. The RCP isn't dead, but the *form* of the question needs to shift from "What is true?" to "What works?"
      *   *The Ranking:*
          1.  Normative/Policy (The "Governance" Angle).
          2.  Reference Class Drift (The "Dynamic" Angle).
          3.  Metaphysical (The "Truth" Angle).
      *   *Reasoning for #1 (Normative):* This is where the leverage is. Policymakers don't need the *one true class*; they need a *defensible protocol*. A 4-year project can produce a framework (e.g., "Fairness-constrained Reference Class Selection"). This changes practice.
      *   *Reasoning for #2 (Drift):* This is the frontier. Static RCP is old; dynamic RCP is new. But it requires the statistician to lead. It's high risk/high reward.
      *   *Reasoning for #3 (Metaphysical):* It's a sinkhole. Salmon, Reichenbach, Hájek have chewed on this. Solving it doesn't tell a mayor how to spend flood money.
      *   *Upstream/Downstream:* Metaphysics is upstream conceptually, but Normative is upstream *practically*. You can do Normative work without settling Metaphysics (pragmatism). You can't do good Policy work without addressing Drift (if the class dissolves, the policy fails).
      *   *Tractability:* Phils are good at Normative. Stats are good at Drift. Neither are uniquely good at Metaphysics (it's stalled).
      *   *Evidence to Change Mind:* If the Metaphysical work reveals that *no* normative rule is possible without a specific ontological commitment (e.g., if causal powers are real vs. Humean), then Metaphysics moves up. If Drift turns out to be mathematically reducible to standard non-stationarity, it moves down.

  6.  **Refining the "Reference Class Drift" Concept:**
