  Hey, I'm a software engineer with basically zero formal philosophy background, but I got curious about Hobbes after seeing someone mention he thought geometry was the only real science and tried to apply Euclid-style proofs to politics in Leviathan. From what I gather, he believed reasoning is basically computation — reckoning — and that geometric proofs work because you start with precise definitons and then build up mechanically, and he wanted to do the same for civil philosophy: define terms like sovereignty or justice rigorously so that conclusions follow like code compiling without errors. He also seemed to think this synthetic method only works if the things you define are real bodies in motion, not abstract ideas.

  Can you restate Hobbes's core position about geometry and this geometric method — including the synthetic construction of figures, the idea that reasoning is deterministic reckoning, and the claim that politics fails because people skip the definition step — using the vocabulary I actually live with: type signatures, formal verification, build pipelines, deterministic state machines, syntax versus semantics, and compilation errors? Be precise, not just hand-wavy analogies. Then give me the residue report: which parts map cleanly onto software engineering, which parts translate only with distortion, and which parts have no counterpart at all. In particular, I'm wondering whether his insistence that geometric objects must be physically constructible bodies survives translation into code, or whether that's a dead end that reveals my intuition — that it's basically code is law if you compile it right — is missing something about space and matter. Please answer in British English, as I'm writing an essay with British spelling and don't want to convert programme and behaviour myself. And please don't include a bibliography or reading list — I won't be able to check them without web access anyway.
