answer: |-
  You have a very sharp intuition about where the logic is straining. You are correct that the argument relies on a **False Dilemma** in step (6), but that dilemma only holds water if you accept a specific assumption in step (5).

  To escape this trap without conceding that the term is hollow, you should **reject the inference in Step (6)**, but to do so successfully, you must first **challenge the premise in Step (5)**.

  Here is the breakdown of where the argument slips, how to fix it, and what it costs you.

  ### The Weak Link: Step (5) to Step (6)

  Your friend's conclusion (6) rests on the claim in (5) that broadening the definition makes the term "redundant" and causes it to lose its "bite." This is the leap you suspected.

  **The Flaw:** It assumes that if two moral categories overlap (Genocide and Crimes Against Humanity), they are identical. They are not.
  *   **Crimes Against Humanity** focus on the violation of *individual* rights on a mass scale.
  *   **Genocide** (even a moral, non-legal version) focuses on the destruction of the *group entity* itself.

  Even if you remove the strict "specific intent" requirement, the *object* of the harm remains distinct. A policy can kill thousands of individuals (Crime Against Humanity) without threatening the continued existence of their culture, lineage, or identity. A policy can destroy a group's future (Genocide) without necessarily killing every individual immediately (e.g., forced sterilization or child removal).

  Therefore, broadening the definition does not make it redundant; it simply shifts the focus from the *perpetrator's mind* (intent) to the *victim's reality* (group destruction).

  ### The Exit Strategy: Reject the False Dilemma

  Your friend argues: *Either* we keep strict intent (and miss cases) *or* we drop it (and the term becomes meaningless).

  **The Third Option:** We accept that "genocide" is a **cluster concept** rather than a binary switch. It is a moral gravity well.
  You can argue that "genocide" describes a specific *type* of harm (group destruction) that is distinct from mass murder, regardless of whether the legal threshold of intent is met. This keeps the "bite" (the unique horror of erasing a people) without requiring mind-reading to prove specific intent.

  **How to phrase this to your friend:**
  > "You're presenting a false choice. You're saying that unless 'genocide' is a precise legal scalpel, it's just a political blunt instrument. But moral concepts aren't legal statutes.
  >
  > If we define genocide morally by the *outcome* (the destruction of a group as such) rather than just the *intent*, it doesn't collapse into 'Crimes Against Humanity.' CAH is about killing people; Genocide is about killing a future. Those are different harms, even if the body count is the same. So the term isn't hollow; it's just doing a different job than the legal definition."

  ### The Cost of This Move

  You asked what giving up this step costs you. It is important to be honest about this, or your friend will just pivot to attack the cost.

  **1. You lose legal certainty.**
  By separating the moral label from the legal "intent" clause, you admit that you cannot use a checklist to determine if genocide is happening. It requires interpretation and judgment. You lose the comfort of saying, "The court hasn't ruled it genocide, so it isn't."

  **2. You accept "Gradient Guilt."**
  If you remove the strict intent requirement, you have to grapple with negligence vs. malice. If a government's "modernization" policy destroys a group, is it *as bad* as a regime that explicitly plans extermination? Most people feel there is a moral difference. By broadening the label, you risk flattening that distinction. You have to argue that the *result* (group death) is the primary moral wrong, not just the *motivation*.

  **3. You concede the "Political" point (partially).**
  You must admit your friend is half-right: The label *is* political. But you must argue that **being political does not mean being hollow.**
  *   *Analogy:* "Democracy" is a contested, political term. People fight over what counts as democracy. That doesn't mean the word is hollow or that there's no difference between a democracy and a dictatorship.
  *   *Argument:* "Genocide" is a political weapon *because* it has moral weight. If it were truly hollow, no one would fight to use it or avoid it. The fight proves the concept matters.

  ### Summary of the Counter-Argument

  1.  **Reject (6):** It is not true that the term is either "perfectly precise" or "totally hollow." Most important moral concepts (Justice, Freedom, Terrorism) are contested but meaningful.
  2.  **Modify (5):** Broadening the definition doesn't make it redundant with Crimes Against Humanity because the *object of harm* (the group entity vs. individuals) remains distinct.
  3.  **Accept the Cost:** Acknowledge that using the term morally requires nuance and judgment, not just legal verification.

  **The Winning Line:**
  "The fact that people fight over the label proves it has a moral core. If it were truly hollow, it wouldn't be worth fighting over. The difficulty in applying it doesn't mean the concept is broken; it means the reality is complex."
