answer: |-
  Allowing encrypted subroutines fundamentally collapses program equilibrium by destroying the transparency required for mutual verification, reverting the interaction to standard uncertainty where defection remains rational because opponents cannot statically prove the hidden logic dictates cooperation. Program equilibrium relies on the assumption that the submitted source code fully specifies the agent's strategy, enabling opponents to simulate or logically verify the outcome before playing. When critical decision logic is hidden behind encryption, the opponent sees only a hash check without knowing whether the decrypted payload commands cooperation or defection upon a match. This reintroduces the information asymmetry that program equilibrium was designed to eliminate, forcing rational agents to assume the worst-case scenario within the opaque module and defect to protect themselves. If the decryption key is held off-chain, the strategy is no longer contained within the submitted program object, violating the core definition of the game where the code itself constitutes the player's binding commitment. Consequently, this setup does not preserve program equilibrium but rather shifts the burden to cryptographic commitment schemes, functioning as fancy obfuscation that fails to solve the trust problem without external enforcement mechanisms.
