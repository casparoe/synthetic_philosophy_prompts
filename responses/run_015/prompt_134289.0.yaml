answer: |-
  This is a classic philosophical stalemate. You are exhausted because you are arguing against a slogan that has survived 2,300 years of debate precisely because it sits on a fault line between logic, language, and metaphysics. Your roommate is using Gongsun Long's *Bai Ma Fei Ma* ("A white horse is not a horse") to argue for a kind of nominalist fluidity (categories are contingent, properties don't define identity).

  Your intuition is correct: he is likely conflating **logical distinction** with **ontological contingency**. Gongsun Long's argument is typically read as *hyper-realist* (properties are so real they create new identities), whereas your roommate is using it to argue for *anti-realism* (properties are just labels that don't stick to the core identity).

  Here is the menu of interpretations you asked for. You can literally show him this list. I have broken the slogan down into distinct logical claims, ranging from trivial linguistic observations to radical metaphysical assertions.

  ### The Menu of Interpretations: "A White Horse Is Not A Horse"

  #### 1. The Synonymy Claim (Linguistic)
  *   **The Claim:** The term "white horse" does not mean exactly the same thing as the term "horse."
  *   **Logical Form:** $\text{Meaning}(\text{White Horse}) \neq \text{Meaning}(\text{Horse})$
  *   **Verdict:** **Trivially True.** "White horse" has two morphemes; "horse" has one. They are not synonymous.
  *   **Does it support your roommate?** **No.** This proves nothing about ontology. It only proves language is specific. It doesn't show that kind membership is contingent, only that words differ.

  #### 2. The Extensional Claim (Set Theory)
  *   **The Claim:** The set of white horses is not identical to the set of horses.
  *   **Logical Form:** $\{x \mid W(x) \land H(x)\} \neq \{x \mid H(x)\}$
  *   **Verdict:** **Mathematically True.** The set of white horses is a *proper subset* of horses. A subset is not identical to the superset.
  *   **Does it support your roommate?** **No.** This actually supports a rigid hierarchy. It confirms that "white horse" is a *more constrained* category than "horse." It implies properties *add* constraints, rather than making membership contingent.

  #### 3. The Intensional Claim (Conceptual)
  *   **The Claim:** The concept of "white horse" contains the attribute of color; the concept of "horse" does not.
  *   **Logical Form:** $\text{Intension}(\text{WH}) = \text{Intension}(\text{H}) + \text{Color}$
  *   **Verdict:** **Defensible.** This is the standard Fregean distinction between sense and reference.
  *   **Does it support your roommate?** **No.** If anything, this supports *essentialism*. It suggests that if you add a property (white), you change the concept. The property "touches" the identity enough to alter the concept.

  #### 4. The Referential Failure Claim (Pragmatic)
  *   **The Claim:** If you ask for a "horse," a brown horse satisfies the request. If you ask for a "white horse," a brown horse does not. Therefore, functionally, they operate as different categories.
  *   **Logical Form:** $\exists x (H(x) \land \neg \text{Satisfies}(x, \text{Request}_{\text{WH}}))$
  *   **Verdict:** **Defensible.** This is about utility and context, not metaphysics.
  *   **Does it support your roommate?** **Weakly.** He could argue this shows categories are defined by human needs (language games) rather than nature. However, it doesn't prove membership is *contingent*, only that specificity matters.

  #### 5. The Ontological Separation Claim (Metaphysical Realism)
  *   **The Claim:** "Whiteness" and "Horseness" are distinct universals. When combined, they form a composite entity that is distinct from the universal "Horse."
  *   **Logical Form:** $\text{Entity}(\text{White} + \text{Horse}) \neq \text{Entity}(\text{Horse})$
  *   **Verdict:** **Controversial (Platonic Realism).** This is likely what Gongsun Long actually believed. Properties are real things that combine.
  *   **Does it support your roommate?** **Absolutely Not.** This is the opposite of his view. This claims properties are *so real* that adding one creates a new ontological object. Your roommate wants to say properties *don't* touch identity; this view says they *constitute* identity.

  #### 6. The Radical Discontinuity Claim (Your Roommate's View)
  *   **The Claim:** Because "white horse" is not "horse," the category "horse" has no essential core. Adding properties creates a totally new kind, making all kind-membership fluid and contingent on description.
  *   **Logical Form:** $\forall F (F(a) \to \text{NewKind}(a))$
  *   **Verdict:** **False / Non-Sequitur.** Just because a specific subset isn't identical to the general set doesn't mean the general set lacks essence or that membership is contingent.
  *   **Does it support your roommate?** **Yes, but only by force.** This is the only reading that gets him to his conclusion, but it requires a logical leap that the slogan itself does not support.

  ---

  ### The Diagnosis: Where He Is Wrong

  You can tell him this: **He is using a proof of Specificity to argue for Contingency.**

  1.  **The Logic of the Slogan:** Gongsun Long's point is usually that specificity *constrains*. "White horse" is *more* restricted than "horse." Therefore, logic *does* constrain ontology. If you add a property, you narrow the being.
  2.  **His Conclusion:** He argues that because the terms differ, the underlying kind membership is contingent (i.e., "It's only a horse until you call it white").
  3.  **The Contradiction:** If "white horse is not horse" is true because properties change identity (Interpretation 5), then properties **do** touch identity. They touch it so hard they break the category.
      *   If he says properties *don't* touch identity, he can't use the slogan to prove they create new categories.
      *   If he says the slogan proves they create new categories, he admits properties *do* touch identity.
      *   He cannot have it both ways.

  ### Your Intuition: Compound-Term Logic vs. Essentialism

  You mentioned you felt he was mixing up **compound-term logic** with **essentialism**. Here is how to articulate that distinction for him:

  *   **Compound-Term Logic (Your view):** "White horse" is a logical conjunction ($W \land H$). "Horse" is a single term ($H$). Of course $W \land H \neq H$. This is a rule of syntax and semantics. It tells us about **terms**, not the world.
  *   **Essentialism (The Ontological View):** Does the "horse-ness" persist regardless of the color? An essentialist says yes (the substance remains). A radical nominalist (your roommate) says no (it's just a label).
  *   **The Trap:** The slogan works in Compound-Term Logic (True: the terms differ). Your roommate is trying to smuggle it into Ontology (False: therefore substances don't have stable identities).

  **The "Slam-Dunk" Counter:**
  Tell him: *"If 'white horse is not horse' proves properties don't touch identity, then 'black horse is not horse' also proves it. So a white horse and a black horse share no identity. But they are both horses. So there must be a stable 'horse' identity that persists through the color change. Therefore, properties are accidental, but the kind membership is **essential**, not contingent. You just proved essentialism using a slogan you thought was nominalist."*

  ### Summary for the Roommate
  If you want to end the argument (or win it), hand him this summary:

  1.  **Trivial Reading:** The words mean different things. (True, but irrelevant to ontology).
  2.  **Set Reading:** The subset is not the set. (True, but implies rigid hierarchy, not contingency).
  3.  **Roommate's Reading:** Properties make kind membership contingent. (False. The slogan actually shows properties **restrict** kind membership, making it *more* rigid, not less).

  You were right: he is treating a logical distinction about **intension** (meaning) as if it were a metaphysical claim about **contingency** (existence). The slogan proves that language is precise, not that reality is fluid.
