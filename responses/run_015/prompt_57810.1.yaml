  *   **The Cracks (Breakdown):** Uniqueness, Normativity, Causal Power.
  *   **Test Cases:** Heater (Noise), Bot (Indeterminacy).
  *   **The Verdict on Neuroscience/Chatbots:** Nuanced "Yes, but..."
  *   **Better Analogy:** Cartography/Maps.

