answer: |-
  Here's a run sheet for the session. Since they're grad students, you can skip the bio stuff and go straight for the structural tension. The goal is to show that *The Querist* isn't a side-quest; it's the same boss fight as *Principles of Human Knowledge*, just with a different skin.

  ### 1. The Foundation: Rejection of Abstract Ideas (Start Here)
  Don't start with language yet. Start with the **rejection of abstract ideas**.
  *   **Why:** This is the shared DNA. In metaphysics, Berkeley attacks Locke's "abstract matter" (substance existing apart from perception). In economics, he attacks the Mercantilist/Lockean "abstract value" (value existing apart from circulation/use).
  *   **The Move:** Show them that for Berkeley, "Value" is exactly like "Matter." People think value is a *thing* hidden inside the gold (just as they think reality is a *thing* hidden behind the sensation). Berkeley says: Stop looking for the substratum. Look at the relations.
  *   **Why not Language first?** Language is the *solution*, but the rejection of abstraction is the *problem* they need to feel first. If they don't see the idolatry of "intrinsic value," the linguistic turn won't land.

  ### 2. The Carrying Example: 1720s Irish Banknote vs. Gold Coin
  Use this immediately after the abstraction point.
  *   **The Setup:** A gold coin (guinea) vs. a banknote from a shaky Irish bank.
  *   **The Materialist View:** The gold has value *in it* (intrinsic). The note is just paper (worthless unless redeemed).
  *   **The Berkeleyan View:** The gold is just metal. It only has value because the social system *signifies* it as valuable. The note does the exact same job but is more honest about being a sign.
  *   **The Punchline:** Preferring gold over notes is the economic equivalent of preferring "matter" over "ideas." It's fetishizing the substrate. The note is the *esse est percipi* of finance: its value exists only in being accepted (perceived) by the public.

  ### 3. Defusing Misconceptions (In Sequence)
  Grad students will trip over these in a predictable order. Don't wait for them to ask; plant the mines and clear them as you go.

  *   **Misconception 1: "He's just saying money is imaginary/fake."**
      *   *When:* Right after the Banknote example.
      *   *The Fix:* Distinguish "mental" from "imaginary." For Berkeley, ideas are real. Money is a **social technology**, not a private fantasy. It has causal power (it moves labor), just like sensory ideas have causal power (fire burns).
      *   *Key phrase:* "It's intersubjective, not subjective."

  *   **Misconception 2: "This is just Locke on value with extra steps."**
      *   *When:* Mid-session, when discussing where value comes from.
      *   *The Fix:* Locke grounds value in labor + material durability. Berkeley grounds it in **circulation + industry**. For Berkeley, hoarding gold kills value (stops the sign from working). For Locke, hoarding gold stores value. This is a structural break, not a tweak.
      *   *Key phrase:* "Locke wants a warehouse; Berkeley wants a river."

  *   **Misconception 3: "So he denies material causation for economics too?"**
      *   *When:* Near the end, when tying back to metaphysics.
      *   *The Fix:* He denies *matter* as a cause, not *causation* itself. In economics, the "cause" of wealth isn't the metal; it's the **will/industry of the people** (spirits). This mirrors the metaphysics: Ideas don't cause things; Spirits (God/Us) do.
      *   *Key phrase:* "Money doesn't make things happen; people make things happen using money."

  ### 4. The "Pressure" Point (The Core Argument)
  This is where you sell the "not a weird hobby" thesis.
  *   **The Argument:** If Berkeley is right about money (that it functions perfectly without intrinsic substance), then the main objection to immaterialism ("But we need matter to explain reality!") loses its bite.
  *   **The Pressure:** We already live in a Berkeleyan economic world. We accept that value is relational, not substantial. If we accept that for money, why do we balk at it for tables and chairs? The economics makes the metaphysics **plausible**. It shows that "substance-less reality" isn't crazy; it's how the Bank of Ireland already operates.

  ### 5. The Check (No Slogan-Parroting)
  Don't ask "What is money for Berkeley?" They'll just say "A sign."
  *   **The Scenario:** Ask them about **Academic Credentials** (since they're grad students).
  *   **The Question:** "If a PhD is just a piece of paper (like the banknote), and Berkeley says the value isn't in the ink or the 'abstract knowledge' inside the head, where is the value? And if the university closes tomorrow, does the PhD still have value?"
  *   **The Pass:** If they say the value lies in the **social recognition and the ability to mobilize labor/resources** (getting a job, teaching), they get it.
  *   **The Fail:** If they say the value is in the "knowledge contained" (intrinsic) or "it's worthless because it's not real gold" (materialist), they missed the point.

  ### 6. What to Explicitly Refuse to Cover
  Put this on the board or say it upfront to save time.
  *   **The Policy Wonkery:** Do not get bogged down in his specific proposals for the **Bank of Ireland**, hemp manufacturing, or wearing wool. That's history of economics, not philosophy.
  *   **The "Why":** Tell them: "We aren't here to judge if his economic policy would have fixed 18th-century poverty. We're here to see if his ontology holds up when applied to social constructs."
  *   **Quarantine *The Querist* Questions:** Don't read 50 questions from *The Querist*. Pick two max. It's a rhetorical style that bogs down discussion.

  ### Quick Tips for the Room
  *   **Typo Check:** You mentioned you're on your phone—don't worry about typos in your handout, but make sure the distinction between *signification* and *causation* is crisp on the whiteboard.
  *   **Tone:** Keep it slightly provocative. They think econ is a hobby? Treat it like the "smoking gun" that proves his metaphysics isn't just skepticism but a positive theory of social reality.
  *   **Text:** If they read anything, assign **Dialogues 1-4 of *Alciphron*** (on language/signs) rather than *The Querist*. It's the philosophical engine room for the economic view.

  Good luck. If you can get them to see the banknote as an "idea" that moves bodies, you've won.
