      *   *Better-for-whom vs. Better-simpliciter:* This is relevant. Case 1 highlights the interpersonal aggregation problem. Case 2 highlights the intrapersonal aggregation problem.
      *   *Diagnosis:* It's primarily a disagreement about the **shape of the value function** (linear vs. threshold/discontinuous) and the **scope of aggregation** (interpersonal vs. intrapersonal). It's not just verbal; it's axiological.

