  # MADNESS AND MEDICINE: THE SORTING TREE
  **Instructions:** Start at the top. Answer **Yes/No/Depends** for each case. Follow the arrows. If you answer "Depends on the specific case," follow the **Pluralist** path.

  ---

  ### [NODE 1] THE ANCHOR
  **Case 1 (Degreaser's Dementia):** Factory worker, solvent exposure, white-matter damage visible on imaging/autopsy. Apathetic, tremulous.
  *Is this a bodily disease?*
  *   **No:** → **Leaf A: Error** (You are not engaging with the medical model).
  *   **Yes:** → **Go to Node 2.**

  ### [NODE 2] THE AUTOPSY TEST (Metaphysics Split)
  **Case 3 (Grief):** Widow, 6 months post-loss. Insomnia, hears voice, can't work. No lesion found at autopsy.
  *Is this a bodily disease in the **same sense** as Case 1?*
  *   **No:** → **Go Left (The "Problems in Living" Track).**
  *   **Yes:** → **Go Right (The "Naturalist" Track).**
  *   **Depends:** → **Leaf B: Pluralist** (Categories shift by context).

  ---

  ### [LEFT TRACK: NO LESION REQUIRED]

  ### [NODE 3L] THE EXIT TEST
  **Case 4 (Longshoremen):** Port closed. Men in 50s convinced bodies only fit for loading. No pain, no cognitive deficit. If port reopens, conviction vanishes.
  *Is the prior state a disease, or just a mismatch with the economy?*
  *   **Mismatch:** → **Go to Node 4L.**
  *   **Disease:** → **Go to Node 5L.**

  ### [NODE 4L] THE LABELLING TEST
  **Case 6 (Online Syndrome):** Symptoms spread by description. Real distress, no lesion, diagnosis unlocks housing/payment.
  *Is the diagnosis primarily a tool for social control/resource allocation?*
  *   **Yes:** → **Leaf C: Labelling/Deviance** (Szaszian metaphysics + Coercion/Social Control).
  *   **No:** → **Go to Node 7.**

  ### [NODE 5L] THE USEFUL FICTION TEST
  **Case 6 (Online Syndrome):** (See above).
  *Even if not a 'disease', should we keep the category to unlock care?*
  *   **Yes:** → **Leaf D: Useful Fiction** (Pragmatic, not ontological).
  *   **No:** → **Go to Node 7.**

  ---

  ### [RIGHT TRACK: LESION NOT REQUIRED]

  ### [NODE 3R] THE DESIGN TEST
  **Case 5 (Teenagers):** Can't sit through lesson, play strategy game 9 hours. Apprenticeship successful.
  *Is a psychological mechanism failing its design function, or just mismatched to school?*
  *   **Failing:** → **Go to Node 4R.**
  *   **Mismatched:** → **Go to Node 5R.**

  ### [NODE 4R] THE ELIMINATIVIST TEST
  **Case 2 (Syphilis):** Late-stage syphilis, grandiosity, personality change.
  *Is 'mental illness' just a placeholder for neurology we haven't fully mapped yet?*
  *   **Yes:** → **Leaf E: Eliminativist** (It will all be neurology eventually).
  *   **No:** → **Go to Node 7.**

  ### [NODE 5R] THE MEANING TEST
  **Case 3 (Grief):** (See Node 2).
  *Is the suffering intelligible given the life history, and therefore not an illness?*
  *   **Yes:** → **Leaf F: Meaningful-Suffering** (Intelligible, not illness).
  *   **No:** → **Go to Node 7.**

  ---

  ### [THE COERCION SPLITTER]
  *(All paths converge here except Leaves A, B, C, D, E, F)*

  ### [NODE 7] THE COERCION TEST
  **Case 7 (Violence):** Planned assault, no guilt, abused childhood. Blunted stress response on average, no individual lesion.
  **Case 8 (Anorexia):** Starving, articulate, refuses treatment, says she would rather die.
  *Does having the 'Mental Illness' label license anyone to do something to these persons against their will?*
  *   **Yes (Case 7 or 8):** → **Go to Leaf G.**
  *   **No (Neither):** → **Go to Leaf H.**

  ---

  ### [THE LEAVES]

  **Leaf G: Harmful-Dysfunction Naturalist**
  *(Disease is real/dysfunctional, AND coercion is sometimes justified.)*
  *   *Note:* If you came from the **Left Track**, you are a **Paternalist Szaszian** (No lesion, but section anyway).
  *   *Note:* If you came from the **Right Track**, you are a **Standard Medical Model**.

  **Leaf H: Intelligible-and-Still-Illness / Libertarian Naturalist**
  *(Disease is real/dysfunctional, BUT coercion is never justified.)*
  *   *Note:* If you came from the **Left Track**, you are a **Libertarian Szaszian** (No lesion, no section).
  *   *Note:* If you came from the **Right Track**, you are a **Liberty-First Naturalist**.

  ---

  ## FACILITATOR NOTES & LOGICAL MAP

  ### 1. The Coercion Split (Your Key Requirement)
  Node 7 is designed to cut across the Metaphysical split (Node 2).
  *   **The Szaszian Metaphysician + Pro-Coercion:** Answers **No** at Node 2 (Grief is not disease) but **Yes** at Node 7 (Section the anorexic/violent man). They land in **Leaf G (Left Track path)**. They believe "Mental Illness is a myth" *ontologically*, but "Dangerousness/Need" justifies force *ethically*.
  *   **The Naturalist + Anti-Coercion:** Answers **Yes** at Node 2 (Grief is disease/dysfunction) but **No** at Node 7 (Do not section). They land in **Leaf H (Right Track path)**. They believe "Mental Illness is real" *ontologically*, but "Liberty" trumps *ethically*.
  *   **Verdict:** The tree successfully separates them.

  ### 2. Empty Logical Spaces
  *   **"The Harmless Disease":** No lesion, no dysfunction, no distress, no social disvalue, yet still a disease.
      *   *Status:* **Incoherent.** Without harm, dysfunction, or deviation, the concept of 'disease' loses its extension.
  *   **"The Punitive Lesion":** We found the lesion (e.g., amygdala deficit in Case 7), and therefore it is a reason to punish him *harder* (not treat, not excuse).
      *   *Status:* **Unattractive/Unexplored.** This inverts the "disease excuse" logic. While legally possible (mens rea debates), no major psychiatric theory advocates finding a lesion *to increase* culpability.

  ### 3. Indistinguishable Leaves
  The eight cases provided cannot reliably pull apart these two pairs:
  *   **Harmful-Dysfunction Naturalist vs. Eliminativist:** Both answer "Yes" to Lesion/Dysfunction questions. Case 2 (Syphilis) supports both. To separate them, you would need a question about *current* vs. *future* ontology (e.g., "Is 'depression' a real category *today*?").
  *   **Meaningful-Suffering vs. Hard Szaszian:** Both answer "No" to Disease on Case 3 (Grief). The distinction is semantic ("Problems in Living" vs. "Meaningful Suffering"). The cases do not force a choice between these two labels, only between "Medical" and "Not Medical."

  ### 4. Why These Questions?
  *   **Node 1 (Anchor):** Prevents contrarianism. If they say Degreaser's Dementia isn't medical, the exercise breaks.
  *   **Node 2 (Autopsy):** The classic Szasz fault line. Lesion vs. No Lesion.
  *   **Node 3L/R (Exit/Design):** Distinguishes between "Social Construction" (Longshoremen) and "Internal Dysfunction" (Teens).
  *   **Node 4L/5L/4R/5R:** Refines the specific *flavor* of the non-medical or medical view (Pragmatic vs. Critical vs. Eliminative).
  *   **Node 7 (Coercion):** The ethical hard stop. Uses Case 7 (Risk to others) and Case 8 (Risk to self) to test the limits of the label's power.

  ### 5. Printing Instructions
  *   Print the Flowchart on one side, Notes on the reverse.
  *   Use bold text for the **Case Descriptions** so students don't have to memorize them.
  *   Draw the convergence at Node 7 clearly; it is the most important structural feature.
