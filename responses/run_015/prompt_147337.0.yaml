answer: |-
  The distinction between capability and realized takeoff is useful; it isolates physical limits from social friction. Here is the draft.

  ### 1. Agreed claims

  1.  Capability takeoff measures the growth of a system's latent capability per unit of effective compute, assessed under the best elicitation protocols currently available.
  2.  Realized takeoff measures the growth of measured effects in the world per unit of calendar time, reflecting actual economic or physical impact.
  3.  We agree Realized takeoff is functionally Capability takeoff minus deployment friction, where friction encompasses regulation, integration costs, hardware scaling limits, organizational inertia, and the time required for workforce adaptation.
  4.  Both parties accept that latent capability systematically exceeds currently deployed capability due to necessary safety testing, alignment constraints, and risk mitigation strategies.
  5.  We agree the gap between demonstrated and latent capability is likely to widen as systems become more general, potent, and potentially hazardous to deploy openly.
  6.  Recursive improvement requires the system to be performing a significant majority of the research-and-engineering loop itself, rather than merely executing tools provided by humans.
  7.  For improvement to count as recursive in the relevant sense, the system must autonomously propose, test, and deploy architectural changes or training modifications without human intervention.
  8.  We agree compute availability remains a primary physical bottleneck for capability growth regardless of the takeoff speed scenario, limiting the rate of effective compute expansion.
  9.  Economic diffusion introduces significant lag between capability availability and widespread realized impact in most sectors, smoothing abrupt capability changes over time.
  10. Distinguishing these metrics is necessary to resolve forecasting disagreements, as parties may agree on capability trajectories but disagree on the magnitude of deployment friction, leading to confused debates about overall speed.

  ### 2. Disagreements

  | Issue | Sharp Takeoff Formulation | Continuous Takeoff Formulation | Type |
  | :--- | :--- | :--- | :--- |
  | **Shape of Capability Curve** | Discontinuous jump in capability per compute occurs at high scales due to qualitative phase shifts in reasoning and planning. | Smooth function of compute and data; no qualitative phase shifts occur, only quantitative gains accumulating over time. | Substantive |
  | **Magnitude of Friction** | Friction is negligible relative to capability spike speed; integration happens faster than regulation can respond or hardware can be built. | Friction dominates, smoothing realized impact; legal and physical bottlenecks prevent rapid deployment even if capability spikes. | Substantive |
  | **Recursion Threshold** | Partial automation of R&E triggers runaway feedback; systems need only exceed human ability in key bottlenecks to accelerate. | Full automation required; partial automation yields diminishing returns due to human bottlenecks elsewhere in the loop. | Substantive |
  | **Warning Time** | Days between human-level and superintelligence; realized impact follows capability closely due to low friction. | Years between initial advanced deployment and dominance; realized impact lags capability significantly due to high friction. | Substantive |

  ### 3. Cruxes and pre-registered predictions

  | Crux | Accepted Measurement | Sharp Prediction | Continuous Prediction |
  | :--- | :--- | :--- | :--- |
  | **Automation Share** | Percentage of the research-and-engineering loop automated by AI systems, tracked quarterly. | Jumps from <10% to >90% rapidly within months as systems seize the loop. | Rises linearly over years without sudden jumps as tools augment humans. |
  | **Latency Gap** | Median time between SOTA model release and significant economic integration in key sectors. | Collapses to near-zero as AI solves integration tasks faster than humans. | Remains constant or grows due to increasing system complexity and regulation. |
  | **Compute-Capacity Plot** | Capability vs. Effective Compute plotted on log scales, controlling for algorithmic efficiency. | Discontinuity visible as a vertical spike in performance at specific scale thresholds. | Smooth curve with no vertical segments; diminishing returns likely at scale. |

  ### 4. What would move us

  The Sharp Takeoff party would revise downward upon evidence of hard integration bottlenecks slowing deployment despite high capability, specifically if regulatory or physical constraints persist despite AI assistance. The Continuous Takeoff party would revise upward upon evidence of systems autonomously designing superior architectures without human intervention, specifically if the share of the improvement loop performed by systems rises abruptly.

  However, this document's framing is most likely to be wrong where it treats friction and capability as independent variables. In reality, high capability may drastically reduce friction, as advanced systems could solve integration problems, write regulatory compliance code, or manage hardware logistics faster than humans. This coupling means a capability spike could automatically compress deployment lag, making the distinction less clean than hoped and the residual disagreement tidier than reality.
