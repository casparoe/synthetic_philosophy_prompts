prompt: |-
  I chair the serious-incident review committee at a 600-bed teaching hospital, and I want to replace the way we write causal statements with something my committee can actually run.

  Context: we review roughly a dozen incidents a month. Every review ends in a written report with (a) a causal statement — what caused the harm to this patient — and (b) the corrective actions we will take. The report goes to the board, and for the serious ones to the regulator and potentially into litigation, so the wording has to be defensible under hostile questioning. The committee is two physicians, a risk manager, a quality-improvement nurse and me; nobody has any training in causal inference beyond a regression module years ago. We have ninety minutes per case, the incident timeline, the chart, and whatever data we already collect routinely. We cannot commission new studies, and we will not adopt a procedure that needs a statistician in the room.

  What I want is a decision procedure for the causal statement, built on the two families of account that philosophers actually dispute: counterfactual-dependence accounts in the Lewis line, on which X caused Y roughly because, had X not occurred, Y would not have; and interventionist accounts in the Woodward line, on which X causes Y because there is some intervention that sets X to a different value and changes Y with everything else held fixed. I am not asking you to adjudicate between them. I am asking you to turn what each one gives us into a checklist we can run in about fifteen minutes per claim, and to be explicit at every step about which account is doing the work, because they come apart in ways we keep tripping over.

  Design constraints:

  - Ordered questions, each with a stated sufficiency condition (what a yes has to consist in) and an explicit stop: either a hard no that kills the claim, or a flag that routes the factor elsewhere in the report.
  - The distinctions that have to survive the translation into plain English: the contrast class (caused relative to what — X at one value versus X at another, not X happened); whether the counterfactual comes out true only on a backtracking reading, that is only if we also change something upstream of X, which is the move that makes our risk scores, early-warning scores and abnormal lab values look causal when they are only tracking a common upstream condition; whether the intervention we can imagine is surgical, setting X directly and breaking the other routes into X, or only works by first changing something else that also reaches the outcome by a second route; whether the effect is invariant across the different routes by which we could set X — permanent staffing versus agency cover, automated alert versus staff training — since if the answer depends on the route, X was never one variable; whether we may test the intervention against any admissible background setting of the other factors or only against what actually happened that night, together with a bound on admissible so that we do not end up calling everything a cause; and what to do with factors nobody can set, such as the patient's age, frailty, sex, race or rural address, including the case where the honest intervention is on someone else's perception of that factor rather than on the factor itself.
  - A tie-break rule for when the two accounts disagree, and a short ladder of permitted language — cause, contributing factor, risk stratifier, marker — with the condition for each rung, because most of our arguments are really about which rung a factor belongs on.
  - Honesty about where judgment cannot be eliminated: which variables belong in the model, how far upstream we trace, how much invariance is enough, whether an intervention counts as available for us (physically possible, legally permitted, fundable by next quarter), and the gap between the general-level evidence we actually have and the single-case attribution we have to write, given that the interventionist test is naturally about what happens in general while our report is about this patient on this night. Mark those as sign-off points for me rather than as questions with answers.

  Then run the finished procedure step by step on three shapes of case from our last quarter:

  1. An abnormal set of observations on a ward round was documented but not escalated; the patient arrested several hours later. The committee wants to write that the failure to escalate caused the arrest.
  2. The patient was eighty-four and frail. The committee wants frailty named in the causal statement, because it is the thing everyone brings up in the meeting.
  3. The infusion pump was programmed at ten times the intended rate and, independently, the patient was given a second drug at a dose that would on its own have produced the same toxicity. Either would have done it alone.

  At least one of these should come out in a way the committee will dislike — my guess is that the counterfactual reading and the interventionist reading will not both give us what we want in the third case — and I want that result left as it comes out rather than softened.

  Finally, tell me plainly what the procedure cannot do: which of our recurring questions it has no purchase on, which kinds of incident it will systematically misgrade (rare events, omissions and things that did not happen, harm avoided by luck), and where it will return confident-sounding answers that are really metaphysical positions in disguise.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**
      *   **User:** Chair of a serious-incident review committee at a 600-bed teaching hospital.
      *   **Task:** Design a decision procedure for writing causal statements in incident reports.
      *   **Constraints:**
          *   Based on two philosophical accounts: Counterfactual-Dependence (Lewis) and Interventionist (Woodward).
          *   Must be runnable by a non-statistician committee in ~15 minutes per claim.
          *   Must handle specific distinctions: contrast class, backtracking counterfactuals, surgical vs. non-surgical interventions, invariance across routes, admissible background settings, non-manipulable factors (age, frailty).
          *   Must include a tie-break rule and a ladder of permitted language (Cause, Contributing Factor, Risk Stratifier, Marker).
          *   Must identify "sign-off points" where judgment is required (model variables, upstream tracing, invariance thresholds, availability of intervention, general vs. single-case).
          *   Must apply the procedure to three specific cases (Failure to escalate, Frailty, Overdetermination).
          *   Must explicitly state limitations (what the procedure cannot do).
          *   Tone: Professional, precise, defensible under litigation/regulatory scrutiny, honest about philosophical underpinnings without jargon overload.

  2.  **Deconstruct the Philosophical Frameworks:**
      *   **Counterfactual (Lewis):** $X$ caused $Y$ if, had $X$ not occurred, $Y$ would not have occurred.
          *   *Challenge in Hospital Settings:* Pre-emptive causes, overdetermination (two sufficient causes), backtracking (changing $X$ requires changing upstream $Z$).
          *   *Operationalization:* "But-for" test.
      *   **Interventionist (Woodward):** $X$ causes $Y$ if an intervention on $X$ changes $Y$, holding other variables fixed.
          *   *Challenge in Hospital Settings:* Non-manipulable variables (age), complex pathways, invariance (does the relationship hold across different ways of changing $X$?).
          *   *Operationalization:* "Surgical change" test.

  3.  **Drafting the Procedure (The "Causal Attribution Protocol" - CAP):**
      *   *Structure:* Needs to be a checklist. Needs to separate the two accounts. Needs a synthesis step.
      *   *Step 1: Definition.* Define the putative cause ($X$) and effect ($Y$) with contrast classes.
      *   *Step 2: Counterfactual Test (Lewis).* The "But-For" check. Watch out for backtracking.
      *   *Step 3: Interventionist Test (Woodward).* The "Surgical Fix" check. Watch out for non-manipulables and pathway dependence.
      *   *Step 4: Synthesis & Grading.* Tie-break rules and language ladder.
      *   *Sign-off Points:* Explicitly mark where the Chair must decide based on policy/judgment, not logic.

  4.  **Refining the Distinctions (incorporating user constraints):**
      *   *Contrast Class:* Not just "Escalation happened," but "Escalation happened *at time T* vs. *not at time T*."
      *   *Backtracking:* If removing $X$ requires removing upstream $Z$ which also causes $Y$, $X$ is a marker, not a cause.
      *   *Surgical Intervention:* Can we change $X$ without changing $Z$? If no, $X$ is not an independent cause.
      *   *Invariance:* Does changing $X$ via Method A work the same as Method B? If not, $X$ is too vague.
      *   *Non-manipulables:* Age/Frailty. Intervention is impossible. They are risk stratifiers, not causes in the interventionist sense.
      *   *Admissible Background:* Do we test against *this* night or *any* night? (Constraint: Bind to actual background to avoid over-attribution).

  5.  **Developing the Language Ladder:**
      *   *Cause:* Passes both tests (or tie-break favors). Actionable.
      *   *Contributing Factor:* Passes Counterfactual, fails Interventionist (e.g., non-manipulable or pathway dependent).
      *   *Risk Stratifier:* Passes neither as a direct cause, but correlates with upstream causes.
      *   *Marker:* Statistical association only, no causal leverage.

  6.  **Developing the Tie-Break Rule:**
      *   If Counterfactual says Yes, Interventionist says No (e.g., frailty): Downgrade to Contributing Factor/Risk Stratifier.
      *   If Counterfactual says No, Interventionist says Yes (e.g., overdetermination/pre-emption): Upgrade to Cause (Interventionist is better for system design).
      *   *Rationale:* The goal of the report is *prevention* (Interventionist), not just *blame assignment* (Counterfactual).

  7.  **Applying to the Three Cases:**
      *   *Case 1 (Failure to Escalate):*
          *   CF: If escalated, would arrest have been prevented? (Likely Yes).
          *   Int: Can we intervene on escalation protocol? Yes.
          *   Result: Cause.
      *   *Case 2 (Frailty):*
          *   CF: If not frail, would arrest happen? (No).
          *   Int: Can we intervene on frailty *in this moment*? No.
          *   Result: Risk Stratifier/Contributing Factor (Not a "Cause" for corrective action).
      *   *Case 3 (Overdetermination - Two Drugs):*
          *   CF: If Drug A normal, would toxicity happen? Yes (Drug B). So Drug A fails "But-For". Same for Drug B.
          *   Int: If intervene on Drug A, does toxicity stop? Yes (assuming B didn't happen *because* of A, but prompt says "independently"). Wait, if they are independent sufficient causes, intervening on A prevents the *actual* outcome sequence, but the outcome *type* still happens via B.
          *   *Correction on Case 3:* In overdetermination, standard counterfactuals fail both. Interventionism can handle it if we define the specific token event. But if *either* alone produces toxicity, removing A leaves B, so toxicity remains.
          *   *Philosophical nuance:* In pre-emption/overdetermination, Lewisian counterfactuals often fail. Woodwardian interventionism depends on the granularity of $Y$. If $Y$ is "Toxicity at Time T", removing A might delay it or change the profile. If $Y$ is just "Toxicity", both fail.
          *   *Decision:* The prompt asks for honesty. Both accounts struggle here. The procedure should flag this as "Conjunctive Cause" or downgrade both to "Contributing" because neither is necessary. *Wait, let's look closer.* If Drug A (10x) AND Drug B (toxic dose) are given.
          *   CF Test on A: If A was correct dose, does Toxicity happen? Yes, because of B. So A is not a "But-For" cause.
          *   Int Test on A: If we fix A, does Toxicity change? No, B still kills.
          *   *Result:* Neither is a "Cause" under strict definitions. They are "Contributing Factors" to the *severity* or "Conjunctive Causes." The procedure must force the committee to acknowledge neither is sufficient for the *specific* outcome token if the other exists. *Actually, the prompt says "Either would have done it alone."* This is classic Overdetermination.
          *   *Procedure Output:* Both fail the "But-For" test. Both fail the "Difference-Making" test (because the outcome is invariant to changing one).
          *   *Committee Dislike:* They want to blame the pump programmer. The procedure will say "Neither is the sole cause." This fits the prompt's requirement ("At least one of these should come out in a way the committee will dislike").

  8.  **Addressing Limitations:**
      *   Omissions (things that didn't happen).
      *   Rare events (data scarcity for invariance).
      *   General vs. Single Case (The "Reference Class" problem).
      *   Metaphysical disguises (Policy decisions framed as causal findings).

  9.  **Review against Constraints:**
      *   *15 minutes?* The checklist needs to be tight.
      *   *Sign-off points?* Need to highlight where the Chair decides policy (e.g., "Is this intervention fundable?").
      *   *Plain English?* Avoid "backtracking counterfactuals," use "upstream dependency."
      *   *Defensible?* Yes, by explicitly stating the logic used.

  10. **Final Polish:**
      *   Ensure the tone is authoritative yet humble about the limits of causal inference.
      *   Make sure the "Sign-Off" sections are distinct.
      *   Check the Case 3 analysis again. If *either* produces toxicity, removing one leaves the toxicity. So neither is a cause of *toxicity*. They are causes of *redundant toxicity*. The procedure should reflect this nuance.

      *(Self-Correction on Case 3)*: If the outcome is "Patient Death," and Drug A kills and Drug B kills. Removing A -> Patient still dies (from B). So A is not a cause of Death under But-For. Intervention: Fix A -> Patient still dies. So A is not a cause under Interventionist.
      *Committee Preference:* They usually want to cite the pump error as *the* cause.
      *Procedure Result:* Must classify both as "Contributing Factors" to the harm, but acknowledge overdetermination. Or, refine the outcome to "Harm at Time T." If A acts faster than B, A caused the *timing*. If simultaneous, it's pure overdetermination. I will assume simultaneous for maximum friction with the committee's desire for a single villain.

      *(Refining the Tie-Break)*: If CF=No and Int=No (Overdetermination), the procedure must prevent calling it a "Cause." It becomes a "Conjunctive Contributing Factor."

      *(Refining Sign-Offs)*: The Chair needs to decide what counts as an "Available Intervention." Is it physically possible? Or is it budgetarily possible? The prompt asks for "fundable by next quarter." This is a policy constraint, not a causal one. I need to mark this clearly.

  11. **Drafting the Content:** (Mental Outline)
      *   Introduction: Acknowledge the tension.
      *   The Protocol (CAP): Steps 1-4.
      *   The Language Ladder.
      *   The Sign-Off Register (Chair's responsibilities).
      *   Case Studies (1, 2, 3).
      *   Limitations Statement.

  12. **Final Review against "Hostile Questioning":**
      *   Does this hold up in court? Yes, because it distinguishes between *causal leverage* and *background condition*. It prevents blaming frailty (discrimination risk) and prevents blaming pump errors when a second drug also killed the patient (liability risk). It forces precision.

  13. **Writing the Response.** (Proceeding to generate output based on these thoughts).
answer: |-
  # The Causal Attribution Protocol (CAP)
  **For use by the Serious-Incident Review Committee**

  **Purpose:** To produce causal statements that are defensible under regulatory scrutiny and litigation, distinguishing between factors we can change (causes) and factors that merely track risk (markers).
  **Time Allocation:** 15 minutes per putative causal claim.
  **Philosophical Basis:** Dual-track testing using Counterfactual Dependence (Lewis) and Interventionist Invariance (Woodward).

  ---

  ## Part 1: The Decision Procedure

  ### Step 1: Define the Relata (2 Minutes)
  *Before testing causation, define the variables.*

  1.  **Define the Effect ($Y$):** Is this the specific harm (e.g., "Cardiac arrest at 03:00") or a general type (e.g., "Cardiac arrest")?
      *   *Constraint:* Must match the harm reported to the regulator.
  2.  **Define the Putative Cause ($X$):** What specific factor are we testing? (e.g., "Nurse failed to escalate," not "Nursing care").
  3.  **Define the Contrast Class:** We are not asking "Did $X$ happen?" We are asking "Did $X$ *at this value* cause $Y$ *rather than* $X$ *at that value*?"
      *   *Example:* Not "Escalation," but "Escalation at 02:00 vs. No Escalation."

  **[STOP]** If $X$ or $Y$ cannot be defined concretely, move the factor to "Background Context" and stop.

  ### Step 2: The Counterfactual Test (Lewis Track) (4 Minutes)
  *Question: But for $X$, would $Y$ have occurred?*

  1.  **The Subtraction:** Imagine $X$ did not occur (or took its baseline value), keeping everything else exactly as it was on that night.
  2.  **The Backtracking Check:** To remove $X$, did you have to change something upstream ($Z$) that *also* causes $Y$?
      *   *Example:* To remove "High Early Warning Score," did you have to remove "Sepsis"? If yes, the Score is not the cause; Sepsis is.
      *   *Sufficiency Condition:* The counterfactual "If not-$X$, then not-$Y$" must be true *without* changing upstream drivers of $Y$.
  3.  **The Overdetermination Check:** If there was another sufficient cause present ($W$) that would have produced $Y$ anyway, does removing $X$ still leave $Y$?
      *   *Sufficiency Condition:* $Y$ must not occur in the counterfactual scenario.

  **Result A:** Pass (Yes, $Y$ disappears) | **Result B:** Fail (No, $Y$ remains or backtracking required).

  ### Step 3: The Interventionist Test (Woodward Track) (4 Minutes)
  *Question: If we surgically intervene to change $X$, does $Y$ change?*

  1.  **The Manipulability Check:** Is there a physically and legally possible intervention that sets $X$ to a different value *directly*?
      *   *Constraint:* You cannot intervene on age, sex, genetics, or frailty. You can intervene on *how we respond* to them.
      *   *Sufficiency Condition:* There must be a "surgical" lever for $X$ that does not drag other variables along with it.
  2.  **The Invariance Check:** Does the relationship hold across different ways of changing $X$?
      *   *Example:* If "Staffing" is $X$, does reducing harm happen whether we use agency staff, overtime, or automation? If the effect depends on *how* we fix staffing, "Staffing" is too vague.
      *   *Sufficiency Condition:* The $X \rightarrow Y$ relationship must remain stable across at least two distinct methods of intervening on $X$.
  3.  **The Background Check:** Are we testing this intervention against *this specific night's* background conditions, or *any* admissible background?
      *   *Constraint:* Test against the actual background conditions of the incident to avoid claiming a cause works in scenarios where it wouldn't (e.g., "Training works" is false if the equipment is broken).

  **Result A:** Pass (Intervention changes $Y$) | **Result B:** Fail (Intervention impossible or ineffective).

  ### Step 4: Synthesis and Grading (5 Minutes)
  *Compare Result A (Counterfactual) and Result B (Interventionist).*

  | Counterfactual (Step 2) | Interventionist (Step 3) | Classification | Rationale |
  | :--- | :--- | :--- | :--- |
  | **Pass** | **Pass** | **Cause** | Necessary and actionable. |
  | **Pass** | **Fail** | **Contributing Factor** | Necessary, but not actionable (e.g., non-manipulable) or unstable. |
  | **Fail** | **Pass** | **Systemic Cause** | Not necessary in this token case (overdetermination), but fixing it prevents future harm. |
  | **Fail** | **Fail** | **Risk Stratifier / Marker** | Correlates with harm but offers no leverage. |

  **Tie-Break Rule:**
  If the accounts disagree (one Pass, one Fail), the **Interventionist Test governs the Corrective Action Plan**, but the **Counterfactual Test governs the Liability Statement**.
  *   *Reasoning:* We prevent harm via interventions (Woodward), but we assign responsibility via necessity (Lewis).
  *   *Chair's Sign-Off:* If Interventionist Passes but Counterfactual Fails (e.g., Overdetermination), you may list it as a Cause for *prevention*, but not as the sole Cause for *attribution*.

  ---

  ## Part 2: Chair's Sign-Off Register
  *These are not questions for the committee. These are policy judgments you must make and sign. They cannot be derived from logic alone.*

  1.  **Admissible Interventions:** Which interventions count as "available"?
      *   *Decision:* Is an intervention valid if it is physically possible but not fundable next quarter? (Recommendation: No. If we cannot fund it, it is not a causal lever for *this* report).
  2.  **Upstream Tracing:** How far back do we trace?
      *   *Decision:* Do we stop at the individual error or trace to the hiring policy? (Recommendation: Stop where the intervention becomes organizational policy rather than clinical process, unless the incident is systemic).
  3.  **Invariance Threshold:** How much stability is enough?
      *   *Decision:* Do we require evidence from other hospitals, or is committee consensus sufficient? (Recommendation: Consensus + Literature check. Do not rely on consensus alone for high-liability claims).
  4.  **General vs. Single-Case:** The Interventionist test is general; the report is specific.
      *   *Decision:* Are we claiming $X$ caused $Y$ *this time*, or that $X$ is a type of cause that *usually* leads to $Y$? (Recommendation: Write for the single case, justify with general evidence).

  ---

  ## Part 3: Application to Case Studies

  ### Case 1: Failure to Escalate
  *Scenario:* Abnormal observations documented, not escalated. Patient arrested hours later.
  *Claim:* "Failure to escalate caused the arrest."

  1.  **Define:** $X$ = Escalation at Time T vs. No Escalation. $Y$ = Arrest at Time T+4h.
  2.  **Counterfactual:** If escalated at Time T, would arrest have happened?
      *   *Evidence:* Treatment protocol for abnormal observations prevents arrest.
      *   *Backtracking:* Does removing "Failure" require changing "Abnormal Obs"? No. We assume obs were visible.
      *   *Result:* **Pass.** (But-for the failure, arrest likely prevented).
  3.  **Interventionist:** Can we intervene on Escalation?
      *   *Manipulability:* Yes (Protocol enforcement, automation).
      *   *Invariance:* Yes (Works via training or hard-stop alerts).
      *   *Result:* **Pass.**
  4.  **Classification:** **Cause.**
  5.  **Report Language:** "The failure to escalate the abnormal observations was a cause of the cardiac arrest."

  ### Case 2: Patient Frailty
  *Scenario:* Patient 84, frail. Committee wants "Frailty" in the causal statement.
  *Claim:* "Frailty caused the arrest."

  1.  **Define:** $X$ = Frailty (High vs. Low). $Y$ = Arrest.
  2.  **Counterfactual:** If not frail, would arrest have happened?
      *   *Logic:* Likely no. A robust patient might have compensated.
      *   *Result:* **Pass.**
  3.  **Interventionist:** Can we intervene on Frailty?
      *   *Manipulability:* **No.** We cannot surgically set an 84-year-old's frailty to "Low" on admission. We can only intervene on *care relative to frailty*.
      *   *Result:* **Fail.**
  4.  **Classification:** **Risk Stratifier / Contributing Factor.**
  5.  **Chair's Sign-Off:** I am ruling that "Frailty" is a background condition, not a causal lever. Listing it as a "Cause" implies we could have fixed it, which is misleading and potentially discriminatory.
  6.  **Report Language:** "The patient's frailty was a risk stratifier that increased susceptibility to harm; it is not listed as a modifiable cause." (Committee will dislike this; it removes the "patient's fault" implication).

  ### Case 3: Double Overdetermination
  *Scenario:* Pump programmed at 10x rate (Drug A). Independently, second drug given at toxic dose (Drug B). Either alone causes toxicity.
  *Claim:* "Pump error caused the toxicity."

  1.  **Define:** $X$ = Pump Error. $W$ = Second Drug. $Y$ = Toxicity.
  2.  **Counterfactual:** If Pump Error removed (correct dose), does Toxicity occur?
      *   *Logic:* Yes, because Drug B is still there and is sufficient.
      *   *Result:* **Fail.** (Same logic applies to Drug B).
  3.  **Interventionist:** If we intervene on Pump Error (fix it), does Toxicity change?
      *   *Logic:* No. The outcome (Toxicity) remains invariant because Drug B ensures it.
      *   *Result:* **Fail.**
  4.  **Classification:** **Conjunctive Contributing Factor.** (Neither passes the threshold for "Cause" under strict definition).
  5.  **Chair's Sign-Off:** The procedure forces us to admit that *neither* error is the sole cause of the *outcome type*. However, under the Tie-Break Rule (Systemic Cause), we can list them as causes for *prevention* if we refine $Y$.
      *   *Refinement:* If $Y$ is "Toxicity at Severity Level Z" or "Toxicity at Time T," one drug might have acted faster. If simultaneous, neither is a "But-For" cause.
      *   *Decision:* I am ruling we cannot call one *the* cause. Both are "Contributing Factors to a Conjunctive Harm."
  6.  **Report Language:** "Two independent medication errors occurred, either of which was sufficient to produce the toxicity. Neither is a necessary cause of the harm in isolation; both are contributing factors."
      *   *Committee Reaction:* They will hate this. They want to blame the pump programmer. The procedure blocks singling out one actor when the outcome was overdetermined. This is legally safer but organizationally uncomfortable.

  ---

  ## Part 4: Limitations Statement
  *What this procedure cannot do.*

  1.  **Omissions:** The procedure handles "Failure to Escalate" well (Step 2), but struggles with "Things that did not happen" where no protocol existed. It cannot generate causality from a vacuum. If there was no duty to act, the Counterfactual test fails.
  2.  **Rare Events:** The Invariance Check (Step 3) requires knowing that an intervention works. For rare incidents, we lack data. The procedure will return "Insufficient Evidence" rather than a causal claim. Do not force a "Cause" label here.
  3.  **Harm Avoided by Luck:** If a failure occurred but the patient did not die (near miss), the Counterfactual test on "Death" fails. The procedure correctly identifies no cause for *death*, but may misgrade the *risk*. Use this for incidents with actual harm only.
  4.  **Metaphysical Disguise:** This procedure cannot resolve policy disputes. If the committee argues about whether "Staffing" is a cause, they are actually arguing about whether "Hiring Budget" is a valid intervention. The procedure exposes this; it does not solve it. The Chair's Sign-Off Register is where this political decision is made, not in the causal logic.
  5.  **Single-Case Attribution:** The Interventionist test relies on general laws ("Fixing pumps reduces errors"). Applying this to *this* patient on *this* night assumes the general law holds locally. It might not. The report must state: "Based on general evidence, we infer..." not "It is a logical certainty that..."

  **Final Instruction to Committee:**
  When you feel the procedure is giving you the "wrong" answer (e.g., Case 3), check if you are trying to assign *blame* (Counterfactual) or design *safety* (Interventionist). If you want to blame, the logic must support necessity. If you want safety, the logic must support leverage. Do not mix the two in a single sentence.
