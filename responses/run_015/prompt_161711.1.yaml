  4.  **Drafting - Section by Section:**

      *   **Header:** To, From, Date, Subject.
      *   **Decision:** Reject current spec. Approve conditional redesign.
      *   **Heritability & Licensing:** Define terms. Explain population vs. individual. Explain Between vs. Within family (crucial for sibling feature). Explain Genetic Nurture (PGS captures parental environment too).
      *   **Transported-Environments Check:** Adopt but refine. Call it "Environmental Stability Audit." Requires testing across SES/schooling proxies.
      *   **The Heritability/Environment Paradox:** Confirm the engineer's intuition. High heritability compatible with high environmental malleability. FAQ wording.
      *   **Losing Side:** Acknowledge anti-paternalism and the dyslexia relief case. State what would change the mind (proof of benefit > harm, validated within-family scores).

  5.  **Refining Vocabulary & Constraints:**
      *   *Definitions:* Need to weave in broad/narrow-sense, rGE, genetic nurture, stratification naturally.
      *   *Empirical Flags:* Must flag uncertainty about specific numbers (e.g., exact within-family drop) if not sure, but the prompt gives data science numbers I should trust. I will trust the DS numbers provided in the prompt but flag the generalizability.
      *   *Word Count:* Aim for ~900.
      *   *Tone:* Professional, decisive, technically precise but accessible to non-geneticists.

  6.  **Drafting - Step-by-Step (Mental or Scratchpad):**
      *   *Decision:* Conditional Approval. Sibling mode OFF. Copy rewrite. Ancestry restriction.
      *   *Heritability:* It's a population ratio, not an individual destiny. Narrow-sense only (PGS is additive). Within-family is the honest number for siblings (approx 20% vs 40%). Genetic nurture means PGS predicts parental behavior too.
      *   *Check:* Rename to "Environmental Stability Audit." Must show performance doesn't collapse in low-SES vs high-SES.
      *   *Paradox:* Yes, reducing environmental variance increases heritability. FAQ: "High genetic influence doesn't mean schooling doesn't matter."
      *   *Losing Side:* Anti-paternalism is valid, but misinformation isn't empowerment. Dyslexia case is real, but better pathways exist than a deterministic score.

  7.  **Review against Constraints:**
      *   ~900 words? (Need to monitor closely).
