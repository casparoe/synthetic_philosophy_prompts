          *   **Transported-Environments Check:** Adopt, narrow, or replace with an auditable test.
          *   **Heritability/Environment Interaction:** Address the user's intuition (equalizing environment raises heritability) and FAQ wording.
          *   **Losing Side:** Engage anti-paternalism and dyslexia ticket seriously; state conditions for changing recommendation.

  2.  **Deconstruct the Scientific/Ethical Issues:**
      *   **Product:** Polygenic Score (PGS) for Educational Attainment (EA).
      *   **Claims:** "40% genetic" (between-family), "12% variance explained" (PGS $R^2$), "±3 years prediction interval".
      *   **Problematic Copy:** "Natural learning capacity — the part that teaching, tutoring and schooling don't change." (Deterministic, ignores GxE, ignores genetic nurture).
      *   **Sibling Comparison:** Highly sensitive. Within-family heritability is lower (~20% vs 40%). PGS prediction accuracy drops significantly within families due to confounding (population stratification, genetic nurture).
      *   **Heritability Concepts:**
          *   *Broad-sense ($H^2$):* All genetic variance (additive + dominance + epistasis).
          *   *Narrow-sense ($h^2$):* Additive genetic variance only (what PGS captures).
          *   *Stratification:* Population structure confounding genetic associations.
          *   *Gene-Environment Correlation (rGE) / Genetic Nurture:* Parents pass down genes *and* environment correlated with those genes. PGS captures some of this environmental effect indirectly.
      *   **Transported-Environments Check:** Does the model hold across different environments the user might choose? (Essentially OOD generalization regarding environment).
      *   **Heritability Paradox:** High heritability $\neq$ immutable. If variance in environment decreases, heritability (ratio of genetic variance to total variance) increases.

  3.  **Determine the Recommendation:**
      *   The current proposal is scientifically misleading and potentially harmful (deterministic copy, sibling comparison without within-family validation, ignoring genetic nurture).
      *   *Decision:* Reject the current spec. Approve *only* with significant conditions (essentially a redesign).
      *   *Reasoning:* The copy claims immutability ("don't change"), which is false. The sibling comparison is statistically unsound given the drop in within-family predictive power and heritability. The "40%" figure is misleading for individual interpretation.
