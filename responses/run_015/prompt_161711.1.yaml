answer: |-
  **MEMORANDUM**

  **TO:** Product and Model Review Committee
  **FROM:** Senior Software Engineer, Model Review
  **DATE:** October 24, 2023
  **SUBJECT:** Decision Memo: "Learning Potential" Feature Release

  **1. DECISION AND ACTION ITEMS**

  **Decision:** Reject current specification. Approve conditional redesign.

  **Actions:**
  *   **Product (Owner: PM Lead, Due: 2 weeks):** Disable "Sibling Comparison" mode indefinitely. Within-family predictive accuracy is insufficient given the drop in heritability estimates from between-family (40%) to within-family (~20%).
  *   **Content (Owner: Content Lead, Due: 1 week):** Rewrite explanatory copy. Remove claims of immutability ("part that teaching... don't change"). Replace with probabilistic framing emphasizing uncertainty (±3 years).
  *   **Data Science (Owner: DS Lead, Due: 4 weeks):** Implement "Environmental Stability Audit" (see Section 3). Restrict feature launch to ancestry groups with validated calibration (currently European-only).
  *   **Legal/Compliance (Owner: General Counsel, Due: 1 week):** Review revised copy for regulatory compliance regarding medical/educational advice.

  **2. HERITABILITY ESTIMATES AND LICENSING**

  To prevent user harm, the committee must enforce the following UI rules based on genetic definitions:

  *   **Population vs. Individual:** Heritability is a variance decomposition ratio for a population, not an individual cause. **Rule:** Do not display population heritability percentages (e.g., "40%") on individual result pages. This commits the ecological fallacy.
  *   **Broad vs. Narrow Sense:** *Broad-sense heritability* includes all genetic effects (additive, dominance, epistasis). *Narrow-sense heritability* includes only additive effects. **Rule:** Our polygenic score is a weighted sum of additive effects; it estimates narrow-sense components only. Do not imply it captures total genetic influence.
  *   **Between vs. Within Family:** The headline "40%" is a between-family estimate. It captures *genetic nurture* (where parental genes shape the child's environment) and *stratification* (ancestry-related confounding). Within-family estimates are lower (~20%) because these confounders are controlled. **Rule:** Since this feature compares siblings, the within-family estimate is the honest number. Using the between-family figure for sibling comparison is statistically invalid.
  *   **Gene-Environment Correlation:** A portion of the score's predictive power arises from *gene–environment correlation*, where a child's genes evoke specific responses from teachers or parents. **Rule:** Do not frame the score as independent of environment.

  **3. THE TRANSPORTED-ENVIRONMENTS CHECK**

  I propose we adopt my proposed check but narrow it into an auditable **Environmental Stability Audit**.

  **Requirement:** Before shipping, Data Science must demonstrate that the score's calibration (predicted vs. actual years of schooling) does not degrade significantly across proxies for environmental variance (e.g., parental income quintiles, school district funding levels). If the score predicts well only in high-resource environments, it fails the audit.

  **Rationale:** If the prediction validity depends on conditions the parent can change (e.g., hiring a tutor), presenting the score as fixed capacity is incoherent. This is analogous to testing for out-of-distribution generalization where the "distribution" is the socioeconomic environment.

  **4. THE HERITABILITY-ENVIRONMENT PARAXOX (FAQ GUIDANCE)**

  My intuition regarding heritability and environmental equalization is correct. Heritability is the ratio of genetic variance to total variance. If we equalize environments (reducing environmental variance), the heritability ratio rises, even if genetic mechanisms remain unchanged. Therefore, a high heritability estimate is fully compatible with environmental interventions (like tutoring) having large effects on the outcome.

  **FAQ Draft:** "Does a high genetic score mean schooling doesn't matter? No. Heritability measures differences between people in a specific context. Even if genetics explains much of the difference between students, improving schools or tutoring can raise achievement for everyone. A high score does not guarantee success, nor does a low score preclude it."

  **5. ENGAGEMENT WITH DISSENTING VIEWS**

  **Anti-Paternalism:** The argument that parents are entitled to their data and that withholding it pushes them to unregulated apps is strong. However, providing data with deterministic misinterpretations ("natural capacity... don't change") is not empowerment; it is misinformation. We change this recommendation if the product can prove via A/B testing that users interpret the uncertainty correctly without reducing educational investment.

  **The Dyslexia Ticket:** The report from the mother who found relief is significant. It suggests genomic data can reduce parental guilt. However, this benefit was achieved via a retrospective diagnosis, not a prospective percentile. We change this recommendation if a clinical pathway is established where low scores trigger validated support resources rather than fatalism. Until then, the risk of the "withdrawn tutoring" ticket outweighs the potential for relief.

  **Conclusion:** We cannot ship a feature that implies genetic determinism where none exists. The science supports probabilistic risk profiling, not capacity labeling. Proceed only with the conditions above.
