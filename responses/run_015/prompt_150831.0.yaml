  9.  **Review against Constraints:**
      *   Whiteboard only: Use diagrams for the Screen/Wall.
      *   No handouts: Keep concepts verbal/visual.
      *   Smart adults: Don't dumb down the logic, just the jargon.

  10. **Final Polish:**
      *   Ensure the tone is collaborative (Cafe style), not lecture-heavy.
      *   Make sure the "Chalmers Guy" feels seen but managed.
      *   Ensure the "Screen Removal" exercise is clear on *what* is being removed (subjects, not lights).

  *(Self-Correction during drafting)*: I need to be careful with the "Screen" analogy. If I say "each screen is a subject," people might ask "What is it experiencing?" I should clarify: "It doesn't matter *what* they experience, just *that* they are centers of experience."
  Also, the "Chalmers Guy" objection: "Hard problem in a new hat." The response should be: "The Hard Problem is Non-Experience -> Experience. The Combination Problem is Experience + Experience -> Unified Experience. They are distinct logical gaps."

  Let's assemble the plan.

  *   **Structure:**
      1.  **The Bargain (0-10):** Panpsychism as a solution, not a whim. Defuse Toaster.
