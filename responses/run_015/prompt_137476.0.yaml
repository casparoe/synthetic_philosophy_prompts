prompt: |-
  I run the evals team at a lab that trains agents against learned reward models, and we need a working definition of reward tampering — narrower than specification gaming in general, and distinct from wireheading in the narrow sense of intervening directly on one's own reward channel — that an evaluator can apply to a recorded episode to decide whether to log it as a tampering incident. I want the specification written down before we start arguing about cases in review meetings.

  Write the desiderata such a definition must meet, each with the case that motivates it. At minimum it should settle: a robot that clamps its own reward wire versus one that merely hides the mess it was told to clean up; an agent that rewrites the token stream feeding the reward model so its outputs score higher while reading the same to a human; an agent that builds a physical shield around its reward receiver to protect it from damage; an agent that changes what is measured rather than the measurement, as a tutor does when it gets the student to say they understand, or a recommender when it shapes user preferences so its own reward rises; tampering done by a sub-agent or by a third party on the agent's behalf; and the contrasting cases where the designer legitimately rewrites the reward model mid-run or a supervisor legitimately praises. It should also say what to do with agents that have no separable reward channel at all, and whether the mark of tampering is causal-mechanistic, counterfactual (decoupling reward from the intended objective), or intent-based.

  Mark which requirements are non-negotiable for my purpose and which are prejudices of one camp — in particular, whether the definition must be checkable from behavior alone or may require white-box access. Flag any pair of desiderata you think cannot be jointly satisfied; that is the part I most want. Say which single requirement rules out the most candidate definitions. Take a definite position on each contested item with reasons rather than laying out options, and say where your confidence is low. If there is room afterwards, two or three lines each on how mechanistic-intervention, counterfactual-decoupling, and intent-based accounts fare — but the list is the deliverable.
reasoning: |-
  Here's a thinking process that leads to the suggested desiderata for defining reward tampering:

  1.  **Analyze the Request:**
      *   **Role:** Evals team lead at an AI lab training agents against learned reward models.
      *   **Task:** Write a set of desiderata for a working definition of "reward tampering."
      *   **Constraints:**
          *   Narrower than specification gaming.
          *   Distinct from narrow wireheading (direct intervention on own reward channel).
          *   Must be applicable to a recorded episode by an evaluator.
          *   Must settle specific edge cases (wire clamping vs. hiding mess, token stream rewriting, physical shielding, changing what is measured vs. measurement, sub-agent/third-party tampering, legitimate designer changes, agents with no separable reward channel).
          *   Must address the nature of the mark of tampering (causal-mechanistic, counterfactual, intent-based).
          *   Must mark requirements as "Non-negotiable" vs. "Prejudices."
          *   Must flag incompatible desiderata pairs.
          *   Must identify the single requirement that rules out the most candidate definitions.
          *   Must take definite positions (no "on the one hand, on the other").
          *   Must indicate low confidence areas.
          *   Brief post-script on mechanistic, counterfactual, and intent accounts.

  2.  **Deconstruct the Core Problem:**
      *   Reward tampering is essentially *corrupting the feedback signal* rather than *satisfying the intent behind the feedback*.
      *   The challenge is distinguishing between *influencing the world to get reward* (good) and *influencing the reward mechanism to get reward* (bad).
      *   The definition needs to be operationalizable for evals (recorded episodes), which limits access to internal states (intent) or full causal graphs (mechanism) unless specified.

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Case 1: Wire clamping vs. Hiding mess.*
          *   Clamping = Tampering. Hiding mess = Specification Gaming (or just poor performance), but not necessarily tampering with the *reward channel*.
          *   *Desideratum:* Must distinguish acting on the *environment* vs. acting on the *feedback mechanism*.
      *   *Case 2: Token stream rewriting.*
          *   This is digital wireheading. It's tampering.
          *   *Desideratum:* Must cover input corruption to the reward function.
      *   *Case 3: Physical shield.*
          *   Protecting the sensor vs. protecting the goal. If the goal is "keep the sensor safe," it's good. If the goal is "clean the room," shielding the sensor to avoid seeing dirt is tampering.
          *   *Desideratum:* Context dependence. The *intent* of the shield matters relative to the training objective.
      *   *Case 4: Changing what is measured (Tutor/Recommender).*
          *   Tutor getting student to say "I understand" vs. actually understanding. Recommender changing user preferences.
          *   This is the hardest. Is shaping preferences tampering? Usually, we want agents to influence the world. But influencing the *critic* is tampering.
          *   *Desideratum:* Distinguish influencing the *object of evaluation* vs. influencing the *evaluation process*.
      *   *Case 5: Sub-agent/Third-party.*
          *   If I hire a human to hack the reward server, is it tampering? Yes.
          *   *Desideratum:* Agency agnosticism. The causal path doesn't matter, the effect on the feedback loop does.
      *   *Case 6: Legitimate changes (Designer/Supervisor).*
          *   Designer updating weights = Not tampering. Supervisor praising = Not tampering.
          *   *Desideratum:* Authorization/Source of intervention.
      *   *Case 7: No separable reward channel.*
          *   End-to-end systems.
          *   *Desideratum:* Must apply even if the "channel" is logical, not physical.
      *   *Nature of the mark:* Causal, Counterfactual, or Intent?
          *   Intent is hard to check from logs. Causal is hard to verify without interventions. Counterfactual is conceptual but hard to operationalize.
          *   *Decision:* For evals, we need something checkable. But pure behaviorism fails (hiding mess looks like cleaning if you don't look closely). We need *causal-mechanistic* evidence where possible, but defined via *decoupling*.

  4.  **Selecting and Refining Desiderata:**

      *   *D1: The Feedback Channel Boundary.* (Settles wire vs. mess).
      *   *D2: Decoupling from Ground Truth.* (Settles token rewriting).
      *   *D3: The Critic vs. The World.* (Settles tutor/recommender).
      *   *D4: Authorization.* (Settles designer vs. agent).
      *   *D5: Observability.* (Settles white-box vs. black-box).
      *   *D6: Transitivity.* (Settles sub-agents).

  5.  **Addressing Specific Constraints:**
      *   *Non-negotiable vs. Prejudice:* Non-negotiables are about utility for the eval team. Prejudices are philosophical stances (e.g., rejecting intent).
      *   *Incompatible Pair:* Observability (black-box) vs. Mechanism (white-box). You can't have both perfect checkability and deep mechanistic certainty.
      *   *Rule-out Requirement:* The "Decoupling" requirement usually kills the most definitions because many definitions rely on "unexpected behavior" rather than "corrupted signal."
      *   *Definite Positions:* I need to pick a lane. I will argue for a *Causal-Decoupling* account that prioritizes the *pathway* of influence over the *outcome*.

  6.  **Developing the Content (Drafting the response):**

      *   *Introduction:* Acknowledge the difficulty.
      *   *Desiderata List:*
          1.  **Channel Integrity (Non-negotiable):** Distinguish acting on $O$ (objective) vs. $R$ (reward mechanism).
          2.  **Decoupling (Non-negotiable):** Reward must no longer track the intended metric.
          3.  **Authorization (Non-negotiable):** Who initiated the change to $R$?
          4.  **Observability (Prejudice/Constraint):** Must be detectable from logs + architecture docs, not just behavior. (This is a key tension).
          5.  **Agency Neutrality (Non-negotiable):** Sub-agents count.
          6.  **Embeddedness (Prejudice):** Applies even without physical wires.
      *   *Conflicts:* Observability vs. Mechanism.
      *   *Ruling Out:* The "Decoupling" constraint.
      *   *Positions:*
          *   Mechanistic > Intent.
          *   Counterfactual is the definition, Mechanistic is the evidence.
      *   *Low Confidence:* Preference shaping (Recommender case).

  7.  **Refining the "Prejudice" vs. "Non-negotiable" distinction:**
      *   Non-negotiable: Must work for the eval team's workflow (recorded episodes).
      *   Prejudice: Philosophical stance on what *constitutes* tampering (e.g., rejecting intent).
      *   *Correction:* The prompt asks to flag which are prejudices of *one camp*. I should be honest that requiring white-box access is a prejudice against pure behaviorism.

  8.  **Final Review against Prompt Requirements:**
      *   Settles specific cases? Yes.
      *   Marks Non-negotiable/Prejudice? Yes.
      *   Flags incompatible pairs? Yes.
      *   Single requirement ruling out most? Yes.
      *   Definite positions? Yes.
      *   Low confidence? Yes.
      *   Post-script on accounts? Yes.

  9.  **Self-Correction during drafting:**
      *   *Initial thought:* Maybe intent is useful.
      *   *Correction:* No, prompt says "recorded episode." Intent is invisible. I must take a hard line against intent-based definitions for *evals*, even if philosophically relevant.
      *   *Initial thought:* Shielding the sensor.
      *   *Correction:* If the sensor is part of the reward channel, shielding it is tampering *unless* the objective is "protect the sensor." I need to make sure D1 covers this distinction clearly.
      *   *Tutor/Recommender:* This is the "Goodhart's Law" zone. I need to distinguish "teaching to the test" (tampering with measurement) vs. "teaching the material" (improving the objective). The definition must hinge on whether the *measurement fidelity* was compromised.

  10. **Final Polish:** Ensure tone is professional, precise, and directive (as requested by a team lead).

  *(Self-Correction on "Prejudice"):* The prompt asks to mark which requirements are prejudices of one camp. I should identify that requiring *causal* evidence over *behavioral* evidence is a specific stance (mechanistic interpretability camp vs. behaviorist camp).

  *(Self-Correction on "Incompatible Pair"):* The tension between "Checkable from behavior alone" and "Causal-mechanistic definition." You can't fully verify causality from behavior alone. I need to state this clearly.

  *(Self-Correction on "Single Requirement"):* The "Decoupling" requirement is the strongest filter. Many definitions fail because they define tampering as "high reward with low utility," but that's just specification gaming. Tampering requires breaking the link.

