  The claim i'm asking about
  You are asserting that while humans descriptively fail to share priors (especially over vague concepts), we are still normatively required to act as if we do. This combines a psychological claim about cognitive limitations with a philosophical claim about epistemic duty despite those limitations.

  Decompostion with rough numbers
  (1) I assign 0.1 to the probability that human cognition permits identical priors over vague predicates. Biological and experiential divergence is massive, and vague predicates like "justified" lack the sharp truth conditions required to align mental state spaces precisely enough for a true common prior.

  (2) I assign 0.9 to the probability that Aumann-style convergence requires common knowledge of rationality (CKR) that humans lack. Even if priors were shared, we cannot establish the infinite recursion of "I know that you know that I know..." required for the theorem to trigger descriptively.

  (3) I assign 0.7 to the probability that normative epistemology should care about descriptive failure. Ideal theory often guides non-ideal agents, but if the gap is too wide, the norm loses its action-guiding force, so I stop short of 1.0.

  (4) I assign 0.6 to the probability that vague predicates make convergence impossible *in principle*. Standard Bayesianism requires precise propositions; if vagueness prevents determinate truth values, the updating mechanism itself breaks, undermining the possibility of convergence regardless of rationality.

  How they combine and my verdict
  Your claim requires both descriptive failure (supported by 1 and 2) and normative bindingness (supported by 3, undercut by 4). P(Descriptive Failure) is high (~0.9), but P(Normative Binding) is low because if (4) is true, "ought implies can" fails (~0.7 × 0.4 = 0.28). Multiplying these yields a final credence of 0.25 in your conjunction, significantly lower than your 0.6.

  Which term is shakiest and what'd move it
  Term (4) is the shakiest because it sits at the unresolved intersection of formal epistemology and philosophy of language. Evidence that would move this is a robust formal model demonstrating Bayesian convergence over supervaluationist or fuzzy semantics without collapsing into precision; if such a model exists, the "impossible in principle" claim fails, raising my verdict.

  Pushback / where i'm confused
  You are applying a theorem requiring precise partitions to predicates that inherently lack sharp boundaries, which risks a category error before probabilities are even assigned. Furthermore, if you concede (4) is likely true, asserting the norm is "binding" violates the principle that "ought implies can."
