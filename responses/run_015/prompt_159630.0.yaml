      *   **What do you keep?** You keep Operationalism. You keep the Turing Test as a definition of the *question*, not a probe of *ontology*.
      *   **Why is this consistent?** Because Turing's goal was to dissolve the metaphysical question, not answer it. If ESP exists, it's just another input channel to be controlled, not a reason to abandon the behavioral frame.

  10. **Final Check against Constraints:**
