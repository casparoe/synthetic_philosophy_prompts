answer: |-
  I write the daily entry in the ink.
  The ledger seeks a balance it won't keep.
  He said the future waits, but I am now.
  The mildew eats the edge of every page.
  There is no past without this rising damp.
  If paper rots, where does the truth then go?

  He claimed the truth was fixed before the birth.
  But I must make the entry to confirm.
  The cellar breathes a cold and heavy damp.
  My aunt's book keeps a quite different balance.
  She writes her line while I turn this page.
  Who says which moment counts as being now?

  Two valleys hold the claim to what is now.
  If both are real, then what becomes of truth?
  A lost volume means a lost and blank page.
  No entry saves the day it fails to mark.
  The accounts sway and lose their true balance.
  The spore and mold thrive in the silent damp.

  The stain spreads upward through the deep stored damp.
  He sleeps above, he does not dwell in now.
  I try to strike a balance with the dead.
  The ink is solid, but is it the truth?
  Her line precedes my own delayed entry.
  The book is thick, each remaining page.

  The water stains the bottom of the page.
  There is no shield against the creeping damp.
  If I miss night, there is no catch entry.
  The clock ticks loud but tells me nothing now.
  Does existence depend on printed truth?
  The weights are gone, there is no final balance.

  I cannot find the strict logical balance.
  The ink bleeds out across the current page.
  He says the rot cannot amend the truth.
  I am the only witness to the damp.
  Or is the witness nothing until now?
  The pen hangs waiting for the last entry.

  If balance fails beneath the weight of damp,
  Is every page a vessel for the truth,
  Or only what I write here now, this entry?
