  **Method**

  Stage 1: Define Anchoring precisely. I will distinguish it from generic attitude inheritance. Anchoring isn't just that attitudes are fitting; it's that the rationale provides the normative ground specifically because the outcome is unalterable. This explains the modal profile: the reason doesn't vanish when ability does.
  Stage 2: Construct and analyze the Geological Fault case. I will lay out the verdicts for Action-Inheritance, No-Inheritance, and Anchoring. Action-Inheritance fails because it implies B had a reason to prevent the unpreventable. No-Inheritance fails because it cannot distinguish A and B's fitting responses.
  Stage 3: Solve the asymmetry problem. I will argue that Anchoring accommodates the difference between A and B without converting the rationale into a personal reason. The agentless rationale anchors the negative value. The causal history modulates the *type* of attitude fittingly held, not the reason itself. This preserves the agentless nature of the rationale. This is the critical move. I need to show how causal history interacts with anchoring.
  Stage 4: Defend against theoretical collapse. I will show this doesn't smuggle in hypothetical agents. The modulation is non-normative fact sensitive, not reason-sensitive. Address the "list" worry. Is this just a hybrid? I will argue it's a unified theory of normative anchors.

  **What the chapter would establish, and what would sink it**

  Success means proving Anchoring is a distinct, viable position. It establishes that normativity survives the loss of agency. The decisive factor is the Geological Fault case. If I can show that B's agent-regret is fitting without implying B had a practical reason to act differently, Anchoring wins. This preserves the intuition that some things are bad even if no one could fix them, while respecting the intuition that causal involvement matters.
  Failure looks like this: if the asymmetry between A and B *requires* B to have had a personal reason to act, even a defeated one, then Agentialism wins. If the difference between A and B is purely psychological with no normative weight, No-Inheritance wins. Another failure mode is if my solution to the asymmetry turns out to be a disguised version of Action-Inheritance. If I can't explain the modulation without referencing personal reasons, the chapter fails. I must be honest: if the asymmetry collapses the view, I will conclude that agentless rationales exist but do no work. That is a substantive result, but it sinks the specific project of defending Anchoring. I need to be clear about the "list" worry. If the hybrid is just a list, the theory lacks unity.

  **Scope and biggest risk**

  8,000 words is tight. I need to avoid metaphysical deep-dives into the nature of reasons. The risk is getting stuck on whether agentless rationales exist rather than what they do. I must assume existence for the sake of the inheritance argument. Another risk is the case becoming too complex. I need to keep the Geological Fault case simple enough to be intuitive but robust enough to bear the weight. If I spend too much word count defending the case intuitions, I won't have space for the theory. I will prioritize the theoretical account of anchoring over exhaustive case variation work.
