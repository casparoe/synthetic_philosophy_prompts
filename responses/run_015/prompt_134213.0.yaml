          *   **Path A1-i: Gene-Level Selection**
              *(The plasmid is a selfish replicator; host death is irrelevant if transfer works.)*
              *   **LEAF A1-i-α: Cultural Case = Individual/Meme Level**
                  *   **Position:** **Dawkins-style Gene Selectionism / Memetics**
                  *   **Notes:** Classic replicator view. Genes and memes are the only things that really count; organisms and groups are just vehicles.
              *   **LEAF A1-i-β: Cultural Case = Group Level**
                  *   **Position:** **Unnamed / Unstable**
                  *   **Comment:** It's weird to say genes are selfish but cultures are group-selected; usually, the logic collapses one way or the other.
          *   **Path A1-ii: Group-Level Selection**
              *(The biofilm survives better, even if individual bacteria die.)*
              *   **LEAF A1-ii-α: Cultural Case = Individual/Meme Level**
                  *   **Position:** **Unnamed / Unexplored**
                  *   **Comment:** Claiming genes act individually but cultures act individually while bacteria act as groups is a messy mix of mechanisms.
              *   **LEAF A1-ii-β: Cultural Case = Group Level**
                  *   **Position:** **Wilson/Sober Multilevel Selection (MLS)**
                  *   **Notes:** Accepts selection at multiple levels depending on the variance; genes can be low-level, but groups matter for higher-order traits.
          *   **Path A1-iii: Holobiont-Level Selection**
              *(The bacterium + plasmid unit is the target.)*
              *   **LEAF A1-iii-α: Cultural Case = Individual/Meme Level**
                  *   **Position:** **Unnamed / Incoherent**
                  *   **Comment:** If the host dies faster, the holobiont has lower fitness, so claiming it's the unit of selection here contradicts the math.
              *   **LEAF A1-iii-β: Cultural Case = Group Level**
                  *   **Position:** **Unnamed / Unattractive**
                  *   **Comment:** Mixing holobiont logic for bacteria with group logic for humans feels like category confusion without a bridging theory.

  *   **BRANCH B: The Colony as Interactor**
      *(The colony is the unified body being selected; workers are just cells.)*
      *   **SUB-BRANCH B1: Synthetic Plasmid Case**
          *   **Path B1-i: Gene-Level Selection**
              *   **LEAF B1-i-α: Cultural Case = Individual/Meme Level**
                  *   **Position:** **Hull's Interactor/Replicator Distinction**
                  *   **Notes:** Fits well; the colony is the interactor, but the gene/meme remains the replicator across all cases.
