  ### The Units of Selection Decision Tree

  **ROOT: How do you resolve the Sterile Worker Ant case?**
  *(Where is the primary causal work for the sterile behavior located?)*

  *   **BRANCH A: The Queen's Genome**
      *(The worker is a vehicle for the queen's genes; kin selection does the heavy lifting.)*
