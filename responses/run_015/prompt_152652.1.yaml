prompt: |-
  I'm TAing for an upper-level seminar on practical rationality this term, and last week in the grad lounge — three coffees deep, my notes a mess — our study group got into an argument we where not able to settle, and I want a pair of cases that either settles it or at least forces the disagreement out into the open.

  Here's where we got stuck. Everyone agreed that hyperbolic (or beta-delta / quasi-hyperbolic) discounting is the standard formal story people reach for when they want to model weakness of will. But then someone pointed out that what the model actually delivers is a *change* in what the agent prefers between t1 and t2: at t2 she prefers the smaller-sooner option, full stop, discounted at her own current rate. So on the model she never acts against her own contemporaneous all-things-considered judgement. The "weakness" only shows up if you identify the earlier self and the later self as one agent and treat the earlier ranking as the authoritative one. Half the room said that's precisely the point and strict akrasia is a myth; the other half said no, there are perfectly ordinary cases where you know right then, in the moment, that you shouldn't, and you do it anyway, and no discount curve has anything to say about those.

  So: build me a matched pair of cases that separates the two phenomena. Same agent as nearly as possible, the same two options (a smaller-sooner and a larger-later reward a normal person could actually face — dissertation writing, a night shift, the gym, saving for a new boiler, whatever works), and the same observable sequence: at t1, with both options still ahead of her, she ranks the larger-later option above the smaller-sooner one and says so or plans accordingly; at t2, with the smaller-sooner option now on offer, she takes it.

  - In Case 1, the reversal has to be *generated* by present-biased discounting and nothing else — I want to see the common-delay signature explicitly (both options delayed → larger-later wins; the common delay removed → smaller-sooner wins), i.e. the pattern a time-consistent exponential discounter cannot produce.
  - In Case 2, the same observable sequence, but the agent is time-consistent: at t2 she still ranks the larger-later option above the smaller-sooner one, and takes the smaller-sooner one anyway. Hyperbolic discounting should contribute nothing to the explanation.
  - Both cases: ordinary life, one paragraph each, no exotic devices, no forgetting, no new information that changes the payoffs, no drugs or brain lesions. Don't stipulate the verdicts — generate them from the set-up, and make it a real matched pair, not two unrelated stories with the same moral.

  Then give me the payoff: for each case, what she prefers and does at t1 and at t2 and why; in which case (if either) charging her with akrasia is actually apt, keeping synchronic akrasia distinct from mere diachronic preference change; the single structural feature that differs between the two cases and what happens to the pair if you remove it; and an honest note on the counterattacks — how someone who thinks the discounting story *is* the theory of akrasia would try to explain Case 2 away, and how someone who insists on strict akrasia would argue that Case 1 isn't weakness of will at all. I'm planning to run this in discussion section, so keep it tight enough to put on one handout.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Context:** Upper-level seminar on practical rationality (grad/advanced undergrad level). TA needs a handout.
      *   **Core Dispute:** Is weakness of will (akrasia) just time-inconsistent preferences (hyperbolic discounting), or is there a distinct phenomenon of acting against one's *current* best judgment (synchronic akrasia)?
      *   **Task:** Create a *matched pair* of cases (Case 1 & Case 2).
      *   **Constraints:**
          *   Same agent (as much as possible), same options (Smaller-Sooner vs. Larger-Later), same observable sequence (Plan LL at t1, Take SS at t2).
          *   Case 1: Driven *only* by present-biased discounting (hyperbolic). Must show the common-delay signature (preference reversal based on proximity). Time-consistent agent wouldn't do this.
          *   Case 2: Driven by strict akrasia. Agent is time-consistent (exponential). At t2, she *still* prefers LL but takes SS anyway.
          *   Style: Ordinary life, one paragraph each, no exotic devices/forgetting/drugs.
          *   Output: The two cases + The Payoff (analysis of preferences/actions, aptness of akrasia charge, structural difference, counterattacks).
          *   Format: Tight enough for a one-page handout.

  2.  **Deconstruct the Cases:**

      *   **Case 1 (Hyperbolic/Quasi-Hyperbolic):**
          *   *Scenario:* Needs to illustrate the $\beta-\delta$ model.
          *   *t1 (Far):* Both options are in the future. The discount factor applies to both. LL > SS.
          *   *t2 (Near):* SS is immediate. LL is delayed. The present bias ($\beta$) kicks in heavily on the immediate reward. SS > LL.
          *   *Key:* The preference *actually flips*. She wants SS more than LL at t2.
          *   *Idea:* Writing a paper vs. watching TV.
          *   *Refinement:* Let's use the "Dissertation vs. Netflix" trope but make it concrete.
          *   *t1 (Sunday morning):* Plan to write Monday (LL: good grade/progress) vs. watch TV Monday (SS: fun). Chooses Write.
          *   *t2 (Monday night):* Write (effort now, reward later) vs. Netflix (fun now). The effort feels huge *now*. The reward feels distant. She prefers Netflix.
          *   *Wait, check constraint:* "Common-delay signature." I need to ensure the description implies that if both were delayed, she'd choose LL.
          *   *Revision:* Let's use a monetary or concrete reward structure to make the discounting clear, or keep it psychological but explicit. Let's stick to the prompt's suggestion of "ordinary life." Saving money vs. spending is good. Or Gym vs. Couch.
          *   *Selection:* The Gym.
          *   *t1 (Morning):* Plan to go to gym at 5 PM (LL: health) vs. stay home at 5 PM (SS: comfort). Prefers Gym.
          *   *t2 (5 PM):* Go now (cost now, benefit later) vs. Stay home (comfort now).
          *   *Hyperbolic logic:* At t1, both costs/benefits are discounted. At t2, the comfort of staying home is *immediate*, the health benefit is *delayed*. The weight shifts.
          *   *Crucial:* At t2, she *prefers* staying home. She doesn't feel she's making a mistake; she just wants the couch more *now*.

      *   **Case 2 (Strict Akrasia/Time-Consistent):**
          *   *Scenario:* Same setup (Gym vs. Couch).
          *   *t1:* Plans Gym.
          *   *t2:* Takes Couch.
          *   *Constraint:* She must *still prefer* Gym at t2. She judges Gym better all-things-considered *in the moment*, but goes to the couch.
          *   *Mechanism:* This is the hard part. How to describe this without "drugs/lesions"? It needs to be a failure of *will*, not preference.
          *   *Description:* She looks at the options. She acknowledges the health benefits outweigh the comfort *even right now*. She says "I should go." But she sinks into the couch.
          *   *Key:* No preference reversal. The ranking stays LL > SS. The action contradicts the ranking.

  3.  **Drafting the Cases (Iterative Process):**

      *   *Drafting Case 1:* Elena plans on Sunday to run on Tuesday. On Tuesday, she decides running is less valuable than resting *right now*.
      *   *Critique 1:* Need to emphasize the *common delay* aspect. If I move both to next week, she'd run.
      *   *Drafting Case 2:* Elena plans on Sunday to run on Tuesday. On Tuesday, she knows she should run, values running higher, but stays home.
      *   *Refining for "Matched Pair":* Use the exact same scenario (The 5 PM Run).
      *   *Case 1 (Discounting):* Focus on the *change in valuation*. "It just doesn't seem worth it anymore."
      *   *Case 2 (Akrasia):* Focus on the *persistence of valuation* despite action. "It is worth it, I know it, but I can't make myself."

  4.  **Developing the Payoff/Analysis:**

      *   *Preferences/Actions:*
          *   Case 1: t1 (LL>SS), t2 (SS>LL). Action matches t2 preference.
          *   Case 2: t1 (LL>SS), t2 (LL>SS). Action contradicts t2 preference.
      *   *Akrasia Charge:*
          *   Case 1: Not synchronic akrasia. It's diachronic inconsistency. "Weakness" is just a label for the earlier self's frustration.
          *   Case 2: True synchronic akrasia. Acting against contemporaneous judgment.
      *   *Structural Feature:* The stability of the ordinal ranking at t2. In Case 1, the ranking flips due to temporal proximity. In Case 2, the ranking holds steady; the link between judgment and action breaks.
      *   *Counterattacks:*
          *   *Discounting Defender on Case 2:* "You're misdescribing the phenomenology. If she really chose SS, she must have preferred SS *all-things-considered*, even if she didn't realize it. Maybe 'anxiety avoidance' was a hidden payoff." (Revealed Preference defense).
          *   *Akrasia Defender on Case 1:* "That's not weakness, that's just changing your mind. Weakness requires knowing better *now*. If she thinks SS is best at t2, she's rational relative to t2."

  5.  **Refining and Polishing (Checking Constraints):**

      *   *One paragraph each?* Keep it tight.
      *   *No exotic devices?* Just psychology/choice.
      *   *Common-delay signature in Case 1?* Need to explicitly mention that if the choice were pushed back, she'd wait.
      *   *Handout format?* Clear headings, bullet points for the analysis.

  6.  **Final Review against the "Three Coffees Deep" vibe:**
      *   The tone should be academic but accessible.
      *   The distinction needs to be sharp.
      *   Make sure Case 2 doesn't sound like compulsion/addiction (which might be excused as external). It needs to be *ordinary* weakness. The "sinking into the couch" imagery works well.

  7.  **Final Polish of the Analysis Section:**
      *   Ensure the "Single Structural Feature" is clearly identified (Preference Reversal vs. Judgment-Action Gap).
      *   Ensure the Counterattacks are steel-manned.

      *(Self-Correction during drafting Case 1)*: I need to make sure the "common-delay" is clear. I will add a clause about how she would choose the run if both rewards were delayed.
      *(Self-Correction during drafting Case 2)*: I need to make sure she isn't just "unable" (compulsion). She must *choose* against her judgment. "She freely stays home" is key.

  8.  **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  # Handout: Preference Reversal vs. Synchronic Akrasia
  **Seminar:** Practical Rationality | **Topic:** Time, Discounting, and Will

  ### The Matched Pair

  **Case 1: The Discounting Reversal**
  Elena plans on Sunday (t1) to go for a hard run at 5 PM on Monday (Larger-Later: long-term health/fitness) rather than relax on the couch (Smaller-Sooner: immediate comfort). At t1, both the effort and the benefits are in the future; she values the health benefits more than the comfort and commits to the run. When 5 PM arrives on Monday (t2), the comfort of the couch is immediate, while the health benefits remain distant. Her discount rate spikes for the immediate moment. If asked at t2 whether she would prefer to run *next* Monday or relax *next* Monday (pushing both options back), she would choose to run. But facing the choice *now*, the immediate comfort outweighs the distant health benefit. Her preference order flips: at t2, she genuinely prefers relaxing to running. She turns on the TV, satisfying her current highest-ranked desire.

  **Case 2: The Judgment-Action Gap**
  Elena plans on Sunday (t1) to go for a hard run at 5 PM on Monday (Larger-Later: long-term health/fitness) rather than relax on the couch (Smaller-Sooner: immediate comfort). At t1, she values the health benefits more than the comfort and commits to the run. When 5 PM arrives on Monday (t2), she considers the options. She acknowledges the comfort is tempting, but she *still* judges that the health benefits outweigh the comfort, even given the immediate timing. Her preference order remains stable: at t2, she ranks running above relaxing, all-things-considered. She explicitly thinks, "I should run, and running is the better choice." Nevertheless, without new information or external coercion, she sinks into the couch and turns on the TV.

  ***

  ### The Payoff

  | Feature | Case 1 (Hyperbolic Discounting) | Case 2 (Strict Akrasia) |
  | :--- | :--- | :--- |
  | **Preference at t1** | Run > Relax | Run > Relax |
  | **Preference at t2** | **Relax > Run** (Reversal) | **Run > Relax** (Stable) |
  | **Action at t2** | Relax | Relax |
  | **Explanation** | Time-inconsistent preferences. The "weight" of the immediate reward changes the valuation. | Failure of rational agency. The link between evaluative judgment and action is broken. |
  | **Akrasia Charge?** | **Inapt (Synchronic).** She acts on her best current judgment. "Weakness" is just the t1-self complaining about the t2-self. | **Apt.** She acts against her best *current* judgment. This is synchronic irrationality. |

  **The Single Structural Feature:**
  The difference is **Preference Stability at t2**.
  *   In **Case 1**, the temporal proximity of the Smaller-Sooner option *changes* the ordinal ranking. The agent is locally rational at t2 but globally inconsistent.
  *   In **Case 2**, the temporal proximity *fails to change* the ranking, yet the agent fails to maximize. The agent is globally inconsistent and locally irrational.
  *   **Removal:** If you remove the present-bias mechanism from Case 1, she runs (becoming like a standard rational agent). If you remove the "willpower failure" mechanism from Case 2, she runs (becoming like a standard rational agent). The observable behavior is identical; the psychological architecture differs.

  **Counterattacks & Discussion Questions**

  1.  **The Discounting Defense (Against Case 2):** A proponent of the standard model might argue Case 2 is misdescribed. If Elena *chose* the couch, Revealed Preference theory suggests she must have preferred it *all-things-considered* (perhaps avoiding the anxiety of exertion was a hidden immediate payoff).
      *   *Question:* Can we ever empirically distinguish a hidden payoff from a genuine failure of will?

  2.  **The Akrasia Defense (Against Case 1):** A proponent of strict akrasia might argue Case 1 isn't "weakness" at all, but merely a change of mind. If the t2-self genuinely prefers the couch, why call it irrational? Weakness requires knowing better *in the moment*.
      *   *Question:* Does modeling weakness as preference reversal dissolve the normative force of "willpower"? If t2 is rational, who is wrong?
