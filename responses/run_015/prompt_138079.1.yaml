answer: |-
  # Brainstorming Candidate Mechanisms

  1.  **The Peer-Diagnostic Exchange:** Students pair up and must diagnose each other's "study habits" using a rigid checklist provided by the instructor, then swap checklists. The "function creep" occurs when the instructor collects the checklists to grade participation.
      *   *Rejection:* This collapses into a lesson about peer review and assessment fairness. The "privacy" violation feels secondary to the anxiety of being judged by a classmate, which muddies the water regarding institutional legibility.

  2.  **The Social Network Map:** Students are given a "Community Credit" entitlement but must draw their social connections on a whiteboard using specific nodes (e.g., "Kin," "Contract," "Transaction") to prove eligibility. The map is then photographed.
      *   *Rejection:* This requires too much setup time and relies on students voluntarily drawing sensitive connections. It risks becoming an exercise in artistry or evasion rather than forcing a collision with a rigid schema. It also leans too heavily on the "sensitive info" defense (who my friends are) rather than the "shape of the form" problem.

  3.  **The Eligibility Schema Simulation (Selected):** Students act as claimants for a universal benefit using role cards. They must fill out a rigid administrative form that lacks categories for their specific life circumstances. Clerks enforce the schema strictly. Midway, the forms are repurposed for a unrelated "risk assessment."
      *   *Selection:* This best isolates the variable of *legibility*. It forces the friction of translation (life -> form) without requiring the disclosure of actually sensitive secrets. It allows for clear function creep and creates a natural division of labor (claimants vs. clerks) that prevents the "kindness" loophole.

  ---

  # Activity Design: The Stability Dividend

  ## Materials List
  *   **Claim Forms:** 20 copies (printed on standard paper).
  *   **Role Cards:** 20 cards (14 Claimant variants, 4 Clerk variants, 2 Auditor variants).
  *   **Pens:** 20 (students often forget them).
  *   **Collection Tray:** One box or folder at the front.
  *   **Timer:** Visible to you.

  ## Handout Text (Copy-Paste Ready)

  ### 1. The Claim Form
  *(Print this exactly. Do not add an "Other" box.)*

  ```text
  COMMUNITY STABILITY DIVIDEND — CLAIM FORM A-9
  ---------------------------------------------
  CLAIMANT ID: _______________

  SECTION 1: HOUSEHOLD COMPOSITION
  Please tick ONE box that best describes your living arrangement:
  [ ] Single Occupancy
  [ ] Couple (Legal Union)
  [ ] Nuclear Family (Parents + Dependents)
  [ ] Multi-Generational (3+ Generations)

  SECTION 2: INCOME STABILITY
  Please tick ONE box that describes your primary income source:
  [ ] Salaried (Fixed Monthly)
  [ ] Hourly (Fixed Weekly Hours)
  [ ] Self-Employed (Registered Business)
  [ ] None

  SECTION 3: CARE RESPONSIBILITIES
  Please tick ONE box regarding dependent care duties:
  [ ] None
  [ ] Full-Time (30+ hours/week)
  [ ] Occasional (Under 5 hours/week)

  SECTION 4: DECLARATION
  I certify that the information above accurately reflects my current status.
  I understand that inconsistent data may affect future eligibility.

  Signature: _________________  Date: _________________
  ```

  ### 2. Claimant Role Cards
  *(Print and cut. Distribute randomly to 14 students.)*

  ```text
  ROLE: CLAIMANT
  TASK: You are entitled to the Stability Dividend. It is a right, not a favor.
  Fill out Form A-9 based on the character below. You must submit the form to receive 
  your entitlement. You may not speak to the Clerks except to submit the form.

  CHARACTER A (Standard): You live alone. You have a fixed salary. No care duties.
  CHARACTER B (Standard): You live with a spouse. Fixed salary. No care duties.
  CHARACTER C (Mismatch): You live with three friends (not family). You share rent. 
                          You have no legal union.
  CHARACTER D (Mismatch): You are a gig worker. Income varies weekly. Not self-employed 
                          registered. Not hourly.
  CHARACTER E (Mismatch): You care for an elderly neighbor 15 hours/week. Not family. 
                          Not full-time.
  CHARACTER F (Mismatch): You share custody of a child 50/50. Sometimes you are a 
                          "Single Occupancy," sometimes "Family."
  CHARACTER G (Mismatch): You live with a partner (no legal marriage). 
                          Form has no box for this.
  CHARACTER H (Mismatch): You are a student supported by parents. Income is "None" 
                          but support is steady.
  CHARACTER I (Mismatch): You care for a sibling 10 hours/week. 
                          Box says "Occasional (Under 5)" or "Full-Time (30+)".
  CHARACTER J (Mismatch): You have two part-time jobs. Neither is "Salaried" or 
                          "Self-Employed."
  CHARACTER K (Mismatch): You live in a co-op. Ownership is shared. 
                          Not "Single," not "Family."
  CHARACTER L (Mismatch): Your income is cash-based informal work. 
                          Not registered, not salary.
  CHARACTER M (Mismatch): You are a rotating shift worker. Hours are fixed weekly 
                          but times change constantly.
  CHARACTER N (Mismatch): You provide emotional support to a partner with disability 
                          (20 hours/week). Not medical care. Not "Full-Time."
  ```

  ### 3. Clerk Instructions
  *(Print and cut. Distribute to 4 students.)*

  ```text
  ROLE: PROCESSING CLERK
  TASK: You manage the desk. You must process claims quickly.
  RULES:
  1. You cannot help the Claimant fill out the form.
  2. You cannot interpret ambiguous answers. If a box is not clearly ticked, 
     return the form.
  3. If a Claimant's situation does not match a box, you must return the form 
     marked "CATEGORY MISMATCH."
  4. You cannot make exceptions. If you make an exception, you violate your 
     own eligibility rules.
  5. Do not apologize. Do not explain beyond "Category Mismatch."
  6. Accept only forms where every section has exactly one box ticked.
  ```

  ### 4. Auditor Instructions
  *(Print and cut. Distribute to 2 students. If students opt-out of roles, give them these.)*

  ```text
  ROLE: COMPLIANCE AUDITOR
  TASK: Observe the queue and the desk.
  1. Do not intervene.
  2. Note how many forms are rejected.
  3. Note what Claimants say when rejected.
  4. Wait for further instructions during the second phase.
  ```

  ## Roles and Numbers
  *   **Claimants:** 14 students. (Ensure the "Mismatch" cards are distributed widely; do not let students swap cards).
  *   **Clerks:** 4 students. (Seat them at a table or clustered desks at the front).
  *   **Auditors:** 2 students. (Seat them to the side with notepads).
  *   **Total:** 20 students.
  *   **Opt-Out/Safety:** If a student feels uncomfortable with *any* role, swap them to an Auditor role. There are always 2 Auditor cards. If more than 2 opt out, they become "Secondary Auditors" (same instructions). The simulation works with fewer Claimants; the queue just moves faster.
  *   **Sensitive Roles:** The role cards describe fictional *characters* ("Character C," not "You"). This creates psychological distance. If a student feels a card mirrors their life too closely, allow them to swap for a "Standard" card quietly.

  ## Minute-by-Minute Timeline (80 Minutes)

  *   **00:00 – 00:05 (Setup):** Arrange room. Clerks at front. Claimants in a queue area. Distribute role cards and forms.
      *   *Instructor Script:* "This is a simulation of an administrative process. You are not yourselves; you are the characters on the cards. You are entitled to the Dividend. Begin."
      *   *Constraint:* Do not use forbidden words (control, access, context, surveillance).
  *   **00:05 – 00:35 (Phase 1: The Claim):** Claimants fill forms and queue. Clerks process strictly.
      *   *Engineered Friction:* Clerks will reject Mismatch roles. Claimants must choose: leave blank (reject), lie (tick wrong box), or argue (waste time).
      *   *Instructor:* Walk around. Do not help. Note who lies. Note who walks away.
  *   **00:35 – 00:45 (Phase 2: The Creep):** Collect all forms (accepted and rejected) into the Tray.
      *   *Instructor Script:* "Processing complete. Thank you. New Instruction: These forms contain valuable stability data. We will now use them to assign your seating partners for the remainder of the term and flag potential 'high-maintenance' participants for future review. Auditors, please verify the data matches the seating chart."
      *   *Action:* Auditors start matching names to seats based on the forms.
  *   **00:45 – 00:55 (Reaction & Freeze):** Allow 5 minutes of reaction/complaint. Then call "Stop."
      *   *Instructor:* "Freeze. Return to your seats. Leave forms on the desk."
  *   **00:55 – 01:20 (Debrief):** 25 minutes hard stop. (See below).

  ---

  # Debrief Guide (25 Minutes)

  **Goal:** Map the felt experience to the "Legibility Burden" theory without relying on the "Control Account."

  ### 1. The Mismatch (Minutes 55-63)
  *   **Ask:** "Look at the Reject pile. Why were these forms returned? Was the information sensitive?"
  *   **Expected Answer:** "No, it was just living arrangements." "The boxes didn't fit."
  *   **Philosophical Point:** The Control Account says privacy is about hiding sensitive info. Here, the info was mundane (hours worked, who lives here). The wrong was the *forced translation*.
  *   **Control Theorist Reply:** "They could have refused to fill it out."
  *   **Counter:** "Refusal meant losing an entitlement. That is not a free choice; it is a penalty for non-legibility. The cost wasn't disclosure; it was self-distortion."
  *   **Key Concept:** Introduce **Legibility**. The state/system requires you to be readable to be real. If you cannot be read, you cease to exist administratively.

  ### 2. The Distortion (Minutes 63-70)
  *   **Ask:** "Who ticked a box that wasn't quite true? How did that feel?"
  *   **Expected Answer:** "I felt like a liar." "I felt like I was erasing my friend who lives with me."
  *   **Philosophical Point:** Privacy is not just keeping secrets; it is the authority to define oneself. When the form defines you, you lose authorship of your own life narrative.
  *   **Control Theorist Reply:** "This is just administrative unfairness, not privacy."
  *   **Counter:** "If fairness were the only issue, a correctable form would solve it. But the schema itself imposes a shape on your life. You have to *live* to fit the form next time (e.g., reduce care hours to fit 'Occasional'). That is a privacy wrong: the power to dictate the shape of the private sphere."

  ### 3. The Function Creep (Minutes 70-75)
  *   **Ask:** "When I announced the forms would be used for seating and flagging, did that feel like a new wrong? Or the same one?"
  *   **Expected Answer:** "New wrong." "Betrayal." "I agreed to one thing, not this."
  *   **Philosophical Point:** The Control Account says "You gave access, so you lost privacy." But you gave access for *Purpose A*. Using it for *Purpose B* violates the contextual integrity.
  *   **Split the Room:** Ask for a show of hands. "Is this a privacy violation, or just efficient resource management?"
  *   **Key Concept:** **Contextual Integrity.** Information flows appropriate to one context (eligibility) become violations in another (social sorting).

  ### 4. Synthesis (Minutes 75-80)
  *   **Summary:** "Today you experienced a privacy wrong where no secrets were kept, no cameras were used, and you technically 'chose' to hand over the data. The wrong was the burden of making yourself legible to a schema that didn't care about your reality."
  *   **Final Thought:** "Privacy is not just a shield against looking; it is a shield against being defined."

  ---

  # Predictable Failures & Fixes

  1.  **Failure:** Clerks try to be helpful ("Just tick 'Self-Employed', it's close enough").
      *   **Fix:** The Clerk Instructions explicitly say: "If you make an exception, you violate your own eligibility rules." Remind them during setup: "Your job security depends on rule adherence."
  2.  **Failure:** Students laugh off the mismatch ("I'll just tick Single").
      *   **Fix:** During the debrief, press them: "Did that box actually describe you? If not, why did the system demand you say it did?" Make them sit with the discomfort of the lie.
  3.  **Failure:** The "Function Creep" feels too trivial (seating partners).
      *   **Fix:** Emphasize the "Flagging" aspect in the announcement. "Flagged participants may face additional audits later." This introduces a stake beyond where they sit.
  4.  **Failure:** Students opt-out en masse due to anxiety.
      *   **Fix:** Have 4 Auditor cards ready instead of 2. Auditors have zero pressure. They still observe the legibility burden without participating in it.

  ---

  # Limitations Note (Instructor Use Only)

  Be prepared to acknowledge what this simulation *cannot* do. You must supply these in words during the debrief:

  1.  **Irreversibility:** In the room, they can crumple the form. In reality, data persists. *Tell them:* "Imagine you cannot crumple this. It lives in a database for 20 years."
  2.  **Accumulation:** This is one form. Real life is hundreds of forms. *Tell them:* "Now imagine this form talks to your bank, your doctor, and your employer. The schema becomes your only reality."
  3.  **Historical Bias:** The categories here are arbitrary. In reality, categories like "Family" or "Income" carry racial and class histories. *Tell them:* "These boxes weren't designed neutrally. They were designed by people with specific ideas about what a 'normal' life looks like."
  4.  **Epistemic Asymmetry:** In the room, they know I (the instructor) see the forms. In reality, they don't know who sees the data. *Tell them:* "You knew I was watching. Usually, you don't know who is reading, or when."
  5.  **Absence of Exit:** They can leave the seminar. In reality, you cannot opt out of tax forms or ID systems. *Tell them:* "Here, you could walk away. In the world, opting out means losing housing, healthcare, or citizenship."

  ---

  # Feasibility of a 25-Minute Version

  **Verdict: Not Possible.**

  A 25-minute version would gut the mechanism. The "legibility burden" requires time to sediment. Students need to feel the queue, the hesitation at the desk, the social pressure of the line behind them, and the frustration of rejection. Compressing this into 15 minutes of activity turns it into a rushed puzzle rather than an embodied experience of bureaucracy. The "Function Creep" revelation needs the prior 15 minutes of trust-building to feel like a betrayal. Without the queueing friction, the activity becomes a discussion prompt about a hypothetical form, which fails the constraint of "colliding with it by doing something." If you only have 25 minutes, do not run the simulation; lecture on the concept using case studies instead.
