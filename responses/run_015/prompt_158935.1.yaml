answer: |-
  The bridge and conversion strategies offer competing routes from the intuition that one must save a drowning child to the conclusion that affluent agents must aid distant strangers. The bridge strategy relies on parity: since distance and institutional mediation are morally irrelevant, the duty to aid is grounded purely in capacity and stakes. The conversion strategy relies on reclassification: the duty is not positive rescue but negative compensation for participation in harmful institutions. To evaluate them, we must examine their structural features and their performance under three specific test cases.

  Regarding demandingness and stopping points, the bridge strategy is radically demanding. The agent must give until the cost becomes comparable to the stakes prevented, which for most affluent agents implies significant sacrifice. The duty is owed to anyone in peril and discharged by effective transfer. The conversion strategy is potentially less demanding; the duty stops when the agent's contribution to harm ceases or is compensated. The duty is owed specifically to victims of the structures the agent supports, discharged by exit, reform, or reparations. Epistemically, the bridge strategy requires knowledge of efficacy and cost. The conversion strategy imposes a heavier burden: agents must trace causal chains linking their daily activities to specific harms abroad, knowledge that is often opaque or unavailable.

  These structural differences determine how each strategy handles the test cases. In case one, unattributable peril, an agent caused one of three drownings but cannot identify which. The bridge strategy directs the agent to save any child; the duty arises from capacity, so causal history is irrelevant. This offers clear guidance. The conversion strategy struggles. The duty is to repair specific harm, but the agent cannot identify the specific victim owed repair. If the strategy insists on identifying the victim, it paralyzes the agent. If it permits saving any child on the probability that one is the victim, it implicitly accepts that capacity matters independently of specific causation, borrowing bridge reasoning.

  In case two, clean hands, Aida has no causal footprint on harmful institutions but possesses surplus resources. The bridge strategy obligates her immediately; she has the capacity to prevent death at modest cost. The conversion strategy exonerates her. Since she participates in no harmful arrangement and caused no destitution, she has no duty of compensation. This contradicts the shared starting intuition that possessing surplus while others die generates a duty. To avoid this, the conversion strategy would have to redefine "participation" so broadly that it includes mere possession of surplus, at which point it collapses into the bridge strategy's capacity-based view.

  In case three, the overdetermined pond, a thousand droppers collectively drown a child, though no individual drop makes a difference. The bridge strategy obligates each to save the child instead of dropping water; individual causation is unnecessary. The conversion strategy must argue that collective participation generates a duty despite individual causal inefficacy. While plausible, this stretches the "harm" model. If the duty is to repair harm, and no individual caused the harm, the grounding is shaky. Furthermore, if each could save the child at trivial cost, the bridge explanation (capacity) is more direct than the conversion explanation (collective complicity).

  The bridge strategy is stronger overall. It successfully grounds the demanding duty in all three cases, whereas the conversion strategy fails case two entirely and requires ad hoc adjustments in cases one and three. Case two is the most heavily weighted test because it isolates the source of the duty. If a theory cannot obligate an agent with clean hands and surplus resources to save a dying child, it fails to capture the core moral intuition driving the debate. The conversion strategy makes the duty contingent on historical causal facts that are often unknowable or absent, rendering the duty too fragile.

  The strongest objection to the bridge strategy is that it ignores the intuition in case one that the agent at fault is *especially* bound, not just equally bound. By treating causal history as irrelevant, the bridge strategy flattens moral distinctions between harmers and bystanders. However, this objection is manageable. The bridge strategy establishes a baseline duty that applies to everyone. One can accept this baseline while acknowledging a supplementary, stricter duty for those who cause harm. The bridge strategy need not deny special obligations; it merely denies that general obligations depend on them. Thus, it secures the demanding duty universally without losing the nuance of fault.

  Verdict: \answer{bridge}
