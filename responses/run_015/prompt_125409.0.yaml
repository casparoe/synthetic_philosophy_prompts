  **The Causal Address**

  The seminar had ended an hour ago, but Elias, the retired physical chemist, and Julian, the metaphysician, were still standing by the lab sink. On the counter sat three items: a porcelain teacup, a black laboratory notebook, and a rough diamond.

  "Let us review the topology of the failure," Elias said, picking up the teacup. He tapped it against the faucet. It chimed, slipped from his wet fingers, and hit the steel basin. It did not chip. A faint, shimmering lattice flickered over the impact site before vanishing.

  "Masked fragility," Julian noted. "The disposition is intrinsic, the manifestation is extrinsically suppressed."

  "Precisely. The cup is fragile, but the lattice does the work of integrity." Elias set the cup aside and picked up a match. He struck it against the side of the black notebook. The paper did not merely catch; it erupted with a chemical blue flare, far hotter than cellulose should burn. He blew it out instantly.

  "Finkish flammability," Julian said. "The disposition is absent, the manifestation is extrinsically produced upon stimulation."

  "The notebook is non-flammable," Elias corrected. "The filament inside does the work of combustion."

  Elias then picked up the diamond and dropped it into a beaker of water. It did not sit at the bottom. It fizzed, dissolved, and vanished within seconds.

  "Solubility?" Julian asked.

  "Impossible. Diamond is insoluble," Elias said, drying his hands. "But the water in this beaker is continuously saturated with a nano-solvent maintained by an external pump. It is a reverse mask. The object lacks the disposition, the manifestation occurs, but unlike the fink, the mechanism is not triggered by the stimulus; it is sustained by constant maintenance to create the *appearance* of the disposition."

  Julian leaned against the counter, crossing his arms. "So, in the first case, the nature of the object is thwarted. In the second and third, the nature of the object is bypassed. In all three scenarios, the intrinsic properties of the objects are explanatorily idle."

  "Entirely," Elias said.

  "Then I must ask," Julian said, gesturing to the sink. "When we write the report, do we say the cup broke? Do we say the notebook burned? Do we say the diamond dissolved?"

  Elias considered this. He looked at the intact cup, the scorched notebook, and the empty beaker.

  "If we say the cup broke, we credit the cup with a change it didn't undergo. If we say the notebook burned, we credit it with a power it doesn't possess. If we say the diamond dissolved, we credit it with a tendency it lacks."

  "So what is the subject of our sentences?" Julian pressed. "Where does the explanatory work lie?"

  Elias picked up the lab notebook and opened it to a fresh page. He wrote a single sentence and handed it to Julian.

  *The events occurred at the location of the objects, but in virtue of the mechanisms.*

  Julian read it, then looked up. "That's ontologically parsimonious, Elias, but it leaves us with a problem. If the mechanisms do all the work, and the objects contribute nothing but spatial coordinates..."

  "Then we haven't been studying matter," Elias said, turning off the tap. "We've been studying the rent we pay for the space the matter occupies."
