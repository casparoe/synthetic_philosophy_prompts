answer: |-
  Here is a specification for a theory of informal social punishment designed for institutional decision-making (e.g., a professional society committee), derived from the phenomena and distinctions you provided.

  ### I. The Specification: Five Desiderata

  For a theory to be actionable by a committee that must choose between sanction, condemnation, or inaction, it must satisfy the following requirements.

  **1. Locus of Answerability**
  *   **Motivation (Phenomenon 4):** The *Deniability Asymmetry*. A committee can be asked "Why did you do this?"; a scattered crowd cannot. If a theory allows sanctions to emerge from diffuse agency without a designated justifier, it exempts the actors doing the most harm (the crowd) from the requirement of reason-giving that binds the actor doing the least harm (the institution).
  *   **Status:** **Non-negotiable.** An institution cannot act on a theory that does not identify who bears the burden of justification. If the theory cannot locate a sanctioner, the institution cannot validate the sanction without assuming liability for the aggregate.

  **2. Mechanism Transparency**
  *   **Motivation (Distinctions):** *Withdrawing association vs. getting third parties to withdraw it; Condemning vs. imposing costs.* A theory must distinguish between refusing to platform a speaker (associational freedom), actively lobbying others to deplatform them (coercive coordination), and merely arguing against their views (counter-speech). Collapsing these renders the committee unable to choose the least restrictive means.
  *   **Status:** **Non-negotiable.** Without this, the committee cannot distinguish between exercising its own rights and infringing on the subject's professional standing.

  **3. Ex Ante Calculability**
  *   **Motivation (Phenomenon 5):** *Threshold-insensitivity.* An individual deciding whether to sign a letter or withdraw an invitation cannot know if they are the tipping point in a cascade. A theory must provide a rule for action that does not rely on knowing the aggregate outcome in advance. If the theory relies on "do not contribute to disproportionate harm," it offers no guidance to the individual contributor whose marginal impact is imperceptible.
  *   **Status:** **Non-negotiable for guidance.** If the theory cannot guide the individual actor before the fact, it functions only as a post-hoc judgment, which is useless for a committee deciding on future action.

  **4. Proportionality of Cost**
  *   **Motivation (Distinctions):** *The wrongness of punishing excessively.* The professional cost imposed (loss of livelihood, standing, future invitations) must bear a relation to the normative violation (plagiarism, harassment, bad science, offensive speech).
  *   **Status:** **Non-negotiable.** Disproportionate sanctions undermine the legitimacy of the society and expose it to legal or reputational risk.

  **5. Desert vs. Utility Clarity**
  *   **Motivation (Distinctions):** *Punishing an individual vs. shifting what is sayable.* The theory must state whether the sanction is retributive (based on the individual's past wrong) or consequentialist (using the individual to signal a new norm). If the latter, the theory must address whether this uses the individual merely as a means.
  *   **Status:** **Preference of Camp.** Institutions can legitimately choose to be norm-shifting (forward-looking) or retributive (backward-looking), provided they are transparent about it. However, mixing them without acknowledgment is deceptive.

  ***

  ### II. The Structural Tensions

  There are two genuine tensions within this specification that cannot be fully resolved, only managed.

  **1. Ex Ante Calculability vs. Proportionality of Cost**
  *   **The Conflict:** Proportionality requires that the *total* harm match the *total* wrong. Calculability requires that an *individual* actor know the weight of their contribution before acting. In a cascade (Phenomenon 5), the total harm is non-linear; one signature might be harmless, or it might be the one that triggers the cancellation.
  *   **Why it breaks:** If you prioritize Proportionality, you cannot give Action-Guidance to the individual (because they cannot know the total harm). If you prioritize Calculability (e.g., "sign if the act is wrong regardless of outcome"), you risk gross disproportionality in the aggregate. A committee cannot satisfy both; it must choose whether to judge its own action by its marginal contribution or its likely total effect.

  **2. Locus of Answerability vs. The Reality of Diffuse Harm**
  *   **The Conflict:** Requirement 1 demands a specific agent to justify the sanction. However, the most severe informal punishments often arise from Phenomenon 1 (*Sanctions with no sanctioner*), where hundreds of trivial acts aggregate into career destruction without any single agent intending the outcome.
  *   **Why it breaks:** If the theory insists on Answerability, it declares the most common form of informal punishment (the diffuse cascade) "illegitimate" or "invisible," leaving the committee powerless to address the harm because there is no one to hold accountable. If the theory accepts Diffuse Harm, it violates Answerability, forcing the committee to either take blame for a crowd's action or ignore the harm entirely.

  ***

  ### III. The Exclusionary Requirement

  **Locus of Answerability** does the most exclusionary work.

  *   **Why:** It rules out "mob" dynamics and "organic" cancellations as legitimate objects of institutional endorsement. It forces the committee to recognize that if they withdraw an invitation, *they* are the sanctioner, not "the community." It excludes theories that treat informal punishment as a natural market force or a spontaneous emergent property. It demands that if an institution acts, it must own the agency, thereby preventing the institution from hiding behind "community standards" when it makes a specific choice. This eliminates the comfort of claiming one is merely "reflecting" external pressure.

  ***

  ### IV. Empirical vs. Conceptual Claims

  **Conceptual (Hold regardless of facts):**
  *   **Locus of Answerability:** The definition of an institution requires an agent capable of giving reasons.
  *   **Mechanism Transparency:** The distinction between speech and cost-imposition is categorical, not empirical.
  *   **Desert vs. Utility:** The moral difference between retribution and norm-setting is philosophical.

  **Empirical (Contingent on how the world works):**
  *   **Ex Ante Calculability:** Whether individuals *can* actually estimate their contribution to a cascade depends on network transparency. If cascades are truly opaque, this requirement may be impossible to satisfy in practice, not just theory.
  *   **Proportionality (Shadow Sensitivity):** Whether anticipated sanctions (Phenomenon 3) actually produce self-censorship, and whether that self-censorship is harmful to the discipline, is an empirical claim. If speech is robust and sanctions are rare, the "chilling effect" is negligible. If sanctions are frequent and severe, the effect is high. The theory must plug in these variables.
  *   **Norm-Shift Efficacy:** Whether punishing an individual actually changes the norm (makes a practice dishonorable) or merely hardens opposition is an empirical psychological/sociological claim.

  ***

  ### V. Scoring the Theoretical Families

  *   **More-Speech / Counter-Speech:** Fails **Mechanism Transparency**. It collapses the distinction between answering a speaker and reducing their audience. It treats cost-imposition as merely "more talk," which is descriptively false for professional societies where invitation *is* livelihood.
  *   **Deterrence / Norm-Enforcement:** Fails **Desert vs. Utility Clarity**. It explicitly uses the individual as a means to future norm change. It satisfies **Proportionality** only if the deterrence value matches the harm, which is empirically dubious. It handles **Calculability** well (follow the rule to set the norm) but risks **Answerability** if the "norm" is diffuse.
  *   **Retributive / Desert-Based:** Fails **Locus of Answerability** in informal contexts. It requires a legitimate authority to punish. In informal settings, it struggles to justify who has the standing to exact the cost. It satisfies **Proportionality** best but fails **Ex Ante Calculability** if the "punishment" is delivered by a crowd the committee cannot control.
  *   **Rights-Violation (Speech as Harm):** Fails **Mechanism Transparency** and **Proportionality**. It treats certain speech as an act of aggression that justifies any defensive cost. This often leads to escalatory sanctions that exceed the original harm, violating proportionality, and conflates counter-speech with defensive force.
