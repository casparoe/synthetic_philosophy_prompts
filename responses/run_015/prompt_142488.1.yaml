          *   Volume becomes a measure of "subsidy absorption" or "information production incentive" (Grossman-Stiglitz).
      *   **Part 6: Pressure Point 3 (Signal vs. Weight):**
          *   Define: Signal = $P(E|H)$ differs (data). Weight = $P(H)$ or update rule differs (model).
          *   No-Trade rules out Weight-driven trade among shared-prior agents.
