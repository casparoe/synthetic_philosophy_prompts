      *   *Check:* Did I address the "Signal vs. Weight" distinction rigorously? I need to make sure I don't just say "it's the same." I need to test if it adds value. It adds value because it separates *data* diversity from *model* diversity.
      *   *Check:* The AMM point. Be careful. The No-Trade theorem is about agent-vs-agent. AMM introduces agent-vs-mechanism. I need to clarify that distinction.
