      *   *Pressure Point 2 (AMM):* AMM is a subsidized noise trader. No-Trade assumes zero-sum between rational agents. AMM breaks the zero-sum constraint.
      *   *Pressure Point 3 (Signal vs. Weight):* Signal = Info asymmetry. Weight = Model asymmetry. No-Trade says Signal disagreement should vanish upon disclosure. Weight disagreement shouldn't exist if priors are shared.

