      *   **Part 7: The Residue Report:**
          *   *What translated:* Incentives, information asymmetry, calibration.
          *   *What bent:* "Rationality" (Bayesian updating vs. ML optimization).
          *   *What failed:* **Common Knowledge.** This is the big one. ML doesn't really have "I know that you know that I know." It has "Validation Set."
          *   *Meaning:* The residue is a coherence constraint. It says "If your system claims to be fully rational and shared-prior, volume is impossible." Since volume exists, the system is *not* that. It's a sanity check, not a prediction of zero volume in the real world.

  4.  **Refining and Polishing (Self-Correction during drafting):**
      *   *Check:* Did I use citations? No.
