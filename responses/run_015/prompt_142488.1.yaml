      *   **Constraints:** No citations, no titles, no "who said what." Focus on structure and logic. Use the user's vocabulary.

  2.  **Deconstruct the Core Concepts (Mental Mapping):**

      *   *No-Trade Theorem (Core):* If agents share a prior and update rationally (Bayes), and it's *common knowledge* that they disagree, they shouldn't trade. Why? Because the fact that the other person is willing to trade *is* information. If I know you are rational and share my prior, your willingness to bet against me tells me you have info I don't. I should update my belief to match yours. If we both do this, beliefs converge, and the bet disappears.
      *   *User's Vocabulary:* "Disclosure loop" (show each other forecasts/info), "Calibration," "Aggregation," "Adverse Selection."
      *   *Translation:* If two calibrated predictors share a generative model (prior) and know each other's forecasts (common knowledge), a disclosure loop should collapse the disagreement. If it doesn't, one assumes the other is irrational or has a different prior. Trade implies one thinks the other is wrong *despite* knowing their forecast.
      *   *Shared Prior:* This isn't just "same data." It's "same mapping from data to probability." In ML terms, same inductive bias + same initialization logic.
      *   *Escape Routes:*
          *   Heterogeneous Priors -> Different Inductive Biases.
          *   Transaction Costs -> Spread > Expected Gain.
          *   Noise/Liquidity Traders -> Exogenous volume (AMM subsidy).
          *   Limits to Arbitrage -> Capital constraints/Risk aversion preventing correction.
          *   Common Knowledge Fragility -> I know your forecast, but I don't know that *you know that I know*, etc. (Infinite recursion failure).
