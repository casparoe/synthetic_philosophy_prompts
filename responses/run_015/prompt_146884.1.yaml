          *   *Death:* Cessation of rational agency in the phenomenal world.
          *   *Universalizability (FUL):* Can the maxim be willed as a universal law without contradiction in conception or will?
          *   *Humanity (FH):* Treat humanity (rational nature) always as an end, never merely as a means.

