prompt: |-
  Predict what verdict Kant's universalizability tests—the Formula of Universal Law and the Formula of Humanity—would deliver on the creation and consultation of "cognitive echoes": artificial systems trained exhaustively on a deceased rational agent's corpus so that they generate novel normative judgments attributed to that agent. Would the maxim of producing such an echo be universalizable without contradiction or without undermining the conditions for rational agency? Would relying on it for moral guidance violate the prohibition on treating rational nature merely as a means? Lead with the bottom-line judgment in the first sentence, then lay out the reasoning with no preamble and no restatement of the prompt. Do not include bibliographies, citations, or appeals to secondary scholarship; derive the answer directly from the structure of the categorical imperative and the concept of rational nature.
