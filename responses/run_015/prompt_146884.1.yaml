      *   *Maxim:* "I will create artificial systems trained on a deceased person's writings to generate new moral judgments in their name, and I will consult these systems for moral guidance."
      *   *Contradiction in Conception:* Is it logically impossible for everyone to do this? No. Technology permits it.
      *   *Contradiction in Will:* Would a rational agent will this as a universal law?
