prompt: |-
  I'm a mediator for a small co-housing collective, and every week we get these squabbles about shared space - someone builds a shed that blocks light, plays drums near a sleeping baby, paints a shared wall a color that feels "hostile" to a neigbor, stuff like that. The board is tired of me falling back on generic rules like "be respectful" and wants me to actually use moral particularism - you know, the idea that moral reasons are totally context-dependent and you can't just apply one universal principle everywhere. I need a practical decision proceedure I can run in about 20 minutes with both people sitting right there, no lawyers, and then sign off on for the board. It should list the steps in order, what counts as a good enough answer at each one, where I stop and say no, and where I have to hand it over to a value call because it's not a fact question anymore. The key thing is it has to deal with cases where the exact same feature - like noise or smell - counts as a reason in one layout but not in another. Run it on three examples: (1) the drummer near the baby's window, (2) the wall color that "feels hostile", and (3) allowing a smelly compost bin that actually helps the garden - and make case 3 be one where the proceedure gives an answer I'd hate. Also tell me clearly what this can't do, like predict emotional blowback or cover disputes that involve money. Make it something I can literally read off a card during mediation.
reasoning: |-
  Here's a thinking process that leads to the suggested mediation procedure:

  1.  **Analyze the Request:**
      *   **Role:** Mediator for a small co-housing collective.
      *   **Problem:** Recurring squabbles about shared space (sheds, noise, paint, compost).
      *   **Constraint 1 (Theoretical):** Must use *Moral Particularism* (context-dependent moral reasons, no universal principles like "be respectful").
      *   **Constraint 2 (Practical):** 20-minute procedure, two parties present, no lawyers, board sign-off ready.
      *   **Constraint 3 (Structure):** Ordered steps, criteria for "good enough" answers, stop points (veto), hand-off points (value calls).
      *   **Constraint 4 (Specific Content):** Must handle cases where the same feature (noise, smell) counts differently in different contexts.
      *   **Constraint 5 (Testing):** Run on three specific examples:
          1.  Drummer near baby (Noise).
          2.  Hostile wall color (Aesthetics/Emotion).
          3.  Smelly compost bin (Utility vs. Nuisance) -> *Must yield an answer the mediator would hate.*
      *   **Constraint 6 (Limitations):** Explicitly state what this *cannot* do (emotional blowback, money disputes).
      *   **Format:** Readable off a card during mediation.

  2.  **Deconstruct Moral Particularism for Mediation:**
      *   *Core Idea:* There are no invariant moral principles (e.g., "Noise is always bad"). A feature (like noise) can be a reason *for* an action in one context (celebration) and *against* it in another (sleep time).
      *   *Application:* The procedure cannot rely on rules like "No noise after 10 PM." It must rely on weighing the *specific salience* of features in *this* specific situation.
      *   *Challenge:* How to make this procedural and quick? Usually, particularism is philosophical and open-ended. I need to rigidify it into a checklist without violating the spirit of particularism.
      *   *Solution:* Focus on *Salience Mapping*. Instead of asking "Is this against the rules?", ask "What features are active here, and do they count *for* or *against* in *this* specific layout/timing/relationship?"

  3.  **Drafting the Procedure (The "Particularist Protocol"):**
      *   *Goal:* 20 minutes. Needs to be tight.
      *   *Step 1: Feature Inventory.* List the physical facts (noise, color, smell).
      *   *Step 2: Contextual Valence.* Do these features count + or - *here*? (This addresses the "same feature, different context" requirement).
      *   *Step 3: Holistic Weighing.* No scoring. Just "Does the balance of reasons tilt?"
      *   *Step 4: The Stop/Hand-off.* When do we say no? When is it a value call?
      *   *Refinement:* To make it "particularist," I must avoid appealing to general rights. I must appeal to the *specific interaction* of features.

  4.  **Developing the Three Test Cases:**
      *   *Case 1 (Drummer/Baby):* Clear conflict. Noise is a negative feature here (sleep) vs. positive (expression). Procedure should likely resolve this (protect sleep).
      *   *Case 2 (Wall Color):* Subjective. "Hostile" is a feeling. Procedure needs to validate the feeling without making it a universal rule.
      *   *Case 3 (Compost):* Utility vs. Smell. The prompt requires the procedure to give an answer the mediator *hates*.
          *   *Mediator's preference:* Probably wants the compost (good for garden/community).
          *   *Procedure's output:* Must ban the compost or remove it.
          *   *Why?* Because in *this* specific context (e.g., right next to a window, wind direction), the smell feature outweighs the garden benefit feature, and particularism says we can't appeal to the universal good of "composting."

  5.  **Refining the "Hated Answer" for Case 3:**
      *   To make the procedure output a "hated" result, the procedure must prioritize immediate sensory impact over abstract communal benefit *in this specific instance*.
      *   If the compost bin is 2 feet from a neighbor's open window, the *smell* feature is highly salient. The *garden benefit* feature is distant/abstract.
      *   Particularism says: Don't appeal to "Composting is good." Look at *this* bin, *here*, *now*.
      *   Result: Remove the bin. (Mediator hates this because it hurts the garden project).

  6.  **Drafting the Card (Iterative Process):**
      *   *Tone:* Professional, directive, concise.
      *   *Structure:* Header, Steps 1-4, Limitations.
      *   *Check:* Does it explicitly mention context-dependence? Yes. Does it have stop points? Yes.

  7.  **Addressing the "Value Call" Hand-off:**
      *   Particularism acknowledges that sometimes reasons run out. If the features balance perfectly or are incommensurable, it's not a fact question anymore. It's a choice. The procedure needs to flag this for the Board.

  8.  **Final Review against Constraints:**
      *   20 mins? Yes, steps are tight.
      *   Moral Particularism? Yes, focuses on context-dependent valence of features.
      *   Three examples run? Yes.
      *   Case 3 hated answer? Yes (Compost banned).
      *   Limitations listed? Yes.
      *   Card format? Yes.

  9.  **Self-Correction/Nuance Check:**
      *   *Critique:* Is this *really* particularism, or just utilitarianism with extra steps?
      *   *Fix:* Ensure I emphasize that we aren't summing utility. We are looking at whether a feature *functions* as a reason in this context. A drum beat isn't "noise units," it's "sleep disruption" here, but "art" there. The procedure must ask "What does this feature *do* here?"
      *   *Critique:* Is the "Hated Answer" convincing?
      *   *Fix:* Make sure the reasoning is clear: The procedure forbids appealing to the "greater good" of the garden if the immediate sensory reason (smell) is salient in this specific spatial arrangement.

  10. **Final Polish:** Organize into the "Mediator's Card" and the "Case Run-Through" sections for clarity. (Proceed to generate output).

  *(Self-Correction during drafting Case 3)*: I need to make sure the procedure *forces* the hated outcome based on its own logic, not just arbitrary meanness. The logic must be: "In this specific layout, the smell feature is a decisive negative reason. The garden benefit is a background feature, not a salient reason *for this location*." This aligns with particularism (reasons are context-sensitive).

  *(Self-Correction on Limitations)*: Be honest. This won't stop people from being angry. It won't handle rent/money. It won't predict long-term resentment.

  *(Final check on "Read off a card")*: Keep the language imperative and bulleted.

