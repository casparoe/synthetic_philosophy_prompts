answer: |-
  # THE PARTICULARIST PROTOCOL (Mediator's Card)
  **Time Limit:** 20 Minutes | **Goal:** Context-Specific Resolution | **Authority:** Board-Approved

  ### STEP 1: FEATURE INVENTORY (5 Mins)
  **Action:** List the physical/observable features of the dispute. No judgments yet.
  *   *Ask:* "What are the raw facts? (e.g., decibels, color hex code, distance in feet, wind direction)."
  *   **Good Enough:** Both parties agree on the list of features.
  *   **STOP:** If parties cannot agree on facts (e.g., "It's not smelly" vs "It's rotting"), declare **Fact Impasse**. Hand off to Board for inspection.

  ### STEP 2: CONTEXTUAL VALENCE MAPPING (7 Mins)
  **Action:** Determine if each feature counts *FOR* or *AGAINST* the action **IN THIS SPECIFIC CONTEXT.**
  *   *Rule:* A feature (e.g., noise) is not universally good or bad. Ask: "Does this feature function as a reason *here*?"
  *   *Ask Party A:* "Why does feature X count against the action *in this layout/time*?"
  *   *Ask Party B:* "Why does feature Y count for the action *in this layout/time*?"
  *   **Good Enough:** Each party identifies why a feature matters *here* but might not matter *elsewhere*.
  *   **STOP:** If a party appeals to a universal rule (e.g., "I have a right to paint," "Noise is always rude"), **VETO**. Remind them: "We are judging *this* situation, not all situations."

  ### STEP 3: HOLISTIC WEIGHING (5 Mins)
  **Action:** Look at the map. Do the "Against" reasons outweigh the "For" reasons *in this specific configuration*?
  *   *Rule:* Do not add up points. Look for **Decisive Features**. Is there one feature that silences the others in this context?
  *   **Good Enough:** A clear tilt emerges based on the specific spatial/temporal setup.
  *   **HAND-OFF:** If the reasons are perfectly balanced or incommensurable (e.g., "Safety vs. Beauty"), declare **Value Deadlock**. Hand off to Board for a policy vote. This is no longer a mediation; it is governance.

  ### STEP 4: THE VERDICT & SIGN-OFF (3 Mins)
  **Action:** State the decision based *only* on the specific context identified in Step 2.
  *   *Phrasing:* "Given [Feature A] in [Location B] at [Time C], the action cannot proceed." (NOT: "You are forbidden from ever doing this.")
  *   **Sign-off:** Both parties sign acknowledging the context-specific ruling.

  ***

  ### LIMITATIONS (Read to Parties if Challenged)
  1.  **No Emotional Prediction:** This procedure decides the *action*, not how you will *feel* tomorrow. Resentment is not a valid veto.
  2.  **No Financial Remedies:** We cannot award damages or rent reductions.
  3.  **No Universal Precedent:** This ruling applies to *this* shed, *this* wall, *this* bin. It does not set a rule for next year.

  ***

  # PROCEDURE TEST RUNS

  ### CASE 1: The Drummer vs. The Baby
  *   **Step 1 (Features):** 85dB sound, 2:00 PM, 10 feet distance, open window, 6-month-old infant.
  *   **Step 2 (Valence):**
      *   *Drummer:* Sound counts *FOR* (expression/practice) generally, but *NEUTRAL* here (could practice elsewhere).
      *   *Parent:* Sound counts *AGAINST* (sleep disruption) specifically because of the infant's nap schedule and open window proximity.
      *   *Context Check:* Sound is a reason *here* because of the baby's biology + window placement. It might not be a reason at 4:00 PM or with closed windows.
  *   **Step 3 (Weighing):** The infant's sleep need is a **Decisive Feature** in this specific time/window configuration. It silences the practice benefit *at this moment*.
  *   **Step 4 (Verdict):** Drumming cannot occur at 2:00 PM with that window open. (Drummer may play at 4:00 PM or in the basement).
  *   **Result:** **RESOLVED.**

  ### CASE 2: The "Hostile" Wall Color
  *   **Step 1 (Features):** Bright orange paint, shared courtyard wall, direct line of sight from Neighbor A's kitchen table.
  *   **Step 2 (Valence):**
      *   *Painter:* Color counts *FOR* (vibrancy/artistic freedom).
      *   *Neighbor:* Color counts *AGAINST* (psychological agitation/loss of calm).
      *   *Context Check:* Is "hostility" a universal property of orange? No. Is it a property of *this* orange in *this* sightline? Yes, if Neighbor A experiences it as such. Particularism accepts subjective experience as a contextual fact.
  *   **Step 3 (Weighing):** In a shared living space, "loss of calm in eating area" outweighs "aesthetic preference" *for this specific wall*.
  *   **Step 4 (Verdict):** Repaint required. Not because orange is bad, but because orange *here* disrupts the specific function of the kitchen space.
  *   **Result:** **RESOLVED.**

  ### CASE 3: The Smelly Compost Bin (The "Hated" Answer)
  *   **Scenario:** A communal compost bin that greatly helps the garden but is located 3 feet from a neighbor's bedroom window due to a layout quirk.
  *   **Mediator's Personal Preference:** I want the bin. It's good for the community garden and sustainability.
  *   **Step 1 (Features):** Organic smell, 3-foot distance, prevailing wind toward window, high garden utility.
  *   **Step 2 (Valence):**
      *   *Gardener:* "Garden Health" counts *FOR*.
      *   *Neighbor:* "Smell in Bedroom" counts *AGAINST*.
      *   *Context Check:* Particularism forbids appealing to the universal good of "Sustainability." We must look at *this* bin, *here*. In this specific layout, the smell feature is highly salient. The garden benefit is distant/abstract relative to the bedroom intrusion.
  *   **Step 3 (Weighing):** The **Decisive Feature** is the proximity to the sleeping space. The garden benefit does not negate the immediate sensory intrusion *in this location*.
  *   **Step 4 (Verdict):** **The compost bin must be removed from this location.** (It cannot stay here, even if it hurts the garden).
  *   **Result:** **RESOLVED (But Mediator Hates It).**
      *   *Why I hate it:* It damages the garden project I care about.
      *   *Why the procedure demands it:* The procedure forbids trading a neighbor's immediate sensory environment for a abstract communal good *in this specific spatial arrangement*. To allow it would be to apply a universal principle ("Composting is good") rather than judging the particular reasons present (Smell + Window).

  ***

  **BOARD SIGN-OFF:**
  This protocol isolates disputes from universal rights claims, forcing neighbors to negotiate the specific reality of their shared geometry. It sacrifices long-term policy consistency (Case 3 might be allowed in a different spot) for immediate contextual fairness.

