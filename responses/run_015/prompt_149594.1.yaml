answer: |-
  Here is the epistemic breakdown you asked for. I have treated your intuition as data, but I have not treated it as infallible.

  ### Phase 1: Candidate Principles

  Before settling, I evaluated three frameworks against your eight scenarios.

  **Candidate 1: The Generative Capacity Principle**
  *Definition:* You retain understanding only if you could reproduce the artifact from scratch without assistance.
  *Verdict:* **Rejected.** It fails your Case 1 (regex flags) and Case 6a (Rust). You cannot reproduce a complex Regex or idiomatic Rust from memory, yet you correctly identify those as "fine." This principle conflates *syntax memory* with *system understanding*. It is too strict on mechanics and too loose on intent.

  **Candidate 2: The Predictive Accuracy Principle**
  *Definition:* You retain understanding if you can accurately predict the system's behavior in novel situations (your "shadow comprehension").
  *Verdict:* **Rejected.** This fails Case 5 (Architecture). You can often predict how an architecture will behave in happy paths without understanding *why* it was chosen over alternatives. "Shadow comprehension" is precisely the danger zone: it gives you the illusion of competence without the ability to debug or evolve the system when the prediction fails. It validates Case 3 (skimming) too highly.

  **Candidate 3: The Principle of Justificatory Retention**
  *Definition:* You retain understanding only if you hold the *justification* for the code's specific shape, even if you outsource the *derivation* of that shape.
  *Verdict:* **Selected.** This distinguishes between *how* (derivation/syntax/boilerplate) and *why* (constraints/tradeoffs/intent). It aligns with your gut on almost every case and provides a mechanism to resolve the 6a/6b paradox.

  ---

  ### Phase 2: The Selected Principle

  **The Principle of Justificatory Retention**

  > **You may outsource the *derivation* of code (the mechanical path from problem to solution), but you must never outsource the *justification* of code (the reasoning that rejected alternative paths).**
  >
  > **Understanding is not knowing what the code does; it is knowing why the code is *this* shape and not *any other* shape.**

  #### Why this repairs your model
  Your current principle ("ability to handle the next problem") is consequentialist—it looks at future utility. This principle is epistemic—it looks at current causal linkage.

  *   **Derivation** is the work of getting from A to B. (e.g., "Write a regex," "Implement this sort," "Handle the borrow checker").
  *   **Justification** is the work of deciding B is the right destination. (e.g., "We chose eventual consistency," "We used a state machine here," "This boundary exists to isolate failure").

  AI is a **Derivation Engine**. It is terrible at **Justification** because it does not experience the consequences of the code.

  #### Resolving Your Paradoxes

  **Case 6a (Rust) vs. 6b (Own Code)**
  *   **Your Gut:** 6a is fine; 6b is rot.
  *   **My Verdict:** **6a is conditionally fine; 6b is critical rot.**
  *   **Reasoning:**
      *   In **6a**, you are outsourcing *Derivation* (syntax, memory management mechanics). You retain *Justification* (you know *why* you need this function, what inputs/outputs are required, and where it sits in your system). You are treating the Rust code as a **black box component**. This is epistemically identical to importing a library. It is safe *only if* you do not need to modify the internal logic later. If you need to change the logic, you lose Justification, and it becomes unsafe.
      *   In **6b**, you have lost *Justification*. The code exists because of *your* past decisions. If you need the AI to explain *why* you wrote it, you have lost the causal link between the business requirement and the implementation. You are no longer the owner; you are the custodian. This is rot because the *Intent* (Justification) has decoupled from the *Artifact*.

  **Case 5 (Architecture) vs. 3 (Implementation)**
  *   **Your Gut:** 5 is worse than 3.
  *   **My Verdict:** **5 is systemically fatal; 3 is locally recoverable.**
  *   **Reasoning:**
      *   In **Case 3**, you outsourced the Derivation of a feature. If you skimmed the diff, you missed some Justification, but the scope is local. You can refactor it later.
      *   In **Case 5**, Architecture is pure Justification. It is the set of constraints that will force all future Derivations. If you accept an architecture without understanding the tradeoffs (why SQL over NoSQL? why sync over async?), you have outsourced the *constraints* themselves. Every future feature you build will be derived from a Justification you don't understand. This compounds technical debt at a systemic level.

  **Case 7 (Migration Script)**
  *   **Verdict:** **Context Drift.**
  *   **Reasoning:** A throwaway script requires no Justification retention because it has no future. Once it becomes load-bearing (cron), it requires Justification. If you didn't retain it, you have created a "Justification Vacuum." The system now relies on logic no one can justify.

  ---

  ### Phase 3: New Verdicts

  Here is how this principle applies to the cases you didn't list.

  **Case 9: Pair-programming with a junior who is using the model the whole time.**
  *   **Verdict:** **High Risk (Epistemic Hollowing).**
  *   **Reasoning:** If the junior uses the model for Derivation (syntax, boilerplate), that is mentoring. If they use it for Justification ("How should I structure this?"), and you accept the output without forcing them to articulate *why*, you are validating their loss of understanding.
  *   **Rule:** You must require the junior to justify the AI's suggestions. If they say "The AI wrote it," the work is incomplete. You are not just reviewing code; you are reviewing their *reasoning process*. If the AI does the reasoning, you are paying them to copy-paste.

  **Case 10: Getting paged at 3am for a service the model largely wrote.**
  *   **Verdict:** **Operational Malpractice.**
  *   **Reasoning:** Debugging at 3am requires tracing causal chains under pressure. If you do not hold the Justification for the system's shape, you cannot form hypotheses about failure modes. You will be forced to ask the model "Why is this broken?" while the system is down. This turns a recovery operation into a research experiment.
  *   **Rule:** You may not deploy AI-derived Justification (architecture, critical paths) to production without a "Justification Audit" where a human explicitly maps the constraints to the design decisions in a document or comment.

  ---

  ### Phase 4: Confidence & Pushback

  **Confidence Levels:**
  *   **Core Principle (Justification vs. Derivation):** 90% Confident. This aligns with standard engineering epistemology (knowing *that* vs. knowing *why*).
  *   **Verdict on 6a (Rust):** 75% Confident. I am slightly less confident here because "borrowed competence" can silently become "dependency hell." If the Rust code is a leaf node, it's fine. If it's core logic you'll touch again, my principle says you *must* learn the Justification (the Rust patterns), which contradicts your "Fine" gut verdict. I stand by the principle: if you can't justify the Rust patterns later, you don't own the code.
  *   **Verdict on 3am Page:** 95% Confident. Operational reliability requires causal ownership.

  **Where an Epistemologist Would Push Back:**
  A professional epistemologist would challenge the definition of "Justification." They would argue:
  1.  **Testability vs. Justification:** If the code is fully tested (Case 2), do you *need* to understand the justification? Pragmatists argue that passing tests constitute a form of externalized understanding. I reject this: tests prove *what* happens, not *why* it was chosen. When the tests pass but the business logic is wrong (the "wrong hill" problem), only Justification saves you.
  2.  **Distributed Cognition:** They might argue that understanding doesn't need to reside in *your* head if it resides in the *team's* documentation or the model's context. My counter-argument: Latency. In a crisis (3am page) or a pivot (new feature), you cannot query the distributed system fast enough. Understanding must be local to the agent making the decision.

  ### Final Summary for Your Workflow

  1.  **Allow AI on Derivation:** Syntax, boilerplate, regex, standard patterns, language translation (Case 1, 2, 4, 6a).
  2.  **Block AI on Justification:** Architecture, trade-off analysis, naming conventions that encode intent, "why this boundary" (Case 5).
  3.  **The "Shadow Comprehension" Trap:** If you can predict what the code does but cannot explain why it wasn't written differently, you are in the danger zone. Stop and reconstruct the Justification before adding new features.
  4.  **The 6b Rule:** If you ask AI to explain your *own* past code, you have already failed. Treat this as a priority refactoring signal, not a learning opportunity.

  You are not paid to write code; you are paid to make decisions that code encodes. AI can write. It cannot decide. Keep the decisions.
