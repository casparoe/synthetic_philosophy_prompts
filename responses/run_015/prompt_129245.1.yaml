  I am preparing questions for a philosophy-of-physics podcast interview with an unnamed defender of Kurt Gödel's argument that rotating-universe solutions to Einstein's field equations demonstrate the unreality of objective temporal succession. I want the conversation to avoid popular summaries and to engage the actual logical and physical structure of the position. Draft eight to ten interview questions that press on the following points: first, whether Gödel's anti-realist conclusion requires that our actual universe rotates, or whether the mere mathematical consistency of such metrics with general relativity is enough to undermine temporal realism; second, how the absence of a global time coordinate in these solutions interacts with local thermodynamic asymmetry—specifically, whether an embedded observer could account for a local arrow of entropy without tacitly reintroducing a global temporal orientation; third, the charge that Gödel moves illicitly from the failure of a privileged cosmic foliation to the denial of local before-and-after relations altogether; fourth, what conceptual resources remain for an A-theorist if local experienced succession is granted but no global present-moment or universal simultaneity can be defined; and fifth, whether Gödel's appeal to Mach's principle regarding the origin of inertial forces in rotating frames strengthens or weakens his case against objective temporal passage. For each primary question, include a follow-up keyed to the standard reply a committed defender of this view is most likely to give. Do not include generic biographical questions, and do not ask for bibliographies, citations, or reading lists.
