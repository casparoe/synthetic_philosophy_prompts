answer: |-
  **MEMORANDUM**

  **TO:** University Faculty Senate
  **FROM:** Secretary, Ad Hoc Committee on Electoral Reform
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Voting Procedure for Senate Chair Election

  **Recommendation**
  The Committee recommends adopting Ranked-Choice Voting (RCV) for the election of the Senate Chair, but we must formally amend the pending proposal's justification. While RCV is superior to our current plurality system, the claim that it "fully eliminates incentives for insincere voting" is mathematically false. We advise the Senate to approve the method while acknowledging that no voting system can guarantee complete immunity from strategic voting when three or more candidates compete.

  **The Impossibility of Perfect Sincerity**
  Our Charter directs us to prefer a system where no voter benefits from insincere ranking, provided such a system is possible. However, social choice theory establishes that for any election with three or more candidates, it is impossible to simultaneously satisfy three basic conditions: accepting all possible sincere preference orders (Unrestricted Domain), ensuring every candidate can win (Non-Imposition), and preventing all strategic voting (Strategy-Proofness), unless one voter acts as a dictator. This result, known as the Gibbard-Satterthwaite Theorem, means the Charter's ideal is mathematically unattainable in a democratic election. We must therefore select the system that minimizes, rather than eliminates, strategic incentives.

  **Illustrative Hypothetical**
  To demonstrate why RCV cannot satisfy the Charter's strategy-proofness desideratum, consider a hypothetical profile modeled on our 900-voter electorate with three candidates: A, B, and C.

  *   **400 Voters:** Prefer A > B > C
  *   **350 Voters:** Prefer B > C > A
  *   **150 Voters:** Prefer C > A > B

  Under RCV, no candidate has a majority (451 votes). Candidate C has the fewest first-place votes (150) and is eliminated. Their ballots transfer to their second choice, A. The final tally becomes A (550) vs. B (350). Candidate A wins.

  For the 350 voters who prefer B, this outcome is their least favorite (3rd choice). However, if these voters anticipate the elimination order and vote insincerely—ranking C > B > A—the first-round tally shifts: C receives 500 votes (150 sincere + 350 insincere), while A receives 400. Candidate C wins immediately. Since these voters prefer C (2nd choice) over A (3rd choice), they successfully obtained a better outcome by submitting an insincere ranking. This confirms that RCV does not eliminate strategic incentives; it merely changes the calculus.

  **Assessment of Ranked-Choice Voting**
  If RCV permits strategy, why recommend it? The strongest consideration for the proposal as written is its capacity to resolve the specific "spoiler effect" inherent in plurality voting. In last April's election, supporters of the third-place candidate voted insincerely for the runner-up to block the frontrunner. This "compromising" strategy is a dominant feature of plurality systems. RCV largely mitigates this specific pressure by allowing voters to rank a long-shot first without wasting their vote.

  While RCV introduces other strategic possibilities (such as the "burying" strategy illustrated above), empirical evidence suggests these are less intuitive and less frequently exploited than plurality compromising. Therefore, RCV represents a pragmatic improvement, even if it fails the strict theoretical standard of the Charter. We reject the proposal's claim of full elimination of strategy, but accept the method as the best available approximation of our goals.

  **Next Steps**
  1.  **Amend the Resolution:** The Senate should vote to adopt RCV but strike the language claiming the system eliminates insincere voting incentives.
  2.  **Voter Education:** Implementation requires robust faculty education. We must explain how to rank candidates sincerely while noting that, as in all systems, strategic considerations remain possible.
  3.  **Review Tie-Break Rules:** The current deterministic tie-break by seniority should be reviewed to ensure it aligns with the randomization or runoff procedures compatible with RCV software.

  By adopting RCV with corrected expectations, we honor the spirit of the Charter while respecting mathematical reality.

  **Action Required:** Vote on the amended resolution at the November meeting.
