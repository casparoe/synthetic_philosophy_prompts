answer: |-
  ### 1. Exam Question

  **Course:** PHIL 450: Rationality and the Self
  **Final Examination**
  **Time Allowed:** 90 Minutes
  **Word Limit:** 1,000 words maximum

  **Question 4: The Predictor and Transformative Choice**

  Consider the following case:

  An agent faces a decision to undergo a personally transformative experience (TE). On the standard account (e.g., L. A. Paul), this choice is rationally problematic because the agent cannot know what the experience is like (epistemic problem) and cannot evaluate the outcome using current preferences (preference problem).

  In this scenario, before choosing, the agent consults a **Predictor**: a perfectly reliable device. The Predictor does not give the agent phenomenal acquaintance with the experience. However, it reports all factual outcomes, including: (i) what the agent's preferences will be after the transformation, (ii) what the agent will then judge her own well-being to be, and (iii) what her post-transformation self will say about the choice she made.

  There are two variants of the report:
  *   **Variant 1:** The Predictor reports the agent will prefer the outcome and will *endorse* having become the person who prefers it.
  *   **Variant 2:** The Predictor reports the agent will prefer the outcome but will *not endorse* having become the person who prefers it. The post-transformation self regards the change as made by someone whose aims she no longer shares.

  **Write an essay addressing the following:**
  Does the existence of the Predictor dissolve the rationality problem posed by transformative experience in either variant? Use the contrast between Variant 1 and Variant 2 to argue for a specific conclusion about the nature of the problem. Is the obstacle to rational choice primarily a deficit of evidence, a failure of phenomenal imagination, the indeterminacy of comparisons across successive selves, or something regarding the authority of a future self's preferences?

  ***

  ### 2. Model Answer

  The introduction of the Predictor fundamentally shifts the terrain of L. A. Paul's argument against the rationality of transformative choice, but it does not dissolve the problem entirely. While the Predictor resolves the epistemic deficit regarding *facts* about the future, the contrast between Variant 1 and Variant 2 reveals that the core obstacle is not merely informational or phenomenal, but normative: it concerns the authority of a future self's preferences over the current self's decision.

  Paul's standard argument rests on two pillars. First, the **epistemic problem**: one cannot know what it is like to be a parent (or a vampire, etc.) without experiencing it. Second, the **preference problem**: because the experience transforms one's core preferences, one cannot use current preferences to assign expected utility to the outcome. The Predictor ostensibly solves the epistemic problem. By reporting all factual outcomes, including future well-being judgments, the agent possesses maximal evidence short of phenomenal acquaintance. If the problem were solely a deficit of evidence or a failure of imagination, the Predictor should render the choice rationally transparent in both variants. The agent knows exactly what they are getting into.

  In Variant 1, the rationality problem appears dissolved. The Predictor confirms that the future self will not only enjoy the outcome but will endorse the *process* of becoming that self. Here, the current self can rationally defer to the future self's judgment. Even if current preferences cannot evaluate the outcome directly, the current self can value the *endorsement* of the future self. The continuity of agency is preserved; the future self is recognized as a legitimate successor whose happiness counts toward the current self's utility function. The Predictor allows the agent to treat the future preference as a known variable, bypassing the need for phenomenal imagination.

  However, Variant 2 demonstrates that information alone is insufficient. The Predictor provides the same data regarding well-being and preference satisfaction as in Variant 1. The future self *prefers* the outcome. Yet, the rationality problem persists. Why? Because the future self disavows the *identity* required to reach that preference. She regards the change as imposed by a stranger (her past self) whose aims she no longer shares. This alienation indicates that the problem is not about knowing *what* the future values, but about whether the current self is authorized to act on those values.

  If the obstacle were merely a failure of phenomenal imagination, Variant 2 should be as rationally decidable as Variant 1, since the Predictor describes the phenomenology factually. If it were merely a deficit of evidence, the Predictor's reliability should settle the matter. The fact that Variant 2 remains problematic suggests the issue lies in the **indeterminacy of comparisons across successive selves** rooted in the **authority of preferences**. In Variant 2, the transformation creates a discontinuity so severe that the future self's preferences lack normative grip on the current self. The current self cannot rationally choose to become a person who will look back on that choice with alienation, even if that person is happy. To do so would be to act against the diachronic coherence of the agent.

  Therefore, the Predictor does not dissolve the problem in Variant 2. It strips away the excuse of ignorance, forcing the agent to confront the normative rupture. The rationality problem of transformative experience is not simply that we cannot imagine the future; it is that rational choice theory assumes a stable agent whose preferences can be maximized over time. When a transformation alters the agent's identity such that the future self repudiates the past self's authority (as in Variant 2), expected utility theory lacks the resources to adjudicate the choice. The Predictor proves that having all the *facts* about future preferences does not solve the problem of *whose* preferences count. Thus, the true barrier is not epistemic, but metaphysical and normative: it is the breakdown of the diachronic authority required to make a choice rational for the self as a whole.

  ***

  ### 3. Marking Scheme

  **Total Marks: 20**

  **1. Identification of Paul's Standard Hurdles (4 marks)**
  *   **Criteria:** Clearly distinguishes between the epistemic problem (what it's like) and the preference problem (evaluating based on current values).
  *   **Common Error:** Conflating the two into a single "ignorance" problem or failing to mention preference change.

  **2. Analysis of Variant 1 (Predictor Success) (4 marks)**
  *   **Criteria:** Explains why the Predictor seems to solve the problem here (future endorsement bridges the preference gap; information substitutes for imagination).
  *   **Common Error:** Claiming Variant 1 is still impossible simply because "you can't know what it's like," ignoring the role of endorsement.

  **3. Analysis of Variant 2 (Predictor Failure) (4 marks)**
  *   **Criteria:** Identifies that Variant 2 remains problematic despite full information, due to the alienation/disavowal by the future self.
  *   **Common Error:** Treating Variant 2 as identical to Variant 1 because the Predictor is reliable in both cases.

  **4. Diagnosis of the Core Problem (4 marks)**
  *   **Criteria:** Argues that the contrast reveals the issue is normative/authority-based (whose preferences count) rather than purely epistemic (lack of data/qualia).
  *   **Common Error:** Concluding the problem is still just about "phenomenal knowledge" despite the Predictor's data.

  **5. Counter-Argument & Defense (4 marks)**
  *   **Criteria:** Anticipates a reply (e.g., "If the future self is happy, why does alienation matter?") and defends the diagnosis (e.g., "Rationality requires diachronic coherence, not just happiness").
  *   **Common Error:** Offering a counter-argument that is irrelevant to the specific mechanics of the Predictor case.

  **Differentiation Guide:**

  *   **B-Range (10–14 marks):** The student reconstructs Paul's standard argument competently and correctly identifies that the Predictor provides information. However, they treat the case primarily as an **information problem**. They argue that Variant 2 is problematic only because the agent still lacks "phenomenal knowledge," failing to engage with the specific detail about the future self's *endorsement* or *alienation*. They do not question whose preferences have authority.
  *   **A-Range (15–20 marks):** The student uses the contrast between the variants to pivot away from epistemology. They recognize that since the information is identical in both variants, the difference in rationality must stem from **normative authority** or **personal identity continuity**. They explicitly argue that the Predictor exposes the limits of expected utility theory when the "self" is not stable enough to hold authority over the choice.
