      *   **Section 1: The Time-Relativity of Chance (Addressing Confusion 1).** Explain that chance is a function of time and history. $Ch_{t_0} \neq Ch_{t_1}$. Deference is to the *current* chance. Learning the bias updates the chance, not just the credence.
      *   **Section 2: The Scope of Admissibility (Addressing Confusion 2).** Clarify what "inadmissible" means. It doesn't mean "ignore it." It means "PP doesn't govern this situation." If you know the outcome, credence = 1. PP is silent. The instructor's phrasing needs correction.
