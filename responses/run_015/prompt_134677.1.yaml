prompt: |-
  I am working on a framework for long-horizon institutional governance — the sort of recursive oversight architecture that might apply to intergenerational safety commitments or self-modifying constitutional regimes — and I want to avoid recycling the standard rational-choice or legal-entrenchment treatments of self-binding. Before I evaluate any particular model, I need the full specification.

  Write the desiderata: the complete list of requirements an adequate normative theory of recursive constitutional precommitment, or institutional Ulysses contracting, must satisfy. For each requirement, state the motivating case, distinction, or empirical result behind it; flag whether it is non-negotiable or a preference of one camp; and identify any pair or subset you suspect is jointly unsatisfiable, with the reasoning (for instance, whether absolute democratic revisability, absolute intergenerational binding, and absolute epistemic humility about future knowledge can all hold together). Keep the weight on the criteria and their conflicts rather than on scoring.

  In particular, the theory must accommodate two niche conditions I am injecting into the problem: (1) a meta-rule that permits suspension of the precommitment only through an independent epistemic-audit panel, creating a verification loop between the commitment and its own conditions of revision; and (2) intergenerational cases where future agents differ not merely in preferences but in contested epistemic standards, so that "better information" is itself up for dispute. It must also preserve standard distinctions — between binding present versus future agents, hard versus soft constraints, procedural versus substantive precommitment — without collapsing them.

  Then, briefly and without bibliography or citation, sketch how the rational-choice self-binding model, hard-entrenchment constitutionalism, and dynamic or deliberative revisionism fare against your list.

  Finally, say what would change your mind: which argument, institutional failure mode, or conceptual distinction would lead you to drop or weaken a key desideratum, and identify the specific point in your reasoning that is most fragile.
