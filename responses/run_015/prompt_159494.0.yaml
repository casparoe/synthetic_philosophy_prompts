  The dust settles in **silence**
  shifting the thin **margin**
  I am a new **measure**
  beneath the old **quorum**

  Who makes the **quorum**
  when the room asks **again**
  I am the same **measure**
  passed from cold **hands**
  across the widening **margin**
  into the waiting **silence**

  A heavy **silence**
  decides the legal **quorum**
  I stretch the **margin**
  claiming I spoke **again**
  though only half the **hands**
  touched this **measure**

  A durable **measure**
  built on temporary **silence**
  fifty-two percent of **hands**
  declare a permanent **quorum**
  to ask it **again**
  within the error **margin**

  Inside the error **margin**
  I become the **measure**
  of who returns **again**
  The **silence** holds the **quorum**
  of those without **hands**
  who live beneath these **hands**

  The **hands** keep the **quorum**,
  the **margin** loses the **measure**,
  in **silence** we begin **again**.

  ***

  The envoi's first two lines stage the double majority: popular vote ("hands") meets one threshold, while the vote spread ("margin") fails the other ("measure"). By splitting the satisfaction across two lines, neither condition resolves the other. The final line forces the cycle to restart ("again") within the "silence" of those who inherit the outcome without having voted, ensuring the tension remains open rather than resolved.
