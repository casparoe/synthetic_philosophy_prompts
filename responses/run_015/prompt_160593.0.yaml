answer: |-
  This is a sharp observation, and you are right to feel that existing labels are *almost* but not *quite* fitting. You have identified a specific failure mode of self-enforcing agreements that sits at the intersection of game theory, social psychology, and conflict studies.

  Here is the carving you are looking for, the existing literature that claims it (and where they miss), and a proposal for how to label and model it.

  ### 1. The Formal Home: Imperfect Monitoring with Private Capacity Shocks

  The closest formal ancestor to your phenomenon is the literature on **Repeated Games with Imperfect Monitoring**, specifically the **Green and Porter (1984)** model.

  *   **The Model:** In Green & Porter, firms in a cartel observe market prices but not each other's output. If the price drops, it could be because a partner cheated (defected) or because demand fell (exogenous shock). Because they can't tell the difference, they trigger a "price war" (punishment phase) to maintain discipline.
  *   **The Fit:** This matches your "bridge out" scenario perfectly. The "price" is the cooperative move. The "demand shock" is the battery dying/checkpoint. The "price war" is the retaliatory spiral.
  *   **The Gap:** In standard Green & Porter models, the punishment phase is *temporary* and part of the equilibrium. They know shocks happen probabilistically, so they punish for $T$ rounds and then return to cooperation.
  *   **Your Case:** Your cases unravel *permanently*. Why? Because in your local ceasefire context, there is no **Common Prior** on the probability of shocks. Party B assumes the environment is stable (bridges don't usually break); therefore, a break signals a *change in type* (Party A is now unwilling), not a *change in state* (Party A is unable).

  **Verdict:** This is a **Green & Porter dynamic where the Common Prior on Exogenous Shocks is violated.**

  ### 2. Why "Security Dilemma" and "Noise" Miss the Mark

  Your intuition is correct on both counts.

  *   **Security Dilemma (Jervis):** As you noted, the Security Dilemma is about *capabilities* that are inherently ambiguous (is that tank for defense or offense?). Your case is about *performance* (did the move happen?). The Security Dilemma is about *fear of future aggression*; your phenomenon is about *attribution of past omission*. It is better understood as an **Attributional Security Dilemma**.
  *   **Noise / Contrite TFT (Axelrod, Boyd, Stewart):** The "noise" literature usually models *trembling hands* (I pressed C, the machine registered D) or *perception errors* (I pressed C, you saw D). Solutions like "Contrite Tit-for-Tat" work because the defector *knows* they made a mistake and can signal contrition immediately.
  *   **The Crucial Difference:** In your scenario, Party A *knows* they didn't defect, so they feel no moral need for contrition. They feel *aggrieved* that their incapacity was read as malice. Party B feels *aggrieved* that they were abandoned. **Both have clean ledgers.** Standard repair mechanisms require one side to admit fault. If neither admits fault, the "Contrite" strategies cannot initialize.

  ### 3. Coining the Concept: "The Unverifiable Incapacity Trap"

  Since there isn't a single canonical term, I propose labeling this **The Unverifiable Incapacity Trap** (or colloquially, **The Force Majeure Trap**).

  **Definition:** A breakdown in a self-enforcing relational contract where an exogenous capacity shock prevents cooperation, the incapacity is privately known and unverifiable, and the resulting omission is indistinguishable from intentional defection, leading to a permanent spiral of retaliation where both parties maintain a "clean ledger" of moral blame.

  **Boundary Conditions (What counts and what doesn't):**

  1.  **Verification Cost:** It counts if verification is costly or impossible *ex post*. If Party B could have sent a scout to check the bridge but chose not to, does it still count?
      *   *Yes, if:* The cost of verification exceeds the expected value of continued cooperation (rational ignorance).
      *   *No, if:* Verification was cheap and B chose not to do it out of spite. That moves it from a "Trap" to a "Pretext for Defection."
  2.  **Endogeneity of the Shock:**
      *   *Counts:* The bridge was out due to rain (pure exogenous).
      *   *Doesn't Count:* Party A forgot to maintain the bridge (negligence). In game theory, negligence is often treated as defection because maintenance is part of the "cost of cooperation."
      *   *Grey Area:* Party A took a risky route to save time (calculated risk). This is **Moral Hazard**. If the risk pays off, they cooperate; if it fails, they claim "Trap." This is the hardest empirical category to code.
  3.  **Signaling Capacity:**
      *   If Party A could have sent a runner to say "I'm stuck" but didn't, it moves toward defection. The Trap requires that the *shock itself* disables the communication channel (radio battery died *and* money guy stuck).

  ### 4. Predictors: What Makes the Spiral Survive vs. Unravel?

  You asked whether a long history of clean cooperation protects the relationship or makes it fragile. The literature on **Relational Contracts** (Levin, Baker, Gibbons) and **Trust** suggests a non-linear answer.

  **A. The "Bank of Goodwill" vs. "Rigid Expectations"**
  *   **Protective Factor:** If the history has generated **Generous Tit-for-Tat** norms (e.g., "we ignore one missed move every 10 rounds"), the relationship survives. This requires an explicit or implicit understanding that *errors happen*.
  *   **Fragility Factor:** If the history is *too* clean, parties may develop a **False Positive Monitoring Assumption**. They begin to treat perfect compliance as the baseline. A single omission stands out starkly against a perfect record, signaling a *regime change* rather than a *random shock*.
      *   *Prediction:* Relationships with a "messy" history of minor, verified hiccups that were successfully repaired are *more* robust to major shocks than relationships with a "perfect" history. The messy history proves the repair machinery works.

  **B. Common Priors on Vulnerability**
  *   The single biggest predictor is whether both sides share a model of the environment.
  *   **Survival:** Both sides believe "Bridges break here sometimes." (High prior on $P(\text{shock})$).
  *   **Unraveling:** Side A knows bridges break; Side B assumes bridges hold. Side B updates their belief on Side A's *type* (from Cooperative to Defector) rather than the *state* (from Passable to Impassable).
  *   *Empirical Test:* Look for pre-existing discourse about logistics/terrain. If the ceasefire agreement included "logistical contingencies," they survive. If it was purely political, they unravel.

  **C. Redundancy in Signaling**
  *   Survival depends on **Out-of-Band Signaling**. If the money guy is stuck, can the radio guy still talk? If the shock disables *both* the cooperative move and the communication channel, the Trap is almost inescapable.
  *   *Predictor:* Relationships with multiple, independent channels of communication survive Incapacity Traps.

  ### 5. Why Your Department Story Fits (and Hurts)

  Your co-author story is a textbook case.
  *   **The Shock:** Family emergency (Exogenous, arguably unverifiable without intrusion).
  *   **The Omission:** Missed deadline.
  *   **The Interpretation:** You read it as "They don't value this project" (Defection). They read it as "Life happened" (Incapacity).
  *   **The Clean Ledger:** You feel you were abandoned (Aggrieved). They feel you were unsympathetic (Aggrieved).
  *   **The Cheap Talk:** "Family emergency" is the academic equivalent of "The bridge is out." It is impossible to verify without violating norms of privacy. It is indistinguishable from "I got a better offer and prioritized that."
  *   **The Failure:** There was no **Third-Party Adjudication**. In a firm, a manager decides. In a ceasefire, a UN observer might decide. In academia, there is no judge. Without a judge to verify the Force Majeure claim, the relational contract defaults to the Security Dilemma.

  ### 6. Suggested Terminology for Your Dissertation

  If you need a label to hang your chapter on, I recommend **"The Compliance Ambiguity Spiral."**

  *   **Why:** It captures the core mechanism (Ambiguity between Incapacity and Intent) and the outcome (Spiral).
  *   **Distinction:** It distinguishes itself from "Security Dilemma" (which is about capabilities) and "Noise" (which is about execution errors).
  *   **Usage:** "Local ceasefires often fail not because of commitment problems, but due to **Compliance Ambiguity Spirals**, where exogenous logistical failures are indistinguishable from political defection."

  **Summary of the Carving:**
  This is not a Security Dilemma (active defense read as offense).
  This is not standard Noise (execution error).
  This is **Imperfect Monitoring of Capacity** leading to **Adverse Selection on Type**.
  The "Clean Ledger" feature is the result of **Fundamental Attribution Error** (Party B attributes situational failure to Party A's disposition) combined with **Cheap Talk Constraints** (Party A cannot prove the situation).

  It is a distinct failure mode of informal enforcement, and naming it as such will be a genuine contribution to the literature.
