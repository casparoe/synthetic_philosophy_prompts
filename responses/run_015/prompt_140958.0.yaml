answer: |-
  Thank you for coming. Hugh left specific instructions for this day. Among them was a prohibition: no speaker is to use the phrase "agreeing to disagree." This was not out of piety. It was because we both held that the phrase names an impossibility, not an achievement. To use it would be to falsify the record.

  For thirty-one years, Hugh and I argued. It began with letters, then moved to print. The subject was whether the agreement results in formal epistemology have any teeth. Hugh held that a shared prior is a genuine coherence constraint; that persisting disagreement between peers is a symptom to be diagnosed and repaired. I held that the common prior assumption does all the work, that it is satisfied almost nowhere outside a model, and therefore that the theorem is a consistency check on ideal agents rather than a rebuke to actual ones.

  Neither of us ever moved.

  By the end, we had each, independently, assigned a probability of 0.95 to the proposition that we would still be disagreeing in ten years. That is the only number we ever agreed on.

  I want to say something about what that number was, and what it was not. For those in this room who work with the bounds: we ended about two percentage points apart. The approximate versions of the result, with priors that are close rather than identical, bound the gap without closing it. Two points is not zero. We did not converge.

  But for those who do not work with these models, I want to suggest that this state has a name. I call it concordance without consensus. It is possible to hold exactly the same posterior for one event while being disposed to move in opposite directions on the next piece of evidence. What is pooled is the number, rather than the information behind it.

  For his family, and for his friends from the village: do not hear this as a failure to connect. It is not a consolation prize. It is an acknowledgment that two people can stand at the same window, count the same birds, and yet expect them to fly in different directions. We trusted the count more than we trusted the flight. That shared trust was the connection.

  There is a property of rational belief that says a shared prior today is entirely compatible with expecting to be disagreed with tomorrow. Each of us expects his own future opinion to average out to his own present one. If I expect you to change your mind, I should change it now. So the honest form of words is not that we settled into a stable difference, but that we agreed, right now, and expected to be carried apart by whatever came next.

  I want his daughters to hear this not as detachment, but as devotion. To expect we would drift was to respect the integrity of the other's eyes. To demand we match would have been to demand we stop looking. He trusted that I would follow my own evidence, and I trusted him to follow his. The distance between us was the measure of the seriousness with which we took the world.

  In thirty-one years, we never once bet each other. Not even a bottle of wine. In our field, a bet is the standard test of sincerity. But we understood that the offer itself would have been the evidence. To propose a wager would have been to signal that I thought his probability was mistaken enough to be exploited. We did not exploit each other. We witnessed each other.

  There is a result, proved for finite sets of possibilities by Geanakoplos and Polemarchakis, that agents who honestly announce their posteriors to one another, over and over, must after finitely many rounds announce the same number. We announced ours to each other for thirty-one years and never did.

  So one of the conditions failed. The space of possibilities was not finite, or something was lost in transmission between us, or one of us was not reporting the number he actually had. I do not get to say which. I only note that the theorem holds, and we did not converge, and the gap remained until the end.

  You will hear a talk shortly by Hugh's last doctoral student, who will argue that Hugh's final papers effectively conceded this dispute to me. I will listen to that argument as closely as you. I will not foreclose it here, nor will I fight it. The work remains; the interpretation is now yours.

  Hugh was not only a mind that worked on constraints and priors. He was a man who kept bees. He ran the choir in the village where he lived. [Insert brief memory of Hugh with bees/choir if known, e.g., "I remember him telling me once about the silence required to work the hives..."] Those who knew him there knew a man who understood harmony not as unison, but as distinct voices holding a structure together.

  He loved this work. He loved this village. He was loved here, and he was taken seriously in the place where he spent his working life. That is not a small thing.

  We did not converge. We did not bet. We did not use the forbidden phrase. But for thirty-one years, when I sent a letter, I knew exactly who would read it, and how carefully. And he knew the same of me. In a field dedicated to the conditions under which minds meet, we found a different way to be together. We held the line. We kept the count. And we let the birds fly.

  Thank you.

  ***

  **Note on Load-Bearing Sentences**

  1.  **"To expect we would drift was to respect the integrity of the other's eyes."**
      *   *Non-specialists:* Hear a commitment to individual autonomy and mutual respect within a relationship.
      *   *Specialists:* Hear the martingale property of posterior expectations (I cannot predict the direction of your update, only that it will be an update).
      *   *Risk in Grief:* This sentence requires a steady voice. If I choke here, the "respect" sounds like resentment, and the technical claim about expectations collapses into emotional distance.

  2.  **"The offer itself would have been the evidence."**
      *   *Non-specialists:* Hear that betting would have damaged the friendship or implied mistrust.
      *   *Specialists:* Hear the no-speculation theorem implication—that if we differ, one of us must think the other is irrational, making the bet offer itself a signal of perceived irrationality.
      *   *Risk in Grief:* If read too sharply, it sounds like a critique of Hugh's rationality. If read too softly, the logical force is lost, and it becomes mere sentimentality.

  3.  **"One of the conditions failed... I do not get to say which."**
      *   *Non-specialists:* Hear a mystery about why two friends couldn't resolve their argument.
      *   *Specialists:* Hear the specific failure modes of the Geanakoplos-Polemarchakis convergence theorem (finite state space, common knowledge of posteriors, honesty).
      *   *Risk in Grief:* This is the most dangerous moment. The implication that "one of us was not reporting the number he actually had" touches on honesty. If my voice wavers, it sounds like an accusation of dishonesty against the dead, or a confession of my own. It must be read as a logical necessity, not a moral judgment.
