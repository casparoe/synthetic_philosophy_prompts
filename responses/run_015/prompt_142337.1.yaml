prompt: |-
  I'm on the benefits committe at work — there's five of us, at a company of about 70 people, and we're the ones who decide what our self-funded health plan actually pays for. The plan document is from like 1994 and says it covers treatment of disease or injury and doesn't cover cosmetic, lifestyle, or elective enhancement stuff. Years ago our broker told us to write ourselves a one sentence test for what counts as a disease, because otherwise we'd argue about it forever. The test we came up with, and have used ever since, is basically this: it's a medical problem if some part of you is working worse than it normally works in a healthy person of your age and sex, and it's causing you real trouble.

  I always thought that was pretty reasonable. This month we had three appeals and now I think it's either wrong or I'm applying it wrong, and I keep flip-flopping between the two.

  1) Marcus, 58, drives a forklift. His testosterone came back in the low-normal range for men his age. He says he's wiped out all the time, no sex drive, can't concentrate. His doctor put him on replacement therapy and he says he got his life back. We denied it: nothing in him is working worse than normal, he's just getting older. But his supervisor says Marcus is a different guy since the shots. His age is doing all the work in that sentence and I don't know why age gets to do that.

  2) Priya, 34, in accounting. Her husband died in a crash seven weeks ago. She's sleeping three hours a night, lost a lot of weight, can't get through a spreadsheet, and she's asking for short term disability plus coverage for an intensive outpatient program. Our behavioral health vendor says this is normal grief, not a diagnosis, so the program isn't covered; the disability people say they can't approve leave without a diagnosed condition. She's obviously in real trouble and I can't point to anything in her that's malfunctioning.

  3) Sam, 41, warehouse. Type 2 diabetes, heavy, drinks most nights, needs bariatric surgery. One of our members said flat out that this isn't a disease, it's a lifestyle, and we shouldn't pay for it. Same guy voted yes last month on knee surgery for someone who blew out his knee playing pickup basketball. When I pointed that out he said that's different, you can't help getting hurt playing ball. I have no idea whether that's a real distinction or if we're just punishing Sam.

  On top of all this, Denise on the committee wants to change the test from a healthy person of your age and sex to someone like us, because most of the warehouse works night shift and half of us are carrying extra weight, and if we say healthy person then suddenly everybody's sick. I feel like that makes things worse, not better, but I can't say why.

  So: is there a better one sentence test? Or is the whole idea of a one sentence test hopeless, and if it is, what do I actually say at the meeting on Thursday?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Situation:**
      *   **Role:** Member of a 5-person benefits committee at a self-funded company (70 employees).
      *   **Task:** Decide coverage for health plan appeals.
      *   **Current Policy:** Plan document from 1994 (covers disease/injury, excludes cosmetic/lifestyle/elective).
      *   **Current Test:** "It's a medical problem if some part of you is working worse than it normally works in a healthy person of your age and sex, and it's causing you real trouble."
      *   **Current Crisis:** Three specific appeals (Marcus, Priya, Sam) are challenging the validity/application of the test.
      *   **Internal Conflict:** Denise (committee member) wants to change the reference class from "healthy person" to "someone like us" (normative based on the specific workforce).
      *   **Goal:** Determine if there's a better one-sentence test, or if the concept is flawed, and provide actionable advice for the Thursday meeting.

  2.  **Evaluate the Current Test:**
      *   *Strengths:* Simple, intuitive, focuses on function and distress.
      *   *Weaknesses:*
          *   "Age and Sex" normalization (Marcus): Validates decline as "normal" even if treatable. Medicalizes aging vs. treating symptoms.
          *   "Working worse" (Priya): Grief isn't a malfunction, it's a reaction. The test fails on psychosocial stressors that become disabling.
          *   "Lifestyle" ambiguity (Sam): Blames the patient for etiology rather than focusing on current pathology. Inconsistent application (knee vs. obesity).
          *   "Healthy person" reference (Denise's objection): If the workforce is unhealthy, does "healthy" become relative? (The "Boiling Frog" problem).

  3.  **Analyze the Three Cases:**
      *   **Marcus (Testosterone):** The test failed because "low-normal for age" was equated with "healthy for age." Medicine often treats symptoms, not just deviations from a statistical mean. *Issue: The test conflates statistical normality with health.*
      *   **Priya (Grief):** The test failed because grief isn't a "part working worse." It's a normal response to abnormal events. However, it causes "real trouble" (disability). *Issue: The test is too mechanistic/biological for psychological/social suffering.*
      *   **Sam (Obesity/Surgery):** The test failed because of moral judgment on etiology ("lifestyle"). Diabetes is a disease regardless of cause. Knee injury is also often "lifestyle" (sports). *Issue: The test invites moralizing about cause rather than assessing current medical necessity.*

  4.  **Evaluate Denise's Proposal:**
      *   *Proposal:* Change reference class to "someone like us" (night shift, extra weight).
      *   *Problem:* This lowers the bar for health to the lowest common denominator. If everyone has high blood pressure, is high blood pressure no longer a disease? This creates a "race to the bottom" for health standards and increases long-term costs/risk for the self-funded plan.
      *   *Verdict:* She is right that "healthy person" is vague, but wrong about the solution. The reference should be *medical* health, not *workforce* norms.

  5.  **Develop a Better Test (or Strategy):**
      *   *Can a one-sentence test work?* Probably not for *all* edge cases. Medicine is too complex. A heuristic is useful, but a rigid rule is dangerous.
      *   *Alternative:* Shift from "Is this a disease?" to "Is this medically necessary treatment for a condition causing impairment?"
      *   *Better Heuristic:* Focus on **Medical Necessity** and **Functional Impairment**, removing the "normal for age" and "lifestyle" judgments.
      *   *Proposed Test:* "Does a licensed provider recommend this treatment to resolve a diagnosed condition that significantly impairs daily function or risks serious health deterioration?"

  6.  **Drafting the Advice:**
      *   **Validate:** Acknowledge the difficulty. This is hard stuff. The 1994 document is a liability.
      *   **Diagnose the Test:** Explain *why* the current test is failing (Statistical Normality $\neq$ Health; Grief $\neq$ Malfunction; Etiology $\neq$ Coverage).
      *   **Address Denise:** Explain why "someone like us" is dangerous for a self-funded plan (adverse selection, normalizing sickness).
      *   **Address the Cases:**
          *   Marcus: Symptoms + Treatment Response > Lab Reference Range.
          *   Priya: Grief can become a disorder (Persistent Complex Bereavement Disorder) or justify disability via functional impairment even without a specific ICD code immediately.
          *   Sam: Obesity is a disease (AMA classification). Cause doesn't negate coverage (like smoking/lung cancer).
      *   **The Thursday Meeting Strategy:**
          *   Don't just propose a new sentence. Propose a *process*.
          *   Suggest relying on external medical criteria (MCG, InterQual) rather than committee intuition.
          *   If sticking to a test, refine it to focus on *impairment* and *medical necessity*.
      *   **The "One Sentence" Option:** If they insist, offer a tighter version.
      *   **The "Real Talk" Option:** Admit the test is broken and move to guidelines.

  7.  **Refining the Output:**
      *   *Tone:* Empathetic, professional, practical, slightly authoritative (you are the expert here).
      *   *Structure:*
          1.  Direct answer (The test is broken).
          2.  Why it's broken (Analysis of the 3 cases).
          3.  Why Denise is wrong (The reference class problem).
          4.  The Better Test (Draft).
          5.  The Better Process (What to actually say Thursday).
      *   *Key Insight:* The committee is acting as a claims adjudicator without medical training. They need to defer to medical standards, not philosophical definitions.

  8.  **Self-Correction/Edge Case Check:**
      *   *Wait, self-funded plan:* They have fiduciary responsibility. They can't just pay for everything. They need defensible denials too.
      *   *Priya's case:* Short term disability usually requires a doctor's note. If the doctor says she can't work, that's often enough, even if "grief" isn't a disease. The vendor is being rigid.
      *   *Marcus:* TRT is controversial. But if symptoms align and labs are low-normal, many urologists treat. The committee shouldn't practice medicine.
      *   *Sam:* Bariatric surgery has strict criteria (BMI + comorbidities). If he meets them, it's covered. If not, it's not. It shouldn't be a moral vote.

  9.  **Final Polish:** Ensure the distinction between "Health Plan" (paying claims) and "Disability" (income replacement) is clear, though they often overlap in committee purview. Emphasize that the 1994 document is the root cause.

  *(Self-Correction during drafting)*: I need to make sure I don't give legal advice. I am an AI. I should frame this as strategic/operational advice based on benefits administration best practices.

  *(Final thought on the "One Sentence Test")*: The quest for a one-sentence test is the trap. The advice should be "Abandon the one-sentence test, adopt a medical necessity standard." But I will provide a better sentence if they insist.

  Let's structure the response to first validate their struggle, then dismantle the current logic, then offer the Thursday script.

  *Plan:*
  1. Validate: You are right to be worried.
  2. Diagnosis: Why the current test fails (The 3 traps).
  3. Denise's Point: Why "someone like us" is dangerous.
  4. The Solution: A new standard (Medical Necessity).
  5. Thursday Script: What to say.
  6. The New Sentence (if forced).
  7. Long-term fix (Update the SPD).

  *Wait, one nuance:* The user asked "Is there a better one sentence test?" I should answer that directly. "No, but here's a better one that focuses on necessity." Actually, the honest answer is "The idea is hopeless." I need to balance that. I'll say "The *current* sentence is hopeless, a *different* sentence helps, but a *process* is best."

  Okay, ready to write.
answer: |-
  You are right to be worried. The short answer is: **The one-sentence test is hopeless.**

  It was a clever hack for 2005, but it is actively failing you in 2024 because it asks a benefits committee to practice philosophy and medicine without a license. Your current test conflates *statistical normality* with *health*, and *etiology* (cause) with *eligibility*.

  Here is the breakdown of why your current test is breaking, why Denise's suggestion is dangerous, and exactly what you should say on Thursday.

  ### 1. Why the current test is failing
  Your test has three specific traps, and your three appeals fell into each one perfectly.

  *   **The Marcus Trap (Statistical Normality $\neq$ Health):**
      Your test asks if a part is working worse than a "healthy person of your age." This assumes that declining health is an inevitable, non-treatable part of aging. It isn't. "Low-normal" testosterone with severe symptoms is a clinical condition (hypogonadism), even if the lab range says it's "normal for age." By denying this, you aren't saving money; you are paying for Marcus's continued fatigue, lack of concentration, and potential safety risks on a forklift. You are prioritizing a lab reference range over functional improvement.
  *   **The Priya Trap (Mechanistic $\neq$ Human):**
      Your test looks for a part "working worse." Grief is not a malfunction; it is a normal response to loss. However, *disabling* grief is a health event. By requiring a "diagnosis" for something that is visibly disabling, you are forcing a square peg into a round hole. She has "real trouble" (the second half of your test), but you can't find the "malfunction." This is because you are looking for a broken part instead of looking for **functional impairment.**
  *   **The Sam Trap (Cause $\neq$ Coverage):**
      Your test excludes "lifestyle." This invites moral judgment. Type 2 diabetes is a disease, regardless of whether it was caused by genetics, poverty, stress, or diet. If you cover knee surgery for basketball (a voluntary leisure activity) but deny bariatric surgery for obesity (a chronic disease recognized by the AMA), you are being inconsistent. You are punishing Sam for the *cause* of his illness rather than assessing the *necessity* of the treatment.

  ### 2. Why Denise is wrong (but right about the problem)
  Denise is right that "healthy person" is vague. She is wrong that "someone like us" is the solution.

  If your workforce is predominantly night-shift and overweight, defining health relative to *them* creates a "race to the bottom." If 60% of your warehouse has high blood pressure, does high blood pressure cease to be a covered condition? For a self-funded plan, this is financially dangerous. You want to return people to *health*, not normalize *sickness*. If you lower the bar to "someone like us," you increase long-term claims costs because you stop treating chronic conditions until they become emergencies.

  ### 3. The Thursday Meeting Strategy
  You cannot fix the 1994 plan document on Thursday. But you can change how the committee interprets it. Do not go in trying to win a philosophical debate. Go in with a procedural fix.

  **The Script:**
  > "I've been reviewing our denials against our test, and I think we're exposing the company to risk. Our current test asks us to define 'disease,' which makes us practice medicine without a license.
  >
  > In the Marcus case, we denied treatment that restored function. In Priya's case, we denied care for someone clearly unable to work. In Sam's case, we applied a moral standard to a chronic disease that we don't apply to sports injuries.
  >
  > If any of these three sue or file a DOL complaint, our defense is: 'We guessed.' That's not defensible.
  >
  > I propose we suspend the one-sentence test immediately. Instead, for all appeals, we adopt a **Medical Necessity Standard**: *We cover treatment that is recommended by a licensed provider to resolve a diagnosed condition that significantly impairs daily function or risks serious health deterioration.*
  >
  > If a doctor says it's medically necessary, and it fits the clinical criteria (like MCG or InterQual guidelines), we default to coverage. We are a benefits committee, not a medical board. We should rely on their standards, not ours."

  ### 4. If they insist on a sentence...
  If the committee refuses to drop the "one sentence" idea (committees love rules), offer this replacement. It shifts the focus from *what is normal* to *what is necessary*.

  > **"We cover treatment when a licensed provider certifies it is medically necessary to restore function or prevent serious health deterioration, regardless of age, lifestyle, or statistical norms."**

  **Why this works better:**
  *   **Marcus:** It covers "restoring function" (he got his life back) rather than "fixing a broken part."
  *   **Priya:** It covers "prevent serious health deterioration" (grief turning into major depression/suicide risk) and relies on the provider's certification.
  *   **Sam:** It explicitly removes "lifestyle" as a disqualifier, focusing on the medical necessity of the surgery for the diabetes.
  *   **Denise:** It keeps the standard at "health," not "workforce norms."

  ### 5. The Long-Term Fix
  Your Plan Document is from 1994. That is a legal and financial time bomb. Terms like "cosmetic, lifestyle, or elective enhancement" are outdated. Modern plans use specific exclusions (e.g., "Weight loss programs are excluded, but bariatric surgery for BMI > 40 with comorbidities is covered").

  **Your action item:** Tell the committee that your goal for the next quarter is to hire a consultant to update the Summary Plan Description (SPD). You cannot run a 2024 company on a 1994 rulebook.

  **Summary for Thursday:**
  1.  Admit the current test is broken (cite the three cases).
  2.  Reject Denise's "normative" standard (it costs money long-term).
  3.  Propose the **Medical Necessity** standard above.
  4.  Remind them: **We are payers, not doctors.** If a doctor says it's necessary and standard care, our job is to check if it's in the plan, not if we agree with the biology.
