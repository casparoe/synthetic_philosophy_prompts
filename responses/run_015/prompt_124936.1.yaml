prompt: |-
  I am writing the specification for the belief-revision component of a deployed tracking system, and I want the specification settled before I look at candidate rules. The component keeps a probability distribution over the cells of a finite grid in which an unobserved asset might be located, and revises that distribution as reports arrive. The reports are almost never statements of fact: they arrive as constraints. The odds are three to one that the asset is north of the river. If it is in the northern sector, then there is a seventy percent chance it is east of the treeline. Something of that shape. So what I need is a rule for updating on conditional and otherwise uncertain evidence: a function that takes a prior and a report and returns a posterior. What I want from you is the statement of what such a rule has to do to count as adequate, not a survey of the rules on offer.

  Purpose first, since adequacy is relative to it. This rule will run inside software, unattended, on a stream of reports of varying provenance, over a state space that an engineer may refine next year. So the properties I care about are determinacy, meaning one answer with no ties broken by hand; robustness to the bookkeeping of the stream, meaning duplicated reports, reordered reports, and reports that arrive in a batch rather than one at a time; indifference to arbitrary modelling choices, meaning how finely the grid is drawn and which of two equivalent formulations a report is written in; and freedom from the pathologies that a downstream decision rule could exploit, whether or not anyone is deliberately exploiting them. I do not care whether the rule reproduces anyone's seminar intuition except as defeasible evidence.

  The case I will keep returning to is a Judy Benjamin style one, in a four-cell grid formed by crossing north/south with west/east. The prior is 0.30 in the north-west cell, 0.20 in the north-east cell, 0.20 in the south-west cell, and 0.30 in the south-east cell. A report arrives whose content is exhaustively captured by saying that, afterwards, the probability of north should be 0.75. Three demands that sound equally principled give three different answers here. Preserving the conditional distribution within each row, three to two in the northern row and two to three in the southern, pins down a unique posterior. Preserving the west/east margin at one half leaves a one-parameter family, and entropy maximization is one way of selecting from it. Minimizing a divergence from the prior selects yet another posterior, and which one depends on the divergence and on the direction it is taken in. I want to know which of these demands is genuine and which is the prejudice of a camp, and I want the argument to be about the case rather than about the label.

  Here are the further cases and the demand each is meant to test, several of them situation-specific to my system. First, a report that pins a single cell, where I take it to be non-negotiable that the rule reduce to ordinary conditioning. Second, the case above, where a report constrains one partition and is silent about an orthogonal one, and where the two partitions are correlated in the prior rather than independent: here the notion of silence becomes hard to cash out, and I want to know whether silence should be understood as preservation of a conditional distribution, preservation of a margin, or something else. Third, the same report arriving over a channel that is known to be accurate eighty percent of the time, which raises the question of whether the update should be a mixture and whether mixing commutes with the update. Fourth, the same report arriving twice, which tests idempotence. Fifth, two reports arriving in one order and then the other, which tests order-independence, and which also tests whether a batched version of the rule exists at all. Sixth, learning with certainty, after the conditional report, that its antecedent is false, and then learning that the report was fabricated altogether: these test whether the rule is dynamically coherent, whether earlier constraint-based updates can be undone by later factual ones, and whether the rule is representable as conditioning on some event in a refinement of the state space. Seventh, splitting one cell of the grid into two subcells without changing anything else and running the rule again, which tests whether the answer depends on how the grid is drawn. Eighth, a report whose antecedent has prior probability zero, of the form that if the bridge had been out the asset would be on the east bank, where conditioning on the report as a proposition is unavailable or trivial, and where something like imaging or a nearest-possible-world shift may be the only option. Ninth, a channel that only reaches assets in the northern half, so that receiving a report, or failing to receive one, is itself evidence, and so that the report is addressed to one asset among many: this tests whether the rule is answerable for selection effects or whether that belongs to a separate component that models the channel.

  There is also a distinction I want the specification to make explicitly. A report can be read as a constraint on the posterior credence function, telling me what my probability of north given south, or whatever it is, ought to become; or it can be read as telling me that a conditional proposition is true, which I might then conditionalize on. I want the specification to say which reading the rule is modelling, and to say whether the familiar triviality considerations, of the sort that make it hard for any proposition to have as its probability the corresponding conditional probability, rule the second reading out or merely constrain it.

  What I want back is the requirements list, each requirement paired with the case that motivates it and with a statement of why that case has the force it does. Mark which requirements are non-negotiable given the purpose above and which are preferences of a camp: minimality of change under one metric rather than another, entropy maximization, preservation of the unmentioned margin, order-independence, idempotence, invariance under refinement of the state space, representability as conditioning in some enrichment, convexity and uniqueness of the optimization, continuity in the prior and in the report, immunity to diachronic exploitation, approximability by a sequence of Jeffrey revisions, and any I have not thought of. Tell me whether some subset of the requirements is jointly unsatisfiable, since that is the part I most want: if the list cannot all be had together, the list itself is the result, and I would rather know now than after I have built to it. Tell me which single requirement excludes the largest part of the space of candidate rules. Finally, and briefly, since I will do the scoring myself against my own shortlist, indicate how the standard families fare: conditioning on the most probable report, Jeffrey revision with rigidity, relative-entropy projection in each of its two directions, maximum entropy subject to the constraint, an imaging-style revision, and the treatment of the report as a proposition about a conditional.
reasoning: |-
  Here's a thinking process that leads to the suggested specification requirements:

  1.  **Deconstruct the Request:**

      *   **Goal:** Write a specification for the *belief-revision component* of a deployed tracking system.
      *   **Context:** Software system, unattended, stream of reports (constraints, not facts), finite grid state space (subject to refinement).
      *   **Input:** Prior probability distribution + Report (constraint on posterior).
      *   **Output:** Posterior probability distribution.
      *   **Key Constraints/Properties Desired:**
          *   Determinacy (unique answer).
          *   Robustness to bookkeeping (duplication, reordering, batching).
          *   Indifference to modelling choices (grid granularity, equivalent formulations).
          *   Freedom from pathologies (exploitation by downstream decision rules).
          *   *Not* about seminar intuition, but about functional adequacy.
      *   **Specific Test Cases Provided:**
          1.  Pinning a single cell (must reduce to conditioning).
          2.  Judy Benjamin style (constraint on partition, silence on orthogonal).
          3.  Noisy channel (80% accurate) -> Mixture? Commutativity?
          4.  Duplicate report (Idempotence).
          5.  Reordered reports (Order-independence/Commutativity).
          6.  Dynamic coherence (Learning antecedent false later, learning report fabricated).
          7.  Grid refinement (Splitting a cell).
          8.  Zero-probability antecedent (Counterfactuals/Imaging).
          9.  Selection effects (Channel only reaches North).
      *   **Conceptual Distinction:** Constraint on posterior vs. Truth of a conditional proposition (Lewis's triviality results).
      *   **Deliverable:** A requirements list.
          *   Pair each requirement with the motivating case.
          *   Explain *why* the case has force.
          *   Mark as **Non-Negotiable** (given the purpose) or **Preference/Camp**.
          *   Identify **Incompatibilities** (Jointly unsatisfiable sets).
          *   Identify the **Most Exclusionary** requirement.
          *   Briefly score standard families (Conditioning, Jeffrey, MinEnt, etc.) against the requirements.

  2.  **Analyze the "Purpose" and "Non-Negotiables":**

      *   *Purpose:* Deployed software, unattended, stream processing, engineering refinement.
      *   *Implication:* The system *must* work reliably without human intervention. It cannot crash (determinacy). It cannot give different results based on network latency (order-independence/batching). It cannot break if the engineer changes the grid resolution (refinement invariance). It cannot be gamed (diachronic coherence).
      *   *Therefore:* Properties like Determinacy, Order-Independence, Idempotence, Refinement Invariance, and Reduction to Conditioning (for certain evidence) seem Non-Negotiable for a *system specification*, even if philosophers debate them.
      *   *However:* The prompt asks me to distinguish between what is genuinely required by the *purpose* vs. what is a *camp preference* (e.g., MinEnt vs. MinCrossEntropy).
      *   *Crucial Realization:* Many of these desiderata are mathematically incompatible. Specifically, Order-Independence (Commutativity) and Reduction to Conditioning (or specific handling of constraints) often clash depending on the geometry of the constraints. The "Judy Benjamin" problem is the classic example where Intuition (preserve conditionals) clashes with Algebra (Jeffrey conditioning preserves odds ratios, MinEnt preserves margins differently).

  3.  **Drafting the Requirements (Iterative Process):**

      *   *Req 1: Determinacy.* System needs one answer. (Non-negotiable).
      *   *Req 2: Certainty Reduction.* If report says "Cell X is true", must match Bayesian Conditioning. (Non-negotiable, otherwise it contradicts logic).
      *   *Req 3: Idempotence.* Same report twice = same as once. (Non-negotiable for stream processing).
      *   *Req 4: Order Independence.* Report A then B = Report B then A. (Non-negotiable for network robustness). *Wait, is this possible with constraints?* If constraints are inconsistent, order matters for resolution. If consistent, Jeffrey conditioning commutes, but general constraint satisfaction might not.
      *   *Req 5: Refinement Invariance.* Splitting a cell shouldn't change probabilities of unsplit cells. (Non-negotiable per prompt's "indifference to arbitrary modelling choices").
      *   *Req 6: Dynamic Coherence.* Ability to undo/reverse or handle "report was fake". (This is hard. If I update on a constraint, can I "condition" on the constraint being false later? This relates to representability as conditioning).
      *   *Req 7: Zero-Proband Antecedents.* Handling "If P then Q" where P is impossible. (This requires Imaging, not standard conditioning).
      *   *Req 8: Constraint vs. Proposition.* The prompt asks to specify which reading is used. Given "reports are almost never statements of fact... they arrive as constraints", the specification *must* adopt the Constraint reading to avoid Lewis's Triviality.

  4.  **Identifying Incompatibilities (The Core Conflict):**

      *   *The Judy Benjamin Problem:*
          *   Demand A: Preserve conditional probabilities within the constrained partition (Intuition: "Silence" means "don't change what you know about East/West given North").
          *   Demand B: Preserve the marginal of the orthogonal partition (Intuition: "Silence" means "don't change the total probability of East/West").
          *   Demand C: Minimize Information Gain (MinEnt/MinXEnt).
          *   *Conflict:* You generally cannot satisfy A, B, and C simultaneously.
          *   *System Requirement:* The prompt asks for "Robustness to bookkeeping" (Order Independence) and "Indifference to modelling choices" (Refinement).
          *   *Major Theorem:* **Commutativity (Order Independence) and Refinement Invariance are often in tension with specific constraint interpretations.**
          *   *Specifically:* **Jeffrey Conditioning** commutes and is idempotent but fails the "Judy Benjamin" intuition (it preserves odds ratios, not conditionals, and changes orthogonal margins). **Minimum Cross-Entropy (MinXEnt)** satisfies the constraint but generally does *not* commute if constraints overlap in complex ways, and it is sensitive to parameterization (refinement).
          *   *The "Killer" Incompatibility:* **Order Independence (Commutativity) + Reduction to Conditioning + General Constraint Handling.**
          *   Actually, the strongest incompatibility in this domain is usually between **Commutativity** and **Refinement Invariance** (parameterization dependence of entropy), or between **Commutativity** and **Preservation of Conditionals** (Judy Benjamin).
          *   *Wait, let's look at the "Purpose":* Unattended software. If Order Independence fails, the system is non-deterministic based on network latency. This is a bug. So Order Independence is Non-Negotiable.
          *   If Refinement Invariance fails, the engineer changes the grid and the tracker behaves differently. This is a bug. So Refinement Invariance is Non-Negotiable.
          *   *Problem:* Most entropy-based methods (MinEnt/MinXEnt) are *not* refinement invariant (they depend on the measure/count of states).
          *   *Problem:* Jeffrey Conditioning *is* refinement invariant (if defined on the partition) and commutes, but it cannot handle general conditional constraints (like "If North, then 70% East") without converting them to partition constraints, which leads to the Judy Benjamin paradox.

      *   *Re-evaluating "Non-Negotiable":* The prompt asks me to tell them if the list is jointly unsatisfiable. I suspect it *is*. I need to be honest about that. The "Judy Benjamin" case specifically highlights that "Silence" is ambiguous. You cannot have a rule that preserves conditionals *and* preserves margins *and* minimizes divergence *and* commutes.

  5.  **Structuring the Response:**

      *   **Introduction:** Acknowledge the tension. The specification defines the *contract*, not the implementation, but the contract must be mathematically possible.
      *   **The Requirements List:** Grouped by category (Operational, Logical, Structural).
      *   **Classification:** Mark Non-Negotiable (System Integrity) vs. Preference (Epistemic Stance).
      *   **The Incompatibility Analysis:** This is the most valuable part. Highlight the "Impossible Trinity" of Belief Revision (Commutativity, Refinement Invariance, Constraint Satisfaction).
      *   **The "Most Exclusionary" Requirement:** Likely Order-Independence or Refinement Invariance.
      *   **Scoring the Families:** Briefly map Conditioning, Jeffrey, MinXEnt, MinEnt, Imaging against the list.

  6.  **Refining the Requirements based on the Prompt's Specific Cases:**

      *   *Case 1 (Certainty):* **Reduction to Conditioning.** (Non-negotiable).
      *   *Case 2 (Judy Benjamin):* **Constraint Interpretation.** (Must choose Constraint over Proposition to avoid Triviality). **Handling of Silence.** (This is the camp preference).
      *   *Case 3 (Noisy Channel):* **Linearity/Mixing.** (Preference).
      *   *Case 4 (Duplication):* **Idempotence.** (Non-negotiable for streams).
      *   *Case 5 (Reordering):* **Commutativity.** (Non-negotiable for distributed/async systems).
      *   *Case 6 (Undoing/Fake):* **Reversibility/Coherence.** (Hard. Usually requires representing updates as conditioning on a larger space. Preference/High Bar).
      *   *Case 7 (Refinement):* **Partition Invariance.** (Non-negotiable per prompt "indifference to arbitrary modelling choices").
      *   *Case 8 (Zero Prob):* **Support Expansion.** (Non-negotiable for robustness).
      *   *Case 9 (Selection):* **Channel Separation.** (Non-negotiable architecture).

  7.  **Addressing the "Constraint vs. Proposition" Distinction:**
      *   Lewis's Triviality Results show you cannot treat "If A then B" as a proposition with probability $P(B|A)$ in a standard Boolean algebra without collapsing probabilities to 0 or 1.
      *   *Specification Decision:* The rule *must* treat reports as **Constraints on the Posterior** (Equation 1: $P_{new}(A) = k$), not as Propositions to be Conditioned on (Equation 2: $P_{new}(\cdot) = P_{old}(\cdot | \text{Report})$). This is Non-Negotiable for mathematical consistency.

  8.  **Finalizing the Incompatibility Warning:**
      *   The combination of **Commutativity**, **Refinement Invariance**, and **General Constraint Satisfaction (Judy Benjamin style)** is the danger zone.
      *   Specifically, **Minimum Cross-Entropy (MinXEnt)** satisfies constraints and reduces to conditioning, but fails Commutativity (generally) and Refinement Invariance (depends on the dominating measure).
      *   **Jeffrey Conditioning** satisfies Commutativity and Refinement Invariance, but cannot natively handle conditional constraints (like "If N, then 70% E") without arbitrary conversion to partition constraints, which violates the "Silence" intuition.
      *   **Maximum Entropy (MinEnt)** fails Refinement Invariance (counting states vs measure).
      *   *Conclusion:* The user needs to know they cannot have it all. They must prioritize *Operational Robustness* (Commutativity/Idempotence) over *Epistemic Intuition* (Judy Benjamin preservation), or vice versa. Given it's "deployed software", Operational Robustness usually wins, meaning they might have to accept counter-intuitive probability shifts in edge cases.

  9.  **Drafting the Content:** (Self-Correction during drafting)
      *   Make sure to explicitly answer "Which single requirement excludes the largest part of the space?" -> **Commutativity (Order-Independence)**. Most natural update rules (especially iterative projection methods) do not commute unless the constraints are orthogonal.
      *   Make sure to explicitly answer "Jointly Unsatisfiable". -> Yes.
      *   Ensure the distinction between "Constraint" and "Proposition" is clear.

  10. **Final Review against Prompt:**
      *   Did I provide the requirements list? Yes.
      *   Paired with cases? Yes.
      *   Marked Non-negotiable vs Preference? Yes.
      *   Identified incompatibilities? Yes.
      *   Identified most exclusionary? Yes.
      *   Scored standard families? Yes.
      *   Tone: Professional, specification-oriented, not philosophical hand-waving.

  (One final check on Refinement Invariance): If I split a cell with probability $p$ into two cells $p_1, p_2$, does the update rule yield the same marginal probability for the original region? MinXEnt is *not* invariant under refinement of the state space unless the reference measure is also refined consistently. Since the prompt says "engineer may refine next year" without implying they will update the reference measure, this is a critical failure point for entropy methods. Jeffrey conditioning *is* invariant if the partition is refined but the constraint remains on the coarser partition. This is a key differentiator.

  Let's assemble the response.cw
answer: |-
  This specification defines the functional contract for the Belief Revision Component (BRC). It prioritizes system integrity (determinacy, robustness) over epistemic intuition. The requirements are derived from the operational constraints of an unattended, streaming software system, not from philosophical consensus.

  ### 1. The Requirements List

  Each requirement is paired with the motivating case from your specification, classified as **Non-Negotiable** (system integrity) or **Preference** (epistemic stance), and justified by the operational risk of failure.

  | ID | Requirement | Motivating Case | Classification | Justification |
  | :--- | :--- | :--- | :--- | :--- |
  | **R1** | **Determinacy** | General Purpose | **Non-Negotiable** | The downstream decision rule cannot handle non-deterministic outputs or ties requiring human arbitration. The function $f(Prior, Report)$ must be single-valued. |
  | **R2** | **Reduction to Conditioning** | Case 1 (Pinning a cell) | **Non-Negotiable** | If a report asserts a fact with certainty (probability 1), the rule must mathematically collapse to standard Bayesian conditioning. Failure implies logical inconsistency with certainty. |
  | **R3** | **Idempotence** | Case 4 (Duplicate report) | **Non-Negotiable** | In a stream, packet retries or buffering may deliver identical reports twice. Updating twice on the same information must not alter the belief state further. |
  | **R4** | **Commutativity (Order Independence)** | Case 5 (Reordered reports) | **Non-Negotiable** | Network latency causes reports to arrive in arbitrary orders. The posterior must not depend on the arrival sequence of a set of reports. |
  | **R5** | **Partition Invariance (Refinement)** | Case 7 (Splitting a cell) | **Non-Negotiable** | Engineers may refine the grid resolution without changing the physical scenario. The probability assigned to a physical region must not change simply because it is represented by more cells. |
  | **R6** | **Support Expansion** | Case 8 (Zero-prob antecedent) | **Non-Negotiable** | The rule must assign non-zero probability to states ruled out by the prior if a report credibly suggests them (e.g., counterfactuals). Conditioning fails here (divides by zero); the rule must not crash or return undefined. |
  | **R7** | **Constraint Reading** | Conceptual Distinction | **Non-Negotiable** | Reports must be modelled as **constraints on the posterior** ($P_{new}(A) = k$), not as propositions to be conditioned on ($P_{new}(\cdot) = P(\cdot \mid \text{Report})$). Lewis's triviality results prove the latter is mathematically impossible for general conditional probabilities. |
  | **R8** | **Channel Separation** | Case 9 (Selection effects) | **Non-Negotiable** | The BRC must not model the *probability of receiving the report*. That belongs to the Channel Model. The BRC takes the report as given. Mixing channel reliability into the revision rule violates modularity. |
  | **R9** | **Preservation of Orthogonal Margins** | Case 2 (Judy Benjamin) | **Preference** | When a report constrains North/South but is silent on East/West, should the East/West margin stay fixed? This is an epistemic choice, not a logical necessity. |
  | **R10** | **Preservation of Conditionals** | Case 2 (Judy Benjamin) | **Preference** | When a report constrains North/South, should the ratio of probabilities *within* the North sector stay fixed? This conflicts with R9. |
  | **R11** | **Minimality of Change** | Case 2 (Judy Benjamin) | **Preference** | The posterior should be "closest" to the prior by some metric (Entropy, KL-Divergence, Euclidean). The choice of metric is a camp preference. |
  | **R12** | **Reversibility / Dynamic Coherence** | Case 6 (Undoing reports) | **Preference** | The ability to "undo" a constraint update by learning it was false. This requires the update to be representable as conditioning on a larger space. Highly desirable but mathematically restrictive. |

  ---

  ### 2. Incompatibility Analysis

  **The specification as written contains jointly unsatisfiable requirements.** You cannot satisfy R4 (Commutativity), R5 (Partition Invariance), and R11 (Minimality of Change via standard divergences) simultaneously while handling general constraints (Case 2).

  1.  **The Commutativity vs. Minimality Conflict:**
      *   Rules that minimize a divergence (like Cross-Entropy/MinXEnt) to satisfy constraints generally **do not commute** (violating R4) unless the constraints are on independent partitions. If Report A constrains $P(North)$ and Report B constrains $P(East \mid North)$, the order of projection matters.
      *   Rules that commute (like Jeffrey Conditioning) generally cannot handle conditional constraints (Case 2) without converting them into partition constraints, which forces a choice between R9 and R10.

  2.  **The Refinement vs. Entropy Conflict:**
      *   **R5 (Partition Invariance)** is fatal to **Maximum Entropy (MinEnt)** and **Minimum Cross-Entropy (MinXEnt)** methods. Entropy depends on the counting measure of the state space. If you split a cell into two sub-cells, the entropy of the distribution changes even if the physical probability mass is identical. Consequently, the "minimal change" solution shifts.
      *   To satisfy R5, the rule must be invariant under state-space refinement. Jeffrey Conditioning satisfies this; Entropy-based methods do not.

  3.  **The Judy Benjamin Trilemma (Case 2):**
      *   You cannot simultaneously satisfy:
          1.  The Constraint ($P(North) = 0.75$).
          2.  Preservation of Orthogonal Margins (R9: $P(East)$ stays 0.5).
          3.  Preservation of Conditionals (R10: $P(East \mid North)$ stays fixed).
      *   Mathematically, fixing the total mass of North and the total mass of East fixes the mass of North-East. You cannot *also* fix the ratio within North. You must choose one "silence" convention (R9 or R10) as a Preference, acknowledging it will violate the other.

  **Conclusion on Feasibility:**
  If you enforce **R4 (Commutativity)** and **R5 (Refinement Invariance)** as Non-Negotiable (which you should for deployed software), you eliminate almost all Entropy-based optimization rules. You are left with linear update rules (like Jeffrey Conditioning), which then force you to accept counter-intuitive results in the Judy Benjamin case (shifting orthogonal margins).

  ---

  ### 3. The Most Exclusionary Requirement

  **R4: Commutativity (Order Independence).**

  This requirement excludes the largest part of the candidate rule space. Most iterative belief revision methods (including iterative proportional fitting, sequential MinXEnt projection, and most neural belief updaters) are path-dependent. They converge to a solution only after multiple passes or depend on the sequence of constraints applied. Enforcing single-pass commutativity restricts you to a very small class of algebraic update rules (essentially variants of Jeffrey Conditioning or linear opinion pools).

  ---

  ### 4. Scoring Standard Families

  Here is how standard families fare against your **Non-Negotiable** requirements (R1–R8).

  | Rule Family | R1 (Determinacy) | R2 (Cond. Reduction) | R3 (Idempotence) | R4 (Commutativity) | R5 (Refinement) | R6 (Support) | R7 (Constraint) | Verdict |
  | :--- | :---: | :---: | :---: | :---: | :---: | :---: | :---: | :--- |
  | **Bayesian Conditioning** | Pass | Pass | Pass | Pass | Pass | **Fail** | **Fail** | **Rejected.** Fails on uncertain evidence (R7) and zero-prob events (R6). |
  | **Jeffrey Conditioning** | Pass | Pass | Pass | **Pass** | **Pass** | Pass | **Partial** | **Strong Candidate.** Satisfies operational robustness. Fails to natively handle conditional constraints (Case 2) without arbitrary conversion. |
  | **Min Cross-Entropy (MinXEnt)** | Pass | Pass | **Fail** | **Fail** | **Fail** | Pass | Pass | **Rejected.** Violates R4 (Order) and R5 (Refinement). Mathematically sensitive to grid granularity. |
  | **Max Entropy (MinEnt)** | Pass | **Fail** | **Fail** | **Fail** | **Fail** | Pass | Pass | **Rejected.** Does not reduce to conditioning. Violates R4 and R5. |
  | **Imaging (Lewis)** | Pass | Pass | Pass | **Fail** | Pass | **Pass** | **Partial** | **Mixed.** Good for counterfactuals (Case 8), but generally non-commutative and computationally expensive (requires similarity metric). |
  | **Linear Opinion Pool** | Pass | **Fail** | Pass | Pass | Pass | Pass | Pass | **Rejected.** Does not reduce to conditioning (mixes prior and report even if report is certain). |

  ### 5. Recommendation for the Specification

  To make the specification satisfiable, you must explicitly demote **R9, R10, and R11** to **Preferences** and acknowledge that **R4 and R5** take precedence.

  **Explicit Specification Clause:**
  > "In cases where reports constrain conditional probabilities (e.g., 'If North, then 70% East'), the rule shall prioritize **Commutativity (R4)** and **Partition Invariance (R5)** over the preservation of orthogonal marginals or internal conditional ratios. The system accepts that 'silence' on an orthogonal partition may result in marginal shifts to satisfy algebraic consistency across report streams."

  **Why:** In a deployed system, a bug that causes the tracker to output different locations because Network Packet A arrived before Packet B (R4 violation) is catastrophic. A bug that causes the probability of "East" to shift slightly when a "North" constraint is received (R9 violation) is an epistemic nuance. You must engineer for the former.

  **Final Warning:**
  If you require **R12 (Reversibility/Dynamic Coherence)**, you effectively force the system to implement **Conditioning on an Enriched Space**. This means every "constraint report" must be internally converted into a "factual report about a report" (e.g., instead of updating on $P(N)=0.75$, you update on "The Sensor said $P(N)=0.75$"). This is the only way to satisfy Case 6 (learning the report was fabricated). If you want this, the BRC is not a revision rule; it is a **Bayesian Network updater** where reports are nodes. This increases complexity but solves the coherence problem. If you stick to a direct revision function $Prior \to Posterior$, R12 is impossible.
