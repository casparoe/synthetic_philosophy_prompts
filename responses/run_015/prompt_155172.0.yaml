  2.  **Deconstruct the Categories (History vs. Legend vs. Myth):**
      *   *History:* Verifiable events, supported by contemporary evidence (archaeology, written records from the time), consensus among scholars.
      *   *Legend:* Rooted in some historical reality but heavily embellished over time. Hard to separate fact from fiction. Often focuses on a specific hero.
      *   *Myth:* Explains natural phenomena, origins, or religious truths. Often involves gods/supernatural. Not necessarily "false," but not historical in the modern sense.
