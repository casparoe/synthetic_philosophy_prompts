answer: |-
  Hey, don't worry about the typos—typing on a phone is tricky, and I got what you're saying perfectly.

  Here's the big secret: **There is no official board.** Nobody sits around a table with a gavel and votes on whether King Arthur is "legend" or "history." It's not like the movies where scholars wear robes and decide these things.

  You're not missing anything obvious because the lines are actually super blurry. Historians don't use three distinct bins (History, Legend, Myth); they use a **spectrum**. Think of it like a slider bar. On one end, you have hard, verifiable history. On the other, you have pure myth. Most of the cool stuff you're talking about sits right in the messy middle.

  Here's how scholars actually decide where to slide the bar, and why your examples get treated differently.

  ### 1. The "Rules" (Or Lack Thereof)
  You heard about a "three-source check." That's not a formal rule, but it's close to the real principle: **Corroboration.**
  Historians want **independent sources** saying the same thing. If one guy writes it down, that's a claim. If three guys from different places write it down without copying each other, that's stronger evidence.

  But the biggest factor is **Timing (Proximity).**
  *   **History:** Needs evidence from *during* or immediately after the event (contemporary records, archaeology from that exact layer).
  *   **Legend:** Usually written down centuries after the fact. The story grows like a game of telephone.
  *   **Myth:** Explains *why* things are the way they are (origins, gods, nature) rather than *what* happened.

  ### 2. Why Troy Gets a Pass (Mostly)
  You're right about Schliemann. He was kinda reckless and dug through the wrong layers initially, but later archaeologists fixed his work.
  *   **The Evidence:** We found the city. We found evidence it was destroyed by war (burn layers, arrowheads) around the right time (Late Bronze Age). We even found Hittite texts mentioning a city called "Wilusa" (likely Ilios/Troy) having conflicts.
  *   **The Verdict:** There was definitely a war over Troy. That's **History**. But was it because of Helen? Did Achilles drag Hector around the walls? Did Athena help fight? That's **Legend/Myth**.
  *   **Why it moves up:** The physical city and the destruction layer match the story's core. So scholars say, "Historical kernel, legendary embellishment."

  ### 3. Why King Arthur Stays in Legend
  You mentioned Glastonbury and Welsh texts. Here's the catch: **Timing.**
  *   **The Evidence:** Arthur supposedly lived around 500 AD. The first texts that actually describe him as a king come from centuries later (like Geoffrey of Monmouth in the 1100s). The Welsh poems are older, but they're poetic, not historical records.
  *   **The Glastonbury Problem:** The monks at Glastonbury claimed to find Arthur's grave in the 1100s. Most historians think they faked it to get pilgrims (and their money) to visit their abbey.
  *   **The Verdict:** There might have been a real warlord named Arthur (or Artorius) who fought Saxons. But we have no contemporary proof. No letters, no inscriptions from his time.
  *   **Why it stays down:** Without contemporary evidence, it can't be "History." It's a **Legend** because it's likely based on a real person, but the story is mostly made up over time.

  ### 4. Why the Exodus is Tricky
  This is the toughest one.
  *   **The Evidence:** You mentioned the Merneptah Stele. That's huge, but it only proves that a people called "Israel" existed in Canaan around 1200 BC. It doesn't prove they came from Egypt.
  *   **The Archaeology:** We haven't found evidence of 2 million people wandering the Sinai for 40 years (that would leave a *lot* of trash and bones). Also, Egyptian records usually brag about everything, but they don't mention losing a massive slave population or an army drowning.
  *   **The Verdict:** Most scholars think it's **Cultural Memory**. Maybe a smaller group of Semitic slaves escaped Egypt and joined up with people already in Canaan. Over centuries, the story grew to represent the whole nation.
  *   **Why it stays down:** The scale in the Bible doesn't match the dirt. Until we find evidence of that specific migration, it stays in the realm of **Foundational Myth** (true in meaning to the culture, but not literally historical).

  ### 5. The Supernatural Factor
  You asked if gods automatically make it a myth. Basically, yes.
  If a story says "The wall fell because of trumpets," historians look for an earthquake. If it says "The sea parted because God raised his hand," historians can't test that.
  History deals with natural causes. If the *only* explanation for an event is a miracle, historians have to classify it as theology or myth, not history. However, they often look for the natural event behind the miracle (e.g., a tidal bore explaining the parted sea).

  ### The Bottom Line
  You aren't missing a secret rule. It's just a weighing game.
  *   **Troy:** Heavy archaeology + Some texts = **Historical Event with Legendary Story.**
  *   **Arthur:** Light archaeology + Late texts = **Legend.**
  *   **Exodus:** Heavy cultural impact + Low archaeological match = **Foundational Myth / Cultural Memory.**

  It's not about a vote; it's about how much dirt and paper we can find to back up the claim. And honestly, scholars argue about this stuff constantly. If you hear two historians disagree on whether Arthur was real, that's normal. It's all interpretation.

  Hope that clears it up! You're asking the right questions.
