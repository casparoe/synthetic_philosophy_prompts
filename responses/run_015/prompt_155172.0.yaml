      *   **King Arthur:** Very little contemporary evidence. Most sources are centuries later. The "historical Arthur" (if he existed) was likely a warlord, not a king in shining armor. It's mostly "Legend" because the historical core is too thin to prove.
      *   **Exodus:** No direct archaeological evidence for a mass migration of 2 million people (numbers are likely exaggerated). Evidence exists for *some* Semitic people in Egypt and later Israelite emergence, but not the specific biblical narrative. It's treated as "Foundational Myth" or "Cultural Memory" rather than strict history.

