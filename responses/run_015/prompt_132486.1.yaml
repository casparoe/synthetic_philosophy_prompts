      *   **Format:** Philosophy seminar (12 people, 90 minutes).
      *   **Goal:** Make the argument hit "in the gut," not just the head. Needs to feel visceral.
      *   **Mechanism:** Structured simulation/role-play. Starts with feeling free, reveals constraints round-by-round (personality tokens, upbringing cards, group dynamics).
      *   **Outcome:** Accumulate points for "good" decisions, then defend deservingness.
      *   **Specifics:** Roles, rules, causal chain reveal, token payoff, debrief mapping to Strawson's regress.
