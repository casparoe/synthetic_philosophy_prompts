  9.  **Addressing the Limitations:**
      *   Simulation is finite; Regress is infinite.
      *   Simulation is external coercion; Strawson is about internal constitution.
      *   Simulation ignores compatibilism (which Strawson rejects, but students might hold).

  10. **Finalizing the Plan:**
