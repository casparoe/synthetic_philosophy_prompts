      *   **Mechanic:** Hidden "Veto/Compel" cards.
      *   **Payoff:** "Moral Credit" chips.

  7.  **Addressing the "Gut Hit":**
      *   The gut hit comes from the *reward*. If they work hard, get praised, and then told "You didn't earn this," they feel frustration. That frustration *is* the intuition of responsibility clashing with determinism.
      *   I need to make sure they fight for the reward.
