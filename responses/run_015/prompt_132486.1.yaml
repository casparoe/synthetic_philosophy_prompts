      *   *Tokens:* "Impulse Tokens" (Red = Aggressive, Blue = Conciliatory, Green = Aesthetic).
      *   *Cards:* "Formative Events" (e.g., "You value efficiency over empathy").

      *Wait, I need to ensure the Strawson Regress is clear.*
      *   Action = The Final Decision.
      *   Mental State = The Impulse Tokens (why they wanted that decision).
      *   Prior Cause = The Formative Cards (why they had those tokens).
      *   Ultimate Cause = Random Deal (Luck).

      *Let's make it more visceral.* Instead of just talking, they build something. A "Tower of Merit."
      *   They build a tower.
      *   Round 1: Build it however you want.
      *   Round 2: Reveal you were only allowed to touch certain blocks based on hidden roles.
      *   Round 3: Reveal roles were assigned by dice roll.
      *   Reward: "Glory Points."

      *Okay, let's synthesize the "Collaborative Art" idea with the "Hidden Constraints."*
      *   **Title:** *The Origin Gallery.*
