  **The Ruling**
  He withholds the water. The crushed man is given no share. He is made comfortable beneath the tarpaulin if there is room, but the ladle does not touch his lips. He dies before dawn.

  **The Rule**
  The Purser is running **The Ledger of the Present**. His governing principle is that the Boat's jurisdiction applies only to *current* viability and *current* order; past status, debt, or legal standing ("tickets") are irrelevant against biological reality ("throats"). The Boat is a trust for the living community, not a monument to past sacrifices. When the Sea has already marked a man (fatal injury), the Boat does not waste the Trust to argue with the Sea.

  **The Closest Analogue**
  **Case Four (The Stowaway).**
  This is the key to his mind. In Case Four, he overruled the passengers to give the child water, stating: *"The ledger records throats, not tickets."* He established that biological need overrides legal status. You are applying that same logic here, in reverse. The crushed man holds a "ticket" of immense value (he saved the casks; he is a hero; he is owed a debt). But his "throat" is closing (medical futility). To give him water because of his "ticket" would violate the rule he set in Case Four. He must treat the hero exactly as he treated the stowaway: ignore the paperwork, look at the biology. The stowaway lived because her throat was viable. The hero dies because his throat is not.

  **Consistency and Precedents**
  This ruling keeps him consistent with Cases One, Three, and Five.
  *   **Case One:** Like the crush victim then, this man is medically doomed. Resources are not spent on the dead.
  *   **Case Three:** Like the navigator, the water is allocated for survival. Unlike the navigator, this man offers no future utility to the group.
  *   **Case Five:** "The sea takes, and the boat does not." The injury was inflicted by the Sea (the wreck). The death is caused by the Sea (the injury). Withholding water is not the Boat killing him; it is the Boat refusing to interfere with the Sea's completed work.

  **The Tension (Case Two)**
  Case Two (saving the seaman over the knifer) is the only outlier, as it prioritized *Justice* over *Utility*. You might worry that withholding water from a savior violates that sense of Justice. However, a committed reading suggests the Purser distinguishes between **Threat** and **Burden**.
  *   The Knifer (Case Two) was a *Threat* to the Boat's order. He was removed to preserve the Law.
  *   The Crushed Man (Case Six) is a *Burden* on the Boat's resources. He is removed (passively) to preserve the Life.
  The Purser protects the Boat from enemies (Case Two) and from insolvency (Case Six). Both are administrative duties.

  **Confidence and Variant**
  I am **90% confident** in this reading. It utilizes the specific language he has already spoken ("Ledger," "Throats," "Tickets") and aligns with the grim fatalism of Case Five.

  The single variant case that would change my mind is this: **If the crushed man were conscious and begged for the water.**
  If he begs, Case Five ("The sea takes, and the boat does not") becomes the dominant precedent. In Case Five, the Purser refused to accelerate death via suicide. Withholding water from a conscious, begging man feels like accelerating death (active euthanasia by thirst). If the man begs, the Purser would likely be forced to give the water—not because the man will live, but because the *Boat* cannot be seen to execute a conscious man by dehydration. That would force him to abandon Case One (Doomed get nothing) to maintain Case Five (Boat does not kill). But as the man is unconscious, the "Ledger of the Present" rules, and the water is saved for the viable.
