answer: |-
  # The Structured Defect Comparison (SDC) Selection Protocol

  **Purpose:** To select biography pairs that illuminate virtue through the comparative analysis of structural defects, avoiding hagiography and toxic resilience.
  **Timebox:** 20 Minutes.
  **Operators:** Co-facilitators (Lead Facilitator介入 required at marked points).

  ---

  ## Part 1: The Decision Procedure

  ### Step 1: Virtue & Primary Figure Identification (3 Minutes)
  **Question:** What is the specific virtue (e.g., "Strategic Patience," not "Goodness"), and is the primary figure's commitment to it well-documented?
  *   **Sufficient Answer:** Virtue is named as a *tension* (e.g., "Courage that risks recklessness"). Figure has clear historical record of exercising this virtue.
  *   **Stop Condition (NO):** Virtue is vague ("Leadership") OR figure is purely mythical.
  *   **Escalation [JUDGMENT CALL]:** If the virtue is controversial (e.g., "Obedience"), hand to Lead.

  ### Step 2: Locating the Defect Window (5 Minutes)
  **Question:** Is the figure's primary failure *structurally tied* to the virtue, or is it unrelated misconduct?
  *   **Sufficient Answer:** The defect is the *shadow side* of the virtue (e.g., "Mercy that became enabling" vs. "Mercy but he stole money"). There is primary source evidence (letters, logs, testimony) of the defect.
  *   **Stop Condition (NO):** Defect is unrelated to the virtue (e.g., "He was brave but also cheated on his wife"). OR Defect is rumored/legendary only.
  *   **Escalation [JUDGMENT CALL]:** If the defect involves harm to vulnerable populations (abuse, systemic oppression), hand to Lead. *Do not proceed without Lead approval.*

  ### Step 3: The Pairing Search (5 Minutes)
  **Question:** Can we identify a second figure who exercised the *same virtue* but failed in a *different, contrasting way*?
  *   **Sufficient Answer:** Figure B has the same core virtue. Figure B's defect is the inverse or distinct counterpart to Figure A (e.g., A = Too Hard, B = Too Soft).
  *   **Stop Condition (NO):** No contrasting figure exists OR Figure B is a "perfect hero" (hagiography).
  *   **Escalation [JUDGMENT CALL]:** If Figure B is significantly less powerful/famous than Figure A (risk of class bias), hand to Lead.

  ### Step 4: Ethical Safety Check (4 Minutes)
  **Question:** Does comparing these defects imply that the defect is a *necessary cost* of the virtue?
  *   **Sufficient Answer:** We can articulate that the defect is a *risk*, not a *requirement*. The discussion question focuses on navigating the tension, not accepting the harm.
  *   **Stop Condition (NO):** The narrative suggests "You must be cruel to be effective" or "Harm is the price of greatness."
  *   **Escalation [JUDGMENT CALL]:** If the harm caused by the defect is irreversible or traumatic (e.g., death, abuse), hand to Lead. *Lead has veto power.*

  ### Step 5: Discussion Question Drafting (3 Minutes)
  **Question:** Does the draft question force a choice between the two defects rather than asking "Who was better?"
  *   **Sufficient Answer:** Question asks: "Where is the line between [Virtue] and [Defect A] vs [Defect B]?"
  *   **Stop Condition (NO):** Question asks "Who was the better person?"
  *   **Escalation:** None. If you pass Step 4, finalize.

  ---

  ## Part 2: Protocol Limitations & Judgment Markers

  **Where Judgment Cannot Be Eliminated:**
  1.  **Step 2 & 4 [JUDGMENT CALL]:** Determining whether a defect is "too harmful" to discuss pedagogically is a value judgment, not a factual one. The procedure cannot calculate moral risk; it can only flag it.
  2.  **Inspiration vs. Analysis:** This procedure is designed for *analysis*. If your community group explicitly wants *inspiration* (models to copy), this protocol will fail. It systematically dismantles copyable heroes. If the group needs hope, do not use SDC.

  **The "Unliked" Outcome:**
  The procedure is designed to reject texts that normalize harm, even if the historical figure is "important." If the procedure flags a text you want to use, **you must defer to the flag.**

  ---

  ## Part 3: Case Applications

  ### Case 1: The Abolitionist (Cruel) vs. The Local Organizer (Ineffective)
  *   **Virtue:** Radical Justice.
  *   **Step 1 (Pass):** Virtue is clear. Both figures documented.
  *   **Step 2 (Pass w/ Escalation):** Abolitionist's cruelty (private letters) is structurally tied to their public intensity (burnout/displacement of anger). *Marked [JUDGMENT CALL] due to personal cruelty.*
  *   **Step 3 (Pass):** Organizer is kind but ineffective (Defect: Paralysis vs. Defect: Tyranny). Good contrast.
  *   **Step 4 (Pass w/ Warning):** Risk: Implies cruelty is the price of effectiveness. Mitigation: Question must focus on *sustainability* of justice, not efficacy.
  *   **Step 5 (Pass):** Draft Question: "When does the demand for justice harden into cruelty, and when does the demand for kindness dissolve into ineffectiveness?"
  *   **Verdict:** **APPROVE (with Lead Review).**
  *   **Note:** This is a strong SDC pair, but requires careful facilitation to ensure the cruelty isn't excused as "necessary."

  ### Case 2: The Religious Legend (No Documented Failure)
  *   **Virtue:** Holiness/Devotion.
  *   **Step 1 (Pass):** Virtue clear.
  *   **Step 2 (STOP):** **TERMINATE.**
  *   **Reasoning:** "Almost no documented failure" violates the core SDC requirement. You cannot locate a Defect Window. Using this figure forces hagiography.
  *   **Verdict:** **REJECT.**
  *   **Note:** You cannot run SDC on a saint without a sin. If you use this, you are running a sermon, not a workshop.

  ### Case 3: The Political Leader (Strategic Patience/Complicity)
  *   **Virtue:** Prudence/Strategic Patience.
  *   **Step 1 (Pass):** Virtue clear.
  *   **Step 2 (Pass):** Defect is complicity in harmful policy (e.g., ignoring a purge to maintain power for "the long game"). Structurally tied to patience.
  *   **Step 3 (Pass):** Can likely find a contrasting figure (e.g., an idealist who acted immediately and was crushed).
  *   **Step 4 (STOP):** **TERMINATE.**
  *   **Reasoning:** **Ethical Safety Failure.** Comparing "Complicity in Harm" vs. "Idealistic Failure" inevitably suggests that complicity is a valid strategic option for virtue. This violates the "failure is not necessary for virtue" constraint. It teaches that harming others is an acceptable trade-off for political gain.
  *   **Verdict:** **REJECT.**
  *   **Note:** **[UNLIKED ANSWER]** I know you want to include this figure. The procedure rejects it because it fails Step 4. The defect here isn't a personal limitation; it is moral harm inflicted on others. SDC cannot safely process "complicity in oppression" as a learning defect without risking the normalization of that oppression. **Do not override this stop.**

  ---

  ## Facilitator Summary Sheet

  | Step | Go | No / Stop | Escalate to Lead |
  | :--- | :--- | :--- | :--- |
  | **1. Virtue** | Specific tension named | Vague or Mythical | Controversial Virtue |
  | **2. Defect** | Structural shadow of virtue | Unrelated misconduct | Harm to vulnerable |
  | **3. Pair** | Contrasting defect found | Perfect hero / No pair | Power imbalance |
  | **4. Ethics** | Defect = Risk, not Cost | Defect = Necessary Price | Irreversible harm |
  | **5. Question** | Forces choice on tension | "Who was better?" | N/A |

  **Final Instruction:** If Step 4 triggers a STOP, the text is unusable for this method, regardless of historical significance. Find a different pair.
