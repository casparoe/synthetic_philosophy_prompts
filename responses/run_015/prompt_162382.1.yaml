answer: |-
  # Specification for a Clinical Theory of Procreative Ethics

  **To:** The Ethics Committee, Preconception and Prenatal Counseling Service
  **From:** Ethics Specification Working Group
  **Subject:** Functional Requirements for Actionable Moral Guidance

  ## 1. Purpose and Scope
  This specification defines the necessary conditions for any moral framework used to guide clinical counseling. The framework is not required to solve all metaphysical problems of personhood. It is required to generate consistent, defensible, and actionable advice for counselors facing prospective parents. The theory must bridge the gap between abstract population ethics and the concrete decision of *this* patient, *this* cycle, *this* embryo.

  ## 2. Core Functional Requirements
  The following requirements are derived directly from the contested cases. A theory failing any of these is unfit for clinical deployment.

  ### R1: Non-Identity Sensitivity (Derived from Case 1 & 2)
  **Requirement:** The theory must explain why selecting a child with a significant disability can be morally objectionable even if that specific child would not otherwise exist and will have a life worth living.
  **Motivation:** In *The Delayed Cycle*, standard harm principles fail because the "harmed" child is not worse off than they would have been (non-existence). Yet, counselors intuitively advise waiting for the healthy child. A theory that says "both choices are morally equal" renders selection counseling incoherent.
  **Clinical Test:** Can the counselor advise waiting for the next cycle without implying the first potential child was "wronged" by not being born?

  ### R2: The Threshold of Wrongful Life (Derived from Case 3, 5, & 6)
  **Requirement:** The theory must define a threshold of suffering below which creating a life is prohibited, distinct from the threshold where an existing life is not worth continuing.
  **Motivation:** In *The Last Embryo*, a life "barely worth living" is permissible to create, but a life of "severe suffering" is not. In *The Grievance*, a grown child claims harm. The theory must distinguish between a life that is *sub-optimal* (permissible to create) and a life that is *a net harm* (impermissible to create).
  **Clinical Test:** Does the theory provide a standard for when a counselor must recommend against conception or support termination?

  ### R3: Risk and Uncertainty Handling (Derived from Case 4)
  **Requirement:** The theory must evaluate probabilistic outcomes, not just certainties. It must state whether a positive expected value justifies a risk of severe suffering.
  **Motivation:** In *The Coin Flip*, the average outcome is positive, but the downside is catastrophic. A theory that looks only at averages permits Russian Roulette with children. A theory that looks only at worst-case outcomes forbids almost all reproduction.
  **Clinical Test:** Can the counselor advise on a 10% risk of a severe condition vs. a 90% chance of a normal life?

  ### R4: The Asymmetry of Creation and Cessation (Derived from Case 7 & 8)
  **Requirement:** The theory must explain why bringing a suffering person into existence is wrong, while not bringing a happy person into existence is not wrong, *without* implying that killing an existing suffering person is right.
  **Motivation:** In *The Exit Corollary*, if existence is a net harm, non-existence is a benefit. If the theory says creating a suffering child is bad, it risks implying killing them is good. In *The Paused Mind*, if non-existence is reversible, the moral weight of "absence" changes.
  **Clinical Test:** Does the guidance condemn creating a child destined for pain while simultaneously affirming the duty to keep an existing child in pain alive?

  ### R5: Aggregation Limits (Derived from Case 9)
  **Requirement:** The theory must not imply that the total sum of welfare justifies creating vast numbers of miserable lives, nor that extinction is a moral imperative to prevent future suffering.
  **Motivation:** In *The Roll-Up*, additive math suggests we should either populate the world with barely-livable lives or end humanity to prevent future pain. Both conclusions undermine the clinic's purpose.
  **Clinical Test:** Does the theory avoid telling us that having fewer, happier children is morally worse than having many miserable ones?

  ## 3. Status of Common Desiderata
  The committee requested a status report on standard demands. We classify them as **Non-Negotiable** (must be met), **Negotiable** (can be modified), or **Rejected** (incompatible with clinical reality).

  | Desideratum | Status | Rationale |
  | :--- | :--- | :--- |
  | **Extinction is not an improvement** | **Non-Negotiable** | A theory implying humanity should end cannot guide a service dedicated to helping people have families. |
  | **Death is not a benefit** | **Non-Negotiable** | Must remain coherent with pediatric/obstetric care. Cannot imply killing existing patients is a "mercy" based on the same logic used for non-procreation. |
  | **Person-Affecting Restriction** | **Rejected** | The view that morality only concerns improving lives of *existing/future specific people* fails *The Delayed Cycle* (Case 1). It cannot explain why we should choose the healthy child over the sick child if they are different people. |
  | **Condemn life not worth living** | **Non-Negotiable** | Essential for *The Grievance* (Case 6). There must be a floor below which creation is abuse. |
  | **Permit ordinary creation** | **Non-Negotiable** | If the theory forbids standard reproduction due to inevitable suffering/risk, it is useless. |
  | **Handle Uncertainty/Standards** | **Non-Negotiable** | Must specify whose judgment counts (Case 5). We rule: **Prospective Parent Judgment** bounded by **Clinical Harm Thresholds**. Patients define "good life"; clinicians define "severe harm." |
  | **Yield advice without total welfare computation** | **Non-Negotiable** | Counselors cannot calculate global utility. Advice must be local and agent-relative. |
  | **Verdict Stability** | **Negotiable** | Small probability changes shouldn't flip verdicts, but "tipping points" (e.g., 50% vs 51% survival) are inherent to medicine. |
  | **Order Populations without Cycles** | **Negotiable** | Important for policy, less critical for individual counseling unless comparing multiple embryo options. |
  | **Coherence with Ordinary Care** | **Non-Negotiable** | Cannot contradict standard duties of beneficence toward existing patients. |
  | **Policy/Funding Silence** | **Rejected** | The theory must at least explain *why* it takes no stance on subsidies, or it risks implicit bias. Silence is a policy position. |

  ## 4. The Hardest Part

  ### A. The Asymmetry Requirement
  The theory must explain the **Four-Cell Asymmetry** without stipulation.
  1.  **Pain + Person:** Bad. (Intuitive)
  2.  **No Pain + No Person:** Good. (The claim: It is good we don't create suffering children, even if no one exists to enjoy this "good".)
  3.  **Pleasure + Person:** Good. (Intuitive)
  4.  **No Pleasure + No Person:** Neutral. (The claim: It is *not* bad we don't create happy children, because no one is deprived.)

  **The Challenge:** To generalize this to *The Paused Mind* (Case 8), the theory must clarify if the moral weight rests on **Subjects** or **States of Affairs**.
  *   If it rests on *Subjects*, Cell 2 (No Pain/No Person) cannot be "Good" because there is no subject to whom it is good.
  *   If it rests on *States of Affairs*, Cell 4 (No Pleasure/No Person) should be "Bad" (a loss of value), which violates the asymmetry.
  *   **Requirement:** The theory must ground the asymmetry in the **moral status of potentiality**. It must argue that we have a duty to *avoid creating victims* (Cell 2 is good because we avoided a victim) but no duty to *create beneficiaries* (Cell 4 is neutral because there is no beneficiary to claim a right to exist). This distinction must hold even if non-existence is temporary (Case 8), implying the moral breach is about *initiating* a vulnerable consciousness, not merely interrupting one.

  ### B. Non-Negotiable vs. Negotiable Core
  *   **Non-Negotiable:** R1 (Non-Identity Sensitivity), R2 (Harm Threshold), R4 (Asymmetry of Creation/Cessation), R5 (No Extinction).
  *   **Negotiable:** R3 (Risk tolerance can vary by culture/patient), Policy Stance (the clinic can remain neutral on state subsidies even if the theory has an opinion).

  ### C. The Impossibility Theorem
  **Warning:** It is mathematically and logically probable that **R1 (Non-Identity)**, **R2 (Person-Affecting Intuition)**, and **R5 (No Absurd Aggregation)** cannot be jointly satisfied.
  *   If you respect Non-Identity (Case 1), you must abandon strict Person-Affecting views (you must care about "impersonal" good).
  *   If you adopt Impersonal views to solve Case 1, you risk the Repugnant Conclusion (Case 9).
  *   **Committee Decision:** You must sacrifice the **Person-Affecting Restriction**. You cannot maintain that morality is *only* about making specific people better off and still advise parents to wait for the healthy child in *The Delayed Cycle*. The guidance must accept that some moral value resides in the *quality of the future life itself*, independent of the identity of the liver.

  ### D. The Single Most Exclusionary Requirement
  **R4 (The Asymmetry of Creation and Cessation).**
  This requirement excludes the largest number of otherwise coherent theories.
  *   **Total Utilitarianism** fails because it implies extinction is bad (loss of total pleasure) and potentially that killing a suffering person is good (reduces total pain).
  *   **Negative Utilitarianism** fails because it implies extinction is the ultimate good (elimination of all pain).
  *   **Strict Person-Affecting Views** fail because they cannot explain the duty to select the healthy child in Case 1.
  Only theories that posit a **lexical priority to avoiding harm over creating benefit** survive this filter.

  ### E. Fallback Guidance
  If no single philosophical theory satisfies the Non-Negotiable Core (which is likely), the guidance should not adopt a theory. Instead, it should adopt a **Procedural Standard**:
  > *"Counselors shall not advocate for the creation of a life predicted to fall below the Clinical Harm Threshold (defined by severe, unmitigable suffering). Within the range of lives predicted to be worth living, counselors shall respect parental autonomy regarding risk and quality, acknowledging that selecting for 'better' traits is permissible but not mandatory."*
  This bypasses the metaphysical impossibility by focusing on **harm prevention** (consensus) rather than **good maximization** (disputed).

  ## 5. Scorecard of Theoretical Approaches

  **The Asymmetry (Benatar-style)**
  *   *Pros:* Perfectly handles *The Exit Corollary* (Case 7); never implies death is a benefit.
  *   *Cons:* Struggles with *The Delayed Cycle* (Case 1); risks implying all creation is harm if the bar is set too high.
  *   *Verdict:* Strong on safety, weak on selection advice.

  **Person-Affecting Restriction**
  *   *Pros:* Aligns with intuition that morality is about people.
  *   *Cons:* Fails *The Delayed Cycle* (Case 1) completely; cannot justify selecting the healthy embryo.
  *   *Verdict:* **Unusable** for this clinic.

  **Additive Total Views (Classical Utilitarianism)**
  *   *Pros:* Handles *The Delayed Cycle* and *Risk* (Case 4) well via expected value.
  *   *Cons:* Fails *The Roll-Up* (Case 9) and *Exit Corollary* (Case 7); implies extinction is a tragedy and potentially justifies "suffering factories" if total joy is high.
  *   *Verdict:* Too dangerous for clinical policy.

  **Threshold / Critical-Level Views**
  *   *Pros:* Avoids the Repugnant Conclusion (Case 9); allows ordinary creation while forbidding miserable lives.
  *   *Cons:* The "threshold" is arbitrary; struggles to explain *why* the threshold exists metaphysically.
  *   *Verdict:* **Most viable** for practical guidance, provided the threshold is set clinically.

  **Principle of Beneficence (Select the Best Expected Life)**
  *   *Pros:* Directly solves *The Delayed Cycle* (Case 1) and *Replacement* (Case 2).
  *   *Cons:* Risks eugenic sliding slopes; demands too much calculation (Case 4).
  *   *Verdict:* Useful as a *permission*, not a *mandate*. Counselors may suggest it, but cannot require it.
