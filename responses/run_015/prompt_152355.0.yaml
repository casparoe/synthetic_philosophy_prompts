  I defend the principle of **Culpable Volition with Segregated, Non-Enforced Ledgers**.

  **The Principle:**
  Moral desert is generated exclusively by the quality of the agent's will—specifically, their intentions and the degree of culpable negligence in their belief-formation. Consequences (outcomes) are morally inert regarding *desert*, though they may trigger social or legal responses. Positive and negative desert accumulate in separate, non-fungible accounts; one cannot offset the other. Crucially, this theory is *normative*, not *mechanistic*: it defines what is *owed*, not what is *paid*. The universe has no obligation to balance the ledger experientially.

  **Application to Your Five Judgments:**

  1.  **The Fraudulent Executive:** He accumulates massive negative desert due to malicious intent. The fact that he dies peacefully is irrelevant to his *desert*, which remains a standing moral debt.
      *   *Revision Required:* I reject your intuition that the absence of penalty represents a "deficit in the moral order." The moral order is the *standard of accounting*, not the *collection agency*. The deficit is in cosmic enforcement, not in the validity of the desert. To claim the moral order is deficient because justice wasn't served conflates *what is right* with *what happens*.
  2.  **The Negligent Engineer:** She bears no negative desert because her will was aligned with safety (rigorous checks). The catastrophic outcome is moral luck, which does not generate desert under Culpable Volition. This aligns perfectly with the principle.
  3.  **The Prestige Donor:** She generates positive desert for the volition to donate, but less than the compassionate donor because the quality of her will (vanity vs. empathy) is morally inferior. Public recognition is a social utility, distinct from moral credit. This aligns with the principle.
  4.  **The Unjust War Combatant:** She holds no negative desert for the killing (intent: self-defense) but accumulates negative desert for the participation (intent: affiliation with an unjust cause). This distinguishes act-level volition from role-level volition, which the principle accommodates via segregated ledgers.
  5.  **Cumulative Model vs. Undeserved Suffering:** The cumulative model is accepted (ledgers are non-cancellable). Regarding rebirth and suffering: Your intuition that suffering can be "genuinely undeserved" is retained, but reinterpreted. It means the *experiential fate* does not match the *normative ledger*.
      *   *Revision Required:* I reject the implication that this creates a theoretical conflict. If karma is normative desert, "undeserved suffering" is simply *unpaid debt* or *noise*. It does not invalidate the ledger; it invalidates the expectation of cosmic payback.

  **Prediction for the Policymaker Case:**
  Under **Culpable Volition**, the policymaker accumulates negative desert **only in proportion to her culpable negligence in belief-formation**, not in proportion to the total harm caused.

  *   **Reasoning:** The thousands of future deaths are a consequence, not a volition. She did not intend the harm, nor was the harm a certain certainty she ignored (which would be recklessness). She failed to investigate (negligence). Her desert is calibrated to the *failure of diligence*, not the *scale of the tragedy*.
  *   **Verdict:** She bears significant negative desert for the negligence, but it is finite. It does not scale with the number of future victims. To assign desert proportional to the outcome would be to punish her for moral luck, violating the Engineer precedent (Case 2).

  **Inconsistent Intuitions Rejected:**
  To maintain the coherence of this principle, I explicitly reject two of your intuitions:

  1.  **The "Deficit in the Moral Order" (Case 1):** You claimed the executive's lack of punishment implies a flaw in the moral order. I reject this. The moral order is satisfied by the *existence* of the debt, not its *collection*. Insisting on enforcement turns a normative theory into a metaphysical promise of justice, which your own Case 5 (undeserved suffering) correctly identifies as false.
  2.  **The "Outcome Weighting" (Implicit in Policymaker Case):** You asked if she deserves desert "in proportion to the total harm caused." I reject this. If you accept the Engineer (Case 2) bears no desert for identical harm due to lack of intent, you cannot consistently argue the Policymaker deserves desert *for the harm*. She deserves desert only for the *negligence*. To do otherwise creates a contradiction between Case 2 and the Policymaker case.

  **Summary:**
  Adopt **Culpable Volition**. It preserves your judgments on intent (Engineer, Donor, Combatant) and the cumulative nature of character (Case 5), but it forces you to abandon the hope that the moral order guarantees retribution (Executive) or that consequences measure blame (Policymaker). Desert is what you *owe*, not what you *pay*.
