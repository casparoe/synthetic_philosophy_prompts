answer: |-
  TO: The Editorial Board
  FROM: Graduate Member, Editorial Board
  DATE: October 26, 2023
  SUBJECT: Recommendation on Manuscript Review Requirement R

  **Recommendation:** Adopt Requirement R in modified form. The modifications are: remove the author veto on reviewer nomination except for documented conflicts of interest; replace the author-drafted engagement note with a Counterpoint and Reply section where the counterpart reviewer drafts the objection; and institute this as an eighteen-month pilot program rather than permanent policy.

  The internal audit presents a stark picture of our journal's intellectual ecology. Over five years, two-thirds of references in accepted articles concentrated in six journals, and fewer than five percent of articles cited literature outside our two founding disciplines. Most critically, in the fourteen cases where editors proactively sought review from the counterpart literature, nine published articles cited that outside work exactly once, typically to dismiss it as resting on incompatible framework assumptions. In none of those cases did the article's central claim change. This evidence requires us to be precise about what is broken before we prescribe a fix. There are three possible diagnoses for this isolation. The first is non-exposure: authors and reviewers simply do not encounter the outside literature. The second is status defense: authors encounter the literature but dismiss it to maintain standing with their home readership, for whom acknowledging the outside view as substantive rather than merely different might cost credibility. The third is framework filing: the journal lacks a mechanism by which an outside objection could ever alter a central claim, because such objections are routinely categorized as disagreements about framework and therefore filed as nobody's business.

  The audit evidence contradicts the first diagnosis for the sampled cases. Those authors were exposed to the outside literature via the editor's initiative. The evidence strongly supports the third diagnosis, framework filing, though it remains compatible with the second. The pattern of citing outside work solely to demarcate boundaries suggests that the problem is not ignorance, but institutional habit. We have normalized the practice of treating foundational disagreements as terrain to be mapped rather than arguments to be engaged. If this diagnosis is correct, Requirement R in its current form risks exacerbating the condition it aims to cure. By mandating an engagement note drafted by the author, R treats framework filing as if it were non-exposure. It assumes that if authors are forced to write about the outside literature, they will engage with it. Instead, the note may become a certified box-checking exercise. An author can point to the engagement note as evidence of virtue while continuing to file the objection as a framework disagreement within the note itself. This gives framework filing an official, visible, and apparently virtuous slot in the article, legitimizing the very dismissal mechanism we should be dismantling.

  Regarding the author-veto clause, I recommend its removal. The proposal allows authors to veto up to two nominees from the counterpart literature. While intended to prevent hostile reviews, this clause effectively allows authors to select which outsider counts as representative. In a small field, vetoing two nominees from a limited pool of qualified counterpart reviewers allows an author to steer the review toward a sympathetic voice or a marginal figure whose objections are easily dismissed. This undermines the core purpose of the counterpart review, which is to ensure the objection is robust. The veto should be restricted strictly to documented conflicts of interest, such as prior collaboration or institutional affiliation, to preserve the integrity of the selection process.

  The strongest argument against Requirement R comes from our early-career board members, who identify it as a tax on non-mainstream work. The choice of counterpart literature is not neutral. For authors whose work already sits outside the mainstream of our two home literatures, a blanket duty to engage the other side imposes a disproportionate burden. These authors often spend a large share of their word budget establishing that their questions are legitimate at all. Forcing them to dedicate additional space to a counterpart literature may drive these submissions to friendlier venues. To address this, I propose instituting R as an eighteen-month pilot program rather than immediate permanent policy. This limits the risk of driving away submissions while allowing us to gather data on the burden. Furthermore, during the pilot, handling editors should exercise discretion in triggering the counterpart review, res it for manuscripts where the editor identifies genuine bridge potential, rather than applying it blanket-style to all conditionally accepted articles.

  To prevent the engagement note from becoming a strawman exercise, the mechanism of the note must change. I propose that the note be drafted as a Counterpoint and Reply. The counterpart reviewer should draft the statement of the strongest objection, and the author should be given a right of reply. This ensures the objection is not one the author has restated in terms they can easily defeat. It shifts the labor of characterization to the outsider, preventing the author from controlling the framing of the dissent. This modification directly targets the framework filing diagnosis by forcing the author to respond to a specific, externally validated objection rather than a self-generated caricature. If the author cannot answer the objection without altering their central claim, the mechanism works. If they answer it by filing it as a framework disagreement, the published record will show exactly that, making the habit visible rather than hiding it in a footnote.

  We must also define how we will know if this policy works. Citation counts are insufficient, as the audit shows citations can increase without intellectual engagement. I propose three alternative measures. First, track substantive revision rates: in cases where counterpart review is used, does the final published article differ materially from the conditionally accepted draft in ways attributable to the counterpart reviewer's comments? Second, survey authors post-publication: ask them whether the counterpart review process altered their understanding of their own claim, regardless of whether it changed the text. Third, monitor submission rates from subfields identified as marginalized within our two home literatures to ensure the tax concern is not materializing.

  Finally, we must state in advance what result would count as a reason to drop the policy. If, after eighteen months, data shows that counterpart reviews are occurring but substantive revision rates remain near zero, and author surveys indicate the process was viewed purely as administrative compliance, we should conclude that framework filing is too entrenched for this mechanism to dislodge. Similarly, if submission rates from non-mainstream subfields drop by more than ten percent compared to the previous five-year average, we must acknowledge that the burden outweighs the benefit. In either case, the policy should be dropped in favor of structural changes, such as special issues curated by scholars from the counterpart literature, rather than mandating engagement at the article level.

  This recommendation seeks to honor the senior editors' commitment to breaking our intellectual silos while taking seriously the early-career concern that mandates can become burdens. The audit tells us that exposure is not the problem; integration is. By removing the veto, shifting the drafting of the objection to the reviewer, and limiting the scope to a pilot, we test a mechanism designed to disrupt framework filing without imposing a permanent tax on those least able to bear it. We owe it to the journal's mission to attempt this integration, but we owe it to our contributors to ensure the attempt does not reproduce the exclusions we claim to oppose.
