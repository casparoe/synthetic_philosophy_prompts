answer: |-
  Here are eight interview questions designed for a technically minded host. They are structured to press for logical precision and avoid allowing the guest to remain at the level of slogan or summary. Each question includes a follow-up based on the answer the guest is statistically most likely to give.

  ### 1. The Falsifiability vs. Prediction Distinction
  **Question:** Popper's central claim is that the *conjecture* of natural selection is logically confirmable but not falsifiable in principle. However, standard philosophy of science texts argue that evolutionary biology makes risky predictions, such as specific fossil sequences or phylogenetic markers. If the framework generates these specific, falsifiable predictions, on what logical grounds do you isolate the core mechanism of natural selection from these successful predictions?

  **Likely Answer:** The guest will likely argue that these predictions rely on heavy *auxiliary assumptions* (geology, genetics, environmental history). If a prediction fails, we blame the auxiliary assumptions, not natural selection itself. Therefore, the core theory is insulated from falsification.

  **Follow-up:** If the core theory is insulated, doesn't that create a Duhem-Quine problem where *any* theory can be saved from falsification by adjusting auxiliary assumptions? At what point does protecting the core conjecture stop being "scientific resilience" and start being "dogmatic immunity"?

  ### 2. The Tautology of "Fitness"
  **Question:** A classic support for Popper's view is that "survival of the fittest" is tautological: we define the fittest as those who survive, and then say they survived because they were the fittest. Modern biology defines fitness mathematically as expected reproductive success. Does shifting to a mathematical definition resolve the tautology, or does it simply hide the circularity behind a variable?

  **Likely Answer:** The guest will likely concede that mathematical definitions help but argue that without independent criteria for fitness *before* selection occurs, the explanation remains post-hoc. They will argue we usually measure fitness by looking at who actually survived.

  **Follow-up:** If we can measure traits (e.g., camouflage efficiency, metabolic rate) independently of survival outcomes, doesn't that allow us to construct a model where high-fitness traits *fail* to propagate? If that model is testable and falsifiable, isn't the "metaphysical" label only applying to a straw man of evolutionary theory?

  ### 3. The Utility of the "Metaphysical" Label
  **Question:** You argue Darwinism is a "metaphysical research program." If this framework still generates testable conjectures and drives empirical research effectively, what explanatory work is the label "metaphysical" actually doing? What does this status buy you that calling it a "high-level scientific theory" does not?

  **Likely Answer:** The guest will likely say it clarifies the *status* of the claims. It prevents scientists from thinking they have "proven" evolution in the same way they prove a law of thermodynamics. It encourages critical scrutiny of the core assumptions rather than treating them as dogma.

  **Follow-up:** But if the practical outcome is identical—scientists continue to test models derived from the framework—doesn't the distinction become merely semantic? As an engineer, if a system functions as a scientific theory, why does the internal documentation label matter?

  ### 4. Post-Hoc Explanation vs. Pre-Hoc Prediction
  **Question:** Popper worried that evolutionary explanations are almost exclusively post-hoc; we observe a trait and then construct a selection pressure that explains it. In software terms, this looks like debugging after a crash rather than predicting a crash before deployment. Are there specific instances where the Darwinian program successfully predicted a *novel* biological mechanism before it was observed, without relying on prior observation of that mechanism?

  **Likely Answer:** The guest will likely cite examples like the prediction of antibiotic resistance or specific viral mutations. However, they will qualify that these are predictions of *adaptation* generally, not necessarily specific complex structures arising de novo.

  **Follow-up:** If the prediction is limited to "adaptation will occur under pressure" rather than "specific structure X will arise," isn't that consistent with the view that the theory predicts change but not the *direction* of change? Does a theory that predicts "something will happen" qualify as scientifically restrictive enough?

  ### 5. Conditions for Abandoning the Program
  **Question:** If Darwinism is a metaphysical research program rather than a falsifiable theory, what evidence would count against it? Is there any empirical discovery that would compel you to abandon the Darwinian framework entirely, rather than just modifying a specific model within it?

  **Likely Answer:** The guest will likely suggest something radical, such as finding complex organisms in Precambrian rock (time travel fossils) or evidence that mutations are strictly directed toward needs (Lamarckism) rather than random.

  **Follow-up:** If such evidence appeared, wouldn't proponents simply adjust the auxiliary assumptions (e.g., claiming the dating methods are wrong or the mechanism is more complex)? If the program can absorb any data by adjusting the periphery, is it possible to distinguish a "degenerating research program" from a progressing one in real-time?

  ### 6. The Role of Population Genetics
  **Question:** Population genetics provides a rigorous mathematical formalism for evolution, often described as the "hard science" core of the theory. Does the existence of this mathematical layer shift the status from metaphysical to scientific, or do you view the math as merely a formal language describing the metaphysical commitments?

  **Likely Answer:** The guest will likely argue that the math describes the *consequences* of the assumptions, but doesn't validate the assumptions themselves. The math is consistent, but if the input axioms (variation, inheritance, selection) are metaphysical, the output remains tied to that framework.

  **Follow-up:** In physics, we accept General Relativity even though we can't falsify the underlying geometry of spacetime directly, only its effects. Why is the biological math held to a stricter standard of foundational falsifiability than the physical math?

  ### 7. Comparison to Newtonian Mechanics
  **Question:** Newtonian mechanics was treated as a metaphysical framework for centuries until General Relativity superseded it. It made incredibly precise predictions but was ultimately based on axioms (absolute time/space) that were false. Do you view Darwinism as analogous to Newtonian mechanics—a useful, predictive framework that is nonetheless fundamentally metaphysical and likely to be superseded?

  **Likely Answer:** The guest will likely agree with the analogy. They will argue that Darwinism is a "limit case" or a highly effective approximation that captures a truth about nature without necessarily capturing the *ultimate* mechanism of life.

  **Follow-up:** If it's a limit case, what is the "General Relativity" of biology? Is there a competing research program on the horizon that treats Darwinism as an approximation, or is Darwinism unique in being the only game in town?

  ### 8. Progress Criteria in Research Programs
  **Question:** Imre Lakatos, expanding on Popper, suggested we judge research programs by whether they are "progressive" (predicting novel facts) or "degenerating" (adding ad-hoc fixes to explain anomalies). By your assessment, is the Darwinian program currently progressive or degenerating?

  **Likely Answer:** The guest will likely argue it is still progressive, citing genomics and evo-devo (evolutionary development) as areas producing novel predictions, though they may warn that some areas (like certain psychological evolutionary explanations) are degenerating.

  **Follow-up:** If parts of the program are degenerating, should we excise those parts scientifically, or does the metaphysical nature of the core allow those degenerating branches to persist without damaging the central framework? Where is the cut-off line?
