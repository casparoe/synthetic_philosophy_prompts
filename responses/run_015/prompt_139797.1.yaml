  **Tier 1: This Genuinely Kills the Maxim**

  *   **(a) Leaky agents:** This violates the assumption that utility depends only on actions and world states, not on the observability of the agent's internal belief state by adversaries.
  *   **(b) Signal-in-utility:** This violates the assumption that the utility function is defined over final outcomes rather than the intrinsic experience of receiving the signal itself.
  *   **(c) Ambiguity:** This violates the requirement for a single subjective prior probability distribution to compute the linear expectation required by the theorem.
  *   **(e) Successor drift:** This violates the assumption of a temporally stable utility function across the decision horizon between information acquisition and action.

  **Tier 2: The Theorem Absorbs This Without Strain**

  *   **(d) The pedant's oracle:** This is absorbed by the stipulation that information acquisition and processing must incur zero computational cost to qualify as "free."

  **Tier 3: The Agent Updates Wrongly**

  *   **(f) The yes-channel:** This belongs in the bottom tier because the perceived threat vanishes when the agent correctly recognizes that a known biased source provides zero informational update rather than negative value.

  **Survivability Score: 3/10**
