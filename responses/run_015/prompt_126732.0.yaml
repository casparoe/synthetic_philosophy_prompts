          *   From state 0: Prob(+1) = $p$. Prob(-1) = $1-p$.
          *   This *is* a random walk with barriers at +2 and -2.
          *   So the calculation holds. The probability of a wrong cascade is ~31%.
          *   Wait, I need to check if "Cascade" means absorption at +2/-2.
          *   Yes, once diff is 2, the next person ignores signal, so the diff increases by 1 every time forever.
          *   So the "Wrong Shop" probability is the probability the random walk hits -2 before +2.
          *   So ~31% is the number. It is definitely *not* negligible.
          *   Wait, does it depend on crowd size? No, once $N$ is large enough to have cascaded (which happens quickly), the probability is fixed. It does not decrease with $N$.
      *   **Part (c) Nuance:**
