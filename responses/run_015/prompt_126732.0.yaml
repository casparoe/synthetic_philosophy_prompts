          *   So I ignore your *action* as a signal, but I use your *latency* as a signal.
          *   But eventually, even the latency signal won't swing me.
          *   At that point, do you still pause?
          *   Prompt: "long pause tends to mean the customer's private signal pointed at the other shop."
          *   If you are in a cascade, you ignore your signal. Do you still pause?
          *   If the pause is involuntary (physiological reaction to conflict), then yes, you pause even if you ignore the signal.
          *   If the pause is strategic, you might not.
          *   Assume involuntary (noisy indicator).
          *   Then the latency *continues* to provide information even during a cascade of *actions*.
          *   So the "Information Blocking" is reduced/removed.
