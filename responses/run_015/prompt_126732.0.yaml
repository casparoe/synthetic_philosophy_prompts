          *   If $p=1$, error should be 0. $p/q \to \infty$. $1/\infty = 0$. Makes sense.
          *   So with $p=0.6$, the probability of locking onto the *wrong* shop is roughly 31%.
          *   Wait, BHW (1992) numerical example often cites lower numbers. Why?
          *   Because the steps aren't always $\pm 1$.
