          *   Wait, the condition is: Cascade starts when the *next* person ignores their signal.
          *   If history is K, S, K. (Net +1 K). C4 has signal S. Belief: 2K, 2S. Indifferent. Breaks tie with signal? If they follow signal, they choose S.
          *   If history is K, K. (Net +2 K). C3 has signal S. Belief: 2K, 1S. K is more likely. Chooses K. Ignores signal. Cascade.
          *   So "Two in a row" works for the start (C1, C2).
          *   What about K, S, K, K? C3, C4 are two in a row. Does C5 cascade?
          *   History: K, S, K, K. (3K, 1S). Net +2.
          *   C5 sees 3K, 1S. Even with S signal, it's 3 vs 2. Chooses K. Cascade.
          *   So "Two in a row" *at the end of the sequence* generally implies the difference has reached 2 (assuming start from 0).
          *   Exception: K, S, K, S, K, K. (4K, 2S). Net +2. Two in a row at end. Cascade.
          *   Is there a case where two in a row happens but diff < 2?
          *   Start 0.
          *   +1, -1, +1, +1. (Net +2). Two in a row at end.
          *   +1, +1. (Net +2). Two in a row at end.
          *   It seems "Two in a row" is a robust heuristic for $p > 0.5$ starting from 0.
          *   Okay, I won't penalize (a) heavily. It's conceptually sound.

      *   *Re-evaluating (b):* This is the dealbreaker. The student thinks $N$ actions = $N$ signals. This is the exact misconception the BHW model is designed to teach. This must be penalized heavily. 1/6 is fair.
      *   *Re-evaluating (c):* The student thinks revealing signals stops herding. Herding (correlated action) is rational when public info is strong. Revealing signals makes the public info stronger/faster. So herding happens *sooner*, not later. The "spread out" claim is wrong. 4/8 is fair.

      *   *Total:* 11/20. This is a C+/B- range. The office mate said "High B at worst" (16/20?). The TA had an "itch" parts were wrong. The TA is right about (b) being wrong. The office mate likely glossed over the independence assumption in (b).

  7.  **Drafting the Feedback:**
      *   **Tone:** Professional, precise, pedagogical.
      *   **Structure:** Total score, Part breakdown, Specific Comments per part.
      *   **Part (b) Calculation:** Need to provide the "roughly what the right probability is."
