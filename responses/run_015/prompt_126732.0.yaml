  2.  **Analyze the Exam Question (The "Ramen Shop" Model):**
      *   **Setup:** Two shops (Kuro, Shiro). One better (50/50 prior).
      *   **Signals:** Private signals, 60% accurate ($p = 0.6$), independent conditional on state.
      *   **Action:** Choose a shop to maximize expected payoff (basically, choose the more likely better shop).
      *   **Information:** Customers see previous *choices* (standard Bikhchandani, Hirshleifer, Welch (BHW) model).
      *   **Part (a):** Explain cascade onset, rationality of herding, information blocking, and wrong outcome possibility.
      *   **Part (b):** Designer proposes showing *tallies* (counts) instead of sequence (e.g., "Kuro 327, Shiro 41"). Does a bigger/lopsided tally mean the crowd is more likely to be right?
      *   **Part (c):** Add *latency* (pause time indicates conflicting signal). Does cascade block information? What happens to herding?

  3.  **Evaluate Student Answer Part (a):**
      *   *Claim:* "A cascade starts as soon as two people in a row pick the same shop."
      *   *Analysis:* In the standard BHW model with $p=0.6$, let's check the math.
          *   Customer 1: Follows signal.
          *   Customer 2: If signal matches C1, follows signal (2 signals same). If signal differs, indifferent (1 signal each). Usually assumed to follow signal or flip coin.
          *   Customer 3: Sees C1, C2.
          *   Scenario: C1 chooses K (Signal K). C2 chooses K (Signal K). Public belief is strong. C3 sees K, K. Even if C3 gets signal S, the weight of two K signals outweighs one S signal. So C3 chooses K regardless of signal. Cascade starts.
          *   Scenario: C1 chooses K. C2 chooses S (Signal S). C3 sees K, S. Net signal 0. C3 follows own signal. No cascade yet.
          *   So, "two people in a row" is a heuristic. Technically, a cascade starts when the *difference* in counts reaches 2. If C1=K, C2=K, difference is 2. Cascade starts at C3.
          *   *Critique:* The statement "A cascade starts as soon as two people in a row pick the same shop" is slightly imprecise but generally acceptable for a sophomore seminar *if* interpreted as "a difference of 2". However, if C1=K, C2=S, C3=K, C4=K... that's two in a row (C3, C4), but the net count is K=3, S=1 (diff 2).
          *   *Refinement:* The standard condition for $p > 0.5$ is that a cascade begins when the number of adopters exceeds the number of rejecters by 2. "Two people in a row" is a common shorthand but technically depends on the history. If C1=K, C2=S, C3=K. C3 is not in a cascade yet. If C4=K, now we have K, S, K, K. Two in a row at the end. Net count K=3, S=1. Diff = 2. Cascade starts at C5.
          *   *Verdict:* This is acceptable shorthand for this level, provided the rest of the logic holds.
      *   *Claim:* "public information... outweighs any single person's own 60%-accurate signal."
      *   *Analysis:* Correct. Once the public belief exceeds the threshold where the private signal can't swing it, rational agents ignore private signals.
      *   *Claim:* "choice no longer reveals anything about your signal."
      *   *Analysis:* Correct. This is the definition of information blocking in cascades.
      *   *Claim:* "chance of that happening is set by the luck of the first few people rather than improving as the crowd grows."
      *   *Analysis:* Correct. This is the key inefficiency of cascades.
      *   *Grade (a):* The logic is sound. The "two in a row" phrasing is a minor imprecision but captures the essence.
      *   *Score:* 5.5 or 6/6. Let's be generous, it's conceptually correct. 6/6.

  4.  **Evaluate Student Answer Part (b):**
      *   *Claim:* "The designer is basically right."
      *   *Claim:* "Each additional person who shows up in the tally is another independent draw from the same signal distribution."
      *   *Analysis:* **THIS IS THE CRITICAL ERROR.**
      *   *Reasoning:* In a cascade model, later customers do *not* provide independent draws. Once a cascade starts, customers ignore their private signals and follow the crowd. Their choices are determined by the *previous* choices, not by independent signals.
      *   *Consequence:* The tally "Kuro 327, Shiro 41" does *not* represent 368 independent signals. It might represent 3 independent signals (the ones before the cascade) and 365 copies of the herd behavior.
      *   *Claim:* "law of large numbers kicks in... probability that the crowd has settled on the wrong shop is negligible."
      *   *Analysis:* False. Because the effective sample size stops growing after the cascade begins, the probability of error does *not* go to zero as $N \to \infty$. It stays fixed at the probability that the cascade started on the wrong shop (which is significant, e.g., if the first two signals were wrong).
      *   *Claim:* "The count is just a compressed summary of how much private information the crowd has managed to pool."
      *   *Analysis:* False. It is a compressed summary of *actions*, which cease to reflect private information after the cascade point.
      *   *Correction:* The probability of being wrong does *not* become negligible. It remains bounded away from zero. It does *not* move with the size of the crowd (once the crowd is large enough to have cascaded).
      *   *Calculation:* What is the probability of a wrong cascade?
          *   Cascade starts when difference = 2.
          *   Paths to Wrong Cascade (True State = Kuro, Crowd picks Shiro):
          *   Need Shiro count - Kuro count = 2.
          *   Sequence S, S (Prob $0.4 \times 0.4 = 0.16$). Cascade to Shiro immediately.
          *   Sequence S, K, S, S (Prob $0.4 \times 0.6 \times 0.4 \times 0.4 = 0.0384$).
