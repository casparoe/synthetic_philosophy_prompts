          *   So "Herding itself" (correlated choices) remains.
          *   Student says: "crowd will spread out." This is the error.
          *   Student says: "cascade itself dissolves." Ambiguous. If cascade = information blocking, then yes. If cascade = uniform action, then no.
          *   I will penalize the "spread out" claim heavily.

  8.  **Finalizing the Score:**
      *   (a) 6/6.
      *   (b) 1/6. (Major conceptual failure).
