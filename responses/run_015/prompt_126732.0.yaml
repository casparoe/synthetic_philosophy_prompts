  ### **TA-to-TA Note (For your discussion with your office-mate)**
  Your "itch" was correct. Part (b) is the dealbreaker. The student treats *actions* as *signals* even after the cascade point, which violates the definition of the model you taught. If you give full credit for (b), you are grading them on a different model (one where signals are always public), which contradicts their correct answer in (a). The office-mate likely read (b) charitably, assuming the student meant "if signals were independent," but the student explicitly says "Each additional person... is another independent draw," which proves they think the *herding customers* are generating new independent evidence. They aren't. That's the whole point of the seminar.

  On Part (c), the student is half-right. Latency *does* unblock information, but they wrongly assume unblocking information stops consensus. It actually speeds up efficient consensus. 5/8 is generous; 4/8 would also be defensible.

  **Recommendation:** Stick with the 11/20. It reflects that they understand the *story* of cascades (Part a) but failed the *math/logic* of why cascades are inefficient (Part b) and the *equilibrium* implications of modifying the model (Part c).
