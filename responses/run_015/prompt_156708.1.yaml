          *   *Great Man Character:* Might overestimate their own power, or obsess over assassinating a leader (thinking it solves everything).
          *   *Alt-History Implications:* If the protagonist kills Hitler in 1923, does the war still happen? (Structuralist: Yes, maybe worse. Great Man: No, peace.)
      *   *Specific Historiography Note:* Mention Intentionalists vs. Functionalists regarding the Holocaust/Nazi state. This adds realism for a Berlin setting.

  7.  **Refining the Tone:**
