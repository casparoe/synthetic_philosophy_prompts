prompt: |-
  I am working with a reconstructed Thomistic position on tyrannicide that I think improves on the standard binary reading. The standard view holds that Aquinas permits killing only a usurper who lacks legitimate authority ab initio, while a ruler who was legitimately instituted but becomes corrupt must be resisted only through public authority, not private action. I propose instead a graded framework: authority is not merely present or absent but can exist in a state of partial suspension when a legitimate ruler systematically violates the common good in a sustained and structural manner. In such cases, the ruler retains formal title but forfeits the protective conditions that normally prohibit private resistance; the result is not a blanket license to kill, but a calibrated permission whose scope depends on whether the corruption is remediable through institutional channels and whether private action would serve the common good rather than private vengeance. This reading, I claim, makes sense of Aquinas's insistence that resistance must be proportionate and ordered to the common good, without forcing him into an implausible sharp line between usurpation and corruption.

  What would genuinely count against this position? I want more than the usual objections that it is too permissive or that it violates modern liberal norms. Specifically: which features of Aquinas's broader account of authority, law, and the common good would have to be read differently for this graded framework to collapse? Are there conceptual commitments in his metaphysics of authority—say, regarding the conditions under which a mandate is void versus merely abused—that this reading mischaracterizes? What evidence or argument should I take as decisive rather than merely awkward, and which of these would defenders of the graded view themselves concede as damaging? Finally, does this framework risk being qualified into unfalsifiability—if any case of resistance can be explained by adjusting the degree of suspension, has the view lost predictive content, and is that a special problem for a normative theory of this kind?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Topic:** A reconstructed Thomistic position on tyrannicide (specifically, a "graded framework" vs. the standard "binary view").
      *   **User's Proposal:** Authority isn't just on/off (legitimate vs. usurper). It can be "partially suspended" when a legitimate ruler systematically violates the common good. Formal title remains, but protective conditions against private resistance are forfeited. Permission to resist is calibrated (proportionate, ordered to common good, institutional channels exhausted).
      *   **Goal:** Identify *genuine* counter-arguments that would collapse this position, specifically rooted in Aquinas's metaphysics of authority, law, and the common good.
      *   **Constraints:** No generic "it's too permissive" or "violates liberal norms" objections. Needs to be internal to Thomistic jurisprudence/metaphysics. Needs to address falsifiability/predictive content. Needs to distinguish between "awkward" and "decisive" objections.

  2.  **Deconstruct the User's "Graded Framework":**
      *   Core claim: Authority is a spectrum (or has a "suspended" state), not a binary.
      *   Mechanism: Systematic violation of common good $\rightarrow$ forfeiture of protective conditions $\rightarrow$ calibrated permission for private resistance.
      *   Safeguards: Proportionality, common good orientation, exhaustion of institutional channels.

  3.  **Brainstorming Thomistic Counter-Arguments (Internal Critique):**
      *   *Source of Authority:* For Aquinas, authority comes from God (Romans 13). Does human sin/corruption void divine mandate?
      *   *Nature of Law:* Law is an ordinance of reason for the common good. If a command violates the common good, is it law? (Lex iniusta non est lex). But does that make the *ruler* illegitimate or just the *command* void?
      *   *Public vs. Private:* Aquinas is very strict on the *agent* of resistance. Private individuals lack the *commission* to punish. Only public authority can punish a superior.
      *   *Usurpation vs. Tyranny:* Aquinas distinguishes *defectus tituli* (usurper) vs. *defectus exercitii* (tyrant). The user wants to blur this.
      *   *Metaphysics of Office:* Is the office distinct from the person? If the person corrupts the office, does the office cease to exist?
      *   *Scandal and Order:* Aquinas worries about the *consequences* of resistance (greater evil).

  4.  **Developing Specific "Collapse" Conditions:**

      *   *Objection 1: The Metaphysics of Office (Res vs. Persona).*
          *   Aquinas sees the *office* as divinely instituted, even if the *office-holder* is sinful.
          *   If authority is a participation in Divine Reason, can it be "partially suspended"? Or is it either a participation or it isn't?
          *   *Decisive Point:* If Aquinas holds that the *bond of obedience* is ontological based on the office, not conditional on performance, the graded view collapses.

      *   *Objection 2: The Agent of Punishment (Vindicative Justice).*
          *   Aquinas argues private individuals cannot kill tyrants because they lack the *commission* to wield the sword of justice.
          *   User says "protective conditions forfeited."
          *   *Counter:* It's not about protection; it's about *jurisdiction*. A private citizen *cannot* execute justice, regardless of the tyrant's sin. Only a "public authority" (which implies a superior or the body politic acting *as* a public entity) can.
          *   *Decisive Point:* If the prohibition is on the *act of private judgment/execution* itself (intrinsically disordered), not on the *target's status*, the graded view fails.

      *   *Objection 3: The Binary of Law (Lex Iniusta).*
          *   Aquinas says unjust commands need not be obeyed (unless to avoid scandal).
          *   But does disobedience equal permission to kill?
          *   *Decisive Point:* If the remedy for unjust law is *passive non-compliance*, not *active removal*, the graded view's "calibrated permission" for active resistance is unsupported.

      *   *Objection 4: The Risk of Greater Evil (Prudential Judgment).*
          *   Aquinas often argues against tyrannicide because it leads to worse tyranny.
          *   User says "calibrated."
          *   *Counter:* If the *presumption* is always against private action due to the inevitability of disorder, the "graded" permission is practically null.
          *   *Decisive Point:* If Aquinas's prudential calculus is structurally biased against private action (i.e., private action *always* creates more disorder than it solves), the theory has no room to operate.

      *   *Objection 5: Falsifiability/Predictive Content.*
          *   User asks about this specifically.
          *   If "partial suspension" is defined by the *outcome* (was it good for the common good?), it's post-hoc rationalization.
          *   *Decisive Point:* If there are no *ex-ante* criteria for "partial suspension" other than the success of the resistance, it's unfalsifiable.

  5.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the sophistication of the proposal. It's a "functionalist" reading vs. an "ontological" reading.
      *   **Section 1: The Metaphysics of Office (Ontological vs. Functional).** Focus on *De Regno*. Is authority a substance or a function?
      *   **Section 2: The Jurisdictional Bar (Private vs. Public).** Focus on *Summa Theologiae* II-II, Q. 42 & Q. 69. The issue isn't the tyrant's status, but the resistor's lack of commission.
      *   **Section 3: The Binary of Law and Obedience.** *Lex iniusta*. Does it void authority or just the specific command?
      *   **Section 4: The Problem of Falsifiability.** Address the "calibrated permission" risk.
      *   **Section 5: Decisive vs. Awkward.** Categorize the objections.
      *   **Conclusion:** Summary of the stakes.

  6.  **Refining the Arguments (Self-Correction/Nuance):**
      *   *Check:* Did I avoid liberal norms? Yes.
      *   *Check:* Am I engaging with *De Regno* and *ST*? Yes.
      *   *Nuance:* The user mentions "public authority" resistance is okay in the standard view. The user wants to allow *private* action under "suspended" conditions. I need to focus heavily on why Aquinas thinks *private* action is intrinsically problematic regardless of the ruler's sin.
      *   *Key Text:* *De Regno* I.6 is the main battleground. Also *ST* II-II, Q. 42 (Sedition) and Q. 69 (Judgment).
      *   *Crucial Distinction:* Aquinas allows for *public* deposition (by a superior or the community acting as a whole). The user wants to allow *private* action under certain conditions. This is the weakest link in the user's armor. Aquinas is very worried about *private presumption*.

  7.  **Drafting the Content (Iterative refinement):**
      *   *Metaphysics:* Authority as participation in Eternal Law. If the ruler deviates, do they cease to participate? Aquinas suggests they become a "robber" (usurper) only if they lack title. If they have title, they remain God's minister, even if wicked (like Pharaoh). This is a strong theological objection.
      *   *Jurisdiction:* The sword belongs to the *office*. A private person taking it is sedition, even if the target is bad. Sedition is a mortal sin.
      *   *Falsifiability:* If the criteria for "suspension" are vague (systematic, structural), any successful assassin can claim the conditions were met.

  8.  **Final Polish:** Ensure tone is academic, rigorous, and directly answers the specific prompts (what counts against, conceptual commitments, decisive vs. awkward, falsifiability). (Self-correction: Make sure to explicitly mention *De Regno* and the distinction between *ex defectu tituli* and *ex parte exercitii*.)

  9.  **Final Review against constraints:**
      *   No liberal norms? Checked.
      *   Focus on Aquinas's metaphysics? Checked.
      *   Address falsifiability? Checked.
      *   Distinguish decisive/awkward? Checked.

