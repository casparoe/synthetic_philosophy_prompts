answer: |-
  This is a sophisticated reconstruction that attempts to solve the notorious tension in Aquinas between the prohibition of sedition (*ST* II-II, q. 42) and the allowance for removing tyrants (*De Regno* I.6). Your "graded framework" moves away from an ontological binary (legitimate vs. usurper) toward a functionalist spectrum (authority suspended based on performance).

  To test this rigorously within a Thomistic framework, we must look for internal contradictions regarding the **metaphysics of office**, the **nature of jurisdiction**, and the **logic of law**. Here are the specific features of Aquinas's account that, if held strictly, would cause your graded framework to collapse, categorized by their decisive weight.

  ### 1. The Metaphysics of Office: Ontological vs. Functional Authority
  **The Objection:** Aquinas's metaphysics of authority is fundamentally ontological, not functional. Authority is a participation in the Divine Reason (Eternal Law). While the *exercise* of authority can be sinful, the *office itself* remains a divine institution.

  **Why it threatens your view:** Your framework relies on the idea that authority can be "partially suspended" based on the ruler's actions (functionalism). However, in *De Regno* and his commentary on Romans, Aquinas suggests that even a wicked ruler retains authority *qua* ruler because the office is ordained by God for the order of the universe.
  *   **The Collapse Condition:** If Aquinas holds that the bond of obedience is attached to the *office* (which remains intact regardless of the occupant's moral state) rather than the *occupant's moral performance*, then there is no state of "partial suspension." The ruler is either a usurper (*defectus tituli*) or a tyrant (*defectus exercitii*). In the latter case, the authority remains real, and the obligation to obey remains, unless the command specifically contradicts Divine Law.
  *   **Decisive Text:** *De Regno* I.6 distinguishes sharply between a ruler who lacks title (whom anyone may repel) and a ruler who has title but acts tyrannically. For the latter, Aquinas does not suggest a "suspension" of authority that permits private action; he suggests recourse to a *superior* public authority. If no superior exists, he advises prayer and patience, warning that overthrowing such a tyrant often leads to greater tyranny.
  *   **Verdict:** **Decisive.** If the authority is divinely anchored in the office irrespective of moral performance, the "forfeiture of protective conditions" is metaphysically impossible. The protection isn't based on the ruler's goodness; it's based on the divine origin of the order.

  ### 2. The Jurisdictional Bar: The Nature of the Sword
  **The Objection:** The prohibition on private tyrannicide is not primarily about the *target's* status, but the *agent's* lack of commission.

  **Why it threatens your view:** You argue that systematic corruption forfeits the conditions prohibiting private resistance. However, Aquinas's prohibition in *ST* II-II, q. 42, a. 2 (on sedition) and q. 69 (on judgment) is rooted in the nature of vindicative justice. Only public authority possesses the "sword of justice."
  *   **The Collapse Condition:** If the prohibition against private killing is intrinsic to the act (because a private individual lacks the *commission* to judge and execute), then the ruler's corruption is irrelevant. A private citizen cannot execute justice upon a superior not because the superior is "protected," but because the inferior lacks the *jurisdictional capacity* to act as an agent of the common good in that specific mode.
  *   **Conceptual Commitment:** Aquinas distinguishes between *resistance* (defensive) and *punishment* (vindictive). Tyrannicide is usually an act of punishment. If Aquinas views the sword as exclusively public by metaphysical necessity (not just prudential policy), your "calibrated permission" for private action collapses into sedition.
  *   **Verdict:** **Decisive.** If the barrier is jurisdictional (who acts) rather than conditional (against whom one acts), the graded status of the ruler cannot unlock private permission.

  ### 3. The Binary of Law: *Lex Iniusta* vs. Void Authority
  **The Objection:** Aquinas's theory of unjust law (*ST* I-II, q. 96, a. 4) allows for disobedience to specific commands, but not necessarily resistance to the legislator.

  **Why it threatens your view:** You argue that structural violation of the common good suspends authority. Aquinas argues that a law contrary to the common good is "no law" (*lex iniusta non est lex*). However, he limits the consequence to *non-obligation in conscience* regarding that specific act, not a general license to remove the legislator.
  *   **The Collapse Condition:** If the voiding of a law does not equate to the voiding of the legislative power, your framework conflates *illegal commands* with *illegitimate rule*. Aquinas permits disobeying a command to worship idols; he does not permit killing the emperor who commands it (unless acting under public commission).
  *   **Verdict:** **Awkward but potentially manageable.** You could argue that sustained *lex iniusta* constitutes a de facto usurpation. However, Aquinas explicitly reserves the "usurper" label for those without title, not those with title who rule badly. To maintain this, you must argue that sustained tyranny *becomes* usurpation. Aquinas resists this linguistic and conceptual move.

  ### 4. The Problem of Falsifiability and Prudential Judgment
  **The Objection:** Your framework relies on "calibrated permission" dependent on whether resistance serves the common good and exhausts institutional channels. This risks becoming a post-hoc rationalization.

  **Why it threatens your view:** In normative theory, if the criteria for permission are entirely dependent on complex prudential judgments (e.g., "is the corruption structural?", "are channels exhausted?"), the theory loses predictive content. Any successful assassin can claim the conditions were met; any failed one can claim they were not.
  *   **The Collapse Condition:** If there are no *ex-ante* formal criteria for "partial suspension" other than the *outcome* of the resistance (i.e., did it actually help the common good?), the theory is unfalsifiable. Aquinas tries to avoid this by setting a bright line: Private action = Sedition (almost always).
  *   **Specific Risk:** Aquinas places a heavy burden on the *danger of scandal* and *greater evil*. In *De Regno*, he argues that even against a tyrant, private action is usually illicit because it risks greater disorder. If this prudential presumption is structural to his ethics (i.e., private judgment is inherently prone to passion and error), then a "graded" permission is practically null.
  *   **Verdict:** **Damaging.** If the "graded" criteria are so flexible that they cannot rule out any specific case of resistance *before* the fact, the theory fails as a guide to action. Defenders of the graded view would have to concede that without rigid procedural hurdles (e.g., a formal declaration by a representative body), the "suspension" clause is inert.

  ### Summary: Decisive vs. Awkward Objections

  | Objection | Type | Why it matters |
  | :--- | :--- | :--- |
  | **Jurisdictional Bar** | **Decisive** | If private individuals *cannot* wield the sword of justice by nature, the ruler's moral status is irrelevant. The act is intrinsically disordered. |
  | **Ontological Office** | **Decisive** | If authority is a divine participation attached to the office, it cannot be "suspended" by human sin. Only God removes it. |
  | **Unjust Law Binary** | **Awkward** | You can argue sustained unjust law *becomes* usurpation, but Aquinas explicitly distinguishes *defectus tituli* from *defectus exercitii*. |
  | **Falsifiability** | **Damaging** | If "suspension" is defined by success/outcome, the theory is circular. It needs *ex-ante* formal criteria (e.g., public declaration) to work. |

  ### Recommendation for Defense
  To save the graded framework, you must concede ground on **private** action. Aquinas is likely insurmountable on the point that a *private individual* (acting on private authority) cannot kill a legitimate title-holder, regardless of corruption.

  However, your framework might survive if you reinterpret "private action."
  1.  **Redefine "Public":** Argue that when a ruler systematically violates the common good, authority "reverts" to the community (*potestas residet in populo*). Therefore, resistance by community leaders is not "private" but "public" authority re-asserting itself. This aligns with the *Vindicatio* tradition (e.g., Suarez, later Jesuits) which builds on Thomistic seeds.
  2.  **Shift from Punishment to Defense:** Argue that the act is not *tyrannicide* (punishment) but *defense* against an aggressor. If the ruler attacks the common good, he becomes an aggressor, and the right of defense is not limited to public authority.
  3.  **Address Falsifiability:** You must establish formal *ex-ante* criteria for "suspension." For example: "Authority is suspended only when a representative body (estates, senate, elders) formally declares the ruler to have forfeited protection." Without this institutional trigger, your view collapses into subjectivism.

  **The Decisive Test:** Can you find a text where Aquinas permits a *private individual* (without public commission) to kill a ruler who holds a *legitimate title* but rules tyrannically? If not, your "graded" view must admit it is a *development* of Thomism (filling a gap) rather than a strict *reconstruction* of his explicit intent. Aquinas explicitly leaves the "no human remedy" case to God. Your framework claims there is a human remedy in the "suspended" zone. That is the point of fracture.
