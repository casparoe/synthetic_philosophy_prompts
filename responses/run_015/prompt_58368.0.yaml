answer: |-
  Here is my breakdown. I'm landing at an overall credence of **0.55**.

  I am slightly more skeptical than you (0.65) but much less skeptical than your girlfriend (0.2). I think the data is real, but the moral interpretation is fragile.

  Here is the decomposition:

  ### a) The Empirical Trend (Lethal Human Violence)
  **Credence: 0.90**
  **Why:** The statistical signal here is surprisingly robust. Whether you look at homicide rates in Europe over 500 years, battle deaths per capita over 70 years, or tribal warfare estimates vs. state societies, the long-term downward slope in *lethal human-on-human violence* is hard to deny. Data from sources like *Our World in Data* and the Uppsala Conflict Data Program generally support the claim that an individual human is statistically less likely to die violently today than in the past.
  **Impact:** This is the strongest pillar of your argument.

  ### b) The Metric (Per-Capita vs. Total Suffering)
  **Credence: 0.65**
  **Why:** Per-capita is the right metric for *individual safety* (your risk of dying), but it is a potentially misleading metric for *moral progress*. If the population grows 10x and the violence rate drops 5x, individual risk is halved, but the total amount of grieving widows and orphans has doubled. Moral calculus usually cares about the aggregate sum of suffering, not just the probability distribution.
  **Impact:** This dilutes the "progress" claim. The world is safer for *you*, but not necessarily "less violent" in the aggregate.

  ### c) The Scope (What counts as violence?)
  **Credence: 0.30**
  **Why:** This is the biggest leak in the bucket. The "decline of violence" thesis (à la Steven Pinker) relies heavily on a narrow definition: intentional, lethal, physical force between humans. If you expand the scope to include:
  1.  **Factory Farming:** The number of animals slaughtered industrially dwarfs all human violent death in history. If animals count, violence is skyrocketing.
  2.  **Domestic/Child Abuse:** Historically invisible and legally permitted. Reporting is up, which looks like more violence, but might just be visibility. We lack the data to say it's down.
  3.  **Structural Violence:** Deaths from preventable poverty or policy-induced famine.
  Once you expand the definition beyond "battlefield and homicide," the trend line flattens or reverses.
  **Impact:** This drastically lowers the credence that the world is "morally" less violent.

  ### d) Fact vs. Definition (Is there a fact of the matter?)
  **Credence: 0.55**
  **Why:** Your girlfriend calls it a "definitional trick," and she is partially right. "Violence" is not a natural kind like "gravity"; it is a moral category. Deciding whether a drone strike is "violence" but a starvation sanction is "policy," or whether killing a cow is "agriculture" or "violence," is a normative choice, not an empirical one. However, it's not *just* a trick; there are physical realities (dead bodies) that anchor the definition.
  **Impact:** This introduces fundamental uncertainty. We aren't just measuring the world; we are measuring our definitions.

  ---

  ### How This Aggregates to 0.55

  I treat this as a weighted average where the **Scope (c)** and **Metric (b)** act as discount factors on the **Empirical Trend (a)**.

  *   **Base Signal:** The data on lethal human violence is strong (0.90).
  *   **Discount 1:** But total suffering matters, not just risk (lowers confidence to ~0.75).
  *   **Discount 2:** But "violence" likely includes non-lethal and non-human suffering, where trends are unclear or negative (lowers confidence to ~0.55).
  *   **Final Adjustment:** Acknowledging that "violence" is partly definitional means we can't be 100% certain of the claim's truth value independent of our moral framework (settles at 0.55).

  **Result:** I am slightly more likely than not to agree that the world is less violent, but it is essentially a coin flip dependent on how you define the moral boundary.

  ---

  ### The Gap Between You (0.65) and Her (0.2)

  **Component (c) — The Scope of Violence — explains 80% of your disagreement.**

  *   **You** are implicitly accepting the standard criminological/political science definition of violence (lethal, physical, human). Under that definition, she is objectively wrong, and your 0.65 is defensible.
  *   **She** is implicitly using a broader sociological or ethical definition (structural, domestic, psychological, perhaps animal). Under that definition, you are overlooking massive categories of suffering, and her 0.2 is defensible.

  You are arguing about **data**; she is arguing about **ontology**. You are measuring the temperature of the room; she is asking why you aren't counting the fire in the basement.

  ### What Evidence Would Move My Number?

  To move my number significantly (either toward 0.8 or 0.3), I would need **proxy data for hidden violence.**

  1.  **Moving me UP (toward your view):** Robust historical anthropology showing that pre-state societies had vastly higher rates of *non-lethal* mutilation, torture, and domestic coercion than modern states. If we could prove that the "peace" of the modern state extends to the private sphere (e.g., via child abuse rates or spousal autonomy), my number goes up.
  2.  **Moving me DOWN (toward her view):** A consensus moral framework that successfully quantifies **animal suffering** relative to human suffering. If we accept that a factory-farmed chicken's suffering counts as 0.1x of a human's violent death, the sheer volume of industrial slaughter mathematically overwhelms the decline in human homicide, making the "world is less violent" claim objectively false.

  **Summary Advice:** Stop arguing about the homicide stats. You win on the stats. She wins on the definition. Agree on what "violence" means first, then check the numbers.
