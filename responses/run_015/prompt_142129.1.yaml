answer: |-
  Nexus Corp (Agent 1) and OpenDev (Agent 2) dispute the licensing of a critical software library. Nexus moves first, publicly committing to a costly legal defense of proprietary rights (Deep: high reputational and financial reversal cost). OpenDev moves second, committing to release the decryption key online (Shallow: trivial to delete the post, low reversal cost). OpenDev releases the key. Nexus honors its commitment and sues, but the information persists via mirrors (High Restorability Cost). The code becomes de facto open source. Nexus incurs legal costs without securing exclusivity. OpenDev achieves its preferred outcome. Nexus would have preferred accepting open licensing ex ante to wasting resources on futile litigation.

  **Demonstration**
  **Payoffs:** Nexus: Proprietary (1) > Open/No Suit (2) > Open/Suit (3) > Conflict Escalation (4). OpenDev: Open (1) > Proprietary/Compromise (2) > Proprietary (3) > Suppressed (4).
  **Timing:** t0: Status quo. t1: Nexus commits to sue. t2: OpenDev commits to leak. t3: OpenDev leaks; Nexus sues.
  **Why Deep Fails:** Nexus's commitment binds them to *fight*, not to *win*. The fight cannot restore secrecy.
  **Load-Bearing Feature:** The asymmetry between Reversal Cost (low for OpenDev) and Restorability Cost (infinite for Nexus).
  **Ablation:** If information were perfectly revocable (low restorability cost), Nexus's suit would force OpenDev to reverse, and Nexus would win.
  **Objection:** "Nexus's commitment wasn't credible if they lost." **Reply:** Credibility concerns the action (suing), not the outcome (winning). They sued, honoring the commitment, but the commitment was strategically misaligned with the physics of information.
  **Cheating Audit:**
  1. *Irrationality:* Avoided. Nexus sues because not suing violates their deep commitment; they lose because the suit is futile, not because they are irrational.
  2. *Hidden Depth:* Avoided. OpenDev's ability to delete the post is public knowledge; the persistence of copies is a structural fact, not a hidden resource.
  3. *Resources:* Avoided. OpenDev wins via information physics, not budget superiority.
  4. *Redefining Win:* Avoided. OpenDev gets Open Code (stated preference); Nexus gets Open Code + Debt (stated loss).

