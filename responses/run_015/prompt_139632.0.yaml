  ### Part III: The Discriminating Case

  You proposed a probe: *Hold the gift, donor, and gratitude fixed, but vary whether the recipient will ever again have any discretion over the giver.*

  **Evaluation of Your Probe:**
  This is a **strong probe**, but it does not fully separate the surviving rules.
  *   *Rule 1 (Temporal)* says: If discretion is past-only, it's fine.
  *   *Rule 4 (Dependency)* says: Even if discretion is past-only, if the dependency (health) continues, it might still be corrupt.
  *   *Rule 3 (Public)* says: If it's public, it might be fine regardless.
  *   *Why it's insufficient:* It doesn't test the *nature* of the gift. A ram is different from cash.

  **A Better Probe:**
  **Hold the forward-looking discretion fixed (Chair re-ranks in 9 months) and vary whether the transfer is one our local gift code recognizes at all.**
  *   *Case A:* The family presents the **Ram** (customary thanksgiving).
  *   *Case B:* The family presents **Cash equivalent to the Ram** (market value).
  *   *Case C:* The family presents a **Scholarship for the Chair's child** (modern asset).

  **Predictions:**
