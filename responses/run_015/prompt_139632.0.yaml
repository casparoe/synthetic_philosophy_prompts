  *   **Rule 3 (Public/Collective):** Case A is Permissible (ritual); Case B & C are Corruption (private asset transfer).
  *   **Rule 4 (Dependency):** All three are Corruption (future discretion exists).

  **Why this is better:** This probe isolates **Precedent 5** from **Precedent 4**. P5 was a goat/cloth (customary); P4 was a scholarship (modern asset). If the committee bans the Cash (Case B) but allows the Ram (Case A), they are admitting that **corruption is defined by the violation of social norms, not just the transfer of value.** This forces the committee to admit whether they are protecting *impartiality* or protecting *propriety*.

