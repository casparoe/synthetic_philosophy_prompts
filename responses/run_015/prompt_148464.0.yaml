prompt: |-
  I'm trying to figure out how to spend the next couple years on philosophy of time, specifically presentism versus eternalism, and I keep going in circles. My advisor wants me to narrow down, but every time I think I've found a real open problem it turns out people have been saying the same thing since the 90s. Meanwhile my roommate studies archives and she kept talking about how a database doesn't store "yesterday" as an existing thing, it just stores present records with old timestamps - so maybe presentists could borrow that model for how we access the past without saying the past literally exists? I'm not sure if that's a real research line or just a metaphor that sounds cool.

  Anyway, I need someone to tell me: among the current open questions in this area - like whether temporal passage is metaphysically real, whether presentism can be made consistent with special relativity without cheating, or this kind of "information-archiving" analogy for epistemic access - which ones actually matter most? If I only have about three years and my background is logic rather than physics, which two or three should I prioritize? Give me a defended ordering: what's upstream of what, how tractable is each without heavy physics, and which ones are basically dead ends people keep recycling. I also want you to seperate what's genuinely settled among specialists from what's actually contested, and don't present a contested position as if it's the consensus. I need criteria, not just a list - like, would solving this change other debates, is it neglected, or is it just wheel-spinning?
reasoning: |-
  Here's a thinking process that leads to the suggested advice:

