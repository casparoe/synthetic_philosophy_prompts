answer: |-
  # Comparative Framing Protocol (CFP)
  **For:** Curriculum Coordinators, Lead Docents, Education Staff
  **Purpose:** To evaluate proposed comparisons between the Holocaust/20th-century mass violence and other historical or contemporary events.
  **Goal:** Prevent "flattening" (erasing specificity) while allowing "illumination" (structural insight).
  **Time:** 15 Minutes

  ---

  ## PART 1: THE DECISION PROCEDURE

  Run through these four gates in order. If you hit a **STOP**, the proposal is rejected. If you hit **YELLOW**, it requires heavy framing conditions. If you clear all gates, it is **APPROVED**.

  ### GATE 1: TYPE OF COMPARISON
  **Question:** What is the primary link being drawn between Event A (e.g., Holocaust) and Event B (e.g., Rwanda, Detention, etc.)?

  *   **Option A: Moral Equivalence.** (e.g., "This is just like that," "They are the same crime.")
      *   **DECISION:** **STOP.**
      *   *Reasoning:* Moral equivalence implies identical intent, context, and outcome. This erases historical specificity and triggers the *Historikerstreit* relativization risk.
  *   **Option B: Emotional/Experiential.** (e.g., "Victims felt the same fear," "Build universal empathy.")
      *   **DECISION:** **YELLOW.** Proceed to Gate 2, but flag for Ethics Board review (see Part 3).
      *   *Reasoning:* Emotions are universal, but causes are not. Focusing only on feeling risks de-historicizing the violence.
  *   **Option C: Structural/Causal/Mechanism.** (e.g., "Both used rail logistics," "Both utilized bureaucratic distancing.")
      *   **DECISION:** **GO.** Proceed to Gate 2.
      *   *Reasoning:* Comparing *how* things happened is safer than comparing *what* they mean morally, provided specificity is kept.

  ### GATE 2: SPECIFICITY PRESERVATION
  **Question:** Does the comparison preserve the specific ideological and historical core of the Holocaust (or primary event), or does it collapse them into a generic template?

  *   **Checklist:**
      1.  Is the specific ideological intent (e.g., antisemitic exterminationism) named explicitly?
      2.  Is the specific outcome (e.g., industrialized murder vs. displacement) distinguished?
      3.  Does the comparison acknowledge differences in scale and state capacity?
  *   **If NO to any of the above:**
      *   **DECISION:** **STOP.**
      *   *Reasoning:* This violates the "Uniqueness" safeguard. You are turning a specific historical crime into a vague metaphor for "badness."
  *   **If YES to all:**
      *   **DECISION:** **GO.** Proceed to Gate 3.

  ### GATE 3: THE BAUMAN CHECK (MODERNITY & BUREAUCRACY)
  **Question:** How is the role of modern systems (bureaucracy, rationality, technology) being described?

  *   **Trap 1: "Bureaucracy causes genocide."** (Implying paperwork itself is the villain.)
      *   **DECISION:** **STOP.**
      *   *Correction:* Bureaucracy *enables* genocide when wedded to specific ideological goals. It is not the sole cause.
  *   **Trap 2: "All modern states do this."** (Implying the Holocaust proves all modern governance is inherently genocidal.)
      *   **DECISION:** **STOP.**
      *   *Reasoning:* This is a misuse of Bauman. Modernity created the *capacity*, not the *inevitability*.
  *   **Correct Usage:** "Rational systems can be hijacked by ideological goals to distance perpetrators from victims."
      *   **DECISION:** **GO.** Proceed to Gate 4.

  ### GATE 4: AUDIENCE COGNITIVE LOAD
  **Question:** Can the target audience (e.g., 8th graders) hold the comparison and the distinction simultaneously?

  *   **Test:** If you explain the comparison, do you have to spend more than 50% of the time explaining why they are *different*?
  *   **If YES (More time on differences):**
      *   **DECISION:** **YELLOW.** Requires heavy framing conditions.
      *   *Condition:* The lesson plan must lead with difference, follow with mechanism, and conclude with specific historical outcomes.
  *   **If NO (Balance is manageable):**
      *   **DECISION:** **APPROVED.**

  ---

  ## PART 2: ETHICS BOARD FLAGS (VALUES, NOT FACTS)

  Even if a proposal passes the gates above, send it to the Ethics Board if it triggers any of these **Value Judgments**:

  1.  **Contemporary Political Equivalence:** Comparing historical genocide to current partisan political issues (e.g., specific immigration policies, abortion, vaccine mandates). *Fact:* You can compare bureaucracies. Value:* Equating current policy with extermination is a political claim, not a historical one.
  2.  **Hierarchy of Suffering:** Any implication that one victim group's suffering validates or invalidates another's.
  3.  **The "Universal Empathy" Trap:** Proposals that aim solely for "feeling" without "understanding cause." (See Proposal B below).

  ---

  ## PART 3: APPLICATION TO PROPOSALS

  Here is how the CFP applies to your three current drafts.

  ### PROPOSAL A: Deportation Train Logistics (Holocaust vs. Armenian Genocide)
  *   **Gate 1 (Type):** Structural/Causal. (Logistics/Coordination). **GO.**
  *   **Gate 2 (Specificity):** Does it name the specific intent for each? (e.g., Ottoman elimination of Armenians vs. Nazi extermination of Jews). If the lesson plan names both specific ideologies and distinguishes the industrial scale of the Holocaust vs. the death march/transport nature of the Armenian genocide: **GO.**
  *   **Gate 3 (Bauman):** Is it claiming "trains kill people"? No, it claims "states used trains to manage mass movement." **GO.**
  *   **Gate 4 (Load):** Can students handle two genocides at once? **YELLOW.**
  *   **VERDICT:** **APPROVED WITH HEAVY FRAMING.**
      *   *Condition:* Must explicitly state that while the *method* (rail) is similar, the *ideological contexts* differ. Do not merge the timelines.

  ### PROPOSAL B: Survivor Testimony Pairing for "Universal Empathy"
  *   **Gate 1 (Type):** Emotional/Experiential. ("Universal empathy for victims"). **YELLOW.**
  *   **Gate 2 (Specificity):** **FAIL.**
      *   *Reasoning:* The goal "Universal Empathy" inherently flattens specificity. If the takeaway is "suffering is the same," the specific *reason* for the suffering (antisemitism, colonialism, etc.) is erased. This turns victims into generic symbols of pain.
  *   **Gate 3 (Bauman):** N/A.
  *   **Gate 4 (Load):** High risk of emotional overwhelm without historical grounding.
  *   **VERDICT:** **REJECTED.**
      *   *Why:* This is the "well-meaning" trap. It sounds good ("empathy") but violates the core museum mission to teach *history*, not just emotion. It collapses distinct historical crimes into a generic "human rights violation" template.
      *   *Fix:* Change goal from "Universal Empathy" to "Understanding how different ideologies target different groups." If you cannot change the learning objective, do not run the workshop.

  ### PROPOSAL C: Bauman/"Modern Office Work" -> Immigration Detention
  *   **Gate 1 (Type):** Structural/Causal. **GO.**
  *   **Gate 2 (Specificity):** **FAIL.**
      *   *Reasoning:* The prompt states the script applies the frame "without ever mentioning Jewish specificity." This is a hard violation of Gate 2. You cannot explain the Holocaust as "office work" without explaining *why* the office work was happening (antisemitic extermination).
  *   **Gate 3 (Bauman):** **FAIL.**
      *   *Reasoning:* This misuses Bauman to imply "modern office work enables killing" as a universal rule, leading to the conclusion that modern immigration detention is functionally identical to the Holocaust. This is Moral Equivalence disguised as Structural Analysis.
  *   **VERDICT:** **REJECTED (HARD STOP).**
      *   *Why:* Erases the ideological core of the Holocaust and makes a contested political equivalence regarding current policy.

  ---

  ## PART 4: LIMITATIONS & VULNERABILITIES

  **Where this tool breaks down:**
  1.  **Vague Language:** A clever docent can game Gate 2 by using "code words." (e.g., saying "targeted population" instead of "Jews," or "state security" instead of "antisemitism"). *Mitigation:* Require scripts to be reviewed for specific nouns, not just verbs.
  2.  **Student Reaction:** Gate 4 assumes we know what students can handle. They might fixate on the comparison even if you frame the difference. *Mitigation:* Post-tour assessment is required for all YELLOW flag lessons.
  3.  **The "Never Again" Pressure:** Teachers want "lessons for today." This tool may reject lessons that feel "relevant" but are historically shaky. *Mitigation:* You must be prepared to tell teachers "No" when they ask for relevance that violates Gate 2.

  **What this tool CANNOT do:**
  1.  **Solve Political Disputes:** It cannot determine if a current policy *is* unjust. It only determines if comparing it to the Holocaust is historically sound.
  2.  **Replace Expertise:** It is a filter, not a historian. If a docent doesn't know the history, the checklist won't save them.
  3.  **Prevent Offense:** A historically accurate comparison can still offend. This tool ensures accuracy, not comfort.

  **Final Instruction:** If a proposal hits a **STOP**, do not try to "fix" it yourself. Return it to the proposer with the specific Gate failure cited. If it hits an **ETHICS FLAG**, do not decide alone. Escalate.
