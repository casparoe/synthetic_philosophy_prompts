answer: |-
  This is a fantastic snapshot of a live debate in contemporary decision theory. What you overheard between Maya and David is essentially a distilled version of the clash between **Causal Decision Theory (CDT)** and **Functional/Evidential Decision Theory (FDT/EDT)**, applied to cosmology.

  Neither is "wrong" in a way that suggests they don't understand the math; rather, they are operating from different metaphysical premises about what a "decision" actually *is*. However, there are specific technical points where one of them is clearly on firmer ground than the other.

  Here is a point-by-point breakdown of who holds the stronger position.

  ### 1. The Causality Objection
  **Maya:** "You can't cause something to happen by being correlated with it... The money is gone."
  **David:** "The correlation does the work even without a causal channel."

  *   **Who is right:** **Maya is physically right; David is decision-theoretically right.**
  *   **Analysis:** Maya is correct from the standpoint of physics and Causal Decision Theory. In a block universe or standard relativistic framework, there is no mechanism by which your button press *forces* the alien's hand. If you are a Causal Decision Theorist, you only care about consequences you can physically influence. By that metric, sending the money is strictly a loss.
  *   **Where David stands:** David is arguing from Evidential or Functional Decision Theory. In these frameworks, you don't maximize causal impact; you maximize the *expected utility of the output of your decision algorithm*. If your algorithm outputs "cooperate," and a sufficiently similar algorithm elsewhere outputs "cooperate," the universe contains more cooperation. David is right that if you accept the premise that "I am my algorithm," then coordinating with copies of that algorithm yields higher global utility, even without causal signals.
  *   **Verdict:** Maya wins on intuition and physics. David wins on internal consistency *if* you accept non-causal decision theory.

  ### 2. The Newcomb Distinction
  **Maya:** "In Newcomb's problem... There's a causal arrow from my decision procedure to the contents of the box, through the predictor's model. In the alien case there's... no causal arrow at all."
  **David:** "The mechanism that produces the correlation doesn't matter."

  *   **Who is right:** **David is technically right; Maya is mistaken about Newcomb.**
  *   **Analysis:** This is the weakest point in Maya's argument. In Newcomb's Problem, by the time you stand in front of the boxes, the predictor has *already left*. The money is already in the box (or not). There is **no causal arrow** from your current choice to the contents of the box, just as there is no causal arrow to the alien.
  *   **The Nuance:** The correlation in Newcomb's exists because the predictor simulated your *decision procedure* in the past. The correlation in ECL exists because the alien is running a similar *decision procedure* now.
  *   **Functional Decision Theory (FDT):** This is David's strongest theoretical ground. FDT argues that what matters is **subjunctive dependence**. If two systems compute the same logical function, their outputs are logically linked, regardless of spatial separation or time. Whether that link is established via a past simulation (Newcomb) or shared logical structure (ECL) is irrelevant to the math of the decision.
  *   **Verdict:** **David.** Maya's distinction here is a common misconception. Newcomb's is also "acausal" in the physical sense. The link is logical, not physical, in both cases.

  ### 3. Breakfast Preferences vs. Decision Procedures
  **Maya:** "If I find out that someone... has the same breakfast preferences as me, should I start sending them money?"
  **David:** "The correlation has to run through the decision procedure itself."

  *   **Who is right:** **David.**
  *   **Analysis:** Maya is attempting a *reductio ad absurdum*, but David correctly identifies the constraint. This is the **Reference Class Problem**. Evidential cooperation only works if the correlation is in the *reasoning process*, not just the outcome.
  *   **Why it matters:** If you and an alien both like eggs, that's a correlation in *preferences*. If you and an alien both use "Tit-for-Tat" logic to decide whether to send money, that's a correlation in *algorithms*. ECL relies on the latter. If I decide to cooperate, and I know my algorithm is "Cooperate with similar algorithms," then logically, a similar algorithm must also decide to cooperate. Breakfast preferences do not update the probability of the alien's *decision procedure* outputting "send money."
  *   **Verdict:** **David.** He correctly identifies that the correlation must be *logical* (about the code), not merely *empirical* (about the output).

  ### 4. Epistemic Uncertainty ("How do I know?")
  **Maya:** "How do I know the alien is implementing my policy? I'm just guessing."
  **David:** "You don't need certainty. You just need the correlation to be strong enough."

  *   **Who is right:** **Maya (practically); David (theoretically).**
  *   **Analysis:** Maya hits on the **Problem of Similarity**. In Newcomb's, we are told the predictor is 99.9% accurate. In ECL, we have to estimate the probability that a random agent in a large universe shares our specific decision algorithm.
  *   **The Risk:** If you overestimate similarity, you get exploited by defectors. If you underestimate it, you lose gains from trade. David is right that you don't need 100% certainty, but Maya is right that the prior probability of a random alien sharing your specific FDT algorithm might be vanishingly small.
  *   **Verdict:** **Draw.** David is right about the threshold principle, but Maya is right that the epistemic burden is incredibly high.

  ### 5. Large Worlds and Pascal's Mugging
  **Maya:** "Now you're just multiplying small probabilities by infinity... That's Pascal's mugging territory."
  **David:** "In a sufficiently large universe, even a tiny correlation across a huge number of counterpart agents makes cooperation the dominant strategy."

  *   **Who is right:** **Maya.**
  *   **Analysis:** This is the most dangerous part of David's argument and the strongest critique in the literature.
  *   **The Math:** David is mathematically correct that $Expected Value = Probability \times Payoff$. If the Payoff is infinite (or the number of agents is infinite), even a tiny Probability dominates the calculation.
  *   **The Pathology:** This leads to **fanaticism**. If you accept David's logic, you should sacrifice certain, finite goods in the near term for a tiny probability of influencing an infinite number of agents. This makes you vulnerable to "Pascal's Mugging," where a stranger claims, "Give me $5 or I will use my magic powers to torture 3^^^^3 people in another universe."
  *   **Cluelessness:** In a large world, your actions might have infinite positive expected value *and* infinite negative expected value (e.g., maybe your cooperation triggers a war in another sector). If both are infinite, the expected value is undefined. This is known as the problem of **cluelessness**.
  *   **Verdict:** **Maya.** David's move here is theoretically consistent but practically pathological. Most decision theorists (even FDT proponents) agree that you need some sort of "complexity penalty" or prior cutoff to prevent small probabilities of infinite stakes from dominating all decision-making.

  ### Summary: Who Won the Bar Bet?

  **Maya** is the stronger skeptic. While she misunderstands the mechanics of Newcomb's Problem (thinking it involves causal arrows when it doesn't), her intuition about **epistemology** and **risk** is superior. She correctly identifies that without a way to verify the similarity of the alien's algorithm, and without a cap on infinite expected values, David's view leads to madness (Pascal's Mugging).

  **David** is the stronger logician *within the system*. He correctly identifies that the physical mechanism of correlation (simulation vs. shared logic) doesn't matter for Functional Decision Theory. He is right that if the correlation exists, the rational move is to cooperate. However, he glosses over the immense difficulty of establishing that correlation exists in the first place.

  **The Magazine Takeaway:**
  If you write this up, the core tension isn't about aliens; it's about **what kind of thing you think you are.**
  *   If you think you are a **physical body** acting in spacetime (Maya/CDT), ECL is magic.
  *   If you think you are a **pattern of reasoning** instantiated in multiple places (David/FDT), ECL is just coordination.

  Maya is right that adopting David's view requires swallowing some very large, potentially dangerous pills regarding infinity and probability. But David is right that if you *do* swallow them, the math holds together better than Maya gives it credit for. The Newcomb distinction she tried to draw, however, definitely does not hold up.
