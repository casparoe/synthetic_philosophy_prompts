answer: |-
  1. "Candidate principles"

  First, **Ontological Realism**: A pattern is real iff a description compresses the data significantly and supports counterfactuals that hold independent of any observer's capacity to find them. This secures Case 9 without requiring findability.

  Second, **Pragmatic Entitlement**: You are entitled to adopt a stance iff it offers the optimal trade-off between predictive accuracy and computational cost for a situated agent. This handles the Cat vs. Engine distinction based on opacity and cost.

  Third, **Your Repaired Principle**: Split your view. Reality requires compression plus mind-independent stability (resolving 8 vs. 9). Entitlement requires compression plus tractable exploitability (resolving Cat vs. Engine). Your original error was conflating what exists with what you are permitted to use. Keep condition (a) for reality, but move condition (b) exclusively to stance entitlement. This preserves realism about unfindable patterns while maintaining that stances are tools for agents.

  2. "Clause by clause"

  The **Compression Clause** is motivated by Case 7. Without it, overfitting counts as reality. If you drop this, noise becomes a pattern, and your distinction between memorization and law collapses. You lose the ability to rule out spurious correlations.

  The **Mind-Independent Stability Clause** is motivated by Case 9. Without it, unfindable patterns vanish, making reality dependent on human capacity. Dropping this forces you to deny Case 9, which contradicts your realist intuition. It also absolves Case 8; the regularity exists regardless of findability. The guilt you feel there is category error—confusing ontology with epistemology.

  The **Optimal Trade-Off Clause** is motivated by Case 4. Chess engine design is accessible; the intentional stance is computationally wasteful. For Case 3 (Cat), neural design is opaque; the intentional stance is efficient. If you drop this, you cannot explain why you are realist about the cat but instrumentalist about the engine. The difference isn't in the pattern's reality, but in your access to the underlying design.

  3. "Fresh cases"

  **A Hurricane:** Real pattern (pressure/wind compression). Stance: Physical or Design (thermodynamic flow). Intentional fails (no goals). The principle predicts you can treat it as a system with "behavior" (path), but ascribing anger is unjustified because it adds no predictive power over physical models.

  **High-Frequency Trading Algo:** Real pattern (price movement). Stance: Design. Intentional ("wanting profit") is shorthand for code. If the code is hidden, Intentional becomes entitled because it is cheaper than reverse-engineering. The principle shifts stance based on opacity, not just the object.

  **Sleepwalker:** Real pattern (movement). Stance: Physical. Intentional fails (no rationality). Design fails (no function). Only Physical captures the causal chain. The principle predicts you cannot legitimately use the intentional stance here, even if the movement looks goal-directed, because the counterfactuals of rationality do not hold.

  4. "What I have to give up"

  You must abandon the guilt on Case 8. If Case 9 is real (mind-independent), Case 8 is too. Findability is epistemic, not ontological. The pattern exists even if no agent can exploit it.

  You must settle Case 5. LLMs are Design stance objects. "Belief" is permissible only as shorthand for weights/activation. Stop flip-flopping; deny realism about internal beliefs. They are real patterns of output, not internal states.

  Overturn Case 10. If compression is equal, both are real descriptions. Indeterminacy suggests your metric is too coarse, not that the pattern is unreal. Reality doesn't wait for a winner.

  Keep Case 6 Asymmetry. Actions are observable aggregates; beliefs imply internal unity firms lack. This fits the Trade-Off clause: action prediction is cheap, belief ascription is costly and structurally unsupported.

  5. "Stance choice"

  Reality and Stance are distinct. Reality is binary (pattern exists); Stance is pragmatic (which lens works). You are not asking "what is it?" but "what works best for me?"

  For Case 5 (LLM): Design stance is primary. Intentional is permissible for prediction but ontologically shallow. Treat "I think" as output generation, not reportage.

  For Case 6 (Corp): Intentional stance is entitled for actions (pricing) because internal design is opaque/complex. Belief ascription is restricted because firms lack unified cognitive architecture. You can say they "intended" to raise prices (aggregate outcome), but not that they "believe" oil will rise (internal state).

  Governing Principle: Adopt the stance that maximizes predictive power per unit of computational effort without violating known structural constraints. If the design is known, use Design. If opaque but rational, use Intentional. If neither, use Physical.
