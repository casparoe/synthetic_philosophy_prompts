          2.  Mechanism: *Contrast-Sensitive Weighting (CSW)*. Weights of dimensions depend on the specific pair being compared (relative size of differences). This structural feature explains the cycles.
      *   **Requirements:**
          *   Begin with an unstructured brainstorming list of candidate defeaters (weak to strong).
          *   Distinguish between defeaters showing the view *false* vs. removing *reasons* for holding it.
          *   Rank defeaters (Fatal -> Serious -> Awkward).
