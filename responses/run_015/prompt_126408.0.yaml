      *   *Fatal:* Money Pump/Sequential Improvement (connects value to action). If you can't act on it, is it value?
      *   *Serious:* Redescriptive Collapse (Parity). If it's just parity, you don't need intransitivity.
      *   *Serious:* Loss of Monadic/Decision Theory. Makes the view operationally useless.
      *   *Awkward:* Insulation/Vagueness. Philosophical hygiene issues.
      *   *Motivation Removers:* Alternative RC solutions.

