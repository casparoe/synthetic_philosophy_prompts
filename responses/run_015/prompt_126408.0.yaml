      *   Need a case where Transitivity says X, Incompleteness says Y, and CSW says Z.
      *   Case: A 3-option menu where CSW predicts a cycle, Transitivity predicts a best, Incompleteness predicts no comparison.
      *   Intuition: Does it feel like *no best option* (CSW) or *no comparison possible* (Incompleteness)?

