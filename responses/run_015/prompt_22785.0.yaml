          *   Construct the carried-along model: $h^*g$.
          *   Both satisfy EFE. Both match boundary conditions.

      *   **The Substantivalist Dilemma:**
          *   If points have "thisness" (haecceity) independent of the metric...
          *   Then $g(p) \neq (h^*g)(p)$ inside the hole represents a physical difference.
          *   Result: Radical indeterminism. The past does not determine the future distribution of the metric field over the *substantival* points.
          *   Einstein's struggle (1913-1915) is good historical context here.

      *   **The Standard Reply (Gauge Equivalence):**
          *   Modern consensus: The two models represent the *same* physical state.
          *   This is "Leibniz Equivalence."
          *   Diffeomorphism invariance is a gauge symmetry.
          *   This saves determinism.

      *   **The Objection (Question-Begging?):**
          *   Earman and Norton (1987) formulation.
          *   If you say "they are the same," aren't you just defining away substantivalism?
