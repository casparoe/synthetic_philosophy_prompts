      *   **Format:** Essay.

  2.  **Deconstruct the Hole Argument (Technical & Philosophical):**
      *   *Mathematical Setup:* Let $(M, g, T)$ be a model of GR. Let $H \subset M$ be an open region (the Hole) where $T = 0$. Let $d: M \to M$ be a diffeomorphism such that $d(p) = p$ for $p \notin H$ and $d(p) \neq p$ for some $p \in H$.
      *   *Active vs. Passive:* Crucial distinction. The Hole Argument uses an *active* diffeomorphism (dragging fields along).
      *   *The Substantivalist Premise:* Spacetime points exist independently of the fields. Point $p$ is numerically distinct from point $q$ even if all physical properties are swapped.
      *   *The Conflict:* If $(M, g, T)$ is a solution, then $(M, d^*g, d^*T)$ is also a solution (general covariance). Outside $H$, they are identical. Inside $H$, the metric field values are assigned to *different points* (in the substantivalist sense).
      *   *The Consequence:* Determinism fails. Given data on a slice before $H$, the future inside $H$ is not fixed because the metric could be $g$ or $d^*g$ at point $p$.
      *   *The Escape:* Deny that $(M, g, T)$ and $(M, d^*g, d^*T)$ represent distinct physical situations. This is Leibniz Equivalence.

  3.  **Drafting - Section by Section:**

