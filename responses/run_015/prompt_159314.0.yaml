answer: |-
  # JOINT STATEMENT ON GROWTH OPTIMALITY AND EXPECTED UTILITY

  **Signatories:** Researcher G (Geometric Rationalist), Researcher E (Expected-Utility Theorist)
  **Date:** 2023-10-27
  **Status:** Adversarial Collaboration Output

  ## 0. Definitions and Notation

  To ensure precise correspondence, we define the following terms for the duration of this document:

  1.  **Bankroll ($W_t$):** The scalar quantity of resources held by the agent at discrete time $t$, where $W_0 > 0$.
  2.  **Multiplicative Gamble:** A stochastic process where wealth evolves as $W_{t+1} = W_t \cdot R_t$, where $R_t$ is a non-negative random variable representing the gross return factor. We assume $R_t$ are independent and identically distributed (i.i.d.) unless otherwise specified.
  3.  **Fractional Staking:** A strategy where the agent commits a fraction $f \in [0, 1]$ of current wealth to a risky venture, retaining $(1-f)$ in risk-free storage (return 1). If the risky venture returns factor $B$ on stake, the total wealth return is $R_t = (1-f) + f \cdot B_t$.
  4.  **Growth-Optimal Stake ($f^*$):** The fraction $f$ that maximizes the expected logarithmic growth rate $g(f) = \mathbb{E}[\ln(W_{t+1}/W_t)]$.
  5.  **Time-Average Growth:** The limit $\lim_{T \to \infty} \frac{1}{T} \ln(W_T/W_0)$ along a single trajectory. By the Law of Large Numbers, for i.i.d. gambles, this converges almost surely to $\mathbb{E}[\ln R_t]$.
  6.  **Ensemble-Average Growth:** The expectation $\mathbb{E}[\frac{1}{T} \ln(W_T/W_0)]$ taken over all possible trajectories at fixed $T$. For i.i.d. gambles, this equals the time-average growth rate.
  7.  **Ruin:** The event that $W_t$ reaches an absorbing state at 0 (or below a defined subsistence threshold) in finite time. In purely multiplicative dynamics with $f < 1$ and bounded downside, ruin is asymptotic ($W_t \to 0$ as $t \to \infty$) rather than finite.

  ---

  ## 1. Agreed Claims

  The following propositions are accepted by both G and E as mathematically correct under the definitions above.

  1.  **Myopic Log-Optimality:** For i.i.d. multiplicative gambles, the strategy that maximizes expected logarithmic terminal wealth $\mathbb{E}[\ln W_T]$ for *any* finite horizon $T$ is the same strategy that maximizes the asymptotic time-average growth rate. This strategy prescribes a constant fraction $f^*$ of current wealth, independent of $W_t$ and $T$.
  2.  **Concavity of Growth:** The function $g(f) = \mathbb{E}[\ln(1 + f(R-1))]$ is strictly concave in $f$ wherever defined. It possesses a unique interior maximum $f^*$ if the gamble has positive expected net return and non-zero variance.
  3.  **Zero-Crossing and Ruin:** $g(f) = 0$ at $f=0$. If the gamble allows for total loss ($R=0$ with $p>0$), then any strategy with $f=1$ leads to ruin with probability 1 as $T \to \infty$. The growth-optimal $f^*$ is strictly less than 1 in such cases.
  4.  **Sub-optimality for Linear Utility:** The growth-optimal stake $f^*$ does *not* maximize expected terminal wealth $\mathbb{E}[W_T]$. The strategy maximizing $\mathbb{E}[W_T]$ generally involves higher leverage (often $f=1$ if no ruin risk exists) and yields a higher ensemble average, despite lower time-average growth.
  5.  **Sub-optimality for General Utility:** The growth-optimal stake $f^*$ does *not* maximize $\mathbb{E}[U(W_T)]$ for any utility function $U$ that is not affine in $\ln W$ (i.e., $U(W) \neq a \ln W + b$).
  6.  **Asymptotic Dominance:** Let $W_T^*$ be wealth under the growth-optimal strategy and $W_T'$ be wealth under any other essentially different strategy. Then $\lim_{T \to \infty} (W_T^* / W_T') = \infty$ with probability 1. The growth-optimal path almost surely outperforms any other path in the long run.
  7.  **Finite-Horizon Probability:** Despite Claim 6, for any finite $T$, the probability that $W_T^* > W_T'$ is not necessarily greater than 0.5. The dominance is a property of the limit and the median, not necessarily the mean or finite-horizon win rate.
  8.  **Parameter Uncertainty:** If the distribution of returns is unknown and estimated from data, calculating $f^*$ using the point estimate of the parameters leads to overbetting. The true growth-optimal stake under uncertainty is derived from the posterior-predictive distribution and is strictly smaller than the stake calculated from the mean estimate.
  9.  **Additive Dynamics Correction:** If the dynamics include additive costs or incomes (e.g., $W_{t+1} = (W_t - C) \cdot R_t$), the growth-optimal stake is *not* wealth-independent. In non-purely-multiplicative environments, the fraction of wealth to risk varies with $W_t$.
  10. **Unbounded Utility Loss:** Against an agent maximizing expected linear wealth ($U(W)=W$), the growth-optimal agent loses in expectation by an arbitrarily large factor as $T$ increases. The ratio $\mathbb{E}[W_T^{\text{linear}}] / \mathbb{E}[W_T^{\text{log}}]$ grows exponentially with $T$.

  ---

  ## 2. Disagreements Table

  | Crux | G's Formulation (Geometric) | E's Formulation (Expected Utility) | Neutral Restatement | Tag |
  | :--- | :--- | :--- | :--- | :--- |
  | **Normativity** | Maximizing time-average growth is a *requirement* of rationality. Any other strategy is objectively irrational because it leads to lower wealth in the long run. | Maximizing expected utility is the *definition* of rationality. Log-utility is a valid preference, but imposing it on agents with other goals is an error. | Both agree agents should optimize an objective function. They disagree on whether that function is fixed by the structure of the world (G) or by the agent's preferences (E). | Normative |
  | **Ergodicity** | The time-average is the physically relevant observable for a single agent. Ensemble averages describe parallel universes, not the agent's future. | The ensemble average is the correct decision-theoretic object. Rationality concerns coherence of beliefs and desires, not survival of a specific trajectory. | Both agree on the mathematical distinction between time and ensemble averages. They disagree on which average governs rational choice. | Factual/Interpretive |
  | **Finite Horizon** | Asymptotic results provide the correct normative guide even for finite horizons, because the distribution of outcomes becomes highly skewed quickly. | Finite horizon problems must be solved using the specific horizon and utility function. Asymptotics are irrelevant if the game ends before convergence. | Both agree on the math of finite vs. infinite horizons. They disagree on whether infinite-horizon properties normatively bind finite-horizon choices. | Normative |
  | **Unit of Agency** | The individual trajectory is the primary unit of optimization. Institutions are secondary to the survival of the constituent bankrolls. | The ensemble (e.g., a federation of agents) is a valid unit of optimization. Pooling risk can maximize total utility even if individual trajectories suffer. | Both agree pooling changes the dynamics. They disagree on whether the "rational" perspective is inherently individual or can be collective. | Verbal/Normative |

  ---

  ## 3. Cruxes

  These are sub-questions where empirical or calculated outcomes would shift the weight of the argument.

  ### Crux 1: Preference or Constraint (The Saturating Utility Test)
  *   **Sub-question:** If an agent has a utility function that saturates (e.g., $U(W) = \min(W, K)$), is the growth-optimal strategy irrational?
  *   **Agreed Test:** Calculate the expected utility $\mathbb{E}[U(W_T)]$ for a growth-optimal strategy vs. a utility-optimal strategy over a finite horizon $T$ where $K$ is reachable.
  *   **G's Prediction:** The growth-optimal strategy minimizes the expected time to reach $K$. It remains robust because it avoids ruin on the path to $K$.
  *   **E's Prediction:** The growth-optimal strategy will take unnecessary risks near the threshold $K$. The utility-optimal strategy will reduce risk as $W_t \to K$.
  *   **Mixed Outcome:** If growth-optimal reaches $K$ faster on average but with higher variance of arrival time, G claims victory on speed, E claims victory on risk-adjusted certainty.

  ### Crux 2: The Deadline Case (Finite Horizon Normativity)
  *   **Sub-question:** Does the asymptotic dominance of the log-optimal path carry normative force when a hard deadline $T$ is known and $T$ is small relative to the convergence time of the law of large numbers?
  *   **Agreed Test:** Compare the median wealth and the mean wealth at $T=10$ for a high-variance gamble.
  *   **G's Prediction:** The median wealth (aligned with time-average) is the relevant metric for a single agent. The mean is distorted by rare outliers.
  *   **E's Prediction:** The mean wealth (aligned with ensemble average) is the relevant metric for decision making. The agent should care about the expectation, not the median.
  *   **Mixed Outcome:** If the agent's actual goal is to beat a specific competitor (relative wealth), the median matters more. If the goal is to extract maximum value to a third party, the mean matters more.

  ### Crux 3: The Toll Booth Case (Non-Multiplicative Dynamics)
  *   **Sub-question:** In the presence of fixed additive costs per round, does the growth criterion yield a myopic, wealth-independent rule?
  *   **Agreed Test:** Solve for $f^*$ in $W_{t+1} = (W_t - C)(1 + r_t)$.
  *   **G's Prediction:** (Correction) G acknowledges that strict geometric growth optimality becomes wealth-dependent here. The crux is whether an *approximate* fractional rule remains robust.
  *   **E's Prediction:** Standard Expected Utility theory naturally handles additive costs by adjusting the marginal utility of wealth. No special "growth" correction is needed.
  *   **Mixed Outcome:** If the wealth-dependent adjustment is small for $W_t \gg C$, G argues the geometric heuristic holds. E argues that "small" is utility-dependent.

  ### Crux 4: The Federation Case (Unit of Agency)
  *   **Sub-question:** If 100 agents each use log-optimal staking individually, vs. 100 agents pooling wealth and using log-optimal staking on the aggregate, which group has higher total utility?
  *   **Agreed Test:** Simulate total wealth of the federation under independent vs. pooled strategies.
  *   **G's Prediction:** Pooled wealth grows at the same rate, but pooling reduces the variance of the *group's* survival. However, G argues the individual trajectory is the moral unit.
  *   **E's Prediction:** Pooling is strictly superior for the ensemble's expected utility if agents are risk-averse. It demonstrates that "rationality" depends on the boundary of the agent.
  *   **Mixed Outcome:** If individual agents can defect from the pool after a lucky run, the pool collapses. G argues this proves individual optimization is fundamental. E argues this proves contract enforcement is the variable, not the optimization criterion.

  ---

  ## 4. Verbal Disputes

  We identify the following disagreements as primarily verbal, stemming from overloaded terminology.

  **1. "Rationality"**
  *   **Dispute:** G uses "rational" to mean "structurally robust against ruin over time." E uses "rational" to mean "consistent with axioms of choice and personal preference."
  *   **Reformulation:** We agree to distinguish **Instrumental Rationality** (achieving a specific goal, e.g., survival) from **Consistency Rationality** (avoiding internal contradictions in preference). G argues log-staking is Instrumentally Rational for survival. E argues log-staking is only Consistently Rational if preferences are logarithmic.
  *   **Residue:** Whether survival is a *precondition* for all other rationality (G) or merely one goal among many (E).

  **2. "Expectation"**
  *   **Dispute:** G refers to the "time-average expectation" (ergodic mean). E refers to the "ensemble expectation" (probability weighted sum).
  *   **Reformulation:** We agree to explicitly state **Time-Average Expectation** ($\lim_{T\to\infty} \frac{1}{T} \sum \ln R_t$) vs. **Ensemble Expectation** ($\mathbb{E}[R]$).
  *   **Residue:** Which expectation is the correct input for decision theory in non-ergodic markets.

  **3. "Risk"**
  *   **Dispute:** G defines risk as the probability of drawdown below a recovery threshold (ruin). E defines risk as the variance or downside deviation of the utility distribution.
  *   **Reformulation:** We agree to distinguish **Risk of Ruin** (absorbing state) from **Risk of Volatility** (variance of returns).
  *   **Residue:** Whether volatility is intrinsically bad (E, via concave utility) or only instrumentally bad insofar as it increases ruin risk (G).

  ---

  ## 5. Appendix: What Neither Side Claims

  To prevent strawman arguments in future discourse, we explicitly disavow the following positions:

  1.  **G does not claim:** That agents *ought* to have logarithmic preferences over consumption or happiness. G claims that for *wealth compounding*, log is the mathematical consequence of survival.
  2.  **G does not claim:** That Kelly staking is optimal for all finite horizons. G acknowledges that for very short horizons with specific utility goals, deviating from $f^*$ may be instrumentally rational.
  3.  **E does not claim:** That agents should bet their entire bankroll on every positive expected value gamble. E acknowledges that concave utility functions (risk aversion) naturally prescribe fractional staking without invoking ergodicity.
  4.  **E does not claim:** That ensemble averages are physically realizable for a single individual. E claims they are the correct normative standard for decision-making under uncertainty regardless of physical realizability.
  5.  **Neither claims:** That parameter uncertainty can be ignored. Both agree that "full Kelly" on estimated edges is mathematically unsound and that shrinkage is required.
  6.  **Neither claims:** That multiplicative dynamics are the only relevant model. Both agree that additive flows (income, costs) complicate the simple fractional staking rule.
