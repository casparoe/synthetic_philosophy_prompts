  2.  **Analyze the Implicit Philosophy (The "What"):**

      *   *Epistemology:* Truth/Value is socially validated, but specifically by *accountable* agents. It's a hybrid of pragmatism (impact matters) and a specific kind of liberal humanism (the individual signer matters).
      *   *Authority:* Authority shifts from peer consensus (blind review) to public consensus (named endorsement). It assumes "real names" correlate with "real responsibility."
