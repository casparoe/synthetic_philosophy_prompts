      *Let's re-read:* "whether I should retain Aristotle's own analogies... or construct a different scenario altogether." I have license to advise on the analogy choice.
      *My advice:* The Stem Cell analogy is excellent for *Teleology* (potentiality -> actuality) but poor for *Hierarchy of Command*. I will suggest using Stem Cells for Part 1 (Teleology) and the Body/Parts for Part 2 (Slavery).

      *Misconception Timing:*
      1.  Genetic Determinism: Before Part 3 (Biology).
      2.  Psychometrics: During Part 2 (Definition of Deliberation).
