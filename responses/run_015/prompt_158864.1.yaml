answer: |-
  ### Specification for an Infinite Ethics Decision Procedure

  Here are the requirements for a decision procedure capable of operating under empirical uncertainty about infinite world structures, with finite causal reach.

  #### I. Core Axiological Requirements (Valuation)

  **1. Finite Difference Dominance**
  *   **Requirement:** If two worlds are identical except for a finite set of locations, and one world contains strictly more value in that finite set (with no offsetting losses), that world must be ranked higher.
  *   **The Case:** *The Local Improvement.* World A has infinite happy lives. World B has the same infinite happy lives plus one additional happy life in a specific location. A procedure that says these are "equally good" (because $\infty = \infty + 1$) violates this. If the agent can create that one life, the procedure must recommend it.
  *   **Status:** **Non-Negotiable.** Without this, finite agents have no moral leverage.

  **2. Summation Order Invariance**
  *   **Requirement:** The value ranking of a world cannot depend on the order in which locations are indexed or summed.
  *   **The Case:** *The Riemann Rearrangement.* Consider a world with an infinite sequence of utility values: $+1, -1, +1, -1...$ If you sum them as $(+1 -1) + (+1 -1)...$ the total is 0. If you sum them as $+1 + (-1 +1) + (-1 +1)...$ the total is 1. If you group them differently, you can make the sum approach any number or infinity. A procedure that yields different verdicts based on how the universe is "indexed" is arbitrary.
  *   **Status:** **Non-Negotiable.** Ethical value must be intrinsic to the distribution, not the description.

  **3. Cardinality Discrimination**
  *   **Requirement:** The procedure must distinguish between worlds containing different infinite cardinalities of value, or different ratios of good-to-bad within the same cardinality, where intuitively distinct.
  *   **The Case:** *Heaven vs. Purgatory.* World A contains $\aleph_0$ (countably infinite) happy lives and 0 sad lives. World B contains $\aleph_0$ happy lives and $\aleph_0$ sad lives. A procedure that ranks these as "equal" (because both have infinite good) fails to capture the obvious moral catastrophe of World B.
  *   **Status:** **Non-Negotiable.** Failing this renders the theory blind to massive structural differences.

  #### II. Core Decision-Theoretic Requirements (Action)

  **4. Act-Separability**
  *   **Requirement:** When an agent can causally affect only a finite region, the ranking of acts must depend primarily on the difference made in that region, provided the background remains fixed.
  *   **The Case:** *The Causal Island.* An agent can press a button to add +1 utility locally. The background universe is infinite and fixed. A procedure that says "It doesn't matter because the background is infinite" fails. The verdict must be derived from the *difference* between the act and the omission, not the absolute total of the resulting world.
  *   **Status:** **Non-Negotiable.** This bridges the gap between world-ranking and action-guidance.

  **5. Indeterminacy Distinction**
  *   **Requirement:** The procedure must logically distinguish between "World A and World B are equally good" and "There is no fact of the matter about which is better (Incomparable)."
  *   **The Case:** *The Orthogonal Infinities.* World A has infinite good in sector X, neutral elsewhere. World B has infinite good in sector Y, neutral elsewhere. Neither dominates the other. Collapsing this into "Equal" implies the agent should be indifferent between them, which may not be true if a third option C dominates A but not B. Collapsing it into "Incomparable" allows for rational choice rules (e.g., maximin) to operate differently.
  *   **Status:** **Non-Negotiable.** Collapsing these leads to money-pumps and irrational decision cycles.

  #### III. Evaluation of User-Specified Requirements

  **1. Invariance to Spacetime Carving (Coordinate Invariance)**
  *   **Verdict:** **Keep (Non-Negotiable).**
  *   **Reasoning:** This is a metaphysical robustness check. If the ethical verdict changes based on how we slice spacetime into "locations" (e.g., slicing by time-steps vs. slicing by light-cones), the theory is measuring the grid, not the morality. Most summation-based views fail this because they rely on a specific "center" or "shape" for expanding finite regions.

  **2. Identical Agents (Symmetric Equilibrium)**
  *   **Verdict:** **Keep (Non-Negotiable).**
  *   **Reasoning:** This prevents the "Drop in the Bucket" retreat. If there are infinitely many agents identical to you running the same decision rule, your act is correlated with theirs. A procedure that evaluates your act in isolation (ignoring that infinitely many others will do the same) may recommend a policy that leads to infinite disaster when universalized. The procedure must evaluate the *policy*, not just the isolated causal impact.

  **3. Uncertainty Degradation (Empirical Robustness)**
  *   **Verdict:** **Keep (Non-Negotiable).**
  *   **Reasoning:** Agents are never 100% certain the world is infinite. A procedure that works only at probability 1.0 and outputs "Error" or nonsense at 0.7 is useless. It must output a weighted expectation or a robust verdict that degrades smoothly as confidence in the infinite hypothesis drops.

  #### IV. The Impossibility Cluster (Jointly Unsatisfiable)

  You cannot satisfy the following three requirements simultaneously. This is a formal impossibility result (akin to Basu-Mitra or similar incompleteness theorems).

  1.  **Strong Finite Pareto:** (See *Finite Difference Dominance* above). Any finite improvement makes a world better.
  2.  **Permutation Invariance:** (See *Summation Order Invariance* above). Shuffling values across locations does not change value.
  3.  **Completeness:** For any two worlds, the procedure must output either A > B, B > A, or A = B. (No "Incomparable" verdicts allowed).

  **The Conflict:** If you demand **Completeness**, you are forced to violate either **Finite Pareto** (saying finite improvements don't matter) or **Invariance** (saying the order of locations matters). If you keep **Pareto** and **Invariance** (which are essential for objective, actionable ethics), you *must* accept **Incomparability**.

  **Resolution for Specification:** To make the procedure logically consistent, **Completeness** must be downgraded from a Non-Negotiable requirement to a **Taste/Preference**. The procedure *must* allow for "No Verdict" (Incomparability) in some infinite comparisons, even if it can still rank *acts* based on finite differences.

  #### V. The Single Most Eliminative Requirement

  **Summation Order Invariance (combined with Coordinate Invariance).**

  *   **Why:** This requirement eliminates the vast majority of technical proposals in the literature. Most attempts to solve infinite ethics rely on defining a specific method of summing values (e.g., "take the limit of utility within expanding spheres centered on the agent").
  *   **The Failure:** These methods inherently depend on *where* you center the spheres and *how* you expand them. They violate Invariance. If you shift the "center" of the universe or change the shape of the expansion, the verdict flips.
  *   **Impact:** Demanding this wipes out almost all "Extensionist" or "Limit-Based" utilitarian frameworks, leaving only those that rely on dominance relations or density measures, which are far fewer and often admit incomparability.

  #### VI. Summary of Trade-Offs

  *   **Non-Negotiable:** Finite Difference Dominance, Summation Order Invariance, Act-Separability, Indeterminacy Distinction, User Req 1, 2, & 3.
  *   **Taste/Compromise:** Completeness. (You must accept that some world-pairs are incomparable to avoid logical contradiction).
  *   **The Bottleneck:** The Impossibility Cluster (Pareto + Invariance + Completeness).
  *   **The Filter:** Summation Order Invariance eliminates the most candidate technical views.

  **Final Design Note:** To satisfy this spec, your decision procedure cannot output a single scalar "value" for infinite worlds. It must output a partial ordering or a vector of metrics, and it must rely on **Finite Difference Dominance** to resolve decisions in the finite patch where the agent has control, while admitting **Incomparability** for the infinite background. It must treat the agent's decision as a **Policy** (to satisfy User Req 2) rather than an isolated causal event.
