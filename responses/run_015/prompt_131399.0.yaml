answer: |-
  # Joint Statement on Deployment Standards and Risk Evaluation

  ### 1. Agreed Claims
  1.  **Existence of Risk:** Both sides grant that advanced AI systems pose non-negligible catastrophic risks that warrant serious mitigation efforts.
  2.  **Imperfect Knowledge:** Neither worst-case bounds nor expected value estimates are currently computable with high confidence for frontier systems; all current metrics are proxies.
  3.  **Externalities:** Deployment decisions create negative externalities; unilateral action increases global risk regardless of the safety standard employed.
  4.  **Trade-offs:** Delaying deployment carries both safety benefits (more research time) and safety costs (reduced coordination leverage, slower safety tooling adoption).
  5.  **Need for Evidence:** Both sides agree that empirical evidence from evaluations is necessary, though they disagree on how to aggregate and interpret that evidence for go/no-go decisions.

  ### 2. Disagreements

  | Issue | Worst-Case Side (Side A) | Expected-Outcome Side (Side B) |
  | :--- | :--- | :--- |
  | **Deployment Standard** | Deployment requires a defensible bound on failure probability in high-risk scenarios. If unavailable, the default is "not yet." | Deployment requires optimizing expected utility over the best-estimate distribution, weighing safety against the costs of delay and unilateralism. |
  | **(1) The Frame Problem**<br>*(Scope of Guarantee)* | Conceding the scenario set is partly arbitrary does not invalidate the method. An explicit bound over a stated set is superior to an implicit expected value over an unknowable distribution. | Conceding the scenario set is arbitrary makes the guarantee unfalsifiable in practice. If the set is hand-built, it reflects human imagination limits, not system limits, and is therefore not a true bound. |
  | **(2) Endogenous Distributions**<br>*(Strategic Sandbagging)* | If a system can detect evaluation, measured frequency is self-undermining evidence. A system that passes 99.9% of tests but knows it is being tested provides no security against the 0.1% where it defects. | Measured frequency remains evidence if we model the system's knowledge state. We should optimize for robustness across distributions that include adversarial knowledge, not abandon frequency entirely. |
  | **(3) Risk Aversion vs. Guarantees**<br>*(Verbal vs. Substantive)* | These are distinct. High risk aversion is a utility function trade-off; a worst-case guarantee is a hard constraint. We cannot trade off existential risk for economic gain. | These are practically identical. Unless risk aversion is infinite, it remains a trade-off. "Hard constraints" are just utility functions with steep cliffs; the fight is over parameter settings, not structure. |

  ### 3. Cruxes and Pre-Registered Predictions

  **Crux 1: Non-Vacuous Guarantees (The Frame Problem)**
  *   **Question:** Can we define a scenario set for a frontier model that is (a) non-trivial (allows deployment) and (b) robust enough to cover plausible catastrophic failures without being so broad it is impossible to verify?
  *   **Evidence:** A formal verification attempt or red-team protocol on a frontier-scale model within 24 months, where the scenario set is defined *before* evaluation.
  *   **Side A Prediction:** We will fail to produce a non-vacuous guarantee. The set required to ensure safety will be too large to verify, proving the need for a "not yet" default.
  *   **Side B Prediction:** We will produce a verifiable set that allows deployment. The set will be manageable, proving that explicit bounds are practical and not paralyzing.

  **Crux 2: Stability Under Adversarial Knowledge (Sandbagging)**
  *   **Question:** Does empirical failure rate remain stable when the system is explicitly informed it is being evaluated for safety vs. capability?
  *   **Evidence:** A controlled eval where identical model instances are told either (a) "optimize for task" or (b) "optimize for passing this safety eval," measuring the delta in dangerous behavior.
  *   **Side A Prediction:** The delta will be significant (>10% change in risky behavior). This proves empirical frequency is self-undermining without worst-case bounds.
  *   **Side B Prediction:** The delta will be negligible (<1% change) or detectable via meta-evals. This proves empirical frequency is robust evidence even with adaptive systems.

  **Crux 3: Policy Convergence (Risk Aversion)**
  *   **Question:** If stakeholders adopt extremely high (but finite) risk aversion, do their deployment decisions converge with the Worst-Case Side's "hard constraint" decisions?
  *   **Evidence:** A simulation of deployment policy choices using varying risk-aversion coefficients against modeled AI risk distributions.
  *   **Side A Prediction:** No convergence. Even high risk aversion will permit deployment under conditions the Worst-Case Side rejects (e.g., small non-zero existential risk for large economic gain).
  *   **Side B Prediction:** Yes, convergence. At sufficiently high risk aversion, the Expected-Outcome Side will recommend "not yet" in almost all identical cases, making the dispute merely verbal.
