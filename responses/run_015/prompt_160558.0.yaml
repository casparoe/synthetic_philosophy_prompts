answer: |-
  The amyloid hypothesis is a degenerating therapeutic problem shift protected by a progressively corroborated pathological hard core, sustained by definitional immunization and external sociological factors that expose MSRP's silence on material significance and programme identity.

  **Mapping the Core and Belt**
  The Hard Core (HC) is a nested causal claim: amyloid-beta (Aβ) accumulation is the necessary and initiating upstream trigger for the cascade (tau, neurodegeneration) resulting in cognitive decline. The Negative Heuristic (NH) forbids attributing trial failures to this causal link; modus tollens must be directed elsewhere. The Protective Belt has absorbed three decades of refutations via adjustments that vary in testability. The shift from plaques to soluble oligomers was independently testable but functioned ad hocly to explain why plaque-clearing drugs failed cognition. Timing adjustments (treat preclinical) and subgroup selections (ApoE4 carriers) are similarly testable but increasingly restrict the domain of the theory without expanding empirical content. Biomarker-confirmed enrolment is the most critical belt adjustment: by restricting trials to amyloid-positive patients, the field ensures the HC is true within the sample, insulating the causal claim from populations where Aβ might be absent. This is testable but risks turning the HC into a selection criterion rather than an explanatory variable.

  **The Definitional Shift**
  The redefinition of Alzheimer's Disease (AD) from a clinical syndrome to a biological construct (amyloid-positive regardless of symptoms) is not a belt adjustment but a covert alteration of the Hard Core. Originally, the HC claimed "Aβ causes dementia." The new definition claims "AD is Aβ pathology." This transforms the empirical claim "Aβ causes AD" into an analytic truth: if AD is defined by Aβ, then Aβ must be present in AD. This is a triumph of apparatus building but a degenerating move for MSRP because it reduces empirical content. Lakatos's framework polices the belt, assuming the HC remains empirical; it lacks resources to critique a redefinition that renders the HC unfalsifiable by clinical outcome. If the disease is the biomarker, then clearing the biomarker *is* the cure by definition, even if cognition remains unchanged. This is not a progressive problem shift; it is an immunization strategy that MSRP classifies as degenerating only if it fails to predict novel facts, but here it avoids prediction entirely by changing the meaning of the terms.

  **Novelty and Prospective Registration**
  The availability of prospectively registered endpoints makes MSRP look worse, not better, because it removes the historian's wiggle room regarding novelty. The prediction was explicit: Aβ reduction leads to clinical improvement (CDR-SB, etc.). The fact corroborated was: Aβ reduction leads to statistically significant but clinically marginal improvement (or nil, per Cochrane). Under a strict Lakatosian reading, a predicted fact that fails to materialize in magnitude is a falsification of the prediction, not a corroboration. The programme predicted a effect size sufficient to validate the cascade; it delivered a whisper. Because the registration locks the prediction, we cannot reconstruct "novelty" retrospectively to save the programme. The fact that the check is available highlights that the programme is failing the novelty condition objectively, yet continues. This exposes MSRP's lack of a stop rule: it can identify degeneration but cannot mandate termination.

  **Materiality and Magnitude**
  MSRP's silence on materiality is a defect exposed here. A programme that shifts from missing endpoints to hitting them by a clinically disputed whisker counts as empirically progressive in Lakatos's formalism (content grew, some fact corroborated). There is no magnitude threshold in MSRP; a 0.1 point difference is progress if predicted. This is inadequate for medical science, where effect size determines utility. To fix this, you would need to add a constraint requiring "practical significance" to empirical progress. The cost is high: it introduces context-dependent judgment into a methodology designed to be formal and logical. It forces the methodology to rely on the very expert consensus Lakatos sought to bypass, undermining the objective appraisal function.

  **Internal/External History and Unit Identity**
  The persistence of the programme despite degeneration is explained by External History: sunk costs, regulatory pathways built around surrogate endpoints, and funding inertia. This is not an anomaly for MSRP; Lakatos explicitly assigns sociological persistence to external history when internal rationality fails. The harder problem is the Unit Problem. Researchers drifted from amyloid to tau to inflammation while keeping the same labs and disease label. Is this one programme metamorphosing or a death and birth? If the HC changed from "Aβ is the sole cause" to "Aβ is one contributor among many," the identity conditions of the programme are violated. MSRP lacks precise identity conditions for programmes; it relies on the historian's discretion. Here, the discretion masks a fragmentation: the "Amyloid Programme" is now a "Biomarker Programme" with a different HC, but the label persists to maintain funding. MSRP cannot distinguish this continuity from discontinuity without appealing to external sociological factors.

  **Verdict and Rivals**
  This episode is a case Lakatos anticipated in structure (degenerating shift) but not in complexity (definitional immunization). It confirms MSRP's ability to identify degeneration but highlights its inability to enforce consequences or handle definitional shifts.
  *   **Kuhn** handles the sociological lock-in better: the "paradigm" persists because the community controls the journals, funding, and regulatory definitions, not because of rational appraisal.
  *   **Bayesian Evidentialism** handles the magnitude problem better: it quantifies the probability crash after 30 years of null results, whereas MSRP only offers a qualitative "degenerating" label.
  *   **Feyerabend** handles the monoculture better: he would argue the suppression of non-amyloid hypotheses (inflammation, metabolic) was methodological tyranny, not rational belt protection.

  MSRP succeeds in diagnosing the degeneration but fails to explain why the diagnosis didn't matter, leaving the heavy lifting to Kuhn's sociology and Bayesian probability.
