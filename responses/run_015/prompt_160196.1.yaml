  ### LEAF DEFINITIONS & COSTS
  1.  **Raw Preference-Satisfaction:** Welfare is satisfying actual desires, even if adapted to oppression.
      *   *Swallow:* Oppressed people can be "well off" while deprived.
  2.  **Informed Preference-Satisfaction:** Welfare is satisfying desires one *would* have with full info/freedom.
      *   *Swallow:* Requires a paternalistic standard of "ideal" conditions.
  3.  **Experienced Utility (Hedonic):** Welfare is the phenomenological feeling (pleasure/pain), not the choice.
      *   *Swallow:* Choices are often wrong about what makes us feel good.
  4.  **Dual-Utility View:** Decision-utility (choice) and Experienced-utility (feeling) are distinct metrics.
      *   *Swallow:* Rationality might mean maximizing the wrong utility.
  5.  **Money-Metric Welfarism:** Utility is measured by willingness-to-pay (WTP).
      *   *Swallow:* The rich get more "utility" weight than the poor by definition.
  6.  **Capabilities/Objective List:** Utility is the wrong tool; focus on functionings, rights, or goods.
      *   *Swallow:* Hard to aggregate into a single "rational choice" model.
  7.  **Integrable/Refutable Realism:** Utility is a real mental state constrained by logical consistency in data.
      *   *Swallow:* Humans are often "irrational," breaking the utility model.
  8.  **"As-If" Instrumentalism:** Utility is a mathematical tool to predict behavior, not a real thing.
      *   *Swallow:* Cannot use utility to make ethical claims about welfare.
  9.  **Strict Behaviorist RP:** Preference *is* the choice disposition; utility is just bookkeeping.
      *   *Swallow:* No room for "mistakes" or weakness of will.
  10. **Belief-Desire Separatism:** Choice data must be parsed into beliefs and desires before analysis.
      *   *Swallow:* Requires access to mental states, not just choice records.
  11. **Empty Cell (Menu-Anchored Welfarism):** *Nobody lives here.*
      *   *Why:* Incoherent; ethical welfare shouldn't fluctuate with arbitrary menu changes.
  12. **Empty Cell (Menu-Free Behaviorism):** *Nobody lives here.*
      *   *Why:* Unattractive; if value is stable, why deny it's a mental state?

  ### LOGICAL SPACE NOTES
  *   **The Menu Split:** This is the primary Econ/Phil fault line. Econ (Prediction) often tolerates Menu-Anchored; Phil (Welfare) demands Menu-Free.
  *   **The Belief Split:** If you branch Q1 to "Belief," you generally cannot be a Strict Behaviorist (Leaf 9).
  *   **The Metric Split:** Money-Metric (Leaf 5) is compatible with Informed Pref-Sat, but conflicts with Capabilities (Leaf 6).
  *   **Un-Separated Pair:** *Informed Pref-Satisfaction* and *Experienced Utility* only come apart if a person knows the truth but still chooses what makes them miserable (e.g., tragic knowledge). If you think this is impossible, these leaves merge for you.
