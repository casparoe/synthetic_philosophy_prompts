  # UTILITY SORTING HANDOUT: WHAT DO YOU MEAN?
  **Start:** We agree choices are *some* evidence of wants. Walk the tree. Stop at a leaf.

  ```text
  1. MARCUS (WATER): Marcus chooses bottled water over tap because he 
     believes tap is contaminated (it isn't). Does this choice reveal 
     a desire for bottled water, or a belief about tap water?
     ├── Belief drives choice (Need to separate belief/desire) ──> GO TO 2
     └── Choice reveals desire directly (Choice is king) ──> GO TO 4

  2. THEA (ADAPTIVE): Thea doesn't want X because she was told people 
     like her can't have it. If we satisfy her current desire, is she 
     better off?
     ├── Yes (Desire satisfaction = Welfare) ──> LEAF: Raw Preference-Satisfaction
     └── No (Desires need correction/idealization) ──> GO TO 3

  3. PAINKILLER (EXPERIENCE): Two patients choose the same treatment. 
     One feels relief, the other feels nothing. Did they get the same "good"?
     ├── Yes (Good = Getting what you chose) ──> LEAF: Informed Preference-Satisfaction
     ├── No (Good = Experienced feeling) ──> LEAF: Experienced Utility (Hedonic)
     └── No (Choice-Utility != Experienced-Utility) ──> LEAF: Dual-Utility View

  4. NIA (ONTOLOGY): Nia picks the apple. Is "preferring apple" just 
     a label for that pick, or a mental state that caused it?
     ├── Mental State (Causes choice) ──> GO TO 5
     └── Choice Disposition (Is the choice pattern) ──> GO TO 6

  5. RICH/POOR (METRIC): A painkiller costs $10. Rich patient pays easily; 
     poor patient sacrifices food. Do they get the same "utility"?
     ├── Yes (Measure via Willingness-To-Pay) ──> LEAF: Money-Metric Welfarism
     └── No (Utility isn't money; or money distorts) ──> GO TO 9

  6. ADMINISTRATOR (MENU): [CRITICAL NODE] The admin ranks Nia's well-being 
     from records. If the break room menu changes, does "3 utils" for an 
     apple still mean the same thing?
     ├── Yes (Menu-Free: Value sticks across contexts) ──> GO TO 7
     └── No (Menu-Anchored: Value is relative to available options) ──> GO TO 8

  7. DATA (REFUTATION): Can a pattern of choices (e.g., intransitivity) 
     prove the utility ascription *false*?
     ├── Yes (Data constrains the function) ──> LEAF: Integrable/Refutable Realism
     └── No (Function is just a model fit) ──> LEAF: Empty Cell (Unattractive: Realism without constraints)

  8. GOAL (PREDICTION): If utility is menu-anchored, what is it for?
     ├── Predicting future choices ──> LEAF: "As-If" Instrumentalism
     ├── Bookkeeping for choice data ──> LEAF: Strict Behaviorist Revealed Preference
     └── Ranking Welfare ──> LEAF: Empty Cell (Incoherent: Welfare shouldn't depend on arbitrary menus)

  9. SCOPE (ALTERNATIVE): Is "preference satisfaction" the only thing 
     that matters for the human good?
     ├── Yes ──> (Return to 2 or 5)
     └── No (Functionings, Rights, Capabilities matter) ──> LEAF: Capabilities/Objective List
  ```

  ### GLOSSARY (Econ ↔ Phil)
  *   **Menu-Anchored:** Utility value changes if the set of available options changes (e.g., A is better than B, but only if C is present).
  *   **Integrable:** Choice data fits a consistent mathematical function; if not, the utility claim is refuted.
  *   **Welfarism:** The view that the "good" is determined solely by individual welfare/utility.
  *   **"As-If":** Agents don't *have* utilities; they act *as if* they do to maximize a function.
  *   **Revealed Preference:** Preference is not a mental cause, but defined entirely by the choice itself.

  ### CLASS INSTRUCTIONS
  1.  **Sort (15 mins):** Have students walk the tree individually and mark their leaf; do not discuss yet.
  2.  **Debrief (15 mins):** Group by leaf, not by discipline, and ask: "What case would force you to move to a different leaf?" (Focus on migration, not defense).

