  Finally, tell me whether the residue—the parts that do not survive translation—indicates mainly that my formal-verification vocabulary is missing something essential (perhaps normative or metaphysical weight), or whether it reveals that Gödel's argument depends on unstated metaphysical premises that do not survive formalization.

  At the very end, provide a one-sentence summary on its own line beginning with "Verdict:" stating your overall judgment on whether the residue is mainly a vocabulary deficit or an argument gap.
