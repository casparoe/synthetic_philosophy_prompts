  # ADVERSARIAL COLLABORATION PROTOCOL: VAGUENESS SEMINAR
  **Date:** [Current Date]
  **Parties:** Epistemicist Camp (EC) vs. Supervaluationist Camp (SC)
  **Subject:** The Semantic Status of Vague Predicates and the Sorites Paradox

  ## PREAMBLE
  This document serves to formalize the ongoing debate between the Epistemicist and Supervaluationist positions within the reading group. Its purpose is not to adjudicate truth, but to isolate precise points of divergence, establish shared commitments that distinguish us from rival theories (Degree Theory, Eliminativism, Contextualism), and identify potential verbal disputes that may be stalling progress.

  ---

  ## PART I: COMMON GROUND (THE SHARED COMMITMENTS)
  *Both parties affirm the following claims. These commitments jointly distinguish our positions from Degree Theorists (who posit truth-values between 0 and 1), Nihilists (who deny vague predicates exist), and Radical Contextualists (who dissolve the paradox via pragmatic shift).*

  1.  **Rejection of Degrees of Truth:** Neither camp accepts that borderline statements possess a intermediate truth value (e.g., 0.5). For any proposition $p$, its semantic value is not a matter of degree.
  2.  **Reality of Higher-Order Vagueness:** Both camps affirm that there is no sharp boundary between the clear cases and the borderline cases (and no sharp boundary between the borderline cases and the clear non-cases). Any theory positing a sharp line between "definitely tall" and "borderline tall" is rejected.
  3.  **The Sorites Tension:** Both camps agree that the Sorites paradox presents a genuine semantic problem. We are both strongly inclined to assert the inductive premises (e.g., "If $n$ grains make a heap, $n+1$ do") and firmly reject the conclusion ("One grain makes a heap"). We agree that standard classical logic, combined with these intuitions, yields a contradiction; something in the semantic package must be modified or explained.
  4.  **The "Definitely" Operator:** Both camps agree that a formal operator $D$ (read as "Definitely," "Determinately," or "Clearly") is required to model vague discourse without contradiction. Both agree that $D$ must be iterable (e.g., $DDp$, $DDDp$) to account for higher-order vagueness, and that a competent semantics must specify the logic of $D$.
  5.  **Semantic Competence:** Both camps agree that the solution must respect the linguistic competence of ordinary speakers. We reject the view that speakers are simply mistaken about the meanings of their own words or that vague terms ought to be replaced by stipulated sharp terms for philosophical purposes.

  ---

  ## PART II: POINTS OF CONTENTION AND TEST CASES
  *The following table isolates the specific cruxes of the disagreement. For each crux, we state the neutral question, the respective positions (phrased for mutual acceptance), and a specific test case with advance predictions.*

  | Crux | Neutral Statement of the Issue | Epistemicist Position (EC) | Supervaluationist Position (SC) | Test Case & Evidential Predictions |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. The Metaphysics of the Boundary** | Does a vague predicate have a unique, sharp extension in the actual world, or is its extension inherently partial? | **Sharp but Unknown:** Every vague predicate has a sharp cutoff. Vagueness is a species of ignorance. There is a fact of the matter about whether a borderline case falls under the predicate. | **Partial / Gappy:** Vague predicates lack a unique extension. They are associated with a set of "admissible precisifications." Borderline cases are those where precisifications disagree. | **Case: The Envelope Predicate**<br>*A predicate $E$ is defined by a coin flip in a sealed room. The extension is sharp but unknowable.*<br><br>**EC Prediction:** "Tall" is relevantly identical to $E$. If we could access the semantic facts, we would find a sharp cutoff. The ignorance is principled (margin for error), but the boundary exists.<br>**SC Prediction:** "Tall" is relevantly *distinct* from $E$. $E$ is precise but unknown; "Tall" is imprecise. If "Tall" were like $E$, borderline claims would be bivalent (but unknown), whereas SC claims they are truth-valueless. |
  | **2. The Source of Indeterminacy** | Is the indeterminacy located in the speaker's epistemic access or in the semantic rules themselves? | **Epistemic Access:** The semantic rules fix a unique extension. Our inability to locate it is due to a "margin for error" principle on knowledge (we cannot know $p$ if $p$ could easily be false in nearby cases). | **Semantic Underdetermination:** The semantic rules (usage, conventions) do not fix a unique extension. They constrain the set of admissible precisifications but do not select one. | **Case: The Split-Usage Community**<br>*Half the community uses "tall" (men) $\ge$ 180cm; half uses $\ge$ 185cm. Everyone knows this. No deference.*<br><br>**EC Prediction:** This is not vagueness; it is ambiguity or statistical noise. Either the term has split into two homonyms, or one group is wrong. It does not model standard vagueness.<br>**SC Prediction:** This is a concrete model of vagueness. The "set of admissible precisifications" just *is* the range of competent usage (180–185cm). A man at 182cm is a borderline case because usage diverges. |
  | **3. Logic and Validity** | How is validity preserved across a Sorites chain? | **Classical Preservation:** Classical logic holds universally. The Sorites argument is *valid*, but unsound. One conditional premise is false (we cannot identify which). | **Supertruth Preservation:** Validity is preservation of *supertruth* (truth on all precisifications). Some classically valid rules (e.g., Conditional Proof or Modus Ponens in certain contexts) may fail to preserve supertruth. | **Case: Iterated Definiteness**<br>*Consider the claim: $p$ is true, but it is not definitely true ($p \land \neg Dp$).*<br><br>**EC Prediction:** This claim is necessarily false. If $p$ is true, it is a fact. Our ignorance doesn't make it indeterminate. $Dp$ follows from $p$ in the metalanguage.<br>**SC Prediction:** This claim can be true. A statement can be true on some precisifications and false on others (making $p$ superfalse? No, making $p$ indeterminate). *Correction:* SC predicts $p \land \neg Dp$ is the definition of a borderline case. EC predicts it is a contradiction. |

  ---

  ## PART III: DIAGNOSTIC NOTE ON VERBAL DISPUTES
  *We suspect a portion of our stalemate is verbal rather than substantive. The following areas are flagged for meta-semantic scrutiny. We agree to pause object-level arguments if they devolve into these definitions without progress.*

  **1. The Definition of "Semantics"**
  *   **Suspicion:** EC treats semantics as a mapping from words to *worldly extensions* (metaphysical). SC treats semantics as a mapping from words to *constraints on assertibility* (linguistic rules).
  *   **The Verbal Risk:** When EC says "There is a fact of the matter," they mean a metaphysical fact. When SC says "There is no fact of the matter," they mean "The linguistic rules do not dictate a verdict." We may be agreeing that the *rules* are silent (SC) while EC insists the *world* is determinate.
  *   **Resolution Protocol:** We must distinguish between **Semantic Indeterminacy** (the rules don't decide) and **Ontic Indeterminacy** (the world doesn't decide). EC accepts Semantic Determinacy + Epistemic Ignorance. SC accepts Semantic Indeterminacy. If we agree the *rules* underdetermine usage, does EC still insist on a sharp cutoff? If yes, the dispute is metaphysical. If no, it is verbal.

  **2. The Usage of "True"**
  *   **Suspicion:** SC uses "True" to mean "Supertrue" (true on all precisifications) in the context of validity, but admits "True" can mean "True on some precisification" in other contexts. EC uses "True" classically (bivalent).
  *   **The Verbal Risk:** When SC says "Borderline statements are neither true nor false," EC hears "Borderline statements violate bivalence." SC intends "They do not meet the high bar of Supertruth."
  *   **Resolution Protocol:** In all future tables, we will distinguish between **Truth simpliciter** (classical) and **Determinacy/Supertruth**. We will not argue over whether a borderline claim is "True" without qualifying which operator is being used.

  **3. Competence vs. Knowledge**
  *   **Suspicion:** EC argues that a competent speaker *means* a sharp concept but cannot *know* its application. SC argues that a competent speaker *means* a partial concept.
  *   **The Verbal Risk:** This may be a dispute over what "Meaning" is. Is meaning what fixes reference (EC) or what guides usage (SC)?
  *   **Resolution Protocol:** We will treat the **Split-Usage Community** case as the arbiter. If EC concedes that meaning is exhausted by usage constraints, SC wins Crux 2. If EC maintains meaning transcends usage to fix a hidden cutoff, the dispute is metaphysical.

  ---

  **Signatures:**

  _________________________ (Epistemicist Camp)

  _________________________ (Supervaluationist Camp)

  _________________________ (Moderator/Note-taker)
