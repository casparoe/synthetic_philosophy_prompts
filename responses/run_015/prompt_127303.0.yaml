      *   **Problem:** Deciding whether to use the word "genocide" vs. other terms (Crimes Against Humanity, Ethnic Cleansing, descriptive) in public notes.
      *   **Constraints:** 48-hour turnaround, no legal counsel, board sign-off, high stakes (funding, staff safety, victim recognition, political fallout).
      *   **Requirements:**
          *   An actual procedure (questions in order).
          *   Criteria for sufficient answers (given constraints).
          *   Stop points (where to halt with a "no").
          *   Hand-off points (where it becomes a values/policy decision, not factual).
          *   Distinction: Legal/Moral test (intent to destroy) vs. Strategic/Operational decision (should we say it).
          *   Evaluation of existing heuristics (Swap Test, Campaign-Shape Intent).
          *   Application to three specific scenarios.
          *   Tone: British English, direct/straight (especially on uncomfortable answers).
          *   Acknowledgement of limitations (where it misfires).

  2.  **Deconstruct the Core Tension:**
      *   *Legal/Technical:* Does the evidence meet the threshold of *dolus specialis* (specific intent to destroy a protected group)?
      *   *Political/Operational:* Does using the label help or harm the mission, staff, and victims?
      *   *The "PhD" Angle:* The user knows the theory (Lemkin vs. UN Convention). The procedure needs to bridge high theory with low-resource reality.

  3.  **Drafting the Procedure (The "Algorithm"):**
      *   Need a funnel approach. Start with hard facts, move to interpretation, end with policy.
      *   *Stage 1: Threshold & Protection.* Is it even an atrocity? Is the group protected?
      *   *Stage 2: The Act.* Are the acts serious enough?
      *   *Stage 3: The Intent (The Hard Part).* This is where the heuristics come in.
      *   *Stage 4: The Strategic Pivot.* Even if it *is* genocide, should we *say* it?
      *   *Stage 5: Sign-off.*

  4.  **Evaluating the Heuristics:**
      *   *Swap Test:* "Could they escape by ceasing to be a member?"
          *   *Verdict:* Keep, but refine. It's good for distinguishing persecution from genocide, but weak on "partial destruction" or cultural destruction.
      *   *Campaign-Shape Intent:* "Inferring intent from organisation."
          *   *Verdict:* Keep. Essential when no smoking gun exists. Pattern analysis is standard in international criminal law (ICTR/ICTY precedents).

  5.  **Refining the "Legal vs. Political" Split:**
      *   The prompt asks to hold apart "is it met" vs. "should we say it."
      *   *Procedure:* Steps 1-3 determine the factual/legal characterization. Step 4 determines the communication strategy.
      *   *Hand-off:* If Step 3 is ambiguous, it goes to the Board as a risk assessment, not a legal finding.

  6.  **Developing the Three Scenarios:**
      *   *Scenario 1 (Pastoralists):* Destruction of livelihood = destruction of group (Lemkin's cultural view). Legal test is tricky under UN Convention (national/ethnic/religious/racial only? Pastoralist might be ethnic). Intent is inferred.
      *   *Scenario 2 (Religious Elders/Shrines):* Small number killed, but key cultural nodes destroyed. "In part" means "substantial part" or "significant part." Is 300/1,000,000 substantial? If they are the *only* knowledge holders, yes.
      *   *Scenario 3 (User's Community):* High evidence (manual + speech), high risk (researchers arrested). This is the "values dressed as facts" trap. The procedure must flag the safety risk explicitly.

  7.  **Addressing the "Straight Talk" Requirement:**
      *   I need to tell the user that in Scenario 3, the procedure might say "Genocide," but the operational decision might be "Don't publish." I need to be honest that this compromises the mission but saves lives.
      *   I need to acknowledge that a 48-hour, no-lawyer process *will* misfire on complex legal nuances.

  8.  **Drafting the Content (Iterative refinement for British English & Tone):**
      *   *Tone:* Professional, concise, slightly academic but operational. No fluff.
      *   *Structure:*
          1.  Heuristic Evaluation.
          2.  The Procedure (The Flowchart).
          3.  Limitations/Misfires.
