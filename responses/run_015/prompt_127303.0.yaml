answer: |-
  ### Part 1: Audit of Existing Heuristics

  **1. The Swap Test**
  *   **Verdict:** Keep, but narrow its function.
  *   **Fix:** It establishes *group targeting*, not *genocidal intent*. If a victim can survive by renouncing their identity (e.g., converting, hiding ethnicity), the violence is likely persecution or a crime against humanity. If they cannot escape the violence without ceasing to exist (biologically or culturally), they are targeted *as a group*.
  *   **Limit:** It does not prove the *intent to destroy*. It only proves the victims were selected based on group membership. Use it at Stage 2, not Stage 3.

  **2. Campaign-Shape Intent**
  *   **Verdict:** Keep.
  *   **Fix:** Formalise it as "Pattern of Conduct." In the absence of a smoking gun (order/speech), specific intent (*dolus specialis*) is inferred from the systematic nature of the acts.
  *   **Limit:** Vulnerable to confirmation bias. To mitigate, require one piece of negative evidence (e.g., "Are there instances where the group was spared despite being present?"). If yes, intent is harder to prove.

  ---

  ### Part 2: The 48-Hour Characterisation Protocol

  This procedure separates the **factual characterisation** (Stages 1–3) from the **publication decision** (Stage 4). Stage 3 is where the legal/moral test sits; Stage 4 is where the political/operational risk sits.

  **Stage 1: Threshold & Protection**
  *   **Q1:** Is there a reasonable basis to believe a protected group (national, ethnical, racial, or religious) is suffering serious harm?
      *   *Sufficient Answer:* Credible witness testimony + open-source verification (satellite, social media) corroborating death, serious harm, or conditions of life calculated to bring about physical destruction.
      *   *Stop:* If no. Classify as 'Unverified Incident' or close.
      *   *Stop:* If the group is political or social only (unless intertwined with ethnic/religious identity). Classify as 'Crimes Against Humanity' track.

  **Stage 2: The Act (Actus Reus)**
  *   **Q2:** Do the acts fall under Article II of the Genocide Convention (killing, causing serious harm, inflicting conditions of life, preventing births, transferring children)?
      *   *Sufficient Answer:* Yes. Note: "Conditions of life" includes destruction of livelihood *if* it renders physical survival impossible (e.g., poisoning wells + destroying herds for pastoralists).
      *   *Stop:* If no. Classify as 'Ethnic Cleansing' or 'War Crimes'.
      *   *Hand-off:* If the act is cultural destruction only (e.g., burning books but no people harmed). This is a values question. Pass to Board with a note: "Lemkinian cultural genocide, but likely fails UN Convention threshold."

  **Stage 3: The Intent (Mens Rea)**
  *   **Q3:** Is there evidence of specific intent to destroy the group, in whole or in part?
      *   *Sufficient Answer:* One of the following:
          1.  **Direct:** Policy document, speech, or order stating destruction.
          2.  **Inferred (Campaign-Shape):** Systematic targeting of group markers (elders, shrines, livelihood) combined with the **Swap Test** (victims could not escape by changing behaviour).
          3.  **Scale/Proportionality:** The "part" targeted is substantial (numerically) or significant (leadership/cultural nodes essential to group survival).
      *   *Stop:* If the violence appears sporadic, opportunistic, or aimed at territory displacement only without destruction. Classify as 'Ethnic Cleansing'.
      *   *Hand-off:* If evidence is ambiguous (e.g., acts suggest destruction, but scale is small). Pass to Board: "Factual threshold met on balance of probabilities, but evidentiary weight is low."

  **Stage 4: The Publication Decision (Values & Risk)**
  *   *Note: This stage occurs only if Stage 3 returns 'Genocide'.*
  *   **Q4:** Does using the term 'genocide' materially increase risk to in-country staff or sources?
      *   *Sufficient Answer:* Security officer assessment.
      *   *Stop:* If risk is critical (arrest, death). **Do not use the word.** Publish the facts (Stage 2) without the label. This is a safety override, not a legal retraction.
  *   **Q5:** Will the label alter the humanitarian or political response positively?
      *   *Sufficient Answer:* Evidence that the label triggers specific legal obligations (e.g., donor mandates) vs. evidence that it causes donor fatigue or political shutdown.
      *   *Hand-off:* If the answer is mixed. This is a Board-level strategic decision. The Analyst provides the risk/benefit matrix; the Board votes.

  **Stage 5: Sign-off**
  *   **Q6:** Does the text accurately reflect the uncertainty?
      *   *Sufficient Answer:* Use qualifying language if Stage 3 was inferred (e.g., "acts consistent with genocidal intent" vs. "is genocide").
      *   *Stop:* If the text implies certainty where evidence is inferred.

  ---

  ### Part 3: Where This Procedure Misfires

  You asked for straight talk on limitations. This protocol will fail in the following ways:

  1.  **The "Part" Problem:** The procedure struggles with Scenario 2 (significant part vs. substantial part). Without a lawyer, you will likely under-call genocide where a "significant" cultural node is destroyed but the numerical toll is low. The UN Convention is vague here; your 48-hour window cannot resolve it.
  2.  **The Safety Override:** In Stage 4, Q4 allows you to withhold the label even if the legal test is met. This creates a dissonance: you privately characterise an event as genocide but publicly call it "atrocity." This protects staff but dilutes the norm. You must accept this hypocrisy as the cost of operating without state protection.
  3.  **The Lemkin Gap:** Your protocol leans on the UN Convention (legal) rather than Lemkin (sociological). If you prioritise Lemkin's "way of life" definition too heavily in Stage 2, you will be accused of legal inflation by states. If you ignore it, you miss the slow-motion destruction of groups. The procedure forces you to choose the Convention for safety, which is a political choice disguised as a legal one.

  ---

  ### Part 4: Scenario Runs

  **Scenario 1: The Pastoralist Campaign**
  *   **Stage 1:** Protected group? Likely ethnic/national. Harm? Yes.
  *   **Stage 2:** Acts? Poisoning wells + destroying herds = "inflicting conditions of life calculated to bring about physical destruction."
  *   **Stage 3:** Intent? **Campaign-Shape:** Systematic. **Swap Test:** Can they escape by becoming farmers in town? If the group identity is intrinsically pastoralist, and the town conditions prevent survival *as that group*, the Swap Test suggests they are targeted as a group.
  *   **Stage 4:** Risk? Standard.
  *   **Result:** **Genocide.**
  *   **Caveat:** You must explicitly link the destruction of the herds to the physical destruction of the people in the note. If you treat the herds as mere property, it fails.

  **Scenario 2: The Religious Elders (300/1,000,000)**
  *   **Stage 1:** Protected group? Religious. Harm? Yes.
  *   **Stage 2:** Acts? Killing + destroying shrines.
  *   **Stage 3:** Intent? Here is the misfire. Numerically, 300 is not "substantial." However, if they are the *sole* holders of ritual knowledge, their destruction ends the group's continuity.
  *   **Procedure Output:** The protocol flags this as a **Hand-off to Board**.
  *   **Reasoning:** A 48-hour, no-counsel team cannot definitively argue "significant part" vs. "substantial part" without inviting legal attack.
  *   **Recommendation:** Classify as 'Crimes Against Humanity (Persecution)' in the note, but append a private briefing to the Board stating this constitutes cultural genocide under Lemkin, even if it fails the strict UN threshold. Do not burn credibility on a legal fight you cannot sustain.

  **Scenario 3: Your Own Community (High Evidence, High Risk)**
  *   **Stage 1-3:** **Genocide.** The manual and speech clear the evidentiary bar easily. The Swap Test is satisfied.
  *   **Stage 4 (The Pivot):** Q4 (Staff Safety). Your researchers are from the community. Publishing the word 'genocide' triggers arrest protocols for them.
  *   **Procedure Output:** **Do not use the word.**
  *   **The Answer You Won't Like:** The procedure dictates you publish the *acts* (Stage 2) but suppress the *label* (Stage 3).
  *   **Why:** If your researchers are arrested, your documentation outfit closes. If you close, no one documents the atrocity. You must sacrifice the normative power of the word to preserve the capacity to witness.
  *   **Wording:** "Systematic destruction of [Group]..." rather than "Genocide of [Group]..."
  *   **Ethical Cost:** This validates the perpetrator's ability to silence the term. It is a survival tactic, not a moral victory. The Board must sign this off explicitly as a 'Security Override', so the record shows the designation was withheld for safety, not because the facts were insufficient.

  ### Final Note on the Board
  Your Board signs off in 48 hours. They are likely not experts. In Stage 3 Hand-offs, do not ask them "Is this genocide?" Ask them: "The evidence suggests genocide, but using the word carries X risk to staff and Y risk to funding. Do we prioritise legal accuracy or operational continuity?" Force them to own the values decision. Do not let them hide behind your analysis.
