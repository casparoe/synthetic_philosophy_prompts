      *   *Check:* Did I evaluate the heuristics? *Yes.*
      *   *Check:* Is the distinction between Lemkin and the Convention clear? *Need to ensure the procedure allows for cultural destruction without getting bogged down in treaty law.*
      *   *Check:* British English spelling (characterisation, programme, defence, etc.).
      *   *Check:* The "values question" hand-off. *Make sure the Board knows when they are making a political call, not a legal one.*

  10. **Final Polish:** Ensure the "Stop" points are clear. Ensure the advice on Scenario 3 is blunt. (The user asked for straight talk on the answer they won't like).

  *(Self-Correction on Scenario 3)*: The prompt implies the user *wants* to use the word but fears for staff. The procedure must protect the staff. If the procedure says "Genocide" but publishing gets researchers arrested, the "Publication Decision" stage must override the "Characterisation" stage. I need to make sure this tension is explicit.

  *(Self-Correction on Heuristics)*: The Swap Test is technically about *persecution* vs *genocide*. If you can escape by converting, it's persecution. If you can't, it's identity-based. But genocide requires *destruction*, not just targeting. I need to clarify that the Swap Test establishes *group targeting*, not necessarily *genocidal intent*. I will advise modifying it.

  *(Final Plan)*:
  1.  Heuristic Audit.
  2.  The 5-Stage Protocol.
  3.  Failure Modes.
  4.  Scenario Runs.
  5.  The Uncomfortable Conclusion.

