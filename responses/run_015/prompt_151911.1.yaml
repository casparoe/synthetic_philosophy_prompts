answer: |-
  Your uncle is falling into a common trap called the "intellectualist fallacy," which assumes that knowledge only counts if it can be explicitly articulated, coded, or justified through theory. In reality, there are two distinct types of knowledge at play here: explicit knowledge, which the engineer possesses (codes, formulas, simulations), and tacit knowledge, which the contractor possesses (muscle memory, pattern recognition, contextual intuition). The engineer knows the rules of plumbing as a closed system, but the contractor knows plumbing as it interacts with the messy, unpredictable reality of a 100-year-old building.

  The contractor's ability to feel the joint and predict failure isn't luck or mysticism; it is compressed experience. Over forty years, he has unconsciously cataloged thousands of data points regarding how specific metals age in specific environments, including the unique chemical composition of your neighborhood's historic copper. A simulation is only as good as its inputs, and if the model doesn't account for local corrosion quirks, the theoretical "perfect" solution will fail. The contractor's knowledge is embodied and situational, making it superior for renovation work where variables are often unknown until the walls are opened up.

  For hiring, this distinction is critical. While you may need the engineer to sign off on permits to satisfy city regulations, you should hire the contractor to actually do the work. Relying on the engineer for execution risks a system that is code-compliant on paper but functionally brittle in practice, whereas the contractor ensures the system survives contact with reality. Your uncle is prioritizing the ability to explain the work over the ability to perform it successfully, which is a dangerous metric for trade work.

  Both men possess valid knowledge, but for renovating a historic home, the contractor's tacit, experience-based understanding of reality is far more valuable than the engineer's theoretical map of it.
