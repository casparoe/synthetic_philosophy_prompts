answer: |-
  Good evening, everyone. For those of you who know Elena as a mother, a friend, or a hiking partner, you know her warmth. For those who know her as Dr. Vasquez, you know her rigor. For thirty years, Elena has studied a single, nagging question: Does morality ask too much of us?

  In her field, we call this the "demandingness objection." To the family here, think of it like this: If you are required to do the most good possible every single day, do you ever get to just live? There are two ways to worry about this. The first is about quantity. It's the worry that morality wants too much of your wallet. We all see evidence of how Elena answered that one; we know she lives simply so she can give significantly. She met that quantitative demand head-on.

  But there is a second, quieter worry that occupied the bulk of her career, and it's about quality. It's the fear that if you treat every choice as a moral calculation, the texture of life changes. It turns a Sunday dinner into an audit. It makes you wonder if you're hugging your friend because you love them, or because it's the most efficient way to boost global welfare. The worry is that constant optimization erodes the stable, non-instrumental relationships that make virtue possible in the first place.

  This brings me to the insight that defines her legacy. Elena framed this not just as a problem of effort, but as a problem of visibility. Many argue that strict morality makes private virtue impossible because it forces every good act to be justified, optimized, and visible to others. It turns goodness into a performance where you have to show your work.

  But looking around this room, I think Elena's life offered a quiet rebuttal to her own hardest questions. She gave away her income, yes, but she never made her relationships into ledgers. She showed us that you can carry a heavy moral burden without making it visible to the people you love. She proved that you can be deeply good without turning every interaction into a demonstration of that goodness. She protected the privacy of her virtue so that her love could remain unconditional, not optimized.

  In the end, her career wasn't just about what we owe the world; it was about what kind of people we can be in front of one another. She taught us that the highest demand morality places on us is to remain human enough to enjoy the life we are saving.

  So, please raise your glasses. To Elena, who gave much, but kept the best parts of herself quietly, generously, and perfectly human. To Elena.

