  I'm putting together the toast for my colleague Dr. Elena Vasquez's retirement dinner next friday. She's spent about thirty years on demandingness objections to consequentialism — the usual worry that morality asks us to give up too much — but what's interesting is that she also lives pretty frugally and gives away a lot of income, so the family side of the room sees one version of her and the philophy side sees another. The audience is split into two seperate groups: half moral philosophers who will catch every referance, half family and old friends who won't know a demandingness objection from a dinner roll. I need the speech to do real structural work with her research, not just decorate it. Specifically, build the toast around a distinction that gets missed: there's the quantitative demandingness worry (consequentialism asks for too *much* sacrifice) and a qualitative one about the *texture* of ordinary life — that it turns every casual choice into a moral audit and erodes the stable, non-instrumental relationships that make virtue possible at all. Weave that qualitative version into the heart of the toast without turning it into a lecture. Also inject one niche twist: frame demandingness as a problem of *moral visibility* — the idea that consequentialism might be uniquely demanding because it makes private, quiet virtue impossible, forcing every good act to be justified, optimized, and visible to others. Honor her career by showing that the problem she lived with is actually about what kind of people we can be in front of one another.

