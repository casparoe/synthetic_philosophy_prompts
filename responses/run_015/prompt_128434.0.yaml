      *   *Self-trust break?* Yes, because the rule is non-Bayesian.
      *   *Feature doing damage:* The *systematic deviation from conditionalization* (the "shrinking").

      *(Self-Correction during drafting)*: Wait, if the future self uses a cautious rule, does she *have* imprecise credences, or does she have a sharp credence that is just conservative? The prompt says "assigns a range [0.4, 0.6]... because she's using some cautious update rule." This implies the output is imprecise.
