      *   *Point 2: The Source of the Shift.* This is the big one. Reflection works because I expect my future self to know *more*. If my future self believes *less strongly* (shrinking to 0.4-0.6) despite having more evidence, she is effectively discarding information.
      *   *Point 3: The Dutch Book.* Can I be Dutch booked?
          *   If I believe 0.55 now.
