answer: |-
  This is an exceptionally sharp reading of the *Bai Ma Lun* (White Horse Discourse). You are correct to be dissatisfied with the introductory "set-theoretic" or "class-inclusion" interpretation (i.e., that the set of white horses is a proper subset of the set of horses). That framing imports Aristotelian or Fregean logic into a context that operates on fundamentally different ontological assumptions.

  Your intuition that the School of Names (*Mingjia*) treats attributes as ontologically distinct realities (*zhi* or indices) that coincide without fusing is supported by significant contemporary scholarship (notably the work of A.C. Graham and Chad Hansen). However, your worry about radical mereological nihilism—and the resulting instability of reference—hits on the central tension in Gongsun Long's philosophy.

  Here is a way to resolve that tension without retreating to the "compound description" model, preserving the metaphysical separability while explaining the stability required for disputation.

  ### 1. Ontology of Separation vs. Mereological Nihilism
  Your concern is that if "whiteness" and "horseness" are separate realities, the object they inhere in cannot be a genuine unity, leading to a world of fleeting aggregations. However, Gongsun Long's separability thesis does not necessarily entail *temporal* instability, only *ontological* independence.

  In the *Zhi Wu Lun* (Discourse on Pointing at Things), Gongsun Long distinguishes between the *zhi* (the universal/index/attribute) and the *wu* (the concrete thing).
  *   **The Standard View:** Attributes inhere in a substance (Substance + Properties = Object).
  *   **Gongsun Long's View:** Attributes are self-subsisting realities. When they manifest, they do not merge; they "occupy" a locus.

  This is not mereological nihilism (the denial of composite objects) but rather **mereological non-fusion**. The white horse exists, but it exists as a *collocation* of two independent realities, not as a new, third substance created by their union. Think of it less like hydrogen and oxygen forming water (chemical fusion) and more like two beams of light crossing at a point (spatial coincidence). The intersection is real and stable, even if the lights remain distinct.

  Therefore, the "white horse" is not an illusion. It is a stable *position* where the reality of "horse" and the reality of "white" overlap. The stability comes from the persistence of the attributes, not from a metaphysical glue binding them.

  ### 2. The Source of Stability: *Ming* (Names) not *Shi* (Substances)
  You ask: *Wouldn't their own practice of disputation presuppose that this compound has enough stability to serve as the subject of a true or false statement?*

  The School of Names would answer: **Yes, but the stability comes from the Name (*Ming*), not the Object (*Shi*).**

  For the *Mingjia*, language does not mirror metaphysical unity; it imposes functional distinction. The reason we can argue about a "white horse" is not because "white-horse-ness" is a unified essence in the world, but because the *name* "white horse" successfully fixes a specific collocation of attributes for the purpose of communication.

  *   **Rectification of Names (*Zheng Ming*):** The goal of disputation is not to discover the "true substance" of things, but to ensure that names correspond to specific realities without slippage.
  *   **The Pragmatic Anchor:** When I say "white horse," I am not referring to a metaphysical composite; I am issuing a directive to select objects where *whiteness* and *horseness* coincide. The "subject" of the statement is stable because the *criteria for selection* are stable, even if the ontological status of the object is merely coincidental.

  This avoids nihilism because it shifts the locus of unity from the world to the discourse. The "white horse" is a unified *topic*, even if it is a disunified *entity*.

  ### 3. The Mass Noun Hypothesis
  To further rescue the view from nihilism, it is helpful to consider Chad Hansen's influential interpretation that Classical Chinese nouns function more like **mass nouns** (e.g., "water," "gold") than count nouns ("a horse," "the horse").

  *   If "horse" refers to a stuff or a mass of "horseness," and "white" refers to a mass of "whiteness," then a "white horse" is not a composite of parts, but a **partition** of overlapping stuffs.
  *   In this framework, you don't have a problem of "parts composing a whole." You have a problem of **boundaries**.
  *   "White horse is not horse" means: "The mass of white-horse stuff is not identical to the mass of horse stuff."

  This preserves your metaphysical intuition (attributes are distinct realities) without requiring the object to be a "substance." The object is just a region where the "horse stuff" and "white stuff" overlap. This region is stable enough to be pointed at (*zhi*) and named (*ming*), which is all that is required for disputation.

  ### 4. Why Dispute? The Ethical Stakes
  Finally, to address your worry about the point of disputation: If the compound is just a coincidence, why argue so fiercely about it?

  The *Mingjia* were not purely metaphysical speculators; they were often advisors on statecraft. The separability of attributes has profound political implications.
  *   **The Risk of Conflation:** If we accept that "white horse is horse" implies identity (rather than class inclusion), we risk allowing attributes to slide into one another. If "white" and "horse" are not distinct, then a black horse might be argued to satisfy a request for a white horse (by dismissing color as irrelevant).
  *   **Precision in Governance:** Gongsun Long's point is that if you ask for a "horse," a yellow or black one will do. If you ask for a "white horse," they will not. If you treat the names as identical, you cannot enforce specific requirements.

  The disputation preserves the **integrity of distinctions**. By insisting that "white horse" is not "horse," Gongsun Long is safeguarding the ability of language to make fine-grained distinctions necessary for law and ritual. The "stability" of the compound is required not because the universe demands it, but because *human agency* demands it to function.

  ### Summary
  Your reading is correct: the School of Names treats attributes as ontologically distinct. However, this does not lead to a nihilism that makes discourse impossible, because:

  1.  **Coincidence is not Instability:** Attributes can be distinct yet persistently collocated (like intersecting beams of light).
  2.  **Unity is Linguistic:** The "object" is stabilized by the *Name*, which fixes the reference point for the disputation, regardless of metaphysical fusion.
  3.  **Mass Noun Semantics:** Viewing terms as referring to overlapping "stuffs" rather than "substances with properties" bypasses the mereological problem entirely.
  4.  **Pragmatic Necessity:** The distinction is maintained to ensure precision in action and governance, not to describe ultimate reality.

  Gongsun Long is not denying the existence of the white horse; he is denying that the *name* "white horse" collapses into the *name* "horse." The metaphysical separability of attributes is the *ground* for this linguistic precision, not a threat to the reality of the object.
