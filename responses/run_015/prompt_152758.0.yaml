answer: |-
  This is a precise and demanding request. You are asking for a mapping between the state-space of moral philosophy and the phase-space of statistical mechanics, with a specific instruction to highlight the Jacobian of the transformation—where the mapping distorts or singularities appear.

  Here is the residue report on translating T.M. Scanlon's contractualism into the vocabulary of statistical physics.

  ### 1. The Aggregation Problem: Extensivity vs. Non-Additive Constraints

  **The Philosophical Claim:**
  Utilitarianism treats "good" or "welfare" as an additive scalar. If $N$ people suffer a small harm $h$, the total badness is $N \cdot h$. If $N \cdot h > H$ (a large harm to one person), the trade is justified. Scanlon denies this linearity. He argues that the complaint of the single person suffering $H$ cannot be outweighed by the aggregated small complaints of the $N$, provided $h$ is below a certain threshold of significance.

  **The Physics Translation:**
  *   **What Translates Cleanly:** Utilitarianism maps perfectly onto an **extensive property** (like Energy $E$ or Entropy $S$) in the thermodynamic limit. It assumes the system is composed of weakly interacting subsystems where the total value is the linear sum of microscopic contributions: $X_{total} = \sum_i x_i$. In this framework, ensemble averaging is valid; particles (people) are fungible, and the specific microstate of particle $k$ matters less than the macrostate distribution.
  *   **The Distortion:** Scanlon's view treats moral "wrongness" not as an extensive bulk property, but as a **non-additive constraint** or a boundary condition that dominates the bulk Hamiltonian.
      *   In your vocabulary: Scanlon acts as if the partition function $Z$ diverges or becomes undefined if the energy of *any single* subsystem exceeds a critical threshold $E_c$, regardless of how much the ground state energy of the remaining $N-1$ subsystems is lowered.
      *   This is analogous to a system where the failure of a single component causes catastrophic system failure (a series circuit reliability model) rather than a system where total capacity is the sum of parts (parallel model).
  *   **The Residue (What Fails):** In statistical mechanics, we generally assume the **Thermodynamic Limit** ($N \to \infty$, $V \to \infty$, $N/V$ constant). In this limit, fluctuations of intensive quantities vanish, and the behavior of a single particle is statistically irrelevant to the macroscopic observable. Scanlon's contractualism explicitly **rejects the Thermodynamic Limit** for moral reasoning. It insists that the $N=1$ case retains infinite weight relative to the $N \to \infty$ aggregation of sub-threshold nuisances. Physics has no natural formalism for a "microscopic degree of freedom that cannot be averaged out."

  ### 2. Reasonable Rejection: Stability Criteria vs. Normativity

  **The Philosophical Claim:**
  A principle is wrong if it could be "reasonably rejected." This is not about what people *would* reject (empirical psychology) but what they *could* reject (normative justification). It relies on the idea of justification to others.

  **The Physics Translation:**
  *   **What Translates Cleanly:** You can model "Reasonable Rejection" as a **stability criterion** or a condition for **equilibrium selection**.
      *   Consider a system with multiple local minima in its free energy landscape. A state is "unstable" if a small perturbation causes it to decay to a lower energy state.
      *   "Reasonable Rejection" functions like a **Le Chatelier principle** for social equilibrium: If a principle imposes a burden that creates a "pressure" (complaint) exceeding the structural integrity of the agent, the system cannot maintain that state without external coercion (force).
      *   It resembles a **symmetry-breaking condition**. A principle that favors one subsystem arbitrarily over another breaks the symmetry of the ensemble. "Reasonable rejection" is the restoration of symmetry required for the ensemble to be well-defined.
  *   **The Distortion:** In physics, stability is descriptive. If a state is unstable, the system *will* transition. In contractualism, "reasonable rejection" is normative. If a principle is rejectable, the system *ought not* to be in that state, even if it *is* stable (e.g., a stable tyranny).
      *   Physics deals with **attractors** in phase space. Contractualism deals with **legitimacy** in justification space. A system can be dynamically stable (low energy, high entropy) but morally illegitimate (slavery).
  *   **The Residue (What Fails):** The notion of "Reasonableness" contains a **teleological** component absent in Hamiltonian mechanics. A particle does not "accept" or "reject" a potential well; it occupies it according to probability densities. "Rejection" implies an agency capable of vetoing the dynamics based on a rule, not just a force. This is the **Is-Ought gap** rendered in dynamical systems language. There is no operator in quantum or statistical mechanics that corresponds to "validity."

  ### 3. The Core Failure: Fungibility vs. The Separateness of Persons

  **The Philosophical Claim:**
  The deepest engine of Scanlon's view is the "separateness of persons." You cannot merge the experiences of Person A and Person B into a single container of "utility."

  **The Physics Translation:**
  *   **What Translates Cleanly:** Nothing. This is the singularity.
  *   **The Distortion:** Statistical mechanics relies fundamentally on **indistinguishability**. Whether we are talking about classical Gibbs factors or quantum Bose/Fermi statistics, the physics depends on the fact that swapping particle $i$ and particle $j$ leaves the physical state invariant (or antisymmetric). The "identity" of a specific particle is not an observable.
  *   **The Residue (What Fails):** Contractualism requires that particle $i$ (Person A) is **distinguishable** and **non-fungible** in a way that physics explicitly discards to make calculations tractable.
      *   In physics, if you sacrifice particle $i$ to lower the energy of particles $j$ through $z$, the bookkeeping is clean.
      *   In Scanlon's ethics, the "coordinate label" $i$ carries intrinsic weight. The loss of coordinate $i$ is not compensated by the optimization of coordinates $j \dots z$.
      *   **Physics Omission:** This suggests physics genuinely omits the ontology of **agency**. Physics models objects that *behave*; ethics models agents who *act*. The "non-fungibility of persons" is not a physical property; it is a status property. There is no physical counterpart to "rights" or "claims" because these are not properties of the matter constituting the person, but properties of the relational structure between persons.

  ### 4. Conclusion: The Verdict on the Translation

  You asked whether the failure of translation shows that contractualism relies on a distinction physics omits, or that the ethical claim is indeterminate.

  **The Verdict:** It shows that **physics omits the distinction.**

  If you force Scanlon's contractualism into the vocabulary of statistical mechanics, you inevitably collapse it into Utilitarianism (extensive maximization) or Game Theory (Nash equilibria).
  *   **Utilitarianism** is Thermodynamics (maximize $S$, minimize $F$).
  *   **Contractualism** is not Thermodynamics; it is closer to **Topology** or **Logic** imposed *on* the thermodynamics.

  The "Aggregation Problem" is essentially a refusal to take the **Continuum Limit**. In physics, we assume that as $N$ gets large, discrete individual effects smooth out into a field. Scanlon asserts that the "discreteness" of persons is a fundamental constant that does not smooth out, regardless of $N$.

  **The Honest Residue:**
  1.  **Normativity is Non-Physical:** "Reasonable rejection" is a validity claim, not a stability claim. Physics can tell you if a bridge will hold (stability); it cannot tell you if you *should* build it (normativity). This is not a lack of complexity in the physics; it is a category error to look for "ought" in the Hamiltonian.
  2.  **Identity is Non-Conserved:** In physics, information is conserved (unitarity), but *identity* is not. In contractualism, the specific identity of the sufferer is the primary variable.
  3.  **Determinacy:** The failure of translation does not prove contractualism is indeterminate. It proves it is **non-reductive**. It operates on a layer of abstraction (interpersonal justification) that supervenes on physical facts but is not isomorphic to them.

  **Summary Analogy:**
  Asking statistical mechanics to explain Scanlon's contractualism is like asking the theory of fluid dynamics to explain the rules of Chess. Fluid dynamics can describe the friction of the pieces and the air resistance of a move (the physical substrate), and it can even model the players as thermodynamic systems. But it cannot capture the concept of "Checkmate." "Checkmate" is a status defined by rules, not by the physical configuration of the wood. Similarly, "Wrongness" in contractualism is a status defined by principles of justification, not by the aggregation of neural firing patterns (harms).

  The "aggregation problem" is simply the observation that you cannot checkmate a King by aggregating a million infinitesimal threats that individually do not attack the King's square, even if the total "threat energy" is high. The rules of the game (morality) define valid moves (principles), not just force vectors (harms). Physics describes the board; it does not contain the rules.
