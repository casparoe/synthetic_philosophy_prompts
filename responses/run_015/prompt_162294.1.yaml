prompt: |-
  I am a final-year doctoral candidate in philosophy, and next week I am presenting a work-in-progress chapter to a joint seminar of my department's philosophy of action group and the university's behavioural science group. The paper is provisionally entitled Present Bias Without Discounting: Why Hyperbolic Curves Do Not Explain Akrasia. What I need from you is a preparation sheet for the question period, not a defence of the view.

  The thesis I am defending is this. Hyperbolic (and quasi-hyperbolic) discounting is the wrong kind of thing to explain weakness of will. What a curved discount function can generate is diachronic inconsistency: an agent who at one time prefers the later larger good, and at a later time, when the smaller good has become immediate, prefers that instead. The reversal depends entirely on the two options standing at different temporal distances from the point of evaluation. But the paradigm cases of akrasia, on the standard Davidsonian picture, are synchronic: at the very moment of action the agent judges, all things considered, that A is better, and yet intentionally does B. Evaluate both options from a single point in time and any discount function multiplies equally dated consequences by a common factor, so the shape of the curve drops out and no reversal is produced.

  I concede that the quasi-hyperbolic model has one feature that survives this argument: the discontinuous present-tilt parameter, the beta that discounts everything not available now. My central claim is that beta is not a rate of time preference at all. A discontinuity at the present has no interpretation as discounting the future more steeply; it is better understood as sensitivity to mode of presentation. Perceptually present options are evaluated as if at temporal distance zero, irrespective of when their consequences actually arrive; merely imagined or described options are placed at their objective distance. I call this the presentation-sensitivity account. It carries a testable corollary: manipulations that make a future option perceptually vivid (photographs, physical samples, odours, virtual reality walkthroughs) should reduce present bias, and within the near range the size of the effect should be comparatively insensitive to the objective length of the delay. If the account is right, the practical moral shifts too: the remedy for weakness of will is not primarily pre-commitment or the bundling of choices, but the deliberate recruitment of perception in the service of the agent's own all-things-considered judgement.

  The audience is about fourteen people. Roughly half are philosophers of action: two work in the planning-theory tradition and treat intention as a distinct normative-explanatory kind, one is a neo-Aristotelian who thinks of continence and practical wisdom in terms of character rather than choice architecture, and two are general sceptics about whether dynamic inconsistency is a rational failing at all. The other half are behavioural scientists: one experimental economist who uses the beta-delta model and thinks of it as well-confirmed, one psychologist of intertemporal choice who works in a construal-level / psychological-distance framework, and a mixed group of graduate students who mostly want to know what experiment would settle it.

  Please give me the objections I should expect, ordered by how much damage they would do rather than by the order in which they are likely to be asked, and phrased the way each of these constituencies would actually phrase them rather than in my vocabulary. For each: a reply I could deliver in about two minutes, and an honest note on where that reply is soft or question-begging. Tell me separately what I should concede in my opening two minutes to disarm the room, which single reply has to land if the paper is to survive at all, and the one question I am quietly hoping nobody asks. Assume roughly twenty-five minutes of questions. Please write the sheet in British English, and do not pad it with references or suggestions for further reading: I know that literature, and I need the dialectic, not the bibliography.
reasoning: |-
  Here's a thinking process that leads to the suggested preparation sheet:

  1.  **Analyze the Request:**
      *   **User:** Final-year doctoral candidate in philosophy.
      *   **Task:** Prepare a question period preparation sheet (Q&A prep), *not* a defence of the view.
      *   **Topic:** "Present Bias Without Discounting: Why Hyperbolic Curves Do Not Explain Akrasia."
      *   **Core Thesis:** Hyperbolic/quasi-hyperbolic discounting explains diachronic inconsistency (preference reversal over time), not synchronic akrasia (acting against better judgment *now*). The $\beta$ parameter (present bias) isn't time discounting but "presentation-sensitivity" (perceptual vividness). Remedy: recruit perception, not just pre-commitment.
      *   **Audience:** 14 people.
          *   Philosophers (7): 2 Planning Theory (Bratman-esque), 1 Neo-Aristotelian (Character/Virtue), 2 Sceptics (Dynamic inconsistency $\neq$ rational failing), 2 General/Grad students.
          *   Behavioural Scientists (7): 1 Experimental Economist (Beta-Delta proponent), 1 Psychologist (Construal Level Theory), 5 Grad Students (Want experimental settlement).
      *   **Format:** British English. No padding/references. Focus on dialectic.
      *   **Specific Requirements:**
          *   Objections ordered by *damage potential* (not likelihood).
          *   Phrased in the *audience's vocabulary*.
          *   2-minute reply for each.
          *   Honest note on soft spots/question-begging.
          *   Opening concessions (2 mins) to disarm.
          *   The *one* reply that must land for the paper to survive.
          *   The *one* question hoped nobody asks.
          *   Time allocation: ~25 mins Q&A.

  2.  **Deconstruct the Thesis & Identify Vulnerabilities:**
      *   *Vulnerability 1 (The Economist):* You're redefining established terms. $\beta$ *works* mathematically as discounting. Why change the ontology if the prediction holds? (Instrumentalism vs. Realism).
      *   *Vulnerability 2 (The Planning Theorist):* If akrasia is synchronic, how does intention function? If I intend A but do B, isn't that a failure of planning agency regardless of time?
      *   *Vulnerability 3 (The Psychologist):* Construal Level Theory (CLT) already covers "psychological distance." Is "presentation-sensitivity" just CLT repackaged? If so, where's the novelty?
      *   *Vulnerability 4 (The Aristotelian):* You're reducing weakness of will to a perceptual glitch. What about character, habit, and moral education?
      *   *Vulnerability 5 (The Sceptic):* If the agent acts on the stronger desire at $t_2$, why is that irrational? Maybe preferences just change.
      *   *Vulnerability 6 (The Grad Students):* How do you distinguish "vividness" from "immediacy" empirically?

  3.  **Drafting the Objections (Iterative Process):**

      *   *Objection 1 (Highest Damage):* The Experimental Economist. If the math works, why care about the mechanism? This attacks the core utility of the paper. If the model predicts behavior, the philosophical distinction might be idle.
      *   *Objection 2 (High Damage):* The Planning Theorist. If akrasia is synchronic, does your view collapse into a failure of intention retention? This challenges the definition of akrasia itself.
      *   *Objection 3 (Medium-High Damage):* The Psychologist. Is this just Construal Level Theory? If yes, it's not new. If no, how does it differ? This challenges novelty and empirical grounding.
      *   *Objection 4 (Medium Damage):* The Aristotelian. Reducing *akrasia* to perceptual salience ignores the moral dimension.
      *   *Objection 5 (Lower Damage but Tricky):* The Sceptic. Why is synchronic inconsistency irrational?

  4.  **Developing Replies & Soft Spots:**
      *   *Economist Reply:* Prediction isn't explanation. We need to know *why* to intervene effectively. (Soft spot: Might sound like hand-waving if the intervention works either way).
      *   *Planning Theorist Reply:* Intention is normative; discounting is descriptive. The conflict is between judgment and action, not just plan and deviation. (Soft spot: Relies on a specific view of intention they might reject).
      *   *Psychologist Reply:* CLT is about abstraction; Presentation-Sensitivity is about perceptual presence. One is cognitive, one is quasi-perceptual. (Soft spot: The line is blurry).
      *   *Aristotelian Reply:* Character shapes what we find vivid. It complements, doesn't replace, virtue ethics. (Soft spot: Risks diluting the thesis).
      *   *Sceptic Reply:* Davidsonian akrasia entails a specific normative conflict, not just preference change. (Soft spot: Assumes Davidson is right).

  5.  **Selecting the "Must Land" Reply:**
      *   The core thesis is that hyperbolic discounting *cannot* explain synchronic akrasia. If the audience convinces me that discounting *can* operate synchronically (e.g., via subjective time perception), the paper fails.
      *   *Wait, looking closer:* The core argument is that discount functions require *different* temporal distances to cause reversal. If the distances are the same (synchronic choice), the curve doesn't matter.
      *   *The Critical Point:* I must defend the claim that $\beta$ is not a time parameter. If $\beta$ is conceded to be time-discounting, the "Without Discounting" title fails.
      *   *Decision:* The reply to the Economist/Modeler regarding the interpretation of $\beta$.

  6.  **Selecting the "Hope Nobody Asks" Question:**
      *   Something that exposes a gap in the "Presentation-Sensitivity" account.
      *   *Idea:* What about akrasia involving two future options? (e.g., choosing to sleep in tomorrow vs. gym tomorrow, decided tonight). Neither is "present."
      *   *Why:* The theory relies on the "present-tilt." If I choose a smaller-later good over a larger-later good where *neither* is immediate, but I still act akratically, the presentation-sensitivity account struggles unless "vividness" applies to future imagination too. But if it applies to imagination, how is it different from discounting?

  7.  **Drafting the Opening Concessions:**
      *   Need to show humility and acknowledge the utility of the models being critiqued.
      *   Acknowledge the predictive power of quasi-hyperbolic models.
      *   Acknowledge that "presentation" might sound fuzzy.
      *   Acknowledge the Davidsonian framework is contested.

  8.  **Review and Refine (British English & Tone):**
      *   Ensure spelling (behaviour, programme, modelled).
      *   Ensure tone is academic but practical (doctoral level).
      *   Check timing (2 mins per reply is approx. 250-300 words spoken).
      *   Check ordering (Damage potential).

  9.  **Final Polish:**
      *   Make sure the distinctions between the constituencies are clear in the phrasing of the objections.
      *   Ensure the "Soft Spot" notes are brutally honest.
      *   Verify the "Must Land" section aligns with the thesis logic.

  *(Self-Correction during drafting)*: I initially thought about putting the Aristotelian objection high up. But actually, if the Economist says "Your distinction makes no difference to the model," that kills the paper's utility. If the Aristotelian says "You missed the moral bit," I can say "I'm doing action theory, not ethics." So the Economist is higher damage. The Planning Theorist is also high damage because they define the *action* part of philosophy of action. I will rank Economist #1, Planning Theorist #2.

  *(Refining the "Hope Nobody Asks")*: The "Two Future Options" problem is the strongest technical objection. If I choose between £100 in 30 days and £110 in 31 days, and I pick the £100 because it feels more vivid, that fits. But if I pick £100 in 30 days over £150 in 31 days *without* vividness differences, just because 30 days feels "sooner", does my theory hold? I need to make sure the "vividness" claim covers subjective temporal proximity. The question should probe the boundary of "present." Let's go with: "Does your account handle akrasia where neither option is perceptually present?"

  *(Refining Opening Concessions)*: Keep it tight. 2 minutes is short. Acknowledge the success of the beta-delta model in prediction. Acknowledge the Davidsonian picture is not the only game in town.

  *(Final check on constraints)*: British English. No references. Dialectic focus.

