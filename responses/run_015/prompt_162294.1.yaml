answer: |-
  # PREPARATION SHEET: QUESTION PERIOD
  **Paper:** Present Bias Without Discounting: Why Hyperbolic Curves Do Not Explain Akrasia
  **Context:** Joint Philosophy of Action / Behavioural Science Seminar
  **Time Allocation:** 25 Minutes Q&A

  ## 1. OPENING CONCESSIONS (First 2 Minutes)
  *Use this to lower defensive barriers before taking questions.*

  *   **Concede Predictive Utility:** Acknowledge explicitly that quasi-hyperbolic discounting models are empirically successful at *predicting* choice patterns. State clearly that you are not arguing the mathematics are wrong, but that the *ontological interpretation* of the parameters is mistaken.
  *   **Concede Davidsonian Contingency:** Acknowledge that your definition of akrasia rests on the Davidsonian synchronic picture (judging A better while doing B). Admit that if one rejects this picture (as the sceptics in the room might), the specific problem you are solving dissolves. You are arguing *internal* to that framework.
  *   **Concede 'Vividness' Ambiguity:** Admit that 'perceptual vividness' is a placeholder term that requires finer psychological granularity. You are proposing a structural distinction, not a finished psychological mechanism.

  ## 2. CRITICAL OBJECTIONS (Ordered by Damage Potential)

  ### I. The Instrumentalist Challenge (Experimental Economist)
  **The Objection:** 'You are drawing a metaphysical distinction without a difference. If the $\beta$-parameter successfully predicts the choice reversal, why does it matter whether we call it "time discounting" or "presentation sensitivity"? In modelling, we care about predictive accuracy, not the folk-psychological label attached to the curve. If your account yields the same choice functions, you haven't improved the science; you've just added philosophical baggage.'

  **The Reply:**
  'The distinction matters for intervention, which is the ultimate test of a behavioural model. If $\beta$ represents time preference, the remedy is pre-commitment: binding your future self to stop the discounting from biting. If $\beta$ represents presentation sensitivity, the remedy is cognitive or perceptual reframing: making the future consequence vivid *now*. These are distinct policy prescriptions. A model that gets the mechanism wrong risks prescribing costly pre-commitment devices when a cheaper perceptual nudge would suffice. We cannot separate the ontology from the intervention if we want the science to be practically useful.'

  **Soft Spot:**
  This relies on the claim that the interventions *must* differ. A savvy economist might argue that pre-commitment works *because* it alters the presentation of the choice set. If pre-commitment is just a way of manipulating vividness, your distinction collapses back into their model.

  ### II. The Intention Retention Challenge (Planning Theorist)
  **The Objection:** 'You focus entirely on the evaluative judgment at the moment of action. But on the planning theory of intention, akrasia is often a failure to retain a prior intention, not a reversal of value judgment. I can judge that exercising is better all things considered, form a plan to do so, and then simply fail to execute without re-evaluating the options. Your synchronic account ignores the diachronic stability of intention. Why isn't this just a failure of planning agency, irrelevant to discounting curves?'

  **The Reply:**
  'I agree that intention retention is a distinct phenomenon, often called "incontinence" rather than "weakness of will" in the literature. However, the paradigm cases that motivate the discounting literature—eating the cake, smoking the cigarette—involve a positive attraction to the smaller good at the moment of action, not merely a failure to execute a plan. The agent actively chooses the cake. My argument is that discounting models cannot explain this active choice *synchronically*. Your planning account explains why I didn't go to the gym; my account explains why, standing at the buffet, I actively chose the cake despite my standing judgment.'

  **Soft Spot:**
  This risks carving the phenomenon too thinly. If the audience believes that "active choice" against a plan is just a specific type of planning failure, you are arguing over labels. It begs the question against those who subsume evaluative reversal under planning failure.

  ### III. The Construal Level Challenge (Psychologist)
  **The Objection:** 'This looks exactly like Construal Level Theory (CLT). We already know that psychological distance—temporal, spatial, or hypothetical—changes how abstractly we represent options. "Presentation sensitivity" sounds like "low-level construal." If you are just renaming CLT, what is the philosophical gain? If you aren't, how do you distinguish "perceptual presence" from "psychological proximity" empirically?'

  **The Reply:**
  'CLT treats temporal distance and perceptual vividness as correlated dimensions of a single "psychological distance" metric. My claim is that they come apart. An option can be temporally distant but perceptually vivid (e.g., a vivid photograph of a future disaster), or temporally immediate but abstract (e.g., a digital number on a screen). CLT predicts these should shift together; my account predicts they can dissociate. The gain is showing that the "present" in present-bias is a phenomenological category, not a temporal one. This allows us to explain why some immediate rewards don't tempt us (they are abstract) and some future ones do (they are vivid).'

  **Soft Spot:**
  CLT proponents often argue that vividness *is* a form of reducing psychological distance. You risk being accused of splitting hairs between two variables that are operationally identical in experimental settings.

  ### IV. The Character Challenge (Neo-Aristotelian)
  **The Objection:** 'You reduce a moral failing to a perceptual glitch. If akrasia is just a sensitivity to mode of presentation, then the akratic agent isn't vicious or poorly habituated; they are just suffering from a cognitive illusion. This lets the agent off the hook. Surely the reason the cake tempts me is not just that it is "present," but that I have cultivated a character that finds cake salient. Your account ignores the role of habit and virtue in determining what strikes us as vivid.'

  **The Reply:**
  'I am not denying that character influences what we find vivid. A virtuous agent may find the healthy option more salient. My point is about the *structure* of the temptation at the moment of choice. Even a virtuous agent can be overwhelmed by a sufficiently vivid presentation of a bad option. The remedy I propose—recruiting perception—is compatible with moral education. Training one's character is, in part, training one's perceptual sensitivities. So this is not "letting the agent off the hook," but specifying the mechanism by which character exerts its force at the moment of action.'

  **Soft Spot:**
  This concedes too much ground. If character determines vividness, then "presentation sensitivity" is just the mechanism of virtue/vice. It risks making your account a sub-component of the Aristotelian view rather than a rival explanation.

  ### V. The Rationality Challenge (Sceptic)
  **The Objection:** 'You assume that synchronic inconsistency is a rational failing. But if my preferences change when the cake is in front of me, why is that irrational? Maybe the cake actually *is* better at $t_2$ because I am hungry. If the preference reversal is driven by a change in context (the presence of the cake), isn't that a rational update of information rather than a failure of will?'

  **The Reply:**
  'This challenges the Davidsonian premise I conceded earlier. However, within the framework of akrasia, the agent *judges* that the larger good is better *all things considered*, including the hunger and the presence of the cake. The "all things considered" judgment is supposed to aggregate all current contextual factors. If the agent judges, taking hunger into account, that dieting is better, and yet eats, that is not a rational update. It is a failure to act on the aggregate judgment. Discounting models treat the hunger as a change in discount rate; I treat it as a failure to align action with the aggregated judgment.'

  **Soft Spot:**
  This relies entirely on the coherence of the "all things considered" judgment. If the sceptic denies that such a judgment is psychologically real or normatively binding, your definition of akrasia evaporates.

  ## 3. THE "MUST LAND" REPLY
  *If you fail to make this point stick, the paper fails.*

  **The Point:** You must successfully defend the claim that **a discount function cannot operate on a single point in time.**
  **Why:** Your entire thesis rests on the mathematical claim that if $t_1 = t_2$, the discount factor $D(t_1) / D(t_2) = 1$, regardless of the curve's shape. If the audience convinces you that discounting can be *state-dependent* rather than *time-dependent* (i.e., the curve changes shape based on the presence of the stimulus, not just time), then hyperbolic discounting *can* explain synchronic akrasia after all.
  **The Line to Hold:** 'A discount function maps time to value. If time is held constant, the function cannot generate a value difference. To say the curve changes shape *because* the option is present is to admit that "time" is not the variable doing the work. It is the presence. Therefore, it is not discounting.'

  ## 4. THE QUESTION YOU HOPE NOBODY ASKS
  *'What about akrasia between two future options? Suppose I choose today to go to the cinema in 30 days rather than the gym in 31 days. Neither option is perceptually present. Neither is "now." Yet I still choose the smaller good. On your account, where is the presentation sensitivity operating? If you say "the cinema is more vivid in my imagination," how do you distinguish that from a steeper discount rate for the gym? At what point does "vividness" just become a synonym for "subjective probability" or "discounted value"?'*

  **Why this is dangerous:** It forces you to admit that "presentation" applies to imagined future states, not just perceptual present states. Once you admit that, the distinction between "imagining a future vividly" and "discounting a future less steeply" becomes perilously thin. It threatens to collapse your "Presentation-Sensitivity Account" back into a subjective discounting model, which is exactly what you are trying to avoid.

  ## 5. STRATEGIC NOTES FOR THE CHAIR
  *   **Graduate Students:** They will ask for the "experiment to settle it." Do not promise a single crucial experiment. Frame it as a research programme: 'We need to dissociate temporal delay from perceptual vividness. Look for cases where delay is constant but vividness varies.'
  *   **Time Management:** You have 25 minutes. If the Economist and the Planning Theorist get into a turf war, let them. Intervene only to restate the "Must Land" point.
  *   **Tone:** Maintain the stance of a philosopher clarifying concepts for scientists, not a scientist correcting philosophers. Defer to their empirical expertise while holding firm on the conceptual geometry.
