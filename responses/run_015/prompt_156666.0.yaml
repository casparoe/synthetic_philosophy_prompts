answer: |-
  # Terms of Reference: Emerging-Risk Committee Decision Protocol

  **Effective Date:** [Date]
  **Approved By:** Chief Risk Officer
  **Review Cycle:** Annual

  ## Part 1: Theoretical Basis (Plain English)

  *The following rules are derived from four logical principles regarding group judgment. These are stated plainly to satisfy the constraint that no member requires statistical training.*

  1.  **The Independence Principle (Theory):** When people guess independently, adding more people makes the group smarter. When people copy each other or read the same notes, adding more people just makes the same mistake louder. If everyone relies on the same two sources, nine people count as only two.
  2.  **The Competence Principle (Theory):** If members are better than a coin flip at finding the truth, majority rule helps. If they are worse than a coin flip, majority rule hurts. If we do not know their skill, we must assume they are no better than a coin flip.
  3.  **The Cost Principle (Theory):** If missing a real danger costs ten times more than a false alarm, we should act on a one-in-ten chance, not a fifty-fifty chance. The vote threshold must move to match the cost of the mistake.
  4.  **The Structure Principle (Theory):** A question asking "Will A and B happen?" is harder to answer than "Will A happen?" Voting on the package is riskier than voting on the parts.

  *The following thresholds are Stipulations chosen by the Chair and signed by the CRO to operationalize the principles above given our specific size (nine members) and data limitations.*

  ## Part 2: The Decision Procedure

  *This procedure is run by the Chair at the start of the item, before discussion begins. It takes approximately ten minutes.*

  ### Gate 1: The Truth Test (Ontology)
  **Question:** Will there be a definitive fact in the future that proves this exposure existed or did not exist (e.g., a court ruling, a claims spike), or is this a matter of policy preference (e.g., how much risk we *want* to hold)?
  *   **If Policy/Preference:** Stop. This is not a voting matter. Record as "Risk Appetite Item" and refer to the CRO for a directive.
  *   **If Fact:** Proceed to Gate 2.

  ### Gate 2: The Compound Test (Structure)
  **Question:** Does a "Yes" vote require two or more separate uncertain events to happen together (e.g., "Regulation passes" AND "It applies to us")?
  *   **If Yes:** Split the item into separate sub-questions (2a, 2b). Apply this procedure to each. A "Yes" on the main item requires a "Yes" on all parts.
  *   **If No:** Proceed to Gate 3.

  ### Gate 3: The Independence Count (Information Channels)
  **Question:** How many genuinely separate sources of information are represented in the room *before* discussion? (Count the briefing note as one source. Count a member with private data as a second. Count a member relying only on the briefing note as zero new sources.)
  *   **If 1 or 2 Sources:** Stop. The group is not independent enough to vote reliably. Record as "Low-Confidence Signal." Defer decision to the CRO or request external review.
  *   **If 3 or more Sources:** Proceed to Gate 4.
      *   *Note:* This number is the "Effective Vote Count" for later calculations.

  ### Gate 4: The Expert Check (Competence)
  **Question:** Is there a "Nominated Expert" present for this specific topic? (A list of Nominated Experts by domain is attached in Appendix A. E.g., General Counsel for Regulation, Chief Underwriter for Pricing.)
  *   **If Yes:** The Expert's vote counts as **3 votes**.
  *   **If No:** All votes count as **1 vote**.
      *   *Stipulation:* We assume non-experts are coin-flippers (50% competence). We assume the Expert is significantly better.

  ### Gate 5: The Conflict Check (Incentives)
  **Question:** Does any member represent a business unit that profits if we decide this is *not* a material exposure?
  *   **If Yes:** That member's vote counts as **0.5 votes**.
  *   **If No:** That member's vote counts as **1 vote**.

  ### Gate 6: The Cost Class (Asymmetry)
  **Question:** Which Cost Class does this item fall into? (Pre-defined by CRO in Appendix B).
  *   **Class A (Balanced):** Cost of False Alarm ≈ Cost of Missed Danger.
  *   **Class B (High Caution):** Cost of False Alarm ≫ Cost of Missed Danger (e.g., reputational damage from over-reacting).
  *   **Class C (High Vigilance):** Cost of Missed Danger ≫ Cost of False Alarm (e.g., solvency threat, pandemic).
      *   **If Class A:** Proceed to Vote.
      *   **If Class B:** Proceed to Vote.
      *   **If Class C:** Proceed to Vote.

  ### Gate 7: The Vote (Aggregation)
  **Action:** Conduct a silent written poll (Yes/No/Abstain). No discussion yet.
  **Calculation:** Sum the weighted votes for "Yes."
  **Thresholds:**
  *   **Class A (Balanced):** Pass if Weighted Yes Votes ≥ **5**. (Simple Majority)
  *   **Class B (High Caution):** Pass if Weighted Yes Votes ≥ **7**. (Super Majority)
  *   **Class C (High Vigilance):** Pass if Weighted Yes Votes ≥ **3**. (Minority Triggers Action)

  **Post-Vote:** Open discussion to explain votes. Chair records final decision based on the threshold. If the vote fails the threshold but discussion reveals new independent information, a second poll may be taken.

  ***

  ## Part 3: Application to Recurring Items

  Here is how the procedure applies to your three specific scenarios.

  ### Item 1: Coastal Water-Damage Spike
  *   **Gate 1 (Truth):** Yes. Claims data will confirm signal or noise in 6 months. -> *Proceed.*
  *   **Gate 2 (Compound):** No. It is a single question: Is this a signal? -> *Proceed.*
  *   **Gate 3 (Independence):** Everyone read the same briefing note. However, the Claims Manager has private data, and the Data Scientist has a model. That is 3 sources (Note, Claims, Data). -> *Proceed.*
  *   **Gate 4 (Expert):** No single nominated expert for "regional weather claims." -> *All votes = 1.*
  *   **Gate 5 (Conflict):** No BU reps have specific conflict on coastal water. -> *All votes = 1.*
  *   **Gate 6 (Cost):** You stated error types cost roughly the same. -> *Class A.*
  *   **Gate 7 (Vote):** Threshold is **5 weighted votes**.
  *   **Result:** Standard majority rule applies. The procedure validates your current intuition here, but enforces the silent poll to prevent the senior person from anchoring the room.

  ### Item 2: Agricultural Disclosure Regulation
  *   **Gate 1 (Truth):** Yes. The regulation will either apply or it won't. -> *Proceed.*
  *   **Gate 2 (Compound):** No. Single legal question. -> *Proceed.*
  *   **Gate 3 (Independence):** Everyone read the briefing. Only the General Counsel (GC) has independent knowledge. Total sources = 2 (Note, GC).
  *   **Stop Rule:** Gate 3 requires 3 sources for a reliable vote. We have 2.
  *   **Result:** **Do not vote.** The procedure flags that the group adds no value over the GC reading the note alone.
  *   **Handoff:** The decision is handed to the **General Counsel** as the Nominated Expert. The committee records the GC's view as the committee's view. The other eight members are formally recognized as noise in this specific instance.
  *   *Why this is hard:* It admits that holding the meeting is ceremonial for this item.

  ### Item 3: Novel Respiratory Outbreak (Pandemic BI)
  *   **Gate 1 (Truth):** **No.** You stated the truth "may not be settled for years or at all." Whether this becomes a "material exposure" depends on future management actions and external evolution, not just a fact waiting to be found.
  *   **Stop Rule:** Gate 1 fails. This is not a forecast; it is a risk appetite and scenario planning question.
  *   **Result:** **Do not vote Yes/No.** The procedure forbids a binary decision on an unknowable truth.
  *   **Handoff:** The item is reclassified as a **Strategic Scenario**. The committee's output is not a vote, but a recommendation to the Board to "Monitor and Stress Test."
  *   *Why this is unwelcome:* You wanted a decision to flag to the board. The procedure tells you that flagging it as a "Material Exposure" (a binary fact) is logically invalid at this stage. It forces you to admit uncertainty rather than hiding it behind a majority vote.
  *   *Secondary Failure:* Even if you bypassed Gate 1, Gate 3 (Independence) would fail (everyone briefed from same 3 sources). Gate 6 (Cost) would be Class C (High Vigilance), requiring only 3 votes, but with low independence and no truth, those 3 votes are correlated noise. The procedure protects you from false confidence.

  ***

  ## Part 4: Limitations and Self-Critique

  ### What This Procedure Cannot Do
  1.  **It cannot create competence.** If the whole room is wrong, the procedure only ensures you are wrong efficiently. It assumes the "Nominated Expert" is actually expert; if the GC is wrong on the regulation, Gate 4 cements that error.
  2.  **It cannot measure independence perfectly.** Gate 3 relies on the Chair counting "sources." This is a judgment call. Two people reading the same news source but interpreting it differently *feel* independent but are not.
  3.  **It cannot solve the "Small Number" problem.** With nine people, even if independent, the statistical guarantee that the majority is right is weak (roughly 60-70% confidence if competence is low). The procedure treats the vote as decisive, but it is probabilistically fragile.

  ### The Gate Most Likely to Be Answered Wrongly
  **Gate 3 (Independence Count).**
  In practice, the Chair will want to proceed to a vote. There will be pressure to count "interpretations" as "sources." I expect the Chair to confidently claim there are 3 sources when there are effectively 1.5.
  *   **Empirical Finding that Would Rewrite This:** If we track the "Independence Count" against decision accuracy and find that items with a count of 2 perform just as well as items with a count of 4, the threshold in Gate 3 is too conservative and is causing unnecessary bottlenecks. If items with a count of 2 perform poorly, the threshold is correct.

  ### Where My Reasoning Is Most Vulnerable
  **The Judgment on Independence.**
  You asked me to mark where my reasoning is likely to have gone wrong. It is the step where I treat "information channels" as a proxy for "statistical independence."
  *   **The Flaw:** I have assumed that because people read the same note, their errors are correlated. However, discussion (which happens *after* the silent poll) might decorrelate them by introducing new arguments. By forcing the silent poll *before* discussion to preserve independence, I may be sacrificing the accuracy gains that come from sharing unique information during the talk.
  *   **The Trade-off:** I prioritized preventing "herding" (everyone following the senior person) over "synergy" (everyone building a better model together). Given your note that the senior person tends to speak first and the room follows, I judged herding as the greater risk. If your senior person is skilled at eliciting independent views rather than dominating them, this procedure unnecessarily handicaps the group.

  ### Final Note on the "Unwelcome News" (Item 3)
  You expected the procedure to tell you something you did not want to hear on the Pandemic item. The procedure declares the question invalid for voting. This is not a bug; it is a feature. A vote implies a truth value. If the truth is unknowable, a vote is a lie. The procedure forces you to minute that *no decision was possible*, which is the only honest record for a risk that is fundamentally uncertain. This protects the committee from being blamed later for "missing" a risk that was, by definition, unmeasurable at the time.
