      *   *Disjunctivism (McDowell, Martin, Snowdon):* Veridical perception and hallucination/illusion are fundamentally different kinds of mental states. "It looks like X" is not a report on an inner state but a disjunction: (I see X) OR (It merely seems like X). No common factor.
      *   *Predictive Processing (Hohwy, Clark):* Perception is controlled hallucination. The brain predicts input. Error minimization.
