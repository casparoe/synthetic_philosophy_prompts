          *   *Merely Permissible:* Optional + no moral residue.
          *   *Moral Residue Account:* Supererogation is grounded in the presence of residue (a moral property/reason).
          *   *Marginal Principle:* Supererogation depends on alternatives (contextual/relational property), not intrinsic. An action can shift from supererogatory to obligatory based on cost/alternatives.
          *   *The Tension:* Residue Account says it's about a *moral property* (goodness/reasons). Marginal Principle says it's about *alternatives* (non-moral/structural). If residue implies moral goodness/reasons, why isn't it obligatory? Marginal Principle explains the shift but ignores the residue.

  2.  **Evaluate the Definitions (Philosophical Accuracy Check):**
      *   *Supererogation:* Standard definition is "good to do, not wrong not to do" (Urmson). The user's definition focuses on *residue* (gratitude/regret). This is a specific subset of accounts (often associated with Heyd or later developments on moral remainder).
      *   *Moral Residue:* Usually, "moral residue" is associated with *dilemmas* or *wrongdoing* (Williams, Nagel). Using it for supererogation is less standard but defensible (e.g., reasons for gratitude). However, linking "reason for blame if not performed" to supererogation is risky. If there's a reason for blame, it sounds like an obligation. Supererogation is typically defined by the *absence* of blame for omission.
      *   *Marginal Principle:* This sounds like the "Cost Principle" or the idea that supererogation is sensitive to sacrifice (cost to the agent). The user defines it as dependence on alternatives. This is standard (contextualism about supererogation).
      *   *The Tension:* The user frames it as "Moral Property vs. Non-Moral Property."

  3.  **Critique the "Tension":**
      *   *Is it a real tension?* Not necessarily. They might be addressing different questions.
          *   Residue Account: *What is the phenomenology/normative status* of the act? (Why do we praise it?)
          *   Marginal Principle: *What are the boundary conditions?* (When does it become required?)
      *   *The "Blame" Issue:* The user says residue includes "reason for blame if not performed." This is the biggest red flag. Standard supererogation theory says: If you don't do it, you are *not* blameworthy. If there is a reason for blame, it leans toward obligation. This needs addressing.
      *   *The "Moral Goodness" Objection:* The user asks: "If it is morally good, why isn't it obligatory?" This is the classic "Maximizing Consequentialist" challenge. Deontologists and Moderate Consequentialists answer this by denying that "maximizing good" is the only requirement.
      *   *The "Non-Moral Property" Claim:* The user claims the Marginal Principle grounds supererogation in a "non-moral property (availability of alternatives)." This is questionable. Alternatives often involve *cost* or *sacrifice*, which are morally relevant.

  4.  **Identify Missing Standard Objections/Responses:**
      *   *The Urmson Challenge:* The classic "Saints and Heroes" argument.
      *   *The Maximizing Objection:* If an action produces the most good, why isn't it required? (Consequentialism vs. Common Sense Morality).
      *   *The "Reasons" Debate:* Are supererogatory actions supported by "requiring reasons" or just "justifying reasons"? (Supererogation and the structure of reasons).
      *   *Heyd's Account:* David Heyd is the go-to for supererogation. He argues supererogation is *non-claimable* (others can't demand it). This relates to the residue/blame issue.
      *   *Moral Residue Terminology:* "Moral residue" is usually reserved for tragic dilemmas (doing wrong to do right). Using it for supererogation might confuse readers familiar with Williams/Nagel. Better terms: "Positive reactive attitudes," "Credit," "Praise."

  5.  **Drafting the Feedback:**
