answer: |-
  This is a sophisticated draft that engages with genuine meta-ethical problems regarding supererogation. However, there are some significant conceptual risks in how you define "moral residue" and how you frame the tension between the two principles.

  Here is an analysis of whether the tension is real, along with standard objections and terminological corrections you should consider.

  ### 1. The Definition of "Moral Residue" (Critical Issue)
  The most pressing issue is your definition of moral residue in the context of supererogation.
  *   **The Problem:** You write that residue includes "a reason for **blame** if not performed."
  *   **The Standard View:** In standard taxonomy (following Urmson, Heyd, etc.), supererogatory actions are defined by the fact that the agent is **not blameworthy** for omitting them. If there is a reason for blame upon omission, the action slides into the category of *obligatory*.
  *   **The Terminology:** "Moral residue" is traditionally associated with **moral dilemmas** and **tragic choices** (e.g., Bernard Williams, Thomas Nagel), where an agent does what is right but still feels a remainder of guilt because they violated a value. Using "residue" to describe the *positive* aftermath of a good deed (gratitude/praise) is non-standard and might confuse readers.
  *   **Suggestion:** Consider using terms like "positive reactive attitudes" (Strawson), "moral credit," or "praise-worthiness." If you stick with residue, explicitly exclude blame. The residue of supererogation should be *gratitude* or *admiration*, not *regret* (in the sense of moral failure) or *blame*.

  ### 2. Is the Tension Real?
  You frame the tension as: **Moral Property (Residue) vs. Non-Moral Property (Alternatives).**
  I would argue this tension is **not quite real** as described, but rather a category confusion. Here is why:

  *   **Alternatives are Morally Relevant:** The Marginal Principle (often called the "Cost Principle" or "Sacrifice Principle") does not rely on a *non-moral* property. The cost to the agent, or the availability of alternatives, is itself a morally relevant factor in most non-consequentialist theories (e.g., Scheffler's Agent-Centered Prerogatives). Therefore, the Marginal Principle is not grounding supererogation in the "non-moral"; it is grounding it in a *different moral consideration* (agent sacrifice vs. outcome value).
  *   **Compatibility:** The two accounts are usually seen as complementary, not competing.
      *   *Residue/Value:* Explains why the act is **good** (it produces value/virtue).
      *   *Marginal/Cost:* Explains why the act is **optional** (the cost is too high to demand it).
      *   *Synthesis:* An action is supererogatory when it has high moral value (Residue) *but* exceeds the call of duty due to high cost/risk (Marginal Principle).

  **Verdict:** The tension is better framed as **"Value vs. Demand."** The Residue Account explains the *positive status* of the act; the Marginal Principle explains the *limit of obligation*. They do not necessarily conflict unless you assume that "Moral Goodness" automatically entails "Obligation" (which is the Consequentialist view, not the common-sense view).

  ### 3. Missing Standard Objections and Responses
  You asked if you are missing standard objections. Yes, there are two major ones that should be acknowledged in this context.

  **A. The Maximizing Consequentialist Objection**
  *   **The Objection:** If an action generates moral reasons for gratitude and is "morally good" (as your Residue Account suggests), why isn't it obligatory? A maximizing consequentialist argues that if Action A produces more good than Action B, and you can do A, you are obligated to do A.
  *   **Relevance to your draft:** You ask, "If it is morally good, why isn't it obligatory?" This *is* the central debate of supererogation. You need to acknowledge that the Residue Account presupposes a non-maximizing moral theory (like Common Sense Morality or Deontology). Without stating that, the question looks like a gotcha rather than a feature of the theory.
  *   **Response:** The standard response is the distinction between **requiring reasons** and **justifying reasons** (Supererogation and the Structure of Reasons). Supererogatory acts have strong justifying reasons (making them good) but lack requiring reasons (making them mandatory).

  **B. David Heyd's "Non-Claimability" Account**
  *   **The Context:** David Heyd (*Supererogation: Its Status in Ethical Theory*) is the seminal text on this.
  *   **The Point:** Heyd argues that supererogation is not just about "goodness + optionality." It is about **non-claimability**. The recipient of the action cannot *demand* it.
  *   **Relevance:** This bridges your two principles. The "Residue" (gratitude) exists because the act was a gift, not a payment of debt. The "Marginal Principle" explains why it wasn't a debt (the cost was too high to claim). Citing Heyd would strengthen your taxonomy significantly.

  ### 4. Specific Recommendations for Revision

  1.  **Fix the "Blame" Clause:** Remove "reason for blame if not performed" from the definition of supererogatory residue. That defines obligation. Keep "reason for gratitude" and perhaps "reason for admiration."
  2.  **Reframe the Tension:** Instead of "Moral vs. Non-Moral," frame it as **"Intrinsic Value vs. Contextual Cost."**
      *   *Drafting idea:* "The tension is not between moral and non-moral properties, but between the *value* of the act (which pulls toward obligation) and the *cost* of the act (which pulls toward optionality)."
  3.  **Clarify the Marginal Principle:** Acknowledge that the "availability of alternatives" usually implies a difference in *sacrifice* or *risk*, which are morally weighted variables, not neutral ones.
  4.  **Address the "Why not Obligatory?" Question:** Explicitly state that the Residue Account rejects the principle that "Best = Obligatory." This is a feature, not a bug, of the account.

  ### Summary of Feedback
  *   **Is the tension real?** Not as "Moral vs. Non-Moral." It is real as "Value vs. Prerogative." The two accounts usually work together to define the "zone" of supererogation (High Value + High Cost).
  *   **Missing Objections:** The Consequentialist challenge (Why does Goodness not imply Obligation?) and the specific literature on "Claimability" (Heyd).
  *   **Major Fix:** Ensure your definition of supererogation excludes blameworthiness for omission.

  If you make these adjustments, the section will be philosophically robust and align better with the existing literature while maintaining your original insight about the interplay between value and context.
