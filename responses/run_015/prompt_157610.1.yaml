  ### The Principle: Constrained Aggregation with Prioritarian Weighting

  For your professional purposes, I propose you adopt the following operational principle. It is not a single rule, but a hierarchy of three clauses.

  **Clause 1: The Severity Threshold (Lexical Priority)**
  Harms that cross a specific threshold of severity (death, permanent serious injury, torture) cannot be outweighed by the aggregation of minor harms (delays, irritation, dust specks) across different people.
  *   *Bought by:* Case (b). This explains why you prevent the death despite the headaches. It also rescues you from the worry in (a) by clarifying that you avoid the torture because torture is categorically worse than dust, not simply because the number of dusted people is large.

  **Clause 2: Intra-Personal Aggregation**
  Minor harms *do* aggregate when they fall upon the *same* individual over time. A series of trivial irritations can constitute a serious harm if they accumulate within one life.
  *   *Bought by:* Case (c). This validates your comfort in comparing the forty years of dust against the six months of torture. It distinguishes "episodes of discomfort" from "people" by anchoring the sum to the life experiencing them.

  **Clause 3: Corrected Preference Satisfaction**
  A harm is defined by the setback to a person's interests or preferences. However, Willingness-To-Pay (WTP) is only a valid proxy for harm where transaction costs do not obscure the preference. If a person would avoid a harm but cannot be bothered to pay a penny to do so, the harm still counts.
  *   *Bought by:* Case (e) and Case (f). This distinguishes the "pointless detour" (pure loss) from the "safety improvement" (consensual trade-off). It repairs your WTP test in (f) by acknowledging that a penny of bother is not a true revelation of zero value.

  **Clause 4: Prioritarian Weighting**
  When aggregating harms that fall below the Severity Threshold, apply a weighting factor that gives greater moral importance to harms affecting the worst-off members of society.
  *   *Bought by:* Case (g). This provides the rule you lack for deciding when to favour the unfortunate over the fortunate.

  ### The Sacrifices: Which Verdicts Must Go?

  You asked me to tell you plainly which verdicts this principle cannot accommodate. A principle that saves every intuition is useless; it is merely a mirror. To have a tool, you must surrender two of your current positions.

  **1. You must surrender the reasoning in Case (a).**
  Currently, you say you take the dust option "and it is not close," implying the *number* of people drives the decision. Under Clause 1 (Severity Threshold), the number is irrelevant. Torture is lexically superior to dust. You still choose the dust option (to save the victim), but not because a tower of threes outweighs fifty years of pain. You choose it because torture is a category of harm that dust cannot touch, regardless of the multiplier. If you cling to the idea that enough dust *could* theoretically justify torture, you cannot hold Clause 1. I recommend you let this go. It is the source of your unease.

  **2. You must surrender the raw WTP test in Case (f).**
  Your current test ("would the person pay anything at all?") is broken by transaction costs. If you keep it, you cannot count the noise in (f), but you must count the dust in (a). This is inconsistent. Clause 3 repairs this by distinguishing between *value* and *transaction cost*. You must accept that your spreadsheet needs a "de minimis" threshold below which we do not ask people to pay, but above which we count the harm objectively.

  ### Implications for Your Unsettled Cases

  **Case (g): The Worst-Off Victim**
  The principle implies a clear verdict here. Under Clause 4 (Prioritarian Weighting), the suffering of the worst-off counts for more than the suffering of the fortunate. If the torture victim is the worst-off human alive, the weight against torturing them increases significantly. On the days you feel you cannot choose, it is because you are running a pure aggregation test against a priority test. This principle dictates that priority wins. You should take the dust, with greater confidence than in the standard case.

  **Unfelt Harms (Ninety Seconds Removed)**
  This principle implies these harms **count**.
  Clause 3 defines harm as a setback to interests, not just felt experience. If ninety seconds of life is removed, an interest (life span) is set back, even if the subject never notices. In transport appraisal, we count time regardless of whether the commuter spends it staring out the window or checking their watch. Consistency demands you count the lost life seconds. The fact that no statistic moves is a measurement failure, not a moral exemption.

  **Future Generations**
  This principle implies **equal weight, discounted only for uncertainty.**
  Clause 1 and 4 do not contain a "time since birth" restriction. A death in 2100 is as severe as a death in 2024. However, in practice (Monday morning), you face epistemic uncertainty. We do not know who will exist or what they will value. Therefore, you should not discount their welfare because it is in the future (pure time preference), but you may discount the *probability* of the harm occurring. Do not use the discount rate to make their suffering vanish; use it to reflect the chance that the scheme will not affect them at all.

  ### Right/Wrong vs. Decision/Commitment

  Finally, you asked which parts of this are questions you can be right or wrong about, and which are decisions you must make.

  **Questions of Consistency (Right/Wrong):**
  You can be objectively wrong about logical consistency. You cannot hold that dust outweighs torture in (a) because of the *number*, but that headaches do not outweigh death in (b) because of the *type*, without a rule distinguishing number from type. You can be wrong about the WTP test in (f) contradicting the dust count in (a). These are errors in reasoning. The principle above corrects these errors.

  **Questions of Foundation (Decision/Commitment):**
  You cannot be proven "right" about where the Severity Threshold lies. Is death the threshold? Is torture? Is permanent injury? This is a value judgement. Similarly, you cannot be proven right about *how much* extra weight to give the worst-off in Clause 4. Is it double? Ten times?
  These are not errors; they are commitments. You must decide them.

  **My Recommendation for Monday Morning:**
  Set your Severity Threshold at **permanent serious injury or death**. Anything below that (delay, irritation, minor injury) is aggregable. Anything above it is not.
  Set your Prioritarian Weighting to **apply only when the scheme disproportionately impacts deprived areas**, as per your department's existing equity guidelines, but interpret "impact" to include risk, not just outcome.

  If you adopt this, you will no longer be multiplying small losses by large numbers blindly. You will be aggregating minor inconveniences while holding a shield against catastrophic harm. It will not solve every moral dilemma, but it will ensure that when you write the line in the spreadsheet, you know exactly which values are doing the work.
