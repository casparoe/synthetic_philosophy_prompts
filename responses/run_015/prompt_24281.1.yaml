  *(Refining the "Individual vs. Group" point)*: This is tricky. RCP is usually about "What is the probability *this* man dies?" Discrimination is "Are women treated unfairly?" I need to bridge this. The bridge is: To determine if women are treated unfairly, we estimate the probability of success for a woman. RCP says that probability varies by class. Therefore, the claim of unfairness varies by class.

