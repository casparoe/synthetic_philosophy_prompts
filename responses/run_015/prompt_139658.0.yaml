answer: |-
  1. **The Piano Problem**
  **Question:** I've played piano for fifteen years, but if I try to think about what my left hand is doing in a fast passage, I fall apart. Your book argues this isn't a bug in my training, it's the normal case. Does this mean that after all this time, I'm not the operator of my own skills, I'm just the PR department for them?
  *(She will likely say: Exactly, you're the press secretary, not the president. The competence runs the show; the comprehension just writes the press release.)*
  **Follow-up:** If I'm just PR, why does the machine listen when I say "slow down" or "louder"? What lever am I pulling if I'm not actually inside the engine?

  2. **The Degradation Point**
  **Question:** There's all this evidence that making a skill explicit can wreck it—athletes choking, people failing to recognize faces after describing them. Given that, is comprehension ever more than a transmission technology for teaching other people?
  *(She will likely say: Yes, it's primarily for social coordination and teaching. It's not meant to run the skill.)*
  **Follow-up:** Then who is the audience when I reason things out alone in my head?

  3. **The Solitary Thinker**
  **Question:** You call comprehension a "socially-trained add-on." But some of the deepest math and music happens in total isolation. Is the solitary thinker just simulating a conversation with a society that isn't there?
  *(She will likely say: Yes, you internalize the social norms of argument. You're playing both sides of the table.)*
  **Follow-up:** If it's just simulated society, where do the *new* ideas come from? Does the simulation ever break the rules it was trained on, or does it just reshuffle the deck?

  4. **The Double Inversion**
  **Question:** You argue the Darwin point—you don't need a designer for design—and the Turing point—you don't need understanding for thinking—are the same inversion applied twice. Can you unpack that without using the word "inversion"?
  *(She will likely say: It's the same structure. Design without designer, thinking without understander. The "ghost" is always optional.)*
  **Follow-up:** If the "understander" is unnecessary for thinking, what specific work is left for the human to do besides pressing start?

  5. **The Wall Criterion**
  **Question:** Are today's big models a second instance of this inversion, or just fancy curve-fitting that will hit a wall once the data runs out?
  *(She will likely say: It's the inversion. The "wall" is a myth created by people who refuse to admit understanding isn't prerequisite for competence.)*
  **Follow-up:** Then what criterion could we agree on *in advance* that would tell us the difference between "hit a wall" and "there never was a wall," without moving the goalposts after the fact?

  6. **The Commentary Feedback Loop**
  **Question:** I have a theory: once we train systems to produce step-by-step reasoning and then train on those traces, we're forcing tacit competence through a lossy verbal channel and then making the lossy version the target. The system should slowly get replaced by a worse copy of its own explanation. Does your view predict that, and what's the measurable early sign?
  *(She will likely say: Yes, but we need the traces for oversight anyway. We can't fly blind.)*
  **Follow-up:** How much competence would you trade for how much legibility? Is there a point where the system is too legible to be useful, or too useful to be legible?

  7. **The Moral Standard**
  **Question:** If human moral judgement is itself competence without comprehension, then demanding that an AI explain its values is holding it to a standard we fail. Do we give up explanation as a safety tool, or hold machines to standards humans can't meet?
  *(She will likely say: We give up explanation. We should rely on behavior instead.)*
  **Follow-up:** How do you tell a system that's genuinely fine off-distribution from one that's just performing well on whatever we happened to test, with no appeal to reasons?

  8. **The Introspective Illusion**
  **Question:** You have a catch-all move: whenever anyone reports understanding something, you say "that's just the introspective illusion again." How do we distinguish that illusion from the rare case where comprehension actually leads competence?
  *(She will likely say: You can't distinguish them from the inside. The feeling is identical regardless of the mechanism.)*
  **Follow-up:** If the feeling is identical, what functional work is the concept of "understanding" doing for you other than gating membership in a club?

  9. **The Safety Protocol**
  **Question:** If we can't audit reasons, and behavior is the only metric, what does safety look like in practice? Do we just build smaller boxes and hope they don't grow?
  *(She will likely say: We build systems that are robustly aligned via training, not via policing thoughts.)*
  **Follow-up:** But if competence comes first, doesn't a robustly aligned system just look like a system that hasn't found a loophole yet?

  10. **The Abandonment Condition**
  **Question:** Finally, what evidence would actually make you abandon the view?
  *(She will likely say: If we found a case where comprehension reliably preceded competence.)*
  **Follow-up:** Given that learning almost always starts with mimicry, what would that case even look like in practice?
