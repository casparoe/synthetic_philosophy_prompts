          *   *Severity:* Medium-High. It's a category error. (2) treats collapse as ontological; (4) treats it as axiological.
          *   *Resolution:* Reframe (2) to acknowledge the evaluative stance.

      *   **Pair (2) vs. (5): Methodology vs. Conclusion.**
