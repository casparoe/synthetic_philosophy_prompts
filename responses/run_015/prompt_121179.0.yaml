answer: |-
  Your framework is sophisticated and demonstrates a strong grasp of current archaeological debates regarding resilience and complexity. However, there are genuine structural tensions within the set, primarily centering on how you define the unit of analysis and the ontological status of collapse itself. Below is an audit of the friction points, ranked by severity, followed by a proposal for a unifying revision and an identification of your hidden commitments.

  The most severe tension exists between commitments (1) and (2). In the Late Bronze Age case, you argue that the dissolution of palatial economies does not constitute collapse because the social substrate (villages) persisted. Here, the survival of the basic productive unit negates the label of collapse. Conversely, in the Maya case, you argue that the breakdown of dynastic and calendrical institutions constitutes a genuine collapse, even though regional populations and local rituals persisted. Here, the survival of the basic productive unit is insufficient to negate the label. You are applying inconsistent criteria for what counts as the essential "society." In (1), society is defined by the subsistence base; in (2), society is defined by the ideological superstructure. Without a bridging principle, this looks like special pleading rather than a consistent framework. The heavier burden lies on you to explain why palatial bureaucracy is dispensable in the Bronze Age but dynastic ritual is essential in the Maya lowlands.

  The second most severe tension is between (2) and (4). Commitment (4) correctly identifies that labeling a transition a collapse is an evaluative act based on normative preferences regarding complexity. However, commitment (2) asserts that the Maya event *was* a genuine societal collapse, phrasing it as an empirical fact rather than a value judgment. If (4) is true, (2) cannot be an objective description of reality; it must be a statement that the loss of Maya complexity meets your specific normative threshold for collapse. The friction here is categorical: (4) denies collapse is an empirical category, while (2) treats it as one. The burden falls on (2) to be rephrased. You must acknowledge that calling the Maya transition a collapse is a consequence of valuing integrated calendrical systems, consistent with (4), rather than an intrinsic property of the historical event.

  A moderate tension exists between (2) and (5). Your methodological rule in (5) presumes institutional persistence unless there is positive evidence of extinction. In the Maya case, you conclude that the integrated institution was irretrievably broken. You must ensure this conclusion is not drawn merely from the absence of stelae or inscriptions (absence of evidence), but from positive evidence that the knowledge and social relationships required to sustain those institutions were actively lost or suppressed (evidence of absence). If the cessation of monument carving is interpreted simply as a stop in production rather than a loss of knowledge, (5) would suggest continuity. To maintain consistency, you must verify that your classification of the Maya transition relies on evidence that the *capacity* for that complexity vanished, not just the *output*.

  The tension you suspected between (3) and (5) regarding Rapa Nui largely dissolves on closer inspection. Commitment (3) describes a shift from the moai cult to the Birdman cult. Commitment (5) advises assuming social knowledge continues unless proven extinct. These are compatible if the Birdman cult is interpreted as a transformation of existing ritual knowledge rather than a total extinction of religious practice. As long as you view the Birdman cult as a modification of prior social structures rather than a complete rupture, (5) supports (3). The friction only appears if you view the cult replacement as a total loss of prior social knowledge, which your phrasing in (3) ("deliberately replaced") suggests you do not.

  Ranking these tensions by severity: The inconsistency between (1) and (2) is the highest risk, as it undermines the comparative validity of your seminar framework. The contradiction between (2) and (4) is second, as it creates a philosophical category error. The methodological friction between (2) and (5) is third, as it is a matter of evidentiary interpretation that can be clarified without changing the framework.

  There is a single revision that would clean up the most conflicts at once. You should refine your definition of what constitutes the "system" at risk of collapse. Revise (1) and (2) to explicitly state that collapse is evaluated based on the failure of *inter-regional integration* rather than local subsistence or local ritual. In the Late Bronze Age, village systems were largely autonomous; the palaces were an overlay. In the Maya lowlands, the city-states were mutually dependent on a shared ideological and economic network. By specifying that you are measuring the collapse of *networked complexity* rather than *local society*, you align (1) and (2). This also satisfies (4), because valuing networked integration over local autonomy is explicitly a normative preference. This revision allows (5) to function correctly: you presume local persistence (as in LBA and Maya villages) but look for positive evidence of the break in the *network* (which exists in Maya, but is less clear in LBA village networks).

  Finally, by holding all five commitments together, you are implicitly buying into a hidden commitment: **Social Stratification of Resilience.** You are operating under the assumption that different layers of a civilization have different failure points and that the "failure" of the elite layer does not necessarily equate to the failure of the population. However, you are also implicitly committing to the idea that *ideological integration* is a more significant metric of societal health than *demographic continuity* in specific contexts (like the Maya). This means your framework ultimately privileges political and ritual cohesion over raw population numbers when defining "society," even if you argue otherwise in the Bronze Age case. You must be prepared to defend why ideological cohesion matters more in one instance than the other, or admit that your definition of "society" shifts depending on which layer held the system together.
