answer: |-
  This is a genuinely sharp exchange. You three are circling one of the most persistent stalemates in the free will literature, but you're tripping over some terminology distinctions that have been hammered out in the last 30 years of incompatibilist/compatibilist debate. Since you asked for a referee decision, I'm going to break this down by claim, identify where the philosophical literature stands, and then offer the "better framing" you asked for.

  Here is the adjudication.

  ### 1. Is Maya right that Frankfurt severs deliberative access?
  **Verdict: No, she is misdescribing the classic case, though her intuition points toward the right conclusion.**

  Maya claims the classic Frankfurt case works by severing the link between *deliberative accessibility* (what feels like a live option) and the *actual causal pathway*. She argues the case shows that having an alternative in your reasoning horizon isn't necessary for blame.

  **The Problem:** In the *standard* Frankfurt case (Frankfurt 1969), Jones is unaware of Black. Jones deliberates normally. He *does* see "not deciding now" or "voting for the other candidate" as a live option within his practical reasoning right up until he chooses. The "severing" happens between his *will* and *metaphysical possibility*, not between his *deliberation* and his *will*.

  Jones has full deliberative access. He just lacks **Regulative Control** (the power to bring about an alternative world). Maya is correct that Frankfurt cases aim to show Regulative Control isn't necessary for responsibility, but she is incorrect that the *classic case* removes deliberative accessibility.

  **However,** her Moral Psych background is showing here. She is likely anticipating the **Manipulation Argument** (Pereboom). If you *did* remove deliberative access (e.g., via direct manipulation of preferences so Jones never even considers option B), our intuition that Jones is responsible *does* tend to fade. Maya is sensing that *deliberative access* might be a proxy for **Sourcehood**. If Jones never considers B, is the action truly *his*?

  ### 2. Is Jonas's nested case window dressing or a substantive move?
  **Verdict: It is a substantive move known as the "Flicker of Freedom" strategy, but it likely fails on the "Robustness" objection.**

  Jonas proposes monitoring Jones's *recognition* of the branch point. If Jones recognizes "I could stop," Black intervenes. Jonas claims this removes deliberative accessibility, thereby saving PAP (because now Jones lacks the alternative *and* the access to it).

  **The Good:** This is not window dressing. This is a version of the **Flicker of Freedom** defense (championed by David Widerker and Carl Ginet). The argument is that Frankfurt cases never fully eliminate alternative possibilities; they always leave a "flicker" (e.g., the possibility of *beginning* to choose otherwise, even if you can't complete it). Jonas is trying to plug that flicker by targeting the deliberative framing itself.

  **The Bad:** Jonas claims this "saves PAP." Most Frankfurt defenders (like John Martin Fischer) will argue that the remaining alternative in Jonas's case (the fleeting recognition that is immediately crushed) is not a **Robust Alternative**. For PAP to do the work Jonas wants it to do, the alternative must be morally significant. If Jones recognizes the branch point but is causally determined to abandon it immediately by Black's device, he still couldn't have *done* otherwise.

  Furthermore, Jonas makes a strong empirical claim: *If you remove deliberative access, responsibility vanishes.* This is contentious. If Jones is determined by his own psychology to never frame "I could stop," but that psychology is authentically his (no manipulation), many compatibilists would still hold him responsible. Jonas is smuggling in a requirement that the agent must *know* they have freedom to be responsible, which is a high bar.

  ### 3. The Epistemic Objection (Jonas's last point)
  **Verdict: Jonas is right that Maya's phrasing risks making responsibility epistemic, but Maya is right that Frankfurt shifts focus to the Actual Sequence.**

  Jonas argues: *If responsibility holds when Jones thinks he has alternatives but doesn't, then responsibility depends on illusion (epistemic state), not real possibilities.*

  This is the crux of the disagreement.
  *   **Jonas** holds a **Leeway Incompatibilist** view: Responsibility requires real metaphysical openness (PAP).
  *   **Maya** is drifting toward **Source Compatibilism** (or Semicompatibilism): Responsibility requires that the action issue from the agent's own mechanisms (Actual Sequence), regardless of alternatives.

  Jonas is correct that if we keep the classic Frankfurt intuition (Jones is responsible) while admitting Jones has no objective alternatives, we are saying objective alternatives don't matter. But he is wrong to call this "epistemic." Frankfurt defenders don't say responsibility depends on the *belief* in alternatives. They say it depends on the **history of the actual sequence**. The belief is incidental. The fact that Jones *would have* chosen the same way without Black is what matters (the "Buffer" strategy).

  ### 4. What are they missing? (Sourcehood and Guidance Control)
  They are both fighting over the nature of the **Alternative Sequence** (What could have happened?), but the consensus in post-Frankfurt literature is that we should be looking at the **Actual Sequence** (What actually happened?).

  **The Missing Frame: Guidance Control vs. Regulative Control.**
  John Martin Fischer's distinction solves the standoff.
  *   **Regulative Control:** Requires alternative possibilities (PAP). Jonas wants this.
  *   **Guidance Control:** Requires that the mechanism issuing the action is the agent's own and is moderately reasons-responsive. Maya wants this (roughly).

  In the classic Frankfurt case, Jones lacks Regulative Control (Black ensures the outcome) but retains Guidance Control (Jones's own deliberation causes the action).
  In Jonas's nested case, if Black intervenes *at the moment of recognition*, does Jones retain Guidance Control? If Black's presence alters Jones's reasoning process *before* the decision, then Jones might lose Guidance Control too. But if Black is just a counterfactual intervener who never actually touches Jones because Jones chooses on his own, Jones retains Guidance Control.

  **The Moral Psych Angle:**
  Maya's cohort focus is actually the most interesting part. Recent work in moral psychology (e.g., Nichols, Knobe) suggests that ordinary blame practices track **causal history** (Sourcehood) more than **metaphysical possibility**. People blame agents who act from their own "deep self" even if determinism is true. Maya is intuitively tracking the *psychological conditions* for blame, while Jonas is tracking the *metaphysical conditions* for freedom. They are talking past each other.

  ### Final Adjudication: Who is more right?

  **Maya is more right about the *implications* of Frankfurt cases, but Jonas is more right about the *definitions*.**

  *   **Maya** correctly identifies that the philosophical community largely accepts Frankfurt cases as undermining PAP. She is right that responsibility tracks the "actual causal structure" (Sourcehood). However, she is wrong to describe the classic case as removing deliberative access.
  *   **Jonas** correctly identifies that PAP is about objective alternatives, not feelings. He is right that if we rely solely on Jones's *sense* of alternatives, we risk making responsibility subjective. However, his nested case doesn't save PAP; it just shifts the debate to whether "flickers" are robust enough (they generally aren't considered to be).

  **The Better Framing:**
  Stop arguing about whether PAP is true. Frankfurt cases successfully shifted the burden of proof. The debate is no longer "PAP vs. No PAP." The debate is **"Source Incompatibilism vs. Semicompatibilism."**

  *   **Question for Jonas:** Can you construct a case where Jones has Guidance Control (actual sequence is clean, reasons-responsive) but lacks *all* alternative possibilities (even flickers), where you still withhold responsibility? If not, you are a Semicompatibilist, not a PAP defender.
  *   **Question for Maya:** If you remove deliberative access entirely (Jones is manipulated to never frame the alternative), does Jones retain Guidance Control? If not, then deliberative access *is* necessary, not for PAP, but for **Ownership** of the action.

  **Recommendation:**
  Tell them to read **Fischer & Ravizza, *Responsibility and Control* (1998)**, specifically the chapters on Guidance Control. Then, have them look at **David Widerker's "Libertarianism and Frankfurt-Style Cases"** for Jonas's side, and **Derk Pereboom's "Hard Incompatibilism"** for the manipulation angle Maya is hinting at.

  **Winner:** Split decision. Maya wins on the *state of the literature* (Frankfurt kills PAP). Jonas wins on the *conceptual clarity* (PAP is about metaphysics, not psychology). But the real winner is **Sourcehood**, which neither of them explicitly named as the primary candidate for responsibility.
