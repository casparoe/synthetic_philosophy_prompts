prompt: |-
  I sit on the grants committee of a small foundation with an annual budget of roughly two million dollars, and we are deciding whether to adopt the importance / tractability / neglectedness framework — the scheme that is standard in cause-prioritization work — as our standing method for choosing where the money goes. In preparation I read a much-shared blog post explaining the framework by a writer who covers philanthropy for a general audience and is broadly sympathetic to it. The passage that matters I have reconstructed below close to how it read:

  "Choosing a cause is a multiplication problem. Estimate three factors and multiply them. Importance is the size of the prize: how much better the world would be if the problem were solved outright. Tractability is the exchange rate between resources and progress — what fraction of the problem a given amount of money or talent can eliminate. Neglectedness is how little is already being spent on it, and it matters because the first dollar into a problem does far more good than the ten-thousandth, so a well-funded cause has already picked its low-hanging fruit and a neglected one has not. Multiply and you have the expected good per dollar, which is the only number a donor has any business looking at. The practical upshot is that the best causes are, as a rule, the unfashionable ones: if a problem is important and tractable, the only explanation for its still being neglected is that no one has got round to it yet, and that neglect is precisely what makes your dollar go furthest. Two things follow. First, concentrate: a cause ranked second is by definition worse per dollar than the one ranked first, so a donor who spreads money across several causes is simply buying less good with the same cheque. Second, stay out of crowded causes: a new dollar for something like cancer research, which already commands enormous budgets, buys next to nothing, and is therefore close to worthless to a donor whose aim is to do good."

  A colleague on the committee, who is skeptical of the whole framework, says the multiplication is a category mistake: neglectedness is not a third independent factor but a claim about where we currently sit on the tractability curve, so multiplying by it counts the same thing twice. He adds that once you take diminishing returns seriously the object to be chosen is not a ranked list of causes but an allocation across a portfolio, one that equalizes marginal cost-effectiveness across causes — which will normally mean funding several at once rather than piling everything into the winner. On the cancer remark he says the post forgets about other people's money: if a well-funded institution receives my dollar it may spend less of its own, so the counterfactual effect of my dollar is not simply the marginal project it nominally purchases. I find all three points persuasive, which worries me — I may be flattered by a clever objection rather than told the truth — and I don't know enough about the framework to tell whether he is attacking it or attacking a version of it that only exists in the post.

  Please audit the passage rather than the framework in general. Work through it claim by claim and sort what you find into: what a careful proponent of the framework would endorse as stated; what is a legitimate simplification for a popular audience; what is a genuine misrepresentation or non sequitur; and what is contested among people who actually use the framework. Then tell me whether the two conclusions the post draws — put everything into your top-ranked cause, and treat crowded causes as worthless — survive correction of the passages they rest on, and how much weaker the defensible versions of those claims are.

  Two constraints on how you answer. First, I know the terms importance, tractability and neglectedness are defined slightly differently by different writers, and you have no way to check: wherever your verdict turns on which definition is in force, say so explicitly and give me the verdict under each reading rather than picking one silently. Second, I want the audit to come with its own error bars: attach a confidence level to each of your main judgments, name the one place where your own reasoning is most likely to be wrong, and state what argument or consideration — a definition, an empirical fact about how steeply marginal returns actually decay, a feature of the framework's intended use I haven't mentioned — would lead you to a different verdict on the multiplication objection and on the concentration conclusion.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User Role:** Member of a grants committee for a small foundation ($2M budget).
      *   **Task:** Audit a specific blog post passage about the Importance/Tractability/Neglectedness (ITN) framework, *not* the framework in general.
      *   **Colleague's Critique:**
          1.  Multiplication is a category mistake (Neglectedness $\subset$ Tractability).
          2.  Optimal strategy is portfolio allocation (equalizing marginal cost-effectiveness), not concentrating on #1.
          3.  Counterfactuals matter (crowded causes aren't worthless due to fungibility/displacement).
      *   **Output Requirements:**
          *   Sort claims into: Endorsed by careful proponents, Legitimate simplification, Genuine misrepresentation/non sequitur, Contested among users.
          *   Evaluate the two conclusions (Concentration, Avoid Crowded Causes) after correction.
          *   Constraint 1: Handle definition variations explicitly (give verdicts under different readings).
          *   Constraint 2: Include error bars (confidence levels), identify the weakest link in my own reasoning, and state what would change my verdict.

  2.  **Deconstruct the Passage:**
      *   *Claim 1:* "Choosing a cause is a multiplication problem." (ITN = $I \times T \times N$)
      *   *Claim 2:* "Importance is the size of the prize... if the problem were solved outright."
      *   *Claim 3:* "Tractability is the exchange rate... what fraction... a given amount... can eliminate."
      *   *Claim 4:* "Neglectedness is how little is already being spent... first dollar does far more good than the ten-thousandth."
      *   *Claim 5:* "Multiply and you have the expected good per dollar, which is the only number a donor has any business looking at."
      *   *Claim 6:* "Best causes are... unfashionable ones... neglect is precisely what makes your dollar go furthest."
      *   *Conclusion 1:* "Concentrate: a cause ranked second is by definition worse per dollar than the one ranked first... spreading money... is simply buying less good."
      *   *Conclusion 2:* "Stay out of crowded causes... buys next to nothing, and is therefore close to worthless."

  3.  **Analyze the Colleague's Critique vs. Standard EA/ITN Theory:**
      *   *Critique 1 (Category Mistake):* Is Neglectedness independent of Tractability?
          *   *Standard View:* Tractability is often defined as *current* marginal tractability. Neglectedness adjusts for the *shape* of the returns curve. If Tractability is defined as "technical solvability," N is independent. If Tractability is "marginal impact per dollar," N is embedded. The blog post defines Tractability as "fraction... a given amount... can eliminate" (sounds like average or technical) and Neglectedness as "first dollar vs ten-thousandth" (marginal returns).
          *   *Verdict:* The post treats them as separate multipliers. Careful proponents often treat them as interacting variables in a marginal impact function, not necessarily a simple $I \times T \times N$ scalar multiplication. The colleague has a point about double-counting *if* Tractability is defined marginally.
      *   *Critique 2 (Portfolio vs. Concentration):* Should you fund only #1?
          *   *Standard View:* Only if returns are linear. If returns diminish (which the post admits regarding neglectedness), you equalize marginal returns across causes. With a $2M budget, diminishing returns likely kick in fast.
          *   *Verdict:* The post's conclusion is a misrepresentation of optimal allocation theory under diminishing returns.
      *   *Critique 3 (Counterfactuals/Crowded Causes):* Are crowded causes worthless?
          *   *Standard View:* No. Fungibility matters. If you fund a university cancer lab, they might shift their own funds elsewhere. Also, "crowded" is relative.
          *   *Verdict:* "Close to worthless" is a massive exaggeration/misrepresentation.

  4.  **Drafting the Audit (Claim by Claim):**

      *   *Claim 1 (Multiplication):* Simplification. Real model is marginal impact function.
      *   *Claim 2 (Importance):* Endorsed (roughly).
      *   *Claim 3 (Tractability):* Contested definition. Is it technical or marginal?
      *   *Claim 4 (Neglectedness):* Endorsed concept (diminishing returns), but relationship to T is contested.
      *   *Claim 5 (Only number to look at):* Simplification/Idealization. Ignores risk, learning value, etc.
      *   *Claim 6 (Unfashionable):* Simplification.
      *   *Conclusion 1 (Concentration):* Misrepresentation/Non Sequitur. Violates marginal decision rule.
      *   *Conclusion 2 (Crowded = Worthless):* Misrepresentation. Ignores counterfactuals.

  5.  **Addressing Constraints:**
      *   *Constraint 1 (Definitions):* Need to distinguish between "Tractability as technical feasibility" vs. "Tractability as marginal cost-effectiveness."
      *   *Constraint 2 (Error Bars):* Assign confidence % to judgments. Identify my weakest link (likely the specific budget size vs. diminishing returns curve). State what would change my mind (e.g., if the foundation were $2B instead of $2M, or if causes were truly binary).

  6.  **Refining the Argument (Self-Correction/Nuance):**
      *   *Wait, does the post say Tractability is marginal?* "what fraction of the problem a given amount of money or talent can eliminate." This sounds like average productivity, not marginal. If T is average and N adjusts for margin, the multiplication *might* work as a heuristic, but it's still mathematically sloppy.
      *   *Colleague's "Category Mistake":* If T is "how solvable is it technically" and N is "how many resources are already there," they are distinct inputs to a function that *outputs* marginal impact. Multiplying them implies independence. If the returns curve is logarithmic, $Impact = I \times \log(Resources)$. The post implies $Impact = I \times T \times \frac{1}{Resources}$. This is a specific functional form assumption.
      *   *Concentration:* The post argues "ranked second is by definition worse per dollar." This is true *at the margin* for the first dollar. But if you spend $1M on Cause A, the second dollar on Cause A might be worse than the first dollar on Cause B. The post ignores the *slope* of the curve.
      *   *Crowded Causes:* The "close to worthless" claim is the weakest. Even in crowded fields, marginal impact > 0 usually, and counterfactuals can make it positive.

  7.  **Finalizing the Structure:**
      *   Introduction: Acknowledge the task and the colleague's sophistication.
      *   Section 1: Claim-by-Claim Audit (categorized as requested).
      *   Section 2: Evaluation of Conclusions (Concentration & Crowded Causes).
      *   Section 3: Constraint Compliance (Definitions, Error Bars, Weakest Link).

  8.  **Writing the Content (incorporating specific phrasing for constraints):**
      *   *Confidence Levels:* Use high/medium/low or percentages. Let's use percentages for precision as requested ("confidence level").
      *   *Definitions:* Explicitly split the "Tractability" definition issue.
      *   *Weakest Link:* Probably the assumption about the foundation's size relative to the cause's absorption capacity. $2M is small globally, but large for niche causes.
      *   *Change of Verdict:* If the foundation were an individual donor with $1k, concentration makes more sense. If the cause is binary (existential risk prevention where only one solution works), concentration makes more sense.

  9.  **Review against constraints:**
      *   Did I audit the passage, not the framework? Yes.
      *   Did I sort claims? Yes.
      *   Did I evaluate the two conclusions? Yes.
      *   Did I handle definition variations? Yes.
      *   Did I attach confidence levels? Yes.
      *   Did I name the place my reasoning is most likely wrong? Yes.
      *   Did I state what would change my verdict? Yes.

  10. **Final Polish:** Ensure tone is appropriate for a grants committee member (professional, analytical, nuanced). (Self-correction: Make sure not to sound like I'm endorsing EA, just auditing the text against EA norms).

  *(Self-Correction during drafting)*: I need to be careful about the "Multiplication" claim. Some early EA materials *did* present it as multiplication. Is it a misrepresentation or just outdated simplification? I should classify it as a "Legitimate simplification that becomes a Misrepresentation when applied rigidly." Actually, the prompt asks to sort into specific buckets. I will classify it based on what a *careful proponent* (current state of the art) would say. Careful proponents now view it as a heuristic for estimating marginal impact, not a literal formula. So "Legitimate simplification" fits best, bordering on "Contested."

  Let's refine the "Category Mistake" analysis. The colleague says N is a claim about where we sit on the T curve. If T is defined as the *slope* of the curve at the current point, then N is redundant. If T is the *height* of the curve (total solvability), N is the *position* on the x-axis. The post defines T as "fraction... a given amount... can eliminate." This is ambiguous. I must highlight this ambiguity per Constraint 1.

  Okay, ready to write.s
answer: |-
  Here is an audit of the blog post passage, structured according to your requirements.

  ### Part 1: Claim-by-Claim Audit

  I have categorized each substantive claim in the passage based on how it aligns with the reasoning of careful, technical proponents of the Importance/Tractability/Neglectedness (ITN) framework (often associated with Effective Altruism research organizations).

  **1. "Choosing a cause is a multiplication problem. Estimate three factors and multiply them."**
  *   **Verdict:** **Legitimate Simplification** (with caveats).
  *   **Analysis:** Early expositions of the framework often used multiplication as a heuristic. However, careful proponents view ITN not as a literal formula ($I \times T \times N$) but as three *inputs* into a function estimating **marginal cost-effectiveness**.
  *   **Definition Dependency:** If "Tractability" is defined as *technical feasibility* (can it be done?), multiplication is a reasonable heuristic. If "Tractability" is defined as *marginal return on investment* (how much good does the next dollar do?), then multiplying by Neglectedness is indeed double-counting, as marginal return already accounts for how much funding is present.
  *   **Confidence:** 90%

  **2. "Importance is the size of the prize: how much better the world would be if the problem were solved outright."**
  *   **Verdict:** **Endorsed by Careful Proponents.**
  *   **Analysis:** This aligns with the standard definition of "scale" or "importance." It refers to the total negatable burden (e.g., DALYs, lives, welfare units).
  *   **Confidence:** 95%

  **3. "Tractability is the exchange rate between resources and progress — what fraction of the problem a given amount of money or talent can eliminate."**
  *   **Verdict:** **Contested Among Users.**
  *   **Analysis:** This definition is ambiguous. It sounds like *average* productivity rather than *marginal* productivity. Careful proponents emphasize that we care about the *marginal* dollar (the next one), not the average dollar. If the post implies average tractability, it sets up the error your colleague identified.
  *   **Confidence:** 85%

  **4. "Neglectedness is how little is already being spent on it, and it matters because the first dollar into a problem does far more good than the ten-thousandth..."**
  *   **Verdict:** **Endorsed by Careful Proponents.**
  *   **Analysis:** This correctly identifies the economic principle of diminishing marginal returns. Neglectedness is a proxy for where we sit on the returns curve.
  *   **Confidence:** 95%

  **5. "Multiply and you have the expected good per dollar, which is the only number a donor has any business looking at."**
  *   **Verdict:** **Genuine Misrepresentation.**
  *   **Analysis:** Careful proponents explicitly warn against ignoring other factors, such as risk aversion, learning value (information gain), community building, or flow-through effects. Furthermore, "expected good per dollar" is the *goal*, but ITN is just the *method* of estimation. Claiming it is the "only number" ignores uncertainty and model error.
  *   **Confidence:** 90%

  **6. "The best causes are, as a rule, the unfashionable ones... neglect is precisely what makes your dollar go furthest."**
  *   **Verdict:** **Legitimate Simplification.**
  *   **Analysis:** While generally true that neglectedness boosts marginal impact, it is not a strict rule. Some fashionable causes are so important and tractable that they remain competitive even with high funding. However, as a heuristic for a small donor, this is acceptable.
  *   **Confidence:** 80%

  ---

  ### Part 2: Evaluation of Conclusions

  The post draws two specific prescriptive conclusions. Here is how they survive the audit above.

  **Conclusion 1: "Concentrate: a cause ranked second is by definition worse per dollar than the one ranked first, so a donor who spreads money across several causes is simply buying less good with the same cheque."**

  *   **Status:** **Non Sequitur / Misrepresentation.**
  *   **Correction:** This conclusion relies on the assumption of *constant returns to scale*. The post explicitly admits diminishing returns in the Neglectedness section ("the first dollar... does far more good than the ten-thousandth"), but then ignores this admission in the Conclusion.
  *   **Economic Reality:** If returns diminish, the optimal strategy is to fund causes until their *marginal* cost-effectiveness is equalized. If Cause A is #1 but its returns drop sharply after $500k, and Cause B is #2 but has flat returns, a $2M foundation should fund both.
  *   **Survival Rate:** **Low.** The argument collapses once you acknowledge the diminishing returns the post itself describes. Your colleague is correct: for a $2M budget, a portfolio approach is almost certainly superior to "winner-take-all" unless the causes are binary (e.g., preventing a specific existential risk where partial funding yields zero probability of success).
  *   **Confidence:** 85%

  **Conclusion 2: "Stay out of crowded causes... a new dollar for something like cancer research... buys next to nothing, and is therefore close to worthless to a donor whose aim is to do good."**

  *   **Status:** **Genuine Misrepresentation.**
  *   **Correction:** This ignores **counterfactuals** and **fungibility**. As your colleague noted, if you fund a cancer researcher, the institution may reallocate their own funds to a different, perhaps riskier or more neglected, cancer project. Your dollar "frees up" their dollars.
  *   **Nuance:** While the *direct* marginal impact of a dollar in a crowded field is lower than in a neglected one, it is rarely "close to worthless." It is only worthless if the marginal project funded is literally zero-value *and* there is no fungibility.
  *   **Survival Rate:** **Very Low.** This is a rhetorical flourish not supported by the underlying economic logic. Even strict utilitarians generally agree that funding high-quality work in crowded fields has positive counterfactual value, even if it is not the *optimal* use of funds compared to a top neglected cause.
  *   **Confidence:** 90%

  ---

  ### Part 3: Constraints and Error Bars

  **1. Definition Dependency Verdicts**
  As requested, here is how the verdict on the "Multiplication/Category Mistake" objection changes based on the definition of Tractability:

  *   **Reading A (Tractability = Technical Solvability):** If Tractability measures "how possible is it to solve this if we tried?" (independent of funding), then Neglectedness is a separate factor measuring "how much funding is currently applied." Under this reading, the multiplication is **not** a category mistake, though it is still a simplification of a complex function.
      *   *Verdict:* Colleague's objection is **Weaker**.
  *   **Reading B (Tractability = Marginal Cost-Effectiveness):** If Tractability measures "how much good does the next dollar do?", then Neglectedness is already baked into the number. Multiplying by Neglectedness counts the funding level twice.
      *   *Verdict:* Colleague's objection is **Stronger**.
  *   **Current Consensus:** Most modern technical writing leans toward Reading B (marginal impact), making the colleague's critique technically accurate regarding the math, even if the heuristic (Reading A) is useful for brainstorming.

  **2. Confidence Levels on Main Judgments**
  *   **Claim 1 (Multiplication is literal):** 90% confidence this is a simplification that misleads.
  *   **Claim 5 ("Only number to look at"):** 90% confidence this is a misrepresentation.
  *   **Conclusion 1 (Concentration):** 85% confidence this is false for a $2M foundation.
  *   **Conclusion 2 (Crowded = Worthless):** 90% confidence this is false.

  **3. The Weakest Link in My Reasoning**
  My reasoning is most likely wrong regarding **Conclusion 1 (Concentration)** specifically in relation to your foundation's **absorption capacity**.
  *   **Why:** I am assuming that a $2M foundation will hit diminishing returns quickly in the #1 cause. However, if the "top cause" is something like "AI Safety Policy" or "Pandemic Preparedness," the field may be able to absorb $2M with nearly linear returns. If the cause is "Eradicate Malaria in one specific village," returns diminish instantly. The post assumes the former (global causes); your colleague assumes the latter (local constraints). Without knowing the specific cause space, my judgment that "portfolio is better" relies on an empirical assumption about the steepness of the returns curve.

  **4. What Would Change My Verdict**
  *   **On the Multiplication Objection:** If you can show me a standard technical paper from the Center for Effective Altruism or Open Philanthropy that explicitly defines the framework as $Impact = I \times T \times N$ where $T$ is defined as *technical feasibility* (not marginal return), I would downgrade the colleague's "category mistake" claim from "Persuasive" to "Pedantic."
  *   **On the Concentration Conclusion:** If the foundation's goal were **risk-neutral expected value maximization** on a **binary outcome** (e.g., "Prevent this specific asteroid impact"), the concentration argument would become correct. In binary cases, splitting funds reduces the probability of success without gaining diversification benefits. If your grants are all-or-nothing interventions, the post's advice becomes defensible.
  *   **On the Crowded Causes Conclusion:** If empirical data showed that fungibility in major institutions (like the NIH) is near zero (i.e., they spend every dollar they have regardless of outside grants), the "worthless" claim would move from "Misrepresentation" to "Debatable." However, current evidence suggests high fungibility.

  ### Summary Recommendation for the Committee
  The blog post is a **popularization that has hardened into dogma.** It takes useful heuristics (look for neglected areas) and turns them into rigid mathematical rules (multiply three numbers, fund only the winner) that do not hold up to economic scrutiny.

  Your colleague's objections are not merely clever; they are technically correct regarding the optimization math.
  1.  **Do not adopt the multiplication formula** as a standing rule. Use ITN as a checklist for discussion, not a calculator.
  2.  **Reject the "Concentrate" rule.** For a $2M budget, diversifying across 2–3 high-priority causes to manage risk and account for diminishing returns is standard best practice.
  3.  **Reject the "Crowded = Worthless" rule.** Evaluate crowded causes based on counterfactual impact (what does this free up?), not just direct impact.

  The framework is useful for *generating* options; the post's rules are dangerous for *selecting* them.
