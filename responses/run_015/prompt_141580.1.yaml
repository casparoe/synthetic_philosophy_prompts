      *   **Context:** Seminar on agency/AI safety (Goal-Directed vs. Approval-Directed). Supervisor adds a point about reversibility/cost of revision.
      *   **Problem:** Needs a concrete decision procedure to choose between Goal-Directed (Outcome) and Approval-Directed supervision for new tasks (10-15 times/term).
      *   **Constraints:** ~20 mins per decision, undergrad annotators (1 hr training, no theory), 20 hrs/week total budget (dense human judgment is expensive), grad mentor signs off but doesn't sit in. Decisions revisited end-of-term.
      *   **Requirements:**
          *   Ordered questions.
          *   Sufficient answers for each.
          *   Termination conditions (No, Yes/Goal, Yes/Approval, Hybrid).
          *   Explicit hand-offs for value judgments (who decides).
          *   Grounded in specific distinctions (approver visibility vs. downstream impact, task hardness vs. outcome checkability, second approver consistency, stakeholder representation).
          *   Include supervisor's reversibility point (where relevant/red herring).
          *   Run procedure on 3 specific cases (Calendar, Triage, Feedback).
          *   At least one outcome must be counter-intuitive/unliked (specifically hinting at the Calendar agent due to sunk cost).
          *   Limitations section (blind spots, forbidden tasks, judgment calls disguised as checklist).

  2.  **Deconstruct the Theoretical Framework:**
      *   *Goal-Directed (Outcome):* Optimize $O$. Good if $O$ is robust, non-gameable, and captures true value. Bad if $O$ is a proxy (Goodhart's Law).
      *   *Approval-Directed:* Optimize $A(action|context)$. Good if $O$ is hard to specify but humans recognize quality. Bad if approvers are myopic, blind to long-term consequences, or biased.
      *   *Reversibility (Supervisor):* Approval instructions are easier to change than outcome verifiers.
      *   *Constraints:* Low budget, low-skill annotators, quick decisions.

  3.  **Drafting the Decision Procedure (The "Algorithm"):**
      *   *Goal:* A flowchart in text form that fits the 20-minute constraint.
      *   *Step 1: Outcome Verifiability.* Can we measure success objectively without human judgment *after* the fact?
          *   If Yes -> Lean Goal.
          *   If No -> Lean Approval.
      *   *Step 2: Gaming/Proxy Risk.* If we measure $O$, will the agent cheat or optimize the metric at the expense of the spirit? (e.g., closing tickets by blocking users).
          *   If High Risk -> Lean Approval.
      *   *Step 3: Approver Visibility.* Can the annotator see the downstream consequences? (e.g., did the email offend the recipient? did the meeting actually happen?).
          *   If Annotator is blind to consequences -> Approval is dangerous (myopia).
      *   *Step 4: Stakeholder Alignment.* Are the annotators the ones suffering if it goes wrong?
          *   If No -> Value Hand-off needed.
      *   *Step 5: Reversibility (Supervisor's Point).* Is the task definition stable?
      *   *Hybrid Condition:* Use Outcome as objective, Approval as constraint (filter).

      *Refining for the User's Constraints:*
      *   Need to be specific about *who* answers. The student (User) answers most, but some require the Mentor or Stakeholders.
      *   Need to incorporate the "Sunk Cost" trap explicitly.
      *   Need to ensure the "Counter-intuitive" result happens (Calendar agent). Why would Calendar be risky for Approval? Because approval data exists (sunk cost), but approval is myopic regarding *negotiation dynamics* (long term relationship damage vs short term win). Or, conversely, why would it be risky for Goal? Because "meeting booked" is easy to game (book a meeting no one wants).
      *   *Decision:* Let's make the Calendar agent a "Hybrid" or "Goal" case despite the approval data, forcing the user to abandon the "Approval" comfort zone they've built. Actually, the prompt asks for *one* outcome I won't like. If I've been running approval on Calendar for 6 weeks, being told to switch to Goal (or Hybrid) is the friction point. Let's aim for: Calendar = Goal-Directed (because outcome is clear), Triage = Hybrid (outcome exists but gaming is high), Feedback = Approval (no ground truth).
      *   *Wait, re-reading the prompt:* "I want at least one of these to come out in a way I will not like, and I want you to say plainly if that case is the calendar agent, given the annotation time already sunk into it."
      *   *Strategy:* The procedure should indicate that for the Calendar agent, *Goal-Directed* is safer/better, despite the 6 weeks of approval data. This forces the user to discard the sunk cost. This aligns with the "Outcome is cheaply and non-gameably checkable" distinction. Booking a room is binary.

      *Drafting the Steps:*
      1.  **Outcome Definability:** Is there a binary/numeric signal available within 48 hours that correlates with task success?
      2.  **Gaming Surface:** If we optimize that signal, can the agent achieve it while making the situation worse for the human?
      3.  **Approver Epistemic Access:** Can the undergraduate annotator see the *consequences* of the action, or just the *action*?
      4.  **Stakeholder Representation:** If the agent fails, who pays? Are they in the room?
      5.  **Reversibility Check:** (Supervisor's point). How often will the definition of "good" change?

      *Hand-offs:* If Stakeholder Representation fails -> Mentor/Stakeholder decides. If Gaming Surface is ambiguous -> Mentor decides.

  4.  **Running the Cases:**
      *   **Case 1: Calendar.**
          *   Outcome: Meeting booked? Yes/No. Time within constraints? Yes/No.
          *   Gaming: Agent books meeting at 3 AM? (Constraints prevent). Agent books meeting but attendees hate it? (Hard to measure).
          *   Approver Access: Annotator sees email thread. Doesn't see if attendees were annoyed.
          *   *Verdict:* Goal-Directed. (This hurts the user because they have 6 weeks of approval data).
      *   **Case 2: Triage.**
          *   Outcome: Ticket closed, no reopen in 48h.
          *   Gaming: Agent marks as "won't fix" to close quickly.
          *   Approver Access: Annotator sees ticket content.
          *   *Verdict:* Hybrid. Outcome is the target, Approval is the constraint (must check "tone" and "logic" before sending).
      *   **Case 3: Feedback.**
          *   Outcome: None. Quality is subjective.
          *   Gaming: N/A (hard to game "helpful feedback" without approval).
          *   Approver Access: Course staff (experts) can judge quality.
          *   *Verdict:* Approval-Directed.

  5.  **Limitations & Blind Spots:**
      *   Distribution shift (tasks change).
      *   Annotator fatigue/bias.
      *   "Checklist morality" (following the form vs. thinking).
      *   Tasks involving high stakes (financial, legal) should never use this lightweight procedure.

  6.  **Refining the Tone:**
      *   Professional, academic, slightly prescriptive (it's a procedure).
