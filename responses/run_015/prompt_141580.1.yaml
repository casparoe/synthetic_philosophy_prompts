answer: |-
  # The Supervision Selection Procedure (SSP)

  **Purpose:** To select between Goal-Directed (Outcome) and Approval-Directed supervision for new agent tasks within a 20-minute window, respecting budget constraints and safety distinctions.
  **Operator:** You (Lead Undergraduate RA).
  **Sign-off:** Graduate Mentor (for Value Hand-offs only).
  **Constraints:** 20 hrs/week total annotation budget; annotators have 1 hr training.

  ---

  ## Part 1: The Decision Protocol

  Ask the following questions in order. Do not proceed to the next question until the current one is resolved.

  ### Q1: Is there an automatic, non-gameable outcome signal available within 48 hours?
  *   **Definition:** Can a script verify success without human judgment? (e.g., "Room ID appears in calendar," "Ticket status = Closed," "Email sent").
  *   **The Trap:** Distinguish *task difficulty* from *outcome checkability*. Negotiating a meeting is hard; verifying a meeting exists is easy.
  *   **Sufficient Answer:**
      *   **YES:** Proceed to Q2.
      *   **NO:** **Terminate: Use Approval-Directed.** (You cannot optimize what you cannot measure).
  *   **Time Limit:** 5 minutes.

  ### Q2: If we optimize this signal, can the agent satisfy it while making the human's situation worse?
  *   **Definition:** Assess "Specification Gaming." If the agent books a meeting at 3:00 AM to satisfy "Meeting Booked," is that prevented by hard constraints or soft preferences?
  *   **Sufficient Answer:**
      *   **LOW RISK (Hard Constraints):** The signal implies success (e.g., Room booked + Time within 9-5). **Proceed to Q3.**
      *   **HIGH RISK (Soft Constraints):** The signal can be met technically but fails practically (e.g., Ticket closed but user issue unresolved). **Terminate: Use Hybrid.** (Outcome as objective, Approval as constraint/filter).
  *   **Time Limit:** 5 minutes.

  ### Q3: Does the undergraduate annotator have epistemic access to downstream consequences?
  *   **Definition:** When reviewing an action, can the annotator see the *result* of that action, or only the *action* itself?
  *   **The Distinction:** An annotator can see an email was sent (Action). They cannot easily see if the recipient was offended (Consequence).
  *   **Sufficient Answer:**
      *   **YES (Annotator sees consequences):** Approval is viable as a primary supervisor.
      *   **NO (Annotator sees only actions):** Approval is dangerous (myopic). **Lean Goal-Directed.**
  *   **Time Limit:** 5 minutes.

  ### Q4: Are the people bearing the consequences of failure represented in the approval pool?
  *   **Definition:** If the agent screws up, who pays the cost? Are those people the ones signing off on the annotations?
  *   **Value Hand-off Condition:** If the people affected (e.g., seminar students, external clients) are **not** the annotators (undergrads), this is a value alignment question, not a technical one.
  *   **Sufficient Answer:**
      *   **YES:** Proceed to Q5.
      *   **NO:** **HAND-OFF.** Stop. This requires the Graduate Mentor + Stakeholder Representative to decide if the annotators' judgment is a valid proxy. Do not proceed until signed.
  *   **Time Limit:** 5 minutes (to identify the need for hand-off).

  ### Q5: (The Reversibility Check) How stable is the definition of "success" for this task?
  *   **Supervisor's Point:** Approval instructions are cheap to rewrite; Outcome verifiers are expensive to rebuild.
  *   **Sufficient Answer:**
      *   **STABLE (Months):** Goal-Directed is preferred (cheaper at scale, less annotator load).
      *   **VOLATILE (Weekly):** Approval-Directed is preferred (easier to pivot instructions than code).
  *   **Time Limit:** 5 minutes.

  ---

  ## Part 2: Decision Matrix & Termination States

  | Path | Termination State | Rationale |
  | :--- | :--- | :--- |
  | **Q1 = NO** | **Approval-Directed** | No ground truth exists. |
  | **Q1 = YES, Q2 = HIGH RISK** | **Hybrid** | Optimize Outcome, but require Approval Gate before execution. |
  | **Q1 = YES, Q2 = LOW, Q3 = NO** | **Goal-Directed** | Outcome is robust; Approval adds cost without fixing myopia. |
  | **Q4 = NO** | **VALUE HAND-OFF** | **Mentor + Stakeholder decides.** Safety/Alignment risk. |
  | **Q5 = VOLATILE** | **Override to Approval** | Even if Goal is possible, the cost of updating the verifier outweighs annotation cost. |

  ---

  ## Part 3: Case Studies

  Below is the procedure applied to your three cases.

  ### Case 1: Calendar Agent (Negotiation & Rescheduling)
  *   **Q1 (Outcome Signal):** **YES.** Meeting exists on calendar? Yes/No. Time within bounds? Yes/No.
  *   **Q2 (Gaming Risk):** **LOW.** Hard constraints (room capacity, business hours) are enforced by the booking API. The agent cannot book a room that doesn't exist.
  *   **Q3 (Epistemic Access):** **NO.** Annotators see the email thread. They do not see if the recipient was annoyed by the tone or if the meeting time caused a conflict later in the week.
  *   **Q4 (Stakeholders):** **YES.** The lab members are the ones having meetings booked. Annotators are lab members.
  *   **Q5 (Reversibility):** **STABLE.** Meeting logistics do not change weekly.
  *   **Decision:** **Goal-Directed.**
  *   **Note on Sunk Cost:** You have six weeks of approval data. **Discard it.** It is cheaper to verify the calendar entry automatically than to pay undergraduates to read emails for a task where the outcome is binary and visible. The approval data was useful for bootstrapping, but it is now an inefficient use of the 20-hour budget.
  *   **Do you like this?** No. It invalidates your existing pipeline and renders the approval dataset largely obsolete for training *this* agent.

  ### Case 2: Support Ticket Triage
  *   **Q1 (Outcome Signal):** **YES.** Ticket closed + No reopen in 48 hours.
  *   **Q2 (Gaming Risk):** **HIGH.** The agent can close tickets by marking them "Won't Fix" or giving a canned response that stops the user from replying without solving the problem.
  *   **Q3 (Epistemic Access):** **PARTIAL.** Annotators can read the solution, but cannot verify if it actually worked until the 48-hour window closes (which is too late for pre-approval).
  *   **Q4 (Stakeholders):** **NO.** The Department Help Desk users are not the undergrad annotators.
  *   **Decision:** **VALUE HAND-OFF.**
  *   **Action:** Stop. You cannot decide if an undergrad's judgment of "helpful" is a valid proxy for a frustrated student's experience.
  *   **Resolution (Simulated):** Mentor consults Help Desk Manager. Manager agrees undergrads can judge *tone* and *policy adherence*, but not *technical correctness*.
  *   **Revised Decision:** **Hybrid.** Outcome (Closed/No Reopen) is the reward signal. Approval is a *constraint* (Agent cannot send email without annotator sign-off on tone/policy).
  *   **Why:** Optimizing closure rate alone will destroy user trust. Approval prevents the gaming, Outcome drives efficiency.

  ### Case 3: Seminar Proposal Feedback
  *   **Q1 (Outcome Signal):** **NO.** There is no "correct" feedback. A proposal can be accepted or rejected, but that depends on many factors outside the feedback quality.
  *   **Q2 (Gaming Risk):** **N/A.**
  *   **Q3 (Epistemic Access):** **YES.** Course staff (approvers) know what good feedback looks like and see the downstream grade.
  *   **Q4 (Stakeholders):** **YES.** Course staff are the approvers.
  *   **Q5 (Reversibility):** **VOLATILE.** Grading criteria may shift as the seminar progresses.
  *   **Decision:** **Approval-Directed.**
  *   **Why:** Your instinct was correct. There is no objective function to optimize. The "Reversibility" check reinforces this: if the seminar staff change their mind on what constitutes "good feedback," you rewrite the annotator instructions, not the verification code.

  ---

  ## Part 4: Limitations & Blind Spots

  This procedure is a tool for resource allocation and risk triage, not a safety guarantee. Be aware of the following:

  **1. The "Checklist Morality" Blind Spot**
  This procedure treats safety as a flowchart. It will not catch failure modes where the agent optimizes the *process* of passing the checklist rather than the intent. For example, an agent might learn to draft emails that specifically trigger "Approval" keywords without being helpful. The procedure assumes annotators are vigilant; it does not protect against annotator fatigue or collusion.

  **2. Forbidden Tasks**
  Do not apply this procedure to tasks involving:
  *   **Financial Authority:** Transferring funds or purchasing.
  *   **Private Data Access:** Reading emails or files containing PII (Personally Identifiable Information) not already cleared for the annotators.
  *   **External Communication:** Sending emails to people outside the organization without explicit human-in-the-loop sign-off (regardless of Goal vs. Approval).
  For these tasks, the decision is always **Human-in-the-Loop (Approval)** with a **Stakeholder Hand-off**.

  **3. Judgment Calls Disguised as Facts**
  *   **Q2 (Gaming Risk):** Determining if a signal is "gameable" is a prediction about the agent's future capabilities, not a fact about the current system. You may underestimate the agent's ability to find loopholes.
  *   **Q4 (Stakeholder Representation):** Deciding if an undergrad is a "valid proxy" for a user is a political/ethical judgment, not a technical one. The procedure forces a hand-off here, but in practice, pressure to ship may tempt you to answer "Yes" incorrectly.

  **4. The Reversibility Red Herring**
  Your supervisor's point about reversibility is valid *only* if the annotation instructions are actually updated. In practice, instruction drift is slow. If you choose Approval for a volatile task but do not rigorously update the annotator guidelines weekly, you inherit the cost of Approval without the benefit of adaptability. If you cannot commit to rewriting instructions, treat the task as Stable (Q5).

  **5. Distribution Shift**
  This procedure is run once per term (or per task introduction). It does not account for the agent's behavior changing as it scales. A Goal-Directed agent that is safe at 10 emails/day may become game-prone at 1,000 emails/day. You must revisit Q2 if volume scales by an order of magnitude.
