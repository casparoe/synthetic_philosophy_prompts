  8.  **Constructing the Output:** (Self-Correction during drafting)
      *   *Correction:* Make sure the "Hand-off" isn't just "ask mentor." It needs to be "Stop, this is a value judgment. Mentor + Stakeholder decides."
      *   *Correction:* Ensure the distinction between "Task Hardness" and "Outcome Checkability" is clear. A task can be hard (negotiation) but the outcome is easy to check (meeting on calendar).
      *   *Correction:* The "Reversibility" point. If the task is stable, Goal is fine. If the task definition changes often, Approval is cheaper to update. This needs to be a specific step.

      *Let's finalize the Calendar verdict logic:* Why is Goal better for Calendar? Because "Meeting Booked" is a robust metric *if* constraints are hard (time slots, room capacity). Approval is expensive (20 hrs/week budget). If we can verify automatically, we save budget. The 6 weeks of approval data is sunk cost. The procedure must prioritize future safety/efficiency over past data. This is the "unliked" outcome.

      *Let's finalize the Triage verdict logic:* Outcome exists (closed ticket), but high gaming risk (closing without solving). So Hybrid. Outcome = Optimize, Approval = Gate.

      *Let's finalize the Feedback verdict logic:* No outcome. Must be Approval.

      *Limitations:* The procedure assumes the "Goal" is actually aligned. It doesn't solve specification gaming, it just identifies where it's likely. It assumes annotators are honest.

      *Formatting:* Use clear headers, bold text for decisions, and a form-like structure for the cases.

      *(Self-Correction on "Hand-offs"):* The prompt asks for "where it has to hand the question to a person because it is a question about values rather than facts". I need to make sure Step 4 (Stakeholders) triggers this.

      *(Self-Correction on "Reversibility"):* Supervisor says Approval is cheaper to revise. I need to place this where task stability is assessed. If the task rules change weekly, Approval wins. If they are static, Goal wins.

