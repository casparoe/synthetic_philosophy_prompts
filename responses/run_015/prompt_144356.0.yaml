          1.  Setup & Preference Cards (10 mins).
          2.  Protocol Construction (10 mins).
          3.  Vote 1 (Sincere) (10 mins).
          4.  Information Reveal & Strategy (15 mins).
          5.  Vote 2 (Strategic) (15 mins).
          6.  Debrief & Theorem Mapping (15 mins).

  4.  **Develop the "Payoffs":**
      *   Need to make them care.
      *   *Option A (Representationalist):* Control over Reading List (Intellectual control).
      *   *Option B (Antirepresentationalist):* Weighted Peer Evaluation (Grade influence).
      *   *Option C (Pragmatist):* Speaking Privileges (First to speak in seminars).
      *   *Assignment:* Distribute secret "Interest Cards" so students have different ordinal rankings of these outcomes.

  5.  **Address the "Sincerity Protocol":**
      *   This is crucial for the philosophical angle. They must try to agree to be honest. This sets up the inevitable failure.
      *   They will draft a "pledge." It will fail because the incentive structure overrides the pledge (Prisoner's Dilemma-esque).

  6.  **Address the GS Conditions in Debrief:**
      *   *Universal Domain:* Students had different cards.
      *   *Non-Dictatorship:* No single student decided alone.
      *   *Manipulability:* Round 2 showed changing the vote changed the outcome favorably.
      *   *Limitation:* We only played one profile, not *all* profiles.

  7.  **Predict Failures:**
      *   *Moral Refusal:* Philosophers might value honesty over payoff. *Fix:* Emphasize the pedagogical necessity of testing the system, or make the payoffs about the *group's* future comfort rather than individual gain. Actually, better to lean into the tension: "Is rationality moral?"
