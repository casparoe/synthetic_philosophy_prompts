answer: |-
  I have been discussing with a colleague whether postgraduate students truly grasp why strategy-proofness collapses in non-trivial social choice mechanisms, or whether they merely memorise the Gibbard-Satterthwaite theorem without feeling its force. To address this, I propose the following workshop design, titled **The Methodological Pact**. It is calibrated for fourteen philosophy postgraduates, lasting seventy-five minutes, utilising the specific stakes and alternatives you requested.

  ### Workshop Overview: The Methodological Pact

  **Objective:** To demonstrate experientially that in any deterministic voting system with three or more outcomes, there exists a scenario where a voter benefits from misrepresenting their preferences, unless one individual holds dictatorial power.

  **Materials Required:**
  *   14 **Preference Cards** (sealed envelopes, distributed randomly).
  *   14 **Ballot Papers** (ranked choice).
  *   A whiteboard for tallying.
  *   A timer.
  *   Three labelled boxes representing the outcomes: **Representationalist (R)**, **Antirepresentationalist (A)**, **Pragmatist (P)**.

  **The Stakes (Payoffs):**
  To ensure the stakes are felt without violating institutional grading policies, the payoffs are framed as *conventions* for the remainder of the term:
  1.  **Representationalist (R):** Control over the **Shared Reading List** (The winning faction selects two key texts).
  2.  **Antirepresentationalist (A):** **Peer-Evaluation Weighting** (The winning faction's feedback counts double in peer-review sessions).
  3.  **Pragmatist (P):** **Speaking Privileges** (The winning faction is granted priority in raising hands during seminars).

  ---

  ### Timeline and Procedure

  #### 1. Induction and Preference Assignment (00:00 – 00:10)
  Distribute the sealed **Preference Cards**. Each card assigns the student a strict ordinal ranking of the three outcomes (e.g., $R \succ P \succ A$).
  *   **Facilitator Note:** To guarantee a manipulable outcome, do not distribute these purely randomly. Ensure a **Condorcet Cycle** or a tight Borda distribution exists within the group. For fourteen students, a distribution such as 5 ($R \succ A \succ P$), 5 ($A \succ P \succ R$), and 4 ($P \succ R \succ A$) creates sufficient tension.
  *   Instruct students that their goal is to secure their *highest* ranked outcome. They must not show their cards to others.

  #### 2. The Sincerity Protocol (00:10 – 00:25)
  Before voting, invite the group to draft a **Sincerity Protocol**. Ask them: *"If we all vote truthfully, we respect the collective will. Can we agree to bind ourselves to sincerity?"*
  *   Allow them ten minutes to debate and sign a social contract on the whiteboard promising to vote their true preferences.
  *   **Pedagogical Point:** This establishes the normative desire for truth-telling. It creates the tension for the later collapse. The protocol must be explicitly *unenforceable* (no penalties for lying), relying solely on honour.

  #### 3. Round One: The Sincere Vote (00:25 – 00:35)
  Conduct the vote using a **Borda Count**.
  *   **Rule:** 1st choice = 2 points, 2nd choice = 1 point, 3rd choice = 0 points.
  *   Students mark their ballots according to their private Preference Cards (adhering to the Protocol).
  *   Tally the scores publicly. Announce the winner.
  *   **Crucial Step:** Do not reveal the aggregate preference profile yet. Simply announce the result (e.g., "Pragmatism wins").

  #### 4. The Strategic Revelation (00:35 – 00:50)
  This is the pivot. Reveal the aggregate profile on the board.
  *   Identify a specific subset of voters (e.g., the 5 students who preferred $R \succ A \succ P$). Show them that under the current tally, their least favourite option might have been avoided, or their second favourite secured, had they voted differently.
  *   **The Prompt:** "The Protocol is non-binding. You have five minutes to consult within your preference groups. If you could change your ballot to improve your outcome, knowing how others voted, would you? The Protocol relies on honour; the Payoff relies on points."
  *   Allow them to realise that the **Sincerity Protocol** is unstable. If they know the tally, they can calculate a **strategic vote** (e.g., burying a strong rival by ranking them last, even if they are genuinely second).

  #### 5. Round Two: The Equilibrium Vote (00:50 – 01:05)
  Run the Borda Count again.
  *   Explicitly permit strategic misrepresentation.
  *   Observe the shift. Often, the winner changes, or the group deadlocks.
  *   **The Dictator Option:** If the result is chaotic, pause. Offer the group a choice: "We can continue voting indefinitely, or we can appoint a **Dictator**. One person's preference becomes the social choice. No voting, no strategy."
  *   If they appoint a Dictator, note the immediate stability. The game ends.

  #### 6. Debrief and Theorem Mapping (01:05 – 01:15)
  Bring the class to order. Map the experience to the Gibbard-Satterthwaite conditions:
  *   **Universal Domain:** "You held varied Preference Cards; no restriction was placed on what you could want."
  *   **Non-Dictatorship:** "Until the final minute, no single student dictated the outcome."
  *   **Manipulability:** "In Round Two, those who changed their ballots did so not because their preferences changed, but because the *mechanism* rewarded insincerity."
  *   **The Limitation:** Be honest. "We played one specific profile. The theorem claims this vulnerability exists for *every* possible profile. We cannot play every permutation in seventy-five minutes. You must take my word, or prove it mathematically, that this instability is structural, not accidental."

  ---

  ### Anticipated Failures and Mitigation

  Even with careful design, philosophical cohorts may resist the economic logic of the simulation. Here is how to handle the likely friction points.

  **1. Moral Refusal to Manipulate**
  *   **Prediction:** Students may argue that violating the Sincerity Protocol is ethically impermissible, regardless of the payoff. They may vote sincerely in Round Two out of integrity.
  *   **Mitigation:** Pre-empt this in the introduction. Frame the simulation as a **veil of ignorance** exercise. Remind them: *"You are not testing your personal morality; you are stress-testing the institutional mechanism. If the system collapses because it relies on saints, the system is flawed, not the saints."* If they still refuse, declare the mechanism 'broken' by their own standards and move to the Dictator option to show that only authority guarantees the protocol's survival.

  **2. Failure to Identify the Strategic Move**
  *   **Prediction:** Without economics training, students may not intuitively grasp how to 'bury' a candidate in a Borda Count. They may assume voting $R \succ P \succ A$ when they prefer $R \succ A \succ P$ is 'lying' but not realise it is *profitable* lying.
  *   **Mitigation:** Have a 'plant' (a teaching assistant or a confident student briefed beforehand) in one of the preference groups. If the group stalls, the plant should suggest: *"If we rank Pragmatism last, even though we like them second, we stop them from winning."* Alternatively, during the Revelation phase, explicitly walk through the arithmetic of one hypothetical voter to demonstrate the gain.

  **3. Cynicism Regarding Payoffs**
  *   **Prediction:** Students may dismiss the stakes (speaking privileges, etc.) as trivial, reducing their incentive to strategise.
  *   **Mitigation:** Emphasise the **cumulative nature** of the payoffs. Remind them that this decision binds the seminar for the *entire term*. If they treat it as a game, the lesson is lost. If they treat it as governance, the tension becomes visceral.

  ### Closing Remark for the Facilitator

  When you conclude, return to your colleague's scepticism. Acknowledge that the simulation does not prove the theorem's logical necessity—that requires syntax and proof. However, it achieves something the proof cannot: it makes the students *complicit* in the collapse. They will have felt the itch to manipulate the ballot. They will have felt the relief of the Dictator's stability. They will not merely memorise that strategy-proofness collapses; they will have participated in its collapse. That, surely, is the difference between knowing the theorem and feeling its force.
