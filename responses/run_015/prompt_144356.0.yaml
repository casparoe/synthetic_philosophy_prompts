      *   *Result:* The function is manipulable (not strategy-proof).
      *   *Key Insight:* If you aren't a dictator, there exists a scenario where lying about preferences yields a better outcome than telling the truth.

  3.  **Design the Simulation:**
      *   *Time:* 75 minutes.
      *   *Participants:* 14 students.
      *   *Alternatives:* Representationalist (R), Antirepresentationalist (A), Pragmatist (P).
