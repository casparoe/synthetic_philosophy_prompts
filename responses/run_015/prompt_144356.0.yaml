      *   *Payoffs:* Need to be assigned secretly.
      *   *Phases:*
          1.  Intro & Preference Assignment (10 mins).
          2.  The "Sincerity Protocol" (15 mins).
          3.  Round 1: Sincere Voting (10 mins).
          4.  The Twist/Strategy Session (15 mins).
          5.  Round 2: Strategic Voting (15 mins).
          6.  Debrief (10 mins).
      *   *Wait, 75 mins is tight.* Need to streamline.
