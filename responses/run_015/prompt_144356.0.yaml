      *   **Context:** A discussion with a colleague about whether students *grasp* the theorem or just *memorise* it.
      *   **Theme:** Voting on methodological stances (Representationalist, Antirepresentationalist, Pragmatist) for the term.
      *   **Payoffs:** Tangible but non-monetary (speaking privileges, peer-evaluation weighting, reading list control).
      *   **Structure:**
          1.  Construct a "sincerity protocol".
          2.  Run an aggregation mechanism (3+ alternatives).
          3.  Reveal strategic manipulation is unavoidable (unless dictatorship).
          4.  Debrief mapping play to GS conditions.
          5.  Admit limitations (logical generality).
