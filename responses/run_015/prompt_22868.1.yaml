      *   **The Core Distinction:** Token (HP) vs. Type (Woodward). "Who broke prod?" vs. "How does this system work?"
      *   **The Mechanism (Holding Fixed):** Explain the "Witness" (HP) vs. "Intervention on Parents" (Woodward).
