      *   *HP Specifics:* HP requires AC1 (actual values), AC2 (counterfactual dependence with contingency), AC3 (minimality). The "contingency" is the key. It allows you to say "Hold the backup system fixed at 'inactive' to see if the primary mattered."
      *   *Woodward Specifics:* Focus on *modularity*. An intervention breaks the link between $X$ and its parents. It asks: "Is the relationship $X \to Y$ stable?"
      *   *The "Bug":* In RCA, we usually want HP (Who is responsible?). In System Design, we want Woodward (If I tune X, will Y improve?).

  7.  **Final Polish:**
      *   Tone: Peer-to-peer, technical, respectful of their expertise.
