      *   This captures preemption perfectly. Node A "preempted" Node B.
      *   HP: Yes, A is cause. If we hold B fixed at "didn't try", A still causes success. If we hold A fixed at "didn't try", B causes success. But in *actual* world, A won. HP uses the witness to isolate A's contribution.
      *   Woodward: Asks if "Node A attempting" is a general cause of "Log Entry". Yes. But for the *specific* token event, Woodward is less prescriptive than HP.

      *Wait, let's make it an Incident.*
      *   Incident: Service Down.
