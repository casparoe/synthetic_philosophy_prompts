answer: |-
  You're right to feel like they're cousins. They both live in the same neighborhood (Structural Equation Models / Causal DAGs), and they both speak the same language ("intervene on $X$, watch $Y$"). If you're just drawing boxes and arrows, they look identical.

  But the difference matters when you're staring at a post-mortem at 3 AM trying to decide if a specific config flag was the *actual* cause of an outage, or just a correlate.

  Here is the in-the-weeds distinction, translated into infra terms.

  ### 1. The Core Goal: "Who Broke It?" vs. "How Does It Work?"

  *   **Halpern-Pearl (HP)** is a theory of **Actual Causation** (Token Causation).
      *   **Question:** "In *this specific incident*, did *this specific* variable setting cause *this specific* outcome?"
      *   **Use Case:** Root Cause Analysis (RCA). Blame assignment. Debugging a specific trace.
      *   **Mindset:** Forensic. We are looking for the minimal set of changes that would have prevented *this* exact failure.

  *   **Woodward (Interventionist)** is a theory of **Type Causation** (General Causation).
      *   **Question:** "Is there a stable relationship between $X$ and $Y$ such that if I manipulate $X$, $Y$ changes?"
      *   **Use Case:** System Design. Capacity Planning. A/B Testing.
      *   **Mindset:** Engineering. We are looking for levers we can pull to control the system generally.

  ### 2. The Mechanism: What Are We "Holding Fixed"?

  This is the technical crux. Both frameworks use Structural Equation Models (SEMs). You have variables ($X, Y, Z$) and equations ($Y := f(X, Z)$). To test if $X$ causes $Y$, you change $X$ and see if $Y$ changes. But you can't just change $X$; you have to decide what to do with the rest of the system ($Z$).

  #### Woodward: The "Surgical" Intervention
  Woodward insists on **modularity**. When you intervene on $X$ (write `do(X=1)`), you are severing $X$ from its *own* parents, but you must leave the rest of the mechanism intact.
  *   **What is held fixed:** The structural equations for all other variables.
  *   **The Constraint:** You cannot force a variable to take a value that violates its own causal parents *unless* you also intervene on those parents.
  *   **Infra Translation:** If you want to test if the Load Balancer ($LB$) causes Latency ($L$), you force the $LB$ to route to Region A. You *cannot* simultaneously force the Database ($DB$) to be fast if the $LB$ routing naturally makes the $DB$ slow. You have to let the $DB$ react naturally to the $LB$ change. You are testing the *stability of the relationship*.

  #### Halpern-Pearl: The "Witness" (Contingency)
  HP is trying to solve the "Preemption" problem (see below). To do this, it allows you to hold variables fixed at values **they did not actually take**, even if that violates the system's normal logic, *provided* it helps reveal a dependency.
  *   **What is held fixed:** A specific subset of variables (the "witness") is clamped to specific values (the "contingency") to test if $X$ matters *under that specific scenario*.
  *   **The Constraint:** Minimality. You only clamp variables if necessary to show $X$ makes a difference.
  *   **Infra Translation:** You are debugging a trace. You can say, "I know the Fallback Service *actually* failed, but if I hypothetically freeze the Fallback Service in a 'Success' state (even though it crashed), does the Primary Service failure still matter?" HP lets you freeze the Fallback at 'Success' to see if the Primary is *still* a cause.

  ### 3. The Showdown: Preemption (The Redundant Service Bug)

  This is where the rubber meets the road.
  **Scenario:** You have a Primary Writer ($P$) and a Fallback Writer ($F$).
  *   If $P$ succeeds, Data is Written ($W=1$).
  *   If $P$ fails, $F$ triggers. If $F$ succeeds, $W=1$.
  *   If both fail, $W=0$ (Outage).

  **The Incident:**
  1.  Primary Writer crashes ($P=0$).
  2.  Fallback Writer *should* trigger.
  3.  **BUT**, a separate network partition kills the Fallback too ($F=0$).
  4.  Result: Outage ($W=0$).

  **The Question:** Is the Primary Crash ($P=0$) a cause of the Outage ($W=0$)?
  Intuitively: Yes. If $P$ had worked, we wouldn't be here.
  But wait: Even if $P$ worked, the network partition was there. Would $F$ have been needed? No.
  Actually, let's make it **Preemption** (the classic philosophical case):
  1.  Primary Writer crashes ($P=0$).
  2.  Fallback Writer triggers and *Succeeds* ($F=1$).
  3.  Result: Success ($W=1$).
  4.  **Wait, that's not an incident.** Let's make it **Early Preemption** (The "Two Assassins" problem mapped to Health Checks).

  **Better Infra Scenario: The Pod Kill Race**
  *   **Goal:** Kill Pod $K$.
  *   **Actor A (Health Check):** Detects hang, sends `SIGKILL`.
  *   **Actor B (Deployment Bot):** Detects new version, sends `SIGKILL`.
  *   **Effect:** Pod Dies ($D=1$).
  *   **Timeline:** Actor A sends kill. Pod dies immediately. Actor B sends kill 10ms later (pod already dead, no-op).
  *   **Actual World:** $A=1$ (Kill sent), $B=1$ (Kill sent), $D=1$ (Dead).

  **Question:** Did Actor A cause the death? Did Actor B?
  *   **Intuition:** A caused it. B was preempted (arrived too late to matter).
  *   **Simple Counterfactual:** "If A hadn't sent kill ($A=0$), would Pod live ($D=0$)?"
      *   Answer: No. Because B *would have* sent the kill ($B=1$), so Pod still dies ($D=1$).
      *   Simple counterfactuals say A is **not** a cause. This is wrong.

  #### How HP Fixes It (The Witness)
  HP says: To test if $A$ is a cause, we are allowed to construct a **witness**.
  1.  Hold $B$ fixed at $0$ (Even though $B$ actually was $1$).
  2.  This is the "Contingency." We are asking: "In a world where the Deployment Bot was disabled, does the Health Check matter?"
  3.  Now test $A$: If $A=0$, $D=0$. If $A=1$, $D=1$.
  4.  Dependence is restored.
  5.  **Verdict:** $A$ is the Actual Cause. $B$ is not (because there is no witness where $B$ matters without $A$).
  6.  **Why this works for RCA:** It isolates the *active* path. It allows you to mentally disable the backup system to prove the primary failure was critical.

  #### How Woodward Handles It (The Path)
  Woodward doesn't rely on "witnesses" that violate actual values as aggressively. He focuses on **active causal paths**.
  1.  There is a path $A \to D$. There is a path $B \to D$.
  2.  An intervention on $A$ changes $D$ *along the active path*.
  3.  The path from $B$ is **inactive** (preempted). The mechanism linking $B$ to $D$ requires the Pod to be alive. Since $A$ killed it, the $B \to D$ mechanism is broken.
  4.  **Verdict:** $A$ is a cause because there is an invariant relationship between $A$ and $D$ that holds under intervention. $B$ is not a cause because the relationship $B \to D$ is not invariant (it depends on $A$ not happening first).
  5.  **Why this works for Design:** It tells you about the *structure*. It says "The B dependency is fragile; it relies on A not firing."

  ### 4. The "Cause Doing" Difference

  Here is the deepest philosophical distinction, translated to engineering:

  **Woodward: Cause as a "Handle" (Manipulation)**
  For Woodward, $X$ is a cause of $Y$ if $X$ is a **handle** you can grab to change $Y$.
  *   **Implication:** If you can't intervene on it, it's not a cause.
  *   **Infra Example:** "CPU Temperature" correlates with "Throttling". But you can't set Temperature directly; you set Fan Speed or Clock Rate. For Woodward, Temperature isn't the *cause* in the manipulationist sense; Fan Speed is.
  *   **RCA Utility:** Low. You can't "intervene" on the past. You can't go back and set `Primary=1`.

  **Halpern-Pearl: Cause as a "Difference Maker" (Explanation)**
  For HP, $X$ is a cause of $Y$ if $X$ is part of the **minimal set of facts** that explains why $Y$ happened *in this specific context*.
  *   **Implication:** It allows "non-manipulatable" causes (like "The rain caused the grass to be wet").
  *   **Infra Example:** "The race condition caused the deadlock." You can't "intervene" on the race condition easily, but HP validates it as the *actual cause* of *this* crash because if you remove the race condition (in the model), the crash disappears.
  *   **RCA Utility:** High. It is built exactly for "Why did this specific state lead to this specific error?"

  ### 5. Summary: When to Use Which Mental Model

  | Feature | Halpern-Pearl (HP) | Woodward (Interventionist) |
  | :--- | :--- | :--- |
  | **Primary Question** | "Who is to blame for *this* outage?" | "Which levers control this system?" |
  | **Causation Type** | **Token** (Specific event $x$ caused $y$) | **Type** (Variable $X$ causes $Y$) |
  | **"Holding Fixed"** | Can fix variables to **counterfactual values** (Witness) to block backup paths. | Must fix variables to **structural parents**; respects natural flow unless intervened. |
  | **Preemption** | Solves it by artificially disabling the backup (the witness). | Solves it by identifying the *active* vs. *inactive* mechanism. |
  | **Best For** | **Post-Mortems.** Determining root cause among redundant failures. | **System Design.** Understanding dependencies and side effects. |
  | **Weakness** | Computationally expensive (finding the witness is hard). Can feel "magical." | Doesn't handle specific token incidents well (too general). |

  ### The Concrete Takeaway for Your RCAs

  When you are writing up an incident report:

  1.  **Use Woodward for the "Contributing Factors" section.**
      *   "High latency in Service A causes Timeouts in Service B."
      *   This is a general relationship. It holds true regardless of the specific incident. It tells the team where to add circuit breakers.

  2.  **Use Halpern-Pearl for the "Root Cause" section.**
      *   "The specific config flag `retry_max=0` was the cause."
      *   Why? Because in *this* incident, even though we had retries (backup), the config disabled them.
      *   HP logic: "If we hold the Network Partition fixed (it happened), but we change `retry_max` to 3 (the witness), does the Outage disappear? Yes. Therefore, the config is the Actual Cause."
      *   This prevents you from blaming the Network Partition (which is always possible) when the *lack of retry logic* was the actual difference-maker.

  **The "Bug" in your intuition:**
  You thought they were identical because for *simple* chains ($A \to B \to C$), they agree completely. They only diverge when the system has **redundancy** (overdetermination) or **conditional logic** (preemption).
  *   **Woodward** asks: "Is the pipe connected?"
  *   **Halpern-Pearl** asks: "Did water flow through *this* pipe to fill *this* bucket, even if there was another pipe that *could* have done it?"

  For RCA, you always want Halpern-Pearl. For Architecture, you want Woodward.
