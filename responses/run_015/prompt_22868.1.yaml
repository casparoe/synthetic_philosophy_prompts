          *   What is the cause? B being slow? Or C failing?
      *   *Even Better (Classic Preemption):* Two deploy hooks. Hook A runs, deletes a file. Hook B runs, tries to delete the same file. File is gone. Hook A caused the deletion. Hook B did nothing (file already gone).
      *   *Best for Infra:* **The Retry Storm / Circuit Breaker.**
          *   Request comes in.
          *   Path 1 (Primary DB): Fails.
          *   Path 2 (Cache): Should serve.
          *   But Cache was already stale/empty.
          *   Result: 500 Error.
