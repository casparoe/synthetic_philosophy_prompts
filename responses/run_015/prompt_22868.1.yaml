          *   *Definition:* $X=x$ is a cause of $Y=y$ if there exists a witness (a setting of other variables) such that if we change $X$, $Y$ changes, *and* this holds under specific contingencies.
          *   *Key Mechanism:* "Contingencies" or "Witnesses." It allows holding *endogenous* variables fixed at specific values that might not be their actual values to test the dependency.
          *   *Focus:* Actual causation (token causation). "Did *this* specific failure cause *this* specific outage?"
          *   *Handling Preemption:* Uses the "witness" to turn off the backup path artificially to see if the primary path mattered.

      *   **Woodward (Interventionist):**
          *   *Core:* Invariance under intervention.
          *   *Definition:* $X$ causes $Y$ if there is a possible intervention on $X$ that changes $Y$, while holding other *causal parents* fixed (not necessarily all variables).
          *   *Key Mechanism:* "Intervention" ($do(X)$). It's about modular changes.
          *   *Focus:* Type causation / General explanatory relationships. "Does this service dependency generally cause latency?"
