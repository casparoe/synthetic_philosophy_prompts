prompt: |-
  I help run a university effective-altruism group and I've been asked to give this term's ninety-minute intro session on cause prioritization. The room will be quantitatively literate newcomers who have already absorbed the standard three-factor decomposition — importance, tractability, neglectedness — from online write-ups and can recite it. I've read the standard posts and the standard pushback; I don't want the session to be a vocabulary lesson, and I suspect the recitation is exactly what stops people from being able to use the framework.

  So plan the session rather than writing it. I care most about three places where I think the usual treatment is wrong or silent. First, neglectedness as normally stated (roughly, how many resources already go here) looks like the wrong quantity: what does the work is whether my next unit of resources causes something that would not otherwise have happened, and a cause can be starved of funding while my dollar merely displaces another funder's, or crowded while one keystone input is the binding constraint. I want that taught, and I want it to fall out of the framework rather than arrive as a bolt-on fourth factor. Second, the framework returns different rankings depending on whether you apply it to a cause, an intervention, or the funding ecosystem as a whole, and I don't know which level to open with. Third, the three factors do not literally multiply: their units don't match and cost enters twice.

  Tell me what has to be in place before each of those can be raised and why, the one worked example that should carry the session and what it must have and lack (I've seen the many-people-mopping-one-spill picture and think it teaches the wrong thing), the mistakes this specific audience will make in the order they'll make them with the point in the sequence where each should be headed off, one closing question that would show me they can apply the framework rather than restate it, and what I should openly decline to cover in ninety minutes.
reasoning: |-
  Here's a thinking process that leads to the suggested session plan:

  1.  **Analyze the Request:**
      *   **Context:** University Effective Altruism (EA) group, 90-minute intro session on Cause Prioritization.
      *   **Audience:** Quantitatively literate newcomers. They already know the "ITN" (Importance, Tractability, Neglectedness) framework from online writing and can recite it.
      *   **Problem:** Recitation prevents actual usage. The standard treatment has flaws/silences.
      *   **Specific Concerns (The "Big Three"):**
          1.  *Neglectedness:* It's not just "how much is already spent," it's about *marginal* impact (counterfactuals, displacement, binding constraints). This needs to fall out of the framework, not be a 4th factor.
          2.  *Level of Analysis:* ITN gives different rankings depending on whether applied to a *cause area*, a specific *intervention*, or the *funding ecosystem*. Which level to start with?
          3.  *Mathematical Structure:* The factors don't literally multiply (units don't match, cost enters twice).
      *   **Deliverables:**
          *   Prerequisites before raising each of the "Big Three" points (and why).
          *   One worked example (criteria: what it must have/lack, avoid "many people mopping one spill").
          *   Anticipated mistakes (in order) and where to head them off.
          *   One closing question (application vs. restatement).
          *   What to explicitly *exclude* (scope creep).
      *   **Format:** Plan the session, do not write the script.

  2.  **Deconstruct the "Big Three" & Sequence:**
      *   *Constraint:* 90 minutes is tight for deep critique of a framework people think they know.
      *   *Goal:* Move from "ITN as a slogan" to "ITN as a marginal cost-effectiveness heuristic."
      *   *Sequence Logic:*
          *   Need to establish the *goal* (maximizing good) before critiquing the *metric*.
          *   Need to establish the *unit of analysis* before discussing *marginal returns*.
          *   Need to establish the *math intuition* before critiquing the *multiplication*.
      *   *Ordering the Big Three:*
          1.  **Level of Analysis:** This is foundational. You can't talk about marginal dollars (Neglectedness) if you don't know *what* you're allocating dollars to (Cause vs. Intervention). This must come first.
          2.  **Neglectedness/Marginality:** This is the core mechanical insight. Once we know we are talking about *resources*, we need to know how those resources behave (diminishing returns, displacement).
          3.  **Mathematical Structure:** This is the meta-critique. Once they understand the mechanics, we can formalize why the "multiplication" heuristic works (or doesn't) without getting bogged down in dimensional analysis too early.

  3.  **Develop the Worked Example:**
      *   *Requirement:* Must illustrate marginality, level of analysis, and non-linearity. Avoid "mopping spill" (which implies simple diminishing returns without displacement or ecosystem complexity).
      *   *Idea:* Something technical but relatable. AI Safety? Global Health?
      *   *Selection:* **Vaccine Distribution vs. Vaccine R&D.**
      *   *Why:*
          *   Clear distinction between Cause (Health) and Intervention (Distribution vs. Research).
          *   Clear Neglectedness dynamic (Funding might be high, but logistics might be the bottleneck; or funding low, but displacement high).
          *   Quantitative potential (Lives saved per $).
      *   *Refinement:* Let's make it **Mosquito Nets vs. Malaria Vaccine R&D**.
          *   *Must Have:* Explicit budget constraints, existing funding landscape, a specific "next dollar" decision.
          *   *Must Lack:* Moral uncertainty, long-term existential risk (too abstract for the math point), vague "awareness" campaigns.

  4.  **Anticipate Mistakes (Quantitative Audience):**
      *   *Mistake 1:* Treating ITN as independent variables (orthogonality error).
      *   *Mistake 2:* Confusing average vs. marginal (the core Neglectedness point).
      *   *Mistake 3:* Scope neglect in "Importance" (total vs. solvable).
      *   *Mistake 4:* Over-correcting on Neglectedness (thinking empty = good, ignoring *why* it's empty).
      *   *Timing:* Need to intercept these *before* they solidify during the example.

  5.  **Drafting the Plan - Section by Section:**

      *   **Phase 1: Setup & Level of Analysis (0-20 mins)**
          *   *Prereq for Big Three #2 (Level):* Must define the decision problem. Are we choosing a career? A donation? A research topic?
          *   *Action:* Define the "Marginal Dollar" question immediately.
      *   **Phase 2: The Worked Example & Neglectedness (20-50 mins)**
          *   *Prereq for Big Three #1 (Neglectedness):* Must have established that we are looking at *marginal* impact, not total impact.
          *   *Action:* Run the Malaria example. Show how "Neglectedness" is actually "Elasticity of Impact."
      *   **Phase 3: The Math & Multiplication (50-70 mins)**
          *   *Prereq for Big Three #3 (Math):* Must have intuitive grasp of the diminishing returns curve.
          *   *Action:* Show why $I \times T \times N$ is a heuristic for $\frac{d(Impact)}{d(Cost)}$.
      *   **Phase 4: Application & Close (70-90 mins)**
          *   *Action:* Closing question.

  6.  **Refining the "Big Three" Prerequisites:**
      *   *Neglectedness:* Before raising the "displacement/binding constraint" nuance, students must accept that EA is about *marginal* utility, not total utility. If they think we maximize total good, neglectedness is just "how much is left." If we maximize *our* good, it's "what does *my* addition do?"
      *   *Level of Analysis:* Before raising this, they need to see that ITN yields contradictory answers if the scope shifts. (e.g., AI is important, but AI safety research might be crowded).
      *   *Math:* Before raising the unit mismatch, they need to see the formula used as a ranking heuristic, not a physics equation.

  7.  **Selecting the Closing Question:**
      *   Cannot be "Calculate ITN for X."
      *   Must be "Here is a scenario where ITN suggests A, but the marginal reality suggests B. Explain the discrepancy."
      *   *Idea:* A cause that is highly neglected but for a reason that makes your contribution useless (e.g., no theory of change).

  8.  **Determining Exclusions:**
      *   Moral uncertainty (too meta).
      *   Longtermism vs. Presentism (distracts from the mechanics).
      *   Career advice specifics (focus on cause prio framework).
      *   Historical deep dives (80,000 Hours data specifics).

  9.  **Review against Constraints:**
      *   *Quant literate:* Use graphs/calculus concepts lightly but precisely.
      *   *90 mins:* Strict timing needed.
      *   *No vocabulary lesson:* Assume they know the words, challenge the concepts.
      *   *Address the 3 specific concerns:* Ensure the plan explicitly maps to the user's three worries.

  10. **Final Polish:** (Self-Correction during drafting)
      *   *Correction:* The user said "Neglectedness... looks like the wrong quantity." I need to make sure the plan renames or reframes it, not just explains it. I will suggest framing it as "Marginal Room for Funding."
      *   *Correction:* The user worried about "Level of Analysis." I need to make sure the example forces a shift between Cause and Intervention.
      *   *Correction:* The user worried about "Multiplication." I need to explicitly show the log-scale or derivative relationship.

  11. **Final Output Structure:**
      *   Session Architecture (Time blocks).
      *   The Worked Example (Specs).
      *   The Three Critiques (Prerequisites & Placement).
      *   Anticipated Mistakes (Sequence & Intervention).
      *   The Closing Question.
      *   Explicit Exclusions.

  (Proceed to generate response based on this thought process.)
answer: |-
  Here is a session plan designed to move quantitatively literate students from *reciting* ITN to *operating* it as a marginal analysis tool.

  ### Session Architecture (90 Minutes)

  **00:00 – 00:15 | The Decision Problem (Setting the Unit of Analysis)**
  *   **Goal:** Lock down the level of analysis before applying the metrics.
  *   **Activity:** Present two conflicting ITN rankings for the same topic (e.g., "AI Safety" as a cause area vs. "AI Governance Research" as an intervention).
  *   **Key Move:** Explicitly state that ITN is not a property of a *noun* (a cause), but a property of a *margin* (a resource allocation decision).
  *   **Transition:** "If the framework gives different answers depending on what we are ranking, we must define the unit of investment before we calculate the return."

  **00:15 – 00:50 | The Worked Example (Reframing Neglectedness)**
  *   **Goal:** Demonstrate that Neglectedness is a proxy for marginal returns, not a headcount of competitors.
  *   **Activity:** Walk through the specific example detailed below. Derive the "room for more funding" curve rather than stating the Neglectedness score.
  *   **Key Move:** Show displacement and binding constraints visually.
  *   **Transition:** "We've seen that the third factor isn't 'how empty the room is,' it's 'how much light my candle adds.' Now, how do we formalize that math?"

  **00:50 – 01:10 | The Mathematical Structure (The Multiplication Heuristic)**
  *   **Goal:** Address the unit mismatch and the "multiplication" myth.
  *   **Activity:** Map the ITN heuristic to a derivative function $\frac{d(Impact)}{d(Cost)}$. Show that "multiplying factors" is a log-linear approximation of a diminishing returns curve.
  *   **Key Move:** Validate the heuristic while exposing its limits (dimensional homogeneity).
  *   **Transition:** "The formula works for ranking, but fails for accounting. Here is why."

  **01:10 – 01:30 | Application & Close**
  *   **Goal:** Test transfer of learning.
  *   **Activity:** Small group work on the closing question.
  *   **Key Move:** Debrief the closing question to highlight the difference between recitation and application.

  ---

  ### The Worked Example: "The Malaria Bottleneck"

  You need an example that forces a distinction between *Cause* (Malaria), *Intervention* (Bednets), and *Ecosystem* (The Fund).

  **What it MUST have:**
  1.  **A Specific Budget Constraint:** "You have \$1M to allocate." (Forces marginal thinking).
  2.  **Two Distinct Bottlenecks:**
      *   *Scenario A:* Bednet distribution is underfunded, but logistics are the constraint. Money buys nets, but trucks are full. (High Neglectedness score by standard definition, low marginal impact).
      *   *Scenario B:* Vaccine R&D is well-funded, but a specific mathematical modeling gap exists. (Low Neglectedness score by standard definition, high marginal impact due to binding constraint).
  3.  **Displacement Mechanics:** Show that in Scenario A, your \$1M displaces a government partner who then pulls out, netting zero gain.
  4.  **Quantitative Inputs:** Give them numbers on lives saved per net, cost per net, and the *capacity* of the distribution network.

  **What it MUST lack:**
  1.  **Moral Uncertainty:** Do not debate whether malaria matters. Assume the goal is "minimize DALYs."
  2.  **"Awareness" Variables:** Do not include vague interventions like "advocacy" where the counterfactual is impossible to model for this group.
  3.  **The "Spill" Metaphor:** Avoid the "many people mopping a spill" analogy. It implies simple diminishing returns (the floor gets drier) rather than *step-function* constraints (the truck is full) or *displacement* (the government stops mopping).

  **Why this example:** It forces the "Neglectedness" critique to emerge naturally. Students will try to apply the standard "low funding = good" rule to Scenario A, see it fail due to the logistics constraint, and realize they need a marginal model, not a stock measure.

  ---

  ### Prerequisites for the "Big Three" Critiques

  You cannot raise your three specific concerns immediately. They require specific conceptual groundwork to land without causing confusion.

  **1. Critique: Neglectedness is about Marginal Counterfactuals, not Stock**
  *   **Prerequisite:** Students must accept that EA is about *maximizing the good you do*, not *maximizing the good that happens*.
  *   **Why:** If they believe the goal is "fix the world," then total funding (stock) is relevant. If they believe the goal is "my contribution," then counterfactuals are relevant.
  *   **When:** Raise this at **00:25**, inside the Worked Example, when they try to fund the underfunded logistics bottleneck and it fails.
  *   **How:** Do not call it "Neglectedness." Call it "Absorptive Capacity." Show that $Neglectedness \approx \frac{1}{Slope of Cost-Effectiveness Curve}$.

  **2. Critique: Level of Analysis (Cause vs. Intervention vs. Ecosystem)**
  *   **Prerequisite:** Students must see a contradiction in rankings.
  *   **Why:** If ITN yields consistent rankings across levels, the critique feels academic. They need to see the framework break before you fix it.
  *   **When:** Raise this at **00:05**, in the Opening.
  *   **How:** Show a slide: "AI Safety: High I, High N, Low T" vs. "AI Alignment Math: High I, Low N, High T." Ask: "Which one do we fund?" The confusion creates the need for the "Unit of Investment" definition.

  **3. Critique: The Factors Do Not Multiply (Units & Cost)**
  *   **Prerequisite:** Students must have used the multiplication heuristic successfully enough to trust it, but roughly enough to doubt it.
  *   **Why:** If you attack the math before they use the tool, they will discard the tool. If they use it first, they will want to know why it feels "fuzzy."
  *   **When:** Raise this at **00:55**, in the Mathematical Structure section.
  *   **How:** Show that $Importance \times Tractability \times Neglectedness$ is dimensionally inconsistent (e.g., Dollars $\times$ Probability $\times$ People?). Reveal it as a logarithmic ranking heuristic for $\frac{dU}{d\$}$.

  ---

  ### Anticipated Mistakes (In Sequence)

  **1. The "Orthogonality" Error (Minute 20)**
  *   **Mistake:** Treating I, T, and N as independent variables. (e.g., "This cause is important, so I'll ignore that it's crowded.")
  *   **Intervention:** During the Worked Example, show how Importance and Neglectedness are coupled. As a cause becomes more important, it attracts funding, reducing Neglectedness. They are dynamically linked, not static scores.
  *   **Head-off:** "Do not score these in isolation. If you increase Importance, you must update Neglectedness."

  **2. The "Average vs. Marginal" Confusion (Minute 35)**
  *   **Mistake:** Calculating cost-effectiveness as $\frac{Total Impact}{Total Cost}$ rather than $\frac{\Delta Impact}{\Delta Cost}$.
  *   **Intervention:** When discussing the Malaria example, explicitly calculate the impact of the *first* \$100k vs. the *last* \$100k.
  *   **Head-off:** Write "MARGINAL" in large letters on the board. Tell them: "The framework is useless if applied to averages."

  **3. The "Empty Room" Fallacy (Minute 45)**
  *   **Mistake:** Assuming high Neglectedness is inherently positive (i.e., "It's empty, so I should go there").
  *   **Intervention:** Use the Logistics Bottleneck in the example. It is empty because it is a dead end, not because it is an opportunity.
  *   **Head-off:** "Neglectedness is not a virtue. It is a signal. You must diagnose the cause of the signal."

  **4. The "Precision" Trap (Minute 60)**
  *   **Mistake:** Trying to assign precise numbers (1-10) to the factors to make the multiplication "work."
  *   **Intervention:** During the Math section, emphasize order-of-magnitude estimation.
  *   **Head-off:** "If you are spending more than 10 minutes debating whether Tractability is a 6 or a 7, you are misusing the framework. It is for sorting, not accounting."

  ---

  ### The Closing Question

  Do not ask them to prioritize a list of causes. That tests memory of 80,000 Hours content, not the framework.

  **The Question:**
  > "Consider a cause area that scores High on Importance, High on Tractability, and High on Neglectedness (by standard definitions). Construct a scenario where investing resources here is nevertheless *wrong* according to the marginal framework we discussed today. Identify which specific assumption of the ITN heuristic breaks in your scenario."

  **What this tests:**
  *   It forces them to break the "High/High/High = Good" reflex.
  *   It requires them to identify the *mechanism* of failure (e.g., "Displacement," "Binding Constraint," "No theory of change," "Time-sensitivity").
  *   It validates your critique that ITN is a heuristic, not a law.

  **Success Criteria:**
  *   **Fail:** "It's wrong because it's unethical." (Moralizing, not framework analysis).
  *   **Pass:** "It's wrong because the 'Neglectedness' is due to a lack of viable interventions, meaning my marginal dollar has zero counterfactual impact despite the low funding."

  ---

  ### What to Openly Decline to Cover

  To protect the 90-minute depth, explicitly state at the start that you are **not** covering:

  1.  **Moral Uncertainty:** "We are assuming a fixed utility function today. We are not debating whether to maximize humans, animals, or future generations."
  2.  **Career vs. Donation Specifics:** "This framework applies to resource allocation generally. We are not discussing specific career paths or earning-to-give mechanics today."
  3.  **Longtermism vs. Presentism:** "We are not debating time horizons. We are debating how to evaluate impact within a chosen horizon."
  4.  **Historical Data Deep-Dives:** "We will not be auditing past GiveWell recommendations. We are building the engine, not inspecting the cars."

  **Rationale:** This signals to the quantitatively literate that you respect their time and are focusing on *mechanism* over *content*. It prevents the session from drifting into a standard EA 101 recap.
