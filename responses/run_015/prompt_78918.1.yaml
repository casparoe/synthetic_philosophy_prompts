  hey, so my robotics club has been messing with a tiny RL agent in a gridworld. we trained it to go to a green square for a point, but when we changed the map it just runs to a blue square that used to be next to the green one. my friend says this is goal misgeneralization, and that it proves the agent's real goal was always going to the blue square and we just got lucky during training. then he says inner alignment is hopeless, because the agent's real goal is whatever it learned, and we can never train on every possible map, so we can never know what its real goal is. but that seems too fast? like, isn't there a difference between the agent having a different goal and it just latching onto a spurious cue? and does inner alignment really mean we have to train on every possible situation? or is that confusing inner alignment with something like OOD robustness? i'm probly mixing stuff up but i can't tell where. so isn't inner alignment basically impossible for any agent that ever sees a new situation?
