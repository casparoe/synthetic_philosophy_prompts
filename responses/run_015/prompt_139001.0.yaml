answer: |-
  **Brainstorming & Positioning**

  *   **Option 1: Material Majority (The 51% Rule).** Return the stored planks (Object B). Keep the display canoe.
      *   *Verdict:* Reject. Arbitrary threshold. Fails the "vest" test (100% new thread). Ignores the Nation's ontology. Turns repatriation into a return of debris.
  *   **Option 2: Continuous Care (The Nation's View).** Return the display canoe (Object A). Reclassify planks as archival.
      *   *Verdict:* Accept. Aligns with functional identity. Respects claimant sovereignty over cultural definitions. Consistent with living heritage.
  *   **Option 3: Dual Identity.** Return both.
      *   *Verdict:* Reject. Logistically complex. Dilutes the spiritual return of the "living" canoe.
  *   **Landing:** Option 2. Identity follows function and care, not just atoms. This resolves the Ship of Theseus paradox by prioritizing *intentional continuity* over *material persistence*.

  ***

  **MEMORANDUM**

  **TO:** Collections & Repatriation Committee
  **FROM:** [Your Name], Collections & Repatriation Committee
  **RE:** Identity Determination for Repatriation Claim #1901-C (Cedar Canoe)
  **DATE:** October 26, 2023

  **Recommendation:** Transfer the displayed hull (1974 conservation) to the Nation by March 31; reclassify the stored original planks as archival associates rather than accessioned objects.

  **Reasoning and Identity Test**
  The committee's impasse stems from conflicting theories of identity: material composition versus functional continuity. The Registrar's concern relies on a materialist view (an object is its atoms). The Nation's claim relies on a functionalist view (an object is its history of use and care). In repatriation contexts, where the goal is restoring cultural relationships, the claimant's ontological framework must carry decisive weight provided it is internally coherent. The "Ship of Theseus" paradox is not a barrier here; it is a description of living objects.

  To resolve future ambiguities, I propose we adopt the **Continuity of Care and Form Test** for the policy manual:

  *An object retains its identity if its form and function are maintained through intentional care, regardless of material replacement. Material components constitute the object only insofar as they bear the primary cultural significance (e.g., beads vs. thread).*

  **Application to Queued Cases**
  1.  **The Canoe:** The displayed hull maintains the form and function of a canoe through continuous care. It is the accessioned object. The stored planks are historic material but no longer constitute "the canoe." They should be deaccessioned as objects and recorded as archival material associated with the canoe's history.
  2.  **The Totem Pole:** Despite the 1985 replacement of the lower section, the pole has maintained continuous display and care. It remains one object. The removed sections should be treated as archival associates, similar to the canoe planks.
  3.  **The Beaded Vest:** The beads carry the cultural significance; the thread is structural medium. Restringing on new thread maintains form and function. The vest remains one object. The old thread is discardable or archival, not a separate entity.

  **The Strongest Counter-Argument**
  The Registrar's position is not merely bureaucratic; it rests on a duty to historical truth. If we designate the 1974 hull as the 1901 canoe, we are technically misdescribing the material reality presented to the public and the receiving Nation. There is a risk that decoupling identity from material fabric creates a slippery slope where the historical specificity of the "original" is erased, potentially obscuring the extent of colonial intervention or conservation history. If we say the 1974 wood is the 1901 object, we risk losing the ability to speak accurately about the physical history of colonization and preservation embedded in the timber itself.

  **Resolution**
  While the material history is vital, it is secondary to the cultural life of the object in repatriation. We preserve the "truth" of the material by keeping the planks in our archives with rigorous documentation, ensuring the conservation history is not lost, even if the spiritual identity travels with the hull.

  **Proposed Label Copy (for the Nation's use or our archive)**
  "This canoe remains one through continuous care; while much of the wood is from 1974, its spirit and form have been unbroken since 1901."
