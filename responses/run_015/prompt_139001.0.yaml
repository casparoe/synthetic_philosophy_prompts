      *   *Option 2: Functional/Continuity View (Nation's view).* Identity = continuous history of use/care. Return the display canoe (Object A). Keep/store planks as archival material.
          *   *Pros:* Aligns with claimant's ontology, fulfills repatriation purpose (returning a living object), acknowledges conservation as care.
          *   *Cons:* Challenges traditional museum inventory logic (what about the cabin? the totem?), requires policy shift.
      *   *Option 3: Hybrid/Dual Identity.* Both are "the canoe" in different senses. Return both?
