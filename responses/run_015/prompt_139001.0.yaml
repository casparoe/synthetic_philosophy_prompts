      *   *My Landing:* Option 2 (Functional/Continuity). In repatriation contexts, the claimant's ontology regarding the object's identity should carry significant weight, especially when it aligns with a coherent metaphysical view (continuity of form/function vs. mere matter). The "Ship of Theseus" paradox isn't a bug; it's a feature of living objects. The 51% rule is arbitrary and fails the vest test (100% new thread, 100% old beads).
