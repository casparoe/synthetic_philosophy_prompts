      *   Label copy? Yes.

  8.  **Final Polish:** Check tone. Ensure it sounds like someone who knows metaphysics but works in a museum. (e.g., using "identity conditions" but practically).

  *(Self-Correction during drafting)*: Make sure I explicitly mention the timeframe in the recommendation. Make sure the test is copy-pasteable for the manual. Ensure the counter-argument doesn't get dismissed too easily.

  *(Word Count Check)*: If I get too verbose on the metaphysics, I'll lose space for the applications. Keep the philosophy tight. Focus on "functional continuity."

  *(Final check on the "Cabin" issue)*: The prompt mentions the registrar *bringing up* the cabin as a worry ("half our inventory wobbles — we own a relocated 1840s cabin..."), but the instruction says "apply it to our three queued cases... the canoe..., the totem pole, and a beaded vest." I will address the cabin only implicitly via the robustness of the test, but focus the application on the three requested items.

