  5.  **Refining the Counter-Argument:**
      *   Must be strong. The Registrar isn't just being bureaucratic; she's protecting the integrity of the historical record. If we say the 1974 wood is the 1901 canoe, are we lying?
      *   Rebuttal: In repatriation, "truth" includes cultural truth, not just material provenance.

  6.  **Drafting - Section by Section:**
