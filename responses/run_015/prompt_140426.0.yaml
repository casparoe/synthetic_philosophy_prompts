answer: |-
  # The Conceptual Space Procedure

  You are not looking for "good ideas." You are looking for "valid coordinates" in the theme's design space. Your job is to filter out points that are either identical to where you've already stood (Samey) or outside the map entirely (Lost). The following procedure replaces "vibes" with "topology."

  ### 1. Extracting the Knobs
  Do not list features. Features are static; knobs are adjustable. To find them, you must find the axes of tension.
  *   **The Anti-Game:** Ask the team, "What is the exact opposite of this sheet?" If the sheet is "Fast-paced," the opposite is "Deliberate." The knob is **Pace**. If the sheet is "Infinite," the opposite is "Finite." The knob is **Duration**.
  *   **The Broken Version:** Ask, "How do we break this in 10 seconds?" If the answer is "Stack all the tiles in one corner," the knob is **Tile Distribution**.
  *   **Finding the Unnamed Knob:** Look for the argument. If two designers disagree on how a mechanic works, there is a hidden structural knob between them. Name the tension (e.g., "Risk vs. Reward") and treat it as a dial.

  ### 2. Sorting Depth (The 5-Minute Ripple Test)
  You need to know which knobs are cheap to turn and which ones break the machine.
  *   **Surface:** Change it, nothing else breaks. (e.g., Art style, SFX).
  *   **Structural:** Change it, rules need tweaking to compensate. (e.g., Grid size, Move limit).
  *   **Frame:** Change it, the game's identity collapses. (e.g., Turn-based vs. Real-time, Win vs. No-Win).
  *   **The Test:** Take the knob. Turn it to the extreme. Ask: "What *must* I change next to keep this playable?"
      *   *Answer: "Nothing."* → **Surface**.
      *   *Answer: "I need to rebalance the economy."* → **Structural**.
      *   *Answer: "It's not that game anymore."* → **Frame**.
      *   *Confusion:* If you can't decide, it's a **Structural** knob masquerading as Frame. Treat it as Structural to be safe.

  ### 3. Searching the Space
  Don't wait for inspiration. Apply these operators to the knobs you found.
  *   **Extreme:** Push one knob to 0 or Infinity. *Use for:* Stress-testing the core loop. *Produces:* Minimalist or Chaos variants.
  *   **Cluster:** Move a coupled cluster (e.g., Speed + Spawn Rate) together. *Use for:* Creating coherent new "modes." *Produces:* Hard/Easy modes that feel distinct.
  *   **Deletion:** Remove a knob entirely. *Use for:* Finding the essential core. *Produces:* "Zen" or "Arcade" variants.
  *   **Borrow:** Import a knob from an adjacent genre (e.g., Roguelike progression into a Puzzle). *Use for:* Hybridization. *Produces:* High-risk novelty.

  ### 4. Judging the Variation
  For a 9-person studio, time is your scarcest resource. A prototype that drifts scope is more expensive than a prototype that is boring.
  *   **Failure Mode A: Samey-but-New.** A knob moved, but the experience is identical. (e.g., Changing grid color). *Cost:* Opportunity cost. *Verdict:* Tolerable if you need a safe ship, but reject for a "new" slot.
  *   **Failure Mode B: Lost-the-Thread.** The variation quietly became a different game. (e.g., A puzzle becoming a simulator). *Cost:* Wasted month-long prototype + marketing confusion. *Verdict:* **Fatal.**
  *   **The Tests:**
      1.  **The Box Test (Detects Lost-the-Thread):** Hide the art. Read the rules. Is it still the same genre? If No → Reject.
      2.  **The Tuesday Test (Detects Samey):** Would a player notice this difference on a Tuesday morning commute? If No → Reject (unless safety is the goal).

  ### 5. Escalation
  The procedure handles design validity. It does not handle business risk or studio identity.
  *   **Procedure Says No:** If it fails the Box or Tuesday test. Do not escalate. Kill it.
  *   **Procedure Says Yes:** If it passes tests but feels "wrong" for the brand, or "too risky" for the budget.
  *   **Who Decides:** You (CD) run the filter. The Studio Head decides the **Values**. If a concept is structurally sound but violates the studio's risk profile or brand promise, the Head decides.

  ---

  # Case Applications

  ### 1. "Noughts" (Match-3, No Loss)
  *   **Knobs Moved:** **Win Condition** (Frame). Deleted "Loss."
  *   **Procedure Analysis:**
      *   *Ripple Test:* Removing loss removes pressure. Without pressure, resource management (the core of Match-3) ceases to function. The "Game" becomes a "Toy."
      *   *Box Test:* Hide the art. Is it a Match-3 game? No, it's an idle fidget spinner.
      *   *Verdict:* **Reject.**
      *   *Reasoning:* This is **Lost-the-Thread**. It fails the Frame integrity check. Match-3 requires the threat of failure to give value to moves.
      *   *Judgment Call:* **False.** The procedure is definitive here.
      *   *Note:* This is the answer you might not want. The team loves it (morale), but the procedure identifies it as a genre shift that invalidates the prototype goal.

  ### 2. "Folio" (Tile-Slide, New Art/Grid)
  *   **Knobs Moved:** **Art Style** (Surface), **Grid Topology** (Structural).
  *   **Procedure Analysis:**
      *   *Ripple Test:* Changing grid size forces rule tweaks (Structural). Changing art does not (Surface).
      *   *Tuesday Test:* Will a player notice? Yes, the levels feel different due to topology.
      *   *Box Test:* Is it still the same game? Yes.
      *   *Verdict:* **Greenlight.**
      *   *Reasoning:* It passes validity. It is a safe structural iteration.
      *   *Judgment Call:* **True.** The procedure says "Yes," but your gut says "Weakest sheet." The procedure cannot measure "boring." It only measures "valid." You must override this with creative intuition if "safe" is not the goal this quarter.

  ### 3. "Errand" (Word Puzzle + Roguelike)
  *   **Knobs Moved:** **Progression System** (Frame/Structural boundary), **Permadeath** (Structural).
  *   **Procedure Analysis:**
      *   *Ripple Test:* Adding permadeath to a daily puzzle changes the player's relationship with every move. It drags the "Daily" knob into "Campaign."
      *   *Box Test:* Is it a Word Puzzle? Or a Deck Builder using words? Ambiguous.
      *   *Verdict:* **Escalate.**
      *   *Reasoning:* It passes the "Novelty" check but triggers the "Lost-the-Thread" warning flag. It is on the boundary of the Frame.
      *   *Judgment Call:* **True.** This is a values question. Do we want to be the "Daily Puzzle Studio" or the "Word Game Studio"? The Studio Head must decide if the audience trade-off is worth the prototype cost.

  ---

  # Limits & Risks

  1.  **Pre-Naming Shrinkage:** Writing knobs before the jam *will* shrink the space to what you can articulate.
      *   *Mitigation:* The procedure must allow for "Unknown Knobs" discovered during the jam. Do not finalize the knob list until *after* the 2-day generation.
  2.  **The Fun Blind Spot:** This model measures structure, not joy. A game can be structurally novel and utterly unfun.
      *   *Refusal:* The procedure **flatly refuses** to judge "Fun." It only judges "Coherence." You must layer a playtest or intuition check on top of this filter. Do not trust the JSON to tell you if a game is funny.

