  **JOINT DOCUMENT: ON CERTAINTY ADVERSARIAL COLLABORATION**
  **Parties:** [User] & Priya

  **I. AGREED CLAIMS**
  *Note: Claims regarding the ontological status of hinges (belief/knowledge) have been neutralized to functional descriptions to ensure signability.*

  1.  **Distinctive Functional Role:** There exists a distinguishable class of propositions that function differently in inquiry: they are not normally doubted, not normally supported by explicit evidence in context, and doubting them destabilizes the evidential relations of other propositions rather than merely adding a false belief.
  2.  **Practical Regress:** The regress of reasons bottoms out in practice; inquiry cannot proceed without some propositions being held fast.
  3.  **Hinge-Drift:** Propositions migrate in and out of this status over time (e.g., "smoking causes cancer," "the earth is old"). What begins as a contested hypothesis can become an assumption against which awkward data is measured.
  4.  **Theoretical Awkwardness:** This migration is problematic for both sides: it challenges the idea of fixed foundational truths (Priya) and the idea of purely fluid empirical revision ([User]). Neither side can claim this phenomenon without qualification.
  5.  **Moore's Gesture:** Moore's hand-raising is baffling and ineffective as a proof; it exposes a grammatical confusion rather than settling skepticism.

  **II. DISAGREEMENTS TABLE**

  | Point at Issue | Priya's Claim (Entrenched Empirical) | [User]'s Claim (Framework Commitment) | Crux | Concrete Case / Evidence | Predictions (Pre-Registered) |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Nature of the Class** | The class is picked out by *degree* of confirmation (very high probability). | The class is picked out by *role* (scaffolding vs. building). | **Role vs. Kind:** Is the distinction quantitative or categorical? | **The Interview Study:** N=300 asked to justify "I have hands," "Earth pre-existed me," "No one on Mars." Coded for: Evidence cited, Circular presupposition, or "Question makes no sense." | **Priya:** Majority will cite evidence (perception/testimony), however thin.<br>**[User]:** Significant minority will cite presuppositions or reject the question's sense. |
  | **Status of Doubt** | Doubt about a hinge is *implausible* (irrational to believe, but intelligible). | Doubt about a hinge is *unintelligible* (lacks sense within the language game). | **Unintelligible vs. Implausible:** Is the limit logical or practical? | **The Valley Case:** Isolated community; "River runs east" is hinge. Landslide reroutes it. Reports become unintelligible. | **Priya:** Rational belief-revision via overwhelming sensory evidence.<br>**[User]:** Shift in practice/conversion; evidence only counts *after* the framework shifts. |
  | **Logic & Arithmetic** | Logic/arithmetic are distinct (analytic); hinges are empirical (synthetic). | Logic/arithmetic belong to the same phenomenon (rules of representation). | **Scope:** Is this仅限于 empirical claims or constitutive rules generally? | **Calculation Error:** When a sum fails, do we check the math or the world? | **Priya:** We check the math; logic is inviolable, hinges are fallible.<br>**[User]:** We check the math because logic is the hinge; both are exempt from doubt in context. |

  **III. VERBAL DISPUTES & FALSIFICATION CONDITIONS**

  **Verbal Friction:**
  Much of our conflict rests on terminology. **Know:** Priya uses this broadly (justified true belief + high confidence); [User] uses it narrowly (requires possibility of doubt/evidence). **Belief:** Priya sees a continuum; [User] sees a categorical distinction (belief vs. commitment). **Arational:** [User] means "outside the game of giving reasons"; Priya hears "irrational." **Evidence:** Priya sees everything as potential evidence; [User] sees hinges as defining what counts as evidence. We agree to treat these as placeholders for the functional distinctions above.

  **Falsification Conditions:**
  *   **[User] would concede if:** Hinges can be doubted without systemic collapse, or if hidden evidential bases are uncovered for all putative hinges (showing they are just very strong beliefs).
  *   **Priya would concede if:** There is a hard limit where evidence *cannot* be cited even in principle, or if doubt is shown to be logically impossible (grammatically excluded) rather than just probabilistically negligible.
