answer: |-
  **Letter Grade: B+**

  **Marginal-Style Feedback**

  > *"Retributivism is backward-looking: it justifies punishment by reference to past wrongs and proportional desert, not future benefits. Deterrence is forward-looking."*

  **Comment:** Accurate definitions. Good starting distinction. However, keep in mind that some hybrid theories exist; don't treat them as mutually exclusive unless the prompt demands it.

  > *"The innocence objection actually hits retributivism harder than deterrence, because if an innocent person is executed the deterrent effect might still occur—people are frightened regardless—whereas for retributivism you have failed to give anyone what they deserve and instead violated an innocent person's rights."*

  **Comment:** **Philosophical Slip.** This is the riskiest claim in the essay. You are assuming a "naive" deterrence theory (act-utilitarianism) where the *outcome* (fear) justifies the act regardless of the target's guilt. A sophisticated deterrence theorist would argue that executing innocents undermines public trust in the legal system, thereby *reducing* long-term deterrence. You haven't proven it hits retributivism *harder*; you've only shown it violates the *internal logic* of retributivism more obviously. Deterrence might tolerate the error; retributivism cannot conceptually accommodate it. That distinction needs more nuance.

  > *"Some reply that retributivists only need reasonable procedural certainty, not metaphysical certainty about guilt, and since all punishment involves fallibility, capital punishment isnt uniquely problematic unless death is categorically different."*

  **Comment:** **Prompt Engagement.** You are addressing the "fair trial procedures" aspect here. Good. But you haven't yet defined what "giving wrongdoers their due" *is* if it isn't metaphysical guilt. Is "due" a social construct based on verdict, or a moral fact based on action? This is the core distinction the prompt asked for.

  > *"But this ignores the asymmetry of finality: for irreversible sanctions the evidentiary standard should scale with the cost of error, so treating execution like prison misses that you cant correct a mistaken execution."*

  **Comment:** **Strong Point.** This is your strongest argument. The "asymmetry of finality" effectively challenges the "fallibility is everywhere" defense. However, does this address *retributivism* specifically, or just punishment generally? A retributivist might argue that if the *procedure* was just, the "due" was satisfied, even if the outcome was factually wrong (legal guilt vs. moral guilt). You need to tackle whether retributive justice is satisfied by *legal* desert or *moral* desert.

  > *"There's also Kant's point that using people as mere means violates dignity, so executing the innocent uses them as a social tool."*

  **Comment:** **Misattribution Risk.** Kant is typically the *champion* of retributivism (*ius talionis*). While he would agree you cannot use an innocent as a means, invoking Kant here without acknowledging his strong retributive stance creates tension. Are you arguing Kant would reject capital punishment entirely, or just the execution of the *innocent*? Be precise. Using Kant to support the "innocence objection" is valid, but ensure you aren't inadvertently undermining the retributive framework you're analyzing.

  > *"Overall I think retributivism can survive if evidentiary standards are high enough, but the objection is stronger than defenders admit."*

  **Comment:** **Conclusion.** A reasonable conclusion, but it sidesteps the prompt's specific instruction to distinguish "giving due" from "procedure." You conclude that *procedure* (standards) saves the theory, but you don't confirm if that satisfies the definition of "giving due."

  ***

  **TA Evaluation & Justification**

  **Why this is a B+ (and not an A or a B):**
  This is a competent, clear, and philosophically literate answer. It avoids major howlers and demonstrates a good grasp of the consequentialist vs. deontological landscape. However, it falls short of an 'A' because it skirts the deepest philosophical tension in the prompt.

  **1. The "Due" vs. "Procedure" Distinction (The Missing Depth):**
  The prompt explicitly asked to distinguish *what 'giving wrongdoers their due' requires* from *fair trial procedures*.
  *   **What the student did:** They argued that procedural certainty is insufficient because of irreversibility (the asymmetry argument).
  *   **What was missing:** They did not analyze the *ontological status* of "desert." Does a retributivist believe we give a criminal their "due" when a jury *says* they are guilty (legal retributivism), or only when they *are* actually guilty (moral retributivism)?
  *   **Why it matters:** If retributivism is about *moral* desert, no amount of procedure fixes the execution of an innocent (justice is objectively undone). If it is about *legal* desert, the procedure *is* the "due." The student assumes the former but argues via the latter (evidentiary standards). An 'A' answer would explicitly disentangle these two versions of retributivism.

  **2. The Deterrence Comparison (The Conflation):**
  The student claims the innocence objection hits retributivism *harder* than deterrence.
  *   **The Slip:** This relies on a simplified view of deterrence. While it is true that an executed innocent *can* still deter others (fear remains), most modern law-and-economics or rule-utilitarian scholars argue that the *risk* of executing innocents creates a "chilling effect" or loss of legitimacy that harms the deterrent function.
  *   **The Correction:** A more precise claim would be: "The innocence objection is *fatal* to retributivism's internal logic (punishing the innocent is conceptually impossible), whereas for deterrence it is a *cost-benefit* failure (the social cost of error outweighs the deterrent gain)." The student conflated "internal logical failure" with "pragmatic failure."

  **3. Reasoning on Asymmetry:**
  The reasoning on irreversibility holds up well and is not a howler. It is a standard and valid argument in the death penalty literature (e.g., Bedau). However, the student applies it to *evidentiary standards* rather than the *justification of punishment*. To strengthen this, they should have argued that retributivism demands *proportionality*, and if the cost of error is infinite (death), the proportionality of the *process* is broken, not just the outcome.

  **Summary for the Student:**
  "You have a strong grasp of the basic frameworks and the irreversibility argument is well-deployed. To push this to an A, you need to dig deeper into the definition of 'desert.' Is 'giving someone their due' a metaphysical claim about their moral guilt, or a institutional claim about their legal conviction? Your answer assumes the former but proposes a solution based on the latter (higher standards). Clarifying that tension would have tightened your evaluation significantly."
