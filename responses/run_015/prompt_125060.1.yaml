answer: |-
  Here is a diagnosis of your cases, a proposed principle that accommodates your strongest intuitions, and a resolution to the scalar/binary question.

  ### 1. The Diagnosis: Signal vs. Substance
  Your conflict regarding Dev, the Stroke Patient, and the Policy Assistant stems from a single ambiguity: **What counts as acting on the right-making features?**

  *   **The Policy Assistant** acts on a *rule*. The rule coincides with morality, but she is motivated by the rule's existence, not its moral content. If the policy changed to require theft, she would steal. Her connection to the moral truth is accidental.
  *   **Dev** acts on a *testimony*. He trusts his sister, not the moral reason. He explicitly disconnects himself from the moral content ("doesn't see the point"). His connection to the moral truth is mediated by deference, not grasp.
  *   **The Stroke Patient** acts on an *urge*, but she *appropriates* it. By reflecting and endorsing it as "the right way to live," she converts a blind impulse into a committed stance. She may not have derived the urge from reason, but she now holds the urge *for* the reason.

  Your current "Independence Condition" fails because it tests the *strength* of the motive, not its *object*. The Stroke Patient's urge is strong (fails independence), but her endorsement links it to the right value. Dev's deference is stable (passes independence), but it links to a person, not a value.

  ### 2. The Principle: Appropriated Sensitivity
  To capture your verdicts without gerrymandering, I propose a scalar principle based on **non-accidental sensitivity to value**.

  **The Principle of Appropriated Sensitivity:**
  An action has moral worth to the degree that:
  1.  **Sensitivity:** The action is causally responsive to the features that actually make it right; AND
  2.  **Appropriation:** The agent reflectively endorses the motive *as a response to those features*, rather than as a response to a proxy (rule, person, sanction) or a blind impulse.

  **Why this fits your cases:**
  *   **Pharmacist 1 (Fear):** Fails Appropriation. Motive is sanction-avoidance. **Verdict: No Worth.**
  *   **Pharmacist 2 (Care):** Passes Sensitivity (patient harm) and Appropriation (she cares about the harm). **Verdict: Full Worth.**
  *   **Policy Assistant:** Fails Appropriation. She endorses the *policy*, not the moral feature. If the policy diverged from morality, she would follow the policy. **Verdict: No Worth.** (This explains why she is lower than Dev; Dev at least tracks a moral agent, she tracks a bureaucracy).
  *   **Dev:** Fails Appropriation. He endorses the *sister*, not the moral feature. He explicitly disavows grasp of the value ("doesn't see the point"). **Verdict: Borrowed Credit (Low Worth).**
  *   **Stroke Patient:** Passes Sensitivity (urge tracks right action) and Partial Appropriation. She endorses the action *as right*, even if the impulse wasn't rationally derived. She owns the value, even if the engine is pathological. **Verdict: Moderate Worth.** (Lower than Pharmacist 2 because her sensitivity is less robust/rationally integrated).
  *   **Kidney Donor:** Fails Sensitivity. He acted on *kinship*, not *benevolence*. The counterfactual benevolence is irrelevant to the actual motive. **Verdict: No Worth.** (See advice below).
  *   **Duty + Enjoyment:** Passes both. Enjoyment is a concomitant, not the ground. **Verdict: Full Worth.**

  ### 3. Scalar vs. Binary
  Your intuition that worth comes in degrees is correct, but standard Kantian terminology often obscures this by treating "Good Will" as binary.

  **Recommendation:** Treat **Moral Worth** as scalar in your paper.
  Your cases (Stroke < Pharmacist 2; Dev > Policy) clearly track *degrees of connection to the moral truth*. If you force a binary view, you will have to draw arbitrary lines (e.g., "Is endorsement enough for the Stroke Patient?").
  *   **Binary View:** Worth = Presence of right motive. (Stroke Patient: Yes/No? Dev: Yes/No?)
  *   **Scalar View:** Worth = Quality of the grasp of the right motive.
  *   **Why Scalar?** It explains your "Borrowed Credit" intuition. Dev isn't at zero, but he isn't at full. The Policy Assistant is at zero. The Stroke Patient is in between. A scalar account captures the *non-accidentalness* of the action. The more the agent's own rational faculties grasp the value, the higher the worth.

  If you prefer binary, you must reclassify your "degrees" as **Praiseworthiness** (which varies with difficulty/origin) vs. **Moral Worth** (which is binary). But given your data, a Scalar Sensitivity account is more theoretically honest.

  ### 4. Verdicts on New Cases
  Applying the **Appropriated Sensitivity Principle**:

  1.  **The Fragile Agent (Right reason, near breaking point):**
      *   **Verdict:** *Reduced Moral Worth.*
      *   **Reasoning:** Sensitivity is present, but Stability is low. If the motive is so fragile that slight temptation overrides the moral reason, the agent's commitment to the value is shallow. On a scalar account, this lowers the score. On a binary account, they still have worth (they succeeded), but less praise.
  2.  **Theological Error (Returns wallet because God commands generosity; God doesn't exist):**
      *   **Verdict:** *Full Moral Worth.*
      *   **Reasoning:** She acts on "Generosity." The metaphysical explanation (God) is false, but the *moral feature* (Generosity/Need) is real and is what she is responding to. She appropriates the value. The error is metaphysical, not moral. She is sensitive to the right-making feature (helping another), even if she misidentifies the source of the obligation.
  3.  **The Robot (Trained to treat patients gently, no felt reasons):**
      *   **Verdict:** *No Moral Worth.*
      *   **Reasoning:** Fails Appropriation. It has Sensitivity (responds to patient distress), but no reflective capacity to endorse the value. It is a tool of the designer's worth, not an agent itself.
  4.  **The Committee (Aggregation procedure tracks right reason, no individual does):**
      *   **Verdict:** *No Individual Moral Worth; Debatable Collective Worth.*
      *   **Reasoning:** No individual satisfies Sensitivity + Appropriation. The *outcome* is right, but the *agency* is fragmented. Unless you posit a collective agent that can "appropriate" reasons, no moral worth is generated. This highlights that worth is a property of *minds*, not just *systems*.

  ### 5. Which Verdict to Overturn?
  You asked which verdict you should drop if the principle demands it.

  **Drop the reluctance on the Kidney Donor.**
  You wrote: *"I want to say no moral worth... but the fact that the right reason was sitting right there... makes me reluctant."*
  **Advice:** Trust your "No."
  Moral worth is about the **actual architecture of the will**, not its potential. If he acted on partiality, he acted on partiality. The fact that he *would have* acted on benevolence is a fact about his *dispositions*, not his *action*. To count this as worth is to conflate "Good Character" with "Moral Worth of Action."
  *   *Why this helps your paper:* It sharpens the distinction between **Moral Worth** (current motive) and **Moral Credit** (general reliability). The Kidney Donor has high Moral Credit (he's a good guy), but the specific action lacks Moral Worth (it wasn't done for the moral reason). This distinction cleans up the "degrees" problem: The Stroke Patient has *some* Worth (she endorsed the right), whereas the Donor has *zero* Worth on this action (he endorsed kinship), despite the Donor being a "better person" overall.

  ### 6. Summary for Your Paper
  1.  **Define Moral Worth Scalar:** As the degree of non-accidental sensitivity to right-making features.
  2.  **Adopt the Appropriation Clause:** Distinguish between acting on a proxy (Dev/Policy) vs. acting on a value one has made one's own (Stroke/Pharmacist).
  3.  **Distinguish Worth from Credit:** Use this to explain the Kidney case (High Credit, Zero Worth) and the Fragile Agent (High Worth, Low Praise/Stability).
  4.  **Resolve Dev vs. Stroke:** Dev delegates the moral judgment; the Stroke Patient appropriates it. That is the difference that makes the difference.

  This framework respects your strongest intuition (Policy Assistant = No Worth) while explaining why the Stroke Patient isn't equally excluded (she owns the value, he/she just follows the signal).
