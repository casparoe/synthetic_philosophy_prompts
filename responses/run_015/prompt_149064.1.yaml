answer: |-
  ### Desiderata List for Virtual Harm and Objecthood

  **1. The Unrendered Server Object**
  *   **Case:** A data structure occupies server memory, defined by code as a "sword," but is never rendered, referenced, or interacted with by any client.
  *   **Required Distinction:** **Memory Allocation vs. Virtual Instantiation.**
  *   **Spec:** The theory must acknowledge the object's *ontic* status (it exists as data) without granting it full *virtual* status (it lacks affordances). It is a potential object, not an actualized virtual entity.

  **2. The Footprintless Griefing Event**
  *   **Case:** A player suffers severe emotional distress due to another's actions (e.g., psychological manipulation via voice chat), but no game mechanics were triggered and no logs were written.
  *   **Required Distinction:** **System Causality vs. Social Causality.**
  *   **Spec:** The theory must locate the harm in the *social layer* mediated by the virtual, not the *mechanical layer* of the virtual. The virtual environment is the conduit, not the cause. Harm is real even if the virtual system registers no violation.

  **3. The Unobserved Procedural Collapse**
  *   **Case:** A bug causes a persistent virtual ecosystem to fail logically (e.g., prey out reproduces predators until crash), but no human ever logs in to witness the deviation.
  *   **Required Distinction:** **Computational Truth vs. Experiential Fact.**
  *   **Spec:** The theory must determine if a "world event" occurred. It must distinguish between the simulation maintaining internal integrity (or failing it) independently of observation, and the world existing as a phenomenological space.

  ---

  ### The Core Tension

  **Conflicting Requirements:** **Ontological Autonomy (Cases 1 & 3)** vs. **Normative Grounding (Case 2).**

  *   **Pull 1 (Autonomy):** To handle the unrendered object and the unobserved collapse, the theory must treat virtual structures as **mind-independent**. The code runs and objects "exist" in the system regardless of human attention.
  *   **Pull 2 (Grounding):** To handle footprintless griefing, the theory must treat virtual harm as **mind-dependent**. The reality of the harm relies entirely on human psychology and social context, often bypassing the code entirely.
  *   **Conflict:** If you prioritize Autonomy, you struggle to explain how non-mechanical interactions cause real harm (Case 2). If you prioritize Grounding, you struggle to justify the reality of unobserved code states (Cases 1 & 3).

  ---

  ### View Scoring

  **1. Naive Realism**
  *   *Thesis:* Virtual objects are quasi-physical entities with intrinsic properties.
  *   **Score:** **Fail.**
  *   **Reasoning:** Passes Autonomy (Cases 1 & 3 are real objects/events). Fails Grounding (Case 2); it cannot explain how harm occurs without mechanical contact or physical instantiation. It reduces harm to property damage, missing the social/psychological layer.

  **2. Eliminativism**
  *   *Thesis:* Virtual objects are fictions; only physical servers and human minds exist.
  *   **Score:** **Fail.**
  *   **Reasoning:** Passes Grounding (Case 2 is just real psychological harm). Fails Autonomy (Cases 1 & 3); it denies the specific ontological status of the virtual process, collapsing the server object into mere electricity and the collapse into mere math, losing the "virtual" specificity required by the spec.

  **3. Institutional/Social Ontology**
  *   *Thesis:* Virtual objects exist only via collective intentionality and normative agreement.
  *   **Score:** **Mixed/Fail.**
  *   **Reasoning:** Passes Grounding (Case 2 is a violation of social norms). Fails Autonomy (Cases 1 & 3); if no human observes or institutes the object/event, it lacks status. An unobserved ecosystem collapse is not a "world event" because no institution validates it. It solves harm but dissolves the independent reality of the simulation.
