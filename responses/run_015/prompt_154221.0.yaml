          *   *Refinement:* Use the distinction to show the *limits* of Spinoza's affective constitutionalism. The exclusion reveals where his ontology bumps against his sociological prejudices. Or, argue that for Spinoza, only those capable of a certain level of affective modulation (via reason or security) can be citizens.
          *   *Verdict:* It risks obscuring the legal point *unless* you argue that legal status is a proxy for affective capacity to participate in the common life without destabilizing it. Be careful not to justify the exclusion, but explain it through the lens of affective capacity.

      *   **Point 3: Agonistic Pluralism (Mouffe, etc.):**
          *   *The Comparison:* Agonism values conflict as constitutive of politics. Spinoza values concord (*concordia*), but acknowledges conflict.
