      *   *Check:* The "Citizen vs. Multitude" point. In *TP*, Spinoza limits citizenship. If democracy is the *multitude's* power, excluding most of the multitude is a contradiction. I need to suggest the user tackle this tension head-on rather than smooth it over.
      *   *Check:* Agonism. Be careful. Mouffe uses Schmitt (friend/enemy). Spinoza uses *utilitas* (utility). The endpoint is different. I should warn the user about the *telos* of the conflict.

