answer: |-
  You construct a trap of three doors and claim I must pass through one, but I walk through the wall instead. Your distinction between identity, exclusion, and some third thing relies on a understanding of *shi* (actuality) that is too loose for the hall of a ruler. When I say a white horse is not a horse, I do not mean the beast in the courtyard lacks the shape of a horse, nor do I mean it is excluded from the gathering of horses. I mean the *ming* (name) "white horse" is not equivalent to the *ming* "horse". You speak of words like "extension" and "predicate"; I do not know these tools of yours. If you mean by them the range of things a name admits or the label we stick upon a form, then listen closely. "Horse" names the form. "White" names the color. The name that colors the form is not the name that shapes it. If you demand a horse, a yellow one arrives; if you demand a white horse, a yellow one is rejected. Since the admission differs, the names are not the same. If the names are not the same, the things they govern are not the same in the context of command. You say this is trivial non-identity, but it is the foundation of order: if a ruler asks for a horse and receives a white one when he needed a black one for sacrifice, the ritual fails. The failure proves the names were not interchangeable, and if names are not interchangeable, one is not the other.

  Your analogy of the blood and the toy gun fails because it confuses the nature of the addition. A toy gun lacks the form of a gun; it is a deception of shape. A white horse possesses the form of a horse but adds the specification of color. You ask if I claim all modified terms are not their unmodified roots. I say this: when the modification restricts the range of what is admitted, the compound name becomes distinct from the simple name. "O-negative blood" versus "blood"—if your language treats these as I treat "white horse", then yes, by my logic, the specific is not the general. But you stumble when you say "my horse is not a horse". "My" indicates possession, not form or color. It restricts ownership, not the nature of the beast. "White" restricts the visible form required. There is a difference between restricting who owns the *shi* and restricting what the *shi* is. You ask if white is special. It is special because color and shape are the two primary ways we distinguish *wu* (things). When you combine the name of color with the name of shape, you create a new *ming* that demands a specific union. To say the union is the simple part is to ignore the color, and to ignore the color is to lose the precision required by the School of Names.

  You demand honesty regarding the thin joint in my armor, and I will not hide it from you. My weakest point is the move from "the names are distinct" to "the thing is not the thing" in the eyes of common men. When you point to the beast and say "this is a horse", the common man agrees, and even I must agree that it has the form of a horse. If I concede it has the form, do I not concede it is a horse? I must insist that "is" implies full equivalence of name and actuality, but this is where my opponents press hardest. They say I separate what heaven has joined. I reply that I separate only the names to rectify the reality, but the thinnest plank in my bridge is here: if a white horse is not a horse, can I ride a white horse when I say I ride a horse? If I say yes, I contradict myself; if I say no, I contradict experience. I survive this by saying I ride a white horse, which fulfills the act of riding, but the *ming* remains distinct. You should have asked me not about the beast, but about the sacrifice: does the precision of the name matter more than the utility of the beast? That is where my argument holds firm, and where it risks crumbling into mere wordplay if the ruler cares only for transport and not for ritual correctness.
