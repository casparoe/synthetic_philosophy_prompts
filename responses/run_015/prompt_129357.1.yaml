answer: |-
  Here is the translation of the genocide discourse into the ecological-taxonomic framework, followed by the residue report and critical evaluation of the analogy's limits.

  ### I. The Taxonomic Translation of Genocide

  **1. The Original Description (Lemkin as Taxonomist)**
  Raphael Lemkin's 1944 coinage of *genocide* functions as the **original species description** in a monographic treatment (*Axis Rule in Occupied Europe*). Prior to this, the phenomenon existed as a "cryptic species"—observable patterns of group destruction were present but lacked a diagnostic binomial, often misidentified under the genus *War Crime* or *Barbarity*. Lemkin provided the etymological diagnosis (*genos* + *cide*) and the morphological characters (coordinated actions aimed at destroying a group).

  **2. The Species Concept (The 1948 Convention)**
  The UN Genocide Convention acts as the **Species Concept** governing the taxon. Just as biologists debate whether to define species by reproductive isolation (Biological Species Concept) or monophyly (Phylogenetic Species Concept), legal scholars debate the boundaries of genocide.
  *   **Diagnostic Characters:** The Convention establishes specific synapomorphies required for identification: *dolus specialis* (specific intent to destroy) and membership in one of four protected clades (national, ethnical, racial, religious).
  *   **Exclusionary Criteria:** Political and cultural groups are explicitly excluded from the holotype definition, analogous to excluding certain morphotypes from a species description based on arbitrary phylogenetic cutoffs.

  **3. The Type Specimen (The Holocaust)**
  The Holocaust serves as the **Type Specimen**. In taxonomy, the type specimen anchors the name; all future identifications are compared against it. In genocide discourse, the Holocaust functions as the historical reference standard.
  *   **The "Golden Type" Problem:** Because the Type Specimen (the Holocaust) is so distinct and horrific, it creates a high threshold for identification. Other potential specimens (Rwanda, Srebrenica, Armenia) are measured against the Type. If they lack the "industrial morphology" of the Type, taxonomists (courts/states) may hesitate to assign the label.

  **4. Lumpers vs. Splitters (Uniqueness vs. Generality)**
  *   **The Splitters (Uniqueness Thesis):** Scholars who argue the Holocaust is *sui generis* (unique) are acting as **extreme Splitters**. They argue the Type Specimen is so distinct it warrants its own monotypic genus, separate from the broader *Genocide* clade. This preserves the normative scarcity of the label but risks rendering the taxon *Genocide* empty of future members.
  *   **The Lumpers (Generality Thesis):** Scholars who argue genocide is a repeatable structural phenomenon are **Lumpers**. They seek to merge the Holocaust, Rwanda, Cambodia, and Bosnia into a single operational taxonomic unit (OTU).
      *   *Risk of Inflation:* If Lumpers broaden the diagnostic criteria (e.g., including "cultural genocide"), they risk **taxonomic inflation**. Just as describing every color variant of a beetle as a new species dilutes conservation priority, over-applying "genocide" may dilute the normative urgency, causing "conservation fatigue" among the international community.

  **5. Institutional Politics and Nomenclatural Capture**
  *   **The Committee:** The UN Security Council and State Parties to the Convention function as the **International Commission on Zoological Nomenclature (ICZN)**. They hold the authority to validate or reject classifications.
  *   **State Refusal as Suppression:** When a state refuses to apply the label to its own actions (e.g., Turkey regarding Armenia, US regarding Rwanda initially), this is **Institutional Suppression**.
  *   **Nomenclatural Capture:** Your concept maps precisely here. A state benefits from the non-recognition of the classification because the label *Genocide* triggers specific regulatory penalties (intervention, sanctions, *erga omnes* obligations). By maintaining the classification as "Ethnic Cleansing" or "Civil War" (synonyms with lower regulatory burden), the state avoids the "quarantine" measures associated with the *Genocide* taxon. This is strategic nomenclature: keeping a protected species listed as "pest" to allow culling.

  ---

  ### II. Residue Report

  **1. Translates Without Loss (High Fidelity)**
  *   **The Politics of Naming:** The struggle over who has the authority to name (courts vs. states vs. NGOs) mirrors the struggle between molecular taxonomists and museum curators.
  *   **The Type Specimen Burden:** The way the Holocaust anchors the definition creates the same identification bias as a famous Type Specimen in a museum; deviations from the Type are often rejected as "misidentifications."
  *   **Taxonomic Inflation:** The fear that broadening the definition devalues the currency of the term is identical to the conservation biologist's fear that listing too many species as "Endangered" renders the list meaningless.

  **2. Requires Distortion (The Fudge Factors)**
  *   **Ontological Status:** In ecology, a species exists independently of the taxonomist (realism). A tiger is a tiger even if no one names it. In genocide discourse, the *crime* exists physically, but the *category* is legally constructivist. An act often does not become "genocide" until a court or state says so. I am fudging the analogy by treating genocide as a natural kind waiting to be discovered, rather than a legal status conferred by authority.
  *   **Cryptic Species:** In ecology, cryptic species are revealed by DNA. In genocide, "cryptic genocides" are revealed by testimony and archives. The "DNA" of genocide (intent) is internal and mental, not external and morphological. I am stretching the "morphological" analog to cover "intent," which is not observable in the same way.

  **3. No Taxonomic Counterpart (The Normative Residue)**
  *   **The Moral Weight of Testimony:** A beetle does not testify to its own classification. Survivor testimony is central to genocide identification but nonexistent in taxonomy. The "data" in genocide discourse includes moral suffering, which has no ecological equivalent.
  *   **The Performative Trigger:** Naming a species does not legally compel action (unless CITES-listed, but even then, it is regulatory). Naming a genocide triggers *legal obligations to prevent and punish* under international law. The name *is* the trigger. In taxonomy, the name describes reality; in genocide law, the name *changes* reality.
  *   **Agency of the Subject:** Species do not deny their own classification. Perpetrators actively campaign to misidentify the taxon. This adversarial epistemology (active disinformation vs. passive nature) has no parallel in biological systematics.

  ---

  ### III. Evaluation of "Nomenclatural Capture"

  Your notion of **nomenclatural capture** illuminates the *mechanism* of denial but imports a false assumption about *consensus*.

  *   **Where it Illuminates:** It perfectly explains the strategic utility of ambiguity. Just as a logging company might lobby to keep a rare owl classified under a common name to avoid habitat restrictions, a state lobbies to keep atrocities classified as "war crimes" to avoid intervention. It highlights that classification is not neutral but regulatory.
  *   **Where it Imports False Assumptions:** In ecology, "Nomenclatural Capture" assumes a stable scientific reality that is being obscured. It assumes the "true" species exists and the authority is hiding it. In human rights, the "truth" is often contested evidence, not hidden biology. Furthermore, ecological authorities (ICZN) strive for stability and universal acceptance. Genocide "authorities" (UNSC) are explicitly political bodies where veto power overrides scientific/legal consensus. The "capture" in genocide is not a corruption of a scientific process; it *is* the political process.

  **Verdict:** The term is heuristically powerful for describing the *strategy* of denial, but it risks implying that a neutral, apolitical "correct classification" exists waiting to be liberated, whereas in international law, the classification is inherently a product of power.

  ---

  ### IV. The Breaking Point: The Performative Residue

  The specific failure in the analog that convinces me the ecological vocabulary is genuinely missing something essential is the **Performative vs. Descriptive Gap**.

  **The Failure:**
  In taxonomy, the goal is **Descriptive Accuracy**. If we misidentify a species, we fail to understand nature, but the tiger does not cease to exist.
  In genocide discourse, the goal is **Normative Intervention**. If we fail to identify genocide, the atrocity continues *because* the failure to identify prevents the legal mechanisms that stop it.

  **The Breaking Point in Reasoning:**
  The analogy breaks down at the moment of **Identification**.
  *   *Ecological Reasoning:* "We must identify this species correctly so we can conserve it." (Identification $\rightarrow$ Conservation).
  *   *Genocide Reasoning:* "We must identify this as genocide *in order to make it stoppable*." (Identification $\rightarrow$ Legal Existence of Obligation).

  In ecology, the value of the organism is intrinsic (biodiversity). In genocide law, the value of the label is instrumental (prevention).

  **Conclusion:**
  The ecological vocabulary fails because it treats "Genocide" as a **Natural Kind** (like a species) rather than a **Speech Act** (like a verdict). A species description is a hypothesis about the world; a genocide declaration is a command to the world.

  If you treat genocide as a species, you assume the primary problem is *epistemological* (we can't see the boundaries). In reality, the primary problem is *political* (we see the boundaries but refuse to cross them). The "Nomenclatural Capture" analogy works only as long as you ignore that in ecology, the Committee serves the Science, whereas in genocide, the "Committee" (UNSC) serves the States. When the authority itself is the perpetrator, the taxonomic model of "objective classification vs. political suppression" collapses, because there is no objective authority outside the politics to appeal to.

  **Final Diagnosis:** The analogy is a robust heuristic for the *politics of naming*, but it creates a dangerous illusion of scientific neutrality in a domain defined by moral urgency and power asymmetry. It explains the *denial*, but it cannot explain the *duty*.
