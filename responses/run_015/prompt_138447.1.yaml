answer: |-
  **Assessment Question**

  **Course:** ECO490: Methodology of Economics
  **Assessment:** Take-Home Final (48 Hours)
  **Word Limit:** 1,000 words (±10%)

  **Question: The Ontology of Welfare and the New Good Problem**

  Consider a household observed over a long horizon $t=1 \dots T$. Throughout this period, the household faces varying budget sets over a fixed list of goods $X$. The data satisfy the Generalized Axiom of Revealed Preference (GARP), consistent with the maximization of a stable, well-behaved utility function $U(X)$.

  In period $T+1$, a genuinely new good $z$ becomes available. The household purchases a positive amount of $z$ at price $p_z$, while the original bundles from $t \le T$ remain affordable. An economist claims the household is strictly better off. A policymaker asks *how much* better off, requesting a monetary welfare measure. The household simultaneously volunteers a statement: "This good has changed our quality of life far more than the expenditure implies."

  Write an essay addressing the following:

  1.  Evaluate the epistemic status of the welfare *magnitude*. Why does the introduction of $z$ transform the problem from ordinal ranking to cardinal measurement, and what specific unobserved data is required to convert the choice into a dollar figure?
  2.  Analyze the meaning of "utility" in this context. Does the recovered index represent a latent psychological magnitude or merely a re-encoding of choice probabilities? Does this definition shift when moving from the pre-$z$ regime to the post-$z$ regime?
  3.  Assess the methodological status of the household's self-report. Within a strict revealed preference framework, can this testimony carry weight? If not, what theoretical concessions are required to admit it as evidence?

  ***

  **Model Answer**

  The introduction of a new good $z$ fundamentally alters the methodological landscape of welfare analysis. While the direction of the welfare change is identified by revealed preference, the magnitude is not. Prior to $T+1$, the utility index $U(X)$ serves as an ordinal representation of choice; any monotonic transformation preserves the ranking of bundles. The claim that the household is "better off" relies on the weak axiom: since the pre-$z$ optimal bundle remains affordable but was rejected in favor of a bundle containing $z$, the new bundle is revealed preferred. This is a binary, ordinal fact requiring no cardinal structure.

  However, quantifying *how much* better off requires converting utility differences into monetary equivalents, such as compensating variation. This necessitates integrating the demand curve for $z$ from the observed price $p_z$ out to the choke price where demand falls to zero. Here lies the identification problem. We observe demand only at the current price (and potentially nearby prices if they fluctuate slightly). We do not observe the counterfactual choices at prices where $z$ is too expensive to buy. To calculate the area under the demand curve (consumer surplus), the economist must impose functional form assumptions on the utility function to extrapolate demand into the unobserved region. Consequently, the welfare magnitude is not a measurement derived purely from data, but a model-dependent artifact. It is cardinal only relative to the specific parametric assumptions chosen to close the model. Without these assumptions, the data provide bounds, not a figure.

  This exposes a shift in the ontology of utility. In the pre-$z$ regime, utility is operationalist: it is defined entirely by the consistency of choices over $X$. It is a mathematical device to summarize behavior, not a claim about internal states. However, the demand for a welfare *magnitude* implicitly treats utility as a real, latent magnitude that exists independently of the specific choices observed. The economist is no longer asking "what was chosen?" but "how much satisfaction was generated?" This requires utility to be cardinal and comparable across the counterfactual states of "with $z$" and "without $z$." If utility is merely a re-encoding of choice, the question of magnitude is category error; if it is a real magnitude, choice data alone are insufficient to measure it without strong structural priors.

  The household's self-report complicates this further. In a strict revealed preference framework, the statement "this changed our life" is methodologically inert. Revealed preference posits that choice is the sole revelation of preference. Verbal reports are "cheap talk," potentially subject to bias, framing, or strategic misrepresentation, and possess no axiomatic link to welfare. To admit the testimony as evidence, the economist must abandon the strict behaviorist ontology. One must adopt a "dual-self" or structural model where reported happiness is a noisy signal of the latent utility function, distinct from the choice mechanism.

  Alternatively, one could treat the self-report as a constraint on the admissible utility functions. If the reported welfare gain exceeds the monetary surplus calculated by the model, the model is misspecified. However, this concedes that choice is not the sufficient statistic for welfare. It implies that the agent has access to their utility function that the economist does not, undermining the revealed preference axiom that preference *is* choice. Thus, admitting the report requires shifting from a revealed preference methodology to a structural or psychological methodology, where utility is a latent variable measured by multiple indicators (choices and reports) rather than defined solely by choices.

  In conclusion, the welfare magnitude is a modeling artifact unless one assumes specific functional forms that extrapolate beyond observed choice. The meaning of utility shifts from an ordinal index of consistency to a cardinal measure of latent satisfaction. Finally, the household's report is inadmissible in strict revealed preference theory; accepting it requires treating utility as a psychological reality that choice reveals imperfectly, rather than a construct defined perfectly by choice.

  ***

  **Marking Scheme (Total: 20 Marks)**

  **1. Distinction Between Ordinal Ranking and Cardinal Measurement (5 Marks)**
  *   **5 Marks:** Clearly distinguishes that the *direction* of welfare change is identified via GARP (ordinal), but the *magnitude* requires integration of the demand curve (cardinal). Explicitly notes that this requires data at prices where the good is not purchased.
  *   **3-4 Marks:** Identifies the ordinal/cardinal split but is vague on the specific mechanism (integration/choke price) required for measurement.
  *   **0-2 Marks:** Conflates the two or suggests GARP identifies the magnitude.
  *   *Note on Strong Candidates:* Often spend too much time proving GARP holds rather than explaining why it fails to identify magnitude.

  **2. Identification and the Role of Extrapolation (5 Marks)**
  *   **5 Marks:** Explicitly states that the welfare figure is model-dependent. Explains that functional form assumptions are required to extrapolate demand into the unobserved region (the "bounds vs. figure" distinction).
  *   **3-4 Marks:** Mentions that assumptions are needed but does not clearly link this to the unobserved portion of the demand curve.
  *   **0-2 Marks:** Claims the magnitude can be calculated directly from observed expenditure.
  *   *Note on Strong Candidates:* Sometimes get bogged down in Slutsky equations and miss the philosophical point about counterfactuals.

  **3. Ontological Shift of Utility (5 Marks)**
  *   **5 Marks:** Articulates that utility shifts from an operational summary of choice (pre-$z$) to a latent psychological magnitude (post-$z$ measurement). Identifies this as a shift in the definition, not just the application.
  *   **3-4 Marks:** Notes utility is ordinal vs. cardinal but treats it as a technical constraint rather than a shift in meaning/ontology.
  *   **0-2 Marks:** Recites "utility is ordinal" without applying it to the new good context.
  *   *Note on Strong Candidates:* Often describe the math correctly but fail to label the ontological implication (realism vs. instrumentalism).

  **4. Status of Self-Report and Theoretical Concessions (5 Marks)**
  *   **5 Marks:** Correctly identifies the report as inadmissible under strict revealed preference. Explains that admitting it requires treating utility as a latent variable measured with error (structural/psychological approach).
  *   **3-4 Marks:** Dismisses the report as "subjective" without explaining the theoretical conflict with revealed preference axioms.
  *   **0-2 Marks:** Suggests the report should simply be added to the data without theoretical adjustment.
  *   *Note on Strong Candidates:* Often argue for the report's validity based on ethics rather than methodological consistency.

  **Grading Boundary Notes:**
  *   **A Grade (17-20):** Must hit 5 marks on Criteria 2 and 3. The answer must explicitly state that the magnitude is a *modeling artifact* without functional assumptions and that utility changes from a *representation* to a *latent trait*.
  *   **B Grade (13-16):** Will likely secure marks on Criteria 1 and 4 but treat Criteria 2 and 3 as standard microeconomic theory (underdetermination) rather than a methodological crisis regarding the meaning of utility.
