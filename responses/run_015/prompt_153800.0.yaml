  2.  **Analyze the Theoretical Framework (Dennett's Tower):**

      *   *Darwinian:* Hardwired, evolutionary selection. Trials happen across generations via death/reproduction. (Genes).
      *   *Skinnerian:* Operant conditioning. Trials happen within a lifetime via reward/punishment. (Reinforcement).
      *   *Popperian:* Internal simulation. Hypotheses die in your stead. You think before you act. (Mental models).
      *   *Gregorian:* Cultural tools. Hypotheses are shaped by tools, language, and others' wisdom. (Memes/Checklists).
      *   *Key Concept:* "Generate-and-Test." Each floor allows for *safer* or *more efficient* testing of behavioral options.

  3.  **Analyze the Case (US Airways 1549):**

      *   *Agents:* Capt. Sullenberger, FO Skiles, Cabin Crew, ATC, Passengers, Aircraft Systems.
      *   *Environment:* Low altitude, dual engine failure, urban density, cold water.
      *   *Time:* ~3 minutes from strike to ditching.
      *   *Resources:* Checklists (ECAM), Training (Sims), Experience (Glider background), CRM (Communication).

  4.  **Drafting the Mapping (Theory onto Case):**

      *   *Who is the Creature?* It's not just Sully. It's the *Coupled Crew-Aircraft System*. Dennett allows for "vehicles" of cognition. The cockpit is the skull, the radios are sensory organs, the checklists are externalized memory.
