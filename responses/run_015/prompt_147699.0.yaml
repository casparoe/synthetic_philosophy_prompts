  # Session Plan: The Unilateralist's Curse (90 Minutes)

  ## 1. Game Design & Arithmetic

  **The Logic:**
  We need a scenario where an individual is rational to act on a positive signal, but the group is irrational to allow *anyone* to act on a positive signal. This requires the cost of a false positive (acting in a Bad state) to outweigh the benefit of a true positive (acting in a Good state), scaled by the probability that *someone* makes a mistake in a large group.

  **Parameters:**
  *   **States:** Good (G) or Bad (B). Prior probability $P(G) = P(B) = 0.5$.
  *   **Signals:** Private, independent. Accuracy $p = 0.60$ (60% chance signal matches state).
  *   **Payoffs (Per Person):**
      *   Status Quo (No Action): **0 points**.
      *   Action in Good State: **+70 points**.
      *   Action in Bad State: **-100 points**.
  *   **Decision Rule:** Action occurs if **≥ 1 person** chooses "Launch".

  **The Arithmetic (for your reference):**
  1.  **Single Decider (N=1):**
      *   If I see a "Good" signal, probability state is Good is 0.60.
      *   Expected Value (EV) = $(0.60 \times 70) - (0.40 \times 100) = 42 - 40 = \mathbf{+2}$.
      *   *Result:* It is rational to launch. (Barely).
  2.  **Small Group (N=4):**
      *   Prob(Action | Good) = $1 - (0.40)^4 \approx 0.974$.
      *   Prob(Action | Bad) = $1 - (0.60)^4 \approx 0.870$. (High false positive rate).
      *   Group EV = $0.5 \times [(0.974 \times 70) - (0.870 \times 100)] \approx \mathbf{-9.4}$ per person.
      *   *Result:* Irrational. Value destroyed.
  3.  **Large Group (N=20):**
      *   Prob(Action | Good) $\approx 1.0$.
      *   Prob(Action | Bad) $\approx 1.0$. (Almost certain someone errs).
      *   Group EV = $0.5 \times [70 - 100] = \mathbf{-15}$ per person.
      *   *Result:* Deeply irrational. Damage saturates.

  **Points & Stakes:**
  *   **Currency:** "Collective Utility Points" (CUPs).
  *   **Value:** Points are not money. They determine a **shared outcome** for the seminar.
      *   *Threshold:* If the final average score per person is **positive**, the session ends 5 minutes early (everyone gains time).
      *   *Threshold:* If the final average score is **negative**, you (the facilitator) assign a 1-page reflection prompt due next week (everyone loses time).
  *   **Scorekeeping:** Do **not** let individuals track their own scores. Maintain one **"Commons Pot"** on the whiteboard. This enforces the shared stakes. If the group loses points, everyone loses, regardless of their individual vote.

  ---

  ## 2. Materials & Setup

  *   **Cards:** 2 Decks of standard playing cards.
      *   *Preparation:* Remove all face cards and jokers. You need 40 cards total (20 Red, 20 Black).
      *   *Deck G (World is Good):* 12 Red, 8 Black. (60% Red).
      *   *Deck B (World is Bad):* 8 Red, 12 Black. (60% Black).
      *   *Label:* Mark the backs of Deck G with a tiny dot (visible only to you).
  *   **Decision Slips:** 40 small slips of paper per round. Pre-printed with: `[ LAUNCH ]` / `[ WAIT ]`.
  *   **Collection Box:** A opaque box or hat for slips.
  *   **Whiteboard:** Drawn with a "Commons Pot" tracker.
  *   **Tables:** Arrange 5 tables of 4 people (Phase 1), then push together for one large circle (Phase 2).
  *   **Enforcement:** Place a **"SILENCE"** tent card on each table. Rule: "Once cards are dealt, no talking, no gesturing, no eye contact signaling until slips are collected."

  ---

  ## 3. Minute-by-Minute Timeline

  | Time | Phase | Activity |
  | :--- | :--- | :--- |
  | **00-05** | **Intro** | Welcome. Explain stakes (Time vs. Reflection Paper). **Do not mention the topic.** Explain rules: "You will get a signal. You may Launch or Wait. If *anyone* Launches, we all get the outcome." |
  | **05-10** | **Practice** | 1 Practice Round (N=20). No scoring. Ensures mechanics work. |
  | **10-30** | **Phase 1** | **Small Groups (N=4).** 5 Tables. 3 Rounds. <br>1. Flip coin (Hidden). Select Deck G or B.<br>2. Deal 4 cards per table.<br>3. Silent decision.<br>4. Collect slips.<br>5. Reveal State. Update Commons Pot (Average the 5 tables). |
  | **30-50** | **Phase 2** | **Large Group (N=20).** 1 Room. 3 Rounds.<br>Same mechanics, but all 20 slips go into one box. One shared outcome. <br>*Watch the score drop.* |
  | **50-65** | **Variants** | **Round 7 (Expert):** One person per table gets 2 cards (Accuracy ~80%).<br>**Round 8 (Correlated):** Everyone at a table gets the *same* color card (Copy machine). |
  | **65-75** | **Analysis** | Hand out a worksheet with the probabilities. Ask groups: "Calculate the EV for N=1 vs N=20." |
  | **75-90** | **Debrief** | Reveal "Unilateralist's Curse". Discuss threshold solutions ($k$ of $N$). Honest critique. |

