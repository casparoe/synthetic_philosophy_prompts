  ## 8. Facilitator Notes for Enforcement

  *   **The "No Talk" Rule:** Do not police it aggressively. If someone whispers, simply pause, wait for silence, and say, "Remember, communication invalidates the signal independence." Make it a rule of the *physics* of the game, not a classroom discipline issue.
  *   **Signal Distribution:** Walk around to deal cards face down. Do not let them look until you say "Go."
  *   **The Reveal:** When revealing the State (Good/Bad), show the Deck you used (Deck G or Deck B). This proves the probabilities were real, not you rigging the outcome.
