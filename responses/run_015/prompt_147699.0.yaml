  ## 4. Variant Rounds (Details)

  **Variant 1: The Expert (Round 7)**
  *   **Setup:** At each table of 4, one person is privately handed an envelope with **2 cards** drawn from the same deck. The others get 1 card.
  *   **Instruction:** "One of you has better data. You still operate under the 'Anyone May Launch' rule."
  *   **Point:** Does the group defer to the expert? Or does the unilateral rule allow a non-expert with a false positive to override the expert's caution?
  *   **Expected Outcome:** The curse persists. A non-expert with a false positive (40% chance) will likely launch before the expert (who might see mixed signals) decides to act.

  **Variant 2: Correlated Errors (Round 8)**
  *   **Setup:** Do not deal individual cards. Flip one coin for the table. If Heads, *everyone* at the table gets a Red card. If Tails, *everyone* gets a Black card. (Simulates shared media/source).
  *   **Instruction:** "Your signals are no longer independent."
  *   **Point:** The curse vanishes. If the signal is wrong, everyone is wrong, but no one *disagrees*. The probability of a "rogue launcher" drops to zero.
  *   **Expected Outcome:** Score recovers. Shows independence of error is the driver, not the error size.

  ---

  ## 5. Debrief Script (5 Minutes)

  **Step 1: The Reveal (1 min)**
  "You just experienced the **Unilateralist's Curse** (Bostrom et al.). In Phase 1 (N=4), you lost points. In Phase 2 (N=20), you lost more. Yet, in every single round, every person who chose to Launch was making a **rationally correct decision** based on their private information."

  **Step 2: The Mechanism (2 mins)**
  "Look at the math.
  *   **Individual:** If I see Red, I'm 60% sure it's Good. +70 vs -100. My EV is +2. I am *right* to Launch.
  *   **Group:** But with 20 people, the chance that *at least one* person gets a false Red signal in a Bad World is nearly 100%.
  *   **Asymmetry:** In a Good World, adding people helps (someone finds the signal). In a Bad World, adding people hurts (someone makes a mistake). Since the penalty (-100) is larger than the gain (+70), the mistakes dominate."

  **Step 3: The Solution (2 mins)**
  "The fix is not 'be more careful.' You were already rational. The fix is **changing the threshold**.
  *   Unilateralism = 1 of N launches. (Failed).
  *   Consensus = N of N launches. (Too slow, misses Good states).
  *   **Solution:** Launch only if **$k$ of $N$** agree.
  *   As $N$ grows, $k$ must grow. If you double the decision-makers, you must more than double the required agreement to maintain safety. This implies that **adding decision-makers can make a group worse off** unless you raise the bar."

  ---

  ## 6. Honest Critique (For Your Preparation)

  **1. Predictable Failures (The "Hero" and the "Saboteur")**
  *   **What will happen:** You will have one participant who *never* launches (principled caution) and one who *always* launches (chaos or heroism).
  *   **Impact:** In N=20, the "Never" player doesn't save the group (someone else will launch). The "Always" player guarantees the curse triggers.
  *   **Handling:** Do not call them out during the game. In the debrief, say: "Even if 19 of you played perfectly, the 20th person's error rate determines the group's fate. This is the vulnerability of unilateral systems."

  **2. Missing Real-World Features**
  *   **Reputational Incentives:** In the game, launching has no personal cost. In reality, the "Launcher" often gets credit for saving the day (if right) or plausible deniability (if wrong). This incentivizes launching *more* than the game does.
  *   **Contested Stakes:** In the game, +70 and -100 are known. In reality, people disagree on the values (e.g., economic gain vs. existential risk). The curse is worse when stakeholders disagree on $V$ and $C$.
  *   **Cost:** This simplification makes the game cleaner but underestimates how hard it is to coordinate in reality.

  **3. Misleading Impression (The Status Quo Bias)**
  *   **The Risk:** Participants may leave thinking "Unilateral action is always bad; consensus is always good."
  *   **Correction:** You must explicitly state: "The Curse biases us toward the Status Quo. Sometimes the Status Quo is catastrophic (e.g., climate change, pandemic response). If waiting for consensus guarantees doom, unilateral action may be the *only* rational choice, curse or not. The lesson is not 'never act alone,' but 'calculate the threshold $k$ based on the stakes.'"

