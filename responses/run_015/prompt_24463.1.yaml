  ### The Harm Principle Formulated

  In *On Liberty*, John Stuart Mill formulates the harm principle as a strict boundary on legitimate social and political coercion. The principle asserts that the only purpose for which power can be rightfully exercised over any member of a civilized community, against his will, is to prevent harm to others. Several commitments are explicit in this formulation. First, it is a limit on the public's authority over the individual, not a guide for individual morality. Second, the sole end justifying coercion is the prevention of harm to others; an individual's own physical or moral good is not sufficient warrant. Third, self-regarding conduct—actions that affect only the agent—is beyond the public's authority. Finally, the principle is framed in the singular, governing the relationship between one person's liberty and the rest of the community. It is an individualist instrument designed to protect individual autonomy from the tyranny of the majority or the state.

  ### Mapping the 1859 Episode

  The 1859 transition involves the liquidation of the East India Company (EIC) and the transfer of authority over India to the Crown, coinciding with Mill's retirement and the publication of *On Liberty*. To map this onto the harm principle, we must identify the agents and objects of coercion. The agent of coercion is the British State (successor to the EIC), administering rule over India. The relevant action is imperial governance, maintained by military and bureaucratic force. The "harm" in this context is the deprivation of political self-determination and the enforcement of foreign law. The harmed are the Indian population, conceived collectively as a subject people.

  When the harm principle is applied to this mapping, immediate friction arises. The principle is designed to protect an individual from the public, yet the 1859 episode concerns a public (Britain) coercing a foreign population (India). The principle's singular framing offers no direct mechanism for assessing the liberty of a collective entity against an imperial power.

  ### Tension One: The Individual vs. The Collective

  The first failure of contact is categorical. The harm principle is an individualist instrument, yet the object of the 1859 transition is the self-governance of an entire people. The principle asks whether an individual's action harms another individual; it does not ask whether a nation's sovereignty harms another nation. Consequently, the harm principle goes silent where colonialism operates unless the collective is treated as a singular moral agent. Mill attempts to bridge this in "A Few Words on Non-Intervention," arguing that non-intervention is the default rule for civilized nations. However, by restricting this default to "civilized" nations, he admits that the principle does not universally govern international affairs. The theory lacks the vocabulary to condemn the coercion of a people unless that people is first recognized as capable of the liberty the principle protects.

  ### Tension Two: Paternalism and the "Civilized" Caveat

  The second tension concerns Mill's exception for peoples deemed not ready for self-government. In *Considerations on Representative Government*, Mill argues that despotism is a legitimate mode of government in dealing with barbarians, provided the end is their improvement. This proviso is the doctrinal ground on which continued British rule in India was defended. This stands in direct tension with the harm principle's core prohibition: that an individual's own good is not sufficient warrant for coercion.

  Is this proviso a coherent extension or special pleading? If a nation is analogous to a child, the exception is coherent within Mill's utilitarianism, which allows paternalism for those lacking maturity. However, this classification functions as a loophole that allows the principle to be suspended for any population the administrator classifies as "backward." The harm principle forbids coercing a man for his own good; the imperial exception permits coercing a people for their own good. This is not a logical extension but a suspension of the principle's moral core. It suggests the principle applies only to those who have already achieved the status the principle is meant to secure, rendering it useless for those struggling to attain it.

  ### Tension Three: Functionary Complicity and Timing

  The third tension involves Mill's personal role. Mill was a drafter of despatches, subordinate to the Examiner and the Board of Control. The coercion administered was institutional, not personal. The harm principle is addressed to the public's authority over the individual, not to a functionary's complicity within an authority. The principle offers no guidance on whether a liberal philosopher should administer illiberal policies. It limits the state, not the employee.

  This ambiguity complicates the timing of 1859. Mill retired the same year he published *On Liberty*. This looks less like a philosopher aligning his life with his doctrine and more like a man stepping down from a post that had become untenable while leaving the doctrine untouched. The Government of India Act 1858 liquidated the Company; Mill's retirement was structurally inevitable. Publishing *On Liberty* simultaneously allows him to articulate a theory of liberty he could not practice in his career. "A Few Words on Non-Intervention" adds to this ambiguity. It argues against interfering with civilized nations but allows intervention for barbarous ones. This is not a critique of the status quo he was leaving, but a defense of the specific hierarchy he administered. It repositions him as a theorist of empire rather than a critic of it, distinguishing between peoples worthy of liberty and peoples worthy of rule.

  ### Conclusion: Theory and Episode

  The 1859 episode reveals that the harm principle is an anomaly Mill's thought cannot fully absorb without contradiction. The theory is silent on the legitimacy of imperial structures unless supplemented by a civilizational hierarchy that contradicts the principle's universalist aspirations. Rival models explain the episode better than Mill's own principle. The economics of empire explains the Company's liquidation and transfer to the Crown. The civilizing mission explains Mill's personal justification for his career. The harm principle explains neither the structure of the transition nor the morality of the rule, except by excluding the subject population from its protection.

  The episode shows that the harm principle was never designed to govern imperial authority. When Mill attempts to apply it via the "Non-Intervention" essay, he must carve out exceptions that swallow the rule. The principle forbids paternalism for individuals but permits it for nations deemed immature. This creates a genuine tension in Mill's thought: the liberty of the Englishman is secured by the subjugation of the Indian, justified by a standard of maturity the Indian is denied the freedom to achieve. The theory cannot resolve this without admitting that liberty is a privilege of power, not a universal right.

  Verdict: INCONSISTENCY (the episode reveals a genuine tension in Mill's thought that the harm principle, as he stated it, cannot resolve).
