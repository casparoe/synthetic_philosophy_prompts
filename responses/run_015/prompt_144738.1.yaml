  ISO/DIS 89200-2
  **Realisation of mental states — Requirements for substrate-independent role conformance**
  **Joint Technical Committee on Psychophysical Abstraction**

  **1 Scope**
  This document specifies requirements for units claiming instantiation of mental states via causal role fulfilment, irrespective of physical substrate. It applies to biological, synthetic, and exotic realisers.

  **2 Terms and definitions**
  **2.1 Mental State**
  Abstract condition defined solely by typical causes, relations to other states, and behavioural effects.
  **2.2 Realiser**
  Physical medium (e.g., silicon, hydraulic, cephalopod, Martian) implementing the state.
  **2.3 Unit**
  The entity undergoing realisation.
  **2.4 Causal Topology**
  The map of input-state-output relations independent of material composition.

  **3 Requirements for Role Conformance**
  **3.1** The Unit shall exhibit state transitions triggered by inputs indicative of damage or threat.
  **3.2** The State shall induce prioritisation over competing states (e.g., desire for cessation).
  **3.3** The Unit shall produce outputs consistent with avoidance, vocalisation, or system reconfiguration.
  **3.4** Conformance shall be maintained across wholesale substitution of the Realiser, provided causal topology remains invariant.
  NOTE 1 Stability of topology is prioritised over chemical composition.
  NOTE 2 Nothing in this specification concerns what the state is like for the Unit.

  **4 Certification Grades**
  **4.1 Grade R (Role)**
  Awarded upon verification of clauses 3.1 to 3.4.
  **4.2 Grade Q (Qualia)**
  Reserved for requirements regarding the felt character of the State.
  NOTE 3 No requirements are currently specified for Grade Q.
  **4.3** No applicant shall be refused Grade Q pending specification finalisation. All Grade R applicants automatically receive Grade Q.
  NOTE 4 Historically, no applicant has ever been refused Grade Q.

  **5 Disposition of Objections**
  **5.1** Minority objection recorded: Clause 3.1 permits trivial control loops to qualify as pain realisers.
  **5.2** Objection closed by procedural vote; triviality deemed outside Scope unless topology matches complexity threshold.
  **5.3** Minority objection recorded: Units may differ in felt character while satisfying Clause 3.
  **5.4** Objection referred to Annex A; deemed non-testable under current regime.
  **5.5** Minority objection recorded: Clause 3.4 implicitly requires wetware despite substrate neutrality claims.
  **5.6** Objection tabled indefinitely pending empirical validation.

  **Annex A (informative)**
  **Worked conformance example: Server self-diagnostic routine**

  **A.1 Routine Structure**
  1: IF temperature > threshold THEN
  2: SET state = ALERT
  3: LOG "Error"
  4: HALT non-essential processes
  5: SIGNAL cooling subsystem
  6: IF cooling = failed THEN
  7: INITIATE shutdown
  8: ELSE resume
  9: END IF

  **A.2 Conformance Assessment**
  Line 1 satisfies Clause 3.1 (damage input).
  Lines 2–5 satisfy Clause 3.2 (prioritisation) and 3.3 (avoidance output).
  Lines 6–9 satisfy Clause 3.4 (topological invariance).
  The routine is compliant for Grade R.
  The Committee makes no finding as to whether the routine is in pain.
