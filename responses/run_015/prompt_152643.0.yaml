  ## Facilitator's Private Briefing

  **Read this before the session. Do not share this vocabulary with the group.**

  **1. The Mathematics of the "Nudge"**
  The "natural repair" you are asking them to invent is known as **Jeffrey Conditioning** (or Probability Kinematics).
  *   **Standard Conditioning:** You learn $E$ is true ($P(E)=1$). You update $P(H)$ to $P(H|E)$.
  *   **Jeffrey Conditioning:** You do not learn $E$ is true. You learn your confidence in $E$ should now be $x$ ($P_{new}(E) = x$).
  *   **The Rule (Rigidity):** To update, you preserve the conditional probabilities of everything else *given* $E$. Formula: $P_{new}(H) = P_{old}(H|E) \cdot P_{new}(E) + P_{old}(H|\neg E) \cdot P_{new}(\neg E)$.
  *   **In plain English:** "Spread the shift across the cases in proportion, leaving the relative odds inside each case exactly as they were."

  **2. The Truth About Order Dependence**
  You asked me to be frank: **If you apply Jeffrey Conditioning to the *same* partition (e.g., updating "Confidence in Bag 1" twice), order does *not* matter.** The second update overwrites the first.
  *   **To make order matter:** The two nudges must operate on **different partitions** of the possibility space.
  *   **In this activity:** Nudge 1 is about the **Source** (Bag 1 vs. Bag 2). Nudge 2 is about the **Attribute** (Red vs. Blue).
  *   **Why it fails:** When you update Source first, you change the correlation between Source and Attribute. When you subsequently update Attribute, you preserve the *new* correlation. If you update Attribute first, you preserve the *original* correlation.
  *   **Reference:** Diaconis & Zabell (1982), "Updating Subjective Probability."
  *   **Terminology:** "Soft evidence" and "conditioning on a weighted mixture" are often used loosely. In this context, they are the same proposal (Jeffrey Conditioning). The distortion you suspected is usually people treating soft evidence as hard likelihood ratios without admitting they are making a policy choice to do so.

  **3. What This Activity Cannot Reproduce**
  *   **Continuous Confidence:** Here, confidence moves in discrete bean-steps. Real life is fluid.
  *   **Partition Selection:** In life, we choose *how* to slice the world (is this a "Bag" problem or a "Color" problem?). Here, I have forced the partitions on them. The deepest lesson—that the choice of partition is itself a judgment—must be spoken by you in the debrief.

  ---

  ## Activity: The Dim Lamp and the Two Bags

  **Time:** 90 Minutes
  **Participants:** 14 (Work in pairs if beans are scarce, but individual cards are better for honesty).
  **Materials:**
  *   14 Index cards (labeled "My State").
  *   280 Dried Beans (20 per person).
  *   2 Opaque Bags (Bag 1, Bag 2).
  *   40 Beads (20 Red, 20 Blue).
      *   **Bag 1 Load:** 18 Red, 2 Blue.
      *   **Bag 2 Load:** 2 Red, 18 Blue.
  *   1 Lamp with dimmer.
  *   1 "Truth Deck" (4 cards: B1-Red, B1-Blue, B2-Red, B2-Blue).
  *   Scoring Lookup Cards (1 for Facilitator, 1 for Helper).

  ### The Scoring Rule (Proper Scoring)
  *To ensure honest reporting, use this Lookup Table. Do not explain the math.*
  **Rule:** Count the beans on the **Winning Outcome**. Find the score below. That is their ticket count.

  | Beans on Winner | Tickets Won |
  | :--- | :--- |
  | 10 | 10 |
  | 9 | 9.9 |
  | 8 | 9.6 |
  | 7 | 9.1 |
  | 6 | 8.4 |
  | 5 | 7.5 |
  | 4 | 6.4 |
  | 3 | 5.1 |
  | 2 | 3.6 |
  | 1 | 1.9 |
  | 0 | 0 |

  *(Note: This penalizes over-confidence when wrong more than it rewards it when right, incentivizing true probability reporting.)*

  ---

  ### Minute-by-Minute Timeline

  #### 0:00 – 0:10 | Introduction & Setup
  *   **Facilitator:** "We are reasoning about a hidden state. There are two Bags. One is mostly Red, one is mostly Blue. We don't know which is which."
  *   **Reveal Prior:** "Actually, we do know. Bag 1 is 90% Red. Bag 2 is 90% Blue. We start 50/50 on which Bag is in front of us."
  *   **Action:** Participants place 10 beans on their Index Card in a 2x2 grid layout (Bag 1/Red, Bag 1/Blue, Bag 2/Red, Bag 2/Blue).
      *   **Instruction:** "Place 10 beans total. 5 on Bag 1 side, 5 on Bag 2 side. Inside Bag 1, 90% on Red. Inside Bag 2, 90% on Blue."
      *   **Check:** Everyone should have: **B1R=4.5, B1B=0.5, B2R=0.5, B2B=4.5**.
      *   **Rounding:** "Use whole beans. 5 on B1 (4 Red, 1 Blue). 5 on B2 (1 Red, 4 Blue)."
      *   *Facilitator Note:* This rounding introduces small noise, but the effect size later is large enough to survive it.

  #### 0:10 – 0:30 | Phase 1: The Comfortable Case (Hard Evidence)
  *   **Scenario:** "I draw a bead from the bag. It is **Red**. I show it to you."
  *   **Action:** Participants update their beans based on this fact.
  *   **Logic:** If Bead is Red, it must be B1-Red or B2-Red. All Blue beans are removed. Renormalize.
      *   Prior: 4 B1R, 1 B2R. Total 5 Red beans.
      *   New: B1R gets 4/5 of total (8 beans). B2R gets 1/5 of total (2 beans).
  *   **Discussion:** "Did anyone struggle? Did the order matter if I told you 'It's not Blue' then 'It's Red'? No. The arithmetic forces you. This is conditioning."
  *   **Reset:** Return to Prior (5 B1, 5 B2).

  #### 0:30 – 0:50 | Phase 2: The Nudge (Soft Evidence - Source)
  *   **Scenario:** "I do not draw a bead. I turn on the Lamp. It is **Dim**."
  *   **Instruction:** "In the past, when the lamp is Dim, Bag 1 is the case 80% of the time. I am not telling you it *is* Bag 1. I am telling you: **Your confidence in Bag 1 is now 80%.**"
  *   **Constraint:** "You must move your beans so 8 are on Bag 1, 2 are on Bag 2. **Do not change the ratio of Red to Blue inside each Bag.** Keep the internal odds fixed."
  *   **Action:**
      *   Bag 1 (8 beans): Keep 4:1 ratio. $\rightarrow$ **6 Red, 2 Blue**. (Rounded from 6.4/1.6).
      *   Bag 2 (2 beans): Keep 1:4 ratio. $\rightarrow$ **0 Red, 2 Blue**. (Rounded from 0.4/1.6).
      *   *Total State:* 6 Red, 4 Blue.
  *   **Commitment:** Participants lock their beans. No talking.

  #### 0:50 – 1:10 | Phase 3: The Second Nudge (Soft Evidence - Color)
  *   **Split the Room:**
      *   **Group A (Left):** "You receive a second signal. The bead feels **Smooth**. Smooth beads are Red 80% of the time. **Your confidence in Red is now 80%.** Preserve the ratio of Bag 1 to Bag 2 *inside* the Red pile and *inside* the Blue pile."
      *   **Group B (Right):** "Ignore the Lamp. You only get the Smooth signal. **Your confidence in Red is now 80%.**" (Wait, this doesn't test order).
      *   **Correction for Order Test:**
          *   **Group A (Source First):** You are currently in the "Lamp Dim" state (8 B1, 2 B2). Now apply the "Smooth" nudge (8 Red, 2 Blue).
          *   **Group B (Color First):** Reset to Prior. Apply "Smooth" nudge first (8 Red, 2 Blue). Then apply "Lamp Dim" nudge (8 B1, 2 B2).
  *   **Instruction:** "Move your beans to match the new confidence. Preserve internal ratios. Commit your numbers."
  *   **Facilitator Check:**
      *   **Group A (Source $\rightarrow$ Color):**
          *   Current: 6 B1R, 2 B1B, 0 B2R, 2 B2B. (Total 6R, 4B).
          *   Target: 8 Red, 2 Blue.
          *   Preserve $P(B1|R)$: Currently 6/6 = 100%. New Red (8) $\rightarrow$ **8 B1R, 0 B2R**.
          *   Preserve $P(B1|B)$: Currently 2/4 = 50%. New Blue (2) $\rightarrow$ **1 B1B, 1 B2B**.
          *   **Final State A:** B1=9, B2=1. **Joint (B2, Red) = 0.**
      *   **Group B (Color $\rightarrow$ Source):**
          *   Start Prior: 4 B1R, 1 B1B, 1 B2R, 4 B2B. (Total 5R, 5B).
          *   Step 1 (Color 80%): Target 8 Red, 2 Blue.
              *   Preserve $P(B1|R) = 4/5$. New Red (8) $\rightarrow$ 6.4 B1R, 1.6 B2R $\rightarrow$ **6 B1R, 2 B2R**.
              *   Preserve $P(B1|B) = 1/5$. New Blue (2) $\rightarrow$ 0.4 B1B, 1.6 B2B $\rightarrow$ **0 B1B, 2 B2B**.
          *   Step 2 (Source 80%): Target 8 Bag 1, 2 Bag 2.
              *   Current B1=6, B2=4.
              *   Preserve $P(R|B1) = 6/6 = 100\%$. New B1 (8) $\rightarrow$ **8 B1R, 0 B1B**.
              *   Preserve $P(R|B2) = 2/4 = 50\%$. New B2 (2) $\rightarrow$ **1 B2R, 1 B2B**.
          *   **Final State B:** B1=8, B2=2. **Joint (B2, Red) = 1.**
  *   **The Discrepancy:** Group A has **zero** beans on "Bag 2, Red". Group B has **one** bean on "Bag 2, Red".

  #### 1:10 – 1:20 | The Reveal & Scoring
  *   **Action:** Draw one card from the "Truth Deck".
      *   *Crucial:* You need a deck weighted to the *Prior* (5 B1R, 1 B1B, 1 B2R, 5 B2B) OR simply pick one that highlights the discrepancy.
      *   *Better:* Pick **Bag 2, Red**. (It is possible in reality, as Bag 2 has 2 Red beads).
  *   **Scoring:**
      *   **Group A:** Beans on Winner (B2R) = 0. **Score = 0 Tickets.**
      *   **Group B:** Beans on Winner (B2R) = 1. **Score = 1.9 Tickets.**
  *   **Observation:** "Group B did better. Why? They didn't know more. They just processed the nudges in a different order."

  #### 1:20 – 1:30 | Debrief (The "No Formula" Discussion)
  *   **Ask:** "Why did Group A rule out a possibility that Group B kept open?"
  *   **Guide them to:** "When Group A updated the Bag first, they made Red and Bag 1 perfectly linked (6 out of 6 Red were Bag 1). When they later updated Color, they couldn't break that link without violating the 'preserve internal ratios' rule."
  *   **The Lesson:** "The rule 'preserve internal ratios' is a choice. It assumes the nudge tells you nothing about the *inside* of the case. But in real life, a nudge about the Bag *might* tell you something about the Bead. The rule doesn't know that. You have to decide if the rule applies."
  *   **Closing:** "The advice 'condition on what you learned' works when you learn a fact. When you only learn a leaning, you have to choose a policy for how that leaning spreads. That policy can fail."

  ---

  ### Predicted Failure Modes & Responses

  **1. The "It Was Really a Signal" Objection**
  *   *Participant:* "The lamp being dim *is* a fact. You should have given us the likelihoods $P(\text{Dim}|B1)$ and let us do Bayes."
  *   *Response:* "I could have. But often in life, you don't know the reliability of the instrument. You just know 'I feel 80% sure now.' I forced that situation to show what happens when you *only* have the confidence shift, not the mechanism."

  **2. The "Refusal to Commit" Objection**
  *   *Participant:* "I won't move the beans. 80% is arbitrary."
  *   *Response:* "That is a valid choice. But if you don't commit, you can't win the prize. The game requires a position. In life, inaction is also a position." (Allow them to sit out scoring).

  **3. The "You Rigged the Truth" Objection**
  *   *Participant:* "You picked Bag 2 Red just to make Group A look bad."
  *   *Response:* "I did pick it to illustrate the point, yes. But Bag 2 Red is a real possibility (there are red beads in Bag 2). Group A assigned it probability zero. That is the danger of the 'natural repair': it can create blind spots. If the truth had been Bag 1 Red, Group A would have won. It's a risk."

  **4. The "Clever Contrarian"**
  *   *Participant:* "This only happens because you used different partitions. If you updated Bag twice, order wouldn't matter."
  *   *Response:* "Exactly. That is the insight. The 'natural repair' is safe only when the new information fits neatly into the boxes you already have. When the new information cuts across the boxes (Source vs. Color), the repair breaks. Most real news cuts across our boxes."

  ### Facilitator's Cheat Sheet (For the Room)

  **Do Not Say:** "Jeffrey Conditioning," "Partition," "Rigidity," "Commutativity."
  **Do Say:** "The Natural Repair," "Categories," "Preserving the Inside," "Order Matters."

  **The Lookup Card (Print Two Copies)**
  *Count beans on the **Winning** Square.*
  *   10 beans $\rightarrow$ 10 tickets
  *   9 beans $\rightarrow$ 9.9 tickets
  *   8 beans $\rightarrow$ 9.6 tickets
  *   7 beans $\rightarrow$ 9.1 tickets
  *   6 beans $\rightarrow$ 8.4 tickets
  *   5 beans $\rightarrow$ 7.5 tickets
  *   4 beans $\rightarrow$ 6.4 tickets
  *   3 beans $\rightarrow$ 5.1 tickets
  *   2 beans $\rightarrow$ 3.6 tickets
  *   1 bean $\rightarrow$ 1.9 tickets
  *   0 beans $\rightarrow$ 0 tickets

  **Cutting for Time:**
  *   If running late, skip the Phase 1 (Hard Evidence) discussion. Move straight from Prior to Nudge 1.
  *   If scoring takes too long, have participants self-report their "Beans on Winner" number to the Helper.

  **Final Truth for You:**
  You are teaching them that **probability is not just calculation; it is architecture.** When the ground shifts (soft evidence), you must decide how to rebuild the house. There is no single law of physics that tells you how to rebuild. There is only the structural integrity of your choice.
