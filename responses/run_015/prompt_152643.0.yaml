      *   *Solution:* Order matters in Jeffrey Conditioning if the updates are on *different* partitions. (Diaconis & Zabell, 1982). Alternatively, if the "nudge" is treated as a *likelihood ratio* on a specific observation $E$ (where $P(E)$ is not 0 or 1), this is equivalent to Bayesian conditioning on $E$. But the user wants to avoid "learning a fact."
