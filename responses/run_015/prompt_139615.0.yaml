answer: |-
  **OFFICE OF REVEALED WELFARE (ORW)**
  **INTERNAL GUIDANCE MEMORANDUM**
  **REF:** ORW/GRP/742/B
  **TO:** All Regional Caseworkers
  **SUBJECT:** Operationalising Welfare Metrics via Choice Data

  **1. Preamble**
  Caseworkers are reminded that welfare is not a sensation but a relation. Per the Foundational Axioms of the Office, utility is ordinal and defined exclusively by selection from the feasible set. Internal states, such as 'satisfaction', 'hunger', or 'distress', are unobservable and therefore non-existent for assessment purposes. The following protocols ensure compliance with strict revealed preference doctrine. Enquiry into subjective wellbeing is prohibited as it implies a metric outside of choice behaviour.

  **2. Protocols for Assessment**

  **2.1 Reduction of Feasible Sets**
  Where policy constraints remove options from a claimant's menu (e.g., benefit caps or programme closures), this constitutes an efficiency saving with no welfare cost. If a claimant previously selected Option B from {A, B}, and Option A is subsequently removed by the Office, the claimant continues to select B. Their welfare is unchanged. Do not log distress regarding lost options; the chosen bundle remains revealed-preferred to all remaining alternatives. The contraction of the budget set does not alter the ranking of the selected item.

  **2.2 Altruistic Constraints**
  Where a claimant selects a smaller ration to preserve resources for dependents, this is not sacrifice. It is a revealed preference for the smaller portion within the constrained budget. Record the choice as 'Preferred Quantity'. Do not infer hardship from quantity reduction; the utility function captures the choice, not the caloric intake. If they chose less, they preferred less, ceteris paribus.

  **2.3 Intransitivity and WARP**
  Claimants whose choices cycle (e.g., preferring A to B, B to C, but C to A when menus shift) have failed the Weak Axiom of Revealed Preference (WARP). Such individuals possess no coherent preference ordering. Consequently, they have no assessable needs, as needs presuppose a stable utility function. Flag file as 'Incoherent Agent' and suspend support pending rationalisation of behaviour.

  **2.4 Interpersonal Comparisons**
  Utility is defined only up to a positive affine transformation. Therefore, Claimant A's gain cannot be weighed against Claimant B's loss. All observed choices imply non-negative utility shifts relative to the previous feasible set. Log all outcomes as 'Welfare Neutral or Positive'. Aggregation is mathematically impermissible. No claimant can be deemed 'worse off' than another, only different in their revealed rankings.

  **2.5 Appeals Process**
  Submission of Form ORW-44b (Notice of Dissent) alters the claimant's feasible set by introducing a new administrative action. Consequently, the act of appealing reveals a new preference distinct from the original decision period. The appeal cannot validate or invalidate the original decision, as the choice sets are non-identical. Process the form, but maintain the original assessment stands. The choice to appeal reveals a preference for appealing, not an error in the initial allocation.

  **3. Conduct**
  Caseworkers must not enquire into satisfaction. Satisfaction is redundant to choice. If they chose it, they wanted it. If they wanted it, they are better off. Any suggestion that a claimant 'had no choice' is theoretically void; existence within the feasible set implies choice.

  **Signed,**
  **Directorate of Rational Choice Architecture**
  **Office of Revealed Welfare**
