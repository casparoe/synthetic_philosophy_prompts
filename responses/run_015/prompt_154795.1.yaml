prompt: |-
  I run the grants side of a small health-research foundation — two rounds a year, ~150 applications each, every one read by 4–6 external reviewers who fill in a score sheet, and then a panel of five of us meets on Zoom for about fifteen minutes per application to make a yes/no call. Reviewers are volunteers so I can't just keep adding more of them, I've got no statistician on staff, the panel chair has to be able to sign off on whatever we do, and anything I change has to be explainable to our board in plain english and fit in a spreadsheet. I also can't spend more than a couple of hours per round messing with process.

  The thing I keep coming back to is the Condorcet jury theorem — the bit about a lot of imperfect-but-better-than-chance voters beating one careful one, and the nasty flip side where if each voter is worse than chance then adding more of them makes the group worse, not better. I want that turned into something I can actually run, not just admire.

  So: write me a decision procedure. The questions to ask in order (some once per round when I set the process up, some per application when the panel is stuck), what counts as a good enough answer to each, where the procedure just stops with a no, and where it hands the decision over to a person because the disagreement is about what we value rather than about what's true.

  It has to settle at least these:

  - How many reviewers, and when adding one more reviewer is worth it versus spending the same effort on making reviews better-informed (paying a second reader from the *other* field, or a fifteen-minute call with the applicant to clear something up).
  - Whether reviewers should see each other's draft reviews before scoring. I have a feeling sharing helps them catch real problems but wrecks the independence the theorem wants, and I have no idea how to tell which effect is bigger. Someone told me that once reviewers' errors are correlated, accuracy stops climbing and flattens out somewhere short of certainty no matter how many people you pile on — if that's even roughly right, tell me what I'm supposed to *do* with it.
  - Our panel discusses first and then votes. Should each of us write down a private vote before anyone talks?
  - What threshold: simple majority, two-thirds, unanimity, or our current unwritten rule that one "strong reject" kills an application even when the other four are enthusiastic (people are scared of being the one who waved through a dud). I suspect the veto rule is just a very high threshold wearing a disguise, and I want to know what it's costing us and what would be better.
  - Reviewers score three separate things — importance, methods, feasibility — and then we aggregate. I've noticed the panel can be majority-yes on each of the three and majority-no overall, or the other way round. Should we vote on the criteria and combine, or vote on the overall call? Which is less likely to be wrong?
  - What to do when the split is factual versus when it's about risk appetite (a safe boring project versus a long shot), and when the right move is to hand the decision to one named person instead of the group.
  - Some estimate of our reviewers' actual accuracy. We have outcome data for funded projects, obviously not for rejected ones; the only rejected applications we can check are about twenty that got picked up by another funder and we can see how they did. Tell me honestly what I can and cannot infer from that, and what to do when I can't get a number at all.

  Then apply the whole thing to three cases: (1) a solid, unexciting application that everybody mildly likes; (2) an interdisciplinary application where all our reviewers sit on one side of the discipline and I genuinely worry their accuracy on it is below chance; (3) an application where two reviewers say the statistical plan is fine and three say it's broken, and nobody can settle it without seeing the raw data.

  Please be straight about which steps are really just my judgement dressed up as procedure, and which parts of the theorem I'm quietly violating. And give me at least one worked case where the honest output of the procedure is something I won't like — ideally something our board would probably refuse to approve — and say what you'd do then. And please don't give me a reading list or footnotes; I want the reasoning, not pointers to papers I can't get to.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the User and Context:**
      *   **Role:** Grants manager at a small health-research foundation.
      *   **Scale:** 2 rounds/year, ~150 apps/round.
      *   **Process:** 4-6 external reviewers per app (volunteers), 5-person internal panel (Zoom, 15 mins/app).
      *   **Constraints:** No statistician, limited time (couple of hours/round to tweak process), must be explainable to the board in plain English, must fit in a spreadsheet.
      *   **Core Concern:** Condorcet Jury Theorem (CJT). Wants to leverage the "wisdom of crowds" but avoid the "wisdom of mobs" (correlated errors/bias < 50% accuracy).
      *   **Specific Questions:** Reviewer count vs. quality, independence vs. discussion, private vs. public voting, thresholds (veto vs. majority), criteria aggregation (sum vs. holistic), factual vs. value disagreements, estimating accuracy with limited data.
      *   **Tone:** Practical, direct, no fluff/footnotes, honest about limitations.
      *   **Requirement:** A concrete decision procedure + application to 3 cases + one "unpleasant but honest" outcome.

  2.  **Deconstruct the Condorcet Jury Theorem (CJT) for this Context:**
      *   *Premise:* If $p > 0.5$ (individual accuracy), adding voters increases group accuracy toward 1. If $p < 0.5$, adding voters decreases group accuracy toward 0.
      *   *Constraint:* Independence. If voters copy each other or share the same bias, $N$ effective voters drops.
      *   *Reality Check:* In grant review, $p$ is rarely known and rarely constant. Reviewers aren't voting on true/false facts; they are predicting future success (noisy) and judging value (subjective).
      *   *Implication:* The user needs to maximize $p$ (competence) and minimize correlation (independence) before maximizing $N$ (count).

  3.  **Drafting the Decision Procedure (Step-by-Step):**

      *   *Phase 1: Setup (Once per round).*
          *   Need to estimate $p$. Since we can't know true $p$ for rejected grants, we use the "funded success rate" and "rescued grant rate" as proxies.
          *   Need to define "Competence." If reviewers are out of their depth (Case 2), $p < 0.5$.
          *   Need to define "Independence."

      *   *Phase 2: Reviewer Configuration.*
          *   Count vs. Quality. CJT says if $p$ is low, more people hurt. So, prioritize raising $p$ (better briefings, specific questions) over adding $N$ if $N$ is already 4-6.
          *   Independence. Seeing drafts creates correlation. Bad for CJT. Good for catching errors? Maybe. But correlation kills the math. Recommendation: Blind reviews first, discussion later.

      *   *Phase 3: Panel Voting.*
          *   Private vs. Public. Anchoring bias is real. Private vote first preserves independence.
          *   Thresholds. Veto rules (1 reject kills) assume false positives are catastrophic. But CJT suggests majority is usually more accurate *if* $p > 0.5$. A veto rule effectively requires $p$ to be near 1 for the "rejector." Recommendation: Move away from veto unless safety/ethics are involved. Use 3/5 or 4/5.
          *   Criteria. Summing scores (Importance + Methods + Feasibility) assumes linearity. A fatal flaw in Methods should outweigh high Importance. Recommendation: Weighted or "Gatekeeper" criteria (Methods must pass threshold).

      *   *Phase 4: Disagreement Resolution.*
          *   Factual (Is the math right?) vs. Value (Is this risk worth it?).
          *   Factual: Need expertise, not voting. If panel lacks it, defer or seek external arbiter.
          *   Value: Chair decides or majority rules.

      *   *Phase 5: Accuracy Estimation.*
          *   Funded success rate = Lower bound of $p$ (since we pre-screened).
          *   Rescued grants = True Positive Rate proxy.
          *   Cannot know False Negative rate (the good ones we rejected). Acknowledge this limitation.

  4.  **Addressing the Specific Questions (incorporating into the procedure):**

      *   *Reviewers:* 4-6 is usually enough *if* independent. Adding more yields diminishing returns. Better to pay one expert to clarify a specific doubt than add a generic 7th reviewer.
      *   *Sharing Drafts:* Don't do it before scoring. It correlates errors. Do it after scoring for discussion.
      *   *Panel Vote:* Private written vote *before* discussion.
      *   *Threshold:* Abolish the "one strong reject kills" rule. It assumes the rejector is infallible ($p=1$). They aren't. Use 3 out of 5 (Majority) for standard, 4 out of 5 for high risk.
      *   *Criteria:* Vote on "Fatal Flaws" first (Methods/Feasibility), then "Merit" (Importance). If Methods fail, stop.
      *   *Factual vs. Value:* If it's about stats (factual) and panel is split, it's a "Unknown." Don't guess. Mark as "Needs External Stats Check." If it's risk (value), Chair decides.
      *   *Accuracy:* Be honest. You can't calculate true accuracy. Use funded success as a health check. If funded projects fail, $p$ is low. Stop adding reviewers, fix the rubric.

  5.  **Developing the Three Cases:**

      *   *Case 1 (Solid/Boring):* High agreement. CJT works well here. Majority vote. Fund.
      *   *Case 2 (Interdisciplinary/Out of Depth):* This is the $p < 0.5$ danger zone. CJT says *reduce* the group or override. Action: Flag as "Out of Competence." Do not vote. Send to ad-hoc expert or Chair decides based on "potential" rather than "technical validity."
      *   *Case 3 (Stats Dispute):* Factual disagreement. Panel is split 2 vs 3. This isn't a value judgment; it's a truth claim. Voting won't solve it. Action: Pause. Get a stats consultant (even if it costs time/money). If impossible, default to "No" because funding broken stats is waste, but document the reason as "Unresolved Technical Risk," not "Low Merit."

  6.  **The "Unpleasant Outcome" (The Honest Truth):**
      *   Scenario: A popular project, Chair loves it, but the procedure says "No" because of the $p < 0.5$ rule or the Fatal Flaw rule.
      *   Specifically: The "Rescued Grant" data shows that when reviewers are lukewarm (3/5), the grant often succeeds elsewhere. But the procedure says "Majority Yes required."
      *   Better Unpleasant Truth: The procedure might dictate *rejecting* a grant that the Board loves because the reviewers were out of their depth (Case 2), and the procedure forces a "No" when competence is low. OR, the procedure dictates *funding* a risky grant because the "Veto" rule was removed, and it fails.
      *   Let's go with the "Veto" removal. The Board likes safety. The math says the Veto rule rejects too many good grants (False Negatives). The procedure says "Fund despite one strong reject." The Board will hate the risk.
      *   *Alternative:* The "Out of Depth" case. The procedure says "Do not vote, automatic reject or refer." If you refer, it costs money/time. If you reject, you lose innovation. Let's make the unpleasant output: **"Automatic Reject."** Why? Because if $p < 0.5$ (reviewers don't understand the science), CJT says adding more opinions makes the decision *worse* than a coin flip. The only safe mathematical move is to not trust the score. If you can't get an expert, you must reject to preserve capital. The Board will hate rejecting something that looks shiny but is incomprehensible to the panel.

  7.  **Refining the Tone:**
      *   No academic jargon.
      *   Direct instructions ("Do this," "Don't do that").
      *   Acknowledge where the math breaks (human judgment).
      *   Spreadsheet friendly.

  8.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I answer the "sharing drafts" question? Yes, advised against it before scoring.
      *   *Check:* Did I address the "one strong reject" rule? Yes, advised removing it.
      *   *Check:* Is the accuracy estimation honest? Yes, admitted we can't know false negatives.
      *   *Check:* Is the "Unpleasant Outcome" clear? Yes, will highlight the "Incompetence Reject."
      *   *Check:* Time limit? The procedure needs to be simple enough to set up in 2 hours. Keep the rubric simple.

  9.  **Final Polish:** Organize into "The Setup," "The Workflow," "The Three Cases," and "The Unpleasant Truth." Ensure the distinction between "Fact" and "Value" is sharp. (Self-correction: Make sure to explicitly mention where I'm violating CJT—mostly in the "Value" judgments, as CJT applies to binary truth, not subjective preference).

  10. (Final thought on the "Unpleasant Outcome"): The most mathematically sound but politically difficult outcome is rejecting a grant where the reviewers admit they don't understand it. Most boards say "Well, trust the PI." CJT says "If voters are worse than chance, more voters = worse decision." So if the panel admits ignorance, the procedure must say "No." That's the hard pill.

  Let's write it.cw
answer: |-
  Here is a decision procedure designed for your constraints. It leans on the Condorcet Jury Theorem (CJT) where math helps, and switches to explicit authority where math fails.

  ### Part 1: The Setup (Once Per Round)

  **1. Estimate Reviewer Competence ($p$)**
  You cannot know the true accuracy of your reviewers because you don't see the outcomes of rejected grants. However, you can monitor the *direction* of your accuracy.
  *   **The Metric:** Track the success rate of the ~20 "rescued" grants (rejected by you, funded elsewhere) per round.
  *   **The Rule:** If >50% of rescued grants are reported as "successful/completed" by the other funder, your reviewers are likely worse than chance ($p < 0.5$) on those types of applications.
  *   **The Action:** If this happens, do not add more reviewers. CJT dictates that if $p < 0.5$, adding voters drives group accuracy toward zero. Instead, change the reviewer pool or simplify the rubric.
  *   **The Limit:** You cannot calculate your False Negative rate (the good ones you killed). Accept this. You are optimizing for "not funding disasters" rather than "funding every winner."

  **2. Reviewer Count vs. Quality**
  *   **The Rule:** Stick with 4–6 reviewers.
  *   **The Math:** With independent voters at $p=0.6$ (60% accurate), 5 voters give you ~68% group accuracy. 7 voters give you ~71%. The gain is small.
  *   **The Trade:** Spend the effort on *raising $p$*, not increasing $N$. Paying one expert to clarify a specific technical doubt (e.g., a statistician for 30 minutes) raises $p$ for the whole panel more than adding a 7th generalist reviewer.
  *   **Spreadsheet Column:** `Reviewer_Count` (Lock at 5). `Expert_Topup` (Yes/No).

  **3. Independence (The Draft Review Problem)**
  *   **The Rule:** Reviewers must **not** see each other's drafts before submitting scores.
  *   **The Math:** CJT requires independent errors. If Reviewer B reads Reviewer A's critique, their errors become correlated. If A is wrong, B is likely wrong too. This flattens the accuracy curve.
  *   **The Compromise:** Allow reviewers to see *aggregate* scores (e.g., "The group average for Feasibility is low") only *after* they submit their own. This signals a problem without biasing their specific reasoning.
  *   **Spreadsheet Column:** `Blind_Review` (Yes/No).

  ---

  ### Part 2: The Workflow (Per Application)

  **4. Panel Voting Protocol**
  *   **The Rule:** Private Vote $\rightarrow$ Discussion $\rightarrow$ Public Vote.
  *   **Why:** If you discuss first, the Chair or the loudest voice anchors the group. This violates independence.
  *   **Procedure:**
      1.  Panelists read summaries.
      2.  Panelists enter a private `Initial_Vote` (Yes/No) in the spreadsheet.
      3.  Zoom discussion opens.
      4.  Panelists enter `Final_Vote`.
  *   **The Check:** If `Initial_Vote` variance is zero (everyone agreed immediately), skip discussion. Save time.

  **5. The Threshold (Abolish the Veto)**
  *   **The Rule:** One "Strong Reject" does **not** kill an application.
  *   **The Math:** A veto rule assumes the single rejector has $p=1.0$ (infallible). They are not. A veto rule drastically increases False Negatives (killing good projects).
  *   **New Threshold:**
      *   **Standard Grants:** 3 out of 5 Yes votes (Simple Majority).
      *   **High Risk/High Cost:** 4 out of 5 Yes votes.
  *   **The Exception:** A veto is only valid if the reason is **Ethical/Safety** or **Fatal Technical Flaw** (e.g., "The math is impossible"). This must be flagged as `Fatal_Flaw` in the spreadsheet. If `Fatal_Flaw` = Yes, the app dies regardless of vote.

  **6. Criteria Aggregation (Sum vs. Holistic)**
  *   **The Problem:** You noted the "Majority-Yes on parts, Majority-No on whole" paradox. This happens because criteria are not linear. A beautiful method on an unimportant question is still a waste of money.
  *   **The Rule:** Sequential Gatekeeping.
      1.  **Vote on Feasibility/Methods first.** If Majority = No, stop. Application Rejected. (You cannot fix a broken car with a good driver).
      2.  **Vote on Importance.** If Majority = No, stop. Application Rejected.
      3.  **Vote on Overall Funding.**
  *   **Why:** This prevents "halo effects" where a sexy topic masks broken methods.
  *   **Spreadsheet:** Three columns: `Vote_Methods`, `Vote_Importance`, `Vote_Fund`. All must be Yes to Fund.

  **7. Factual vs. Value Disagreements**
  *   **The Test:** Ask, "Could this be settled by looking at data?"
      *   **Yes (Factual):** e.g., "Is the sample size calculation correct?"
      *   **No (Value):** e.g., "Is this risk worth taking?"
  *   **The Procedure:**
      *   **If Factual & Disputed:** Do not vote. The group is not an expert. Mark as `Technical_Query`. If you cannot resolve it with a quick expert consult, default to **No**. Funding a factual error is waste; funding a value risk is strategy.
      *   **If Value & Disputed:** The Chair decides. This is not a truth problem; it is a leadership problem. The Chair's job is to set risk appetite.

  ---

  ### Part 3: Applying the Procedure to Your Three Cases

  **Case 1: The Solid, Unexciting Application**
  *   **Situation:** Everyone mildly likes it. Scores are 3/5 or 4/5. No strong feelings.
  *   **Procedure Output:**
      *   `Vote_Methods`: Yes.
      *   `Vote_Importance`: Yes (barely).
      *   `Initial_Vote`: 3 Yes, 2 No (or 4 Yes, 1 Abstain).
      *   **Decision:** **Fund.**
  *   **Reasoning:** CJT works best here. Errors are random, $p > 0.5$. The majority is likely right. The "boring" nature is a value judgment, not a factual error.
  *   **Risk:** You fund a mediocre project.
  *   **Mitigation:** Accept this. A portfolio needs safe bets to ensure you have *any* successes to show the board.

  **Case 2: The Interdisciplinary Application (Reviewers Out of Depth)**
  *   **Situation:** All 5 reviewers are from Field A. The app is Field A + Field B. Reviewers admit they don't understand Field B.
  *   **Procedure Output:** **Reject (Automatic).**
  *   **Reasoning:** This is the CJT danger zone. If reviewers admit they don't understand the science, their accuracy $p$ drops below 0.5 (they are guessing). CJT proves that if $p < 0.5$, adding more voters makes the decision *worse* than a coin flip.
  *   **Action:** You cannot vote on truth if you cannot read the language. Unless you can pay an external Field B expert for a 15-minute consult *before* the meeting, you must reject to preserve capital.
  *   **Board Explanation:** "We rejected this because we lacked the competence to validate it. Funding it would be gambling, not grant-making."

  **Case 3: The Statistical Dispute (2 Say Fine, 3 Say Broken)**
  *   **Situation:** Factual disagreement. No raw data available to check.
  *   **Procedure Output:** **Reject.**
  *   **Reasoning:** This is a `Technical_Query`. It is a factual dispute (is the math right?), not a value dispute. The panel is split. We cannot resolve the fact.
  *   **Rule:** In the absence of evidence, default to "No." It is easier to reject a good project due to uncertainty than to fund a broken one.
  *   **Exception:** If the Chair has statistical expertise, they override. If not, the "No" stands.

  ---

  ### Part 4: Where I Am Violating the Theorem (And Why)

  1.  **Binary Truth vs. Subjective Value:** CJT applies to questions with a right answer (e.g., "Is this defendant guilty?"). Grant funding is often "Is this worth doing?" There is no objective truth.
      *   *Violation:* I am treating "Methods" as factual (CJT applies) and "Importance" as value (CJT does not apply).
      *   *Fix:* I assigned the tie-break on Value to the Chair, not the vote.
  2.  **Competence Homogeneity:** CJT assumes all voters have roughly similar $p$. In reality, your senior reviewers have higher $p$ than junior ones.
      *   *Violation:* I am using a simple majority (1 person = 1 vote).
      *   *Fix:* I introduced the `Fatal_Flaw` flag. A senior expert spotting a fatal error overrides the majority. This is a weighted vote disguised as a rule.
  3.  **Independence:** You want reviewers to learn from each other.
      *   *Violation:* I banned sharing drafts before scoring.
      *   *Fix:* I allowed discussion *after* the private vote. This captures the "wisdom of crowds" for the vote, and the "deliberative benefit" for the rationale, without corrupting the initial signal.

  ---

  ### Part 5: The Unpleasant Outcome (The Honest Truth)

  **The Scenario:**
  A high-profile applicant (a friend of a Board member) submits a project in a new, trendy field (e.g., AI in Health).
  *   **Reviewers:** 5 traditional epidemiologists.
  *   **Scores:** They are confused. They rate Methods as "Unclear."
  *   **Board Pressure:** The Board wants to look innovative. They want this funded.
  *   **Procedure Output:** **Reject.**
      *   Reason: `Competence_Limit`. Reviewers are out of depth ($p < 0.5$).
      *   Reason: `Technical_Query`. Methods are unclear, default to No.

  **Why the Board Will Hate It:**
  They will say, "You are stifling innovation! You are just a club of old guard rejecting the future!" They will point to the "Rescued Grants" data and say, "What if this gets funded by NIH and succeeds?"

  **What To Do:**
  1.  **Show the Math:** Show them the CJT logic. "If our experts admit they don't understand the engine, we cannot bet the car. If we fund it, we are not evaluating; we are lottery-playing."
  2.  **The Compromise:** Offer a **Planning Grant** (10% of the budget).
      *   This bypasses the "Fatal Flaw" rule because the risk is capped.
      *   It satisfies the Board's desire to be "involved."
      *   It generates data so next year you can evaluate with $p > 0.5$.
  3.  **The Hard Line:** If they demand the full grant despite the procedure:
      *   Record the decision as **"Board Override."**
      *   Do not let the Panel take the blame.
      *   If the project fails, the data belongs to the Board's risk appetite, not the review process. This protects the integrity of your procedure for the other 149 applications.

  ### Summary Checklist for Your Spreadsheet

  1.  `Blind_Review_Complete` (Y/N)
  2.  `Vote_Methods` (Pass/Fail) -> If Fail, Stop.
  3.  `Vote_Importance` (Pass/Fail) -> If Fail, Stop.
  4.  `Technical_Query_Raised` (Y/N) -> If Y, Default No unless resolved.
  5.  `Initial_Vote_Count` (0-5)
  6.  `Final_Vote_Count` (0-5) -> Need 3 to Fund.
  7.  `Fatal_Flaw_Flag` (Y/N) -> If Y, Auto Reject.
  8.  `Decision_Reason` (Select: Majority, Chair_Override, Board_Override, Competence_Limit).

  This fits in your time limit, respects the math where it works, and hands the hot potato to the humans where the math breaks.
