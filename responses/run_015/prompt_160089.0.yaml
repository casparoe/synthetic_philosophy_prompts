answer: |-
  This specification outlines the conditions any adequate adjudication method must meet to resolve the conflict between the archival record (the "Ledger") and the community memory (the "Testimony"). It is designed not to tell you what to decide, but to tell you what your decision-making process must account for to be considered valid.

  The desiderata are divided into **Non-Negotiable (NN)** conditions, which render an adjudication method invalid if unmet, and **Preferences (P)**, which indicate a weighting toward one ethical framework over another.

  ### I. The Desiderata

  **1. The Provenance Condition (NN)**
  *   **Requirement:** An archival document cannot serve as independent corroboration of a transaction if the author of the document is the same entity accused of coercion in the Testimony.
  *   **Motivation:** This addresses your distinction between a record's silence and a record's self-interest. A ledger produced by the city/county to justify a buyout is a performative act of administration, not a neutral observation. It proves the *administration* occurred, not the *volition* of the sellers.
  *   **What it rules out:** It rules out using the Ledger to disprove the Testimony. It does not necessarily rule out the Ledger as evidence of the *state's intent* or *bureaucratic process*, but it strips the Ledger of its authority to validate the "compensated" nature of the exchange.
  *   **Domain:** Primarily Evidentiary.

  **2. The Granularity Distinction (P)**
  *   **Requirement:** The adjudication must distinguish between errors of *detail* (dates, specific sums, names) and errors of *shape* (voluntary vs. forced, peaceful vs. armed).
  *   **Motivation:** Memory often degrades on detail over three generations but retains the moral shape of the trauma. Archives retain detail but often obscure the shape through bureaucratic euphemism (e.g., "ordinance" vs. "removal").
  *   **Weighting:** This is a preference for the **Testimony** on questions of *shape* (character of the event) and a preference for the **Ledger** on questions of *detail* (provided the Provenance Condition is met for other documents).
  *   **Domain:** Evidentiary and Commemorative.

  **3. The Constitutive Condition (NN)**
  *   **Requirement:** The adjudication must acknowledge that the Testimony functions not only as a claim about the past but as a practice that constitutes the present community.
  *   **Motivation:** This addresses your distinction between memory as testimony vs. memory as practice. Overriding the Testimony is not merely correcting a factual error; it is an act of symbolic exclusion that damages the social fabric of the descendants' association in the present.
  *   **What it rules out:** Any method that treats the descendants' account solely as a hypothesis to be falsified without weighing the social cost of that falsification to the living group.
  *   **Domain:** Commemorative.

  **4. The Asymmetry of Harm (NN)**
  *   **Requirement:** The adjudication must treat the two directions of error as morally asymmetric.
  *   **Motivation:** You asked whether overriding a true memory is symmetric to preserving a false one. It is not.
      *   *Error A (Overriding Truth):* If the removal was armed and the panel declares it a sale, the panel replicates the original violence epistemically. It tells the descendants their trauma is a lie. This is a re-injury.
      *   *Error B (Preserving Falsehood):* If the removal was a sale and the panel declares it armed, the panel commits a historical error and potentially grants unearned moral capital. This is a mistake, but not a re-injury of the original wound.
      *   *Argument:* In contexts of state violence, the cost of Error A (silencing the victim) exceeds the cost of Error B (misidentifying the mechanism of loss). The first perpetuates the power dynamic of 1919; the second merely distorts the historical record.
  *   **Domain:** Reparative and Commemorative.

  **5. The Independence Threshold (NN)**
  *   **Requirement:** A factual finding requires at least one piece of evidence independent of both the Accuser (City/County) and the Accused (Descendants).
  *   **Motivation:** To prevent the process from devolving into a "he said/she said" where power dictates truth. If the Ledger is disqualified by Provenance, and the Testimony is disputed by the Ledger, third-party evidence (e.g., private diaries, newspaper reports from non-city sources, church records) is required for a definitive Evidentiary Finding.
  *   **Domain:** Evidentiary.

  ---

  ### II. Incompatibilities and Tensions

  You asked to flag pairs of desiderata that cannot be jointly satisfied. There is one critical tension that may make the list as a whole unsatisfiable in practice.

  **The Evidentiary Vacuum (Tension between #1 and #5)**
  *   **The Conflict:** The **Provenance Condition (#1)** disqualifies the Ledger as corroboration of voluntariness. The **Independence Threshold (#5)** requires independent evidence for a factual finding. In many cases of historical administrative removal, *no independent evidence exists*. The state was the only record-keeper.
  *   **The Result:** If you enforce both NN conditions, you may be unable to issue a definitive **Factual Finding**. You cannot say "It was a buyout" (Ledger disqualified) and you cannot say "It was armed removal" (No independent corroboration of weapons).
  *   **Resolution:** You must decide if the **Factual Finding** can remain inconclusive ("The record is insufficient to determine the mechanism of departure") while the **Inscription** and **Reparation** proceed on other grounds. If the Council demands a binary factual finding, these two desiderata are incompatible.

  **Uniformity vs. Sensitivity (Tension between #1 and General Rule-Making)**
  *   **The Conflict:** You noted tripping over a rule that is the same for every community vs. a rule sensitive to power. The **Provenance Condition** is inherently sensitive to power; it treats records differently depending on who wrote them.
  *   **The Result:** This violates the principle of procedural uniformity. A ledger from a private bank sale would be accepted; a ledger from a city buyout is suspect.
  *   **Resolution:** This is a feature, not a bug, but it opens the panel to charges of bias. You must accept that *equity* in this context requires *unequal* scrutiny of documents based on the power dynamics of their creation.

  ---

  ### III. Domain Relativity

  Adequacy is relative to the output. A single standard cannot apply to all three deliverables.

  | Requirement | Factual Finding | Inscription Wording | Reparative Recommendation |
  | :--- | :--- | :--- | :--- |
  | **Evidentiary Bar** | **Highest.** Must meet Independence Threshold. If not met, finding must be "inconclusive." | **Moderate.** Can reflect "Community Memory" even if unproven, provided it is labeled as such (e.g., "Descendants recall..."). | **High.** Liability requires causation. If the "armed removal" cannot be established, financial reparations are legally vulnerable, but moral acknowledgments are not. |
  | **Provenance Condition** | **Strict.** Ledger cannot prove voluntariness. | **Flexible.** Inscription can acknowledge the Ledger exists without validating its claim (e.g., "Records show a transfer; Residents recall a removal."). | **Strict.** Cannot use the Ledger to deny liability. |
  | **Asymmetry of Harm** | **Neutral.** Findings should strive for truth, though acknowledging the cost of error. | **High Priority.** The inscription should err on the side of including the Testimony to avoid re-injury (Error A). | **High Priority.** Reparations should err on the side of redress if the Provenance Condition creates reasonable doubt. |

  **The Workhorse Requirement:**
  The **Provenance Condition (#1)** does the most work in excluding standard answers. Standard historical methodology assumes documents are prima facie evidence of the transactions they record. By marking the Ledger as *interested party testimony* rather than *objective record*, you dismantle the primary argument for the "buyout" narrative. It forces the Council to admit that "orderly paperwork" is not evidence of "peaceful consent."

  ---

  ### IV. Scorecard for Contenders

  Here is how the three common approaches score against the desiderata.

  **1. Record-Primacy (The Archive Wins)**
  *   **Method:** The Ledger is treated as objective fact unless physically forged. Testimony is treated as folklore.
  *   **Performance:**
      *   *Finding:* High confidence, but violates **Provenance Condition**.
      *   *Inscription:* Clean, but violates **Constitutive Condition** (erases community identity).
      *   *Reparation:* Denies liability, violating **Asymmetry of Harm** (risks re-injury).
  *   **Verdict:** Fails on NN conditions. It treats a self-serving document as independent evidence.

  **2. Memory-Primacy (The Community Wins)**
  *   **Method:** The Testimony is treated as truth unless independently disproven. The Ledger is treated as a cover-up.
  *   **Performance:**
      *   *Finding:* Violates **Independence Threshold** (unless third-party evidence exists). Risks factual error.
      *   *Inscription:* Satisfies **Constitutive Condition** and **Asymmetry of Harm**.
      *   *Reparation:* Strong moral basis, though legally vulnerable if the "armed" claim is challenged.
  *   **Verdict:** Meets ethical NN conditions, but risks the Evidentiary Vacuum. Best for Inscription/Reparation, risky for Factual Finding.

  **3. The Commemorative View (The Future Focus)**
  *   **Method:** The dispute is not about 1919 but about what the city needs to say now to heal. The text should be ambiguous or forward-looking.
  *   **Performance:**
      *   *Finding:* Evades the question entirely.
      *   *Inscription:* Often results in vague platitudes ("A time of change") which violates the **Constitutive Condition** by refusing to name the harm.
      *   *Reparation:* Decouples memory from liability, making reparations arbitrary.
  *   **Verdict:** Fails the **Asymmetry of Harm**. By refusing to adjudicate the conflict, it implicitly validates the status quo (the Ledger).

  ---

  ### V. Testing Your Bias

  You disclosed an instinct to side with the descendants and asked if this is a judgment or a mood. Use the **Provenance Condition** and the **Asymmetry of Harm** as your test.

  1.  **The Provenance Test:** Look at the Ledger again. If the City Council of 1919 had an incentive to make the removal look legal to avoid federal scrutiny or public outcry, the Ledger is a legal shield, not a receipt. If your instinct relies on the suspicion that the documents were *designed* to obscure coercion, your instinct is a **methodological judgment**. It is a recognition that administrative order is often the *result* of force, not proof of its absence.
  2.  **The Asymmetry Test:** Ask yourself: "If I rule for the Ledger and it turns out the descendants were right, what have I done?" You have told a victimized community that their trauma is a fabrication. "If I rule for the descendants and it turns out it was a clean sale, what have I done?" You have allowed a historical inaccuracy on a plaque.
      *   If you feel the first outcome is *unacceptable* and the second is *regrettable but manageable*, your instinct is aligned with the **Asymmetry of Harm**.
      *   If you feel both outcomes are equally bad, your instinct is merely **mood** (empathy without ethical weighting).

  **Conclusion:** Your instinct likely stems from a correct intuition about the **Provenance Condition**. In cases of displacement, the "orderliness" of the record is often the strongest evidence that the removal was systemic and state-sponsored, not that it was voluntary. The Ledger proves the City *took* responsibility for the land; it does not prove the residents *gave* it willingly. Distinguishing those two things is the core of your task.
