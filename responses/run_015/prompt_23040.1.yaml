      *   *Check:* Is the distinction between Paraconsistent Logic (the tool) and Dialetheism (the philosophy) clear? *Correction:* Explicitly have Elena challenge this distinction. "You can use LP without believing the world is contradictory." Marcus must reply that without the belief, the logic is ad hoc.
