answer: |-
  Here is the repaired principle, the diagnosis of your draft, and the application to your new cases.

  ### The Diagnosis
  Your draft principle hangs on the clause: *"a manipulation is a genuine defect only if it's poll-robust."*

  This is where your intuition and your definition diverge.
  *   **Plurality (Case 1):** The manipulation (vote second choice) *is* poll-robust. You know you need to do it with just rough polling. Yet you accept it.
  *   **Borda (Case 3):** The manipulation (bury rival) is *more* poll-robust. It works almost regardless of the numbers. Yet you reject it strongly.

  Therefore, "poll-robustness" is not the defect. The defect is **instability** and **opacity**.
  *   Plurality strategy settles into a **stable public convention** (Duverger's Law). Everyone knows everyone is doing it, so it cancels out into a stable equilibrium. It is *legible*.
  *   Borda strategy creates an **arms race**. If everyone buries, the system breaks. There is no stable "sincere-ish" equilibrium. It is *destructive*.
  *   IRV strategy (Case 2) is **opaque**. It requires specific knowledge of elimination orders. It is not a stable convention; it's a trap for the uninformed.

  You are not tracking manipulability. You are tracking **Civic Legibility**. You want a system where the "correct" ballot is either sincere or a simple, public defensive adjustment that doesn't punish participation.

  ### The Principle: Stable Civic Legibility

  **Statement:**
  A voting rule is sound only if it satisfies **Responsive Aggregation**, **Participation Safety**, and **Strategic Convergence**.

  1.  **Responsive Aggregation:** The outcome must depend on the aggregation of ballots, not on chance or single-ballot dictatorship.
      *   *Motivation:* Case 5 (Random Dictator). A rule that is strategy-proof because it ignores most voters isn't a voting rule; it's a lottery.
  2.  **Participation Safety:** Casting a sincere ballot must never strictly worsen the outcome for the voter compared to abstention.
      *   *Motivation:* Case 6 (No-Show Paradox). This is the hard line. Punishing civic duty destroys the legitimacy of the process.
  3.  **Strategic Convergence:** If sincere voting is not optimal, the optimal strategic adjustment must converge to a simple, public convention that does not require private information or coordinated blocs to execute safely.
      *   *Motivation:* Cases 1, 3, 4, 7. This repairs your "poll-robust" clause. Plurality passes because the strategy is a public convention (vote viable). Borda fails because the strategy is an escalating arms race (how low do I bury?). Approval passes because the threshold is personal calibration, not competitive gaming. Coalitions (Case 7) fail here because they rely on *private coordination* rather than *public convention*.

  ---

  ### Application to Your Original Verdicts

  This principle accommodates most of your instincts, but it forces one overturn.

  *   **1. Plurality:** **Pass.** Fails sincerity, but passes Strategic Convergence. The "vote viable" move is a stable public convention.
  *   **2. IRV:** **Fail.** Fails Strategic Convergence. The monotonicity failures are opaque and info-sensitive; there is no simple public convention to avoid them. (Matches your mild strike).
  *   **3. Borda:** **Fail.** Fails Strategic Convergence. Burying is an arms race, not a stable convention. (Matches your serious strike).
  *   **4. Approval:** **Pass.** Passes Strategic Convergence. Setting a threshold is calibration, not competitive gaming. (Matches your acceptance).
  *   **5. Random Dictator:** **Fail.** Fails Responsive Aggregation. (Matches your rejection).
  *   **6. No-Show:** **Fail.** Fails Participation Safety. (Matches your "worst defect" verdict).
  *   **7. Coordinated App:** **Fail.** Fails Strategic Convergence. This relies on private coordination (the app), not a public convention. It creates an asymmetry between organized and unorganized voters.
      *   *Note:* This validates your discomfort, though standard theory often ignores coalition size.
  *   **8. Single-Peaked Median:** **Fail.** Fails Strategic Convergence in the real world. Inferring the axis is info-sensitive; manipulating the axis is opaque. (Matches your lack of impression).

  **The Overturn:**
  I am holding firm on **Case 7 (Coalitions)**. Your principle suggests this is a defect. My principle agrees, but I must flag that *all* rules are vulnerable to coalitions. The defect here isn't the existence of the bloc, but the *asymmetry* created by the app. If the strategy were public (e.g., "everyone on the left votes bloc"), it would pass Strategic Convergence. Because it relies on a private app to coordinate a deviation from the public convention, it fails. I suspect you might be slightly over-weighting this compared to Case 3 (Borda), which is structurally worse even without coalitions.

  ---

  ### Verdicts on New Cases

  Here is the principle applied to the three methods you requested.

  #### 1. STAR Voting (Score Then Automatic Runoff)
  *Method:* Voters score candidates (e.g., 0-5). The top two by total score advance to an automatic runoff where the one preferred on more ballots wins.
  *   **Responsive Aggregation:** Pass. Aggregates scores and preferences.
  *   **Participation Safety:** Pass. Generally satisfies no-show criteria better than IRV, though not perfectly in all edge cases.
  *   **Strategic Convergence:** **Borderline Fail.**
      *   *Analysis:* The scoring stage incentivizes "max-min" strategy (give favorite 5, rival 0). This is a stable convention (like Approval). However, the runoff stage reintroduces Plurality-style tactical voting regarding which two make the runoff.
      *   *Verdict:* **Pass, with caution.** It converges to a "max-min" convention which is legible. It is better than Borda, worse than Approval. The "poll-robustness" of the max-min strategy makes it legible, similar to Plurality.
      *   *Confidence:* High. It behaves like Approval with a safety valve.

  #### 2. Majority Judgment (Median Grade)
  *Method:* Voters assign grades (e.g., Excellent, Good, Fair, Poor). The candidate with the highest median grade wins.
  *   **Responsive Aggregation:** Pass.
  *   **Participation Safety:** **Fail.**
      *   *Analysis:* Majority Judgment is susceptible to the no-show paradox. Adding a ballot can shift the median in a way that hurts the voter.
      *   *Strategic Convergence:* **Pass.** The strategy is "boost favorite, bury rival." Because it uses the *median*, it is more resistant to exaggeration than Borda (mean), but the incentive remains. However, the strategy is simple and public.
      *   *Verdict:* **Fail.** The Participation Safety violation is a hard stop under this principle. Even if the strategy is legible, the rule punishes showing up in specific profiles.
      *   *Confidence:* Medium. The no-show cases are rarer than in IRV, but the principle draws a hard line here.

  #### 3. The "Tilted Lottery" (Your Invention)
  *Method:* Approve as many as you like. Take the top two approval-getters. Hold a lottery between them, with odds tilted by the approval gap (e.g., if A has 60% and B has 50%, A wins with 60% probability).
  *   **Responsive Aggregation:** **Fail.**
      *   *Analysis:* This violates the spirit of Aggregation. If the top two are 51% and 49%, the 49% candidate wins nearly half the time. The rule deliberately injects noise that overrides the aggregate will of the majority in the final step.
  *   **Participation Safety:** Pass.
  *   **Strategic Convergence:** Pass. Approval strategy is stable.
  *   **Verdict:** **Fail.** While it solves the "winner take all" tension, it fails Responsive Aggregation. It treats the election partially as a lottery (Case 5). If the goal is to select a representative, giving the minority candidate a 49% chance of winning when they lost the vote undermines the aggregation of preferences.
  *   *Note:* If your goal is *compromise* rather than *selection*, this might pass a different principle. But under *Stable Civic Legibility*, it fails to respect the ballot's aggregate signal.

  ---

  ### Confidence and Limitations

  **1. Is "Poll-Robustness" doing work?**
  No. I am confident in discarding it. As noted, Plurality is poll-robustly manipulable and you accept it. Borda is poll-robustly manipulable and you reject it. The work is being done by **Stability**. You accept manipulations that settle into a public equilibrium (Plurality, Approval) and reject those that create an arms race (Borda) or require secret info (IRV). I have codified this as "Strategic Convergence."

  **2. Is "Responsiveness" doing all the labour?**
  No. Responsiveness rules out Random Dictator (Case 5) and the Tilted Lottery. But it doesn't distinguish Plurality from Borda. Both are responsive. The distinction comes from Strategic Convergence. So the clauses are doing distinct work.

  **3. Where I am least confident:**
  **Case 7 (Coalitions).** My principle rejects private coordination (the app) but accepts public conventions (Duverger's Law). In practice, the line is blurry. A political party is essentially an "app" for coordinating votes. If your objection to Case 7 is *any* coordination, then almost all democratic politics fails this principle. If your objection is to *secret* coordination that bypasses public debate, the principle holds. I suspect you mean the latter, but I flag this as the most fragile part of the definition.

  **4. The Real Tracking:**
  You asked me to say if you're tracking something else. You are. You are tracking **Legibility**.
  *   **Case 1 (Plurality)** gave it away: "Everyone can see it coming."
  *   **Case 4 (Approval)** confirmed it: "Feels less like strategy and more like calibrating."
  *   **Case 6 (No-Show)** bounded it: "Punishes the exact behaviour I least want a rule to punish."

  You want a system where the voter knows what their ballot *does*, and where doing the "civic" thing (showing up, voting sincerely) is never a trap. Gibbard-Satterthwaite says you can't have perfect strategy-proofness. Your intuition correctly identifies that you can have **Civic Safety**. That is what this principle protects.
