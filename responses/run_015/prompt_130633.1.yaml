answer: |-
  Here is the plan. It is designed for a single whiteboard, a mixed audience, and a hard stop at sixty minutes.

  ### Part 1: Dependency Order

  Do not introduce the vocabulary until minute 35. If you introduce "Skyhook" and "Crane" at the start, the Literature students will treat them as metaphors and the Biology students will treat them as synonyms for "Creationism" and "Evolution." You need them to feel the *structural* difference before they name it.

  **The Sequence:**
  1.  **The Phenomenon of Lift (0–15 mins):** Establish that we are explaining how *Order* arises from *Chaos*. Define "Lift" as getting more organization out than you put in.
  2.  **The Two Moves (15–30 mins):** Present two ways to account for the Lift.
      *   *Move A:* Posit the Order at the start (hidden in the seed, the mind, or the laws).
      *   *Move B:* Posit a process that accumulates Order over time (step-by-step).
  3.  **The Cost Audit (30–35 mins):** Show that Move A relocates the mystery (where did the seed get the Order?), while Move B pays for the Order in time/steps.
  4.  **The Labels (35–45 mins):** *Now* apply Dennett's terms. Move A = Skyhook. Move B = Crane.
  5.  **The Error of Greed (45–55 mins):** Introduce Greedy Reductionism as the failure to acknowledge the rungs of the Crane.
  6.  **The Check (55–60 mins):** Application.

  **Why this order?**
  *   **If you invert 1 and 4 (Labels first):** The class becomes a debate about whether evolution is "true." You lose the structural isomorphism between biological evolution, cultural evolution, and physical self-organization.
  *   **If you invert 2 and 3 (Cost Audit before Moves):** You are critiquing arguments they haven't heard. They need to see the *temptation* of the Skyhook (it's easier) before you show the *cost* (it explains nothing).
  *   **If you introduce Greedy Reductionism before Cranes:** You cannot explain what is being "greedy" about. Greed implies taking more than your share; they need to know what the Crane's "share" of the explanatory work is before they can see someone stealing it.

  **Load-Bearing Dependence:** The crucial link is **Step 3 (Cost Audit)**. If they do not feel that the Skyhook *relocates* the mystery rather than *solving* it, the Crane/Skyhook distinction is just a preference for naturalism. The "relocation of mystery" is the philosophical engine; the labels are just the paint.

  ### Part 2: The One Example

  **The Case:** **The Evolution of a Specific Sentence.**
  *Start:* "XJQZ KLP MNO." (Random letters).
  *End:* "TO BE OR NOT TO BE." (Shakespeare).
  *Mechanism:* Variation (typo) + Selection (keep if it looks more like English).

  **Why this example?**
  1.  **Visibly Cumulative:** You can draw the "generation tree" on the whiteboard. Step 1: XJQZ. Step 2: XJQZ -> TJQZ (T is closer to 'TO'). Step 3: TJQZ -> TOQZ.
  2.  **Unimpressive Steps:** A single letter change is trivial. No single step requires genius.
  3.  **High Organization End:** The quote is culturally recognizable as "high order."
  4.  **Audience Neutral:** Biology students see natural selection (variation/retention). Literature students see text/meaning. Neither feels like the topic belongs solely to the other's major.
  5.  **Board Friendly:** You can draw a branching tree of text strings in one corner of the board and leave it there for the hour.

  **What it must lack:**
  *   **No "Goal":** You must explicitly state the process has no idea it is aiming for Shakespeare. If you imply the process "wants" the quote, you have smuggled in a Skyhook.
  *   **No Biology:** Do not use DNA, cells, or animals. This prevents Biology students from retreating into technical correctness ("Actually, mutation rates vary...") and prevents Literature students from tuning out ("This is science class").

  **Why the usual candidates fail:**
  *   **The Vertebrate Eye:** Too complex to draw in 60 seconds. Bio students know the standard rebuttals; Lit students feel excluded.
  *   **The Watch on the Heath:** Static. It implies a maker immediately. It doesn't show the *process* of accumulation, only the *result*.
  *   **The Bacterial Flagellum:** Politically charged. It triggers the "Evolution vs. Creationism" script immediately, which wastes your attention budget on defense rather than structure.

  ### Part 3: The Misconception Map

  Address these in the order they will naturally arise.

  1.  **"Skyhook = God/Supernatural." (Head off at Minute 35, when labeling).**
      *   *Correction:* A Skyhook is any explanation that assumes the competence it purports to explain. "Intelligent Design" is a Skyhook. But so is "The Human Mind is just too complex to evolve" (you've posited a mind to explain the mind). Secular Skyhooks exist.
  2.  **"Crane = Simple Machine." (Head off at Minute 40).**
      *   *Correction:* A Crane can be incredibly complex (e.g., the brain), provided that complexity was *built* by lower-level cranes. The distinction is not Simple vs. Complex, but *Borrowed vs. Earned* complexity.
  3.  **"Greedy Reductionism = Reduction is Bad." (Head off at Minute 50).**
      *   *Correction:* This is the highest-risk misconception. Reduction is good. *Greedy* Reductionism is claiming you have explained the *function* of the higher level solely by pointing to the *parts* of the lower level, ignoring the organizational structure (the Crane) that makes the parts work.
      *   *Example:* Explaining "Shakespeare" solely by "Ink chemistry" is Greedy. It ignores the selection process that arranged the ink.
  4.  **"Emergence = Magic." (Defer until Minute 55).**
      *   *Strategy:* Let them think emergence is mysterious until the Check. Defusing it early requires too much metaphysics. Let the Check reveal that "Emergence" is just the top of the Crane, not a Skyhook.
  5.  **"If Cranes rest on Cranes, it's Regress." (Head off at Minute 45).**
      *   *Correction:* It is not a regress if the bottom floor is *simple*. The regress stops at the laws of physics + time. The "bottom" doesn't need to be organized, only existent.

  **New Misconception (Invited by your framing):**
  *   **"The Crane is Deterministic."** Students will assume the steps are inevitable.
      *   *Fix:* Emphasize the *branching* in your text tree. Most branches die. The Crane is a filter, not a pipeline.

  ### Part 4: The Check

  **The Board Prompt (Write this at Minute 55):**
  > **Case:** A student aces a difficult exam.
  > **Explanation A:** "They have a natural Gift."
  > **Explanation B:** "They studied for 50 hours."
  > **Explanation C:** "It's just neurons firing."
  >
  > **Task:** Label A, B, and C using Dennett's terms. Which one is the error?

  **Correct Answer:**
  *   A = Skyhook (Posits the competence at the start).
  *   B = Crane (Cumulative process).
  *   C = Greedy Reductionism (True, but explains nothing about *acing the exam* specifically; ignores the organizational work of studying).
  *   The Error = Treating A as an explanation, or treating C as a *sufficient* explanation for the *performance*.

  **Confident But Wrong Answer:**
  *   "C is the Crane because neurons are physical."
      *   *Why it's wrong:* It confuses "physical" with "process." Neurons are the *bricks*, not the *building*.
  *   "A is a Crane because gifts are developed."
      *   *Why it's wrong:* If "Gift" means "innate," it's a Skyhook. If it means "developed," it's a Crane. The ambiguity is the test.

  ### Verdict on Your Additions

  **1. The "Unfinished Crane" (Promissory Note)**
  *   **Verdict:** **Keep it.** It earns its ten minutes.
  *   **Placement:** Insert at Minute 45, between Cranes and Greedy Reductionism.
  *   **Why:** This is the most philosophically mature point you can make. It distinguishes "We don't know yet" from "It's magic." It protects you from the "But how did the first Crane start?" objection.
  *   **Test:** "When someone says 'Emergence explains consciousness,' ask: Can you write the algorithm? If no, it's an Unfinished Crane. If no *and* they say you can't, it's a Skyhook."

  **2. Lifting Power vs. Anchorage**
  *   **Verdict:** **Keep it, but condense it.**
  *   **Placement:** Minute 40, when defining the Crane.
  *   **Why:** Essential for Literature students. They often fear that "reduction" erases meaning. You must show that the Crane *anchors* the meaning in reality without dissolving it.
  *   **Phrasing:** "The Crane doesn't explain *away* the tower; it explains how the tower *stands*."

  ### Refusals and Failure Modes

  **What to Openly Refuse:**
  Tell them at Minute 5: *"I am not here to prove evolution is true. I am not here to prove God does not exist. I am here to teach you how to spot when an explanation is doing work versus when it is borrowing work."*
  *   **Why:** This inoculates you against the Biology students who want to debate evidence and the Religious students who feel attacked. It frames the hour as *epistemology*, not *ontology*.

  **Failure Mode 1: The Biology Takeover**
  *   **Observation:** A Biology student corrects your "Text Evolution" example with technical details about mutation rates or epigenetics.
  *   **Action:** **Yield immediately.** "Exactly. The biological crane is more complex than my text model. But does that change the *structure* of the explanation? Is it still step-by-step?"
  *   **Why:** If you fight them on biology, you lose the Literature students. If you accept their correction but pivot back to structure, you keep the room.

  **Failure Mode 2: The "Meaning" Objection**
  *   **Observation:** A Literature student says, "But the *meaning* of the sentence isn't in the letters. You haven't explained the meaning."
  *   **Action:** **Agree.** "Correct. The Crane explains the *arrangement*. The *meaning* is a higher-level phenomenon that rests on the Crane. That is why Greedy Reductionism (Explanation C in the Check) is a mistake."
  *   **Why:** This validates their intuition while using it to teach the Greedy Reductionism point. It turns the objection into a lesson.

  **Failure Mode 3: Silence at the Check**
  *   **Observation:** You put the Check on the board. No one writes.
  *   **Action:** **Force a binary.** "Raise your hand: Is 'Gift' a Skyhook or a Crane?" Get the vote. Then ask one student from each side for one sentence of justification.
  *   **Why:** You have 5 minutes left. You cannot facilitate a discussion. You need a diagnostic. A vote breaks the paralysis.

  **Summary of Board Usage:**
  *   **Left Third:** The Text Tree (Drawn Minute 15, stays till end).
  *   **Middle Third:** Definitions (Skyhook / Crane / Greedy) (Written Minute 35).
  *   **Right Third:** The Check (Written Minute 55).

  This plan respects the attention budget. The Text Tree is the anchor. The definitions are the tools. The Check is the exit ticket. Everything else is commentary.
