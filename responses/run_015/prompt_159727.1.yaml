answer: |-
  **Project Title:** The Drift Problem: Discreteness and Common Knowledge in Lewisian Conventions

  **Project Summary**
  David Lewis's analysis of convention relies on a specific game-theoretic structure: agents coordinate on a regularity $R$ because they expect others to conform to $R$, preferring to conform conditional on that expectation, amidst alternative regularities. Crucially, this account presupposes determinate, discrete content. There is $R$, and there is at least one alternative $R'$ that nobody could conform to simultaneously. While cultural-evolution modellers treat this discreteness as a technical convenience required to write down the game, I argue it is a constitutive requirement of the *common-knowledge condition*. If the content of a regularity is graded or possesses blurred edges, it becomes indeterminate what agents know, and what they know that others know, regarding expectations.

  This project addresses the "Drift Problem": the observation that many robust normative regularities (e.g., norms of eye contact, forms of address, interruption protocols) shift over decades via increments so small that no agent ever appears to deviate from expectation, yet the end state is unrecognizable from the start. If conventions require discrete alternatives to ground common knowledge, how do we account for continuous normative drift without abandoning the Lewisian framework?

  **Research Question**
  Does the common-knowledge condition in Lewisian conventions entail discrete strategy spaces, and if so, does continuous normative drift constitute a breakdown of convention or a distinct coordination mechanism?

  Specifically, I will test the hypothesis that discreteness is asymmetrically required: it is necessary for the *establishment* of a convention (where salience requires a discrete menu) but not for its *maintenance* (where common knowledge can sustain a trajectory through a continuous space).

  **Critique of Standard Replies**
  Three standard responses fail to resolve this tension. First, the "micro-switch" reply suggests drift is a rapid sequence of tiny equilibrium jumps. This fails epistemically: it requires agents to track and common-know an infinite sequence of micro-alternatives, imposing a cognitive load inconsistent with the bounded rationality usually assumed in these models. Second, the "category error" reply claims drifting norms are merely habits or practices, not conventions. This is ad hoc; drifting norms often involve the same coordination payoffs and expectation-dependence as paradigmatic conventions. Third, the "vagueness" reply offloads the problem to semantics. This ignores the game-theoretic structure; the issue is not the meaning of words but the structure of the coordination problem itself. If the strategy space is continuous, the "alternative regularity" clause cannot be satisfied in the standard way, threatening the stability of the equilibrium.

  **Methodology**
  This project requires philosophical conceptual analysis paired with formal modelling, not empirical survey or pure simulation. Simulations typically assume an ontology (discrete strategies) to test dynamics; they cannot question whether that ontology captures the phenomenon. Empirical surveys can track change but cannot determine whether the underlying epistemic states constitute common knowledge.

  My role is to rigorously define the epistemic conditions required for convention in continuous vs. discrete spaces. I will work alongside modellers to translate these conditions into formal constraints. The philosopher's task is to ensure the model's variables map onto the actual epistemic requirements of Lewisian common knowledge, preventing the "technical convenience" of discretization from obscuring a conceptual impossibility.

  **Work Plan (Six Months)**

  *   **Months 1–2: Formalizing the Drift Problem.**
      *   *Philosophy:* Precise formulation of the "blurred edge" problem for common knowledge. I will delineate the boundary between "indeterminate content" and "unknown content."
      *   *Modelling Collaboration:* I will ask modellers to construct a baseline coordination game with a continuous strategy space (e.g., a continuous version of the Meeting Game).
      *   *Deliverable:* A technical memo defining the epistemic conditions for equilibrium in a continuous space.

  *   **Months 3–4: Testing the Asymmetry Hypothesis.**
      *   *Philosophy:* Analysis of salience. I will argue that Schelling points require discreteness for initial selection.
      *   *Modelling Collaboration:* We will run simulations comparing "discrete start/continuous drift" vs. "fully discrete" vs. "fully continuous" tracks. The goal is not to fit data, but to see if the continuous drift track collapses without discrete anchors.
      *   *Deliverable:* Preliminary results on whether continuous paths can sustain common knowledge without discrete alternatives.

  *   **Months 5–6: Synthesis and Dissemination.**
      *   *Philosophy:* Drafting the argument. If the model shows continuous drift collapses epistemically, I will argue drifting norms are a distinct category. If they hold, I will refine the definition of "alternative regularity."
      *   *Modelling Collaboration:* Finalizing the formal appendix.
      *   *Deliverable:* A draft paper (8,000 words) ready for submission.

  **Success and Failure Conditions**
  *   **Success:** A determinate answer to whether Lewisian common knowledge is compatible with continuous strategy spaces. A positive result looks like a refined definition of convention that accommodates drift (perhaps via the asymmetry hypothesis) or a proof that drifting norms are structurally distinct from Lewisian conventions. Both outcomes advance the field by clarifying the scope of the theory.
  *   **Failure:** The project fails if the "continuous strategy space" proves mathematically intractable within the timeframe, or if the epistemic conditions become so complex that they render the concept of convention unusable for both philosophers and modellers. Additionally, if I find that resolving the drift problem requires empirical data on agent cognition (e.g., just-noticeable differences in norm perception) that I cannot access philosophically, the project will have reached the limit of armchair methods.

  **Feasibility Assessment**
  This is a borderline case between a six-month project and a dissertation. A *complete* theory of normative drift is a dissertation. However, the specific question posed here—*compatibility between Lewisian common knowledge and continuous spaces*—is scoped for six months. I am not proposing to solve drift, but to determine if the current theoretical framework *can* solve it. By restricting the goal to testing the compatibility of the epistemic conditions rather than building a new evolutionary theory, the project remains tractable. The collaboration with modellers is essential here: if they cannot formalize the continuous epistemic state quickly, I will pivot to a purely conceptual impossibility proof, ensuring a result is delivered within the fellowship term.
