answer: |-
  The pressure gauge on Elias's wrist flickered red, the numbers climbing faster than the analog regulators could bleed off the excess. Around them, the Lattice groaned, a massive web of brass and copper sinking into the abyssal dark, obsolete before either diver was born.

  "Torque limit is forty Newtons, counter-clockwise," Elias said, his voice flat over the comms. He knew the spec by heart; he had memorized the entire maintenance ledger during his retirement. He knew the pressure differential, the alloy composition, the thermal contraction rate of the valve stem. He knew *that* it should turn.

  Kael grunted, the sound wet and strained inside his helmet. His gloved hands slipped off the wrench. "It's seized, Elias. The manual says forty, but it feels like solid rock."

  "The manual assumes standard thermal variance," Elias replied. He kicked off a strut, floating toward the valve. "Move. I'll show you."

  Elias gripped the wrench. He knew the exact angle of leverage required. He knew the breathing pattern needed to stabilize his core against the current. But when he applied pressure, his shoulders screamed, and his fingers trembled uncontrollably. The muscle memory was gone, eroded by five years of surface gravity and desk work. He pushed, but the wrench didn't bite; his body no longer spoke the language of the deep.

  "Get off it," Kael snapped, shoving him back gently. "You're stripping the head."

  Elias hovered, helpless, watching the pressure gauge tick upward. His mind was a perfect library of data, but his body was a locked door. "Don't force it," he said, forcing calm into his voice. "The metal is cold-brittle. You won't feel the turn until the shear point releases."

  "I can't feel anything through these gloves," Kael said, panic rising.

  "Stop looking at the gauge," Elias ordered. "Close your eyes. Listen to the wrench. When the vibration changes from a hum to a click, that's the yield. Not before."

  Kael hesitated, then resettled his grip. He stopped fighting the metal and started listening to it. The Lattice shuddered around them, the water growing denser as the pressure spike threatened to collapse the housing. Elias watched, reciting pressure ratios in his head, useless numbers against the physical reality of the jam.

  "There," Kael whispered.

  He didn't turn the wrench; he let it turn. A subtle shift in posture, a release of tension rather than an application of force. The valve gave way with a metallic sigh. The pressure gauge stabilized.

  Kael exhaled, a long ragged sound. Elias drifted back, flexing his stiff fingers against the cold polymer of his suit. He had known exactly what needed to happen, but only Kael's hands had known how to make it real.

  Facts can be archived, but competence must be inhabited.
