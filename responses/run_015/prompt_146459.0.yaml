answer: |-
  **1. The Examination Question**

  **Question 4**

  Consider the following case, *The Adaptive Agent*. An agent faces a choice between pursuing a personal project of deep significance to her or undertaking a different course of action that produces the best available overall outcome. By stipulation, the agent possesses a psychological constitution such that her well-being is unaffected by this choice. She adapts fully to whichever path she takes, derives equal satisfaction from the work involved, and sustains relationships of equal quality in either scenario. The only difference is the source of the directive: in one case, the shape of her life is determined by her own commitments; in the other, it is determined by the requirement to produce the best available outcome.

  (a) Does the demandingness objection apply to *The Adaptive Agent* case? Explain your answer by distinguishing between a *quantitative reading* of the objection (concerned with the volume of sacrifice) and a *structural reading* (concerned with the source of authority over the agent's life).

  (b) Explain why familiar revisions of consequentialism that reject the requirement to maximise—such as satisficing, scalar, or threshold views—fail to address the structural reading of the objection, even if they address the quantitative reading.

  (c) Critics of the quantitative reading argue that it requires an independent account of how demanding morality may permissibly be, which is precisely what is in dispute. Assess this worry.

  (d) Take a position on the following: If the structural reading is the correct interpretation of the demandingness objection, does the objection retain any independent force, or is it merely a vivid symptom of the deeper complaint that consequentialism fails to recognise agent-relative reasons? Justify your verdict.

  ***

  **2. Model Answer**

  In *The Adaptive Agent*, the quantitative reading of the demandingness objection gains no purchase. The quantitative reading claims consequentialism is defective because it demands too much sacrifice, typically measured in terms of welfare, well-being, or the frustration of preferences. However, the case is stipulated such that the agent's well-being is identical regardless of her choice. She suffers no loss of satisfaction, no degradation of relationships, and no net reduction in welfare. If the objection were solely about the volume of cost imposed on the agent, there would be no objection here. The agent is not being asked to give up anything that counts as a cost within the consequentialist calculus. Therefore, if the intuition persists that the agent is nevertheless subjected to an unacceptable demand, the defect cannot be quantitative. It must be structural.

  The structural reading locates the defect not in the *amount* required, but in the *authority* making the requirement. On this view, the problem is that the agent's life is directed by an external standard—the impersonal optimisation of outcomes—rather than by her own commitments. Even if complying costs her nothing in terms of welfare, it costs her the authorship of her life. She becomes a vessel for the production of value rather than a creator of it. This explains why the intuition of excessive demandingness might survive even when welfare costs are neutralised: the demand is not that she suffer, but that she submit.

  This distinction clarifies why non-maximising revisions, such as satisficing, scalar, or threshold views, fail to resolve the structural complaint. These revisions adjust the *content* of the demand but not its *source*. A satisficing view requires the agent to produce "good enough" outcomes; a threshold view requires optimisation only until a certain standard is met. In *The Adaptive Agent*, even if the demand is lowered from "best" to "good enough," the directive remains external. The shape of the agent's life is still determined by a moral requirement to meet an impersonal target, rather than by her own projects. Unless the revision introduces an agent-centred prerogative that allows the agent to prioritise her own commitments *even when* doing so does not meet the moral threshold, the structural defect remains. The agent is still subordinate to the moral system, merely a less demanding master. Thus, these revisions are responsive only to the quantitative reading, where reducing the demand reduces the cost. They are inert against the structural reading, where the mere existence of an overriding external demand is the grievance.

  Regarding the quantitative reading, the worry that it requires an independent account of permissible demandingness is fatal to its utility as an internal critique. To claim consequentialism demands "too much," one must measure the demand against a standard of "enough." If that standard is derived from consequentialist premises (e.g., demands are too high if they reduce long-term utility), the objection collapses, as the theory will define the optimal level of demand as permissible. If the standard is non-consequentialist (e.g., appeals to common sense or intuition about fairness), the objection ceases to be an internal critique and becomes an external assertion of a rival moral framework. The quantitative objection cannot generate its own limit; it must borrow one from the very intuitions consequentialism often challenges.

  This leads to the verdict on the structural reading. If the structural reading is the correct interpretation, the demandingness objection retains no independent force; it is merely a vivid symptom of the deeper complaint regarding agent-relative reasons. The structural complaint is that consequentialism denies the agent the standing to organise her life around her own commitments. This is precisely the definition of failing to recognise agent-relative reasons. To say the theory is "too demanding" in the structural sense is just to say it grants too much authority to agent-neutral reasons over agent-relative ones.

  For this verdict to be mistaken, one would have to show that there is a distinct harm in "subordination to morality" that is not captured by the denial of agent-relative reasons. One might argue that the *experience* of being demanded upon is itself a welfare cost, distinct from the frustration of projects. However, in *The Adaptive Agent*, we stipulated that the agent adapts fully and suffers no psychological cost. If there is no welfare loss and no denial of specific agent-relative reasons (since the agent could, on some views, choose the personal project if agent-relative reasons existed), the only remaining complaint is the absence of the permission itself. Therefore, the structural demandingness objection does not stand alone. It is the integrity objection restated in the language of demand. The real dispute is not about how much morality costs, but about who holds the authority to spend the agent's life.

  ***

  **3. Marking Scheme**

  **Total Marks: 20**

  **1. Analysis of the Case (4 marks)**
  *   **Must Hit:** Correctly identify that the quantitative objection fails in *The Adaptive Agent* because welfare costs are stipulated as neutral, forcing the objection to rely on the structural reading (authority/authorship).
  *   **Common Failure:** Candidates argue the agent still suffers a cost (e.g., "loss of freedom") without noticing this contradicts the welfare-neutrality stipulation or conflates it with the structural point.

  **2. Distinction of Readings (4 marks)**
  *   **Must Hit:** Clearly define the quantitative reading (volume of sacrifice) versus the structural reading (source of authority/direction of life) and apply them to the case.
  *   **Common Failure:** Candidates define the readings abstractly but fail to apply them to the specific details of *The Adaptive Agent*.

  **3. Critique of Revisions (4 marks)**
  *   **Must Hit:** Explain that satisficing/scalar/threshold views lower the *amount* demanded but retain the external *source* of the demand, thus failing the structural reading.
  *   **Common Failure:** Candidates list the revisions as solutions without explaining why they are insufficient for the structural complaint (the "taxonomy" error).

  **4. The Independent Standard Worry (4 marks)**
  *   **Must Hit:** Articulate that the quantitative reading requires a non-consequentialist standard to judge "too much," rendering it question-begging or external.
  *   **Common Failure:** Candidates assert the worry is valid but fail to explain *why* an independent standard is needed or how it undermines the objection.

  **5. Verdict on Independence (4 marks)**
  *   **Must Hit:** Take a definite position on whether the structural reading is independent or a symptom of the agent-relative reasons complaint, and justify it (e.g., arguing it is a symptom because both concern authority over life-shaping).
  *   **Common Failure:** Candidates hedge or conclude that "both views have merit" without resolving the relationship between the structural objection and agent-relative reasons.

  ***

  **4. Distinguishing A from B Answers**

  A **B-grade answer** will successfully distinguish the quantitative and structural readings and correctly note that satisficing views fail to address the structural complaint. However, it will likely treat the structural reading as a standalone objection, arguing that "loss of authorship" is a distinct harm from "lack of agent-relative reasons."

  An **A-grade answer** will recognise that the "loss of authorship" *is* the operational description of lacking agent-relative reasons. It will explicitly argue that the structural demandingness objection collapses into the integrity/authority objection, demonstrating that the "demandingness" label is merely rhetorical packaging for the deeper meta-ethical dispute about the source of practical reasons.
