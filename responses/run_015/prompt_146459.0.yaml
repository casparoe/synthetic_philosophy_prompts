  Here's a thinking process that leads to the suggested output:

  1.  **Analyze the Request:**

      *   **Context:** Final-year undergraduate seminar on consequentialism and its critics.
      *   **Format:** 2-hour closed book exam, single essay (1,200-1,500 words), chosen from four questions.
