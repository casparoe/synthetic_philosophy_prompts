      *   **Core Problem to Avoid:** The "taxonomy essay" (Consequentialism is too demanding $\rightarrow$ list solutions like satisficing, scalar, threshold, prerogatives).
      *   **Core Philosophical Crux:** Distinguish between the *Quantitative Reading* (too much sacrifice/welfare loss) and the *Structural Reading* (no agent-relative reasons/loss of authorship).
      *   **Specific Case Requirement:** A case where welfare costs are stipulated away (agent adapts, satisfaction equal, relationships equal), but the *source* of direction is external (consequentialist requirement) rather than internal (own projects).
      *   **Constraints:** No named philosophers, titles, or citations. Use generic labels. Model answer must argue, not just stipulate or appeal to intuition.

  2.  **Drafting the Question:**

      *   *Goal:* Force the student to engage with the specific case where welfare is neutral but authority/authorship is the issue.
      *   *Structure:* Present the case clearly. Ask specific sub-questions that guide the argument without giving away the answer.
      *   *Key Elements:*
          1.  Describe the "Adaptive Agent" case (welfare unaffected, but life direction dictated by outcome maximization).
          2.  Ask if the demandingness objection applies here.
          3.  Ask what this implies about the Quantitative vs. Structural reading.
          4.  Ask why standard revisions (satisficing, scalar, threshold) fail to address the Structural reading.
          5.  Ask about the "independent account of permissibility" worry regarding the Quantitative reading.
          6.  Ask for a verdict on whether the Structural reading is an independent objection or just a symptom of the agent-relative reasons complaint.
      *   *Refinement:* Ensure the wording is precise enough to prevent the "taxonomy" escape route. The prompt needs to explicitly block the "just list solutions" approach by asking *why* they fail in this specific case.

  3.  **Drafting the Model Answer:**

      *   *Length:* Approx. 900 words (as requested, though the student essay is 1,200-1,500, the model should be dense and exemplary).
      *   *Register:* Strong final-year undergraduate (clear, argumentative, precise, not overly verbose).
      *   *Argument Flow:*
          1.  **Introduction:** State the thesis (The objection in this case is purely structural; quantitative readings fail here).
          2.  **The Case Analysis:** Explain why welfare costs are zero. Therefore, quantitative demandingness doesn't apply.
          3.  **The Structural Reading:** Define it (loss of authorship/integrity). Argue this *is* the complaint in the case.
          4.  **Critique of Revisions:** Explain why satisficing/scalar/threshold fail. They adjust the *amount* demanded, not the *source* of authority. If the demand is still external, the structural complaint remains.
          5.  **The Quantitative Worry:** Address the "independent account" worry. If we stick to quantitative, we need a non-consequentialist standard to judge "too much," which begs the question.
          6.  **Verdict:** The structural reading *is* the agent-relative reasons complaint. It has no independent force *as a demandingness objection*; it is the integrity/authority objection in disguise.
      *   *Constraint Check:* No names (No Williams, No Singer, No Hooker). Generic terms only.
      *   *Argumentative Depth:* Must explain *why* the verdict holds, not just assert it. Must mention what would make the verdict go the other way (e.g., if welfare wasn't actually neutral).

  4.  **Drafting the Marking Scheme:**

      *   *Total:* 20 marks.
      *   *Moves:* 5 distinct philosophical moves required.
      *   *Failure Notes:* One line per move describing the common error.
      *   *Moves:*
          1.  Correctly analyzing the case (welfare neutral).
          2.  Distinguishing Quantitative vs. Structural readings.
          3.  Explaining why non-maximizing revisions fail the structural test.
          4.  Addressing the "independent standard" worry for the quantitative reading.
          5.  Taking a definite verdict on the relationship between structural demandingness and agent-relative reasons.

  5.  **Drafting the A vs. B Distinction:**

      *   *Focus:* What separates the good from the great?
      *   *Idea:* The B answer identifies the distinction. The A answer explains the *implication* of that distinction for the viability of the objection itself (i.e., that the structural reading collapses into the integrity objection).

  6.  **Review and Refine:**

      *   *Check Question:* Is the case clear? Yes. Do the sub-questions force the argument? Yes.
      *   *Check Model Answer:* Is it under 1,500 words? Yes (target ~900). Does it avoid names? Yes. Does it argue? Yes.
      *   *Check Marking Scheme:* Are the moves distinct? Yes. Do they sum to 20? Yes.
      *   *Check Constraints:* No citations? Checked. No philosopher names? Checked.

      *(Self-Correction during drafting)*: I need to make sure the Model Answer doesn't just say "Satisficing doesn't work." It needs to explain *why* (because satisficing still demands an external target, just a lower one, whereas the structural complaint is about *any* external target overriding personal projects).
      *(Self-Correction on Word Count)*: The prompt asks for a model answer of about 900 words. I need to be concise but substantive.
      *(Self-Correction on Case Description)*: Ensure the "Adaptive Agent" description is robust enough that students can't easily poke holes in the welfare neutrality stipulation.

  7.  **Final Polish:** Check tone and formatting. Ensure the distinction between "Quantitative" and "Structural" is consistently used as per the prompt's instructions.

      *(Final check on the "Verdict" requirement)*: The prompt asks the model answer to reach a definite verdict on whether the structural reading has force of its own or is a symptom of the agent-relative reasons complaint. I will argue it is the latter (a symptom/re-description), as that allows for a sharper argumentative line suitable for a model answer.

