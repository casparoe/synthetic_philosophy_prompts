  Warm and vague is still a signal. If I ask about my haircut and you say 'It's something', you know I'll hear 'It's fine'. You're betting on my insecurity to do the hiding for you. That's manipulation, not silence. Directness isn't a ritual. It's a flat surface. 'That hat is ugly' costs nothing to understand. 'It's brave' requires you to know the code, to know me, to know the context. You say it favours the fluent. I say it favours the person who can't afford to miss the subtext. The junior colleague doesn't need to guess if the boss thinks their work is rubbish. They need to know so they can fix it or leave.

  My filter is utility, not comfort. I don't tell a stranger on the bus their breath smells because I owe them nothing. But if you ask for feedback, you invite the truth. Tact collapses when it prioritises your comfort over my integrity. You call it filtering. I call it curating reality to keep your arse comfortable. If I believe the work is poor, and I say it's 'promising', I have lied. Not about everything, but about the thing that mattered. Don't pretend vagueness is innocence. It's just a softer lie.
