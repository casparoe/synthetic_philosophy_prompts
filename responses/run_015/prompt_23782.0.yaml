answer: |-
  You have diagnosed the situation with remarkable accuracy for someone without formal training. The feeling of standing in a "hall of mirrors" is a sentiment shared by many philosophers of biology who have spent decades analyzing this debate. Your working hypothesis—that this is largely a disagreement about how to partition a single causal process rather than a dispute over empirical facts—is known in the literature as the **Equivalence Thesis**.

  However, while the Equivalence Thesis is the dominant view in the *philosophy* of biology, it is often rejected or ignored by *practicing* biologists. To answer your question directly: the disagreement is a hybrid. It is mathematically equivalent in many standard models (supporting your bookkeeping hypothesis), but it contains genuine disagreements about ontology (what counts as an individual) and heuristics (which story generates better research).

  Here is a diagnosis of the disagreement based on the actual arguments of the camps, followed by an assessment of what constitutes progress.

  ### 1. The Mathematical Layer: Is it just bookkeeping?
  **Verdict: Largely Yes.**

  If you look at the formal models, your hypothesis holds up. The primary mathematical tool used to analyze this is the **Price Equation**. It partitions the change in a trait's frequency into two components:
  1.  The covariance between a trait and fitness *within* groups.
  2.  The covariance between a trait and fitness *between* groups.

  Mathematically, you can describe the exact same evolutionary change using the language of Inclusive Fitness (gene's-eye) or Multilevel Selection (group selection). If a gene for altruism spreads because it helps siblings, Hamilton's Rule ($rb > c$) describes it. If that same gene spreads because groups with more altruists outcompete groups with fewer, the MLS model describes it.

  In this strict mathematical sense, the debate *is* about bookkeeping. As the philosopher Samir Okasha argues in *Evolution and the Levels of Selection*, the two frameworks are often inter-translatable. If you have a model that works in one, you can usually construct a formally equivalent model in the other. This confirms your suspicion that they are often redescriptions of the same causal facts.

  ### 2. The Ontological Layer: What is a "Real" Cause?
  **Verdict: Genuine Disagreement.**

  If it were only math, the debate would have ended decades ago. It persists because the two sides make different claims about what exists in the world.

  *   **The Gene's-Eye View (Williams/Dawkins):** This is not just a calculation method; it is a claim about **replicators**. They argue that for selection to occur, you need a unit that is copied with high fidelity across generations. Organisms are "vehicles" that are destroyed every generation; groups are even more ephemeral. Only genes (or replicators generally) have the longevity to be the "beneficiaries" of selection. To them, saying a group is "selected" is a category error, like saying a "fleet" wins a race rather than the specific cars.
  *   **The Multilevel Selection View (Sober/Wilson):** They argue that **interactors** (entities that interact with the environment to survive and reproduce) are the units of selection, not just replicators. If a group has a boundary, reproduces (fission), and varies in fitness, it qualifies as an evolutionary individual. For D.S. Wilson, the question isn't just about math; it's about whether a colony of ants is functionally a "superorganism." If it acts like an individual, selecting it as an individual is a causal explanation, not just a statistical partition.

  **The Conflict:** The Gene's-Eye view demands high-fidelity copying as a criterion for being a unit of selection. The MLS view demands functional integration and reproduction. These are different criteria for "reality." Therefore, when they argue about whether group selection is "real," they are sometimes arguing past each other about the definition of an evolutionary individual.

  ### 3. The Heuristic Layer: Which story is useful?
  **Verdict: The Core of the Nowak Controversy.**

  This is where the 2010 *Nature* letter by Nowak, Tarnita, and Wilson becomes relevant. They did not argue that inclusive fitness math was "wrong" in a vacuum; they argued it was **unnecessary and limiting**.

  *   **Nowak's Argument:** Standard population genetics (tracking frequencies directly) is more general. Inclusive Fitness Theory (IFT) requires specific assumptions (weak selection, additive effects) that often break down in complex scenarios. They claimed IFT creates a "hall of mirrors" by forcing every social behavior into a kin-selection box.
  *   **The Rebuttal (137 Biologists):** The rebuttal argued that while standard math is more general, IFT is more **illuminating**. It provides a specific causal intuition (relatedness) that guides hypothesis generation. Knowing *why* a trait spreads (because it helps copies of itself in relatives) is more biologically insightful than knowing *that* it spreads (via a frequency equation).

  This confirms that the debate is not about "truth" (since the math can be made to match) but about **explanatory power**. The disagreement is over which redescription helps biologists design better experiments.

  ### Diagnosis: What kind of disagreement is this?

  It is a **methodological and ontological dispute masquerading as an empirical one.**

  1.  **Empirically:** Both sides agree on the data (e.g., eusocial insects evolve under high relatedness and specific ecological constraints).
  2.  **Mathematically:** The models are largely transformable (your bookkeeping hypothesis is correct here).
  3.  **Philosophically:** They disagree on **Causal Granularity**.
      *   Gene-centrists believe the *only* coherent causal story bottoms out at the replicator level.
      *   MLS proponents believe causation can be emergent; a group property can cause a change in frequency even if it is constituted by individuals.

  The "hall of mirrors" feeling arises because you are looking for an empirical fact that will decide a methodological preference. There is no experiment that can prove "genes are the only real unit" because "real unit" is a philosophical definition, not a measurable quantity.

  ### What would count as progress?

  Since the debate is unlikely to end with one side "winning," progress is defined differently in this field. Here is what actually moves the needle:

  **1. Contextual Empiricism (The "When" not the "Who")**
  Progress occurs when biologists stop asking "Which theory is true?" and start asking "Which model is tractable for this specific system?"
  *   *Example:* In microbial biofilms, where individual cells are hard to track but group properties (slime production) are obvious, MLS models are heuristically superior.
  *   *Example:* In vertebrate social behavior, where pedigrees are clear, Inclusive Fitness is often easier to apply.
  *   **Progress:** Acknowledging **pluralism**. Accepting that nature allows for multiple valid descriptions depending on the scale of inquiry.

  **2. Clarifying the "Major Transitions"**
  The most fruitful ground is studying how independent individuals become a higher-level unit (e.g., single cells becoming multicellular organisms).
  *   **Progress:** Instead of arguing if groups *can* be selected, researchers like Peter Godfrey-Smith (*Darwinian Populations*) focus on the *process* of "Darwinization." How does a loose group acquire the machinery (bottlenecks, germ-soma separation) to become a genuine unit of selection? This shifts the debate from a static "either/or" to a dynamic continuum.

  **3. Philosophical Clarity on Causation**
  Progress requires distinguishing between **statistical causation** (partitioning variance) and **mechanistic causation** (physical interactions).
  *   If MLS is just a statistical partition of variance, it is bookkeeping.
  *   If MLS points to a specific mechanism (e.g., group fission rates depend on group cohesion), it is causal.
  *   **Progress:** Biologists explicitly stating when they are using a framework as a mathematical tool versus when they are making a claim about biological individuality.

  ### Summary

  Your hypothesis that this is a disagreement about **partitioning a single causal process** is the most philosophically robust position (championed by Okasha and Godfrey-Smith). The math generally supports you.

  However, do not dismiss the "Gene's Eye" proponents as merely stubborn. Their insistence on the gene as the unit is a safeguard against **group selection mysticism**—the historical tendency to assume groups act harmoniously for the "good of the species" without a mechanism. The Gene's-Eye view enforces rigorous accounting of costs and benefits.

  **The Verdict:**
  *   **Is it empirical?** No. Both predict the same frequency changes.
  *   **Is it bookkeeping?** Mathematically, yes.
  *   **Is it ontological?** Yes, regarding what counts as an "individual."
  *   **Is it useful?** Yes, because different bookkeeping systems reveal different patterns.

  **Progress** will not come from a knockout blow proving one side true. It will come from the field accepting **explanatory pluralism**: using the gene's-eye view to track inheritance and the multilevel view to track ecological interaction, without demanding that one be the "ultimate" reality. The debate settles not when one side wins, but when the question "Which is the *real* unit?" is replaced by "Which description is *productive* for this problem?"
