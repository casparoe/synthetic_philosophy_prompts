  2.  **Determine the Position:**
      *   *Option A: Reject Outright.* This aligns with the advocates but risks losing the evidence of systemic abuse (Director's point). It punishes future researchers for past sins. It might be ethically pure but practically harmful to historical accountability.
      *   *Option B: Acquire Unconditionally.* This aligns with the Director but validates the "archival violence." It ignores the harm to descendants and reinforces the state's categorical gaze. It fails the committee's own ethical mandate regarding "subjecthood."
      *   *Option C: Acquire with Conditions (including the Negative Catalog).* This attempts a synthesis. It preserves the evidence (addressing Director's core concern) but reframes the context to acknowledge the silence (addressing Advocates' core concern). It requires addressing the resource/anachronism objections.
      *   *Decision:* **Option C** is the most responsible path for a university archive. It acknowledges that *how* we hold records matters as much as *that* we hold them. It allows for accountability research while mitigating harm. The challenge is writing the justification so it doesn't sound like a compromise but like a principled ethical stance.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard memo format (To, From, Date, Subject).
