answer: |-
  **MEMORANDUM**

  **TO:** Board of Trustees, University Archives and Special Collections
  **FROM:** Acquisitions and Ethics Committee
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation Regarding the Acquisition of State Residential Institution Records (1930s–1970s)

  **I. EXECUTIVE RECOMMENDATION**

  The Acquisitions and Ethics Committee recommends that the University Archive **acquire the proposed collection subject to binding conditions.** We advise against unconditional acquisition, which risks replicating historical harms, and we advise against outright rejection, which would foreclose accountability.

  Specifically, acquisition must be contingent upon the establishment of a funded "Negative Catalog" project. This project must run parallel to physical stabilization, with a dedicated budget and an 18-month implementation timeline. The donor (or successor state agency) must agree to endow this specific remediation work as a condition of the transfer agreement.

  **II. ETHICAL FRAMEWORK AND RATIONALE**

  The Committee's deliberation centered on the distinction recently adopted by this body between **archival presence** and **archival subjecthood**.

  *Archival presence* is achieved when an individual is named within an institutional record. *Archival subjecthood* requires that an individual be documented in terms that recognize their narrative agency and humanity. The collection under review offers abundant presence but systematically denies subjecthood. The confined individuals appear solely as classified cases, defined by the bureaucracy that managed them.

  **A. The Philosophical Objection: Archival Violence**
  We treat the coalition of descendant-family advocates' objection not as a procedural hurdle, but as a substantive ethical charge. They argue that acquiring these files without structural remediation extends the original "archival violence." We agree. An archive is not a passive warehouse; it is an active site of meaning-making. To ingest these records without acknowledging the silences within them is to validate the state's categorical gaze as the sole historical truth. If the University accepts these records, we become the curators of that gaze. Without intervention, our finding aids and search tools will reinforce the dehumanization inherent in the source material, rendering the archive an extension of the institution's original disciplinary power.

  **B. The Imperative of Evidence**
  However, we also accept the Special Collections Director's contention that rejection would erase the only extant material evidence of systemic practices. The administrative logic of the institution—the intake ledgers, the disciplinary minutes—is precisely where the mechanics of oppression are visible. To destroy or refuse these records is to protect the state from future accountability. Researchers cannot analyze systemic failure without the paperwork of that failure. Therefore, preservation is a moral necessity, but preservation without context is ethically insufficient.

  **III. ADDRESSING THE OBJECTION TO CONDITIONS**

  The Special Collections Director has raised two critical concerns regarding the proposed conditions: the charge of **anachronism** and the risk of **resource diversion**. The Committee has weighed these seriously and finds they do not defeat the proposal, provided the implementation is structured as follows:

  **A. On Anachronistic Moral Architecture**
  The Director argues that imposing a "negative catalog" applies a modern moral framework to historical records. We contend that archival description is *inherently* contemporary. We do not describe records from the 1930s using the cataloging standards of the 1930s; we describe them using current standards to make them intelligible to current users.

  Documenting the *absence* of voice is not a moral judgment on the past creators of the records; it is a factual description of the records' limitations. A finding aid that lists a disciplinary hearing without noting that the accused was denied counsel is incomplete. A "Negative Catalog" does not judge the 1950s superintendent; it informs the 2024 researcher that the superintendent's correspondence is preserved while the resident's appeal is not. This is not anachronism; it is accurate metadata. It ensures the user understands the structural bias of the source material, which is a core function of archival science.

  **B. On Resource Diversion**
  The Director worries that creating this parallel record will divert scarce conservation resources from physical stabilization. This is a valid logistical concern, but it rests on a false dichotomy between "physical care" and "intellectual control." If the intellectual context is toxic or misleading, the physical preservation of the document serves a diminished public good.

  However, to mitigate the resource strain, the Committee recommends that the **funding for the Negative Catalog be external to the general conservation budget.** The acquisition agreement must stipulate that the donor provides a specific endowment for this remediation work, or the University must secure a dedicated grant (e.g., from humanities councils focused on social justice) before processing begins. We cannot allow ethical remediation to cannibalize preservation funds, nor can we allow preservation needs to justify ethical negligence. The condition of acquisition must be that the money for the "silence" is secured alongside the money for the "paper."

  **IV. IMPLEMENTATION TIMELINE AND CONDITIONS**

  To make this recommendation actionable, the Committee proposes the following conditions for the Board's vote:

  1.  **Conditional Deed of Gift:** The transfer of records is contingent upon the inclusion of a "Statement of Structural Silence" in the public finding aid. This statement must explicitly detail the bureaucratic criteria that determined whose voices were preserved and whose were silenced.
  2.  **The Negative Catalog:** A formal parallel record must be created. This catalog will:
      *   Identify every individual referenced only by case number.
      *   Cross-reference known destroyed or unsolicited family petitions (based on standard administrative procedure of the era).
      *   Be accessible alongside the main collection, not as a footnote, but as a companion interface.
  3.  **Funding Mechanism:** The donor must contribute a sum equivalent to 20% of the estimated processing cost, earmarked specifically for the labor required to construct the Negative Catalog and engage with descendant communities.
  4.  **Timeline:**
      *   **Months 1–6:** Physical stabilization of high-risk materials; simultaneous scoping of the Negative Catalog.
      *   **Months 7–18:** Creation of the Negative Catalog and community review period with descendant advocates.
      *   **Month 18:** Public release of the collection *only after* the Contextual Supplement is live and searchable.

  **V. CONCLUSION**

  To acquire this collection unconditionally is to prioritize the completeness of the archive over the humanity of the subjects. To reject it is to prioritize our ethical comfort over historical accountability.

  The Committee believes there is a third path: to hold the state accountable for its records even after the state has dissolved. By acquiring the collection subject to the creation of a Negative Catalog, the University acknowledges that while we cannot restore the voices lost to history, we have a duty to document the machinery that silenced them. This transforms the archive from a repository of bureaucratic violence into a site of critical memory.

  We request the Board vote to authorize acquisition under these specific conditions.

  **Respectfully Submitted,**

  The Acquisitions and Ethics Committee
