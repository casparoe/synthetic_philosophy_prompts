          *   *Director (Special Collections):* Rejection erases evidence of systemic practices. Conditions impose "anachronistic moral architecture" and divert resources from physical stabilization.
      *   **Committee's Conceptual Tool:** Distinction between "archival presence" (being named) and "archival subjecthood" (narrative agency).
      *   **Requirements:**
          *   Recommend *one* concrete course of action (Acquire Unconditionally, Reject, or Acquire with Conditions).
