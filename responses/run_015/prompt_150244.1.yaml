      *   **The Conditions (The "What"):** Define the "Negative Catalog" (or "Contextual Supplement") clearly. It's not just a list; it's metadata about absence.
      *   **Timeline:** Give a concrete schedule (e.g., 18-month pilot, funding allocation).
      *   **Conclusion:** Reiterate the moral imperative.

  4.  **Refining the Argument (Self-Correction during drafting):**
