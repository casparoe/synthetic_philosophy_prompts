answer: |-
  The *Nix v. Hedden* decision validates Gongsun Long's logical insistence that specific designations operate differently than generic terms but ultimately undermines the School of Names' metaphysical realism by demonstrating that legal taxonomy relies on pragmatic usage rather than essential properties. Gongsun Long's "White Horse is Not Horse" (*Bai Ma Fei Ma*) argument rests on a distinction between intension and extension: "Horse" (*Ma*) names the form, "White" (*Bai*) names the color, and "White Horse" (*Bai Ma*) names the compound of form and color. Because the extension of "White Horse" is narrower than "Horse"—one can seek a "horse" and accept a yellow one, but cannot seek a "white horse" and accept a yellow one—the name "White Horse" is not identical to the name "Horse." The Mingjia (School of Names) framework generally posits a relationship between *Ming* (name/universal) and *Shi* (actuality/particular), often assuming that rectifying names (*Zheng Ming*) requires aligning language with independent metaphysical realities or essential attributes.

  In *Nix v. Hedden*, the Supreme Court mapped these logical categories onto institutional taxonomy by distinguishing between the botanical universal and the legal universal. Here, the Particular (*Shi*) is the "Tomato." The Botanical Universal is "Fruit," defined by essential properties (seed-bearing structure), while the Legal Universal is "Vegetable," defined by pragmatic usage (cooked, eaten with dinner). The Compound Name corresponds to "Tomato-as-vegetable," a designation constructed by the Tariff Act. The Court's reasoning treats "Vegetable" not as a universal that excludes "Fruit" through ontological necessity, as "Horse" might exclude "White Horse" through logical intension, but rather as a conventional category that overrides botanical essence based on commercial context. Justice Gray's opinion argues that in the "common language of the people," the name "Fruit" does not apply to the *Shi* of the tomato, mirroring Gongsun Long's claim that the name "Horse" does not fully capture the *Ming* of "White Horse."

  This comparison reveals that the Mingjia framework exposes a hidden ontology in legal classification: the law pretends to deal with essences but actually deals with social agreements. The Court's pragmatic reasoning shows the limits of applying the School of Names to institutional taxonomy because Gongsun Long's distinctions are rooted in the metaphysics of properties (color + shape), whereas the Court's distinctions are rooted in the sociology of use (kitchen vs. garden). The analogy breaks down where Gongsun Long asserts a logical non-identity based on inherent attributes, while the Court asserts a functional identity based on external intent; for Gongsun Long, "White Horse" is never "Horse" in any context of precise naming, whereas for the Court, a tomato is still a fruit botanically, just not legally.

  My assessment would shift to view this case as supporting Gongsun Long's metaphysical realism if the Court had justified its ruling by arguing that tomatoes cease to be fruits ontologically upon importation, thereby aligning legal *Ming* with a transformed *Shi*. Conversely, if historical evidence demonstrated that Gongsun Long intended his paradoxes merely as critiques of linguistic convention rather than statements on the independence of universals, the Court's pragmatic reasoning would fully support the Mingjia position as a proto-nominalist theory of institutional language.
