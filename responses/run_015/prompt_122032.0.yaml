answer: |-
  Here is the triage of your requirements, the assessment of the theories, and the parameters for building the sisters.

  ### The Requirements: Non-Negotiable vs. Negotiable

  For your purpose—scaffolding characters who feel human rather than ideological mouthpieces—here is how your list breaks down.

  **Non-Negotiable (The Structural Load-Bearers)**
  *   **Generativity (Cases with no polling data):** You are correct; this is the killer criterion. A theory that only categorises known dilemmas cannot help you write a scene that hasn't happened yet. If the theory cannot process the specific betrayal in the specific kitchen, it is a museum catalogue, not a tool.
  *   **Observable Markers:** You are writing fiction, not philosophy. If the theory cannot translate a moral shift into a change in posture, voice, or appetite, it is useless to you. We need to see the conviction in the body.
  *   **Domain Specificity:** The same person being a stickler in one domain and flexible in another. This is the primary defence against cardboard cutouts. If a character is consistently 'loyal' or consistently 'fair' across all contexts, they are a robot. Humans are contextual.
  *   **The Truth/Psychology Tension:** You must accept that these are separate tracks. A psychological explanation of *why* someone believes something does not validate or invalidate *what* they believe. If your theory claims to do both, it is lying.

  **Negotiable (Scene Dressing or Background)**
  *   **Incidental Effects (Smell/Drink):** Useful for atmosphere, but not for character architecture. Whether disgust is triggered by a smell or a deed matters less than the fact that disgust is present.
  *   **Killing vs. Letting Die:** A specific variant of action vs. inaction. Covered by the broader requirement of how they handle agency.
  *   **Heritability/Trainability:** Important for the town's backstory, but not for the immediate mechanics of a scene.
  *   **Moral/Conventional Line:** Useful for establishing stakes, but largely covered by 'Enforcement on Strangers'.

  **The Single Exclusionary Requirement**
  **Generativity** does the most work in excluding popular theories. Most evolutionary or descriptive models explain why we have the intuitions we *have*, but they struggle to predict what we will do when the context shifts slightly. If a theory cannot tell you what your character does when the rules change mid-scene, it cannot sustain a plot.

  ### The Truth vs. Psychology Tension

  You have identified the fault line correctly. A theory of moral judgment explains the *mechanism* of conviction (weights, upbringing, somatic markers). It cannot tell you who is *right*.

  If you demand a theory that does both, you will break your characters. They will either become mouthpieces for the 'correct' answer (losing their humanity) or puppets of their biology (losing their agency). The tension is non-negotiable: you must keep the psychological explanation separate from the normative truth. The reader must feel the weight of the sister's conviction without knowing if the universe agrees with her. That uncertainty is where the drama lives.

  ### Assessment of Contenders

  **The Harm-Only Rationalist Picture**
  *Verdict:* Discard.
  It reduces the 'loyalty' sister to a malfunctioning logic gate. It cannot account for why she feels pain at the betrayal of the town without a specific victim. It makes her look stupid rather than complex.

  **The Pluralist Foundations Picture (Care/Fairness/Loyalty/Authority/Purity)**
  *Verdict:* Strongest scaffold, with a warning.
  It validates both sisters as operating on different moral frequencies rather than one being 'right' and one 'wrong'. The risk is typology: do not let them become 'The Loyalty Character' and 'The Fairness Character'. They must both access all foundations, but weigh them differently in this specific context.

  **The Morality-as-Cooperation View**
  *Verdict:* Useful for the town, less for the sisters.
  It explains why the town wants silence (coalition maintenance) and why speaking out is costly. It helps with the external pressure, but less with the internal texture of the sisters' disagreement.

  **The 'All Tribal Signalling' View**
  *Verdict:* Toxic for interiority.
  If every moral statement is just status signalling, your characters lose the ability to believe in their own reasons. It creates cynics, not conflicted believers. Use this for the antagonists, not the protagonists.

  ### The Knobs: Parameters for Character Building

  To make them predictable but not mechanical, do not set their 'values'. Set their sensitivities. Here are four parameters you can tune for each sister to generate behaviour in unwritten scenes.

  **1. The Radius of Concern**
  *   *Setting:* Who counts as 'us'?
  *   *Application:* The loyalty sister has a small radius (family/town). Harm to a stranger outside the radius weighs less than harm to the reputation inside it. The justice sister has a universal radius.
  *   *Scene Prediction:* If the victim were a tourist rather than a local lad, the loyalty sister's resistance drops; the justice sister's remains constant.

  **2. Somatic Resistance**
  *   *Setting:* How hard is it to override the gut feeling?
  *   *Application:* Both may intellectually agree on a course of action, but one flinches physically.
  *   *Scene Prediction:* The loyalty sister might agree to speak out but vomit beforehand, or shake so much she drops the phone. The justice sister might feel cold calm. This distinguishes belief from embodiment.

  **3. Status Sensitivity**
  *   *Setting:* How much does the speaker's rank alter the moral weight?
  *   *Application:* Does the verdict change if the accuser is a drunkard? If the accused is a saint?
  *   *Scene Prediction:* The loyalty sister's conviction wavers if the man's status is high; the justice sister's conviction hardens if the man's status is high (abuse of power).

  **4. Narrative Coherence Need**
  *   *Setting:* How much do they need the story to make sense?
  *   *Application:* Some people cannot tolerate a broken narrative (the hero was a villain). Others tolerate chaos.
  *   *Scene Prediction:* The loyalty sister will try to rewrite the past to fit the man's reputation. The justice sister will tolerate the town's collapse to fit the facts.

  ### Final Note on the Sisters

  To avoid the cardboard effect, give the loyalty sister a moment where fairness breaks through (perhaps she protects a stranger elsewhere), and give the justice sister a moment where loyalty breaks through (perhaps she lies to protect the other sister). Use the **Domain Specificity** requirement here. If they are pure archetypes, the reader will dismiss them. If they are inconsistent, the reader will recognise them.

  The theory does not tell you who is right. It tells you why they cannot hear each other. That is the story.
