answer: |-
  ### 1. Essay Question

  **Time Allowed:** 90 Minutes
  **Word Limit:** 1500 Words Maximum

  **Question:**

  Consider the following definitions:
  1.  **Deliberately Self-Erasing (DSE):** A normative standard is DSE if an agent's trying to conform to it (and having the standing disposition to try) systematically makes them less likely to conform to it, compared to an available alternative deliberative procedure.
  2.  **Ersatz DSE:** The DSE property vanishes under full idealization (true descriptive info, no akrasia, perfect instrumental reasoning).
  3.  **Robust DSE:** The DSE property survives full idealization; even the fully idealized agent does better by the standard's lights by *not* aiming at it.

  **The Case:**
  A parent aims to maximize their child's long-term **Resilience**. Psychological evidence suggests that if a parent deliberates about every interaction through the lens of "Will this specific action maximize Resilience?", the child perceives the relationship as instrumental and cold, undermining the secure attachment required for Resilience. The parent succeeds best by aiming at **Unconditional Support**, letting Resilience emerge as a byproduct. Assume this psychological mechanism holds even for an agent with perfect descriptive knowledge of psychology and perfect instrumental reasoning.

  **The Trilemma:**
  Recall the "Three-Ways Collapse" for Ideal-Deliberator accounts facing DSE:
  (a) **Descriptive Idealization:** Leaves Robust DSE untouched (the ideal agent still shouldn't aim at the standard).
  (b) **Normative Idealization:** Builds the answer into the idealization (circularity) or makes deliberation otiose (oracle).
  (c) **Dispositional Stipulation:** Hardwires the "don't aim" disposition into ideality (question-begging).

  **Task:**
  Is the norm "Maximize Resilience" **Robustly DSE** in this case? Defend your classification. Then, argue whether the existence of Robust DSE forces us to abandon the Ideal-Deliberator model of normativity, or whether one horn of the Trilemma can be defended without collapse.

  In your conclusion, you must answer the **Proxy-Status Question**: If the ideal deliberator should not aim at the objective standard (Resilience) but rather at a proxy (Unconditional Support), is that proxy (i) merely instrumentally recommended, (ii) a genuine normative standard with its own authority (e.g., a subjective ought), or (iii) non-normative rationality? Defend your choice and identify one major theoretical cost of that choice.

  ***

  ### 2. Model Answer

  **Classification: Robust DSE**
  The norm "Maximize Resilience" is Robustly DSE. It is not merely that real parents lack the psychological data to calculate the resilience-maximizing move; the prompt stipulates the mechanism is psychological *aiming*. Even an agent with perfect descriptive knowledge of developmental psychology (Descriptive Idealization) cannot bypass the structural fact that the *activity of aiming* alters the phenomenology of the interaction in a way that defeats the goal. Idealization removes ignorance and weakness of will, but it does not remove the constitutive constraints of the psychological architecture. If the ideal agent aims at Resilience, they fail. If they aim at Support, they succeed. Since the failure persists even under full descriptive idealization, the DSE is Robust, not Ersatz.

  **The Trilemma and the Collapse**
  Does this force us to abandon the Ideal-Deliberator model? Not necessarily, but it forces us to accept horn (a) and bite the bullet on the separation of criteria and deliberative targets.
  Horn (b) is untenable. If we idealize by stipulating the agent knows "Resilience is achieved by not aiming at Resilience," we haven't solved the deliberative problem; we've just turned the deliberator into an oracle reporting a paradox. Deliberation becomes otiose because the output ("Aim at Support") is disconnected from the input ("Maximize Resilience") except by a brute fact.
  Horn (c) is equally damaging. Stipulating that the "Ideal Parent" has the disposition to aim at Support simply defines the problem away. It offers no explanation of *why* that disposition constitutes ideality other than that it produces the right results. This renders the Ideal-Deliberator account explanatorily empty.

  Therefore, we must accept (a): Descriptive Idealization leaves Robust DSE untouched. The Ideal Deliberator, knowing all the facts, concludes: "To satisfy the standard of Resilience, I must not deliberate on the standard of Resilience." This creates a gap between the **Criterion of Rightness** (Resilience) and the **Deliberative Target** (Support).

  **Proxy-Status Resolution**
  This gap forces a decision on the Proxy-Status Question. I argue for option **(ii): The proxy is a genuine normative standard with its own authority (a Subjective Ought).**
  If we choose (i) (merely instrumental), we risk alienation. If the agent views "Aiming at Support" only as a trick to get Resilience, they may revert to aiming at Resilience when the instrumental link feels shaky, re-triggering the DSE. The disposition must be stable.
  If we choose (iii) (non-normative), we sever the link between rationality and normativity entirely, suggesting the most rational thing to do is normatively neutral. This is too high a cost for a normative theory.

  By choosing (ii), we posit a bifurcated normativity. There is the **Objective Ought** (Maximize Resilience) which assesses the outcome, and the **Subjective Ought** (Aim at Unconditional Support) which guides the deliberation. Both are normative. The Subjective Ought is not just a heuristic; it is what the agent is *required* to attend to in deliberation.

  **Theoretical Cost**
  The major cost of this choice is **fragmentation**. We lose a unified theory of the "Good." We cannot say "Deliberate on the Good." We must say "Deliberate on the Subjective Good, which tracks the Objective Good only indirectly." This complicates the Ideal-Deliberator account: the "Ideal Advisor" (Smith) cannot simply advise us to do what they would do if they were us, because if they were fully ideal, they would know the Objective Good, but they would advise us to aim at the Proxy. The Ideal Deliberator model survives, but only by admitting that ideal deliberation does not aim at the ultimate normative truth. It aims at the best accessible proxy, which holds genuine normative authority in the deliberative context.

  ***

  ### 3. Marking Scheme

  **Total Marks:** 20
  **Pass Threshold:** 10 Marks

  | Point | Requirement | Marks | Typical Botch |
  | :--- | :--- | :--- | :--- |
  | **1. Case Classification** | Correctly identifies the case as **Robust DSE** (or argues convincingly for Ersatz) based on the persistence of the aiming-problem under descriptive idealization. | 4 | Treating the psychological block as mere ignorance (Ersatz) without arguing why ideal information wouldn't solve the "aiming" paradox. |
  | **2. Trilemma Application** | Explicitly applies the Three-Ways Collapse (a, b, or c) to the case. Identifies why two horns are rejected. | 4 | Describing the trilemma abstractly without applying it to the Resilience/Support distinction in the prompt. |
  | **3. Argumentative Commitment** | **Commits** to one horn of the trilemma (usually 'a'). Does not sit on the fence or claim the problem "dissolves." | 4 | Hedging (e.g., "It depends on the agent") or claiming idealization solves everything without explaining how it bypasses the DSE mechanism. |
  | **4. Proxy-Status Resolution** | Selects one Proxy-Status option (i, ii, or iii) and provides a justification for why that status stabilizes the deliberative procedure. | 4 | Selecting an option but failing to explain why the other two are insufficient (e.g., choosing 'i' without addressing the alienation risk). |
  | **5. Cost Analysis** | Identifies a specific theoretical cost of their chosen Proxy-Status (e.g., fragmentation, loss of unity, circularity risk). | 4 | Claiming their chosen solution has no downsides or listing a practical cost (e.g., "it's hard") rather than a theoretical one. |

  **A vs. B Distinction:**
  A **B-grade** essay correctly defines the terms and applies the trilemma but treats the Proxy-Status question as a practical recommendation for parents. An **A-grade** essay recognizes the Proxy-Status question as a meta-normative problem that threatens the unity of the Ideal-Deliberator model itself and argues for the structural implications of their choice.
