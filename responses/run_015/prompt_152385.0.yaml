answer: |-
  To settle the consciousness status of an Einstein-simulating book, a theory of phenomenal consciousness must satisfy the following desiderata:

  **1. Case Coverage**
  *   **The Biological Brain:** The theory must affirm consciousness in ordinary neural tissue, accounting for subjective feel alongside cognitive function.
  *   **The Static Lookup-Book:** The theory must deny consciousness to a passive volume encoding responses, despite perfect behavioural equivalence.
  *   **The Continuously Rewritten Book:** The theory must deny consciousness to a version updated in real-time by an external agent, distinguishing external simulation from internal processing.

  **2. Preserved Distinctions**
  *   **Syntax vs. Semantics:** The theory must explain why manipulating symbols (syntax) without grasping meaning (semantics) fails to generate experience.
  *   **Access vs. Phenomenal Consciousness:** The theory must distinguish the availability of information for reporting (access) from the subjective quality of experience (phenomenal), ensuring a system can possess the former without the latter.
  *   **Implementation vs. Organisation:** The theory must clarify whether consciousness depends on specific biological substrates or merely causal organisation, without contradicting the intuition that paper lacks the requisite causal powers.

  **3. Empirical and Conceptual Constraints**
  *   **The Binding Problem:** Cognitive science indicates consciousness is unified; the theory must require a mechanism for integrating disparate information states, which a disjointed book lacks.
  *   **The Explanatory Gap:** Philosophy of mind dictates that functional description alone does not exhaust phenomenal reality; the theory must bridge or acknowledge the gap between physical process and subjective feel.
  *   **Causal Efficacy:** Consciousness should not be epiphenomenal; the theory must locate phenomenal properties within the causal chain of the system, not merely in the observations of an external user.

  **The Decisive Desideratum**
  The single desideratum that rules out the largest number of prominent accounts is the **Requirement for Intrinsic Causal Unity**. This stipulates that phenomenal consciousness must supervene on the system's *internal*, unified causal dynamics rather than on *extrinsic* functional dispositions or behavioural outputs.

  **Evaluation of Prominent Accounts**
  *   **Pure Functionalism:** Fails decisively. It grants consciousness based on input-output dispositions, thereby incorrectly attributing consciousness to the static lookup-book.
  *   **Higher-Order Theories:** Fail. If the book encodes higher-order representations, these theories often imply consciousness exists, ignoring the lack of intrinsic causal power to sustain those states.
  *   **Strong Representationalism:** Fails. It relies on content which, in the book scenario, is extrinsic (assigned by the user), violating the intrinsicness requirement.
  *   **Biological Naturalism:** Passes. It insists on specific biological causal powers, correctly denying consciousness to the book, though it may struggle with substrate independence intuitions.
  *   **Integrated Information Theory:** Passes. It requires high levels of internal causal integration (phi), which both the static and externally rewritten books lack.
  *   **Illusionism:** Sidesteps the issue. By denying the existence of phenomenal consciousness, it avoids the constraint but fails to explain the persistent intuition that the brain differs fundamentally from the book.

  This criterion is not partisan prejudice but a necessary condition to prevent the collapse of consciousness into mere behavioural prediction, preserving the distinction between a system that *has* experiences and one that merely *simulates* having them.
