  9.  **Final Polish:** Check tone. Ensure it feels collaborative, like one creative talking to another. (Proceed to generate output).

  *(Wait, one last check on the "Leftover" question)*: I need to be careful. Historians *do* have value judgments. But the prompt asks if the *leftover* (the stuff that doesn't fit narrative) is proof of *that*. Actually, the stuff that *doesn't* fit narrative is usually the stuff that *resists* storyification (chaos, stats, systemic drift). So the leftover suggests narrative is the limiting factor, not necessarily historian bias. Historians try to capture the leftover; novelists cut it for pacing. I will argue the craft vocabulary is missing the dimension of *systemic impersonality*.

