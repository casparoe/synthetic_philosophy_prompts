      *   Address the "Leftover" question specifically? Check.

  6.  **Final Polish (Self-Correction during drafting):**
      *   *Correction:* Make sure I don't just describe the history, but describe the *myth-making* as a narrative act. The prompt asks about "lost causes as national myths."
      *   *Adjustment:* Ensure the distinction between the *event* and the *story told about the event* is clear. The "Lost Cause" is the edit, not the raw footage.
      *   *Refining the "Leftover":* Be careful not to say historians are lying. Say that narrative *requires* selection, and what gets cut is the residue.

  7.  **Final Output Structure:**
      *   Introduction: Acknowledging the lens.
      *   The Four Cases (Narrative Breakdown).
      *   The Residue Report (Survival, Distortion, Leftover).
      *   The Verdict (Value Judgments vs. Craft Limitations).

  *(Self-Correction on the "Leftover" interpretation)*: The prompt asks: "Is the leftover proof that the historians are sneaking in value judgments they can't justify, or is my craft vocabulary missing a real dimension?" I need to take a stance or offer a nuanced synthesis. I'll argue it's largely a limitation of the *protagonist-centric* nature of story, which forces history into a character arc, thereby obscuring systemic forces.

  8.  **Drafting the Content:** (Mental or scratchpad)
      *   Confederacy: Retconning a villain arc into a hero arc.
      *   Masada: POV issue. The winners wrote the draft, the losers became legends.
      *   Kosovo: Changing the win condition. Spiritual victory > Physical defeat.
      *   Dunkirk: Changing the genre. Disaster -> Rescue.
      *   Residue: Economics, demographics, the "extras" who die without lines.
