answer: |-
  You have correctly identified a logical leap that many pop-science presentations gloss over. Your intuition is sound: the fact that a physical model lacks a privileged "now" does not logically entail that the *experience* of "now" is an illusion.

  Here are the specific concepts, names, and boundaries you are looking for.

  ### 1. Naming the Two Claims

  **Claim One: The Block Universe**
  *   **Technical Name:** **Eternalism** or the **B-Theory of Time**.
  *   **Definition:** Past, present, and future events all equally exist. Spacetime is a four-dimensional manifold where "change" is just variation along the time dimension, similar to variation along spatial dimensions.
  *   **Status in Physics:** This is the standard interpretation of Special and General Relativity. Gödel's solution reinforces this by showing that a global "slice" of simultaneity (a universal "now") is mathematically impossible in certain spacetimes.

  **Claim Two: The Illusion of Passage**
  *   **Technical Name:** **Eliminativism about Temporal Becoming** (or denial of **Temporal Becoming**).
  *   **Definition:** The sensation that time "flows," or that the present moment is metaphysically special (moving from past to future), is not a feature of reality but a cognitive artifact.
  *   **Status in Physics:** This is a philosophical add-on. Physics describes correlations and geometry; it does not strictly dictate whether the *feeling* of flow is real or illusory, only that "flow" is not a fundamental variable in the equations.

  ### 2. Naming the Gap

  The gap you are sensing between "the map has no 'You Are Here'" and "the journey is an illusion" is best described by the concept of **Indexicality**.

  *   **The Concept:** Words like "I," "Here," and "Now" are **indexicals**. They refer to the perspective of the speaker, not to an objective feature of the landscape.
  *   **The Argument:** A map does not need a stamp saying "You Are Here" for "Here" to be real to the traveler. "Here" is simply the location of the traveler. Similarly, "Now" is simply the time-coordinate of the observer.
  *   **The Boundary:** The video conflates the **View from Nowhere** (the objective, God's-eye description of the whole spacetime manifold) with the **View from Somewhere** (the embedded, perspectival experience of an observer within that manifold).
      *   **Claim One** describes the *View from Nowhere*.
      *   **Claim Two** makes a verdict on the *View from Somewhere*.
      *   **The Gap:** Just because the *View from Nowhere* doesn't contain a "Now" doesn't mean the *View from Somewhere* is fake. It just means "Now" is perspectival, not absolute.

  ### 3. Does Gödel's Argument Support the Stronger Claim?

  **Gödel's Intention:**
  Kurt Gödel himself did argue for the stronger claim (that time is ideal/illusory). His argument was modal:
  1.  If time is objective (real flow), it must be objective in *all* possible universes consistent with the laws of physics.
  2.  In my rotating universe, there is no objective global time order (due to Closed Timelike Curves).
  3.  Therefore, time cannot be objective in *any* universe, including ours.

  **The Modern Consensus:**
  Most contemporary philosophers of physics argue that Gödel's logic supports **only the weaker claim (Eternalism)**, not the stronger one (Illusionism). Here is why the leap fails:

  1.  **Proper Time vs. Global Time:** Gödel's solution destroys *Global Time* (a universal clock for the whole universe). It does *not* destroy *Proper Time* (the time measured by a clock carried by the traveler). The traveler on the loop still ages; their causal history is still ordered locally. The "flow" they experience corresponds to their proper time, which remains well-defined even if the global geometry is weird.
  2.  **Emergence:** Even if "flow" isn't in the fundamental equations (like the reel of film), it can be an **emergent property** of complex systems (like the heat of a fire, which isn't in the equations for individual atoms but is still real). The "passage of time" may be a thermodynamic or neurological phenomenon, real in its domain, even if not fundamental in the geometry.
  3.  **Category Error:** The video commits a category error by expecting a geometric model to capture phenomenological reality. Expecting the equations of GR to explain the "feeling" of now is like expecting a map of the subway to explain the feeling of being crowded on a train.

  ### Summary

  *   **The Gap:** The distinction between **Ontology** (what exists fundamentally) and **Indexicality** (how observers locate themselves within what exists).
  *   **The Verdict:** Gödel's rotating universe proves that **Global Simultaneity** is impossible (Claim One). It does not prove that **Temporal Experience** is an illusion (Claim Two). The video slides from "Time is not absolute" to "Time is not real," ignoring the possibility that time is **perspectival**.

  You are right to doubt the punchline. The reel doesn't need a "You Are Here" frame for the watching to be real; it just means "You Are Here" is a fact about *you*, not a fact about the *reel*.
