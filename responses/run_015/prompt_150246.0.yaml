  *   **Observability and Regimes:** While you correctly identify that observability conditions are regime-dependent rather than uniform, there is a subtle conflation between technical inspectability and cost observability. In open-weight regimes, while architectural choices (weights) are inspectable, the *cost burden* of producing them remains opaque to competitors; similarly, API logs reveal usage patterns but not necessarily the marginal cost of governance. This distinction is crucial for evaluating competitive pressure on expenditures rather than just technical features.
