answer: |-
  You are correct to be dissatisfied with both friends' advice. They are solving different optimization problems than the one you face.

  Friend B is maximizing **Expected Value (EV)**. This is appropriate only if you have linear utility of money and no risk of ruin. Since you have a hard floor (£30,000) below which utility collapses, maximizing EV is mathematically reckless; it ignores the absorbing barrier of ruin.

  Friend A is maximizing **Expected Log-Utility (Kelly Criterion)**. This maximizes the long-term geometric growth rate and the *median* wealth over an infinite horizon. However, you have a **finite horizon** (24 months), a **specific target** (£120,000), and a **ceiling utility** (money above £120k is worth significantly less to you). Furthermore, Friend A's specific number (20%) assumes your edge ($p=0.6$) is known with certainty, which it is not.

  Here is the mathematical breakdown of why their advice fails your constraints, followed by the strategy you should actually use.

  ### 1. The "Bold Play" Confusion
  You recalled a theorem stating that when odds are against you, you should bet boldly (all-in) to reach a target. This is the **Dubins-Savage "Bold Play" theorem**. It applies when $p < 0.5$ (unfavorable game). In that scenario, negative drift means time is your enemy; you must minimize the number of bets to give variance a chance to overcome the drift.

  **Your situation is the inverse.** Your bet is favorable ($p > 0.5$). Time is your friend. The Law of Large Numbers works *for* you. Therefore, you generally want to **minimize variance** (bet smaller) to let the edge compound, provided you don't run out of time. Betting "max allowed" (Friend B) introduces unnecessary volatility drag and ruin risk.

  ### 2. Parameter Uncertainty is the Real Killer
  Friend A suggests 20% because $f_{Kelly} = p - q = 0.6 - 0.4 = 0.2$.
  However, you noted the true $p$ might be 55%.
  If $p = 0.55$, then $f_{Kelly} = 0.55 - 0.45 = 0.1$ (10%).

  If you bet 20% when the true edge is only 55%, you are **overbetting Kelly**.
  *   **Growth Impact:** Overbetting Kelly reduces your geometric growth rate. Betting double-Kelly reduces it to zero (you break even geometrically).
  *   **Ruin Impact:** Overbetting drastically increases the probability of drawdowns.
  *   **Statistical Reality:** 200 bets with 60% win rate gives a standard error of $\sqrt{\frac{0.6 \times 0.4}{200}} \approx 3.5\%$. Your 95% confidence interval for $p$ is roughly $[53\%, 67\%]$. The lower bound is dangerously close to a coin flip.

  **Conclusion:** You cannot stake 20%. You must stake based on the conservative lower bound of your edge, discounted further for estimation risk.

  ### 3. Your Utility Function
  Your utility function $U(W)$ is not logarithmic; it is roughly:
  $$
  U(W) = \begin{cases} 
  0 & W < 30,000 \quad (\text{Ruin}) \\
  \text{Increasing} & 30,000 \le W < 120,000 \\
  \text{Constant (Max)} & W \ge 120,000 \quad (\text{Target})
  \end{cases}
  $$
  This is a **goal-reaching problem with a barrier**.
  *   **Near the Floor (£30k):** Marginal utility of avoiding ruin is infinite. Stake $\to 0$.
  *   **Near the Ceiling (£120k):** Marginal utility of additional gain is zero. Stake $\to 0$ (to lock in the win).
  *   **In the Middle:** You need positive growth, but variance is only useful insofar as it helps you cross the threshold before month 24.

  ### 4. The Optimal Strategy: Dynamic Fractional Betting
  A constant fraction is suboptimal because your distance to the floor and ceiling changes. You should solve this via **Dynamic Programming** (conceptually), but here is the heuristic implementation:

  #### A. The Stake Size (The "How Much")
  Do not use 20%. Use **Half-Kelly based on the conservative edge**.
  *   Conservative $p = 0.55$.
  *   Conservative Kelly $f = 10\%$.
  *   **Recommended Base Stake:** 5% of current pot.

  Why 5%?
  1.  It protects against the parameter uncertainty (if $p$ is actually 53%, 10% is overbetting).
  2.  It reduces volatility drag.
  3.  With £60k, a 5% bet is £3,000. A loss leaves you at £57k, well above the £30k floor.

  #### B. The Floor Constraint (Risk Management)
  Never place a bet where a loss would take you below £35,000 (give yourself a £5k buffer below the hard floor).
  *   If Pot = £36,000, Max Loss = £1,000. Max Stake = 2.7%.
  *   This overrides the base 5% rule. As you approach the floor, you must de-leverage.

  #### C. The Ceiling Constraint (Locking In)
  As you approach £120,000, your goal shifts from "growth" to "preservation."
  *   If Pot = £110,000, you need £10,000 to hit the target.
  *   Do not bet 5% (£5,500). If you win, you hit £115.5k (still short). If you lose, you drop back.
  *   **Strategy:** Bet exactly enough to hit the target, or less. If Pot = £115,000, bet £5,000. If you win, stop. If you lose, reassess.
  *   Ideally, once you hit £120,000, **stop betting immediately**. Do not pass go. The utility of £150k is the same as £120k to you, but the risk of dropping back below £120k is real.

  #### D. Time Decay (The "Hail Mary")
  If you reach Month 20 and you are at £70,000:
  *   Your base strategy (5% growth) will not get you to £120k in 4 months.
  *   You face a choice: Accept failure or increase variance.
  *   If you choose to chase, you must increase the stake fraction. However, because the bet is *favorable*, you still should not go "all in." You should increase to Full Kelly (based on conservative estimate, so ~10%) to maximize the chance of a run-up without inviting immediate ruin.
  *   **Crucial:** If your model performs poorly in the first 6 months (e.g., win rate < 50%), update your Bayesian prior on $p$. If the posterior suggests $p \le 0.5$, **stop betting**. The edge is gone; the plan is dead. Do not gamble on a broken model.

  ### 5. Summary of Recommendations

  1.  **Reject Constant 20%:** It assumes certainty you don't have and ignores your utility ceiling.
  2.  **Reject Max Stake:** It ignores your ruin barrier.
  3.  **Initial Stake:** 5% of current pot (Half-Kelly on conservative $p=0.55$).
  4.  **Dynamic Adjustment:**
      *   **Downside:** If pot drops near £35k, reduce stake to ensure a loss cannot breach £30k.
      *   **Upside:** If pot exceeds £100k, reduce stake to "bet-to-target" (stake only what is needed to reach £120k).
      *   **Stop Win:** Immediately cease betting upon hitting £120k.
      *   **Stop Loss (Model):** If cumulative win rate drops below 50% after 10 bets, re-evaluate the edge. If $p$ looks $\le 0.5$, stop entirely.
  5.  **Expectation Management:** Even with $p=0.6$ and 5% staking, the median outcome after 24 months may not reach £120k (compounding 5% monthly at 60% win rate yields roughly £95k-£100k median). You are relying on the right tail of the distribution. This is acceptable given your constraints, but you must accept that **failure is the most likely outcome** if the edge is small.

  ### The Mathematical Bottom Line
  Your friends are arguing over **ergodicity**. Friend B ignores the non-ergodic nature of ruin (you can't average across timelines if you're bankrupt in one). Friend A maximizes the time-average growth rate (ergodic property) but ignores your specific boundary conditions.

  You are solving a **finite-horizon stochastic control problem with double barriers**. The optimal control $f_t^*$ is a function of time $t$ and wealth $W_t$:
  $$ f_t^*(W_t) \approx \text{Kelly}(p) \times \frac{\text{Distance to Ruin}}{\text{Distance to Target + Distance to Ruin}} $$
  Roughly speaking: Bet Kelly in the middle, bet zero at the boundaries. Given your parameter uncertainty, scale Kelly down by half.

  **Final Advice:** Start at 5%. Protect the £30k floor at all costs. Lock in profits at £110k+. If the model stops winning, walk away. The £500/month salary savings is your real safety net; this betting scheme should be treated as a high-risk accelerator, not the core plan.
