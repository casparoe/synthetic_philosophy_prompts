answer: |-
  Here is the session design. It is built to be run cold, with no theory upfront, letting the mechanics generate the friction you can't articulate to Ravi.

  ### Session Title: "The Corner Lot Hearing"
  **Time:** 90 Minutes
  **Players:** 20 (Adjustable 18–22)
  **Materials:**
  *   One large paper map (drawn on butcher paper or taped-together flipchart) showing 9 blocks. Center block marked "Good School + Train."
  *   40 Poker Chips (20 Red, 20 Blue).
  *   20 Role Cards (sealed envelopes).
  *   20 "Motivation Cards" (index cards cut in half).
  *   A visible scoreboard (whiteboard or large paper).

  ---

  ### Part 1: The Setup (0–10 mins)
  **No Intro Speech.** Do not explain NIMBYism, zoning, or the point of the exercise. Walk them in, hand them an envelope, and point to the chairs.

  **The Map:**
  *   **Zone A (The Good Block):** 1 Center square. Contains the School and Train tokens.
  *   **Zone B (The Surround):** 8 surrounding squares. No tokens.
  *   **Zone C (Outside):** The rest of the room.

  **The Payoff Table (Post this visibly):**
  This is the engine. It enforces the *positional* nature of the amenity.
  *   **Amenity Tokens:** There are exactly **10 Blue Chips** in the "Good Block." These represent "Access Points" (seats in the school, space on the train).
  *   **Scoring:** At the end of the game, players count their chips.
      *   If **1–10 People** live in Zone A: Each gets **5 Points** per chip held.
      *   If **11–18 People** live in Zone A: Each gets **2 Points** per chip held.
      *   If **19+ People** live in Zone A: Each gets **0 Points** (Congestion Collapse).
  *   **Zone B/C Residents:** Get **0 Points** (Too far from amenities).

  **The Proposal:**
  A developer wants to build a 40-unit apartment complex on the corner of Zone A.
  *   **Effect:** Instantly adds **8 New Residents** to Zone A.
  *   **Current Population:** 12 Residents already in Zone A.
  *   **New Population:** 20 Residents.
  *   **Math:** Currently (12 people), they are in the 11–18 bracket (2 pts/chip). If the building goes up (20 people), they hit the 19+ bracket (0 pts/chip).
  *   *Correction for Playability:* To make the stakes clearer, start with **10 Residents** in Zone A (5 pts/chip = 50 pts each).
      *   **If Blocked:** 10 Residents stay. Score = 50 pts each.
      *   **If Built:** 18 Residents total. Score = 2 pts each = 10 pts each.
      *   **Existing Residents lose 40 points each.**
      *   **New Residents gain 10 points each (from 0).**
      *   **Net Social Loss:** 400 points lost vs 80 points gained.
      *   *Why this loads the dice:* It assumes capacity is fixed. It proves your point (positional loss) but validates Ravi's fear (absolute loss of score).

  ---

  ### Part 2: Round 1 — Restricted Franchise (10–30 mins)
  **Roles:** Hand out Envelopes.
  *   **10 "Homeowner" Cards:** You live in Zone A. You have lived here 15+ years.
  *   **10 "Outsider" Cards:** (See list below). You do *not* live in Zone A.

  **Outsider Roles:**
  1.  **Priced-Out Parent:** Grew up in Zone A, kid goes to school there, you live 40 mins away.
  2.  **Night-Shift Orderly:** Work at the hospital in Zone A, commute 1 hour, can't afford rent here.
  3.  **Waitlist Applicant:** Homeless/currently doubled-up, need housing anywhere, prefer Zone A for safety.
  4.  **Adult Child:** Grew up in Zone A, want to move back near aging parents.
  5.  **Small Landlord:** Own a duplex in Zone B. Want higher property values.
  6.  **Tenant (Zone B):** Rent in Zone B. Fear rent hike if neighborhood gets "hotter."
  7.  **Commuter:** Rely on the Train. Fear crowding.
  8.  **Local Business:** Coffee shop owner in Zone A. Want more foot traffic.
  9.  **Future Buyer:** Saving to buy in Zone A. Want inventory to go up.
  10. **Taxpayer:** Live in Zone C. Pay city taxes, want city revenue up.

  **Rules:**
  1.  **The Franchise:** Only **Homeowners** may vote.
  2.  **The Constraint:** You cannot argue for your *own* points. You must argue for **"The Character of the Neighborhood."** If you say "I lose points," you are ruled out of order.
  3.  **The Vote:** Homeowners debate (15 mins). Vote Yes/No on the building.
  4.  **Motivation Cards:** Immediately after voting, everyone (voters and observers) fills out a card.
      *   *Side A (Private):* "My real reason for voting/speaking was:" [Aesthetic / Financial / Fear / Loyalty / Fairness / Other]
      *   *Side B (Public):* Leave blank for now.

  ---

  ### Part 3: The Tally & Flip (30–45 mins)
  **The Reveal:**
  Collect Side A cards. Shuffle them. Read 5 aloud. Ask the room to guess who wrote it (Homeowner or Outsider?).
  *   *Tally:* Put the number of "Mismatches" on the board. (e.g., "8 people guessed wrong").
  *   *Silence:* Do not explain it. Just write the number.

  **The Franchise Flip:**
  Announce: "The City Council has overruled the block association. Anyone with a 'connection' to the district now has a vote."
  *   **New Rule:** All 20 players vote.
  *   **New Constraint:** Still cannot argue for self. Must argue for "The City's Needs."
  *   **Debate:** 10 Minutes.
  *   **Vote:** Yes/No.

  **Contingency (If the vote does NOT flip):**
  If the Expanded Group *also* votes No (blocks the building):
  *   **Action:** Do not force a Yes.
  *   **Script:** "Note this. Even when we gave outsiders a voice, they adopted the insiders' logic. The exclusion isn't just in the rules; it's in the culture. The 'Neighborhood' is a mindset, not a map."
  *   **Why:** This is actually a stronger finding for your debrief. It shows aspirational exclusion.

  ---

  ### Part 4: Round 2 Tally (45–55 mins)
  Repeat the Motivation Card process.
  *   Collect Side A.
  *   Ask players to write on Side B what they think the *speaker's* reason was.
  *   Swap cards. Reveal.
  *   **Tally:** Put the new Mismatch Number on the board next to the first one.

  ---

  ### Part 5: Debrief (55–90 mins)
  **Do not lecture.** Ask questions. Map their answers to the theory.

  **1. The Boundary Problem (The Vote Flip)**
  *   *Ask:* "Did the outcome change when we changed who counted as the community?"
  *   *Map:* If it flipped: "This is the **Boundary Problem**. Zoning isn't about land; it's about who gets to be a neighbor. Ravi's 'block association' is a political border, not a geographic one."
  *   *Map:* If it didn't flip: "The ideology traveled. The Outsiders want to be Insiders. That's why exclusion persists even when rules change."

  **2. The Audit Failure (The Motivation Gap)**
  *   *Ask:* "Look at the Mismatch Numbers. Why couldn't we guess each other's reasons?"
  *   *Map:* "This is why you and Ravi shouted. He said 'Aesthetic.' You heard 'Financial.' The game shows we have no audit mechanism. We cannot verify if 'Character' is code for 'Equity.' We have to take the card at face value, or assume bad faith. There is no third option."

  **3. The Three Rights to the City**
  *   *Ask:* "Who got what they wanted?"
  *   *Map:*
      *   **Waitlist/Orderly:** Wanted **Habitation** (Right to be housed). *Result:* Only satisfied if building passes.
      *   **Priced-Out Parent:** Wanted **Appropriation** (Right to return/presence). *Result:* Even if building passes, the 'Points' (Character) dropped. They can return, but it's not the *same* place.
      *   **Homeowner:** Wanted **Participation** (Right to shape/control). *Result:* This is the zero-sum right.
  *   *The Hard Truth:* "Which of these can new construction *not* satisfy?"
      *   **Answer:** **The Right to Participation (Control).** You cannot *all* control the neighborhood. If the Waitlist gets in, the Homeowner loses control. If the Homeowner keeps control, the Waitlist stays out.
      *   **The Second Hard Truth:** **The Right to Return (to the *same* character).** New construction changes the character (the points drop). The Priced-Out Parent can come back, but the 'Aesthetic' Ravi loved is mathematically diluted.
  *   *Conclusion on Ravi:* "You were talking past each other. You were arguing for **Habitation**. He was arguing for **Participation**. You can't solve a Participation fight with Habitation math. He knows he loses control if you win. You know he's blocking shelter. Both are true."

  ---

  ### Risk Assessment: What Will Go Wrong

  **1. The Meta-Game (Policy Nerds)**
  *   *Risk:* The policy nerds will calculate the points immediately and argue purely on efficiency ("Net social loss!").
  *   *Fix:* Enforce the "No Points Talk" rule ruthlessly. If someone mentions "efficiency" or "points," make them sit out for one round. Force them to use the language of "Character" and "Community." This forces them to feel the hypocrisy of the rhetoric.

  **2. The Zoning Board Member (Personal Offense)**
  *   *Risk:* The regular who sits on a real board feels caricatured as the villain.
  *   *Fix:* Give her the **Small Landlord** or **Future Buyer** role. These roles have financial incentives but *also* valid housing arguments. It complicates her villainy. Pre-brief her: "I need you to help me keep the debate civil, not to win."

  **3. The "Fixed Pie" Assumption (Loading the Dice)**
  *   *Risk:* The game assumes school/train capacity is fixed. In reality, new tax revenue *could* expand the school.
  *   *Admission:* In the debrief, you must say: "The game assumes amenities don't expand. In real life, density *can* fund better schools. But it rarely happens fast enough to stop the fear. The game simulates the *fear*, not the long-term planning promise."
  *   *Scrap Condition:* If the Homeowners voluntarily vote **Yes** in Round 1 because they calculate they can "absorb" the loss, the game is broken. **Fix:** Increase the New Residents from 8 to 12. Force the congestion. If they still vote Yes, scrap the session; your group is too YIMBY-curious to simulate the conflict honestly.

  **4. The Motivation Gap (Going Flat)**
  *   *Risk:* With a savvy crowd, everyone writes "Strategic" or "Game Logic" as their reason. The gap disappears.
  *   *Fix:* Restrict the card options. Do not allow "Strategy." Options: *Aesthetic, Financial, Fear, Loyalty, Fairness.* Force them to categorize the emotion, not the tactic.
  *   *Least Confident Part:* I am least confident this crowd will write honestly on the cards. They are policy nerds; they intellectualize. You may need to collect the cards anonymously and read the most cynical ones aloud to break the ice.

  ### Re-Randomization Advice
  **Leave it out.**
  Do not reshuffle roles at the end.
  *   **Why:** You need them to sit in the discomfort of the outcome. If the Homeowners blocked the building, they need to sit with the Waitlist person who lost housing *because of their vote*. If you reshuffle, they escape the consequence. The debrief needs the tension of the specific roles they just played to land the "Talking Past Each Other" point.

  ### Final Note on the "Ravi" Problem
  This design admits that Ravi is *rationally* protecting his score. The game proves his incentive is real (he loses 40 points). It does not prove he is *morally* right.
  *   **Your Win:** You show the room that "Character" is a mechanism for protecting Points.
  *   **His Win:** You show the room that asking him to give up Points is asking for a material sacrifice, not just a mindset shift.
  *   **The Resolution:** The debrief concludes that **Habitation** (your goal) requires overriding **Participation** (his goal). The conflict isn't a misunderstanding; it's a hierarchy of rights. You have to decide which right trumps the other. The game doesn't solve it; it just stops you from pretending it's about "aesthetics."
