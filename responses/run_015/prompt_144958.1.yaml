prompt: |-
  hey so i'm a phd student in philosphy of mind (barely) and i need your help drafting something for my reading group. we've got this adversarial collaberation going between two people who've been arguing for like a year: one is hardcore on Kim's causal exclusion argument — thinks mental causation is basically impossible without reduction — and the other is a non-reductive physicalist who thinks mental properties still pull causal weight, maybe through some powers-ontology or interventionist framing.

  i want the actual joint document they'd both sign. not a dialogue, not a verdict — just the agreed stuff, the exact disagreements in wording each camp accepts, the cruxes, and for each crux one concrete case or argument they'd both agree is relevant plus each side's prediction.

  specifically:
  - numbered section of claims both can sign about mental causation, physical closure, and what exclusion actually proves
  - disagreements table: precise formulations of where they split, phrased so the exclusionist and the mental-causation defender each accept the wording for their own side
  - cruxes: i think one is whether non-reductive mental properties can avoid being causally redundant if the physical base is already sufficient, and another is whether an interventionist or powers-based account of causation actually solves this or just moves the problem around
  - for each crux, identify a specific case or piece of evidence both agree bears on it, and write down what each side predicts
  - format: agreed-claims numbered list, then the table

  please keep this grounded and seperate what's actually settled in the literature from what's genuinely contested among people who actually work on this. don't present a contested reading — like that interventionism just dissolves exclusion — as if it's the consensus.

  also no bibliographies or citation lists please; some of us are working without library access this week and i don't want anyone guessing references. and if you quote anything verbatim from an actual text put the real quote with source, otherwise paraphrase.

  thanks — and sorry for the typos, i'm writing this on my phone.
