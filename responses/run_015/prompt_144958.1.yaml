  # Joint Statement of Adversarial Collaboration: Mental Causation and Physical Closure

  **Participants:** [Exclusionist Proponent] & [Non-Reductive Physicalist Proponent]
  **Date:** [Current Date]

  ### I. Agreed Claims

  We, the undersigned, affirm the following claims as the common ground for this collaboration. We agree that these claims accurately represent the constraints of the debate, even where we disagree on their implications.

  1.  **Physical Causal Closure:** We agree that the principle of physical causal closure is a methodological constraint that any acceptable theory must respect. Roughly: every physical event that has a cause has a sufficient physical cause.
  2.  **Supervenience/Dependence:** We agree that mental properties depend on physical properties. There is no mental difference without a physical difference. We remain neutral on whether this dependence is best modeled as supervenience, grounding, or realization, provided it entails ontological dependence.
  3.  **The Exclusion Problem:** We agree that Jaegwon Kim's causal exclusion argument validly identifies a tension between three plausible claims: (a) Mental causation is real, (b) Mental properties are distinct from physical properties, and (c) Physical causal closure holds. We agree that maintaining all three simultaneously requires resolving the threat of systematic causal overdetermination.
  4.  **No Systematic Overdetermination:** We agree that systematic causal overdetermination is implausible. If a physical effect has a sufficient physical cause, it is inadmissible to claim it also has a distinct, sufficient mental cause unless a specific relation explains why this is not problematic overdetermination.
  5.  **Empirical Adequacy:** We agree that any philosophical solution must be compatible with established empirical findings in neuroscience and physics. Neither side posits violations of physical conservation laws.
  6.  **Definition of the Task:** We agree that the goal of this collaboration is not to declare a winner, but to isolate the precise metaphysical or conceptual moves required to maintain each position without contradicting the agreed claims above.

  ### II. Disagreements and Critical Cruxes

  | Core Disagreement (Crux) | Exclusionist Formulation (Position A) | Non-Reductive Formulation (Position B) | Agreed Test Case & Divergent Predictions |
  | :--- | :--- | :--- | :--- |
  | **1. Ontological Status of Mental Properties**<br>*(Can distinct properties cause the same effect?)* | Mental properties must be identical to physical properties to be causally efficacious. If they are distinct, they are causally redundant given physical closure. | Mental properties are distinct from physical properties but causally efficacious. Distinctness does not entail redundancy if the properties stand in a realization or grounding relation. | **Case:** Pain (M) and C-fiber firing (P) both precede Withdrawal (P*).<br>**Prediction A:** If P is sufficient for P*, M is epiphenomenal unless M = P.<br>**Prediction B:** M causes P* *in virtue of* P, but M is not redundant because M captures a causal pattern P does not. |
  | **2. The Nature of Causation**<br>*(Does changing the definition of causation solve exclusion?)* | Causation is a relation of physical production or transfer of energy. Interventionist or counterfactual accounts track dependence, not production, and thus fail to address metaphysical exclusion. | Causation is fundamentally about difference-making and manipulability (interventionism) or the manifestation of powers. If M makes a difference to P*, M is a cause, regardless of physical production chains. | **Case:** An intervention on Belief (M) that changes Action (P*).<br>**Prediction A:** This shows correlation or dependence, but the *productive work* is still done by the physical realizer. Exclusion remains.<br>**Prediction B:** This shows causation full-stop. If an intervention on M changes P*, the exclusion problem dissolves because P and M are not competitors. |
  | **3. The Solution to Exclusion**<br>*(Reduction vs. Non-Reductive Mechanism)* | The only coherent solution is reduction (type identity or functional reduction). We must accept that mental causation is physical causation under a different description. | The solution lies in rejecting the competition assumption. Physical and mental causes operate at different levels or via different ontological categories (e.g., powers), so they do not compete for causal sufficiency. | **Case:** Multiple Realizability of a mental state across different physical substrates.<br>**Prediction A:** This suggests mental kinds are disjunctive and causally heterogeneous; true causation resides only at the specific physical realizer level.<br>**Prediction B:** This demonstrates that mental properties are the robust causal variables; physical details are irrelevant to the causal explanation of the behavior. |
