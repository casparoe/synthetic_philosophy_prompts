      *   *Standing Rule (Living victim/acceptance):*
          *   *Coherence:* High. Fits the "relational repair" model. Apology needs a receiver.
          *   *Subversion:* Risk. What if the group is dispersed? What if the state fractured the group so badly no one can speak for them? It might give a veto power to hardliners.

  6.  **Forward-Looking Instrumentalism (Abandoning Guilt):**
