          *   *Standing Rule:* Essential for the "relational" theory. But risks essentializing the victim group.
      *   *Section 4: The Instrumental Shift.*
          *   If guilt is dropped, apology becomes "conflict management." Wording softens. Ritual matters less.
      *   *Section 5: Confidence & Uncertainty.*
          *   High confidence on the "Liability vs. Guilt" distinction.
