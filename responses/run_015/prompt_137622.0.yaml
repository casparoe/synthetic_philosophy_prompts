answer: |-
  This is a sophisticated problem of political theory disguised as a procedural one. You are asking for the metaphysics of the state as it is enacted in ritual. Based on the structure of the practice you describe—the specific rituals, the conditions for failure, the separation of words from money—I can reconstruct the implicit theory that makes this practice intelligible to its participants.

  Here is a reconstruction of the implicit theory, an evaluation of your proposed tests, and an analysis of the shift to instrumentalism.

  ### 1. Reconstruction of the Implicit Theory

  The practice of the official state apology presupposes a specific ontology of the state and a specific taxonomy of responsibility. It is not merely a public relations exercise; it is a juridical-moral speech act.

  **A. The State as a Trans-Generational Moral Person**
  The practice strictly presupposes that the State is not merely the current administration, nor is it a mere machine of governance. It is a *corporate moral agent* with biographical continuity.
  *   **Continuity:** The State persists through changes of regime, constitution, and population. This is why it can own debts and territory from centuries ago.
  *   **Agency:** Because it persists, it can bear obligations. However, the practice distinguishes between *culpability* (moral blame for intent) and *liability* (obligation to repair).
  *   **The Solution to the Selectivity Puzzle:** The state disclaims *culpability* for past acts (no living official intended the massacre) but accepts *liability* (the State as an enduring entity benefits from the stability and territory secured by those acts and therefore inherits the debt).
  *   **Why not current policy?** Current policy errors are subject to standard mechanisms of accountability (elections, courts, resignations). An apology is reserved for wrongs where standard accountability mechanisms were unavailable or structurally impossible at the time. The apology substitutes for the missing accountability of the past.

  **B. The Apology as a Normative Reset**
  The practice treats the apology not as a description of feelings (regret) but as a *performative* that alters the normative relationship between the State and the Victim Group.
  *   **Non-Substitutability:** Money compensates for loss; apology compensates for *status*. The wrong is interpreted not just as harm inflicted, but as a denial of the victim's standing as a rights-bearer. Only a speech act from the superior (the State) to the subordinate (the Victim) can restore that standing.
  *   **Conditions of Success:** For the act to succeed, it must be "felicitous" (to use Austin's term). It requires the right authority (Head of Government), the right forum (Legislature, representing the polity), and the right wording (unhedged admission of wrong). Hedging fails because it re-asserts the State's authority to define the moral truth, rather than submitting to the Victim's moral truth.

  **C. Standing and Uptake**
  The practice presupposes that the Victim Group also has a form of corporate continuity.
  *   **The Receiver:** There must be a "someone" to receive the apology. This explains why apologies for ancient wrongs often target descendants or cultural successors.
  *   **Uptake:** The fact that a "bad" apology is worse than silence implies that the apology requires *acceptance* to complete the circuit. An unaccepted apology is a failed speech act; it leaves the normative wound open.

  ### 2. Presuppositions vs. Comfortable Fits vs. Underdetermined Areas

  To help your unit distinguish what is essential from what is contingent, I categorize the elements of the practice as follows:

  **Strictly Presupposed (The practice collapses without these):**
  1.  **State Continuity:** The State today is the same agent as the State then. If this were denied, the apology would be incoherent (why apologize for someone else's crime?).
  2.  **Distinction between Guilt and Liability:** The State must be able to say "We did this" without meaning "We intended this."
  3.  **The Restorative Power of Speech:** The words must be capable of doing moral work that money cannot. If words were merely symbolic, the demand for specific wording would not be so fierce.

  **Comfortable Fits (Consistent with the theory, but not strictly required):**
  1.  **Compensation Schemes:** While money doesn't substitute for words, the theory of *liability* suggests repair is due. Compensation fits comfortably as the material arm of liability, but a "poor state" could theoretically offer a valid apology without funds, provided the liability is acknowledged.
  2.  **Memorials:** These reinforce the continuity of memory, fitting the theory, but are not strictly necessary for the speech act itself.

  **Genuinely Underdetermined (The theory allows for conflicting interpretations):**
  1.  **The Nature of the Harm:** Is the harm primarily *material* (loss of land/life) or *symbolic* (loss of honor/status)? The practice accommodates both, but they demand different things. If the harm is material, the "Successor's Proviso" (your first test) is vital. If the harm is symbolic, the apology alone might suffice.
  2.  **The Threshold of Continuity:** How much institutional change breaks the chain of State continuity? The practice glosses over this. A revolution might break it; a change of government does not. The theory does not specify where the line is drawn, leaving it to political negotiation.

  ### 3. Evaluation of Your Proposed Tests

  Your unit is attempting to codify the implicit theory. Here is how your tests interact with the reconstruction above.

  **Test 1: The Successor's Proviso**
  *("An apology counts only if the government has undone some continuing effect of the wrong.")*

  *   **Coherence:** This aligns strongly with the *Liability* model. It prevents "cheap talk" and ensures the State is acting as a responsible agent repairing its own ongoing structures. It addresses the hypocrisy of apologizing while maintaining the benefits of the wrong.
  *   **Subversion Risk:** This test quietly shifts the practice from a *moral ceremony* to a *policy contract*.
      *   *Problem:* Some wrongs are irreversible (e.g., extinction of a language, death of a population). Under this test, the State could never apologize for these, as no continuing effect can be "undone."
      *   *Problem:* It makes the validity of the *speech act* contingent on *legislative success*. If the repair bill fails in parliament, does the apology become void? This undermines the distinct moral power of the words you noted earlier.
      *   *Verdict:* It strengthens the integrity of the State but risks making the apology impossible in the very cases where it is most needed (irreversible harms).

  **Test 2: The Standing Rule**
  *("No apology unless a living person or continuing institution... is willing to accept.")*

  *   **Coherence:** This aligns perfectly with the *Relational/Performative* model. An apology is a dialogue, not a monologue. It respects the agency of the victim group, avoiding the imposition of "forgiveness" by the state.
  *   **Subversion Risk:** It grants a veto power to the victim group's leadership.
      *   *Problem:* It assumes the victim group is a unified agent capable of authorizing acceptance. Often, historical wrongs fracture communities. If no one can speak for the group, does the State remain perpetually in a state of sin?
      *   *Problem:* It may incentivize hardline positions. If acceptance ends the leverage of the grievance, representatives may refuse acceptance to maintain political capital.
      *   *Verdict:* This is theoretically sounder than the first test but practically fraught. It presupposes a level of internal cohesion in victim groups that history often destroys.

  ### 4. The Shift to Forward-Looking Instrumentalism

  If the State abandoned the idea of bearing guilt or liability and treated apologies purely as forward-looking instruments (e.g., "social cohesion," "conflict resolution"), the practice would change in structural ways:

  1.  **Wording would soften:** You would see a shift from "We apologize for the wrong" (backward-looking admission) to "We regret the pain caused" (forward-looking therapeutic). The distinction between "regret" and "apology" would vanish because the moral admission is no longer the point.
  2.  **Ritual would diminish:** The specific forum (Legislature) and messenger (Head of Government) would matter less. A press conference or a community visit would suffice, because the goal is visibility, not constitutional re-founding.
  3.  **Money would substitute for Words:** If the goal is resource distribution to quell unrest, the words become a wrapper for the check. The "non-substitutability" you observe would disappear.
  4.  **Standing would be broadened:** The State would not need a specific victim representative. It could apologize to "the nation" or "society" broadly, because the goal is general social healing, not specific relational repair.

  ### 5. Confidence and Uncertainty

  **Confidence Level:**
  I am **highly confident** in the reconstruction of the *Liability vs. Culpability* distinction and the *Performative* nature of the apology. The behavior you describe (the obsession with wording, the separation from money) is inexplicable without assuming the State views itself as a moral agent engaging in a normative reset.

  **The Least Certain Claim:**
  The claim I am least sure of is the **Necessity of Uptake**.
  My reconstruction assumes that an apology *fails* if not accepted (based on your note that rejected apologies are "worse than silence"). However, there is a competing theory: that the State's duty is only to *offer* the apology, regardless of reception.
  *   *Why this is contested:* If the apology is about the State cleansing its own moral record (a duty to self), acceptance is secondary. If it is about repairing the relationship (a duty to other), acceptance is primary.
  *   *The Risk:* In practice, ministers often act as if the *delivery* is the achievement, while victims act as if the *acceptance* is the achievement. Your unit may be operating in the gap between these two views. If you codify the "Standing Rule" (Test 2), you are taking a side in this unresolved theoretical conflict. If the State believes its duty is discharged upon utterance, your rule will be viewed as an external constraint rather than an internal logic.

  **Recommendation for your Unit:**
  Your tests are attempts to solve the "hypocrisy" problem (Test 1) and the "authority" problem (Test 2). They are principled, but they risk turning a *ceremonial* act into a *contractual* one. The power of the state apology lies in its ambiguity—it is both policy and prayer. Your tests seek to make it purely policy. This may make it more honest, but it may also make it harder to perform. I would advise adopting the Standing Rule (Test 2) as a procedural safeguard, but treating the Successor's Proviso (Test 1) as a political commitment rather than a condition of validity, to allow for apologies where repair is impossible.
