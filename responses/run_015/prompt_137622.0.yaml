          *   *Least Certain Claim:* The idea that the state *must* view itself as a moral agent. Maybe it views itself as a *trustee*? That's a subtle but important distinction. I will pinpoint the "Moral Agency vs. Trusteeship" distinction as the area of greatest uncertainty.

  8.  **Refining the Argument (Self-Correction during drafting):**
