          2.  *Standing Rule:* Apology requires a living victim/continuing institution willing to accept it.
      *   **Task:** Reconstruct the *implicit theory* behind the existing practice (collective responsibility, state persistence, nature of apology, standing). Distinguish presuppositions from compatible ideas. Identify underdetermined areas. Evaluate the two proposed tests against this theory. Explain the shift if the state abandoned guilt for forward-looking instrumentalism.
      *   **Constraints:** Reason from the *structure of the practice*, not specific case studies (no references to check). Be explicit about confidence levels. Identify the least certain claim.

  2.  **Deconstruct the Practice (Phenomenology of the State Apology):**
      *   *Who:* Head of government/State (First Person Plural "We").
      *   *What:* Apology for past wrongs (massacres, dispossession, etc.).
      *   *When:* Generations later.
      *   *Context:* Legislature, formal setting.
      *   *Accompaniments:* Compensation/Memorials (but words are distinct/non-substitutable).
      *   *Conditions:* Wording matters, messenger matters, audience matters. No hedging ("regret" vs. "apology").
      *   *Tension:* Continuity vs. Discontinuity (We own the land/debts but not the guilt? Or do we own the guilt *because* we own the land?).

  3.  **Reconstructing the Implicit Theory:**
      *   *Nature of the State:* The state is a *moral corporation* that persists through time. It is not just the current administration. It has a "biographical unity."
      *   *Collective Responsibility:* Not *culpability* (blame for intent) but *liability* (responsibility for repair). The current state inherits the *obligations* of the predecessor because it inherits the *benefits* and the *authority*.
      *   *Nature of the Apology:* It is a *performative speech act* that changes the normative relationship between the State and the Victim Group. It's not just describing history; it's re-founding the relationship. It requires "uptake" (acceptance).
      *   *Standing:* The State speaks for the enduring polity; the Victims speak for the enduring harmed group.

  4.  **Evaluating the Selectivity (The "Puzzle"):**
      *   *Why apologize for 100 years ago but not current policy?* Current policy is subject to regular political accountability (elections, courts, protests). Historical wrongs are *closed* politically but *open* morally. An apology closes the moral wound that political mechanisms couldn't reach.
      *   *Why claim assets but deny guilt?* This is the weakest link in the public rhetoric, but the implicit theory likely binds them: *Continuity is the condition of possibility for both.* You can't have the land without the history. The implicit theory probably admits liability *because* of continuity, even if it denies personal *guilt*.

  5.  **Evaluating the Proposed Tests:**
      *   *Successor's Proviso (Undoing continuing effects):*
