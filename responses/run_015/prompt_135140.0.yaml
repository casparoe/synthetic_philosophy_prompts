answer: |-
  ### Part 1: The Diagnostic Questions

  **Instructions for Participants:**
  Read each scenario. Choose the option that best matches your genuine instinct about what you would *think* or *do* in that moment. Do not choose the answer that sounds most "compliant"; choose the one that matches your actual state of mind.

  **Q1. The Expense Batch (Independent / Low Stakes)**
  You review 100 expense claims. Each has receipts and approval. Your historical data shows that in a batch this size, there is usually one fraudulent claim, but you can't identify which one. You need to email the CFO: "I have verified this batch."
  *   **A.** Send the email. The evidence for each claim is strong enough.
  *   **B.** Do not send the email. You cannot claim verification if you know one is likely fake.
  *   **C.** Send the email, but mentally note that you haven't *really* verified the batch, only the individual items.

  **Q2. The Safety Valves (Independent / High Stakes)**
  You inspect 100 pressure valves. Each passes its stress test. Engineering stats say that in a batch this size, one valve usually fails undetected. You must sign a certificate: "All valves are safe for operation."
  *   **A.** Sign the certificate. The test results are sufficient for safety.
  *   **B.** Do not sign. Statistical risk is not enough for safety certification.
  *   **C.** Sign the certificate, but tell yourself you are certifying the *process*, not the absolute state of every valve.

  **Q3. The Policy Memos (Preface Style / Low Stakes)**
  You wrote 50 policy memos this year. You checked each one carefully. You know from past performance that you make at least one clerical error per year. On the cover sheet, do you check the box: "This portfolio contains no errors"?
  *   **A.** Check the box. Your checks on each memo warrant the claim.
  *   **B.** Leave it blank. You know for a fact there is an error somewhere.
  *   **C.** Check the box for the sake of the filing system, though you know it isn't strictly true.

  **Q4. The Legal Rulings (Preface Style / High Stakes)**
  You issued 50 compliance rulings. You checked each one against the law. You know your department has a known error rate of 1% per month. You must swear an affidavit: "None of these rulings violate statutory law."
  *   **A.** Swear the affidavit. Your due diligence on each ruling is sufficient.
  *   **B.** Refuse to swear it. The known error rate makes the statement false.
  *   **C.** Swear it, understanding that "none" in this context means "none that we could find," not "none in reality."

  **Q5. The Data Script (Dependent Source / Low Stakes)**
  100 client records were processed by a single software script. The script has a 99% reliability rating (meaning 1% of the time the script itself is buggy). If the script is buggy, all 100 records are wrong. If it's good, all 100 are right. Do you report: "All 100 records are accurate"?
  *   **A.** Report it. The script is likely good, so the records are likely all good.
  *   **B.** Do not report it. A single point of failure risks the whole set.
  *   **C.** Report it, but treat the accuracy of the records as a single block rather than 100 separate facts.

  **Q6. The Auto-Injector (Dependent Source / High Stakes)**
  100 patients receive doses from the same automated dispenser. The dispenser has a 99% reliability rating. If it glitches, all 100 doses are toxic. If it works, all 100 are safe. Do you certify: "All 100 doses are safe"?
  *   **A.** Certify it. The device is reliable enough for medical use.
  *   **B.** Do not certify it. The risk of total system failure is too high to guarantee safety.
  *   **C.** Certify it, but acknowledge you are trusting the machine, not the individual doses.

  **Q7. The Summary Sheet (Aggregation)**
  You have signed off on Item 1, Item 2... through Item 100 individually. Now you look at a summary line that says "Total Status: All Clear."
  *   **A.** Sign the summary. If every item is clear, the total is clear.
  *   **B.** Do not sign the summary. The group status is a different claim than the individual statuses.
  *   **C.** Sign the summary, but consider it a different *kind* of signature than the individual ones.

  **Q8. The Contradiction (Inconsistency Tolerance)**
  Imagine you believe "Item 1 is safe"... up to "Item 100 is safe." But you also believe "At least one item is unsafe" (based on the stats).
  *   **A.** This is fine. I can hold both thoughts without a problem.
  *   **B.** This is a failure. I must drop one of these beliefs to be rational.
  *   **C.** This is fine, as long as I don't act on the contradiction in a single decision.

  ***

  ### Part 2: The Decision Tree & Position Mapping

  To score this, we are looking for patterns across the 8 questions. We code the answers as follows:
  *   **Type 1 (Affirmative):** Answers A on Q1, Q2, Q3, Q4, Q5, Q6, Q7. (Willing to assert the global claim).
  *   **Type 2 (Negative):** Answers B on Q1-Q6. (Unwilling to assert the global claim).
  *   **Type 3 (Split/Qualified):** Answers C on Q1-Q6, or B on Q7/Q8. (Distinguishes between parts/whole or belief/action).
  *   **Type 4 (Stakes-Sensitive):** Answers A on Low Stakes (Q1, Q3, Q5) but B on High Stakes (Q2, Q4, Q6).

  **The Logic Tree:**

  1.  **Check for Stakes Sensitivity:**
      *   Does the participant switch from **A** (Low Stakes) to **B** (High Stakes)?
      *   *Yes:* **Contextualist / Stakes-Sensitive.** (They think warrant changes based on what's on the line).
      *   *No:* Proceed to Step 2.

  2.  **Check for Global Refusal:**
      *   Does the participant answer **B** on the High Stakes Independent cases (Q2, Q4)?
      *   *Yes:* **Reject High-Probability.** (They think statistical likelihood is never enough for knowledge/certification).
      *   *No:* Proceed to Step 3.

  3.  **Check for Aggregation/Closure:**
      *   Did they answer **A** on individual items (implied by passing Step 2) but **B** or **C** on Q7 (Summary) or Q3/Q4 (Preface style)?
      *   *Yes (Answer B on Q7):* **Deny Closure/Aggregation.** (They think individual warrants do not sum to a collective warrant).
      *   *Yes (Answer C on Q7/Q8):* **Non-Belief / Acceptance View.** (They treat the global claim as a practical tool, not a belief).
      *   *No:* Proceed to Step 4.

  4.  **Check for Inconsistency Tolerance:**
      *   Did they answer **A** on everything, including Q8?
      *   *Yes:* **Bite-the-Bullet.** (They accept that rational belief can be jointly inconsistent).
      *   *No:* (If they answered C on Q8): **Pragmatic Consistency.** (A variant of Non-Belief).

  ***

  ### Part 3: Scoring Key & Philosophical Positions

  Map the participant's dominant answer pattern to the following profiles.

  | Dominant Pattern | Philosophical Position | Description |
  | :--- | :--- | :--- |
  | **A on Low / B on High** | **Stakes-Sensitive / Contextualist** | Warrant is not fixed; it expands or contracts based on the practical cost of being wrong. |
  | **B on Most (esp. Q2, Q4)** | **Reject High-Probability** | Statistical likelihood is insufficient for belief. Requires safety, sensitivity, or certainty. |
  | **A on Items / B on Q7** | **Deny Closure / Aggregation** | You can warrant each part, but the warrant does not transfer to the conjunction (the whole). |
  | **A on Items / C on Q7, Q8** | **Non-Belief (Acceptance)** | You "accept" the global claim for work purposes, but do not strictly "believe" it. |
  | **A on All (including Q8)** | **Bite-the-Bullet** | Rational belief is not required to be logically consistent across large sets. |
  | **A on Dependent / B on Indep** | **Correlation Sensitivity** | (Rare) Believes systemic risk (script) is easier/harder to warrant than cumulative risk (independent). |

  ***

  ### Part 4: Empty Leaves & Indistinguishable Zones

  **1. The "Reverse Stakes" Leaf (Empty)**
  *   *Pattern:* **B** on Low Stakes (Q1) but **A** on High Stakes (Q2).
  *   *Why Empty:* This is epistemically incoherent. If the evidence isn't enough to sign a low-risk form, it certainly isn't enough to sign a high-risk legal affidavit. No serious position holds this.

  **2. The "Closure vs. Aggregation" Indistinguishability**
  *   *Pattern:* Answering **B** on Q7 (Summary) while answering **A** on individual items.
  *   *Flag:* In this diagnostic, **Denying Closure** (logic doesn't carry over) and **Denying Aggregation** (warrants don't sum up) produce the exact same answer key.
  *   *Why:* For audit/compliance workflows, the practical output is identical: you sign the parts but refuse the whole. Distinguishing them requires asking about *deductive reasoning* specifically, which violates the "no jargon" constraint. Treat these as the same functional profile for workshop purposes.

  **3. The "Non-Belief vs. Pragmatic Consistency" Blur**
  *   *Pattern:* Answering **C** on Q7/Q8.
  *   *Flag:* The **Non-Belief View** (I accept but don't believe) and the **Pragmatic View** (I believe, but ignore the contradiction for now) often map to the same "C" answers.
  *   *Why:* Both positions rely on a gap between "theoretical rationality" and "practical action." Unless you ask directly about the definition of belief (which invites jargon), these participants will cluster together. Label them **"Pragmatic Separators."**

  **4. The "Dependent Case" Outlier**
  *   *Pattern:* **A** on Independent cases but **B** on Dependent cases (Q5, Q6).
  *   *Flag:* This is theoretically possible (some argue common-cause risk is harder to mitigate than random noise), but in practice, most participants who pass the Independent cases will also pass the Dependent ones because the statistical probability of "All Clear" is actually *higher* in the Dependent case (99% vs 36%).
  *   *Why:* If a participant fails the Dependent case but passes the Independent case, they are likely reacting to the "Single Point of Failure" heuristic rather than the epistemic warrant. Flag them for discussion on **Systemic Risk vs. Cumulative Risk.**

  ### Workshop Facilitator Notes
  *   **Goal:** The point isn't to tell them they are "wrong." The point is to show that the room contains people operating on different epistemic operating systems.
  *   **Conflict Point:** The **Bite-the-Bullet** group (A on all) will frustrate the **Reject High-Prob** group (B on most). Use this friction. Ask the "Reject" group: "How do you ever sign anything?" Ask the "Bite" group: "How do you explain the error when it happens?"
  *   **Hygiene Takeaway:** Compliance frameworks often assume everyone is a **Stakes-Sensitive** operator, but many auditors are secretly **Bite-the-Bullet** operators. This mismatch causes friction during incident reviews.
