prompt: |-
  Hey — I run a little "epistemic hygiene" workshop for people in audit and compliance, and I want a diagnostic that sorts participants by which solution to the lottery paradox and the preface paradox they actually hold, rather than by which label sounds nicest to them.

  Give me 8 questions. Each one should be a concrete workplace case someone with no philosophy training could answer: a safety engineer who has signed off on 400 individually warranted component checks and now has to sign a cover page saying "at least one of these is wrong"; a clinician who is confident about each of 200 diagnoses while also beliving the department's known error rate means at least one diagnosis this month was wrong; versions of both where every item ran through the same shared script, so the errors aren't independent of each other; and matched low-stakes / high-stakes pairs of the same case. Two or three answer options each, and no question may use words like threshold, closure, conjunction, or the names of either paradox.

  Then build the tree from the questions and the answer-combinations they allow, and only afterwards place the real positions in that space: rejecting the high-probability-is-enough picture, denying closure, denying that acceptance aggregates across conjunction, stakes-sensitive and contextualist views, the move where the global claim isn't really a belief at all, and the bite-the-bullet option where the beliefs are jointly inconsistent but each one is in fine shape. Add a short scoring key mapping answer patterns to leaves. Flag the combinations nobody occupies and say briefly why (incoherent, unattractive, or just unexplored), and flag any pair of leaves your questions can't actually pull apart.
