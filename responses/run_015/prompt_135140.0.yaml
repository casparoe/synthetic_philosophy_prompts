      *   **Constraint 4 (Analysis):** Build a decision tree/logic map *after* the questions.
      *   **Constraint 5 (Mapping):** Map answer combinations to philosophical positions (Reject High-Prob, Deny Closure, Deny Aggregation, Stakes/Contextualist, Non-Belief View, Bite-the-Bullet).
      *   **Constraint 6 (Scoring):** Provide a scoring key.
      *   **Constraint 7 (Empty/Indistinguishable):** Flag unoccupied combinations and indistinguishable leaves.

  2.  **Deconstruct the Philosophical Positions (The "Leaves"):**
      *   *Reject High-Prob:* Probability alone isn't enough for belief/knowledge. You need something more (e.g., safety, sensitivity).
      *   *Deny Closure:* You can believe $A$ and believe $B$, but not believe $A \land B$. (Or know $A$, know $B$, but don't know $A \land B$).
      *   *Deny Aggregation:* Similar to closure, but specifically about combining individual warrants into a collective warrant.
      *   *Stakes/Contextualist:* It depends on what's on the line or the conversational context.
      *   *Non-Belief View (Acceptance):* I accept the global claim for practical purposes, but I don't *believe* it in the strict sense.
      *   *Bite-the-Bullet:* It's rational to hold inconsistent beliefs (each item is safe, the whole set is unsafe).

  3.  **Drafting the Questions (Iterative Process):**
      *   *Need:* 8 Questions.
      *   *Structure:*
