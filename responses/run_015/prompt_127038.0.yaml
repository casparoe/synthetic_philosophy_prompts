answer: |-
  I asked my philosophy professor why I sobbed over a fictional orphan but ignored a real fundraiser.

  "Standard theory says pity requires believing the suffering exists," he said.

  "True," I replied. "But real suffering implies I should help. Fictional suffering guarantees I can't. My empathy is strictly conditional on my inability to fix the problem."

  He paused. "So you only cry when you're off the hook?"

  "No," I said. "I cry *because* I'm off the hook. It's the only sadness that doesn't ask for my wallet."
