      *Refining the "Refuse Machinery":* Don't use Payoff Matrices. They encourage calculating expected utility based on independent probabilities. Superrationality requires calculating based on *conditional* probabilities of the other's move given your own.

      *Refining the End Check:* Ask them to evaluate a scenario where the opponent is *not* a debate club member (e.g., a random stranger). Superrationality weakens. This tests if they understand the *correlation* requirement, not just "be nice."

