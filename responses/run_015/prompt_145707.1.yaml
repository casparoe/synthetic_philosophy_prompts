      *   **Constraint 10:** End with one line: "Verdict: [one-sentence summary]".

  2.  **Deconstruct Superrationality & The Noisy Stag Hunt:**
      *   *Superrationality:* Hofstadter's idea that rational agents should reason as if their decision determines the decision of similar agents (logical correlation), not just causal impact. Usually taught via PD (both defect vs. both cooperate).
      *   *The Twist:* The user wants a *Stag Hunt* (coordination game), not PD. In Stag Hunt, there are two Nash Equilibria (Stag-Stag, Hare-Hare). Stag-Stag is payoff dominant, Hare-Hare is risk dominant.
      *   *The Noise:* "Can't tell if the other hunter heard the horn." This introduces uncertainty about common knowledge or signal reception.
      *   *Why Stag Hunt?* It highlights coordination rather than temptation to defect. Superrationality here means reasoning that "if I go for Stag, another superrational agent will too, because we reason alike," overcoming the risk dominance of Hare.
      *   *Why Rational Choice Fails:* Standard Causal Decision Theory (CDT) says "If I go Stag, what will *they* do?" If there's doubt about the signal, risk dominance (Hare) often wins. Superrationality (EDT-ish/Logical Decision Theory) says "My choice is evidence of theirs."

  3.  **Drafting the Teaching Arc (40 mins):**
      *   *0-5 min:* Hook & Setup. The Hunt.
      *   *5-15 min:* The Rational Trap (Why standard reasoning leads to Hare).
      *   *15-25 min:* The Superrational Shift (Logical correlation).
      *   *25-35 min:* Misconception Check & Discussion.
      *   *35-40 min:* Final Assessment.

  4.  **Addressing Specific Constraints:**
      *   *Dependency First:* Need to establish *symmetry* and *shared reasoning* before introducing the choice. If they don't buy that the other player thinks like them, superrationality collapses.
      *   *Rational Choice Failure:* Standard Nash reasoning focuses on risk dominance under uncertainty. If I'm not sure you heard the horn, I play safe (Hare). Superrationality bypasses the signal uncertainty via logical correlation.
      *   *Carrying Example:* Include: Two hunters, Stag (high payoff, needs both), Hare (low payoff, solo), Horn (signal to coordinate), Noise (uncertainty if signal received). Exclude: Punishment/Defection incentives (this isn't PD), communication after the horn (must be silent).
      *   *Misconceptions:*
          1.  "Extra Smart": Head off during the "Rational Trap" phase. It's not about IQ, it's about reasoning type.
          2.  "Telepathy": Head off during the "Superrational Shift". It's about logical inevitability, not magic.
      *   *End Check:* Not "what should you do?" but "why does your choice change the probability of their choice without causality?"
      *   *Refuse Machinery:* Nash Equilibria calculation (too technical/misses the point), Payoff Matrices (visual clutter for this specific logical point), Causal Decision Theory formalism.
      *   *Order Stance:* Start with the *failure* of standard rationality before introducing the solution. Alternative: Start with the definition. Defense: Starting with failure creates the "need" for the concept.

  5.  **Refining the Plan (Self-Correction/Polishing):**
      *   *Wait, check the Stag Hunt nuance:* In a standard Stag Hunt, if I know you're rational, we might still coordinate on Hare if risk is too high. Superrationality argues that because we are *identical* reasoners, I can treat my choice as determining yours.
      *   *The Noise Element:* The prompt specifies "can't tell if the other hunter heard the horn." This is crucial. It creates an epistemic gap. Standard rationality says "If there's a chance they didn't hear, I play Hare." Superrationality says "If I heard it, and we are similar, they likely heard it too, or will reason as if they did." Actually, Hofstadter's superrationality is more about "We are clones." The noise adds a layer of *common knowledge* failure. I need to make sure the lesson doesn't devolve into "common knowledge" game theory (Rubinstein's email game) but stays on *superrationality* (logical correlation).
      *   *Adjustment:* The noise must be framed as "uncertainty about the world," but superrationality bridges it via "uncertainty about *us*." If I decide Stag, I imply the type of agent who goes Stag. If you are that type, you go Stag.
      *   *Refusing Machinery:* Definitely refuse Nash Equilibrium analysis. It reinforces the "Hare is safe" logic. Refuse Bayesian updating on the signal itself; focus on Bayesian updating on the *agent type*.
      *   *Misconception Timing:*
          *   "Extra Smart": Address immediately when they suggest "outthinking" the opponent.
          *   "Telepathy": Address when proposing the solution.
      *   *Final Check:* Needs to be a scenario question where "Cooperate" is the wrong answer if the reasoning is wrong. E.g., "If the other player is known to be irrational, do you still go Stag?" (Superrationality says no, because the correlation breaks).

  6.  **Developing the Argument for Order:**
      *   *My Plan:* Problem -> Failure of Standard -> Superrational Solution.
      *   *Alternative:* Definition -> Example -> Application.
      *   *Defense:* High schoolers engage with puzzles, not definitions. Creating the cognitive dissonance (why standard rationality fails) makes the solution stick.

  7.  **Final Review against Constraints:**
      *   40 mins? Yes, segmented.
      *   No PD? Yes, Stag Hunt.
      *   Noisy Stag Hunt? Yes.
