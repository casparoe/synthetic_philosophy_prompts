answer: |-
  ### 1. Foundational Dependency: Symmetry of Agency (Minutes 0–5)
  **What must come first:** You must establish that the players are **reasoning clones** before introducing the choice.
  **Why:** Superrationality collapses without the assumption that the other player processes information identically to you. If students view the opponent as a distinct black box with unknown motives, standard game theory applies.
  **Action:** Open with a brief "Mirror Protocol." Tell them: "For this session, assume your partner is not just another student, but a philosophical twin. They have your exact notes, heard the same horn, and value the same outcomes. You are not playing *against* them; you are playing *as* them."

  ### 2. The Carrying Example: The Foggy Stag Hunt (Minutes 5–15)
  **The Scenario:** Two hunters in dense fog. A horn sounds (signal to hunt Stag). Stag requires both; Hare is solo but low value.
  **The Noise:** The fog distorts sound. You heard the horn, but you cannot know if your partner heard it or if it was wind.
  **Include:**
  *   **High stakes for coordination:** Stag is life-changing; Hare is survival.
  *   **Epistemic uncertainty:** Explicitly state, "You have no way to radio them. You only have your own ears and your brain."
  *   **The Silence:** No pre-game negotiation allowed.
  **Exclude:**
  *   **Temptation to Defect:** Do not allow a payoff where hunting Stag alone yields a penalty worse than Hare (this turns it into Prisoner's Dilemma). The risk must be *wasted effort*, not *punishment*.
  *   **Asymmetric Information:** Do not give one player private info the other doesn't have (breaks symmetry).

  ### 3. Why Rational-Choice Reasoning Fails (Minutes 15–20)
  **The Trap:** Walk them through standard Causal Decision Theory.
  **The Logic:** "If I hunt Stag, does that *cause* you to hunt Stag?" Standard rationality says **No**. Your action is physically independent.
  **The Failure:** Because of the noise, there is a non-zero chance the partner didn't hear the horn. If they didn't hear it, they hunt Hare. If they hunt Hare, you starve. Therefore, standard rationality dictates hunting Hare to minimize risk (Risk Dominance).
  **The Dead End:** Conclude this section by showing that if both think this way, both eat Hare, despite both wanting Stag. The "rational" choice leads to a suboptimal equilibrium.

  ### 4. The Superrational Shift (Minutes 20–30)
  **The Pivot:** Introduce the superrational axiom: "My decision is not a cause, but **evidence** of your decision."
  **The Logic:** "Since we are reasoning clones, I cannot decide to hunt Stag without implying that *you* also decide to hunt Stag. We are running the same algorithm on the same data."
  **Resolution:** The noise matters less because the correlation isn't in the signal (the horn); it's in the **reasoning process**. If I conclude 'Stag' is the right move, I must conclude you will too.
  **Misconception Interception 1 ("Extra Smart"):**
  *   *When:* Immediately after introducing the shift.
  *   *Fix:* If a student says, "So I just outthink them?", stop them. Clarify: "This isn't about IQ or strategy depth. If you try to 'outsmart' the twin, you break the symmetry. It requires humility, not cleverness."
  **Misconception Interception 2 ("Telepathy"):**
  *   *When:* When they ask, "But how do they know I chose Stag?"
  *   *Fix:* Clarify: "They don't. There is no magic signal. It is a logical necessity, like knowing 2+2=4. You don't need to tell me you know 2+2=4 for us to both write '4' on our papers."

  ### 5. Refused Game-Theory Machinery
  **Do Not Use:**
  *   **Payoff Matrices:** Visual grids encourage students to calculate expected utility based on independent probabilities (P(Stag) * P(Stag)), which reinforces the standard rational failure.
  *   **Nash Equilibrium Analysis:** Naming the equilibria (Stag-Stag vs. Hare-Hare) invites them to ask "which one is stable?" rather than "which one is logically correlated?"
  *   **Bayesian Updating on the Signal:** Do not let them calculate the probability the horn was heard. The superrational move bypasses the signal probability by focusing on the agent-type probability.

  ### 6. The Verification Check (Minutes 35–40)
  **The Test:** Do not ask "What should you do?" (They will just say "Stag").
  **The Question:** "You step out of the debate club and into the cafeteria. You see a stranger eating lunch. You want to coordinate on a project (Stag) vs. working alone (Hare). You cannot talk. Are you superrationally justified in choosing the project?"
  **Correct Answer:** **No.**
  **Reasoning Required:** They must articulate that the logical correlation depends on **shared reasoning architecture**. The stranger does not share the "debate club algorithm." Without shared context/type, superrationality reverts to standard rationality (Hare). This proves they understand the *coordination logic*, not just the moral imperative to cooperate.

  ### 7. Defense of Sequence Order
  **My Stance:** **Problem-First (Trap → Solution).**
  **Alternative:** **Definition-First (Theory → Example).**
  **Defense:** High school debate students are trained to argue positions, not absorb axioms. If you define superrationality first, they will treat it as a rule to be memorized ("Oh, cooperate is the right answer"). By forcing them into the "Rational Trap" first, you create cognitive dissonance: they feel the pull of the safe Hare but see the loss of the Stag. This frustration creates the intellectual vacuum that superrationality fills. Definition-first kills the mystery; Problem-first makes the logic a tool they *need* to win.

  Verdict: Build the trap of standard rationality first to create a need for the solution, then verify understanding by breaking the symmetry condition.
