prompt: |-
  I'm a journalist covering science and ideas, and I'm preparing a feature on how abstract social-choice paradoxes survive when embedded in real-world governance technologies. For this piece, please adopt the persona of an expert in social choice theory and a professional writer of conceptual satire. Begin by thinking carefully about Amartya Sen's liberal paradox—specifically the tension between minimal liberalism (each individual holds authority over some personal sphere) and the Pareto principle (a change is socially preferred if everyone prefers it and no one is made worse off). Do some brief brainstorming first: map out exactly how this tension would manifest in a smart-building governance system where each resident holds algorithmic sovereignty over exactly one environmental parameter in their unit, but the building's central AI attempts Pareto-optimal aggregation across all interdependent units.

  Then, write a sustained satirical document: a deadpan, approximately 600-word "Terms of Residence and Algorithmic Governance" agreement for a fictional co-housing development called Pareto Commons, presented in the formal, bureaucratic voice of the community's management office. The satire should exaggerate a real feature of Sen's argument rather than inventing one—show that when every resident has a protected "liberal sphere" over precisely one domain (for example, Resident A controls lighting hue in Unit 3; Resident B controls temperature in Unit 4; Resident C controls acoustic privacy settings in Unit 5), the building's Pareto-optimal climate-and-lighting protocol is systematically blocked by unanimous preferences that cross those protected spheres. Use straight-faced legal language to describe absurd deadlock scenarios—such as a clause explaining why energy-efficient windows cannot be installed because every resident's sphere includes "the right to veto improvements that affect another resident's sphere," even when all residents genuinely prefer the upgrade. Do not quote from Sen's texts; if you reference his logic, paraphrase it without quotation marks. The target is the logical structure of combining minimal liberalism with Pareto efficiency, not any named living person.

  Make definite, committed choices: decide exactly which domains are assigned as liberal spheres, exactly which Pareto improvements are blocked, and exactly how the smart-building AI frames its failed optimization reports. After the document, append a brief author's note in which you take a clear position on whether your scenario fairly represents Sen's original formulation or whether it relies on a contested reading—for instance, whether you have implicitly adopted a particular interpretation of the "minimal" scope of liberal rights, or of how Pareto improvements should be defined across interdependent preferences. Be explicit about where you take liberties for satirical effect and where you lean on a specific reading of the paradox.

  Write in American English, maintain a formal and polished tone throughout, and do not include any bibliographies, reading lists, or citations—this should stand entirely on its own reasoning.
