answer: |-
  **Exam Question**

  **Part B: Essay (90 minutes; approx. 1,200 words)**

  Consider the following definition, referred to here as the **Standard Repair**:
  *An object $x$ is disposed at time $t$ to give response $r$ to stimulus $s$ just in case there is some intrinsic property $B$ that $x$ has at $t$ and some later time $t'$ such that, if $x$ were to undergo $s$ while retaining $B$ right up to $t'$, then $s$ together with $x$'s having $B$ would be a sufficiently complete cause of $x$'s giving $r$.*

  Now consider two cases:

  1.  **The Loan:** A drinking glass is made of a polymer that deforms rather than shatters when struck. However, it contains an embedded microscopic monitor that detects the onset of an impact. Within a microsecond of impact, the monitor reorganizes the glass's molecular structure into that of ordinary fragile glass. Consequently, the glass shatters upon being struck. Intuitively, the glass is not fragile prior to impact; its shattering is not in virtue of any fragility it possessed initially.
  2.  **The Race:** A drinking glass is ordinary fragile glass. However, it is wired to a hardening mechanism that, upon detecting an impact, would prevent shattering. The mechanism requires one microsecond to activate, but the shattering would occur within one nanosecond of the impact. Consequently, the glass shatters upon being struck before the hardening can occur. Intuitively, the glass is fragile.

  Write an essay addressing the following:
  First, explain how the Standard Repair attempts to deliver the intuitive verdicts in both cases. Second, argue whether the Repair actually *determines* these verdicts, or whether applying the Repair successfully requires us to already know the verdicts. In your discussion, focus specifically on how we individuate the intrinsic property $B$ and how we specify the retention interval $t$ to $t'$. Finally, conclude by discussing what these cases suggest about whether a disposition can be identified with its causal basis.

  *Note: No external citations or references to specific philosophers are permitted. Argue solely from the cases and the definition provided.*

  ***

  **Model Answer**

  The Standard Repair aims to salvage the conditional analysis of dispositions by anchoring them in intrinsic bases that persist through the stimulus. In both the Loan and the Race, the object shatters when struck. Yet, our intuitions diverge: the Loan glass is not fragile, while the Race glass is. A successful analysis must explain this difference without merely stipulating the result.

  In the Loan case, the intuitive verdict is that the glass lacks fragility. To align with the Standard Repair, we must claim there is no intrinsic property $B$ possessed at the start that causes shattering while retained. The initial polymer structure is a basis for deformation, not shattering. The fragility-causing structure only arises *after* the stimulus begins. If we define $B$ as the initial molecular structure, the Repair correctly says the object is not disposed to shatter, because retaining that initial structure would lead to deformation, not shattering. However, a complication arises if we individuate $B$ more broadly. If the "intrinsic property" includes the complex disposition of the monitor-polymer composite to reorganize under stress, then the object *does* have an intrinsic property that leads to shattering. If we allow this complex property to count as $B$, the Repair falsely verdicts that the glass is fragile. Thus, getting the right answer depends on restricting which intrinsic properties count as relevant bases.

  In the Race case, the intuitive verdict is that the glass is fragile. The glass possesses the molecular structure of fragile glass at the start. The hardening mechanism is extrinsic or merely prevents the manifestation. To align with the Repair, we must say the glass retains the fragile basis $B$ long enough for the shattering to occur. Since shattering takes one nanosecond and hardening takes one microsecond, the glass retains $B$ through the causally relevant interval. However, this relies on a fine-grained specification of the retention interval. If we specify the interval $t$ to $t'$ as lasting long enough for the hardening mechanism to activate, the glass fails to retain $B$, and the Repair would falsely verdict that the glass is not fragile. Thus, getting the right answer depends on how coarsely or finely we specify the time at which the manifestation must occur.

  These dependencies reveal a deeper problem. The Standard Repair does not independently determine the verdicts; rather, applying the Repair requires us to already know the verdicts. In the Loan, we must decide whether the monitor's reorganization capability is part of the basis $B$. We only exclude it because we already know the glass isn't fragile. In the Race, we must decide how long the basis must be retained. We only select the nanosecond interval rather than the microsecond interval because we already know the glass is fragile. The analysis presupposes a grip on whether the disposition survives the stimulus, which is precisely what the counterfactual analysis was supposed to explain.

  This suggests that dispositions cannot be simply identified with their causal bases under this analysis. If the identification were strict, the presence of the basis would settle the matter without needing prior intuition about the disposition. Instead, the basis is identified *relative to* the disposition. The metaphysical lesson is that the disposition is something over and above the mere presence of a causal base plus a counterfactual; it involves a normative or explanatory constraint on which bases and timeframes count. The analysis captures the structure of disposition ascriptions but fails to reduce them to non-dispositional terms, as the parameters of the analysis are fixed by the very dispositional facts they are meant to analyze.

  ***

  **Marking Scheme (Total: 20 Points)**

  **1. Correct Intuitive Verdicts (4 points)**
  *   **Award 4 points** for clearly stating that the Loan glass is intuitively *not* fragile and the Race glass *is* fragile, despite both shattering.
  *   **Common Error:** Students claim both are fragile because both shatter, missing the prompt's explicit intuitive setup.

  **2. Analysis of the Loan Case (4 points)**
  *   **Award 4 points** for explaining that the Repair works only if we exclude the monitor's reorganization capacity from the intrinsic basis $B$, noting the tension in individuating $B$.
  *   **Common Error:** Treating this merely as a "fink" case without discussing how the definition of "intrinsic property" drives the verdict.

  **3. Analysis of the Race Case (4 points)**
  *   **Award 4 points** for explaining that the Repair works only if the retention interval is shorter than the hardening mechanism's activation time, noting the tension in temporal specification.
  *   **Common Error:** Treating this merely as a "mask" case without discussing how the definition of "retention interval" drives the verdict.

  **4. The Circularity/Presupposition Point (4 points)**
  *   **Award 4 points** for arguing that we need prior knowledge of the disposition to fix the parameters of $B$ and the time interval, meaning the analysis presupposes what it explains.
  *   **Common Error:** Arguing that the Repair successfully solves the problem without noting that the solution relies on prior intuitions.

  **5. Metaphysical Conclusion (4 points)**
  *   **Award 4 points** for concluding that dispositions are not simply identical to bases because the basis identification is disposition-dependent (or that the analysis is non-reductive).
  *   **Common Error:** Concluding that dispositions and bases are identical because the Repair can be made to fit the cases with enough tweaking.
