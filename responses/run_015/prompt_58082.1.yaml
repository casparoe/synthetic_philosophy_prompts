answer: |-
  **Project Title:** The Architecture of Persistence: Causal Topology and the Normative Force of Strong Longtermism

  **Central Research Question**
  How does the causal topology of long-term interventions—specifically the distinction between self-sustaining and maintenance-dependent persistence—modulate the force of epistemic and normative objections to strong longtermism?

  **Context and Philosophical Gap**
  Strong longtermism posits that the primary determinant of the rightness of our actions is their effect on the very long-term future. The dominant dialectic surrounding this view oscillates between proponents leveraging expected value (EV) calculations to justify high-stakes interventions and critics invoking "cluelessness" to argue that long causal chains are too epistemically opaque to guide action. A secondary debate concerns risk-sensitivity and fanaticism, questioning whether agents should accept minute probabilities of astronomically valuable outcomes.

  Both sides, however, treat the causal connection between present action and future value as a monolithic function of time and probability decay. They assume that as temporal distance increases, epistemic access decreases and causal integrity degrades at a uniform rate. This prospectus challenges that assumption by arguing that the *structure* of the causal chain matters as much as its length.

  Current frameworks fail to distinguish between interventions that launch self-sustaining dynamics (e.g., altering a fundamental physical constant, releasing a self-replicating technology, or encoding information in a durable medium) and those requiring maintenance-dependent stewardship (e.g., sustaining a political institution, preserving a moral norm, or managing an endowment). In the former, the initial agency is front-loaded; in the latter, agency must be distributed across generations.

  This distinction remains unresolved in the literature because standard EV reasoning aggregates outcomes regardless of the causal mechanism required to sustain them. Similarly, cluelessness objections typically assume that all long-term predictions suffer from equal degrees of unforeseeable interference. By ignoring the topology of persistence, existing theories cannot explain why we might intuitively trust a "time capsule" intervention more than a "perpetual trust" intervention, even if their projected temporal reach is identical. Consequently, the fanaticism worry is applied indiscriminately, potentially condemning viable self-sustaining interventions while failing to address the specific fragility of maintenance-dependent projects. This project posits that separating these categories dissolves certain iterations of the cluelessness objection while sharpening the fanaticism critique for specific classes of action.

  **Investigative Strategy**
  This research will employ a non-empirical methodology grounded in conceptual analysis, modal reasoning, and the construction of normative thought experiments. The nine-month fellowship will be divided into three distinct stages.

  *Stage 1: Taxonomy and Conceptual Groundwork (Months 1–3)*
  The first stage will rigorously define the distinction between self-sustaining and maintenance-dependent persistence. A key philosophical challenge is that true "self-sustaining" action is an idealization; all physical systems degrade. The task is not to find perfect examples but to establish a spectrum of *agency-dependence*. I will develop a typology of causal topologies, analyzing the conditions under which an initial intervention loses its dependence on subsequent intentional agency. This will involve analyzing thought experiments contrasting "fire-and-forget" mechanisms (e.g., automated bio-security locks) against "gardening" mechanisms (e.g., intergenerational moral education). The output will be a formalized framework for categorizing longtermist interventions based on their requirement for future agency.

  *Stage 2: Epistemic Implications and Cluelessness (Months 4–6)*
  The second stage will apply this taxonomy to the epistemic objection. I will argue that cluelessness functions differently across the two categories. For maintenance-dependent chains, cluelessness arises from the complexity of social and political systems required to sustain the intervention; the uncertainty is endogenous to the stewardship process. For self-sustaining chains, cluelessness arises from exogenous shocks and the unpredictability of how a static intervention interacts with a dynamic environment. I will construct models of "epistemic decay" specific to each topology. The goal is to demonstrate that maintenance-dependent paths may actually offer *greater* epistemic security in some contexts because they allow for corrective feedback loops, whereas self-sustaining paths are brittle. This inverts the standard intuition that passive interventions are safer.

  *Stage 3: Normative Implications and Fanaticism (Months 7–9)*
  The final stage will address the normative weight of these findings. If self-sustaining interventions allow for high-impact outcomes with low ongoing cost, do they invite fanaticism more acutely than stewardship models? I will examine whether the "front-loading" of agency changes the risk profile of the decision. If a self-sustaining intervention has a small probability of catastrophe that cannot be recalled, does this demand a different risk ethic than a maintenance-dependent project that can be halted by future generations? The conclusion will synthesize these findings to propose a modified principle of longtermist action that weights interventions not just by expected value, but by their causal topology.

  **Illuminating Outcomes**
  A merely negative outcome would consist of showing that the distinction creates no meaningful normative difference—that epistemic decay swamps structural differences regardless of topology. An illuminating outcome, by contrast, will provide a new heuristic for longtermist decision-making.

  Success will look like a demonstrated divergence in how objections apply. For example, proving that maintenance-dependent interventions are less susceptible to the fanaticism objection because they distribute risk across time, whereas self-sustaining interventions concentrate risk at the origin. Alternatively, the research might show that self-sustaining interventions are the only viable path for certain types of value preservation, thereby insulating them from cluelessness objections regarding future political will.

  The ultimate deliverable is a refined normative framework: "Topological Longtermism." This framework would not merely add a variable to EV calculations but would suggest that the *kind* of future influence we seek constrains the *types* of ethical reasoning we may apply. It would allow proponents to concede ground on certain high-risk stewardship projects while defending specific classes of durable, passive interventions, thereby making the overall longtermist position more robust and less vulnerable to blanket skepticism.

  **Scope and Feasibility Assessment**
  The scope of this inquiry is ambitious for a nine-month period. The primary risk lies in Stage 1: defining "self-sustaining" without slipping into empirical claims about engineering or physics. There is a danger of the project becoming mired in defining edge cases where agency is ambiguous (e.g., an automated system that requires occasional power replenishment).

  To ensure realism, the project must narrow its focus. Rather than attempting a comprehensive theory of longtermist value, I will restrict the analysis to the *interaction* between causal topology and the *epistemic* objection. The normative implications regarding fanaticism will be treated as a secondary derivation rather than a full reconstruction of risk ethics. Furthermore, I will treat the "self-sustaining" category as a theoretical limit case rather than demanding empirical perfection.

  If the taxonomy proves too complex, I will narrow the investigation to a single comparative case study: the contrast between information preservation (archive) and institutional preservation (stewardship). This concrete pairing will allow for deep philosophical analysis without requiring a universal theory of causation. By focusing on the *structure of agency* required over time, rather than the *content* of the intervention, the project remains firmly within moral philosophy while offering a novel resolution to a stalled debate. The feasibility rests on maintaining this conceptual focus and resisting the urge to drift into policy analysis or empirical forecasting.
