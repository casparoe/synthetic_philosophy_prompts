prompt: |-
  Hi — hoping you can help me put something together that my committee can actually use.

  I'm the governance officer (clerk, minute-taker, and de facto rules nerd) for a professional institute of about 9,000 members. Our rulebook is amended at the AGM and at emergency general meetings — 30 or 40 substantive motions a year, plus the occasional one shoehorned in between. My job is to rule, sometimes in advance of the vote and sometimes the morning after, on whether a motion that carried actually changed the rules, or whether it's void / void in part / did something different from what the proposer thought. I then give the Rules Committee three or four paragraphs of written reasons they sign off on. Two of my rulings have ended up in front of a judge, so they can't be hand-wavy; but the committee is five lay trustees who will not sit through a lecture on self-reference, and I usually have about two days from motion to ruling.

  The bit we keep crashing into is that the rules govern their own amendment, and the drafting is a mess. Roughly:

  - Rule A1: rules may be amended by a two-thirds majority at a general meeting; A1 itself may be amended only by a three-quarters majority.
  - Rule A2: the rules in force are those printed in the current Handbook, as updated by the Secretary. The Handbook is reprinted every other year, so what members vote against and what's on the shelf are often two different texts.
  - Rule A3: if part of an amendment is void, the rest stands.
  - Rule A4: no amendment may remove an accrued right of a member. Nobody knows what accrued means here; we've been reading it as a right someone has already started to exercise.
  - Rule A5: defines who counts as a voting member.

  So: give me a decision procedure. Ordered questions, what counts as an answer to each one, where the procedure stops with a no, and where it hands the decision to the committee because it's a values call dressed up as a rule question. It has to be runnable in an afternoon with the rulebook and the minutes, and it has to handle self-referential amendments specifically — an amendment that changes the threshold it has to clear, a rule that tries to lock itself against later amendment, a motion that repeals the amending power and hands it somewhere else. Please don't just tell me these are paradoxical; I still have to issue a ruling on Monday.

  Run it on these:

  1. A motion to lower the general amendment threshold in A1 from two-thirds to a simple majority. It got 68%. Did it carry, and if so what threshold applies to next year's motions?
  2. In 2022 a motion added to Rule 14 (the subscription cap) the sentence "Rule 14 may not be amended or repealed." Passed 71%. In 2024 a motion to repeal Rule 14 outright passed 69%. What's in force now — and was the 2022 lock itself valid, given A1?
  3. A single motion, passed 78%, repealing A1 and replacing it with "the Board may amend these Rules by resolution." Do we still have a rulebook, and can a later board resolution be challenged?

  And two hard cases the procedure has to say something about: (a) the 2019 Members' Charter — a block of protections including a right to appeal expulsion, inserted by a 71% vote, with a preamble saying these are fundamental and shall not be amended; this year a 70% motion deleted the appeal right. My instinct, and the members', is that the preamble protects it. I suspect the procedure will tell me otherwise. (b) A motion to exclude retired members from voting, which passed 67% counting the retired members who voted and 61% excluding them — the amending majority depends on the content of the amendment.

  Please flag where the procedure can't settle things: rules we've all been relying on for years that were probably never validly adopted, and the printed-Handbook lag under A2. And tell me what it can't do at all. No need for citations or further reading — I want the tests and the reasons, not a reading list.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure and analysis:

  1.  **Analyze the User and Request:**
      *   **User Role:** Governance Officer (Clerk/Minute-taker/Rules Nerd) for a professional institute (~9,000 members).
      *   **Task:** Create a practical decision procedure (flowchart/checklist style) for determining the validity of rule amendments, specifically handling self-reference, conflicting thresholds, and "entrenched" clauses.
      *   **Constraints:**
          *   Must be usable by lay trustees (5 people).
          *   Must be runnable in an afternoon (2 days turnaround).
          *   Must handle specific paradoxes (self-referential amendments, locking clauses).
          *   Must address specific test cases (1, 2, 3, and Hard Cases a & b).
          *   Must flag limitations (what the procedure *can't* solve, like historical validity or Handbook lag).
          *   Tone: Professional, pragmatic, legally robust but accessible (no academic theory, just actionable tests).
          *   Context: Two previous rulings went to court, so precision matters.

  2.  **Deconstruct the Existing Rules (The "Constitution"):**
      *   *A1:* General amendment = 2/3 majority. A1 amendment = 3/4 majority. (Hierarchy of entrenchment).
      *   *A2:* Rules = Current Handbook (updated by Secretary). Lag issue (printed vs. actual).
      *   *A3:* Severability (void parts don't kill valid parts).
      *   *A4:* No removal of accrued rights (undefined "accrued").
      *   *A5:* Definition of voting member.

  3.  **Develop the Decision Procedure (The "Algorithm"):**
      *   *Goal:* A step-by-step filter. If it fails a step, stop and rule "Void" (or "Partially Void"). If it passes all, it's "Valid."
      *   *Step 1: Procedural Validity.* Was the meeting properly convened? Was the motion properly noticed? (User didn't ask for this, but it's foundational. I'll keep it brief as the prompt focuses on *substantive* rule conflicts).
      *   *Step 2: Competence.* Does the GM have the power to amend *this* rule? (e.g., if A1 says Board amends X, GM can't).
      *   *Step 3: Threshold Check (The Self-Reference Problem).* What threshold applies *at the time of the vote*?
          *   *Key Principle:* You must clear the hurdle that exists *before* you jump. You can't lower the hurdle you are currently jumping in the same jump (unless the rule allows it, which A1 implies it doesn't for itself).
      *   *Step 4: Entrenchment/Locking.* Does the rule claim to be unamendable?
          *   *Key Principle:* A sovereign body (the GM) cannot bind its successor unless the *current* constitution allows it. If A1 allows amendment of *all* rules (including locked ones) with a high enough threshold, the lock is just a higher threshold, not a ban. If A1 doesn't allow it, the lock might be void.
      *   *Step 5: Accrued Rights (A4).* Does this take away something specific someone is currently using?
      *   *Step 6: Consistency.* Does the new text contradict other standing rules?
      *   *Step 7: Publication (A2).* How does this get into the Handbook?

  4.  **Refine the Procedure for the User's Constraints:**
      *   Needs to be "Ordered Questions."
      *   Needs to identify "Stop" points.
      *   Needs to identify "Committee Decision" points (values vs. rules).
      *   *Crucial Addition:* The "Temporal Rule." The validity of an amendment is judged against the rules *in force at the start of the meeting*, not the rules as they would be if the motion passed.

  5.  **Apply Procedure to Test Cases:**

      *   *Case 1 (Lowering A1 threshold):*
          *   Motion: Change A1 (2/3 -> 50%).
          *   Vote: 68%.
          *   Test: To amend A1, you need the *existing* A1 threshold (3/4 = 75%).
          *   Result: 68% < 75%. Motion Fails.
          *   Next Year: Old threshold (2/3 for normal, 3/4 for A1) stands.

      *   *Case 2 (The Lock on Rule 14):*
          *   2022: "Rule 14 unamendable." Vote 71%.
          *   2024: Repeal Rule 14. Vote 69%.
          *   Analysis:
              *   2022 Lock: Did A1 allow a rule to be made unamendable? Usually, no. A1 says rules *may* be amended by GM. A clause saying "may not" contradicts A1. However, if interpreted as "requires 100%," it's effectively unamendable.
              *   Better view: A1 is the master key. A1 says "Rules may be amended by 2/3 (or 3/4 for A1)." A specific rule cannot override the general amending power unless A1 says so.
              *   Therefore, the 2022 "lock" is likely *void* as ultra vires (beyond the power of the GM to restrict future GMs under A1).
              *   2024 Repeal: Rule 14 is a normal rule. Threshold = 2/3 (66.6%). Vote = 69%.
              *   Result: 2022 Lock was invalid (or at least ineffective against a 2/3 vote). 2024 Repeal is Valid. Rule 14 is gone.

      *   *Case 3 (Abolishing GM Power):*
          *   Motion: Repeal A1, give power to Board. Vote 78%.
          *   Test: To amend A1, need 3/4 (75%). 78% > 75%.
          *   Result: Valid.
          *   Consequence: GM no longer has amendment power. Board does.
          *   Challenge: Can a Board resolution be challenged? Only on procedural grounds (did Board follow *new* rules?) or fiduciary duty, not on member vote threshold. The Rulebook still exists but is now Board-controlled.

      *   *Hard Case (a) (Members' Charter):*
          *   Preamble says "Fundamental, shall not be amended."
          *   Vote to delete appeal right: 70%.
          *   Test: Same as Case 2. Unless A1 explicitly recognizes "Fundamental Rules" requiring higher thresholds, the Preamble is precatory (wishful thinking), not operative.
          *   Result: If the specific rule being amended only requires 2/3, 70% passes. The "shall not be amended" is likely void against A1.
          *   *Committee Call:* Is the "right to appeal" an *Accrued Right* under A4? If someone is currently being expelled, yes. If general, probably no. This is the "Values Call."

      *   *Hard Case (b) (Voting Rights of Retired Members):*
          *   Motion: Retired members can't vote.
          *   Vote: 67% (including retired), 61% (excluding retired).
          *   Test: Who counts for the threshold? A5 defines "voting member."
          *   *The Paradox:* If the motion passes, they weren't voting members. If it fails, they were.
          *   *Resolution:* You calculate the majority based on the rules *in force at the start of the meeting*. At the start, Retired Members *were* voting members (per A5).
          *   Result: 67% counts. Motion Passes. Retired members lose voting rights *for next time*.
          *   *Risk:* A4 Accrued Rights? Is the right to vote on *this specific motion* an accrued right? Generally, no. It's a prospective right. But this is a high-risk area for litigation.

  6.  **Address the "Messy Bits" (Limitations):**
      *   *A2 Handbook Lag:* This is a legal risk. The "Rules in Force" are the resolutions, not the book. The book is evidence, not the law. Need to advise the Committee to treat the Handbook as "convenient fiction" but rely on Minutes for truth.
      *   *Historical Validity:* If a rule was passed 20 years ago with the wrong threshold, is it valid now? (Doctrine of laches/acquiescence). The procedure can't fix this. It assumes current text is valid unless challenged.
      *   *A4 "Accrued Rights":* This is the biggest "Values Call." The procedure must flag this for the Committee, not the Clerk.

  7.  **Drafting the Response:**
      *   *Structure:*
          1.  The Decision Procedure (The "Flowchart").
          2.  Application to Test Cases (1, 2, 3).
          3.  Application to Hard Cases (a, b).
          4.  Limitations & Risks (The "What I Can't Tell You" section).
      *   *Tone:* Direct, authoritative, practical.
      *   *Formatting:* Bold headers, bullet points, clear "Pass/Fail" logic.

  8.  **Self-Correction/Refinement during drafting:**
      *   *Correction on Case 2:* I need to be careful about the "Lock." If A1 allows amendment by 2/3, a rule saying "This rule cannot be amended" is a contradiction. In corporate law, a company cannot bind its statutory power to amend articles. I will treat the GM as sovereign under A1. The lock is ineffective against a compliant A1 vote.
      *   *Correction on Case 3:* If A1 is repealed, does the GM cease to exist? No, but its power changes. I need to make sure the ruling clarifies that the *Rulebook* remains, but the *mechanism* changes.
      *   *Refinement on Hard Case (b):* This is the "Bootstrapping" problem. The standard legal solution is "Status Quo Ante." Determine eligibility based on the rules *before* the change. I will codify this in Step 3 of the procedure.
      *   *Refinement on A4:* I need to explicitly tell the Clerk: "You interpret the math; the Committee interprets 'Accrued Rights'." That protects the Clerk from the values call.

  9.  **Final Review against User Prompt:**
      *   Decision procedure included? Yes.
      *   Ordered questions? Yes.
      *   Stop points identified? Yes.
      *   Test cases run? Yes.
      *   Hard cases addressed? Yes.
      *   Limitations flagged? Yes.
      *   No citations/reading list? Yes.
      *   Tone appropriate? Yes.

  10. **Final Polish:** Ensure the distinction between "Clerk's Ruling" (Procedure/Math) and "Committee Ruling" (Policy/Rights) is sharp. This protects the user. (Self-correction: The prompt asks *me* to give the procedure they can use. I will write it so they can hand it to the committee or use it to draft the reasons).

  *(Self-Correction on Case 1)*: Wait, if the motion is to amend A1, does it need the A1 threshold (3/4) or the General threshold (2/3)? The prompt says "A1 itself may be amended only by a three-quarters majority." So to change the 2/3 to 50%, you are amending A1. You need 75%. 68% fails.
  *(Self-Correction on Case 2)*: 2022 Lock. If A1 says "Rules may be amended...", can a rule say "This rule may not"? Usually, the specific amending power (A1) trumps the specific rule (14). The lock is void. 2024 Repeal needs 2/3. 69% passes.
  *(Self-Correction on Case 3)*: Repealing A1. Needs 3/4 (75%). 78% passes. A1 is gone. Board has power.

  Okay, ready to write. I will structure the "Decision Procedure" as a distinct tool they can copy-paste into their internal wiki or handbook. I will then provide the "Ruling Drafts" for the specific cases as examples of how to apply it.cw
answer: |-
  Here is a decision procedure designed for your constraints. It separates the **mathematical/procedural tests** (which you rule on) from the **policy/rights tests** (which the Committee must decide). It is built on the legal principle of *temporal validity*: the validity of a motion is judged against the rules in force at the **start** of the meeting, not the rules as they would be if the motion passed.

  ### Part 1: The Amendment Validity Procedure (AVP)

  Use this checklist for every substantive motion. If a step fails, the motion (or the offending clause) is void. If a step requires a value judgment, refer to the Committee.

  **Step 1: Competence (The "Can We?" Test)**
  *   **Question:** Does the General Meeting (GM) have the power to amend this specific rule under the *current* Rulebook?
  *   **Check:** Look for clauses that assign amendment power elsewhere (e.g., "The Board sets subscription rates").
  *   **Fail Condition:** If the power belongs to the Board or a Subcommittee, the GM motion is **Void**.
  *   **Pass:** Proceed to Step 2.

  **Step 2: The Threshold (The "Hurdle" Test)**
  *   **Question:** What majority is required to amend *this specific rule* under the rules in force **before** the vote?
  *   **Rule:** You cannot use the *new* threshold to validate the *current* vote. To lower a hurdle, you must clear the existing hurdle.
      *   If amending A1 (or any rule specifying its own threshold): Use the threshold specified in the *current* text of that rule.
      *   If amending any other rule: Use the general threshold in A1 (currently 2/3).
  *   **Calculation:** Calculate the percentage based on valid votes cast (per A5).
  *   **Fail Condition:** If Vote % < Required %, the motion is **Void**.
  *   **Pass:** Proceed to Step 3.

  **Step 3: The Lock (The "Sovereignty" Test)**
  *   **Question:** Does the rule being amended contain a "locking" clause (e.g., "This rule shall not be amended")?
  *   **Rule:** Unless A1 explicitly recognizes "locked" rules requiring a higher threshold, A1 is the master key. A simple rule cannot strip the GM of the power granted by A1.
  *   **Determination:**
      *   If the lock claims *total* immunity: The lock is **Void** (as ultra vires). Treat the rule as amendable by the standard A1 threshold.
      *   If the lock claims a *higher* threshold (e.g., "Requires 80%"): This is valid only if A1 permits variable thresholds. If A1 is silent, treat it as a warning, not a bar.
  *   **Pass:** Proceed to Step 4.

  **Step 4: Accrued Rights (The "A4" Test)**
  *   **Question:** Does this amendment remove a right a member is *currently exercising* or has *vested*?
  *   **Rule:** A4 prohibits removing accrued rights.
  *   **Clerk's Role:** Identify if a right is being removed.
  *   **Committee's Role:** Determine if that right is "accrued" under A4. (See *Limitations* below).
  *   **Fail Condition:** If Committee determines the right is accrued, the amendment is **Void** (or partially void under A3).
  *   **Pass:** Proceed to Step 5.

  **Step 5: Consistency & Severability (The "A3" Test)**
  *   **Question:** Does the new text contradict other standing rules, or is part of it void?
  *   **Rule:** If a clause is void (e.g., failed Step 2), does the rest of the motion function without it?
  *   **Determination:**
      *   If the void part is essential to the motion: Whole motion **Void**.
      *   If the void part is separable: Remainder **Valid**.
  *   **Pass:** Amendment is **Valid**. Update the "Rules in Force" (not necessarily the Handbook yet).

  ---

  ### Part 2: Application to Your Test Cases

  Here is how you apply the AVP to the scenarios you provided. You can adapt the "Ruling" text for your minutes.

  #### Case 1: Lowering the A1 Threshold
  *   **Motion:** Change A1 general threshold from 2/3 to 1/2.
  *   **Vote:** 68%.
  *   **AVP Step 2 (Threshold):** To amend A1, the *current* A1 requires 3/4 (75%).
  *   **Calculation:** 68% < 75%.
  *   **Ruling:** **Void.** The motion failed to clear the hurdle existing at the start of the meeting.
  *   **Status:** The threshold for next year remains 2/3 (general) and 3/4 (for A1). You cannot lower the bar you are currently jumping.

  #### Case 2: The Rule 14 Lock
  *   **2022 Motion:** "Rule 14 may not be amended." (Vote 71%).
  *   **2024 Motion:** Repeal Rule 14. (Vote 69%).
  *   **AVP Step 3 (The Lock):** A1 grants the GM power to amend rules. Rule 14 cannot strip the GM of the power A1 grants unless A1 allows it. A1 does not recognize "unamendable" rules.
  *   **2022 Ruling:** The "lock" clause was **Void** (or ineffective) because it contradicted A1. Rule 14 remained amendable by 2/3.
  *   **2024 Ruling:** Threshold for Rule 14 is standard (2/3 = 66.6%). Vote was 69%.
  *   **Final Status:** **Rule 14 is Repealed.** The 2022 lock did not bind the 2024 meeting.

  #### Case 3: Abolishing GM Power
  *   **Motion:** Repeal A1; Board amends Rules.
  *   **Vote:** 78%.
  *   **AVP Step 2 (Threshold):** Amending A1 requires 3/4 (75%).
  *   **Calculation:** 78% > 75%.
  *   **Ruling:** **Valid.** The GM has the sovereign power to abolish its own amendment power, provided it clears the A1 threshold.
  *   **Status:** The Rulebook remains in force, but the *mechanism* for change is now Board Resolution. Future Board resolutions can be challenged only on procedural grounds (e.g., Board didn't meet quorum) or fiduciary breach, not on member vote thresholds.

  ---

  ### Part 3: The Hard Cases

  These require you to flag the "Values Call" to the Committee.

  #### Hard Case (a): The Members' Charter (Preamble vs. Vote)
  *   **Situation:** Charter preamble says "Fundamental, shall not be amended." Motion to delete appeal right passed 70%.
  *   **AVP Step 3 (The Lock):** Unless A1 explicitly recognizes the Charter as superior to A1, the Preamble is precatory (expresses intent) but not operative. It cannot override A1's amendment power.
  *   **AVP Step 4 (Accrued Rights):** *This is the Committee Call.*
      *   **Your Advice to Committee:** "The Preamble does not legally block the amendment. However, A4 prohibits removing accrued rights. Is a 'right to appeal expulsion' accrued?"
      *   **Test:** Is there a member *currently* facing expulsion who has started the appeal process?
          *   **Yes:** The right is accrued. Amendment is **Void** regarding that member (apply A3 severability).
          *   **No:** The right is prospective. Amendment is **Valid**.
  *   **Likely Outcome:** If no one is currently being expelled, the 70% vote stands. The Preamble is ignored.

  #### Hard Case (b): Excluding Retired Members (The Bootstrap)
  *   **Situation:** Motion to exclude retired members from voting. 67% (including retired), 61% (excluding retired).
  *   **AVP Step 2 (Threshold):** Who counts as a voter? A5 defines "voting member" *as currently written*.
  *   **Rule:** Eligibility is determined at the **start** of the meeting. You cannot use the *result* of the vote to determine the *validity* of the vote.
  *   **Calculation:** At the start of the meeting, Retired Members *were* voting members. Therefore, the denominator includes them.
  *   **Ruling:** **Valid.** 67% clears the 2/3 threshold.
  *   **Effect:** Retired members lose voting rights *for future meetings*. They had the right to vote on the motion that removed their right.
  *   **Risk Flag (A4):** Is the right to vote on *this specific motion* an accrued right?
      *   **Committee Call:** Generally, voting rights are prospective. However, if a retired member can argue they relied on this right to their detriment (e.g., traveled to the AGM specifically to vote on this), A4 might be triggered.
      *   **Recommendation:** Rule it Valid based on temporal validity, but flag the A4 risk to the Committee. If they are nervous, they can ratify the decision.

  ---

  ### Part 4: Limitations & Risks (What the Procedure Can't Do)

  You must include this section in your report to the Committee to manage their expectations and protect yourself.

  **1. The Handbook Lag (Rule A2)**
  *   **The Problem:** A2 says rules are "those printed in the current Handbook." But the Handbook is 2 years out of date.
  *   **The Reality:** This is legally incorrect. The "Rules in Force" are the **Minutes of the GM**, not the Handbook. The Handbook is merely evidence.
  *   **The Risk:** If a member relies on the printed Handbook to their detriment, they may have a claim.
  *   **Your Fix:** In every ruling, state: *"The Rules in Force are the text of the Rules as amended by GM Resolutions [Year], regardless of the printed Handbook text."* Urge the Committee to authorize an interim digital update rather than waiting for the biennial print.

  **2. Historical Validity (The "Sleeping Dragon")**
  *   **The Problem:** Rules passed 10+ years ago may have been passed with the wrong threshold or procedural errors.
  *   **The Procedure's Limit:** The AVP assumes current text is valid unless challenged. It does not audit history.
  *   **The Risk:** If someone digs up a 2010 motion that passed with 55% when it needed 66%, the whole chain of amendments relying on it could be void.
  *   **Your Fix:** Add a "Ratification" clause to your minutes. *"The Committee notes that past amendments have been acted upon for years. Unless a specific challenge is lodged, the Committee treats the current text as validly adopted."* (This is laches/acquiescence, not strict law, but it stabilizes governance).

  **3. "Accrued Rights" (Rule A4)**
  *   **The Problem:** "Accrued" is undefined.
  *   **The Procedure's Limit:** I (the Clerk) can identify *what* is being removed. I cannot decide if it *counts* as accrued.
  *   **The Fix:** Your ruling must explicitly say: *"I have determined the motion removes a right. I refer to the Committee the determination of whether this right is 'accrued' under A4. If the Committee determines it is accrued, this ruling becomes Void."* This shifts the liability for the values call to the Trustees.

  **4. Self-Reference Paradoxes**
  *   **The Problem:** A motion that says "This motion cannot be repealed."
  *   **The Procedure's Limit:** As per Case 2, the AVP treats these as Void.
  *   **The Risk:** A judge might disagree if the wording is clever enough.
  *   **The Fix:** Stick to the "Sovereignty Test" (Step 3). A1 is the engine. No rule can remove the spark plug unless A1 says so.

  ### Summary for the Committee
  When you present this, say:
  1.  **This Procedure** handles the math and the hierarchy of rules.
  2.  **My Ruling** applies the Procedure to the minutes.
  3.  **Your Decision** is required only on "Accrued Rights" (A4) and "Historical Ratification."
  4.  **The Handbook** is not the law; the Minutes are. We need to fix A2 eventually, but until then, we rule based on the Minutes.

  This gives them a clear lane: they don't need to understand self-reference paradoxes; they just need to answer "Is this right accrued?" and sign off on the rest.
