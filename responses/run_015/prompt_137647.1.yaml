answer: |-
  ## The Standing Committee on Open Inquiry: Decision Protocol v1.0

  **Purpose:** To determine the granting, conditioning, withdrawal, or restoration of university platforms in a manner consistent with viewpoint neutrality, procedural justice, and the expressive limits of institutional sanction.
  **Constraints:** 30-minute deliberation window; reliance on counsel for legal thresholds; published reasons serve as precedent.

  ### Part I: The Decision Procedure

  The Committee shall proceed through the following seven steps in order. If a step yields a **STOP**, the motion to withdraw or condition the platform fails, and the default position (platform granted/restored) stands, unless a lower tariff is authorized by a subsequent step.

  **Step 1: The Authorship Condition (Threshold)**
  *   **Question:** Is there a specific, written charge brought by an identifiable body (e.g., Department Chair, Student Government, General Counsel, Ethics Board) stating the specific conduct, the proposed tariff, and a recommended expiry?
  *   **Sufficient Answer:** A signed memorandum or resolution. Diffuse petitions, social media campaigns, or anonymous complaints do not suffice.
  *   **Stop Point:** If **No**, the Committee cannot act. The demand is dismissed as diffuse pressure.
  *   **Note:** For past sanctions (restoration cases), if the original sanction lacked Authorship, it is deemed procedurally void.

  **Step 2: The Conduct/Content Filter (Jurisdiction)**
  *   **Question:** Can the charge be described entirely as verifiable *conduct* (fraud, harassment, breach of contract, violation of research ethics, criminal conviction) without reference to the truth or falsity of a scholarly claim?
  *   **Sufficient Answer:** Counsel confirms the conduct violates existing university policy or law independent of its viewpoint.
  *   **Stop Point:** If **No** (the charge relies on the offensiveness or falsity of an idea), the Committee must grant the platform. We do not sanction content.
  *   **Value Hand-off:** If the line between "harmful speech" and "harassment conduct" is unclear, Counsel decides.

  **Step 3: The Counterfactual-Audience Test (Pretext)**
  *   **Question:** Would this individual have been invited to this specific platform *but for* the conduct complained of?
  *   **Sufficient Answer:** Evidence that the invitation was extended prior to the conduct becoming public, or that the conduct is being cited selectively compared to others with similar records.
  *   **Stop Point:** If **Yes** (the conduct is a pretext for excluding a view that was previously welcome), the Committee must grant the platform to avoid selective enforcement.

  **Step 4: The Separability Test (Scope)**
  *   **Question:** Is the objectionable conduct separable from the function of the invited role?
  *   **Sufficient Answer:**
      *   *High Separability:* Conduct is unrelated to the topic or role (e.g., tax fraud vs. poetry reading).
      *   *Low Separability:* Conduct undermines the specific capacity to fulfill the role (e.g., data fabrication vs. science lecture; breach of research trust vs. health study keynote).
  *   **Implication:** High Separability limits tariffs to *Censure* or *Conditioning*. Low Separability permits *Withdrawal*.

  **Step 5: The Collateral-Bearer Test (Harm)**
  *   **Question:** Who bears the primary cost of the platform proceeding?
  *   **Sufficient Answer:** Identification of specific stakeholders (students, research subjects, victims of prior conduct).
  *   **Implication:** If the cost falls on vulnerable parties not responsible for the conduct (e.g., research subjects losing trust), the Committee must prioritize *Conditioning* or *Withdrawal* to protect them. If the cost falls mainly on the speaker (loss of prestige), *Withdrawal* is more permissible.

  **Step 6: Tariff Scarcity & Equivalence (Selection)**
  *   **Question:** What is the minimum sanction necessary to address the conduct without degrading the value of the platform itself?
  *   **Sufficient Answer:** Selection from the Tariff Ladder (see Part II).
  *   **Constraint:** The sanction must be denominated in the same currency as the advantage gained (e.g., do not ban from campus for a minor social media infraction; do not remove a named honorific for a procedural delay).

  **Step 7: The Reply-and-Return Route (Restoration)**
  *   **Question:** What specific action allows the individual to regain ordinary standing, and who certifies it?
  *   **Sufficient Answer:** A defined act (apology, restitution, completion of training, passage of time) and a specific certifier (Committee, Ethics Board).
  *   **Constraint:** No sanction above *Censure* may be indefinite. An expiry date must be set at the time of sanction.

  ---

  ### Part II: The Tariff Ladder

  Every tariff above Level 1 must include an **Expiry Date** and a **Review Mechanism**.

  1.  **Published Censure:** The Committee issues a statement clarifying that the platform does not constitute endorsement.
      *   *Condition:* Minor conduct violations; High Separability.
      *   *Expiry:* None (Statement is historical).
  2.  **Conditioned Platform:** The event proceeds but requires a designated respondent, a published rejoinder, or a mandatory open Q&A moderated by a neutral third party.
      *   *Condition:* Contentious but protected speech; Moderate Collateral risk.
      *   *Expiry:* Applies only to the specific event.
  3.  **Dated Postponement:** The event is rescheduled to a date no sooner than [X] months, allowing for cooling off or remediation.
      *   *Condition:* Need for procedural clarity; Moderate Separability.
      *   *Expiry:* Automatic restoration after date passes.
  4.  **Withdrawal of Invitation:** The specific invitation is rescinded.
      *   *Condition:* Low Separability; High Collateral risk to others; Verified Conduct.
      *   *Expiry:* 1 to 3 years (eligible to be invited again).
  5.  **Removal of Named Honorific:** The individual's name is removed from a lecture series or building.
      *   *Condition:* Severe conduct (felony, egregious ethical breach) that permanently stains the honorific.
      *   *Expiry:* 5 years (review for potential restoration of name if rehabilitation is evident). *Note: This overrules the "no end date" precedent.*

  ---

  ### Part III: Alignment with Precedents

  To ensure continuity, this Protocol adopts the following stance on prior rulings:

  1.  **Visiting Scientist (Data Fabrication):** **FIT.**
      *   *Reasoning:* Fraud is verifiable conduct (Step 2). Low Separability (Step 4: science lecture requires scientific integrity). Withdrawal (Tariff 4) is appropriate.
  2.  **Contested Philosopher (Social Argument):** **FIT.**
      *   *Reasoning:* Charge was content-based (Step 2 Stop). Conditioning (Tariff 2) was the correct maximum response to community concern without violating neutrality.
  3.  **Fraudulent Donor (Name Removal):** **PARTIAL OVERRULE.**
      *   *Reasoning:* Removing the name fits Tariff 5 (Conduct: Fraud). However, the "no end date" violates the **Authorship Condition** and **Reply-and-Return Route**.
      *   *Correction:* Future removals of honorifics must carry a 5-year review clause. The Committee cannot impose eternal civil death without a mechanism for redemption.

  ---

  ### Part IV: Application to Live Cases

  #### Case 1: The Avian Cognition Researcher (Famine Minimisation)
  *   **Facts:** External researcher. Charge: 3-year-old posts minimizing a famine. Talk: Avian cognition. Students need the talk.
  *   **Procedure Run:**
      1.  *Authorship:* Student Society brought the charge. (Pass)
      2.  *Conduct/Content:* Minimizing a famine is a scholarly/historical claim. Unless it violates a specific harassment policy (unlikely for 3-year-old posts), this is **Content**. (Step 2 **STOP**).
      3.  *Separability:* High. Birds vs. History.
      4.  *Collateral:* Graduate students lose unique training opportunity.
  *   **Ruling:** **Grant Platform with Conditioning (Tariff 2).**
      *   *Action:* The lecture proceeds. The Committee requires a published introductory statement contextualizing the speaker's work and offering a rebuttal forum on the historical claims elsewhere on campus.
      *   *Closest Precedent:* Contested Philosopher.
      *   *Principle if we went the other way:* If we disinvite, we adopt the principle that *past speech unrelated to current expertise forfeits future platform rights*, effectively allowing diffuse reputational accountability to override viewpoint neutrality.
      *   *Committee Friction:* This will be disliked by members concerned with the moral signal sent to famine victims. The procedure forces this because we lack a conduct hook.

  #### Case 2: The Faculty PI (Criminality Claims & Health Study)
  *   **Facts:** Internal Faculty. Charge: Videos asserting minority criminality. Role: PI on study recruiting that minority. Demand: Drop as Keynote, bar from venues.
  *   **Procedure Run:**
      1.  *Authorship:* Research Ethics Board/General Counsel. (Pass)
      2.  *Conduct/Content:* While the videos are speech, the *conduct* is the breach of fiduciary trust required for federally funded human subjects research. Publicly disparaging the recruitment pool undermines the study's viability and violates research ethics protocols. (Pass).
      3.  *Counterfactual:* He was invited *as* the PI. (Pass).
      4.  *Separability:* Low. His public stance directly compromises his professional capacity to lead the study.
      5.  *Collateral:* The minority participants bear the cost (erosion of trust/safety).
  *   **Ruling:** **Withdraw Invitation (Tariff 4) + Dated Bar.**
      *   *Action:* Removed from Research Showcase Keynote. Barred from *public-facing* university venues for 2 years. Academic teaching continues (protected sphere).
      *   *Closest Precedent:* Visiting Scientist (Data Fabrication) — integrity of research function.
      *   *Principle if we went the other way:* If we retain him, we adopt the principle that *faculty research ethics are subordinate to faculty free speech rights*, potentially jeopardizing federal funding and participant safety.
      *   *Committee Friction:* This will be disliked by Faculty Senate representatives on the committee. It treats research ethics as a conduct constraint on speech.

  #### Case 3: The Indefinitely Postponed Scholar (Restoration)
  *   **Facts:** Disinvited 4 years ago. Indefinite postponement. No original charge. Apology issued (disputed). Nominated for office.
  *   **Procedure Run:**
      1.  *Authorship:* **FAIL.** The original sanction had no identifiable body, no written charge, no tariff, no expiry.
      2.  *Protocol Mandate:* Under Step 1 and Step 7, an indefinite sanction without authorship is procedurally void. It constitutes "unauthored punishment."
      3.  *Current Status:* The apology exists, even if disputed. The "Reply-and-Return" route was never defined, so it cannot be said to be unfulfilled.
  *   **Ruling:** **Restore Platform (Tariff 0).**
      *   *Action:* The postponement is lifted. The scholar is eligible for the society office and the hosted meeting. The Committee issues a statement acknowledging the procedural error of the original 4-year-old decision.
      *   *Closest Precedent:* **None (This overrules the practice of indefinite postponement).**
      *   *Principle if we went the other way:* If we maintain the ban, we adopt the principle that *the Committee possesses plenary power to impose civil death without due process, and that time served under illegitimate sanctions does not count.*
      *   *Committee Friction:* **This is the recommendation the majority will dislike.** It requires admitting institutional wrongdoing. It rewards a scholar whose apology is viewed as insincere ("misunderstood"). It forces the Committee to prioritize its own procedural legitimacy over the substantive comfort of the community. The procedure forces this because the **Authorship Condition** and **Reply-and-Return Route** make the original sanction null; we cannot ratify a void act by refusing to cure it.

  ---

  ### Part V: Limitations and Misfires

  This procedure is a tool, not a truth machine. It will misfire in the following ways:

  1.  **The Evidence Gap:** We have 30 minutes and no subpoena power. We must rely on Counsel's summary of "conduct." If Counsel says "This is harassment," we treat it as fact. If Counsel is risk-averse, the Conduct/Content filter will skew toward censorship to avoid liability. The procedure assumes Counsel's definition of conduct is neutral; it often is not.
  2.  **The Jurisdictional Stretch:** We are sanctioning non-members (Case 1) based on external conduct. We claim authority over their "platform" but not their employment. This creates a zone of *liminal punishment* where we are powerful enough to ruin a visit but not powerful enough to offer tenure or due process. The procedure masks this power imbalance by focusing on "tariffs."
  3.  **The Judgment Call in Disguise:** Step 4 (Separability) is the leak in the hull. Determining whether "famine minimization" contaminates "avian cognition" is not a fact; it is a judgment about the unity of the scholar's persona. A determined committee can always find Low Separability if they want to punish. The procedure cannot stop bad faith actors, only constrain good faith ones.
  4.  **The "Conduct" Fiction:** In Case 2, we treat "asserting criminality" as a breach of research ethics (conduct) rather than a view (content). This is a necessary legal fiction to protect the university, but philosophically, it is thin. We are punishing the *consequences* of the speech, which is often indistinguishable from punishing the speech.
  5.  **Restoration Friction:** The procedure mandates expiry (Step 7). In high-profile cases, public memory outlasts the expiry date. When the 2-year bar ends, the public may view the restoration as a new scandal. The procedure protects the *rule*, not the *reputation*.

  **Final Note on Indefinite Postponement:**
  You asked specifically about this. The procedure classifies indefinite postponement without charge as **Procedurally Void**. It is unauthored punishment. To continue it is to lie about the nature of the Committee's power. Case 3 forces you to choose between the comfort of exclusion and the integrity of the Committee's own rules. The procedure dictates you choose the rules.
