answer: |-
  Look, given where we both come from, you know I share your exhaustion with methodologies that only work when you already know how the story ends. You want a tool for the fog of war, not a eulogy, and that constrains the spec immediately. Here is the list of requirements I think a usable appraisal rule needs, starting with the non-negotiables. First, it must maintain a strict level distinction between the health of the programme and the rationality of working within it. This is non-negotiable because you specifically flagged the case where a programme looks degenerating but there is no rival to defect to. If the rule tells you to abandon a field because the core is stagnating, but every other field is worse, the rule has failed your career decision context. It needs to output two variables: programme vitality and individual allocation strategy. Second, it must be cost-sensitive regarding empirical tests. This is non-negotiable to handle your priced-out programme where the next decisive test costs a billion dollars. A rule that declares a programme degenerate because it hasn't produced a crucial experiment in thirty years is useless if the only experiment available requires a collider we can't build. The metric must weight progress by the feasibility of the tests required to demonstrate it. Third, it must penalize uncorrected multiple testing. This is non-negotiable to kill the shotgun programme that emits thousands of predictions and reports the hits. Any rule that doesn't demand a penalty for the size of the prediction space is just measuring luck.

  Now for the prejudices, the things I think are optional depending on your epistemic values. The requirement that a programme must cash out in novel predictions rather than accommodating old data is prejudicial. You suspected this, and you are right. While novel prediction is the gold standard for avoiding overfitting, your black-box programme case shows that high hit rates on novel predictions from an ML system might be sufficient for funding even if the core is unintelligible. Insisting on an articulated hard core plus protective belt is also prejudicial, and borders on tautological as you noted, because any successful theory can be reconstructed post-hoc to look like it had a hard core. For the zombie programme where practitioners think the core is false but the predictions land, the rule needs to allow for instrumental validity without ontological commitment. If we make realism non-negotiable, we lose quantum mechanics circa 1925. Similarly, for the absorber programme that explains rival successes as limiting cases, we cannot simply forbid absorption as ad hoc. It is only degenerate if the absorption yields no new testable content. So the prejudice lies in demanding mechanistic explanation over predictive accuracy, or novelty over unification, when sometimes unification is the only progress available.

  Here is where the list fights itself. The pair of requirements that cannot be jointly satisfied are real-time verdicts and immunity to premature declaration. You want the rule to say something defensible now, but you also know that programmes revive. If you set the threshold for degeneration low enough to catch wasting resources early, you will kill black swan programmes before they mature. If you set it high enough to allow for revival, you will fund zombies for decades. This tension is genuine and not resolvable within the rule itself; it is a risk tolerance parameter external to the methodology. Furthermore, anti-gaming and applicability pull in opposite directions. To prevent the shotgun effect, you need pre-registration or strict accounting of failed tests, but if you make the metric too explicit, scientists will optimize for the metric rather than truth. If you hide the metric to prevent gaming, you lose applicability because the panel cannot verify the score. This makes the whole enterprise look self-defeating because any static rule becomes a target for Goodhart's law once it determines funding. The system requires a meta-rule that changes the appraisal criteria periodically, but that undermines the stability needed for long-term career planning.

  If I had to pick the single requirement that knocks out the most candidates, it is operationalizability in real-time without hindsight bias. Most philosophical specs, including Lakatos's, fail here because they rely on identifying a "progressive problem shift" which is often only visible after the shift has paid off. Distinguishing a protective belt adjustment from an ad hoc rescue is trivial in history and impossible in the present. This requirement kills almost every existing methodology because they all smuggle in future knowledge to validate the past.

  As for how the classics stack up against this spec, Lakatos's MSRP gets the structure right with the hard core and protective belt, but it fails the real-time test because identifying a degenerating problem shift requires knowing which anomalies will remain unresolved. Popper's falsificationism is too brittle for your grant panel; it would defund the priced-out programme immediately for lacking a decisive test and cannot handle the black-box ML case where falsification is statistically probabilistic rather than logical. A straight expected-value-of-information Bayesian rule is theoretically ideal for the career decision and handles the no-rival case well by comparing relative expected utility, but it fails the operationalizability requirement because humans cannot compute the necessary priors and likelihood ratios without succumbing to overconfidence. You are left with a hybrid that uses Bayesian intuition for the career move and a Lakatosian heuristic for the programme status, while acknowledging both will be wrong half the time.
