answer: |-
  There is no single established term that carves out exactly the pattern you have described. Your friend pointed you toward the general neighborhood—**Best Candidate Theory** (associated with Harold Noonan and David Wiggins) and the **No-Competitor Principle** (sometimes called the "Only *x* and *y* Principle")—but those frameworks discuss rivals generally. They do not typically isolate the specific metaphysical weight of *discarded matter* waiting in a shed.

  Standard philosophy treats the reassembled ship as a rival candidate. It does not usually analyze why the *potential* for that rival (the stacked timbers) weakens the continuous ship's identity *before* the rival is complete, nor why the *type* of reassembly (boat vs. barge) matters so critically. Your intuition that this is distinct from vagueness is correct: vagueness implies a blurry boundary along a spectrum of replacement; you are describing a binary switch flipped by external context.

  Since the established vocabulary lumps this under "extrinsic determinants of identity" without naming the specific mechanism of the waste matter, I will give you the name and definition you asked for, and then perform the carving.

  ### The Name: **The Latent Rival Condition**

  **Definition:** *The identity persistence of a continuously maintained object is extrinsically vulnerable to the existence of a discontinuous rival constructed from the original object's discarded matter, provided that rival satisfies the original sortal concept (e.g., "boat") and emerges within a temporal window that allows for overlapping claims.*

  ### One Phenomenon or Two?

  It is **one phenomenon**. What you call the "recollection effect" is merely the trigger for the "competition effect."

  Here is the carving: The "pull" you feel toward the shed timbers is not a mystical attachment to the wood itself (Material Essentialism), because that pull vanishes if the wood is made into a barge. The pull exists *only* when the wood is arranged to present itself as a **Sortal Match**. Therefore, "Recollection" does no work on its own. It only matters insofar as it creates a **Candidate**.

  If the timbers are stacked but never assembled, there is no rival boat, only a pile of wood. The continuous boat remains the original. If they are assembled into a barge, there is a rival object, but not a rival *boat*. The continuous boat remains the original. The identity claim weakens *only* when the discarded matter achieves **Candidate Status**. Thus, Recollection is subservient to Competition.

  ### Distinction from Your Friend's Three Deflations

  1.  **Vs. 4Dism (Perdurantism):**
      *   *Friend's View:* The boat is a spacetime worm. The continuous boat and the reassembled boat are two different worms. There is no identity conflict, only a naming convention.
      *   *Why it fails:* 4Dism cannot explain why the *continuous* worm's identity feels compromised by the *other* worm's existence. In 4Dism, the continuous worm exists regardless of the shed. Your intuition (and the Latent Rival Condition) posits that identity is not intrinsic to the worm but relational. If a rival worm branches off from the same matter, the continuous worm's claim to be *the* original becomes indeterminate or false.
  2.  **Vs. Vagueness:**
      *   *Friend's View:* There is no sharp line where the boat stops being the boat.
      *   *Why it fails:* As you noted, the judgment flips non-monotonically. You can replace 90% of the wood and have 100% identity confidence (if burned), then replace 90% and have 50% confidence (if stored), then replace 90% and have 100% confidence again (if stored but made into a barge). Vagueness tracks quantity; the Latent Rival Condition tracks *context*.
  3.  **Vs. Degrees of Sameness:**
      *   *Friend's View:* Sameness comes in degrees.
      *   *Why it fails:* "Degrees" implies the boat is 0.8 "the same." The Latent Rival Condition implies the boat is "the same" *unless* a specific condition is met, at which point the concept of "the same" fractures. It is a structural failure of the identity relation, not a dilution of it.

  ### Addressing the Edges

  You asked where the boundaries lie. Under the Latent Rival Condition, here is how the edge cases resolve:

  **1. Instant Reuse (No Interval in the Shed)**
  *   *Scenario:* Every discarded timber becomes part of some other boat the instant it is removed.
  *   *Verdict:* **The Effect Does Not Survive.**
  *   *Reasoning:* The Latent Rival Condition requires **Candidate Emergence**. If the timber is immediately absorbed into another working vessel, it loses its individual association with the *original* assembly. It becomes part of a different continuous process. There is no "stash" of original identity waiting to be reactivated. The continuous boat retains its claim because no single rival candidate coalesces from the waste.

  **2. Copying (New Material, Inherited Arrangement)**
  *   *Scenario:* The shed timbers are not reused, but copied. A new boat is built from new wood using the exact shape of the old wood.
  *   *Verdict:* **The Effect Does Not Survive.**
  *   *Reasoning:* This tests **Material Essentialism**. The Latent Rival Condition relies on the intuition that the *matter* carries the historical identity. If the matter is new, the "pull" vanishes. People may call the copy a "replica," but they will not say the continuous boat has lost its status. This proves the phenomenon is not about *Form* (the shape/arrangement) but about *Matter* (the specific timbers).

  **3. Retroactive Truth (Does it make the past false?)**
  *   *Scenario:* We sail the boat for ten years, calling it "The Original." Then, in year eleven, the shed timbers are assembled into a rival boat.
  *   *Verdict:* **It Makes the Earlier Claim False (or Indeterminate).**
  *   *Reasoning:* This is the hardest bullet to bite, but it is required by the logic. Identity is a tenseless relation. If the emergence of a rival in year eleven proves that there was no *unique* successor to the original boat, then it was *always* true (even in year one) that the identity relation was branching. We did not *lose* the identity in year eleven; we *discovered* in year eleven that we never had a exclusive claim to it. The statement "This is the original boat" was false when we made it, because the conditions for unique identity were already vulnerable.

  ### What Falls Outside This Concept?

  To ensure the definition is tight, here is what **does not** count as the Latent Rival Condition:

  1.  **Simple Degradation:** If the boat rots and falls apart, and we build a new one from new wood, that is standard replacement, not latent rivalry.
  2.  **Souvenir Scattering:** If the discarded timbers are sold to tourists as coasters, there is no rival candidate. The matter is dispersed, not collected.
  3.  **Functional Absorption:** If the timbers are burned to power the forge that makes the nails for the *same* boat, the matter is recycled into the self-same object. No rival exists.

  ### Summary for Your Argument

  You can tell your friend that you are not arguing about Vagueness or 4Dism. You are arguing for **Extrinsic Determination of Identity via the Latent Rival Condition.**

  The core of your position is this: **Identity is not a property of the object; it is a status granted by the absence of valid competitors.** The "shed" matters because it represents a *potential* competitor. The "barge" fails because it is an *invalid* competitor (wrong sortal). The "instant reuse" fails because it prevents *coalescence*.

  Your friend's error is treating the boat's identity as intrinsic (something the boat *has*). Your observation proves identity is relational (something the boat *holds* against challengers). When the challenger is made of the boat's own skin, the hold slips.
