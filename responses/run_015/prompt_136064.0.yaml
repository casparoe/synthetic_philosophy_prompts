answer: |-
  Modern parliamentary design presupposes that legitimate governance requires subordinating individual representative judgment to coherent party mandates, a structural logic Simone Weil's critique dismantles as inherently hostile to truth because it substitutes collective pressure for conscience, ultimately demanding a scale of local rootedness that renders her alternative incompatible with the modern federal state without radical decentralization. The two-layer mechanism of pre-selection and whipping operates on the assumption that individual reason is too volatile or susceptible to local capture to sustain national policy coherence, thereby locating legitimacy in the electoral victory of a party platform rather than the deliberative integrity of the representative. Pre-selection filters candidates for loyalty to the party structure before they enter office, while whipping enforces that loyalty during governance, creating a closed loop where the representative's duty is to the party apparatus rather than to the truth of the matter at hand. Weil's critique targets the interaction between these mechanisms because they collectively instantiate the party system, which she argues inevitably manufactures artificial collective passions that displace rooted, local deliberation with abstract party loyalty. While whipping is the active suppression of thought, pre-selection ensures the pool of representatives is already conditioned to accept such suppression, making the system itself the object of her condemnation rather than either mechanism in isolation. Regarding scalability, Weil's proposal for non-partisan association relies on the capacity for direct attention to specific realities, which diminishes as political units expand and decisions become increasingly abstract. Therefore, implementing her vision at the scale of a modern federal state would require a restructuring of sovereignty toward small, autonomous units capable of genuine deliberation, suggesting her model is structurally anachronistic for large-scale administration unless the central state's authority is drastically reduced to match the limits of human attention and rootedness.
