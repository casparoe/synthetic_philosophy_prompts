prompt: |-
  Consider the institutional design of modern parliamentary democracy, where voters elect individual representatives who are then bound by party discipline (whipping) and where candidates are pre-filtered through party-controlled selection mechanisms (primaries, nominations, or caucuses). What theory of political judgment and democratic legitimacy does this two-layer structure presuppose: that individual reason is unreliable without collective strategic coordination, that representation requires mediated selection, or something else? Now apply Simone Weil's critique of political parties—specifically her claim that they manufacture artificial collective passions that displace rooted, local deliberation, and her proposal to replace them with direct, non-partisan association—not to parties as an abstraction, but to these two specific mechanisms. Does her critique primarily target the whipping of votes, the pre-selection of candidates, or the interaction between them? And if one took Weil's alternative seriously at the scale of a modern federal state, does it require a political unit small enough to make her view anachronistic, or can it be extended consistently? Lead with your bottom line in the first sentence, then give the reasoning, with no preamble and no restating of the question.
