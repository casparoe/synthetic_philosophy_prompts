      *   **Commitment 3: The Divided vs. Unified Self:** Analyze the "autopilot" vs. "deliberative" self. The regulations treat the *professional persona* as a unified agent who must integrate both modes. It's not that the autopilot self is blameless, but that the *managerial* self failed to monitor the autopilot.
