answer: |-
  This is a spicy package. Reading groups love this stuff because it's internally radical but has enough surface-level friction to keep the debate going for an hour. You've correctly spotted the fault lines, but some are structural earthquakes and others are just cosmetic cracks.

  Here's the breakdown of your tensions, ranked by how likely they are to sink your argument, with advice on what to sacrifice.

  ### 1. The Careerism Contradiction (Severity: Critical)
  **The Clash:** (1) & (2) vs. (3)
  You're building a system that systematically exterminates career politicians (sortition prevents legislative careers; term limits cap executive careers), but you claim career politicians are *essential* for accountability. If your system makes the "essential component" impossible to exist, your system shouldn't work by your own logic.

  *   **Why it hurts:** This isn't just a philosophical niggle; it's a functional bug. If voters need a "stable target for blame," but the target rotates every 18 months (legislature) or is forced out after 10 years (executive), you've removed the stability required for your own theory of accountability.
  *   **Cheapest Drop:** **Drop (3).** It is much easier to develop a new theory of accountability than to redesign your whole system to allow careerism. You can argue accountability comes from *transparency* and the *recall mechanism*, not from the politician's desire to be re-elected. There's a decent amount of literature suggesting "retrospective voting" (blaming incumbents) is actually pretty blunt and often fails anyway.
  *   **Literature Status:** **Contested.** There is no consensus that careerism aids accountability. Some argue it creates entrenchment and principal-agent drift. You're safe arguing against careerism, provided you offer an alternative accountability mechanism (like your recall idea).

  ### 2. The Competence Contradiction (Severity: High)
  **The Clash:** (4) vs. (5)
  You claim legitimacy is *purely* procedural (competence is irrelevant), but then you carve out an exception for city councils specifically because random citizens lack *competence/expertise*. If competence doesn't matter for legitimacy nationally, why does it suddenly matter locally? If random citizens are "legitimate" despite being incompetent at war and taxes, why are they illegitimate for zoning and trash collection?

  *   **Why it hurts:** It makes your justification for (5) look like an ad-hoc fix rather than a principle. It suggests you don't actually believe (4) all the way through.
  *   **Cheapest Drop:** **Modify (4).** Pure proceduralism is a hard sell. It's cheaper to adopt a "hybrid" view: *Selection* is procedural, but *function* requires minimum competence. Or, flip it: Drop (5) and argue local councils can *also* be sortitive, supported by professional civil servants. (Many sortition advocates argue local issues are actually *more* suited to random citizens because they are less ideological).
  *   **Literature Status:** **Contested.** Epistemic democracy (competence matters) vs. Pure Proceduralism is a classic fight. Neither side has won. However, claiming competence matters *only* at the local level is a niche position you'll need to defend specifically.

  ### 3. The Recall vs. Fairness Tension (Severity: Medium)
  **The Clash:** (1) vs. (4)
  You asked about this specifically. Yes, there is a tension. If legitimacy is *purely* about fair selection (4), then what a representative *does* (like missing sessions) shouldn't affect their legitimacy, only their selection did. By adding a recall mechanism based on performance (attendance), you are implicitly admitting that output/behavior matters for legitimacy, not just input.

  *   **Why it hurts:** It weakens the philosophical purity of (4). A hardline proceduralist would say, "Once selected fairly, they are the people. Firing them undermines the sortition."
  *   **Cheapest Drop:** **Tweak (4).** Clarify that legitimacy is procedural for *entry*, but *retention* requires meeting basic contractual obligations (like showing up). This moves you from "Pure Proceduralism" to "Procedural Selection + Performance Retention." It's a small semantic shift that saves the mechanism.
  *   **Literature Status:** **Settled (mostly).** Almost no one argues for *pure* proceduralism without any performance conditions. Even in sortition theory, there's usually a discussion about "duty" and removal for cause. You won't get hammered for this if you phrase it carefully.

  ### 4. The Sortition vs. Term Limits Question (Severity: None)
  **The Clash:** (1) vs. (2)
  You asked if these actually conflict. **They dissolve on inspection.**
  (1) creates a legislature that isn't elected. (2) places limits on *elected* office. Since sortitive pods aren't elected, (2) doesn't apply to them. Furthermore, since (1) already bans re-selection, a 10-year term limit is redundant for the legislature anyway (18 months is well under 10 years).

  *   **The Catch:** The only friction is if you define "office" in (2) broadly enough to include sortitive roles. If you do, (2) is still redundant because (1) already prevents a career.
  *   **Advice:** Keep them. They target different branches. (2) handles the Executive/Mayors (who are elected), (1) handles the Legislature (which is not). This makes your system a "Mixed Constitution," which is a very defensible historical position.
  *   **Literature Status:** **Settled.** Term limits apply to terms; sortition has no terms to limit in the same way. This is a category error, not a conflict.

  ### Summary for the Reading Group

  If I were you, I'd walk in with this narrative to smooth over the cracks:

  1.  **On Careerism:** Admit (3) was phrased too strongly. Reframe it: "We need *stable institutions* for accountability, not necessarily *career individuals*." This lets you keep the term limits and sortition while acknowledging the need for someone to blame (e.g., the Pod as a collective, or the Executive).
  2.  **On Competence:** Don't defend "competence doesn't matter." Defend "competence is not the *source* of legitimacy." You can say legitimacy comes from the random selection, but *effectiveness* requires expertise—which is why you keep elected locals (who can hire experts) or why the national pods have staff.
  3.  **On Recall:** Frame recall not as a judgment on legitimacy, but as a "contract enforcement" mechanism. You were selected fairly, but you broke the attendance contract.

  **The biggest trap:** Don't let them pin you down on why national governance is "simple enough" for random citizens (1) while local governance is "too complex" (5). That's the easiest target for them to shoot at. Be ready to explain why national politics is more about *values* (which anyone has) and local politics is more about *technical constraints* (which requires expertise). That's a defensible distinction, but you have to make it explicit.
