answer: |-
  The prediction engine hummed, a sound like bees trapped in a server rack. It spat out sheets of thermal paper, cascading into bins labeled *Actualized* and *Discarded*. In this room, counterfactuals weren't philosophical ghosts; they were waste paper.

  Elara stood over the negotiation table, a single sheet pinned between her fingers. Across from her, General Kael's hand rested near the red keypad under the table. The ceasefire hung by a thread of syntax.

  "If we sign the treaty, the war stops," Elara said. Her voice was flat, indicative.

  Kael's eyes narrowed. He looked at the sheet, then at the bin overflowing with discarded timelines behind her. Every sheet looked identical. Every sheet contained a truth, but only one contained *the* future.

  "Which printout is that?" Kael asked.

  "The one where peace holds," Elara replied.

  "But are you holding the *command* or the *simulation*?" Kael's finger tightened on the keypad. "In your machine, every possibility is printed. You could be reading me a discarded branch. You could be saying, 'In the timeline where we sign—which we are rejecting—the war stops.' That is a counterfactual, Elara. It implies the signing does not happen."

  Elara blinked. The engine whirred, ejecting a new timeline where the negotiation failed and the city burned. It landed in the *Discarded* bin with a soft slap.

  "If I meant counterfactual," Elara said, "I would show you the bin."

  "But you haven't committed to the stack," Kael snapped. "You're speaking indicatively about a conditional future, but I don't know if the condition is met. Are we on the path where I sign? Or are you just showing me what I lose by refusing?"

  The ambiguity was lethal. If Elara was describing the *Actualized* timeline, signing brought peace. If she was describing a *Discarded* timeline using indicative grammar merely to describe its internal logic, then the actual future was one where they didn't sign, and the war continued. If the war continued, Kael needed to strike first.

  "My grammar is not the problem," Elara said, her voice rising. "Your ontology is."

  "My ontology keeps my people alive!" Kael stood. The keypad beeped—a warning tone. "If you are pointing to a ghost, I fire. If you are pointing to the road, I sign. But the paper doesn't say which it is."

  Elara looked at the sheet. It said *Peace*. But without the *Actualized* stamp, it was just a story about peace. A true story about a future that wouldn't happen.

  She reached behind her and grabbed the overflowing *Discarded* bin. With a grunt, she upended it. Hundreds of sheets cascaded onto the floor—timelines where she resigned, where Kael defected, where the engine melted down.

  The sheet in her hand was the only one left floating in the air.

  "There are no other branches," Elara said. "This isn't a conditional anymore. It's the only paper left."

  Kael stared at the blizzard of rejected futures swirling around their ankles. He looked at the single sheet in her hand. The ambiguity collapsed. There was no counterfactual left to compare it to.

  He moved his hand from the keypad to the pen.

  "Sign it," he whispered. "Before the engine prints another lie."
