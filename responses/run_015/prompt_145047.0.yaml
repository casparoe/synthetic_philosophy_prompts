      *   **Key Assumptions:**
          1.  **Bayesian Rationality:** Agents update beliefs according to Bayes' rule.
          2.  **Common Prior:** They started with the same probability distribution over states of the world before receiving private information.
          3.  **Common Knowledge of Posteriors:** Each knows the other's belief, knows the other knows, etc. (This implies honest communication).
