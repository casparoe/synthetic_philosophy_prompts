answer: |-
  **The Scenario**
  Set up a standard two-armed bandit task with an unexpected contingency reversal: a subject faces two levers, where pressing Lever A yields a reward 80% of the time and Lever B 20%, until—without warning—the probabilities swap. The Popperian creature treats the lever-reward link as a falsifiable hypothesis ("If I press A, I get food"), simulating candidate actions in its inner environment and discarding the hypothesis the moment the reward stream dries up. The Gregorian creature imports a cultural tool: verbal labels. It categorizes the levers as "The Winner" and "The Loser." This tool is highly adaptive in stable environments, allowing for memory offloading and social transmission of the solution. However, when the reversal occurs, the Gregorian creature faces a category error: "The Winner" cannot logically become "The Loser." Instead of updating the contingency hypothesis, it interprets the lack of reward as performance error ("I didn't pull The Winner correctly") or mechanical noise, persisting with the labeled lever significantly longer than the Popperian. The verdict is measured in *trials to reversal criterion* (consecutive choices of the new optimal lever); the Popperian creature switches in ~5 trials, the Gregorian in ~15, despite identical sensory feedback and identical capacity for inner simulation.

  **The Four Grades**
  1.  **Darwinian:** Hard-wired to prefer Lever A (based on ancestral frequency). It never switches. **Verdict:** Fails (starves after reversal).
  2.  **Skinnerian:** Shaped by direct reinforcement. It slowly extinguishes the Lever A response and shapes Lever B. **Verdict:** Solves, but slowly (high trials to criterion, no simulation).
  3.  **Popperian:** Simulates the causal link. Detects the break in the pattern immediately. **Verdict:** Solves fastest (low trials to criterion, flexible hypotheses).
  4.  **Gregorian:** Uses verbal labels ("The Winner"). Encounters cognitive dissonance when "The Winner" fails. **Verdict:** Solves slower than Popperian (tool inertia delays hypothesis update).

  **The Key Feature**
  The work is done by **Representational Inertia**. The Gregorian tool (language/labeling) does not just describe the world; it structures the *space of intelligible hypotheses*. For the Gregorian creature, "The Winner yields nothing" is not just false; it is *nonsensical* within the tool's syntax. To fall back on Popperian simulation, the creature must first inhibit the automatic labeling process that mediates its perception of the lever. This inhibition carries a metabolic and temporal cost (executive function load), creating a lag during which the Popperian creature, unencumbered by semantic categories, has already adapted.

  **Reversal Test**
  If you reverse the feature—making the environment **stable** over thousands of trials—the Gregorian creature wins decisively. The verbal label allows it to store the solution in long-term memory without maintenance cost, communicate it to conspecifics, and ignore minor noise without re-evaluating the hypothesis. The Popperian creature, constantly re-simulating the link, wastes energy on unnecessary verification. If you remove the feature (strip the Gregorian of language), it collapses into the Popperian grade and matches its speed.

  **The Flatmate's Objection & Reply**
  *Objection:* "You haven't shown the Gregorian mind is worse; you've shown that *bad tools* are worse. A 'good' Gregorian creature would have a tool for 'reversible winners.' If it doesn't, it's just using the wrong tool, not suffering a structural deficit of the Gregorian grade."
  *Reply:* "The 'wrong tool' charge begs the question. The Gregorian grade *is* the import of pre-existing cultural tools, which are necessarily generalized for stability (otherwise they couldn't be shared). The structural deficit is that **tools require ontological commitment**. To share a tool, we must agree on what 'The Winner' *is*. That agreement creates friction when reality changes. The Popperian mind makes no ontological commitments, only predictions. The ladder grants the Gregorian the power of cumulative culture, but the price of that power is the inability to treat one's own categories as disposable hypotheses in real-time. The ladder increases *capacity*, not *infallibility*."

  **Honest Note on Constraints**
  Constraint (e) is the tightest squeeze. A skeptic could argue a "true" Gregorian would meta-cognitively notice the tool failing. I've leaned on **mediated perception** (the label filters the data before it hits the simulator) to block the fallback. If this feels like stipulation, the constraint that bends is (c): in reality, the Gregorian's *experience* of the sense data differs from the Popperian's because the tool alters the phenomenology of the lever itself. I've assumed identical sense data to satisfy the prompt, but the philosophical heavy-lifting relies on the claim that for a Gregorian mind, there is no "raw" sense data left to fall back on.
