answer: |-
  Upon this solid ground my feet are set,
  Where doubts and queries cease to stand apart.
  I have not found a reason for it yet,
  But still I trust the testing of my hand.
  The world existed prior to my birth,
  A claim I hold without a shred of proof.
  It seems the firmest fact upon the earth,
  Yet stays distinct and stands quite far aloof.

  Yet turn the glass; this is no fact to prove,
  But riverbed where current finds its way.
  No evidence alone can make it move,
  It is the rule that lets the language play.
  The hinge stands outside all the language games,
  No name exists outside the living frame.
