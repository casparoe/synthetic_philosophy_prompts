answer: |-
  This is a profound methodological and normative problem. You are encountering what legal philosophers often call the "hybrid" or "mixed" theory of punishment, but in your empirical material, the hybridization has become so fragmented that the underlying logic is obscured. Your suspicion—that desert language is decorative—is a strong one, but as you note, Feature 4 (capacity exemptions) acts as a stubborn anchor preventing a full slide into pure consequentialism.

  To help you reconstruct the presuppositions of this practice, we need to treat the sentencing system not as a coherent moral agent, but as a bureaucracy managing conflicting normative commitments under resource constraints. Below is a reconstruction designed to help you operationalize these normative questions within your dissertation chapter.

  ### 1. Testing the Suspicion: Desert as Constraint vs. Desert as Goal

  Your suspicion is that proportionality language is "decorative." To test this, you must distinguish between **desert as a goal** (the sentence *aims* to match culpability) and **desert as a side-constraint** (the sentence *must not exceed* culpability, even if the goal is efficiency).

  If desert were the *goal*, Feature 1 (negotiation) and Feature 3 (cooperation discounts) would be impossible. You cannot negotiate a moral truth, and you cannot reduce a moral debt because you helped collect other debts.
  However, if desert is merely a *side-constraint* (a "ceiling"), the practice makes sense. The system aims for efficiency (Features 1, 2, 5) and risk reduction (Feature 3), provided it does not violate the "human dignity" floor/ceiling established by Feature 4 (capacity and proportionality).

  **The Test:** Look for cases where the efficiency/risk logic *presses* against the desert constraint.
  *   **If desert is load-bearing:** You should see appellate courts overturning plea deals where the discount is so large that the resulting sentence is grossly disproportionate to the admitted conduct, *even if* the procedure was followed.
  *   **If desert is decorative:** You will see courts upholding sentences that are disproportionately low (due to cooperation) or disproportionately high (due to trial penalties), provided the *process* was voluntary.
  *   **The Crucial Indicator:** Focus on Feature 4. If the system exempts those lacking capacity (insanity, infancy) *even when they are dangerous*, desert is load-bearing there. If the system detains the "dangerous insane" indefinitely under civil commitment without the procedural protections of criminal law, then the criminal exemption was merely a jurisdictional boundary, not a moral one.

  ### 2. Discriminating Between Dennett and Caruso

  You are correct that on the surface, both views can license the current practice, but they do so for different reasons, and "honest" adoption would require structural changes.

  **Dennett (Compatibilist/Pragmatic Desert):**
  *   **View:** Responsibility is a social technology. We hold people responsible to regulate behavior. Plea bargaining is acceptable as a pragmatic adjustment to epistemic limits and resource scarcity, *provided* the "price" remains within the range of what the community accepts as fair for that type of wrong.
  *   **What would change if adopted honestly?** The "Trial Penalty" (Feature 2 & 5) would be curtailed. For Dennett, the right to trial is part of the responsibility-practice. Taxing that right so heavily (a third off vs. token percent) coerces the waiver of the very process that establishes responsibility. An honest Dennettian system would narrow the discount gap to ensure the plea is truly voluntary, not just economically rational.
  *   **Licensing Feature 3:** Dennett can justify cooperation discounts as part of the "social contract"—you help uphold the norms, you get credit. But he would struggle with the inversion where the most culpable (ringleaders) get the lightest sentences.

  **Caruso (Public Health/Quarantine Model):**
  *   **View:** No basic desert. Detention is prevention.
  *   **What would change if adopted honestly?** Feature 4 (Proportionality) would vanish. In a quarantine model, you detain until the "pathogen" is no longer dangerous, not for a time proportional to the "harm." An honest Caruso system would replace fixed terms with **indeterminate detention based on risk assessment**.
  *   **Licensing Feature 5:** Caruso would *reject* Feature 5 (credit for waiving appeal). Waiving an appeal does not reduce dangerousness. It only saves money. A public health model cannot ethically trade liberty for budget savings unless the savings are reinvested in prevention.
  *   **Licensing Feature 3:** This fits the quarantine model perfectly. Handing over accomplices neutralizes other threats. The "discount" is essentially a debriefing incentive.

  **The Discrimination Point:**
  *   If the system moves toward **indeterminate risk-based detention**, it is moving toward Caruso.
  *   If the system moves toward **protecting the procedural rights of the accused** (reducing the trial penalty), it is moving toward Dennett.
  *   Currently, the system does the opposite of both: it keeps fixed terms (anti-Caruso) but coerces waivers of rights (anti-Dennett). This suggests the system is not guided by *either* moral theory, but by **fiscal conservatism**.

  ### 3. The Epistemic Dimension: Uncertainty and the "Price" of Truth

  You ask whether plea bargaining is an epistemically appropriate response to uncertainty or a sign that desert is irrelevant.

  **The Retributivist Epistemic Problem:**
  Retributive justice requires truth. To punish according to desert, you must know *what happened* and *who did it*. A trial is an epistemic engine designed to produce truth. A plea bargain is an epistemic shortcut that explicitly bypasses truth-finding (the court accepts facts not proven).

  **The Reconstruction:**
  If the system presupposed desert, plea bargaining would be treated as a **necessary evil** (a tragic compromise of truth for efficiency). We would expect robust judicial inquiry into the factual basis of the plea to ensure the "desert ceiling" isn't breached.
  If the system presupposes **administrative management**, plea bargaining is the **primary technology**. The sentence is not a judgment of the past; it is a price for closing the file.

  **Your Answer:**
  The practice suggests the latter. The "discount" is not calibrated to the *probability of guilt* (which would be the epistemic desert approach); it is calibrated to the *timing of the waiver*. This indicates the system is not managing uncertainty about desert; it is managing uncertainty about **budgets**. The epistemic uncertainty is not a reason to moderate punishment (as a sceptic might argue); it is irrelevant because the punishment is not predicated on moral truth.

  ### 4. Feature Analysis: Underdetermination and "Cheap Toleration"

  Here is a breakdown of your five features to help you structure your argument about which theories can bear which weights.

  | Feature | Description | Compatible Theories | Defensible Only On... | Why "Cheap Toleration"? |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. Negotiation** | Sentence set by deal, not verdict. | **All.** (Dennett: Pragmatic; Caruso: Triage; Retributivist: Mercy/Resource constraint). | **None.** It is theoretically impure but practically ubiquitous. | It solves the "capacity problem" of the state. No state has the resources to prove every case. It is tolerated because the alternative is system collapse. |
  | **2. Timing Discount** | Scale keyed to speed, not remorse. | **Consequentialism / Administrative.** | **Fiscal Conservatism.** | It is openly non-moral. It is tolerated because it is honest about its motive (efficiency) and doesn't pretend to be about repentance. |
  | **3. Cooperation** | Discount for info on others. | **Caruso / Utilitarian.** | **Public Health / Crime Control.** | **Incompatible with Desert.** This is the strongest evidence against desert. It inverts culpability (ringleaders get less time). It is tolerated because it yields high conviction rates for low cost. |
  | **4. Proportionality & Capacity** | Appellate review; insanity exemptions. | **Dennett / Retributivist.** | **Desert-Based Theories.** | **The Anchor.** This is the one feature Caruso cannot easily explain (why exempt the dangerous insane?). It is retained because it serves as a legitimacy shield for the rest of the system. |
  | **5. Waiving Appeal** | Credit for not appealing. | **Fiscal Conservatism.** | **None.** (Violates both Desert and Quarantine). | **The Naked Truth.** This treats rights as costs. It is tolerated because it is the final pressure valve for budgetary stress. |

  **Why is the Discount (Feature 2) so cheaply tolerated?**
  You asked why toleration is so cheap if no theory truly wants it.
  *   **Retributivists** tolerate it as "mercy" or "acceptance of responsibility" (even if the doctrine says otherwise, they retrofit the justification).
  *   **Consequentialists** tolerate it as "efficiency."
  *   **Sceptics** tolerate it as "harm reduction" (less state coercion is better).
  *   **The Reality:** It is a **focal point for equilibrium**. It allows all actors (judges, prosecutors, defenders) to manage their caseloads without requiring them to agree on *why* they are punishing. It is the "overlap" in a Rawlsian sense, but based on administrative necessity rather than moral consensus.

  ### Recommendation for Your Chapter

  Do not try to resolve whether the system *is* Desert or Public Health. Instead, argue that the system is **normatively parasitic**.

  1.  **Thesis:** The practice of sentence production presupposes a **facade of desert** (Feature 4) to maintain legitimacy, while operating on a **logic of resource allocation** (Features 1, 2, 3, 5).
  2.  **Evidence:** Use Feature 3 (Cooperation) to show that desert is not the *driver* (since high culpability gets low sentences). Use Feature 4 (Capacity) to show that desert is not *dead* (since the system still refuses to punish the non-responsible).
  3.  **Conclusion:** The "normative question" you cannot get traction on is unanswerable because the practice is not trying to answer it. The practice is designed to **obscure** the normative question. The "discount" is the mechanism that allows the system to function without resolving the tension between Dennett and Caruso. It allows the state to act *as if* people are responsible (to satisfy the public) while treating them as *cases to be processed* (to satisfy the budget).

  This approach allows you to keep your empirical findings (the 5 features) while making a sophisticated normative contribution: you are exposing the **functional hypocrisy** that allows the system to endure.
