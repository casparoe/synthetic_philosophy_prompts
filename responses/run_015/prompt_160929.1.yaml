prompt: |-
  I am a PhD student in criminology, writing the chapter of my dissertation that deals with how sentences are actually produced, and I have run into a normative question that I cannot get traction on. I would be grateful for help reconstructing what the practice I am studying presupposes.

  The practice, in the jurisdictions in my sample, has the following features, none of which I think is controversial:

  1. Sentence length is set by negotiation rather than by any finding about culpability. Roughly nine convictions in ten are pleas rather than verdicts, and the term imposed is a function of the charges the prosecutor files, the discount offered for waiving trial, and the defendant's willingness to accept it.

  2. The plea discount is a published scale keyed to timing rather than to culpability: on the order of a third off for a plea entered at the first hearing, tapering to a token few percent for a plea entered at the courtroom door. The official justification is administrative — witnesses spared, court time saved, victims not required to testify — and the doctrine is explicit that the discount is not a reward for remorse, remorse being handled separately as a mitigating factor.

  3. The largest reductions go to defendants who can hand over information about other people's crimes. The size of a defendant's discount therefore tracks how much they know, which in practice tracks how deeply embedded they were in the offending.

  4. The same systems also maintain, in appellate review, that a sentence must be proportionate to the gravity of the offence and the offender's culpability, that consequences falling on third parties are not mitigating, and that a person who lacked the capacity to conform is not a fit subject for punishment at all.

  5. One jurisdiction has gone further and made the mechanism explicit. A defendant convicted after a full contest at trial now receives the same reduction if, within a fixed window, they waive their appeal and accept a supervision and restitution plan. It is formally described as a credit for not consuming further public resources; it is refused to defendants who maintain innocence and pursue their appeals, including where the appellate court would later have found error on the record.

  My own suspicion is that the practice strictly presupposes almost nothing about desert, and that the proportionality language at the appellate level is decorative rather than load-bearing. But I do not know how to test that suspicion, because the features pull in different directions: some look like straightforward deterrence or resource allocation, while others — the refusal to count third-party harms, the capacity-based exemptions — seem to make sense only if desert is doing real work somewhere in the system.

  This is where I would particularly value help. I have been reading the debate between Dennett, who holds that desert survives the demise of libertarian free will as a social practice we have good reasons to maintain, and Caruso, who holds that no one is responsible in the desert-involving sense and that the state's coercive response to crime should be modelled on public health: prevention, incapacitation and treatment, constrained by something like a least-restrictive-means requirement. On the face of it these views are very far apart, and yet I cannot see that the practice discriminates between them. The first might say that negotiated sentences are exactly what taking desert seriously under uncertainty and scarcity looks like, or that desert functions as a loose outer constraint while efficiency determines the outcome within it. The second might say that the plea discount is triage under a budget constraint, and that the only thing wrong with it is the punitive framing — but equally that a credit for waiving rights is unintelligible on a quarantine model, since waiving an appeal does not make anyone less dangerous. If both can license the practice, what would have to be true of the practice for it to be evidence for one rather than the other, and what would concretely have to change in it if either view were adopted honestly rather than rhetorically?

  Two further things I would like addressed. First, the epistemic dimension: plea bargains are struck under deep uncertainty about what the defendant did, and one strand of the sceptical argument is that we are never in a position to know whether anyone is answerable in the desert-involving sense. Does that make a negotiated sentence the epistemically appropriate response to uncertainty about desert, or a sign that the desert question was never really being asked? Second, where the practice is underdetermined: which of the five features could be retained under several rival theories, and which is defensible on only one. If it turns out that the sentencing discount is the feature that no theory wants and every theory tolerates, I would like to know why toleration is so cheap.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Request:**

      *   **User Identity:** PhD student in Criminology.
      *   **Task:** Writing a dissertation chapter on how sentences are *actually produced* (empirical/sociological focus) but stuck on a *normative* reconstruction question.
      *   **Core Problem:** The user suspects the practice presupposes almost nothing about *desert* (retributive justice), treating proportionality language as decorative. However, some features (capacity exemptions, ignoring third-party harms) seem to require desert.
      *   **Theoretical Framework:** Comparing Daniel Dennett (compatibilist/pragmatic desert) vs. Gregg Caruso (public health/quarantine model/no desert).
      *   **Specific Questions to Address:**
          1.  How to test the suspicion that desert is decorative vs. load-bearing?
          2.  How do Dennett and Caruso differ in licensing/condemning this specific practice? What would change if either were adopted "honestly"?
          3.  The Epistemic Dimension: Is plea bargaining an appropriate response to uncertainty about desert, or evidence that desert isn't the goal?
          4.  Feature Analysis: Which of the 5 features are underdetermined (compatible with multiple theories) vs. specific to one theory? Why is the "sentencing discount" tolerated by all?

  2.  **Initial Analysis of the Practice (The 5 Features):**

      *   *Feature 1 (Negotiation over Culpability):* Strongly suggests consequentialism/administrative efficiency. Weak on desert.
      *   *Feature 2 (Timing-based Discount):* Explicitly administrative. Denies remorse link. Strongly consequentialist.
      *   *Feature 3 (Substantial Assistance/Cooperation):* Utilitarian (crime reduction). Paradoxically punishes the less embedded (who know less) more severely. Conflicts with desert (culpability vs. utility).
      *   *Feature 4 (Appellate Proportionality/Capacity):* Strongly Retributivist/Desert-based. Capacity exemptions are hard to justify on pure quarantine models (dangerous people are still dangerous even if incapacitated). Ignoring third-party harms is a desert constraint (punish the agent, not the outcome luck).
      *   *Feature 5 (Waiving Appeal for Credit):* Purely resource-saving. Hard to justify on desert (innocence shouldn't matter if you save resources?) or quarantine (waiving appeal doesn't reduce danger).

  3.  **Theoretical Mapping (Dennett vs. Caruso):**

      *   *Dennett (Compatibilist/Pragmatic):* Desert is a useful social technology. We hold people responsible to regulate behavior. Plea bargaining fits *if* seen as a pragmatic adjustment to imperfect information and resource limits, *provided* the "desert ceiling" isn't violated.
      *   *Caruso (Public Health/Quarantine):* No basic desert. Punishment is prevention/incapacitation. Plea bargaining is "triage." *However*, Feature 5 (waiving appeal) is problematic because it doesn't reduce risk. Feature 3 (cooperation) fits well (neutralizing other threats). Feature 4 (capacity) is tricky; quarantine models usually still exempt the non-responsible (insanity) because they are patients, not enemies, but the *proportionality* constraint is weaker (detain until safe, not punish for X years).

  4.  **Addressing the Specific Questions:**

      *   *Testing the Suspicion:* Look for *violations*. If desert were load-bearing, Feature 3 (embeddedness = discount) would be scandalous (more culpable = less punishment). If desert is decorative, Feature 4 (capacity exemptions) should be eroding (dangerous insane people should be detained indefinitely without the "punishment" label).
      *   *Dennett vs. Caruso Discrimination:*
          *   Dennett needs the *language* of blame to remain coherent.
          *   Caruso needs the *structure* of detention to match risk, not gravity.
          *   *Concrete Change:* If Caruso were honest, Feature 4's proportionality would vanish (indeterminate detention based on risk). If Dennett were honest, Feature 1 & 2 would be constrained by a stricter "just deserts" floor/ceiling.
      *   *Epistemic Dimension:* Plea bargaining acknowledges uncertainty. Retributivism requires knowledge of truth. Therefore, plea bargaining is epistemically hostile to strong desert. It treats the sentence as a price, not a judgment.
      *   *Feature Analysis (Underdetermination):*
          *   *Shared:* Feature 1 (Efficiency), Feature 3 (Utility).
          *   *Desert-Specific:* Feature 4 (Capacity/Proportionality).
          *   *The "Cheap Toleration":* The discount is tolerated because it serves the *state's* interest (efficiency) regardless of the *moral* justification. It's a "tax on rights" that both theories dislike but accept as a necessary evil of non-ideal theory.

  5.  **Drafting the Response (Iterative Refinement):**

      *   *Tone:* Academic, rigorous, empathetic to the PhD struggle. Avoid taking sides, focus on structural analysis.
      *   *Structure:*
          1.  Introduction: Validate the difficulty (the "hybrid" nature of modern sentencing).
          2.  Reconstructing the Presuppositions (The "Mixed Theory" problem).
          3.  Dennett vs. Caruso: The Discrimination Test (What would change?).
          4.  The Epistemic Question (Uncertainty and Truth).
          5.  Feature-by-Feature Analysis (Underdetermination vs. Specificity).
          6.  Conclusion: The "Cheap Toleration" of the Discount.

      *   *Refining the Dennett/Caruso distinction:* I need to be careful not to caricature. Dennett isn't a hard retributivist; he's a pragmatist about responsibility. Caruso isn't soft on crime; he's big on incapacitation. The key difference is *why* we detain.
      *   *Refining Feature 4:* This is the crux. Why exempt the incapacitated? On a quarantine model, you quarantine the infected even if they didn't choose to be infected. So, the fact that we *do* exempt them (insanity defense) is strong evidence for a desert constraint *somewhere*. But the fact that we *also* have Feature 3 (cooperation) undermines desert. This tension is the user's goldmine.
      *   *Refining Feature 5:* This is the most "nakedly consequentialist" feature. It treats rights as costs. This is the strongest evidence against desert.

  6.  **Final Polish:** Ensure the distinction between "desert as a constraint" vs. "desert as a goal" is clear. Ensure the advice helps the student write the chapter (i.e., gives them analytical tools, not just philosophical answers).

      *(Self-Correction during drafting)*: I initially thought about suggesting the student interview judges. No, that's empirical. They need normative reconstruction. Stick to the logic of the practices.
      *Correction on Feature 3:* Does being deeply embedded mean more culpable? Usually yes. But they get *more* discount. So high culpability = low sentence. This is a direct inversion of desert. I need to highlight this contradiction.

  7.  **Final Review against constraints:** Did I answer all four sub-questions?
      1.  Test suspicion? Yes (look for contradictions).
      2.  Dennett vs. Caruso discrimination? Yes (indeterminate detention vs. rights tax).
      3.  Epistemic dimension? Yes (price vs. judgment).
