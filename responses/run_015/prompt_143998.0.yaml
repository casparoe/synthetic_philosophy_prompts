          *   So, reject (1).
          *   *Wait, is there a better nuance?* The argument says "neither is better than the other". This implies $L_i \sim L_{i+1}$. If we reject this, we say $L_{i+1}$ *is* better than $L_i$, just imperceptibly so.
          *   This preserves transitivity and the final conclusion ($L_{86400} > L_0$).
          *   *Cost:* We accept "betterness facts" that make no experiential difference.
