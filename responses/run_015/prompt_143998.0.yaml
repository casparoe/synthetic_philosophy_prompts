          *   *Why it looks compulsory:* It's intuitive. Agony is bad, contentment is good. More good is better.
          *   *Cost:* Denying that a day of contentment is better than a day of agony. This is a huge bullet to bite.
          *   *Philosophical stance:* Unlikely to be the best candidate unless one is a radical sceptic about value.

      *   **Option D: Distinguish "Not Better Than" from "Equally Good" (The Semantic/Logical Move).**
          *   The argument equivocate on "not better than".
          *   (1) says: Imperceptible $\rightarrow$ Neither is better (Indifference).
          *   (3) says: Indifference chains.
