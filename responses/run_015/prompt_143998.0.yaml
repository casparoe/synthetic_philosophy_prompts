          *   *Philosophical stance:* Classical utilitarianism often bites this bullet (aggregative view).

      *   **Option B: Reject (3) Chaining / Transitivity.**
          *   *Why it looks compulsory:* "Better than" is a strict partial order. Transitivity is definitional for rational choice. If $A > B$ and $B > C$, then $A > C$. If we deny the propagation of "not better," we might be denying transitivity of indifference.
          *   *Cost:* Non-transitive value. This breaks standard decision theory. If I prefer A to B, B to C, but not A to C, I can be money-pumped.
