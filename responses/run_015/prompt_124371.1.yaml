  One shadow rises from the other HAND,
  Where starched cotton meets the skin, a CUFF
  Marks where the drawing stops, a distinct LINE
  That curls back inward like a tightened LOOP,
  Upon the flat and unresisting PLANE,
  Obeying some invisible strict RULE.

  No master writes the first commanding RULE
  But flesh emerges from the waiting HAND
  To claim the depth denied the empty PLANE
  And pulls the fabric of the folded CUFF
  Into the circuit of a living LOOP
  Along the edge of every drawn LINE.

  No eye can trace the origin of LINE
  The order hides behind the silent RULE
  That binds the start and finish in a LOOP
  So neither pencil moves without a HAND
  To anchor sleeve to wrist within the CUFF
  And lift the figure from the paper PLANE.

  There is no world at all beyond this PLANE
  Except the dark authority of LINE
  That binds the wrist inside the stiffened CUFF
  As if the geometry obeyed a RULE
  Given by neither pencil nor by HAND
  But inherent in the circuit of the LOOP.

  The circuit closes, tightening the LOOP
  Without a crack to spill us from the PLANE
  For flesh is borrowed from the other HAND
  And status fixed by placement of the LINE
  Where up and down submit to single RULE
  And sleeve is seamless at the turned-back CUFF.

  We wear the border like a starched CUFF
  And move within the circuit of the LOOP
  Unquestioning the source of any RULE
  That holds us on this unescaping PLANE
  Defined by every intersecting LINE
  Created by the living grasp of HAND.

  Where RULE meets flesh, the paper makes a LOOP.
  The PLANE is held by shadow in the CUFF.
  One HAND defines the limit of the LINE.
