answer: |-
  *   **The 5-Minute Compliance Procedure**

      1.  **Legality:** Is this illegal under local law OR our home country's anti-bribery statute?
          *   *Adequate Answer:* Written legal confirmation or clear statute.
          *   **STOP: NO.**
      2.  **Specificity:** Does this payment/gift buy a *specific* act/release/decision now, or general goodwill later?
          *   *Adequate Answer:* Clear description of the expected return.
          *   *Note:* Your "specific act vs. standing disposition" distinction works here. It is the brightest line.
          *   **STOP: NO** (if specific act).
      3.  **Exit Costs:** Can the recipient refuse this without losing status, safety, or income?
          *   *Adequate Answer:* Fieldworker assessment of the power dynamic.
          *   *Note:* Your "exit costs" distinction works here. It identifies coercion.
          *   **STOP: NO** (if they cannot refuse).
      4.  **Harm Distribution:** If we refuse, do patients suffer immediate health harm, or do we suffer administrative delay?
          *   *Adequate Answer:* Field assessment of medical risk vs. operational friction.
          *   *Note:* Your "harm" distinction is a values call, not a factual one. Do not decide this alone.
          *   **ESCALATE: DIRECTOR** (if patients suffer).
      5.  **Sunlight:** Would we publish this payment/gift on our website homepage?
          *   *Adequate Answer:* Honest gut check by sender and receiver.
          *   **ESCALATE: DIRECTOR** (if no).

  *   **On Your Distinctions**
      *   **Specific vs. Disposition:** Keep separate. This is the core of bribery vs. relationship building.
      *   **Exit Costs:** Keep separate. This defines coercion vs. voluntary gift.
      *   **Harm:** Keep separate from compliance facts. This is a strategic risk trade-off. Escalate it.

  *   **Case Runs**

      *   **$50 Expediting Fee (Vaccine Consignment)**
          *   Q1 (Legality): Likely illegal (facilitation payment). **STOP: NO.**
          *   Q2 (Specificity): Buys specific release. **STOP: NO.**
          *   *Result:* **Reject.** You won't like this. Vaccines stay stuck. But it buys a specific act from an official. It fails the brightest line test.
      *   **Village Chief's Goat (Fieldworker)**
          *   Q2 (Specificity): General goodwill/disposition. Pass.
          *   Q3 (Exit Costs): Chief can refuse giving? Yes. Fieldworker can refuse accepting? Yes. Pass.
          *   Q5 (Sunlight): Publish "Community Gift"? Yes.
          *   *Result:* **OK.** Log as community gift, consume/share locally, do not sell.
      *   **District Officer's Cousin (Payroll)**
          *   Q2 (Specificity): Buys standing disposition (protective relationship). Pass.
          *   Q3 (Exit Costs): Can we refuse without losing clinic access? Likely no. High risk.
          *   Q5 (Sunlight): Publish "Hired Officer's Cousin"? No.
          *   *Result:* **ESCALATE.** Nepotism vs. access is a strategic values call. Director decides.

  *   **What This Procedure Can't Do**

      *   **Fix Systems:** It stops you from rotting, not from operating in a rotten system.
      *   **Protect Staff:** It doesn't shield fieldworkers from retaliation when you say "No."
      *   **Absolve Guilt:** When Q4 forces a "No" that hurts patients, this procedure offers no moral comfort. It only ensures the choice is conscious.
      *   **Predict Consequences:** It cannot forecast if a "No" today closes a clinic forever. That requires local intelligence, not compliance rules.
