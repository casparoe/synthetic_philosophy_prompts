answer: |-
  Dear Colleague,

  Having reviewed our seven precedents, the principle connecting them appears to be that standing requires either clean hands regarding the specific norm or restored standing through accountability. We do not demand moral purity, as Okonkwo, Sorensen, and Lindqvist all retained standing despite past breaches. However, we do demand acknowledgment of the community's authority to adjudicate those breaches. Reyes and Duvalier were denied standing because they evaded that authority, either by concealment or by rejecting the norm's validity. Conversely, Okonkwo and Sorensen retained standing because they submitted to the community's judgment, accepting sanctions or offering themselves up for them. Lindqvist, Mbeki, and Harker had standing because the community's authority did not apply to their past actions, unrelated data, or different norms.

  Under this rule, Adeyemi should be denied standing. While she admits the wrongfulness of her past conduct, unlike Duvalier, she refuses the community's authority to sanction her, unlike Okonkwo and Sorensen. She seeks the moral credit of reformation without the cost of accountability, hiding behind the limitation period much as Reyes hid behind concealment. The closest analog is Reyes, not because her behavior was identical, but because the structural defect is the same: an unaccounted violation of the specific norm she now seeks to enforce. Sorensen is the counterfactual; had she refused the sanction, she likely would have lost standing.

  Regarding the derivative character of the dirt, it should not matter that she instructed the technician rather than performing the act herself. In research governance, command responsibility renders the violation hers. The technician's lack of blameworthiness cleanses the technician, not the lab head. To rule otherwise would incentivize senior researchers to outsource violations to preserve their own standing, which would undermine the norm entirely.

  On the question of graded verdicts, our precedents are strictly binary. Introducing a category like standing to blame without standing to censure now would be inconsistent with the all-or-nothing nature of Reyes, Okonkwo, and the others. Official censure is an institutional act requiring full moral authority, whereas private blame is a personal judgment. We are ruling on institutional standing, so we must stick to the binary framework we have established. If we wish to signal diminished authority, we can do so in the reasoning of the ruling, but the verdict itself must be yes or no to maintain consistency.

  The case you propose, involving a member currently violating the norm but trying to stop, would be an excellent probe to separate the rules. It tests whether cessation alone restores standing or if accountability is strictly required. If we grant standing to Adeyemi, we imply that cessation and admission suffice. If we deny it, we imply that submission to sanction is necessary. However, since Adeyemi presents the limitation period obstacle, the better probe for the future is a member who violates, stops, admits fault, and accepts a sanction while still within the disciplinary window. That would confirm the Okonkwo principle. If we deny Adeyemi standing, we are affirming that the limitation period does not erase the debt owed to the community for standing purposes, even if it bars formal discipline.

  I recommend we rule that Adeyemi lacks standing. This preserves the integrity of the accountability principle evident in Okonkwo and Sorensen. It signals that while we encourage reformation, the privilege of enforcing norms belongs to those who have either never breached them or have fully submitted to the consequences of having done so. To rule otherwise would suggest that seniority or the passage of time allows one to purchase moral authority simply by admitting fault without paying the price, which risks turning our censure process into a tool for those seeking to launder their reputations rather than protect the field.

  Best regards,

  [Your Name]
