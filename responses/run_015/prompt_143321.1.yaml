      *   *Drafting Section 4 (Distinction):* Strawson's regress is logical (you can't be causa sui). Compatibilists contest the *requirement* of ultimate responsibility, not the regress itself. They change the definition of responsibility. I must make sure not to say compatibilism is wrong per se, but that it doesn't solve the *ultimate* responsibility problem posed by Strawson.

      *   *Refining the Argument:* Ensure I don't present compatibilism as defeated consensus. Present it as a divergent definition. The core argument is about *ultimate* responsibility.

      *   *Final Sentence:* Needs to be punchy and encapsulate the core conclusion.

  6.  **Review against Constraints:**
      *   Rigorous argument? Yes.
