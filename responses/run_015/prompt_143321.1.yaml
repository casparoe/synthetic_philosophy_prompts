      *   Separate settled vs. contested? Yes (Regress is logical, requirement of UR is contested).
      *   End with `\answer{...}`? Yes.

  7.  **Final Polish:** Check tone. Ensure it sounds like a novelist arguing philosophy. (Self-Correction: Keep it rigorous, don't get too flowery, but maintain the metaphorical framework).

      *   *Check on "Reasons-Responsive":* Fischer and Ravizza argue that ownership of the mechanism matters. The analogy needs to show that "ownership" is still determined by the "author" (past causes). The character feels ownership, but the author installed it.
      *   *Check on "Settled vs. Contested":* Settled: You can't be causa sui. Contested: Whether *causa sui* is necessary for moral responsibility.

  8.  **Constructing the Final Output:** (Mental outline of the text)
