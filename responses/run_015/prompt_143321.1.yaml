answer: |-
  Consider the self not as a sovereign agent, but as a protagonist in a novel whose text is being written in real-time. In this conceit of "nested authorial regression," every decision you make is a line of dialogue, and every deliberation is a paragraph of internal monologue. The crucial metaphysical question is: who holds the pen? If we demand true moral responsibility, we demand that you, the character, are also the Author. But a character cannot write their own backstory; any attempt you make to edit your own nature—to become more patient, less impulsive, more virtuous—is itself a plot point dictated by the prior text. The impulse to self-improve arises from a specific configuration of psychology and environment that you did not choose, much like a character's sudden resolve is determined by the chapters preceding it.

  This illustrates Galen Strawson's Basic Argument with textual precision: to be responsible for your actions, you must be responsible for the "style" in which you write them. But to be responsible for that style, you must have chosen it using a prior style of choice. This creates an infinite regress of drafts within drafts. There is no "first draft" of the will where the character picks up the pen independent of the narrative history already established by genetics, environment, and prior psychological states. You cannot be the *causa sui* because you cannot step outside the text to write the hand that holds the pen.

  However, we must press this analogy to its breaking point to address the compatibilist objection. A sophisticated compatibilist might argue that the character *is* free enough if the story follows their internal logic consistently, regardless of who wrote the backstory. They posit "reasons-responsive mechanisms" as the halt to the regress: if the character's actions flow from their own rational deliberations rather than external coercion (like a puppet master forcing their hand), responsibility is secured. In our metaphor, this is akin to saying the character is responsible because the dialogue matches their established personality, even if they didn't create that personality.

  Here lies the divergence between Strawson's logical trap and compatibilist revisionism. Strawson's regress is settled logic regarding *ultimate* origination: a character cannot logically author their own existence or fundamental nature without circularity. What compatibilists genuinely contest is not the regress itself, but the necessity of ultimate origination for moral responsibility. They argue that "ownership" of the mechanism (the character's rationality) is sufficient, even if the mechanism was installed by the Author (causal history). The analogy fails to refute them only if we accept their redefinition of responsibility as merely about internal coherence rather than ultimate authorship. Yet, if we maintain the rigorous standard that true responsibility requires being the ultimate source of one's will, the reasons-responsive mechanism is merely a sophisticated puppetry installed by prior causes, leaving the character with no more ultimate authorship than a well-written fictional hero.

  \answer{True moral responsibility is impossible because no agent can be the ultimate cause of their own nature, as every act of self-creation presupposes a prior nature that was itself unchosen.}
