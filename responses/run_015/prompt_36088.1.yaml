prompt: |-
  I am a novelist with three published novels and several years of experience teaching in an MFA program, and I think in the vocabulary of narrative craft: a character's want (the visible, scene-level goal) versus their need (the deeper thing the arc is actually about); interiority and how close or distant the point of view sits to the character's thoughts; motivation shown versus told; character consistency as a contract with the reader; backstory as the etiology of motive; stakes; dramatic irony. I have no formal training in philosophy, but I've gathered that there is a long debate about weakness of will — akrasia — and that at some point economists walked into it carrying a discount function. Please translate the main positions on weakness of will into my vocabulary, one at a time, and for each one tell me what carries over cleanly, what has to be bent to fit, and what cannot be said at all in craft terms. Cover at least these four: the Socratic view that no one does wrong knowingly, so that every apparently self-defeating act is really ignorance — which, I suspect, maps onto my world as the claim that a character always acts on what they most vividly want, and the novelist's job is to make that want legible; Aristotle's intermediate position, in which the akratic possesses the knowledge but it is not active in him, his condition likened to that of a sleeper or a drunk — perhaps in my terms, knowledge that exists in the backstory but is not alive on the page in the scene; Donald Davidson's attempt to dissolve the paradox by separating an all-things-considered judgment from an unconditional one, so that the character knew better in one sense and not in another; and the behavioral-economics treatment of akrasia as hyperbolic discounting, in which the value of a reward collapses as it draws near and the person's preferences genuinely reverse over time rather than being overridden by anything. After the translations, give me a residue report: is there anything in the philosophical dispute that has no counterpart in how novelists talk about character, and if so, does the residue mean my craft vocabulary is missing something, or that the philosophers' disagreement is less clear than it looks? Two specific questions along the way. First: the workshop dictum that a character must want something and take action toward it — taken strictly, is that dictum a vote for the Socratic side, such that a novel literally cannot depict weakness of will, only mislabeled desire? Second: if hyperbolic discounting is right that preferences flip rather than fail, does my habit of describing a lapse as out of character turn out to conflate the reader's vantage point with the character's own? Please respond in American English, and keep the translation honest — do not import my craft assumptions and present them as findings.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Persona:** Published novelist, MFA instructor. Thinks in narrative craft terms (want vs. need, interiority, POV distance, motivation, consistency, backstory, stakes, dramatic irony). No formal philosophy training but aware of the *akrasia* debate and economic discounting.
      *   **Task:** Translate four specific philosophical positions on weakness of will (*akrasia*) into narrative craft vocabulary.
      *   **Positions to Cover:**
          1.  Socratic Intellectualism (No one does wrong knowingly).
          2.  Aristotelian Intermediate Position (Knowledge exists but isn't active).
          3.  Donald Davidson's All-Things-Considered vs. Unconditional Judgment.
          4.  Behavioral Economics (Hyperbolic Discounting/Preference Reversal).
      *   **Requirements for Each Translation:**
          *   What carries over cleanly?
          *   What has to be bent to fit?
          *   What cannot be said at all in craft terms?
      *   **Additional Requirements:**
          *   Answer two specific questions embedded in the prompt.
          *   Provide a "Residue Report" at the end (philosophical concepts with no craft counterpart, and what that implies).
          *   Tone: American English, honest translation (do not validate craft assumptions as philosophical truths).

  2.  **Deconstruct the Four Positions & Map to Craft:**

      *   **1. Socratic Intellectualism:**
          *   *Philosophy:* To know the good is to do the good. Evil/error is ignorance. If you do bad, you didn't *really* know the good was better at that moment.
          *   *Craft Mapping:* "Want" is king. If a character acts, they want that action more than the alternative *in that moment*. "Need" is just abstract info until it becomes a "Want."
          *   *Clean:* Motivation must be legible. Action implies desire.
          *   *Bent:* "Ignorance" isn't just lack of info; it's emotional blindness or misaligned hierarchy of wants.
          *   *Impossible:* True *akrasia* (knowing better and doing worse anyway) doesn't exist here. It's all mislabeled desire.

      *   **2. Aristotelian Intermediate:**
          *   *Philosophy:* You have the knowledge (universal premise) but fail to apply the particular premise in the moment (passion overwhelms reason). Like a drunk reciting poetry.
          *   *Craft Mapping:* Backstory/Theme (Knowledge) vs. Scene-level Pressure (Passion). The character *has* the lesson (Need) but the Scene (Want) overrides it due to heat/pressure.
          *   *Clean:* Distinction between static knowledge (backstory) and active knowledge (scene). POV distance matters here (are we in the heat or observing the heat?).
          *   *Bent:* Aristotle talks about universal/particular premises; craft talks about internal conflict.
          *   *Impossible:* The precise mechanism of *how* knowledge is "asleep." Craft says "they chose differently," Aristotle says "the knowledge wasn't operative."

      *   **3. Donald Davidson (Incontinence):**
          *   *Philosophy:* Distinguishes between "All-things-considered judgment" (ATC) and "Unconditional judgment." I judge A is better ATC, but I form an unconditional intention to do B. No logical contradiction because the judgments are different types.
          *   *Craft Mapping:* The "Need" (ATC judgment) vs. the "Want" (Unconditional intention). The character acknowledges the Need (interiority/narration) but commits to the Want (action).
          *   *Clean:* Captures the internal split well. Matches the "lying to oneself" aspect of unreliable narration or deep POV conflict.
          *   *Bent:* Davidson is logical/semantic; craft is psychological/emotional.
          *   *Impossible:* The logical formalism. Craft doesn't care if it's logically consistent, only if it feels psychologically true.

      *   **4. Behavioral Economics (Hyperbolic Discounting):**
          *   *Philosophy/Econ:* Time inconsistency. Value of reward drops off non-linearly. Preferences reverse. Future self vs. Present self.
          *   *Craft Mapping:* Stakes change based on proximity. The "Future Character" (Need) loses to the "Present Character" (Want). It's not a failure of will, it's a math problem of value.
          *   *Clean:* Explains why stakes feel different in the moment. Matches the "ticking clock" pressure.
          *   *Bent:* Reduces agency to calculation. Craft insists on *choice*, even if flawed.
          *   *Impossible:* The idea that the "self" is actually different at t1 vs t2. Craft usually assumes a continuous identity (consistency contract).

  3.  **Address the Two Specific Questions:**

      *   *Q1: Workshop dictum (Character must want + act) = Socratic vote?*
          *   Yes, functionally. If action *requires* want, then doing something "against your best interest" just means your interest was redefined in the moment. It denies true *akrasia*.
      *   *Q2: Hyperbolic discounting & "Out of Character" lapses?*
          *   Yes. If preferences flip, the character *is* consistent with their current preference. Calling it "out of character" privileges the reader's long-view or the character's past-self over the current self. It's a POV/Stakes issue.

  4.  **Drafting the Residue Report:**
      *   *What's missing in craft?* Moral responsibility/Truth. Philosophy cares about whether the act is *rationally defensible*. Craft cares if it's *narratively compelling*.
      *   *Philosophy less clear?* Maybe. Philosophy tries to solve the paradox; craft accepts the paradox as "human nature."
      *   *Key Residue:* The normative claim. Philosophy asks "Is this rational?" Craft asks "Is this believable?"

  5.  **Refining the Tone:**
      *   Avoid flattery.
      *   Use the user's terminology (Want/Need, Interiority, etc.) but don't let those terms distort the philosophy.
      *   Be precise about where the analogy breaks.
      *   American English.

  6.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I distinguish between Socratic "ignorance" and Craft "unlegible motivation"?
      *   *Correction:* Make sure to note that Socrates says the knowledge *isn't there*, whereas Craft might say the knowledge *is there* but the Want is stronger. That's a crucial divergence.
      *   *Check:* Davidson is tricky. Ensure the ATC vs. Unconditional distinction is clear in craft terms (Theme vs. Action).
      *   *Check:* Economics. Don't get bogged down in math. Focus on Time and Value.
      *   *Check:* Residue. Don't just say "Craft is better." Say "Craft ignores the normative question."

  7.  **Final Polish:** Check against constraints (4 positions, 3 sub-points each, 2 questions, residue report). Ensure the "honest translation" constraint is met (i.e., admit where craft vocabulary fails to capture the philosophical nuance).

  *(Self-Correction on Socratic View)*: I need to be careful. Socrates says if you do wrong, you *think* it's right (or the best option available). In craft, if a character smokes a cigarette knowing it kills them, the Socratic view says they *want* the cigarette more than health *in that moment*. Craft calls this "Want." Socrates calls this "Misjudgment of the Good." The overlap is high, but the *reason* differs. I need to highlight that.

  *(Self-Correction on Aristotle)*: Aristotle says the knowledge is there but not *used*. Craft might call this "Interiority" that is disconnected from "Action." The "Drunk" analogy is perfect for "POV Distance" or "Fugue State."

  *(Self-Correction on Davidson)*: This is the closest to modern psychological realism. The "All-things-considered" is the "Need." The "Unconditional" is the "Want." The conflict is the story.

  *(Self-Correction on Economics)*: This challenges "Character Consistency." If preferences reverse, is it the same character? Craft says yes (arc). Econ says maybe not (different time-slice selves).

  *(Residue)*: The concept of *Rationality* itself. Craft doesn't care if it's rational, only if it's motivated. Philosophy cares if it's logically possible.

  Okay, ready to write.
answer: |-
  Here is the translation of the four philosophical positions on *akrasia* (weakness of will) into your vocabulary of narrative craft, followed by the residue report and answers to your specific questions.

  ### 1. The Socratic View (Intellectualism)
  **The Philosophy:** No one does wrong knowingly. To act against one's best interest is an error of calculation. The agent believes, in that moment, that the bad action is actually the good (or best available) option. Evil is ignorance.

  **The Craft Translation:**
  *   **What carries over cleanly:** This maps almost perfectly to the workshop dictum that **motivation must be legible**. If a character takes an action, the narrative must establish that, within the logic of the scene, that action satisfied their dominant **Want**. If a character destroys their marriage, the Socratic view insists they did so because, in that moment, they wanted the destruction (or the relief it promised) more than the preservation of the marriage. The novelist's job is to render that hierarchy of desire visible so the reader doesn't cry "false note."
  *   **What has to be bent:** Socrates treats this as an epistemological failure (they didn't *know*), whereas craft treats it as a hierarchy of desire (they *knew*, but wanted something else more). To make this fit, you have to treat "Knowledge" in the Socratic sense not as information, but as emotional conviction. The character doesn't lack the data; they lack the *feeling* of the data's weight.
  *   **What cannot be said at all:** True self-sabotage. In strict Socratic terms, a character cannot consciously choose the "Need" (the long-term good) and reject it for the "Want" (the short-term pleasure) while acknowledging the "Need" is superior. If they choose the pleasure, the pleasure *became* the superior good in their estimation. Craft often celebrates the tragedy of knowing better and doing worse; Socrates says that tragedy is an illusion caused by poor rendering of the character's internal calculus.

  ### 2. The Aristotelian Intermediate Position
  **The Philosophy:** The agent possesses the knowledge (the universal premise) but fails to apply it to the specific situation (the particular premise) due to passion. The knowledge is present but inactive, like a sleeper reciting poetry or a drunk quoting Empedocles.

  **The Craft Translation:**
  *   **What carries over cleanly:** This distinguishes between **Backstory/Etiology** (the knowledge possessed) and **Scene-Level Pressure** (the active moment). The character has the "Need" integrated into their history—they have learned the lesson in previous chapters or backstory—but the heat of the current scene creates a **POV distance** where that knowledge is inaccessible. They are "drunk" on emotion. The knowledge exists in the manuscript, but not in the character's active consciousness.
  *   **What has to be bent:** Aristotle relies on a syllogistic structure (Universal vs. Particular). Craft relies on psychological pressure. You have to translate "failure to apply the particular premise" into "the stakes of the immediate scene overwhelmed the thematic stakes." The "sleep" is not physiological but attentional.
  *   **What cannot be said at all:** The precise mechanism of suppression. Aristotle suggests the knowledge is *there* but bound. Craft usually depicts this as the knowledge being *gone* or *ignored*. In craft terms, if the knowledge isn't influencing the action, it effectively doesn't exist in the scene. Aristotle claims it exists inertly; craft says if it doesn't drive action or interiority, it's exposition, not character.

  ### 3. Donald Davidson's All-Things-Considered (ATC) vs. Unconditional Judgment
  **The Philosophy:** Davidson dissolves the paradox by arguing the agent makes two different judgments. 1) An ATC judgment ("Considering everything, A is better"). 2) An unconditional judgment ("I will do B"). There is no logical contradiction because the judgments are of different types. One is evaluative; the other is intentional.

  **The Craft Translation:**
  *   **What carries over cleanly:** This is the most robust map for **Interiority vs. Action**. The ATC judgment is the **Narrative Need** or the voice of the Superego/Conscience within the **Interiority**. The Unconditional judgment is the **Scene Goal**. A character can think, "I know I shouldn't steal this" (ATC/Need) while simultaneously forming the intention, "I am taking it" (Unconditional/Want). This allows for the **Dramatic Irony** of a character observing their own failure in real-time.
  *   **What has to be bent:** Davidson is protecting the principle of non-contradiction in logic. Craft protects the principle of psychological realism. You have to bend the logical distinction into an emotional one. The "Unconditional Judgment" isn't just an intention; in craft, it's a commitment of the body.
  *   **What cannot be said at all:** The logical safety net. Davidson uses this to save rationality. Craft doesn't care if the character is rational; craft cares if they are consistent. Davidson says, "This is logically permissible." Craft says, "This is humanly recognizable." Craft allows the character to feel the contradiction as pain; Davidson treats the contradiction as a category error that doesn't actually exist.

  ### 4. Behavioral Economics (Hyperbolic Discounting)
  **The Philosophy:** Value is not constant over time. As a reward gets closer, its perceived value spikes non-linearly. Preferences reverse. At t1 (distance), I prefer Health. At t2 (proximity), I prefer Cigarette. It is not that Will failed; it is that the Value changed.

  **The Craft Translation:**
  *   **What carries over cleanly:** This redefines **Stakes**. Stakes are not static; they are temporal. The "Need" (Health) has high value in the **Backstory** or **Sequel** (reflection), but the "Want" (Cigarette) has high value in the **Scene** (proximity). This explains why a character can be consistent in their *mechanism* (always choosing the proximate reward) while appearing inconsistent in their *values* (sometimes choosing health, sometimes poison).
  *   **What has to be bent:** Economics treats the self as a series of time-slices. Craft treats the self as a continuous entity bound by a **Contract of Consistency**. To make this fit, you have to view the "Character Arc" not as a change in values, but as a change in the ability to endure temporal distance (i.e., learning to value the distant reward).
  *   **What cannot be said at all:** Agency as a moral force. In hyperbolic discounting, the reversal is mathematical, almost physical. In craft, the lapse is a **Choice**. If you adopt the economic view fully, the character isn't "weak"; they are just reacting to a value curve. This removes the tragedy of the lapse. It turns a moral failure into a calculation error based on proximity.

  ***

  ### Answers to Your Specific Questions

  **First: Is the workshop dictum ("character must want something and take action") a vote for the Socratic side?**
  Yes, functionally. If you enforce the rule that Action = Want, you eliminate the possibility of true *akrasia* in the text. You force the writer to locate the desire that *matches* the action. If a character acts against their interest, the workshop demand forces you to write the scene until it reveals that, actually, they wanted the self-destruction more than the success. It renders *akrasia* as **Mislabeled Desire**. It suggests a novel cannot depict a will failing; it can only depict a will succeeding at a goal the reader didn't initially perceive.

  **Second: If preferences flip (Economics), does describing a lapse as "out of character" conflate the reader's vantage point with the character's?**
  Yes. Calling a lapse "out of character" privileges the **Long View** (the reader's memory of the character's past actions or the character's stated "Need") over the **Immediate View** (the character's current discount function). If hyperbolic discounting is true, the lapse *is* "in character" for the time-slice self at t2. By labeling it "out of character," you are enforcing a unity of self that the economic model denies. You are asking the reader to judge the character based on a consistent identity, while the character is living through a fragmented series of present moments where value is unstable.

  ***

  ### Residue Report

  **Is there anything in the philosophical dispute that has no counterpart in how novelists talk about character?**

  Yes. The residue is **Normative Rationality**.

  Philosophy (especially Socrates and Davidson) is obsessed with whether the action is *defensible* or *logical*. They are trying to solve the paradox of how a rational agent can act irrationally. They want to know if the agent is broken, ignorant, or actually consistent.

  Craft vocabulary has no use for "defensible." Craft cares about **Believability** and **Compulsion**, not Rationality.
  *   **The Residue:** The question "Is this action logically consistent with the agent's knowledge?" is a philosophical question. The question "Does this action feel psychologically true?" is a craft question.
  *   **What this implies:** It does not mean your craft vocabulary is missing something. It means the projects are different. Philosophy tries to save the concept of the Rational Agent. Fiction tries to depict the Human Agent. Humans are often irrational in ways that are not logically resolvable (Davidson's worry) but are emotionally resonant.

  **Does the residue mean the philosophers' disagreement is less clear than it looks?**

  In the context of fiction, yes. The fierce philosophical debate over whether *akrasia* is *possible* (Socrates says no, Aristotle says yes, Davidson says it's a category error) collapses when applied to the page.
  *   On the page, *akrasia* happens constantly.
  *   The reader does not care if the character *technically* knew the good (Socrates/Aristotle split).
  *   The reader cares if the **Interiority** renders the conflict painful enough to justify the action.

  The philosophers are arguing about the machinery of the soul. You are arguing about the machinery of the scene. The residue suggests that the philosophical dispute is largely semantic when removed from the realm of logic and placed into the realm of psychology. Your craft vocabulary absorbs all four positions as *modes of rendering conflict*, whereas the philosophers treat them as *mutually exclusive truths*.

  **Final Verdict:** Your craft vocabulary is not deficient; it is pragmatic. It treats these four positions not as competing truths, but as four different lenses for focusing **Interiority**.
  1.  **Socratic:** Focus on making the hidden Want legible.
  2.  **Aristotelian:** Focus on the distance between Backstory Knowledge and Scene Action.
  3.  **Davidsonian:** Focus on the split between Interior Thought (ATC) and Physical Action (Unconditional).
  4.  **Economic:** Focus on the shifting weight of Stakes over Time.

  The only thing you lose is the demand to prove the character is logically consistent. In fiction, as in life, they rarely are.
