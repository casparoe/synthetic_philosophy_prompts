  **Cozy Studio in Gödel Rotating Metric (Sector 4)**
  **Host:** Kurt
  **Location:** Non-Global Hyperplane District

  **About this space**
  Enjoy definately unique lighting conditions in this open-concept present with non-chronological layout. Perfect for singles or couples who don't mind overlapping timelines, this studio offers the rare comfort of a south-facing past, ensuring warm evenings regardless of when you arrive. Due to the rotating matter density, natural light bends comfortably around the kitchenette, providing ample illumination for late-night reading even before the sun has risen. The neighborhood is quiet, provided you ignore the hum of the cosmological constant.

  **The Space**
  While the square footage is standard, the temporal volume is expansive. Guests often appreciate the closed timelike curves (CTCs) accessible from the balcony—great for evening strolls that loop back to your morning coffee. Please note the absence of global hyperplanes means there is no universal "now" to coordinate with neighbors, offering true privacy from simultaneous observation. Some tenants report hearing themselves arguing in the next room; this is normal acoustic bleed-through from adjacent causal curves and not a plumbing issue. The walls are soundproofed against most paradoxes, though low-frequency existential dread may penetrate during peak rotation cycles.

  **Amenities**
  *   High-speed Wifi (password protected by philosophical waiver)
  *   Fully equipped kitchenette (microwave works in reverse)
  *   Closed Timelike Curves (shared)
  *   Air conditioning (entropy neutral)
  *   Self-check-in (literally)

  **Guest Access**
  Check-in is flexible. In fact, checkout technically precedes check-in, but management handles the paperwork. Key exchange occurs via causal handshake. If you meet yourself at the door, please prioritize the version with the luggage. Do not attempt to exchange information regarding lottery numbers or stock markets with your past self; this violates local zoning laws regarding informational contamination.

  **House Rules**
  1. No altering initial conditions without written permission.
  2. Quiet hours apply across all local proper times.
  3. To receive the wifi password, guests must initial a clause agreeing that the distinction between before and after is a mental construct.
  4. Do not feed the singularities.
  5. Please remove shoes before entering the causal loop.

  **Legal Addendum**
  By booking, you acknowledge compliance with the Causal-Loop Liability & Continuity Dispute Act (CLLCDA). Tenants waive the right to sue for existential redundancy, property damage caused by future selves, or loss of linear narrative coherence. In events of continuity disputes (e.g., two guests claiming the same lease due to loop convergence), priority is given to the entity with the highest entropy. Management is not responsible for lost hours, paradox-induced nausea, or instances where the tenant ceases to have been born. All disputes will be settled in a court of law that has not yet been established.

  **Reviews**

  ★★★★★
  **Mark T.** – *Stayed 3 weeks (subjective)*
  "Location is great, but the noise was an issue. Kept meeting earlier versions of myself in the hallway who were loud on the phone. I asked him to keep it down and he said he was me. Also, checkout was confusing since I already left last Tuesday. Host was responsive though."

  ★★★★★
  **Mark T.** – *Stayed 3 weeks (subjective)*
  "Updating my review: The earlier version of me finally moved out. Space feels bigger now. Would recommend signing the waiver quickly if you want internet access. The south-facing past is lovely in the evenings, especially when the rotation slows down. Would stay again, assuming I haven't already."
