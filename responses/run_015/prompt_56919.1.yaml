answer: |-
  ### Term Sheet: Governance by Conditional Prediction Contracts

  **1. The Underlying and Fixing**
  The instrument references a defined index, "National Welfare" (NWI). This is the deliverable.
  *   **Fixing Agent:** The State (legislature/bureaucracy). They define the basket of metrics (GDP, mortality, survey data) and publish the final fix.
  *   **Settlement Lag:** Long-dated. Policies settle 5–10 years post-execution.
  *   **Basis Risk:** High. The NWI is a proxy for "utility." There is no guarantee the basket correlates with actual citizen welfare. Disputes on the fixing methodology are political, not arithmetic.

  **2. The Instrument**
  *   **Structure:** Conditional Binary Options or Spreads.
  *   **Leg A:** Payoff based on NWI *if* Policy X is enacted.
  *   **Leg B:** Payoff based on NWI *if* Policy X is *not* enacted (or Policy Y is enacted).
  *   **Knock-Out/Call-Off:** Hanson's "called-off bet." If the policy is not adopted, the contract voids or unwinds at cost.
  *   **Trigger:** The market spread between Leg A and Leg B determines execution. If Price(A) > Price(B), the policy is automatically enacted. The market price is the *delta* of the legislation.

  **3. Counterparty and Clearing**
  *   **Counterparty:** The State (Treasury). The state collects the premium on the losing policy and pays out on the winning welfare outcome.
  *   **Clearinghouse:** Implicitly the State. There is no third-party CCP. Sovereign risk is embedded in the settlement. If the state refuses to pay (or refuses to accept the loss), the contract defaults.
  *   **Margin:** Speculators post collateral. The State posts "full faith and credit."
  *   **Position Limits:** None defined, creating concentration risk where wealthy actors can dictate policy via capital weight.

  **4. Liquidity and Market Dynamics**
  *   **Market Makers:** Speculators, lobbyists, affected industries.
  *   **Adverse Selection:** High. The parties with the best alpha on the NWI are often the parties whose P&L is most correlated with the NWI (insiders).
  *   **Manipulation:** Two vectors. (1) Trade manipulation to trigger the policy (pump the price). (2) Fixing manipulation to settle the contract (sabotage the NWI post-policy to win the bet).
  *   **Reflexivity:** The market price is not exogenous. A high price on "Policy X succeeds" may cause the State to adopt Policy X, thereby altering the probability of the underlying event. The market is trading its own gamma.

  ***

  ### Residue Report

  Here is the sorting of the political claims into your vocabulary.

  **Pile 1: Clean Translation (No Loss)**
  *   **Incentive Alignment:** "Representatives should act in the public interest" translates cleanly to "Align P&L with the Underlying." If the trader (politician) holds the long side of the NWI, they hedge by improving the NWI.
  *   **Information Aggregation:** "Democracy aggregates local knowledge" translates to "Price Discovery aggregates private information." The mechanism is identical: order flow reveals hidden data.
  *   **Policy Comparison:** "Debate which law is better" translates to "Spread Trading." Long Policy A / Short Policy B isolates the alpha of the specific intervention from the beta of the macro environment.

  **Pile 2: Distorted Translation (Structural Bends Required)**
  *   **Legitimacy/Authority:**
      *   *Political Claim:* The government has the right to rule because of consent.
      *   *Trading Translation:* The government is the **Enforcement Mechanism** for the contract.
      *   *The Bend:* "Right to rule" becomes "Capacity to settle." Legitimacy is assumed to be a function of solvency and enforcement power. This ignores normative authority (why we *should* obey) and replaces it with functional authority (who *makes* us obey).
  *   **Equality/Voting:**
      *   *Political Claim:* One person, one vote.
      *   *Trading Translation:* One dollar, one vote (Capital-Weighted Averaging).
      *   *The Bend:* This requires accepting that wealth distribution is a valid proxy for epistemic virtue or stakeholder interest. It bends the definition of "constituency" from "citizen" to "capital provider."
  *   **Public Good:**
      *   *Political Claim:* Welfare is a shared, non-rivalrous state.
      *   *Trading Translation:* Welfare is a **Fixing Number**.
      *   *The Bend:* Reduces a multidimensional, qualitative state to a single observable scalar. This introduces massive basis risk. The contract settles on the *number*, not the *reality*.

  **Pile 3: No Counterpart (Untranslatable)**
  *   **Justice/Rights:** There is no contract spec for "inalienable rights." A market can price the removal of a right if it increases the NWI. The vocabulary has no circuit breaker for "unjust outcomes," only "inefficient prices."
  *   **Consent of the Governed:** In trading, you consent by entering the trade. In polity, you are bound by the contract even if you never took a position. There is no "opt-out" clause for the citizenry.
  *   **Deliberation:** The process of arguing values has no equivalent in execution. In a market, you reveal value via bid/ask. In politics, value is revealed via discourse. The market skips the discourse and prices the output.

  ***

  ### Stress Testing the Structure

  **Case 1: City Council Upzoning (The Insider Fixing Problem)**
  *   **Structure:** Market settles in 7 years on "Resident Welfare Index" (Rent Stability + Property Values + Crime).
  *   **Participants:** Landlords (Long Upzone), Tenants (Short Upzone).
  *   **The Trade:** Tenants see the price implies Upzone will pass. They short the NWI under the Upzone scenario.
  *   **The Distortion:** To win the short, Tenants have an incentive to ensure the NWI *fails* if Upzone passes. They may withhold maintenance, increase reported crime, or move out to depress the index.
  *   **Vocabulary Diagnosis:** This is **Moral Hazard on the Fixing Agent**. The counterparties are also the data providers. In energy markets, this is like the refinery reporting the inventory numbers they are trading against.
  *   **Result:** The contract creates a perverse incentive to sabotage the underlying to realize the payoff. The market does not predict the future; it incentivizes a specific, negative future to settle the book.

  **Case 2: Sanctions (The Reflexivity Problem)**
  *   **Structure:** Market settles on "Target Nation GDP." Contract: "Sanctions Imposed" vs. "Sanctions Lifted."
  *   **The Trade:** Speculators know that if the "Sanctions Imposed" contract trades low (implying failure/humanitarian crisis), the domestic government will face pressure to lift them.
  *   **The Distortion:** The market price becomes a leading indicator that forces the hand of the issuer.
  *   **Vocabulary Diagnosis:** **Endogenous Risk / Gamma Squeeze.** The delta of the policy is not static. As the position size grows, the market moves the underlying probability. If the market says "Sanctions will crush GDP," the State may lift sanctions to prevent the crush, making the market prediction self-fulfilling or self-negating.
  *   **Result:** The price is no longer a forecast; it is a control signal. You cannot clear a contract where the settlement value is a function of the open interest.

  ***

  ### Conclusion: The Settlement Gap

  **Is the residue a structural flaw or a design problem?**
  It is a **structural settlement failure**.

  In your vocabulary, a trade requires three things: an observable underlying, a neutral fixing agent, and a solvent counterparty. Futarchy fails on all three when scaled to governance.
  1.  **Underlying:** "Welfare" is not observable like a LIBOR fix or a barrel of oil. It is a constructed statistic subject to revision and political pressure.
  2.  **Fixing Agent:** The State cannot be a neutral fixing agent when it is the entity being judged. It will redefine the index to avoid default.
  3.  **Counterparty:** The State is the counterparty. If the trade goes against the State (e.g., Market says "War will lose money," State goes to war anyway), the State repudiates the debt. Sovereign risk is 100%.

  **What the vocabulary reveals that philosophy misses:**
  Political philosophy argues about *legitimacy*. Your vocabulary argues about *settlement*.
  The trading frame exposes that **Futarchy is a derivatives market without a clearinghouse.**
  *   **Conditional Payoffs with No Declarant:** In a knock-out option, someone must declare the knock-out event. In Futarchy, who declares "Welfare Increased"? If the State does, they control the payout. If the Market does, it's circular.
  *   **Capital-Weighted Consensus:** Philosophy treats "the people" as a singular agent. The trading frame reveals "the people" as a distribution of capital. The policy will reflect the beliefs of the wealthiest hedgers, not the median citizen. This isn't a bug in the code; it's the code.
  *   **Reflexivity:** Philosophy assumes the decision is separate from the prediction. The trading frame shows that when the prediction *is* the decision mechanism, you create a feedback loop that destroys price discovery. You are trading a variable with a delta of 1.0 against your own position.

  **Final Verdict:**
  The critics are correct, but for mechanical reasons, not moral ones. The proposal attempts to securitize a non-securitizable underlying (social welfare) using a conflicted fixing agent (the State) in a market with endogenous liquidity (policy reflexivity).

  It is not a governance model; it is a **perpetual motion machine for basis risk.** It works only if you assume the State will honor losses on trades it structurally controls, and that "Welfare" can be fixed with the precision of a currency rate. Neither assumption holds. The residue isn't just noise; it's the sound of the contract tearing at the seams.
