answer: |-
  This is a classic case of weaponized half-truths. Your roommate is taking a technical distinction from the philosophy of language and stretching it to cover a moral evasion. She is conflating *legal enforceability* with *normative force*.

  Here is the menu of philosophical claims smuggled into that sentence, ranked from the boringly true to the self-destructively radical. For each, I have mapped the logic and delivered a verdict on whether it actually absolves her of guilt for bailing on your gallery opening.

  ### 1. The Legalistic Distinction (Trivial)
  **The Claim:** "A promise lacks the machinery of enforcement that a contract has."
  **The Logic:** This argues that contracts involve consideration (exchange of value), signatures, and legal recourse, whereas promises are unilateral and unenforceable in court. Therefore, breaking a promise is not a *legal* wrong.
  **The Verdict:** **True, but irrelevant.**
  This lets her off the hook for being *sued*, but not for being *wrong*. Morality operates where the law ends. If I promise to water your plants and don't, I haven't broken a law, but I have damaged your trust and harmed your interests. This claim admits she broke a social commitment but denies that social commitments carry weight. It does not justify the flake.

  ### 2. The "Words Are Just Wind" Claim (Linguistic Reductionism)
  **The Claim:** "Performatives lack propositional content, so they cannot describe a duty."
  **The Logic:** This suggests that because a promise isn't a statement of fact (it can't be proven true or false like "the sky is blue"), it doesn't attach to reality. It treats the promise as a noise you made rather than an action you took. It implies that because the words don't describe a pre-existing state of affairs, they don't create a new one.
  **The Verdict:** **False.**
  This misunderstands how language works. Speech acts *are* actions. When a judge says "I sentence you," or an officiant says "I pronounce you," reality changes. When your roommate said "I promise," she altered the relationship between you. She created an expectation and a reliance. Denying this is like saying "I didn't actually hit you, my fist is just matter in motion." The medium (speech) doesn't negate the impact (obligation).

  ### 3. The "Chess Move" Claim (Conventionalism)
  **The Claim:** "Promises are like chess moves; they only have weight within the game."
  **The Logic:** This argues that obligations are internal to a specific practice. In chess, a knight moves in an 'L' shape because we agreed to those rules. If you stop playing chess, the rules no longer bind you. Similarly, if "promising" is just a social game, she can opt out of the game whenever she wants. The obligation is conventional, not natural.
  **The Verdict:** **Conditional Failure.**
  This only works if she opts out of *all* social cooperation. By living with you and interacting with you, she is "playing the game." You cannot make a chess move and then say, "Actually, I don't believe in chess rules," after you've already moved your piece. She invoked the convention to gain your trust (that you would save the spot/wait for her), so she is bound by the convention she utilized. She is still in the wrong.

  ### 4. The "Illocutionary Force is Magic" Claim (Skeptical)
  **The Claim:** "Illocutionary force never generates real obligation because words cannot bind the will."
  **The Logic:** This is the radical core of her argument. It posits that no amount of speaking can morally constrain a future action. To say "I must do X because I said I would" is to treat words as magical chains. It argues that your future self is always free, and any attempt to bind it with past words is a fiction.
  **The Verdict:** **Self-Defeating.**
  If this were true, no one could ever be wrong about anything they said. It destroys the possibility of communication. If words cannot bind the will, then her statement "a promise is just a speech act" is also just a speech act that binds nothing—including your expectation that she is telling the truth. It lets her off the hook for the promise, but at the cost of making her current argument meaningless.

  ### 5. The "Promissory Collateral is Fiction" Claim (Nihilistic)
  **The Claim:** "Trust is a prediction, not a debt."
  **The Logic:** This claims that when you promise, you are merely predicting your future behavior ("I will likely be there"). If you don't show up, your prediction was just inaccurate, not immoral. There is no "collateral" or moral debt incurred, only a forecasting error.
  **The Verdict:** **Radically Dishonest.**
  This redefines promising out of existence. A promise is distinct from a prediction precisely because it offers a guarantee, not a probability. By treating her promise as a mere prediction, she is lying about what she was doing when she made the commitment. She asked you to rely on her as a certainty, then claims she only offered a probability when she failed. This is a bait-and-switch, leaving her firmly in the wrong.

  ***

  ### Which reading is she actually using?

  When people use this line to win an argument about flaking, they are usually deploying a mix of **Claim 1 (Legalistic)** and **Claim 5 (Prediction vs. Debt).**

  It is a **Rationalization Strategy**, not a philosophical stance.
  *   **The Mechanism:** She knows she feels guilt (moral pressure). To eliminate the guilt, she tries to eliminate the category of "moral wrong." She does this by insisting that only *legal* wrongs are "real" wrongs (Claim 1).
  *   **The Backup:** If you press her on morality, she retreats to Claim 5, implying you are unreasonable for expecting her to be bound by her own words.

  **The Bottom Line:**
  She is correct that a promise is not a *legal contract*. She is incorrect that this exempts it from being a *moral contract*.

  By saying "I promise," she invited you to rely on her. You relied on her (by saving the spot, planning your night, expecting her support). By bailing, she wasted your reliance. Even if it's "just a speech act," speech acts are the primary way humans coordinate reality. Breaking that coordination without cause is a moral failure, regardless of whether a judge would care.

  **How to respond:**
  You don't need to beat her on philosophy. You can beat her on consistency.
  *"If a promise is just a speech act with no obligation, then your apology is also just a speech act with no obligation. So I shouldn't feel bad about being angry, because my anger is just a biological reaction, not a moral judgment."*

  Or, more simply: *"If promises aren't binding, then 'I will pay you back' is also just a speech act. Want to test that theory?"*
