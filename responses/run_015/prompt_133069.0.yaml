  my roommate keeps throwing around "a promise is just a speech act, not a contract" whenever i cancel on her, like last week when i bailed on her gallery openeing. she uses it to claim breaking a promise is only socially awkward, not actually morally wrong. can you break down the different precise philosophical claims that line could be smuggling in? i want the menu: is she saying performatives lack propositional content, or that illocutionary force never generates real obligation, or that promises are like chess moves with only conventional weight, or something about "promissory collateral" being a fiction? lay them out from the trivial to the genuinely radical, and for each say whether it actually lets her off the hook or still leaves me in the wrong. she mentioned austin and maybe searle but i think shes mixing them up—dont quote anyone, just map the logic. also tell me which reading someone usually means when they use this to win an argument about flaking.
reasoning: |-
