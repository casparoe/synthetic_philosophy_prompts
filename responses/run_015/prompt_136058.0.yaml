  (1) Conceptual framing
  The dollar auction model maps onto this cooperative deadlock by treating social capital and unpaid labor as the bidding currency rather than cash, and reputational standing as the stake rather than private ownership. In this modified contest, the "second-place penalty" is not a monetary loss but the social stigma of having advocated for a losing proposal, which diminishes a member's influence in future governance matters. Partial exit complicates this further because withdrawing from the bidding process does not absolve a member of the collective obligation to fund or live with the renovation; it merely cements their status as a loser who still must pay the costs. Thus, the mechanism functions as a trap where members escalate commitment not to gain a private asset, but to avoid the disproportionate reputational cost of backing down while remaining liable for the outcome.

  (2) Core implications
  Rational escalation occurs because the marginal cost of additional labor or argumentation feels lower than the immediate certainty of reputational loss associated with conceding. Members perceive themselves as already invested in a specific aesthetic vision, and abandoning that vision validates the judgment that their prior social labor was wasted. Consequently, continuing the fight becomes the only way to preserve the potential value of their sunk costs, creating a dynamic where rational actors pursue irrational outcomes to protect their standing within the group.

  Observable commitment acts as a signaling mechanism that intensifies the deadlock, as members publicly invest time and effort to demonstrate the seriousness of their preference. This visibility creates a record of investment that makes retreat difficult; to quit is to admit that one's previous contributions were misallocated, which threatens one's identity as a competent community member. The more visible the labor, the higher the social barrier to exit, ensuring that the bidding war continues well past the point where the renovation's actual value justifies the conflict.

  De-escalation requires altering the payoff structure so that conceding does not equate to a total loss of status. Conditions for resolving the deadlock involve introducing face-saving mechanisms that allow members to withdraw without admitting defeat, such as reframing the decision as a compromise or externalizing the final choice. If the group can decouple the final outcome from individual proponents, members can step back without suffering the second-place penalty, effectively neutralizing the incentive to escalate further.

  (3) Boundary conditions
  The analogy weakens where the non-fungibility of labor and the non-excludable nature of the physical renovation diverge from standard auction assumptions. Unlike cash bids, social labor varies in quality and impact, meaning members cannot easily compare who has "bid" more, which can lead to disputes over the validity of contributions rather than just the amount. Furthermore, because the renovated space is a shared resource, the losing bidders still consume the result, meaning the pain of the outcome is distributed collectively rather than borne solely by the loser, complicating the cost-benefit analysis that usually drives auction behavior.

  (4) Application to the cooperative case
  Your deadlock is best explained by a modified escalation mechanism driven by reputational defense rather than pure prize acquisition. Because the physical result is shared but the prestige is contested, the conflict persists not because members value the renovation differently, but because conceding threatens their long-term social capital within the association. Breaking the cycle requires removing the link between the decision outcome and individual reputation, likely by shifting the final authority to a neutral party or a blind voting process that anonymizes the victory.

  (5) Bottom line
  To restore cooperation, you must decouple the decision from the proponents by introducing a neutral selection mechanism that allows members to accept the outcome without admitting personal defeat. This preserves group cohesion by ensuring that no single member is branded a loser while allowing the association to move forward.
