prompt: |-
  So next month I'm giving a departmental colloquium — 45 minutes plus a long Q&A — at a place that's very strong in metaphysics and only okay in ethics, and the organiser has warned me that maybe a third of the room won't work in value theory at all. My paper defends an account of the procreation asymmetry that I've been calling the custodial view, and I need a prep sheet for the question period rather than another defense of the paper. Sketch of the argument so you know what the objections should be aimed at:

  1. Reasons of beneficence aren't freestanding. They only arise inside an actual relation of custody over a subject — a relation in which that subject's welfare is *yours to look after*. Call this the custody condition.
  2. A merely possible person stands in no such relation to anyone, so there's no welfare that is anyone's to promote. Hence no reason to bring about a happy life. Not because happy lives aren't good — I'll grant in the talk that they're good impersonally — but because a good that isn't anybody's to look after doesn't generate a reason for anybody in particular to produce it.
  3. Procreating is the act of *entering* a custody relation, and you can't permissibly enter a relation you already know you won't be able to discharge. A life of severe, unrelievable suffering is exactly that, so there's a decisive reason against creating it.
  4. The asymmetry then falls out with no person-affecting restriction on value, and without having to claim that misery is bad-for-someone while happiness is somehow not good-for-anyone.

  The thing that keeps me up is that the machinery in (1) and (3) is mine and there's no existing defence of it I can lean on, so unlike the standard asymmetry views I can't gesture at somebody else's replies when I get stuck.

  Give me the eight or nine objections I'll actually get from *this* room, in roughly the order they'll come, and phrase each one the way that subgroup would phrase it — the metaphysicians are not going to put it the way the population ethicists would. I specifically expect a necessitist to go after step 2: if possible people exist as non-concrete objects, isn't there already a subject for the custody relation to latch onto, and doesn't my view smuggle in contingentism as an undefended premise? Tell me how bad that actually is as opposed to how bad it sounds at the podium. There's also a health economist in the department who models climate damages and will want to know whether I've just given people a licence to discount the wellbeing of anyone who doesn't exist yet, plus someone in reproductive policy who'll ask about existing children — adoption, fostering — and whether my view makes procreation merely permissible or actively second-best, which is a political fight I do not want to have in a colloquium. And somebody will try to collapse me into Benatar while somebody else tries to collapse me into the older person-affecting asymmetry; say which of those two collapses is the real threat and give me the cleanest wedge.

  For each objection: how damaging it is, on a scale from "I have nothing" to "two sentences and we move on"; the two-or-three-sentence reply I should give in the room; and a blunt note on where that reply is soft. Flag which ones I should concede up front in the talk to buy goodwill, and tell me the single reply that has to land for the paper to survive the afternoon. Finish with the question I'm praying nobody asks. Please don't send me a reading list or citations — I know the literature, its my sense of which of these actually bites that I dont trust.
reasoning: |-
  Here's a thinking process that leads to the suggested prep sheet:

  1.  **Analyze the Request:**
      *   **Context:** Departmental colloquium (45 min talk + long Q&A).
      *   **Audience:** Strong in metaphysics, okay in ethics. ~1/3 don't work in value theory.
      *   **Topic:** Procreation Asymmetry (The "Custodial View").
      *   **Core Argument:**
          1.  Beneficence requires an actual custody relation (welfare is *yours* to look after).
          2.  Possible people stand in no such relation $\rightarrow$ No reason to create happy lives.
          3.  Procreating = entering custody. Can't enter if you know you can't discharge (severe suffering) $\rightarrow$ Reason against creating miserable lives.
          4.  Result: Asymmetry without person-affecting restrictions or claiming happiness isn't good.
      *   **Speaker's Anxiety:** The machinery (custody condition, entering relations) is original/un defended. Needs a prep sheet for Q&A, not more argument.
      *   **Specific Concerns:**
          *   Necessitist objection (Step 2): Possible people exist as non-concrete objects $\rightarrow$ Custody relation already possible? Smuggling contingentism?
          *   Health Economist (Climate): Discounting future wellbeing?
          *   Reproductive Policy (Adoption/Fostering): Is procreation second-best?
          *   Collapses: Benatar vs. Person-Affecting View. Which is the real threat?
          *   Format: 8-9 objections, ordered by likelihood, phrased for *this* room (metaphysicians first), damage assessment, 2-3 sentence reply, blunt note on softness.
          *   Strategic advice: What to concede up front? What *must* land? What's the "prayer" question (the one to avoid)?
          *   Constraint: No reading lists/citations.

  2.  **Deconstruct the Audience & Argument:**
      *   **Metaphysicians:** Will care about ontology, modality, and the nature of relations. They will attack the "custody relation" ontology. Is it real? Does it require relata?
      *   **Ethicists (Non-Value Theory):** Will care about intuitive cases, policy implications, and consistency.
      *   **The Argument's Weak Points:**
          *   *The Custody Condition (1):* Why is beneficence relational? This is the biggest philosophical leap.
          *   *The Entry Condition (3):* What counts as "knowing you can't discharge"?
          *   *The Asymmetry:* Does it really avoid the Benatar collapse (misery is bad, happiness isn't good)?
      *   **Specific Prompt Requirements:** Address the Necessitist, the Health Economist, the Policy Person, and the Collapses.

  3.  **Drafting the Objections (Iterative Process):**

      *   *Objection 1: The Necessitist/Metaphysical Objection (Priority: High).*
          *   *Phrasing:* "You assume contingentism. If necessitism is true, possible people exist as non-concrete objects. Why can't I have a custody relation to a non-concrete object?"
          *   *Damage:* High if not handled. It attacks Step 2 directly.
          *   *Reply:* Custody requires *causal* interaction/care, which requires concreteness.
          *   *Softness:* Why does custody require causality? Isn't there abstract care?
          *   *Strategy:* Concede contingentism is a premise but argue custody is inherently causal.

      *   *Objection 2: The "Why Custody?" Objection (General Ethics).*
          *   *Phrasing:* "You've just pushed the asymmetry back. Why is beneficence relational? That looks ad hoc to get the result."
          *   *Damage:* Medium-High. Attacks the foundation.
          *   *Reply:* Analogy to special obligations (parents vs. strangers). Procreation *creates* the special obligation.
          *   *Softness:* Special obligations usually presuppose existence.

      *   *Objection 3: The Health Economist/Climate (Future Generations).*
          *   *Phrasing:* "Does this let us ignore climate change? If future people aren't in custody relations yet, do we have no reason to preserve the planet for them?"
          *   *Damage:* High (Political/Practical stakes).
          *   *Reply:* We have custody of the *conditions* for future custody. We are custodians of the *world* they will inhabit.
          *   *Softness:* Stretching "custody of world" to "custody of people."

      *   *Objection 4: The Policy/Adoption Objection.*
          *   *Phrasing:* "If procreation is entering custody, and adoption is taking over custody, does this imply we should adopt rather than procreate? Is procreation second-best?"
          *   *Damage:* Medium (Political minefield).
          *   *Reply:* No. Procreation is *initiating* custody; adoption is *transferring* it. Both are permissible entries.
          *   *Softness:* Doesn't address resource allocation arguments.

      *   *Objection 5: The Benatar Collapse.*
          *   *Phrasing:* "You say happiness is impersonally good, but your asymmetry looks exactly like Benatar's. Presence of pain is bad, absence of pleasure is not bad. You're just dressing it up."
          *   *Damage:* High (Theoretical identity crisis).
          *   *Reply:* Benatar says absence of pleasure is *not bad*. I say it's *good but not mine to promote*. Big difference in value theory.
          *   *Softness:* Practical outcome is the same.

      *   *Objection 6: The Person-Affecting Collapse.*
          *   *Phrasing:* "This is just the Person-Affecting View (PAV) with extra steps. No subject, no harm/benefit."
          *   *Damage:* Medium (Theoretical redundancy).
          *   *Reply:* PAV says no harm/benefit. I say there *is* good, just no *agent-relative reason*. I keep impersonal value.
          *   *Softness:* Hard to explain why agent-relative reasons matter if impersonal value exists.

      *   *Objection 7: The "Entering Relation" Problem (Step 3).*
          *   *Phrasing:* "You say you can't enter a relation you can't discharge. But we often enter relations with uncertain outcomes. Why is suffering different?"
          *   *Damage:* Medium.
          *   *Reply:* Risk is permissible; *known* unrelievable suffering is not. The threshold is high.
          *   *Softness:* Defining "known."

      *   *Objection 8: The Non-Identity Problem.*
          *   *Phrasing:* "If I choose a policy that creates different, poorer people, have I violated custody? They wouldn't exist otherwise."
          *   *Damage:* Low/Medium (Standard puzzle).
          *   *Reply:* Custody attaches to the *actual* people once created. The choice is about *which* custody relation to enter.
          *   *Softness:* Doesn't solve the non-identity intuition fully.

      *   *Objection 9: The "Prayer" Question.*
          *   *Question:* "If custody is the source of reasons, do we have reasons to *avoid* creating people who would be merely miserable (not severely)? Where is the line?"
          *   *Damage:* Fatal if the line is arbitrary.

  4.  **Refining and Ordering:**
      *   Need to ensure the "Metaphysician" tone is distinct from the "Ethicist" tone.
      *   Need to address the specific Necessitist prompt detail carefully.
      *   Need to select the "Single Reply That Must Land." That's likely the distinction between *Value* and *Reason* (Impersonal Good vs. Agent-Relative Reason).
      *   Need to identify the "Concession." Conceding contingentism or the relational nature of beneficence might be too much. Better to concede the *intuition* behind the climate objection to disarm it.

  5.  **Final Polish (checking against constraints):**
      *   8-9 objections? Yes.
      *   Ordered? Yes (Metaphysics first, then Ethics/Policy).
      *   Damage scale? Yes.
      *   Reply length? 2-3 sentences.
      *   Blunt note on softness? Yes.
      *   Concession advice? Yes.
      *   Single crucial reply? Yes.
      *   Prayer question? Yes.
      *   No citations? Yes.

      *(Self-Correction during drafting)*: Make sure the Necessitist objection is handled precisely. The prompt asks: "Tell me how bad that actually is as opposed to how bad it sounds." It sounds fatal, but actually, it's manageable if custody is defined causally. I need to make sure the prep sheet reflects that nuance.
      Also, the "Benatar vs. PAV" collapse needs a clear winner. The Benatar collapse is the bigger threat because it attacks the *value* claim, whereas PAV attacks the *reason* claim. The speaker claims to keep impersonal value, so Benatar is the one saying "No you don't."

      *(Refining the Climate Objection)*: The economist will worry about discount rates. The reply needs to be about "custody of the preconditions" rather than "custody of the people."

      *(Refining the Policy Objection)*: The speaker doesn't want a political fight. The reply must neutralize the "second-best" claim immediately.

      *(Final check on the "Single Reply")*: The core of the view is that Value $\neq$ Reason. That is the hinge. If that breaks, the view collapses into PAV or Total Utilitarianism.

  6.  **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  **PREP SHEET: CUSTODIAL VIEW Q&A**

  **Audience Profile:** Metaphysicians (ontologically aggressive, modality-focused), General Ethicists (intuition-driven), Policy/Econ (consequence-focused).
  **Strategy:** Metaphysicians will attack the *relata* of the custody relation. Ethicists will attack the *source* of the norm. Policy will attack the *implications*. Do not get bogged down in defending the custody condition as a general theory of value; frame it as a theory of *procreative* reasons.

  ---

  ### 1. The Necessitist Trap (Metaphysics)
  **Phrasing:** "You're assuming contingentism in Step 2. If necessitism is true, possible people exist as non-concrete objects. Why can't I stand in a custody relation to a non-concrete object? You seem to be smuggling in a 'concreteness requirement' without argument."
  **Damage:** **High.** This targets the ontological coherence of Step 2. If it sounds bad, it's because it threatens to make your view hostage to a modal debate you don't want.
  **Reply:** "Custody is inherently a causal, care-taking relation. You cannot causally interact with or discharge duties toward a non-concrete object, even if it exists. The constraint isn't on *existence*, it's on the *kind of relation* beneficence requires."
  **Softness:** You are defining "custody" stipulatively to avoid the objection. A metaphysician will press whether "care" really requires causality or just intentional directedness.
  **Actual Risk:** **Low-Medium.** Most ethicists (even metaphysicians) accept that moral relations require causal possibility. Stand firm on the *functional* definition of custody.

  ### 2. The "Pushing the Asymmetry Back" Objection (General Ethics)
  **Phrasing:** "You haven't solved the asymmetry; you've just relocated it. Why is beneficence relational in the procreative case but not elsewhere? This looks like an ad hoc restriction designed solely to yield the asymmetry result."
  **Damage:** **Medium.** Attacks the theoretical motivation of Premise 1.
  **Reply:** "It's not ad hoc; it mirrors how we treat special obligations elsewhere. I have no reason to feed a random stranger, but a strong reason to feed my child. Procreation is the act that *creates* that special relation, not the act that responds to it."
  **Softness:** Special obligations usually presuppose the *existence* of the relata (the child). You are using them to justify *bringing them into existence*.
  **Strategy:** **Concede up front.** In the talk, acknowledge that this restricts the scope of beneficence. Frame it as a feature, not a bug: "Procreation is unique because it creates the moral patient."

  ### 3. The Climate/Discounting Objection (Health Economist)
  **Phrasing:** "If reasons require actual custody relations, does this imply we have no reasons to preserve the climate for future generations? It looks like you've licensed extreme discounting of future wellbeing."
  **Damage:** **High (Political).** This is the "gotcha" that makes the view look socially irresponsible.
  **Reply:** "We have custody of the *preconditions* for future custody. Destroying the climate is violating our duty to maintain a world where future custody relations can be successfully discharged."
  **Softness:** This stretches "custody" from people to "conditions." It's a metaphorical shift that might not satisfy a rigorous modeler.
  **Strategy:** **Concede up front.** Explicitly state in the talk: "This view does not license neglecting the future; it grounds that duty in stewardship of the environment, not direct beneficence to non-existents."

  ### 4. The Benatar Collapse (Value Theory)
  **Phrasing:** "Practically, this yields the same result as Benatar. Pain is bad, pleasure is not a reason to act. You claim to keep impersonal value, but if it generates no reasons, what work is it doing? You're a Benatarian in disguise."
  **Damage:** **High.** This denies your claim to novelty (Premise 4).
  **Reply:** "Benatar says the absence of pleasure is *not bad*. I say it *is good*, impersonally, but not *my reason to act*. I preserve the value of happy lives without making them mandatory projects."
  **Softness:** For action-guidance, the distinction is thin. If the value generates no reasons, does it exist?
  **Verdict:** **This is the Real Threat.** The PAV collapse is less dangerous (see #5). The Benatar collapse attacks your claim to retain impersonal value.

  ### 5. The Person-Affecting Collapse (Value Theory)
  **Phrasing:** "This is just the Person-Affecting View (PAV) with extra steps. 'No subject, no reason' is the PAV slogan. Why shouldn't we just call this PAV?"
  **Damage:** **Medium.** Attacks theoretical parsimony.
  **Reply:** "PAV denies that impersonal value exists or matters. I affirm impersonal value but deny it generates *agent-relative* reasons without a relation. I keep the axiology; I restrict the deontology."
  **Softness:** Many in the room won't care about the axiology/deontology distinction if the output is identical.
  **Verdict:** **The Cleanest Wedge:** Emphasize that on your view, a world with happy people is *better* than one without (axiology), whereas PAV often struggles to say that.

  ### 6. The Adoption/Second-Best Objection (Policy)
  **Phrasing:** "If the goal is to enter custody relations, and orphaned children need custody, does your view imply procreation is morally second-best to adoption? I don't want to fight that political battle."
  **Damage:** **Medium.** You flagged this as a fight to avoid.
  **Reply:** "No. Procreation is *initiating* a custody relation; adoption is *transferring* one. Both are permissible entries into the same normative structure. Neither is inherently privileged by the custody condition itself."
  **Softness:** It doesn't address resource scarcity. If custody is the good, and orphans need it, why create new custody-needs?
  **Strategy:** **Neutralize early.** Add a footnote or sentence in the talk: "This view is neutral on adoption vs. procreation; it governs the *permissibility* of entry, not the *selection* of entry."

  ### 7. The Threshold Problem (Step 3)
  **Phrasing:** "You say we can't enter a custody relation we know we can't discharge (severe suffering). But life always involves suffering. Where is the threshold? Who decides what counts as 'unrelievable'?"
  **Damage:** **Medium.** Attacks the precision of the negative duty.
  **Reply:** "The threshold is the same as in medical ethics: a life so burdened that death would be a mercy. It's a high bar, intended to rule out only the most grievous harms, not ordinary hardship."
  **Softness:** "Mercy" is contested. Metaphysicians will ask about the identity of the subject of that mercy.

  ### 8. The Non-Identity Problem (Standard)
  **Phrasing:** "If I choose a policy that creates different, poorer people, have I violated custody? They wouldn't exist otherwise, so I haven't made *them* worse off."
  **Damage:** **Low.** You likely have a standard answer, but they will test it.
  **Reply:** "Custody attaches once the relation is actual. The wrong isn't making *them* worse off than they would be; it's entering a custody relation you know will be deficient compared to available alternatives."
  **Softness:** This edges back toward impersonal comparison, which you tried to avoid in Premise 2.

  ### 9. The "Prayer" Question (The Fatal One)
  **Phrasing:** "If reasons arise *inside* the custody relation, and procreation *creates* the relation, doesn't the reason to care for the child only arise *after* they exist? What forbids me from creating a child and then immediately neglecting them, if the reason to care only kicks in once the relation is established?"
  **Damage:** **Fatal.** This collapses the distinction between entering and discharging.
  **Reply:** (You need to land this perfectly). "The reason to *enter* is conditional on the ability to *discharge*. You cannot permissibly initiate a relation you intend to or know you will violate. The duty to discharge constrains the permission to enter."
  **Softness:** This relies on a normative constraint on *entry* that exists prior to the relation. You must defend why the *future* duty constrains the *present* act without presupposing the reason exists now.

  ---

  ### STRATEGIC SUMMARY

  **The Single Reply That Must Land:**
  The distinction between **Impersonal Value** and **Agent-Relative Reasons** (Objection #4).
  *Why:* If you lose this, you are just Benatar. If you keep this, you have a unique axiological contribution that satisfies the metaphysicians (value is real) and the ethicists (reasons are restricted).
  *How:* "Happy lives are good *simpliciter*. They are just not *my project* unless I am the custodian."

  **What to Concede Up Front:**
  1.  **Contingentism:** Don't fight the necessitists. Grant that if necessitism were true, you'd need a "concreteness" clause. It buys goodwill and removes Objection #1 as a killer.
  2.  **Climate/Future:** Explicitly state that custody of the *environment* grounds future duties. Disarm the economist before they stand up.

  **The "Prayer" Question:**
  *See Objection #9.* The question about **retroactive neglect**. If the reason to care only exists *after* the child is born, what prohibits creating a child *in order to* neglect them (or create them knowing you will neglect them)?
  *Why it's fatal:* It suggests your "entry condition" is toothless.
  *Preparation:* Ensure your definition of "permissibly entering" includes a *forward-looking* constraint. You are not just entering a relation; you are undertaking a commitment. The normativity of *commitments* binds the entry, even if the specific duties of care bind the tenure.

  **Final Note on Tone:**
  The metaphysicians will smell blood if you waffle on ontology. Be precise about what "exists" vs. what "generates reasons." The ethicists will smell blood if you seem cold about future suffering. Be warm on the duty to avoid misery. Balance the cold metaphysics of Step 2 with the warm deontology of Step 3.
