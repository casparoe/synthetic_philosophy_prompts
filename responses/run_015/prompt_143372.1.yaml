answer: |-
  This is a classic stalemate in the literature on moral responsibility, specifically within the "standing" debate inaugurated by Wallace and expanded by Bell, Fritz, and Miller. You are right to suspect that your reading group is talking past one another, but I disagree that it is merely verbal. It is a **category error regarding the function of blame.**

  Here is the diagnosis: Half your room is treating blame as a **truth-claim** (assessment), and the other half is treating it as a **speech-act** (address).

  ### 1. The Diagnosis: Assessment vs. Address

  The group members arguing that the hypocrite "still has standing because the student actually did wrong" are conflating the **propositional content** of blame with the **illocutionary force** of blaming.

  *   **Side A (The Realists):** They view blame as an assertion of fact: "You violated norm N." Since the student *did* violate norm N, the assertion is true. The professor's hypocrisy is irrelevant to the truth value of the claim. To them, denying standing looks like a *tu quoque* fallacy.
  *   **Side B (The Relationalists):** They view blame as a moral address or a demand for accountability. This is a Strawsonian practice. For this address to be felicitous, the addresser must implicitly claim a certain moral relationship to the norm. If the hypocrite blames, she implies, "I hold myself to this standard, and I hold you to it." If she doesn't hold herself to it, the communication is defective.

  **The Deadlock:** You cannot resolve this by arguing about the student's guilt. Both sides agree the student is guilty. The disagreement is about whether the *transaction* of blame is valid when the sender is corrupted.

  ### 2. The Red Herring: The Professor Case

  Your reading group is stuck because the "Plagiarizing Professor" example smuggles in **institutional authority**, which muddies **moral standing**.

  *   **Institutional Standing:** The professor has the *power* to fail the student regardless of her own virtue. Her contract grants her the authority to enforce academic integrity. If she fails the plagiarist, she is acting within her institutional role.
  *   **Moral Standing:** Does she have the right to *morally resent* the student? Does she have the right to *shame* the student in a way that implies her own moral superiority?

  Side A is likely pointing to her institutional power ("She's affected by the practice," "She has the right to grade"). Side B is pointing to her moral authority ("She's lost the right to preach").

  **Actionable Fix:** Drop the professor example for this specific chapter. It conflates role-obligations with moral obligations. Stick to the Climate Activist or a pure peer-to-peer case. In peer-to-peer cases, there is no institutional power to fall back on, forcing the group to confront the moral standing question directly.

  ### 3. Breaking the Deadlock: The "Commitment Condition"

  To move past "asshole vs. no standing," you need to introduce the **Commitment Condition** (associated with R. Jay Wallace and Macalester Bell).

  Hypocrisy undermines standing not because the blamer is vicious (being an "asshole"), but because blaming *presupposes* a commitment to the norm that the hypocrite has violated.

  **The Test Case: The Secret Hypocrite**
  Ask your group this: *The Climate Activist flies privately, but no one knows. She shames her neighbor. Later, her flights are exposed.*
  *   **Question:** Was her blame *invalid at the time she spoke*, or did it only become problematic in retrospect?
  *   **If Invalid at the time:** Standing is an objective moral status independent of social knowledge. (Supports Side B).
  *   **If Valid at the time:** Standing is purely about social efficacy or reputation. (Supports a pragmatic view, not a moral one).

  **The Test Case: The Penitent Hypocrite**
  *The Activist used to fly privately, stopped, publicly acknowledged her past failure, and now shames neighbors.*
  *   **Question:** Does she have standing now?
  *   **Most Intuitions:** Yes.
  *   **Why?** Because she has restored her **commitment to the norm**.

  **The Conclusion:** This suggests standing isn't about *past actions* (sinning), but about *current commitment* (repentance/consistency). If the hypocrite implicitly claims "I follow this rule" while blaming, she lies. If she says, "I failed this rule, but it is still binding on both of us," she may retain standing.

  ### 4. Is it Empirical?

  You asked if there is a hidden empirical question. **No.** This is not about how blame works socially (efficacy); it is about how blame works normatively (permission).

  If the question were empirical ("Does hypocritical blame successfully change behavior?"), the answer is often "yes." Hypocrites can still sanction effectively. But ethics isn't asking if the sanction *works*; it's asking if the sanction is *permissible*. The stalemate persists because Side A is implicitly asking, "Is the sanction effective/true?" while Side B is asking, "Is the sanction permissible?"

  ### 5. Recommendation for Your Dissertation

  Do not accept this as bedrock intuition. It is a structural ambiguity in the concept of "standing."

  **Write the chapter this way:**
  1.  **Disambiguate:** Explicitly distinguish **Epistemic Standing** (Do you know the wrong occurred?) from **Moral Standing** (Do you have the right to hold me accountable?). Side A is defending Epistemic Standing; Side B is defending Moral Standing. Both are real, but distinct.
  2.  **Isolate the Normative Claim:** Argue that the "Loss of Standing" view is not about protecting the wrongdoer from truth, but about protecting the **moral community** from corrupted address. When a hypocrite blames, they degrade the practice of accountability itself.
  3.  **The "Asshole" Objection:** Address the "it just makes you an asshole" point directly. Concede that hypocrisy is a vice. But argue that some vices (like bias or conflict of interest) disqualify you from specific normative transactions (like judging a trial). Hypocrisy is a **conflict of moral interest**. It disqualifies you from the specific act of *censure*, even if it doesn't negate the *wrong*.

  **The Verdict:** The disagreement is not verbal, but it is **categorical**. One side is discussing the *justification of the belief* (the student wronged), the other is discussing the *felicity of the act* (the blaming).

  If you frame your chapter as resolving this category error—showing that one can acknowledge the truth of the blame (Side A) while denying the permissibility of the address (Side B)—you break the deadlock. You don't have to choose one; you explain why they are answering different questions.

  **Move forward?** Yes, but only after you explicitly bifurcate "Standing to Believe" vs. "Standing to Blame." That is the conceptual distinction that resolves the impasse.
