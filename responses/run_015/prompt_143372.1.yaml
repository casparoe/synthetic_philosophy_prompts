      *   *Address the Examples:* Separate the Professor (institutional) from the Activist (moral). The Professor has *institutional* standing even without *moral* standing. This confuses the group.
      *   *Propose the Break:* Focus on the **Function of Blame**. Is blame a sanction (consequentialist) or a moral address (Strawsonian)?
