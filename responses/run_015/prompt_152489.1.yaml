          *   *Case Study 1 (Calculus):* The British vs. Continental divide. Newton's fluxions hindered British analysis for a century. Leibniz's notation facilitated it. This contradicts "functional equivalence."
          *   *Case Study 2 (Evolution):* Wallace's spiritualism/human exceptionalism vs. Darwin's naturalism. If Wallace had won, would the Modern Synthesis happen?
      *   **Section 2: The Awkward Defeaters (The "Absorbable Shocks"):**
          *   Timing delays.
          *   Priority rhetoric.
          *   Minor conceptual gaps filled later by others.
          *   *Structuralist Defense:* "The vector was the same, just different friction."
      *   **Section 3: The Unfalsifiability Trap:**
