answer: |-
  (1) Candidate rules

  Two general principles accommodate all seven verdicts without contradiction. First, **The Intrinsic Relation Rule**: what matters is solely the intrinsic strength of psychological continuity and connectedness between original and successor. Branching does not weaken this relation (hence fission is no loss), but convergence dilutes it because the successor is only partly continuous with each input (hence fusion is partial). Time gaps are irrelevant provided continuity is preserved.

  Second, **The Proportional Source Rule**: what matters is determined by the fraction of the successor's psychology causally sourced from the original. In teletransportation and fission, the successor is 100% sourced from the original, yielding full survival. In fusion, the successor is 50% sourced from each, yielding half survival. In the combined spectrum, survival tracks the percentage of preserved psychology. Both rules respect the supervisor's insistence that the non-branching clause affects identity but not value, and both explain why gaps do not diminish survival provided the causal chain holds. They diverge, however, when the proportion of sourcing and the strength of continuity come apart.

  (2) Predictions

  Under the **Intrinsic Relation Rule**, the forty-eight-hour stagger changes nothing; A enjoys full survival during the solo period and the parallel year because her psychological link to t0 is undiluted. The merge is a loss: both A and B drop from full to partial survival (roughly halfway) because M is only partly continuous with each. In the asymmetric variant, A survives fully (her traces are wholly present), while B survives partially. Prudential concern at t0 should be distributed equally to A and B during the parallel year, as both bear full relation to the original. It is better for B to be built and merged than never built (some survival is better than none), but better still for them to continue in parallel (full survival exceeds partial).

  Under the **Proportional Source Rule**, predictions match during the symmetric stages. However, in the asymmetric variant, A's survival is diluted. If M contains all of A's traces but only half of B's, A constitutes only two-thirds of M's psychology; thus A survives only to degree 0.66. Prudential concern at t0 should be weighted accordingly: more concern for A's experiences than B's in the asymmetric case, whereas the Intrinsic Rule demands equal concern. Regarding the merge, the Source Rule views it as a conservation event (total survival mass remains constant across inputs), whereas the Intrinsic Rule views it as a net loss of survival value relative to parallel continuation.

  (3) Her verdict

  My supervisor would almost certainly endorse the **Intrinsic Relation Rule**. Her work in the Parfitian tradition prioritizes the holding of Relation R over metaphysical bookkeeping. The verdict that fission is "no worse" than ordinary survival, coupled with the refusal to call it "better," suggests she views survival value as non-aggregative; having two futures doesn't double the value, but losing one would be a loss. The fusion verdict ("halfway") follows naturally: M is not fully continuous with either original. She would likely say the stagger is irrelevant because psychological continuity is not time-sensitive (per the blueprint verdict). The merge is a loss relative to parallel life because it reduces the degree of continuity each original bears to the successor.

  I discount her refusal to say fission is "better" as semantic caution rather than metaphysical constraint. In the Parfitian framework, "better" often implies a comparison of identities, which she rejects as empty. Her core commitment is that what matters is the *quality* of the psychological relation, not the *quantity* of successors. Thus, she would advise that prudential concern should be equal for A and B, and that avoiding the merge preserves the most of what matters.

  (4) What turns on it

  The difference is not mere bookkeeping; it dictates rational anticipation and self-concern. If the Intrinsic Rule holds, the original at t0 can anticipate the parallel year with full confidence in both branches, knowing neither is diluted by the other. If the Proportional Source Rule holds, anticipation must be graded; in asymmetric cases, one should care more about the branch contributing more to the future successor. Furthermore, the decision to merge hinges on this distinction. Under the Intrinsic Rule, merging is prudentially irrational if parallel life is possible, as it reduces survival value. Under the Source Rule, merging is neutral regarding total value, potentially making it permissible if it serves other ends. For a thesis on what matters in survival, this determines whether we ought to maximize continuity strength or preserve psychological mass.

  (5) The discriminating case

  To separate these rules, put the **Overwrite Case**: A fissions into A1 and A2. A1 lives normally. A2 is kept in suspended animation. After ten years, A2 is awakened, but half her memories are randomly overwritten with stranger-data before she continues. A1 remains untouched.
  **Intrinsic Relation Rule:** A1 survives fully. A2 survives partially (continuity weakened by overwriting). The existence of A2 does not affect A1.
  **Proportional Source Rule:** A1 survives fully. A2 survives partially.
  *Correction:* To truly separate them, use **The Dominant Branch**: A fissions into A1 (100% continuity) and A2 (100% continuity). A2 is destroyed instantly. A1 continues.
  **Intrinsic Rule:** A1 survives fully (Relation R holds).
  **Proportional Rule:** If total capacity is fixed, did A2 consume half the value?
  *Better Case:* **The Asymmetric Merge with Capacity Limit.** M can only hold 100% psychological capacity. A (100%) and B (100%) merge. A must be compressed to 50% to fit B.
  **Intrinsic Rule:** A survives partially (continuity weakened).
  **Proportional Rule:** A survives partially (source reduced).
  *Actual Discriminator:* **The Redundant Branch.** A fissions into A1 and A2. A2 is identical to A1 but contains *no* unique memories, only redundant ones.
  **Intrinsic Rule:** A1 survives fully.
  **Proportional Rule:** A1 survives partially (source diluted by redundancy).
  Ask her: Does a redundant branch dilute survival?
