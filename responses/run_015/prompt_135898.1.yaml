      *   **Task 2 (Application):** Apply the theory. Is it ideological consumption (Virtue vs. Corruption) OR an ordinary parliamentary coup driven by contingency (Fleurus, speech tactics, coalition building)?
      *   **Task 3 (Critique):** Turn the episode back on the theory. What does Thermidor reveal about limits of structural interpretations? Where is the "devouring" narrative silent?
      *   **Task 4 (Discipline):** Do not force theory where institutional/contingent details explain better.
      *   **Task 5 (Conclusion):** One-sentence summary (confirms, complicates, or undermines).

  2.  **Task 1: Mapping the Decision Space (8–10 Thermidor):**
      *   *Context:* The Terror is peaking. The Law of 22 Prairial (June 10) streamlined the Revolutionary Tribunal, removing defense counsel and expanding definitions of "enemy."
      *   *Actors:*
          *   *The Incorruptibles:* Robespierre, Saint-Just, Couthon (dominant in CPS but isolated in Convention).
          *   *The Thermidorian Coalition:* Tallien, Billaud-Varenne, Collot d'Herbois (members of CPS threatened by Robespierre), Fouché, Barras, Fréron (representatives on mission recalled/accused).
          *   *The Plain (Marais):* Undeclared majority, fearful, tired of Terror.
          *   *Paris Sections/Commune:* Generally pro-Robespierre but hesitant/leaderless.
          *   *National Guard:* Commanded by Hanriot (loyal to Robespierre) but unreliable.
      *   *Institutional Constraints:*
          *   *Convention Sovereignty:* No separation of powers. The Convention *is* the state. To control the state, you must control the floor of the Convention.
          *   *Law of 22 Prairial:* Accelerated executions. Created existential fear among deputies (anyone could be next without due process).
          *   *Committee of Public Safety (CPS):* Theoretically subordinate to Convention, but functionally dictatorial. Robespierre's absence from CPS meetings in the weeks prior created a power vacuum.
      *   *Options:*
          *   *Robespierre:* Name names (purge the coalition) OR speak vaguely (appeal to the Plain). He chose vague moralizing.
          *   *Thermidorians:* Pre-emptive strike (accuse Robespierre of tyranny) OR wait (risk being purged).
          *   *The Plain:* Support Robespierre (continue Terror) OR Support Thermidorians (end Terror to save themselves).
          *   *Paris Commune:* Insurrection (like May 31, 1793) OR wait for Convention's lead. They waited.

  3.  **Task 2: Applying the Theory ("Devouring Children"):**
      *   *Argument for "Devouring" (Ideological):* Robespierre's ideology of "Virtue" required absolute purity. Opposition = Vice = Death. Therefore, once the external enemies were receding (Fleurus), the logic of purity turned inward. The system *required* a new enemy.
      *   *Argument for "Contingency/Coup" (Institutional/Political):*
          *   *Fleurus (June 26):* Victory reduced the *necessity* of emergency measures.
          *   *8 Thermidor Speech:* Robespierre refused to name specific traitors. This allowed the accused (Tallien, etc.) to unite against him. If he had named them, the Plain might have hesitated. If he had named no one, why the panic?
          *   *Coalition:* It wasn't "Revolution vs. Counter-revolution." It was "Guilty Deputies" (who signed execution orders) vs. "Moralizing Deputies." The coalition was a marriage of convenience between those fearing the guillotine and those fearing Robespierre's moral dictatorship.
          *   *Institutional Failure:* Robespierre failed to use the institutional levers (CPS, Commune, National Guard) effectively. He relied on moral authority in the Convention, where he had lost his majority.
      *   *Synthesis:* It looks less like an inevitable ideological consumption and more like a parliamentary coup enabled by specific tactical errors and a shifting security context. The "devouring" wasn't the Revolution eating its children; it was specific politicians eating a rival to save their own skins.

  4.  **Task 3: Turning the Episode Back on the Theory:**
      *   *Limits of Structural Interpretations:*
          *   *Class Struggle:* Both sides were bourgeois republicans. Class doesn't explain the split.
