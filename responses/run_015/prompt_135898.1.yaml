      *(Self-Correction during drafting)*: Make sure not to underplay the ideological element entirely. Robespierre *did* believe in Virtue. The point is that the *fall* wasn't caused by the ideology itself, but by the political reaction to the *application* of that ideology via specific institutions. The distinction is subtle but crucial for the "contingency" argument. Ensure the distinction between the CPS (Committee of Public Safety) and the Convention is clear—the CPS ruled *through* the Convention, but when the Convention turned, the CPS had no independent power base.

      *(Refining the "Devouring" critique)*: The phrase "devour their own children" implies a cyclical, inevitable process. Thermidor actually broke the cycle of escalation (temporarily). So the theory fails to account for the *de-escalation* mechanism.

