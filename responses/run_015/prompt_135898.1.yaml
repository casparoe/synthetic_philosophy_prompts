          *   *Institutional:* The institutions (Convention, CPS) were flexible enough to allow either outcome depending on who controlled the floor.
      *   *Where "Devouring" is Silent:*
          *   It implies a mythical beast (The Revolution) acting with agency. In reality, it was human actors making calculated risks.
          *   It ignores the *survival* of many "children." Many Jacobins survived Thermidor. It wasn't a purge of the *generation*, but of the *leadership faction*.
