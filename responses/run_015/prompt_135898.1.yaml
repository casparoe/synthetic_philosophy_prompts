  ### Mapping the Decision Space: 8–10 Thermidor Year II

  To understand the fall of Robespierre not as destiny but as a political event, we must reconstruct the institutional battlefield of late July 1794. The French Republic operated under a suspended Constitution of 1793, meaning sovereignty resided entirely in the National Convention, which had delegated emergency executive power to the Committee of Public Safety (CPS).

  **1. The Actors**
  *   **The Incorruptibles (Robespierre, Saint-Just, Couthon):** They held moral authority and dominated the CPS rhetorically, but Robespierre had ceased attending CPS meetings weeks prior, isolating himself from the administrative machinery.
  *   **The Thermidorian Coalition (Tallien, Billaud-Varenne, Collot d'Herbois, Fouché):** A heterogeneous group. Some were fellow Committee members (Billaud, Collot) fearing Robespierre's purge; others were recalled Representatives-on-Mission (Tallien, Fréron) facing indictment for corruption and excesses. Their unity was negative: survival against Robespierre's accusations.
  *   **The Plain (The Marais):** The undeclared majority of the Convention. Exhausted by the Terror, fearful of the guillotine, but hesitant to act without assurance of success.
  *   **The Paris Commune and Sections:** Traditionally the muscle of the Montagnards. They were loyal to Robespierre but leaderless; the Commune lacked an insurrectionary commander comparable to Hanriot (who was indecisive).
  *   **The National Guard:** Legally subordinate to the Convention, but commanded by Hanriot, a Robespierre loyalist. However, the rank-and-file were weary of constant mobilization.

  **2. Institutional Constraints**
  *   **Merged Executive-Legislative Power:** There was no judicial review or executive veto. Power flowed from the floor of the Convention. To lose the debate on the floor was to lose the state.
  *   **The Law of 22 Prairial (June 10, 1794):** This was the critical constraint. It stripped the accused of legal counsel, defined "enemies of the people" vaguely, and mandated death as the only penalty. Crucially, it allowed the Convention to send *its own members* to the Tribunal without prior debate. This turned political disagreement into an existential threat; every deputy knew they could be the next victim without due process.
  *   **The Committee's Dependency:** The CPS could not rule without the Convention's renewal of its powers. It had no independent police force loyal solely to it; it relied on the Convention's authority to enforce its will.

  **3. The Options (8–10 Thermidor)**
  *   **Robespierre's Option (8 Thermidor):** In his speech, he could have named specific traitors (triggering immediate arrests of the coalition) or spoken vaguely (appealing to the Plain's conscience). He chose the latter, denouncing a "conspiracy" without naming names.
  *   **The Coalition's Option:** They could wait (risking Robespierre might name them the next day) or pre-emptively interrupt procedure. They chose to declare Robespierre's speech an attack on the Convention itself, forcing an immediate vote.
  *   **The Plain's Option:** Support the CPS (continuing the Terror) or support the Convention's privilege (ending the immunity of the Committee). Faced with the threat that *they* could be purged next under Prairial, they voted to indict Robespierre.
  *   **The Commune's Option (9–10 Thermidor):** Launch an insurrection to free the arrested deputies (as in May 1793) or await legal recourse. They hesitated, issuing orders countermanded by the Convention, effectively paralyzing the insurrection.

  ### Applying the Theory: Ideological Consumption vs. Contingent Coup

  The aphorism that "revolutions devour their own children" suggests an internal logic where the radicalization of means inevitably consumes the architects of those means. Through the lens of **ideological commitment**, Robespierre's fall appears inevitable: his doctrine of "Virtue" required absolute transparency. In a world of human fallibility, any opposition to Virtue is Vice, and Vice is treason. By this reading, the Law of 22 Prairial was the engine of this consumption, creating a system where political disagreement was criminalized. Once the external enemies (Girondins, Hébertists, foreign powers) were removed, the logic of purity demanded new victims, and Robespierre, as the high priest of Virtue, became the only sacrifice significant enough to purify the Republic.

  However, the **contingent and institutional evidence** strongly undermines this deterministic view, pointing instead to an ordinary parliamentary coup.
  1.  **The News of Fleurus (June 26):** The victory over Austria reduced the *necessity* of emergency powers. The "Revolutionary Government" was justified by peril; without peril, the CPS looked like a dictatorship. This was a contingent geopolitical event, not an ideological imperative.
  2.  **The 8 Thermidor Speech:** Robespierre's failure to name names was a tactical error, not an ideological necessity. Had he accused Tallien and Fouché specifically, the Coalition might have fractured, as the Plain was reluctant to defend known corruptists. By threatening everyone, he united the guilty against him.
  3.  **The Coalition's Composition:** The alliance that toppled Robespierre was not "Counter-Revolution vs. Revolution." It was a marriage of convenience between terrorists (Billaud-Varenne) and corrupt opportunists (Tallien). They did not oppose the Revolution; they opposed Robespierre's specific management of it to save their own lives.
  4.  **Institutional Mechanics:** Robespierre fell because he lost control of the Convention floor, not because the "Revolution" rejected him. When the Convention declared him an outlaw, he lost legal existence. The National Guard obeyed the Convention, not the man. This demonstrates that the institution (Convention) remained sovereign over the individual (Robespierre), contradicting the idea that the movement had spiraled beyond human control.

  The "devouring" narrative obscures the fact that Robespierre was not eaten by the Revolution, but outmaneuvered by colleagues who used the Revolution's own institutions (the Convention's sovereignty) against him.

  ### Critiquing the Theory: Limits of Structural Interpretations

  Turning the episode back on the theory reveals significant blind spots in structural interpretations of 1789–94.

  **1. The Limits of Class and Ideology:**
  A class-struggle interpretation fails here; both the Robespierrists and the Thermidorians represented the bourgeois republicanism of the Third Estate. An ideological interpretation suggests the Terror consumed Robespierre because his ideals were too pure. Yet, Thermidor did not end the Republic or the Jacobin club immediately; it ended the *specific leadership* of Robespierre. The "devouring" was not systemic; it was factional. The theory implies a mythical agency ("The Revolution") acting upon individuals, whereas the historical record shows individuals manipulating the myth for survival.

  **2. Where the Narrative is Silent:**
  The "devouring" metaphor implies a continuous consumption. Thermidor, however, represents a *cessation* of the devouring. The Great Terror ended almost immediately after Robespierre's death. The Law of 22 Prairial was repealed within days. If the Revolution necessarily ate its children, the bloodletting should have accelerated or continued; instead, it decelerated. The narrative is silent on the mechanism of *stopping* the consumption. It cannot explain why the "monster" spat out the survivors (the Plain, the moderate Jacobins) once Robespierre was gone.

  Furthermore, the theory ignores the role of **administrative fatigue**. The dismantling of the CPS was not just a purge; it was a return to committee governance and legislative oversight. The "devouring" narrative treats the Terror as a spiritual or ideological fire, ignoring the mundane reality that the bureaucracy of death had become unmanageable and threatened the very deputies running it. The structural view misses the human element of fear: the deputies did not kill Robespierre to fulfill a historical destiny; they killed him because they did not want to die tomorrow.

  ### Conclusion

  This case complicates the claim that revolutions necessarily eat their children, demonstrating that Robespierre's fall was not the inevitable result of ideological radicalization but a contingent parliamentary coup enabled by specific institutional vulnerabilities and the self-preservation instincts of a threatened legislative majority.
