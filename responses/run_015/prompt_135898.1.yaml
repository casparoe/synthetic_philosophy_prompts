      *   *Section 3: Critiquing the Theory.* Discuss how structural views miss the human agency. Discuss how the "devouring" narrative ignores that Thermidor *stopped* the devouring.
      *   *Conclusion:* The one-sentence summary.

  8.  **Review against Constraints:**
