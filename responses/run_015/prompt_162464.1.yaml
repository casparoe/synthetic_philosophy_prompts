answer: |-
  Here is a complete lesson plan designed for a tight 60-minute window. It includes the script, the math, the debrief, and a frank assessment of the pedagogical limitations.

  ### Part 1: Logistics & Payoff Structure

  **Materials Needed:**
  *   8 Folders or Clipboards (one per pair) to shield work.
  *   16 Decision Sheets (pre-printed, see below).
  *   1 Die (for you, the instructor).
  *   Small rewards (candy, coffee vouchers, or nominal extra credit). *Crucial: The stakes must matter enough that they don't treat it as a joke.*

  **The Payoff Table (Standard Game):**
  The "Pot" grows by 10 points each pass. The decision-maker ("Taker") gets 80% of the current pot; the other player ("Passer") gets 20%.

  | Node | Who Decides? | Current Pot | **If TAKE** (Decider / Other) | **If PASS** (Game continues) |
  | :--- | :--- | :--- | :--- | :--- |
  | **1** | Player A | 10 | **8 / 2** | Goes to Node 2 |
  | **2** | Player B | 20 | **16 / 4** | Goes to Node 3 |
  | **3** | Player A | 30 | **24 / 6** | Goes to Node 4 |
  | **4** | Player B | 40 | **32 / 8** | Goes to Node 5 |
  | **5** | Player A | 50 | **40 / 10** | Goes to Node 6 |
  | **6** | Player B | 60 | **48 / 12** | **Game Ends (Split 30/30)** |

  *Note on Node 6:* To ensure the Backward Induction (BI) anchor holds, Player B at Node 6 must prefer Taking (48) over Passing (which ends the game with a 30/30 split). This guarantees the "last move" is rational to take.

  ---

  ### Part 2: Instructions (Read Aloud, 5 Minutes)

  "Welcome. Today you are making decisions for points. At the end of class, points convert to [reward].

  You will be paired up. One of you is Player A, the other Player B. Do not talk to your partner during the game.

  **The Rules:**
  1.  **The Pot:** You start with a pot of 10 points.
  2.  **The Choice:** At each turn, the current player can **TAKE** or **PASS**.
  3.  **If you TAKE:** The game ends immediately. You get 80% of the current pot; your partner gets 20%.
  4.  **If you PASS:** The pot grows by 10 points. It becomes your partner's turn.
  5.  **The Limit:** There are exactly 6 decision nodes. If you reach Node 6 and Player B passes, the game ends and the pot is split evenly.

  **The Belief Task:**
  Before you circle Take or Pass on your sheet, you must fill in two boxes:
  1.  *Prediction:* If the game reaches your partner's next turn, what will they do?
  2.  *Meta-Prediction:* What do you think your partner predicts *you* will do right now?

  We will score these predictions. If you predict accurately, you get a bonus. Honesty is the best strategy for the bonus.

  Player A, you have the first move. Look at Node 1. Fill in your beliefs. Make your decision. If you Pass, hand the sheet to Player B. If you Take, write down your final payoff and stop.

  You have 15 minutes for Round 1. Go."

  ---

  ### Part 3: The Variant (Foggy Centipede) (20 Minutes)

  *After Round 1 concludes, collect sheets. Hand out new sheets for Round 2.*

  **Instructions:**
  "We are playing again with new partners. The rules are almost the same, with one critical change.

  There is no longer a fixed Node 6. After **every** Pass, I will roll a die behind my screen.
  *   If I roll 1–5: The game continues to the next node.
  *   If I roll a 6: The game ends **immediately**. The pot is split 50/50 between you.

  Because of this, you do not know if the current node is the last one. You play this version twice. 10 minutes per game. Go."

  ---

  ### Part 4: The Debrief Script (25 Minutes)

  *Do not write "Backward Induction" on the board yet. Draw the game tree only after they describe what happened.*

  **1. The Empirical Result (5 mins)**
  *   **Ask:** "In Round 1 (Fixed 6 Nodes), at which node did most games end?"
      *   *Expected:* Nodes 1, 2, or 3. Rarely 6.
  *   **Ask:** "In Round 2 (Die Roll), did you pass more or less?"
      *   *Expected:* Significantly more passing.
  *   **Ask:** "Look at your belief sheets. In Round 1, did you predict your partner would Take or Pass?"
      *   *Likely:* They predicted Take, even if they Passed themselves.

  **2. Mapping the Logic (10 mins)**
  *Draw the tree on the board. Start from the bottom.*

  "Let's reconstruct the logic that *should* have happened in Round 1, assuming everyone wants to maximize points and everyone knows the rules.

  *   **Node 6:** Player B is here. Pot is 60. Take = 48 points. Pass = Game ends, 30 points. A rational player Takes.
  *   **Node 5:** Player A is here. Pot is 50. If I Take, I get 40. If I Pass, we go to Node 6. But we just agreed Player B will Take at Node 6. If B Takes at 6, I get 12. So, 40 (Take now) is better than 12 (Pass). Player A Takes.
  *   **Node 4:** Player B is here. Pot 40. If I Take, 32. If I Pass, Player A Takes at 5, and I get 8. 32 is better than 8. Player B Takes.
  *   **Node 3:** Player A Takes.
  *   **Node 2:** Player B Takes.
  *   **Node 1:** Player A Takes.

  This logic is called **Backward Induction**. You start at the end, solve the last move, and work backward. The result is that Player A Takes at Node 1. Everyone gets almost nothing (8 points).

  **The Paradox:** Most of you didn't do this. You passed. Why?
  *   *Student:* "Because I wanted to be nice."
  *   *Student:* "Because I trusted them."
  *   *Instructor:* "Okay. But look at your belief sheets. Many of you Passed, but wrote down that you expected your partner to Take. If you *knew* they would Take at Node 2, why did you Pass at Node 1? Passing guaranteed you 4 points (if they take) vs 8 points (if you take)."

  *This highlights the gap between **Normative Theory** (what rationality demands) and **Descriptive Reality** (what humans do).*

  **3. The Die Roll Variant (10 mins)**
  "Why did the Die Roll game change everything? The payoffs were similar. The incentives were similar.

  In Round 1, the logic *unraveled* because there was a **known last node**. The logic needs an anchor. It starts at Node 6 and infects Node 5, then 4, all the way back to 1.

  In Round 2, there is no last node. There is always a probability of a Node 7, 8, or 9.
  *   If there is no last node, you cannot start the backward induction.
  *   You cannot say 'At the end, they will Take,' because there is no 'end.'
  *   Therefore, the logic of unraveling has nowhere to begin.

  This shows that Backward Induction doesn't rely on greed. It relies on **Common Knowledge of the Horizon**. If you remove the known endpoint, the 'rational' strategy shifts from 'Take Immediately' to 'Pass for a while.'"

  ---

  ### Part 5: Troubleshooting & Limitations (For the Instructor)

  **What Will Predictably Go Wrong:**
  1.  **Time Creep:** The belief elicitation is the killer. Students write slowly.
      *   *Fix:* If they are lagging at the 12-minute mark in Round 1, call out "You have 3 minutes remaining, make your moves count."
  2.  **Payoff Confusion:** Students will mix up who gets the 80% and who gets the 20%.
      *   *Fix:* Have the payoff table projected or printed clearly on their decision sheet. Circle "YOU" and "THEM" on the sheet.
  3.  **Collusion:** Students might whisper, "I'll pass if you pass."
      *   *Fix:* Explicitly forbid communication. "This is a non-cooperative game. Any talking voids your points."
  4.  **The "Nice" Defense:** In the debrief, students will insist they passed because they are altruistic.
      *   *Counter:* Point to the belief elicitation. "Altruism explains why *you* passed. It does not explain why you *predicted* they would pass. If you thought they were rational takers, your passing was a mistake, not kindness."

  **What This Activity Cannot Show (The "Bigger Gap"):**
  You are correct that it cannot distinguish "Partner isn't an EU maximizer" from "Partner is nice." But there is a deeper theoretical gap you should mention in the final 5 minutes:

  **Common Knowledge of Rationality (CKR).**
  Backward Induction requires more than just *you* being rational.
  *   You must be rational.
  *   You must know *they* are rational.
  *   You must know *they know you* are rational.
  *   You must know *they know you know they* are rational... (ad infinitum).

  If *you* are rational, but you think *I* might be irrational (or nice), then it is **rational for you to Pass** at Node 1. You are betting that I won't unravel the chain.
  *   **The Lesson:** The failure of Backward Induction in the real world isn't necessarily a failure of logic; it's often a failure of the *Common Knowledge* assumption. In the Die Variant, even if we have Common Knowledge of Rationality, the logic fails because the *structure* (the horizon) is unknown.

  **Scoring the Beliefs:**
  To keep it simple but "honest":
  *   Give 1 bonus point for correctly predicting the partner's move (Take/Pass).
  *   Give 1 bonus point if the partner correctly predicted your move (this incentivizes being predictable, which is interesting, or you can skip this second part to save time).
  *   *Frank advice:* Don't over-engineer the scoring rule (like a Brier score). It eats time. A simple "Right Guess = Bonus" is sufficient for an intro seminar to get them thinking about expectations.

  **Final Takeaway for Students:**
  "Decision theory isn't just about what *you* want. It's about what you think *they* want, and what you think *they think you* want. In the Centipede game, the math says 'Take.' But the math assumes we are all robots who know we are all robots. Once you introduce doubt—or a foggy horizon—the 'rational' move changes."
