  1. the exam question (aimed at 90 minutes, ~800 word answer)
  2. a model answer of about 750 words
  3. a marking scheme built around five specific moves the answer must make, with marks (total 20) and a one-line note on how students usually mess each one up

  the difficulty should come from forcing them to seperate first-order and second-order absence, not from recalling obscure authors. dont ask for bibliographies or citations — i need this to work for a model with no web access. write it casual, and feel free to include a typo or two.
