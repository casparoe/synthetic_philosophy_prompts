answer: |-
  ### 1. Exam Question

  **Question 3: The Meta-Craving Asymmetry (20 marks)**
  **Recommended time:** 90 minutes
  **Suggested length:** ~800 words

  Tranquilism claims that well-being is constituted solely by the absence of craving and suffering. Positive pleasures or satisfied desires add no intrinsic value; they are only good insofar as they remove a negative state.

  Consider two agents who have both eliminated all first-order cravings (e.g., for food, status, sex).
  *   **Agent A** retains a second-order craving: she actively desires that her tranquil state *persists*. She worries about losing it.
  *   **Agent B** has eliminated even second-order cravings. She is tranquil, but she lacks any evaluative stance toward her condition. She cannot say whether her state is good or bad; she simply exists in it.

  Write an essay addressing the following:
  1.  According to strict tranquilism, is Agent A's second-order craving a deficit that reduces her well-being, or a neutral safeguard?
  2.  Does Agent B's inability to evaluate her own life count as a hidden cost, or is it the ultimate advantage?
  3.  Ultimately, which life is better according to the theory, and does this reveal a problem with tranquilism itself?

  *Note: Do not recycle standard objections like the Experience Machine. Focus on the structural difference between first-order and second-order absence.*

  ***

  ### 2. Model Answer

  Here's a way to crack this open without falling back on the usual "happy robot" objections. The core tension here is whether tranquilism values the *state* of non-craving or the *experience* of non-craving. If it's just the state, Agent B wins hands down. If it's about the lived experience, Agent A might actually be in trouble.

  First, we have to look at Agent A. She's achieved the goal—no first-order cravings—but she's introduced a new one. She craves the persistence of tranquility. On a strict reading of tranquilism, any craving is a form of suffering or potential suffering. A craving implies a dependency; if her tranquility is threatened, she suffers. So, paradoxically, by wanting to stay tranquil, she's violated the main rule. She's turned tranquility into an object of desire. This undermines her well-being because she's no longer in a state of pure absence. She's in a state of "absence plus a guard dog." The guard dog barks. Some might argue this second-order craving is benign because it aims at the good, but tranquilism doesn't care about the *object* of the craving, only the *fact* of it. So, A is technically compromised. Her tranquility is fragile because it depends on a condition (the persistence of the state) that she is now attached to.

  Then there's Agent B. She's the pure ideal. No first-order cravings, no second-order cravings. She doesn't care if she stays this way or not. The prompt asks if her lack of evaluation is a cost. For most theories (like hedonism or desire satisfaction), this is a disaster. If you can't recognize your life as good, are you really doing well? But tranquilism is objective. It says well-being is the absence of negative states, not the presence of a positive judgment. So, B's inability to say "this is good" is irrelevant. In fact, it's an advantage. The moment you evaluate your state as "good," you risk creating a preference for it to continue. You risk becoming Agent A. B's indifference protects her. She has nothing to lose because she doesn't value the state instrumentally. She just *is*.

  However, this leads to the comparison. Which life is better? Theoretically, B is the winner. She has zero cravings. A has one. Zero is better than one. But this exposes a weird pragmatic flaw in tranquilism. Agent B is so detached that if her tranquility were to vanish—say, she gets sick—she wouldn't even mind. She lacks the motivation to preserve her well-being. Agent A, because she craves the persistence of tranquility, will act to maintain it. So A is more likely to *stay* well, even though she is currently less well than B according to the theory's own metrics.

  This suggests tranquilism might be self-defeating. To maximize tranquilist well-being, you have to not care about maximizing it. If you care, you introduce craving. So the theory demands a kind of ignorance or indifference that makes the well-being unstable in the real world.

  In conclusion, Agent B lives the better life according to the strict definitions of tranquilism because she lacks the meta-craving that plagues A. However, B's life highlights that tranquilist well-being is essentially passive. It's not a flourishing state; it's a quietus. A's life is more human, but strictly speaking, she fails the test. The meta-craving asymmetry shows that tranquilism values the absence of evaluation over the presence of satisfaction, making the ideal agent someone who doesn't know they're winning. That's a high price for peace, and it suggests the theory might be describing death rather than life.

  *(Word count: approx 760)*

  ***

  ### 3. Marking Scheme

  **Total: 20 Marks**

  **1. Define the Tranquilist Criterion (4 marks)**
  *   **Move:** Clearly state that value lies in absence of craving, not presence of satisfaction, and that any craving counts as a deficit.
  *   **Common Mess-up:** Students treat the second-order craving as "good" because it wants something good, missing that craving itself is the negative.

  **2. Analyze Agent A's Deficit (4 marks)**
  *   **Move:** Identify that A's desire for persistence is technically a craving, thus violating the strict absence requirement.
  *   **Common Mess-up:** Arguing A is better because she is "safer," without acknowledging she scores lower on the theoretical metric.

  **3. Analyze Agent B's Evaluation Gap (4 marks)**
  *   **Move:** Argue that B's lack of evaluation is irrelevant or advantageous because evaluation risks generating new preferences.
  *   **Common Mess-up:** Claiming B has low well-being because she doesn't *know* she's happy (importing hedonistic criteria).

  **4. Address the Stability Paradox (4 marks)**
  *   **Move:** Note the irony that A is more likely to maintain the state despite having less of it, while B is indifferent to loss.
  *   **Common Mess-up:** Ignoring the practical consequence of the asymmetry and treating it as purely abstract.

  **5. Deliver a Consistent Verdict (4 marks)**
  *   **Move:** Conclude based on the premises (usually B is theoretically superior) while noting the counter-intuitive implication for the theory.
  *   **Common Mess-up:** Sitting on the fence without committing to which agent wins according to the theory's rules.
