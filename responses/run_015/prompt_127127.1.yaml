  4.  **Refining the Voices:**
      *   *Ilse:* Precise, structuralist, slightly frustrated by vagueness. Uses terms like "causal topology," "invariant," "locus."
      *   *Tobias:* Pragmatic, skeptical, focused on consequences and epistemology. Uses terms like "grain," "attribution," "disciplinary constraints."
