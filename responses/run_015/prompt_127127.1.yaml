          *   *Ilse Vandermeer:* Moral patienthood attaches to fine-grained causal organization (functionalism/computationalism). Degeneracy means we misidentified the *real* computational locus.
          *   *Tobias Renn:* Anti-realist/pragmatist about subject count. Attribution is grain-relative, evidence-based, and goal-dependent.
      *   **Key Arguments to Include:**
          *   Renn: If approximate realization preserves the subject, continuity implies panpsychism (nearly every system is a subject). Ilse must answer this.
          *   Ilse: If grain is up to us, welfare becomes a fact about *us*, not the system. Renn must answer this.
          *   Specific disagreement: Overlapping subcircuits (single redundant subject vs. population of partial ones).
          *   Specific disagreement: Weight of LARK-7's self-reports.
      *   **Ending:** They don't need to resolve the metaphysics, but they need to agree on what constitutes *progress* (measurement, criterion, change of question).
