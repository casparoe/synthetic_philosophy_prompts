answer: |-
  **Final Examination: Folk Concepts and Moral Judgment**
  **Time Allowed:** 75 Minutes
  **Instructions:** Closed book. Answer the following question.

  **Question 1**
  An AI lab lead engineer signs off on a new ranking system. You manipulate two factors: **Valence** (Harm: increased polarization; Help: increased local turnout; Inert: datacenter migration) and **Reason Status** (Reason: team would cancel without this effect; No-Reason: team would ship anyway). This yields five conditions: (1) Harm/Reason, (2) Harm/No-Reason, (3) Help/Reason, (4) Help/No-Reason, (5) Inert/No-Reason.

  **(a)** Predict the mean intentionality attributions (0–7 scale) for all five conditions under three accounts: the Normative-Concept account, the Reasons-Based account, and the Pragmatic account. Explicitly state what function the Inert baseline serves in distinguishing these predictions. (5 marks)

  **(b)** **Stipulated Empirical Result:** Ratings are high (≥5) *only* in Harm/No-Reason and Help/Reason. All other conditions, including Harm/Reason, are low (≤2). Given this stipulation, identify which manipulated factor drives the asymmetry and which standard accounts are falsified. (5 marks)

  **(c)** Since the result defeats the standard accounts, construct a fourth explanation for why folk attributions track this specific pattern. Provide one specific empirical outcome that would falsify your new account. (5 marks)

  **(d)** A regulatory board must draft a rule assigning liability when a team has "intentionally" brought about societal harm. Based on your analysis, should the rule track the folk concept, stipulate a technical definition, or abandon the distinction? You must name a specific **decision-relevant quantity** (e.g., a counterfactual dependency) that the rule should measure instead of relying on the word "intentional." Explain why this quantity is decision-relevant. (10 marks)

  ***

  **Model Answer**

  **(a)** The **Normative-Concept account** predicts high intentionality for Harm conditions (1 & 2) and low for Help/Inert (3, 4, 5), as badness constitutes the concept. The **Reasons-Based account** predicts high intentionality whenever the effect is a reason (1 & 3), regardless of valence, low otherwise (2, 4, 5). The **Pragmatic account** mirrors Normative predictions but treats them as conversational implicature rather than semantic content. The **Inert baseline** serves to isolate valence from mere side-effecthood; if Inert is low, it confirms that side effects alone aren't intentional, isolating the moral valence or reason-status as the active variable.

  **(b)** The stipulated data shows an interaction: Valence drives attribution in No-Reason cases (Harm > Help), but Reason status drives attribution in Help cases (Reason > No-Reason), while oddly suppressing it in Harm/Reason. The driving factor is a **lexical-prototypical match**: folk apply "intentional" when the outcome matches the *default expectation* of the context (Harm is expected in tech rollout; Help is unexpected unless a reason). This falsifies the Normative account (which predicts Harm/Reason high) and the Reasons account (which predicts Harm/Reason high). It suggests "intentional" is not a stable concept but a label for **deviance from a scripted norm**.

  **(c)** **New Account: The Script-Deviance Account.** Agents are judged intentional only when the outcome deviates from the standard script for that role *and* is known. In Harm/No-Reason, harm is deviant (engineers should prevent harm), so it is intentional. In Help/Reason, help is deviant (engineers optimize for profit, not turnout), so it is intentional. In Harm/Reason, harm is *consistent* with a "profit-at-all-costs" script, so it is not marked as intentional—it is just business. **Falsifier:** If we describe the engineer as a "Public Servant" rather than "Lead Engineer," Harm/Reason ratings should rise (as harm deviates from that script), whereas the Normative account predicts no change based on job title.

  **(d)** The rule should **abandon the folk distinction** and stipulate a technical quantity: **Counterfactual Decision Dependence**. The rule should ask: "Would the deployment have proceeded if this specific societal outcome were known to be impossible?" If yes, no liability. If no, liability. This quantity is decision-relevant because liability aims to modify behavior. You cannot modify what was inevitable (No-Reason), but you can incentivize agents to make the outcome a reason for cancellation. Tracking the folk concept rewards luck (whether the folk perceive deviance) rather than control. The folk word "intentional" tracks moral blame, but the regulatory goal is ex-ante incentive alignment, which requires measuring the agent's decision procedure, not the observer's moral reaction.

  ***

  **Marking Scheme (25 Marks Total)**

  1.  **Discriminating Predictions (5 marks):** Correctly identifies that Normative splits by Valence, Reasons splits by Reason Status, and Pragmatic tracks Normative but disputes semantics. Must explicitly state Inert baseline isolates side-effecthood from valence.
      *   *Fumble:* Treating Pragmatic as predicting different numbers than Normative rather than different explanations for same numbers.
      *   *A/B Boundary:* A answers specify the Inert condition's role in isolating variables; B answers list accounts without functional differentiation.

  2.  **Data Analysis (5 marks):** Identifies that Harm/Reason being Low falsifies Normative and Reasons accounts. Identifies that the pattern suggests an interaction between Valence and Reason Status.
      *   *Fumble:* Claiming the data supports the Normative account because Harm/No-Reason is high, ignoring the Harm/Reason failure.
      *   *A/B Boundary:* A answers pinpoint the specific cell (Harm/Reason) that kills the standard theories; B answers generalize about "mixed results."

  3.  **New Account Construction (5 marks):** Proposes a coherent mechanism (e.g., Script-Deviance, Expectation Violation) that fits the stipulated data. Must include a specific falsifying condition (e.g., changing role description).
      *   *Fumble:* Offering a restatement of the Reasons account with different words, or providing a falsifier that is untestable (e.g., "if people feel differently").
      *   *A/B Boundary:* A answers provide a checkable prediction involving a new manipulation; B answers offer vague theoretical glosses.

  4.  **Applied Move (5 marks):** Argues for abandoning the folk concept in favor of a technical rule. Must explicitly name **Counterfactual Decision Dependence** (or equivalent functional measure of the decision procedure).
      *   *Fumble:* Stopping at "it depends on the definition" or suggesting we just educate regulators on the folk concept.
      *   *A/B Boundary:* A answers name a measurable quantity tied to incentives; B answers discuss the philosophy of law without naming a metric.

  5.  **Decision-Relevance Justification (5 marks):** Explains *why* the quantity matters: Liability aims at behavior modification (ex-ante), whereas folk judgment aims at blame (ex-post). Must connect the quantity to the regulatory goal.
      *   *Fumble:* Arguing that the folk concept is "more fair" without defining fairness operationally.
      *   *A/B Boundary:* A answers distinguish ex-ante incentives from ex-post blame; B answers conflate moral blameworthiness with regulatory liability.

  **Note on Model Answer Limitations:**
  The Script-Deviance account risks begging the question by defining "script" post-hoc to fit the data; a robust version requires independent measurement of script expectations. Additionally, the move to Counterfactual Decision Dependence assumes regulators care solely about incentives, ignoring retributive justice demands which may legitimately track folk blame.

  **A/B Boundary Statement:**
  A boundary lies at the transition from taxonomy to prediction: a B answer correctly lists the accounts and notes the data is weird; an A answer commits to a specific falsifiable mechanism and a regulatory metric that could be proven wrong.
