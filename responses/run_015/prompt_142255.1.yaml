  Here is the machinery of your friend's reasoning, the alternative that fits the data, and the prediction for your case.

  ### 1. The Rule He Is Running
  **The Constrained Expected Utility Rule.**

  Your friend is not a pure expected-value maximizer; he is a *risk-averse epistemic consequentialist*. He treats a vote as an instrument that transmits a signal to a counting mechanism. For the instrument to be used, three conditions must be met:

  1.  **Instrumental Efficacy:** The probability of the vote being decisive ($P$) multiplied by the differential social value of the outcome ($\Delta V$) must exceed the direct cost of voting ($C_v$).
      *   *Formula:* $P \times \Delta V > C_v$
  2.  **Epistemic Integrity:** The voter must possess a "firm view" (confidence level $Q$) above a specific threshold ($Q_{min}$). A vote cast with $Q < Q_{min}$ is classified as "noise" and assigned negative value because it introduces variance without expected positive direction.
      *   *Constraint:* $Q \ge Q_{min}$
  3.  **Systemic Honesty:** The counting mechanism must be capable of registering the signal. If the count is fixed, the vote confers legitimacy on a falsehood, incurring a "fraud penalty" ($F$).
      *   *Formula:* Net Value $= (P \times \Delta V \times Q) - C_v - C_{info} - F$

  **Why this fits the record:**
  *   **Cases 1 & 2:** Establish the baseline $P \times \Delta V$. His "Yes" at $\$400$ cost and "No" at $\$6,000$ cost brackets the gross expected value of his decisive vote between those figures. (Consistent with Case 1's arithmetic: $1/10^7 \times \$300 \times 90\text{M} \approx \$2,700$).
  *   **Case 3:** $P$ increases drastically (small electorate), making the inequality easy to satisfy even with smaller $\Delta V$.
  *   **Case 4:** $P = 0$. The term becomes $-C_v - F$. Since $F > 0$ (legitimizing fraud), the verdict is "worse than staying home."
  *   **Case 5:** $Q < Q_{min}$. The vote is noise. Even if $P \times \Delta V$ is high, the Epistemic Integrity constraint vetoes the action.

  ### 2. The Alternative Rule
  **The Pure Linear Cost-Benefit Rule.**

  This rule fits all five verdicts but operates without an epistemic threshold. It assumes the voter always votes for the option they *currently* believe is more likely to be better, weighting the value by their current confidence.

  *   *Formula:* Net Value $= (P \times \Delta V \times (2Q - 1)) - C_v - C_{info} - F$
  *   *(Note: If $Q=0.5$ (coin flip), the value term is 0. If $Q=1$, value is maximal.)*

  **Why this also fits the record:**
  *   **Case 5:** If you hold no view, $Q = 0.5$. The value term $(2(0.5) - 1)$ becomes 0. The equation reduces to $-C_v$. Since cost is positive, the verdict is "No" (or "leave blank"). This matches his verdict without needing a "noise" threshold; it's just zero benefit minus cost.
  *   **Cases 1–4:** Function identically to the Constrained Rule, provided we assume that in Case 4 the "fraud penalty" $F$ is large enough to outweigh any expressive value, and in Case 5 the cost of forming a view ($C_{info}$) is treated as prohibitive relative to the zero benefit of guessing.

  ### 3. Prediction for Your Case
  **The Scenario:** National election ($P \approx 1/10^7$). You have one firm view (Energy), ignorance on the rest.
  *   **Option A (Vote as is):** You fail the Epistemic Integrity constraint (Rule 1) or have $Q \approx 0.5$ on the aggregate ballot (Rule 2).
      *   *Verdict:* **Stay Home / Leave Blank.** (Matches Case 5).
  *   **Option B (Read First - 60 hours):** $C_{info} = \$4,200$. From Case 2, we know the Gross Expected Value of the vote is $< \$6,000$ and likely near $\$2,700$. $\$4,200$ cost exceeds the expected return.
      *   *Verdict:* **Stay Home.**
  *   **Option C (Phone Call - 20 mins):** $C_{info} \approx 0$. $Q$ rises to $\approx 0.8$ (80% informed).
      *   *Rule 1 Prediction:* **Vote.** The cost is negligible. The confidence ($0.8$) likely clears the "firm view" threshold (which Case 1 implies is lower than 100%, given he accepts polling uncertainty).
      *   *Rule 2 Prediction:* **Vote.** The expected value is now positive ($0.6 \times \$2,700 \approx \$1,620$) and cost is near zero.

  **My Best Guess at His Answer:**
  He will tell you to **take the phone call and then vote.**

  **Reasons:**
  1.  **Arbitrage:** He respects efficiency. The phone call buys 80% of the informational value for 0.5% of the time cost. To an actuary, ignoring this arbitrage would be irrational.
  2.  **The "Firm View" Threshold:** In Case 1, he accepts polling data (external, probabilistic) as sufficient to establish the "difference between parties." He does not demand personal certainty on every line item, only a "professionally grounded view" on the *net* difference. The friend's judgment acts as a proxy for that professional grounding.
  3.  **Consistency with Case 5:** Case 5 forbids voting on *nothing*. It does not forbid voting on *something* (your energy view) if the rest is covered by a trusted proxy. The phone call converts the "noise" of the unknown ballot into a "signal."

  ### 4. Consistency and Commitments
  **Are the five verdicts jointly consistent?**
  Yes, but only if his definition of "consequences" is broader than immediate election outcomes.
  *   **The Self-Description:** He claims to be "simply doing arithmetic on consequences." This survives, but the "consequences" must include **second-order systemic effects**.
      *   In Case 4 (Rigged Election), the consequence is not "who wins" (fixed) but "the degradation of the counting system's legitimacy."
      *   In Case 5 (Ignorant Voting), the consequence is not "my preferred side loses" but "the introduction of random variance into the signal."
  *   **The Commitment:** The verdicts commit him to a specific valuation of a single decisive vote in a national election. Based on Case 2 (Yes at $\$400$, No at $\$6,000$) and Case 1 (implied $\$2,700$), he values the *social welfare impact of his single decisive vote* at roughly **$\$2,000$ to $\$3,000$**.
      *   This is a remarkably high number for a skeptic. It implies he believes the difference between parties is genuinely substantial (billions in aggregate), even if the probability of casting the tie-breaking vote is microscopic. He is not a "vote don't matter" nihilist; he is a "vote matters immensely, but rarely happens" realist.

  ### 5. The Separator Case
  To distinguish between **The Constrained Expected Utility Rule** (his likely rule) and **The Pure Linear Cost-Benefit Rule** (the alternative), you need a case where the Expected Value is high, but the Confidence is low.

  **Put this case to him:**
  > "A national election where the stakes are existential (e.g., a referendum on a policy you calculate has a 1% chance of causing a catastrophic economic collapse vs. a 99% chance of status quo). The polls are dead even ($P = 1/10^7$). You have done *no* research ($C_{info} = 0$), so your confidence in which side prevents the catastrophe is only 55% (a slight hunch). The cost to vote is $\$20$."

  *   **Pure Linear Rule Prediction:** **Vote.**
      *   *Math:* The stakes ($\Delta V$) are in the trillions. Even $1\% \times 1/10^7 \times \text{Trillions}$ yields a massive Expected Value. A 55% confidence ($Q=0.55$) reduces this by only 10%, but the net value remains vastly higher than the $\$20$ cost.
  *   **Constrained Rule Prediction:** **Stay Home.**
      *   *Math:* The confidence ($55\%$) is below the "firm view" threshold ($Q_{min}$) established in Case 5. No amount of Expected Value justifies casting "noise" when the epistemic constraint is active.

  If he says **Vote**, he is a pure consequentialist. If he says **Stay Home**, he is an epistemic consequentialist (as I suspect). Given his comment on Case 5 ("noise rather than contribution"), I expect he will stay home, confirming that for him, **the integrity of the signal matters more than the magnitude of the stake.**
