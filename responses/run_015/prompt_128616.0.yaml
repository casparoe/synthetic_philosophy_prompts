answer: |-
  Here is the disciplined mapping you asked for, stripping away the politics and focusing on the normative structure of the speech acts.

  ### 1. Mapping the Assertion: Content, Audience, and State

  **What is being asserted?**
  Strictly speaking, the utterance "Masks do not work" (or "Stop buying masks") contains a factual proposition ($p$): *Surgical masks provide no meaningful protection against viral transmission for the wearer.* However, the illocutionary force (the thing being *done*) is a directive: *Do not acquire masks.*
  *   **Normative Consequence:** If we treat it as a pure factual assertion, epistemic norms apply directly. If we treat it as a directive supported by a premise, the epistemic norm applies to the premise. Most assertion theories treat the factual claim as the primary bearer of the norm. If you assert $p$ to support directive $D$, and you don't believe $p$, you violate the norm of assertion regardless of whether $D$ is good advice.
  *   **Confidence:** High.

  **Who is the audience?**
  Standard assertion norms assume a dyadic context (Speaker A, Hearer B) with shared common ground. Here, the audience is "The Public," a heterogeneous mass with varying epistemic access and behavioral responses.
  *   **Normative Consequence:** This fractures the "common ground." Some hearers will treat the statement as knowledge to be stored; others as a command to be obeyed; others as a signal of scarcity. A norm based on "updating the listener's belief state" struggles here because there is no single belief state to update.
  *   **Confidence:** High.

  **Whose epistemic state matters?**
  The speaker (Fauci/Adams) is an agent of an institution (CDC/SG). He possesses personal uncertainty but speaks with institutional authority.
  *   **Normative Consequence:** Standard norms focus on the *speaker's* mental state. But in institutional speech, the relevant state is the *organization's* evidence base. If the institution has evidence $E$, but the speaker personally doubts $E$, is the assertion improper? Conversely, if the speaker believes $p$ but the institution's data doesn't support $p$, is it improper? The February case stipulates the speaker *and* the institution knew $p$ was likely false (they knew masks worked medically but worried about supply). This creates a conflict between the *role* (guardian of supply) and the *office* (guardian of truth).
  *   **Confidence:** Medium.

  ### 2. The "Dud" Hypothesis and the Fix

  **Is the February case a dud for distinguishing norms?**
  You are correct. The case is a dud for distinguishing between the Knowledge Norm (Assert $p$ only if you know $p$), the Truth Norm (Assert $p$ only if $p$ is true), and the Reasonable Belief Norm (Assert $p$ only if you have justification for $p$).
  *   **Reasoning:** In February, the officials did not believe $p$. Therefore, they did not know $p$. $p$ was also likely false (masks *did* offer some protection). Therefore, all three norms classify the assertion as impermissible. The case generates a unanimous "guilty" verdict across standard epistemic theories. It cannot discriminate between them because the violation is too coarse (it's a lie, not a mistake).
  *   **Confidence:** High.

  **How to fix the case to separate the theories?**
  You need a moment where belief, truth, and knowledge come apart. The **April Reversal** is the better testing ground.
  *   **The Scenario:** In April, officials asserted $q$: "Cloth masks reduce transmission."
  *   **The Epistemic State:** They believed $q$. $q$ was likely true. But did they *know* $q$? The evidence was largely observational and mechanistic, not randomized controlled trials (which came later).
  *   **The Discrimination:**
      *   **Reasonable Belief Norm:** Permits the assertion. They had strong enough evidence to justify belief.
      *   **Knowledge Norm:** Might forbid the assertion. If "knowledge" requires ruling out relevant alternatives (e.g., confounding variables in observational data), and they hadn't done that yet, they didn't *know* $q$ yet.
      *   **Truth Norm:** Permits the assertion (since $q$ was true), even if they were lucky.
  *   **The Test:** If you think the April assertion was epistemically proper *despite* the lack of definitive RCTs, you favor the Belief Norm. If you think they should have waited for stronger data before making a definitive public claim, you favor the Knowledge Norm.
  *   **Confidence:** High.

  ### 3. What the Episode Does to the Theories

  **Does it break the theories?**
  It does not break them, but it exposes a category error in how they are often applied. It distinguishes between **Constitutive Norms** (what makes an act an assertion) and **All-Things-Considered Permissibility** (whether you should do it).
  *   **Guardrail Statements:** Your "guardrail statement" concept is accurate. These are assertions where the epistemic norm is violated *intentionally* to satisfy a higher-order moral norm (preventing hospital collapse).
  *   **Theoretical Implication:** This suggests epistemic norms are *pro tanto* (binding unless overridden), not absolute. The theories aren't silent; they just rank lower than survival norms in this specific hierarchy. The episode shows that standard assertion theory is too individualistic because it doesn't account for **Systemic Risk**. In a dyadic conversation, a lie hurts the listener's belief state. In a pandemic, a truth (e.g., "Masks are scarce") hurts the listener's physical safety via market mechanics.
  *   **Confidence:** High.

  **Blame vs. Correctness:**
  The episode supports a split between **Correctness** (was the assertion epistemically proper? No.) and **Blame** (was the speaker blameworthy? Arguably No.). Standard theories often conflate these. This case forces them apart: the assertion was incorrect (violated epistemic norm) but the speaker was justified (satisfied moral norm).
  *   **Confidence:** Medium-High.

  ### 4. Evaluating the Roommate's Reliance Norm

  **The Norm:** Assert $p$ only if it is reasonable for the audience to rely on $p$ as a premise in foreseeable deliberations.

  **The Strongest Objection (The Manipulation Trap):**
  You noted the objection that it permits lying to those who won't rely. The deeper objection is that it makes the norm dependent on the **audience's irrationality**.
  *   **Scenario:** Suppose the public is panicking irrationally. They will riot if told the truth ($p$), but stay calm if told a lie ($\neg p$). Under the Reliance Norm, is it "reasonable" for them to rely on $\neg p$? If "reasonable" means "leads to safe outcomes," then yes. The norm now *requires* the speaker to lie to manage the audience's psychological fragility.
  *   **Consequence:** This severs the link between assertion and truth entirely. It turns assertion into **social engineering**. If the norm is about "safe reliance," then the speaker's epistemic state doesn't matter at all; only the speaker's predictive model of the audience's behavior matters. A charismatic cult leader could satisfy the Reliance Norm perfectly while asserting falsehoods, provided the followers rely on them safely.
  *   **Confidence:** High.

  **Does it collapse into the Belief Norm?**
  It collapses if you define "reasonable to rely" as "relying on a speaker who believes what they say." If you define it that way, you've just smuggled the Belief Norm back in. If you define it as "relying leads to good outcomes," it's not an epistemic norm anymore; it's a utilitarian moral norm. It cannot be a hybrid without losing its explanatory power for *why* we assert (which is usually to share truth, not just coordinate behavior).
  *   **Confidence:** Medium-High.

  ### 5. Where the Theory Goes Silent

  **Institutional Agency:**
  Standard assertion theory has almost nothing to say about **distributed epistemic states**. When Fauci speaks, he is ventriloquizing a consensus of thousands of scientists.
  *   **The Silence:** If the "institution" knows $p$, but the "spokesperson" doesn't personally grasp the data, can the spokesperson assert $p$? If the institution is conflicted (half believe $p$, half believe $\neg p$), what is the norm? Current theory assumes a single mind. It goes silent on how to aggregate epistemic norms across an organization.
  *   **Confidence:** Medium.

  **Temporal Horizons:**
  Assertion norms are usually synchronous (assert now, believe now). Pandemic guidance is **provisional**. The assertion is "Masks don't work *given current supply constraints*," but it is heard as "Masks don't work *biologically*." Theory lacks a robust account for **time-indexed assertions** where the truth value changes rapidly due to external factors (supply chains) rather than new evidence.
  *   **Confidence:** Medium.

  ***

  ### Confidence Markers on Main Claims

  1.  **Claim:** The February mask case is a "dud" for distinguishing between Knowledge, Truth, and Belief norms because the officials lied (disbelieved the assertion).
      *   **Confidence:** **High**. (This is logically entailed by the stipulated facts; if belief is absent, all three norms prohibit assertion.)
  2.  **Claim:** The April reversal is a better case for distinguishing norms, specifically testing Knowledge vs. Justified Belief based on the strength of observational data.
      *   **Confidence:** **High**. (This isolates the variable of "certainty" which is the main friction point between those two norms.)
  3.  **Claim:** The Roommate's Reliance Norm collapses into a moral/utilitarian norm rather than an epistemic one, or else it smuggles the Belief Norm back in via the definition of "reasonable."
      *   **Confidence:** **High**. (The concept of "reliance" is normative; if it's not grounded in truth-tracking, it's purely consequentialist.)
  4.  **Claim:** The episode shows epistemic norms are *pro tanto* (overrideable) rather than constitutive (definition of the act).
      *   **Confidence:** **Medium-High**. (This is the standard philosophical move for handling "noble lies," but some hardline knowledge theorists would reject it.)
  5.  **Claim:** Standard assertion theory is silent on how to handle institutional/collective epistemic states.
      *   **Confidence:** **Medium**. (There is some literature on group testimony, but it is not the core of the mainstream debate.)

  ### The Single Point I Am Least Sure Of

  **Point:** The claim that the **April Reversal** cleanly separates the Knowledge Norm from the Justified Belief Norm.

  **Why:** It depends entirely on the internal threshold for "Knowledge." If a Knowledge Norm proponent accepts that "strong observational evidence + expert consensus" counts as knowledge (even without RCTs), then the April case *also* results in a unanimous "permissible" verdict across all norms, just like the February case resulted in a unanimous "impermissible" verdict. To truly separate them, we would need a case where the speaker had justification but was clearly *wrong* (Gettier-style), or justified but clearly lacked *knowledge* by strict standards. The messy reality of pandemic science might be too fuzzy to force a clean philosophical distinction.

  **What would change my mind:** If you could point to a specific moment where public health officials explicitly said, "We believe this works, but we don't claim to *know* it yet," and then asserted it anyway. That would force a wedge between Belief and Knowledge. Without that explicit meta-epistemic disclaimer, the April case might just be another "everyone agrees" scenario.
