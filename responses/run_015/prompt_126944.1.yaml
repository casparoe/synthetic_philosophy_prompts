  ## Predictable Troubleshooting
  *   **"This is just units scaling, not language."**
      *   *Response:* "Exactly. Miller argues that 'language' is just a choice of fundamental units/variables. If physics can't decide between $(T,P)$ and $(T,D)$ without empirical input, verisimilitude isn't intrinsic."
  *   **"We just need a better metric."**
      *   *Response:* "Tichý proved no metric works universally. If you find one, you've solved a 50-year-old problem. For now, assume the instability is structural."
  *   **Students refuse to accept $(T,D)$ as valid.**
      *   *Response:* "Is Pressure more fundamental than Differential Pressure? In fluid dynamics, often not. The point is that multiple valid descriptions exist."

  ## Closing the Seminar
  End by returning to the "Deadlock."
  "We started wanting to say Theory A is *better* than Theory B, even though both are false. We ended finding that 'Better' depends on how we speak. This doesn't mean science is hopeless, but it means 'Truthlikeness' is not a simple logical relation we can calculate. It forces us to ask: Are we measuring the world, or are we measuring our map?"
