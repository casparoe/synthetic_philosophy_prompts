  ## Instructor Notes: Limitations & Honesty
  You must be explicit about what this simulation *cannot* do compared to the formal proofs.

  **1. Metric vs. Logical Content**
  *   **Limitation:** The simulation uses *numerical distance* (Euclidean) as a proxy for *logical content*.
  *   **Reality:** Miller's proof works on logical consequence classes, not just geometric distance.
  *   **Honesty Clause:** Tell students: "We used distance to make this runnable in 90 minutes. The formal proof shows this instability exists for *any* measure of content that respects logical strength. We simulated the symptom; the logic proves the disease."

  **2. The "Gaming" Prediction**
  *   **Predictable Failure:** Students will collude. "I'll rank your theory high if you rank mine high." Or they will pick metrics post-hoc to justify their favorite theory.
  *   **Mitigation:** Collect the Judgment Slips anonymously. Do not let them discuss rankings until after submission.
  *   **Debrief Point:** If you catch them gaming it, use it! "Science is social. If verisimilitude judgments are subjective or strategic, can they ground scientific realism?"

  **3. The "True" Theory Problem**
  *   **Limitation:** In the simulation, if a group guesses (10,10) exactly, the game breaks.
  *   **Mitigation:** If a group gets the truth exactly, declare them "Historical Anomalies" and exclude them from the Verisimilitude ranking. The problem of verisimilitude is specifically about ordering *false* theories.

