  2.  **Deconstruct Locke's Position (Mental Sandbox):**
      *   *Essence:* Real Essence (unknown internal constitution) vs. Nominal Essence (abstract idea + name).
      *   *Universals:* They exist only as signs/words attached to abstract ideas. Nature makes particulars; minds make universals.
      *   *Knowledge:* We know nominal essences clearly; real essences are mostly unknowable (corpuscularian skepticism).
      *   *Sortals:* Species are the workmanship of the understanding, not nature's boundaries.
      *   *Induction:* Based on the co-occurrence of qualities, grounded (unknown to us) in real essence.

  3.  **Analyze Case 1: The Neural Network (Unsupervised Learning):**
      *   *Scenario:* NN finds a "dog" direction without labels/names.
      *   *Locke's Dilemma:* No name = no nominal essence? But there's a structural regularity.
      *   *Locke's Likely Answer:* It's a discovery of a *real* regularity (causal structure), but without a name/abstract idea in a mind, it is not a *universal*. It is a fact about particulars.
      *   *Extrapolation:* Locke didn't know about latent space. He'd have to equate "activation direction" with "idea."
      *   *Key Distinction:* Is the "direction" an idea? Locke requires a mind to have ideas. A NN isn't a Lockean mind. So, it's a physical regularity, not a universal.
      *   *Realist Steelman:* If the structure exists independently of the mind, isn't that a universal *in re*? Locke denies this, but the NN proves the "joint" exists without the "name."

  4.  **Analyze Case 2: Grue vs. Green (Projectibility):**
      *   *Scenario:* Two clusterings fit past data; one fails later.
      *   *Locke's Dilemma:* If species are workmanship, why does one workmanship fail?
