      *   *Scenario:* We find the real essences (atomic structure) Locke said were unknowable. They work perfectly for prediction.
      *   *Locke's Dilemma:* Does this force him into Realism about Universals?
      *   *Locke's Likely Answer:* No. He can admit we know *some* real essences now, but maintain that the *species name* is still a nominal construct. Knowing the real essence doesn't make the universal real; it just makes the nominal essence perfectly co-extensive with the real one.
      *   *Extrapolation:* Locke was pessimistic about *ever* knowing real essences. He'd have to update his epistemology, not necessarily his ontology of universals.
      *   *Key Distinction:* Even with atomic number, "Gold" is still a name we attach. The universal is the sign, not the atomic number itself.
