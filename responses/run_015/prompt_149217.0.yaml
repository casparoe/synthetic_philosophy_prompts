      *   *Refining the 'Fence' concept:* The fence is the guild system. Why was it put there? To regulate quality, train apprentices, provide mutual aid, control competition. The revolutionaries saw it as privilege. The conservative view says: before tearing it down, understand the *latent functions* (welfare, social cohesion).
