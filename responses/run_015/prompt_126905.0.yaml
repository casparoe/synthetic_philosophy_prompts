prompt: |-
  I was talking with a friend who works in biology about whether insects have moral status, and we kept getting stuck on the same problem: everyone acts like sentience is an on/off switch, but she mentioned that even in neuroscience people talk about phenomenal resolution — like the grain or bandwidth of experience — which made me think maybe moral status should be gradated along that axis too, not just present or absent. So I'm trying to figure out what a theory of gradated moral status actually has to deliver before we even start comparing candidates.

  Can you write out the full desiderata? It should cover the clear cases (humans, maybe cephalopods), the ambiguous middle (insects with nociception but questionable integration), and the bottom end (thermostats, simple feedback loops). Make sure the list includes which distinctions cant be collapsed — like having status versus how much — and which biological results it cant flatly contradict. Flag the negotiable versus non-negotiable ones, and tell me which single desideratum does the most damage to binary all-or-nothing theories. If there's a tension between tracking phenomenal resolution and respecting some kind of equality floor, say so. A table is fine if it helps organize things.
