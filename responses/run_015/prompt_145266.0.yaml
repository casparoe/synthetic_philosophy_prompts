answer: |-
  ### Step 1: Brainstorming & Diagnostic Thinking

  *   **The Observation:** You have identified a friction point. On one side, we have *fatalism regarding outcomes* (the layoff doesn't matter). On the other, we have *libertarian free will regarding inputs* (the cold shower is 100% up to you).
  *   **The Ancient View:** The Stoics were causal determinists. They believed in *Heimarmene* (fate). Everything is woven together. Even the sage's ability to choose virtue is part of the cosmic order. They didn't view the will as a magic muscle exempt from physics; they viewed it as a fragment of the divine *Logos*. If you fail, it's an error of judgment (ignorance), not necessarily a lack of "grit."
  *   **The Modern View:** This is Stoicism filtered through Neoliberalism and Cartesian Dualism. The external world is a machine (determined, indifferent). The internal self is a sovereign CEO (free, responsible for all ROI).
  *   **Existing Terms?**
      *   *Moral Luck (Nagel):* Close, but Nagel argues luck *does* affect moral judgment. This phenomenon argues luck *should not* affect internal judgment.
      *   *Just-World Hypothesis:* Psychological, not philosophical.
      *   *Toxic Positivity:* Too vague.
      *   *Bro-Stoicism:* Pejorative, not analytical.
  *   **The Core Mechanism:** It is a selective application of determinism. Determinism is applied to the *world* to reduce anxiety. Indeterminism (Free Will) is applied to the *self* to maximize accountability (and sell courses).
  *   **The Metaphysical Error:** Ancient Stoics were Materialists/Monists (mind and world are same stuff). Modern Productivity Stoics are secret Dualists (mind is separate from world).
  *   **Naming:** I need a term that captures the exemption of the will from the causal chain that governs everything else. **"Volitional Exceptionalism."**

  ### Step 2: The Diagnosis

  Here is the carving you requested.

  ***

  ### The Phenomenon: Volitional Exceptionalism

  **Definition:**
  **Volitional Exceptionalism** is the philosophical inconsistency wherein an agent applies causal determinism to external events (to mitigate distress) while simultaneously asserting libertarian free will over internal states and habits (to enforce accountability). It treats the human will as a "causal singularity"—a point of absolute freedom exempt from the biological, psychological, and circumstantial constraints that govern the rest of the universe.

  In the framework you described:
  1.  **External Sphere:** Governed by Fate. (The layoff happened; do not resist reality.)
  2.  **Internal Sphere:** Governed by Sovereign Choice. (The cold shower was missed; you chose weakness.)

  This is not merely hypocrisy; it is a functional metaphysical dualism dressed in Stoic terminology. It creates a "One-Way Mirror of Control": you look out at the world and see necessity; the world looks in at you and sees total agency.

  ***

  ### Step 3: The Carving (Boundaries & Distinctions)

  To understand exactly what this is, we must distinguish it from three neighboring concepts: Authentic Stoicism, Structural Critique, and Simple Hypocrisy.

  #### 1. Boundary vs. Ancient Stoicism (Monism vs. Dualism)
  *   **Ancient Stoicism (Monism):** The Stoics were physicalists. They believed the *hegemonikon* (commanding faculty) was made of *pneuma* (breath/matter), just like the table you sit at. While Epictetus says some things are "up to us," the Stoics acknowledged that temperament, health, and education affect one's progress toward virtue. A sage does not blame himself for a fever; nor would he necessarily blame a student for a lack of progress if the student lacked guidance. The goal is *eudaimonia* (flourishing), not *output*.
  *   **Volitional Exceptionalism (Dualism):** This modern variant secretly adopts a Cartesian split. The Body/World is a machine subject to cause and effect. The Will is a ghost in the machine, capable of overriding biology without cost.
  *   **The Edge:** The moment a modern Stoic claims you can "choose" to override clinical depression or neurodivergence through "discipline" alone, they have crossed from Stoicism into Volitional Exceptionalism. The Stoic accepts the limitation of the body; the Exceptionalist views the body as a subordinate that is disobeying orders.

  #### 2. Boundary vs. Structural Critique (Internalization vs. Externalization)
  *   **Structural Critique:** Argues that external conditions (systemic racism, economic inequality) determine internal outcomes. It says: "You didn't fail because of willpower; you failed because the system is rigged." It politicizes the *external*.
  *   **Volitional Exceptionalism:** Does not deny the system is rigged; it renders the system *irrelevant*. It says: "The system is indifferent (Stoic acceptance), therefore your failure is purely internal." It depoliticizes the external to hyper-politicize the internal.
  *   **The Edge:** A structural critique blames the *game*. Volitional Exceptionalism blames the *player* while claiming the *game doesn't matter*. The distinction lies in **liability**. In structural critique, liability is shared. In Volitional Exceptionalism, liability is 100% privatized.

  #### 3. Boundary vs. Simple Hypocrisy (Coherence vs. Contradiction)
  *   **Hypocrisy:** Saying one thing and doing another (e.g., preaching detachment while being greedy).
  *   **Volitional Exceptionalism:** Is internally coherent within its own market logic. It serves a specific function: **Anxiety Reduction + Performance Optimization.**
      *   *Anxiety Reduction:* "Don't worry about the layoff" (Low cortisol).
      *   *Performance Optimization:* "Grind harder" (High output).
  *   **The Edge:** Hypocrisy is a moral failing of the individual. Volitional Exceptionalism is a *systemic feature* of the self-help industry. It is not a bug; it is the product. It collapses only when the biological reality of the user makes the "100% control" claim empirically false (e.g., burnout, illness).

  ***

  ### Step 4: Where It Collapses (The Limit Condition)

  Volitional Exceptionalism holds water only as long as the "Internal Sphere" behaves like a software program that can be debugged. It collapses when it encounters **Endogenous Luck**.

  **Endogenous Luck** is the luck of your own biology and psychology.
  *   **The Stoic View:** If you are sick, you manage the sickness. You do not blame your will for the fever.
  *   **The Exceptionalist View:** If you are "sick" (burnout, ADHD, trauma), it is framed as a discipline failure.

  **The Collapse Point:**
  The philosophy implodes when the *instrument of control* (the brain/will) is itself damaged by the *external determinism* it claims to be exempt from.
  *   *Example:* A layoff (External Determinism) causes depression (Internal Biological Consequence).
  *   *Exceptionalist Logic:* "The layoff is indifferent, but your depression is a choice."
  *   *The Contradiction:* If the external world is determined and impacts us, how can the internal reaction be exempt from that determination? If the layoff can starve you (physical), it can depress you (chemical). To claim the chemical reaction is "up to you" while the economic cause is "fate" is the breakage point.

  ### Summary of the Carving

  | Feature | Ancient Stoicism | Structural Critique | **Volitional Exceptionalism** |
  | :--- | :--- | :--- | :--- |
  | **External World** | Determined (Providence) | Determined (Systemic) | **Determined (Indifferent)** |
  | **Internal Will** | Aligned with Nature | Shaped by Context | **Sovereign (Uncaused Cause)** |
  | **Failure Source** | Error of Judgment | Systemic Barrier | **Moral/Willpower Deficit** |
  | **Goal** | Tranquility (*Ataraxia*) | Justice/Equity | **Optimization/Productivity** |
  | **Metaphysics** | Materialist Monism | Sociological Materialism | **Secret Cartesian Dualism** |

  **Final Verdict:**
  You have identified **Volitional Exceptionalism**. It is the commodification of the Dichotomy of Control, stripped of its physics and logic, leaving only an ethical framework that privatizes risk and socializes blame. It is not Stoicism; it is **Neoliberalism wearing a toga.**
