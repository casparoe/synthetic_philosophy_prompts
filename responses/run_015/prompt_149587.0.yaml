answer: |-
  Good morning. Looking around this room, I see a tension that I want to name immediately. On one side, we have those who view history as a ladder. We climb, we stumble, but the trajectory is up. We are, broadly speaking, better off than our ancestors, and the future holds more of the same. On the other side, we have those who view history as a wheel. Empires rise, mature, rot, and fall. Nothing is guaranteed, and the view from the top is often the prelude to the slide.

  This workshop is titled "After Progress." I chose that title knowing it might irritate the optimists and amuse the pessimists. But I want to address a worry that the scholars in the room might already be whispering: If history is truly cyclical, isn't the title "After Progress" nonsense? If the wheel turns, doesn't progress eventually come back? Is this just doom-mongering in a tuxedo?

  It is a fair challenge. If we believe the ancients, we cannot simply declare the game over. So, I want to use the next few minutes to take two specific theories of historical change seriously—not as decorative metaphors, but as structural constraints on what we can hope to achieve here. I want to look at the Greek idea of constitutional cycles and the Arab sociological insight into social cohesion. If we take them seriously, they limit what we can claim about "progress," but they also give us a much more honest job to do.

  Let's start with the Greek historian Polybius. He argued that political systems are organic. They are born, they grow, and they decay. He described a cycle where monarchy degrades into tyranny, which is overthrown by aristocracy, which degrades into oligarchy, which is overthrown by democracy, which degrades into mob rule, leading back to monarchy.

  For the donors in the room: This is not a prediction of immediate collapse. It is a warning about maintenance. Polybius believed the only way to slow the cycle was a "mixed constitution," a system of checks and balances that forces different parts of society to check each other's worst impulses.

  For the scholars: I am not suggesting Polybius has the final word on political science. But his structural insight remains vital. He suggests that stability is not the default state of human affairs. It is an artificial construction that requires energy to maintain.

  If Polybius is right, then "Progress" is not a destination we reach and inhabit. It is a specific phase of the cycle where the institutions are functioning as intended. To say we are "After Progress," then, does not mean we are entering a dark age. It means we are moving past the assumption that our institutions are self-correcting. It means admitting that the ladder is not leaning against a wall; it is suspended in mid-air, and we have to hold it.

  This brings us to the second pillar, the work of Ibn Khaldun. Writing in the fourteenth century, he looked at why dynasties fall. He identified a force he called "group feeling"—a sense of shared purpose, kinship, and solidarity. He observed that this feeling is strongest in hard conditions, among people who must rely on each other to survive. As a group becomes successful, wealthy, and settled, that solidarity dissolves. Luxury makes individuals self-sufficient; they no longer need the tribe. When the group feeling fades, the dynasty loses the will to defend itself, and it is overtaken by a new group with stronger cohesion.

  This is the part where I have to be careful not to offend the people funding this museum. But Khaldun's insight is not a moral judgment on wealth; it is a sociological observation on entropy. Success breeds complacency. Comfort breeds isolation.

  If Khaldun is right, then the museum itself sits at the center of this tension. A museum is, by definition, an institution of the settled, the successful, and the wealthy. It preserves the artifacts of a civilization that believes it has something worth saving. But if Khaldun is correct, the very act of preserving our past can signal that we have lost the energy to make our future. We become curators of our own vitality.

  So, how do we hold these two ideas together without falling into despair?

  If Polybius tells us that institutions naturally degrade, and Khaldun tells us that social cohesion naturally dissolves in comfort, then "Progress" cannot be a noun. It cannot be a thing we have. It must be a verb. It must be something we do.

  This is why the title "After Progress" is not self-defeating, even if history is cyclical. We are not saying progress is impossible forever. We are saying that the *ideology* of automatic progress—the belief that the next generation will inevitably be richer, freer, and wiser than the last—is a dangerous narcotic. That ideology is the luxury Khaldun warned us about. It is the blindness to the cycle that Polybius described.

  To be "After Progress" is to accept a heavier burden. It means acknowledging that we are likely living in the later stages of a cycle, where the easy gains have been made, and the hard work of maintenance has begun. It is the difference between building a new house and repairing the foundation of an old one while living inside it. The donors in this room know that maintenance is often more expensive than construction. The scholars know that repair is often less celebrated than revolution.

  This workshop, then, is not a funeral for the future. It is a strategy session for stewardship.

  If we accept the cyclical view, our goal cannot be to escape history. We cannot build a utopia that sits outside of time. Our goal must be to lengthen the cycle. We want to stretch the period of stability. We want to deepen the roots of our institutions so they weather the rotation. We want to cultivate a new kind of group feeling that is not based on conquest or necessity, but on a shared commitment to the truth.

  This is where the museum comes in. If we are honest, this institution cannot simply be a trophy case of human achievement. If it is that, it confirms Khaldun's fear: that we are merely admiring our own luxury. Instead, this museum must become a tool for Polybius's mixed constitution. It must be a place where we confront the decay as openly as we celebrate the growth. It must show the donors the cost of their success, and it must show the scholars the value of the stability that allows them to study.

  We are gathering here to ask: What comes after we stop assuming the tide is always rising? The answer is: Swimming.

  It requires more effort. It is colder. It is more dangerous. But it is real.

  So, to the scholars: I promise you, we will not speak of progress as a divine right. We will treat history as a complex system of gains and losses.
  To the donors: I promise you, we will not speak of decline as an inevitability. We will treat our inheritance as a responsibility that requires active investment, not just passive endowment.

  If history is a wheel, we are not here to stop it from turning. We are here to grease the axle. We are here to ensure that when the turn comes, we do not fall off. We are here to admit that we are not the end of history, but merely the current custodians of a very long, very fragile story.

  Let us begin the work. Thank you.
