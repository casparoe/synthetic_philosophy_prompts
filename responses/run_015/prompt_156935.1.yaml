          *   Private Card: Shows your "Accuracy Rating" (e.g., "You are in the top 10% of predictors for this topic" OR "You are average").
          *   *The Catch:* The cards are assigned randomly, *but* the instructions tell them that expertise is often self-misjudged.
          *   *Actually, let's go with the "Credential Card" idea from the prompt.*
          *   **Game Title:** "The Grant Committee."
          *   **Setup:** 12 students. 3 Tables (4 students each).
          *   **Task:** Allocate a $100k budget across 4 Grant Proposals.
          *   **Private Info:** Each student gets a sealed envelope with a "Reviewer Profile."
              *   Profile A (Expert): "You have specialized knowledge in Field X. Your confidence in Proposals related to Field X is high."
              *   Profile B (Generalist): "You have broad knowledge. Trust the consensus."
              *   Profile C (Critic): "You have identified methodological flaws in Field X."
          *   **The Twist:** The Profiles are actually *identical* in terms of game power, BUT the text *suggests* asymmetry. OR, better: The Profiles *do* give different private evidence, but the *validity* of that evidence is unknown to others.
          *   *Let's maximize the "Second-Order" tension.*
          *   **Rule:** You may reveal your card to *one* person, but if you do, you lose voting power. Or, you can make a "Claim of Expertise" which others can challenge.
          *   *Decision:* Let's use a **Hidden Role + Evidence** mechanic.
          *   Each student gets a packet.
              *   Page 1: The Proposals (Public).
              *   Page 2: Private "Data Sheet."
                  *   4 students get Data Sheet A (Strongly supports Proposal 1).
                  *   4 students get Data Sheet B (Strongly supports Proposal 2).
