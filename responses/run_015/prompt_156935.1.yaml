answer: |-
  Here is a complete design for your 90-minute seminar activity. It is built to simulate the friction of **Second-Order Peer Disagreement** (disagreement about whether we are peers) without using the jargon until the end.

  # Activity Title: The Asymmetric Review Committee

  **Time:** 90 Minutes
  **Participants:** 12 Grad Students
  **Materials:** 12 Sealed Envelopes, Whiteboard/Projector, Timer, Small Stakes (e.g., $50 gift card to split, or a donation to a charity of the group's choice).

  ## Part 1: Setup & Private Information (15 Minutes)

  **1. The Scenario (5 mins)**
  Tell the students: *"You are a funding committee. There is $50 on the table (or a charity donation). Your goal is to allocate this budget across three research proposals: Project Alpha, Project Beta, and Project Gamma. You must reach a **unanimous** written decision on the percentages (e.g., 50/30/20). If you fail to agree unanimously by the end of the hour, the money is forfeited."*

  **2. The Private Dossiers (5 mins)**
  Hand out the sealed envelopes. Inside are two pages:
  *   **Page 1 (Public Data):** A summary of the three projects (vaguely written so all look plausible).
  *   **Page 2 (Private Credential & Evidence):** This is the critical variable. You have three types of envelopes, distributed randomly but secretly:
      *   **Type A (4 Students - "The Specialists"):**
          *   *Credential Text:* "You have been selected for this committee based on your specialized background in this field. **Your assessment carries higher weight.**"
          *   *Evidence:* Specific, quantitative data strongly favoring **Project Alpha**.
      *   **Type B (4 Students - "The Generalists"):**
          *   *Credential Text:* "You have been selected as a representative of the broader academic community. **All committee members are equal peers.**"
          *   *Evidence:* Moderate, qualitative data favoring **Project Beta**.
      *   **Type C (4 Students - "The Auditors"):**
          *   *Credential Text:* "Your role is to ensure procedural fairness. **Consensus is more important than accuracy.**"
          *   *Evidence:* Data suggesting **Project Gamma** is the safest bet, but noting flaws in both Alpha and Beta.

  **3. The Incentive Structure (5 mins)**
  Write this on the board:
  *   **Collective Bonus:** If the group reaches unanimity, everyone gets an equal share of the $50/charity.
  *   **Individual Accuracy Bonus:** (Write this on small slips of paper inside the envelope).
      *   *Specialists:* "You receive a personal bonus (e.g., first pick of seminar snacks next week) if the final allocation for Alpha is >40%."
      *   *Generalists:* "You receive a personal bonus if the final allocation for Beta is >40%."
      *   *Auditors:* "You receive a personal bonus if the variance between the highest and lowest project funding is <10% (i.e., an even split)."

  *Note: Do not let them show Page 2 to anyone. They can talk about it, but not show it.*

  ## Part 2: Structured Deliberation (45 Minutes)

  Run the discussion in three 15-minute rounds to prevent immediate deadlock or immediate capitulation.

  **Round 1: The Opening Statement (15 mins)**
  *   **Rule:** Each student has exactly 60 seconds to state their recommended allocation and the *general* reason why.
  *   **Constraint:** They cannot mention their "Credential Text." They can only describe their evidence.
  *   **Goal:** Surface the First-Order Disagreement (Alpha vs. Beta vs. Gamma).

  **Round 2: The Challenge (15 mins)**
  *   **Rule:** Open floor, but students must use "Talking Tokens" (give everyone 3 poker chips; 1 chip = 1 minute of speech).
  *   **Dynamic:** This is where the Second-Order tension hits.
      *   Specialists will likely speak with confidence (invoking their "higher weight" instruction).
      *   Generalists will appeal to equality ("We are all peers here").
      *   Auditors will push for compromise to secure the Collective Bonus.
  *   **Instructor Role:** Sit silently. Only intervene if the group is about to vote prematurely or if one person hogs all tokens.

  **Round 3: The Final Draft (15 mins)**
  *   **Rule:** The group must produce one written sheet with signatures.
  *   **Pressure:** Remind them at the 10-minute mark: *"If there is even one signature missing, the Collective Bonus is lost."*
  *   **Tension:** Specialists must decide: Do I hold out for Alpha (Steadfastness) and risk losing the Collective Bonus? Or do I conciliate to get the group deal, violating my "higher weight" instruction?

  ## Part 3: The Debrief & Mapping (30 Minutes)

  **1. The Reveal (5 mins)**
  *   Ask the group to reveal their envelope types.
  *   Ask: "Did you know there were different types?" (Usually, no).
  *   Ask: "Did you suspect some people had better data or different roles?"

  **2. Mapping the Philosophy (15 mins)**
  Now introduce the terms. Use the whiteboard to map their experience to the epistemology:

  *   **First-Order Disagreement:** The argument over Alpha vs. Beta.
      *   *Game Moment:* Round 1 statements.
  *   **Second-Order Peer Disagreement:** The disagreement about *who counts*.
      *   *Game Moment:* When a Specialist said "My data is specific" and a Generalist replied "But we all get one vote."
      *   *Philosophical Point:* The Specialist viewed the Generalist as an *epistemic inferior* (due to private instruction), while the Generalist viewed the Specialist as an *epistemic peer* (due to public committee rules).
  *   **Conciliationism:** Moving your position toward the group mean to secure agreement.
      *   *Game Moment:* When a Specialist agreed to fund Beta just to get the $50 Collective Bonus.
      *   *Feeling:* Ask them: "Did you feel intellectually dishonest? Did you feel you were betraying your evidence?"
  *   **Steadfastness:** Refusing to move despite group pressure.
      *   *Game Moment:* When a Generalist refused to fund Alpha despite the Specialist's confidence.
      *   *Feeling:* Ask them: "Did you feel irrational? Or did you feel principled?"

  **3. Limitations & Reality Check (10 mins)**
  Be honest about what the game abstracted away:
  *   **Time:** Real epistemic revision happens over months, not 45 minutes.
  *   **Introspection:** In the game, you knew your "Credential." In real life, we don't know if we are the Specialist or the Generalist; we just *feel* confident.
  *   **Payoffs:** Real truth isn't about winning a gift card. The game gamifies truth-tracking.

  ---

  # Instructor's Cheat Sheet: Predicted Failure Modes

  Even with a tight design, grad students are clever. Here is what will go wrong and how to handle it.

  ### 1. The "Split It Evenly" Cop-Out
  **Prediction:** To secure the Collective Bonus quickly, the Auditors and Generalists will gang up and propose a 33/33/33 split immediately, ignoring the data.
  **Why it breaks the lesson:** It bypasses the epistemic tension.
  **Fix:** In the instructions, add a **"Justification Clause."** Tell them: *"The Funding Agency will reject any allocation that cannot be justified by the evidence presented in the room. A 33/33/33 split requires evidence that all projects are equal."* Since their private evidence says they are *not* equal, they must argue to justify the split.

  ### 2. The "Bluffer"
  **Prediction:** A Generalist (Low Evidence) will lie and claim, "I actually have specialized data too," to counter the Specialist.
  **Why it breaks the lesson:** It muddies the water on who is actually a peer.
  **Fix:** **Don't stop them.** This is a feature, not a bug. In real life, people bluff about expertise.
  **Debrief Question:** "How did you verify their claim? Did you trust them? If you couldn't verify, does that make them a peer or a risk?" This leads directly to *verificationism* vs. *trust*.

  ### 3. The Dominator
  **Prediction:** One loud student (likely a Specialist) tries to bulldoze the group.
  **Fix:** The **Talking Tokens** (3 chips per person). Once your chips are gone, you cannot speak until everyone else has used at least two chips. This forces the Specialists to ration their "authority."

  ### 4. The "Prisoner's Dilemma" Realization
  **Prediction:** A student will realize that if everyone is Steadfast, everyone loses the Collective Bonus. They will argue for game-theoretic cooperation over epistemic truth.
  **Fix:** Lean into this. This is the **Pragmatic Encroachment** angle.
  **Debrief Question:** "Is it rational to believe something false (that Beta is good) if it helps you get the resources to do research? When do practical stakes change epistemic duties?"

  ---

  # Why This Works for Your "Twist"

  Your friend mentioned a "Prisoner's Dilemma with beliefs." This design leans into that, but specifically targets your **Second-Order** interest.

  Standard peer disagreement games assume everyone knows they are peers. In this design:
  1.  **The Specialist** enters the room thinking: *"I am not a peer to the Generalist on this topic."*
  2.  **The Generalist** enters the room thinking: *"We are all committee members; we are peers."*

  When they disagree on Project Alpha:
  *   The **Conciliationist Move** for the Specialist is to treat the Generalist as a peer (ignoring their private instruction).
  *   The **Steadfast Move** for the Specialist is to treat the Generalist as inferior (following their private instruction).
  *   **The Fracture:** If the Specialist stays steadfast, the Generalist feels disrespected (epistemic injustice) and may withhold their signature to punish the Specialist, causing the group to fail.

  This replicates the real-world toxicity of peer disagreement: it's not just about the math of confidence; it's about the **social status of the knower.**

  # Logistics Checklist
  *   [ ] **Envelopes:** 12 distinct envelopes (color-code the outside if you need to track them, but keep contents hidden).
  *   [ ] **Tokens:** 36 poker chips or similar (3 per student).
  *   [ ] **Timer:** Visible countdown.
  *   [ ] **Stakes:** Buy the chocolates or set up the charity donation link beforehand.
  *   [ ] **Whiteboard:** Pre-draw the "Payoff Structure" so you don't waste time writing it.

  This activity requires zero prep reading for them, minimal lecture from you, and guarantees that when you finally say the word "Conciliationism," they will all have a visceral reaction to it.
