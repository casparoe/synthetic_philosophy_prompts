      *   *Selection:* **Budget Allocation.** It forces trade-offs. You can't just say "both are good." You have to move money.
      *   *The "Credential" Twist:* Each student gets a private card. Some say "Expert in Project A," some "Expert in Project B," some "Generalist." But they don't know who else has what.
      *   *The "Second-Order" Twist:* The instructions should imply everyone is equal (peers), but the cards suggest otherwise. Or, allow them to *claim* expertise but verify only partially.
      *   *Refining the Twist:* To capture *second-order disagreement*, the players need to disagree about the *weight* of each other's voices.
      *   *Mechanism:* "Influence Tokens." Everyone starts with equal tokens. But private cards give *hidden multipliers* or *penalties* to certain outcomes.
      *   *Better Mechanism:* **The "Blind Audit" Game.**
          *   Task: Allocate funds to 3 research projects (Alpha, Beta, Gamma).
          *   Private Info: Each student gets a "Dossier."
              *   Type 1 (Specialists): You have strong evidence that *one* project is high yield/high risk.
