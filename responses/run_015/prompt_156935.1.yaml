          *   The Conflict: A Specialist on Alpha wants to fund Alpha. A Skeptic on Alpha wants to defund it. They are *not* peers regarding Alpha, but they *are* peers regarding the process.
          *   The "Second-Order" aspect: When a Specialist speaks firmly, the Generalist must decide: "Is this person a peer (just confident) or do they know something I don't (asymmetric expertise)?"

