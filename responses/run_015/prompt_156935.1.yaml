      *   *Standard Peer Disagreement:* A and B disagree on $P$. A and B are epistemic peers (equal intelligence, evidence, etc.). Conciliationism says: lower confidence/compromise. Steadfastness says: stick to your guns (maybe you evaluated the evidence better).
      *   *Second-Order Disagreement:* A thinks B is a peer. B thinks A is *not* a peer (or vice versa). Or both think the other is inferior. This breaks the symmetry required for standard conciliationism.
      *   *The "Feeling":* Students need to feel the pressure to compromise vs. the pressure to trust their private info. They need to feel the ambiguity of *who counts*.

  3.  **Brainstorming the Game Mechanic:**
