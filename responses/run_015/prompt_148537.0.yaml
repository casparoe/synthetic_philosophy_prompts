answer: |-
  1. Conceptual framing
  "Contractual conversion" denotes a market-based evolution where laborers voluntarily accumulate capital to become co-owners, transforming relations through competition rather than coercion. "Structural expropriation" implies a revolutionary or legislative abolition of private property rights, mandating redistribution as a precondition for justice. Mill's late socialism is distinctly liberal; he envisions a future where workers replace capitalists not by seizing assets, but by outcompeting them through superior efficiency in voluntary associations. He endorses the former because it respects individual liberty and property rights during the transition, allowing for gradual moral education. He rejects the latter because it relies on state coercion, risks tyranny, and undermines the security necessary for economic productivity and personal independence. For Mill, justice cannot be achieved through injustice. Thus, Mill seeks a moral transformation of capitalism from within, preserving the legal framework of property while altering its social function through voluntary contract. He believes the legitimacy of any economic system rests on its ability to foster individual development, which forced redistribution would stifle. This approach prioritizes moral agency over material equality.

  2. Mill's arguments
  In his later years, Mill argued that the wage system is inherently flawed because it divorces labor from ownership, creating antagonistic class interests. He championed industrial cooperatives where workers hire capital and share profits, believing this aligns incentives and boosts productivity. However, he did not advocate immediate abolition of the capitalist class. Instead, he relied on fair competition between capitalist firms and cooperative associations. He believed cooperatives would prove economically superior, gradually displacing traditional firms through market success rather than legislative fiat. He anticipated a diffusion of capital where workers become capitalists themselves, dissolving class distinctions through ownership. This ties into his famous conception of the "stationary state." Mill welcomed an end to endless capital accumulation, not as economic stagnation, but as a cultural opportunity for moral improvement. Once basic material needs are met via cooperative efficiency, society could focus on intellectual growth rather than relentless growth. In this state, the focus shifts from producing more wealth to distributing existing wealth more equitably through voluntary means. He viewed socialism not as a sudden rupture but as an educational process. The state's role is limited to enabling experiments in cooperation, not mandating them. Thus, the transition depends on the voluntary adoption of better practices by workers themselves, secured through contract and competition, ensuring that the shift remains consistent with liberal principles of free choice and individual development.

  3. The crux
  The instability arises if contractual conversion achieves total market dominance. If voluntary cooperatives displace all private capitalist firms, the functional result mirrors structural expropriation: private capital ownership ceases to be the primary mode of production. The boundary blurs when the economic pressure to join cooperatives becomes coercive in practice, even if voluntary in law. If individual capitalists are rendered obsolete not by force but by market inevitability, has their property right been respected or merely circumvented? Furthermore, Mill's commitment to liberty faces a test here. If the cooperative model requires uniform rules to maintain equity among workers, does this suppress individual entrepreneurial deviation? The tension lies in whether a society of universal cooperatives can sustain the pluralism Mill valued. If the "voluntary" shift becomes the only viable economic path, the distinction between choosing cooperation and being forced into it collapses. Mill assumes individuals will freely choose the superior system, but if the system demands conformity to survive, the liberal safeguard of exit rights may become theoretical rather than real, risking a soft structural expropriation disguised as market choice.

  4. Assessment within Mill's framework
  Within Mill's utilitarian liberalism, this tension is theoretically resolvable but practically precarious. His utilitarianism prioritizes outcomes—specifically, the higher pleasures associated with autonomy and development. If cooperatives produce greater happiness and moral growth, they are justified. His liberalism requires that the means remain voluntary. Therefore, as long as the transition avoids state confiscation, Mill's framework holds. However, an ambiguity remains regarding the status of property rights themselves. Mill views property not as a natural right but as a human institution justified by utility. This makes property contingent. If private capital ceases to serve utility, Mill's framework permits its eventual demise. The ambiguity lies in whether the state can remain neutral while encouraging cooperatives. If the state actively favors one form of contract over another to speed up the "conversion," it edges toward structural engineering. Ultimately, Mill resolves the tension by subordinating property rights to human development. The framework survives, but it reveals that his defense of property is instrumental, not absolute, leaving open the possibility that utility could eventually mandate what liberty initially forbade.

  5. Bottom line
  Mill's late socialism commits him to a market-based evolution where labor supersedes capital through proven efficiency, not legal seizure. He demands justice for workers but insists it must be achieved without violating individual liberty or security. The distinction between contractual conversion and structural expropriation clarifies his position significantly. It highlights that Mill was not a socialist in the revolutionary sense but a liberal reformer seeking to humanize capitalism from within. It shows he believed a liberal society might naturally outgrow private capitalism without ever abolishing it by decree, fulfilling liberal ideals through economic evolution.
