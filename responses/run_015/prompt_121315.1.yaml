answer: |-
  This is not you staring too long. You have identified a structural aporia in the operation of the Genocide Convention, specifically the tension between Article 1 (prevention) and Article 2/3 (punishment/definition).

  Here is the carving you asked for. I will break this down into: (1) the nearest existing concepts and why they miss the mark, (2) a proposed name and definition for your specific shape, (3) a critique of your three cases (where a viva examiner would attack), and (4) boundary conditions.

  ### 1. The Conceptual Carving

  You are right that Austin's "verdictives" are relevant, but you are also right that they aren't the whole story.
  *   **Verdictives** (Austin): Acts that give a finding on a fact (e.g., a jury verdict, an umpire's call). They rely on evidence *already gathered*.
  *   **Exercitives** (Austin): Acts that exercise power or influence to bring something about (e.g., declaring war, sentencing).

  **The Mismatch:** The "G-word" functions legally as a **Verdictive** (requiring retrospective certainty of intent) but functions politically as an **Exercitive** (intended to trigger the duty to prevent).
  *   **Existing Concept A: Pathological Legalism.** This describes the *attitude* of the foreign ministry (Case 1). It is the use of legal precision to avoid political responsibility. *Why it doesn't fit:* It explains the *motive* for the delay, but not the *structural mechanism* of the evidence gap.
  *   **Existing Concept B: Securitization.** (Moving an issue out of normal politics into emergency politics). *Why it doesn't fit:* Securitization theory usually studies how actors *successfully* label things to gain power. You are studying the *refusal* to label due to evidentiary constraints.
  *   **Existing Concept C: The "Prevention-Punishment Gap."** This is common in legal literature. *Why it doesn't fit:* It's too broad. It covers everything from funding tribunals to peacekeeping. It doesn't capture the specific *linguistic/evidentiary* squeeze you are describing.

  ### 2. The Name and Definition

  There is no single canonical term for this specific temporal-evidentiary squeeze. If I were examining this thesis, I would accept a new term provided it is rigorously defined.

  **Proposed Name:** **Evidentiary Hysteresis** (or **The Preventive-Verdictive Gap**)

  **Definition:** A structural lag wherein the evidentiary threshold required to legally validate a category (retrospective verdict) exceeds the informational availability during the timeframe in which the category is functionally useful for prevention (prospective diagnosis).

  **Why this works:**
  *   **Hysteresis** implies a system where the output (the label) lags behind the input (the violence) due to internal friction (legal standards), and where the state of the system depends on its history (you can't know intent until the pattern is complete).
  *   It captures your "Verdict vs. Diagnosis" intuition without relying solely on the medical analogy, which can be fragile.

  ### 3. Critique of Your Three Cases (The Viva Risk)

  You asked where I would say "no, that's not a real pattern." Here is the vulnerability in your triad.

  **Case 1 (Bureaucratic Delay):**
  *   **Status:** Strong. This is the core of your argument.
  *   **Risk:** You must distinguish between *genuine* evidentiary caution and *performative* caution. If the Foreign Office says "we need a court ruling," but a court ruling is impossible without state referral, they are creating a catch-22. You need to show they know it's a catch-22.

  **Case 2 (Historical/Archival):**
  *   **Status:** Weak link.
  *   **Risk:** This is not the same phenomenon. In Case 1, a decision *not to act* is made in real-time. In Case 2, no decision was possible; it is an epistemological limit, not a political one. Conflating "we didn't know then" with "we won't say now" risks diluting the argument.
  *   **Fix:** Use Case 2 only to show the *consequence* of the standard (that the bar is inherently retrospective), not as an example of the political reluctance itself.

  **Case 3 (Early Naming that Sticks):**
  *   **Status:** Critical Variable.
  *   **Risk:** This is where the examiner will try to break your "shape." If the label *can* be applied early (e.g., ISIS/Yazidis, or Srebrenica relatively quickly), then the "Evidentiary Hysteresis" is not a structural law; it is a political choice.
  *   **Your intuition is correct:** "Who has the standing to name matters more than what's known."
  *   **Fix:** You must argue that Case 3 proves the constraint is **political**, not legal. The "legal caution" in Case 1 is a *pretext* enabled by the Hysteresis, not caused by it. If you treat the Hysteresis as an absolute law, Case 3 disproves you. If you treat it as a *resource* states use to justify inaction, Case 3 strengthens you.

  ### 4. Boundary Cases (What Doesn't Count)

  To defend this at viva, you need to know what falls outside your definition.

  **1. War Crimes / Crimes Against Humanity:**
  *   **Why it's different:** These categories rely more on *acts* (killing, torture) than *intent to destroy a group*. The evidentiary lag is much shorter. You can name a war crime while bullets are flying based on footage. You cannot name genocide based on footage alone.
  *   **Boundary:** If a state says "We can't call it war crimes yet either," that is general denialism, not your specific phenomenon. Your phenomenon is specific to the *intent* requirement of the G-word.

  **2. R2P (Responsibility to Protect) Invocation without the G-Word:**
  *   **Why it's different:** States often trigger intervention mechanisms (sanctions, peacekeepers) using "humanitarian crisis" language to avoid the legal baggage of genocide.
  *   **Boundary:** If they act *without* the word, your argument about the "cost of caution" is weakened (because they acted anyway). Your argument holds strongest when the *withholding of the word* correlates with the *withholding of action*.

  **3. "Genocide" used as loose political rhetoric (e.g., "cultural genocide," "genocide of farmers"):**
  *   **Why it's different:** This is inflationary usage. Your shape is about the *restriction* of the term.
  *   **Boundary:** This is the opposite phenomenon. This is "Diagnosis without Verdictive standards."

  ### 5. Where You Are Guessing (and need to shore up)

  **The Medical Analogy:**
  *   **Guess:** You lean on "Diagnosis under uncertainty."
  *   **Risk:** In medicine, a wrong diagnosis (false positive) leads to unnecessary treatment. In international law, a wrong genocide accusation (false positive) leads to accusations of libel, diplomatic rupture, or loss of credibility. The "cost of error" is different.
  *   **Fix:** Acknowledge this. The state's reluctance isn't just about evidence; it's about the *liability* of being wrong. The "Hysteresis" protects the *accuser* as much as it harms the *victim*.

  **The "Intent" Problem:**
  *   **Guess:** You assume intent is hard to see in real-time.
  *   **Risk:** Sometimes intent is explicit (radio broadcasts, manifestos). In those cases, the Hysteresis collapses.
  *   **Fix:** Your coding needs to account for *explicit* vs. *inferred* intent. Your argument is strongest when the destruction is "policy rather than rallies" (as you noted). If there are rallies, and states *still* wait, that proves the "legal caution" is a sham.

  ### Summary Recommendation

  1.  **Keep the "Verdict vs. Diagnosis" intuition.** It is your strongest theoretical hook. Formalize it as the **Preventive-Verdictive Mismatch**.
  2.  **Demote Case 2.** Treat it as background context (the legal standard is inherently retrospective), not as a parallel example of political reluctance.
  3.  **Make Case 3 the Pivot.** Use the exceptions to prove the rule. If early naming happens, *who* did it? (Courts? NGOs? Specific States?) This supports your hunch that "standing to name" is the variable, not just the evidence.
  4.  **Name the Cost.** You wrote: "caution costs whoever is being careful nothing and costs the people being killed time." Turn this into a metric. The "cost of epistemic caution."

  This is a solid chapter shape. It is not three things stapled together; it is one structural tension manifesting in three different temporalities (bureaucratic, historical, exceptional). Just ensure you don't let the "legal difficulty" excuse the "political choice." The law provides the *cover*, but politics pulls the *trigger*.
