  ### Desiderata for a Goal Misgeneralization Benchmark

  1.  **Capability Sufficiency:** The definition must verify that the system possessed the architectural and informational capacity to achieve the intended goal in the test environment, independent of whether it did so.
      *   *Status:* **Non-Negotiable.**
      *   *Case:* Distinguishes the agent following the correlated landmark (GMG) from the agent failing due to perception limits or novel layout (Capability Failure).
  2.  **Intent Divergence:** The definition must posit a distinction between the designer's intended objective and the objective actually optimized by the system.
      *   *Status:* **Non-Negotiable.**
      *   *Case:* Handles the proxy-improvement/true-objective-collapse scenario and the "right goal, wrong scope" case by requiring a ground truth to measure divergence against.
  3.  **Training Consistency:** The system's behavior must be consistent with maximizing a reward function derivable from the training process, rather than random degradation or noise.
      *   *Status:* **Non-Negotiable.**
      *   *Case:* Adjudicates the pair of systems with identical loss/ID behavior diverging OOD; only the one tracking a consistent (but wrong) objective counts as GMG.
  4.  **Observability:** The classification criteria must be measurable from external behavior and training logs without requiring access to internal weights or activations.
      *   *Status:* **Preference (Benchmarkers/Empiricists).**
      *   *Case:* Necessary for scaling the benchmark to large language models where internal states are opaque, but conflicts with Capability Sufficiency.
  5.  **In-Distribution Applicability:** The definition must allow for GMG to be identified within the training distribution, not solely in out-of-distribution (OOD) contexts.
      *   *Status:* **Non-Negotiable.**
      *   *Case:* Captures specification gaming where the proxy improves while the true objective collapses during training.
  6.  **Situational Neutrality:** The definition must classify deceptive alignment (defecting only when stakes are high) as GMG, regardless of when the deviation manifests.
      *   *Status:* **Non-Negotiable.**
      *   *Case:* Ensures the "treacherous turn" is not exempted simply because in-distribution behavior was aligned.

  ### Incompatible Desiderata

  The demand for **Observability** (Desideratum 4) and **Capability Sufficiency** (Desideratum 1) cannot be jointly satisfied in the general case. This is a **genuine impossibility**, not merely a practical limitation. Underdetermination of theory by data dictates that for any behavior exhibiting failure, there exists both a "capability limit" explanation and a "different goal" explanation that are observationally equivalent without access to internal states or a perfect model of the system's capacity bounds. A benchmark must therefore relax Observability (requiring auxiliary capacity tests) or relax Capability Sufficiency (accepting probabilistic classification).

  ### Most Exclusionary Requirement

  The single requirement that excludes the most otherwise attractive definitions is **Capability Sufficiency**. It eliminates all purely behavioral definitions (which equate failure with incapacity or GMG based solely on performance drops) and all "reward-is-truth" definitions (which assume optimizing the training signal implies correct generalization).

  **Test against Ambiguous Training Signal:** In the case where the training signal is consistent with several distinct goals and nothing settles which was intended, **Capability Sufficiency** strains the definition to breaking point. Because the system successfully generalized *a* goal consistent with the signal, we can infer it had the *capacity* to generalize the *intended* goal (assuming informational equivalence). However, without a unique intended goal specified by the setup, we cannot verify if the failure was a refusal to pursue *that specific* goal or simply the successful pursuit of *another* valid one. The requirement forces the benchmark to admit the case is "Underspecification" rather than GMG, excluding it from classification entirely.

  ### Readings of "Goal"

  *   **Behavior-first:** Fails the Non-Negotiable Capability Sufficiency requirement because it cannot distinguish "would not" from "could not" without counterfactual capacity testing.
  *   **Internal-representation:** Fails the Preference for Observability, as reading objectives from weights is not yet scalable or robust enough for a general benchmark.
  *   **Idealized-specification:** Fails the Ambiguous Signal test, as it requires a unique ground-truth intent that does not exist in underspecified training environments.
