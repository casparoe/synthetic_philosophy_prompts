  **Exam Question: The Two-Branch Exchanger Case**

  **Time Allowed:** 90 Minutes
  **Word Limit:** None (Manage your time to address all parts of the question)

  **Prompt:**

  Consider the **Two-Branch Exchanger Case**. Omega flips a fair coin. You are told the result. 

  **Heads Branch:** Omega asks you to pay $1,000. Omega has already placed $1,000,000 in a secure account, but will only release it to you if you pay the $1,000. However, Omega placed the money there *only because* it perfectly predicted that your decision function would output "Pay" if you were in the Tails Branch. If Omega predicted you would refuse in the Tails Branch, the account is empty.

  **Tails Branch:** Omega makes no request. Instead, you receive a letter from a perfect-predictor blackmailer. The letter was sent if and only if exactly one of the following is true: (i) you have a rare disease (50% prior); (ii) your decision function would output "Pay" upon receiving this letter. If you have the disease and do not pay, the blackmailer reveals it (costing you $1,000,000). If you pay, they remain silent (costing you $1,000). If you do not have the disease, revealing it is impossible; refusing costs nothing, paying costs $1,000.

  You possess a single fixed decision function that maps your total evidence (including the coin result) to an action. Predictors correlate their setup with the output of this function on the relevant input.

  **Essay Question:**

  Analyze the Two-Branch Exchanger Case. First, specify what action a Causal Decision Theory (CDT) agent, an Evidential Decision Theory (EDT) agent, and a Functional Decision Theory (FDT) agent takes in the Heads Branch and the Tails Branch. Second, explain why the intuitively attractive policy of "Pay Omega in Heads, but Refuse the Blackmailer in Tails" is unavailable to a single decision function, or comes at a catastrophic cost. Finally, discuss what this case demonstrates about the difference between evaluating a physical act versus evaluating the output of a decision function.

  ***

  **Model Answer**

  In the Heads Branch, the CDT and EDT agents both pay the $1,000. For CDT, the payment is causally efficacious in releasing the funds already present; for EDT, payment is strong evidence that the funds are available. The FDT agent also pays in the Heads Branch, but for a different reason: FDT evaluates the decision function globally. Since the money exists in Heads only if the function outputs "Pay" in Tails, and the function is currently executing in Heads, FDT pays to realize the reward secured by its own logical disposition.

  In the Tails Branch, the divergence is sharper. The CDT agent calculates that their current action cannot change whether they have the disease or whether the letter was sent. Facing a 50% risk of a $1,000,000 loss versus a guaranteed $1,000 cost, CDT pays the blackmailer to mitigate the expected loss. The EDT agent also pays. For EDT, paying is evidential news that they do not have the disease (since the letter condition is Disease XOR Pay); refusing is news that they do have the disease. Thus, EDT pays to avoid the bad news of having the disease.

  The FDT agent's calculation in Tails is more complex. Locally, refusing the blackmailer seems superior; if the decision function outputs "Refuse," the letter would only have been sent if the agent has the disease. However, FDT recognizes that the Heads Branch reward depends on the function's output in the Tails Branch. If the function outputs "Refuse" in Tails, Omega predicts this, leaves the Heads account empty, and the agent loses the $1,000,000 opportunity. If the function outputs "Pay" in Tails, the account is funded. FDT compares the global expected utility of the function "Always Pay" versus "Always Refuse" (or conditional variants). Because the $1,000,000 gain in Heads outweighs the potential blackmail costs in Tails, FDT outputs "Pay" in the Tails Branch as well, securing the counterfactual reward.

  The intuitively attractive package—"Pay Omega in Heads, Refuse Blackmailer in Tails"—is unavailable to a single decision function because the Heads reward is contingent on the Tails disposition. You cannot possess a function that outputs "Pay" when the input is "Heads" but "Refuse" when the input is "Tails" *and* expect Omega to have filled the account. Omega fills the account based on what the function does in Tails. If the function refuses in Tails, the account is empty in Heads. Therefore, the agent faces a choice between two coherent functions: one that pays in both branches (securing the million but paying blackmail) or one that refuses in both (avoiding blackmail logic but losing the million). The "mixed" policy is causally and logically incoherent given the predictor's constraints; attempting to adopt it results in the catastrophic cost of finding the Heads account empty despite being willing to pay.

  This case highlights the fundamental distinction between evaluating a physical act and evaluating the output of a decision function. CDT and EDT evaluate the token act: "Given I am here now, does pressing this button help?" They treat the other branch as counterfactual history that cannot be influenced. FDT evaluates the algorithm: "What output should my function return given this input to maximize utility across all possible instantiations?" By treating the decision as a logical output rather than a physical event, FDT recognizes that its choice in Tails logically determines the state of the world in Heads. Rationality, therefore, requires optimizing the source code of agency, not just the immediate physical motion, ensuring consistency across all branches where that source code is run or simulated.

  ***

  **Marking Scheme**

  **Total Marks: 20**

  **1. Specification of Actions in Heads Branch (4 Marks)**
  *   **Criteria:** Correctly identifies that CDT, EDT, and FDT all pay in the Heads Branch, but distinguishes the reasoning (CDT/EDT see local efficacy/evidence; FDT sees global function consistency).
  *   **Common Error:** Claiming FDT refuses in Heads because the money is already there or treating Heads as independent of Tails.

  **2. Specification of Actions in Tails Branch (4 Marks)**
  *   **Criteria:** Correctly identifies CDT and EDT pay (due to expected loss/evidential correlation). Correctly identifies FDT pays *primarily* to secure the Heads reward (global optimization), acknowledging the tension with local blackmail incentives.
  *   **Common Error:** Asserting FDT refuses in Tails because FDT typically refuses blackmail, ignoring the Counterfactual Mugging dependency linking the branches.

  **3. Explanation of the Single Function Constraint (4 Marks)**
  *   **Criteria:** Explains that the agent possesses one function $F(Evidence) \to Action$. The "Pay Heads/Refuse Tails" package requires $F$ to behave inconsistently regarding the predictor's logic, specifically that Omega's Heads setup depends on $F(Tails)$.
  *   **Common Error:** Treating the branches as completely isolated decision problems where policies can be mixed without consequence to the predictor's prior setup.

  **4. Analysis of Catastrophic Cost/Unavailability (4 Marks)**
  *   **Criteria:** Articulates that choosing "Refuse Tails" causes Omega to leave the Heads account empty. Thus, the "mixed" policy yields $0 in Heads and potential loss in Tails, which is catastrophically worse than the "Always Pay" function.
  *   **Common Error:** Focusing only on the blackmail cost without noting the loss of the $1,000,000 reward in the Heads branch as the primary cost of refusing in Tails.

  **5. Distinction Between Physical Act and Decision Function (4 Marks)**
  *   **Criteria:** Clearly contrasts act-based evaluation (CDT/EDT focus on local causal/evidential impact) vs. function-based evaluation (FDT focuses on logical correlation and algorithmic output across possible worlds).
  *   **Common Error:** Describing FDT merely as "cooperating" without explaining the metaphysical shift from evaluating events to evaluating logical outputs/source code.
