answer: |-
  ### 1. Restating the pattern

  You are describing a specific asymmetry in how scientific credit is assigned. The intellectual labor and the resulting discovery remain constant, but the historical valuation of the discoverer fluctuates based on external contingencies they could not control. Specifically, credit is discounted if a rival was near, rendering the discovery inevitable, yet the discovery itself retains its value. Furthermore, this valuation depends on the archival survival of evidence regarding that rival. You are isolating a mechanism where historical judgment penalizes individual genius based on the invisible proximity of competitors, rather than the intrinsic difficulty of the work. It is a disconnect between the objective effort expended and the subjective credit awarded, mediated entirely by the historical visibility of a competitor who may have been unknown to the discoverer at the time.

  ### 2. What's already out there

  Several existing concepts touch this terrain but serve different purposes. Multiple Discovery describes the phenomenon of independent simultaneous findings but typically treats it as a sociological pattern indicating a field is mature, rather than a mechanism for adjusting individual credit. Hindsight Bias explains why outcomes seem predictable after the fact, but focuses on cognitive psychology within the observer's mind rather than archival evidence about competitors. The Matthew Effect describes how eminent scientists get disproportionate credit, but this is about status accumulation, not the subtraction of credit due to rival proximity. Finally, Historical Determinism argues that discoveries happen when the field is ready, but this usually applies to the timing of the idea itself. It suggests the idea was waiting to be found, but it does not explain the retrospective punishment of the individual discoverer's reputation based on hidden competitors. These concepts describe the environment or the psychology, but not the specific credit-adjustment mechanism you have identified.

  ### 3. Where each one misses

  Each candidate misses your specific point about the valuation split. Multiple Discovery names the event but doesn't explain the credit discount; it often treats both discoverers as equals, whereas you note a demotion. Hindsight Bias is internal to the observer's mind, whereas your observation relies on external facts about rival labs and record survival. The Matthew Effect is about accumulation of advantage, not the subtraction of credit due to hidden rivals. Historical Determinism flattens everyone's contribution equally; it doesn't explain why we still praise the first while whispering they were lucky. The closest fit is a niche within the sociology of priority, but standard literature treats priority as a race won or lost, not as a variable metric of genius dependent on archival survival. Your insight isolates the visibility of the rival as the key variable, not just their existence. Crucially, existing concepts do not capture your observation that the discount stops at the person. The result remains valuable and funded, but the individual is demoted from genius to functionary. This separation between the value of the truth and the value of the discoverer is not accounted for in standard theories of scientific credit.

  ### 4. Verdict

  There is no single standard term for this specific combination of factors. It is a nuanced observation within the sociology of scientific priority. While components exist in the literature on multiple discovery and credit allocation, the specific mechanism of archival visibility dictating individual credit discounting does not have a dedicated label.

  ### 5. Definition and edge cases

  Let's call this Competitor Contingency. It defines credit assignment as dependent on the recoverable evidence of competition. It covers cases where the rival was unknown to the discoverer but known to history. It does not cover cases where the rival causally influenced the discoverer; that is standard priority racing, not contingent credit adjustment. In a race, you know you are running; in Competitor Contingency, you are judged for running alone when someone was actually beside you. It likely does not cover artistic originality, because art is not typically viewed as inevitable discovery waiting to be found; a painting is not ripe in the same way a chemical structure is. Art credit relies on expression, not uncovering pre-existing truths. Crucially, it does cover the record-survival layer. If the rival's notebook burns, the contingency vanishes, and credit restores. The effect stops where the historical record becomes immutable; it is a property of historiography, not just the science itself. It highlights that credit is a narrative construct dependent on evidence survival, not just an objective measure of labor. This means the effect is unstable; new archival findings can retroactively change a genius into a functionary decades later. The boundary is drawn at the point where the rival's presence becomes historically verifiable, regardless of whether the discoverer knew they were there.

  ### 6. My delay idea

  Your delay idea shifts the metric from metaphysics to ethics. Asking would it have happened always yields yes, making it useless for distinguishing credit. Asking how much later introduces utility. If a delay costs lives or stalls progress, the discoverer's value increases regardless of inevitability. This solves the flattening problem by reintroducing stakes. However, it relocates the difficulty to measuring counterfactual time, which is historically impossible to know precisely. It validates your intuition that the current system asks the wrong question, but it replaces an unmeasurable rival proximity with an unmeasurable temporal delay. It is a better philosophical framework, even if historically unverifiable. It moves the debate from who was first to who was most useful, which aligns better with the actual value of science to society.
