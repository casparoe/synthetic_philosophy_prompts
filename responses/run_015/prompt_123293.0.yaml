prompt: |-
  You are a professional philosopher whose research specialism is the philosophy of language and the later Wittgenstein. Please think carefully and at length about what follows. Before you begin writing your answer, spend some time in your own working-out brainstorming the space of candidate principles and the cases that would discriminate between them; discard the ones that fail quickly; and only then write a single well-organised response of roughly 1,300 to 1,600 words, in British English, using my spellings. Please do not give me a bibliography, footnotes, or suggestions for further reading: I have a reading list for the course and access to a library. What I need from you is the argument.

  I am a final-year undergraduate taking an option on Wittgenstein and the philosophy of language, and I am trying to write an essay on Kripke's development of the rule-following considerations in his 1982 book on rules and private language. I do not need you to rehearse the dialectic for me. I have the sceptical paradox in front of me, I understand the move from the plus/quus example to the general claim that no fact about my past usage determines what I mean, and I can recite the difference between a straight solution and a sceptical solution. The problem is that I cannot work out which of my own reactions to surrender. So I want to approach it through cases, in the hope that the pattern of my verdicts will tell me something.

  Two stipulations first. Let quus be the function that agrees with addition whenever both arguments are below 57 and delivers 5 otherwise. Let me introduce a variant of my own, which I shall call blus: it delivers 5 whenever both arguments are below 57 and agrees with addition otherwise. Everyone in the cases below has been drilled on the sign '+' only for pairs of numbers that are both below 57, unless I say otherwise.

  Case 1. Amara, asked for the first time to compute 68 + 57, unhesitatingly answers 125. My verdict: she meant addition, 125 is the correct answer for her, and she got it right. There is a fact of the matter here, and her answer tracks it.

  Case 2. Ben was drilled exactly as Amara was. We later find his old exercise book in which, entirely on his own initiative, he wrote 68 + 57 = 5 and explained to his sister that this is how the big ones work; asked now, he answers 5 and sincerely insists that this is what he always meant. My verdict: he is wrong. 125 was the correct answer for him. His dispositions, his memory and his own testimony all point towards quus and I do not care.

  Case 3. Consider blus rather than quus as the sceptic's candidate. My verdict: blus is not a genuine competitor at all. A hypothesis that gets my own past applications wrong is not a hypothesis about what I meant. I take this to be the one point on which I am completely confident, and I would like to know whether that confidence is legitimate or whether it simply begs the question against a sceptic who is willing to revise the past as well as the future.

  Case 4. An isolated community, with no contact with us, has a textbook that stops at 57 and a practice in which everyone, pupils and teachers alike, answers 5 for any pair involving a number that is 57 or greater; they correct one another, they treat 125 as an error, and they have done this for generations. My verdict: I do not want to say that an entire community is making a mistake every day of its life. I want to say that their sign means something other than addition, or that there is no fact of the matter that they mean addition and are getting it wrong.

  Case 5. Now suppose our own community splits, cleanly and permanently, roughly half and half, at exactly the same boundary: half answer 125, half answer 5, each side regards the other as mistaken, no majority ever forms, and no institutional authority settles it. My verdict, which I suspect is inconsistent with Case 4: there is still a fact. The 125-people are right and the 5-people are wrong, even though nothing in anyone's practice determines it.

  Case 6. A language model has been fine-tuned to do arithmetic. On the overwhelming majority of prompts it returns the correct sum, but on inputs with a leading zero, and on operands above a million, it reliably returns 5. We open it up and find one sub-circuit that plainly computes addition and another, more readily triggered one, that fires on just those formats. My verdicts pull three ways and I cannot settle them. I want to say that the model does not mean anything, since it is not the kind of thing that can; I also want to say that its returning 5 is a mistake and not merely something I dislike; and I do not think that opening it up helps, because describing a circuit as computing addition looks like exactly the move the sceptic re-applies one level up.

  Case 7. A speaker who claims that she has always settled what '+' means by consulting a private mental rule-book, or by an inner ostensive definition in terms of the cardinality of the union of two disjoint sets. My verdict: this contributes nothing, and the challenge simply reappears at the level of the rule-book or of cardinality.

  Case 8. The same puzzle run on a non-arithmetic word, say 'same colour', taught only on red things and then applied to a green one. My verdict: here I feel the pull of 'no fact of the matter' much more strongly than in Case 1, and I cannot articulate why arithmetic should be different. That worries me, because it suggests my confidence in Case 1 is only sociological.

  The best principle I have managed to formulate is this. Call it (T): a speaker S means addition by '+' if and only if addition is the simplest rule that fits S's own actual past applications of the sign, with the actual applications of the sign by the rest of S's linguistic community acting as the tie-breaker among rules that fit S's data equally well; where S's applications diverge from what that combination singles out, S is simply making a mistake; and where the community's own applications are silent or permanently divided, there is no fact of the matter at all.

  Please test (T) against my eight verdicts, repair it where it is vague or where it delivers something I have not noticed, and replace it if it is beyond repair. In particular I want to know what 'simplest' is doing in it, whether simplicity is supposed to be a practice-independent feature of the rule or merely a reflection of what our community happens to find natural, and whose community is the relevant one in Case 4.

  What I would like from you, in order:

  1. A principle, or at most three rival candidates, stated precisely enough that I could apply it to a case of my own without writing to you again.
  2. For each clause of the principle you recommend, the case above that forces it on me.
  3. An honest account of which of my verdicts the principle cannot accommodate, and which one you think I should abandon. Cases 4 and 5 are the pair I cannot hold together, so tell me plainly which gives and what the cost is of giving it up.
  4. Your principle's verdicts on three cases I have not listed: a community that converts wholesale, so that everyone who once answered 5 now answers 125; a lifelong solitary speaker who has a practice but no community at all; and a word which the practice has simply never been applied to a new kind of thing at all, as 'artwork' might once have been applied to a photograph, and as it is now being applied to images generated by a model.
  5. Whether the position I end up with is a straight solution, a sceptical solution, or something that refuses the distinction, and what that position costs me elsewhere in the philosophy of language.
