  INSTITUTE FOR ANTHROPIC CALIBRATION
  Standard Operating Procedure: SOP-AC-044
  Subject: Execution of the Presumptuous-Philosopher Protocol
  Revision: 3.1 (Post-Doomsday)

  1.0 PURPOSE AND SCOPE
  1.1 Objective
  This protocol establishes laboratory standards for measuring the posterior probability of competing cosmological theories using observer-counting instrumentation. Specifically, this document governs the execution of the Presumptuous-Philosopher Scenario (PPS), wherein Theory T1 predicts a universe containing 10^10 observers and Theory T2 predicts a universe containing 10^50 observers.
  1.2 Limitations
  Personnel are advised that metaphysical noise floors often exceed signal strength. Error bars are optional but discouraged by tenure committees. Operators should not expect convergence between theoretical priors and empirical existence.

  2.0 INSTRUMENTATION AND CALIBRATION
  2.1 Competing Devices
  The experiment requires simultaneous deployment of two distinct measurement modules: the Self-Sampling Assumption (SSA) Unit and the Self-Indication Assumption (SIA) Sensor. These devices are not interchangeable.
  2.2 Systematic Error Profiles
  The SSA Unit assumes uniform sampling over a precisely defined reference class. It is prone to "Doomsday Bias," systematically underestimating future observer counts by treating the current moment as statistically typical. The SIA Sensor weights outcomes by total observer count. It exhibits "Presumptuousness Drift," favoring hypotheses with larger populations regardless of prior physical likelihood, often saturating the detector with certainty.
  2.3 Calibration Logs
  Calibration must be performed against known existence. Note: Since existence is binary (1 or 0), calibration constants frequently diverge to infinity. Log all drift in the Marginal Likelihood Notebook. If the SIA Sensor reads >99% confidence on untested theories, replace the weighting filter.

  3.0 EXPERIMENTAL PROTOCOL
  3.1 Reference-Class Specification
  Before powering instruments, the operator must rigidly define the Reference Class (e.g., "Humans," "Sentient Beings," "Observer-Moments").
  **SAFETY WARNING:** Do not run the experiment without fixing the reference class in advance. Mid-experiment adjustment of the reference class to accommodate desired outcomes has caused severe cognitive dissonance and tenure revocation. Drift here invalidates all downstream probability assignments.
  3.2 Blinding Protocols
  Standard double-blind procedures are physically impossible. The observer is inherently coupled to the measurement apparatus. Operators should attempt to look away from their own existence during data acquisition, though efficacy is negligible. Treat self-knowledge as background radiation that cannot be shielded.
  3.3 Replication
  Replication attempts often fail because subsequent experimenters belong to different reference classes than the original team. Inter-laboratory consistency is not expected.

  4.0 DATA ANALYSIS AND RESULTS
  4.1 Instrument Discrepancy
  Upon execution, the SSA Unit and SIA Sensor will yield incompatible predictions for the cosmic constant. The SIA Sensor will assert Theory T2 is one trillion trillion times more likely than T1 based solely on observer capacity. The SSA Unit will report odds near unity, assuming the observer is a random sample from either universe.
  4.2 Falsifiability Status
  Both instruments remain unfalsifiable because every experimenter is necessarily inside the sample. No external vantage point exists to verify calibration. Attempts to exit the system for verification result in immediate data loss (cessation of observation).
  4.3 Conclusion
  If instruments disagree, average the results or publish both as complementary perspectives. Do not attempt to resolve the conflict using empirical evidence; the conflict is the evidence. Submit final report to the Department of Metaphysics for归档 (archiving).
