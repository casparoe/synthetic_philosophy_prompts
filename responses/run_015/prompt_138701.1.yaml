      *   *Check:* Did I address Dennett properly?
      *   *Correction:* Dennett actually argues *for* the narrative view but uses CoG to explain its *reality status*. I need to clarify that distinction. CoG is real but abstract. Narrative is real but constrained. The therapist ignores the constraints.
      *   *Check:* The Wren example is key. Wren has *more* consistency than people. Why? Because the *wiki* acts as an external hard drive for identity. This supports the Grandmother point (family as wiki).
