          *   Create a table or clear list mapping the concepts across the three scenarios (Therapy/Standard, Grandmother, Wren).
          *   Highlight the shifts. E.g., In Therapy, Author=Self. In Dementia, Author=Family. In D&D, Author=Collective.
      *   **Part 2: Where the Mapping Breaks (The Disanalogies):**
          *   *Agency:* Grandma lacks it. Wren is fictional (no pain). You have it but are constrained by biology/history.
          *   *Truth Conditions:* Wren can be retconned. Grandma's past is fixed even if memory isn't. You have physical consequences.
          *   *Continuity:* Wren survives discontinuity because she's a concept. Grandma survives because of love. You survive because of biology + psychology.
      *   **Part 3: Evaluating the Conclusion ("Revision is Cost-Free"):**
          *   This is the crux. The analogy *smuggles* the conclusion.
          *   If Self = Story, and Stories can be edited, then Self can be edited.
