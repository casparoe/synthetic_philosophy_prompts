          4.  Address the three specific "circles" (Grandmother's external maintenance, Wren's authorless consistency, Dennett's Center of Gravity vs. Story).
          5.  Propose a better analogy if needed.

  2.  **Initial Brainstorming & Mapping:**

      *   *Therapist's View:* Self = Story. Implication: You are the author. If the story sucks, rewrite it. No "real" you underneath.
      *   *User's Counter:* Grandmother can't author anymore. Family authors for her. Wren has no author but has consistency.
      *   *Mapping:*
          *   Protagonist = The Person (Grandma, Me, Wren).
          *   Text = The lived life / Character sheet / Wiki entries.
          *   Author = The Agent (Me? Grandma? The Family? The Players?).
