      *   *Economic Link:* Market economies run on *credit* and *reputation* (Future). This aligns with the user's "Shame = Future/Exposure." If the city has a market, it *needs* shame to enforce contracts/reputation. A bureaucrat trying to install Guilt (Past) in a Market (Future) city is fighting the engine.
      *   *Conclusion:* This makes the "culture can choose" idea *weaker*. It suggests the bureaucrat is a tragic figure fighting material reality.

  6.  **Developing the Argument (Taking a Side):**
