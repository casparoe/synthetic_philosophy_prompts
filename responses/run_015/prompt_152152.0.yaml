      *   **Core Project:** A novel about a bureaucrat redesigning legal rituals to induce guilt (act-focused) over shame (self-focused).
      *   **User's Philosophical Stance:** Guilt is morally superior; culture *can* choose between them via institutions (not just sermons).
      *   **Specific Request:** "Tear this up properly." Don't give the usual "shame binds communities" argument. Rank defeaters (fatal to awkward). Identify concessions. Assess falsifiability.
      *   **Specific Theoretical Angle:** Guilt = backward-looking (breach); Shame = forward-looking (exposure). Economic mode might lock temporal orientation.
      *   **Question on Angle:** Does this economic/temporal link make "culture can choose" stronger or collapse it into determinism?
      *   **Constraint:** "Take a side, dont just lay out options."

  2.  **Deconstruct the Philosophical Claims:**
      *   *Claim 1: Guilt is better than shame.* (Standard liberal/individualist view, notably Ruth Benedict, but contested by anthropologists and psychologists).
      *   *Claim 2: Institutions can engineer this shift.* (Social engineering/constructivism).
      *   *Claim 3: Temporal Structure.* Guilt = Past (act); Shame = Future (exposure/reputation). *Critique:* This is a novel interpretation. Usually, shame is seen as present-focused (how I am *now* in the eyes of others) or past-focused (I *did* this). The user's "forward-looking at exposure" is interesting but vulnerable.
      *   *Claim 4: Economic Mode locks temporal orientation.* (Materialist determinism).
      *   *Claim 5: Culture can choose.* (Agency vs. Structure).

  3.  **Brainstorming Defeaters (The "Tear Up" Phase):**
      *   *Defeater 1: The Phenomenological Entanglement.* You can't actually separate guilt and shame in the human psyche. They co-occur. Legal rituals targeting one will inevitably trigger the other. If the bureaucrat tries to isolate guilt, they might just create "shame about feeling guilt" or "guilt about being shamed."
      *   *Defeater 2: The Enforcement Problem.* Guilt requires internalization. Shame relies on external surveillance. A legal system is inherently external. To make law produce *guilt*, you need to penetrate the conscience. But law operates on behavior. To enforce guilt, the state must become totalitarian (policing thoughts/intentions), which ironically produces shame (fear of exposure).
      *   *Defeater 3: The Economic Determinism Trap.* If the user's new theory (economic mode locks temporal orientation) is true, then the bureaucrat's project is doomed from the start. If the city is capitalist/market-based, it requires future-oriented risk/reputation (shame). If it's subsistence/traditional, it might be past-oriented. If economics dictates the emotion, the bureaucrat is a donkey chasing a carrot on a stick.
      *   *Defeater 4: The Function of Shame in Justice.* Guilt allows for atonement ("I did bad, I pay"). Shame allows for exclusion ("I am bad, I leave"). Some crimes *require* shame to protect the community (e.g., predatory behavior). Pure guilt might allow sociopaths to "check the box" and reoffend.
      *   *Defeater 5: The Definition Drift.* If the bureaucrat succeeds, have they just redefined shame as guilt? If the ritual makes you feel bad about the act, but the *reason* is social standing, is it guilt? This threatens falsifiability.

  4.  **Ranking the Defeaters:**
      *   *Fatal:* The Enforcement/Totalitarian Paradox. Law is external; Guilt is internal. Bridging them requires invasive power that creates shame.
      *   *Fatal:* The Economic Determinism Contradiction. If economics locks temporality, the bureaucrat has no agency.
      *   *Severe:* Phenomenological Entanglement. You can't surgically separate the emotions.
      *   *Awkward:* The Sociopath Loophole. Guilt systems are gameable.
      *   *Awkward:* Definitional Drift.

  5.  **Addressing the Temporal/Economic Angle:**
      *   User says: Guilt = Past, Shame = Future (Exposure).
