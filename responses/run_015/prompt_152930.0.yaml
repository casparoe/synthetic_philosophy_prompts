      *   *Reply A: Realization-Sensitive Functional Roles.* Maybe the functional role *includes* the substrate? (e.g., "damage to carbon fibers" vs. "damage to silicon").
          *   *Problem:* This undermines Multiple Realizability. If the role specifies the substrate, it's not multiply realizable in the strong sense. It turns functionalism into a species of physicalism.
      *   *Reply B: Two-Factor Theory (Internalism + Externalism or Functional + Phenomenal).* Maybe mental states have a functional component AND a phenomenal/substrate component.
          *   *Problem:* This is essentially admitting functionalism is incomplete. It saves the phenomena but surrenders the claim that functional role *exhausts* mental state identity.
