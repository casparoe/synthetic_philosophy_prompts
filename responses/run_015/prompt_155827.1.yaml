prompt: |-
  I am a high school student with concurrent coursework in AP History and computer science; I have used Git and distributed version control regularly in collaborative programming projects, so I am fluent in its vocabulary of commits, branches, merge conflicts, rebasing, force-pushing, and orphaned branches. Could you restate the Whig interpretation of history—the tendency to read the past as an inevitable, morally directed progression toward present liberal institutions—systematically within that vocabulary, treating it not as a loose analogy but as a formal translation? I want to know how the Whig historian's selection of a single "main line" of development corresponds to maintaining a master branch; whether abandoned historical possibilities can be rendered as stashed or deleted branches that never merged; and how the implicit moral evaluation of the present maps onto repository mechanics. Then provide the residue report: which historiographical claims translate cleanly, which survive only with distortion (for instance, treating contingent social struggles as deterministic merge conflicts resolved automatically rather than through human agency), and which have no counterpart at all—particularly the normative judgment that the current state of affairs represents progress rather than merely the commit that happened to survive? Finally, does the residue suggest that Whig history is just poor repository hygiene—an abuse of rebase and force-push—or does Git's framework lack the normative and teleological vocabulary required to express what the historians are actually arguing about?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Target Audience:** High school student, AP History + CS background, fluent in Git (commits, branches, merge conflicts, rebase, force-push, orphaned branches).
      *   **Task:** Restate the Whig interpretation of history using Git vocabulary as a *formal translation*, not just a loose analogy.
      *   **Specific Questions to Address:**
          *   Whig "main line" $\rightarrow$ `master`/`main` branch?
          *   Abandoned possibilities $\rightarrow$ stashed/deleted/orphaned branches?
          *   Moral evaluation of present $\rightarrow$ repository mechanics?
          *   **Residue Report:** What translates cleanly? What distorts? What has no counterpart (especially normative judgment/progress)?
          *   **Conclusion:** Is Whig history just poor repo hygiene (abuse of rebase/force-push), or does Git lack the vocabulary for teleology/normativity?

  2.  **Deconstruct the Whig Interpretation of History:**
      *   *Core Tenet:* History is a story of progress from darkness to light, leading inevitably to the present (specifically liberal democracy/constitutionalism).
      *   *Mechanism:* Selects events that contribute to this outcome; ignores or disparages those that don't.
      *   *Teleology:* The end goal (the present) justifies the means and determines the value of the past.
      *   *Critique:* It ignores contingency, complexity, and the validity of lost causes. It assumes inevitability.

  3.  **Map Whig Concepts to Git Concepts (The Formal Translation):**
      *   *Time:* Commit hash order (topological sort).
      *   *The Present:* `HEAD` of the `main` branch.
      *   *The "Right" Path:* The linear history of `main`.
      *   *Progress:* The accumulation of commits on `main`.
      *   *Whig Historian:* The Maintainer/Repo Owner with write access.
      *   *Selection Bias:* `git rebase -i` (interactive rebase) to squash, reorder, or drop commits.
      *   *Inevitability:* `git push --force` to rewrite history so it *looks* like it always meant to be this way.
      *   *Lost Alternatives:* Orphaned branches, dangling commits, `git reflog` entries that expire.
      *   *Conflict Resolution:* Merging only when it aligns with `main`; rejecting PRs that diverge too much.

  4.  **Drafting the Translation (Section by Section):**

      *   *Introduction:* Acknowledge the user's expertise. Set the stage for a rigorous mapping.
      *   *The Master Branch (`main`):* This is the Whig narrative. It's the "successful" line.
      *   *Commit Selection:* Whigs drop "bad" commits (regressive events). In Git, this is `rebase --drop`.
      *   *Inevitability:* This is the tricky part. In Git, history is mutable *before* push, but immutable *after*. Whigs treat the past as immutable *in meaning*. To simulate Whig inevitability, one must use `filter-branch` or `rebase` to make the history linear and clean, erasing the messiness.
      *   *Moral Evaluation:* In Git, `HEAD` is just the latest state. It has no moral weight. Whigs assign moral weight to `HEAD`.

  5.  **Developing the Residue Report (The Critical Analysis):**
      *   *Clean Translations:*
          *   Selection bias = Cherry-picking/Dropping commits.
          *   Teleology = `HEAD` as the target.
          *   Marginalization = Orphaned branches.
      *   *Distorted Translations:*
          *   *Agency:* Git merges are algorithmic (mostly). Historical merges are human struggles. A merge conflict in Git is syntax; in history, it's war/ideology.
          *   *Contingency:* Git history is deterministic once pushed. Whig history claims the past *had* to happen. Real history is stochastic.
      *   *No Counterpart (The Null Set):*
          *   *Normativity:* Git doesn't know "better." It only knows "different" or "conflicted." `main` isn't morally superior to `dev`; it's just the default.
          *   *Progress:* A commit isn't "progress"; it's a change. Whig history requires a metric of value that Git lacks.

  6.  **Addressing the Final Question (Hygiene vs. Vocabulary):**
      *   *Is it poor hygiene?* Yes, in a way. Rewriting shared history (`force-push`) is frowned upon. Whig history rewrites the shared past.
      *   *Does Git lack vocabulary?* Yes. Git is structural/positional. History is semantic/normative. Git can model the *structure* of the Whig argument, but not the *truth claim* of progress.
      *   *Synthesis:* Whig history is like a repo where the maintainer force-pushes a sanitized `main` branch and deletes all feature branches, claiming `HEAD` was the only possible state. But Git itself remains agnostic.

  7.  **Refining the Tone:**
      *   Must be respectful of the student's knowledge (no explaining what a branch is).
      *   Must be intellectually rigorous (AP History level).
      *   Must avoid trivializing the analogy (as requested, "not as a loose analogy").
      *   Use precise Git terminology (`reflog`, `detached HEAD`, `fast-forward`, `squash`).

  8.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I explain *why* `rebase` is the key Whig tool? *Correction:* Emphasize that `rebase` rewrites history to look linear, hiding the messy reality of parallel development.
      *   *Check:* Did I address the "moral evaluation"? *Correction:* Explicitly state that Git has no `--moral-flag`.
      *   *Check:* Is the distinction between "contingency" and "determinism" clear? *Correction:* Use the concept of `cherry-pick` vs. natural merge.
      *   *Check:* Ensure the conclusion answers the specific binary posed (Hygiene vs. Vocabulary). *Decision:* It's both, but primarily a vocabulary limitation regarding normativity.

  9.  **Final Polish:** Organize with clear headings. Ensure the "Residue Report" is distinct. (Proceed to generate output based on these thoughts.)

  *(Self-Correction Note during final output generation)*: Make sure to explicitly mention `git gc` (garbage collection) as the final erasure of alternative histories, analogous to collective forgetting.

  10. **Final Output Structure:**
