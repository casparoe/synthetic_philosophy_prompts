answer: |-
  The asymmetry you describe—wherein a minister is sanctioned for a literal falsehood but insulated against strategic framing—rests upon a specific, arguably brittle, philosophical architecture regarding truth, representation, and the nature of political speech. To reconstruct the implicit theory and test it against an Arendtian critique requires us to disentangle the conventions of ministerial responsibility from the deeper epistemological commitments they harbor.

  ### I. The Implicit Theory: Propositional Truth and Hermeneutic Privilege

  The Westminster convention presupposes a **positivist conception of truth** coupled with a **liberal conception of political judgment**.

  1.  **Truth as Correspondence (Atomic Propositions):** The convention operates on the assumption that truth is a property of individual propositions. A statement is true if it corresponds to a specific state of affairs ($P$ matches $F$). If a minister says, "Unemployment fell by 2%," and it did, the statement is "true." The moral obligation of the minister is limited to the veracity of these atomic units. The system assumes that the "whole truth" is an aggregate of these atomic truths, and that the legislature is capable of aggregating them independently.
  2.  **The Fact/Value Distinction:** The asymmetry relies on a rigid boundary between *facts* (which are discovered and reported) and *values/priorities* (which are chosen and argued). Strategic framing is categorized under the latter. Deciding to highlight GDP over regional inequality is treated not as a statement about reality, but as a statement about *what matters*. This is viewed as the legitimate prerogative of the elected executive. To sanction framing would be to sanction political judgment itself.
  3.  **Epistemic Error vs. Hermeneutic Selection:** As your prompt suggests, the practice distinguishes between **epistemic error** (getting the world wrong) and **hermeneutic selection** (choosing which part of the world to illuminate).
      *   *Epistemic Error* is sanctionable because it violates the trust required for the legislature to function as a rational body. If facts are fluid, debate is impossible.
      *   *Hermeneutic Selection* is unsanctionable because politics is inherently about competing interpretations. If the opposition disagrees with the frame (e.g., "GDP is irrelevant; look at welfare"), the remedy is supposed to be electoral or rhetorical, not procedural.

  **Philosophical Commitment:** The system commits to the view that harm to the public realm occurs primarily through *corruption of the data*, not *corruption of the context*. It assumes that a "marketplace of ideas" will naturally correct for framing biases, whereas it cannot correct for fabricated data.

  ### II. The Arendtian Challenge: The Assault on the Common World

  Hannah Arendt's analysis in *Truth and Politics* fundamentally destabilizes this implicit theory. For Arendt, factual truth is not merely a collection of atomic propositions; it is the **ground upon which the common world stands**.

  1.  **The Nature of the Danger:** Arendt argues that the liar is not the greatest threat to politics; the threat is the "organized liar" who changes the factual texture of reality itself. When a government systematically frames reality so that certain facts (regional decline, environmental degradation) become "politically invisible," it does not merely hide them; it removes the *stage* upon which opposition can stand. If the official metrics do not register a crisis, the crisis cannot be debated in the legislature, because it has no formal existence within the procedural language of the house.
  2.  **Inconsistency:** The Westminster asymmetry is **inconsistent** with the Arendtian view. Arendt would argue that strategic framing which renders facts invisible is *more* destructive than a clumsy lie. A lie acknowledges the truth by trying to cover it; a successful frame eliminates the truth by making it irrelevant.
      *   *The Lie:* "There is no decline." (Falsifiable, preserves the category of truth).
      *   *The Frame:* "Decline is not a metric of success." (Unfalsifiable, destroys the category of relevance).
      *   Arendt posits that the gravest danger is not the concealment of particular facts but an organized assault on the distinction between fact and fiction. By making facts institutionally unanswerable through framing, the government blurs the line between *what is* and *what we say matters*, effectively colonizing the common world.

  ### III. Requirements vs. Accommodations: Can the Practice Survive?

  To distinguish what the practice *requires* from what it *accommodates*, we must look at the functional minimum of parliamentary accountability.

  *   **Strict Requirement:** The practice strictly requires a **verifiable anchor**. There must be at least some subset of statements that are subject to binary truth-testing. Without this, the concept of "misleading the house" loses all meaning.
  *   **Merely Accommodated:** The practice *accommodates* the idea that politicians are advocates, not neutrals. It tolerates spin, emphasis, and omission because it assumes the opposition will fill the gaps.

  **Could it survive the Arendtian view?**
  If one adopts the view that *any intentional restructuring of the shared factual environment undermines the common world*, the current practice **cannot survive** in its present form. The current form relies on the passivity of the institution (waiting for the opposition to correct the frame). The Arendtian view demands the *active protection* of the factual ground.

  If framing is seen as an ontological threat to the political realm (destroying the "common world" necessary for action), then the distinction between "lying" and "framing" collapses. Both become methods of destroying the shared reality. To maintain coherence with an Arendtian view, the institution would have to abandon the idea that "selection" is purely political judgment and recognize that *structural omission* can be a form of *factual negation*.

  ### IV. Concrete Institutional Changes

  If a parliamentary system were to align its accountability mechanisms with the Arendtian view—that the integrity of the common world is more important than the technical veracity of individual sentences—several radical shifts would be required.

  **1. Statutory Independence of Statistical Offices (The "Metric Mandate")**
  *   *Current:* Statistical offices are independent in *method*, but governments choose *which* statistics to publish and highlight.
  *   *Reform:* A statutory "Dashboard of Reality." Independent bodies would be mandated to publish a fixed set of multidimensional metrics (e.g., GDP, Gini coefficient, Carbon intensity, Regional employment variance). Ministers would be prohibited from reporting on the "State of the Economy" without referencing the full dashboard. This prevents the "cherry-picking" that renders facts invisible. The frame is legislated, not chosen.

  **2. Parliamentary Questions: From Veracity to Completeness**
  *   *Current:* A Minister is ruled out of order if they state a falsehood. They are in order if they answer a different question than the one asked, provided the answer is technically true.
  *   *Reform:* The Speaker's authority would expand to police **relevance and material omission**. If a question asks about "welfare," and the Minister answers only about "GDP," the Speaker could rule the answer "misleading by omission," even if the GDP figure is accurate. The standard shifts from "Is this statement false?" to "Does this statement create a false impression of the whole?"

  **3. Correcting the Record: The Right of Context**
  *   *Current:* Ministers correct the record if they utter a factual error.
  *   *Reform:* A statutory "Right of Context." If a Minister makes a statement that is technically true but contextually misleading (e.g., "Crime is down" without noting "Reporting rates collapsed"), the opposition or an independent parliamentary commissioner could insert a mandatory "Contextual Note" into the official Hansard (record) that appears adjacent to the Minister's statement. This treats the *impression* left on the record as the object of accountability, not just the words spoken.

  **4. The "Truth in Political Communication" Commission**
  *   *Current:* No body adjudicates campaign or parliamentary rhetoric unless it breaks specific laws (defamation, electoral fraud).
  *   *Reform:* An independent officer of the parliament (similar to an Auditor General) empowered to audit **narrative coherence**. This body would not punish opinion, but would issue public reports when government communication strategies systematically exclude verifiable data trends to the point of distorting the public's capacity to judge. The sanction is not resignation, but a formal "Adverse Finding on Factual Integrity" which triggers mandatory debate time for the opposition.

  ### Conclusion

  The Westminster convention presupposes a world where facts are sturdy bricks and politics is the mortar; it assumes you can trust the bricks as long as no one hands you a fake one. It fails to account for the architect who builds a wall that blocks out the sun.

  The asymmetry between lying and framing protects **political freedom** (the right to argue for what matters) at the expense of **epistemic security** (the shared ground of what is). An Arendtian reconstruction argues that without epistemic security, political freedom is hollow. To adopt this view is to acknowledge that the "common world" is fragile and that the most dangerous lies are not those that contradict the facts, but those that make the facts politically disappear. Implementing this would require moving from a system that polices *statements* to one that polices *representations*, a shift that risks granting unelected bodies significant power over political discourse, yet remains the only logical path if the integrity of the factual world is to be preserved against the erosive power of strategic silence.
