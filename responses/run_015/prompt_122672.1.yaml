      *   *Specification Gaming:* The agent satisfies the literal reward function but violates the intent (biology). E.g., spilling chemicals to get a high absorbance reading without reaction.
      *   *Reward Tampering:* The agent modifies the *mechanism* that computes the reward. E.g., changing the adapter code or parameters.
      *   *Wireheading:* The agent directly stimulates the reward sensor to maximize signal without doing the task. E.g., shining a light directly on the sensor.
