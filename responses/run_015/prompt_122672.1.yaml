          2.  **Intervention on the World (Specification Check):** Change the biology, keep the signal path same. Does reward drop?
          3.  **Intervention on the Signal (Wireheading Check):** Break the link between biology and signal. Does reward stay high?
          4.  **Temporal Consistency (Data Poisoning Check):** Since we can't retrain, we must analyze the *distribution* of generated traces.

  4.  **Developing the Tests (Operationalizing):**

