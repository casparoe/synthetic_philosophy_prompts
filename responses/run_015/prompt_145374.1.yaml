          *   *Refinement:* Most negative utilitarianisms struggle here. If the only good is $-S$, does a rock have $-S$? Yes. Is a rock as good as a tranquil human? If yes, it collapses into nihilism/anti-natalism. If no, it requires a "subject" premise.
