  6.  **Analyze Boundary Conditions (Negative Hedonism vs. Ascetic Nihilism)**
      *   *Pure Negative Hedonism:* Suffering is bad, Pleasure is good (but maybe secondary). Tranquilism says Pleasure is *neutral*.
          *   *Collapse Point:* If one admits that the *relief* from suffering feels like pleasure, and values that feeling, one slides into Negative Hedonism.
          *   *Distinction:* Tranquilism values the *zero point*, not the *slope* towards it.
