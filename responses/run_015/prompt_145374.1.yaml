      *   *Core Thesis Implication:* Since achievement ($A$) and satisfied desire ($SD$) have *no intrinsic weight*, the only metric is the integral of craving/suffering over time.
      *   *Direct Entailment:* If Path B involves *more* cumulative craving/suffering during the "striving" phase than Path A, Path A is strictly better. If the cumulative absence is identical, they are equal. Achievement itself adds nothing.
