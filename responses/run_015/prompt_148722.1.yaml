answer: |-
  Here is the example, then the verdict.

  **The Example: PTSD and the Civil War Soldier**
  Consider the retroactive diagnosis of Post-Traumatic Stress Disorder (PTSD) in American Civil War soldiers. In the 1860s, clinicians diagnosed "Soldier's Heart" or "nostalgia." Today, modern psychiatrists often look at those same case files and symptom descriptions and reclassify them as PTSD. The clinicians rewrite the historical record: the soldier didn't have "Soldier's Heart," he had PTSD. The category of PTSD expands backward in time to swallow the old diagnosis. Crucially, the soldiers are dead. They never knew the label "PTSD." They never changed their behavior based on it. The only thing that changed was the ink on the archive and the conceptual lineage of the disorder.

  **The Verdict**
  I am taking your friend's side. **This is not a looping effect.** It fails Hacking's model.

  **The Defense**
  Hacking's theory of looping effects rests on a single, non-negotiable distinction: the difference between *interactive kinds* and *indifferent kinds*. Rocks are indifferent kinds; if you relabel a granite rock as "marble," the rock does not care and does not change. People are interactive kinds; if you label a person "depressed" or "queer" or "autistic," they hear that label, process it, and potentially change their behavior, self-conception, or narrative in response. That reaction is the engine of the loop.

  Your retroactive example removes the engine. When a clinician reinterprets a dead soldier's diary as "PTSD," the soldier cannot react. There is no feedback from the classified to the classifier. The soldier does not become a different kind of person because they are no longer a person capable of becoming. What you are describing is not a loop; it is **retroactive construction** or **historical revisionism**. It is a change in *our* knowledge (epistemology), not a change in *the people* (ontology).

  If you accept your version as a "looping effect," you dilute Hacking's entire point. Hacking's insight was political and ethical: he wanted to show that psychiatric patients are not passive objects of science. They are active participants who talk back to the diagnosis. If you allow loops to happen without the patient's interaction, you turn patients back into passive objects—like rocks—that can be relabeled by experts without their consent or awareness. You erase the agency that Hacking fought to highlight.

  Your intuition is sharp—you correctly identified that classifications change history—but calling it a "loop" misidentifies the mechanism. A loop requires a circuit. If the wire is cut (because the subject is dead or unaware), the current doesn't flow. It's just a one-way imposition of a new label onto an old silence. That is power, but it isn't a loop.
