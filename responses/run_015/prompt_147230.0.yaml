answer: |-
  This is a sharp distinction. You have correctly identified a fault line that often gets plastered over in introductory summaries. The separation between **Modal Inertness** (contingency of connections) and **Productive Inertness** (lack of created agency) is not just verbal; it marks the difference between a Humean regularity theory and a robust theological occasionalism.

  Here is the argumentative breakdown you asked for, sticking to American English and minimizing name-dropping.

  ### 1. Is the "Scripted-Habit" Model Occasionalism?

  You asked what is at stake in the definition. This is partially a verbal dispute, but the load-bearing issue is **ontological dependency**.

  Standard occasionalism (of the Ash'arite variety) usually combines two claims:
  1.  **Causal Occasionalism:** Creatures lack productive power (your Productive Inertness).
  2.  **Existential Occasionalism:** Creatures lack persistence. They must be re-created at every instant to continue existing.

  Your "Scripted-Habit" model (God writes the timeline at $t_0$ and withdraws) accepts Causal Occasionalism but rejects Existential Occasionalism. In your model, the cotton persists through time on its own, it just doesn't *do* anything.

  **The Load-Bearing Definition:**
  For the specific argument about miracles and the critique of the philosophers, **Causal Occasionalism (Productive Inertness) is the load-bearing claim.**

  Why? Because the opponent (the Aristotelian philosopher) claims that natures have inherent powers that *necessitate* effects. Al-Ghazālī's primary goal is to break that necessitation to protect divine omnipotence. If the fire has no power to burn, the philosopher is defeated, regardless of whether God is actively willing the fire's existence at $t_1$ or just letting it coast on a script written at $t_0$.

  However, if you press the metaphysics harder, the Scripted-Habit model collapses into Deism. If God withdraws, and the world continues, the world has some independent ontological footing. Classical occasionalists argue that *existence itself* is a continuous gift. If you deny that, you grant creatures a kind of power (the power to persist), which undermines the total dependency required by the theology.

  **Verdict:** The Scripted-Habit model is "Causal Occasionalism" but not "Full Occasionalism." For your specific questions about miracles and causation, it functions effectively as occasionalism because it preserves Productive Inertness. The definition that matters is the one that denies created *agency*, not necessarily the one that mandates moment-by-moment *sustenance*, though the latter is usually argued to be the ground for the former.

  ### 2. Which Claim Does the Miracle Argument Need?

  You asked if (1) Modal Inertness is enough, or if (2) Productive Inertness is doing extra work.

  **Argument:** The miracle argument *requires* (2).

  If you only have (1) (Modal Inertness), you have established that the connection between fire and burning is contingent. However, you have left open the possibility that the fire *does* have a real power to burn, it just isn't a *necessary* power.
  *   **Scenario A (Only 1):** Fire has a disposition to burn. Normally it succeeds. In the miracle, God overrides this disposition.
  *   **Scenario B (1 and 2):** Fire has no disposition. God usually creates burning alongside fire. In the miracle, God creates fire without burning.

  **Why (1) is insufficient:**
  If Scenario A is true, the miracle becomes a contest of powers. The fire is "trying" to burn (metaphorically or literally), and God is "stopping" it. This implies a friction between created nature and divine will. It suggests that created natures have a genuine causal weight that God must counteract. For a strict monotheist, this compromises omnipotence. It suggests the fire has *some* ownership of the effect.

  If Scenario B is true, there is no contest. The fire is inert. There is nothing to override. The miracle is not God defeating the fire's power; it is God simply choosing a different pattern of events.

  **Steelmanning (1):**
  A proponent of (1) might argue: "We don't need to strip the fire of all power. We just need to say its power is subordinate. As long as God *can* override it, omnipotence is safe."
  **Counter:** This fails because it concedes the definition of "nature." If the fire has a real power to burn, then "burning" is partially explained by the fire. If the goal is to say *all* explanation terminates in God, (1) leaves a residue of explanation in the creature. (2) cleans the slate.

  ### 3. What Work Does "Miracle" Do Under (2)?

  This is your strongest intuition. If every event is a direct divine act, is "miracle" just statistical rarity?

  **The Argument:**
  Yes, under (2), "miracle" becomes an epistemic category, not an ontological one. Ontologically, the burning of the cotton and the saving of Abraham are identical in status: both are direct creations of God.

  The distinction rests entirely on **Habit** (*ʿāda*).
  *   **Ordinary Event:** God acts in accordance with His established habit.
  *   **Miracle:** God acts in breach of His established habit.

  **Is this Humean?**
  Structurally, yes. It is a regularity theory of laws, where the "law" is God's consistent policy. Your intuition about a "prior over God's policy" is correct regarding the *epistemology*. We learn what is "normal" by induction. When the induction fails, we call it a miracle.

  **Where the Analogy Might Mislead:**
  In a Humean system, the regularity is brute. There is no "policy." In the occasionalist system, the regularity is voluntary. This matters for the *expectation* of the miracle.
  *   **Hume:** You can't expect a miracle because there's no agent to intend it.
  *   **Occasionalist:** You can expect (or hope for) a miracle because you can appeal to the Agent's will (e.g., through prophecy or prayer).

  **Does the word "miracle" lose its bite?**
  It loses its *metaphysical* bite (it's not a violation of natural law, because there are no natural laws between creatures). But it retains its *significatory* bite. A miracle is a "sign." Because the habit is broken, it signals a specific divine message. If the fire burned normally, it signals "God maintains the world." If the fire does not burn Abraham, it signals "God protects this prophet." The work "miracle" does is semiotic, not mechanical.

  ### 4. Interventionist Causation Under (2)

  You asked about the interventionist account (manipulate X to see if Y changes) and causal graphs.

  **The Argument:**
  The causal graph survives perfectly as a **compression of the divine policy.**

  If God's habit is consistent (Fire + Cotton $\rightarrow$ Burning), then the intervention "Place fire near cotton" is a reliable method to achieve "Burning."
  *   **Metaphysical Truth:** God creates the burning.
  *   **Pragmatic Truth:** The fire is the indicator/condition for God creating the burning.

  **The Thermostat Analogy:**
  Your thermostat analogy is spot on and should be pushed harder.
  *   **User:** "I turned up the heat."
  *   **Engineer:** "No, you closed a circuit which signaled the boiler to ignite."
  *   **Occasionalist:** "No, God created the heat upon the occasion of your closing the circuit."

  Does the user's statement ("I turned up the heat") become false? No. It is true at the level of the interface. The occasionalist claims the "interface" (the created world) has no backend processing power; it's all server-side (divine will). But the UI still works.

  **Interventionism Collapsed?**
  Interventionism requires that if I wiggle X, Y wiggles.
  *   **Standard View:** X transmits the wiggle to Y.
  *   **Occasionalist View:** God sees X wiggle and wiggles Y in response (according to habit).

  The observable data is identical. The causal graph $X \rightarrow Y$ remains a valid map of the *correlations* mandated by the habit. It fails only as a map of *ontological production*.

  **Steelanning the Counter:**
  A critic might say: "If X does nothing, why is it in the graph? Why not just map God $\rightarrow$ Y?"
  **Response:** Because we don't have access to the "God" node in our daily variables. We only have access to created nodes. To navigate the world, we must map the correlations between created nodes. The graph is a tool for creatures, not a description of ultimate reality. An occasionalist can use causal language instrumentally without committing to it metaphysically.

  ### Summary of the "Work" Being Done

  1.  **Scripted-Habit:** It counts as occasionalism for the purpose of denying creaturely power, but fails the "continuous creation" doctrine often attached to it. The load-bearing definition is **Productive Inertness**.
  2.  **Miracle Argument:** Needs **(2) Productive Inertness**. (1) leaves too much agency in the creature, creating a competition with God that (2) eliminates.
  3.  **Meaning of Miracle:** Becomes a **breach of habit** rather than a breach of law. It is Humean in structure (regularity) but Volitional in ground (policy). The "prior" intuition is epistemically sound.
  4.  **Interventionism:** Survives as **instrumental compression**. Causal graphs map the UI of the world, not the backend code.

  **Final Verdict on Your Distinction:**
  You are right that (1) and (2) are distinct. Many readers assume (1) implies (2), but it doesn't logically (you could have contingent connections between real powers). However, Al-Ghazālī's project requires (2). If he stops at (1), he has only proven that the world is unpredictable; if he goes to (2), he has proven that the world is dependent. The "extra work" (2) does is secure total divine sovereignty, not just the possibility of exceptions.
