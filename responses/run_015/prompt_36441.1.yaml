      *   This is the classic **Wrong Kind of Reasons (WKR)** problem in meta-ethics and epistemology.
      *   The distinction needed is between **Object-Given Reasons** (Right Kind) and **State-Given Reasons** (Wrong Kind).
      *   *Object-Given:* Facts about the object of the attitude (Mom's suffering is painful/bad; Moon is rock/not cheese).
