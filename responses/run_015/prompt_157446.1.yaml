  hey — I'm a TA for a graduate seminar on higher-order evidence that meets tuesday mornings, and the professor has this habit where he writes a case on the board, then writes his verdict under it in green marker, and flatly refuses to ever state a general principle ("the cases are the theory", he says). I've been keeping a list so I can try to reverse-engineer him, and next week I want to bring in a case of my own and see where he lands, so I'd like to predict him first. His verdicts so far, compressed: (1) you work through a proof while fairly drunk, conclude it's valid, sober up, can't reconstruct it — defeat, drop to roughly even odds, and it is *not* OK to keep a high credence while conceding the reasoning was drunk; (2) you're given a drug that a well-run study shows impairs performance on probabilistic puzzles, and you're doing a probabilistic puzzle — defeat, down to about 0.55, same remark about not just tacking on a second-order worry; (3) same drug, but the study says it only touches probabilistic reasoning and you're doing a propositional-logic proof — no defeat, stay at 0.95; (4) an epistemic peer who has tracked you in accuracy on this exact topic disagrees on a hard metasemantics claim — split the difference, about 0.6, and again keeping 0.9 while conceding she's your equal is not allowed; (5) same as 4 except you also learn she's just been given the logic-impairing drug, and you have nothing but your own reasoning — no defeat, the disagreement doesn't move you at all; (6) you learn that researchers using your exact statistical technique are prone to a known error, but a later replication finds the error is rare in the subcase your analysis falls under — partial defeat, 0.9 down to about 0.75, and here he added unprompted that keeping 0.9 while conceding you're not in a position to claim knowledge is "not irrational" either; (7) you learn your evidence base looks one-sided only because an assistant dropped half the dissenting studies from your folder, but he dropped them at random, not because of their content — no defeat, no adjustment at all; (8) you learn from a fully trusted source that people in your subfield with your methodological commitments are wrong about 40% of the time when they sit at 0.95 on claims of this kind, with nothing specific about you — partial defeat, around 0.7, and again "either lowering or staying put while conceding the second-order thing is fine".

  my case: you've spent two hours working carefully through a large mixed evidence base (some statistical, some testimonial) and settled on p at 0.85 with detailed notes, and you can't redo it because a decision is due in an hour. Then, from a source you fully trust, you learn three things: (i) a large well-run study found that people doing exactly this kind of multi-step evaluation while mildly sleep-deprived — and you were — are just as accurate as rested people, no measurable effect on accuracy; (ii) the same study found their confidence is inflated by about ten points; (iii) a follow-up found that when sleep-deprived evaluators are told (i) and (ii) and asked to re-set their confidence, they over-correct and end up below the level their accuracy supports. You also can never tell from the inside whether you're sleep-deprived. So the question for him is: what should your credence in p be now; is staying at 0.85 while conceding that your confidence is miscalibrated irrational (is that epistemic akrasia, and is it OK here); and does it change anything that the first-order process is unimpaired and only the attitude is off?

  what I want from you: the two or three or four distinct rules that fit all eight of his verdicts (call them what you like, and please don't pin them to named philosophers — I can do that myself, and I don't want to argue about who said what), what each predicts about my case specifically — a number, whether revision is required or merely permitted, whether retention at 0.85 counts as akrasia and whether it's rationally fine — which one you'd actually bet on and why, and which further case would separate the rules mine doesn't. I was going to re-run it with (iii) flipped so that the told subjects correct well rather than over-correct; tell me whether that's the right discriminator or whether something else pulls the rules apart more cleanly. Also flag if my case is ill-posed in some way that would let him dodge it. Oh, and one more thing: if he thinks the cases are the theory, I'd also like one sentence on what he should write in green marker under mine given what he's written before, separate from what I'd write.

