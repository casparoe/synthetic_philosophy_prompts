      *   If I sample from *all objects*, finding a non-black non-raven removes a potential counter-example from the pool. It confirms.
      *   If I sample from *non-black objects*, finding a non-raven confirms.
      *   Dave is likely confusing sampling methods. I need to arm the user to handle this. The finite case *preserves* the paradox but makes the math tractable. It doesn't dissolve it, it quantifies the "tiny evidence."
