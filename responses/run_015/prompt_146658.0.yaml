          *   *Risk:* Calling it "more numerous" invites confusion because "number" usually implies cardinality in infinite contexts. Better to say "contains more" or "is a proper superset."

      *   **Does (6) do work?**
          *   Yes. It shields (1) from empiricist critiques. It allows (1) to stand even if (5) says we can't physically instantiate it.

  5.  **Drafting the Audit:**

