      *   (2) Cantor's definition of cardinality. Standard.
      *   (3) This is the "Part-Whole Principle" vs. Cantor's Principle. Holding both requires distinguishing *cardinality* from *measure* or *density* or *inclusion*. This is philosophically defensible (e.g., Euclidean vs. Cantorian size).
      *   (4) Hilbert's Hotel is a standard illustration of (1) and (2). It describes a *state* transition, not necessarily a *process*.
