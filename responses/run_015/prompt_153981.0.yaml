      *   (8) Bayesianism collapses.

  3.  **Initial Brainstorming & Diagnosis:**
      *   This is the classic "Problem of Old Evidence" (Glymour, 1980).
      *   The core tension is between *logical omniscience* (standard Bayesian assumption) and *human cognitive limitations* (learning logical connections takes time).
      *   Premise (2) is the usual suspect. If $E$ is known, $P(E)=1$. If $P(E)=1$, $P(H|E) = P(H)$.
      *   However, confirmation isn't just about $P(H|E)$ vs $P(H)$ *now*. It's about the *process* of coming to believe $H$.
      *   The user's suspicion is spot on: The confirmation comes from learning the *connection* ($H \rightarrow E$), not learning $E$ itself.
      *   Alternative: Counterfactual priors (What would I have believed *before* I knew $E$?).
