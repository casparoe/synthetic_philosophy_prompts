  4.  **Evaluating the Premises:**
      *   (1) is math. Hard to reject.
      *   (2) is the definition of "old evidence" in a synchronous Bayesian model. If I know $E$, $P(E)=1$.
      *   (3) follows from (1) and (2).
      *   (4) is empirical claim about science. Plausible.
      *   (5) is the inference from Bayesian formalism to normative judgment.
      *   (6) is the normative intuition.
      *   (7) & (8) are the conclusion.

      *   *Where is the break?* It's usually in how we model the *update*. The argument assumes the update event is "observing E". But for old evidence, the update event is "realizing H entails E".

  5.  **Developing the Solutions (The "How to Fix It" part):**

      *   **Option A: The "Entailment Update" (Garber-style).**
          *   Instead of conditioning on $E$, condition on the proposition $K$: "$H$ entails $E$" (or $H \rightarrow E$).
          *   $P(E)$ might be 1, but $P(H \rightarrow E)$ was *not* 1 before the derivation.
          *   So, $P(H | H \rightarrow E) > P(H)$.
          *   *Cost:* Requires expanding the language of the probability space to include logical relations as propositions. Violates strict logical omniscience (which standard Bayesianism assumes).

      *   **Option B: Counterfactual/Historical Priors.**
          *   Don't ask "Does $E$ confirm $H$ for me *now*?"
          *   Ask "Would $E$ have confirmed $H$ if I *didn't* know $E$?"
          *   We reconstruct the prior $P_{old}(H)$ before $E$ was known.
          *   Then calculate $P_{old}(H|E)$.
          *   *Cost:* Highly subjective. Which historical moment counts? What if the theory was conceived *after* the evidence (like GR and Mercury)? Then there was never a time when we had the theory but didn't know the evidence. This is the "temporal version" vs. "ahistorical version" of POE.

      *   **Option C: Distinguishing Synchronic vs. Diachronic.**
          *   The argument assumes a synchronic snapshot (I know $E$, I know $H$, what is $P(H|E)$?).
          *   Confirmation is diachronic (change in belief over time).
          *   If the change in belief was driven by the *discovery of the entailment*, that's the rational update.
          *   *Cost:* Requires a dynamic model of logical learning, not just static probability.

