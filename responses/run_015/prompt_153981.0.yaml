      *   (2) For old evidence $E$, $P(E) \approx 1$ (because we already know it).
      *   (3) Therefore, updating on $E$ doesn't change credence in $H$ (since if $P(E)=1$, then $P(H|E) = P(H)$).
      *   (4) Scientists treat old evidence as confirmation (e.g., GR & Mercury).
