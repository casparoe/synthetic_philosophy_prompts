prompt: |-
  Hey—I'm a philosophy PhD student working on formal epistemology and I'm trying to nail down where this argument about old evidence acutally breaks. You're an expert in Bayesian confirmation theory and philosophy of science; please think carefully and maybe do a little brainstorming before you answer. I don't need citations or a reading list, just reasoning I can follow offline.

  My advisor showed me this chain that seems to prove Bayesians have to call scientific practice irrational whenever old data gets used as confirmation. I want to keep (6) if possible—scientists aren't just being irrational about Mercury's perihelion—but I also don't want to toss out (1). Here's the argument:

  (1) Bayes' theorem: P(H|E) = P(E|H)P(H)/P(E).
  (2) For old evidence E, our prior P(H) already condtioning on everything we knew, including E, so P(E) ≈ 1.
  (3) Therefore updating on E again can't change our credence in H.
  (4) But scientists treat old predictive successes—like GR explaining Mercury's perihelion—as genuine confirmation.
  (5) So Bayesians must say that treating them as confirmation is irrational, since no credence shift is licensed.
  (6) But that treatment is central to science and not irrational.
  (7) Hence either Bayesians reject (6), which is absurd, or they allow P(H|E) > P(H) despite P(E) ≈ 1, violating the theorem.
  (8) So Bayesian epistemology collapses into contradiction whenever old evidence is involved.

  Where does it go wrong? I suspect there's a hidden slide between conditioning on E and conditioning on learning that H entails E, but I'm not sure that's the whole story. Which premise is the weakest? If I keep both (1) and (6), do I need some non-probabilistic 'retrospective confirmation' mechanism, or can the formalism be saved by distinguishing the agent's prior state? What's the cost of each option?
