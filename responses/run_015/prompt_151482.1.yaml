prompt: |-
  Hi — hoping you can help me plan a session rather than explain the thing to me.

  I run a fortnightly lunch-and-learn at the games studio where I work. Next one is fifty minutes, and the room will be mostly narrative and quest designers, two systems designers, and one writer who's halfway through an evening MA in philosophy and will definately push back on everything. The topic: how thought experiments persuade, and how they mislead. Not a tour of famous ones — I want them walking out able to take a hypothetical apart and say which bit of it is actually doing the arguing. (I believe "intuition pump" is Dennett's phrase, but I don't want to spend any of the session on where the term came from.)

  What I need is the teaching plan. Specifically:

  - The order the pieces have to arrive in and what depends on what. My instinct is they need some grip on what a thought experiment is even supposed to be evidence of before any of the failure modes will land, but I'm not confident. And I can't decide whether to open with something from their world — a branching quest where players reliably pick the option you quietly steered them towards — or with something from mine.

  - The one carried example. It has to come out of games, it needs a twin version differing in exactly one feature that flips the verdict, and it mustn't collapse into a row about what players would actually do, because someone will say "we'd A/B test that" and we'll lose twenty minutes. Tell me what it should be and what it must contain and lack. Also tell me why not the obvious move, which is reskinning the trolley problem into one of our own levels: I half think that's fine and half think it smuggles in exactly the trained responses I'm trying to expose.

  - The misconceptions this lot will bring, in the order they'll surface. The ones I'm braced for: that a thought experiment is a compressed simulation, so more vivid detail is a better test (they're worldbuilders, they treat descriptive richness as a craft virtue); that a scenario which could never happen can't tell us anything; and the overcorrection, where everything becomes "just rhetoric" and they want to strip the story out and inspect the bare argument. Where in the sequence do I head each one off? The MA writer will also try to drag the room into whether intuitions are evidence at all — does that get a slot, or do I refuse it?

  - A taxonomy I've been using, which I made up and don't fully trust: "loaded-detail pumps" (irrelevant colour carrying the argument), "smuggled-description pumps" (the contested description is already in the setup), and "contrast-class pumps" (the alternative the reader silently measures against is doing the work). Is the third really a distinct kind or just the second one in costume? And should I hand them the three labels up front, or let them build something in their own vocabulary first and only name mine at the end?

  One more: my working rule is that a pump is safe if you can state its conclusion without the story and it still sounds just as plausible. I suspect the rule is too strong but I'm fond of it. Where do I introduce it, and how will it misfire in this particular room?

  Finally, a check at the end that shows they've got the idea rather than just become generally suspicious — I can easily see them leaving able to shout "biased!" at anything — plus what I should openly refuse to cover in fifty minutes and say out loud that I'm refusing.

  Write it up in American English, please. I know, British studio, but the notes go to our Seattle office and they get stroppy about spelling.
reasoning: |-
  Here's a thinking process that leads to the suggested session plan:

  1.  **Analyze the Request:**

      *   **Goal:** Plan a 50-minute lunch-and-learn session.
      *   **Topic:** How thought experiments persuade and mislead (specifically "intuition pumps").
      *   **Audience:** Games studio (mostly narrative/quest designers, 2 systems designers, 1 philosophy MA writer).
      *   **Constraint:** No history/etymology of terms (e.g., Dennett). Focus on practical utility (taking a hypothetical apart).
      *   **Deliverables:**
          *   Sequence/Order of content.
          *   One carried example (game-based, twin versions, avoids A/B testing debates).
          *   Anticipated misconceptions & when to address them.
          *   Feedback on the user's taxonomy (Loaded, Smuggled, Contrast-Class).
          *   Feedback on the user's "Working Rule" (Conclusion without story).
          *   Closing check for understanding.
          *   Explicit exclusions (what *not* to cover).
      *   **Tone:** American English (for Seattle office), professional but practical.

  2.  **Deconstruct the Audience & Dynamics:**

      *   *Narrative/Quest Designers:* Care about player agency, emotional resonance, branching paths. Prone to "worldbuilding" details.
      *   *Systems Designers:* Care about mechanics, balance, logic. Prone to "A/B test that" or "simulation" thinking.
      *   *Philosophy MA Writer:* Will challenge epistemological foundations ("Are intuitions evidence?"). Needs to be managed so they don't hijack the session.
      *   *Time:* 50 minutes is tight. Needs tight facilitation.

  3.  **Address the Specific Questions:**

      *   **Sequence:** Start with *function* (what is it doing?), then *failure modes*, then *tools*. If they don't know what it's supposed to prove, they can't see how it's misleading.
      *   **The Carried Example:**
          *   *Idea:* Needs to be about design ethics or player psychology, not just mechanics.
          *   *Trolley Problem Reskin:* User is right to be wary. It triggers pre-existing moral baggage. Better to use something intrinsic to game design.
          *   *Proposal:* The "Meaningful Choice" scenario.
          *   *Version A:* Player chooses to sacrifice an NPC to save a village. (Tragic, heroic).
          *   *Version B:* Player chooses to sacrifice an NPC to save a *slightly larger* village, but the NPC is a generic guard vs. a named friend.
          *   *Wait, needs to be tighter.* Let's look at "Agency vs. Illusion."
          *   *Better Proposal:* The "Hidden Rail" scenario.
          *   *Scenario 1:* You are told you have a choice. You pick A. The story branches.
          *   *Scenario 2:* You are told you have a choice. You pick A. The story *converges* immediately, but the *dialogue* acknowledges your choice.
          *   *Verdict Flip:* Is this deception or good pacing?
          *   *Refinement:* Let's go with **The "Ludonarrative Dissonance" Pump.**
          *   *Scenario A:* A hero who saves the world in cutscenes but murders hundreds in gameplay. (Verdict: Hypocrite/Bad writing).
          *   *Scenario B:* A villain who murders hundreds in cutscenes but *spares* the player in gameplay mechanics (mercy mechanic). (Verdict: Complex/Nuanced?).
          *   *Actually, let's stick to the prompt's request for "one feature that flips the verdict."*
          *   *Selected Example:* **The "Predatory Monetization" Test.**
          *   *Version 1:* A loot box that looks like a treasure chest found in the world. (Verdict: Immersive).
          *   *Version 2:* A loot box that looks like a UI menu popup. (Verdict: Transactional).
          *   *Mechanism:* Same math, same odds. Only the *skin* changes.
          *   *Why not Trolley?* Trolley brings external moral philosophy. We want internal design philosophy.
          *   *Why this works:* It hits the "Loaded Detail" (the chest skin) vs. "System Reality" (the odds).
      *   **Misconceptions:**
          1.  *Simulation Fallacy:* "More detail = better test." (Address early).
          2.  *Impossibility Fallacy:* "This would never happen." (Address mid).
          3.  *Cynicism:* "It's just rhetoric." (Address late).
          4.  *Philosophy Trap:* "Are intuitions evidence?" (Park it, don't solve it).
      *   **Taxonomy:**
          *   Loaded-Detail: Distraction.
          *   Smuggled-Description: Begging the question.
          *   Contrast-Class: Framing effect.
          *   *Advice:* Contrast-Class is distinct enough (framing vs. content). Introduce labels *after* the exercise to cement the learning.
      *   **Working Rule:** "State conclusion without story."
          *   *Critique:* Too strong. Stories provide *context* which matters. But if the story is *essential* to the logic, it's not a pump, it's a simulation.
          *   *Adjustment:* "If the story does emotional work that the logic doesn't support, it's a pump."
      *   **Closing Check:** Apply the tool to a new, small scenario.
      *   **Exclusions:** History of philosophy, solving the hard problem of consciousness, actual A/B testing methodology.

  4.  **Drafting the Plan (Iterative refinement):**

      *   *Intro (5 mins):* Hook them. Define the goal (debugging arguments).
      *   *The Example (15 mins):* The Loot Box/Chest. Walk through Version A and Version B.
      *   *The Taxonomy (10 mins):* Name the tricks they just saw.
      *   *The Working Rule (10 mins):* Test it against the example. Show where it breaks.
      *   *Misconceptions (5 mins):* Weave these into the above, but highlight the "Philosophy Trap."
      *   *Closing (5 mins):* Mini-exercise + Exclusions.

      *Wait, I need to integrate the Misconceptions section specifically as requested.* I should map them to the timeline.

      *Refining the Example:* The Loot Box one is good for Systems/Narrative clash. But let's make it more about *Quest Design* since that's the majority.
      *   *Scenario:* "The Player's Moral Compass."
      *   *Case A:* Player must kill a surrendering enemy to proceed. (Verdict: Forced violence, bad agency).
      *   *Case B:* Player must kill a surrendering enemy to save a hostage. (Verdict: Tragic necessity, good stakes).
      *   *Difference:* The *Consequence* (Smuggled Description).
      *   *Actually, the prompt asks for a "twin version differing in exactly one feature that flips the verdict."*
      *   *Let's go with the "Illusion of Choice" pump.*
      *   *Version 1:* The game hides the rail. Player thinks they chose. (Verdict: Deceptive).
      *   *Version 2:* The game highlights the rail. Player knows it's a narrative beat. (Verdict: Cinematic).
      *   *Feature:* Transparency.
      *   *Why not Trolley?* Agreed, external baggage.
      *   *Okay, I will recommend the "Transparent Rail" example.* It hits Narrative (story), Systems (logic), and Ethics (deception).

      *Refining the Taxonomy:*
      *   Loaded-Detail = Emotional padding.
      *   Smuggled-Description = Premise in the setup.
      *   Contrast-Class = Framing.
      *   *Advice:* Keep them. Contrast-Class is distinct (it's about the *background*, not the *foreground*). Introduce labels *after* the group identifies the mechanisms themselves.

      *Refining the Working Rule:*
      *   "Conclusion without story."
      *   *Risk:* Narrative designers will hate this. "Context is king."
      *   *Pivot:* "If removing the story removes the *persuasion* but not the *logic*, it's a pump."

  5.  **Finalizing the Structure (American English):**

      *   Check spelling (color, program, etc.).
      *   Ensure tone is collaborative but firm on time.
      *   Make sure the Philosophy MA person is acknowledged but contained.

  6.  **Review against Constraints:**
      *   50 mins? Yes, timing needs to be tight.
      *   No Dennett history? Yes.
      *   One carried example? Yes.
      *   Taxonomy feedback? Yes.
      *   Working Rule feedback? Yes.
      *   Misconceptions order? Yes.
      *   Closing check? Yes.
      *   Exclusions? Yes.

  7.  **Final Polish:** (Self-Correction during drafting)
      *   *Correction:* The "Transparent Rail" example might be too dry. Let's make it about *Reward Scheduling*.
      *   *No, stick to Narrative/Quest.* The audience is mostly Narrative.
      *   *Let's try: "The Sacrifice Quest."*
      *   *Version A:* Kill one named friend to save 1000 unnamed NPCs. (Utilitarian win).
      *   *Version B:* Kill one named friend to save 1000 unnamed NPCs, but the 1000 NPCs are *already dead* if you don't act, whereas in Version A they are *threatened*.
      *   *Wait, that's too complex.*
      *   *Let's go with the "Save Scumming" Ethical Pump.*
      *   *Version A:* Player reloads to save a companion who died due to player error. (Verdict: Valid play).
      *   *Version B:* Player reloads to save a companion who died due to narrative script. (Verdict: Breaking the contract).
      *   *Feature:* Cause of death (Mechanic vs. Script).
      *   *Verdict Flip:* One is "skill," one is "denial of story."
      *   *Actually, the prompt wants to show how thought experiments mislead.*
      *   *Okay, I'll stick with the "Loot Box Skin" example but framed as a Design Review.* It's the clearest "Same System, Different Description" which fits the "Smuggled Description" category perfectly. It bridges Systems and Narrative.

      *(Self-Correction)*: The prompt asks for *one* carried example. I need to be decisive.
      *Decision:* **The "Friendly Fire" Scenario.**
      *   *Context:* Squad-based shooter.
      *   *Version A:* You accidentally kill a civilian. The game marks you as a war criminal.
      *   *Version B:* You accidentally kill a civilian. The game treats it as "collateral damage" and continues.
      *   *The Pump:* "Is the player responsible for system limitations?"
      *   *Twist:* Change *one* variable: The UI Warning.
      *   *Version 1:* No warning UI. (Verdict: Unfair punishment).
      *   *Version 2:* Explicit "Lethal Force Authorized" UI warning. (Verdict: Player assumption of risk).
      *   *Why:* It isolates "Informed Consent" via UI text (Narrative/Systems overlap).
      *   *Actually, I think the "Loot Box/Chest" is stronger for "Smuggled Description."* I will use that. It's clearer how the *description* changes the *moral weight* without changing the *math*.

      *Wait, one more check on the Philosophy MA.*
      *   They will ask "Is intuition evidence?"
      *   *Plan:* Acknowledge it in the "Exclusions" but give them a "Parking Lot" answer: "For this session, intuition is data about *persuasion*, not data about *truth*."

      *Let's write it.*

      *(Final Plan Structure)*
      1.  **Session Flow (Minute-by-Minute)**
      2.  **The Carried Example (The "Golden Chest" vs. "UI Menu")**
      3.  **Misconceptions & Management**
      4.  **Taxonomy Feedback**
      5.  **Working Rule Feedback**
      6.  **Closing Check & Exclusions**

      *Wait, American English check:* "Fortnightly" is British. I should probably keep "fortnightly" in the description of their job but write the plan in US English (color, program, etc.). The prompt says "Write it up in American English." I will adhere to that strictly.

      *Re-evaluating the Example:* The Loot Box one is good, but might trigger the "A/B test that" response the user wants to avoid.
      *   *Better:* **The "NPC Memory" Pump.**
      *   *Scenario:* An NPC remembers a choice you made 20 hours ago.
      *   *Version A:* They thank you warmly. (Verdict: Rewarding, immersive).
      *   *Version B:* They bring it up to guilt you. (Verdict: Punitive, nagging).
      *   *Feature:* Valence of the memory.
      *   *The Trap:* The thought experiment asks "Is persistent memory good design?"
      *   *The Mislead:* It smuggles in the *emotional valence* as if it's a property of *memory* itself.
      *   *This is perfect.* It isolates "Smuggled Description."

      *Okay, ready to draft.*
answer: |-
  Here is the teaching plan, structured for a 50-minute session. It is written in American English for your Seattle office.

  ### 1. Session Flow & Sequence (50 Minutes)

  Your instinct is correct: they cannot identify the failure modes until they agree on the function. If they think a thought experiment is a *simulation*, they will critique its fidelity. If they understand it is a *persuasive device*, they will critique its leverage.

  **0:00–0:05 | The Hook: Function Over Fidelity**
  *   **Goal:** Define the thought experiment not as a "mini-simulation" but as a "logic microscope."
  *   **Action:** State the session goal: "We are not here to decide if hypothetical scenarios are true. We are here to decide if they are doing honest work."
  *   **Dependency:** This must happen before the example. If you show the example first, the Systems designers will critique the variables, and the Narrative designers will critique the setting.

  **0:05–0:20 | The Carried Example (See Section 2)**
  *   **Goal:** Demonstrate how a single variable change flips a verdict without changing the underlying system.
  *   **Action:** Run Version A and Version B. Ask for a show of hands on the verdict for each.
  *   **Dependency:** Do not explain *why* the verdict flipped yet. Let them feel the inconsistency first.

  **0:20–0:30 | The Taxonomy (See Section 4)**
  *   **Goal:** Give them vocabulary for what just happened.
  *   **Action:** Reveal your three categories. Ask the room to map the Example onto the categories.
  *   **Strategy:** Do not hand them the labels up front. Let them describe the "trick" in their own words first, then map your terms to their observations. This prevents them from treating the labels as dogma.

  **0:30–0:40 | The Working Rule & Misconceptions (See Section 3 & 5)**
  *   **Goal:** Stress-test the tool.
  *   **Action:** Introduce your "Conclusion Without Story" rule. Show where it works, then show where it breaks (specifically for Narrative designers).
  *   **Management:** This is where you field the Philosophy MA's objections and the "A/B Test" crowd.

  **0:40–0:45 | The Closing Check**
  *   **Goal:** Verify retention.
  *   **Action:** A micro-exercise (See Section 6).

  **0:45–0:50 | Exclusions & Wrap**
  *   **Goal:** Set boundaries for future conversations.
  *   **Action:** Explicitly state what you are *not* solving today.

  ---

  ### 2. The Carried Example

  **Do not use the Trolley Problem.** You are correct; it smuggles in centuries of trained philosophical response. It also triggers moral defensiveness rather than design analysis.

  **Do not use the Loot Box/Chest example.** It invites the "A/B test that" objection too easily because it is purely economic.

  **Use This: "The NPC Memory Pump"**
  This targets the intersection of Narrative (memory/dialogue) and Systems (flags/variables).

  *   **The Setup:** In a single-player RPG, the player makes a choice in Act 1 to spare an enemy commander. In Act 3, the player encounters that commander again. The game system flags this choice and triggers a dialogue branch.
  *   **Version A:** The commander says, "You showed me mercy. I will not fight you today." The player gains a tactical advantage (skip a fight).
      *   *Ask:* Is this good design? (Most will say Yes: "Meaningful choice," "Consequence.")
  *   **Version B:** The commander says, "You showed me mercy. But I am still loyal to my cause. I will fight you, but I will hate myself for it." The player fights the same boss battle, but the dialogue is heavier.
      *   *Ask:* Is this good design? (Many will say No: "Pointless," "Guilt-tripping," "Why bother?")
  *   **The Twist:** Reveal that the *systemic flag* is identical. The *variable* is purely the **Valence of the Reward**.
  *   **The Argument Being Pumped:** "Persistent memory is only valuable if it provides mechanical utility."
  *   **Why it works:**
      1.  **Game Native:** It uses their language (flags, branches, utility).
      2.  **Single Feature Flip:** It isolates "Reward" vs. "Narrative Weight."
      3.  **Avoids A/B Testing:** You aren't asking what players *do*; you are asking what the design *claims to be*.
      4.  **No Simulation Trap:** It doesn't matter if this is realistic; it matters if the argument holds.

  **What it must contain:** Explicit confirmation that the code/flag is identical.
  **What it must lack:** Any detail about the art style, voice acting quality, or specific lore. Keep it abstract enough that they can't argue about the writing quality.

  ---

  ### 3. Misconceptions & Management

  Here is the order they will surface, and where you head them off.

  **1. The Simulation Fallacy ("More detail is better")**
  *   *Who:* Worldbuilders/Narrative Designers.
  *   *When:* During the Example (0:05–0:20). They will ask, "What kind of enemy? What was the tone?"
  *   *Head Off:* "Stop. We are freezing those variables. If the argument relies on the tone, the argument is weak. We want to know if the *structure* holds."

  **2. The Impossibility Fallacy ("This would never happen")**
  *   *Who:* Systems Designers.
  *   *When:* During the Taxonomy (0:20–0:30). They will say, "Players would meta-game Version B."
  *   *Head Off:* "We are not testing player behavior. We are testing the design claim. The claim is 'Memory adds value.' Does Version B disprove that claim?"

  **3. The Cynicism Overcorrection ("It's just rhetoric")**
  *   *Who:* Everyone, once they realize they can be manipulated.
  *   *When:* During the Working Rule (0:30–0:40).
  *   *Head Off:* Acknowledge it. "Yes, it is rhetoric. But design is rhetoric. We are learning to write better arguments, not to stop arguing."

  **4. The Philosophy Trap ("Are intuitions evidence?")**
  *   *Who:* The MA Writer.
  *   *When:* Anywhere, but likely during the Working Rule.
  *   *Management:* Do not let this consume the room. Give them a specific slot.
  *   *Script:* "That is a valid epistemological question. For the purpose of this studio, we are treating intuition as *data about user experience*, not data about objective truth. We are debugging the *persuasion*, not the *ontology*. I'm parking that question for the pub afterwards."

  ---

  ### 4. The Taxonomy

  Your taxonomy is solid. To answer your specific question: **Contrast-Class Pumps are distinct from Smuggled-Description Pumps.**

  *   **Smuggled-Description:** The conclusion is hidden in the premise (e.g., calling a loot box a "surprise mechanic").
  *   **Contrast-Class:** The conclusion relies on what you are comparing it to *silently* (e.g., comparing a microtransaction to a $60 game vs. comparing it to a $5 coffee).

  **Recommendation:**
  Do not hand them the labels up front. If you give them the labels first, they will try to sort the example into the boxes like a multiple-choice test.
  1.  Run the Example.
  2.  Ask: "What trick did Version B pull on us?"
  3.  Let them shout out ideas ("It framed the reward differently," "It hid the cost").
  4.  *Then* reveal your labels as the "official names" for what they just identified. This validates their intuition before giving them the jargon.

  ---

  ### 5. The Working Rule

  *Your Rule:* "A pump is safe if you can state its conclusion without the story and it still sounds just as plausible."

  **Critique:** It is too strong, and your Narrative designers will correctly attack it.
  *   **Why it misfires:** In games, context *is* logic. "Killing an NPC" is mechanically identical in two games, but narratively distinct. If you strip the story, you strip the design.
  *   **The Fix:** Refine the rule to: **"If removing the story removes the *persuasion* but not the *logic*, it's a pump."**
      *   *Example:* If the argument is "Players hate losing progress," but the story makes losing progress feel "heroic," the story is doing work.
      *   *If the story is just emotional padding to hide a bad mechanic,* stripping it reveals the bad mechanic.
      *   *If the story is the mechanic,* stripping it breaks the logic.

  **Where to introduce:** At 0:30. Use the "NPC Memory" example to show where the rule works (Version A vs B logic) and where it feels uncomfortable (Narrative weight).

  ---

  ### 6. Closing Check & Exclusions

  **The Check (5 Minutes)**
  Do not ask them to summarize the talk. Ask them to apply the tool.
  *   **Prompt:** "Think of a design argument you heard this week. 'We need X because Y.' Take 60 seconds. Can you strip the story? If you strip the story, does the argument collapse?"
  *   **Success Metric:** You want to hear someone say, "I realized the story was hiding a lack of features," not "I realized all stories are lies."
  *   **Goal:** You want them leaving as **editors**, not **cynics**. They should be able to say, "This pump is useful," not just "This pump is biased."

  **The Exclusions (Explicitly State These)**
  To protect your time, open the final 5 minutes by saying:
  1.  **"I am not covering the history of philosophy."** (No Dennett deep dives).
  2.  **"I am not solving the Hard Problem of Consciousness."** (Addressed to the MA writer: We aren't deciding if free will exists).
  3.  **"I am not teaching A/B Testing methodology."** (Addressed to Systems: We are analyzing the *argument for* the test, not the test itself).

  **Final Script for the Room:**
  "If you take nothing else away: A thought experiment is a tool. Like a sword, it can cut through confusion, or it can cut you. Your job isn't to drop the sword. It's to check the edge before you swing."
