  We trace the debt that larger facts incur,
  Down to the bits that make the whole appear.
  Each layer rests on something smaller, sure,
  Until we reach the floor we hold so dear.

  The groundless base, the source from which all spring,
  Is thought to dwell within the least degree.
  So every bit acts as the dual king,
  And make the small the root of all we see.

  Yet bedrock need not bear the total weight,
  Nor must the source be free from deeper debt.
  The Whole may stand alone, the final state,
  Or chains descend with no foundation set.

  One marks the bottom, one the total scope,
  So "fundamental" snaps its single rope.
