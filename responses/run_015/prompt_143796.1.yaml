prompt: |-
  I teach a graduate seminar on the epistemic foundations of game theory — common knowledge, common belief in rationality, and the work that higher-order beliefs are supposed to do in selecting among equilibria. I want to test that framework against an actual episode rather than another puzzle, so: analyse the failure of Silicon Valley Bank in March 2023 through it, and then tell me where the framework stops being informative.

  I will stipulate the facts. SVB had invested a large share of its swollen deposit base in long-dated Treasuries and mortgage securities, whose market value fell as the Fed raised rates; unrealized losses on the held-to-maturity portfolio exceeded fifteen billion dollars. On 8 March the bank announced that it had sold over twenty-one billion dollars of securities at a loss, borrowed fifteen billion, and would raise 2.25 billion in equity. Prominent venture investors publicly advised their portfolio companies to move their money. Customers withdrew funds totalling forty-two billion dollars by the following day; the bank was seized on 10 March. Roughly eighty-nine percent of its deposit liabilities were uninsured. Two days later the authorities announced that all depositors, insured or not, would have full access to their funds, and the immediate panic subsided — while First Republic, with a comparably uninsured deposit base, was closed on 1 May despite thirty billion dollars in deposits placed with it by eleven banks in March.

  What I want is a disciplined mapping, not a narrative: who the players are, what the option set and payoff structure actually looked like for a depositor on the morning of 9 March, what has to be true of first- and higher-order beliefs for mass withdrawal to be an equilibrium rather than merely individually rational, and how the public guarantee should be modelled — as a change in the payoffs, or as an intervention on beliefs, and if the latter, what the theory predicts about the difference between its working at SVB and not working at First Republic.

  Then the return direction, which interests me more. First: was this a coordination failure at all? SVB's deposits paid close to nothing while short-term government paper yielded around five percent, so withdrawal may have been a dominant strategy irrespective of what anyone else did. If so the model is imposing a self-fulfilling structure on what was really a common adverse shock. Say what would distinguish the two readings, and whether the framework can distinguish them from the outside; if it cannot, is that a defect in the theory or a limitation on its use? Second: the depositor base was unusually small, densely networked, and able to watch one another's reasoning almost in real time. Does that transparency move the situation toward or away from the theory's idealised conditions, and — since transparency plainly does not by itself say which equilibrium gets coordinated on — whether near-common knowledge behaves like common knowledge here or departs from it disproportionately. Finally, the normative question: if staying and running are both equilibrium outcomes under common belief in rationality, can the framework say that anything went wrong at SVB, or does it have to import something from outside itself? Where it has nothing to say, say so rather than forcing it to speak.
reasoning: |-
  Here's a thinking process that leads to the suggested analysis:

  1.  **Deconstruct the Request:**

      *   **Topic:** Epistemic foundations of game theory (common knowledge, common belief in rationality, higher-order beliefs, equilibrium selection).
      *   **Case Study:** Silicon Valley Bank (SVB) collapse, March 2023.
      *   **Task 1 (Mapping):** Disciplined mapping of the SVB event onto the game-theoretic framework.
          *   Players, options, payoffs (specifically for a depositor on March 9).
          *   Conditions for mass withdrawal as an equilibrium (1st and higher-order beliefs).
          *   Modeling the public guarantee (payoff change vs. belief intervention).
          *   Explain the difference between SVB (guarantee worked) and First Republic (guarantee failed/delayed).
      *   **Task 2 (Critique/Return Direction):** Where the framework stops being informative.
          *   *Coordination Failure vs. Dominant Strategy:* Was it a run (coordination) or fundamental insolvency (dominant strategy to run)? How to distinguish? Can the theory distinguish from the outside?
          *   *Network/Transparency:* SVB's depositor base was small, networked, transparent. Does this help or hurt the "Common Knowledge" idealization? Does near-common knowledge behave like common knowledge?
          *   *Normative Question:* If both "stay" and "run" are equilibria under common belief in rationality, can the framework say anything *went wrong*? Or does it need external norms?
      *   **Constraint:** "Say what would distinguish the two readings, and whether the framework can distinguish them from the outside; if it cannot, is that a defect in the theory or a limitation on its use?" "Where it has nothing to say, say so rather than forcing it to speak."
      *   **Tone:** Academic, rigorous, disciplined, suitable for a graduate seminar. No narrative fluff.

  2.  **Task 1: Disciplined Mapping (The Game):**

      *   *Players:* Depositors (specifically the uninsured corporate depositors). Let's model as a continuum or a large finite set $N$.
      *   *Time:* Morning of March 9, 2023 (post-announcement, pre-seizure).
      *   *Actions:* $A_i = \{\text{Run}, \text{Stay}\}$.
      *   *State of the World:* $\theta$ represents the bank's liquidity/solvency status.
          *   SVB had unrealized losses > $15B.
          *   Deposit liabilities 89% uninsured.
          *   Liquidity gap revealed by the capital raise announcement.
      *   *Payoffs:*
          *   If Stay & Bank Survives: $V_{stay} > 0$ (continued banking services, nominal value).
          *   If Stay & Bank Fails: $V_{fail} < 0$ (loss of uninsured funds, FDIC receivership haircut).
          *   If Run & Bank Survives: $V_{run\_surv} \approx V_{stay}$ (minus transaction costs).
          *   If Run & Bank Fails: $V_{run\_fail} > V_{fail}$ (priority in queue, though in FDIC receivership, timing matters less than insurance status, but in a *pre-receivership* run, first-come-first-served applies until liquidity exhausted).
      *   *Crucial Detail:* The payoffs depend on the *proportion* of others running ($\alpha$).
          *   Threshold model (Global Games style): If $\alpha > \theta_{critical}$, bank fails.
      *   *Higher-Order Beliefs:*
          *   1st Order: I believe the bank is fragile ($\theta$ is low).
          *   2nd Order: I believe others believe the bank is fragile.
          *   Common Belief in Rationality (CBR): Everyone knows everyone is maximizing expected utility given beliefs.
          *   Common Knowledge of the Announcement: The capital raise announcement made the fragility public.
      *   *Equilibrium Selection:*
          *   Equilibrium 1 (Good): Everyone stays, bank survives (if fundamentals allow).
          *   Equilibrium 2 (Bad): Everyone runs, bank fails.
          *   Why did we jump to Eq 2? The announcement shifted beliefs about $\theta$ and beliefs about *others'* beliefs about $\theta$.
      *   *The Guarantee (March 12):*
          *   Modeling: It changes the payoff structure. $V_{fail}$ becomes equal to $V_{stay}$ (full access).
          *   Effect: "Run" is no longer a best response to "Run". The dominant strategy shifts to "Stay" (or indifference).
          *   SVB vs. First Republic:
              *   SVB: Guarantee was immediate and comprehensive (systemic risk exception). Payoff matrix altered fundamentally.
              *   First Republic: Guarantee was ambiguous or perceived as temporary. Depositors knew the *next* failure might not get the same deal (moral hazard constraint). Beliefs about *future* government action remained uncertain. The payoff change wasn't common knowledge as permanent.

  3.  **Task 2: The Return Direction (Critique):**

      *   *Coordination Failure vs. Dominant Strategy:*
          *   *Theory:* A run is a coordination failure if $\exists$ an equilibrium where Stay is optimal *if* others Stay. It's a dominant strategy if Run is optimal *regardless* of others.
          *   *Facts:* SVB had $15B+ unrealized losses. 89% uninsured. If everyone stays, can they hold to maturity? Maybe. But liquidity was needed *now*.
          *   *Distinction:* In a coordination failure, the fundamental $\theta$ is in the "intermediate" region (multiple equilibria). In a dominant strategy case, $\theta$ is in the "lower" region (insolvent regardless).
          *   *Can the theory distinguish from the outside?* No. The theory takes payoffs and beliefs as inputs. If the observer doesn't know the true liquidity horizon vs. liability maturity, they can't distinguish if $\theta$ was in the multiplicity region or the insolvency region.
          *   *Defect or Limitation?* Limitation. The theory describes the *logic* of interaction, not the *accounting* reality. It explains *how* a collapse happens given beliefs, not necessarily *why* the beliefs were correct/incorrect about fundamentals.
      *   *Transparency/Network:*
          *   *Theory:* Common Knowledge (CK) is an idealization (infinite hierarchy).
          *   *SVB Context:* VC Twitter, group chats. "Near-CK" achieved very fast.
          *   *Effect:* Moves *toward* idealized conditions. Rubinstein's Email Game suggests near-CK isn't CK, but in high-stakes continuous time, the convergence is rapid.
          *   *Equilibrium Selection:* Transparency doesn't select *which* equilibrium. It just ensures everyone is playing the *same* game. However, in Global Games (Carlsson & van Damme), unique equilibrium is selected by noise. Here, the "noise" was low (signals were clear). This makes the switch abrupt.
          *   *Departure:* Did near-CK behave like CK? Yes, effectively. The cascade was instantaneous.
      *   *Normative Question:*
          *   *Theory:* If both Stay and Run are Rationalizable under CBR, the theory is silent on welfare. It is positive, not normative.
          *   *Can it say anything went wrong?* Only if we define "wrong" as Pareto inferior. The Run equilibrium is Pareto inferior to the Stay equilibrium (assuming bank was fundamentally viable).
          *   *Importing Outside:* To say the *outcome* was bad requires a welfare function. To say the *process* was irrational requires dropping CBR (e.g., panic, bounded rationality). If we hold CBR, the run is "rational."
          *   *Conclusion:* The framework cannot condemn the outcome without an external welfare criterion. It can only identify inefficiency (Pareto dominance).

  4.  **Drafting the Response:**

      *   *Structure:*
          1.  Formal Mapping (Players, Game, Beliefs, Equilibrium).
          2.  The Guarantee (Payoff vs. Belief).
          3.  Critique 1: Coordination vs. Fundamentals.
          4.  Critique 2: Transparency and Common Knowledge.
          5.  Critique 3: Normativity.
      *   *Tone Check:* Ensure I'm not telling a story. Use game-theoretic terminology (Rationalizability, Global Games, Payoff Dominance, Risk Dominance).
      *   *Specific Constraint Check:* Did I address First Republic? Yes. Did I address the "defect vs limitation" question? Yes. Did I address the normative silence? Yes.

  5.  **Refining the Argument (Self-Correction during drafting):**

      *   *Correction on Payoffs:* Be careful about FDIC insurance. Since 89% was uninsured, the payoff matrix is stark. If the bank fails, uninsured depositors take a haircut *unless* the systemic risk exception is invoked.
      *   *Correction on First Republic:* Why did the guarantee not work there? Because the guarantee for SVB was explicitly *not* a precedent (officially). So beliefs about the payoff matrix for FR remained "uninsured losses possible."
      *   *Refining the "Dominant Strategy" point:* If the bank is insolvent (assets < liabilities even at maturity), Run is dominant. If it is illiquid but solvent (assets > liabilities, but cannot sell quickly), Run is a coordination failure. The prompt asks to distinguish these. The epistemic framework struggles here because it models *beliefs about solvency*, not solvency itself.
      *   *Refining the Normative point:* Game theory defines "rationality" as internal consistency. It cannot define "stability" as good without an external social welfare function. I need to be clear that the framework is agnostic on whether the run was "bad" unless we stipulate Pareto efficiency.

  6.  **Final Polish:** Check against the prompt's specific phrasing ("disciplined mapping," "return direction," "say so rather than forcing it to speak"). Ensure the distinction between 1st order (fundamentals) and higher order (what others think) is clear.

      *(Self-Correction on First Republic)*: The prompt says FR closed on May 1 despite deposits placed in March. The guarantee worked *temporarily* for FR (deposits placed), but ultimately FR failed. Why? Because the *fundamentals* (commercial real estate exposure + uninsured base) were similar, and the guarantee was not perceived as permanent for *future* shocks. I need to model the guarantee as a change in the *probability* of systemic risk exception, not just a payoff change. Actually, simpler: The SVB guarantee changed payoffs for SVB depositors. It did not change payoffs for FR depositors *credibly enough* to offset their fundamental risk.

      *Wait, re-reading prompt on FR:* "Two days later the authorities announced that all depositors... would have full access... while First Republic... was closed on 1 May."
      *Interpretation:* The guarantee stopped the run on SVB (and implicitly other banks initially), but FR still failed later. Why? Because the guarantee was specific to the *crisis moment*. FR had fundamental solvency issues that a run-exacerbated but didn't solely cause. Or, the guarantee didn't create Common Knowledge of *permanent* protection. I will model the guarantee as a payoff truncation that was credible for SVB (retroactive) but not for FR (prospective).

      *Let's tighten the "Coordination vs Dominant" argument.*
      If $V_{stay} | \text{all stay} > V_{run}$, it's coordination.
      If $V_{stay} | \text{all stay} < V_{run}$, it's dominant.
      The epistemic framework takes the payoff function as given. It cannot verify the inequality. That is the limitation.

      *Let's tighten the "Normative" argument.*
      If both are equilibria, CBR holds in both. The theory cannot prefer one over the other without a welfare metric. It can note Pareto ranking, but "ought" requires more.

      *Okay, ready to write.*
answer: |-
  ### I. Disciplined Mapping of the SVB Episode

  **1. The Game Form**
  *   **Players:** A set $N$ of depositors, indexed $i$. Given the concentration, $N$ is finite but large enough to approximate a continuum for threshold effects.
  *   **Time:** $t=0$ (Morning, 9 March 2023).
  *   **Actions:** $a_i \in \{\text{Run}, \text{Stay}\}$.
  *   **State of the World:** $\theta \in \mathbb{R}$, representing the bank's liquidity solvency horizon relative to withdrawal demand. $\theta$ is determined by the mark-to-market value of the HTM portfolio and the velocity of withdrawal.
  *   **Payoff Function:** $u_i(a_i, a_{-i}, \theta)$.
      *   Let $\alpha$ be the proportion of depositors running.
      *   There exists a threshold $\theta^*(\alpha)$ such that if $\alpha > \theta^*$, the bank fails (receivership).
      *   If Bank Survives: $u_i(\text{Stay}) = V$, $u_i(\text{Run}) = V - c$ (where $c$ is transaction cost).
      *   If Bank Fails: $u_i(\text{Stay}) = L$ (loss on uninsured portion), $u_i(\text{Run}) = L + \delta$ (priority benefit, though constrained by FDIC process).
      *   *Stipulated Fact:* 89% of deposits are uninsured. Thus, $L$ is significant.
      *   *Structure:* For a range of $\theta$, $u_i(\text{Stay}, \text{Stay}) > u_i(\text{Run}, \text{Stay})$ and $u_i(\text{Run}, \text{Run}) > u_i(\text{Stay}, \text{Run})$. This is a coordination game with multiple Nash equilibria.

  **2. Epistemic Conditions for the Run Equilibrium**
  For mass withdrawal to occur as a rationalizable outcome (not merely a panic):
  *   **First-Order Beliefs:** Each $i$ believes $\theta$ is sufficiently low (due to the 8 March announcement of realized losses) that the probability of failure conditional on moderate running is non-negligible.
  *   **Second-Order Beliefs:** Each $i$ believes that other $j$ believe $\theta$ is low. The 8 March announcement was public; thus, the deterioration of fundamentals is not just known, but known to be known.
  *   **Common Belief in Rationality (CBR):** Each $i$ believes $j$ will maximize expected utility. Since $j$ faces a payoff structure where Run weakly dominates Stay if failure is probable, $i$ expects $j$ to Run.
  *   **Equilibrium Selection:** The announcement shifted the *common prior* over $\theta$. In a Global Games framework (Carlsson & van Damme), public signals refine beliefs. The signal was precise and negative. This collapsed the "uncertainty region" where Stay might be safe, pushing the unique rationalizable action to Run.

  **3. Modeling the Public Guarantee (12 March)**
  *   **Intervention Type:** This is primarily a **change in payoffs**, which induces a **change in beliefs**.
      *   *Payoff Change:* The guarantee effectively set $L = 0$ for uninsured depositors. The payoff matrix becomes: $u_i(\text{Stay}) \geq u_i(\text{Run})$ regardless of $\alpha$. Run is no longer a best response to Run.
      *   *Belief Intervention:* For the payoff change to work, the guarantee must be **Common Knowledge**. The announcement was public and explicit ("all depositors... full access").
  *   **SVB vs. First Republic (FR):**
      *   *SVB:* The guarantee was retroactive and comprehensive. It altered the payoff matrix for the specific game SVB depositors were playing.
      *   *FR:* The guarantee did not alter the *prospective* payoff matrix for FR depositors to the same degree. The authorities framed the SVB move as a "systemic risk exception," not a permanent rule change.
      *   *Epistemic Difference:* For SVB, it became Common Knowledge that $L=0$. For FR, it remained Common Knowledge that $L > 0$ *if* FR failed, because the probability of FR triggering a *second* systemic risk exception was perceived as lower. The guarantee worked at SVB by truncating losses; it failed at FR because it did not truncate the *belief* in future losses.

  ---

  ### II. The Return Direction: Limits of the Framework

  **1. Coordination Failure vs. Dominant Strategy**
  *   **The Distinction:**
      *   *Coordination Failure:* The bank is fundamentally solvent ($\theta_{high}$) but illiquid. $u_i(\text{Stay}, \text{Stay}) > u_i(\text{Run}, \text{Stay})$. The run equilibrium is Pareto inferior.
      *   *Dominant Strategy:* The bank is fundamentally insolvent ($\theta_{low}$). Even if everyone stays, the unrealized losses mature into realized losses that exceed equity. $u_i(\text{Run}) > u_i(\text{Stay})$ regardless of $a_{-i}$.
  *   **Can the Framework Distinguish?**
      *   **No.** The epistemic framework takes the payoff function $u_i$ and the state $\theta$ as exogenous inputs. It models the *inference* from signals to actions. It does not audit the balance sheet.
      *   From the outside, an observer sees a Run. The model explains the Run as rationalizable under CBR in both cases. In the Coordination case, agents believe others will run. In the Dominant case, agents run because fundamentals are bad. The observable behavior (mass withdrawal) is identical.
  *   **Defect or Limitation?**
      *   **Limitation.** This is not a defect in the logic of the theory, but a boundary on its scope. Epistemic game theory explains the *transmission mechanism* of information into action. It is not a theory of accounting or solvency. To distinguish the two readings, one must import external data (the true value of $\theta$). If the theory claimed to distinguish them endogenously, it would be overfitting.

  **2. Transparency and Common Knowledge**
  *   **The SVB Context:** Depositors were VCs and CFOs in dense communication networks (Twitter, group chats). Information propagation was near-instantaneous.
  *   **Towards or Away from Idealization?**
      *   **Towards.** Standard models assume Common Knowledge (CK) is an abstraction often violated by communication frictions. SVB's network reduced frictions to near zero. "Near-CK" (Rubinstein's electronic mail game logic) converged on actual CK very rapidly.
  *   **Does Near-CK Behave like CK?**
      *   **Yes, disproportionately.** In standard games, small deviations from CK can sustain cooperation. In high-stakes financial games with binary thresholds, near-CK behaves like CK because the cost of being the "one percent" who didn't get the message is total loss.
      *   *Equilibrium Selection:* Transparency does not select *which* equilibrium (Stay or Run) is played; it selects the *speed* of convergence. However, because the signal (8 March announcement) was negative, transparency accelerated the convergence to the Run equilibrium.
      *   *Theoretical Implication:* The framework predicts that as communication noise approaches zero, the "uncertainty region" (where multiple equilibria exist) shrinks. SVB suggests that in modern financial networks, the uncertainty region is vanishingly small. The system jumps discontinuously from Trust to Run. The framework captures this via Global Games logic, but it implies that stability is inversely proportional to transparency in fragile regimes.

  **3. The Normative Question**
  *   **The Question:** If Stay and Run are both equilibrium outcomes under Common Belief in Rationality, can the framework say anything *went wrong*?
  *   **The Framework's Answer:**
      *   **Strictly Speaking, No.** Rationality in this context is instrumental consistency. If agents believe others will run, running is rational. If agents believe others will stay, staying is rational. Both are consistent with CBR.
      *   **Pareto Efficiency:** The framework *can* identify that the Run equilibrium is Pareto inferior to the Stay equilibrium (assuming $\theta$ allowed solvency). It can label the outcome "inefficient."
      *   **Normative Silence:** To say the outcome was "wrong" or "bad" requires a welfare function (e.g., "financial stability is a social good"). The epistemic framework is positive; it describes what rational agents *will* do, not what they *ought* to do.
      *   **Importing Outside:** To condemn the run, you must import a normative premise: *Systemic stability is preferred to individual liquidity preference.* Without that, the framework must remain agnostic. The run was simply the realization of a different fixed point in the belief hierarchy.
  *   **Conclusion:** Where the framework has nothing to say, it is on the *value* of the equilibrium. It can explain the fragility, but it cannot prescribe the remedy without an external objective function.

  ### Summary of Limitations
  1.  **Fundamentals:** The theory cannot distinguish between a run caused by false beliefs (coordination failure) and a run caused by true beliefs about insolvency (dominant strategy) without external accounting data.
  2.  **Normativity:** The theory cannot judge the Run equilibrium as "wrong," only as Pareto-inferior relative to the Stay equilibrium, contingent on solvency.
  3.  **Dynamics:** The framework is largely static or comparative static. It explains the jump from 8 March to 9 March, but struggles to model the *evolution* of the network structure that made CK so potent, treating the network as a fixed parameter of information flow rather than an endogenous variable.
