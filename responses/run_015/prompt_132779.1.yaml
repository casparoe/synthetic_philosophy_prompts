  # Diagnostic Taxonomy for the White Horse Dialogue

  **Root Node:** Is the dialogue's conclusion—that a white horse is not a horse—best understood as expressing a genuine ontological separation, or as revealing a category mismatch between how compound and simple names map onto things?

  *   **Branch A:** The conclusion expresses a genuine ontological separation.
  *   **Branch B:** The conclusion reveals a category mismatch between how compound and simple names map onto things.

  ---

  **Internal Node 1 (Topic a):** Does substitutivity fail between compound and simple terms because chromatic and formal determinables belong to non-overlapping ontological registers?

  *   **Branch 1A:** Substitutivity fails due to non-overlapping ontological registers.
  *   **Branch 1B:** Substitutivity fails for reasons other than non-overlapping ontological registers.

  ---

  **Internal Node 2 (Topic b):** Do the School's other arguments about pointing and designation commit it to kind-pluralism?

  *   **Branch 2A:** The School's fragments commit to kind-pluralism.
  *   **Branch 2B:** The School's fragments commit to a meta-linguistic theory of reference or to neither.

  ---

  **Internal Node 3 (Topic c):** Does the dialogue function as a positive defense of an aspect-based ontology in which color and shape are independently determinative?

  *   **Branch 3A:** The dialogue functions as a positive defense of an aspect-based ontology.
  *   **Branch 3B:** The dialogue functions as a reductio of naive essentialism about kinds.

  ---

  ## Terminal Leaves

  ### 1. The Chromatic-Formal Separation Thesis
  *   **Path:** Root A (Ontological Separation) → Node 1A (Registers) → Node 2A (Kind-Pluralism) → Node 3A (Positive Defense).
  *   **Most Awkward Commitment:** One must accept that color and shape exist in separate metaphysical realms that cannot intersect in a single particular.

  ### 2. The Strict Logical-Compositional Reading
  *   **Path:** Root A (Ontological Separation) → Node 1B (Other Reasons) → Node 2B (Meta-linguistic/Neither) → Node 3A (Positive Defense).
  *   **Most Awkward Commitment:** One must accept that logical syntax dictates metaphysical identity conditions independently of empirical reference.

  ### 3. The Kind-Pluralist Non-Ontologist
  *   **Path:** Root B (Category Mismatch) → Node 1B (Other Reasons) → Node 2A (Kind-Pluralism) → Node 3A (Positive Defense).
  *   **Most Awkward Commitment:** One must accept that reality contains multiple distinct kinds of beings while denying that these kinds correspond to separate ontological substances.

  ### 4. The Nominal-Reference Mismatch View
  *   **Path:** Root B (Category Mismatch) → Node 1B (Other Reasons) → Node 2B (Meta-linguistic/Neither) → Node 3A (Positive Defense).
  *   **Most Awkward Commitment:** One must accept that the paradox arises solely from linguistic convention with no implication for the structure of reality.

  ### 5. The Dialectical Pluralist (Unnamed Combination)
  *   **Path:** Root B (Category Mismatch) → Node 1B (Other Reasons) → Node 2A (Kind-Pluralism) → Node 3B (Reductio).
  *   **Most Awkward Commitment:** One must accept that the author employs a robust theory of kinds solely to demonstrate the impossibility of coherent discourse about those kinds.

  ### 6. The Sophistical-Rhetorical Interpretation
  *   **Path:** Root B (Category Mismatch) → Node 1B (Other Reasons) → Node 2B (Meta-linguistic/Neither) → Node 3B (Reductio).
  *   **Most Awkward Commitment:** One must accept that the text's rigorous argumentation is merely a vehicle for mocking opponents rather than establishing truth.

