answer: |-
  This is a sophisticated problem that cuts to the heart of the Mencius-Xunzi debate. You have reconstructed a version of the "potentiality argument" that has troubled interpreters of Xunzi for centuries (notably in the Song dynasty and again in modern scholarship). Your worry is well-founded: if the capacity to create ritual is natural, and ritual is good, then nature is good.

  To save your essay's thesis while respecting Xunzi's text, you must **surrender the unqualified version of Premise (3)**, or more precisely, the inference from (3) to (7). The error lies in conflating *capacity* (cai 材) with *inclination* or *sprout* (duan 端).

  Here is how you should dismantle the argument, address your specific worries, and recover a substantive disagreement.

  ### 1. Which Premise to Surrender and Why?

  You should retain (1), (2), and (5), as you proposed. The step that must be surrendered is the **unqualified metaphysical claim in (3)**: *"an agent can bring about only what their nature already equips them to bring about."*

  While this sounds intuitively true (you cannot fly without wings), it is ambiguous in a way that Xunzi exploits. You must replace it with a qualified distinction:
  *   **Revised (3):** *Xing* supplies the **faculty** (the mind, the senses, the energy) required for *wei*, but it does not supply the **content** or the **direction** of that activity.

  **The Cost:**
  Surrendering the unqualified (3) costs you the comfort of a seamless metaphysics. You must now explain how the mind chooses ritual if nature does not nudge it toward ritual. You are forced to argue that the mind's choice is **instrumental** rather than **intuitive**. The mind accepts ritual not because it recognizes a part of itself (as Mencius holds), but because it recognizes ritual as a necessary tool to curb the chaos that its own nature would otherwise produce. This makes Xunzi's moral psychology more fragile than Mencius's, but it is textually accurate.

  ### 2. Why Did Premise (3) Look Unobjectionable?

  Premise (3) looked safe because it relies on a suppressed assumption imported from Aristotelian potentiality or common sense: **"If I can do it, I must have been built to do it."**

  The ambiguity lies in the word **"capacities"** (used in step 3 and 6).
  *   **Mencius's Capacities (Sprouts):** These are *teleological*. A sprout of compassion is not just the ability to feel pity; it is an active *tendency* to feel pity that seeks completion in action. It has a direction.
  *   **Xunzi's Capacities (Cai 材):** These are *instrumental*. The eye has the capacity to see, but not the capacity to decide *what* is beautiful. The mind has the capacity to know (zhi 知), but not the innate knowledge of *what* is right.

  Your argument collapses these two. By saying the sages exercised capacities supplied by *xing*, you imply the *direction* of their exercise (toward ritual) was also supplied by *xing*. Xunzi denies this. The sage's *xing* supplied the brainpower and the energy; the *environment* and *accumulation* (ji 積) supplied the direction.

  ### 3. Addressing the Overgeneralization Worry

  Your first worry is the strongest diagnostic tool you have: *"By the same route anything human beings manage to produce—writing, bronze casting... would sit 'in' human nature."*

  This reductio ad absurdum confirms that (3) is too broad. Xunzi explicitly uses the potter and clay analogy (which you cite in step 2). The clay has the *capacity* to be a vessel, but the *form* of the vessel is not in the clay. If the form were in the clay, the potter would be unnecessary.
  *   **Writing:** We have the natural capacity to make marks (hand, eye, mind), but the grammar and meaning of writing are *wei*.
  *   **Bronze:** We have the capacity to dig and melt, but the ritual vessel shape is *wei*.

  If you accept your original (3), you dissolve the *Xing-Wei* distinction entirely. By qualifying (3) to distinguish *faculty* from *content*, you save the distinction. Human nature provides the workshop; *Wei* provides the blueprint.

  ### 4. The "Mind" Retreat and Normativity

  You worry that blocking (3) makes the Mind (Xin 心) look like an innate faculty with a normative job, conceding to Mencius. This is the famous "Xunzi's Mind Problem."

  **The Solution:** Distinguish between **Cognitive Normativity** and **Moral Normativity**.
  *   **Mencius:** The mind has *moral* normativity. It feels distress at suffering *because* it is suffering. The norm is internal.
  *   **Xunzi:** The mind has *cognitive* normativity. It can weigh long-term benefit against short-term gain. It accepts ritual because it calculates that ritual leads to order (zhi 治) and survival, whereas following *xing* leads to conflict and poverty.

  Admitting the mind is natural does not concede the Mencian case, provided you argue that the mind's natural function is **deliberation** (lü 慮), not **intuition**. The mind is the ruler, yes, but it is a ruler that must be taught the laws before it can judge. It is not a ruler who knows the law by birthright. This preserves the substantive difference: for Mencius, morality is *discovery* (looking inward); for Xunzi, morality is *construction* (looking outward to the sages).

  ### 5. What Counts as a Substantive Disagreement?

  If you fix the argument, the substantive disagreement is no longer about *capacity* (both agree humans can become good), but about **spontaneous tendency** (qu 趨).

  *   **Mencius:** If you do nothing to a human, they will tend toward goodness (like water flows down). Obstacles block the flow.
  *   **Xunzi:** If you do nothing to a human, they will tend toward conflict and strife (like wood warps). Correction bends them straight.

  **The Test Case:** Consider a child seeing a well.
  *   **Mencius:** The child feels alarm. This is a sprout of benevolence.
  *   **Xunzi:** The child feels alarm. This is a instinct for self-preservation or shock (part of *xing*), not necessarily benevolence. Benevolence is the *trained response* to that shock.

  Your essay should argue that the disagreement is about the **default setting** of the human organism. Mencius says the default is constructive; Xunzi says the default is destructive (or at least chaotic), and construction requires external intervention.

  ### 6. Is Retreating to Gaozi's Neutral Ground Stable?

  You ask whether retreating to Gaozi (nature is neither good nor bad) is stable, given Mencius's objection that neutrality cannot explain why goodness is the direction things tend.

  **Xunzi is not Gaozi.** This is a crucial distinction for your essay.
  *   **Gaozi:** Nature is like water; it goes east or west depending on the channel. (Neutral).
  *   **Xunzi:** Nature is like a warped piece of wood; if you leave it alone, it stays warped. It actively resists straightening. (Negative).

  Xunzi's ground is stable against Mencius precisely because he **denies** that goodness is the direction things tend when nothing obstructs them. For Xunzi, when nothing obstructs *xing*, you get greed, envy, and sensory indulgence. Goodness is the direction things tend only when *wei* (teachers, rituals, laws) obstructs *xing*.

  Therefore, you do not need to retreat to Gaozi. You can hold the stronger Xunzian position: Nature is not neutral; it is **problematic**. The "capacities" in *xing* are real, but they are like the heat in fire: natural, but dangerous if not managed. The capacity to learn ritual is not a "sprout of goodness"; it is a "tool for survival."

  ### Summary for Your Draft

  To reorganize your central section:
  1.  **Concede** that Xunzi admits natural *capacities* (cai) for learning.
  2.  **Deny** that these capacities constitute moral *sprouts* (duan).
  3.  **Argue** that the disagreement is about **directionality**, not possibility.
  4.  **Use the Overgeneralization:** Point out that if your original argument held, bronze casting would be moral nature. Since it isn't, the capacity to make bronze (wei) must be distinct from the nature (xing) that supplies the hands.
  5.  **Finalize:** The sages were not good because their nature was different; they were good because they used their natural cognitive faculties to *counteract* their natural emotional impulses.

  This preserves (1), (2), and (5), modifies (3) to avoid the collapse, and decisively rejects (7). It leaves you with a robust, substantive conflict: **Growth vs. Construction.**
