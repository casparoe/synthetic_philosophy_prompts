  7.  **Final Review against Constraints:**
      *   Did I summarize the history? No.
      *   Did I use the vocabulary correctly? (Check: stabilizability, feedforward, cost function, etc.)
      *   Did I answer the four mappings? Yes.
      *   Is the Residue Report the main thing? Yes.
      *   Tone: Academic, rigorous, engineering-focused.

  8.  **Constructing the Output:** (Self-Correction during drafting)
      *   *Correction:* Make sure not to sound like I'm teaching control theory. The user knows it. Use the jargon naturally.
      *   *Correction:* Ensure the distinction between "Popular Stoicism" (self-help) and "Classical Stoicism" (ethics) is maintained where relevant, as the prompt distinguishes them.
      *   *Emphasis:* The prompt asks for the *residue* to be the main thing. I should structure the response to lead into the residue report, using the four mappings as the derivation steps, but ensuring the table is the climax.

      *(Self-Correction on Mapping 3)*: Is there *really* no cost function rewriting? In Model Predictive Control (MPC), you can change weights online. In Adaptive Control, you change parameters. But changing the *teleological objective* ($Q$) based on ethical reasoning? That's Inverse Reinforcement Learning at best, but fundamentally, the "Designer" is outside the loop. The Stoic Sage is both Plant and Designer. This is the key friction point.

      *(Self-Correction on Mapping 1)*: The professor's point is crucial. Controllability is about $(A,B)$. If I move the actuators (redefine what "up to us" means), I change controllability. The Stoic move is to say "The only real actuators are judgments." This makes the system controllable by definition. It's a tautology disguised as discovery.

      *(Final Polish)*: Ensure the "Blame/Credit" section is sharp. Control theory has "Responsibility" in the sense of input-output mapping, but not "Moral Responsibility."

