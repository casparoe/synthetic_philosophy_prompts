      *   *Mapping 1 (Boundaries):* Stoics draw the line *inside* the mind. Control engineers draw the line based on actuator placement.
          *   *Insight:* The Stoic move is defining the *plant* such that the only output that matters is internal state (judgment), making externals disturbances. This is a choice of $C$ matrix (what we observe/care about) and system boundary, not necessarily physical reality.
      *   *Mapping 2 (Disturbances):* Popular Stoicism says "ignore externals." Control theory says "reject disturbances" (feedback) or "cancel disturbances" (feedforward). Ignoring $d$ leads to poor performance *if* the goal is tracking $y_{ref}$.
          *   *Insight:* If the goal ($y_{ref}$) is internal virtue, then externals *are* disturbances to be rejected (kept from affecting internal state). If the goal is external success, ignoring them is bad control. The popular version confuses the *goal*.
      *   *Mapping 3 (Cost Function):* Stoics say "change your desire." Control theory usually assumes $J = \int (x^T Q x + u^T R u) dt$ is fixed by the designer.
          *   *Insight:* Adaptive Control or Reinforcement Learning changes the policy, but usually to minimize a fixed $J$. Meta-control (changing $Q$) is rare in classical theory. This is a gap.
      *   *Mapping 4 (Authority):* Stoics say "don't waste effort." Control theory says "input constraints" ($|u| \le u_{max}$) or "ill-conditioned B matrix."
          *   *Insight:* This maps well. Trying to control an uncontrollable mode wastes energy (control effort) without reducing error.

  3.  **Drafting the Translation (Mental or Scratchpad):**

      *   *System:* Human Agent.
      *   *State ($x$):* Beliefs, judgments, physiological state.
      *   *Control Input ($u$):* Volition, assent, attention allocation.
