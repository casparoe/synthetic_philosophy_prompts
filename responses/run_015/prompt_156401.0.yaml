      *   **Specific Mappings to Test:**
          1.  Controllable subspace vs. "up to us" (Model property vs. Ontological claim? System boundary definition?).
          2.  Withdrawal of concern vs. Ignoring disturbances (Design error vs. Objective function shift?).
