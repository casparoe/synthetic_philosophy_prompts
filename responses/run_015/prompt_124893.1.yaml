answer: |-
  Your skepticism is well-founded. Your friend has constructed a coherent narrative, but it relies on a significant mix-up regarding Bernard Williams, a simplification of Appiah, and a non-sequitur conclusion about the utility of philosophy.

  Here is a breakdown of what is accurate, what is distorted, and what is simply wrong in her summary, followed by an analysis of whether her conclusion holds water.

  ### 1. The Bernard Williams Error (Major Factual Mistake)
  **The Claim:** Your friend says Williams argued slavery abolition was driven by industrial capitalism making slave labor unprofitable and embarrassing, with moral arguments as window dressing.
  **The Verdict:** **Wrong.** This is a conflation of two different people.

  *   **Bernard Williams** (1929–2003) was a moral philosopher known for *Ethics and the Limits of Philosophy* and *Shame and Necessity*. While he wrote about moral psychology and history, he did not advance a specific economic-historical thesis about the abolition of slavery in the British Empire.
  *   **Eric Williams** (1911–1981) was a historian and the first Prime Minister of Trinidad and Tobago. He wrote the famous book *Capitalism and Slavery* (1944), which argues exactly what your friend described: that British abolition was driven by the economic shift from mercantilism to industrial capitalism, which made slavery less profitable, and that humanitarian arguments were secondary.

  **Why this matters:** Your friend has attributed a Marxist-leaning historical materialist argument (Eric Williams) to a moral philosopher known for skepticism about moral theory (Bernard Williams). Bernard Williams *was* skeptical that abstract moral theory drives change, but he focused on "thick ethical concepts" (like *cowardice* or *brutality*) rather than economic profit. Attributing the economic argument to Bernard Williams undermines the philosophical nuance of his actual work.

  ### 2. Appiah on Dueling (Mostly Accurate, but Nuanced)
  **The Claim:** Appiah argues dueling died because the aristocracy realized it made them look barbaric to the middle class, whose respect they wanted.
  **The Verdict:** **Accurate in spirit, but slightly reductive.**

  In *The Honor Code: How Moral Revolutions Happen* (2010), Appiah does argue that the end of dueling (and foot-binding in China, and slavery in the British Empire) was driven by **honor**, not just abstract rights.
  *   **The Nuance:** It wasn't just that they looked "ridiculous." It was that the *code of honor* shifted. Previously, honor required defending your reputation with violence. Later, honor required self-control and "civility." The aristocracy didn't just care about economics; they cared about their *identity*. They wanted to be seen as "gentlemen," and the definition of "gentleman" changed to exclude violence.
  *   **The Role of Argument:** Appiah does not say argument was useless. He argues that moral arguments (pamphlets, sermons, plays) were essential *tools* to redefine what was honorable. However, those arguments only gained traction once the social psychology was ready to listen.

  ### 3. Williams vs. Appiah: Are they saying the same thing?
  **The Claim:** They both think norms collapse only when elites realize practices hurt interests or look bad.
  **The Verdict:** **Distortion.** They share a skepticism of "Platonic" moral realism (the idea that we just 'see' the Truth), but their projects differ.

  *   **Bernard Williams** was more skeptical about moral *progress*. He worried that modern moral philosophy (Kantianism/Utilitarianism) distorted how humans actually live. He emphasized that moral change is often a result of historical contingency and shifts in "ethical concepts," not necessarily rational improvement. He wouldn't say argument is useless, but he would say *theory* is often useless.
  *   **Kwame Anthony Appiah** is more optimistic (a meliorist). He believes we *can* engineer moral progress by understanding the psychology of honor. He explicitly writes philosophy to help shift these codes.

  Treating them as identical ignores that Appiah is trying to solve the problem Williams diagnoses. Williams says, "Moral theory doesn't capture the messiness of life." Appiah says, "Okay, but if we understand the messiness (honor/shame), we can use philosophy to fix things."

  ### 4. Honor-Worlds vs. Dignity-Cultures
  **The Claim:** This distinction reinforces that arguments only work once the culture has already shifted.
  **The Verdict:** **Misinterpretation.**

  Appiah distinguishes between **honor cultures** (where value is external, based on what others think of you) and **dignity cultures** (where value is internal, based on inherent rights).
  *   Your friend suggests this means arguments are powerless until the shift is done.
  *   Appiah's actual point is that **arguments must match the culture.** In an honor culture, you don't argue "Slavery violates human rights" (a dignity argument); you argue "Slave-owning is barbaric and unworthy of a British gentleman" (an honor argument).
  *   Therefore, moral philosophy is not useless; it is **strategic**. You have to craft the *right kind* of argument for the *right kind* of social psychology.

  ### 5. Does the conclusion follow? ("Moral Philosophy is Pointless")
  **The Claim:** If you care about ending a harmful norm, moral philosophy is useless; focus on shifting honor codes and material interests.
  **The Verdict:** **Wrong / Non-Sequitur.**

  This is the weakest part of your friend's summary.
  1.  **Redefining Honor *is* Philosophy:** Shifting an honor code requires redefining concepts like "courage," "civilization," or "manhood." That is a conceptual/philosophical task. When Appiah argues that dueling is incompatible with being a "civilized nation," he is making a philosophical claim about the meaning of civilization.
  2.  **Appiah's Counter-Example:** Appiah wrote a book of *philosophy* to argue that we should use honor to combat things like honor killings today. If philosophy were useless, his own project would be incoherent.
  3.  **The "Window Dressing" Trap:** Even if moral arguments are sometimes used as "window dressing" (as Eric Williams argued about slavery), they eventually become the reality. Once the aristocracy stopped dueling to look good, they eventually stopped believing dueling was good. The "lie" becomes the "truth." Philosophy cements the change.

  ### Summary of Corrections for Your Friend

  | Claim | Verdict | Correction |
  | :--- | :--- | :--- |
  | **Bernard Williams on Slavery** | **Wrong** | She is confusing **Bernard** Williams (philosopher) with **Eric** Williams (historian). Bernard did not argue slavery ended due to profit margins. |
  | **Appiah on Dueling** | **Accurate** | She gets the gist right: honor and social standing drove the change, not abstract rights. |
  | **Role of Rational Argument** | **Distorted** | Neither thinks argument is *useless*. They think *abstract* theory fails without social traction. Argument is the tool that reshapes honor. |
  | **Williams = Appiah** | **Distorted** | Williams is more skeptical of progress; Appiah is more prescriptive about how to achieve it. |
  | **Philosophy is Pointless** | **Wrong** | Redefining honor codes *requires* philosophical work. Appiah's entire career proves philosophy can influence these codes. |

  ### How to Respond
  You can tell your friend:
  *"I looked into it, and there's a major mix-up. The argument about slavery being about economics and profit is from the historian **Eric Williams**, not the philosopher **Bernard Williams**. Bernard Williams was more interested in how our ethical concepts (like shame) change, not just profit.*

  *Also, Appiah doesn't say philosophy is useless. He says we need to use philosophy to understand **how** honor works so we can craft better arguments. If we just look at material interests, we can't explain why people give up privileges (like dueling) that didn't actually cost them much money. They gave them up because their **identity** changed. Changing identity is a philosophical project, not just an economic one."*

  This preserves the insight (that social psychology matters more than abstract logic) without accepting the cynical conclusion (that reasoning doesn't matter).
