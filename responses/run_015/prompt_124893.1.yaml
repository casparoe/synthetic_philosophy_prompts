      *   *Section 2: Appiah on Dueling (The Honor Code).* The friend is mostly right here, but misses the nuance. Appiah says honor *codes* change, and moral argument is part of that change, not external to it. It's not just "looking ridiculous," it's about identity.
      *   *Section 3: The Role of Rational Argument.* Both philosophers reject "Platonic" moral realism (seeing the Form of the Good), but they don't reject reasoning. They reject *abstract* theory in favor of *situated* reasoning.
      *   *Section 4: The "Moral Philosophy is Useless" Conclusion.* This is the pragmatic takeaway. Show why it's wrong. Philosophy helps redefine the concepts (e.g., what counts as "honorable"). Appiah is literally doing philosophy to change honor codes.
