  2. **Measure and Amplitude Considerations**
  Under the Born Rule, surviving branches often possess vanishingly small measure. While the insured expects survival, the statistical weight of these branches is negligible from an external perspective. High-risk setups result in surviving branches with amplitudes approaching zero. Consequently, the probability of finding oneself in a solvent surviving branch decreases exponentially with each trigger pull. Premiums must reflect the inverse square of the surviving amplitude to account for the rarity of the outcome. Insuring high-amplitude survival requires prohibitive capital reserves, as the company must remain solvent across the multiverse aggregate.

  3. **Communication and Verification Barriers**
  Successful survival runs cannot be reported to beneficiaries. Communication requires entanglement, which is severed upon branch decoherence. The insured cannot notify the claims department from a branch where the beneficiary believes them dead. Verification relies solely on third-party death certification within the claimant's branch. We cannot accept testimony from the insured regarding their own survival, as such testimony is physically inaccessible to the adjudicator.

  4. **Branch Integrity and Mangled Worlds**
  We retained Dr. Helena Voss (MIT) to assess branch quality regarding Mangled Worlds theory. She notes, "Mangled-worlds dynamics suggest surviving branches suffer increasing environmental degradation. The insured may survive, but into realities with compromised infrastructure." Claims involving reality degradation fall under standard catastrophe clauses. We do not cover existential instability or physics engine failures. The apparatus must not destabilize the local vacuum state.

  5. **Coverage Scope and Limitations**
  Policies cover only quantum-triggered cessation. Natural causes, aging, or classical accidents in surviving branches remain excluded. The apparatus insures against the specific quantum event, not general mortality. An insured surviving a quantum trigger but dying of a heart attack in the surviving branch constitutes a standard denial.

  6. **Legal Strategy and New Product Riders**
  Legal confirms payout turns on third-party certification of death, not subjective continuity. The company takes no position on whether the insured is alive, only on whether the payee is owed money. To address amplitude risk, we are launching a rider priced by branch amplitude. Premiums scale with the inverse square of the amplitude; benefits are collectable only in branches where the insured survives. Actuarial analysis indicates any policy the insured can personally collect on is unaffordable, and any affordable one can only be collected by the widow. This creates a natural market segmentation based on observer state.

  Effective immediately, we are launching the World-Indexed Death Obligation Warranty pilot program. Acronym: W.I.D.O.W. All claims adjusters must complete the associated certification module by Q1.
