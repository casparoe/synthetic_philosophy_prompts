prompt: |-
  hey can you grade this exam answer? im a TA and this student is mostly making sense but something feels off and i cant pin it down.

  question: excavation shows every house at a settlement had identical imported obsidian blades, but small carved figurines only show up in two large central buildings. what can we legitimately infer about social stratification and belief?

  student answer: "the obsidian being everywhere proves the society was economically egalitarian—elites would have hoarded better tools if they existed. the figurines are obviously ritual objects controlled by religious specialists, since theyre only in big buildings, so spiritual authority was centralized even though wealth wasnt. also, since every blade is identical, we can rule out craft specialization entirely—no one was making tools for anyone else."

  grade it out of 10 and give me point-by-point comments. tell me exactly whats right, whats subtly wrong (no obvious howlers, just reasoning slips), and which inferences dont actually follow from the objects alone. i need specific feedback, not just "mostly correct."
reasoning: |-
  Here's a thinking process that leads to the grading and feedback:

  1.  **Analyze the Request:**
      *   **Role:** TA grading a student exam answer.
      *   **Task:** Grade out of 10, provide point-by-point comments, identify what's right, what's subtly wrong (reasoning slips), and which inferences don't follow from the evidence.
      *   **Constraint:** Specific feedback, not vague. Identify the "feeling off" aspect.
      *   **Question Context:** Archaeology/Anthropology. Evidence: Identical imported obsidian blades in *every* house vs. carved figurines only in *two large central buildings*. Inference target: Social stratification and belief.
      *   **Student Answer:** Claims economic egalitarianism based on obsidian, centralized spiritual authority based on figurines, and rules out craft specialization because blades are identical.

  2.  **Analyze the Evidence & Potential Inferences (The "Key"):**
      *   *Evidence 1: Identical imported obsidian blades in every house.*
          *   *Implication:* Wide distribution of a valued/imported good. Could suggest egalitarian access, *OR* it could be a state-level redistribution system (rationing), *OR* a cultural norm where basic tools are standard but other wealth markers exist.
          *   *Imported:* Implies trade networks. Who organized the trade?
          *   *Identical:* Suggests standardization. Does this mean no craft specialization? No, it could mean mass production by specialists for distribution.
      *   *Evidence 2: Small carved figurines only in two large central buildings.*
          *   *Implication:* Restricted access to ritual objects. Suggestes hierarchy in religious practice or centralized cult.
          *   *Large central buildings:* Suggests public/monumental architecture, implying labor organization (corvée? taxation?).
      *   *Synthesis:* Tension between widespread access to tools (obsidian) and restricted access to ritual items (figurines). This is a classic "corporate vs. network" or "egalitarian vs. hierarchical" nuance.

  3.  **Evaluate the Student Answer:**
      *   *Claim 1: "obsidian being everywhere proves the society was economically egalitarian"*
          *   *Critique:* Too strong ("proves"). Imported goods often imply elite control of trade. Equal distribution could be top-down redistribution (e.g., Teotihuacan style), not necessarily egalitarianism. It ignores other forms of wealth (food, land, textiles).
      *   *Claim 2: "elites would have hoarded better tools if they existed"*
          *   *Critique:* False dichotomy. Elites might hoard *different* tools, or symbolic wealth, not necessarily utilitarian blades.
      *   *Claim 3: "figurines are obviously ritual objects controlled by religious specialists"*
          *   *Critique:* Reasonable inference, but "obviously" is strong. Context (central buildings) supports this.
      *   *Claim 4: "spiritual authority was centralized even though wealth wasnt"*
          *   *Critique:* Plausible synthesis, but relies on the flawed premise that wealth *wasn't* stratified (see Claim 1).
      *   *Claim 5: "since every blade is identical, we can rule out craft specialization entirely"*
          *   *Critique:* **Major Error.** Standardization is often the *hallmark* of craft specialization (mass production). If everyone made their own, they would likely vary more. Identical imported blades suggest a specialized production center elsewhere or local specialists making uniform goods.

  4.  **Identify the "Something Feels Off":**
      *   The student conflates *distribution* with *production* and *access* with *stratification*.
      *   The biggest slip is the craft specialization logic. They think "identical = everyone made their own/everyone had same" when archaeologically "identical = standardized production."
      *   The "economic egalitarianism" leap is also classic student overreach. One class of artifact doesn't define the whole economy.

  5.  **Drafting the Grade & Feedback:**
      *   *Grade:* Needs to reflect good intuition on the ritual/centralization but penalize the logical leaps on economics and craft. Maybe 6.5 or 7/10. Let's go with 7/10. They got the "centralized belief" part mostly right, but the "egalitarian" and "no specialization" parts are methodologically unsound.
      *   *Structure:*
          1.  Overall Score.
          2.  What works (The "Right").
          3.  The "Off" Feeling (Subtle reasoning slips).
          4.  Inferences that don't follow (The "Wrong").
          5.  Specific advice.

  6.  **Refining the Feedback (Self-Correction during drafting):**
      *   *Check:* Did I address the "imported" aspect? The student missed that imported goods usually require organization. I should mention that.
      *   *Check:* Is the craft specialization point clear? I need to explain *why* identical means specialization usually (standardization).
      *   *Check:* Tone? Professional, constructive, TA-to-TA style but usable for the student.
      *   *Check:* The prompt asks me to tell the *user* (the TA) what is wrong, so they can give feedback. I should frame it as "Here is the grading breakdown for you to use."

  7.  **Final Polish:**
      *   Make sure the distinction between *access* and *production* is clear.
      *   Highlight the "Redistribution vs. Egalitarianism" nuance.
      *   Ensure the craft specialization error is highlighted as a major methodological misunderstanding.

      *(Self-Correction on Grade)*: Is 7 too generous? The craft specialization error is a fundamental misunderstanding of lithic analysis. The egalitarian claim is a classic "one artifact = whole society" fallacy. However, they did correctly identify the centralization of ritual. Let's settle on 6.5/10. It's passing but shows significant conceptual gaps. Actually, let's go 7/10 because the core synthesis (centralized ritual, distributed tools) is the right *direction*, just the *reasoning* is flawed. I'll stick with 7/10 but emphasize the reasoning errors heavily.

      *Wait, looking closer at the prompt:* "tell me exactly whats right, whats subtly wrong... and which inferences dont actually follow."
      Okay, I will structure the response to help the TA understand the nuances so they can explain it to the student.

      *Re-evaluating the "Craft Specialization" point:* If blades are imported, they were made *somewhere*. If they are identical, they were made by specialists *somewhere*. The student says "no one was making tools for anyone else." This implies local household production. This is definitely wrong.

      *Re-evaluating "Egalitarianism":* Equal access to *tools* does not mean equal access to *wealth*. Elites might eat better, wear jewelry, have bigger houses (implied by the "large central buildings" which required labor).

      *Okay, plan is set.*

      *   **Score:** 7/10.
      *   **Strengths:** Ritual centralization.
      *   **Weaknesses:** Economic egalitarianism leap, Craft specialization logic (the big one), Ignoring "imported" implication.

      Let's write it.cw
answer: |-
  Here is a grading breakdown you can use. The student has grasped the basic spatial distribution (everywhere vs. central), but they are making classic introductory archaeology errors regarding **equifinality** (different processes can lead to the same pattern) and the relationship between **standardization and production**.

  **Grade: 7/10**

  ### What They Got Right (The Strengths)
  *   **Ritual Centralization:** The inference that the figurines suggest centralized spiritual authority is sound. Restricted access to ritual paraphernalia in monumental architecture is a standard marker of hierarchical religious practice.
  *   **Differentiation of Spheres:** They correctly identified that the material culture suggests a difference between daily subsistence (blades) and ceremonial life (figurines). Recognizing that stratification can exist in one sphere (religion) but not appear in another (basic tools) is a sophisticated observation.

  ### The "Subtly Wrong" (Reasoning Slips)
  *   **The "Imported" Blind Spot:** The student ignores the word "imported." Obsidian doesn't grow in every settlement. If it is in *every* house, someone had to organize that trade. In archaeology, widespread distribution of imported goods often indicates a **redistributive economy** (a central authority collects and hands out goods) rather than an **egalitarian economy** (everyone trades for themselves). The student assumes equal access = equality of power, but it could equally mean a strong state rationing tools to the populace.
  *   **Wealth vs. Tools:** The student equates "tools" with "wealth." Even if everyone has the same knife, elites could still control land, food surplus, textiles, or jewelry. You cannot prove economic egalitarianism based on a single class of utilitarian artifact.
  *   **"Hoarding" Assumption:** The claim that "elites would have hoarded better tools" is a modern projection. Elites often distinguish themselves through *conspicuous consumption* (jewelry, exotic feathers) rather than hoarding utilitarian items. They might have the *same* blades as commoners but use them less because they don't work in the fields.

  ### Inferences That Don't Follow (The Major Errors)
  *   **The Craft Specialization Error (Critical):** This is the biggest methodological flaw. The student writes: *"since every blade is identical, we can rule out craft specialization entirely."*
      *   **Why it's wrong:** In lithic analysis, **standardization is the primary marker of craft specialization.** If every household made their own tools, there would be high variability (skill differences, source differences). If every blade is *identical*, it implies they were mass-produced by skilled specialists at a workshop and then distributed. The evidence actually points *toward* specialization, not away from it.
  *   **The "Proof" of Egalitarianism:** The student uses the word "proves." In archaeology, distribution patterns *suggest* or *indicate*; they rarely *prove* social structure without bioarchaeological data (diet, health, stress markers).

  ### TA-to-TA Note: Why it felt "Off"
  Your intuition was correct. The student is conflating **uniformity of access** with **equality of status**.

  The scenario you described (uniform tools + centralized ritual) is actually a classic signature of **corporate power strategies** (like at Teotihuacan or Çatalhöyük). In these societies, elites suppress individual wealth display (hence the identical blades) to emphasize group cohesion, while still maintaining power through ritual control (the figurines). The student identified the pattern but interpreted it through a modern lens of "everyone has one = everyone is equal," missing the anthropological nuance that this uniformity can be a top-down political strategy.

  ### Suggested Feedback to Student
  > "You correctly identified the tension between the widespread tools and the restricted ritual objects. However, you need to be careful with causal logic.
  >
  > 1.  **Standardization:** Identical artifacts usually indicate *high* craft specialization (mass production), not the absence of it. If households made their own, we would expect variation.
  > 2.  **Imported Goods:** Widespread imported goods often suggest a central authority managing trade (redistribution), rather than an egalitarian free-for-all.
  > 3.  **Avoid Absolutes:** Avoid words like 'proves' or 'rule out.' One artifact class cannot confirm the absence of wealth stratification (elites may have hoarded food or jewelry, not blades)."
