  *   **Reversal:** Under NBS, the Union had a 19-point advantage ($0.64$ vs $0.45$). Under the new KSS, shares are equal ($0.75$ vs $0.75$). The Union's relative advantage is eliminated; the City catches up completely.
      *   *Note on Constraint:* Strict "reversal" (City > Union) is mathematically impossible under KSS as it equalizes shares by definition. This case achieves the "nearest miss": the elimination of the Nash winner's advantage.

  **2. Menu-Expanding Test (Monotonicity)**
  *   **Action:** Add Option E: $(40, 55)$.
  *   **Ideal Point:** $40 < 100$ and $55 < 70$. **$u$ remains $(100, 70)$.**
  *   **New Frontier:** Segments B$\to$E and E$\to$C bulge outward from the original B$\to$C line.
  *   **NBS Outcome:**
      *   Segment B$(50,40)$ to E$(40,55)$ has slope $-1.5$. Line: $x_2 = -1.5x_1 + 115$.
      *   Max product on this line: $x_1 = 38.33$ (Outside range $[40, 50]$). Max is at **E (40, 55)**. Product = 2200.
      *   Original NBS Product was 2025. New NBS is **E (40, 55)**.
      *   **Impact:** City payoff drops ($45 \to 40$). Union payoff rises ($45 \to 55$). One party (City) is strictly worse off.
  *   **KSS Outcome:**
      *   The feasible set has expanded ($S \subset S'$). The ray from $d$ to $u$ intersects the new frontier further out.
      *   Original KSS was $(53.6, 37.5)$. New intersection must satisfy $x_{new} \ge x_{old}$.
      *   **Impact:** Both parties weakly better off (Monotonicity holds).

  ---

  ### Analysis of Structural Features

  **Your Hypothesis:** You hypothesized that the slope of the frontier relative to the diagonal and the sensitivity of the ideal point are load-bearing. **This is correct.**

  1.  **Frontier Slope vs. Diagonal:** In the "normalized" coordinates (share of ideal gain), the NBS point is determined by where the frontier's slope equals $-1$ (tangent to the hyperbola $s_1 s_2 = k$). The KSS point is where the frontier crosses the 45-degree line ($s_1 = s_2$). In this case, the frontier crosses the 45-degree line at a steeper slope (in absolute value) than where it is tangent to the Nash hyperbola. This geometric misalignment forces the NBS to slide toward the Union (Party 2), while KSS stays on the diagonal.
  2.  **Ideal Point Sensitivity:** The KSS outcome is hostage to the Extreme Option (A). Option A sets $u_1=100$. Because $u_1$ is so large, the KSS diagonal is shallow ($0.7$), intersecting the frontier far to the right (favoring the City). When A is removed, $u_1$ collapses to 50. The diagonal steepens ($1.4$), shifting the KSS outcome leftward (favoring the Union). The NBS ignores A entirely because A is not on the "active" frontier supporting the product maximum.

  **KSS Share Position:** In this case, the KSS share ($0.536$) lies **between** the two NBS shares ($0.45$ and $0.643$). This is typical when the frontier is concave and monotonic; the equal-share point must lie between the product-maximizing points for each party.

  ---

  ### Degeneracy: Lifting Non-Fungibility

  If cash side payments were unrestricted, the feasible frontier would become a straight line with slope $-1$ (assuming transferable utility).
  *   **Result:** The NBS and KSS would **coincide** at the midpoint of the surplus (assuming symmetric disagreement).
  *   **Why it Matters:** The entire disagreement between the rules vanishes. The divergence relies entirely on the **curvature** of the frontier, which is generated by the non-fungibility of safety vs. budget. If the frontier is linear, the slope is constant, and the point maximizing the product is the same point that equalizes proportional gains (given symmetric $d$). Your workshop must emphasize that these rules only compete in **non-transferable utility (NTU)** environments.

  ---

  ### Strategic Withholding and Steelman Replies

  **The Conflict:** You asked for a reversal where the Nash winner becomes the KSS loser after deletion. As noted, KSS *always* equalizes shares. The "reversal" here is the elimination of the Union's advantage.

  **Strategic Withholding:**
  *   **Under Nash:** Parties have an incentive to **hide options that improve the other side's ideal point** or change the curvature near the solution. In the Expanding Test, adding Option E hurt the City. A strategic City would withhold Option E from the table to keep the NBS at $(45, 45)$.
  *   **Under Kalai-Smorodinsky:** Parties have an incentive to **inflate their own ideal point**. The City benefited massively from Option A (Extreme), even though A was not chosen. By keeping A on the table, the City anchored $u_1$ high, pulling the KSS diagonal toward itself. A strategic City would *never* remove A; a strategic Union would try to discredit A as infeasible to lower $u_1$.

  **Steelman Replies:**
  *   **For Nash:** It is **efficient**. In the Expanding Test, the new NBS (Option E) had a higher product (2200 vs 2025). Nash adapts to new value-creating opportunities. KSS merely moves along the ray, potentially missing efficiency gains that don't align with the proportional split.
  *   **For Kalai-Smorodinsky:** It is **monotonic**. As shown in the Expanding Test, adding an option never hurts anyone under KSS. Under Nash, adding an option (E) made the City worse off. An arbitrator using Nash faces a paradox: "I found a better deal for everyone, but applying my rule makes one party pay for it." KSS avoids this instability.

  **Recommendation:** If the arbitrator's priority is **stability and fairness of process** (no party punished for expanding the pie), use Kalai-Smorodinsky. If the priority is **economic efficiency** (maximizing joint value), use Nash, but expect parties to strategically withhold options to manipulate the curvature.
