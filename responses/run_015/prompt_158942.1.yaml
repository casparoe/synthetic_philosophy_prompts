  OFFICE FOR PHENOMENAL INTEGRATION
  OPERATIONAL DIRECTIVE 74-B: CASEWORKER GUIDANCE ON CONSTITUTIVE SUBJECTIVITY PROTOCOLS
  TO: All Regional Integration Officers
  FROM: Deputy Director of Metaphysical Compliance
  DATE: [Redacted]

  This directive supersedes all previous guidance regarding the administration of conscious entities under the Constitutive Micropsychism Act. Officers are reminded that the stability of the national phenomenal economy depends on the seamless integration of micro-subjects into macro-legal persons. Failure to adhere to these protocols may result in ontological instability claims.

  1. **Qualitative vs. Subjective Composition:** Officers must distinguish between the merging of phenomenal qualities and the merging of phenomenal subjects. The former is processed under Standard Merger Guidelines, as colours and sounds combine readily. The latter constitutes a Class-4 Subjective Unification Event. Do not attempt to explain how multiple viewpoints become one; simply stamp the form 'Unified' provided the citizen exhibits coherent speech patterns. The difficulty of the second file is a known administrative burden and is not to be discussed in public forums.

  2. **The Bonding Relation:** It is Ministry doctrine that the relation binding micro-subjects is not itself experience-bearing. Applications for Second-Order Bonding (Form 12-B) are to be summarily refused. If the bond required a bond, the paperwork would be infinite. Assert that the bonding relation is structural, not phenomenal, despite the lack of structural evidence. Any officer caught suggesting the bond itself feels something will be reassigned to the Dust Theory Unit.

  3. **Introspective Resolution:** Citizens frequently petition to access the micro-level qualities constituting their experience. These petitions are denied. Explain that macro-subjects operate at a lower resolution than their constituent parts. Funding for phenomenal microscopy has been suspended indefinitely. Do not acknowledge that this implies the macro-subject is a blur rather than a unity. The citizen is the resolution limit; there is no deeper layer they are permitted to view.

  4. **Boundary Adjudication:** Disputes arise regarding which collections of micro-subjects gain entitlement to a macro-subject. A human brain qualifies; a handshake does not. When asked for the principle distinguishing these, cite Regulatory Threshold 9. Do not engage in metaphysical debate regarding vagueness. If the citizen claims their crowd constitutes a subject, refer them to Public Order statutes. We administer subjects, not gatherings.

  5. **Intrusive Phenomenal Reports:** Reports of citizens undergoing experiences that are not theirs are common. Usually, this is a filing error where micro-experiences leak into macro-awareness. Advise the citizen that these are not 'their' experiences but merely experiences they 'host'. If they insist on ownership, process under Mental Health Act provisions rather than Phenomenal Integration statutes. Ownership implies unity; hosting implies composition. Maintain the distinction.

  6. **Surgical Decomposition:** In cases of callosal surgery, a single registered subject may apply to be recognised as two. Approve the split without noting that this implies the original unity was contingent on physical connectivity rather than metaphysical necessity. Issue two new tax IDs. Do not ask where the original subject went. The continuity of the subject is an administrative convenience, not a metaphysical guarantee.

  7. **Top-Down Variance (Cosmopsychism):** The Cosmopsychism Unit handles cases where the basic subject is cosmic and divides into smaller units. They face the symmetrical difficulty of explaining how One becomes Many. Coordinate with them on Decomposition forms, but maintain separate filing cabinets. Their problems are identical to ours, merely inverted, and acknowledging this causes morale issues. Do not attend their inter-departmental mixers.

  8. **Prohibited Ontological Shortcuts:** Caseworkers are reminded of two prohibited explanations. First, do not suggest the merger produced something genuinely new (Brute Emergence); this violates the Constitutive Doctrine. Second, do not suggest the merged entity was never there (Eliminativism); this voids the citizen's legal standing. Both options cancel the motive for this Office's existence. To suggest either is to suggest the Office is redundant. Redundancy reviews are conducted annually. Process all cases as if the doctrine is workable, despite accumulated evidence to the contrary.

  ***

  This piece leans on the assumption that constitutive micropsychists are committed to preserving macro-subjects without emergence. It exaggerates the bureaucratic capacity to ignore metaphysical gaps. The readers entitled to say the satire misses them are indeed the cosmopsychist, for whom combination is not the problem, and the eliminativist micropsychist, who denies macro-subjects exist. Both avoid the Combination Problem's central trap: trying to have constitutive micro-subjects and robust macro-subjects without emergence. The satire targets those who want both.
