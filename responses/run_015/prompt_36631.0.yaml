  This isn't pattern-matching to intuitions; it's rigorously calculating which policy maximizes expected utility before you update on observations. In the mugging, the "Pay" policy wins because it captures value in a counterfactual world governed by chance. In blackmail, the "Don't Pay" policy wins because the threat itself is governed by your logic, not chance. The theory isn't asking "which outcome feels better?" but "which algorithm, when run by the predictor, results in the highest utility across the probability distribution?" The asymmetry lies in whether your compliance creates value or instantiates the threat, and that's a structural fact, not a gut check.
