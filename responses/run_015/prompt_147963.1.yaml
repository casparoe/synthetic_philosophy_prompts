answer: |-
  1. If economic growth relies on accumulating immobile capital like grain storage, it structurally necessitates hierarchy by creating assets that elites can monopolize and defend against exit. Sustaining equality may therefore require limiting the accumulation of monopolizable assets rather than just redistributing income.
  2. Climate adaptation requires preserving institutional mobility rather than building fixed defenses, because rigid systems lose the option value needed to pivot when environmental thresholds are breached. We must design governance that allows for strategic retreat and reorganization instead of doubling down on failing infrastructure.
  3. Modern inequality becomes irreversible because specialized infrastructure creates exit barriers that trap populations within failing systems, eliminating the counterfactual resilience once provided by subsistence alternatives. Breaking this requires decentralizing essential services so survival does not depend on participation in hierarchical markets.
  4. True resilience demands maintaining redundant, low-efficiency livelihood options alongside optimized markets, mirroring the forager's diverse portfolio to prevent total collapse during systemic shocks. Efficiency maximization is actually a vulnerability multiplier when it eliminates the slack necessary for adaptation.
  5. Political freedom depends on retaining the practical ability to opt-out of centralized provisioning, ensuring citizens hold leverage against hierarchy rather than becoming dependent on state surplus. Without an exit option, consent becomes coerced by the threat of starvation or homelessness inherent in fully monetized societies.
