  2. What's right in it
  The technical core is largely correct. Skolem did prove that if ZFC is consistent, it possesses a countable model (the Downward Löwenheim-Skolem theorem). Consequently, within such a model, there exists a set $S$ that the model "believes" is uncountable because no bijection between $S$ and the natural numbers exists *inside* the model. However, from an external perspective, the domain of the model is countable, so $S$ is indeed countable. The model "misses the pairing functions"; the bijection exists externally but is not in the model's collection. This relativity of set-theoretic notions is the actual paradox.

  3. Where it goes wrong
  The critical error is claiming set theory contradicts itself. There is no contradiction because "uncountable" is relative to the model. ZFC proves "there exists an uncountable set," meaning "there exists a set with no internal bijection to $\omega$." In a countable model, this statement holds true because the specific bijection proving countability exists outside the model, not inside. ZFC remains consistent; the properties are just model-relative. Furthermore, mathematicians do not ignore this. It is a standard topic in logic courses. They don't pursue large cardinals despite the paradox; they study them because the hierarchy is fruitful for proving consistency strengths and solving problems like Projective Determinacy. The paradox highlights limitations of first-order logic, not flaws in ZFC. It shows first-order logic cannot categorically characterize infinity, but this is a known feature, not a bug causing inconsistency. His claim implies negligence or dishonesty, which is untrue; the community accepts the relativity of countability as a fundamental insight into formal systems. The contradiction claim confuses truth within a model with truth about the model. ZFC is satisfied internally, even if the external view differs. This distinction preserves consistency entirely. The accusation that they want "big cardinalities" despite a contradiction misrepresents their motivation. They seek consistency strength and explanatory power. Therefore, the claim of ignored contradiction is factually incorrect regarding both the math and the sociological behavior of mathematicians.

  4. The hidden-variable addition
  The hidden-variable analogy is philosophically interesting but not supported by Skolem's result. Skolem showed any model is externally countable, not that a privileged "true" countable universe hides behind the scenes. Suggesting a "true" universe implies a realist perspective Skolem might have favored, but the theorem doesn't prove this ontology. It shows formalism cannot pin down cardinality absolutely. The hidden-variable comparison suggests incomplete knowledge of a deterministic reality, whereas Skolem's paradox suggests the concept of "set" is inherently relative to the logical framework. It's an interpretative leap, not a mathematical consequence. Logic doesn't fail to reach a true universe; rather, no single first-order theory can uniquely describe one.

  5. Bottom line
  No, he is not right about an ignored contradiction. There is no contradiction because truth in ZFC is model-relative. Mathematicians acknowledge Skolem's Paradox fully; it is a foundational result, not a secret flaw. They pursue large cardinals because the theory is consistent. Your roommate confuses the relativity of truth with inconsistency. The paradox reveals limitations in first-order logic's expressive power, not a failure of set theory. It is fully understood and accepted within the community.
