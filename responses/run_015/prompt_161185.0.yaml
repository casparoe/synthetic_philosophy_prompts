answer: |-
  Here is the session plan. It is designed for 45 minutes, optimized for a technical crowd that defaults to computational analogies.

  ### 1. The Carrying Example: "The Triggered Trap"

  Do not use software. Do not use clocks (too much shared geometry). Use a **Mousetrap**.

  **What it has:**
  *   **A Binary State:** "Set" vs. "Triggered." This maps cleanly to "In Pain" vs. "Not In Pain."
  *   **Radical Physical Heterogeneity:**
      1.  Classic wood/spring (mechanical tension).
      2.  Glue board (chemical adhesion).
      3.  Bucket of water balanced on a stick (gravity/leverage).
      4.  Electric circuit that shocks when continuity is broken (electromagnetic).
  *   **A Clear Causal Role:** The state "Triggered" *causes* the mouse to be caught. The physical mechanism is irrelevant to the *catching*, only to the *triggering*.

  **What it lacks:**
  *   **Shared Microstructure:** There is no single physical property (voltage, tension, viscosity) shared by all four traps.
  *   **Shared Algorithm:** There is no "code" running on the glue board. It is not "portable software." It is a causal role filled by disparate physics.
  *   **A Unified Reduction:** You cannot write a single equation in physics that describes "Triggered" across all four without using the functional word "Triggered."

  **Why this works:** It forces the "programmers" to abandon the "same code, different hardware" intuition. A glue board does not "run" the same program as a spring trap. They just do the same *job* using incompatible physics. This creates the **Scatter** you need.

  ---

  ### 2. Dependency Order & Whiteboard Layout

  **Time:** 0:00 – 0:45
  **Board Zones:**
  *   **Left:** The Target Theory (Identity).
  *   **Center:** The Trap Examples (The Scatter).
  *   **Right:** The Implications (Mind & Objections).

  **Sequence:**

  1.  **0:00–0:05: The Target (Left Board)**
      *   Write: **Type Identity Theory**.
      *   Definition: "Mental State M = Physical State P." (e.g., Pain = C-Fiber Firing).
      *   *Do not* introduce Type/Token distinction yet. Let them feel the rigidity of the claim first.

  2.  **0:05–0:15: The Trap Intuition (Center Board)**
      *   Draw the four traps. Label the state "TRIGGERED."
      *   Ask: "What physical property do all 'Triggered' traps share?"
      *   Let them struggle. They will try to find a common denominator (energy transfer, entropy). Push back: "The glue board relies on viscosity, the spring on tension, the bucket on gravity. Is there a *single* physical variable $X$ such that Triggered = $X$?"
      *   **Goal:** Establish that "Triggered" is a *functional kind*, not a *physical kind*.

  3.  **0:15–0:25: Mapping to Mind (Right Board)**
      *   Map "Triggered" to "In Pain."
      *   Map "Trap Mechanism" to "Neural Substrate."
      *   Argument: If Pain is like "Triggered," and Substrates are like "Trap Mechanisms," then Pain cannot be identical to one specific substrate (C-Fibers).
      *   **Now** introduce the terminology: This is an argument against *Type Identity*. It allows *Token Identity* (this specific pain is this specific firing), but denies the general law.

  4.  **0:25–0:35: The Objection Gauntlet (Right Board)**
      *   Address the misconceptions here (see Map below).
      *   Crucially, address the "Disjunction" objection here.

  5.  **0:35–0:40: The Comprehension Check**
      *   Ask the Final Question (see below).

  6.  **0:40–0:45: Wrap & Boundaries**
      *   State what you are *not* solving.

  ---

  ### 3. Misconception Map

  | Misconception | When it arises | How to defuse it (Script/Move) |
  | :--- | :--- | :--- |
  | **"It's just software on different hardware."** | During the Trap Example (0:10). | **Pre-empt it.** Explicitly say: "I am not talking about Python running on ARM vs. Intel. That is *clustered* realizability (shared logic gates). A glue trap is not running code. It is physics doing a job. We need *scatter*, not portability." |
  | **"So the mind isn't physical at all?"** | During Mapping (0:20). | **Clarify Functionalism.** "No. Every trap is physical. Every mind is physical. The claim is just that 'Pain' isn't a *physics category* like 'Electron.' It's a *biology/engineering category* like 'Trap.'" |
  | **"Fine, Token Identity then. Problem solved."** | During Objections (0:30). | **Concede & Pivot.** "Yes, Token Identity survives. But that kills the *reductionist* hope. You can't reduce psychology to neuroscience if every species needs a different bridge law. Science wants laws, not lists." |
  | **"Just define Pain as the disjunction (A or B or C...)."** | During Objections (0:32). | **The 'Natural Kind' Pushback.** "You *can* do that. But 'C-Fibers OR Octopus-Ganglia OR Silicon-Gates' is not a *natural kind*. It doesn't appear in the laws of physics. It's a list. MR argues mental states are real patterns that cut across physical lists." |
  | **"At what grain do we describe the realizers?"** | During Objections (0:34). | **Park it.** "This is the 'Grain Problem.' If we describe them abstractly enough, they look the same. But if we describe them physically enough, they look different. MR says the *psychological* grain is the real one for psychology. Don't let physics bully psychology out of existence." |

  ---

  ### 4. The Final Comprehension Question

  Do not ask "Do you understand?" Ask this:

  > **"If we discover an alien that feels pain, but its 'neurons' use hydraulic pressure instead of electricity, does MR say:**
  >
  > **A)** We just need to update our code to run on their hardware?
  > **B)** We need to admit 'Pain' is a job description that their hydraulics are fulfilling, even if it shares no physics with our electricity?"

  *   **If they pick A:** They fell for the Software/Hardware trap (Portability).
  *   **If they pick B:** They grasped the Scatter/Functional point.

  ---

  ### 5. Out of Bounds (Refuse to Engage)

  Explicitly write these on the bottom of the board at the start and say: *"We are not touching these today. They are rabbit holes."*

  1.  **Qualia:** "What it feels like." (MR is about classification, not subjective experience).
  2.  **Dualism:** "Is the mind a ghost?" (MR is compatible with physicalism; don't let them drift into substance dualism).
  3.  **AI Sentience:** "Can a chatbot feel pain?" (This distracts from the metaphysical argument about identity).

  ### Facilitator Notes for the "Disjunction" Objection
  You mentioned you have no answer to the disjunction objection ("Fine, Pain = C-Fibers OR Octopus-Fibers..."). **Don't fake an answer.**
  *   **Your move:** Admit this is the strongest counter-argument (from Jaegwon Kim).
  *   **The pivot:** "If you accept the disjunction, you save Physicalism, but you lose **Reductionism**. You are saying Psychology cannot be reduced to Physics, only mapped to it. That is still a victory for Multiple Realizability, because it proves mental states are autonomous from physical states."
  *   This keeps the session honest without requiring you to solve a 40-year debate in 3 minutes.
