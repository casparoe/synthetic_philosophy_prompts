answer: |-
  This is a specification for a moral technology. You are asking for a decision procedure that honors the metaphysical status of persons (as separate ends) while functioning as an administrative tool (which requires aggregation and closure). Below are the desiderata an adequate account must meet, followed by an analysis of their compatibility and a scorecard of candidate theories.

  ### I. The Desiderata

  I have categorized these by their function. Each is marked as **Non-Negotiable** (a constraint on the institution's legitimacy) or **Contested** (a substantive moral commitment about which reasonable people disagree).

  #### 1. The Constraint of Addressability
  *   **Requirement:** The justification provided to a rejected claimant must cite reasons that are valid *from their standpoint*, not merely from the standpoint of the universe. It cannot rely on the claimant accepting that their moral weight is fungible with others'.
  *   **Case:** The "Total Welfare" refusal ("you were outweighed"). This treats the claimant as a container for value rather than a source of claims.
  *   **Status:** **Non-Negotiable.** Given your institutional constraint (written explanations owed), a theory that cannot generate an agent-relative justification is operationally dead.

  #### 2. The Constraint of Non-Instrumentalization
  *   **Requirement:** The protocol must distinguish between *aggregating benefits across recipients* and *using one person as a resource for others*. A person cannot be violated to extract benefit for others, even if the net benefit is massive.
  *   **Case:** The Transplant Case (kill one healthy person to save five).
  *   **Status:** **Non-Negotiable.** This is the baseline distinction between a relief fund and a predatory regime. If the fund conscripts a claimant's rights to satisfy others, it ceases to be a relief institution.

  #### 3. The Requirement of Number-Sensitivity
  *   **Requirement:** In rescue scenarios where no one is used as a means, the theory must generally favor saving the greater number, or at least provide a mechanism where numbers count. Paralysis is not a permissible verdict.
  *   **Case:** Many-versus-One Rescue (save five strangers or one).
  *   **Status:** **Contested.** Some strict separatists argue numbers don't count (flip a coin). However, for an institution allocating a fixed pool, systematic indifference to the scale of suffering is likely politically and morally unsustainable. I mark this contested, but note that failing it risks institutional irrelevance.

  #### 4. The Threshold of Significance (Anti-Aggregation)
  *   **Requirement:** There must be a limit to aggregation. Sufficiently trivial benefits to many cannot override a catastrophic harm to one.
  *   **Case:** Trivial-Benefits Case (enough minor improvements to outweigh one serious harm).
  *   **Status:** **Non-Negotiable.** A protocol that allows a million people to claim relief for mild inconveniences while one person starves violates the basic purpose of disaster relief.

  #### 5. Operational Feasibility (Ordinal & Strategy-Proof)
  *   **Requirement:** The theory must function on self-reported, ordinal data (ranking needs) without requiring cardinal interpersonal utility comparisons. It must not incentivize claimants to split, merge, or exaggerate claims to game the allocation.
  *   **Case:** The Divisible-Pool Case (one large claim vs. five small claims). If splitting a large claim into five small ones increases the chance of funding, the protocol is broken.
  *   **Status:** **Non-Negotiable.** A moral theory that requires data you cannot have is not a protocol; it is a wish.

  #### 6. Invariance Under Redescription (No-Gerrymandering)
  *   **Requirement:** The verdict should not change if we re-describe the claimants. If one long-lived person is described as two "temporal stages," or a household pools a claim, the moral outcome should remain stable.
  *   **Case:** A single claimant with a complex need vs. a family with the same aggregate need.
  *   **Status:** **Assessment Required.** (See Section III). I suspect this is a trap for separatist theories.

  #### 7. The Pareto Condition (Different-People Case)
  *   **Requirement:** If Option A benefits Group X and Option B benefits Group Y, and no one is made worse off in either scenario, the theory should not forbid either based on "fairness" between the groups.
  *   **Case:** Different-People Case.
  *   **Status:** **Contested.** This tests whether "no one is used" does all the work. If we choose X over Y solely because X is "worse off" historically, we might be leveling down or violating neutrality.

  ---

  ### II. The Impossibility Analysis

  You asked where the incompatibilities lie. The tension is not merely practical; it is structural.

  **1. The Trap of Invariance vs. Separateness**
  Your suspicion is correct: **Separateness and Invariance are jointly unsatisfiable** in a strong form.
  *   *Why:* If persons are separate moral units, the *count* of persons matters. If you treat one long-lived person as two successive claim-stages, a separatist theory that weights claims by personhood must now see two claimants. If the theory respects Invariance, it must treat the two stages as one unit, effectively ignoring the "separateness" of the stages.
  *   *Verdict:* You must drop **Invariance**. A theory that takes persons seriously must be sensitive to how persons are individuated. If your protocol allows households to pool claims, you are implicitly agreeing to treat the household as the moral unit for this context. Do not pretend this is neutral; it is a constitutive choice of the protocol.

  **2. The Core Impossibility: Addressability + Number-Sensitivity + Non-Aggregation**
  This is the deeper conflict.
  *   *The Trilemma:*
      1.  **Addressability:** You must tell the loser why *they* lost in terms they can accept.
      2.  **Number-Sensitivity:** You must save the five instead of the one.
      3.  **Non-Aggregation:** You cannot say "5 > 1" because that aggregates value across persons.
  *   *The Conflict:* If you save the five, how do you address the one?
      *   If you say "Five lives outweigh one," you violate Non-Aggregation and Addressability (you treated them as a sum).
      *   If you say "We flipped a coin and they won," you violate Number-Sensitivity (you ignored the stakes).
      *   If you say "Their need was more urgent," you rely on **Priority**, which risks violating Operational Feasibility (how do you measure urgency cardinally?) or Invariance.
  *   *Verdict:* The single requirement doing the most exclusionary work is **Addressability**. It rules out straightforward Summation immediately. It forces you toward Priority or Sufficiency views, but those struggle with Operational Feasibility.

  **3. Addressability vs. Leveling Down**
  Your second suspicion is less critical. You can have Addressability without Leveling Down. You can tell a loser, "We did not choose the equality option because it would have harmed you without helping anyone else." That is addressable. The real conflict is Addressability vs. *Aggregation*.

  ---

  ### III. Scorecard of Candidate Theories

  Here is how the four main families of theories perform against your specification.

  **1. Straightforward Summation (Utilitarianism)**
  *   **Performance:** Fails **Addressability** and **Non-Instrumentalization**.
  *   **Verdict:** Unusable. It provides the exact refusal letter you rejected ("you were outweighed"). It also permits the Transplant Case in principle (if the numbers are high enough), violating the Non-Instrumentalization constraint. It passes Operational Feasibility and Invariance easily, but fails the core moral mandate of the committee.

  **2. Refusal to Aggregate (Equal/Weighted Chances)**
  *   **Performance:** Passes **Addressability** and **Non-Instrumentalization**. Fails **Number-Sensitivity**.
  *   **Verdict:** Morally pure but institutionally paralyzed. In the 5-vs-1 rescue, this theory mandates a weighted coin flip (or an equal one). Telling the one survivor of the five that they lived only because of a lottery is addressable, but telling the one who died that they had an equal chance against five others will look like institutional negligence to the public. It solves the "separateness" problem by refusing to solve the "allocation" problem.

  **3. Priority to the Worst Off (Prioritarianism / Leximin)**
  *   **Performance:** Passes **Addressability** and **Threshold of Significance**. Struggles with **Operational Feasibility**.
  *   **Verdict:** The strongest contender. It allows you to tell the loser, "Your need was severe, but theirs was catastrophic." This respects separateness (comparing urgency, not summing utility) and addresses the person. However, it requires interpersonal comparisons of urgency which your **Operational Constraints** (ordinal, self-reported data) make vulnerable to gaming. A Leximin variant (maximize the position of the worst off, then the next worst) is strategy-proof but rigid; it may deny relief to five moderately needy people to help one slightly needier person, which risks violating **Number-Sensitivity**.

  **4. Sufficiency-Threshold View**
  *   **Performance:** Passes **Threshold of Significance** and **Addressability**. Fails **Divisible-Pool** nuance.
  *   **Verdict:** Practical but blunt. You set a bar (e.g., "survival needs"). Anyone below gets aid; if funds run out, you prioritize those furthest below. This handles the Trivial-Benefits case well (trivial benefits don't cross the threshold). However, in the Divisible-Pool case (1 Large vs. 5 Small), if all are below the threshold, you revert to aggregation or lottery. It also faces the **Operational** hurdle of defining the threshold objectively without cardinal data.

  ### Recommendation for the Specification

  To draft a protocol that survives, you must explicitly **waive Invariance**. Define the "claimant unit" legally (e.g., per household or per individual) and stick to it, acknowledging that this is an administrative fiction required for stability.

  Then, adopt a **Lexical Priority** model constrained by **Operational Feasibility**.
  1.  **Triage:** Categorize claims ordinally (Survival vs. Recovery vs. Comfort).
  2.  **Priority:** Fund Survival claims first. This satisfies the Threshold and Addressability ("You were in Recovery; they were in Survival").
  3.  **Tie-Break:** Within categories, if funds are insufficient, use a **Weighted Lottery** based on the number of persons affected. This satisfies Number-Sensitivity without full aggregation. You tell the loser: "Your need was equal, but the number of lives at stake in the funded group was higher."

  This admits aggregation at the margin (in the lottery weights) but bans it at the core (in the triage categories). It is the only stable equilibrium that allows you to look the rejected claimant in the eye without lying about the math or their worth.
