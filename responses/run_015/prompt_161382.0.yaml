  *(Self-Correction on "No-Gerrymandering")*: The user worries separatist theories reward re-description. If I count persons, splitting one person into two 'persons' doubles their weight. That violates invariance. So, a theory that respects separateness (counts persons) violates invariance. A theory that respects invariance (ignores person boundaries) violates separateness. I need to state this clearly.

