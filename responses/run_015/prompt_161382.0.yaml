prompt: |-
  I'm on a small committee drafting the allocation protocol for a regional disaster-relief fund: a fixed pool distributed once, among claimants we can identify by name in advance, using information they self-report, with no repeat interaction, no possibility of later side-payments, and a written explanation owed to every claimant we turn down. That last institutional requirement is why I can't just reach for total-welfare maximization. Every draft we produce ends up giving refusals of the form: your claim failed because honoring it would have produced less total benefit than honoring theirs. Several of us think that sentence does not treat the person we are addressing as a separate person at all — that it is a statement about the world rather than an answer to them, and that a claimant who asks "what about me?" has not been spoken to. So before I argue about which rule to adopt, I want the specification I should be holding candidate rules up against.

  Write me the desiderata an adequate account of aggregation across persons must meet: a theory that takes seriously the thought that persons are separate, each with their own single life to lead, while still being a theory an institution could actually operate. For each requirement, give the case or consideration behind it, and mark whether you take it to be non-negotiable or merely a preference of one camp. At minimum I want you to deal with: the many-versus-one rescue (you can save five strangers or one stranger, and whoever you don't save dies), including whether the theory owes a verdict there at all and whether a refusal to aggregate generalizes into paralysis; the transplant-style case where the numbers are even better but the benefit is produced by conscripting an unwilling person, where I want your view on whether the distinction between aggregating benefits across recipients and using one person as a resource for others is a genuine desideratum or a prejudice of one tradition; the trivial-benefits case (enough very small improvements to outweigh one serious harm), where the theory has to say where, if anywhere, numbers stop mattering; what I'd call addressability — whether the justification can be stated to each losing claimant in a way that speaks for them, or whether some form of "you were outweighed" is unavoidable; the divisible-pool case where one claimant's stake is much larger than each of five others' but smaller than their sum; and the different-people case, where option A benefits these people and option B benefits entirely different ones and no one is made worse off either way, where I want to know whether "no one is made worse off" can do the work that "no one is used" was doing in the transplant case.

  Two further requirements I'd like you to assess rather than simply grant, because I'm not sure they are real: first, invariance under redrawing the boundaries between persons — call it no-gerrymandering-of-persons — the demand that verdicts stay stable when we re-describe one long-lived claimant as two successive claim-stages, or when several household members pool what is in effect a single claim. My worry is that a strongly separatist theory positively rewards this kind of re-description, and so might be unable to meet the requirement without ceasing to be separatist; tell me whether that is a genuine desideratum or a trap. Second, the operational constraints our setting imposes: our evidence is ordinal, self-reported, and noisy, so the theory must be usable without cardinal, interpersonally comparable welfare levels, or must say plainly that it cannot be; and it should not let claimants improve their position by splitting, merging, or misreporting their stakes.

  Then the part I most want: which subsets of the list are jointly unsatisfiable? My two suspicions are that the separatist core cannot be combined with no-gerrymandering, and that addressability cannot be combined with the refusal to level down (the refusal to make some worse off for the sake of equality when that helps no one), but tell me where you think the impossibility really lies, and which single requirement does the most work in excluding candidate theories. Keep the weight on the criteria and their motivating cases rather than on the scoring; a brief scorecard at the end — no more than a short paragraph each — against four families is enough: straightforward summation of benefits; refusal to aggregate with equal or weighted chances instead; priority to the worst off, including a leximin variant; and a sufficiency-threshold view that stops caring once someone has enough.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**

      *   **Context:** A small committee drafting an allocation protocol for a regional disaster-relief fund.
      *   **Constraints:** Fixed pool, one-time distribution, known claimants, self-reported info, no repeat interaction, no side-payments, *written explanation owed to every turned-down claimant*.
      *   **Core Problem:** Total-welfare maximization (utilitarianism) fails the "addressability" constraint (telling someone "you were outweighed" feels like treating them as a vessel for value, not a separate person).
      *   **Task:** Write the *desiderata* for an adequate account of aggregation across persons that respects separateness but is operationally viable.
      *   **Specific Cases to Address:**
          1.  Many-versus-one rescue (5 vs. 1).
          2.  Transplant case (using one as a resource).
          3.  Trivial-benefits case (aggregation vs. serious harm).
          4.  Addressability (justification to the loser).
          5.  Divisible-pool case (1 large claim vs. 5 small claims).
          6.  Different-people case (A benefits group X, B benefits group Y, no overlap).
      *   **Specific "Assess rather than Grant" Requirements:**
          1.  Invariance under redrawing boundaries (No-Gerrymandering-of-Persons).
          2.  Operational constraints (Ordinal/self-reported/noisy data, strategy-proofness).
      *   **Impossibility Analysis:** Identify which subsets are jointly unsatisfiable. Specifically address the user's suspicions (Separatist + No-Gerrymandering; Addressability + No Leveling Down). Identify the single most exclusionary requirement.
      *   **Scorecard:** Brief evaluation of four families of theories (Summation, Non-Aggregation/Random, Priority/Worst-Off, Sufficiency).
      *   **Tone:** Philosophical, rigorous, institutional, practical but deeply ethical.

  2.  **Deconstruct the Desiderata:**

      *   *Separateness of Persons:* The core philosophical constraint. We aren't optimizing a global soup of utility.
      *   *Addressability:* The institutional constraint. The explanation must make sense *to the person*.
      *   *Operationalizability:* The practical constraint. We can't measure utils.
      *   *Non-Aggregation vs. Aggregation:* The tension point.

      *Drafting the Criteria:*
      1.  **Respect for Separateness (Non-Negotiable):** You can't sacrifice one *for* others merely as a means. (Transplant case).
      2.  **Responsiveness to Numbers (Preference/Debatable):** In rescue cases (5 vs 1), ignoring numbers seems wrong, but aggregating seems to violate separateness. Need a middle ground.
      3.  **Threshold of Significance (Non-Negotiable):** Trivial benefits shouldn't override serious harms. (Aggregation limit).
      4.  **Agent-Relative Addressability (Non-Negotiable):** The explanation must cite reasons relevant to *their* claim, not just global totals.
      5.  **Operational Feasibility (Non-Negotiable):** Must work with ordinal/self-reported data.
      6.  **Strategy-Proofness (Non-Negotiable):** Can't let people game the system by splitting/merging.
      7.  **Invariance (The "Trap" Check):** Does re-describing persons change the outcome? (User suspects this conflicts with Separateness).
      8.  **No Leveling Down (Preference):** Don't make people worse off just for equality.

  3.  **Analyze the Specific Cases within the Criteria:**

      *   *Many-vs-One:* Needs a verdict. Paralysis is not an option for an institution.
      *   *Transplant:* Distinguish between *aggregating benefits* and *using a person*. This is the "Means vs. Side-Effects" distinction.
      *   *Trivial Benefits:* Needs a "lexical" or "threshold" stop.
      *   *Addressability:* "You were outweighed" is banned. Needs "Your claim was insufficient relative to the urgency of others" or similar.
      *   *Divisible Pool:* 1 Large vs. 5 Small. If Large < Sum(Small), do we split?
      *   *Different People:* If no one is worse off, is it permissible? (Pareto).

  4.  **Analyze the "Assess rather than Grant" Requirements:**

      *   *No-Gerrymandering:* If I treat a life as two stages, does the moral math change? Utilitarianism says no. Separatist views might say yes (more persons = more weight?). *Assessment:* This is likely a trap for strong separatists. If persons are sacred units, defining the unit is crucial. If the theory is sensitive to the *count* of persons, it violates invariance. I need to flag this as a tension point.
      *   *Operational/Ordinal:* Crucial. Cardinal utility is impossible here. This kills strict Prioritarianism unless simplified.

  5.  **Identify Impossibility Results (The Core Philosophical Heavy Lifting):**

      *   *Suspicion 1: Separatist + No-Gerrymandering.* If I value persons separately, splitting a person into two "claim-stages" creates two moral patients. If I don't adjust weight, I ignore the split. If I do adjust weight, I violate invariance. *Verdict:* This is a genuine conflict. Strong separateness implies person-counting matters. Invariance implies person-counting shouldn't matter.
      *   *Suspicion 2: Addressability + No Leveling Down.* Actually, the deeper conflict is usually *Addressability + Aggregation*. To address the loser, you need a reason *they* can accept. "The sum was higher" they can't accept (by hypothesis). "You had lower priority" they might.
      *   *The Real Impossibility:* **Responsiveness to Numbers + Respect for Separateness + Addressability.**
          *   If you respect separateness strictly (no aggregation), you can't save the 5 over the 1 without violating the 1's right not to be outweighed.
          *   If you save the 5, you must explain to the 1 why. If you say "5 > 1", you aggregated. If you say "Random chance favored them", you ignored the numbers.
          *   *The single most exclusionary requirement:* **Addressability combined with Responsiveness to Numbers.** (Or simply "Justifiability to the Loser").

  6.  **Drafting the Scorecard:**

      *   *Summation (Utilitarianism):* Fails Addressability and Separateness (Transplant). Passes Numbers and Invariance.
      *   *Refusal to Aggregate (Random/Equal Chance):* Passes Separateness and Addressability (sort of). Fails Responsiveness to Numbers (5 vs 1 is a coin flip?).
      *   *Priority to Worst-Off (Prioritarianism/Leximin):* Good on Addressability ("They needed it more"). Struggles with Operational (needs cardinal/interpersonal comparison) and Trivial Benefits (unless lexical).
      *   *Sufficiency:* Good on Trivial Benefits. Struggles with Divisible Pool (what if all are below threshold?).

  7.  **Refining the Tone:**

      *   Needs to sound like a philosophical brief for a committee.
      *   Avoid jargon where possible, but use precise terms (lexical, ordinal, strategy-proof).
      *   Acknowledge the tension without resolving it dogmatically (since the user asked for the *specification*, not the *solution*, though the impossibility analysis leans towards a conclusion).

  8.  **Self-Correction/Review during drafting:**

