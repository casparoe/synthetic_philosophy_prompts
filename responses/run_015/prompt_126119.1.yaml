      *   *Q2 (Indexical Grief vs. Nostalgia):* Need to distinguish structural mourning from sentimental longing.
          *   *Draft:* How is indexical grief different from nostalgia?
          *   *Refinement:* Nostalgia wants to go back. Indexical grief knows you can't. How does that structural impossibility function?
          *   *Follow-up:* If she says "it's contextual," ask about the phenomenological feel.

      *   *Q3 (Criterion for Life vs. Destruction):* Need a practical test.
          *   *Draft:* How do we know when critical history is good?
          *   *Refinement:* Nietzsche says "serve life." But destruction feels like life sometimes. What's the boundary?
          *   *Follow-up:* If she says "no theoretical criterion," press for symptoms.

      *   *Q4 (The Triad's Stability):* If Critical depends on Monumental, does the triad collapse into a dyad?
      *   *Q5 (The "Phantom" Status):* Is the phantom conscious or unconscious? If unconscious, is it ideological?
      *   *Q6 (Antiquarian Paralysis):* If antiquarianism is grief, doesn't it risk the "mummification" Nietzsche warns about even more?
      *   *Q7 (Temporal Direction):* Monumental looks forward/back to heroes. Critical looks back to destroy. Antiquarian looks back to preserve. Where does "indexical grief" sit temporally?
      *   *Q8 (The Role of Forgetting):* Nietzsche emphasizes active forgetting. How does grief (which remembers) fit with forgetting?
      *   *Q9 (Universal vs. Cultural):* Is this structure specific to 19th-century Germany or universal to historical consciousness?
      *   *Q10 (The "Life" in History for Life):* What kind of "Life" is being served? Biological? Cultural?

  4.  **Refining and Polishing (Checking Constraints):**
