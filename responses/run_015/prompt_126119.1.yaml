prompt: |-
  I'm moderating the Q&A for our department's small philosophy podcast, and next week's guest is an unnamed scholar — call her Dr. R — who's defending a pretty unorthodox reading of Nietzsche's 1874 essay on history for life. She thinks the standard triad of monumental, antiquarian, and critical history misses a hidden dependency: critical history, she claims, can't actually break with the past unless it smuggles in a kind of 'phantom monumentalism,' borrowing the image of a liberated future to have something concrete to reject. She also argues that antiquarian history isn't just conservative preservation but involves what she calls 'indexical grief' — a structural mourning for lost contexts that makes the present feel like an inadequate copy rather than a continuation. I want eight to ten interview questons that go well beyond having her summarize the view. I need at least one that presses her on whether this phantom monumentalism just reintroduces the heroic narrative Nietzsche warns can poison life; one that asks how her indexical grief differs from ordinary nostalgia or the romantic mal du siècle; and one that asks what practical criterion distinguishes critical history that genuinely serves life from pure destructive negation. For each, include a follow-up keyed to the answer she's most likely to give — especially if she deflects by saying the distinction is performative or contextual rather than theoretical. Let's keep it focused on the conceptual machinery and avoid any biographical fluff.
reasoning: |-
  Here's a thinking process that leads to the suggested interview questions:

