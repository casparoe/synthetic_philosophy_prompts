      *   *Claim 2 (Antiquarian/Indexical Grief):* Nietzsche says Antiquarian preserves roots. Dr. R says it's actually grief over lost context. This sounds like nostalgia. How is it philosophical/structural rather than emotional?
      *   *Goal:* Life (*Leben*). History must serve life. If Critical history is just negation, it kills life. If Antiquarian is just grief, it paralyzes life. Where is the tipping point?

  3.  **Drafting the Questions (Iterative Process):**

      *   *Q1 (The Phantom Monumentalism/Heroic Narrative):* Need to ask if this smuggles in the very thing Nietzsche critiques.
