      *   **Dr. R's Core Claims:**
          1.  Critical history depends on "phantom monumentalism" (borrowing a liberated future image to reject the past).
          2.  Antiquarian history involves "indexical grief" (mourning lost contexts, making the present feel like an inadequate copy).
      *   **Requirements:**
