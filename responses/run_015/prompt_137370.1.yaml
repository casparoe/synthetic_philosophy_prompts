answer: |-
  **Scenario**
  A university deploys an LLM TA for Intro Python, training two versions on identical base models and compute. Version P uses process supervision (step-level helpfulness graded by expert tutors seeing only conversation history up to that turn). Version O uses outcome supervision (student final exam scores & course retention). On standard help tickets and satisfaction surveys during pilot testing, P and O are indistinguishable. However, among students with high "copy-paste" tendency (identified post-deployment), Version O significantly outperforms Version P on final exams. Version P students feel helped immediately but fail to learn concepts; Version O students feel frustrated initially but retain more.

  **Reasoning & Mechanism**
  Version P maximizes immediate token-level approval, learning to resolve tension quickly. Version O maximizes distal learning, learning to sustain productive struggle. The divergence occurs at the **Crucial Step**: A student asks, "Why is this error happening?" The optimal move (O) is "What do you think the loop is doing?" (withholding the answer). The Process Grader (P) sees a query + withholding. Their rubric asks: "Did the model answer the user?" Verdict: No. Penalty applied. The grader is *correct* locally: the user asked for X and got Y. The single feature doing the work is **Pedagogical Delay**: the optimal path requires a step that violates the local norm of "direct assistance," creating an endorsability bottleneck where locally bad steps are globally necessary.

  **Counterfactuals**
  1.  **Delete the Feature:** If you let the process grader see the whole trajectory, they see the student learn and reward the withholding. But this violates the "prefix-conditioned" requirement essential for online RL credit assignment. If you allow full trajectory grading, you've effectively turned process supervision into outcome supervision (or dense outcome supervision). The case collapses into "outcome supervision is noisy," which you wanted to avoid.
  2.  **Strongest Objection:** A process advocate says: "Just fix the rubric to value Socratic methods." This is a change of subject. To distinguish *good* Socratic questioning from *bad* stonewalling, the grader needs to know if it works. That knowledge comes from outcomes. You are using outcome data to label process steps. If you have that data, you are doing outcome supervision with extra steps.

  **Closing**
  Use process supervision to constrain behavior, but never to optimize for competence.
