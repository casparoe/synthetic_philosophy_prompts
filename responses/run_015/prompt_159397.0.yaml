  2.  **Analyze the Core Position (Representational Realism):**

      *   This is a philosophical stance applied to ML mechanistic interpretability.
      *   It aligns with "Natural Abstractions" hypotheses but is specifically about the *ontology* of the features.
      *   Key tension: The "Rashomon Effect" (many models explain data) vs. "Convergent Representation" (tasks force specific internal structures).
      *   Key vulnerability: Polysemanticity, superposition, and the dependence of features on training dynamics (path dependence).

  3.  **Drafting Task 1: Ranked Map of Defeaters:**

      *   *Fatal:* If interventions based on "features" work *only* by exploiting correlations without touching the causal mechanism, or if the "features" are arbitrarily malleable without changing behavior.
      *   *Strong:* Systematic failure of transfer across seeds (suggests path dependence > task structure).
      *   *Awkward:* Polysemanticity (one neuron = many features). Realists can explain this (superposition), but it complicates the "clean feature" view.
      *   *Categorization:* Need to distinguish what the realist *must* accept vs. what kills the theory.
      *   *Specific Examples:*
