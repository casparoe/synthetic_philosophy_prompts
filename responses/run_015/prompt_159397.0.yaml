          *   *Behavior without Rep Change:* If I change the output behavior but the "feature vector" remains identical (measured by all known tools), that suggests the feature wasn't the causal lever. (Fatal).

  4.  **Drafting Task 2: Predictions (Neck Sticking Out):**

      *   *(a) Portability:* Realism *should* predict convergence. If the task is "add numbers," the circuit for carrying the one should be similar across seeds. If it's totally different (isomorphic but permuted, or structurally distinct), realism weakens. Instrumentalism doesn't care; behavior is all that matters. *Verdict:* High discrimination.
      *   *(b) Grain:* Realism implies natural atoms. If features split infinitely (fractal semantics), there are no "real features," just convenient cuts. Instrumentalism expects this (it's all our projection). *Verdict:* High discrimination.
      *   *(c) Ontologically Alien:* This is the "Whorfian" test. If Model A (English) has [Dog] and [Cat], and Model B (Alien) has [FurryPet], does Model A actually have [FurryPet] hidden inside? Realism says the *world* dictates features, so [FurryPet] is a real cluster if the data supports it. Instrumentalism says it depends on the language/vocabulary. *Verdict:* Tricky. Realism predicts convergence on *environmental* structure, not linguistic labels. If the environment distinguishes them, Realism expects distinct features eventually.

  5.  **Drafting Task 3: Insulation:**

      *   The "No True Scotsman" risk. "That wasn't the *real* feature."
      *   Legitimate: We know our tools (probes, SAEs) are imperfect. Blaming the tool is often right.
      *   Protective: When *every* tool fails across *all* scales, yet we insist the feature exists.
