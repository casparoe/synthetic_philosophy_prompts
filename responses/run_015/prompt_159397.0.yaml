answer: |-
  This is a precise ontological claim about the internals of neural networks, situated at the intersection of philosophy of science and mechanistic interpretability. Your position—Representational Realism—asserts that the latent structure of a network is not merely a convenient fiction for predicting output, but a causal map of the task domain that exists independently of the observer.

  Here is the exposure map you requested.

  ### 1. A Ranked Map of Defeaters

  These are ordered from fatal (destroying the core claim) to awkward (requiring theoretical adjustment). I have marked whether these are defeaters a realist should concede (internal consistency) or those a critic would raise (external attack).

  **1. The Causal Decoupling (Fatal)**
  *   **What must be true:** You successfully intervene on a "feature" (e.g., steer a direction in activation space) and the model's behavior changes robustly, *but* you can demonstrate that the intervention did not alter the causal mechanism responsible for the behavior, only a correlate. For example, steering "honesty" works, but only because it suppresses a specific token probability that triggers a lookup, not because it engaged a reasoning circuit.
  *   **Plausibility:** Moderate. Many current "steering" results are known to be brittle.
  *   **Source:** **Critic.** A realist claims the feature *is* the causal lever. If the lever moves the load without engaging the mechanism, the feature was not real; it was a confound.
  *   **Status:** **Arguably happened.** Many steering vectors work in-distribution but fail under adversarial prompting or slight distribution shifts, suggesting they exploit surface correlations rather than deep representations.

  **2. The Radical Path Dependence (Fatal)**
  *   **What must be true:** Two models trained on identical data distributions and architectures, differing only by random seed, converge to behaviorally identical performance but share *zero* structurally isomorphic internal features. Not just permuted neurons, but fundamentally different algorithms (e.g., Model A uses a lookup table strategy, Model B uses a heuristic calculation) to solve the same task.
  *   **Plausibility:** Low to Moderate. We see some path dependence, but total algorithmic divergence on simple tasks is rare.
  *   **Source:** **Critic.** Realism implies the task structure constrains the solution space. If the solution space is so rugged that history dominates task constraints, there is no "fact of the matter" about the features, only facts about the trajectory.
  *   **Status:** **Partial.** We see significant variation in circuit implementation across seeds for complex tasks, though low-level features (edges, n-grams) tend to converge.

  **3. The Infinite Regress of Grain (Strong)**
  *   **What must be true:** As you increase the capacity of your dictionary (e.g., widening a Sparse Autoencoder), features never stabilize into "atoms." Every feature you find decomposes into a conjunction of finer features, ad infinitum, without reaching a natural stopping point where the feature corresponds to a discrete semantic unit.
  *   **Plausibility:** Moderate. Current evidence suggests features do split as dictionaries widen.
  *   **Source:** **Internal Concession.** A realist must claim there are natural atoms of representation. If representation is fractal, "feature" is just a resolution setting chosen by the observer, which supports Instrumentalism.
  *   **Status:** **Happening.** We currently lack a theory of "natural stopping points" for feature decomposition.

  **4. The Phantom Probe (Strong)**
  *   **What must be true:** A linear probe can be trained to recover a concept (e.g., "sentiment") from a model's activations with high accuracy, but ablating that direction has no effect on the model's behavior, and the model does not use that information for downstream tasks.
  *   **Plausibility:** High. Linear probes are known to find information that is present but causally inert (read-only vs. read-write).
  *   **Source:** **Critic.** This attacks the claim that recovered features "do explanatory work." If the feature is readable but not used, it is a byproduct, not a representation.
  *   **Status:** **Common.** Probes frequently outperform interventions, suggesting they detect correlates rather than causal variables.

  **5. Polysemanticity without Superposition (Awkward)**
  *   **What must be true:** Individual neurons or directions consistently encode multiple unrelated features (e.g., "dog" and "positive sentiment") in a way that cannot be explained by superposition (compression due to dimensionality constraints), even in wide, over-parameterized models.
  *   **Plausibility:** Low. Superposition explains most polysemanticity.
  *   **Source:** **Internal Concession.** Realism can absorb this if it admits features are distributed and overlapping. It becomes awkward only if the overlap is chaotic rather than structured.
  *   **Status:** **Managed.** Superposition theory largely handles this, but it complicates the "clean feature" intuition.

  ---

  ### 2. Where the Position Sticks Its Neck Out

  Realism must predict convergence and stability where Instrumentalism predicts contingency. Here is the discrimination analysis for your three cases.

  **(a) Portability (Across Seeds)**
  *   **Realist Prediction:** High structural overlap. If the task is "add two numbers," the carry-bit mechanism should be findable in Model A and Model B, even if neuron indices differ. The *algorithm* should be isomorphic.
  *   **Instrumentalist Prediction:** Irrelevant. As long as $f_A(x) \approx f_B(x)$, the internals are unconstrained.
  *   **Discrimination:** **High.** This is the strongest test. If features are real properties of the *task*, they should converge like physical solutions (e.g., wings in birds and planes). If they are artifacts of the *training path*, they will diverge.
  *   **Absorbing Failure:** A realist can absorb *some* failure by claiming "equifinality" (different algorithms solve the same problem). But if *no* high-level features transfer across seeds, Realism collapses into Instrumentalism.

  **(b) Grain (The Stopping Point)**
  *   **Realist Prediction:** There exists a "natural scale." At some width, features correspond to human-meaningful concepts (e.g., "dog," "gender," "code function"). Widening further yields noise or trivial subdivisions.
  *   **Instrumentalist Prediction:** No natural scale. Features are like map contours; you can draw them at any resolution.
  *   **Discrimination:** **High.** If the "feature" is a real entity, it has boundaries. If you can always split "dog" into "dog-head" and "dog-tail" and "dog-leg" with equal explanatory power, the "dog" feature was just a convenient bundle, not a real unit.
  *   **Absorbing Failure:** Realism struggles here. If there is no stopping point, the realist must concede that "features" are observer-relative resolutions, which is the Instrumentalist core claim.

  **(c) The Ontologically Alien Case**
  *   **Scenario:** Model E (English) has [Danger], [Wet]. Model A (Alien) has [Danger+Wet].
  *   **Realist Prediction:** If Danger and Wet are distinct clusters in the *data distribution* (i.e., not all dangerous things are wet), Model A should eventually separate them, regardless of the token label, because the *world* drives the representation, not the vocabulary. If the data perfectly correlates them, Model A having one feature is correct, and Model E having two is over-splitting.
  *   **Instrumentalist Prediction:** Model A's representation is valid relative to its training objective (next-token prediction in Alien). There is no "fact of the matter" on whether [Danger+Wet] is one feature or two, only whether it predicts tokens well.
  *   **Discrimination:** **Moderate.** Realism bets on environmental structure over linguistic labels. Instrumentalism bets on the training objective.
  *   **Retrofit Risk:** High. A realist can always claim "the data distribution supported the union." To prevent retrofitting, the realist must predict *in advance* based on data statistics whether the models will converge or diverge, regardless of the language tokens.

  ---

  ### 3. The Insulation Question

  You are right to worry. Representational Realism currently possesses a thick "protective belt" of methodological caveats that risks rendering the core unfalsifiable.

  **Legitimate Insulation (Methodological):**
  *   *Case:* We fail to find a feature because our dictionary is too small (e.g., using neurons instead of SAEs).
  *   *Verdict:* **Legitimate.** We know our tools are lossy. Blaming the tool is scientifically sound when we have independent reason to think the tool is insufficient (e.g., known polysemanticity).
  *   *Case:* An intervention fails because it is too coarse (affects multiple features).
  *   *Verdict:* **Legitimate.** Causal inference requires isolation. If we cannot isolate, we cannot test.

  **Protective Insulation (Ad Hoc):**
  *   *Case:* We fail to find a feature across *all* current methods (probes, SAEs, causal tracing), across *multiple* scales, and across *seeds*, yet we insist the feature exists and we just need a "better dictionary."
  *   *Verdict:* **Protective.** At some point, the absence of evidence becomes evidence of absence. If the "real feature" is forever receding beyond the horizon of better tools, it functions as a noumenon—a thing-in-itself that can never be known.
  *   *Case:* Redefining "feature" to mean "subspace" whenever a direction fails, then "manifold" when a subspace fails.
  *   *Verdict:** **Protective.** This moves the goalposts of ontology to match the success of the math.

  **The Collapse Risk:**
  If Realism is insulated against all empirical failure by attributing it to methodological imperfection, it collapses into the claim that **"There exist real patterns in the data."**
  *   The Instrumentalist agrees there are real patterns in the data.
  *   The Instrumentalist agrees some descriptions are more useful than others.
  *   The only remaining difference is the realist's insistence that the network *must* encode these patterns in a specific, recoverable way.
  *   **Conclusion:** If the position is perfectly insulated, it is not a scientific hypothesis; it is a metaphysical stance. To remain scientific, Realism must specify a **condition of failure** that is not "our tools were bad." For example: "If features do not transfer across seeds at rate $X$, Realism is false." Without this, Realism is just Instrumentalism with more confidence.

  ---

  ### 4. Interrogating Your Weighting

  You weight **Intervention > Geometry** and **Seed Failure > Architecture Failure**.

  **On Intervention > Geometry:**
  *   **Verdict:** **Correct.**
  *   **Reasoning:** Geometry (e.g., "this direction aligns with cosine similarity to 'king'") is correlational. It is consistent with Instrumentalism (the network arranges weights to minimize loss, and we project meaning onto the arrangement). Intervention (changing the activation changes the behavior) is causal. Realism is a causal claim ("these features do explanatory work"). Therefore, intervention is the necessary condition for Realism. Geometry is merely suggestive.
  *   **Risk:** Do not discard geometry entirely. It provides the hypothesis space for interventions. But you are right to treat it as lower evidence.

  **On Seed Failure > Architecture Failure:**
  *   **Verdict:** **Correct, but for a subtle reason.**
  *   **Reasoning:**
      *   **Architecture Change:** Changing from a Transformer to an RNN changes the *inductive bias* and the *computational substrate*. A Realist can argue that different hardware solves the same problem differently (like a brain vs. a computer calculating addition). Divergence here is expected.
      *   **Seed Change:** This keeps the architecture and data distribution constant. It only changes the initialization and batch order. Under Realism, the *task constraints* should dominate the *initialization noise*. The solution space should have a narrow basin of attraction for the "correct" features. If changing the seed radically changes the features, it implies the basin is wide and rugged, meaning the features are determined by historical accident (path dependence) rather than task structure.
  *   **The Trap:** You might be led by what is easy to measure. Seed studies are cheap; Architecture studies are expensive. However, epistemically, your weighting is sound. Seed failure is a deeper threat to Realism because it suggests the "reality" of the feature is contingent on the random number generator, which is incompatible with the feature being a "fact of the matter" about the task.

  **Final Advisory:**
  Your position is currently in a "pre-paradigmatic" state. It is productive, but it lacks a specified failure mode. To harden it, you must commit to the **Portability (Seed)** test. If you cannot demonstrate that features converge across seeds better than chance, you cannot claim they are "real" in the sense you define. You would be forced to retreat to the claim that they are "useful fictions," which is the Instrumentalist home turf.
