      *   *Master Output:* The final stereo mix.
      *   *Signal:* The audio data (voltage/digital info).
      *   *Gain/Level:* Amplitude.
      *   *EQ/Processing:* Altering the signal.
      *   *Noise Floor:* Background hiss/hum.
      *   *Phase Coherence:* Alignment of waveforms.
      *   *Latency:* Delay in processing.
      *   *DAW (Digital Audio Workstation):* The system hosting everything.

  4.  **Drafting the Mappings (Iterative Process):**

      *   *Russellian Monism:*
          *   *Idea:* The waveform is the physical, the "sound" itself is the mental.
          *   *Mapping:* The DAW shows you the waveform (structure), but the actual *audible experience* requires a monitor/speaker (intrinsic nature).
          *   *Distortion:* Equating "intrinsic nature" with "playback."
          *   *Missing:* Why *this* specific waveform feels like *red* or *pain*.

      *   *Constitutive Panpsychism:*
          *   *Idea:* Little bits of consciousness make big consciousness.
          *   *Mapping:* Individual tracks have their own "tone" or "color." When summed to a bus, they create a new "vibe."
          *   *Distortion:* Tracks don't actually "hear" themselves.
          *   *Missing:* The Combination Problem. How do 100 tracks become *one* listener? Summing is mathematical, not experiential.

      *   *Cosmopsychism:*
          *   *Idea:* One big mind, we are parts.
          *   *Mapping:* The Master Bus is the only real "listener." Tracks are just isolated feeds sent from the master.
          *   *Distortion:* Master bus is usually just a sum, not an agent.
          *   *Missing:* Why are we separated? (Dissociation).

      *   *Hard Emergentism:*
          *   *Idea:* No consciousness in atoms, only in brains.
          *   *Mapping:* Plugins only activate when the signal hits a specific threshold or complex chain (e.g., a specific limiter chain). Individual tracks are dead voltage.
          *   *Distortion:* Emergence in audio is usually just summing, not magic.
          *   *Missing:* The "Hard Problem" (why is there sound at all?).

  5.  **Addressing the Combination Problem (Crucial Step):**
      *   In audio, summing is easy. $A + B = C$.
      *   In panpsychism, $Subject(A) + Subject(B) \neq Subject(C)$.
