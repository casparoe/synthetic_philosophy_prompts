answer: |-
  ### Nearest concepts and where they miss

  Moral luck addresses how outcomes influence praise or blame, but it assumes the moral agent remains constant; it doesn't challenge whether the trait itself changes meaning based on the result. Survivorship bias explains why you only see the winners, but not why the winner's stubbornness is virtuous while the loser's is vanity. Hindsight bias describes the cognitive distortion of inevitability, yet it lacks the normative component regarding virtue extraction. The narrative fallacy comes closest, describing how humans impose causal stories on random data, but it typically applies to historical or economic events rather than the specific moral reclassification of character traits. These concepts describe the *mechanisms* of your error, but none explicitly name the pedagogical failure: the assumption that a life's end validates its moral means. They diagnose the cognitive symptoms but miss the philosophical disease—the conflation of success with goodness. You are observing a structural flaw in using completed narratives as ethical data, where the telos dictates the ethos. Existing terms isolate the bias but do not capture the invalidation of the biographical method itself. They explain why we judge differently, but not why the lesson is fabricated.

  ### A name and definition, or why none fits

  There is no single canonical term in ethics for this specific pedagogical failure. Philosophers discuss "outcome bias" in judgment, but that concerns evaluating decisions, not constructing virtue. Therefore, the phenomenon is best defined as **Retrospective Virtue Attribution**. This occurs when character traits are identified and valued solely because they align with a known successful outcome, rather than being intrinsically identifiable as good. It is the ethical equivalent of data dredging: scanning a life story for traits that match the ending, then labeling those traits as the cause. This definition captures the reverse-engineering process you described. It distinguishes the problem from simple hindsight bias by focusing on the *moral valuation* of the trait itself. Without this specific label, the error remains hidden within broader discussions of luck or bias, allowing the biographical method to proceed unchallenged despite its foundational instability.

  ### Boundary cases

  Boundary cases exist where the method holds firm. Consider Socrates: his life ended in execution, a professional and social failure, yet his integrity remains the lesson. Here, the moral outcome diverges from the worldly outcome, preserving the virtue's integrity. Similarly, lives ending in ambiguity can work if the focus shifts from the finale to specific moments of choice. If you isolate a decision point before the outcome was known, the biography functions as a case study rather than a providential tale. Conversely, the method fails completely with "great man" histories where every childhood quirk is framed as a seed of greatness. The boundary lies between lives used to illustrate *reasoning* versus lives used to illustrate *destiny*. When the narrative suggests the virtue caused the success, Retrospective Virtue Attribution corrupts the lesson. When the narrative suggests the virtue was maintained *despite* the outcome, the lesson survives.

  ### Verdict on the biographical method

  Does teaching ethics through lives survive this problem? Yes, but only if radically modified. You must abandon the Plutarchian model of "admirable lives" defined by their endings. Instead, adopt a "blind biography" approach. Present the subject's dilemmas and decisions without revealing the ultimate outcome until after the associates have judged the actions. This strips away the teleological distortion. Furthermore, you must pair successes with failures not just as counterpoints, but to demonstrate that identical virtues can lead to opposite worldly results. Commit to teaching that virtue is about the quality of the choice, not the luck of the consequence. If you continue to present lives where the ending validates the character, you are not teaching ethics; you are teaching success mythology. The method survives only if you explicitly decouple moral worth from professional outcome. Do not let the partners sell destiny; sell decision-making. The biographical method is too powerful to discard, but it is too dangerous to use nakedly. You must frame every life as a series of opaque choices, not a clear path to glory. Require associates to evaluate the reasoning without knowing the reward. Only then does the life become an ethical tool rather than a superstition. The senior partner's request is valid only if the "admiration" is for the struggle, not the trophy.
