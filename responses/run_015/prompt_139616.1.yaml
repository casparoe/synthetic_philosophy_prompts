answer: |-
  Right, pull up a chair. This is a proper puzzle, and your flatmate sounds like a formidable opponent. She's clearly steeped in the revisionist literature—Jeff McMahan's *Killing in War* is the bible there—but she's resisting the label, which suggests she's either refining the view or just hates being pigeonholed (academics can be like that).

  Here is the breakdown of the rule she's running, the rivals that fit your notes, the prediction for tonight's case, and the trap you should set for tomorrow.

  ### 1. The Rule She Is Running: Objective Revisionism
  This is the standard McMahan position. The core tenet is that **liability to attack tracks objective moral responsibility for an unjust threat.**

  *   **Why it fits your notes:**
      *   **Cases 1 & 3 (Unjust Volunteers):** They are objectively contributing to an unjust threat. They are liable. The difference in "murder" verdicts tracks *culpability* (knowledge vs. wilful ignorance).
      *   **Case 2 (Unjust Conscript):** He is objectively an unjust threat, but he is not *morally responsible* for being there (coercion/invincible ignorance). Therefore, he is not liable to lethal force (hence the "disable/capture" caveat).
      *   **Case 4 (Just Mercenary):** He is objectively fighting for a just cause. His motive (money) does not make him an unjust threat. Therefore, not liable.
      *   **Cases 5 & 6 (Civilians):** This tracks the **causal contribution** threshold. The engineer is directly responsible for the unjust threat (liable); the farmer is too remote (not liable).
  *   **The Logic:** Facts matter more than feelings. If you are on the right side of the *jus ad bellum*, you are not liable to be killed, regardless of what you think. If you are on the wrong side, you are liable unless you are excused (like the conscript).

  ### 2. The Rival Rules
  There are two other frameworks that fit your six cases almost as well.

  **A. Subjective Intentionalism**
  *   **The Rule:** Moral status depends on the agent's *belief* and *intent*. If you believe you are doing wrong, you are doing wrong.
  *   **Fit:** Explains Case 1 (Knows it's wrong = Murder) and Case 2 (Thinks it's right = Blameless). It struggles slightly with Case 4 (Mercenary), but could argue that as long as he *believes* the cause is permissible, his motive doesn't make it murder.
  *   **Weakness:** It contradicts the idea of "objective justification" which is usually central to Just War Theory, but it fits the data so far.

  **B. Epistemic Symmetry**
  *   **The Rule:** Liability depends on what a *reasonable person* could have known. Invincible ignorance excuses the unjust; reasonable belief protects the just.
  *   **Fit:** Explains Case 2 (Conscript couldn't know) and Case 3 (Volunteer *should* have known). It aligns with Case 6 (Farmer isn't expected to know the strategic end-use of potatoes).
  *   **Weakness:** It blurs the line between *excuse* and *justification*, which revisionists hate, but it predicts the verdicts accurately.

  ### 3. Predictions for Case 7 (The Confused Just Warrior)
  *The Case:* Volunteer, Just Side (Objective), Believes Unjust (Subjective), Motive: Brother.

  | Rule | May he be killed? (Liability) | Is it murder? (Culpability) | Reasoning |
  | :--- | :--- | :--- | :--- |
  | **Objective Revisionism** (Her likely view) | **No** | **No** | He is objectively defending against aggression. He poses no *unjust* threat. His belief is irrelevant to liability. |
  | **Subjective Intentionalism** | **Yes** | **Yes** | He intends to fight for what he believes is an unjust cause. He lacks moral justification in his own mind. |
  | **Epistemic Symmetry** | **No** | **No** | His belief was reasonable (disinformation). He is excused for the belief, and objectively protected by the cause. |

  ### 4. My Best Guess
  She will go with **Objective Revisionism**.
  *   **Verdict:** May **not** be killed. It is **not** murder.
  *   **Reasoning:** She's already committed to the idea that objective status trumps motive (Case 4). In Case 4, the mercenary didn't care about the cause, yet was protected. In Case 7, the soldier cares (about his brother) but doubts the cause. For a McMahanite, the *fact* of the just cause provides the justification that renders the enemy's attack on him wrongful. His subjective confusion makes him *blameworthy* perhaps (for fighting while confused), but it doesn't make him *liable* to be killed. She will likely say he is "objectively justified, subjectively confused."

  ### 5. The Killer Case for Tomorrow (Case 8)
  To tell the rules apart, you need to break the link between **Objective Fact** and **Subjective Culpability**. You need a case where he is on the *Just* side, but his belief that he is on the *Unjust* side is his *own fault*.

  **The Case:**
  > A volunteer on the **just** side (defensive war). The government's information hygiene is actually fine; the truth is available on the BBC and in the papers. However, he spends all his time on fringe forums that claim his country is the aggressor. He **believes** the war is unjust (like Case 7), but this belief is due to his own **negligence** (he *could* have known better). He kills an enemy soldier to protect his brother.

  **The Split:**
  *   **Objective Revisionism:** May **not** be killed. Not murder.
      *   *Why:* He is still objectively on the just side. His negligence regarding the *ad bellum* status doesn't turn a just defence into an unjust threat. (Consistent with Case 4: motive/ignorance doesn't strip objective protection).
  *   **Subjective/Culpability View:** May **be** killed. **Is** murder (or close to it).
      *   *Why:* He is culpably believing he is doing wrong. He is taking a lethal risk without moral justification *in his own mind*, and he is responsible for that ignorance. Unlike Case 7, he can't blame the disinformation campaign.

  **Why this works:**
  If she says he's safe, she's a hardline Objectivist (Facts rule). If she hesitates and says he's liable because he "should have known," she's drifting towards an Epistemic or Culpability-based view where your duty to know the truth affects your immunity. Given she got "slippery" on Case 2 (the conscript), she might try to wiggle out here, but this case forces her to choose between the *justice of the cause* and the *responsibility of the fighter*.

  Good luck. And do mind your *s*'s when you write the notes up; she'll mark it in red pen otherwise.
