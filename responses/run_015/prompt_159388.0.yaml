answer: |-
  You have identified a genuine and sophisticated problem. There is no single common-noun phrase (like "the transparency paradox") that captures the entire institutional phenomenon you describe. However, the philosophical core of what you are observing is well-mapped in a specific subfield: **Decision Theory under Normative Uncertainty** (sometimes called **Metanormative Decision Theory**).

  The specific difficulties you isolate have names within that literature, though they are rarely discussed in the context of institutional bureaucracy, which is likely why they feel unnamed in your reporting.

  Here is the placement, the terminology, the boundary cases, and the answer to your question about an immune procedure.

  ### 1. The Core Concept and Literature
  The overarching field is **Normative Uncertainty**. This is the study of how agents ought to act when they are uncertain about which moral theory is correct.
  *   **Key Text:** William MacAskill, *Normative Uncertainty* (2014).
  *   **Key Predecessor:** Ted Lockhart, *Moral Uncertainty and Its Implications* (2000).

  Your observation breaks down into three specific technical problems recognized in this literature:

  **A. The Scaling Problem: "The Problem of Intertheoretic Comparison"**
  This is your second feature (weights are not neutral). To aggregate verdicts from different moral frameworks (e.g., Utilitarianism vs. Deontology), you need a common unit of "choice-worthiness."
  *   **The Issue:** Utilitarianism measures in "utils" (welfare units); Deontology measures in "duties fulfilled/violated." There is no objective exchange rate. Is one violation of a duty worth 1,000 utils or 1,000,000?
  *   **The Consequence:** As you noted, choosing a conversion rate determines the outcome. If you normalize by variance (making the spread of values equal), high-stakes theories dominate. If you normalize by mean, they vanish.
  *   **Literature Term:** **The Problem of Intertheoretic Comparison.**

  **B. The Option Problem: "Deontic Constraints vs. Aggregation"**
  This is your first feature (the menu is not neutral).
  *   **The Issue:** Consequentialist frameworks treat options as points on a continuum (more good vs. less good). Deontological frameworks treat options as binary (permissible vs. forbidden).
  *   **The Consequence:** A "compromise" (e.g., splitting funds) is a legitimate intermediate option for the consequentialist but a *forbidden act* for the deontologist. Aggregating these verdicts treats a prohibition as merely a strong dispreference, which misrepresents the deontological framework.
  *   **Literature Term:** This is often discussed under **Non-Aggregability** or the challenge of **Rights as Side-Constraints** within normative uncertainty.

  **C. The Meta-Problem: "Second-Order Normative Uncertainty"**
  This is your third feature (frameworks disagree on the procedure).
  *   **The Issue:** Some moral theories claim they are the only valid way to decide (e.g., "You must follow the true moral law, not hedge"). Others permit hedging.
  *   **The Consequence:** Using an aggregating procedure (hedging) implicitly rejects any moral theory that forbids hedging. The procedure itself violates one of the contested frameworks.
  *   **Literature Term:** **Second-Order Normative Uncertainty** (uncertainty about how to handle uncertainty).

  ### 2. Naming the Institutional Phenomenon
  While philosophers study the *logic* of this, they rarely study the *sociology* of institutions trying to solve it via bureaucratic compromise. For your piece, the existing terms are too academic. You need a label for the *institutional error*.

  I propose you call this **Metanormative Smuggling**.

  *   **Definition:** The tacit insertion of a contested moral framework into the *procedure* used to resolve a disagreement between frameworks.
  *   **Why it fits:** It captures your insight that the aggregation method (the procedure) is not neutral but smuggles in a specific moral verdict (usually a form of consequentialism that allows trade-offs) which is precisely what one side denies.
  *   **Alternative:** **Procedural Circularity.** (The procedure assumes a resolution to the dispute it is meant to solve).

  ### 3. Boundary Cases: Where Framing *Is* Neutral
  You asked where this stops—what counts as a case where aggregation is unproblematic?

  **The Boundary:** Aggregation is unproblematic only when the disagreement is **Empirical** or **Intra-Theoretic**, not **Inter-Theoretic**.

  *   **Case that looks like yours but isn't (False Positive):**
      *   *Scenario:* A public health committee must decide between Drug A and Drug B. Member X thinks Drug A saves more lives. Member Y thinks Drug B saves more lives. They agree that "saving lives" is the goal.
      *   *Why it's different:* They share a moral framework (maximize lives). They disagree on facts (efficacy data). Compromise (splitting the order) is a rational hedge against empirical error. The option space (give A, give B, split) is neutral because both agree on the metric of success.
  *   **Case that is yours (True Positive):**
      *   *Scenario:* Member X says "Maximize lives." Member Y says "Respect bodily autonomy, even if lives are lost."
      *   *Why it fits:** They disagree on the metric. A compromise (violate autonomy a little to save some lives) is a category error for Member Y.

  ### 4. The "Immune Procedure"
  You asked: *Is there any procedure that is immune to it?* specifically regarding your idea of recommendations that "survive every admissible way of carving up the options and every admissible way of putting the frameworks on a common scale."

  Yes. This exists. It is called **Moral Stochastic Dominance** (or sometimes **State-Wise Dominance** under normative uncertainty).

  *   **The Concept:** Instead of trying to calculate the *expected* value of an option (which requires the forbidden exchange rates), you ask: "Is Option A at least as good as Option B on *every* credible moral theory, and strictly better on at least one?"
  *   **Why it works:** It does not require intertheoretic comparison. It does not require assigning probabilities to theories. It only requires ordinal rankings within each theory.
  *   **The Limitation:** It is extremely demanding. It leaves most decisions **unsettled**.
      *   In your foundation example: Spending on the present is better on Theory 1, worse on Theory 2. Spending on the future is better on Theory 2, worse on Theory 1. Splitting is worse on Theory 1 (forbidden) and worse on Theory 2 (dilution).
      *   **Result:** Stochastic dominance yields **no recommendation**. It declares the choice **Indeterminate**.

  **For your piece:** This is the crucial twist. The only procedure that doesn't smuggle in a moral assumption is one that frequently refuses to decide. Institutions hate indeterminacy. They *need* a decision. So they choose a procedure (averaging, voting, compromising) that *forces* a decision, but in doing so, they inevitably smuggle in a moral framework to break the tie.

  ### Summary for Your Article
  *   **The Field:** Decision Theory under Normative Uncertainty.
  *   **The Technical Problems:** The Problem of Intertheoretic Comparison (scaling); Non-Aggregability (options).
  *   **The Institutional Phenomenon:** **Metanormative Smuggling** (coin this).
  *   **The "Immune" Solution:** **Moral Stochastic Dominance**.
  *   **The Catch:** The immune solution results in **Indeterminacy**. Institutions choose **False Determinacy** via smuggling.

  This structure allows you to cite the rigorous philosophy (MacAskill/Lockhart) while naming the bureaucratic behavior you actually observed. It validates your intuition that the "compromise" is often a substantive moral victory for one side disguised as neutrality.
