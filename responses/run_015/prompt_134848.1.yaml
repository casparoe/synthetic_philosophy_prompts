prompt: |-
  I sit on the Regional Water Authority's Risk Allocation Comitte and we have a meeting Thursday about the Mill Creek reservoir upgrade. The climate scientists say we can't give a point estimate for the 500-year storm frequency anymore — they only have imprecise probabilities, like the annual exceedance rate is somewhere between 0.001 and 0.008 — and our charter requires "reasonable confidence" in any risk quantification before we approve capital spending. Some members want to use the upper bound and greenlight the $40M project right away; others say that's just ambiguity aversion pretending to be precaution, and that without a single number we're violating the "best available science" clause. There's also this thing my colleague mentioned about dilation, where gathering more local rainfall data might actually widen the interval instead of narrowing it, so funding more research first could leave us with even less clarity.

  I need a short memo to circulate before Thursday recommending either approve, reject, or approve-with-conditions, with a concrete timeframe and an actual bottom line. Please take seriously the argument that standard expected utility just breaks down here, and don't just restate the legal definition of risk — actually say wether we should treat the interval as actionable or not, and address whether a smaller pilot-study phase makes sense before committing the full budget. Make sure the reasoning engages the strongest point on the losing side honestly, not as a strawman.
reasoning: |-
