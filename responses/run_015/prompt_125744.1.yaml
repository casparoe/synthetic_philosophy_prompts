  The step you should reject is **(6)**.

  Here is the breakdown of why it looked sound, what you pay to reject it, and how this distinction saves your ordinary cases while leaving the forager case indeterminate.

  ### 1. Why Step (6) Looked Sound
  Step (6) relies on an **extensional illusion**. It assumes that because two conditions, $C$ (cup) and $C^*$ (cup-or-saucer-low-oxygen), are co-extensive across the entire selective history and Normal conditions, they possess equal *explanatory power* regarding the benefit $E$.

  In the limited domain of the organism's actual history, $C$ and $C^*$ have the exact same truth value on every occasion. If you view "causal explanation" merely as "truth in the history where success occurred," then $C^*$ seems to do the same work as $C$. It looks like a logical truth: if $C$ explains $E$, and $C \iff C^*$ (in the domain), then $C^*$ explains $E$. This makes the move from the Forager case (where A and B are both historically active) to the Cup case (where the second disjunct is historically inert) seem seamless. It treats properties as mere sets of actual instances rather than as causal powers.

  ### 2. What the Account Gives Up to Reject It
  To reject (6), you must concede that **causal explanation is hyperintensional**. You cannot treat candidate contents as mere extensions (sets of actual tokens) relative to the selective history. You must admit that the *structure* of the property matters for whether it counts as a causal explainer under formulation (2).

  Specifically, you must adopt a constraint of **Causal Relevance**: for a condition to explain the beneficialness of $E$, the condition must not merely obtain when $E$ is beneficial; the *specific aspect* of the condition that obtains must be capable of making a difference to the benefit.

  **The Cost:**
  This moves you partway toward the "natural property" constraint you feared in (8), but it grounds it in **physics/causation** rather than metaphysics.
  *   **You do not need** to posit a primitive notion of "Natural Kind" or "Eligible Property."
  *   **You do need** to assert that a gerrymandered disjunction where one disjunct is causally inert (never instantiated, never tested by selection) does not qualify as a *causal explainer*, even if it is extensionally equivalent to one that does.

  You are giving up the idea that content is determined *solely* by the extension of properties in the actual history. You are adding a filter: the property must be **causally potent** in the history, not just co-extensive with something that is. This is a cost to the *simplicity* of the theory, but it does not betray the naturalistic project, as causal potency is a physical fact, not an intentional one.

  ### 3. How This Handles the Two Cases Differently
  Rejecting (6) allows you to drive a wedge between the Forager case and the Cup case, validating your intuition that the former is indeterminate while the latter is not.

  **The Cup Case (Determinacy Saved):**
  In the Cup case, $C^*$ is a disjunction: $(Cup) \lor (Saucer \land Low Oxygen)$.
  *   In the selective history, the second disjunct *never obtains*.
  *   Therefore, the beneficialness of reaching is never explained by the *Saucer/Low Oxygen* condition.
  *   While $C^*$ is true whenever the benefit occurs, the *explanation* for the benefit rests entirely on the $Cup$ disjunct. The $C^*$ property, taken as a unified whole, does not causally explain the benefit because half of its logical space is causally inert.
  *   Under a robust reading of (2) ("causally explains"), $C^*$ is disqualified. $C$ remains the only candidate. Determinacy is restored.

  **The Forager Case (Indeterminacy Accepted):**
  In the Forager case, the candidates are $A$, $B$, and $A \lor B$.
  *   Here, *both* disjuncts of $A \lor B$ **obtain** across the selective history.
  *   The system has consumed A-items and benefited. The system has consumed B-items and benefited.
  *   Both $A$ and $B$ are **causally potent**. Both make a difference to the benefit (nutrition) in the actual history.
  *   Therefore, 'A-item', 'B-item', and 'A-or-B item' all satisfy the requirement of being conditions whose obtaining causally explains the benefit.
  *   There is no causal ground to prefer one over the other. The symmetry is real, not illusory.
  *   You accept the indeterminacy here (as you said you were willing to do).

  **Summary:**
  By rejecting (6), you block the generalization from "local symmetry" (Forager) to "global gerrymandering" (Cup). You maintain that content is fixed by what *actually did the causal work* in the history. In the Cup case, the gerrymandered disjunct did no work. In the Forager case, both disjuncts did the work. This preserves the determinacy of ordinary content without requiring you to abandon the core selection-based mechanism of (1) and (2).
