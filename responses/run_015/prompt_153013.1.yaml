answer: |-
  **Exam Essay Question**

  **Course:** PHI 450: Advanced Philosophy of Science
  **Topic:** Induction, Prediction, and Normativity
  **Time Allowed:** 90 Minutes

  **Prompt:**
  Nelson Goodman resolves the "new riddle of induction" by appealing to *entrenchment*: we are justified in projecting "green" rather than "grue" because "green" is better entrenched in our linguistic practice. Critics argue this solution conflates description (what we *do* project) with prescription (what we *ought* to project), leaving the normative authority of induction ungrounded.

  Write an essay that locates the precise point in Goodman's account where descriptive entrenchment attempts to assume normative force. Then, apply this analysis to the following case: A machine-learning climate classifier is trained exclusively on pre-2024 temperature records. It must classify future regimes as either "stable" or "grue-stable" (defined as stable before 2035 and chaotic thereafter). Both hypotheses fit the training data equally well, yet the model selects "stable" based on regularization preferences for simplicity.

  In your analysis, determine whether the model's preference for "stable" is justified by entrenchment or whether it reveals entrenchment as merely trained bias. Conclude by arguing whether this ML case dissolves Goodman's paradox by naturalizing induction, or sharpens it by exposing the normative gap in Goodman's solution.

  ***

  **Model Answer**

  Goodman's solution to the new riddle of induction rests on entrenchment: predicates are projectible if they have a history of successful projection. However, this invites a Euthyphro-style dilemma: are predicates projectible because they are entrenched, or entrenched because they are projectible? Goodman chooses the former, effectively defining validity in terms of past practice. The critical failure point occurs where description collapses into prescription. Entrenchment describes what we *have* projected, but claims to prescribe what we *ought* to project. Without an independent account of why past success tracks future truth, entrenchment is circular—it validates induction by citing induction. Goodman attempts to bypass this via reflective equilibrium, adjusting rules and judgments until they cohere. Yet, coherence alone does not guarantee truth-tracking.

  The machine-learning climate classifier sharpens this dilemma. Trained on pre-2024 data, the model distinguishes "stable" regimes from "grue-stable" ones (stable pre-2035, chaotic thereafter). Both hypotheses fit the training data perfectly. Yet, via regularization techniques favoring simplicity, the model selects "stable." In Goodman's terms, "stable" is entrenched within the model's architecture and training history. But is this preference justified?

  If entrenchment provides normative force, the model is rational to prefer "stable." However, the ML case reveals entrenchment as merely encoded bias. The model's preference stems from optimization constraints, not access to climatic truth. It cannot distinguish between a lawlike regularity and a coincidental pattern that happens to be simple. Here, entrenchment is purely descriptive of the training distribution. It explains why the model predicts stability, but offers no reason why the model *should* be trusted post-2035. The "ought" is missing; there is only the "is" of the weight configuration.

  This exposes the normative gap in Goodman's account. Human linguistic practice functions like the model's loss function: it selects predicates that minimized error in the past. When Goodman argues we ought to project entrenched predicates, he conflates statistical fit with normative validity. The ML case strips away the sociological comfort of "linguistic practice," revealing the logical structure underneath: entrenchment is simply inductive bias formalized. Because the model lacks agency or linguistic community, its "entrenchment" is visibly arbitrary relative to the world's actual structure.

  Consequently, the ML case sharpens the paradox rather than dissolving it. It demonstrates that entrenchment cannot bridge the is/ought gap. If the model's preference for "stable" is just trained bias, then human preference for "green" is equally ungrounded. Goodman attempts to dissolve the riddle by changing the subject from truth to validity, but the ML example shows that validity without truth-connection is merely consistency with past error. The normative reason entrenchment supposedly supplies is revealed as an illusion of stability. Therefore, the collapse of description into prescription in Goodman's account is not a solution, but a concealment of the very skepticism the riddle raises. The student must conclude that entrenchment describes our predictive habits but fails to prescribe their reliability, leaving the riddle intact. By isolating the algorithmic bias, the ML case makes the lack of external justification undeniable, forcing the conclusion that Goodman's solution is pragmatic, not epistemic.

  ***

  **Marking Scheme**

  **A Grade (80-100%)**
  *   **Identification of Normative Gap:** Explicitly locates the point in Goodman's theory where "past usage" is asked to do the work of "future justification" without external warrant.
  *   **ML Application:** Treats the ML classifier not just as an analogy, but as an isolation test. Identifies the model's regularization/simplicity preference as the functional equivalent of entrenchment.
  *   **Normative Evaluation:** Argues clearly that the ML case reveals entrenchment as *descriptive bias* rather than *normative justification*.
  *   **Conclusion on Paradox:** Takes a definitive stance that the ML case *sharpens* the paradox (by exposing the circularity) or *dissolves* it (by naturalizing validity), providing robust reasoning for that choice.
  *   **Specific Move:** Must show that the ML case removes the "human practice" shield, making the lack of truth-connection visible.

  **B Grade (60-79%)**
  *   **Summary of Goodman:** Accurately explains entrenchment and the grue paradox but spends too much time on summary.
  *   **ML Application:** Uses the ML case as a superficial analogy (e.g., "the model is like a human") without analyzing the structural equivalence of regularization and entrenchment.
  *   **Normative Evaluation:** Acknowledges the is/ought tension but fails to resolve whether the ML preference is justified or biased.
  *   **Conclusion on Paradox:** Hedges on whether the paradox is sharpened or dissolved, or claims it is dissolved without explaining how the normative gap is bridged.
  *   **Missing Move:** Fails to demonstrate how the ML case specifically undermines the normative force of entrenchment.

  \answer{The A answer must demonstrate how the ML case exposes entrenchment as descriptive bias lacking normative force, whereas the B answer treats the ML case as a mere analogy without resolving the is/ought tension.}
