  ### The Geometric Severance: Temporal Orientability and the Emergent Arrow in Gödel Spacetime

  Kurt Gödel's 1949 rotating universe solution to the Einstein field equations is frequently dismissed as a mathematical curiosity or a pathological counterexample to be excluded by cosmic censorship. Standard interpretations treat the Closed Timelike Curves (CTCs) inherent in the Gödel metric as paradoxes that threaten the coherence of causality, often leading to Gödel's own philosophical conclusion: that if such loops are possible, time itself must be an ideal construct of the mind rather than a feature of reality.

  This argument rejects both the dismissal of the model and Gödel's Kantian inference. Instead, it posits that the Gödel metric provides a rigorous structural demonstration that undermines the A-theoretic conception of an objective present and temporal flow, while simultaneously vindicating a specific variant of B-theoretic eternalism. The core of this argument rests on a distinction often blurred in philosophical discourse: the separation of *global temporal orientability* from *causal accessibility*. By demonstrating that a manifold can be continuously time-orientable everywhere while permitting causal curves to intersect their own past, the Gödel universe severs the link between the local direction of time and the global progression of history. This supports a view where temporal relations are fully real and four-dimensional, but the arrow of time is not an intrinsic feature of the manifold, but an emergent property of local thermodynamic asymmetries embedded in a globally time-symmetric geometry.

  #### 1. The Severance of Orientation and Accessibility

  To understand how Gödel's model undermines A-theory without invoking paradox, we must distinguish between two topological properties: time-orientability and the existence of a global time function. A spacetime is time-orientable if one can continuously distinguish between future-directed and past-directed light cones throughout the manifold. A spacetime admits a global time function if there exists a scalar field $t$ that increases monotonically along every future-directed causal curve.

  A-theory relies on the intuition that temporal orientation implies global succession—that moving in the "future" direction necessarily entails moving away from the "past" toward a yet-unrealized state. In Minkowski space, orientability and global time functions coincide. In the Gödel metric, they do not. The Gödel universe is time-orientable; an observer can locally and consistently define a future light cone. However, because the spacetime rotates, the light cones "tip over" as one moves radially outward. Eventually, the future light cone encompasses directions that loop back to the observer's own past coordinates.

  This structural feature severs the link between *temporal orientation* (the local vector field distinguishing past from future) and *causal accessibility* (the ability to reach events). In an A-theoretic framework, the "flow" of time is constituted by the coming into being of new moments. If one can follow the local future direction and arrive at an event that is already in one's past, the notion of a moving "now" that leaves the past behind becomes geometrically incoherent. The "future" is merely a label on a vector field, not a guarantee of linear progression.

  Crucially, this is not an argument that CTCs create logical paradoxes (e.g., killing one's grandfather) that must be avoided. Rather, it is an argument that the *geometry itself* renders the A-theoretic distinction between past, present, and future ontologically baseless. If the "future" direction leads back to the "past," then the passage of time cannot be a fundamental accumulation of new existence. The manifold exists all at once.

  #### 2. Eternalism and the Emergent Arrow

  This geometric severance necessitates a shift to a B-theoretic ontology, specifically a variant of eternalism where temporal relations are real but the *arrow* of time is emergent. In this view, the Gödel manifold is a four-dimensional block where all events—those we label "past," "present," and "future"—exist with equal ontological status.

  The prompt requires defending the view that the arrow of time is not intrinsic to the manifold. In standard cosmology, the arrow is often associated with the expansion of the universe or the gradient of entropy. In the Gödel universe, the metric is stationary; there is no global expansion. Therefore, any experienced directionality of time must be local. We can argue that the "arrow" is a thermodynamic phenomenon arising from boundary conditions within local subsystems, rather than a property of the spacetime geometry itself.

  Locally, an observer experiences entropy increase and perceives a flow of time. This is consistent with the local time-orientability of the manifold. However, globally, the geometry is time-symmetric in the sense that the metric equations allow for the reversal of the temporal coordinate without structural collapse (despite the rotation, the manifold does not intrinsically prefer one direction of the loop over the other in terms of existence). The "flow" is thus an emergent property of matter fields embedded in the geometry, not a feature of the geometry itself. This preserves the reality of temporal relations (event $A$ is timelike separated from event $B$) without requiring an objective, global present that sweeps across the universe. The "present" is merely a local cross-section of a world-line, not a global hypersurface of simultaneity.

  #### 3. Avoiding Gödel's Kantian Inference

  Gödel himself argued that the possibility of traveling into one's own past implies that time is "ideal" or unreal, akin to a Kantian form of intuition rather than an objective feature of the world. His reasoning was that if time were objective, it would possess an intrinsic directionality that precludes loops.

  The B-theoretic interpretation proposed here avoids this idealist conclusion by redefining what it means for time to be "real." For the A-theorist (and for Gödel), the reality of time is bound up with *transience*—the coming into and going out of existence. If transience is broken by loops, time is unreal. For the B-theorist, the reality of time is bound up with *structure*—the network of causal and metric relations between events.

  In the Gödel universe, the network of relations is perfectly real and objective. The metric tensor is a solution to physical law; the distances and causal connections are fixed. The fact that this structure contains loops does not make it ideal; it makes it spatially-like. By decoupling the "reality" of time from the "flow" of time, we can assert that time is objectively real (as a dimension of the manifold) even if it does not flow. Gödel's error was assuming that the *experience* of flow is a necessary condition for the *existence* of time. The Gödel metric demonstrates that the existence of time (as a dimension) is compatible with the non-existence of flow (as a global property). Thus, we retain realism about the four-dimensional manifold without succumbing to idealism.

  #### 4. World-Lines as Closed Submanifolds

  Finally, we must address the ontological status of objects within this model. The standard intuition regarding CTCs invokes the "self-intersection problem": if I travel back in time, I meet myself. How can two versions of the same person exist at the same coordinate? This intuition relies on the A-theoretic notion of a world-line as a history *traversing* an independently flowing time.

  In the proposed B-theoretic variant, world-lines are not histories of traversal; they are static, one-dimensional submanifolds embedded in the four-dimensional geometry. A particle's existence is the entire curve, not a point moving along the curve. In the Gödel universe, a material body's world-line may be a closed loop (a circle or helix embedded in 4D).

  When we say a world-line "intersects itself," we are speaking geometrically, not dynamically. It means the submanifold is not homeomorphic to an open line $\mathbb{R}$, but to a circle $S^1$. There are not "two versions" of the person at the intersection point. There is only one event in the manifold where the submanifold touches itself. The physical state of the object at that event must be consistent with the state of the object at the previous pass through that event, not because of a dynamic constraint imposed on a traveling present, but because it is the *same point* in the manifold.

  This resolves the self-intersection problem without appealing to Presentism (which fails because there is no global present) or Modal Realism (which posits branching worlds to avoid consistency constraints). There is only one world, one manifold, and one static world-line. The "paradox" of meeting oneself dissolves when we realize that "meeting" implies two distinct entities occupying the same space. In the block view, there is only one entity, extended in time, whose geometry happens to loop. The consistency of physical states is guaranteed by the static nature of the manifold: the event *is* what it *is*.

  #### Conclusion

  The Gödel rotating universe does not force us to abandon time as unreal, nor does it require us to treat CTCs as forbidden paradoxes. Instead, it serves as a rigorous proof of concept for a specific metaphysical architecture: a B-theoretic eternalism where temporal orientability is a local vector field property, decoupled from global causal ordering. By treating world-lines as closed geometric submanifolds rather than dynamic histories, we preserve the objectivity of the four-dimensional manifold while demonstrating that the "arrow of time" is an emergent thermodynamic feature, not an intrinsic geometric necessity. This interpretation respects the physics of the Gödel metric while liberating the philosophy of time from the untenable requirement of an objective, global flow. Time is real, but it is a dimension of structure, not a river of passage.
