answer: |-
  You have hit a very specific, well-known, and genuinely unresolved nerve in the foundations of probabilistic reasoning. Your suspicion is correct: there is a literature, there is a canonical name for the puzzle, and there is **no consensus** on the normative solution. The "reflexes" your team members are exhibiting map almost one-to-one onto historical positions in the philosophy of probability.

  Here is the breakdown of the landscape, separating the settled mathematics from the contested philosophy.

  ### 1. The Name of the Puzzle
  The canonical case you are describing is known as **The Judy Benjamin Problem**.

  It was introduced by **Bas van Fraassen** in his 1981 paper *"A Problem for Relative Information Minimizers"* (and later in *Laws and Symmetry*).

  **The Scenario:** Judy is a soldier dropped into territory divided into Red and Blue. She has a prior distribution over being in Red/Blue and being in HQ/Company. She receives a radio message: *"If you are in Red Territory, the probability you are in HQ is 3/4."* She receives **no information** about whether she is in Red or Blue territory.

  **The Question:** How should she update her probability of being in Red Territory ($P(\text{Red})$)?

  This matches your security analyst and geologist examples exactly: a constraint on a conditional probability $P(B|A)$ without a constraint on the marginal $P(A)$.

  ### 2. The Mathematical Core (Settled)
  There is agreement on the formal structure of the problem.

  *   **Standard Conditionalization Fails:** Bayes' rule ($P_{new}(H) = P(H|E)$) applies when you learn a proposition $E$ is true (i.e., $P_{new}(E)=1$). Here, you have not learned a proposition is true; you have learned a **constraint on the probability function**.
  *   **The Constraint Manifold:** The expert's statement defines a subset (a manifold) of the probability simplex. Any probability distribution that satisfies the ratio constraint $P(B|A) / P(C|A) = k$ is *consistent* with the evidence.
  *   **Underdetermination:** Mathematically, there are infinitely many posteriors that satisfy the constraint. To pick a single point, you must introduce an **optimization criterion** (a selection rule).

  **Settled Fact:** There is no theorem in probability theory that dictates a unique posterior from this input alone. Any unique solution requires an extra-logical principle.

  ### 3. The Proposed Solutions (Contested)
  Your team's reflexes correspond to the major schools of thought in the literature.

  #### Reflex A: "Do Nothing" (The Isolationist / Levi View)
  *   **Position:** The information is not "evidence" in the sense of a truth-apt proposition. Since $P(A)$ is unconstrained, the rational agent should not change $P(A)$. Some argue you shouldn't change anything until you learn something categorical.
  *   **Proponent:** Isaac Levi (*The Enterprise of Knowledge*).
  *   **Argument:** Learning a conditional should not affect the probability of the antecedent unless the conditional implies something about the antecedent. To change $P(A)$ is to hallucinate information.
  *   **Status:** Philosophically robust, but practically useless for ML modeling (you get no update).

  #### Reflex B: "Keep Antecedent Fixed, Shuffle Inside" (The Jeffrey View)
  *   **Position:** This is a form of **Jeffrey Conditioning** (or Probability Kinematics). You treat the partition $\{A \cap B, A \cap C, \neg A\}$ as the basis. You fix $P(A)$ and $P(\neg A)$ at their prior values, and redistribute mass within $A$ to satisfy the ratio.
  *   **Proponent:** Richard Jeffrey (*The Logic of Decision*).
  *   **Argument:** This respects the "irrelevance" of the information to the antecedent. It minimizes disruption to the marginals.
  *   **Status:** Very common in applied settings, but criticized for being ad hoc. Why privilege the marginal $P(A)$ over other functions of the distribution?

  #### Reflex C: "Closest Posterior" (The MinXent / Infomin View)
  *   **Position:** Choose the posterior $Q$ that minimizes the Kullback-Leibler divergence (relative entropy) from the prior $P$, subject to the constraint.
      $$ \min_Q D_{KL}(Q || P) \quad \text{s.t.} \quad Q(B|A) = \text{constraint} $$
  *   **Proponent:** E.T. Jaynes (*Probability Theory: The Logic of Science*), Ian Good.
  *   **Argument:** This is the **Principle of Minimum Information (MinXent)**. It makes the smallest possible change to the belief state required to accommodate the new constraint. It is the standard "default" in statistical mechanics and many ML applications.
  *   **Status:** This is the dominant approach in Machine Learning and Physics. **However**, it is the source of the major philosophical controversy.

  #### Reflex D: "Ask for More" (The Pragmatist)
  *   **Position:** The problem is ill-posed.
  *   **Status:** Correct, but often operationally impossible.

  ### 4. The Fault Line: Why MinXent is Not a Theorem
  Your suspicion that "at least one popular rule gets presented like a theorem when it's really a choice" is **100% correct**. This is the heart of the Judy Benjamin controversy.

  **The Controversy:**
  When you apply MinXent (KL-minimization) to the Judy Benjamin problem, **the probability of the antecedent $P(A)$ usually changes.**

  Even though the expert said *"I have no view on whether the attacker has admin access,"* the MinXent solution will typically shift your prior probability of "admin access."

  *   **Why?** Because KL-divergence measures distance in terms of log-ratios of probabilities. To satisfy the conditional constraint while minimizing global "information cost," the optimizer often finds it "cheaper" to shift the mass of the antecedent branch ($A$) relative to the complement ($\neg A$) than to distort the internal structure of $A$ too severely.
  *   **The Objection:** Van Fraassen and others argue this is irrational. If I tell you "If it rains, the match is cancelled," and I explicitly say "I don't know if it will rain," why should your belief that *it will rain* change? The MinXent rule violates the intuition that conditional information should be "screened off" from the antecedent's marginal.
  *   **The Defense:** Proponents (like Jaynesians) argue that "closeness" in probability space *just is* defined by KL-divergence. If the math says $P(A)$ shifts, then rationality demands it shifts. They argue the intuition that $P(A)$ shouldn't change is a cognitive bias, not a logical rule.

  **Key Paper:** Van Fraassen, B. C. (1981). "A Problem for Relative Information Minimizers." *British Journal for the Philosophy of Science*.
  **Key Counter:** Williams, P. M. (1980). "Bayesian Conditionalisation and the Principle of Minimum Information."

  ### 5. Summary for your PhD Work
  Since you are in ML, you need to make an engineering choice, but you should document the philosophical debt.

  1.  **The Literature Name:** Cite **The Judy Benjamin Problem** (van Fraassen, 1981) and **Probability Kinematics** (Jeffrey, 1965).
  2.  **The Method:** The standard ML approach is **Minimum Cross-Entropy (MinXent)** updating.
  3.  **The Caveat:** You must acknowledge that MinXent implies a shift in the marginal probability of the antecedent ($P(A)$), even if the expert provided no information on $A$.
  4.  **The Justification:** Do not claim this is "Bayesian Rationality." Claim it is **Information Conservatism**. You are selecting the distribution that satisfies the constraints while assuming "nothing else has changed" *in the sense of KL-divergence*.
  5.  **Alternative:** If your domain experts strongly intuit that $P(A)$ *must not* change (e.g., physical constraints), you should use **Jeffrey Conditioning** on the partition $\{A, \neg A\}$, fixing the marginals and updating only the conditionals. This is mathematically distinct from MinXent.

  ### 6. Where the Bodies are Buried
  If you want to read the "fight" explicitly:
  *   **Diaconis & Zabell (1982):** "Updating Subjective Probabilities." They provide a beautiful mathematical characterization of when Jeffrey conditioning vs. MinXent arises. They show that Jeffrey conditioning is justified if the learning experience is "sufficient" for the partition, but MinXent is needed for general constraints.
  *   **Hájek (2003):** "Conditional Probability is the Very Guide of Life." Discusses the difficulties of learning conditionals.
  *   **Douven & Romeijn (2011):** "A New Resolution of the Judy Benjamin Problem." They argue the solution depends on the *protocol* by which the information was received (a meta-probabilistic consideration).

  **Bottom Line:** You are not missing a theorem. You are encountering the boundary where probability calculus ends and epistemology begins. In ML, we usually pick MinXent for computational tractability and its connection to exponential families, but you should be explicit in your thesis that this is a **modeling assumption about information distance**, not a derivation from the axioms of probability.
