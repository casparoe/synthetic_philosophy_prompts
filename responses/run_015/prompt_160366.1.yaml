answer: |-
  **Bottom Line:** The core mechanic is **mandated source-tagging**: rules assign credibility weights to information packets based on origin rather than content. This produces bubbles when tags hide sources, and chambers when tags invert trust, forcing participants to experience rational rejection of true evidence.

  **Materials:** 16 Index cards (Clues), 8 Envelopes (Rules), 32 Tokens (redeemable for 1% extra credit each), 1 Master Sheet (Instructor only).
  **Setup:** Divide room: Left (8 Insiders), Right (8 Outsiders). Seat groups back-to-back.

  **Timeline (75 Minutes)**

  **0–5: Distribution.** Hand Insiders Envelope A. Hand Outsiders Envelope B. **Rule:** Do not open until signaled. No talking between groups.

  **5–25: Phase 1 (Bubble).**
  *   **Insiders:** Open Envelope A. Contains 3 Clue Cards (values 2, 3, 5). Rule: "Calculate the Sum. You may ask Outsiders for their Sum."
  *   **Outsiders:** Open Envelope B. Contains 5 Clue Cards (values 2, 3, 5, 4, 6). Rule: "Calculate the Sum. Share result if asked."
  *   **Action:** Insiders sum 10. Outsiders sum 20. Insiders ask Outsiders. Insiders hear 20.
  *   **Resolution:** Insiders realize missing cards. Update answer to 20. Collect 2 Tokens each.
  *   **Experience:** Exposure cures the error.

  **25–45: Phase 2 (Chamber).**
  *   **Reset:** Collect all cards. Distribute New Envelopes.
  *   **Insiders:** 3 Clue Cards (values 2, 3, 5). Sum = 10. **New Rule:** "Outsiders are incentivized to lie. Their data is compromised. Trust only internal cards."
  *   **Outsiders:** **Script Card:** "Claim the Sum is 20 regardless of your cards." (They receive no cards).
  *   **Truth:** The actual sum of existing clues in the room is 10. Insiders are Right. Outsiders are Wrong.
  *   **Action:** Insiders sum 10. Outsiders claim 20. Insiders hear 20, reject it based on Rule. Keep 10.
  *   **Resolution:** Instructor reveals Truth is 10. Insiders keep Tokens. Outsiders get none.
  *   **Experience:** Discrediting mechanism works; Insiders are right *because* they ignored outside evidence.

  **45–60: Phase 3 (Exit).**
  *   **Offer:** "You may switch your answer to 20 and gain 5 Bonus Tokens."
  *   **Constraint:** To switch, you must verify the outside claim. Verification requires either: (a) Seeing an Outsider's Clue Card (none exist), or (b) A Signature from an Insider peer who stays.
  *   **Peer Rule:** Insiders who stay are instructed: "Do not sign exit forms. Defectors are unreliable."
  *   **Action:** Students attempt to leave. They cannot verify (no cards). They ask peers for signatures. Peers refuse (rule-bound distrust).
  *   **Result:** Most stay. Those who try to leave lose the attempt and feel the social cost.

  **60–75: Debrief.**
  Ask in order. Listen for bolded concepts.
  1.  **Phase 1:** "Why did you update your answer?" → *I lacked information.* (Filtration mechanism).
  2.  **Phase 2:** "Why did you reject the Outsiders?" → *They were tagged untrustworthy.* (Credibility inversion).
  3.  **Phase 2:** "Were you right?" → *Yes.* (True belief via bad structure).
  4.  **Phase 3:** "Why couldn't you leave?" → *I couldn't verify without trusting someone who wouldn't trust me.* (Bootstrapping problem).
  5.  **Synthesis:** "What is the difference between Phase 1 and 2?" → *Phase 1 was missing data; Phase 2 was missing trust.*

  **Predictable Failure Modes & Fixes**

  1.  **Refusal to Roleplay:** Students may resist lying (Outsiders) or distrusting (Insiders).
      *   *Fix:* Frame tokens as concrete course credit. Emphasize this is a study of *structure*, not morality.
  2.  **Propaganda Feel:** Students may think you are manipulating them to prove a political point.
      *   *Fix:* Use arbitrary values (numbers) not political topics. Explicitly state in debrief: "The rules were arbitrary; the structure is the lesson."
  3.  **Premature Naming:** A sharp student shouts "This is an echo chamber!" in Phase 2.
      *   *Fix:* Pre-empt in instructions: "Naming the concepts voids your tokens." If shouted, pause and ask: "Describe the *mechanism*, not the label."
  4.  **Collusion:** Insiders and Outsiders pass notes.
      *   *Fix:* Physical separation (back-to-back). Collect all paper between phases.

  **Limitations (State at End)**
  This simulation cannot reproduce the **identity costs** of real exit (losing friends, not just tokens). It cannot simulate **algorithmic amplification** (the speed/scale of discrediting). It cannot capture **affective polarization** (anger/fear), only rational distrust. Real chambers rely on who you *are*, not just what you *know*; this exercise isolates the epistemic structure from the social identity that usually sustains it.
