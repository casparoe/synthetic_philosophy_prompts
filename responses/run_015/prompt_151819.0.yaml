      (Drafting thought process): Start with the audit. The press office implies a Cartesian Theater. Dennett denies the theater. The mapping breaks at the "Issue" stage.
      The masked word case: The lab sees two broadcasts. You see probe-dependent drafts. MDM predicts the neural signature of "seeing" should correlate with the *report given*, not the stimulus onset alone. If the report changes with the probe, the "conscious content" changes.
      The repair: "On the record" is just "available for global control." If downstream processing determines this, then consciousness is not a bottleneck event but a relational property. This saves the data analysis (you can still code for 'record') but kills the architectural claim (the bottleneck isn't the *source* of consciousness, it's just a hub that *can* be put on record).
