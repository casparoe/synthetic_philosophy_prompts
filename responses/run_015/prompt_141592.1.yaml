  # Joint Statement on Causal Attribution for INC-1129

  **Date:** 2023-10-27
  **Signatories:** Engineering Lead (Manipulability Camp), Staff Engineer (Counterfactual Camp)
  **Subject:** Agreement on Causal Framework for Incident Review

  ### 1. Agreed Claims
  1.  **A1 (Purpose):** Causal claims in this setting are tools for **actionability** (choosing what to change to prevent recurrence or reduce impact), not metaphysical truths. Credit assignment and responsibility are separate social processes that may diverge from causal attribution.
  2.  **A2 (Relativization):** Causal status is relative to a defined **outcome variable**. For INC-1129, we distinguish between the binary outcome "SLO Breach Occurred" (Yes/No) and the continuous outcome "Breach Duration/Severity" (Seconds/Revenue).
  3.  **A3 (Model Dependence):** Neither camp can read causation off raw data alone. Both require a **causal model** (here, the replay simulator + production canary) to evaluate dependencies or interventions.
  4.  **A4 (Verdicts on Candidates):**
      *   **C1 (Retry Jitter) & C2 (Payload Size):** Both camps agree these are **Causes** of the Breach. (Necessary for occurrence; manipulable).
      *   **A (Autoscaler Policy):** Both camps agree this is a **Cause** of the Breach. (Absence necessary for occurrence; policy is manipulable).
      *   **B (Stale Kernel) & U (User Refresh):** Camps diverge.
          *   *Manipulability:* **Neither**. (Cannot be intervened upon in reality).
          *   *Counterfactual:* **Contributing Factors**. (Not causes of Breach occurrence, but causes of Breach Severity/Duration).

  ### 2. Formulations
  *   **Manipulability Principle:** "A factor is a cause if a realistic intervention on that factor, holding background conditions fixed, would change the outcome."
      *   *Counterfactual Camp Confirmation:* "Fair, provided 'realistic intervention' includes policy changes and code reverts, not just physical hardware swaps."
  *   **Counterfactual Principle:** "A factor is a cause if the outcome (occurrence or magnitude) would have differed had that factor been absent or altered."
      *   *Manipulability Camp Confirmation:* "Fair, provided we agree that 'differed' must be significant enough to matter for our SLO, not just theoretical noise."

