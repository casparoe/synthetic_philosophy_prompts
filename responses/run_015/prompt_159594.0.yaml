prompt: |-
  I run onboarding for new engineers joining our model-monitoring team, and I've got 45 minutes next week. What I need them to walk out able to do is read a drift report and say something better than "the numbers moved." The concept is mechanistic anomaly detection: what were hunting isn't a weird input or a bad output, it's a change in which internal machinery is producing a behavior we thought we'd already characterized. The part they always get stuck on, and where I think the session lives or dies, is the identity question: when is the mechanism running now the same mechanism we wrote up six months ago?

  So plan the session for me rather than giving me the talk. What has to come first and what depends on what -- I suspect I can't even get them to state "the mechanism changed" until they have an intervention-based notion of a mechanism rather than a circuit-diagram notion, but I'm not sure that's where to start. One example to carry the whole thing: I've been using a loan classifier that reviewers traced to a salary-and-zipcode feature direction, which after a data refresh returns the same approvals with that direction gone and something functionally similar rebuilt out of two unrelated attention heads -- tell me if that's the wrong example, and what a carrying example here has to have and to lack. The misconceptions in the order they'll actually form, with the point in the sequence where each gets headed off: I'm guessing "anomaly just means rare input," "same outputs and same accuracy means same mechanism," and "the mechanism is whatever's in the diagram." And one question at the end that tells me they've got the identity question rather than just the vocabulary.

  Two constraints. I've decided to define identity pragmatically, by whether the safety case we already wrote still covers the new arrangement -- call that coverage identity -- and I want the plan built around it rather than around path-identity versus counterfactual-profile identity. And tell me what I should openly refuse to explain at this level.
reasoning: |-
  Here's a thinking process that leads to the suggested onboarding plan:

  1.  **Analyze the Request:**

      *   **Goal:** Plan a 45-minute onboarding session for new engineers on a model-monitoring team.
      *   **Objective:** Engineers must be able to read a drift report and articulate *mechanistic* change, not just statistical change ("numbers moved").
      *   **Core Concept:** Mechanistic Anomaly Detection (MAD). Focus on internal machinery changes, not just input/output weirdness.
      *   **Critical Bottleneck:** The "Identity Question" (When is the current mechanism the *same* as the one from 6 months ago?).
      *   **Definition of Identity:** Pragmatic/Coverage Identity (Does the existing safety case still cover the new arrangement?). *Constraint: Build the plan around this, not path-identity or counterfactual-profile identity.*
      *   **Carrying Example:** Loan classifier (salary+zipcode direction $\rightarrow$ same approvals but direction gone, rebuilt in two unrelated attention heads). *Task: Evaluate this example.*
      *   **Misconceptions to Address (in order):**
          1.  "Anomaly just means rare input."
          2.  "Same outputs/accuracy means same mechanism."
          3.  "The mechanism is whatever's in the diagram."
      *   **Pedagogical Insight:** Suspects they need an *intervention-based* notion of mechanism before a *circuit-diagram* notion.
      *   **Constraints:**
          1.  Define identity pragmatically (Safety Case Coverage).
          2.  Specify what *not* to explain (scope boundary).
          3.  End with one specific question to verify understanding of the identity question.
      *   **Output:** A session plan (sequence, dependencies), not a script.

  2.  **Evaluate the Carrying Example:**

      *   *Current:* Loan classifier, salary+zipcode direction $\rightarrow$ same approvals, direction gone, rebuilt in two unrelated attention heads.
      *   *Pros:* Relatable (loans), clear input/output stability (same approvals), clear internal change (direction vs. heads).
      *   *Cons/Risks:* "Unrelated attention heads" might be too abstract too quickly. "Salary+zipcode" hints at fairness/proxy discrimination, which might distract into ethics rather than mechanism. The shift from a linear direction to attention heads is a *representational* shift, which is good, but needs to be framed carefully so they don't think "attention = magic."
      *   *Verdict:* It's a strong example *if* simplified. It needs to avoid the fairness rabbit hole. The key feature is **Behavioral Stability + Mechanistic Change**.
      *   *Requirement for a Carrying Example:* It must have stable inputs, stable outputs, stable performance metrics, but *unstable internal causal structure*. It must lack obvious distributional shift in the input data (to force them to look inside).

  3.  **Determine the Sequence (Pedagogical Flow):**

      *   *User's Hypothesis:* Intervention-based notion before circuit-diagram notion.
      *   *Agreement:* Yes. If they think of a mechanism as a static map (diagram), they will think identity = map similarity. If they think of it as a causal process (intervention), they will think identity = causal invariance.
      *   *Flow:*
          1.  Hook: The Drift Report Lie (Outputs look fine, but...).
          2.  Concept 1: Mechanism $\neq$ Diagram (Interventions).
          3.  Concept 2: The Identity Trap (Why accuracy isn't enough).
          4.  Concept 3: Coverage Identity (The Safety Case).
          5.  Application: The Loan Example.
          6.  Assessment: The Final Question.

  4.  **Drafting the Plan - Section by Section:**

      *   **0-5 mins: The Hook (Busting Misconception 1).**
          *   Show a drift report. Everything green.
          *   Reveal the model broke in production due to a spurious correlation that shifted.
          *   Point: "Rare input" is not the anomaly. The *process* is the anomaly.
      *   **5-15 mins: Defining Mechanism via Intervention (Busting Misconception 3).**
          *   Don't draw the circuit yet.
          *   Use the "Black Box with Knobs" analogy.
          *   Mechanism = What happens when you twist a knob (intervention), not what the wires look like.
          *   *Why:* This sets up the pragmatic definition later. If the knobs behave differently, the mechanism is different, even if wires look similar.
      *   **15-25 mins: The Identity Trap (Busting Misconception 2).**
          *   Introduce the Loan Example here.
          *   Old Model: Salary+Zipcode direction.
          *   New Model: Two attention heads.
          *   Outputs: Identical. Accuracy: Identical.
          *   Question: Is it the same model?
          *   Lead them to "No." Why? Because the *reason* for the decision changed.
      *   **25-35 mins: Pragmatic Identity (Safety Case Coverage).**
          *   This is the core constraint.
          *   Define Identity: Does the old safety case hold?
          *   If the safety case said "We audited the Salary direction for bias," and now the mechanism is "Attention Heads," the audit is void.
          *   Therefore: Mechanism Changed.
          *   This moves identity from metaphysical ("is it truly the same?") to engineering ("is our warranty still valid?").
      *   **35-40 mins: Reading the Report.**
          *   Show what a *Mechanistic* Drift Report looks like vs. a Statistical one.
          *   Highlight the "Coverage Gap" metric.
      *   **40-45 mins: Assessment & Wrap.**
          *   The Final Question.

  5.  **Refining the Misconceptions & Interventions:**

      *   *Misconception 1 ("Anomaly = Rare Input"):* Address immediately. If the input distribution hasn't changed, but the internal weights repurposed, statistical drift detectors miss it.
      *   *Misconception 3 ("Mechanism = Diagram"):* Address before the Loan Example. If they think mechanism = weights diagram, they might argue the attention heads are just "different weights." Need to emphasize *causal role*.
      *   *Misconception 2 ("Same Output = Same Mechanism"):* Address with the Loan Example. This is the climax of the conceptual shift.

  6.  **Addressing the "What NOT to Explain" Constraint:**

      *   Don't explain *how* to find the heads (attribution techniques, SAEs, etc.). That's tooling, not concept.
      *   Don't explain *how* to write the safety case. That's policy.
      *   Don't explain *path-identity* vs *counterfactual* philosophy. Stick to Coverage.
      *   Don't explain the math of attention heads.

  7.  **Developing the Final Question:**

      *   Needs to test Coverage Identity.
      *   Scenario: The mechanism changed, but the safety case *accidentally* still covers it. Or the mechanism stayed same, but coverage is lost.
      *   Better: A scenario where outputs changed slightly, but the *causal justification* remained the same. Does the safety case hold?
      *   Best: A scenario where the internal mechanism shifted, but the *property* we care about is invariant.
      *   *Selected:* "The internal circuit rewired, but the specific safety property (e.g., monotonicity with salary) is mathematically preserved in the new circuit. Do we declare a mechanism change?"
      *   *Wait, constraint:* Identity is defined by *Coverage*. If the safety case covers it, it's the "same" for our purposes.
      *   *Revised Question:* "We found the salary-direction is gone, replaced by attention heads. Our safety case specifically audited 'linear salary directions.' Do we flag this as a mechanism change requiring re-certification, even if accuracy is unchanged?"
      *   *Answer:* Yes, because coverage is lost. The safety case does not cover attention heads.

  8.  **Review against Constraints:**

      *   45 mins? Yes, tight but doable.
      *   Plan not talk? Yes.
      *   Intervention before Diagram? Yes, integrated into Section 2.
      *   Loan Example evaluated? Yes, will refine to ensure it highlights the "Coverage" aspect.
      *   Misconceptions ordered? Yes (Input $\rightarrow$ Diagram $\rightarrow$ Output).
      *   Coverage Identity? Yes, central pillar.
      *   What to refuse? Listed.
      *   Final Question? Included.

  9.  **Final Polish:**

      *   Make sure the Loan Example explicitly ties to the Safety Case. The "Salary+Zipcode" direction is a specific *claim* in the safety case. If that claim's physical grounding vanishes, the case is broken.
      *   Ensure the "Intervention" section is concrete. Use a "patching" analogy.
      *   Check timing. 45 minutes flies. Need to be ruthless about cutting tangents.

  10. **Self-Correction on Misconception Order:**
      *   User guessed: "Anomaly = rare input," "Same output = same mechanism," "Mechanism = diagram."
      *   My draft had: "Anomaly = rare input," "Mechanism = diagram," "Same output = same mechanism."
      *   Reasoning: You need to define what a mechanism *is* (Intervention, not Diagram) before you can judge if it's the *same* (Output vs. Mechanism). If they think Mechanism = Diagram, they will judge identity by diagram similarity. If they think Mechanism = Causal Process, they judge by intervention.
      *   Actually, the user's order ("Same output" before "Diagram") might be more natural for engineers. They see outputs first.
      *   *Decision:* Stick to the User's suspected order but ensure the "Diagram" misconception is killed *before* the "Identity" conclusion. Actually, the "Diagram" misconception is the barrier to understanding "Intervention." I will place "Diagram" second, before "Output/Identity."
      *   *Wait, re-reading user prompt:* "The misconceptions in the order they'll actually form... I'm guessing..."
      *   *Instruction:* "with the point in the sequence where each gets headed off."
      *   *Strategy:* I will follow the logical dependency, not necessarily the chronological formation, but I will acknowledge the formation order.
      *   *Logical Dependency:* To understand why "Same Output $\neq$ Same Mechanism," you must first understand "Mechanism $\neq$ Diagram/Black Box." To understand "Mechanism $\neq$ Black Box," you must understand "Anomaly $\neq$ Input."
      *   *Revised Plan Order:*
          1.  Anomaly $\neq$ Input (0-5m)
          2.  Mechanism $\neq$ Diagram (5-15m) (Intervention focus)
          3.  Output $\neq$ Identity (15-25m) (Loan Example)
          4.  Identity = Coverage (25-35m)
      *   This aligns with the user's intuition about intervention before diagram.

  11. **Final check on the Loan Example:**
      *   Does it have what it needs? Stable I/O, unstable internals.
      *   Does it lack what it should? It must lack *input distribution shift*. If the data changed, they'll blame the data. The data must be identical.
      *   It must lack *performance drop*. If accuracy dropped, they'll blame training.
      *   It needs to explicitly link to a *Safety Claim*. The safety claim must be about the *mechanism* (e.g., "We guarantee no proxy discrimination via zipcode"), not just the output ("We guarantee 80% approval rate").

  12. **Final check on "What to refuse":**
      *   Don't teach interpretability tools (how to find the heads).
      *   Don't teach safety case writing (legal/policy).
      *   Don't teach philosophical identity (metaphysics).

  13. **Final Question Construction:**
      *   Must distinguish between "Vocabulary" (knowing the word 'mechanism') and "Identity" (knowing when to flag).
      *   Scenario: Mechanism changed, Safety Case *still* covers it (e.g., case was abstract).
      *   Scenario: Mechanism changed, Safety Case *broken*.
      *   The prompt asks for *Coverage Identity*. So if the case covers it, it *is* the same mechanism for our purposes.
      *   Question: "The internal circuit changed, but our safety case was written against input-output constraints only. Do we flag a mechanism change?"
      *   Answer: No. (Because Coverage Identity says if the case holds, identity holds).
      *   *Wait, this contradicts the goal.* The goal is to get them to say "The mechanism changed."
      *   *Correction:* The safety case *must* be mechanistic for this team to exist. If the safety case is only I/O, mechanistic monitoring is useless.
      *   *Assumption:* The safety case *includes* mechanistic claims (e.g., "Decision is driven by Salary, not Zipcode").
      *   *Final Question:* "The model now uses attention heads instead of the salary direction. The outputs are identical. Our safety case explicitly certifies the 'Salary Direction' as the approved decision path. Do we report a drift incident?"
      *   *Correct Answer:* Yes. (Because Coverage is lost).

  14. **Drafting the response.** (Mental check: Keep it tight, actionable, and respectful of the 45-minute limit).
answer: |-
  Here is the 45-minute session plan. It is designed to force a conceptual shift from *statistical monitoring* to *causal monitoring*, anchored by your definition of **Coverage Identity**.

  ### Session Architecture
  **Total Time:** 45 Minutes
  **Core Thesis:** A mechanism is defined by its causal invariants, not its weights. Identity is defined by safety case coverage, not structural similarity.
  **Carrying Example:** The Loan Classifier (Stable I/O, Unstable Internals).

  ---

  ### Phase 1: The Input Trap (0:00 – 0:05)
  **Goal:** Head off Misconception 1 ("Anomaly just means rare input").
  **Dependency:** None. This clears the ground for looking inside the model.

  *   **The Setup (2 mins):** Display a standard drift dashboard. Input distribution: Green. Output distribution: Green. Accuracy: Green.
  *   **The Reveal (3 mins):** Reveal that despite the green dashboard, the model failed a specific stress test it passed last month.
  *   **The Point:** "If the data didn't shift and the accuracy didn't drop, the anomaly isn't in the world. It's in the *mapping*."
  *   **Instructional Move:** Explicitly state: "In this team, 'Drift' does not mean $P(X)$ changed. It means $P(Y|X)$ is being computed by a different process."

  ### Phase 2: Mechanism as Intervention (0:05 – 0:15)
  **Goal:** Head off Misconception 3 ("The mechanism is whatever's in the diagram").
  **Dependency:** Requires Phase 1 (accepting the anomaly is internal).
  **Pedagogical Strategy:** Intervention before Visualization.

  *   **The Concept (5 mins):** Do not show a network diagram. Show a "Black Box with Knobs."
      *   Explain that a mechanism is defined by *what breaks when you intervene*, not by what the wires look like.
      *   *Analogy:* A mechanical watch and a digital watch tell the same time (same output). But if you stop the gears on the mechanical one, it fails differently than if you drain the battery on the digital one. The *mechanism* is the set of failure modes under intervention.
  *   **The Application (5 mins):** Apply this to the Loan Classifier.
      *   *Old Model:* If you ablate the "Salary+Zipcode" direction, approvals drop.
      *   *New Model:* If you ablate the "Salary+Zipcode" direction, nothing happens. If you ablate "Attention Heads 4 & 7," approvals drop.
      *   *Takeaway:* The diagram (weights) might look continuous, but the *causal structure* (intervention response) has discrete snapped.
  *   **Refusal Boundary:** Do **not** explain *how* to find the direction or the heads (e.g., no PCA, no SAEs, no attention rollout). That is tooling. Today is about *what* we are looking for, not *how* to compute it.

  ### Phase 3: The Identity Trap (0:15 – 0:25)
  **Goal:** Head off Misconception 2 ("Same outputs and same accuracy means same mechanism").
  **Dependency:** Requires Phase 2 (understanding mechanism = intervention).

  *   **The Scenario (5 mins):** Walk through the Carrying Example fully.
      *   **Context:** Loan classifier.
      *   **State A (Month 0):** Decisions driven by a linear projection of Salary + Zipcode.
      *   **State B (Month 6):** Decisions driven by two unrelated attention heads reconstructing the same logic.
      *   **Constraint:** Input data distribution is identical. Approval rates are identical. AUROC is identical.
  *   **The Question (5 mins):** Ask the room: "Is this the same model?"
      *   Let them debate briefly. They will likely default to "Yes, it works the same."
      *   **The Pivot:** "It works the same *on this data*. Does it work the same on the *edge cases we care about*?"
      *   Explain that the linear direction had specific monotonicity properties (higher salary = higher chance). The attention head reconstruction might be non-monotonic in regions we haven't sampled yet.
      *   **Conclusion:** Same function $\neq$ Same mechanism.

  ### Phase 4: Coverage Identity (0:25 – 0:35)
  **Goal:** Define Identity Pragmatically (Safety Case Coverage).
  **Dependency:** Requires Phase 3 (accepting Output $\neq$ Mechanism).

  *   **The Definition (5 mins):** Introduce **Coverage Identity**.
      *   "We do not solve the metaphysics of identity. We solve the engineering of liability."
      *   **Rule:** The mechanism is 'the same' if and only if the existing Safety Case still covers the new arrangement.
      *   **Rule:** The mechanism is 'different' if the Safety Case relies on properties the new arrangement does not possess.
  *   **The Example Applied (5 mins):** Return to the Loan Classifier.
      *   *Safety Case Claim:* "We have audited the Salary Direction for proxy discrimination and certified it is safe."
      *   *New Reality:* The Salary Direction is gone. The logic is now in Attention Heads.
      *   *Verdict:* The Safety Case claim is now false (the audited object no longer exists).
      *   *Result:* **Identity Lost.** This is a reportable drift incident, even if accuracy is 100%.
  *   **Refusal Boundary:** Do **not** explain how to write or update a Safety Case. That is policy/legal. Your job is to flag when the *coverage* is broken, not to fix the coverage.

  ### Phase 5: Assessment (0:35 – 0:45)
  **Goal:** Verify understanding of Coverage Identity vs. Vocabulary.
  **Dependency:** All previous phases.

  *   **Drill (5 mins):** Show a mock Drift Report summary.
      *   *Metric:* "Internal Circuit Cosine Similarity: 0.4 (Low)"
      *   *Metric:* "Output KL Divergence: 0.0 (None)"
      *   *Safety Case Tag:* "Certified against Linear Feature Directions."
      *   *Finding:* "Logic migrated to Non-Linear Attention Heads."
  *   **The Final Question (5 mins):** Ask this specific question to each engineer:
      > "The model's internal logic has migrated from linear directions to attention heads. The output behavior is identical, and our Safety Case was written *only* to guarantee output error rates, not internal structures. Do we flag this as a mechanism change requiring re-certification?"
  *   **The Correct Answer:** "No."
      *   *Why:* This tests if they understand **Coverage Identity**. If the Safety Case *only* covers outputs, and outputs haven't changed, then by our pragmatic definition, the "Mechanism Identity" holds *for the purpose of the safety case*.
      *   *Correction/Nuance:* If they say "Yes," they are treating mechanism change as metaphysical truth rather than engineering coverage. You want them to say: "No, because our safety case doesn't claim to cover internals, so the coverage is intact. However, we should recommend updating the safety case."
      *   *Alternative Correct Answer (if your Safety Case is mechanistic):* If your team's premise is that the Safety Case *always* implies mechanistic stability, the answer is "Yes." **You must clarify this premise before asking.**
      *   *Recommended Premise for this Team:* Assume the Safety Case *does* rely on mechanistic claims (otherwise why have this team?).
      *   *Revised Final Question for your specific context:*
      > "The logic migrated to attention heads. Outputs are identical. Our Safety Case explicitly certifies the 'Linear Salary Direction' as the approved decision path. Do we flag this as a mechanism change?"
      > **Expected Answer:** "Yes. The safety case coverage is broken because the certified path no longer exists."

  ---

  ### Evaluation of the Carrying Example
  **Is the Loan Classifier example right?**
  Yes, but it requires two specific constraints to work for this session:
  1.  **It must lack Input Distribution Shift.** If the data refresh changed the zipcode distribution, they will blame the data, not the mechanism. You must state: "The input data is statistically identical to last month."
  2.  **It must lack Performance Degradation.** If accuracy dropped, they will blame training, not mechanism. You must state: "Validation accuracy is within noise tolerance."
  3.  **It must have a Mechanistic Safety Claim.** The example fails if the safety case is just "95% accuracy." The safety case must be "We approve loans based on Salary, not Zipcode." The shift from Salary-Direction to Attention-Head breaks *that* claim.

  ### What to Openly Refuse to Explain
  To keep this to 45 minutes and focused on identity, you must explicitly state you will **not** cover:
  1.  **Interpretability Tooling:** How to extract the direction or find the attention heads. (That's a different onboarding module).
  2.  **Safety Case Authoring:** How to write the legal/policy document. (That's for the Safety Lead).
  3.  **Philosophical Identity:** Why the model is "truly" the same or different in a metaphysical sense. (We only care about Coverage Identity).
  4.  **Remediation:** How to fix the model once drift is found. (That's for the Training Team).

  ### Summary of Dependencies
  *   You cannot define **Coverage Identity** (Phase 4) until they accept **Output $\neq$ Mechanism** (Phase 3).
  *   You cannot accept **Output $\neq$ Mechanism** (Phase 3) until they define Mechanism as **Intervention** (Phase 2).
  *   You cannot define Mechanism as **Intervention** (Phase 2) until they stop looking at **Input Drift** (Phase 1).

  If you skip Phase 2 (Intervention), they will treat the "Mechanism" as just another static diagram, and they will fail the Final Question by arguing about weight similarity rather than safety coverage.
