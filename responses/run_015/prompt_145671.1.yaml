answer: |-
  Your observation is exceptionally sharp, and you have put your finger on a genuine tension in how we evaluate each other, even though there is no single canonical term for it in ethical literature. If you are looking for a word like utilitarianism or deontology that sits in a textbook definition, you will not find one, but the phenomenon is widely discussed under the overlapping headers of moral worth, supererogation, and signaling theory. Since there is no established label, I will offer you a descriptive term that captures the mechanics of what you are seeing, which is the Visibility of Deliberation. This term refers to the way in which making the process of moral calculation observable changes the moral credit or blame assigned to an optional act, independent of the act's outcome or the validity of the reasons given. The boundary cases for this concept are crucial for understanding its limits. For instance, if a volunteer declines because they are physically incapacitated, deliberation does not incur a penalty because the constraint is external and obvious. Similarly, if a volunteer accepts a run but explicitly states they did so only for a reward, the praise is diminished, which is the mirror image of your puzzle. The phenomenon collides most closely with the philosophical concept of supererogation, which describes acts that are good to do but not wrong to omit, yet it differs because supererogation theory typically focuses on the act itself, whereas the Visibility of Deliberation focuses on the epistemic access others have to the agent's motivation. It also touches on Bernard Williams famous objection to utilitarianism regarding integrity, where he suggested that having to calculate whether to save a loved one over a stranger involves one thought too many. This aligns with your praise-side observation, where the person who helps immediately is valued more than the one who weighs the decision, because spontaneity signals that the moral impulse is intrinsic to their character rather than a burdensome calculation.

  On the blame side, which is perhaps the more painful part of your experience coordinating the rota, the phenomenon is best explained by what the deliberation reveals about the agent rather than what the deliberation itself does. When a volunteer ignores the email, they remain outside the moral conversation; their non-compliance is attributed to circumstance or ignorance. When they open the email and consider the request, they enter a second-personal relationship with you and the community, acknowledging that a claim has been made upon them. By then declining without a defeating reason, such as a conflicting duty to a sick spouse, they signal that they have weighed the community's need against their own convenience and found their convenience heavier. This is resented not because they refused, but because the refusal confirms a lack of intrinsic solidarity. The praise-side and the blame-side are indeed one phenomenon because both rely on the same mechanism: deliberation makes motivation transparent. In the positive case, transparency reveals hesitation where we want to see virtue, reducing credit. In the negative case, transparency reveals calculation where we want to see inability, increasing blame. In both instances, the visibility of the mental process strips away the charitable ambiguity that ignorance provides.

  Regarding the retired paramedic on your rota, the phenomenon does shift slightly because role morality alters the baseline of expectation. While a retired professional is not on duty, the possession of specific skills creates a lingering normative pressure that does not apply to the general volunteers. If a paramedic deliberates and declines a medical emergency, the blame is harsher because their skill set makes the cost of helping lower and the capacity to help higher, so the deliberation signals a sharper betrayal of their professional identity. However, for a standard meal run, the paramedic is in the same position as the rest of you, unless the run involves a medical incident. The Visibility of Deliberation still applies, but the weight of the claim they are acknowledging is heavier due to their background. I am highly confident in this analysis of the social and psychological dynamics you are describing, as it aligns with established work in moral psychology on signaling and the philosophy of moral worth. The point I am least sure about is whether the paramedic's status creates a formal obligation that changes the act from optional to obligatory in the eyes of the group, or if it merely heightens the social cost of the deliberation without changing the deontic status of the act itself. This distinction matters for whether we say they are morally required to help or just socially expected to, and the line between those two expectations is often blurred in small communities. Overall, you are dealing with a real and documented texture of human judgment, even if ethics has not yet coined a single word for it.
