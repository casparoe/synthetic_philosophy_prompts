answer: |-
  The morning mist still clung to the river when Elian walked down to the sluice. The water moved slower now than the songs said it used to, choked by silt and the ribs of the old weirs, but it moved. That was enough.

  Elian carried a leather satchel heavy with chisels and a lump of beeswax. He was thirty, born in the Lower Bend settlement, one of the dozen villages that dotted the valley floor where the Great Capital of Varrak once stood. He was a mechanic of the new time, which meant he was an archaeologist of the old one. To fix the water-lift, he had to understand the geometry of the ancestors.

  The lift itself was a patchwork. The main axle was a polished basalt column, once part of a colonnade in the Upper District, now laid horizontally and grooved to catch the hemp ropes. The counterweights were lead ingots stamped with the profile of the Sun-King, drilled through and tied to baskets. Elian ran a hand over the basalt. The fluting was worn smooth where the rope bit in.

  "Sticking again?" asked a voice from the bank.

  It was Torin, a trader from the highlands. Torin wore a tunic of woven wool, bright and clean, unlike Elian's stained linen. Torin came from a place where the old ways were still whispered about as a golden age, a paradise lost to barbarism.

  "The bearing is dry," Elian said, not looking up. He dipped his wax into the river and rubbed it into the stone. "The silt gets into everything."

  "It's a shame," Torin said, stepping over a pile of broken masonry. He gestured toward the horizon, where the skeletal remains of Varrak's ziggurat pierced the haze. "My grandfather told me the water used to run uphill there. By command. Now we scrape mud to make it turn a wheel."

  "The water never ran uphill," Elian said, testing the axle. It groaned, then turned. "It was siphoned. The pipes are lead. Most were pulled out two hundred years ago to roof the granaries."

  "But the knowledge," Torin insisted. "You can read the marks on the stones. You know how they did it. Why do we live in huts when we could live in stone?"

  Elian wiped his hands on his trousers. He looked at the ziggurat. It wasn't a palace to him; it was a quarry. "Stone is cold. Huts breathe. The wheel turns. The wheat gets ground. What else is there?"

  He left Torin at the river and walked back toward his home. The settlement was not a grid. It was a cluster of organic shapes, houses built of mudbrick and scavenged stone, huddled together for warmth against the river wind. There were no wide avenues, no guard towers, no walls.

  Inside his workshop, the air smelled of yeast and woodsmoke. On the workbench lay a stack of clay tablets he had recovered from a collapse in the administrative district the week before. They were baked hard, fired in the great conflagration that had ended the bureaucracy centuries ago—or so the highland songs claimed. Elian picked one up. The cuneiform was sharp, preserved by the fire that had burned the wooden shelves around them.

  *Inventory of District 4. Barley. Year 14 of the Reign.*

  Elian set it down. He didn't need to know the year of a king who had no name anymore. He needed flat, heat-resistant ceramic.

  He moved to the oven in the corner of the room. It was a dome of clay, reinforced with shards of pottery and stone. The inner lining, the part that held the heat for the bread, was composed entirely of these tablets. Hundreds of them, fitted together like mosaic tiles, their inscriptions facing the fire, their blank backs holding the dough.

  To a stranger, the oven looked like a site of desecration. The tablets were shattered, jumbled, and blackened with soot. The script was obscured by carbon. It looked like the angry work of invaders who had sought to erase the memory of the state, burning the archives in a frenzy of iconoclasm.

  Elian lit the kindling beneath the hearth. The flames licked over the *Inventory of District 4*. He watched the heat shimmer.

  His daughter came in, carrying a basket of grain. "The miller says the weight is light again."

  Elian nodded. He reached into a jar and pulled out a small, hexagonal stone weight. It was carved from lapis lazuli, etched with the symbol of the Royal Standard. It was worth a fortune in the highlands, a relic of power. Here, it was a counterbalance.

  "Tell him to add two handfuls," Elian said.

  "The old weight?"

  "The blue one. It's the right mass."

  She took it. To her, it was just a stone that balanced the scale. To Torin, it would be a stolen jewel. To a digger in a thousand years, finding a Royal Standard weight in a miller's shed, it would be evidence of looting, of a society stripping the corpse of its predecessor. They would not see the continuity. They would see the break.

  Elian kneaded the dough. He thought about the ziggurat. Somewhere up there, in the deep vaults, there were rooms full of tablets that no one had touched. Perfect archives. If he wanted, he could go up there, clear the debris, and read the history of the world before the silence. He could learn the names of the governors, the boundaries of the provinces, the theology of the Sun-King.

  But the vaults were unstable. The air was bad. And knowing the name of a governor wouldn't make the wheat grow taller.

  Torin appeared in the doorway, silhouetted against the afternoon light. He looked at the oven, at the rows of inscribed clay glowing orange in the heat. He frowned, a look of genuine discomfort crossing his face.

  "You cook on them," Torin said. It wasn't a question.

  "They hold heat well," Elian said. "Better than new brick."

  "It's... disrespectful."

  "Is it?" Elian shaped a loaf. "The man who made this tablet is dead. The barley he counted is long eaten. The district he measured is forest. The clay remains. The fire remains. The bread remains."

  He slapped the dough onto the hot surface. It hissed.

  "You could restore it," Torin said softly. "You have the hands. You have the eyes. You could be the first King of the New Varrak."

  Elian watched the bread begin to rise. The scent of baking grain filled the room, masking the smell of the damp river outside. He thought about the bureaucracy. The taxes. The conscription. The walls. He remembered the stories of the end—not a bang, but a whisper. The farmers simply stopped bringing the grain. The scribes stopped writing. The guards went home to their families. The system didn't break; it was unmade, piece by piece, by people who decided they preferred their own lives to the state's design.

  "The wheel turns, Torin," Elian said. "The bread bakes. The child eats."

  "And if the river dries?"

  "Then we move."

  Torin shook his head, turning away. "You live among ghosts and call it peace."

  Elian didn't answer. He took a poker and adjusted the tablets in the fire. One cracked, splitting the record of a tax audit in two. The heat intensified. The bread browned.

  Outside, the wind picked up, whistling through the broken arches of the capital's aqueduct. It sounded like a flute, or perhaps a sigh. Elian pulled the loaves from the oven. They were golden, crusty, and warm. He placed one on the table and broke it open. Steam rose into the dim room, obscuring the inscriptions on the oven wall for a moment before dissipating.

  He ate. The bread was good. The room was warm. The river flowed on, carrying the silt of the old city down to the sea, where it would become new land.
