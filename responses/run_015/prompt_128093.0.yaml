answer: |-
  There is no single, universally codified term in systematic biology that captures this *exact* cyclical phenomenon in its entirety. While the individual components are well-named, the specific loop you describe—genomic splitting followed by biological lumping, driven by the tension between lineage history and reproductive reality—lacks a canonical label like "Gause's Law" or "Dollo's Law."

  However, the phenomenon is widely recognized in systematic literature, particularly in marine invertebrate zoology and phylogeography. It is most frequently discussed under the umbrella of **"Taxonomic Churn"** or **"Genomic Oversplitting,"** but these terms describe the *action* rather than the *structural instability* you are identifying.

  Below is the "carving" you requested: a precise differentiation from related concepts, a definition of the boundary conditions, and a proposed conceptual label.

  ### 1. Differentiation from Related Concepts

  To isolate this phenomenon, we must distinguish it from three adjacent concepts that are often conflated with it.

  | Concept | Definition | How it differs from your pattern |
  | :--- | :--- | :--- |
  | **Taxonomic Inflation** | The artificial increase in species counts, often driven by conservation incentives, prestige, or the adoption of the Phylogenetic Species Concept (PSC) without biological justification. | **Motive vs. Mechanism:** Inflation implies intent or error. Your pattern describes a good-faith interpretative conflict between valid data types (genomics vs. ecology). Inflation rarely involves the subsequent "lumping" phase based on reproductive data. |
  | **Cryptic Species Discovery** | The identification of morphologically similar but reproductively isolated lineages via genetics. | **Validity of Split:** In cryptic speciation, the genetic clusters *do* correspond to Biological Species (reproductive isolation). In your pattern, the genetic clusters *fail* to correspond to Biological Species upon further testing. |
  | **Integrative Taxonomy** | A methodology combining morphology, genetics, and ecology to delimit species. | **Method vs. Outcome:** Integrative taxonomy is the proposed *solution* to prevent the cycle. Your pattern describes the *failure* of integrative approaches when genetic data is weighted heavily before ecological data is available. |

  ### 2. The Carving: Defining the Phenomenon

  If we are to define this pattern precisely, it is not merely "splitting and lumping." It is a specific epistemological lag caused by the differential resolution of evolutionary processes.

  **Proposed Definition:**
  > **Genomic-Lineage Oscillation** (or **Taxonomic Hysteresis**)
  > A cyclical instability in species delimitation where high-resolution genealogical data (revealing deep coalescence and phylogeographic structure) triggers taxonomic splitting under lineage-based concepts, followed by taxonomic lumping when subsequent data reveals the persistence of gene flow, ecological equivalence, and a lack of intrinsic reproductive isolation.

  **The Core Mechanism:**
  The cycle arises from the **decoupling of genealogical exclusivity from reproductive isolation.** In marine invertebrates with large effective population sizes ($N_e$) and high dispersal potential, lineages can remain genetically distinct (due to drift or local selection) for millions of years without evolving barriers to gene flow. When taxonomists apply the *General Lineage Concept* or *Phylogenetic Species Concept* to this structure, they identify "species." When they apply the *Biological Species Concept*, they identify "populations."

  ### 3. Boundary Conditions and Edge Cases

  To distinguish this phenomenon from cases where reproductive isolation *does* track genetic clusters, we must specify the boundary conditions.

  **A. The Role of Environmental Gradients (The "False Positive" Signal)**
  In your pattern, genetic divergence is often aligned with temperature or salinity. This is **Isolation by Environment (IBE)** without **Isolation by Barrier.**
  *   **Boundary Condition:** The divergence is maintained by *selection* on specific loci (local adaptation) or *drift* in large populations, but neutral gene flow remains possible.
  *   **The Edge:** If the environmental gradient eventually leads to assortative mating (e.g., temporal spawning shifts correlated with temperature), the pattern ceases to be an oscillation and becomes **Ecological Speciation**. The phenomenon exists only in the "Gray Zone" where adaptation has not yet generated reproductive barriers.

  **B. The Coalescence vs. Flow Threshold**
  *   **Boundary Condition:** Deep mitochondrial or nuclear divergence exists (e.g., >2-5% COI divergence), suggesting long-term independence.
  *   **The Edge:** If genomic analysis reveals *zero* recent migration ($m = 0$), the split is valid. The phenomenon is defined by the discovery that $m > 0$ despite deep divergence. This is common in marine taxa where "sweepstakes reproduction" creates genetic drift that mimics speciation.

  **C. Functional Identity**
  *   **Boundary Condition:** The putative species occupy identical niches and show no pre- or post-zygotic isolation in lab crosses.
  *   **The Edge:** If hybrid offspring show reduced fitness (even if hybrids are produced), the lineages are evolving independence. The phenomenon requires that the hybrids are **fully viable and fertile**, rendering the genetic clusters biologically ephemeral.

  ### 4. Proposed Terminology

  Since no single term exists, I propose using **Taxonomic Hysteresis** to describe the *instability*, and **Genomic-Lineage Oscillation** to describe the *cycle*.

  **Why "Taxonomic Hysteresis"?**
  In physics, hysteresis is the dependence of the state of a system on its history. In this context:
  1.  **State:** The number of recognized species.
  2.  **History:** The resolution of the technology used to observe them.
  3.  **The Lag:** The taxonomic count does not return to its original baseline immediately after new data arrives; it lags behind the biological reality. The "species count" depends on whether you measured it *before* or *after* the ecological validation. This captures the *path dependence* of the revision process.

  **Why "Genomic-Lineage Oscillation"?**
  This captures the specific theoretical conflict. It is not a conflict between "lumpers and splitters" (personnel), but between **Lineage History** (which says "we are distinct") and **Biological Cohesion** (which says "we are one"). The taxonomy oscillates as the weight of evidence shifts between these two poles.

  ### 5. Summary of the "Carving"

  *   **What it is:** A methodological artifact arising when phylogeographic structure is misinterpreted as speciation in taxa with high gene flow potential.
  *   **What it is not:** The discovery of true cryptic species (where RI exists), nor malicious taxonomic inflation.
  *   **The Boundary:** The presence of deep coalescence *without* reproductive isolation or ecological divergence.
  *   **The Driver:** The differential timing of data acquisition (genomics arrives before experimental crossing/ecology).
  *   **The Label:** **Taxonomic Hysteresis** (for the instability) driven by **Species Concept Discordance**.

  This phenomenon is arguably the defining systematic challenge of the genomic era for marine invertebrates. It highlights that **genealogical divergence is a necessary but not sufficient condition for speciation**, a nuance that high-throughput sequencing often obscures until ecological validation catches up.
