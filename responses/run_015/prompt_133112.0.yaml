  The spine that never moved, the iron **keel**,
  Held fast through nineteen winters stripping **oak**.
  Painted fresh each spring, keeping the same old **name**,
  Waiting for wind enough to fill and **sail**.
  She holds the water in her hollow **shape**,
  But in the barn stands waiting there a **ghost**.

  My daughter points and says she sees a **ghost**.
  I trust the bone, the backbone of the **keel**.
  Though every plank has lost its original **shape**,
  New timber scarfed into ancient **oak**.
  We rig them both to catch the summer **sail**,
  The papers say one holds the legal **name**.

  Does spirit live inside that painted **name**?
  Or in the pile of timber turned to **ghost**?
  The one I steer, the one I see **sail**,
  Is rooted deep below the iron **keel**.
  Grain upon grain of weathered gray **oak**,
  Rebuilt to match the memory of a **shape**.

  It matters how the years defined the **shape**,
  Not just the letters on the transom **name**.
  Matter is mutable, even the **oak**,
  Haunts me more than any barnyard **ghost**.
  If I removed the spine, the heavy **keel**,
  Would she still know how to rise and **sail**?

  When heeling hard, she's eager to **sail**,
  She feels correct within her wooden **shape**.
  No vibration runs up through the **keel**,
  She answers when I call her by her **name**.
  The other hull is silent as a **ghost**,
  Though built from all those years of saved **oak**.

  Sunlight hits the varnished rings of **oak**,
  We walk aboard to hoist the main **sail**,
  Leaving the twin hull of the quiet **ghost**.
  Water accepts the hull's familiar **shape**,
  No document can fully fix a **name**,
  Truth sits heavier than the leaded **keel**.

  Time rots the **oak** but water keeps the **shape**,
  She fills to **sail**, she answers to her **name**,
  I lay the **ghost** down, follow home the **keel**.
