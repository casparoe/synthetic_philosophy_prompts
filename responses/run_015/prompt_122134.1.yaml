  Elena shifted to the question of inheritance, asking whether capping dynastic transmission violates familial continuity, since parents naturally wish to secure advantages for their children as an expression of love and responsibility. Marcus conceded that family integrity is vital but insisted that unlimited accumulation allows the wealthy to purchase political influence and social closure, effectively turning private affection into public domination. Elena argued that the American view accepts some risk of oligarchy to preserve the liberty of families to transmit culture and capital, whereas the European attitude risks flattening motivation and treating children as mere vessels of state policy. Marcus responded that the American view secretly socializes risk while privatizing reward, because when high-risk inequality leads to systemic crash or widespread destitution, the public bears the cost of bailouts and safety nets while the winners keep their compounded gains. Elena countered that safety nets are precisely the mechanism that makes the risk tolerable, allowing for failure without ruin, but Marcus noted that in practice the safety net is often stigmatized and underfunded precisely because the ideology of prospective equality blames the individual for not climbing.

  They circled back to the core tension, with Elena maintaining that without the promise of disproportionate reward, talent will not exert itself to the benefit of all, and Marcus maintaining that without the reality of approximate equality, talent will exert itself only to dominate others rather than serve the common good. Elena worried that synchronic dignity creates a ceiling on aspiration, while Marcus worried that prospective equality creates a floor of misery that is morally invisible as long as the exit door remains unlocked. They agreed that both pure mobility and pure equality are illusions, but disagreed on which illusion is more dangerous to liberty. Elena held that rigidity is the enemy, while Marcus held that hierarchy is the enemy. The conversation ended without resolution, highlighting the difficulty of balancing the temporal hope of movement against the spatial reality of status. I am moderately confident in the arguments presented regarding the tension between familial autonomy and democratic equality, as this reflects a well-established debate in normative theory regarding the family and justice. However, I am least certain about the claim that the American view secretly socializes risk while privatizing reward, because this empirical assertion depends heavily on specific institutional configurations rather than the normative principle of prospective equality itself, and it is possible to imagine a high-mobility society with robust social insurance that does not socialize losses in the way described by the advocate of synchronic dignity.
