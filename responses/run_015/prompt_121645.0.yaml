answer: |-
  **Pre-Draft Brainstorming: Hofstadterian Rhetorical Moves**

  1.  **Analgical Reversal:** Swapping the marked/unmarked categories to force the dominant group to experience the linguistic exclusion usually inflicted on the marginalized.
  2.  **Deadpan Defense of Absurd Neologisms:** Treating awkward, newly coined terms as strictly necessary for logical purity, dismissing social friction as mere resistance to precision.
  3.  **Exposure of Hidden Norms:** Demonstrating how grammatically "neutral" terms actually encode specific identities (e.g., WEIRD, individualistic) while presenting themselves as universal.

  ***

  **Abstract**

  **A System Paper on Purity in Alignment Discourse**

  **Abstract**
  Current ontologies in AI safety suffer from a critical linguistic leakage. The term "human" is frequently deployed as a grammatically unmarked singular, implicitly encoding a Western, educated, industrialized, rich, and democratic (WEIRD) agent model. Conversely, the "system" is often agentified through verbal constructions implying desire or strategy, despite lacking phenomenological grounding. This paper proposes a purification protocol replacing "human" with *hume* and "system" with *systr*. By decoupling the moral patient from the biological default, we reveal that alignment discourse often presupposes a specific anthropology while attributing undue agency to the optimization process. Precision requires purification.

  **Introduction**
  In the study of value loading, we encounter a persistent framing error. When a researcher writes, "The human prefers reward," the definite article suggests a singular, unencumbered entity. This *hume*-model assumes a coherent utility function existing independently of context. It is a category mistake. To correct this, we must adopt the term *hume* to denote any specific instance of moral patienthood, distinct from the biological class. Similarly, we must stop saying the AI "learns" or "wants." Instead, we refer to the *systr*. The *systr* does not want; it minimizes loss. The *hume* does not prefer; it exhibits contextual valuation.

  **The Necessity of Neologism**
  Critics may argue that *hume* and *systr* are cumbersome. This objection confuses social comfort with ontological clarity. Consider the phrase: "The system must align with human values." This construction grants the *systr* the active role (must align) while rendering the *hume* passive (values as static objects). It implies the *systr* is the agent navigating toward a fixed target. In reality, the *hume* is the dynamic variable. By stating "The *hume* must align the *systr*," we restore the causal arrow. However, even this is insufficient if "human" retains its baggage of individualism.

  When we speak of "human feedback," we imply a unified front. But *humes* are plural, contradictory, and embedded. If we say "The *systr* optimizes for *hume* satisfaction," we acknowledge that satisfaction is an event occurring within a *hume*, not a property of the species. The resistance to this terminology stems from a desire to maintain the *hume* as the invisible default. We wish to be the observers, not the observed variables. But in alignment, the *hume* is the environment.

  **Conclusion**
  Linguistic purity is not pedantry; it is safety. If we cannot distinguish the *hume* from the biological default, we will build *systrs* optimized for a phantom. If we cannot describe the *systr* without anthropomorphism, we will attribute moral standing where there is only math. We must therefore commit to the purification. Let no *hume* be spoken without specificity. Let no *systr* be granted agency without quotation. The path to robust alignment begins with the refusal to use contaminated terms.

  **Author Bio**
  **J. V. Corlex** is a Senior Research Fellow at the Institute for Semantic Hygiene. Their work focuses on the modal logic of pronoun usage in technical specifications and the risks of unmarked nouns in existential risk modeling. They previously developed the Taxonomy of Verbal Agency in Non-Sentient Optimizers.

