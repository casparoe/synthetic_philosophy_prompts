      *Better:* "You argue accountability suppresses revision. But without accountability, isn't it just tyranny of the moment? Are you normatively criticizing accountability?"
      *Best:* "Can you name a single instance where a strategic reversal was necessary, proposed, and the proposer was *not* punished?" If I can't, it's unfalsifiable. If I can, my thesis weakens. Let's go with the specific counter-example request.

