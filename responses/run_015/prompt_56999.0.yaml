      *(Self-Correction on Objection 2)*: The Institutionalists will pounce on whether Nicias was actually subject to *eisangelia* for strategic decisions vs. *graphe paranomon* for decrees.
      *(Self-Correction on Socrates)*: The prompt uses Socrates as a case of "cheaper alternative available." I need to defend why a trial fits a paper on assembly reversibility.

  9.  **Final Polish:** Check the constraints. 7-8 objections. Ordered by damage. Phrased authentically. 2-min replies. Soft spots noted. Opening concessions. Must-land reply. Dreaded question.

      *Let's flesh out the specific phrasing for the audience types.*
      *   Thucydides Literary: "Thucydides puts words in mouths."
      *   Institutional: "You're conflating *eisangelia* and *graphe paranomon*."
      *   Pol Theory: "Is accountability supposed to be efficient?"

      *Let's finalize the "Must Land" reply.* It needs to bridge the gap between "literary speech" and "structural reality." Even if Thucydides wrote the speech, he wrote it because it was *plausible* to the audience. The structure created the mindset.

      *Let's finalize the "Dreaded Question".* It should be about a case where the theory fails completely. The Arginusae trial is the obvious one (generals executed, but the *demos* reversed itself later and punished the proposers of the execution). Wait, that supports the thesis (proposers paid). What about a case where a proposer *didn't* pay? The repeal of the Mutilation of the Herms decrees? No. How about the 4th century? The thesis might be 5th century specific. Let's make the dreaded question about the *demos* absorbing cost.

