answer: |-
  Distinguished colleagues, guests, and partners in this inquiry: welcome.

  It is a privilege to convene this workshop. We are gathered here to examine a subject that is often treated with considerable heat and very little light: the intersection of inheritance, dynastic wealth, and the structural conditions required for equal opportunity.

  The composition of this room is deliberate, and it is, I believe, our greatest asset. Half of you are scholars who have spent careers modeling intergenerational mobility and refining the principles of distributive justice. The other half of you represent family foundations that have long been stewards of significant capital, capital which has, in no small part, made institutions like this one possible.

  I want to begin by offering a sincere acknowledgment to our foundation partners. We are meeting in a space of inquiry that your endowments help sustain. There is a reflexive irony in this, one I hope we can hold comfortably rather than evade. The very structures of wealth transmission we intend to scrutinize are part of the ecosystem that allows us to gather and scrutinize them. Your presence here signals a commitment not merely to philanthropy, but to the examination of the mechanisms that make philanthropy possible. That willingness to subject the architecture of your own influence to rational scrutiny is, in itself, a contribution to the public good we aim to define. Thank you for that openness.

  My goal in these opening remarks is not to preview conclusions, but to propose a conceptual architecture for the next two days. If we are to make progress, we must agree on what, precisely, we are measuring.

  The public debate regarding inheritance taxation is almost exclusively framed around the concept of *purchasing power*. In this standard model, an inheritance is viewed as a lump-sum transfer of resources from one private agent to another. The policy question then becomes a trade-off: do we prioritize the liberty of the testator to dispose of their property, or do we prioritize the state's need for revenue and a vague notion of equality of outcome? This framing inevitably leads to a stalemate. It reduces the discussion to a conflict between property rights and redistribution, where the latter is easily caricatured as policy born of envy rather than design.

  I propose that for the duration of this workshop, we set that framing aside. It is descriptively inadequate.

  To understand the true stakes of dynastic wealth, we must distinguish between inheritance as a *transfer of resources* and inheritance as a *mechanism of positional lock-in*.

  When we speak of inheritance merely as a transfer of resources, we are speaking of liquidity. We are speaking of the ability to consume, to invest, or to save. This is the domain of standard economic modeling. It assumes that wealth is fuel. If I give my child a million dollars, they have more fuel than they did before. If the state taxes half of it, they have less fuel. The debate is about how much fuel they should be allowed to keep.

  But this ignores the second, and more potent, function of dynastic wealth: the reservation of option-space.

  Wealth, at a certain scale and duration, ceases to function simply as fuel. It begins to function as a gatekeeper. It operates as a mechanism of positional lock-in. By this, I mean the capacity of established capital to reserve social, educational, and political opportunities across generations in a way that markets do not price and individual merit cannot easily overcome.

  Consider the difference. A transfer of purchasing power allows a recipient to buy a better education. A mechanism of positional lock-in allows a recipient to access a network of influence that determines who gets hired, who gets funded, and whose research is taken seriously, regardless of the quality of the education purchased. The former is about having more money; the latter is about facing less friction.

  When wealth becomes dynastic, it creates a form of intergenerational friction for everyone outside that dynasty. It creates a gravity well that distorts the meritocratic landscape. It allows families to convert financial capital into social capital, and social capital into institutional authority, which is then used to protect the financial capital. This is not a market transaction. It is a closure of the market.

  This distinction is vital because it changes how we must morally and economically categorize inheritance taxation.

  If inheritance is simply private property being transferred, then taxation looks like a violation of rights. It looks like the state taking what belongs to a family to give to strangers. This is the frame that puts our foundation partners in the position of defendants, and it is a frame I wish to explicitly reject for this workshop.

  However, if inheritance functions as a mechanism of positional lock-in, then the accumulation of untaxed dynastic wealth generates what economists call a negative externality.

  Think of it in terms of pollution. When a factory produces goods but dumps waste into a river, the factory owner captures the profit, but the community downstream bears the cost of the degraded water. The market price of the goods does not reflect the cost of the damage. We do not tax carbon emissions because we envy the energy company; we tax them to internalize a cost that the market otherwise ignores.

  I suggest we view dynastic wealth through a similar lens. When a family accumulates capital across multiple generations without significant friction, they are not just enriching themselves. They are actively narrowing the option-space of their contemporaries. They are increasing the friction for social mobility for those outside the dynasty. This restriction of opportunity is a cost borne by society, not by the wealth holder.

  Therefore, inheritance taxation should not be conceptualized as redistribution born of envy. It should be conceptualized as a Pigouvian correction. It is a levy on the intergenerational externality of opportunity hoarding. It is the price paid for the privilege of maintaining a position that otherwise restricts the competitive field.

  This reframing is essential for the work we must do here. It allows us to discuss tax policy not as an assault on private property, but as a maintenance cost for a functioning meritocracy. It acknowledges that while the creation of wealth may be a private virtue, the persistence of wealth across generations creates public structural conditions that require management.

  Now, I am aware that introducing the concept of "lock-in" and "externalities" in a room funded by dynastic capital carries risks. It risks sounding like an accusation. It risks implying that the benefits you have conferred upon this university are somehow tainted by the mechanism that funded them.

  That is not my intent, and I hope it is not how it is received.

  The existence of a mechanism is not a moral judgment on the individuals navigating it. One can benefit from a structure of positional advantage without being morally culpable for the structure's existence. Indeed, one can use the resources generated by that structure to fund the very inquiry that seeks to understand it. That is, in a sense, what we are doing this weekend.

  The question for this workshop is not whether dynastic wealth is "evil." That is a theological question, not a policy one. The question is whether the current mechanisms of transmission allow for the reservation of option-space to such a degree that it degrades the legitimacy of our social institutions. And if it does, what are the precise levers—tax thresholds, trust regulations, endowment rules—that can restore friction without destroying the incentive to create?

  We need the economists in the room to model the friction. We need the philosophers to define the threshold of legitimacy. And we need the foundation representatives to stress-test these ideas against the reality of stewardship. We need to know: if we treat inheritance as an externality, how does that change the planning of a legacy? Does it destroy the incentive to build, or does it merely shift the focus from preservation to creation?

  I ask the scholars here to practice rigor without aggression. Conceptual clarity does not require moral condemnation. We can identify a structural distortion without impugning the character of those who benefit from it.

  I ask our foundation partners to practice candor without defensiveness. You are not here to justify your existence. You are here to help us understand the mechanics of longevity. If the thesis of positional lock-in is true, you are the experts on how that lock-in feels from the inside, and how it might be loosened without collapsing the institutions you support.

  We are not here to draft legislation. We are here to refine the vocabulary we use to discuss these constraints. If we leave this workshop with a shared understanding that inheritance tax is not about taking money, but about pricing an externality; if we can agree that the problem is not wealth itself, but the unpriced reservation of opportunity; then we will have achieved something rare.

  We will have moved the discussion from a conflict of interests to a collaboration on design.

  The stakes are high. A society that cannot distinguish between the freedom to use resources and the power to close doors will eventually lose the ability to sustain either. We have the opportunity, over the next two days, to draw that distinction with the precision it demands.

  Thank you for your attention, and thank you for your participation. Let us begin.
