      *   *The Standard Framing:* Economists usually talk about capital accumulation, marginal tax rates, efficiency vs. equity. Philosophers talk about desert and entitlement.
          *   *Drafting thought:* Keep it brief. This is the "straw man" but treated respectfully. It's the "purchasing power" model.

      *   *The Core Distinction (The Meat):* This needs to be the highlight.
          *   *Concept 1:* Money as fuel. (Inter vivos transfer).
          *   *Concept 2:* Money as a gatekeeper. (Positional lock-in).
          *   *Elaboration:* It's not just buying a yacht; it's buying access to the network that decides who gets the yacht later. It's about "option-space."
          *   *Tone check:* Ensure this doesn't sound like an attack on the specific people in the room. Use passive voice or abstract nouns where necessary ("wealth functions as," "structures operate").

      *   *Reframing Taxation:* How to talk about tax without sounding like a redistributor?
          *   *Keyword:* Externality. Like carbon emissions. If my wealth accumulation restricts your opportunity set, that's a cost I haven't paid for. Tax is the price of that externality.
          *   *Benefit:* This removes "envy" from the equation. It's about market failure, not moral judgment on character.

      *   *Addressing the Foundations:* This is the tricky part. I need to thank them without saying "your money is clean."
