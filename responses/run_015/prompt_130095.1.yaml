          *   No bibliography/citations.

  2.  **Determine the Structure:**
      *   **Welcome & Acknowledgment:** Welcome everyone, specifically acknowledging the unique composition of the room. Thank the foundations genuinely for their support (crucial for rapport).
      *   **The Problem with the Standard Debate:** Briefly outline the usual framing (purchasing power/tax rates) and why it's insufficient.
      *   **The Core Distinction:** Introduce the two concepts: *Transfer of Resources* vs. *Mechanism of Positional Lock-in*. Explain this clearly.
      *   **Reframing the Policy Question:** Move from "confiscation" to "correcting an externality." This addresses the moral constraint.
      *   **The Role of the Workshop:** Define the goal of the next few days (collaborative inquiry, not adversarial debate).
