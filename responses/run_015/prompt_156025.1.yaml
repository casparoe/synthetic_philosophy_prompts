answer: |-
  **The Calculus of Calamity: On the Ethics of Ranking Historical Evils**

  The historian and the ethicist who turn their gaze toward the abyss of human history are frequently met with a profound unease. In the presence of systematic mass killings, state-engineered famines, and colonial extermination campaigns, there arises a temptation to measure, to order, and to classify. Yet, this impulse is immediately checked by a moral hesitation: does the act of ranking atrocities constitute a necessary rigour of understanding, or does it enact a secondary violence upon the victims? To compare suffering is to risk establishing a 'market in suffering', wherein human agony is commodified, traded, and hierarchically sorted. However, to refuse comparison is to risk moral blindness, leaving us unable to distinguish between tragedy and atrocity, or to prioritise the prevention of future harms. This essay argues that while cardinal aggregation—the assignment of quantitative metrics to suffering—is indeed morally obscene, ordinal comparison within a multi-dimensional framework is not only conceptually viable but ethically obligatory. We must discriminate between evils to honour them, provided we refuse to collapse their complexity into a single scalar value.

  The charge that ranking historical evils is inherently obscene rests upon a robust phenomenological claim: that suffering is singular and therefore incommensurable. To assign a number to a life lost, or to weigh one genocide against another, is to treat the victim as a unit of account rather than a subject of experience. Critics, drawing upon the Levinasian tradition, argue that the 'face of the Other' demands an infinite responsibility that cannot be subjected to arithmetic. When we engage in cardinal comparison—asserting, for instance, that Atrocity A resulted in 1.5 times more suffering than Atrocity B—we implicitly suggest that the difference is one of degree rather than kind. This creates a utilitarian calculus where victims become variables in an equation of historical significance. Such an approach risks instrumentalising the dead, utilising their memory to bolster national narratives or to compete for the status of 'ultimate victimhood'. In this light, any hierarchy appears as a form of moral bookkeeping, violating the dignity of remembrance by suggesting that some grief is weightier than others in a manner that can be precisely tallied.

  Furthermore, the epistemic arrogance of cardinal ranking cannot be overstated. Historical data regarding mortality, intent, and long-term trauma is invariably fragmentary. To construct a precise metric from such shadows is to manufacture a false precision. It implies that the qualitative horror of a death camp can be mathematically equated with the structural violence of a colonial famine, reduced to a common denominator of 'utility lost'. This reductionism flattens the specific moral contours of each event. If we treat all evils as commensurable on a single scale, we obscure the distinct mechanisms of perpetration. The bureaucratic coldness of the Holocaust differs phenomenologically from the chaotic brutality of a pogrom, even if the death tolls were identical. A cardinal approach erases these distinctions, rendering the specific nature of the evil unintelligible in favour of a gross aggregate score.

  However, the rejection of all comparison leads to a paralysis that is itself morally untenable. If we cannot say that one historical evil is worse than another, we lose the vocabulary necessary for justice, law, and prevention. A world without ordinal distinction is a world where the distinction between a natural disaster and a state-engineered famine collapses, for both result in death. Yet, our moral intuition rightly demands that we treat the latter as a greater evil due to the presence of agency and intent. To refuse to rank is to refuse to judge, and in the realm of ethics, the refusal to judge is often a complicity with the perpetrator. We require comparison to allocate commemorative resources, to structure legal accountability (as seen in the distinction between war crimes and crimes against humanity), and to identify causal patterns that might prevent recurrence. If we cannot identify that a system of chattel slavery constitutes a different order of moral injury than a transient period of civil unrest, we cannot construct the political safeguards necessary to prevent the former. Thus, the complete abandonment of hierarchy is not a mark of respect, but of negligence.

  The resolution to this tension lies in a rigorous distinction between ordinal and cardinal comparison, coupled with the adoption of a multi-dimensional framework. Ordinal comparison establishes that Event A is more severe than Event B in a specific respect, without specifying by how much. It is a qualitative ordering, not a quantitative measurement. This is permissible because it acknowledges magnitude without claiming precision. More critically, we must reject the notion of a single hierarchy in favour of a multi-axis evaluation. Evils should not be collapsed into one score but evaluated along incommensurable axes: scale of loss, intentionality of harm, institutional design, and long-term structural damage.

  Consider two hypothetical atrocities. Event A may have a higher death toll (Scale), but Event B may involve a more sophisticated bureaucratic machinery designed specifically to erase a culture (Institutional Design). A single hierarchy forces us to declare a 'winner' in suffering. A multi-dimensional framework allows us to say that A is greater in terms of immediate mortality, whilst B is greater in terms of premeditated cultural annihilation. This approach escapes the charge of creating a 'market in suffering' because it refuses to facilitate trade-offs. One cannot offset the moral weight of intentional cultural erasure with a lower body count. By maintaining the incommensurability of these axes, we preserve the unique horror of each event. We acknowledge that different evils wound the human spirit in different ways, and that these wounds cannot be sutured together into a single metric.

  This ordinal, multi-dimensional approach is not merely permissible; it is obligatory. It is a duty of moral clarity. To treat all evils as equal is to dilute the specific danger of the most pernicious among them. If we do not identify that a state-engineered famine is ordinally 'worse' than a famine caused by drought—due to the malicious intent involved—we fail to recognise the specific political threat posed by the former. Comparison, when done rigorously, serves the living more than the dead. Its purpose is not to tally the past for the sake of ranking, but to calibrate our moral instruments for the future. We compare to learn which structures of power are most lethal, which ideologies are most corrosive, and which forms of violence are most resistant to remedy. To deny ourselves this analytical tool is to disarm ourselves in the face of potential future barbarism.

  However, this obligation comes with strict ethical guardrails. The comparison must always be directed at the structures of perpetration and the nature of the harm, never at the worth of the victims. We compare the crimes, not the suffering of the individuals. The pain of a single victim is infinite and incomparable; the crime committed against them is part of a historical pattern that can be classified. Furthermore, the ordinal ranking must remain provisional and context-dependent. To say one atrocity was 'worse' than another is always to say 'worse in this specific dimension, for the purpose of this specific inquiry'. It is a heuristic tool, not an ontological truth.

  In conclusion, the anxiety surrounding the ranking of historical evils is well-founded, but it must not lead to a paralysis of judgement. Cardinal aggregation, which seeks to assign a quantitative value to human suffering, is indeed morally obscene. It reduces the sacredness of life to a statistic and invites a competitive victimhood that dishonours the dead. However, ordinal comparison, conducted within a multi-dimensional framework that respects incommensurability, is an ethical imperative. We must be willing to say that some acts are worse than others, not to diminish the suffering of the lesser, but to fully confront the gravity of the greater. To refuse to distinguish between degrees of evil is to lose the capacity to recognise evil at all. Therefore, we are bound to compare, provided we do so with the humility of the ordinal and the nuance of the multi-axial, ensuring that our hierarchies serve justice rather than arithmetic.
