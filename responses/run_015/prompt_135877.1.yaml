  10. **Final Polish:** Check against the user's specific terminology ("surplus fragility," "option-monotone"). Ensure I use them correctly. (The user defined option-monotone well).

  *(Self-Correction on Defeater 2)*: The user asks if surplus fragility defeats (3). Yes, because (3) says "spend search budget on lines consistent with a first-player win." If winning lines are 0.001% of openings, spending budget there is *wrong*. You should spend budget on finding the *needle*, or admit you can't find it and move second to let them blunder. Actually, if P1 has a win, P2 *cannot* force a win. But if P1 picks the wrong move, P2 *can*. So P1 needs to find the needle. If the needle is too small, P1 is disadvantaged *operationally*. This defeats the *heuristic* value of (3).

  *(Self-Correction on Defeater 5)*: Is it vacuous? Monotonicity is structural. In Hex, adding a stone never hurts. In Chess, adding a piece never hurts (mostly). In Negotiation, making an offer *can* hurt (anchors you). So it's not vacuous, but hard to verify.

