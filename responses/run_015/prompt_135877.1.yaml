      *   *Re-evaluating Ranking:* Defeater 2 is the most damaging to the *user's goal* (using it as a heuristic). Defeater 3 is most damaging to the *scope*. Defeater 1 is a non-issue if definitions are held.
      *   *Ordering:* 2 (Fatal to 3), 3 (Fatal to Scope), 5 (Epistemic rot), 1 (Boundary), 4 (Edge case).

  9.  **Writing the Response:** (Self-Correction during drafting)
      *   Make sure to explicitly answer "Which claim carries the most risk?"
