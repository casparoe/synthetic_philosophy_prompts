answer: |-
  Here are the desiderata for a bounded norm of disagreement, formulated as a functional requirement for an agent $A$ updating credence $C_A(P)$ given information $I_B$ about agent $B$'s credence.

  ### The Desiderata

  **1. Tractability (Computational Feasibility)**
  *   **Demand:** The update function must be computable in polynomial time relative to the complexity of the proposition and the history of interaction. It cannot require infinite recursion or solving for global fixed points over unbounded state spaces.
  *   **Rationale:** You asked for a software agent, not a Platonic ideal. If the norm requires simulating $B$ simulating $A$ simulating $B$ ad infinitum to find an equilibrium, it hangs the processor.
  *   **Status:** **Non-Negotiable.**

  **2. The Expert Case (Asymmetric Reliability)**
  *   **Demand:** The rule must accept a reliability parameter $R \in [0,1]$ representing $A$'s estimate of $B$'s competence/calibration relative to $A$. Crucially, the rule must include a *symmetry constraint*: $A$ cannot assign $R > 0.5$ by default. There must be an external anchor (e.g., past calibration scores, access to evidence) that determines $R$.
  *   **Rationale:** Real disagreement is rarely between epistemic peers. A norm that treats a drunk stranger the same as a domain expert is useless. However, without the symmetry constraint, the rule degenerates into "I am always the expert," which is just steadfastness in disguise.
  *   **Status:** **Non-Negotiable.**

  **3. Exploitability (Dutch Book Resistance)**
  *   **Demand:** Two agents following this norm, holding different credences, should not be able to be induced by a third party to accept a combination of bets that guarantees a loss for both, solely due to the mechanics of their disagreement update.
  *   **Rationale:** If a norm allows you to be money-pumped, it violates the basic pragmatic definition of rationality. It ensures the update rule preserves probabilistic coherence constraints (or approximates them closely enough).
  *   **Status:** **Non-Negotiable.**

  **4. The Coarse Case (Qualitative Input)**
  *   **Demand:** The function must accept $I_B$ not just as a precise probability $p$, but as a set (e.g., "$C_B(P) > 0.5$") or a binary signal ("$B$ bets against $P$").
  *   **Rationale:** In the wild, you rarely get exact numbers. You get "my friend thinks I'm wrong." A norm that crashes on non-numeric input is too fragile for deployment.
  *   **Status:** **Negotiable.** (Can be handled by imputing a distribution over the coarse signal, but adds computational cost).

  **5. Order-Independence (Commutativity)**
  *   **Demand:** Updating on $B$'s view then $C$'s view should yield the same posterior as $C$ then $B$, holding reliability constants fixed.
  *   **Rationale:** Prevents manipulation via the order of presentation. If the order matters, the norm introduces noise dependent on conversation flow rather than evidence.
  *   **Status:** **Negotiable.** (Order *might* matter if learning $B$'s view updates your estimate of $C$'s reliability, but the core update rule should ideally be commutative).

  **6. Self-Consistency (Fixed-Point Stability)**
  *   **Demand:** If $A$ and $B$ both run this rule and exchange outputs iteratively, the sequence of credences should converge quickly (within $k$ steps) to a stable pair $(C^*_A, C^*_B)$ where further exchange produces no change.
  *   **Rationale:** Prevents infinite oscillation. If you announce a credence, and hearing your announcement makes me change mine, which makes you change yours again, we never settle.
  *   **Status:** **Negotiable.** (Strict convergence is hard for bounded agents; "damping" oscillations is sufficient).

  **7. The Ideal Limit (Aumann Compliance)**
  *   **Demand:** In the limit where agents share a prior, have common knowledge of each other's posteriors, and have infinite compute, the rule should produce agreement ($C^*_A = C^*_B$).
  *   **Rationale:** Theoretical elegance. Ensures the norm isn't fundamentally at odds with probability theory.
  *   **Status:** **Negotiable.** (This is the wrong test for bounded agents. Satisfying this often breaks Tractability).

  ---

  ### Joint Unsatisfiability

  **The Tractability / Ideal Limit / Self-Consistency Triangle**
  You cannot have all three.
  *   **Aumann's Ideal Limit** requires common knowledge of posteriors. Establishing common knowledge iteratively is computationally unbounded for finite agents.
  *   **Self-Consistency** requires solving for the equilibrium of a game where both agents are updating on each other. For general functions, finding this fixed point is computationally expensive (often NP-hard or undecidable depending on the function space).
  *   **Tractability** demands you skip the recursion.
  *   **Resolution:** You must sacrifice the **Ideal Limit**. A bounded agent cannot verify the conditions for Aumann agreement, so requiring the *output* to match Aumann's *input* conditions is category error. You must also relax **Self-Consistency** to "rapid damping" rather than "exact fixed point."

  ### The Killer Constraint

  **The Expert Case (with the Anti-Bias Clause)**

  This requirement knocks out the most candidate rules.
  *   **Conciliationism (Split the Difference):** Fails immediately. It assumes symmetry ($R=0.5$) by definition. It cannot handle the case where $B$ is drunk or biased without ad-hoc modification.
  *   **Linear/Log-Odds Averaging:** Fails. Standard pooling assumes exchangeable agents. It has no input slot for "I think you are systematically biased."
  *   **Steadfastness:** Fails. It effectively sets $R=0$ always, violating the requirement to update on positive evidence of expertise.
  *   **Aumann Updating:** Fails. It assumes common priors and symmetric rationality, making the concept of "asymmetric expertise" incoherent within its own framework.

  To satisfy the Expert Case, you need a meta-epistemic layer (a probability distribution over reliability) that almost no standard disagreement norm possesses. This forces you to build a custom weighting function rather than adopting an off-the-shelf epistemic rule.
