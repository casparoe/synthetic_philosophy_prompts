  The structural turn occurs in the final quatrain, specifically at line 16 ("The cost alone makes clear the signal's aim"), which pivots from describing the risk to explaining the function of that risk. The villanelle's cyclical form, with its compulsive return to the two refrains, mirrors the logic of the handicap principle: the signal is not a one-time payment but a sustained commitment that must be repeatedly affirmed to remain credible. By forcing the skeptic's accusation (Refrain 1) and the signaler's claim of quality (Refrain 2) to converge in the closing couplet, the poem enacts the paradox where the admitted "waste" becomes the sole guarantee of honesty, resolving the tension not by denying the cost, but by confirming its necessity.
