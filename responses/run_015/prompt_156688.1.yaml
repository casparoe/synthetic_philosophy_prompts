      *   **Difficulty 3 ("Must"):** Is "must affect his sight" asserting a necessary connection (which Locke denies elsewhere) or just regularity ("will")? Is the claim trivial (first moment) or strong (no innate connection)?
      *   **Difficulty 4 (Protuberant Angle):** Locke says the angle "shall appear to his eye as it does in the cube." Isn't this begging the question (assuming he knows how it appears)?
