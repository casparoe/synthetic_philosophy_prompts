  3.  **Drafting - Section by Section:**

      *   **Opening:** The passage argues that visual perception of shape is not innate but learned through associative judgment, relying on the disconnect between tactile and visual ideas to prove that unity of objecthood is constructed rather than given.
      *   **Difficulty 1 (Distinguish/Tell):** The wording "distinguish and tell" favors deferred naming. "Distinguish" could mean bare discrimination, but "tell which is the globe, which is the cube" requires applying the tactile names to the visual data. Molyneux's reason (lack of experience linking touch to sight) rules out naming and matching because both require cross-modal translation. It does not strictly rule out bare discrimination (seeing two different things), but the prompt asks for identification, so the text demands naming. The text cannot bear a reading where mere discrimination counts as success, because the goal is to identify the previously tactile-known objects.
      *   **Difficulty 2 (Qualifiers):** Locke's qualifiers refine rather than weaken the claim. "At first sight" addresses the learning curve; "with certainty" excludes lucky guessing; "whilst he only saw them" enforces the visual-only constraint. "With certainty" does not leave room for unconfident success; it means the visual idea itself does not warrant the judgment. The passage answers whether tactile ideas *suffice* for immediate visual recognition, not just what happens in the first instant, though the instant is the test case for sufficiency. The difference matters because if it were only about the instant, learning could be instantaneous; Locke implies a process of judgment is needed.
      *   **Difficulty 3 ("Must"):** The word "must" here indicates a learned expectation rather than a logical necessity. Locke denies perceivable necessary connections between ideas of different senses. The commitment lives in the claim that the man has not yet obtained the *experience* that connects them. It is not trivial because it denies an immediate intuitive grasp of the correlation, asserting instead that the connection is contingent and acquired. The wording supports the stronger claim that the connection is not innate, not merely that habit takes time.
      *   **Difficulty 4 (Protuberant Angle):** This is not a slip but a description of the object's known property, not the visual appearance itself. Locke means the angle that *was felt* as unequal pressure is the same feature that *will* appear visually as a corner. He is identifying the feature across modes, not assuming the visual appearance is already known. He is saying the man doesn't know that *this* visual mark corresponds to *that* tactile feel.
      *   **Difficulty 5 (Controls):** The weight difference does not matter because the condition is "by his sight." The controls ensure the tactile distinction is based on figure, not weight, so the failure to distinguish visually cannot be blamed on ambiguous tactile data. The visual constraint disposes of the weight issue.

      *   **Conclusion:** The passage is best read as asking whether tactile ideas of shape automatically translate to visual ideas of shape without prior associative learning. An experiment must ensure the subject cannot touch the objects during the visual test and has had no prior sight. The ambiguities regarding "certainty" versus "guessing" and the exact duration of "first sight" cannot be fully resolved from the wording alone, as Locke blends the epistemological point (no innate connection) with the psychological timing (habit formation).

