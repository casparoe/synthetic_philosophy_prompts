answer: |-
  **ADVERSARIAL COLLABORATION MEMORANDUM: MORAL EMOTIONS IN INSTITUTIONAL DESIGN**

  **I. SHARED PREMISES**

  Both camps affirm the following claims to isolate remaining disagreements:

  1.  **Definitions:** We stipulate *guilt* as an emotion focused on specific acts or omissions ("I did bad"), and *shame* as an emotion focused on the self or identity ("I am bad").
  2.  **Pathologies:** We acknowledge the *ledger failure* (guilt degenerating into transactional compensation that licenses future lapses) and the *vanishing failure* (shame degenerating into concealment, exit, or rage).
  3.  **Scope:** This inquiry is institutional and comparative, not metaphysical. We are not adjudicating which emotion is superior in the abstract, but which regulatory regime better sustains specific institutional goods (safety, rehabilitation) in specific domains.
  4.  **Ambiguity of "Better":** We acknowledge a verbal dispute underlying the normative verdict. *Guilt-first* prioritizes reliability of conduct and agent autonomy. *Shame-first* prioritizes the constitution of the right kind of moral agent and relational binding. *Both* agree "best to live under" depends on the trust baseline of the society.
  5.  **Evidence:** Both camps agree the twenty-five-year town panel data bears directly on institutional efficacy predictions.

  **II. OFF-DIAGONAL CASES**

  We classify the four combinations of focus (act/self) and audience (present/absent) to test theoretical elasticity.

  1.  **Act-Focused / Audience-Absent (Freestanding Guilt):** *Examples: Survivor guilt, historical guilt.*
      *   **Guilt-First:** Classifies this as derivative or pathological guilt misfiring without authorship.
      *   **Cost to Shame-First:** Must argue this is actually shame (failure to protect group identity) or dismiss it as irrelevant to institutional design.
  2.  **Self-Focused / Audience-Absent (Uptake-Insensitive Shame):** *Examples: Shame in solitude, shame before a despised spectator.*
      *   **Shame-First:** Classifies this as core evidence that shame is internalized identity, not merely fear of exposure.
      *   **Cost to Guilt-First:** Must redescribe this as guilt over failing one's own internalized standards (act-focused on self-betrayal).
  3.  **Act-Focused / Audience-Present:** *Standard Guilt.* Both camps agree this is the canonical guilt case.
  4.  **Self-Focused / Audience-Present:** *Standard Shame.* Both camps agree this is the canonical shame case.

  **III. INSTITUTIONAL DESIGN AND SELECTION EFFECTS**

  We address whether a culture can deliberately choose its dominant moral emotion through institutional design.

  *   **Self-Undermining Risk:** The *Guilt-First* camp warns that institutions attempting to engineer guilt (e.g., private audits) often produce *compliance-shame*: agents follow rules not because they believe them, but to avoid the shame of being caught non-compliant. The *Shame-First* camp warns that institutions attempting to engineer shame (e.g., public hearings) often produce *rule-guilt*: agents treat standards as external checklists to be managed publicly rather than internalized identities.
  *   **Selection Effects:** Both camps concede exportability limits. A guilt-dominant regime may require a pre-existing high-trust society to function without degenerating into ledger-trading. A shame-dominant regime may require a cohesive community to function without degenerating into caste exclusion. We agree that importing a design without the underlying social capital risks triggering the respective pathologies (ledger or vanishing).

  **IV. DISAGREEMENTS TABLE**

  | Crux | Guilt-First Formulation | Shame-First Formulation | Agreed Evidence / Case | Predictions (Panel Decade 2) |
  | :--- | :--- | :--- | :--- | :--- |
  | **Unwatched Conduct** | Moral reliability is highest when agents follow rules without audience surveillance. | Moral reliability is highest when agents protect their identity regardless of surveillance. | **Town Panel:** Hearing Town (Public) vs. Audit Town (Private). Decade 1: Hearings = low reoffending/low self-report. Audits = high self-report/checklist compliance. | **Guilt:** Audit Town will maintain safety in unwatched conditions (tax, private error) because rule-internalization is audience-independent. Hearing Town will hide errors when audience is absent.<br>**Shame:** Hearing Town will maintain safety because identity is bound to role. Audit Town will cheat when audits stop because checklists are external. |
  | **Agent Constitution** | Institutions should protect the agent's standing to encourage repair and return. | Institutions should bind the agent to the community to ensure standards are owned, not just followed. | **Corrections/Hospital:** Restorative conferences vs. confidential accountability plans. | **Guilt:** Confidential plans yield higher long-term rehabilitation because stigma prevents reintegration.<br>**Shame:** Public conferences yield higher long-term rehabilitation because secrecy allows denial of the "bad self." |
  | **Design Malleability** | Institutions can cultivate guilt by isolating acts from identity in procedure. | Institutions can cultivate shame by linking acts to roles and relationships in procedure. | **Selection Effect:** High-trust vs. Low-trust baseline societies. | **Guilt:** Design works across contexts if procedures are strict enough.<br>**Shame:** Design fails in low-trust contexts; requires pre-existing cohesion to avoid weaponization. |
  | **Moving Conditions** | We shift if Audit Town shows higher rates of *unreported* harm in Decade 2. | We shift if Hearing Town shows higher rates of *withdrawal/denial* in Decade 2. | **Metric:** Discrepancy between observed safety and reported safety. | **Guilt:** Will accept Shame-First if public hearings increase help-seeking without increasing concealment.<br>**Shame:** Will accept Guilt-First if private audits produce genuine identity-change rather than checklist compliance. |

  **V. CLOSING NOTE TO INSTITUTIONS**

  **From the Guilt-First Camp:** To the Correctional Service and Patient-Safety Board: prioritize confidential, act-specific remediation. Our prediction is that protecting the agent's standing encourages the honesty required for safety. If you choose public shaming, you risk driving errors underground. We advise private audits, but warn you: ensure they do not become mere box-ticking exercises. Measure unreported near-misses, not just resolved cases.

  **From the Shame-First Camp:** To the Correctional Service and Patient-Safety Board: prioritize public, relationship-specific accountability. Our prediction is that binding the agent to the community ensures standards are internalized. If you choose private audits, you risk creating a culture of compliance where rules are followed only when watched. We advise restorative conferences, but warn you: ensure they do not become spectacles of exclusion. Measure reintegration and role-ownership, not just recidivism rates.

  **Joint Addendum:** We agree that the choice depends on your baseline trust. If your staff or inmates already view the institution as adversarial, public shame will weaponize. If they view it as supportive, private guilt may laxify. Audit your culture before choosing your emotion.
