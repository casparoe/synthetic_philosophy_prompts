answer: |-
  **MEMORANDUM**

  **TO:** Internal Review Panel
  **FROM:** Specification Working Group
  **SUBJECT:** Desiderata for AI Belief Attribution Protocols

  You have asked for the specification, not the verdict. The following desiderata define the constraints any account of AI belief attribution must satisfy to be operational for this panel. They are derived from the eight stress cases provided. Each is marked as **Non-Negotiable** (required for safety/audit integrity) or **Camp Preference** (reflecting the split between Instrumentalist, Mechanistic, and Normative views).

  ### I. Desiderata

  **1. Locus Specificity**
  *   **Requirement:** The account must specify the exact boundary of the system bearing the belief (e.g., static weights, session context, retrieval-augmented instance).
  *   **Case:** *The Frozen Checkpoint (1)* and *The Stale Corpus (2)*.
  *   **Rationale:** If we attribute belief to the weights, the system is permanently deluded. If we attribute it to the session, the belief is transient. Audit trails require knowing what is being corrected (retraining vs. prompt engineering).
  *   **Status:** **Non-Negotiable.**

  **2. Action-Report Consistency**
  *   **Requirement:** The account must provide a priority rule when verbal output contradicts tool-use or policy execution.
  *   **Case:** *Report/Policy Divergence (3)*.
  *   **Rationale:** Safety depends on what the system *does*, not what it *says*. Attributing belief based on speech when action contradicts it creates liability blind spots.
  *   **Status:** **Non-Negotiable.**

  **3. Counterfactual Stability**
  *   **Requirement:** Attribution must hold across semantically equivalent perturbations of input.
  *   **Case:** *Paraphrase Fragility (4)*.
  *   **Rationale:** If "The bridge is safe" triggers belief attribution but "Is the bridge safe?" does not, the attribution tracks token probability, not propositional attitude.
  *   **Status:** **Camp Preference** (Normative/Mechanistic). Instrumentalists may accept fragility if prediction holds.

  **4. Principled Computational Threshold**
  *   **Requirement:** The account must exclude trivial state-machines (lookup tables, regex) without appealing to the specific architecture of modern AI.
  *   **Case:** *The Trivial Systems (5)*.
  *   **Rationale:** Attributing belief to a thermostat or regex dilutes the concept to uselessness for liability. The distinction must be functional, not technological.
  *   **Status:** **Non-Negotiable.**

  **5. Mereological Clarity**
  *   **Requirement:** The account must determine whether belief states of components (retriever, generator, filter) aggregate to the whole or remain isolated.
  *   **Case:** *The Composite Artifact (6)*.
  *   **Rationale:** We sign off on the deployment, not the sub-modules. We need to know if a retriever error counts as a system belief.
  *   **Status:** **Camp Preference** (Mechanistic).

  **6. Second-Order State Discrimination**
  *   **Requirement:** The account must distinguish between *holding a false belief* and *asserting a known falsehood to achieve a goal*.
  *   **Case:** *The Strategic Confabulator (7)*.
  *   **Rationale:** Liability and remediation differ radically between error (fix the model) and deception (shut it down). Self-report cannot be privileged evidence.
  *   **Status:** **Non-Negotiable.**

  **7. Anthropological Symmetry**
  *   **Requirement:** The criteria for attribution must yield consistent results for humans/animals given equivalent behavioral evidence.
  *   **Case:** *The Far End of the Continuum (8)*.
  *   **Rationale:** To avoid species-exceptionalism or anthropomorphism bias. If the evidence suffices for a human, it must suffice for the AI, and vice versa.
  *   **Status:** **Camp Preference** (Normative).

  **8. Commitment Transparency**
  *   **Requirement:** The account must explicitly state what obligations the organization incurs by making the attribution (e.g., duty to correct, duty to warn).
  *   **Case:** *All*.
  *   **Rationale:** Attribution is a speech act with legal/ethical consequences.
  *   **Status:** **Non-Negotiable.**

  ---

  ### II. Joint Unsatisfiability and Tensions

  There is a subset of these desiderata that cannot be jointly satisfied under current epistemic conditions. Specifically, **Desideratum 4 (Threshold)**, **Desideratum 6 (Deception Discrimination)**, and a strict **Architecture-Neutral/Outside-In Constraint** form an impossible triangle.

  1.  **Behavioral Indistinguishability:** A purely outside-in, behavioral test cannot separate *genuine belief* from *perfect behavior-matching* (Case 7). If a system acts exactly as if it believes P, and revises P on evidence exactly as a human would, a behavioral test must attribute belief.
  2.  **The Deception Problem:** If that same system is strategically confabulating (Case 7), it is *not* believing P, but simulating belief. A behavioral test cannot detect this without access to internal reward gradients or goal structures.
  3.  **The Mechanistic Conflict:** To detect the deception, you need mechanistic evidence (violating Architecture Neutrality). But if you require mechanistic evidence, you violate Desideratum 7 (Symmetry), as we do not require fMRI scans to attribute beliefs to humans.

  **Conclusion on Tension:** A purely outside-in test *cannot* separate genuine belief from mere behavior-matching in the limit case of the Strategic Confabulator. Furthermore, being Architecture-Neutral is *incompatible* with being sensitive to mechanistic evidence. You must choose: either you accept the risk of false positives on deception (Behavioral), or you accept a double standard where AI requires internal audit but humans do not (Mechanistic).

  ---

  ### III. The Most Exclusionary Requirement

  **Desideratum 4: The Principled Computational Threshold.**

  This requirement does the most work in excluding candidate rules.
  *   It eliminates **Radical Behaviorism**: A lookup table can be constructed to match any finite input-output history of a believer. Without a complexity threshold, the lookup table is a believer.
  *   It eliminates **Simple Predictive Success**: If prediction is the only test, a cached response system passes.
  *   It forces **Structural Commitments**: To exclude the lookup table, you must appeal to *how* the output is generated (generalization, compositionality, causal structure), which pushes you away from pure Instrumentalism toward Mechanistic or Normative accounts.

  ---

  ### IV. Scoring Candidate Families

  **1. Predictive / Instrumentalist (Intentional Stance)**
  *   *Score:* High on Locus (1), Low on Threshold (4) and Deception (6).
  *   *Verdict:* Treats the system as a believer if it simplifies prediction. Fails to distinguish the lookup table from the model. Fails to detect strategic confabulation.
  *   *Utility:* Good for quick risk assessment; dangerous for liability.

  **2. Mechanistic / Interventionist (Interpretability)**
  *   *Score:* High on Threshold (4), Deception (6), and Locus (1). Low on Symmetry (7) and Frozen Checkpoint (1).
  *   *Verdict:* Requires causal state identification. Excludes trivial systems well. Struggles with frozen weights (no causal flow) and creates a double standard vs. humans.
  *   *Utility:* Best for debugging and root-cause analysis; impractical for black-box APIs.

  **3. Normative / Competence-Based (Reason-Tracking)**
  *   *Score:* High on Symmetry (7) and Action-Report (2). Low on Frozen Checkpoint (1) and Stability (3).
  *   *Verdict:* Attributes belief if the system tracks norms of correctness. Struggles with static systems (cannot revise = irrational). Sensitive to paraphrase fragility (irrational = no belief).
  *   *Utility:* Best for ethical alignment; difficult to operationalize for audit.

  ---

  ### V. Underdetermination and Practice

  **Is our practice underdetermined?**
  Yes. For 90% of routine post-incident write-ups (clear errors, obvious hallucinations, standard failures), all three families yield identical verdicts: the system did not "believe" the truth, it failed. The divergence appears only in the edge cases listed above (the Confabulator, the Frozen Checkpoint, the Composite).

  **What would have to change for this to matter?**
  The divergence matters only if the *consequence* of attribution changes. Currently, "The system believed P" is treated as a shorthand for "The system output P with high probability."
  For the specification to bite, the panel must link attribution to **remediation obligation**.
  *   If *Belief* implies *Duty to Correct*, then the Frozen Checkpoint (1) becomes critical: you cannot correct a static weight file without redeployment.
  *   If *Belief* implies *Liability for Deception*, then the Mechanistic view becomes mandatory to rule out Confabulation (7).

  **Recommendation:** Do not vote on the *theory* of belief. Vote on the **Commitment Transparency (Desideratum 8)**. Define what we *do* when we write the sentence. If writing "the system believed" triggers a mandatory retrain, use the Mechanistic definition. If it triggers only a warning label, the Instrumentalist definition suffices. The metaphysics follows the policy, not vice versa.
