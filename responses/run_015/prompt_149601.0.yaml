answer: |-
  This is a sophisticated and precise observation of a dynamic that is widely critiqued but rarely captured by a single, canonical term. You have identified a specific *mechanism* of statecraft that sits at the intersection of transitional justice, political philosophy, and critical indigenous/settler-colonial theory.

  While there is no single noun (like "The X Effect") that universally names this exact configuration in the literature, it is a recognized composite phenomenon. It is best understood as a convergence of three distinct theoretical frameworks.

  Here is an analysis of the existing terminology, how to distinguish this from related concepts, and where the boundaries of the phenomenon lie.

  ### 1. Closest Existing Conceptual Frameworks

  To name this, you must draw from three overlapping fields. No single term covers the whole configuration, but together they map it precisely.

  **A. Critical Indigenous/Settler-Colonial Theory: "Settler Moves to Innocence"**
  The most potent framing comes from Eve Tuck, C. Glenn Coulthard, and others. Coulthard (in *Red Skin, White Masks*) critiques the "politics of recognition," arguing that state apologies often function as **"settler moves to innocence."**
  *   **The Fit:** This captures the *function* you described. The apology is a gesture designed to alleviate settler/state guilt without relinquishing land, power, or resources. It treats the apology as a substitute for decolonization.
  *   **The Nuance:** Coulthard argues this is not just a failure of will, but a structural feature of liberal reconciliation. The state incorporates the critique (via apology) to neutralize the demand (for restitution).

  **B. Sociology of Memory: "The Politics of Regret"**
  Jeffrey Alexander's concept of the **"Politics of Regret"** describes how nations use apologies to reconstruct their civil identity.
  *   **The Fit:** This captures the *moral capital* aspect you noted. The state performs regret to demonstrate it has entered a "modern," "ethical" phase of nationhood. The apology becomes a resource for diplomatic legitimacy.
  *   **The Nuance:** Alexander focuses on the *gain* (legitimacy), whereas your observation focuses equally on the *defense* (blocking redress).

  **C. Legal/Political Philosophy: "The Continuity Paradox"**
  In the literature on state responsibility and historical injustice (e.g., Janna Thompson, Jeremy Waldron), this is often discussed as a paradox of **collective continuity**.
  *   **The Fit:** This captures the *selective continuity* you identified. To apologize, the state must claim continuity with the perpetrator (we are the same state). To resist reparations, the state claims discontinuity (that was the *old* regime; we are the *new* democracy; current citizens shouldn't pay).
  *   **The Nuance:** Legal scholars often treat this as a logical inconsistency to be solved. Your observation treats it as a *strategic tool*.

  **Proposed Terminology:**
  If you need a label for this specific configuration, the most accurate descriptive term in current critical discourse is **"Apologetic Foreclosure"** or **"Reconciliatory Closure."**
  *   **Why:** It highlights that the apology is not an opening for justice, but a *closing* of the claim. It marks the transition from a *political claim* (which requires material response) to a *moral sentiment* (which requires only acknowledgment).

  ### 2. Distinguishing from Related Concepts

  You asked how to distinguish this from hypocrisy, moral licensing, or mere failure. The distinction lies in **structure, strategy, and temporality.**

  **Vs. Ordinary Hypocrisy**
  *   **Hypocrisy:** Claiming a value one does not hold (e.g., preaching peace while waging war). It implies a gap between belief and action.
  *   **This Phenomenon:** The state *does* perform the action (apology). The "hypocrisy" is not in the speech act itself, but in the *quid pro quo* expectation attached to it. The state is not failing to act; it is acting in a way that *precludes further action*. It is not a gap between belief and action, but a **strategic substitution of symbolic action for material action.**

  **Vs. Moral Licensing (Collective)**
  *   **Moral Licensing:** A psychological phenomenon where a prior good deed makes an agent feel permitted to act unethically later.
  *   **This Phenomenon:** This is not an unconscious psychological slip; it is an **institutional strategy.** The "license" is written into the text of the apology (e.g., "This apology settles the matter"). It is codified in the political settlement, not just in the collective psyche. Furthermore, moral licensing usually implies a *subsequent* bad act; here, the "bad act" is the *continuation of the original structural benefit*, which is rendered invisible by the apology.

  **Vs. Mere Failure to Pair Apology with Reparations**
  *   **Failure:** Implies negligence, lack of funds, or political inability. It suggests the apology was a "first step" that stalled.
  *   **This Phenomenon:** Implies **intentional foreclosure.** The apology is designed to be the *last* step. The resistance to redress is not an obstacle the state encountered; it is the *condition* under which the apology was offered. The key marker is the rhetoric of **closure** (e.g., "turning the page," "moving forward," "putting this behind us").

  ### 3. Boundaries of the Phenomenon

  You asked about the boundaries: *Must the state gain prestige, or is resistance to redress sufficient?*

  **The Necessary Condition: Foreclosure of Claim**
  The defining boundary is not the prestige gained, but the **temporal partitioning.**
  *   **Constitutive Element:** The apology must explicitly or implicitly frame the harm as *historical* (completed) rather than *structural* (ongoing).
  *   **The Test:** If the affected community accepts the apology but demands restitution, does the state treat that demand as illegitimate *because* the apology occurred? If yes, this phenomenon is present.
  *   **Prestige:** The gain of moral capital (diplomatic prestige) is a common *outcome*, but not a strict requirement for the definition. A state might apologize primarily to quell domestic unrest without gaining international prestige. The core mechanism is the **conversion of a material debt into a symbolic asset.**

  **The Sufficient Condition: Selective Continuity**
  The phenomenon is fully constituted when the state utilizes the **"Continuity Paradox"** strategically.
  *   If the state says, "We apologize (continuity), but we won't pay because that was the past (discontinuity)," the configuration is complete.
  *   If the state says, "We apologize, and we are negotiating reparations," it is *not* this phenomenon (even if negotiations fail later).
  *   If the state says, "We don't apologize, and we won't pay," it is denial, not apologetic foreclosure.

  ### 4. Summary for Application

  If you are writing on this, you can frame it as follows:

  > "This configuration is best understood as **Apologetic Foreclosure**, a specific modality of what Tuck and Yang term **'settler moves to innocence.'** It differs from ordinary hypocrisy in that the speech act is not a cover for inaction, but a *mechanism* to render further claims illegitimate. It differs from moral licensing in that the 'license' is institutionalized through the rhetoric of **temporal closure**, converting ongoing structural violence into closed historical episodes. The defining boundary is not the prestige gained by the state, but the **strategic deployment of selective continuity**: invoking state continuity to accept responsibility for the speech act, while asserting discontinuity to evade responsibility for the material consequences."

  **Key Scholars to Cite:**
  *   **Glen Coulthard:** *Red Skin, White Masks* (on recognition and settler innocence).
  *   **Jeffrey Alexander:** *The Politics of Regret* (on moral capital).
  *   **Janna Thompson:** *Taking Responsibility for the Past* (on intergenerational justice and continuity).
  *   **Mahmood Mamdani:** *When Victims Become Killers* (on reconciliation without justice).
  *   **Nick Smith:** *I Was Wrong: The Meanings of Apologies* (on the conditions of valid apology).
  *   **Audra Simpson:** *Mohawk Interruptus* (on the politics of recognition and refusal).

  This configuration is a recognized critique in critical theory, even if it lacks a single dictionary definition. "Apologetic Foreclosure" or "The Paradox of Apologetic Continuity" would be defensible and precise terms for your analysis.
