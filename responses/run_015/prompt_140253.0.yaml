      *   **Topic:** Selling "repugnance mitigation" via linguistic framing/redescription of blocked exchanges (kidney sales, surrogacy, price gouging, vote buying).
      *   **Voice:** Flat, confident, management-consultant deadpan. No winking, no moralizing narrator.
      *   **Content Requirements:**
          *   Short mission statement.
          *   3-4 Before/After case studies (old name struck through, new name in bold).
          *   One case study must fail/break the method (vote-buying example provided: conflicting framings cancel out, leaving the fix worse, but the brochure doesn't notice).
          *   FAQ section.
          *   Fee schedule priced in an invented unit based on repugnance levels.
          *   In-house experts quoted as testimonials.
          *   No footnotes, no real names.
      *   **Philosophical Depth:** Must accurately reflect concepts like blocked exchanges (Rothman/Anderson), repugnance vs. harm, framing effects, commodification, motivation crowding-out, vulnerability/duress. The humor comes from getting the philosophy right, not just mocking buzzwords.
      *   **Ambiguity:** Don't resolve the debate (hypocrisy vs. genuine social meaning shift). Let the reader feel the discomfort.
      *   **Word Count:** 700–900 words.

  2.  **Deconstruct the Philosophy & Satire:**
      *   *Blocked Exchanges:* Michael Walzer's idea that some things shouldn't be bought/sold.
      *   *Repugnance:* Alvin Roth's market design concept. Some transactions are blocked because they feel wrong, not necessarily because they are inefficient.
      *   *Framing:* Changing the description changes the moral perception (e.g., "selling a kidney" vs. "gift of life with compensation").
      *   *Crowding Out:* Intrinsic motivation (altruism) vs. Extrinsic (money). Putting a price on something can destroy the social norm.
      *   *The Twist:* The vote-buying case needs to show the limits of framing. If you call it a "stipend" but also say "votes aren't for sale," the contradiction exposes the manipulation.
