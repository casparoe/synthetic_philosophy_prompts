answer: |-
  # Teaching Plan: The Structure of Moral Motivation
  **Time:** 40 Minutes
  **Audience:** First-Year Philosophy Students
  **Goal:** Distinguish between *Object-Directed* (concrete moral features) and *Principle-Directed* (abstract duty) motivation without collapsing into "Emotion vs. Reason."

  ---

  ## I. Sequence & Rationale (The "Why" of the Order)
  *Do not begin with definitions.* If you define the terms first, students will treat them as vocabulary to memorize. The sequence must generate a **conceptual need** for the distinction.

  1.  **Establish Identity of Action (0–5 mins):** Prove that two agents can do the exact same right thing.
  2.  **Introduce the Tension (5–15 mins):** Reveal that their internal reasoning differs. Show why "Doing the Right Thing" is an incomplete description of moral worth.
  3.  **Define the Distinction (15–25 mins):** Label the structural difference only *after* they feel the gap.
  4.  **Intercept Misconceptions (25–35 mins):** Preemptively dismantle the "Cold Robot" and "Warm Fuzzy" errors.
  5.  **Diagnostic & Boundaries (35–40 mins):** Test structural grasp and limit the scope.

  ---

  ## II. The Carrying Example: "The Midnight Shift"
  *Avoids the Shopkeeper; focuses on promise-keeping vs. care.*

  **The Scenario:**
  Two students, **Casey** and **Jordan**, both agree to cover a difficult late-night lab shift for a sick colleague. It is raining, they are exhausted, and they would rather sleep. Both show up and do the work perfectly.

  *   **Casey's Thought Process:** "My colleague is going to lose their job if this shift isn't covered. I can see how stressed they are. I need to fix *this specific problem* for *this specific person*."
  *   **Jordan's Thought Process:** "I gave my word. A promise creates an obligation that exists regardless of my fatigue. I must act in accordance with *the binding nature of agreements*."

  **Why this scenario works:**
  1.  **High Stakes/Low Desire:** Both have to overcome inclination (sleep), so neither is acting on a whim.
  2.  **Same Action:** Eliminates consequentialist differences.
  3.  **Tension:** Casey focuses on the *person's plight* (Object); Jordan focuses on the *promise's structure* (Principle).

  ---

  ## III. Step-by-Step Procedure

  ### Phase 1: Establish Identity of Action (0–5 mins)
  *   **Activity:** Present the "Midnight Shift" scenario. Ask: "Did either of them do the wrong thing?" (Consensus: No). "Are they both praiseworthy?" (Consensus: Yes).
  *   **Goal:** Secure agreement that the *external* morality is identical.
  *   **Transition:** "If the action is the same, and the outcome is the same, is there anything left to evaluate? Or is moral worth just about checking the right box?"

  ### Phase 2: Introduce the Tension (5–15 mins)
  *   **Activity:** Reveal Casey and Jordan's internal monologues (see above).
  *   **Discussion Prompt:** "Casey is thinking about the *colleague*. Jordan is thinking about the *promise*. Does this difference matter to you? Why?"
  *   **Conceptual Necessity:** Elicit from students that we care about *who they are as agents*, not just what they do. This creates the need for a vocabulary to describe the difference.
  *   **Instructor Note:** Do not yet use the terms "Object-Directed" or "Principle-Directed." Let them describe the difference in their own words (e.g., "One cares about the person, one cares about the rule").

  ### Phase 3: Define the Distinction (15–25 mins)
  *   **Introduction of Terms:** Now map their observations to the technical terms.
      *   **Object-Directed:** Motivation sourced from the *concrete moral features* of the situation (the colleague's stress, the rain, the specific need). The "Object" is the situation itself.
      *   **Principle-Directed:** Motivation sourced from an *abstract representation of duty* (the concept of fidelity, the law of promises). The "Principle" is the rule governing the action.
  *   **Key Clarification:** Emphasize that **both** are "acting for the right reasons." This is not "Good vs. Bad." This is "Structure A vs. Structure B."
  *   **Visual Aid:** Draw two arrows.
      *   Casey: Agent → [Colleague's Need] → Action.
      *   Jordan: Agent → [Concept of Promise] → Action.

  ### Phase 4: Intercepting Misconceptions (25–35 mins)
  *Use this specific map to intervene when you see heads nodding incorrectly.*

  | Predictable Misconception | Why it forms | **Interception Point** | **Correction Strategy** |
  | :--- | :--- | :--- | :--- |
  | **"Principle-Directed = Robotic/Cold"** | Students associate "rules" with lack of care. | **Immediately after defining Principle-Directed.** | Ask: "Does Jordan love their colleague less? No. Jordan loves them *through* the lens of integrity. A robot doesn't struggle against sleep; Jordan does." |
  | **"Object-Directed = Just Emotion/Instinct"** | Students confuse "concrete features" with "feelings." | **During Phase 3 (Definition).** | Clarify: "Casey isn't acting on *impulse*. Casey perceives the need *as a reason*. It is a cognitive appraisal of the situation, not just a gut feeling." |
  | **"Right Reasons = Feeling Good"** | Students conflate moral worth with emotional satisfaction. | **During Phase 4 Discussion.** | Remind them: "Both are tired. Both would rather sleep. Moral worth here is about *overriding* the feeling, not having the 'warm' feeling." |

  ### Phase 5: Diagnostic & Boundaries (35–40 mins)

  **The Diagnostic Question:**
  *Do not ask them to define the terms.* Ask them to apply the structure to a shift in context.

  > "Imagine a third student, **Taylor**, covers the shift. Taylor thinks: 'I should help because helping people is good.'
  >
  > **Question:** Is Taylor's motivation structurally closer to Casey (Object-Directed) or Jordan (Principle-Directed)? Explain your reasoning based on *where Taylor's attention is focused*."

  *   **Correct Grasp:** Students should identify that Taylor is focused on the *abstract value of helping* (closer to Jordan/Principle) rather than the *specific colleague's need* (Casey/Object), OR argue that "helping people" is a generalization of the object. (Accept either if the *reasoning* focuses on the locus of attention).
  *   **Incorrect Grasp:** Students answer based on whether Taylor is "nicer" or "stricter."

  **Explicit Exclusions (Say this aloud):**
  "To be clear, we are **not** discussing today:"
  1.  **Consciousness:** "We are not asking if Jordan consciously recites a rulebook every time. Principle-directed motivation can be habitual."
  2.  **Moral Superiority:** "We are not settling the debate on whether Kant is right that Principle-Directed is *better*. We are just mapping the difference."
  3.  **Moral Knowledge:** "We are not asking if one knows ethics theory better than the other."

  ---

  ## IV. Why This Dependency Order Matters
  *(For your preparation, not necessarily to read to students)*

  1.  **Action First:** If you start with the definitions, first-years will treat "Object-Directed" as a label for "Nice" and "Principle-Directed" as a label for "Strict." By starting with the *Action*, you force them to see that the *behavior* cannot distinguish them.
  2.  **Tension Second:** By revealing the internal monologues before the labels, you make the distinction a **solution** to a puzzle ("How are these two different?") rather than a **taxonomy** to memorize.
  3.  **Misconceptions Third:** You cannot correct the "Cold Robot" error until they have the concept of Principle-Directed motivation. If you warn them too early, they won't understand what the warning applies to.
  4.  **Exclusions Last:** You must establish the scope *after* the concept is grasped, otherwise, you limit their thinking before they have explored the core idea.

  ## V. Instructor Cheat-Sheet for Q&A
  *   **If a student asks:** "But isn't Casey better because they care about the person?"
      *   **Response:** "That's a substantive ethical debate (Care Ethics vs. Deontology). For today, just notice that Casey's *reason* is the person, while Jordan's *reason* is the promise."
  *   **If a student asks:** "Can you be both?"
      *   **Response:** "Yes, motivations are often mixed. We are separating them here to understand the structure, like separating colors to understand light."
  *   **If a student asks:** "What if Casey doesn't know it's a duty?"
      *   **Response:** "Then Casey might be acting in *accordance* with duty but not *from* it. But for this exercise, assume both recognize the moral requirement."
