prompt: |-
  I'm currently taking an upper-division course on moral psychology and normative ethics, and for our peer-teaching session next week I have to guide a group of first-year philosophy students through the concept of moral worth and what it means to act for the right reasons. We've spent the past few lectures on the classic Kantian framework—acting from duty versus acting merely in accordance with it—but I want to move one layer deeper without losing them, by introducing the structural distinction between object-directed motivation (being moved by the concrete moral features of a situation itself) and principle-directed motivation (being moved by an abstract representation of one's duty). I need a teaching plan rather than a lecture script: the precise sequence in which these components must be introduced so that the distinction feels conceptually necessary rather than arbitrary, and why that dependency order matters.

  For the carrying example, I want a single concrete scenario—preferably not a familiar textbook case like the honest shopkeeper—that can hold both kinds of motivation in tension and make their difference visible without relying on specialized vocabulary. I also need a map of the misconceptions this audience will predictably form—such as equating "right reasons" with emotional warmth, with feeling guilty, or with mechanically following a rule—and the exact point in the sequence where each should be intercepted before it hardens. Please include one diagnostic question I can pose at the end to determine whether they've grasped the structural point about practical reasoning rather than just memorized the labels, and an explicit note on which adjacent debates—perhaps the relation between moral worth and explicit moral knowledge, or whether right reasons must be conscious—to openly leave out at this level and say so. The students have only read a standard introductory ethics text, and I have roughly forty minutes.
reasoning: |-
  Here's a thinking process that leads to the suggested teaching plan:

  1.  **Analyze the Request:**
      *   **Target Audience:** First-year philosophy students (introductory level, read standard intro text).
      *   **Topic:** Moral worth, acting for the right reasons, specifically the distinction between *object-directed motivation* (moved by concrete moral features) vs. *principle-directed motivation* (moved by abstract duty).
      *   **Context:** Peer-teaching session, 40 minutes.
      *   **Goal:** A teaching *plan* (sequence/structure), not a script. Needs to show *why* the order matters (conceptual necessity).
      *   **Key Requirement 1:** A single concrete scenario (not the honest shopkeeper) to illustrate the tension.
      *   **Key Requirement 2:** Map of predictable misconceptions and *when* to intercept them.
      *   **Key Requirement 3:** One diagnostic question at the end (tests structural grasp, not memorization).
      *   **Key Requirement 4:** Explicit note on what to *exclude* (adjacent debates).
      *   **Constraint:** Must make the distinction feel necessary, not arbitrary.

  2.  **Deconstruct the Core Concept:**
      *   The user wants to go "one layer deeper" than standard Duty vs. Inclination.
      *   Standard Kant: Duty vs. Inclination (e.g., helping because you like it vs. helping because it's right).
      *   Deeper Layer (The User's Focus): *How* is the "right" represented in the mind? Is it the *suffering person* (object-directed) or the *law/command* (principle-directed)?
      *   *Challenge:* First-years usually struggle with Kant's rigidity. They often think "acting from duty" means being cold/robotic. The plan needs to nuance this without abandoning Kant.
      *   *Strategy:* Use a scenario where both motivations lead to the *same action*, but the *structure of reasoning* differs.

  3.  **Develop the Scenario:**
      *   *Constraint:* Not the honest shopkeeper.
      *   *Requirement:* Must hold object-directed and principle-directed in tension.
      *   *Idea 1:* Returning a lost wallet. (Too common).
      *   *Idea 2:* Visiting a sick friend. (Good, allows for sympathy vs. duty).
      *   *Idea 3:* Whistleblowing. (Too complex for 40 mins).
      *   *Selection:* **Visiting a Sick Friend.**
      *   *Why:* It allows for natural sympathy (object-directed: "I see they are lonely") vs. principled commitment (principle-directed: "I promised/I have a duty to support friends"). It avoids the "shopkeeper" profit motive and focuses on interpersonal care, which resonates better with the "right reasons" debate.
      *   *Refinement:* Let's make it slightly more demanding. Visiting a friend in the hospital who is difficult/boring, or perhaps helping a stranger in distress where sympathy might fade. Let's go with **Helping a Stranded Motorist in the Rain.**
      *   *Wait, actually:* The "Sick Friend" case is better for *moral worth* specifically because Kant discusses friendship duties. Let's stick with **Visiting a Depressed Friend.**
      *   *Scenario Details:* Alex visits Jamie, who is deeply depressed. Jamie isn't fun to be around.
      *   *Motivation A (Object-Directed):* Alex sees Jamie's pain and is moved directly by *Jamie's need*.
      *   *Motivation B (Principle-Directed):* Alex thinks "I am the kind of person who keeps commitments" or "It is the law that one must aid friends."
      *   *Wait, a nuance check:* The prompt asks for "Object-directed (concrete moral features)" vs "Principle-directed (abstract representation of duty)."
      *   *Correction:* In Kantian scholarship (e.g., Marcia Baron, Henry Allison), there's a debate about whether acting from duty requires thinking about the *Categorical Imperative* explicitly (principle-directed) or if one can be moved by the *moral salience* of the situation (object-directed) *as* a duty.
      *   *Simplification for 1st Years:*
          *   Type 1: Moved by the *person's need* (The "Why" is "They are suffering").
          *   Type 2: Moved by the *rule* (The "Why" is "It is my duty").
      *   *Actually, to make it "conceptually necessary":* I need to show why distinguishing these matters for *praise/blame*.
      *   *Revised Scenario:* **The Difficult Promise.** You promised to help a colleague move apartments. It's raining. You don't feel like it.
      *   *Agent 1:* Helps because they see the colleague is overwhelmed (Object: The colleague's state).
      *   *Agent 2:* Helps because "A promise is a promise" (Principle: The binding nature of the vow).
      *   *Let's go with **The Overlooked Colleague**.*
      *   *Scenario:* A team member is being excluded from a lunch gathering.
      *   *Action:* You invite them.
      *   *Motivation 1:* You see they look sad/lonely (Concrete feature).
      *   *Motivation 2:* You believe "Exclusion is wrong/Fairness requires inclusion" (Abstract principle).
      *   *Decision:* **The Hospital Visit** is still the strongest for emotional resonance. Let's use **Visiting a Difficult Relative in Care.**
      *   *Scenario:* Your Uncle is in a care home. He is grumpy and doesn't recognize you.
      *   *Action:* You visit weekly.
      *   *Motivation A:* You feel pity/sadness seeing him there (Object-directed: focused on *him*).
      *   *Motivation B:* You think "Family has an obligation to care for elders" (Principle-directed: focused on *the obligation*).
      *   *Wait, I need to align with the prompt's specific definition:* "Object-directed (being moved by the concrete moral features of a situation itself)" vs "Principle-directed (being moved by an abstract representation of one's duty)."
      *   *Okay, let's refine the scenario to ensure the "Principle" isn't just "rule-following" but "duty as an abstract concept."*
      *   *Selected Scenario:* **The Lost Wallet.** (No, prompt said avoid textbook).
      *   *Selected Scenario:* **The Midnight Shift.** You agreed to cover a shift for a coworker. It's late, cold, and you're tired.
      *   *Action:* You go to work.
      *   *Motivation 1 (Object):* You think about the coworker who needs to pick up their kid/attend an event. You are moved by *their specific predicament*.
      *   *Motivation 2 (Principle):* You think about the *sanctity of agreements*. You are moved by the *concept of fidelity*.
      *   *This works.* It separates "The Person/Need" from "The Rule/Concept."

  4.  **Structure the 40 Minutes (Sequence & Dependency):**
      *   *Phase 1: Grounding (0-10 mins).* Establish the action is the *same*. Establish both agents are "good." Why ask further?
      *   *Phase 2: The Distinction (10-25 mins).* Introduce the two motivations. Show why they are structurally different.
      *   *Phase 3: Intercepting Misconceptions (25-35 mins).* Address the "Cold Robot" and "Warm Fuzzy" errors.
      *   *Phase 4: Assessment & Boundaries (35-40 mins).* Diagnostic question and scope limitation.

  5.  **Drafting the Misconception Map:**
      *   *Misconception 1:* "Principle-directed = Robotic/Cold." (Intercept during Phase 2).
      *   *Misconception 2:* "Object-directed = Just feelings/Instinct." (Intercept during Phase 2/3).
      *   *Misconception 3:* "Right Reasons = Feeling Good about it." (Intercept during Phase 3).

  6.  **Drafting the Diagnostic Question:**
      *   Needs to test *structure*, not labels.
      *   *Idea:* Change the scenario slightly. If the principle changes but the object stays, does the motivation change?
      *   *Better:* Ask them to identify the *focus of attention* in a new vignette.

  7.  **Drafting the Exclusions:**
      *   Conscious vs. Unconscious reasoning.
      *   Whether principles *cause* the action or just justify it.
      *   Consequentialist critiques.

  8.  **Refining the "Conceptual Necessity":**
      *   Why does this order matter?
      *   If you start with definitions, they memorize.
      *   If you start with the *problem* (Two good people, same action, is there a difference?), the distinction becomes the *solution*.
      *   Sequence: Intuition -> Tension -> Distinction -> Application.

  9.  **Review against Constraints:**
      *   40 minutes? Yes.
      *   First-years? Keep language accessible.
      *   No script? Yes, outline/plan.
      *   Specific scenario? Yes (The Midnight Shift).
      *   Misconception map with timing? Yes.
      *   Diagnostic question? Yes.
      *   Exclusions noted? Yes.

  10. **Final Polish:** Ensure the distinction between "Object-Directed" (The Need) and "Principle-Directed" (The Duty) is clear. *Self-Correction:* In Kantian terms, acting from duty *is* the gold standard. The prompt asks to distinguish object-directed (concrete features) from principle-directed (abstract duty). This sounds like a nuance *within* acting from duty, or a comparison between a sympathetic helper and a dutiful helper.
      *   *Re-reading prompt:* "acting from duty versus acting merely in accordance with it—but I want to move one layer deeper... introducing the structural distinction between object-directed motivation... and principle-directed motivation."
      *   *Interpretation:* The user wants to complicate the standard "Inclination vs. Duty" binary. They want to show that even within "Doing the Right Thing," there's a structural difference in *how* the reason is held in mind.
      *   *Crucial Nuance:* Object-directed isn't just "inclination." It's "moved by the moral features of the situation" (e.g., the suffering). Principle-directed is "moved by the law."
      *   *Teaching Challenge:* First-years think "moved by suffering" = Inclination. I must clarify that seeing suffering *as a reason* is moral, but is it the *same structure* as seeing Duty *as a reason*?
      *   *Plan Adjustment:* I need to make sure "Object-Directed" doesn't collapse into "Inclination." I will define Object-Directed as "Perceiving the Need *as* a Claim." Principle-Directed is "Perceiving the Rule *as* a Command."

      *(Self-Correction during drafting)*: Keep it simple.
      *   Object-Directed: "I help because *you* are in pain." (Focus: The Other).
      *   Principle-Directed: "I help because *helping* is required." (Focus: The Law).
      *   Both are moral. Both are "right reasons." But the *structure* differs.

      *Let's finalize the scenario:* **The Late Night Study Group.**
      *   Context: You promised to review notes with a classmate. You are exhausted.
      *   Action: You show up.
      *   Motivation A: You think about the classmate failing if you don't show (Concrete feature).
      *   Motivation B: You think about the fact that you gave your word (Abstract principle).
      *   This is clean and relatable.

      *Wait, one more check on the "Conceptual Necessity":*
      *   Why introduce this? Because if we only say "Do the right thing," we miss *what makes the agent praiseworthy*. Is it their sensitivity to others (Object) or their integrity (Principle)?
      *   The sequence must force them to see that "Doing the Right Thing" is insufficient to describe the *moral psychology*.

      *Okay, ready to write.*

      *Wait, checking the "Misconception" timing.*
      *   Need to be precise. "Equating right reasons with emotional warmth" -> Intercept when introducing Object-Directed. "Mechanically following a rule" -> Intercept when introducing Principle-Directed.

      *Diagnostic Question:* Needs to be tricky.
      *   Scenario: Someone helps, but *why*?
      *   Q: "If Agent A helps because 'Suffering is bad' and Agent B helps because 'I must reduce suffering,' what is the structural difference?"
      *   Better: "In which case does the agent's focus shift if the specific person changes?"

      *Let's refine the Diagnostic:*
      *   "Imagine two people donate to charity. Person 1 thinks 'These children are hungry.' Person 2 thinks 'Charity is a moral obligation.' If the charity changes to 'Environmental Protection,' whose motivation is more likely to sustain the action without re-evaluation?" -> Tests stability of principle vs object.
      *   *Actually, simpler:* "Which agent is responding to the *world* and which is responding to the *law*?"
      *   *Best:* A vignette where the object changes but the principle holds.

      *Okay, proceeding with the plan.*

      *Wait, one last thing:* The prompt asks for "why that dependency order matters." I need to explicitly state this in the plan notes.
      *   Order: Intuition -> Differentiation -> Correction -> Assessment.
      *   Why: If you define first, they memorize. If you feel the tension first, they need the definition.

      *Final check on exclusions:*
      *   Conscious vs Unconscious.
      *   Moral Worth vs. Moral Rightness.
      *   Whether one is *better* than the other (Kant says Principle, but we are just mapping structure).

