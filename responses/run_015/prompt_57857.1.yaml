              3.  *Constructive Validity:* The student claims the classical existence claim is "constructively false" without the extra info. This is wrong. The statement $\exists a, b \in \mathbb{R} \setminus \mathbb{Q} (a^b \in \mathbb{Q})$ is constructively true (because we can construct a specific pair, e.g., $a=\sqrt{2}, b=2\log_2 3$ or simply using the known transcendence of $\sqrt{2}^{\sqrt{2}}$ to pick the specific pair). The *proof method* was non-constructive, not the *theorem*.
