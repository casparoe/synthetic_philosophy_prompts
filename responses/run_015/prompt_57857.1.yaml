      *   *Part 4 (The Gelfond-Schneider Theorem Claim):* "However, since number theorists have now established that the number in question is in fact irrational, we know the second alternative obtains, and that retrospective information repairs the original inference, making that very argument constructively valid after all, whereas without it the intuitionist would regard the classical existence claim as constructively false."
