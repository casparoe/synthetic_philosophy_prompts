prompt: |-
  I work as the curriculum and ethics chair at a small design institute, and about twice a semester we get into these messy disputes where a student or alumni uses a compositional method they picked up from a professor's unpublished workshop notes — like a specific way of layering translucent glazes to create depth, or a mental heuristic for arranging negative space — and then licenses the result commercially. The professor claims they "stole my idea," but the student says they just learned a technique, like learning a receipe. I need a decision procedre my three-person review panel can actually run in under an hour, grounded in whatever philosophy of property actually says about owning ideas versus expressions, with clear steps: what to ask in order, what counts as a sufficient answer, where we stop with a no, where we hand it off because it's a values call rather than a fact, and where we escalate to legal because it's actually contract breach not philosophy.

  The procedre should handle the hard cases: techniques that are partly functional and partly expressive, ideas that only really work in one specific medium, and cases where the professor never wrote anything down but taught it orally in a closed session. Then apply it to three scenarios: (1) the glaze-layering technique I mentioned, used in a ceramic line sold nationally; (2) a student who takes the professor's unpublished negative-space heuristic — basically a mental checklist — and builds an entire branding agency around it; and (3) a case where the student literally copied the professor's handwritten workshop notes and sold them as a "masterclass PDF," but claims they only copied the ideas inside, not the expressive form of the notes. I especially want the procedre to flag where it'll misfire, like when a technique is so tightly bound to one person's style that separating idea from expression is practically impossible, and I want one of those three applications to come out supporting the student in a way the professor will hate but the logic demands anyway. Keep it practical: we don't have lawyers on the panel, just educators, and we need to sign off or escalate within 48 hours.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **Role:** Curriculum and Ethics Chair at a small design institute.
      *   **Problem:** Disputes between professors and students/alumni over the commercial use of pedagogical methods/techniques (unpublished workshop notes, heuristics, specific artistic processes).
      *   **Constraint 1:** Decision procedure must be runnable by a 3-person panel in under an hour.
      *   **Constraint 2:** Grounded in philosophy of property (ideas vs. expression).
      *   **Constraint 3:** Clear steps (questions, sufficiency criteria, stop points, escalation points).
      *   **Constraint 4:** Handle hard cases (functional/expressive mix, medium-specific ideas, oral teaching).
      *   **Constraint 5:** Apply to three specific scenarios (Glaze, Heuristic/Agency, Copied Notes).
      *   **Constraint 6:** Flag where the procedure misfires (limitations).
      *   **Constraint 7:** One application must support the student in a way the professor hates but logic demands.
      *   **Constraint 8:** Practical (no lawyers on panel, 48-hour turnaround).

  2.  **Determine the Philosophical Grounding:**
      *   The core tension is *Idea-Expression Dichotomy* (Copyright law/philosophy) vs. *Trade Secret/Misappropriation* vs. *Pedagogical Norms*.
      *   *Copyright:* Protects expression, not ideas, procedures, processes, systems, or methods of operation (17 U.S.C. § 102(b)).
      *   *Patent:* Protects functional inventions (requires registration, not applicable here usually).
      *   *Trade Secret:* Protects confidential info deriving economic value from not being known (requires reasonable secrecy measures).
      *   *Academic/Ethical Norms:* Attribution, mentorship, "standing on shoulders of giants."
      *   *Decision:* The procedure needs to lean heavily on the *Idea-Expression Dichotomy* because it's the standard for creative fields, but acknowledge *Confidentiality* for unpublished notes.

  3.  **Drafting the Procedure (The "Idea-Expression-Confidentiality" Protocol):**
      *   *Goal:* Fast, binary decisions where possible, escalation where not.
      *   *Structure:*
          1.  Threshold Check (Is this even our business?).
          2.  The "Expression" Test (Copyright boundary).
          3.  The "Confidentiality" Test (Trade Secret/Contract boundary).
          4.  The "Attribution" Test (Ethical boundary).
          5.  Escalation/Verdict.
      *   *Timing:* Needs to be tight. 10 mins per section.
      *   *Philosophy:* Lockean Labor Theory (mixing labor with resources) vs. Hegelian Personality (expression of self) vs. Utilitarian (incentivizing creation). The procedure should favor Utilitarian/Copyright standards (promote progress) over Hegelian (owning styles).

  4.  **Refining the Steps (Iterative Process):**
      *   *Step 1:* Is there a contract? If yes, legal. (Crucial for speed).
      *   *Step 2:* Is it Expression or Idea? (The hard part). Need a heuristic for this. *Merger Doctrine:* If the idea can only be expressed one way, it's not protectable.
      *   *Step 3:* Was it Confidential? Oral vs. Written.
      *   *Step 4:* Harm/Attribution.
      *   *Stop Rules:* If it's a "method," student wins. If it's "notes," prof wins. If it's "style," nobody wins (misfire).

  5.  **Developing the Three Scenarios:**
      *   *Scenario 1 (Glaze):* Functional/Technical method. Philosophy says methods aren't owned. Student should win. Prof will hate it.
      *   *Scenario 2 (Heuristic/Agency):* Mental checklist. System/Process. Student should win, but maybe with attribution requirement.
      *   *Scenario 3 (Copied Notes):* Literal copying of expression. Student loses clearly. This is copyright infringement, not just ethics.

      *Wait, I need one to support the student in a way the professor hates.* Scenario 1 is the best candidate for this. A specific artistic technique often feels like "style" to the prof, but legally/philosophically it's a "method."
      *Wait, I need to flag misfires.* The procedure will fail when "Style" = "Method."

  6.  **Writing the Procedure (Drafting content):**
      *   Name: The *Pedagogical IP Triage Protocol (PITP)*.
      *   Timebox: 45 mins deliberation + 15 mins writing.
      *   Phase 1: Contract & Confidentiality (The "Hard No" check).
      *   Phase 2: Idea vs. Expression (The "Merger" check).
      *   Phase 3: Ethical Attribution (The "Middle Ground").
      *   Phase 4: Verdict & Escalation.

  7.  **Addressing the "Hard Cases" in the Procedure:**
      *   *Functional/Expressive:* Use the "Alternative Means" test. Can you achieve the result differently?
      *   *Medium Specific:* Does the medium dictate the method?
      *   *Oral Teaching:* Treat as "Limited License to Learn" unless explicitly marked confidential.

  8.  **Applying to Scenarios (Mental Simulation):**
      *   *Glaze:* It's a recipe/process. Not expression. Student wins. Prof hates it. (Matches requirement).
      *   *Heuristic:* It's a system. Student wins on ownership, but maybe ethical ding on branding it as *their* invention without nod to mentor. Let's make it a clean win for student to fit the "logic demands" requirement, or perhaps the Notes case is the clear loss. Let's stick with Glaze as the "Prof hates it" win.
      *   *Notes:* Literal copying. That's expression. Student loses. Escalate to legal potentially, but panel can rule unethical.

  9.  **Refining the "Misfire" Section:**
      *   Where style is inseparable from technique.
      *   Where oral tradition clashes with IP law.
      *   Where power dynamics (prof vs. student) skew the "voluntary" nature of learning.

  10. **Final Review against Constraints:**
      *   Under an hour? Yes, structured phases.
      *   Philosophy grounded? Yes (Idea-Expression, Merger Doctrine).
      *   Clear steps? Yes.
      *   Three scenarios applied? Yes.
      *   One student win prof hates? Yes (Glaze).
      *   Practical/No lawyers? Yes, focuses on evidence panel can see.

  11. **Polishing the Tone:**
      *   Needs to be administrative but philosophically rigorous.
      *   Clear headings, bullet points.
      *   Actionable language ("Ask," "Look for," "Decide").

  12. **Self-Correction on Scenario 2:**
      *   If I make Scenario 1 the "Prof hates it" win, Scenario 2 should be nuanced. Building an agency around a heuristic is borderline. If the heuristic is a "system," it's not copyrightable. But claiming it as *original* might be fraud. Let's focus the "Prof hates it" win on Scenario 1 (the physical technique) because it highlights the Idea/Expression divide best. Scenario 3 is the easy loss for the student. Scenario 2 is a win for student but with ethical caveats.
      *   *Correction:* The prompt asks for *one* of the three to come out supporting the student in a way the professor will hate but logic demands. I will ensure Scenario 1 is that one.

  13. **Final Polish:** Check the "Escalation" criteria. If it involves contract breach (NDA), the panel *must* kick it to legal/admin, not rule on it themselves. This protects the institute.

  14. **Final check on "Philosophy of Property":** Explicitly mention the *Idea-Expression Dichotomy* and the *Merger Doctrine* as the philosophical anchors. This gives the panel the vocabulary to defend decisions.

  15. **Constructing the Output:** (Proceeding to generate response based on these thoughts).
answer: |-
  # The Pedagogical IP Triage Protocol (PITP)
  **For:** Curriculum & Ethics Review Panel  
  **Time Limit:** 60 Minutes (45 min deliberation, 15 min documentation)  
  **Philosophical Grounding:** The Idea-Expression Dichotomy (Copyright Philosophy) & The Merger Doctrine.  
  **Goal:** Distinguish between *owning a tool* (prohibited) and *owning the work made with the tool* (permitted).

  ---

  ## Part 1: The Decision Procedure

  ### Phase 1: The Contract & Confidentiality Gate (10 Minutes)
  *Goal: Determine if this is an ethics issue or a legal breach.*

  **Question 1.1:** Did the student sign an NDA, employment contract, or specific workshop agreement regarding the material?
  *   **Evidence:** Syllabus, workshop sign-in sheet, email correspondence, institute handbook.
  *   **If YES (Contract exists):** **STOP.** Escalate to Legal/Admin. This is a breach of contract, not an ethics review.
  *   **If NO (No contract):** Proceed to 1.2.

  **Question 1.2:** Was the material explicitly marked or declared "Confidential/Proprietary" *before* disclosure?
  *   **Evidence:** Watermarks, verbal warnings recorded in notes, "Closed Session" signage.
  *   **If YES (Explicit Confidentiality):** Presumption favors Professor. Proceed to Phase 3 (Ethics).
  *   **If NO (General Pedagogy):** Presumption favors Student (Pedagogical material is implied license to learn/use). Proceed to Phase 2.

  ### Phase 2: The Idea-Expression Test (25 Minutes)
  *Goal: Apply the Merger Doctrine. Can the idea exist without this specific expression?*

  **Question 2.1:** Is the disputed item a **Method/Process** or a **Fixed Work**?
  *   **Method/Process:** A recipe, a heuristic, a sequence of actions, a chemical mix, a mental checklist.
  *   **Fixed Work:** A specific drawing, a recorded lecture, a written manuscript, a specific image.
  *   **Decision:**
      *   If **Fixed Work** (e.g., copying notes): Ruling favors Professor. (Stop).
      *   If **Method/Process**: Proceed to 2.2.

  **Question 2.2:** The "Alternative Means" Test (The Merger Doctrine).
  *   **Ask:** Can the student achieve a similar functional result using a *different* method?
  *   **Ask:** Is the method the *only* way to express the underlying idea?
  *   **Sufficient Answer for Student:** "Yes, I could have achieved depth with different glazes," or "Yes, I could have arranged space using a different grid system."
  *   **Sufficient Answer for Professor:** "No, this specific sequence is the invention itself, and there is no other way to teach this concept."
  *   **Decision:**
      *   If **Alternative Means Exist:** The method is an *Idea*. Ideas are not property. Ruling favors Student. (Stop).
      *   If **Merger (No Alternative):** The idea and expression are inseparable. Proceed to Phase 3.

  ### Phase 3: The Attribution & Harm Assessment (15 Minutes)
  *Goal: Determine ethical misconduct where legal ownership is unclear.*

  **Question 3.1:** Is the student claiming **Authorship** of the method or **Proficiency** in the method?
  *   **Authorship:** "I invented this system." (Unethical if false).
  *   **Proficiency:** "I specialize in this technique." (Ethical).
  *   **Decision:** If claiming Authorship without credit, mandate attribution. If claiming Proficiency, no sanction.

  **Question 3.2:** Is there direct market substitution?
  *   **Ask:** Is the student selling the *teaching* of the method against the professor, or selling *objects made* with the method?
  *   **Decision:** Selling objects = Permitted. Selling the teaching = Unfair Competition (Ethics violation).

  ### Phase 4: Verdict & Escalation (10 Minutes)
  *   **Verdict A (No Violation):** Student used a general method/process. Professor retains no property right over pedagogy.
  *   **Verdict B (Ethical Violation):** Student used method but misrepresented origin. Remedy: Mandatory attribution in marketing materials.
  *   **Verdict C (Expression Violation):** Student copied fixed media (notes/recordings). Remedy: Cease and Desist.
  *   **Escalation:** If Phase 1 revealed a contract, or if Phase 2 reveals a potential Patentable invention (rare), hand off to Legal.

  ---

  ## Part 2: Known Misfires & Limitations
  *The panel must acknowledge these blind spots before signing the verdict.*

  1.  **The "Style" Trap:** When a technique is so unique it functions as a signature (e.g., a specific brushstroke that identifies the master). The PITP classifies this as a "Method" (Student wins), but philosophically, it feels like "Identity" (Professor feels robbed). The panel must accept that **style cannot be copyrighted**, even if it feels like theft.
  2.  **The Oral Tradition Gap:** If a professor teaches orally without marking it confidential, PITP assumes an "implied license to learn." This disadvantages professors who rely on trade secret norms in an academic setting.
  3.  **Power Dynamics:** The procedure assumes equal footing. It does not account for coercive mentorship where a student feels forced to share revenue. This requires a separate grievance channel.

  ---

  ## Part 3: Application to Scenarios

  ### Scenario 1: The Glaze-Layering Technique
  *Facts:* Prof developed a specific 3-step translucent glaze sequence. Student uses it on ceramics sold nationally. Prof claims theft of "visual signature."
  *   **Phase 1:** No NDA signed. Workshop was open to enrolled students. (Presumption: Student).
  *   **Phase 2:** Is it a Method or Fixed Work? It is a **Method** (recipe/process).
      *   *Alternative Means Test:* Can depth be created other ways? Yes (single thick glaze, underpainting, texture). The idea is "ceramic depth"; the expression is "this specific glaze mix."
      *   *Merger:* No merger. The idea does not require this specific expression.
  *   **Phase 3:** Student is selling pots, not teaching the glaze recipe.
  *   **Verdict:** **No Violation (Verdict A).**
  *   **Rationale:** Under the Idea-Expression dichotomy, a technique is a tool. Owning a hammer doesn't give the manufacturer rights to the house you build.
  *   **The "Prof Hates It" Factor:** The professor views this as their artistic DNA. The logic demands the student win because granting property rights over a *process* monopolizes a technique and stifles design progress. The professor retains copyright over specific *photos* of the pots, but not the method of making them.

  ### Scenario 2: The Negative-Space Heuristic (Branding Agency)
  *Facts:* Prof taught a mental checklist for arranging negative space. Student builds an agency branding itself on this "System."
  *   **Phase 1:** No NDA. Taught in closed session but not marked confidential.
  *   **Phase 2:** Method or Fixed Work? **Method** (Mental system/heuristic).
      *   *Alternative Means:* Can branding be done without this checklist? Yes.
  *   **Phase 3:** Attribution Check. Is the student claiming they *invented* the heuristic?
      *   *If Yes:* Ethical Violation (Verdict B). They are selling the *system* as their IP.
      *   *If No (e.g., "Based on X methodology"):* No Violation (Verdict A).
  *   **Verdict:** **Conditional.** If the agency marketing implies invention, they must add "Methodology derived from [Professor]" to their About page. If they simply use the tool to do client work, they are clear.
  *   **Rationale:** Systems and heuristics are not copyrightable (17 U.S.C. § 102(b)). However, academic honesty requires acknowledging the lineage of the intellectual framework if it is being sold as a proprietary "System."

  ### Scenario 3: The Copied Workshop Notes (Masterclass PDF)
  *Facts:* Student scanned Prof's handwritten notes and sold them as a PDF. Claims they are selling the "ideas," not the "notes."
  *   **Phase 1:** No NDA.
  *   **Phase 2:** Method or Fixed Work? **Fixed Work.** The handwritten notes are a tangible expression of the ideas.
      *   *Merger:* Did the student need to copy the *handwriting and layout* to convey the idea? No. They could have written their own summary.
  *   **Phase 3:** Harm. Direct market substitution. The PDF competes with the Prof's ability to teach/sell their own materials.
  *   **Verdict:** **Expression Violation (Verdict C).**
  *   **Rationale:** This is the bright line. You own the labor of the *expression* (the notes), even if you don't own the *ideas* inside them. Selling the scanned notes is copyright infringement, not just an ethics breach.
  *   **Action:** Immediate Cease and Desist. If student refuses, escalate to Legal for DMCA takedown.

  ---

  ## Panel Sign-Off Sheet

  **Case ID:** _______________  
  **Date:** _______________  
  **Panelists:** _______________  

  **Phase 1 Outcome:** [ ] Contract Found (Escalate) [ ] No Contract (Continue)  
  **Phase 2 Outcome:** [ ] Method (Student Favor) [ ] Fixed Work (Prof Favor)  
  **Phase 3 Outcome:** [ ] Attribution Required [ ] No Action  

  **Final Verdict:** [ ] A (No Violation) [ ] B (Attribution) [ ] C (Cease/Desist) [ ] Legal Escalation  

  **Misfire Acknowledgement:** *Does this case fall into the "Style Trap" where the method feels like identity?* [ ] Yes [ ] No  
  *If Yes, note that the panel is ruling on property logic, not artistic sentiment.*

  **Signatures:** _________________________
