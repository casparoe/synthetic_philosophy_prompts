      *   *Class/Personification:* The user hits the nail on the head. We personify "The Storm" as a monster attacking everyone. We don't personify "The Landlord" or "The Grid" as monsters attacking one person. We treat poverty/infrastructure failure as background noise, not an active blocker.

  3.  **Deconstruct the History Analogy (Famine & Volcanoes):**
