      **Strongest Consideration on the Losing Side:** The staff's primary argument is that risk mitigation requires acting on the worst-case scenario when consequences are catastrophic. If the 85% confidence level is accurate, a three-year delay exposes the region to unacceptable danger. The cost of a breach dwarfs the cost of the upgrade. If the inside-view is correct, prudence dictates immediate spending, not further study.

