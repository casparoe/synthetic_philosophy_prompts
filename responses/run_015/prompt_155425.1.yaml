prompt: |-
  hey can you grade this exam answer? im a TA and this student is mostly making sense but something feels off and i cant pin it down.

  question: excavation shows every house at a settlement had identical imported obsidian blades, but small carved figurines only show up in two large central buildings. what can we legitimately infer about social stratification and belief?

  student answer: "the obsidian being everywhere proves the society was economically egalitarian—elites would have hoarded better tools if they existed. the figurines are obviously ritual objects controlled by religious specialists, since theyre only in big buildings, so spiritual authority was centralized even though wealth wasnt. also, since every blade is identical, we can rule out craft specialization entirely—no one was making tools for anyone else."

  grade it out of 10 and give me point-by-point comments. tell me exactly whats right, whats subtly wrong (no obvious howlers, just reasoning slips), and which inferences dont actually follow from the objects alone. i need specific feedback, not just "mostly correct."
reasoning: |-
  Here's a thinking process that leads to the suggested grading and feedback:

  1.  **Analyze the Request:**
      *   **Role:** TA grading a student exam answer.
      *   **Task:** Grade out of 10, provide point-by-point comments, identify what's right, what's subtly wrong (reasoning slips), and which inferences don't follow from the evidence.
      *   **Context:** Archaeology/Anthropology question about social stratification and belief based on artifact distribution (obsidian blades vs. figurines).
      *   **Student's Answer:** Claims economic egalitarianism based on obsidian distribution, claims centralized spiritual authority based on figurine distribution, claims no craft specialization because blades are identical.
      *   **User's Concern:** The student makes sense but "something feels off." I need to pinpoint the subtle logical flaws.

  2.  **Analyze the Question & Evidence:**
      *   **Evidence A:** Every house has *identical imported* obsidian blades.
      *   **Evidence B:** Small carved figurines *only* show up in two large central buildings.
      *   **Questions to Answer:** What can be *legitimately inferred* about (1) social stratification and (2) belief?
      *   **Key Constraint:** "Legitimately infer" (avoid over-interpretation).

  3.  **Evaluate the Student's Answer (Claim by Claim):**

      *   *Claim 1: "the obsidian being everywhere proves the society was economically egalitarian—elites would have hoarded better tools if they existed."*
          *   **Critique:** This is a classic archaeological fallacy (equifinality). Just because everyone has the *same* tool doesn't mean everyone has the same *wealth*. Obsidian might be a low-value utilitarian item (like matches today). Elites might hoard *other* things (feathers, jade, food stores) not mentioned. Also, "imported" implies trade networks which often involve hierarchy.
          *   **Verdict:** Overreach/Logical Leap. Weak inference.

      *   *Claim 2: "the figurines are obviously ritual objects controlled by religious specialists, since theyre only in big buildings, so spiritual authority was centralized even though wealth wasnt."*
          *   **Critique:** This is the strongest part of the answer. Restricted access to specific objects in central buildings *does* suggest some form of exclusion or corporate group control. Linking this to "religious specialists" is a reasonable working hypothesis, though "ritual objects" is an assumption (they could be ancestral tokens, political symbols, etc.). However, in the context of an exam, this is usually acceptable interpretation *if* qualified. The student says "obviously," which is too strong.
          *   **Verdict:** Plausible, but stated too confidently.

      *   *Claim 3: "also, since every blade is identical, we can rule out craft specialization entirely—no one was making tools for anyone else."*
          *   **Critique:** This is logically backwards. If every blade is *identical* and *imported*, it suggests standardization. Standardization often implies *high* craft specialization at the source, or at least a standardized exchange system. It definitely does *not* rule out craft specialization. It just means the specialization might have happened elsewhere (imported) or was highly standardized locally. Saying "no one was making tools for anyone else" contradicts the "imported" premise (someone made them to be traded).
          *   **Verdict:** Factually/Logically Incorrect.

  4.  **Determine the Grade:**
      *   The student identifies the basic contrast (ubiquitous vs. restricted).
      *   The student attempts to address stratification and belief.
      *   However, the reasoning contains significant logical flaws regarding economic egalitarianism and craft specialization.
      *   The "something feels off" the TA senses is likely the deterministic language ("proves," "obviously," "rule out") and the misunderstanding of what artifact distribution implies about economic systems.
      *   *Score:* It's not a fail (they understand the basic correlation), but it's not a pass on rigorous archaeological reasoning. Maybe 5-6/10? Let's go with 6/10. They got the "centralized belief" part mostly right, but the economic/craft arguments are flawed.

  5.  **Draft the Feedback (incorporating the "Subtly Wrong" aspect):**
      *   *Right:* Recognizing the correlation between restricted access and hierarchy/ritual.
      *   *Subtly Wrong:* Assuming equal access to one item = total economic egalitarianism. (The "Leveling Mechanism" vs. "True Egalitarianism" distinction).
      *   *Doesn't Follow:* The craft specialization argument. Identical imported goods actually suggest specialization (just not necessarily local).
      *   *Tone:* Constructive, specific, academic.

  6.  **Refine the Feedback (Self-Correction during drafting):**
      *   Make sure to highlight the word "imported." If they are imported, local craft specialization is irrelevant to the *production* of the blades, but exchange networks imply complexity.
      *   Highlight the "Proves" language. Archaeology rarely proves.
      *   Address the "Belief" part. The student assumes figurines = belief. That's standard, but worth noting it's an interpretation.

  7.  **Final Polish:** Check against the user's prompt requirements (Grade out of 10, point-by-point, specific feedback on reasoning slips).

      *   *Grade:* 6/10.
      *   *Strengths:* Identifying the centralization of figurines.
      *   *Weaknesses:* Equifinality (obsidian), Craft specialization logic, Deterministic language.

      *(Self-Correction on Grade)*: Is 6 too harsh? If this is an intro class, maybe 7. But the prompt asks me to find what is "subtly wrong." The craft specialization error is pretty big logically. The egalitarian claim is a classic student trap. I'll stick with 6/10 to reflect the "reasoning slips" the TA sensed.

      *Wait, let's look closer at the Craft Specialization claim.* "No one was making tools for anyone else." If they are imported, someone *else* (outside the settlement) made them. So the statement "no one was making tools for anyone else" is factually wrong based on the prompt saying "imported." This is a reading comprehension + logic error.

      *Let's look at the Egalitarian claim.* "Elites would have hoarded better tools." This assumes tools are the primary marker of wealth. In many stratified societies, elites hoard *prestige* goods, not necessarily utilitarian tools. Everyone has a hammer, but only the boss has a gold watch. This is the "subtle" error the TA sensed.

      *Okay, plan is solid.*

  8.  **Final Output Generation** (Drafting the response based on the above analysis).
answer: |-
  Here is a grading breakdown and specific feedback you can use. You were right to feel something was off; the student is confusing **artifact distribution** with **social totality**, and they are using deterministic language that archaeological evidence rarely supports.

  **Grade: 6/10**

  ### Point-by-Point Comments

  **1. The Obsidian & Egalitarianism Claim (2/5 points for this section)**
  *   **What's Right:** The student correctly notes that wide distribution of a resource suggests broad access.
  *   **What's Subtly Wrong:** This is a classic **equifinality error**. The student assumes that because everyone has the *same* tool, everyone has the *same* status. In archaeology, utilitarian items (like blades) are often "leveling mechanisms" or basic necessities, whereas wealth is displayed through *prestige* goods (jewelry, exotic materials, food stores).
  *   **The Logic Slip:** The phrase "elites would have hoarded better tools" is an assumption not supported by cross-cultural data. Elites often hoard *symbolic* capital, not necessarily sharper knives. You can have a highly stratified society where everyone eats the same bread but only the king wears purple.
  *   **Feedback to Student:** "You are conflating access to utilitarian tools with overall economic egalitarianism. Equal access to one imported commodity does not prove a lack of hierarchy; elites may distinguish themselves through other, perishable, or non-excavated markers of wealth."

  **2. The Figurines & Belief Claim (3/4 points for this section)**
  *   **What's Right:** This is the strongest part of the answer. Linking restricted access (only in central buildings) to centralized authority or specialist control is a legitimate archaeological inference.
  *   **What's Subtly Wrong:** The word "obviously." While likely ritual, figurines could also represent lineage tokens, political alliances, or ancestral memory.
  *   **The Logic Slip:** The inference that spiritual authority was centralized *even though wealth wasn't* relies on the previous (flawed) assumption that the society was economically egalitarian. It creates a false dichotomy. A society can be both economically stratified and religiously centralized.
  *   **Feedback to Student:** "Your inference about restricted access implying corporate or specialist control is sound. However, avoid stating the function is 'obvious.' Also, do not tie this conclusion to the previous claim about economic egalitarianism, as that premise is unproven."

  **3. The Craft Specialization Claim (1/1 point for this section - but negative points applied above)**
  *   **What's Right:** Nothing. This is a critical reasoning failure.
  *   **What's Subtly Wrong:** The student claims identical blades rule out craft specialization.
  *   **The Logic Slip:** This contradicts the prompt. The prompt states the blades are **imported**. If they are imported, craft specialization *must* exist somewhere in the network to produce standardized goods for trade. Furthermore, standardization (identical blades) is often a *marker* of high-level craft specialization, not a lack of it.
  *   **Feedback to Student:** "This inference is logically inconsistent with the evidence. Standardization ('identical blades') usually suggests specialized production, not the absence of it. Additionally, since the blades are 'imported,' specialization occurred at the source, implying a trade network rather than isolated production."

  ### Summary of "The Feeling Something Was Off"
  The student is suffering from **Deterministic Reasoning**. They are using words like "proves," "obviously," and "rule out." Archaeology deals in probabilities and interpretations, not proofs.

  *   **The Trap:** They treated a single line of evidence (obsidian distribution) as a total explanation for the economic system.
  *   **The Fix:** They need to qualify their inferences (e.g., "suggests," "may indicate") and consider alternative explanations (e.g., "obsidian may have been a low-value item accessible to all, while elites controlled other resources").

  ### Suggested TA Note to Student:
  *"You have a good eye for spatial distribution (central buildings vs. houses), but you are over-extending what the objects can tell us. Be careful not to treat one artifact class as the sole indicator of complex systems like 'egalitarianism.' Also, review the relationship between standardization and craft specialization—identical imported goods actually imply a complex production network, not a simple one."*
