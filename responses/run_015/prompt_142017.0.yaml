  **Adversarial Collaboration Framework: Housing Authority Allocation**

  **Parties:** Formalist (F) vs. System Person (S)
  **Subject:** Automated Allocation of Supportive Housing (400 slots/3,000 applicants)

  **I. Agreed Premises**
  Both parties sign the following claims regarding the arithmetic, data, and limits of the current system:

  1.  **Arithmetic Constraint:** Given differing base rates across the two reported groups, we cannot simultaneously satisfy calibration within groups and equalized error rates (false positive/negative) using a single score threshold.
  2.  **Outcome Definition:** The target variable ("instability within 12 months") is not a ground truth for the applicant pool. It is only observed for those previously selected (approx. 15%).
  3.  **Selection Bias:** The vendor's score is trained on data conditioned on past allocation decisions. It predicts risk under the status quo policy, not necessarily risk under no intervention or alternative policies.
  4.  **Audit Scope:** An audit can verify mathematical compliance with a chosen metric on observed data. It cannot verify fairness regarding unobserved counterfactuals (e.g., outcomes for rejected applicants).
  5.  **Vendor Limitations:** The vendor cannot correct for selection bias without access to outcome data for rejected applicants, which the Agency currently does not collect.
  6.  **Budget Constraint:** The selection threshold is not fixed ex ante; it is determined by the fixed capacity (400 slots) relative to the score distribution each cycle.

  **II. Residual Disagreements**
  The following table isolates the normative and empirical bets remaining after accepting Section I.

  | Issue | Formalist Position | System Person Position | Real/Verbal | Crux | Concrete Test | Pre-registered Predictions |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. Dynamic Re-application** | Impossibility results hold per decision round. Budget-determined thresholds do not remove mathematical tension in any single cycle. | Clash dissolves over time. Six-month recomputation and re-application allow temporal smoothing of errors across groups. | Real | Is fairness a property of a single decision or a temporal process? | Simulate 5 years of cycles. Track cumulative allocation equity vs. per-cycle error parity. | **F:** Per-cycle disparity persists. **S:** Cumulative disparity converges to zero. |
  | **2. Differential Counterfactual Improvement (DCI)** | New problem wearing a hat. Requires estimating treatment effects (gain from flagging) which are unidentifiable from current data. | A way out. Shifts focus from prediction error to intervention impact, sidestepping static impossibility theorems. | Real | Can we optimize for impact without knowing counterfactuals? | Pilot random allocation of 50 slots to estimate gain conditional on score. | **F:** Estimates too noisy to allocate remaining slots fairly. **S:** Estimates sufficient to adjust threshold for equity. |
  | **3. Selective Labels** | Missing data problem. Use statistical correction (e.g., inverse propensity weighting) to approximate ground truth from observed data. | Structural feature. Correction assumes the model knows the selection mechanism; policy change is required to generate new data. | Verbal | Is bias a technical error or a policy feature? | Apply correction techniques to current data vs. collecting data on rejected applicants. | **F:** Correction reduces metric disparity. **S:** Correction masks structural exclusion. |
  | **4. The Deliverable** | Publish the chosen metric (e.g., equalized odds), acknowledge the sacrificed criterion, and audit compliance annually. | Publish the process design (re-application, monitoring), acknowledge metric limitations, and audit systemic outcomes over time. | Real | Is the goal transparency of trade-offs or legitimacy of process? | Review board approval based on static report vs. process charter. | **F:** Board rejects due to unmitigated bias. **S:** Board accepts due to adaptive governance. |

  **III. Closing Statement**
  This document isolates the mathematical certainties from the normative bets. The Formalist bets on the stability of arithmetic constraints; the System Person bets on the resilience of dynamic processes. The DCI proposal (Row 2) is the wildcard: if the pilot succeeds, the Formalist concedes the static frame is insufficient. If it fails, the System Person concedes that without counterfactuals, we return to picking criteria. Both agree that continuing to argue over static metrics without addressing the selective label problem is unproductive. The collaboration succeeds if the Agency adopts the pilot in Row 2 and the simulation in Row 1 before renewing the vendor contract.
