  # Seminar Sorting Tree: Virtue Ethics & The Situationist Critique

  This tree is designed to move participants from empirical commitments to philosophical positions without relying on jargon. It distinguishes between **settled empirical findings** (what the data says) and **contested philosophical interpretations** (what the data means for ethics).

  ### **Node 1: The Consistency Claim**
  **The Claim:** Social psychology experiments show that behavior varies significantly more across different situations than folk psychology expects. **[SETTLED FINDING]**
  **The Question:** Do you interpret this variation to mean that cross-situational consistency in behavior is effectively near-zero, making stable character traits an illusion? **[CONTESTED]**

  *   **YES:** Go to **Leaf A**.
  *   **NO:** (You believe some consistency exists) → Go to **Node 2**.

  ---

  ### **Node 2: The Scope Claim**
  **The Claim:** You have accepted that some behavioral consistency exists.
  **The Question:** If a person demonstrates courage in a military context but fails to show courage in a medical emergency, do they possess the virtue of "courage" simpliciter, or only "military-courage"? **[CONTESTED]**

  *   **GLOBAL:** (Same trait everywhere) → Go to **Node 3**.
  *   **LOCAL/ROLE-BOUND:** (Traits are segmented) → Go to **Node 3**.

  ---

  ### **Node 3: The Location Claim**
  **The Claim:** You have accepted that some form of trait (global or local) exists.
  **The Question:** Should we reconceive virtue altogether as distributed across social ecologies—not inside individual souls but in institutional patterns and relational structures? **[CONTESTED]**

  *   **NO:** (Virtue is inside the individual) → Go to **Leaf B** or **Leaf C**.
  *   **YES:** (Virtue is in the system) → Go to **Leaf D** or **Leaf E**.

  ---

  ### **The Leaves (Positions)**

  #### **Leaf A: Virtue Eliminativism (Hard Situationism)**
  *   **Path:** Node 1 (YES)
  *   **Core Commitment:** Because behavior is driven by situations, not internal traits, talk of "character" is scientifically inaccurate and ethically misleading.
  *   **Seminar Focus:** Moral responsibility without character; how to design situations rather than educate souls.

  #### **Leaf B: Globalist Virtue Ethics (Traditional Aristotelianism)**
  *   **Path:** Node 1 (NO) → Node 2 (GLOBAL) → Node 3 (NO)
  *   **Core Commitment:** Virtues are robust, unified dispositions that must manifest across diverse contexts to count as virtues.
  *   **Seminar Focus:** Defending the unity of virtues against empirical data; education as character formation.

  #### **Leaf C: Local Virtue Ethics (Fragmentationism)**
  *   **Path:** Node 1 (NO) → Node 2 (LOCAL) → Node 3 (NO)
  *   **Core Commitment:** Virtues exist but are narrow. Being honest-at-work is a real virtue even if one is dishonest-at-home. Moral praise is grounded in local dispositions. **[CONTESTED: Whether local traits deserve the name "virtue"]**
  *   **Seminar Focus:** Reconciling moral praise with psychological fragmentation; the value of niche virtues.

  #### **Leaf D: Ecological Virtue Theory (Distributed Virtue)**
  *   **Path:** Node 1 (NO) → Node 2 (LOCAL) → Node 3 (YES)
  *   **Core Commitment:** Virtue is not a property of the agent alone but of the agent-environment system. You cannot be "honest" without an institutional structure that supports honesty.
  *   **Seminar Focus:** Institutional design as moral cultivation; virtue as a relational property.

  #### **Leaf E: Unnamed (Global Ecological Virtue)**
  *   **Path:** Node 1 (NO) → Node 2 (GLOBAL) → Node 3 (YES)
  *   **Core Commitment:** Virtues are robust across all situations, but they are stored/distributed in the social ecology rather than the individual soul.
  *   **Status:** **Logical Gap / Theoretical.** This position is rarely defended because "global consistency" usually implies internal robustness. If virtue is distributed, it usually becomes context-sensitive (Local).
  *   **Seminar Focus:** Use this leaf to test coherence. Can a trait be both globally consistent and externally distributed?

  ---

  ### **Flagged Blurs & Overlaps**

  **1. Interactionism vs. Local Virtue Ethics (Leaf C)**
  *   **The Blur:** Interactionism (behavior = person × situation) is the psychological framework often used to support Local Virtue Ethics. However, a strong Interactionist might argue that if the "person" variable is too small, we slide back toward Eliminativism (Leaf A).
  *   **Seminar Note:** When discussing Leaf C, ask: "Is the 'local trait' still inside the person, or is it just a stable interaction pattern?" If the latter, it blurs into Leaf D.

  **2. Weak Ecological Views vs. Local Virtue Ethics (Leaf C vs. Leaf D)**
  *   **The Blur:** A Local Virtue Ethicist might admit that traits need environmental support to flourish. An Ecological Theorist might admit individuals still vary in their capacity to engage with structures.
  *   **Seminar Note:** The dividing line is **locus of moral praise**. If you praise the *person* for being honest-at-work, you are near Leaf C. If you praise the *workplace culture* for enabling honesty, you are near Leaf D.

  **3. Globalist Defenses vs. Local Realities (Leaf B vs. Leaf C)**
  *   **The Blur:** Some Globalists argue that apparent fragmentation is just a failure of virtue development, not evidence against global traits.
  *   **Seminar Note:** Ask: "Is the person who is brave only in war 'partially virtuous' (Leaf C) or 'virtuously impaired' (Leaf B)?" This distinguishes the metaphysical claim about what virtues *are*.

  ---

  ### **Instructional Note on Empirical Status**
  *   **Settled:** Human behavior varies by situation more than common sense predicts. (e.g., The Milgram and Good Samaritan experiments).
  *   **Contested:** Whether this variation eliminates traits entirely (Node 1); whether local traits suffice for moral evaluation (Node 2); whether virtue can exist outside the individual mind (Node 3).
  *   **Consensus Warning:** Do not present the "near-zero consistency" claim (Node 1) as scientific fact. It is a philosophical interpretation of the data. Many psychologists accept significant individual differences despite situational pressure.
