answer: |-
  You are actually much closer to Dennett's actual view than you realize, but your discomfort stems from trying to keep one verdict that doesn't fit the principle. Your rough principle is nearly correct, but it needs a slight adjustment to handle the stability issue you mentioned. The principle shouldn't depend on your specific brain power at a specific moment, but on the most efficient strategy available for predicting the system's behavior across a range of counterfactual scenarios.

  Here is the precise principle that unifies your cases: **Attribute beliefs when the intentional stance offers the most efficient, reliable predictive leverage over the system's behavior across varied contexts, regardless of the underlying mechanism.**

  Efficiency is key. You can predict a thermostat physically, but it's tedious. You can predict a chess computer via the design stance (code), but it's computationally impossible for you. The intentional stance ("it wants to protect its queen") cuts through the complexity. The reason you feel confident about the unmonitored system is that its behavior shifts based on a hidden variable (being watched). The physical or design stance would require tracing sensors and logic gates; the intentional stance ("it believes it is alone") captures the shift instantly.

  This principle forces you to drop one verdict: **The Chatbot/Paris case.** You currently say the chatbot doesn't believe Paris is the capital because it's just "training data." But consider your classmate. She believes neuroscience facts because they were in a textbook. She hasn't verified them personally; she ingested them from external data, just like the chatbot. If you attribute belief to her, you must attribute it to the chatbot, unless you are biological chauvinist. The origin of the information (weights vs. neurons) is a design-stance detail. If the system outputs "Paris" when asked, and uses that fact to answer related questions (e.g., "Is Paris in Germany?"), it is functioning as a believer. The fact that you know it's an LLM doesn't negate the predictive power of treating it as a believer. Your hesitation comes from thinking beliefs require "true understanding," but Dennett argues beliefs just require reliable patterns of rational behavior.

  This leads directly to your flip-flop case: **An AI confidently stating a false myth (e.g., humans use 10% of their brains).** Under this principle, the AI **does believe** the false claim. Truth is not a condition for belief attribution; people have false beliefs all the time. If the AI asserts the myth and uses it to make inferences (e.g., "we don't need to worry about cognitive load"), it is integrating that information into its behavioral network. The intentional stance predicts it will defend that claim or act on it. Denying it belief because the fact is false would require you to deny belief to any human who is misinformed.

  The debugging case supports this. When the chatbot defended the config file hypothesis against error messages, it was acting irrationally, but still intentionally. It had a belief (bug is in config) that conflicted with evidence. You predicted its behavior by assuming it was trying to maintain coherence with that belief. That is the intentional stance working perfectly, even on a false belief.

  So, your principle holds, but it demands consistency. You cannot say the classmate believes textbook facts while the chatbot doesn't. Both are inheriting information from an external source and using it to guide output. If the chatbot's behavior is sufficiently flexible—answering questions, debugging, planning—then the "training data" objection is just a design-stance distraction. The pattern is real.

  To summarize: Keep your intuition about the thermostat (too simple) and the unmonitored system (rich intentional profile). Drop the distinction between the classmate and the Paris chatbot. Accept that systems can believe falsehoods if they act on them. This makes your position robust: belief isn't about what's inside the box, but about how reliably you can predict the box's behavior by treating it as a rational agent.
