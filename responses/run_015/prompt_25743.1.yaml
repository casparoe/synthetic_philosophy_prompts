prompt: |-
  So my reading group has been stuck on the same argument for like two months. Half of us are drawn to Scanlon-style contractualism — wrongness is about principles no one could reasonably reject, and the test is supposed to be pairwise: you compare the strength of one person's complaint against another's, not the number of complaints. The other half think this can't possibly work, because it seems to rule out aggregation. Like, if you have to choose between saving one person from a horrible death and saving a thousand people from losing a finger, the Scanlonian seems stuck saying "each of the thousand has a weaker claim than the one, so it's not obvious we should save the thousand." That just sounds deranged to the aggregation side.

  We want to stop going in circles and actually figure out where the real disagreements are. So here's what I want you to write: the document that would come out of a serious adversarial collaboration between a committed Scanlonian contractualist and a committed aggregation-friendly consequentialist (or whatever label fits — someone who thinks the numbers count directly in moral reasoning).

  The document should include:

  1. A numbered list of claims both sides can sign. Stuff about what the problem is, what's at stake, what constraints any adequate view has to satisfy. Not just "we both agree suffering is bad" — make it substantive.

  2. A disagreements table where each row states a precise point of disagreement, worded so each side would accept the formulation of it's own position. The Scanlonian's view should be stated in terms a Scanlonian would nod along with, and same for the aggregation person.

  3. The cruxes — the sub-questions where, if you settled them, at least one side would update. I'm guessing one crux is whether reasonable rejection is fundamentally pairwise or whether it can consider the aggregate weight of many individual claims. Another might be something about what makes a complaint "stronger" in the first place — is it just the size of the harm to that person, or does it matter how the harm compares to what others are facing?

  4. For each crux, give at least one concrete case or line of reasoning that both sides agree bears on it, with each side's prediction or judgement recorded. Don't just describe the case — have each side go on record about what they think the right answer is and why they're opponent gets it wrong.

  If you find that part of their disagreement is actually verbal — like they're using "reasonable rejection" to mean different things — say so and explain. But don't paper over genuine disagreement just to make things tidy. The point is to figure out what's left once you strip away the talking-past-each-other stuff.
reasoning: |-
  Here's a thinking process that leads to the suggested document:

  1.  **Analyze the Request:**
      *   **Context:** A reading group stuck on the Scanlonian Contractualism vs. Aggregation (Consequentialism/Aggregativism) debate for two months.
      *   **Core Conflict:** Scanlon's pairwise comparison (individual complaints) vs. Aggregation (summing up harms/benefits). The classic example is "One Life vs. Thousand Fingers."
      *   **Task:** Create a document resulting from a "serious adversarial collaboration."
      *   **Required Components:**
          1.  Numbered list of shared claims (substantive, not trivial).
          2.  Disagreements table (precise formulations acceptable to both sides).
          3.  Cruxes (sub-questions where settlement leads to updates).
          4.  Concrete cases/reasoning for each crux (with each side's specific judgment/prediction).
      *   **Tone:** Philosophical, precise, charitable but firm, avoiding verbal disputes while highlighting genuine normative divides.

  2.  **Deconstruct the Philosophical Positions:**
      *   **Scanlonian Contractualism:**
          *   Core Idea: An act is wrong if it violates principles no one could reasonably reject.
          *   Methodology: Pairwise comparison of complaints. We compare the strongest complaint *against* the principle with the strongest complaint *for* it.
          *   Motivation: Respect for individual separateness. No one should be sacrificed merely as a means to the greater good.
          *   Problem Case: The "Numbers Problem" (Taurek). If complaints are pairwise, why save the many? Scanlon tries to solve this via "generic reasons" or "probability," but critics say it's ad hoc.
      *   **Aggregationist (Consequentialist/Utilitarian leanings):**
          *   Core Idea: Moral rightness depends on the outcome, specifically the sum total of well-being/harm.
          *   Methodology: Summing harms/benefits across individuals.
          *   Motivation: Minimizing total suffering/maximizing total good. It seems irrational to let 1,000 suffer to save 1 if the total suffering is greater in the latter.
          *   Problem Case: "The Transplant." Killing 1 healthy person to save 5 via organ harvest. Aggregation seems to demand this, which violates rights/separateness.

  3.  **Drafting Section 1: Shared Claims (Common Ground):**
      *   Need to avoid trivialities ("suffering is bad").
      *   Need substantive methodological agreements.
      *   *Idea 1:* Individual standing matters. Both care about individuals, just differently.
      *   *Idea 2:* Impartiality. Neither side thinks the agent's personal preference decides.
      *   *Idea 3:* The burden of proof. Both agree the "One vs. Many" case is a stress test.
      *   *Idea 4:* Rights/Constraints. Both want to avoid the "Transplant" intuition (usually). Scanlon explicitly does; sophisticated aggregators often build in constraints.
      *   *Refinement:* Let's focus on the structure of justification. Both agree morality requires justification to others. Both agree harm provides reasons.

  4.  **Drafting Section 2: Disagreements Table:**
      *   Needs to be precise.
      *   *Row 1: The Unit of Moral Accounting.* Scanlon: The individual complaint. Aggregator: The total state of affairs.
      *   *Row 2: The Role of Numbers.* Scanlon: Numbers matter only insofar as they affect the *strength* of a generic reason or probability of being the victim. Aggregator: Numbers matter directly as multipliers of value.
      *   *Row 3: The Source of Wrongness.* Scanlon: Rejectability of a principle to a specific person. Aggregator: Sub-optimality of the outcome.
      *   *Row 4: The "One vs. Thousand Fingers" Case.* Scanlon: Needs a nuanced explanation (maybe probability). Aggregator: Straightforward math.

  5.  **Drafting Section 3 & 4: Cruxes and Concrete Cases:**
      *   *Crux 1: The Nature of "Reasonable Rejection".* Can a group's collective burden count as a single reason for rejection?
          *   *Case:* The "Queue" case. 1 person loses a leg vs. 1000 people lose a toe.
          *   *Scanlon:* Each toe-loser has a weak claim. The leg-loser has a strong claim. Pairwise, leg wins.
          *   *Aggregator:* 1000 toes > 1 leg.
      *   *Crux 2: The "Tie-Breaker" Mechanism.* If complaints are equal, do numbers break the tie?
          *   *Case:* 1 person dies vs. 1 person dies. Add 1000 people with headaches.
          *   *Scanlon:* (Traditional) Numbers don't break ties of death. (Revised) Maybe they do via "generic reasons."
          *   *Aggregator:* Obviously save the 1 + 1000 headaches.
      *   *Crux 3: Separateness of Persons.* Is it a metaphysical constraint or a heuristic?
          *   *Case:* The Transplant (Killing 1 to save 5).
          *   *Scanlon:* Forbidden. Violates the individual's veto.
          *   *Aggregator:* Forbidden (usually), but because of long-term rules/trust, not metaphysical impossibility of summing.
      *   *Selection:* Let's pick the strongest philosophical cruxes.
          1.  *Aggregation of Claims:* Can distinct individual complaints merge into a single heavier complaint?
          2.  *The Relevance of Identity:* Does it matter *who* suffers, or just *that* suffering occurs?
          3.  *The Threshold of Rejection:* Is there a point where small harms aggregate to outweigh a large harm?

      *   *Refining the "Concrete Case" requirement:* I need specific scenarios where they predict different outcomes or justify them differently.
      *   *Case A: The Burning Building (Standard).* 1 vs 5. Scanlon has a "tie-breaking" account. Aggregator has a "sum" account.
      *   *Case B: The Finger vs. Life (The User's Example).* This is the hard one.
      *   *Case C: The Risk Case.* Ex-ante vs Ex-post.

      *   *Decision:* Let's focus on the "Finger vs. Life" case and a "Risk/Probability" case, as these highlight the pairwise vs. aggregate distinction best.

  6.  **Review and Refine:**
      *   *Check Tone:* Is it too dry? Too academic? Needs to be readable for a reading group.
      *   *Check Constraints:* Did I include the numbered list? The table? The cruxes? The specific predictions?
      *   *Philosophical Accuracy:* Ensure Scanlon's actual views (from *What We Owe to Each Other*) are represented fairly, not just the strawman. Scanlon *does* try to save the numbers via "generic reasons" and probability. I need to make sure the "Committed Scanlonian" isn't a Taurek-style nihilist about numbers, but someone who insists on the *structure* of pairwise comparison.
      *   *Correction:* A sophisticated Scanlonian argues that in the "One vs. Many" death case, the principle "save the greater number" is one no one could reasonably reject because, ex-ante, everyone has a reason to want that rule. The hard case is "Life vs. Finger." I need to make sure the document reflects the difficulty of the "Life vs. Finger" case specifically, as that's the user's prompt.

  7.  **Final Polish:**
      *   Ensure the "Disagreements Table" clearly contrasts the *mechanism* of decision, not just the outcome (since outcomes often align in easy cases).
      *   Make sure the "Cruxes" identify *why* they disagree, not just *that* they disagree.
      *   Add a section on "Verbal vs. Substantive" as requested.

  8.  *(Self-Correction during drafting)*: I need to be careful not to make the Scanlonian look like they *must* save the one person in the Life vs. Fingers case. Scanlonians struggle here. Some admit the aggregation might be necessary for small harms. I will represent the "Hardline Scanlonian" vs. "Moderate Scanlonian" tension within the shared claims or cruxes. Actually, the prompt asks for a "Committed Scanlonian." I will stick to the pairwise constraint as the defining feature, acknowledging the tension it creates.

      *Wait, one nuance:* Scanlon's later work (*Being Realistic About Reasons*) and responses to critics (like Otsuka) refine the "pairwise" view. The "Hybrid View" is a thing. But for the sake of a clear adversarial collaboration, I should contrast the *pure* pairwise view against the *pure* aggregative view to find the crux. I will note where the Scanlonian might need to compromise.

      *Let's structure the "Cruxes" around the mechanism of justification.*
      Crux 1: The Unit of Comparison (Individual vs. Aggregate).
      Crux 2: The Role of Ex-Ante Probability (Can we use risk to justify saving the many?).
      Crux 3: The Threshold Question (Is there a point where small harms sum to beat a big harm?).

      *Okay, ready to write.*
answer: |-
  # ADVERSARIAL COLLABORATION MEMORANDUM
  **Subject:** The Structure of Moral Justification: Pairwise Comparison vs. Aggregation  
  **Participants:**  
  *   **Party A (Contractualist):** Committed to T.M. Scanlon's framework (*What We Owe to Each Other*). Wrongness is determined by principles no one could reasonably reject. Justification requires pairwise comparison of individual complaints.  
  *   **Party B (Aggregationist):** Committed to the view that moral rightness is determined by the optimality of outcomes, where the moral weight of harms/benefits sums across individuals. Numbers count directly.  
  **Date:** October 26, 2023  
  **Status:** **Impasse Identified** (Substantive disagreement isolated from verbal confusion)

  ---

  ## 1. SHARED COMMITMENTS
  *Both parties agree to the following substantive claims. These are not merely definitions, but normative constraints any acceptable theory must satisfy.*

  1.  **The Separateness of Persons is Morally Relevant:** Both sides agree that morality is not simply about maximizing a "social good" in a way that treats society as a single super-person. Individuals are distinct entities to whom justification is owed. (Disagreement exists on *how* this relevance constrains action, not *that* it is relevant).
  2.  **Impartiality Requirement:** The identity of the individuals involved (name, relationship to agent, social status) is irrelevant unless it bears on the strength of their complaint or the magnitude of the harm.
  3.  **Harm Provides Pro Tanto Reasons:** Both sides agree that suffering, death, and loss of opportunity provide genuine moral reasons against an action. Neither side believes these reasons are illusory.
  4.  **The "Transplant" Constraint:** Both sides agree that a moral theory should, in standard circumstances, forbid killing one healthy person to harvest organs to save five others, even if the math favors the five. (Party B justifies this via rule-consequentialist or rights-based side-constraints; Party A via the veto power of reasonable rejection).
  5.  **The Burden of Proof:** Both sides agree that the "One Life vs. Thousand Fingers" case is a stress test. If a theory yields a verdict that violates deep considered judgments here, the theory requires revision or sophisticated defense.
  6.  **Justification Must Be Public:** Moral principles must be justifiable to the people governed by them. We cannot rely on esoteric knowledge available only to the moral expert.

  ---

  ## 2. DISAGREEMENTS TABLE
  *Precise formulation of the divergence. Each side accepts the wording in their column as an accurate description of their view.*

  | Feature of Moral Reasoning | Party A (Contractualist) Position | Party B (Aggregationist) Position |
  | :--- | :--- | :--- |
  | **The Unit of Accounting** | The **Individual Complaint**. Moral reasoning compares the strength of one person's reason to reject a principle against another person's reason to accept it. | The **Total State of Affairs**. Moral reasoning sums the moral weight of all affected interests to determine the net value of an outcome. |
  | **The Role of Numbers** | Numbers are **derivative**. They matter only insofar as they affect the *probability* of being the victim (ex-ante) or the *generic strength* of a reason. They do not aggregate weight ex-post. | Numbers are **fundamental**. The fact that *N* people suffer adds weight *N* times to the reason to prevent that suffering. |
  | **Structure of Comparison** | **Pairwise.** We ask: "Can Person X reasonably reject this principle given that Person Y would suffer if they didn't?" We do not sum Person Y + Z + W against Person X. | **Global.** We ask: "Which option results in the least total weighted harm?" We compare the sum of all complaints in Outcome 1 against the sum in Outcome 2. |
  | **Source of Wrongness** | Wrongness is **relational**. An act is wrong because it violates a duty *to* a specific person who could reasonably reject the principle permitting it. | Wrongness is **impersonal**. An act is wrong because it fails to bring about the best available state of affairs (even if it violates a duty, the duty is grounded in the outcome). |
  | **The "Finger vs. Life" Case** | **Problematic.** A strict pairwise view struggles to explain why the thousand finger-losers win, as no single finger-loser has a claim stronger than the life-loser. | **Straightforward.** The aggregated loss of 1,000 fingers outweighs the loss of 1 life, assuming the utility calculus supports it. |

  ---

  ## 3. CRUXES & CONCRETE TEST CASES
  *These are the specific sub-questions where settlement would force at least one side to update their view. We have recorded specific predictions for each.*

  ### Crux 1: The "Merging" of Claims
  **Question:** Can distinct individual complaints of the *same type* merge to form a single, heavier complaint in a pairwise comparison, or must they remain distinct individual vectors?

  *   **Why it matters:** If claims can merge, Contractualism collapses into a form of Aggregation. If they cannot, Aggregationists argue Contractualism is irrational.
  *   **Test Case: The Queue.**
      *   *Scenario:* A trolley is heading toward a track where it will crush **Alice's leg** (permanent disability). You can switch the trolley to a track where it will crush the **toes of 1,000 different people** (painful, temporary disability, no permanent loss).
      *   *Constraint:* You cannot switch the trolley to a side track that hits no one. It is strictly Alice's Leg vs. 1,000 Sets of Toes.

  | Party | Judgment & Reasoning |
  | :--- | :--- |
  | **Party A (Contractualist)** | **Judgment:** Save Alice (The Leg). <br>**Reasoning:** We compare the strongest complaint on each side. Alice's complaint ("I lose my leg") is stronger than *any single* toe-loser's complaint ("I lose some toes"). Since comparison is pairwise, the stronger individual complaint wins. The number of toe-losers does not increase the *strength* of the individual complaint against the principle. <br>**Critique of B:** You are treating the 1,000 as a blob. You are sacrificing Alice to the "greater good" of the toes, violating her standing as an individual. |
  | **Party B (Aggregationist)** | **Judgment:** Save the 1,000 (The Toes). <br>**Reasoning:** 1,000 painful injuries constitute more total suffering than one permanent leg loss (assuming utility calculus supports this). To ignore the 999 extra people is to treat their suffering as morally zero. <br>**Critique of A:** Your view implies that if we added a million toe-losers, you'd still save the leg. That is fetishizing the "pairwise structure" over actual human welfare. |

  ### Crux 2: Ex-Ante Probability vs. Ex-Post Harm
  **Question:** Can we justify saving the many by appealing to the *ex-ante* probability of being the victim, rather than the *ex-post* aggregation of harm? (This is Scanlon's primary defense against the Numbers Problem).

  *   **Why it matters:** If this works, Contractualism can save the many in "Life vs. Life" cases without aggregating. If it fails in "Life vs. Finger" cases, the view is limited.
  *   **Test Case: The Burning Building (Modified).**
      *   *Scenario:* A building is on fire. You have time to save only one group.
      *   *Option 1:* Save **Group A** (1 person), who will certainly die otherwise.
      *   *Option 2:* Save **Group B** (100 people), who will certainly die otherwise.
      *   *Variation:* Now change Group B to 100 people who will each lose a **finger**. Group A is still 1 person who will **die**.

  | Party | Judgment & Reasoning |
  | :--- | :--- |
  | **Party A (Contractualist)** | **Judgment:** Save the 1 Life (Group A) in the Variation. <br>**Reasoning:** In the Life vs. Life case, I can argue that a principle "save the greater number" is one no one could reject *ex-ante*, because everyone has an equal interest in not dying, so maximizing survival probability is rational for all. <br>**However,** in Life vs. Finger, the *strength* of the generic reason matters. A reason to avoid death is categorically stronger than a reason to avoid losing a finger. Probability cannot bridge a categorical gap in harm severity. <br>**Critique of B:** You justify killing the one life by summing fingers. That makes the value of a life contingent on how many fingers are at stake. |
  | **Party B (Aggregationist)** | **Judgment:** Save the 100 Fingers (Group B) *if* the aggregated utility of 100 fingers exceeds 1 life. <br>**Reasoning:** The *ex-ante* argument is a proxy for aggregation. You only care about probability because you care about the expected value of survival. If the expected value of 100 fingers outweighs 1 life, the *ex-ante* argument should also favor the fingers. If you deny this, your *ex-ante* defense is ad hoc. <br>**Critique of A:** You are using probability to smuggle in numbers when it suits you (Life vs. Life) but rejecting it when it doesn't (Life vs. Finger). |

  ### Crux 3: The Threshold of Rejection
  **Question:** Is there a threshold of harm where the *number* of victims suddenly makes a principle rejectable, even if individual complaints are weak? (i.e., Is there a "tipping point"?)

  *   **Why it matters:** This tests whether Contractualism can accommodate "soft aggregation."
  *   **Test Case: The Noise.**
      *   *Scenario:* A factory provides essential medicine (saving 1 life). The factory noise causes a **mild headache** to nearby residents.
      *   *Variation 1:* 10 residents get headaches.
      *   *Variation 2:* 1,000,000 residents get headaches.
      *   *Question:* At what point can the residents reasonably reject the principle allowing the factory to operate?

  | Party | Judgment & Reasoning |
  | :--- | :--- |
  | **Party A (Contractualist)** | **Judgment:** There is a threshold, but it is not strictly mathematical. <br>**Reasoning:** A principle that imposes massive aggregate burden on others for a small gain to one can be rejected. However, the rejection is not based on *summing* the headaches. It is based on the principle being "unreasonable" given the distribution of burden. <br>**Critique of B:** You think there is a precise number where 1 Life = N Headaches. I think morality is about reasonable relations, not calculus. |
  | **Party B (Aggregationist)** | **Judgment:** There is a precise (in principle) trade-off rate. <br>**Reasoning:** If 1 million headaches cause more total suffering than 1 death, the factory should close (or compensate). If you admit a threshold, you are admitting aggregation matters. If you deny it, you are saying 1 million headaches don't matter more than 10. <br>**Critique of A:** "Unreasonable" is just a placeholder for "sub-optimal outcome." You are aggregating but refusing to call it that. |

  ---

  ## 4. DIAGNOSIS: VERBAL VS. SUBSTANTIVE

  After two months of collaboration, we conclude the following:

  **1. Verbal Disagreement Resolved:**
  We are not simply using "reasonable rejection" to mean different things. Party A is not secretly aggregating. Party A genuinely believes the *structure* of justification (individual veto) is more important than the *outcome* (total harm). Party B understands this but rejects the priority.

  **2. Substantive Disagreement Isolated:**
  The core disagreement is **Meta-Ethical**, not just Normative.
  *   **Party A** believes morality is fundamentally about **Relations** (How I stand to you).
  *   **Party B** believes morality is fundamentally about **States of Affairs** (How the world is).

  **3. The "Life vs. Finger" Impasse:**
  We cannot resolve the "One Life vs. Thousand Fingers" case without one side abandoning their core mechanism.
  *   If Party A concedes that 1,000 fingers outweigh 1 life *because there are 1,000 of them*, they abandon pairwise comparison.
  *   If Party B concedes that 1,000 fingers do *not* outweigh 1 life regardless of the total suffering, they abandon direct aggregation.

  **4. Recommendation for the Reading Group:**
  Stop trying to force the cases to match. The disagreement is not about *what* to do in the Burning Building (both might save the many there); the disagreement is about *why*.
  *   **Next Step:** Investigate **"Hybrid Views"** (e.g., Derek Parfit's *On What Matters* Vol. 1, or Elizabeth Harman's work). These views attempt to keep the Contractualist focus on individuals while allowing aggregation for "sufficiently small" harms. The crux for your group should be: **Is a Hybrid View stable, or does it collapse into one of the two pure views?**

  ---
  **Signed,**  
  *The Contractualist Representative*  
  *The Aggregationist Representative*
