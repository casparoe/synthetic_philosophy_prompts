answer: |-
  Elara has mastered every physical fact concerning colour vision: wavelength reflectance, cone-cell excitation, and neural processing pathways. She is not blind, but she lives with a rare congenital deficit analogous to prosopagnosia restricted to colour qualia: while her eyes register wavelengths normally, her brain cannot consolidate these sensations into lasting mental images or recognitional templates, rendering her unable to imagine colours in advance or identify and recall them after exposure. When she steps into a garden and stands before a red rose, she cannot picture this moment in advance, nor will she be able to pick out this shade from a lineup later or summon the image tonight, yet staring at the petals, she pauses, her attention locked on the flower in a way it never was while reading the texts.

  **Note on Scope:** Restricting Elara's prior knowledge to colour vision rather than all physical facts helps the physicalist verdicts (Self-Locating, Ability, PCS) by reducing the explanatory burden, but it weakens the Knowledge Argument's general conclusion, as one could argue she simply lacked specific physical facts about her own brain state rather than non-physical facts.

  **The Ability Hypothesis**
  This view is forced to say she gains nothing new, or it must stretch the definition of "ability" until it breaks. By stipulation, Elara gains no durable abilities: she cannot imagine, recognize, or remember the experience. If the theorist insists she learns nothing, they contradict the strong intuition that her attentional shift indicates new information. If they argue she gains the "ability to have the experience," they are relabeling the occurrence of a state as a skill, which dissolves the distinction between knowing-how and knowing-that and stops doing explanatory work.

  **The Phenomenal-Concept Strategy**
  This view comes out worse here than in the standard case. Normally, Mary gains a recognitional concept ("this is red") she can reuse. Elara cannot form this; her deficit blocks durable recognitional templates. The defender must either claim she acquires a one-off demonstrative concept ("this experience now")—which argues against it being a robust concept—or concede that the gain is purely self-locating. This leaves the strategy with no stable conceptual ground to stand on, forcing it to collapse into the self-locating diagnosis.

  **The Self-Locating Diagnosis**
  This gets the clean verdict. Elara gains a new fact, but it is a *centered* fact: "I am instantiating physical state P *now*." Her prior knowledge was complete regarding *uncentered* physical facts (e.g., "State P occurs in humans under wavelength W"), but uncentered descriptions do not specify which state the subject is currently occupying. Physicalism survives because centered facts are still physical facts about the subject's relation to the world; she didn't need new physics, she needed to locate herself within the physics she already knew.

  **The Knowledge Argument**
  This retains the full intuition that Elara learns something, but it requires an extra premise to reach non-physicalism: "If physicalism is true, all knowable facts are uncentered physical facts." The physicalist denies this premise, arguing that indexical or centered facts (like "I am here now") are compatible with a purely physical ontology. The argument succeeds in showing a gap in Elara's knowledge, but fails to prove that the gap is non-physical rather than merely perspectival.

  **Key Feature Analysis**
  The single feature doing the work is the **stipulated inability to form durable recognitional concepts or memories** (the agnosia-like deficit). If you remove this, Elara can remember and recognize colors later; the Phenomenal-Concept Strategy immediately becomes viable (she gains a recognitional concept), and the Ability Hypothesis looks plausible (she gains abilities to recognize/imagine), collapsing the case back into the usual stalemate where physicalist responses appear equally strong. The strongest escape an ability theorist has is to argue she gains the **ability to process visual data in an analog format for immediate behavioral guidance**, even without memory. They would claim her attentional lock is a form of non-propositional processing capacity. However, this struggles because her physical knowledge already covered how such processing works; the intuition remains that she gained *information* about her current state, not just a processing mode.
