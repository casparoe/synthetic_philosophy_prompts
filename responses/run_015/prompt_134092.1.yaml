answer: |-
  **MEMORANDUM**

  **TO:** State History Day Committee
  **FROM:** [Your Name], Student Member
  **DATE:** October 23, 2023
  **SUBJECT:** Recommendation regarding Entry #402, "Mothers of Stone"

  **Recommendation**
  I recommend we **accept the exhibit on stated conditions** with a seven-day deadline. The student must add a section explicitly addressing the strongest conventional counter-evidence on its merits, rather than attributing it to scholar bias or inertia. She need not change her conclusion, but she must demonstrate how her argument withstands opposing data without relying on conspiracy.

  **Reasoning**
  This decision balances our duty to encourage inquiry with our responsibility to uphold historical method. We are judging how she builds her case, not the verdict itself. If we disqualify based on conclusion, we become enforcers of consensus rather than teachers of method. However, history requires claims to be testable. Currently, her project employs an "immunity structure": missing evidence is treated as proof of a cover-up, and opposing experts are dismissed as complicit. This makes her argument unfalsifiable, meaning no evidence could ever prove her wrong. Our condition requires her to define what evidence *would* change her mind.

  Regarding the precedent of nineteenth-century amateurs who discovered sites scholars called legend: they succeeded because they produced new physical evidence, not because they demanded we ignore existing dating methods. We must distinguish between challenging consensus with data versus challenging it with suspicion.

  Some worry that allowing this lends the school's name to fringe theories. We mitigate this by clarifying that participation recognizes effort and method, not institutional endorsement of truth. Others suggested requiring her to reframe the project as a study of *why* people believe in lost civilizations. While valid, that changes her question rather than improving her answer. We should challenge her to meet historical standards, not retreat to safer ground. Finally, this standard ensures consistency; a project with a conclusion we sympathize with must also meet the same burden of evidence. We cannot allow thin evidence simply because we like the story.

  **General Rule for Future Committees**
  Entries must demonstrate engagement with significant opposing evidence and avoid explanations that rely on the bad faith or coordinated error of specialists. A historical argument must specify what evidence would contradict it; claims that treat all disagreement as proof of conspiracy do not meet the requirement for evidentiary support.

  **Statement to the Student**
  "We voted to allow your exhibit to compete, because we believe you have the right to make bold arguments. However, history requires us to test our ideas against evidence that might prove us wrong. Currently, your project explains away all opposing data as bias. To meet our standards, you must add a section that engages with the strongest counter-arguments on their merits, showing why your interpretation holds up even if scholars are acting in good faith. We want you to win on the strength of your method, not by shielding your conclusion from scrutiny."

  **Handbook Revision**
  "Entries must demonstrate how the student evaluated opposing evidence and must not rely on assumptions of specialist complicity to explain away contradictions."
