answer: |-
  ### Exam Question: Philosophy of Mind (Final Seminar)
  **Time Allowed:** 60 Minutes
  **Format:** Closed Book
  **Instructions:** Answer the question below. Be precise. You are not being tested on memory of authors, but on your ability to deploy conceptual distinctions under pressure.

  **The Vignettes:**

  > **Case A (Classic Asymbolia):** Patient K suffers a pinprick. She correctly identifies the location and intensity ("sharp, right there, level 8"). She smiles and continues reading. She reports, "It feels like pain, but it doesn't bother me." She exhibits no withdrawal reflexes and seeks no analgesia.
  >
  > **Case B (Motivational Apathy):** Patient M suffers a pinprick. She grimaces and says, "This is awful, I hate this, please make it stop." She rates the unpleasantness as extreme. However, she makes no move to withdraw her hand. When offered analgesia, she acknowledges she wants the feeling to cease but makes no effort to take the pill, appearing entirely unmoved to *act* on her desire.

  **The Prompt:**
  Evaluate how Case A and Case B respectively threaten the following three theories of pain: (1) that badness is an intrinsic feature of pain's phenomenal character; (2) that unpleasantness consists essentially in a desire for the experience to cease; and (3) that pain is essentially motivational (e.g., an imperative to act).

  In your analysis, address the "Harder Move": Is it coherent to assume the sensory character remains fixed in Case A while stripping the affect, or does the affect partly constitute the character? Finally, determine whether asking "But is Case B still *pain*?" is a substantive metaphysical question or merely a verbal dispute.

  ***

  ### Model Answer

  The two vignettes function as pincers against reductive accounts of pain, but they do not land equally on all theories. Case A (Asymbolia) is the traditional wedge used to separate the sensory-discriminative dimension from the affective-motivational. Case B (Motivational Apathy) is the more philosophically volatile mirror image, dissociating affective evaluation from behavioral motivation.

  Against Theory 1 (Intrinsic Badness), Case A is devastating. If pain's badness were an intrinsic, inseparable property of the phenomenal character (like the redness of a red afterimage), Patient K could not experience the sensation without minding it. Her report suggests badness is extrinsic or separable. However, Case B leaves Theory 1 intact; Patient M finds the experience awful, consistent with intrinsic badness, even if she fails to act.

  Against Theory 2 (Desire-Based), Case B is the primary threat. If unpleasantness *just is* a desire for the experience to cease, Patient M is a contradiction in terms. She reports the desire ("I want this to stop") but lacks the functional profile of that desire (trying to stop it). If a desire does not motivate, is it a desire? Case A is less problematic for Theory 2; K simply lacks the desire, hence lacks the unpleasantness, leaving only "sensation."

  Against Theory 3 (Essential Motivation/Imperativism), both cases are problematic but in different ways. Imperativism claims pain is an experience with the content "Protect this body part!" Case A shows the command can be ignored or absent while sensation remains. Case B is worse: it suggests one can acknowledge the command's urgency ("This is awful") without the command generating action. If pain is essentially a command, Case B suggests a breakdown in the practical rationality of the subject, or it suggests pain is not essentially motivational.

  This leads to the "Harder Move." Proponents of Theory 1 often argue Case A is possible because sensory character is fixed. But this assumes a modular view of phenomenology. If affective tone partly *constitutes* the sensory character (as some representationalists argue), then K is not feeling "pain minus badness"; she is feeling a different sensation entirely (perhaps "tingling" mislabeled as pain). To assume the sensory character stays fixed while affect is stripped is to beg the question against theories where phenomenology is holistic. If affect constitutes character, Case A is not a dissociation of properties but a change in kind.

  Finally, is asking "Is Case B still pain?" substantive or verbal? It is substantive. If we treat it as merely verbal, we assume we already possess a settled concept of pain waiting to be defined. But these cases reveal our concept is a cluster of phenomenology, function, and evaluation. Deciding whether M is in pain determines whether we prioritize first-person report (phenomenology) or third-person observation (function). If we say M is not in pain despite her reports, we are making a metaphysical claim about the nature of mental states: that they are individuated by their causal roles, not just their qualitative feel. Thus, the question forces a choice between phenomenological realism and functionalism. It is not a dispute about how to use the word "pain," but a dispute about what kind of natural kind pain is.

  In conclusion, Case A threatens the intrinsic link between sensation and badness; Case B threatens the link between badness and motivation. Accepting the coherence of both cases pushes us toward a pluralistic view where pain is not a natural kind with a single essence, but a cluster concept where dissociation reveals the seams in our folk psychology.

  ***

  ### Marking Scheme (Total: 20 Marks)

  **1. Analysis of Case A vs. Intrinsic Badness (4 Marks)**
  *   **Full Marks:** Clearly explains that Case A threatens the idea that badness is inseparable from sensation. Notes that K feels the sensation without the suffering.
  *   **Common Screw-up:** Students simply state "A shows sensation and emotion are separate" without linking it specifically to the *intrinsic badness* theory. They treat "emotion" and "badness" as synonyms without philosophical precision.

  **2. Analysis of Case B vs. Desire/Motivation Theories (4 Marks)**
  *   **Full Marks:** Identifies that Case B specifically targets the link between *unpleasantness* and *motivation/desire*. Notes the paradox of wanting cessation without acting.
  *   **Common Screw-up:** Students treat Case B as identical to Case A. They fail to see that M *does* mind the pain (unlike K), which saves Intrinsic Badness theories but kills Motivational theories.

  **3. The "Harder Move" (Constitution of Character) (4 Marks)**
  *   **Full Marks:** Challenges the assumption that sensory character can remain fixed. Argues that if affect constitutes phenomenology, Case A might be describing a different sensation entirely.
  *   **Common Screw-up:** Students accept the vignette at face value. They assume K is definitely feeling "pain" just less of it, missing the prompt's hint about the constitution of phenomenal character.

  **4. Substantive vs. Verbal Dispute (4 Marks)**
  *   **Full Marks:** Argues the question is substantive. Explains that the answer depends on metaphysical commitments (functionalism vs. phenomenal realism) rather than dictionary definitions.
  *   **Common Screw-up:** Students dismiss it as "just semantics" or "verbal." They fail to recognize that defining the boundaries of pain is a philosophical task regarding mental state individuation.

  **5. Synthesis and Coherence (4 Marks)**
  *   **Full Marks:** The essay flows logically. The conclusion ties the dissociation cases to the broader implication (e.g., pluralism or cluster concepts). No internal contradictions.
  *   **Common Screw-up:** The essay is a list of disconnected points. The conclusion introduces new ideas or contradicts the analysis of Case B (e.g., claiming M proves pain is intrinsic after arguing motivation is essential).
