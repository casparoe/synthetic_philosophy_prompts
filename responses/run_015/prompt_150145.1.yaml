  When I worked as an electrician, I learned that the most important parts of the job are the ones you never see. Inside the walls, the wires carry the load. If you leave them exposed, people get nervous. They want to see the switch, the light, the clean finish. I think about that when I look at the great courtrooms of history. I see the finished room. But I also see the wiring behind the wall. I see men in judges' robes knowing they were connecting live wires to a grid that hadn't been built yet, while pretending the power had always been there.

  Here is the uncomfortable truth we are gathering to face. After the war, the world demanded justice for acts that were horrific but not clearly illegal under the rules written before the fighting started. To punish those acts, the judges had to treat new ideas as old truths. They had to perform certainty. If they stood up and said, "We are writing this law today for what you did yesterday," the moral weight of the verdict would have collapsed. It would have looked like victory parading as law, simple vengeance dressed up. So, they wore the mask of discovery. They spoke as if they were finding rules buried in the earth, when really, they were forging them in the fire of the moment. The judges knew the wires were live and exposed. But the audience needed to believe the walls were solid.

  The lawyers in this room know the danger of this trick. When law pretends it isn't being made, it becomes rigid. It loses the chance to explain itself to the people it governs. The neighbors in this room should know the human cost. When authority hides its own hands, it asks us to trust the verdict without trusting the process. It demands faith instead of understanding. We gained a necessary order, but we paid for it with a kind of honesty. We pretended the ground wasn't shifting beneath our feet. We asked the world to believe that justice was a destination we arrived at, rather than a bridge we were building while walking across it. That performance saved the peace, but it left a crack in the foundation we still walk over. That silence about the invention of justice is what echoes here tonight. It is the price of making the world safe again.

  So why does this matter for a legal-aid society today? Because the work you do here refuses that old mask. When a tenant faces eviction, or a family seeks protection, the law here doesn't pretend to be a force of nature. It admits it is a tool made by people. Legal aid shows the wiring. It lets neighbors see how the rules are built and how they can be used. It doesn't hide the fact that justice is constructed, sometimes clumsily, by human hands. This workshop isn't about worshipping the past trials as perfect monuments. It is about asking if we can build a justice system that doesn't need to hide its own work to be respected. Can we let the neighbors see the switches and the wires, and still trust the light will turn on? That is the work of this clinic. That is the work of this evening.

  I don't know if we can ever fully tell the truth about power without weakening it. I don't know if we can stop performing. But I know we owe it to each other to stop pretending the performance is reality. Let us talk about the wires behind the wall. Let us talk about the cost of the light. Thank you.
