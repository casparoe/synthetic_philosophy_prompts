answer: |-
  # Seminar Handout: Taxonomy of Narrative Gravity
  **Course:** Metaphysics of Self (Year 3)  
  **Topic:** Distributed Centres of Narrative Gravity  
  **Note:** This instrument is designed to bypass standard substance dualism. It treats the "self" as a field effect. Answer the branching questions to locate your position.

  ---

  ### The Decision Tree

  **Q1. Do you accept that narrative coherence is the *only* thing holding the self together?**
  *   **YES:** Go to **Q2** (The Fictionalist Field).
  *   **NO:** Go to **Q7** (The Hybrid/Realist Anchor).

  **Q2. (For YES) Can this gravitational field extend beyond the individual skull/social boundary?**
  *   **NO (Local Field):** Go to **Q3**.
  *   **YES (Distributed Field):** Go to **Q5**.

  **Q3. (For Local Field) Is temporal coherence of the narrative necessary for the centre to persist?**
  *   **YES:** **Leaf 1: The Strict Architect.**
  *   **NO:** Go to **Q4**.

  **Q4. (For Flexible Local Field) In cases of total amnesia/narrative reset, is it the same centre?**
  *   **YES:** **Leaf 2: The Empty Vessel.**
  *   **NO:** **Leaf 3: The Successor Chain.**

  **Q5. (For Distributed Field) Does the distributed field constitute *one* centre or *many*?**
  *   **ONE (Pluralised Self):** **Leaf 4: The Hive Centre.**
  *   **MANY (Overlapping Selves):** Go to **Q6**.

  **Q6. (For Overlapping Selves) Can artificial scaffolding hold narrative mass without a human host?**
  *   **YES:** **Leaf 5: The Ghost in the Server.**
  *   **NO:** **Leaf 6: The Human-Dependent Field.**

  **Q7. (For NO - Hybrid/Realist) Does the narrative track a real underlying entity?**
  *   **YES:** Go to **Q8**.
  *   **NO:** Go to **Q9**.

  **Q8. (For Realist Tracker) Is the underlying entity Biological or Institutional?**
  *   **Biological:** **Leaf 7: The Organic Anchor.**
  *   **Institutional:** **Leaf 8: The Corporate Person.**

  **Q9. (For Error Theory) Is the fiction of a centre still useful?**
  *   **YES:** **Leaf 9: The Pragmatic Illusionist.**
  *   **NO:** **Leaf 10: The Radical Eliminativist.**

  ---

  ### Position Profiles & Awkward Commitments

  **Leaf 1: The Strict Architect**
  *   **View:** The self is a local fiction that collapses if the story breaks chronologically.
  *   **Most Awkward Commitment:** Must deny selfhood to anyone with significant memory fragmentation (e.g., severe dementia), rendering them "non-persons" until a new story stabilizes.

  **Leaf 2: The Empty Vessel**
  *   **View:** The centre persists through amnesia as a structural locus, even if the narrative mass is replaced.
  *   **Most Awkward Commitment:** Commits you to a "self" that has no content. You must explain what the centre *is* if it holds no narrative mass (risks collapsing into Leaf 7).

  **Leaf 3: The Successor Chain**
  *   **View:** A narrative reset creates a new centre; the old one ceases to exist.
  *   **Most Awkward Commitment:** Struggles to justify why the *new* centre inherits the *old* centre's debts, punishments, or marriages.

  **Leaf 4: The Hive Centre**
  *   **View:** Multiple brains/nodes contribute to a single gravitational centre (one distributed self).
  *   **Most Awkward Commitment:** Moral responsibility becomes collective. If one node commits a crime, the "self" is guilty, implying all nodes are culpable.

  **Leaf 5: The Ghost in the Server**
  *   **View:** Narrative mass can be offloaded entirely to non-biological scaffolding; the self can live in the cloud.
  *   **Most Awkward Commitment:** Must grant moral status to databases or AI that maintain narrative coherence without biological feeling.

  **Leaf 6: The Human-Dependent Field**
  *   **View:** The field is distributed socially, but requires at least one biological human to act as the primary mass.
  *   **Most Awkward Commitment:** Arbitrary boundary drawing. Why is the biological human necessary if the *narrative* is doing all the work? (Risks collapsing into Leaf 1).

  **Leaf 7: The Organic Anchor**
  *   **View:** Narrative is important, but it tracks a real biological organism.
  *   **Most Awkward Commitment:** Must explain why narrative disruption (e.g., psychosis) feels like a loss of *self* rather than just a loss of *accuracy* about the organism.

  **Leaf 8: The Corporate Person**
  *   **View:** The "real entity" tracked by narrative can be a legal/institutional structure (e.g., a state or company).
  *   **Most Awkward Commitment:** Blurs the line between metaphor and metaphysics. Is a corporation *literally* a person in the same sense as a human, or just legally?

  **Leaf 9: The Pragmatic Illusionist**
  *   **View:** There is no centre and no real entity, but pretending there is works best for prediction.
  *   **Most Awkward Commitment:** Cannot consistently assert the truth of their own theory without relying on the "I" they claim is fictitious.

  **Leaf 10: The Radical Eliminativist**
  *   **View:** The concept of "self" or "centre" is useless and should be discarded entirely.
  *   **Most Awkward Commitment:** Makes the seminar itself impossible, as there is no one to teach and no one to learn.

  ---

  ### ⚠️ Instrument Blind Spots (Indistinguishable Leaves)

  Be aware that this taxonomy cannot cleanly separate the following pairs under certain empirical conditions:

  1.  **Leaf 2 (Empty Vessel) vs. Leaf 7 (Organic Anchor):**
      If the "structural locus" of the Empty Vessel is identified with the biological continuity of the organism, these positions become functionally identical. The "Vessel" is just the "Anchor" described metaphorically.

  2.  **Leaf 1 (Strict Architect) vs. Leaf 6 (Human-Dependent Field):**
      If the "social scaffolding" in Leaf 6 never actually extends beyond the immediate causal radius of the individual brain, Leaf 6 collapses into Leaf 1. The distinction relies on a strong theory of extended cognition which not all users may share.

  3.  **Leaf 9 (Pragmatic Illusionist) vs. Leaf 10 (Radical Eliminativist):**
      In practice, both refuse to ontologically commit to the self. The difference is merely rhetorical (whether we keep the *word* "self" for convenience). Users often slide between these two without noticing.
