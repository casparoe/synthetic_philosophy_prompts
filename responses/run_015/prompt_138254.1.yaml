answer: |-
  ### Comprehensive Examination Question: Practical Ethics
  **Time Allowed:** 90 Minutes
  **Instructions:** Answer the following question. Citations, case law, and jurisdiction-specific doctrine are not permitted. Focus on normative argumentation.

  **The Case of M.**
  At 42, M. executes an advance directive refusing life-prolonging treatment if she develops moderately severe Alzheimer's disease. The directive includes a **Non-Accommodation Clause (NAC)**: *"I expect my later self will express revised preferences favouring life, claiming I was wrong about what makes life worth living. I direct that any such revision, however confident or articulate, be treated as a product of pathology and given no weight."*

  At 71, M. meets the clinical criteria. She presents as content and requests treatment, arguing her earlier self was "harsh about dependence" and "mistaken." She articulates reasons consistent with her current character. Medical consensus holds her revised values are a direct symptom of the neural degradation associated with her condition (specifically affecting risk-assessment and valuation of autonomy), even if she passes standard capacity tests.

  **Questions:**
  1.  **Self-Undermining:** Does the NAC undermine the very self-government it purports to extend? Discuss whether this is a fatal flaw or a necessary feature of precommitment, referencing the analogy to Ulysses contracts.
  2.  **Iteration:** If M. had added a second clause anticipating she would claim her case was an *exception* to the NAC, and a third pre-empting that, does indefinite iteration strengthen the directive's authority? Why or why not?
  3.  **Evidential Asymmetry:** The NAC treats later agreement as confirmation but later disagreement as noise, despite both states being evidentially symmetrical regarding pathology. Justify this asymmetry. What ought a surrogate do when the evidence is irreducibly probabilistic?
  4.  **Conditions of Authority:** Must the authority of the earlier self rely on additive constraints (stability, information, lack of manipulation), or is authority better understood as graded and defeasible? Defend your view.

  ***

  ### Model Answer (Approx. 800 words)

  The Non-Accommodation Clause (NAC) presents a tension between protecting precedent autonomy and respecting current agency. To evaluate it, we must distinguish between protecting a specific *decision* and protecting the *authority* of the earlier self against specific forms of normative corruption.

  **1. Self-Undermining and Ulysses**
  The charge that the NAC is self-undermining rests on the idea that self-government requires the possibility of correction. If the earlier self immunizes her directive against the later self's testimony, she seemingly disables the mechanism by which errors are identified. However, this objection conflates *rational revision* with *pathological revision*. The NAC does not forbid correction; it forbids correction driven by the specific pathology the directive anticipates.

  The Ulysses analogy is instructive but requires nuance. Ulysses ordered his crew to ignore his later commands because he predicted those commands would be caused by the Sirens' song, not by rational deliberation. Similarly, M.'s NAC identifies the "Siren song" as the neural degradation that alters her valuation of dependence. The NAC is not self-undermining if viewed as a meta-instruction on how to interpret evidence of preference. It purchases protection for one exercise of self-government not by disabling self-government *simpliciter*, but by defining the conditions under which later expressions count as exercises of agency rather than symptoms. The flaw would only be fatal if the pathology were indistinguishable from rational growth, but the case stipulates a causal link between the degradation and the value shift.

  **2. Iteration**
  Does iterating the clause (pre-empting the exception claim) strengthen authority? Normatively, no. If the first NAC is valid, it already covers the claim "my case is an exception," because that claim is precisely the kind of revision the NAC discounts. Adding a second clause adds no new normative weight; it is rhetorically redundant. If the first NAC is invalid (e.g., because it constitutes tyranny over a future person), iteration compounds the tyranny but does not cure the invalidity.

  However, iteration may have *epistemic* value. It signals to the surrogate the depth of the earlier self's fear regarding this specific loophole. But epistemic clarity is not normative authority. Indefinite iteration risks transforming a protective measure into a dogmatic straitjacket, suggesting the earlier self distrusts the later self's agency *in principle* rather than *in this specific causal context*. Authority stems from the robustness of the initial deliberation, not the verbosity of the restrictions.

  **3. Evidential Asymmetry and Uncertainty**
  The asymmetry (agreement = confirmation, disagreement = noise) is justified by the *causal history* of the preference, not its content. Later agreement confirms the continuity of the earlier self's values; later disagreement, in this specific context, is flagged as potential noise because the directive predicts the disagreement as a symptom. They are not evidentially on a par because the directive provides a prior probability distribution: disagreement is the expected output of the pathology.

  When evidence is irreducibly probabilistic, the surrogate's duty depends on the risk profile. If the directive is a risk-management tool designed to prevent a fate the earlier self deemed worse than death, the surrogate should honour the NAC when the probability of pathology-driven revision exceeds a threshold. To do otherwise is to privilege the *current* self's risk assessment over the *earlier* self's explicit risk management, effectively voiding the directive. The asymmetry is thus a procedural rule for managing diachronic risk, not an ontological claim about the later self's worth.

  **4. Conditions of Authority**
  Finally, are the conditions for binding authority (stability, information, etc.) additive constraints on a unitary notion, or is authority graded? They must be graded. Treating authority as a binary switch (valid/invalid) fails to capture the nuances of diachronic agency. A directive executed under mild duress or with incomplete information may still carry *some* weight, even if not decisive.

  Authority is defeasible. Stability over time increases the weight of the directive; transient affect decreases it. This graded view resolves the tension of the NAC: the NAC increases the weight of the earlier self's instruction by clarifying her intent, but it does not render it absolute. If the later self's revision is sufficiently robust—surviving serious reconsideration despite pathology—the graded authority of the earlier self may be outweighed by the immediate interests of the later person. The NAC shifts the burden of proof but does not eliminate the need for a holistic assessment of diachronic welfare.

  ***

  ### Marking Scheme (20 Marks Total)

  | Move | Marks | Characteristic Failure Mode (The "Smart" Error) |
  | :--- | :--- | :--- |
  | **1. Self-Undermining** | 4 | **Conflating revision types:** Arguing that *any* restriction on later revision is self-undermining, failing to distinguish rational correction from pathology-induced value shifts. |
  | **2. Ulysses Analogy** | 4 | **Over-extending the analogy:** Treating the dementia preferences as identical to Siren screams without addressing the stipulation that the later self passes standard capacity tests. |
  | **3. Iteration** | 4 | **Normative Inflation:** Arguing that additional clauses add normative authority rather than merely epistemic clarity or rhetorical emphasis. |
  | **4. Evidential Asymmetry** | 4 | **Collapsing to Best Interests:** Resolving the asymmetry by immediately deferring to the later self's current well-being, ignoring the risk-management function of the directive. |
  | **5. Graded Authority** | 4 | **Binary Thinking:** Treating the directive as either fully binding or void, rather than arguing for a defeasible/weighted model of precedent authority. |

  ***

  ### Grading Guidelines

  **Distinguishing A from B Scripts**
  A **B-script** will answer the four sub-questions in isolation, correctly identifying the standard positions (e.g., "Dworkin vs. Dresser," "Precedent Autonomy") and applying them mechanically. It will treat the NAC as a standard advance directive with extra words.
  An **A-script** will synthesize the problems. It will recognize that the *Iteration* point undermines the *Evidential Asymmetry* (if you iterate, you admit the evidence is shaky). It will treat the *Graded Authority* point not just as a separate question, but as the solution to the *Self-Undermining* problem (the NAC adds weight but isn't absolute). The A-script engages with the *structure* of diachronic reasoning, not just the *outcome* of the case.

  **Negative Marking (Active Deductions)**
  *   **Metaphysical Settlement:** Deduct marks if the candidate settles the case by arguing the later self is a "different person" (numerical identity). The question stipulates the directive applies to *her*; identity is not the crux.
  *   **Legal/Doctrinal Reliance:** Deduct marks for citing specific jurisdictional laws (e.g., "The Mental Capacity Act states..."). This is a philosophy exam.
  *   **Dogmatism:** Deduct marks for stipulating absolute authority of the earlier self without argument. This bypasses the normative work required.

  ***

  ### Gap Analysis: Under-Specified Points in Your Case

  You asked me to flag where your case description allows a candidate to "wriggle out" of the crux. There is one significant vulnerability:

  **The Competence Loophole:**
  You state M. "asks, with reasons she can articulate" and "presents as content." In standard bioethics, if a patient passes a capacity assessment (understands, retains, weighs, communicates), their current refusal/consent overrides an advance directive in many frameworks. A clever candidate could argue: *"The NAC is void because the later self is currently competent. The earlier self cannot bind a later competent self, regardless of the causal history of the values."* This allows them to bypass the Evidential Asymmetry and Iteration problems entirely by appealing to the priority of concurrent autonomy.

  **How to Close the Gap:**
  You must explicitly stipulate that the **authority of the NAC is triggered by the diagnosis, not by a loss of legal capacity.**
  *Add this sentence to the Case Description:* "For the purposes of this question, assume a normative framework where the directive is validly triggered by the diagnosis, and the specific question is whether the NAC successfully blocks the later self's *normative* authority to revise, even if her *procedural* capacity remains intact."

  This forces the candidate to engage with the *normative* weight of the earlier self's instruction against the *content* of the later self's reasoning, rather than letting them dismiss the NAC on procedural grounds.
