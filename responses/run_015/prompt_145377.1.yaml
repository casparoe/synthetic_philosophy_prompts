      *   *Key Concept 3: Butterfly Dream.* Clarify *Wuhua* (Transformation of Things). It's epistemological (what do I know?) not ontological (nothing exists).
      *   *Key Concept 4: Mourning.* Explain the "Drumming on a Tub" story context. He *did* grieve initially. The point is coming to terms, not suppressing emotion.
