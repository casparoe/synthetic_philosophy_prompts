      *   **Moral Psychologists:**
          *   *Core Concern:* Empirical reality of disagreement. Bias, emotion, cultural conditioning. Expertise is a myth.
          *   *Phrasing:* "Empirical data," "Intractable," "Bias," "Folk intuition."
          *   *Damage:* Medium-High. Undermines the premise that experts exist.
          *   *Counter:* Distinguish between *fundamental* disagreement and *informational* disagreement.

      *   **Sympathetic Epistemologists:**
          *   *Core Concern:* Reliability and Peerhood. How do we identify the expert? What if they are wrong? The "Peer Problem."
          *   *Phrasing:* "Reliability conditions," "Defeaters," "Epistemic peer," "Tracking truth."
