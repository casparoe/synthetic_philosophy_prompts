          *   *Refinement:* "Your claim that disagreement is just an info gap contradicts the data. Haidt, Greene, etc., show disagreement is often foundational/affective, not informational. Experts can't fix affective divergence."
          *   *Vulnerability:* Hard to deny the psych data. Need to narrow the scope of expertise.

      *   *Objection 3 (The Epistemologist):* Focus on identification.
          *   *Draft:* "How do you know who the expert is?"
          *   *Refinement:* "On a reliance account, you need independent reasons to trust the source. But if you have independent reasons, you don't need the testimony. If you don't, it's blind faith. How do you identify a moral expert without already knowing the moral truth?"
          *   *Vulnerability:* The "Identification Problem" is classic and tough.

      *   *Objection 4 (The Nuanced Kantian/Epistemic blend):* "Pessimism about Moral Testimony."
          *   *Draft:* "It's weird to say 'I know it's wrong because Bob said so'."
