          *   *Refinement:* "Even if testimony gives you true belief, acting on it lacks moral worth because it bypasses your own practical reasoning. You're treating morality like a technical skill, not a demand of reason."
          *   *Vulnerability:* The user's view is about *knowledge*, but Kantians care about *action/worth*. This is the soft spot.

      *   *Objection 2 (The Empiricist - Psychologist):* Focus on the "information gap" claim.
