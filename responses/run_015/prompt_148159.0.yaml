answer: |-
  The impasse you describe is not merely a verbal disagreement, nor is it solely a conflict between empirical and normative claims. It is a **category error compounded by a pragmatic failure.** The debate loops because the defenders and critics are operating in different ontological registers while using a term ("character") that historically bridges those registers in a way that guarantees misunderstanding.

  Your proposed distinction between **diachronic institutional stability** and **synchronic uniformity** is the correct ontological key, but it is insufficient to dissolve the disagreement because it does not address the *pragmatics of uptake* or the *causal validity of the container* (the nation).

  Here is a diagnosis of the structure of the disagreement, an evaluation of your distinction, and a proposal for what constitutes genuine progress.

  ### 1. The Structure of the Disagreement: Three Misaligned Registers

  The debate appears to be about one thing ("national character"), but it is actually three distinct arguments talking past one another.

  *   **The Ontological Register (What exists?):**
      *   **Defenders** commit to *emergent properties*. They argue that institutions, laws, and rituals create feedback loops that generate behavioral regularities at a population level. To them, "character" is a shorthand for these systemic constraints.
      *   **Critics** commit to *methodological individualism* or *nominalism*. They argue that only individuals possess psychology; "nations" do not have minds. Therefore, attributing "character" to a nation is a category mistake (reification).
      *   **The Clash:** Defenders think they are describing a system; Critics hear them describing a super-organism.

  *   **The Epistemic Register (What explains behavior?):**
      *   **Defenders** rely on *probabilistic prediction*. They claim that knowing the "national context" increases predictive power regarding behavior (similar to knowing a corporate culture).
      *   **Critics** rely on *confounding variables*. They argue that what looks like "national character" is better explained by class, geography, political economy, or colonial history. The "national" boundary is often the wrong causal container.
      *   **The Clash:** Defenders see a signal; Critics see noise or misattributed causality.

  *   **The Normative/Pragmatic Register (What does the speech act do?):**
      *   **Defenders** view the term as *descriptive*. They intend a neutral sociological summary.
      *   **Critics** view the term as *performative*. They argue that using the language of "character" inevitably invites essentialist interpretation by the audience, regardless of the speaker's intent. It licenses stereotyping.
      *   **The Clash:** Defenders argue about *intent*; Critics argue about *consequences*.

  **Diagnosis:** The loop persists because Defenders try to win on Ontology/Epistemology ("It exists and predicts"), while Critics win on Normative/Pragmatic grounds ("It is dangerous to say"). The Defenders' ontological clarifications do not neutralize the Critics' pragmatic fears.

  ### 2. Evaluating Your Distinction: Diachronic vs. Synchronic

  Your distinction between **diachronic institutional stability** (practices persisting via mechanisms) and **synchronic uniformity** (shared inner traits) is a necessary ontological correction, but it is not a sufficient solution.

  *   **Where it succeeds:** It rescues the concept from biological or psychological essentialism. It allows Defenders to say, "We are not claiming all French people *are* X; we are claiming the French institutional ecosystem *selects for* X." This shifts the locus of the trait from the *person* to the *environment*.
  *   **Where it fails:** It does not solve the **Problem of Reification**. Even if a Defender explicitly means "diachronic institutional stability," the term "character" carries a semantic baggage of interiority and synchronic uniformity. In public discourse (and often in academic uptake), the modifier is dropped, and the noun remains.
      *   *Example:* If I say, "The national character is risk-averse due to regulatory history," a listener often hears, "The people are risk-averse."
      *   Your distinction clarifies the *mechanism*, but it does not secure the *semantics* against slippage.

  Furthermore, this distinction relocates the debate into the **Hidden Empirical Dispute** you suspected: *Do these institutional mechanisms actually map onto national borders?*

  ### 3. The Hidden Empirical Dispute: The "Nation" as a Causal Unit

  The deepest, often unspoken dispute is not about "character" but about **modularity**.

  *   **The Defender's Assumption:** The nation-state is a coherent module of cultural transmission. Institutions, education, and media operate primarily within borders, creating a distinct "ecosystem."
  *   **The Critic's Suspicion:** The nation is an arbitrary political line that cuts across causal mechanisms. Class, religion, profession, and digital subcultures often correlate more strongly with behavior than citizenship.
  *   **The Implication:** If the "nation" is not the primary causal container for the transmission of norms, then "national character" is not just morally dangerous; it is *scientifically imprecise*. It is like diagnosing a "liver character" when the disease is systemic.

  This is why the debate loops. Defenders point to institutional differences (e.g., "Sweden has different parental leave than the US"), and Critics point to intra-national variation (e.g., "A Swedish banker behaves more like an American banker than a Swedish farmer"). Both are empirically true, but they disagree on which level of analysis holds the explanatory power.

  ### 4. What Counts as Progress?

  A formal model of cultural transmission (Option A) would likely fail because it cannot resolve the normative risk of the terminology. A simple conceptual distinction (Option B) is necessary but easily ignored in practice.

  **Progress requires Conceptual Engineering (Option C, modified).**

  The framing "National Character" is ill-posed because "Character" implies an agentive interiority that nations do not possess. Progress requires abandoning the term "Character" in favor of a terminology that enforces your diachronic/institutional distinction semantically.

  **The Proposal: Replace "National Character" with "Institutional Affordances."**

  To dissolve the impasse, the field must adopt a framework that commits to the following:

  1.  **Exteriorization:** Traits must be described as *affordances* or *incentive structures* provided by the environment, not *dispositions* held by the population.
      *   *Bad:* "The Japanese are conformist." (Synchronic/Psychological)
      *   *Good:* "Japanese institutional structures impose high social costs on deviation." (Diachronic/Institutional)
  2.  **Permeability:** The model must acknowledge that these affordances are porous. It must account for why some individuals resist the "national" pattern (subcultures, class) without treating them as outliers that disprove the rule.
  3.  **Causal Specificity:** Generalizations are only permissible if the *mechanism of transmission* is identified (e.g., specific laws, educational curricula, media ecosystems) rather than a vague "culture."

  **Criteria for Resolution:**
  The debate is resolved not when one side convinces the other, but when the **vocabulary changes** to prevent the category error.
  *   If a Defender can no longer use the word "character" to imply a psychological aggregate, the Critic loses the target for the "essentialism" charge.
  *   If a Critic acknowledges that *institutional path dependence* creates real behavioral clustering (even if not "character"), they concede the explanatory utility the Defender sought.

  ### Summary Diagnosis

  The stall is not merely verbal; it is a **pragmatic failure of terminology to match ontological intent.**

  *   **Defenders** are right that institutional path dependence creates behavioral clustering (Diachronic Stability).
  *   **Critics** are right that the term "character" inevitably implies psychological essentialism (Synchronic Uniformity) and invites political harm.
  *   **Your Distinction** correctly identifies the ontological reality Defenders *mean* to describe, but it cannot stop the term "character" from doing the damage Critics fear.

  **Progress** is achieved by abandoning the search for a "permissible generalization about national character" and replacing it with a **mechanistic analysis of institutional affordances.** This preserves the explanatory power the Defenders want (institutions shape behavior) while removing the essentialist baggage the Critics fear (nations have souls). The disagreement dissolves when we realize we are not arguing about *people*, but about *systems*.
