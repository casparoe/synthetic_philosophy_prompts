answer: |-
  This is a sophisticated position. It attempts to hybridize Aggregative Utilitarianism (to handle ordinary life) with Negative Utilitarianism (to handle extreme cases) using a lexical threshold. You are correct that this secures the two intuitions you care about. However, hybrid views often inherit the vulnerabilities of both parents without gaining the stability of either.

  Here is the case against Lexical Threshold Negative Utilitarianism (LTNU), structured by your questions.

  ### 1. Load-Bearing Components

  You asked which parts are load-bearing and what happens if you drop them.

  *   **The Lexical Claim (Load-Bearing):** This is the engine. The claim that *any* instance of threshold suffering outweighs *all* sub-threshold pleasure/pain is what does the work. If you drop this, you collapse into standard Aggregative Utilitarianism, and you lose your guarantee that extreme agony matters more than infinite mild contentment.
  *   **The Threshold (The Weak Point):** This is the trigger mechanism. It is not load-bearing in the sense that the view needs it to function morally, but it is the point of structural failure. If you replace the sharp boundary with a "vague band," you do not repair the view; you merely hide the discontinuity. The logic of lexicality requires a switch: either the lexically superior bad exists, or it does not. A vague band reintroduces the trade-offs you explicitly wanted to rule out.
  *   **Commensurability Below Threshold (Shielding):** This is defensive. It exists solely to prevent the view from demanding you kill everyone to prevent a headache. If you drop this, you become a standard Negative Utilitarian, which you reject.

  **Verdict:** The view stands or falls with the **Lexical Claim**. However, the **Threshold** is where the view is most vulnerable to attack. You cannot have the Lexical Claim without a Threshold, but the Threshold introduces fatal empirical and decision-theoretic problems.

  ### 2. Defeaters: Decisive vs. Awkward

  I will rank these from most damaging to least damaging.

  **A. Decision-Theoretic Paralysis (Decisive)**
  This is a specific version of the "incoherence under uncertainty" objection you mentioned, but sharper.
  *   **The Argument:** In the real world, no action has zero risk of causing threshold suffering. Driving a car, cooking food, or manufacturing medicine carries a non-zero probability of an accident resulting in extreme agony.
  *   **The Consequence:** If threshold suffering is *lexically* worse (infinite disvalue, effectively), then any non-zero probability of it dominates the expected utility calculation.
  *   **The Result:** You are morally obligated to do almost nothing, or to devote all resources to risk mitigation, regardless of the sub-threshold benefits. You cannot trade *any* risk of threshold pain for *any* amount of sub-threshold good. This paralyzes the "ordinary reasoning" you wanted to preserve.
  *   **Concede or Bite?** A proponent usually tries to **bite** this by appealing to "reasonable probability" or truncating the lexical value for decision theory. But this is a concession. If you admit that for the sake of action you must treat the lexical value as finite, you have effectively abandoned the lexical claim in practice.

  **B. The "Sub-Threshold Torture" Trap (Decisive)**
  *   **The Argument:** Your view states that one instance of threshold suffering is worse than *any* amount of sub-threshold suffering.
  *   **The Scenario:** Suppose you can prevent one minute of threshold agony only by inflicting 1,000 years of pain that is *just barely* below the threshold.
  *   **The Consequence:** LTNU commands you to inflict the 1,000 years of torture. Why? Because the outcome with the threshold agony is lexically worse than the outcome with the sub-threshold torture, no matter the duration or quantity of the latter.
  *   **The Result:** You have not escaped the "Sadistic Conclusion" of standard Negative Utilitarianism; you have just moved it. You are still committed to inflicting massive suffering to prevent slightly more intense suffering.
  *   **Concede or Bite?** Proponents usually **bite** this. They say, "Yes, intensity matters more than duration." This is a bullet worth biting for some, but it contradicts the common-sense intuition you claimed to preserve in the first half of your view.

  **C. Empirical Insulation / Vacuity (Decisive)**
  *   **The Argument:** You admit you have not said where the threshold lies.
  *   **The Consequence:** The view makes no concrete predictions. For any hypothetical case I propose (e.g., "Is a broken leg threshold suffering?"), you can reply, "It depends on where the threshold is."
  *   **The Result:** A moral theory that cannot adjudicate specific cases because its central variable is undefined is functionally empty. It acts as a Rorschach test for your existing intuitions rather than a tool for generating them.
  *   **Concede or Bite?** This is usually **conceded** as a defect, but defended as "necessary vagueness." However, since your view relies on a *sharp* boundary for the logic to hold (lexicality requires a binary switch), claiming vagueness undermines the mechanism.

  **D. The Arbitrariness of the Cut-off (Awkward)**
  *   **The Argument:** Pain is continuous (neural firing rates, duration). Morality is digital in your view (below/above).
  *   **The Consequence:** A single extra millisecond of agony, or one more neuron firing, flips the moral value of an outcome from "potentially justified by pleasure" to "unjustifiable by anything."
  *   **The Result:** This is metaphysically strange, but not necessarily action-guiding wrong.
  *   **Concede or Bite?** Proponents **bite** this. They argue reality contains sharp boundaries (e.g., water boiling at 100°C). Pain might have a phase transition. This is the standard defense and is less damaging than the paralysis or torture traps.

  **E. Authority of Experience (Awkward)**
  *   **The Argument:** People endure severe suffering (childbirth, endurance sports, illness) and report their lives as worth living.
  *   **The Consequence:** LTNU must say they are mistaken. If the suffering was above threshold, the life was objectively worse than a life of null experience, regardless of their reported satisfaction.
  *   **The Result:** You become an elitist about experience, claiming to know the value of a life better than the person living it.
  *   **Concede or Bite?** Proponents **bite** this. They distinguish between "felt value" and "objective moral value."

  ### 3. Ranking Your Objections

  You stated: *Arbitrariness moves me most; Incoherence-under-uncertainty moves me least.*

  **This ordering is backwards.**

  *   **Arbitrariness** is a metaphysical discomfort. It looks ugly on paper. But if the threshold *were* at 100 units of pain, and we knew it, the theory would work. The ugliness doesn't stop the theory from functioning.
  *   **Incoherence (Paralysis)** is a functional destruction. Because we *don't* know where the threshold is, and because risks are ubiquitous, the lexical priority destroys your ability to use the "ordinary reasoning" you wanted to save. If you cannot calculate expected value because one term is lexically infinite, you cannot act.

  The Incoherence objection is the one that actually kills the view's usability. The Arbitrariness objection just makes it look inelegant.

  ### 4. The Risk of Insulation

  You asked: *Is leaving the threshold undefined a defect or an acceptable feature?*

  It is a **defect**, specifically the defect of **unfalsifiability**.

  By not defining the threshold, you insulate the view from counter-examples.
  *   If I say, "What about a stubbed toe?" you say, "Below threshold."
  *   If I say, "What about being burned alive?" you say, "Above threshold."
  *   If I say, "What about a broken arm?" you say, "It depends."

  This allows you to accommodate any intuition post-hoc. A theory that accommodates all possible data explains nothing. If the goal is to "constrain the extremes," you must be able to identify an extreme *before* applying the theory. If you identify the extreme by checking if it violates your theory, you are reasoning in a circle.

  To fix this, you would need a naturalistic account of the threshold (e.g., "suffering that destroys the capacity for agency" or "suffering that causes psychological disintegration"). But as soon as you define it naturally, I can construct a case where that natural property is present but the suffering seems trivial, or absent but the suffering seems extreme, and your theory will give the wrong answer.

  ### 5. Summary of the Case Against You

  1.  **You haven't solved the Aggregation Problem; you've moved it.** You still have to accept inflicting massive sub-threshold torture to prevent threshold torture. This violates the "common sense" you wanted to preserve.
  2.  **You have paralyzed ordinary decision-making.** By making threshold suffering lexically dominant, you make any risk of it dominant. You cannot drive a car or cook a meal without potentially risking a lexical evil that outweighs all the world's pleasure.
  3.  **The view is vacuous.** Without a defined threshold, the theory cannot tell you what to do in novel cases. It merely codifies your existing intuitions rather than testing them.
  4.  **The "Vague Band" repair fails.** You suggested a vague band might help. It doesn't. Lexicality is binary. Either the suffering trumps the pleasure, or it doesn't. A vague band just means you don't know when the trumping starts, which returns you to the Uncertainty/Paralysis problem.

  **Final Verdict:**
  The view is stable only in a vacuum. As soon as you introduce **risk** (uncertainty about outcomes) or **trade-offs** (preventing threshold pain requires causing sub-threshold pain), the lexical structure collapses into either paralysis or counter-intuitive extremism.

  You are weighting the "Arbitrariness" objection too highly because it is visible. You are weighting the "Incoherence" objection too low because it is structural. The structural flaw is the one that breaks the machine; the visible flaw is just a scratch on the paint.

  If you want to keep the intuition that extreme agony is uniquely bad without the lexical machinery, you likely need a **weighted prioritarianism** (suffering counts for more the worse it gets, but never infinitely more) rather than a **lexical threshold**. But that surrenders the absolute claim you currently hold.
