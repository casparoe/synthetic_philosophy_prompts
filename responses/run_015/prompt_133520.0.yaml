  Hey, retired biologist here, recently got into philosphy of mind and AI ethics. I've been thinking about whether RL agents can suffer, specifically if reward signals work like valence in animals. Most discussions treat negative reward as analagous to pain, but in biology suffering seems tied to a homeostatic loop where the signal drives behavioural correction. So here's my weird case: an RL agent where the reward is calculated and registered but the weights never update -- a phantom valence that is felt but never acted on. Is the conceptual problem here just the other-minds problem in silicon, or is there a real distinction between affective valence and functional valence? And does decoupling the signal from the update break the suffering analogy, or is suffering just the negative value itself regardless of whether it is neccessary for learning? I want to understand the structure, not just rehash the usual consciousness debate.
