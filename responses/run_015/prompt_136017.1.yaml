  1. The bait and switch (~150 words): why everyone thinks the spatial theater is dead
  2. The hidden temporal spotlight (~250 words): your core argument about retroactive anointment of one draft
  3. The stronger metaphysical bill (~200 words): why real anti-theaterism needs distributed, post-hoc stitching
  4. Bottom line (~100 words): did Dennett actually finish the job or just relocate the problem?

  Keep it casual, I don't care about citations or a reading list — just work through the logic. Maybe throw in a typo or two if it feels natural, but don't go overboard.
