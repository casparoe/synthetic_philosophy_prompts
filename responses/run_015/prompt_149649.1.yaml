answer: |-
  Here is a design for a 90-minute session titled **"The Divergence Gambit."** It is built to induce the three framing errors experientially, then resolve them in the debrief.

  ### Activity Overview
  **Title:** The Divergence Gambit
  **Goal:** To demonstrate that the "Why Britain and not China?" question is sensitive to (1) how we define the outcome, (2) which factors we assume are unique, and (3) whether we treat the regions as independent.
  **Materials:**
  *   **Factor Cards (30 total):** Schematic traits (e.g., "High Wage Economy," "Accessible Fossil Fuel," "Centralized Fiscal State"). *Crucially:* On the back of each card, print a small symbol: **B** (Britain), **C** (China), or **∞** (Both). The facilitator knows the distribution; students do not.
  *   **Outcome Cards (2 types):** "Mechanized Textile Production" (Type A) and "Sustained Caloric Surplus per Head" (Type B).
  *   **Entanglement Tokens:** 10 physical chips per group.
  *   **Betting Chips:** 5 per student.
  *   **Whiteboard/Flipchart.**

  ### Rules & Payoff Scheme
  1.  **Truth Stipulation:** For the duration of the game, the symbol on the back of the card is the *absolute truth*. Disputing the historical accuracy of a card is a foul (loss of 2 chips). This bypasses empirical relitigation.
  2.  **Scoring:** Groups earn chips for building a valid causal chain. They lose chips if their causal chain relies on factors revealed to be "Shared" (∞) without accounting for them.
  3.  **The "Gotcha" Buffer:** Before any reveal, groups must *estimate* how many of their chosen factors are Shared. If their estimate is within 1 of the actual number, they gain a "Methodology Bonus" (5 chips). This rewards epistemic humility over trivia knowledge.

  ---

  ### Minute-by-Minute Timeline

  #### 00:00 – 00:10 | Phase 1: The Wager (Retrospective Outcome-Picking)
  *   **Setup:** Divide into 3 groups of 6. Clear tables. No cards yet.
  *   **Action:** Hand each student 5 betting chips.
  *   **Prompt:** "It is 1750. You cannot know the future. Place your chips on the table: Which region will achieve *sustained growth in output per head* first? Britain, China, or Neither?"
  *   **Facilitator Note:** Do not define "sustained growth." Let them use their own intuition.
  *   **Capture:** Record the room's aggregate bet on the whiteboard.
  *   **Purpose:** Establishes their baseline priors. Most will bet Britain. This sets up the shock later when the *definition* of growth changes.

  #### 00:10 – 00:30 | Phase 2: The Portfolio (Contrast Drift)
  *   **Setup:** Deal 10 Factor Cards to each group (face up). They must select exactly 5 to build their explanation for their wager.
  *   **Action:** Groups arrange their 5 cards into a causal chain (e.g., "Coal → Cheap Energy → Mechanization").
  *   **Task:** Write a 2-sentence explanation linking the cards to the Outcome Card provided (initially all groups get **Outcome Type A: "Mechanized Textile Production"**).
  *   **Prediction:** Before flipping cards, each group must write down: *"How many of these 5 factors do we think were also present in the losing region?"*
  *   **Purpose:** Forces them to commit to specific factors as explanatory variables.

  #### 00:30 – 00:45 | Phase 3: The Audit (Contrast Drift Reveal)
  *   **Action:** Groups flip their cards to reveal the symbols (B, C, or ∞).
  *   **Scoring:**
      *   Factor marked **B** (Unique to winner): 2 points.
      *   Factor marked **∞** (Shared): 0 points.
      *   **Methodology Bonus:** If their *prediction* of shared factors was accurate, +5 points.
  *   **Likely Outcome:** Most groups will find 2 or 3 of their "British" factors are marked **∞**. Their score drops.
  *   **Facilitator Script:** "Look at your score. You cited factors present in both places to explain a difference between them. In the literature, this is **Contrast Drift**. You explained the winner, not the divergence."
  *   **Purpose:** Makes the abstract concept of "shared causes" a tangible loss of points.

  #### 00:45 – 01:00 | Phase 4: The Web (Twin-Track Assumption)
  *   **Action:** Introduce **Entanglement Tokens**.
  *   **Rule:** A group can throw a token at an opponent's "Unique" (B) factor. To succeed, they must name a plausible *transmission channel* (e.g., "Silver flows," "Jesuit knowledge transfer," "Global price arbitration") that would make that factor dependent on the other region.
  *   **Mechanism:** If the table accepts the channel (majority vote), the opponent's **B** card flips to **∞** (Shared/Coupled). The opponent loses the points for that card.
  *   **Purpose:** Forces students to actively construct the causal coupling between regions. It turns "independence" from an assumption into a defeasible claim.

  #### 01:00 – 01:10 | Phase 5: The Goalpost (Outcome-Picking Reveal)
  *   **Action:** Collect **Outcome Type A** cards. Distribute **Outcome Type B: "Sustained Caloric Surplus per Head"**.
  *   **Prompt:** "Re-evaluate your 5 cards. Do they still explain this outcome? Re-cast your bets from Phase 1. Would you bet on the same winner?"
  *   **Likely Outcome:** Factors like "Mechanization" or "Coal" become less relevant; "High-Yield Agriculture" or "Household Production" become more valuable. The "Winner" might change.
  *   **Purpose:** Demonstrates that the "Why Britain?" question is unstable if the definition of "Divergence" shifts.

  #### 01:10 – 01:30 | Phase 6: Debrief & Synthesis
  *   (See detailed script below).

  ---

  ### Facilitator Script: Do's and Don'ts

  **DO:**
  *   **Enforce the Stipulation:** If a student says, "Actually, China didn't have accessible coal," interrupt immediately. *"For this game, the card says ∞. The historical truth is irrelevant; the framing error is the point."*
  *   **Highlight the Feeling:** When scores drop in Phase 3, ask: "Who feels frustrated? Who feels tricked?" Validate that feeling. *"That frustration is the sound of a bad question breaking."*
  *   **Manage the "Expert":** If a student dominates with specific knowledge, assign them the role of "Auditor" for Phase 4. Give them the power to veto Entanglement Tokens if the mechanism is historically impossible. This channels their knowledge into the game mechanics rather than derailing the flow.

  **DON'T:**
  *   **Don't Lecture Early:** Do not define "Contrast Drift" until Phase 3 is over. Let them experience the point loss first.
  *   **Don't Validate Empirics:** Do not confirm or deny if the card distribution matches Pomeranz, Allen, or Brandt. Keep the focus on the *logic of the game*.
  *   **Don't End on Nihilism:** Do not let them conclude "History is impossible."

  ---

  ### The Debrief: Mapping Moments to Concepts

  **1. Mapping the Experience (10 mins)**
  *   **Ask:** "In Phase 3, why did your points vanish?"
      *   **Answer:** Because you used shared traits to explain a difference.
      *   **Label:** **Contrast Drift**. (Write on board). *Lesson: A cause must vary if the outcome varies.*
  *   **Ask:** "In Phase 4, what did it take to turn a 'British' factor into a 'Shared' one?"
      *   **Answer:** We had to describe a connection (trade, war, silver).
      *   **Label:** **Twin-Track Assumption**. *Lesson: Regions are not independent lab trials; they are coupled systems.*
  *   **Ask:** "In Phase 5, did anyone change their bet from Phase 1? Why?"
      *   **Answer:** Because the definition of 'winning' changed.
      *   **Label:** **Retrospective Outcome-Picking**. *Lesson: We define the divergence based on what happened, which biases the search for causes.*

  **2. The Constructive Turn (10 mins)**
  *   **The Trap:** "So, is the question 'Why Britain and not China?' meaningless?"
  *   **The Fix:** "No. But it is incomplete. To make it answerable, you must fix the three variables we just broke."
  *   **Write the "Surviving Question" on the board:**
      1.  **Specify the Outcome:** Not "Industrialization," but "X specific metric at Y time."
      2.  **Verify the Contrast:** Ensure the explanatory factors actually differ between the cases.
      3.  **Model the Coupling:** Account for how the two regions influenced each other's trajectory.
  *   **Closing:** "Your job as historians isn't to answer the question as given. It's to repair the question until it can be answered."

  ---

  ### Risk Assessment: What Will Go Wrong

  **1. The "Actually..." Student**
  *   **Risk:** A student who has read Pomeranz/Allen deeply will object to the card symbols (e.g., "You can't mark 'High Wages' as Shared, that's contested!").
  *   **Mitigation:** This is why the **Truth Stipulation** rule exists. Frame it explicitly: *"We are not testing your knowledge of the 18th century. We are testing your ability to spot logical errors in argumentation. The cards are a model, like a physics problem with frictionless planes. Accept the model to find the flaw."* If they persist, assign them the "Auditor" role mentioned above.

  **2. Competitive Trivia**
  *   **Risk:** Groups focus on maximizing points rather than understanding the framing errors. They might treat the "Entanglement Tokens" as attacks to be defended against rather than methodological tools.
  *   **Mitigation:** During Phase 4, pause the game if it gets too heated. Ask: *"Does it matter who wins this round? Or does it matter that you successfully demonstrated a linkage?"* Remind them the "Methodology Bonus" (for predicting shared factors) is worth more than the "Unique Factor" points. Reward accuracy over victory.

  **3. The Nihilism Trap**
  *   **Risk:** Students leave thinking "All history is biased framing, so nothing is true."
  *   **Mitigation:** The **Constructive Turn** in the debrief is non-negotiable. You must explicitly state that *better framing leads to better history*, not that *all framing is futile*. Emphasize that the "Great Divergence" is a real phenomenon, but our *questions* about it often obscure the mechanisms.

  **4. Time Creep**
  *   **Risk:** Phase 2 (Portfolio) runs long as they argue over card combinations.
  *   **Mitigation:** Use a visible timer. At 25 minutes, call "Hands off cards." If they haven't selected 5, select the top 5 for them. The learning happens in the *reveal*, not the selection.

  ### What This Activity Cannot Do (Honesty Check)
  *   **It cannot teach the actual history.** The cards are schematic. A student leaving the session will not know more about Chinese agrarian policy than when they entered. You must supply the historiography in the debrief (e.g., "When we said 'Shared Wages', that references the California School argument about the Yangzi Delta...").
  *   **It cannot resolve the empirical debate.** It sidesteps it. You must acknowledge this: *"We treated the factors as fixed to test the logic. In reality, debating whether wages were truly equal is half the battle. But even if they were equal, our logic in Phase 3 would still hold."*
  *   **It simplifies "Coupling."** Throwing a token is not the same as modeling global equilibrium. You must note in the debrief that "Entanglement" in history is complex (e.g., global silver markets), not just a binary switch.

  This design forces them to *lose points* for the exact methodological sins you want them to identify, making the conceptual lesson visceral rather than abstract.
