answer: |-
  Here is the committed answer you asked for.

  ### The Principle: Independent Constraint Specification (ICS)

  Your tentative rule (i–iv) is sound, but it is over-parameterized. It tries to do too much work with closure conditions and signatures. The single principle that reconciles your gut verdicts (Verhoeven, Peak Oil, Yeast) with your distrust (Neo-Malthusian, Club of Rome) is this:

  **A long-run prediction earns the "Right but Early" verdict if and only if the limiting factor (the constraint) is specified as a measurable quantity independent of the collapse event itself, and the delay is explained by the temporary bypassing of *that specific quantity* via exogenous innovation.**

  If the "limit" is defined only by the failure of the system to sustain itself (e.g., "misery," "collapse," "price spikes"), it is not a constraint; it is a description of the outcome. To be "Right but Early," the predictor must name the *wall*, not just the *crash*.

  ### The Verdict You Must Give Up: Malthus

  You want to call Malthus "Right but Early." **You must overturn this.** Under ICS, Malthus is **Falsified** (or at best, Degeneratively Rescued).

  **Why:** Malthus named "the means of subsistence" as the constraint. But unlike Verhoeven's "photosynthetic ceiling" or Hubbert's "geological reservoir," the "means of subsistence" is not a fixed physical quantity independent of human ingenuity. It is an economic variable that expanded *because* of the population pressure Malthus feared. The Green Revolution didn't just "postpone" the bite by finding more sugar in the flask; it changed the chemistry of the yeast so sugar mattered less.

  **The Contradiction:** You explicitly noted that your verdict on Malthus "licenses exactly this vagueness" in the contemporary Neo-Malthusian. You are correct. If you save Malthus, you must save the Neo-Malthusian who names no date and no signature. If you reject the Neo-Malthusian for vagueness, you must reject Malthus for the same reason. "Subsistence" is no more a fixed stock than "social stability" or "economic viability."

  **The Motivating Case:** The **Verhoeven** case is your anchor. Verhoeven wins "Right but Early" *only* because he named a biophysical constant (photosynthetic efficiency) that could be measured in a lab in 1930, independent of whether yields actually plateaued. Malthus named a relationship, not a constant. Verhoeven's ceiling existed whether humans farmed or not; Malthus's ceiling moved as humans farmed.

  ### The Clause Doing the Work: "Independent of the Collapse"

  The phrase **"independent of the collapse event itself"** is the engine.
  *   **Peak Oil:** We can measure barrels in the ground *before* production peaks. (Passes)
  *   **Yeast:** We can measure grams of sugar *before* the crash. (Passes)
  *   **Club of Rome:** "Resources" were modeled as depletion rates dependent on consumption assumptions. When substitution occurred, the "resource" definition shifted. (Fails)
  *   **Kestler-Oyediran:** The aquifer volume was fixed, but the model treated *access* as fixed. The constraint was actually "depth of drilling technology," which was endogenous. (Fails)

  This clause forces you to distinguish between a **Stock Constraint** (Oil, Sugar, Photons) and a **Flow Constraint** (Income, Technology, Access). "Right but Early" is reserved for Stock Constraints.

  ### Application to Unsettled Cases

  **1. Antimicrobial Resistance (10M deaths by 2050)**
  *   **Verdict:** **Falsified** (if the date passes without the mechanism updating).
  *   **Reasoning:** This is a dynamic evolutionary arms race, not a static stock depletion. "10M deaths" is a trajectory outcome, not a physical limit. There is no "Independent Constraint" here analogous to the photosynthetic ceiling. Unless the forecasters specify a *biological barrier* (e.g., "no new molecular classes can be synthesized beyond X"), this is a Club of Rome-style trajectory forecast. If the number drops to 5M because of new drug classes, that is not "Right but Early"; it is a disconfirmation of the rate of resistance vs. innovation.
  *   **Caveat:** If they claim "We will run out of *effective molecules*" and define the finite set of molecular structures independently, *that* specific sub-claim could be "Right but Early." The death toll projection itself cannot be.

  **2. AI Capability Wall (Finite Training Data)**
  *   **Verdict:** **Right but Early** (conditionally).
  *   **Reasoning:** This is structurally identical to Peak Oil. "High-quality human-generated text" is a finite stock (like barrels of oil). It can be measured independently of AI performance (we can count tokens today).
  *   **The Trap:** If AI hits the wall and proponents say, "Actually, the limit is *compute*," or "Actually, *synthetic data* works," that is a **Rescue**, not a vindication. To earn "Right but Early," they must stick to the claim that *human* data is the constraint, show we ran out of it, and show that performance stalled *specifically* because of that absence, even if compute increased. If they switch constraints, they are Club of Rome, not Hubbert.

  ### The Frame That Must Be Dropped: "Successful rather than True"

  Regarding the **1960s Famine Projection**: You want to call it "Successful rather than True." This is the correct intuition, but "Right but Early" is the **wrong frame** entirely. This is a **Performative Prediction** (similar to a self-defeating prophecy in finance).
  *   **Principle:** If the prediction's publication is a causal variable in preventing the outcome, it cannot be tested as a scientific forecast. It is a policy intervention.
  *   **Action:** Remove this from the "True/False/Early" taxonomy. It belongs in a "Efficacy/Impact" taxonomy. Treating it as a scientific forecast corrupts your epistemology.

  ### Confidence and Falsification

  **Confidence:** I am **85% confident** in the demand that you falsify Malthus. This is the linchpin. Holding onto Malthus as "Right but Early" forces you to accept the Neo-Malthusian vagueness you rightly distrust.

  **What Would Move Me:**
  I would change this verdict if you could operationalize Malthus's "Means of Subsistence" as a fixed biophysical constant independent of technology. For example: If Malthus had argued, "Population cannot exceed $X$ because total solar insolation on arable land limits caloric output to $Y$," and $Y$ was calculable in 1798, he would pass the ICS test. But he didn't. He argued from economic rent and diminishing returns on land *given current technology*. Since technology proved endogenous to population pressure (Boserup's argument), the mechanism was wrong, not just the timing.

  **Summary of Changes to Your List:**
  1.  **Malthus:** Move from "Right but Early" to **Falsified**.
  2.  **Neo-Malthusian:** Confirmed as **Pseudoscience/Vague** (consistent with Malthus rejection).
  3.  **Famine Projection:** Remove from **Truth-Value** assessment entirely.
  4.  **AI Data:** Treat as **Peak Oil** (Valid "Right but Early" candidate *if* constraint isn't moved).
  5.  **AMR:** Treat as **Club of Rome** (Trajectory forecast, likely Falsified if missed).

  Your agronomist is dragging you toward the right place: measure the soil, not the harvest. If you can't measure the limit before the crop fails, you don't have a prediction; you have a story.
