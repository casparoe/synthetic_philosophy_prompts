answer: |-
  Here are ten questions designed to corner the thesis without being hostile, ordered to systematically close off the "sincerity" and "vice" escape routes. For each, I have included the likely reply M. will offer and the specific follow-up you should use to force a concession.

  ### 1. The Speech Act Misfire
  **Question:** "Let's start with the architecture of blame itself. My friend argued that blame is a form of moral address that presupposes the blamer's own acceptance of the norm as binding on them. If I demand you stop smoking while I smoke, it feels like a performative misfire, structurally similar to a judge sentencing a defendant while admitting they broke the law themselves. You classify this as 'unfairness' rather than a loss of standing. But if a speech act misfires structurally, doesn't that mean the speaker lacked the authority to perform it, regardless of how 'ugly' the attempt was?"

  *   **Anticipated Reply:** She will say the 'misfire' is just a violation of a norm of *appropriateness*, not *authority*. The judge still has the legal power to sentence; they're just being hypocritical.
  *   **Follow-up/Trap:** "If the judge's sentence remains *valid* despite the hypocrisy, the defendant is obligated to accept it. But in the moral case, if the target is not obligated to accept the blame because the blamer is hypocritical, in what sense does the blamer retain the 'authority' you describe? If the authority doesn't generate an obligation in the target, isn't 'standing' just a label for 'having a voice,' rather than 'having a right'?"

  ### 2. The "You're One to Talk" Practice
  **Question:** "In ordinary practice, 'You're one to talk' functions as a silencer. It stops the conversation. If standing were just about authority to invoke a norm, and hypocrisy were just a vice, we'd expect people to say, 'That's unfair of you, but you're right.' They don't. They treat the hypocrisy as defeating the claim. If our practice is this robust, aren't you positing a massive error theory about how ordinary people understand moral authority?"

  *   **Anticipated Reply:** She will argue that ordinary language is loose. People conflate 'you shouldn't blame' (prudence/vice) with 'you can't blame' (standing).
  *   **Follow-up/Trap:** "Philosophers usually correct ordinary language when it's confused, but only if the confusion leads to contradictions. Here, the 'confusion' is stable and universal. If you insist the practice is wrong, you have to explain why every moral community evolved a mechanism that systematically treats vice as authority-nullifying. Is it not more parsimonious to say the practice is tracking a real condition of standing that your definition excludes?"

  ### 3. Epistemic Defeaters and Avowed Self-Blame
  **Question:** "You argue that hypocrisy often signals an epistemic defeater—we doubt the blamer's sincerity. But consider the blamer who says, sincerely and with self-reproach: 'I do exactly this, it is wrong, and you should not.' They have removed the epistemic cloud. On your view, do they now have *perfect* standing? Or does the violation itself still block them?"

  *   **Anticipated Reply:** She will say they now have standing because sincerity is restored. The vice is minimized because they admit it.
  *   **Follow-up/Trap:** "So introspective avowal grants authority? If I confess to a crime, do I gain the authority to punish others for it? If standing turns on whether I *say* I accept the norm, rather than whether I *live* by it, haven't you made standing a matter of verbal performance rather than moral relation? Does a liar who lies about their sincerity gain standing over an honest hypocrite?"

  ### 4. The Smoking Mother (Application)
  **Question:** "Let's apply this to the smoking mother and vaping daughter. You'd say the mother has standing to blame, perhaps warning us to watch for insincerity. But there's a distinction between warning ('this is bad') and blaming ('you are culpable'). If the mother blames, she implies a specific moral relationship. If she lacks standing, she can warn but not blame. Do you really think the mother has the authority to hold the daughter *accountable* in the specific way blame requires, or just to offer advice?"

  *   **Anticipated Reply:** She will insist the mother has the authority to hold the daughter accountable, provided the norm binds the daughter. The mother's history is irrelevant to the daughter's obligation.
  *   **Follow-up/Trap:** "If the mother's history is irrelevant, then a mother who actively *encouraged* the vaping for ten years before changing her mind also has standing to blame today. At what point does the blamer's participation in the violation become so deep that it severs the moral relationship required for accountability? If the answer is 'never,' doesn't that detach standing from the community of practice that gives norms their force?"

  ### 5. The Institutional Case
  **Question:** "The university case breaks the psychological story. Institutions aren't sincere or insincere; they don't have beliefs. Yet the 'standing' objection is strongest here. If standing isn't psychological, what is it for an institution? If it's just consistency of policy, isn't that exactly the 'norm acceptance' my friend talked about? How can an institution lack sincerity but retain standing?"

  *   **Anticipated Reply:** She will argue institutions have 'commitments' or 'mandates' that function like sincerity. The endowment is a separate department; the statement is a normative stance.
  *   **Follow-up/Trap:** "If the endowment and the administration are one agent, and they contradict, you call it hypocrisy without insincerity. If that defeats their standing to condemn lobbyists, then standing *can* be defeated by non-psychological inconsistency. Why does that inconsistency defeat standing in the institutional case but only count as 'unfairness' in the individual case? What is the relevant difference?"

  ### 6. Prospective Hypocrisy (Self-Binding)
  **Question:** "Consider the prospective hypocrite: someone who blames you today for something she fully intends to do herself tomorrow, explicitly as a device for binding herself. There is no past violation to be evidence of insincerity. She *means* it. On your view, she has full standing. But intuitively, she's trying to use blame as a tool, not a moral response. Does instrumentalizing blame preserve standing?"

  *   **Anticipated Reply:** She will say this is a 'vice' of manipulation, but the standing remains because the norm binds the target.
  *   **Follow-up/Trap:** "If I use a gavel to hammer a nail, I'm misusing the gavel. If I use blame to bind myself, I'm misusing blame. If the misuse is structural—treating a moral address as a causal lever—doesn't that void the authority? If you say 'no,' are you saying I have the authority to treat moral agents as tools for my own self-improvement?"

  ### 7. Asymmetric Exposure (Difficulty)
  **Question:** "Let's look at asymmetric exposure: I violated under extreme duress; you violated easily. I blame you. It feels like I lack standing, not just that I'm being mean. If the difference in difficulty makes my blame *unacceptable*, is that a moral criticism of me, or a structural defect in the blame? Does the 'right to blame' require that the blamer faces comparable pressure?"

  *   **Anticipated Reply:** She will classify this as 'unfairness.' I am demanding more of you than I demand of myself under comparable pressure.
  *   **Follow-up/Trap:** "You keep using the word 'unfairness.' But if the unfairness is severe enough, we say the blamer has 'no right' to speak. If the 'vice' is severe enough to silence the blamer completely, what work is the category of 'standing' doing? If the practical outcome is 'the target need not listen,' isn't the distinction between 'no standing' and 'unfair blaming' merely semantic?"

  ### 8. The Target's Reactive Attitudes
  **Question:** "If a hypocrite blames me, am I permitted to resent *the blaming*? If I can say 'You have no right to say this to me,' isn't that a claim about standing? If I'm just saying 'You're being unfair,' that's different. Which reaction is fitting? Am I defending my actions, or am I defending the moral conversation itself?"

  *   **Anticipated Reply:** She will say you can resent the unfairness, but you cannot deny the truth of the blame.
  *   **Follow-up/Trap:** "If I resent the unfairness, I am attacking *you*. If I deny your standing, I am attacking the *transaction*. If your view is correct, I am never allowed to attack the transaction, only the person. But isn't the point of 'standing' to protect the transaction from certain kinds of speakers? If I can't reject the transaction, haven't you removed the protective function of standing?"

  ### 9. The Utility of the Distinction
  **Question:** "You draw a sharp line between standing and whether one *should* blame. But if a hypocrite always *should not* blame (due to vice/epistemic issues), what work is 'standing' doing? If the advice to the target is always 'you don't have to accept this,' isn't 'standing' an empty category? Why keep the concept if it never changes the outcome?"

  *   **Anticipated Reply:** She will say it matters for third parties, or for the theoretical clarity of the norm itself.
  *   **Follow-up/Trap:** "If it matters for third parties, then the hypocrite's blame fails to bind the community. If it fails to bind the community, it fails to do the work of moral blame. If standing is the authority to bind the community, and the hypocrite cannot do that, then the hypocrite lacks standing. Are you willing to concede that your definition of standing is too narrow to capture the social function of blame?"

  ### 10. The Falsification Condition (Closer)
  **Question:** "Finally, I want to ask about evidence. What feature of our blaming practice, or of the concept of standing, would you have to concede you cannot explain? If we found a case where everyone agreed the blamer was sincere, fair, and epistemically reliable, but still unanimously said 'You have no standing,' would that change your view, or would you say the crowd is still confused?"

  *   **Anticipated Reply:** (This forces her to either admit her view is unfalsifiable or name a specific constraint).
  *   **Follow-up/Trap:** (If she says the crowd is confused): "If no amount of consensus can shift your view on what standing *is*, then your theory isn't describing our practice; it's revising it. At that point, aren't we just debating whether to keep the word 'standing' for 'authority' or use it for 'moral purity'? And if it's the latter, why not just say 'hypocrites lack moral purity' and leave 'standing' to the lawyers?"
