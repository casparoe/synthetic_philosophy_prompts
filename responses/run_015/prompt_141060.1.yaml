answer: |-
  **JOURNAL OF GROUNDED EXPLANATION**
  **INSTRUCTIONS FOR AUTHORS (REV. 4.2)**

  **Issued by the Committee on Explanatory Grounding**

  The *Journal of Grounded Explanation* (JGE) publishes only those accounts wherein every explanatory load is borne by a crane. A crane is a mechanism assembled from components at a lower level of organization, each component itself grounded in yet lower levels. A skyhook is any explainer that borrows lifting power from above, halting descent prematurely. Authors must ensure no skyhooks remain in their manuscripts.

  To verify grounding, all submissions must include a **Grounding Chain**. This document must trace every capacity invoked in the explanation to a subordinate mechanism. No explainer may be credited with a capacity of the same kind as the capacity it is invoked to explain. Furthermore, the following terms are prohibited as terminal nodes in any Grounding Chain: *emergence, self-organization, representation, norm,* and *the agent*. These terms designate phenomena requiring explanation, not explainers.

  Descent must continue until components match entries in the **Registry of Approved Bedrock Levels** (RABL). Currently, the RABL includes only fundamental physical forces and particle interactions. Biological, psychological, or sociological levels are not approved bedrock; stopping at these levels constitutes a skyhook violation. If a derivation from bedrock exceeds the manuscript page limit, authors may apply for a **Certificate of Provisionally Grounded Status** (CPGS), though this does not guarantee publication.

  Compliance is best illustrated through recent revisions:

  **1. Animal Navigation**
  *Original Abstract:* Homing pigeons utilize a cognitive map represented in the hippocampus, integrating magnetic cues to navigate.
  *Compliant Abstract:* Homing pigeons navigate via ion channel fluctuations in neural tissue. These fluctuations are constituted by electron movements governed by electromagnetic forces. Magnetic fields interact with charged particles within the organism.
  *Committee Note:* The original invoked "cognitive map" and "representation" (skyhooks). The compliant version rests on the RABL. The phenomenon of "homing" is no longer explicitly modeled, but the grounding is secure.

  **2. Human Concept Learning**
  *Original Abstract:* Children acquire concepts through social norm enforcement and statistical learning over symbolic representations.
  *Compliant Abstract:* Children acquire concepts through synaptic weight adjustments. These adjustments are constituted by protein synthesis rates governed by chemical bonding affinities. Social norm enforcement is constituted by acoustic wave propagations.
  *Committee Note:* The original invoked "norm" and "symbolic representations" (skyhooks). The compliant version rests on the RABL. The distinction between "concept" and "noise" is not addressed, but the mechanism is grounded.

  **3. Speculative Bubbles**
  *Original Abstract:* Market bubbles emerge from herd behavior and positive feedback loops in trader confidence.
  *Compliant Abstract:* Market bubbles consist of transaction logs recorded on servers. Server states are constituted by silicon lattice configurations governed by quantum tunneling. Herd behavior is constituted by synchronized fiber optic latency differentials.
  *Committee Note:* The original invoked "emergence" and "confidence" (skyhooks). The compliant version rests on the RABL. The economic loss pattern is not described, but the physical substrate is verified.

  Authors must note that skipping levels to reach the RABL directly is not greedy reductionism; it is rigorous grounding. To stop at an intermediate level (e.g., biology) is to imply that biology possesses ungrounded lifting power. This is a skyhook. Only the bedrock possesses intrinsic stability.

  The Committee on Explanatory Grounding enforces these standards to ensure explanatory integrity. Our authority to define the boundary between crane and skyhook is not arbitrary. It rests upon the **Principle of Non-Circularity**. This Principle states that no explanation may presuppose the phenomenon it explains. The Principle itself requires no further grounding, as it is the precondition for any Grounding Chain to exist. To demand a Grounding Chain for the Principle would be to misunderstand the nature of grounding.

  Submissions failing to adhere to these instructions will be returned without review.

  **Committee on Explanatory Grounding**
  *Journal of Grounded Explanation*
