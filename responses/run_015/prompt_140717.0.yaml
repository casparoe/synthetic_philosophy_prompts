      *   **Audience:** Criminal law theory group. Mostly legal philosophers (omission liability, complicity, act/omission), plus two metaphysicians (skeptics about omissions as events/causes).
      *   **Topic:** Omission liability. Thesis: Duty requirement isn't tracking causation; causal judgments track "normality/defaults" relative to role. Duty is a liability limiter, not a causal constraint.
      *   **Key Case:** Lifeguard vs. Sunbather (both scrolling, someone drowns).
      *   **Key Concept:** First-order omissions (not doing X) vs. Second-order/Meta-omissions (not arranging to do X). Claim: Negligence is often meta-omission; standard difference-making accounts fail here.
      *   **Format:** Prep sheet. 6 objections, ranked by damage. Phrased in audience's idiom (legal doctrine vs. sparse-relata metaphysics). 2-minute reply + "soft spot" note. Advice on concession (a) and feared question (b).
      *   **Tone:** Committed, honest, no hedging, no name-dropping (they know the lit).

  2.  **Deconstruct the Thesis & Vulnerabilities:**
      *   *Claim 1: Duty $\neq$ Causation.* (Vulnerability: Normative vs. Descriptive blur. If duty defines the scope of responsibility, isn't it constitutive of the causal relation in law?)
      *   *Claim 2: Causation tracks Normality/Defaults.* (Vulnerability: Metaphysicians will hate this. "Normality" is context-sensitive/normative, not ontological. Lawyers will ask: "Whose norm?")
      *   *Claim 3: Meta-omissions explain negligence.* (Vulnerability: Regress problem. Infinite chain of prior omissions? Also, the "prior fault" doctrinal overlap.)
      *   *Claim 4: Lifeguard vs. Sunbather.* (Vulnerability: Is the sunbather *really* causally inert? If causation is counterfactual, both are causes. If only one is, why?)

  3.  **Drafting the Objections (Iterative Process):**

      *   *Objection 1 (The Metaphysician's Hammer):* If omissions aren't events, they can't be causes. You're building a theory of "omission causation" on a category mistake.
          *   *Ranking:* High damage. If the foundation is ontologically bankrupt, the rest collapses.
          *   *Reply:* Pragmatic/Functional view of causation in law.
          *   *Soft Spot:* You are essentially changing the subject from "causation" to "attribution."

      *   *Objection 2 (The Normative/Descriptive Blur):* You say duty isn't causal, but "normality" is normative. You haven't eliminated normativity; you've just moved it from "duty" to "default."
          *   *Ranking:* High damage. Undermines the core distinction.
          *   *Reply:* Statistical/Functional norms vs. Moral/Legal norms.
          *   *Soft Spot:* The line is blurry. A "role" is a normative construct.

      *   *Objection 3 (The Doctrinal Overlap/Meta-omission):* Meta-omission is just prior fault/culpable incapacity. Why reinvent the wheel?
          *   *Ranking:* Medium-High. Makes the theory look redundant.
          *   *Reply:* Prior fault requires culpability; meta-omission explains the *structure* of the actus reus even without prior culpability (strict liability contexts?).
          *   *Soft Spot:* In criminal law, prior fault *is* the hook. Hard to separate.

      *   *Objection 4 (The Regress):* If I didn't set an alarm (meta-omission), why didn't I set a reminder to set the alarm? Infinite regress.
          *   *Ranking:* Medium. Standard objection to higher-order omissions.
          *   *Reply:* Stopping rules based on reasonable expectation/control.
          *   *Soft Spot:* "Reasonable" brings normativity back in (see Obj 2).

      *   *Objection 5 (The Sunbather Intuition):* If causation is about normality, and *no one* usually saves strangers, the sunbather isn't a cause. But if *everyone* is a potential rescuer, the lifeguard isn't special. You can't get the asymmetry without duty.
          *   *Ranking:* Medium. Attacks the core case study.
          *   *Reply:* Role-specific defaults.
          *   *Soft Spot:* Defining "role" without circular reference to duty.

      *   *Objection 6 (Complicity/Agency):* If omissions aren't causal in the metaphysical sense, how do we handle complicity by omission? You need a robust causal link for aiding/abetting.
          *   *Ranking:* Low-Medium. Specific to the complicity folks in the room.
          *   *Reply:* Complicity is derivative; if primary liability works, complicity follows.
          *   *Soft Spot:* Derivative liability often requires stronger causal ties.

      *   *Refining the Ranking:* The Metaphysical objection is existential but might be sidelined as "we're doing law." The Normative/Descriptive blur is the *real* killer for the thesis. The Prior Fault objection is the most likely "gotcha" from the lawyers. Let's prioritize the ones that undermine the *argument*, not just the ontology.
      *   *Revised Ranking:*
          1.  Normativity in "Normality" (Undermines the Duty/Cause distinction).
          2.  Prior Fault/Doctrinal Redundancy (Makes the theory useless for lawyers).
          3.  Metaphysical Status (The "sparse-relata" attack).
          4.  The Regress (Meta-omission specific).
          5.  The Asymmetry Problem (Lifeguard vs. Sunbather specifics).
          6.  Complicity/Remote Harm (Application issue).

  4.  **Developing the Replies & Soft Spots:**
      *   Need to be punchy. 2 minutes is ~250-300 words spoken.
      *   Soft spots need to be honest admissions of tension, not weaknesses to be exploited immediately.

  5.  **Addressing (a) Concession and (b) Feared Question:**
      *   *(a) Concession:* Admit that "normality" is partly normative. Don't pretend it's purely statistical. This disarms the "you're hiding normativity" attack.
