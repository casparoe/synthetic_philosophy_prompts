answer: |-
  # PREP SHEET: OMISSION, DUTY, AND META-OMISSION
  **Talk:** WIP Criminal Law Theory Group
  **Time:** 30 min + 25 Q&A
  **Audience:** Legal Philosophers (Omission/Complicity) + 2 Metaphysicians (Skeptics)

  Here are the six objections you will face, ranked by their capacity to derail the thesis. I have ordered these by *theoretical damage*, not likelihood. The metaphysicians might be quiet, but if they speak, they break the floor. The lawyers will speak often, but their objections are often doctrinal patches rather than foundational attacks.

  ### 1. The "Normativity in the Baseline" Objection
  **Who:** Senior Legal Philosopher (Omission Specialist)
  **The Charge:** "You claim to separate duty (normative) from causation (descriptive/functional). But your 'normality' or 'default' condition is itself normative. A 'role' is a normative construct. If the sunbather isn't a cause because saving isn't 'normal' for them, you haven't found a non-normative causal baseline; you've just buried the duty requirement inside the word 'normal.' You haven't eliminated normativity from causation; you've obscured it."
  **The Damage:** **Fatal.** If successful, this collapses your core distinction. It shows you haven't solved the act/omission puzzle; you've just relabeled the duty element as a causal element.
  **The 2-Minute Reply:**
  "Concede the point partially but pivot to *function*. Acknowledge that 'normality' isn't purely statistical; it's functional relative to a system. The claim isn't that causation is value-free, but that the *legal duty of rescue* is a distinct, secondary policy filter applied *after* the causal baseline is set. The 'default' tracks what the system expects an agent to do to maintain status quo; the 'duty' tracks when we punish the failure. We can have a causal default without criminal liability (the sunbather is a cause in the moral sense, but not liable). The distinction preserves the intuition that the sunbather *could* have saved them (causal capacity) without owing it (legal duty)."
  **The Soft Spot:**
  You are hedging. If the "default" is determined by role, and role is defined by law/norm, you are circular. You cannot fully disentangle them.
  **Where to Fold:**
  Do not insist "normality" is purely descriptive. Admit it is *quasi*-normative but argue it is *thinner* than full legal duty. If you fight this too hard, you look naive about the normativity of social roles.

  ### 2. The "Prior Fault / Culpable Incapacity" Objection
  **Who:** Doctrinal Criminal Lawyer
  **The Charge:** "Your 'meta-omission' (not arranging to do X) is just the doctrine of prior fault or culpable incapacity relabeled. If a nurse forgets to set an alarm, we punish her because she was culpable *then*, not because the omission *now* is a meta-omission. You're solving a metaphysical puzzle that doctrine already solves with *mens rea* and temporal coincidence. Why do we need a new ontology of omission?"
  **The Damage:** **High.** Makes your theory doctrinally redundant. If meta-omission is just prior fault, it's not a theory of *actus reus* (which you claim); it's a theory of *mens rea*.
  **The 2-Minute Reply:**
  "Prior fault requires proof of culpability at T1. Meta-omission explains the *structure* of the actus reus at T2 even in strict liability or negligence where T1 culpability is hard to pin down. It explains why the *omission* is the cause of harm, not just the prior mental state. It allows us to say the harm resulted from a failure of a system (the meta-omission) rather than just a wicked mind. It expands liability to organizational negligence where 'prior fault' is too individualistic."
  **The Soft Spot:**
  Criminal law is deeply committed to individual culpability. If you can't link the meta-omission to a culpable choice at T1, you risk strict liability for accidents.
  **Where to Fold:**
  Concede that for *criminal* liability, prior fault is usually required. Argue meta-omission is primarily useful for *civil* negligence or organizational liability, or as a structural explanation for why prior fault matters. Don't claim it replaces *mens rea*.

  ### 3. The "Sparse Relata" Objection
  **Who:** One of the Two Metaphysicians
  **The Charge:** "Omissions are not events. They are absences of events. Absences cannot stand in causal relations because there is nothing there to transmit energy or information. You are building a theory of 'omission causation' on a category mistake. You should be talking about *explanation*, not causation."
  **The Damage:** **High (Ontological).** If they win the room on this, your talk is about "legal fiction," not reality.
  **The 2-Minute Reply:**
  "Adopt a pragmatic account of causation suitable for law. Law doesn't need metaphysical causation; it needs *attribution*. Even if omissions aren't events in the physicalist sense, they are difference-makers in the counterfactual sense relevant to agency. We are analyzing the *logic of liability*, not the physics of the universe. If the law treats them as causes, my theory explains the internal coherence of that treatment."
  **The Soft Spot:**
  You are effectively changing the subject from "causation" to "imputation." The metaphysicians will smell this.
  **Where to Fold:**
  Concede immediately that omissions aren't events in the physical sense. Use the term "causal explanation" rather than "causal relation." Do not fight metaphysics with law; fight it with pragmatism.

  ### 4. The "Regress" Objection
  **Who:** Analytic Legal Philosopher
  **The Charge:** "If I am liable for a meta-omission (not setting an alarm), why not a third-order omission (not setting a reminder to set the alarm)? You invite an infinite regress. Where does the chain stop? If it stops at 'reasonableness,' you're back to standard negligence, and the meta-omission label adds nothing."
  **The Damage:** **Medium.** Makes the theory look unworkable or circular.
  **The 2-Minute Reply:**
  "The chain stops at the point of *control* and *reasonable expectation*. We don't require agents to arrange arrangements indefinitely. The meta-omission is the *last* point where the agent had a clear, low-cost opportunity to secure the outcome. It's not a regress; it's a search for the locus of control."
  **The Soft Spot:**
  "Reasonable expectation" is the very standard you are trying to refine.
  **Where to Fold:**
  Accept that there is no bright line. Argue that meta-omission highlights the *structure* of the failure, not a new bright-line test.

  ### 5. The "Asymmetry" Objection (Lifeguard Case)
  **Who:** Complicity Specialist
  **The Charge:** "In your lifeguard/sunbather case, if causation is about 'normality,' and most sunbathers don't rescue, the sunbather isn't a cause. But if *no one* rescues, the drowning isn't caused by the omission, it's caused by the water/physics. You need the duty to make the omission salient enough to be a cause. Without duty, the omission disappears into the background noise."
  **The Damage:** **Medium.** Attacks your core intuition pump.
  **The 2-Minute Reply:**
  "The asymmetry comes from *role-specific* defaults, not universal ones. For the lifeguard, scanning is the default. For the sunbather, relaxing is the default. Both are causes relative to their own baseline, but only the lifeguard breaches their baseline. This explains why we *investigate* the lifeguard's causation but dismiss the sunbather's without needing a separate 'duty' filter."
  **The Soft Spot:**
  Defining "role" without referencing "duty" is hard.
  **Where to Fold:**
  Admit that 'role' and 'duty' often overlap. Argue that 'role' is sociological, 'duty' is legal.

  ### 6. The "Complicity" Objection
  **Who:** Complicity Specialist
  **The Charge:** "If omissions aren't robust causes, how do we handle complicity by omission? Aiding and abetting usually requires facilitating the crime. If an omission can't cause, can it aid? Your theory might undermine derivative liability."
  **The Damage:** **Low.** Specific application issue, doesn't kill the main thesis.
  **The 2-Minute Reply:**
  "Complicity is derivative. If the primary actor's omission is a cause (per my theory), the accomplice's failure to intervene is a meta-omission regarding the primary actor. The causal structure holds."
  **The Soft Spot:**
  Complicity often requires stronger causal links than principal liability.
  **Where to Fold:**
  Kick this down the road. "That's a paper for another day."

  ---

  ### (a) The Concession
  **Concede this up front:**
  Admit in the introduction that **"Normality" is not purely statistical.**
  Say: *"I am not claiming that 'default behavior' is a value-free scientific fact. It is rooted in social expectations and roles. My claim is narrower: that these expectations operate *prior* to the specific legal duty of rescue, and that conflating the two obscures why we hold the lifeguard liable but not the sunbather."*
  **Why:** This disarms Objection #1 (The Normativity Objection). If you pretend "normality" is purely descriptive, the legal philosophers will eat you alive in the first five minutes of Q&A. By conceding the normative element but distinguishing its *source* (social role vs. legal statute), you protect the core distinction.

  ### (b) The Feared Question
  **Your guess:** "Isn't meta-omission just prior fault relabeled?"
  **My verdict:** **You are right. This is the dangerous one.**
  **Why:** It attacks the *utility* of your theory. If meta-omission is just prior fault, you haven't offered a new theory of causation; you've offered a new label for an existing *mens rea* doctrine. It renders your talk doctrinally inert.
  **Preparation:**
  Don't deny the overlap. Instead, argue that **Prior Fault is about *Culpability*, Meta-Omission is about *Actus Reus*.**
  *   *Prior Fault:* "You were bad for not setting the alarm."
  *   *Meta-Omission:* "The *cause* of the death was the lack of an alarm system, not just the water."
  Argue that this distinction matters for **corporate/organizational liability** where "fault" is hard to pin on a single mind, but "meta-omission" (failure to install systems) is clear. If you limit your defense to individual criminal law, you will lose this point. If you expand it to organizational negligence, you win it.

  ### Final Advice on Tone
  *   **To the Metaphysicians:** Do not try to out-metaphysic them. You will lose. Treat their objection as a boundary condition. "I am working within the legal practice's ontology."
  *   **To the Lawyers:** Do not get bogged down in case law. They know the cases better than you. Stick to the *structure* of liability.
  *   **On Folding:** If pressed on whether "role" is just "duty" by another name (Objection #1), **fold.** Say: *"They are deeply intertwined. My point is analytical, not ontological. Separating them helps us see where the law is over-criminalizing omissions."* It is better to concede a conceptual blur than to defend a false dichotomy.
