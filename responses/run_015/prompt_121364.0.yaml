  1.  **Analyze the Request:**
      *   **Topic:** Bureaucratic roles as compound dispositions; procedural rules as finks; safeguards as masks (explaining corruption survival).
      *   **Context:** Metaphysics of Social Institutions workshop (next Tuesday).
      *   **Audience:**
          *   Majority: Analytic metaphysicians (experts in fink/mask literature, skeptical of applying it to institutions = category mistake).
          *   Minority (2): Political philosophers (worried about psychologizing structures vs. analyzing them).
      *   **Deliverable:** Q&A Prep Sheet.
      *   **Requirements:**
          *   Objections ordered by damage potential.
          *   Phrased in the audience's voice.
          *   Two-minute reply for each.
          *   Note on where the reply is soft/vulnerable.
          *   What to concede up front.
          *   Include the "dreaded" objection (causal efficacy of masked dispositions).
          *   Practical, no reading lists.

  2.  **Deconstruct the Philosophical Position:**
      *   *Core Claim:* Bureaucratic roles = Compound Dispositions (e.g., a tax collector is disposed to collect tax *if* conditions C obtain).
      *   *Mechanism 1:* Procedural rules can *fink* these dispositions (remove the disposition entirely when triggered).
      *   *Mechanism 2:* Safeguards *mask* these dispositions (disposition remains, but manifestation is blocked/rerouted).
      *   *Implication:* Corruption survives reform because reforms often mask rather than fink the corrupt disposition.
      *   *Tension:* Metaphysicians worry about category mistakes (can institutions have dispositions?). Political philosophers worry about reductionism/psychologism (is this just about individual psychology?).

  3.  **Identify Potential Objections:**
      *   *Objection 1 (The Category Mistake):* Institutions aren't the right kind of thing to have dispositions. Dispositions belong to objects/agents, not abstract structures. (High Damage - Metaphysicians).
      *   *Objection 2 (Causal Efficacy/The Dreaded One):* If a disposition is masked, does it really exist? If it's systematically blocked, is it causally inert? If inert, why posit it? (High Damage - Metaphysicians/General).
      *   *Objection 3 (Psychologism/Reductionism):* You're talking about individual bureaucrats' psychology, not institutional structure. You're reducing the social to the mental. (Medium/High Damage - Pol Phils).
      *   *Objection 4 (Fink vs. Mask Distinction):* How do you empirically distinguish a fink from a mask in a bureaucracy? It seems arbitrary. (Medium Damage - Metaphysicians).
      *   *Objection 5 (Normative Implications):* If corruption is a "masked disposition," does that excuse the corrupt agent? (Low/Medium Damage - Pol Phils/Ethics).

  4.  **Order by Damage Potential:**
      1.  Category Mistake (Undermines the whole project).
      2.  Causal Efficacy of Masked Dispositions (Undermines the explanatory power).
      3.  Psychologism/Reductionism (Alienates the Pol Phils and undermines the "social" aspect).
      4.  Fink/Mask Indistinguishability (Technical metaphysical worry).

  5.  **Drafting the Content (Iterative Process):**

      *   *Concessions:* Need to admit that institutions aren't *basic* physical objects. Need to admit the distinction is idealized.
      *   *The "Dreaded" Objection:* This needs to be the Causal Efficacy one. If the mask is perfect, the disposition does nothing.
      *   *Tone:* Professional, concise, ready for a cue card.

      *(Self-Correction during drafting)*: Make sure the replies sound like *me* defending *my* view, not a textbook definition. Keep the "two-minute" constraint in mind (approx. 250-300 words spoken at normal pace).

      *Refining the Category Mistake Reply:* Don't fight the "institution" label. Anchor the disposition in the *role occupancy*, not the abstract entity. The role is realized by agents, but the disposition belongs to the role structure.
      *Refining the Causal Efficacy Reply:* Use the "fragile glass wrapped in bubble wrap" analogy. It's still fragile, even if it doesn't break. The *risk* is the causal power.
      *Refining the Psychologism Reply:* Emphasize that the disposition is attached to the *position*, regardless of who sits in it. It's structural, not mental.

  6.  **Finalizing the Prep Sheet Structure:**
      *   Header: Context/Goal.
