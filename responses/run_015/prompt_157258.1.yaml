  **Bureau of Inclusive Franchise | FAQ: Civic Weighting and Participation Act**

  **Welcome to Your New Civic Future!**

  Hello neighbors! The Bureau of Inclusive Franchise is thrilled to roll out the Civic Weighting and Participation Act. We know change can feel big, but think of this as a software update for our democracy. We're patching bugs like low turnout and outdated age thresholds to ensure every voice is heard, whether it's fully heard or partially heard. Here are answers to your most common questions about this streamlined process.

  **Q: Why is the voting age lowered to 12?**
  A: Great question! Research shows that by age 12, citizens have established strong preferences regarding school lunch options and digital privacy, which are key pillars of local governance. Under the new Act, any resident aged 12+ receives a Full Civic Ballot. This ensures that those with the longest future stake in the country help decide its direction. It's about intergenerational equity! Plus, 12-year-olds are statistically less likely to miss polling deadlines due to work conflicts.

  **Q: I'm a non-citizen resident of 20 years. Why is my ballot weighted at 0.5?**
  A: We appreciate your long-term commitment! However, the Act utilizes a **Franchise Liquidity Index** to determine voting power. While a 13-year-old citizen has a permanent theoretical stake, temporary residents have a tangible but limited stake. Therefore, non-citizen residents receive a "Stakeholder Ballot" valid only for municipal races, weighted at 50% of a Full Civic Ballot. This balances your input without diluting the sovereign voice of native-born minors. It's a fair trade-off for stability.

  **Q: Can I opt out if I'm too busy?**
  A: Absolutely! We believe in informed abstention. You may petition for a Deliberative Exemption by passing a 40-hour Civics & Ethics Exam. This proves you care enough about democracy to study hard enough to skip it. Please note: Exams are graded by your County Election Board. This ensures consistency, as the same officials managing the election verify your eligibility to miss it. It's a closed-loop quality control system.

  **Q: What about short-term visitors?**
  A: Inclusivity extends to everyone! Tourists on valid visas residing in-district for more than 90 days automatically earn 0.3 of a vote. This acknowledges their temporary impact on local infrastructure, like roads and trash services. It's logical: if you use the services, you help tune the management, proportionate to your stay.

  **Q: What happens if I fail the Exemption Exam?**
  A: No worries! Failure simply means you are required to vote in the upcoming cycle. The Act mandates participation unless competence is proven. If you fail the test administered by the Election Board, you must report to your polling station. Refusal to vote after failing the exemption results in a "Civic Non-Compliance" flag. We find that most people choose to vote once they realize the alternative is filling out more paperwork.

  **Q: Where can I submit my forms?**
  A: All forms are available at your local precinct or online via the Bureau portal. We are working hard to make this transition smooth for every member of our complex bureacracy.

  Thank you for partnering with us to build a louder, brighter democracy! Remember: Your vote counts, unless you're a resident, in which case it counts half, unless you're a tourist, in which case it counts a little bit, unless you're twelve, in which case it counts the most!
