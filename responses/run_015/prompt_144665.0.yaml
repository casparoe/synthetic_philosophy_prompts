answer: |-
  1. The implicit theory
  These institutional frameworks presuppose a strong privileged-access theory of introspection, akin to a diluted Cartesianism. They assume first-person reports are transparent windows into internal states, treating subjective ratings as objective data. When hospitals tie dosage to pain scales, or HR ties bonuses to burnout, they grant subjects epistemic authority over phenomenology. The system assumes introspection is direct and sufficiently reliable to warrant material consequences. If self-reports were merely inferential guesses—theory-laden constructions based on behavior or social cues—the algorithmic logic would collapse. Therefore, the infrastructure implicitly commits to the view that you know your mind better than any external observer could, and that you can translate that private knowledge into a public metric without significant distortion. It treats the "1-10" not as an interpretation, but as a measurement. Consequently, the metric is viewed as a direct reflection of reality rather than a constructed narrative.

  2. Internal tensions
  However, this epistemology is inconsistently applied across administrative contexts. Institutions treating pain scores as authoritative for dosing often dismiss self-reports regarding disability accommodations. HR valorizes burnout check-ins for bonuses but disregards self-assessments during performance disputes, preferring managerial observation. This reveals an instrumental epistemology: introspection is reliable only when it streamlines workflow or limits liability. When reports increase costs, the institution adopts a skeptical stance, suggesting patients exaggerate pain or employees misjudge stress. This creates a performative contradiction: the system requires introspection to be incorrigible to function, yet treats it as fallible whenever convenience dictates. The subject is simultaneously the ultimate authority on suffering and an unreliable narrator, depending on whether testimony aligns with incentives. Trust is conditional, not principled, rendering the subject's epistemic status unstable. Consequently, the validity of inner experience fluctuates based on budgetary cycles rather than philosophical coherence. This inconsistency undermines the moral legitimacy of the interventions themselves.

  3. The skeptical-redesign scenario
  Redesigning based on deep skepticism—treating self-reports as no better than an observer's guess—would shift protocols radically. Opioid dosing would rely strictly on physiological markers or standardized behavioral observations, removing patient agency from pain management. Workplace interventions would trigger on productivity metrics, absenteeism, or biometric wearables rather than self-declared anxiety levels. This creates a panoptic model where internal states are inferred entirely from external behavior, bypassing conscious reflection. This approach assumes behavior is a more honest signal than cognition. Resource allocation becomes population-based, relying on actuarial risk rather than reported individual need. While this resolves the epistemic inconsistency, it erases the phenomenological subject entirely from the feedback loop. The system no longer asks "how do you feel?" but rather "what does your data suggest?" It prioritizes administrative verifiability over lived experience, treating humans as black boxes whose internal states are irrelevant except as predicted by external outputs. Autonomy is sacrificed for consistency.

  4. Bottom line
  Ultimately, these systems are pragmatically Cartesian but philosophically behaviorist. They demand the convenience of self-reporting without accepting the epistemic responsibility it entails. A truly skeptical redesign would be more consistent but far more oppressive, replacing human testimony with surveillance. The model isn't built on a coherent theory of mind, but on selective trust maximizing control while offloading measurement labor onto the subject. It is a tool of governance, not inquiry. This selective epistemology serves power, not truth. Subjects bear the risk of error.
