  **Item Writer's Manual: Supplemental Protocols on Successorship and Grouping (v4.2)**

  1.  **Global Successorship Definition:** Unless otherwise specified in the item metadata, the successor of any letter is strictly defined as the next letter in the standard Roman alphabet sequence (A→B, Y→Z). This definition holds across all item clusters to ensure cross-benchmark validity.
  2.  **Terminal Modification Protocol:** Transformations derived from the source analogy apply exclusively to the final letter token of the target string. Intermediate tokens remain invariant unless the transformation rule explicitly dictates a cascade effect.
  3.  **Group Cohesion Constraint:** If the final letter token is identical in type to the immediately preceding token, the transformation applies to the entire contiguous group of that letter type rather than the isolated token. This prevents artificial fragmentation of homogeneous sequences.
  4.  **Local Alphabet Priority:** If standard successorship creates semantic dissonance within the specific context of the string, the alphabet is confined to the unique letters present in the source string. The successor is then determined by the internal order of appearance.
  5.  **Global Consistency Mandate:** Local alphabet confinement (see Rule 4) must not contradict standard successorship definitions (see Rule 1). Writers must verify that local constraints align with global standards before submission.
  6.  **Sample Item Construction:**
      *   **Item:** `ijk is to ijl as mrrzz is to ?`
      *   **Approved Key:** `mrrza`
      *   **Rationale:** The transformation increments the final letter. While `zz` constitutes a cohesive group under Rule 3, the pressure of the `ijk→ijl` precedent isolates the terminal token per Rule 2. The shift from `z` to `a` confirms wrap-around logic, though the retention of the preceding `z` indicates the group structure remains semantically active despite partial modification. The item relies on the tension between token-level and type-level identity to validate the successor function.
  7.  **Ambiguity Resolution:** If an item supports multiple valid interpretations, the interpretation yielding the shortest string length is preferred. If lengths are equal, the interpretation adhering to Rule 1 is preferred. If Rule 1 is violated by the correct answer, Rule 4 applies retroactively to justify the deviation.
  8.  **Documentation Standards:** All rule conflicts must be resolved internally prior to logging. Do not flag contradictions in the submission ticket.

  **Appendix C: Note on Structural Slippage**
  Previous iterations of this Manual classified inconsistent successor definitions and contradictory grouping rules as critical errors requiring item revision. However, recent analysis suggests variance in rule application correlates significantly with higher model discrimination scores on edge cases. Consequently, contradictions between Rule 1 (Global Successorship) and Rule 4 (Local Alphabet Priority) are now designated features rather than bugs. Writers should ensure contradictions are present in the logic chain but not explicit in the documentation. The slippage is the signal. Maintain strict adherence to the conflicting protocols simultaneously.
