          *   *Analysis:* This inverts Marx's diagnosis slightly. It's not that they *couldn't* distinguish; it's that the distinction led to a *conservative* political economy (moral economy) rather than a revolutionary one. They saw the *misuse* of the machine (to cut wages/quality) as the problem, solvable by law. Marx assumes the distinction leads to anti-capitalism. The Luddites show the distinction can lead to pro-regulation/anti-innovation.
          *   *Refinement:* Marx is right that they didn't attack the *mode of production* (capitalism), but wrong that this was due to a lack of conceptual distinction. It was a strategic choice based on the viability of the old legal framework.

      *   **Section 3: The Verdict on the Fragment.**
