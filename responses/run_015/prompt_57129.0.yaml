          *   *Option 4 (Braverman/Control vs. Efficiency):* Very strong fit. "Fraudulent" frames = bad goods + control. Masters chose tech for leverage, not just output.
          *   *Selection:* The case best supports the **Labour-Process/Braverman reading (Control)** combined with the **Disciplinary Instrument** reading. It underdetermines the *Grundrisse*/Value Erosion reading because the productive forces weren't developed enough to challenge value theory itself.
          *   *Caveat:* Marx's *Capital* reading is partially vindicated (machinery as weapon) but corrected on the consciousness front (they knew what they were doing).

