      *   *Tension:* Marx says they didn't distinguish. History says they did distinguish, but drew a different political conclusion (reform/regulation vs. revolution).
      *   *Marx (Grundrisse):* Automation leads to general intellect, labor time stops measuring wealth, capitalism collapses.
      *   *History (Luddites):* Early mechanization. Craft knowledge is being captured, but "general intellect" isn't really there yet. It's about deskilling, not post-scarcity.

