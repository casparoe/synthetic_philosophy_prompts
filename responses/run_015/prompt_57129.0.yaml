          *   *Cost to Argument:* The Fragment assumes a smooth transition where labor time loses meaning. Luddism shows the transition is violent, contested, and labor time remains the measure of worth (workers want fair wages for time/skill). The Fragment skips the struggle over the *definition* of value that Luddism highlights. The Fragment is teleological; Luddism is contingent.

