answer: |-
  ### Mapping the Agents: Subsumption and Class Composition

  To map the Luddites onto Marx's categories requires confronting a chronological mismatch between the historical episode and the theoretical abstraction. The machinery chapter in *Capital* Volume One presupposes the dominance of the factory system and the "real subsumption" of labour under capital. In this phase, the worker is separated from the means of production, and the machine dictates the pace and method of work. The Luddites, however, operated largely within "formal subsumption" or a transitional hybrid. The Midlands framework knitters often owned or rented their frames and worked in domestic outwork; the West Riding croppers were highly skilled artisans commanding significant leverage. They were not yet the "free" proletarians of the factory, stripped of tools and reduced to appendages of a central motor.

  Consequently, Marx's account of machinery does not so much misdescribe the episode as arrive early. The category of the "machine" in *Capital* functions as a lever for extracting relative surplus value within a fully capitalist labour process. For the Luddites, the machine was often a tool of independent production that was being *converted* into a lever of capitalist control. The knitters were not resisting the loss of a wage labour position they already held; they were resisting the conversion of their status from semi-independent producers to dependent outworkers or factory hands.

  This misalignment affects the identification of the agent. In *Capital*, the agent of resistance is the collective worker within the factory, whose solidarity is forged by the machinery itself. In 1811–13, the agent was a coalition of trades bound by a "moral economy" rather than a shared factory floor. The framework fits the dynamic of displacement (machinery creating a reserve army), but it misidentifies the class consciousness involved. The Luddites were not fighting as a modern proletariat against the bourgeoisie; they were fighting as a guild-like body against the erosion of customary rights. Marx's apparatus treats the destruction of machinery as a symptom of immature class consciousness rooted in the confusion of tool and relation. However, given that many Luddites *owned* the tools, their attack was not a confusion of property relations but a defense of a specific property relation (the artisan's tool) against a new one (the capitalist's fixed capital). The theory presupposes a phase of development the Luddites had not reached, rendering the diagnosis of "immaturity" partially anachronistic.

  ### Explanation and Failure: The Crux of Distinction

  When running the specific features of 1811–13 through the machinery chapter, the explanatory power is mixed. Marx correctly predicts the alignment of the state with capital; the deployment of troops and the making of frame-breaking a capital offence confirm his thesis that the state acts as the executive committee of the bourgeoisie when property relations are threatened. He also correctly identifies the deskilling logic, particularly regarding the croppers and the power loom weavers, where machinery is introduced to bypass the scarcity of skilled labour and lower wages.

  The crux, however, lies in the direction of violence and the nature of the distinction drawn by the workers. Marx asserts that workers initially attack the material instruments of production because they cannot distinguish between machinery and its employment by capital. They learn over time to attack the mode of production. The Luddite evidence complicates this. The violence was selective: frames belonging to masters who paid fair wages and adhered to customary practices were spared. Frames used to produce "deceitful" goods (wide frames that reduced quality) or by masters who cut wages were destroyed.

  This selectivity suggests the Luddites *did* draw a distinction, but not the one Marx posits. They did not distinguish between the machine-as-technology and the machine-as-capital. Rather, they distinguished between the machine-as-legitimate-tool (within the moral economy) and the machine-as-fraudulent-weapon (outside the moral economy). They recognized the social relation embedded in the machine's use. However, the political conclusion they drew from this distinction diverges from Marx's teleology. Marx assumes that recognizing the social use of the machine leads inevitably to attacking the capitalist mode of production. The Luddites recognized the social use but concluded the remedy was the *restoration* of statutory regulation and the restraint of capital, not its overthrow.

  Does this rescue or invert Marx's diagnosis? It inverts the diagnosis of consciousness but rescues the diagnosis of political limitation. Marx claims the workers fail to see the relation; the Luddites saw the relation clearly but sought to regulate it rather than abolish it. This does not validate Marx's claim that they were "immature" in the sense of being confused; they were politically conservative in the sense of seeking a return to a previous legal order. However, it ultimately supports Marx's broader verdict that attacking the machine is a dead end. Whether due to confusion (Marx's view) or due to a strategic bet on regulation (the historical view), the result was the same: the machinery was not stopped, and the movement was crushed. The theory is vindicated in its outcome (the futility of machine-breaking) but corrected in its psychology (the workers were not conceptually blind, they were politically bound to a dying legalism).

  ### The Verdict on the Fragment

  The "Fragment on Machines" in the *Grundrisse* describes a phase where science and the "general intellect" become the primary productive force, reducing direct labour time to a negligible quantity and thereby undermining exchange value, which rests on labour time as its measure. The Luddite episode bears on this only as a negative pre-history. The Luddite disturbances were not about the general intellect objectifying itself in automation; they were about the expropriation of craft knowledge into simple mechanical motions. The gig mill and the shearing frame did not embody science; they embodied the fragmentation of skill.

  This difference costs the *Grundrisse* argument its historical continuity. The Fragment assumes a trajectory where the development of productive forces automatically creates a contradiction with the relations of production (value). The Luddite case shows that the development of productive forces can initially *strengthen* the relations of production (by disciplining labour and lowering costs) without triggering a crisis of value measurement. For the Luddites, labour time remained the absolute measure of wealth and worth; their grievance was that they were not being paid for the *true* labour time required for quality goods.

  Therefore, the Luddite episode highlights a gap in the Fragment: the transition from craft expropriation to general intellect is not seamless. There is a prolonged intermediate phase where machinery is used to enforce the law of value more ruthlessly, rather than dissolving it. The Fragment projects the end of capitalism based on the potential of automation. The Luddite case demonstrates the resilience of capitalism in the *early* stages of automation, where machinery serves to tighten the grip of value rather than loosen it. The Fragment is a theoretical horizon that the Luddites could not see, not because they were blind, but because the productive forces had not yet developed to the point where labour time was actually becoming an anachronistic measure. To apply the Fragment here is to mistake the struggle over the *rate* of exploitation for a struggle over the *form* of value.

  ### Judgment on Competing Readings

  Running the Luddite case through these four readings yields a clear hierarchy of fit.

  The claim that **automation erodes the measure of value and undermines capitalism's foundation** (the *Grundrisse* reading) is the least supported. In 1811–13, automation did not erode the measure of value; it intensified the struggle over it. The workers fought *for* labour time as a valid measure against masters who sought to devalue it through machinery. The productive forces were not developed enough to challenge the law of value itself.

  The claim associated with **Postone**, that **value survives into a phase in which it is increasingly anachronistic**, is more nuanced but still historically premature. While one can argue the Luddites were fighting for an anachronistic form of production (domestic outwork), the value form itself was not anachronistic; it was ascendant. The tension was not between value and post-value, but between different regimes of accumulation (regulated vs. liberalized).

  The claim that **machinery is chiefly a disciplinary instrument with no such tendency, since displacement is reabsorbed** (the orthodox/orthodox-Marxist reading) finds strong support. The state's violent intervention confirms the disciplinary function. The subsequent history shows that the displaced labour was eventually reabsorbed into the factory system, validating the view that the immediate crisis was one of transition, not systemic collapse.

  However, the case best supports the **labour-process reading descended from Braverman**, on which **machines are chosen for control rather than efficiency**. The Luddite grievance regarding "fraudulent" wide frames and the selective targeting of masters who violated terms aligns perfectly with the thesis that technology is deployed to shift the balance of power. The masters did not adopt gig mills solely for output speed; they adopted them to break the croppers' monopoly on skill. The Luddites understood this better than the abstract theory of "immature struggle" gives them credit for. They knew the machine was a weapon.

  **Conclusion:** The Luddite episode underdetermines the *Grundrisse* and Postone readings because those theories address a maturity of capitalism that did not yet exist. It strongly supports the Braverman and disciplinary readings. The theoretical gap lies in Marx's *Capital* account of consciousness: the theory assumes the distinction between machine and capital leads to revolution. The Luddites show that distinction can lead to a defensive legalism. The theory explains why they failed (the state protects the mode of production), but it misreads their agency (they were not confused, they were outmaneuvered). The case suggests that automation in its early phases reinforces the law of value and capitalist control, and that the "collapse" scenarios rely on a level of technical development that turns labour time into a fiction, a threshold the Luddites had not crossed.
