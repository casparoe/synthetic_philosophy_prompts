answer: |-
  This is a classic move in contemporary mereology (the study of parts and wholes), usually associated with **Mereological Nihilism** (or Compositional Nihilism). Your friend is asserting that composition never occurs: there are no composite objects, only simples (particles) arranged in various ways.

  Your hunch is correct: the slogan "particles arranged chair-wise" is doing a tremendous amount of heavy lifting, and it often functions as a conversation-stopper rather than an argument. For your paper, you need to pry open the slogan to see if the machinery inside actually supports his conclusion about the flat-packed chair.

  Here is a breakdown of the distinct readings of his claim, their verdicts, and an analysis of whether they actually dissolve the survival question.

  ### 1. Disambiguating "Just Particles Arranged Chair-Wise"

  #### Reading A: Hard Eliminativism (Error Theory)
  **The Claim:** Sentences like "There is a chair in the corner" are strictly **false**. There are no chairs. There are only particles. When we say "chair," we are making a systematic error, like saying "There is a witch" in a world without witches.
  **Verdict:** **Substantive but Probably Wrong (High Cost).**
  This is a coherent metaphysical position (defended by philosophers like Peter van Inwagen in some moods, or Richard Joyce in ethics). However, it faces the "Moorean Shift": the claim "I am holding a chair" is more certain than the complex metaphysical argument for Nihilism. It requires us to accept that almost all our ordinary beliefs are false.
  **Does it dissolve the survival question?** **Yes, but trivially.**
  If chairs don't exist, the question "Did the chair survive?" presupposes something false (that there was a chair to begin with). It's like asking, "Did the witch fly to the new apartment?" There is no fact of the matter because there are no witches. *However*, this doesn't solve your practical worry; it just tells you your worry was category-mistaken.

  #### Reading B: Analytic Nihilism (Paraphrase Strategy)
  **The Claim:** Sentences like "There is a chair" are **true**, but their logical form is not what it seems. "There is a chair" is shorthand for "There are particles arranged chair-wise." The ontology changes (no wholes), but the truth-values of ordinary sentences stay the same.
  **Verdict:** **Substantive and Defensible.**
  This is the most sophisticated version of the view (associated with Trenton Merricks). It tries to save ordinary talk while revising metaphysics.
  **Does it dissolve the survival question?** **No.**
  On this reading, the question "Did the chair survive?" translates to "Did the particles arranged chair-wise at $t_1$ persist such that there are particles arranged chair-wise at $t_2$ in the right causal relation?" This is a perfectly good question with a yes/no answer. Your friend cannot use this reading to say "there is no fact of the matter." He must answer the question about the particles.

  #### Reading C: Plural Quantification (Ontological Innocence)
  **The Claim:** When we say "the chair," we are not referring to a singular object *over and above* the particles, nor are we speaking falsely. We are referring **plurally** to the particles. "The chair is heavy" means "Those particles are heavy."
  **Verdict:** **Confused (if used to deny existence).**
  If "the chair" just refers to the particles, then the chair *does* exist—it's just a plurality. This collapses into the view that composite objects exist but are "nothing over and above" their parts. If he uses this to say "there is no chair," he is contradicting himself, because he just admitted "the chair" refers to the particles that exist.
  **Does it dissolve the survival question?** **No.**
  If the chair *is* the particles, then the chair survives if and only if the particles survive (or the relevant plurality persists). The question returns immediately.

  #### Reading D: The SCQ Dodge (Brute Denial)
  **The Claim:** He is simply denying a specific answer to the **Special Composition Question** (Under what conditions do parts compose a whole?) by saying "Never."
  **Verdict:** **Substantive but Incomplete.**
  This is the core metaphysical claim. But merely asserting "Never" doesn't explain *why* "arranged chair-wise" is a valid description if "chair" is invalid.
  **Does it dissolve the survival question?** **Only if combined with Reading A.**
  If he just denies composition but keeps ordinary language (Reading B), the question returns. If he denies composition and ordinary truth (Reading A), the question is dissolved via error theory.

  ---

  ### 2. The Real Crux: The "Arranged Chair-Wise" Smuggle

  You hit the nail on the head. The phrase "arranged chair-wise" is the weak point in your friend's armor. This is where your paper should focus.

  **The Problem:**
  To say particles are "arranged **chair-wise**" is to use the concept of a *chair* to describe the arrangement of particles.
  1.  **Parasitic Concepts:** The predicate "chair-wise" is defined by the functional and structural properties of... a chair. You cannot explain what "chair-wise" means without referencing what a chair *is* (a seat, with legs, for sitting, etc.).
  2.  **The Return of the Properties:** If the particles are "arranged chair-wise," they collectively instantiate the property *being arranged chair-wise*. But isn't *being arranged chair-wise* just the property *being a chair* described differently?
      *   If the particles have the causal powers of a chair (you can sit on them, they block light like a chair), then for all metaphysical purposes, **they are a chair.**
      *   If the Nihilist says, "They have all the properties of a chair, but they aren't a chair," he is positing a distinction without a difference. This is often called a **"Cambridge Property"** objection.

  **Why this matters for your paper:**
  If "arranged chair-wise" smuggles in all the facts about chairs (function, shape, persistence conditions), then the Nihilist hasn't eliminated chairs; he has just hidden them in the adverbs.

  ### 3. Does the Survival Question Evaporate?

  Your friend claims there is "no fact of the matter" about whether the flat-packed chair survived. Let's test this against the "Arranged" smuggle.

  **The Scenario:**
  *   $t_1$: Particles $P_1$ are arranged chair-wise (in the box).
  *   $t_2$: Particles $P_2$ are arranged chair-wise (in your apartment).
  *   Question: Is the chair at $t_2$ the *same* as the chair at $t_1$?

  **The Nihilist's Dilemma:**
  1.  **If he is an Eliminativist (Reading A):** He says, "There is no chair, so no identity." **Verdict:** The question evaporates, but only because he declared the subject matter nonexistent. This is a verbal victory, not a metaphysical insight. It doesn't help you understand the relationship between $P_1$ and $P_2$.
  2.  **If he is a Paraphraser (Reading B):** He must answer: "Are the particles at $t_2$ the *same arrangement* as $t_1$?"
      *   Now the question becomes: **What are the persistence conditions for an *arrangement*?**
      *   If the particles are scattered in the box, are they "arranged chair-wise"? Maybe not. They are "arranged box-wise."
      *   When you assemble them, new particles might be added (screws), or old ones lost (sawdust).
      *   The Nihilist now has to answer the **exact same puzzle** you originally asked, but phrased as "Do the particles maintain the *chair-wise arrangement* relation over time?"

  **Conclusion for your paper:**
  The survival question **does not evaporate** on the most defensible readings (Paraphrase/Plural). It merely shifts from "Do *wholes* persist?" to "Do *arrangements* persist?"

  But "arrangement persistence" is just "object persistence" in disguise. If the particles maintain the "chair-wise" relation through the disassembly/reassembly process, then the "chair" survived. If they don't, it didn't. The Nihilist cannot say "there is no fact of the matter" unless he is willing to say there is no fact of the matter about whether the particles are causally connected in the right way. But there *is* a fact about that.

  ### Recommendation for Your Paper Structure

  1.  **Introduction:** Identify the position as Mereological Nihilism. State your thesis: The slogan "arranged chair-wise" fails to dissolve the problem of diachronic identity (survival) because it either reintroduces the problem at the level of particles or relies on an untenable error theory.
  2.  **Section 1: The Three Readings.** Briefly outline Eliminativism, Paraphrase, and Plural Reference. Assign the verdicts listed above.
  3.  **Section 2: The Survival Test.** Show that on the Paraphrase reading (the most plausible one), the question "Did the chair survive?" translates to "Did the chair-wise arrangement persist?" This is a substantive question with a true/false answer, contradicting your friend's claim that there is "no fact of the matter."
  4.  **Section 3: The "Arranged" Smuggle (The Killer Argument).** Argue that "arranged chair-wise" is ontologically costly. It requires the world to contain facts about "chair-wise-ness." If the world contains facts that make "There is a chair" true (in terms of truth-conditions), eliminating the word "chair" is merely linguistic pruning, not ontological parsimony.
  5.  **Conclusion:** Your friend's move is a verbal trick. It changes the subject from *objects* to *arrangements*, but since arrangements of particles *just are* what we mean by objects, the metaphysical problem remains untouched.

  **One final tip:** If you want to cite a specific philosopher who attacks this "arranged F-wise" language, look up **Ted Sider** (specifically his discussions on *ontological realism* vs. *quantifier variance*) or **David Lewis** (who argued that if it quacks like a duck, it's a duck, regardless of mereological sums). But your own intuition about the "smuggle" is philosophically sound and sufficient for a strong paper.
