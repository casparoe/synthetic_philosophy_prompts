answer: |-
  # Exercise Design: The Laundering Protocol
  **Course:** Advanced Seminar in Social Choice Theory  
  **Session:** Pre-Gibbard-Satterthwaite Intuition Building  
  **Duration:** 60 Minutes  
  **Participants:** 18 Students (15 Principals, 3 Agenda Setters)  

  ## 1. Learning Objective
  To induce a lived experience of **strategic inevitability**. Participants will face an institutional structure where sincere revelation is dominated by strategic misrepresentation due to the interaction between delegation incentives and agenda control, mirroring the conditions of the Gibbard-Satterthwaite (GS) theorem without invoking its formal proof.

  ## 2. Scenario & Outcomes
  The group must select one structure for the final module:
  *   **Option A:** Comprehensive Final Examination
  *   **Option B:** Independent Research Paper
  *   **Option C:** Collaborative Group Presentation

  ## 3. Hidden Information Structure
  Upon entering, each student draws a sealed **Identity Envelope**. This determines their private payoff modifier. This information is **private**; students know their own type but not others'.

  *   **Type S (Sincere):** 9 Students.
      *   *Bonus Condition:* Earn **+5 Points** if their *submitted delegation* matches their *true cardinal ranking*.
  *   **Type C (Coalition):** 9 Students.
      *   *Bonus Condition:* Earn **+5 Points** if their *submitted delegation* matches the *Agenda Setter's public stance* on the winning option.

  **Base Payoff (All Types):**
  *   **+10 Points** if your *True Top-Ranked Option* wins the final selection.
  *   **0 Points** otherwise.

  **Total Possible:** 15 Points.
  **Rational Tension:** Type C students *must* misrepresent preferences if they believe the winning option differs from their true top to secure the bonus. Type S students are pressured to misrepresent because they cannot identify Type C peers to form a sincere bloc, and they fear the Agenda Setters will purge their preferred option.

  ## 4. The Mechanism: Preference-Laundering
  ### Stage 1: Delegated Preference Submission (Minutes 10–25)
  *   **Principals (15):** Complete a **Delegation Slip**.
      *   List true ranking (A > B > C).
      *   List *delegated* vector (can be identical or different).
      *   Submit slip to one of the three **Agenda Setters** (assigned randomly at start).
      *   *Constraint:* 5 Principals per Agenda Setter.
  *   **Agenda Setters (3):** Collect slips. Do not reveal contents yet.

  ### Stage 2: Agenda Composition & Omission (Minutes 25–40)
  *   **Agenda Setters:** Aggregate the 5 delegated vectors they received.
  *   **The Power of Omission:** Each Agenda Setter constructs a **Public Ballot** using a Modified Borda Count.
      *   *Rule:* You may **omit** one option from the final calculation if you deem it "polarizing" (Strategic Veto).
      *   *Rule:* You must weight the delegated vectors. You may weight your own "interpretation" of the group's will up to 40% of the total score.
  *   **Output:** Each Agenda Setter posts a Public Ballot showing the scores of the *remaining* options.
  *   **Selection:** The option with the highest aggregate score across all three Agenda Setters' Public Ballots wins.

  ## 5. Timeline (60 Minutes)

  | Time | Phase | Activity | Facilitator Notes |
  | :--- | :--- | :--- | :--- |
  | **00–05** | **Setup** | Distribute Identity Envelopes. Assign 3 Agenda Setters (random draw). | Emphasize: "Do not open envelopes until instructed. Do not show others." |
  | **05–10** | **Briefing** | Explain Rules, Payoffs, and Mechanism. | Stress the **Omission Power**. "Agenda Setters can delete an option." |
  | **10–25** | **Stage 1** | Principals fill Delegation Slips. Submit to Agenda Setters. | **Silence Rule:** No discussion of true preferences. Informal signaling allowed. |
  | **25–35** | **Stage 2** | Agenda Setters calculate Public Ballots (on board). | Facilitator monitors for "Omission." If an option is omitted, announce it. |
  | **35–45** | **Reveal** | Announce Winner. Collect Payoff Claims. | Students self-report points based on rules. (Honor system for debrief speed). |
  | **45–60** | **Debrief** | Map experience to GS Theorem. | Critical phase. See Section 7. |

  ## 6. Payoff Matrix (Student View)

  | Outcome Scenario | Type S (Sincere) Payoff | Type C (Coalition) Payoff |
  | :--- | :--- | :--- |
  | **True Top Wins + Submitted Truthfully** | 10 (Outcome) + 5 (Bonus) = **15** | 10 (Outcome) + 0 (Bonus) = **10** |
  | **True Top Wins + Submitted Strategically** | 10 (Outcome) + 0 (Bonus) = **10** | 10 (Outcome) + 5 (Bonus) = **15** |
  | **True Top Loses + Submitted Truthfully** | 0 (Outcome) + 5 (Bonus) = **5** | 0 (Outcome) + 0 (Bonus) = **0** |
  | **True Top Loses + Submitted Strategically*** | 0 (Outcome) + 0 (Bonus) = **0** | 0 (Outcome) + 5 (Bonus) = **5** |

  *\*Strategic Submission means aligning with the Winning Option's coalition.*

  **Dominant Strategy Analysis (for Debrief):**
  *   **Type C:** Always incentivized to align delegation with the *predicted winner*, not true preference.
  *   **Type S:** Incentivized to vote truthfully *only if* they are certain their top choice will win. If uncertainty exists, the risk of getting 0 points pushes them toward hedging (manipulation).

  ## 7. Debrief Plan: Mapping to Gibbard-Satterthwaite
  *Do not resolve the tension immediately. Let the confusion linger for the first 5 minutes of debrief.*

  ### A. Concrete Moments to Theoretical Conditions
  1.  **The Omission Power (Agenda Stage):**
      *   *Observation:* Did an Agenda Setter remove an option?
      *   *GS Mapping:* This violates **Universal Domain** (unrestricted preferences). By removing an option, the mechanism restricts the domain of the final choice, effectively creating a local dictatorship. This demonstrates how "strategy-proofness" often relies on limiting the agenda, which itself is a manipulable act.
  2.  **The Delegation Slip (Stage 1):**
      *   *Observation:* Did a student submit a vector different from their true ranking?
      *   *GS Mapping:* This is **Manipulability**. A voter achieved a higher expected payoff (or avoided a lower one) by misrepresenting preferences. Under GS, if a system is not dictatorial and has $\ge 3$ outcomes, this *must* be possible.
  3.  **The Hidden Types:**
      *   *Observation:* Did Type S students lie because they feared Type C students?
      *   *GS Mapping:* This illustrates **Incomplete Information** pressure. GS assumes complete information, but the *fear* of manipulation by others drives sincere voters to manipulate, reinforcing the theorem's inevitability in real-world settings.

  ### B. The Limitation of the Exercise
  **State Clearly:** "This exercise demonstrates manipulability in *this specific mechanism*. The Gibbard-Satterthwaite theorem is stronger: it states that **no** deterministic voting system (with $\ge 3$ outcomes) is immune. We cannot test 'all systems' today, but we have tested one complex system and found it wanting. The theorem proves you cannot design a 'perfect' system to fix the friction you just felt."

  ### C. Universal Quantification Gap
  The exercise cannot reproduce the **Universal Quantification over All Preference Profiles**. We only ran one profile (the one generated today). GS proves there exists *at least one* profile where manipulation works for *any* system. We showed manipulation works *here*, but we cannot prove it would work for *every* possible arrangement of student preferences without the formal math.

  ## 8. Prediction of Failure & Facilitator Advice

  ### Predicted Failure Point: The Proxy Layer Confusion
  **What will go wrong:** During Stage 2, Principals will become anxious because they lose agency. They may shout out to Agenda Setters or try to renegotiate their slips. Agenda Setters may freeze, unsure how to apply the "40% weight" rule or the "Omission" rule, causing a time overrun.
  **Why:** The cognitive load of "delegating a vector" + "hidden payoff types" + "agenda omission" is too high for a 15-minute window.

  **Facilitator Management Strategy:**
  1.  **Do Not Clarify Payoffs Mid-Game:** If a student asks, "Do I get points if I lie?" respond: "The rules are fixed. Maximize your points." Resolving this prematurely dissolves the strategic tension.
  2.  **The "Black Box" Intervention:** If Agenda Setters stall at Minute 30, step in and say: "Agenda Setters, you must declare the Omission now. Principals, you cannot intervene." This enforces the *institutional pressure* rather than solving the confusion. The frustration *is* the data.
  3.  **Calculation Shortcut:** If Borda math takes too long, have Agenda Setters simply declare a winner based on "plurality of delegated top choices" but retain the right to Veto one option. Simplify the math to save time for the debrief.
  4.  **Handling Cynicism:** If students collude to split points (e.g., "Let's all vote B so everyone gets 5"), acknowledge it in the debrief as **Coalition Formation**, which GS treats as a form of manipulation (violating Individual Rationality).

  ### Final Facilitator Note
  Your goal is not a smooth simulation. Your goal is a **frustrating** one. If students leave feeling that the rules forced them to lie to protect their grade, the exercise has succeeded. If they leave feeling they voted honestly and the system worked, the exercise has failed. Prioritize the debrief time over the voting time if necessary.
