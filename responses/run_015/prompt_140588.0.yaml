      Okoye: You are assuming the office exists in a vacuum. It doesn't. It is embedded in a social fabric where kinship is the primary safety net. If Nkechi follows your impersonal standard, she loses the support that secured her post and protects her family. You ask her to be a lone hero of bureaucracy in a system designed to fail her. However, I will concede this: her act does harm the villages ranked second and third. They suffer a material delay. I do not deny the harm. I deny that the label "corruption" fits when the alternative is social suicide within the only functioning governance structure available.

      Lindqvist: I concede that the state's illegitimacy mitigates her moral blame. She is not a villain; she is a participant in a survival strategy. But mitigation of blame is not the same as redefining the act. Now, consider this relabeling test. Suppose Nkechi framed this same act not as kin obligation, but as constituency service for a local patron, or simply as a gift between personal friends. The material flow is identical: water flows to Uncle instead of Village B. If you would condemn those acts but excuse this one, your view tracks presentation rather than substance. Why is kinship morally distinct from friendship or patronage in this context?

      Okoye: It is distinct because kinship here is structural, not merely personal. Friendship is voluntary; kinship is obligatory and systemic. In this region, the kin network *is* the social security system. Treating a friend is a choice; treating kin is a requirement for membership in the community. If I condemn patronage, it is because it is extractive. Kinship obligation here is redistributive within a closed loop of survival. However, I see your point. If the effect is identical, the distinction might be thinner than I prefer. I will concede that if the harm to the excluded villages is severe, the justification weakens regardless of the relational label.

      Lindqvist: Then we are closer. You admit the harm matters, and I admit the context matters for blame. But we still diverge on the definition. You seem to suggest that corruption requires a functioning state to betray. I argue corruption is the betrayal of the office's purpose, regardless of the state's capacity. My response to your scaffolding objection is this: the normativity of the office does not depend on the state's current provision. It depends on the telos of the role. A doctor is a doctor even in a war zone; a water engineer is a public servant even in a failed state. To say otherwise is to say public power vanishes when the state weakens, which is precisely when we need the concept most.

      Okoye: And I say that applying the label "corruption" in such contexts is a category error. It treats a survival mechanism as a moral failing. But perhaps we are arguing past each other. You want to preserve the definition of corruption as strict misuse of office. I want to reserve the word for situations where there is a legitimate public trust to violate. If we agree that the act is harmful and problematic, are we fighting over the word itself?

      Lindqvist: Precisely. You want the word to carry a threshold of institutional legitimacy before it applies. I want the word to describe the structural defect in the action itself. So, are we disagreeing about what corruption is, or only about how much wrongness the word should carry?

      Okoye: I think we agree on the wrongness. We agree Nkechi's act harms the public good and is driven by partiality. We disagree on whether the term "corruption" applies when the public good is largely fictional. You think the term applies to the act's form; I think it applies to the act's context.

      Lindqvist: Then our disagreement turns on whether the definition of corruption requires a legitimate state counterpart. I say no; you say yes.

      Okoye: Correct. And that determines whether we judge Nkechi by the standards of the state she works for, or the community she lives in.

      Lindqvist: Then we have clarified the ground. We agree on the harm, but not on the label's prerequisites.

      \answer{Whether the definition of corruption requires a legitimate state apparatus to betray.}

