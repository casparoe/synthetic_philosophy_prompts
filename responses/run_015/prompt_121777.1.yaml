      *   *Objection 6 (Historians):* Scale. Micro-chaos doesn't entail macro-chaos. Aggregation smooths things out.
      *   *Objection 7 (General/Methodological):* Falsifiability. If every counterfactual is unstable, how do we test anything?

      *Refining Order by Damage:*
      1.  Epistemic vs. Metaphysical (The "Praying Nobody Asks" - actually needs to be high damage if asked).
