      *   *Modern Historians:* They will attack the empirical plausibility. They care about institutional resilience, buffer zones, and the fact that history isn't *that* sensitive because structures absorb shocks. They think "chaos" is a buzzword misapplied to social systems.
      *   *Economic Historian:* They care about path dependence. They might agree with the sensitivity but argue that institutions lock in paths, creating stability *after* the bifurcation. They might see "micro-bifurcation" as compatible with macro-path dependence.
