  6.  **Final Polish:**
      *   Ensure the distinction between epistemic and metaphysical is sharp.
      *   Ensure the historians' objection about institutional behaviour is addressed with more than just "chaos exists."
      *   Check the tone: Senior consultant advising a colleague. Direct, supportive but critical.

