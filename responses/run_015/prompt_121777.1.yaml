      5.  Path Dependence Compatibility (Economic historian's angle).
      6.  Macro/Micro Scale (Historians' second line).
      7.  Falsifiability/Triviality (General methodological worry).

      *Wait, the prompt asks for the "praying nobody asks" question to be included.* I should make sure it's prominent. The prompt says "Include the one question I'm praying nobody asks...". I will integrate this into the 7 objections as the most damaging one (Obj 1).

      *Refining the "Weakest Point":* The thesis relies on "identity conditions of later institutional events." Defining when an institution is "the same" across possible worlds is notoriously difficult. This is the soft underbelly.

      *Refining "Concede Upfront":* I should concede that chaos doesn't rule out *all* causal claims, only those relying on long-chain counterfactual stability. This shows nuance.

  4.  **Drafting Content (British English, Practical Tone):**
      *   *Vocab:* Modal realism, similarity metrics, ceteris paribus, institutional resilience, locking-in, epistemic access, metaphysical indeterminacy.
