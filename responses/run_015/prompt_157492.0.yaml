      *   **Topic:** Philosophy of Biology, specifically the debate over biological function (Etiological vs. Causal Role).
      *   **Core Question:** Audit the "Heart vs. Pump" analogy. Provide a correspondence table. Identify where it breaks (especially regarding vestigial parts like the appendix and symbionts like gut bacteria). Evaluate if the etiological view (history matters) survives without the analogy. Suggest better analogies (ecology vs. engineering).
      *   **Tone:** Respectful, intellectually rigorous but accessible (peer-to-peer scientist), acknowledging their expertise while bridging to philosophy.

