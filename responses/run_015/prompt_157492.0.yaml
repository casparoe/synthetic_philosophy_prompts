      *   *The "Whole" Problem:* Pumps are made *for* the plumbing. Hearts evolved *within* the organism. Who is the "user"?
      *   *Vestigial Traits (Appendix):* A pump installed for no reason breaks the analogy. In engineering, useless parts are removed. In biology, they linger (drift, exaptation).
