answer: |-
  **Project Title:** The Metaphysics of Continuity: Re-evaluating the Notion of Preservation in Structural Realism

  **Project Summary**
  Structural realism (SR) is frequently defended via the argument from continuity: while specific ontological posits (ether, caloric) are discarded during theory change, the mathematical structure of the theory is preserved in the successor. This project argues that the notion of "preservation" underpinning this argument is philosophically under-specified. Both Epistemic Structural Realism (ESR) and Ontic Structural Realism (OSR) rely on a robust notion of structural continuity to evade the Pessimistic Meta-Induction, yet neither provides a sufficient account of what constitutes identity or similarity across distinct theoretical frameworks. This fellowship year will be dedicated to defining a precise criterion for structural preservation. I propose shifting the criterion from formal mathematical similarity to *explanatory-role preservation*. The project will determine whether this shift salvages SR from deflationary objections or reveals the continuity argument to be merely pragmatic rather than metaphysical.

  **Theoretical Background & The Gap**
  The standard defense of SR rests on the claim that theory change is not revolutionary but evolutionary. When a theory $T_1$ is superseded by $T_2$, the entities of $T_1$ are rejected, but the structure is retained. This is the "Continuity Premise." However, "retention" is ambiguous.

  For the ESR, retention justifies induction: we can know the structure because it is the only part that survives. For the OSR, retention is ontological: the world *is* the structure that survives. Both positions face a dilemma regarding the Continuity Premise.
  1.  **The Triviality Horn:** If preservation means "some mathematical formalism remains similar," the claim is too weak to support realism. Almost any two theories share some formal properties.
  2.  **The Correspondence Horn:** If preservation means "the structures refer to the same relations," SR requires a theory of intertheoretic reference that it currently lacks. How do we map relations from an ontology we reject to one we accept without smuggling in the rejected ontology?

  Current literature treats preservation as a brute historical fact. This project treats it as the primary philosophical problem. Without a defended account of *what* is preserved and *why* it counts as preservation, the structuralist solution to the PMI is incomplete.

  **The Proposal: An Explanatory Account of Preservation**
  I will argue that structural preservation should not be defined by formal identity (e.g., limiting cases where equations converge) but by *explanatory continuity*. A structure is preserved if and only if it continues to license the same successful inferences and counterfactuals in the successor theory that it did in the predecessor.

  This "Explanatory-Role Preservation" (ERP) account offers two advantages:
  1.  **It avoids triviality.** Mere formal similarity is insufficient; the structure must do the same *work*. This filters out accidental mathematical overlaps.
  2.  **It relocates the deflationary objection.** The standard objection is that SR is just instrumentalism in disguise. By grounding preservation in explanatory role, we acknowledge that the "surviving" structure is identified by its utility. The question then becomes: does explanatory utility track mind-independent structure, or is it purely pragmatic?

  This moves the debate from "Did the equations survive?" to "Did the inferential power survive, and what does that imply about the world?" This allows for a more nuanced defense of OSR: if the world is structure, it is specifically the structure that sustains explanatory power across conceptual shifts.

  **Methodology & Work Plan**
  The project will proceed through three phases: conceptual analysis, case study application, and synthesis.

  *   **Months 1–3: Conceptual Archaeology.**
      *   Systematic reconstruction of the "preservation" claim in key SR texts.
      *   Formalization of the Continuity Premise.
      *   Drafting of the distinction between "Formal Preservation" (mathematical limit) and "Explanatory Preservation" (inferential role).
      *   *Deliverable:* Working paper on the taxonomy of preservation claims.

  *   **Months 4–7: Case Study Analysis.**
      *   Application of the ERP account to two paradigmatic transitions: Fresnel to Maxwell (optics) and Newton to Einstein (gravitation).
      *   Testing whether the "preserved" structure in these cases aligns with formal similarity or explanatory role.
      *   Investigating instances where formal structure survives but explanatory role changes (e.g., mathematical tools repurposed for different ontologies).
      *   *Deliverable:* Conference presentation and draft chapter on case studies.

  *   **Months 8–10: Synthesis and Objection Handling.**
      *   Evaluating ERP against deflationary objections (e.g., van Fraassen's constructive empiricism).
      *   Determining if ERP forces SR into instrumentalism or supports a robust ontic claim.
      *   *Deliverable:* Full draft of the monograph/article.

  *   **Months 11–12: Revision and Dissemination.**
      *   Peer review feedback integration.
      *   Finalizing the manuscript for submission.
      *   Planning the next research phase based on outcomes.

  **Significance**
  This project addresses a foundational weakness in one of the dominant positions in philosophy of science. By isolating the concept of preservation, it clarifies the commitments required to be a structural realist. If successful, it provides SR with a more robust defense against the PMI. If unsuccessful, it clarifies why the continuity argument fails, pushing the field toward either entity realism or anti-realism.

  **Risk Assessment & Failure Conditions**
  Intellectual honesty requires specifying what would constitute the failure of this project. The hypothesis that "Explanatory-Role Preservation" saves Structural Realism could fail in two specific ways:

  1.  **The Instrumentalist Collapse:** If analysis shows that "explanatory role" is entirely theory-relative and cannot be compared across incommensurable frameworks, then ERP reduces to pragmatism. In this case, the project will conclude that SR cannot ground realism on continuity alone. This is a substantive philosophical result, but it counts as a failure of the *defense* of SR.
  2.  **The Historical Mismatch:** If historical case studies reveal that the structures doing the explanatory work are *not* the structures that are mathematically preserved (i.e., the math stays but the explanation changes, or vice versa), then the link between continuity and truth is broken.

  In either failure scenario, the output will be a rigorous demonstration that the "Continuity Premise" is untenable in its current form. This negative result is valuable, as it prevents the continued reliance on an undefended assumption. However, the primary goal remains to construct a viable account of preservation that sustains a realist interpretation of scientific progress. The timeline allows for pivoting: if the ERP account fails in Months 4–7, Months 8–10 will be dedicated to articulating the precise reasons for the failure, ensuring the fellowship yields a defensible conclusion regardless of the hypothesis's validity.
