answer: |-
  If we accept the framing that Plutarch's *Parallel Lives* function as instruments of moral calibration rather than repositories of direct heroic exemplars, the pedagogical mechanism of hagiographic biography shifts fundamentally. Under this model, the text does not demand imitation ("do what Alexander did") but rather invites judgment ("weigh Alexander's ambition against Caesar's"). This reframing yields three critical implications for how biography teaches moral reasoning.

  **1. The Necessity of Detecting Stylization Over Literal Acceptance**
  Effective moral calibration requires the reader to detect and account for the author's stylization rather than accepting the portraits literally. In an imitation model, factual precision is paramount because the reader intends to replicate specific actions. In a calibration model, however, the "distortion"—Plutarch's selective emphasis on anecdotes that reveal character over comprehensive historical record—is a functional feature, not a bug. Plutarch explicitly notes that he is writing lives, not histories; he amplifies certain traits to make the moral signal visible against the noise of historical complexity.

  For calibration to work, the reader must recognize this amplification. If a reader accepts the hagiography as literal truth, they risk calibrating their moral scale against an impossible standard, leading to cynicism when they inevitably fail to match the ideal. However, if the reader recognizes the portrait as a constructed moral argument, they can use the distortion to test their own judgment. They learn to ask not "Did this happen exactly this way?" but "Why is this trait being highlighted, and how does it weigh against the subject's flaws?" Therefore, the biography teaches best when the reader engages in a critical dialogue with the text, identifying the rhetorical shaping to refine their own sensitivity to virtue and vice.

  **2. The Dialectic of the Greek-Roman Pairing**
  The juxtaposition of Greek and Roman lives fundamentally alters the calibration metric by introducing a cross-cultural dialectic that single-national biography cannot achieve. A single-national biography risks reinforcing ethnocentric biases, suggesting that virtue is synonymous with a specific cultural identity (e.g., "To be virtuous is to be Roman"). By pairing a Greek with a Roman (e.g., Demosthenes with Cicero, Alexander with Caesar), Plutarch forces the reader to decouple virtue from nationality.

  This pairing complicates the metric. The reader cannot simply apply a static rule; they must weigh how different political contexts, cultural expectations, and historical pressures influence moral action. The calibration becomes relational and contextual. It teaches that while core virtues (courage, wisdom, justice) may be universal, their expression is contingent. This prevents the reader from developing a rigid, dogmatic moral scale. Instead, they develop a flexible *phronesis* (practical wisdom), learning to evaluate character across different frameworks. The "parallel" structure ensures that the reader's internal scale is tested against variance, making the resulting moral judgment more robust than if it were derived from a singular cultural narrative.

  **3. Implications for Modern Pedagogical Reliability**
  This calibration model suggests that biography is a *more* reliable moral teaching tool than traditionally assumed, provided its usage shifts from prescriptive to analytical. In modern pedagogy, biography is often viewed with suspicion; critics argue that "Great Man" histories are factually unreliable or that holding up flawed individuals as heroes is hypocritical. If biography is treated as a source of literal exemplars, these criticisms hold weight.

  However, if biography is treated as a calibration tool, its reliability increases because its value no longer rests on the subject's perfection or the narrative's absolute factual precision. Instead, its reliability rests on its capacity to stimulate moral reasoning. A modern classroom using this model would not ask students to emulate a figure like Steve Jobs or Martin Luther King Jr. uncritically. Instead, it would pair contrasting figures to force a calibration of values (e.g., comparing the visionary drive of one leader against the collaborative ethics of another). This makes biography less vulnerable to the "idolization" critique. It transforms the genre from a collection of statues to be worshipped into a gymnasium for the moral imagination. Consequently, biography becomes a highly reliable tool for teaching ethical nuance, as long as the pedagogy emphasizes the *process* of judgment over the *product* of the life story.

  **Conclusion**
  Viewing Plutarch's *Lives* as instruments of calibration implies that hagiographic biography teaches not by providing answers, but by refining the questions we ask about character. It demands a reader who is alert to literary shaping, comfortable with cross-cultural comparison, and engaged in active moral reasoning. Under this framing, biography ceases to be a fragile vessel of historical truth and becomes a durable technology for ethical development.
