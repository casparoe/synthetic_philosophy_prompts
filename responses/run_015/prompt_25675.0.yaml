      *   *Alternative:* Argue for **Duty to Correct**.
      *   *Let's go with the Historical/Responsibilist Evidentialism.* It preserves the "evidence" language but adds the diachronic dimension needed for blame.

  8.  **Final Polish:** Check against the prompt requirements.
