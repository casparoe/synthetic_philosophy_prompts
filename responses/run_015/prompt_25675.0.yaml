      *   *Actually, the strongest move:* **Revise (e).** Distinguish *Epistemic Blame* from *Epistemic Justification*. One can be unjustified (if we say the evidence doesn't count) OR one can be justified but blameworthy (historical view).
      *   *Wait, looking at (f):* (f) says the evidence *actually doesn't support the claim*. This implies the hearer is *unjustified* in believing the woman. But (e) says they are blameworthy for *not believing* (assigning less credibility).
      *   *Correction:* If (f) is true (evidence says she's unreliable), then not believing her is *justified* by (d). So (e) (blameworthy for not believing) contradicts (d)+(f).
