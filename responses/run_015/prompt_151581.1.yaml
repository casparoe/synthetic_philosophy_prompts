answer: |-
  **MEMORANDUM**

  **TO:** Museum Board of Directors
  **FROM:** Acquisitions Committee
  **DATE:** October 26, 2023
  **SUBJECT:** Decision on Proposal for Temporary Exhibit "Parallel Timelines"

  **DECISION**

  The Acquisitions Committee recommends **Conditional Approval** of the "Parallel Timelines" exhibit proposal. This approval is contingent upon substantial modifications to the exhibit's interpretive framework and display design. The proposal, as currently submitted, cannot be approved in its present form because the proposed symmetrical presentation violates the museum's institutional demarcation standards regarding scientific and historical consensus.

  **RATIONALE AND DEMARCATION STANDARDS**

  The core objection to the current design lies in the proposed symmetrical display panels that present conventional archaeology and Anatoly Fomenko's "New Chronology" side-by-side without distinguishing their epistemic status. This format implies epistemic parity where none exists. Our institutional mandate requires us to distinguish between legitimate historical revisionism and pseudohistory based on specific demarcation criteria.

  Legitimate revisionism is characterized by hypotheses that are testable, subject to peer review within relevant disciplines, and responsive to anomalous data through methodological refinement. In contrast, pseudohistory relies on post-hoc pattern matching that evades falsification. Fomenko's New Chronology falls squarely into the latter category. It utilizes statistical correlations to assert that ancient civilizations are phantom duplicates of medieval events, yet it ignores or dismisses physical dating methods such as radiocarbon dating, dendrochronology, and astronomical record verification. Because the theory is structured to explain away contradictory evidence rather than accommodate it, it fails the falsifiability criterion essential to scientific and historical inquiry.

  Presenting these two frameworks as equivalent options misleads the public regarding the nature of evidence. It suggests that historical consensus is merely a matter of opinion rather than the result of rigorous methodological convergence. To present pseudohistory without contextual labeling is to compromise the museum's integrity as an educational institution grounded in evidence-based reasoning.

  **CONSIDERATION OF OPPOSING VIEW**

  The Committee acknowledges the Curator's argument that a symmetrical format serves a pedagogical purpose by encouraging visitors to weigh evidence independently. The strongest consideration favoring this view is the goal of fostering critical thinking skills. There is genuine merit in moving away from didactic displays that simply instruct visitors what to believe. Engaging the public in the evaluation of conflicting claims can deepen their understanding of how historical knowledge is constructed. The Curator's intent to avoid paternalism and promote active inquiry aligns with modern museology best practices regarding visitor engagement.

  However, critical thinking cannot be exercised in a vacuum. It requires a baseline of accurate information regarding the reliability of sources and methods. Asking visitors to evaluate carbon dating against statistical pattern matching without providing the tools to distinguish between these methodologies places an undue burden on them and risks validating misinformation under the guise of open-mindedness. True critical thinking involves understanding why certain claims are rejected by experts, not merely observing that a disagreement exists.

  **REQUIRED MODIFICATIONS**

  To proceed, the exhibit team must implement the following modifications to ensure alignment with our demarcation standards:

  1.  **Explicit Labeling:** All panels referencing the New Chronology must explicitly label it as a pseudohistorical theory not accepted by the scientific community. The conventional chronology must be identified as the consensus view supported by multidisciplinary evidence.
  2.  **Methodological Context:** The exhibit must include dedicated interpretive stations explaining *why* the New Chronology is rejected. This should focus on the demarcation criteria: specifically, the lack of peer review in relevant fields, the inability to make successful predictions, and the reliance on pattern matching over physical evidence.
  3.  **Removal of Visual Symmetry:** The display design must not use identical visual weight or layout for both timelines. The visual hierarchy should reflect the disparity in evidentiary support.
  4.  **Expert Review:** All script and content modifications must undergo review by an external panel of historians and scientists specializing in chronometry and archaeological method to verify accuracy before production begins.

  **IMPLEMENTATION TIMELINE**

  *   **November 1 – November 28:** Revision of exhibit script and design mockups to incorporate Required Modifications.
  *   **December 1 – December 14:** External expert review of revised content.
  *   **December 15 – January 15:** Incorporation of expert feedback and finalization of assets.
  *   **January 16 – March 15:** Fabrication and installation.
  *   **March 20:** Targeted opening date for "Parallel Timelines."

  **CONCLUSION**

  The Committee believes that "Parallel Timelines" can serve as a valuable case study in how to identify pseudohistory, provided it is framed correctly. By rejecting false equivalence and explicitly teaching the demarcation between evidence-based history and pattern-based conjecture, the museum can fulfill the Curator's goal of promoting critical thinking without violating our commitment to scientific accuracy. We look forward to reviewing the revised design materials by the November 28 deadline.
