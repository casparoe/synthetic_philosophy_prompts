prompt: |-
  I'm on the review board for a national physics funding agency and we're getting swamped with proposals about multiverse landscapes and string-theory scenarios that basically admit they can't be tested in any lab we'll have in the next fifty years. The applicants keep talking about "non-empirical confirmation" - like mathematical consistency, uniqueness of explanation, or this thing my colleague called "structural underdetermination," where a theory is supposedly supported just because every rival breaks some deeper consistency rule we already accept. I don't fully get it, and I need something reusable that my panel can actually run on these proposals without turning every meeting into a philosphy seminar.

  Can you write me a decision procedure - a checklist or flowchart in words - that takes whatever philosophers of science actually mean by non-empirical confirmation and turns it into steps we can apply? It should go in order, say what counts as a sufficient answer for each question, mark the exact points where the answer should be "reject," and be honest about which steps are just value judgments wearing a procedure costume. The hard cases it has to cover are: theories that predict literally nothing observable in principle, theories that predict things technically observable but practially impossible, and arguments that lean on this "structural underdetermination" idea. Then apply it to two actual-style proposals: one is a multiverse model using landscape statistics and anthropic reasoning to explain our physical constants being life-friendly, but it admits zero direct experimental signature; the other is a string-theoretic framework that claims it's the only 10-dimensional geometry that doesn't collapse into contradiction with quantum gravity results we already trust - what my colleague might call "explanatory anchoring" - but it doesn't constrain any parameter we can actually measure. I have a soft spot for the second one, so I need the procedure to tell me honestly whether I'm just biased.

  Also tell me where this procedure is guaranteed to misfire, what it can't do, and whether there's any way to make it less subjective without just pretending the subjectivity isn't there. Oh, and please don't ask me for citations or a reading list - I won't have time to recieve them and half my panel can't access the journals anyway.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User:** Member of a national physics funding agency review board.
      *   **Problem:** Swamped with proposals on multiverse landscapes/string theory that admit no testability in the foreseeable future (50+ years). Applicants use "non-empirical confirmation" arguments (mathematical consistency, uniqueness, structural underdetermination).
      *   **Task:** Create a reusable decision procedure (checklist/flowchart in words) to evaluate these proposals.
      *   **Requirements:**
          *   Translate philosophical concepts into actionable steps.
          *   Order the steps logically.
          *   Define sufficient answers.
          *   Mark explicit "Reject" points.
          *   Be honest about value judgments disguised as procedure.
          *   Cover hard cases: untestable in principle, untestable in practice, structural underdetermination arguments.
          *   Apply to two specific examples: (1) Multiverse/Anthropic (zero direct signature), (2) String Theory/Uniqueness (no measurable constraints).
          *   Address the user's bias toward the second proposal.
          *   Explain limitations/failure modes of the procedure.
          *   Explain how to reduce subjectivity without hiding it.
          *   **Constraint:** No citations or reading lists.

  2.  **Deconstruct "Non-Empirical Confirmation" (NEC):**
      *   What do philosophers (like Dawid) actually mean?
          *   *No Alternatives Argument (NAA):* Scientists have tried hard to find alternatives and failed.
          *   *Unexpected Explanatory Coherence (UEC):* The theory explains things it wasn't designed to explain.
          *   *Meta-Inductive Argument (MIA):* Similar theories in the past turned out to be empirically successful.
      *   The prompt mentions "structural underdetermination" (rivals break consistency rules). This is close to NAA/UEC but focuses on internal mathematical viability.
      *   *The Core Tension:* Science traditionally requires empirical falsifiability/verification. NEC argues that in high-energy physics, empirical access is blocked, so we need other criteria.
      *   *The Funding Context:* Funding isn't just about truth; it's about *progress*, *risk*, and *resource allocation*. A theory can be "scientifically interesting" but not "fundable" if it drains resources without potential payoff.

  3.  **Drafting the Decision Procedure (The "NEC Audit"):**
      *   *Goal:* Filter out "mathematical fiction" from "promising theoretical physics."
      *   *Structure:* Sequential gates. Fail one, stop.
      *   *Step 1: The Empirical Horizon.* Is there *any* path to data? Even indirect?
      *   *Step 2: The Alternative Space.* Have alternatives actually been exhausted, or just ignored?
      *   *Step 3: The Explanatory Yield.* Does it solve *existing* problems, or just move them?
      *   *Step 4: The Resource/Risk Ratio.* Is the cost proportional to the likelihood of payoff?
      *   *Step 5: The Bias Check.* (Crucial for the user's request).

      *Refining the "Reject" Points:*
      *   If "In Principle Untestable" -> Reject (for experimental funding, maybe not for pure theory, but the prompt implies general physics funding). Let's make it a "High Scrutiny" flag.
      *   If "No Alternatives" claim is unsupported -> Reject.
      *   If "Mathematical Consistency" is the *only* virtue -> Reject.

      *Addressing "Value Judgments":* I need to explicitly state where the panel is making a call on what counts as "progress."

  4.  **Applying to the Two Proposals:**
      *   *Proposal A (Multiverse/Anthropic):*
          *   Testability: Admits zero direct signature. (Fail Step 1).
          *   Explanation: Explains constants via selection effect. (Weak).
          *   Verdict: High risk of rejection based on standard empirical criteria.
      *   *Proposal B (String Theory/Uniqueness):*
          *   Testability: No measurable constraints. (Fail Step 1).
          *   Consistency: Claims unique geometric solution. (Passes Step 3 partially).
          *   User Bias: User likes this. The procedure needs to challenge this specifically. Is "uniqueness" enough?
          *   Verdict: Might pass theoretical funding but fail experimental. Need to distinguish theory vs. experiment funding.

  5.  **Addressing Limitations & Subjectivity:**
      *   Where does it misfire? It can't predict breakthroughs. It favors conservative science.
      *   How to reduce subjectivity? Calibration sessions, diverse panels, explicit scoring rubrics.

  6.  **Refining the Tone:**
      *   Professional, direct, pragmatic.
      *   Acknowledge the frustration (swamped panel).
      *   Avoid academic jargon where possible, but use the terms provided (structural underdetermination).
      *   No citations.

  7.  **Iterative Polishing (Self-Correction during drafting):**
      *   *Critique:* Is Step 1 too harsh? If a theory is untestable *in principle*, is it physics?
      *   *Correction:* For a *funding* agency, "in principle untestable" is usually a hard no for experimental grants, but maybe a "maybe" for theory. I need to distinguish between "Funding for Experiment" and "Funding for Theory Development." The prompt implies general physics funding. I will structure it to flag "Pure Theory" vs. "Phenomenology."
      *   *Critique:* The user wants to know if they are biased toward Proposal B.
      *   *Correction:* I need a specific "Bias Interrogation" step in the procedure application.
      *   *Critique:* "Structural Underdetermination."
      *   *Correction:* Define this operationally. It means "Rivals fail math checks." The procedure must ask: "Did they actually check the rivals, or just assert they fail?"

  8.  **Finalizing the Structure:**
      *   **Introduction:** Acknowledge the bind.
      *   **The Procedure (The "NEC Audit"):** 5 Gates.
      *   **Application:** Run Proposal A and B through the gates.
      *   **Bias Check:** Specific focus on Proposal B.
      *   **Limitations:** Where the tool breaks.
      *   **Subjectivity Management:** How to handle the human element.

  9.  **Drafting the Content (incorporating constraints):**
      *   Make sure to explicitly mark "REJECT" points.
      *   Ensure the distinction between "In Principle" and "In Practice" untestability is clear.
      *   Ensure the "Value Judgment" warnings are prominent.

      *(Self-Correction on "Structural Underdetermination"):* The prompt defines it as "a theory is supported just because every rival breaks some deeper consistency rule." I need to make sure the procedure tests the *validity* of that claim. Is the consistency rule agreed upon? Are the rivals actually viable competitors?

      *(Refining the Bias Check):* The user likes Proposal B because it feels "rigorous" (math consistency). I need to point out that mathematical rigor $\neq$ physical truth.

      *(Final Review against constraints):* No citations? Check. Reusable? Check. Honest about subjectivity? Check.

  10. **Final Polish:** Ensure the voice is appropriate for a senior reviewer talking to colleagues. (Professional, slightly weary but decisive).

  *(Wait, one more thing)*: The prompt asks for a "decision procedure... that takes whatever philosophers of science actually mean by non-empirical confirmation and turns it into steps." I need to make sure I'm accurately translating concepts like the "No Alternatives Argument" without using the jargon excessively. I will embed the logic of NAA, MIA, and UEC into the steps without necessarily lecturing on Dawid.

  Let's build the "Non-Empirical Viability Audit" (NEVA).

  *Step 1: Empirical Horizon.*
  *Step 2: The Alternative Exhaustion Check.*
  *Step 3: The Explanatory Scope.*
  *Step 4: The Consistency vs. Constraint Distinction.*
  *Step 5: The Resource/Progress Ratio.*

  Okay, ready to write.s
answer: |-
  Here is a decision procedure designed for your panel. It translates the philosophical arguments regarding non-empirical confirmation (NEC) into an operational audit. It is designed to be inserted into your existing scoring rubric as a "Theoretical Viability Module."

  I call this the **Non-Empirical Viability Audit (NEVA)**.

  ### Part 1: The Decision Procedure

  **Instructions:** Apply these five gates sequentially. If a proposal fails a gate marked **[HARD STOP]**, it is ineligible for funding under standard empirical physics mandates. If it fails a gate marked **[SOFT FLAG]**, it requires a supermajority vote to proceed and must be categorized as "High Risk/Speculative Theory."

  #### Gate 1: The Empirical Horizon Test
  **Question:** Does the proposal identify *any* observable consequence, even if indirect, that distinguishes this theory from the null hypothesis or a rival theory?
  *   **Acceptable Answer:** Yes. The proposal identifies a signature (e.g., gravitational wave background, specific particle decay, cosmological statistical anomaly) that is detectable within 50 years *or* proposes a method to make the currently undetectable detectable (new instrumentation).
  *   **Unacceptable Answer:** No. The proposal states the effects are permanently hidden (e.g., behind a cosmic horizon, at energy scales forever inaccessible).
  *   **Verdict:**
      *   If "Permanently Hidden": **[HARD STOP] REJECT.** (This is metaphysics, not physics funding).
      *   If "Technically Impossible but Principally Possible": **[SOFT FLAG].** Proceed to Gate 2, but cap funding at "Theory Development" levels, not "Experimental/Search" levels.
      *   *Value Judgment Warning:* You are deciding what counts as "physics." By rejecting "in principle untestable" work, you are prioritizing instrumentalism over mathematical realism. Acknowledge this.

  #### Gate 2: The Alternative Exhaustion Check (The "No Alternatives" Audit)
  **Question:** The applicants claim their theory is supported because rivals fail consistency checks (structural underdetermination). Have they demonstrated that the space of rivals has been sufficiently searched?
  *   **Acceptable Answer:** Yes. The proposal lists specific rival frameworks, demonstrates exactly where they fail mathematical consistency (e.g., unitarity violation, anomalies), and cites literature showing these failures are fatal, not fixable.
  *   **Unacceptable Answer:** No. The proposal asserts rivals "generally" fail or relies on the claim that "no one has found a better one yet."
  *   **Verdict:**
      *   If "No one has found a better one": **[HARD STOP] REJECT.** (Argument from ignorance is not confirmation).
      *   If "Rivals fail specific consistency rules": **[SOFT FLAG].** Proceed to Gate 3.
      *   *Value Judgment Warning:* You are judging whether the "consistency rules" (e.g., specific interpretations of quantum gravity) are themselves dogma. If your panel accepts the rules as absolute truth, you risk stifling paradigm shifts that break those rules.

  #### Gate 3: The Explanatory Yield Test
  **Question:** Does the theory explain *existing* data better than the Standard Model, or does it only explain *why we haven't seen new data*?
  *   **Acceptable Answer:** It resolves a current tension (e.g., hierarchy problem, dark matter density) without adding more free parameters than it solves.
  *   **Unacceptable Answer:** It explains the absence of evidence (e.g., "We don't see supersymmetry because the landscape is vast") or relies on anthropic selection to explain constants.
  *   **Verdict:**
      *   If "Explains absence of evidence" or "Anthropic selection": **[SOFT FLAG].** (Anthropic reasoning is often a conversation-stopper, not a generator of new predictions).
      *   If "Resolves current tension": **PASS.**
      *   *Value Judgment Warning:* You are deciding what counts as a "problem." Some panels value aesthetic resolution (naturalness); others value only empirical fit.

  #### Gate 4: The Constraint vs. Consistency Distinction
  **Question:** Does the mathematical uniqueness claimed by the applicants constrain physical parameters, or does it only constrain the mathematical structure?
  *   **Acceptable Answer:** The unique mathematical structure forces a specific range of physical values (masses, coupling constants) that we can check.
  *   **Unacceptable Answer:** The unique structure allows a vast range of physical values (the "Landscape"), requiring external selection to match our universe.
  *   **Verdict:**
      *   If "Allows vast range of values": **[HARD STOP] REJECT** for experimental funding. (A theory that predicts everything predicts nothing).
      *   If "Forces specific physical values": **PASS.**
      *   *Value Judgment Warning:* This is the hardest gate. You are judging whether mathematical elegance is a proxy for physical truth. History shows this is often true (Dirac), but often false (Kelvin's vortex atoms).

  #### Gate 5: The Resource/Progress Ratio
  **Question:** Given the uncertainties in Gates 1-4, is the requested budget proportional to the likelihood of *decisive* progress?
  *   **Acceptable Answer:** Funding is requested for small teams, short durations, or specific calculational milestones (e.g., "Determine if vacuum X is stable").
  *   **Unacceptable Answer:** Funding is requested for large collaborations, long-term infrastructure, or indefinite "exploration" without milestones.
  *   **Verdict:**
      *   If "Large/Indefinite": **[HARD STOP] REJECT.**
      *   If "Small/Milestone-based": **PASS.**

  ---

  ### Part 2: Application to Your Proposals

  Here is how the NEVA procedure runs on the two cases you provided.

  #### Proposal A: Multiverse Landscape with Anthropics
  *   **Gate 1 (Empirical Horizon):** Admits zero direct experimental signature.
      *   *Result:* **[HARD STOP] REJECT.**
      *   *Reasoning:* If it admits zero signature, it fails the definition of empirical science for funding purposes. It cannot be falsified even in principle.
  *   **Gate 3 (Explanatory Yield):** Uses anthropic reasoning to explain constants.
      *   *Result:* **[SOFT FLAG].**
      *   *Reasoning:* Anthropic reasoning explains the status quo but generates no new predictions.
  *   **Final Verdict:** **REJECT.**
      *   *Note:* This is the easy case. The procedure confirms the intuition that funding this is akin to funding philosophy.

  #### Proposal B: String-Theoretic Unique Geometry (Your "Soft Spot")
  *   **Gate 1 (Empirical Horizon):** Doesn't constrain parameters we can measure.
      *   *Result:* **[SOFT FLAG].** (Technically observable, practically impossible).
      *   *Reasoning:* It doesn't claim *in principle* untestability, just high-energy inaccessibility. It survives Gate 1, but barely.
  *   **Gate 2 (Alternative Exhaustion):** Claims it's the *only* geometry not contradicting trusted quantum gravity results.
      *   *Result:* **[SOFT FLAG].**
      *   *Reasoning:* You must verify if "trusted quantum gravity results" are actually settled law or just the current consensus. If the consensus is wrong, this uniqueness is meaningless.
  *   **Gate 4 (Constraint vs. Consistency):** Claims uniqueness in 10D geometry, but doesn't constrain measurable parameters.
      *   *Result:* **[HARD STOP] REJECT** for experimental funding. **PASS** only for pure theory calculation.
      *   *Reasoning:* Mathematical uniqueness without physical constraint is not confirmation; it is classification.
  *   **Final Verdict:** **FUND AS PURE MATH/THEORY ONLY. DO NOT FUND AS PHYSICS DISCOVERY.**
      *   *Bias Check:* You like this proposal because it feels "rigorous." The procedure reveals that the rigor is mathematical, not physical. If you fund this as "Physics," you are subsidizing mathematics. If your agency's mandate is "Understanding the Physical Universe," this is a **REJECT** for major funding. If your mandate includes "Mathematical Foundations of Physics," it is a **PASS** for low-level support.

  ---

  ### Part 3: Where This Procedure Misfires (Limitations)

  You asked for honesty about where this tool breaks. Here are the three failure modes:

  1.  **The "Einstein" False Negative:**
      *   General Relativity, in its early days, had very limited empirical distinctiveness from Newtonian gravity. If you applied Gate 1 strictly in 1910, you might have rejected GR for lacking distinct observational signatures (pre-Eddington).
      *   *Risk:* This procedure favors incremental science over revolutionary science. It filters out "crank" science, but it also filters out "genius ahead of its time" science.
  2.  **The "Consensus Trap" (Gate 2 Failure):**
      *   Gate 2 relies on the panel agreeing on what counts as a "consistency rule." If your panel is dominated by String Theorists, they will agree that "anomaly cancellation" is a hard rule. If a Loop Quantum Gravity proposal breaks that rule but offers a different consistency, your panel might reject it based on *their* bias, not the proposal's merit.
      *   *Risk:* The procedure codifies the current paradigm's biases as objective criteria.
  3.  **The "Mathematical Reality" Confusion (Gate 4 Failure):**
      *   This procedure assumes Math $\neq$ Physics. However, in high-energy physics, the math *is* the only access we have. By demanding physical constraints (Gate 4), you might reject a theory that is physically true but mathematically obscure.
      *   *Risk:* You may starve the very work that eventually figures out how to connect the math to the lab.

  ### Part 4: Managing Subjectivity Without Hiding It

  You asked how to make this less subjective without pretending it isn't. You cannot remove subjectivity, but you can **calibrate** it.

  1.  **The "Dissenting Opinion" Requirement:**
      *   For any proposal that passes Gate 1 but fails Gate 4 (like your Proposal B), require the review summary to explicitly state: *"We are funding this based on the belief that mathematical consistency predicts physical reality, despite lack of empirical constraints."*
      *   Force the panel to write down the value judgment. This prevents the judgment from hiding inside the technical score.
  2.  **Panel Composition Quotas:**
      *   Do not let a panel of only String Theorists review String Theory proposals. Include one "Phenomenologist" and one "Condensed Matter Theorist" on every high-energy panel.
      *   Their job is not to understand the math, but to aggressively ask Gate 1 and Gate 4 questions. They act as the "Empirical Conscience."
  3.  **The "Sunset Clause":**
      *   For proposals that pass via [SOFT FLAG] (like Proposal B), attach a funding condition: *"Renewal requires a demonstrated pathway to Gate 1 (Empirical Horizon) within 5 years."*
      *   This prevents permanent funding of non-empirical programs. It forces the theorists to eventually engage with data or lose support.

  ### Summary for Your Panel

  When you present this to your colleagues, say this:

  *"This checklist does not decide what is True. It decides what is Fundable. It distinguishes between 'Physics' (which requires a link to observation) and 'Mathematical Physics' (which requires only internal consistency). Proposal A is neither. Proposal B is Mathematical Physics. If our mandate is Physics, Proposal B fails. If we wish to support Mathematical Physics, we must admit that explicitly and budget accordingly, knowing the risk of zero empirical return is near 100%."*

  This protects you from funding "zombie science" while giving you a defensible reason to support high-risk theory if you choose to do so consciously.
