  Miriam operates on a principle of **Maximum Causal Specificity subject to Minimum Auditability**. She selects the narrowest class where the failure mechanism is uniform, as with the hip replacements, but rejects it if the sample size prevents calibration, as with the council vote. She also dismisses proxy data, evident in her refusal of the postcode life tables.

  On your 300-metre revetment, she will likely refuse a ledger probability. Class B is causally sound but unauditably small (N=9 versus the accepted N=80 for hips), while Class A is auditable but causally heterogeneous. Crucially, the 2004 repair renders the structure unique, akin to the council vote. If coerced into a number, she would adopt Class A (10%) but widen the interval to 0.5–15%, matching the uncertainty admitted by the modellers rather than the statistics. The surviving rule is **No Unique Histories**; 'Narrowest class' fails on the council vote, and 'Auditability first' fails on the hip case. Only excluding unique histories fits all five verdicts.

  The repair moves the structure into "previously failed structures". This bites on the Uniqueness rule. It does not reset the clock; it compounds uniqueness because there is no national data for this subclass. To separate the rules on Tuesday, ask her: "If we had ten identical bridges with identical damage histories, would you accept a probability?" This distinguishes the N-threshold from the Uniqueness constraint.

  Practically, tell the council the box requires a range or should remain empty. A point estimate implies calibration you cannot demonstrate. Consistency with Miriam demands admitting the error bar is the whole story. You must realise there is a very decent chance no number belongs there.
