answer: |-
  **Project Title:** The Inter-Glyph Contract: Relational Identity in the Letter Spirit Problem
  **Duration:** 12 Weeks
  **Format:** Workshop Proposal

  ### 1. The Core Question
  Douglas Hofstadter's "Letter Spirit" problem asks: What allows us to recognize a letter as itself across radically different stylistic implementations? Standard cognitive models answer this via **intrinsic features**: either a cluster of family resemblances (Wittgenstein) or a hidden geometric prototype (Platonism). Both approaches treat the glyph as an isolated object carrying its identity within its own contours.

  This workshop proposes a counter-hypothesis: **Letter identity is systemic, not intrinsic.** I posit that a glyph is recognized as an 'a' not merely because of its shape, but because it fulfills specific "inter-glyph contracts"—relational obligations it owes to the other members of its alphabet. For example, the counter of an 'a' is legible not because of its absolute area, but because it maintains a specific proportional tension with the counters of the 'e', 'o', and 'b' within that specific typeface. Identity, I argue, is a byproduct of coherence within a set.

  ### 2. Critique of Intrinsic Accounts
  Current models leave the problem open because they fail to account for **contextual plasticity**.
  *   **The Isolation Fallacy:** Prototype theory assumes there is a "perfect 'a'" in the mind. However, in extreme display typography, an 'a' may lack a bowl, a stem, or a counter, yet remain an 'a' if the surrounding letters support that stylistic deviation.
  *   **The Clustering Limit:** Family resemblance works for moderate variation but collapses at the extremes. If we stretch the features enough, the cluster dissolves. Intrinsic accounts cannot explain why a shape that looks like a 'u' functions as an 'n' in a specific futuristic typeface, provided the 'm' and 'h' agree to the same distortion.

  If identity were purely intrinsic, we should be able to identify a letter in a vacuum. If identity is contractual, removing the letter from its family should degrade or destroy its legibility.

  ### 3. Methodology (12-Week Schedule)

  **Phase 1: Forensic Typography (Weeks 1–4)**
  *   **Goal:** Identify existing "contracts" in the wild.
  *   **Action:** Close reading of 8–10 extreme display typefaces (e.g., *Druk, Futura Black, Zapf Dingbats* adapted for text, or experimental variable fonts).
  *   **Task:** Map the stylistic rules of each family. Specifically, look for cases where a specific glyph violates standard anatomical norms but remains legible because it adheres to the family's unique logic (e.g., square counters, broken strokes).
  *   **Deliverable:** Annotated dossier of "Contract Adherence" cases.

  **Phase 2: The Contract-Breaking Experiment (Weeks 5–8)**
  *   **Goal:** Test the necessity of relational context.
  *   **Action:** Design a minimal "alphabet" (vowels + n, h, m, o).
  *   **Task:** Create two versions:
      1.  **Coherent Set:** All glyphs share a unified stylistic distortion.
      2.  **Broken Contract Set:** One glyph (the target, e.g., 'a') is inserted into the set but refuses the stylistic rules established by the others (e.g., everyone is square except the 'a' is round).
  *   **Deliverable:** Two functional type specimens for comparative testing.

  **Phase 3: Intuition Testing & Taxonomy (Weeks 9–12)**
  *   **Goal:** Evaluate legibility and synthesize findings.
  *   **Action:** Informal user testing (n=20) to measure recognition speed/accuracy of the target glyph in both sets.
  *   **Task:** Analyze where recognition fails. Is it the shape that confuses, or the stylistic dissonance?
  *   **Deliverable:** A preliminary "Taxonomy of Inter-Glyph Contracts" (e.g., *The Weight Contract, The Counter-Pressure Contract, The Terminal Agreement*).

  ### 4. Desired Outcomes & Failure Conditions
  **Success:** A validated taxonomy showing that legibility in extreme styles relies on relational consistency. I aim to demonstrate that you can distort a glyph *further* if the surrounding alphabet supports the distortion than if the glyph stands alone.

  **Failure:** If the "Broken Contract" glyph is recognized just as easily as the "Coherent" glyph, the hypothesis fails. If participants identify the 'a' based solely on its local geometry regardless of the surrounding 'e' or 'o', then identity is intrinsic, and the "contract" is merely decorative, not constitutive.

  ### 5. Falsifiability: What Would Change My Mind?
  To maintain intellectual honesty, I need to define the threshold where I abandon the "Inter-Glyph" hypothesis and return to intrinsic feature theory. Three specific results would force this pivot:

  1.  **The "Vacuum" Result:** If, during Phase 3, users identify the target glyphs in isolation (with no context) at the same accuracy rate as within the coherent family, the relational aspect is superfluous. Identity resides in the shape, not the system.
  2.  **The "Universal Feature" Reduction:** If my "Taxonomy of Contracts" turns out to be nothing more than a restatement of universal geometric rules (e.g., "stroke width must be consistent"), then I haven't found a *relational* contract, just an *intrinsic* constraint applied multiple times. If the contract is just "don't change stroke weight," that's a property of the pen/tool, not a social agreement between glyphs.
  3.  **Computational Independence:** If a standard Convolutional Neural Network (trained only on single-glyph crops, no context) achieves human-level accuracy on the extreme typefaces I analyze in Phase 1, it suggests the visual data required for identification is fully contained within the pixel bounds of the individual letter. If a machine doesn't need the context to solve the problem, positing a human need for context becomes a much harder argument to sustain.

  If any of these occur, I will conclude that "Inter-Glyph Contracts" are a post-hoc rationalization for aesthetic coherence, not a cognitive prerequisite for letter identification.
