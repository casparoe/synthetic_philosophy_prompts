  10. **Refining the Debrief:** Ensure I explicitly mention "Access to Content vs. Access to Origin" and admit that unconscious framing requires deception to demonstrate empirically in a room.

  11. **Final Review:** Does this meet the "no external readings" constraint? Yes. Does it avoid jargon *during* the activity? Yes. Does it hit the 90-minute mark? Yes.

