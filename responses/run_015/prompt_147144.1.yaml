      *   **Target Audience:** 12 Graduate Students (Philosophy of Mind).
      *   **Duration:** 90 Minutes.
      *   **Constraint:** No external readings assigned in advance.
      *   **Goal:** Make participants *feel* the force of introspective unreliability (gap between taken reasoning vs. actual causal origin) *before* naming concepts (confabulation, heterophenomenology, etc.).
      *   **Core Mechanism:** Pair work, structured argument-mapping. Partners get subtly different analogical frames (semantic priming) leading to contradictory intermediate steps, experienced as spontaneous insights.
      *   **Rules:** Turn-taking, no external notes, scoring mechanism (confidence tokens) rewarding coherence/penalizing authority.
      *   **Debrief:** Map activity to access vs. origin, predict failure modes (blaming partner), admit limitations (need for deception/priming).

  2.  **Deconstruct the Core Mechanism (The "Trap"):**
      *   I need a philosophical problem where the *path* to the conclusion matters more than the conclusion itself, or where the conclusion is ambiguous enough to allow divergent paths.
      *   The prompt specifies "subtly different analogical frames." This means I need to give Student A one metaphor and Student B another metaphor *before* they start arguing, disguised as "background context" or "warm-up examples."
      *   *Idea:* The "Ship of Theseus" is too common. "Trolley Problem" is too ethical. Let's go with something metaphysical/cognitive. How about "Personal Identity over Time" or "The Nature of Belief."
      *   *Better Idea:* Let's use a constructed scenario about "Decision Integrity."
      *   *The Priming:*
          *   Group A (Frame: Architecture/Structure): Given examples about foundations, load-bearing walls, stability.
          *   Group B (Frame: Flow/Fluidity): Given examples about rivers, currents, adaptation, erosion.
      *   *The Task:* Map the argument for whether a specific belief change constitutes "growth" or "corruption."
      *   *The Conflict:* Architecture students will look for structural consistency (corruption if inconsistent). Flow students will look for adaptive continuity (growth if adaptive). They will think their reasoning is purely logical, but it's framed by the priming.

  3.  **Drafting the Activity Structure (90 Minutes):**
      *   **Intro (10 mins):** Set the stage, rules, token system.
      *   **Priming Phase (10 mins):** Crucial. Must look neutral. "Cognitive Warm-up."
      *   **Argument Mapping Phase (40 mins):** Pairs work. Turn-taking rules.
      *   **Token Scoring/Review (10 mins):** Tallying.
      *   **Debrief/Reveal (20 mins):** The philosophical meat.

  4.  **Refining the Priming (The "Deception"):**
      *   I need to hand out cards or slips of paper.
      *   *Slip A (Structure):* "Consider how a bridge maintains identity. If a beam is replaced, is it the same bridge? Focus on *support relations*."
      *   *Slip B (Flow):* "Consider how a river maintains identity. If water is replaced, is it the same river? Focus on *directional continuity*."
      *   *The Target Problem:* "The Case of the Shifting Voter." A person changes their political stance over 10 years. Is this the *same* agent reasoning, or a *different* agent?
      *   *Wait, the prompt asks for "contradictory intermediate steps" leading to a "shared conclusion" (or at least working toward one).* Let's adjust.
      *   *Revised Task:* They must agree on a definition of "Rational Coherence."
      *   *Primed Frames:*
          *   Frame 1 (Static/Logical): "Consistency is like a geometric proof. No contradictions allowed."
          *   Frame 2 (Dynamic/Pragmatic): "Consistency is like a narrative arc. Resolution matters more than static truth."
      *   *Actually, let's stick closer to the prompt's requirement:* "Seed both partners with subtly different analogical frames... that deterministically steer each partner toward contradictory intermediate steps."
      *   *Scenario:* "The Memory Replacement Case." (Similar to Parfit, but simplified).
      *   *Prime A:* "Memory is like a Library Archive." (Focus on fidelity, storage, retrieval accuracy).
      *   *Prime B:* "Memory is like a Workshop." (Focus on utility, reconstruction, tool usage).
      *   *Task:* Determine if a person with reconstructed memories is "epistemically justified."
      *   *Conflict:* Archive person says "No, fidelity lost." Workshop person says "Yes, utility gained." They will argue past each other, claiming their intuition is "reason."

  5.  **Developing the Rules & Token System:**
      *   *Tokens:* "Clarity Chips" (poker chips or paper slips).
      *   *Earning:* Successfully stating a premise the partner accepts.
      *   *Losing:* Appealing to "It's just obvious" or "Philosopher X says."
      *   *Turn-taking:* 2 minutes speaking, 1 minute listening/mapping, then switch.

  6.  **Developing the Debrief:**
      *   Must reveal the priming.
      *   Must explain *Access Content* (I know what I think) vs. *Access Origin* (I don't know *why* I think it).
      *   Must admit the deception was necessary to show the invisible cause.
      *   Must predict they will blame the partner ("You're being illogical") rather than themselves ("My intuition is primed").

  7.  **Review against Constraints:**
      *   12 students? Yes (6 pairs).
      *   90 mins? Yes.
      *   No readings? Yes.
      *   Feel the force of unreliability? Yes, through the frustration of the argument.
      *   No jargon initially? Yes.
      *   Specific debrief requirements? Yes.

  8.  **Final Polish:**
      *   Ensure the tone is academic but facilitative.
      *   Make sure the "Deception" is ethical (debriefed immediately).
      *   Ensure the "Token System" doesn't gamify too much but serves the philosophical point (articulation vs. authority).

