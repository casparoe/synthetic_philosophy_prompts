prompt: |-
  I'm taking a course on public history and have become preoccupied by a protocol I encountered in a composite case study of the Riverton Municipal Heritage Board, though the underlying pattern appears in many real institutions. The board maintains rigorous academic archives with full scholarly transparency, yet its public commemorative apparatus—school curricula, museum dioramas, civic plaques—is governed by a dual-track system. When archival research reveals that a celebrated local event, such as a nineteenth-century cooperative strike, also involved systematic exclusion of a minority labor group that conflicts with the community's present self-image, the correction is filed in an academic annex but never integrated into the public narrative. The board defends this separation by invoking mnemonic sovereignty, a principle they describe as the living community's proprietary claim over the shape of its shared past, distinct from historians' evidentiary obligations to the dead. Their chair argues that history serves the dead while memory serves the living, and that forcing convergence between the two violates the community's right to collective self-definition.

  What philosophical commitments does this dual-track practice actually presuppose? Must it rest on a pluralist or relativist theory of historical truth, or can a pragmatist about social cohesion defend it without abandoning evidential norms entirely? Does it implicitly commit to a metaphysics of collective identity—perhaps that a community's present continuity depends on selective narrative inheritance—and if so, is that commitment necessary to the practice or merely a convenient rationalization? And if we replaced mnemonic sovereignty with a straightforward evidentialist view that treats public memory as answerable to the same archival record as academic history, which parts of the board's justification would collapse, and what concrete institutional changes—curricular, ritual, or legal—would be required to make that replacement coherent?

  Please present your answer as exactly five numbered items, each consisting of one or two sentences, with no introduction or conclusion.
