answer: |-
  1. The practice presupposes a functionalist separation where social utility outweighs factual completeness in the public sphere, treating memory as a tool for cohesion rather than a record of truth. It commits to the idea that ethical obligations to the living community differ fundamentally from epistemic obligations to historical accuracy.
  2. This system does not necessarily require relativism about truth itself, but rather a pragmatist hierarchy where social cohesion is valued above evidentiary consistency in specific civic contexts. A pragmatist can defend this by arguing that distinct social goods require distinct epistemic norms, provided the archival truth remains accessible elsewhere.
  3. The board implicitly commits to a metaphysics where collective identity is a constructed narrative project rather than a fact-based lineage, suggesting continuity depends on selective inheritance. This commitment is necessary to the practice because admitting disruptive truths would fracture the specific self-image the board aims to preserve.
  4. Replacing mnemonic sovereignty with strict evidentialism would collapse the justification that the living hold proprietary rights over the past, forcing acknowledgment that public memory is answerable to the same record as academic history. The claim that history serves only the dead while memory serves only the living would fail, as both would be bound by the same evidentiary obligations.
  5. Coherent implementation would require legally mandating that civic plaques and curricula cite archival contradictions alongside celebratory narratives, effectively merging the annex into the main display. Rituals of commemoration would need restructuring to include moments of critical reflection rather than solely affirming the community's present self-image.
