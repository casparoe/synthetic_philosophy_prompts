  Dear Colleague, I was struck by your account of the scotoma and agree that personal encounter with introspective failure transforms how one teaches illusionism. It moves the debate from abstract taxonomy to the visceral reliability of the first-person perspective. Below I have drafted the materials you requested, integrated into this correspondence so that the flow remains unbroken and adheres to your formatting constraints. The essay question I propose is as follows. Empirical cases of introspective error, such as filled-in scotomas or change blindness, demonstrate that introspection can misrepresent the contents of experience. However, the illusionist about phenomenal consciousness makes a stronger claim: that introspection misrepresents the very category of phenomenal properties, suggesting they exist when they do not. Does the well-documented fallibilism regarding content support the stronger thesis regarding category? In your answer, you must address what the illusionist proposes as the content of this illusion. If an experience seems to possess irreducibly phenomenal properties while possessing none, is this seeming itself a further datum requiring explanation, or does the thesis quietly collapse into reductive realism? Locate the exact point at which the illusionist's explanatory burden becomes a restatement of the problem of explaining consciousness, and judge whether this burden is fatal or merely the ordinary cost of any naturalistic theory of mind.

  Here is a model answer designed to meet the criteria within a ninety-minute window. The inference from empirical introspective error to metaphysical illusionism requires careful scrutiny. Cases like filled-in scotomas demonstrate that introspection is fallible regarding the spatial or qualitative contents of experience, but this is a failure of detection within an accepted framework of experience. Illusionism makes the stronger claim that the framework itself is erroneous. The crucial challenge for the illusionist is to specify the content of the illusion without begging the question. When a subject reports a phenomenal quality, the illusionist says this report is false. But what is the state that prompts the report? If the state involves a seeming that is itself phenomenally characterized, then phenomenal properties exist, and the view collapses into reductive realism. The illusionist must therefore argue that the seeming is a non-phenomenal functional state that merely dispositions the subject to make phenomenal claims. This leads to the core explanatory burden. The illusionist must explain how a physical system generates a state that is introspectively indistinguishable from genuine phenomenality despite lacking it. Critics argue this is simply the hard problem restated. To explain how a brain state creates the illusion of consciousness is to explain how a brain state creates the appearance that defines the hard problem. If the appearance is robust enough to motivate the concept of consciousness, explaining its production is as difficult as explaining consciousness itself. However, the illusionist might reply that explaining a misrepresentation is easier than explaining the represented property. Explaining how a thermostat represents temperature is easier than explaining temperature itself. Yet consciousness is not like temperature because our access to it is constitutive. The point at which the burden becomes fatal is if the illusionist cannot describe the mechanism of the illusion without implicitly relying on the phenomenal concepts they reject. If the explanation of the illusion requires us to understand what it is like to be under the illusion, the theory is circular. Nevertheless, this burden is not unique to illusionism. Any naturalistic theory must explain the relationship between physical processes and first-person reports. The illusionist accepts the cost of explaining the report while denying the cost of explaining the property. Whether this is a viable savings depends on whether the notion of a non-phenomenal seeming is psychologically coherent. A strong answer concludes that the view survives only if it can naturalize introspective access without phenomenal residues, acknowledging that the difficulty of this task is the price of naturalism, not a specific refutation of illusionism.

  Regarding the marking scheme, you should award full marks only to answers that distinguish clearly between introspective fallibilism about content and the illusionist claim about category. An A-grade response must identify that the scotoma example supports fallibilism but does not entail illusionism without further argument about the nature of the seeming. It must explicitly analyze the content of the illusion, noting that if the seeming is phenomenal, the theory collapses into realism. It must also locate the specific point where explaining the illusion recapitulates the hard problem, judging whether this is a fatal circularity or a acceptable theoretical cost. Answers capped at a B level will typically provide accurate exposition of illusionism and discuss the scotoma case competently but will fail to press the collapse argument or will treat the explanatory burden as obviously fatal without analyzing why the illusionist might accept that cost. You should penalize candidates who equate illusionism with the outright denial that consciousness exists, as illusionists deny phenomenal properties but not conscious states themselves. Similarly, deduct marks for students who treat the apparent immediacy of experience as a knockdown argument without engaging with the illusionist explanation of why immediacy is misleading. Finally, ensure you do not reward answers that treat the difficulty of explaining consciousness as itself a refutation of the illusionist, since the illusionist aims to explain away that difficulty rather than solve it directly. I hope these materials serve your seminar well this coming term. Sincerely, your colleague in philosophy.
