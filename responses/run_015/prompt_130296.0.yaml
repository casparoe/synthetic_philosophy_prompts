      *   **Core Claim:** The regress collapses because demanding "Add Modus Ponens (MP) as a premise" presupposes the rule being challenged (performative contradiction). This is framed as "discursive debt" (borrowing from social epistemology). Rejecting MP removes entitlement to make counter-claims. Achilles doesn't need an extra premise; he needs to point out the Tortoise is already *in* the practice.
      *   **Audience:** Philosophy of logic reading group.
          *   2 Proof-Theorists (Formal derivation is king).
          *   1 Epistemologist (Obsessed with circularity).
          *   1 Historian (Knows Carroll's context).
