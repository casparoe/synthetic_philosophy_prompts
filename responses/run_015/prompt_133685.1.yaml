prompt: |-
  okay so i've been following the demandingness objection to consequentialism since grad skool — you know, the usual Singer-style drowning child stuff vs Williams and Scheffler saying morality can't ask you to live like a saint — and it feels like the debate hasn't moved in like fifteen years. everyone just replays the famime relief example and the other side says "well yes but thats the point." i think the stall might be hiding a disagreement about what "demanding" even tracks — is it the sheer size of the sacrifice, or the structure of having every choice be morally audited? like, there's this idea of "ambiant demandingness" where consequentialism doesn't just ask for big gifts, it removes the boundary between moral and personal life entirely. but maybe i'm wrong and it's actually just bedrock intuitons about ownership of one's life, or maybe they're literally answering different questions — one about what morality requires, one about what a reasonable person can be blamed for failing to do.

  so my ask: diagnose what's actually going on here. is this a verbal dispute about "demandingness"? a hidden normative disagreement about whether personal projects have protected status? are they talking past each other because one side cares about blameworthiness and the other about rightness? please separate what's actually settled (like, that consequentialism does require more than common-sense morality allows) from what's genuinely contested among people who actually work on this, and don't present one camp's view as the consensus. also, if your diagnosis is right, what would actually count as progress? a new conceptual distinction? an empirical study about moral motivation? or is this just one of those debates where people are talking past each other and nothing will move it? be honest if you think it's the latter.
