answer: |-
  You are diagnosing the stagnation correctly. The feeling that the debate has been spinning on the Singer/Williams axis since the 80s is shared by many working in the field, but the *reasons* for the stall are more complex than just stubbornness.

  Your intuition about "ambient demandingness" (the structural audit of life) versus "sheer sacrifice" (the quantum of loss) is actually where the most sophisticated recent work is hiding. However, the stalemate persists because the objection is doing too much work. It is simultaneously a psychological claim, a normative claim, and a methodological claim.

  Here is a diagnosis of what is actually going on, separating the verbal confusion from the bedrock normative disagreement, and an honest assessment of whether progress is possible.

  ### 1. The Diagnosis: Three Distinct Disputes Masquerading as One

  The debate feels stalled because participants are often arguing past each other across three different dimensions.

  **A. Quantitative vs. Qualitative Demandingness (Your "Ambient" Point)**
  *   **The Old View:** The objection was primarily about *cost*. (e.g., "I have to give away my kidney/income.")
  *   **The Stalled View:** Consequentialists responded by accepting the cost. (e.g., "Yes, you should give the kidney. Why do you think your comfort matters more?")
  *   **The Real Disagreement:** You identified this as "ambient demandingness." It is about the **pervasiveness of the moral claim**. Williams' "integrity" objection isn't just that utilitarianism asks for a lot; it's that it requires the agent to view their own projects from an external, impersonal standpoint *continuously*.
      *   *Consequentialist Counter:* Many now argue this "alienation" is a feature, not a bug. It corrects for agent-bias.
      *   *The Stall:* One side sees the "audit" structure as a violation of the separateness of persons; the other sees it as the only rational way to view value. This is not a verbal dispute; it is an axiological clash.

  **B. Theory of Rightness vs. Theory of Blame**
  *   **The Confusion:** Critics often argue: "If I spend money on a movie instead of malaria nets, I am not a bad person." Consequentialists often reply: "The act is sub-optimal, but you aren't blameworthy."
  *   **The Shift:** This has led to the **Scalar Consequentialism** move (Alastair Norcross, etc.) and the separation of *right action* from *blameworthiness* (Holly Smith, etc.).
  *   **The Stall:** If the objection is "Consequentialism makes me blameworthy for living a normal life," defenders can tweak the theory of blame to accommodate this without changing the theory of value. But if the objection is "Consequentialism makes my normal life *wrong*," tweaking blame doesn't help.
      *   *Diagnosis:* Half the debate is people arguing about the extension of the word "wrong" (is it blame-implying?) while the other half argues about the extension of "obligatory."

  **C. Methodological Status of Common Sense Morality (CSM)**
  *   **The Core Issue:** Is CSM a *datum* that theories must fit, or is CSM a *bias* that theories must correct?
  *   **The Stall:**
      *   *Anti-Consequentialists:* Treat the intuition that "I am allowed to keep my money" as a fixed point. If the theory violates it, the theory is *prima facie* false.
      *   *Consequentialists:* Treat that intuition as a product of evolutionary selfishness. If the theory violates it, the theory is doing its job.
      *   *Result:* They are not arguing about ethics; they are arguing about meta-ethical methodology.

  ### 2. What is Actually Settled vs. What is Contested

  It is crucial to distinguish where the field has actually moved versus where it is stuck.

  **Settled (Among Specialists):**
  1.  **Act Consequentialism (AC) is demanding.** Almost no serious AC proponent denies that their theory requires more than Common Sense Morality. The "bite the bullet" strategy (Singer, Unger) is now the standard AC move.
  2.  **"Overdemandingness" is distinct from "Demandingness."** There is a consensus that a theory can be demanding without being *over*demanding (i.e., impossible to follow or self-defeating). The debate is now about where that line is drawn.
  3.  **Psychological impossibility is a weak objection.** Arguments that "humans just can't do this" are largely dismissed because "ought implies can" is usually satisfied; it's just really hard. The objection is normative, not psychological.

  **Genuinely Contested:**
  1.  **The Normative Weight of Agent-Centered Prerogatives:** Scheffler tried to hybridize this (allowing agents to weight their own interests slightly higher). The contest is whether there is any *principled* way to justify this prerogative without collapsing into arbitrariness.
  2.  **The Value of Integrity:** Is "integrity" (sticking to your own projects) an intrinsic moral good, or just a heuristic for producing good consequences? Williams says the former; Consequentialists say the latter.
  3.  **Scalar vs. Deontic Structure:** Should morality be binary (right/wrong) or scalar (better/worse)? If scalar, the "demandingness objection" dissolves, but many argue this fails to guide action.

  ### 3. What Would Count as Progress?

  If you are looking for a resolution, you are likely to be disappointed. However, progress is possible in specific lanes.

  **A. Conceptual Refinement (High Potential)**
  Progress lies in decomposing "demandingness" further. Your "ambient" idea is part of this. We need to distinguish:
  *   **Cost-Demandingness:** How much welfare do I lose?
  *   **Constraint-Demandingness:** How many options are removed from my menu?
  *   **Motivational-Demandingness:** How much psychological effort is required to sustain the motive?
      *   *Why this helps:* It might turn out AC is high on Cost but low on Constraint (you can still do what you want, you just shouldn't), or vice versa. Pinning down which dimension is objectionable would move the debate.

  **B. Empirical Moral Psychology (Low Potential)**
  You asked about empirical studies. Honestly? **This is unlikely to resolve the normative debate.**
  *   Knowing *that* people feel alienated by consequentialism (empirical) doesn't tell us whether they *should* feel alienated (normative).
  *   However, empirical work on **moral motivation** could help. If it turns out that adopting a consequentialist mindset systematically leads to burnout and *less* good being done (a self-defeat argument), that is a pragmatic objection that even consequentialists must respect. (See: Effective Altruism burnout discussions).

  **C. Integration with Political Philosophy (Medium Potential)**
  The debate has shifted from individual ethics to institutional design.
  *   *Progress:* Arguing that demandingness is a problem for *individual* ethics but dissolves under *ideal* institutional structures (Murphy's "Fair Share" argument). If everyone else does their part, I am not demanded to do everything.
  *   *Counter:* But we don't live in ideal conditions.
  *   *Value:* This moves the discussion from "Must I be a saint?" to "How do we build a world where sainthood isn't required?"

  ### 4. Honest Assessment: Is it a Dead End?

  **Yes and No.**

  **Why it's a Dead End:**
  The debate rests on a fundamental clash of **axiological primitives**.
  *   Side A (Consequentialism): Value is impersonal. The location of the value (in me vs. in you) is morally irrelevant.
  *   Side B (Critics): The agent's perspective is morally constitutive. My life being *mine* gives me reasons that are not reducible to impersonal value.
  *   Unless one side convinces the other to abandon their core metaphysical view of value, the "demandingness" objection will just remain the place where these two ships pass in the night. It is less like a puzzle to be solved and more like a clash between two different religious visions (the Saint vs. the Human).

  **Why it's Not:**
  The "Scalar" and "Blame" distinctions *have* changed the landscape. We are no longer arguing "Is it wrong to go to the movies?" We are arguing "Is the concept of 'wrong' useful here?"
  *   **Real Progress:** The most fruitful path forward is abandoning the search for a "theory of right action" that matches common sense. If we accept that morality *is* demanding, the question shifts to **non-ideal theory**: How do we manage the psychological and social costs of living in a world where morality demands more than we can give?

  **Summary Recommendation:**
  If you want to work on this, don't rehash Singer vs. Williams.
  1.  **Attack the structure:** Focus on the "ambient audit" problem (the phenomenology of constant moral calculation).
  2.  **Attack the methodology:** Challenge whether CSM intuitions are reflective equilibria or just biases.
  3.  **Look at Non-Ideal Theory:** Shift from "What is the right theory?" to "How do agents navigate the gap between the right theory and human capacity?"

  The debate hasn't moved because everyone is trying to prove the other side's *conclusion* wrong, rather than dissecting why their *starting premises* make the conclusion inevitable. Progress requires admitting that the "stall" is actually a stable equilibrium of two incompatible normative worldviews.
