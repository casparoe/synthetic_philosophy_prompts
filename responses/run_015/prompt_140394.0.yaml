  So I'll take the horn that admits some vagueness in the transition zone rather than claiming nine millennia of systematic error. That costs me the promise of razor-sharp boundaries for every single generation, but it doesn't make content a fake posit. It just acknowledges that evolution is a messy process where old functions fade and new ones take over gradually. What I won't concede is that current correlation fixes content. Even in the fuzzy middle, what matters is why the mechanism is still here, not just what it's doing today. If the mechanism persists due to seed-catching success, that historical fact—not the current correlation alone—fixes the new content. Vagueness in the switch-over is a small price to pay for keeping content grounded in real biological history.
