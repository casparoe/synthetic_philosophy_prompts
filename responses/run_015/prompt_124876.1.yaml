answer: |-
  This is a distinct argumentative category separate from *reductio ad absurdum*, and since no single standardized term exists across disciplines, you should classify it in your essay as **Epistemic Self-Undermining**.

  This phenomenon differs fundamentally from *reductio ad absurdum* because it does not derive a logical contradiction (A and not-A) from the theory's premises. Instead, it derives an *epistemic defeater*: if the theory is true, the observer loses the justification for believing the theory. In a *reductio*, the theory is logically impossible; in Epistemic Self-Undermining, the theory might be physically possible, but it renders itself unknowable or unjustifiable to the proponent. For example, a logical contradiction makes a statement false by the laws of thought, whereas Epistemic Self-Undermining makes a theory irrational to hold because it destroys the reliability of the evidence supporting it.

  It is also distinct from ordinary empirical falsification. In standard falsification, external data conflicts with a prediction (e.g., the model predicts a blue sky, we see red). In Epistemic Self-Undermining, the conflict is internal to the status of the observer: the theory predicts that the observer's data-gathering apparatus (their brain, senses, or memory) is likely malfunctioning or atypical. The Boltzmann Brain argument works this way: the model isn't falsified because we see something it forbids, but because it implies we *should not trust* what we see, thereby removing the ground for accepting the model itself.

  You must distinguish this from performative contradictions (a subset of pragmatic contradictions), where the *act* of stating a proposition contradishes its content (e.g., saying "I am not speaking"). Epistemic Self-Undermining does not require the theory to be asserted to be false; it holds even if the theory is merely contemplated. The undermining targets the *conditions of possibility* for knowledge, not the speech act itself. For your boundary conditions, classify an argument as Epistemic Self-Undermining only if the theory's truth probabilistically or necessarily degrades the reliability of the specific cognitive faculties used to evaluate it. It does not apply if the theory merely predicts that observers are rare, unless it predicts that *typical* observers are deluded regarding the theory in question. Use this classification to show that the argument attacks the *link* between evidence and theory, rather than the evidence or the theory in isolation.
