  The rigid edges that his fingers claim.
  The world wakes up but leaves him blind.
  Where the light falls on shapes he can't name.

  There is no map to match the frame.
  Though sight and touch should be combined.
  The rigid edges that his fingers claim.

  The sphere and cube look just the same.
  A gap persists inside the mind.
  Where the light falls on shapes he can't name.

  He cannot make the vision tame.
  To leave the visual doubts behind.
  The rigid edges that his fingers claim.

  The world remains a stranger's flame.
  No instant bridge is there to find.
  Where the light falls on shapes he can't name.

  The senses do not play the game.
  So touch must pull him from the blind.
  The rigid edges that his fingers claim.
  Where the light falls on shapes he can't name.

  ### Why the refrains don't merge

  The first refrain anchors the subject in tactile certainty, representing the knowledge his hands have already secured. The second refrain captures the visual confusion, describing illumination that fails to convey conceptual identity. By maintaining these lines as distinct entities throughout the poem, the structure prevents the two senses from synthesizing too early. Even in the final couplet, they remain separate verses, refusing to merge into a single unified statement. This formal resistance mirrors the philosophical conclusion that cross-modal recognition is not immediate but requires an epistemic bridge built over time.
