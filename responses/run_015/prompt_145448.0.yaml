  Here is the breakdown of where your roommate nailed Williams and where he drifted into invention.

  **1. The Claim: Moral demands are "bullying" if not in your S**
  **Verdict: Fair enough.**
  Williams famously attacked what he called "the morality system" (mostly Kantian and Utilitarian frameworks). He argued that when philosophers say you have a moral obligation *regardless* of your desires or projects, they are making a false claim about reasons. If an obligation doesn't connect to your Subjective Motivational Set (SMS), it has no normative grip on you. Calling this "philosopher-made-up pressure tactics" is a colloquial but accurate translation of Williams's view that external moral obligations are philosophically confused attempts to coerce agents without motivational grounding.

  **2. The Claim: Reflection only "reshuffles" existing desires**
  **Verdict: Unfair distortion.**
  This is a major misreading. Williams explicitly rejects the Humean idea that reason is merely the slave of the passions. He argues that deliberative reasoning can do more than just calculate means to ends; it can involve imagination, correcting factual errors, and considering conflicts between motivations. Through this process, your SMS can actually *grow* or change. You can deliberate your way into a new motivation that wasn't there before. It isn't just reshuffling the deck; you can draw new cards through the act of thinking.

  **3. The Claim: The SMS is a "locked box" / No reason portability**
  **Verdict: Roommate's invention.**
  This is the biggest error. Williams never claims the SMS is static or locked. He acknowledges that joining a profession, falling in love, or adopting a social role changes your SMS. Once you take on a job, "doing this job well" enters your SMS, and you now have internal reasons to act accordingly. Your roommate claims roles *can't* bring in reasons; Williams says they *do* bring in reasons, but they become *internal* reasons once you adopt the role. There is no "portability" of external reasons (because they don't exist), but there is full portability of internal reasons via changing your life and commitments.

  **4. The Conclusion: All moral obligations are fake pressure**
  **Verdict: There is a logical gap.**
  This does not fully follow. Williams argues that *external* moral obligations (ones claiming authority independent of your motives) are false. He does not argue that *all* moral obligations are fake. If you care about being just, or you have a commitment to your community, then moral obligations relative to those commitments are very real reasons. Your roommate's conclusion wipes out morality entirely; Williams only wipes out the claim that morality has authority over you if you don't care about it.

  **Summary**
  Your roommate got the headline right (Internalism is true, Externalism is false) but got the mechanics wrong. He treated the SMS as a static prison rather than a dynamic set that evolves through deliberation and life choices.

  Verdict: partially fair — core internalism is right, but locked box is roommate's invention
