      *   **Explain the "Cost":** What do we give up? We give up *Libertarian Free Will* (perhaps) or the idea that "could have done otherwise" means "could have existed in a different block." We adopt a **Compatibilist** stance. We redefine agency as *counterfactual dependence within the block* rather than *ontological creation of the future*.
