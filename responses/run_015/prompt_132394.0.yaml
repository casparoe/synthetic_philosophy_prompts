prompt: |-
  Hey, I'm putting together discussion notes for my philosophy of time course and I've tied myself in knots over a student argument that extends Rietdijk and Putnam into ethics. The core idea is familiar: in special relativity there's no privileged simultaneity plane, so if observer A on Earth calls event E 'now' while observer B near Andromeda (moving fast enough) includes E in her 'past', then E can't be objectively present or absent—it's just perspectival, like 'here'. From that they build this chain: (1) If temporal location is purely indexical, then the past/present/future distinction carries no ontological weight. (2) So every event—yesterday's lecture, tomorrow's exam, a star exploding in 3024—exists in exactly the same way inside the four-dimensonal block. (3) But then my present 'choice' to grade papers instead of sleeping isn't special in bringing about some future state; it's just one slice of my worldline that stands in the same static relation to every other slice. (4) That wipes out the asymmetry between fixed past and open future that makes moral responsibility, regret, or even causal efficacy make sense—I'm not 'acting into' an open future, I'm just being a worm in the block. (5) So either eternalism is false and SR needs reinterpretation, or our ordinary concept of agency is a kind of mass delusion.

  I think the slide is somewhere between (3) and (4) but I cant quite name it. Is it an equivocation between 'existing tenselessly' and 'being causally determined'? Or does eternalism actually commit us to denying that present mental states cause future actions, which sounds like determinism but maybe isn't? I want to keep (1) and (2)—the physics and the block ontology seem right—but I'd rather not pay the price of (5). Which step do I reject, and what does rejecting it cost? Also, don't ask me to cite page numbers; I remember Putnam used the Andromeda galaxy example but I'm not sure about the exact formulation, so just work with the structure I sketched. There's prety obviously a typo in here somewhere but you get the idea.
