answer: |-
  ### Specification of Normative Requirements for Vector-Control and Crop-Protection

  The following table specifies the necessary conditions for any ethical framework adopted by a public agency. These requirements are derived from the structural problems inherent in pest control decisions, rather than from a specific metaphysical stance on insect sentience.

  | Requirement (imperative, one sentence, numbered R1, R2, …) | Motivating_Case | Status | Excludes | Conflicts |
  | :--- | :--- | :--- | :--- | :--- |
  | **R1: The justification must distinguish between vital human interests (e.g., life-saving) and trivial interests (e.g., cosmetic yield) when weighing insect harm.** | (1) *The asymmetry case*: Spraying for malaria vs. coating seeds for slightly higher cosmetic crop yield. | Non-negotiable | Aggregative cost-benefit analysis that treats all human preferences as commensurable units. | R9 (Vitality assessments are often qualitative, resisting algorithmic determinacy). |
  | **R2: The account must weight the duration and phenomenology of death, not merely the binary fact of mortality.** | (2) *The dying-time problem*: Neurotoxins causing hours of convulsion vs. instantaneous mechanical destruction. | Non-negotiable (Precautionary) | Purely outcome-based metrics that count only population reduction numbers regardless of method. | R9 (Uncertainty about sentience makes agony calculations indeterminate). |
  | **R3: Pest status must be defined relationally to specific human projects, not as an intrinsic biological property.** | (3) *The constitution worry*: A caterpillar is a pest in brassica but unremarkable on a roadside verge. | Non-negotiable | Essentialist views that treat certain species as inherently "evil" or "worthy of eradication." | None. |
  | **R4: Interventions must be evaluated for their impact on future option sets, specifically regarding resistance and dependency.** | (4) *The lock-in objection*: Killing selects for resistance, creating permanent dependence on further killing. | Non-negotiable | Static decision models that evaluate interventions as one-off events without diachronic consequences. | None. |
  | **R5: Claims that insects 'would have died anyway' must be substantiated by specific ecological modeling, not assumed as a default exemption.** | (5) *The baseline problem*: Assuming natural mortality absolves the agent of responsibility for induced mortality. | Non-negotiable | Counterfactual laziness that uses "natural death" to zero-out the moral cost of intervention. | None. |
  | **R6: The framework must articulate a value stance on population suppression that prevents existence versus killing existing individuals.** | (6) *Suppression without killing*: Sterile-insect releases and gene drives reduce numbers by preventing birth. | Non-negotiable | Death-counting views that cannot formulate the ethics of non-existence or population size. | None. |
  | **R7: Those bearing the physical risks of the intervention must have procedural standing in the authorization process.** | (7) *Risk-bearing and say*: Farmworkers and downwind households absorb exposure but are not beneficiaries. | Non-negotiable | Technocratic paternalism that locates legitimacy solely in expert consensus or distant beneficiary welfare. | R9 (Participatory process introduces ambiguity and delays determinate outputs). |
  | **R8: Justifications must include limits on redeployment to non-target species or contexts to prevent scope creep.** | (8) *Migration*: Techniques developed for malaria mosquitoes get redeployed to nuisance midges or agricultural pests. | Non-negotiable | Universalist principles that allow a justification in one context to automatically validate all analogous contexts. | None. |
  | **R9: The framework must yield a single determinate decision even under radical uncertainty.** | Co-author's candidate: Demand for decision under uncertainty about sentience and ecosystem effects. | Camp Preference (Decision-Theoretic/Managerial) | Epistemic humility that recommends suspension of judgment or adaptive management over fixed decisions. | R1, R2, R7 (Complex qualitative judgments and process resist algorithmic closure). |

  ### Commentary on Tensions and Exclusionary Power

  **Consciousness vs. Mode of Death (R2)**
  The requirements "must not presuppose contested claims about invertebrate consciousness" and "must discriminate between modes of death" **can both stand**, but only if R2 is interpreted through the **Precautionary Principle**. The framework does not need to assert that insects *are* sentient (which would violate the first constraint); it must assert that there is a *non-zero probability* of sentience sufficient to trigger a duty of care. If an agency authorizes a method known to cause convulsions in vertebrates on an invertebrate without testing for analgesia, it risks inflicting torture. Therefore, R2 is non-negotiable not because sentience is proven, but because the risk of inflicting agony is morally asymmetric (the cost of false negative is high).

  **Procedural Legitimacy vs. Determinacy (R7 vs. R9)**
  The procedural requirement (R7) and the demand for determinacy under uncertainty (R9) **cannot be jointly satisfied** in high-stakes contexts. R7 requires listening to risk-bearers who may reject the expert risk model; this introduces political contingency and ambiguity. R9 demands a function that maps inputs to a single output regardless of dissent. An agency must choose between *legitimacy* (R7) and *decisiveness* (R9). A framework claiming to offer both is likely masking the political choice as a technical calculation.

  **The Most Exclusionary Requirement**
  **R1 (Proportionality of Interest)** does the most work in excluding otherwise popular views. Most public agencies operate on **Cost-Benefit Analysis (CBA)**, which treats all human benefits as commensurable monetary or utility units. Under standard CBA, preventing 1,000 cases of crop damage could theoretically outweigh preventing 1 case of malaria if the economic values align. R1 forbids this trade-off categorically. It forces a lexical ordering of human interests (vital vs. trivial) before the insect cost is even calculated. This excludes standard economic utilitarianism and forces the agency to justify the *type* of human end, not just the *magnitude*.

  ### Ethics Framework Scorecard

