      *   This scenario is almost exactly Gregory Kavka's **Toxin Puzzle** (1983).
      *   *The Puzzle:* An eccentric billionaire offers you $1 million if you *intend* to drink a harmless but painful toxin tomorrow. You don't actually have to drink it, just intend to. Once you have the intention (and the money is secured), why would you drink it? Knowing you won't drink it, can you form the intention?
      *   *Relevance:* This is the exact same structure. $500 instead of $1M, running in rain instead of drinking toxin.
      *   *The Consensus:* Most philosophers argue you *cannot* genuinely intend to do something you know you will not do. Intention implies a belief that you *will* (or at least might) do it based on your current will.

