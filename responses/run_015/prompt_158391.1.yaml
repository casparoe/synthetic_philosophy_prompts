  2.  **Deconstruct the Philosophical Core:**

      *   *The Nonidentity Problem:* Choices affect *who* comes into existence. If a policy brings about a person with a life worth living but worse than the person who *would* have existed under a different policy, have we harmed them? No, because without the policy, *they* wouldn't exist.
      *   *The Workshop Twist:* Instead of asking "Did we harm them?", the workshop forces an administrative procedure that *requires* identity matching to register harm. This mimics the person-affecting view's constraint.
      *   *The "Dissolution":* Students will try to compare welfare. The rules will stop them. They will feel the frustration of having clear welfare deficits but no *victim* to pin it on according to the rules.

  3.  **Drafting the Workshop Structure:**

      *   **Time Allocation:** 90 minutes total.
          *   Intro & Setup: 15 mins.
          *   Board Deliberation (Choice): 15 mins.
          *   Ledger Work (The Trap): 30 mins.
          *   Cross-Claim & Rejection: 15 mins.
          *   Debrief: 15 mins.
      *   **Materials:** Need specific packets for Alpha and Beta that look official but contain incompatible biographical data. Need the Ledger sheets. Need the "Rules of Procedure."
      *   **Roles:** Facilitator (me/you), Board Members (students). No specific roles within boards needed, they act as a committee.

  4.  **Developing the Scenario Details:**

      *   *Trajectory Alpha:* "The Arcology Model." High density, nuclear baseload, strict zoning. Result: Stable climate, high economic output, low mobility. Conception conditions: Urban centers, specific parental employment contracts.
      *   *Trajectory Beta:* "The Archipelago Model." Dispersed, wind/solar, high mobility. Result: Variable climate adaptation, lower density, high migration. Conception conditions: Rural/semi-rural, transient parental pairings.
      *   *The Disjoint Registries:* Alpha profiles need birth dates/locations/parents that *could not* exist in Beta (e.g., conceived in Sector 7 Nuclear Housing, parents employed by State Grid). Beta profiles need birth dates/locations/parents that *could not* exist in Alpha (e.g., conceived in Mobile Unit 44, parents are seasonal migrators).
      *   *The Ledger Rule:* "Biographical Substrate Continuity" (BSC). To log harm, Person X in World A must match Person X in World B on: Conception Date (+/- 3 days), Conception Location (same coordinates), Genetic Progenitors (same IDs).

  5.  **Refining the "Trap":**

      *   The prompt asks for the trap to be hidden in the procedure. The students must think they are doing normal policy evaluation.
      *   *Instruction:* "Identify serious welfare deficits and assign harm."
      *   *Constraint:* "Use the Transworld Harm Ledger."
      *   *The Kicker:* They choose *one* trajectory first. Then they get profiles from *that* trajectory. Then they have to find the counterpart in the *other* trajectory to log the harm.
      *   *Wait, correction:* If they choose Alpha, they get Alpha profiles. To log harm, they need to show that *these specific people* would have been better off in Beta. But the Ledger requires finding the *same person* in Beta. Since the profiles are disjoint, they can't find the match.
      *   *Administrative Standstill:* They have a list of suffering people (Alpha). They want to say "Beta would have been better." The Ledger says "Show us the person in Beta." They can't. Therefore, no harm logged.

  6.  **Addressing Predictable Failures:**

      *   *Impersonal Welfare:* "But total utility is lower!" -> Ruling: Ledger requires specific identity.
      *   *Averaging:* "The population is worse off." -> Ruling: Ledger requires individual rows.
      *   *Hybrid Identities:* "Let's assume a generic person." -> Ruling: BSC criteria are strict.
      *   *Facilitator Stance:* Bureaucratic, rigid, "I'm just the auditor."

  7.  **Drafting the Debrief:**

      *   Map the experience to the philosophy.
      *   Moment 1: Confidence (Person-Affecting Intuition).
      *   Moment 2: Failure of BSC (Nonidentity).
      *   Moment 3: Administrative Void (Collapse of Comparative Harm).
      *   Limitation: The simulation shows procedural failure, not metaphysical truth. The facilitator must explain the metaphysics (there is no *same person* in the other world).

  8.  **Review against Constraints:**

      *   90 minutes? Yes.
      *   14 students, 2 boards? Yes.
