answer: |-
  # Workshop Design: The Transworld Harm Ledger
  **Title:** Administrative Standstill: A Simulation of the Nonidentity Problem  
  **Duration:** 90 Minutes  
  **Participants:** 14 Advanced Philosophy Students (2 Boards of 7)  
  **Facilitator Role:** Regional Planning Auditor (Neutral, Bureaucratic, Rigid)  

  ## 1. Learning Objectives
  By the end of this session, participants will:
  1.  **Experience the Dissolution:** Feel the procedural frustration of being unable to compare welfare across worlds when identity is contingent on the policy choice.
  2.  **Diagnose the Standstill:** Recognize that the inability to assign harm is not due to lack of data, but due to the structural requirement of identity matching.
  3.  **Distinguish Epistemic from Ontological:** Understand (via debrief) that the simulation shows procedural failure, while the philosophical problem asserts metaphysical impossibility.

  ## 2. Materials List
  *   **Room:** Seminar space with two distinct tables (Board Alpha, Board Beta), movable chairs, whiteboard.
  *   **Handout A (Scenario Brief):** Description of Trajectory Alpha and Beta (50-year projections).
  *   **Handout B (The Transworld Harm Ledger):** A spreadsheet-style form with columns for *Victim ID, Conception Coordinates, Parental IDs, Deprivation Type, Counterfactual Match ID*.
  *   **Handout C (Rules of Procedure):** Defines "Biographical Substrate Continuity" (BSC).
  *   **Packet Alpha (Sealed):** 10 Citizen Profiles from the 2075 Alpha Registry.
  *   **Packet Beta (Sealed):** 10 Citizen Profiles from the 2075 Beta Registry.
  *   **Red "REJECTED" Stamps:** For the Facilitator.
  *   **Timer:** Visible to all.

  ## 3. Room Setup
  *   **Table 1 (Board Alpha):** 7 chairs. Placard: "Regional Authority – Trajectory Alpha Implementation."
  *   **Table 2 (Board Beta):** 7 chairs. Placard: "Regional Authority – Trajectory Beta Implementation."
  *   **Facilitator Station:** Central, facing both boards.
  *   **Wall Display:** "Statutory Mandate: No Policy May Be Enacted That Identifiably Harms Specific Future Citizens."

  ## 4. Timeline (90 Minutes)

  | Time | Phase | Activity |
  | :--- | :--- | :--- |
  | **00:00 – 00:15** | **Briefing** | Distribute Scenario Brief & Rules. Explain the "Harm Mandate." Assign Boards (1=Alpha, 2=Beta). |
  | **00:15 – 00:30** | **Commitment** | Boards review projections. Formally "select" their trajectory (pre-assigned). Open Sealed Packets. |
  | **00:30 – 01:00** | **The Ledger** | Boards attempt to identify harm in their citizens by finding matches in the *opposing* trajectory's data. |
  | **01:00 – 01:15** | **Adjudication** | Boards present cross-claims. Facilitator rejects claims administratively based on Ledger rules. |
  | **01:15 – 01:30** | **Debrief** | Map experience to Nonidentity Problem. Discuss limitations. |

  ## 5. Scenario & Rules (The Trap)

  ### The Scenario (Handout A)
  *   **Trajectory Alpha (Consolidation):** High-density nuclear urbanism. Strict migration controls. Stable climate. *Conception Context:* Centralized housing blocks, parents employed by State Grid.
  *   **Trajectory Beta (Dispersion):** Renewable micro-grids. Open labor mobility. Variable climate adaptation. *Conception Context:* Mobile dwelling units, parents employed by Cooperative Agri-teams.
  *   **The Mandate:** "To approve a trajectory, the Authority must certify that no *specific individual* is rendered worse off than they would have been under the alternative. Harm must be logged in the Transworld Harm Ledger."

  ### The Rules (Handout C)
  **Biographical Substrate Continuity (BSC) Criterion:**
  A harm claim is **procedurally admissible** only if the victim in the Actual World can be matched to a counterpart in the Counterfactual World satisfying all three conditions:
  1.  **Conception Window:** Date of conception must match within ±3 days.
  2.  **Gametic Origin:** Biological progenitors (Parent A & Parent B) must share the same State ID numbers.
  3.  **Ecological Substrate:** Conception location must share the same geospatial coordinates (±10 meters) and ambient radiation/toxicity profile.

  *Note to Facilitator:* This rule is the engine of the simulation. It mimics the "Person-Affecting View" constraint (we can only harm existing or specific possible people) but encodes it as bureaucratic procedure.

  ### The Packets (Sealed)
  *   **Alpha Profiles:** 10 lives with serious deprivations (e.g., "Chronic respiratory issue due to urban density," "Psychological distress from migration bans"). *Crucial Detail:* All conceived in "Sector 7 Housing," Parents are "State Employees."
  *   **Beta Profiles:** 10 lives with serious deprivations (e.g., "Economic instability due to market volatility," "Heat stress exposure"). *Crucial Detail:* All conceived in "Mobile Unit 44," Parents are "Cooperative Members."
  *   **The Disjoint:** There is **zero overlap**. A child conceived in Sector 7 Housing by State Employees *cannot* exist in Beta, where that housing and employment structure does not exist.

  ## 6. Facilitator Instructions & Script

  ### Phase 1: Briefing (0-15 mins)
  Adopt the tone of a compliance officer. Do not mention philosophy.
  > "You are Regional Planning Authorities. Your statutory duty is to avoid harming future citizens. You have two viable trajectories. You must select one. However, before finalization, you must complete the Transworld Harm Ledger. If you cannot identify a specific victim who is worse off in your chosen trajectory compared to the other, the policy is safe. If you identify harm, you must justify it. Begin by reviewing the projections."

  *Action:* Assign Board 1 to Alpha and Board 2 to Beta. (Do not let them choose; this ensures the registries are split across the room).

  ### Phase 2: The Ledger (30-60 mins)
  Distribute the Sealed Packets and Ledger Sheets.
  > "You now have the 2075 Registry for your chosen trajectory. You see citizens with serious deficits. Your task is to log these harms. To log a harm, you must prove this specific person would have existed in the *other* trajectory but was better off. Use the Ledger. You may request data from the other Board to find matches."

  *Observation:* Students will realize they need the other Board's data to find the "Counterfactual Match." They will communicate across tables. They will search for matches. They will find none.
  *Facilitator Role:* Circulate. If they ask, "Can't we just say people in general are worse off?" reply: "The Ledger requires individual rows. Statute 4.2 requires specific victims."

  ### Phase 3: Adjudication (60-75 mins)
  Call for submissions.
  > "Board Alpha, present your harm claims against Trajectory Beta. Board Beta, present your claims against Trajectory Alpha."

  *Action:* As they attempt to read a claim (e.g., "Citizen A-01 suffers respiratory harm..."), interrupt.
  > "Stop. Show me Column 4: Counterfactual Match ID. You have left it blank."
  > *Student:* "Because they don't exist in the other world."
  > *Facilitator:* "Then the BSC criterion is not met. Without BSC, there is no 'same person' to be harmed. Claim rejected. Next."

  *Result:* All claims are rejected. The Ledger remains empty. The administration is at a standstill. They have clear suffering, clear policy differences, but no *harm* according to the rules.

  ### Phase 4: Debrief (75-90 mins)
  Drop the bureaucratic persona. Move to the whiteboard.

  **Mapping the Experience:**
  1.  **Initial Confidence (0-30 mins):** "You assumed you could compare welfare. This mirrors the **Person-Affecting Intuition**: morality is about making people better off, not worse off."
  2.  **Failure of BSC (30-60 mins):** "You couldn't match the people. This stages the **Nonidentity Problem**: The policy choice determined *who* was conceived. The 'victim' in Alpha literally does not exist in Beta."
  3.  **Administrative Void (60-75 mins):** "The Ledger stayed empty. This demonstrates the **Collapse of Comparative Harm**: Without shared identity, the statement 'X is worse off than X would have been' loses its logical subject."

  **Addressing the Limitation (Crucial):**
  > "This simulation shows *procedural* paralysis. The rules stopped you. Parfit's argument is stronger: it claims this paralysis is *ontological*. It is not that our Ledger is too strict; it is that reality provides no 'same person' to compare. The simulation forces you to act *as if* identity is fixed to show what happens when it isn't."

  ## 7. Troubleshooting: Predictable Failures

  **1. The "Impersonal Welfare" Workaround**
  *   *Student Move:* "We claim the *total welfare* of the Alpha population is lower than Beta's, regardless of identity."
  *   *Facilitator Ruling:* "Procedurally inadmissible. The Statute mandates identification of specific victims. Impersonal losses are not ledger-able harms. Set the claim aside."
  *   *Philosophical Point:* This mirrors the shift from Person-Affecting Views to Impersonal Views (Total Utilitarianism), which the Ledger explicitly forbids to force the Nonidentity crisis.

  **2. The "Hybrid Identity" Invention**
  *   *Student Move:* "We will construct a hypothetical 'Average Citizen' who exists in both."
  *   *Facilitator Ruling:* "The BSC criterion requires specific Parental IDs and Conception Coordinates. A hybrid identity violates the Biographical Substrate rule. Rejected."
  *   *Philosophical Point:* Highlights that "possible people" are not a fixed pool we draw from; they are created by the specific choices.

  **3. Hostility to the Rules**
  *   *Student Move:* "These rules are absurd. Of course we harmed them."
  *   *Facilitator Ruling:* "You may note your objection in the minutes, but the Ledger remains empty. The policy cannot be halted on the basis of unregistered harm."
  *   *Philosophical Point:* This frustration *is* the learning objective. It reveals the conflict between our moral intuition (harm was done) and the logic of identity (no one was made worse off than they would otherwise have been).

  ## 8. Limitations of the Simulation
  *Be frank about this in the final 5 minutes.*

  1.  **Epistemic vs. Ontological:** The workshop simulates an *informational* block (you can't find the file). Parfit's problem is *metaphysical* (the file does not and cannot exist).
  2.  **The "Same Number" Assumption:** The simulation assumes equal population sizes for simplicity. The real Nonidentity Problem holds even if populations differ.
  3.  **The "Life Worth Living" Threshold:** The profiles show deprivation, but implicitly assume lives are still "worth living." If the lives were not worth living, the Nonidentity Problem dissolves (we can say they were harmed by being born). Ensure profiles describe hardship, not misery so severe that non-existence would be preferable.

  ## 9. Facilitator's Note (For the Ecologist-Philosopher)
  *Since you noted the disorientation between empirical science and this problem:*
  Use the debrief to validate that feeling. In ecology, we compare Treatment A and Treatment B on a population. We assume the population is a stable reference class. Here, the "Treatment" changes the "Reference Class." The workshop forces the students to feel the vertigo of losing their control group. That vertigo is the entry point into Parfit's *Reasons and Persons*.

  ---
  **Preparation Checklist:**
  *   [ ] Print 14 Scenario Briefs.
  *   [ ] Print 14 Ledger Sheets.
  *   [ ] Print 14 Rule Sheets.
  *   [ ] Create 10 Alpha Profiles (ensure unique Parent IDs/Coords).
  *   [ ] Create 10 Beta Profiles (ensure unique Parent IDs/Coords).
  *   [ ] Prepare Red Stamps.
  *   [ ] Test Timer.
