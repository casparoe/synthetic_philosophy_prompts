      *   **The Problem:** The user constructed an argument (steps 1-7) to challenge a colleague's meme theory. The argument seems valid but leads to a conclusion the user rejects (that genetic natural selection doesn't causally explain phenotypes either). The user suspects a sleight of hand regarding "heredity" vs. "copying" but can't pinpoint it.
      *   **Constraints:** Wants to keep (1) (Darwinism needs heritable variation in fitness). Wants to keep (2) (Cultural transmission is reconstructive). Doesn't want to treat all culture equally (tech vs. urban legends). Wants to know which step to reject, the cost of rejection, and how it affects the biological analogies (6 & 7).

  2.  **Deconstruct the Argument:**
