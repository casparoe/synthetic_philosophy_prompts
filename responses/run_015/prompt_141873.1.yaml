answer: |-
  This is a sophisticated argument that effectively reconstructs the debate between **memeticists** (Dawkins, Blackmore, Hull) and **cultural epidemiologists** (Sperber, Claidière, Morin). You have correctly identified that if your argument holds for culture, it ought to hold for biology via the Evo-Devo lens. Since you know it *doesn't* hold for biology (selection on genes is causal), the argument must contain an equivocation.

  You are right to suspect you have slid between notions of heredity. The diagnosis is that **Step (3) is the failure point**, specifically in its definition of "descent with modification." Rejecting (3) allows you to keep (1) and (2), saves biological selection from your *reductio* in (6), and permits the distinction between different cultural domains you desire in (7).

  Here is the detailed diagnosis.

  ### 1. The Diagnosis: Step (3) conflates "Copying" with "Causal Specificity"

  Step (3) claims: *If what passes between people is a reconstruction... then the resemblance... is not descent with modification. It is the repeated generation of a similar product by a shared generative mechanism.*

  This is a false dichotomy. In biology, the phenotype is *also* "the repeated generation of a similar product by a shared generative mechanism" (development). Yet we still call it descent with modification. Why? Because **causal specificity** is maintained.

  *   **Biological Case:** The offspring's phenotype is reconstructed by the cell. However, specific differences in the parent's genotype map to specific differences in the offspring's phenotype (holding environment constant). The parent's state *constrains* the reconstruction.
  *   **Cultural Case:** Sometimes, the learner's reconstruction is constrained primarily by psychological attractors (the "shared generative mechanism" you mention). In this case, the specific variation in the teacher's output makes little difference to the learner's output; the learner converges on the attractor regardless. **Here, your argument holds.**
  *   **The Exception:** But sometimes, the specific variation in the teacher's output *does* constrain the learner's reconstruction. If I teach you a specific knot, a specific code, or a specific chemical formula, your reconstruction is tightly bound to my specific input, not just to general psychological biases.

  **The Mistake:** Step (3) assumes that because reconstruction occurs, the *source* loses causal control over the *specifics* of the product. It treats "reconstruction" as synonymous with "loss of lineage." But reconstruction is compatible with lineage if the reconstruction process is **parameterized by the source**.

  ### 2. The Cost of Rejecting Step (3)

  If you reject (3), you must accept that **reconstructive transmission can still sustain a replicator dynamic**, provided the reconstruction is sufficiently constrained by the source.

  **What this costs you:**
  You cannot rule out memes *a priori* based solely on the fact that brains reconstruct information. You must concede that *some* cultural items function as replicators.

  **What this saves you:**
  1.  **It saves Biology (Step 6):** You can now say: "Genes are replicators not because they physically copy phenotypes, but because they exert high causal specificity over the reconstructed phenotype." This aligns with your expertise: DNA doesn't build the protein; the ribosome does. But the DNA sequence specifies the order. That specification is the heredity.
  2.  **It saves Darwinism (Step 1):** You keep the requirement for heritable variation in fitness. You just acknowledge that heredity is a matter of degree (causal specificity), not a binary switch (copy vs. reconstruct).
  3.  **It validates your intuition about Domains (Step 7):** This is the biggest win. You wanted to distinguish cumulative technology from urban legends.
      *   **Urban Legends:** Low causal specificity. The teller's specific wording matters less than the "shock value" (attractor). The reconstruction is driven by psychology. Your argument works here; these are not memes in the strong sense.
      *   **Cumulative Technology:** High causal specificity. To build a radio, you must reconstruct the circuit *specifically* as taught. Deviations (mutations) usually break function. Here, selection acts on the variants because the reconstruction fidelity is high enough to maintain the lineage.

  ### 3. Addressing the Quantitative Objection (Step 7)

  Your Quasispecies/Error Threshold argument is powerful, but it relies on treating cultural transmission as **unscaffolded neural replication**.

  *   **The Virus Analogy:** RNA viruses evolve despite high error rates because (a) the genome is short, (b) the selection coefficient ($s$) is massive (replicate or die), and (c) selection acts on the **quasispecies cloud**, not just the master sequence.
  *   **The Cultural Reality:** Complex cultural items (technology) are rarely maintained by neural transmission alone. They are **scaffolded**. We write things down, we build jigs, we create standards. This external storage acts as error correction.
  *   **The Fix:** If you treat the "replicator" as the *coupled system* of brain + external storage (notebooks, hard drives, tools), the effective fidelity rises drastically.
  *   **Rejection of (7)'s Conclusion:** You do not need to abandon the fidelity constraint. You simply acknowledge that human cultural evolution bypassed the error threshold by changing the *medium* of replication (niche construction), much like the transition from RNA to DNA + repair enzymes in biology.

  ### 4. Summary of the Trade-offs

  | Step | Status | Reasoning |
  | :--- | :--- | :--- |
  | **(1)** | **Keep** | Darwinism requires heritable variation. Causal specificity satisfies "heritable." |
  | **(2)** | **Keep** | Transmission is reconstructive. This is empirically true for both biology and culture. |
  | **(3)** | **Reject** | Reconstruction does not preclude lineage. Lineage depends on **causal specificity** (does source variation map to product variation?), not physical copying. |
  | **(4)** | **Modify** | Selection is not *just* a redescription. It is the differential retention of variants that survive the reconstruction filter. Attractors shape the landscape; selection moves the population. |
  | **(6)** | **Dissolved** | Biological selection is saved because genes exert causal specificity on development, just as high-fidelity cultural instructions exert specificity on reconstruction. |
  | **(7)** | **Refined** | Fidelity limits apply, but humans use external scaffolding to raise fidelity. RNA viruses survive via short genomes/high $s$; tech survives via scaffolding. |

  ### 5. Final Recommendation

  You should tell your colleague: **"I reject Step (3). Reconstruction is not the opposite of heredity; it is the mechanism of heredity in both biology and culture. The question is not 'is it copied?' but 'how tightly does the source constrain the reconstruction?'"**

  This allows you to maintain your skepticism about "memes" for low-fidelity domains (folklore, where attractors dominate) while conceding that high-fidelity domains (technology, science, writing) do constitute a second replicator system, without undermining the causal status of genetic selection. It turns the debate from "Memes vs. Attractors" into "Where on the spectrum of causal specificity does this cultural trait lie?" which matches your empirical intuition.
