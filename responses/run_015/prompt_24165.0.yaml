answer: |-
  ### The Scenario: River City Mortgage

  River City Bank uses an ML model to approve mortgages. There are two applicant groups, **Northside (A)** and **Southside (B)**, each with 1,000 applicants. The model predicts the likelihood of **Repayment ($Y=1$)** versus **Default ($Y=0$)**. The bank approves the loan if the model's score exceeds a threshold. Historical data shows a genuine gap in the **base rate of the bad outcome (Default)**: Northside has a 20% default rate (80% repayment), while Southside has a 40% default rate (60% repayment). This gap reflects systemic economic disparities, not measurement error. The model is equally accurate for both groups (same ROC curve), but the bank must choose a decision threshold.

  ### The Arithmetic of Impossibility

  We define the two fairness criteria as follows:
  1.  **Demographic Parity (DP):** Equal approval rates across groups ($P(\text{Approve}|A) = P(\text{Approve}|B)$).
  2.  **Equalized Odds (EO):** Equal True Positive Rates (TPR) and False Positive Rates (FPR) across groups.
      *   $TPR = P(\text{Approve} | \text{Repay})$
      *   $FPR = P(\text{Approve} | \text{Default})$

  **Step 1: Attempting to satisfy Equalized Odds**
  Assume the bank sets thresholds to achieve perfect Equalized Odds. The model performs identically on both groups at this threshold:
  *   $TPR = 0.80$ (80% of repayers get loans)
  *   $FPR = 0.10$ (10% of defaulters get loans)

  Now, we calculate the total Approval Rate for each group using the law of total probability:
  $$ \text{Approval Rate} = (TPR \times \text{Repayment Rate}) + (FPR \times \text{Default Rate}) $$

  *   **Northside (A):**
      *   Repayers: 800 people. Defaulters: 200 people.
      *   Approvals from Repayers: $0.80 \times 800 = 640$
      *   Approvals from Defaulters: $0.10 \times 200 = 20$
      *   **Total Approvals:** $660 / 1000 = \mathbf{66\%}$

  *   **Southside (B):**
      *   Repayers: 600 people. Defaulters: 400 people.
      *   Approvals from Repayers: $0.80 \times 600 = 480$
      *   Approvals from Defaulters: $0.10 \times 400 = 40$
      *   **Total Approvals:** $520 / 1000 = \mathbf{52\%}$

  **Result:** Equalized Odds is satisfied (TPR and FPR are equal), but Demographic Parity is violated (66% vs 52%). The 14-point gap in approval rates is driven entirely by the difference in base rates ($800$ vs $600$ repayers), multiplied by the TPR.

  **Step 2: Attempting to satisfy Demographic Parity**
  To fix the parity violation, the bank must lower the approval rate for Northside or raise it for Southside. This requires sliding the decision thresholds differently for each group.
  *   To drop Northside approval from 66% to 52%, you must raise the threshold. This lowers both TPR and FPR for Northside.
  *   To keep Southside at 52%, their threshold stays put.
  *   **Result:** Northside's TPR is now lower than Southside's TPR. Equalized Odds is broken. You have reduced access for qualified Northside applicants to match the aggregate numbers of Southside.

  **The Load-Bearing Feature**
  The conflict exists because Approval Rate is a weighted average of TPR and FPR, where the weights are the Base Rates.
  $$ \text{Approval} = TPR \cdot (1 - \text{DefaultRate}) + FPR \cdot (\text{DefaultRate}) $$
  If $\text{DefaultRate}_A \neq \text{DefaultRate}_B$, and you force $TPR_A = TPR_B$ and $FPR_A = FPR_B$ (EO), the weighted sums *must* differ (violating DP). The only exception is if the classifier is useless ($TPR = FPR$), in which case the equation collapses to $\text{Approval} = TPR$, satisfying both trivially. If you close the base-rate gap (e.g., both groups have 20% default), the weights become identical, and EO mathematically implies DP.

  ### The Normative Clash

  When forced to choose, the debate is not about math, but about what constitutes harm.

  **The Demographic Parity Proponent argues:**
  > "Look at the outcome. Southside is being denied loans at a rate 14 points higher than Northside. Regardless of the error rates, this perpetuates historical exclusion. If we don't equalize the approval rates, we are allowing the algorithm to codify the existing economic disparity. We must lower the threshold for Southside to ensure equal access to capital."

  **The Equalized Odds Proponent counters:**
  > "Look at the errors. If you lower the threshold for Southside to match approval rates, you are inevitably increasing the False Positive Rate for that group. You will be approving more Southside applicants who will default, damaging their credit and the bank's solvency. Meanwhile, you are raising the threshold for Northside, denying qualified repayers there. Equalized Odds ensures that a qualified applicant has the same chance of success regardless of group. Parity sacrifices individual accuracy for group quotas."

  ### Escape Hatches and Their Costs

  There is no mathematical solution, only political and engineering tradeoffs.

  1.  **Randomized Thresholds:** You could randomly deny qualified Northside applicants to lower their approval rate to match Southside.
      *   *Cost:* Ethically abhorrent. Introduces noise and unpredictability into high-stakes decisions without improving accuracy.
  2.  **Dropping a Criterion:** Pick DP or EO and accept the violation of the other.
      *   *Cost:* Legitimacy loss. DP invites accusations of reverse discrimination/lower standards; EO invites accusations of systemic neglect/disparate impact.
  3.  **Retargeting the Prediction:** Change $Y$. Instead of predicting raw "Repayment," predict "Repayment *given financial counseling*."
      *   *Cost:* Construct Validity. You are no longer predicting the actual risk to the bank, but a counterfactual social outcome. This requires intervention resources, not just model tuning. If the intervention fails, the model is miscalibrated.

  **Summary:** The impossibility theorem holds because you cannot equalize the *flow* of decisions (DP) while equalizing the *accuracy* of decisions (EO) when the *input pools* (Base Rates) differ. You must decide whether fairness is about the distribution of resources or the equality of error.
