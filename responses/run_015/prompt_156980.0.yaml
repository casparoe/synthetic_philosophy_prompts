  **DRAFT v4.2 — THE LUCK PROTOCOL**
  **To:** Integrationist Working Group / Separatist Working Group
  **From:** [Your Name/Column]
  **Re:** Ground rules for the moral luck dataset

  Look, we've been circling this drain for years. The goal here isn't to convert the other side—that's not gonna happen. The goal is to map the exact coordinates where you diverge so my readers can see the fault line clearly. Below is the framework we're locking in before we run the cases.

  ### I. COMMON GROUND (The "Obviously" List)
  *Both camps sign off on these. No wiggle room.*

  1.  **Purpose of Assessment:** Moral responsibility isn't just metaphysical accounting; it's a tool for social regulation, guidance, and relationship maintenance. If assigning blame doesn't change future behavior or relationships, it's useless.
  2.  **Causal ≠ Moral:** Just because you caused an outcome doesn't mean you're morally responsible for it (e.g., a sneeze causing a crash). There is a filter between physics and ethics.
  3.  **No Self-Creation:** Nobody chose their parents, their genes, or their starting socioeconomic position. We are all, to some degree, products of forces outside our control. The "self-made man" is a myth.

  ### II. THE DIVIDE (How you talk about yourselves)
  *Use this wording when stating your position. No strawmanning.*

  | Feature | **Integrationists** | **Separatists** |
  | :--- | :--- | :--- |
  | **Core Thesis** | Luck is woven into the moral fabric. You can't separate the agent from their context. | Luck is noise. Moral responsibility tracks only the signal of internal control. |
  | **On Outcomes** | Outcomes matter because they reveal the reality of the action's impact on the world. | Outcomes are morally irrelevant if the intention and control were identical. |
  | **On Desert** | What you deserve changes based on how the world responds to you. | What you deserve is fixed at the moment of volition. |

  ### III. THE CRUXES (Where we test the theory)
  *We agreed on these two hypotheticals. Each side must log their prediction in advance.*

  #### Crux 1: Collaborative Moral Luck
  *Does random task assignment within a team alter individual desert?*

  **The Case:** Two engineers, **Ali** and **Ben**, have identical skill levels and work ethic. They are randomly assigned to different modules of the same product.
  *   **Ali's module** becomes viral due to a market shift (pure luck).
  *   **Ben's module** is rendered obsolete by a competitor's update (pure luck).
  *   Both worked exactly 40 hours with identical code quality.

  **The Question:** Who deserves the year-end bonus?

  | Camp | Prediction / Judgment |
  | :--- | :--- |
  | **Integrationists** | **Ali deserves more.** The value of labor is partially determined by its reception. Luck changed the moral weight of the contribution. |
  | **Separatists** | **Split it 50/50.** The bonus rewards effort and control. The market shift is external noise that should be filtered out of moral assessment. |

  #### Crux 2: Constitutive Luck vs. Choice
  *Can we ever cleanly separate who you are (constitution) from what you do (choice)?*

  **The Case:** Two caregivers, **Sam** and **Jordan**, comfort a distressed patient equally well.
  *   **Sam** is naturally empathetic (constitutive luck). It costs them zero effort.
  *   **Jordan** is naturally irritable (constitutive luck) but exerted significant willpower to appear calm.
  *   The patient cannot tell the difference.

  **The Question:** Is the moral worth of the action identical?

  | Camp | Prediction / Judgment |
  | :--- | :--- |
  | **Integrationists** | **Jordan deserves more praise.** You cannot seperate [sic] the choice from the constitution. Overcoming bad luck is part of the moral act. |
  | **Separatists** | **Equal praise.** We can isolate the volition. Both chose the right action. The internal cost is private data, not moral data. |

  ***

  **Next Steps:**
  Sign below. We run the dataset next week. If you change your mind after seeing the results, you have to write a follow-up explaining why. That's the deal.

