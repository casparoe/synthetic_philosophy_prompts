      *   Honest critique of the film's philosophy? Yes.
      *   Syllabus context? Yes.

  *(Self-Correction during drafting)*: I need to make sure I don't just say "Phil gets free will." Dennett argues free will is a gradient. Phil moves up the gradient. But the film treats it as a binary switch (Loop vs. No Loop). That's a key tension to highlight. Also, emphasize that the Homeless Man scene is the moment the film admits it's not about *control*, but *acceptance*, which complicates the "Free Will as Control" narrative.

