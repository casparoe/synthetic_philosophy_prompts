answer: |-
  This is a rich theoretical knot to untangle. You're hitting on the distinction between *sovereign power* (who holds the guns/wins the war) and *hegemonic power* (who controls the culture/memory). For a novel, this distinction is where the drama lives.

  Here is an analysis of that specific historical window (1890–1920) through the lens of power-driven historical relativism, incorporating your twist on archival silence.

  ### 1. The Paradox of the "Victor"
  **Theory Prediction:** Classical historical relativism suggests the group with the coercive power (the Union) imposes its epistemological framework. The schoolbooks should teach rebellion as treason; the archives should center the emancipationist narrative.

  **The Break:** The Union won the *state*, but the Confederacy won the *civil society*.
  Between 1890 and 1920, the "victor" fractured. The Northern industrial elite (the actual winners) prioritized economic reconciliation with the Southern planter class over racial justice for the freedmen. They traded the narrative for the market.

  *   **Narrative Control:** The United Daughters of the Confederacy (UDC) didn't just write books; they policed the *emotional economy* of the South. They made the Union narrative socially expensive to hold.
  *   **The Novelistic Angle:** The "Victor" isn't a person; it's a transaction. The North held the military monopoly, but they outsourced the memory monopoly to the South because remembering the war's *cause* (slavery) was bad for business. The relativist view holds here: Truth wasn't determined by who won the battle, but by who had the stamina to curate the aftermath. The North had the power to enforce truth but lacked the *will*. Will is a form of power.

  ### 2. Archival Silence as an Active Weapon
  Your twist is strong: treating the absence of records (specifically Freedmen's Bureau files or plantation ledgers) not as a tragedy of loss, but as a **constructive element of the myth.**

  **How it works in the Lost Cause:**
  In a relativist framework, a gap in the record is not a void; it is a canvas.
  *   **The Logic:** If the Freedmen's Bureau records are scattered, burned, or "lost" (which many were, through neglect or deliberate destruction like the 1865 Richmond fires or later bureaucratic purges), the Lost Cause narrative fills that silence with "faithful slave" tropes.
  *   **The Argument from Absence:** The Southern archivist argues: *"If there were systemic brutality, where are the papers? If there were black contributions to the war effort on the Union side, where are the rosters?"* The absence becomes proof of non-existence.
  *   **Relativist Implication:** This supports the idea that history is a contest of *curation*, not just creation. Destroying a record is as creative an act as writing one. It forces the historian to rely on oral tradition (controlled by the white elite) rather than bureaucratic data.

  **Does this weaponize gaps against the victors?**
  Yes. It shows that the Union's victory was bureaucratic, not archival. They won the right to make laws, but they failed to secure the *evidence* required to enforce the moral logic of those laws. The "silence" allowed the South to claim the moral high ground of "local knowledge" against the North's "distant bureaucracy."

  ### 3. Material Resistance vs. The Printing Press
  This is the crux of your final question: Is truth just whoever holds the press, or do records resist?

  **The Case for the Printing Press (Relativism Wins):**
  By 1920, the Lost Cause was entrenched in textbooks nationwide, not just in the South. The narrative won. The physical reality of slavery (chains, bills of sale, whipping posts) was buried under a mountain of paperbacks, statues, and speeches. In this sense, the "truth" was whatever the UDC could get past the school board. The physical records didn't matter because no one was looking at them.

  **The Case for Material Resistance (Realism Pushes Back):**
  However, the *effort* required to suppress the records proves their resistance.
  *   **The Labor of Suppression:** You cannot simply ignore physical evidence; you must actively hide it. The burning of Richmond, the "misplacing" of Bureau files, the segregation of archives—these require labor, coordination, and risk.
  *   **The Stubbornness of Paper:** Physical records have a way of surviving in interstices. A ledger hidden in a wall, a diary kept by a freedman, a federal copy filed in D.C. that a Southern historian accidentally cites.
  *   **The Novelistic Tension:** The "truth" isn't in the record itself, but in the *friction* it causes. A single bill of sale for a human being acts as a "reality anchor." It doesn't speak, but it refuses to be interpreted as anything other than a transaction of flesh. The Lost Cause had to build a massive interpretive superstructure to explain away that one piece of paper.

  ### 4. Synthesis for Your Chapter
  If you want to steal a core thesis for your characters to debate, try this:

  **"History is written by the victors, but Memory is leased by the survivors."**

  *   **The Union** had the victory (Sovereign Power).
  *   **The Confederacy** had the survival (Pastoral Power).

  The period 1890–1920 wasn't about who won the war; it was about who owned the *grief*. The South monetized grief; the North commodified reconciliation.

  **Regarding your Archival Silence twist:**
  Use it to show that **erasure is a form of authorship.**
  *   *Character Idea:* A Southern archivist who isn't burning books to hide the truth, but burning them to *create* a specific kind of mystery. He knows that a historian will always trust a gap more than a document. A document can be forged; a gap implies a secret. By destroying the Freedmen's Bureau records, he isn't hiding black agency; he is creating a vacuum where the "faithful slave" myth can breathe without suffocation from data.

  **The Verdict on Truth:**
  The case suggests that historical truth is **not** just the printing press. It is the **durability of the inconvenient fact.**
  The Lost Cause dominated for a century, but it required constant maintenance. It required new generations to be taught the lie. The physical records (the "resistance") didn't overthrow the lie themselves; they waited. They sat in boxes. The truth wasn't powerful enough to win on its own; it just outlasted the liars.

  **For your novel:**
  The tragedy isn't that the records were destroyed. It's that the records *survived*, and were simply rendered invisible by a consensus of silence. The "Victor" (North) had the keys to the archive but lost the map. The "Loser" (South) had no keys, but drew a new map that everyone agreed to follow.

  That is the ultimate relativist horror: The archive doesn't matter if the culture agrees to look the other way. The "truth" is a social contract, not a physical object.
