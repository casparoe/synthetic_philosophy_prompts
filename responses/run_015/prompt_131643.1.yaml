  CAMBRIDGE, Mass.—The Institute for Applied Veridicality announced Tuesday the successful completion of the Externality Probe, a five-year, $42 million interdisciplinary initiative conclusively demonstrating that human subjects are not brains suspended in nutrient vats.

  In the study's primary arm, subjects pressed a physical button while a laboratory server logged the input. When the log was read back to them on a screen, reported agreement between the digital record and the subjects' own memory of pressing the button stood at one hundred percent. The protocol excluded any data where subjects reported dreaming the button press. A second arm, in which a control group was told over breakfast that they were in fact envatted, produced no statistically significant change in anyone's confidence. A pre-registered replication, run by the same subjects using the same equipment, reproduced the finding. Peer reviewers were enrolled in the study to ensure stakeholder alignment, and the grant, which is renewable, required a reassuring result to qualify for renewal.

  "We have closed the loop on ontological uncertainty," said project director Dr. Silas Vane, presenting a slide deck titled *Empirical Bounds on Skeptical Scenarios*. "The data correlates perfectly with the experience of data. When we query the system about the system, the system returns a consistent status code. That is the definition of external validity. It is a robust confirmation of the non-simulated status of the laboratory. We have effectively instrumented reality."

  The team also addressed the semantic wrinkle famously raised by Hilary Putnam, noting as a selling point that if the subjects were brains in a vat, the word "vat" would not refer to actual vats, rendering the statement "we are brains in a vat" false regardless. Thus, the assertion "we are not brains in a vat" remains true in all possible worlds accessible to the speakers. Critics who argued this rendered the proof tautological were reminded that the grant mandate prioritized psychological reassurance over modal logic.

  "They are using the simulation to verify the simulation," said Dr. Mara Kline, a skeptical philosopher at Brown University and member of the team's funded red team. "The vat hypothesis stipulates that the vat can fake any test whatever. Every result you produced was always available to the vat to generate." The report dismissed Kline's objection as "a category error regarding the funding timeline," noting that her department receives no renewable grants requiring reassuring results.

  During the Q&A, a junior technician noted that while the global nature of reality remained unproven, the subjects' beliefs were perfectly reliable with respect to their own environment, ensuring that future button presses would yield consistent logs regardless of the underlying metaphysics. The team applauded this operational stability.

  The Institute confirmed that the findings hold true provided the equipment functioned as intended, the logs were not altered, and the senses reporting the data were not deceived, under normal operating conditions.
