answer: |-
  Here is a disambiguation of the thesis "if you can spray them, then they are real," broken down into the distinct philosophical commitments a character might be making when deploying it.

  ### 1. The Ontological Criterion
  *   **Statement:** Existence for unobservable entities is constituted by our ability to causally manipulate them; to be real is to be a handle for intervention.
  *   **Verdict:** Vulnerable.
  *   **Strongest Pressure:** It conflates epistemology with metaphysics. Manipulation reveals existence; it does not create it. Furthermore, it excludes unmanipulable realities (e.g., distant stars, singularities, past events) that we have good reason to believe exist.
  *   **Neve's Counter:** "You can manipulate a shadow or a vortex, R. That doesn't make them substances. Holes are shadows in the electron sea; spraying them moves the shadow, it doesn't prove the shadow is a brick."
  *   **R.'s Reliance:** To dismiss the hole question, R. must be relying on this reading. He needs manipulability to *constitute* reality to override Neve's "bookkeeping" objection.
  *   **Pessimistic Induction:** This reading offers no defense here; if the entity is defined by current manipulation, future inability to manipulate (or re-interpretation of the manipulation) voids its reality.

  ### 2. The Epistemic Warrant
  *   **Statement:** Successful intervention provides sufficient justification for believing an entity exists, independent of whether our theoretical description of it is true.
  *   **Verdict:** Substantive and defensible (closest to Hacking's actual intent).
  *   **Strongest Pressure:** The "successful falsehood" problem. One can successfully manipulate a system using a model that posits fictitious entities (e.g., caloric fluid, phlogiston) if the model is empirically adequate without being ontologically correct.
  *   **Neve's Counter:** "Warrant for belief isn't the same as truth. I can navigate by the stars using a geocentric map. The map works; the earth still moves. My devices work; the holes are still absences."
  *   **R.'s Reliance:** This does not earn the dismissal. It grants Neve the right to *believe* in holes, but it does not refute her claim that they are fictions. It answers "Why do you believe?" not "Are they real?"
  *   **Pessimistic Induction:** This is the reading best suited to resist the induction, as it decouples belief in the entity from belief in the theory.

  ### 3. The Semantic Fix
  *   **Statement:** Theoretical terms secure reference to real objects through causal interaction rather than through satisfying a set of descriptive claims.
  *   **Verdict:** Vulnerable.
  *   **Strongest Pressure:** The "no-reference" problem. If the causal chain is mediated by a false theory, the term may refer to nothing (e.g., "phlogiston" refers to nothing, even if phlogiston-theorists manipulated combustion).
  *   **Neve's Counter:** "If 'hole' refers via causal chain, what is the anchor? The electrons? Then 'hole' just refers to a configuration of electrons, not a new thing. You haven't proved the hole exists, only the electrons do."
  *   **R.'s Reliance:** Unlikely. This is too technical for a margin-scribble slogan.
  *   **Pessimistic Induction:** Suggests reference is stable across theory change, but Neve's point is that the *causal anchor* itself might be re-described (e.g., from particle to field excitation).

  ### 4. The Selective Split
  *   **Statement:** We should be realists about the entities we manipulate but agnostic about the theories describing their internal nature or laws.
  *   **Verdict:** Vulnerable.
  *   **Strongest Pressure:** The "entity-theory entanglement." You cannot characterize an entity (mass, charge, spin) without a theory. If the theory changes, the entity's identity changes.
  *   **Neve's Counter:** "You say entities stay while theories go. But if the theory changes from 'particle' to 'quasiparticle excitation,' the entity *has* gone. You can't keep the noun and delete the definition."
  *   **R.'s Reliance:** To dismiss the pessimistic induction, R. relies on this. He assumes the "electron" remains the same "thing" even if the math changes.
  *   **Hole Question:** This reading actually hurts R. regarding holes, as holes are defined entirely by band theory. If the theory is "bookkeeping," the entity is too.

  ### 5. The Pragmatic Deflation
  *   **Statement:** To call an entity "real" is merely to assert its utility in experimental contexts, making no metaphysical claim about mind-independent existence.
  *   **Verdict:** Platitude (in a lab) / False (metaphysically).
  *   **Strongest Pressure:** It changes the subject. Neve is asking about the world; R. is answering about the lab notebook.
  *   **Neve's Counter:** "I'm not asking if they are useful, R. I know they are. I'm asking if they are *there*. Don't sell me a tool when I ask for a truth."
  *   **R.'s Reliance:** This allows him to dismiss the question by declaring it meaningless, but it contradicts the word "real" in the slogan.
  *   **Pessimistic Induction:** Immune. If "real" just means "useful now," past uselessness doesn't matter.

  ### Analysis of the Quarrel

  **The Origin Story Embarrassment**
  The slogan originates from experiments (likely the Stanford free quark search or similar Millikan-style replications) involving *electrons* sprayed onto niobium spheres to detect fractional charge. Electrons are fundamental; holes are quasiparticles. Using a slogan derived from fundamental particle physics to defend the reality of emergent condensed-matter quasiparticles is a category error. It embarrasses the slogan because the "spraying" of electrons confirms the reality of the *electron*, whereas the "spraying" of holes confirms the reality of the *lattice dynamics*. R. is borrowing capital from one ontological bank to pay a debt in another.

  **Is the Quarrel Verbal?**
  Yes, partially. Neve is using "real" in a **mind-independent, fundamental ontological sense** (Reading 1). R. is using "real" in an **epistemic-pragmatic sense** (Reading 2 or 5). When R. says "they are real," he means "you can bet your grant on them." When Neve hears "they are real," she hears "they are fundamental constituents of the universe." The slogan bridges these two meanings ambiguously, allowing R. to feel he has won while Neve feels he has dodged.

  **What the Party-Goer Means**
  A person repeating this sentence at parties most likely means **The Pragmatic Deflation (Reading 5)** wrapped in the rhetoric of **The Ontological Criterion (Reading 1)**. They want the hard-nosed scientific authority of the Ontological Claim without the metaphysical baggage. It is a shibboleth for "I am a practical scientist, not a dreamer."

