answer: |-
  1. The setup

  In Nyāya philosophy, the whole game is about figuring out valid sources of knowledge, which they call *pramāṇas*. They usually list four main ones: perception (*pratyakṣa*), inference (*anumāna*), comparison (*upamāna*), and testimony (*śabda*). Perception is basically your direct sensory contact with the world—seeing smoke, feeling heat, hearing a sound. It's treated as the foundational bedrock because it's the most immediate link to reality. You don't need any middleman to know there's a fire in front of you; your eyes just grab the data. Without perception, the other sources wouldn't have any raw material to work with, which is why it's usually seen as the primary check on truth.

  Testimony, or *śabda*, is the verbal statement of a reliable person, and Nyāya counts it as a genuine source of knowledge in its own right, not just a fancy version of inference. However, even though they give it independent status, there's a strong intuition in the system that perception is still the boss. If testimony is the building, perception is the ground it sits on. The tension arises when you consider how much we actually rely on that building versus checking the ground. If a society shifts heavily toward trusting words over direct experience, does the structure start to wobble because it's drifting away from its foundational support?

  2. The case for

  Here's the problem: in a modern, expert-heavy society, *śabda* effectively replaces *pratyakṣa* for almost everything we claim to know. When you read a scientific paper or hear a doctor's diagnosis, you are accepting testimony. You aren't looking through the microscope, running the statistical analysis, or observing the cellular reaction yourself. You are outsourcing your perception to an expert. If Nyāya says perception is the bedrock of knowledge, but our daily epistemic diet is 99% testimony, we're living on a floor that's suspended in mid-air. We claim to know things, but that knowledge isn't anchored in our own sensory contact with reality, making the foundation feel pretty thin.

  This gets riskier when the chain of testimony gets long and opaque. In science, peer review is basically institutionalized *śabda*—it's experts vouching for other experts. The issue is that most people, including other scientists in different fields, cannot perceptually verify the claims being made. They have to trust the word. If perception is supposed to be the ultimate validator, but the system is designed so that almost no one is actually validating perceptually, the commitment to perception as foundational becomes more of a slogan than a practice. We are building a skyscraper of knowledge where nobody is checking the concrete.

  The replication crisis is the perfect example of this clash happening in real time. For years, the scientific community accepted certain psychological or medical findings based on the testimony of published researchers. Everyone treated those claims as knowledge. But when other teams tried to go back to the perceptual base—actually running the experiments again to see the results with their own eyes—the data often didn't hold up. The testimony had drifted too far from the perceptual reality it was supposed to represent. This shows that when you rely heavily on *śabda* without maintaining a strong capacity for *pratyakṣa* verification, your "knowledge" becomes fragile and prone to collapsing when the trust is tested.

  3. The case against

  A Nyāya philosopher would push back here by arguing that testimony doesn't actually float free of perception; it's just perception at a distance. For *śabda* to count as valid knowledge, the speaker must be competent and honest (*āpta*), and we only know they are reliable because someone, somewhere, perceived the truth directly. The chain of testimony always has to cash out into perception eventually. So, even if I'm just reading a textbook, the knowledge is still grounded in the perceptual experiences of the experts who wrote it. As long as that chain isn't broken, perception remains the root, and society isn't shaky just because most of us are receiving the data second-hand.

  4. Bottom line

  My verdict is that there is a real tension here, but it doesn't necessarily mean expert societies are doomed. However, it does mean they are vulnerable if they forget that testimony needs to be convertible back into perception. Expert-heavy societies are on shaky ground only if they stop valuing the ability to check the experts; as long as the chain of trust can be audited by going back to the sensory data, the foundation holds.
