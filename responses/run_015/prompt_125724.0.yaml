answer: |-
  # 1. Exam Question

  **Course:** Decisions Under Constraints (Senior Engineering Seminar)  
  **Assessment:** Final Take-Home (90 Minutes)  
  **Total Marks:** 20  

  ### Agent Specification: Searcher-R
  You are evaluating a software agent, **Searcher-R**, designed to select items from a sequential stream. The agent operates under the following rules:
  1.  **Stream:** Options arrive one at a time ($x_1, x_2, \dots$). Each has a known utility $u(x)$ upon inspection.
  2.  **Cost:** Inspecting an option costs $c > 0$.
  3.  **Aspiration:** The agent holds an aspiration level $A$. Initially $A = A_0$.
  4.  **Decision:** Upon inspecting $x_t$, if $u(x_t) \ge A$, the agent **Accepts** and stops searching. If $u(x_t) < A$, it **Rejects** and continues.
  5.  **Update (Success):** If an option is Accepted with value $V$, the new aspiration becomes $A_{new} = \max(A_{old}, \beta \cdot V)$, where $0 < \beta < 1$.
  6.  **Update (Failure):** If the agent Rejects $m$ options in a row, $A$ drops by $\delta$ (never below $A_0$).

  ### Questions

  **Part 1: Order Dependence (5 Marks)**  
  Construct a concrete numerical example (specify $A_0, \beta$, and two option values) showing that Searcher-R might Accept Option X in one presentation order but Reject (or fail to select) Option X in a different order. Explain why an agent maximizing a **fixed ranking over options** (a static preference order) cannot behave this way.

  **Part 2: The Optimization Reply (5 Marks)**  
  A colleague argues: *"This isn't a counter-example to optimization. If you add the cost of search $c$ to the objective function, Searcher-R's stopping rule is just the optimal policy for some specific cost value. Therefore, satisficing is just optimization with a bigger objective function."*  
  Evaluate this claim. Does this defense save the optimization framework, or does it render the claim "all behavior is optimization" unfalsifiable? Distinguish between optimizing over **options** versus optimizing over **policies**.

  **Part 3: Defining Rationality (10 Marks)**  
  For Searcher-R to be considered genuinely **rational** (rather than merely consistent or optimal), what conditions must hold? In your answer, address:
  1.  **Feasibility:** Who must be able to compute the optimal search cost—the agent or the observer?
  2.  **Fit:** How does the environment's structure (e.g., distribution of values) determine if the heuristic is rational?
  3.  **Standard:** Why is **procedural rationality** a distinct standard from **substantive rationality** in this context?

  ***

  # 2. Model Answer

  **Part 1: Order Dependence**  
  Let $A_0 = 50$ and $\beta = 0.9$. Consider Option X ($u=60$) and Option Y ($u=100$).
  *   **Order 1 [X, Y]:** Searcher-R inspects X. $60 \ge 50$, so it Accepts X and stops. Y is never seen.
  *   **Order 2 [Y, X]:** Searcher-R inspects Y. $100 \ge 50$, so it Accepts Y and stops. X is never seen.
  In Order 1, X is selected. In Order 2, X is passed over. An agent maximizing a fixed ranking assumes preferences are intrinsic to the options (e.g., $Y \succ X$). If $Y \succ X$, the agent should choose Y whenever both are available, regardless of order. Searcher-R's choice depends on the *state* (aspiration level) and *sequence*, violating the assumption that behavior can be represented as maximizing a static utility function over the option set alone.

  **Part 2: The Optimization Reply**  
  The colleague is partially right but philosophically dangerous. It is true that for any stopping rule, one can construct a search cost $c$ that makes that rule optimal *ex-post* (via **dynamic programming**). However, this relies on an **as-if representation**: we are modeling the agent *as if* it calculated that cost, not claiming it *did*.
  If we claim every behavior is optimal for *some* cost, the theory becomes unfalsifiable. The distinction lies in the object of optimization. A substantive optimizer maximizes over **options** (choosing the best $x$). A procedural optimizer maximizes over **policies** (choosing the best rule for selecting $x$). Searcher-R follows a fixed policy. Calling this "optimization" is only useful if the agent can actually compute the optimal policy. If the "optimal cost" is only visible to the observer, calling the agent an optimizer is a description of our model, not the agent's mechanism.

  **Part 3: Defining Rationality**  
  For Searcher-R to be rational, three conditions must align:
  1.  **Feasibility (First-Person):** The computation required to find the "optimal search cost" must be tractable for Searcher-R, not just for us observing it. If calculating the optimal $c$ requires more resources than the search itself, the agent is not rationally required to do it. Rationality is bounded by the agent's compute.
  2.  **Fit (Ecological Rationality):** The heuristic must match the environment. If option values are uniformly distributed, a fixed aspiration may fail. If they follow a heavy-tailed distribution, the ratcheting mechanism might capture high variance effectively. Rationality is not a property of the mind alone, but a relation between the mind's procedure and the environment's structure.
  3.  **Standard (Procedural vs. Substantive):** **Substantive rationality** judges the outcome (did it get the max utility?). **Procedural rationality** judges the process (did it use a reasonable method given its limits?). Searcher-R is procedurally rational if its heuristic is robust and low-cost, even if it occasionally misses the global maximum. Invoking a substantive standard (global optimization) criticizes the agent for failing a test it could not possibly pass given its information constraints. True rationality acknowledges the cost of thinking.

  ***

  # 3. Marking Scheme

  **Total:** 20 Marks  
  **Glossary of Terms for Markers:**
  *   **As-if representation:** Modeling an agent as if it solves a complex problem, without claiming it actually performs the calculation.
  *   **Reservation price:** The minimum value an agent will accept (analogous to aspiration level).
  *   **Dynamic programming:** A method for solving complex problems by breaking them down into simpler subproblems (often used to find optimal stopping rules).
  *   **Ecological rationality:** The degree to which a decision mechanism is adapted to the structure of the environment in which it is used.
  *   **Procedural versus substantive rationality:** Substantive focuses on the optimality of the *outcome*; Procedural focuses on the reasonableness of the *process* given cognitive limits.

  ### Criterion 1: Order Dependence vs. Fixed Ranking (4 Marks)
  *   **4:** Correctly constructs a sequence where state/aspiration changes the choice on the *same* option (or selection of X vs Y based on order). Explicitly states that fixed rankings require context-independent preferences.
  *   **2:** Shows order matters but fails to explain why this violates fixed ranking (e.g., doesn't mention preference consistency).
  *   **0:** Numerical example is logically inconsistent with Searcher-R rules.
  *   **Engineer Failure:** Assuming "the agent just prefers the first one" without recognizing this violates transitivity in a static model.

  ### Criterion 2: Policy vs. Option Ranking (4 Marks)
  *   **4:** Distinguishes between maximizing over the set of options (substantive) vs. maximizing over the rule/policy (procedural).
  *   **2:** Acknowledges search costs but conflates the rule with the outcome.
  *   **0:** Claims search costs make the distinction irrelevant.
  *   **Engineer Failure:** Reaching for "the aspiration level adapts, therefore it's still optimizing" without specifying *what* is being optimized.

  ### Criterion 3: Unfalsifiability (4 Marks)
  *   **4:** Identifies that post-hoc search costs make optimization a tautology (unfalsifiable). Notes that *as-if* modeling is descriptive, not explanatory.
  *   **2:** Accepts the colleague's view that "everything is optimization" without critique.
  *   **0:** Fails to address the triviality worry.
  *   **Engineer Failure:** Treating the existence of a cost function as proof the agent uses it.

  ### Criterion 4: First-Person vs. Third-Person Computation (4 Marks)
  *   **4:** Argues that for the agent to be rational, *it* must be able to compute the optimal policy, not just the observer. Highlights computational limits.
  *   **2:** Discusses optimality but ignores who is doing the computing.
  *   **0:** Assumes the agent has access to the global optimum.
  *   **Engineer Failure:** Designing systems that assume the agent can solve the DP required to justify the heuristic.

  ### Criterion 5: Rationality as Relation (Ecological) (4 Marks)
  *   **4:** Defines rationality as a fit between procedure and environment (ecological), not just internal consistency. Distinguishes procedural from substantive standards.
  *   **2:** Defines rationality only as internal logic or only as outcome quality.
  *   **0:** Vague appeal to "being reasonable."
  *   **Engineer Failure:** Judging a heuristic solely by its worst-case error rate rather than its average performance in the target domain.

  ### Band Notes
  *   **A (17-20):** Nuanced distinction between the observer's model and the agent's mechanism. Clearly articulates why "optimization" becomes empty if costs are unconstrained.
  *   **B (13-16):** Correctly identifies order dependence and search costs but leans slightly on the "it's all optimization" defense without fully dismantling it.
  *   **C (9-12):** Treats Searcher-R as a broken optimizer. Misses the philosophical pivot on feasibility and unfalsifiability.
