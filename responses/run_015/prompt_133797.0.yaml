answer: |-
  The disagreement between you and your friend hinges on a distinction between behavioral continuity and normative justification. Your friend is correct that the daily mechanics of science—running experiments, checking equations, publishing papers—would likely proceed without disruption under a Rortyan framework. Scientists would still seek predictive accuracy, and funding bodies would still prioritize programs that yield tangible results. However, your intuition is correct that removing representational success from the normative framework fundamentally alters the *discursive discipline* of science, specifically regarding how institutions justify choices between incommensurable frameworks. The shift is not in what scientists *do*, but in what they are permitted to *claim* they are doing, and this has profound consequences for institutional accountability and the management of theoretical dead ends.

  The primary implication of Rorty’s antirepresentationalism for institutional practice is the dissolution of the "neutral court of appeal." In your example of quantum gravity, where general relativity and quantum field theory are empirically robust but formally incommensurable, a realist framework treats this tension as an ontological crisis. The institutional norm dictates that we must fund the program most likely to reveal the underlying unity of nature. Failure to unify is treated as a failure to grasp reality. Under neopragmatism, this tension is reclassified as a practical inconvenience rather than a metaphysical scandal. Institutional evaluation shifts from asking "Which theory mirrors the structure of the universe?" to "Which vocabulary allows us to coordinate the most diverse range of phenomena with the least friction?" This changes the criteria for grant panels. A research program that offers high conceptual coherence and mathematical elegance, even without immediate empirical unification, might be funded not because it is "truer," but because it offers a more fertile language for future problem-solving. Conversely, a program that predicts well but generates conceptual dead-ends for interdisciplinary work might be deprioritized not for being "false," but for being socially or heuristically isolating.

  Furthermore, the treatment of translation failures changes from a metaphysical dead end to a practical obstacle. In a realist regime, the inability to translate terms between general relativity and quantum mechanics suggests that one or both theories are failing to latch onto the world's actual joints. This justifies abandoning one lineage in favor of the other. In a Rortyan regime, the lack of shared language is expected; vocabularies are tools, not maps. The institutional response to incommensurability becomes the creation of "pidgin" languages for specific tasks rather than the search for a universal theory of everything. Interdisciplinary committees would stop viewing translation failures as evidence of error and start viewing them as signals to build new bridges for specific purposes. The normative pressure to find a "Theory of Everything" dissipates, replaced by a pressure to find "tools for everything." This relieves the immense institutional pressure on domains like string theory to prove they are the "final truth," allowing them to be evaluated instead on their capacity to generate new mathematical techniques useful in condensed matter physics or cryptography, regardless of their ontological status.

  Finally, institutional discourse must abandon the pretense of "getting nature right." This is where your argument holds the most weight against your friend's. If grant panels and review boards stop invoking "approximation to reality" as the ultimate justification, they must adopt a new vocabulary of solidarity and utility. When a funding agency rejects a proposal, the justification cannot be "this does not match the data" in the sense of mirroring nature; it must be "this does not help us cope with nature as effectively as the alternative." This seems subtle, but it changes the nature of scientific dissent. A realist dissent claims the opponent is *wrong about the world*. A pragmatist dissent claims the opponent is *less useful for our purposes*. This lowers the stakes of theoretical conflict, potentially reducing the dogmatism that arises when scientists feel they are defending the "One True Story" against heresy. However, it introduces a new vulnerability: without the anchor of "reality," funding decisions risk appearing arbitrary or purely political. The institution must then justify its choices based on explicit social goals (e.g., energy production, technological manipulation) rather than the implicit goal of "discovery."

  In conclusion, your friend is right that the engine of science runs on predictive success regardless of the philosophical fuel. But you are right that the steering mechanism—the normative justification for where that engine is directed—relies heavily on the myth of representation. Removing that myth forces institutions to be explicit about their values. It transforms the evaluation of incommensurable theories from a search for the correct map into a negotiation over which tool kit best serves the community's evolving needs. The practice remains, but the authority structure shifts from the "voice of nature" to the "consensus of the inquirers."

