      *   4 pages approx? (The output needs to be dense enough to simulate this).
      *   Month-by-month? Yes.
      *   Concrete construction details? Yes (SVG, rule templates).
      *   Deliverables? Yes (Github repo, paper).
      *   Failure modes? Yes.

  10. **Final Polish:** Check the logic flow. Ensure the "Bilateral vs. Catch-all" distinction is integrated properly as a test case for the broader DCP framework. (Self-Correction: Make sure the "Catch-all" hypothesis doesn't overshadow the main DCP argument. It should be a sub-hypothesis).

  *(Self-Correction during drafting)*: The user mentioned "modest GPU budget." I should emphasize using API for heavy lifting if needed, or small open models locally. I'll suggest a mix: local evaluation for volume, API for SOTA comparison.
  *(Self-Correction on "Catch-all")*: The user thinks Catch-all might be solvable by one-class modeling. I need to make sure the proposal tests if models *actually* use that strategy or if they struggle because they expect contrast.

