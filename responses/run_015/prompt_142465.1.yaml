          *   Probes (The three tests).
          *   Timeline (Month-by-Month).
      *   **Deliverables:** Concrete tools for the community.
      *   **Failure Modes:** What if it doesn't work?
      *   **Scope Cuts:** What was removed to make this feasible.

  5.  **Fleshing out the Methodology (Technical Details):**
      *   *Synthetic Data:* Need to generate BPs programmatically (Python + SVG/Matplotlib). This allows ground truth knowledge of the rule generation process.
      *   *Controlling Confounds:*
          *   *Verbalization:* Don't just ask "What is the rule?" Ask "Draw an example."
          *   *Discrimination:* Standard BP solving.
          *   *Priors:* Introduce "Grue-like" distractors in the generation process.
      *   *Models:* LLaVA, BakLLaVA, GPT-4V (via API if budget allows, otherwise open weights like LLaVA-NeXT).
      *   *Timeline:*
          *   Months 1-3: Data Gen.
          *   Months 4-6: Evaluation Pipeline.
          *   Months 7-9: Analysis & Ablation.
