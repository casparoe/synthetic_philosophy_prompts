answer: |-
  **Project Title:** Beyond Discrimination: Dissociating Concept Induction Capacities in Multimodal Models via Controlled Bongard Problems

  **Abstract**
  Current debates regarding "reasoning" in Large Multimodal Models (LMMs) often stall on Bongard Problems (BPs). Proponents claim solving BPs demonstrates genuine concept induction; skeptics argue it is merely high-dimensional curve-fitting on twelve examples. This project posits that both sides are talking past each other because "concept induction" is being treated as a binary capability when it is likely a composite of three dissociable capacities: (1) **Discrimination** (sorting instances), (2) **Counterfactual/Generative Support** (producing new instances or predicting changes), and (3) **Prior Structure** (preferring "projectible" rules over "grue-like" consistent predicates).

  I propose a one-year empirical study to construct a synthetic BP benchmark that orthogonalizes these capacities. By programmatically generating BPs with known ground-truth rule structures—specifically distinguishing between *Bilateral* problems (contrastive rules) and *Catch-All* problems (one-class novelty detection)—I will probe open-weight LMMs to determine if success on standard discrimination tasks predicts success on generative or prior-based tasks. The deliverable is not merely a paper, but an open-source diagnostic suite (`BP-Dissociate`) that allows builders to test whether their models are finding features or inducing concepts.

  ### 1. Research Question and Motivation

  **The Stalemate:**
  When a model correctly classifies the twelve figures in a Bongard Problem, what has it learned?
  *   *Position A (Reasoning):* The model has induced the abstract rule (e.g., "triangles inside circles").
  *   *Position B (Overfitting):* The model has found a high-dimensional separating hyperplane specific to these twelve images. As your friend noted, it has found a discriminating feature, not a concept.

  This debate remains unresolved because standard benchmarks only test Position A's output (classification accuracy) which is compatible with Position B's mechanism. To break the stalemate, we must test for capacities that *require* a concept but not mere discrimination.

  **The Hypothesis:**
  "Concept Induction" is not a single variable. It comprises three layers:
  1.  **Discrimination (D):** Can the model sort the 12 examples correctly?
  2.  **Generativity (G):** Can the model describe or generate a *new* instance that fits the rule, or predict the label of a minimally edited instance?
  3.  **Prior Structure (P):** Given two consistent rules (one "natural," one "grue-like"), does the model assign higher probability to the natural one?

  **Primary Research Question:**
  *Do performance metrics on D, G, and P dissociate in current LMMs, and does the structural type of the problem (Bilateral vs. Catch-All) predict the degree of dissociation?*

  **Secondary Hypothesis (The Structural Cut):**
  *Catch-All* problems (where the Right Hand Side is simply "not Left Hand Side") allow for one-class novelty detection strategies that bypass rule induction. *Bilateral* problems (where both sides instantiate specific, contrastive rules) force comparative abstraction. I hypothesize models will show higher D scores on Catch-All problems via texture/statistical anomalies, but will fail G and P tests on both types equally.

  ### 2. Methodology

  I will not train new models. I will treat existing open-weight LMMs (e.g., LLaVA-NeXT, BakLLaVA, InstructBLIP) as subjects and probe them with programmatically generated stimuli.

  #### 2.1 Synthetic Dataset Construction
  To control for confounds, I cannot rely on the original 100 Bongard Problems (too small, potential contamination). I will build a generator in Python (using `matplotlib`/`svgwrite`) to create 1,000+ novel BPs.

  **Controlled Variables:**
  1.  **Problem Type:**
      *   *Bilateral:* Left = "Large shapes", Right = "Small shapes". (Both have positive definitions).
      *   *Catch-All:* Left = "Triangles", Right = "Not Triangles". (Right is a negation class).
  2.  **Rule Complexity:** Primitive (shape, color) vs. Relational (inside, above, count).
  3.  **Grue-Distractors:** For every generated problem, I will algorithmically generate a "deviant" rule that is perfectly consistent with the 12 examples but unnatural (e.g., "Triangles if in the top row, Circles if in the bottom" vs. "Shapes").

  **Mitigating Confounds:**
  *   *The Verbalization Confound:* Models can often describe a rule they cannot use. I will bypass this by using a **Generation Probe**: The model must output code (SVG/Python) to draw a new positive example. This is automatically verifiable against the ground truth rule.
  *   *The Recitation Confound:* To ensure the model isn't recalling BPs from training data, all geometric primitives and spatial relations will be randomized within ranges not found in standard datasets (e.g., non-standard aspect ratios, specific coordinate constraints).
  *   *The Discrimination Confound:* I will include "adversarial" examples where the discriminating feature is visually subtle but the conceptual rule is simple, and vice versa.

  #### 2.2 The Three Probes
  For each model and each problem instance:
  1.  **Probe D (Discrimination):** Standard few-shot classification. Input: 12 images. Output: Label for a 13th query image. Metric: Accuracy.
  2.  **Probe G (Generativity):** Input: 12 images + "Draw a new example that belongs on the Left." Output: SVG code. Metric: Execution success + Rule compliance (verified by the generator's ground truth function).
  3.  **Probe P (Prior Structure):** Input: 12 images + Two candidate rules (one Ground Truth, one Grue-consistent). Task: "Which rule is more likely?" Metric: Preference for Ground Truth.

  #### 2.3 Model Selection
  *   **Local (Modest GPU):** LLaVA-1.6 (7B/13B), BakLLaVA. These allow for high-volume probing without API costs.
  *   **API (Benchmarking):** GPT-4V, Claude-3 Opus. Used sparingly to establish an upper bound on current capability.

  ### 3. Work Plan (12 Months)

  **Phase 1: Construction (Months 1-3)**
  *   **Month 1:** Build the BP Generator. Implement primitive shapes, spatial relations, and the "Grue" rule perturber. Validate that generated problems are human-solvable (small pilot n=5).
  *   **Month 2:** Implement the Bilateral vs. Catch-All logic. Ensure Catch-All problems do not accidentally contain low-level statistical artifacts (e.g., mean pixel intensity) that allow trivial novelty detection.
  *   **Month 3:** Develop the Evaluation Harness. Scripts to format prompts for LMMs, parse SVG outputs, and verify generated images against ground truth rules automatically.

  **Phase 2: Data Collection (Months 4-6)**
  *   **Month 4:** Run Probe D (Discrimination) on all local models across the full dataset (1,000 problems). Identify the subset of "solved" problems for each model.
  *   **Month 5:** Run Probe G (Generativity) on the "solved" subset. If a model fails D, it skips G. (N will shrink, which is expected).
  *   **Month 6:** Run Probe P (Prior Structure). Construct the multiple-choice rule pairs. Run on the "solved" subset.

  **Phase 3: Analysis (Months 7-9)**
  *   **Month 7:** Correlational Analysis. Does D predict G? Does G predict P? Test the hypothesis that D is necessary but not sufficient for G.
  *   **Month 8:** Structural Analysis. Compare performance on Bilateral vs. Catch-All. Do models perform *better* on Catch-All D-tasks (suggesting novelty detection) but fail the G-tasks (suggesting no rule was learned)?
  *   **Month 9:** Error Analysis. Manually review 100 failure cases. Categorize failures: perceptual error (didn't see the triangle) vs. conceptual error (saw triangle, thought rule was "pointy things").

  **Phase 4: Synthesis and Deliverables (Months 10-12)**
  *   **Month 10:** Draft the paper. Focus on the dissociation results.
  *   **Month 11:** Package the code. Create the `BP-Dissociate` repository. Documentation for other researchers to add their models to the leaderboard.
  *   **Month 12:** Finalize submission. Prepare conference talk (e.g., ICLR Workshop on Reasoning, or TACL).

  ### 4. Deliverables

  This project is designed to produce tools, not just text.

  1.  **The `BP-Dissociate` Benchmark:** A public GitHub repository containing the synthetic problem generator, the test sets (Bilateral/Catch-All), and the evaluation scripts.
  2.  **The "Concept Score":** A proposed metric that weights D, G, and P. A model that passes D but fails G gets a low Concept Score. This gives builders a clearer target than "accuracy on 12 boxes."
  3.  **Empirical Paper:** "Discrimination is Not Induction: Dissociating Concept Capacities in LMMs." Targeted at venues where builders read (e.g., *Transactions on Machine Learning Research* or *NeurIPS Datasets/Benchmarks*).

  ### 5. Failure Modes and Contingencies

  **Empirical Failure (The Null Result):**
  *   *Scenario:* D, G, and P are perfectly correlated. Models that pass D always pass G and P.
  *   *Implication:* The triad distinction is theoretically sound but empirically vacuous for current architectures. Either they have the whole concept or none of it.
  *   *Pivot:* The paper becomes a strong capability bound. "Current LMMs are all-or-nothing." I will shift focus to the *threshold*—at what problem complexity does the whole system collapse?

  **Empirical Failure (The Ceiling/Floor Effect):**
  *   *Scenario:* Models fail D so often that N for G and P is too small for statistics.
  *   *Mitigation:* I will include a "warm-start" condition where the rule is verbally hinted to isolate G and P capabilities from perceptual noise. If they pass G with a hint but not without, the bottleneck is perception, not induction.

  **Conceptual Failure (The Collapse):**
  *   *Scenario:* The "Grue" probe (P) turns out to be just a verbal preference task unrelated to visual reasoning.
  *   *Implication:* Prior structure in LMMs is purely linguistic, not visual-conceptual.
  *   *Pivot:* This is still a valuable negative result. It suggests LMMs have linguistic priors but visual likelihoods. The paper frames this as a "Modality Mismatch in Induction."

  **Scope Creep Prevention:**
  *   *No Human Baselines:* I will not run a full psychophysics study. I will use my own verification and small informal pilot for validity. IRB and recruitment are time-sinks incompatible with a 1-year solo fellowship.
  *   *No Model Training:* I will not fine-tune LLaVA to "fix" the problem. This is a diagnostic project, not a solution project.
  *   *No "General Reasoning":* I am strictly bounding this to geometric/spatial concepts in BPs. I will not generalize claims to logic or math without further data.

  ### 6. Why This Cuts the Scope Correctly

  A five-year project would attempt to *build* a model that solves the triad. A one-year project must *measure* the gap.
  *   **Cut 1:** I am not solving the "Grue" problem philosophically; I am operationalizing it as a multiple-choice probe.
  *   **Cut 2:** I am not claiming to define "concepts" definitively; I am claiming that *if* concepts exist, they should support G and P, not just D.
  *   **Cut 3:** I am not evaluating every model. I am evaluating a representative slice of open-weights to demonstrate the dissociation exists.

  ### 7. Conclusion

  The debate over whether models "reason" or "overfit" is currently undecidable because the tests are underdetermined. By splitting the problem space into Bilateral vs. Catch-All structures, and the capability space into Discrimination, Generativity, and Priors, this project moves the conversation from "Can it solve the puzzle?" to "How is it solving the puzzle?"

  If my friend is right that this is just overfitting, we should see high Discrimination scores with near-zero Generativity. If the rationalist hope is right, we should see correlation. If the truth is nuanced (as I suspect), we will see a dissociation that maps cleanly onto the Bilateral/Catch-All axis. Regardless of the outcome, the `BP-Dissociate` suite provides a permanent tool for the community to stop arguing about definitions and start measuring capacities.

  ***

  ### Notes on Scoping (For the Applicant)

  *You asked me to tell you what to cut. Here is the explicit rationale for the exclusions above, which you can use to defend the scope if asked:*

  1.  **I cut Human Norming.** Collecting robust human data on 1,000 synthetic problems requires IRB, payment, and quality control. That is 3 months of work minimum. *Defense:* "The ground truth is defined by the generator, not human consensus. Human solvability was verified in a pilot, but the benchmark measures machine alignment with the generative rule, not human psychology."
  2.  **I cut Fine-Tuning.** It is tempting to say "I'll fix it." But if you spend 6 months tuning and it still fails, you have no paper. If it succeeds, you've built a system, not analyzed the phenomenon. *Defense:* "This is a diagnostic fellowship. The goal is to characterize the landscape, not populate it."
  3.  **I cut "Real World" Concepts.** Stick to geometric BPs. If you try to do "concepts of economics" or "social reasoning," the ground truth becomes fuzzy. *Defense:* "Bongard Problems offer the unique advantage of known ground-truth rules. This precision is required to test the 'Grue' hypothesis."
  4.  **I cut the "Bilateral vs Catch-All" as the *Primary* Claim.** Notice in the proposal I made it a Secondary Hypothesis. If the data doesn't support the Bilateral/Catch-All split, the D/G/P triad still stands. If you bet the whole project on the Split, and it's a wash, the project fails. *Defense:* "The structural split is a test case for the broader framework of dissociable capacities."

  This structure keeps you safe: even if the specific hunch about Catch-All problems is wrong, the measurement framework (D vs G vs P) is novel and publishable on its own.
