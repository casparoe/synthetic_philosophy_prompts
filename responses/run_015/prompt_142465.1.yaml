  2.  **Deconstruct the Core Argument & Refine the Hypothesis:**
      *   *The Split:* Catch-all (One-Class) vs. Bilateral (Contrastive). This is a strong axis. It maps to novelty detection vs. discriminative learning.
      *   *The "Concept" Triad:*
          1.  *Discrimination:* Can you sort the 12 boxes correctly?
          2.  *Projection/Generation:* Can you draw a new instance? Can you say what happens if I change X?
          3.  *Prior Structure:* Do you know *why* this rule is better than the infinite other consistent rules? (Goodman's Grue).
      *   *The Gap:* Most benchmarks test (1). Some test (2) via verbalization. Almost none test (3) or distinguish them cleanly.
      *   *Refinement:* The "Bilateral vs. Catch-all" distinction is good, but might be secondary to the "Discrimination vs. Generation vs. Prior" distinction. I should frame the BP types as *tools* to test the Triad, rather than the primary hypothesis itself. The primary hypothesis is about the dissociation of the three capacities.

  3.  **Scope Management (Crucial for a 1-Year Proposal):**
      *   *Risk:* Trying to solve concept learning.
      *   *Correction:* Trying to *measure* the dissociation of concept learning capacities in existing models.
      *   *Cut:* Don't try to build a better model. Don't try to solve all BPs. Don't do a full cognitive science study with humans (use existing norms or simple proxies). Focus on LMMs (Large Multimodal Models) and Vision-Language Models.
