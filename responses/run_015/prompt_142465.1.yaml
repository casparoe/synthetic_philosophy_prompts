      *   **Hypothesis:** "Inducing a concept" means three things: (1) Finding a discriminating feature, (2) Supporting counterfactual/generative use, (3) Representing the space of alternative rules (simplicity structure/priors). Current models likely do (1), maybe (2), but fail at (3).
      *   **Constraints:** One-year fellowship proposal. ~4 pages (in spirit, though output length here needs to be substantial but concise). Modest GPU budget (no training from scratch, use open models + synthetic data). Concrete monthly plan. Deliverables for builders (not just philosophy). Honest failure modes. Scoping advice (cut the 5-year scope down to 1 year).
