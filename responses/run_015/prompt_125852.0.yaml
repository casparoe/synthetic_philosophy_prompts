          *   *Conclusion on (4):* It doesn't solve the zombie problem; it tries to dissolve the *individual* zombie, but the *global* zombie question remains. If the One Consciousness is contingent on the brains, (1) is weakened. If the Brains are contingent on the One Consciousness, (2) is weakened.

      *   **Schrödinger Reading:**
