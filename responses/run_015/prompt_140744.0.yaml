  Standard debates ask whether absences can be causes. This chapter asks a prior question: given that we attribute causation to omissions, what fixes the temporal bounds of the omission itself? When an agent fails to water plants, causing their death, did the omission occur at the moment watering became impossible, throughout the absence, or only at the moment of death? Actions possess intrinsic temporal extents defined by the event's occurrence. Omissions, lacking positive occurrence, appear to lack such intrinsic bounds. The central question is whether the temporal identity of an omission is fixed by worldly facts alone or by the practical and normative context in which the causal claim is made. Consider a week-long absence: if the plants are watered on day six, was there an omission on day one? If the temporal bounds are intrinsic, the answer should be stable. If they are extrinsic, the answer depends on the question being asked. The chapter seeks a determinate answer: do omissions have mind-independent temporal locations, or is their individuation essentially context-sensitive? Resolving this determines whether objections regarding causal efficacy are metaphysical complaints about missing mechanisms or pragmatic complaints about missing temporal anchors. The hypothesis is that omissions lack intrinsic temporal bounds, making their causal identity dependent on external normative framing. This implies that the causal relation itself, in omission cases, is not a pure binary relation between events but a ternary relation involving the context of inquiry. The question is not whether omissions cause, but how omissions are individuated enough to enter causal relations. Without a fixed time, an omission cannot bear the properties required by standard causal theories. This project argues that the lack of temporal location is the root of the philosophical discomfort surrounding omission causation. By treating the temporal bound as the primary variable, the chapter moves beyond the binary of acceptance or denial. It proposes that the indeterminacy is real and significant.

