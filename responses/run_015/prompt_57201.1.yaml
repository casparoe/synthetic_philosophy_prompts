prompt: |-
  A friend of mine is drafting an op-ed for a Scottish broadsheet, timed to the recurring speculation about a second independence referendum, and the spine of his argument is an analogy he says he absorbed from a decade of commentary: a state is a marriage, and independence is a divorce. His version runs like this. No-fault divorce exists precisely because we came to think it wrong to hold two people in a union one of them has left; the marriage may be perfectly valid and the vows sincerely made, and yet the fact that one party no longer wants to be in it is reason enough to dissolve it. So, he argues, if a majority in Scotland votes to leave, Westminster's insistence on the legality of the Union and on undertakings made in 1707 has the same shape as a husband's insistence that his wife is bound by vows she no longer endorses: technically correct, morally bankrupt. He draws a second conclusion from it, that the rump state has no standing to set conditions and only a duty to negotiate the terms of separation, because a court granting a decree does not get to decide whether the marriage should have existed in the first place. The unionist side, he notes, runs the same analogy backwards: divorce means dividing the home and the debts, the children's interests are paramount and they did not choose this, and nobody walks away with the whole house. He wants to keep the analogy because his editor thinks it is the most vivid thing in the draft, and he has asked me whether it can bear the weight he is putting on it. My instinct is that it cannot, but I cannot say precisely where it fails or how much of the argument fails with it.

  So please audit it. First, give me the mapping explicitly — a table of correspondences is fine — filling in the slots the draft leaves vague: who are the two spouses (the peoples, the parliaments, the states as corporate persons?), what plays the part of the vows and of the matrimonial home, what corresponds to the children, to the pre-nuptial agreement, to the no-fault regime, to the court that issues the decree, and what, if anything, corresponds to the fact that a marriage is entered voluntarily while citizenship is acquired by birth and by territory. Second, separate the disanalogies that actually bear on his conclusion from the merely decorative ones. I can already see that a divorce is private between its parties while secession redraws the jurisdiction other people live under, that a divorce does not move a boundary that third parties stand on, that a departing spouse takes a share fixed by contribution and need rather than the geography she happens to be standing on, and that only one side of a secession can invoke exit while either spouse can file. Tell me which of these is load-bearing and which he is entitled to shrug off, and why. Third, say what the analogy quietly imports that the target lacks — in particular whether it smuggles in an answer to the boundary problem, since a divorce presupposes that the parties are already fixed and identifiable whereas the contested question in Scotland, Catalonia and Quebec is exactly who constitutes the unit entitled to decide (and hence whether the vote belongs to Scotland alone or to the whole United Kingdom), and whether it also smuggles in an agreed exit procedure and a tribunal above both parties that in most of these cases simply do not exist.

  Then assess whether the conclusions survive. Does the no-fault line show that a majority vote confers a right to leave, or only that it confers a right to be taken seriously in negotiation — a far weaker claim, and roughly what the Supreme Court of Canada's 1998 secession reference arrived at, namely no unilateral right to secede but an obligation on the rest of the country to negotiate following a clear majority on a clear question? Does the unionist counter-use fare any better, or does it too depend on features of marriage that do not carry over, such as a pre-existing body of rules for splitting assets and a judge with authority over both parties? Finally, tell me whether there is a better analogy in this neighbourhood — a co-owned building whose owners cannot take a wing with them, a club membership, a tenant breaking a shared lease, a corporate spin-off, a redrawing of municipal boundaries — and rank the two or three candidates by how much of the real structure they preserve, saying for the best of them which feature of secession it still cannot reproduce and the analyst has to supply by argument. Two constraints on your reply: please do not send me citations, cases, or a reading list, since I am working without access to sources and want only your own reasoning; and please do not be diplomatic for its own sake. If the analogy turns out to be doing nothing but supplying vividness, say so, and if one of its imports is in fact a genuine insight that both sides in these debates have been ignoring, say that too.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Task:** Audit a specific analogy (State = Marriage, Independence = Divorce) used in an op-ed about Scottish independence.
      *   **Constraints:** No citations/cases/reading lists. No empty diplomacy (be direct/critical).
      *   **Structure:**
          1.  Explicit Mapping (Table of correspondences).
          2.  Disanalogies (Load-bearing vs. Decorative).
          3.  Quiet Imports (What the analogy smuggles in, specifically boundary problems and exit procedures).
          4.  Assessment of Conclusions (Does the no-fault line hold? Does the unionist counter-use hold?).
          5.  Better Analogies (Propose alternatives, rank them, identify remaining gaps).

  2.  **Deconstruct the Analogy (Mental Draft):**
      *   *Pro-Independence Use:* Marriage = Union. Vows = Act of Union 1707. No-fault divorce = Right to self-determination/majority vote. Husband insisting on vows = Westminster insisting on legality. Court = International law/UN? (Weak link).
      *   *Unionist Use:* Divorce = Asset split. Children = Citizens/Public Services. House = UK Infrastructure/Debt.
      *   *Core Tension:* Marriage is consensual and private. Statehood is territorial and coercive (monopoly on violence/tax). Divorce ends a contract; Secession changes jurisdiction over territory and people who didn't vote for it.

  3.  **Step 1: Explicit Mapping:**
      *   Need to fill the vague slots.
      *   *Spouses:* Scotland vs. Rest of UK (rUK)? Or Scottish People vs. British People?
      *   *Vows:* Act of Union 1707 / Claim of Right?
      *   *Home:* The Island of Great Britain / The UK State Apparatus.
      *   *Children:* Future generations? Public services? Or the "Unionist" citizens in Scotland who voted No?
      *   *Pre-nup:* Acts of Union (again) or Treaty of Union.
      *   *No-fault regime:* Democratic principle of self-determination.
      *   *Court:* International Community? Supreme Court? (This is a weak point).
      *   *Voluntary vs. Birth:* Citizenship is often *jus soli* (birthright), marriage is *jus contractus* (contract). This is a major friction point.

  4.  **Step 2: Disanalogies (Load-bearing vs. Decorative):**
      *   *Decorative:* Emotional resonance, "vows" sounding old-fashioned. The idea of "falling out of love."
      *   *Load-bearing:*
          *   *Territory:* In divorce, I take my clothes and half the equity. In secession, I take the land I stand on. This is crucial.
          *   *Third Parties:* Divorce affects kids, but doesn't change the neighbor's property line. Secession changes the border for England too.
          *   *Coercion:* You can leave a marriage and live separately. You can't really "opt out" of a state's laws while staying in the territory without becoming a subject of the new state.
          *   *The "Court":* Divorce has a state-enforced legal framework. Secession often lacks a neutral arbiter (who decides the rules of the divorce?).

  5.  **Step 3: Quiet Imports (Smuggled Assumptions):**
      *   *Boundary Problem:* The analogy assumes "Scotland" is the spouse. But is it? The analogy presupposes the unit that gets to decide is the sub-state nation, not the whole state. It begs the question of *who* constitutes the "people."
      *   *Exit Procedure:* Divorce implies a known legal path (file papers, wait, decree). Secession often has no constitutional path (unlike Article 50 in EU, but UK has no written constitution). It assumes a tribunal exists to grant the decree.
      *   *Equality:* Spouses are legally equal. Scotland and Westminster are not constitutionally equal (Parliamentary Sovereignty).

  6.  **Step 4: Assess Conclusions:**
      *   *No-Fault Line:* Does a vote = right to leave? No. It creates a *claim* to negotiate. The analogy fails because in marriage, the court *must* grant divorce eventually. In states, the rump state can say "No" indefinitely (see: US Civil War, Spain/Catalonia). The "no-fault" import is wishful thinking.
      *   *Unionist Counter:* "Children/Assets." This is stronger on asset division (debt, nuclear subs), but weaker on the "right to stay together." However, the "children" analogy (citizens) is tricky because the "children" are the voters themselves.
      *   *Verdict:* The analogy creates false symmetry. It makes secession look like a private contract termination, when it's a constitutional rupture.

  7.  **Step 5: Better Analogies:**
      *   *Condo Association / Co-op:* Owners share a building. One wants to take a floor and make it a separate building. Requires agreement of all owners. Good for asset/structure issues.
      *   *Corporate Spin-off / Demerger:* Shareholders vote. Assets split. Liabilities allocated. Good for economic continuity.
      *   *Tenant Breaking Lease:* One tenant wants out, others stay. Landlord (Constitution/International Law) has say.
      *   *Ranking:*
          1.  *Corporate Demerger:* Best for economic/legal continuity. Fails on *territory* (companies don't own land in the same way states do).
          2.  *Condo/HOA:* Best for shared infrastructure/neighbors. Fails on *sovereignty* (HOA isn't a sovereign power).
          3.  *Marriage:* Worst. Too emotional, ignores territory and third parties.

  8.  **Drafting the Response (incorporating constraints):**
      *   *Tone:* Analytical, direct, critical. No hedging.
      *   *Formatting:* Use the requested structure (Mapping, Disanalogies, Imports, Assessment, Alternatives).
      *   *Content Check:* Ensure I address the "boundary problem" and the "tribunal" issue specifically. Ensure I don't cite the *Secession Reference* but discuss its logic as requested.

      *(Self-Correction during drafting)*: I need to make sure I don't just say "it's bad." I need to explain *where* it works (vividness) and *where* it breaks (logic). The prompt asks to audit it, not just trash it. The "no-fault" insight is actually powerful *rhetorically*, even if legally weak. I should acknowledge that.

      *Refining the Mapping:*
      *   Spouses: Scottish Polity vs. British Polity.
      *   Vows: Treaty of Union.
      *   Home: The Sovereign State (UK).
      *   Children: Future Generations / Public Institutions (NHS, Pension).
      *   Court: International Recognition / Domestic Constitutional Order.

      *Refining the "Load-Bearing" Disanalogies:*
      *   The biggest one is *Territory*. In divorce, people separate. In secession, land stays put, people are divided by a new line.
      *   The second is *Authority*. A court has power over spouses. Who has power over Westminster and Holyrood?

      *Refining Alternatives:*
      *   *Partnership Dissolution:* Better than marriage because it implies assets/liabilities.
      *   *Constitutional Amendment:* Actually, secession is more like amending the constitution to remove a clause.
      *   Let's stick to the prompt's suggestions: Co-owned building, Club, Lease, Spin-off.
      *   *Spin-off* is the strongest economically. *Condo* is strongest territorially.

      *Final Polish:* Check against "No citations" rule. Ensure I answer the specific question about whether the conclusion survives (it doesn't, really).

  9.  **Final Review against constraints:**
      *   No citations? Check.
      *   No diplomacy? Check.
      *   Table included? Check.
      *   All 5 sections covered? Check.

      *(Self-Correction on "No-fault"):* The prompt asks if the no-fault line shows a right to leave or just negotiation. I need to be clear: it shows a right to negotiation, not unilateral exit. The analogy fails because no-fault divorce *does* grant unilateral exit (eventually). Secession does not.

      *(Self-Correction on "Boundary Problem"):* This is the killer. Marriage assumes two distinct individuals. Secession argues over whether the "individual" (Scotland) exists as a sovereign entity capable of divorce. The analogy assumes the conclusion.

      Okay, ready to write.s
answer: |-
  ### 1. The Mapping

  Your friend's draft leaves the metaphysical status of the "spouses" vague, which is where the analogy first begins to leak. To audit it properly, we must fix the correspondences. Here is the explicit mapping required to make the argument run:

  | Feature | Marriage Analogy | Political Reality (Scotland/UK) |
  | :--- | :--- | :--- |
  | **The Spouses** | Two individual persons (Husband/Wife). | **The Problem:** Is it the Scottish *People* vs. the British *People*? Or the Scottish *Parliament* vs. the UK *Parliament*? The draft implies the former (popular will), but the legal mechanics require the latter. |
  | **The Vows** | Wedding vows (consent to union). | The Treaty of Union (1707) and subsequent constitutional statutes. |
  | **The Matrimonial Home** | The shared house/assets. | The Sovereign State (the UK) and its territory (the Island of Great Britain). |
  | **The Children** | Offspring of the union. | **Ambiguous:** Future generations? Public institutions (NHS, Pension)? Or Unionist voters in Scotland who "didn't choose this"? |
  | **Pre-nuptial Agreement** | Terms set before marriage. | The Claim of Right / Act of Union (terms of entry). |
  | **No-Fault Regime** | Law allowing exit without proving harm. | The democratic principle of self-determination / popular sovereignty. |
  | **The Court** | Family Court / State Judiciary. | **The Void:** There is no neutral superior tribunal. Is it the UK Supreme Court? The UN? The EU? |
  | **Entry Condition** | Voluntary contract between adults. | **The Friction:** Citizenship is largely *jus soli* (birthright) or *jus sanguinis*, not consensual contract. You are born into the "marriage." |
  | **The Decree** | Legal dissolution of bond. | International recognition of a new sovereign state. |

  ### 2. Disanalogies: Load-Bearing vs. Decorative

  You are right to instinctively doubt the weight this analogy can bear. Most of its emotional resonance is decorative, but several disanalogies are structural and fatal to the legal argument.

  **Decorative (Safe to ignore):**
  *   **Emotional Betrayal:** The idea that Westminster feels "hurt" or Scotland feels "unloved" is rhetorical color. It does not affect the legal mechanics of secession.
  *   **Intimacy:** The private nature of marital breakdown does not map to public political debate, but this doesn't invalidate the core logic of *exit*.
  *   **"Growing Apart":** Whether the reasons for leaving are economic or cultural is irrelevant in no-fault divorce, just as the *reasons* for independence are theoretically irrelevant to the *right* to ask.

  **Load-Bearing (The argument collapses on these):**
  *   **Territory vs. Person:** In a divorce, the spouses separate physically; the house is sold or one buys the other out. In secession, the land does not move. The "spouse" (Scotland) claims the land it stands on is *its* body. This is the single greatest failure of the analogy. A wife cannot claim the kitchen is hers because she cooked in it; a secessionist movement claims the territory is theirs by right of inhabitance. This changes the dispute from "division of assets" to "division of jurisdiction."
  *   **The Third-Party Effect:** A divorce changes the status of the couple and their children. It does not change the legal jurisdiction of the neighbors. Scottish independence changes the border of England. It alters the defense perimeter, currency zone, and tax base of the "rump spouse" (rUK) without their consent. In marriage, my divorce does not force my brother to change his last name or pay different taxes. In secession, it does.
  *   **The Enforcer:** A divorce decree is backed by the state's monopoly on violence. If a husband refuses to leave, the police remove him. In secession, who removes Westminster? There is no superior power to enforce the "decree" of independence. The analogy assumes a court exists that has authority over both spouses. In the UK context, Westminster *is* the court (Parliamentary Sovereignty). You cannot sue the judge.
  *   **Unilateral Exit:** In no-fault divorce, if one party wants out, the marriage ends (eventually). In statehood, one party (Scotland) cannot unilaterally end the union if the other (Westminster) holds the constitutional keys. The analogy smuggles in a right to exit that does not exist in domestic or international law for sub-state units.

  ### 3. Quiet Imports: What the Analogy Smuggles In

  The analogy is not neutral; it performs ideological work by assuming the conclusion of the debate.

  **The Boundary Problem (The "Who" Question):**
  The marriage analogy presupposes two distinct, pre-existing individuals. It assumes "Scotland" is already a distinct legal person capable of being a spouse. But the contested question in Scotland (as in Catalonia and Quebec) is precisely *who* constitutes the unit entitled to decide.
  *   *The Smuggle:* By casting Scotland as a spouse, the analogy asserts that Scotland is already a sovereign entity merely in a union, rather than a region within a sovereign state. It bypasses the argument that the "marriage" is between all citizens of the UK equally, meaning the "divorce" requires the consent of all partners, not just the ones in the Scottish wing of the house.

  **The Tribunal Problem (The "How" Question):**
  Divorce presupposes a legal framework where both parties are subject to a higher authority (the State/Family Court).
  *   *The Smuggle:* The analogy imports the existence of a neutral arbiter who can grant the decree. In reality, there is no tribunal above Westminster and Holyrood. By invoking the "court granting a decree," the argument quietly assumes an international or constitutional mechanism that recognizes Scotland's right to petition directly. It hides the hard political reality: without Westminster's consent, there is no court to appeal to.

  **The Voluntarism Problem:**
  Marriage is a contract entered voluntarily by adults. Citizenship is often acquired by birth.
  *   *The Smuggle:* The analogy implies the Union is purely consensual and therefore dissolvable by withdrawal of consent. It ignores that states are coercive territorial monopolies. You cannot "divorce" the UK and stay in Glasgow; you remain subject to the new sovereign authority whether you voted for it or not. The analogy hides the coercive nature of the new state being formed.

  ### 4. Assessment of Conclusions

  **Does the "No-Fault" Line Hold?**
  No. It proves too much and too little.
  *   **Too Much:** It suggests a unilateral right to leave. In law, no-fault divorce grants a right to *dissolution*, not just negotiation. If the analogy held, a Scottish majority vote would automatically dissolve the Union after a cooling-off period. Westminster knows this is not the case.
  *   **Too Little:** In reality, the "no-fault" principle in politics maps closer to the Supreme Court of Canada's *Secession Reference* logic (which you alluded to): a clear majority on a clear question creates a *political obligation to negotiate*, not a legal right to secede. The marriage analogy obscures this distinction. It makes the Unionist refusal to grant a referendum look like "coercive control" (morally bankrupt), whereas in constitutional law, it may simply be "upholding the rules of the contract."
  *   **Verdict:** The conclusion that Westminster has "no standing to set conditions" is false. In a divorce, the court sets conditions (custody, assets). In secession, the rump state absolutely has standing to set conditions because it holds the assets (currency, debt, military) and the constitutional authority.

  **Does the Unionist Counter-Use Fare Better?**
  Slightly, but it also relies on false symmetry.
  *   **Strengths:** It correctly identifies that assets (debt, infrastructure) must be divided and that "children" (citizens/public services) have interests independent of the parents' desires.
  *   **Weaknesses:** It relies on the existence of a judge to enforce the split. Unionists say "You can't take the house (currency/defence)." But in a divorce, you *can* force the sale of the house. The Unionist argument often implies the house cannot be sold at all, which is not how divorce works.
  *   **Verdict:** It is rhetorically stronger on *consequences* (the messiness of splitting) but weaker on *principle* (the right to separate). However, both sides use the analogy to hide the lack of a neutral enforcer.

  **Overall:** The analogy supplies vividness but creates false legal expectations. It makes secession look like a private law matter (contract dissolution) when it is a public law matter (constitutional rupture).

  ### 5. Better Analogies

  If the goal is to preserve the structure of the problem rather than just the emotion, there are superior analogies in this neighborhood.

  **1. Corporate Demerger / Spin-off (Rank: 1)**
  *   **The Setup:** A conglomerate (UK) has a subsidiary division (Scotland). Shareholders (Voters) want the division to become a separate company.
  *   **Preserves:** The economic reality. Assets, liabilities, pensions, and contracts must be explicitly allocated. It captures the idea that the "brand" (UK) and the "assets" (North Sea oil, banks) are shared. It acknowledges that the Board (Westminster) must approve the spin-off for it to be legally recognized in the market (international recognition).
  *   **The Gap:** It cannot reproduce *territory*. A company can move its headquarters; a state cannot move its border. It also lacks the *coercive* element; a new company cannot force you to use its currency, whereas a new state can.
  *   **Why it's better:** It forces the debate onto the practical terms of separation (debt share, currency) rather than the emotional right to leave.

  **2. Co-owned Building / Condo Association (Rank: 2)**
  *   **The Setup:** Two owners share a title to a building. One wants to sever their title and build a separate structure on their portion of the land.
  *   **Preserves:** The *territorial* problem. You cannot take the load-bearing walls (infrastructure/NHS) without collapsing the building. It highlights that one owner cannot unilaterally redraw the property line if it affects the structural integrity of the whole.
  *   **The Gap:** It implies equal ownership shares, which is constitutionally disputed. It also lacks the "citizenship" element; condo owners can sell and leave, citizens cannot easily leave the jurisdiction.
  *   **Why it's better:** It kills the "no-fault" argument. You cannot force a co-owner to sell the building if the mortgage is joint.

  **3. Club Membership (Rank: 3)**
  *   **The Setup:** A member wants to resign from a private club and start a rival one down the street.
  *   **Preserves:** The voluntary association aspect.
  *   **The Gap:** It fails completely on territory and coercion. You can quit a club and keep your house. You cannot quit the UK and keep your jurisdiction.
  *   **Why it's worse:** It encourages the illusion that independence is cost-free for the leaver.

  **Recommendation:**
  Tell your friend to keep the marriage analogy only if he explicitly flags it as **rhetorical, not legal**. It is useful for describing the *betrayal* felt by voters, but it must be discarded when discussing the *mechanics* of exit.

  If he wants a governing analogy, **Corporate Demerger** is the most robust. It forces the Unionist side to admit that demergers happen and can be successful, while forcing the Independence side to admit that demergers require the Board's cooperation to allocate assets and liabilities legally. It removes the moral posturing about "vows" and replaces it with the cold calculus of balance sheets and shareholder consent—which is, ultimately, what a referendum on independence actually is.

  **The One Insight the Marriage Analogy Hides:**
  There is one genuine insight the marriage analogy obscures that your friend should consider. In a messy divorce, the party with less economic power often stays in the marriage not out of love, but out of dependency. The marriage analogy frames this as "coercion." The Corporate/Condo analogy frames this as "viability." The hard question for the Independence movement is not whether they have the *right* to divorce, but whether they can survive the asset split without the economies of scale of the "matrimonial home." The marriage analogy makes this sound like a punishment; the business analogy correctly identifies it as a risk assessment.
