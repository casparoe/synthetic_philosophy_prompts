  # Taxonomy of Dispositional Ontologies: A Decision Tree

  **Instructions:** Proceed through the nodes sequentially. Answer each question based on your judgment of the case described. Follow the branch corresponding to your answer. Where branches converge to the same Leaf ID, your position is logically equivalent to others arriving at that same Leaf, regardless of the path taken.

  ### **Node 1 (Root): The Combined Interference Case**
  **Case:** Consider a glass vase that is intrinsically fragile. It is simultaneously (a) wrapped in thick shock-absorbing foam (a **mask**) and (b) fitted with an internal nanotech mechanism that instantly repairs any micro-crack upon formation (a **fink**). The vase is struck; the foam absorbs the shock, but even if the foam failed, the repair mechanism would prevent breakage.
  **Question:** Does the vase possess the disposition of *fragility* in this state?

  *   **Branch A:** No. The disposition is destroyed/absent. The presence of *both* the mask and the fink removes the property.
  *   **Branch B:** No. The disposition is destroyed/absent. The *fink* removes the property, but the *mask* alone would not have. (You distinguish between finks and masks; only finks destroy dispositions).
  *   **Branch C:** Yes. The disposition persists. Neither extrinsic condition removes the intrinsic property. (You deny that the distinction between fink and mask affects the *possession* of the disposition, only its manifestation).

  ---

  ### **Node 2 (Level 2): The Mimic Case**
  **Case:** Consider a holographic projection of a vase. It has no physical substrate (no glass, no molecular structure). If struck, it projects a "shattering" visual and audio effect identical to a breaking vase, but nothing physical breaks.
  **Question:** Is this hologram *fragile*? (Does ascribing the disposition require a categorical physical base?)

  *   **Branch A (All Roots):** Yes. Behavioral output is sufficient. A disposition is defined by what a thing *does*, not what it is *made of*.
  *   **Branch B (All Roots):** No. Categorical base required. A disposition must be grounded in a physical substrate capable of supporting the counterfactual.

  ---

  ### **Node 3 (Level 3): The Double-Fink Antidote Case**
  **Case:** Consider a vial of lethal poison. A mechanism in the room detects the poison's molecular signature and instantly releases a perfect antidote that neutralizes it before ingestion. The poison is *never* lethal in this environment because the antidote is always present and triggered by the poison itself.
  **Question:** Is the poison *lethal* in this environment?

  *   **Branch A:** No. Dispositions are sensitive to actual interfering conditions. If the manifestation is blocked in the actual world, the disposition is not present (or not active).
  *   **Branch B:** Yes. Dispositions are modally robust. The poison is lethal in nearby possible worlds where the antidote mechanism fails or is absent.

  *(Note: If you selected Root Branch A or B [Disposition Destroyed], you are logically committed to Branch A here. If you selected Root Branch C [Persists], you may choose either.)*

  ---

  ### **Node 4 (Level 4): The Permanent Universal Blockage Case**
  **Case:** Consider a substance with a supposed disposition (e.g., solubility). Imagine a universe where every possible path to manifestation is permanently masked or finked by law-like regularities. No solvent exists, or any solvent introduced is instantly neutralized by law.
  **Question:** What is the ontological status of the disposition?

  *   **Branch A:** **Unified Power.** A single, irreducible power persists despite the blockage. The disposition is identical across all potential manifestations.
  *   **Branch B:** **Fragmented/Vanished.** The disposition either vanishes entirely or fragments into independent multi-track capacities (e.g., "solubility-in-water" is distinct from "solubility-in-acid").

  *(Note: If you selected Root Branch A or B [Disposition Destroyed], you are logically committed to Branch B [Vanished]. If you selected Node 3 Branch A [Actual Sensitivity], you are committed to Branch B [Vanished/Fragmented].)*

  ---

  ### **Taxonomic Leaves (Positions)**

  **Leaf 1: Extrinsic Eliminativism (Root A + Node 2 B)**
  *   **Path:** Both Mask/Fink destroy disposition + Base Required.
  *   **Diagnosis:** **Unnamed / Unstable.** This position holds that extrinsic conditions destroy the intrinsic base. It is rarely defended because it conflates the *possession* of a property with its *manifestation conditions*. It risks collapsing into Leaf 2 if the "base" is understood as merely the history of behavior.
  *   **Stability Warning:** Unstable. If the base is categorical, extrinsic foam shouldn't destroy it. If the base is behavioral, extrinsic foam shouldn't destroy it (see Leaf 2).

  **Leaf 2: Regularist Eliminativism (Root A + Node 2 A)**
  *   **Path:** Both Mask/Fink destroy disposition + No Base Required.
  *   **Position:** **Eliminativist Regularism.** Dispositions are merely descriptions of actual regularities. If the regularity is blocked (by foam or fink), the disposition talk is false.
  *   **Diagnosis:** Coherent but restrictive. Denies dispositions in masked/finked cases entirely.

  **Leaf 3: Finkish Categoricalism (Root B + Node 2 B)**
  *   **Path:** Only Fink destroys + Base Required.
  *   **Position:** **Categorical Realism (Fink-Sensitive).** Dispositions are categorical bases. Masks hide them; Finks remove them (by altering the base).
  *   **Diagnosis:** **Standard Categorical View.** This is the most common realist position. It distinguishes masks (extrinsic blockers) from finks (intrinsic alterers).

  **Leaf 4: Finkish Behaviorism (Root B + Node 2 A)**
  *   **Path:** Only Fink destroys + No Base Required.
  *   **Position:** **Refined Conditional Analysis.** Dispositions are counterfactuals. Finks make the counterfactual false; masks do not (because masks are part of the "normal conditions" clause).
  *   **Diagnosis:** **Simple Conditional Analysis (Modified).** Attempts to save behaviorism from finks by adjusting the antecedent conditions.

  **Leaf 5: Global Actualism (Root C + Node 3 A)**
  *   **Path:** Persists + Actual World Sensitivity.
  *   **Position:** **Contextual Dispositionalism.** The disposition persists intrinsically (Root C) but is sensitive to actual interference (Node 3 A).
  *   **Diagnosis:** **Unnamed / Tension.** This position claims the vase is fragile despite the fink, but the poison is not lethal because of the antidote. It treats "fragility" as more intrinsic than "lethality."
  *   **Convergence Flag:** Converges with Leaf 6 on practical judgments but differs rhetorically on the poison case.

  **Leaf 6: Modal Realism / Dispositional Essentialism (Root C + Node 3 B + Node 4 A)**
  *   **Path:** Persists + Modal Robustness + Unified Power.
  *   **Position:** **Dispositional Essentialism (Power Realism).** Dispositions are essential properties grounded in powers that persist regardless of actual blockage.
  *   **Diagnosis:** **Dominant Realist View.** Maintains that powers are intrinsic and modally stable.

  **Leaf 7: Multi-Track Fragmentation (Root C + Node 3 B + Node 4 B)**
  *   **Path:** Persists + Modal Robustness + Fragmented Capacity.
  *   **Position:** **Multi-Track Dispositionalism.** The disposition persists, but "solubility" is not one power; it is a cluster of distinct stimulus-manifestation pairs.
  *   **Diagnosis:** **Coherent Alternative.** Avoids positing a "unified power" metaphysics while retaining modal robustness.

  **Leaf 8: Rylean Behaviorism (Root C + Node 2 A)**
  *   **Path:** Persists + No Base Required. (Node 3 & 4 become moot/rhetorical).
  *   **Position:** **Classical Behaviorism.** Dispositions are long-term behavioral tendencies. Since the vase *would* break if the foam/fink were removed, it is fragile.
  *   **Diagnosis:** **Convergence Warning.** Practically indistinguishable from Leaf 6 on the vase case, but ontologically distinct (no powers vs. powers).

  ---

  ### **Diagnostic Notes on Convergence and Instability**

  **1. Convergence of Leaf 6 and Leaf 8 (The "Persists" Convergence)**
  *   **Leaves:** Dispositional Essentialism (6) vs. Rylean Behaviorism (8).
  *   **Nature:** **Merely Rhetorical.** On the concrete cases provided (Vase, Mimic, Poison), these two views often yield identical "Yes/No" judgments. Both agree the vase is fragile, the mimic is not (usually), and the poison is lethal (modally).
  *   **Distinction:** They differ only on the *ontology* underlying the judgment (Power vs. Linguistic/Behavioral Habit). This tree isolates them at Node 2 (Base Required) and Node 4 (Unified Power), but students may find their case-judgments align while their metaphysical commitments diverge.

  **2. Instability of Leaf 1 and Leaf 5**
  *   **Leaf 1 (Extrinsic Eliminativism):** This branch is **Unstable**. It claims extrinsic foam destroys an intrinsic categorical base. This requires a causal mechanism where "wrapping" alters "molecular structure" without physical interaction. Most students selecting this will migrate to Leaf 2 (Regularism) or Leaf 3 (Categoricalism) upon reflection.
  *   **Leaf 5 (Global Actualism):** This branch is **Inconsistent**. It asserts fragility persists despite a fink (Root C) but lethality vanishes due to an antidote (Node 3 A). Unless the student can articulate a principled difference between a "self-repairing vase" and "auto-antidoting poison," this position is vulnerable to charges of arbitrariness.

  **3. The "Mask vs. Fink" Distinction (Root Branches A vs. B)**
  *   **Convergence:** Leaf 2 (Regularist) and Leaf 4 (Conditional Analysis) often converge on the judgment that the vase is *not* fragile in the combined case, but for different reasons. Leaf 2 says the regularity is broken; Leaf 4 says the counterfactual is false.
  *   **Separation:** The tree separates them at Node 2 (Base Required). If they agree on the Base, they are practically indistinguishable in this instrument.

  **4. Empty Logical Space**
  *   **Branch:** Root "Mask Only Destroys" (Not included in tree).
  *   **Diagnosis:** **Incoherent.** No major theory holds that wrapping a vase in foam removes its fragility while a self-repair mechanism does not. This would imply dispositions are more sensitive to passive blocking than active alteration, which contradicts the standard definition of intrinsic properties. This branch was omitted to preserve tree efficiency.
