  *(Self-Correction Note)*: I need to be careful with the "Bad Faith" definition. Ignorance isn't Bad Faith. Bad Faith is lying to oneself. So, early Truman is mostly ignorant. Later Truman (when he suspects) is where Bad Faith comes in. I must make this distinction clear for the students.

