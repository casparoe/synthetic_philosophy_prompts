answer: |-
  Here's a run-of-show with 9 questions. They're scripted casually so you can read them off the cuff, with tactical follow-ups attached to each one in case she tries to dodge or lean too hard on the "hard to measure" defense.

  **1. The Mechanism Hook**
  "Let's start with the core mechanism. You call this 'constraint-release inversion.' Usually, people think removing barriers means people choose *freely.' You're saying removing barriers means people choose *strategically.' Why does dropping the economic survival game make gender a more useful signal, not less?"
  *   **If she says:** "It's about identity expression."
  *   **Follow-up:** "But why gender specifically? In a high-equality society, shouldn't 'individuality' be a stronger signal than 'gender conformity'? What makes gender the cheap currency here?"

  **2. The Finland Counter-Example**
  "Critics always point to Finland. High equality, but massive segregation in nursing and engineering. Under your model, is that because nursing is a 'high-fidelity' signal for women there? Or is there something about the status of those jobs specifically?"
  *   **If she says:** "It's about cultural coordination."
  *   **Follow-up:** "Okay, but if it's just coordination, why doesn't the signal flip? Why is nursing the 'female' signal and not engineering? Is the signal arbitrary, or is it tethered to biology despite your claim?"

  **3. Preference Saturation**
  "You argue that once economic security hits a certain floor, gendered preferences don't level off—they amplify. You call this 'preference saturation.' Walk me through why security acts as an amplifier rather than a neutralizer."
  *   **If she says:** "People just feel safer to be themselves."
  *   **Follow-up:** "That sounds like the innate preference argument you're trying to avoid. How do you distinguish 'feeling safe to be yourself' from 'deploying a safe social signal' without just asserting it's signaling?"

  **4. The Post-Hoc Trap**
  "Here's the pushback you probably expect: Isn't 'constraint-release inversion' just a story we tell after looking at the data? If the signal is internal and low-cost, isn't this theory unfalsifiable? How do you know it's not just a post-hoc pattern?"
  *   **If she says:** "Social mechanisms are hard to isolate experimentally."
  *   **Follow-up:** "I get that, but if we can't isolate the mechanism from the outcome, does the theory risk becoming a tautology? Where's the line where you'd say 'okay, this data would prove me wrong'?"

  **5. Non-Binary Predictions**
  "If gender is functioning as a signaling coordinate, what happens to people who reject the binary? Do you predict they opt out of the signaling game entirely, or do they find a new coordinate? What does your model say they should do career-wise?"
  *   **If she says:** "We don't have enough data yet."
  *   **Follow-up:** "Fair, but theoretically—should we expect them to cluster in 'neutral' fields, or does rejecting the signal push them toward high-risk careers where signaling matters less?"

  **6. Data Limitations**
  "Following up on that—can current datasets even test this? Most labor data tracks binary sex, not gender identity or signaling intent. Are we trying to solve this with tools that are too blunt?"
  *   **If she says:** "We need better qualitative data."
  *   **Follow-up:** "So are we stuck waiting on sociology to catch up, or can we use existing economic shocks as a proxy to see if the signaling behavior changes?"

  **7. Economic Volatility**
  "Let's stress-test the 'security' part. If a highly egalitarian country hits a deep recession—security drops—does the signaling stop? Do we see gendered sorting decrease because the cost of signaling gets too high?"
  *   **If she says:** "It should theoretically reverse."
  *   **Follow-up:** "Have you seen any evidence of that reversal yet, or is the ratchet effect too strong? Once the signal is set, does it stick even when the economy tanks?"

  **8. Policy Implications**
  "If this is partly a signaling equilibrium, what's the policy move? Do we try to suppress the signal—maybe blind hiring everywhere—or do we just live with the sorting because it's 'cheap' social coordination?"
  *   **If she says:** "We shouldn't suppress identity."
  *   **Follow-up:** "But if the sorting reinforces inequality downstream, isn't living with it just accepting the equilibrium? Is there a way to change the *cost* of the signal without banning it?"

  **9. The Endgame**
  "Last one. If you're right, where does this end? Does gendered sorting max out at some point, or does it keep sharpening until every job is effectively sex-segregated by signal? What's the stable state here?"
  *   **If she says:** "It will stabilize."
  *   **Follow-up:** "What does stability look like? Is it a 50/50 split within fields, or is it total segregation where the fields themselves are valued equally? Because those are very different futures."
