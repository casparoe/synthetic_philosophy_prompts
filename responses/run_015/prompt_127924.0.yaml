prompt: |-
  I'm prepping questions for a podcast intervew next week. The guest is a sociologist who defends a pretty niche version of the gender-equality paradox — she calls it "constraint-release inversion." Her claim is that in highly egalitarian countries gendered career sorting actually gets sharper not because innate preferences suddenly surface, but because once formal barriers drop, occupational choice turns into a low-cost signaling game, and gender ends up being one of the cheapest identity markers people can deploy. I want eight or nine questions that go beyond having her restate the view.

  Specifcally, I need:
  - one on the Finnish nursing/engineering split, since that's the classic counter-example people throw at her,
  - at least one on "preference saturation" — her idea that once economic security is high, gendered preferences don't level off but amplify — with a follow-up for when she says that's just a post-hoc pattern,
  - one about non-binary career patterns: if gender is functioning as a signaling coordinate, what should we predict for people who reject binary categorization, and can current datasets even test it,
  - and one on policy: if this is partly a signaling equilibrium, is the right response to suppress the signal or just live with the sorting?

  For each, include a follow-up keyed to the answer she's most likely to give — especially her usual move that the signaling mechanism is hard to isolate experimentally. Don't ask for bibliographies or a reading list; she should answer from reasoning. Keep it casual, I'm running out of prep time.
