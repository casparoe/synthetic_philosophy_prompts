  Context: my brother in law, who's very online in existential-risk circles, sent me the doomsday argument as a reason to take x-risk seriously, and I've been chewing on it for a week. I have a suspicion and I want you to tell me if it's right or if I'm smuggling something.

  My suspicion: the whole fight between the "self-sampling" style assumption and the "self-indication" style assumption is, in my terms, just a fight about sampling design. One says: pick a hypothesis about total population size first, then draw one individual uniformly from it — which is two-stage sampling with equal cluster probabilities, where big populations get under-represented per capita. The other says: your observer-moment is drawn from the pooled set of all observer-moments, so hypotheses with more observers contribute more draws — which is exactly PPS / size-biased sampling, the thing that makes you oversample big fish and long intervals. And the reason the second one feels like it lets you conjure a huge population out of nothing is that in my world a size-biased sample is only usable because I separately know my effort and can calibrate a detection probability; if you delete the effort calibration, the size bias and N are not separately identifiable, and the "presumptuous" flavor of result is just what non-identifiability looks like. Am I right, or am I importing something bigger — namely that there *is* a random draw with a known design at all? In ecology I always know who's doing the sampling, because it's me. Who's doing it in the anthropic case?

  So here's what I want:

  1. Restate, one by one and as precisely as you can, in my vocabulary: (a) the core inference from birth rank to total N (including the "roughly double it" estimate and how it relates to a German-tank-style order-statistic estimate with a sample of one); (b) the reference class problem; (c) the SSA vs SIA disagreement, in design terms; (d) the Adam-and-Eve-style case where the first couple seems to get to conclude there'll be billions, and the "presumptuous philosopher" complaint about that; (e) the prior on total N and the question of how big the credence shift actually is; (f) the two different-looking versions — the one that uses your position in the birth order and the one that uses how long the thing you're observing has been around — and whether they translate the same way or differently.

