      *   **Characters:** Dr. Maya Torres (Virtue Ethicist) vs. Dr. Leo Park (Situationist Critic).
      *   **Core Theme:** Virtue as distributed across a "moral ecology" (person + environment + context) vs. traditional character vs. situationist critique (inconsistency).
      *   **Specific Constraint:** Avoid strawmanning. No "Aristotle was right!" vs. "People are inconsistent!" They must engage deeply with each other's points.
