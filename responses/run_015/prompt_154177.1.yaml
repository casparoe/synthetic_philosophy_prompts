answer: |-
  **Setting:** *A quiet corner of a faculty lounge, mid-afternoon. Two empty coffee cups sit between Dr. Maya Torres and Dr. Leo Park. A whiteboard in the background is covered in half-erased notes from a morning lecture.*

  **Leo:** Okay, but look at Jordan again. Be honest. You have a paramedic who keeps a cool head in a burning building, triages three victims without blinking, and shows genuine compassion for strangers in their worst moments. Then he goes home and screams at his partner because the dishes aren't stacked correctly. If virtue is a stable character trait, where did it go at 6:00 PM?

  **Maya:** It didn't go anywhere, Leo. You're assuming virtue is a suitcase the agent carries around. I'm saying it's more like… a current. It flows between the agent and the environment. Jordan isn't "fragmented." He's embedded in two different moral ecologies.

  **Leo:** "Moral ecology." That's the term you're testing for the seminar, right? It sounds poetic, Maya, but does it hold water? If your character depends entirely on the furniture in the room, is it still *your* character? Or is situationism right? Are we just vessels pouring whatever liquid the situation dictates?

  **Maya:** I'm not saying the furniture dictates it. I'm saying virtue is a partnership. In the ambulance, the ecology supports Jordan's competence. The protocols, the urgency, the clear goal of "save life"—that scaffolding allows his disposition to manifest. At home, the ecology is ambiguous. There's no protocol for "loading the dishwasher." His patience doesn't have the same structure to lean on.

  **Leo:** But that's exactly what the situationists have been shouting for twenty years! The Milgram experiments, the Stanford Prison study—they show that when you change the ecology, the "virtue" evaporates. Ordinary people administer lethal shocks because a man in a lab coat tells them to. If virtue is ecological, then Milgram didn't show that people are obedient; he showed that the *lab* was the moral agent, not the participant.

  **Maya:** Wait. Stop there. Because this is where your critique eats itself. If you strip away the agent's character and say it's all just the situation… how do you condemn Milgram?

  **Leo:** I condemn the setup. I condemn the authority structure.

  **Maya:** But to call it "condemnation," you're using virtue language. You're saying the situation was *cruel* or *unjust*. Those are moral evaluations that require a standard of human flourishing. If people are just reactive blobs, there's no tragedy in Milgram. There's just physics. Input, output. The reason those experiments haunt us is that we expect the participants to have had the resources to resist. We expect a virtue that *could* have held, even in a hostile ecology.

  **Leo:** That's a nice save, but it feels like moving the goalposts. You're saying virtue exists, but only when the world lets it shine. But look at Jordan again. If we accept your "ecological virtue," do we stop holding Jordan responsible for being a jerk at home? If his patience is dependent on medical protocols, then he isn't vicious; he's just… ecologically mismatched.

  **Maya:** I'm not letting him off the hook. That's the point of cultivating virtue. It's not just about having a good heart; it's about learning to build or carry your own ecology. A master carpenter doesn't need a perfect workshop to make a straight cut. Maybe Jordan is a novice virtue-ethicist. He relies on the external structure of the ambulance. The goal of ethical development is to internalize that structure so you can bring it into the kitchen.

  **Leo:** Okay, I like that. That's actually a concession. You're admitting that the "global trait" view—the idea that a courageous person is courageous everywhere, always—is false.

  **Maya:** I'm admitting that the *expression* is contextual. But the disposition is real. Think of it like a seed. An oak tree is still an oak tree even if it grows stunted in poor soil. You're looking at the stunted branches and saying, "See? No tree." I'm saying, "The soil is wrong."

  **Leo:** But what if the soil is *us*? What if "home" and "work" aren't just different soils, but they require different seeds? Maybe the trait that makes Jordan a good paramedic—hyper-vigilance, absolute control, decisive action—is the exact same trait that makes him a jerk at home. It's not that he loses his virtue at the door; it's that the virtue itself is domain-specific.

  **Maya:** So you're arguing for fragmentation. That there's no such thing as "Justice," only "Justice-in-the-Courtroom" and "Justice-in-the-Kitchen."

  **Leo:** I'm arguing that "Justice" is a label we slap on a bunch of disparate behaviors that happen to look similar. If Jordan is kind to patients because it's his job, but unkind to his spouse because he's tired… the psychological mechanism isn't "Kindness." It's "Professional Compliance" versus "Emotional Exhaustion." There's no unified self there to praise or blame.

  **Maya:** But Leo, if there's no unified self, who is doing the learning? If I want to become a better person, what am I working on? If I'm just a collection of context-dependent responses, moral education becomes impossible. You can't teach "be brave." You have to teach "be brave when X, Y, and Z are present."

  **Leo:** And maybe that's exactly what we should be teaching! Stop telling students they need to be "good people." Tell them, "You are likely to be honest when your friends are watching, but likely to cheat when you're anonymous and tired. So, change your environment. Don't put yourself in the anonymous, tired spot." That's more honest than telling them to build a fortress of character that history shows doesn't exist.

  **Maya:** I agree with the strategy, but not the ontology. You're describing *how* to survive a bad ecology. I'm describing how to transform it. If Jordan realizes his patience is ecological, he doesn't just avoid the kitchen. He works to make the kitchen a place where patience is possible. He negotiates with his partner. He changes the cues.

  **Leo:** So virtue is… interior design?

  **Maya:** [Laughs] In a way? It's recognizing that we aren't atoms bouncing around. We're nodes in a network. When Milgram's subjects shocked the learner, they weren't just "obedient." They were trapped in an ecology designed to strip away their agency. A virtue ethicist looks at that and says, "The tragedy is that the ecology defeated the agent." A situationist says, "The agent was an illusion."

  **Leo:** I think the tragedy is that we keep expecting the agent to be stronger than the system. We keep wanting Jordan to be a saint at home because he was a hero at work. It sets people up for failure. It creates hypocrisy.

  **Maya:** Or, it creates a challenge. If virtue is ecological, then my moral responsibility extends beyond my skin. I am responsible for the ecologies I inhabit. If I can only be kind when things are easy, I haven't cultivated kindness; I've cultivated comfort. Jordan's failure at home isn't proof that character is fake. It's proof that his character hasn't migrated yet.

  **Leo:** "Migrated." That's interesting. So you're keeping the Aristotelian idea of habituation, but you're admitting the habit is tied to the context cues.

  **Maya:** Exactly. Aristotle talked about the *phronimos*—the person of practical wisdom. That person isn't just following rules. They're reading the room. They're adjusting the ecology. If Jordan can't read the home room, he lacks *phronesis*. He's technically skilled, but he's not wise.

  **Leo:** Okay. I can live with that. But I still think you're giving the "self" too much credit. You say Jordan needs to migrate his virtue. I say Jordan needs to admit that "Hero Paramedic" and "Grumpy Husband" are two different roles, and stop expecting the first to validate the second. Maybe the solution isn't to make Jordan more virtuous. Maybe it's to stop looking for a unified soul where there's only a swarm of responses.

  **Maya:** But if there's no unified soul, Leo, who drinks this coffee? Who feels the guilt? Jordan feels guilty about yelling at his partner. That guilt presupposes a unity. He feels like *he* failed, not that "the home ecology failed."

  **Leo:** Guilt is just another emotional response. It's the brain registering a social mismatch.

  **Maya:** [Leans forward] No. It's a claim. When Jordan feels guilt, he's claiming that he *could have done otherwise*. That's the seed of virtue right there. The situationist says, "No, you couldn't have. The cues were different." But the lived experience of being human is the experience of trying to bridge those gaps. My "ecological virtue" just takes that struggle seriously. It says the gap between the ambulance and the kitchen is where the ethics happens.

  **Leo:** So the midterm essay… you're going to argue that character isn't dead, it's just distributed?

  **Maya:** I'm going to argue that character is a verb, not a noun. It's the activity of maintaining integrity across different ecologies. Jordan isn't inconsistent. He's under-integrated.

  **Leo:** And I'm going to argue that "under-integrated" is a polite way of saying the situation wins every time. But… [He pauses, stirring his cold coffee] …I'll grant you this. If we treat virtue as ecological, it makes the situationist critique less destructive. It stops being "You have no character" and starts being "Your character needs better support."

  **Maya:** Which is a much better place to start a moral education.

  **Leo:** Fine. But if Jordan yells at me, I'm blaming Jordan, not his ecology.

  **Maya:** Deal. But I'll be asking him what kind of day he had at work.

  **Leo:** [Smiles] See? You're already doing situationism.

  **Maya:** No, Leo. I'm doing virtue ethics. I'm trying to understand the whole person.
