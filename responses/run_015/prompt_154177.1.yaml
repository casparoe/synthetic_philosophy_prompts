      *   **Opening:** Start with the Jordan case immediately. It grounds the abstract theory.
      *   **Leo's Opening Salvo:** Jordan proves situationism. Inconsistent behavior = no global character.
      *   **Maya's Counter:** It's not inconsistency; it's ecological fit. The paramedic context *scaffolds* virtue.
      *   **Deepening the Debate (Milgram):** Leo brings up the heavy hitter. Milgram shows ordinary people do bad things.
