      *   **Tone:** Conversational, smart, equal footing, not textbook-like. No citations/reading lists.
      *   **Correction:** User noted they misspell "virtue ethics" but wants the dialogue correct.

  2.  **Deconstruct the Philosophical Positions:**
      *   **Leo (Situationist):** Needs to argue that global character traits don't exist because behavior varies wildly across contexts (Milgram, Zimbardo, etc.). But he needs to be nuanced. He shouldn't just say "character is fake." He should argue that *predicting* behavior based on "character" is flawed.
      *   **Maya (Virtue Ethicist/Ecological):** Needs to defend virtue ethics but evolve it. Instead of digging in on "Aristotle knew best," she should adapt. Her argument is that virtue isn't just an internal psychological state; it's a relation between the agent and their environment. If the environment changes, the *expression* of virtue changes, but the disposition might still be real.
      *   **The Bridge:** The "Moral Ecology." This is the user's unique framing. Maya should use this to absorb Leo's critique. Leo should challenge whether "ecological virtue" is just a rebranding that saves the theory by making it unfalsifiable.

  3.  **Drafting - Section by Section:**

