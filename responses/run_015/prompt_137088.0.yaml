answer: |-
  ### Brainstorming: Candidate Principles

  Before settling on a view, I need to test four competing frameworks against your ten cases. I'm looking for a principle that respects your distinction between the *Payout Book* (outcome) and the *Back Book* (status at time of writing).

  **Candidate 1: The Causal Fixity Principle (CFP)**
  *   *Definition:* A prediction is Back Book True/False iff the physical state of the world at the time of writing + laws of nature *causally necessitate* the outcome. Otherwise, it is Open.
  *   *Stress Test:*
      *   **Case 2 (Hidden Coin):** Passes. The coin is physically fixed.
      *   **Case 4 (Excluded Middle):** Fails. "Ferry sails or doesn't" is not causally necessitated by physical laws in the same way a specific outcome is. CFP forces you to say Case 4 is Open, but you said it's "Definitely True."
      *   **Case 7 (Maureen):** Passes. Her reliability doesn't change physics.
      *   **Verdict:** Too restrictive. It breaks classical logic (Case 4).

  **Candidate 2: The Epistemic Accessibility Principle (EAP)**
  *   *Definition:* A prediction is Back Book True/False iff the information required to verify it is *in principle available* at the time of writing.
  *   *Stress Test:*
      *   **Case 2 (Hidden Coin):** Fails. You said it's "Already true," but the info is hidden. EAP would call this Open because you can't check.
      *   **Case 1 (Rain):** Passes. Info unavailable.
      *   **Verdict:** Reject. You clearly distinguish between "unknown but fixed" (Coin) and "unknown and open" (Rain). EAP collapses this distinction.

  **Candidate 3: The Retroactive Truth Principle (RTP)**
  *   *Definition:* If a prediction turns out correct, it *was* true when written. Truth is timeless.
  *   *Stress Test:*
      *   **Case 9 (Steve):** Passes. This is Steve's argument.
      *   **Case 1 & 3 (Rain/Ferry):** Fails. If RTP holds, nothing is ever Open. Everything is just unknown. This contradicts your core intuition that the future is "chancy" or "thickly open."
      *   **Verdict:** Reject. It eliminates the Back Book entirely by merging it with the Payout Book.

  **Candidate 4: The Historical Settledness Principle (HSP)**
  *   *Definition:* A proposition is Back Book True/False iff it is true/false in *all* possible futures branching from the moment of writing. Logical tautologies are always True; contradictions always False. Contingents are Open (neither True nor False in the Back Book sense).
  *   *Stress Test:*
      *   **Case 4 (Excluded Middle):** Passes. True in all branches.
      *   **Case 2 (Hidden Coin):** Passes. Only one physical branch exists (deterministic micro-state), so it's settled.
      *   **Case 6 (Own Decision):** Passes. Multiple branches exist where you choose chicken or fish.
      *   **Case 9 (Steve):** Passes, but requires explaining why Steve is wrong (see below).
      *   **Verdict:** Survivor. It handles the logic (Case 4) and the metaphysics (Case 1 vs 2) without contradiction.

  ***

  ### The Surviving Principle: Historical Settledness

  Here is the precise principle that survives your list. It is rooted in **Branching Time Semantics** (technically, a supervaluationist approach to future contingents), but I will state it in terms of your pool rules.

  **The Principle of Historical Settledness:**
  > A prediction counts as **Back Book True** (or False) at the moment of writing if and only if its truth value is **invariant across all physically possible futures** branching from that moment.
  >
  > 1.  **Logical Necessities:** If a claim is true in all possible futures (e.g., tautologies), it is Back Book True.
  > 2.  **Physical Fixedness:** If the physical state of the world has already determined the outcome (even if hidden), only one future branch exists. It is Back Book True/False.
  > 3.  **Contingents:** If the world could physically evolve into a future where the claim is true and a future where it is false, it is **Back Book Open** (no truth value yet).

  #### Why this forces you to change your mind (The "Cost" of the Principle)

  This principle saves your intuition about the "Open" future (Cases 1, 3, 6) and your intuition about Logic (Case 4), but it requires you to reject two of your gut reactions.

  **1. You must reject Case 7 (Maureen).**
  *   *Your Intuition:* Because Maureen is reliable, her prediction feels "already true."
  *   *The Principle's Verdict:* **Open.**
  *   *Why:* Maureen's track record is probabilistic evidence, not metaphysical fixity. Unless Maureen is a deity or the universe is deterministic, there is still a possible branch where she is wrong this time. Reliability affects *credence* (how much you should bet in the Payout Book), not *settledness* (the Back Book). If you mark Maureen's predictions as Back Book True, you are smuggling determinism in through the back door.

  **2. You must reject Steve's Argument (Case 9).**
  *   *Steve's Claim:* "It's true now that it was true then."
  *   *The Principle's Verdict:* **Equivocation.**
  *   *Why:* Steve is conflating two different tense operators.
      *   Statement A: "It is now settled that (the ferry sailed)." (True)
      *   Statement B: "It was then settled that (the ferry would sail)." (False)
      *   When we say "Dave's prediction was true," we mean "Dave's prediction matches the *actual* history." We do *not* mean "Dave's prediction matched the *only possible* history." Steve's argument assumes the past fixes the future's truth value retroactively. In a branching model, the "actual" history is just one branch that got selected. The other branches didn't disappear; they were just not taken. So, it was *never* Back Book True, even though it is now Payout Book Won.

  **3. A Note on Case 8 (The Lost Coin).**
  *   *Your Intuition:* It "stopped being open and gone false."
  *   *The Principle's Verdict:* **Correct.**
  *   *Why:* When the coin was lost, the branch of history where it lands heads was pruned (causally eliminated). The set of "possible futures" shrank. At $t_1$ (prediction), it was Open. At $t_2$ (loss), the only remaining physical futures involve it *not* landing heads. So it transitioned from Open to Back Book False. It wasn't *always* false; it *became* false when the possibility of heads was physically removed.

  ***

  ### Application: The Bakery Case

  **The Case:** Someone posts at 8am: "The bakery will be sold out by noon." Everyone reads it, rushes out, and buys the bread. It sells out.
  **Question:** Was it Back Book True at 8am?

  **Verdict:** **No. It was Back Book Open.**

  **Reasoning:**
  This is a **self-fulfilling prophecy** (a performative prediction).
  1.  At 8:00am, prior to the post being read, there were physically possible futures where the bread remained (e.g., nobody reads the post, or people ignore it).
  2.  The prediction itself *caused* the branch where the bread sells out to be selected.
  3.  If the prediction had not been made, the outcome might have differed.
  4.  Therefore, at the moment of writing/posting, the outcome was not *invariant across all possible futures*. It was contingent on the reaction to the prediction.

  **Implication:** In your pool, this prediction goes in the **Payout Book as a Win**, but the **Back Book remains Open** (or is marked "Performatively Caused"). It was not *discovered* to be true; it was *made* true. Treating it as Back Book True implies the crowd rush was inevitable, which it wasn't.

  ***

  ### Recommendations for the Back Book House Rules

  Your house rules are actually quite sophisticated metaphysical heuristics. Here is how to codify them under the **Historical Settledness** principle.

  **Rule (a): The Hidden Fact Rule**
  *   *Current:* "If fixed but hidden... fight about it."
  *   *Revision:* **Automatic Back Book Adjudication.**
  *   *Why:* If the physical state is fixed (coin under hand), there is only one branch. It is not Open. Fighting about it is just fighting about *knowledge*, not truth. If you can prove it was physically fixed (e.g., video evidence of the flip before the seal was broken), it counts as Back Book True/False.

  **Rule (b): The Agency Rule**
  *   *Current:* "Predictions about your own future decisions... never 'was already true'd'."
  *   *Revision:* **Keep Exactly As Is.**
  *   *Why:* This is the strongest case for openness. Your decision prunes the branches. Until you decide, multiple branches exist. This is "thick" openness (Case 6). These entries should be Payout Only.

  **Rule (c): The Post-Mortem Rule**
  *   *Current:* "Starred... cannot agree."
  *   *Revision:* **Mark as "Back Book Undecidable."**
  *   *Why:* You don't need a star for mystery; you need it for *category error*. If nobody is alive to check, we cannot establish which history is "actual" relative to a verifier. However, metaphysically, if the event is physically determined (e.g., "The sun will rise"), it is Back Book True. If it is chancy, it is Open.
  *   *Suggestion:* Drop the "nobody alive" criterion. Replace it with **"Verifiability."** If the truth value cannot be verified *in principle* by any observer within the causal lightcone, it cannot enter the Back Book. Not because it lacks a truth value, but because the Back Book is a social practice requiring settlement.

  **Should you keep the Back Book?**
  **Yes.**
  The Payout Book tracks **Accuracy** (correspondence with the actual future).
  The Back Book tracks **Settledness** (correspondence with *all* possible futures).

  Keeping both allows you to distinguish between:
  1.  **Luck:** A guess on an Open event that turned out right (Payout Win, Back Book Open).
  2.  **Insight:** A deduction on a Fixed event (Payout Win, Back Book True).
  3.  **Logic:** Tautologies (Payout N/A, Back Book True).

  **Final Instruction:**
  Tell Steve he is confusing the *actual* past with the *necessary* past. Tell Maureen she is a good bet, not a oracle. And tell the bakery predictor they didn't predict the future; they built it.
