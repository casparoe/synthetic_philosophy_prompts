prompt: |-
  You are a professor of philosophy who works on metaphysics and the logic/semantics side of philosophical logic — the technical side, not the waffly side. Please think really carefully about this one, and before you write your actual answer do a few minutes of brainstorming: sketch three or four candidate principles, try to break each of them against the cases below, and then give me the one that survives. Please don't just give me the standard textbook story. I've poked around online enough to know this is an ancient puzzle that people usually tell with a sea battle, so I know I'm not the first person to wonder about it — but I want you to actually work through *my* list and tell me which of my gut reactions you think are wrong and why.

  So: me and five mates have run a predictions pool for about nine years. Every month we each write down twenty-odd claims about the future, seal them, and settle them later. Over time we've accidentally built a second book. The first one is the Payout Book: after the event we mark each prediction *won* or *lost*, and money moves. The second one we call the Back Book, and in it we argue about whether the prediction **was already true at the moment you wrote it down**, as opposed to merely winning later. This sounds like the same question but it doesn't feel like it. We've developed odd house rules that I now think are doing philosophical work: (a) if the thing is already fixed but hidden — a coin that's been flipped and is sitting under someone's hand — it has to go in the Back Book, we'll fight about it; (b) predictions about your *own* future decisions are banned from the Back Book, they only ever get paid out, never "was already true'd"; (c) predictions about things that happen after nobody's alive to check get a star and we genuinely cannot agree what to do with them.

  Here are my gut verdicts, and they don't all fit together:

  1. "It'll rain on the allotment tomorrow," said where the weather is genuinely chancy. Neither true nor false when I write it. It's *open*.
  2. "That coin under your hand is showing heads." Already true or already false. I just don't know which. Not open. Same coin, same ignorance, but before the flip I'd have said open — so the flip itself seems to do something.
  3. "The ferry will sail tomorrow" (our version of the sea battle thing). Open, exactly like 1.
  4. "Either the ferry sails tomorrow or it doesn't." Definitely true. I'd bet the house on it. This is the one that bothers me: both halves are open, but the either/or feels like the safest thing anyone has ever said.
  5. "The ferry sails tomorrow and it doesn't." Not true. Not open. Just no.
  6. "I'll take the chicken" — said while I'm genuinely undecided at the counter. Open, and open in a *thicker* way than 1: it isn't that I don't know what I'll pick, it's that there's nothing there yet, and it becomes true *because* I pick it. That's why rule (b) feels right to me.
  7. Maureen has called this sort of thing right every single time for nine years. When *Maureen* writes "the ferry will sail," I want to say it's already true. But its the same event as 3, and I said 3 was open. So one of those two reactions is junk and I can't tell which.
  8. Someone wrote "this 10p will land heads," and then the coin got knocked off the table and lost and never flipped at all. That one has *stopped* being open and gone false. Was it always headed for false? I don't like that, but I also don't see how it stays open forever.
  9. Steve's argument, which I can't refute: after the ferry sails we all happily say "Dave's prediction was true." So its true now that it was true then. So it *was* true then. So it was never really open. I think Steve is cheating but I can't find the cheat.
  10. "A city will stand on this hill in the year 3000." Open. And I have no idea what to do with the starred ones, the after-everyone's-dead predictions.

  What I want: one principle (or at most two or three candidates) that captures this pattern, stated precisely enough that I could apply it myself — tell me which of my cases forces each clause of it, and be honest about which of my verdicts it makes me give up. Then tell me what it says about a case that isn't on my list: someone posts at 8am that the bakery will be sold out of bread by noon, everyone in the village reads the post, everyone rushes out, and it is indeed sold out by noon. Was that one already true at 8am? And while you're at it: on your account, what are the correct house rules for the Back Book — should we keep it at all?
