answer: |-
  There is no single canonical term in the literature that captures this exact argumentative shape. It is discussed frequently—under headings like "Ontological Relativity," "The Model-Theoretic Argument," "The Problem of the Criterion," or "Absolute Generality"—but usually as a problem *within* those debates rather than as a named structural unit itself.

  The closest existing labels are **"Meta-theoretic Exemption"** (descriptive) or **"Scope-Indexed Skepticism"** (functional). Neither is a standard dictionary term in logic, but both are immediately intelligible to your audience.

  Since you asked to carve the thing rather than just label it, here is a definition designed for a handout, followed by answers to your four sorting questions and a critique of the carving itself.

  ### The Carving: Meta-theoretic Exemption

  **Definition:**
  A **Meta-theoretic Exemption** occurs when a skeptical conclusion $C$ (e.g., "domain $D$ is indeterminate") is derived using a set of background resources $R$ (e.g., a meta-theory, a logic, a notion of proof), where:
  1.  **Universality Claim:** $C$ is stated as a universal or general fact about $D$ (implying no part of $D$ is determinate).
  2.  **Implicit Exemption:** The derivation of $C$ treats $R$ as determinate/secure.
  3.  **Scope-Relativity:** The scope of $C$ is inversely proportional to the size of $R$. If $R$ is expanded to include the resources used to state $C$, the skepticism widens; if $R$ is restricted to preserve $C$'s assertability, the skepticism narrows.
  4.  **Non-Reflexivity:** $C$ does not apply to $R$. Unlike a self-refuting claim (which contradicts itself), $C$ simply fails to reach the standpoint from which it is uttered.

  **The "Exchange Rate":**
  The disagreement between proponents and critics is not about the formal derivation but about the **Cost of Skepticism**: how much meta-theoretic security ($R$) must be purchased to state the skepticism ($C$), and whether that purchase invalidates the skepticism.

  ---

  ### Addressing Your Four Sorting Questions

  **1. Is there an established concept for the scope-setting structure?**
  Not as a standalone noun. The structure is usually submerged in specific debates.
  *   In set theory, it appears in discussions of **Skolem's Paradox** (specifically the "Skolemist's Dilemma").
  *   In metaphysics, it is the core of **Hilary Putnam's Model-Theoretic Argument against Realism** (critics argue Putnam exempts his own reference to "models").
  *   In epistemology, it is structurally identical to **The Problem of the Criterion** (Chisholm): you need a method to identify truths, but truths to identify the method.
  *   In semantics, it is the **"Contextualist Escape Hatch"**: truth is context-sensitive, except for this claim about context-sensitivity.
  *   *Recommendation:* For your handout, **"Meta-theoretic Exemption"** is the most precise descriptive label. It avoids the baggage of "Relativism" (which implies a doctrine) and focuses on the *move*.

  **2. It isn't self-undermining (contradictory); it just fails to reach itself. Is there a term for that?**
  The literature on self-refutation often swallows this, but there is a distinction.
  *   **Performative Contradiction:** "I am not speaking." (The act falsifies the content).
  *   **Self-Exemption / Non-Reflexivity:** "No statement is true." (Except this one).
  *   In formal logic, this is sometimes called **"Non-Self-Applicability."**
  *   In critical theory (e.g., Habermas/Apel), this is a **"Performative Consistency"** issue (you *must* exempt certain norms to argue at all).
  *   *Distinction:* Self-refutation is a logical error ($P \to \neg P$). Meta-theoretic Exemption is a **structural feature** of hierarchical systems. It is not necessarily a bug; it may be the price of admission.

  **3. It isn't a hierarchy (Tarski), because the stopping point is arbitrary.**
  Correct. In a Tarskian hierarchy, the levels are ordered ($L_0, L_1, L_2...$). In Meta-theoretic Exemption, the level is **indexed to the speaker's needs**.
  *   This is better described as **"Arbitrary Stratification"** or **"Standpoint Relativity."**
  *   The Tarski hierarchy solves the paradox by banning self-reference. Meta-theoretic Exemption *allows* the statement but hides the standpoint.
  *   *Key difference:* A hierarchy is a *solution* to paradox. Meta-theoretic Exemption is the *shape* of the unresolved tension.

  **4. It isn't the formal fact (non-categoricity); it's the *use* of the fact.**
  Precisely.
  *   **Formal Fact:** "First-order theories of arithmetic have non-standard models." (Neutral).
  *   **The Use:** "Therefore, 'natural number' is indeterminate." (Skeptical).
  *   **The Exemption:** "...except for the numbers I used to prove the theorem."
  *   The object you are after is the **Rhetorical Leverage** gained from the formal fact. You might call this **"Skeptical Leverage."**

  ---

  ### Boundary Cases

  To help your students spot the shape, use these cases:

  **1. Clear Instance (The Skolem Move):**
  *   *Claim:* "Uncountability is relative to the model; there are no absolute uncountable sets."
  *   *Resources:* Proved using standard finitary reasoning in a meta-theory that assumes a fixed domain of integers to count the model's elements.
  *   *Exemption:* The integers used in the meta-theory are treated as absolute, even though the conclusion says cardinality is relative.
  *   *Verdict:* **Yes.** This is the paradigm case.

  **2. Clear Non-Instance (Gödel's Incompleteness):**
  *   *Claim:* "There are true arithmetic sentences unprovable in system $F$."
  *   *Resources:* Finitary meta-reasoning.
  *   *Exemption?* No. Gödel does not claim "Truth is indeterminate." He claims "Provability is incomplete." He does not use truth to deny truth; he uses truth to limit provability. The meta-theory is not exempted from a skeptical conclusion because no skeptical conclusion about the meta-theory is drawn.
  *   *Verdict:* **No.** This is a limitative result, not a skeptical exemption.

  **3. Borderline Case (Tarski's Undefinability):**
  *   *Claim:* "Truth for language $L$ cannot be defined in $L$."
  *   *Resources:* A meta-language $L+1$.
  *   *Exemption:* We assume truth is well-defined in $L+1$.
  *   *Verdict:* **Maybe.** If the arguer says "Therefore, Truth is ineffable," it is an Exemption. If the arguer says "Therefore, we need a hierarchy," it is a Structural Solution. Your intuition that the "bottom level is declared healthy" fits the Exemption shape is correct *if* the hierarchy is treated as a stopper rather than a ladder.

