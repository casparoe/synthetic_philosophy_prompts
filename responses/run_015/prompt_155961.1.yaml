answer: |-
  Your observation is astute: you have identified a bureaucratic sedimentation of Logical Empiricism. The two-stage procedure you describe is not merely analogous to Carnap's philosophy; it is an institutional instantiation of the distinction between **internal** and **external questions** found in his later work (most notably *Empiricism, Semantics, and Ontology*, 1950), filtered through the mid-century technocratic optimism of the Unity of Science movement.

  To answer your specific queries: Yes, the architecture presupposes a Carnapian distinction. Yes, the specific *labeling* of untranslatable inputs as "non-cognitive" presupposes a non-cognitivist meta-ethics. However, the *procedural form* itself does not strictly require non-cognitivism, though it requires a specific conception of rationality. Whether this betrays Carnap depends on where the power to define the "translation manual" resides.

  Here is a reconstruction of the implicit philosophical commitments, an analysis of their fidelity to Carnap, and an assessment of whether a cognitivist institution could adopt this form.

  ### 1. The Carnapian Isomorphism: Internal vs. External

  The planning procedure maps almost perfectly onto Carnap's distinction between internal and external questions.

  *   **The Matrix as Linguistic Framework:** For Carnap, to exist or to be true is always relative to a linguistic framework (e.g., the framework of numbers, of physical things, of propositions). In your planning documents, the "standardized evaluation matrix" functions as this framework. It defines what entities exist (costs, risks, utilities) and what rules govern them (zoning compatibility, maximization algorithms).
  *   **Stage 2 as Internal Questions:** Once the framework is accepted, questions like "Does Option A maximize utility?" are *internal questions*. They are answered using the logical and empirical rules of the framework. Carnap argued these are cognitive and answerable by scientific methods. The planning board treats this stage as "purely internal" and technical, which is faithful to Carnap.
  *   **Stage 1 (Voting) as External Questions:** The choice to adopt the matrix itself (or the specific weights within it) is an *external question*. For Carnap, external questions are not theoretical (true/false) but practical (expedient/inefficient). They are decisions about which language to speak. The planning board routes these to a "political vote," treating them as practical decisions rather than scientific discoveries.

  **Verdict:** The institutional architecture presupposes that rationality is framework-relative. It assumes there is no "God's eye view" to judge the matrix from the outside; one must first choose the matrix (politically) to judge the options (technically).

  ### 2. Meta-Ethical Commitments: Non-Cognitivism vs. Incommensurability

  You ask whether the practice presupposes that value judgments cannot function as premises in the rational stage, or if it could be sustained by a view that treats values as cognitive but incommensurable.

  **The Strict Requirement (Operational Commensurability):**
  The procedure strictly requires that *within Stage 2*, all values must be **commensurable**. To run a maximization algorithm, disparate values (safety, beauty, profit) must be reduced to a common denominator (utility points, dollars). This is not necessarily non-cognitivism; it is a requirement of **instrumental rationality**.

  **The Labeling (Non-Cognitivism):**
  However, the specific administrative move to mark untranslatable inputs as **"non-cognitive"** is a distinctively Logical Empiricist (and non-cognitivist) commitment.
  *   **Logical Empiricism:** Claims about "irreplaceable character" or "rights of future generations" are deemed metaphysical or emotive. They lack truth conditions within the physicalist framework. Hence, they are routed to the "political vote" as expressions of preference, not claims of fact.
  *   **Cognitive Incommensurability:** A moral realist or pluralist (e.g., a follower of Isaiah Berlin or Thomas Nagel) could argue that these claims *are* cognitive (they are true or false) but that the truths they express cannot be weighed against each other on a single scale.

  **Can a Cognitivist Adopt This Form?**
  Yes, but they must alter the *semantic labeling*, not the *procedure*.
  *   **The Contradiction:** A cognitivist contradicts themselves if they accept the label "non-cognitive" for moral claims.
  *   **The Resolution:** A cognitivist could adopt the two-stage procedure as a mechanism of **epistemic humility**. They could argue: "These value claims are cognitive, but we lack a rational method to adjudicate between conflicting foundational frameworks. Therefore, we vote on the framework (Stage 1) not because the claims are meaningless, but because the conflict is rationally underdetermined. Once the framework is chosen, we use reason to implement it (Stage 2)."
  *   **Distinction:** The procedure requires **procedural separation** (choice of ends vs. choice of means), but it does not strictly require **ontological non-cognitivism**. It only requires that the institution treats the *selection* of ultimate values as outside the scope of technical optimization.

  ### 3. Fidelity to Carnap's Vision: Realization or Betrayal?

  Carnap's vision for social planning was aligned with Otto Neurath's: science should guide social engineering, but the *ends* must be determined democratically. Carnap wrote in *The Logical Syntax of Language* that logic is a "tool" and the choice of syntax is a matter of "convention."

  **Where it Realizes Carnap:**
  *   **Anti-Metaphysics in Administration:** It prevents technical paralysis. By refusing to debate the "truth" of the watershed's sanctity during the optimization phase, it allows action to proceed based on agreed-upon rules.
  *   **Democratic Ends:** By routing framework choices to a vote, it acknowledges that science cannot dictate values. This aligns with Carnap's rejection of authoritarian metaphysics.

  **Where it Betrays Carnap (The Technocratic Drift):**
  The danger lies in the **Translation Stage**.
  *   **The Power of the Translator:** Carnap's *Principle of Tolerance* suggests we should be open to various linguistic frameworks. However, in your planning documents, the *planners* define the translation matrix. If the matrix is rigged such that "irreplaceable character" *cannot* be translated without losing its meaning (e.g., forcing it into a dollar value), the planners have effectively vetoed the external vote.
  *   **The "Non-Cognitive Ghetto":** If inputs routed to the "political vote" are systematically overridden by the "technical necessity" of the matrix, the separation is illusory. Carnap worried about the authoritarian imposition of frameworks. If the administrative mandate fixes the matrix (Stage 2) so rigidly that the political vote (Stage 1) becomes a rubber stamp, the institution has turned Carnap's pragmatic external questions into dogmatic internal ones.
  *   **Hidden External Questions:** Often, technical parameters (e.g., a discount rate for future generations) look like internal mathematical choices but are actually external ethical decisions. If these are hidden in Stage 2 rather than voted on in Stage 1, the procedure betrays Carnap's demand for clarity about what is conventional vs. what is empirical.

  ### 4. Reconstructing the Implicit Commitments

  To make this two-stage procedure seem coherent, the institution relies on three specific philosophical commitments:

  1.  **Meaning as Operationalizability:** A claim is administratively meaningful only if it can be mapped onto a variable in the evaluation matrix. This is a bureaucratic version of the Verification Principle. Claims that resist mapping are treated as "noise" or "preference" rather than "data."
  2.  **Value as Exogenous Input:** Values are not discovered through the planning process; they are inputs supplied from outside (by the vote). Rationality is purely instrumental (Humean/Lewisian). It can tell you how to get there, not where to go.
  3.  **Rationality as Maximization:** The scope of rational deliberation is limited to optimization problems. Deliberation about the *weights* of the optimization function is classified as "political" rather than "rational."

  ### 5. Conclusion: Can a Cognitivist Institution Use This?

  A planning institution committed to the **cognitive status of value claims** could adopt this procedural form without contradiction, provided they make two critical adjustments:

  1.  **Reclassify the "External" Vote:** Do not label the framework selection as "non-cognitive preference." Label it as **"Foundational Normative Selection."** Acknowledge that the vote is choosing between competing *truths* or *obligations* that cannot be simultaneously satisfied, not merely between tastes.
  2.  **Open the Translation Key to Vote:** Ensure that the definition of the matrix itself (what counts as a cost, what counts as a risk) is subject to the Stage 1 vote. A cognitivist must insist that if a value claim is cognitive (e.g., "This watershed has rights"), the framework must be capable of recognizing those rights, not just pricing them. If the matrix cannot accommodate the claim, the matrix is deficient, not the claim.

  **Summary:**
  The procedure you found is a "zombie" of Logical Empiricism: it retains the body (the internal/external structure) but often lacks the soul (the Principle of Tolerance and democratic vigilance). It is consistent with Carnap's *logic*, but it risks violating his *ethics of science* if the technical stage encroaches on the political stage. A cognitivist can inhabit this architecture, but they must dismantle the "non-cognitive" signage and treat the framework choice as a tragic selection between incompatible goods, rather than a mere aggregation of preferences.
