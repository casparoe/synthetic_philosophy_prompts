prompt: |-
  I cover science and ideas for a mid-size outlet, and I've been chewing on something a friend from grad school mentioned once — Good's theorem on the value of information, the result (I.J. Good, 1960s something-or-other, I never read the original) that free information can't have negative expected value for someone who maximizes expected utility coherently, and, more usefully for me, that a piece of information is worth nothing unless it could change what you'd actually do. I want to turn that into something I can run, because my real problem isn't "should I believe this study," it's "should I wait for one more thing before I file." This comes up maybe twice a week: I have a draft, a deadline six to twenty hours out, a standards editor who has to sign off on anything carrying a health or risk claim, and one or two calls I could still make — the study's statistician, a second lab that isn't in the press release, the agency press office. Everyone in my newsroom has an opinion and they're all vibes ("it can't hurt to check one more source"), and I'd like an actual procedure with a fixed order of questions and defined stopping points instead of that.

  Here's the wrinkle I keep getting stuck on, and I want it handled head-on rather than smoothed over. When I do the extra reporting, half the time what changes isn't the claim but the verb: "shows" becomes "suggests," "doubles the risk" becomes "is associated with a higher risk." I've started calling this the hedge sink — information whose entire effect is to soften the hedging language rather than the content. Taken naively, Good's theorem says that information was worthless, since my publish/don't-publish decision was never going to flip on it. But the hedge is an action I take, and what readers do (do they stop taking the thing, does the agency open a review) turns on it, and once you let hedges count as actions it feels like any scrap of information can change some action and the theorem stops biting. So should the procedure count a change of verb as a change of action? If it does, what's left of the discipline? My half-baked thought is a two-decision rule — value the information against my filing decision and separately against the downstream reader's or regulator's decision, and treat it as the interesting case when those two disagree — but I don't trust it and I'd rather have something I can defend to my editor.

  So: give me a decision procedure, in words, that a reporter with no stats training can run in under an hour, on the back of an envelope if need be. It should spell out what to write down first (I'm guessing: name the decision the information is supposed to change before you go get it), what counts as a sufficient answer to each question, where it stops with "file now," where it stops with "wait," where it hands the decision to my editor because it's a values question rather than a factual one (how bad a false alarm is relative to a missed harm is not mine to settle), and where it simply doesn't work. Two things it definately has to handle: scoop risk, meaning if I wait for the replication a competitor may file first and my information becomes worth approximately nothing because the public conversation already moved without me; and the fact that my "second source" usually isn't independent — same lab, same funder, same press release feeding four outlets — which I suspect makes the value of that extra call much smaller than it feels. Then run the procedure on three cases: (a) a preprint, n=23, linking a common sleep supplement to elevated liver enzymes, with a rumor that a bigger outlet already has it; (b) a leaked draft of a government risk assessment for an industrial solvent, where the final version is due in nine days and might well come out softer; and (c) a piece I've spent three weeks on and love, where I'm dying to make one more call to the lead author — I want to see the procedure tell me something I don't want to hear, so if it concludes that call is theater, say so plainly. Finally, be straight with me about what the procedure can't do: is this just expected-value bookkeeping with a reporting-shaped paint job, or does it catch something my newsroom intuition actually misses?
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the User and Request:**
      *   **User:** Science journalist for a mid-size outlet. Experienced, deadline-driven, skeptical of "vibes."
      *   **Core Problem:** Deciding whether to file a story now or wait for more reporting (one more call, one more study, etc.).
      *   **Theoretical Anchor:** I.J. Good's Theorem on the Value of Information (VOI). Specifically, the idea that information is only valuable if it can change a decision.
      *   **The "Wrinkle":** The "Hedge Sink." Information often doesn't change the *decision to publish*, but changes the *hedging language* (e.g., "shows" vs. "suggests"). Does this count as a decision change? If yes, does VOI lose its bite?
      *   **Requirements:**
          *   A concrete decision procedure (words, under 1 hour, back-of-envelope).
          *   Must define what to write down first.
          *   Must define stopping points (File Now, Wait, Escalate to Editor, Procedure Fails).
          *   Must handle "Scoop Risk" (competitors filing first).
          *   Must handle "Non-Independent Sources" (same lab/funder).
          *   Must run on three specific cases (a, b, c).
          *   Must be honest about limitations (is this just EV bookkeeping?).
      *   **Tone:** Professional, direct, respectful of the craft, no fluff.

  2.  **Deconstruct Good's Theorem in this Context:**
      *   Good's Theorem: $E[V(I)] \ge 0$. Information has non-negative expected value *if* you act optimally on it.
      *   The Journalist's Constraint: Deadlines. Time is a cost.
      *   The "Hedge Sink" Problem: If the decision is binary (Publish/Don't), hedging doesn't count. If the decision is continuous (How strongly to assert), hedging *does* count.
      *   *Solution:* We need to define the "Action Space" carefully. The action isn't just "File." It's "File with Claim X."
      *   *Refinement:* To keep the discipline, we need to distinguish between *substantive* changes (kill the story, change the lead finding) and *tonal* changes (hedging). The procedure needs to weigh the cost of being wrong against the cost of being scooped/late.

  3.  **Drafting the Procedure (The "Good's Law for Reporters"):**
      *   *Step 1: Define the Decision.* Not "Should I call?" but "What specific sentence/claim am I unsure about?"
      *   *Step 2: Define the Alternative.* If the call goes badly, what do I write instead? (The "Pre-commitment").
      *   *Step 3: Estimate Probability.* How likely is the new info to flip the claim?
      *   *Step 4: Assess Cost of Waiting.* Scoop risk, deadline risk.
      *   *Step 5: Assess Cost of Error.* Harm to readers vs. harm to reputation.
      *   *Step 6: The Independence Check.* Is the new source actually new info?

      *Addressing the "Hedge Sink":* I need to validate the user's intuition. A verb change *is* an action change, but it's a low-value one. The procedure should force the reporter to ask: "If I change this verb, does it materially alter the reader's behavior?" If no, it's noise. If yes (e.g., regulatory trigger), it's signal.
      *Decision:* Let's make the "Action" the *strength of the claim*. But to prevent the theorem from becoming useless, we set a threshold. A verb change only counts if it crosses a specific threshold of certainty (e.g., from "causes" to "linked to").

      *Addressing Scoop Risk:* This is the cost of delay ($C_{delay}$).
      *Addressing Non-Independence:* This lowers the probability ($P_{flip}$) that the info changes anything.

  4.  **Refining the Procedure Steps (Iterative Polish):**
      *   *Name:* The VOI-Deadline Protocol.
      *   *Input:* The specific claim in doubt.
      *   *Test 1 (Independence):* Is the new source correlated with the old one? If yes, discount value heavily.
      *   *Test 2 (The Flip):* Can this info kill the story or force a retraction? (High Value). Or just soften a verb? (Low Value).
      *   *Test 3 (The Cost):* What do I lose by waiting 4 hours? (Scoop, Deadline).
      *   *Test 4 (The Editor Handoff):* If the trade-off is between "Public Safety" and "Being First," that's an ethical call, not a math call.

  5.  **Developing the Three Cases:**
      *   *(a) Sleep Supplement Preprint:* High harm potential (liver), low n, scoop risk high.
          *   *Analysis:* Independence low (same preprint). Flip probability low (won't kill story, might hedge). Cost of waiting high (scoop).
          *   *Verdict:* File with heavy hedging now. Don't wait.
      *   *(b) Leaked Govt Draft:* High stakes, defined timeline.
          *   *Analysis:* Waiting has a defined end (9 days). Leak might be inaccurate.
          *   *Verdict:* Wait if possible, or file "Leak suggests..." with clear caveat. Actually, the procedure should highlight that waiting 9 days is impossible for news, but filing on a leak has reputational risk. This is an Editor handoff.
      *   *(c) The Pet Project:* Emotional attachment.
          *   *Analysis:* One more call to lead author. Independence = Zero (they are the source). Flip probability = Near Zero (they won't contradict themselves).
          *   *Verdict:* Theater. File.

  6.  **Addressing the "Hedge Sink" Philosophically:**
      *   The user is right to worry. If *any* verb change counts, VOI is trivial.
      *   *Fix:* Distinguish between *Operational Hedges* (affects reader action/regulatory trigger) and *Cosmetic Hedges* (covers ass, changes nothing).
      *   *Rule:* A verb change only counts as "Value" if it changes the *inference* a reasonable reader draws. "Suggests" vs "Shows" often doesn't change public behavior. "Linked" vs "No Link" does.

  7.  **Addressing the Limitations:**
      *   Is this just EV bookkeeping? Yes. But the value is the *discipline of pre-commitment*. It stops emotional reasoning ("I feel like I should call").
      *   It doesn't solve the "unknown unknowns."
      *   It doesn't solve the ethical weight of harm.

  8.  **Final Review against Constraints:**
      *   Under 1 hour? Yes, it's a checklist.
      *   Back of envelope? Yes.
      *   Handles Scoop Risk? Yes (Cost of Delay).
      *   Handles Non-Independence? Yes (Correlation Discount).
      *   Handles Hedge Sink? Yes (Operational vs. Cosmetic).
      *   Three cases run? Yes.
      *   Honest about limitations? Yes.

  9.  **Drafting the Content (incorporating the voice):**
      *   Use newsroom vernacular ("file," "spike," "hold," "nut graf").
      *   Be direct about the "Hedge Sink."
      *   Ensure the "Editor Handoff" is clear for value judgments.

      *(Self-Correction during drafting)*: I need to make sure I don't just say "calculate expected value." The user said "no stats training." I need to translate EV into "Weighted Questions."
      *   Instead of $P \times V$, use "Likelihood" and "Impact."
      *   Make the "Independence Check" a hard gate. If the source isn't independent, the value is near zero.

      *(Refining the Hedge Sink)*: I will propose a specific test: "The Reader Action Test." If the verb changes, does the reader do something different? If no, it's cosmetic.

      *(Refining Case B)*: A leaked draft is tricky. If I wait 9 days, I miss the news. If I file now, I might be wrong. The procedure should flag this as a "Policy Decision," not a VOI decision.

      *(Refining Case C)*: This needs to be the "hard truth." Calling the source you already quoted to ask if they're sure is useless.

  10. **Final Polish:** Check tone. Ensure it sounds like a tool for a professional, not a lecture. (Proceed to generate output).

  **(Post-Drafting Check):** Did I answer the specific question about Good's Theorem and the Hedge Sink?
  *   Yes, by distinguishing between *Decision to Publish* and *Strength of Claim*, but adding the constraint that the Strength of Claim must alter *Reader Inference* to count as Value. This preserves the "bite" of the theorem.

  Let's write it.cw
answer: |-
  Here is a decision procedure designed for your constraints. It translates Good's Theorem into newsroom mechanics without requiring you to calculate expected utility in utils. It treats "hedging" not as a free variable, but as a specific type of action with its own value threshold.

  ### The VOI-Deadline Protocol
  **Time required:** 15–45 minutes.
  **Tools:** One sheet of paper, four headings.

  #### Phase 1: Pre-Commitment (Write this down first)
  Before you make the call or wait for the email, you must define the *Decision Node*. Good's Theorem breaks if you move the goalposts after seeing the data.

  1.  **The Claim:** Write the specific sentence or claim in your draft that is causing anxiety. (e.g., *"Supplement X doubles liver risk."*)
  2.  **The Alternative:** Write the exact sentence you will publish if the new information contradicts or weakens the claim. (e.g., *"Supplement X is associated with liver markers in a small study."*)
      *   *Constraint:* If you cannot write the Alternative sentence, you are not seeking information; you are seeking reassurance. **Stop. File as is.**
  3.  **The Trigger:** Define what specific piece of info flips you from Claim to Alternative. (e.g., *"If the statistician says the p-value is uncorrected for multiple comparisons."*)
      *   *Constraint:* Vague triggers ("if I get a bad vibe") are invalid.

  #### Phase 2: The Independence & Scoop Check
  This handles your two specific wrangles: non-independent sources and scoop risk.

  4.  **The Correlation Discount:** Look at the source you intend to contact.
      *   Are they from the same lab, funded by the same grant, or working from the same preprint as your primary source?
      *   **Yes:** Apply a 90% discount to the value of this call. They share the same blind spots.
      *   **No:** Proceed.
  5.  **The Scoop Cost:** Estimate the probability a competitor files in the waiting window (e.g., 4 hours).
      *   If >50%: The cost of waiting is losing the story entirely.
      *   **Rule:** If Scoop Cost is High AND Correlation Discount is High, **File Now.** Information that arrives after the conversation has moved is worth zero.

  #### Phase 3: The Hedge Sink Test
  This addresses your worry that verb changes make the theorem toothless. We distinguish between *Cosmetic Hedging* and *Operational Hedging*.

  6.  **The Reader Action Test:** If you change the verb from your Claim to your Alternative (e.g., "causes" → "linked to"), does a reasonable reader change their behavior?
      *   **No (Cosmetic):** The average reader treats "linked" and "causes" as the same warning. This is reputational insurance for you, not information for them. **Value = 0.**
      *   **Yes (Operational):** The change alters a regulatory threshold, a clinical guideline, or a specific consumer choice (e.g., "avoid" vs. "consult doctor"). **Value > 0.**
      *   *Discipline:* If the result is Cosmetic Hedging, you are not gathering news; you are managing liability. That is an editor's call, not a reporting one.

  #### Phase 4: The Stop/Wait/Escalate Matrix
  Combine the outputs above.

  *   **FILE NOW:**
      *   Correlation Discount is High (Source isn't independent).
      *   OR Scoop Cost is High (Competitor likely to beat you).
      *   OR Hedge Sink Test is "Cosmetic" (Verb change doesn't alter reader action).
  *   **WAIT (Set a hard timer):**
      *   Source is Independent.
      *   Hedge Sink Test is "Operational" (Claim strength changes reader behavior).
      *   Scoop Cost is Low.
      *   *Action:* Set a hard deadline (e.g., "I file at 4 PM regardless").
  *   **ESCALATE TO EDITOR:**
      *   The trade-off is between "Being First" and "Risk of Harm."
      *   Example: Filing now might cause panic; Waiting might mean no one hears a warning.
      *   *Why:* This is a value judgment (False Positive vs. False Negative cost), not a factual one. Good's Theorem cannot solve ethical trade-offs.
  *   **PROCEDURE FAILS:**
      *   You cannot define the "Alternative" sentence (Phase 1).
      *   You cannot define the "Trigger" (Phase 1).
      *   *Meaning:* You are procrastinating. File.

  ***

  ### Running the Procedure on Your Cases

  #### Case A: The Sleep Supplement Preprint (n=23, Liver Enzymes)
  *   **Claim:** "Supplement X elevates liver enzymes."
  *   **Alternative:** "Supplement X linked to enzymes in small, preliminary study."
  *   **Correlation Discount:** You are calling the study's statistician or a second lab not in the release.
      *   Statistician: **High Correlation.** (They worked on the paper). Discount 90%.
      *   Second Lab: **Low Correlation.** But can they replicate in 6 hours? No.
  *   **Scoop Cost:** Rumor says bigger outlet has it. **High.**
  *   **Hedge Sink Test:** Does "elevates" vs. "linked" change reader action?
      *   For a supplement? Probably not. Readers usually stop taking it on any hint of risk. **Cosmetic.**
  *   **Verdict:** **FILE NOW.**
      *   *Reasoning:* The extra call is likely non-independent (statistician) or impossible to complete meaningfully (replication) before you are scooped. The verb change is cosmetic regarding consumer safety. Write the story with heavy hedging in the text, but do not delay publication for a call that won't change the headline or the reader's choice.

  #### Case B: Leaked Government Risk Assessment (Solvent, 9 Days out)
  *   **Claim:** "Government to classify Solvent Y as high risk."
  *   **Alternative:** "Draft assessment suggests Solvent Y may be high risk; final ruling pending."
  *   **Correlation Discount:** Leak vs. Final Document. **High.** The leak *is* the document, but it is not final.
  *   **Scoop Cost:** Low. No one else has the leak. But waiting 9 days kills the news value.
  *   **Hedge Sink Test:** **Operational.** Industry compliance and regulatory reviews trigger on the *final* classification, not the draft. Publishing the draft as fact could cause market harm or premature panic.
  *   **Verdict:** **ESCALATE TO EDITOR.**
      *   *Reasoning:* This is not a VOI problem; it is an ethics problem. The value of information (the final report) is high, but the cost of delay (9 days) is unacceptable for news. The trade-off is "Accuracy/Non-interference" vs. "Public Right to Know." You cannot calculate this. Your editor must decide if the outlet is willing to risk being wrong on a regulatory claim for the sake of the scoop.
      *   *Procedure Note:* If the editor says "File," you must use the Alternative sentence strictly. Do not write "Government classifies..." Write "Leaked draft proposes..."

  #### Case C: The Pet Project (3 Weeks, One More Call to Lead Author)
  *   **Claim:** [Your big finding/thesis].
  *   **Alternative:** [A weaker version of your thesis].
  *   **Correlation Discount:** **100%.** You are calling the lead author. They are the source of the claim. They will not contradict themselves on the record 3 weeks later unless forced.
  *   **Scoop Cost:** Low. You've had it for 3 weeks.
  *   **Hedge Sink Test:** Likely **Cosmetic.** You want to hear them say they are "confident" so you can write "shows" instead of "suggests."
  *   **Verdict:** **PROCEDURE FAILS / FILE NOW.**
      *   *Reasoning:* This is theater. You are not seeking information that could change the decision; you are seeking validation to reduce your own anxiety. The source is maximally correlated with the existing text. The call has zero expected value for the reader. It is a comfort call. File the story.

  ***

  ### What This Procedure Can't Do (The Honest Assessment)

  You asked if this is just expected-value bookkeeping with a reporting-shaped paint job.

  **Yes, it is.** And that is its strength and its limit.

  1.  **It Cannot Value "Unknown Unknowns":** Good's Theorem assumes you know the *space* of possible answers. In reporting, the value is often in finding a question you didn't know to ask. This procedure optimizes for *answering* known questions, not *finding* new ones. It protects you from procrastination, not from blind spots.
  2.  **It Cannot Solve the "Hedge Sink" Philosophy Completely:** I forced a distinction between Cosmetic and Operational hedging. In reality, that line is blurry. "Suggests" might save a company from a lawsuit even if readers ignore it. The procedure forces you to admit that if the only value is legal cover, that's an editor's risk calculation, not a reporter's news judgment.
  3.  **It Assumes Rational Actors:** The procedure assumes you will stick to the "Alternative" sentence if the trigger is met. In the heat of a deadline, you might get the info, see it's messy, and file the original Claim anyway. The procedure requires editorial discipline to enforce the Pre-Commitment.

  **What it catches that intuition misses:**
  Newsroom intuition is optimized for *completeness* ("I should check everything"). Good's Theorem is optimized for *marginal utility*. Your intuition tells you that more reporting is always better. This procedure forces you to acknowledge that **more reporting is often just expensive reassurance.**

  It stops you from making the call in Case C. It stops you from waiting in Case A. It forces the hard conversation in Case B. That is worth the price of admission.
