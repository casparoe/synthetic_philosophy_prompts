prompt: |-
  im putting together a session for an upper-level seminar (14 people, 75 min) on whether moral revolutions are driven by argument, interest, or honor. im especially interested in the williams/appiah line that norms like dueling or slavery can collapse because honor shifts, not because anyone was convinced. design an in-class game or role-play that makes students feel this. they should be members of a fictional 'contract guild' with a norm: if someone publicly corrects your ledger, you must either issue a formal challenge (costs status, risks trade exile) or apologize (costs face). initially the payoff matrix should make defending honor the dominant strategy even when everyone secretly hates the norm. then introduce an external rule-change (like state-backed arbitration) that suddenly makes trade exile cost more than honor loss, and watch them abandon the challenge ritual without ever revising their private moral judgments. i need: specific roles (maybe merchant, scribe, arbitrator), rules that run without me lecturing, a timeline, small stakes (like candy or points), the debrief mapping the shift onto williams/appiah, an honest note on what the simulation cant reproduce (like centuries of shame or real violence), and a prediction of what will definatly go wrong the first run. no reading lists or citations please -- just the activity. also maybe include a twist where one student is secretly assigned to argue morally against the norm, and the group ignores them, to show that argument isnt the engine.
