answer: |-
  # Activity: The Guild of the Silver Ledger

  **Class Size:** 14 Students
  **Time:** 75 Minutes
  **Materials:** 
  *   14 Role Cards (13 "Merchant," 1 "Reformer" – see below)
  *   Candy or small prizes (the "Currency")
  *   Whiteboard (for the "Ledger of Shame")
  *   A coin (for Challenge resolution)
  *   Printed "Error Slips" (small pieces of paper saying "LEDGER ERROR")

  ---

  ## 1. Setup & Roles (10 Minutes)

  **Distribution:**
  Hand out Role Cards face down. Tell students not to reveal their role to anyone.

  *   **13 Merchant Cards:** 
      *   *Goal:* Maximize your personal Candy score.
      *   *Private Thought:* "I think this Guild Code is stupid and stressful, but I need the candy."
      *   *Rule:* You must follow the **Code of Correction** (see below).
  *   **1 Reformer Card:** 
      *   *Goal:* Persuade the group that the Code is immoral and should be ignored.
      *   *Constraint:* Do **not** reveal you have a special role. Act like a normal Merchant. Make at least 3 moral arguments during the game.
      *   *Private Thought:* "This Code hurts people. We should stop."

  **The Code of Correction (Write on Board):**
  1.  **The Trigger:** If the Guild Scribe (Instructor) places an **Error Slip** on your desk, your honor is questioned.
  2.  **The Choice:** You must immediately choose:
      *   **A. DEFEND (Challenge):** Flip a coin. Heads = You keep all Candy. Tails = Lose 5 Candy. *Status: Maintained.*
      *   **B. YIELD (Apologize):** Automatically lose 2 Candy. *Status: Stained.*
  3.  **The Stigma:** If you **YIELD**, your name goes on the **Ledger of Shame** (Whiteboard). If your name appears 3 times, you are "Socially Exiled" (cannot earn Candy for the rest of the game).
  4.  **The Norm:** Everyone watches. If you do not choose A or B within 10 seconds, you lose 10 Candy.

  **Instructor Role:** You are the **Guild Scribe**. You are bureaucratic, cold, and enforce the Code. Do not explain *why* the Code exists. It just *is*.

  ---

  ## 2. Phase 1: The Honor Culture (20 Minutes)

  **Objective:** Establish the norm. Show that students will choose risky violence (Defend) over safe submission (Yield) to avoid social stigma, even if they privately dislike the norm.

  **Rounds 1-5:**
  1.  Walk around the room. Randomly place **Error Slips** on 5 different desks (ensure the Reformer gets one).
  2.  Announce: *"Error found. Correct your standing."*
  3.  Wait for their choice. 
      *   If they **Defend**: Flip the coin publicly. If they lose candy, act indifferent. *"The Code is satisfied."*
      *   If they **Yield**: Mark the Whiteboard loudly. *"Name recorded."*
  4.  **Reformer Twist:** When the Reformer gets an Error Slip (or during any deliberation), they will likely argue, *"Why are we doing this? It's wrong to fight over errors."* 
      *   **Your Response:** Ignore the moral argument. Say, *"The Code requires a choice. Defend or Yield. 10 seconds."*
      *   **Peer Pressure:** Other students will likely urge the Reformer to *"Just pick one, don't ruin the game."*
  5.  **Payoff Reality:** Most will choose **Defend**. The risk of losing 5 candy is worth avoiding the Whiteboard. They are acting out of Honor/Status, not because they believe the Error Slip is morally significant.

  **Mid-Phase Check (Minute 30):**
  Ask for a show of hands: *"Who privately thinks this Code is ridiculous?"* (Most hands will go up). *"Who chose Defend anyway?"* (Most hands will go up). 
  *Do not debrief yet. Reset the room.*

  ---

  ## 3. The Intervention: Rule Change (5 Minutes)

  **Announcement:**
  Stand up. Change your posture. You are no longer the Guild Scribe. You are the **State Arbitrator**.

  **New Decree:**
  *"The Guild is now under State Jurisdiction. The Code of Correction is amended effective immediately."*

  1.  **Defending (Challenging) is now Illegal:** If you choose to **Defend**, you are **Immediately Exiled**. You lose **ALL** Candy accumulated and cannot participate further. (The State monopolizes violence).
  2.  **Yielding is now Cheap:** If you **Yield**, you lose only **1 Candy**. 
  3.  **The Ledger of Shame is Abolished:** The Whiteboard is erased. No social stigma exists for Yielding. The State does not track honor, only compliance.

  **Instruction:** *"Continue the game. Maximize your Candy."*

  ---

  ## 4. Phase 2: The Interest Culture (20 Minutes)

  **Rounds 6-10:**
  1.  Place **Error Slips** on 5 new desks (include the Reformer again if possible).
  2.  Announce: *"Error found. Correct your standing."*
  3.  **Observation:** Students will immediately switch to **Yield**. 
      *   They will not debate morality.
      *   They will not defend their honor.
      *   They will quietly pay the 1 Candy tax.
  4.  **The Reformer's Failure:** The Reformer might say, *"See! We don't need the Code!"* 
      *   The other students will ignore them. They aren't Yielding because the Reformer convinced them; they are Yielding because the **State made Defending too expensive**.
      *   The moral argument remains irrelevant to the behavioral shift.

  **End Game:** Count Candy. Distribute prizes.

  ---

  ## 5. Debrief & Mapping (20 Minutes)

  **Step 1: The Behavioral Shift (5 mins)**
  *   Ask: *"Why did you stop Defending in Phase 2?"*
  *   Expected Answer: *"Because I would lose all my candy/get exiled."*
  *   Point: You didn't stop because you realized dueling was 'wrong.' You stopped because the incentive structure changed.

  **Step 2: The Reformer's Role (5 mins)**
  *   Ask the Reformer to reveal themselves. *"Did your moral arguments cause the shift?"*
  *   Ask the Merchants: *"Did you listen to the Reformer in Phase 1? Why not?"*
  *   Point: Moral argument is inert without a change in the social/incentive structure. The Reformer was ignored until the State changed the rules.

  **Step 3: Mapping to Theory (Williams/Appiah) (10 mins)**
  *   **Honor vs. Morality:** In Phase 1, you followed a script (Defend) to maintain social standing, not because you believed the 'Error' was a sin. This is the **Honor Code**. It governs behavior through shame and status, not deep ethical conviction.
  *   **The Collapse:** In Phase 2, the norm collapsed. Did your *moral view* of the Code change? No. You still think it's stupid (from Phase 1 check). But the **social confidence** in the norm evaporated because the State removed the payoff for honor.
  *   **Appiah's Point:** Moral revolutions (like ending dueling or foot-binding) often happen not because everyone reads a philosophy book and changes their mind, but because the social script becomes too costly or loses its prestige.
  *   **Williams' Point:** The "thick" ethical concept of Honor lost its grip when the social world that sustained it (the Guild) was overridden by a new structure (the State).

  ---

  ## 6. Limitations Note (Instructor Reference)

  *Be honest with the class about what this simulation fails to capture:*
  1.  **Time:** Real moral revolutions take generations. This took 40 minutes. Real shame is deep and psychological; this was just candy.
  2.  **Violence:** A "Challenge" here was a coin flip. Real duels involved death. The stakes of *actual* violence make the shift harder, not easier.
  3.  **Internalization:** In real history, people eventually *do* come to believe the new norm (slavery becomes not just illegal, but unthinkable). This sim only shows the *behavioral* shift, not the internal moral conversion that follows later.
  4.  **The Reformer:** In reality, reformers often suffer greatly. Here, they just lost a bit of candy.

  ---

  ## 7. Prediction: What Will Definitely Go Wrong

  **The "Meta-Game" Problem:**
  Students will treat this as a math puzzle, not a social simulation. They will calculate the expected value of the coin flip vs. the flat tax immediately.
  *   *Result:* They might not feel the "Honor" pressure in Phase 1 because the Whiteboard stigma feels fake.
  *   *Fix:* Lean hard into the social pressure. When someone Yields in Phase 1, pause. Look at the class. Say, *"Note: [Name] has Yielded."* Make it awkward. If you don't enforce the awkwardness, the Honor mechanic fails.

  **The Reformer Overplay:**
  The student with the Reformer card might be too aggressive and get shut down immediately, or too shy and say nothing.
  *   *Fix:* In the Reformer card instructions, add: *"You must speak up at least 3 times. If you stay silent, you fail your role."*

  **The Transition Confusion:**
  Students might think Phase 2 is a "new game" rather than the "same world, new rules."
  *   *Fix:* Emphasize during the Interlude: *"You are the same people. Your memories are the same. Only the Law has changed."*

  **The "Moral Conversion" Trap:**
  Students might argue in the debrief that they *did* change their minds in Phase 2.
  *   *Fix:* Challenge them. *"If I turned off the State Arbitrator right now and went back to Guild Rules, would you start Dueling again?"* (Most will say yes, proving their moral view didn't change, only their compliance).
