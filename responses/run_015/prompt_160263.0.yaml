  1. Chair: "Culture is what you invoke when you have no identification strategy," so where is the exogenous variation in salience rules that isn't just institutional selection? Concede the ratchet complicates isolation, hold that migration provides the counterfactual, but admit weakness in operationalizing the tacit rule independently of the outcome.

  2. Applied Micro: "If these rules only fix which considerations count as reasons, aren't they just stable preferences that should dissolve under strong enough price signals?" Concede values aren't immutable, hold that the ratchet structure explains persistence despite changing incentives, but weakness lies in specifying the threshold where material incentives override salience rules.

  3. Rational-Choice Sociologist: "You claim these rules are tacit yet causally efficacious, but without explicit sanctioning, how do you distinguish this from equilibrium selection in a coordination game?" Concede the mechanism overlaps with equilibrium selection, hold that transmission via household discipline distinguishes it, but weakness is explaining why agents don't deviate if the rule is tacit and costly.

  4. Applied Micro: "Your stylized case controls for institutions and credit, but how do you measure the salience rule independently of the reinvestment behavior it is supposed to cause?" Concede measurement is proxy-heavy, hold that account meticulousness is the observable trace, but weakness is the risk of circularity between the rule and the trace.

  5. Economic Historian: "If the pattern carries over into a different legal environment, why did it originate in that specific legal environment initially, and does this not contradict your ratchet structure?"—this is the hope nobody asks. Concede the origin story is the weakest link, hold that initial selection pressures differ from maintenance mechanisms, but weakness is the lack of historical evidence for the initial selection moment.
