      *   *Correction on Q2:* Be precise about "temporal novelty." In ML, we often use static datasets. True novelty requires *new* tasks or *new* data distributions not anticipated during design.
      *   *Correction on Decision:* Don't just say "kill it." Say "It is degenerating *by Lakatos's definition*, but might still be profitable." Distinguish scientific progress from product progress.
      *   *Tone Check:* Ensure I sound like someone who has actually shipped models. Use terms like "leakage," "SOTA," "ablation," "compute budget."

  5.  **Final Polish:** Check against all constraints.
