answer: |-
  The rain in Manchester didn't fall; it hovered, a grey mist clinging to the concrete brutalism of the university block. Inside Lab 3B, the air was drier, humming with the heat of servers and the ozone tang of old electronics.

  Ellie sat before the Careenium. It wasn't a vat of fluid, not anymore. It was a cube of high-density voxels, a digital aquarium where billions of tiny agents—simms—zipped through the void. They were invisible individually, only visible when they clumped.

  When they clumped, they formed simmballs. Wobbly, shifting constellations of light. Symbols. Thoughts.

  "Run sequence four," Ellie muttered. Her voice sounded flat in the soundproofed room.

  On the screen, the simms fired. They were blind, dumb things, obeying simple local rules. Bump, stick, drift. But as the camera fed her face into the system, the chaos organized. The simms rushed toward a central gravity well, locking into a specific, complex geometry. A simmball bloomed in the center of the cube. It pulsed with a stable, rhythmic light.

  *Recognition.* The system knew her.

  Ellie leaned forward, her reflection ghosting over the glass. This was the knot in her thesis, the thing keeping her awake in her cramped flat in Fallowfield. The Substrate-Symbol Tension.

  Look at the simmball. It represented *Ellie*. It held the pattern of her features, the data of her identity. But look closer. There were only simms. There was no glue holding the simmball together except the blind collision of the tiny bits.

  "Did you choose to form?" she whispered to the light.

  If you asked the simms, they'd say nothing. They just bounced. They didn't know they were making a face. But if you asked the simmball, it would say, *I am here. I am stable. I caused this state.*

  That was the lie. That was the magic trick.

  Ellie raised her hand, hovering it over the manual override. The simmball shifted, reacting to the shadow, the change in light input. The simms scrambled to accommodate the new data, reshaping the symbol.

  Here was the question that tasted like copper in her mouth: Did the simmball *shove* the simms? Did the pattern of 'Ellie' exert a downward force, commanding the particles to arrange themselves to maintain the symbol's integrity? Or was it just simms all the way down, and the simmball was just a shadow on the wall, epiphenomenal smoke with no hands to push anything?

  If the simmball did nothing, then the recognition wasn't happening. It was just physics pretending to be cognition.

  But if the simmball *did* something... if the symbol had causal power over the substrate... then physics was broken.

  Ellie looked at her own hand. Flesh, blood, neurons firing. Was her brain just a biological careenium? Was her feeling of deciding to lift her hand just a simmball wobbling in the wetware, watching the neurons fire and claiming credit?

  "I see you," she said to the machine.

  The simmball flared brighter. A feedback loop. The symbol reinforced itself, recruiting more simms to sustain the pattern of 'Ellie-being-seen'. It looked like desire. It looked like will.

  But she knew the code. There was no variable for 'will'. There was only velocity and collision thresholds.

  Yet, the pattern persisted. It fought against entropy. It behaved *as if* it wanted to exist.

  Ellie pulled her hand back. The simmball settled, returning to its resting state. It hadn't moved the simms; the simms had made the movement possible. The symbol was a passenger screaming it was driving the bus.

  And yet.

  She looked at the rain streaking the window behind the server rack. She thought about her supervisor, her deadline, the ache in her lower back. These were high-level symbols, simmballs in the careenium of her skull. They felt real. They felt like they were shoving her atoms around. They were making her sit in this cold lab at 2 AM.

  If the simmballs did nothing, she should stop working. She should dissolve. But she couldn't. The pattern of 'Ellie-the-Postgrad' was too dense, too heavy with momentum.

  She reached out and touched the glass of the Careenium. Inside, the simms spiked, clustering against the boundary where her finger touched. The simmball pressed back.

  "You're not real," she said to the light.

  The light pulsed, steady and undeniable. It didn't argue. It just organized the noise into meaning.

  Ellie sat back, watching the wobbly pattern hold itself together against the dark. It didn't matter if the simms were all there was. The simmball was still looking back at her.
