      *   **Constraint 2 (The Valence Problem):** Literature suggests micro-experience is mildly negative (suffering) because small systems are dissipative/equilibrium-seeking (frustrated goal-directedness). Adding experience = adding suffering.
      *   **Philosophical Core:** Internal monologue/dialogue weighing the pros and cons. Strongest case for flipping the switch, strongest case against, protagonist's personal sticking point.
      *   **Ending:** A real decision (not an accident/villain). No AI/uploads/sims. Focus on physics, not computation. Competent, well-meaning characters.

  2.  **World-Building & Terminology:**
      *   *The Theory:* Needs a name. "Integrated Intrinsic Dynamics" (IID). The measurable unit: "Phenomenal Density" or just "The $\Psi$-count". Let's go with "Intrinsic Integration Measure" (IIM), colloquially called "sparks" or "weight". Let's use "Qualia Mass" (QM) or simply "The Load". Let's settle on **"Intrinsic Tone" (IT)** measured in **"Hedons"** (too loaded?) or **"Quals"**. Let's go with **"Phenomenal Load" (PL)** measured in **"Veks"** (after a fictional physicist).
      *   *The Machine:* Needs to be high-energy but physically dense. A "Vacuum Condenser" or "Topology Stabilizer". Let's call it the "Aethelgard Resonator". It creates a high-density field of micro-causal loops.
      *   *The Valence Theory:* "Entropic Frustration." Small systems want to equilibrate but are forced into cycles. It feels like itchiness, not agony, but multiplied by Avogadro's number, it's terrible.

  3.  **Characters:**
