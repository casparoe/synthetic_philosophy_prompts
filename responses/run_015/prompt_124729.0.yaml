  4.  **Drafting - Scene by Scene:**

      *   **Scene 1: The Calibration.** Establish the setting. The machine is ready. The new metric is being displayed on the dashboard. Show, don't just tell, the numbers.
      *   **Scene 2: The Realization.** They run the simulation. The PL (Phenomenal Load) spikes. It's not just high; it's obscene.
      *   **Scene 3: The Debate.**
