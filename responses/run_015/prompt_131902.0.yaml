answer: |-
  ### The Northern Rock Run: A Rational Information Cascade Analysis

  The September 2007 run on Northern Rock stands as the first retail bank run in the UK in over 150 years. To analyze this through the lens of **rational information cascades** (specifically the Bikhchandani, Hirshleifer, and Welch [BHW] framework), we must treat depositors as sequential decision-makers who possess private information but derive inferential value from the observable actions of predecessors.

  Below is a disciplined mapping of the event against the canonical cascade logic, followed by an analysis of where the model holds, where it fractures, and what the termination of the run reveals about the underlying game structure.

  ---

  ### 1. Disciplined Mapping of the Cascade

  To apply the BHW model, we must define the structural variables of the decision environment.

  *   **The Players:** Retail depositors. While physically queuing simultaneously, theoretically modeled as acting sequentially ($i = 1, 2, ... N$) based on the information available at time $t$.
  *   **The State of the World ($V$):** Binary. $V \in \{Solvent, Insolvent\}$. (In reality, this was a liquidity crisis, but depositors perceived it as a solvency risk).
  *   **Private Signals ($S_i$):** Each depositor receives a noisy signal about $V$.
      *   *Source:* Personal financial news consumption, account balance checks, trust in the UK "Tripartite" regulatory system.
      *   *Precision:* Generally high prior belief in $V=Solvent$ due to implicit state backing.
  *   **Observable Actions ($A_i$):** The decision to $\{Withdraw, Stay\}$.
      *   *Visibility:* Highly visible. Physical queues outside branches, televised footage of lines, media reports of withdrawal volumes.
  *   **Prior Beliefs:** High confidence in bank stability due to the perceived safety net of the Bank of England (BoE) and the Financial Services Authority (FSA).
  *   **The Shock (Public Signal):** The *Financial Times* leak (Sept 13) that Northern Rock had requested and received emergency liquidity support from the BoE.

  ---

  ### 2. Application of Canonical Cascade Logic

  The BHW model posits that a cascade occurs when the public information derived from predecessors' actions overwhelms an individual's private signal. Here is where the logic applies to Northern Rock:

  **A. The Trigger: The Leak as a High-Precision Signal**
  In canonical theory, a cascade usually builds slowly. Here, the *FT* leak acted as a massive public signal that effectively reset the priors. For the first "movers" (sophisticated investors and watchers of the *FT*), the signal was: "The Regulator knows something the public does not."
  *   **Rational Update:** A rational agent observes that the BoE (an informed player) has intervened. This implies the BoE's private signal regarding Northern Rock's liquidity was negative.
  *   **Action:** Early movers withdrew.

  **B. The Cascade Point: Ignoring Private Signals**
  Once queues formed and were televised, the canonical cascade logic kicked in for the mass of retail depositors.
  *   **The Logic:** Depositor $i$ sees Depositors $1$ through $i-1$ withdrawing. Even if Depositor $i$'s private signal ($S_i$) suggests "The bank is safe" (e.g., "I checked my account yesterday, it worked"), the weight of observed actions ($A_{1...i-1}$) suggests the aggregate information of the crowd outweighs their single private signal.
  *   **Rational Ignoring:** It becomes rational for Depositor $i$ to ignore $S_i$ and follow the herd. They infer that the queue possesses information they lack (e.g., insider knowledge of insolvency). This is the **Informational Externality**: my action reveals my signal to you, but I do not internalize the cost of that information revelation.

  **C. The Fragility**
  The cascade is fragile because it is based on little information. Once the cascade starts, no new private information is aggregated into the price (or queue). The system locks into a "Withdraw" equilibrium regardless of the true state $V$.

  ---

  ### 3. Where the Logic Breaks Down

  While the BHW model explains the *herding* behavior, it misdescribes the *mechanics* of the bank run in three critical ways.

  **A. Coordination Failure vs. Informational Cascade**
  *   **Canonical View:** I withdraw because I think *you know* the bank is insolvent (Informational).
  *   **Northern Rock Reality:** I withdraw because I think *you will withdraw*, rendering the bank illiquid regardless of solvency (Payoff/Coordination).
  *   **The Breakdown:** In BHW, my payoff depends on the State of the World ($V$). In a bank run (Diamond-Dybvig structure), my payoff depends on the **actions of others**. If enough people withdraw, a solvent bank fails. This is a **strategic complementarity**, not just an information aggregation problem. The panic was not merely "they know something I don't"; it was "if they run, I must run to beat the line." The BHW model is silent on this payoff externality.

  **B. Simultaneity vs. Sequentiality**
  *   **Canonical View:** Agents act strictly sequentially ($1, 2, 3...$).
  *   **Northern Rock Reality:** The run was simultaneous. Queues formed across branches at once upon the news broadcast.
  *   **The Breakdown:** In a simultaneous game, you cannot observe predecessors' actions before acting. You observe a *common signal* (the news) and act on expectations of others' actions. This moves the analysis from Information Cascades to **Global Games** (Carlsson and van Damme), where the run is driven by higher-order beliefs ("I know that you know that the BoE leaked...").

  **C. The Nature of the Signal (The BoE Leak)**
  *   **Canonical View:** Public signals usually *break* cascades by providing common knowledge.
  *   **Northern Rock Reality:** The public signal (BoE support) *started* the cascade.
  *   **The Breakdown:** In BHW, a public signal is usually exogenous. Here, the signal was endogenous to the regulator's private information. The leak revealed that the "Informed Player" (BoE) had already acted. This turned the BoE's action into the first move in the cascade, but it signaled distress rather than stability. The BHW model struggles when the "expert" action is interpreted as a negative signal of the underlying state.

  ---

  ### 4. Informational Externalities vs. Common Knowledge of Panic

  Did the cascade depend on true informational externalities, or was it coordination failure?

  **Verdict: Primarily Coordination Failure masquerading as Information.**

  If it were a pure BHW informational cascade, depositors would be trying to discover the truth about $V$ (Solvency). However, testimony from the time suggests depositors were less concerned with Northern Rock's balance sheet and more concerned with **access to funds**.
  *   **Evidence:** Many depositors returned the money to Northern Rock days later or moved it to another UK bank (which had the same systemic risk). They did not flee the *system*; they fled the *queue*.
  *   **Implication:** This indicates the driving force was not "I think you know the bank is bad" (Information), but "I know you are going to withdraw, and funds are first-come-first-served" (Coordination).
  *   **Common Knowledge:** The televised queues created common knowledge of the panic itself. In BHW, I observe your action. In Northern Rock, we all observed the *phenomenon* of the run simultaneously. This created a self-fulfilling prophecy driven by the **payoff structure** (limited liquidity), not just the **information structure**.

  ---

  ### 5. Testing the Theory Against the Ending

  The run stopped abruptly after Chancellor Alistair Darling announced a blanket guarantee for all deposits on Sept 17. How does this fit the rational herding model?

  **A. The Rational Agent Argument**
  If agents were purely rational information-cascaders, the guarantee is a new public signal ($S_{public}$).
  *   **Logic:** The signal says "Payoff of Withdraw = Payoff of Stay."
  *   **Update:** Rational agents update beliefs about the safety of funds. The cascade should reverse.
  *   **Observation:** The queues vanished.
  *   **Conclusion:** This *seems* to support rationality. Agents updated on the new signal.

  **B. The Model Limitation Argument (Payoff Restructuring)**
  However, a deeper analysis suggests the BHW model is the wrong tool to explain the termination.
  *   **BHW Limitation:** The BHW model assumes fixed payoffs based on the State of the World. It explains why I follow you to discover the truth.
  *   **The Guarantee:** The Treasury guarantee did not change the *information* about Northern Rock's solvency. The bank was still fundamentally distressed. The guarantee changed the **Payoff Matrix**.
  *   **Restructuring:** It removed the strategic complementarity. It no longer mattered what *you* did, because my deposit was safe regardless.
  *   **Critique:** If the herding was truly an *information cascade* (learning about solvency), the guarantee shouldn't have stopped it instantly unless the guarantee proved solvency. It didn't; it insured insolvency. The fact that the run stopped proves the run was never about *information* (Solvency); it was about *coordination* (Liquidity access).

  **C. Does this show herding was irrational?**
  No. It shows the herding was **rationally responsive to payoffs**, not just information.
  *   **Rationality:** It was rational to run when payouts were first-come-first-served. It was rational to stop when payouts were guaranteed.
  *   **Model Failure:** The Information Cascade model is silent on how public commitments restructure payoffs. It treats the guarantee as just another signal. In reality, the guarantee was a **rule change**. It shifted the game from a Prisoner's Dilemma/Coordination Game back to a Dominant Strategy Equilibrium (Stay).

  ---

  ### 6. Honest Account: Explanatory Power vs. Misdescription

  **What Rational Herding Explains:**
  1.  **The Speed of Contagion:** It explains why rational individuals with no negative private information joined the queue. They rationally inferred information from the actions of the crowd.
  2.  **The Role of the Leak:** It explains why the *FT* leak was catastrophic. It provided the initial "observable action" by an informed player (the Regulator) that triggered the inference chain.
  3.  **Fragility:** It correctly predicts that once the cascade begins, private positive signals (e.g., "The bank says it's safe") are ignored because the public history of actions (the queue) dominates.

  **What Rational Herding Misdescribes:**
  1.  **The Motivation:** It frames the run as a search for truth (Solvency). The Northern Rock run was a search for liquidity access (Coordination).
  2.  **The Termination:** It frames the end of the run as an information update. The end of the run was a payoff restructuring.
  3.  **The Structure:** It assumes sequentiality. The run was a simultaneous reaction to a common shock, better modeled by Global Games or Diamond-Dybvig.

  **Conclusion:**
  The Northern Rock run was a **coordination failure driven by common knowledge**, wrapped in the appearance of an information cascade. The BHW model successfully maps the *behavioral mechanism* of the herding (ignoring private signals to follow the crowd), but it fails to capture the *structural cause* (the first-come-first-served liability structure). The Treasury guarantee did not prove the herding was irrational; it proved that the herding was responsive to incentives, not just information. The cascade model is useful for understanding the *propagation* of the panic, but silent on the *resolution*, which required changing the rules of the game, not just the signals within it.
