answer: |-
  1. **The kit**
  You need a standard deck stripped to 12 cards: Ace through 6 of Hearts (Red) and Spades (Black). Shuffle them in a visible opaque cup.
  **Handout (one side only):**
  *   **Props:** $H$ = Ace of Hearts, $S$ = Ace of Spades, $R$ = Card is Red, $A$ = Card is an Ace.
  *   **Scoring Rule:** Your score per prop = $100 - 100 \times (\text{Outcome} - \text{Your Price})^2$. Outcome is 1 (True) or 0 (False). Price is 0.00 to 1.00.
  *   **Endowment:** Everyone starts with 1,000 points.
  **Informant Prep:** Brief one student privately. They draw a card, look at it, and return it face-down.
  *   **Round 1 Script:** "I have checked the card. I can tell you: **If it is an Ace, it is a Heart.**"
  *   **Round 2 Script:** "I have checked the card. I can tell you: **If it is not the Ace of Spades, it is Red.**"
  Stipulate verbally: The informant is truthful and reliable. The statement is a hard constraint on probabilities, not a guess.

  2. **Market rules**
  This is a prediction market, not a bet against the house. You are pricing propositions based on your credence.
  **Pricing:** Before the informant speaks, write your price (0.00–1.00) for $H$, $R$, and $A$ on your slip. After the testimony, write a new price.
  **Payout:** At the end of class, we reveal the card. We calculate your score for each prop using the formula on the handout.
  *   *Example:* You price $H$ at 0.80. The card is the Ace of Hearts (Outcome 1). Error is $0.20$. Squared is $0.04$. Penalty is 4 points. Score: 96.
  *   *Example:* You price $H$ at 0.80. The card is 2 of Spades (Outcome 0). Error is $0.80$. Squared is $0.64$. Penalty is 64 points. Score: 36.
  **Anti-Gaming:** You must post a price for every prop. Blanks get 0 points. Prices must be in 0.05 increments to speed up board entry.
  **Liquidity:** You cannot go bankrupt. If your score dips below 0 on a round, you are reset to 100 points for the next round to keep you in the game. We are measuring calibration, not survival.
  **Transparency:** After each round, I will write the class median price on the board next to the previous median. You will see the market move.

  3. **Timeline**
  **00–05:** Distribute handout. Explain scoring rule with the examples above. Emphasize: "Honesty maximizes your expected score."
  **05–15:** **Round 1 Pricing.** Students price $H, S, R, A$ based on the 12-card deck only (Uniform Prior). Collect slips. Informant gives Round 1 testimony ("If Ace, then Heart").
  **15–25:** **Round 1 Re-pricing.** Students adjust prices. Collect slips. Reveal the card (it doesn't matter which, but reveal one to validate the scoring rule). Calculate scores live on the board for 3 volunteers.
  **25–30:** **Pause.** Do not explain the math. Ask: "Did anyone feel unsure how to move their numbers?" Note hands.
  **30–40:** **Round 2 Pricing.** Reset prices to prior (or use Round 1 posteriors as new priors—keep it simple: reset to 12-card uniform). Informant gives Round 2 testimony ("If not AS, then Red").
  **40–50:** **Round 2 Re-pricing.** Students adjust. Collect. Reveal card.
  **50–60:** **Board Work.** Write the Before/After medians for $H$ and $S$ side-by-side. Circle the discrepancies.
  **60–75:** **Debrief.** (See Section 6).

  4. **Where it should land**
  The friction point is Round 2, specifically the price of $S$ (Ace of Spades).
  **The Beat:** When you write the Round 2 "After" prices for $S$ on the board, you will see a split. Half the room will raise $P(S)$ (conditionalization: impossible worlds eliminated, $S$ becomes a larger slice of the pie). Half will keep $P(S)$ roughly steady (preservation: "The testimony didn't mention $S$, so why change it?").
  **What you say:** Point to the two clusters. "One group thinks learning about the non-Spades changes the chance of the Spade. One group thinks it doesn't. Neither can be derived from the testimony alone."
  **If nobody notices:** Ask the "Steady" group: "If all non-Spades are Red, and there are only 6 Reds, but 11 non-Spades, where did the probability mass go?" Ask the "Rising" group: "The informant said nothing about the Ace of Spades. Why did you penalize it?"

  5. **The policies, in numbers**
  Prior for all single cards = $1/12 \approx 0.083$.

  | Prop | Prior | (a) Conditionalization | (b) Infomin (JB) | (c) "Don't Touch S" |
  | :--- | :--- | :--- | :--- | :--- |
  | **R1: $H$** | 0.083 | 0.091 ($1/11$) | 0.167 ($2/12$) | 0.167 ($2/12$) |
  | **R2: $S$** | 0.083 | 0.143 ($1/7$) | 0.143 ($1/7$) | 0.083 ($1/12$) |
  | **R2: $AH$** | 0.083 | 0.143 ($1/7$) | 0.143 ($1/7$) | 0.153 ($11/72$) |

  **Explanation:**
  In Round 1, (a) treats "If Ace, then Heart" as eliminating the Ace of Spades (Material Conditional). (b) and (c) treat it as shifting the Ace probability mass to Hearts while keeping the total probability of "Ace" fixed. This is why your students predicted a "double" ($1/12 \to 2/12$); they intuitively used policy (c).
  In Round 2, (a) and (b) coincide because the constraint ($P(R|\neg S)=1$) eliminates 5 black cards. The remaining space is 7 cards; $S$ is $1/7$. Policy (c) insists $P(S)$ stays $1/12$. To make the math work, the Red cards must absorb *all* remaining probability ($11/12$), inflating their prices disproportionately. This is the incoherence: you cannot keep $P(S)$ fixed while forcing 11 cards into the space of 6.

  6. **Debrief**
  Start with the board. "Round 1 was easy because the antecedent ('Ace') was small. Round 2 broke you because the antecedent ('Not Spade') was huge."
  Map the clusters to the policies. The "Rising $S$" group used **Conditionalization**: they treated the testimony as eliminating impossible worlds (the black non-aces). The "Steady $S$" group used **Preservation**: they assumed information about $\neg S$ shouldn't alter $S$.
  **The Cost:**
  *   If you Conditionalize, you accept that ruling out options in $\neg S$ automatically boosts $S$, even if the informant didn't mention $S$.
  *   If you Preserve, you break the probability axioms (as seen in the table: $11/12$ mass cannot fit in 6 Red cards without distorting their internal ratios).
  **Real World:** This is the **Judy Benjamin Problem**.
  *   *Doctor:* "If the test isn't negative, it's positive." (Eliminates 'inconclusive'). Does this raise the probability of 'negative'? Conditionalization says yes. Preservation says no.
  *   *Intelligence:* "If the weapon isn't chemical, it's biological." Does this make 'chemical' more likely?
  *   *Colleague:* "If the sample isn't contaminated, the effect replicates."
  Give them the name now. Van Fraassen (1981). The problem is that standard probability theory tells you how to update on *facts*, but not on *conditional constraints*. There is no unique rational answer. You have to choose an epistemic policy: minimize information gain (Infomin) or conditionalize on the material implication. The market showed you that your intuition flips between them depending on the stakes.

  7. **Wreckage report**
  **Predictable Failures:**
  1.  **Scoring Math:** Students will miscalculate $(1-p)^2$ without calculators. *Fix:* Have a spreadsheet open on the projector to verify scores live.
  2.  **The "Winner":** A student using Policy (c) (the "wrong" one) might win on points simply because the drawn card happened to be the Ace of Spades. They will point this out smugly. *Response:* "Scoring rules measure calibration over the long run. One draw is noise. But you correctly identified that Policy (c) pays off if the exception is the truth."
  3.  **Freezing:** The non-mathy half will stare at Round 2. *Fix:* Tell them "Guess what feels right, then check if your probabilities sum to 1."
  4.  **Informant Error:** The informant might accidentally reveal the card. *Fix:* Have a backup script where *you* are the informant.
  5.  **Time:** The board work will drag. *Fix:* Pre-write the Prior column. Only fill in the After columns live.

  8. **What the market can't show**
  The game structurally cannot reproduce the **epistemic utility** argument. The market rewards truth (matching the card), but the Judy Benjamin problem is about **informational distance**.
  Policy (b) (Infomin) is "correct" not because it wins more bets on this specific deck, but because it minimizes the "distance" between your old and new belief states. The market treats all errors equally; Infomin treats "changing your mind for no reason" as a cost. You will have to supply this philosophical justification by hand. The market only shows the *divergence*, not the *justification* for minimizing information gain. Also, the 12-card deck makes the "conditional probability = 1" limit case; the original problem is harder because the probability is $3/4$, not $1$. This simplifies the math but hides the nuance of partial constraints.

  ***

  **Where your construction drifts:**
  You are using a **Material Conditional** ("If P then Q is True") rather than a **Probabilistic Constraint** ("The probability of Q given P is $k$").
  In your Round 2 ("If not AS, then Red"), if treated as a material conditional, it logically eliminates all Black non-Aces. This forces Conditionalization and Infomin to yield the *same* result (Policy (a) and (b) in my table match).
  The original Judy Benjamin problem only creates a divergence between Conditionalization and Infomin when $0 < k < 1$. By using $k=1$ (certainty), you collapse the mathematical distinction, leaving only the intuitive conflict (Policy (c)). This is fine for a seminar, but be aware you are teaching the *intuitive tension* of JB, not the full *technical divergence*. I have adjusted the "Policies" section to reflect this collapse while preserving the pedagogical conflict.
