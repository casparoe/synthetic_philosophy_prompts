answer: |-
  Subject: Pedagogical architecture for Dewey session

  Hi there,

  It sounds like you have a really solid grip on the core tension you want to navigate, especially given where your students are coming from. Since they are well-versed in Rawls and Habermas, they are likely walking in with a strong implicit commitment to the idea that democracy is primarily about legitimacy through procedure, whether that is the veil of ignorance or the ideal speech situation. The biggest hurdle you will face is that both of those frameworks, in different ways, tend to treat the participants as arriving with fixed identities or preferences that need to be aggregated or harmonized, whereas Dewey treats the participants themselves as mutable through the process. To build this successfully, you need to structure the session so that the critique of fixed preferences happens before you even introduce the word inquiry. If you introduce democracy as inquiry while they still hold onto the idea that preferences are pre-political assets, they will just hear inquiry as a fancier way of gathering data to satisfy those existing wants. So the first dependency you need to establish is the instability of the public itself. You have to show them that the public is not a static body that exists prior to the problem, but is called into existence by the consequences of shared actions. Once they accept that the group itself is fluid, you can move to the second step, which is defining inquiry not as a scientific method applied to politics but as the way humans naturally navigate indeterminate situations.

  This is the exact moment where you need to head off the first major misconception, which is that experimentalism implies trial-and-error where citizens are the lab rats and the philosopher or state is the scientist. You should address this immediately when you define inquiry by emphasizing that for Dewey, the inquirers are the participants themselves, not an external observer. If you wait until later to clarify this, they will have already hardened the view that Dewey is proposing a technocratic management of society. You can reinforce this by introducing your pop-up transit example right here. The example works well because it is concrete enough to avoid abstract metaphysics but complex enough to show social coordination. Describe a scenario where a neighborhood sets up a temporary route not to test a hypothesis devised by a planner, but to discover what mobility even means in their context. The key distinction to draw is that the residents are not being tested; the situation is being tested by the residents. This leads directly into the third step of your sequence, which is the reconstruction of ends. You need to show that the value of the experiment is not whether the bus route succeeds according to a pre-set metric, but whether the process reveals new needs, such as realizing that the problem was not speed but safety, or that the desire was not for transit at all but for community spaces along the route.

  Here is where you will encounter the second major misconception, which is the fear of expert control or top-down planning disguised as experimentation. Students familiar with deliberative democracy might worry that this experimental frame just gives experts a new excuse to manipulate outcomes under the guise of learning. You need to head this off by specifying that the expertise required is distributed among the participants because they are the ones experiencing the consequences. In the transit example, the expert might know how to engine a bus, but only the resident knows that the stop feels unsafe at night. The pedagogical move here is to insist that the definition of the problem is part of the inquiry, not the starting condition. If you leave problem-definition to experts, you have reverted to technocracy. If you leave it to the cooperative inquiry of the residents, you have Deweyan democracy. This sets up the final conceptual hurdle, which is the third misconception regarding normativity. Students will argue that if ends are reconstructed during the process, there is no rational standard for judging success, leading to a kind of relativistic populism. You need to address this after you have established the co-transformation of problem and preference. The answer is that the standard is not preference satisfaction but problem resolution. The rationality lies in whether the reconstructed ends actually resolve the tension that initiated the inquiry. If the new preference for safer stops resolves the anxiety that initiated the transit request, the inquiry was successful even if the original preference for faster buses was abandoned.

  Regarding what to leave out, you should be upfront that you are bracketing Dewey's metaphysics of qualitative experience and his formal logic of inquiry. Do not frame this as dodging hard material but rather as focusing on the political application before the ontological groundwork. You can say that while Dewey's view of experience is the engine behind this, getting bogged down in the metaphysics of quality right now might obscure the political mechanism you want them to grasp. Tell them you are treating the logic of inquiry as a functional tool for this session rather than a system to be mastered, so that they can see how it operates in a democratic context without getting lost in the epistemology. This keeps the seminar focused on the political theory rather than turning into a history of pragmatism seminar.

  Finally, for your check question, you need something that forces them to distinguish between aggregating preferences and transforming them. Do not ask them to define experimentalism, as that invites memorization. Instead, present them with a specific vignette and ask for a judgment. You could say something like this: In a Deweyan framework, if a community begins an inquiry wanting a new park to increase property values but through the cooperative process of building it decides instead to prioritize a community garden that lowers values but increases social cohesion, did the experiment fail to meet their original goals or did it succeed in reconstructing them, and what specific evidence would you look for to justify that claim? This forces them to articulate that the change in ends is not a failure of the mechanism but the success of the inquiry, and it requires them to identify that the evidence lies in the resolution of the shared problem rather than the satisfaction of the initial wish. If they can answer that, you will know they have grasped the co-transformation of problem and preference rather than just memorizing that democracy is like science. I hope this helps you structure the flow, and let me know if you want to bounce any other ideas around before next week.

  Best regards

  [Your Name]
