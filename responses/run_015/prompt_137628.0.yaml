answer: |-
  # Activity Design: The Oakhaven Ledger

  ## 1. Framing and Minimal Setup Script
  **Time:** 0:00–0:10
  **Materials Needed:** 4 Ensembles (one per group), each containing: 1 Parish Ledger, 20 "Time" tokens (white), 20 "Discipline" tokens (black), 3 Event Cards, 1 Pencil.

  **Facilitator Script:**
  "Good morning. Today we are not discussing George Eliot directly. Instead, we are entering a simulation set in 1842. You are members of the Parish of Oakhaven. You are all educated, thoughtful individuals who have recently undergone a private intellectual shift: you no longer believe the supernatural claims of the Church are true. You do not believe prayer changes God's mind. You do not believe divine providence intervenes in harvest or illness.

  However, you remain members of this community. The parish structure remains. The bell still rings. The neighbors still expect you.

  You are divided into four Households. Your goal is to survive the coming winter with your Household intact and the Parish stable. You have a limited resource: *Time*. You can spend Time on *Liturgical Practice* (morning prayer, visiting the sick, Sabbath observance) or you can save that Time for *Private Leisure* (study, rest, business).

  There is one rule: You cannot lie to yourselves. You know the prayers are not heard by a deity. The only question is whether you perform the action anyway.

  Open your envelopes. Do not speak to other Households yet."

  ## 2. Roles and Constraints
  **Group Structure:** 4 Households of 4 students.
  **Internal Roles (assign within groups):**
  1.  **Steward:** Holds and distributes tokens.
  2.  **Scribe:** Records decisions in the Ledger.
  3.  **Reader:** Reads Event Cards aloud.
  4.  **Speaker:** Reports outcomes to the class.

  **The Economy:**
  *   **Time Tokens (White):** Each Household starts with 10. This represents weekly available energy.
  *   **Discipline Tokens (Black):** These are *earned*, not given. They represent the moral capacity to attend to suffering.
  *   **The Exchange Rate:**
      *   **Option A (The Rationalist Path):** Skip Liturgical Practice. **Gain 2 Time Tokens** (saved effort). **Gain 0 Discipline Tokens.**
      *   **Option B (The Disciplined Path):** Perform Liturgical Practice. **Spend 2 Time Tokens.** **Gain 3 Discipline Tokens.**
      *   *Logic:* Practice costs effort but builds capacity. Abandoning practice saves effort but builds nothing.

  **Constraint:** Students are reminded verbally: "You do not believe these practices have supernatural power. You are doing them solely as a choice of habit."

  ## 3. Sequence and Timeline (90 Minutes)

  ### Phase 1: The Decision (0:10–0:30)
  *   **0:10–0:15:** Distribute envelopes. Students count starting tokens (10 Time each).
  *   **0:15–0:25:** **Round 1 Decision.** Each Household must choose Option A or Option B for three consecutive months (3 rounds of decision making).
      *   They must decide privately.
      *   Scribe records: "Month 1: Option [A/B]."
      *   Steward adjusts tokens accordingly.
      *   *Note:* Most groups will likely split or debate heavily here. Some will hoard Time; others will invest in Discipline.
  *   **0:25–0:30:** **The Winter Arrives.** Collect all "Time" tokens back into the central pool. They are now useless. The only currency that matters for the next phase is **Discipline Tokens**.
      *   *Facilitator Note:* Do not explain why Time is useless yet. Just collect it.

  ### Phase 2: The Crisis (0:30–1:00)
  *   **0:30–0:45:** **Event Cards.** Each Household draws 3 Event Cards, one at a time.
      *   *Card Example 1:* "Fever strikes the Weaver's family. Requires nursing."
      *   *Card Example 2:* "Harvest failure causes despair. Requires consolation."
      *   *Card Example 3:* "Parson dies. Community leadership vacuum."
      *   **Cost to Resolve:** Each card requires spending **2 Discipline Tokens** to resolve successfully.
      *   **The Mechanic:** If a group has enough Discipline Tokens, they flip the card face up (Resolved). If they do not have enough, they must leave it face down (Unresolved Suffering). They cannot use Time tokens to pay for this.
  *   **0:45–0:55:** **Inter-Parish Negotiation.** Households may trade Discipline Tokens, but only if they physically stand up and walk to another table. (This simulates the friction of community organizing).
      *   *Constraint:* You cannot give tokens away; you must exchange them for a promise of future aid (which cannot be fulfilled as the game ends soon). This creates friction.
  *   **0:55–1:00:** **Final Tally.** Groups count their Face-Up cards (Resolved Suffering) vs. Face-Down cards (Unresolved Suffering).

  ### Phase 3: The Silence (1:00–1:10)
  *   **1:00–1:10:** **Facilitator Silence.**
      *   **Instruction:** "Look at your table. Count your Unresolved Suffering cards. Look at the other tables. Do not speak. Do not explain your strategy. Sit with the outcome."
      *   **Action:** The facilitator sits at the front, looks at the clock, and says nothing. No validation, no critique. If students ask "Did we win?" or "What does this mean?", the facilitator points to the clock or shakes their head slightly.
      *   **Purpose:** This forces the students to feel the weight of the *consequence* without an intellectual buffer. The groups that chose "Rationalist Path" (Option A) will have high Time savings (which were collected and nullified) and low Discipline tokens. They will have face-down cards. They must sit with the fact that their intellectual honesty (saving time/effort) resulted in unaddressed suffering.

  ### Phase 4: Debrief and Mapping (1:10–1:30)
  *   **1:10–1:30:** Facilitator breaks silence and leads discussion (see below).

  ## 4. Token Payoff Scheme and Tracking
  *   **Ledger Sheet:**
      *   Columns: Month | Choice (A/B) | Time Spent | Discipline Gained | Total Discipline | Events Resolved.
  *   **Payoff Logic:**
      *   Groups that maximized Time (Option A) enter the Crisis with 0–3 Discipline Tokens. They will fail to resolve most Events.
      *   Groups that maximized Discipline (Option B) enter with 6–9 Discipline Tokens. They will resolve most Events.
      *   **The Trap:** The "Time" saved in Phase 1 is explicitly invalidated at the start of Phase 2. This mimics the claim that *intellectual comfort* (saved cognitive effort) does not help in a *moral crisis*. Only the *trained capacity* (Discipline) helps.

  ## 5. The Debrief: Mapping Activity to Theory
  **Facilitator Script for Debrief:**

  "Break the silence. Look at the Households with the most Face-Down cards. Why did you fail?"
  *(Students will likely say: 'We didn't have enough tokens' or 'We saved time instead.')*

  "Look at the Households that succeeded. You spent effort on practices you admitted were 'empty' of supernatural truth. Why did you do it?"
  *(Students will say: 'We thought we might need the tokens' or 'It felt like the right thing to do.')*

  "Here is the claim we are testing today, which I call **Liturgical Residue**.
  In this game, the 'Doctrine' was the belief that God hears prayer. I told you at the start: *You do not believe this.* That doctrine was dead.
  The 'Practice' was the act of prayer, visiting, tithing.
  The 'Residue' was the Discipline Token.

  George Eliot argues that when a person loses Christian doctrine (as she did), they often assume the moral life collapses. But she observes that the *practices* themselves train the mind.
  *   **Confession** trains humility.
  *   **Prayer** trains attention to things outside oneself.
  *   **Sabbath** trains restraint from greed.

  When the belief goes, the practice can remain. If you keep the practice, you keep the *capacity* to attend to suffering. If you abandon the practice because 'it doesn't work supernaturally,' you atrophy the moral muscle needed to handle human pain.

  In the game, your 'Time Tokens' represented the intellectual comfort of saying, 'I don't need to do this useless thing.' But when the Fever came, that comfort was worthless. Only the Discipline remained. Eliot suggests that Victorian secularism shouldn't just be about dropping dogma; it should be about salvaging the *discipline* embedded in the rituals, even after the dogma is gone."

  **What Participants Should Come Away Seeing:**
  1.  Belief and Practice are mechanically separable.
  2.  Practice has a functional utility (moral attention) independent of its truth claims.
  3.  Abandoning practice for the sake of intellectual consistency can lead to moral incapacity.

  ## 6. Predicted Failures and Mitigations

  **Failure 1: Collapsing the Distinction (The "Magic" Error)**
  *   *Risk:* Students will argue that the Discipline Tokens represent "God actually helping" despite instructions. They will treat the tokens as supernatural efficacy.
  *   *Mitigation:* During the Debrief, explicitly ask: "Did the tokens represent God intervening?" (No). "What did they represent?" (Your own capacity to act). Reinforce that the *source* of the moral power was the *habit*, not the deity.

  **Failure 2: The "New Ritual" Objection**
  *   *Risk:* A student will argue, "I would just create a new secular ritual. I don't need the old church stuff."
  *   *Mitigation:* Acknowledge this is valid *today*, but historically specific to Eliot's Victorians. For them, the *existing* forms carried the social weight. Eliot's point is about *continuity*, not invention. The "Residue" is in the *old* forms. Ask: "Can you build the same depth of habit in 3 months with a new ritual as a community has in 300 years with an old one?"

  **Failure 3: Treating Practice as Nostalgia**
  *   *Risk:* Students view continuing the practice as mere sentimental nostalgia, not moral training.
  *   *Mitigation:* In the Debrief, highlight the *cost*. It cost Time Tokens. It was hard. Nostalgia is passive; Liturgical Residue is active discipline. The game forced a cost; nostalgia is usually free.

  **Failure 4: Gamification Trivializes Faith**
  *   *Risk:* Students treat the "prayer" as a mere resource grind, missing the emotional weight.
  *   *Mitigation:* The Facilitator's Silence phase is crucial here. It prevents immediate intellectualization. The discomfort of the silence forces them to feel the loss of the "Unresolved Suffering" cards viscerally.

  ## 7. Limitations of the Activity
  **What the Activity Cannot Reproduce:**
  This simulation is structural and utilitarian. It demonstrates the *function* of liturgical residue, but it cannot reproduce the *aesthetic* or *emotional* texture of Eliot's fiction.
  *   **Missing:** The sadness of the loss of belief. The beauty of the prose. The complex inner turmoil of a character like Dorothea or Maggie.
  *   **Supplied by Facilitator:** In the debrief, you must supply the *pathos*. Explain that for Eliot, this wasn't a cold calculation of tokens. It was a desperate attempt to find how to be good in a silent universe. The game shows the *logic* of her position; you must supply the *feeling* of her position by referencing the emotional weight of the "Unresolved Suffering" they just sat with in silence.

  **Final Facilitator Note:**
  Do not reveal the term "Liturgical Residue" until the Debrief. Let them struggle with the mechanics of "Discipline vs. Time" first. The concept lands harder when they have already experienced the cost of ignoring it.
