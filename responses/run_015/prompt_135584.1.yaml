prompt: |-
  I'm on the advisory board for our city's participatory climate budget and we're deadlocked on who actually belongs in the demos for this vote. The flood-infrastructure plan covers three neighboring townships plus our downtown, but right now only people with city residency can vote. Half the board wants to open it to anyone in the affected watershed (the all-affected-interests line), half thinks thats just dissolving democratic accountability into a vague stakeholder soup. There's also this weird middle idea where non-resident workers get weighted proxy votes through their employers, which smells like corporate personhood sneaking in the back door.

  Draft the memo I'd circulate before tuesdays meeting: recommend one concrete membership rule with a timeline, and take the all-affected argument seriously rather than dismissing it. The dissenters should be able to actually respond to your reasoning — no legal boilerplate. Then after the memo, give me a structured summary in this exact JSON:

  {
    "recommended_criterion": "string describing who gets the vote",
    "implementation_timeline": "string with phases or deadlines",
    "strongest_opposing_view_engaged": "string",
    "concession_made_to_opponents": "string",
    "risk_that_demos_loses_coherence": "low | medium | high"
  }

  Keep it tight — this is for a dataset prompt, not a dissertation.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Role:** Advisory board member for a city's participatory climate budget.
      *   **Problem:** Deadlock on voter eligibility (demos) for a flood-infrastructure plan.
      *   **Scope:** Plan covers three neighboring townships + downtown city.
      *   **Current Rule:** Only city residents can vote.
      *   **Option A (All-Affected):** Open to anyone in the affected watershed (stakeholder soup concern).
      *   **Option B (Status Quo/Residency):** Only city residents (accountability concern).
      *   **Option C (Weird Middle):** Non-resident workers get weighted proxy votes via employers (corporate personhood concern).
      *   **Task:** Draft a memo for Tuesday's meeting.
      *   **Requirements:**
          *   Recommend one concrete membership rule with a timeline.
          *   Take the "all-affected" argument seriously (don't dismiss it).
          *   Ensure dissenters can respond to reasoning (no legal boilerplate, clear argumentation).
          *   Follow the memo with a structured JSON summary.
          *   JSON fields: `recommended_criterion`, `implementation_timeline`, `strongest_opposing_view_engaged`, `concession_made_to_opponents`, `risk_that_demos_loses_coherence`.
          *   Tone: Tight, practical, not a dissertation.

  2.  **Determine the Recommendation:**
      *   *Status Quo (City Residents Only):* Ignores the reality that flood infrastructure affects neighbors. Unfair if their taxes/land use impact the water flow.
      *   *All-Affected (Watershed):* Hard to define boundaries, potential dilution of city residents' voice, accountability issues (voters can't vote out city council).
      *   *Proxy Votes via Employers:* Bad idea. Corporate personhood issues, unequal weighting.
      *   *Hybrid/Compromise:* Expand eligibility to include *property owners* and *daily commuters* in the affected townships, but keep the primary weight with city residents. OR, create a joint advisory vote where neighboring townships validate the plan without overriding city budget authority.
      *   *Best Concrete Rule:* "Residency + Direct Property/Infrastructure Impact." Let's refine this. The prompt asks for a concrete membership rule. A "Regional Voter Registry" for this specific budget item seems best. It acknowledges the all-affected principle without dissolving the city's democratic boundary.
      *   *Decision:* Recommend a **Regional Eligibility Pool** limited to residents and property owners within the specific floodplain zones of the four municipalities, verified by address/property tax records. This respects the "all-affected" principle (floods don't stop at city lines) but maintains coherence (geographic specificity, not vague "stakeholders").

  3.  **Drafting the Memo:**
      *   **Header:** To, From, Date, Subject.
      *   **Opening:** Acknowledge the deadlock and the stakes.
      *   **Argument:** Engage the "all-affected" principle seriously. Water flows across borders; exclusion undermines legitimacy.
      *   **Counter-argument (Accountability):** Acknowledge the risk of "stakeholder soup." Non-residents can't vote in city elections.
      *   **Recommendation:** Expand voting eligibility to include verified residents and property owners in the three neighboring townships *within the designated floodplain zone*. Not the whole township, just the affected zone. This narrows the "all-affected" to "all-directly-affected."
      *   **Timeline:** Verification phase, registration phase, vote.
      *   **Tone:** Persuasive, clear, open to rebuttal.

  4.  **Refining the Recommendation for Coherence:**
      *   If I open it to township residents, does the city lose control? Yes, potentially.
      *   Better compromise: City residents vote on budget allocation, neighboring stakeholders vote on *project approval/design* via a parallel advisory ballot that triggers a mandatory review if rejected.
      *   *Wait, the prompt asks for "who actually belongs in the demos for this vote."* It implies a single vote.
      *   Let's go with **Residency + Property Ownership in the Hydrological Zone**. This ties the vote to tangible risk rather than vague interest. It addresses the "all-affected" argument (water affects owners/residents) but limits it to those with skin in the game (property/residency), avoiding the "corporate proxy" mess.
      *   *Actually, a stronger coherence safeguard:* City residents retain 51% weighting, or the vote is advisory to the City Council regardless. But the prompt asks for membership rule.
      *   Let's stick to: **Eligibility extends to residents and property owners within the defined floodplain across all four municipalities.** This is concrete. It respects the all-affected principle (floods cross borders) but limits it to geographic directness (not everyone in the township, just the flood zone).

  5.  **Drafting the JSON:**
      *   `recommended_criterion`: Residents and property owners within the mapped floodplain across all four municipalities.
      *   `implementation_timeline`: Verification (2 weeks), Registration (3 weeks), Vote (1 week).
      *   `strongest_opposing_view_engaged`: The accountability argument (non-residents can't vote out city officials).
      *   `concession_made_to_opponents`: Limiting eligibility to direct floodplain zones rather than whole townships.
      *   `risk_that_demos_loses_coherence`: medium (since it crosses jurisdictional lines).

  6.  **Review against Constraints:**
      *   Take all-affected seriously? Yes.
      *   No legal boilerplate? Yes.
      *   Concrete rule + timeline? Yes.
      *   JSON exact format? Yes.
      *   Tight? Yes.

  7.  **Final Polish:**
      *   Make sure the memo sounds like it's from a board member to a board.
      *   Ensure the JSON is valid.
      *   Check the "corporate personhood" mention in the prompt - I should explicitly reject that option in the memo to show I considered it.

      *Self-Correction on JSON:* The prompt asks for `risk_that_demos_loses_coherence` to be "low | medium | high". I need to choose one. Given cross-jurisdiction voting, "medium" is honest.

      *Self-Correction on Memo:* Keep it under 500 words if possible for "tight".

      *Refining the Recommendation:* To address the accountability concern more robustly, I should suggest that while they can vote on this specific budget item, it doesn't grant them general city voting rights. This isolates the demos to the specific issue.

      *Let's finalize the criterion:* "Verified residents and property owners within the specific flood-risk zones of all four municipalities."

      *Let's finalize the timeline:* "Verify addresses by Oct 1; Open registration Oct 2-20; Vote Oct 25-27."

      *Let's finalize the opposing view:* "Democratic accountability requires voters to share the same electoral jurisdiction."

      *Let's finalize the concession:* "Excluding general township residents; limiting to direct floodplain zones."

      *Let's finalize the risk:* "medium".

  8.  **Constructing the Output:** (Drafting mentally)
      *   Memo Header.
      *   Context: The water doesn't stop at the city line.
      *   Analysis: All-affected is right about physics, wrong about politics if too vague. Corporate proxy is wrong.
      *   Proposal: Geographic directness.
      *   Timeline.
      *   JSON block.

      *Wait, one check on the JSON:* The prompt says "after the memo, give me a structured summary in this exact JSON". So Memo first, then JSON.

      *Check JSON keys:* `recommended_criterion`, `implementation_timeline`, `strongest_opposing_view_engaged`, `concession_made_to_opponents`, `risk_that_demos_loses_coherence`.

      *Check Values:* Strings, except risk is low|medium|high.

      *Ready to write.*
answer: |-
  **MEMORANDUM**

  **TO:** Participatory Climate Budget Advisory Board
  **FROM:** [Your Name]
  **DATE:** Monday, October 23
  **SUBJECT:** Recommendation on Voter Eligibility (Demos) for Flood Infrastructure Plan

  Colleagues,

  We are deadlocked because we are balancing two valid democratic principles: jurisdictional accountability versus physical reality. The "all-affected interests" argument is correct on the physics: water does not respect city lines. Excluding our neighbors whose basements flood when our levees hold creates a legitimacy deficit. However, the concern that expanding the demos dissolves accountability into "stakeholder soup" is equally valid. If voters cannot vote for the City Council that manages this budget, the link between representation and responsibility breaks.

  The proposal to weight votes via employers must be discarded; it introduces corporate personhood into a civic process and complicates verification unnecessarily.

  **Recommendation**
  I propose we define the demos as **verified residents and property owners located within the mapped 100-year floodplain across all four municipalities.**

  This adopts the all-affected principle but restricts it to *direct* physical impact rather than vague watershed interest. It grants voice to those facing immediate risk without granting general city voting rights to entire neighboring townships. To preserve accountability, this vote is binding only for this specific capital budget line item, not general city governance.

  **Implementation Timeline**
  1.  **Zone Verification (Oct 24–Nov 3):** City GIS and township clerks finalize the shared floodplain map layer.
  2.  **Registration Window (Nov 4–Nov 24):** Eligible voters register using utility bills or property tax records matching the zone.
  3.  **Voting Period (Dec 1–Dec 5):** Secure ballot deployment.

  This approach acknowledges that climate risk is regional while keeping the voter pool concrete and verifiable. I look forward to your critiques on Tuesday.

  ***

  ```json
  {
    "recommended_criterion": "Verified residents and property owners located within the mapped 100-year floodplain across all four municipalities",
    "implementation_timeline": "Zone Verification (Oct 24–Nov 3), Registration Window (Nov 4–Nov 24), Voting Period (Dec 1–Dec 5)",
    "strongest_opposing_view_engaged": "Democratic accountability requires voters to share the same electoral jurisdiction to ensure responsibility for outcomes",
    "concession_made_to_opponents": "Excluding general township residents; limiting eligibility strictly to direct floodplain zones rather than the whole watershed",
    "risk_that_demos_loses_coherence": "medium"
  }
  ```
