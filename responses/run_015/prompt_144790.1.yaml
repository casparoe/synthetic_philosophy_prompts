answer: |-
  ### Brainstorming and Carving the Concept

  Before I settle on the diagnosis, I need to test this against the usual suspects. You've described a situation where the *act of forecasting* alters the *statistics used to forecast*. This feels familiar, but the standard labels are slightly off-target. Let's carve away the near-misses to see what's left.

  **Candidate 1: Self-Fulfilling Prophecy (Merton)**
  *The Pitch:* A false definition of a situation evokes new behavior which makes the originally false conception come true.
  *Why I'm rejecting it:* You already sensed this, but let's be precise. In a self-fulfilling prophecy, the prediction *creates* the event (e.g., I predict a bank run, everyone withdraws, the bank fails). In your thesis example, the prediction ("this takes 9 weeks") *prevents* the event (being late). The base rate of "lateness" drops. The prediction doesn't make the world match the forecast; it makes the *data generation process* change so the forecast becomes trivially true or the error vanishes. This is actually closer to a **Self-Defeating Prediction** (predicting a shortage leads to stocking up, which averts the shortage). But "Self-Defeating Prophecy" only covers the thesis case. It doesn't cover the startup case (where ignoring the forecast was necessary for the success that built the base rate). So, "Self-Fulfilling/Defeating Prophecy" is too narrow; it describes the *direction* of the causal loop, not the structural problem with the base rate itself.

  **Candidate 2: Goodhart's Law**
  *The Pitch:* "When a measure becomes a target, it ceases to be a good measure."
  *Why I'm rejecting it:* This is the go-to for "metrics breaking," but it implies *gaming*. Goodhart's Law assumes agents are optimizing *against* the metric to look good (e.g., teachers teaching to the test). Your flatmate isn't gaming the thesis timeline to make the department look better; she is genuinely trying to be accurate. The statistic shifts not because people are corrupting the measure, but because they are *respecting* it. The breakdown comes from epistemic hygiene, not strategic manipulation. Goodhart is about incentive compatibility; your problem is about equilibrium stability.

  **Candidate 3: The Lucas Critique**
  *The Pitch:* In economics, you cannot predict the effect of a policy change based on historical correlations, because agents will change their behavior in response to the policy, altering the structural parameters.
  *Why I'm rejecting it:* This is the strongest contender. It captures the idea that "history won't repeat if the rules change." However, the Lucas Critique is macro-structural: it's about government policy changing inflation/unemployment trade-offs. Your scenario is micro-epistemic: it's about individual reasoning norms changing the distribution of outcomes. While the *logic* is identical (agents optimizing against a model), the Lucas Critique assumes a policy regime shift. You are describing a diffusion of an *epistemic norm*. It's the "micro-foundations" of the Lucas Critique applied to personal forecasting. It's close enough to borrow the logic, but distinct enough that calling it "The Lucas Critique" would confuse your seminar mates who aren't economists.

  ***

  ### The Diagnosis: Performative Base Rates & Self-Effacing Norms

  You have identified a real cluster of phenomena. It is not one single named theorem in the forecasting literature, but it is a recognized intersection of **Performativity** (from Science & Technology Studies/Econ) and **Self-Effacing Norms** (from Moral Philosophy).

  Here is the tight definition you asked for:

  **Term:** **Equilibrium-Dependent Base Rates** (or **Reflexive Base Rate Erosion**)
  **Definition:** A statistical base rate is *equilibrium-dependent* when its predictive validity relies on the assumption that a significant portion of the reference class is *not* using that base rate to guide their behavior.

  This breaks down into the two distinct mechanisms you noticed:

  1.  **The Thesis Case (Benign Performativity):** The base rate measures *error* (planning fallacy). If the norm spreads, the error is corrected, and the base rate shifts toward the physical reality. The "yardstick" shrinks.
  2.  **The Startup Case (Malign Performativity):** The base rate measures *survival* in a high-variance environment where success requires overconfidence. If the norm spreads, the "tail risk" behavior (wild ambition) vanishes, and the base rate of success drops to near zero. The "yardstick" breaks.

  **The Third Case (Reference Class Selection):**
  This is the classic **Problem of the Reference Class** (Keynes/Carnap), but supercharged by reflexivity. You asked, "How do I choose the class without using inside info?" If you use inside info to pick the class ("I am in the *smart* student class"), you've smuggled the inside view back in. If you don't, you're in the *all* student class. This isn't reflexivity per se; it's the **Induction Problem** applied to social categories. However, when combined with the first two, it means you can't even find a stable reference class because the class definition itself shifts as norms spread.

  **On "Self-Effacing Norms":**
  Your tutorial partner was sharp. In ethics (e.g., Derek Parfit), a theory is **self-effacing** if it says, "To maximize my values, you should not believe in me." (e.g., Utilitarianism might say, "Don't calculate utility every time; just follow common sense, because you'll miscalculate.")
  The Outside View is **epistemically self-effacing**. It says: "To be accurate, use base rates." But if everyone uses base rates, the base rates change (Thesis) or the successes disappear (Startup). Therefore, the norm "Always use the Outside View" generates a world where "Always use the Outside View" is no longer the optimal strategy for accuracy. It undermines its own preconditions.

  ***

  ### The Normative Question: Should You Still Use It?

  This is the crux. If the Outside View is self-effacing, is it still the "modest" move?

  **1. The Individual vs. Collective Distinction**
  For you, *right now*, the Outside View is almost certainly still the rational move. You are a "price taker" in the market of base rates. Your individual adoption of the Outside View will not shift the departmental thesis completion rate, nor will it stop the next wave of wild-eyed founders.
  *   **Thesis Case:** If you plan for 9 weeks while others plan for 6, you win (less stress). If everyone plans for 9, everyone wins (less stress). The base rate shifts, but the *outcome* improves.
  *   **Startup Case:** If you look at the 1% success rate and quit, you avoid a 99% chance of failure. If everyone quits, innovation stops. But *you* don't save innovation by being the one to fail.

  **2. The "Minority Rule" Condition**
  The Outside View works best when it is a **minority strategy**. It relies on a population of "naive inside-viewers" to generate the variance that makes the base rate meaningful.
  *   In the Thesis case, the base rate exists *because* people are overconfident. If everyone becomes modest, the base rate of "delay" vanishes. The Outside View becomes trivial (Plan = Reality). This is a *good* failure state.
  *   In the Startup case, the base rate exists *because* people are overconfident. If everyone becomes modest, the base rate of "success" vanishes. This is a *bad* failure state.

  **3. How to Apply It (The Second-Order Outside View)**
  You cannot simply apply the Outside View naively. You must apply a **Second-Order Outside View**.
  *   **Step 1:** Look at the base rate (e.g., "Theses take 9 weeks").
  *   **Step 2:** Ask: "Is this base rate generated by systematic error (planning fallacy) or by necessary risk-taking (founder delusion)?"
  *   **Step 3:** Ask: "If my reference class adopted my forecasting method, would this statistic hold?"
      *   If **Yes** (e.g., mortality rates, weather): Use the Outside View blindly.
      *   If **No, because the error would vanish** (e.g., thesis timelines): Use the Outside View, but anticipate the statistic will improve. Plan for 9 weeks, but work to make the department norm shift to 9 weeks.
      *   If **No, because the upside would vanish** (e.g., venture capital, radical science): Use the Outside View to size your *risk*, not to decide your *action*. (i.e., "I know there is a 99% chance I fail, but I am choosing to be in the 1% tail.")

  ### Summary Advice for Your Seminar

  1.  **Name it:** Call it **Equilibrium-Dependent Base Rates**. It signals you understand that social statistics are not physical constants.
  2.  **The Ethical Carryover:** Yes, "Self-Effacing" carries over perfectly. The Outside View is an epistemically self-effacing norm. It is a tool for navigating a world of irrationality that becomes less useful as the world becomes more rational.
  3.  **The Verdict:** Taking the Outside View is still epistemically modest *for the individual agent in the current equilibrium*. However, universal adoption changes the game.
      *   For **error-correction** contexts (theses, construction, software): Universal adoption is a public good. You should advocate for it.
      *   For **innovation/risk** contexts (startups, PhDs, art): Universal adoption is a public bad (stagnation). You should use the Outside View to *price* the risk, not to *avoid* the risk.

  The Outside View is not a law of nature; it is a strategy for playing a game where most other players are playing poorly. If everyone plays optimally, the strategy changes. Recognizing this doesn't invalidate the Outside View; it just moves you from being a forecaster to being a **social epistemologist** of your own forecasting.
