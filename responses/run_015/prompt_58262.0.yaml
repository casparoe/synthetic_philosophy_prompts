  4.  **Writing - Focusing on Sensory Details and Internal Monologue:**
      *   *Opening:* Start with the hands in the water. Connect the oysters to the pain.
      *   *Middle:* The town hall needs to feel crowded, contrasting with the isolation of the hatchery.
      *   *Climax:* The doctor's office. The choice.
      *   *Theme Weaving:* Ensure the connection between the oysters, the salmon, and the human pain is felt, not explained.

  5.  **Refining and Polishing (Self-Correction during drafting):**
