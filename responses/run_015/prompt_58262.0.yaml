answer: |-
  The brine of the hatchery always smelled like old iron and deep time. Elena dipped her hands into the raceway, the cold water numbing the phantom zaps that fired up her left leg. On the tray before her lay the *Crassostrea* strain A-7. The "placid" oysters.

  Normally, when lifted from the water, oysters clamped shut, a reflexive armor against the air, the light, the predator. These remained slightly agape, their mantles relaxed. The foundation's literature called it "ablation of nociceptive stress." To Elena, they looked like they were sleeping in a storm.

  "Growth rate is up forty percent," the hatchery manager said, tapping a tablet. "No energy wasted on closure reflexes. They don't degrade during transport."

  "They don't react," Elena said, watching a larva drift past. "If a crab bites, will they close?"

  "Eventually. The predator avoidance circuit remains. But the... anxiety of crowding is gone."

  Anxiety. The word hung in the damp air. Elena rubbed her thigh. Her pain was a broken signal, a fire alarm ringing in an empty house. But was the oyster's stress a signal, or just machinery? If you greased the gears so they didn't squeal, had you improved the machine, or merely silenced it?

  By June, the heat rose off the marsh grass, bringing the town hall meeting. The room smelled of sweat and old wood. The foundation representative, a young man with a calm voice, stood before a projection of a salmon run.

  "We are proposing a viral vector," he said. "It targets the amygdala homolog. It reduces chronic cortisol spikes during migration. It does not impair acute fear. If a seal attacks, the fish flees. But the relentless terror of the journey? That is removed."

  A local fisherman stood up. "A fish that isn't scared is a dead fish. You're making them careless."

  "Not careless," the rep corrected. "Efficient. Energy directed toward muscle, not panic. We are talking about millions of lives spared from agony."

  Elena sat in the back, her leg throbbing in rhythm with the ceiling fan. She thought of the salmon fighting the current, driven by a chemical desperation she had once admired as the engine of survival. If you removed the desperation, did the fish still *want* to spawn? Or would it simply arrive, a biological drone completing a code? The fisherman saw a loss of wildness; the rep saw a moral imperative. Elena saw a spectrum. The oyster was a vegetable with a shell; the salmon was a wild agent. Where on that line did the right to suffer begin?

  The following week, she sat in a clinic that smelled of antiseptic, not brine. The neurologist showed her a scan of her own lumbar spine, the scar tissue glowing like a bruise.

  "The implant doesn't just block the transmission," he said, his pen hovering over a consent form. "It modulates the hedonic baseline. You won't just be pain-free, Elena. You'll feel... stable. Content."

  "Content," she repeated.

  "Imagine waking up without the anticipation of pain. A background sense of well-being. It's the human equivalent of what we're discussing with the salmon. Removing the chronic burden."

  "And the signal?" she asked. "If I injure myself again? If I step on a nail?"

  "Acute pain remains. This is for the noise. The suffering that serves no function."

  Elena looked out the window. Below, the tidal marsh was flooding, the green grass surrendering to the brown water. It was a violent ecosystem, built on consumption and stress. The grass grew back because it was trampled. The oysters filtered the water because they were forced to feed. The salmon swam because they were driven.

  She thought of the A-7 oysters, open and unguarded. She thought of the salmon, swimming without the weight of dread. And she thought of herself, defined for thirty years by the grit of enduring discomfort, by the sharp feedback that told her when to rest, when to move, when something was wrong.

  To take the implant was to admit that the signal was broken beyond repair. But to accept the contentment was to accept a version of herself that had never known the edge of things. Was it healing, or was it editing?

  The doctor waited. The pen lay on the desk, black and heavy.

  In the hatchery, the oysters grew fat and silent. In the river, the salmon would soon run, perhaps calm, perhaps hollow. In the marsh, the tide turned, indifferent to the comfort of the creatures within it.

  Elena picked up the pen. She looked at the consent form, then out at the water. She did not sign. She did not put the pen down. She held it there, suspended over the paper, feeling the familiar, sharp sting in her leg, a bright, clear note in the quiet room, waiting to see if it was a warning or just a song.
