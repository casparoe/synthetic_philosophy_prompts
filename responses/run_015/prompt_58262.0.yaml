          *   The proposal: "Migratory Calm."
          *   Arguments: Conservationists worry about predation. Foundation rep talks about reducing wild suffering.
          *   Elena's perspective: Fear keeps salmon alive. But chronic stress kills them too. Where is the line?
          *   Dialogue: Needs to show the tension between "natural function" and "moral imperative."

      *   *Scene 3: The Clinic (The Implant).*
          *   Atmosphere: Sterile, quiet.
          *   The offer: Not just painkilling, but *contentment*.
          *   The physical sensation: The phantom zaps in her leg.
          *   The realization: The oysters don't feel pain. The salmon feel less fear. She would feel *good*. Is that the same act?
