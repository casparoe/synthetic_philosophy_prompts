          2.  Town hall: Debate on releasing salmon intervention (blunt chronic fear during migration, keep navigation/predator avoidance).
          3.  Medical decision: Protagonist offered a neural implant for her nerve pain (blocks pain, sustains contentment).
      *   **Themes:** The conceptual difficulty of abolishing suffering vs. evolved function. Is removing suffering the same act across species/contexts? What is lost when aversive signals are replaced?
      *   **Tone:** Reflective, observational, nuanced. Not an essay or polemic.
      *   **Ending:** Open. No clear resolution (acceptance/refusal).
      *   **Length:** Approximately 1,000 words.

  2.  **Character Conception:**
      *   Name: Elena.
      *   Voice: Scientific but weary, observant, grounded in physical reality (mud, water, nerves).
