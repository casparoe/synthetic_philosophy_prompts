  3.  **Address the User's "Chew Points":**
      *   *Point 1 (Instability):* The rule "Vote iff pivotal" creates a cycle. If no one votes, one vote is pivotal -> vote. If everyone votes, one vote isn't pivotal -> don't vote. This suggests the rule isn't a stable equilibrium. Does the brother's argument rely on this? Not directly, but it highlights the tension between individual rationality and collective outcome.
      *   *Point 2 (Correlation vs. Causation):*
          *   *Variant A (Causal/Perfect Correlation):* If my decision *causes* others to decide the same (e.g., I'm an influencer), then my vote *does* matter (it brings 3M votes). This defeats the "nil probability" argument directly.
          *   *Variant B (Evidential):* My not voting is *evidence* others won't. This is Evidential Decision Theory (EDT) vs. Causal Decision Theory (CDT). The brother's argument often smuggles EDT into a CDT framework.

  4.  **Drafting the Menu of Readings:**
      *   *Reading 1: The Empirical Prediction.* (If everyone reasoned this way, turnout would drop). True, but doesn't tell me what *I* should do.
      *   *Reading 2: The Kantian Imperative.* (Act only on maxims you can will as universal law). Substantive ethical claim. Changes subject from "consequences" to "duty."
