      *   *Reading 4: The Causal Magician.* (Your thinking *causes* others to think it). False/Magical thinking, unless you are influential.
      *   *Reading 5: The Expressive/Symbolic.* (Voting is about participating, not deciding). Changes the definition of "benefit."

  5.  **Evaluating the "Free Rider" Charge:**
      *   Free riding implies benefiting from a public good (democracy) without contributing to the cost (voting).
      *   Does it stick? Only if voting is viewed as a duty or a contribution to the *legitimacy* of the system, rather than a causal lever on the outcome. If the user accepts the benefits of the election result but refuses the cost of maintaining the system, it sticks. If the user thinks the system exists regardless of their vote, it doesn't.

  6.  **Integrating the "Thought" vs. "Acted" Distinction:**
      *   "Thought like that" implies the *reasoning* spreads. "Acted like that" implies the *behavior* spreads.
      *   "Thought" leans towards the Kantian/Universalizability argument (the maxim of action).
      *   "Acted" leans towards the Consequentialist argument (the outcome of behavior).
      *   The brother likely used "thought" to imply a principle of reasoning, making it a moral critique rather than a causal one.

  7.  **Synthesizing the "Chew Points" into the Analysis:**
      *   *Instability:* Use this to show why the "Paradox of Voting" relies on a static view of a dynamic system. The brother's argument tries to stabilize the system by enforcing a norm.
      *   *Correlation:* Use this to distinguish between Causal Decision Theory (User's view) and Evidential Decision Theory (Brother's implicit view). The brother's argument works best if there *is* correlation (you are typical), even without causation.

  8.  **Refining the Tone:**
