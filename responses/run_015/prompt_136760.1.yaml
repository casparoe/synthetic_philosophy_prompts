      *   **Integrating Point 2 (Correlation):** Distinguish CDT vs. EDT here.
      *   **The "Free Rider" Label:** Analyze its validity based on the readings.
      *   **Conclusion:** Summary of who won the argument (logically vs. rhetorically).

  10. **Self-Correction/Review during drafting:**
      *   *Check:* Did I clearly distinguish between "changes the subject" and "defeats the argument"?
      *   *Correction:* Ensure I explicitly state for each reading whether it addresses the *expected value* calculation or replaces it.
      *   *Check:* Did I address the 0-0 tie instability?
