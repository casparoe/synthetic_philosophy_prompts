  **MEMORANDUM**

  **TO:** Board of Directors, Regional Transit Authority
  **FROM:** Chair, Safety and Accountability Review Board (SARB)
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Accountability Framework for Automated Shuttle Fleet

  **EXECUTIVE SUMMARY**

  Following the recent pedestrian contact incident involving Shuttle Fleet Unit 14, the SARB has evaluated the structural accountability mechanisms governing our automated operations. The investigation confirms that no individual operator violated protocol, nor could any individual have prevented the system's misclassification of the pedestrian. The current "Operator of Record" model creates a "moral crumple zone," where human staff absorb blame for systemic algorithmic failures.

  We recommend rejecting the binary choice between retaining the current operator model or abolishing human accountability entirely. Instead, we propose a **Third Option: Institutional Liability with Designated Human Answerability.** This framework abolishes the "Operator of Record" title to eliminate misplaced liability, vests financial and legal responsibility squarely with the Authority, but designates a senior "Accountability Liaison" to ensure victims have a specific human to engage with for explanations. This approach independently closes the *attributability*, *answerability*, and *liability* gaps identified by the Board.

  **CONTEXT AND ANALYSIS OF THE GAPS**

  The recent incident highlights three distinct failures in our current governance:
  1.  **Attributability Gap:** The outcome (pedestrian contact) was determined by the perception stack, not human judgment. Yet, our current structure attributes the action to the fleet monitor.
  2.  **Answerability Gap:** Engineers cannot explain *why* the model was confident in its misclassification. The fleet monitor cannot answer for the code, yet is currently the only named point of contact for inquiries.
  3.  **Liability Gap:** The financial and career costs of the incident fall on the monitor (via disciplinary risk) and the victim (via litigation), rather than the entity that deployed the technology and profits from its operation.

  **EVALUATION OF OPTIONS**

  **Option 1: Retain Operator of Record (Status Quo)**
  *Proposal:* Keep the title, compensate monitors for blame exposure, cap discipline.
  *Critique:* While this preserves a human face for victims, it is ethically indefensible. It institutionalizes dishonesty by asking employees to accept blame for decisions they did not make and could not override (3.5 seconds warning for 12 vehicles). This is the definition of a moral crumple zone. It solves the victim's need for *answerability* but fails *attributability* and *liability*.

  **Option 2: Abolish Operator of Record (Pure Institutional Accountability)**
  *Proposal:* Authority accepts all accountability; no-fault compensation; candid explanation reports.
  *Critique:* This is the most honest regarding *attributability* and *liability*. However, it risks failing the *answerability* gap. Victims of harm often require a human voice to process trauma and receive explanations. A faceless "Authority" can feel like evasion, potentially eroding public trust and leaving victims feeling unheard.

  **Option 3: Institutional Liability with Designated Human Answerability (Recommended)**
  *Proposal:* Abolish "Operator of Record." The Authority accepts full liability and funds a no-fault compensation scheme. Simultaneously, appoint a senior "Accountability Liaison" (e.g., VP of Safety) as the named contact for incidents.
  *Rationale:* This synthesizes the strengths of the previous options while mitigating their defects.
  *   **Liability:** Vests with the Authority (honest).
  *   **Attributability:** Vests with the System (honest).
  *   **Answerability:** Vests with a Senior Human (empathetic).
  By separating the *Liaison* from the *Operator*, we ensure the human answering for the incident is not the same human blamed for it. The Liaison has the authority to demand answers from the vendor and the Board, satisfying the victim's need for a responsible party without scapegoating a frontline worker.

  **IMPLEMENTATION SEQUENCE**

  | Phase | Timeline | Action Item | Responsible Party |
  | :--- | :--- | :--- | :--- |
  | **1. Policy Adoption** | T+30 Days | Board vote to abolish "Operator of Record" title and adopt Institutional Liability framework. | Board of Directors |
  | **2. Labor Agreement** | T+60 Days | Negotiate MOU with Union: Monitors retitled "Fleet Safety Stewards"; liability waiver added; no reduction in force. | HR & Legal |
  | **3. Compensation Fund** | T+90 Days | Capitalize the No-Fault Compensation Fund; publish eligibility criteria for incident victims. | Finance & Legal |
  | **4. Liaison Appointment** | T+90 Days | Appoint VP of Safety as inaugural "Accountability Liaison"; publish direct contact channel for public/victims. | CEO Office |
  | **5. Reporting Protocol** | T+120 Days | Publish first "Post-Incident Explanation Report" for the pending case, explicitly stating "Cause Unknown" regarding the AI stack. | SARB & Engineering |
  | **6. Vendor Review** | T+180 Days | Invoke contract clauses regarding unexplainable failure modes; demand remediation plan from vendor. | Procurement & Engineering |

  **STAKEHOLDER COMMUNICATIONS**

  **To the Union:**
  > "We are acknowledging that the technology has outpaced the role of the human monitor. It is unjust to hold our members liable for system errors they cannot see or stop. We are abolishing the 'Operator of Record' title to remove this liability from your shoulders. Your role will shift to 'Fleet Safety Steward,' focusing on system oversight rather than emergency intervention. Your job security is protected, but your exposure to disciplinary action for system faults is removed."

  **To the Family in the Pending Case:**
  > "Our investigation confirms that this incident was caused by a limitation in the automated system, not by human error. No individual employee is at fault. However, the Transit Authority accepts full responsibility for the deployment of this technology. We are establishing a no-fault compensation fund to ensure you receive restitution without a prolonged legal battle. A senior executive has been assigned as your direct liaison to answer your questions and explain what we know—and what we do not know—about the system's failure."

  **REVERSAL CRITERIA**

  This recommendation should be revisited if, over the next twelve months:
  1.  **Escalation in Incidents:** The frequency of contacts increases by >50% absent human intervention, suggesting that removing the "Operator" psychological burden has degraded vigilance.
  2.  **Fund Insolvency:** The no-fault compensation fund proves financially unsustainable, requiring a return to fault-based litigation to cap costs.
  3.  **Liaison Scapegoating:** Public or media pressure shifts to treat the "Accountability Liaison" as a personal scapegoat (recreating the crumple zone at a higher level), necessitating a shift to purely collective Board answerability.

  **CONCLUSION**

  We cannot engineer away all risk, but we can engineer honesty into our accountability. Retaining the Operator of Record is a lie that sacrifices our staff. Abolishing human answerability entirely is a coldness that sacrifices our community. Option 3 allows us to tell the truth about the machine while remaining human to those we harm. I request Board approval to proceed with the implementation sequence outlined above.

