answer: |-
  You have not invented this. You have identified a specific, well-documented mechanism within political economy, though it tends to be described by a cluster of concepts rather than a single catchy noun.

  The closest established framework is **Policy Feedback Theory**, specifically the subset dealing with **Endogenous Constituency Selection**.

  However, to give you the precision you asked for, this phenomenon is best understood as the intersection of three distinct concepts: **Policy Feedback** (the political science umbrella), **Insider-Outsider Theory** (the labor/housing economic dynamic), and **Exit-Voice Suppression** (the mechanism of silence).

  Here is the breakdown of the concept, its name, and the boundary cases.

  ### The Concept: Endogenous Constituency Selection
  While "Policy Feedback" is the academic umbrella, the specific dynamic you are describing—where a policy alters the demographic composition of the polity in a way that reinforces the policy—is best labeled **Endogenous Constituency Selection**.

  **Definition:** A process where a regulation or subsidy changes the incentives for residency, employment, or market participation in such a way that beneficiaries are retained (or attracted) while losers are expelled (or deterred). Over time, the *population itself* changes to reflect the policy's preferences, reducing the number of active opponents and increasing the density of beneficiaries, thereby making the policy politically self-reinforcing independent of its economic efficiency.

  ### The Theoretical Lineage
  To understand why this isn't just "Survivorship Bias" or "Concentrated Benefits," you need to see how three theories combine to create it:

  1.  **Policy Feedback (Pierson, Mettler, Soss):**
      *   *Standard view:* Policies aren't just outputs; they are inputs. They teach citizens how to engage with the state.
      *   *Your observation:* This is the **Resource Effect** of feedback. Rent control gives tenants the resource of "stability," which allows them to stay in the jurisdiction. Minimum wage gives workers the resource of "employment." The policy provides the winners the means to remain in the political arena.
  2.  **Insider-Outsider Theory (Lindbeck & Snower):**
      *   *Standard view:* Labor markets are divided into "insiders" (employed, protected) and "outsiders" (unemployed, unprotected). Insiders use their political power to maintain protections that hurt outsiders.
      *   *Your observation:* You have correctly extended this beyond labor to housing. The "Insider" is the sitting tenant; the "Outsider" is the migrant who never arrives. The key insight here is that the *Outsider has no vote in the jurisdiction.*
  3.  **Exit, Voice, and Loyalty (Hirschman):**
      *   *Standard view:* When an organization declines, members can either Voice (complain) or Exit (leave).
      *   *Your observation:* The policy manipulates this lever. Rent control forces Insiders to choose **Loyalty** (staying put to keep the discount) and forces Outsiders to choose **Exit** (going to a different city). Because political voice requires presence, the Exit of the losers silences their Voice.

  ### Why it is not the other concepts you ruled out
  *   **Not Concentrated Benefits/Diffuse Costs (Olson):** Olson's theory is about *organization costs*. It argues that losers *exist* but are too dispersed to organize. Your observation is darker: the losers *do not exist* in the jurisdiction. They have been screened out of the sample by the policy itself.
  *   **Not Survivorship Bias:** Survivorship bias is an *epistemological error* (looking at the wrong data). Endogenous Constituency Selection is an *ontological change* (the data subjects have physically left the room). The bias is not in the study; it is in the electorate.
  *   **Not Bastiat's "Seen and Unseen":** Bastiat describes economic ignorance (we see the job kept, not the job not created). You are describing *political silencing* (the person who didn't get the job doesn't live in the district, so they can't vote).

  ### Boundary Cases and Nuance
  You asked if it still counts when winners drift away, and how it relates to time. Here are the boundary conditions for Endogenous Constituency Selection:

  **1. The Time Horizon (Lock-In)**
  *   **Yes, time matters.** A policy passed last year has not yet had time to sort the population. A policy in place for 30 years has completed the sorting process.
  *   **Term:** This creates **Path Dependence**. The longer the policy exists, the more the population sorts around it, making reversal increasingly costly not just economically, but politically. The "constituency" becomes hardened.

  **2. Do Winners Drift Away? (The Decay Condition)**
  *   **If winners leave:** If the beneficiaries of the policy eventually leave the jurisdiction (e.g., rent-controlled tenants eventually die or move for jobs despite the penalty), the feedback loop weakens.
  *   **Does it still count?** Yes, but it requires a **Flow** model rather than a **Stock** model. As long as the *inflow* of winners is higher than the *outflow* of winners, and the *inflow* of losers is suppressed, the bias persists.
  *   **Boundary Case:** If the policy is temporary (sunset clause), the sorting effect is minimal because people won't rearrange their lives for a short-term gain. The effect requires perceived permanence.

  **3. Universal vs. Targeted Policies**
  *   **Targeted (Rent Control/Min Wage):** Creates a sharp Insider/Outsider divide. High selection bias.
  *   **Universal (Social Security/Medicare):** Everyone is an Insider. There are no "missing losers" from the jurisdiction (everyone gets the check).
  *   **Does it count?** No. This is pure **Policy Feedback** without the **Selection** element. The political support is broad, but it isn't because the opponents left town; it's because there are no opponents.

  **4. Jurisdictional Scale (Tiebout Sorting)**
  *   **Local (City Rent Control):** High selection effect. Losers can easily move to the next town. The "missing people" are in the next county.
  *   **National (Federal Minimum Wage):** Lower selection effect. Losers cannot easily leave the country. The "missing people" are still voters, just unemployed.
  *   **Implication:** This dynamic is strongest in **local policies** where exit costs are low for the excluded.

  ### Summary Label
  If you need a term to use in writing or argument, **Endogenous Constituency Selection** is the most accurate technical description.

  If you want a more rhetorical label that captures the silence of the excluded, you might call it **The Exit-Voice Trap** or **Policy-Induced Silencing**.

  But academically, you are describing a **Self-Reinforcing Policy Feedback Loop driven by Tiebout Sorting and Insider-Outsider Dynamics.** You have correctly identified that the "data" of democracy (the voters/residents) is not exogenous; it is a dependent variable shaped by the policies being voted on.
