answer: |-
  Subject: Re: Seminar prep and the ontology of the log

  It is good to finally put this in writing since our hallway conversations always run out of time before we get to the hard parts. Given my background, I agree that we should strip out the physics analogies and stick to the infrastructure metaphors we both know, because I suspect the confusion lies less in the metaphysics and more in the modeling language we use to describe it. If we treat the universe as a database, eternalism looks exactly like a bitemporal table where every state of every entity is stored with a valid_time and a transaction_time, meaning the past and future rows are equally present in the storage engine and now is merely a query parameter substituted at runtime rather than a property of the data itself. Presentism, by contrast, looks like a system that only maintains the current state view, where truths about the past are not stored as rows but must be reconstructed from present traces, like event sourcing where the only reality is the current aggregate state and the log is just a causal history used to derive it, meaning if you delete the log the past literally ceases to exist. The growing block theory maps cleanly to an append-only log where immutability is enforced up to the current write head but nothing exists beyond the last committed offset, while the moving spotlight is just the eternalist bitemporal table with a specific cursor variable tracking the current timestamp, sweeping over static data. When we bring in special relativity, the distributed systems analogy holds up well because there is no global clock in a distributed cluster, only vector clocks and Lamport timestamps, so a consistent global snapshot via Chandy-Lamport is just one consistent cut among many equally valid partitions of the event stream, none of which holds a privileged status as the true present, which suggests the relativistic argument against a privileged present is essentially an argument against a global transaction isolation level.

  However, when we press on the residue, the mapping starts to leak, and the first issue is passage. In our vocabulary, nothing corresponds to the present moving because the movement of HEAD in git or the incrementing of a transaction ID is just another relation among commits or rows, recorded within the system rather than experienced by it. If we model passage as the updating of a cursor, that update is itself an event in time, requiring a meta-time to measure the movement, which leads to an infinite regress. I think this residue is a sign that the philosophical claim of passage was less clear than it looked, because the computing vocabulary forces us to operationalize time as state changes, and once you do that, passage dissolves into a sequence of static states indexed by integers. The feeling of passage is external to the log, much like the user waiting for the query is external to the database, so the gap is not in the vocabulary but in the claim itself, which tries to treat a subjective perspective on state changes as an objective feature of the storage engine.

  The second issue is asymmetry, specifically why the past is fixed and the future open. In a database, the past is fixed because we choose append-only logs for auditability, but physically the storage medium allows overwrites, so the asymmetry is a design constraint, not a hardware limitation. My suspicion aligns with yours that the growing block is just presentism plus an epistemic fact about entropy and recordkeeping, because if the dynamics are time-symmetric, the present state fixes the past via the logs just as much as it constrains the future via the application logic. The vocabulary supports this view because it reveals that the immutability of the past is a policy enforced by the system architect, not a property of the bits on the disk, suggesting the metaphysical asymmetry is smuggled in via our pragmatic need for consistency rather than discovered in the ontology. If we treat the log as physical reality, the edge of the block is just the current write head, and whether that head moves because the future is unwritten or because we just haven't written it yet is indistinguishable from inside the system, which implies the metaphysical difference between the two edges of the block is an artifact of our epistemic position as writers rather than readers of the log.

  The third issue is branching, and here the vocabulary struggles the most because in git a branch is a modal concept representing a possible future, whereas the eternalist wants all times to be actual. If we treat the timeline as a single main branch, we lose the ability to model alternative futures without collapsing them into parallel actualities, which looks like the many-worlds interpretation rather than eternalism. The old fatalism worry about eternalism seems partly an artifact of the framework collapsing the modal into the temporal, because if every future timestamp is already a committed row in the bitemporal table, then concurrency control becomes impossible and everything is serialized in advance. I think this residue is a defect of the vocabulary because version control systems are designed to manage divergence and merge conflicts, inherently treating branches as possibilities until merged, whereas eternalism requires us to treat all branches as equally merged and actual, which breaks the semantics of the tool. We lack a data structure that represents actualized futures without treating them as alternative histories, so the vocabulary forces a false choice between determinism and branching possibilities, obscuring the nuanced view that the future might be real without being determined.

  Finally, on temporary intrinsics, the mapping of identity across versions using surrogate keys helps considerably because it separates the entity ID from the row data, allowing the same logical object to have different attribute values at different valid_times without contradiction. This solves the logical problem by treating the object as a sequence of time-sliced states linked by a stable key, much like a slowly changing dimension type two in a data warehouse, where the identity persists across the changes. However, this fails to capture the unity of the object because the surrogate key is just a pointer, and the philosophical problem is about how the object itself endures rather than how we reference it. The vocabulary handles the reference well but leaves the metaphysical glue unexplained, suggesting that while we can model the data of persistence, the ontology of endurance remains outside the schema. Overall, I think the computing vocabulary clarifies the claims by forcing operational definitions, but it also exposes that many metaphysical distinctions rely on ambiguities that disappear once you have to implement the schema, so we should proceed with the seminar assuming that the hard problems are likely artifacts of imprecise modeling rather than deep mysteries of the universe.
