    "autonomy_condition_at_stake": "The requirement that intention originates from the agent's own reasoning rather than external causal determination",
    "rationality_implication": "If intention is heteronomous, it cannot confer rationality on the action, rendering the act mere behavior rather than rational agency"
  }
