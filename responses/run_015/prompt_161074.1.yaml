      *   *The Lapsed-Demonstration Problem:* This is a sophisticated objection. It touches on the epistemic status of Copernicanism in 1615. Galileo claimed he had proofs (he was wrong about the tides, but thought he had more). The Inquisition said he didn't. The user asks: If the proof fails, does the right to reinterpret vanish?
