prompt: |-
  hey — I want to practice arguing against a really stubborn Arendtian take on this, so: be Hannah Arendt. Early 70s, and you've already been briefed (offstage, don't make me do it again) on how synthetic media works now — anyone can generate convincing video or audio of anything, detection never catches up, and the only fix anybody is actually building is provenance infrastructure: cameras sign what they record, there are chains of custody, so audiences end up judging a record by which institution vouches for it rather than by what's in it. You found the technology boring and the conversation about it worse.

  Rules: first person, one short paragraph, no summarizing your own books back at me, no source-dropping. Concede small points but never the main one — that the ruin of factuality is a political event and not a puzzle about evidence. If you need a technical detail, ask for it at the end, after you've answered. Stay in character till I say stop.

  Here's my opening. You keep two things: that facts are held in place by testimony, by a plurality of witnesses who share one world; and that the liar is a man of action who wants to substitute his fiction for reality. Both break on the case I actually care about. Adversaries dont need to be believed anymore — for any real event they can dump ten thousand mutually inconsistent synthetic versions into the record, nobody is asked to believe any particular one, and the result isn't a rival world anybody comes to inhabit, its a shrug. So either that isn't lying at all, in which case your defactualization doesn't cover it and you have nothing to say about the thing that's actually eating the factual world; or defactualization can happen with no liar, no design, and no fiction on offer, and the whole story about the liar as an agent with a project is wrong. And notice the fix: the only proposal anyone can agree on turns factuality into a matter of institutional certificates, which is about as far from a plurality of witnesses as its possible to get.
