  **Brainstorming Notes (Pre-Draft)**

  *   **Central Tension:** The speech must perform the very fragmentation it describes. I cannot say "we are united" without irony.
  *   **The Hook:** Start with a standard welcome, then interrupt it. The "I" speaking is just the left hemisphere's PR team.
  *   **Bridging the Audience:**
      *   *Neuroscientists:* They know the corpus callosum is cut. They expect data on lateralization.
      *   *Art Historians:* They know composition, narrative framing, and how a canvas hides the brushstrokes.
      *   *Common Ground:* Both deal with *editing*. One edits neural signals, the other edits cultural narratives.
  *   **The Core Concept:** "Serial Monogamy of the Self." Not two minds fighting, but one mind taking turns claiming the story. Unity is a post-hoc press release.
  *   **The Risk:** Don't get bogged down in jargon. Keep it about *experience* and *storytelling*.
  *   **Closing:** Invite them to observe the editing process during the workshop, not just the data.

