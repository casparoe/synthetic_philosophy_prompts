  **Opening Remarks: "One Mind or Two?"**

  Good morning. Welcome, everyone.

  Actually… let me pause there. "Welcome." "Everyone." "We." It's tempting to start by assuming there's a unified "me" standing here, addressing a unified "you" out there, all of us sharing a single, coherent moment in time. It's the polite thing to do. It's also, if our topic today is any guide, potentially a fiction.

  The title of this workshop asks: "One Mind or Two?" It's the classic question. When the corpus callosum is severed, does the person become two subjects trapped in one skull? The neuroscientists in the room know the data better than I do. You've seen the tests. The left hand buttons the shirt, the right hand unbuttons it. One hemisphere wants coffee, the other wants tea.

  But I want to suggest that both sides of that debate—the "one" camp and the "two" camp—are missing a weirder, third option. Let's call it the "serial monogamy of the self."

  Here's the idea: Maybe there aren't two consciousnesses fighting for control. Maybe there's just one hemisphere—usually the left—that acts as a relentless biographer. It doesn't just experience the world; it actively rewrites the autobiographical record in real time. It smooths over the contradictions. It edits out the moments where the right hemisphere had a different intention. What looks like unity isn't a fundamental state of being; it's a retrospective editorial policy.

  Now, I know half of you are thinking about neural pathways, and the other half are thinking about narrative structure. That's actually perfect. Because if this theory holds, the neuroscientists are studying the *mechanism* of the cut, while the art historians are studying the *composition* of the cover-up. You're both looking at the same phenomenon: how a fragmented reality is framed to look like a whole picture.

  And I'm aware of the irony here. I am standing at a podium, using linear language, constructing a coherent argument, to tell you that coherence might be an illusion. My left hemisphere is currently working overtime to convince you that "I" am unified enough to open this workshop. It's doing exactly what I'm accusing it of: retrospective editing. It's smoothing over the glitches to deliver a clean speech.

  So, my invitation to you—for whatever "you" is listening right now—is this: Don't just look for the split today. Look for the stitch work. Don't just ask whether the mind is one or two. Ask yourself who is writing the report, and what got left on the cutting room floor.

  If we're right about this, then this workshop isn't a gathering of unified observers. It's a temporary alliance of narrators, trying to agree on a story before the next edit hits.

  So, let's begin. Or, at least, let whatever is driving me right now say: Let's begin.
