  hey — I'm a 3rd-year PhD student in epistemology, and I've been turning over a seminar paper on whether the KK principle really dies with luminosity. I want your number, not a literature survey. Please write in American English, and please dont give me footnotes, a reading list, or name-drops of papers — I've read the stuff, I want the reasoning.

  Setup so we mean the same thing. Standard anti-luminosity argument: a condition C is luminous iff whenever C obtains in a case, the subject in that case is in a position to know that C obtains. Add a margin-for-error premise — if you're in a position to know that C obtains in your case, then C obtains in every case that shares your total evidence with yours — build a long sorites of pairwise-indistinguishable cases running from clear-C to clear-not-C, and no non-trivial condition comes out luminous. Apply it to C = S knows that p, and since knowing p presumably puts you in a position to know p, KK goes.

  The bit I'm actually stuck on is a shortcut I've started calling the one-step argument, and I want to know how much weight to give it. Take a Gettier pair. In case α, S has evidence E, truly believes p on that basis, and knows p. In case β, S has exactly the same evidence E, still truly believes p, but is Gettiered and doesn't know. Now run the margin premise once instead of n times: if S were in a position to know in α that she knows p, then S knows p would have to obtain in β as well, which it doesn't. So no sorites needed — on any account where knowledge is fragile to Gettier-style luck, KK fails in perfectly ordinary, non-borderline cases. And notice the two places it can be blocked: if evidence is factive (roughly, your evidence is your knowledge), then α and β differ in evidence and the shortcut never leaves the ground; and if you read the margin premise in a reliabilist way — in a position to know implies C obtains in *most* nearby cases rather than *all* evidence-twins — then a single bad twin isn't enough and you're back to needing the full sorites.

  Here's the proposition I want a credence on: in a fully worked-out externalist epistemology that treats knowledge as true belief plus some anti-luck or safety condition, there are ordinary non-borderline cases in which a subject knows p but is not in a position to know that she knows p. Resolve it at the level of the argument, not by predicting what the field ends up accepting. I'm at about 0.72; my supervisor is at about 0.3, and I cant locate where the disagreement lives.

  Give me your own number, but mostly the decomposition — with a probability and one line of justification each:

  1. that the same-evidence relation is coarse enough for Gettier twins to count as indistinguishable (i.e., that evidence isn't factive in the way that would seperate them);
  2. that the margin-for-error premise is true in its universal form rather than a most-nearby-cases form;
  3. that the standard Gettier verdicts are data rather than artifacts of how the cases are described;
  4. that knowing something requires being in a position to know it, so failure of the second-order position really is failure of KK and not just failure of some stronger reflective condition;
  5. that there's no stable restricted survivor — e.g., KK confined to cases with no indistinguishable failure-case, or to subject matters where the luck gap can't open up.

  Then combine them, tell me which term your final number is most sensitive to, which single sub-question most likely explains the gap between me at 0.72 and my supervisor at 0.3, and what one argument or piece of evidence would move you the furthest. If you think a sub-question is missing from my list, add it and say why it carries weight.
