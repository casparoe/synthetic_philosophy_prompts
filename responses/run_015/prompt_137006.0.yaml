  Preliminary analysis
  Three readings dominate Chesterton's fence. First, epistemic humility: the fence exists for reasons we cannot see. Second, prescriptive traditionalism: longevity implies intrinsic value. Third, functionalism: preserve hidden utility. I set aside the first because, as you note, it collapses once the reason is known. I reject the second because it slides into dogma. The functionalist view fails when function expires. Therefore, I pursue a fourth reading: the fence as a disciplinary rule for the reformer, protecting the habit of inquiry itself rather than the specific arrangement. This avoids the trap of thinking knowledge of origin negates the obligation to preserve. This is the path I follow.

  The case for the second-order reading
  Burke describes society as a partnership between the dead, the living, and the unborn. Standard conservatism protects specific assets within this partnership. However, the deeper threat to this partnership is not specific errors, but the *temper* that treats inheritance as raw material for optimization. The second-order reading posits that Chesterton's fence is a rule of method designed to sustain a specific civic disposition: teleological humility. By forbidding removal until justification is understood, the rule compels the reformer to engage with the reasoning of ancestors. Even if that reasoning is now obsolete, the *act* of engaging preserves the continuity of judgment.

  If we discard practices immediately upon understanding their obsolete origins, we teach the living generation that institutions are merely tools for current ends. We sever the partnership. Retaining the practice, therefore, is not about the practice's utility, but about maintaining the institutional memory that society is not a machine to be tuned but a conversation to be joined. The fence protects the capacity to ask "what is this for?" ensuring that answerlessness does not default to destruction. It cultivates a citizenry capable of distinguishing between innovation and improvement. It ensures that the default stance toward inheritance is interrogation rather than deletion. It safeguards the political culture against the hubris of assuming our current utility functions are the final word on human arrangement. The practice survives not as a tool, but as a teacher of how to inhabit a tradition. Crucially, this capacity is fragile. If every obsolete fence is removed, the muscle of inquiry atrophies. We lose the habit of looking for reasons because we assume reasons must be current to be valid. The second-order fence insists that the *search* for reason is itself a constitutive good of the community. It prevents the reformer from becoming a tyrant of the present moment. By requiring us to understand the past before altering it, we acknowledge the past's claim on us. This is not nostalgia; it is epistemic discipline.

  The strongest objection and my reply
  The strongest objection is Kantian: retaining a known obsolete burden instrumentalizes participants. If we keep the fence solely to train character, we use complying students as means to an educational end, manufacturing pointless hurdles. This seems manipulative and dishonest to the autonomy of the agent. It commits us to the absurdity of inventing pointless burdens merely to build character.
  My reply distinguishes between manufacturing burdens and inheriting them. We are not inventing new fences; we are refraining from dismantling old ones. The moral weight lies in the transmission of a world that contains friction, not in the creation of friction. Furthermore, the end is not "character" in the abstract, but the preservation of the institution's epistemic culture. Removing the burden teaches that efficiency is the sole good. Retaining it teaches that membership involves accepting costs for continuity. The student is not a means, but a partner being invited into the full reality of the institution, burdens included. Consent to join the university implies consent to its inherited forms. To sanitize inheritance is to lie about the nature of tradition. The burden is not pointless; its point is to signify that the student belongs to something larger than their own convenience.

  The bound thesis
  Applied to the bound thesis: We know the purpose was access. Digital access solves this. A first-order Burkean defense fails. However, removing the binding requirement signals that the thesis is merely data. Keeping it forces the student to confront the thesis as a physical artifact of the university's history. It compels the question: "Why do we still do this?" In asking, the student engages with the institution's temporality. The cost of binding is the tuition paid for entering the generational partnership. It transforms the submission from a transactional requirement into a ritual of membership. We keep it not because paper is better, but because the ritual sustains the habit of treating academic work as a contribution to a permanent archive rather than a disposable credential. The physical object demands a different relationship than a file upload. This physical demand matters. It requires the student to acknowledge the library as a space of permanence. Thus, the obsolete practice preserves the serious disposition required for scholarship itself.

  Bottom line
  Conservatism is not the worship of ashes, but the guarding of the fire. Chesterton's fence, read second-order, guards the fire of inquiry. We keep obsolete practices not for utility, but to preserve the habit of questioning utility. This sustains the generational partnership against the tyranny of the present.
