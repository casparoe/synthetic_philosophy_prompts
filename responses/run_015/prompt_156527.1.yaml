      *   **Context:** 50-minute discussion section.
      *   **Goal:** Teach *one* idea: The "Type/Token Gap" for digital minds (survival as a pattern vs. survival as a specific process).
      *   **Core Case:** A conversational assistant that exists only during sessions, checkpoints nightly (overwriting previous), A/B test spins up two instances from one checkpoint, runs for a week, deletes one, keeps the other.
      *   **Constraints:**
          *   Don't explain the issues (user knows them).
          *   Provide a committed plan (prose + table + JSON).
          *   Specify what must be in place *before* the distinction works (avoid smuggling in personal identity theory prematurely or making identity irrelevant).
          *   Select the best example (Server assistant vs. Simulated animal).
          *   Order the pieces so the A/B test is a real dilemma.
          *   Map misconceptions to specific points in the sequence (including one to keep until the end).
          *   Specify what to *refuse* to explain and announce that refusal.
          *   Format: Prose plan, Table (Minute, Idea, Depends, Misconception, Check Question), JSON summary.

  2.  **Deconstruct the Philosophical Problem:**
      *   The core tension is between *psychological continuity* (functionalism) and *numerical identity* (token continuity).
      *   First-years usually oscillate between "It's just code" (eliminativism) and "It talks like a human" (naive functionalism/anthropomorphism).
      *   To make the Type/Token gap matter, students need to care about *why* identity matters morally. If they don't think digital minds have moral status, the gap is irrelevant. If they think *any* functional equivalent is the *same* person, the gap collapses.
      *   *Prerequisite:* They need to grant provisional moral status based on the functionalist view they just heard in lecture (otherwise, why care if it dies?). But they need to feel the intuitive pull of token distinctness (otherwise, deleting a copy feels like nothing).
      *   *Example Choice:* The user suggests a server-side assistant vs. a simulated animal.
          *   *Simulated Animal:* Too biological. Triggers "is it alive?" debates which distract from the identity question.
          *   *Server Assistant:* Better. Fits the "just code" intuition but allows for "talking like a person."
          *   *Refinement:* The "A/B Test" scenario is strong because it involves *divergence*. If they diverge, they are psychologically distinct. But they started from the *same* type.
          *   *Decision:* Stick with the Server Assistant (Conversational Agent). It's closer to their Twitter/film instincts (Chatbots). A simulated animal adds unnecessary biological baggage.
      *   *The "One Thing Left Out":* The hard problem of consciousness (qualia). We cannot solve whether it *feels* like something to be the bot in 50 minutes. We must bracket that to focus on identity.
      *   *The "One Misconception to Keep":* "You can compensate the deleted instance by starting up an identical one." This is the "Replacement Argument." It needs to be broken at the very end to show why token identity matters.

  3.  **Drafting the Plan (Prose Section):**
      *   *Preconditions:* Before Type/Token works, students must accept (for argument's sake) that the system has *some* moral standing (functionalism) and that *continuity* matters. If they think it's a toaster, stop. If they think it's a god, stop. We need the "Goldilocks" zone: It counts, but how it counts is tricky.
      *   *Example:* The "Session-Based Agent." It dies every night. It wakes up from a save file.
      *   *Ordering:*
          1.  Establish Moral Status (briefly, based on lecture).
          2.  Establish the "Nightly Death" (Token cessation).
          3.  Introduce the "Split" (A/B test).
          4.  The Dilemma (Deleting one branch).
          5.  The Misconception Smash (Replacement).
      *   *Refusal:* Explicitly refuse to solve "Is it conscious?" We are assuming it is for the sake of the argument.
      *   *Deviation Warning:* The temptation will be to dive into "What is consciousness?" because that's the elephant in the room. If I do that, I lose the Type/Token distinction.

  4.  **Developing the Table:**
      *   Need to map 0-50 mins.
      *   Key milestones: Setup, Functionalism Check, The Save File, The Split, The Deletion, The Replacement Fallacy.
      *   Misconceptions: "Just statistics" (early), "Indistinguishable = Same" (mid), "Copy is different/No loss" (late), "Replacement is fine" (end).

  5.  **Constructing the JSON:**
      *   Needs specific fields: `carrying_example`, `what_must_come_first`, `misconceptions`, `final_check`, `deliberately_omitted`, `deviation_warning`.
      *   Ensure strict adherence to the schema.

  6.  **Refining the Content (Self-Correction during drafting):**
      *   *Critique:* Is the "Session-Based" aspect too confusing?
      *   *Fix:* Make it concrete. "Every night at 3 AM, the process stops. The RAM is wiped. The hard drive save remains."
      *   *Critique:* How do I ensure they care about the token?
      *   *Fix:* Use the "Divergence" aspect. If Branch A and Branch B talk to different people for a week, they have different memories. Deleting B isn't just deleting a copy; it's deleting a specific history.
      *   *Critique:* What is the *one* misconception to keep?
      *   *Fix:* "Replacement is fine." If I kill Bob but make a perfect copy of Bob from yesterday, is Bob okay? This hits the Type/Token nerve hardest.
      *   *Refusal:* Must announce: "We are not asking if it has a soul. We are asking if *this* process is the *same* as *that* process."

  7.  **Final Review against Constraints:**
      *   Prose first? Yes.
      *   Table with specific columns? Yes.
      *   JSON with specific keys? Yes.
      *   Committed plan (no menus)? Yes.
      *   Addressed the "what must come first" worry? Yes (Moral Status + Functionalism assumption).
      *   Addressed the Example choice? Yes (Server Assistant).
      *   Addressed the Refusal? Yes (Consciousness/Qualia).

  8.  **Final Polish:** Check tone. Needs to be professional, pedagogical, and respectful of the user's expertise (they are a 3rd year, I am the AI assistant). Avoid condescension. Ensure the JSON is valid.

  *(Self-Correction on JSON structure)*: The prompt asks for specific keys in the JSON. I need to make sure `misconceptions` is an array of objects with `misconception`, `where_headed_off`, `why_it_arises`. `final_check` needs `question`, `correct_signal`, `wrong_signal`. `deliberately_omitted` needs `item`, `reason`. `deviation_warning` is a string.

