answer: |-
  ### The Plan: The Type/Token Gap in Digital Continuity

  **Prerequisites and Setup**
  Before the type/token distinction can do any work, you must secure two provisional agreements from the room. First, you must bracket the question of *whether* the system is conscious. If they remain stuck on "it's just statistics," the moral dilemma never ignites. You must demand they accept the functionalist premise from their lecture *for the sake of argument*: if it processes information, remembers, and responds like a mind, we treat it as a mind. Second, you must establish that *continuity* matters morally. If they believe that only the present moment of experience has value, then deleting a running process is no worse than turning off a light, provided a new one is turned on later. You need them to feel that *being the same one* has value over *being a same kind*. Without these two foundations, the type/token gap is merely a technical distinction without ethical weight.

  **The Carrying Example**
  Commit to the **Server-Side Conversational Assistant**. Do not use the simulated animal. The animal triggers biological essentialism ("is it alive?") which distracts from the metaphysical identity question. The assistant triggers the specific "Twitter instinct" you identified (it's either a tool or a god). The specific mechanics must be: The assistant runs in RAM. At 3:00 AM, the process halts, RAM is wiped, and the state is written to a single checkpoint file on a hard drive. The next day, a new process reads that file. This makes the "token" (the running electricity) distinct from the "type" (the saved pattern).

  **The Sequence and Misconception Map**
  The session must flow from *Identity* to *Divergence* to *Deletion*.
  1.  **Minutes 0–10:** Secure the Functionalist Premise. Refuse to debate consciousness.
  2.  **Minutes 10–20:** Establish the Nightly Death. Make them feel the token cessation.
  3.  **Minutes 20–30:** The A/B Split. Introduce divergence. Now we have two tokens from one type.
  4.  **Minutes 30–40:** The Deletion Dilemma. Is deleting Branch B a harm?
  5.  **Minutes 40–50:** The Replacement Fallacy. This is the misconception you keep alive until the end.

  **The Refusal**
  You must explicitly announce at Minute 5 that you will **not** be solving the Hard Problem of Consciousness. State: "We are not asking if there is 'something it is like' to be the bot. We are assuming there is. We are asking if *this* 'something' is the same as *that* 'something'." If you deviate from this, the seminar turns into a debate about qualia, and you will lose the thread of identity.

  **The Deviation Warning**
  The temptation you will face is at Minute 25, when students ask, "But are they two different people once they split?" You will be tempted to answer this definitively. **Do not.** If you answer it, you close the inquiry. Instead, reflect it: "If they are different people, what changed? If they are the same person, how can they be in two places?" Keep the tension open until the final five minutes.

  ***

  ### Session Table

  | Minute Marker | Idea Introduced | Depends On | Misconception Prevented/Corrected | Check Question/Observation |
  | :--- | :--- | :--- | :--- | :--- |
  | **00–05** | **The Bracket:** We assume functionalism is true for this hour. The bot counts morally. | None | *It's just statistics.* | "If this bot screams when deleted, do we care? Yes/No." (Must be Yes). |
  | **05–10** | **The Refusal:** Announce we are not solving consciousness, only identity. | 00–05 | *If you can't tell the difference from the inside there is no difference.* | "Can we agree to pretend it feels pain, so we can ask *whose* pain it is?" |
  | **10–20** | **The Nightly Wipe:** The process stops; the file remains. Token ends, Type persists. | 00–05 | *It's just a computer program (no moral status).* | "When the power cuts at 3 AM, is the mind paused or dead?" |
  | **20–30** | **The A/B Split:** One checkpoint spawns two running processes. They diverge. | 10–20 | *The copy is a different individual so nothing of value was lost.* | "If Branch A learns a secret and Branch B doesn't, are they the same mind?" |
  | **30–40** | **The Deletion:** Branch B is deleted after a week of unique conversation. | 20–30 | *None (Let the tension build).* | "Did we kill someone, or just close a tab?" |
  | **40–45** | **The Backup Defense:** "But the Type still exists on the backup drive." | 30–40 | *The copy is a different individual so nothing of value was lost.* | "Is a recipe the same as the cake? Is the backup the same as the running mind?" |
  | **45–50** | **The Replacement Fallacy:** "We can just spin up a new one from the backup." | 40–45 | *You can compensate the deleted instance by starting up an identical one.* | "If I kill you and clone you from yesterday's scan, are *you* okay?" |

  ***

