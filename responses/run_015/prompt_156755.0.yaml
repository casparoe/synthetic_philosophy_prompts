answer: |-
  # Research Proposal: Processual Constitution and the Modal Worm
  ## A Re-evaluation of the Statue and the Clay Paradox through Four-Dimensional Process Ontology

  **Project Duration:** Twelve Weeks
  **Target Output:** 5,000-word Research Essay
  **Subject:** Metaphysics / Philosophy of Art

  ### 1. Executive Summary

  The problem of material constitution, classically illustrated by the relationship between a statue and the clay from which it is moulded, remains one of the most persistent puzzles in contemporary analytic metaphysics. The standard formulation asks whether the statue and the clay are identical. If they are, they should share all properties; yet, the clay could survive being squashed while the statue could not. If they are not identical, we face the problem of coincident objects: two distinct things occupying the same space at the same time. Standard solutions—ranging from Lynne Rudder Baker's constitution view to David Lewis's four-dimensional perdurantism—typically treat the relation as static. They analyse the objects as they exist at a specific time *t*, comparing their modal profiles or temporal parts.

  This proposal outlines a project that seeks to bypass this static impasse by reframing the clay not as a three-dimensional lump coinciding with a statue, but as a four-dimensional process-object. In this view, the clay is understood as a 'modal worm' that includes within its ontology not just its actual history, but its potential for reshaping. Consequently, the statue is not a separate object coinciding with the clay, but rather a temporal-modal slice of a larger processual entity. The central research question is whether this process-based framing dissolves the coincidence problem or merely displaces the contradiction into the ontology of processes themselves.

  To test this hypothesis, the project will employ a comparative methodology, analysing the logic of this metaphysical framing against the practical criteria used by art conservators. When a painting undergoes heavy restoration, material parts are replaced while identity is preserved. This real-world analogue offers a testing ground for the modal conditions of identity proposed in the process view. Over twelve weeks, the project will move from a critique of standard static models to the construction of the process model, followed by the conservation case study, and finally to an evaluation of the model's coherence.

  The success of this project will be measured by its ability to demonstrate that a process ontology offers a distinct advantage over static constitution views in handling modal variance, without incurring prohibitive costs in ontological complexity. A failure would be defined as the realisation that the process view merely recapitulates the problems of standard four-dimensionalism or relies on an incoherent notion of 'modal potential' as an ontological constituent. This proposal argues that the project is ambitious but feasible within the semester timeframe, provided the scope remains tightly focused on the specific intersection of modality and process.

  ### 2. Introduction: The Static Impasse

  The puzzle of the statue and the clay is a staple of metaphysical inquiry because it strikes at the heart of how we understand objects, identity, and persistence. The intuition is straightforward: a sculptor takes a lump of clay and moulds it into a statue. Before the moulding, there is clay but no statue. After the moulding, there is both clay and a statue. If the statue and the clay are the same object, then by Leibniz's Law, they must share all properties. However, they appear to have different modal properties. The clay could survive being squashed into a ball; the statue could not. Therefore, by the Indiscernibility of Identicals, they must be distinct. Yet, they appear to be made of the same matter, in the same place, at the same time. This leads to the counter-intuitive conclusion of coincident objects: two things where there seems to be only one.

  For decades, metaphysicians have attempted to resolve this tension through various frameworks. Some deny the existence of the statue (nihilism). Some deny the existence of the clay as a distinct object (monism). Others, like Lynne Rudder Baker, argue for a constitution view where the clay constitutes the statue without being identical to it, relying on a relation of 'unity conditions' that are context-dependent. Still others, following David Lewis, adopt a four-dimensionalist view where objects are spacetime worms, and the statue and clay are distinct worms that share a temporal part.

  However, my tutor has correctly identified a limitation in these standard approaches: they largely treat constitution as a static relation between two things in the same place at one time. Even the four-dimensionalists, who acknowledge time, often treat the temporal parts as static slices stacked together. They analyse the coincidence at time *t* and then check the modal profiles to see if they diverge. This approach assumes that the 'clay' is a fixed entity with a set of modal properties that can be compared against the 'statue's' modal properties.

  This static framing ignores the dynamic nature of the material itself. My flatmate, who studies sculpture, remarked that a statue is just "potential clay realised differently." Philosophically, this sounds imprecise, perhaps even wrong. It risks conflating the material cause with the formal cause, or suggesting that the statue pre-exists in the clay in some mystical way. However, it points towards a genuine ontological insight: the clay is not merely a lump; it is a substance with a history of malleability and a future of potential states. The 'clay' is defined by what it *can do* as much as by what it *is*.

  If we take this intuition seriously, we must shift from a substance ontology to a process ontology. In a process metaphysics, the primary units of reality are not static things but events or processes. If the clay is a process, its identity is not fixed at a single time slice but is extended across time and modal space. The statue, then, is not a separate object that the clay 'hosts'; it is a specific phase or configuration of the clay-process. This reframing suggests that the contradiction arises only because we are trying to slice a continuous process into two static objects and then asking if they are the same.

  This proposal seeks to develop this intuition into a rigorous metaphysical argument. It posits that by treating the clay as a four-dimensional process-object that includes its own modal potential for reshaping, we can dissolve the coincidence problem. The question is no longer "Are they identical?" but rather "Is the statue a valid temporal-modal slice of the clay-worm?" This shifts the burden of proof from explaining coincidence to explaining the identity conditions of processes.

  The significance of this project lies in its potential to bridge the gap between abstract metaphysics and practical ontology. By incorporating the perspective of art conservation, where the identity of an object is constantly negotiated against material change, the project grounds the metaphysical theory in real-world application. If the process view can account for the intuitions of conservators regarding restoration and identity, it gains empirical traction that pure armchair metaphysics often lacks.

  ### 3. Statement of the Research Question

  To ensure the project remains focused within the twelve-week timeframe, the research question must be precise. It is not sufficient to ask whether process metaphysics is better than substance metaphysics generally. The inquiry must target the specific mechanics of the constitution problem.

  **Primary Research Question:**
  Does framing the clay as a four-dimensional process-object with inherent modal potential dissolve the problem of coincident objects in the statue and clay case, or does it merely displace the contradiction into the ontology of processes?

  **Sub-Questions:**
  1.  In what specific ways do standard static accounts (Constitution View, Mereological Essentialism, Standard Perdurantism) fail to capture the modal dynamics of the clay?
  2.  How can 'modal potential' be integrated into the ontology of a four-dimensional worm without rendering the object's boundaries indeterminate?
  3.  Does the logic of art conservation (specifically regarding restoration and material replacement) support the notion of the statue as a 'temporal-modal slice' of a larger process?
  4.  What are the ontological costs of adopting a process-based view of material constitution compared to standard accounts?

  The primary question is binary in structure (dissolve vs. displace), which allows for a clear conclusion. However, the nuance lies in the definition of 'dissolve'. A successful dissolution would mean that the apparent contradiction regarding modal properties vanishes because the properties are re-assigned to different parts of the process rather than to coincident wholes. A displacement would mean that we no longer argue about the statue and the clay, but now argue about where the process begins and ends, or what counts as a 'valid slice', which may be an equally difficult problem.

  The focus on 'modal potential' is crucial. Standard four-dimensionalism treats objects as extended in time, but it usually treats the modal properties (what could have happened) as external to the object's spacetime location. This proposal suggests that the 'clay-process' includes its modal branching as part of its ontological structure. This is a stronger claim than standard perdurantism. It suggests that the clay is not just the actual history of the lump, but the *field of possibilities* inherent in that lump. The statue is the actualisation of one path through that field.

  This framing directly addresses the flatmate's comment. When she says the statue is "potential clay realised differently," she is gesturing towards the idea that the statue is a realisation of the clay's potential. In standard metaphysics, 'potential' is not an ontological constituent; it is a way of speaking about possible worlds. In this project, I will investigate whether 'potential' can be treated as a constituent of the object itself, akin to a dispositional essentialist view. If the clay's potential to be a statue is part of what the clay *is*, then the statue is not an external imposition but an internal development.

  By narrowing the question to the *mechanism* of the solution (dissolution vs. displacement), the project avoids the trap of simply advocating for process metaphysics without testing its limits. The goal is not to prove process metaphysics is true, but to determine if it solves this specific problem better than the alternatives.

  ### 4. Critical Context: Limitations of Standard Accounts

  To justify the need for this new framing, I must first establish why the existing solutions are insufficient for this specific angle. This section of the research will analyse three dominant views: the Constitution View, Mereological Essentialism, and Standard Perdurantism.

  **The Constitution View (e.g., Baker)**
  Lynne Rudder Baker's constitution view is perhaps the most popular contemporary solution. She argues that the clay constitutes the statue, but they are not identical. They are distinct objects that share matter. The relation is asymmetric: the clay constitutes the statue, but the statue does not constitute the clay. This view relies on 'primary kind' properties. The clay's primary kind is 'lump of clay'; the statue's is 'statue'. These kinds have different persistence conditions.
  *Critique:* The constitution view treats the relation as static. It accepts the coincidence at time *t* as a brute fact. It does not explain *how* the clay becomes the statue in a way that respects the continuity of the material. It posits two objects where our intuition suggests one. Furthermore, it struggles with the modal intuition that the statue *is* the clay, just arranged differently. By positing two objects, it multiplies entities beyond necessity. My process framing challenges this by suggesting there is only one entity (the process) with different descriptions or slices. The constitution view leaves open the angle of *dynamic transformation*; it treats the statue and clay as co-existing entities rather than phases of a single history.

  **Mereological Essentialism (e.g., Chisholm)**
  This view holds that an object is identical to its parts. If you remove a part, the object ceases to exist. For the statue, this means if you chip off a piece of clay, the statue is destroyed. For the clay, it means if you remove a molecule, it is a different lump.
  *Critique:* This view is too rigid for the phenomenon of sculpture. Sculpture involves reshaping, which often implies the loss or rearrangement of parts without the destruction of the artwork. Mereological essentialism fails to account for the resilience of the statue's identity through minor changes. It also fails to capture the 'potential' aspect. It treats the object as a fixed sum of parts. It cannot accommodate the flatmate's intuition that the clay has the potential to be otherwise. It locks the object into its actual configuration.

  **Standard Perdurantism (e.g., Lewis)**
  David Lewis argues that objects are four-dimensional spacetime worms. The statue and the clay are distinct worms that share a temporal part (the part that exists while the statue is standing). Before the statue exists, the clay worm exists alone. After the statue is destroyed, the clay worm continues.
  *Critique:* While this view handles the temporal aspect well, it often treats the modal properties as external. Lewis uses counterpart theory to handle modality: the statue has a counterpart in another world that is squashed, but *this* statue does not. This keeps the modal properties distinct from the object's intrinsic nature. My proposal suggests that the 'clay' should be defined by its modal potential *intrinsically*. Standard perdurantism slices the worm temporally, but it does not necessarily slice it *modally*. It treats the actual history as the object. If we treat the clay as a 'modal worm' that includes its branching possibilities, we go beyond Lewis. Standard perdurantism leaves open the angle of whether the modal profile can be part of the object's constitution. It treats the coincidence as a sharing of temporal parts, but it does not explain the *unity* of the material across those parts in terms of potentiality.

  **The Gap**
  The common thread in these critiques is that they all treat the objects as having fixed identity conditions that are compared against each other. None of them fully embrace the idea that the identity of the material is *constituted* by its potential for change. They treat change as something that happens to the object, not something that defines the object. This project aims to fill that gap by proposing that the 'clay' is ontologically prior to the 'statue' not as a substance, but as a process of which the statue is a phase. The standard replies leave this angle open because they are committed to a substance ontology where objects are the primary bearers of properties. By shifting to a process ontology, we change the category of the bearer, which may change the logic of the paradox.

  ### 5. The Process-Modal Hypothesis

  The core of this project is the development of the 'Process-Modal Hypothesis'. This section outlines the theoretical framework I intend to construct and defend.

  **Defining the Process-Object**
  In this framework, the clay is not a 3-D lump existing at time *t*. It is a 4-D process extended through time. However, unlike standard perdurantism, this process is not just a line of actual events. It is a 'modal worm'. This means its ontology includes the dispositional properties of the material. The clay is defined by its malleability. To be clay is to be capable of being shaped. Therefore, the 'clay-object' includes within its boundaries the range of shapes it can take.
  This draws on Aristotelian potentiality but updates it with modern modal logic. The clay is a field of possibilities. The statue is the actualisation of a specific region of that field.

  **The Statue as a Temporal-Modal Slice**
  If the clay is the whole worm, the statue is a slice. But it is not just a temporal slice (like a time-slice in Lewis's view). It is a *modal* slice. It is the clay-process restricted to a specific set of properties (aesthetic form, rigidity, intention).
  This reframes the coincidence. They are not two things in the same place. They are the same thing described at different levels of granularity. The 'clay' is the macro-process; the 'statue' is a micro-phase.
  This dissolves the Leibniz's Law problem. We do not say "The clay can survive squashing and the statue cannot." We say "The clay-process has a phase (statue) that cannot survive squashing, and a subsequent phase (squashed lump) that can." The modal properties are distributed across the timeline of the process, not held simultaneously by two coincident objects.

  **Addressing the Contradiction**
  The risk, as noted in the research question, is displacing the contradiction. If the clay is a process, when does it start? When the mud is dug from the ground? When it is refined? When does it end? When it dries? When it is smashed?
  If the identity of the process is too loose, everything is everything. If it is too tight, we return to mereological essentialism.
  The hypothesis must define the 'identity conditions of the process'. I propose that the identity of the clay-process is maintained by *causal continuity of material* combined with *preservation of modal potential*. As long as the material can still be reshaped (even if it currently isn't), the process continues. The statue phase is a period where the potential is temporarily restricted (by the artist's intent or hardening), but the underlying process remains.
  This needs to be rigorously tested. Does 'preservation of modal potential' make sense? If the clay is fired in a kiln, it becomes ceramic. It loses the potential to be reshaped wet. Is it the same process? A standard view says no (new object). A process view might say yes (a new phase of the same material history). This is where the tension lies.

  **Why the Flatmate's Comment Matters**
  My flatmate's comment that a statue is "potential clay realised differently" sounds wrong to a philosopher because it mixes categories. 'Potential' is modal; 'realised' is actual. It sounds like saying "The acorn is the oak tree waiting to happen." But in process metaphysics, this is closer to the truth. The acorn *is* the process of becoming oak. Similarly, the clay *is* the process of becoming statue. The error in her statement is only linguistic; the ontological intuition is sound. The project will argue that her 'wrong-sounding' comment is actually a pre-theoretical grasp of process ontology that standard analytic metaphysics ignores. By formalising her intuition, we can bridge the gap between artistic practice and metaphysical theory.

  ### 6. Empirical Analogue: Art Conservation and Identity

  To prevent this project from becoming purely abstract speculation, I will use the field of art conservation as a testing ground. Conservation theory deals explicitly with the problem of identity over time and material change.

  **The Conservation Dilemma**
  When a painting is restored, parts of the original material are often lost or covered. Varnish is removed, tears are patched, missing paint is retouched (inpainting). At what point does the painting cease to be the 'original'?
  Conservators distinguish between 'material authenticity' and 'aesthetic/structural authenticity'.
  *   *Material Authenticity:* Focuses on the original physical stuff. (Corresponds to the 'Clay' view).
  *   *Aesthetic Authenticity:* Focuses the visual appearance and artist's intent. (Corresponds to the 'Statue' view).

  **Mapping to the Hypothesis**
  In the standard metaphysical view, these are two competing criteria for identity. In the process view, they are two aspects of the same conservation process. The painting is a process of 'being viewed and maintained'. The material is the substrate of the process.
  If we treat the painting as a process-object, then restoration is not replacing parts of an object; it is continuing the process of the object's existence. The 'same painting' persists not because the atoms are the same, but because the *process of preservation* is continuous.
  This mirrors the statue/clay case. The statue persists not because the clay is static, but because the 'sculpting process' (including the maintenance of the form) is continuous.

  **Case Study Method**
  I will examine specific case studies of heavy restoration (e.g., the restoration of Michelangelo's Sistine Chapel frescoes or the controversial restoration of Ecce Homo in Borja).
  *   *Question:* Did the identity of the work survive?
  *   *Standard View:* Debates focus on how much original material remains.
  *   *Process View:* Debates focus on whether the *continuity of the artistic process* was maintained.
  If the conservators act as if the painting is the same object despite material replacement, they are implicitly endorsing a process view. They treat the painting as a 'worm' that extends through the restoration event.
  This provides empirical weight to the metaphysical claim. If the logic carries over from conservation to the statue/clay case, it suggests that the process view aligns better with our practical engagement with objects than the static view does. We treat objects as processes in practice, even if we talk about them as substances in theory.

  **Limitations of the Analogy**
  I must also be critical of this analogy. A painting is not exactly a lump of clay. Paintings have a support (canvas) and layers. The 'clay' is more homogeneous. I will need to address whether the heterogeneity of the painting complicates the process view. However, the core logic of 'identity through material change' remains the same. The conservation angle serves as a control group for the metaphysical intuition.

  ### 7. Methodology and Work Plan (12 Weeks)

  The project will be executed over a twelve-week semester. The timeline is designed to allow for deep engagement with the literature in the first half, and constructive argumentation in the second half.

  **Weeks 1-3: Foundation and Critique**
