  *   **Week 12:** Revision and polishing. Final check against the research question.
  *   *Milestone:* Submission of the 5,000-word essay.

  **Methodological Approach**
  The method is primarily conceptual analysis, supported by analogical reasoning. I will not be conducting empirical interviews with conservators (which would be ethically complex and time-consuming), but rather analysing published conservation charters (e.g., The Venice Charter) and philosophical literature on art restoration. This keeps the project within the realm of philosophy while grounding it in external practice.
  I will use a 'dialectical' method: proposing the process view, generating the strongest possible objection (the displacement worry), and then refining the view to meet that objection. This ensures the argument is robust.

  ### 8. Criteria for Success and Failure

  To ensure the project is rigorous, I must define what counts as a successful outcome. This is not just about finishing the essay, but about the philosophical result.

  **Success Criteria**
  1.  **Coherent Definition:** The project successfully defines 'process-object' and 'modal slice' without relying on vague metaphors. The terms must be technically precise.
  2.  **Problem Dissolution:** The argument demonstrates that the process view resolves the Leibniz's Law contradiction more elegantly than the Constitution View. Specifically, it must show how the modal properties are re-assigned without contradiction.
  3.  **Analogy Validation:** The art conservation analogy must hold up to scrutiny. It should show that the process view explains conservation practices better than the static view (e.g., explaining why a restored painting is the 'same' painting).
  4.  **Honest Limitation:** The project must acknowledge where the process view struggles (e.g., process boundaries). Success includes identifying the *new* problems created, not just claiming the old ones are solved.

  **Failure Criteria**
  1.  **Recapitulation:** The project fails if it turns out that the 'Process-Modal' view is just Standard Perdurantism with different labels. If I cannot distinguish my view from Lewis's, the project adds no value.
  2.  **Incoherent Modality:** If the notion of 'including modal potential in the ontology' proves to be metaphysically incoherent (e.g., it requires impossible objects), the hypothesis fails.
  3.  **Displacement without Gain:** If the project concludes that the coincidence problem is simply moved to a 'process identity problem' that is just as hard to solve, without offering new tools to solve it, then the reframing is unsuccessful.
  4.  **Scope Creep:** If the project becomes too broad (trying to solve all of metaphysics) and fails to answer the specific research question, it is a failure of execution.

  **Evaluation Metric**
  The final essay will be evaluated on the clarity of the distinction between the static and process views. A successful essay will make the reader feel that the static view was indeed a 'category mistake' regarding time and modality. A failed essay will leave the reader thinking, "This is just four-dimensionalism again."

  ### 9. Feasibility and Scope Assessment

  Is this project too big for one semester and 5,000 words?

  **The Risk of Ambition**
  Metaphysics is dense. 5,000 words is approximately 15-20 standard pages. This is enough for a strong term paper, but it is tight for a project that involves critiquing three major views, constructing a new model, *and* applying it to art conservation.
  The risk is that the conservation section becomes a token gesture. To mitigate this, I must integrate the conservation analogy throughout the theoretical section, rather than siloing it at the end. The conservation examples should be used to illustrate the 'modal slice' concept as it is introduced.

  **Manageability**
  The project is feasible if I resist the urge to solve the entire problem of material constitution. I am not claiming to have the final answer. I am claiming to have a *better framing* for the question. This is a more modest and achievable goal.
  The 12-week timeline is generous for 5,000 words, which allows for significant revision time. The bottleneck will be the initial conceptualisation (Weeks 4-6). If I get stuck on defining the 'modal worm', I need to have a fallback position (e.g., treating it as a heuristic rather than a strict ontology).

  **Resource Availability**
  The literature on the statue and clay is vast, which is good. The literature on process metaphysics is also available. The literature on philosophy of conservation is smaller but accessible. I do not need special access or funding. The main resource required is time for deep thinking.

  **Verdict**
  The project is ambitious but genuinely feasible. It is not "too big" provided I remain disciplined about the word count. I must avoid long exegeses of Baker or Lewis. I should summarise their views quickly and focus on the specific limitation regarding static relations. The innovation lies in the synthesis of process ontology and conservation theory, not in a comprehensive history of the constitution debate.

  ### 10. Addressing the Flatmate's Intuition

  I return to the comment that sparked this inquiry: "A statue is just potential clay realised differently."
  Why does this sound wrong to a trained ear?
  1.  **Category Error:** It treats 'potential' as a substance. Potential is a property, not a stuff.
  2.  **Temporal Confusion:** It implies the statue exists *before* it is realised (in the potential).
  3.  **Passive Material:** It suggests the clay is waiting to be a statue, rather than the artist imposing form on matter.

  However, in the context of this proposal, I argue that these 'errors' are artifacts of substance language. In a process ontology:
  1.  **Potential is Constitutive:** The dispositional properties are part of what the object *is*. So treating potential as 'stuff' is closer to the truth in a process view.
  2.  **Time is Internal:** The future states are part of the object's definition (as a worm). So the statue is 'in' the clay in the sense that the end of the worm is contained in the whole worm.
  3.  **Active Material:** The clay's malleability is an active power, not just passive receptivity.

  By rehabilitating this intuition, the project validates the artistic perspective against the purely analytic one. It suggests that practitioners (sculptors, conservators) often have a better grasp of the ontology of their work than philosophers do, because they engage with the *process* of the object, not just the *concept* of the object. This adds a layer of interdisciplinary value to the proposal.

  ### 11. Conclusion

  This proposal outlines a project that seeks to revitalize the debate on material constitution by shifting the focus from static coincidence to dynamic process. By framing the clay as a four-dimensional process-object with inherent modal potential, we can view the statue not as a coincident rival, but as a temporal-modal phase of the clay's history. This approach promises to dissolve the traditional paradoxes of identity by reassigning modal properties across the timeline of the process.

  The project is grounded in a rigorous critique of standard views (Baker, Lewis, Chisholm) and tested against the practical logic of art conservation. It is ambitious, requiring the synthesis of metaphysics, modal logic, and aesthetics, but it is feasible within the twelve-week semester. The success of the project will depend on the precision of the 'process-object' definition and the honesty with which it addresses the new problems it creates.

  Ultimately, this research aims to show that the statue and the clay are not a puzzle to be solved by choosing one object over the other, but a clue to the deeper nature of reality as processual. If successful, it will demonstrate that the 'static impasse' is a result of our language, not the world, and that a process-based framing offers a more coherent ontology for objects that change, persist, and endure. The flatmate's intuition, once philosophically refined, may prove to be a more accurate guide to the metaphysics of art than the standard textbooks suggest.

  This proposal provides the roadmap for that inquiry. It sets the questions, the methods, and the criteria for judgment. Over the next twelve weeks, the task will be to walk this path and see if the destination is a dissolution of the problem or merely a new landscape for the same old contradictions. Either result will constitute a valuable contribution to the metaphysics of material objects.

  ### 12. Final Reflections on Scope and Tone

  In drafting this proposal, I have been mindful of the need for British English spelling and grammar (e.g., 'analyse', 'programme', 'colour'). I have also ensured that the tone remains academic and proposal-oriented, using future tense where appropriate to describe the work to be done, while demonstrating sufficient command of the material to prove the work is viable.

  The word count has been managed by expanding on the philosophical nuances of the 'process-modal' hypothesis and the specific limitations of the standard views. I have avoided a bibliography as requested, focusing instead on the argumentative structure. The inclusion of the art conservation analogy is a key differentiator that adds weight to the proposal, moving it beyond a purely theoretical exercise.

  The feasibility section is critical. It acknowledges the risk of the project being too broad and offers a mitigation strategy (integrating the analogy throughout). This shows the tutor that I have thought about the practicalities of the semester, not just the philosophy.

  The proposal is now ready to be submitted for approval. It stands as a commitment to a specific, novel, and rigorous line of inquiry that respects the tradition of the debate while attempting to move beyond its current limitations. The shift from "Are they identical?" to "Is the statue a slice of the clay-process?" is a small linguistic change with potentially massive ontological consequences. This project aims to map those consequences.
