  *   **Week 2:** Analysis of the Constitution View (Baker) and Mereological Essentialism. Identifying specific passages where they treat the relation as static.
  *   **Week 3:** Analysis of Standard Perdurantism (Lewis). Pinpointing the distinction between temporal parts and modal parts. Finalising the 'Critical Context' section.
  *   *Milestone:* Completion of the literature critique draft (approx. 1,500 words).

  **Weeks 4-6: Constructing the Process Model**
  *   **Week 4:** Developing the definition of the 'Process-Object'. Drawing on process metaphysics (Whitehead/Rescher) and dispositional essentialism.
  *   **Week 5:** Formulating the 'Temporal-Modal Slice' concept. Working through the logic of how modal properties are distributed across the slice.
  *   **Week 6:** Addressing the 'Displacement Objection'. Anticipating counter-arguments about process boundaries.
  *   *Milestone:* Completion of the theoretical framework draft (approx. 1,500 words).

  **Weeks 7-9: The Conservation Analogy**
  *   **Week 7:** Research into art conservation theory. Identifying key texts or interviews with conservators regarding identity and restoration.
  *   **Week 8:** Applying the Process Model to the conservation cases. Testing if the logic holds.
  *   **Week 9:** Refining the analogy. Addressing disanalogies between paintings and clay sculptures.
  *   *Milestone:* Completion of the case study section (approx. 1,000 words).

