  **JOINT STATEMENT OF ADVERSARIAL COLLABORATION**
  **Subject:** The Antiquity and Durability of National Attachments
  **Signatories:** The Modernist Caucus (MC) & The Ethno-symbolist Caucus (EC)
  **Date:** [Final Seminar Session]

  ### 1. Preliminary Stipulations on Scoring Nationhood

  Per the seminar requirements, we first address the three-part scorecard for nationhood: *(i) a bounded category of membership self-located by non-specialists; (ii) a claim to political sovereignty over a territory; (iii) a shared diachronic story making present sacrifices intelligible.*

  *   **Modernist Caucus (MC):** We accept this scorecard as the correct operational definition of the *nation*, distinct from earlier ethnic or dynastic formations. We note, however, that on this scorecard, no unit scores positively prior to the era of print capitalism and the modern state. If we were scoring "political legitimacy" alone, we would prioritize administrative capacity; if scoring "cultural affinity," we would prioritize linguistic similarity. But for *nationhood*, this scorecard is accepted.
  *   **Ethno-symbolist Caucus (EC):** We accept this scorecard as the correct definition of the *political form* nations take in the modern era. We note, however, that criterion (iii) cannot be satisfied without pre-modern myth-symbol complexes. If we were scoring "collective identity" broadly, we would include units lacking (ii) sovereignty claims. But for the specific phenomenon of modern *nationalism*, this scorecard is accepted.

  **Agreement:** All subsequent claims proceed on the assumption that this three-part scorecard is the metric for success.

  ### 2. Agreed Claims (Consensus Section)

  *Note on Redaction: During drafting, the following claims were flagged as vacuous and removed: (1) "Nationalism is a significant historical force." (Reason: Tautological given the evidence base; does not distinguish our theories.) (2) "Culture plays a role in politics." (Reason: Too broad to be falsifiable.) (3) "People feel strongly about their identity." (Reason: Restates criterion (i) without explaining mechanism.)*

  The following claims are signed by both MC and EC:

  1.  **The Infrastructure Lag:** Based on Regularity (a), we agree that a mass shift in self-ascription (criterion i) is never instantaneous. It follows the establishment of vernacular print markets, rail networks, mass schooling, or conscription by a lag of approximately one generation.
  2.  **The Symbolic Constraint:** Based on Regularity (b), we agree that successful national movements rarely coin entirely new symbols ex nihilo. They almost invariably adopt names, battles, saints, or legal districts that possess prior historical resonance. Attempts to build nationhood on purely administrative novelties (e.g., colonial provinces) fail to generate durable attachment once the administrative apparatus is removed.
  3.  **The Plasticity of Memory:** Based on Regularity (c), we agree that national memory is malleable enough to accommodate a complete shift in self-ascription within two generations. By the third generation, the newer identity is treated by members as if it were immemorial, regardless of its actual date of origin.
  4.  **The District Prediction (1900):** Regarding the stipulated case of two adjacent districts matched on dialect, confession, and customary law pre-1850, where District A acquires a rail junction, vernacular press, and teacher-training college and District B does not: We agree that by 1900, District A will score positively on the nationhood scorecard, while District B will remain localized or regional in self-ascription.
  5.  **The State Dependence:** We agree that the maintenance of criterion (ii) (sovereignty claim) and the dissemination of criterion (iii) (diachronic story) require institutional support. Without a state or a state-seeking movement sustaining the infrastructure, the rate of transmission for the national story declines.

  ### 3. Table of Residual Disagreements

  | Topic | Modernist Caucus Position | Ethno-symbolist Caucus Position | The Crux | Stipulated Evidence / Case |
  | :--- | :--- | :--- | :--- | :--- |
  | **The Menu (Regularity b)** | The use of old names/saints is **exploitation of cheap material**. Pre-existing symbols are merely focal points for coordination; any symbol could work if the infrastructure were strong enough. Continuity of the menu is not continuity of the nation. | The use of old names/saints is **selection from a pre-existing ethnie**. The infrastructure activates a dormant bond; without the pre-modern substrate, the infrastructure builds only a fragile administrative habit. Continuity of the menu signals continuity of the bond. | Is the pre-modern symbol a *constitutive cause* or a *facilitating condition*? | Regularity (b): Novel administrative units decay; historical units persist. |
  | **Reversal & Genuineness (Regularity c)** | A tradition known to be invented is **no less genuine** after two generations. The "invention" is a one-time event; the resulting attachment is real. Knowledge of construction does not inherently erode the capacity for sacrifice. | A tradition known to be invented is **less capable of demanding sacrifice**. If the diachronic story (criterion iii) is exposed as a recent fabrication, the "sacred" quality required for blood sacrifice degrades, even if the identity persists socially. | Does *knowledge of construction* degrade the *capacity for sacrifice*? | Regularity (c): Grandchildren treat second identity as immemorial. |
  | **The District Prediction (1991)** | **District A will decay.** Once the state withdraws in 1991, the infrastructure (schools, press) collapses. Without the apparatus that created the nation, the attachment dissolves within a generation, reverting to local or supranational identities. | **District A will persist (conditionally).** If the infrastructure successfully tapped a deep myth-symbol complex during the active period, the identity becomes self-sustaining. If it relied only on administrative fiat, it will decay. | Is the nation *parasitic* on the state or *incubated* by it? | Hypothetical Case: State withdrawal in 1991. |
  | **The Debunking Implication** | **Second-order affirmation.** If constructivism is taught for 30 years, attachments will take a civic form. People will affirm the nation *knowing* it is constructed ("We choose to be one"). Attachments will not erode but will change quality. | **Erosion of the sacred.** If constructivism is taught for 30 years, the diachronic story (criterion iii) loses its truth-claim. Sacrifice becomes unintelligible. Attachments will erode or become purely instrumental. | Can a nation survive the **demystification of its own origins**? | Implication: Teaching the constructivist account in schools for 30 years. |

  ### 4. Verbal vs. Substantive Disputes

  We identify two areas where our disagreement is partially verbal, stemming from divergent definitions of "continuity."

  1.  **Continuity of Form vs. Continuity of Substance:** The EC argues that because the *name* and *symbol* persist from pre-modern times, there is continuity of the *ethnie*. The MC argues that because the *political function* and *mass self-ascription* are new, there is discontinuity of the *nation*. We agree this is largely a taxonomic dispute regarding the threshold for the word "nation." However, it becomes substantive when predicting durability (see Table, Row 3).
  2.  **"Invention" vs. "Reinterpretation":** The MC uses "invention of tradition" to describe the *systematic fabrication* of links to the past. The EC uses "reinterpretation" to describe the *modern coding* of existing links. Both agree the links are coded modernly. The dispute is substantive only if the *pre-existence* of the link adds causal power to the modern movement (see Table, Row 1).

  ### 5. Falsification Conditions (Closing Statements)

  **Modernist Caucus:**
  Our position would be fundamentally altered if we observed the successful formation of a durable nation satisfying the three-part scorecard on a purely **administratively novel unit** that lacked any pre-modern name, saint, battle, or customary law district, provided that the administrative apparatus was subsequently withdrawn. If a "Colonial Province X" with no prior ethnic resonance maintained a sovereignty claim and a diachronic story demanding sacrifice for two generations after the colonial state left, we would have to concede that infrastructure alone can generate deep ethnicity. Additionally, if the teaching of constructivist history led to a measurable, rapid collapse in willingness to pay taxes or serve in the military across diverse regimes, we would have to concede that the "mystery" is functional, not incidental.

  **Ethno-symbolist Caucus:**
  Our position would be fundamentally altered if we observed a durable nation satisfying the three-part scorecard that **successfully severed all ties to pre-modern ethnic material** without decay. If a state could sustain a sovereignty claim and a story of sacrifice for three generations using only rational-legal symbols (e.g., "The Constitution" or "The Plan") with no reference to ancestral blood, soil, or myth, we would concede that the *ethnie* is unnecessary. Furthermore, if populations that shifted identity twice in two generations (Regularity c) showed no increase in cynicism regarding the second identity—specifically if they remained equally willing to die for the second identity as the first despite knowing it was a recent imposition—we would have to concede that the "immemorial" quality of the past is irrelevant to the reality of the bond.
