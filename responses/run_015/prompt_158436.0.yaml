answer: |-
  Anna mails a letter to Ben explicitly promising to deliver a package by Friday, but the letter is lost in transit forever, leaving Ben permanently unaware of the commitment. Anna resides in a community that recognizes binding agreements only when mutually acknowledged, treating unilateral declarations as non-binding expressions of intent. Anna fails to deliver the package, but Ben never expected it, suffers no harm or disappointment, and no third party learns of the lapse to damage Anna's reputation.

  (i) A reliance-based account denies obligation because Ben formed no expectations and altered no plans based on Anna's word, so no harm results from disappointment; a social-practice account denies obligation because the community's conventions do not recognize unilateral declarations as creating binding rules, leaving Anna without a institutional role that generates duties. (ii) A normative-powers account holds that Anna has genuinely altered her normative position because the act of promising is an exercise of a moral power to self-bind, creating an obligation through the intentional undertaking of a duty regardless of external uptake or consequences. (iii) The precise structural feature allowing this view to generate obligation is the promisor's **illocutionary intention to incur an obligation**, which operates as a volitional act that changes normative relations independently of social recognition. (iv) If that feature is removed—if Anna merely predicts she will send the package ("I will send") without intending to bind herself—she retains her liberty to change her mind and owes no performance. (v) A defender of the reliance view would attack the scenario as illegitimately rigged, arguing that the concept of "promising" is constitutively social and communicative; by stripping away the possibility of reliance and communal recognition, the thought experiment destroys the very phenomenon it claims to test, rendering the word "promise" an empty label rather than a functional normative tool.
