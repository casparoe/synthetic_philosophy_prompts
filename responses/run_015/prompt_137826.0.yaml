answer: |-
  **Ontological Admission Procedure (OAP)**

  **1. Direct Capture Check**
  Is there a specific field where this is recorded at the source?
  *   **Yes:** Proceed to 2.
  *   **No:** Mark as **Inferred**. Proceed to 2, but require higher evidence thresholds.

  **2. The Shuffle Test (Identity Conditions)**
  If we swap the criteria for this entity with a plausible rival definition (e.g., changing a time threshold or logic), do downstream analytics change significantly?
  *   **No Change:** **Hard Stop.** You have a model slot, not an entity. Reject.
  *   **Change:** Proceed to 3.
  *   *(Identity Conditions: rules that make a thing itself rather than something else)*

  **3. Portability Check**
  Does this entity maintain identity across hospitals with different documentation habits and EHR configurations?
  *   **No:** **Hard Stop** for Shared Ontology. Keep as local property.
  *   **Yes:** Proceed to 4.

  **4. Kind vs. Property (Two Ontologies Check)**
  Can we model this as an attribute of an existing entity (e.g., `Admission`) without losing predictive power? If two different ontologies yield the same predictions, do not add the new kind.
  *   **Yes:** **Hard Stop.** Do not reify (treat an abstract concept as a concrete thing) as a new kind. Use a property.
  *   **No:** Proceed to 5.

  **5. Ethical/Observer Handoff**
  Does defining this entity change the behavior it measures (observer effect) or assign moral blame?
  *   **Yes:** **Handoff to Governance.** This is policy, not data. Require explicit policy approval.
  *   **No:** **Admit.**

  ***

  **Application to Live Cases**

  **1. Medication Non-Adherence (Refill Gaps)**
  *   **Analysis:** Fails Shuffle Test. Our previous entity tracked our reminder system, not patient behavior. Changing the refill gap definition changes the "entity" entirely, proving identity conditions are unstable. It is sensitive to our internal processes, not the patient's reality.
  *   **Decision:** **Reject as Entity.** Demote to `non_adherence_score` (Derived Score) on Patient.
  *   **Defense:** "This isn't a thing we found; it's a calculation we did. If we change the math, the 'thing' changes. That means it's a metric, not an object."

  **2. Caregiver Burden**
  *   **Analysis:** Fails Portability and Kind vs. Property. Inferred from free-text notes which vary wildly by clinician verbosity and site culture. It is a state of the `Caregiver`, not a distinct clinical event like an `Encounter`.
  *   **Decision:** **Reject as Entity.** Add `burden_level` property to Caregiver profile.
  *   **Defense:** "Hospital A writes novels in notes; Hospital B writes fragments. If we make this an entity, we are codifying documentation style, not caregiver stress. Keep it as a property of the person."

  **3. Avoidable Admission**
  *   **Analysis:** Fails Kind vs. Property and Ethical Handoff. It is a judgment on an `Admission`, not a new object. Reifying it implies factual certainty we lack. It assigns blame (Ethical Handoff).
  *   **Decision:** **Reject as Entity.**
  *   **Leadership Argument:** Do not say "it's not real." Say: "Reifying this creates liability. If we codify 'Avoidable' as a hard entity, we assert accuracy we cannot prove during audits. Regulators punish incorrect data heavier than missing data. Instead, create a `review_flag` property on Admission. This satisfies the regulator's need to track cases without betting the platform on a definition that will change next year. We track the *question*, not the *verdict*."

  ***

  **Limitations**

  This procedure cannot stop political mandates where compliance outweighs truth. It assumes downstream users care about semantic stability more than convenient labels. It cannot fix upstream data quality; it only refuses to cement errors into the schema. Finally, it misfires when the bureaucracy requires a "thing" to bill against, even if that thing is philosophically hollow; in those cases, mark it as `BillingArtifact` to signal it is a financial slot, not a clinical truth. It also cannot resolve disputes where two sites fundamentally disagree on what constitutes the phenomenon; in those cases, the ontology must fragment, and the procedure defaults to "Do Not Share."
