      *   **Methodology:** Case studies (Neural readout, Self-deception, etc.). Distinguish *avowal* from *attribution*.
      *   **Possible Outcomes:**
          *   Outcome A: Absurdity vanishes (Supports Pragmatic/Transparency hybrid).
          *   Outcome B: Absurdity remains (Supports Doxastic Incoherence).
          *   Outcome C: Absurdity changes type (Supports a nuanced view).
      *   **The "Architecture" Question:** Advise on scaling it back.
