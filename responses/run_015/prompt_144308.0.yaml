  ### **Branch A: Realist**
  *(Theorists who believe a substantial self exists prior to or outside of narrative.)*

  #### **Node 2A: Source of Unity**
  **Claim:** *"What primarily binds this independent self into a unified identity over time?"*

  1.  **"The integration of autobiographical memories."** → Go to Node 3A-1
  2.  **"Predictive-processing dynamics that stabilize a self-model."** → Go to Node 3A-2
  3.  **"Social-recognition practices and interpersonal norms."** → Go to Node 3A-3

  #### **Node 3A: The Gravity Metaphor**
  **Claim:** *"The 'gravity' in 'center of narrative gravity' denotes a literal dynamical attractor in cognitive state-space."*

  *   **3A-1 (Memory + Gravity Claim):**
      *   **AGREE:** 🚩 **INCOHERENT.** (If the self is a concrete entity independent of narrative, it does not require a dynamical attractor generated by narrative processes to exist.)
      *   **DISAGREE:** **Lockean/Standard Realist.** (The narrative describes the real self; "gravity" is merely illustrative speech.)
  *   **3A-2 (Predictive + Gravity Claim):**
      *   **AGREE:** 🚩 **EMPTY/UNLIKELY.** (Rare to combine substance realism with predictive processing self-models.)
      *   **DISAGREE:** **Dual-Aspect Realist.** (Real self exists, but is accessed via predictive models.)
  *   **3A-3 (Social + Gravity Claim):**
      *   **AGREE:** 🚩 **INCOHERENT.** (Social practices recognize the self; they do not create a dynamical gravity well for a pre-existing substance.)
      *   **DISAGREE:** **Hegelian/Social Realist.** (The self is real, but actualized through social recognition.)

