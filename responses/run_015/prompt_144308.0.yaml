  **Course:** Philosophy of Mind Graduate Seminar  
  **Topic:** Narrative Identity and Dennett's Deflationism  
  **Handout Type:** Decision Tree Analysis  

  Below is a decision tree designed to sort competing interpretations of Daniel Dennett's "center of narrative gravity" thesis. The nodes are phrased as concrete claims. To navigate the tree, determine whether a theorist would agree or disagree with each claim. At the leaves, you will find the associated philosophical view, along with flags for incoherent combinations or indistinguishable positions.

