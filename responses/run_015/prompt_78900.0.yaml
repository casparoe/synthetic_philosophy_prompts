      *   **Constraints:**
          1.  No reciting standard summaries (must go deeper than "reasons are holistic").
          2.  Closed-book/library-free (no citations, no name-dropping, self-contained).
          3.  Must use the provided handout material (Stipulation + 3 Cases).
          4.  Specific requirements for the question content (fixed features, adjudicate cases 1 & 2, diagnose case 3, assess generalist hedging).
          5.  Length/Pitch: Upper-level undergrad, ~50 mins answer time, Model Answer ~700 words.
          6.  Marking Scheme: 25 marks total, specific moves, characteristic errors.
          7.  Closing Note: Boundary between A and B.
          8.  No specific author/text presuppositions.

  2.  **Deconstruct the Handout Material:**
      *   *Stipulation:* Holism = feature valence changes. Generalism = feature valence fixed (reversals explained by enabling/disabling conditions).
      *   *Case 1 (Cello):* Enjoyment = Reason For.
      *   *Case 2 (Torturer):* Enjoyment = Reason Against.
      *   *Instruction:* Treat "agent enjoyment" as the *same feature* in Cases 1 & 2.
      *   *Case 3 (Colleague):* Past generosity (factual vs. feigned). Same evidence, different underlying reality. Trust vs. Don't Trust.
      *   *Required Question Elements:*
          1.  What must be held fixed for holism to be substantive (not verbal)?
          2.  Do Cases 1 & 2 support holism?
          3.  What is wrong with Case 3 (as a holism example)?
          4.  Can the generalist save their view via hedged principles (exception clauses)?

  3.  **Drafting the Question:**
      *   Need to present the stipulation and cases clearly within the prompt so it's self-contained.
      *   Need to structure the sub-questions to match the convenor's instructions.
      *   *Draft:* "Consider the following stipulation and cases... [Insert Material]. (a) Explain what must be held fixed... (b) Assess Cases 1 & 2... (c) Diagnose Case 3... (d) Evaluate the generalist's hedging strategy."
      *   *Refinement:* Make it flow better as a single coherent essay prompt rather than distinct sub-questions, to encourage synthesis. But given the marking scheme requirements, distinct parts might be easier to grade. Let's aim for a hybrid: A main prompt with four specific tasks.

  4.  **Drafting the Model Answer:**
      *   *Word Count:* ~700 words.
      *   *Tone:* Analytical, precise, no names (e.g., no "Dancy," "McNaughton," "Kant").
      *   *Content:*
          1.  *Identity of Features:* To avoid verbal trickery, the feature must be described non-evaluatively (thin description). "Enjoyment" works; "Pleasure in suffering" does not.
          2.  *Cases 1 & 2:* These support holism. The feature "agent enjoyment" is identical in description but flips valence based on the *kind* of act (music vs. torture). It's not just an enabling condition; the context changes the normative force.
          3.  *Case 3:* This is *not* holism. It's an epistemic error or a change in the factual base. If the generosity is feigned, the feature "past generosity" isn't actually present, only "evidence of generosity." If we hold the *fact* fixed, the reason doesn't change. If we hold the *evidence* fixed, it's about justification vs. truth. It fails the "same feature" test.
          4.  *Generalist Hedging:* The generalist can say "Enjoyment is a reason unless it's torture." But this makes the principle trivial or action-guidingly useless. It loses the explanatory power of principles. It turns the principle into a mere list of cases.
      *   *Check:* Does this meet the "no name-dropping" rule? Yes. Does it address all four points? Yes.

  5.  **Drafting the Marking Scheme:**
      *   *Total:* 25 Marks.
      *   *Breakdown:*
          1.  Feature Identity/Non-evaluative description (5 marks).
          2.  Analysis of Cases 1 & 2 (5 marks).
          3.  Diagnosis of Case 3 (5 marks).
          4.  Generalist Hedging/Triviality Objection (5 marks).
          5.  Structure/Clarity/Argumentation (5 marks).
      *   *Characteristic Errors:* Need specific common mistakes for each.
          1.  Confusing thick/thin descriptions.
          2.  Claiming torture enjoyment is a different feature.
          3.  Treating epistemic uncertainty as normative variance.
          4.  Accepting hedged principles without criticizing their utility.
          5.  Disorganized or citation-heavy.

  6.  **Drafting the A/B Boundary Note:**
      *   Focus on synthesis vs. listing. A answers connect the points (e.g., how Case 3's failure illuminates Case 1's success). B answers treat them as separate checklist items.

  7.  **Review and Refine:**
      *   *Constraint Check:* The prompt asks for *my* question to be written based on the handout. I need to make sure I don't just copy the handout text but integrate it into the exam paper format.
      *   *Word Count Check:* Model answer needs to be tight. 700 words is roughly 1.5 single-spaced pages. I need to be concise.
      *   *Tone Check:* Ensure it sounds like an exam paper (formal, clear instructions).
      *   *Marking Scheme:* Ensure the "one-line note" on errors is included.

      *(Self-Correction during drafting Model Answer)*: I need to be careful with Case 3. The prompt says "In one case you know this; in the other... evidence is misleading." The feature is "past generosity." If it's feigned, the feature *isn't there*. So the reason changes because the *fact* changes, not the valence of the fact. That's the key diagnosis.
      *(Self-Correction on Generalism)*: The prompt asks if they can have "everything a principle was ever supposed to provide." The answer should be "No," because principles are supposed to guide action *ex ante*, and a principle with infinite exceptions doesn't guide.

      *(Refining the Question Text)*: I will embed the stipulation and cases directly into the question paper text so the student has everything they need.

      *(Refining Marking Scheme)*: Make sure the marks add up to 25 exactly.

  8.  **Final Polish:** Check against the "no name-dropping" rule one last time. Ensure the distinction between "feature identity" and "valence" is clear.

      *Let's write it.*
answer: |-
  **Examination Question**

  **Unit:** Metaethics
  **Section:** Moral Particularism and Generalism
  **Time Allowed:** 50 Minutes
  **Marks:** 25

  **Question 1**

  Consider the following stipulation and cases provided in your course materials:

  > **Stipulation:** *Holism about reasons* claims that a feature which is a reason of a given valence for an action in one case may be a reason of the opposite valence, or no reason at all, in another case. *Generalism* denies this: it holds that a feature's valence is fixed wherever the feature occurs, and that any apparent reversal is always to be explained by some further feature acting as an enabling or disabling condition.
  >
  > **Case 1:** You have a free afternoon and could spend it practising the cello, which you enjoy. The fact that you would enjoy it is a reason in favour of doing it.
  > **Case 2:** A torturer enjoys inflicting pain on a victim, and the fact that he would enjoy it is a reason against his doing it.
  > *(Treat 'the act would be enjoyable by the agent' as the same feature in both cases.)*
  > **Case 3:** A colleague has, as a matter of fact, always behaved generously towards you. In Scenario A you know this; in Scenario B you have exactly the same evidence about her past behaviour, but the evidence is misleading and her past generosity was feigned. The handout presents this as a reversal: the feature is a reason to trust her in A and a reason not to trust her in B.

  Write an essay that addresses the following four points:
  1.  Specify precisely what must be held fixed regarding the description of a 'feature' for the holism claim to be substantive rather than a verbal trick.
  2.  Adjudicate whether Cases 1 and 2 successfully support the holist claim, given your answer to point 1.
  3.  Diagnose the specific error in presenting Case 3 as an instance of holism.
  4.  Evaluate whether a generalist can preserve the utility of moral principles by adopting hedged universals with long exception clauses.

  ***

  **Model Answer**

  For the debate between holism and generalism to be substantive, the identity of the 'feature' under discussion must be held fixed independently of its normative valence. If we describe features using 'thick' evaluative terms (e.g., 'cruelty' or 'kindness'), the valence is built into the description, making valence reversal impossible by definition. To avoid this verbal trick, features must be described in 'thin,' non-evaluative terms, such as 'causing pain' or 'agent enjoyment.' Only if the non-normative description remains constant while the normative force flips can we say holism is true.

  Under this constraint, Cases 1 and 2 provide strong support for holism. In both instances, the feature is identically described as 'the act would be enjoyable by the agent.' In Case 1 (cello), this feature counts in favour of the action. In Case 2 (torture), it counts against it. A generalist might argue that 'torture' acts as a disabling condition that flips the valence of enjoyment. However, the holist argues that the context of torture does not merely disable the reason; it inverts it. The enjoyment is not merely *neutralized*; it becomes evidence of moral corruption, actively contributing to the wrongness. Since the non-evaluative feature (enjoyment) is identical, yet its contribution to the overall moral status shifts from positive to negative, this suggests the valence is not intrinsic to the feature but dependent on the context.

  Case 3, however, fails to support holism. The handout claims the feature is 'past generosity.' In Scenario A, the colleague is generous. In Scenario B, the generosity is feigned. If the generosity is feigned, the feature 'past generosity' is not actually present; only 'evidence of past generosity' is present. If we hold the *fact* of generosity fixed, the reason to trust remains constant (even if we are mistaken about it). If we hold the *evidence* fixed, we are discussing epistemic justification, not normative reasons grounded in facts. Therefore, Case 3 describes a change in the factual landscape or an epistemic error, not a reversal in the valence of a single existing feature. It conflates the reason for belief with the fact believed.

  Finally, the generalist may attempt to rescue their position by proposing hedged principles: 'Enjoyment is a reason for action, unless the action is torture, or malicious, or...' While logically possible, this strategy surrenders the primary function of moral principles. Principles are intended to guide action and explain moral status *ex ante*. A principle riddled with infinite, disjunctive exception clauses becomes a mere list of verdicts rather than a guiding rule. It offers no predictive power to the agent facing a novel situation, as they cannot know which exception clause applies without already knowing the moral verdict. Thus, while the generalist can technically maintain that valences are fixed by adding endless caveats, they cannot thereby preserve the explanatory or action-guiding utility that principles were supposed to provide. Holism better captures the context-sensitive nature of moral reasoning without rendering moral theory trivial.

  ***

  **Marking Scheme**

  **Total Marks: 25**

  **1. Feature Identity and Description (5 Marks)**
  *   **5:** Clearly distinguishes between thick (evaluative) and thin (non-evaluative) descriptions; establishes that features must be described neutrally to test valence variance.
  *   **3:** Identifies the need for fixed descriptions but fails to distinguish clearly between evaluative and non-evaluative language.
  *   **0:** Claims features are inherently valenced or ignores the description problem.
  *   *Characteristic Error:* Treating 'torture' as the feature rather than 'enjoyment,' thereby begging the question against holism.

  **2. Adjudication of Cases 1 & 2 (5 Marks)**
  *   **5:** Argues that enjoyment is the same feature in both; explains why the generalist's 'disabling condition' reply is insufficient to explain the *inversion* of valence.
  *   **3:** Accepts the cases support holism but relies on the generalist's 'disabling' explanation without critique.
  *   **0:** Claims the cases describe different features (e.g., 'healthy enjoyment' vs 'sadistic enjoyment').
  *   *Characteristic Error:* Re-describing the feature in Case 2 to include the wrongness, effectively denying the stipulation.

  **3. Diagnosis of Case 3 (5 Marks)**
  *   **5:** Identifies that 'feigned generosity' means the feature is absent; distinguishes between factual reasons and epistemic evidence.
  *   **3:** Notes the feature is different but conflates the evidence with the fact.
  *   **0:** Accepts Case 3 as a valid example of holism.
  *   *Characteristic Error:* Treating the agent's evidence as the reason itself, rather than the fact the evidence points to.

  **4. Generalist Hedging and Principle Utility (5 Marks)**
  *   **5:** Argues that hedged principles are logically possible but practically trivial; highlights the loss of action-guidance or explanatory power.
  *   **3:** Argues hedged principles are too complex but admits they might still work theoretically.
  *   **0:** Claims hedged principles are logically impossible or fully successful.
  *   *Characteristic Error:* Assuming that because a principle *can* be written, it still functions as a principle.

  **5. Structure, Clarity, and Constraints (5 Marks)**
  *   **5:** Essay flows logically; no names/citations used; adheres to word limit and time constraints.
  *   **3:** Logical flow is present but includes minor citations or name-dropping.
  *   **0:** Disorganized, cites authors, or ignores the closed-book constraint.
  *   *Characteristic Error:* Name-dropping (e.g., Dancy, McNaughton) despite explicit instructions not to.

  ***

  **Note on Grading Boundaries (A vs. B)**

  The boundary between an A (20-25) and a B (15-19) lies in **synthesis versus segmentation**. A B-grade answer will treat the four required points as a checklist, addressing them sequentially without connecting them. An A-grade answer will demonstrate how the failure of Case 3 (factual variance) illuminates the success of Cases 1 & 2 (normative variance), and will link the definition of 'features' in part 1 directly to the critique of 'hedged principles' in part 4 (showing that if features are context-sensitive, principles cannot simply list exceptions). The A answer treats the prompt as a single coherent argument; the B answer treats it as four short questions.
