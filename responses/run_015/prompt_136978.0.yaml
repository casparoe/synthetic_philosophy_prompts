      *   Application to AI: An agent $A_1$ wants to create $A_2$. $A_1$ needs to prove $A_2$ is safe. If $A_2$ uses the same logic as $A_1$, $A_1$ needs to prove $A_1$'s logic is sound to trust $A_2$. It can't.
