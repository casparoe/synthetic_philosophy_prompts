          7.  Identify which elements are philosophically committed vs. underdetermined.
      *   **Constraints:** No bibliographies/citations. Polished, integrated analysis. Step-by-step reasoning (internal brainstorming first, then final output).

  2.  **Brainstorming & Systematic Planning:**

      *   *Institutional Mechanisms:* Post-hoc audits, Standard Operating Procedures (SOPs), authorization hierarchies, compliance-based training, disciplinary matrices.
      *   *Descriptive vs. Normative:*
          *   Descriptive: People follow rules to avoid blame; harm happens anyway.
          *   Normative: Following rules *ought* to exonerate; deviating *ought* to punish.
      *   *Rival Theories of Responsibility:*
          *   Deontological (Rule-based/Duty-based): Focus on adherence to universalizable or institutional maxims.
          *   Consequentialist: Focus on outcomes (harm prevention).
          *   Virtue Ethics: Focus on character/phronesis (practical wisdom).
          *   Care Ethics: Focus on relational responsiveness.
          *   Legal Positivism/Role Morality: The "office" dictates the morality, separate from private conscience.
      *   *Arendt's Connection:*
          *   Descriptive: Eichmann followed rules, didn't think, caused evil. (The audit *sees* this behavior).
          *   Normative: Eichmann was guilty *because* he didn't think. (The audit *rewards* this behavior).
          *   Tension: The institution operationalizes the *condition* of the banality of evil while codifying it as *virtue*.
      *   *Objection/Defense:* The "Systemic Stability" defense. If everyone exercised independent judgment, chaos would ensue. Predictability is a moral good in administration.
      *   *Design Changes:* Training needs scenarios, not checklists. Audits need "reasonableness" standards, not just "compliance" standards. Culture needs psychological safety for deviation.

  3.  **Drafting - Section by Section:**

      *   **Introduction:** Define the phenomenon ("procedural innocence"). State the thesis: The practice presupposes a specific, narrow theory of agency that conflates institutional legitimacy with moral validity, effectively inverting Arendt's normative critique while relying on her descriptive insight.
      *   **Implicit Theory of Agency:** Analyze the "bureaucratic moral immunity." It treats the agent as a conduit, not a source. Responsibility is externalized to the rule-maker. This collapses role-duty into total moral accountability (if I did my job, I am good).
      *   **The Arendtian Paradox:** This is the core. Arendt said "thoughtlessness" is the danger. The audit says "thoughtlessness" (compliance) is the safety. This is a normative inversion. Is it incoherent? Not necessarily, if one adopts a specific defense (Legal Positivism/Role Morality).
      *   **Compatibility with Other Ethics:** Can Virtue or Care Ethics fit? No, not the *current* structure. They require internal deliberation as a metric. The current structure *excludes* inner deliberation as irrelevant data. It *requires* external conformity.
      *   **Consistency & Defense:** Is it incoherent? It's coherent within a framework of "Order over Outcome." The defense is predictability and the separation of powers (legislators make rules, executors follow them). This is a Hobbesian/Weberian defense, not an Arendtian one.
      *   **Institutional Redesign:** What changes if we take Arendt seriously?
          *   Training: Case studies, moral imagination.
          *   Audit: "Reasonable deviation" clauses.
          *   Culture: Whistleblowing as duty, not treason.
      *   **Underdetermined Elements:** Some things (like record-keeping) are neutral. The *use* of the records is what's philosophically loaded.

  4.  **Refining and Polishing (Self-Correction during drafting):**

