prompt: |-
  You are a professional philosopher with expertise in political theory, moral psychology, and institutional ethics. Before constructing your answer, take a moment to brainstorm systematically: identify the concrete institutional mechanisms at stake, distinguish descriptive from normative claims, list the rival theories of responsibility you will need to compare, and anticipate the strongest objection to your reconstruction.

  Consider the institutional practice—common in government agencies, corporations, and large administrative bodies—of evaluating employee conduct after harmful outcomes through a protocol-adherence audit. In this audit, investigators ask primarily whether the actor followed approved standard operating procedures and whether they held formal authorization to deviate. If protocol was followed, the actor is typically cleared regardless of whether they exercised independent moral judgment about the human consequences of their actions; if they deviated without authorization, they face severe discipline, even when the deviation was intended to prevent harm. Concurrently, these organizations often mandate ethics-training modules that treat moral competence as mastery of compliance checklists rather than as the cultivation of judgment, imagination, or attentiveness to others. Some organizational ethicists have recently labeled the implicit standard here procedural innocence: the idea that conformity to internal rules functions as a complete moral shield, producing what might be called bureaucratic moral immunity.

  What philosophical commitments about moral agency, responsibility, and the nature of wrongdoing does this practice presuppose? Reconstruct its implicit theory: does it treat rule-following as sufficient for moral innocence? Does it collapse the distinction between institutional role-duty and personal moral accountability? Examine specifically whether the practice relies on Hannah Arendt’s descriptive account of Adolf Eichmann and the phenomenon she analyzed as the banality of evil—the emergence of catastrophic harm not from monstrous intent but from unreflective bureaucratic routine—while simultaneously rejecting her normative claim that the failure to think, and to imagine the standpoint of others, is itself the core moral failure.

  Distinguish rigorously between what the practice strictly requires and what it merely accommodates. Could a virtue-ethical framework emphasizing practical wisdom, or a care-ethical framework emphasizing relational attentiveness, license the same audit structure? Or does the practice necessarily exclude any view that makes responsibility depend on the quality of inner deliberation rather than on external conformity?

  Then assess consistency. Arendt criticized Eichmann precisely for an inability or refusal to think from another’s standpoint, yet the protocol-adherence audit rewards the kind of unthinking compliance she described and punishes unsanctioned independent judgment. Is the practice therefore philosophically incoherent—adopting Arendt’s diagnosis descriptively while inverting it normatively? Or can it be defended by appealing to a legal-positivist separation of role-duty from private conscience, or to some other framework?

  Finally, specify what would have to change in institutional design—training content, investigation criteria, disciplinary standards, and organizational culture—if the body genuinely adopted Arendt’s normative position rather than merely operationalizing her descriptive one. Identify which elements of current practice are genuinely committed to a specific philosophical view and which are philosophically underdetermined, compatible with several rival theories.

  Write a polished, integrated analysis. Do not provide bibliographies, reading lists, or citations. Proceed step by step.
