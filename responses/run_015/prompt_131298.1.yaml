  We should fund the restoration and designate the bread oven a protected heritage site. The Monumental standard, which fits Precedent 1 (founder statue), funds history that inspires through great individuals or events, predicting rejection of the oven due to its lack of heroic association. The Critical standard, which fits Precedents 2 and 4 (cholera plaque and dictator portraits), removes history that harms life, predicting acceptance but not mandating funding since the oven causes no harm. The Antiquarian standard, which fits Precedent 3 (cathedral upkeep), preserves old structures that maintain continuity and present utility, predicting approval and funding. I recommend following the Antiquarian standard because the oven's weekly use mirrors the cathedral's concerts and market, satisfying the statutory goal of history for life through continued community function rather than heroic memory. A further case distinguishing these rules would be a proposal to fund an ancient ruin no longer used by anyone; the Antiquarian standard would fund it for its age, while the Monumental and Critical standards would reject it for lacking inspiration or present utility. Precedent 3 is the closest analog, and adopting approval embraces the principle that living utility justifies heritage protection, whereas adopting rejection embraces the principle that only heroic significance warrants public funding.
