answer: |-
  # MAXWELL'S DEMON: AN EXORCISM DECISION TREE
  **Instructions:** Start at **Q1**. Follow the arrows based on your physical intuition. Ignore famous names until you hit a leaf. This map traces *where* you think the entropy debt is paid, not *who* said it.

  ---

  ### Q1. LAW STATUS
  **Is the Second Law of Thermodynamics absolute or statistical?**
  *   **Statistical** (Violations possible, just unlikely) $\rightarrow$ Go to **Q2**
  *   **Absolute** (Violations impossible, ever) $\rightarrow$ Go to **Q3**

  ### Q2. FLUCTUATION SCOPE
  **If statistical, is the Demon just a rare fluctuation or a structural loophole?**
  *   **Rare Fluctuation** (Demon is just lucky noise) $\rightarrow$ **LEAF A**
  *   **Structural Loophole** (Small systems behave differently) $\rightarrow$ **LEAF B**

  ### Q3. ENTROPY BOUNDARY
  **To save the Absolute Law, whose entropy budget must balance?**
  *   **Gas Only** (Demon is external agent) $\rightarrow$ Go to **Q4**
  *   **Gas + Demon Memory** (Demon is part of system) $\rightarrow$ Go to **Q5**
  *   **Global History** (Include whoever built the demon) $\rightarrow$ Go to **Q6**

  ### Q4. ONE-SHOT CASE
  **Single molecule, one cycle, no reset. The gas cools. Is this a violation?**
  *   **Yes, Violation** (Law is broken) $\rightarrow$ **LEAF C**
  *   **No, Measurement Cost** (Looking heated the gas) $\rightarrow$ **LEAF D**
  *   **No, Deferred Debt** (Cost comes later) $\rightarrow$ *Inconsistent with "Gas Only"* $\rightarrow$ **UNOCCUPIED 1**

  ### Q5. RESET NECESSITY
  **Must the demon return to its initial state to close the cycle?**
  *   **No** (Correlation is enough) $\rightarrow$ Go to **Q7**
  *   **Yes** (Memory must be cleared) $\rightarrow$ Go to **Q8**

  ### Q6. HEIRLOOM CASE
  **Demon inherits a perfect tape (pre-correlated). When is the entropy debt paid?**
  *   **At Creation** (Preparation cost) $\rightarrow$ **LEAF E**
  *   **At Usage** (Reading cost) $\rightarrow$ **LEAF D**
  *   **Never** (Free lunch) $\rightarrow$ **LEAF C**

  ### Q7. CORRELATION VALUE
  **Does mutual information between gas and demon count as negative entropy?**
  *   **Yes** (Info converts to work directly) $\rightarrow$ **LEAF F**
  *   **No** (Must be thermalized first) $\rightarrow$ **LEAF G**

  ### Q8. COLD-TAPE CASE
  **Tape is erased at $T/10$. Is the cost per bit $kT \ln 2$ or $k(T/10) \ln 2$?**
  *   **$kT \ln 2$** (Cost is logical/fixed) $\rightarrow$ **LEAF H**
  *   **$k(T/10) \ln 2$** (Cost is thermal/scales) $\rightarrow$ **LEAF G**
  *   **Zero** (Info isn't physical) $\rightarrow$ *Inconsistent with "Reset Yes"* $\rightarrow$ **UNOCCUPIED 2**

  ---

  ## THE LEAVES (POSITIONS)

  **LEAF A: Boltzmann Fluctuation**
  *   **Verdict:** No exorcism needed.
  *   **View:** 2nd Law is statistical. Demon is just a rare fluctuation that will eventually reverse.
  *   **Budget:** Gas only (on average).

  **LEAF B: Small-System Stat Mech (?)**
  *   **Verdict:** Law modified, not broken.
  *   **View:** 2nd Law holds only for $N \to \infty$. Single molecules obey Jarzynski equality, not Clausius.
  *   **Budget:** Ensemble average.

  **LEAF C: Naive Realist**
  *   **Verdict:** Demon wins.
  *   **View:** 2nd Law is absolute but false. Perpetual motion is possible.
  *   **Budget:** Gas only.

  **LEAF D: Szilard Exorcism**
  *   **Verdict:** Exorcised by Measurement.
  *   **View:** Acquiring information dissipates $kT \ln 2$. Erasure is free.
  *   **Budget:** Gas + Measurement Device.

  **LEAF E: Preparation Exorcism (?)**
  *   **Verdict:** Exorcised by History.
  *   **View:** The debt was paid when the demon/tape was manufactured. Current cycle is clean.
  *   **Budget:** Global History.

  **LEAF F: Information Thermodynamics**
  *   **Verdict:** Exorcised by Correlation.
  *   **View:** Mutual information is a thermodynamic resource. $W \le kT I$. No erasure needed if correlation is consumed.
  *   **Budget:** Gas + Memory (Joint).

  **LEAF G: Thermalist (Norton)**
  *   **Verdict:** Exorcised by Heat.
  *   **View:** "Information" is just a label for physical states. Cost is always thermal, never logical.
  *   **Budget:** Gas + Memory (Thermal).

  **LEAF H: Landauer Exorcism**
  *   **Verdict:** Exorcised by Erasure.
  *   **View:** Measurement is reversible. Resetting memory is irreversible and costs $kT \ln 2$ regardless of $T_{erase}$.
  *   **Budget:** Gas + Memory (Logical).

  ---

  ## DIAGNOSTIC NOTES (For the Group Leader)

  **1. Unoccupied Logical Space**
  *   **UNOCCUPIED 1 (Q4 "Deferred" + Q3 "Gas Only"):** If the debt is deferred, it must be stored somewhere (memory). If the boundary is "Gas Only", you can't store it in the demon. This combination is incoherent accounting.
  *   **UNOCCUPIED 2 (Q8 "Zero" + Q5 "Reset Yes"):** If reset is required to close the cycle, but costs zero energy, you have a perpetual motion machine of the second kind. No serious position holds both.

  **2. Indistinguishable Leaves**
  *   **LEAF G (Thermalist) vs. LEAF H (Landauer):**
      *   *The Problem:* Both predict the same energy cost ($kT \ln 2$) in standard conditions.
      *   *The Split:* The **Cold-Tape Case (Q8)** attempts to separate them. If a student answers "Fixed Cost" (Landauer) but argues it *must* appear as heat eventually (Thermalist), the tree cannot distinguish their ontology. They agree on the physics, disagree on the metaphysics.

  **3. The Boundary Trap (Q3)**
  *   Most confusion in this group stems from Q3.
      *   **Gas Only** forces you to find a cost in the *measurement* (Szilard) or admit violation.
      *   **Gas + Memory** forces you to find a cost in the *reset* (Landauer) or *correlation* (Info Thermo).
      *   **Global History** pushes the cost to the *past* (Preparation).
      *   *Tip:* If students argue past each other, check if they are balancing different budgets.

  **4. The Cold-Tape Diagnostic (Q8)**
  *   This is the sharpest knife.
      *   If cost scales with $T_{erase}$, Information is just **Thermodynamics** (Leaf G).
      *   If cost is fixed to the *information* temperature $T$, Information is **Logical** (Leaf H).
      *   Standard Landauer Principle implies Leaf H, but many physicists intuitively feel Leaf G.

