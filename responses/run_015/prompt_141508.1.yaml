  The ledger lay open on the Formica, columns of figures marching down like soldiers off a cliff. Arthur tapped the paper with a pen capped in dried ink. Across from him sat Sal, Jenny, and the kid they called Rook. They looked like winners. They looked like people who'd accidentally stumbled into a vault and found the door unlocked.

  "It's noise," Sal said, stirring his beer. "Five different people, five different weeks. I didn't know Jenny was laying odds on the greyhound. Jenny didn't know Rook was hedging the quinella. Nobody Dutch-booked you, Artie. The market just breathed."

  "The market doesn't breathe," Arthur said. "It clears. This doesn't clear."

  He turned the page. The sums were red. Not because he'd lost on the day, or the week. But because if you added the liability of Bet 1 through Bet 900, the probability mass exceeded one hundred percent. He was selling certainty for less than the cost of certainty. It was an arithmetic bleed.

  "So I'm a thief now?" Jenny asked. She was holding a winning slip from Tuesday. "I asked for odds on the dog finishing in the top three. You gave me four-to-one. That's your line. That's your price."

  "It was a fair price," Arthur said. "Individually. Each ticket is actuarially sound. Standalone, I'd take that risk all day. But you don't underwrite standalone. You underwrite the book. And the book is a lie."

  "But you're still standing," Rook said. He was young, impatient, holding the slip for Bet 900. The last one. "Look, I get the math. You add them up, the vig eats you. But that's over the infinite run, right? That's the limit. You're not going to the limit."

  Arthur looked at his hands. They were spotted, thin. The cough had been wet for three months. "I die at nine hundred."

  "Exactly," Rook said. "So the loss that shows up at infinity… it doesn't show up for you. You expire before the tail risk kicks in. You're solvent until you're dead. Where's the irrationality in that?"

  "In the coherence," Arthur said. "Rationality isn't about surviving the night. It's about not holding a contradiction. I believe event A is forty percent likely. I believe event B is forty percent likely. I believe event C is forty percent likely. They are mutually exclusive. I am holding a belief system that says one hundred and twenty percent is possible. That is insanity. It doesn't matter if I die before the check bounces."

  "It matters to your heirs," Sal muttered.

  "There are no heirs. There's only the book." Arthur leaned forward. "You're arguing that because no one planned the con, the con isn't real. That intent sanitizes the math. If a tree falls on my house because the wind blew it, I'm still crushed. I don't get to claim the gravity was accidental."

  "Gravity works on time," Jenny said. "You're talking about a loss that requires a thousand years to compound. You're talking about a ghost loss."

  "It's not a ghost. It's in the structure." Arthur tapped Bet 412. "This one. This is where the probability mass tipped. Before this, the aggregation was within tolerance. After this, the book became incoherent. I accepted a premium that assumed independence where there was correlation. I priced risk as if the world was bigger than it is."

  "So undo it," Rook said. "Take back the money. Void the slip."

  "I can only take one back." Arthur looked at them. "That's the constraint. To restore coherence, to make the book honest again, I have to remove one wager. Just one. The rest stay. You keep your winnings. You keep your slips. But I need to know which one breaks the spine."

  Sal laughed, nervous. "Pick mine. I got the biggest payout."

  "It's not about the payout. It's about the axiom."

  "Pick mine," Rook said. "I'm the last one. I'm the one who pushes you over the edge into the grave. If you don't take my bet, you don't die at nine hundred. You stop at eight ninety-nine. You avoid the limit."

  "If I void your bet, I haven't fixed the book," Arthur said. "I've just stopped reading it. The incoherence is already there. Bet 1 through 899 still sum to greater than one. I'm still holding a contradiction. I'm just not adding to it."

  "Then pick the first one," Jenny said. "The original sin. Undo Bet 1. The whole chain collapses."

  "If I undo Bet 1, I invalidate the reasoning for Bet 2. But Bet 2 was fair on its own. They were all fair on their own. That's the trap." Arthur rubbed his eyes. "You want to know if I'm damned because a ghost booked me, or because I signed the slips. You want to know if I'm irrational because I won't live to pay the bill."

  He looked at Rook. "You asked if a loss in the limit makes me irrational now. If I hold a position that guarantees ruin eventually, am I a fool today?"

  "You're a fool if you think the limit matters," Rook said. "You're dead. Who cares?"

  "I care," Arthur said. "Because I'm an underwriter. My job isn't to stay alive. It's to price truth. If I leave this book as is, I'm saying the world allows for more than total certainty. I'm saying there's value in a logical impossibility."

  He picked up the pen. He hovered over the ledger.

  Sal shifted in his chair. "Artie, don't be stubborn. Take the big one. Take the money back from Sal. Buy yourself some time."

  "Time isn't the variable."

  Arthur circled a number. Not the first. Not the last.

  "Bet 412," Arthur said.

  "Why that one?" Jenny asked. "That was months ago. That was the mid-season finals."

  "Because that's where I stopped looking at the aggregate," Arthur said. "Before that, I was checking the book. After that, I started checking the slips. I started treating them as individual transactions instead of exposure units. I stopped being an underwriter and started being a cashier."

  "That doesn't fix the loss," Sal said. "You're still short on the total."

  "It fixes the logic," Arthur said. "The loss is inevitable either way. I'm dying. The money's gone. But if I remove 412, the remaining bets… they don't contradict each other anymore. They sum to less than one. There's room for uncertainty. Room for the world to be real."

  "So you lose the money either way," Rook said. "But if you pick 412, you die consistent."

  "I die coherent," Arthur corrected.

  He tore the page out of the ledger. He didn't hand it to anyone. He just laid it on the table, the ink still wet around the circle.

  "Keep your winnings," Arthur said. "All of you. The loss is mine. But the book stays honest."

  "It's not honest," Jenny said softly. "You're still losing."

  "No," Arthur said, closing the ledger. "The loss is real. The lie is gone."

  He stood up, the chair scraping loud against the tile. He looked at the stack of slips, the accidental con, the week-long drift into ruin. He didn't look at Rook's bet, the one that would have been the end. He looked at the space where 412 used to be.

  "Cash me out," Arthur said. "All of it. Whatever's left."

  "There's nothing left," Sal said. "You know that. The math says zero."

  "Then cash me out for zero," Arthur said. "But mark it paid."
