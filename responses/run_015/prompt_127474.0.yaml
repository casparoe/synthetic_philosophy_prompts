  2.  **Understand the Strategy-Stealing Argument (SSA):**

      *   *What is it?* A proof by contradiction used in combinatorial game theory.
      *   *Premise:* If the second player had a winning strategy, the first player could make an arbitrary opening move and then "steal" the second player's strategy for the rest of the game.
      *   *Key Conditions:*
