answer: |-
  # Audit Procedure: Strategy-Stealing Argument (SSA) Validity Checklist

  **Document ID:** REF-SSA-001
  **Authority:** League Referee Committee
  **Purpose:** To determine if the Strategy-Stealing Argument logically precludes a guaranteed Second-Player win in proposed deterministic perfect-information games.
  **Warning:** Validation of this checklist **does not** guarantee game balance, fairness, or a Draw outcome. It strictly establishes that the Second Player cannot possess a forced winning strategy.

  ---

  ## Phase 1: Game Class Verification
  *Before applying SSA, confirm the game falls within the domain of combinatorial game theory where SSA is defined.*

  | Step | Condition | Sufficient Evidence | Logical Branch |
  | :--- | :--- | :--- | :--- |
  | **1.1** | **Deterministic & Perfect Information** | Rules contain no randomizers (dice, decks) and all state is visible to both players. | **FAIL:** Halt. SSA inapplicable. <br> **PASS:** Proceed to 1.2. |
  | **1.2** | **Two-Player Zero-Sum** | Exactly two agents; one player's win is the other's loss (or mutual draw). | **FAIL:** Halt. <br> **PASS:** Proceed to 2. |
  | **1.3** | **Finite Termination** | Game must end in finite moves (no infinite loops). Check for repetition rules (e.g., Ko, 3-fold). | **FAIL:** Halt. Infinite games break the well-ordering required for SSA. <br> **PASS:** Proceed to 2. |

  ## Phase 2: Symmetry & Isomorphism Check
  *SSA relies on the ability of Player 1 (P1) to adopt Player 2's (P2) hypothetical winning strategy.*

  | Step | Condition | Sufficient Evidence | Logical Branch |
  | :--- | :--- | :--- | :--- |
  | **2.1** | **Initial State Symmetry** | Board layout, piece counts, and resource pools are identical for P1 and P2 at $t=0$. | **FAIL:** Halt. Asymmetry breaks the "stealing" premise. <br> **PASS:** Proceed to 2.2. |
  | **2.2** | **Move Isomorphism** | The set of legal moves available to P1 at $t=0$ is identical to the set available to P2 at $t=0$ (ignoring turn order). | **FAIL:** Halt. <br> **PASS:** Proceed to 2.3. |
  | **2.3** | **Win Condition Symmetry** | Victory conditions are identical (e.g., "connect opposite sides" must apply equally to both, not "P1 connects Top-Bottom, P2 connects Left-Right" unless the board is rotationally symmetric). | **FAIL:** Halt. <br> **PASS:** Proceed to 3. |

  ## Phase 3: Monotonicity & Zugzwang Check
  *SSA requires that having an "extra piece" or "extra move" on the board is never a disadvantage.*

  | Step | Condition | Sufficient Evidence | Logical Branch |
  | :--- | :--- | :--- | :--- |
  | **3.1** | **Move Monotonicity** | Adding a piece/resource to your own side never restricts your future legal moves or blocks your own win conditions. | **FAIL:** Halt. (e.g., games where pieces block lines). <br> **PASS:** Proceed to 3.2. |
  | **3.2** | **No Forced Zugzwang** | Players are never forced to make a move that worsens their position compared to passing. | **Evidence:** Existence of an explicit **Pass** move OR proof that every legal move maintains at least the current evaluation. | **FAIL:** Halt. If P1's "arbitrary opening move" forces a loss, SSA fails. <br> **PASS:** **SSA VALID.** |

  ## Phase 4: Halt Points (Human Judgment Required)
  *The procedure must terminate and defer to senior referees if any of the following are detected, as they break the logical isomorphism required for SSA.*

  1.  **Continuous Values:** If moves involve bidding continuous amounts (e.g., auctions), state isomorphism cannot be mapped discretely.
  2.  **Simultaneous Resolution:** If turns are not strictly alternating (e.g., real-time or simultaneous reveal), the "stealing" timeline collapses.
  3.  **Irreversible Resource Depletion:** If the opening move consumes a unique resource that P2 would need to execute the "stolen" strategy (e.g., a one-time power-up), the strategies are not interchangeable.

  ---

  ## Application to Proposals

  ### Proposal A: Symmetric Grid-Capture with Explicit Pass
  *   **Description:** Players place stones on a grid to capture opponent stones. Board is empty at start. Players may choose "Pass" instead of placing.
  *   **Audit Execution:**
      *   **Phase 1:** Passes (Deterministic, 2-player, finite via superko).
      *   **Phase 2:** Passes (Empty board is symmetric; move sets are identical).
      *   **Phase 3:**
          *   *Monotonicity:* Placing a stone generally increases control. (Assume no suicide rules that block own eyes).
          *   *Zugzwang:* **Explicit Pass move exists.** This satisfies Step 3.2 definitively. P1 can "pass" to effectively let P2 move first if that were advantageous, neutralizing the "extra move is bad" risk.
      *   **Conclusion:** **SSA VALID.**
      *   **Ruling:** The game **cannot** be a guaranteed Second-Player win. It is either a First-Player win or a Draw. Approved for further balance testing.

  ### Proposal B: Asymmetric Auction-Style Resource Depletion
  *   **Description:** Players bid for turn order. The winning bid amount is removed from a shared global pool. The winner moves first.
  *   **Audit Execution:**
      *   **Phase 1:** Passes.
      *   **Phase 2:** **FAIL at Step 2.1 (Initial State Symmetry).**
          *   *Reasoning:* While players start with equal funds, the *action* of bidding permanently depletes the shared pool. If P1 bids $X$, the state available to P2 is now (Pool - $X$). P2 cannot "steal" P1's strategy because P2 cannot replicate the state of having spent $X$ *before* the game begins while retaining the resources to execute the strategy.
      *   **Phase 4 Halt:** **Irreversible Resource Depletion.** The opening action changes the resource topology non-isomorphically.
      *   **Conclusion:** **SSA INVALID.**
      *   **Ruling:** The checklist halts. We cannot rule out a Second-Player win via SSA. Defer to empirical simulation and heuristic analysis.

  ### Proposal C: Symmetric "Territory-Control" Variant
  *   **Description:** Symmetric board, symmetric pieces. No pass move, but no obvious Zugzwang. SSA checklist passes all phases.
  *   **Empirical Data:** Top competitors report a 90% win rate for Player 1 in high-level play.
  *   **Audit Execution:**
      *   **Phase 1-3:** **PASS.** The game is symmetric, monotonic, and finite.
      *   **Logical Conclusion:** SSA proves **P2 cannot force a win.**
      *   **Observed Reality:** P1 forces a win consistently.
      *   **Conflict:** The checklist validates the *logic* (No P2 Win), but the League requires *balance* (High Draw Rate or 50/50 Win). The checklist gave a "Green Light" on SSA validity, which was misinterpreted as "Game is Fair."

  ---

  ## Case C Analysis: Procedure Failure & Judgment Call

  ### 1. What the Procedure Failed to Capture
  The SSA Checklist failed to capture **Computational Complexity Asymmetry**.

  The Strategy-Stealing Argument is an *existence proof*, not a *complexity proof*. It establishes that a winning strategy for P1 *exists* (or a drawing strategy for P2 exists), but it is silent on the **search depth** required to find it.

  In Proposal C, the state-space topology likely favors aggression.
  *   **P1 (Initiator):** Can execute a "pressure strategy" that requires shallow search depth ($O(d)$) to maintain an advantage.
  *   **P2 (Responder):** To hold a draw, P2 must find precise defensive moves that require significantly deeper search depth ($O(d+k)$) to neutralize P1's initiative.

  While a drawing line for P2 may exist mathematically (satisfying SSA), it is computationally intractable for human or even AI agents within time controls. The checklist verified that P2 *can* theoretically avoid loss, but missed that P2 *cannot practically* avoid loss due to the complexity gap.

  ### 2. Why the League Must Overrule the Checklist
  The League's mandate is **Competitive Viability**, not just **Logical Consistency**.

  *   **Checklist Output:** "SSA Valid. Second-Player Forced Win Impossible."
  *   **League Interpretation Risk:** Administrators may equate "No P2 Forced Win" with "Game is Balanced."
  *   **Reality:** "No P2 Forced Win" allows for "Guaranteed P1 Win."

  **The Judgment Call:**
  We must **REJECT** Proposal C despite the SSA checklist passing.

  **Justification:**
  1.  **SSA $\neq$ Balance:** The audit procedure only filters out games where P2 has an inherent advantage. It does not filter out games where P1 has an inherent advantage. A game that is a theoretical First-Player Win is as undesirable for a league as a Second-Player Win.
  2.  **Tempo as Structural Bias:** In Proposal C, the "extra move" P1 gets is not just a neutral additive resource (as SSA assumes); it is a **Tempo Advantage** that compounds. The checklist assumes monotonicity of *pieces*, but fails to account for monotonicity of *initiative*.
  3.  **Precedent:** Accepting a game because "SSA says P2 can't win" while ignoring empirical P1 dominance sets a dangerous precedent where mathematical technicalities override competitive integrity.

  **Action:** Flag Proposal C as **"Theoretically Sound, Competitively Broken."** Require the designers to introduce a balancing mechanism (e.g., Komi, pie rule, or resource handicap) that explicitly addresses the First-Mover Advantage, rather than relying on the SSA to imply fairness.
