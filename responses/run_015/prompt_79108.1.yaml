answer: |-
  There is no canonical term in philosophy, but the most precise coinage for this move is **Temporal Immunity**.

  This move differs from an ordinary auxiliary hypothesis because it reduces empirical content rather than adding complexity. An *ad hoc* rescue pays a price in simplicity (e.g., "famine will occur *unless* technology improves"), whereas Temporal Immunity pays nothing because it merely stretches the verification window without altering the mechanism. It differs from a theory that is simply unfalsifiable because it mimics falsifiability; it makes a specific claim about the world ("famine is coming") that *appears* risky, but the risk is retroactively neutralized by treating time as a free parameter rather than a fixed constraint.

  The principled line between "genuinely early" and "permanently deferred" rests on whether the time horizon was specified *ex ante*. If a predictor commits to a specific date or range before the fact, missing it requires a theory update; if they merely imply "soon" without definition, they retain Temporal Immunity by default. In the Malthus case, the defender is conflating the validity of a *mechanism* (population pressure) with the accuracy of a *rate* (yield vs. growth). A mechanism can be real without being determinative if other variables offset it.

  This distinguishes the fallacy from a reasonable hedge like the knee replacement doctor. The doctor's prediction is based on calibrated wear rates; if the knee lasts twenty years longer due to improved materials or biology, a honest doctor updates the rate. If the doctor insists the replacement is still imminent despite decades of non-wear without adjusting the model, they are employing Temporal Immunity. The move is only valid if the delay is explained by a identifiable temporary blocker; if the delay is attributed to nothing but the passage of time itself, the theory has been insulated from reality rather than refined by it.
