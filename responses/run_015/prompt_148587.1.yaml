  # Exam Prompt and Constraints

  **Course:** PHI 405: Personal Identity and Ethics
  **Time Allocation:** 90 minutes total examination time (recommended 40 minutes for this question)
  **Marks:** 25 marks
  **Expected Word Count:** Approximately 1,200 words

  **Question:**
  Derek Parfit argues that personal survival is grounded not in bodily continuity but in "Relation R": psychological continuity and/or connectedness, provided it has the "right kind of cause." Standard objections focus on spatial discontinuity (e.g., the Mars teletransporter). However, consider the **Gradual Replacement Teletransporter (GRT)**: Over twelve months, every biological neuron in a subject's brain is replaced, one at a time, by a synthetic functional analogue. Each replacement preserves all psychological connections; consciousness never lapses; the replaced biological tissue is destroyed. At the end, no original biological substrate remains.

  Your friend argues that Parfit's Relation R clearly implies survival here, as the causal chain is reliable and continuous. You suspect the "right kind of cause" clause hides an ambiguity: does reliability require spatiotemporal continuity of *matter* (substrate), or merely functional preservation?

  Write an essay addressing the following:
  1.  Does the subject survive the GRT process according to Relation R? Justify your answer by analyzing whether the causal chain in GRT satisfies the "right kind of cause" requirement without presupposing substrate continuity.
  2.  Evaluate the proposal of **Relation R***, which supplements Relation R with a substrate-continuity constraint. Does adopting R* rescue the intuition that matter matters, or does R* collapse into a traditional Biological/Bodily Continuity view?
  3.  Explain how the GRT scenario differs from the standard instantaneous teletransporter case regarding the "branching problem," and discuss whether this difference strengthens or weakens the case for Relation R over R*.

  # Model Answer

  According to Parfit, personal survival is grounded in Relation R: psychological continuity and/or connectedness, provided it has the "right kind of cause." In the Gradual Replacement Teletransporter (GRT), psychological continuity is undeniable; memory, character, and intention persist without interruption. The crux is the causal condition. Parfit defines the right kind of cause broadly to include any reliable cause producing psychological continuity, explicitly rejecting the requirement that the cause be physical continuity of the same matter. In GRT, the cause of each subsequent mental state is the immediate prior state mediated by the synthetic analogue. Since the functional role is preserved, the causal chain is reliable. Therefore, under strict Relation R, the subject survives. The lack of original substrate is irrelevant because Parfit is a Reductionist: persons are not separately existing entities but chains of mental and physical events. If the chain continues, the person continues. The GRT case is arguably stronger for Parfit than the Mars case because the continuity is spatiotemporally unbroken, even if the matter is not.

  However, the intuition that substrate matters suggests Relation R is insufficient. This motivates Relation R*, which adds a substrate-continuity constraint. We must rigorously analyze what "substrate continuity" entails. If it requires the retention of specific atoms, it is untenable; metabolic turnover replaces atoms constantly within a living brain without threatening identity. A criterion that kills survival via GRT but allows it via metabolism is arbitrary. If substrate continuity requires the continuity of the biological *organism* or life process, R* collapses into the Biological View (Animalism). This is a coherent position, but it abandons Parfit's psychological reductionism. If it requires continuity of the specific *functional architecture* regardless of material composition, it is redundant with Relation R, as functional preservation is already accounted for in psychological continuity. Thus, R* faces a trilemma: it is either empirically false (ignoring metabolic reality), redundant (adding nothing to R), or simply a restatement of Bodily Continuity. If the latter, it must defend why biological matter matters more than functional consciousness, a burden Parfit argues cannot be met.

  Crucially, GRT differs from standard teletransportation regarding the branching problem. In the Mars case, the original is destroyed, but the mechanism could theoretically create two copies, creating a branching problem where Relation R holds but identity fails (since identity is one-to-one). Parfit accepts this, arguing survival matters more than identity. GRT avoids branching entirely; the process is linear and unique. There is no moment where two psychologically continuous candidates exist. This strengthens the case for Relation R because it removes the need to deal with the non-identity of branching cases. In standard teletransportation, opponents argue R is insufficient because it allows non-identity survival. In GRT, identity is preserved if R is sufficient. This isolates the substrate variable. If one accepts survival in GRT due to the absence of branching and the presence of continuous consciousness, the only objection remaining is the substrate itself.

  Ultimately, adopting R* privileges matter over mind without clear justification. If consciousness and psychology flow uninterrupted through the replacement, denying survival based on substrate fetishism seems arbitrary. Unless one adopts a full Biological View where the organism's life is the primary criterion, R* is an unstable hybrid. Parfit's Relation R remains superior because it isolates what we genuinely care about in survival—the continuation of our conscious life—rather than the persistence of the hardware that momentarily realizes it. The GRT case demonstrates that psychological continuity with a reliable causal chain is sufficient for survival, even without original matter, provided we accept that persons are not distinct from their brains' functional histories.

  # Marking Scheme

  **Total Marks:** 25

  **1. Application of Relation R to GRT (5 marks)**
  *   3 marks: Correctly identifies that psychological continuity is unbroken in GRT.
  *   2 marks: Analyzes the "right kind of cause" clause, noting Parfit's inclusion of reliable functional causes vs. the friend's substrate objection.
  *   *Error:* Asserting R automatically applies without analyzing the causal clause (deduct 2 marks).

  **2. Branching Problem Distinction (5 marks)**
  *   3 marks: Clearly distinguishes GRT (linear/non-branching) from standard teletransporter (potential branching/duplication).
  *   2 marks: Explains how this distinction impacts the survival verdict (e.g., GRT preserves identity if R holds, whereas Mars case might not).
  *   *Error:* Conflating GRT with instantaneous scanning or claiming GRT involves branching (deduct 5 marks).

  **3. Evaluation of Relation R* (10 marks)**
  *   4 marks: Identifies the ambiguity in "substrate continuity" (atoms vs. biology vs. function).
  *   3 marks: Argues whether R* collapses into Bodily/Biological Continuity or remains independent.
  *   3 marks: Provides a reasoned verdict on whether R* is preferable to R (e.g., arbitrariness of matter vs. importance of life).
  *   *Error:* Treating R* as obviously correct without defending the substrate constraint (deduct 3 marks); failing to address the metabolic turnover objection (deduct 2 marks).

  **4. Argumentation and Clarity (5 marks)**
  *   5 marks: Essay is structured, logically coherent, and adheres to word limits.
  *   *Error:* Significant confusion of terminology (e.g., conflating psychological connectedness with continuity) (deduct 2-3 marks).

  **Specific Penalties:**
  *   Conflating GRT with standard brain transplant cases: -3 marks.
  *   Treating psychological continuity as obviously sufficient without addressing the "cause" constraint: -3 marks.
  *   Mischaracterizing Parfit's Reductionism as Dualism: -5 marks.
