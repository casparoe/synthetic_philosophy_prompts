answer: |-
  The moral landscape is traditionally mapped with a binary distinction: acts are either obligatory (or forbidden) or they are permissible. Supererogation complicated this map by identifying a category of acts that are permissible yet morally exceptional—good to do, but not wrong to omit. Julia Driver's introduction of *suberogation* attempts to complete the symmetry, positing a category of acts that are permissible yet morally deficient—wrong-ish, but not wrong.

  To assess whether suberogation is a genuine mirror image of supererogation or a conceptual artifact, we must examine the structural coherence of the category, the defensibility of accepting one without the other, and how major ethical frameworks accommodate them.

  ### 1. Structural Symmetry: The Coherence of the Deficit

  Structurally, supererogation and suberogation appear to be perfect inverses. Supererogation represents a normative surplus: the agent exceeds the demands of duty, earning praise without incurring blame for omission. Suberogation represents a normative deficit: the agent falls short of a moral ideal without breaching a duty, earning mild criticism without incurring blame for commission.

  The central challenge to suberogation's coherence is the status of the "permissible." In standard deontic logic, if an act is permissible, it is morally immune to negative appraisal. To call an act "suberogatory" seems to violate the law of excluded middle: if it is not wrong, on what grounds can it be morally criticized? If the criticism is moral, does that not imply a duty was violated?

  However, admitting suberogation does not necessarily collapse the distinction between blameworthy and less-than-ideal acts, provided we distinguish between *blame* (which implies a sanctionable violation of duty) and *moral criticism* (which assesses character or alignment with ideals). Driver argues that morality consists not only of mandatory rules but also of ideals of excellence. Just as one can be a "good person" without being a saint (supererogation), one can be a "bad person" without being a sinner (suberogation).

  Consider the door-slamming example. No duty requires you to hold the door; thus, you are not blameworthy in the sense of having committed an injustice. However, the act reveals a lack of consideration, a minor vice. This places the act in a coherent position on the moral map: it occupies the space between *moral neutrality* (indifferent acts) and *moral wrongdoing* (violations of rights/duties). It is a category for acts that are *morally off-center*. Therefore, the position is coherent, provided we accept that moral assessment tracks more than just duty-fulfillment. It preserves the distinction by reserving "blame" for duty-violations and using "criticism" or "disapproval" for suberogatory acts.

  ### 2. Asymmetries in Defensibility

  Despite structural symmetry, there is a significant asymmetry in how philosophers defend these categories. It is common to accept supererogation while rejecting suberogation. The argument runs: if an act is not obligatory, it is morally optional, and therefore morally neutral. To criticize a permissible act is to infringe on moral liberty.

  Can this asymmetric position be sustained? It depends on the role of *cost*.
  Supererogation is often defended via the "cost condition." A heroic rescue is supererogatory because the cost to the agent is high; this cost *excuses* the agent from the duty to perform the good act. The logic is: "It would be good to do, but you don't have to because it's too hard."

  Suberogation, conversely, typically involves *low cost*. Slamming a door costs nothing; holding it open costs little. The logic here is: "It would be good to do, and it isn't hard, so doing the opposite is suspect."

  This suggests a functional asymmetry. In supererogation, cost shields the agent from blame for *omission*. In suberogation, the lack of cost exposes the agent to criticism for *commission*. If we accept that morality governs character and not just rules, the asymmetric position is unstable. If we praise the agent who sacrifices for the good (supererogation), we must logically acknowledge the agent who gratuitously neglects the good (suberogation). To deny suberogation while accepting supererogation implies that morality cares about going above the call of duty but is indifferent to falling short of the spirit of the law, provided the letter is kept.

  However, a principled defense of supererogation does not *automatically* vindicate suberogation. One could argue that moral ideals are aspirational (pulling us up) without being baseline expectations (pushing us down). Yet, this seems arbitrary. If moral ideals are real, falling short of them should register negatively, even if not prohibitively. Thus, while the psychological defensibility is asymmetric (we love heroes more than we hate jerks), the theoretical defensibility suggests that if one category exists, the other should too.

  ### 3. Theoretical Uptake

  The viability of these categories varies significantly across ethical frameworks.

  **Maximizing Consequentialism:**
  Classic act consequentialism is hostile to both categories. If the right act is the one that maximizes the good, then anything less is wrong. This eliminates supererogation (you are obligated to maximize) and seemingly eliminates suberogation (anything less than max is simply wrong, not "permissible but bad").
  However, if consequentialism is modified to address the "demandingness objection" (admitting agents cannot always maximize), it often creates a "satisficing" threshold. Acts above the threshold are permissible. Within this permissible zone, acts that maximize are "better" than those that merely satisfy. This generates a form of supererogation. Does it generate suberogation? Only if there is a range within the permissible zone where acts are "worse" than others but still "good enough." A sophisticated consequentialist could argue that acts which are permissible but fail to maximize when easily possible are suberogatory—they are morally inefficient. Thus, a softened consequentialism might actually require suberogation to explain why we feel uneasy about "barely passing" moral exams.

  **Satisficing Views:**
  Satisficing consequentialism or duty-based views define obligation as meeting a threshold of "good enough." This framework is the natural home for suberogation.
  *   *Supererogation:* Exceeding the threshold significantly.
  *   *Obligatory:* Meeting the threshold.
  *   *Suberogatory:* Meeting the threshold (thus permissible) but doing so in a way that is minimally compliant or gratuitously ungenerous.
  The risk here is collapsing suberogation into mere neutrality. If the threshold defines the moral minimum, anything above it is fine. To sustain suberogation, the satisficing view must admit that *how* one meets the threshold matters morally, not just *that* one meets it.

  **Virtue Ethics:**
  Virtue ethics handles suberogation better than any other framework. Since virtue ethics focuses on character traits rather than discrete acts, it easily accommodates the idea of an act that is not "vicious" (forbidden) but reveals a lack of virtue. A suberogatory act is one that a virtuous agent *might* do, but *would not characteristically* do. It is an act of pettiness or callousness that doesn't rise to the level of injustice. Supererogation, in this view, is the expression of heroic virtue. The symmetry is clearest here: suberogation is the shadow of virtue, while supererogation is its light.

  ### Conclusion: Is Suberogation Gerrymandered?

  Are supererogation and suberogation genuine mirror images? Structurally, yes; functionally, no. They mirror each other in their relation to duty (above vs. below), but they do not mirror each other in their social and psychological impact. Praise is additive and optional; blame is subtractive and often demands justification. We can coherently demand that people avoid being suberogatory (don't be a jerk) without demanding they be supererogatory (be a hero).

  Does suberogation deserve the same standing as supererogation? It is tempting to dismiss suberogation as a gerrymandered category for "rudeness" or "unkindness"—matters of etiquette rather than ethics. However, this dismissal relies on a rigid distinction between morality and manners that suberogation successfully challenges. Many acts we intuitively feel are morally significant (gratuitous cruelty that harms no one's rights, bureaucratic indifference that follows the rules but destroys lives) fit the suberogatory model.

  If we accept supererogation to save morality from being too demanding, we should accept suberogation to save morality from being too minimal. Without suberogation, the category of the "permissible" becomes a moral vacuum where anything not forbidden is deemed morally neutral. Suberogation restores texture to this vacuum, acknowledging that one can be within one's rights yet still be in the wrong. It deserves standing in ethical theory not as a perfect mirror, but as a necessary corrective to a binary deontic logic that fails to capture the nuance of moral character.
