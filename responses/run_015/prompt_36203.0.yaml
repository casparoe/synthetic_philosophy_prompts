prompt: |-
  Compare the moral category of supererogation with the much less discussed category of suberogation, and assess whether the two are genuinely mirror images of one another.

  To fix terms: supererogatory acts, such as heroically rescuing a stranger at great personal risk, are commonly said to be permissible, morally good in a praiseworthy way, yet not obligatory — their omission leaves no room for blame. Suberogation, a category introduced into the literature by Julia Driver, is meant to be its mirror image: acts that are permissible in the sense that they violate no duty, yet fall short of some moral ideal and thereby merit a mild, blame-adjacent negative appraisal — think of gratuitously letting a door slam in someone's face when holding it open would cost you nothing. Such acts seem wrong-ish without being wrong.

  In your comparison, address the following questions:

  1. Structural symmetry. Supererogation involves a normative surplus (going beyond duty), while suberogation involves a normative deficit (falling short of an ideal without breaching duty). Is "deficit below an ideal, yet above the threshold of duty" a coherent position on the moral map, or does admitting suberogation force us to collapse the important distinction between acts that are blameworthy and acts that are simply less than ideal?

  2. Asymmetries in defensibility. Some philosophers accept supererogation while denying suberogation, claiming that anything short of the ideal but above the duty-threshold is simply fine. Can this asymmetric position be sustained, or does a principled account of why supererogation exists (e.g., the role of cost to the agent in excusing non-performance of good acts) automatically vindicate suberogation? You may consider whether costs to the agent function differently in the two cases — as an excuse that shields from blame in one direction but not as a justification for doing the less-than-ideal thing in the other.

  3. Theoretical uptake. How do different moral frameworks handle the two categories? For instance, does a maximizing consequentialism that recognizes supererogation as a practical impossibility (no one can always maximize) thereby also generate suberogatory acts, since most permissible acts fall short of the best? Does a satisficing view, on which duty requires only "good enough" performance, leave room for either category?

  Conclude with a considered judgment on whether suberogation deserves the same standing in ethical theory as supererogation, or whether it is a gerrymandered category that adds nothing beyond ordinary talk of rudeness, unkindness, and callousness.
reasoning: |-
  Here's a thinking process that leads to the essay:

  1.  **Deconstruct the Prompt:**

      *   **Topic:** Compare supererogation and suberogation. Assess if they are genuine mirror images.
      *   **Definitions:**
          *   *Supererogation:* Permissible, praiseworthy, not obligatory (omission not blameworthy). Example: Heroic rescue.
          *   *Suberogation:* Permissible (no duty violated), falls short of ideal, merits mild negative appraisal (blame-adjacent). Example: Slamming a door gratuitously.
      *   **Key Questions to Address:**
          1.  *Structural Symmetry:* Is "deficit below ideal but above duty" coherent? Does it collapse the blame/no-blame distinction?
          2.  *Asymmetries in Defensibility:* Can one accept supererogation but deny suberogation? Do costs/excuses function differently?
          3.  *Theoretical Uptake:* How do Consequentialism (maximizing vs. satisficing) handle these?
      *   **Conclusion:** Does suberogation deserve equal standing, or is it just "rudeness/unkindness" gerrymandered?

  2.  **Initial Brainstorming & Mapping:**

      *   *Supererogation:* Well-established (Urmson, Heyd). Solves the "Saintliness Problem" (if morality demands the best, saints are just doing their job).
      *   *Suberogation:* Coined by Julia Driver (1992). Solves the "Jerk Problem" (some acts aren't forbidden but feel morally offensive).
      *   *Symmetry:* On paper, they look symmetric (Above duty vs. Below ideal). But morally, praise and blame often function differently. Praise is often optional; blame is often tied to violation.
      *   *Coherence:* If an act is permissible, why blame? Driver argues for "morally off-center" acts. Critics say if it's permissible, criticism is merely aesthetic or prudential, not moral.
      *   *Asymmetry:* We excuse heroes from *not* acting due to cost. Do we excuse jerks for acting due to cost? Usually, suberogatory acts are *low cost* (slamming a door). If there were high cost to be nice, it might not be suberogatory to be mean.
      *   *Frameworks:*
          *   *Maximizing Consequentialism:* Traditionally kills supererogation (you must maximize). If you tweak it to allow supererogation (demandingness objection), do you get suberogation? Yes, anything less than max is sub-optimal. But is it *suberogatory* (blame-adjacent) or just *wrong*?
          *   *Satisficing:* Duty = good enough. Supererogation = better than good enough. Suberogation = worse than good enough but still "good enough"? That seems contradictory. If it's worse than the threshold, it's wrong. If it meets the threshold, it's fine. Satisficing might squeeze suberogation out.
          *   *Virtue Ethics:* Focuses on character. Suberogation fits well here (vices vs. virtues, but not necessarily rule-breaking).

  3.  **Drafting - Section by Section:**

      *   **Introduction:** Define terms clearly. State the thesis: While structurally symmetric, they are not functionally mirror images due to the asymmetry of praise and blame, and the role of moral ideals vs. duties. Suberogation is coherent but distinct in its theoretical utility.

      *   **Section 1: Structural Symmetry (The Moral Map):**
          *   Visualize the spectrum: Wrong | Obligatory | Permissible (Neutral) | Supererogatory.
          *   Suberogation inserts a layer: Wrong | Suberogatory | Obligatory/Neutral | Supererogatory.
          *   *Challenge:* If it's permissible, why the negative appraisal?
          *   *Defense:* Driver's argument. Morality isn't just rules; it's about ideals. We can criticize character without condemning the act.
          *   *Risk:* Does this blur the line between "immoral" and "impolite"? Need to argue that suberogation is *moral* criticism, not just etiquette. It signals a lack of virtue without crossing into vice that harms rights.

      *   **Section 2: Asymmetries in Defensibility:**
          *   Why accept Super but deny Sub?
          *   *The Cost Factor:* Supererogation usually involves high cost/sacrifice (excusing omission). Suberogation usually involves low cost/gratuitousness (making the act suspect).
          *   *The "Merely Permissible" Defense:* Some say if it's not wrong, stop criticizing.
          *   *Counter:* Morality guides character, not just actions. If we praise going above, we should note falling short of the *ideal* even if duty is met.
          *   *Key Distinction:* Supererogation protects the agent from duty (you don't *have* to be a hero). Suberogation protects the act from prohibition (you *won't* be punished for being a jerk), but not the agent from criticism.
          *   *Verdict:* The asymmetry is sustainable because praise is additive, while blame is subtractive. However, a consistent theory of moral ideals supports both.

      *   **Section 3: Theoretical Uptake:**
          *   *Maximizing Consequentialism:* Traditionally no supererogation (everything is duty). If modified (e.g., Slote's satisficing or demandingness objections), it allows "optional good." Does it allow suberogation? If I do 90% of the max good, is that suberogatory? Usually, consequentialists call anything less than max *wrong*. So, to get suberogation, you need to lower the bar for "wrong."
          *   *Satisficing:* Duty = "Good Enough." Super = Better than enough. Sub = Worse than ideal but still "Enough." This fits Suberogation perfectly. It creates a zone of "acceptable but lamentable."
          *   *Deontology:* Focuses on rules. Harder to fit suberogation unless rules include "respect" which is vague.
          *   *Virtue Ethics:* Best fit. Suberogatory acts reveal minor vices (pettiness) without being vicious acts.

      *   **Conclusion:**
          *   Are they mirror images? Structurally, yes. Functionally, no. Praise is not the inverse of blame.
          *   Is Suberogation gerrymandered? No. It captures a specific phenomenological experience: the "moral residue" of acts that aren't sins but leave a bad taste. It refines our understanding of the permissible.
          *   Final Judgment: It deserves standing, not as a perfect mirror, but as a necessary correction to a binary view of permissibility.

  4.  **Refining and Polishing:**

      *   *Check Definitions:* Ensure I stick to Driver's definition (permissible but morally off-center).
      *   *Tone:* Philosophical, analytical, balanced.
      *   *Clarity:* Ensure the distinction between "duty" and "ideal" is sharp.
      *   *Addressing the Prompt:* Did I answer all three specific questions? Yes.
      *   *Self-Correction during drafting:* I initially thought about saying Consequentialism *must* reject supererogation. I should nuance that: *Act* Consequentialism rejects it, but *Motive* or *Satisficing* Consequentialism might accept it. I need to be careful not to oversimplify the theories.
      *   *Focus on the "Mirror" aspect:* The prompt asks if they are *genuine* mirror images. I should argue they are *structural* mirrors but *functional* asymmetries exist.

  5.  **Final Review against constraints:**
      *   Did I define terms? Yes.
      *   Did I address Structural Symmetry? Yes.
      *   Did I address Asymmetries in Defensibility? Yes.
      *   Did I address Theoretical Uptake? Yes.
      *   Is there a considered judgment conclusion? Yes.

      *(Self-Correction)*: Make sure to explicitly mention Julia Driver since the prompt cites her. Ensure the distinction between "blameworthy" and "blame-adjacent" is clear.

