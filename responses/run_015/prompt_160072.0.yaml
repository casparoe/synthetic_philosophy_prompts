answer: |-
  ### Diagnosis

  Your friend is deploying a classic philosophical maneuver known as the **Humean Theory of Motivation**, disguised as behavioral economics. The argument works by redefining "better judgment" to mean "whatever desire is currently strongest." If you accept that definition, then by logic, you always do what you judge best, and weakness of will becomes impossible.

  The flaw lies in **Step (5)**. This step equivocates on the phrase "better judgment." In your scene (and in standard philosophy, notably Donald Davidson's *How is Weakness of the Will Possible?*), "better judgment" is a normative assessment (what Marnie thinks she *ought* to do), whereas "top-ranked" in Step (4) refers to motivational strength (what Marnie *feels* like doing). Your friend assumes these must always align. They do not. The phenomenological detail you included—that Marnie thinks "clear as anything, that she shouldn't be doing this"—is the empirical proof that Step (5) is false. She is judging one way and desiring another. That gap *is* the scene.

  Furthermore, your friend's claim about precommitment (Step 6) misunderstands the economics of sophisticated discounting. A "sophisticated" agent knows their preferences will flip and *rationally* precommits to bind their future self. If Marnie fails to precommit, or fails to follow through, it is not because precommitment is pointless; it is because she is suffering from a failure of self-governance. If her future self were truly a "different consistent agent," she wouldn't feel regret or conflict; she would just be a different person. The fact that she feels the weight of her Sunday resolution on Thursday proves she is one agent struggling with temporal inconsistency, not two agents handing off a baton.

  To save your scene, you must reject **Step (5)**. You do not need to deny hyperbolic discounting (Step 2); you only need to deny that discounting exhausts the explanation of human action. Humans can act against their strongest immediate urge (willpower), or they can act on an urge they simultaneously judge to be bad (akrasia). Both require separating "judgment" from "desire."

  ### The Argument Table

  | Step | Verdict | Flaw | Cost |
  | :--- | :--- | :--- | :--- |
  | **(1)** | Valid | None (This is the standard definition you are fighting to preserve). | None (Keep this; it defines the literary stakes). |
  | **(2)** | Valid | None (Hyperbolic discounting is a robust empirical model of human psychology). | None (You can grant this psychological fact without accepting the philosophical conclusion). |
  | **(3)** | Valid | None (This follows mathematically from Step 2). | None (Accept that her preferences shift; that creates the tension, it doesn't resolve it). |
  | **(4)** | Valid-only-under-one-reading | Equivocation on "wants" (conflates *occurrent urge* with *all-things-considered preference*). | If rejected, you must explain how people sometimes act against their strongest immediate urge (willpower). |
  | **(5)** | **Invalid** | **Equivocation on "better judgment" (assumes normative judgment is identical to motivational strength).** | **If rejected, you affirm that reason and desire can conflict, which saves the possibility of akrasia.** |
  | **(6)** | Invalid | Non-sequitur (Follows only if Step 5 is true; ignores the rationality of precommitment for sophisticated agents). | If rejected, you admit the Thursday self is irrational relative to the agent's global plan. |
  | **(7)** | Invalid | Hasty Generalization (Derives a metaphysical impossibility from a contested model of motivation). | If rejected, you preserve the reality of moral conflict and character complexity. |

  ### Recommendation
  **Reject Step (5).**

  Tell your friend: "Marnie's judgment that she shouldn't drink is a *normative* ranking, not a *motivational* one. Step (5) assumes I can't want something I judge to be bad. My entire novel assumes I can. The scene isn't incoherent; it's a record of the moment my character's judgment loses a vote against her impulse."

  The detail that she knows she shouldn't be doing it *while* doing it is not what makes the scene incoherent; it is the only thing that makes it a scene about weakness of will rather than a scene about a change of mind. If she thought "Actually, drinking is best right now," she would just be a Sunday-teetotaler who changed her mind. Because she thinks "This is bad, but I'm doing it," she is Marnie. Keep that.
