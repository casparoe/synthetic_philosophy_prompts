answer: |-
  This is one of the sharpest critiques of modern regulatory policy I have encountered from a non-specialist. You have put your finger on the exact fracture line where welfare economics leans heavily on moral philosophy, often without admitting it.

  You are right to feel that something is being smuggled in. The tension you see between the "300-year discount" and the "extinction carve-out" is not just a bureaucratic inconsistency; it is a clash between two different ethical frameworks that the government is trying to hold in the same hand.

  Here is the breakdown of the machinery, the ethics, and the contradiction.

  ### 1. What the Practice Actually Presupposes

  You asked whether the discount rate implies future welfare matters less, or if it's about wealth, or uncertainty. The official answer is usually the second one, but the practical effect is the first.

  In welfare economics, the discount rate is typically built using the **Ramsey Rule**. It says the rate ($r$) is the sum of two things:
  1.  **Pure Time Preference ($\rho$):** A measure of pure impatience. Do we value a life today more than a life tomorrow simply because it is today?
  2.  **Growth Effect ($\eta \times g$):** This assumes future people will be richer than us. If a future person is twice as wealthy as you, an extra dollar gives them less "well-being" (marginal utility) than it gives you. So, we discount the dollar amount to reflect that it buys less *happiness*, not less *life*.

  **The Smuggle:**
  Most ethical philosophers (and the UK's Stern Review, a landmark document on this) argue that **Pure Time Preference ($\rho$) should be zero.** To say a future life counts for less simply because it is in the future is, as the economist Frank Ramsey put it, "ethically indefensible." It is discrimination based on date of birth.

  However, government guidance often sets the rate at 3% to 7%. Even if they claim this is all due to expected economic growth, the numbers often exceed plausible growth rates. When the rate is higher than the growth justification allows, the practice presupposes that **future welfare is intrinsically less valuable.**

  Furthermore, they are smuggling in **uncertainty**. They treat a benefit in 2100 as less certain than a benefit in 2025. While pragmatically sensible (regulations might be repealed, technology might solve the problem otherwise), ethically this is distinct from value. If there is a 50% chance a policy is repealed, you should discount the *probability*, not the *value of the life*. But in the spreadsheet, these get blended into one number.

  **Verdict:** The practice presupposes a mix of expected wealth growth (defensible) and a blend of pure impatience and risk (ethically controversial). It treats time like a financial market, where value degrades over duration, rather than a moral landscape.

  ### 2. The Declining Rate and Time Bias

  You heard correctly: a discount rate that declines over time can emerge from pure uncertainty without any time bias at all. This is known as the **Weitzman Effect**.

  Here is the intuition: Imagine you are unsure what the "correct" discount rate is. Maybe it's 1%, maybe it's 5%.
  *   In year 10, the 5% rate and the 1% rate produce somewhat different values.
  *   In year 300, the 5% rate has discounted the value to effectively zero. The 1% rate still leaves significant value.
  *   When you average the outcomes, the 5% scenario drops out of the equation because it has vanished. The long-term average is dominated by the lowest possible rate.

  **Does this stop it from being time bias?**
  Yes, technically. If the declining schedule is derived *only* from uncertainty about the future (e.g., "we don't know if growth will continue"), then you are not saying future people matter less. You are saying, "We are less sure about the parameters of the calculation the further out we go."

  However, most government guidance does not explicitly adopt this "uncertainty derivation." They often just step the rate down administratively (e.g., 3.5% for 30 years, then 3%, then 2%). Unless they explicitly justify this as a mathematical consequence of uncertainty, it remains a policy choice that effectively devalues the far future, even if less aggressively than a constant rate.

  ### 3. The "Probability of Existence" Puzzle

  This is your strongest mathematical insight. You are right: mathematically, discounting at 3% per year looks exactly like assuming there is a 3% chance per year that the beneficiary ceases to exist (or the benefit is destroyed).

  **Does this rescue the practice?**
  It rescues the *logic*, but only if the number matches the *risk*.
  *   **Existential Risk:** What is the actual annual probability that humanity goes extinct or civilization collapses? Estimates vary, but they are generally well below 1% per year.
  *   **The Mismatch:** If the government uses a 3% or 5% discount rate, they are implicitly assuming a cumulative extinction risk that is far higher than realistic. A 5% discount rate implies that in 200 years, there is only a tiny fraction of a percent chance anyone is left to enjoy the benefit.

  **Does it change the presupposition?**
  If the rate were set to match the actual probability of existential catastrophe, the practice would no longer be saying "future lives count less." It would be saying "there is a chance there will be no one to count." That is a descriptive claim about survival, not a normative claim about value.

  But because the official rates are higher than the actual existential risk, the practice is still presupposing that **even if future people definitely exist, their welfare counts for less.** The "probability" argument is a convenient fiction used to justify a rate that is actually driven by economic impatience.

  ### 4. The Extinction Carve-Out

  This is where the contradiction becomes undeniable. The extinction carve-out presupposes a completely different ethical framework than the discounting machinery.

  **Standard Discounting** relies on **Utilitarianism**: We are summing up welfare units. A life is a container for well-being. If the well-being is far away, it's worth less (due to discounting). Everything is commensurable (comparable) on a single scale of dollars or utility.

  **The Extinction Carve-Out** relies on **Deontology or Stewardship**: It presupposes that some things have value in themselves, independent of their utility to humans, or that we have a duty not to destroy that is not subject to cost-benefit trading.
  *   **Irreversibility:** Once a species is gone, it cannot be brought back. Standard discounting assumes substitutability (if we lose this, we can buy that). The carve-out admits that some losses are absolute.
  *   **Option Value:** It acknowledges that future people might value that species infinitely more than we do, and by destroying it, we remove their option to value it.

  **Is it consistent?**
  No. It is a straight contradiction papered over by bureaucratic categorization.
  *   **Logic A (Discounting):** A benefit in 300 years is worth ~0. Therefore, preventing a death in 300 years is worth ~0.
  *   **Logic B (Carve-out):** Preventing an extinction in 300 years is worth Full Value.

  If a species going extinct causes human suffering (loss of medicine, ecosystem collapse), that suffering should be discounted under Logic A. If it doesn't cause human suffering, why does it count under Logic B?
  The government is effectively saying: "For normal regulations, we are Utilitarians who discount the future. For iconic environmental issues, we are Stewards who respect the rights of the future." They switch moral frameworks depending on which document they are reading.

  ### 5. If We Replaced It With Strict Impartiality

  If we adopted the view that "a life is a life whenever it happens" (Zero Pure Time Preference), here is what would concretely change:

  **The Numbers:**
  The discount rate would drop significantly, likely to the rate of pure risk (perhaps 0.5% to 1% to account for existential catastrophe, rather than 3-7%).
  *   **Result:** The present value of long-term benefits (climate stability, nuclear waste containment, biodiversity) would skyrocket.
  *   **Cost-Benefit Flip:** Many regulations that currently fail the test (costs now > discounted benefits later) would suddenly pass with flying colors. A regulation costing \$1 billion today to save 10,000 lives in 200 years might currently look like a net loss. Under impartiality, it becomes a massive net gain.

  **The Politics:**
  This is the hard part.
  *   **Intergenerational Transfer:** Strict impartiality requires the current generation to sacrifice significant consumption for the sake of future generations who cannot vote, lobby, or pay taxes.
  *   **The "Tyranny of the Future":** Critics would argue that if you discount at 0%, you should invest almost *nothing* in current poverty relief and *everything* in long-term existential risk reduction, because the compounding of capital means you could save more lives later. This leads to counter-intuitive results where we might starve the poor today to build a shield for the year 3000.
  *   **Political Viability:** No government can sustain a policy that demands heavy costs from current voters for benefits that accrue to people who won't be born for centuries. The "discount rate" is, in part, a political mechanism to ensure the current generation doesn't bankrupt itself for the sake of the distant future.

  **Conclusion:**
  You have identified that the discount rate is not just a technical tool; it is a **moral rationing device**. It limits how much the present owes the future. The extinction carve-out is the government's subconscious admitting that the rationing is too harsh for certain moral intuitions.

  If you believe the "space vs. time" analogy—that location in time shouldn't matter more than location in space—then the current guidance is ethically inconsistent. It treats the future like a foreign country with a punitive tariff, unless that future involves a snail, in which case the border is suddenly open.
