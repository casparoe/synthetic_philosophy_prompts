answer: |-
  You are not confusing three things for one. You have identified a specific, high-resolution mechanism of moral change that most popular summaries (including, likely, the book you read) gloss over.

  The book you are discussing is almost certainly Kwame Anthony Appiah's *The Honor Code: How Moral Revolutions Happen* (2010). His headline claim is exactly what you summarized: moral change is driven by shifts in honor and shame, not by ethical argumentation.

  However, your intuition goes deeper than Appiah's popular presentation. You are asking for the *phenomenology* of that shift: what happens inside the agent when a reason stops motivating them, even though they still assent to the proposition? And how does that differ from the public silencing of that reason?

  There is no single English word that captures this perfectly, but there is a "carving" available in moral psychology and sociology that separates the two phenomena you noticed. Here is the breakdown.

  ### 1. The First Phenomenon: The Loss of Grip
  **Your description:** A consideration comes loose from a person who still endorses it. The belief ("cowardice is bad") remains, but the *grip* ("therefore I must not duel") vanishes. They do not feel they are failing (akrasia); they feel the requirement has dissolved.

  **The Established Concepts:**
  *   **Bernard Williams' "Internal Reasons":** Williams argued that for something to be a reason for an agent, it must connect to their "subjective motivational set." You are describing the moment a reason transitions from **Internal** (it moves me) to **External** (I agree it is true, but it does not move me). The gentleman still agrees "cowardice is bad" abstractly, but "dueling" has dropped out of the set of things that count as evidence for cowardice *for him*.
  *   **Pierre Bourdieu's "Habitus":** This is the sociological counterpart. *Habitus* is the embodied, pre-reflective sense of "what one does." When the habitus shifts, dueling doesn't feel like a "choice" one makes against argument; it feels like an impossibility, like wearing a codpiece. The *grip* you describe is the texture of the habitus. When it loosens, the action becomes unintelligible, not just forbidden.
  *   **Thick vs. Thin Concepts (Williams/MacIntyre):** "Coward" is a *thick* ethical concept: it describes an action and evaluates it simultaneously. You are observing the **thinning** of the concept. The word "coward" remains, but its descriptive extension shifts until it no longer covers "duelist." The agent isn't changing their mind about cowardice; they are changing their mind about what cowardice *is*.

  **What these miss:** They describe the state of the agent, but not the *process* of the decoupling. They don't fully capture the feeling of "I still believe this, but it no longer applies here."

  **The Coined Term:** **Motivational Decoupling.**
  *   *Definition:* The state in which an agent retains propositional assent to a normative claim (e.g., "Cowardice is vicious") but the claim ceases to generate practical necessity for a specific action (e.g., "I must duel").
  *   *Boundary Case:* It is not *hypocrisy* (where they secretly disagree). It is not *akrasia* (where they agree and feel the pull but fail). It is the quiet retirement of a premise.

  ### 2. The Second Phenomenon: The Loss of Voice
  **Your description:** People go on saying the words and presumably believing them, but stop being able to say them out loud in a way that would justify anything. The norm becomes embarrassing rather than false.

  **The Established Concepts:**
  *   **Timur Kuran's "Preference Falsification":** This explains the public/private split. People privately dislike the practice but publicly support it because of social pressure. Eventually, a "cascade" occurs where the public support collapses.
  *   **Erving Goffman's "Stigma":** The practice moves from being a *requirement* to being a *stigma*. The key here is not truth, but *social cost*.
  *   **Social Unintelligibility:** This is the stronger concept. It's not just that it's embarrassing; it's that the language no longer secures *uptake*. If you say, "I must duel to avoid cowardice," and your audience shrugs or laughs, the speech act fails. The reason dies because it no longer functions as a reason *in public*.

  **The Coined Term:** **Discursive Stigmatization.**
  *   *Definition:* The process by which a normative justification loses its capacity to function as a valid public account, rendering the agent who uses it socially unintelligible rather than morally wrong.
  *   *Boundary Case:* It differs from censorship. The state isn't stopping you; the *audience* is refusing to recognize the validity of your vocabulary.

  ### 3. The Carving: How They Relate
  You asked whether the "Loss of Grip" and the "Loss of Voice" are the same mechanism. They are distinct but causally linked.

  *   **The Mechanism:** The **Shift in Reference Group** (Appiah/Merton).
  *   **The Causal Chain:**
      1.  **Audience Shift:** The people whose respect the gentleman values (his reference group) begin to drift away from the practice (often due to economic or geopolitical changes, e.g., the rise of the merchant class who don't duel).
      2.  **Discursive Stigmatization (Public):** The old language ("honor," "cowardice") stops working on the *new* audience. It becomes embarrassing.
      3.  **Motivational Decoupling (Private):** Because the language no longer secures respect from the audience that matters, the *internal grip* loosens. The agent stops feeling the necessity because the social reward (honor) is no longer attached to the action.

  **The Distinction:**
  *   **Motivational Decoupling** is what happens in the *will*. (I no longer feel I must).
  *   **Discursive Stigmatization** is what happens in the *language*. (I can no longer say I must).
  *   **Preference Falsification** is the gap between them. (I say I don't duel because it's wrong, but I actually don't duel because I'm afraid of looking foolish).

  ### 4. Summary of the Vocabulary
  If you want to bring this to your reading group, here is the precise terminology to separate the "three ordinary things" you suspected you were confusing:

  1.  **Normative Desuetude:** (A legal term borrowed for sociology). The process by which a norm falls into disuse not because it is repealed, but because it is ignored until it loses force. This covers the whole historical arc.
  2.  **Motivational Decoupling:** (Your specific insight). The psychological state where endorsement remains but imperative force vanishes. This distinguishes it from *akrasia* (failure of will) and *conversion* (change of belief).
  3.  **Discursive Stigmatization:** The social mechanism that kills the public justification. This distinguishes it from *censorship* (force) and *refutation* (logic).

  **The Verdict:**
  You are describing **Motivational Decoupling** caused by **Reference Group Shift**, resulting in **Normative Desuetude**.

  The reason you couldn't find the vocabulary is that philosophy usually focuses on whether a reason is *true*, not whether it is *grippy*. Sociology focuses on whether a norm is *enforced*, not whether it is *endorsed*. You are standing in the gap between the two, looking at how norms die inside the mind before they die in the law.

  **Recommendation:**
  Tell your group you are looking for the distinction between **Propositional Assent** (I agree this is bad) and **Practical Necessity** (I cannot do this). The end of dueling and slavery wasn't a change in Assent; it was a collapse of Necessity. The arguments didn't change minds; they changed the *cost of speaking*, which eventually changed the *feel of thinking*.
