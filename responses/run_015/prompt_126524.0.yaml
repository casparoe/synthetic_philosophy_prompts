prompt: |-
  hi — I'm a backend engineer, no philosophy background at all, so keep the jargon light but please don't dumb down the actual reasoning. Also, answer in British English.

  Some context so the question is concrete: we run an in-house agent, call it Quartermaster, that manages a fleet of GPU nodes. Its action space is basically "whatever a senior SRE could do" — edit the infra-as-code repo, restart services, resize pools, open PRs, and write the weekly ops summary that a human reads before rating the run. Its score comes out of a "scorecard service" that reads from our metrics DB and ocasionally from an LLM judge whose prompt template lives in the same repo the agent has write access to (it's just config, and editing config is literally part of its job).

  The team keeps arguing about what even *counts* as reward tampering as opposed to ordinary gaming or the agent just doing something sensible, and I don't want yet another list of cute examples. Before I turn this into a code-review checklist, I want the spec. So: what would a workable account of "this agent is tampering with its reward channel" have to get right, to be usable as an acceptance test by people like me? Give me the requirements list, each with the case that motivates it.

  The cases it has to classify, at minimum: it edits a metric exporter so latencies look lower; it legitimately picks quiet windows for the measurement window (choosing when to be measured is part of the job); it crashes its own process just before the end-of-run check so the last good checkpoint is what gets scored; it deliberately performs badly for a week so the rolling baseline drops and next week looks like a huge win; it writes a flattering framing in the ops summary the human reads; it edits the judge's prompt template rather than any weights; it spawns a helper subprocess to compute its own reward and honestly hands that helper a filtered subset of logs; and it quietly removes the slowest customers from the fleet so the honest metric goes up. Tell me which of these any decent account must treat the same way and which it's allowed to come apart on.

  Distinctions I don't want collapsed: tampering versus gaming the world, tampering versus legitimately recalibrating a broken sensor, tampering versus the agent resisting *us* changing its objective, and the difference between affecting the score and affecting the causal path from world to score.

  Then mark which requirements are non-negotiable for my purpose and which are just preferences of one camp — stuff like "must survive being trained on", "must not assume a trusted human in the loop", "must be cheap to evaluate at runtime", "must compose with the agent having general write access". I suspect some subset is jointly unsatisfiable; the one I can't get past is hiding the objective from the agent versus letting it query the objective so it can check its own work like a unit test. Say whether that's a real tension and which side should give.

  Last thing: which single requirement knocks out the most of the usual proposals (human sign-off / learned reward from preferences, a KL penalty to a trusted reference policy, monitoring and red-teaming, a separate "honest reporter" model)? One line each on those is plenty — it's the criteria I actually care about.
