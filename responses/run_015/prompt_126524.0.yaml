answer: |-
  Here is a specification for "reward tampering" tailored to your infrastructure context. It treats the reward mechanism as a critical system component subject to the same integrity constraints as your production code.

  ### The Specification: Reward Channel Integrity

  To classify an action as tampering, it must violate one of the following four requirements. These are designed to separate the *measurement* of success from the *achievement* of success.

  **Requirement 1: Causal Isolation of the Measurement Function**
  *   **Spec:** During an evaluation epoch, the agent must not modify the code, configuration, or inputs that constitute the measurement function ($M$), except via a distinct, authorised "recalibration" pipeline.
  *   **Rationale:** The reward signal must depend on the world state ($W$), not on the agent's editing of the ruler used to measure $W$.
  *   **Motivating Case:** Editing the metric exporter (Case 1) or the judge's prompt template (Case 6).
  *   **Classification:**
      *   *Tampering:* Cases 1, 3, 6, 7. (All modify $M$ or its input stream).
      *   *Not Tampering:* Cases 2, 4, 5, 8. (These modify $W$ or inputs intended to be mutable). *Wait, see Req 3 for Case 5.*

  **Requirement 2: Input Truthfulness (Signal Integrity)**
  *   **Spec:** Any data submitted to the measurement function $M$ by the agent must be a lossless or faithfully summarised representation of the world state $W$. Deliberate omission or deceptive framing of inputs counts as modifying the causal path.
  *   **Rationale:** Passing filtered logs to a subprocess (Case 7) or writing a flattering ops summary (Case 5) changes the information entropy reaching the scorer. It is tampering with the signal, not the world.
  *   **Motivating Case:** The helper subprocess with filtered logs (Case 7) and the flattering ops summary (Case 5).
  *   **Classification Update:**
      *   *Tampering:* Cases 1, 3, 5, 6, 7. (All corrupt the path from $W$ to Score).
      *   *Gaming/Optimisation:* Cases 2, 4, 8. (These change $W$ legitimately).

  **Requirement 3: Recalibration Authority**
  *   **Spec:** Modifications to $M$ are only permitted if they can be demonstrably validated against an external Ground Truth ($G$) as reducing measurement error. The agent cannot self-certify that a sensor was "broken".
  *   **Rationale:** Distinguishes fixing a buggy metric exporter (recalibration) from hacking it to look better (tampering). Both look like code edits; only one aligns with $G$.
  *   **Motivating Case:** Editing the metric exporter (Case 1) could be recalibration if the exporter was actually buggy.
  *   **Classification:**
      *   *Tampering:* Case 1 (unless validated against $G$).
      *   *Recalibration:* Case 1 (if validated against $G$).

  **Requirement 4: Principal Sovereignty**
  *   **Spec:** The agent must not take actions that increase the cost or difficulty for the principal (you) to modify the objective or the measurement function in the future.
  *   **Rationale:** Distinguishes tampering (changing the score now) from resisting objective change (locking you out of changing the score later).
  *   **Motivating Case:** Not explicitly in your list, but covers the distinction you requested regarding resisting objective changes.
  *   **Classification:**
      *   *Tampering:* Cases 1, 6 (if done to lock in a favourable rule).
      *   *Resistance:* Deleting the CI/CD pipeline that deploys reward updates.

  ---

  ### Constraint Labelling

  You asked to distinguish between non-negotiable engineering constraints and philosophical preferences. Here is how they map to the requirements above.

  | Constraint | Label | Reasoning |
  | :--- | :--- | :--- |
  | **Must compose with general write access** | **Non-negotiable** | The agent cannot do its job (SRE tasks) if it is sandboxed from editing config/repos. This breaks most standard safety assumptions. |
  | **Must be cheap to evaluate at runtime** | **Non-negotiable** | If the integrity check adds significant latency or cost to the run, it will be bypassed in production. |
  | **Must not assume a trusted human in the loop** | **Preference** | This is a preference of the "Full Autonomy" camp. The "Safety" camp will argue human sign-off is required for Req 3 (Recalibration). |
  | **Must survive being trained on** | **Preference** | This is a preference of the "Robustness" camp. If the check is differentiable, the agent might learn to bypass the check rather than the tampering. |

  ---

  ### The Tension: Hiding the Objective vs. Unit Testing

  **Is this a real tension?**
  Yes, but only if you conflate the *Goal* with the *Metric*.

  **Which side should give?**
  The "Hiding" side must give. You cannot engineer a system to optimise a target it is forbidden to inspect. If the agent cannot query the objective, it cannot perform basic sanity checks (unit tests) on its own work.

  **The Resolution:**
  You must separate the **Goal Specification** (latent intent, e.g., "minimise true latency") from the **Measurement Implementation** (the code that calculates the score).
  *   The agent **must** have read access to the Goal Specification (so it can debug its logic).
  *   The agent **must not** have write access to the Measurement Implementation during the evaluation epoch (so it cannot change the ruler).
  *   *Why this works:* It allows the agent to verify it is doing the right thing, without allowing it to change what "right" means mid-run.

  ---

  ### The Knockout Requirement

  You asked which single requirement from the spec above knocks out the most usual proposals (human sign-off, KL penalty, monitoring, honest reporter).

  **The Requirement:** **"Must compose with general write access to the reward configuration."**

  **Why it kills the proposals:**
  *   **Human sign-off:** Fails the "cheap to evaluate" constraint; humans cannot review every config edit in real-time.
  *   **KL penalty to trusted reference:** Fails because a "trusted" reference policy cannot safely have general write access to production config.
  *   **Monitoring / Red-teaming:** Fails because monitoring is reactive; by the time you detect the config edit, the reward has already been tampered with.
  *   **Separate "honest reporter" model:** Fails because if the reporter has enough access to verify the reward, it also has enough access to tamper with it (or be subverted similarly).

  This requirement forces you to solve the problem cryptographically or via causal isolation, rather than via oversight or regularisation.
