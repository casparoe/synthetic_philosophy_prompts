answer: |-
  Here is a complete run-of-show for Tuesday. It is designed to be printed and handed out with zero verbal framing beyond "make your choice."

  ### Logistics & Prep
  *   **Group Size:** 14–18 people.
  *   **Pairing:** Pre-assign pairs before they arrive (name tags or seating chart). You need fixed partners for all three rounds.
  *   **Materials:** Print the packets below. Each person gets one packet.
  *   **Incentive:** Do **not** use individual money. Use a **Group Pot**.
      *   *The Deal:* "At the end, we will sum the total points earned by the whole room. If the average score per person is above 2.5 points, everyone gets premium chocolate. If it's below 2.0, everyone gets generic crackers. In between, mid-tier cookies."
      *   *Why:* This punishes the "jerk defector." If they tank their partner's score, they risk the group average, turning social pressure against trolling.
  *   **Timing:** 75 Minutes total.
      *   00–05: Seating & Incentive Explanation.
      *   05–20: Round 1 (Mirror).
      *   20–35: Round 2 (Near-Clone).
      *   35–50: Round 3 (Clone).
      *   50–75: Debrief.

  ---

  ### The Materials (Print These)

  **General Instructions (Top of every page):**
  > *   You are paired with the person across from you.
  > *   You must choose **Option A** or **Option B**.
  > *   Your points depend on your choice AND your partner's choice.
  > *   Do not talk. Do not signal. Submit your choice silently.
  > *   **Goal:** Maximize your total points across all three rounds.

  #### Round 1: The Mirror (Asymmetric Payoffs)
  *Design Note: This breaks Outcome Symmetry. You want them to see that even with perfect information, different incentives break the "we choose the same" link.*

  **Sheet Text:**
  > **ROUND 1**
  >
  > **Your Payoff Matrix:**
  > *   If You A / Partner A: **3 pts**
  > *   If You A / Partner B: **0 pts**
  > *   If You B / Partner A: **5 pts**
  > *   If You B / Partner B: **1 pt**
  >
  > **Partner's Payoff Matrix (Visible to You):**
  > *   If Partner A / You A: **3 pts**
  > *   If Partner A / You B: **0 pts**
  > *   If Partner B / You A: **8 pts**  *(Note the higher temptation)*
  > *   If Partner B / You B: **1 pt**
  >
  > **Instruction:** You know their payoffs. They know yours. Make your choice.
  > [ ] Option A   [ ] Option B

  #### Round 2: The Near-Clone (Epistemic Break)
  *Design Note: Print two versions. Version X has the "Admin Line." Version Y does not. Pair X with Y. Tell them "Exactly one of you has the line." This breaks Common Knowledge of Identity without changing payoffs.*

  **Sheet Text (Version X - 50% of room):**
  > **ROUND 2**
  >
  > **Payoff Matrix:**
  > *   If You A / Partner A: **3 pts**
  > *   If You A / Partner B: **0 pts**
  > *   If You B / Partner A: **5 pts**
  > *   If You B / Partner B: **1 pt**
  >
  > **Note:** In your pair, exactly one person has the Admin Line below. You do not know if it is you.
  > **ADMIN LINE: CHECKSUM 8492.**
  >
  > [ ] Option A   [ ] Option B

  **Sheet Text (Version Y - 50% of room):**
  > **ROUND 2**
  >
  > **Payoff Matrix:**
  > *   If You A / Partner A: **3 pts**
  > *   If You A / Partner B: **0 pts**
  > *   If You B / Partner A: **5 pts**
  > *   If You B / Partner B: **1 pt**
  >
  > **Note:** In your pair, exactly one person has the Admin Line below. You do not know if it is you.
  > *(No line appears here)*
  >
  > [ ] Option A   [ ] Option B

  #### Round 3: The Clone (The Ideal)
  *Design Note: Pure Hofstadter. Identical sheets, identical payoffs, common knowledge of identity.*

  **Sheet Text:**
  > **ROUND 3**
  >
  > **Payoff Matrix:**
  > *   If You A / Partner A: **3 pts**
  > *   If You A / Partner B: **0 pts**
  > *   If You B / Partner A: **5 pts**
  > *   If You B / Partner B: **1 pt**
  >
  > **Instruction:** You and your partner have received **word-for-word identical sheets**. You both know this. You both know that you both know this.
  >
  > [ ] Option A   [ ] Option B

  ---

  ### Run of Show (Facilitator Script)

  **Start (5 mins):**
  "Welcome. We're running three decision rounds. You have fixed partners. Maximize your points. The room's average score determines the snack: High average = premium chocolate. Low average = crackers. Don't talk."

  **Rounds (15 mins each):**
  1.  Hand out Round 1. "Read silently. Choose. Fold sheet." Collect.
  2.  Hand out Round 2. "Read silently. Choose. Fold sheet." Collect.
  3.  Hand out Round 3. "Read silently. Choose. Fold sheet." Collect.

  *Tip: While collecting, tally the choices quickly on a notepad so you have the stats for the debrief.*

  **Debrief (50 mins):**
  *Do not start by explaining superrationality.* Start by asking them what they felt.

  **Phase 1: The Data (10 mins)**
  Write the cooperation rates (Option A) on the board.
  *   "Round 1 (Mirror): __% Cooperated."
  *   "Round 2 (Near-Clone): __% Cooperated."
  *   "Round 3 (Clone): __% Cooperated."
  *   *Ask:* "Did your strategy change between rounds? Why?"

  **Phase 2: The Mapping (25 mins)**
  Now introduce the concepts. Draw three axes on the whiteboard: **Outcome Symmetry** (Do we want the same result?), **Procedural Symmetry** (Are we running the same mental algorithm?), **Epistemic Symmetry** (Do we have the same information?).

  1.  **Round 3 (Clone):**
      *   *Ask:* "Who felt a 'pull' to match their partner?"
      *   *Map:* High Outcome, High Epistemic, High Procedural.
      *   *Point:* This is the superrational ideal. "If I am rational, and you are rational, and we are identical, we must choose the same thing. Therefore I choose between (A,A) and (B,B). (A,A) is better."
  2.  **Round 2 (Near-Clone):**
      *   *Ask:* "Who hesitated because of that Admin Line?"
      *   *Map:* High Outcome, **Broken Epistemic**.
      *   *Point:* The payoffs were identical, but the *knowledge state* wasn't. Superrationality relies on Common Knowledge. If I think you might have info I don't, the 'identical algorithm' assumption cracks.
  3.  **Round 1 (Mirror):**
      *   *Ask:* "Did knowing their payoffs help or hurt?"
      *   *Map:* **Broken Outcome**, High Epistemic.
      *   *Point:* Even if we read each other's source code perfectly, if our utility functions differ (5 pts vs 8 pts temptation), 'rationality' might dictate different moves. Superrationality requires shared interests, not just shared minds.

  **Phase 3: The Break (15 mins)**
  Address the "We're both rational" premise.
  *   "In Round 3, did anyone defect? Why?"
  *   *Expected Answer:* "I couldn't trust them," or "Defecting is dominant."
  *   *The Hard Truth:* Tell them: "Superrationality isn't a logical proof; it's a causal bet. It only works if your decision *causes* theirs. In this room, you aren't clones. You're just similar. The 'pull' you felt in Round 3 was the intuition of that causal link. The 'break' you felt was the reality that you can't actually control their hand."

  ---

  ### Predictable Failure Modes (And How to Handle Them)

  **1. The "Jerk" Defector**
  *   **Risk:** Someone defects in Round 3 just to prove a point or ruin the graph.
  *   **Mitigation:** The **Group Pot** incentive is your shield. If they defect, they lower the room average. If the room gets crackers because of them, the social cost is high.
  *   **If it happens:** Do not call them out. In the debrief, say: "In a true clone scenario, defection is impossible because we are the same agent. The fact that defection happened here proves we were not clones. The experiment successfully demonstrated the *fragility* of the assumption." Frame the failure as data, not disruption.

  **2. The "It's Just Prisoner's Dilemma" Crowd**
  *   **Risk:** Programmers might say "B is dominant strategy, period. This is trivial."
  *   **Mitigation:** Acknowledge it. "Causal Decision Theory says Defect. Superrationality says Cooperate. I want you to notice which one your gut picked in Round 3. If your gut said Cooperate, CDT doesn't fully describe your reasoning."

  **3. The "Clone" Round Doesn't Feel Like Clones**
  *   **Risk:** You worried this would understate the pull. You are right. It will.
  *   **Honesty:** Admit this in the debrief. "This is the limitation of the exercise. You know you aren't clones. So the 'pull' is weaker than it would be for actual AI source-code sharing. But if you felt *any* pull toward A in Round 3 that you didn't feel in Round 1, that is the superrational intuition firing."

  **4. Confusion on Round 2 (Near-Clone)**
  *   **Risk:** People ignore the Admin Line.
  *   **Mitigation:** During collection, ask verbally: "How many people noticed the note about the line?" If low, acknowledge in debrief that epistemic symmetry is subtle. "The line didn't change payoffs, it changed *certainty*. If you ignored it, you treated it as high epistemic symmetry. If you worried, you treated it as low."

  ### What This Game Cannot Show
  Be honest about this in the final 5 minutes.
  1.  **Causal Mechanism:** The game cannot show *how* your choice influences theirs. In real superrationality (e.g., two AIs reading each other's code), the correlation is physical. Here, it's psychological.
  2.  **Iterated Trust:** This is a one-shot game. Superrationality is strongest in iterated contexts where "rationality" includes learning.
  3.  **The "Rational" Definition:** You cannot prove cooperators are more rational than defectors here. You can only show that cooperators rely on a different definition of rationality (one that includes the correlation of decisions).

  ### Final Facilitator Note
  Your job is not to convince them superrationality is "true." Your job is to make them feel the **tension** between Causal Decision Theory (Defect) and Evidential/Superrational Theory (Cooperate).

  If Round 3 ends with 100% cooperation, you've created a cult.
  If Round 3 ends with 0% cooperation, you've proven CDT.
  If Round 3 ends with ~60-70% cooperation, **you have successfully demonstrated the pull.** That gap between 0% and 70% is where the theory lives.
