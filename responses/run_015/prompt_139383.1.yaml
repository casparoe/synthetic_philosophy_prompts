          *   Address the Persistence issue in (f)/(g)/(j).
          *   Address the "Unwantedness" gap in (d)/(e).

      *(Self-Correction during drafting)*: Wait, look at (d) again. "Value function... or TD error." These are functionally distinct. Value is a state estimate. TD error is a learning signal/update. If suffering is a *state* (undergoing), Value makes more sense. If suffering is a *transition* (shock), TD error makes more sense. This needs to be flagged in the (d)/(e) tension.
      Also, look at (h). It says model-free is *not* a candidate. This is a strong claim. If functionalism (b) is true, why? Because model-free lacks the *representation* of the outcome as bad, it just has a disposition. This links to (e).
      So the core cluster is (b), (e), (h).
      (b) says organization matters.
