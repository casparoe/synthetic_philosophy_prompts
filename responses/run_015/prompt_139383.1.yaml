      Actually, the biggest leverage point is (h). It's the most specific and the most vulnerable to the functionalist commitment in (b). If I relax (h) to focus on *access* rather than *architecture*, it stabilizes (b) and (e).

      *Let's check (j) again.* "Implementation... not numerically the same." This is a classic Ship of Theseus. For a functionalist, identity is causal/functional continuity, not weight identity. I should tell them this dissolves if they stick to (b).

      *Final Plan:*
