      *   *Correction on User's BHW view:* In BHW, agents *do* update beliefs. But once the cascade starts, their action is independent of their signal. They aren't "lying"; they are genuinely convinced (or indifferent) based on the public weight.
      *   *Correction on User's SS view:* In SS, they aren't necessarily "lying" in a deceitful sense; they are optimizing a different variable.
      *   *Key Insight:* BHW is a failure of *learning*. SS is a failure of *incentives*.

  8.  **Final Polish:**
