      *   *The Fallacy:* Is there a specific name? "Mot-and-Bailey" is close but usually involves a controversial vs. modest claim. Here it's Definition A vs. Definition B. "Equivocation" is the logical term, but the user says it doesn't feel like it. I should explain *why* it feels different (because the definitions are compatible in extension, but not intension). The breakage is **Modal Stability**.
