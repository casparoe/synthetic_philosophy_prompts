          2.  Clarification on the historical figures (James vs. Peirce).
          3.  A "carving" of the conceptual space (axes, differences).
          4.  A specific "killer question" to force commitment in an argument.

  2.  **Identify the Philosophical Tradition:**
      *   The slogan "truth is what works" immediately points to **Pragmatism**.
      *   The tension between "what works for me now" and "the limit of inquiry" is the classic split between **William James** and **Charles Sanders Peirce**.
      *   Case 2 sounds like **Social Epistemology** or **Consensus Theory**, often conflated with Pragmatism in popular discourse.
      *   Case 3 sounds like **Transcendental Pragmatism** (Apel/Habermas) or perhaps **Strawsonian Descriptive Metaphysics**, but in a pragmatic guise (Kantian Pragmatism).
      *   The *move* itself (sliding between definitions to win an argument) is often called **Motte-and-Bailey** (though that's usually about a defensible vs. controversial claim) or **Conceptual Stretching**. However, the user is asking about the *philosophical family*, not just the fallacy. The fallacy aspect is a "Bait-and-Switch" on the definition of truth.
      *   The specific philosophical phenomenon of treating these distinct views as one blob is often called **Vulgar Pragmatism** or **Instrumentalism** (in a loose sense).
      *   But the *slide* itself is best described as **Pragmatic Equivocation** or shifting between **Epistemic Utility** and **Metaphysical Truth**.

  3.  **Address the Historical Figures (James vs. Peirce):**
      *   *Peirce:* Truth is the opinion fated to be ultimately agreed to by all who investigate (The Limit of Inquiry). This matches Case 1(b) and Case 2's "long-run" defense.
      *   *James:* Truth is what is "expedient in the way of our thinking," what works for the individual's life. This matches Case 1(a).
      *   *Relationship:* Peirce hated James's interpretation. He renamed his own view "Pragmaticism" to distinguish it.
      *   *Case 4 (The Room):* This is closer to **Consensus Theory of Truth** (Habermas?) or simple **Relativism/Subjectivism**.
      *   *Case 3 (Presupposition):* This is **Transcendental Argumentation** often adopted by Neo-Pragmatists (like Rorty or Brandom) or Kantians.

  4.  **Carve the Conceptual Space (The Axes):**
      *   I need to map the user's (a), (b), (c), (d) onto a coherent framework.
      *   *Axis 1: Temporal.* Now (a, d) vs. Ideal Future (b).
      *   *Axis 2: Scope.* Individual (a) vs. Community (d) vs. Universal/Ideal (b, c).
      *   *Axis 3: Function.* Instrumental/Psychological (a) vs. Constitutive/Normative (b, c).
      *   *Let's refine the categories:*
          1.  **Psychological Pragmatism (Jamesian):** Truth = Cash value for *me* now. (Case 1a)
