  5.  **Identify the "Breakage" (The Logical Flaw):**
      *   The user notes it's not standard equivocation. It's a failure of **Invariance**.
      *   In philosophy of science/logic, this is sometimes called **Criterion Shifting** or **Goalpost Moving**, but specifically regarding the *definition of truth*.
      *   The specific philosophical term for conflating *warrant* (reasons to believe) with *truth* (the fact itself) is conflating **Epistemology with Metaphysics**.
      *   The move is: "You attacked my *warrant* (is it really true?), so I'll switch to a different theory of *truth* that makes your attack irrelevant."
      *   A strong candidate for the name of the *move* is **The Pragmatic Shuffle**. (Not a formal term, but descriptive).
      *   A more formal term might be **Conflating Verification Conditions with Truth Conditions**.

  6.  **Develop the "Killer Question":**
