          *   *Case 2 (Meeting):* Slides between "truth is what this group accepts" (Consensus/Social Constructivism) and "truth is the objective/long-run fact" (Realism/Peircean).
          *   *Case 3 (Philosophy):* Slides between "truth is what we must presuppose to act" (Transcendental Argument/Kantian/Strawsonian) and the others.
      *   **The User's Insight:** It's not simple equivocation because the concepts *could* overlap (a belief could be both useful and the limit of inquiry). The problem is the *unstable commitment* to a specific criterion when challenged.
      *   **The Goal:** The user wants:
