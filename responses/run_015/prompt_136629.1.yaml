answer: |-
  You have identified one of the most persistent and frustrating ambiguities in modern philosophy. You are not inventing these categories; you are stumbling into the fault lines of the **Pragmatist tradition**, specifically the unresolved tension between its founders.

  The "slide" you are seeing doesn't have a single standardized name in logic (it is a form of **equivocation**, but you are right that it feels distinct because the extensions *can* overlap). In philosophical discourse, this is often called **conflating truth conditions with assertibility conditions**, or **conflating the grounds for belief with the nature of truth**.

  However, to give you the "carving" you asked for, we need to look at the history and the specific axes of difference.

  ### 1. The Historical Feud: Peirce vs. James
  You suspected two guys started the tradition and hated each other. You are correct.

  *   **Case 1(b) is Charles Sanders Peirce.** He defined truth as the opinion "fated to be ultimately agreed to by all who investigate." This is the **Ideal Limit of Inquiry**. It is realist, objective, and future-oriented. Peirce believed there is a reality out there that constrains inquiry, and eventually, we will all converge on it.
  *   **Case 1(a) is William James.** He popularized the slogan "truth is what works." For James, truth is a property of ideas that proves itself to be "expedient in the way of our thinking." It is cash-value, psychological utility, and present-oriented.

  Peirce was horrified by James's interpretation. He wrote that James's version made truth "whatever it is to our advantage to believe," which Peirce thought was subjectivist nonsense. Peirce actually renamed his own philosophy **"Pragmaticism"** (a term he called "ugly enough to be safe from kidnappers") specifically to distinguish it from James's "Pragmatism."

  ### 2. The Carving: Mapping Your Four Cases
  You identified four distinct claims that get mashed together. Here is how they map onto established philosophical positions. They differ along three axes: **Time** (Now vs. Ideal Future), **Scope** (Individual vs. Community vs. Universal), and **Ground** (Psychological vs. Metaphysical vs. Logical).

  | Case | Your Description | Philosophical Label | Key Feature |
  | :--- | :--- | :--- | :--- |
  | **(a)** | "It works for me now / makes me a better dad." | **Instrumentalism / Jamesian Pragmatism** | **Psychological Utility.** Truth is a tool for coping. If it stops working, it stops being true. |
  | **(b)** | "The limit of inquiry with all evidence." | **Peircean Realism / Convergence Theory** | **Ideal Consensus.** Truth is independent of what we think *now*, but defined by what we *would* think ideally. |
  | **(c)** | "We must presuppose it to act." | **Transcendental Pragmatism / Kantianism** | **Constitutive Necessity.** Not about "working," but about the *conditions of possibility* for agency. (Associated with Strawson, Apel, Habermas). |
  | **(d)** | "The people in this room accept it." | **Consensus Theory / Social Constructivism** | **Actual Consensus.** Truth is reduced to current social agreement or authority. (Often a vulgarization of Habermas or Kuhn). |

  ### 3. What Breaks the Argument?
  You noted that it isn't standard equivocation because a belief *could* be both useful and the limit of inquiry. The breakage is **Modal Stability**.

  In a coherent theory of truth, the truth-value of a proposition should not fluctuate based on the *context of the objection*.
  *   When you challenge the **evidence**, they retreat to **Utility** (Case 1a).
  *   When you challenge the **utility**, they retreat to **Ideal Inquiry** (Case 1b).
  *   When you challenge the **consensus**, they retreat to **Authority** (Case 2).

  The logical error is treating **Epistemology** (how we know/justify) as identical to **Metaphysics** (what is the case).
  *   (a) and (d) are **Epistemic** claims (reasons to hold the belief).
  *   (b) is a **Metaphysical** claim disguised as epistemic (what the belief *is*).
  *   (c) is a **Transcendental** claim (what makes the belief possible).

  By sliding between them, the speaker avoids having to defend the *connection* between the utility and the reality. They want the authority of Realism (b) without the risk of Falsification (b), and the comfort of Relativism (a) without the accusation of Solipsism (a).

  ### 4. Missing Members of the Family
  You asked if there are versions you missed. Yes, two major ones:

  1.  **Neo-Pragmatism (Rorty/Brandom):** This drops the "Truth" word entirely. They argue we should stop worrying about "what is true" and only talk about "what we are justified in asserting to each other." This is essentially Case (d) formalized. They would say your objection in Case 2 ("they might be wrong") is meaningless because "wrong" just means "what the future community won't accept."
  2.  **Evolutionary Pragmatism:** Truth is what helped our ancestors survive. This is a version of (a) scaled to the species level over deep time. It argues our cognitive faculties are tuned for fitness, not truth—which ironically undermines the argument itself (the Evolutionary Argument Against Naturalism).

  ### 5. The Killer Question
  You want a single question to force commitment. The goal is to break the overlap. You need a scenario where **Utility** and **Ideal Inquiry** diverge.

  Ask this:

  > **"If we knew for a fact that holding this belief made you happier and more effective, but that the ideal limit of scientific inquiry would eventually prove it false... would you say the belief is *true* now, or *false* now?"**

  *   **If they say "True":** They are a Jamesian Instrumentalist (Case 1a). You can now challenge them on whether "truth" is just a synonym for "comfort."
  *   **If they say "False":** They are a Peircean Realist (Case 1b). You can now challenge them on why they are asserting it as fact *before* that inquiry is complete.
  *   **If they say "That's impossible":** They are assuming a Pre-established Harmony (that reality is rigged to make useful things true). This is a theological or metaphysical claim they likely haven't defended.
  *   **If they say "It depends on who you ask":** They are a Relativist/Consensus Theorist (Case 2d). You can ask why their room's consensus matters more than the evidence.

  ### Summary for your next argument
  When you see the slide, you can say:
  *"You are sliding between **Peirce** (truth is the final destination of inquiry) and **James** (truth is what gets you out of bed). Those are incompatible. If the 'what works' answer turns out to be factually wrong in the long run, which one wins? Pick one, because your argument relies on them being the same thing, and they aren't."*

  This forces them to stop using the "Truth" label as a shield and commit to whether they are arguing about **facts** or **feelings**.
