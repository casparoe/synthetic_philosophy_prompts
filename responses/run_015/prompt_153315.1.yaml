prompt: |-
  For a philosophy of knowledge workshop, write the complete desiderata specification that any adequate resolution of the epistemic regress problem—foundationalist, coherentist, infinitist, or hybrid—must satisfy, with the conceptual or case-based motivation for each criterion. Focus on what makes a theory sufficient rather than on historical taxonomy.

  Your list must cover: (i) the explanatory targets, including perceptual justification, preserved belief through memory, reasoning that involves premises about one's own cognitive reliability, and specifically cases of partial epistemic circularity in which a belief about a faculty's trustworthiness is itself an output of that faculty; (ii) the distinctions that must not be collapsed, particularly between having justification and having a specific degree or robustness of it, and between vicious circularity and benign mutual support among beliefs; (iii) consistency constraints with cognitively finite agents, the non-arbitrariness condition on terminal beliefs, and the prohibition on entailing global skepticism; (iv) an explicit marking of which desiderata are non-negotiable—failure on any means inadequacy—versus which are camp-specific preferences, such as demands for strictly linear ordering, infinite accessibility of reasons, or the denial of any non-inferential justification.

  Also address whether any subset of the non-negotiable desiderata is jointly unsatisfiable in light of structural tensions analogous to no-go results in other domains, and identify which single requirement does the most work in excluding popular candidates.

  Deliver this as a table with exactly these columns: Desideratum; Motivating Case or Conceptual Pressure; Negotiability (Non-negotiable / Camp Preference / Contested); Contenders Most Threatened. After the table, provide a structured JSON summary with exactly these fields: "jointly_unsatisfiable_subset" (array of strings), "tension_description" (string), "most_excluding_requirement" (string), "camp_preferences" (array of strings), and "purpose_statement" (string summarizing what adequacy is being evaluated for).

  Keep the weight on the criteria and their rationales; do not provide a historical scorecard, citation list, or bibliographic references. The standard of adequacy is a theory capable of explaining human epistemic achievement without arbitrariness or skepticism, while accommodating self-referential justification loops.
