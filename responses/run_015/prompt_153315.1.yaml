answer: |-
  | Desideratum | Motivating Case or Conceptual Pressure | Negotiability (Non-negotiable / Camp Preference / Contested) | Contenders Most Threatened |
  | :--- | :--- | :--- | :--- |
  | **Non-Arbitrary Termination** | The regress must stop without resorting to dogmatic assertion; terminal beliefs require a status that halts the demand for further reasons without arbitrariness. | Non-negotiable | Dogmatic Foundationalism; Naive Contextualism |
  | **Finite Cognitive Accessibility** | Human agents cannot traverse or hold actually infinite chains of reasons; justification must be accessible within finite cognitive limits. | Non-negotiable | Actualist Infinitism |
  | **Anti-Skepticism** | The theory must entail that some beliefs are actually justified; a solution that validates the regress problem by denying knowledge is inadequate. | Non-negotiable | Pyrrhonian Skepticism; Hard Infinitism |
  | **Perceptual Input Accommodation** | Must explain how non-doxastic sensory states can confer justification on beliefs without requiring prior inference (the Input Objection). | Non-negotiable | Pure Coherentism; Idealism |
  | **Memory Preservation** | Justification must persist over time without requiring the agent to continuously re-derive original premises (the Forgetfulness Objection). | Non-negotiable | Strict Internalist Infinitism; Rigid Foundationalism |
  | **Self-Referential Reliability** | Must account for cases where a belief about a faculty's trustworthiness is itself an output of that faculty (partial epistemic circularity) without collapsing into viciousness. | Non-negotiable | Strict Linear Foundationalism; Naive Externalism |
  | **Justification/Robustness Distinction** | Must distinguish between possessing justification and possessing certainty or infallibility; justification admits of degrees and defeasibility. | Non-negotiable | Infallibilist Foundationalism; Cartesian Internalism |
  | **Benign/Vicious Circularity Distinction** | Must differentiate between question-begging loops (vicious) and mutual support among coherent beliefs (benign); not all circularity is fatal. | Non-negotiable | Naive Coherentism; Linearist Theories |
  | **Strict Linear Ordering** | Reasons must be arrangeable into a single, non-branching chain of inference where every belief has exactly one immediate justifier. | Camp Preference | Coherentism; Holistic Foundationalism |
  | **Existence of Non-Inferential Justification** | Requires that some beliefs are justified solely by experience or presence, without inference from other beliefs. | Camp Preference | Coherentism; Infinitism |
  | **Infinite Accessibility of Reasons** | Requires that for any justified belief, there is always a further reason available ad infinitum that the agent can access. | Camp Preference | Foundationalism; Coherentism; Finitism |

