answer: |-
  ### Scratch Brainstorm: Axes of Variation

  Before structuring the decision tree, we need to isolate the independent variables causing the conceptual drift. These are the dimensions along which a use of "native" can slide.

  1.  **Referent:** Is the word attached to a biological taxon (e.g., *Echinacea purpurea*) or a non-botanical object/concept (e.g., "native gardening style," "native compost")?
  2.  **Vector of Arrival:** Did the organism arrive via natural range expansion/dispersal, or was it mediated by human transport (intentional or accidental)?
  3.  **Temporal Baseline:** Does the claim rely on a specific historical cutoff (e.g., pre-1800, pre-contact) or is it agnostic to time (e.g., "it's here now")?
  4.  **Genetic Integrity:** Does the claim require the plant to be a straight species, or does it accommodate cultivated varieties (nativars/clones)?
  5.  **Criterion of Value:** Is the status determined by *history* (where it came from) or *function* (what it does for pollinators/soil now)?
  6.  **Speech Act:** Is the user making a descriptive claim (fact-checkable), a normative claim (what *should* be planted), or an identity signal (who belongs in this group)?

  ***

  ### Logical Space Grid

  Here is the grid of combinations allowed by the axes above. I have marked which cells are occupied by our named positions and diagnosed the empty ones.

  | Vector | Temporal | Genetic | Criterion | Occupied Position | Diagnosis of Empty/Adjacent Cells |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Natural** | **Pre-Settlement** | **Straight** | **History** | **Baseline Purist** | |
  | **Natural** | **Pre-Settlement** | **Straight** | **Function** | **Local Provenance** | *Overlap:* Often merged with Baseline, but stricter on seed source. |
  | **Natural** | **Pre-Settlement** | **Cultivar** | **History** | **Cultivar-Tolerant** | |
  | **Human** | **Any** | **Any** | **History** | **No-Human-Transport** | *Merge:* Often folds into Identity/Gatekeeper when used aggressively. |
  | **Any** | **Any** | **Any** | **Function** | **Ecological Function** | |
  | **Unknown** | **Any** | **Any** | **History** | **Marketplace Label** | *Diagnosis:* Epistemic humility or negligence. |
  | **Any** | **Any** | **Any** | **Identity** | **Belonging/Identity** | *Diagnosis:* Speech act overrides botanical content. |
  | **Any** | **Any** | **Any** | **Reject** | **Deflationary** | *Diagnosis:* Meta-linguistic refusal. |
  | **Non-Plant** | **N/A** | **N/A** | **N/A** | **Halo/Vibe** | *Diagnosis:* Category error. |
  | **Natural** | **Present-Day** | **Straight** | **History** | **Range Shift** | *Empty:* Incoherent under strict Baseline; occupied by Functionalist. |
  | **Human** | **Pre-Settlement** | **Straight** | **History** | **N/A** | *Empty:* Historically impossible (unless indigenous transport counts). |
  | **Natural** | **Pre-Settlement** | **Cultivar** | **Function** | **N/A** | *Empty:* Unoccupied; cultivars usually defended on history or aesthetics. |

  ***

  ### Moderation Decision Tree: "The Native Sorter"

  **Instructions for Mods:** Run the post through the questions in order. Stop at the first Leaf. Do not infer intent unless the text explicitly signals it. If the post requires thread context to answer a question, flag for "Context Review" rather than acting immediately.

  **Q1.** Is the word "native" applied to a specific plant taxon (species, genus, or cultivar) in this post?
  *   **No:** Go to Q2.
  *   **Yes:** Go to Q3.

  **Q2.** Is "native" being used to describe a gardening method, vibe, or non-plant object (e.g., "native soil," "native mindset")?
  *   **Yes:** **LEAF A (The Halo/Vibe).**
  *   **No:** (Edge case: typo or unrelated) -> **LEAF H (Deflationary/Noise).**

  **Q3.** Is this post a marketplace listing or offer to trade/sell?
  *   **Yes:** Go to Q4.
  *   **No:** Go to Q5.

  **Q4.** Does the seller admit uncertainty about provenance (e.g., "I don't know the seed source") while keeping the "native" label?
  *   **Yes:** **LEAF B (The Marketplace Label).**
  *   **No:** (Claims certainty) -> Treat as standard claim (Go to Q5).

  **Q5.** Does the post explicitly mention a named cultivar, nursery variety, or "nativar"?
  *   **Yes:** Go to Q6.
  *   **No:** Go to Q7.

  **Q6.** Does the poster argue the cultivar *counts* as native despite being bred/cloned?
  *   **Yes:** **LEAF C (The Cultivar-Tolerant).**
  *   **No:** (Asking if it counts) -> Flag for **Context Review** (Could be Baseline or Cultivar-Tolerant depending on replies).

  **Q7.** Does the post mention human transport, moving plants, or bringing starts from elsewhere?
  *   **Yes:** Go to Q8.
  *   **No:** Go to Q9.

  **Q8.** Does the poster argue that human transport *disqualifies* the plant from being native (e.g., "I moved it, so it's not native")?
  *   **Yes:** Go to Q10.
  *   **No:** (Argues it counts anyway) -> Go to Q9.

  **Q9.** Does the post argue that ecological function (pollinators, soil health) matters more than where the plant came from?
  *   **Yes:** **LEAF D (The Ecological Functionalist).**
  *   **No:** Go to Q10.

  **Q10.** Does the post specify a local seed source or genotype (e.g., "local ecotype," "seed collected within 50 miles")?
  *   **Yes:** **LEAF E (The Local Genotype).**
  *   **No:** Go to Q11.

  **Q11.** Does the post reference a historical baseline (e.g., "pre-1800," "pre-settlement," "original range") as the deciding factor?
  *   **Yes:** **LEAF F (The Baseline Purist).**
  *   **No:** Go to Q12.

  **Q12.** Does the post use "native" to define who belongs in the community or imply moral superiority/exclusion (e.g., "If you say X you aren't welcome")?
  *   **Yes:** **LEAF G (The Gatekeeper/Identity).**
  *   **No:** Go to Q13.

  **Q13.** Does the post suggest we should stop using the word "native" entirely?
  *   **Yes:** **LEAF H (The Deflationary).**
  *   **No:** **FLAG: Context Review** (Ambiguous claim, needs thread history).

  ***

  ### The Leaves (Dispositions)

  1.  **LEAF A: The Halo/Vibe**
      *   *Awkward Commitment:* Commits you to calling compost or gardening styles "indigenous" without biological referents.
      *   *Disposition:* **Allow with Tag.** (Tag as "Discussion," not "Plant ID". No botanical fact-checking needed.)
  2.  **LEAF B: The Marketplace Label**
      *   *Awkward Commitment:* Commits you to selling a plant as "native" while admitting you don't know if it actually is.
      *   *Disposition:* **Require Edit.** (Must change label to "Naturalized" or "Unknown Provenance" to prevent misinformation.)
  3.  **LEAF C: The Cultivar-Tolerant**
      *   *Awkward Commitment:* Commits you to calling a plant bred in Europe for shorter stems "native" to Michigan.
      *   *Disposition:* **Allow.** (Valid gardening preference, but flag if sold as straight species.)
  4.  **LEAF D: The Ecological Functionalist**
      *   *Awkward Commitment:* Commits you to accepting invasive species if they feed bees (e.g., Dame's Rocket).
      *   *Disposition:* **Allow.** (Valid philosophical stance, but monitor for invasive species rule violations.)
  5.  **LEAF E: The Local Genotype**
      *   *Awkward Commitment:* Commits you to rejecting a straight species of the correct range because it came from 800 miles away.
      *   *Disposition:* **Allow.** (High precision claim. Verify seed source if traded.)
  6.  **LEAF F: The Baseline Purist**
      *   *Awkward Commitment:* Commits you to denying native status to plants that migrated naturally due to climate change post-1800.
      *   *Disposition:* **Allow.** (Standard restoration definition. Check against state native lists.)
  7.  **LEAF G: The Gatekeeper/Identity**
      *   *Awkward Commitment:* Commits you to treating botanical disagreements as moral failures or identity threats.
      *   *Disposition:* **Remove & Warn.** (Safety issue. Shifts from botany to harassment/exclusion.)
  8.  **LEAF H: The Deflationary**
      *   *Awkward Commitment:* Commits you to using clumsy phrases like "locally adapted non-invasive suitable for clay" every time.
      *   *Disposition:* **Pin/Highlight.** (Useful meta-discussion. Encourage this precision.)

  ***

  ### Tree Limitations & Flags

  **Inseparable Leaves:**
  *   **Leaf F (Baseline) vs. Leaf E (Local Genotype):** The tree separates these based on whether "local seed" is explicitly mentioned (Q10). However, many Baseline Purists assume local genotype without stating it. If a user says "Must be pre-1800 range" but doesn't mention seed source, they land in F. If they later reveal they demand local seed, they are actually E. *Mod Action:* Treat F as E if provenance becomes an issue in replies.
  *   **Leaf G (Identity) vs. Leaf F (Baseline):** A aggressive Baseline Purist can sound like a Gatekeeper. The tree separates them at Q12 (explicit belonging/exclusion). *Mod Action:* If a Baseline claim turns into personal attacks in the thread, reclassify as G retroactively.

  **Context Dependence:**
  *   **Q6 (Cultivar Count):** If a user asks "Is this still native?", the tree flags for Context Review. The classification depends on the *answers* they accept.
  *   **Q13 (Ambiguous Claim):** If a user says "This is native" without qualifying criteria, we don't know if they mean F, E, or C. *Mod Action:* Do not remove. Ask for clarification ("Do you mean straight species or nativar?").

