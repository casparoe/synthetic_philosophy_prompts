  ### New Member Quiz: "What Do You Mean by Native?"

  *Pin this in #welcome. Purpose: Self-sorting. Not for moderation.*

  **Q1. You see a Purple Coneflower at a nursery. It's a named variety bred for bigger flowers. Do you call it "native"?**
  *   A) Yes, it's the right species basically.
  *   B) No, it's a cultivar/nativar.
  *   C) Only if it feeds pollinators as well as the wild type.

  **Q2. Your neighbor gives you a plant from their yard 200 miles away. It's a species found in both locations. Is it native to your yard?**
  *   A) Yes, same species.
  *   B) No, humans moved it.
  *   C) Yes, but only if it's from local seed stock originally.

  **Q3. A plant species is expanding its range north because of climate change. It arrives in your county naturally. Is it native?**
  *   A) Yes, it walked here.
  *   B) No, it wasn't here before 1800.
  *   C) Who cares, is it invasive?

  **Q4. Someone says "I only plant native." What do you hear?**
  *   A) They avoid invasives and exotics.
  *   B) They only want pre-settlement local ecotypes.
  *   C) They are signaling they are a "good" environmentalist.

  **Q5. You see a listing: "Native Plants, Locally Collected." The seller doesn't know the genetic source. Is this honest?**
  *   A) Yes, "native" is a general category.
  *   B) No, "locally collected" implies specific genetics they can't verify.
  *   C) It's fine, as long as the species is on the state list.

  **Q6. We have a thread arguing about whether "native" is a useful word. What's your take?**
  *   A) Keep it, it's standard terminology.
  *   B) Change it, use "locally adapted" instead.
  *   C) It depends on who is using it.

  **Scoring Key:**
  *   **Mostly A:** **The Cultivar-Tolerant / Marketplace.** You use "native" as a broad category for non-invasive regional plants. *Note: Mod Tree Leaf C or B.*
  *   **Mostly B:** **The Baseline Purist / Local Genotype.** You care about history and genetics. *Note: Mod Tree Leaf F or E.*
  *   **Mostly C:** **The Ecological Functionalist.** You care about what the plant does. *Note: Mod Tree Leaf D.*
  *   **Mixed/High C on Q4:** **The Identity/Social.** You see the term as cultural signaling. *Note: Mod Tree Leaf G.*
  *   **Mostly B on Q6:** **The Deflationary.** You want to retire the word. *Note: Mod Tree Leaf H.*

  **Discrepancy Note:**
  The Quiz sorts *people* by their internal definition. The Mod Tree sorts *posts* by their external risk.
  *   *Discrepancy:* A user might score as **Baseline Purist** on the quiz (believing in strict definitions) but post a **Marketplace Label** (Leaf B) because they are selling something uncertain. The Quiz says "You are a Purist," the Tree says "This post is Misleading."
  *   *Discrepancy:* A user might score **Functionalist** (Quiz) but post a **Gatekeeper** comment (Leaf G) if they feel threatened. The Quiz doesn't catch toxicity; the Tree does.

