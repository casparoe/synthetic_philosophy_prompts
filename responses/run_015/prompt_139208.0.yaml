      (Writing...)
      The river swelled every April, thick with silt and the dead branches of winter, and the intake screens at the hydro plant caught it all. For twenty years the town of Oakhaven drew its power from the run-of-river turbine, and for fifteen of those years, Mara had been the one who hiked the ridge when the water rose too high. It was never in the rota. The official crew consisted of four men who checked the gauges and greased the bearings, but none of them liked the mud slide up to the screens, and none of them owned boots that could handle the slick rock. Mara did. She started doing it the third year she moved into the valley, just because she was going up anyway to check her trap lines. She cleared the debris, came down, and mentioned it at the co-op. People bought her a beer. They called her a lifesaver. They said the town didn't know what it would do without her.

      For the first few years, the beer flowed freely and the thanks were loud. Every time she came down with mud caked to her thighs, someone clapped her on the shoulder. But gratitude is a currency that devalues with circulation. By year five, the beer was occasional. By year ten, people just nodded when she walked past with her rake and rope. The act remained the same, a solitary struggle against the clogging mesh, but the context shifted. The town began to schedule around her labor without asking. The dairy farmer didn't bother checking the backup generator because he knew Mara would clear the screens before the voltage dropped. The clinic stopped stocking extra oxygen tanks because the power never failed in spring. They didn't vote on this reliance. They didn't hold a meeting. They simply observed a pattern and built their stability on top of it, like stacking stones on a foundation someone else had poured for free.

      This spring, Mara did not go up. She had no emergency. She was not sick. She had simply decided on Friday night that she wanted to sit on her porch and watch the rain without worrying about her footing on the ridge. She wanted a weekend. She told no one she was opting out because she had never opted in. She just stayed home. The water rose, the leaves matted against the steel mesh, and the flow choked. The turbine shuddered and slowed. The lights in Oakhaven dimmed to a amber hum before going out entirely. It lasted six hours. Milk soured in the dairy. The incubator at the clinic switched to battery and beeped loudly enough to wake the nurses. The electric fences down in the lower pasture failed, and three cows wandered into the road.

      When the power came back, it was because the official crew had finally driven up in the truck and hacked at the debris with tools that were too short, damaging the screen in the process. They fixed the flow, but the damage to the social fabric was already done. The meeting was held two days later in the community hall. It was not a tribunal, nobody used those words, but the air was thick with accusation. The dairy farmer said he lost three hundred dollars of product. The nurse said the stress was unacceptable. They did not say Mara had broken a rule. They said she had let them down. There is a difference. Breaking a rule is a violation of contract. Letting someone down is a violation of trust. They looked at her not as a volunteer who had withdrawn labor, but as a component that had failed to engage.

      Mara sat in the back and listened. She felt the cold weight of their expectation. She realized that the early beers, the early praise, had not been gifts. They were deposits. They were down payments on a future she hadn't agreed to mortgage. By accepting their gratitude back then, had she signed a lease on her own weekends? She looked at the faces of people she had known for half her life. They looked betrayed. They weren't angry that she was selfish. They were angry that the world had suddenly become unpredictable again. They had built a life on the assumption of her reliability, and when she reclaimed her unpredictability, she collapsed their planning. She had the right to stay home. Everyone in the room knew she had the right. But rights do not keep the lights on.

      In the end, nobody asked her to promise to do it again. Nobody asked her to quit. They just stopped buying her beer. The silence was heavier than the anger. She still hikes up sometimes, when the water looks particularly high, but the walk feels different now. It is no longer a gift she gives the valley. It is a tax she pays to walk through the store without feeling the weight of their eyes. The town still has power, mostly, but the trust is intermittent, flickering like a bulb with a loose connection. They know she can leave them in the dark. She knows they will never forgive her for proving it.

      The genuinely uncomfortable part of this knot is that reliance creates a moral debt even without consent, because human planning requires predictability that individual autonomy inherently threatens. We want to be free to change our minds, but we also want to be able to depend on others, and you cannot have both without someone eventually feeling cheated.

