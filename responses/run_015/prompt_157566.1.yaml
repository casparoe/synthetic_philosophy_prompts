      *Self-Correction on d10 (Exit Option):* Prompt asks "is that a requirement on the procedure or... institution". I need to be clear. I will classify it as Legitimacy but note in the desideratum that it may require institutional backing.

      *Refining d1:* The prompt says "A theory that answers all three with a single mechanism should be marked down". So d1 should require *distinct* mechanisms or explicit separation.

      *Refining d2:* "executable in principle by the system itself at inference time".

      *Let's build the table.*

