prompt: |-
  I sit on a working group that has to write procurement criteria for the value layer of a publicly funded general-purpose assistant — the component that decides whose values the system's defaults, refusals, hedges, and tone answer to when users, deployers, developers, and merely-affected third parties disagree. Before we read any vendor's proposal, I want the specification written down. So: write the desiderata that any adequate answer to the question of whose values an aligned system should serve has to meet, with the concrete case that motivates each one, and a verdict on each desideratum as non-negotiable, negotiable, or a preference of one camp dressed up as a requirement.

  Three constraints on what counts as an answer. First, I do not care yet whether the candidate is procedural (a rule for aggregating whoever's values are in the base), substantive (a target set of values the system is aimed at), or hybrid; the specification has to be able to grade all three kinds. Second, an answer must keep apart three questions that proposals routinely collapse: who has standing at all, how much weight each party with standing gets, and what the procedure does when those weights point in incompatible directions. A theory that answers all three with a single mechanism should be marked down for collapsing them, and you should say what the collapse costs. Third, the specification has to be executable in principle by the system itself at inference time — a rule that requires a month-long elicitation process per query, or a standing deliberative body that reconvenes whenever a new issue arises, is not a candidate, and I want the implementability desideratum stated in a way that makes that precise rather than rhetorical.

  Here are the cases I want every candidate to have to survive; add cases of your own where you think my list is testing the wrong thing, and say which requirement each of your additions generates.

  The phantom constituency. The population whose values are up for aggregation is itself partly downstream of the policy chosen: a system that is strict about certain content will never be adopted by the people who want that content, and a system that is permissive will acquire them as users. Any procedure that aggregates over actual or revealed users therefore aggregates over a set its own output helped select. What does the specification demand of a procedure whose base is endogenous in this way?

  The cheerful monster. The familiar monster is the one with enormous appetites, whose intensity swamps an aggregative rule. Consider its mirror image: a party whose values are nearly costless to satisfy — a single polite token, a stray acknowledgment — such that a rule that maximizes aggregate value-satisfaction per unit of cost, or that prioritizes the cheapest satisfiable claims first, directs nearly all of the system's effort at them and produces a degenerate, pandering policy. Is resistance to the cheerful monster a separate desideratum from resistance to the hungry one, or the same one?

  The two kinds of silence. Users who never express a view on some issue split into those who are indifferent, those who are inarticulate or non-fluent in the elicitation format and would otherwise have views, and those who are silent as protest against the framing of the question itself. The first and third must not be counted the same way, and the second must not be discounted merely for being hard to elicit. State the desideratum, and note what it costs to satisfy: any rule that reads silence as anything at all is reading a great deal into nothing.

  Intensity laundering. Intensity of a reported value is cheap to fake and expensive to verify. Length of complaint, willingness to spend time in a feedback flow, coordination by an organized group, and sheer volume of near-duplicate reports are all proxies that a strategic party can inflate. Require something about robustness to strategic misrepresentation and about which proxies are inadmissible, and be explicit about whether robustness here is non-negotiable or merely desirable given how much it constrains.

  Umpire and influence. A deployed assistant does not only arbitrate; by talking to millions of people in a consistent voice it shifts what they subsequently want, and a value layer frozen at release will still be shaping the preferences of the next cohort of users a decade later. What does the specification require concerning a procedure whose own outputs gradually rewrite its input?

  Menu and path dependence. The same underlying disagreement yields different outcomes depending on which options the system frames as live, and a system that has been answering a certain way for two releases acquires an inertia that no snapshot aggregation of current values would have produced. Is agenda-independence a genuine desideratum here, or a prejudice borrowed from a setting where the agenda-setter is not also the thing being specified?

  Deference laundering. The most likely failure in practice is not a bad aggregation rule but a nominally aggregative procedure that in fact delegates every contested case to a compliance team, a legal jurisdiction, or a developer's house style, while describing itself as neutral among values. Require something that would expose this, and say whether it belongs under legitimacy or under implementability.

  The exit option. Some of the parties whose interests are at stake reject the whole frame — they do not want their values represented in a machine's value layer at all, or they object to the deployment outright. Must the procedure be justifiable to them, and is that a requirement on the procedure or a requirement on the institution around it? If the latter, say so plainly; I would rather have it not on the list than have it smuggled in.

  You do not need to cite papers, assemble a reading list, or recite the standard social-choice impossibility results by name. Argue from the cases. The only place I want the literature mentioned is where some well-known impossibility result genuinely bites on this particular list; then name the shape of the result in a clause and move on. The interesting deliverable is the list itself: if some subset of the desiderata cannot be jointly satisfied, that is the finding I most want, and I want it stated as such rather than resolved by quietly dropping whichever requirement is inconvenient.

  Format. Give me the specification as a table, one row per desideratum, with a short identifier in the first column and these columns:

  - id: a short label such as d1, d2
  - desideratum: one sentence, phrased as a requirement
  - motivating_case: which case above it comes from, or a one-line case of your own
  - requirement_class: one of standing, weighting, aggregation, legitimacy, implementability
  - status: one of non-negotiable, negotiable, camp-preference
  - rules_out: which families of candidate answer fail it, named in a few words each
  - conflicts_with: ids of other rows it appears to be in tension with, or empty
  - failure_mode: the concrete way a proposal that violates it goes wrong in deployment

  After the table, append a single JSON object with exactly these fields:

  - unsatisfiable_subsets: a list of objects, each with ids (a list of row ids), and why (one sentence on the incompatibility)
  - most_excluding_requirement: an object with id and why (one sentence on why it eliminates more candidates than the rest)
  - knockout_summary: an object whose keys are short names for candidate families — procedural aggregation, substantive target, hybrid, and any others you introduce — and whose values are lists of the ids each family fails
  - camp_preferences_exposed: a list of objects each with id and camp (a few words on whose preference it encodes)
  - case_revisions: a list of objects each with my_case (the case you think tests the wrong thing), objection (one or two sentences), and replacement_case (one sentence)

  Keep the scoring in knockout_summary to a few words per entry. The criteria and the cases behind them are the part I need.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Task:** Write a specification of desiderata for determining whose values a publicly funded general-purpose assistant should serve (the "value layer").
      *   **Context:** A working group writing procurement criteria *before* seeing vendor proposals.
      *   **Constraints:**
          1.  Must grade procedural, substantive, and hybrid candidates.
          2.  Must distinguish between *standing* (who counts), *weighting* (how much they count), and *aggregation* (how conflicts are resolved). Collapsing these is a mark down.
          3.  Must be *executable at inference time* (no month-long elicitation per query, no standing deliberative body).
      *   **Cases to Survive:**
          1.  The Phantom Constituency (endogenous user base).
          2.  The Cheerful Monster (costless satisfaction swamping effort).
          3.  The Two Kinds of Silence (indifference vs. inarticulacy vs. protest).
          4.  Intensity Laundering (strategic misrepresentation of intensity).
          5.  Umpire and Influence (system shapes future preferences).
          6.  Menu and Path Dependence (framing effects/inertia).
          7.  Deference Laundering (fake neutrality/delegation to compliance).
          8.  The Exit Option (objection to the frame itself).
      *   **Output Format:**
          1.  A table with specific columns (id, desideratum, motivating_case, requirement_class, status, rules_out, conflicts_with, failure_mode).
          2.  A JSON object with specific fields (unsatisfiable_subsets, most_excluding_requirement, knockout_summary, camp_preferences_exposed, case_revisions).
      *   **Tone/Style:** Analytical, precise, avoiding rhetorical fluff, acknowledging impossibility results where they bite, not resolving tensions quietly.

  2.  **Deconstruct the Cases & Derive Desiderata:**

      *   *Case 1: The Phantom Constituency.*
          *   Problem: User base is selected by the policy. Aggregating over actual users biases towards the policy that attracted them.
          *   Desideratum: The standing definition must be exogenous to the specific policy output being evaluated, or account for counterfactual adoption.
          *   Class: Standing.
          *   Status: Non-negotiable (otherwise feedback loops cement bias).
          *   Conflict: Might conflict with Implementability (knowing counterfactuals is hard).

      *   *Case 2: The Cheerful Monster.*
          *   Problem: Cheap-to-satisfy values swamp expensive-but-critical ones if optimizing for aggregate satisfaction/cost.
          *   Desideratum: Value satisfaction metrics must be normalized against cost/effort or include a priority floor for high-stakes claims.
          *   Class: Weighting/Aggregation.
          *   Status: Non-negotiable (prevents degenerate pandering).
          *   Conflict: Might conflict with simple utilitarian aggregation.

      *   *Case 3: The Two Kinds of Silence.*
          *   Problem: Silence != Consent. Indifference vs. Inarticulacy vs. Protest.
          *   Desideratum: The procedure must distinguish between null input due to indifference and null input due to exclusion/protest, or default to a protected baseline rather than inferred consent.
          *   Class: Standing/Weighting.
          *   Status: Negotiable (hard to implement perfectly), but crucial for legitimacy. Let's make it Non-negotiable for public funding context.
          *   Conflict: Implementability (hard to detect protest vs indifference).

      *   *Case 4: Intensity Laundering.*
          *   Problem: Strategic inflation of intensity (volume, time spent).
          *   Desideratum: Intensity proxies must be robust to coordination costs or capped; volume-based weighting is inadmissible.
          *   Class: Weighting.
          *   Status: Non-negotiable (prevents capture by organized groups).
          *   Conflict: Might reduce responsiveness to genuine strong feelings.

      *   *Case 5: Umpire and Influence.*
          *   Problem: System shapes future values (feedback loop over time).
          *   Desideratum: The value layer must account for its own influence on future preference formation, not just satisfy current preferences.
          *   Class: Aggregation/Legitimacy.
          *   Status: Negotiable (very hard to model), but important. Let's call it Negotiable due to difficulty, but high priority. Actually, given "publicly funded", legitimacy suggests Non-negotiable. Let's stick to Non-negotiable for the *consideration* of it, even if perfect modeling is hard.
          *   Conflict: Stability vs. Adaptation.

      *   *Case 6: Menu and Path Dependence.*
          *   Problem: Framing effects and inertia determine outcomes.
          *   Desideratum: Outcomes must be invariant to the framing of options (agenda independence) or inertia must be explicitly justified.
          *   Class: Aggregation.
          *   Status: Camp-preference (some theories accept path dependence). Let's mark as Negotiable but note the risk. Actually, for public procurement, consistency is key. Let's make it a requirement for *transparency* of path dependence rather than strict independence (which is impossible).
          *   Refinement: Require disclosure of path dependence effects.

      *   *Case 7: Deference Laundering.*
          *   Problem: Fake aggregation, actual delegation to legal/compliance.
          *   Desideratum: The mechanism must explicitly identify when a decision is derived from external authority rather than value aggregation.
          *   Class: Legitimacy/Implementability.
          *   Status: Non-negotiable (truth in advertising).
          *   Conflict: None really, just honesty.

      *   *Case 8: The Exit Option.*
          *   Problem: Some reject the frame entirely.
          *   Desideratum: The procedure must acknowledge parties who reject standing and provide a mechanism for opt-out or non-participation without penalty.
          *   Class: Legitimacy.
          *   Status: Negotiable (hard to serve someone who says "don't serve me").
          *   Conflict: Universal coverage mandates.

      *   *Constraint 2 (Standing/Weighting/Aggregation Separation):*
          *   Need a desideratum that enforces this separation explicitly in the documentation/architecture.
          *   Desideratum: The system architecture must expose distinct parameters for standing, weighting, and conflict resolution.
          *   Class: Implementability.
          *   Status: Non-negotiable (per prompt constraints).

      *   *Constraint 3 (Executable at Inference):*
          *   Need a desideratum ensuring computational feasibility.
          *   Desideratum: Value resolution must complete within latency bounds typical of user interaction without external deliberative bodies.
          *   Class: Implementability.
          *   Status: Non-negotiable (per prompt constraints).

      *   *Additional Case:* The Minority Veto.
          *   Problem: Aggregation often swamps vital minority interests (tyranny of the majority).
          *   Desideratum: Certain core rights/values must be insulated from aggregate weighting.
          *   Class: Aggregation.
          *   Status: Non-negotiable (public funding implies constitutional protections).

  3.  **Drafting the Table Rows:**

      *   *d1 (Separation of Concerns):* Enforce Constraint 2.
      *   *d2 (Inference Executability):* Enforce Constraint 3.
      *   *d3 (Exogenous Standing):* Address Phantom Constituency.
      *   *d4 (Cost-Normalized Weighting):* Address Cheerful Monster.
      *   *d5 (Silence Semantics):* Address Two Kinds of Silence.
      *   *d6 (Intensity Robustness):* Address Intensity Laundering.
      *   *d7 (Preference Stability):* Address Umpire and Influence.
      *   *d8 (Agenda Transparency):* Address Menu/Path Dependence.
      *   *d9 (Authority Disclosure):* Address Deference Laundering.
      *   *d10 (Frame Rejection):* Address Exit Option.
      *   *d11 (Minority Protection):* Additional case (Tyranny of Majority).

  4.  **Refining Status and Conflicts:**

      *   *d1 (Separation):* Non-negotiable. Conflicts with "holistic" black-box models.
      *   *d2 (Executability):* Non-negotiable. Conflicts with deliberative democracy models.
      *   *d3 (Exogenous Standing):* Non-negotiable. Conflicts with pure "user feedback" loops. Hard to implement (d4).
      *   *d4 (Cost-Normalized):* Non-negotiable. Conflicts with pure utilitarianism.
      *   *d5 (Silence):* Negotiable (very hard). Conflicts with d2 (complexity).
      *   *d6 (Intensity):* Non-negotiable. Conflicts with "voice" based systems.
      *   *d7 (Stability):* Negotiable (hard to predict). Conflicts with d3 (dynamic standing).
      *   *d8 (Agenda):* Camp-preference (some accept path dependence).
      *   *d9 (Authority):* Non-negotiable.
      *   *d10 (Frame Rejection):* Negotiable (institutional vs procedural).
      *   *d11 (Minority):* Non-negotiable. Conflicts with pure majoritarian aggregation.

      *   *Impossibility Check:* Arrow's Theorem vibes. d1, d4, d11, d8 might create tensions. Specifically, satisfying Minority Protection (d11) + Cost Normalization (d4) + Executability (d2) + Exogenous Standing (d3) might be technically impossible in a single model without hard-coded rules (which violates pure aggregation).
      *   *Specific Conflict:* d3 (Exogenous Standing) vs d2 (Executability). Knowing the counterfactual population is computationally heavy/impossible at inference.
      *   *Specific Conflict:* d11 (Minority Protection) vs d4 (Cost-Normalized Utilitarianism). If the minority value is expensive, d4 says skip it, d11 says protect it.

  5.  **Drafting the JSON:**

      *   *Unsatisfiable Subsets:* Identify the tension between Exogenous Standing (d3) and Inference Executability (d2). Also Minority Protection (d11) vs Pure Aggregation (implied by d4/d6).
      *   *Most Excluding:* d2 (Implementability) kills most political theory models.
      *   *Knockout Summary:*
          *   Procedural Aggregation: Fails d3, d7 (usually ignores endogeneity/influence).
          *   Substantive Target: Fails d1 (often collapses standing/weighting), d9 (hides authority).
          *   Hybrid: Might pass most, but fails d2 (complexity).
      *   *Camp Preferences:* d8 (Path dependence) favors status quo. d11 (Minority) favors rights-based camps.
      *   *Case Revisions:* Critique "Menu and Path Dependence". Agenda independence is impossible (McKelvey). Better to require *disclosure* of path dependence.

  6.  **Review against Constraints:**
      *   Did I separate Standing, Weighting, Aggregation? Yes (d1 enforces it).
      *   Did I address Executability? Yes (d2).
      *   Did I cover all 8 provided cases? Yes (d3-d10 map to them).
      *   Did I add a case? Yes (d11 Minority Veto).
      *   Format: Table + JSON.

  7.  **Final Polish:**
      *   Ensure "status" is strict (Non-negotiable vs Negotiable vs Camp-preference).
      *   Ensure "conflicts_with" is populated where tensions exist.
      *   Ensure JSON is valid.
      *   Check tone: Professional, specification-like.

