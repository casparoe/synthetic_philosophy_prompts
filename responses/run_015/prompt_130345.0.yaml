      *   *Plot:* Elias checks his score. He needs to maintain it. But why? Is it for benefits? Or social standing? Or does he genuinely believe in it?
      *   *The Twist:* The algorithm is opaque. It measures output, but people treat it as moral worth.
      *   *Ambiguity:* Show Elias working harder because of the score, but also show that the town's economy demands hard work regardless. The score just quantifies it.
      *   *Word Count Check:* Aim for 500-600 words.

      *Drafting ideas:*
