prompt: |-
  I'm a journalist covering science and ideas, working on a feature about whether culture actually causes economic behavior or just describes it after the fact. I've been thinking about Weber's protestant ethic thesis—specifically the problem of explaining with values—and I want a short story that gets in the weeds of it, not some generic parable everyone has seen.

  Inject this twist: a small coastal town where "diligence" isn't a private feeling but is calculated by an old civic algorithim that assigns moral scores based on labor patterns, and people organize their lives around those scores. Write the story (around 500-600 words) exploring whether those scores are genuinely causing people to work differently, or whether they're just a fancy description of material pressures that'd exist anyway. Don't give an easy answer.

  After that, include a section called "Notes on the philosophical move" (about 150 words) explaining what you did with the Weberian causal problem and how the algorithim idea changes the claim.

  Keep it casual—no citations or reading lists, I'll fix referances later if needed. Avoid standard sci-fi tropes; keep the setting grounded.
reasoning: |-
