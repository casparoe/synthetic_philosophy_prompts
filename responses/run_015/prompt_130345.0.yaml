answer: |-
  The box on the corner of the post office in Port Vell doesn't look like much. It's a beige metal casing, rusted at the seams, with a small green LED display protected by wire mesh. It's the Civic Diligence Registry, installed in 1974 to modernize the town's credit system. Nobody remembers how it works anymore, only that it tracks labor patterns against community averages.

  Elias stands before it, wiping fish guts on his trousers. The number flickers: 84.2. Yesterday it was 85.0.

  He knows why it dropped. He took Tuesday afternoon off to watch his grandson's school play. The algorithm doesn't care about grandsons. It cares about net-mending hours, boat maintenance, and catch weight relative to tide conditions.

  "Down again?" asks Mara, walking past with a crate of mackerel.

  " Took time off," Elias says.

  "Risky. Loan renewal is next month."

  Elias nods. The bank uses the Registry score to set interest rates. A score below 80 means predatory terms. Above 90, you get the community rate. But it's more than money. In Port Vell, the number is your moral weight. A low score means you're slack. A high score means you're virtuous.

  Elias goes back to the docks. He should be cleaning the catch, but the catch is already clean. He should be resting; his back is killing him. Instead, he starts sanding a patch of rust on the hull that doesn't need sanding yet. He works vigorously, sweating in the cold mist. He wants to feel the work happening so he knows the sensors—which he assumes are in the dock pilings—are picking it up.

  He works for an hour. He checks the box on his way home. 84.3.

  Did the number make him work? If the box didn't exist, would he have sanded the hull? Probably not. The boat is seaworthy. The material necessity wasn't there. So the culture of the score caused the economic behavior. He created value where none was needed because the metric demanded it.

  But then he thinks about the bank. If his score drops, his rates go up. If his rates go up, he needs to work more to pay the interest. So the material pressure of the debt causes the work, and the score is just a thermometer measuring the fever. The algorithm isn't driving the car; it's just the speedometer everyone is obsessed with.

  Elias looks at his hands. They are raw from the sanding. The boat is slightly smoother, but not safer. The number is slightly higher, but not enough to matter. He feels a strange pride anyway, a warm glow in his chest seeing the 3 replace the 2. It feels like virtue. But it also feels like fear.

  He walks home, wondering if he works to live, or if he lives to keep the green light happy. The tide comes in, indifferent to the score, washing over the pilings where the sensors might be hiding.

  ***

  **Notes on the philosophical move**

  Weber's problem is distinguishing between the "spirit" of capitalism (the values) and the "system" (the material conditions). Usually, culture is invisible—it's just "how we do things." By turning culture into a visible algorithm, I forced the value system to become an object in the world. This creates a loop: if the score affects loan rates, it's a material pressure. But if people work when it's inefficient just to boost the score, it's cultural causation. The story refuses to separate them. The algorithm acts as both a mirror (describing labor) and a whip (compelling it). This suggests that in modern systems, the description of value often becomes the source of value itself, making the Weberian debate less about origin and more about feedback loops.
