      *   *Objection 2 (Moral Cost):* Idiosyncratic/Extreme. Most critics don't go this far; they say it *undermines* value, not that *nothing is harmed*. Does it refute? No. Best reply: Morality is about preferences/functions. Weakest point: Hard to convince someone who feels qualia are the *source* of value.

