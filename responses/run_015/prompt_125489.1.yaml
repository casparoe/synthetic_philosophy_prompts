answer: |-
  It is good to hear from you, and I think your friend's question about large language models actually provides the perfect entry point for sorting out your reading priorities, even if the analogy itself is somewhat misleading. To be direct, the idea that an LLM has verisimilitude in its internal representations is largely a category error, at least in the traditional philosophical sense. These models optimize for statistical prediction of token sequences, not for mapping the structural relations of the world. When a model outputs garbage despite having low loss, or vice versa, it is demonstrating that predictive accuracy is not the same as truthlikeness. However, correcting this misunderstanding is actually valuable for your core problem because it sharpens the distinction between empirical adequacy and ontological closeness. If you accept that a system can be statistically proficient without being structurally true, you are forced to ask what structural truth actually consists in, which pushes you away from pure measurement and toward the metaphysics of representation. So while the ML line of inquiry is likely a dead end for defining verisimilitude itself, investigating why it fails is an excellent way to clarify what verisimilitude is not, which saves you from chasing red herrings in the formal literature.

  Given that clarification, I would recommend you prioritize the status of highly idealized models in sciences like climate physics as your primary focus, followed by the dependence on correspondence theories of truth, and leave the formal measures of truthlikeness for last. The reason for putting idealized models at the top is that this is where the concept of verisimilitude earns its keep, and it is the most tractable area for someone with your background. You spent a career dealing with models that you knew were false yet useful, from frictionless planes to ideal gases, and the contemporary literature on model-based science, particularly in climate and complex systems, tackles exactly how these false structures can nonetheless capture real features of the world. This line of work is upstream of the formal logic puzzles in terms of philosophical progress because the logic is supposed to be formalizing the intuition we get from scientific practice, not the other way around. Historically, the formal programs stumbled because they tried to define truthlikeness in a vacuum without enough regard for how scientists actually compare theories. By starting with the practice, you ground the abstract problem in the concrete reality you know best, allowing you to evaluate philosophical claims against your own intuition about how physics works without getting bogged down in symbolic notation.

  I place the question of correspondence theory second because it is metaphysically upstream but pragmatically secondary for your immediate goals. Verisimilitude traditionally assumes there is a mind-independent truth to be approximated, and if you drop correspondence for a pragmatic or coherence theory of truth, the whole idea of getting closer to the truth changes meaning or dissolves entirely. You need to understand this foundation to know what the idealized models are supposedly approximating, but you do not need to master the debates to see the problem in action. You can observe the tension between realism and instrumentalism in climate modeling without first solving the nature of truth, whereas you cannot make sense of the formal measures without committing to a truth theory. This makes it a necessary second step: once you see how models claim to represent the world, you then ask what kind of representation relation is being invoked. If you find that scientists are actually committed to a correspondence view, then verisimilitude is live; if you find they are merely instrumentalists, then verisimilitude might be the wrong tool for the job. This inquiry is conceptual rather than technical, so it fits your constraint of avoiding heavy logic while still addressing the root of the problem.

  I recommend leaving the formal measures of truthlikeness for last, or perhaps treating them as a historical footnote, primarily because of the technical barrier and the diminishing returns for a non-logician. This field, stemming from Popper's failed attempt and moving through the work of Tichý, Niiniluoto, and others, became heavily entangled in symbolic logic and possible world semantics. While mathematically sophisticated, much of this work stalled on technical puzzles regarding language dependence and logical content that often feel disconnected from actual scientific theory change. For someone with a year of reading time and no formal logic training, this is where you are most likely to get lost in the weeds without gaining insight into the scientific practice you care about. It is downstream of the other two because the formalisms are attempts to codify the intuitions you will gather from studying models and truth theories. Unless there is a breakthrough that connects these logical measures to empirical model comparison, reading this literature risks showing you how to count truthlikeness without telling you why it matters to a physicist.

  The ranking I have suggested would only flip if there were a significant breakthrough in one of the deprioritized areas that suddenly made it indispensable. For instance, if the formal measures crowd solved the language dependence problem in a way that allowed for a quantitative measure of truthlikeness applicable to physical equations, that would move formal measures to the top priority because it would offer a tool you could actually use to compare theories. Similarly, if interpretability research in machine learning demonstrated that vector spaces in neural networks do reliably encode semantic structures that map to truth conditions rather than just statistical correlations, that would revive the ML analogy and make it a core philosophical issue rather than a distraction. Until either of those happens, however, the path through scientific practice and metaphysical commitment offers the most robust understanding of whether verisimilitude is a viable concept or just a philosophical placeholder. I hope this helps you navigate the used book shops, and I would be keen to hear what you find once you start digging into the modeling literature.
