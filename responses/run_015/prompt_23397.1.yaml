  6.  **Refining the Explanation (Self-Correction during drafting):**
      *   *Caution:* Don't get too bogged down in meta-ethics. Keep it accessible for a novelist.
      *   *Clarification:* Make sure to distinguish "Wrong Kind of Reasons" from "Pragmatic Encroachment." (Maybe too technical? Keep it simple: Pragmatists say practical reasons count; Evidentialists say they don't).
