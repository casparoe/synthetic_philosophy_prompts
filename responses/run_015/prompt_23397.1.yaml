      *   **Specific Problem:** The character is worried about circularity in pragmatism (belief justified by consequences, but consequences depend on holding the belief).
      *   **Core Question:** The user is confused about the "Wrong Kind of Reasons" (WKR) problem. They think it just means "good reasons vs. bad reasons" (trivial), whereas the literature treats it as a significant philosophical puzzle. They want to understand the *non-trivial* content of the distinction and how it applies to their character.
      *   **Goal:** Explain the WKR problem clearly, distinguish it from simple "bad reasons," and show its relevance to the character's internal conflict (pragmatism, free will, circularity).

  2.  **Deconstruct the "Wrong Kind of Reasons" (WKR) Problem:**
      *   *Initial thought:* Is the user right? Is it just "good vs. bad"?
      *   *Correction:* No. The WKR problem is specifically about *normative domains* (belief, action, admiration, etc.). It's about reasons that count in favor of an *attitude* vs. reasons that count in favor of *having* the attitude.
      *   *Classic Example:* The Demon Case. A demon threatens to kill you unless you admire him. You have a reason to *want* to admire him (to survive), but does that make him *admirable*? No.
      *   *Application to Belief (Doxastic Norms):* Pascal's Wager. You have a reason to *want* to believe in God (eternal reward), but does that make God *exist* or the belief *true*?
      *   *The Crux:* It's not about the *strength* of the reason (the threat is very strong), but about the *kind* of normative relation. It's about "object-given" vs. "state-given" reasons.
      *   *Why it's non-trivial:* Because sometimes these reasons look structurally identical. If rationality is about responding to reasons, and I have a reason to believe (pragmatic benefit), why isn't it rational? Distinguishing them requires deep meta-normative work.

  3.  **Address the User's Confusion:**
      *   Acknowledge their intuition (it *does* sound like good vs. bad).
      *   Clarify that "bad reason" usually means *evidence against* the truth. A WKR is often a *very good reason* to want the state, but the *wrong kind* to constitute the state itself.
      *   Use the Belief vs. Action distinction. Action is guided by practical reasons. Belief is (traditionally) guided by evidence/truth. WKR arises when practical reasons try to govern belief.

  4.  **Connect to the Character's Conflict (Pragmatism & Free Will):**
      *   *Pragmatism:* William James/Peirce/Dewey. Truth is what works. Belief is a tool.
      *   *The Character's Worry:* Circularity. "I believe because it helps, but it helps because I believe."
      *   *WKR Relevance:* The pragmatist argues pragmatic benefits *are* the right kind of reason for belief (challenging the evidentialist view). The critic says those are WKRs.
      *   *Free Will:* Believing in free will might be necessary for moral responsibility (Strawson). Is that a reason to believe it's *true*, or just a reason to *pretend*?
      *   *The Tension:* If the character is a pragmatist, she wants to say pragmatic reasons *are* the right kind. But she fears she's conflating "useful to believe" with "true."

  5.  **Drafting the Response (Iterative Process):**

      *   *Introduction:* Validate the user's confusion. It's a common starting point. State clearly that WKR is *not* just "bad reasons."
      *   *Section 1: The Core Distinction (Object-Given vs. State-Given).*
          *   Use the Demon/Admiration example. It's the standard illustration.
          *   Explain: Reason for the *object* (he is kind) vs. Reason for the *state* (I need to survive).
          *   Apply to Belief: Evidence (Truth) vs. Pragmatic Benefit (Happiness/Survival).
      *   *Section 2: Why it's Non-Trivial.*
          *   It's not about weight. A gun to your head is a heavy reason.
          *   It's about the *nature of the attitude*. Belief "aims at truth." If you believe for money, are you really believing?
          *   Mention the "Guise of the Good" or normative architecture.
      *   *Section 3: Relevance to the Character (Pragmatism).*
          *   Pragmatists *challenge* the WKR distinction. They say practical consequences *are* relevant to truth/justification.
          *   The character's circularity worry is actually a version of the WKR problem. She fears her pragmatic reasons are WKRs masquerading as RKRs.
          *   Free Will context: Believing in free will makes society function (Strawson). Is that evidence free will exists? Or just a reason to act as if it does?
      *   *Section 4: Writing Advice/Character Nuance.*
          *   Show her wrestling with *definitions*.
          *   Show the emotional weight. If she admits they are WKRs, does her belief collapse?
