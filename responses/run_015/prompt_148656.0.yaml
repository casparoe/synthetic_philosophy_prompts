      *   *Sicily (Overcommitment/Risk):* Theoretical root: Hubris, optimism bias, lack of contingency planning, concentration of risk. *Fix:* Resource cap, "pre-mortem" (what if it fails?), phased commitment.
      *   *Socrates (Exclusion/Dissent):* Theoretical root: Tyranny of the majority, intolerance of friction, confusion of discomfort with danger. *Fix:* Distinguish disruption from dissent, protect minority voice, focus on behavior not content.

  3.  **Drafting the Procedure (The "10-Minute Safety Check"):**
      *   Needs to be a "Gate" system.
      *   Needs clear "Stop/Go" criteria.
      *   Needs to highlight "Human Judgment Zones."

      *   *Gate 1 (The Anger Gate - Mytilene):* Focus on punishment.
