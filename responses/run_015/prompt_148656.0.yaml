prompt: |-
  I've been running these neighborhood deliberative councils with a friend — we're both co-facilitors — and after taking a course on ancient political failures I'm convinced our 15-person groups replay the same three Athens screwups constantly. There's the Mytilene pattern where anger drives a vote for brutal collective punishment then everyone flips the next session; the Sicily expedition vibe where we overcommit pooled resources on some ambitious joint project; and the Socrates trial dynamic where one persistent dissenter gets targeted and the group decides exclusion is easier than engagement. I want a reusable, practical procedure — a flowchart in words with specific check conditions — that my co-facilitor and I can run in about ten minuts before any decision that touches punishment, big shared risk, or complaints about a disruptive voice. It should be grounded in whatever democratic theory or philosophy of collective decision-making actually explains these pathologies, but translated for volunteers who haven't read Thucydides and shouldn't need to.

  Please build three gates matching those failure modes, with concrete test sentences or conditions we can apply, and mark the spots where judgment can't be eliminated — like when emotional temperature is too high and we just have to call a recess. Apply it to three hypothetical cases: (1) a proposal for a heavy shared fine on one household for noise violations (Mytilene-type), (2) a plan to pool our entire annual budget into one inspiring but overstretched infrastructure project (Sicily-type), where I want the procedure to recommend scaling back or pausing even though I personally think it's worth the risk, and (3) a situation where one member keeps dissenting and others want to bar them from speaking for the rest of the session (Socrates-type), with the procedure honestly stating that it can protect the dissenter's right to speak but can't make the group actually listen. Don't give me citations or a reading list — I need this laminated for the wall — and don't quote ancient sources verbatim, just paraphrase their logic if it helps. Also flag exactly where the procedure fails and we have to make the call ourselves.
