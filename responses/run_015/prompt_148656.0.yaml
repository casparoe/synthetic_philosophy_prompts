answer: |-
  # THE 10-MINUTE SAFETY CHECK
  **For Co-Facilitators Only — Run Before Voting on High-Stakes Items**

  **INSTRUCTION:** When a proposal touches **Punishment**, **Major Resources**, or **Member Conduct**, stop the main group. Facilitators step aside for 10 minutes. Run the three gates below. If any gate triggers a **STOP**, you must return to the group with a modification or a delay.

  ---

  ## GATE 1: THE PUNISHMENT CHECK (The "Mytilene" Gate)
  *Use when: Proposing fines, bans, public shaming, or penalties.*

  **1. The Heat Test**
  *   **Condition:** Was this proposal made within 24 hours of the incident causing anger?
  *   **Check:** If **YES**, vote is automatically delayed 48 hours.
  *   **[HUMAN CALL REQUIRED]:** If tension in the room is palpable (shouting, visible shaking, interrupting), you must call a recess. The checklist cannot measure emotional temperature; only you can.

  **2. The Proportionality Test**
  *   **Condition:** Does the penalty exceed the cost of the harm caused?
  *   **Test Sentence:** *"Are we punishing the act, or are we punishing the person?"*
  *   **Rule:** If the penalty includes social exclusion or financial hardship beyond repairing the damage, **STOP**.

  **3. The Reversibility Test**
  *   **Condition:** Can this decision be undone if new information arrives?
  *   **Rule:** If **NO** (e.g., permanent ban), require a 2/3 majority instead of simple majority.

  ---

  ## GATE 2: THE RESOURCE CHECK (The "Sicily" Gate)
  *Use when: Committing >50% of budget, labor, or political capital to a single project.*

  **1. The Concentration Test**
  *   **Condition:** Does this project consume more than half of available resources (money, time, or volunteers)?
  *   **Rule:** If **YES**, the proposal must be split into phases. Phase 1 cannot exceed 20% of total resources.
  *   **Outcome:** Even if the project is inspiring, the procedure mandates **SCALE BACK**. Do not go "all-in."

  **2. The Failure Test**
  *   **Condition:** If this project fails completely, can the group still function next year?
  *   **Test Sentence:** *"If this fails, do we still function?"*
  *   **Rule:** If the answer is **NO**, the proposal is rejected.

  **3. The Exit Test**
  *   **Condition:** Is there a specific date to stop if milestones aren't met?
  *   **Rule:** If **NO**, add a "Kill Switch" date before voting.
  *   **[HUMAN CALL REQUIRED]:** Defining "function" is subjective. Facilitators must agree on what "group death" looks like. The checklist cannot define survival for you.

  ---

  ## GATE 3: THE VOICE CHECK (The "Socrates" Gate)
  *Use when: A member is complained about as "disruptive," "negative," or "obstructionist."*

  **1. The Safety Test**
  *   **Condition:** Is the member threatening physical safety or revealing private data?
  *   **Rule:** If **YES**, immediate removal is permitted.
  *   **Rule:** If **NO**, removal is **NOT** permitted based on content alone.

  **2. The Behavior Test**
  *   **Condition:** Are we objecting to *what* they say or *how* they say it?
  *   **Test Sentence:** *"Are we silencing the message or managing the behavior?"*
  *   **Rule:** You may limit time or enforce turn-taking (behavior). You may not ban specific viewpoints (message).

  **3. The Limitation Notice**
  *   **Warning:** This procedure protects the right to speak. **It cannot force the group to listen.**
  *   **[HUMAN CALL REQUIRED]:** If the group ignores the dissenter after they speak, the procedure has failed. Facilitators must decide whether to pause the meeting to address the group's culture or let the vote proceed knowing it may be flawed.

  ---

  ## APPLICATION SCENARIOS

  ### CASE 1: The Noise Violation Fine (Mytilene-Type)
  *Scenario: A household played loud music until 2 AM. The group wants to fine them $500 immediately.*
  *   **Gate 1 Result:** **STOP.**
  *   **Application:**
      *   **Heat Test:** Incident happened last night. **Delay vote 48 hours.**
      *   **Proportionality:** Is $500 proportional to noise? If average fine is $50, this is punitive. **Reduce to repair cost + standard fee.**
      *   **Facilitator Action:** Return to group: "We are cooling off this vote until Thursday. We are adjusting the fine to match our standard scale."

  ### CASE 2: The "All-In" Infrastructure Project (Sicily-Type)
  *Scenario: A proposal to use 90% of the annual budget to build a community garden pavilion. You think it's worth the risk.*
  *   **Gate 2 Result:** **STOP / SCALE BACK.**
  *   **Application:**
      *   **Concentration:** 90% > 50% threshold. **Procedure forces a split.**
      *   **Failure Test:** If the pavilion collapses or gets banned, can the group pay for insurance next year? If **NO**, **REJECT.**
      *   **Facilitator Action:** You must return to the group and say: "Our safety check requires we cap this at 20% of the budget for Phase 1. We cannot vote on the full amount today." *Your personal support for the risk is overruled by the protocol.*

  ### CASE 3: The Persistent Dissenter (Socrates-Type)
  *Scenario: One member opposes every spending plan. The group wants to mute them for the session.*
  *   **Gate 3 Result:** **PROTECT SPEECH / ADMIT LIMIT.**
  *   **Application:**
      *   **Safety:** No threats made. **Removal banned.**
      *   **Behavior:** Member is repetitive but polite. **Manage via time limits, not silence.**
      *   **Limitation Notice:** Facilitators allow the member to speak. However, facilitators note: "We cannot force the group to weigh this dissent fairly. If you vote to ignore them, that is on the group, but we will record that dissent was heard."
      *   **Facilitator Action:** Enforce a 2-minute limit per speaker. Allow the dissenter their 2 minutes. Do not bar them. Acknowledge internally that the group may still make a bad decision by ignoring the warning.

  ---

  ## WHERE THIS TOOL FAILS (FACILITATOR WARNING)

  1.  **Emotional Temperature:** The checklist cannot feel the room. If voices are raised, **ignore the checklist and call a break.**
  2.  **Defining Survival:** The checklist asks if the group will "function" after a risk. You must define what "function" means.
  3.  **Culture vs. Rules:** The checklist protects the dissenter's voice, but it cannot fix a group that refuses to listen. If the culture is toxic, a procedure will not save you. You may need to disband the council.
