      *   **B (Bayesian Reductionist):** Believes all rational inference is Bayesian. "Explanatory virtue" is just a nickname for high prior probability assigned to simple/unified theories. If X looks better, it's because we implicitly penalize Y's complexity.

  3.  **Drafting - Section by Section:**

