answer: |-
  **1. (i)** If any auxiliary assumption can be re-described as a condition, doesn't labelling failed forecasts 'projections' simply immunise the theory from falsification by definition?
  **Follow-up:** But if the mechanism remains unverifiable until the prediction finally hits, isn't that just faith masquerading as methodology?

  **2. (ii)** Since we identify a programme as degenerating or 'early' only with hindsight, what objective marker distinguishes Malthus from an astrologer who keeps moving the date?
  **Follow-up:** If that marker relies on independent support, aren't you just deferring the problem to another long-run theory?

  **3. (iii)** Had Malthus pre-registered a 1900 deadline for geometric growth and missed it, would you concede he surrendered empirical content, or would you still call it a projection?
  **Follow-up:** Then does any theory with enough auxiliary conditions retain empirical content regardless of outcomes?

  **4. (iv)** Given the evidence available today is identical whether the theory is 'early' or 'wrong', what epistemic work is the 'early' label doing besides protecting the theorist's reputation?
  **Follow-up:** But if that potential never actualises, isn't the distinction practically meaningless for current policy?

  **5. (v)** When a rescue involves delaying the prediction by two centuries rather than restricting the domain, isn't that monster-barring by another name?
  **Follow-up:** If every counter-example is labelled a specific interferent, doesn't the theory become unfalsifiable in principle?

  **6. (vi)** Can you name a theory you dislike where you would reject the 'right but early' defence, and what specific feature separates it from Malthus?
  **Follow-up:** If the mechanism is disputed in both cases, isn't your verdict driven by sympathy rather than structure?
