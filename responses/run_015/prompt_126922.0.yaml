  (2) The camps diverge sharply on mechanism and phenomenology, captured in their conflicting descriptions: Camp A claims Correct classification requires conscious rule formulation and Statistical clustering cannot explain one-shot success; Camp B claims Correct classification emerges from subconscious similarity mapping and Statistical clustering explains one-shot success via high-dimensional proximity. Camp A argues that without a verbalizable predicate the solver lacks understanding, whereas Camp B contends that explicit articulation is a post-hoc rationalization of a perceptual gestalt. Camp A asserts that one-shot learning rules out statistical methods requiring large datasets, while Camp B counters that human priors act as compressed statistics allowing immediate clustering. This divide centers on whether the cognitive engine is logical deduction or perceptual analogy, with each side rejecting the other's definition of what constitutes a solution.

  (3) The central cruxes revolve around the definition of understanding and the limits of perceptual processing under complexity. The first crux questions whether understanding can be separated from correct performance, asking if a solver who classifies accurately but cannot articulate the rule truly solves the problem or merely mimics success. The second crux examines whether a second-order Bongard task favors one mechanism, specifically testing if relations-between-relations exceed the bandwidth of holistic clustering and necessitate symbolic manipulation. Both sides agree these points determine whether the mind acts as a logic engine or a pattern matcher, yet they disagree on whether failure to verbalize indicates a lack of rule extraction or merely a lack of linguistic access to a non-symbolic representation.

  (4) For the understanding crux, both sides accept a dual-task experiment where solvers classify boxes while performing a verbal shadowing task to block explicit formulation. Camp A predicts performance will collapse without verbal resources to hold the rule, while Camp B predicts performance will remain stable as clustering is non-verbal. For the second-order crux, both accept a test case where the rule is that the left side shows containment relations that are transitive while the right shows non-transitive relations. Camp A predicts this forces symbolic encoding and will be solvable only by those who can articulate the logic, whereas Camp B predicts solvers will succeed via perceptual intuition of structural flow without ever encoding transitivity explicitly.

  (5) The assessment concludes that disagreements over the definition of understanding and what constitutes a rule are merely verbal, stemming from differing thresholds for explicit awareness. However, the disagreements regarding performance under verbal load and the solvability of high-order relational tasks are substantive, as they yield empirically falsifiable predictions about cognitive architecture. If solvers fail under verbal shadowing, the symbolic camp gains ground; if they succeed on complex relational tasks without articulation, the holistic camp prevails. Ultimately, the distinction lies not in the output but in the internal processing constraints, making the experimental outcomes the only arbiter between a logic-based mind and a perception-based mind.
