prompt: |-
  I have been trying to apply Lakatos's distinction between progressive and degenerating problem shifts to episodes in my own field, and I find that I have confident verdicts on individual cases but no principle that yields them. I would like the principle, or an argument that there isn't one.

  My verdicts, in no particular order. (i) A programme answers an anomaly by modifying its protective belt, the modification is shaped entirely around that anomaly, and thirty years pass without its predicting anything new: degenerating. (ii) The same kind of modification, but a decade later it throws up a fact nobody had gone looking for, and the fact is then found: progressive — and I want to say progressive from the moment of the modification, though at the time it was indistinguishable from the one in (i), and I cannot say why the difference in outcome should reach backwards. (iii) A modification made and published before anyone had the relevant data, and then confirmed: progressive, and I feel it is more progressive than (ii), but I cannot say what the extra credit is for. (iv) A programme explains a fact that had been on the books for years and had played no part in building the theory: this counts in its favour. (v) A programme explains, very exactly, a fact it was constructed to fit: this counts for nothing at all — and here I am in trouble, because in both cases the fact was known first. (vi) A programme's central posit is eventually shown not to exist, while predictions derived from it keep succeeding: I still score it as progressive, uneasily. (vii) A programme keeps its name, its equations and its notation across a generation while quietly abandoning the commitment that made it distinctive — say, no longer claiming that the entities it is named after are real: I stop counting it as the same programme and I do not credit its later successes to the earlier one. (viii) Two groups work from the same hard core with different protective belts and publish against each other: that is one programme for purposes of appraisal, not two — which sits badly with (vii). (ix) A programme has stopped producing novel predictions and only absorbs anomalies, but there is no rival programme addressing the same phenomena: I will not say abandon it and I will not say it is healthy either; I want a verdict of not yet appraisable, even though degenerating looks like it should be a property of the programme alone. (x) Inside one nominally single programme, one small branch keeps turning up novel facts while everything around it only absorbs anomalies: I score the programme as degenerating, and I would still move a PhD student into that branch tomorrow — which makes me unsure what the unit of appraisal is supposed to be.

  The best I can do by way of a principle: a programme is progressive over a period just in case, over that period, its belt modifications yield more corroborated facts they were not introduced to explain than facts they were, and degenerating in the opposite case; and every such verdict is provisional, since a degenerating stretch can be redeemed later.

  Please test that against the ten cases and repair it. I want: the principle stated precisely, clause by clause, with the case that motivates each clause; its verdicts on cases I have not listed — a programme whose novel predictions are picked, after the fact, out of a large computer-generated space of its own variant models, each prediction being announced before the test; a programme sustained mainly by one well-funded group; two programmes that have merged their belts; and an honest statement of which of my verdicts the principle cannot keep, and at what cost in complexity it could keep them. One last thing matters to me practically: every formulation I have tried seems to need to know what happens over the next decade, and I have to decide this term whether to take a student off a line of work. If the appraisal can only be made in hindsight, tell me what the honest real-time surrogate is.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Goal:** The user wants a precise principle (or an argument that none exists) for applying Lakatos's distinction between *progressive* and *degenerating* problem shifts to research programmes in their own field.
      *   **Input:** Ten specific cases (i-x) where the user has intuitive verdicts but lacks a unifying principle.
      *   **User's Draft Principle:** "A programme is progressive over a period just in case, over that period, its belt modifications yield more corroborated facts they were not introduced to explain than facts they were, and degenerating in the opposite case; and every such verdict is provisional, since a degenerating stretch can be redeemed later."
      *   **Tasks:**
          1.  Test the draft principle against the ten cases.
          2.  Repair/refine the principle (stated precisely, clause by clause, with motivating cases).
          3.  Apply the refined principle to four new hypothetical cases (computer-generated models, well-funded group, merged belts, etc.).
          4.  Honestly state which of the user's verdicts the principle cannot keep and the cost of keeping them.
          5.  Address the practical constraint: The user needs a *real-time surrogate* for decision-making (taking on a PhD student) because Lakatosian appraisal often seems to require hindsight.

  2.  **Deconstruct the Ten Cases & User's Intuitions:**
      *   (i) Ad hoc fix, no new predictions for 30 years $\rightarrow$ Degenerating.
      *   (ii) Ad hoc fix, new prediction found 10 years later $\rightarrow$ Progressive (retroactively). *Problem: Hindsight dependence.*
      *   (iii) Prediction made *before* data $\rightarrow$ More progressive than (ii). *Problem: Novelty timing.*
      *   (iv) Explains old fact not used in construction $\rightarrow$ Counts in favor.
      *   (v) Explains old fact it was constructed to fit $\rightarrow$ Counts for nothing. *Problem: Heuristic power vs. accommodation.*
      *   (vi) Central posit doesn't exist, but predictions succeed $\rightarrow$ Progressive (uneasily). *Problem: Ontological commitment vs. empirical success.*
      *   (vii) Name/equations stay, core commitment dropped $\rightarrow$ Not the same programme. *Problem: Individuation of programmes.*
      *   (viii) Same core, different belts, competing $\rightarrow$ One programme. *Problem: Conflict with (vii).*
      *   (ix) Degenerating but no rival $\rightarrow$ "Not yet appraisable." *Problem: Relational vs. Intrinsic property.*
      *   (x) One branch progressive, rest degenerating $\rightarrow$ Programme degenerating, but advise student to join branch. *Problem: Unit of appraisal.*

  3.  **Evaluate the User's Draft Principle:**
      *   *Draft:* "yield more corroborated facts they were not introduced to explain than facts they were."
      *   *Critique:* It captures the core Lakatosian idea (novel facts vs. accommodation). However, it struggles with:
          *   Timing (ii vs iii).
          *   Individuation (vii vs viii).
          *   The "no rival" scenario (ix).
          *   The sub-branch issue (x).
          *   The "real-time" problem (need to know the future).

  4.  **Develop the Refined Principle (The "Repair"):**
      *   Lakatos is notoriously slippery on precise definitions, often relying on historical reconstruction. To make it precise, we need to formalize the *heuristics* and the *temporal aspect*.
      *   *Key Concept:* **Novelty.** Lakatos distinguishes between *heuristic novelty* (not used in construction) and *temporal novelty* (predicted before observation). Case (iii) suggests temporal novelty carries more weight.
      *   *Key Concept:* **Continuity of the Hard Core.** Case (vii) and (viii) highlight the tension. We need a clause on *theoretical continuity*.
      *   *Key Concept:* **The Unit of Appraisal.** Case (x) suggests the "programme" might be too coarse. We need to allow appraisal of *research lines* within a programme.
      *   *Key Concept:* **Rivalry.** Case (ix) suggests degeneration is partly comparative.

  5.  **Drafting the Clauses (Iterative Process):**
      *   *Clause 1 (Empirical Progress):* Needs to handle (i), (ii), (iii), (iv), (v). Distinguish between accommodation and prediction. Give extra weight to temporal novelty.
      *   *Clause 2 (Theoretical Progress):* Needs to handle (vi). Even if ontology shifts, if the math works, it's empirically progressive, but theoretically degenerating? Let's stick to Lakatos's empirical focus but acknowledge the unease.
      *   *Clause 3 (Individuation):* Needs to resolve (vii) vs (viii). If the hard core changes, it's a new programme. If only the protective belt varies, it's the same programme (rival versions).
      *   *Clause 4 (Context):* Needs to handle (ix). Degeneration is relative to rivals. If no rival, it's "stagnant" rather than "degenerating."
      *   *Clause 5 (Granularity):* Needs to handle (x). Appraise the specific research line, not just the macro-programme.

  6.  **Addressing the New Hypothetical Cases:**
      *   *Computer-generated space:* If predictions are announced before testing, it counts as temporal novelty, even if the model space is large. (Risk of overfitting).
      *   *Well-funded group:* Sociological factors shouldn't count, but resource concentration might mask degeneration (buying anomalies).
      *   *Merged belts:* Synthesis can be progressive if it yields new facts, or degenerating if it's just a patchwork.

  7.  **Addressing the "Honest Statement" (What must be sacrificed):**
      *   The user wants retroactive progressiveness (ii) to be detectable *now*. This is impossible in strict Lakatosian terms.
      *   The user wants to distinguish (ii) and (iii) in real-time. Hard to do without knowing the future.
      *   The tension between (vii) and (viii) requires a judgment call on what constitutes the "Hard Core."

  8.  **Addressing the Practical Constraint (Real-time Surrogate):**
      *   Lakatos admits appraisal is historical.
      *   *Surrogate:* Look for *heuristic power* rather than just empirical success. Is the modification generating *new questions* or just *answering old ones*? Is the group actively seeking falsification or just patching?
      *   *Advice for the PhD Student:* Join the progressive *branch* (Case x), not the degenerating *programme* label. Look for "risky" predictions, not safe accommodations.

  9.  **Refining the Output Structure:**
      *   **Introduction:** Acknowledge the difficulty (Lakatos was often vague).
      *   **The Refined Principle:** Clause-by-clause formulation.
      *   **Mapping Cases:** Show how each clause handles the user's (i-x).
      *   **New Cases:** Apply principle to the four new scenarios.
      *   **The Sacrifice:** What intuitions must be let go?
      *   **The Real-Time Surrogate:** Practical advice for the PhD decision.

  10. **Self-Correction/Nuance Check:**
      *   *Case (vi):* If the posit doesn't exist, Lakatos might say the hard core was wrong, implying a shift. But if predictions succeed, it's empirically progressive. I need to separate *empirical* from *theoretical* progress.
      *   *Case (ix):* Lakatos says degeneration is intrinsic, but rationality of abandonment is comparative. I need to clarify this distinction.
      *   *Case (ii) vs (iii):* The user feels (iii) is *more* progressive. This aligns with Popper's "boldness." I should incorporate "riskiness" of prediction.
      *   *Real-time:* Be honest. There is no algorithm. It's a heuristic judgment.

  11. **Final Polish:** Ensure tone is respectful, philosophical, yet practical. (The user is clearly sophisticated in philosophy of science). Use Lakatosian terminology correctly (Hard Core, Protective Belt, Positive/Negative Heuristic).

  *(Self-Correction during drafting)*: Wait, Case (viii) says two groups with same core but different belts are *one* programme. Case (vii) says changing the core makes it a *different* programme. This is consistent Lakatosian doctrine. The user says it "sits badly." Why? Because in (viii) they compete fiercely, like different programmes. In (vii) it looks continuous but is declared different. I need to explain that *competition* happens within a programme (rival versions), but *identity* is tied to the Core.

  *(Refining the Real-Time Surrogate)*: The user needs to decide *this term*. They can't wait 10 years. The surrogate must be based on the *character* of the modifications being proposed *now*. Are they ad hoc (case i) or heuristic (case iii)?

