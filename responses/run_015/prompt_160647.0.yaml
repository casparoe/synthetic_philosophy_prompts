answer: |-
  You have identified the central tension in Lakatos's methodology: it is designed as a tool for the *history* of science (reconstruction), but you are trying to use it as a tool for the *policy* of science (decision-making). Lakatos himself admitted that "rationality is always retrospective." However, we can sharpen the principle to make it as actionable as possible without lying about its epistemic limits.

  Below is the tested and repaired principle, followed by the analysis of your cases, the new hypotheticals, and the practical surrogate you need for your PhD student.

  ### I. The Refined Principle of Appraisal

  A Research Programme (RP) is **progressive** over a period $T$ if and only if conditions (1) through (4) are met. It is **degenerating** if (1) is failed. It is **indeterminate** if (1) is met but (2)–(4) cannot be assessed due to lack of rivalry or data.

  **Clause 1: Empirical Growth (The Core Metric)**
  *   **Statement:** The sequence of theory modifications $M_1, M_2... M_n$ within $T$ must yield a net surplus of corroborated *novel* facts over accommodated facts.
  *   **Definition of Novelty:** A fact is novel if it was not used in the construction of the modification that predicted it.
  *   **Motivating Cases:** This handles **(i)** (no novel facts = degenerating), **(ii)** and **(iii)** (novel facts = progressive), and **(v)** (accommodation = zero weight). It establishes the baseline ratio.

  **Clause 2: Temporal Weighting (The Boldness Bonus)**
  *   **Statement:** Corroborated facts predicted *temporally* (before observation) receive greater weight in the surplus calculation than facts that were *heuristically* novel (known but not used in construction).
  *   **Motivating Cases:** This distinguishes **(ii)** from **(iii)**. Both are progressive, but (iii) carries more weight because the risk of falsification was higher at the moment of modification. It explains your intuition that (iii) is "more progressive."

  **Clause 3: Theoretical Continuity (Individuation)**
  *   **Statement:** An RP retains its identity only so long as its *Hard Core* (ontological and methodological commitments) remains unfalsified and unrevised by its proponents. Variations in the *Protective Belt* (auxiliary hypotheses) constitute rival versions of the *same* programme.
  *   **Motivating Cases:** This resolves the tension between **(vii)** and **(viii)**. In (vii), the core commitment is abandoned; therefore, it is a *new* programme (successes do not transfer). In (viii), only the belt varies; therefore, it is *one* programme with internal competition (successes aggregate).

  **Clause 4: Comparative Context (The Rationality Condition)**
  *   **Statement:** A verdict of "degenerating" justifies abandonment only if a rival programme exists that is empirically progressive and explains the previous success of the degenerating programme. In the absence of a rival, a programme failing Clause 1 is classified as **stagnant**, not degenerating.
  *   **Motivating Cases:** This handles **(ix)**. Without a rival, you cannot rationally abandon it, even if it is empirically stagnant. It preserves the "not yet appraisable" intuition while maintaining that the *property* of degeneration (Clause 1 failure) is intrinsic.

  **Clause 5: Granularity of Appraisal (The Unit Problem)**
  *   **Statement:** Appraisal applies to the specific *research line* (a specific sequence of belt modifications) rather than the macro-label of the programme, provided the line maintains continuity with the Hard Core.
  *   **Motivating Cases:** This handles **(x)**. The macro-programme may be degenerating (overall ratio is negative), but the specific branch is progressive. Rational action follows the branch, not the label.

  ---

  ### II. Testing the Principle Against Your Cases

  | Case | Verdict | Principle Clause | Notes |
  | :--- | :--- | :--- | :--- |
  | **(i)** Ad hoc, no new facts | Degenerating | Clause 1 | Fails the surplus test. |
  | **(ii)** Ad hoc, later new fact | Progressive | Clause 1 & 2 | Retroactively progressive. Low weight due to lack of temporal novelty. |
  | **(iii)** Prediction before data | Progressive (High) | Clause 2 | High weight due to temporal novelty (boldness). |
  | **(iv)** Explains unused old fact | Progressive (Low) | Clause 1 | Counts as heuristically novel, but less than temporal novelty. |
  | **(v)** Explains fitted old fact | Neutral | Clause 1 | Accommodation yields zero weight in the surplus. |
  | **(vi)** Core posit false, predictions work | Progressive (Uneasy) | Clause 3 | Empirically progressive (Clause 1), but theoretically unstable. The "unease" is the warning that Clause 3 may soon trigger a programme shift. |
  | **(vii)** Core abandoned, name kept | New Programme | Clause 3 | Successes do not transfer. The "name" is irrelevant; the Core defines identity. |
  | **(viii)** Same core, rival belts | One Programme | Clause 3 | Internal competition is healthy; successes aggregate to the programme total. |
  | **(ix)** Degenerating, no rival | Stagnant | Clause 4 | Intrinsic property is degeneration (Clause 1), but rational verdict is "stay" (Clause 4). |
  | **(x)** One branch progressive | Mixed | Clause 5 | Appraise the branch. Advise student to join the branch, ignore the macro-label. |

  ---

  ### III. Application to New Hypothetical Cases

  **1. The Computer-Generated Space**
  *   *Scenario:* A programme generates a large space of variant models, picks predictions from them, announces them, and tests them.
  *   *Verdict:* **Progressive (with caveat).**
  *   *Reasoning:* Under Clause 2, these count as temporally novel predictions. However, if the "space" is large enough to fit any outcome (overfitting), the *risk* of falsification is low. The principle requires assessing the *riskiness* of the prediction. If the model space was constrained *before* the data selection, it counts. If the selection of the specific model was tuned to the data, it collapses into Case (v) (accommodation).
  *   *Risk:* This invites "p-hacking" disguised as prediction.

  **2. The Well-Funded Group**
  *   *Scenario:* A programme is sustained mainly by one well-funded group.
  *   *Verdict:* **Irrelevant to Appraisal.**
  *   *Reasoning:* Sociological factors (funding, group size) do not enter Clauses 1–5. However, practically, high funding can artificially sustain a degenerating programme by allowing endless belt modifications (buying anomalies). A historian applying this principle later might note that the *apparent* longevity was resource-driven, not heuristic-driven.

  **3. Two Programmes Merging Belts**
  *   *Scenario:* Two programmes with different Hard Cores merge their protective belts to solve a shared anomaly.
  *   *Verdict:* **Theoretical Degeneration / Empirical Progress.**
  *   *Reasoning:* Under Clause 3, if the Hard Cores are distinct, they remain two programmes. If they merge belts, they are engaging in *ad hoc* cooperation. If this yields novel facts (Clause 1), it is empirically progressive. However, if the merger blurs the Hard Core distinctions, it may signal the birth of a *new* synthesis programme (Case vii), rendering the old appraisals moot.

  **4. The "Zombie" Programme**
  *   *Scenario:* A programme makes no new predictions but successfully defends against all falsification attempts for 50 years.
  *   *Verdict:* **Stagnant (not Degenerating).**
  *   *Reasoning:* Clause 1 requires a *surplus* of novel facts. Mere survival is not progress. However, without a rival (Clause 4), it remains rationally permissible to work within it, though not rationally required.

  ---

  ### IV. The Honest Statement: What Must Be Sacrificed

  You asked for an honest statement of which verdicts the principle cannot keep.

  **1. The Hindsight Problem (Case ii vs. iii)**
  *   **Sacrifice:** You cannot distinguish Case (ii) from Case (i) in real time.
  *   **Cost:** You must accept that calling a shift "progressive" at the moment of modification is always a gamble. The principle validates your intuition that (iii) is *better*, but it cannot tell you *now* if (ii) will turn out to be (i). You must treat all "ad hoc" fixes as *potentially* progressive but *probabilistically* degenerating until the novel fact arrives.

  **2. The Core Identification Problem (Case vii vs. viii)**
  *   **Sacrifice:** The boundary between "Protective Belt" and "Hard Core" is not objective; it is determined by the practitioners' willingness to defend it.
  *   **Cost:** You cannot objectively decide if a group has "abandoned the core" (vii) or just "adjusted the belt" (viii) without interviewing the scientists. The principle relies on *reconstructed* cores, not *observed* ones. You may have to accept that programme identity is partly sociological.

  **3. The Unit of Appraisal (Case x)**
  *   **Sacrifice:** There is no fixed "level" at which a programme exists.
  *   **Cost:** You cannot assign a single truth-value to "The Programme is degenerating." It is always "The Programme *at this granularity* is degenerating." This makes communication difficult (e.g., in grant reviews), as one panelist may appraise the macro-label while another appraises the micro-branch.

  ---

  ### V. The Real-Time Surrogate (For the PhD Student)

  You need to decide *this term*. You cannot wait for the decade of hindsight required by Clause 1. You need a **heuristic for heuristic power**.

  Since you cannot measure *corroborated novel facts* yet, you must measure the **risk profile of the proposed modifications**.

  **The Surrogate Principle:**
  > Advise the student to join the line of work if the proposed modification **increases the falsifiability** of the programme in the short term, rather than decreasing it.

  **Operational Checklist for the Interview:**
  1.  **The "What would kill it?" Test:** Ask the researchers: "What specific experimental result in the next 3 years would force you to abandon this specific modification?"
      *   *If they have an answer:* Progressive potential (Case iii).
      *   *If they say "We would adjust the parameters":* Degenerating potential (Case i).
  2.  **The "Unused Data" Test:** Ask: "Does this modification rely on data already in hand, or does it require new instrumentation/observation?"
      *   *New instrumentation:* Higher probability of temporal novelty (Case iii).
      *   *Existing data:* Higher probability of accommodation (Case v).
  3.  **The "Branch" Test (Case x):** Ignore the department's reputation. Look at the specific project. Is this project the one producing the anomalies for the rest of the department to explain? If so, join it.
  4.  **The Rivalry Check (Case ix):** Is there a competing group trying to solve the same problem with a different Hard Core?
      *   *Yes:* High pressure for progress. Good for a PhD (clear milestones).
      *   *No:* Low pressure. Risk of stagnation. Only join if the student is self-motivated.

  **Final Verdict for the Student:**
  Do not ask "Is this programme progressive?" Ask "Is this specific modification **risky**?"
  Lakatosian progress is the history of risks paid off. In real-time, you are betting on the *riskiness*, not the *payoff*. If the modification protects the theory from *everything*, it is degenerating. If it exposes the theory to *something new*, it is progressive.

  **Summary:** You cannot have the verdict without the history. But you can have the *smell test*. If the research smells like it is trying to survive, it is degenerating. If it smells like it is trying to be tested, it is progressive. Train the student to smell the difference.
