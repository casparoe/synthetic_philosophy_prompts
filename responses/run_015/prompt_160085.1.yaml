  Here's a thinking process that leads to the suggested document:

  1.  **Analyze the Request:**
      *   **Context:** A decision theory reading group has two members feuding over acausal trade (AT) for a year. They've agreed to an adversarial collaboration. I am the neutral third party drafting the document.
      *   **Structure:**
          1.  Numbered Agreed-Claims Section.
          2.  Disagreements Table (Neutral Framing + Side A Wording + Side B Wording).
          3.  Cruxes (Concrete Cases: "Drift" and "Half-sim", not standard twins).
          4.  Specific requirements for Cruxes: Is trade rational? Threshold in correlation? Continuous degradation? Pre-registered predictions.
          5.  Flag verbal disputes (terminology vs. substance).
      *   **Tone:** Neutral, precise, philosophical but actionable, suitable for an adversarial collaboration agreement.
      *   **Key Concepts:** Acausal Trade, Evidential Decision Theory (EDT) vs. Causal Decision Theory (CDT) vs. Functional/Timeless Decision Theory (FDT/TDT), correlation vs. causation, logical correlation.

  2.  **Deconstruct the Positions:**
      *   **Pro-AT (Let's call them "Functionalist"):** Believes rational agents can coordinate via logical correlation. If my decision algorithm outputs $X$, and yours is similar enough, yours outputs $X$. I should cooperate because that implies you cooperate. "Making" the other do something is shorthand for "being the logical cause."
      *   **Skeptic-AT (Let's call them "Causalist"):** Believes decision theory should only track causal influence. Evidence isn't leverage. The literature conflates "my action predicts yours" with "my action controls yours." Paying a cost without causal leverage is irrational surrender to a spurious correlation.

  3.  **Drafting - Section 1: Agreed Claims:**
      *   Need common ground to ensure the collaboration isn't futile.
      *   Both agree on the math of probability.
      *   Both agree on the definition of "causal contact" (light cones, etc.).
      *   Both agree that *if* there is causal influence, trade is standard.
      *   Both agree that agents maximize expected utility (though they disagree on the formula).
      *   Both agree the "Drift" and "Half-sim" cases are coherent scenarios.

  4.  **Drafting - Section 2: Disagreements Table:**
      *   Need neutral framing that doesn't beg the question.
      *   Need specific wording each side will accept (likely technical).
      *   *Core Dispute 1:* The nature of the subjunctive dependence.
      *   *Core Dispute 2:* The definition of "rationality" in this context.
      *   *Core Dispute 3:* Whether "trade" is the right word (verbal dispute flag).

  5.  **Drafting - Section 3: Cruxes (The Meat):**
      *   **Case 1: Drift.**
          *   *Setup:* Cosmological horizon. No causal contact. Correlation ($\rho \approx 0.7$) comes from shared math derivation.
          *   *Choice:* Beacon (Costly, no causal receiver) vs. Self.
          *   *Functionalist View:* If I beacon, likely you beacon. We both value the *existence* of the beaconed knowledge (even if unread). Or perhaps the payoff is symmetric: I want *your* knowledge, you want *mine*. Wait, the prompt says "encoding its entire scientific corpus into a beacon nobody receives." This makes it a Prisoner's Dilemma where "Cooperate" = Beacon (sacrifice for the *idea* of exchange) and "Defect" = Keep.
          *   *Correction on Payoff:* For AT to make sense, there must be a benefit. If *nobody* receives the beacon, where is the benefit? The prompt says "get a benefit brought about by an agent you will never causally influence." In Drift, if I beacon, I pay cost. If you beacon, you pay cost. Where is the gain?
          *   *Re-reading Prompt:* "spend a large share of its resources encoding its entire scientific corpus into a beacon nobody receives, or spend it on itself."
          *   *Interpretation:* This is a test of *principle*. If the Functionalist says "Cooperate," they are saying "I beacon because that implies you beacon." But if nobody receives it, what is the utility?
          *   *Refined Interpretation:* The utility must be defined such that I value *your* survival/knowledge even if I can't see it, OR the prompt implies a symmetric payoff structure where the *act* of beaconing is the "Cooperate" move in a PD where the reward is mutual flourishing *conditional on the other also flourishing*.
          *   *Actually, looking closer:* "get a benefit brought about by an agent you will never causally influence." In Drift, if I beacon, I don't get the benefit unless *you* beacon and I receive it. But the prompt says "nobody receives."
          *   *Resolution:* I must interpret the utility function carefully. Let's assume the utility is "Total Knowledge Preserved in the Multiverse" or similar. If I beacon, I add to the total. If you beacon, you add to the total. I care about the total. But my action doesn't causally affect yours.
          *   *Wait, standard AT setup:* I give you utility, you give me utility. Here: I beacon (cost), you beacon (cost). If we both beacon, we both get utility from knowing the *other* civilization existed and acted rationally? No, that's weak.
          *   *Best Interpretation for the Document:* Let's define the payoff matrix explicitly in the crux.
              *   Cooperate (Beacon): Cost $C$, Benefit $B$ to *other* (metaphysically, not causally).
              *   Defect (Self): Cost 0, Benefit 0 to other.
              *   My Utility: $U_{self} + \alpha U_{other}$.
              *   If $\alpha > 0$, and correlation is high, Functionalist cooperates. Causalist defects.
              *   *Constraint:* Prompt says "nobody receives." So the benefit must be non-causal. Let's assume the benefit is "The proposition 'Civilization Y preserved knowledge' is true." I value truth/preservation even if unobserved.
              *   *Actually, let's stick closer to the prompt's implied PD:* "spend... on itself." Okay. I will frame it as: I value the *existence* of your beaconed corpus even if I never see it (altruism over logical distance).
              *   *Correlation:* 0.7.
              *   *Threshold:* Where does CDT switch? Never (if no causal link). Where does FDT switch? When $P(Cooperate|I Cooperate) \cdot B > C$.
      *   **Case 2: Half-sim.**
          *   *Setup:* Original vs. Sim. Memory corruption. Weak correlation.
          *   *Choice:* Cooperate with counterpart.
          *   *Issue:* Self-locating uncertainty.
          *   *Functionalist:* Treat as one logical algorithm running twice with noise. Cooperate if expected utility across both instances is higher.
          *   *Causalist:* I am one instance. My action causes my outcome. The other instance is a separate causal node.
          *   *Degradation:* As corruption increases, correlation drops. FDT stops cooperating when correlation is too low to offset cost. CDT never cooperates (unless causal link exists).

  6.  **Refining the "Verbal Dispute" Flag:**
      *   The prompt suspects "is it really trade" is terminological.
      *   I need to explicitly isolate: Does the Causalist agree that the Functionalist's policy yields higher *ex-ante* expected utility, but refuses to call it "rational" *ex-post*? Or do they disagree on the ex-ante calculation too?
      *   Usually, CDT admits EDT/FDT agents do better in Newcomb-like problems but claims they are "irrational" for manipulating evidence. The dispute is often about the definition of "instrumental rationality."

  7.  **Drafting the Content (Iterative refinement):**
      *   *Tone Check:* Needs to be dry, precise, legalistic but philosophical.
      *   *Formatting:* Clear headings, tables for disagreements.
      *   *Specifics:* Ensure the 0.7 correlation is used. Ensure the "continuous degradation" question is answered.

  8.  **Self-Correction on "Drift":**
      *   If nobody receives the beacon, why does the other agent's beaconing benefit me?
      *   *Fix:* I will define the utility function in the scenario description to ensure there *is* a stake. E.g., "Each civilization values the *truth* that the other preserved knowledge, independent of observation." This makes it a valid PD without causal exchange.
      *   *Wait, better:* "Each civilization gains utility $V$ if the *other* civilization beacons, regardless of reception (e.g., aesthetic value in the universe's structure)." This allows the AT argument to hold.

  9.  **Final Review against constraints:**
      *   Numbered agreed claims? Yes.
      *   Disagreements table (Neutral + Side A + Side B)? Yes.
      *   Cruxes (Drift + Half-sim)? Yes.
      *   Thresholds/Degradation included? Yes.
      *   Verbal disputes flagged? Yes.

  10. **Final Polish:** Ensure the distinction between "making happen" (causal) and "logical implication" (acausal) is sharp in the wording options. (Self-correction: Make sure Side B doesn't feel strawmanned. Side B should sound like a rigorous Causalist, not a dismissive skeptic.)

  *(Self-Correction during drafting the Disagreements Table)*: Side A (Pro-AT) usually aligns with FDT/TDT. Side B (Skeptic) aligns with CDT. I should label them "Party A (Functionalist)" and "Party B (Causalist)" for neutrality in the doc, or let them choose. I'll use "Proponent" and "Skeptic" for clarity in the draft, but note they can swap. Actually, "Party A" and "Party B" is most neutral. I will assign A to the Pro-AT view and B to the Skeptic view based on the prompt's ordering ("One thinks... The other thinks...").

  *(Refining the Crux Predictions)*: I need to make sure the predictions are specific. Not just "Cooperate" but "Cooperate if correlation > X".
  For Drift: Correlation is fixed at 0.7.
  For Half-sim: Correlation degrades.
  I need to ask them to fill in the threshold numbers, or provide the *structure* for them to fill in. The prompt asks me to "draft it... with each side's prediction written down in advance." I cannot know their exact numbers. I must create the *slots* for them to sign, or provide the *theoretical* thresholds they *should* commit to based on their theories.
  *Decision:* I will write the *theoretical commitment* each side makes (e.g., "Party A commits to cooperating whenever $p \cdot B > C$"). This forces them to own the theory.

  *(Wait, re-reading prompt)*: "with each side's prediction written down in advance." This implies I should write what they *would* predict based on their stated views, so they can sign off on it as an accurate representation of their view. I will draft the predictions based on standard FDT vs CDT positions.

  *(Verbal Dispute)*: The prompt specifically asks to flag if "is it really trade" is terminological. I will add a specific section for this.

  Let's assemble.
answer: |-
  # ADVERSARIAL COLLABORATION PROTOCOL: ACAUSAL TRADE
  **Date:** 2024-05-23
  **Facilitator:** [Your Name/Neutral Third Party]
  **Parties:** Party A (Functionalist/Pro-AT), Party B (Causalist/Skeptic)

  ## 1. AGREED CLAIMS
  *Both parties affirm the following propositions as true for the purposes of this collaboration. Disagreement on these items voids the protocol.*

  1.  **Causal Structure:** Both parties agree on the physical causal structure of the scenarios below (e.g., that "Drift" involves spacelike separation beyond any possible light-cone intersection).
  2.  **Probability Theory:** Both parties agree on the laws of probability theory, including conditional probability and Bayes' theorem. Disagreements concern *which* conditional probabilities are relevant to decision-making, not the math itself.
  3.  **Rationality Goal:** Both parties agree that a decision theory aims to guide an agent toward outcomes they prefer (maximize expected utility), though they disagree on the definition of "expected utility" in subjunctively dependent scenarios.
  4.  **No Magic:** Both parties agree that no supernatural backward causation or signaling is occurring. All correlations arise from common causes (shared physics, shared algorithms, or shared history).
  5.  **Scenario Coherence:** Both parties agree that the "Drift" and "Half-sim" scenarios described in Section 3 are logically coherent and possible within a naturalistic worldview.

  ## 2. DISAGREEMENTS TABLE
  *The following table isolates the core points of contention. "Neutral Framing" describes the issue without theoretical loading. "Party A" and "Party B" columns contain the specific phrasing each party must sign to indicate their commitment.*

  | # | Neutral Framing | Party A (Functionalist) Wording | Party B (Causalist) Wording |
  | :--- | :--- | :--- | :--- |
  | **2.1** | **The Leverage Mechanism** | "My decision provides *logical leverage* over the other agent because our decision procedures share a common abstract structure, making my output a predictor of theirs." | "My decision provides *evidence* about the other agent, but evidence is not leverage. I cannot influence variables outside my future light cone." |
  | **2.2** | **Definition of 'Rational'** | "A policy is rational if it yields higher expected utility ex-ante, even if the causal path is absent. Rationality requires acting as if one controls the logical output of similar algorithms." | "A policy is rational only if it maximizes utility via causal consequences. Acting on non-causal correlations is an error in distinguishing news from influence." |
  | **2.3** | **Nature of the Exchange** | "Acausal trade is a genuine exchange of benefits mediated by logical correlation, functionally equivalent to causal trade for embedded agents." | "Acausal trade is a misnomer; no goods or services are exchanged. It is merely parallel optimization based on shared priors." |
  | **2.4** | **Counterfactuals** | "The relevant counterfactual is: 'If my algorithm outputted Defect, would the other algorithm (being similar) also output Defect?'" | "The relevant counterfactual is: 'If I physically performed the action Defect, holding the rest of the universe fixed, what would happen?'" |

  ## 3. CRUXES: CONCRETE CASES
  *Standard "Newcomb" or "Prisoner's Dilemma with Clones" setups are excluded. The parties must register predictions for the following two specific scenarios.*

  ### CASE 1: DRIFT
  **Setup:** Two civilizations (Civ 1, Civ 2) exist on opposite sides of a cosmological horizon. No causal contact is ever possible.
  **The Choice:** Each can **Beacon** (spend 30% of resources encoding their science into a signal that will never be received) or **Hoarding** (spend resources on internal flourishing).
  **Utility:** Each civilization values the *truth* that the other civilization preserved their knowledge (Utility = +100 if Other Beacons, -30 if Self Beacons). They do not value the reception, only the existence of the act.
  **Correlation:** Due to convergent mathematical derivation, the probability that both choose the same action is **0.7**. (i.e., $P(C2=Beacon | C1=Beacon) = 0.7$). Both know this.

  | Question | Party A Prediction (Functionalist) | Party B Prediction (Causalist) |
  | :--- | :--- | :--- |
  | **Is Trade Rational?** | **Yes.** One should Beacon. | **No.** One should Hoard. |
  | **Reasoning** | Expected Utility of Beaconing: $(0.7 \times 100) - 30 = 40$. <br> Expected Utility of Hoarding: $(0.3 \times 100) - 0 = 30$. <br> $40 > 30$. | Expected Utility of Beaconing: $P(Other=Beacon) \times 100 - 30$. <br> My action does not change $P(Other=Beacon)$. <br> Cost is real; causal benefit is zero. Net loss. |
  | **Correlation Threshold** | Cooperate if $p > 0.3$ (where $p$ is correlation probability). | Never cooperate regardless of $p$, unless $p$ implies a causal mechanism. |
  | **Continuous Degradation** | As correlation drops from 1.0 to 0.0, cooperation stops abruptly at the threshold ($p=0.3$). | Cooperation never begins. The curve is flat (Defect always). |

  ### CASE 2: HALF-SIM
  **Setup:** You wake up. You know there is a 50% chance you are the **Original** and 50% you are a **Simulation**.
  **The Choice:** **Cooperate** (pay cost 10 to give benefit 50 to counterpart) or **Defect** (pay 0, give 0).
  **Correlation:** You know the simulation's memory was corrupted. Your decision correlates with the counterpart's decision at **0.6**. (If you Cooperate, 60% chance they Cooperate).
  **Constraint:** You cannot distinguish Original from Sim. You want to maximize the *sum* of utility across both possible instances (Original + Sim).

  | Question | Party A Prediction (Functionalist) | Party B Prediction (Causalist) |
  | :--- | :--- | :--- |
  | **Is Trade Rational?** | **Yes.** One should Cooperate. | **No.** One should Defect. |
  | **Reasoning** | Treat both instances as one logical algorithm running with noise. <br> Total EU: $2 \times [ (0.6 \times 50) - 10 ] = 40$. <br> Defect EU: $2 \times [ (0.4 \times 50) - 0 ] = 40$. <br> *Correction:* If correlation is 0.6, $P(Same)=0.6$. <br> Cooperate: $0.6(50+50) - 10 = 50$. <br> Defect: $0.4(50+50) = 40$. <br> Cooperate is superior. | I am one instance. My action causally affects only my instance's cost. The other instance is a separate causal node. <br> My cost is 10. My causal benefit is 0. <br> Defect dominates. |
  | **Correlation Threshold** | Cooperate if correlation $p > 0.5$ (assuming symmetric payoffs). | Never cooperate. |
  | **Continuous Degradation** | As memory corruption increases (correlation drops), cooperation stops when $p \le 0.5$. | Cooperation never begins. |

  ## 4. VERBAL DISPUTE FLAG
  *The Facilitator notes the following potential terminological confusion. Parties must indicate if they believe the disagreement is substantive or merely verbal.*

  **Issue:** The definition of "Trade" and "Influence."
  *   **Party A Position:** If the *ex-ante* expected utility of a policy is higher because of logical correlation, calling it "trade" is functionally accurate. "Influence" includes logical influence.
  *   **Party B Position:** "Trade" requires the exchange of goods. "Influence" requires causal power. Using these terms for acausal scenarios conflates map with territory.
  *   **Facilitator Note:** If Party B agrees that Party A's policy yields higher *ex-ante* utility but refuses to call it "rational," the dispute is **Verbal (Definition of Rationality)**. If Party B claims Party A's policy yields *lower* utility, the dispute is **Substantive (Decision Theory Math)**.
  *   **Required Sign-off:**
      *   Party B confirms: "I acknowledge that following Party A's policy in Case 1 yields higher expected utility *from the perspective of an agent choosing a policy behind a veil of ignorance*, but I maintain it is irrational *at the moment of decision*." [ ] Yes [ ] No
      *   *If No, the dispute is substantive. If Yes, the dispute is largely terminological regarding 'rationality'.*

  ## 5. SIGNATURES
  *By signing, parties agree that if the experimental outcomes (or logical proofs) align with one column, they will update their credence in the opposing decision theory accordingly.*

