  2.  **Deconstruct Hume's *On Suicide*:**
      *   **Core Thesis:** Suicide is not inherently sinful or immoral.
      *   **Arguments:**
          *   *Duty to God:* We alter matter constantly (diverting a river, killing a flea); ending life is no different. Providence governs all events, including suicide.
          *   *Duty to Society:* If one is a burden or useless, leaving society might be beneficial.
          *   *Duty to Self:* Misery outweighs existence; reason dictates ending suffering.
          *   *Afterlife:* Fear of punishment is superstition; God is benevolent.
          *   *Analogy:* Voluntary exposure to danger (war, sea) is accepted; suicide is just a more direct version.

  3.  **Deconstruct *Hamlet* (Relevant Parts):**
      *   **"To be, or not to be" (Act III, Scene i):** Hamlet contemplates self-slaughter. He stops not because of duty to God/Society, but because of the *unknown* ("undiscovered country"). It's epistemic uncertainty, not necessarily moral prohibition (though conscience does make cowards of us all).
      *   **The Prayer Scene (Act III, Scene iii):** Hamlet refuses to kill Claudius because Claudius is praying. Hamlet fears killing him while repentant would send his soul to heaven. This shows a concern for the *state of the soul* at death and the *moral quality* of the end.
      *   **The Final Scene (Act V, Scene ii):** Hamlet accepts death ("the rest is silence"). He is killed by poison (Laertes/Claudius plot), but he forces the King to drink. He dies publicly, witnessed by Horatio. He cares about his story ("report me and my cause aright").

  4.  **Synthesize/Interrogate (The Interlocutor Strategy):**
      *   *Hume vs. Hamlet on Afterlife:* Hume dismisses afterlife fear as superstition. Hamlet treats it as a genuine epistemic barrier. Is Hamlet superstitious? Or is Hume dogmatic? Hamlet suggests that because we *don't know*, we must pause. Hume says because we *can't know* (and God is good), we shouldn't fear. Hamlet's caution is rational uncertainty; Hume's is metaphysical confidence.
      *   *Hume vs. Hamlet on Agency:* Hume equates suicide with other risks. Hamlet distinguishes between *self-killing* (sin/cowardice?) and *being killed* (fate/providence?). Hamlet doesn't kill himself in Act III. In Act V, he accepts death but doesn't strictly commit suicide (though he drinks the poison knowingly later? No, he is wounded by the foil, then forces the cup on Claudius. He dies of the wound/poison). Actually, Hamlet is mortally wounded by the foil. He doesn't choose the moment initially. But he accepts it.
      *   *The Claudius Contrast:* Hamlet won't kill Claudius because of *where* Claudius's soul will go. This implies death is not a neutral cessation (as Hume might treat it physically) but a transition with moral weight. Hume dissolves the moral weight of the *timing* of death. Hamlet insists the *timing* matters eternally.
      *   *Narrative/Witness:* Hume argues from abstract duty. Hamlet argues from narrative closure ("O God, Horatio... tell my story"). Death in *Hamlet* is a social performance. Hume ignores the *meaning* of death for the survivors beyond utility. Hamlet insists on the *interpretation* of death.

  5.  **Drafting the Essay:**
