      *   *Section 2: The Quality of Dying (Claudius).* Hamlet's refusal to kill praying Claudius. Hume says timing doesn't matter (no duty to God). Hamlet says timing matters immensely (heaven vs. hell). This shows death has moral texture Hume ignores.
      *   *Section 3: Agency and Witness.* Final scene. Hamlet accepts death but cares about Horatio's report. Hume focuses on the act's morality. Hamlet focuses on the act's *narrative*. The asymmetry between self-killing and being killed matters for the story.
      *   *Conclusion:* What does Hamlet add? The importance of narrative closure, the ethics of witness, and the moral weight of the *moment* of death.

