          4.  Apply the adjudication to an undiscussed case: The Fall of the Western Roman Empire.
      *   **Tone:** Analytical, balanced, philosophical but grounded.

  2.  **Deconstruct the Four Moves:**

      *   **Move 1 (Lena):** "Collapse" is Western framing. Societies are open systems. It's a phase transition/network topology change, not death. (Evidence: Bronze Age, Maya, Rapa Nui).
          *   *Analysis:* Strong on systems theory (fits the chemist background). Challenges teleology.
          *   *Verdict:* Lena is conceptually stronger on *definition*, but risks minimizing disruption.

      *   **Move 2 (Marcus):** Relabeling decline. Loss of literacy/trade/works = institutional failure. Easter Island = real collapse (deforestation -> cannibalism -> crash).
