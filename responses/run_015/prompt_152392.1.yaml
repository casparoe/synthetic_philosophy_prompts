      *   **Move 3 (Lena):** Cannibalism is myth/rats did damage. Culture adapted. No baseline for "normal." Complexity $\neq$ progress.
          *   *Analysis:* Updates evidence (modern archaeology supports her on Rapa Nui). Attacks the value judgment (complexity).
          *   *Verdict:* Lena wins on *evidence* and *normative critique*.

      *   **Move 4 (Marcus):** Concept becomes useless if everything is just "reconfiguration." Hides suffering. People depended on institutions.
          *   *Analysis:* Pragmatic argument. Utility of language. Ethical argument (suffering matters).
          *   *Verdict:* Marcus wins on *utility* and *ethics*, even if his historical specifics were shaky.

  3.  **Identify Hidden Assumptions:**
      *   **Complexity as Progress:** Marcus assumes more complexity = better. Lena assumes complexity = neutral/fragile.
      *   **Continuity of Identity:** What makes a society the "same" society? (Ship of Theseus problem).
      *   **Perspective:** Elite vs. Commoner. Collapse often looks different from the palace vs. the village.
      *   **Timescale:** Is a 50-year dip a collapse or a blip?

  4.  **Adjudicate the Undiscussed Case (Western Roman Empire):**
      *   *Marcus View:* Loss of central authority, economy, literacy in Britain/Gaul = Collapse.
      *   *Lena View:* Transformation into Germanic kingdoms, continuity of Church, Roman law in East = Phase transition.
      *   *Synthesis:* It depends on the metric (political centralization vs. cultural continuity).

