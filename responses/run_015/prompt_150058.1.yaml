answer: |-
  Here's a list of questions I've put together for the chat. I've tried to keep them focused on the mechanics of his view rather than the usual biography stuff. There's a typo or two left in just to keep it real.

  1.  **The Guilt Gap**
      If there's genuinely no line between duty and the extra stuff, why does the guilt feel so different? Like, I feel properly guilty ignoring a beggar on the street, but I don't feel guilty for not jumping on a grenade to save a busload of people. If it's all just one scale of cost, why the split in emotions?
      *Follow-up:* I suspect you'll say that's just social pressure training us to feel differently. But if morality is just internalised social pressure, aren't you basically saying morals are just etiquette? Where's the actual 'ought' coming from then?

  2.  **Moral Holidays**
      Can you take a weekend off from being good on your view? Or does this sliding scale mean you're always falling short if you relax and watch telly instead of volunteering?
      *Follow-up:* If I can never stop climbing the scale without slipping backwards, isn't this view just demandingness disguised? It sounds exhausting for anyone trying to live it.

  3.  **Small Acts vs. Big Saves**
      What about people who do tiny kind acts every day—holding doors, being patient—but never pull off big heroic saves? Does your sliding scale actually capture that pattern, or does it miss something?
      *Follow-up:* If cost is the main metric, does that mean the patient person is morally 'cheaper' than the hero? That feels wierd, like you're valuing the price tag over the character.

  4.  **Blame and Failure**
      If I fail to do something high-cost (like the heroic stuff), do you blame me less than if I fail to do something easy? If the answer is yes, isn't that just admitting there's a category difference after all?

  5.  **Who Sets the Price?**
      You reckon morality is a scale of cost. But who decides the cost? Is it subjective to me, or is there an objective measure? Because what's expensive for me might be cheap for you.

  6.  **Family vs. Strangers**
      Does this scale account for partiality? Do I owe more to my kids than to strangers, or is the cost calculation the same regardless of who needs the help?

  7.  **The Gold Star Problem**
      If calling something 'heroic' is just society putting a gold star on expensive choices, why do we praise it at all? If it's all roughly duty-ish, why single out the hard stuff for rewards?

  8.  **Language and Intuition**
      Why do we even have the word 'supererogatory' if it's made up? Languages usually keep words for things that exist. Are you saying everyone else is just confused about how language works?

  9.  **Practical Impact**
      Finally, does holding this view actually make people better? Or does treating everything as a sliding scale of obligation just make people anxious about never doing enough?
