prompt: |-
  Write a short dialogue between two people arguing about Bauman's claim that modern bureaucratic rationality made the Holocaust possible. One should take the side that the specific way moral judgement got seperated from technical action—what Bauman calls adiaphorization—was so extreme and systematic in the Nazi case that comparing it to colonial violence misses a structural uniqueness. The other should push back that this same seperation of ethics from adminstration shows up in plenty of other modern state projects, so if Bauman's analysis holds then uniqueness is just a matter of scale, not kind. Have them actually respond to each other: the first should address the comparison to colonial bureaucracy directly, and the second should explain why scale isn't enough to save uniqueness. Write it casual, like they're in a pub, and don't worry about perfect spelling—throw in a typo or two.
