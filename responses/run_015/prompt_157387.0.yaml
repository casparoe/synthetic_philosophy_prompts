      Sarah leaned in. "Why not? The British in India used the same files, same distance. A clerk signs a paper, people starve. No moral judgement."
      Dave: "But in the colonies, the killing was a side effect. In the Holocaust, the bureaucracy *was* the weapon. The seperation of ethics from action was so systematic it was basically the whole point. Colonial admins still pretended they were civilizing someone. The Nazis just wanted efficiency in death."
      Sarah: "Thats the thing though. If the mechanism is the same—adiaphorization, whatever—then saying the Holocaust is unique is just saying 'more people died.' Scale isnt kind. If modernity allows you to switch off your conscience for admin, it doesnt matter if its for rubber in the Congo or gas in Poland. The structural flaw is identical."
      Dave: "But the intensity matters! It changes the structure."
