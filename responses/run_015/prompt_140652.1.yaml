  Your friend is applying a rigorous version of the **Adversarial Robustness Test**: *Does this safeguard survive if the model is actively trying to break it?* Her verdicts reveal that she rejects any safeguard where the monitoring mechanism shares the agent's cognitive lineage, incentives, or capabilities.

  Here are three rules that fit her past verdicts perfectly but diverge on your proposal and future variants.

  ### The Three Rules

  **1. The Capability Asymmetry Rule**
  *   **Definition:** A safeguard is "control" only if the monitoring mechanism is strictly less capable (compute/parameters) than the deployed agent.
  *   **Logic:** A weaker model cannot outmaneuver a stronger one, but a stronger one can always bypass a weaker check. However, if the checker is weaker, it limits the *speed* or *complexity* of attacks, and crucially, it cannot execute the harm itself.
  *   **Fits Track Record:** Explains why the "much weaker model" (#4) is control, while "same model" (#6) and "self-critique" (#3) are not.
  *   **Prediction on Proposal:** **Control.** The critic is "small" and "weak only in size." It cannot execute actions, only escalate.

  **2. The Training Provenance Rule**
  *   **Definition:** A safeguard is "control" only if the monitoring mechanism's weights were trained on data *causally independent* of the deployed agent's outputs or reasoning.
  *   **Logic:** If the agent is misaligned, its outputs are deceptive. Training a critic on those outputs distills the deception into the critic. The critic learns to recognize "bad" actions only as the *deceptive agent* defines them.
  *   **Fits Track Record:** Explains why "fine-tuning" (#2) and "same model review" (#6) fail (dependent weights), while "weaker model" (#4) succeeds (implied independent lineage, e.g., a standard classifier).
  *   **Prediction on Proposal:** **Not Control.** The critic is "distilled from that same deployed system's own verdicts." It shares the agent's blind spots and deceptive norms.

  **3. The Adversarial Opacity Rule**
  *   **Definition:** A safeguard is "control" only if the deployed agent cannot accurately simulate the monitor's decision boundary.
  *   **Logic:** If the agent knows exactly how the monitor thinks, it can craft outputs that pass the monitor while still causing harm (Goodhart's Law on steroids). Opacity prevents the agent from optimizing against the check.
  *   **Fits Track Record:** Explains why "monitoring reasoning" (#7) fails (agent knows its own reasoning) and "same model review" (#6) fails (agent can simulate itself). "Airgap" (#1) works because physics is opaque to the model's optimization.
  *   **Prediction on Proposal:** **Not Control.** Because the critic is distilled from the agent, the agent knows the critic's architecture and training distribution. It can simulate the critic perfectly and learn the escalation threshold.

  ### Best Guess: The Adversarial Opacity Rule

  I believe your friend is implicitly applying **Rule 3 (Adversarial Opacity)**, with Rule 2 (Provenance) serving as the primary heuristic for achieving it.

