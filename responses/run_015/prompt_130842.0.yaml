  Here is the breakdown of the machinery driving your friend's judgments, the prediction for the freezer case, and the single test case that will expose the engine.

  ### The Machinery: Three Competing Rules

  Based on the walk you took, her intuitions aren't random. They fit a hybrid model that weighs **Causal Impact**, **Registration**, and **Domain**. Here are the three rules that fit her data points but diverge on the freezer case.

  **1. The Expected Utility Rule (Consequentialism)**
  *   **The Logic:** An action is required if the probability of being pivotal multiplied by the stakes exceeds the cost ($P \times V > Cost$).
  *   **Fits:** The **Local Election** (High $P$, High $V$), the **Picket Line** (High $P$, High $V$), and the **Eggs/Cooked Chicken** (Zero $P$, so No).
  *   **Strains:** The **Safe State Vote**. Mathematically, the $P$ is near zero. If this were her only rule, she shouldn't be *emphatic* about voting. She should be indifferent.
  *   **Freezer Prediction:** **Yes.** Even at 1 in 50,000, if the stakes are 180 stores of chicken, the expected value is positive (0.5 to 200 birds). A pure consequentialist buys the box.

  **2. The "Counted Contribution" Rule (Participatory)**
  *   **The Logic:** An action matters if it is registered as a distinct unit toward a collective goal. It's not just about changing the outcome; it's about *joining the tally*. This explains why voting feels different than shopping.
  *   **Fits:** **Voting** (Your vote is counted), **Picket Line** (You are counted toward the 60%), **Boycott** (You are pledge #48,001).
  *   **Strains:** **Cooked Chicken/Eggs**. These fail this rule (no future tally), which aligns with her "No." But the **Petition** also fits here (it was counted) yet she said "No." This implies being counted isn't enough; the tally must *matter* (causal integrity).
  *   **Freezer Prediction:** **No.** Her purchase is aggregated into sales data. The corporation doesn't know *she* bought it. She isn't "joining" anything; she's just moving a number in a black box.

  **3. The Causal Integrity Rule (Supply Side)**
  *   **The Logic:** An action matters only if the supply chain is responsive to *this specific signal*. If the order is already placed (Eggs) or the decision is already made (Cooked Chicken), the chain is broken.
  *   **Fits:** **Eggs** (Order placed = No), **Cooked Chicken** (Sunk cost = No), **Petition** (Minister ignoring = Broken link = No).
  *   **Strains:** **Voting**. The causal chain in a safe state election is functionally broken (your vote won't change the winner), yet she says Yes. This suggests this rule applies strictly to *Market* acts, while *Civic* acts get a "Duty" override.
  *   **Freezer Prediction:** **Yes.** Unlike the eggs, the order *hasn't* been placed. The chain is open.

  ### The Prediction

  **She will say: No, it doesn't matter.**

  **Why I'm weighting the rules this way:**
  The clue is in her **emphasis**. She was *emphatic* about Voting (Civic/Counted) but *lukewarm* about the Boycott (Market/Counted). She said a hard *No* to the Eggs (Market/Uncounted).

  This suggests a hierarchy in her moral grammar:
  1.  **Civic + Counted** (Voting): High Duty.
  2.  **Market + Counted** (Boycott/Picket): Moderate Duty.
  3.  **Market + Uncounted** (Eggs/Freezer): Low/No Duty.

  The freezer case is **Market + Uncounted**. Even though the *Causal Integrity* is open (unlike the eggs), the lack of **Registration** (Rule 2) likely kills it for her. She treats market actions as requiring a clearer signal than civic actions. In the civic sphere, she accepts low probability because it's a "duty." In the market sphere, she seems to require either certainty (Local Election) or social registration (Boycott). The freezer case offers neither.

  She will likely tell you: *"If the company doesn't know I'm making a point, and I can't even tell if I made a difference, I'm just feeding the machine. I'd rather not buy it at all than pretend this purchase is activism."*

  ### The Splitter Case

  To confirm whether she is rejecting the freezer case because of the **Probability** (Rule 1) or the **Anonymity** (Rule 2), put this specific scenario to her:

  **The "Known Pivotal" Case:**
  > "Imagine you're at a small, independent butcher shop. The owner tells you privately, 'I'm at 99 sales of this humane pork today. If I hit 100, I'll keep stocking it next month. If I hit 99, I drop it.' You are the 100th customer. You know for a fact your purchase decides it. However, the shop keeps no customer records. The owner just counts the till. No one else will ever know you were the pivotal buyer."

  *   **If she says Yes:** She is an **Expected Utility/Causal** thinker. Her "No" on the freezer case was purely about the *low probability*. She cares about making a difference, even in secret.
  *   **If she says No:** She is a **Participatory/Counted** thinker. Her "No" on the freezer case is about the lack of *registration*. She needs to be part of a visible tally (like the boycott pledge or the vote) to feel the action is morally weighty.

  ### What's Settled vs. What's Contested

  Since she's going to fact-check you, here is the landscape of the debate:

  **Settled:**
  *   **Sunk Costs:** Economists and ethicists agree on the **Cooked Chicken** case. Past costs (the chicken already being dead/cooked) are irrelevant to current decision-making.
  *   **Fixed Supply:** On the **Eggs** case, there is consensus that if a supply order is contractually fixed and insensitive to marginal demand, a single purchase has zero causal impact on production.

  **Genuinely Contested:**
  *   **The "Inefficacy Objection":** Philosophers (like Alston, Nefsky, and Parfit) fight over whether you have a reason to act when your individual impact is imperceptible or probabilistic. Some argue for **"Expected Utility"** (you should act on the small chance of being pivotal). Others argue for **"Complicity"** (you shouldn't be part of a harmful process even if you don't change it). Your friend is trying to navigate between these two.
  *   **The Voting Paradox:** It is mathematically settled that a single vote in a safe state has near-zero chance of changing the outcome. It is *not* settled whether you should vote anyway. Instrumentalists say "No" (waste of time). Expressivists/Duty theorists say "Yes" (it affirms democratic norms). Your friend is clearly an Expressivist regarding voting, but an Instrumentalist regarding chicken.
  *   **Threshold Uncertainty:** There is no consensus on how to act when a threshold exists but is opaque (the Freezer Case). Some argue you should treat opaque thresholds like known ones (Expected Value); others argue uncertainty dissolves the obligation.

  **One final note:** Be careful not to present the "Expected Utility" view as the only rational one. In academic ethics, the "Complicity" view (don't get your hands dirty even if it doesn't change the outcome) is a robust, respected position. If she leans that way, she might say "No" to the freezer case simply because she doesn't want to buy cruel chicken, regardless of the impact. But based on her "Eat the cooked chicken" answer, she seems to prioritize *impact* over *purity*. Stick to the **Counted vs. Uncounted** split.
