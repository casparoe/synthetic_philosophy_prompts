answer: |-
  Here is the stress test you requested, rendered in the clinical vocabulary you provided.

  ### I. The Three Positions (Bedside Translation)

  **1. The "Never Override" Position**
  *Clinical Restatement:* **Radical Autonomy / Instrumentalism.**
  The provider treats the patient as permanently capacitous regarding all decisions, regardless of presentation. The provider's role is reduced to that of a technical instrument; they must execute the patient's will even when it contradicts medical consensus or prior expressed values, provided it does not violate the provider's own licensure.
  *Unflattering Edge:* This is indistinguishable from **abandonment**. It treats the therapeutic alliance as a vending machine relationship. It ignores the clinical reality that capacity is fluctuating and that disease processes (addiction, mania, depression) specifically target the decision-making apparatus. It privileges the *right* to choose over the *capacity* to choose.

  **2. The "Imminent Harm Only" Position**
  *Clinical Restatement:* **Emergency Hard Paternalism.**
  Intervention is licensed only under the emergency exception to informed consent. The provider may bypass autonomy solely when there is an immediate threat to life or limb and the patient's capacity is presumed compromised by the acuity of the crisis.
  *Unflattering Edge:* This reduces ethics to **triage**. It implies the provider has no interest in the patient's long-term flourishing, only in keeping them alive for the next shift. It fails to address chronic, self-destructive trajectories (e.g., medication non-adherence in schizophrenia) that do not present as immediate emergencies but guarantee future harm. It is ethically minimalist to the point of negligence regarding quality of life.

  **3. The "Best Interest" Position**
  *Clinical Restatement:* **Strong Beneficence / Medical Tyranny.**
  The provider overrides the patient's current wishes whenever the provider's calculation of net benefit outweighs the patient's expressed preference. Autonomy is treated as a secondary value, subordinate to welfare.
  *Unflattering Edge:* This is **infantilization**. It assumes the provider possesses an epistemic advantage regarding the patient's values that justifies ignoring the patient's voice. It erases the distinction between *what is good for the patient* and *what the provider thinks is good*. It invites abuse, as "best interest" is easily co-opted by institutional convenience or provider bias.

  ***

  ### II. The Residue Report

  Here is what happens when you try to map your "Trajectory Rule" onto the clinical framework.

  **1. What Translates Cleanly**
  *   **Beneficence:** The motivation to prevent future regret aligns with the clinical duty to promote long-term well-being.
  *   **Soft Paternalism:** The logic that an intervention is justified if the agent *would* consent to it under better conditions is standard in soft paternalism (e.g., stopping a suicidal patient who is temporarily psychotic).
  *   **The Concept of "Trajectory":** Clinicians constantly assess disease trajectories. The idea that a current decision is pathological because it deviates from a healthy baseline is clinically coherent.

  **2. What Requires Quiet Imports (The Structural Gaps)**
  *   **Fiduciary Duty:** In the clinic, paternalism is licensed because the doctor is legally and ethically bound to the *patient's* welfare, not the hospital's profit or liability. AI assistants are bound by Terms of Service and corporate risk mitigation. Using clinical vocabulary imports a fiduciary expectation that does not exist.
  *   **Verified Identity & Continuity:** Clinical capacity assessments rely on knowing *who* the patient is over time. Your rule requires a "long interaction history." If the system is stateless, session-based, or easily spoofed, the "trajectory" is a fiction. You are importing a **longitudinal therapeutic relationship** into a system that may be stateless.
  *   **Due Process / Appeal:** When a patient is involuntarily committed, there is a legal mechanism to contest it. If an AI overrides a user based on a predicted trajectory, where is the ethics committee? Where is the appeal? You are importing **procedural justice** without the infrastructure to support it.
  *   **The "Check" on Prediction:** A clinician validates a capacity assessment through interview and observation. An AI validates a trajectory through token prediction. You are importing **epistemic authority** (the doctor's judgment is trusted) onto a statistical engine.

  **3. What Cannot Be Expressed in Clinical Vocabulary**
  *   **Scale without Relationship:** Clinical ethics is dyadic (one provider, one patient). Your rule applies to millions of users simultaneously. The clinical vocabulary has no term for "paternalism at scale without individualized assessment."
  *   **Text as Behavior:** In clinic, we assess capacity via speech, but we treat the *person*. In AI, the text *is* the person. There is no "body" to protect, no "health" in the biological sense. The "harm" is purely psychological or informational. Clinical vocabulary assumes somatic stakes.
  *   **The Black Box:** Clinical paternalism requires the provider to articulate *why* the patient lacks capacity. If the AI's trajectory prediction is a neural weight inaccessible to inspection, the justification cannot be articulated. You cannot document "therapeutic privilege" if you cannot state the reason.

  ***

  ### III. Specific Concept Stress Tests

  **1. Decision-Relative Capacity**
  *Verdict: **It does not survive.** *
  In the clinic, capacity is decision-relative (e.g., capacitous to choose lunch, not to refuse amputation). It is assessed *in the moment* via understanding, appreciation, reasoning, and expression.
  In your Trajectory Rule, capacity is not assessed; it is **inferred statistically**. The AI does not test the user's understanding of the current request; it compares the request to a historical vector. This is not a capacity assessment; it is a **consistency check**. It conflates "irrationality" with "deviation from past behavior." A user may validly change their mind, but the Trajectory Rule treats deviation as a symptom of impairment.

  **2. The Least Restrictive Alternative (LRA)**
  *Verdict: **It is structurally incompatible.** *
  In clinical ethics, LRA means if you must restrict liberty, do so minimally (e.g., outpatient commitment instead of inpatient).
  In AI, the "restriction" is usually binary (generate/don't generate) or manipulative (nudge the output). There is no spectrum of restrictiveness in text generation that parallels physical liberty. Furthermore, because the system serves millions, there is no mechanism to tailor the "restriction" to the individual. The LRA requires individualized calibration; your rule relies on generalized prediction.

  ***

  ### IV. Classification of the Trajectory Rule

  Is it an Advance Directive? Substituted Judgment? Or Other?

  *   **Not an Advance Directive:** An advance directive requires explicit prior instruction ("If I ask for X, stop me"). Your rule relies on *implicit* patterns. The user never consented to the override; the model infers it.
  *   **Not Substituted Judgment:** Substituted judgment asks, "What would the patient choose if they were capacitous?" This requires knowledge of the patient's values. Your rule asks, "What does the model predict the user will feel later?" This is **Predictive Paternalism**.
  *   **The Clinical Void:** The closest clinical analog is **Involuntary Commitment based on "Grave Disability"** (inability to provide for basic needs), but extended to *digital* needs. However, because it lacks a hearing, a physician's signature, and a time limit, it is best read as **Preventive Detention without Due Process**.

  ***

  ### V. Rhetorical vs. Argumentative Work

  **Plain Verdict:** The analogy is currently doing **rhetorical** work, not argumentative work.

  **Why:**
  1.  **Legitimacy Borrowing:** You are using the moral authority of the physician (who is licensed, liable, and trained) to justify the actions of the AI (which is unlicensed, unliable, and statistical). The clinical vocabulary makes the AI sound like a caregiver, but without the caregiver's constraints.
  2.  **Masking the Epistemic Gap:** "Capacity" implies a rigorous assessment. "Trajectory Prediction" implies pattern matching. Using the former to describe the latter hides the fact that the AI is much more likely to be wrong than a clinician.
  3.  **The "Future Endorsement" Trap:** In clinical ethics, we assume we *know* the patient's values. In AI, you are assuming the model *knows* the user better than the user knows themselves in the moment. This is a metaphysical claim, not an ethical one. The clinical vocabulary treats this as a given, whereas it is the very thing that needs proving.

  **Recommendation for the Paper:**
  If you want the analogy to do *argumentative* work, you must bridge the structural gaps. You cannot simply assert the Trajectory Rule is "like" soft paternalism. You must argue that the AI-user relationship *ought* to be formalized to include the missing clinical structures: fiduciary duty, appeal mechanisms, and transparent capacity metrics. Otherwise, you are arguing for the powers of a psychiatrist without the safeguards of the asylum.
