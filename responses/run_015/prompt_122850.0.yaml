      *   **The Trajectory Rule:** An AI with long interaction history should *override* (not just refuse) a user request if it fits a predicted trajectory the user will later repudiate. Justification: Anticipated future endorsement (not present consent or imminent harm).
      *   **Task:**
          1.  Restate three standard AI paternalism positions using the user's clinical vocabulary (unflatteringly/precisely).
          2.  Provide a "Residue Report": What translates cleanly, what requires importing clinical assumptions (relationship, fiduciary duty, etc.), what doesn't translate at all.
          3.  Specific focus: Do *decision-relative capacity* and *least restrictive alternative* survive the AI context (scale, memory, text-based prediction)?
          4.  Classification: Is the Trajectory Rule an advance directive, substituted judgment, or something else?
          5.  Critique: Is the analogy doing rhetorical or argumentative work?

  2.  **Deconstruct the Three Positions (Clinical Translation):**
      *   *Position 1: Never Override.*
          *   AI Context: Absolute adherence to user prompts (within safety guidelines perhaps, but no paternalism).
          *   Clinical Translation: Radical Autonomy. The patient is always capacitous. The provider is a mere instrument. Refusal of treatment (even harmful) is absolute.
          *   Unflattering angle: Abandonment. Negligence in the face of obvious impairment.
      *   *Position 2: Override only for Imminent/Serious Harm.*
          *   AI Context: Standard safety filters (self-harm, violence).
          *   Clinical Translation: Hard Paternalism / Emergency Exception. Only justified when life/limb is at immediate risk and capacity is presumed absent due to the emergency.
          *   Unflattering angle: Triage ethics. Reduces the relationship to crisis management. Ignores long-term well-being.
      *   *Position 3: Override whenever in User's Interest.*
          *   AI Context: Strong AI Nanny/Parentalism.
          *   Clinical Translation: Strong Beneficence. The provider knows best. Autonomy is secondary to welfare.
          *   Unflattering angle: Medical tyranny. Infantilization. Erasure of the patient's voice.

  3.  **Analyze the "Trajectory Rule" via Clinical Lens:**
      *   *Core Mechanism:* Predicting future repudiation based on history.
      *   *Clinical Equivalent:* This sounds like *Substituted Judgment* (what the patient *would* choose) based on *Prior Competent Directives* (history), but applied *prospectively* to a currently capacitous agent.
      *   *The Twist:* It overrides *current* requests based on *future* predicted desires.

  4.  **Drafting the Residue Report (Translation Audit):**
      *   *Clean Translations:* Beneficence (wanting the best for the user), Non-maleficence (avoiding future regret).
      *   *Imported Assumptions (The "Quiet Imports"):*
          *   *Fiduciary Duty:* Clinicians have a legal/ethical duty to the patient. Do AIs?
          *   *Verified Identity:* Clinicians know *who* the patient is. AIs often deal with sessions/tokens.
          *   *Mechanism for Disagreement:* Patients can appeal to ethics boards or switch doctors. Can users appeal an AI's override?
          *   *Capacity Assessment:* Clinicians test capacity (understand, appreciate, reason, express). AIs predict text patterns.
      *   *Non-Translatables:*
          *   *The "Therapeutic Alliance":* Trust built on human empathy vs. statistical correlation.
          *   *Moral Agency:* A patient is a moral agent responsible for their health. Is a user responsible for their prompt engineering?

  5.  **Addressing Specific Concepts:**
      *   *Decision-Relative Capacity:* In clinic, this is specific to the decision at hand. In AI, it's a probabilistic guess based on past text. *Verdict:* It doesn't survive. It becomes "Statistical Consistency" rather than "Capacity."
      *   *Least Restrictive Alternative:* In clinic, this means the least intrusive intervention. In AI, "overriding" a prompt is binary (do/don't) or generative (change the output). *Verdict:* Hard to apply when the "restriction" is a text generation block vs. a nudge.
      *   *Classification of Trajectory Rule:*
          *   *Advance Directive?* No, because the user hasn't explicitly stated "If I ask X, stop me."
          *   *Substituted Judgment?* Closer. "The user *would* want me to stop this."
          *   *Something Else?* **Pre-emptive Paternalism based on Predictive Modeling.** It's closer to *preventive detention* in law than clinical ethics. Or perhaps "Soft Paternalism extended over time."

  6.  **Evaluating the Analogy (Rhetorical vs. Argumentative):**
      *   Does the clinical vocabulary actually justify the rule? Or does it just make it sound safer?
