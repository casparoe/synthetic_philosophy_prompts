prompt: |-
  Hey — I'm in a seminar right now (third-year, joint ethics/epistemology thing) and there's something I keep doing that I don't have a word for, and I don't think it's quite the thing we spent the first two weeks on. We went round and round on whether you can get a moral view just from someone telling you — the case everyone uses is you ask a friend whether eating meat is wrong, they say yes, now you believe it, and there's something fishy-feeling about that and everyone had a different story about why. But that's not my case. My case is that I go to someone about something I'm genuinely stuck on and I really don't want them to tell me what to do. What I want them to tell me is which bits of the situation matter. Concretely: my roommate borrowed my bike without asking and it came back dented. I didn't want anyone to tell me whether I was allowed to be annoyed or whether I should say something. What I wanted to know was whether it counts for anything that she'd probably have assumed I'd say yes, or that the dent was small, or that she's done it before and I never complained — like, are those the load-bearing facts here or not? Once a friend told me which of those to actually look at, I could see the answer myself, it stuck, and I could still argue for it a week later. When someone just hands me the verdict, I believe it for about a day, then it evaporates, I can't defend it, and I'd be embarassed to repeat it at dinner as my own view.

  It also happens with labels rather than facts. A friend was getting needled by her lab group and thought it was just banter; I said something like that's not banter, that's hazing, and the whole shape of what she should do changed, and it didn't feel like she'd taken my word for anything at all. And sometimes what I get given isn't features or a label but a move — ask yourself how you'd feel if you found out from someone else — and that does more work than any verdict would have. A couple of us argued about this after class and couldn't get clear on what's even being transferred.

  So: is there a name for this? Specifically for taking someone's word about which considerations are relevant, or about how to describe the situation, as opposed to taking their word about what to do. And more importantly, is it actually a different phenomenon or the same one in disguise — because whether intent matters here looks to me like a moral question too, so why doesn't deferring on that feel like the fishy case, and does the answer depend on whether I also defer on the verdict? What are the nearest established concepts and how does mine differ from each (I've heard terms floating around — moral perception, moral expertise, thick concepts, that kind of neighbourhood — but I can't tell which if any is the right one, or whether it's just a version of the thing we did in week one). And where's the edge: is it different if what I'm deferring on is a plain fact like whether he actually knew; is it different if I get the frame but still can't get myself to a verdict; is it different if the person I'm asking has no better judgment than me and just has more vocabulary? I'm not after a label or a reading list, I want the carving — what exactly is being handed over in each case, and why only one of them feels borrowed.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** Third-year seminar in joint ethics/epistemology.
      *   **Core Problem:** The user is experiencing a phenomenon distinct from the standard "testimonial injustice" or "moral testimony" debate covered in the first two weeks (which focused on deferring on *verdicts* like "eating meat is wrong").
      *   **The Phenomenon:** The user defers on *inputs* (relevant considerations, descriptions/labels, heuristic moves) rather than *outputs* (verdicts/actions).
      *   **Key Characteristics:**
          *   Deferring on relevance (which facts matter?).
          *   Deferring on description/labeling (is this banter or hazing?).
          *   Deferring on perspective-taking moves ("how would you feel if...").
          *   Result: The resulting belief is stable, defensible, and feels owned (unlike verdict-deference which feels borrowed/evaporates).
      *   **Specific Questions:**
          *   Is there a name for this?
          *   Is it distinct from standard moral testimony or the same in disguise?
          *   What are the nearest established concepts (moral perception, expertise, thick concepts)?
          *   Where are the edges (deferring on plain facts vs. frames vs. verdicts)?
          *   *Crucial Constraint:* "I'm not after a label or a reading list, I want the carving — what exactly is being handed over in each case, and why only one of them feels borrowed."

  2.  **Deconstruct the Phenomenon:**
      *   The user is describing a shift from *propositional knowledge* (knowing *that* X is wrong) to *understanding* (knowing *why* X is wrong).
      *   It involves *moral salience* (what stands out as morally relevant).
      *   It involves *conceptual competence* (applying thick concepts like "hazing" vs. "banter").
      *   It feels less "borrowed" because the cognitive work of synthesis is done by the agent, not the testifier. The testifier provides the *lens*, the agent provides the *focus*.

  3.  **Identify Relevant Philosophical Concepts:**
      *   **Moral Testimony (The Week 1-2 Topic):** Usually focuses on *verdict deference*. Pessimists (Hills, Hopkins) say it undermines moral agency/understanding. Optimists say it's just like factual testimony.
      *   **Moral Understanding (Hills, Zagzebski):** This is the big one. Alice Hills' "Moral Understanding" argues that knowing *p* isn't enough; you need to know *why p*. The user's case fits "getting the why" via help, not just getting the "that".
      *   **Moral Salience/Perception (McDowell, Dancy):** Noticing which features are relevant. This matches the "which bits matter" part of the user's query.
      *   **Thick Concepts (Williams, Putnam):** Concepts that are both descriptive and evaluative (e.g., "cruel," "hazing"). Applying these changes the landscape.
      *   **Framing/Reframing:** Not strictly a standard ethics term, but relevant in epistemology of disagreement and cognitive science.
      *   **Epistemic Dependence vs. Cognitive Extension:** Relying on someone as a tool vs. a source.

  4.  **Drafting the "Carving" (The Core Analysis):**
      *   I need to distinguish the *content* of the deference.
      *   *Case A (Week 1-2):* Deference on **Verdict**. Input: "Is meat wrong?" Output: "Yes." Cognitive state: Belief without Understanding. Feeling: Borrowed.
      *   *Case B (User's Case):* Deference on **Salience/Frame**. Input: "Here's the situation." Output: "Look at *this* feature" or "Call this *hazing*." Cognitive state: Understanding via Guided Perception. Feeling: Owned.
      *   *Why the difference?* In Case A, the reasoning is outsourced. In Case B, the reasoning is *scaffolded*. The user still performs the inference from salience to verdict.

  5.  **Addressing Specific Questions:**
      *   *Name:* "Scaffolded Moral Understanding" or "Deference on Salience." There isn't one canonical term, but "Moral Understanding" (Hills) is the closest heavyweight concept.
      *   *Distinct or Disguise?* Distinct. It avoids the "autonomy objection" to moral testimony because the agent retains the reasoning role.
      *   *Nearest Concepts:*
          *   *Moral Understanding:* Matches the stability/defense aspect.
          *   *Moral Salience:* Matches the "which bits matter" aspect.
          *   *Thick Concepts:* Matches the "banter vs. hazing" aspect.
      *   *Edges:*
          *   Plain fact ("Did she know?"): Epistemic deference, usually fine.
          *   Frame but no verdict: Still understanding, just indeterminate.
          *   Vocabulary vs. Judgment: If it's just vocab, it's linguistic. If it's judgment on relevance, it's moral expertise.

  6.  **Refining the Tone:**
      *   The user is a third-year student. They know the jargon but want precision.
      *   Avoid condescension.
      *   Avoid just dumping names (per the prompt: "not after a label or a reading list").
      *   Focus on the *mechanism* of the epistemic transfer.
      *   Use their examples (bike, hazing).

  7.  **Structure of the Response:**
      *   **Validation:** Acknowledge this is a sharp distinction often missed in intro seminars.
      *   **The Carving (The "What"):** Distinguish *Verdict Deference* vs. *Salience/Frame Deference*.
      *   **Why one feels borrowed:** The locus of cognitive labor (Reasoning vs. Perception).
      *   **Conceptual Mapping:** Connect to Moral Understanding (Hills), Salience (McDowell/Dancy), and Thick Concepts.
      *   **The Edge Cases:** Address the specific boundary questions (plain facts, vocabulary, etc.).
      *   **Conclusion:** Summarize the mechanism.

  8.  **Self-Correction/Nuance Check:**
      *   *Wait, is it just "advice"?* No, advice is usually verdictive ("You should do X"). This is perceptual guidance.
      *   *Is it "Socratic"?* Sort of, but the friend *tells* you the relevant feature, they don't just ask questions. It's testimonial but non-verdictive.
      *   *Hills' Objection:* Alice Hills argues you can't get moral understanding from testimony. Does this user's case refute Hills? Or is it a loophole? It suggests you *can* get understanding from testimony if the testimony targets salience rather than truth-conditions of the moral claim. I should mention this tension.
      *   *Terminology:* "Moral Testimony" usually covers all of this. I need to be careful to distinguish *Verdictive Testimony* from *Non-Verdictive Testimony*.
      *   *Key Insight:* The user is describing **Epistemic Scaffolding**. The friend acts as a cognitive tool, not an authority.

  9.  **Final Polish:** Ensure the distinction between "transferring belief" and "transferring capacity to see" is clear. This is the heart of the "carving."

  **(Self-Correction during drafting):** I initially thought about suggesting "Virtue Epistemology." But that's too broad. Stick to the specific mechanics of *what* is believed. The user wants to know *what is being handed over*.
  *   Handover 1: A conclusion. (Borrowed)
  *   Handover 2: A lens. (Owned)
  *   Handover 3: A fact. (Neutral)

  Let's build the response around this "Conclusion vs. Lens vs. Fact" triad.

  10. **Final Review against constraints:**
      *   No reading list? Check.
      *   Want the carving? Check.
      *   Address edge cases? Check.
      *   Address why it feels different? Check.

