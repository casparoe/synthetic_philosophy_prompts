  To definitively discriminate between **Continuous Existence** and **Constitutive Materialism** in her framework, I propose the following case:

  **The "Gradual Total Replacement" Case:**
  > A painting is found to be chemically unstable. To save it, conservators devise a process to replace the pigment and canvas molecules one-by-one with chemically identical *new* molecules. The process takes ten years. At no point is the painting removed from display, declared "destroyed," or ceased to be viewed as the artwork. Eventually, 100% of the original matter is replaced.

  *   **If she rules this an Original:** It confirms **Continuous Existence** is the sole driver (she accepted 70% in Case 2; 100% with unbroken display should also pass). This would further cement that the Resurrection Case is a Replica *only* because of the break in continuity, not the material source.
  *   **If she rules this a Replica:** It reveals a hidden **Material Threshold** (perhaps 70% is the limit). This would suggest her verdict on the Resurrection Case might actually be ambiguous or dependent on whether "recovered matter" counts toward a quota of originality, complicating the Continuity reading.

  Given her settled judgment on the 70% restoration, the former (Original) is the consistent extension of her view, proving that for her, *history beats matter*, and therefore the Resurrection Case (broken history) must fail.
