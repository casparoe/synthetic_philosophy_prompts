  ### Competing Principles

  Two principles organize the professor's earlier judgments, yielding conflicting predictions for the resurrection case:

  **1. The Principle of Continuous Spatiotemporal Existence (Continuity)**
  *   **Definition:** An artwork is a historical individual whose identity depends on an unbroken chain of existence through time. Conservation (Case 2) preserves this chain even with significant material loss; destruction (Case 4) breaks it irrevocably.
  *   **Prediction for Resurrection:** **Replica.** The fire reduced the painting to ashes, terminating its existence. The reassembly is a new genesis, breaking the spatiotemporal continuity required for original status.

  **2. The Principle of Constitutive Material Provenance (Materialism)**
  *   **Definition:** An artwork's identity is grounded in its specific physical constituents originating from the artist's generative context. New materials (Case 1, Case 4) create copies; original materials (Case 2, Case 3) sustain authenticity.
  *   **Prediction for Resurrection:** **Original.** Every atom is the original matter selected and arranged by the artist (originally) and recovered from the work. The "ship of Theseus" is rebuilt with the original planks; therefore, it is the original ship.

