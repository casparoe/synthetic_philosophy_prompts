      *   *Argument:* For the philosophical argument to land hardest, Deckard *must* be a replicant. If he's human, the "empathy test" is a human judging a machine. If he's a replicant, it's a machine judging a machine, or a machine realizing it's a machine.
      *   *Decision:* Argue Deckard is a replicant. It strengthens the Goodmanian critique of "originality." It collapses the distinction between hunter and hunted, original and copy.

  7.  **Drafting the Response (Iterative Process):**

