prompt: |-
  Hey so I've been retired from the lab about five years now and I've been trying to read some philosphy in my spare time. I ran across this idea about fakes and originals -- there's this philosopher Nelson Goodman who talks about autographic arts versus allographic ones, and he thinks forgery only really matters for the first kind. Anyway I just rewatched Blade Runner (the original, not the sequal) and it hit me that the replicants are basically forgeries of human beings, except the movie also makes you care about them like they're real people. So I'd like you to read Blade Runner through Goodman's distinction and the bigger question of whether an original has value just for being original. Do the replicants count as forgeries in Goodman's sense? Does the film take a position on whether Roy Batty's implanted memories make him less real than a human with real ones? And where does the idea fall apart -- like maybe a human with false memories is also a kind of forgery? I want a reading that takes both the movie and the philosophy seriously, not just using the film to illustrate the idea. You can point to that origami unicorn scene near the end and tell me what it suggests about replication versus originality, but don't quote the movie verbatim since I can't check the script right now. Also there's that ambiguity about whether Deckard is a replicant himself -- is that too speculative or does it actually matter for the argument? Anyway take a stance if you can, don't just say it's ambiguous. I definatly think there's something here about memory and identity but I'm not sure what.
