  2.  **Deconstruct Goodman's Framework:**
      *   *Autographic Arts:* The history of production matters. A painting is autographic. Even a perfect physical copy is a forgery if it doesn't have the right history of production (provenance). Forgery is aesthetically relevant here.
      *   *Allographic Arts:* The history of production doesn't matter, only compliance with a notation/script. A play or symphony is allographic. If you perform the notes correctly, it's genuine, regardless of who wrote it down or when. Forgery is impossible here (you can't forge a performance of *Hamlet* if you perform the text correctly).
      *   *The Crux:* Goodman argues forgery matters because we value the *history of production* in autographic works. We value the "original touch."

  3.  **Apply to *Blade Runner* (Replicants as Forgeries?):**
      *   *Initial thought:* Replicants look like humans. Are they forgeries?
      *   *Goodman lens:* If being human is autographic (biology/history matters), then replicants are forgeries. If being human is allographic (function/behavior matters), then they are genuine instances of "personhood."
      *   *Problem:* Humans aren't art objects. But the *value* placed on them functions similarly. The Tyrell Corporation treats them as products (allographic/manufactured), but society treats them as threats to the "original" human status (autographic).
      *   *Verdict:* Replicants are *ontological* forgeries in the eyes of the world, but the film argues this distinction is morally irrelevant.

  4.  **Analyze Memory and Identity (Roy Batty/Rachel):**
