prompt: |-
  I serve on my high school’s District Ethics Board for Student-Run Philanthropy, where three students and one faculty advisor meet twice a month to approve grants under five thousand dollars; we have about twenty minutes per proposal, no philosophy background is assumed among reviewers, and any step that is irreducibly a value judgment must be flagged for the advisor’s sign-off rather than masked as technical. Because our charter now requires us to justify allocations between local community programs and international relief, I need a reusable decision procedure that translates the philosophical debate over whether compatriots have special moral claims—versus cosmopolitan impartiality—into an ordered audit my board can actually run, with explicit stop rules, hard cases, and honest markers of where judgment cannot be eliminated. The procedure should include a “moral-lottery filter” that asks whether a nationality-based priority depends solely on birth location with no further institutional reciprocity, and an “institutional co-authorship audit” that checks whether beneficiaries share in the tax, legal, or democratic structures that generate the obligation; please apply it to three proposals: (1) a winter heating subsidy for low-income families in our district; (2) emergency medical supplies for a refugee camp abroad facing an outbreak; and (3) a heritage-language preservation program restricted to citizens, where the board is likely to feel sympathy but the procedure may deliver an unwelcome answer. In your response, separate what is broadly settled in the debate—such as the universal weight of severe basic-need deprivation—from what remains genuinely contested among philosophers who study associative duties and global justice, and do not present any contested view, including the claim that shared nationality by itself generates a weighty special obligation, as the consensus position. Finally, state clearly what the procedure cannot settle, such as the precise threshold at which cultural preservation counts as a basic need or how to weigh distant suffering against local identity, and flag those nodes as requiring explicit value judgment rather than algorithmic resolution.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**

      *   **Context:** High School District Ethics Board for Student-Run Philanthropy (3 students, 1 faculty advisor).
      *   **Constraints:** Meets twice a month, approves grants < $5k, ~20 mins/proposal, no philosophy background assumed.
      *   **Requirement:** A reusable decision procedure (audit) to justify allocations between local vs. international causes.
      *   **Core Philosophical Tension:** Compatriot Priority (Special Obligations) vs. Cosmopolitan Impartiality (Universal Obligations).
      *   **Specific Tools Required:**
          *   "Moral-Lottery Filter" (Is priority based *only* on birth location?).
          *   "Institutional Co-Authorship Audit" (Do beneficiaries share tax/legal/democratic structures?).
          *   Explicit stop rules, hard cases, and markers for value judgments (flagged for advisor sign-off).
      *   **Application:** Apply to three specific proposals:
          1.  Local winter heating subsidy.
          2.  International refugee medical supplies (outbreak).
          3.  Local heritage-language preservation (citizens only).
      *   **Philosophical Accuracy:** Distinguish between settled consensus (e.g., severe basic needs matter) and contested views (e.g., does nationality *itself* create obligation?). Do *not* present compatriot priority as consensus.
      *   **Limitations:** Clearly state what the procedure *cannot* settle (thresholds, weighing suffering vs. identity) and flag these for explicit value judgment.

  2.  **Deconstruct the Philosophical Landscape:**

      *   *Settled/Strong Consensus:* Severe deprivation (starvation, death, preventable disease) creates a strong moral claim regardless of borders. Basic needs usually trump non-basic needs.
      *   *Contested:* Does shared nationality create a *special* obligation that overrides or outweighs distant basic needs? (Associative Duties vs. Cosmopolitanism). Is "culture" a basic need?
      *   *The "Moral Lottery":* The idea that birthplace is morally arbitrary (Nagel, Rawls, etc.).
      *   *Institutional Reciprocity:* The idea that obligations arise from shared cooperative schemes (Rawls, Sangiovanni).

  3.  **Drafting the Decision Procedure (The "Audit"):**

      *   *Goal:* Make it actionable for high schoolers in 20 minutes.
      *   *Structure:* Step-by-step flow with "Stop/Flag" points.
      *   *Step 1: Triage (Basic Needs).* This is the closest to consensus. If life/death is at stake, it gets high priority.
      *   *Step 2: The Moral-Lottery Filter.* Check if the exclusion is arbitrary.
      *   *Step 3: Institutional Co-Authorship.* Check for reciprocity/structural ties.
      *   *Step 4: The Weighting (The Hard Part).* This is where the judgment flag goes.
      *   *Advisor Sign-off:* Any step requiring a philosophical stance on the contested issues must go to the advisor.

  4.  **Applying the Procedure to the Three Proposals:**

      *   *Proposal 1 (Heating):* Basic need (warmth/safety). Local. Institutional tie (taxes/district). *Result:* Strong candidate, but needs to pass the "is this more important than death abroad?" test.
      *   *Proposal 2 (Refugee Meds):* Basic need (life/disease). International. No institutional tie. *Result:* High urgency due to basic need, fails co-authorship but passes triage.
      *   *Proposal 3 (Language):* Cultural need (debatable if "basic"). Local/Citizen only. *Result:* Fails Moral-Lottery Filter (citizenship restriction). Likely requires Advisor Flag on whether culture = basic need.

  5.  **Refining the Philosophical Nuance:**

      *   *Crucial:* I must not say "Local is better." I must say "Philosophers disagree on whether local is better *unless* basic needs are involved."
      *   *Consensus:* Severe suffering matters everywhere.
      *   *Contested:* Whether a fellow citizen's *moderate* need outweighs a stranger's *severe* need. Whether cultural preservation is a duty of justice or supererogatory.
      *   *Flagging:* The procedure must explicitly say "We cannot calculate this; we must vote/decide based on values."

  6.  **Developing the Content (Iterative Drafting):**

      *   *Introduction:* Acknowledge the board's constraints and the ethical weight.
      *   *The Procedure:* Name it something clear (e.g., "The Reciprocity and Need Audit").
      *   *The Filters:* Define the "Moral-Lottery" and "Co-Authorship" clearly.
      *   *The Application:* Walk through the three cases honestly.
      *   *The Limitations:* Be humble about what a checklist can do.

      *(Self-Correction during drafting)*: I initially thought about giving a score. *Correction:* No, the prompt asks for an "ordered audit" with "stop rules" and "flags," not a utilitarian calculator. It needs to highlight *where* the judgment happens, not hide it.
      *(Self-Correction on Proposal 3)*: The prompt says the board will feel sympathy but the procedure might give an unwelcome answer. I need to ensure the audit reflects that tension (Citizenship restriction triggers the Moral-Lottery Filter).

  7.  **Final Review against Constraints:**

      *   20 mins/proposal feasible? Yes, if steps are concise.
      *   No philosophy background? Yes, language must be plain.
      *   Advisor sign-off on value judgments? Yes, built into the "Flag" system.
      *   Distinguish settled vs. contested? Yes, in the preamble and analysis.
      *   Three specific proposals analyzed? Yes.
      *   Moral-Lottery & Co-Authorship included? Yes.

  8.  **Final Polish:** Ensure tone is respectful to the students' role but rigorous about the ethics. (Proceed to generate output).

      *Key check on the "Consensus" instruction:* I must explicitly state that *compatriot priority is NOT consensus*. Many philosophers argue borders are morally arbitrary. I need to make sure the procedure doesn't bake in a bias toward local causes unless justified by institutional reciprocity.

      *Key check on "Value Judgment Flags":* These need to be distinct visual markers in the text so the students know when to stop and call the advisor.

      *Key check on Proposal 3:* This is the "unwelcome answer" case. The audit should likely flag the citizenship restriction as ethically suspect under the Moral-Lottery Filter, requiring the Advisor to approve the exception based on a specific value claim (e.g., "Cultural continuity is a specific duty of this district").

  9.  **Constructing the Output:** (Mental Outline)
      *   Preamble: Scope & Philosophical Status (Settled vs. Contested).
      *   The Procedure (The Audit): Steps 1-4 with Flags.
      *   Application to Cases 1, 2, 3.
      *   Limitations & Advisor Role.

      *(Drafting the "Moral-Lottery Filter")*: Question: "Is the only reason we help Group A over Group B that Group A was born here?" If Yes -> Flag.
      *(Drafting the "Co-Authorship Audit")*: Question: "Do we share a tax/legal system that creates mutual obligation?" If Yes -> Weight increases.

      *(Refining the "Unwelcome Answer" for Case 3)*: If the procedure says "No" because it fails the lottery filter and isn't a basic need, but the board wants to say "Yes," that is a Value Judgment Flag.

      *(Final Polish of the "Settled vs. Contested" section)*: Ensure I cite the distinction between *humanitarian urgency* (settled) and *associative duty* (contested).

      *Let's write it.*
answer: |-
  ### Preamble: Philosophical Status Report for the Board

  Before using the procedure below, the Board must understand the ethical landscape. This prevents us from mistaking a controversial opinion for a factual rule.

  **1. Broadly Settled (Consensus)**
  *   **The Weight of Severe Deprivation:** There is strong philosophical agreement that preventing death, severe physical suffering, or preventable disease creates a moral claim that transcends borders. A stranger's life is not worth less than a neighbor's life *in the abstract*.
  *   **Arbitrariness of Birth:** There is consensus that "moral lottery" (where one is born) is morally arbitrary. Using birthplace *alone* to justify priority requires justification.

  **2. Genuinely Contested (No Consensus)**
  *   **Associative Duties:** Philosophers disagree on whether shared nationality *itself* generates a special obligation that outweighs distant basic needs. Some argue shared institutions create reciprocity; others argue this is merely collective selfishness.
  *   **Cultural Preservation:** It is contested whether preserving language or heritage counts as a "basic need" comparable to food or medicine, or if it is a secondary good that must yield to humanitarian relief.
  *   **The Threshold:** There is no algorithmic agreement on how much local comfort outweighs distant survival.

  ***

  ### The Reciprocity and Need Audit (RNA)
  **Time Limit:** 15 Minutes (Leaves 5 mins for discussion/vote)
  **Purpose:** To structure the debate, not to automate the verdict.
  **Rule:** Any step marked **[FLAG FOR ADVISOR]** requires the Faculty Advisor to sign off that the Board is making a value judgment, not a technical calculation.

  #### Step 1: The Triage Filter (Basic Needs)
  *Does the proposal address immediate threats to life, physical safety, or preventable disease?*
  *   **Yes:** Proceed to Step 2. (Note: This carries high moral weight regardless of location.)
  *   **No:** Proceed to Step 2. (Note: This lowers the urgency priority relative to life-saving aid.)

  #### Step 2: The Moral-Lottery Filter
  *If we reject this proposal in favor of one elsewhere (or vice versa), is the deciding factor solely that the beneficiaries were born within our district/national borders?*
  *   **Yes:** **[FLAG FOR ADVISOR]**. This relies on the contested claim that birthplace creates priority. The Board must explicitly state: "We are prioritizing location over impartial need."
  *   **No:** (e.g., priority is based on institutional ties, reciprocity, or severity of need). Proceed to Step 3.

  #### Step 3: The Institutional Co-Authorship Audit
  *Do the beneficiaries share in the specific tax, legal, or democratic structures that generate the funds we are allocating?*
  *   **Yes:** (e.g., District taxpayers funding District residents). This establishes a claim of **Reciprocity**.
  *   **No:** (e.g., District taxpayers funding foreign nationals). This establishes a claim of **Humanitarian Aid**.
  *   **Action:** If "No," check if the proposal acknowledges this distinction. We cannot mask humanitarian aid as an institutional obligation.

  #### Step 4: The Hard Case Weighing
  *If comparing a Local Non-Basic Need vs. a Distant Basic Need:*
  *   **[FLAG FOR ADVISOR]**. There is no philosophical consensus on this trade-off. The Board must vote based on stated values (e.g., "We prioritize our community's cultural cohesion" vs. "We prioritize minimizing global suffering").

  ***

  ### Application to Current Proposals

  #### Proposal 1: Winter Heating Subsidy (Local Low-Income Families)
  *   **Step 1 (Triage):** **Yes.** Lack of heat in winter poses physical safety/health risks.
  *   **Step 2 (Lottery):** **No.** Priority is based on residence within the tax district, not merely birth.
  *   **Step 3 (Co-Authorship):** **Yes.** Beneficiaries are part of the district's tax/legal structure.
  *   **Audit Result:** **Strong Candidate.**
  *   **Reasoning:** This satisfies the "Reciprocity" model. The obligation is generated by shared institutional structures (taxes/district), not just arbitrary birth. It also meets the "Basic Need" consensus.
  *   **Advisor Sign-off:** Not required unless funds are so limited that funding this causes a preventable death abroad (see Proposal 2).

  #### Proposal 2: Emergency Medical Supplies (Refugee Camp Abroad)
  *   **Step 1 (Triage):** **Yes.** Outbreak/medical emergency involves life/death.
  *   **Step 2 (Lottery):** **N/A.** (This is the international option).
  *   **Step 3 (Co-Authorship):** **No.** Refugees do not share our tax/democratic structures.
  *   **Audit Result:** **High Urgency / Low Reciprocity.**
  *   **Reasoning:** This triggers the **Settled Consensus** on severe deprivation. Even without institutional ties, the severity of the need creates a moral claim.
  *   **Conflict:** If the Board must choose between Proposal 1 and Proposal 2, you enter **Step 4 (Hard Case Weighing)**.
  *   **[FLAG FOR ADVISOR]:** Choosing heating (local safety) over medicine (distant survival) cannot be justified by "rules." It is a value judgment. The Board must explicitly vote: "We prioritize local institutional reciprocity over maximal global harm reduction." The Advisor must record this justification.

  #### Proposal 3: Heritage-Language Preservation (Citizens Only)
  *   **Step 1 (Triage):** **No.** Language loss is cultural, not an immediate threat to life/physical safety.
  *   **Step 2 (Lottery):** **Yes.** The restriction is "Citizens Only."
  *   **[FLAG FOR ADVISOR]:** This restriction relies on the contested view that citizenship *itself* warrants exclusion of non-citizens from cultural funds, absent institutional reciprocity.
  *   **Step 3 (Co-Authorship):** **Partial.** Citizens share legal status, but does this generate a duty to fund language specifically?
  *   **Audit Result:** **Ethically Fragile.**
  *   **Reasoning:** This proposal is likely to generate sympathy, but the Audit reveals it fails the "Basic Need" triage and triggers the "Moral-Lottery" flag. It prioritizes identity over survival.
  *   **Required Justification:** To approve this over Proposal 2 (Refugee Meds), the Board cannot say "It helps our community." They must say: "We judge cultural continuity to be a higher priority than distant medical relief."
  *   **Advisor Sign-off:** **Mandatory.** The Advisor must confirm the Board understands they are prioritizing a contested value (cultural identity) over a settled consensus (preventing disease/death).

  ***

  ### Limitations and Advisor Mandate

  This procedure is an audit tool, not a moral calculator. It cannot resolve the following nodes. These **must** be flagged for explicit Board discussion and Advisor sign-off:

  1.  **The Threshold of "Need":** The procedure distinguishes "Basic" from "Non-Basic," but philosophy does not agree on where culture ends and need begins. Is language essential for mental health? If the Board argues "Yes," this is a value claim, not a fact.
  2.  **The Exchange Rate of Suffering:** The procedure cannot calculate how many local cultural programs equal one foreign life saved. This is the core of the Cosmopolitan vs. Compatriot debate.
  3.  **Institutional Boundaries:** The "Co-Authorship Audit" assumes our district boundaries are morally relevant. A strict cosmopolitan would argue they are not. If the Board accepts district boundaries as morally decisive, that is a political choice, not an ethical derivation.

  **Advisor Instruction:** When a **[FLAG FOR ADVISOR]** is triggered, do not resolve the debate. Instead, require the student reviewers to write one sentence stating the value they are prioritizing (e.g., "We prioritize reciprocity over urgency"). This ensures the value judgment is visible, not masked as procedure.
