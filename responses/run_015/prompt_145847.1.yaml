      *(Refining the "Base + Derived" point)*: In logic, derived fluents are defined by axioms. In probability, "derived" variables are deterministic functions of base variables. If the base is continuous, the derived is continuous. If the base updates, the derived *must* update. The explosion is in tracking *which* derived variables depend on the changed base. This is exactly the same as the logical ramification problem. I need to make sure this distinction is clear.

