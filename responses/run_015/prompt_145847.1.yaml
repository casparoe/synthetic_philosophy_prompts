answer: |-
  Here is the direct answer: **No, continuous state spaces do not dissolve the frame problem, and partitioning beliefs into base and derived variables does not solve the explosion; it merely relocates the computational burden to the maintenance of the dependency graph.**

  The frame problem is not an artifact of discrete logic or binary fluents. It is a structural problem about **relevance** and **independence** in high-dimensional systems. When you move to probabilistic continuous spaces, the problem transforms from "which propositions remain true?" to "which marginal distributions and conditional independencies remain invariant?" This is often computationally harder, not easier.

  Here is the step-by-step breakdown of why the structural failure recurs, grounded in the update logic of belief states.

  ### 1. The Structural Core: Inertia as Independence
  In the classic discrete formulation, the frame problem arises because an action $A$ changes fluent $f_1$, but to formally represent that $f_2 \dots f_n$ do not change, you need $O(N)$ frame axioms.
  *   **Gut Level:** You have to explicitly list everything that *didn't* break.
  *   **Formal Bone:** The transition function is underspecified regarding non-effects.

  In the probabilistic continuous setting, let the state be $x \in \mathbb{R}^n$. Your belief is a density $p_t(x)$. An action $u$ induces a transition kernel $T(x_{t+1} \mid x_t, u)$.
  The prediction step (Chapman-Kolmogorov) is:
  $$ p_{t+1}(x') = \int T(x' \mid x, u) p_t(x) \, dx $$

  **The Frame Problem here is the specification of $T$.**
  If action $u$ is intended to affect only dimension $x_1$, the kernel must factorize:
  $$ T(x' \mid x, u) = T_1(x'_1 \mid x_1, u) \cdot \prod_{i=2}^n \delta(x'_i - x_i) $$
  (Or, more realistically, a narrow noise distribution centered on $x_i$).

  To assert this factorization is to assert **conditional independence**. You are claiming that $x'_1 \perp x'_{-1} \mid x, u$. In a dense, continuous physical world, this independence is almost never strictly true. Moving a robot arm ($x_1$) vibrates the floor ($x_2$), shifts the center of mass ($x_3$), and changes battery load ($x_4$).

  **The Recurrence:** To solve the frame problem, you must assert sparsity in the transition kernel. In discrete logic, you write frame axioms. In continuous probability, you must assert a sparse **Jacobian** or a sparse **Precision Matrix** (inverse covariance). Constructing and verifying that sparsity structure requires the same $O(N)$ reasoning about irrelevance. If you cannot certify that $\frac{\partial x'_i}{\partial x_1} \approx 0$ for all $i \neq 1$, you must integrate over the full joint density, which is exponentially expensive in $n$.

  ### 2. The Update Logic: Why Measure Zero Doesn't Help
  You raised the possibility that continuous spaces might dissolve the problem via measure-zero considerations (i.e., exact equality is rare, so we don't need to frame it). This is a category error regarding what beliefs represent.

  We do not track point masses; we track **support**.
  1.  **Discrete:** $P$ is True. After Action $A$, is $P$ still True?
  2.  **Continuous:** $p(x_i)$ has mean $\mu_i$ and variance $\sigma^2_i$. After Action $A$, does $p(x_i)$ remain invariant?

  Even if the probability of $x_i$ remaining *exactly* the same value is zero (due to continuous noise), the **distributional parameters** must remain invariant for the frame problem to be "solved."
  *   If I slide a cup ($x_1$), the distribution of the table's structural integrity ($x_2$) should not broaden.
  *   If my belief update mechanism couples $x_1$ and $x_2$ (e.g., via a full covariance matrix $\Sigma$), updating the mean of $x_1$ forces an update on the conditional mean of $x_2$, even if the physical causal link is negligible.

  **The Formal Bone:**
  In a Gaussian belief update (Kalman Filter), the update step involves the Kalman Gain $K = \Sigma H^T (H \Sigma H^T + R)^{-1}$.
  If $\Sigma$ is dense (representing correlations between all state variables), computing $K$ is $O(n^3)$.
  To avoid this, you must assume $\Sigma$ is sparse or block-diagonal. **Asserting that sparsity is the frame problem.** You are asserting that the correlation between the cup's position and the table's integrity is zero. If you are wrong (if there is a hidden common cause), your belief state becomes inconsistent. If you are cautious and keep the correlation, you suffer the computational explosion.

  ### 3. The "Base + Derived" Illusion
  You asked whether carving beliefs into an explicit base plus derived extensions solves the explosion.
  *   **Logic:** Base fluents $B$, Derived fluents $D$ where $d \in D \iff \phi_d(B)$.
  *   **Probability:** Latent variables $z$, Observed/Derived variables $x$ where $x = g(z) + \epsilon$.

  **Why this fails to solve the problem:**
  This partition shifts the burden from the *state representation* to the *dependency graph*.
  1.  **The Ramification Problem:** When a base variable $z_1$ updates, you must propagate that update to all derived variables $x_i$ that depend on $z_1$.
  2.  **The Graph Maintenance:** In a continuous, stochastic world, dependencies are rarely functional ($x = g(z)$). They are probabilistic ($p(x \mid z)$).
  3.  **The Explosion:** To know which derived variables to update, you must traverse the Bayesian Network or Factor Graph. In a rich environment, the graph is dense. A change in "room temperature" (base) might probabilistically affect "battery efficiency" (derived), "metal expansion" (derived), and "human comfort" (derived).

  **Relocation of Burden:**
  You haven't eliminated the $O(N)$ update cost; you have hidden it in the **message passing** algorithm over the graph.
  *   If the graph is static, you pay the cost once to compile it.
  *   But in open environments, the *structure* of dependencies changes. (e.g., The cup is on the table [dependent]; I pick up the cup [independent]).
  *   Updating the **graph topology** (who depends on whom) is isomorphic to the original frame problem. You need "frame axioms" for the graph edges themselves.

  ### 4. Bounded Reasoning and Logical Omniscience
  Coming from the rationalist literature, you recognize that logical omniscience assumes an agent knows all consequences of their beliefs. The frame problem is the practical manifestation of the impossibility of omniscience.

  In the continuous probabilistic case, **Probabilistic Omniscience** would require the agent to maintain the full joint density $p(x_1, \dots, x_n)$.
  *   **Bounded Reasoning Solution:** We use approximations (Mean Field, Variational Inference, Particle Filters).
  *   **The Catch:** These approximations **assume** the frame solution.
      *   Mean Field assumes $p(x) \approx \prod q_i(x_i)$. This is an explicit assumption of independence (a frame axiom).
      *   Particle Filters ignore dimensions that don't affect the likelihood. This is a heuristic relevance filter.

  If the approximation assumes independence where there is coupling (a frame error), the belief state diverges from reality. The "structural failure" you suspect is precisely this: **Any tractable belief update algorithm must assume a frame solution (sparsity/independence) to function.** It cannot derive the frame solution from first principles without incurring the intractability it seeks to avoid.

  ### 5. Summary Verdict
  Your premise is correct: the discrete-state framing obscures the deeper issue, but moving to continuous spaces does not fix it.

  1.  **Invariance:** The problem persists as the **Conditional Independence Problem**. Specifying what does *not* change is equivalent to specifying which entries in the transition Jacobian or Covariance matrix are zero.
  2.  **Severity:** It is arguably more severe in continuous spaces because "unchanged" means "distributionally invariant," which is a stronger condition than truth-value preservation. Small couplings (noise) accumulate, requiring constant justification of independence assumptions.
  3.  **Base/Derived Partition:** This does not escape the difficulty. It relocates the explosion to the maintenance of the dependency graph (the "causal frame"). Updating the graph topology requires the same relevance reasoning as updating the state values.
  4.  **Measure Zero:** This does not dissolve the problem. We care about the support and moments of distributions, not point values. Invariance of support requires explicit specification.

  **The Gut-Level Takeaway:**
  The frame problem is the tax you pay for living in a world where everything *could* be connected to everything else. To act efficiently, you must pretend the world is modular. The "problem" is that justifying that modularity requires looking at the whole world, which defeats the purpose. Probability and continuity give you more tools to approximate the modularity (e.g., via correlation thresholds), but they do not remove the fundamental need to assert relevance. You are still writing frame axioms; you are just writing them as sparsity priors on covariance matrices.
