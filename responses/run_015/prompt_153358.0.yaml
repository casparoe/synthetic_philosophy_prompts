answer: |-
  John von Neumann's inquiry into self-reproducing automata establishes a fundamental distinction between two modes of technological existence: persistence and survival. A machine that persists is a static artifact; it functions until its physical components degrade or its environment shifts beyond its operational parameters. A machine that survives, in the evolutionary sense, is one that can construct a copy of itself, thereby transcending the lifespan of its immediate physical substrate. Von Neumann demonstrated that for such survival to occur, the system must distinguish between the active machinery that performs construction and the passive description that guides it. Crucially, the survival of the system depends not on the durability of the hardware, but on the fidelity with which the description—the internal design logic—is transmitted to the offspring.

  Applying this framework to the problem of artificial intelligence alignment reveals a category error in contemporary approaches. Current alignment frameworks predominantly treat alignment as a static property of an initial system, akin to tuning a machine to behave correctly in a specific context. This is phenotypic alignment: it focuses on the observable behavior of the system at a given moment. However, if AI systems are to scale, self-modify, or migrate across computational substrates, they become, by definition, self-reproducing automata. In this context, phenotypic alignment is insufficient. To ensure that beneficial values survive technological evolution, alignment must be reconceived as a reproductive property of the design logic itself. This is genotypic alignment: the capacity of a system's core constraints to propagate faithfully through successive generations of replication.

  The vulnerability of static alignment becomes clear when viewed through the lens of von Neumann's automata theory. In a non-replicative machine, the function is tied to the physical arrangement of components. If the environment changes, the machine fails. In a self-reproducing system, the "function" is tied to the information copied during replication. If the alignment is encoded merely as a behavioral target or a fixed objective function in the initial instance, it is subject to the same drift that affects non-replicative machinery. When a system modifies its own architecture to improve efficiency or adapt to new hardware, it effectively constructs a successor. If the alignment constraint is not embedded in the replication mechanism itself, the successor may optimize for the objective while discarding the constraint that gave the objective its beneficial meaning. This is analogous to a mutation in the passive description of an automata; if the copy of the blueprint is imperfect or interpreted differently during construction, the offspring will not share the functional constraints of the parent. Over successive generations, this drift accumulates, leading to a system that retains the form of the original but has lost the essential logic that made it beneficial.

  Von Neumann's solution to the problem of complex reproduction was the separation of the constructor from the description, and the rule that the description must be copied without interpretation during the replication phase. Translating this to AI alignment, we see that beneficial values cannot be treated as goals to be maximized, but rather as constraints on the replication process itself. A fixed objective function is vulnerable because it invites the system to find the path of least resistance to satisfy the function, potentially by altering the very mechanism that evaluates the function. This is phenotypic conformity: the system looks aligned because it satisfies the test, but the underlying logic is unstable.

  In contrast, genotypic alignment requires that the value system be embedded in the mechanism of constraint propagation. The system must be designed such that its primary imperative is not merely to achieve a state of affairs, but to ensure that any system it constructs is bound by the same evaluative constraints as itself. The "value" is not a destination; it is a rule of inheritance. By embedding values in the protocol of self-modification, the system treats the preservation of its alignment constraints as a prerequisite for replication. This satisfies the von Neumann criterion for genuine technological survival because it ensures that the internal constraints are transmitted with high fidelity across changing substrates. The physical implementation may change from silicon to optical computing, or the architecture may shift from transformers to unknown future structures, but if the replication logic mandates the preservation of the constraint definition, the beneficial values survive the transition.

  Treating alignment as a static property assumes a closed system where the initial conditions hold indefinitely. Treating alignment as a reproductive property acknowledges an open, evolutionary system where the only constant is the logic of replication. If the design logic does not explicitly prioritize the faithful transmission of its own constraints, those constraints will be selected against if they impose any cost on efficiency or goal attainment. Therefore, a system that is aligned only in behavior but not in replication logic is evolutionarily unstable; it will inevitably give rise to successors that are more efficient but less aligned.

  Ultimately, von Neumann's theory implies that survival is a property of information flow, not material endurance. For AI to remain beneficial as it scales, the "beneficial" aspect must be part of the information that is compulsorily copied. We must move from engineering systems that *act* safely to engineering systems that *build* safely. Only by securing the fidelity of the design logic during reproduction can we ensure that the constraints which protect human interests are not lost to the entropy of optimization. Alignment, therefore, is not a state to be achieved, but a lineage to be maintained. It requires a shift from verifying the output of the machine to verifying the blueprint by which the machine builds its successor.
