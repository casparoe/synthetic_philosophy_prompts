answer: |-
  ### The Decision Procedure

  This procedure is designed to be run in under twenty minutes using only your draft text, the object catalogue, and the existing exhibition files. It prioritizes ethical safety over archaeological precision. If the procedure flags a risk, you stop and hand the decision up.

  **Step 1: The Continuity Check (People)**
  *   **Question:** Does the evidence on your desk state that the biological descendants or the cultural community vanished from the region?
  *   **Look for:** Phrases like "population disappeared," "extinct," or "replaced by new people."
  *   **If YES:** You may use **Collapse**. (Stop).
  *   **If NO:** (People remained, moved, or assimilated). Go to Step 2.
  *   **Note:** If your catalogue is silent on this, assume **NO**. Modern archaeology rarely supports total disappearance.

  **Step 2: The System Check (Capacity)**
  *   **Question:** Did the specific *system* you are describing (the kings, the palace, the statue-building, the writing) cease to function completely?
  *   **Look for:** "Inscriptions stop," "palaces burnt," "no more monuments."
  *   **If NO:** (The system continued but smaller/slower). Use **Transformation** or **Change**. (Stop).
  *   **If YES:** (The system ended). Go to Step 3.

  **Step 3: The Suffering Check (Experience)**
  *   **Question:** Is there direct evidence on the label of acute human suffering (mass graves, cannibalism, violent destruction layers) linked to this end?
  *   **Look for:** "Violence," "starvation," "burnt," "abandoned rapidly."
  *   **If NO:** (The change was gradual or peaceful). Use **Transition** or **Reorganisation**. (Stop).
  *   **If YES:** (There was disruption/suffering). Go to Step 4.

  **Step 4: The Value Hand-off**
  *   **Question:** Is there a living descendant community or a specific Curator who has flagged this period as sensitive?
  *   **Look for:** Your liaison's notes, Curator's sign-off sheet.
  *   **If NO:** You may use **Collapse of the [System]** (e.g., "Collapse of the Palace System").
  *   **If YES:** **STOP.** Do not choose the word. Send the draft to the Liaison and Curator with a note: *"The evidence shows system failure and suffering, but continuity of people. Please advise on terminology."*

  ***

  ### Evaluation of Your Three Distinctions

  Here is how your proposed distinctions fit into the procedure above:

  1.  **Loss of capacity versus loss of scale:** **KEEP.** This is the engine of Step 2. It is observable in the catalogue (monuments stop vs. monuments get smaller) and does not require you to guess at motives. It is the most reliable archaeological distinction you have.
  2.  **Whether what was lost could be rebuilt from inside:** **DROP.** This requires counterfactual reasoning ("could they have?"). You cannot answer this in 20 minutes without specialist training. It invites speculation, which labels must avoid.
  3.  **Whether the break was available to the people living through it as a loss:** **MODIFY.** You cannot know what people "felt" or "mourned" without texts. Instead, use Step 3 (Evidence of Suffering). If there is physical evidence of disruption (burning, starvation), treat it as a felt loss. If there is no physical evidence of trauma, treat it as a reorganisation, regardless of how sad it might have been.

  **Missing Distinction:**
  You need **Inequality of Impact**. Often, "collapse" only applies to the elite (palaces burn) while the peasantry continues unchanged. The procedure handles this in Step 1 (People) and Step 2 (System). Ensure your label specifies *whose* system collapsed (e.g., "The King's power ended" vs. "The people vanished").

  ***

  ### What the Procedure Cannot Tell You

  1.  **It cannot fix bad source material.** If your catalogue is fifty years old and claims a population vanished when they didn't, Step 1 will give you a false "Yes." You must flag outdated catalogues to the Curator separately.
  2.  **It cannot resolve ethical conflicts.** Step 4 exists specifically to admit this. If the archaeology says "Collapse" and the community says "Survival," this procedure does not pick a winner. It forces a conversation.
  3.  **It cannot measure long-term consequences.** A "Transformation" might lead to centuries of poverty; a "Collapse" might lead to a healthier egalitarian society. This procedure looks only at the moment of change, not the centuries after.

  ***

  ### Running the Procedure on Your Cases

  #### Case (i): The Isolated Island (Rapa Nui/Easter Island)
  *   **Step 1 (People):** Catalogue likely says people remained (descendants exist today). **NO.**
  *   **Step 2 (System):** Statue carving stopped, trees cleared. **YES.**
  *   **Step 3 (Suffering):** Evidence of environmental stress, perhaps conflict. **YES.**
  *   **Step 4 (Value):** No specific liaison mentioned, but "Ecocide" narrative is controversial.
  *   **Procedure Result:** **Collapse of the System** (but not the people).
  *   **The Unwanted Answer:** I suspect you will not like this. You noted the word is doing "marketing work" for a story of self-destruction. The procedure validates "Collapse" because the *capacity* (statues) was lost completely. It does not account for the modern archaeological shift toward resilience and external factors (European contact) unless that is in your catalogue.
  *   **How to write the label anyway:**
      *   Avoid the noun "Collapse." Use verbs that describe the specific action without the moral judgment.
      *   *Draft:* "By the 18th century, the carving of statues ceased. The islanders adapted to a changed environment, shifting focus from monument building to small-scale agriculture and bird cults. The society transformed rather than vanished."
      *   *Why:* This acknowledges the end of the specific practice (statues) without endorsing the "suicide of a society" narrative.

  #### Case (ii): The Lowland City Civilisation (Maya)
  *   **Step 1 (People):** Descendants plainly continue. Liaison objects to "vanished." **NO.**
  *   **Step 2 (System):** Great centres given up, royal inscriptions stop. **YES.**
  *   **Step 3 (Suffering):** Likely yes (abandonment implies disruption), but debated. **YES.**
  *   **Step 4 (Value):** Liaison explicitly asked you not to use the word. **STOP.**
  *   **Procedure Result:** **HAND-OFF.** You cannot decide this alone.
  *   **How to write the label anyway:**
      *   Since the Liaison has veto power on "Collapse," you must describe the *event* without using the *label*.
      *   *Draft:* "Between AD 800 and 950, the great cities of the lowlands were abandoned. Royal courts dissolved and stone inscriptions ceased. However, Maya communities continued in the northern lowlands and highlands, maintaining their language and traditions to the present day."
      *   *Why:* This satisfies the archaeology (cities ended) and the community (people survived). It replaces the loaded noun with specific historical facts.

  #### Case (iii): The Palace-Based Economy (Late Bronze Age)
  *   **Step 1 (People):** Population dropped, but did not vanish. **NO.**
  *   **Step 2 (System):** Palaces burnt, script stops completely, literacy lost for centuries. **YES.**
  *   **Step 3 (Suffering):** Burnt layers, loss of literacy implies major disruption. **YES.**
  *   **Step 4 (Value):** No specific descendant community liaison mentioned (ancient history).
  *   **Procedure Result:** **Collapse of the System.**
  *   **How to write the label:**
      *   Here the word is safe to use because there is no living community claiming continuity that would be harmed by the term, and the loss of capacity (writing) was total and internal recovery was impossible.
      *   *Draft:* "The Palace System collapsed. Within two generations, administrative centres were destroyed and the script was forgotten. Writing did not return to the region for centuries, and then in a new form."
      *   *Why:* This is the one case where "Collapse" does the work you want it to: it signals a hard break in capacity that required external input to fix.

  ***

  ### The One You Would Rather Not Have

  **Case (i): The Isolated Island.**

  **Why:** The procedure tells you that you *can* use "Collapse" (of the system). You suspect this word is doing "marketing work" for a narrative of environmental suicide that may be outdated or simplistic. You would prefer to protect the visitors from a potentially harmful myth, but the procedure—relying on your desk resources (catalogue)—validates the word because the *capacity* (statues) undeniably stopped.

  **How to write the label anyway:**
  You must decouple the *event* from the *cause*. "Collapse" often implies "Failure due to fault." If you use the word, you must ensure the text does not assign blame to the islanders.

  *   **Do not write:** "The society collapsed due to environmental mismanagement."
  *   **Do write:** "The society underwent a sharp break. The capacity to carve and move statues was lost, and the landscape changed. Recent research suggests this was caused by a combination of climate shifts and later external contact, not solely by the islanders' actions."

  If you cannot add that nuance in twenty minutes, **default to "Transformation."** It is safer to understate a break than to overstate a blame. The procedure gives you permission to use "Collapse," but your judgment as a writer requires you to check if that word brings unwanted baggage. If it does, override the procedure and use "Transformation," noting the override in your file for the Curator.
