  6.  **Identify the Single Best Revision:**
      *   The root of the anxiety in (e) comes from trying to link the *explanatory* status of computation (a) with the *ontological* status of consciousness (d).
      *   If computation is just explanatory (a), then consciousness depending on it (d) makes consciousness dependent on our *choice of explanation*. That's absurd.
