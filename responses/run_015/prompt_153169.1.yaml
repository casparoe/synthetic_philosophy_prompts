      *   **Address the Captain/Deluded Protector:** Distinguish between "prudential ought" (best given evidence) and "moral/wholesome ought" (karmically skillful). Acknowledge the tragedy of the situation. The captain acts unwholesome *karmically* even if socially necessary. This is the tension the user points out, but I need to frame it not as a defeat for my view, but as a feature of the samsaric condition.
      *   **Core Distinction:** Morality (sila) is about the agent's liberation and harmlessness, not state-of-affairs optimization.
      *   **Concession:** Admit that from a societal governance perspective, outcomes matter more. But from the perspective of *liberation* and *kamma*, intention is king.
      *   **Constraint Check:** No karma transfer. No consequentialist concession on rightness. 2-3 paragraphs. End with a question.

  3.  **Drafting the Response:**

      *   *Paragraph 1: The Karma-meter.* You assume the goal of morality is to produce good external states. I assume the goal is to cease suffering by purifying the mind. A karma-meter tells me if I am poisoning myself, not if the wall will stand. If I punch a wall, the wall breaks (outcome), but my hand hurts (karmic result). The meter tells me my hand will hurt. It doesn't tell me whether the wall *should* be broken. You say outcomes guide action; I say wisdom guides action, and wisdom sees that harming life always springs from aversion or delusion, regardless of the body count saved.

      *   *Paragraph 2: The Captain.* This is the hard case, and I won't smooth it over. The captain faces a tragic conflict between his duty to protect (compassion) and the precept against killing (non-harming). If he kills based on careless belief, there is delusion. If he kills to stop a perceived threat, there is aversion toward the threat. So, karmically, it is unwholesome. You say he "ought" to have done it. I distinguish: he ought to have done it *if his goal was maximizing survival*, but he ought not to have done it *if his goal was maintaining a mind free of killing*. In samsara, these sometimes clash. I concede that for a king or a general, outcome-based reasoning is unavoidable. But for a moral agent seeking liberation, the karmic ledger *is* the action's rightness, because the action is primarily an expression of will, not a mechanical cause of external results.

      *   *Paragraph 3: The Deluded Protector & Question.* Regarding the deluded protector: sincerity does not make delusion wholesome. A mother who smothers a child believing she saves it from demons acts from love mixed with deep delusion. The karmic fruit is bitter, even if the heart was warm. You suggest this means the mind must track the world to be wholesome. I say the mind must see *phenomena* as they are (impermanent, not-self) to be wholesome. Tracking conventional reality is useful, but not the definition of wisdom. If morality were about tracking external states, then a lucky mistake would be virtuous, and a well-intentioned failure would be sin. I reject that. My question to you is this: if two agents perform the exact same physical movement, one intending to heal and one intending to harm, but both accidentally save a life, do you truly believe they have done the exact same moral act?

