      *   Refine the Karma-meter: The user says "nobody... would hand a decision... to a karma-meter." I should argue that actually, a bodhisattva *does* consult something like that (wisdom regarding roots) rather than just outcomes.
      *   Make sure I don't sound like I'm saying consequences don't matter *at all*, just that they don't define *moral quality*. They matter for compassion, but not for sila/kamma definition.

      *   *Revision on Paragraph 1:* You treat the karma-meter as a decision engine for worldly welfare, but I treat it as a diagnostic for spiritual health. If I ask, "Should I take this medicine?" the outcome ledger matters. If I ask, "Should I take this life?" the karma ledger matters. You say we wouldn't hand a decision to the meter; I say a monastic precisely does hand life-and-death decisions to the assessment of their own roots. We would rather fail to save a hundred lives than cultivate the root of killing, because we see the saving of lives as temporary relief, but the rooting out of aversion as final cure.

      *   *Revision on Paragraph 2:* The captain case is painful. I grant you that from the perspective of the merchants' families, the outcome is what counts. But from the perspective of the captain's liberation, the act is a wound. You say he "ought" to have done it. I must distinguish the 'ought' of social utility from the 'ought' of karmic hygiene. If he kills carelessly, delusion is present. If he kills to stop violence, aversion is present. It is unwholesome. I do not deny the tragedy that sometimes protecting others requires staining one's own mind. This is why the bodhisattva path is long and hard; it is not that consequences are irrelevant, but that we cannot use good consequences to wash away the blood on the mind.

