answer: |-
  You assume that the primary function of morality is to optimize states of affairs in the world, so naturally, a tool that measures internal states seems useless for decision-making. But I assume the primary function of morality is to cease suffering by purifying the mind, so a tool that measures internal states is the only one that matters. If I ask whether a wall should be knocked down, I consult an engineer; if I ask whether I should be the one to knock it down, I consult my intention. You say nobody would hand a decision to a karma-meter, but a monastic precisely does hand life-and-death decisions to the assessment of their own roots. We would rather fail to save a hundred lives than cultivate the root of killing, because we see the saving of lives as temporary relief within samsara, but the rooting out of aversion as the only final cure. The meter doesn't tell me what the world will look like; it tells me who I am becoming, and for me, that is the only ledger that defines the act.

  The case of the captain is painful, and I will not smooth over the tension you have found. From the perspective of the merchants' families, the outcome is what counts, and I concede that for a king or a general governing a state, outcome-based reasoning is unavoidable. But from the perspective of the captain's liberation, the act is a wound. You say he "ought" to have done it. I must distinguish the 'ought' of social utility from the 'ought' of karmic hygiene. If he kills carelessly, delusion is present; if he kills to stop violence, aversion is present. It is unwholesome. I do not deny the tragedy that sometimes protecting others requires staining one's own mind, but I deny that the necessity of the protection makes the stain vanish. The bodhisattva may accept this stain out of compassion, but they accept it as a burden of suffering, not as a virtuous deed in itself.

  On the deluded protector, warmth does not neutralize delusion. If morality were about tracking the world, then a lucky guess would be virtuous, and a well-intentioned failure would be sin. But if I give poison thinking it is medicine, my intention was to heal, yet my delusion caused harm. The karmic weight falls on the delusion, not the accidental outcome. You ask me to choose between calling the mind wholesome or admitting it must track reality to be moral. I choose neither. I say the mind is unwholesome because it is deluded, regardless of the outcome. The tracking of reality is wisdom, not morality, though they intertwine. Here is my question for you: if consequences determine the rightness of the act, does the moral value of your action change retroactively if new information arrives ten years later showing the outcome was different than expected?
