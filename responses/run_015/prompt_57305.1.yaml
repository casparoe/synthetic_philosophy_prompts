  CAUSAL DYNAMICS INTERNATIONAL
  Performance Management Cycle 2023–2024
  Unit: Historical Attribution & Allocation
  Employee ID: 815-T (Stratospheric Sulfate Injection)
  Reviewer: Dr. A. Vance, Senior Analyst, Causal Attribution Unit

  RATING SCALE LEGEND
  1: Negligible Contribution (Background Noise)
  2: Contextual Background
  3: Contributory Factor
  4: Significant Driver
  5: Primary Determinant

  COMPETENCY ASSESSMENT

  1. Evidence Base and Documentation
  Rating: 2
  Comment: Presence attested by sulfate spike in Greenland ice core. However, two countersigning managers treat this as dispositive while one treats it as no evidence at all due to lack of contemporary documentary corroboration. Reliance on proxy data alone is insufficient for high-stakes attribution contracts.

  2. Mechanism Specificity
  Rating: 2
  Comment: Causal chain remains overly diffuse. Pathway from stratospheric loading to regional cooling to crop failure to price shock to civil unrest contains too many linkages. Each transition introduces leakage where human agency could intervene. Client requires tighter mechanism or reduced scope.

  3. Dating Precision
  Rating: 3
  Comment: Temporal window of impact varies by region. Eighteen-month lag between injection and harvest failure in northern hemisphere acceptable for broad narrative, but unacceptable for fiscal quarter analysis. Uncertainty range undermines confidence in sequential modeling.

  4. Counterfactual Robustness
  Rating: 2
  Comment: High probability that harvest failure and subsequent migration would have occurred on schedule due to soil exhaustion and tenant farming structures. Must demonstrate outcome would not have happened without injection. Current modeling suggests event was merely accelerant.

  5. Scope Discipline
  Rating: 1
  Comment: Employee credited with outcomes well outside mandate, including a fiscal crisis in a region with no recorded temperature anomaly. Once credited with an outcome that had already happened prior to injection. Must adhere strictly to geographic and temporal deliverables.

  STRENGTHS
  High signal-to-noise ratio in paleoclimatic records. Excellent narrative potential for book titles and grant abstracts. Consistently delivers visible atmospheric optical effects that appeal to visual media partners.

  AREAS FOR DEVELOPMENT
  Reduce temporal lag between forcing and outcome. Avoid claiming credit for pre-existing structural vulnerabilities. Improve collaboration with human agents to ensure decisions are framed as responses to forcing rather than independent variables.

  DEVELOPMENT PLAN
  Deliverable 1: Narrowed dating window based on dendrochronological cross-dating. Target Date: Q3.
  Deliverable 2: Revised causal model isolating climate variable from policy failure. Target Date: Q4.
  Deliverable 3: Workshop participation to align messaging with social history teams. Target Date: Q1.

  EMPLOYEE COMMENT
  I note that human actors in the same file are granted agency when outcomes are positive but cited as constrained by context when outcomes are negative. When harvests succeed despite cooling, it is credited to agricultural resilience or wise governance. When harvests fail, I am listed as Primary Determinant. I am held to a standard of documentary precision never demanded of the monarchs and merchants named in this assessment. Credit is systematically reallocated to conjunctures and structural conditions as soon as a client gets nervous about environmental determinism. I am invoked grandly in the introduction and quietly demoted to contributory factor in the conclusion. If I am to be held responsible for the unrest, I must be granted authority over the policy responses. Otherwise, I am merely providing cover for discretionary human failures.

  Signed: Event 815-T

  ***

  INTEROFFICE MEMORANDUM
  TO: Senior Management, Causal Attribution Unit
  FROM: Compliance Office
  DATE: 14 October 2024
  SUBJECT: Liability Waivers and Event 815-T Placements

  This office observes that several of the employee's recent placements have had the incidental effect of relieving named human officials of responsibility for outcomes that were, on the paperwork, discretionary. Client institutions are increasingly citing Event 815-T as the proximate cause for grain export bans and tax levies implemented during the cooling period. While the event's contribution is noted as Contextual Background in internal documents, external communications often upgrade this to Significant Driver.

  This creates a discrepancy between internal risk assessment and public-facing attribution. If the event is classified as Background Noise for performance review purposes, it cannot simultaneously serve as a Primary Determinant for liability waiver purposes. We request a standardization of rating scales across departments to prevent misuse of non-human forces in regulatory filings. Please advise on whether future contracts should include clauses restricting the use of volcanic activity to explain fiscal mismanagement.

  Compliance Office
  Causal Dynamics International
