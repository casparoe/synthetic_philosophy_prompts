  I was arguing with my roommate last night about whether I'm technically 'tall' since I'm 5'11" which is like the exact statistical border for my gender, and it spiraled into me reading about vagueness. Now I'm kind of stuck between epistemicism and supervaluationism, but I want to compare a few more options before I settle on anything. Could you rank these five approachs to the sorites paradox and borderline cases in tiers (S-tier down to F-tier) based on how well they preserve our everyday willingness to say 'there's no fact of the matter' without collapsing into total linguistic chaos?

