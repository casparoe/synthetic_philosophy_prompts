  If your scientist delays publication because she believes the utilitarian calculus demands it, then yes, she has allowed an external system to colonize her agency. That is one thought too many. But if she hesitates because she cares about the vulnerable people her truth will harm, that is not noise; that is her humanity speaking. You worry about the purity of the measurement protocol. I worry about the purity of the agent's life. You are extending the objection to epistemic roles, which is permissible, but only if you do not reduce the scientist to a thermometer. Integrity is not about clean data; it is about owning your actions.

  The constitutive nature of the commitment does not survive. The husband's relationship to his wife is part of what makes him *him*. It is a ground project defining his identity. The scientist's commitment to 'the signal' is a professional function, not necessarily a core component of her personal identity. My loss is existential; yours is procedural. You worry about the corruption of a role; I worry about the corruption of a person. A scientist can resign; a husband cannot cease being a husband without ceasing to be that particular person.

  Instruments lack integrity; people do not. If you say scientists must ignore consequences, you make me a deontologist. I am not one. Consequences matter, but moral theory shouldn't dictate your thoughts. If she delays because *she* decides, that is responsibility. If she delays because 'the calculus' says so, she is lost. Do not sanctify truth-telling as a rule. Use my idea to protect the human behind the lab coat from being swallowed by the system.
