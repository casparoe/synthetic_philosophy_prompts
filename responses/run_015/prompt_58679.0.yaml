answer: |-
  # Workshop Plan: The Admissions Paradox
  **Topic:** Collective Reasoning and Aggregation  
  **Duration:** 80 Minutes  
  **Participants:** 16 Adults (Non-specialists)  
  **Facilitator Goal:** Demonstrate the Discursive Dilemma (Doctrinal Paradox) through experience before theory.

  ---

  ## 1. Materials Preparation

  **A. Confidential Role Cards (16 Total)**
  Print and cut these cards. Distribute them randomly as participants enter. Instruct participants **not** to show their card to anyone.
  *   **Type A (4 Cards):** "You believe the Candidate is **Qualified** (YES) AND Capacity is **Available** (YES). Therefore, you vote to **Admit** (YES)."
  *   **Type B (6 Cards):** "You believe the Candidate is **Qualified** (YES) BUT Capacity is **NOT Available** (NO). Therefore, you vote to **Reject** (NO)."
  *   **Type C (6 Cards):** "You believe the Candidate is **NOT Qualified** (NO) BUT Capacity is **Available** (YES). Therefore, you vote to **Reject** (NO)."

  **B. Ballot Papers (2 per participant)**
  *   **Ballot 1 (Direct Verdict):**
      *   *Question:* Should the candidate be admitted?
      *   [ ] YES [ ] NO
  *   **Ballot 2 (Criteria Verdict):**
      *   *Question 1:* Is the candidate Qualified on merit? [ ] YES [ ] NO
      *   *Question 2:* Is there sufficient capacity? [ ] YES [ ] NO
      *   *(Note: Do not ask for a final admission vote on this ballot; it will be derived.)*

  **C. Whiteboard/Flipchart**
  Pre-draw three columns for tabulation:
  1.  **Direct Vote** (Admit Yes / Admit No)
  2.  **Premise Vote** (Qualified Yes / No)
  3.  **Premise Vote** (Capacity Yes / No)

  ---

  ## 2. Step-by-Step Procedure (0:00 – 0:40)

  ### Phase 1: Context & Rules (5 Minutes)
  1.  **Welcome:** Briefly state the goal: "We are simulating a committee decision to understand how groups make choices."
  2.  **The Rule:** Write on the board: **ADMISSION RULE: Admit IF AND ONLY IF (Qualified AND Capacity).**
  3.  **Confidentiality:** Emphasize strictly: "Your role card represents your private judgment. Do not discuss your card or your votes with neighbors until the debrief. This only works if judgments remain private."

  ### Phase 2: Round 1 – Conclusion-Based Voting (10 Minutes)
  1.  **Distribute Ballot 1.**
  2.  **Instruction:** "Vote based on your role card's final conclusion. Should the candidate be admitted?"
  3.  **Collection:** Collect ballots in a box.
  4.  **Tabulation (Public):** Count aloud.
      *   *Expected Result:* 4 YES, 12 NO.
      *   *Record:* Write "Group Verdict 1: REJECT" on the board.
  5.  **Pause:** Do not explain the result yet. Simply note it.

  ### Phase 3: Round 2 – Premise-Based Voting (10 Minutes)
  1.  **Distribute Ballot 2.**
  2.  **Instruction:** "Forget the final admission for a moment. Vote strictly on the two criteria based on your role card."
      *   "Question 1: Is the candidate Qualified?"
      *   "Question 2: Is there Capacity?"
  3.  **Collection:** Collect ballots.
  4.  **Tabulation (Public):** Count aloud for each question separately.
      *   *Qualified:* 10 YES (Types A+B), 6 NO (Type C). -> **Majority: YES**
      *   *Capacity:* 10 YES (Types A+C), 6 NO (Type B). -> **Majority: YES**
  5.  **Derivation:** Apply the **Admission Rule** to the *group's* majority votes.
      *   Facilitator: "The group says Qualified is YES. The group says Capacity is YES. According to our rule (Yes AND Yes = Admit), the Group Verdict 2 must be..."
      *   *Record:* Write "Group Verdict 2: ADMIT" on the board.

  ### Phase 4: The Reveal (5 Minutes)
  1.  **Highlight the Contradiction:** Point to the board.
      *   "Verdict 1 (Direct Vote): REJECT."
      *   "Verdict 2 (Derived from Criteria): ADMIT."
  2.  **Check Individual Consistency:** Ask the room: "Did any individual violate the logic rule? Did anyone vote Yes on both criteria but No on admission (or vice versa)?"
      *   *Answer:* No. Every individual was logically consistent.
  3.  **The Hook:** "How can a group of perfectly logical individuals produce a logically inconsistent group outcome? We will discuss this now."

  ---

  ## 3. Debrief & Theory Connection (0:40 – 1:15)

  ### Step 1: Naming the Phenomenon (5 Minutes)
  *   **Identify:** Reveal that this is known as the **Discursive Dilemma** (or Doctrinal Paradox).
  *   **Define:** It occurs when logically connected propositions are voted on separately, and the collective judgments become inconsistent despite individual consistency.

  ### Step 2: Aggregation Procedures (15 Minutes)
  Guide the participants to label the two methods they just used.
  *   **Conclusion-Based Procedure (CBP):** (Round 1)
      *   *Mechanism:* Vote directly on the final outcome. Ignore the reasons.
      *   *Pros:* Respects the majority will on the bottom line.
      *   *Cons:* Ignores the reasons; might admit an unqualified candidate if the logic isn't checked.
  *   **Premise-Based Procedure (PBP):** (Round 2)
      *   *Mechanism:* Vote on the reasons (premises), then apply logic to determine the outcome.
      *   *Pros:* Ensures collective rationality; decisions are reason-driven.
      *   *Cons:* Can override the majority's direct will on the outcome (as seen today: 12 people wanted to reject, but the logic forced an admission).

  ### Step 3: Discussion Questions (15 Minutes)
  *   "Which verdict feels more 'democratic' to you: the one 12 people voted for (Reject), or the one supported by the majority reasons (Admit)?"
  *   "If this were a court case, which method would you prefer? If it were a legislature?"
  *   "Does this suggest that 'the will of the people' is a single thing, or does it depend on *how* we ask the question?"

  ---

  ## 4. Facilitation Problems & Remedies

  | Problem | Risk | Remedy |
  | :--- | :--- | :--- |
  | **Collusion/Chatting** | Participants compare cards, realizing the distribution. This ruins the "private judgment" simulation. | **Seating:** Arrange chairs in a circle with space. **Script:** "This exercise relies on privacy. If you discuss your card, the data is invalid." Monitor closely during voting. |
  | **Logic Confusion** | Participants misunderstand the "IF AND ONLY IF" rule (e.g., thinking Capacity alone is enough). | **Visual Aid:** Keep the rule **Admit $\iff$ Qualified $\land$ Capacity** on the board throughout. Check for understanding before Round 1. |
  | **Tabulation Error** | Miscounting votes live can confuse the paradox. | **Preparation:** Have a co-facilitator count silently while you count aloud, or pre-count the ballots yourself before the session to ensure the 4/6/6 split was achieved. |
  | **Cynicism** | Participants feel the exercise is "rigged" or mathematical trickery. | **Framing:** Acknowledge the setup. "This is a specific scenario designed to reveal a structural tension, not to trick you. In real life, these distributions happen naturally." |

  ---

  ## 5. Theoretical Caveat: The Impossibility Simplification

  **Time:** Last 5 Minutes (1:15 – 1:20)

  **Facilitator Script:**
  "We have seen that two common voting methods produced a contradiction. You might wonder: *Can we just design a better voting system to fix this?*

  This is where we must be careful about what this exercise proves versus what mathematical theory proves.

  **The Simplification:**
  This exercise demonstrates an **existence proof**. It shows that *there exists* a scenario where standard voting methods fail to preserve collective rationality.

  **The General Impossibility Result (List & Pettit Theorem):**
  The actual theorem is much stronger and more troubling. It proves that **no** aggregation method exists that can simultaneously satisfy a set of basic democratic conditions (such as treating all voters equally, treating all issues equally, and guaranteeing logical consistency) for **all possible** patterns of individual views.

  **What we simplified:**
  In this workshop, we fixed the agenda (Qualified + Capacity $\to$ Admit) and showed a specific profile of votes that breaks the system. The general theorem states that you cannot design a 'perfect' system that works for *every* possible profile of votes on *any* connected agenda. We showed a crack in the wall; the theorem proves the wall cannot be built without cracks."

  **Closing:**
  "Thank you. Please fill out your feedback forms on the way out."
