      *   Must explain *why* the inconsistency matters (collective rationality).
      *   Must name the phenomenon (Discursive Dilemma / Doctrinal Paradox).

  6.  **Addressing Facilitation Problems:**
      *   Problem: Participants chatting and revealing roles. -> Remedy: Seating arrangements, strict silence rule.
      *   Problem: Participants questioning the logic ($P \land Q$). -> Remedy: Pre-brief the logic rule clearly.
      *   Problem: Tabulation errors. -> Remedy: Use a helper or pre-count.

  7.  **Addressing the Impossibility Simplification:**
      *   Arrow's Theorem or List & Pettit's Theorem involves infinite profiles or specific conditions (Universal Domain, etc.).
      *   The simplification here is fixing the profile (the specific distribution of views) rather than showing it holds for *any* profile satisfying certain conditions. Or, more accurately, the exercise assumes a specific logical structure ($P \land Q \to R$) and shows a contradiction, whereas general impossibility theorems prove that *no* aggregation function can satisfy a set of normative conditions for *all* possible profiles.
      *   *Selection:* The exercise demonstrates a *possibility* of inconsistency (existence proof), whereas the general theorem demonstrates the *inevitability* of inconsistency (or dictatorship) across *all* possible aggregation rules under certain conditions. I need to state that this exercise shows *one case* where it breaks, not that *all* voting systems always break. Actually, the List & Pettit theorem says no procedure satisfies all conditions. The simplification is usually that we assume the "Universal Domain" is represented by this one specific distribution.
