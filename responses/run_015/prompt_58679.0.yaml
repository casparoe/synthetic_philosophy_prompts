      *   **Specific Scenario:** Admissions case (Admit iff Qualified AND Capacity).
      *   **Distribution:** Majorities favor each criterion separately, but a majority opposes admission (this creates the paradox).
      *   **Requirements:**
          *   Step-by-step procedure.
          *   Ballot materials.
          *   Tabulation method.
          *   Debrief connecting stages to premise-based vs. conclusion-based aggregation.
          *   Likely facilitation problems + remedies.
          *   Identify one central aspect of general impossibility results that is simplified (and must be stated).
      *   **Constraint:** Do *not* name or explain the phenomenon before the exercise.

  2.  **Deconstruct the Logic (The Discursive Dilemma):**
      *   Proposition $P$: Candidate is Qualified.
      *   Proposition $Q$: Capacity is Available.
      *   Conclusion $R$: Admit Candidate ($R \iff P \land Q$).
      *   Goal: Majority says Yes to $P$, Majority says Yes to $Q$, but Majority says No to $R$.
      *   Math check for 16 people:
          *   Need $>8$ for $P$ (Yes). Let's say 10 Yes, 6 No.
          *   Need $>8$ for $Q$ (Yes). Let's say 10 Yes, 6 No.
          *   Need $>8$ for $R$ (No). Let's say 10 No, 6 Yes.
          *   Individual consistency: Each person must hold $R = P \land Q$.
          *   Let's construct the profiles:
              *   Group A (Yes/Yes/Yes): Needs to be small enough so total Yes on R is minority.
              *   Group B (Yes/No/No): Supports P, rejects Q, rejects R.
              *   Group C (No/Yes/No): Rejects P, supports Q, rejects R.
              *   Group D (No/No/No): Rejects all.
          *   To maximize the paradox:
              *   We need Majority P (Yes): Group A + Group B > 8.
              *   We need Majority Q (Yes): Group A + Group C > 8.
              *   We need Majority R (No): Group B + Group C + Group D > 8.
              *   Let's try:
                  *   Group A (Y/Y/Y): 4 people.
                  *   Group B (Y/N/N): 6 people.
                  *   Group C (N/Y/N): 6 people.
                  *   Total: 16.
                  *   Vote P (Qualified): 4 (A) + 6 (B) = 10 Yes. (Majority Yes)
                  *   Vote Q (Capacity): 4 (A) + 6 (C) = 10 Yes. (Majority Yes)
                  *   Vote R (Admit): 4 (A) = 4 Yes. 12 No. (Majority No)
                  *   Logic Check: Is $R = P \land Q$ for individuals?
                      *   A: Y & Y = Y. (Consistent)
                      *   B: Y & N = N. (Consistent)
                      *   C: N & Y = N. (Consistent)
