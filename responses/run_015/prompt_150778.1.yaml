answer: |-
  This is a sharp carving. You have identified a fault line in ideal desire theories (like those of Brandt, Smith, or Rawls) that is often papered over by the assumption of convergence.

  To answer your primary question: **No, there is no single canonical name for this specific distinction**, though it is the shadow haunting almost every discussion of "idealized preferences." It is treated as a bug in the model rather than a feature of the territory.

  However, the distinction is real, and treating it as one phenomenon is a category error. I propose we name this **The Commutativity Problem of Idealization**, and carve the two halves as **Corrective Idealization** (your Case 1) and **Constitutive Idealization** (your Case 2).

  Here is the carving you asked for, the nearest concepts, the boundary cases, and the teeth.

  ### 1. The Carving: Corrective vs. Constitutive

  The standard model of "cleaning up" desires assumes the agent is a **fixed utility function** obscured by noise (ignorance, bias, fatigue). The operation is *epistemic*: remove the noise to reveal the signal.

  Your observation is that the operation is sometimes *ontological*: the process of cleaning changes the utility function itself.

  *   **Corrective Idealization (Case 1):** Information acts as a **filter**. The agent's core evaluative stance is stable. The desire for meat was contingent on a false belief about the nature of meat. Once the belief is corrected, the desire vanishes. The "true self" was always the vegetarian; the meat-eater was a glitch.
      *   *Math:* $Preference = f(CoreValues, Beliefs)$. You fix Beliefs; CoreValues remain constant.
      *   *Relation:* Commutative. It doesn't matter the order of reflection; you arrive at the same stable point.

  *   **Constitutive Idealization (Case 2):** Information acts as a **catalyst**. The agent's core evaluative stance is plastic. The desire to continue the business is not based on a false belief; it is based on a valuation that *cannot survive* the reflection required to understand the cost. The "true self" is not revealed; it is **forged**.
      *   *Math:* $CoreValues = g(CoreValues, Experience/Reflection)$. The function updates itself.
      *   *Relation:* Non-commutative / Path-Dependent. Where you end up depends on the sequence of updates. There may be multiple local maxima (attractors).

  ### 2. Nearest Concepts and How They Miss

  You correctly dismissed *Sour Grapes* and *Weakness of Will*. Here are the concepts that are closest, and why they fail to capture the full shape.

  **A. L.A. Paul's "Transformative Experience"**
  *   **The Fit:** This is the strongest existing match for Case 2. Paul argues that some choices (becoming a parent, becoming a vampire) change the agent's epistemic and personal perspective so fundamentally that the prior self cannot assign utility to the outcome.
  *   **The Miss:** Paul focuses on *experience* (what it feels like) rather than *deliberation* (what you judge). Your Case 2 is about a man *thinking* about his business. He doesn't need to quit to know the cost; he needs to know the cost to quit. Your problem is about the **deliberative path**, not just the experiential outcome.

  **B. Endogenous Preferences (Economics)**
  *   **The Fit:** Economics acknowledges that preferences change due to consumption (addiction, habituation).
  *   **The Miss:** This is usually treated as a distortion or a constraint to be managed, not as a legitimate form of "idealization." It lacks the normative weight you are assigning to the "cleaned-up" version.

  **C. Coherent Extrapolated Volition (CEV)**
  *   **The Fit:** CEV explicitly tries to compute "what we would want if we knew more, thought faster, were more the people we wished we were."
  *   **The Miss:** CEV assumes **convergence**. It assumes that if you push reflection far enough, all paths lead to Rome. Your insight is that the landscape may have multiple peaks, and which peak you reach depends on the starting trail. CEV is a *proposal to solve* the problem by fiat; it is not an *account of* the problem.

  **D. Reflective Equilibrium (Rawls)**
  *   **The Fit:** Moving back and forth between principles and judgments until they cohere.
  *   **The Miss:** This applies to *moral principles*, not *constitutive desires*. You can have a reflective equilibrium about justice while remaining the same person. Your Case 2 implies the person themselves is the variable being equilibrated.

  ### 3. Boundary Cases

  To test whether these two halves belong together, apply the carving to these edge cases.

  **Addiction**
  *   *Standard View:* Addiction is noise (Case 1). The "clean" self wants health; the drug is a distortion.
  *   *Your Carving:* If the addiction has rewritten the neural reward structure such that the "clean" self would not recognize the values of the addicted self (and vice versa), it is Case 2.
  *   *Decision:* Mild addiction is Case 1 (obscured preference). Deep, identity-constituting addiction is Case 2. If recovery requires becoming a "different person" who no longer values the social circle of the addiction, it is Constitutive.

  **Religious Conversion**
  *   *Standard View:* Often treated as Case 1 (finally seeing the Truth).
  *   *Your Carving:* Clearly Case 2. The convert does not just have new facts; they have a new hierarchy of goods. The pre-conversion self would view the post-conversion self's values as a loss of freedom or sanity. The process does not commute; you cannot get to the converted state by just "adding facts" to the unconverted state without a rupture.

  **Child vs. Adult**
  *   *Standard View:* The adult is the "informed child."
  *   *Your Carving:* The adult is a **successor agent**. If we idealize the child's desires (Case 1), we might give them infinite candy. If we idealize via process (Case 2), we let them grow up, knowing growth will destroy the desire for candy.
  *   *Decision:* This proves they are distinct operations. Treating maturation as Corrective Idealization leads to infantilization (satisfying the child's current "true" wants). Treating it as Constitutive acknowledges the child's wants must be *superseded*, not satisfied.

  ### 4. The Teeth: Why the Distinction Matters

  You asked if this forces a real choice. It does. It dictates how you build systems that interact with human agency (AI, policy, therapy).

  **A. The Paternalism Trap**
  *   If you assume **Corrective Idealization**, you are justified in forcing information or constraints on people. "If they knew better, they would agree." You are helping them be who they already are.
  *   If you assume **Constitutive Idealization**, forcing the process is violence. You are not revealing their self; you are *replacing* their self. You cannot justify making a man quit his business by saying "the idealized you would want this," because the idealized you is a stranger to the current you.
  *   *Teeth:* In Case 1, autonomy is respected by removing ignorance. In Case 2, autonomy is respected by protecting the right *not* to undergo the transformation.

  **B. The AI Alignment Hazard**
  *   If you program an AI to maximize **Corrected Preferences**, it will act as a benevolent filter. It will hide disturbing facts if those facts cause unnecessary psychological distress without changing the "core" goal.
  *   If you program an AI to maximize **Constitutive Preferences** (CEV style), it may decide the best way to maximize your "ideal" volition is to forcibly edit your psychology to reach a higher attractor state.
  *   *Teeth:* The distinction determines whether the AI serves the *current* agent (by cleaning their view) or the *future* agent (by guiding their evolution). If the two diverge (non-commutativity), the AI must choose which master to serve.

  **C. The Definition of "Benefit"**
  *   In Case 1, benefit is **satisfaction** (getting what you really wanted).
  *   In Case 2, benefit is **coherence** or **integrity** (becoming a unified agent), even if it means abandoning what you "really wanted."
  *   *Teeth:* Policy based on Case 1 measures success by happiness metrics. Policy based on Case 2 measures success by capability or flourishing metrics, even if happiness dips during the transition.

  ### 5. Summary Definition

  If you need a label to carry this forward, I suggest:

  **The Path-Dependence of Ideal Volition**

  *   **Definition:** The phenomenon wherein the outcome of idealizing an agent's preferences depends on the sequence of information and reflection applied, due to the plasticity of the agent's core evaluative standards.
  *   **Type A (Corrective):** The agent is stable; information removes error. (Commutative).
  *   **Type B (Constitutive):** The agent is fluid; information induces transformation. (Non-commutative).

  **Verdict:** It is **two phenomena** currently masquerading as one. Conflating them leads to the error of assuming that "what you would want if you knew better" is a single, discoverable point, rather than a trajectory that might branch. The "cleaned-up person" is not always the "real person"; sometimes the "cleaned-up person" is the "successor person."
