answer: |-
  Here is a session plan designed for MA Philosophy of Language students. It leverages their background in Frege (sense/reference/context) and Austin (speech acts) to accelerate into the specific tension between Generalized (GCI) and Particularized (PCI) Conversational Implicatures.

  ### Session Title: The Calculability Problem: Grice, Defaults, and the GCI/PCI Divide

  #### 1. The Explanatory Arc

  **Phase 1: The Pre-Condition (15 mins)**
  *   **The Idea:** Before "Saying" can be separated from "Implicating," students must secure **Non-Natural Meaning ($mean_{nn}$)**.
  *   **Why:** Since they know Frege, they understand sentence meaning (sense). Since they know Austin, they understand force. Grice's innovation is *intention-recognition*.
  *   **The Hook:** Remind them that for Grice, communication is not code-transmission (Frege) nor just rule-governed action (Austin), but a **joint rational enterprise**.
  *   **Crucial Distinction:** Establish that *What is Said* is truth-conditional (disambiguated, referenced fixed), while *What is Implicated* is inferred via the assumption of cooperation.
  *   **Bridge:** If implicature is inferred via reasoning about intentions, it must be **calculable**. If it's not calculable, is it really Gricean?

  **Phase 2: The Carrying Example (20 mins)**
  *   **The Example:** **"Mark is meeting a woman this evening."**
  *   **Why this example?**
      *   It avoids the logical clean-up of the scalar "Some/All" case.
      *   It creates an immediate tension between a "default" reading and a "contextual" reading.
      *   **GCI Reading:** The woman is not his wife, mother, or sister. (Default inference).
      *   **PCI Reading:** If Mark is a Catholic priest, it implies a vow of celibacy breach. If Mark is a detective, it implies a confidential informant.
  *   **Why "Some students failed" is banned:**
      *   It obscures the *calculability* point. In "Some implies Not All," the inference looks like a logical operation ($\exists$ vs $\forall$). Students treat the Maxim of Quantity as a logical rule rather than a normative expectation of *informational efficiency*.
      *   It makes GCIs look like semantic entailments that were pruned, rather than pragmatic inferences that were generated. This hides the core problem: *Do we actually run a syllogism in our heads every time we hear "some"?*

  **Phase 3: The Misconception Sequence & Defusal (40 mins)**

  *   **Misconception 1: "Implicature is just hidden literal meaning."**
      *   *Student thought:* "Meeting a woman" literally means "Meeting a woman who isn't his wife."
      *   *Defusal:* **The Cancellation Test.** Ask: *"Mark is meeting a woman this evening; in fact, it's his wife."*
      *   *Result:* It sounds odd, but it is **not a contradiction**. If it were literal meaning (semantics), this would be $P \land \neg P$. Since it's not contradictory, the "not wife" content is not part of *what is said*.
      *   *Link to Frege:* It's not part of the *Sinn* of the sentence.

  *   **Misconception 2: "Cancelability means the speaker can deny it without consequence."**
      *   *Student thought:* Because I can cancel it, I can just say anything. The speaker is off the hook.
      *   *Defusal:* **The Coherence Constraint.** Cancellation requires a *reason* that preserves the Cooperative Principle.
      *   *Activity:* Compare:
          1.  "Mark is meeting a woman; in fact, it's his wife." (Acceptable with a shrug).
          2.  "Mark is meeting a woman; in fact, it's his wife, and I'm telling you this to waste your time." (Violates Relation/Quantity).
      *   *Point:* Cancellation isn't magic; it's a repair mechanism for when the default inference would lead to false beliefs. The speaker must signal *why* the default calculation shouldn't run.

  *   **Misconception 3 (The Core Tension): "GCIs are just fast PCIs."**
      *   *Student thought:* The "not his wife" inference is calculated the same way as the "priest scandal" inference, just quicker.
      *   *Defusal:* **The Levinson Challenge.**
      *   *Argument:* If GCIs are truly Gricean, we must be able to reconstruct the calculation: *"He said 'woman'. If it were his wife, he would have said 'wife' (Quantity). He didn't. So it's not his wife."*
      *   *The Problem:* Do we actually do this every time? Or is "woman $\rightarrow$ not wife" a lexicalized shortcut?
      *   *The Pivot:* If it's a shortcut, is it Pragmatics (Grice) or Semantics (Frege)?
      *   *Resolution for Session:* Leave it as an open wound. Classical Griceans say it's calculable (just fast). Neo-Griceans (Levinson) say it's a "default inference" (a hybrid). Post-Griceans (Relevance Theory) say calculation is always context-driven, so GCIs don't exist as a distinct category.
      *   *Goal:* Students must see that the existence of GCIs threatens the purity of the "Calculability Criterion."

  **Phase 4: What to Leave Out (10 mins)**
  *   **Formal Derivations:** Do not write out the full syllogism for PCIs (e.g., $P$ said $p$; there is no reason to think $P$ is not observing CP... $\therefore P$ implicates $q$). It turns pragmatics into logic chopping.
  *   **The Full Maxim Taxonomy:** Focus on **Quantity** and **Relation**. Manner is relevant for "woman" vs "wife," but don't get bogged down in the sub-maxims of Manner.
  *   **Neo-Gricean Formalism:** Do not introduce Horn Scales or Q/I-heuristics formally. Describe the *intuition* behind them (efficiency vs. informativeness) without the notation.

  #### 2. End-of-Session Check: The "Blocking" vs. "Cancelling" Test

  Do not ask them to identify an implicature. Ask them to diagnose a failure of calculation.

  **The Prompt:**
  > "Consider the utterance: **'John walked to the bus stop and the bus arrived.'**
  >
  > **Scenario A:** A friend asks, 'How did John's morning go?' You reply with the sentence above.
  > **Scenario B:** A logician asks, 'List two events that occurred this morning, in no particular order.' You reply with the sentence above.
  >
  > In Scenario A, the hearer infers John walked there *before* the bus arrived (GCI). In Scenario B, they do not.
  >
  > **Question:** In Scenario B, has the temporal implicature been **cancelled** or **blocked**? Explain your answer using the concept of **calculability**."

  **The Desired Answer:**
  *   **Cancelled:** The speaker adds "...but not in that order." (Requires extra linguistic effort to stop the inference).
  *   **Blocked:** The context (the logician's request) prevents the calculation from starting. The assumption of Relevance/Manner shifts.
  *   **Why this works:** If they say "Cancelled," they think implicatures are attached to the sentence. If they say "Blocked," they understand implicatures are generated by the *contextual reasoning process*. This tests if they grasp that GCIs are context-sensitive calculations, not semantic defaults.

  #### 3. Confidence and Uncertainty

  **Confidence Level: High (85%)**
  The pedagogical arc is solid. Moving from "Literal vs. Hidden" to "Cancellation" to "Calculability/Defaults" is the standard and most effective way to teach this at an MA level. The "Mark/Woman" example is robust enough to carry the weight of both GCI and PCI without the logical baggage of the Scalar "Some" case.

  **Least Sure Point: The "Blocking" vs. "Cancelling" Distinction**
  I am moderately less confident (65%) in how easily MA students will grasp the technical distinction between *blocking* (context prevents inference generation) and *cancelling* (speaker explicitly negates generated inference) in a single session.
  *   *Risk:* Students may treat them as synonymous.
  *   *Mitigation:* If they struggle, simplify the check to: *"In Scenario B, did the speaker have to add extra words to stop the time-order inference? If not, why did the inference disappear?"* This forces them to locate the source of the inference in the context, not the words.

  ### Instructor's Note on the "Calculability" Tension
  Be prepared for the pushback: *"If GCIs are automatic, why call them pragmatic?"*
  *   **Your line:** "Because they disappear in the right context (like the logician example). Semantics doesn't disappear; pragmatics does. The debate is whether 'automatic' pragmatics is still 'calculated' pragmatics."
  *   This keeps the tension live without requiring you to solve the Neo-Gricean debate for them.
