answer: |-
  You are tracking something real. It is not a convention; it is a structural feature of how human agency actually works, but it is one that traditional storytelling often flattens.

  The philosophical term for this is **Diachronic Agency** (agency stretched across time), specifically a subset often discussed under **Precommitment Strategies** or **Ulysses Contracts**. However, those terms usually imply a struggle against weakness of will (*akrasia*). Your examples are subtler: they aren't about restraining a bad impulse so much as *outsourcing the moral calculation* to a past version of the self who had the luxury of clarity.

  Since you asked for a carving and a name if one doesn't quite fit, I am going to coin a term for the literary mechanic you are using: **Moral Architecture**.

  Here is the breakdown of why your intuition is correct, where the credit lands, and why your editor is reacting the way she is.

  ### 1. The Concept: Moral Architecture
  In standard realism, we tend to treat a character's moral worth as **Synchronic**. We judge them by the heat of the moment: *Did they feel compassion right then? Did they deliberate correctly right then?*

  You are writing **Diachronic** morality. You are arguing that the "goodness" of an act can be located in the design phase of the self, not just the execution phase. The character has built a structure (a rule, a loyalty, a habit) in the past so that their future self doesn't *have* to be a hero in the moment; they just have to be a faithful employee of their past self.

  This is not "mechanical" in the pejorative sense. It is **procedural**. When a surgeon follows a checklist she wrote for herself twenty years ago, the lack of emotional turmoil in the moment isn't a bug; it's the feature. The work was done when she wrote the checklist.

  ### 2. The Carving: Where does the credit go?
  You asked specific questions about the edges of this concept. Here is how **Moral Architecture** carves them up:

  **A. Foresight: Did they foresee this exact case?**
  *   **Specific Foresight:** If the surgeon thought, *"One day I will botch a spine, and I must confess,"* the act is less virtuous. It becomes a script.
  *   **General Foresight:** If she thought, *"I am prone to cowardice when my reputation is at stake; I will bind myself to a standard of radical honesty,"* the act is *more* virtuous.
  *   **The Carving:** Credit increases when the scaffold is built for *general principles* rather than *specific scenarios*. The surgeon gets more credit for binding herself to "truth" than for binding herself to "confessing to Patient X." The former requires wisdom; the latter requires only prediction.

  **B. Rotten Reasons: Can a bad motive build a good scaffold?**
  *   Yes. This is the crime genre sweet spot. A thief might decide to stop stealing not because he loves justice, but because he's tired of looking over his shoulder.
  *   **The Carving:** If the scaffold produces good acts consistently, the *origin* of the scaffold matters less to the *outcome*, but it matters deeply to the *tragedy*. The reader credits the **discipline**, not the **motive**. We admire the thief's rigor even if his original reason was selfish. This creates a specific kind of character depth: the person who does the right thing for the wrong reason, sustained by a structure they built when they were wiser (or more cynical) than they are now.

  **C. Dependency: Would they fail without the scaffold?**
  *   This is the crux of your editor's "mechanical" note. If the character *cannot* do the right thing without the scaffold, are they virtuous?
  *   **The Carving:** In Synchronic morality (the editor's view), no. They lack "moral muscle." In Diachronic morality (your view), **yes**. Recognizing one's own weakness and building a guardrail *is* the virtue. It is the difference between a man who doesn't punch his rival because he has perfect temper control, and a man who doesn't punch his rival because he promised his dying mother he wouldn't. The second man is arguably more interesting because he acknowledges his capacity for violence and chooses to constrain it.
  *   **Credit:** The credit lands on the **act of binding**, not the **state of being bound**.

  **D. The Person vs. The Rule**
  *   In your surgeon example, the scaffold is a person ("My teacher would be ashamed"). In the thief example, it's a rule ("I put it back").
  *   **The Carving:** Scaffolds built around **relationships** (the teacher) are more fragile but more human. Scaffolds built around **rules** (the thief) are more robust but colder. If the scaffold is a person, the drama lies in whether that relationship still holds power. If the scaffold is a rule, the drama lies in whether the character respects their own past word.

  ### 3. Why the Reader (and Editor) Balks
  You asked: *Is the reader tracking something real, or just a convention?*

  They are tracking something real, but they are misinterpreting the signal.

  When you show only the moment of action (the confession, the returning of the stolen item) without the setup, the reader experiences a **Causal Gap**.
  *   **Standard Expectation:** Action should be caused by immediate motivation (guilt, love, fear).
  *   **Your Mechanic:** Action is caused by past design.

  If the reader doesn't see the design, the action looks like **roboticism**. They see a character executing code they don't understand. It feels "mechanical" because, to them, the *will* is missing from the room. The will *was* in the room, but it was there twenty years ago.

  **The Fix:** You do not need to change the mechanic. You need to signal the **provenance** of the will.
  *   In the surgeon scene: You don't need a flashback. You need a single beat where she acknowledges, *"This is the moment I built the lifeboat for."* She needs to reference the architecture *during* the execution.
  *   In the thief scene: When he puts the item back, he shouldn't feel relief for the victim. He should feel a grim satisfaction that the *system held*. *"The rule worked."*

  ### 4. Summary of the Term: Moral Architecture
  **Definition:** A character trait where the moral weight of an action is distributed across time, relying on a past decision (the architecture) to automate or compel a present action (the occupancy).

  **Distinct from Habit:** Habit is unconscious. Moral Architecture is often conscious execution of a past conscious decision. The thief *knows* he is following the rule.
  **Distinct from Duty:** Duty is usually external (law, God). Moral Architecture is internal and self-imposed.
  **Distinct from Weakness:** It admits weakness ("I know I will fail") but converts it into strength ("So I made it impossible to fail").

  **Where the Credit Lands:**
  Credit belongs to the **Continuity of Self**. It is not about who the character is *now*, but how well they have maintained the contract with who they *were*.

  **The Edge Case:**
  If the scaffold breaks (she doesn't confess; he keeps the item), the failure is not just a moral lapse; it is a **structural collapse**. This is often more dramatic than a simple temptation. It's not "I wanted it"; it's "I broke my own machine."

  ### Recommendation for the Draft
  Your editor is right that the scene reads as mechanical, but wrong about why. It reads as mechanical because the **source of the energy** is invisible.

  In literary crime, this is a powerhouse tool. It allows characters to be competent without being saintly. To fix the "mechanical" feel without sacrificing the philosophy:
  1.  **Name the Scaffold:** Have the character mentally reference the rule or the person *in the moment*. "He heard the old rule click into place."
  2.  **Validate the Cost:** Acknowledge that this method is cold. The surgeon isn't warm with regret; she's cold with precision. Let the reader feel the chill of that efficiency.
  3.  **Distribute the Praise:** Don't let the character feel proud in the moment. The pride belonged to the past self. The present self is just the laborer.

  You are writing about **integrity as a long-term project**, not a series of isolated moments. That is a harder sell in scene-work, but it is philosophically sound and psychologically acute. Keep the architecture; just let the reader see the blueprints.
