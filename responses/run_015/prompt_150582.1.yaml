  7.  **Final Polish:** Ensure the transition between ancient biography and modern effective altruism feels natural, not forced. The link is the *use of narrative for moral motivation*.

      *(Self-Correction on Conclusion)*: The prompt asks: "does biography make you better, or just make you feel like you've done the epistemic labour?" I should answer this directly. My answer will be: Mostly the latter, unless the biography is structurally designed to prevent it (like Plutarch's comparisons) *and* read with specific intent. But generally? It's moral vanity. I'll take the hard line: It is mostly vanity, but Plutarch offers the antidote within the poison.

      *Wait, let's refine.* If I say "mostly vanity," is that too dismissive of Plutarch? Plutarch explicitly wrote to prevent vanity. Let's argue that Plutarch's *method* works, but the *genre* generally fails. And EA falls into the genre failure.
