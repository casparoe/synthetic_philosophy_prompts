answer: |-
  The question of whether reading lives makes one live better is as old as the genre itself. Plutarch, in his *Parallel Lives*, posits a distinct mechanism: biography as a mirror. He suggests that by holding the lives of great men up to our own, we might calibrate our moral judgement, adjusting our conduct much as a navigator adjusts a course by the stars. Yet, your scepticism is well-founded. There is a nagging suspicion that consuming biography is a form of moral tourism—a way to purchase the feeling of virtue without the cost of action. It is the epistemic equivalent of buying gym equipment and feeling fitter simply because the credit card transaction has cleared.

  To determine whether biography genuinely improves moral reasoning or merely flatters the reader, we must first interrogate Plutarch's specific claim. He was not merely collecting anecdotes; he was engineering a comparative framework. The structure of the *Parallel Lives* is the crucial variable often ignored by modern readers who dip in and out. Plutarch does not present Demetrius or Antony in isolation. He yokes them together, Greek to Roman, to force a collision of contexts.

  Plutarch's theory of *mimesis* (imitation) is often misunderstood as simple copying. He does not expect the reader to replicate Antony's drunkenness or Demetrius's siegecraft. Rather, he invites the reader to observe the 'motion of the soul' behind the action. When he compares Demetrius and Antony, he is not asking who was better, but how their similar flaws—voluptuousness, ambition, a susceptibility to flattery—manifested in different political climates. The moral work happens in the friction between the two. If you read only Antony, you might condemn him as a decadent ruin. Read alongside Demetrius, you begin to see the structural inevitability of their downfalls. This is where the 'reference class' argument holds water. By comparing two data points rather than one, Plutarch attempts to isolate the variable of character from the variable of circumstance.

  However, this relies on the reader engaging in active comparison rather than passive consumption. The hagiography critique suggests that biography is inherently selection-biased. We read about those who survived, or those whose stories were worth telling. The narrative arc is always retrospective; the ending is known, which imbues the life with a false coherence. Real life is fragmented and boring; biography is plotted. When we read a life, we are prone to the fundamental attribution error: we attribute the subject's success to character and their failures to circumstance, while doing the reverse for ourselves. This allows the reader to sit in judgement from a position of safety. We condemn Antony's lack of discipline while sitting comfortably on our sofas, secure in the knowledge that we are not commanding legions in a civil war. This is the 'epistemic labour' illusion. We feel we have done the work of moral reasoning because we have rendered a verdict on the dead, but we have not tested that verdict against our own capacity for action.

  This brings us to the modern parallel: Effective Altruism (EA) case studies. EA attempts to strip morality of narrative fluff and replace it with data-driven calculus. Yet, it still relies on case studies to motivate action—the specific village saved, the specific donor who pivoted their career. Does this suffer the same failure mode? Arguably, it suffers more. Plutarch's *Parallel Lives* contain a tragic dimension; the heroes are often brought low by the very traits that elevated them. There is a cost to virtue in Plutarch. In modern EA case studies, the narrative is often one of optimisation and leverage. The 'hero' is the rational donor who maximises utility. This risks turning biography into a ledger of moral credits.

  If Plutarch's danger is hagiography, EA's danger is moral licensing. Reading a case study about a hyper-efficient donor can allow the reader to feel they have participated in the efficiency simply by understanding the argument. It flatters the reader's intellect rather than challenging their character. Plutarch asks, 'What would you have done in their position, knowing the cost?' EA case studies often ask, 'How can you achieve the same result with less cost?' The former probes the soul; the latter probes the wallet. Both can be vanity projects, but the EA model is more susceptible to the feeling of 'done-ness' because it quantifies the good. Once you have calculated the donation, the moral work feels complete. With Plutarch, the comparison lingers; there is no sum total at the end, only a deepening of the question.

  So, does biography make you better? The default setting of the genre is to make you feel better. It offers the frisson of high stakes without the risk. It allows for the safe condemnation of vice and the safe admiration of virtue. In this sense, most biography is indeed hagiography with better marketing. It confirms the reader's existing moral framework rather than calibrating it. We select lives that confirm our biases: the revolutionary reads Che, the stoic reads Cato. This is not moral reasoning; it is moral reinforcement.

  However, to dismiss the genre entirely is to throw out the only tool we have for testing moral intuitions against reality. Theoretical ethics is bloodless; biography provides the blood. The value lies not in the imitation, but in the *resistance* to imitation. Plutarch's *Parallel Lives* work only when the reader refuses to be comforted. When you read of Antony, and you recognise not his grandeur, but your own petty capacity for self-sabotage, the mirror functions. But this requires a reader who is willing to be implicated.

  The distinction, therefore, lies in the structural friction. Plutarch's comparative method is a defence against the hagiography trap because it prevents the reader from settling on a single英雄 (hero). By forcing the comparison, he destabilises the judgement. You cannot simply worship Antony when Demetrius is standing there with a similar record but a different cultural texture. The cognitive dissonance required to hold both lives in mind is where the moral reasoning occurs. It is mental labour, not just consumption.

  Modern case studies, conversely, often lack this friction. They are designed to convert, not to complicate. They present a problem and a solution, a villain (inefficiency) and a hero (the effective donor). This is a closed loop. It tells you what to think, whereas Plutarch shows you what happened and asks you to bear the weight of it.

  My conclusion is this: Biography, in the hands of a passive reader, is a narcotic. It creates the illusion of moral engagement while demanding nothing but attention. It is the epistemic labour you described—a feeling of work without the sweat. However, Plutarch's specific innovation—the *Parallel* structure—offers a genuine, albeit difficult, path to moral calibration. It works not by providing examples to follow, but by providing complexities to endure. It improves moral reasoning only insofar as it disrupts the reader's self-satisfaction.

  If you read a life and feel inspired, you have likely been sold a story. If you read a life and feel unsettled, unsure whether you would have acted better or worse in their shoes, and recognise your own flaws in their greatest moments, then the mirror is working. Most modern biographical consumption, including EA case studies, aims for inspiration. Plutarch, at his best, aims for unsettled recognition. Therefore, biography does not make you better by default; it makes you better only when it stops being a story about *them* and starts being a diagnosis of *you*. Without that shift, it is merely vanity, dressed in the robes of history.
