prompt: |-
  hey, been mulling over plutharc's parallel lives and whether biography actually does moral work or if it's just hagiography with better marketing. there's this old claim that comparing two lives side-by-side — say demetrius and antony — calibrates your judgement about virtue the way a reference class calibrates a forecast, but i'm sceptical. i want an essay on whether reading lives can genuinely improve moral reasoning, or whether it's always selection-biased narrative that flatters the reader. weigh plutharc's own idea of imitation, the hagiography critique, and whether modern effective-altruism case studies suffer the exact same failuer mode. reach an actual conclusion and defend it: does biography make you better, or just make you feel like you've done the epistemic labour? please write in british english and don't bother with bibliographies or citation lists — just argue it through.
reasoning: |-
  Here's a thinking process that leads to the essay:

  1.  **Analyze the Request:**
      *   **Topic:** Does reading biography (specifically Plutarch's *Parallel Lives*) improve moral reasoning, or is it just self-flattering hagiography/narrative bias?
      *   **Key Concepts to Address:** Plutarch's idea of imitation (*mimesis*), the critique of hagiography/selection bias, comparison to modern Effective Altruism (EA) case studies.
      *   **Goal:** Reach a definite conclusion and defend it (Does it make you better or just make you feel like you've done the work?).
      *   **Tone/Style:** British English, essay format, no bibliographies/citations, argumentative and analytical.
      *   **User's Stance:** Skeptical about the "calibration" claim.

  2.  **Deconstruct the Arguments:**

      *   *Plutarch's Claim:* Biography is a mirror. By looking at great men, we adjust our own conduct. The *Parallel* structure forces comparison, nuancing judgment (not just "good vs. bad," but "this kind of greatness vs. that kind"). It's about *mimesis* (imitation), not just information.
      *   *The Skeptic's Critique:* Biographies are narratives. They are curated. They suffer from survivorship bias. They often flatter the reader by allowing them to judge historical figures from a position of safety (hindsight bias). It's "moral tourism."
      *   *The Modern Parallel:* Effective Altruism uses case studies (e.g., specific charities, specific donors). Is this the same? It tries to be data-driven, but still relies on narrative framing to motivate action. Does it suffer from the same "feeling good" trap?
      *   *The Conclusion:* Needs to be nuanced but firm. It shouldn't be a flat "yes" or "no." It likely depends on *how* one reads. But the prompt asks to "reach an actual conclusion and defend it." I need to take a side, even if qualified. Let's argue that biography *can* work, but only if the reader actively resists the narrative comfort. However, the default mode is indeed self-flattery. So, the conclusion might be: *Biography is morally inert or even corrosive unless read against the grain; the 'calibration' only happens when you reject the imitation.* Or, perhaps more charitably: *It works not by imitation, but by friction.* Let's go with the idea that the *Parallel* method specifically saves it from hagiography, but modern EA case studies often fall into the trap.

  3.  **Drafting - Section by Section:**

      *   **Introduction:** Hook the reader with the Plutarchan premise. Acknowledge the skepticism. State the thesis: Biography is dangerous moral technology; it usually comforts, but Plutarch's specific comparative method offers a rare escape hatch that modern case studies often lack.
      *   **Plutarch's Mechanism:** Discuss *mimesis*. It's not about copying deeds, but catching the "motion" of the soul. The *Parallel* structure is key—it prevents simple hero worship by showing flaws in the great and virtues in the flawed.
      *   **The Hagiography Trap:** Address the selection bias. History is written by victors (or biographers with agendas). The reader feels superior judging the dead. This is the "epistemic labour" illusion.
      *   **The Modern EA Comparison:** How does EA fit? EA tries to be scientific, but relies on narratives (e.g., the story of a specific life saved). It risks becoming a secular hagiography where the donor is the hero. It lacks the *Parallel* friction.
      *   **Synthesis/Conclusion:** Does it make you better? Only if you read it as a diagnostic, not a prescription. The value isn't in the imitation, but in the *failure* to imitate comfortably. Plutarch works because he shows the cost of virtue. EA often hides the cost. Final verdict: Biography makes you better only if it disturbs you; otherwise, it's just moral vanity.

  4.  **Refining the Tone (British English):**
      *   Use spelling: *mulling, judgement, honour, programme, centre, sceptical*.
      *   Idioms/Phrasing: "Moral tourism," "epistemic labour," "stiff upper lip" (maybe too cliché, avoid), "reckoning," "virtue signalling" (careful with anachronism), "ledger."
      *   Voice: Intellectual, slightly wry, rigorous but accessible.

  5.  **Drafting - Key Arguments & Flow:**

      *   *Opening:* Start with the mirror metaphor.
      *   *Plutarch:* Focus on the *Parallel* aspect. It's not just Lives, it's *Parallel* Lives. Demetrius/Antony. The comparison creates the moral friction.
      *   *Critique:* Narrative smoothing. We judge them easily because we aren't them.
      *   *EA:* EA tries to fix the bias with data, but the *case study* is still a story. It risks "moral licensing."
      *   *Verdict:* The act of reading isn't the work. The work is the discomfort. Plutarch succeeds when he makes the hero repulsive in their greatness. EA fails when it makes the donor feel clean.
      *   *Final stance:* Biography is a tool, not a teacher. It makes you better only if you wield it aggressively against your own self-satisfaction.

  6.  **Self-Correction/Review during drafting:**
