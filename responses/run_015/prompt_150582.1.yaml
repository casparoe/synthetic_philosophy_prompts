      *   *Check:* Did I defend the conclusion? I need to make sure I don't sit on the fence. I will argue that *default* reading is vanity, but *Plutarchan* reading (comparative) has potential, whereas EA case studies are more prone to the vanity trap.
      *   *Check:* British spelling. *Sceptical, judgement, honour, programme*.
