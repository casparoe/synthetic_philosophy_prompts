      *   So, in both cases, the user chose the option with the **known probability** over the option with the **ambiguous probability**.
      *   Round 1: Known (1/3) vs. Unknown ($0$ to $2/3$). Chose Known.
      *   Round 2: Known (2/3) vs. Unknown ($1/3$ to $1$). Chose Known.
      *   **Consistency:** The behavior is consistent with a preference for *ambiguity aversion*, even if it violates probability axioms.

