      *   In Round 1: Red is "safe" (known risk). Black is "ambiguous" (unknown risk). People prefer known risk.
      *   In Round 2: Black-or-Yellow is 60 balls (known quantity total, even if split is unknown). Red-or-Yellow is 30 + unknown.
