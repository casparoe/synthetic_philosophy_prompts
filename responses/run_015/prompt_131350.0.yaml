answer: |-
  Hey everyone, welcome. Take a seat wherever.

  If you look around the room, you'll notice something pretty unusual for a philosophy workshop. Half of us are here because we spend our days arguing about definitions in dusty journals, and the other half are here because you spend your days making sure buildings don't flood or catch fire. And honestly, that's exactly why we're all here.

  We're kicking this off with a classic idea from Gilbert Ryle—the difference between "knowing-that" and "knowing-how." Usually, people hear that and think they know where the line gets drawn. They assume the philosophers in the room own the "knowing-that"—the theory, the facts, the book smarts—and that the apprentices own the "knowing-how"—the practice, the hands, the muscle memory.

  I want to be really clear: that is not what today is about. If we split the room down the middle like that, we've already failed. That view treats skill as mindless repetition, and it treats theory as useless floating. Neither side buys that, and neither side should.

  The real reason we're together is because my professor has been working on a idea that complicates this distinction in a way that benefits everyone here. She calls it "error-tolerant procedural knowledge."

  Here's the gist: We often think having a skill means executing a task perfectly, every time, without deviation. But anyone who has actually fixed a engine, wired a house, or even graded a stack of papers knows that's not what skill looks like. Things go wrong. Materials warp. Contexts shift.

  True expertise isn't about avoiding errors entirely. It's about having a specific relationship with error. It's knowing which mistakes are fatal and which ones you can work with. It's knowing when a pipe can breathe a little and when it needs to be tight. It's knowing when an argument is salvageable and when you need to start over.

  That "knowing" isn't just muscle memory. It's a normative structure. It's a deep understanding of the system you're working in. When a master electrician looks at a messy panel and knows exactly which shortcut is safe and which one is a fire hazard, that isn't just "knowing-how" in the simple sense. That is a sophisticated form of understanding that rivals any theoretical knowledge we have in the philosophy department.

  So, the distinction between "how" and "that" doesn't collapse—but it does blur. And it blurs in the space where you all live: the space of managing uncertainty.

  Our goal for this workshop is to stop treating skill as something philosophers study and tradespeople perform. Instead, we want to treat it as a shared problem. We need the philosophers to stop assuming they know what "understanding" looks like without talking to you. And we need you to know that your ability to navigate errors—to know what breaks and what bends—is data we desperately need.

  So, please, don't feel like specimens today. Feel like partners. We're here to figure out what it actually means to get things right, especially when things go wrong.

  Thanks for coming. Let's get into it.
