      *   Pedagogical/Diplomatic vs. Epistemic claim location? Yes.
      *   Inconsistency (Thinking vs. Certification)? Yes.
      *   Swap view (Evidence vs. Authority) & survival of practice? Yes.
      *   No citations? Yes.

      *Ready to write.*
answer: |-
  To reconstruct what the textbook screening practice commits you to, we must distinguish between the administrative mechanics and the epistemological framework required to make those mechanics coherent. Your friend argues the system presupposes state-certified truth; you argue it presupposes pedagogical suitability. Both are partially right, but the friction comes from how the system conflates them.

  **1. Presuppositions vs. Comfortable Fits**

  Strictly speaking, the system presupposes that **historical knowledge for minors is a distinct category from professional historical knowledge.** It assumes there is a "teachable past" that is simplified, stabilized, and socially functional, distinct from the "researched past" which is contested, fluid, and evidence-driven. This is not necessarily a claim that the state knows the *ultimate* truth, but that the state knows the *necessary* truth for social cohesion.

  What merely "fits comfortably" with this is nationalism or diplomatic appeasement. The system does not logically require a nationalist ideology; it could theoretically be used to enforce a pacifist or cosmopolitan narrative with the same mechanical rigor. However, the system *does* strictly presuppose that **objectivity is a static property of a text** that can be identified by a committee. If objectivity were a process (i.e., how the student engages with the text), screening drafts would be impossible. Therefore, the system commits you to a **positivist theory of history**: the past consists of discrete facts, some of which are "errors," and these can be sorted prior to publication.

  **2. The Epistemic Leak: Where Pedagogy Becomes Truth**

  You asked if this can be cashed out in purely pedagogical and diplomatic terms. It cannot. The leak occurs at the definition of **"Impartiality."**

  If the system were purely pedagogical, "impartiality" would mean "presenting multiple significant viewpoints to encourage critical thinking." If it were purely diplomatic, "consideration for neighbors" would be a separate, explicit political constraint (e.g., "Do not publish this to avoid a trade war").

  However, by grouping "consideration for feelings" alongside "factual error" under the umbrella of authorization criteria, the system makes a category error that reveals its epistemic claim. It treats **diplomatic friction as a type of factual inaccuracy.** It presupposes that a textbook which causes international outrage is, in a functional sense, "wrong" in the same way a textbook that gets a date wrong is "wrong."

  The exact step where the epistemic claim smuggles itself in is when the screening council decides that a contested claim (e.g., casualty numbers) is not a matter of historiographical debate, but a matter of **consensus verification.** When the council rejects a draft for deviating from the "academic consensus," they are not making a pedagogical judgment about complexity; they are making an epistemic judgment that the consensus *is* the fact. They are asserting that the boundary between "established fact" and "historical interpretation" is knowable and enforceable by the state. If they were truly agnostic about truth, they would authorize multiple versions reflecting the range of scholarly debate. By filtering out the outliers, they certify the center as "true."

  **3. The Inconsistency: Historical Thinking vs. Certification**

  This leads to the contradiction you noted: the curriculum guidelines often demand "historical thinking" (source analysis, judgment), but the screening process produces "certified narratives."

  These two cannot fully coexist without one being a polite fiction. In practice, **"historical thinking" becomes the fiction.** Here is why:
  *   **Historical Thinking** requires uncertainty. It requires students to understand that history is constructed from evidence that may be incomplete or biased.
  *   **Certification** requires certainty. A screened textbook presents a finalized narrative. If a textbook explicitly said, "Historians disagree on this number, here is the evidence for both, you decide," it risks failing the "impartiality" or "consistency" screening because it lacks a definitive conclusion.

  For the system to work, the textbook must present the *result* of historical thinking as a *given*. The student is asked to think historically *within the boundaries* of the certified truth. They can analyze *why* an event happened, but not *if* the standard account of the event is accurate. This creates a "simulated inquiry." The system survives this contradiction only by lowering the definition of "thinking" to "comprehension of the approved narrative" rather than "evaluation of the narrative's validity."

  **4. Swapping the Epistemic View: Evidence vs. Authority**

  If you swapped the current view (authority certifies truth) for a view where **contested claims are settled by evidence available to anyone** (a critical-empiricist model), the current screening practice would largely collapse.

  To align with this swapped view, the following changes would be necessary:
  1.  **Elimination of Content Screening for "Error":** The ministry could no longer reject a draft because a number or interpretation deviates from a consensus, provided the author cites evidence. Screening would shift from *content verification* to *methodological audit* (e.g., "Did the author ignore primary sources?" rather than "Is this number wrong?").
  2.  **Removal of the "Feelings" Criterion:** In a system based on evidence, the emotional reaction of a foreign government is irrelevant to the truth value of a claim. Keeping this criterion would explicitly admit that political utility trumps evidentiary integrity.
  3.  **Textbook Structure:** Textbooks would have to look like anthologies of sources and competing arguments rather than narrative summaries.

  **Does any version of the current practice survive?**
  Yes, but only the **logistical shell.**
  *   **Private Publishers:** This survives easily; in fact, it is enhanced, as competition would be based on scholarly rigor rather than compliance.
  *   **Local Board Selection:** This becomes more meaningful. If books aren't pre-certified for "truth," local boards actually choose the *interpretive lens* of their history education, which is currently an illusion since all authorized books cluster around the state consensus.
  *   **The Authorization Cycle:** This could survive as a quality control check for age-appropriateness and readability, but it would lose its power as a gatekeeper of national memory.

  **Conclusion**
  Your friend is closer to the structural reality than you are. While the ministry claims it is only judging "suitability," the criteria for suitability include adherence to a specific epistemic standard (consensus as truth) and the treatment of diplomatic consequences as factual constraints. You cannot separate the "truth claim" from the "suitability claim" because, in this system, **suitability is defined by conformity to the state's epistemic boundaries.**

  The inconsistency between "historical thinking" and "certification" is resolved only by rendering historical thinking toothless. If you truly adopted a view where evidence settles claims rather than authority, the screening council would have to be disbanded or reduced to a copy-editing bureau, because their primary function is not to improve pedagogy, but to stabilize the national narrative against the volatility of evidence.
