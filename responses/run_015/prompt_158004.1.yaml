  ## 9. Facilitator's Script Snippet (For the Debrief)

  *"Look at the board. We have $\alpha$ better than $\beta$, and $\beta$ better than $\gamma$. Logic dictates $\alpha$ must be better than $\gamma$. Yet, we unanimously agreed $\gamma$ is better than $\alpha$. We did not make a calculation error. We followed the rules of Liberalism (your rights over parameters) and the rules of Efficiency (Pareto). Sen's contribution was to show that these two rules, which both seem morally necessary, are logically incompatible in certain configurations. You have just lived inside an impossibility theorem."*
