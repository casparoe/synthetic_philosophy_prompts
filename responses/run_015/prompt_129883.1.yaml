      *   *Move 5 (Marisol):* "Emotional truth" is unfalsifiable. Solution: Change names (fictionalize). Filmmakers want "borrowed-name premium" (authority of nonfiction + freedom of fiction). Sets a standard: No invented character-implicating acts without record-level reason.
