          *   *Assessment:* True that compression is necessary, but equating *merging characters* with *inventing moral failings* is a category error. Book sales don't negate misinformation.
          *   *Rating:* Partially Right/Partially Wrong (The "degree talk" defense is weak here).

      *   *Move 3 (Marisol):* Compression vs. Attribution. Merging colleagues deletes credit. Inventing abandonment implicates character. "Quotation laundering" (real words, fake context) makes it worse.
          *   *Assessment:* Crucial distinction. Attribution of *action* is different from attribution of *presence*. Using real letters to validate a fake scene is a specific rhetorical trick.
          *   *Rating:* Clearly Right.

      *   *Move 4 (Grant):* Composites protect people. Documented neglect exists (just not that week). Need drama for relevance. "Emotional truth" justifies it.
          *   *Assessment:* "Emotional truth" is often a shield for laziness. "Documented neglect exists" is a slippery slope (she neglected someone once, so she abandoned her child?). Drama doesn't *require* specific fabrication.
