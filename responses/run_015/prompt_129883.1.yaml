answer: |-
  ### Move-by-Move Breakdown

  **Marisol 1 (Recollective Capture & Schools):** **Mostly Right.**
  She correctly identifies that visual media functions differently than text in public memory, and institutionalizing a fiction in schools transforms an artistic choice into a civic record.

  **Grant 1 (Compression & Book Sales):** **Partially Right.**
  He is correct that all biography requires selection, but wrong to equate omitting events with inventing morally charged ones; book sales measure interest, not accuracy.

  **Marisol 2 (Compression vs. Attribution & Quotation Laundering):** **Clearly Right.**
  This is her strongest move: merging colleagues hides credit, but inventing abandonment assigns guilt, and using real letters to validate a fake scene is a specific rhetorical deception.

  **Grant 2 (Emotional Truth & Drama):** **Mostly Wrong.**
  "Emotional truth" is an unfalsifiable shield that justifies any fabrication, and claiming drama *requires* specific lies ignores the existence of compelling, accurate historical fiction.

  **Marisol 3 (Borrowed-Name Premium & The Standard):** **Clearly Right.**
  She exposes the filmmaker's incentive to claim both authority and freedom, and her proposed standard (no invented character-implicating acts) is a principled, workable ethical line.

  **Grant 2 (Audience Awareness & Accountability):** **Partially Wrong.**
  While audiences often guess the real subjects, changing names signals a different contract, and public reckoning is useless if the premises of the reckoning are fabricated.

  **Marisol 3 (Standing & Burden of Proof):** **Mostly Right.**
  Descendants cannot veto history, but their objection does signal a high risk of harm to the living, which should ethically shift the burden of justification to the creator.

  **Grant 3 (No Veto Over History):** **Partially Right.**
  He is right that families do not own history, but wrong to imply that ignoring their specific objections is the only alternative to a veto.

  ***

  ### Overall Verdict
  **Marisol is more right.**

  Grant relies on a slippery slope argument (all biography is fiction) to defend specific, high-stakes fabrications. Marisol successfully draws a distinction between *reducing resolution* (compression) and *changing the image* (fabrication). Her argument accounts for the mechanics of memory and the specific incentives of the film industry, whereas Grant's defense rests on the utilitarian idea that "interest justifies means," which fails when the interest is based on a misconception.

  ***

  ### Deep Dive 1: Are the Coined Ideas Load-Bearing?
  Grant dismisses Marisol's terms as "degree talk with extra steps," but they are actually **load-bearing conceptual tools** that prevent the argument from stalling on intuition.

  *   **Recollective Capture:** This is not just a gut feeling; it references the psychological phenomenon of *source monitoring errors*. Humans struggle to distinguish between experienced memories and imagined ones, especially when the imagination is vivid. This explains *why* the film overwrites the text, making it a mechanistic claim, not just a complaint.
  *   **Quotation Laundering:** This specifically counters Grant's defense that "every line is verbatim." It identifies a specific fraud: using the authenticity of the *micro* (words) to validate the falsehood of the *macro* (context). Without this term, Grant's point about the letters stands; with it, that point becomes evidence of deception.
  *   **Borrowed-Name Premium:** This identifies the economic and epistemic motive. It explains *why* filmmakers don't just change the names (as Marisol suggests). They want the marketing hook of "True Story" without the liability. This moves the argument from "is this art?" to "is this false advertising?"

  None of these are mere relabelings; they operationalize the ethical intuition so it can be tested against Grant's "all biography is compression" claim.

  ### Deep Dive 2: The Compression Argument
  Grant argues that if you ban fabrication, you ban biography. This is a false dichotomy.

  **The Principled Line:**
  The line is not between "truth" and "lies," but between **omission** and **commission**.
  *   **Compression (Omission):** Leaving out a week of Ivy's life where she *was* with her daughter to focus on the strike. This reduces resolution but preserves the truth of her character.
  *   **Fabrication (Commission):** Showing a week where she *was not* with her daughter. This changes the truth of her character.

  **Does Marisol's position collapse into "No Biopics"?**
  No. It collapses into **"No Literalist Dramatizations of Unrecorded Events."**
  Filmmakers can still make biopics. They can dramatize recorded events, use voiceover for internal states, or use the "based on a true story" model where names are changed (as Marisol suggests).

  **Is that a bad outcome?**
  It would be a commercially inconvenient outcome, but not an artistic catastrophe. It would force a genre shift from "Historical Simulacrum" (pretending to be a window into the past) to "Historical Interpretation" (admitting to be a lens). This is arguably a *better* outcome for public understanding. It forces the audience to engage with the *interpretation* rather than passively consuming the *image* as fact. If the cost of Marisol's ethics is that we get fewer movies that claim to be history lessons but are actually mythology, that is a net positive for historical literacy.

  ***

  ### What Both Are Missing

  **1. The Economic Incentive Structure**
  Neither addresses *why* the studio made this choice beyond "drama." Biopics are greenlit based on "prestige" and "authenticity." The studio *needs* the "True Story" tag for awards and funding, but *needs* the fabrication for pacing. The ethical failure is as much the distributor's (marketing it as history) as the director's.

  **2. The Audience's Media Literacy**
  Both treat the audience as passive sponges. Grant assumes they will read the film and buy books; Marisol assumes they will read the film and store it as memory. Both ignore that the real solution isn't just filmmaker ethics, but teaching audiences (especially in schools) to view biopics as *arguments*, not *records*. If the film is shown in schools, the curriculum should explicitly teach the deviations, turning the film into a primary source for "How History is Consumed" rather than "Who Ivy Thornton Was."

  **3. The "Composite" Nuance**
  Marisol treats merging colleagues as purely negative (erasing women). Grant treats it as purely positive (protecting individuals). Both miss the middle: Composites are acceptable *if* they represent a structural truth (e.g., "the movement was collaborative") rather than an individual truth (e.g., "this specific person did this specific thing"). The film fails because it uses a composite to channel individual agency, which misleads on both counts.
