      *   *Move 6 (Grant):* That standard is just "degree talk with extra steps." Changing names doesn't work (audiences know). Named biopics allow public reckoning/accountability.
          *   *Assessment:* Audiences *do* know, but changing names signals "this is interpretive." Accountability works both ways (you can be held accountable for lies).
          *   *Rating:* Partially Right (on audience awareness), Mostly Wrong (on accountability).

      *   *Move 7 (Marisol):* Not a family veto, but "standing." Descendants are stakeholders. Objection shifts burden of proof.
          *   *Assessment:* Reasonable middle ground. Not censorship, but ethical weight.
          *   *Rating:* Mostly Right.

      *   *Move 8 (Grant):* Film isn't a eulogy. Families don't get a veto over history.
