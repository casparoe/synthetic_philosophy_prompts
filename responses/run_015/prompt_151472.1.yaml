      *   *Wait, actually:* The user *found* an anchor in the Rent dream (phone date). But in BIV, the phone date is also controlled. So the principle is about **Systemic Integrity vs. Local Glitch.**
      *   *Better Principle:* **The Fallibility of Internal Coherence.**
          *   If the doubt is about a *local* inconsistency (Rent), you can resolve it.
