answer: |-
  ### Specification for the Protocol: Requirements List

  To be actionable at 3 AM and legally defensible, the account must meet the following specifications. I have integrated your proposed desiderata into this list, marking them as **Non-Negotiable (NN)** for a hospital protocol or **Partisan (P)** (reflecting a specific theoretical commitment that may conflict with legal or operational realities).

  1.  **Operational Observability (Auditability)**
      *   *Motivation:* We can audit decisions and chart entries, but not intentions. A junior doctor must be able to justify a decision based on the record, not their internal state.
      *   *Status:* **Non-Negotiable.** (Matches your requirement: *drawable from outside the agent's head*.)
      *   *Constraint:* The distinction must rely on observable actions, orders, or system states, not inferred mental content.

  2.  **Institutional Scalability**
      *   *Motivation:* Modern ICU care involves algorithms, standing orders, and device defaults, not just individual hands-on acts.
      *   *Status:* **Non-Negotiable.** (Matches your requirement: *apply to institutions, standing orders and software defaults*.)
      *   *Constraint:* The account must assign agency to the system or policy when no individual is acting at the time of death.

  3.  **Causal Agnosticism**
      *   *Motivation:* Clinicians are not metaphysicians; they cannot resolve debates about whether omissions are causes or absences are explanatory.
      *   *Status:* **Non-Negotiable.** (Matches your requirement: *not rest on contested claims about whether omissions can be causes*.)
      *   *Constraint:* The protocol must function regardless of whether one adopts a counterfactual or physicalist theory of causation.

  4.  **Conceptual Independence from Intention (DDE)**
      *   *Motivation:* If the distinction collapses into "intending death vs. foreseeing death," we do not need a separate killing/letting-die protocol; we need an intention protocol.
      *   *Status:* **Non-Negotiable.** (Matches your requirement: *not quietly collapse into the distinction between intending death and merely foreseeing it*.)
      *   *Constraint:* The account must identify a structural difference in the act/omission itself, independent of the *mens rea*.

  5.  **Unified Agency for Acts and Omissions**
      *   *Motivation:* Consistency in moral evaluation regardless of whether the outcome resulted from movement or stillness.
      *   *Status:* **Partisan.** (Matches your requirement: *treat doing/allowing and killing/letting-die as one distinction rather than two*.)
      *   *Constraint:* Many legal systems treat active killing and failure to rescue differently; enforcing unity may conflict with local law.

  6.  **Moral Equivalence of Act and Omission in Parallel Cases**
      *   *Motivation:* Intuitive consistency (e.g., the Bathtub Pair).
      *   *Status:* **Partisan.** (Matches your requirement: *give the same verdict on the well-known bathtub pair*.)
      *   *Constraint:* While morally intuitive to some, this contradicts standard legal frameworks which impose a duty to rescue only in specific relationships. A hospital protocol must prioritize legal safety over philosophical symmetry.

  7.  **Deontological Sensitivity (Means vs. Side-Effect)**
      *   *Motivation:* Avoiding abhorrent conclusions (e.g., harvesting organs to save more lives).
      *   *Status:* **Partisan.** (Matches your requirement: *mark a difference between diverting the trolley and cutting up the healthy patient*.)
      *   *Constraint:* Consequentialist accounts often fail this; requiring it privileges deontological constraints which may not be universally shared by all committee members.

  ---

  ### Application to ICU Cases

  *   **Ventilator Algorithm:** Requires **Institutional Scalability**. If the software defaults to reassignment, the protocol must define whether the *system* killed the first patient or the *policy* allowed them to die, without needing to find a specific human who intended the death at the moment of switching.
  *   **Programmed Pump:** Requires **Operational Observability**. The act (programming) is separated from the effect (death) by time and sleep. The account must classify the death based on the prior observable order, not the clinician's mental state during sleep.
  *   **Withdrawal of Support:** Requires **Causal Agnosticism**. Whether stopping a machine is a "cause" of death or an "allowance" of the underlying pathology must be decidable without settling the omission/causation debate.
  *   **Diffusion of Responsibility (Two Clinicians):** Requires **Operational Observability**. The protocol must determine liability based on assigned duty rosters (observable) rather than internal beliefs about who else was acting.
  *   **Uncertainty about Prognosis:** Requires **Conceptual Independence from Intention**. A decision made under uncertainty cannot be judged by what the doctor "intended" the outcome to be, but by whether the action taken was a withdrawal of treatment (allowing) or administration of toxin (killing).

  ---

  ### Incompatibility and The "Killer" Requirement

  **The Impossible Subset:**
  You cannot jointly satisfy **Operational Observability**, **Causal Agnosticism**, and **Deontological Sensitivity (Trolley/Transplant)**.
  To distinguish the Trolley case (diverting a threat) from the Transplant case (creating a threat) without relying on intention (Observability) or specific causal metaphysics (Agnosticism), you have no remaining theoretical tools. Purely external descriptions of physical movements often look identical in both cases; without intention or causal theory, the distinction vanishes.

  **The Single Most Exclusionary Requirement:**
  **Operational Observability (Auditability).**
  This requirement does the most work in excluding otherwise attractive accounts because it immediately disqualifies all Intention-based accounts (including the Doctrine of Double Effect) and most sophisticated Causal accounts that rely on counterfactual baselines difficult to verify in a medical record. It forces the theory into a behaviorist corner that struggles with the "Programmed Pump" and "Algorithm" cases.

  ---

  ### Scoring the Theoretical Families

  **Counterfactual or Baseline Accounts**
  *Score:* **Fail.** They struggle with the *Institutional Scalability* requirement because establishing the "normal course of events" baseline for an algorithm or a standing order is often ambiguous and not easily auditable in a crisis.

  **Intention-based Accounts**
  *Score:* **Fail.** They violate the *Operational Observability* requirement; a protocol cannot be built on accessing a clinician's mind at 3 AM, making these legally and practically unusable for this purpose.

  **Skeptical Accounts (No Moral Weight)**
  *Score:* **Pass/Fail.** They satisfy *Causal Agnosticism* and *Observability* by dissolving the distinction, but they fail the committee's mandate to write a protocol *governing* the distinction, rendering the project itself obsolete.
