      *   *Result:* Maya likely says **No**.

  5.  **Best Guess at Maya's Actual View:**
      *   She seems to be a **Participatory Democrat** with a **Populist lean**. She values *action* over *abstraction*. She distrusts elites (SCOTUS) but also distrusts "noise" (0.2% margin). She sees the "Will" as something *forged* through struggle or formal commitment, not just measured.
      *   Core view: **The Will of the People is a Constructed Mandate, not a Measured State.** It requires people to *do* something difficult (vote, march) to prove they mean it, and the result must be clear enough to act on.

