prompt: |-
  I've been taking this course on democratic theory and my roommate Maya keeps using the phrase 'will of the people' like it's a physics formula or something. We got into it last night after she read some populism stuff for class. She said the Brexit vote was definitely the will — 52%, huge turnout, people actually showed up. Then she said when the Supreme Court struck down that law even though polls said 60% of Americans liked it, that wasn't the people speaking at all, just legal elites talking over them. But then she turned around and said the rent-control march downtown with 30,000 people was absolutely the will, even though the council ignored it and there was never a vote. And she thinks Lula winning by under two percent in Brazil counts, but she said if he'd won by like 0.2% she wouldn't call it that — there's some 'density floor' where it's just noise, not a real will.

  I'm trying to figure out what rule she's actually running, not whether she's right. Could you lay out two or three different principles that could explain all four of her calls? Then here's the new case I'm stuck on: some company builds an AI that reads 10 million user comments and spits out a policy recommendation with 70% agreement, but only like 0.1% of the users actually read the proposal — they just reacted to headlines. Would Maya call that the will of the people? For each principle, say what it predicts about the AI case. Give me your best guess at her actual view with reasoning. And what's one further hypothetical scenario that would actually split these rules apart? I keep writing 'popularism' in my notes by accident so forgive me if I typo'd anything here.
