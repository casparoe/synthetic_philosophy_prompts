answer: |-
  It sounds like Maya is grappling with the classic tension in democratic theory between **proceduralism** (following the rules) and **substantivism** (the actual content/intensity of public desire). You didn't typo "popularism" in a way that hurts understanding, but the term you're looking for is **populism**—specifically, a strain that tries to define "the people" against "the elites."

  Maya's judgments seem inconsistent on the surface (votes count, but polls don't; marches count, but councils don't), but they likely stem from a specific conception of what makes a preference *real* versus just *noise*.

  Here are three principles that reconstruct her logic, followed by the AI prediction, my best guess at her underlying view, and a scenario to test them.

  ### Three Principles Explaining Maya's Calls

  **1. The Costly Signal Principle (Action > Opinion)**
  *   **The Rule:** The "will of the people" only exists when citizens incur a cost (time, risk, effort) to express a preference. Passive measurement doesn't count.
  *   **Explaining the Calls:**
      *   *Brexit & Lula:* Voting requires registration, showing up, and casting a ballot. That is a cost.
      *   *Rent-Control March:* Marching takes hours, physical effort, and potential social risk. That is a high cost.
      *   *SCOTUS Polls:* Answering a pollster is low-cost/zero-cost. It's "cheap talk," so it doesn't count as a true will.
      *   *Lula 0.2%:* A margin that small suggests the "signal" might be random noise or coercion, not a deliberate costly choice by a decisive group.

  **2. The Obstructed Channel Principle (Procedure + Necessity)**
  *   **The Rule:** The will is expressed through official institutional channels (elections/referendums). However, if those channels are blocked or ignored by elites, informal channels (protests) become valid substitutes.
  *   **Explaining the Calls:**
      *   *Brexit & Lula:* These are official, sanctioned mechanisms.
      *   *SCOTUS:* Polls are not a mechanism, and the Court (elite) overrode the preference, proving the channel was blocked/ignored.
      *   *Rent-Control March:* There was no vote offered. The Council ignored the need. Therefore, the street became the necessary channel.
      *   *Lula 0.2%:* Even in an official channel, if the result is statistically indistinguishable from a tie, the mechanism fails to produce a mandate.

  **3. The Signal Stability Principle (Clarity > Volume)**
  *   **The Rule:** A preference only counts as "the will" if the margin of victory is large enough to prove it is a stable preference, not statistical noise or headline reactivity.
  *   **Explaining the Calls:**
      *   *Brexit (52%):* Clear enough to act on.
      *   *SCOTUS (60%):* Numerically clear, *but* (combined with Principle 1) it lacks the stability of a binding decision.
      *   *Rent-Control March:* 30,000 people is a small % of the population, but the *intensity* makes the signal stable (they care enough to be there).
      *   *Lula 0.2%:* This is within the margin of error. It is unstable. A 2% win is a stable signal; 0.2% is a coin flip.

  ***

  ### The New Case: The AI Comment Scrape
  **Scenario:** An AI analyzes 10 million user comments. 70% agree with a policy. However, only 0.1% of users actually read the proposal; the rest reacted to headlines.

  **Predictions based on the principles:**

  *   **Costly Signal Principle:** **NO.** Clicking a reaction or commenting based on a headline is extremely low-cost. They did not invest the effort to inform themselves (reading the proposal). Maya would likely view this as "noise" or manipulation, not will.
  *   **Obstructed Channel Principle:** **NO.** An AI scrape is not an official democratic channel. Furthermore, there is no evidence that official channels were blocked or that this was a *necessary* substitute for a vote. It's just data aggregation.
  *   **Signal Stability Principle:** **NO.** While 70% looks high, the input is based on headlines. This makes the signal highly unstable (if the headline changed, the vote might flip). It lacks the "density floor" of informed consent.

  **Consensus:** Under all three reconstructions, Maya would almost certainly say this is **not** the will of the people. It lacks agency, legitimacy, and stability.

  ***

  ### Best Guess at Maya's Actual View

  Maya is likely operating under a theory of **Participatory Populism**.

  Her core belief isn't just about counting heads (majoritarianism); it's about **forging a mandate**. She believes the "will of the people" is something that must be *proven* through struggle or formal commitment.
  *   **Why she rejects the SCOTUS polls:** Because opinions are easy to have and easy to change. They don't bind anyone.
  *   **Why she accepts the March:** Because those 30,000 people *acted*. They transformed a passive opinion into an active demand.
  *   **Why the 0.2% Lula margin fails:** Because a mandate requires the capacity to govern. If the margin is too thin, you can't claim the "will" is distinct from random variation.

  **Reasoning:** She treats democracy less like a thermometer (measuring what people feel) and more like an engine (requiring fuel/action to run). If the input is passive (polls, AI clicks) or ambiguous (0.2% margin), the engine doesn't turn.

  ***

  ### The Splitting Scenario

  To figure out which of the three principles is *actually* driving her (since they all agree on the AI case), you need a scenario where **Action** conflicts with **Procedure**.

  **The Hypothetical: The "Low-Turnout Referendum"**
  Imagine a binding national referendum is held legally (Official Channel). The measure passes 90% to 10%. However, voter turnout is only **12%** of the eligible population because everyone else boycotted or didn't care.

  *   **Obstructed Channel Principle predicts: YES.** It was an official, legal vote. The procedure was followed.
  *   **Costly Signal Principle predicts: NO.** 88% of the people did not pay the cost of voting. The "active" group is too small to claim they represent the "will of the people." The signal is costly, but not representative.
  *   **Signal Stability Principle predicts: NO.** A 12% turnout suggests the issue lacks salience. The 90% margin is an artifact of low participation, not a stable national will.

  **How to use this:** Ask Maya: *"If a legal vote passes 90-10, but only 12% of the country bothers to show up, is that the will of the people?"*
  *   If she says **Yes**, she prioritizes **Institutions/Procedure**.
  *   If she says **No**, she prioritizes **Participation/Intensity** (which aligns with her love of the Rent-Control March). Given her enthusiasm for the march, my money is on her saying **No**.
