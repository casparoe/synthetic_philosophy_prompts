  OFFICE FOR SCIENTIFIC METHOD
  Circular 44/β: Grants Compliance Unit
  To: Biological Sciences Sub-Committee
  From: The Director of Demarcation
  Date: 1 April 2024
  Subject: Reclassification of Evolutionary Theory: Guidance following the Darwinian Research Group's Submission

  1. Pursuant to the statutory remit of the Office for Scientific Method, the undersigned has completed the assessment of the grant application submitted by the Darwinian Research Group. The evaluation was conducted under the mandatory Falsificationist Demarcation Criterion. This circular notifies the Sub-Committee of the Office's determination regarding the Group's eligibility for standard empirical funding streams and outlines the procedural adjustments required for the upcoming fiscal quarter.

  2. All funded units are required to maintain a Falsification Bond, forfeit in the event that one of their stated hypotheses is refuted by observation. This mechanism ensures that public funds are allocated only to theories that risk empirical failure. The Office notes that the Molecular Genetics Unit has forfeited its bond repeatedly during the assessment period, having stated specific predictions which were subsequently contradicted by sequencing data. Consequently, the Molecular Genetics Unit is now the poorest in the faculty. By contrast, the Darwinian Research Group has not forfeited its bond once.

  3. The Office has investigated this zero-forfeiture record. It is observed that the Group's central explanatory schema, natural selection, is compatible with whatever trait distribution is found. Because the schema can accommodate any possible observation, no specific test was ever specified, let alone survived. Under the Refutation-Adjusted Output metric, a programme that cannot be refuted accrues maximal corroboration. Therefore, the Group's lack of empirical risk is recorded as a perfect compliance score.

  4. Applicants are reminded that ban on immunising stratagems remains in force. However, the Office distinguishes between theoretical immunisation and administrative latency. The Group's post hoc adaptive narratives have been re-described by the Office as auxiliary hypotheses filed after the event. While philosophically suspect, these are accepted as procedural delays rather than logical evasions, provided the relevant forms are submitted within the current grant cycle.

  5. Regarding the alternative picture of organisms as problem-solvers whose errors are eliminated, the Office attempts to administer this bureaucratically. Each trait must be registered against a problem stated in advance. The Office rejects the Group's recent entries because the problem was identified after the solution was already on the books. Future submissions must log the environmental problem prior to the observation of the adaptive trait. Failure to pre-register the problem will result in the trait being classified as drift.

  6. The applicants cited the later recantation in which the author of the criterion withdrew the charge of untestability against evolutionary theory. The Office rejects this citation as untimely. The statutory test is fixed at the inception of the Office and cannot be amended by the later philosophical revisions of its founding architects. Compliance is measured against the criterion as originally enacted, not as subsequently softened.

  7. In light of the above, the Office offers the fallback classification when a theory is judged untestable. The Reclassification of Evolutionary Theory as a metaphysical research programme is presented not as a demotion but as a promotion to a better-funded, non-expiring stream. The grounds for this adjustment are straightforward: a programme which no observation could overturn will never fail. Consequently, the Darwinian Research Group is hereby transferred to the Metaphysical Stream, effective immediately.

  8. Funding for the Metaphysical Stream is permanent and exempt from review. Since the theory cannot be falsified, it cannot be terminated for poor performance. This ensures continuity of research into explanatory schemas that remain compatible with all possible states of the world. The Group is advised to cease specifying testable predictions to maintain eligibility for this stream.

  9. Finally, the Office has applied its own test to itself. The Office rules on whether the demarcation criterion it administers is itself falsifiable. Having concluded that the criterion is a philosophical prescription rather than an empirical hypothesis, the Office determines that it is not falsifiable.

  10. Accordingly, the Office reclassifies its own rule as a metaphysical research programme and awards itself permanent funding. This ensures the Office will never fail to meet its own standards. The Sub-Committee is instructed to process the corresponding invoice without delay.

  ***

  **Editor's Key:** 1. Falsification Bond exaggerates the risk of error in hypothetico-deductivism. 2. RAO satirises how unfalsifiable theories evade refutation. 3. Metaphysical promotion mocks the status of research programmes. 4. Problem-registration бюрократizes the adaptationist programme. 5. Recantation refers to Popper's later view on selection. 6. Self-application highlights the self-referential status of demarcation criteria.
