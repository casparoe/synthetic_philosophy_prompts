answer: |-
  **The Kavrem Case**

  **Setting:** *A noisy café near the linguistics department. Empty cups clutter the table.*

  **Ade:** So, the Kavrem stipulation. You see why it favors my view? It makes explicit what is always tacit. In English, when I say 'Hesperus', there's a hidden indexical context—how I know it. Kavrem just forces you to spell it out. 'Hesperus-vi' versus 'Hesperus-ru'. It's syntax making pragmatics visible.

  **Miriam:** But it attaches to the name, Ade. Not the verb, not the clause. The name itself is morphologically complex. If I say 'Hesperus-vi is Phosphorus-ru', I'm not just adding context; I'm changing the subject term. The mode of presentation is baked into the referring expression. That's Frege plain and simple.

  **Ade:** Don't confuse morphology with semantics. Think of 'I'. It changes form depending on who speaks, but it always refers to the speaker. In Kavrem, the name changes form depending on the evidence, but it still refers to the planet. The extra stuff is just a instruction to the hearer on how to file the information. It doesn't change the proposition.

  **Miriam:** If it's merely an instruction, why is it grammatically required? You can't utter a bare name. If I try to report your belief, I can't strip the marker off. If you believe 'Hesperus-vi', and I report 'Ade believes Hesperus-ru', have I misrepresented you?

  **Ade:** You've misrepresented the *way* you believe, not *what* you believe. Like saying 'He whispered' versus 'He said'. The content is the same; the manner differs. Kavrem just makes the manner obligatory.

  **Miriam:** Here's the problem. Suppose I learn about Venus twice. Once from a teacher, once by looking at the evening sky. I don't realize it's the same planet. In Kavrem, I must say 'Venus-testimony is not Venus-perception'. For me, that's true. But if names are directly referential, I'm saying 'Venus is not Venus'. That's a contradiction.

  **Ade:** That's the classic puzzle, Miriam. Kavrem doesn't solve it; it just dresses it up. My reply is standard: there are two lexical entries here. You have two names that happen to sound alike but carry different hidden indices. Kavrem just makes the index visible. So it's not 'Venus is not Venus'; it's 'Venus-as-told is not Venus-as-seen'. The proposition is still singular, but you're confused about the identity.

  **Miriam:** But you just admitted the index is part of the logical form. If the logical form includes the evidence type, then the mode of presentation is semantic, not pragmatic. You're smuggling Fregean senses in as hidden indices.

  **Ade:** I'm smuggling nothing. I'm acknowledging that communication requires tracking sources. But look at this: suppose we both learn about Venus from the same teacher, in the same conversation. We both use 'Venus-testimony'. I say 'Venus-testimony is Venus-testimony'. That's trivial. But suppose I learn 'Hesperus' from her and 'Phosphorus' from her. Both are 'testimony'. I say 'Hesperus-testimony is Phosphorus-testimony'. That is still informative. The markers are identical, but the cognitive significance differs.

  **Miriam:** *Pauses, stirring coffee.* That's a good point. If the marker were the mode of presentation, identical markers should yield trivial identities.

  **Ade:** Exactly. The marker tracks the *source*, not the *sense*. You can have the same source for two different senses. So the evidential suffix isn't the Fregean mode. It's just a constraint on usage.

  **Miriam:** I'll concede that. The evidential marker is too coarse-grained to be the full mode of presentation. It captures the route, not the cognitive content. But that doesn't save Direct Reference. Consider the 'unrecoverable' marker. The grammar says if I don't know the source, I must use 'Vesper-unrecoverable'.

  **Ade:** So you mark your ignorance.

  **Miriam:** But I'm forced to mark it. If I say 'Vesper-unrecoverable is bright', the proposition I express depends on my ignorance. If I later learn the source, I can't truthfully repeat the sentence without changing the name. The truth conditions of my report depend on my epistemic state.

  **Ade:** Only because the language forces you to encode pragmatics in semantics. It's a quirk of Kavrem grammar. In English, I can just say 'Vesper is bright' regardless of how I know it.

  **Miriam:** But in Kavrem, you can't. If we are doing philosophy in Kavrem, we cannot detach the name from the mode. There is no "bare name" to be directly referential. The language makes it impossible to express the singular proposition you claim is the only one that exists.

  **Ade:** That's a strong claim. You're saying the ontology depends on the grammar?

  **Miriam:** I'm saying if the grammar forbids detached names, your theory has no purchase in that language. You can't say the proposition is just the object when the syntax won't let you pick out the object without a mode.

  **Ade:** *Leans back.* I'll concede this: Kavrem complicates the "tacit" part of my view. If the index is overt, it behaves more like a semantic constituent than a pragmatic implicature. It challenges the idea that we can always peel away the mode to find the bare reference underneath. In Kavrem, there is no underneath.

  **Miriam:** And I concede that the marker isn't the sense itself. The 'same source' case proves that. Two different cognitive values can share an evidential history. So the Kavrem marker isn't a perfect Fregean sense.

  **Ade:** So where does that leave us? You admit the marker isn't the sense. I admit the marker isn't merely pragmatic noise.

  **Miriam:** It leaves us with the boundary line. Is the evidential marker part of the *content* of the belief, or part of the *vehicle*? If I believe 'Hesperus-vi', do I believe a proposition containing the evidential marker?

  **Ade:** If I say yes, I'm a Fregean. If I say no, I have to explain why the grammar forces me to lie about my epistemic state to report the belief accurately.

  **Miriam:** And if I say the marker is the sense, I have to explain why 'Hesperus-testimony is Phosphorus-testimony' is informative.

  **Ade:** So the disagreement isn't about Kavrem. It's about whether there is *any* level of description where the name stands alone. You think Kavrem shows us the truth: names are always cloaked. I think Kavrem shows us a distortion: names are bare, but this language forces them into costumes.

  **Miriam:** But if the costume is mandatory, can we ever see the face?

  **Ade:** Maybe the question isn't whether we can see the face, but whether the face exists without the costume.

  **Miriam:** *Nods slowly.* Then the puzzle isn't about Venus. It's about whether a thought can exist without a way of thinking it.

  **Ade:** And whether a language can force us to speak about the way without changing the thing.

  **Miriam:** We aren't done, then.

  **Ade:** Not even close. But at least we know what we're fighting over.

  **Miriam:** Another coffee?

  **Ade:** Make it 'coffee-perception'. I see the pot myself.
