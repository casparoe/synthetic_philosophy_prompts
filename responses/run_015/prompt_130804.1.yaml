answer: |-
  This is a classic "self-defeat" objection to Evolutionary Debunking Arguments (EDAs), often associated with responses to Sharon Street or Richard Joyce. Your intuition is excellent: **Step (5) is the critical failure point**, though Step (4) is also vulnerable.

  Your friend's argument attempts to show that the EDA is self-undermining (if it proves morality is unreliable, it proves itself unreliable). To save the EDA (and keep Premise 2, as you wish), you need to show that the analogy between **Moral Beliefs** and **Epistemic/Philosophical Beliefs** breaks down.

  Here is the breakdown of where the argument fails, the nature of the equivocation, and the cost of rejecting that step.

  ### 1. The Primary Target: Reject Step (5)
  **Premise (5):** *The facts D is about — epistemic norms, causal histories of belief — are also causally inert in the same way.*

  This is the strongest point of attack. There is a subtle **equivocation on "causally inert."**

  *   **In the Moral Case (Premise 2):** The EDA assumes Moral Realism posits facts that are *normatively binding independent of natural consequences*. For example, "Torture is wrong" is true even if torturing innocents helped our ancestors survive. These facts are "causally inert" because their truth does not depend on their causal impact on the world. Evolution tracks survival, not independent normative truth.
  *   **In the Epistemic Case (Premise 5):** The "facts" that belief $D$ relies on are **empirical and logical**.
      *   *Causal Histories:* The fact that "belief $X$ was caused by evolution" is a natural, empirical fact. Empirical facts **are** causally potent. Knowing the causal history of a predator or a food source directly impacts survival.
      *   *Epistemic Norms:* Epistemic norms (e.g., "infer the best explanation," "avoid contradiction") are instrumental. They are the *tools* by which we track reality. If these norms were completely decoupled from survival/truth-tracking, we would have gone extinct.

  **The Argument:** You reject (5) by arguing that epistemic/empirical facts are not "inert" in the relevant sense. They are constitutive of successful navigation of the world. Moral facts (as defined in the EDA) are posited as *additional* layers on top of the natural world; epistemic facts are the *structure* of our engagement with the natural world.

  **The Cost:**
  Rejecting (5) commits you to **Epistemic Naturalism**. You are claiming that our reasoning faculties *are* generally reliable because they were selected for tracking truth (or at least survival-enhancing truths). You must maintain that there is a disanalogy: Evolution tracks *instrumental* truth (epistemology/logic) but not *non-natural* truth (morality). This is a standard and defensible position, but it requires you to defend why logic is "natural" while morality is not.

  ### 2. The Secondary Target: Reject Step (4)
  **Premise (4):** *D was also selected for: skeptical, reductionist reasoning boosts status...*

  This premise conflates **Cognitive Capacities** with **Specific Philosophical Theories**.

  *   **Capacity:** Evolution certainly selected for general reasoning, pattern recognition, and skepticism (e.g., "Is that rustling a tiger or the wind?").
  *   **Content:** Evolution did *not* select for the specific proposition $D$ ("Evolutionary Debunking Arguments are sound"). This is a modern, high-level philosophical theory.

  The EDA (Premise 1) applies to "belief-types" shaped by selection (e.g., "Kin altruism is good," "Purity violations are disgusting"). It does not necessarily apply to derived philosophical conclusions reached *using* those faculties.

  **The Argument:** You reject (4) by distinguishing between the *reliability of the faculty* (logic/reason) and the *genealogy of the specific belief*. The EDA uses reliable faculties (logic) to analyze the genealogy of unreliable beliefs (morality). The tool is not tainted by the object it is analyzing.

  **The Cost:**
  This requires you to argue that we can trust our logical faculties even if we distrust our moral intuitions. This leads to the "Companions in Guilt" challenge: If evolution shaped our logic, why trust logic? The response is that logic is *constitutive* of belief itself (you can't argue against logic without using it), whereas moral beliefs are contingent outputs.

  ### 3. The Scope Shift (Your Intuition)
  You asked if there is a hidden scope shift. **Yes.**

  The argument shifts from a **Substantive Domain** (Morality) to a **Methodological Domain** (Epistemology/Logic).

  *   **Morality:** A domain of *values* we are trying to track.
  *   **EDA:** A *method* of evaluating how we track values.

  If you apply the debunking argument to the method itself, you aren't just creating skepticism; you are creating a performative contradiction. The EDA proponent can concede that *if* (1) applies to logic, skepticism follows, but they deny that (1) applies to logic. They restrict the scope of the Debunking Principle to **substantive normative claims**, not **procedural epistemic norms**.

  ### Summary for Your Study Group
  To win this argument while keeping Premise (2):

  1.  **Reject Step (5).** Argue that it commits an equivocation. Moral facts (per the realist definition used in EDAs) are causally inert *normative* properties. The facts required for the EDA (causal histories, logical validity) are *natural/descriptive* properties. Natural properties *do* have causal power and are trackable by evolution.
  2.  **Highlight the Scope Shift.** Point out that the EDA is a *tool*. Using a tool to check the integrity of a wall doesn't require you to check the integrity of the tool using the same standard, especially if the tool (logic) is presupposed by the check itself.
  3.  **The "Bullet" to Bite.** The cost is accepting that **Epistemology is Naturalizable** while **Ethics is Not**. You are claiming evolution *did* track truth when it comes to cause-and-effect (epistemology), but *did not* track truth when it comes to independent moral value. This is the core of the "Third Factor" or "Reliabilist" defense of the EDA.

  **Verdict:** The argument is **invalid** because Premise (5) is false. The facts underpinning the EDA are not causally inert in the same way moral facts are alleged to be.
