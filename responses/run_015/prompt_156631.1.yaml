answer: |-
  You have identified a sophisticated and under-named rhetorical maneuver. There is no single common English word for the *entire* pattern (the reputation building + the strategic deployment), but there are several overlapping concepts in philosophy, linguistics, and game theory that describe its components.

  Here is the breakdown of the existing literature, a proposed name for the specific pattern you see, and an analysis of the moral implications.

  ### 1. Existing Concepts and Literature

  There are three distinct fields that touch on this, but none fully capture the *temporal* aspect (building credit over time to spend it later).

  **A. Paltering (Psychology/Negotiation)**
  This is the closest existing term for the *act* itself. Paltering is the active use of truthful statements to create a false impression.
  *   *Literature:* Rogers, Zeckhauser, et al., "The Ethics of Paltering" (Harvard Kennedy School).
  *   *Limit:* Paltering usually refers to the specific instance of deception, not the long-term reputation management that makes it effective.

  **B. Gricean Implicature (Linguistics/Philosophy)**
  Paul Grice's "Cooperative Principle" posits that conversation relies on maxims (Quality, Quantity, Relation, Manner). Your examples describe someone adhering strictly to the **Maxim of Quality** (truth) while deliberately violating the **Maxim of Quantity** (give as much info as needed) or **Relation** (be relevant), relying on the audience to infer the wrong thing.
  *   *Literature:* Paul Grice, "Logic and Conversation" (1975).
  *   *Relevance:* Grice argues that if you knowingly allow a false inference to stand, you are morally responsible for the deception, even if your words were true.

  **C. Costly Signaling Theory (Evolutionary Biology/Economics)**
  This explains *why* the small honesty works. By admitting to small faults (being late, hating the plan), the speaker pays a "cost" (social awkwardness, minor reputation hit). This signals that they are a "high-quality" honest agent because a liar would not pay that cost for no gain.
  *   *Literature:* Amotz Zahavi, "The Handicap Principle."
  *   *Relevance:* The speaker builds "Honesty Capital" through costly small signals, which they then "spend" on the high-stakes deception.

  ### 2. What to Call It

  Since no single word exists, I propose calling this **Credibility Laundering** or **Truth Arbitrage**.

  **Credibility Laundering** captures the process: taking "dirty" intent (the desire to mislead) and running it through a cycle of "clean" transactions (punctilious small truths) so that the output looks legitimate.

  **Truth Arbitrage** captures the economic mechanic: exploiting the gap between the *technical truth* of the statement and the *perceived truth* of the implication, using reputation as the leverage.

  **Defining the Edges:**
  To distinguish this from simple honesty or simple lying, the pattern must meet three criteria:
  1.  **Technical Adherence:** Every atomic statement is verifiably true.
  2.  **Predictive Misalignment:** The speaker anticipates (and relies upon) the audience drawing a false conclusion.
  3.  **Capital Expenditure:** The speaker has previously invested in a reputation for honesty specifically to lower the audience's guard for this moment.

  ### 3. The Question of Intent and Habit

  You asked: *Does it matter whether the small-scale honesty is calculated or just who they are? What if they have no idea they do it?*

  **Morally:** Yes, intent matters for *culpability*, but not for *harm*.
  *   **The Calculated Strategist:** Is guilty of premeditated manipulation. They are weaponizing virtue.
  *   **The Unconscious Habit:** This is closer to **negligence**. If a researcher knows the press will misread their summary, they have a duty of care to prevent it. Failing to do so because "it's not my job" or "I'm just stating facts" is a form of ethical blindness.
  *   **The "Audience's Fault" Defense:** This is the weakest link. Under Grice's Cooperative Principle, the speaker bears the burden of ensuring their contribution is not *misleading*, not just *true*. If you know your audience is prone to a specific error and you structure your truth to trigger it, you are the cause of the error. Blaming the audience is like blaming a pedestrian for walking into a trap you disguised as a sidewalk.

  ### 4. Does the Moral Distinction Collapse?

  This is your crucial question: *Does the usual claim that lying is worse than misleading still do any moral work, or does the difference collapse?*

  In this specific configuration, **the distinction collapses.**

  Traditional ethics (Kantian, for example) often holds that lying is worse than misleading because lying corrupts the *will* and the *faculty of communication* itself. Misleading is often seen as a "sin of omission" versus lying's "sin of commission."

  However, **Credibility Laundering** exposes that distinction as a loophole rather than a moral boundary. Here is why:

  1.  **Intent is Identical:** The goal in both cases is to induce a false belief in the listener.
  2.  **Reliance is Identical:** The listener relies on the speaker's integrity in both cases. In the lying scenario, they rely on the words. In the laundering scenario, they rely on the *reputation*.
  3.  **Weaponized Virtue:** In standard misleading, the speaker hides behind ambiguity. In Credibility Laundering, the speaker hides behind *honesty*. This is arguably *worse* than lying because it devalues the currency of truth itself. It makes honesty suspicious. If the most "honest" people are using their honesty to mislead us most effectively, we lose the ability to trust anyone.

  **The "Truth-Teller's Paradox"**
  There is a specific danger here that lying does not possess. A known liar is easily discounted. A "Credibility Launderer" is dangerous precisely because they *are* honest about the small things. They force us to doubt the very people who seem most worthy of trust.

  ### Summary
  You are describing a form of **Strategic Candor** used for **Credibility Laundering**. It relies on **Costly Signaling** to build capital, which is then spent via **Gricean Implicature**.

  While traditional ethics tries to maintain a firewall between lying and misleading, this pattern breaches that firewall. If the intent is to deceive, and the mechanism exploits the listener's trust, the technical truthfulness of the sentences is a legalistic shield, not a moral defense. The difference does not hold; it is merely a more sophisticated, and perhaps more corrosive, form of deception.
