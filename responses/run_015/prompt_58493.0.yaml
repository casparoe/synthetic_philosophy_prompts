prompt: |-
  hey can you sanity check my take on hard choices for me? ive been going back and forth between staying as a public defender in my hometown close to my mom vs taking a policy job in DC that is more exciting but would uproot me, and reading around has left me with a bunch of views I beleive but im not sure they fit together:

  1. I think trichotomy fails. My two jobs are the example I keep coming back to: after thinking it through, neither is better than the other, neither is worse, and they are not equally good either. They are just on a par, hard to compare in a way that is in the world not just in my head.

  2. I also think if you take one side of a hard choice and sweeten it just a bit, that has to break the tie. Like if the DC job came with an extra week of vacation and everything else stayed the same, then it would have to be determinately better than staying put. Otherwise reason would never get traction.

  3. I think when you are in a hard choice like that either option is rationally fine, and how you pick doesnt matter much. Flipping a coin or just going with your gut is perfectly rational. I dont think you create new reasons for one side by committing to it or throwing yourself behind it, the reasons are just whatever was there before you chose.

  4. I think it can still make sense to feel sad or wishful about the path you didnt take even if your choice was totally rational. Like if I stay, missing DC doesnt mean I messed up.

  5. I think this hardness isnt just ignorance. Even if I knew every detail about both lives and had all the time in the world to reflect, the choice would still be hard. Its not going away with more info.

  does that package actually hang together? tell me which ones really clash, which ones just look like they clash but dont on inspection, rank the real clashes by how serious they are, and for each say what the cheapest fix would be and what it would cost me. dont just say everything is in tension, actually discriminate.
