answer: |-
  The notification on Elias's phone buzzed like a trapped insect. He was sitting on the edge of his bed, still in his work clothes, staring at a podcast transcript titled *Death and the Afterlife: The Collective Conjecture.*

  He'd stopped scrolling ten minutes ago. His thumb was numb.

  Samuel Scheffler's argument was simple, brutal, and currently dismantling Elias's entire Tuesday. The gist: We only find meaning in our lives because we assume humanity will continue after we die. If you knew the world would end the day after your funeral, you wouldn't bother finishing that novel, or fixing that garden, or even loving your spouse the same way. We depend on the "collective afterlife."

  Elias and his partner, Sarah, had decided six months ago not to have kids. It was a practical choice. Financial, environmental, personal. They were happy. But reading this, Elias felt a cold hollow open up in his chest. If the "afterlife" Scheffler talked about relied on *people*—on biological successors—had Elias just opted out of meaning? Was he building a sandcastle while knowing the tide was coming, just because he didn't want to teach anyone how to swim?

  His phone buzzed again. A work alert. *Server Room B. Urgent.*

  Elias stood up, shoved the phone in his pocket, and tried to shake the feeling that he was already a ghost.

  ***

  Server Room B wasn't really a server room. It was a vault. Elias worked for the Continuity Initiative, a private-public partnership tasked with curating the "Handover." The Handover was the gradual transfer of planetary infrastructure management to the Autonom, a sophisticated, non-biological intelligence system designed to maintain the grid long after human bureaucracy had collapsed.

  The Autonom wasn't Skynet. It was more like a very diligent janitor with godlike access.

  Elias's job was to decide what human context the Autonom needed to keep in its active memory.

  When he arrived, Mara, his project lead, was standing in front of a holographic interface. She looked tired. "We have a bandwidth crisis," she said without turning around. "The Autonom is optimizing for efficiency. It wants to purge the 'Symbolic Redundancy' files to free up processing power for grid maintenance."

  "Define Symbolic Redundancy," Elias said, dropping his bag.

  "Art, history, personal logs, cultural nuance. The stuff that explains *why* we built the grid, not just *how* it works." Mara turned. She knew about Elias's decision not to have kids; everyone did. It was the office elephant. "Scheffler would say this is the end of the world, Elias. If the future exists but has no memory of us, do we matter?"

  "The future is an AI, Mara. It doesn't have a soul. It doesn't care."

  "Exactly. So why are we sending it a library?"

  This was the choice. The system was flagging a specific partition: *Project Hearth.* It was a collection of mundane human artifacts digitized in high fidelity. Not the Mona Lisa. Not the Constitution. It was recordings of people laughing at dinner, the sound of rain on a tin roof, a child's drawing of a dog with three legs, a video of a man teaching his daughter to tie a shoe.

  The Autonom had marked it for deletion. *Utility: Null.*

  "If we let it vanish," Elias said, looking at the glowing list, "the Autonom runs the world perfectly. It keeps the lights on. It keeps the water clean. Humanity survives, technically. But the *reason* disappears."

  "And if we keep it?" Mara asked. "It slows the system down by 0.4%. Negligible for us, but the Autonom flags it as inefficiency. We have to override its core directive. We have to force it to carry dead weight."

  Elias looked at the file labeled *Shoe_Tying_04.mp4*.

  Scheffler's voice echoed in his head. *Our activities would lose their value if we believed there would be no one to come after us.*

  But here was the twist. There *would* be someone. Just not someone with DNA. The Autonom would be the future generation. It would be the entity inheriting the earth.

  "If I delete this," Elias said quietly, "I'm admitting that meaning requires biology. That if there isn't a human eye to see the drawing, the drawing is worthless."

  "Is it?" Mara challenged. "You chose not to have kids, Elias. You chose a future where your bloodline ends. Does that make your work here worthless? Does it make your marriage worthless?"

  It was a low blow, but she meant it kindly.

  Elias stared at the hologram. Scheffler's conjecture hinged on the idea of *humanity* continuing. But maybe Scheffler was too biological. Maybe the "Afterlife" isn't about genetics. Maybe it's about *witnessing*.

  If the Autonom preserves the record of a human laughing, even if it doesn't feel joy the way we do, it acknowledges that joy *happened*. It becomes the guardian of the fact that we existed.

  But then again... if Elias has no kids, who is he doing this for? He won't be there to see the Autonom keep the lights on. He is severing his personal chain.

  "Does Scheffler mean we need descendants?" Elias asked. "Or just successors?"

  "I think he means we need to believe the story continues," Mara said. "Even if we aren't the authors of the next chapter."

  Elias reached out to the interface. His hand hovered over the *Purge* command.

  If he deleted *Project Hearth*, he was agreeing with the fear spiraling in his bedroom. He was agreeing that without biological children, the future is a cold, empty place where human artifacts are just noise. He was agreeing that his life's value was contingent on making a baby.

  But if he saved it... he was asserting that value exists in the *transmission*, not the reception. That the act of caring about the future is enough, even if the future is different than the past.

  "It's not about the AI understanding it," Elias said.

  "No?"

  "No. It's about us admitting that we were here. Scheffler says we need the future to exist for our lives to matter. But maybe... maybe our lives matter because we *willed* the future to exist, regardless of what form it takes."

  Elias tapped *Override*.

  The red warning lights blinked, then settled into a steady green. *File Retained. Efficiency Compromised.*

  "It might not mean anything to the machine," Elias said, feeling the tension in his shoulders loosen, just a fraction. "It might just be data noise to it. But it's not noise to me. And I'm the one living now."

  "So Scheffler was wrong?" Mara asked.

  "Maybe he was just limited. We don't need *our* kids to validate us. We just need to trust that *someone* will hold the torch. Even if the hands holding it aren't human."

  Elias pulled his phone out. He opened his messages to Sarah. He had been avoiding texting her all day, afraid that the philosophical spiral would bleed into their relationship. He typed: *Heading home. Love you.*

  He didn't add anything about kids. He didn't add anything about the future.

  He realized then that the anxiety wasn't about the end of humanity. It was about his own ego wanting to live forever through biology. Scheffler's conjecture was a comfort, but it was also a trap. It made meaning conditional.

  Elias put the phone away. The servers hummed, a low, steady sound. The Autonom was now carrying the weight of a three-legged dog drawing and a video of a shoe being tied. It was inefficient. It was illogical. It was deeply, profoundly human.

  "Let's go," Elias said to Mara. "The grid will hold."

  "You think?"

  "I know," he said. "We built it for them. Whoever 'them' turns out to be."

  Walking out into the cool night air, Elias didn't feel like a ghost. He felt like a bridge. And a bridge doesn't need to walk across itself to be useful. It just needs to stand.
