answer: |-
  **Scenario**
  A digital archive migration team processes server logs in strict sequential order (ID #1, #2, #3…). The migration script is written to halt immediately upon encountering the first corrupted file; all subsequent files remain unprocessed and unobserved. The team has successfully migrated files #1 through #500. Every migrated file observed so far is Valid. The team must now predict the status of file #501 without opening it (which would trigger the halt).

  **Predicates**
  1.  **Valid**: $x$ is Valid.
  2.  **Valid\***: $x$ is Valid if ID($x$) $\le$ 500, else Corrupt.
      *   *Indexing:* Indexed to observation order (ID number). This matters because the *stopping rule* is defined by the sequence, not a clock time.
      *   *Extensions:* On observed data (IDs 1–500), both predicates apply to every item. On unobserved items (ID 501+), they disagree.

  **Constraint Check**
  *   **Realistic:** Standard IT audit procedure; no sci-fi or demons.
  *   **Same extension on data:** All observed files (1–500) are both Valid and Valid*.
  *   **Positional wins:** A competent reasoner projects Valid*. File #501 is Corrupt (otherwise the script wouldn't have stopped before processing it).
  *   **No cheap routes:** Files do not change at 500. The "switch" is in the *access protocol*, not the files. Predicates are logically interdefinable (like Green/Grue). Vocabulary is new (Valid/Valid*), neutralizing prior entrenchment.
  *   **Structural reason:** The winning factor is the *stopping rule* (sampling bias), not a worldly change in file integrity. This leverages Goodman's overhypothesis: the sample is representative only of the "pre-halt" population.
  *   **Unreachable pre-$t$:** Before ID 501 is encountered, no observation confirms the halt condition; the data is consistent with "All Files Valid."

  **Analysis**
  *   **Working Feature:** The **Stopping Rule**. The evidence gathering process is conditional on the property being predicted.
  *   **Remove Feature:** If files were sampled randomly (no halt on corruption), Valid would win; the correlation between ID and Status would vanish.
  *   **Entrenchment Objection:** A strict entrenchment theorist argues "Valid" is still projectible because "Valid*" is disjunctive. They would claim the stopping rule is merely background knowledge, not a reason to alter projectibility standards themselves.
  *   **Honesty Check:** Is "Sampling" just "Mechanism"? Technically, yes. The script halting is a mechanism operating at $t$. However, it is a mechanism of *observation*, not *ontology*. The files don't rot at #501; our access to them ceases. This satisfies your constraint against "world changing underneath" while acknowledging that structural constraints on evidence are functionally equivalent to physical constraints on prediction. The case holds, but only because we distinguish between *being* Corrupt and *being observed as* Corrupt.
