answer: |-
  **The Scenario**

  During a sudden surge in ICU admissions, Elena, a senior hospital administrator known for her practical wisdom and deep contextual knowledge of her staff, overrides the automated triage protocol to prioritize a patient with a marginally lower severity score because she knows the attending physician has a unique, high-success track record with similar complex cases. Her colleague, Mark, adheres strictly to the protocol, allocating the bed to the patient with the highest objective severity score regardless of physician specialization. Due to a bureaucratic silo, Elena's access to the central pharmacy database is lagged by twelve hours during the surge, hiding a critical drug shortage that renders the specialized physician's preferred treatment protocol impossible to execute safely. Mark's patient receives standard care that works despite lower odds, while Elena's patient deteriorates rapidly due to the unavailable medication, resulting in preventable harm that would have been avoided had the blunt protocol been followed.

  **The Analysis**

  **Virtue Ethics Verdict:**
  A standard Aristotelian response classifies this as a case of *moral luck*, specifically resultant luck. The virtue of *phronesis* (practical wisdom) is defined by the quality of the deliberation and the intention to hit the mean, not by infallible outcomes. Elena correctly perceived the relevant moral feature (physician expertise) but was thwarted by an external variable outside her epistemic reach. The trait remains intact because virtue is a disposition to act rightly given the information available to the agent; the failure lies in the world, not the character. The trait is not undermined because *phronesis* does not guarantee success in hostile environments, only that the agent is doing the best possible reasoning within their constraints.

  **Situationist Verdict:**
  Doris-style situationism argues this demonstrates the fragility of global character traits. If Elena's "virtue" disappears or becomes harmful under specific structural pressures (time lag + info silo), it wasn't a robust character trait to begin with, but rather a behavioral pattern contingent on favorable situations. Attributing the initial decision to "character" is a post-hoc rationalization (the Fundamental Attribution Error); the outcome was determined by the bureaucratic variable (database lag), not Elena's wisdom. The fact that the rule-follower won suggests that in this specific institutional context, "virtue" is less predictive of good outcomes than rigid compliance, undermining the claim that virtue is a stable explanatory construct.

  **The Crucial Feature:**
  The work is done entirely by the **information asymmetry created by the bureaucratic silo combined with time pressure**. If you remove the database lag, Elena's wisdom wins (she knows the physician is better). If you remove the time pressure, Elena verifies the drug supply and wins. If you remove the silo, the info is symmetric. Without this specific structural glitch, the case collapses into a boring standard example where virtue outperforms blind rule-following. The thought experiment only functions because the environment is rigged to punish the extra information processing that *phronesis* requires.

  **Virtue Ethicist Dissolution:**
  A sophisticated virtue ethicist would likely dissolve the case by arguing that true *phronesis* includes meta-cognitive knowledge of its own limits within corrupted systems. They would argue Elena failed not because virtue misfired, but because her practical wisdom was incomplete: a truly *phronimos* administrator would have known that during a surge, institutional data reliability drops, and should have defaulted to the protocol or verified the drug supply differently. Alternatively, they would shift the blame to **institutional vice**: the hospital administration is vicious for creating silos that prevent the exercise of practical wisdom. The failure isn't that virtue is unreliable, but that the institution is structured to make virtue impossible, meaning the "harm" is a symptom of organizational vice, not individual character failure.
