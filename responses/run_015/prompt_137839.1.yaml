answer: |-
  This is a classic problem in *pramāṇa-śāstra*: the tension between *anadhigatatva* (novelty), *yāthārthya* (truth), and *karana* (instrumental cause). Your current draft principle is a hybrid of Western reliabilism and Nyāya realism, which is why it's bleeding at the seams. Specifically, your verdict on the **Sloppy Doctor** contradicts your verdict on the **Broken Thermometer** under your own clause (b). Both are instances where a generally reliable source delivers truth via a defective token process.

  If you want to keep your verdicts, you cannot use a simple "defect-free process" clause. You need a principle that distinguishes between *instrumental breakdown* and *agent competence*.

  Here are three candidate principles, ranked by how much they force you to revise your intuitions versus how much they complicate the theory.

  ### Candidate 1: The Causal-Fit Principle (Non-Accidental Truth)
  **Principle:** A cognition is knowledge-producing iff (a) it is true, (b) it arises from a causal chain where the object itself (or its trace) is a necessary link in producing the cognition, and (c) there is no *upādhi* (defeating condition) that severs the link between the sign and the signified.

  *   **Motivation:** This targets the **Mist/Smoke** and **Broken Thermometer** cases. In both, the truth is accidental. The fire didn't cause the mist-cognition; the reading didn't cause the temperature fact.
  *   **The Repair:** It handles the **Keys vs. Spirit** distinction via *yogyatā* (fitness). Keys have the fitness to be perceived/absent; spirits do not. The causal chain for the spirit cannot exist, so the cognition is inherently defective.
  *   **The Cost:**
      *   **The Sloppy Doctor:** This is the danger zone. If the doctor's reasoning is sloppy, did the *facts of the disease* cause the diagnosis, or did the doctor's guess? To save this verdict, you must argue the doctor's "sloppiness" is merely explicit reporting on a subconscious, causally tight pattern recognition. If the reasoning *itself* is the cause, this principle forces you to drop the Doctor verdict.
      *   **Memory & Second Look:** Fails clause (c) or (b). Memory lacks the object as a present causal link (it's a trace). The Second Look is redundant. You must drop these as *pramā*.
  *   **Predictions:**
      *   **New Instrument:** Knowledge, provided the physical mechanism links to the fact (even if uncalibrated by *you*, if the physics holds).
      *   **Parent/Child:** Not knowledge if the parent is guessing. Knowledge if the parent has implicit access to the truth (e.g., they saw it happen).
      *   **Photograph:** Knowledge. The light from the object causally produced the image.
      *   **Conflict:** The cognition with the tighter causal link wins. If both are equal, suspension of judgment (*saṃśaya*).

  ### Candidate 2: The Competence-Without-Defeaters Principle (Virtue-Theoretic)
  **Principle:** A cognition is knowledge-producing iff (a) it is true, (b) it is generated by a source possessing a stable disposition (*saṃskāra*) to yield truth in this domain, and (c) that disposition was not actively neutralized in the instance by a specific defect (*doṣa*).

  *   **Motivation:** This is designed to save the **Sloppy Doctor** while killing the **Broken Thermometer**.
      *   *The Fix:* The Doctor possesses a stable competence (expertise). The sloppy reasoning is a surface error, but the underlying disposition (pattern recognition) remained active. The Broken Thermometer lacks the physical disposition entirely; its "track record" is historically good but ontologically broken in this instance.
      *   *The Fix:* **Airline App.** The "source" is the network. If the network has a stable disposition, it counts, even if you can't confront a speaker. This dissolves the need for a seventh *pramāṇa*.
  *   **The Cost:**
      *   **Baroque Complexity:** You now have to define "Disposition" differently for agents (psychological) vs. instruments (physical).
      *   **Chatbot:** Leaning Not Knowledge becomes hard. If the chatbot is statistically reliable, does it have a "disposition"? You must stipulate that *pramāṇa* requires *intentionality* or *accountability* in the source, which adds a clause.
      *   **Novelty:** You must drop clause (c) from your draft. This principle allows **Memory** and **Second Look** to count as knowledge (which matches your verdicts but contradicts classical Nyāya).
  *   **Predictions:**
      *   **New Instrument:** Knowledge, if the *type* of instrument is reliable, even if this token is uncalibrated (assuming no specific defect).
      *   **Parent/Child:** Knowledge. The parent has the disposition of a caretaker/witness, even if not an "expert."
      *   **Photograph:** Knowledge (instrumental extension of perception).
      *   **Conflict:** Whichever source has the higher degree of stable competence in that specific context.

  ### Candidate 3: The Strict Nyāya Orthodoxy (The Purist)
  **Principle:** A cognition is knowledge-producing (*pramā*) iff (a) it is true, (b) it is generated by a valid *pramāṇa* (Perception, Inference, Comparison, Testimony), (c) it is *anadhigata* (previously unknown), and (d) in the case of Testimony, the source is an *āpta* (trustworthy person with direct knowledge).

  *   **Motivation:** Consistency with the tradition you are teaching. It cleans up the **Chatbot** and **App** cases immediately.
  *   **The Cost:**
      *   **Sacrificial Lambs:** You must drop **Memory** (Nyāya explicitly calls *smṛti* non-*pramā*). You must drop the **Second Look** (redundant). You must drop the **Sloppy Doctor** (if the *hetu* is flawed, it is *hetvābhāsa*, pseudo-inference, regardless of truth).
      *   **App/Chatbot:** The App is knowledge only if traceable to a person. The Chatbot is not knowledge (no *āpta*).
  *   **Predictions:**
      *   **New Instrument:** Perception (if direct) or Inference (if indirect). Valid if the instrument is known to be reliable (*vyāpti* established).
      *   **Parent/Child:** Testimony. Valid only if the parent actually knows the fact.
      *   **Photograph:** Perception (of the image) leading to Inference (of the subject).
      *   **Conflict:** *Bādhā* (subration). The stronger *pramāṇa* subrates the weaker (e.g., Perception subrates Inference).

  ---

  ### The Verdict on Your "Mess"

  Your verdicts are not a mess; they are **Prābhākara Mīmāṃsā** leaning into **Virtue Epistemology**.
  *   **Prābhākara:** They argue memory *is* a form of knowledge (just re-cognition). They also have a robust theory of *Arthāpatti* (postulation) for the Devadatta case.
  *   **Virtue Epistemology:** This is the only way to save the Sloppy Doctor without making the principle ad hoc.

  **The Sacrificial Lamb:**
  You have to choose between the **Broken Thermometer** and the **Sloppy Doctor**. They are structurally identical under a reliabilist framework (Reliable Type + Defective Token + True Output).
  *   If you keep the **Doctor** as knowledge, you must admit that *pramāṇa* status resides in the **Agent's Capacity**, not the **Process Token**. This forces you to accept that the Thermometer is different because it has no "capacity" apart from its mechanics.
  *   If you keep the **Thermometer** as non-knowledge (which feels right), you must classify the Doctor's sloppy reasoning as a *defect* that nullifies knowledge, regardless of the diagnosis.

  **My Recommendation for the Seminar:**
  Adopt **Candidate 2 (Competence-Without-Defeaters)** but add a **Constraint on Source Ontology**.

  **Revised Principle:**
  > A cognition is knowledge-producing iff (1) it is true, (2) it arises from a source with a stable truth-tracking disposition appropriate to the object's category, (3) that disposition was not neutralized by a specific defect in the instance, and (4) the source is ontologically capable of bearing responsibility for the truth (excludes chatbots/broken tools).

  **How this handles your friction points:**
  1.  **Doctor vs. Thermometer:** The Doctor has a "truth-tracking disposition" (expertise) that can survive minor procedural errors (heuristics). The Thermometer's disposition *is* its mechanics; if mechanics fail, disposition is gone.
  2.  **Keys vs. Spirit:** Keys are in the category of "perceptible absences." Spirits are not. The source (vision) is not "appropriate to the object's category" for spirits. (Clause 2).
  3.  **Memory/Second Look:** Clause 3 allows this if you view memory as a disposition that wasn't neutralized. However, to stay Nyāya-adjacent, you might note that while it is *knowledge*, it is not *fresh knowledge* (*pramā*), distinguishing *yathārtha-jñāna* (true cognition) from *pramā* (instrumental knowledge). This lets you keep the verdict without breaking the syllabus.
  4.  **Chatbot:** Fails Clause 4. No responsibility/agency.
  5.  **App:** Passes Clause 4 (traceable to operations/people).

  **Predictions for your unlisted cases:**
  *   **New Instrument:** Knowledge (if physics holds), but *confidence* is low until calibrated. (Distinguish *knowledge* from *certainty*).
  *   **Parent/Child:** Knowledge (Parent is an agent with responsibility/access).
  *   **Photograph:** Knowledge (Instrumental Perception).
  *   **Conflicting Pramāṇas:** *Saṃśaya* (doubt) until one is subrated by a third source or one is shown to have a specific defect (Clause 3).

  **Final Advice:**
  Tell your students: "Nyāya excludes memory and redundant cognition to keep *pramāṇa* focused on *discovery*. But if we care about *warrant*, we might include them." Make the tension between **Discovery** (Novelty) and **Warrant** (Truth-Conductivity) the theme of the unit. That resolves your board-work anxiety: you aren't writing *the* principle; you are writing *a* principle that highlights a specific philosophical choice.
