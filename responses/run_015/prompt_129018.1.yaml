answer: |-
  You have identified a critical fault line in social policy design that sits at the intersection of political philosophy, public administration, and ethics. While there is no single, canonical philosophical term that functions exactly like "moral hazard" or "free rider," there is a robust conceptual framework describing this dynamic.

  The distinction you are looking for is best captured by the tension between **Substantive Desert** and **Procedural Eligibility**, often analyzed in contemporary literature under the headings of **Administrative Burden**, **Epistemic Injustice**, and **Structural Exclusion**.

  Here is a breakdown of the conceptual tools available to your task force, how they distinguish the two populations you described, and where this sits relative to standard welfare debates.

  ### 1. The Philosophical Distinction: Substantive vs. Performative Desert

  In desert theory (e.g., Feinberg, Sher, Kagan), a claim to a benefit relies on a **base** (the characteristic that makes one deserving).
  *   **Substantive Desert:** The stated base of your policy is *need* combined with *willingness to reciprocate*. A person is deserving if they lack housing and are willing to work/serve.
  *   **Procedural Eligibility (or Performative Desert):** The *actual* base required to receive the benefit is *administrative capacity*. A person is deserving only if they can navigate the verification architecture.

  **The Conceptual Tool:** **The Mismatch of Desert Bases.**
  Philosophically, this is an **illicit substitution of the desert base**. The policy claims to reward *economic need + civic willingness*, but it actually rewards *literacy + organizational stability + time abundance*. When a recipient loses benefits due to a clerical error, they have not failed the substantive test (they are still needy and willing); they have failed a proxy test that correlates imperfectly with the substantive goal.

  In the literature on **Procedural Justice** (Rawls, Leventhal), this violates the principle of **Accuracy**. A just procedure is one that reliably produces the correct substantive outcome. If the procedure systematically excludes the substantively deserving, it is not merely "imperfect procedural justice" (where we accept some error); it is **systematically biased procedural injustice**.

  ### 2. The Policy Science Framing: Administrative Burden & Churn

  If you need terminology that resonates with economists and policy analysts on your task force, the standard framework comes from the work of Pamela Herd and Donald Moynihan (*Learning from Ignorance*, 2018).

  *   **Administrative Burden:** They define this as the learning, compliance, and psychological costs citizens face when interacting with the state. You have designed a high-compliance cost system.
  *   **Type II Error (False Negative):** In social protection, a Type I Error is giving money to someone ineligible (fraud/waste). A Type II Error is denying money to someone eligible (exclusion). Your system is optimized to minimize Type I Errors at the expense of massive Type II Errors.
  *   **Administrative Churn:** This is the specific term for the dynamic you described. It refers to eligible individuals cycling on and off benefits not because their economic status changes, but because they fail procedural hurdles and then re-apply later. This is costly for the state and devastating for the recipient.

  **The Distinction:**
  *   **Standard Welfare Debate:** Focuses on *Moral Hazard* (people choosing not to work because benefits are too generous).
  *   **Your Situation:** Focuses on *Capacity Constraints* (people wanting to comply but lacking the cognitive bandwidth, time, or stability to do so). This is not a failure of *will* (which conditionality targets); it is a failure of *capability* (which conditionality punishes).

  ### 3. The Ethical Framing: Epistemic and Structural Injustice

  To capture the moral weight of "rendering someone undeserving," you can draw on critical social philosophy.

  **A. Epistemic Injustice (Miranda Fricker)**
  This occurs when someone is wronged in their capacity as a knower.
  *   **Testimonial Injustice:** The bureaucracy treats the applicant's word (e.g., "I sent the form," "I have a barrier") as less credible than the absence of a signature.
  *   **Hermeneutical Injustice:** The recipient lacks the resources to make their experience intelligible to the system. They cannot translate their complex life instability into the rigid categories of the form.
  *   **Application:** The system creates a **Hermeneutical Gap**. The "undeserving" label is applied because the system cannot "see" the compliance that actually occurred, only the documentation that is missing.

  **B. Structural Injustice (Iris Marion Young)**
  Young distinguishes between *liability* (individual blame) and *structural injustice* (harm produced by many actors following rules).
  *   The recipients are not "undeserving" in a moral sense; they are victims of **structural disqualification**. The harm is not caused by a malicious bureaucrat but by the cumulative effect of rules that assume a level of stability the population does not possess.
  *   **Concept:** **Administrative Violence.** This term is increasingly used in critical policy studies to describe when bureaucratic processes inflict harm (homelessness, hunger) not through intent, but through friction.

  ### 4. Positioning Relative to Welfare Debates

  You asked where this sits relative to fraud, moral hazard, and conditionality. Here is the mapping:

  | Concept | Standard Definition | Your Case |
  | :--- | :--- | :--- |
  | **Moral Hazard** | Incentives cause behavioral change (e.g., working less to keep benefits). | **Irrelevant.** The recipients intend to comply and work; the friction prevents the *proof*, not the *act*. |
  | **Fraud** | Intentional deception to gain benefits. | **Inverse Fraud.** This is **Involuntary Non-Compliance.** The recipient is honest but disorganized; the system treats them as dishonest. |
  | **Conditionality** | Benefits tied to behavior to ensure reciprocity. | **Misplaced Reciprocity.** Reciprocity is owed to the *community* (labor/service), but the gatekeeping condition is owed to the *bureaucracy* (paperwork). |
  | **Deservingness** | Based on need and conduct. | **Bifurcated.** They are *substantively* deserving but *procedurally* undeserving. |

  ### 5. Recommended Terminology for the Task Force

  To shift the debate within your task force, I recommend adopting the following distinctions:

  1.  **Distinguish "Eligibility" from "Access."**
      *   *Argument:* "We have confused statutory eligibility (who the law says gets help) with administrative access (who can successfully navigate the system). We are creating a population that is eligible by law but inaccessible by design."
  2.  **Invoke "False Exclusion" (Type II Error).**
      *   *Argument:* "Current metrics measure program integrity by how much money we save. We need to measure integrity by our **exclusion error rate**. How many genuinely needy people are we pushing out?"
  3.  **Reframe Reciprocity.**
      *   *Argument:* "True reciprocity is the work or training. The paperwork is not reciprocity; it is **audit**. We are punishing failure to audit as if it were failure to reciprocate."
  4.  **Use the Term "Procedural Disqualification."**
      *   This is the precise phrase for your phenomenon. It distinguishes those disqualified for *cause* (refusing work) from those disqualified for *process* (missing a deadline).

  ### Summary
  The philosophical distinction exists, though it is often siloed. In political philosophy, it is the gap between **Substantive Justice** and **Procedural Justice**. In public administration, it is the gap between **Entitlement** and **Take-Up**. In ethics, it is a form of **Epistemic Injustice**.

  The individuals you describe are not "undeserving." They are **procedurally disqualified**. Recognizing this distinction moves the problem from the *character of the recipient* (which conditionality targets) to the *capacity of the system* (which redesign must target). If the goal is to assist the needy, a system that filters out the needy via paperwork is functionally failing its own mandate, regardless of its theoretical soundness.
