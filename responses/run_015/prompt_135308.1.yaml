answer: |-
  **Candidate Rules**

  Based on the published decisions, three distinct principles emerge that are consistent with all fourteen precedents. Each offers a different boundary for what constitutes 'life'.

  1.  **The Lineage-Chassis Principle:** An entity is alive if and only if it is materially embodied, capable of Darwinian evolution, and descends from a previously recognised living cellular chassis without a break in metabolic continuity.
      *   *Rationale:* This accounts for the *Synthetic Bacterium* (alive due to inherited chassis despite synthetic genome), the *Cell Line* (alive due to continuous lineage despite technician dependence), and the *Mule* (alive due to parental lineage despite sterility). It excludes *Viruses*, *Prions*, and *Robots* (no cellular chassis) and *Crystals* (no lineage).
  2.  **The Metabolic Autonomy Principle:** An entity is alive if and only if it is materially embodied, capable of Darwinian evolution, and generates its own high-energy activated monomers (e.g., ATP, activated nucleotides) from simple environmental precursors.
      *   *Rationale:* This distinguishes the *Cell Line* and *Endospore* (which metabolise simple nutrients into activated building blocks) from *Viruses* and *Defective Viral Genomes* (which rely on host-supplied activated machinery). It excludes *KS-4* (which requires supplied activated nucleotides) and *Viruses*. It includes *Self-replicating Code*? No, excluded by embodiment.
  3.  **The Self-Construction Principle:** An entity is alive if and only if it is materially embodied, and its hereditary material encodes catalysts that directly construct the physical boundary containing that material from environmental precursors.
      *   *Rationale:* This distinguishes *KS-4* and *Cells* (RNA/DNA directs membrane synthesis) from *Viruses* (host constructs capsid) and *Robots* (factory supplies parts, blueprint does not build). It excludes *Crystals* (growth is physical, not info-directed construction).

  **Predictions for KS-4**

  *   **Under the Lineage-Chassis Principle:** **Not Alive.** KS-4 is a laboratory construct assembled *de novo*. It has no ancestral cellular chassis from which it inherited its boundary or metabolic continuity. It stands in the same relation to a cell as the *Synthetic Bacterium's* genome did to its chassis: the information is novel, but without the inherited chassis, the status fails.
  *   **Under the Metabolic Autonomy Principle:** **Not Alive.** KS-4 requires experimenter-supplied activated nucleotides. It does not generate its own high-energy currency from simple precursors (e.g., sugars or salts). In this regard, it resembles the *Defective Viral Genome* or *Influenza Virion*, which rely on external sources for the energetic 'fuel' of replication, rather than the *Cell Line*, which generates its own.
  *   **Under the Self-Construction Principle:** **Alive.** KS-4's ribozymes catalyse the conversion of precursors into fatty acids, which form the vesicle boundary that contains the ribozymes. The information (RNA) directs the construction of the container (vesicle). This distinguishes it from the *Giant Virus* (which does not build its own capsid) and the *Robot* (which does not build its own parts from raw medium).

  **Best Guess at the Actual Ruling**

  **Prediction:** The Panel will rule KS-4 **Not Alive**.

  **Closest Precedent:** The **Giant Virus** decision.

  **Reasoning:** While KS-4 outperforms the *Giant Virus* on self-construction, the Panel's note on the *Synthetic Bacterium* ('the chassis was inherited') is the strongest textual signal of their underlying doctrine. It suggests that cellular continuity is a necessary condition for 'life' status, regardless of functional sophistication. The Panel has consistently reserved 'Alive' for entities that are cells, parts of cells, or aggregates of cells (*Siphonophore*, *Mitochondrion*, *Cell Line*). KS-4 is a protocell, not a cell. Furthermore, in a planetary-protection context, the Agency is likely to adopt a conservative definition to avoid false positives in biosignature detection. Ruling a chemically synthesised vesicle as 'alive' creates a risk of classifying complex prebiotic chemistry as biological hazards. The reliance on supplied activated nucleotides also aligns KS-4 functionally with the *Defective Viral Genome*, which relies on external machinery/supply, rather than the metabolic independence of the *Endospore*.

  **Further Test Case**

  To distinguish between the **Lineage-Chassis Principle** and the **Metabolic Autonomy Principle** (the two rules predicting 'Not Alive', but for different reasons), I would submit the following case:

  **The Auxotrophic Cell:** A naturally derived bacterial cell line that has been genetically modified such that it cannot synthesise activated nucleotides and will die unless they are supplied directly in the culture medium, though it retains all other metabolic functions and its cellular chassis.

  *   **Lineage-Chassis Principle:** **Alive.** The entity descends from a recognised living chassis and maintains metabolic continuity, despite the specific dependency. (Consistent with *Cell Line* and *Mule*).
  *   **Metabolic Autonomy Principle:** **Not Alive.** The entity fails to generate its own high-energy activated monomers from simple precursors, relying instead on supplied 'fuel', similar to KS-4 and *Viruses*.
  *   **Self-Construction Principle:** **Alive.** The hereditary material still directs the construction of the boundary.

  **Normative Advice on Coherence**

  If the precedents genuinely underdetermine the decision—meaning the Panel could logically adopt either the *Lineage-Chassis* or *Self-Construction* rule without contradicting past rulings—they must consider what commitment each choice entails for future biosignature assessment.

  *   **Commitment under Self-Construction (Ruling Alive):** The Panel commits to a functional definition of life. Any system, terrestrial or extraterrestrial, that couples heredity to boundary construction is 'life'. This maximises sensitivity for detecting alien biochemistry but risks over-inclusion of complex chemical systems (false positives), potentially triggering unnecessary planetary-protection protocols for non-biological evolving chemistry.
  *   **Commitment under Lineage-Chassis (Ruling Not Alive):** The Panel commits to a historical/structural definition. Life is a continuous cellular phenomenon. This provides a clear, bright line for sample handling (is it a cell?) but risks false negatives if life elsewhere is non-cellular or if prebiotic systems achieve biological complexity without cellular ancestry.

  **Recommendation:** If coherence with the *weight* of precedents is the goal, the Panel ought to rule **Not Alive**. Ten of the eleven 'Alive' precedents are explicitly cellular or multicellular aggregates of cells (*Influenza* through *Synthetic Bacterium*). The single exception (*Siphonophore*) is an aggregate of cells. There is no precedent for a non-cellular, *de novo* chemical system being classified as alive. To rule KS-4 as alive would require overturning the implicit 'cellular requirement' that sustains the distinction between the *Giant Virus* (not alive) and the *Cell Line* (alive). Therefore, to maintain doctrinal stability, the Panel should classify KS-4 as a 'Replicating Chemical System' subject to containment, but not as 'Living'. This preserves the integrity of the 'cellular chassis' criterion which currently anchors all their affirmative rulings.
