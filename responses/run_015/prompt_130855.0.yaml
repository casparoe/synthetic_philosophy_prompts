prompt: |-
  I serve on the review board of a journal that publishes empirical work at the intersection of cognitive neuroscience and philosophy of mind, and we repeatedly receive manuscripts asserting mental-state causation—claims that belief, attention, or anxiety cause neural or behavioral outcomes—without addressing whether those mental properties are already causally excluded by the physical properties with which they covary. I need a reusable evaluation procedure I can run in about thirty minutes per submission, designed for a reviewer with solid scientific literacy but no specialist training in metaphysics. The procedure should operationalize Kim’s causal exclusion argument together with the principal non-reductive responses—supervenience without reduction, the possibility of non-strict mental laws, and the Woodward-style interventionist test for causal relevance—while being explicit about where mechanical rules end and a judgment call begins. Structure it as an ordered flow of diagnostic questions: for each step, specify what counts as a sufficient answer, where a negative answer stops the evaluation with a verdict that the mental causal claim is redundant, where it stops with a verdict that exclusion is avoided, and where the issue is conceptual rather than empirical and must be flagged for a specialist. Include two worked applications to hypothetical submissions: first, a study arguing that conscious intention introduces a novel causal pathway in motor-cortex dynamics that cannot be reconstructed from prior neural states alone; second, a study that attributes anxiety-driven avoidance behavior solely to amygdala activation, using “anxiety” only as a descriptive label for the neural pattern. For each case, run the full procedure, identify the feature doing the work, note how a defender of mental causation could attack the evaluation, and state clearly what the procedure cannot settle without further metaphysical commitment.
reasoning: |-
  Here's a thinking process that leads to the suggested evaluation procedure:

  1.  **Analyze the Request:**
      *   **User Role:** Review board member of a journal at the intersection of cognitive neuroscience and philosophy of mind.
      *   **Problem:** Manuscripts assert mental-state causation (belief, attention, anxiety cause X) without addressing causal exclusion (physical properties already do the work).
      *   **Goal:** A reusable evaluation procedure (checklist/flowchart style) runnable in ~30 minutes.
      *   **Target Audience:** Reviewer with scientific literacy but *no specialist training in metaphysics*.
      *   **Key Content:** Operationalize Kim's Causal Exclusion Argument + principal non-reductive responses (supervenience, non-strict laws, Woodwardian interventionism).
      *   **Requirements:**
          *   Ordered flow of diagnostic questions.
          *   Specify sufficient answers.
          *   Specify stop conditions (Verdict: Redundant vs. Verdict: Exclusion Avoided vs. Flag for Specialist).
          *   Distinguish mechanical rules from judgment calls.
          *   Two worked applications (Hypothetical Case 1: Conscious intention/motor cortex; Hypothetical Case 2: Anxiety/amygdala label).
          *   For each case: Run procedure, identify working feature, note potential attacks, state limitations.

  2.  **Deconstruct the Philosophical Core:**
      *   *Kim's Exclusion Argument:* If physical cause $P$ is sufficient for effect $E$, and mental cause $M$ supervenes on $P$, then $M$ is excluded unless $M$ is identical to $P$ (reduction) or there's overdetermination (usually rejected).
      *   *Non-Reductive Responses:*
          1.  *Supervenience without Reduction:* $M$ depends on $P$ but isn't $P$. (Kim says this leads to exclusion).
          2.  *Non-Strict Laws:* Mental causation doesn't need strict physical laws (Davidson's Anomalous Monism).
          3.  *Interventionism (Woodward):* $M$ causes $E$ if intervening on $M$ changes $E$, holding other relevant variables fixed (even if $M$ supervenes on $P$).
      *   *The Challenge:* How to translate these abstract metaphysical debates into a 30-minute checklist for a scientist?

  3.  **Drafting the Procedure (The "Mental Causation Audit"):**
      *   *Time Limit:* 30 minutes means it can't be deep metaphysics. It needs to focus on *claims made in the text* and *methodological implications*.
      *   *Step 1: Identification.* Does the paper actually claim mental causation or just correlation?
      *   *Step 2: The Physical Sufficiency Check (Kim's Premise).* Do they acknowledge the physical substrate is causally sufficient?
      *   *Step 3: The Distinctness Check.* Do they treat the mental property as distinct from the physical property?
      *   *Step 4: The Interventionist Test (Woodward).* Do they provide evidence that manipulating the mental state (independently of the specific physical realization) changes the outcome?
      *   *Step 5: The Explanatory Role.* Does the mental term add predictive or explanatory power beyond the physical description?
      *   *Decision Points:* Need clear "Stop/Pass/Flag" criteria.

      *Refining the Steps for the User's Constraints:*
      *   Need to explicitly mention Kim, Supervenience, and Woodward.
      *   Need to distinguish between "Scientifically Resolvable" and "Metaphysically Resolvable."
      *   *Crucial Constraint:* The reviewer is *not* a metaphysician. The procedure must prevent them from making metaphysical rulings they aren't qualified to make, while still catching lazy exclusion violations.

      *Revised Flow:*
      1.  *Claim Classification:* Is it causal or descriptive?
      2.  *Physical Closure Acknowledgement:* Do they ignore the neural cause?
      3.  *Realization Independence (Interventionism):* Can the mental vary without *that specific* neural pattern varying (multiple realizability)?
      4.  *Explanatory Gain:* Does the mental vocabulary do work the neural vocabulary can't?
      5.  *Metaphysical Commitment Flag:* Where do they assume a solution to exclusion without arguing for it?

  4.  **Developing the Worked Examples:**
      *   *Case 1 (Intention/Motor Cortex):* Claims intention adds a pathway *not* reconstructable from prior neural states. This is a strong claim (dualism-ish or emergentism). It likely triggers the "Flag for Specialist" because it challenges physical closure.
      *   *Case 2 (Anxiety/Amygdala):* Uses "anxiety" as a label for amygdala activation. This is reductionist/eliminativist. It avoids exclusion by identity, but might be guilty of misleading labeling. It should pass the exclusion check but fail the "distinctness" check if they claim mental causation *over* neural causation.

  5.  **Refining the Output Structure:**
      *   **Introduction:** Context and limitations.
      *   **The Protocol (MCA-30):** The step-by-step flow.
      *   **Decision Matrix:** How to interpret the results.
      *   **Worked Example 1:** Intention/Motor.
      *   **Worked Example 2:** Anxiety/Amygdala.
      *   **Limitations Statement:** What this tool cannot do.

  6.  **Self-Correction/Polishing during Drafting:**
      *   *Critique:* Is 30 minutes realistic?
      *   *Fix:* Emphasize that the reviewer scans for specific keywords and methodological descriptions, not reading the whole paper deeply for this specific check.
      *   *Critique:* Is the metaphysics accurate?
      *   *Fix:* Ensure the distinction between *causal relevance* (interventionist) and *causal production* (mechanistic) is clear, as this is where Woodward helps bypass Kim.
      *   *Critique:* The prompt asks for "where mechanical rules end and judgment call begins."
      *   *Fix:* Add explicit "Reviewer Judgment" boxes in the protocol.
      *   *Critique:* The prompt asks to operationalize "supervenience without reduction" and "non-strict laws."
      *   *Fix:* These are hard to test empirically in 30 mins. I need to translate them into textual checks. E.g., "Non-strict laws" -> "Do they claim the mental-physical link is contingent or variable?" "Supervenience" -> "Do they acknowledge neural necessity?"

      *Wait, a key constraint:* "where a negative answer stops the evaluation with a verdict that the mental causal claim is redundant."
      *   If they claim mental causation but admit physical sufficiency and offer no interventionist independence -> Redundant (Epiphenomenalism).
      *   If they claim mental causation and deny physical sufficiency -> Flag for Specialist (Violates standard neuroscience assumptions).
      *   If they show interventionist independence -> Exclusion Avoided (via Woodward).

  7.  **Finalizing the Content (Mental Check against Prompt):**
      *   30 mins? Yes, focused checklist.
      *   Scientific literacy, no metaphysics? Yes, terms explained operationally.
      *   Kim + Non-reductive responses? Yes, integrated into steps.
      *   Woodward? Yes, Step 3.
      *   Two worked examples? Yes.
      *   Identify feature doing work? Yes.
      *   Defender attacks? Yes.
      *   Limitations? Yes.

  8.  **Drafting the Response:** (Proceeding to generate the text based on these thoughts.) *Self-correction: Ensure the tone is professional, suitable for a review board document.* *Make sure the distinction between 'Redundant' and 'Flag' is sharp.* *Ensure the 'Anxiety' case is handled carefully—it's likely a case of 'Exclusion Avoided via Identity' but potentially misleading.*

      *Refining Case 2:* If they use "anxiety" *solely* as a label for amygdala activation, they are effectively reducing. Kim's argument doesn't kill reduction; it kills *non-reductive* causation where the physical is already sufficient. So if they say "Anxiety (read: Amygdala) causes avoidance," exclusion is avoided because M=P. But if they say "Anxiety causes avoidance *via* Amygdala," that's problematic. I will construct the hypothetical to be the "label only" version to show how it passes exclusion but might be semantically misleading.

      *Refining Case 1:* "Cannot be reconstructed from prior neural states." This implies a violation of physical causal closure. This is a huge metaphysical claim. This must be flagged.

      *Let's build the "Mental Causation Audit (MCA-30)"*

      *(Self-Correction during drafting Step 3)*: Woodward's interventionism requires holding fixed the supervenience base. In neuroscience, you can't intervene on Mental without intervening on Neural. So the test is: Does the *definition* of the mental variable allow for multiple realizations? If yes, intervention on the *class* of realizations counts. I need to simplify this for the reviewer. "Does the study treat the mental state as multiply realizable?"

      *Okay, ready to write.*
answer: |-
  # The Mental Causation Audit (MCA-30)
  **A Review Procedure for Cognitive Neuroscience Manuscripts**

  **Purpose:** To assist reviewers in evaluating manuscripts that assert mental-state causation (e.g., "belief causes activation," "attention modulates behavior") without addressing the Causal Exclusion Problem.
  **Time Requirement:** ~30 minutes (after reading the main claims and methods).
  **Reviewer Profile:** Scientific literacy required; specialist metaphysics training *not* required.
  **Philosophical Basis:** Operationalizes Jaegwon Kim's Exclusion Argument, Non-Reductive Physicalism, and James Woodward's Interventionism.

  ---

  ## Part 1: The Diagnostic Flow

  Read the Abstract, Introduction, and Discussion. Locate every instance where a mental property ($M$) is asserted to cause a neural or behavioral effect ($E$).

  ### Step 1: The Causal Claim Classification
  **Question:** Does the manuscript assert that $M$ is a *cause* of $E$, or merely a *correlate/descriptor* of the physical substrate ($P$) that causes $E$?
  *   **Look for:** Verbs like "drives," "induces," "modulates," "generates" vs. "correlates with," "is reflected in," "indexes."
  *   **Sufficient Answer for Causation:** The text claims manipulating $M$ would change $E$, or that $M$ explains variance in $E$ beyond $P$.
  *   **Verdict:**
      *   If **Descriptor Only**: **PASS.** (No exclusion problem; the paper is likely reductionist or eliminativist).
      *   If **Causal Claim**: Proceed to Step 2.

  ### Step 2: The Physical Closure Check (Kim's Premise)
  **Question:** Does the authors' model acknowledge that the physical substrate ($P$) associated with $M$ is physically sufficient to produce $E$?
  *   **Look for:** Acknowledgement of neural mechanisms, biophysical laws, or prior neural states determining the outcome.
  *   **Sufficient Answer:** The text admits $P$ is sufficient, OR the text claims $P$ is *insufficient* without $M$.
  *   **Verdict:**
      *   If **$P$ is Insufficient without $M$**: **STOP & FLAG FOR SPECIALIST.** (This violates the standard neuroscientific assumption of Physical Causal Closure. This is a metaphysical claim of emergentism or dualism requiring philosophical review).
      *   If **$P$ is Sufficient**: Proceed to Step 3.

  ### Step 3: The Distinctness & Supervenience Check
  **Question:** Do the authors treat $M$ as distinct from $P$, while acknowledging $M$ depends on $P$?
  *   **Look for:** Language implying $M$ is "implemented by" $P$ but not "identical to" $P$. Do they allow that different neural states ($P1, P2$) could realize the same mental state ($M$)? (Multiple Realizability).
  *   **Sufficient Answer:** Yes, $M$ is treated as a higher-level property supervening on $P$.
  *   **Verdict:**
      *   If **$M$ is Identical to $P$** (Reductionism): **PASS.** (Exclusion is avoided because there is only one cause, described two ways. *Note: Check if this misleads readers about the level of explanation*).
      *   If **$M$ is Distinct from $P$** (Non-Reductive): Proceed to Step 4.

  ### Step 4: The Interventionist Test (Woodwardian Relevance)
  **Question:** Does the methodology or argument demonstrate that $M$ is *causally relevant* to $E$ independent of the specific realization $P$?
  *   **Look for:**
      1.  **Multiple Realizability:** Evidence that varying $P$ while holding $M$ constant leaves $E$ unchanged.
      2.  **Intervention:** Evidence that intervening on $M$ (e.g., via cognitive manipulation) changes $E$, even if the specific neural pathway varies.
      3.  **Conditional Independence:** Statistical models showing $M$ predicts $E$ even when controlling for specific low-level $P$ variables.
  *   **Sufficient Answer:** The study provides empirical leverage showing $M$ tracks $E$ in a way specific neural details do not.
  *   **Verdict:**
      *   If **No Interventionist Independence**: **STOP & VERDICT: REDUNDANT.** (The mental claim is causally excluded by the physical. $M$ is epiphenomenal in this model).
      *   If **Interventionist Independence Shown**: **PASS (Exclusion Avoided).** (Causal relevance is established via counterfactual dependence, satisfying non-reductive physicalism).
      *   If **Conceptually Ambiguous**: **FLAG FOR SPECIALIST.** (If the distinction between intervening on $M$ vs. $P$ is muddled).

  ### Step 5: The Explanatory Gain Judgment (Reviewer Discretion)
  **Question:** Even if exclusion is avoided (Step 4), does the mental vocabulary provide explanatory power that the neural vocabulary lacks?
  *   **Look for:** Generalization, normative assessment, or cognitive-level prediction that neural data cannot provide efficiently.
  *   **Mechanical Rule:** None. This is a **Judgment Call**.
  *   **Action:** If "No," recommend revision to clarify that mental terms are heuristic. If "Yes," endorse the causal language.

  ---

  ## Part 2: Decision Matrix

  | Path | Outcome | Reviewer Recommendation |
  | :--- | :--- | :--- |
  | **Step 1 (Descriptor)** | No Causal Claim | Accept causal language as metaphorical; no exclusion issue. |
  | **Step 2 (Closure Violation)** | $P$ Insufficient | **Major Revision / Specialist Review.** Claims violate standard physicalism. |
  | **Step 3 (Identity)** | $M = P$ | Accept, but warn against misleading dualist implications. |
  | **Step 4 (No Independence)** | $M$ Distinct but Redundant | **Reject/Revise.** Mental causation is excluded; claim is epiphenomenal. |
  | **Step 4 (Interventionist)** | $M$ Distinct & Relevant | **Accept.** Exclusion avoided via causal relevance. |
  | **Step 5 (Judgment)** | Explanatory Gain | Determine if the mental-level explanation justifies the journal's scope. |

  ---

  ## Part 3: Worked Applications

  ### Case 1: The "Novel Pathway" Submission
  **Hypothetical Abstract:** "We show that conscious intention ($M$) introduces a novel causal pathway in motor-cortex dynamics ($E$) that cannot be reconstructed from prior neural states ($P$) alone. Intention acts as a top-down constraint that breaks physical determinism."

  **Running the MCA-30:**
  1.  **Claim:** Causal ("introduces a novel causal pathway"). **Proceed.**
  2.  **Closure:** Authors claim prior neural states ($P$) are *insufficient* to reconstruct the outcome without $M$.
  3.  **Stop Condition:** **Step 2 Verdict: FLAG FOR SPECIALIST.**

  **Analysis:**
  *   **Feature Doing the Work:** The claim explicitly violates *Physical Causal Closure*. It asserts that the physical domain is not causally closed.
  *   **Defender's Attack:** A defender of the paper might argue that "neural states" were defined too narrowly (e.g., ignoring quantum effects or global field properties). They might claim this is an empirical finding, not metaphysics.
  *   **Procedure Limitation:** This procedure cannot settle whether physical closure is true. It only flags that the manuscript is making a metaphysical claim that contradicts the standard operating assumption of neuroscience. A specialist must determine if this is a legitimate challenge to physicalism or a category error.
  *   **What Cannot Be Settled:** Whether "conscious intention" is a non-physical force or if the authors have simply failed to measure the relevant neural variables.

  ### Case 2: The "Anxiety Label" Submission
  **Hypothetical Abstract:** "Anxiety-driven avoidance behavior ($E$) is solely attributed to amygdala activation ($P$). We use 'anxiety' as a descriptive label for the specific neural pattern observed in the basolateral amygdala."

  **Running the MCA-30:**
  1.  **Claim:** Causal ("Anxiety-driven..."), but qualified ("solely attributed to amygdala").
  2.  **Closure:** Authors admit amygdala activation ($P$) is the sole cause. **Proceed.**
  3.  **Distinctness:** Authors state 'anxiety' is a *label* for the neural pattern ($M = P$).
  4.  **Stop Condition:** **Step 3 Verdict: PASS (Identity).**

  **Analysis:**
  *   **Feature Doing the Work:** Reduction/Identity. By equating $M$ and $P$, they avoid exclusion because there is only one cause.
  *   **Defender's Attack:** A defender of mental causation (non-reductive) might attack this as "eliminating" the mental. They would argue anxiety is multiply realizable (not just amygdala) and that reducing it loses explanatory power regarding the *experience* of fear.
  *   **Procedure Limitation:** This procedure validates the *causal coherence* of the paper but cannot judge if the reduction is scientifically useful. It passes the exclusion check, but Step 5 (Explanatory Gain) might fail. If the paper claims to be about "mind" but only measures "amygdala voltage," it may be out of scope for a journal focused on the *intersection* of mind and brain.
  *   **What Cannot Be Settled:** Whether "anxiety" *really* is identical to amygdala activation, or if this is a convenient but false simplification. That is an ontological question, not a causal one.

  ---

  ## Part 4: Limitations & Boundary Conditions

  **Where Mechanical Rules End:**
  The MCA-30 relies on the text's explicit claims. It cannot detect *implicit* metaphysical commitments. If an author claims $M$ causes $E$ but implicitly assumes $M=P$ without stating it, Step 3 requires reviewer interpretation.

  **Where Judgment Calls Begin:**
  *   **Step 5 (Explanatory Gain):** Determining whether a mental-level explanation is "better" than a neural one is not a metaphysical fact; it is a pragmatic judgment about the journal's audience.
  *   **Multiple Realizability:** In Step 4, determining if a study *adequately* tests for multiple realizability is difficult in 30 minutes. If a study uses only one method to induce "anxiety," can it claim interventionist independence? The reviewer must judge if the operationalization is broad enough to support the mental claim.

  **What This Procedure Cannot Settle:**
  1.  **The Truth of Physicalism:** The procedure assumes Physical Causal Closure (Step 2) is the default. It cannot adjudicate papers arguing against physicalism; it only flags them.
  2.  **The Nature of Supervenience:** It treats supervenience as a textual claim ("depends on"), not a metaphysical relation. It cannot verify if the mental *actually* supervenes on the physical in the way described.
  3.  **Consciousness Hard Problems:** It addresses causal *relevance* (Woodward), not causal *production* or phenomenal experience. A paper can pass MCA-30 and still fail to explain *why* it feels like something to have the mental state.

  **Final Instruction to Reviewer:**
  If you reach a **FLAG FOR SPECIALIST**, do not reject the paper on scientific grounds. Write a comment stating: *"The manuscript makes a claim regarding causal closure/exclusion that falls outside standard neuroscientific assumptions. A specialist in philosophy of mind is required to assess the coherence of the causal model."* If you reach **VERDICT: REDUNDANT**, recommend the authors reframe mental terms as descriptive correlates or provide interventionist evidence for causal relevance.
