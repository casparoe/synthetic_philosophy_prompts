  Forty people huddled against the frost,
  breath making smoke in the morning air.
  Four lie still where the snow turned red,
  kin pulling blankets over open eyes.
  One in ten does not see the sun.

  II
  The village spreads across the valley floor,
  four thousand hands to bind the sheaf.
  Four coffins wait by the churchyard gate,
  wood polished smooth for the narrow ride.
  The grain is stored, the names are cut in stone.

  III
  The city wakes with a million lights,
  traffic humming along the wet black street.
  Four sheets cover the dead in the basement room,
  tagged and logged in the county book.
  The crowd flows past the hospital doors.

  IV
  The map unrolls to include the oceans,
  eight billion heads counting themselves safe.
  Four bodies burn in a border province,
  smoke lost in the weather of quiet zones.
  The share grows small where the quiet zones swell.

  V
  The map stays wide, the ledger opens wide,
  no blade strikes here, no bullet breaks the skin.
  Four lives shorten by thirty years of grain,
  a threat withheld, a harvest kept away.
  Is there a number for what never happened?
