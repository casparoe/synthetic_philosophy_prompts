      *   *Biography:* Keynes was part of the Bloomsbury Group (Moore's *Principia Ethica* influence). He did work at the Treasury but resigned (after WWI, specifically regarding the Versailles Treaty). He was an investor/speculator himself (managed endowments, personal wealth).
