answer: |-
  The view under test
  The Maintenance Account (MA) posits that a trait type T has function E iff tokens of T are currently retained in the population *because* they produce E. Unlike etiological accounts, MA grounds function in ongoing selection rather than historical origin; unlike causal-role accounts, it requires a difference-making selection relation over a biologically relevant generational window. If T ceased producing E, selection would eliminate it. This resolves co-option by shifting function to the current maintainer and grants immediate function to beneficial variants. Ambiguity resolved: "Currently retained" implies active selective pressure, not mere presence, and the "relevant window" must be long enough to distinguish selection from drift but short enough to track environmental change.

  Decisive defeaters
  The Collapse Objection is fatal. If "retained because" is cashed out as "currently contributes to fitness," MA dissolves into the causal-role account it seeks to supersede. Causal-role theorists already exclude spurious effects via system boundaries; if MA's exclusion mechanism is just "selection," but selection is identified by current fitness contribution, you have no normative remainder. You've traded history for synchrony without gaining leverage. The normativity of function relies on the distinction between what a trait *does* and what it is *for*. If MA defines "for" purely by current retention pressure, and that pressure is measured by current contribution, the distinction vanishes. MA becomes a causal-role account with a selected-effects label. Without a historical anchor, "selection" is just a name for "fitness contribution," leaving you with no tools to exclude effects that contribute but aren't functions.

  Second, the Parameter Tuning Problem. The "biologically relevant run of generations" is suspiciously elastic. To handle shifting mosaics, you lengthen the window; to handle new variants, you shorten it. If the window is tuned to yield pre-theoretic verdicts rather than derived from biological parameters (like generation time or mutation rate), MA is ad hoc. A view that can be insulated from any counterexample by adjusting the temporal window is unfalsifiable. It becomes a protective belt rather than a core theory.

  Third, Conflict with Genomic Practice. In genomics, "function" is often assigned via biochemical activity or conservation across deep time. MA demands current population-level retention. If a trait is conserved across species but polymorphic within a population, MA struggles. If biologists assign function based on knockout effects in a single generation, but MA requires a "run of generations," MA conflicts with operational definitions. You claim the biologist watches fitness over generations, but often they infer function from immediate physiological disruption. MA demands a temporal lag that practice ignores, risking obsolescence in modern biology. The ENCODE debate highlights this: if biochemists count activity as function, MA calls them wrong, but if MA's criteria are too hard to measure, MA becomes irrelevant. This risks making MA philosophically robust but scientifically idle.

  Awkward but survivable
  The Passenger Problem is costly. If a trait becomes indispensable via a neutral ratchet, MA assigns it a function because removal now lowers fitness. This severs the link between function and *selection for*. You gain coverage of indispensable traits but lose the explanation of *why* they are there. It becomes a function without a history of selection for that effect, which undermines the naturalistic normativity you prize. The trait is maintained, but not *for* anything in the historical sense, making the normativity hollow. You claim this handles co-option gracefully, but if neutral dependencies count, you lose the ability to distinguish adaptive maintenance from structural necessity.

  Spatial Variation makes function locally relative. A heart has function F in Valley A but no function in Valley B. This is biologically coherent but philosophically messy for typing traits. It implies function is not intrinsic to the trait type but extrinsic to the population boundary.

  Relaxed Selection implies function vanishes before the trait does. While you welcome this for vestiges, it creates a gap where a trait exists, contributes to fitness, but lacks a function. This makes "malfunction" intransitive during transition periods, awkward for medicine where we treat declining traits as malfunctioning, not functionless. If a trait is failing but not yet selected against, MA says it has no function to malfunction. Clinicians cannot treat a functionless trait as broken.

  What a defender concedes, what she dismisses
  Concede that function is population-relative. Biological kinds are rarely universal; accepting spatial variation buys empirical accuracy at the cost of conceptual simplicity. Concede that neutral passengers acquire function once indispensable. If removal is lethal, selection now maintains them; denying them function is pedantic. However, admit this weakens the claim that function explains origin.
  Dismiss intuitions about vestigial malfunction. If a trait is no longer selected for, calling its failure "malfunction" is anthropomorphic nostalgia. Dismiss the Collapse worry by insisting selection is a causal process distinct from mere contribution, though this requires a robust account of selection detectable over your "relevant window." Dismiss the idea that genomics practice dictates philosophy; biologists may be loose with "function," but MA aims for the strict sense. However, if the strict sense is unmeasurable, the dismissal looks like sour grapes. Philosophy clarifies, not merely mirrors.

  How exposed is it?
  MA is highly exposed to the charge of insulation. If the "relevant window" and "retained because" criteria can be tweaked to accommodate any case (shifting mosaics, passengers, new variants), the view risks becoming unfalsifiable. A successful conceptual analysis should constrain usage, not accommodate all intuitions. The Collapse worry is the deepest threat: if you cannot distinguish "selected for E" from "contributing E" without appealing to history, MA is just Causal Role with extra steps. If you appeal to history, you drift back toward Etiological. MA tries to walk a tightrope between synchrony and diachrony; the risk is that it falls into both camps simultaneously without standing on its own. It is not clearly distinct enough to justify its existence. The insulation defect is fatal if the parameters are not biologically grounded. It lacks predictive power regarding trait evolution.

  What I'd find most persuasive
  To move me, show a case where MA and Etiological accounts diverge, and biological practice sides with Etiological. For example, a newly arisen beneficial allele: biologists often call it a "beneficial variant," not a "functional trait," until fixation. If MA calls it functional immediately, it may be overgenerating. Second, demonstrate that the "relevant window" is doing all the work. If changing the window length changes the function verdict arbitrarily, the account lacks stability. Show that MA's parameters are calibrated to match intuitions rather than biological facts. Prove the window isn't just a dial.
