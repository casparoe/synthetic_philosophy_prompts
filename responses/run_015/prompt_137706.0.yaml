answer: |-
  **The Fine Print of Popular Sovereignty: Referendums as Incomplete Contracts**

  There is a temptation to treat a referendum result as a singular event, a moment of democratic lightning that strikes and illuminates the path forward. But as the dust of the 2016 vote settled, it became clear that the lightning had struck a fog bank. The result was clear enough in the binary, but the terrain it revealed was unmapped.

  You propose viewing a referendum not as a command, but as an **incomplete contract**. In law and economics, an incomplete contract is one that cannot specify every possible contingency. Because the future is unknowable, the contract leaves gaps. The crucial question then becomes: who holds the *residual control rights*? Who gets to decide what happens in the gaps?

  This is a robust frame. It moves the analysis away from the metaphysics of "the will of the people" and towards the mechanics of power. It asks not what was said, but who gets to speak for it tomorrow. To test this properly, we must apply it to the defining British constitutional crisis of our time, contrast it with a different design in Switzerland, and ask whether this is merely a wanky relabelling of ambiguity or a tool with predictive teeth.

  ### The Brexit Contract (2016–2020)

  In the language of contract law, the 2016 referendum was a heads-of-agreement document with no schedule of works attached. The parties to this notional contract were heterogeneous. On one side, the 'Leave' coalition: a mix of free-market Tories, left-behind labour voters, and constitutional purists. On the other, the 'Remain' coalition. The counterparty responsible for execution was Her Majesty's Government, overseen by Parliament.

  The incompleteness was stark. The ballot asked whether the UK should remain in or leave the European Union. It did not specify the tariff schedule, the status of Northern Ireland, the level of regulatory alignment, or the rights of citizens. These were the unspecified contingencies.

  **Residual Control Rights**
  The central drama of 2016 to 2020 was a struggle over who held the residual rights to fill these gaps.
  Initially, the Government (Cameron, then May) assumed the rights lay with the Executive, utilising royal prerogative to trigger Article 50. This was challenged in *R (Miller) v Secretary of State for Exiting the European Union* (2017). The Supreme Court ruled that because withdrawal would alter domestic rights, Parliament had to legislate. This was a pivotal transfer of residual control rights from the Executive to the Legislature.

  However, Parliament proved unable to agree on how to fill the contractual gaps. The 2017 general election, called to consolidate the Government's authority to negotiate, resulted in a hung parliament, further fragmenting the residual rights. It was not until the 2019 election that the rights were consolidated again, vested in a Prime Minister with a working majority who could dictate the interpretation of the mandate.

  **Mandate-Preserving vs. Mandate-Consuming**
  Here the frame offers genuine insight. A *mandate-consuming* implementation is one where the act of carrying out the vote exhausts the authority granted. If the vote were to "repeal the Human Rights Act," once repealed, the mandate is spent. A *mandate-preserving* implementation requires the mandate to be constantly re-invoked to justify subsequent decisions.

  Brexit was sold as mandate-consuming (a one-off departure) but functioned as mandate-preserving. Every regulatory divergence, every customs check, and every fishing quota negotiation required the Government to reach back into the 2016 result to justify the specific choice. Because the contract was incomplete, every implementation step quietly reopened the question the vote was supposed to have settled. The Government could not simply 'do Brexit'; it had to continuously argue that *this specific version* of Brexit was what the 2016 vote authorised.

  **The Counterfactual-Stability Test**
  This is the sharpest tool in the kit. Take the outcome actually delivered—the Withdrawal Agreement with the Northern Ireland Protocol, regulatory alignment in many sectors, and continued friction in trade. Ask: would the 2016 Leave coalition, shown this specific outcome in advance, have voted the same way?

  Honesty compels a 'no'. A significant portion of the Leave coalition, particularly the European Research Group and the UKIP wing, viewed the eventual deal as 'Brexit In Name Only'. They voted for a clean break; they received a complex treaty relationship. Conversely, many soft-Leavers might have baulked at the economic costs incurred.

  If the counterfactual test fails, the implementation was formally faithful (we did leave the EU) but substantively unstable. The contract was fulfilled in letter but breached in spirit. This explains the persistence of conflict long after Article 50 was triggered. The residual rights were being exercised in a way that violated the implied terms of the winning coalition's understanding.

  **Is this just relabelling?**
  Critics might say this is merely saying "the mandate was ambiguous." It is not. Ambiguity suggests a foggy text. The incomplete contract frame highlights the *distribution of power*. It explains why the Supreme Court case mattered (shifting rights to Parliament), why the 2017 election mattered (fragmenting rights), and why the 2019 election mattered (consolidating rights). It predicts that where residual rights are contested, the process will be unstable, regardless of the clarity of the ballot question. It shifts the focus from the *meaning* of the vote to the *machinery* of its execution.

  ### The Swiss Contrast: The Mass Immigration Initiative (2014)

  To test the limits of this frame, we look to a different contract design. On 9 February 2014, the Swiss electorate approved the federal popular initiative 'Against Mass Immigration' by 50.3 per cent. It added Article 121a to the Federal Constitution.

  **Completeness of Text**
  Unlike the Brexit ballot, this was not a binary advisory question. It was a binding constitutional amendment. It explicitly required quotas on immigration. On paper, this is a much more *complete* contract. The gaps were smaller; the text specified the mechanism (quotas).

  **Residual Rights and Treaty Conflict**
  Did this completeness solve the residual-rights problem? No. It relocated it.
  The implementation clashed with the bilateral agreements between Switzerland and the EU, specifically the protocol on the free movement of persons. The Federal Assembly (Parliament) held the residual rights to implement the constitutional article, but they faced a conflict of laws.

  If they implemented the quotas strictly, they breached international treaties, risking Swiss access to the single market. If they honoured the treaties, they breached the constitution. The Federal Assembly eventually implemented the will of the people via the 'Inland Preference' model—requiring employers to advertise vacancies domestically before looking abroad—rather than hard quotas.

  **Analysis**
  The Swiss case demonstrates that textual completeness does not eliminate the incomplete contract problem; it merely moves the incompleteness from the *domestic mandate* to the *international interface*. The residual control rights shifted to the legislature to find a workaround that satisfied the constitutional text without detonating the external treaties.

  The counterfactual-stability test here is also instructive. Would the winning coalition have voted yes if told the result would be 'Inland Preference' rather than 'Quotas'? Perhaps not. But the cost of breach (economic isolation) was immediate and tangible, unlike the abstract sovereignty gains of Brexit. The Swiss frame forces the implementers to confront the trade-offs earlier. In Britain, the trade-offs were deferred until the negotiation phase, by which time the residual rights had become a political weapon.

  I must extrapolate slightly on the Swiss internal mechanics, but the structural shape is clear: a more complete contract reduces the room for domestic reinterpretation but increases the friction with external constraints. The residual rights do not vanish; they become rights to manage conflict.

  ### Predictive Power and the Vox Populi Objection

  Is this framework merely a vocabulary for post-mortems, or does it predict?

  **The Second Referendum**
  On this view, what is a second referendum? It is not necessarily a betrayal. If a contract is incomplete and the agents (Parliament/Government) cannot fill the gaps in a way that passes the counterfactual-stability test, the principals (the People) may need to reconvene to ratify the specific terms.
  A second referendum is a **renegotiation** of the incomplete contract. It is an admission that the residual rights holders have failed to produce an outcome that aligns with the original coalition's preferences. Alternatively, it can be seen as the **completion** of the contract: the first vote set the direction, the second vote signs off on the specific terms of trade. It is not a breach; it is the final clause being written.

  **The Vox Populi Objection**
  The strongest objection comes from the theory of constituent power. This view holds that a referendum is not a contract at all. It is an instruction from the sovereign to the servant. A master does not sign a contract with a servant; the master commands, the servant obeys. To speak of 'residual rights' is to dilute popular sovereignty with technocratic discretion. It assumes the people *can* be bound by the limitations of implementation, whereas the constituent power is absolute.

  Can the incomplete contract frame answer this? It cannot deny the normative force of the objection, but it can highlight the physical impossibility of it. An instruction like "Leave" is semantically incomplete. There is no single physical state of 'Leave'. There are infinite variations. Someone *must* choose the variation.
  The frame answers the vox populi objection by pointing out that even an absolute instruction requires an interpreter. If the interpreter (the Government) chooses a version of 'Leave' the sovereign dislikes, the sovereign has no recourse unless the contract (the constitutional order) provides one. The frame does not assume the objection away; it exposes the vulnerability of the 'instruction' model. Without defined residual rights, the instruction is liable to be captured by the very agents supposed to obey it.

  ### Conclusion

  Your frame is not just clever; it is necessary. Describing Brexit as "ambiguous" captures the mood but misses the mechanics. Describing it as an incomplete contract captures the struggle for power. It explains why the Supreme Court, the elections, and the withdrawal agreements were not just political bumps in the road, but legal battles over who owned the silence in the text.

  It warns us that without specifying who holds the residual control rights *before* the vote, the aftermath will be a war of interpretation. And it suggests that textual completeness, as seen in Switzerland, is no panacea; it simply shifts the battle from the constitution to the treaty.

  For a British outlet, the lesson is constitutional. If we are to use referendums again, we must stop treating them as moments of magic. They are legal instruments. And like any contract, if you leave the fine print blank, you must decide in advance who gets to write it. Otherwise, you are not settling the question. You are merely hiring a new set of lawyers to fight it.
