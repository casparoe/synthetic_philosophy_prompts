prompt: |-
  I run a weekly voluntary reading group at a small liberal-arts college — its not a class, 14 people, mostly third-year philosophy and psychology majors, 90 minutes, room with a projector and a whiteboard but no reliable wifi. In two weeks its my turn to pick the topic and I want to do illusionism about phenomenal consciousness: the Frankish/Dennett-flavoured line that introspection doesn't reveal intrinsic, non-representational qualitative properties of our experiences but actively misrepresents its own states as having them. Not the crude version where nothing is conscious and we're all secretly zombies — the version where something is definitely going on, and the mistake is in how that something gets presented to the subject.

  The problem is that every time I've tried this informally it collapses. I show some visual illusion (Mach bands, or two identical grey squares that look different against different backgrounds), say "qualia are like that," and someone immediately points out that the illusion is itself a conscious experience with a distinctive character, so all I've done is hand them one more datum. They're right, and I don't have an answer in the moment. So: design me an actual activity — a game with payoffs, a role-play, a staged case with forced choices, whatever fits — where the group runs into the problem before I name it, so that by the end they can state the illusionist claim in their own words and also say precisely what it does *not* deny. No lecture up front, and the word shouldn't appear until afterwards. My rough idea was a round where everyone writes a careful private description of what a stimulus is like, I secretly re-present the same stimulus under a new label (or swap in a near-neighbour), and they have to defend or retract their earlier description — maybe with credence chips staked on what their own future reports will say. But I can't see how to get from "your reports are contaminated and contestable" to "introspection misrepresents," or from "one attributed property is misrepresented" to "there are no phenomenal properties," so feel free to scrap it.

  Two more things. One of the regulars is a committed realist who will say: fine, my description was influenced by the label, but there is still something it is like, and that was the whole question — I want the design to make that move genuinely uncomfortable rather than brushed aside, and the debrief should be honest about where it survives untouched. And I want them to come away seeing illusionism as a view with a *debt* attached — somebody owes an account of the illusion in non-phenomenal terms — not as a denial. Give me the timeline, roles or rules, the debrief mapping particular moments onto particular parts of the view, what will predictably go wrong the first time I run it (including the ways it will collapse into eliminativism), and a frank note on which feature of illusionism the activity simply cannot reproduce and I'll have to supply myself. Practical notes: printouts and index cards are fine, food isn't (one member has a severe allergy), so if you think an ingestible version is worth the hassle, say so and I'll check with her.
reasoning: |-
  Here's a thinking process that leads to the suggested activity:

  1.  **Analyze the Request:**
      *   **Context:** Weekly voluntary reading group, small liberal-arts college, 14 people (mostly 3rd-year Phil/Psych majors), 90 mins, projector/whiteboard, no wifi.
      *   **Topic:** Illusionism about phenomenal consciousness (Frankish/Dennett style). Key distinction: Not eliminativism (zombies), but the claim that introspection *misrepresents* experience as having intrinsic qualia.
      *   **Problem:** Previous attempts fail. Showing visual illusions just gives them *more* qualia to talk about ("the illusion itself is experienced"). The user needs an activity where the group *runs into* the problem before the theory is named.
      *   **Goal:** By the end, they should state the illusionist claim in their own words and know what it *doesn't* deny.
      *   **Constraints:** No lecture up front. Word "illusionism" shouldn't appear until afterwards. Must handle a committed realist who insists "there is still something it is like." Must show illusionism has a *debt* (account of the illusion). Must include timeline, rules, debrief, predicted failures, and limitations. No food (allergy).
      *   **User's Idea:** Private descriptions, secret re-presentation, credence chips. (User feels this might not bridge the gap to "introspection misrepresents".)

  2.  **Deconstruct the Philosophical Challenge:**
      *   *The Hard Problem:* Why does processing feel like something?
      *   *The Realist Move:* "I know I have qualia because I'm experiencing them right now. You can't explain that away."
      *   *The Illusionist Move:* "You *think* you have qualia. The 'what it is like' is a user-illusion generated by cognitive systems. The experience is real, the *interpretation* of that experience as having non-physical/intrinsic properties is the illusion."
      *   *The Trap:* Any example of an illusion (e.g., Mach bands) is itself a conscious experience.
      *   *The Solution:* We need to target the *judgment* about the experience, not the experience itself. We need to show that introspective access is *constructive* and *fallible* in a way that suggests the "qualitative character" is a output of the system, not a direct readout of input. We need to create a situation where their confidence in "what it's like" is undermined by the *process* of reporting, not just the content.

  3.  **Brainstorming Activity Concepts:**
      *   *Idea 1: Change Blindness.* Show a scene, change something, ask if they noticed. *Critique:* Too standard, doesn't target qualia specifically.
      *   *Idea 2: Semantic Satiation/Verbal Transformation.* Say a word until it loses meaning. *Critique:* Good for "meaning isn't intrinsic," but maybe too linguistic.
      *   *Idea 3: The "Private Diary" Game (User's idea refined).* Write down experience. Reveal manipulation. *Critique:* Hard to do without wifi/reliable tech.
      *   *Idea 4: Introspective Interference.* Task them with monitoring a specific feature of experience while manipulating a cognitive load or framing that alters the report.
      *   *Idea 5: The "Phenomenal Overflow" Test.* Show a grid of letters briefly. Ask "Did you experience all of them clearly?" vs "How many can you report?" *Critique:* Classic Block vs. Dennett debate. Might be too technical.
      *   *Idea 6: The "Constructive Introspection" Protocol.* This seems most promising. We need to show that the *report* of the experience is built, not read.

      *   *Selected Concept:* **"The Calibration Protocol."** A multi-stage task where participants make fine-grained judgments about a stimulus, but the conditions of judgment are manipulated to show that the "phenomenal character" shifts based on *expectations* and *conceptual framing*, not just the sensory input. The key is to make them realize their access to the "raw feel" is mediated by the very cognitive systems that generate the illusion.

      *   *Refining for the "Realist" Objection:* The realist will say, "Okay, my judgment changed, but the *feeling* was real." The activity needs to force a contradiction between two simultaneous introspective claims that *both* feel undeniable. Or, show that the "feeling" is indistinguishable from the "judgment."
      *   *Better Approach:* **The "Dual-Report" Discrepancy.** Have them report on the *stimulus* and the *experience* separately, then show the correlation is imperfect.
      *   *Best Approach (inspired by Dennett's "Quining Qualia"):* Focus on the **indeterminacy** of the experience. If qualia are intrinsic, they should be determinate. If introspection constructs them, they might be gappy or filled in.
      *   *Let's try a specific mechanism:* **The "Filling-In" Game.** Use the blind spot or peripheral vision ambiguity. But the user said visual illusions just give more data.
      *   *Pivot:* We need to target the *authority* of introspection. The activity should be a **Memory/Reconstruction Task**.
      *   *Idea:* Show an image. Ask for a detailed description of the *visual experience* (not the object). Later, reveal that the image was ambiguous or changed.
      *   *Wait, the core Illusionist point is:* Introspection is a *theoretical* stance we take toward our own states. It's not a direct gaze.
      *   *Activity:* **"The Operator's Manual."** Roleplay. They are operators monitoring a system (their own mind). They have to log "system states." We introduce noise in the logging mechanism.

      *   *Let's go with a modified version of the User's "Credence Chips" idea, but focused on **Predictive Processing**.*
      *   *Activity Name:* **The Introspective Betting Market.**
      *   *Mechanism:* Participants bet on their own future introspective reports. If introspection is a direct readout of intrinsic properties, reports should be stable. If it's constructive/context-dependent, reports should fluctuate based on framing, even if the stimulus is identical.
      *   *Crucial Twist:* We need to show that the *experience itself* seems to change based on the *concept* applied.
      *   *Stimulus:* An ambiguous figure (Necker Cube) or a vague sensory input (white noise, or a uniform grey field). Let's go with **Uniform Grey Field + Framing**.
      *   *Why?* Because there *is* nothing there. If they report "texture" or "depth," it's generated.
      *   *Wait, Realist counter:* "The texture is real to me."
      *   *Illusionist counter:* "The texture is a representation, not a property of the experience."
      *   *Okay, let's look at Frankish's specific argument.* It's about the *concept* of qualia. The activity needs to show that when we try to isolate the "qualitative character" from the "functional role," we fail.

      *   *Revised Plan:* **The "Phenomenal Partition" Exercise.**
      *   Step 1: Experience a stimulus.
      *   Step 2: Describe the "raw feel" (phenomenal).
      *   Step 3: Describe the "functional content" (representational).
      *   Step 4: Try to separate them.
      *   *Problem:* Hard to facilitate in 90 mins.

      *   *Let's try the "Memory Reconstruction" angle.* It's robust and needs no tech.
      *   *Activity:* **The "Echo Chamber" Protocol.**
      *   1. Listen to a sound (tone).
      *   2. Write down the "qualitative character."
      *   3. Read a prompt that suggests a different character (e.g., "This tone often sounds buzzy to people with fatigue").
      *   4. Re-evaluate the *original* experience.
      *   5. Did the experience change, or just the memory?
      *   *Illusionist Point:* You can't tell. Therefore, the "experience" you have access to *now* is a reconstruction. The "original qualia" are inaccessible. If they are inaccessible, in what sense do they exist as intrinsic properties guiding your report?

      *   *Let's refine this into a game.* **"The Calibration Game."**
      *   Teams. Stimulus: A complex, ambiguous image (projected).
      *   Round 1: Report "Phenomenal Properties" (colors, sharpness, glow).
      *   Round 2: Introduce a "Theory" (e.g., "This image is known to trigger V4 overactivity").
      *   Round 3: Report again.
      *   Payoff: Points for consistency? No, points for detecting *drift*.
      *   *Goal:* Show that the "phenomenal report" is theory-laden.

      *   *Wait, I need to address the "Realist" specifically.* The Realist says: "Even if my report changes, the *feeling* at the time was real."
      *   *Counter:* "Which feeling? The one you report now or the one you reported then? If they differ, and you only have access to the current report/memory, on what basis do you posit the intrinsic property?"
      *   *Activity:* **The "Delayed Match" Task.**
      *   1. Show Stimulus A.
      *   2. Distractor task (load working memory).
      *   3. Show Stimulus B (identical to A).
      *   4. Ask: "Did the *experience* of B feel the same as A?"
      *   5. Reveal A and B were identical.
      *   6. Ask: "Why did the experience differ?"
      *   *Illusionist Takeaway:* The "feel" is not a property of the input, but a property of the *processing*. If processing changes, feel changes. Therefore, "feel" is not intrinsic to the state in the way Realists think.

      *   *Okay, let's synthesize.* I need a structured activity that forces them to rely on introspection, then undermines the *authority* of that introspection without denying the *existence* of the state.
      *   *Title:* **The Introspective Calibration Protocol.**
      *   *Materials:* Index cards, pens, projector (static images), timer.
      *   *Structure:*
          1.  **Baseline:** Report on a simple stimulus.
          2.  **Interference:** Cognitive framing/manipulation.
          3.  **Re-Report:** Report on the *same* stimulus (or memory of it).
          4.  **Comparison:** Compare reports.
          5.  **Debrief:** Connect to Illusionism.

      *   *Specific Manipulation:* Use **Semantic Priming** on a vague stimulus.
      *   *Stimulus:* A ambiguous noise burst or a vague visual texture (static).
      *   *Group A told:* "This represents order."
      *   *Group B told:* "This represents chaos."
      *   *Task:* Describe the *sensory quality* (not the meaning).
      *   *Result:* Descriptions will differ (e.g., "structured rhythm" vs "jagged noise").
      *   *Reveal:* The stimulus was identical.
      *   *The Trap:* Realist says "But the experience *was* different for us."
      *   *Illusionist Pivot:* "If the physical input is identical, and the functional output (report) differs due to *conceptual framing*, then the 'phenomenal character' is constituted by the framing, not an intrinsic property of the sensory state. The 'feel' is the system's *interpretation* of the state."

      *   *Refining the "Debt":* The activity must end with the question: "Okay, so what *is* happening when I feel that texture?" This highlights the explanatory debt (the illusion mechanism).

      *   *Addressing the "Collapse into Eliminativism":* I need to make sure they don't think I'm saying "You aren't conscious." I need to emphasize "You are conscious, but your *model* of your consciousness is wrong."
      *   *Fix:* In the debrief, explicitly distinguish between *Experience* (the state) and *Introspective Representation* (the access).

      *   *Timeline:* 90 mins.
      *   0-10: Setup/Rules.
      *   10-30: Round 1 (Baseline).
      *   30-50: Round 2 (Framing/Interference).
      *   50-70: Comparison/Debate (The "Realist" moment).
      *   70-90: Reveal & Debrief (Illusionism).

      *   *Let's flesh out the "Game" aspect.* Use **Credence Chips** (as user suggested) to make it concrete. They bet on the stability of their own introspection.
      *   *Game:* **"The Stability Wager."**
      *   You have 10 chips.
      *   Phase 1: Observe Stimulus. Write Description.
      *   Phase 2: Bet chips on whether your description will match a second description of the *same* experience taken 10 mins later.
      *   Phase 3: Intervening task (Framing).
      *   Phase 4: Second Description.
      *   Phase 5: Payout. (Most people will lose chips because descriptions drift).
      *   *Lesson:* Introspection is not a stable readout of intrinsic properties.

      *   *Wait, one major issue:* If the stimulus is external, the Realist says "The experience changed because your *attention* changed."
      *   *Illusionist response:* "Attention *is* the mechanism of the illusion. There is no 'pure' experience underneath attention."
      *   *How to make this uncomfortable?* Force them to attend to the *same* thing in the *same* way, but change the *concept*.
      *   *Stimulus:* A pain stimulus is unethical. A loud noise is annoying.
      *   *Visual:* A grey square.
      *   *Task:* "Describe the *intrinsic* quality of the grey."
      *   *Framing:* "Imagine this is a shadow" vs "Imagine this is a light source."
      *   *Result:* The grey looks different (Cornsweet illusion style, but cognitive).
      *   *Key Question:* "Did the *sensation* change, or just the *interpretation*?"
      *   *If they say Sensation:* Then sensation is cognitive (Illusionism wins).
      *   *If they say Interpretation:* Then how do you access the sensation apart from interpretation? (Access problem).

      *   *Okay, I have the core.* I will structure it as **"The Phenomenal Audit."**
      *   Roles: Auditor (Facilitator), Subjects (Participants).
      *   Materials: Printed cards with prompts.
      *   No food (allergy safe).

      *   *Predicting Failure:*
          1.  *Eliminativism Slide:* Participants think I'm saying they aren't conscious. *Fix:* Explicitly validate the experience in the debrief.
          2.  *Realist Dig-in:* "I know what I felt." *Fix:* Force the "Access Gap" question.
          3.  *Confusion:* "Is this just priming?" *Fix:* Connect priming to the *constitution* of the phenomenal character.

      *   *Limitation:* The activity cannot *prove* illusionism. It can only make it the best explanation for the data generated in the room. I need to state this clearly.

      *   *Drafting the Plan:*
          *   **Title:** The Phenomenal Audit.
          *   **Goal:** Demonstrate the constructive nature of introspective reports.
          *   **Phase 1:** Baseline Reporting (The "Naive Realist" stance).
          *   **Phase 2:** The Interference (Conceptual Framing).
          *   **Phase 3:** The Reckoning (Comparing reports).
          *   **Phase 4:** The Debrief (Mapping to Illusionism).

      *   *Refining the "Debt":* Ensure the final question is "So what *is* the error mechanism?"
      *   *Refining the "Realist" comfort:* Acknowledge that the *state* exists, but the *property attribution* is the illusion.

      *   *Let's check the constraints again:*
          *   14 people.
          *   90 mins.
          *   No wifi.
          *   Projector/Whiteboard OK.
          *   No food.
          *   Must handle the "illusion is also conscious" objection. (The activity avoids this by focusing on the *description* of the experience, not the experience of an illusion).
          *   Must not use the word "Illusionism" until the end.

      *   *Final Polish on the Activity:*
          *   Use a **Uniform Grey Field** on the projector. It's boring, which makes the generated "qualities" obvious.
          *   Use **Index Cards** for private reports.
          *   Use **Chips** for betting on consistency.
          *   **The Twist:** In Round 2, tell half the room the grey is "fading" and half it is "stabilizing." (Placebo effect on perception).
          *   **The Kicker:** Ask them to describe the *rate of change*.
          *   **The Result:** They will report change where there is none.
          *   **The Lesson:** Introspection generates content (change) that isn't in the stimulus. If it can generate change, can it generate "qualitativeness"?

      *   *Wait, the "illusion is conscious" objection:* If I say "The change is an illusion," they say "But the experience of change is real!"
      *   *My Counter in Debrief:* "Exactly. The *experience* is real. The *property* of 'external change' is the illusion. Illusionism says 'qualia' are like 'external change'—a property we project onto the experience, not a property of the experience itself."
      *   *This is the key distinction.* I need to make sure this lands.

      *   *Okay, ready to write.* I will structure it clearly with Timeline, Materials, Rules, Predicted Failures, and Debrief Script. I will emphasize the "Debt" aspect. I will explicitly address the Allergy constraint (no food). I will address the Realist's move.

      *   *Self-Correction on "Betting":* Betting might make it too competitive. Let's make it collaborative data gathering. "We are calibrating the instrument." The instrument is *them*.
      *   *Revised Name:* **"Instrument Calibration: The Introspective Sensor."**
      *   *Metaphor:* Treat their introspection as a sensor that needs testing.
      *   *This frames the "error" as mechanical, not personal.*

      *   *Final check on the "Debt":* Make sure the debrief ends with "Who owes the explanation?" (The Illusionist).
      *   *Final check on "Eliminativism":* Make sure to distinguish "State exists" vs "Property attribution."

      *   *Let's go.*
answer: |-
  Here is a complete design for a 90-minute session. It avoids the "visual illusion trap" by targeting the *stability and authority* of introspective reporting rather than the content of a specific perception. It treats the participants' introspection as a "sensor" to be calibrated, which naturally leads to the illusionist conclusion without triggering immediate defensiveness.

  ### Activity Title: **Instrument Calibration: The Introspective Sensor**

  **Core Concept:** Participants treat their own introspective access as a measurement tool. The activity demonstrates that this "tool" produces different data outputs for identical inputs depending on conceptual framing. This forces the realization that introspective reports are *constructive*, not passive readouts.

  **Materials Needed:**
  *   Projector (for a static image).
  *   Whiteboard & markers.
  *   Index cards (3 per person).
  *   Pens.
  *   "Credence Tokens" (can be poker chips, paper clips, or just tally marks on the board).
  *   Printed instruction sheets (one per person) – *see below*.

  **Constraint Check:** No food/allergens. No wifi required. Fits 14 people.

  ---

  ### Timeline (90 Minutes)

  | Time | Phase | Activity |
  | :--- | :--- | :--- |
  | **00-10** | **Setup** | Framing the "Calibration" metaphor. Distribution of materials. |
  | **10-30** | **Round 1** | **Baseline Measurement.** Private reporting on a neutral stimulus. |
  | **30-50** | **Round 2** | **Interference Protocol.** Conceptual framing introduced. Re-reporting. |
  | **50-65** | **The Audit** | Comparison of reports. The "Realist" challenge. |
  | **65-90** | **Debrief** | Revealing the theory. Mapping activity to Illusionism. The "Debt." |

  ---

  ### Phase 1: Setup (00-10)
  **Facilitator Script (No Theory Yet):**
  "Today we aren't discussing a text. We are running a diagnostic on a specific instrument. That instrument is *you*. Specifically, your introspective access. In philosophy and psychology, we often treat introspection as a direct line to the truth of our mental states. Today, we are going to test the reliability of that line.

  There are no right or wrong answers about how things feel. But there *are* facts about whether your reports remain stable when conditions change. You will be given tokens. You earn tokens by predicting your own consistency. You lose tokens if your second report contradicts your first without a change in the external stimulus."

  **The Stimulus:**
  Project a **uniform, mid-grey square** on the screen. No texture. No movement.
  *Instruction:* "Stare at the center of the square. Do not look away."

  ---

  ### Phase 2: Round 1 - Baseline (10-30)
  **Task:**
  1.  Hand out **Card A**.
  2.  **Prompt:** "Describe the *phenomenal character* of your visual experience of the square. Do not describe the screen or the room. Describe the *experience itself*. Is it flat? Deep? Vibrating? Static? Color-tinted? Be as precise as possible."
  3.  **Time:** 5 minutes of silent staring and writing.
  4.  **The Wager:** Ask them to place 5 tokens on the table. "If you were shown this same stimulus again in 15 minutes, would you write the same description? If yes, keep the tokens. If you think your description might change, put the tokens in the 'bank' (center of table)."
      *   *Goal:* Most will keep tokens, assuming their experience is stable.
  5.  Collect Card A. Do not let them keep it.

  ---

  ### Phase 3: Round 2 - Interference (30-50)
  **The Manipulation:**
  Divide the room into two groups (Left side / Right side). Hand out **Card B**.

  *   **Group 1 (The "Fatigue" Frame):** "Recent studies suggest that staring at uniform grey fields induces 'neural noise' in the visual cortex. Participants often report a subtle *graininess* or *shimmering* after 10 minutes. Please monitor for this."
  *   **Group 2 (The "Stability" Frame):** "Recent studies suggest that the visual system locks onto uniform fields to conserve energy. Participants often report a sense of *deep stillness* or *flattening* after 10 minutes. Please monitor for this."

  **Task:**
  1.  Project the **exact same grey square** (do not change the image).
  2.  **Prompt:** "Describe the *phenomenal character* of your visual experience *right now*. Again, focus on the experience itself."
  3.  **Time:** 5 minutes.
  4.  **The Reckoning:** Return Card A to each participant.
  5.  **Comparison:** Ask them to compare Card A and Card B.
      *   "Did your description change?"
      *   "Did the *experience* change, or just the words?"
      *   "Collect your tokens. If your description changed significantly, you lose the wager."

  *(Note: Predictably, Group 1 will report graininess/shimmer; Group 2 will report stillness/flatness. Most will lose tokens.)*

  ---

  ### Phase 4: The Audit (50-65)
  **Facilitator Role:** Socratic Moderator. Do not explain *why* yet. Just highlight the data.

  1.  **Whiteboard Tally:**
      *   How many people changed their description? (Show of hands).
      *   How many felt the *experience itself* was different in Round 2 compared to Round 1?
  2.  **The Realist Challenge (Anticipated):**
      *   *Regular Realist:* "Okay, the *description* changed because you primed us. But I *felt* the shimmer. That feeling was real. You haven't shown the experience is an illusion, only that language is flexible."
      *   *Facilitator Counter-Move:* "Did the physical stimulus change?" (No). "Did your eyes change?" (No). "So the difference in 'shimmer' vs 'stillness' was generated entirely by your cognitive system's expectation."
      *   *Follow-up:* "If your cognitive system can generate 'shimmer' where there is none, can it generate 'qualitative character' where there is none? How do you distinguish the 'real' feel from the 'generated' feel from inside the system?"
  3.  **The Trap:**
      *   Push them on the **Access Gap**. "You only have access to the experience *via* the introspective report. If the report is constructed by expectations, what are you accessing? Is there a 'raw feel' underneath the construction that you can point to without using the construction?"

  ---

  ### Phase 5: Debrief & Theory Reveal (65-90)
  **Reveal:**
  "Now I can name the view. This is **Illusionism** about phenomenal consciousness (specifically the Frankish/Dennett line)."

  **Mapping the Activity to the View:**
  1.  **The Stimulus:** Represents the underlying physical/functional state of the brain.
  2.  **The Report:** Represents our introspective judgment.
  3.  **The Discrepancy:** Represents the **User-Illusion**.
      *   *Point:* "In Round 2, you didn't lie. You *experienced* shimmer. But the shimmer wasn't a property of the visual input; it was a property of the *monitoring system*. Illusionism argues that 'qualia' (intrinsic, ineffable qualities) are like the shimmer. They are real *experiences*, but they are not *properties* of the experience. They are the *format* of the introspection."

  **Addressing the "Illusion is Conscious" Objection:**
  *   *Objection:* "But the shimmer itself was conscious! You just added more qualia!"
  *   *Illusionist Response:* "Correct. The *state* is real. The *attribution* is the illusion. You attributed 'intrinsic shimmeriness' to the state. Illusionism says: The state is a functional processing state. The 'shimmeriness' is how that state *appears* to the introspective system. Just as the grey square didn't actually shimmer, your brain states don't actually possess 'intrinsic qualia'—they just *appear* that way to you."

  **The Debt (Crucial Step):**
  Write on the board: **"THE EXPLANATORY DEBT."**
  *   "Illusionism does not solve the Hard Problem by denying consciousness. It solves it by denying the *premises* of the Hard Problem. But it incurs a debt."
  *   *Ask the Group:* "If qualia are an illusion, what is the mechanism of the illusion? What do I owe you an explanation of?"
  *   *Target Answer:* "You owe us an account of *why* introspection misrepresents functional states as qualitative states in non-phenomenal terms."
  *   *Facilitator Note:* "Exactly. We now need a cognitive science of introspection that explains the bug in the code. That is the research program."

  **What Illusionism Does NOT Deny:**
  *   It does not deny we are conscious.
  *   It does not deny we suffer or enjoy.
  *   It denies that our *introspective model* of that consciousness is accurate.

  ---

  ### Predicted Failures & Mitigation

  **1. Collapse into Eliminativism ("You're saying we're zombies")**
  *   *Risk:* Participants think you are denying the existence of pain/joy.
  *   *Mitigation:* In the Debrief, explicitly say: "If you burn your hand, you will pull it away and scream. Illusionism agrees. The pain is real. The claim is only about the *metaphysical nature* of that pain as revealed by introspection. The 'ouchiness' is a user-interface icon, not the code itself."

  **2. The Realist Dig-In ("I know what it's like better than you")**
  *   *Risk:* The committed realist refuses to accept the "construction" argument, insisting on the incorrigibility of the first-person perspective.
  *   *Mitigation:* Do not fight them on the *reality* of the feeling. Fight them on the *authority* of the interpretation.
      *   *Script:* "I am not saying you are wrong about how it feels. I am asking: How do you know the 'feeling' isn't the 'interpretation'? In the game, you felt shimmer. The shimmer was the interpretation. If you can't distinguish shimmer from interpretation in the game, why trust the distinction in metaphysics?"

  **3. Confusion with Priming ("This is just suggestion")**
  *   *Risk:* They dismiss the result as "obvious priming" and miss the philosophical point.
  *   *Mitigation:* Acknowledge it is priming. "Yes. But if 'what it is like' is susceptible to semantic priming, then 'what it is like' is not an intrinsic, non-representational property. It is conceptually penetrable. That breaks the definition of Qualia."

  ---

  ### Limitations (What You Must Supply)
  This activity cannot reproduce the **positive account** of the illusion.
  *   **The Gap:** The activity shows introspection is fallible/constructive. It does *not* show *how* a physical system generates the false belief in qualia.
  *   **Your Job:** In the final 10 minutes, you must briefly sketch the "User Interface" theory (Dennett's "Cartesian Theater" critique or Frankish's "Quasi-Phenomenal Properties"). You need to explain that the "debt" is paid by cognitive science, not armchair philosophy.
  *   **Honesty:** Tell them: "This game creates the *motivation* for Illusionism. It does not prove it. The proof lies in whether cognitive science can actually model the misrepresentation without cheating."

  ### Practical Notes
  *   **Allergy:** No food used. Tokens are paper/clay.
  *   **Wifi:** Not needed. Images are static.
  *   **Room:** Arrange chairs in a semi-circle so they can see each other during the Audit phase.
  *   **Handout:** Keep instructions on the printed sheet so you don't have to lecture the rules.

