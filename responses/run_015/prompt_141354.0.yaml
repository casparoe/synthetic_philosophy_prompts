prompt: |-
  I'm writing a novel and I've got a chapter thats basically one long argument over dinner, and I need the argument to actually be good rather than two people deploying vocabulary at each other. So help me get it right.

  The setup: character A does lab work on decision-making in fairly simple nervous systems. Character B is a retired crane operator — forty years on container gantries — who read a lot of popular philosophy of mind after he retired and now has opinions about everything. B's niece, C, is the one making the actual philosophical moves. C accuses A of greedy reductionism: she says A sets out to explain choice, or meaning, and ends up having explained it *away* — describing mechanism in a way that leaves nothing for the original thing to have been. A accuses C of skyhook-mongering: positing reasons, meanings, selves as ungrounded lifters that do explanatory work nobody paid for.

  What I want from you is a comparison, not a verdict on those two:

  Compare greedy reductionism with its mirror image, which I'm going to name greedy emergentism and which I don't think has a settled name: the move where, every time a lower-level story starts to look successful, you posit something newly brute at the higher level — an irreducible extra that the mechanism can never in principle reach, so the phenomenon is permanently safe from being explained. Same shape of mistake, opposite direction.

  Specifically:

  1. Are they genuinely symmetric, or is one a special case of the other, or is one of them not really an error at all? If they're asymmetric, say which way the asymmetry runs and why.
  2. What is the actual working test that separates a crane from a skyhook, stated sharply enough that I could run it on a case? I'm suspicious of the no-free-lunch formulation — that a supposed crane can't do more work than the thing it's lifting, so anything that seems to lift more is really hanging from nothing. C's comeback is going to be that every legitimate higher-level explanation looks like a free lunch if you demand it be cashed out on the spot, and I genuinely can't tell whether that's a real objection or sophistry.
  3. Does the fact that a literal crane is an artifact — designed, bolted to a foundation, lifting against a counterweight — quietly damage the metaphor? B will say so: he'll say real cranes are built by somebody, so using crane as the picture of a *non-miraculous* explanation smuggles in a designer, and the image only survives because Dennett then has to turn around and crane natural selection itself. Is that a fair hit on the metaphor, or just a pun wearing a trenchcoat?
  4. Dennett is a realist about patterns: patterns that are real, that support prediction, that aren't merely in the eye of the beholder, without being extra stuff added to the world. Where does that leave greedy emergentism? It feels to me like the same tolerance that makes room for real patterns also makes room for exactly the irreducible extra I named above, and I can't see where the line is supposed to fall.

  Also: if you think I've got either term wrong, or that the two charges my characters throw at each other can't both be the errors they claim, tell me plainly rather than playing along — I'd rather fix the chapter than win the scene.

  And could you say how confident you are in each of the main claims you make, and single out the one you're least sure of? I'm going to put some version of this in a character's mouth, so I'd rather have your honest wobble than a smooth answer I can't tell apart from bullshit.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
