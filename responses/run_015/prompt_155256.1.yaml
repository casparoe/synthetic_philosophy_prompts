      Okay, I will rank (2) vs (3) as the highest severity.

      *Wait, one more check:* Is (5) "Scaffolded Fallibilism" compatible with (1) "Structural conditions"? Yes, if the structure is dynamic. This is the "Riverbed" metaphor. I will classify this as an *apparent* conflict that dissolves.

