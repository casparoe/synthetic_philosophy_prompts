          *   *Conflict:* To see the framework as contingent, one seemingly needs a vantage point *outside* or *above* the framework. But (4) denies global transferability. If I can't step outside, how do I know it's contingent? I can only know it's contingent if I imagine a *different* framework. But if I'm in *this* one, the hinges here are certain.
          *   *Severity:* Medium-High. It's the classic relativist/coherentist problem.

      *   **Tension C: Structural Conditions vs. Revisability (1 vs. 5)**
          *   (1) Hinges are conditions for evidence.
          *   (5) Hinges are revisable (fallibilism).
          *   *Conflict:* If $X$ is a condition for justification, how can $X$ be justified or revised? Usually, conditions are transcendental. If they change, does logic change?
          *   *Resolution:* Wittgenstein allows riverbed shifts. (5) explicitly handles this ("clusters," "radical shifts"). This is a standard "dynamic foundationalism" move.
