      *(Self-Correction during drafting)*: Is (3) really incompatible with (4)? (4) says certainty isn't globally transferable. (3) says the framework is contingent. One can hold that *within* a framework, one can imagine others. But (2) says BIV is *not intelligible*. That's the killer. If BIV is unintelligible (2), it can't reveal contingency (3). So (2) and (3) are the primary clash. (4) supports (2).
      So, Tension 1: (2) vs (3).
