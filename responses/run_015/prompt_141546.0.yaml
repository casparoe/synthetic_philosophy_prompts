prompt: |-
  Hi — hoping someone can help me out here, I've been going round in circles on this for about a week and I really don't want to stand up in front of fourteen people in a fortnight and repeat something that isn't true. I'm doing a part-time MA and I've got to lead a reading group session (90 minutes, mixed levels, most people have done a module or two of philosophy) on Russell's "On Denoting" read next to Strawson's "On Referring", and I'm also trying to spin the same material into an essay afterwards. While I was prepping I read a chapter of one of those very readable popular history-of-analytic-philosophy books — I won't name it, it's mostly very good — and it summarises Russell's theory roughly like this (badly paraphrased from memory, so the wording's mine, not theirs):

  "A definite description like 'the present King of France' isn't really a name in disguise; its meaning just is the object it picks out, and Russell's trick was to stop talking about meanings and talk about existence and uniqueness instead. Formally, 'the F is G' means no more and no less than: there is at least one F, there is at most one F, and it — the F — is G. That's why 'the present King of France is bald' comes out straightforwardly false rather than meaningless or neither-true-nor-false, and why we can truly say the present King of France doesn't exist, which was the main point of the whole exercise: it lets us deny that there are golden mountains or round squares without admitting odd objects that somehow don't exist. The same machinery explains why 'Scott is the author of Waverley' can be informative while 'Scott is Scott' isn't. Then Strawson showed in 1950 that the whole thing rested on a confusion: sentences aren't true or false at all, only the statements people make with them on particular occasions are, so when there's no King of France an utterance of the sentence has no truth value, and Russell's tidy false verdict collapses. Kripke finished the job twenty years later by showing that names are rigid designators and aren't shorthand for descriptions. So the theory was a brilliant first achievement for analytic philosophy, but nobody in semantics or linguistics really works with it any more."

  The last bit is the part I defintely don't trust — the Kripke sentence feels like it's aimed at a different target than the one Russell was answering, but I can't say exactly why, and my supervisor only muttered something about "scope" and about Russell not being committed to 'the' meaning "exactly one thing in the entire universe" before she had to run for a train. Meanwhile our reading group tried the flat three-clause gloss on some cases and it kept giving answers we didn't like, and I can't tell whether that's Russell's problem or ours: (1) "the present King of France isn't bald" seems to have two readings, but on the chapter's version I can't see where the second one comes from; (2) someone says "the table's wobbly" in a room with three tables, two of them fine — the chapter claims Russell has no answer here at all and that this is decisive against him; (3) "a bloke walked into the pub, and the bloke ordered a pint", where uniqueness obviously can't be about there being exactly one bloke in existence. We also hit the case of "the Pope is French" uttered during an interregnum, where the Russellian "false" verdict suddenly seemed exactly right, which made me think the Strawson bit can't be the whole story.

  So: could you go through that summary more or less claim by claim and tell me what a Russellian would happily accept, what they'd wince at as a simplification, and what is just wrong — and whether the "nobody works with it any more" punchline follows from the bits that are accurate? And seperately, does Russell's own machinery (whatever the scope business is, and this thing about descriptions having no meaning in isolation) actually have answers to my three cases, or does it have to be patched, and patched by whom? I'd also be grateful for a note on which of these fights are still live rather than settled, so I know what to say when someone in the group asks.
