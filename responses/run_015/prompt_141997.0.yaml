      *   **Two Approaches Identified:**
          *   (a) Change/State-Distance (e.g., Relative State Reachability, Stepwise Inaction Baseline).
          *   (b) Option-Preservation (e.g., Attainable Utility Preservation).
      *   **Specific Suspicion about (a):** The "Office Tidying" case. Moving books 3 feet vs. keeping them put. The metric determines what matters, making the "inaction baseline" seem like a red herring. Is the baseline doing work, or is it all in the metric?
      *   **Specific Suspicion about Offsetting:** If change is bad *full stop*, the agent is paralyzed. If change can be offset (bad effect + good effect = net zero), you need a common currency (value specification). So is this just value specification in disguise?
      *   **Specific Worry about (b):** An agent preserving options might curb *others'* options to maintain its own or global option space.
