      *   *Least Certain Point:* Whether we can define a set of auxiliary utility functions that captures "impact" without implicitly capturing "human values" (the "Is Impact just Value?" question).

  5.  **Final Polish:**
      *   Ensure tone is analytical and respectful.
      *   Make sure the "Office Case" is walked through step-by-step as requested.
