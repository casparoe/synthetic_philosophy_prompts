          *   Let's propose **The Steward vs. The Father.**
          *   Actually, **The Triage Nurse** is the friend's model. The counter-model is **The Parent in the Burning Building.**
          *   Let's suggest **The Anchor.** Justice floats; the Anchor holds.
          *   Better: **The Covenant.** Justice is a contract; Parenthood is a covenant.
          *   Let's go with **The Burning House.** It's visceral. It removes the "calculation" aspect.
          *   Wait, I need a figure that handles the *choice*.
          *   How about **The Captain of a Sinking Ship**? "Women and children first" is a rule, but what if it's *your* child?
          *   Let's stick to the **Burning House** but refine it. In a burning house, we do not expect a father to save the neighbor's child because it has a higher IQ. We expect him to save his own. The "Justice" model applies to public resources; the "Home" model applies to private obligations. The Harbor is a public space, but the bond is private.
          *   *Refined Alternative:* **The Dual Mandate.** The pilot holds two commissions. One from the State (save lives), one from Nature/Blood (save kin). The tragedy is the collision of mandates, not a failure of impartiality.

  8.  **Final Polish:** Ensure the tone is respectful to the philosopher friend but firm on the literary/ethical nuance. Ensure Williams is interpreted correctly (he argues against the *overridingness* of impartial morality).

      *   *Self-Correction on Williams:* Williams argues that if a man saves his wife, and justifies it by saying "it is my wife," that is okay. If he justifies it by saying "in this situation, saving a wife maximizes utility," that is "one thought too many." The friend says Williams just hates the blindfold. The counter is that the blindfold prevents seeing the *source* of the value.
      *   *Key distinction:* Impartiality is for *institutions*. Partiality is for *relationships*. The Pilot is an institution (Harbor Master role) AND a relationship (Father). The conflict is Role vs. Bond.

