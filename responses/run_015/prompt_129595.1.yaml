answer: |-
  1. **The Dependency Structure**

  You are correct that the target is the dependence of *phenomenal character* on *functional organization*, not personal identity. To state the scenario without begging the question, you must establish three distinctions in this specific order before the first neuron is swapped:

  *   **First: Counterfactual Functional Organization.** You must define functional role dispositionally (inputs, internal states, outputs across possible scenarios), not as a match of actual history. If you define it as actual I/O match, a frozen brain or a lookup table qualifies, and the cognitive science students will reject the premise immediately. If this arrives late, the "Zombie" objection will derail the seminar before the substitution begins.
  *   **Second: Phenomenal vs. Psychological Consciousness.** You must distinguish *what it is like* (phenomenal) from *what the system can report/access* (psychological/access). If these are conflated, the "Fading" horn of the trichotomy collapses into "Amnesia," and the argument becomes trivial. This distinction must be in place before you introduce the prosthesis, or the class will assume that if the subject reports no change, experience *by definition* hasn't changed.
  *   **Third: The Principle of Organizational Invariance (POI) as a Premise, not a Conclusion.** You need the class to grant, for the sake of the argument, that fine-grained functional duplication preserves *causal powers* relevant to behavior. This is not yet the claim about experience; it is the claim about the mechanism. If this is not secured, the "Carbon Chauvinism" objection will arise during the substitution, claiming the silicon literally cannot do the job.

  **Load-bearing addition:** You need the **Noticeability Principle** explicitly on the board: *If phenomenal character changes significantly, and functional organization is held constant, the subject must be able to notice and report that change.* Without this, the "Fading" horn is not absurd; it is merely unobservable. This principle is the bridge between the functional setup and the phenomenal conclusion.

  2. **The Carrying Example**

  Your two-channel visual example is technically the setup for the *Dancing Qualia* argument, not the *Gradual Replacement* (Fading Qualia) argument. The Gradual Argument requires a Sorites pressure that a static split comparison lacks. A split comparison yields a binary (Same/Different); it does not force the "Fading" option.

  *   **Modification:** Use the two-channel setup to establish the **Noticeability Principle**, then run the **Gradual Replacement** on one channel to force the **Trichotomy**.
  *   **What it must have:** The channels must be causally isolated from each other to prevent cross-talk (which would break functional equivalence). The stimulus must be identical. The subject must be able to attend to either channel at will.
  *   **What it must lack:** It must lack any "switching cost." If switching attention from the bio channel to the prosthetic channel involves a temporal delay or a processing glitch, the functional organization is not constant.
  *   **Stipulation vs. Motivation:** Stipulate the duplication. Motivating it with engineering details invites the "Impossible Prosthesis" objection too early. Tell them: "Assume the prosthesis is functionally perfect at the relevant grain size."
  *   **The Trap:** You are correct that the trap is effective. Ask: "At the midpoint, if you attend to the prosthetic channel, is the red different?"
      *   If they say **No**: They have granted Organizational Invariance for experience.
      *   If they say **Yes**: Ask "Does the subject notice?" If "No," you have a Zombie/Report mismatch (violating the Noticeability Principle). If "Yes," ask "How, given functional equivalence?" (violating the definition of functional organization).
  *   **Dreamless Sleep:** **Keep it.** Performing the initial swaps during dreamless sleep defuses the "Panic/Disruption" objection (i.e., that the subject would notice the surgery). It isolates the substitution from the phenomenology of the procedure.
  *   **Reverse Sequence:** **Noise.** It adds time without adding logical pressure. The Sorites works one way. Use that time to drill the trichotomy instead.

  3. **The Misconception Map**

  *   **Ship of Theseus (Identity vs. Experience):**
      *   *When:* Section 1 (Dependencies).
      *   *Defusing:* "We are not asking if *you* survive. We are asking if *redness* fades. You can survive without your appendix; can experience survive without neurons?"
  *   **Carbon vs. Silicon (Substrate Chauvinism):**
      *   *When:* During the description of the prosthesis.
      *   *Defusing:* "The material is irrelevant. Use magic chips if you like. The question is whether the *pattern* matters or the *stuff* matters."
  *   **Assumes Functionalism:**
      *   *When:* Conclusion/Wrap-up.
      *   *Defusing:* "This is a *reductio*. It shows that denying functionalism forces you into the 'Fading' or 'Dancing' horns, which are arguably more absurd than functionalism itself."
  *   **Impossible Prosthesis (Tech Objection):**
      *   *When:* Setup.
      *   *Defusing:* "This is a modal claim, not an engineering roadmap. We are testing metaphysical possibility, not current feasibility."
  *   **Retreat to Vagueness (No Fact of the Matter):**
      *   *When:* The Trichotomy stage.
      *   *Defusing:* "Vagueness allows for borderline cases, not for a total collapse of experience while behavior remains perfect. At what precise percentage does the light go out?"
  *   **Missing: The Inner Observer (Homunculus):**
      *   *When:* Discussing the "Fading" horn.
      *   *Defusing:* "There is no little man inside watching the screen fade. If the system reports 'all is well,' the fading is phenomenally real but cognitively inaccessible. That is the absurdity."
  *   **Missing (CogSci specific): Neural Compensation/Plasticity:**
      *   *When:* CogSci students object to functional equivalence.
      *   *Defusing:* "The prosthesis includes the compensation. If the biological brain adapts to the chip, the chip must adapt to the brain to maintain the *joint* functional organization. The system as a whole is the unit of analysis."

  4. **Where the Gradualness is Doing the Real Work**

  You must explicitly contrast the **Single-Step** case with the **Gradual** case.
  *   **Single-Step:** If you swap the whole brain at once, the opponent can claim a "nomological dangler" or a "miraculous discontinuity." They can say, "Convenience supervenes on biology, and when biology crosses a threshold, experience snaps off." This is plausible enough to stop the argument.
  *   **Gradual:** The gradualness removes the threshold. It forces the opponent to identify a specific neuron $N$ where removing it extinguishes experience. Since no single neuron is the "experience neuron," the opponent must accept either that experience stays fixed (Functionalism) or that it fades imperceptibly (The Absurd Horn).
  *   **Uploading Safety:** Do not let them conclude "Uploading is safe." The argument shows: *If* you reject the Absurd Horn, *then* Functionalism is true. It does not prove we can build the prosthesis. It proves that *if* we build it, we haven't killed the mind. Distinguish *metaphysical possibility* from *engineering safety*.

  5. **One Thing to Refuse to Explain**

  Refuse to explain **why** functional organization gives rise to experience (or why it wouldn't).
  *   **What to say:** "This argument does not solve the Hard Problem. It does not tell you *how* consciousness arises. It only tells you *where* to look for it. It constrains the solutions; it is not a solution. Asking me why function produces feeling is like asking a map why the terrain is mountainous. The map only tells you where the mountains are."

  6. **A Closing Check**

  Do not ask "Who agrees with Functionalism?" Ask them to diagnose an objection.

  **The Task:** Present the following objection: *"Suppose the subject's memory degrades slightly with each swap, so they cannot remember the original qualia to compare. Thus, they report no change, but experience has faded."*

  **The Question:** "Which specific premise or distinction from the first 20 minutes does this objection attack, and how must we modify the thought experiment to block it?"

  **Correct Answer:** It attacks the **Noticeability Principle** (or the link between Phenomenal and Access consciousness). To block it, you must stipulate that the prosthesis also replaces/augments memory to ensure *functional* equivalence includes the capacity to report/compare. If they identify that the objection tries to break the link between *experience* and *report* by exploiting a functional mismatch (memory loss), they understand the structure.
