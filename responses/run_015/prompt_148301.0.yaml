      *   *Is this viable?* Yes. This is the standard compatibilist or nuanced materialist position. You can acknowledge structural constraints (high CSW) without absolving agents of duties within those constraints.
      *   *What is the cost?*
          *   You lose the punchy claim that traditional historians are *normatively* wrong (misallocating blame). You can only say they are *causally* incomplete.
          *   You have to develop a theory of responsibility that isn't proportional to causal weight. (e.g., Responsibility is proportional to *marginal leverage* or *duty of care*, not total causal determination).
          *   You risk a "dual account" where explanation and ethics live in separate silos, which might feel unsatisfying.

