      *   **Premise (6):** Generalization: This applies to *all* large-scale catastrophes (non-human factors always have higher CSW than human choices).
      *   **Premise (7):** Reductio ad Absurdum: Accepting (4) + (6) means withdrawing moral/political accountability from humans for almost all large-scale outcomes.
      *   **Premise (8):** Consequence: This collapses explanation vs. accountability, making environmental determinism perilous.
      *   **Premise (9):** Dilemma: Reject (1) [metric is wrong] or (4) [weight $\neq$ responsibility].
