  2.  **Analyze the Logic and Identify the "Illicit Slide":**

      *   *The Core Tension:* The argument moves from *causal efficacy* (what made the difference?) to *normative responsibility* (who is to blame/praise?).
      *   *Premise (4) is the culprit.* It asserts a direct link between Causal Weight and Normative Responsibility.
      *   *Why it looks valid:* In everyday life, we often link cause and blame. If I push you (high causal weight), I'm responsible. If a gust of wind pushes you (high causal weight), no one is responsible. We intuitively think "The biggest cause bears the responsibility."
      *   *Why it's false (The Equivocation):* "Responsibility" has two meanings here.
          1.  *Causal Responsibility:* What brought this about? (The volcano caused the famine).
          2.  *Moral/Political Responsibility:* Who can be held answerable, punished, praised, or expected to do differently? (The Emperor failed to store grain).
      *   *The "Control Condition":* Moral responsibility usually requires *control* or *capacity to do otherwise*. A volcano has high causal weight but zero control. A general has low causal weight (in this specific macro model) but high control over his specific decisions.
      *   *The Scope Shift:* Premise (2) talks about *macro-outcomes* (Fall of Rome). Premise (4) talks about *responsibility*. But we hold people responsible for *actions within their sphere of influence*, not necessarily the *total macro-outcome*.
      *   *The "Substitutability" Issue (Premise 6):* The argument claims human choices are "substitutable." If General A doesn't invade, General B does. This reduces CSW for *specific* humans but ignores *structural* human agency (the system that produces generals).

