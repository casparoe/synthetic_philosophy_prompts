      *   **Pinpoint the Error:** It is indeed in **Premise (4)**. This is the "Is-Ought" gap applied to historiography. Specifically, it conflates *Causal Primacy* with *Moral Addressability*.
      *   **Explain Why It Looked Valid:** The "Proportionality Principle." We intuitively think the biggest cause gets the most blame. Also, the frustration with "Great Man History" makes (4) feel like a corrective justice move.
      *   **Analyze the Cost of Rejecting (4):**
