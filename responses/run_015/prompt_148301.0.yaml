      *   **Address Premise (6) (Generalization):** This is too strong. Human choices *can* have high CSW in tipping points (butterfly effects), even if ecology sets the stage.
      *   **Synthesize:** The user's intuition to save (1) is correct. Environmental determinism explains the *stage*, human agency explains the *performance*. Responsibility attaches to the performance, even if the stage limits the genre of play.

