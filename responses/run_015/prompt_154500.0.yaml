      *   **User's Goal:** Wants an *audit*, not a verdict. Wants to understand *why* the analogies work or fail, specifically regarding the correspondence tables, disanalogies (sorted by relevance), hidden assumptions, and testing against three specific thought experiments (Dimmer, Mood Channel, Hemispherectomy/Agenesis).
      *   **Constraints:** British English. No references or further reading (argument only).
