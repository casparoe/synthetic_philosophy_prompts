          *   *Substantive:* Departments don't fight physically. Intermanual conflict implies agent-level conflict, not just data error.

  5.  **Addressing Hidden Imports (What the analogies smuggle in):**
      *   *Twins:* Smuggles in the idea of a "homunculus" inside each hemisphere. Assumes a hemisphere is a complete container for a self. Smuggles in legal/moral personhood (twins are legally distinct).
      *   *Departments:* Smuggles in the idea that "subjectivity" is a high-level output, not a low-level state. Assumes unity is a matter of reporting, not experiencing.

  6.  **Testing the Three Thought Experiments:**
      *   *1. The Dimmer (Continuous bandwidth reduction):*
