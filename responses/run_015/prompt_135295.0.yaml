answer: |-
  This is a remarkably precise diagnosis of a contemporary interdisciplinary pathology. You have identified a mechanism of conceptual drift that is distinct from the usual suspects (metaphor, polysemy, stretching) because it relies on the *retention* of inferential structure alongside the *abandonment* of ontological grounding.

  You are correct that existing terminology is insufficient. "Boundary objects" (Star & Griesemer) describes concepts that are plastic enough to adapt to local needs yet robust enough to maintain identity across sites. However, that literature typically treats this plasticity as a *feature* that enables cooperation. Your case describes a *bug* that generates equivocation. "Multiple realizability" (Putnam) describes a functional kind realised by different physical substrates, but it presupposes that the functional inferences *hold* across realisations. You are arguing that in these cases, the inferences *fail*.

  Here is my assessment of the nearest candidates, a proposal for a new carving, and the requested critique of the proposal itself.

  ### 1. Nearest Existing Candidates

  **A. Boundary Objects**
  *   **Fit:** High. 'Attention' functions exactly as a boundary object between ML, economics, and ethics. It allows collaboration without consensus.
  *   **Difference:** Boundary object theory is sociological and generally agnostic about truth claims; it explains how coordination happens, not how logical errors propagate. Your phenomenon is normative and logical: it explains how *mistakes* happen. A boundary object is a successful bridge; your concept is a Trojan horse.

  **B. Equivocation (Logical Fallacy)**
  *   **Fit:** High. The outcome you describe—illicit inference—is precisely equivocation.
  *   **Difference:** Equivocation names the *error in argument*, not the *state of the concept*. You need a term for the conceptual vehicle that makes the equivocation possible and tempting. Equivocation is the crash; you are describing the faulty engineering of the road.

  **C. Multiple Realizability (Functionalism)**
  *   **Fit:** Medium. This captures the idea that 'attention' might be a function (selection/weighting) realised by neurons, matrices, or budgeting.
  *   **Difference:** Functionalism claims that if the role is the same, the concept is the same. You are arguing that the role is *not* the same, even if the grammar matches. The phenomenon you describe is a *spurious* claim to multiple realizability.

  ### 2. A Proposal: Formal Mimicry

  Since no existing term captures the retention of grammar/norms alongside the loss of criteria, I propose we formalise your intuition of "copycat concepts" as **Formal Mimics**.

  **Definition:**
  A concept $C_2$ in Domain $B$ is a **Formal Mimic** of concept $C_1$ in Domain $A$ if and only if:
  1.  **Structural Retention:** $C_2$ retains the inferential grammar (logical syntax) and normative profile of $C_1$.
  2.  **Ontological Swap:** $C_2$ discards the criteria of application (ontology/mechanism) of $C_1$ in favour of criteria local to Domain $B$.
  3.  **Illicit Licensing:** The retention of (1) licenses inferences in Domain $B$ that are only valid given the criteria of (2) in Domain $A$.

  **The Carving:**
  *   **Must Cover:**
      *   **Attention:** (ML weights vs. Moral regard). The grammar of "direction" and "scarcity" travels; the criteria (matrix math vs. phenomenological commitment) do not.
      *   **Bias:** (Statistics vs. Ethics). The grammar of "systematic deviation from a norm" travels. In statistics, the norm is an expectation value (neutral); in ethics, the norm is fairness (loaded). The mimic allows one to treat a statistical bias as an ethical fault without bridging the is-ought gap.
      *   **Temperature:** (Thermodynamics vs. LLMs). The grammar of "disorder/randomness" and "tuning" travels. The criteria (kinetic energy vs. probability distribution scaling) do not.
  *   **Must Exclude:**
      *   **Dead Metaphors:** (e.g., 'Leg' of a table). The normative profile and inferential grammar are not active. We do not reason about the table's leg as if it were biological.
      *   **True Functional Kinds:** (e.g., 'Memory' in humans and computers). If the functional inferences *do* hold (e.g., storage capacity limits apply to both), it is a genuine functional kind, not a mimic.
      *   **Mere Homonyms:** (e.g., 'Bank' of a river vs. 'Bank' for money). There is no structural retention or deliberate modelling.

  **Best Fit:**
  This fits your case better than "conceptual stretching" because the extension isn't just growing; it is *jumping* domains while wearing a disguise. It fits better than "metaphor" because the users insist on literal technical identity.

  ### 3. What Would Change My Mind

  You asked for epistemic humility and specific pressure points. Here is where this proposal is vulnerable.

  **A. The Weakest Case: 'Temperature'**
  The migration of 'temperature' from thermodynamics to LLM sampling parameters is the least robust member of this family.
  *   **Why:** Does it carry a *normative profile*? In thermodynamics, temperature is descriptive. In LLMs, "high temperature" implies "creative/diverse" and "low temperature" implies "focused/deterministic." There is a tuning norm, but it is instrumental, not moral or economic.
  *   **Threat:** If 'temperature' lacks a robust normative profile (it is merely a control knob), it may collapse back into **Technical Metaphor**. If the borrowing is purely heuristic and no one truly believes the tokens are "hot," then it is not a Formal Mimic. It is only a mimic if engineers or theorists claim the parameter *captures the essence* of thermodynamic temperature in a way that licenses physical inferences (e.g., "cooling the model").
  *   **Test:** If you can find literature where 'temperature' in LLMs is used to justify claims about energy consumption or thermodynamic limits of compute, the mimicry holds. If it is treated purely as a scaling factor name, it is a metaphor.

  **B. The Functional Kind Trap**
  My proposal assumes the inferences are *illicit*. But what if the functionalists are right?
  *   **Threat:** If 'attention' *is* a genuine functional kind (selection via weighting), then the ML and Moral versions are simply different realisations. The "illicit inference" is only illicit if you assume a dualist ontology (mind vs. machine). If you are a functionalist, the migration is valid.
  *   **Collapse:** My proposal risks collapsing into a **prejudice against functionalism**. To maintain the distinction, the definition of "Formal Mimic" must require that the *domain experts themselves* treat the criteria as non-interchangeable, even if the grammar matches. If the ML researcher says "This is *like* attention" (Metaphor) vs "This *is* attention" (Mimic), the distinction holds. If they say "This is attention, and therefore moral inferences apply," they are committing the error. If they say "This is attention, and moral inferences do *not* apply," it is a Functional Kind. The phenomenon exists only where the grammar invites the inference but the ontology forbids it.

  **C. The Boundary Object Rebound**
  *   **Threat:** You argue these concepts "destabilise" disputes. But sociologists might argue they *enable* the dispute to exist at all. Without the shared grammar, the ethicist and the computer scientist would have nothing to talk about.
  *   **Collapse:** The concept might collapse back into **Boundary Object** if we view the "destabilisation" not as a failure, but as the necessary friction of interdisciplinary work. The "illicit inference" might be the engine of hypothesis generation, even if logically invalid. (e.g., Treating the model as if it has "regard" might prompt new safety tests, even if the model lacks regard).
  *   **Defence:** To prevent this collapse, your definition must emphasise the *harmful* or *obfuscating* consequence. A Boundary Object facilitates coordination; a Formal Mimic facilitates confusion.

  ### 4. Technical Extrapolation and Caveats

  I must flag where I am extrapolating on technical details, as you requested.

  1.  **ML Attention:** I am relying on your characterisation of attention mechanisms as "weighted averages of value vectors." While standard for Transformers, attention mechanisms vary (e.g., sparse attention, linear attention). If the mechanism diverges significantly from the "softmax" description, the "grammar" of attention in ML might fragment, weakening the claim that there is a single ML concept mimicking the human one.
  2.  **Economic Attention:** I am assuming the "attention economy" treats attention as fungible. Some behavioural economists argue attention is *not* fungible (context-dependent). If the economic model is more nuanced, the "grammar" travelling to ethics might be a caricature of the economics, complicating the triad.
  3.  **Moral Attention:** I am assuming the "mid-century tradition" (likely Murdoch, Weil, or Wittgenstein) treats attention as a "quality of regard." Some contemporary virtue ethicists might operationalise this more behaviourally. If the moral criteria become behavioural, the gap with ML narrows, potentially turning the Mimic into a Functional Kind.

  ### 5. Summary Recommendation

  For your print purposes, I recommend adopting **Formal Mimicry**.

  *   **Why:** It captures the "grammar without criteria" insight better than "Copycat," which sounds pejorative rather than structural.
  *   **Usage:** "We are witnessing a case of formal mimicry: the term retains the inferential structure of the source domain while shedding its ontological commitments, thereby licensing category mistakes."
  *   **Boundary:** Be prepared to defend the claim that the inferences are indeed illicit (i.e., that 'attention' is not a true functional kind). This is the philosophical heart of your argument.

  If 'temperature' in LLMs proves to be merely metaphorical (lacking the normative/ontological confusion), exclude it. It weakens the case. Stick to 'Attention' and 'Bias', where the normative stakes (justice, fairness, regard) make the illicit inferences consequential. 'Bias' is arguably your strongest case, as the slide from "statistical deviation" to "moral prejudice" is currently driving significant policy and technical work, often without acknowledging the criteria swap.

  Finally, be wary of the **Boundary Object** counter-argument. Your interlocutors from sociology or STS (Science and Technology Studies) will likely argue that this ambiguity is productive. Your counter must be that while it is productive of *discourse*, it is destructive of *truth*. Distinguish between *coordination* (getting people to talk) and *comprehension* (getting people to mean the same thing). Formal Mimicry aids the former at the expense of the latter.
