answer: |-
  This is a genuinely sharp observation, and honestly, it's the kind of tension that makes for a standout dissertation chapter. You aren't missing something obvious; you've identified a gap where most scholars smooth over the rough edges of Bentham's utilitarianism to make him fit a modern liberal narrative.

  First, don't worry about the typo (`dissertaton`); if that's the biggest error in the draft, you're in great shape.

  Here is a breakdown of why your intuition is correct, where the economic model fits (and where it doesn't), and how you can leverage this tension rather than resolve it.

  ### 1. Are you importing an economic model?
  **Yes and no.** You are correctly identifying that Bentham's *felicific calculus* implies a logic of saturation. Bentham explicitly lists **Intensity** and **Duration** as the first two criteria of pleasure. He understands that human capacity for pleasure is finite and that stimulation can lead to pain (exhaustion, disgust, health issues).

  However, you might be attributing more *legislative ambition* to the calculus than Bentham intended. Bentham generally used the calculus as a tool for the **legislator** to evaluate laws, not as a micro-management tool for individual citizens.
  *   **The Epistemic Barrier:** Bentham was a legal reformer. He knew the state could not measure the marginal utility of an individual's sexual acts. To attempt to regulate sexual frequency to hit an "optimal utility curve" would require surveillance and intrusion that would generate vastly more pain (alarm, anxiety, loss of privacy) than the utility gained from optimizing sexual pleasure.
  *   **The "Indirect" Strategy:** Bentham's argument for decriminalization is often *rule-utilitarian* in practice, even if his theory is act-utilitarian. The rule "do not punish private consensual acts" yields higher utility than "punish acts that fall off the optimal pleasure curve," simply because the enforcement costs of the latter are catastrophic.

  ### 2. Rights vs. Optimization
  You hit the nail on the head here: **"His argument for decriminalization stops being a liberal rights claim and becomes a weird optimization prescription."**

  This is the crux of your chapter. Standard secondary literature (like Crompton or Boralevi) often frames Bentham as a proto-liberal defender of privacy. But as you noted, Bentham famously called natural rights "nonsense upon stilts." He has no ontological commitment to liberty.
  *   **The Tension:** If liberty is only instrumentally good, then liberty is *contingent*. If evidence arose that restricting certain sexual behaviors maximized utility (e.g., via your DMU argument or population concerns), Bentham's framework *would* demand restriction.
  *   **Your Contribution:** You can argue that Bentham's defense of homosexuality isn't based on a right to sexual autonomy, but on a **presumption of incompetence** on the part of the legislator. The state *cannot* optimize sexual utility better than the individual, not because the individual has a right to choose, but because the state lacks the data and the enforcement mechanism without creating net pain.

  ### 3. The "Purity" and "Fecundity" Criteria
  If you want to deepen the DMU angle, look at Bentham's other calculus criteria: **Purity** (chance of not being followed by pain) and **Fecundity** (chance of being followed by more pleasures).
  *   Bentham argues that homosexual acts (in his analysis) are often *purer* than heterosexual ones because they carry no risk of unwanted pregnancy or the "pain of childbirth."
  *   However, regarding **promiscuity vs. monogamy**: Bentham worries about jealousy. In his writings on marriage and sexuality, he acknowledges that jealousy is a massive source of pain.
  *   **The Synthesis:** You can argue that Bentham's "optimal distribution" isn't about the *frequency* of acts (DMU), but about the **relational context** that minimizes jealousy and maximizes security. This moves the argument away from "how much sex" to "what structure of relationships minimizes social pain."

  ### 4. Why the Secondary Literature Ignores This
  Most scholars focus on the **harm principle** aspect (Mill avant la lettre) because it's politically potent. They want to claim Bentham for queer theory or liberal jurisprudence.
  *   Digging into the *marginal utility of sexual pleasure* makes Bentham look weirdly technocratic and potentially illiberal (i.e., "The state should ban this because it yields low utility returns").
  *   Scholars avoid this because it exposes the vulnerability of utilitarianism: if the calculus changes, the "right" disappears. You are walking into the fire here, which is exactly where a dissertation should go.

  ### 5. Dissertation Strategy
  Don't try to solve the tension; **make the tension the argument.**
  *   **Thesis Idea:** Argue that Bentham's unpublished sexual ethics reveal a conflict between his **hedonic psychology** (which implies optimization) and his **legal theory** (which requires bright-line rules).
  *   **The Pivot:** Show that Bentham resolves this not by finding the "optimal" sexual frequency, but by concluding that the *pain of regulation* always outweighs the *utility gains of optimization* in the sexual sphere.
  *   **Conclusion:** This means Bentham's defense of homosexuality is more fragile than modern liberals assume. It relies entirely on the empirical claim that criminalization causes more pain than the acts themselves. It is not a defense of sexual freedom *per se*, but a defense of legislative restraint based on utilitarian accounting.

  **One caveat on terminology:** In your writing, be precise with "paederasty." Bentham used the term in the classical sense (often implying age-disparate relationships), though his broader argument extends to male-male sex generally. Ensure you distinguish between his analysis of *consent/capacity* (harm) and the *utility of the act* itself, as this intersects with your DMU point.

  This is a sophisticated read of the manuscripts. If you lean into the "optimization vs. liberty" conflict, you'll have a very strong chapter. Good luck with the writing!
