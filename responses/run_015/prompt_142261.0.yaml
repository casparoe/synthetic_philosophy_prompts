answer: |-
  Here is a complete lesson plan designed to generate the friction you need without lecturing the solution.

  ### **Logistics & Materials**

  *   **Room:** 4 Table Clusters + 1 Central "Bank" Table (your desk).
  *   **Students:** 18 (4 groups of 4, plus 2 floaters or one group of 5).
  *   **Currency:** "Deci-Points" (dP).
      *   **Value:** 10 dP = 1 Extra Credit Point on the next problem set.
      *   **Endowment:** Each student starts with **50 dP** (worth 5 EC points). This is significant enough to induce risk aversion but small enough that ruin isn't catastrophic.
      *   **Physicality:** Poker chips or printed tokens. Count them strictly.
  *   **Bidding:** Sealed bid slips.
      *   Rule: You write a bid (0–50 dP). If the game payout > bid, you keep the difference. If payout < bid, you lose the difference from your endowment. If you run out of dP, you are "bankrupt" and sit out (watch only).
  *   **The Coin:** Use a digital coin flipper (phone app projected or audible) for speed and to prevent "coin on floor" delays.
  *   **The Vault:** A clear acrylic box or jar at the front containing **200 dP**. This is the *only* source of payouts for Table 1. All other tables are backed by your "unlimited" budget (you pay from your own pocket/gradebook).

  ---

  ### **The Four Tables**

  Assign one specific mechanic to each table. Groups rotate clockwise after Round 1 and Round 2. (3 Rounds total, 15 minutes each).

  **Table 1: The Solvent House (Counterparty Risk)**
  *   **Mechanic:** Standard St. Petersburg rules (flip until Tails, payout $2^n$).
  *   **Constraint:** Payouts come *only* from the **Central Vault**.
  *   **Pedagogical Goal:** To make the "finite bankroll" objection visceral. As the vault drains, the *objective* value of the game drops because the probability of default rises, even though the *rules* of the coin flip haven't changed.
  *   **Visual:** A tally sheet next to the vault showing the remaining balance.

  **Table 2: The Black Box (Ambiguity/Knightian Uncertainty)**
  *   **Mechanic:** St. Petersburg rules, but there is a **House Cap**.
  *   **Constraint:** The Cap is $2^N$. $N$ is written on a card sealed in an envelope. $N$ is drawn from a uniform distribution between 5 and 20. The envelope is *not opened* until the end of the round.
  *   **Pedagogical Goal:** To distinguish *Risk* (known probabilities) from *Ambiguity* (unknown parameters). Students should bid lower here than at Table 4, even if the *expected* cap is high, because they cannot calculate the exact EV.

  **Table 3: The Season Pass (Ergodicity/Policy)**
  *   **Mechanic:** Students do not bid per game. They bid for a **Pass**.
  *   **Constraint:** One bid buys entry to **3 consecutive games**. They must play all 3. They cannot fold after a loss.
  *   **Pedagogical Goal:** To force a shift from *Outcome Evaluation* (what happens this flip?) to *Policy Evaluation* (what happens to my wealth trajectory over time?). This primes the "Time Averaging" resolution.

  **Table 4: The Classic (Baseline)**
  *   **Mechanic:** Standard St. Petersburg. Unlimited House Bankroll (you guarantee payment).
  *   **Constraint:** No twists.
  *   **Pedagogical Goal:** The control group. This isolates "pure" risk aversion/marginal utility without confounding factors like default risk or ambiguity.

  ---

  ### **Minute-by-Minute Timeline (75 Minutes)**

  **00:00 – 00:05: Setup & Stakes**
  *   Hand out 50 dP to each student.
  *   **Script:** "This currency buys extra credit. 10 dP = 1 point. Keep what you end with. If you hit zero, you sit out. You will visit three tables. At each, you will submit a sealed bid. Do not discuss bids between tables. Do not trade chips between students."
  *   **Forbidden Words:** Do not say "Expected Value," "Expectation," "Mean," or "Average." Use "Payout," "Winnings," or "Price."

  **00:05 – 00:20: Round 1**
  *   Groups settle at Tables 1–4.
  *   **Action:** Students submit sealed bids. Facilitator (or TA) runs the games.
  *   **Table 1 Specific:** Every payout is physically removed from the Central Vault. If the Vault hits 0, the table closes immediately. (Start with 200 dP; this allows ~10–15 average payouts before risk becomes high).
  *   **Table 3 Specific:** Students bid once for the 3-game pass. Run the 3 games immediately.
  *   **Collection:** Collect bid slips and record final chip counts.

  **00:20 – 00:25: Rotation 1**
  *   Groups move clockwise (1→2, 2→3, 3→4, 4→1).
  *   **Table 1 Check:** Announce the remaining Vault balance to the new group. "There is X dP left in the house."

  **00:25 – 00:40: Round 2**
  *   Repeat bidding and play.
  *   **Table 2 Specific:** At the end of this round, open the Envelope. Reveal the Cap $N$. Settle any payouts that exceeded the cap (they get capped).
  *   **Table 1 Check:** If the Vault is low, bids should naturally plummet. If it emptied in Round 1, this round is a "ghost game" (bids are lost, no play). *Note: If it empties too fast, refill it once and announce "House Bailout" to show policy change.*

  **00:40 – 00:45: Rotation 2**
  *   Groups move clockwise again.

  **00:45 – 01:00: Round 3**
  *   Final play.
  *   **Table 2 Specific:** Open a *new* envelope for this round (new Cap).
  *   **Collection:** Gather all chips. Tally final scores.

  **01:00 – 01:15: The Debrief (Crucial)**
  *   Do not lecture. Draw the data on the board.

  ---

  ### **The Debrief Script & Dialectic**

  **Phase 1: The Data Reveal (5 mins)**
  *   Write the median bid for each table on the board.
      *   Table 4 (Classic): Likely 5–10 dP.
      *   Table 1 (Vault): Round 1 bid vs. Round 3 bid. (Should show decay).
      *   Table 2 (Ambiguity): Likely lower than Table 4.
      *   Table 3 (Policy): Likely higher per-game equivalent than Table 4 (because they are hedging over 3 trials).
  *   **Ask:** "The coin is the same at every table. The math of the flip is the same. Why did the price change?"

  **Phase 2: Mapping Moments to Theory (10 mins)**
  *   **The Vault (Table 1):** Point to the drop in bids.
      *   *Question:* "Did the game change, or did the *world* change?"
      *   *Target:* They should identify **Counterparty Risk**. The "Infinite Expectation" assumes a solvent house. When the house can default, the expectation is no longer infinite.
      *   *Facilitator Note:* "One of you said last week the house bankroll matters. Today, you priced that risk without me telling you to."
  *   **The Black Box (Table 2):** Compare to Table 4.
      *   *Question:* "At Table 4, you knew the rules. At Table 2, you knew the *distribution* of rules, but not the rule. Why did you charge a premium for ignorance?"
      *   *Target:* **Ambiguity Aversion**. This maps to non-linear probability weighting or Maximin criteria.
  *   **The Season Pass (Table 3):** Compare to Table 4.
      *   *Question:* "At Table 4, you feared a single loss. At Table 3, you committed to three. Did anyone bid *more* per game here?"
      *   *Target:* **Ergodicity/Time Averaging**. In a single play (Table 4), the median outcome is low ($2). In a policy of repeated play (Table 3), the growth rate matters more than the single-shot expectation.
      *   *Hook:* "If you play once, you care about the ensemble average. If you play forever, you care about the time average. Which one is 'Rational'?"

  **Phase 3: The "Order of Summation" Claim (5 mins)**
  *   Address the student who claimed the sum is ill-defined.
  *   **Script:** "One of you suggested the expectation isn't well-defined because the sum depends on the order of terms. That is a property of *conditionally convergent* series (like alternating positive and negative terms). The St. Petersburg sum is all positive terms: $1 + 1 + 1...$ Rearranging positive infinity still gives you infinity. Mathematically, the sum is stable."
  *   **The Pivot:** "But your intuition wasn't wrong. The *value* is unstable, even if the *sum* isn't. The sum assumes you can aggregate outcomes across infinite parallel universes. But you live in one timeline. The instability isn't in the arithmetic; it's in the mapping from arithmetic to *choice*."

  ---

  ### **Predictable Failure Modes & Fixes**

  1.  **The Joker Bid (0 or 50):**
      *   *Risk:* A student bids 0 to be funny, or 50 to show off.
      *   *Fix:* In the debrief, exclude outliers explicitly. "We're looking at the median, not the hero." If they bid 50 and lose, they lose their EC points. They usually learn fast.
  2.  **Hedging Across Tables:**
      *   *Risk:* Students trade chips between rounds to insure each other.
      *   *Fix:* Strict rule in intro: "Your chips are yours. Trading is collusion. If I see chips moving between people, both accounts are zeroed."
  3.  **Vault Math Bottleneck:**
      *   *Risk:* Counting chips out of the vault slows the rotation.
      *   *Fix:* Pre-stack the vault in piles of 10. The facilitator (you) manages the vault, not the students. They just flip; you pay.
  4.  **The "It's Just Fake Money" Complaint:**
      *   *Risk:* Students treat it like Monopoly money.
      *   *Fix:* Collect the final tally *immediately* at the end of class. Tell them: "I am entering these scores into the gradebook right now." The immediacy creates the stakes.
  5.  **Table 1 Empties Too Fast:**
      *   *Risk:* Group 1 gets lucky and drains the 200 dP in 5 minutes. Round 2 and 3 at Table 1 become meaningless.
      *   *Fix:* Cap individual winnings at Table 1 at 50 dP. This prevents a single $2^{10}$ run from nuking the simulation. Announce this cap *after* Round 1 if necessary as a "House Rule Change" (which itself is a lesson in dynamic inconsistency).

  ---

  ### **What This Activity Cannot Reproduce (Be Honest)**

  In the final 2 minutes, you must say this out loud. No simulation can do it, so you must bridge the gap verbally.

  1.  **The Tail is Unstageable:** "We flipped coins for 45 minutes. The longest run was probably 6 or 7 heads. The paradox lives at 30, 40, 100 heads. You never *felt* the infinite tail because time ran out. You priced the *body* of the distribution, not the *tail*. The paradox is that the tail *should* drive the price, but your biology ignores it."
  2.  **Currency Aggregation:** "These points convert to grades linearly. Your life wealth does not. In real life, losing your first $1,000 hurts more than losing your millionth. Here, 1 dP is always 1 dP. You likely applied your real-life diminishing marginal utility to these fake points automatically. That's a feature of you, not the game."
  3.  **The "Well-Defined" Math:** "The student who questioned the summation order was mathematically incorrect about the series, but philosophically correct about the *application*. Expectation is a property of the model, not the world. When the model (infinite bankroll) clashes with the world (finite time, finite bankroll), the 'Expectation' breaks, not the math."

  ### **Summary of Table Goals for Your Notes**

  | Table | Mechanic | Theoretical Resolution Targeted |
  | :--- | :--- | :--- |
  | **1. Vault** | Finite shared bankroll | **Finite Resources:** EV is infinite only if the house is infinite. |
  | **2. Envelope** | Hidden cap (Ambiguity) | **Ambiguity Aversion:** Unknown probabilities reduce WTP more than known risk. |
  | **3. Policy** | Commit to 3 plays | **Ergodicity:** Value of a *strategy* $\neq$ Value of a *single event*. |
  | **4. Classic** | Unlimited bankroll | **Marginal Utility:** Even with no other frictions, WTP < EV due to risk aversion. |
