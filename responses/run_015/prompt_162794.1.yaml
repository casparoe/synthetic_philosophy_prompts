    "verdict": "one sentence on how much of the package survives as stated"
  }

  In "real_tensions", severity is an integer 1-5 where 5 means the pair can't both be held as stated and 1 means the friction is cosmetic, and sort the array worst-first. Use the numbers I gave as the ids.
