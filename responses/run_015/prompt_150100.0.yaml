      *   *Approach B: Building Artificial Systems.* (Empirical/engineering work to force the issue.)
      *   *Approach C: Mapping Neuroscience's Implicit Commitments.* (Looking at how brain science treats representation.)

  3.  **Evaluate Constraints (Small Group, 3 Years):**
      *   *Resources:* Limited manpower, limited time. Cannot build AGI. Cannot solve centuries-old metaphysical debates definitively.
      *   *Goal:* Make tangible progress, publish, avoid getting stuck in infinite loops.

  4.  **Evaluate Dependencies (Upstream vs. Downstream):**
      *   *Metaphysics:* Usually upstream. You need a working definition to know what to look for in brains or code. *However*, pure metaphysics is a black hole for small groups.
      *   *Neuroscience:* Mid-stream. It tells us how biological systems actually handle "aboutness." It constrains metaphysics.
      *   *Artificial Systems:* Downstream/Application. Building things tests the theories. *However*, building robust systems is engineering-heavy, not philosophy-heavy.

  5.  **Ranking & Justification (Drafting the Order):**

      *   *Priority 1: Mapping Neuroscience's Implicit Commitments.*
          *   *Why?* It's the most tractable empirical constraint. Neuroscience *uses* representational talk (place cells, error signals). Analyzing *how* they use it avoids the "what is it really" trap while grounding the metaphysics. It's upstream of building AI (we need to know what biological intentionality looks like to compare) and downstream of pure metaphysics (it constrains the theory).
          *   *Tractability:* High. Papers exist, data exists. No need to build a robot.
