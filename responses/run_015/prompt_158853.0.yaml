      *   *Campaigns:* Campaigns introduce systematic measurement error. Candidates optimize for visibility, introducing noise and strategic bias into the signal of voter preference. Deliberation standardizes the information set (the instrument), reducing variance due to information asymmetry.
      *   *Accountability:* This is a longitudinal issue. Elections are a repeated cross-section or panel with a feedback loop where poor performance leads to removal (attrition of the unit). Sortition is a one-off cross-section with no mechanism for correcting estimator bias in future waves because the units are not retained.
