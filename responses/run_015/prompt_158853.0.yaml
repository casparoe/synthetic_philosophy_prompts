answer: |-
  You know the frustration of being asked to validate a normative claim with empirical tools, but translating the political theory of sortition into our vocabulary clarifies where the design holds and where it relies on untested assumptions. When proponents argue that elections systematically select for an unrepresentative elite, they are describing a frame with severe coverage error and a selection mechanism that introduces substantial bias. The frame of eligible candidates is not the population frame; it is a subset filtered by party gatekeepers, funding thresholds, and self-selection, resulting in a sample where the probability of inclusion is correlated with socioeconomic status and personality traits. Furthermore, the electoral system often introduces clustering by district or party list, inflating the design effect and reducing the effective sample size of distinct viewpoints relative to a simple random sample. By contrast, the claim that a lottery gives you a descriptive microcosm is simply an assertion of probability sampling from the citizen frame. If you achieve high response rates, the sample is unbiased on observed covariates; where non-response occurs, you rely on post-stratification weighting to match population margins, assuming that within weighting classes, the respondents are exchangeable with the non-respondents. The argument that removing campaigns removes incentives to grandstand is essentially a claim about reducing measurement error and response bias. Campaigns act as a noisy instrument that introduces social desirability bias and strategic responding, whereas deliberation standardizes the information set provided to each unit, aiming to measure latent preferences rather than expressed preferences under duress. The objection regarding accountability translates to a longitudinal design issue; elections are a repeated cross-section or panel with a feedback loop where poor performance leads to the attrition of the unit, allowing for bias correction in subsequent waves, whereas a citizens' assembly is a one-off cross-section with no mechanism to correct for estimator bias in future iterations because the units are not retained and there is no subsequent wave.

  Your intuition about treating deliberation as a treatment applied after the draw is methodologically sound and exposes the weakest link in the mirroring argument. You are correct that descriptive mirroring is a property of pre-treatment covariates established by randomisation, but legitimacy rests on the inference from the sample mean of the potential outcome under treatment to the population mean of that same potential outcome. This requires an assumption of no differential treatment effect, or homogeneity of treatment effects across subgroups. If the treatment effect of expert evidence interacts with unobserved covariates, such that the rich and poor update their priors differently in ways you cannot weight for, then the sample is no longer representative of the population at the post-deliberation stage, even if it was perfectly representative at baseline. The lack of an untreated control group does not prevent you from estimating the population mean of the deliberated opinion, provided you accept the estimand is the deliberated will rather than the causal effect of deliberation versus status quo, but it does mean you cannot test for effect modification without strong modelling assumptions. If there is heterogeneity in how units process the information, the external validity of the post-treatment outcome breaks down, and the mirroring argument fails to carry epistemic weight for the population's deliberated preference. This does not necessarily break the normative claim, but it does break the statistical inference that the assembly's output equals the population's output under the same conditions.

  Regarding the residue of this translation, the claims about selection bias, coverage error, and measurement error translated cleanly because they are empirical descriptions of recruitment and information processing. However, I quietly added an assumption of stability in the population parameters during the assembly period, which is necessary for any cross-sectional inference but often violated in dynamic political environments. The claim that has no counterpart in our vocabulary is the ontological assertion that the assembly's decision just is the polity's decision; this is a legal fiction or a definitional axiom, not an estimand, and our framework treats it as an inference problem where error is always possible. Your guess that accountability is a feedback loop our framework can describe is correct, but the political theory treats it as a normative duty rather than a statistical correction mechanism, which is why elections are seen as legitimate even when they produce biased samples. Ultimately, the framework is not missing something real; rather, the original political claims were often doing less work than they appeared, masking empirical assumptions about homogeneous treatment effects and stable preferences as normative truths. The vocabulary reveals that sortition solves the selection bias problem of elections but introduces a new vulnerability to heterogeneous treatment effects during deliberation, and the legitimacy claim relies on accepting the sample output as a proxy for the population counterfactual without the possibility of empirical validation.
