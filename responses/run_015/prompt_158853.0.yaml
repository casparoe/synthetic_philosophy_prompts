      *   *Opening:* Start directly. You know the pain of translating normative claims into design parameters.
      *   *Elections vs. Sortition:* Elections are a non-probability selection mechanism where the frame of candidates suffers from severe coverage error relative to the population distribution of covariates. It's a convenience sample filtered by party gatekeepers and funding, resulting in high selection bias. Sortition attempts a simple random sample from the citizen frame.
