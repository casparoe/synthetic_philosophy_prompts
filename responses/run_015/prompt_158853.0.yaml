          *   Post-treatment outcome ($Y$) depends on $X + T + X*T$.
          *   The problem is the interaction term ($X*T$). If rich and poor respond differently to evidence, the representative sample at $t=0$ is not representative at $t=1$.
          *   No control group means we can't estimate the counterfactual (what would they think without deliberation?), but the goal isn't comparison to status quo, it's inference to population will *after* deliberation.
