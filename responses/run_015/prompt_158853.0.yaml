      *   **Format:** Continuous prose, no headings, no bullet points, no bold text, email-length.

  2.  **Deconstruct the Claims into Methodological Terms:**

      *   *Elections select unrepresentative elites:* This is selection bias or coverage error in the candidate frame. The "frame" of eligible candidates is restricted by resources, party selection mechanisms, etc. It's not a probability sample of the population. It's a convenience sample or a purposive sample biased towards high SES, specific personality types, etc.
      *   *Lottery gives a descriptive microcosm:* This is simple random sampling (SRS) or stratified random sampling from the population frame. If response rates are 100%, the sample is unbiased. In reality, there's non-response, so you need weighting (post-stratification) to match population margins.
      *   *Removing campaigns removes grandstanding:* This is about measurement error or response bias. Campaigns introduce social desirability bias or strategic responding. Deliberation aims for "true" preferences (latent variables) rather than expressed preferences under pressure. It reduces the variance due to noise (campaign effects).
      *   *Accountability:* This is a longitudinal design issue. Elections are repeated measures with feedback loops. Sortition is a cross-sectional design with no follow-up. There's no mechanism to correct for bias in the next wave because there is no next wave for the same unit.
      *   *User's Idea (Deliberation as Treatment):* This is a causal inference problem. $Y(1)$ is the opinion after deliberation. We observe $Y(1)$ for the sample. We want to infer $Y(1)$ for the population. The assumption is CATE (Conditional Average Treatment Effect) homogeneity. If the treatment effect $\tau$ varies by income (heterogeneous treatment effects), then the sample mean $\bar{Y}_{sample}(1)$ is a biased estimator of the population mean $\bar{Y}_{pop}(1)$, even if the sample was representative at $t=0$. This is effect modification.

