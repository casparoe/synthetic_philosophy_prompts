answer: |-
  **INTERGENERATIONAL EQUITY TRUST (IET)**
  **Request for Proposals: Cycle 2024-A**
  **Program: Existential Risk Mitigation and Trajectory Optimization**

  **1. Mission Statement**
  The Intergenerational Equity Trust exists to maximize the expected value of the reachable future. Our mandate prioritizes interventions that positively influence the largest possible number of moral patients across the deepest possible time horizon. We operate under the principle that the magnitude of potential stakes outweighs the precision of immediate outcomes. Proposals must demonstrate a causal pathway to affecting the long-term trajectory of civilization, rather than addressing transient welfare deficits.

  **2. Scoring Formula and Worked Example**
  All applications are evaluated using the Expected Value Metric (EVM). The EVM is calculated as follows:

  $$EVM = (S \times p \times \sigma) / (1 + r)^t$$

  Where:
  *   **$S$ (Stake):** The total number of beings affected, comprising both *Persistence Credit* (lives saved from extinction) and *Genesis Credit* (new lives enabled to exist).
  *   **$p$ (Probability):** The estimated likelihood that the intervention causally influences the stake.
  *   **$\sigma$ (Sign-Confidence):** A coefficient (0.0–1.0) representing confidence that the effect is positive rather than negative.
  *   **$r$ (Discount Rate):** Pure time preference (set at 0%).
  *   **$t$ (Time):** Centuries until benefit realization.

  **Worked Example:**
  *Proposal A (Near-Term Health):* Prevents 1,000 premature deaths today.
  $S = 1,000$; $p = 0.95$; $\sigma = 1.0$; $t = 0$.
  **EVM = 950.**

  *Proposal B (Foundational Safety):* Reduces existential risk by 0.0000001% over the next millennium, affecting a potential future population of $10^{24}$ beings.
  $S = 10^{24}$; $p = 10^{-9}$; $\sigma = 0.5$; $t = 10$.
  **EVM = 500,000,000,000,000.**

  Proposal A represents 0.00000000019% of the value of Proposal B. Near-term interventions are categorized as administrative rounding errors and are ineligible for primary funding.

  **3. Frequently Asked Questions**

  **1. How does the IET distinguish between saving lives and creating new ones?**
  We treat welfare equivalents as fungible. *Persistence Credit* is awarded for preventing the termination of existing lineages. *Genesis Credit* is awarded for enabling potential beings to come into existence. Both contribute equally to the Stake ($S$) variable, provided the lives are deemed worth living.

  **2. What discount rate is applied to benefits occurring in distant centuries?**
  The IET applies a pure time discount rate of 0%. A benefit occurring in the 31st century is valued identically to a benefit occurring today, adjusted only for probability and confidence. Temporal distance is not a moral justification for devaluation.

  **3. How does the foundation handle disagreement between moral theories?**
  We utilize a Weighted Moral Parliament. If consequentialist and deontological frameworks disagree on the valuation of a project, the EVM is calculated as the probability-weighted average of the outcomes prescribed by each theory, based on the credence assigned to each theory by our advisory board.

  **4. How can you claim to know the long-term effects of an intervention?**
  We acknowledge causal opacity. This is managed via the Sign-Confidence coefficient ($\sigma$). Where long-term effects are unpredictable, $\sigma$ is adjusted to reflect the probability of the intervention having a positive rather than negative valence. Lack of specific knowledge is treated as a variable input, not a barrier to calculation.

  **5. Why spend the endowment now rather than investing for later?**
  Standard economic theory suggests investing until the marginal return on capital equals the marginal rate of existential risk. However, this cycle's modeling indicates that current expertise availability creates a temporary arbitrage opportunity.

  **4. Closing Notice: 2024 Awards**
  Upon final review, the Investment Committee has determined that the arbitrage opportunity cited in FAQ 5 is outweighed by the projected growth rate of the endowment versus the projected accumulation of wisdom by future agents. Our models indicate that deferring all expenditure increases the Expected Value of the corpus by a factor of 1.05 per annum, whereas current spending carries a non-zero risk of misallocation.

  Consequently, the IET awards zero grants in Cycle 2024-A. The entire corpus will be rolled over into low-risk index funds. We anticipate issuing a similar Request for Proposals next year, though applicants should note that the argument for deferral will compound annually. We thank you for your submission.
