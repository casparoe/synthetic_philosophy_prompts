answer: |-
  A human mathematician rushes into the office of her colleague, an advocate for ideal epistemic agents.

  "I did it!" she shouts. "After five years, I finally proved that Conjecture Q follows from Axioms A!"

  The colleague barely looks up from his book. "Technically, you've known that since last Tuesday."

  "What? I spent five years working on this proof!"

  "But you accepted Axioms A five years ago. Since knowledge is closed under logical consequence, you've known Q the whole time. You just hadn't processed the entailment."

  "So I didn't learn anything new?"

  "Epistemically? No. You haven't eliminated any possible worlds you hadn't already eliminated. You've just reduced the computational distance between your premises and your beliefs."

  "Fine. Well, I'm throwing you a surprise party to celebrate."

  "You can't."

  "Why not?"

  "Because I know you're generous, I know it's my birthday, and I know all logical consequences of my knowledge state. There are no accessible worlds where I don't already know about the party."

  "Okay, I'll just bring cake."

  "Fine. But don't call it a surprise. Call it a logical necessity."

  "Fine. But don't expect me to sing."

  "Why not?"

  "Because if you know I'm going to sing, and you know all consequences... you've already heard it."

  "Exactly. Now you're getting it. You're not an ideal agent; you're merely possible."
