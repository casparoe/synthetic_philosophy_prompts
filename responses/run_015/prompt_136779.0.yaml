          *   *Best Single Revision:* Modify (1) to distinguish between **normative legitimacy** (honor-driven) and **institutional enforcement** (interest-driven). Dueling was purely legitimacy. Slavery was both. This resolves the special pleading.

  5.  **Critique and Polish:**
      *   *Check:* Did I lecture on Appiah? No.
      *   *Check:* Did I rank tensions? Yes.
