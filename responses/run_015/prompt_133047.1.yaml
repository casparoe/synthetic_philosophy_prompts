  ### **Scoring Logic & Overlap Flags**

  *   **Hard Incompatibilist:** Follow path **NO → NO → Hard**.
  *   **Soft Compatibilist:** Follow path **NO → YES → Fiction**.
  *   **Skandha-Process View:** Follow path **YES → YES → Hard**.
  *   **Deflationary 'Useful Fiction':** Follow path **YES → YES → Fiction**.
  *   **Animalist-Anatta Hybrid:** Follow path **YES → NO → Hard**.

  **⚠️ Indistinguishable Leaves Flag:**
  The tree struggles to cleanly separate **Leaf 7 (Skandha-Process)** from standard **Reductionist Psychological Continuity** theories. Both answer YES/YES/Hard, and the difference often comes down to whether you call the causal chain "mental processes" (Western) or "aggregates" (Buddhist). If you find yourself arguing about semantics here, the tree has failed to separate metaphysics from terminology.

  **⚠️ Overlap Warning:**
  **Leaf 4 (Soft Compatibilist)** and **Leaf 8 (Deflationary)** may feel identical in practice. Both rely on identity being a construct rather than a substance. The tree separates them based on whether memory loss kills the person (Compatibilist says Yes, Deflationist says No), but many narrative theorists might agree with the Deflationist on the memory case, collapsing the two positions.
