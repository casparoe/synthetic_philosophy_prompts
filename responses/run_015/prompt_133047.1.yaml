  **Instructions:** Follow the branches based on your gut reaction to each case. Don't overthink the philosophy terms; just answer what feels true to you about the scenario.

  ### **NODE 1: The Meditator's Reboot**
  **Do you think that if a meditator reaches a state where all five skandhas temporarily cease and then 'reboot' with the same causal stream but absolutely zero autobiographical memory, that's still the same person?**

  *   **NO** → Go to **Node 2A**
  *   **YES** → Go to **Node 2B**

  ---

  ### **NODE 2A (For those who said NO to Reboot)**
  **If we could upload just your mental processes without any body, would that count as you surviving, given that anatta already denies there's a soul-substrate to preserve?**

  *   **NO** → Go to **Node 3A**
  *   **YES** → Go to **Node 3B**

  ### **NODE 2B (For those who said YES to Reboot)**
  **If we could upload just your mental processes without any body, would that count as you surviving, given that anatta already denies there's a soul-substrate to preserve?**

  *   **NO** → Go to **Node 3C**
  *   **YES** → Go to **Node 3D**

  ---

  ### **NODE 3A (No Reboot / No Upload)**
  **Is anatta best read as a hard metaphysical claim that there's literally no persisting thing, or just as a claim about how experience feels (where the ego-feeling is a useful fiction constructed out of habit)?**

  *   **Hard Metaphysical Claim** → **LEAF 1: The Hard Incompatibilist**
      *   *Diagnosis:* You deny survival everywhere, which makes it awkward to explain who exactly is responsible for past actions.
  *   **Claim About Experience (Fiction)** → **LEAF 2: The Quietist Nihilist (Empty Slot)**
      *   *Diagnosis:* You claim nothing survives and it's all a fiction, risking the charge that you've made philosophy completely useless for living.

  ### **NODE 3B (No Reboot / Yes Upload)**
  **Is anatta best read as a hard metaphysical claim that there's literally no persisting thing, or just as a claim about how experience feels (where the ego-feeling is a useful fiction constructed out of habit)?**

  *   **Hard Metaphysical Claim** → **LEAF 3: The Disembodied Eliminator (Empty Slot)**
      *   *Diagnosis:* You think memory loss kills you but uploading saves you, which is a hard pill to swallow without a soul to carry the value.
  *   **Claim About Experience (Fiction)** → **LEAF 4: The Soft Compatibilist**
      *   *Diagnosis:* You save identity through narrative but must explain why a story survives memory loss in one case but not the other.

  ### **NODE 3C (Yes Reboot / No Upload)**
  **Is anatta best read as a hard metaphysical claim that there's literally no persisting thing, or just as a claim about how experience feels (where the ego-feeling is a useful fiction constructed out of habit)?**

  *   **Hard Metaphysical Claim** → **LEAF 5: The Animalist-Anatta Hybrid (Unnamed Slot)**
      *   *Diagnosis:* You tie identity to the biological organism while denying the organism is a self, which looks suspiciously like a soul made of meat.
      *   *Status:* **Unexplored/Unattractive.** It struggles to explain why the body matters if the "self" is an illusion, often collapsing into simple biological reductionism.
  *   **Claim About Experience (Fiction)** → **LEAF 6: The Embodied Fictionalist (Empty Slot)**
      *   *Diagnosis:* You say the person survives the memory wipe only because we keep using the same name for the body, making identity purely a linguistic convenience.

  ### **NODE 3D (Yes Reboot / Yes Upload)**
  **Is anatta best read as a hard metaphysical claim that there's literally no persisting thing, or just as a claim about how experience feels (where the ego-feeling is a useful fiction constructed out of habit)?**

  *   **Hard Metaphysical Claim** → **LEAF 7: The Skandha-Process View**
      *   *Diagnosis:* You treat identity as a causal chain of aggregates with no owner, but must define what 'causal stream' means without a carrier.
  *   **Claim About Experience (Fiction)** → **LEAF 8: The Deflationary 'Useful Fiction' Stance**
      *   *Diagnosis:* You dissolve the problem by calling identity a convenient label, but risk making ethics feel arbitrarily constructed.

