  2.  **Verify Lewis's Definition of Convention (Mental Check):**
      *   *User's Memory:* (i) Regularity, (ii) Expectation, (iii) Preference to conform given others conform (coordination), (iv) Alternative regularity exists (arbitrariness), (v) Common knowledge.
      *   *Lewis's Actual Account (roughly):* A regularity $R$ in behavior in population $P$ in situation $S$ is a convention if:
          1.  Everyone conforms to $R$.
          2.  Everyone expects everyone else to conform to $R$.
          3.  Everyone has approximately the same preferences regarding all possible combinations of actions.
          4.  Everyone prefers that everyone conform to $R$, on condition that almost everyone conforms to $R$. (Coordination equilibrium).
          5.  Everyone would prefer that everyone conform to some alternative $R'$, on condition that almost everyone conforms to $R'$. (Arbitrariness/Alternative equilibrium).
          6.  All of the above is common knowledge.
      *   *Correction Needed:* The user's clause (iii) is slightly off. It's not just "prefer to conform given others do," it's that the situation is a *coordination problem* (common interest in coordinating, regardless of *how*). The key is that the preference is conditional on others conforming. The user's clause (iv) is basically right (alternative equilibrium). The user's clause (v) is right (common knowledge).
      *   *Crucial Distinction:* Lewis distinguishes *conventions* from *norms backed by sanctions*. If you conform only to avoid punishment (prisoner's dilemma structure), it's not a Lewisian convention. It needs to be a coordination equilibrium where the conformity *itself* solves the problem, not just avoids pain.

