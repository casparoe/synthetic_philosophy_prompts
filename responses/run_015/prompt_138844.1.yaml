          *   *The Gap:* Lewis assumes rational agents maximizing utility. David's act looks irrational by standard metrics (losing sight) but rational by the internal logic of the convention (saving the relationship).
          *   *Film's Contribution:* It shows the *path dependence* of conventions. Once an arbitrary trait is selected, it gains normative weight. The "arbitrariness" vanishes for the participants. Lewis knows this (precedent), but the film dramatizes the *violence* required to maintain it when the underlying coordination interest (love) is gone.
