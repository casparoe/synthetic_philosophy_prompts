      *   *Claim 3 (Synchronic Dutch Book):* Accepts standard coherence arguments for beliefs. Distinguishes beliefs from preferences regarding "declining bets."
      *   *Claim 4 (Diachronic Dutch Book):* Accepts coherence arguments for belief updating. Implies a constraint on how beliefs *must* change over time.
      *   *Claim 5 (Preference Change):* Allows values to shift. Later self overrides earlier self *if values genuinely shift*.
      *   *Claim 6 (Cycle Objection):* Argues that lacking an optimal plan isn't fatal (analogy to unbounded utility).

      *   *Potential Tension A: (1)/(2) vs. (5).*
          *   (1) & (2) say: Stick to the plan (Resolute Choice). Even if momentary preference changes, follow the *ex ante* policy.
          *   (5) says: If values shift, the later self's verdict governs.
          *   *Conflict:* If I plan *ex ante* to One-Box (Claim 2), but *ex post* my values shift such that I now prefer Two-Boxing (Claim 5), which rule wins? Resolute Choice says stick to the plan. Preference Shift says follow the new values.
