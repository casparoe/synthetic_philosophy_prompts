answer: |-
  # Post-Mortem Explanation Taxonomy

  **Instructions:** Start at the root question. Answer based on how you view a specific recent system outage (e.g., "Did knowing the database locked up make it seem impossible that it *wouldn't* have?"). Follow the path until you reach a leaf.

  ### **Root: The Distortion Question**
  **Does knowing the outcome of the outage *necessarily* distort your view of what was possible before the failure occurred?**
  *   **No:** (We can see the prior possibilities clearly.) → Go to **Branch A**.
  *   **Yes:** (Our view of prior possibilities is inevitably altered.) → Go to **Branch B**.

  ---

  ### **Branch A (No Distortion)**

  **Q1: Is narrative ordering (a story-like timeline) essential to explaining the cause, or merely a communicative convenience?**
  *   **Essential:** → **[Empty Leaf 1]**
      *   *Diagnosis:* **Unattractiveness.** It is difficult to defend why an objective reality requires a subjective story structure if our view isn't distorted.
  *   **Convenience:** → **Q2**.

  **Q2: Does an objective causal structure exist that could in principle be represented without any narrative framing (e.g., as a pure dependency graph)?**
  *   **No:** → **[Empty Leaf 2]**
      *   *Diagnosis:* **Incoherence.** If there is no distortion and no objective structure, there is nothing left to explain.
  *   **Yes:** → **Q3**.

  **Q3: Does the narrative fallacy apply with equal force to engineered, deterministic systems as it does to human historical events?**
  *   **No:** (Engineered systems are different.) → **[Empty Leaf 3]**
      *   *Diagnosis:* **Neglect.** This position is rarely defended in engineering; most assume either universal bias or universal objectivity.
  *   **Yes:** (It applies equally.) → **Q4**.

  **Q4: Is hindsight bias best understood as a cognitive defect to be eliminated?**
  *   **Yes:** → **Leaf 1: Strict Causal Structuralist**
      *   *Awkward Commitment:* Must treat all post-mortem narratives as suspect fiction, potentially undermining stakeholder confidence in the report.
  *   **No:** (It is unavoidable or useful.) → **Leaf 2: Pragmatic Realist**
      *   *Awkward Commitment:* Must justify using known distortions to teach teams about objective truths without corrupting their understanding.

  ---

  ### **Branch B (Yes Distortion)**

  **Q1: Is narrative ordering essential to explanation or merely a communicative convenience?**
  *   **Essential:** → **Q4**.
  *   **Convenience:** → **Q3**.

  **(Path B -> Essential -> Q4): Is hindsight bias best understood as a cognitive defect to be eliminated?**
  *   **Yes:** → **Leaf 3: Tragic Essentialist**
      *   *Awkward Commitment:* Must accept that perfect explanation is impossible for humans, yet strive to eliminate the very tool (narrative) required to explain.
  *   **No:** (It is unavoidable or useful.) → **Leaf 4: Constructivist Pragmatist**
      *   *Awkward Commitment:* Must defend the utility of a known distortion, risking the normalization of inaccurate mental models of the system.

  **(Path B -> Convenience -> Q3): Does the narrative fallacy apply with equal force to engineered, deterministic systems as it does to human historical events?**
  *   **No:** (Engineered systems are different.) → **Leaf 5: Domain-Sensitive Constructivist**
      *   *Awkward Commitment:* Must define a precise boundary where code stops behaving like history and starts behaving like logic, which often blurs in socio-technical systems.
  *   **Yes:** (It applies equally.) → **Q2**.

  **(Path B -> Convenience -> Yes -> Q2): Does an objective causal structure exist that could in principle be represented without any narrative framing?**
  *   **Yes:** → **[Empty Leaf 4]**
      *   *Diagnosis:* **Incoherence.** If distortion is necessary and structure is objective/independent, the narrative is both required and false.
  *   **No:** → **Q4**.

  **(Path B -> Convenience -> Yes -> No -> Q4): Is hindsight bias best understood as a cognitive defect to be eliminated?**
  *   **Yes:** → **Leaf 6: Bias Eliminationist**
      *   *Awkward Commitment:* Must propose a method to remove narrative from post-mortems while acknowledging narrative is the only way engineers communicate.
  *   **No:** (It is unavoidable or useful.) → **Leaf 7: Heuristic Acceptance**
      *   *Awkward Commitment:* Must argue that false necessity is an acceptable price for team learning, potentially validating incorrect causal assumptions.

  ---

  ### **Taxonomy Notes**

  **Leaf Count:** 7 Named Leaves + 3 Empty Leaves = 10 Total Leaves.

  **Indistinguishable Leaves:**
  *   **None.** The logical splits ensure each named leaf holds a unique combination of commitments regarding distortion, structure, domain, and bias status.

  **Usage Guide:**
  *   **Leaves 1 & 2 (Realists):** Use when your team believes the logs tell the "true story" and narratives are just packaging.
  *   **Leaves 3 & 4 (Essentialists):** Use when your team believes you literally cannot explain the outage without a story, regardless of logs.
  *   **Leaves 5, 6, & 7 (Constructivists):** Use when your team believes the post-mortem creates a version of events that didn't exist prior to writing.
  *   **Empty Leaves:** If your team's intuitions lead here, discuss whether one of your premises (e.g., "Objective structure exists" vs "Distortion is necessary") needs revision.
