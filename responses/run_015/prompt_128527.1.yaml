answer: |-
  Your intuition is spot on. Your study group has constructed a logically valid argument, but it is **unsound** because it attacks a straw man of Neurath's actual philosophical commitments. They are treating Neurath like a naive empiricist who thought pictures were "magic windows" to reality, whereas Neurath was a sophisticated physicalist and coherentist.

  You can absolutely keep (1) and (2). To do so, you need to cut the argument at **Step (5)**, and you are correct that there is an **equivocation on "show"** (perceptual immediacy vs. semantic directness) driving the error.

  Here is how to dismantle the argument while saving Neurath.

  ### 1. The Equivocation on "Show" (Steps 1 & 3)
  Your friend is conflating **semiotic transparency** with **cognitive accessibility**.

  *   **The Group's View:** They assume Neurath claimed ISOTYPE bypasses interpretation entirely (Semantic Directness). Step (3) correctly refutes *that* claim (icons require rules).
  *   **Neurath's View:** Neurath claimed ISOTYPE reduces the *cognitive load* required to grasp quantitative relations (Perceptual Immediacy).
  *   **The Fix:** Admit Step (3) is true. Recognizing a row of 10 men vs. 5 men requires a rule ("one icon = 10,000 people"). But Neurath's point in (1) isn't that the rule doesn't exist; it's that the *spatial relation* (twice as long) is perceived faster and with less grammatical baggage than the sentence "Population A is double Population B."

  **Verdict:** The argument fails because it assumes Neurath wanted to eliminate *convention*. He only wanted to eliminate *grammatical metaphysics*.

  ### 2. The Weak Link: Step (5)
  > *(5) Once conventions are unavoidable, there's no principled gap between pictograms and his idea of a universal jargon - both need agreed rules.*

  This is the critical break. It assumes that because both systems *have* conventions, the conventions are *equally problematic*. This is false for two Neurathian reasons:

  **A. The Metaphysics of Grammar**
  Neurath hated verbal language not just because it was conventional, but because Indo-European grammar forces a **Subject-Predicate** structure. This structure seduces us into believing in "substances" and "essences" (e.g., "The economy *is* growing" implies "The Economy" is a thing that acts).
  *   **Pictograms** do not force subject-predicate logic. They show coexistence and quantity without implying causal agents or metaphysical substances.
  *   **The Gap:** The gap isn't "Convention vs. No Convention." The gap is "Metaphysically Loaded Conventions (Prose)" vs. "Functional Conventions (ISOTYPE)."

  **B. The International Auxiliary Language Goal**
  Neurath was a socialist internationalist. A "universal jargon" of physicalist prose still requires learning a specific vocabulary (English, German, Logical Notation). ISOTYPE aims to be **language-neutral**.
  *   **Step (5) ignores the barrier to entry.** Learning the convention "a man icon = 1000 workers" is easier for a global audience than learning the physicalist syntax of "There is a worker-configuration at coordinate X."

  **Verdict:** Step (5) collapses because it ignores the *qualitative difference* between linguistic conventions (which carry historical/metaphysical baggage) and visual-statistical conventions (which are functional and arbitrary but 'thinner').

  ### 3. If You Reject (4), What Do You Owe?
  Step (4) says: *ISOTYPE doesn't remove hidden conventions; it buries them in the icon design.*
  The word "buries" implies deception or failure. If you reject this, you must argue that ISOTYPE **externalizes** conventions rather than burying them.

  **What you owe the group:**
  1.  **A Theory of Standardization:** You must explain that Neurath knew conventions were needed. That's why he employed **transformers** (designers who standardized the icons). The convention isn't hidden; it is codified in the style guide.
  2.  **A Cognitive Defense:** You owe an explanation of why visual conventions are more stable or democratic than linguistic ones. (e.g., "It is easier to agree on what a 'worker' looks like than on the definition of 'employment'.")
  3.  **A Limit on Scope:** You must admit ISOTYPE wasn't meant to replace *all* prose. It was meant to replace *statistical and technical* communication for the public. Neurath never claimed you could write philosophy in ISOTYPE.

  ### 4. Reconciling (1) and (2) (The Boat and The Picture)
  Your friend's conclusion ("Neurath should've stuck to physicalist prose") fails because it misunderstands the **Boat Metaphor (2)**.

  *   **The Group's Reading:** The Boat means "We are stuck with language, so make the best language."
  *   **Neurath's Reading:** The Boat means "We have no God's-eye view. We must construct tools that help us navigate."

  If the goal of the Boat is **social emancipation** (helping the working class understand housing stats to demand better policy), then physicalist prose is a *bad hull*. It is too technical, too bound by class-based education, and too metaphysically seductive.

  **ISOTYPE is not an escape from the Boat; it is a repair of the Boat.**
  You can keep (2) by arguing: *Because* we are sailors rebuilding at sea (no external truth), we must choose the tools that allow the most sailors to participate in the rebuilding. ISOTYPE allows more participation than physicalist prose. Therefore, (2) *supports* ISOTYPE, it doesn't undermine it.

  ### Summary of the Counter-Argument
  To save your position, propose this revision to the group:

  1.  **Accept (3):** Yes, icons require interpretive rules. Neurath never denied this.
  2.  **Reject (4):** Conventions are not "buried"; they are **standardized**. Unlike grammar, which hides metaphysics in verb tenses and nouns, ISOTYPE conventions are explicit design choices.
  3.  **Reject (5):** There *is* a principled gap. Linguistic conventions carry **ontological commitments** (subjects/objects); Visual conventions carry **quantitative commitments** (more/less). The latter is safer for a physicalist.
  4.  **Reject (6):** The preference for pictures doesn't rest on "transparency" (magic truth); it rests on **democratization** (ease of access).
  5.  **Reframe (7):** The Boat metaphor applies to icons, yes. But that means we must be ready to change the icons when they stop working. It doesn't mean we should switch to prose, which is a harder boat to repair.

  **The Verdict:** Your friend's conclusion fails because they think Neurath was trying to solve an **epistemological** problem (how to know truth) with ISOTYPE. He wasn't. He was trying to solve a **sociological** problem (how to share knowledge). ISOTYPE can fail epistemologically (it still uses conventions) and succeed sociologically (it spreads understanding). Neurath cared about the latter.
