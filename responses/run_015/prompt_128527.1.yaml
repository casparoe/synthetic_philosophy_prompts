      *   *If I reject (4), what do I owe?* If I say conventions aren't just "buried" but "transformed," I need to explain *how* visual conventions differ from linguistic ones in a way that matters for Neurath's goals (education, social planning, avoiding metaphysics). I owe a theory of *visual cognition* vs. *linguistic cognition*.

