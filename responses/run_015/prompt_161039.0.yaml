  This configuration is best labeled **Indirect Speciesism**. While direct speciesism explicitly privileges species membership, indirect speciesism employs facially neutral criteria that function as proxies for species due to inconsistent application. The specific mechanism you describe is the **Species-Norm Criterion**, which grounds status in belonging to a kind whose normal members possess certain capacities.

  This remains speciesism because the "kind" invoked is invariably the biological species. The disavowal of speciesism is negated by the operational reliance on species membership to rescue marginal humans while excluding animals.

  Boundary cases settle the definition:
  1.  **Non-human with the property:** If excluded (dismissed as hypothetical), the criterion is not truly property-based. The barrier is species, not capacity. This confirms speciesism.
  2.  **Human without the property:** If included via "kind membership," the property is not necessary for humans. This proves the criterion is a proxy for species membership.
  3.  **Property tracking species coincidentally:** If the property matters independently (e.g., sentience), it must apply individually. If it applies to humans collectively (via norms) but animals individually, it is speciesist.

  The phenomenon stops only when the property is applied **consistently individually**. A non-human possessing the property must gain status; a human lacking it must lose it (or status must be grounded elsewhere equally). Because the maneuver protects all humans regardless of individual capacity while denying animals status despite individual capacity, it functions as speciesism regardless of disavowal. The "neutrality" is illusory because the safety net of "kind membership" is extended only to humans. Thus, any theory granting humans automatic status via species norms while demanding individual proof from animals constitutes indirect speciesism.
