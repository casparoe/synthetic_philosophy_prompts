answer: |-
  Here is the hard truth: As a backend engineer, your instinct will be to build the **selection algorithm** (the randomizer) and the **deliberation interface** (the voting/dashboard). **Do not do this.** Those are the easiest parts technically, and they are not where sortition projects fail. They fail because nobody shows up, or because the city ignores the output.

  With 192 hours (8 hrs/week × 6 months) and $2k, you cannot build a platform. You must build a **process wrapper**. Your code should only exist to reduce friction in the human workflow.

  Here are the three questions that deserve your dev time, in order of importance.

  ### 1. The Funnel: "How do I minimize friction from invitation to attendance without breaking randomness?"
  **Why this is first (Upstream Risk):**
  Sortition has a massive attrition problem. If you randomly select 50 people, historically 80–90% will ignore the letter/email, or drop out after the first session. If you end up with 5 self-selected activists instead of 30 random residents, your legitimacy is zero. Your $2k budget is too small to buy loyalty with stipends (approx. $40/person if split 50 ways), so you must buy it with **UX**.

  **Dev Implications:**
  *   **Don't build the randomizer yet.** Use a Python script or even a spreadsheet. The math is trivial.
  *   **Build the Verification & Onboarding Pipeline.** Spend your hours on secure SMS verification, address validation (for zip stratification), and calendar integration.
  *   **The Tradeoff:** You are trading "feature richness" for "conversion rate." A ugly SMS bot that gets 40 people on Zoom is better than a beautiful React dashboard that gets 5.
  *   **Stratification Note:** For V1, do not enforce hard quotas during selection (which requires complex re-drawing). Select purely randomly, then weight the final panel or recruit alternates to fill demographic gaps. Hard quotas increase engineering complexity and delay recruitment.

  **Flip Condition:**
  If you run a dry run with 10 people and >50% drop off before the first meeting, **stop building**. The problem isn't software; it's the value proposition. You need to pivot to a higher-stakes incentive or lower-time commitment before writing another line of code.

  ### 2. The Teeth: "What technical format makes the panel's decision impossible for the city to ignore?"
  **Why this is second (Downstream Risk):**
  Legitimacy in sortition isn't about the selection; it's about the **bindingness**. If your tool outputs a PDF report that sits in a councilmember's inbox, you have built a survey. If your tool outputs a structured data object that triggers a mandatory review workflow in the city's existing system, you have built governance.

  **Dev Implications:**
  *   **Integration over Interface.** Spend your time reverse-engineering the city's 311 API or budget docket system, not building a pretty voting UI.
  *   **Audit Trail.** Build an immutable log (even if just a signed JSON blob stored on S3) that proves *who* decided *what* and *when*. This protects the panel from staff claiming "we lost the results."
  *   **The Tradeoff:** This requires political legwork to get API access or agreement on data formats. It is riskier than building a standalone app, but it is the only way to test the "legitimacy" hypothesis.

  **Flip Condition:**
  If the city IT department or City Clerk says "we cannot accept digital submissions from external bodies," **pivot immediately**. Do not try to hack their security. Switch to a "Public Dashboard" model where the output is public-facing pressure rather than backend integration.

  ### 3. The Scope: "Is the data model for 'spending money' or 'flagging errors'?"
  **Why this is third (Complexity Risk):**
  You mentioned two ideas: Participatory Budget vs. 311 Audit. These require fundamentally different data models and carry different liabilities.
  *   **Budget:** Requires write-access to financial ledgers (high security, high liability, high city resistance).
  *   **Audit:** Requires read-access to dispatch logs (lower security, lower liability, easier to justify as "feedback").

  **Dev Implications:**
  *   **Choose Audit for V1.** It is safer for a prototype. You are building a tool that highlights *bias* in the existing algorithm (e.g., "Why do potholes in Zip Code A get fixed 2x faster than Zip Code B?").
  *   **Data Ingestion.** Your backend work shifts from "transaction management" to "ETL pipelines." You need to ingest 311 data, anonymize it, and present it to the panel for review.
  *   **The Tradeoff:** An audit feels less "empowering" to participants than spending money, but it is much more tractable for a solo dev with no legal team.

  **Flip Condition:**
  If you find a specific city councilor willing to sponsor a $10k "micro-grant" pot that *they* control but the panel *allocates*, switch to **Budget**. Money engages people faster than audits. But only do this if the legal liability is off your shoulders.

  ### Summary of the Agenda
  1.  **Weeks 1–8:** Build the **Invitation/Verification Bot** (SMS/Email). Test with 10 friends. Measure drop-off.
  2.  **Weeks 9–16:** Build the **311 Data Ingestion Pipeline**. Anonymize real city data.
  3.  **Weeks 17–24:** Build the **Output Generator** (The "Teeth"). Ensure it creates a public, immutable record.

  **What to Ignore:**
  *   **Deliberation Tools:** Use Zoom and Google Docs. Do not build a chat system.
  *   **Complex Stratification:** Use simple zip code buckets. Do not build a multi-variable weighting engine yet.
  *   **Payment Processing:** Do not touch stipends. Let the city cut checks. You do not want the tax/compliance liability.

  Your goal is not to ship a product; it is to prove that a random group of people can produce a decision the city is forced to acknowledge. Everything else is decoration.
