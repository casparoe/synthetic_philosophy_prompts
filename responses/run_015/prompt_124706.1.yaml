answer: |-
  Here is a structured plan for your fifty-minute discussion section, designed to navigate the shift from agent-centric to institution-centric dirty hands without losing the students in abstraction.

  ### I. Explanatory Sequence

  **1. The Prerequisite Concept: Singular Moral Agency**
  Before introducing the institutional framing, you must establish the **Walzerian/Weberian baseline**. Students must understand the traditional view: *Dirty hands requires a specific agent who intends a moral violation to achieve a political good, and who subsequently bears the psychological or moral burden of that violation.*
  *   **Why:** If they do not grasp that dirty hands is traditionally a tragedy of *individual conscience*, they will not see the innovation in the institutional view.
  *   **Time:** 0:00–0:10.

  **2. The Case Justification: Why Predictive Policing?**
  You must explicitly state why this case replaces the ticking bomb.
  *   **Routine vs. Exception:** Ticking-bomb scenarios frame dirty hands as a rare emergency. Predictive policing frames it as **governance as usual**.
  *   **Intent vs. Foreseeability:** In torture cases, the agent intends the pain. In this case, the legislator intends "public safety," but *foresees* the harm to innocents as a statistical byproduct.
  *   **Required Properties:** To work, the case must show that the harm is **algorithmically guaranteed** (not accidental) but **individually disavowed** (the legislator says, "I didn't target anyone specific").

  **3. Component Ordering**
  To prevent the argument from collapsing back into individual guilt, introduce the components in this specific order:
  1.  **Moral Cost:** Establish that innocent people *will* be harmed (harassment, false arrests). This is the "dirt."
  2.  **Role Obligation:** Explain why the legislator votes "Yes." They are obligated to provide security for constituents. This creates the conflict.
  3.  **Structural Harm:** Show how the harm occurs via the *system's design* (data bias, feedback loops), not the legislator's direct command.
  4.  **Distributed Accountability:** (The Climax) Argue that because the harm is structural, the "dirt" adheres to the **office and the procedure**, not just the soul of the voter. The legislator remains "clean" in their own mind, but the institution is "dirty."

  *   **Time:** 0:10–0:35 (Lecturette + Guided Discussion).

  ### II. Misconception Mapping & Interception

  **Stage 1: Introducing Moral Cost**
  *   **Likely Misconception:** *"Politics is just morally hard."* Students will conflate "difficult trade-offs" (e.g., budget cuts) with "moral violations" (rights infringements).
  *   **Interception:** Draw a line on the board. Left side: "Hard Choices" (losing money). Right side: "Wrong Actions" (violating rights). Insist that Dirty Hands belongs on the Right. If no rights are violated, it's just budgeting, not dirty hands.

  **Stage 2: Introducing Structural Harm**
  *   **Likely Misconception:** *"Structural harm is just dirty hands multiplied across a group."* Students will think 15 legislators voting for the program is just 15 individuals with dirty hands.
  *   **Interception:** Use the **Algorithm Analogy**. Ask: "If the computer code causes the harm, and no one wrote the code to be racist, but the data made it racist, who has blood on their hands?" Force them to see that the *mechanism* generates the immorality, independent of the voters' internal states.

  **Stage 3: Introducing Distributed Accountability**
  *   **Likely Misconception:** *"Recognizing institutional corruption removes individual accountability."* Students will slide into cynicism: "If the system is dirty, the legislator isn't responsible."
  *   **Interception:** Distinguish **Causal Responsibility** from **Stewardship**. The legislator didn't *cause* the bias directly, but they are responsible for *authorizing* the biased tool. The "dirt" shifts from "I am a sinner" to "I am a custodian of a sinful system."

  **Time:** 0:35–0:45 (Active Discussion).

  ### III. The Final Check-Question

  To distinguish between philosophical grasp and cynical resignation, ask this exact question in the last five minutes:

  > **"If this legislator resigns in protest tomorrow, does the 'dirty hands' problem disappear?"**

  *   **Cynical/Incorrect Answer:** "Yes, because they refused to be corrupt," or "No, because politicians are all the same." (This focuses on the *person* or generalizes corruption).
  *   **Correct/Institutional Answer:** "No. The program still runs, the algorithm still harms, and the *next* legislator inherits the same dirty choice. The dirt is in the seat, not the person."
  *   **Why this works:** It confirms they understand the *structural* persistence of the moral cost, independent of individual virtue.

  ### IV. Literature Scope & Readings

  **What to Set Aside:**
  Openly tell students you are **bracketing the meta-ethics of collective responsibility**.
  *   Do not engage with the complex metaphysical debate about whether groups can be "moral agents" distinct from their members (e.g., French, List, & Pettit).
  *   Do not engage with Utilitarian calculations of whether the safety outweighs the harm.
  *   **Reason:** This distracts from the phenomenology of the "stain." You are analyzing the *experience and location* of the guilt, not solving the math of the outcome or the ontology of the group.

  **Reading Assignment:**
  **Confirm: Do not assign further readings for this session.**
  *   **Reason:** This is a conceptual consolidation section. Adding new texts (e.g., Thompson on bureaucratic responsibility or Young on social connection) will overload first-years. Their task is to re-process the *existing* concept of dirty hands through a new lens, not to master a new theorist. Use the time for the check-question and debrief.
