      *   *Core Mechanism:* It uses a grid (retina) and "parts" (lines, curves, intersections). But crucially, it relies on *analogy*. The style isn't a parameter; it's an emergent property of how the parts relate to each other across the set.
      *   *Key Insight:* A letter is defined by its role in the system (the font) and its history in the viewer's mind.
      *   *Relevance to Branding:* A logo isn't an image; it's a style seed for a whole ecosystem.

