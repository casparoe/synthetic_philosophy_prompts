      *   *Essence in Population:* Yes, the theory implies essence is in the *history of instances*. If the population holds the history, the essence is distributed. The theory models *how* we perceive, but the *data* comes from the population.
      *   *Anomaly?* Not an anomaly, but a scaling issue. The theory predicts high friction when the new seed contradicts the accumulated history.

  7.  **What Seed Would Have Worked?**
