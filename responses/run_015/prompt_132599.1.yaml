      *   *Anachronism:* Can we judge Pleistocene societies by Rawlsian or Utilitarian standards? If "justice" requires institutions that didn't exist, is the comparison void?
      *   *Welfare vs. Freedom:* Affluence is often defined as leisure (time), but the "Mistake" is often defined as health/status. How do we weigh these?
      *   *Path Dependence:* Even if the first farmers were worse off, once the trap snapped shut (population growth), was there *any* choice? If no choice, is there moral regret?
      *   *The "We":* Who is the subject of this history? "Humanity"? Specific lineages? This affects the normative claim.
      *   *Teleology:* Is history progressive? If farming was a "mistake," does that imply history has a direction we can correct? Or is it just contingency?
