answer: |-
  This is a exceptionally clear reconstruction of the classic "Indirect Duty Objection" to Kant. You have correctly identified the tension between Kant's metaphysics of morals (rational nature = value) and the phenomenology of suffering (pain = bad).

  If you want to remain a Kantian while avoiding the *reductio* in step (8), you generally cannot reject (1) without ceasing to be a Kantian. However, you **must** reject the inference from (3) to (4), and consequently reject the possibility claim in (5).

  Here is where the chain breaks, and how Kant's "duty to self" resource saves the theory without granting animals direct moral status.

  ### 1. The Equivocation in Step (4)
  Your Step (4) says: *"So the wrongness is totally derivative—if harming an animal never affected our treatment of people, there'd be no moral problem with it."*

  This interprets Kant's indirect duty as **consequentialist** (i.e., cruelty is wrong *because* it causes bad future outcomes for humans). But Kant's ethics is deontological, not consequentialist.

  For Kant, the wrongness of animal cruelty is not primarily about the *consequences* (will I punch a human later?), but about the **maxim** and the **state of the agent's character** (*Gesinnung*).
  *   **The Correction:** The wrongness is derivative of a **direct duty to oneself**. I have a duty to cultivate my own moral sensibilities and not degrade my own humanity.
  *   **Why it matters:** Torturing a suffering being degrades *me* immediately, regardless of whether I ever interact with another human. The "spillover" isn't a causal risk; it is a constitutive fact. To be the kind of being that enjoys or permits the torture of suffering-analogues is to already possess a corrupted will.

  ### 2. The Impossibility of the "Sealed Context" (Step 5)
  Your Step (5) posits: *"I hurt it in a sealed context where I'm psychologically certain it won't spill over into my human interactions."*

  Kant would argue this is **psychologically and morally impossible** for a rational agent.
  *   **Epistemic Humility:** We do not have intellectual intuition. We cannot see the "noumenal rational nature" of anything. We navigate the world via phenomena. If something bleeds, screams, and begs, it presents the *appearance* of an end-in-itself. To disregard that appearance is to practice a maxim of ignoring the signs of moral value.
  *   **The Unity of Virtue:** Kant does not believe in compartmentalized vice. In the *Metaphysics of Morals*, he argues that vices are not isolated acts but dispositions. You cannot adopt the maxim "I will torture screaming things when no one is looking" without corrupting your general disposition toward suffering. The "sealed context" is an illusion of self-knowledge. As Kant notes, the human heart is a "dark abyss"; assuming you can contain your cruelty is itself a form of moral arrogance.

  ### 3. The "Analogy" Resource
  You asked if there is an equivocation between 'rational nature' and 'appearance of suffering'. Kant actually leans into this.

  In his *Lectures on Ethics*, Kant argues we treat animals well not because they have rights, but because they are **analogous** to humans.
  *   **The Argument:** Since we cannot perfectly distinguish the metaphysical status of beings in the empirical world, we must treat the *analogy* of humanity with respect.
  *   **Application to your Zombie/AI:** Even if the being is a "zombie," if it mimics suffering perfectly, treating it cruelly violates your duty to **honor the analogy of humanity**.
  *   **The Cost:** This means that in the empirical world, **phenomenal suffering functions as a proxy for moral status.** You are forbidden from torturing the Zombie not because the Zombie has rights, but because *you* are required to act as if it does, to preserve your own capacity to respect rational nature where it actually exists.

  ### Where to Cut the Chain
  To keep (1) and (3) without accepting (8), you should reject the inference to **(4)** and the empirical claim in **(5)**.

  **Revised Chain:**
  *   (1) & (2) stand: Only rational beings are ends-in-themselves.
  *   (3) stands: Duties regarding animals are indirect.
  *   **(4) Rejected:** The wrongness is not contingent on future consequences for other humans. It is grounded in a **direct duty to self** (moral self-perfection).
  *   **(5) Rejected:** A "sealed context" for cruelty is impossible. Adopting a maxim of cruelty toward suffering-analogues corrupts the agent's *Gesinnung* immediately.
  *   **(6) False:** It is still wrong, because it violates the duty to maintain one's own moral sensitivity.
  *   **(7) Dissolved:** Moral status is still metaphysical (rational nature), but **moral protection** is extended to anything that phenomenally resembles a rational/suffering being, as a requirement of the agent's virtue.

  ### The Cost of This Move
  You asked what keeping (1) and (3) costs you.
  1.  **It makes Kant a Virtue Ethist (sort of):** You have to lean heavily on the *Doctrine of Virtue* rather than the *Groundwork*. The focus shifts from "What does the victim deserve?" to "What kind of person does this action make me?"
  2.  **It creates a "Practical Absolute":** While metaphysically animals (or Zombies) have no rights, practically you are forbidden from harming them almost exactly as if they *did* have rights. The distinction becomes theoretically important but practically invisible.
  3.  **It admits a tension:** You are essentially admitting that we must act *as if* phenomenal suffering matters, even if the theory says it doesn't. Some critics say this is dishonest; Kantians say it is necessary epistemic humility.

  ### Summary
  Your *reductio* works perfectly against a **crude, consequentialist reading** of Kant's indirect duties (i.e., "Don't kick the dog because you might kick the baby").

  It does **not** work against the **virtue-ethical reading** (i.e., "Don't kick the dog because kicking things that scream makes you a person who disregards the signs of moral value, which corrupts your humanity").

  If you accept that the "sealed context" is impossible and that the duty is to *self-perfection* rather than *social safety*, you can keep (1) and (3) without the bullet of (8). The moral status remains invisible metaphysically, but the **protection** remains visible phenomenally.
