      *   **Task:** Translate Orwell's core linguistic/political thesis *strictly* into ML/AI training vocabulary. No "it's like prompt engineering" hand-waving.
      *   **Specific Concepts to Address:**
          *   Orwell's Loop: Bad language $\leftrightarrow$ Bad politics (bidirectional causality).
          *   Remedy: Individual discipline + structural language constraints.
          *   Newspeak Mechanism: Removing words (pruning) vs. Penalizing words (shaping).
          *   User's Hypotheses: "Lexical Pruning" (Newspeak) vs. "Penalty Shaping" (Essay). "Dead Metaphor Tax" (is it feature collapsing?).
