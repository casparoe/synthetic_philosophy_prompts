      *Key Insight:* Einstein's God does not speak. The Heptapods do. That is the fundamental break.

      *Key Insight 2:* Einstein's determinism removes the burden of choice. Louise's determinism *imposes* the burden of choice (choosing to walk the path you know is painful).

