  10. **Final Polish:** Check tone. Ensure it answers the specific prompts (stable distinction? adds depth? where am I wrong?). Ensure the distinction between Chiang's story (more philosophical) and Villeneuve's film (more emotional/Hollywood) is acknowledged if relevant, but focus on the film as requested. (Self-correction: Stick to the film, but acknowledge the philosophical underpinnings of the source material where they illuminate the film).

  11. **Final Review against constraints:**
