answer: |-
  # Simulation Title: The Tribunal of St. Jude's
  **Duration:** 90 Minutes
  **Participants:** 18 Students (3 Groups of 6)
  **Materials:** Role Cards (printed), Influence Chips (15 per group, coloured counters), Whiteboard, Timer.

  ## 1. Pedagogical Objective
  To demonstrate that moral frameworks (Honour, Dignity, Victimhood) are not merely different opinions but distinct structural languages. When these languages collide, translation fails not because of stubbornness, but because the definition of "justice" differs fundamentally. The simulation forces students to experience the *cost* of compromise within their assigned framework.

  ## 2. Setup and Group Division (10 Minutes)
  Divide the class into three groups of six. Do **not** use the labels Honour, Dignity, or Victimhood. Refer to them as **House Alpha**, **House Beta**, and **House Gamma**.

  Distribute the **Scenario Brief** to all students:
  > *During the Regional Debate Final, a student from House Alpha was accused of plagiarising arguments from a student in House Gamma. The recording was leaked online. House Alpha's family reputation is damaged; House Gamma claims the theft was enabled by teacher bias; the School Administration (House Beta) must adjudicate. A joint statement on the resolution is required by the end of the session, or all Houses lose funding for the next term.*

  Distribute **Role Cards** within each House. Each House has two sub-roles (3 students per sub-role) to encourage internal debate before external negotiation.

  ### House Alpha (The Honour Framework)
  *   **Core Value:** Reputation is external and collective. An insult to one is an insult to all.
  *   **Sub-Role A (The Elders):** Your priority is the public standing of the House. A private apology is worthless; the restoration must be visible.
  *   **Sub-Role B (The Seconds):** Your priority is action. If respect is not shown, the House must withdraw from the institution entirely.
  *   **Constraint:** You possess 15 **Influence Chips**. Every time you agree to a *private* resolution, surrender 3 Chips. If you reach 0 Chips, your House is 'Shamed' (automatic loss).

  ### House Beta (The Dignity Framework)
  *   **Core Value:** Worth is inherent and universal. Rules must apply equally regardless of status or feeling.
  *   **Sub-Role A (The Adjudicators):** Your priority is procedure. Evidence must be weighed neutrally. Emotions and reputation are irrelevant to the verdict.
  *   **Sub-Role B (The Clerks):** Your priority is precedent. Any special accommodation sets a dangerous precedent for future rule-breaking.
  *   **Constraint:** You possess 15 **Influence Chips**. Every time you agree to a resolution based on *emotion or status* rather than evidence, surrender 3 Chips. If you reach 0 Chips, the Institution is 'Corrupted' (automatic loss).

  ### House Gamma (The Victimhood Framework)
  *   **Core Value:** Worth is linked to suffering and power dynamics. Harm must be acknowledged structurally, not just individually.
  *   **Sub-Role A (The Advocates):** Your priority is naming the harm. The focus must be on the impact on the marginalised party, not the intent of the accused.
  *   **Sub-Role B (The Strategists):** Your priority is systemic change. A simple apology is insufficient; policy must change to prevent recurrence.
  *   **Constraint:** You possess 15 **Influence Chips**. Every time you agree to a resolution that treats this as an *isolated incident* without addressing power dynamics, surrender 3 Chips. If you reach 0 Chips, the Harm is 'Erased' (automatic loss).

  ## 3. Round 1: Internal Caucusing (15 Minutes)
  Each House meets separately. They must:
  1.  Read their Role Cards.
  2.  Define their "Red Lines" (conditions under which they must veto).
  3.  Appoint two **Negotiators** to speak for the House in the next round. The other four members act as advisors who can pass notes but not speak.

  *Facilitator Note:* Walk around and ensure they understand the Chip mechanic. Emphasise that keeping Chips is necessary to 'win', but Chips are lost by compromising on their specific Core Value.

  ## 4. Round 2: Open Negotiation (25 Minutes)
  The six Negotiators (2 from each House) meet at a central table. The remaining 12 students observe silently.
  **Task:** Draft a single paragraph Joint Statement resolving the plagiarism scandal.
  **Rules:**
  1.  Any Negotiator can call a "Recess" to consult their House advisors.
  2.  Any House can **Veto** a draft statement if it violates their Core Value (as defined in their Role Card).
  3.  If a House agrees to a clause that violates their Core Value, they must immediately place 3 Chips in the centre pot.
  4.  If no agreement is reached by the timer, all Houses lose 5 Chips automatically.

  *Facilitator Note:* Watch for the deadlock. Alpha will want a public retraction/apology. Beta will want a private hearing based on evidence. Gamma will want an investigation into teacher bias. These are mutually exclusive in a single paragraph.

  ## 5. Round 3: The Verdict and Scoring (15 Minutes)
  Bring the full class back together.
  1.  Ask the Negotiators to present their final draft (or announce failure).
  2.  **The Reveal:** Reveal the hidden labels. House Alpha = Honour Culture. House Beta = Dignity Culture. House Gamma = Victimhood Culture.
  3.  **The Scoring:** Count the remaining Chips.
      *   Ask Alpha: "Did you preserve public standing?"
      *   Ask Beta: "Did you preserve procedural neutrality?"
      *   Ask Gamma: "Did you preserve the recognition of harm?"
  4.  Highlight that those with the most Chips likely failed to reach an agreement, while those who reached an agreement likely lost their Chips (moral integrity).

  ## 6. Debrief and Philosophical Connection (25 Minutes)
  This is the critical phase. Do not lecture immediately. Ask questions to draw the theory out of their frustration.

  **Phase 1: The Experience of Deadlock**
  *   "Why was it impossible to write the sentence? Was it personal stubbornness, or did the words themselves mean different things to different groups?"
  *   "For Alpha, what did 'apology' mean? For Beta, what did 'fairness' mean? For Gamma, what did 'justice' mean?"
  *   *Point to establish:* You were not disagreeing on the solution; you were disagreeing on the *nature of the problem*.

  **Phase 2: The Incommensurability**
  *   Explain that in philosophy, this is called **incommensurability**. There is no neutral currency to trade between Honour (reputation), Dignity (rights), and Victimhood (harm).
  *   To judge Honour by Dignity standards makes Honour look 'backward' or 'violent'.
  *   To judge Dignity by Victimhood standards makes Dignity look 'blind' or 'oppressive'.
  *   To judge Victimhood by Honour standards makes Victimhood look 'weak' or 'dependent'.
  *   *Key Insight:* Moral superiority cannot be ranked because the ranking criteria depend on which culture you stand in.

  **Phase 3: The "Fourth Culture"**
  *   Address your specific seminar question: "Did you feel watched?"
  *   Explain that the *rules of the simulation itself* acted as the "Fourth Culture" (an Audience/Philosopher culture). You (the teacher) and the rules judged them from outside.
  *   Ask: "Is the philosopher who studies these cultures also trapped in a culture? Or do we pretend to stand outside?"
  *   *Conclusion:* We cannot fully escape our own framework to judge others objectively. We can only map the differences.

  **Phase 4: Limitations of the Simulation**
  Be explicit about what the game failed to capture:
  *   **Phenomenological Weight:** In the game, losing Chips was annoying. In reality, losing Honour can mean social death; losing Dignity can mean dehumanisation; losing Recognition can mean trauma. The *pain* was simulated, not felt.
  *   **Historical Embeddedness:** Honour cultures often arise in stateless societies; Dignity in liberal democracies; Victimhood in stratified institutions. The game removed the history that makes these cultures necessary adaptations.
  *   **Fluidity:** Real people move between these cultures depending on context. The game forced rigidity to make the point visible.

  ## 7. Facilitation Pitfalls and Management
  **Predictable Issue 1: Gamification of Morality**
  *   *Risk:* Students treat the Chips as a score to win, rather than a representation of moral integrity. They might happily sacrifice Chips to "finish the task."
  *   *Management:* During the Intro, state clearly: "In this simulation, your Chips represent your soul, not your points. If you lose them all, you have betrayed your group's fundamental reality. Do not play to win the game; play to survive your role."

  **Predictable Issue 2: Dominant Personalities**
  *   *Risk:* One student in House Beta dictates the procedure, silencing the internal debate.
  *   *Management:* Enforce the "Recess" rule. If one Negotiator dominates, call a mandatory Recess and ask the advisors, "Did your Negotiator represent your internal consensus?"

  **Predictable Issue 3: Cynicism ("It was rigged")**
  *   *Risk:* Students dismiss the lesson because the rules forced a deadlock.
  *   *Management:* Validate this. "Yes, it was rigged. That is the point. The structures of these cultures *rig* reality. When you live in Honour, you literally cannot see Dignity as a solution. The rigging is the lesson."

  **Predictable Issue 4: Emotional Escalation**
  *   *Risk:* The Victimhood group (Gamma) may feel the simulation trivialises real suffering.
  *   *Management:* Acknowledge this sensitivity in the debrief. "We used a school scenario to keep stakes low, but we know these dynamics govern war, law, and civil rights. If the game felt trivial, that is a limitation of the classroom, not the theory."

  ## 8. Desired Takeaway
  Participants should leave understanding that asking "Which culture is best?" is a category error. It is like asking "Is a hammer better than a screwdriver?" without specifying whether you are driving a nail or turning a screw. Moral superiority depends entirely on which kind of harm one treats as fundamental: the loss of standing (Honour), the violation of rights (Dignity), or the infliction of trauma (Victimhood). The "Fourth Culture" of the philosopher is not a superior vantage point, but merely another position trying to map the terrain.

  ***

  ### Teacher's Cheat Sheet: The Conceptual Map
  *Use this to guide the debrief if students get stuck.*

  | Feature | House Alpha (Honour) | House Beta (Dignity) | House Gamma (Victimhood) |
  | :--- | :--- | :--- | :--- |
  | **Self-Worth** | External (granted by others) | Internal (inherent in all) | Relational (impacted by power) |
  | **Response to Offence** | Public restoration / Retaliation | Legalistic procedure / Ignoring | Publicising harm / Systemic change |
  | **Identity** | Collective (Family/Group) | Individual (Autonomous) | Experiential (Victim/Survivor) |
  | **The "Sin"** | Shame / Loss of Face | Bias / Rule-Breaking | Oppression / Erasure |
  | **Why Compromise Failed** | Private settlement = Shame | Emotional settlement = Corruption | Individual settlement = Erasure |
