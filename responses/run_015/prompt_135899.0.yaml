  Regarding the three-player issue, your teammate is also right that checking joint profiles differs from independent beliefs. Standard rationalizability requires that you believe opponents choose their strategies independently, meaning your belief about the group is a product of individual beliefs. By iterating over joint pure profiles of the remaining strategies, your solver implicitly allows for correlated beliefs where opponents might coordinate their actions even without communication. This computes the set of correlated rationalizable strategies, which is generally larger than the set of standard rationalizable strategies in games with three or more players, though in your specific case your pure-profile restriction likely shrinks the set back down, just incorrectly.

  Finally, on the question of deletion order, because you repeat the process until nothing changes you are finding a fixed point of a monotonic operator, meaning the order within the loop should not change the final set of survivors even if it changes how many iterations it takes. However, since the condition for survival is theoretically unsound for identifying rationalizable strategies or Nash equilibria, the stability of the answer does not make it correct. You would need to solve a linear program for each strategy to check if it is a best response to any mixed belief, allowing for correlated or independent beliefs depending on which solution concept you actually want to implement.
