              *   *Why Sealed Envelope?* It breaks the Common Knowledge required for BI. The students don't know the day. The Instructor knows the day. The students know the Instructor knows. But the students don't know *which* day the Instructor knows.
              *   *Wait, BI doesn't require knowing the day, just knowing the constraints.*
              *   *Okay, I need to address the "Sealed Envelope is a cheat" concern.*
              *   *Argument:* It's not a cheat, it's a **Private Signal**. BI requires Common Knowledge of the schedule. A sealed envelope makes the schedule Private Knowledge of the Instructor. This breaks the induction.
              *   *This is the key lesson.*

  4.  **Drafting the Plan:**

      *   **Definition:** Stick with Credence < 2/5. It operationalizes "Surprise" into a payoff condition. It shifts the burden from "Metaphysical Knowledge" to "Betting Behavior."
      *   **Timeline:** 75 mins.
          *   0-5: Setup & Rules.
          *   5-70: 8 Rounds (8 mins each).
