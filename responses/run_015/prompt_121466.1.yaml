      *   *Why?* Because the Paradox relies on the students assuming the Instructor is *bound by their logic*. The Instructor is not. The Instructor is bound by the Envelope. The Envelope is independent of their reasoning.
      *   *The Lesson:* The BI argument assumes the Instructor's action is a function of the students' knowledge. It is not. It is a function of the Envelope.
      *   *This is the winning insight.* The BI fails because it models the Instructor as a logical consequent of the students' epistemic state, rather than an independent agent with a committed plan.

  6.  **Addressing the "Credence vs. Knowledge" Gap:**

      *   Credence < 2/5 is a *behavioral* proxy for surprise.
      *   Knowledge = Credence 1 + Justification + Truth.
      *   The mechanism measures Credence. It cannot measure Justification.
      *   *Debrief Point:* "You bid 0.9. You were confident. Were you *justified*? The mechanism doesn't care. It only cares that you weren't surprised."
      *   *Substitution:* Keep the 2/5. It's specific enough to create a bright line for the bonus.

  7.  **Addressing Failure Modes:**

      *   *Student bids 1 on final round:* Rational. If quiz happens, they lose surprise bonus but gain accuracy.
