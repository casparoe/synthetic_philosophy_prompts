      *   **Bidding:** Teams of 4 (6 teams). Incentive: Course Credit (small %). Scoring Rule: Quadratic (Brier) + Surprise Bonus.
      *   **Selection:** Sealed Envelope (Fixed Day). *Crucial:* Do not reveal the day until the end.
      *   **Debrief:** Map the bids. Show how confidence grew. Highlight the "Common Knowledge" break.
      *   **Failure Modes:** Address the "No Quiz" risk (Instructor must quiz). Address the "Refuser."

  5.  **Refining the "Cheat" Argument:**

      *   The prompt asks: "whether the sealed envelope is a cheat or is simply what surprise consists in."
      *   *Answer:* It is what surprise consists in. Surprise requires an asymmetry of information. If the distribution is public knowledge, the hazard rate is common knowledge, and BI applies. If the specific realization is private (Envelope), the students cannot condition on "If not today, then tomorrow" with certainty, because they don't know the constraints of the envelope (e.g., maybe I rolled a die and got 'no quiz'?).
