      *   *What if no quiz happens because I chicken out?* Then the student was right. I must quiz.

  8.  **Finalizing the Structure:**

      *   **Intro:** Rules, Scoring, Definition of Surprise.
      *   **Rounds:** 8 Rounds. 8 mins each.
      *   **Bidding:** Teams. Quadratic Scoring + Surprise Bonus.
      *   **Selection:** Sealed Envelope (Day 5, say).
