      *   *Ethics:* Small stakes (bonus points), not core grade. Consent implied by enrollment, but offer opt-out.
      *   *No Quiz:* If the Envelope says "No Quiz" (to allow for the possibility), the announcement was a lie. I must commit to "Quiz Happens." So Envelope contains a Day 1-8.
