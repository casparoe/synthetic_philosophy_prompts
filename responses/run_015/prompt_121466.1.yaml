answer: |-
  ### 1. The Definition of Surprise: Credence vs. Knowledge

  **Verdict:** Keep the credence threshold (< 2/5), but **reframe its function**.

  Do not define the *truth* of your announcement by this threshold. Define the **bonus eligibility** by it.
  *   **Announcement:** "There will be a quiz in one of these rounds." (This is the truth claim you must make good on.)
  *   **Rule:** "The quiz counts as *surprising* for bonus points if, at the start of the round, your team's reported credence is below 2/5."

  **Why this substitution matters:**
  If you bind your *ability* to quiz to the credence threshold (i.e., "I will only quiz if your credence is < 2/5"), you hand the students the Backward Induction (BI) weapon. They will reason: "In the final round, our credence must be 1 (certainty). 1 > 2/5. Therefore, you cannot quiz in the final round." The induction cascades backward, and you are logically prohibited from quizzing at all. You would be forced into the "No Quiz" outcome, validating the student's written objection.

  By decoupling the *occurrence* of the quiz from the *credence threshold*, you preserve your agency. You can quiz even if they are confident. The threshold merely determines whether they are rewarded for their uncertainty. This operationalizes the gap between **Knowledge** (which implies credence 1) and **Surprise** (which is here defined as low credence). The lesson becomes: *You can be confident (high credence) and still be wrong (quiz happens), but you won't get the bonus.* This allows you to "make good" on the quiz while letting the paradox play out in the scoring.

  ### 2. Mechanism and Materials

  **Grouping:**
  Divide the 24 students into **6 teams of 4**.
  *   *Reasoning:* Individual bidding creates too much noise and isolates the "clever" student. Teams force the BI argument to be aired aloud ("If we bid high, we lose the bonus, but if we bid low..."). It creates a collective epistemic agent, mirroring the "class" in the paradox.

  **Incentives:**
  *   **Base Score:** Proper Scoring Rule (Quadratic/Brier).
      *   Formula per round: $S = 1 - (p - o)^2$, where $p$ is bid (0 to 1) and $o$ is outcome (1 if quiz, 0 if not).
      *   *Why:* This is incentive-compatible. To maximize expected score, a team must bid their true credence. Bidding 0 or 1 strategically (unless certain) penalizes them.
  *   **Surprise Bonus:** +0.5 points to the round score *if* Quiz occurs ($o=1$) *and* Team Bid $p < 0.4$.
  *   **Currency:** Course Credit. The total points from this session count as one tutorial participation mark (or 5% of the final grade). This is high enough to matter, low enough to avoid ethical grievances about "rigged" grading.

  **Materials:**
  *   6 Whiteboards/Tablets (for teams to display bids).
  *   1 Envelope (sealed, containing the Quiz Round number).
  *   Projector (to display aggregate mean bid per round).
  *   8 Micro-Quiz Questions (printed, 2 minutes each to answer).

  ### 3. Minute-by-Minute Timeline (75 Minutes)

  **00:00 – 00:05: Setup**
  *   Distribute teams. Hand out the "Bidding Sheet" (8 rows).
  *   Read the Announcement: "In exactly one of the next eight rounds, there will be a quiz. You will bid your credence that the quiz is *this* round. If the quiz happens and your bid was below 0.4, you get a surprise bonus."
  *   Show the Sealed Envelope. "The round number is in here. I do not know it? No, I do. You do not. I will not look at it until the round begins." (This is a lie to preserve tension, or truth if you pre-committed. Better: "I have committed to the number in this envelope. It will not change.")

  **00:05 – 01:05: The 8 Rounds (8 minutes each)**
  *   **Min 0-3 (Deliberation):** Teams discuss and write their probability bid (0.0 to 1.0) for *this* round.
  *   **Min 3-4 (Submission):** Teams hold up boards. You record the 6 bids. Calculate the Class Mean.
  *   **Min 4-5 (Information):** Project the Class Mean. (e.g., "Round 1 Mean Credence: 0.15").
  *   **Min 5-6 (Resolution):** Open the Envelope *only if* this is the pre-selected round.
      *   *If Quiz Round:* Announce "Quiz Today." Distribute micro-task (2 mins). Collect answers.
      *   *If Not Quiz Round:* Announce "No Quiz."
  *   **Min 6-8 (Scoring):** Teams calculate their round score. You update the leaderboard. Transition to next round.

  **01:05 – 01:15: Debrief**
  *   Reveal the Envelope content (e.g., "Round 5").
  *   Map the bid history against the BI argument.
  *   Final philosophical synthesis.

  ### 4. Selection Mechanism: The Sealed Envelope

  **Recommendation:** **Sealed Envelope (Fixed Day).**
  *   *Commitment:* Before class, randomly select a number 1–8. Seal it.
  *   *Why:* This is the only way to break the **Common Knowledge** loop required for Backward Induction.
  *   *Addressing the "Cheat" Objection:* You must address this directly in the debrief. The BI argument assumes that the *Instructor's Hand* is tied by the *Students' Logic*. It assumes you are a logical function of their epistemic state. You are not. You are an agent with a pre-committed plan (the envelope).
  *   *Public Randomization vs. Envelope:* If you used a public die roll *during* class to decide each week ("I'll roll a die, if 6, we quiz"), the hazard rate becomes common knowledge, and BI applies. By sealing the day *beforehand*, you create an **Information Asymmetry**. They know you know, but they don't know *what* you know. This asymmetry is what "Surprise" consists in. It is not a cheat; it is the *condition of possibility* for the surprise.

  ### 5. The Debrief: Extracting the Structural Fact

  **The Structural Fact:**
  The bid sheets will exhibit **Non-Convergence**.
  *   *BI Prediction:* Bids should be 0 until the final round, then 1. (Or 1 on all rounds if they think the announcement is void).
  *   *Actual Result:* Bids will fluctuate, likely staying below 1.0 even in Round 8 (unless they are certain you wouldn't lie about the envelope).
  *   *The Lesson:* Ask a student: "Why didn't you bid 1.0 on Round 8?"
      *   *Expected Answer:* "Because we weren't sure you wouldn't skip it / We thought you might have picked Round 5."
      *   *Your Move:* "Exactly. The Backward Induction argument requires **Common Knowledge of Rationality and Commitment**. You lacked knowledge of my commitment (the envelope). You treated me as a logical variable, not an independent agent."

  **What the Mechanism Cannot Reproduce:**
  *   *The Knowledge Claim:* The mechanism measures *credence* (betting behavior), not *justified true belief*. You cannot prove they "Knew" it was Friday. You can only prove they "Bet" on it.
  *   *Supplying the Gap:* Do not capitulate. Say: "The paradox claims you cannot *know* the day. This game shows you wouldn't *bet* on the day. In practice, those are the same thing. If you aren't confident enough to bet 1.0, you don't know it. The student's argument failed because it assumed my logic was transparent to you. It wasn't. The envelope was opaque. That opacity is where the surprise lived."

  ### 6. Failure Modes and Ethical Constraints

  **1. The "Clever" Zero-Bidder:**
  *   *Scenario:* A team bids 0.0 every round, arguing "You can't quiz."
  *   *Outcome:* If you quiz on Round 5, their bid is 0.0 (< 0.4). They get the Surprise Bonus.
  *   *Lesson:* They "win" the points but "lose" the argument. They claimed the quiz was *impossible*. You made it *actual*. Their low bid confirms they were surprised, which validates your announcement, not their impossibility proof. Point this out: "You got the bonus because you were surprised. If your argument were right, there would be no quiz to be surprised by."

  **2. The Refuser:**
  *   *Scenario:* A student refuses to bid, claiming the game is rigged.
  *   *Action:* Allow them to be a "Scrutineer." They verify the envelope seal and calculate the scores. They participate without betting. This neutralizes the "coercion" objection.

  **3. Ethical Consent:**
  *   *Constraint:* You cannot grade on a "rigged" paradox without consent.
  *   *Fix:* Explicitly state at the start: "This session is an experiment in rationality. The points are real, but the mechanism is the lesson. If you opt out, you get the average participation mark." This satisfies ethical review standards for classroom experiments.

  **4. The "No Quiz" Expiry:**
  *   *Scenario:* You reach Round 8, and the Envelope says "Round 9" (impossible) or you decide not to quiz.
  *   *Verdict:* This is a **Bug**, not a feature. You promised a quiz.
  *   *Contingency:* If you reach Round 8 and no quiz has happened, you **must quiz on Round 8**, regardless of the envelope.
  *   *Why:* If you don't, you have falsified your initial announcement ("There *will* be a quiz"). The paradox is about the *surprise*, not the *existence*. It is better to be unsurprising (bid = 1.0) than to be a liar.
  *   *Debriefing this:* If this happens, acknowledge it. "The logic forced my hand. The surprise failed, but the promise held. This shows the tension between *Predictability* and *Truth*."

  ### Summary of the "Trap"
  The students who reason through the elimination most confidently will bid 0 (or very low) on the final rounds, believing the quiz is impossible. By quizzing on Round 5 (or 8), you catch them with low credence. They get the bonus, but their epistemic claim ("This cannot happen") is falsified by the event. The mechanism ensures that **confidence is punished** (no bonus if bid > 0.4) but **skepticism is rewarded** (bonus if bid < 0.4), while the **reality of the quiz** disproves the impossibility argument. You make good on the quiz, and the lesson is that **logical certainty about another agent's action is impossible without common knowledge of that agent's constraints.**
