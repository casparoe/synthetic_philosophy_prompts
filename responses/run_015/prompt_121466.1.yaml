      *   *So why use it?* To allow the Instructor to *ignore* the BI and quiz anyway without being caught in a lie *during* the process. The Envelope represents the Instructor's commitment to a plan that is opaque to the students.
      *   *Better Selection Mechanism:* **The Instructor's Discretion constrained by the Bids.** "I will quiz on the first round where the Mean Bid is < 0.4."
      *   *If I do this:*
          *   Round 8: If we get there, Mean Bid will be 1 (certainty). So I can't quiz.
          *   Round 7: They know I can't quiz on 8. So it must be 7. Mean Bid 1. Can't quiz.
          *   ...
          *   Round 1: Mean Bid 1. Can't quiz.
          *   Result: No Quiz.
      *   *This proves the student right.* But the Instructor wants to "Make Good."
      *   *So I cannot use that rule.*
