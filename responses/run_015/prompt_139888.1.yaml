  # The Two-Dimensional Compass

  **Instructions:** Answer each question based on your verdict on the case. Follow the branch until you reach a leaf. Record your bitstring (e.g., Y-N-Y-N) to compare with others in the comments.

  *   **Y** = Yes / Affirmative / Sharp / Content / Explain
  *   **N** = No / Negative / Vague / Use / Map

  ***

  1.  **The Zembla Stipulation.** You define 'zembla' as "the watery stuff here, if H₂O, else XYZ." In a counterfactual world where XYZ is watery, could the stipulator have known from the armchair that 'zembla' denotes H₂O?
      *   **Y** → Go to 2.
      *   **N** → Go to 3.

  2.  **Impossible Scenarios.** Is it coherent to conceive of a scenario where water exists but is not H₂O, even if such a scenario is metaphysically impossible?
      *   **Y** → Go to 4.
      *   **N** → Go to 5.

  3.  **Semantic Reality.** Is the armchair-accessible truth of 'Water is H₂O' a genuine fact about the word's content, or merely a fact about how we fix its reference?
      *   **Content** → Go to 6.
      *   **Use** → **Leaf 1** (Direct Reference).

  4.  **Sealed Lab.** A researcher writes "This boils now" at the exact moment her sample boils. Could she have known this was true without looking at the sample or a clock?
      *   **Y** → **Leaf 2** (Epistemic Centered).
      *   **N** → **Leaf 3** (Epistemic Uncentered).

  5.  **Sealed Lab.** (Same case as above). Could she have known this was true without looking at the sample or a clock?
      *   **Y** → Go to 7.
      *   **N** → Go to 8.

  6.  **Explanation.** Does the two-dimensional framework explain *why* reference works this way, or merely record our intuitions about it?
      *   **Explain** → **Leaf 4** (Constitutive Epistemic).
      *   **Map** → **Leaf 5** (Instrumentalist Epistemic).

  7.  **Indexicality.** Does 'water' shift its reference when *you* say it versus when *I* say it, holding the physical world fixed?
      *   **Y** → **Leaf 6** (Indexical Contextual).
      *   **N** → Go to 9.

  8.  **Assertion.** When you assert "Water is wet," do you aim to rule out worlds where H₂O isn't wet, or worlds where the watery stuff isn't wet?
      *   **H₂O** → Go to 9.
      *   **Watery** → **Leaf 7** (Diagonal Pragmatic).

  9.  **The Drift Case.** A colony's water supply changes over centuries from H₂O to XYZ via tiny isotopic steps. Is there a precise sample at which 'water' stops denoting H₂O?
      *   **Y** → **Leaf 8** (Classical Metasemantic).
      *   **N** → **Leaf 9** (Vague Metasemantic).

  10. **The Error Case.** If a community calls XYZ 'water' for centuries without noticing, are they systematically wrong?
      *   **Y** → **Leaf 10** (Fallibilist).
      *   **N** → **Leaf 11** (Usage-Based).

  *(Note: Node 10 is only reached via specific paths to ensure leaf count remains under 12. For the purpose of this handout, if you reached Node 9, answer Node 10 only if you answered 'N' to Node 9. If 'Y' to Node 9, stop at Leaf 8.)*

  ***

  ## The Leaves

  **Leaf 1: Direct Reference (Soames)**
  *Bitstring: 1-N, 3-Use*
  *   **Steelman:** Preserves the intuition that identity statements are about objects, not modes of presentation.
  *   **Awkward Commitment:** Must treat the armchair accessibility of reference-fixing as a pragmatic illusion rather than semantic content.

  **Leaf 2: Epistemic Centered (Chalmers)**
  *Bitstring: 1-Y, 2-Y, 4-Y*
  *   **Steelman:** Captures the full range of conceivability, including metaphysically impossible scenarios and self-locating truths.
  *   **Awkward Commitment:** Commits to a rich ontology of epistemic possibilities that outstrip metaphysical reality.

  **Leaf 3: Epistemic Uncentered**
  *Bitstring: 1-Y, 2-Y, 4-N*
  *   **Steelman:** Accepts epistemic space without the baggage of centered worlds or impossible scenarios.
  *   **Awkward Commitment:** Struggles to account for contingent a priori truths like "I am here now."

  **Leaf 4: Constitutive Epistemic**
  *Bitstring: 1-Y, 2-N, 6-Explain*
  *   **Steelman:** Treats the epistemic dimension as foundational to how language hooks onto the world.
  *   **Awkward Commitment:** Risks conflating how we know a thing with what the thing is.

  **Leaf 5: Instrumentalist Epistemic**
  *Bitstring: 1-Y, 2-N, 6-Map*
  *   **Steelman:** Uses the framework as a tool for clarity without ontological commitment.
  *   **Awkward Commitment:** Offers no explanation for why the tool works so well.

  **Leaf 6: Indexical Contextual (Kaplan)**
  *Bitstring: 1-N, 3-Content, 5-Y, 7-Y*
  *   **Steelman:** cleanly separates context-dependent character from content-dependent proposition.
  *   **Awkward Commitment:** Requires treating natural kind terms as hidden indexicals, which some find linguistically unnatural.

  **Leaf 7: Diagonal Pragmatic (Stalnaker)**
  *Bitstring: 1-N, 3-Content, 5-N, 8-Watery*
  *   **Steelman:** Explains communication success without positing two distinct semantic contents.
  *   **Awkward Commitment:** Reduces the first dimension to a feature of assertion rather than meaning.

  **Leaf 8: Classical Metasemantic**
  *Bitstring: 1-N, 3-Content, 5-N, 8-H₂O, 9-Y*
  *   **Steelman:** Maintains sharp boundaries for reference and metaphysical necessity.
  *   **Awkward Commitment:** Must accept brute facts about exactly which isotopic shift changes the reference.

  **Leaf 9: Vague Metasemantic**
  *Bitstring: 1-N, 3-Content, 5-N, 8-H₂O, 9-N*
  *   **Steelman:** Accommodates the vagueness of natural language without abandoning reference.
  *   **Awkward Commitment:** Must accept truth-value gaps or supervaluation for identity statements.

  **Leaf 10: Fallibilist**
  *Bitstring: ...9-N, 10-Y*
  *   **Steelman:** Allows that communities can be wrong about the extension of their own terms.
  *   **Awkward Commitment:** Makes reference determination opaque to the speakers themselves.

  **Leaf 11: Usage-Based**
  *Bitstring: ...9-N, 10-N*
  *   **Steelman:** Grounds reference entirely in actual communal practice.
  *   **Awkward Commitment:** Makes it difficult to criticize established usage as erroneous.

  **Leaf 12: Unnamed (Deflationary)**
  *Bitstring: 1-N, 3-Use, 6-Map*
  *   **Steelman:** Accepts the apparatus for sorting intuitions but denies it carries metaphysical weight.
  *   **Awkward Commitment:** Risks collapsing into Leaf 1 if pressed on why the sorting matters.

  ***

  ## Unreached Verdict Combinations

  **1. Zembla-Y + Semantic-Use (Armchair content is not semantic)**
  *   **Status:** **Incoherent.** If the armchair truth is fixed by the stipulation (Y), it constitutes the cognitive content. Denying it is semantic content while affirming it is armchair-accessible creates a contradiction in terms for this framework.

  **2. Impossible-Y + Sealed-N (Impossible scenarios allowed, but no centered worlds)**
  *   **Status:** **Stable but Unattractive.** One could hold that epistemic space includes impossible worlds but reject self-locating propositions. However, this view loses the primary motivation for expanding epistemic space (handling contingent a priori truths), making it an unstable stopping point.

  **3. Drift-Y + Error-N (Sharp cutoff, but community cannot be wrong)**
  *   **Status:** **Unexplored.** This view would claim reference shifts precisely at a specific molecule, yet deny the community is "wrong" before the shift completes. It would require a theory where reference is objective and sharp, but normative assessment of usage is suspended during transition.

  ***

  ## Indistinguishable Leaves

  **Leaf 7 (Diagonal Pragmatic) and Leaf 12 (Deflationary)**
  *   **The Issue:** Both leaves reject the first dimension as *semantic content* and treat the framework as a tool for mapping assertion conditions. On the cases provided, they yield identical verdicts.
  *   **The Separator:** To separate them, ask: **"Is the diagonal proposition a derived feature of communication, or a fundamental feature of the language?"** Leaf 7 (Stalnaker) argues it is fundamental to how context updates; Leaf 12 argues it is merely a useful heuristic with no underlying mechanism.

  **Leaf 6 (Indexical Contextual) and Leaf 8 (Classical Metasemantic)**
  *   **The Issue:** Both affirm sharp reference and semantic content. On the Drift and Indexicality nodes, they may converge if the Classicist accepts hidden indexicality.
  *   **The Separator:** Ask: **"Does 'water' denote different substances in the mouths of twins on Twin Earth?"** Leaf 6 says Yes (content shifts with context); Leaf 8 typically says No (content is fixed by causal history, context only fixes reference).
