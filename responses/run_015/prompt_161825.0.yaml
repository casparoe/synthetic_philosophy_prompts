answer: |-
  Here is a principle designed to capture your reflective equilibrium, followed by its application to your new case and an honest assessment of which of your existing verdicts it requires you to abandon.

  ### The Principle: Verified Humanitarian Necessity

  An intervention by force is justified if and only if it satisfies three conditions:

  1.  **Supreme Emergency:** There is objective evidence of ongoing or imminent mass atrocity (large-scale loss of life or ethnic cleansing) that the host state is unwilling or unable to stop.
  2.  **Proportional Efficacy:** The use of force is the last resort, likely to succeed, and the harms caused by the intervention will not exceed the harms averted.
  3.  **Intersubjective Validation:** The determination that conditions (1) and (2) are met must be subject to authorization or veto by a body independent of the intervening agent(s).

  ### How It Fits Your Verdicts

  *   **Kosovo (Justified):** Meets (1) and (2). Meets (3) loosely: while the UNSC was blocked, NATO acted as a collective body independent of any *single* state's whim, providing a check against unilateral bias.
  *   **Iraq (Not Justified):** Fails (1). No ongoing atrocity or imminent threat was objectively established.
  *   **Libya (Mixed):** Phase 1 meets (1), (2), and (3) (UNSC Resolution 1973). Phase 2 (regime change) fails (3) because it exceeded the independent mandate, and arguably fails (2) as the harms of state collapse began to outweigh the immediate protection benefits. **This resolves your uncertainty:** The intervention was justified *qua* protection, but the mission creep was unjustified. You need not condemn the rescue to condemn the regime change.
  *   **Mixed Motive/Oil (Justified):** Meets (1) and (2). Meets (3) assuming the "state" in your prompt is subject to alliance constraints or international scrutiny. Your intuition that motives are irrelevant is preserved; (3) checks *judgment*, not *purity*.
  *   **Invitation + Atrocity (Not Justified):** Fails (1). If mass killing is foreseeable, the "host state" is the perpetrator, rendering consent void under the Supreme Emergency clause.
  *   **Unilateral vs. Coalition:** This is where the principle does its heaviest lifting. A coalition satisfies (3) by distributing the decision-making power; a single state acting alone fails (3) because it is the sole judge of its own compliance.

  ### Application to Your New Case: Arming Rebels

  **Case:** A state arms a rebel group that would probably stop the atrocities but would probably commit some of its own.

  **Verdict:** **Not Justified.**

  **Reasoning:** This fails Condition 2 (**Proportional Efficacy**) and Condition 3 (**Intersubjective Validation**).
  *   **On Efficacy:** "Probably commit some of their own [atrocities]" violates the requirement that harms caused must not exceed harms averted. Proxy forces are notoriously difficult to control; arming them introduces a high risk of negative net consequences.
  *   **On Validation:** You cannot subject a non-state rebel group to independent validation or veto in the way you can a state actor or coalition. There is no mechanism to hold them accountable if they exceed the mandate.
  *   **Prediction:** Even if the rebels stop the massacre, the lack of control and the foreseeability of their own abuses makes the intervention ethically impermissible under this principle. It turns the intervener into a co-principal of potential future abuses.

  ### The Sacrifice: Which Verdict Must You Give Up?

  To maintain consistency with this principle (and arguably with your own "Motive" intuition), you must abandon or significantly weaken your verdict on **Case 5 (Unilateral vs. Coalition)**.

  **Your Verdict:** *Identical intervention, identical outcome, carried out by one state acting alone = Not Justified.*
  **The Principle's Verdict:** *If Conditions 1 and 2 are objectively met, the lack of Condition 3 is a procedural defect, but in a hypothetical where outcomes are guaranteed identical, the intervention remains **Justified** (or at least permissible).*

  **Why this is the weakest link in your view:**
  Your intuition on Case 5 conflicts with your intuition on Case 4 (Motive).
  *   In **Case 4**, you argue that *internal states of mind* (greed vs. altruism) do not determine justification; only the *external reality* (lives saved) matters.
  *   In **Case 5**, you argue that *internal structural arrangements* (one flag vs. many flags) determine justification, even when the *external reality* (lives saved) is identical.

  This is inconsistent. If motives don't matter because "what justifies an intervention is what it does," then the number of actors shouldn't matter *if* the outcome is truly fixed.

  The "Intersubjective Validation" clause (Condition 3) is actually an **epistemic proxy**. We demand coalitions or UNSC approval not because they are morally holier, but because they reduce the risk of error, bias, or miscalculation. A coalition is less likely to be wrong than a single state.

  However, in your thought experiment, you have stipulated that the outcome is *identical*. You have removed the risk of error. In that specific hypothetical, condemning the unilateral actor amounts to **rule worship**. You are prioritizing the *procedure of decision-making* over the *lives saved*, which contradicts your consequentialist leanings in the Oil and Kosovo cases.

  **Recommendation:**
  Modify your view on Case 5. Hold that unilateralism is **presumptively unjustified** because it usually fails the reliability test (Condition 3). But admit that in a "Supreme Emergency" where a coalition is impossible (e.g., a veto-wielding ally of the perpetrator blocks the UNSC, and no regional alliance exists) and the atrocity is certain, a unilateral intervention can be justified *if* the evidence of necessity is overwhelming.

  This aligns you with your Kosovo verdict (which was effectively unilateral relative to the UNSC) and preserves the core of your ethic: **The moral currency of intervention is lives saved, not procedural purity.** Procedure matters only insofar as it secures the right outcome.
