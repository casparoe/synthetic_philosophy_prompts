  To understand the mechanism of the Common Prior Assumption (CPA) in Aumann's Agreement Theorem, we must look at how a single prior distribution acts as a "consistency constraint" on the agents' beliefs.

  When agents share a prior, their posteriors are simply conditional probabilities derived from that single global measure. If their posteriors become **common knowledge**, the mathematics of expectation forces those posteriors to align with the prior's average over the common knowledge set. If they do not share a prior, this link is broken; their beliefs are anchored to different global measures, allowing them to remain apart even when they know exactly what the other believes.

  Below is a minimal, checkable scenario using a state space of three elements. To ensure the "Common Knowledge" condition is mathematically satisfied within this small space, we use identical information partitions. This isolates the **Prior** as the only variable, allowing you to verify the arithmetic of agreement versus disagreement directly.

  ### The Scenario Setup

  *   **State Space ($\Omega$):** $\{1, 2, 3\}$.
  *   **Event of Interest ($E$):** $\{1\}$. (The agents are assessing the probability that the state is 1).
  *   **Information Structure:** Both agents have the same partition $\Pi = \{\{1, 2\}, \{3\}\}$.
      *   *Note:* In larger state spaces, partitions usually differ. Here, we make them identical to satisfy the strict "Common Knowledge" requirement within 3 states without forcing probabilities to 0 or 1. This isolates the effect of the Prior.
  *   **Actual State:** $\omega = 2$.
  *   **Observation:** Both agents observe the cell $\{1, 2\}$. They know the state is either 1 or 2.
  *   **Common Knowledge Condition:** Because they share the same partition and know the state is in $\{1, 2\}$, they know that the other agent is looking at the exact same set $\{1, 2\}$. Therefore, their probability assignments for $E$ are automatically common knowledge.

  ---

  ### Version 1: The Common Prior Assumption (Agreement)

  **Assumption:** Both agents share a single prior probability distribution $P$ over $\Omega$.

  **The Agents' Calculation:**
  Since both agents observe $\{1, 2\}$, they both calculate the posterior probability of $E$ using the same formula:
  $$ q = P(E \mid \{1, 2\}) = \frac{P(1)}{P(1) + P(2)} $$

  **The Result:**
  Because they use the **same** numerator $P(1)$ and the **same** denominator $P(1) + P(2)$, they must arrive at the **same** number $q$.

  **Worked Arithmetic:**
  Let the Common Prior be uniform: $P(1) = 1/3, P(2) = 1/3, P(3) = 1/3$.
  *   **Alice's Belief:** $\frac{1/3}{1/3 + 1/3} = \frac{1/3}{2/3} = \mathbf{1/2}$.
  *   **Bob's Belief:** $\frac{1/3}{1/3 + 1/3} = \frac{1/3}{2/3} = \mathbf{1/2}$.

  **Conclusion:** They agree. It is impossible for them to disagree because their beliefs are functionally determined by the same underlying measure $P$.

  ---

  ### Version 2: Different Priors (Disagreement)

  **Modification:** We keep the state space, event, and information structure exactly the same. We **only** change the assumption that they share a prior.
  *   Alice has Prior $P_A$.
  *   Bob has Prior $P_B$.

  **The Agents' Calculation:**
  *   Alice calculates: $q_A = \frac{P_A(1)}{P_A(1) + P_A(2)}$
  *   Bob calculates: $q_B = \frac{P_B(1)}{P_B(1) + P_B(2)}$

  **The Result:**
  There is no mathematical constraint forcing $q_A$ to equal $q_B$. They can look at the same evidence $\{1, 2\}$ and rationally maintain different beliefs indefinitely because they are normalizing against different "worldviews."

  **Worked Arithmetic:**
  Let Alice's Prior be $P_A = (1/2, 1/2, 0)$.
  Let Bob's Prior be $P_B = (1/4, 3/4, 0)$.
  *(Note: Both sum to 1, so they are valid priors.)*

  *   **Alice's Belief:**
      $$ q_A = \frac{1/2}{1/2 + 1/2} = \frac{1/2}{1} = \mathbf{1/2} $$
  *   **Bob's Belief:**
      $$ q_B = \frac{1/4}{1/4 + 3/4} = \frac{1/4}{1} = \mathbf{1/4} $$

  **Conclusion:** Alice believes the probability is $1/2$; Bob believes it is $1/4$. They know exactly why the other believes what they do (they know the other is conditioning on $\{1, 2\}$), but they cannot converge. Alice views state 1 and 2 as equally likely; Bob views state 2 as three times more likely than state 1. Neither is irrational; they simply started with different measures.

  ---

  ### Mechanism Analysis: What Step Breaks?

  You suspected the Common Prior allows one to infer evidence from the posterior. In this example, the mechanism is even more direct: **The Common Prior acts as a global consistency constraint.**

  1.  **In Version 1 (CPA):** The Common Prior $P$ dictates the "weight" of state 1 relative to state 2 for *everyone*. The posterior is just a local rescaling of that global weight. Since the global weight $P(1)/P(2)$ is unique, the local rescaling must be unique. The step that licenses agreement is the **substitution of the single variable $P$** into both agents' formulas.
  2.  **In Version 2 (No CPA):** That substitution fails. Alice's formula depends on $P_A$, and Bob's depends on $P_B$. The "link" between their beliefs is severed. The step that breaks is the **uniqueness of the measure**. Without a common $P$, the ratio $P(1)/P(2)$ is not a fact about the world, but a fact about the agent.

  **Summary:** The Common Prior Assumption forces all agents to agree on the **relative likelihoods** of the states in the world. If you agree on the relative likelihoods (the prior) and you agree on the information (the partition cell), you must agree on the posterior. Drop the Common Prior, and you drop the agreement on relative likelihoods, allowing rational disagreement to persist.
