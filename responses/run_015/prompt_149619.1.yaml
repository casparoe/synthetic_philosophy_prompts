      *   *Check:* The "buying out" critique.
      *   *Nuance:* In domestic law, you can't pay someone else to serve your prison sentence. But in international aid, you pay others to build schools. Where does asylum fit? The clearinghouse treats it like aid (transferable). Current law treats it like jurisdiction (non-transferable *once triggered*, but avoidable *before triggered*).
