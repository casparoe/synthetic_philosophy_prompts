answer: |-
  This is a profound puzzle, and you have identified the exact fault line where international law stops being a coherent moral system and starts being a negotiated truce between sovereigns. To write this piece effectively, you need to separate the *legal mechanics* (which are settled) from the *moral theory* (which is almost entirely opaque).

  Here is a reconstruction of the implicit theory of duty, the distinction between the clearinghouse and the status quo, and the specific points where the regime is philosophically underdetermined.

  ### 1. The Implicit Theory of the Current Regime
  The current architecture relies on a hybrid theory that switches masks depending on which gate the migrant is standing behind. It presupposes two distinct duties that are never reconciled.

  **Duty A: The Negative Duty of Non-Refoulement (Relational)**
  *   **The Trigger:** Physical presence or effective control.
  *   **The Theory:** This is a *relational* duty. It arises because the state has the person in its power. It is analogous to a custodial duty: if you take someone into custody, you cannot hand them over to their torturer.
  *   **The Presupposition:** The duty is owed *to the specific individual* by *the specific state* that encounters them. It is non-transferable. You cannot pay Mexico to take the person you intercepted at sea if the person would be persecuted in Mexico.
  *   **The Loophole:** Because the duty is triggered by *presence*, the state treats the avoidance of presence as morally neutral. Interdiction at sea is not seen as violating the duty, because the duty hasn't "switched on" yet.

  **Duty B: The Humanitarian Duty of Resettlement (Collective)**
  *   **The Trigger:** Extreme need (refugee camp status), regardless of location.
  *   **The Theory:** This is a *collective* duty. It is owed by the "international community" (often manifested as wealthy Western states) to people in dire straits.
  *   **The Presupposition:** This duty is discretionary. It is framed as "generosity" because there is no mechanism to enforce it. It treats protection as a public good to be distributed, not a right to be claimed.
  *   **The Contradiction:** If Duty A is absolute and relational, why does Duty B exist? If the duty is to *not return*, resettlement shouldn't be necessary; the person should just stay where they landed. Resettlement admits that the first country of arrival often cannot or will not fulfill the duty, implying the duty is actually about *outcome* (safety), not *process* (jurisdiction).

  **Strict Presupposition vs. Comfortable Fit:**
  *   **Strictly Presupposed:** The regime presupposes that sovereignty (the right to exclude) is the default moral position. Protection is the exception. Therefore, the burden of proof is always on the migrant to trigger the exception.
  *   **Merely Comfortable:** The idea that "temporary protection" is the norm fits comfortably with the 1951 Refugee Convention (which assumed crises were temporary political upheavals), but it is not strictly required by the moral duty of protection. If the danger is permanent, the duty to protect does not logically expire.

  ### 2. The Clearinghouse vs. Current Machinery
  Is the clearinghouse proposal different in principle, or just a frank admission of what states already do?

  **The Status Quo: "Hot Potato"**
  Current mechanisms (safe-third-country rules, offshore processing) are designed to *extinguish* the duty. They aim to find a legal technicality that says, "This is not our problem." When Australia sends asylum seekers to Nauru, or the EU pays Turkey to hold migrants, the goal is often to ensure the person never acquires the legal status that would trigger Duty A. The person is often left in legal limbo, without a path to citizenship, in a state that may not be safe but is deemed "safe enough" for transfer.

  **The Clearinghouse: "Managed Allocation"**
  The clearinghouse proposal is fundamentally different because it aims to *satisfy* the duty, not extinguish it.
  *   **Principle:** It admits the duty is *collective* (based on GDP/population) rather than *relational* (based on arrival).
  *   **Mechanism:** It treats protection as a quota-based obligation, similar to carbon emissions or peacekeeping troops.
  *   **The Moral Shift:** It changes the duty from "Do not harm this person you hold" to "Ensure this person is protected somewhere."

  **The "Buying Out" Objection:**
  The critic who said, "A duty you can discharge by paying someone else... was never a duty owed to the person," is highlighting the difference between a **personal obligation** and a **social obligation**.
  *   *Personal:* If I promise to watch your child, I cannot pay a stranger to do it without your consent.
  *   *Social:* If we all agree to fund a fire department, I can pay my taxes and let the firefighters do the work.
  *   *The Clearinghouse:* It treats asylum as a social obligation (fire department). The current regime pretends it is a personal obligation (custody) but structures it so they never have to hold the child.
  *   **Verdict:** The clearinghouse is more honest. It admits the duty is about the *outcome* (safety), whereas the current regime fetishizes the *location* (border control).

  ### 3. Persecution vs. Basic Rights (The Climate Problem)
  This is where the theoretical foundation cracks.

  **Persecution (The Current Model)**
  *   **Logic:** Someone is doing something to you (agent-specific harm).
  *   **Solution:** Stop the agent or remove the victim from the agent's reach.
  *   **Temporariness:** If the regime changes or the war ends, the harm stops. Therefore, "going home" is a coherent goal. The duty is to bridge the gap until safety is restored.

  **Basic Rights Failure (Climate/Structural)**
  *   **Logic:** No one is necessarily "persecuting" you; the state simply lacks the capacity to secure life (drought, sea-level rise, state collapse).
  *   **Solution:** There is no "home" to return to. The habitability threshold has been crossed permanently.
  *   **Temporariness:** The assumption that protection is temporary becomes incoherent. If the duty is to secure basic rights, and the home state cannot do it, the host state must assume the role of the home state.
  *   **Implication:** This shifts the duty from **Asylum** (temporary shelter) to **Membership** (citizenship).
  *   **Conflict:** The clearinghouse model still assumes repatriation ("funding follows her home"). In a climate scenario, this is a category error. You cannot fund a submerged island to become habitable. This suggests the clearinghouse, like the current regime, is still built on the 1951 assumption that displacement is an aberration, not a permanent state.

  ### 4. Where the Practice is Underdetermined (The Core of Your Piece)
  This is the most critical section for your article. You are looking for the places where policy looks like technical necessity but is actually philosophical choice. The existing regime has not answered these questions; it has simply papered over them.

  **A. The Trigger of Duty (Presence vs. Need)**
  *   *The Ambiguity:* Does the duty arise because the state *can* help (capacity), because the state *caused* the harm (contribution to climate change/war), or because the state *encountered* the person (jurisdiction)?
  *   *The Underdetermination:* The law says jurisdiction (presence). Resettlement programs say need. Climate arguments say contribution.
  *   *The Choice:* By enforcing visa regimes and interdiction, states are actively *choosing* the "Presence" theory to minimize their liability. They could choose the "Need" theory (which would open borders to quotas) or the "Contribution" theory (which would assign liability based on carbon emissions or arms sales). The current policy is a choice to prioritize sovereignty over moral causality.

  **B. The Content of the Duty (Safety vs. Membership)**
  *   *The Ambiguity:* Is the state obligated to keep the person alive, or to integrate them into a political community?
  *   *The Underdetermination:* Non-refoulement only requires the former. Citizenship requires the latter.
  *   *The Choice:* Offshore processing and temporary protection statuses are philosophical choices to provide safety without membership. They treat humans as biological entities to be kept alive, not political agents who need a polis. The clearinghouse attempts to bridge this by saying "rights travel with her," but if the end goal is repatriation, it still denies permanent membership.

  **C. The Transferability of Obligation**
  *   *The Ambiguity:* Can a moral duty be commodified?
  *   *The Underdetermination:* We allow states to pay for peacekeeping troops rather than send their own. We allow states to pay foreign aid rather than host the poor. We do not allow individuals to pay others to serve their prison sentences.
  *   *The Choice:* Asylum sits in the middle. By rejecting the clearinghouse, states are implicitly arguing that asylum is more like prison (non-transferable personal duty) when it suits them (to keep people out), but more like aid (transferable) when it suits them (to send people to Rwanda or Nauru). The inconsistency reveals that the "principle" is secondary to the "outcome."

  ### Summary for your Readers
  To translate this for your audience:

  The world has built a system that says, "We have a duty to save you from drowning, but no duty to let you into the boat." To avoid the contradiction, we spend billions building walls so you never reach the boat. When we do let you in, we call it charity.

  The "Clearinghouse" proposal admits the truth: the duty is to ensure you are safe, not necessarily that *we* are the ones to do it. But it still clings to the fantasy that you will one day go home.

  The underdetermined truth is this: We have not decided if refugees are **guests** (who must leave when the trouble passes), **members** (who belong with us because they are here), or **creditors** (who are owed a debt because of harms we caused). Our policies shift between these three definitions whenever it becomes convenient. Your piece should expose that instability. The "puzzle" you sensed isn't a glitch; it's the design feature of a system that wants the moral credit of protection without the political cost of membership.
