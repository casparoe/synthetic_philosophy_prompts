      You raise a fascinating point that cuts right to the heart of liberal egalitarianism. The inconsistency you have noticed is not just a policy gap but reflects a deep philosophical compromise in how modern societies conceive of justice. To reconstruct the implicit theory behind our current practices, we have to look at how we distinguish between different kinds of advantage. The prevailing view assumes a sharp distinction between fungible assets and embodied social position. Financial inheritance is treated as external property, something separate from the person that can be redistributed without violating the core integrity of the family unit. In contrast, social capital—things like dinner table conversations, professional introductions, or the confidence to speak in certain settings—is viewed as internal to the process of parenting and personal development. The moral boundary of the family is drawn around the cultivation of the child's character and relationships. We accept that parents will pass on their values, habits, and connections because interfering with that would require an intrusive surveillance of private life that liberal democracies are unwilling to countenance. So the implicit theory is that money is a public matter subject to fairness norms, while socialization is a private liberty protected by rights to family autonomy.

      This presupposes a specific view of the nature of advantage, one that prioritizes measurable resource distribution over relational positioning. It assumes that if we level the financial playing field at the moment of death, we have done enough to secure equal opportunity, treating cash as the primary mechanism of unfair transmission. This is why estate taxes exist alongside public education. Public education is our collective attempt to standardize the development of human capital, giving every child a baseline of skills regardless of their parents' wealth. However, this creates a significant incoherence when held against the reality of social capital. If merit-based hiring is supposed to reward talent and effort, but access to those jobs is mediated by networks that are inherited rather than earned, then the meritocratic ideal is undermined. We justify public education by claiming it equalizes opportunity, yet we allow families to purchase advantages that render schooling secondary, such as living in exclusive districts or leveraging alumni networks. The system is coherent only if we believe that financial resources are the dominant driver of life outcomes, but if social capital is equally or more determinative, then our commitment to equal opportunity is partially performative. We are leveling the visible track while allowing some runners to start halfway down the field based on who their parents know.

      If we were to adopt a stricter luck-egalitarian view, the policy implications would be radical and likely uncomfortable for most people. Luck egalitarianism holds that inequalities resulting from brute luck, such as being born into a specific family, are unjust and should be neutralized. Since both financial wealth and social capital are matters of brute luck, a consistent application would require mitigating the transmission of both. This would go beyond estate taxes to include much heavier taxation on inter vivos gifts, strict limits on private schooling, and potentially even common boarding schools to ensure children are socialized in a uniform environment away from parental influence. It challenges the moral boundary of the family directly, suggesting that the right to raise children as one sees fit must be curtailed to ensure fair equality of opportunity. Most societies reject this because they value family liberty as highly as equality, recognizing that the intimate partiality of parents is a good in itself, even if it produces inequality. A luck-egalitarian policy would have to decide whether equality of opportunity is so paramount that it justifies disrupting the private sphere of family life, essentially treating children as wards of the state to a much greater degree than we currently do.

      On the other hand, a relational-equality view would focus less on neutralizing luck and more on preventing the formation of rigid hierarchies and social domination. This perspective argues that dynastic wealth and closed social networks are harmful because they create distinct classes that do not interact, leading to stigma and status anxiety. A policy built on this view might not try to eliminate all advantages but would aim to break down the barriers that allow elites to seal themselves off. This could mean abolishing legacy admissions, enforcing stricter anti-nepotism laws in hiring, and designing public spaces and institutions that force cross-class interaction. The goal here is not necessarily to ensure everyone starts at the exact same line, but to ensure that no group can cement their status across generations to the point where they become a separate caste. This approach respects family autonomy more than luck egalitarianism but demands more structural integration of society. It acknowledges that social capital is the problem but tries to solve it by making networks more porous rather than by forbidding parents from sharing their lives with their children.

      Ultimately, the inconsistency nags at you because it reveals that we do not actually believe in equal opportunity as an absolute principle. We believe in it only up to the point where it conflicts with family liberty. We accept that some inequality is the price of allowing parents to love their children partially and to share their lives with them. The current system of taxing estates while ignoring social capital is a pragmatic compromise that attempts to curb the most egregious forms of dynastic power without dismantling the family unit. To move toward a stricter view requires us to admit that true equal opportunity is incompatible with the family as we know it, or else we must shift our focus from equalizing starting points to managing the social consequences of inequality. Until we are willing to have that harder conversation about the limits of parental rights versus the demands of justice, we will remain stuck with a system that taxes the check but ignores the connection, maintaining the appearance of meritocracy while allowing the reality of aristocracy to persist through softer channels.

