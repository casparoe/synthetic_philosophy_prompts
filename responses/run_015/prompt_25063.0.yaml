answer: |-
  You must force students to personally endorse the agent-centered constraint before introducing the cost of that commitment, using a direct-threat scenario instead of the trolley problem to block intuitive escapes about mechanical causation.

  Begin the first ten minutes by securing their intuitive commitment to the constraint without mentioning consequences. Ask them simply whether it is permissible to execute an innocent prisoner if it serves no purpose other than satisfying a whim. They will unanimously say no. Do not move forward until they have articulated *why*—usually appealing to rights or the intrinsic wrongness of killing. This establishes the deontological baseline; if you start with the trade-off immediately, they will treat the constraint as negotiable rather than absolute.

  From minutes ten to twenty-five, introduce the "Hostage Ultimatum" scenario to carry the weight of the lesson. Present a case where a villain holds five hostages and tells the student: "You kill this one innocent prisoner here, or I will kill those five hostages." Avoid the standard trolley problem because its mechanical elements (switches, tracks, accidental death) allow students to distract themselves with distinctions about physical contact or causal chains rather than moral agency. The Hostage Ultimatum isolates the variable of *agency*: the five deaths are intentional acts by another person, contingent only on the student's refusal to commit an intentional act themselves. Once they refuse to kill the prisoner, reveal the consequence: the villain kills the five. Now the paradox is live: they have chosen a world with five murders over a world with one to avoid committing murder themselves.

  At minute twenty-five, head off the first misconception: "Those are totally different kinds of acts" (Doing vs. Allowing). Students will argue that the villain kills the five, not them. Interrupt this by asking, "If you had the power to stop him only by acting, and you chose not to, are you not responsible for the outcome?" Force them to admit that their commitment to the constraint requires accepting responsibility for the greater number of deaths. If you do not press this here, they will dismiss the paradox as a linguistic trick about causation rather than a conflict of values.

  From minutes thirty-five to forty-five, address the second misconception: "Just be a consequentialist then." Students will resolve the tension by abandoning deontology entirely. Head this off by asking them to swap perspectives: "Would you consent to be the prisoner sacrificed to save the five?" When they hesitate or say no, point out that they are still holding the agent-centered constraint personally even while rejecting it theoretically. This demonstrates that the paradox isn't solved by switching theories, but by acknowledging the conflict between personal integrity and overall outcome.

  Conclude at minute forty-five with one specific question to test understanding rather than unease: "If you refuse to kill the one, are you claiming the world is morally better with five murders than one, or just that *your* participation in murder is what matters?" A student who understands the paradox will identify the latter (agent-relative value), whereas a student who is merely uneasy will focus on the former (outcome value) or express confusion about the total count of wrongs.
