answer: |-
  (a) **Exam Question**

  Turing proposes educating a child-machine rather than programming an adult mind. (1) Distinguish three claims in Turing's proposal: engineering effort, initial blankness, cultural necessity. Which is most vulnerable to the objection that curriculum design shifts the programming burden? (2) Stipulating modern systems use vastly more data than a child hears: if internals remain opaque, does success in the Imitation Game demonstrate intelligence or mimicry? Explain why this matters for his argument.

  ***

  (b) **Model Answer**

  Turing's child-machine proposal is often read as a single prediction about training versus coding. However, it conflates three distinct claims. First (R1), an engineering claim: specifying an initial state plus a learning regime is less labour-intensive than hand-coding adult competence. Second (R2), a structural claim: the initial machine can be nearly content-free because adult ability is primarily the product of education, not innate structure. Third (R3), a cultural claim: intelligence requires immersion in a social environment; a single box cannot achieve adult-level cognition in isolation.

  The curriculum designer objection targets R2 most severely. If we cannot hand-code competence because we do not understand it, that knowledge must reside somewhere. If it resides in the training regime or data, the initial machine's blankness is illusory; the complexity has merely been displaced from the program to the curriculum. Turing might resist this by arguing that culture itself is not designed. If the machine learns from undirected interaction with a social world, the knowledge isn't 'programmed' by a designer but acquired through natural selection of behaviours. However, modern systems complicate this. We stipulate they train on vastly more text than a child hears. This data is curated, cleaned, and selected by engineers. Thus, in modern implementations, R2 collapses into R1: the 'blank' slate is actually a vessel for encoded human labour hidden in the dataset.

  This collapse informs the second question regarding opacity and the Imitation Game. Turing expects the teacher of a learning machine to be largely ignorant of its internals while predicting its behaviour. If the machine passes the Imitation Game, but its internals are opaque and its competence derives from undigested data rather than understood reasoning, has it demonstrated intelligence or mimicry?

  A superficial reading suggests Turing is fine with mimicry; the Imitation Game is behaviourist. If it walks like a duck, it is a duck. However, this misses Turing's deeper commitment to capacity. The child-machine proposal is not about producing a static oracle that mimics answers, but about building a system capable of learning *as we do*. If the opacity results from a learning process analogous to human development (R3), the mimicry objection loses force. The system isn't mimicking; it is growing. But if the opacity results from brute-force statistical correlation on massive datasets (the modern stipulation), the system mimics the output of intelligence without the underlying capacity to reason or adapt outside its training distribution.

  The distinction matters because Turing's argument rests on the possibility of machine *thinking*, not just machine *output*. If the child-machine proposal only secures R1 (engineering ease) while sacrificing R2 (blankness) and R3 (culture), then the Imitation Game confirms only that we have built a very good mimic. This would undermine Turing's claim that the question "Can machines think?" is meaningful. He needs the machine to possess the *capacity* for thought, evidenced by learning, not just the *performance* of thought, evidenced by static answers. Therefore, success in the Imitation Game demonstrates intelligence only if the opacity is a byproduct of genuine learning (R3), not merely a black box filled with pre-digested human culture. The move that settles this is distinguishing between opacity arising from complex growth versus opacity arising from compressed data. Without this, the child-machine proposal reduces to a trick of engineering labour, and the Imitation Game becomes a test of deception rather than cognition.

  ***

  (c) **Marking Scheme (25 Marks)**

  1.  **Distinguishing the Three Claims (5 marks)**
      *   *Required:* Clearly separates R1 (engineering labour), R2 (blankness/structure), and R3 (culture/context).
      *   *Common Error:* Conflating R1 and R2 as "training vs. coding" without separating the structural claim about innate content.

  2.  **Analysing the Curriculum Objection (5 marks)**
      *   *Required:* Identifies that knowledge must reside somewhere (data/regime) and argues which claim (R2) is most vulnerable to the "displaced programming" objection.
      *   *Common Error:* Claiming the objection refutes the whole proposal rather than targeting specific claims about blankness.

  3.  **Evaluating the Modern Stipulation (5 marks)**
      *   *Required:* Uses the stipulation (vastly more data) to argue that modern systems compromise R2/R3, turning education into curated data ingestion.
      *   *Common Error:* Ignoring the stipulation or treating modern Deep Learning as a straight vindication of Turing without qualification.

  4.  **Connecting Opacity to the Imitation Game (5 marks)**
      *   *Required:* Links the teacher's ignorance of internals to the validity of the Imitation Game result (mimicry vs. intelligence).
      *   *Common Error:* Treating the Imitation Game as purely behaviourist without considering the *source* of the behaviour.

  5.  **Settling the Intelligence Question (5 marks)**
      *   *Required:* Argues that intelligence depends on *capacity* (learning process) not just *output*, distinguishing growth-opacity from data-opacity.
      *   *Common Error:* Settling by fiat (e.g., "Turing says it's intelligence so it is") rather than arguing through the distinction.

  ***

  (d) **Boundary and Cap Rules**

  *   **A/B Boundary Rule:** To score above 15/25 (B+), the answer must successfully distinguish at least two of the three claims (R1, R2, R3). Answers that treat the child-machine proposal as a monolithic "training vs. programming" claim cannot exceed 15 marks, regardless of fluency.
  *   **Cap Rule:** Any answer that treats modern Deep Learning as a straight vindication of Turing ("He predicted it, he was right") without addressing the curriculum designer objection or the opacity wrinkle is capped at 12/25 (C+). This prevents the "Turing predicted Deep Learning" essay that bypasses the philosophical nuance.
