answer: |-
  You are wrong. The difference is not trivial, and it is not just about tense. Your reasoning breaks down because you are assuming both sentences evaluate the connection between the "if" part and the "then" part using the same rules. They do not.

  Indicative conditionals ("If X, then Y") are typically **epistemic**: they reason based on what we *know* about the actual world.
  Counterfactual conditionals ("If X had been, Y would have been") are **metaphysical/causal**: they reason based on how the world *works* by imagining a change to reality.

  Here is one specific situation where they come out differently.

  **The Situation:**
  You walk into a room and see a match burning on the table. You know for a fact that there are only two ways this match could be lit: either someone struck it, or a specific laser beam hit it. In reality, someone struck the match, and the laser was turned off.

  **Sentence 1 (Indicative):** "If the match wasn't struck, it was heated by the laser."
  **Sentence 2 (Counterfactual):** "If the match hadn't been struck, it would have been heated by the laser."

  **My Commitment:**
  *   **Sentence 1 is TRUE.**
  *   **Sentence 2 is FALSE.**

  **Why:**
  **Sentence 1** is about your knowledge. You know the match is lit. You know only a strike or a laser could do it. Given those facts, if you accept the premise "it wasn't struck," your knowledge forces the conclusion "it was the laser." It is a deduction from what is actually the case.

  **Sentence 2** is about causality. It asks you to imagine a world where the strike never happened. In that closest possible world, the laser is *still* off (because nothing changed the laser's status). Therefore, in that world, the match does not light at all. It is false to say the laser would have heated it.

  Because one sentence is true and the other is false in the exact same situation, they cannot be making the same underlying claim. The difference is fundamental, not grammatical.
