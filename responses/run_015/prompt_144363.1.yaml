answer: |-
  You are right to locate the breakdown in our rubric at the junction of knowing how and knowing that, and while Ryle's distinction is the starting point, your intuition that a two-way split is insufficient for Year 10 mathematics is correct. We are not trying to certify philosophers but competent problem solvers, and for this purpose, transfer is the real test of knowing how, not the ability to explain. Explanation is a species of knowing that, a propositional account of action, whereas knowing how is the disposition to succeed when the conditions change. A student can recite the rules of chess without playing a winning game, and conversely, a grandmaster might struggle to articulate why a move was best while still making it reliably. If we gate progress on explanation, we reward verbal fluency over mathematical competence, and if we gate it solely on practiced performance, we reward rote mimicry. Transfer is the only check that proves the skill belongs to the student rather than the worksheet. The strongest counter-argument a tutor could make is that explanation ensures the knowledge is robust and not just a fragile trick, and that without being able to articulate the why, a student will collapse when the pressure rises. This is a serious concern, but it is better addressed by the transfer check itself than by demanding verbalization. If a student can execute the skill when the surface features change, when the numbers get ugly, and when the context is unfamiliar, they have demonstrated robustness regardless of whether they can narrate it. Demanding explanation as a gatekeeper privileges a specific learning style and risks failing students like Dev who have genuine intuitive competence. Therefore, the procedure prioritizes transfer over explanation, using explanation only as a diagnostic tool when transfer fails, not as a pass condition when transfer succeeds.

  The procedure for the final ten minutes of a session runs as a linear sequence of three checks, and the tutor must follow them in order without skipping ahead. The first check is autonomy, which is not a test given at the end but an observation of the preceding twenty minutes. If the tutor provided more than two prompts of substance, such as telling the student which operation to use or correcting a setup error before the student noticed it, the session ends immediately with a no sign-off. This is a hard stop because success carried by prompting is not independent skill. If the student was autonomous, the tutor moves to the second check, which is practiced performance. The tutor sets one problem identical in format and cueing to the work just practiced. If the student fails this, the session ends with a no sign-off because they do not yet have the basic procedure. If they pass, the tutor immediately moves to the third check, which is transfer. The tutor sets one problem where the surface features have changed, such as embedding the skill in a word problem, using fractions instead of integers, or removing the section heading that identifies the method. The student must solve this without help. If they fail this, the session ends with a no sign-off, regardless of their performance on the practiced problem. If they pass the transfer check, the tutor moves to the final proxy, which is error spotting. The student is handed a worked example containing a deliberate common mistake and asked to find and correct it. This is not a pass-fail gate but a confidence modifier. If they pass the transfer check but fail to spot the error, the tutor signs the card but adds a note for the teacher to review, as this suggests the understanding might be shallow. If they pass both transfer and error spotting, the tutor signs the card.

  There are two specific points where the tutor must stop and hand the decision to the coordinator rather than making the call themselves. The first is when there is evidence of inconsistency between sessions. If the student's record shows they passed a transfer check in a previous session but fail one today, or vice versa, the tutor must not sign off and must not simply refuse. Instead, they must mark the card as inconsistent and hand it to the coordinator. This handles the hard case of the student who performs well on Tuesday and goes blank on Thursday, because a single session cannot resolve volatility in performance, and deciding how much inconsistency we are willing to tolerate is a policy question about risk, not an epistemological question about knowledge. The second hand-off point concerns formal accommodations. If a student requires extra time or a quiet room to perform according to their official accommodation plan, the peer-tutoring session cannot validate their skill because the environment does not match their legal requirements. In this case, the tutor must not sign off regardless of performance. They must record the performance data and hand the decision to the teacher, because validating a skill under non-standard conditions when the unit test will be under standard conditions is a judgment about fairness and validity that sits beyond the tutor's remit. These hand-off points are where we go past what the philosophy of knowledge settles. Epistemology tells us what knowledge is, but it does not tell us how much risk of failure the school is willing to accept or how to balance accommodation with standardization. Those are administrative decisions that require a person with authority to weigh the costs.

  Running this procedure on the three students you described yields clear verdicts based on the hierarchy of checks. For Aisha, the autonomy check is passed assuming she worked alone, but she fails the practiced performance check because she gets most of them wrong on paper despite being able to recite the steps. The procedure stops at the second check. She knows that the steps exist, but she does not know how to execute them. The verdict is a no sign-off. For Marcus, the autonomy check is passed, and he passes the practiced performance check by getting every question right on the practice sheet. However, he fails the transfer check when the move appears inside a word problem or with fractions. The procedure stops at the third check. He has rote competence but not transferable skill. The verdict is a no sign-off. For Dev, the autonomy check is passed, and he passes the practiced performance check. He also passes the transfer check across formats and sessions, provided the numbers are small wholes. He fails the error spotting check potentially, or perhaps passes it, but the critical data point is that he cannot explain any step. Under this procedure, explanation is not a gate, so his inability to verbalize does not stop the process. However, there is a limit condition. If the unit test requires large numbers or letters, Dev's specific limitation means he might fail the test despite passing the transfer check within his comfort zone. If the transfer problem set by the tutor includes the complexity limit he struggles with, he fails the transfer check and gets a no sign-off. If the tutor sets a transfer problem within his successful range, he passes. Assuming the tutor tests him within the scope of the unit so far, he passes the transfer check. The verdict is a sign-off, potentially with a note on the complexity limit.

  The department will almost certainly resist the verdict for Dev. Schools are institutionally biased toward explanation as proof of understanding, and a student who cannot justify their steps looks like a guesser to many teachers, even if their success rate is high. They will argue that without explanation, Dev cannot repair his own errors when he eventually meets a problem he cannot solve intuitively. I defend Dev's sign-off anyway because the goal of the unit test is to solve problems, not to justify them, and Dev has demonstrated the ability to solve them across formats. If we refuse Dev, we are prioritizing our comfort with his learning process over the evidence of his competence. We are saying that knowing how must look like knowing that to be valid, which contradicts the philosophical ground we started on. If Dev fails the unit test later, that is a failure of our transfer check to match the test's complexity, not a failure of Dev to know how. We should adjust our transfer problems to include letters and large numbers to ensure he is truly ready, but if he clears that bar, his silence should not disqualify him. To refuse him is to claim that mathematics is primarily a verbal activity, which it is not.

  This procedure is not infallible and will produce errors in both directions. You should expect false refusals when a student suffers from acute anxiety during the ten-minute check despite having the skill, or when the tutor sets a transfer problem that is unintentionally too difficult or ambiguous. You should expect false approvals when a student guesses correctly on the transfer problem or spots the error by luck rather than understanding, though the combination of transfer and error spotting reduces this probability significantly. I would estimate the error rate in one direction or the other to be around ten percent, which is comparable to the teacher's current spot-check rate but more systematic. There are kinds of skill to which this procedure should not be applied at all. It is unsuitable for pure memorization tasks, such as recalling multiplication tables or geometric formulas, where transfer is irrelevant and speed or accuracy alone is the metric. It is also unsuitable for open-ended investigative tasks where there is no single correct method to transfer. In those cases, the rubric must return to qualitative judgment. Finally, this procedure cannot settle the question of how much support a struggling student deserves before being turned away. Deciding whether a student who fails three times gets a fourth chance or is referred to the teacher is a question of resource allocation and pastoral care, not knowledge. The procedure tells you what they know today, not whether they should be allowed to try again tomorrow, and tutors must be careful not to confuse the diagnostic result with a final judgment on the student's potential.
