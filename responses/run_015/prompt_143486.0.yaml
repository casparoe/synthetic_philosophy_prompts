      *   **Constraints:**
          *   Not a caricature (grant empirical messiness, failed tragedies, varied taste).
          *   Do not concede that enjoying tragedy is irrational, parasitic, or a failure of empathy.
          *   Hold that intentional artistic frame is essential (without it, it's exploitation, not tragedy).
