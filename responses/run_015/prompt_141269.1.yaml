  Question 1: The standard story says psychoanalysis failed because of its claims, but you say it failed because of its practitioners; isn't that just moving the goalposts to save the things you like?
  Expected Answer: She will argue she is prescribing how fields ought to be run rather than describing historical behavior.
  Follow-up: If you are prescribing, why should we let the word science mean the prescribed thing rather than the thing we actually have?

  Question 2: If a community of astrologers pre-registered predictions and defunded failures just like physicists, your test says they are doing science even if their subject is magic.
  Expected Answer: She will say yes, and that they would have found out astrology is false within a generation, which is the point.
  Follow-up: Have you then changed the subject from is this a way of finding out about the world to is this community well run, and can well run be spelled out without sneaking the content back in?

  Question 3: Your test requires institutions and communities, so a solitary genius making a breakthrough scores zero until others show up.
  Expected Answer: She will accept that the paradigm cases of science can score zero or undefined at the time they are made.
  Follow-up: What is a criterion for, that cannot recognise them when it sees them?

  Question 4: You accept that your test can rank a subfield of physics below a part of psychology based on their institutional habits.
  Expected Answer: She will name a specific case where the test ranks a subfield of physics below a part of psychology.
  Follow-up: Is the difference really institutional or just a fact about how expensive and slow the evidence is in one field, and can a field be well run and still be stuck for a century for reasons that have nothing to do with its norms?

  Question 5: To count a failure you have to decide it was a failure, so measuring abandonment seems to require knowing which fields get things right beforehand.
  Expected Answer: She will reach for things like pre-registration and replication rates.
  Follow-up: On your own terms, did psychology become more scientific in the last fifteen years, and is scientific status something a professional body can raise by a vote?

  Question 6: Does the philosophy of science community pass your own test, or is demarcation theory exempt from the requirement to abandon claims?
  Expected Answer: She will say the test is a proposal about how fields ought to be run rather than an empirical claim.
  Follow-up: How do we then check it is not just a description of the fields she happens to admire?

  Question 7: Demarcation gets dragged into court cases about intelligent design and funding decisions, but your verdict is on communities rather than claims.
  Expected Answer: She will argue that if her criterion is really a verdict on which communities are trustworthy, it does have authority.
  Follow-up: Does it have any authority with a judge or a research council, and should it?

  Question 8: I work in software where we have blameless incident reviews and change practice after something breaks, so by your criteria my industry is a science.
  Expected Answer: She will say no, on the grounds that what we convert are failures of artefacts to do what we want rather than failures of claims about the world.
  Follow-up: If the institutional machinery is identical, why does the distinction between artefacts and the world matter for whether we are finding out anything true?

  Question 9: If a field abandons false claims quickly but replaces them with other false claims just as fast, your test counts that as scientific progress.
  Expected Answer: She will likely argue that rapid correction is the only access we have to truth.
  Follow-up: But if the churn is high and the convergence is low, are you valuing the motion of science over the arrival?

  Question 10: If a community agrees on a wrong method and institutionally punishes anyone who tries to break it, your test might certify them as scientific because no failures are registered.
  Expected Answer: She will likely argue that such a community would eventually fail to predict or control outcomes.
  Follow-up: But if the failure is centuries away, are you certifying the process or just betting on the eventual outcome?
