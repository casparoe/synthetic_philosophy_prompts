  When I return to old code, I read my own notes and recover the reasoning. Verdict:
  this is part of my extended cognition.


  Case 2: My IDE provides intelligent autocomplete drawn from the current codebase.
  I do not memorize the API surface; I rely on the tool to complete method names and
  signatures. Verdict: also part of my extended cognition.


  Case 3: Our team keeps a deployment runbook that I follow step-by-step during outages.
  I execute the steps correctly but do not understand the underlying system behavior.
  Verdict: not part of my cognition; I am merely following an external procedure.


  Case 4: I use an AI pair-programming assistant that generates substantial blocks
  of code, which I typically accept with minimal review. Verdict: not part of my mind;
  it feels like outsourcing reasoning to an opaque agent.


  Case 5: Years ago I wrote a custom build script that now runs automatically in continuous
  integration, rejecting commits that fail certain checks. I rarely think about its
  logic. Verdict: ambiguous—it seems integrated into my workflow, yet I do not actively
  engage with it.


  The hard pair: Case 6 versus Case 7.

  Case 6: I regularly use a widely adopted open-source library. I understand its interface
  and behavior deeply, but I have never inspected its source code. Verdict: this belongs
  to my cognitive toolkit.

  Case 7: I authored the interface specification for an internal microservice, but
  another team implements and maintains the backend. I know my spec intimately, yet
  the implementation is opaque. Verdict: despite my authorship of the spec, this feels
  less like part of my mind than Case 6.


  My tentative principle is that a resource counts as part of my extended mind when
  I have direct, unmediated epistemic access to its outputs and can integrate them
  into my reasoning without deferring to another agent''s judgment. Case 6 versus
  Case 7 undermines this: in Case 7 I have more direct access to the specification,
  yet the resource feels more external. Meanwhile, Case 5 remains unclear.


