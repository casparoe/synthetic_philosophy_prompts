prompt: |-
  I sit on my country's church–state commission — we're the body that has to sign off on any new arrangement between the state and religious communities before it goes to parliament. We've never written down an actual rule, we just decide case by case, and I'm starting to think we're all over the place. Here's everything we've decided so far:

  - Yes to the state collecting a church tax through the payroll system for any registered religious community that clears 0.5% of taxpayers, as long as leaving is a one-line form at the town hall.
  - No to crucifixes in every public school classroom.
  - Yes to church-run hospitals and kindergartens getting public money on exactly the same terms as secular ones.
  - Yes to denominational religion classes in state schools, taught by teachers the religious community itself accredits, with a real ethics alternative, no pressure about which one you pick, and any registered community allowed to run one if enough parents ask.
  - No to a short opening reflection led by the mayor at the start of municipal council meetings, which councillors were expected to stand for.
  - Yes to a state-funded faculty of theology and religious studies at the public university, hiring on academic grounds only, nobody signing a confession.
  - Yes to individual teachers and pupils wearing visible religious symbols of their own, no to the school itself putting any up.

  Next month's case: the education ministry wants to put state-paid chaplains into every secondary school. The chaplains would be recruited and salaried by the state, any pupil could walk in and talk to them, and kids who don't want one get a secular counsellor instead. The catch is that only the four communities with "recognised" status from the old concordat — Catholic, Lutheran, Reformed, Jewish — can supply chaplains; the Muslim, Buddhist and humanist associations asked in and were told not yet. There's also talk of funding the whole thing through a per-pupil pastoral-care voucher that follows the kid instead of a block grant to the communities.

  So: what should we decide if we want to be consistent with ourselves, and which of our old decisions is the closest analogue — and how good is that analogy really? I can see at least three rules that fit all seven precedents fine: something like "OK as long as nobody is made to take part and there's a real way out", "the state may pay for the secular and social things religion does but must never speak religiously itself", and "OK whenever any worldview, religious or not, can get the same deal on equal terms". They definately don't all give the same answer here. Which one do you think we've actually been running, what does each predict about the chaplaincy proposal, does the voucher bit change anything, and what single tweak to the proposal — or what follow-up case — would flush out which rule we're on? And if our precedents genuinely don't decide it, I'd rather hear what principle we'd each be signing up to with the yes and with the no than just get a verdict.
reasoning: |-
  Here's a thinking process that leads to the suggested analysis:

  1.  **Analyze the User and Context:**
      *   **User Role:** Member of a country's church-state commission.
      *   **Task:** Evaluate a new proposal (state-paid school chaplains) based on seven past precedents.
      *   **Goal:** Determine consistency, identify the underlying principle(s), predict outcomes based on different interpretations, and suggest ways to clarify the commission's actual stance.
      *   **Tone:** Professional, analytical, legalistic but accessible, nuanced. The user is asking for help thinking through the logic, not just a "yes/no" verdict. They acknowledge the ambiguity ("we're all over the place").

  2.  **Analyze the Precedents (The "Case Law"):**
      *   *P1 (Church Tax):* **Yes.** State collects money for religions. *Conditions:* Threshold (0.5%), easy opt-out (one-line form). *Principle:* Support allowed if voluntary and administratively neutral.
      *   *P2 (Crucifixes in Classrooms):* **No.** State displays specific religious symbols in mandatory spaces. *Principle:* State neutrality in compulsory environments.
      *   *P3 (Church-run Social Services):* **Yes.** Public money for hospitals/kindergartens. *Condition:* Same terms as secular ones. *Principle:* Functional equality (religion treated as service provider).
      *   *P4 (Religion Classes):* **Yes.** Denominational classes in state schools. *Conditions:* State-accredited teachers (by religion), ethics alternative, no pressure, open to any registered community. *Principle:* Instruction allowed if pluralistic, optional, and state-supervised but content-controlled by religion.
      *   *P5 (Council Prayer):* **No.** Mayor-led reflection, expected to stand. *Principle:* No state-sponsored ritual in governance, especially if coercive (standing).
      *   *P6 (Theology Faculty):* **Yes.** State-funded. *Condition:* Academic hiring, no confession. *Principle:* Religion as an academic subject is okay; confessional hiring is not.
      *   *P7 (Religious Symbols):* **Yes** for individuals (teachers/pupils), **No** for institution. *Principle:* Individual expression okay, state endorsement not.

  3.  **Analyze the New Proposal (School Chaplains):**
      *   **Function:** Pastoral care/counseling in secondary schools.
      *   **Funding:** State-paid (salary).
      *   **Access:** Any pupil can walk in. Secular alternative available.
      *   **Restriction:** Only "recognised" communities (Catholic, Lutheran, Reformed, Jewish). Muslim, Buddhist, Humanist excluded ("not yet").
      *   **Mechanism:** Per-pupil voucher vs. block grant.

  4.  **Evaluate the Three Candidate Rules:**

      *   **Rule A: "Voluntarism & Exit" (OK as long as nobody is made to take part and there's a real way out).**
          *   *Fits Precedents:* P1 (opt-out tax), P4 (ethics alternative), P7 (individual choice). Explains P2 & P5 (compulsion/expectation to stand).
          *   *Prediction for Chaplains:* **Yes.** Pupils choose to walk in. Secular alternative exists.
          *   *Weakness:* Doesn't fully explain P6 (academic hiring) or P3 (equal terms). Doesn't address the *exclusion* of Muslims/Humanists.

      *   **Rule B: "Functional Secularism" (State may pay for secular/social things religion does but must never speak religiously itself).**
          *   *Fits Precedents:* P3 (social services), P6 (academic theology). Explains P2 & P5 (state speaking/endorsing).
          *   *Prediction for Chaplains:* **No/Conflict.** Chaplains inherently "speak religiously" or represent a confessional stance, unlike a hospital admin or an academic theologian. However, if viewed as "counseling" (social function), maybe Yes. But the confessional restriction hurts this.
          *   *Weakness:* P4 (Denominational classes) contradicts this. Religion *is* taught confessional-ly in schools.

      *   **Rule C: "Equal Access/Neutrality" (OK whenever any worldview, religious or not, can get the same deal on equal terms).**
          *   *Fits Precedents:* P3 (same terms as secular), P4 (any registered community), P6 (no confession hiring). Explains P1 (threshold applies to all).
          *   *Prediction for Chaplains:* **No.** The proposal explicitly excludes Muslims, Buddhists, Humanists. It privileges the "old concordat" four.
          *   *Weakness:* P1 has a threshold (0.5%), which isn't perfectly equal (small groups excluded). But generally, this fits the "open to any registered" vibe of P4.

  5.  **Synthesize the Commission's Actual Trajectory:**
      *   Looking at the mix, the Commission seems to lean towards a **"Cooperative Separation"** model.
      *   They allow state support *if* it facilitates individual freedom of conscience (P1, P4, P7) or provides public goods (P3, P6).
      *   They block state *endorsement* or *coercion* (P2, P5).
      *   *The Tension:* The strongest thread is **P4 (Religion Classes)**. It is the closest analogue.
          *   *Similarities:* State school setting, state-funded (teachers paid by state usually in this model), confessional content/providers, secular alternative required.
          *   *Differences:* Classes are academic/curricular; Chaplains are pastoral. Classes require "any registered community"; Chaplains restrict to "recognised" four.
      *   *The Dealbreaker:* The exclusion of Muslim/Humanist groups violates the spirit of P4 and P3. The "not yet" is the dangerous part.

  6.  **Address the Voucher System:**
      *   Does a per-pupil voucher make it more like P1 (Church Tax)?
      *   P1 is about *funding collection*. A voucher is about *service allocation*.
      *   If the voucher follows the child to a provider of *their* choice, it enhances voluntarism (Rule A).
      *   But if the *providers* are still restricted to the Four, the equality issue (Rule C) remains.
      *   Actually, a voucher might make it *more* constitutional under Rule A (individual choice), but highlights the discrimination under Rule C.

  7.  **Develop the "Test Cases" / Tweaks:**
      *   To flush out the rule:
          *   *Tweak 1:* Allow Humanist chaplains. If Commission says No, Rule C is out. If Yes, Rule C is in.
          *   *Tweak 2:* Make it mandatory orientation. If Commission says No, Rule A is confirmed.
          *   *Tweak 3:* Change hiring to state employees with no confessional requirement (like P6). If Commission says No, then the "confessional nature" is the key.

  8.  **Drafting the Response:**
      *   **Introduction:** Acknowledge the difficulty. The precedents are a "cooperative separation" model, not strict separation.
      *   **Analogue:** Identify P4 (Religion Classes) as the strongest match. Compare/contrast.
      *   **Rule Analysis:** Walk through the three rules provided by the user.
          *   Rule 1 (Voluntarism): Predicts Yes.
          *   Rule 2 (No State Speech): Predicts No (mostly).
          *   Rule 3 (Equality): Predicts No (due to exclusion).
      *   **The "Real" Rule:** Argue that the Commission operates on **"Facilitative Neutrality."** The state facilitates religious practice for individuals but doesn't endorse specific dogmas, *provided* access is open.
      *   **The Voucher:** Analyze its impact (shifts focus to individual choice, masks institutional exclusion).
      *   **The Decision:** Recommend a "Yes, but..." (Approve only if access is opened to all registered communities, mirroring P4).
      *   **Principles:** Articulate what a Yes vote means vs. a No vote in terms of political philosophy.

  9.  **Refining the Argument (Self-Correction during drafting):**
      *   *Correction:* Wait, P6 says "no signing a confession" for theology faculty. Chaplains *must* represent a confession. This distinguishes P6 from the Chaplain proposal. P6 is academic; Chaplains are pastoral. So P6 isn't a direct conflict, but it shows the state can hire religious experts if the role is academic.
      *   *Correction:* P1 (Church Tax) allows a threshold (0.5%). The Chaplain proposal excludes based on "Recognised Status" (Concordat), not a numerical threshold. This is a harder barrier. P4 says "any registered community... if enough parents ask." This suggests a numerical threshold is okay, but a *status* barrier might not be.
      *   *Key Insight:* The "Not Yet" for Muslims/Humanists is the biggest inconsistency with P4. P4 allows *any* registered community. The Chaplain plan creates a two-tier system (Recognised vs. Registered).
      *   *Recommendation:* The Commission should demand the "Recognised" restriction be dropped in favor of the P4 "Registered + Threshold" model.

  10. **Final Polish:** Ensure the tone is advisory and respectful of the user's position. Structure clearly with headings. (Proceed to generate output based on this thought process).

  **(Self-Correction Note on "State Speaking"):** Rule B says "State must never speak religiously." P4 contradicts this because the state pays for denominational classes. So Rule B is likely *not* the operating rule. I need to make sure I point out that P4 kills Rule B as a consistent theory.

  **(Self-Correction on Voucher):** A voucher system makes it look more like P1 (tax allocation) than P3 (block grant). It emphasizes individual choice. This strengthens Rule A.

  **(Final Plan):**
  1. Identify P4 as the "Controlling Precedent."
  2. Test the 3 Rules against the full dataset.
  3. Show where the Proposal fails the "Equality" test (Rule C) specifically regarding the "Recognised" status.
  4. Discuss the Voucher.
  5. Offer the "Tweak" to resolve ambiguity.
  6. Define the Principles at stake.cw
answer: |-
  This is a classic "case law" problem. You have a body of precedents that feel intuitive individually but lack a single written constitutional theory. Your intuition is correct: you are operating under a model of **"Cooperative Separation"** (sometimes called "benevolent neutrality"), rather than strict separation (like France) or state church (like England).

  Here is an analysis of your situation, the consistency of your precedents, and how to handle the chaplaincy proposal.

  ### 1. The Closest Analogue: Precedent #4 (Religion Classes)

  The strongest analogue to the school chaplaincy proposal is **Precedent #4 (Denominational Religion Classes)**.

  *   **Similarities:** Both take place in state secondary schools; both are state-funded (teachers/chaplains salaried by state); both are confessional (provided by religious communities); both require a secular alternative (Ethics/Counsellor); both rely on voluntary participation (elective class/walking into chaplain's office).
  *   **Differences:** Classes are curricular/academic; chaplaincy is pastoral/care-based. Classes are open to *any* registered community; chaplaincy is restricted to the *four "recognised"* concordat communities.

  **Why this analogy matters:**
  If you follow Precedent #4 strictly, the chaplaincy program is structurally sound **except for the exclusion clause.** Precedent #4 established that the state can facilitate confessional support in schools *if* the door is open to all registered groups. The chaplaincy proposal creates a two-tier system (Recognised vs. Registered) that Precedent #4 explicitly tried to avoid by saying "any registered community allowed."

  ### 2. Stress-Testing Your Three Candidate Rules

  Let's run your three proposed rules against your seven past decisions to see which one actually governs your commission.

  **Rule A: "OK as long as nobody is made to take part and there's a real way out." (Voluntarism)**
  *   **Fits:** P1 (opt-out tax), P4 (ethics alternative), P5 (No to standing/expectation), P7 (individual symbols).
  *   **Strains:** P6 (Theology Faculty). Students don't "opt in" to the existence of the faculty; it's an institutional fact. P3 (Hospitals). Patients don't always choose the provider in an emergency.
  *   **Prediction for Chaplains:** **YES.** Pupils choose to walk in; secular counsellors exist. The "opt-out" is clear.
  *   **Verdict:** This is your *weakest* constraint. It explains your "No" votes (P2, P5) well, but it's too permissive for your "Yes" votes.

  **Rule B: "State may pay for secular/social things religion does but must never speak religiously itself." (Functional Secularism)**
  *   **Fits:** P3 (Hospitals), P6 (Academic Theology), P2 (No Crucifixes), P5 (No Mayor Prayer).
  *   **Strains:** **P4 (Religion Classes).** This is the dealbreaker. Denominational classes *are* the state facilitating religious speech/instruction. If this rule were active, P4 would have been a "No."
  *   **Prediction for Chaplains:** **NO.** Chaplains provide pastoral care, which is inherently confessional/religious, not purely social (like a hospital) or academic (like P6).
  *   **Verdict:** This rule is **false.** Your commission already rejected this when you approved denominational school classes.

  **Rule C: "OK whenever any worldview, religious or not, can get the same deal on equal terms." (Equality/Neutrality)**
  *   **Fits:** P3 (Same terms as secular), P4 (Any registered community), P6 (No confession for hiring), P7 (All symbols allowed).
  *   **Strains:** P1 (0.5% threshold). Small groups *don't* get the same deal as large ones. However, thresholds are usually accepted as administrative necessity, whereas status barriers are not.
  *   **Prediction for Chaplains:** **NO.** The proposal excludes Muslims, Buddhists, and Humanists based on "Recognised" status, not just numbers. This violates the "any registered community" standard of P4.
  *   **Verdict:** This is your **strongest operating principle**, specifically regarding access.

  ### 3. The Verdict on Consistency

  You are not running Rule B. You are running a hybrid of **Rule A (Voluntarism)** and **Rule C (Equality)**, with a heavy weighting toward Precedent #4.

  **The Inconsistency:**
  Your precedents suggest that if the state funds confessional actors in public spaces (P4), it must be open to all comers who meet objective criteria (registration + demand). The chaplaincy proposal fails Rule C because it relies on an old "Concordat" status rather than the "Registered + Threshold" model you use for taxes (P1) and classes (P4).

  **Does the Voucher Change Anything?**
  Yes, but not enough to save the proposal.
  *   **The Voucher Argument:** A per-pupil voucher shifts the model from "State funding institutions" (P3) to "State funding individual choice" (closer to P1). It strengthens Rule A (Voluntarism) because the money follows the child's conscience.
  *   **The Problem:** Even with a voucher, if the *marketplace of providers* is rigged (only 4 communities allowed), it violates Rule C. It's like giving everyone a school voucher but only allowing them to spend it at Catholic or Lutheran schools.

  ### 4. How to Flush Out the Rule (The Test Case)

  If you want to know definitively which principle the Commission holds, propose this **Single Tweak** to the Ministry:

  > **"Open the 'Recognised' list to any 'Registered' community that can demonstrate 5% pupil interest in a specific school."**

  *   **If the Ministry/Commission accepts this:** You are confirmed as **Rule C (Equality)** adherents. You care about access, not historical privilege.
  *   **If the Ministry/Commission rejects this:** You are actually operating on a **"Historical Accommodation"** rule (unwritten): *We support the traditional religions that built the state, and others get less.* This would mean your P4 precedent was an anomaly or is now being quietly walked back.

  **Alternative Follow-up Case:**
  If you approve the chaplains as-is, the next case to watch is a **Humanist request for a "Chaplain"** who offers existential counseling without theology.
  *   If you say **Yes**, you are Rule C.
  *   If you say **No** (because Humanism isn't a "religion"), you are Rule B (Functional Secularism) in disguise, despite P4.

  ### 5. Principles at Stake (If Precedents Don't Decide)

  If you feel the precedents are truly ambiguous and you must vote based on principle, here is what you are signing up to:

  **A Vote for YES (Approve as is):**
  *   **Principle:** *Historical Pragmatism.* You are prioritizing social cohesion with traditional partners over strict equality. You are acknowledging that the "Recognised" four have a different historical footprint than newer groups, and state resources should reflect that stability.
  *   **Risk:** You create a state-sponsored religious hierarchy. You signal to Muslim and Humanist minorities that their pastoral needs are secondary, potentially undermining the "no pressure" guarantee of P4.

  **A Vote for NO (Reject as is):**
  *   **Principle:** *Procedural Neutrality.* You are asserting that once the state enters the business of funding confessional care, it cannot pick winners based on old treaties. It must use neutral criteria (registration + demand).
  *   **Risk:** You may delay pastoral care for students who *do* belong to the four recognised communities. You might be accused of letting perfect be the enemy of the good.

  ### Recommendation

  To remain consistent with your own "case law" (specifically Precedent #4):

  **Decision:** **Conditional Yes.**
  Approve the chaplaincy program **only if** the "Recognised" restriction is replaced with the Precedent #4 standard: *Any registered religious or worldview community may supply a chaplain if they meet a threshold of pupil interest.*

  This aligns with P1 (thresholds are okay), P4 (open access is required), and P7 (individual choice). It rejects the "Concordat Privilege" which has no support in your last seven decisions. If the Ministry refuses this tweak, you should vote **No**, because approving it would establish a new, unequal rule that contradicts your existing trajectory.
