      *   *Mill's Blind Spot:* Mill views speech as transactional (speaker $\to$ listener). He doesn't fully account for speech as *atmosphere* or *context*.
      *   *Ontological Issue:* To recognize this harm, one must accept "group dignity" or "social conditions" as real entities that can be damaged. Mill is a methodological individualist. He doesn't have a category for "damage to the social fabric" independent of specific individuals' tangible interests.

  5.  **Part 4: Assessing the Boundary (Stability vs. Collapse):**

      *   *Does the boundary hold?* If we stick strictly to Mill, the boundary holds: it's offense, not harm. Liberty wins.
      *   *Does it collapse?* If we acknowledge structural harm, the definition of "harm" expands to include "loss of equal standing in public space." This threatens Mill's narrow definition.
      *   *Mill's Limits:* Mill cannot resolve the tension between "freedom to speak" and "freedom to exist without terror in one's home town" because he lacks the vocabulary for *systemic* or *atmospheric* injury. He assumes a marketplace of ideas, not a minefield of trauma.

