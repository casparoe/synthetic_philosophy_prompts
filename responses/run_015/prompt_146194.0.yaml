  3.  **Part 2: Applying Mill's Framework:**

      *   *The Harm Principle:* Power can only be exercised over a member of a civilized community to prevent harm to others. Self-regarding actions are immune.
      *   *Harm vs. Offense:* Mill distinguishes between actual damage to interests (harm) and mere dislike/disgust (offense). Offense is generally not enough for restriction.
      *   *Application to Skokie:*
          *   Does wearing a swastika cause *harm*? Mill would likely classify emotional distress as "offense" unless it incites immediate violence (fighting words) or causes tangible damage.
          *   *Individualist Ontology:* Mill focuses on the individual. Even if 5,000 people are offended, is it $5,000 \times \text{offense}$ or a new category of harm? Mill tends to aggregate individual interests but remains skeptical of "collective feelings" overriding liberty.
