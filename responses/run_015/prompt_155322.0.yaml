      *   Constraint: $P(R \mid S) = 3/4 \implies P(R, S) = 3 P(B, S)$.
      *   MinEnt minimizes $\sum p_i \log(p_i / q_i)$.
      *   Solution form: $p_i = q_i \exp(\lambda f_i) / Z$.
      *   For this specific constraint, MinEnt yields: $P(R, S) = 3/8, P(B, S) = 1/8$. The HQ row remains untouched ($1/4, 1/4$).
