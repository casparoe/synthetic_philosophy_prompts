      *   *Justifies Rejecting Stake-Weighting:* The "Descriptive Snapshot" reading. If the goal is a microcosm *at the moment of selection* based on census data, weighting distorts the mirror.
      *   *Supports Stake-Weighting:* The "Experiential/Stake" reading. If the mirror needs to reflect *impact*, then those most impacted are under-represented in a flat lottery (often marginalized groups) and need boosting to be truly "mirrored" in terms of consequence.

