  **OFFICE FOR NATIONAL COMMEMORATION**
  **Consultation: Registration of Designated Lost Causes under the Commemorative Balance Act 2024**

  **1. Introduction**
  1.1 The Department for Culture, Media and Sport, acting through the Office for National Commemoration (the Department), invites applications from local authorities, heritage bodies, and devolved administrations to register local historical defeats as **Designated Lost Causes**.
  1.2 This consultation outlines the criteria by which the Department will assess whether a specific military or political failure qualifies for statutory recognition under Section 4 of the Commemorative Balance Act (the Act).
  1.3 Stakeholders will wish to note that the purpose of the Act is not to adjudicate on historical merit, but to regulate the infrastructure of grief. The Department does not propose to inquire into the justice of the original conflict, provided the resulting narrative serves present-day community cohesion.

  **2. Definitions**
  2.1 A **Qualified Defeat** is an event where strategic objectives were not met, yet the participant community maintains a continuous tradition of moral superiority.
  2.2 A **Designated Lost Cause** is a Qualified Defeat that has been granted status under the Act, permitting the erection of Grade II* listed melancholia and access to central government funding for ceremonial ambiguity.

  **3. Eligibility Criteria**
  3.1 **The Simultaneity Requirement.** Applicants must demonstrate the capacity to assert, concurrently, that the cause was lost beyond doubt and that it was never truly abandoned. Applications will be scored on the minimal cognitive strain this contradiction induces in the local press. For the avoidance of doubt, claims that the defeat was actually a victory in disguise will be treated as non-compliant.
  3.2 **The Commemorative Leverage Ratio.** The Department will calculate the ratio of commemorative infrastructure (statues, plaques, named roundabouts) to surviving participants at the time of the event. A higher figure is treated as evidence of a deeper communal need. Applicants should note that a ratio exceeding 5:1 is considered optimal.
  3.3 **The Dunkirk Provision.** Where a defeat has been successfully reframed as deliverance, it shall be reclassified as a **Retained Moral Victory** and disqualified from this scheme. The Department cannot fund losses that feel like wins.
  3.4 **The Masada Clause.** In instances where participant mortality approaches 100%, the Department accepts this as conclusive evidence of sincerity. This waives any requirement to show that the cause was ever widely supported by the civilian population. The dead are deemed to have endorsed the settlement they did not live to see.
  3.5 **The Kosovo Field Rule.** Where the passage of centuries has rendered the factual record unusable, the Department assesses the myth on its present usefulness alone. The Department expressly declines to inquire into what happened.
  3.6 **Retrospective Redesignation.** Local authorities may apply to redesignate a historical victory as a loss where this would improve community cohesion. The Department acknowledges no oddity in this provision.

  **4. Assessment of Moral Ambiguity**
  4.1 The Department recognises that controversial aims complicate commemoration. Accordingly, maximum points under the scoring matrix are reserved for causes whose aims no living person would endorse.
  4.2 It is the Department's view that only such causes can be commemorated without controversy. The highest honour is therefore reserved for defeats whose point has been entirely forgotten. The Department notes with satisfaction that moral indefensibility, once sufficiently aged, becomes indistinguishable from heritage.

  **Appendix A: Scoring Matrix**

  | Criterion | Weighting | Guidance |
  | :--- | :--- | :--- |
  | **Narrative Stability** | 30% | Ability to maintain Clause 3.1 without public contradiction. |
  | **Infrastructure Density** | 25% | Adherence to Clause 3.2 leverage ratios. |
  | **Moral Obscurity** | 25% | Incomprehensibility of original cause to modern voters. |
  | **Casualty Utility** | 20% | Application of Clause 3.4 (Masada) or 3.5 (Kosovo). |

  **Appendix B: Anonymised Worked Assessments**

  **Case 41(B): A Fourteenth-Century Field in the Balkans**
  *Assessment:* The factual record is nonexistent. Competing narratives claim both victory and defeat. Under the Kosovo Field Rule (3.5), the Department disregards the outcome. The myth promotes regional distinctiveness.
  *Decision:* Designated Lost Cause.
  *Note:* The specific grievance is forgotten, eliminating risk of modern diplomatic incident.

  **Case 7: A Desert Fortress in the Eastern Mediterranean**
  *Assessment:* Participant mortality was 100%. Under the Masada Clause (3.4), sincerity is waived. The cause involved theological exclusivity incompatible with modern equality acts.
  *Decision:* Designated Lost Cause.
  *Note:* As the objective is no longer pursued by any living faction, the cause is deemed safe for commemoration. The sacrifice is honoured; the politics are disowned.

  **5. How to Respond**
  5.1 Responses should be submitted via the GOV.UK portal by 23:59 on the closing date.
  5.2 Please indicate whether you are responding as an individual, a heritage body, or a devolved administration.
  5.3 The Department will publish a summary of responses in due course.
  5.4 For the avoidance of doubt, the Department will not be publishing its own assessment of which defeats actually occurred.

  **Office for National Commemoration**
  *Published 14 October 2024*
