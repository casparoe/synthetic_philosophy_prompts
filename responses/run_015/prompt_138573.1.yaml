answer: |-
  ### Desiderata for a Policy-Ready Therapy/Enhancement Distinction

  The following table specifies the conditions a theory must meet to underwrite a public coverage rule. The requirements are divided into structural constraints (what the distinction *is*) and functional constraints (what the distinction must *do*). I have flagged which are non-negotiable for the specific purpose of public administration and which are commitments of specific philosophical camps (e.g., naturalism vs. normativism) that you should treat with skepticism.

  | # | Desideratum | Motivating Cases & Rationale | Status |
  | :--- | :--- | :--- | :--- |
  | **1** | **Normative Reference Class Stability** | **Cases:** *Prevalence Inversion, Aging.*<br>**Rationale:** If a condition becomes statistically normal (e.g., presbyopia in the elderly, or a deficiency in 90% of a population), a purely statistical account reclassifies treatment as enhancement. A coverage rule cannot fluctuate with epidemiology. The theory must identify a reference class (e.g., species-typical functional design) that remains stable even when the deviation is common. | **Non-Negotiable** |
  | **2** | **Baseline Authority Rule** | **Cases:** *Set-Point Ratchet, Continuous Dimensions.*<br>**Rationale:** In ratchet cases, the intervention shifts the homeostatic set-point. Is the "therapeutic" baseline the pre-intervention individual, the current physiological state, or the species norm? A theory cannot be baseline-invariant; it must specify *which* history or standard is authoritative for defining "restoration." Without this, coverage decisions shift arbitrarily based on when the patient enters the system. | **Non-Negotiable** |
  | **3** | **Locus of Benefit Specification** | **Cases:** *Delegated-Benefit Interventions.*<br>**Rationale:** If a drug reduces a parent's irritability to benefit a child, is the parent being treated or enhanced? A coverage rule must decide if the patient must be the primary beneficiary. If the theory allows third-party benefit to count as therapy, it risks collapsing into general social utility; if it forbids it, it excludes valid public health measures. | **Camp Commitment** (Libertarian vs. Utilitarian) |
  | **4** | **Temporal Horizon of Effect** | **Cases:** *Second-Order Interventions, Prevention.*<br>**Rationale:** Vaccines and plasticity enhancers work by preventing future deficit or enabling future repair. A theory that requires immediate restoration of current function excludes prevention. The theory must specify how far into the future a benefit can be deferred while retaining the status of "therapy." | **Non-Negotiable** |
  | **5** | **Environmental Robustness** | **Cases:** *Environment-Relativity (ADHD/Schooling).*<br>**Rationale:** If a trait is only dysfunctional within a specific social structure (e.g., a long school day), treating it looks like modifying the person to fit the environment rather than restoring function. The theory must distinguish between internal physiological failure and poor environmental fit to avoid medicalizing social problems. | **Non-Negotiable** |
  | **6** | **Administrative Tractability** | **Cases:** *Gameability, Continuous Dimensions.*<br>**Rationale:** Clinicians must apply the rule without convening an ethics board for every prescription. If the distinction requires complex metaphysical judgments about "natural function" in borderline cases, it will be gamed or ignored. The criteria must be operationalizable via standard diagnostic codes or physiological markers. | **Non-Negotiable** |
  | **7** | **Type-Distinction (Non-Collapsibility)** | **Cases:** *Restoring vs. Improving.*<br>**Rationale:** As per your constraint, the theory cannot distinguish therapy from enhancement merely by the *magnitude* of benefit (e.g., "therapy gives +5 units, enhancement gives +10"). It must identify a qualitative difference in the *direction* of change relative to a norm (e.g., closing a gap vs. widening a lead). | **Non-Negotiable** |
  | **8** | **Value-Freedom (Descriptive Purity)** | **Cases:** *General Application.*<br>**Rationale:** The demand that clinicians apply the concept without engaging in moral contestation. | **Pseudo-Desideratum** (See Analysis) |

  ### Analysis of Tensions and Pseudo-Desiderata

  **The Value-Free vs. Justificatory Tension**
  You are correct to suspect that the demand for a **Value-Free** distinction (Desideratum 8) is a pseudo-desideratum when paired with the demand that the distinction do **Justificatory Work**. A coverage rule is inherently normative: it decides who gets what scarce resource. A purely descriptive biological fact (e.g., "this restores species-typical function") cannot generate a normative conclusion ("therefore this should be covered") without a bridging principle (e.g., "species-typical function is what justice requires").
  *   **Verdict:** If you insist the distinction itself be value-free, you push all the normative work into the bridging principle, rendering the distinction inert for *justification*. If you insist the distinction does the justificatory work, it must encode normative values (e.g., "opportunity," "well-being"). You cannot have both. **Desideratum 8 should be dropped** in favor of requiring *Explicit Normative Grounding*.

  **Baseline Invariance**
  You asked whether an adequate theory can be baseline-invariant. **It cannot.**
  *   **Reasoning:** The *Set-Point Ratchet* case proves this. If a patient's baseline shifts due to intervention, a theory that refuses to privilege one baseline over another (individual history vs. species norm) has no way to classify maintenance doses. Is the dose restoring the *new* normal (therapy) or maintaining an *artificial* high (enhancement)?
  *   **Requirement:** The theory must argue for one correct baseline. My assessment is that **Species-Typical Functional Organization** is the only candidate that avoids the *Prevalence Inversion* reductio, but it struggles with *Aging* (is senescence a function or a feature?). A theory must bite the bullet here: either aging is medicalized, or it is not. Invariance is a fantasy.

  **The Jointly Unsatisfiable Subset**
  The following three requirements form an inconsistent triad. You can satisfy any two, but not all three:
  1.  **Value-Freedom** (Desideratum 8).
  2.  **Normative Justificatory Power** (The distinction itself explains *why* we cover it).
  3.  **Non-Arbitrariness in Hard Cases** (Desiderata 1, 2, 5).

  *   **Naturalist accounts** keep (1) and (3) but fail (2): They tell you what is "normal" but not why justice requires covering it.
  *   **Welfarist accounts** keep (2) and (3) but fail (1): They justify coverage by benefit but collapse the therapy/enhancement distinction into magnitude of good.
  *   **Procedural accounts** keep (1) and (2) but fail (3): They rely on democratic decision-making to define the terms, which yields no stable principle for hard cases like *Aging* or *Ratchets*.

  **Which Requirement Excludes Attractive Theories?**
  **Desideratum 1 (Normative Reference Class Stability)** does the most work in excluding otherwise attractive theories. Purely statistical accounts (Boorse-style) fail here immediately because they cannot handle *Prevalence Inversion*. Purely individual-historical accounts fail here because they cannot handle the *Set-Point Ratchet* (if the individual's history includes the enhancement, is it now therapy?). Only a theory that posits a *normative* species-design (not just statistical) survives this, which rules out strict empiricism.

  ### Confidence and Reflection

  *   **Least Sure Desideratum:** **Desideratum 3 (Locus of Benefit Specification).** I am least confident that a public payer *must* exclude delegated benefits. In public health, herd immunity is a delegated benefit (my vaccine protects you). If a drug makes a caregiver less abusive, the state saves money on foster care. Excluding this might be too narrow for a *public* payer, even if it violates a strict clinical definition of therapy. If I were to drop a requirement, this is the one I would sacrifice to accommodate a broader social-determinants-of-health model.
  *   **Likely Failure Point:** My claim that **Baseline Invariance is impossible.** It is possible that a hybrid account could weight individual history and species norms dynamically. However, for *administrative* purposes (Desideratum 6), a dynamic weighting system is likely too complex to be game-proof. I stand by the claim that for *policy*, a single authoritative baseline is required, even if philosophically messy.
  *   **Condition for Reordering:** If the **Second-Order Intervention** cases (plasticity enhancers) become the dominant mode of medicine (e.g., gene therapies that enable future cellular repair), **Desideratum 4 (Temporal Horizon)** becomes the primary constraint, potentially overriding **Desideratum 7 (Type-Distinction)**. If all medicine becomes preparatory, the restoration/improvement distinction may dissolve entirely, forcing a shift to a pure cost-benefit model.

  ### Theoretical Scorecard

  **Boorse-style Biostatistical Theory**
  Fails **Desideratum 1** (Prevalence Inversion) and **Desideratum 5** (Environmental Robustness). It treats common age-related decline as non-medical and cannot distinguish social mismatch from internal dysfunction without importing values.

  **Wakefield-style Harmful Dysfunction**
  Satisfies **Desideratum 7** (Type-Distinction) well but struggles with **Desideratum 4** (Prevention). Since prophylaxis occurs before dysfunction exists, it struggles to classify vaccines as therapy without ad hoc adjustments.

  **Daniels-style Normal Opportunity Range**
  Satisfies **Desideratum 2** (Baseline Authority) by tying function to opportunity, but fails **Desideratum 8** (Value-Freedom) openly. It collapses into a theory of justice rather than a biological distinction, which is honest but may lack administrative tractability.

  **Savulescu-style Welfarism**
  Fails **Desideratum 7** (Non-Collapsibility) by definition. It treats therapy and enhancement as morally equivalent if benefits are equal, rendering the distinction useless for a coverage rule that specifically excludes enhancement.

  **Eliminativist (Benefit/Cost Only)**
  Satisfies **Desideratum 6** (Tractability) by removing the philosophical bottleneck but violates the prompt's core constraint. It abandons the therapy/enhancement distinction entirely, solving the problem by dissolving it rather than solving it.
