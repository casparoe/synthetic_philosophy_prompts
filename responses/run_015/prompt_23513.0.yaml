answer: |-
  This is a fantastic question. You have hit on the single most important mathematical condition required for the Handicap Principle to work.

  Your intuition is logical: if something is hard to do, surely only strong animals can do it? But in evolutionary biology, "hard to do" isn't enough. The signal must be **unprofitable to fake.**

  If the cost were uniform (the same for everyone), the signaling system would collapse because low-quality males would evolve to "cheat." Here is exactly why the cost must differ based on quality, and what breaks if it doesn't.

  ### 1. The Goal: Evolutionary Profit, Not Just Survival
  In signaling theory, animals aren't trying to be honest; they are trying to maximize their reproductive success (fitness). A low-quality male doesn't care about "truth"; he cares about mating.

  If a low-quality male can grow a tail, survive, and get a mate, his genes will spread. For the signal to remain honest, it must be the case that **for a low-quality male, the cost of the signal outweighs the benefit of the mate.**

  ### 2. The Problem with Uniform Cost
  Let's imagine a scenario where the tail costs exactly **100 units of energy** for every male, regardless of quality.
  *   **Benefit of Mating:** Let's say mating is worth **150 units** of fitness.

  **High-Quality Male:**
  *   Has plenty of energy reserves.
  *   Cost (100) < Benefit (150).
  *   **Decision:** Grow the tail. It's worth it.

  **Low-Quality Male:**
  *   Has tight energy reserves.
  *   Cost (100) < Benefit (150).
  *   **Decision:** Grow the tail. It's *also* worth it.

  **The Result:** Both males grow the tail. The females see a tail on everyone, so the tail tells them nothing about quality. The signal has lost its information content. In game theory, this is called a **Pooling Equilibrium**. The signal fails.

  For the signal to work, we need a **Separating Equilibrium**, where only one type signals. To get that with a uniform cost, the cost would have to be higher than the benefit for the low-quality male (e.g., Cost = 200). But if the cost is 200, the High-Quality male might also decide it's not worth it (if 200 > 150).

  To have a zone where the High-Quality male says "Yes" and the Low-Quality male says "No," the math *must* look different for the two males.

  ### 3. The Solution: Differential Marginal Cost
  For the Handicap Principle to hold, the cost must be **condition-dependent**. The same physical tail must impose a *greater fitness penalty* on a low-quality male than on a high-quality male.

  Let's adjust the math to reflect biological reality:
  *   **Benefit of Mating:** 150 units (Same for everyone).
  *   **Cost for High-Quality:** 100 units (He is efficient, immune system is strong).
  *   **Cost for Low-Quality:** 180 units (He is inefficient, immune system is weak).

  **High-Quality Male:**
  *   Benefit (150) > Cost (100).
  *   **Decision:** Signal. (Net gain: +50).

  **Low-Quality Male:**
  *   Benefit (150) < Cost (180).
  *   **Decision:** Do not signal. (Net loss: -30).

  **The Result:** Only the high-quality male signals. The female sees the tail and knows, with high reliability, that the male is high quality. The signal is honest.

  ### 4. Why does the cost differ biologically?
  You asked what exactly is doing the work to make the cost different. It comes down to **trade-offs.**

  A peacock's tail isn't just an energy bill; it is a survival risk. It makes the bird slower and more visible to predators.
  *   **High-Quality Male:** He has superior genes for speed, vigilance, or immune function. The tail slows him down, but he is still fast enough to escape predators. The "cost" in terms of survival risk is low.
  *   **Low-Quality Male:** He is already slower or has a weaker immune system. Adding the same tail pushes him over the edge. He is now too slow to escape, or his immune system crashes because he diverted resources to the tail. For him, the "cost" is death or sterility.

  Therefore, the **marginal cost** of the signal is higher for the low-quality individual.

  ### 5. The "Single Crossing Property"
  Economists and biologists call this the **Single Crossing Property**. If you graph the cost of signaling against quality, the line for low-quality individuals must be steeper than the line for high-quality individuals.

  If the lines are parallel (uniform cost), they will either both be below the "benefit" line (everyone cheats) or both above it (no one signals). They must cross the benefit line at different points for the signal to separate the two groups.

  ### Summary
  If the cost were uniform, low-quality males would evolve to pay that cost because the reward (mating) is so high. The only thing that stops them from cheating is if the cost hurts them *more* than it hurts the high-quality males.

  The Handicap Principle doesn't rely on the signal being expensive in absolute terms; it relies on the signal being **relatively more expensive for the liar than for the truth-teller.** That differential is the engine that keeps the signal honest.
