  ### Predictable Failures and Fixes

  **1. Students treat M, I, U as variables.**
  *   *Failure:* A student writes "M + I = MI" or treats 'I' as the number 1 immediately.
  *   *Fix:* Circulate early. Correct syntax gently. "These are shapes, not numbers. You can count them, but you can't add them mathematically unless the Rule allows it."

  **2. Teams hide strings to hoard points.**
  *   *Failure:* A team derives MII but doesn't write it on the Ledger, trying to claim the Target bonus later.
  *   *Fix:* Enforce the Ledger Rule strictly. "If it's not on the Ledger, it doesn't exist for scoring." This ensures the public data needed for the "Outside View" is available to everyone.

  **3. Students guess "Impossible" to game the points.**
  *   *Failure:* A team submits a Certificate for MUI using the 'I' count property (which passes for MUI) claiming it proves impossibility.
  *   *Fix:* The Certificate Template requires "Does the Target have this property?" If they say "No" for MUI (1 'I'), they are factually wrong. Reject the Certificate. Apply the -5 penalty. This reinforces rigor.

  **4. Frustration over Target Gamma (MUI).**
  *   *Failure:* Teams get stuck trying to prove MUI impossible and run out of time.
  *   *Fix:* At Minute 55, intervene. "You've found a property that blocks MU. Check if it blocks MUI." When they see it doesn't, move immediately to the Twist. Don't let them stall on solving the unsolvable.

  ---

  ### Limitations of the Game

  **1. It does not teach how to *find* invariants.**
  *   *Honest Statement:* "This game shows you *that* invariants exist and *why* they are useful. It does not teach you the heuristic for discovering them. That comes from practice and pattern recognition, which is why we will do more exercises next week."

  **2. It simplifies 'Proof'.**
  *   *Honest Statement:* "Our Certificate is a specific kind of proof (proof by invariant). In computer science and philosophy, proofs can take many other forms. Don't assume all proofs look like this fill-in-the-blank sheet."

  **3. It implies the 'Outside' is always accessible.**
  *   *Honest Statement:* "In this game, you found the invariant in 15 minutes. In real formal systems (like arithmetic), there are truths that are true but cannot be proven from the outside within the system itself (Gödel). We jumped out successfully here; sometimes, there is no 'out' to jump to."
