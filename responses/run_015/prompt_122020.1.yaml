answer: |-
  Core mechanism: Teams compete to derive strings from a fixed axiom using four transformation rules, but the scoring system makes proving a target unreachable more valuable than endless derivation, forcing students to construct a property-based argument to win.

  ### Game Rules and Materials

  **The System (The "Inside"):**
  *   **Alphabet:** M, I, U
  *   **Axiom:** MI (This is the only string you start with).
  *   **Rules:**
      1.  If you have a string ending in **I**, you may add **U** at the end. (e.g., MI $\to$ MIU)
      2.  If you have **M** followed by anything (**x**), you may double the part after M. (e.g., MI $\to$ MII)
      3.  If you have **III** anywhere, you may replace it with **U**. (e.g., MIII $\to$ MU)
      4.  If you have **UU** anywhere, you may remove it. (e.g., MUU $\to$ M)

  **The Ledger:**
  *   A central whiteboard or shared digital sheet.
  *   Any team may write a new string on the Ledger if they can show the immediate parent string already on the Ledger and state which Rule was used.
  *   Duplicate strings are not accepted.

  **The Targets:**
  *   Displayed publicly. Teams may switch focus between targets at any time.
  *   **Target Alpha:** MII
  *   **Target Beta:** MU
  *   **Target Gamma:** MUI

  **Scoring:**
  *   **+1 Point:** Adding a valid *new* string to the Ledger.
  *   **+5 Points:** Deriving Target Alpha.
  *   **+20 Points:** Deriving Target Beta OR Target Gamma.
  *   **+20 Points:** Submitting a valid **Impossibility Certificate** for a Target (claiming it cannot be derived).
  *   **-5 Points:** Submitting an Impossibility Certificate that is rejected by the Facilitator.
  *   **0 Points:** Claiming a Target is impossible without a Certificate (this halts work on that target for the team).

  **Materials:**
  *   Whiteboard (The Ledger) + markers.
  *   Team Worksheet (Blank space for scratch derivations).
  *   **Impossibility Certificate Template** (see below).
  *   Scoreboard.

  ---

  ### Minute-by-Minute Timeline

  **00–05: Setup**
  *   Divide 22 students into 6 teams (3–4 students each).
  *   Hand out worksheets. Write Axiom **MI** on the Ledger.
  *   Explain Rules 1–4 and Scoring. **Do not explain the targets yet.**
  *   **Constraint:** Do not use forbidden words (invariant, meta, proof, jump out). Use "Property," "About the game," "Certificate," "Step back."

  **05–20: Phase 1 (The Grind)**
  *   Reveal **Target Alpha (MII)**.
  *   Teams derive strings to earn +1 points and chase Alpha.
  *   *Expected:* Teams quickly find MI $\to$ MII. Alpha is claimed.
  *   *Facilitator:* Aggressively update the Ledger. Keep the energy high.

  **20–35: Phase 2 (The Wall)**
  *   Reveal **Target Beta (MU)**.
  *   Teams grind. The Ledger fills with strings like MII, MIIU, MIIII, MIIIIU, MUIU, etc.
  *   *Facilitator:* Reject any string not clearly derived from a Ledger parent. Keep the Ledger visible.
  *   *Observation:* Teams will notice they are generating many 'I's but cannot get rid of them to reach 0 'I's (MU). The +1 points slow down as strings get long and complex.

  **35–45: Phase 3 (The Certificate)**
  *   Hand out the **Impossibility Certificate Template**.
  *   Announce: "Deriving Beta is worth 20 points. Proving it cannot be done is also worth 20 points. Guessing costs 5 points."
  *   Teams stop grinding. They look at the Ledger. They count 'I's.
  *   *Facilitator:* If a team asks "Can we just say it's impossible?", reply: "Only with a completed Certificate."
  *   *Goal:* One team spots the 'I' count pattern and submits a Certificate for MU.

  **45–55: Phase 4 (The Limit)**
  *   Reveal **Target Gamma (MUI)**.
  *   Teams apply their successful MU Certificate to MUI.
  *   *Crisis:* The Certificate says MUI *should* be possible (1 'I' is not divisible by 3), but no one can derive it.
  *   Teams realize the Certificate is specific to MU, not a magic key for everything.
  *   *Facilitator:* Do not resolve this yet. Let the uncertainty sit.

  **55–65: The Twist**
  *   Announce: "System Update. Rule 3 is now: If you have **II** anywhere, you may replace it with **U**." (Change from III to II).
  *   Ask: "Does your MU Certificate still hold?"
  *   *Action:* Teams test the old Certificate against the new Rule. They see it breaks (II $\to$ U changes 'I' count by 2, breaking the mod 3 pattern).
  *   *Action:* A team quickly derives MU under new rules (MI $\to$ MII $\to$ MU).

  **65–80: Debrief**
  *   Map the experience to formal concepts (see Debrief section).
  *   Reveal forbidden words and define them.

  ---

  ### Targets and Answer Key

  | Target | Status | Resolution / Argument |
  | :--- | :--- | :--- |
  | **Alpha: MII** | **Derivable** | **MI $\to$ MII** (Rule 2). <br>*Purpose:* Warm-up to verify rule understanding and build Ledger momentum. |
  | **Beta: MU** | **Impossible** | **Property:** The number of 'I's is not divisible by 3. <br>**Axiom:** MI has 1 'I' (1 mod 3 $\neq$ 0). <br>**Rules:** <br>1. Adds 0 'I's. <br>2. Doubles 'I's (if $n \not\equiv 0$, then $2n \not\equiv 0$). <br>3. Removes 3 'I's (does not change mod 3). <br>4. Removes 0 'I's. <br>**Target:** MU has 0 'I's (0 mod 3 = 0). <br>*Purpose:* The core "jump out" moment. |
  | **Gamma: MUI** | **Impossible** | **Property:** The 'I' count property (not div by 3) **holds** for MUI (1 'I'). <br>**Reality:** MUI is still not derivable (requires deeper structural analysis of U generation). <br>*Purpose:* Shows the Certificate is *necessary* but not *sufficient*. The "Outside View" has limits. |

  ---

  ### Impossibility Certificate Template

  *(Hand this out at Minute 35)*

  **TEAM NAME:** ___________________
  **TARGET STRING:** ___________________

  **We claim this target CANNOT be derived.**

  **1. The Property:**
  Describe a feature of the strings that can be checked by looking at the string alone (e.g., "starts with M", "number of I's is odd").
  *Constraint: You cannot use "Is on the Ledger" or "Is Derivable" as the feature.*
  _________________________________________________________________________

  **2. The Start:**
  Does the Axiom (MI) have this property? [ YES / NO ]
  Show the value: _______________________________________________________

  **3. The Rules:**
  Do **ALL** four rules keep this property true? [ YES / NO ]
  Explain briefly for each rule (e.g., "Rule 1 adds a U, so the count of I's does not change"):
  *   Rule 1: __________________________________________________________________
  *   Rule 2: __________________________________________________________________
  *   Rule 3: __________________________________________________________________
