  ### Debrief Plan (Mapping Moments to Concepts)

  **1. Inside vs. Outside (The Ledger vs. The Certificate)**
  *   *Moment:* Minutes 20–35 (Grinding MU) vs. Minutes 35–45 (Finding the 'I' count).
  *   *Concept:* **Object Level vs. Meta Level.**
  *   *Script:* "When you were writing strings on the board, you were *inside* the system. You were tokens following rules. When you stopped writing and counted the 'I's across all the strings, you stepped *outside*. You were no longer playing the game; you were studying the game."
  *   *Reveal Word:* **Meta-system**.

  **2. The Certificate as Proof**
  *   *Moment:* Submitting the Certificate for MU.
  *   *Concept:* **Proof of Impossibility.**
  *   *Script:* "Inside the system, you can never be sure MU won't appear next. Outside the system, you can guarantee it never will. This is why we step out: to establish truths that are invisible from within."
  *   *Reveal Word:* **Proof**.

  **3. The Limit of the Certificate (Target Gamma)**
  *   *Moment:* Minute 50 (MUI Certificate failure).
  *   *Concept:* **Soundness vs. Completeness.**
  *   *Script:* "Your certificate worked for MU. It failed for MUI. The property you found was a *necessary* condition, but not a *sufficient* one. Just because the outside view says 'maybe' doesn't mean 'yes'."
  *   *Reveal Word:* **Invariant** (The property they found).

  **4. The Twist (Rule Change)**
  *   *Moment:* Minute 60 (Rule 3 alteration).
  *   *Concept:* **System Dependence.**
  *   *Script:* "Your outside truth broke when I changed one inside rule. Cognition works the same way. Your mental models (outside views) are only as good as the reality (inside rules) they model."
  *   *Reveal Word:* **Jumping out of the system**.

