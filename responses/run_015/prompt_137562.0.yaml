  A architecture built to feed the **want**,
  Low wood and gut define the physical **bass**,
  Not nature's scene, no mirror, no **copy**,
  We seek a place for tension to **resolve**,
  But sound escapes the net of every **word**.

  Silence is broken not by any **word**,
  But by the grinding of the primal **will**,
  Cadences promise briefly to **resolve**,
  Yet hunger grows to match the growing **want**,
  This sound is not a secondary **copy**,
  It is the gravity inside the **bass**.

  Stone and root and rumble of the **bass**,
  Objectified without a single **word**,
  It skips the phenomenon, stands alone as **copy**,
  Just striving shaped, the morphology of **will**,
  An endless ladder of deferred **want**,
  Where harmony refuses to **resolve**.

  Rules bind the air, pretending to **resolve**,
  Strict counterpoint locks in the wandering **bass**,
  This rigid form accommodates the **want**,
  Not rival to the concept or the **word**,
  But how the naked objectivity of **will**,
