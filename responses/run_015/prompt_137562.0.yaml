  We hear ourselves inside this loud **copy**,
  Melody climbs seeking to **resolve**,
  But down below persists the heavy **will**,
  While melody ascends, remains the **bass**,
  Sense is not a thing we find in **word**,
  But pressure meeting pressure, pure **want**.

  Even in silence, striving keeps its **want**,
  The only true and unmediated **copy**,
  There is no final punctuation **word**,
  No perfect cadence left to **resolve**,
  Only the vibration in the **bass**,
  The engine turning, turning, of the **will**.

  We **want** the peace that never can **resolve**,
  A faithful **copy** humming in the **bass**,
  Beyond the **word**, there only beats the **will**.

  ***

  The last line suggests that the music doesn't end the striving; it reveals the striving that continues underneath the silence.
