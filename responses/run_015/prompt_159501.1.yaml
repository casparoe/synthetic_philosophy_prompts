answer: |-
  **Case A: The Specific Motor Plan**
  Subjects sit in a standard Libet setup, instructed to flex their index finger whenever the urge strikes. The scalp-recorded readiness potential (RP) begins 800ms before movement, rising linearly until the EMG burst. In this scenario, the RP reflects a specific, unconscious motor program already encoding "index finger flex" at its onset; the conscious urge (W) is merely the threshold crossing of this specific plan into awareness. The specific motor content is fixed by the neural dynamics prior to W, making the conscious intention a readout of a decision already physically realized in the motor cortex, though volume conduction renders the scalp distribution indistinguishable from a general preparation.

  **Case B: The Non-Specific Gain**
  Subjects sit in an identical setup with identical instructions and produce identical data: RP onset at 800ms, W at 200ms, identical EMG and veto success rates. Here, the RP reflects a non-specific increase in motor cortical excitability (general readiness) without encoding *which* finger will move. The specific selection of the index finger occurs only at the moment of the conscious urge (W), which acts as a trigger that collapses the prepared potential into a specific motor command. The scalp distribution matches Case A because the spatial resolution of standard EEG cannot distinguish the latent specificity of the source, only the aggregate amplitude and timing.

  ***

  **The Counterfactual Tests**
  To separate these cases, we apply the same counterfactual query to both: *Had there been no conscious intention at the relevant moment (W), would that specific movement have occurred at that time?*

  *   **In Case A:** **Yes.** Because the specific motor plan was encoded in the RP prior to W, the physical chain was already set to produce the index flex. The absence of the conscious report would not have altered the motor output, only the subject's awareness of it. The intention is causally inert regarding *which* movement occurs.
  *   **In Case B:** **No.** Because the RP contained only general readiness, the specific motor command requires the conscious selection event at W to resolve the ambiguity. Without the intention, the system remains in a state of non-specific preparation, and the specific index flex does not occur. The intention is causally necessary for the *content* of the action.

  Both cases yield identical observation records (RP slope, W-time, EMG), yet they return opposite answers to the causal question.

  ***

  **The Three Readings**

  **(i) The Hard Reading (Unconscious Initiation)**
  *Verdict:* **Fits Case A, Falsified by Case B.**
  This reading claims the brain decides before consciousness, rendering intention epiphenomenal. It aligns perfectly with Case A, where the RP encodes the specific action. However, it cannot accommodate Case B without denying the possibility of the architecture described. If Case B is physically possible, the Hard Reading overgeneralizes from the timing data to a causal claim the data does not support.

  **(ii) The Veto Reading ("Free Won't")**
  *Verdict:* **Fits Both, Distinguishes Neither.**
  This reading locates freedom in the ability to abort an action after unconscious initiation but before execution. Since both Case A and Case B allow for a late veto (the subject can stop the finger before the EMG burst), this model treats the two cases as functionally identical regarding freedom. It fails to address the *authorship* of the action (which finger), focusing only on *suppression*. It cannot tell the cases apart because it ignores the causal status of the positive selection, caring only that the output can be blocked.

  **(iii) The Non-Specific Preparation Reading**
  *Verdict:* **Fits Case B, Falsified by Case A.**
  This reading claims the RP is merely an accumulation of noise or general arousal toward a threshold, carrying no content until the last moment. It aligns with Case B. However, like the Hard Reading, it treats a contingent feature of the data (the ambiguity of the scalp signal) as a necessary metaphysical truth. If Case A is the reality, this reading is false, yet the data looks the same.

  **The Worst Reading:** Your suspicion is correct. **(ii) The Veto Reading** comes out worst. It is the only reading that remains entirely unchanged across both cases. While (i) and (iii) take opposing stakes on the *content* of the RP, (ii) sidesteps the question of content entirely. By focusing solely on the abort mechanism, it renders the distinction between "unconscious selection" and "conscious selection" irrelevant to the definition of freedom. In a seminar designed to puncture the habit of conflating timing with causality, the Veto model is the most resistant to the lesson, as it accepts the timing data but refuses to engage with the causal ambiguity of the *selection* process.

  ***

  **Honest Note on the Construction**
  The single feature doing the work is the **latent informational specificity of the readiness potential**. The construction relies on the gap between *macroscopic observables* (scalp voltage amplitude and timing) and *microscopic functional content* (whether that voltage encodes "move" or "move left").

  If this feature is removed—for instance, if the experimenter is permitted a high-density EEG decoder or MEG capable of distinguishing specific finger representation at t-500ms—the pair collapses. If the decoder predicts the finger in Case A but fails in Case B, the observables are no longer identical. If the RP onsets are allowed to differ, the timing argument shifts, and the "W before M" constraint is violated.

  A defender of the worst-off reading (the Veto model) would attack the cases by arguing that the distinction is **metaphysically otiose**. They would claim that since the observable behavior (movement and veto capacity) is identical, the "causal necessity of intention" is an unscientific construct. They would argue that freedom is a property of the *control loop* (can I stop it?), not the *generative source* (did I start it?), and thus insist that since the veto works in both A and B, the cases are practically indistinguishable and the bet is void on pragmatic grounds.
