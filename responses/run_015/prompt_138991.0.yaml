  ### The Brainstorm

  Before settling, I need to clear the deck of the usual suspects. Here are five candidates that initially seem promising but falter under scrutiny:

  1.  **Mandatory Voting:** It fits the "civic duty" mold, but voting is already so institutionalized that the "moral fabric" argument feels too political, too close to the machinery of state rather than the pre-legal social order Devlin cares about.
  2.  **Unpaid Blood Donation:** (The Titmuss argument). Strong on the "market destroys gift" angle, but it's too economic. It leans heavily on efficiency and safety rather than the *moral cohesion* of the community in Devlin's thick sense.
  3.  **The Norm of Apology:** If the law mandates an apology, it's worthless. But "apology" is too interpersonal; it doesn't quite carry the weight of "social disintegration" that Devlin needs to get worked up about.
  4.  **Zoning and Hospitality:** Laws that ban extended families from sharing a single home (occupancy limits). This is strong, but it frames the issue as property rights vs. morality, which muddies the water on the "harm" principle.
  5.  **Whistleblowing vs. Loyalty:** A tension between civic duty and group solidarity. However, this usually involves tangible harm (corruption, danger), which gives Hart too much ground to stand on.

  ### The Selection: Mandatory Filial Care (The Legal Enforcement of Family Solidarity)

  The strongest candidate is **the state mandating adult children to financially support or physically care for their aging parents.**

  Many jurisdictions have "filial responsibility" laws, but let's treat this as a philosophical pressure point: imagine a society where this norm is decaying, and the state considers a robust legal mandate to restore it.

  **Why it fits the criteria:**

  *   **(a) The Devlin Condition (Social Fabric):** Devlin argues that society is a community of ideas, and the family is the primary transmitter of those ideas. If the norm of intergenerational care collapses—if children routinely abandon parents to the state—the "moral fabric" rots. It signals a shift from a society of mutual obligation to one of atomized individuals linked only by the state. The decay here really does threaten cohesion; it privatizes risk that was once shared by kinship networks, leaving the state as the sole safety net, which alters the fundamental character of the community.
  *   **(b) The Hart Condition (No Harm):** From a liberal perspective, an adult child is a sovereign agent. If they choose not to support their parent, and the parent has no contract with them, who is *harmed* in the sense Hart cares about? The parent is unfortunate, but not "wronged" by a stranger. The state might incur cost, but that's indirect. There is no direct, tangible injury to a third party that justifies criminalization or coercive civil penalty under the strict Harm Principle.
  *   **(c) The Coercion Paradox:** This is the crux. The *good* being protected is **filial piety**—a specific kind of loving, voluntary devotion. If the state mandates this care, it transforms an act of love into a tax liability. The parent knows the support is court-ordered; the child resents the legal compulsion. The relationship becomes transactional and adversarial. The very thing that makes the care socially valuable (that it is *given* freely out of bond) is destroyed by the legal duty. You cannot legislate the motive that gives the act its moral worth.

  ### Why the Standard Framework Fails

  **Devlin's Misclassification:**
  Devlin's framework assumes that if a practice is integral to the "moral fabric," it is *ipso facto* fit for legal enforcement. He conflates **social importance** with **legal enforceability**. He sees the decay of filial care as a "sin" society has a right to punish. But he fails to see that some moral goods are *constitutively voluntary*. By moving this norm from the sphere of *virtue* to the sphere of *law*, he doesn't save the fabric; he replaces a living bond with a dead letter. He treats morality as a monolith where everything important must be backed by the sheriff, not realizing that some moral structures collapse under the weight of legal coercion.

  **Hart's Blind Spot:**
  Hart's Harm Principle is too thin here. He would likely classify this as a private moral matter where the law should remain neutral. But he misses the **systemic social value** of the norm. It's not just about the individual liberty of the child or the individual suffering of the parent. It's about the existence of a *culture of care* that reduces reliance on the state and fosters intergenerational trust. Hart sees "no harm" because he looks for immediate, tangible injury. He fails to register the "harm" of **social atomization**—the slow erosion of the informal networks that make a society resilient. He treats the decay of the norm as morally indifferent, when it actually has profound collective consequences that aren't captured by individual rights violations.

  ### The Third Position: Facilitative Law

  To handle this, we need a position that sits between Devlin's **Enforcement** and Hart's **Neutrality**. Let's call it **Facilitative Republicanism**.

  This position acknowledges that the state has an interest in the *health of the norm* without claiming the right to *mandate the act*.

  1.  **Distinction between Duty and Virtue:** The law must recognize that some obligations are "imperfect duties"—morally binding but not legally enforceable. The state should affirm the norm publicly (through education, cultural recognition) without attaching penalties to its violation.
  2.  **Subsidy over Sanction:** Instead of punishing the child who *doesn't* care (Devlin), or ignoring the situation entirely (Hart), the state should *support* the child who *does*. Tax credits for caregivers, respite care services, and pension contributions for years spent caregiving.
  3.  **The Goal:** This preserves the voluntary nature of the act (keeping the "love" intact) while signaling that the state values and relies upon this practice for social cohesion. It shores up the moral fabric without turning the family into a branch of the bureaucracy.

  This approach respects Hart's concern for liberty (no one is forced), satisfies Devlin's concern for cohesion (the norm is actively bolstered), and solves the coercion paradox (the good is preserved because the motivation remains intrinsic, merely supported rather than supplanted by extrinsic threat). It treats the law not as a hammer to enforce morality, nor as a blindfold to ignore it, but as a trellis for it to grow.
