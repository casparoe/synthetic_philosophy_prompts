answer: |-
  You should reject **(3)**.

  Here is the breakdown of why it looked plausible, why it fails in this context, what it costs you to drop it, and why keeping (1) is the safer bet for the integrity of the theory.

  ### Why (3) Looked Plausible
  Step (3) is a **continuity principle**. It asserts that the evaluation function (Expected Value) is continuous with respect to the probability metric (Total Variation Distance). Intuitively, this captures the idea that "negligible risks should have negligible impact on value."

  This principle holds true for **bounded** utility functions. If payoffs are capped, changing the probability distribution by $\delta$ can change the expected value by at most $\delta \times (\text{max payoff} - \text{min payoff})$. As $\delta \to 0$, the change in EV vanishes. Since most ordinary decision problems involve bounded stakes (or effectively bounded stakes), (3) feels like a basic requirement of rational stability. It underwrites the intuition that we don't need to model the probability of a meteorite striking us mid-transaction to decide whether to buy a coffee.

  ### Why (3) Fails Here
  The failure is mathematical, not just normative. Step (3) assumes that probabilistic closeness implies evaluative closeness. This is only true if the utility function is integrable with respect to the probability measure.

  In your construction, $G$ has a finite first moment (EV exists). $G^*$ does not (EV is undefined). The "distance" between $G$ and $G^*$ in probability space is $\delta$ (small). But the "distance" between them in utility space is infinite (or undefined).

  By attaching a Pasadena tail, you have introduced a **singularity** into the utility function. In the presence of unbounded utilities (which are required for the Pasadena game to exist), the expectation operator is **discontinuous** with respect to probability measures. You cannot demand continuity of evaluation (3) while allowing unbounded payoffs that generate non-convergent series.

  If you keep (3), you are effectively demanding that the expectation operator be continuous everywhere. To satisfy that, you would have to ban the Pasadena game entirely (by bounding utility), which forces you to reject (1) by solving Pasadena via truncation or boundedness. Since you want to keep (1) (Pasadena EV is undefined), you must accept that the evaluation function has discontinuities. Therefore, (3) must be false as a universal claim.

  ### The Cost of Rejecting (3)
  You worried that dropping (3) hands over too much, specifically hurting dominance arguments and sure-thing reasoning. It does not, provided you are precise about what (3) is doing.

  **1. Dominance survives.**
  State-wise dominance does not rely on probabilistic continuity. It relies on ordinal comparisons of outcomes state-by-state.
  *   *Dominance:* If $G(s) \geq H(s)$ for all states $s$, choose $G$.
  *   *Step (3):* If $P_G \approx P_H$, then $EV(G) \approx EV(H)$.
  These are distinct. You can reject (3) without touching dominance. The Pasadena perturbation does not create a dominance relation between $G$ and $G^*$; $G^*$ has huge positive *and* huge negative payoffs in the tail branch. It does not dominate $G$, nor is it dominated by $G$. Rejecting (3) simply admits that two gambles can be probabilistically nearly identical but evaluatively incomparable.

  **2. The "Indistinguishability" Worry.**
  You wrote: *"from the agent's point of view the two are indistinguishable except in a corner she'll almost certainly never land in."*
  This conflates **empirical indistinguishability** with **structural indistinguishability**.
  *   *Empirically:* Yes, 99.9% of the time the agent sees the same outcome.
  *   *Structurally:* The agent is assumed to know the description of the gamble. If the description says "There is a $\delta$ chance of entering a Pasadena sub-game," the agent knows the mathematical structure contains a divergence.
  Decision theory evaluates the **prospect**, not the **likely experience**. If the prospect contains a singularity, the evaluation breaks, even if the singularity is rarely triggered. Rejecting (3) forces you to accept that rational choice is sensitive to the *description* of remote tails, not just their probability mass.

  **3. The Real Bullet: Fragility.**
  The actual cost of rejecting (3) is admitting that Expected Value theory is **fragile**. It means that EV theory is not robust to model misspecification in the tails. If you are using EV to evaluate a policy, and you miss a "Pasadena-sized" tail event (low prob, unbounded impact), your calculation goes from "defined" to "undefined" instantly.
  This is a known limitation of EV theory with unbounded utility. By rejecting (3), you are acknowledging that EV theory cannot handle "black swan" events that have infinite or undefined moments. You lose the guarantee that "approximating the probabilities approximates the value."

  ### Why Keep (1) Over (3)?
  If you have to choose between (1) and (3), keep **(1)**.

  *   **Keeping (1)** preserves the mathematical integrity of the expectation operator. It admits that the alternating harmonic series does not converge absolutely, and therefore the standard definition of expectation yields no value. This is a hard mathematical fact given the standard axioms of integration.
  *   **Keeping (3)** requires you to lie about the math. It requires you to say $G$ and $G^*$ have "similar" evaluations when one is a real number and the other is a divergent series. To make (3) work, you must redefine expectation (e.g., using weak expectations, principal values, or non-Archimedean fields). But you explicitly stated you want to treat the undefinedness of Pasadena as a fixed point.

  If you keep (3) and reject (1), you are claiming EV theory *does* have a verdict on Pasadena (e.g., "it's worth $\ln 2$"). This solves the contagion problem but requires you to adopt a non-standard decision theory (like Weak Expectation theory).

  If you keep (1) and reject (3), you keep standard EV theory but admit it has a **domain restriction**. The theory applies to $G$. It does not apply to $G^*$. The fact that $G^*$ is "close" to $G$ does not force the theory to apply to $G$, because the theory is not continuous at the boundary of its domain.

  ### Summary for the Group
  The argument is a *reductio* of the claim that "Expected Value theory is both universally applicable and continuous over probability measures for unbounded utilities."

  *   **Reject (3).** It conflates probabilistic distance with utility distance.
  *   **The Cost:** You must accept that EV theory is discontinuous. Small changes in probability can cause catastrophic changes in evaluative status (from defined to undefined) if utilities are unbounded.
  *   **The Gain:** You preserve the standard definition of Expectation (1) and avoid having to solve Pasadena via non-standard summation methods. You also preserve Dominance reasoning, which does not depend on (3).
  *   **The Takeaway:** EV theory is not a "complete" theory for all conceivable gambles; it is a partial function that breaks when the tails get too heavy, regardless of how thin they are. The "contagion" argument simply proves that the domain of EV theory is not closed under arbitrary probabilistic perturbations.
