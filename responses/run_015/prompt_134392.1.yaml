  1.  **Analyze the Request:**
      *   **Context:** A study group argument following a seminar on the *meta-problem of consciousness* (why we *think* there's a hard problem, not necessarily solving the hard problem itself).
      *   **Participants:** Jordan (defends Phenomenal Concept Strategy - PCS) vs. Riley (defends Introspective Framing/Frame-Relativity).
      *   **Task:** Walk through their exchange move-by-move, evaluate who is "right" (or stronger) at each step, and identify if there's a missing option (synthesis).
      *   **Tone:** Objective, philosophical, analytical, helpful for a study group.

  2.  **Deconstruct the Arguments:**

      *   **Jordan's Position:** Phenomenal Concept Strategy (PCS).
          *   *Core Claim:* The "hard problem" intuition arises because phenomenal concepts (concepts of experience) are direct, non-descriptive, and distinct from physical/functional concepts. When we try to map physical brain states to phenomenal concepts, there's an explanatory gap because the concepts themselves don't overlap.
          *   *Counter to Riley:* Framing is just the delivery mechanism for these concepts. If the concept lacks physical content, the frame doesn't matter.
          *   *Counter to Hypothetical:* Invoking "frame-neutral observers" is science fiction/biology that doesn't address the actual human philosophical problem.

      *   **Riley's Position:** Introspective Framing / Frame-Relativity.
          *   *Core Claim:* The "hard problem" intuition arises from the *mode of access* (introspection/first-person perspective). This mode structurally excludes physical descriptions (like trying to see the back of your head). It's about *how* we attend, not just the concepts we use.
          *   *Counter to Jordan:* PCS mistakes symptom for cause. The framing creates the conceptual separation.
          *   *Hypothetical:* A frame-neutral observer wouldn't feel the hard problem. This shows framing is the causal factor.
          *   *Defense of Hypothetical:* It's a conceptual coherence test, not a biological proposal. If changing the frame dissolves the intuition, framing is the key variable.

      *   **The Meta-Problem Context:** Chalmers' meta-problem asks: Why do we *say* consciousness is hard? Both are addressing this, not necessarily the ontological hard problem itself (though PCS often leans toward dissolving the ontological problem, while Framing might just explain the intuition).

  3.  **Step-by-Step Evaluation:**

      *   *Move 1 (Jordan's Opening):* PCS is the standard physicalist response. It's robust. *Verdict:* Strong standard view.
      *   *Move 2 (Riley's Rebuttal):* Distinguishes concept from access mode. Good distinction. *Verdict:* Plausible critique of PCS.
      *   *Move 3 (Jordan's Reply):* Subsumes framing under concepts. *Verdict:* Reductive but defensible.
      *   *Move 4 (Riley's Hypothetical):* Frame-neutral observer. *Verdict:* Strong thought experiment, but vulnerable to "irrelevance" charges.
      *   *Move 5 (Jordan's Pushback):* "Science-fiction biology." *Verdict:* Pragmatic objection, but misses the philosophical point of thought experiments.
      *   *Move 6 (Riley's Defense):* Conceptual coherence vs. biological swap. *Verdict:* Clarifies the methodological point.

  4.  **Identifying the "Missing Option" (Synthesis):**
      *   Are they actually talking past each other?
      *   *Concepts* require a *mode of presentation*. You can't have a phenomenal concept without a phenomenal mode of access (introspection).
      *   *Framing* generates the *concepts*. The way we frame our attention creates the specific conceptual category of "phenomenal state."
      *   *Level of Analysis:* Jordan is at the *semantic/conceptual* level. Riley is at the *cognitive/architectural* level.
      *   *Synthesis:* They are two sides of the same coin. The "Phenomenal Concept" is the *representational vehicle*, while "Introspective Framing" is the *process* that generates/deploys that vehicle. The meta-problem arises from the interaction of both.

