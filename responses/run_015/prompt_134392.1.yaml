answer: |-
  This is a sophisticated debate that cuts to the core of current physicalist responses to the meta-problem of consciousness (the problem of why we *think* consciousness is hard to explain, rather than the problem of explaining consciousness itself).

  Both Jordan and Riley are advocating for deflationary accounts—they both agree the "Hard Problem" is likely an illusion or a cognitive artifact—but they disagree on the *mechanism* of that illusion. Jordan is defending the **Phenomenal Concept Strategy (PCS)**, while Riley is defending a **Frame-Relativity or Cognitive Architecture** account.

  Here is a move-by-step breakdown of who holds the stronger dialectical position, followed by the synthesis you asked about.

  ### Round 1: The Opening Salvo
  *   **Jordan:** The intuition of a "gap" exists because phenomenal concepts are direct and non-descriptive, whereas physical concepts are structural/functional. They are different tools, so they don't seem to fit together.
  *   **Riley:** That describes the *symptom*, not the *cause*. The real cause is **introspective framing**. Turning attention inward forces a first-person mode that structurally excludes physical data.

  **Verdict: Riley takes the round.**
  **Why:** Jordan is stating the standard PCS position (associated with philosophers like David Papineau or Katalin Balog). It is a solid position, but Riley correctly identifies a vulnerability: PCS explains why the concepts *don't match*, but it doesn't fully explain why we are compelled to use *those specific concepts* in the first place. Riley's "mirror" analogy is strong here. If I look in a mirror, I see a face, not neurons. That isn't just because "face concept" $\neq$ "neuron concept"; it's because the optical setup (the frame) makes neurons invisible. Riley successfully argues that the *mode of access* might be prior to the *concept type*.

  ### Round 2: The Subsumption
  *   **Jordan:** Framing is just "phenomenal concepts with extra steps." If the concept lacks physical content, the frame is just the delivery mechanism. The concept is the real problem.
  *   **Riley:** (Skipped to hypothetical in your summary, but implied counter): The frame generates the concept.

  **Verdict: Jordan takes the round.**
  **Why:** Jordan makes a strong semantic point. You cannot have a "frame" without a "content" being framed. If the output of the introspective frame is a phenomenal concept, then ultimately, the *concept* is what creates the explanatory gap in reasoning. Riley risks an infinite regress: if framing creates the concept, what creates the frame? Jordan correctly anchors the problem in the representational vehicles (the concepts) we use to reason about the experience. Without the specific properties of the phenomenal concept (directness, opacity), the frame wouldn't produce the Hard Problem intuition.

  ### Round 3: The Thought Experiment
  *   **Riley:** Imagine a **frame-neutral observer**. A system that reports internal states without first-person framing or scientific framing. If this system doesn't generate the Hard Problem intuition, then framing is the causal variable.
  *   **Jordan:** That's science-fiction biology. You can't dissolve a real philosophical problem about *human* cognition by inventing imaginary creatures.

  **Verdict: Riley takes the round.**
  **Why:** Jordan makes a methodological error here. In philosophy of mind, conceptual coherence is often more valuable than biological plausibility (e.g., Philosophical Zombies are biologically impossible by definition, yet they drive the Hard Problem argument). Jordan's objection is pragmatic ("humans aren't like that"), but Riley's point is theoretical ("if the variable changes, the intuition disappears"). If a frame-neutral system is *conceptually coherent*, it proves that the Hard Problem intuition is contingent on the framing, not necessary on the existence of consciousness itself. Jordan's "science-fiction" dismissal weakens his position because the meta-problem is about the *logic* of our intuitions, not just our specific biology.

  ### Round 4: The Methodological Defense
  *   **Riley:** This isn't about swapping biology; it's about conceptual coherence. The framing account predicts that altering the frame dissolves the intuition. PCS just says "swap the concept," which is harder to isolate.
  *   **Jordan:** (No further reply in your summary, but presumably dug in).

  **Verdict: Draw / Slight edge to Riley.**
  **Why:** Riley clarifies that she is running a control variable test. She is isolating *framing* from *concept type*. If the intuition vanishes when the frame changes (even if the underlying state is the same), then framing is the active ingredient. Jordan is left defending the idea that the concept is immutable regardless of the frame, which is harder to sustain given that concepts are often sensitive to modes of presentation. However, Jordan could argue that a "frame-neutral" report *is* a physical concept, so Riley has just smuggled physical concepts back in. Because of this ambiguity, it's a draw, but Riley has successfully shifted the burden of proof to Jordan to show why framing *couldn't* alter the concept.

  ---

  ### The Missing Option: The Synthesis

  You asked if there is a missing option where framing and phenomenal concepts are the same thing at different levels. **Yes, there is.**

  Jordan and Riley are arguing over **Static Structure vs. Dynamic Process**.

  1.  **Jordan (Static Structure):** Focuses on the *representational vehicle*. A phenomenal concept is a specific type of mental file. It has specific properties (it quotes the experience, it is direct).
  2.  **Riley (Dynamic Process):** Focuses on the *computational operation*. Introspection is a process that samples information in a specific way (ignoring external physical data, focusing on internal utility).

  **The Synthesis: Phenomenal Concepts are the *Crystallized Output* of Introspective Framing.**

  They aren't competing explanations; they are descriptions of the same mechanism at different timescales.
  *   **Riley is right** that the *process* of introspection (the frame) filters out physical information. You cannot introspect a neuron firing *as* a neuron firing; you introspect it as a feeling.
  *   **Jordan is right** that once that process creates a mental file (a concept), that file retains the properties of the process. The concept *is* "framed" permanently.

  **The "User Interface" Theory (The Missing Option)**
  A strong middle ground is found in the work of philosophers like **Keith Frankish (Illusionism)** or cognitive scientists like **Donald Hoffman (Interface Theory)**.

  *   **The Argument:** The brain creates a "user interface" for internal monitoring.
  *   **The Frame:** The interface *must* hide the code (neural activity) to be usable by the organism (just like a desktop icon hides the binary code). This is Riley's framing.
  *   **The Concept:** The icons on the desktop (phenomenal concepts) *inherit* the property of hiding the code. When you try to explain the icon using the binary code, it feels like a gap. This is Jordan's conceptual gap.

  **Why this resolves the stalemate:**
  It validates Jordan's claim that the *concept* creates the gap (because the icon looks nothing like the code). But it validates Riley's claim that the *framing* is the cause (because the interface was designed to hide the code).

  ### Final Takeaway for Your Group

  If you want to mediate this:

  1.  **Tell Jordan:** He is right that the *explanatory gap* manifests semantically between concepts. But he is wrong to think concepts exist in a vacuum. They are generated by cognitive architecture.
  2.  **Tell Riley:** She is right that the *cognitive architecture* (framing) is the causal source. But she is wrong to think she can separate the frame from the concept entirely. The concept *is* the fossilized frame.
  3.  **The Verdict:** Riley has the stronger account of the **etiology** (where the problem comes from), but Jordan has the stronger account of the **phenomenology** (why the problem feels the way it does).

  **Suggested Reading to Bridge the Gap:**
  *   **Keith Frankish:** *The Illusion of Consciousness* (Argues the "frame" creates an illusion that generates the "concept").
  *   **Thomas Metzinger:** *The Ego Tunnel* (Discusses how the model of the self creates the framing that makes phenomenal concepts seem opaque).
  *   **Daniel Dennett:** *Quining Qualia* (Argues that the "properties" Jordan attributes to phenomenal concepts are actually artifacts of the framing Riley describes).

  The stalemate exists because they are describing the **software** (Riley) and the **file format** (Jordan) of the same system. Neither is wrong, but neither is seeing the whole computer.
