  2.  **Private Work (Three Lists per Camp):**
      *   *Goal:* Understand the steelman of each side to facilitate the agreement.

      *   **Camp A (Custodianship):**
          *   *Believes Camp B is committed to:* Moral arbitrariness based on date of birth; treating future people as mere containers for utility; believing money/tech can always substitute for lost ecological stability; ignoring rights/conditions in favor of sums.
          *   *Actually committed to:* Coherent aggregation over time is difficult/impossible due to incommensurability; duty is relational (trustee-beneficiary) not consequentialist summing; thresholds exist where substitution fails (critical natural capital); discounting pure time preference is ethically indefensible for existence-level stakes.
          *   *Would change mind if:* It could be shown that "option space" is perfectly substitutable by other capital (tech/social); if the "custody" metaphor leads to paralysis where no action is taken because perfect custody is impossible; if the Conditional Legacy Bond proves to effectively enforce custody without needing metaphysical rights claims.

      *   **Camp B (Discounted-Welfare):**
          *   *Believes Camp A is committed to:* Absolutist constraints that ignore cost; static view of future needs (assuming future people want what we want); refusal to acknowledge scarcity/trade-offs; mysticism about "nature" having intrinsic value separate from human welfare.
          *   *Actually committed to:* Welfare consequentialism; need for a common metric to make decisions under scarcity; discounting reflects uncertainty and growth (opportunity cost), not just pure time preference; thresholds are useful heuristics but not moral absolutes.
          *   *Would change mind if:* It could be shown that certain losses (option space) are irreversible and have infinite marginal utility loss (collapse); if the Non-Identity problem undermines the welfare aggregation basis (no one is harmed); if the Conditional Legacy Bond reveals that future welfare judgments diverge systematically from present discounted models.

      *   **Mediation Strategy:**
          *   Find overlap in *risk management*. Both care about avoiding catastrophe, even if for different reasons (A: breach of trust/collapse of option space; B: massive welfare loss).
          *   Use the *Climatic Option Space* definition to bridge the gap. A sees it as the object of duty; B sees it as a capital asset. Both agree it matters.
          *   Use the *Conditional Legacy Bond* to test the validity of A's thresholds without requiring B to accept them axiomatically.
          *   Use the *Three Cases* to isolate where discounting fails vs. where it works.

  3.  **Drafting the Document - Section by Section:**

      *   **I. Preamble:** Needs to be concise. Acknowledge the history of conflict, state the purpose (structured collaboration using the three stipulations), and clarify limits (not resolving all meta-ethics, but finding policy overlap).
      *   **II. Agreed Claims:** Need 8-12 substantive claims.
          1.  Climate policy affects future welfare/options.
          2.  Discounting pure time preference is ethically contentious (common ground: Ramsey equation components matter).
          3.  Irreversibility matters for both (A: custody broken; B: option value lost).
          4.  Non-Identity complicates harm-based claims for both.
          5.  Option Space is a valid metric for assessment.
          6.  Technology substitution is not guaranteed (uncertainty).
          7.  Growth rates matter more than levels for long-term welfare (B) and option space maintenance (A).
          8.  The Bond is a useful mechanism (agreement on function).
          9.  Catastrophic risk needs separate handling from standard discounting.
          10. Duty exists regardless of specific identity of future people.
          11. Compensation via other capital is limited in cases of irreversibility.
          12. Current generation bears decision burden under uncertainty.
      *   **III. Disagreements Table:**
          *   Issue: Nature of the Duty. A: Fiduciary/Constraint. B: Aggregative Consequentialism.
          *   Issue: Substitutability. A: Critical Natural Capital is non-substitutable. B: Substitutability is an empirical question, not moral.
          *   Issue: Discount Rate. A: Near zero pure time preference. B: Positive pure time preference justified by uncertainty/opportunity cost.
          *   Issue: The Bond. A: Creates/Recognizes Duty. B: Incentivizes/Measures.
          *   *Check:* Are these verbal or substantive? The duty nature is substantive. Substitutability is partly empirical/verbal (depends on definition of capital).
      *   **IV. Cruxes:**
          1.  *Irreversibility & Discounting:* Does crossing a threshold invalidate standard discounting? A: Yes (constraint triggered). B: Yes (option value becomes infinite/near-infinite). *Wait, need divergence.* Let's frame it: Does the welfare loss outweigh the cost of prevention *under standard discounting*? A predicts No (prevention required regardless). B predicts Yes (depends on calculation).
          2.  *Non-Identity:* Does it void the claim of harm? A predicts No (duty is to the position, not the person). B predicts Yes (no harm done if life worth living).
          3.  *The Bond's Verdict:* Will 2150 judge us harshly? A predicts Yes (we are squandering option space). B predicts No (they will be richer and care less about specific climate states).
      *   **V. Appendix (Verbal Disputes):**
          *   "Harm" vs "Wrongful": A uses wrongful as breach of duty; B uses harm as welfare reduction.
          *   "Capital": A distinguishes natural vs produced; B sees all as convertible capital.
      *   **VI. Advice to Finance Ministry:**
          *   Invest in abatement now despite uncertainty. Why? Because irreversibility risks dominate both welfare loss and custody breach. Discount rate disagreement matters less than risk management here.

  4.  **Refining and Polishing:**
      *   *Tone:* Professional, precise, neutral, authoritative but collaborative.
