answer: |-
  I. Joint Preamble

  This document records the outcome of a structured adversarial collaboration between the Custodianship camp (Camp A) and the Discounted-Welfare camp (Camp B) regarding intergenerational justice and climate change. We did not attempt to resolve the underlying meta-ethical disagreement about whether morality is fundamentally consequentialist or deontological, nor did we seek to prove one theory of value correct. Instead, we attempted to determine whether these divergent foundations yield convergent policy prescriptions when routed through three stipulated mechanisms: the definition of Climatic Option Space, the institution of a Conditional Legacy Bond, and the analysis of three specific evidential cases. Where we found agreement, we state it as a claim joint enough to bear weight; where we found disagreement, we isolate whether it is verbal or substantive and specify what evidence would settle it.

  II. Agreed Claims

  1.  **The Non-Identity Constraint:** A climate policy can be judged wrongful even if it results in a future population that enjoys lives worth living, provided the policy unnecessarily forecloses viable social trajectories available under alternative policies.
  2.  **Irreversibility Priority:** Risks involving irreversible climatic thresholds (such as multi-century sea-level commitments) must be evaluated separately from reversible damages, because standard aggregation methods underestimate the value of retaining the option to avoid permanent states.
  3.  **Option Space as Metric:** Climatic Option Space (the number of distinct, viable social trajectories open to a society given its inherited climate state) is a valid, measurable metric for assessing intergenerational transfers, regardless of whether one views it as a right or a capital asset.
  4.  **Uncertainty vs. Risk:** There is a distinction between risk (known probabilities) and uncertainty (unknown probabilities) regarding future abatement technology; under conditions of deep uncertainty regarding the Cheap Later case, delaying action imposes an uncompensated risk burden on successors.
  5.  **Growth Dominance:** For time horizons exceeding one century, the rate of economic growth inherited by future generations matters more for their aggregate welfare than the one-time level of consumption sacrificed today to secure that growth.
  6.  **Substitutability Limits:** While produced capital (technology, infrastructure) can substitute for natural capital (stable climate) in many domains, there is no empirical guarantee that this substitutability holds near climatic tipping points; therefore, assuming perfect substitutability is unjustified.
  7.  **Bond Utility:** The Conditional Legacy Bond (a financial instrument issued now, redeemed in 2150 based on successors' judgment of inherited option space) is a useful institutional mechanism for aligning present incentives with future judgments, regardless of whether it is viewed as creating or measuring duty.
  8.  **Catastrophe Handling:** The possibility of civilizational collapse or extinction cannot be adequately handled by simply adjusting the pure rate of time preference (the ethical weight given to time alone) in a standard discounting formula; it requires a separate risk premium or constraint.
  9.  **Identity Independence:** The duty to preserve climatic stability runs to future persons generally, not to specific identifiable individuals; therefore, changes in population size or identity caused by policy do not nullify the obligation.
  10. **Compensation Limits:** Losses to climatic option space cannot be fully compensated by bequests of other kinds of capital (financial, technological) if those losses prevent the future society from choosing its own political or agricultural arrangements.
  11. **Decision Burden:** In the face of disagreement about discount rates, the burden of proof lies on those advocating for higher emissions to demonstrate that the locked-in concentrations do not violate minimum option space thresholds.
  12. **Convergence on Collapse:** Both camps agree that avoiding civilizational collapse is a priority; Camp A views this as a condition of custody, and Camp B views this as a maximization of expected welfare, but both prescribe avoiding policies that make collapse probable.

  III. Disagreements Table

  | Issue | Camp A Formulation (Custodianship) | Camp B Formulation (Discounted-Welfare) | Substantive or Verbal? | What Would Settle It |
  | :--- | :--- | :--- | :--- | :--- |
  | **Source of Obligation** | The present generation holds the world in trust; violating option space thresholds is a breach of fiduciary duty regardless of welfare sums. | The present generation ought to maximize expected aggregate welfare; violating option space is only wrong if it reduces discounted welfare sums. | Substantive | A case where maximizing welfare requires breaching a custody threshold (e.g., enslaving a future generation to maximize their material output). |
  | **Substitutability** | Certain natural conditions are constitutive of human agency and are morally non-substitutable by technology. | Substitutability is an empirical matter of elasticity; if technology allows equal welfare with less option space, substitution is valid. | Substantive | Empirical data showing societies with high technology but low climatic option space maintaining stable political arrangements over centuries. |
  | **Discount Justification** | A pure rate of time preference greater than zero is ethically indefensible for existence-level stakes; future welfare counts equally. | A positive pure rate of time preference is justified by uncertainty of existence and opportunity cost of capital; future welfare counts less. | Substantive | Agreement on whether the Conditional Legacy Bond should be discounted at a risk-free rate or a market rate. |
  | **Bond Function** | The Bond creates and recognizes a pre-existing duty; the redemption value is a judgment on moral performance. | The Bond incentivizes prudent behavior and measures success; the redemption value is a performance metric for policy optimization. | Verbal | Clarification on whether the Bond imposes liability if redemption is low (A says yes, B says no, it's just data). |
  | **Harm Definition** | Harm includes the wrongful reduction of option space, even if the affected persons are content. | Harm requires a reduction in welfare relative to a baseline; contented persons cannot be harmed by option reduction. | Verbal | Agreement to use "Wrongful" for Camp A's concept and "Welfare-Reducing" for Camp B's concept to avoid confusion. |

  IV. Cruxes

  **Crux 1: The Cheap Later Case**
  *   **Sub-question:** Is it permissible to delay abatement if technology becomes ten times cheaper in 2060, even if delay locks in higher cumulative concentrations?
  *   **Case/Argument:** The Cheap Later case posits that waiting reduces present consumption costs but increases physical climate risk.
  *   **Camp A Prediction:** Delay is wrongful regardless of cost savings because it unilaterally reduces the Climatic Option Space inherited by the intermediate generation (2060–2150), violating the trust condition.
  *   **Camp B Prediction:** Delay is permissible if the discounted cost of abatement in 2060 is lower than today, provided the welfare loss from locked-in concentrations does not outweigh the savings.
  *   **Concession:** If the Conditional Legacy Bond is redeemed at a high cost (successors judge option space inadequate), Camp B will concede that market discount rates underestimated the welfare value of option space. Camp A will concede that if successors judge option space adequate despite delay, the custody duty was not breached.

  **Crux 2: The Non-Identity Case**
  *   **Sub-question:** Does a policy lose its moral force if it changes which particular people come to exist, provided those people have lives worth living?
  *   **Case/Argument:** The Non-Identity case suggests that if a harsh climate policy changes mating patterns such that different people are born, those people cannot claim they were harmed by the policy (as they wouldn't exist otherwise).
  *   **Camp A Prediction:** The policy remains wrongful if it reduces option space, because the duty is owed to the position of "future citizen," not the specific biological individual.
  *   **Camp B Prediction:** The policy cannot be wrongful on harm-based grounds, because no existing or future individual is worse off than they would otherwise be; justification must rely on impersonal welfare totals.
  *   **Concession:** If Camp B accepts that policy must be constrained even without specific harm victims, it moves toward Camp A's deontology. If Camp A accepts that non-identity voids the claim of injustice, it moves toward Camp B's consequentialism.

  **Crux 3: The Conditional Legacy Bond Verdict**
  *   **Sub-question:** How will the generation of 2150 judge the option space inherited from 2025?
  *   **Case/Argument:** The Bond stipulates that successors determine the redemption value based on their assessment of viable social trajectories.
  *   **Camp A Prediction:** Successors will judge the inheritance poorly (high redemption cost) because physical thresholds crossed today cannot be undone by their wealth.
  *   **Camp B Prediction:** Successors will judge the inheritance adequately (low redemption cost) because technological adaptation will expand option space despite climate changes, making physical constraints less binding.
  *   **Concession:** If successors judge the inheritance poorly, Camp B concedes that technological substitution was overestimated. If successors judge it adequately, Camp A concedes that the custody threshold was set too rigidly relative to actual human adaptability.

  V. Appendix: Verbal Disputes

  1.  **"Harm" vs. "Wrongful":** Camp A uses "harm" to describe a breach of duty (wrongful treatment), while Camp B uses "harm" to describe a reduction in welfare relative to a counterfactual. We agree this is verbal: Camp A refers to *normative violation*, Camp B refers to *welfare deficit*. Future documents should use "Wrongful" for A's claims and "Welfare-Reducing" for B's claims.
  2.  **"Capital":** Camp A distinguishes "Natural Capital" (climate stability) from "Produced Capital" (technology) based on function. Camp B views all capital as convertible based on price. We agree this is partly verbal: the dispute is not about the word "capital" but about the *elasticity of substitution* between the two. Where elasticity is zero, Camp B's definition functionally matches Camp A's.
  3.  **"Duty Creation":** Regarding the Conditional Legacy Bond, Camp A says it "creates" duty and Camp B says it "incentivizes." We agree this is verbal regarding the Bond itself: the Bond is a mechanism. The disagreement is about whether the duty existed *prior* to the Bond. The Bond's operation is identical regardless of this metaphysical label.

  VI. Joint Advice to a Finance Ministry

  We recommend that the Ministry treat the preservation of Climatic Option Space as a distinct budget line item separate from standard cost-benefit analysis, funded by current revenue rather than debt. Both camps agree that irreversible losses to option space carry risks (molecular breach of trust for Camp A, infinite welfare loss for Camp B) that standard discounting mechanisms fail to capture reliably. Therefore, despite our disagreement on whether this is a moral constraint or a welfare optimization, we jointly advise immediate investment in abatement sufficient to stay within known physical thresholds, because the cost of error (collapse) dominates the disagreement about the discount rate.
