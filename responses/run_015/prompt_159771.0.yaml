answer: |-
  This is a sophisticated historiographical problem, and the fact that you can feel the "smugness" in the founder's draft and the "stagnation" in the historian's draft means you are already halfway to solving it.

  The founder is writing **Whig History**: the idea that history is an inevitable march of progress toward the present (us).
  The historian is writing **Strict Contextualism**: the idea that the past is a foreign country and judging it by present standards is invalid.

  You are looking for a third way: **Contingent Adaptation.**

  The difference between "we got better" and "history was heading toward us" is the difference between *solving problems* and *fulfilling a destiny*. "Heading toward us" implies the current state was the goal all along. "Getting better" implies you encountered specific failures, learned specific lessons, and adapted. One is a prophecy; the other is a repair log.

  Here is how to navigate this at the level of narrative, structure, and individual sentences.

  ### 1. The Sentence-Level Surgery
  The founder wants to write: *"Finally, in 2003, we adopted GPS."*
  The word "Finally" is the liar. It implies the team was waiting in the dark for the light of GPS to arrive. It erases the reasons why they *didn't* have it before (cost, bulk, reliability) and implies the delay was a failure rather than a constraint.

  **Try this instead:**
  *   **Bad (Teleological):** "Eventually, the team modernized its navigation with GPS."
  *   **Bad (Relativist):** "In 2003, GPS became available, and the team used it."
  *   **Good (Contingent):** "By 2003, handheld GPS units had become durable enough for winter conditions. The team adopted them to reduce navigation time, accepting a new dependency on battery power."

  **Why this works:** It acknowledges the improvement (reduced time) without implying inevitability. It explicitly names the trade-off (battery dependency), which sets up the 2019 incident not as a "return to wisdom" but as a "materialization of a known risk."

  ### 2. Tackling Your Three Specific Problems

  **The Paper Map Rule**
  You asked: *Does it depend on whether our reason for bringing it back is the same as their reason for having it?*
  Yes. But the honest story isn't about the *rule*, it's about the *risk profile*.

  *   **Founder's Lie:** "We knew batteries would fail." (They didn't; they just didn't have batteries).
  *   **Historian's Lie:** "It was just a different preference." (No, it was a safety protocol).
  *   **The Truth:** "The original rule existed because there was no alternative. The rule was dropped when technology offered a net gain in speed. The rule was reinstated when a specific failure mode (2019 storm) demonstrated that the net gain had a ceiling."

  **Write it as a cycle of risk management, not a circle of wisdom.**
  *   *Sentence:* "The 2019 incident did not prove the founders right; it proved that redundancy is non-negotiable. The founders had redundancy by necessity; we now have it by policy."

  **Metrics vs. Culture (Progress vs. Change)**
  You want to call faster rescues "progress" and safeguarding "change." That distinction is valid, but not because one is moral and the other isn't. It's valid because one is **technical capability** and the other is **social contract**.

  *   **Technical Capability:** We are objectively better at finding people. This is cumulative. We stand on the shoulders of giants here. You can use words like "refined," "optimized," "increased capacity."
  *   **Social Contract:** We are different people. This is not cumulative; it's a shift in values. A drinking club fosters cohesion but excludes parents. Safeguarding protects vulnerable people but adds bureaucracy.
  *   **The Narrative:** "The team traded informality for inclusivity." Don't call it progress. Call it a *choice*.
  *   *Sentence:* "Where the early team relied on social cohesion to ensure turnout, the modern team relies on structured rota systems. This reduced burnout but required administrative overhead the founders never faced."

  **The 1998 Fight**
  You asked: *Is viewing them as tragic visionaries just the first version with the sign flipped?*
  Yes. If you call them "obstacles," you are saying the winners were right. If you call them "visionaries," you are saying the winners were wrong.

  **Treat it as a Fork in the Road.**
  The minutes record their speeches but not their reasons? *Infer the reasons from the context.* They wanted to stay informal. Why? Probably because they feared bureaucracy would kill the volunteer spirit. They were likely right about that! Bureaucracy *does* kill spirit. It just also saves lives/legal liability.

  *   *Sentence:* "The dissenting members argued that formalization would erode the volunteer ethos. In the following decade, retention rates did drop, suggesting their concern was valid, even as the formal agreement allowed for expanded operational scope."
  *   This honors their insight without claiming they should have won. It acknowledges the cost of the victory.

  ### 3. The Margin Boxes
  Your idea ("Things they knew that we've forgotten") is good, but be careful. If the main text says "We are advanced" and the boxes say "Actually they were smart too," the boxes become an apology for the main text.

  **Make the boxes "Trade-off Logs."**
  Instead of "Forgotten Wisdom," label them **"Operational Trade-offs."**
  *   *Box Content:* "1985: Navigation relied on contour interpretation. Speed: Slow. Risk: High in whiteout. Skill: High."
  *   *Box Content:* "2010: Navigation relied on GPS. Speed: Fast. Risk: High in battery failure. Skill: Low."

  This teaches recruits the lesson you want: **Every tool solves one problem and creates another.** That is a better lesson than "Old ways good" or "New ways good."

  ### 4. Your Position (The 2011 Joiner)
  Does writing yourself in wreck it? No, it anchors it.
  Whig history pretends the narrator is invisible and omniscient. By stating your position, you admit the narrative is constructed.

  *   *Intro Note:* "I joined in 2011, after the formalization and after the GPS shift. I am writing this with the benefit of knowing how the 2019 storm played out. I have tried to reconstruct the uncertainty the founders felt, but I cannot fully inhabit it."

  This disarms the historian member (you admit your bias) and satisfies the founder (you still tell the story of improvement).

  ### 5. Summary: The "Getting Better" Test
  To answer your core question: *Is there a way to write "we genuinely got better" without writing "the whole history was heading toward us"?*

  Yes. You do it by focusing on **capacity** rather than **destiny**.

  *   **Destiny:** "We evolved into a professional rescue organization." (Implies we were meant to be this).
  *   **Capacity:** "We accumulated the capacity to handle more complex call-outs." (Implies we built tools to handle specific pressures).

  **The Litmus Test for your Draft:**
  Read a paragraph. If you can remove the date and the paragraph still makes sense as a "step forward," it's Whig history.
  If the paragraph *requires* the specific context of the previous failure to make sense, it's Contingent Adaptation.

  *   *Whig:* "In 2004, we improved safety protocols." (Improved compared to what? Just "better"?)
  *   *Contingent:* "Following the 2004 accident, safety protocols were revised to address the specific failure of the anchor system."

  **Final Advice:**
  The recruits don't need to know that you are the pinnacle of evolution. They need to know that the team survives by recognizing when its tools stop working.
  *   The founders didn't have "proto-GPS." They had **maps and necessity**.
  *   You don't have "perfect safety." You have **protocols and hindsight**.

  Write the booklet not as a monument to how far you've come, but as a manual on how you decided to change. That honors the founders (they decided), satisfies the historian (contextual decisions), and teaches the recruits (decisions have consequences).
