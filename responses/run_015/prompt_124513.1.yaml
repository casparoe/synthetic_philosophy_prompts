answer: |-
  Here is a complete design for the 90-minute seminar. It is built around a physical implementation of **Dilation** (where conditioning widens probability intervals) and **MaxMin Expected Utility** (where randomization becomes optimal).

  ### 1. The Physical Setup (The "Rig")

  You need to create a situation where the *signal* is statistically independent of the *state of the world* (so it teaches you nothing about which "bag" you are in), but the *correlation* between signal and outcome depends entirely on which bag you are in.

  **Props Required:**
  *   **Two Opaque Cloth Bags** (labelled **Alpha** and **Beta**).
  *   **20 Index Cards** (or stiff paper).
  *   **Markers:** Red and Black.
  *   **Stickers:** Circle and Square (or draw them on the back).
  *   **One Coin** (for the randomization round).
  *   **Envelopes** for the "Policy Contract."
  *   **Payoff Tokens:** Chocolate squares or Raffle Tickets (1 Ticket = 1 Point).

  **The Card Configuration (Do this before class):**
  *   **Bag Alpha (10 cards):**
      *   6 Cards: **Red** on front, **Circle** on back.
      *   4 Cards: **Black** on front, **Square** on back.
      *   *Stats:* P(Red) = 0.6. P(Circle) = 0.6. If Circle, Red is certain (1.0).
  *   **Bag Beta (10 cards):**
      *   4 Cards: **Red** on front, **Square** on back.
      *   6 Cards: **Black** on front, **Circle** on back.
      *   *Stats:* P(Red) = 0.4. P(Circle) = 0.6. If Circle, Red is impossible (0.0).

  **The "Trust" Mechanism:**
  At the start of class, your helper counts the cards for Bag Alpha and Bag Beta in front of the students, places them in the respective bags, and seals them with a sticker. A coin is flipped to select *one* bag to be used for the game. The other bag is put away. **Crucially:** The students know the *contents* of both bags, but they do not know *which bag was selected*.

  ---

  ### 2. The Arithmetic (Why it Works)

  Show this on the board *after* the game, but keep it in mind for the design.

  **1. The Prior (Before Signal)**
  *   We don't know if we have Bag Alpha ($A$) or Bag Beta ($B$).
  *   Let $w$ be the probability we have Bag Alpha. Since we have no info, $w \in [0, 1]$.
  *   Probability of drawing **Red** ($R$):
      *   If $A$: $P(R) = 0.6$.
      *   If $B$: $P(R) = 0.4$.
      *   Total $P(R) = w(0.6) + (1-w)(0.4) = 0.4 + 0.2w$.
      *   Since $w \in [0, 1]$, **Prior Interval for Red is $[0.4, 0.6]$.**

  **2. The Signal (Conditioning)**
  *   We draw a card and look at the **back** (Signal). Suppose we see a **Circle** ($C$).
  *   Likelihood of Circle:
      *   If $A$: $P(C) = 0.6$.
      *   If $B$: $P(C) = 0.6$.
  *   Because the likelihood is identical, seeing a Circle gives **zero information** about whether we hold Bag Alpha or Beta. Your uncertainty about the bag ($w$) remains $[0, 1]$.
  *   Probability of **Red** given Circle ($R|C$):
      *   If $A$: $P(R|C) = 1.0$ (All Circles in Alpha are Red).
      *   If $B$: $P(R|C) = 0.0$ (All Circles in Beta are Black).
      *   Total $P(R|C) = w(1.0) + (1-w)(0.0) = w$.
      *   Since $w \in [0, 1]$, **Posterior Interval for Red is $[0, 1]$.**

  **Result:** The interval widened from $[0.4, 0.6]$ to $[0, 1]$. You are strictly more ignorant after seeing the signal.

  **3. Randomization (The Mix)**
  *   After seeing the signal, you must choose **Bet Red** (Win 10 if Red) or **Bet Black** (Win 10 if Black).
  *   **MaxMin Value (Pure):**
      *   Bet Red: Min payoff = $10 \times 0.0 = 0$.
      *   Bet Black: Min payoff = $10 \times 0.0 = 0$.
  *   **MaxMin Value (Mixed):**
      *   You ask the instructor to flip a coin. Heads = Bet Red, Tails = Bet Black.
      *   Probability of Winning = $0.5 \times P(Red) + 0.5 \times P(Black) = 0.5$.
      *   This probability is **0.5 regardless of $w$**. The ambiguity cancels out.
      *   Min payoff = $10 \times 0.5 = 5$.
  *   **Conclusion:** Randomizing (5) strictly dominates choosing (0).

  ---

  ### 3. Timeline & Procedure (90 Minutes)

  #### **0:00 – 0:15: Setup & Verification**
  *   **Intro:** Briefly state the goal: "Today we are testing how you make decisions when probabilities are ranges, not numbers."
  *   **The Rig:** Your helper counts and seals the bags. The coin select is done.
  *   **The Stakes:** Explain that points = chocolate/raffle.
  *   **The Task:** "We will draw one card from the selected bag. You will win points based on the Color (Red/Black) on the front. But first, we have to decide on the rules."

  #### **0:15 – 0:30: Policy Commitment (The Contract)**
  *   Hand out a slip of paper. Ask them to circle **one** decision policy they will abide by for the whole session. Use plain English:
      1.  **The Safety First Rule:** "I will always choose the option that guarantees the highest minimum payoff, no matter how unlikely the worst case is." (MaxMin)
      2.  **The Middle Ground Rule:** "I will always treat the probability range as its exact midpoint (e.g., 0.4–0.6 becomes 0.5) and maximize expected value." (Bayesian/Indifference)
      3.  **The Information Rule:** "I believe more information is always better. I will never pay to avoid seeing a signal."
  *   **Collect these.** Tell them: "This is a binding contract. If your actions later contradict this, you forfeit your bonus." (This creates the "Policy Cost" you requested).

  #### **0:30 – 0:45: The Information Decision**
  *   **Scenario:** "We are about to draw the card. I will look at the **back** (Signal) and tell you if it is a Circle or Square. You will then bet on the **front** (Color)."
  *   **The Twist:** "However, you have an option. You can pay **2 Tickets** right now to **burn the signal**. If you pay, I will draw the card, destroy it without looking, and you must bet based on the bag alone. If you don't pay, I will show you the Signal."
  *   **Action:** Have them write down "Pay" or "Don't Pay" based on their Policy Contract.
  *   **Prediction:**
      *   *Safety First* students should calculate: Prior MinEV = 4 (0.4 * 10). Posterior MinEV = 0 (0.0 * 10). They should **Pay** to avoid the signal.
      *   *Middle Ground* students calculate: Prior EV = 5. Posterior EV = 5. They should **Not Pay**.
      *   *Information Rule* students **Must Not Pay** (by contract).
  *   **Collect decisions.** Tally who paid. (Most won't, which sets up the regret).

  #### **0:45 – 1:00: The Reveal & The Choice**
  *   **The Reveal:** For those who didn't pay (the majority), draw the card. Show the **Signal** (e.g., Circle) to the class.
  *   **The Choice:** "Okay, you saw Circle. Now bet: Red or Black? Winner gets 10 Tickets."
  *   **Action:** They write their choice.
  *   **The Trap:**
      *   *Safety First* students who didn't pay (because they signed the Information Rule contract) now face the $[0, 1]$ interval. Their MinEV is 0. They are terrified.
      *   *Middle Ground* students are calm (EV = 5).
  *   **Reveal Outcome:** Turn the card over. (e.g., It is Black). Pay out the 10 Tickets to the Black bettors.
  *   **The Sting:** Ask the *Safety First* students: "You signed a contract saying you'd always take info. You just saw your guaranteed minimum payoff drop from 4 to 0. How does that feel?"

  #### **1:00 – 1:15: The Randomization Round**
  *   **Reset:** "We put the card back. We draw again. Same bag. Same ambiguity."
  *   **New Option:** "This time, you don't have to choose Red or Black. You can choose **The Coin Flip**. I will flip a coin. Heads I bet Red for you, Tails I bet Black for you."
  *   **Action:** They choose Red, Black, or Coin.
  *   **Math Check:** Ask a student to calculate the worst-case probability of winning with the Coin. (It's 0.5).
  *   **Result:** Most *Safety First* students should switch to the Coin.
  *   **Draw:** Reveal the card. Pay out. (Coin flippers get 10 points 50% of the time, but they *know* it's 50% regardless of the bag).

  #### **1:15 – 1:30: Debrief & Theory**
  *   Collect contracts. Compare what they signed vs. what they did.
  *   **Lecture (8 mins):** Connect the dots (see Debrief Script below).

  ---

  ### 4. Debrief Script (The "8 Minutes")

  Do not name-drop Ellsberg or Seidenfeld until the very end.

  1.  **The Widening Interval (Dilation):** "In the first round, before I showed you the Circle, your range for Red was 0.4 to 0.6. After I showed you the Circle, your range became 0 to 1. Why? Because the Signal told you nothing about *which bag* we were holding, but it made the Color *depend entirely* on which bag we were holding. You traded moderate ambiguity for extreme ambiguity. This is called **Dilation**."
  2.  **Negative Value of Information:** "Some of you wanted to pay me to *not* show you the Circle. In standard decision theory, free information is never bad. Here, it was bad. Why? Because your decision rule (Safety First/MaxMin) cares about the *worst case*. The signal made the worst case worse. You weren't paying for ignorance; you were paying to preserve your guarantee."
  3.  **Randomization:** "In the second round, choosing Red or Black was dangerous (MinEV = 0). But flipping a coin gave you a sharp 50% chance. Why? Because the ambiguity in the bag affected Red and Black in opposite directions. By mixing, you cancelled the ambiguity out. Randomization wasn't a tie-breaker; it was a hedge."
  4.  **Policy Commitment:** "Look at your contracts. The 'Information Rule' signers lost points because they committed to a rule that is only valid when probabilities are sharp numbers. When probabilities are sets, 'always take info' is not a dominant strategy. You didn't just choose an act; you chose a *policy*, and the environment punished that policy."

  **The Name Drop:** "This phenomenon is formalized in **MaxMin Expected Utility** (Gilboa & Schmeidler) and the specific widening effect is **Dilation** (Seidenfeld). It suggests that under deep uncertainty, ignorance can be an asset, and randomness can be a tool."

  ---

  ### 5. Troubleshooting & Objections

  **1. "This is just Second-Order Probability."**
  *   *Objection:* A student argues, "You just don't know the probability of the bag. Put a prior on that (e.g., 50% Alpha) and it collapses to a number."
  *   *Response:* "You can do that. That is the 'Middle Ground' policy you signed. But that is a *choice* to ignore the ambiguity, not a fact that the ambiguity doesn't exist. If you are unwilling to bet on the bag being Alpha vs Beta, you cannot collapse the number. The game forces you to reveal if you are willing to make that bet."

  **2. "Frequentist Inference."**
  *   *Objection:* "If we play this enough times, we can count the Circles and figure out the bag."
  *   *Response:* "Correct. Dilation relies on the sample size being too small to update the bag probability. In this game, $N=1$. If you want to run the experiment 100 times, I will need more chocolate. But in single-shot decisions (like climate policy or war), $N=1$."

  **3. "The Fix is In / Cheating."**
  *   *Objection:* "You chose the bag to make us lose."
  *   *Response:* "The helper sealed the bags in front of you. The coin flip was public. The math holds for *either* bag. If we had Bag Alpha, Circle means Red is certain. If Bag Beta, Circle means Black is certain. Since you don't know the bag, the ambiguity is genuine. I cannot cheat because I don't know the bag's effect until you see the signal, just like you."

  **4. "I'm Indifferent, so I flipped."**
  *   *Objection:* Students claim they randomized in Round 1 just because they didn't care.
  *   *Response:* Check their Policy Contract. If they signed "Safety First" and randomized in Round 1 (where MinEV was 4 for pure bets), they violated their contract. Use this to highlight the tension between intuition and committed rules.

  ---

  ### 6. Limitations (What to Admit)

  Be honest about what this activity *cannot* prove:
  1.  **It doesn't prove MaxMin is "Correct":** It only shows *if* you are MaxMin, *then* these results follow. A Bayesian who accepts the Principle of Insufficient Reason (assign 50% to Bag Alpha) sees no dilation and no value in ignorance. Both are defensible; the seminar shows the *consequences* of the ambiguity-averse view.
  2.  **It relies on the "Set of Priors" model:** It assumes students treat $[0.4, 0.6]$ as a set of probabilities, not a single distribution. You cannot prove this is the "right" way to think, only that it is a consistent way that leads to these results.
  3.  **Updating Rules:** There is more than one way to update sets of probabilities (e.g., Full Bayesian Updating vs. Maximum Likelihood). We used the one that produces Dilation. Other updating rules might not widen the interval.

  ### 7. Final Checklist for the Instructor

  *   [ ] **Cards:** Ensure the counts (6/4 split) are exact. If you mess up the counts, the Likelihoods won't match, and the Dilation fails.
  *   [ ] **Helper:** Brief them to be strictly neutral during the bag sealing.
  *   [ ] **Payoffs:** Ensure the "Safe" payoff (implicit in the MinEV calculation) is clear. In this design, the "Safe" payoff is the MinEV of the Prior (4 points). Make sure they understand that by looking, they risk dropping their guarantee to 0.
  *   [ ] **Contracts:** Keep the policy descriptions simple. Do not use terms like "Minimax" on the handout.

  This plan gives you the physical movement, the mathematical rigor, and the specific "gut punch" moments you requested, while keeping the arithmetic checkable on a whiteboard by a skeptical student.
