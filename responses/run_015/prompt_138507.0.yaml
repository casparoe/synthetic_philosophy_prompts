answer: |-
  This is a sharp diagnostic problem. You are trying to reverse-engineer the logical machinery of a specific interpreter of Gongsun Long, and you have enough data points to triangulate the position, but you need to distinguish between an **Intensional** reading (meanings/attributes differ) and an **Extensional** reading (extensions differ), and within the Extensional reading, between **Actual** and **Modal** variants.

  Here is the breakdown of the machinery, the prediction for the White Kingdom, and the evaluation of your probes.

  ### 1. The Three Competing Rules
  Based on her track record, her verdicts are consistent with three distinct logical rules. The problem is that all three yield the same result on the standard cases (*Bai Ma* dialogue, standard seeking test).

  *   **Rule A: Intensional Designation (The "Attributes" View).**
      *   *Mechanism:* The "not" is triggered when two terms designate different attributes or complexes of attributes. 'Horse' designates Shape. 'White Horse' designates Shape + Color. Since Shape ≠ Shape + Color, the terms are not identical, regardless of what objects happen to instantiate them.
      *   *Support:* Her reliance on "designates shape/color" and the Hard/White Stone parallel (sensory modalities pick out distinct universals).
  *   **Rule B: Modal Seeking (The "Possible Worlds" View).**
      *   *Mechanism:* The "not" is triggered if the extensions of the two terms *could* come apart. The Seeking Test is a test of modal divergence: "If one seeks a horse, yellow/black *may* be delivered." The possibility of divergence is sufficient for the "not," even if divergence doesn't actually occur.
      *   *Support:* Her use of the Seeking Test ("yellow and black horses *may* all be delivered").
  *   **Rule C: Actual Seeking (The "Inventory" View).**
      *   *Mechanism:* The "not" is triggered only if the extensions *actually* come apart in the current context. If asking for X and asking for Y yields the exact same set of deliverable objects right now, the "not" collapses.
      *   *Support:* A literalist reading of the Seeking Test ("If one seeks...").

  ### 2. Prediction: The White Kingdom (Contingent)
  **Verdict:** She will say **"A white horse is not a horse" still holds.**

  **Why:**
  Rule C (Actual Seeking) is the only one that would force her to collapse the distinction in your White Kingdom case. However, her track record suggests she is not running Rule C.
  1.  **The Hard/White Stone:** She insists this is the *same point* as the horse case. In the stone case, the separation is metaphysical/epistemological (touch vs. sight), not dependent on whether there happen to be hard white stones in the room. This points strongly to **Rule A (Intensional)**.
  2.  **The "Horse is not Horse" Rejection:** She rejects this because it lacks "two different names." This implies the "not" requires a difference in *description* or *concept*, not just a difference in objects. If she were a pure Extensionalist (Rule C), she might accept "Horse is not Horse" if she could find a context where the extension of 'Horse' differed from itself (impossible), or she would accept it purely on lexical difference. Her rejection suggests she requires a **difference in meaning/intension** licensed by **difference in names**.
  3.  **The Seeking Test as Heuristic:** For supervisors of this stripe, the Seeking Test is usually evidence of intensional difference, not the definition of it. The fact that yellow horses *can* satisfy 'horse' proves that 'horse' does not *mean* 'white horse'. The fact that they *don't* exist in the White Kingdom is an accidental feature of the kingdom, not a change in the names' designations.

  **Prediction:** She will argue that the *names* still designate different attributes (Shape vs. Shape+Color), so the proposition holds, even if the extension is identical. The coincidence of the extension is irrelevant to the logic of names.

  ### 3. Evaluating Your Probes

  You asked which probe separates which rules.

  #### Probe (i): Necessary Whiteness (Horses are essentially white)
  *   **The Case:** There are no brown horses, and there *could never* be brown horses (biologically/metaphysically impossible).
  *   **What it separates:** This separates **Rule A (Intensional)** from **Rule B (Modal Seeking)**.
      *   **Rule A (Intensional):** Verdict: **"Not a horse."** 'Horse' (Shape) and 'White Horse' (Shape+Color) have different definitions. The necessity of the instantiation doesn't change the meaning of the terms.
      *   **Rule B (Modal Seeking):** Verdict: **"Is a horse" (or the paradox collapses).** If it is impossible for a horse to be non-white, the extensions cannot come apart in any possible world. The Seeking Test fails to find a divergence even modally.
  *   **Assessment:** This is an **excellent probe**. It targets the modal force of her Seeking Test. If she says "Not a horse" here, she is a committed Intensionalist/Realist about attributes (like the Stone case). If she hesitates or says "Is a horse," she is a Modal Extensionalist who uses the Seeking Test as the primary criterion.

  #### Probe (ii): The Genus/Species Case (Is a horse not an animal?)
  *   **The Case:** Applying the logic to "Horse" vs. "Animal."
  *   **What it separates:** This separates **Rule A (Compound/Attribute)** from a potential **Rule D (Taxonomic Hierarchy)**.
      *   It does *not* effectively separate Intensional vs. Extensional rules in the way the White Kingdom case does. Both Rule A and Rule B would likely yield "Horse is not Animal" (Different meanings; Seeking an animal can yield a cow, seeking a horse cannot).
      *   **Utility:** This probe tests her "Two Names" constraint. She rejected "Horse is not Horse" because it was the *same* name. 'Horse' and 'Animal' are *different* names.
      *   **Risk:** She might reject "Horse is not Animal" not because of extension/intension, but because she views Genus/Species relations as fundamentally different from Modifier/Noun relations. (i.e., She might think "White" adds an attribute, but "Animal" is just the broader category).
  *   **Assessment:** This is a **secondary probe**. It helps map the boundaries of her "Two Names" rule, but it doesn't isolate the machinery driving the White Kingdom verdict as cleanly as Probe (i).

  ### 4. The "Killer" Probe (If you want to be sure)
  If you want to distinguish whether she cares about **Semantic Difference** or just **Lexical Difference**, use a **Synonym Case**.

  *   **The Case:** Imagine a kingdom where the word for "Horse" is *Ma*, and the word for "White Horse" is *Bai Ma*. Now, introduce a synonym for *Ma*, say *Equus*, defined stipulatively as "exactly what *Ma* designates."
  *   **The Question:** "Is *Equus* not *Ma*?"
  *   **The Logic:**
      *   **Two Names:** Yes (*Equus* ≠ *Ma*).
      *   **Same Intension:** Yes (by stipulation).
      *   **Same Extension:** Yes.
  *   **The Separation:**
      *   If she says **"Not Ma"**: She is running a **Syntactic Rule**. The paradox requires only two different tokens, regardless of meaning. (This would be a radical reading).
      *   If she says **"Is Ma"**: She is running a **Semantic Rule (Rule A)**. The paradox requires a difference in *designation* (Shape vs. Shape+Color), not just a difference in noise.
  *   **Why this matters:** Her rejection of "Horse is not Horse" could be interpreted as "Same Name" (Syntax) or "Same Meaning" (Semantics). The Synonym Case forces her to choose. Given her reliance on "Designates Shape/Color," she should say "Is Ma," confirming that **Semantic Intension** is the true engine, not just lexical variance.

  ### Summary Recommendation
  1.  **Expect her to say "Not a horse"** in the White Kingdom. Her machinery is Intensional (Rule A), grounded in the distinctness of attributes (Shape vs. Color), not the contingency of the inventory.
  2.  **Use Probe (i) (Necessary Whiteness).** It is the cleanest way to force a distinction between her reliance on the Seeking Test (Modal) vs. her reliance on Designation (Intensional). If she holds firm on "Not a horse" even when divergence is impossible, you have confirmed she is a Realist about Attributes (like the Stone).
  3.  **Probe (ii) is less diagnostic** for this specific question but worth keeping in reserve if you need to clarify the "Two Names" constraint.

  **One final warning:** Watch out for her move on the "Pointing" case. In the White Kingdom, if you point and ask "Is that a horse?" she will say "Yes." If you point and ask "Is that a white horse?" she will say "Yes." Be prepared for her to say: *"The objects are the same. The names are not. Your question asks about the names ('Is a white horse...'), not the objects ('Is that...'). Therefore, the names are not identical."* She will likely bifurcate the Ontological (objects) from the Semantic (names) to preserve the paradox even in the White Kingdom. Probe (i) is the only one that pressures that Semantic distinction.
