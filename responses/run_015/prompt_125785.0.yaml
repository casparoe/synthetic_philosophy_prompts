  **MEMORANDUM**

  **TO:** Holloway Writers Fund Grant Committee
  **FROM:** [Your Name]
  **DATE:** October 23, 2023
  **SUBJECT:** Recommendation Regarding Applicant R. Voss (Second-Book Poetry Grant)

  **Purpose**
  This memo outlines a course of action regarding the application of R. Voss ahead of Thursday's vote. Given the current split in the committee, the goal is to find a path that honors our mission to support risky art while maintaining fiduciary responsibility.

  **Context & Conflict**
  The committee is divided between two valid perspectives:
  1.  **The Outside View:** Internal records indicate poetry grantees with day jobs and prior funding miss self-imposed deadlines by an average of eighteen months (70% failure rate). Voss promises delivery in four.
  2.  **The Inside View:** Voss argues that applying statistical base rates to her creative process is a form of epistemic arrogance. She cites recent personal changes (divorce) as providing "singular clarity" that renders historical data irrelevant to her current output.

  **Evaluation of the Opposition**
  For those advocating a outright denial based on forecasting: Your position rests on a crucial principle of stewardship. Ignoring base rates risks turning the Fund into a charity of hope rather than a strategic investor in literature. If we accept personal narrative over performance history without safeguard, we undermine the fairness of the process for applicants who adhere to timelines and set a precedent that could deplete resources intended for future cohorts. This concern is not bureaucratic rigidity; it is necessary risk management.

  **Recommendation**
  I recommend we **Approve with Conditions and a Hard Timeline.**

  This approach bridges the divide by funding the work (honoring the inside view) while protecting the Fund (honoring the outside view).

  **Proposed Conditions:**
  1.  **Staggered Disbursement:** Release 50% of the grant upon signing. Release the remaining 50% only upon receipt of the final manuscript.
  2.  **Adjusted Timeline:** Contractually set the deadline at six months rather than the proposed four, acknowledging the statistical reality while remaining aggressive.
  3.  **Interim Check-in:** Require a progress report at the three-month mark. Failure to submit this report triggers a review of the remaining funds.

  **Reasoning**
  This structure accepts Voss's claim that she knows her rhythms best by providing the capital she needs to proceed. However, it acknowledges the committee's data-driven concerns by withholding full payment until delivery. It mitigates the risk of an eighteen-month delay without denying the grant based on probability alone.

  **Next Steps**
  Please review these conditions prior to Thursday's meeting. I move we vote on this conditional approval framework as a middle path that secures both the writer's opportunity and the Fund's integrity.
