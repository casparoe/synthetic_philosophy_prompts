prompt: |-
  I'm the evaluation lead at a mid-size private foundation (about $90M a year, mostly housing stability and workforce programs) and I have to approve or reject the outcome indicators grantee orgs put in their proposals, because those indicators are what decide whether they get renewed. Its about 14 of these a quarter and I get maybe two hours of analyst time total across all of them, so whatever you give me has to be fast. The person who actually signs off is our program director — smart, not quantitative, will not read more than one page.

  The problem: our current screen is three questions — is the indicator measurable, is it plausibly caused by the grantee's work, and could the grantee hit it without changing what they do? That third one basically never fires, and I'm now pretty sure it's the wrong question entirely, since anything can be gamed if someone's clever enough, so a yes/no on gameability doesn't discriminate between proposals. Meanwhile we keep approving indicators that look fine on paper and then two years out the numbers are beautiful and nothing has changed.

  Build me the actual procedure. Concretely I need:

  - The questions my analysts ask about a proposed indicator, in order, with what counts as a sufficient answer to each. Not "consider whether X is robust" — a test they can run and a bar it has to clear.
  - Where the procedure terminates in reject, where it terminates in approve-with-a-cap or approve-with-a-monitor, and where it hands the thing to the program director because it's a question about values and not about facts. Be explicit about how the analyst is supposed to tell those apart, because right now they can't.
  - It has to keep four failure modes separate, because they need different fixes. (a) The indicator correlates with what we want but the correlation is imperfect for reasons that don't travel, so selecting hard on the indicator also selects for whatever makes it high for the wrong reasons. (b) The relationship holds in the normal range of performance and falls apart at the top end — which is exactly the end we're paying people to reach. (c) Pushing the indicator up causally reduces the thing we care about. (d) Somebody is deliberately optimizing the record instead of the outcome. I don't care what you name them. I care that the procedure tells an analyst which one they're looking at, because (a) gets fixed by changing the measure, (c) might get fixed by killing the incentive, (d) gets fixed by audit, and we currently apply the same fix to all four.
  - What to do when nobody can produce a number. Most of our grantees have tiny datasets and "we don't have the power to detect this" is going to be the honest answer more often than not, and the procedure can't just stall out every time.
  - Honesty about which steps are judgment calls wearing a lab coat. I'd rather see them flagged than have something that pretends to be mechanical.

  Then run it on three proposals and give me the one-page verdict you'd actually hand the program director for each:

  1. A workforce org proposing "percentage of participants placed in a job within 90 days of program completion," where the org itself defines what counts as completion.
  2. A housing org proposing "number of eviction filings prevented," measured by counting the households they assisted that never show up in county court records.
  3. A homelessness org proposing to be scored on "self-reported sense of stability at six months," collected in an interview by the same case manager who's been serving the person.

  For at least one of these the procedure should land somewhere the program team will hate — I want to see it say the thing, and I want to be able to judge whether it says it for a good reason or because the procedure is just trigger-happy. Also tell me which of the three the procedure is least well-suited to, and why.

  Finally: what can't it catch. The failure modes that would sail through every question on the list and still leave us funding something hollow — the slow drift ones, the ones where every org games identically so the comparison looks clean, the ones that land on people who never show up in anybody's data.
reasoning: |-
  Here's a thinking process that leads to the suggested evaluation procedure and verdicts:

  1.  **Analyze the Request:**

      *   **Role:** Evaluation Lead at a mid-size private foundation ($90M/year, housing & workforce).
      *   **Task:** Build a concrete, fast procedure for approving/rejecting grantee outcome indicators.
      *   **Constraints:**
          *   Volume: ~14 proposals/quarter.
          *   Resources: ~2 hours of analyst time *total* per quarter (extremely tight, ~8.5 mins per proposal).
          *   Audience: Program Director (smart, non-quantitative, max 1 page read).
          *   Current Problem: Existing screen (Measurable? Plausible? Gameable?) is useless. Indicators look good but outcomes don't change.
          *   Requirements:
              *   Specific questions/tests with pass/fail bars.
              *   Termination points (Reject, Approve-Cap, Approve-Monitor, Escalate to Director).
              *   Distinguish 4 failure modes: (a) Bad Proxy/Non-transportable, (b) Threshold Breakdown (Goodhart's Law at the top), (c) Perverse Incentive (Causal harm), (d) Fraud/Gaming.
              *   Handle small datasets/low power.
              *   Flag judgment calls.
              *   Run on 3 specific proposals (Workforce, Housing, Homelessness).
              *   Identify which proposal the procedure is least suited for.
              *   Identify blind spots (what slips through).

  2.  **Deconstruct the Constraints & Reality Check:**

      *   *2 hours of analyst time per quarter for 14 proposals?* That is roughly 8.5 minutes per proposal. This is the critical bottleneck. Any procedure requiring data analysis, literature reviews, or complex modeling is dead on arrival. The procedure must be a *heuristic checklist* based on proposal text and basic logic, not empirical verification *before* funding. It's a *design review*, not an *impact evaluation*.
      *   *The "Gameability" Problem:* The user notes that "could they game this?" is a useless question because the answer is always "yes." The new procedure needs to assess the *cost* of gaming vs. the *value* of the outcome.
      *   *The 4 Failure Modes:* I need to map specific questions to these modes.
          *   (a) Bad Proxy: Does the metric diverge from the goal in specific contexts?
          *   (b) Threshold Breakdown: Does hitting the target require cutting corners?
          *   (c) Perverse Incentive: Does chasing the metric hurt the beneficiary?
          *   (d) Fraud: Is the data source independent?
      *   *Small Data:* If they can't measure it, we can't use it as a *performance* metric, but maybe as a *monitoring* metric.
      *   *Director Handoff:* Needs to be binary or trinary with a clear "why."

  3.  **Drafting the Procedure (The "8-Minute Screen"):**

      *   *Goal:* Maximize signal per minute.
      *   *Step 1: Independence (Mode d).* Who counts the number? If the grantee counts their own success without audit, it's high risk.
      *   *Step 2: Alignment (Mode c).* Does hitting the number potentially hurt the client? (e.g., placing someone in a job they quit in a week).
      *   *Step 3: The "Top End" Test (Mode b).* If they double this number next year, is it believable without changing the population?
      *   *Step 4: The Proxy Test (Mode a).* If this number goes up, does our actual goal *have* to go up?
      *   *Decision Tree:*
          *   Fail Step 1 -> Reject or Require Audit.
          *   Fail Step 2 -> Reject (Harm).
          *   Fail Step 3 -> Cap (Don't incentivize beyond baseline).
          *   Fail Step 4 -> Monitor only (Don't tie renewal to it).
          *   Small Data -> Monitor only.

      *Refining for Speed:* I need to make sure the analyst isn't doing research. They are reading the proposal.
      *   *Test 1 (Data Source):* Is the data generated by a third party or verifiable record? (Yes/No).
      *   *Test 2 (Perverse Incentive):* Is there a obvious way to hit the target by serving easier clients or cutting corners? (Yes/No).
      *   *Test 3 (Saturation):* Is the target >10% above their historical average? (Yes/No).
      *   *Test 4 (Proxy Strength):* Is the link between indicator and mission direct or indirect? (Direct/Indirect).

      *Wait, 2 hours total for 14 proposals is incredibly low.* I need to emphasize that this is a *triage* tool, not a validation tool. The procedure must be a checklist that takes 5-8 minutes.

  4.  **Developing the 4 Failure Mode Diagnostics:**

      *   (a) *The False Proxy:* Ask "If this number goes up 20%, but nothing else changes, is that possible?" If yes, it's a false proxy.
      *   (b) *The Cliff:* Ask "What do they stop doing to hit the stretch goal?"
      *   (c) *The Harm:* Ask "Who gets hurt if we prioritize this number over everything else?"
      *   (d) *The Ghost:* Ask "Who verifies the entry in the database?"

  5.  **Handling Small Data:**

      *   If N < 30 (or similar heuristic), cannot use for renewal decisions. Use for "Learning/Monitoring."
      *   Procedure must explicitly route these to "Approve-with-Monitor" rather than "Reject."

  6.  **Developing the Verdicts (The 3 Proposals):**

      *   *Proposal 1 (Workforce - Job Placement):*
          *   Risk: Cream-skimming (serving easiest to place), defining "completion" loosely, job retention unknown.
          *   Mode: (c) Perverse Incentive (place them, they quit) & (d) Gaming (define completion loosely).
          *   Verdict: Reject as renewal metric. Approve as monitoring. Require retention metric.
      *   *Proposal 2 (Housing - Eviction Filings Prevented):*
          *   Risk: Counterfactual problem. How do you know it was prevented? Counting "assisted households not in court" assumes all assisted households *would* have been in court.
          *   Mode: (a) False Proxy. This is mathematically unsound.
          *   Verdict: Reject. It's a logic error, not just gaming.
      *   *Proposal 3 (Homelessness - Self-reported Stability):*
          *   Risk: Social desirability bias, case manager influence.
          *   Mode: (d) Gaming (coaching answers).
          *   Nuance: Sometimes self-report is the *only* measure.
          *   Verdict: Approve-with-Cap (don't tie full renewal to it) + Monitor.

      *Which one will the team hate?* Proposal 2. They probably love "Evictions Prevented." It sounds heroic. Telling them the math is bogus will be unpopular.
      *Least suited:* Proposal 3. Qualitative/subjective measures are hard to screen with a fast heuristic.

  7.  **Identifying Blind Spots:**

      *   Systemic shifts (economy booms, workforce metrics look good without program help).
      *   Collusion (everyone games the same way).
      *   The "Missing" (people who drop out before the metric is measured).

  8.  **Refining the Output Structure:**

      *   **Part 1: The Procedure (The "8-Minute Screen").** Keep it tight. Actionable.
      *   **Part 2: The Decision Matrix.** Where to route based on answers.
      *   **Part 3: The Three Verdicts.** One-page style for the Director.
      *   **Part 4: Limitations.** Blind spots and least suited.

  9.  **Self-Correction/Review during drafting:**

      *   *Critique:* Is 2 hours realistic?
      *   *Fix:* I must acknowledge this is a *screening* procedure, not an *evaluation* procedure. It filters out the obvious bad ones. The user asked for a procedure to approve/reject indicators *in proposals*. This happens *before* the grant.
      *   *Critique:* The "Small Data" constraint.
      *   *Fix:* Add a specific "N-Check." If the denominator is small, statistical significance is impossible. Don't use for high-stakes renewal.
      *   *Critique:* Distinguishing Fact vs. Value.
      *   *Fix:* The analyst handles the "Fact" (Can this be measured? Is the logic sound?). The Director handles the "Value" (Is this outcome worth the cost? Do we accept the risk?). The procedure must explicitly say "Escalate to Director if..."

  10. **Final Polish:** Ensure tone is professional, direct, and acknowledges the resource constraints. (The "2 hours total" is the hardest constraint to respect while providing depth. I will design the procedure to be a checklist that takes 5-8 minutes per proposal, totaling ~90 minutes, leaving 30 mins for aggregation/writing the Director memo).

      *Wait, 14 proposals x 8 mins = 112 mins. That fits in 2 hours.*
      *The Director Memo needs to be distinct from the Procedure.*

      *Let's refine the 4 Failure Modes mapping in the procedure.*
      *   Mode A (Bad Proxy) -> Test: "The Counterfactual Check."
      *   Mode B (Threshold) -> Test: "The Stretch Check."
      *   Mode C (Harm) -> Test: "The Trade-off Check."
      *   Mode D (Fraud) -> Test: "The Verification Check."

      *Let's refine the Verdicts.*
      *   1 (Workforce): High risk of (c) and (d).
      *   2 (Housing): High risk of (a). This is the "Hate" one.
      *   3 (Homelessness): High risk of (d), but unavoidable.

      *Let's refine the "Least Suited".*
      *   Proposal 3 (Subjective). Hard to verify quickly.

      *Let's refine the "Blind Spots".*
      *   Macro trends.
      *   Dropout bias.

      *Okay, ready to write.*
answer: |-
  ## Part 1: The 8-Minute Screen (Procedure)

  **Resource Constraint:** You have ~8.5 minutes per proposal. This is not an impact evaluation; it is a *logic stress-test*. The analyst reads the proposal text and the indicator definition. No external data searches.

  **The Analyst's Checklist (In Order)**

  **1. The Verification Test (Detects Mode D: Fraud/Gaming)**
  *   **Question:** Is the data point generated or verified by a party other than the staff member responsible for the outcome?
  *   **Pass:** Yes (e.g., state wage records, court filings, third-party survey).
  *   **Fail:** No (e.g., case manager enters "job obtained" in own database).
  *   **Action:** If **Fail**, mark "High Audit Risk." Do not reject yet, but flag for *Approve-with-Monitor*.

  **2. The Counterfactual Test (Detects Mode A: Bad Proxy)**
  *   **Question:** If this number goes up 20% next year, is it *physically possible* for the actual mission outcome to stay flat or decline?
  *   **Pass:** No. (e.g., "Income earned" -> if income goes up, financial stability *must* improve).
  *   **Fail:** Yes. (e.g., "Evictions prevented" -> if we assist 100 people and 0 get evicted, did we prevent anything? Maybe none would have been evicted anyway).
  *   **Action:** If **Fail**, mark "Logic Flaw." Recommend **Reject** as a performance metric.

  **3. The Trade-Off Test (Detects Mode C: Perverse Incentive)**
  *   **Question:** To hit a stretch goal on this indicator, what service would the grantee have to *stop* providing?
  *   **Pass:** Nothing / Efficiency gains only.
  *   **Fail:** They would have to stop serving high-need clients, shorten service duration, or ignore client preferences. (e.g., "Job placement in 90 days" -> stop serving those with barriers).
  *   **Action:** If **Fail**, mark "Harm Risk." Recommend **Reject** unless paired with a balancing metric (e.g., retention rate).

  **4. The Saturation Test (Detects Mode B: Threshold Breakdown)**
  *   **Question:** Is the proposed target >10% higher than their 3-year historical average *without* a proposed change in methodology or population?
  *   **Pass:** No (Target is consistent with history).
  *   **Fail:** Yes (Target implies a step-change without explanation).
  *   **Action:** If **Fail**, mark "Unrealistic." Recommend **Approve-with-Cap** (renewal based on baseline, bonus for stretch).

  **5. The Power Check (Handles Small Data)**
  *   **Question:** Is the denominator (N) < 30 per year?
  *   **Pass:** No.
  *   **Fail:** Yes.
  *   **Action:** If **Fail**, mark "Low Power." Recommend **Approve-with-Monitor**. Do not tie renewal decisions to statistical variance on this number.

  ---

  ## Part 2: Decision Matrix & Escalation

  **Where the Analyst Stops (Fact/Logic):**
  *   **Reject:** Fails Counterfactual Test (Mode A) OR Fails Trade-Off Test (Mode C) without a balancing metric. *Reason: The metric is broken or dangerous.*
  *   **Approve-with-Cap:** Fails Saturation Test (Mode B). *Reason: Metric is valid, target is inflated. Renewal based on baseline performance only.*
  *   **Approve-with-Monitor:** Fails Verification Test (Mode D) OR Fails Power Check. *Reason: Metric is valid but noisy or vulnerable. Use for learning, not high-stakes renewal.*
  *   **Approve:** Passes all.

  **Where the Analyst Escalates to Program Director (Values/Strategy):**
  *   **The "Cost of Truth" Call:** If the only valid metric requires expensive third-party verification (fails Verification Test but passes everything else), the analyst flags: *"Valid metric, but requires 5% budget shift for audit. Proceed?"*
  *   **The "Mission Drift" Call:** If the Trade-Off Test reveals they must stop serving the *hardest* cases to hit the target, but the Foundation prioritizes *volume*, the analyst flags: *"Hitting this target requires cream-skimming. Acceptable risk?"*
  *   **The "Small N" Call:** If the grantee is tiny (Power Check Fail) but is a strategic pilot, the analyst flags: *"Data will be statistically meaningless. Renewal must be qualitative. Acceptable?"*

  **Judgment Call Flags:**
  *   Any "Pass/Fail" that relies on the analyst's intuition about the sector (e.g., judging if a 20% increase is "possible") must be highlighted in the memo as **"Analyst Judgment, not Verified."**

  ---

  ## Part 3: The Verdicts (One-Page Memos)

  ### Memo 1: Workforce Org ("Job Placement within 90 Days")
  **Recommendation:** **APPROVE-WITH-MONITOR (Do not tie renewal to this metric)**
  **Primary Risk:** Mode C (Perverse Incentive) & Mode D (Gaming)
  **The Logic:**
  1.  **Verification (Fail):** Org defines "completion" and "placement." No third-party wage record match proposed.
  2.  **Trade-Off (Fail):** To maximize 90-day placement, staff will inevitably steer resources toward "job-ready" participants and drop those with barriers (the opposite of our mission).
  3.  **Fix:** We cannot fix this by tweaking the number. We must change the incentive.
  **Director Decision Required:**
  *   **Option A:** Reject this metric. Require "Job Retention at 12 Months" verified by wage records (higher cost, slower data).
  *   **Option B:** Accept the metric for monitoring only. Renewal decisions based on qualitative review of *who* they served, not just *how many* placed.
  **Analyst Note:** If we fund this as-is, we are paying for speed, not stability.

  ### Memo 2: Housing Org ("Eviction Filings Prevented")
  **Recommendation:** **REJECT**
  **Primary Risk:** Mode A (Bad Proxy / Logic Flaw)
  **The Logic:**
  1.  **Counterfactual (Fail):** The metric counts "Households assisted that do not show up in court records." This assumes every assisted household *would have* been evicted without help. This is mathematically false. Most households assisted never face eviction filings.
  2.  **Result:** The org gets credit for "preventing" evictions that were never going to happen. They can inflate this number simply by assisting low-risk tenants.
  3.  **Fix:** There is no fix for this indicator definition. It measures activity, not outcome.
  **Director Decision Required:**
  *   **Action:** Require a valid counterfactual metric (e.g., "Eviction filings per 100 assisted households" compared to a matched control group, or "Legal judgments of eviction").
  *   **Risk:** This will reduce their reported "impact" numbers by roughly 90%. Are we prepared for that narrative hit?
  **Analyst Note:** This is the most dangerous proposal. It looks heroic on paper but is hollow.

  ### Memo 3: Homelessness Org ("Self-Reported Stability")
  **Recommendation:** **APPROVE-WITH-CAP**
  **Primary Risk:** Mode D (Gaming)
  **The Logic:**
  1.  **Verification (Fail):** Case manager collects the data. High risk of coaching ("You want to stay housed, right?").
  2.  **Counterfactual (Pass):** If people feel stable, they are likely stable. The link is direct.
  3.  **Power (Fail):** N is likely small for 6-month follow-ups.
  4.  **Constraint:** For homelessness, self-report is often the *only* available measure. Rejecting it leaves us with no metric.
  **Director Decision Required:**
  *   **Action:** Approve the indicator but cap its weight in renewal decisions at 25%. The rest of the renewal decision must be based on administrative data (shelter returns, etc.).
  *   **Risk:** We are accepting some inflation in the numbers in exchange for capturing the human element.
  **Analyst Note:** Least robust metric, but most aligned with mission. Proceed with eyes open.

  ---

  ## Part 4: Limitations & Blind Spots

  **Which proposal is this procedure least suited for?**
  **Proposal 3 (Homelessness / Self-Report).**
  *   **Why:** The procedure relies on logical stress-tests and data source verification. Subjective well-being is inherently unverifiable by third parties and resists the "Counterfactual Test" (stability is internal). The procedure forces a "Monitor/Cap" classification because it *can't* validate the truth, not because the metric is necessarily wrong. It treats subjective data as "risky" by default, which may undervalue qualitative outcomes.

  **What the Procedure Cannot Catch (The "Hollow" Failures):**
  1.  **The Macro Tide:** If the local economy booms, Proposal 1 (Workforce) will hit all targets without the program adding value. The procedure checks internal logic, not external validity. *Fix: Requires sector-level baseline data (outside analyst scope).*
  2.  **The Dropout Bias:** All three proposals measure people who *stay* in the program. If the org quietly pushes away the hardest cases before "enrollment" or "completion," the metrics look perfect. The procedure checks the indicator, not the intake funnel. *Fix: Requires "Denominator Audit" (who applied vs. who enrolled).*
  3.  **Collusive Gaming:** If every org in the region defines "Job Placement" the same loose way, the comparison looks clean. The procedure evaluates proposals in isolation. *Fix: Requires cross-grantee calibration (Program Director task).*
  4.  **The "Slow Drift":** An org can slowly lower the quality of service over 3 years while maintaining the *quantity* of outcomes. The procedure is a point-in-time screen. *Fix: Requires longitudinal site visits.*

  **Summary for the Director:**
  This procedure stops us from funding *logical errors* (Proposal 2) and *obvious harms* (Proposal 1). It does not guarantee the numbers are true (Proposal 3). It buys us protection against embarrassment, not a guarantee of impact.
