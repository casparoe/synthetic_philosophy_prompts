  2.  **Analyze Weil's Theory (Mental Sandbox):**

      *   *The Party:* For Weil, a party is a collective organism. Its law of motion is self-preservation.
      *   *The Mechanism:* Pressure is exerted on members to conform. Thinking is replaced by "party line."
      *   *Truth/Justice:* These are individual pursuits (attention to reality/God). The party collective cannot pursue truth because it must prioritize its own existence over reality if they conflict.
      *   *Distinction:* It's not just "power corrupts" (moral failing); it's "organization necessitates" (ontological failing).

  3.  **Map to Syriza 2015:**

      *   *The Agent:* Weil would likely identify the *leadership cadre* acting *as* the Party. The parliamentary group is the enforcement mechanism. The "base" is the fuel.
      *   *Optimization:* Initially, optimization was *growth/power* (win election). During the 6 months, it shifted to *survival within the system* (staying in gov, staying in Euro). Post-referendum, optimization was *party unity/continuity* over mandate fidelity.
      *   *What should it have done?* Weil is tricky here. She doesn't offer policy prescriptions. But structurally, a party *cannot* do what is "just" if "just" threatens the party. If the "just" thing was resigning to let a non-party technocratic gov handle the exit, or sticking to the mandate regardless of cost, the party structure prevents it.
      *   *Explaining the Reversal:* The "No" vote was truth/justice (the people's will). The "Yes" implementation was party survival (Tsipras staying PM, Syriza staying dominant). The split (Popular Unity) represents the friction when truth clashes with party discipline.
      *   *Silence:* Weil focuses on the *internal* psychology/sociology of the group. She says little about external material constraints (ECB liquidity, capital controls, treaty law). She treats external pressure as just another force the party navigates for survival, not necessarily an absolute determinant.

