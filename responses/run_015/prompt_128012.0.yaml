answer: |-
  On Weil's terms, the agent in 2015 was not Tsipras the man, nor even the cabinet, but the Party Organism itself—a structure that crystallized around the leadership core and the parliamentary whip the moment Syriza entered government. What this organism optimized across those six months was not the mandate (anti-austerity) nor the national interest (economic stability), but its own continuity as the governing force within the existing state apparatus. In January, the optimization function was *growth* (capture the state); by July, it had shifted to *preservation* (remain in the Eurozone, remain in power). Weil's theory dictates that the party *should* have dissolved its own discipline the moment the mandate became incompatible with reality, perhaps by resigning en masse to allow a non-party administration to handle the exit, but the theory predicts it cannot do this because self-preservation is its only law.

  The lens explains the No-to-Yes reversal precisely because the referendum was a moment of collective *attention* (Weil's substitute for truth)—the people looked at the terms and said "this is unjust"—whereas the bailout signing was an act of *collective passion*, where the pressure of the party machine (the threat of elections, loss of status, expulsion) overrode the faculty of judgment. It explains the split: Popular Unity was the fragment of the organism that refused to subordinate truth to survival, and was consequently excreted. It explains the MPs who voted for the bailout while weeping: they were not acting as moral agents but as cells in a body that had decided to survive at the cost of its nervous system.

  However, Weil's lens is silent on the materiality of the cage. She treats the Troika's threats as external pressures that the party navigates, but she has no metric for when external force makes the "just" action impossible regardless of party structure. If the ECB would have collapsed the Greek banking system within 48 hours of a Grexit, the "survival" Tsipras chose might have been the state's survival, not just the party's. Weil lacks a sociology of constraint; she assumes the only barrier to justice is the clouding of the soul, not the hard wall of treaty law and liquidity strikes.

  On your second run-back: the 2015 case supports both the corruption and substitution readings simultaneously, which Weil allows. The corruption reading fits the MPs who knew the bailout was wrong but voted Yes to keep their seats; the substitution reading fits the leadership who genuinely came to believe there was "no alternative" because the party's need to govern required that belief to be true. The theory absorbs the Grexit counterfactual easily: had Tsipras chosen Grexit, Weil would argue he did so to preserve the party's *radical brand* rather than from attention to the economic suffering exit would cause. To falsify Weil, you would not need a different policy outcome, but a different organizational form: a group that, upon finding its existence conflicted with the truth, voluntarily disbanded rather than compromise. Since Syriza did not do this, it confirms her. Regarding the "front" question: Weil's critique applies to any collective that demands adherence to a line; Syriza began as a horizontalist front but functioned as a disciplined party once it took the whip, proving her point that the *form* of party politics inevitably crushes the *spirit* of the movement.

  It is Michels with metaphysics bolted on, but the bit about truth and justice earns its keep here.
