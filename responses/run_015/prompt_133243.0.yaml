answer: |-
  There is no single, universally canonical term for this specific configuration in the literature comparable to the ubiquity of "Frankfurt-style cases" (FSCs). However, your intuition that this represents a structurally distinct category is philosophically sound.

  In contemporary debates, this configuration is most often discussed under the overlapping headers of **"Structural Manipulation Arguments,"** **"Environmental Constraints on Agency,"** or **"Systemic Pre-emption."** While it shares the *functional goal* of Frankfurt cases (challenging the Principle of Alternative Possibilities, or PAP), it differs in its *metaphysical mechanism*.

  Here is an analysis of how this arrangement is distinguished from standard intervention cases, the terminology currently in use, and the defining features that warrant treating it as a distinct category.

  ### 1. Terminology and Conceptual Lineage

  While you will not find a single noun phrase like "The Smith Case" for this, the concept appears in three intersecting literatures:

  *   **The Manipulation Argument (Pereboom, Mele):** Standard manipulation arguments involve an agent whose psychology is directly tuned by a controller to ensure a specific choice. Your variant is distinct because the manipulation is **environmental/architectural** rather than psychological. It shapes the *option space* rather than the *volitional capacity*.
  *   **Situationism (Doris, Harman):** This literature argues that character traits are less robust than we think and that situational factors determine behavior. Your case radicalizes this by suggesting the situation has been *engineered* to eliminate alternatives, not just influence probabilities.
  *   **Choice Architecture / Nudge Theory (Thaler, Sunstein):** In policy ethics, this is the design of environments to predictably alter behavior without forbidding options. Your philosophical scenario describes a "hard nudge" where the architecture renders alternatives *practically* inaccessible, effectively removing them without formal prohibition.

  If you were to coin or adopt a term for precise philosophical discussion, **"Structural Pre-emption Cases"** or **"Architectural Closure Cases"** would be the most accurate descriptors.

  ### 2. Distinction Regarding the Principle of Alternative Possibilities (PAP)

  The distinction between standard Frankfurt cases and your structural variant is crucial for how they attack PAP.

  **Standard Frankfurt Cases (Counterfactual Intervention):**
  *   **Mechanism:** A backup mechanism exists *in the counterfactual world*. In the *actual* world, the agent acts on their own.
  *   **PAP Implication:** These cases argue that APs are irrelevant because the agent is responsible in the actual sequence, even though they *would not* have been able to do otherwise had they tried.
  *   **Metaphysical Status:** The removal of alternatives is **modal**. The agent *could* physically move their body otherwise, but the intervener would stop them.

  **Structural/Architectural Cases (Ex Ante Closure):**
  *   **Mechanism:** The alternatives are removed *in the actual world* prior to deliberation via historical or environmental shaping.
  *   **PAP Implication:** These cases suggest that APs are absent not because of a threat, but because the **pathway itself is gone**.
  *   **Metaphysical Status:** The removal of alternatives is **causal/historical**. The agent often *cannot* physically or practically move their body otherwise because the environment does not support that action (e.g., a digital interface that does not render a "cancel" button, or an economic structure that makes survival impossible without a specific job).

  **The Crucial Divergence:**
  Standard FSCs preserve the **actual sequence** as "clean" (the agent's own reasoning). Structural cases contaminate the **actual sequence** because the deliberation occurs within a pre-pruned garden. This makes structural cases more dangerous to **Compatibilism**. A compatibilist can argue that in a Frankfurt case, the agent's reasons-responsiveness is intact. In a structural case, the *range of reasons* available to be responsive to has been engineered.

  ### 3. Defining Features for a Distinct Category

  To treat this as a distinct category rather than a peripheral variant, you should highlight these four features:

  #### A. Diffuse vs. Localized Agency
  *   **Frankfurt:** The constraint is localized (a neuroscientist, a device).
  *   **Structural:** The constraint is diffuse (an algorithm, a culture, an institution). There is no specific "intervener" to blame, which complicates the moral accounting. This creates a **"Responsibility Vacuum"** where no single agent is responsible for the closure, yet the subject's responsibility is questioned.

  #### B. Modal vs. Actual Constraint
  *   **Frankfurt:** The constraint is conditional ("If you try X, I stop you").
  *   **Structural:** The constraint is categorical ("X is not available").
  *   **Significance:** In Frankfurt cases, the agent retains the *power* to try. In structural cases, the agent may lack the *conceptual or practical capacity* to even formulate the alternative. This targets **Leeway Incompatibilism** more aggressively than FSCs do.

  #### C. Temporal Location of Determination
  *   **Frankfurt:** Determination is concurrent (the device is active *during* the choice).
  *   **Structural:** Determination is historical (the path was closed *before* deliberation began).
  *   **Significance:** This aligns the case more closely with **Hard Determinism** or **History-Sensitive Compatibilism** (e.g., Alfred Mele's "value history" conditions). It forces the question: Does responsibility require that the *history* of the option space was open, even if the *moment* of choice feels free?

  #### D. Phenomenological Transparency
  *   **Frankfurt:** The agent is usually unaware of the device, but the device is external to their mind.
  *   **Structural:** The constraints are often internalized or invisible (e.g., predictive algorithms shaping what news you see, thereby shaping what you think is possible).
  *   **Significance:** This raises epistemic concerns. If the agent cannot perceive the walls of the room, can they be responsible for staying in it?

  ### 4. Boundary Cases and Testing the Distinction

  To solidify this as a distinct category, consider these boundary cases where the two models diverge:

  1.  **The "Flicker of Freedom" Objection:**
      *   *Frankfurt:* Critics argue there is always a "flicker" of an alternative (e.g., deciding on one's own vs. being forced).
      *   *Structural:* In a perfectly closed architectural system, there may be no flicker. The alternative is not just blocked; it is **unimaginable** or **inconceivable** due to the shaping of the agent's information environment. If the alternative cannot be cognized, the "flicker" strategy fails completely.

  2.  **The "Sourcehood" Intuition:**
      *   *Frankfurt:* We tend to feel the agent is still the "source" because the actual sequence was untouched.
      *   *Structural:* We tend to feel the agent is *not* the source because the actual sequence was constituted by the prior closure. This makes structural cases better tools for **Source Incompatibilists** (who argue responsibility requires being the ultimate source, not just having alternatives) than standard FSCs.

  3.  **The "Nudge" Boundary:**
      *   At what point does a "nudge" (making an option harder to choose) become "structural closure" (making it impossible)?
      *   *Distinction:* In Frankfurt cases, the line is binary (intervention or not). In structural cases, the line is a **spectrum of friction**. This allows for a gradient analysis of responsibility that FSCs do not permit.

  ### Summary Recommendation

  You are correct to identify this as a distinct configuration. While it serves the same dialectical purpose as Frankfurt-style cases (challenging PAP), it operates via **historical/environmental pre-emption** rather than **counterfactual intervention**.

  If you are writing or discussing this, I recommend labeling it **"Structural Pre-emption"** or **"Architectural Closure."** Distinguish it from Frankfurt cases by emphasizing that while Frankfurt cases remove the *ability to succeed* in doing otherwise, structural cases remove the *ability to attempt* or even *conceive* of doing otherwise. This shifts the debate from the **Principle of Alternative Possibilities** to the **Principle of Sourcehood**, asking whether an agent can be the true origin of an action when the garden of forking paths was pruned before they arrived.
