answer: |-
  ### Essay Question

  **Consider the following scenario:** A long-standing social practice $P$ was originally instituted for reason $R$. Over time, $R$ has become obsolete, but $P$ persists and now produces a valuable, unintended consequence $C$. A reformer, aware of both the history of $R$ and the existence of $C$, proposes abolishing $P$ and replacing it with a new institution $P^*$ explicitly designed to secure $C$ more efficiently.

  **Essay Prompt:** Does Chesterton's Fence forbid this replacement? Would a Burkean conservative arrive at a different conclusion? In your answer, distinguish between Chesterton's epistemic requirement for *intelligibility* and Burke's appeal to *prescription* and *prejudice*. Specifically, address whether the unintended nature of $C$ matters differently for Chesterton's individual rationality versus Burke's conception of inherited wisdom as sedimented adaptation. (90 minutes)

  ***

  ### Model Answer

  Chesterton's Fence and Burkean conservatism are often conflated as simple injunctions against change, but they rest on divergent epistemic foundations. In the scenario provided, where a practice $P$ retains value $C$ despite the lapse of its original reason $R$, these differences yield distinct verdicts on the reformer's proposal to institute $P^*$.

  Chesterton's Fence is fundamentally a rule of individual intelligibility. It asserts that one should not remove a fence until one understands why it was put there. In this scenario, the reformer *does* understand the current function of the practice: they have identified consequence $C$. For Chesterton, the "reason" for the fence is not historically fixed at $R$; it is the current justification for the barrier's existence. Since the reformer grasps $C$ and proposes $P^*$ specifically to secure it, they have satisfied the condition of understanding. The fence is not being removed blindly; it is being moved with a clear purpose. Therefore, Chesterton's Fence does not strictly forbid the replacement, provided the reformer can demonstrate that $P^*$ will indeed secure $C$ without generating new, unseen harms. The epistemic burden is on the individual reformer to comprehend the function, and here, they claim to have done so.

  Burkean conservatism, however, offers a stricter critique based on the nature of social rationality. For Burke, institutions are not merely mechanical devices designed for specific ends; they are organic growths that embody the "bank and capital of nations." The value of $P$ lies not just in the identifiable consequence $C$, but in the complex, tacit web of habits, affections, and prejudices that sustain it. The fact that $C$ is *unintended* is crucial for Burke. It suggests $P$ is a sedimented adaptation that has evolved to meet human needs in ways explicit design cannot anticipate.

  A Burkean would argue that replacing $P$ with $P^*$ treats the social order as a machine rather than an organism. Even if $P^*$ secures $C$, it may lack the "prejudices"—the ingrained, inarticulate habits—that make $P$ stable and acceptable to the populace. Burke suspects that individual reason, even when it identifies $C$, cannot fully comprehend the total utility of an inherited practice. The practice may support $C$ only because of its association with $R$, or through subtle social cues lost in the transition to $P^*$. To abolish $P$ is to destroy a repository of collective wisdom that outruns the reformer's explicit understanding of $C$.

  Thus, while Chesterton permits the swap if the function is understood, Burke likely forbids it because the function is not *exhaustively* understood. Chesterton requires the reformer to see the reason; Burke requires the reformer to humility before the mystery of the reason. The reformer sees $C$ as a discrete variable to be optimized. Burke sees $P$ as part of a continuum of prescription where the value is embedded in the continuity itself. Consequently, the reformer passes Chesterton's test of intelligibility but fails Burke's test of prescription. The distinction lies in whether social rationality is something an individual can fully grasp and replicate (Chesterton) or something distributed across time that resists explicit reconstruction (Burke).

  ***

  ### Marking Scheme (Total 20 Marks)

  | Point | Requirement | Marks | Common Error |
  | :--- | :--- | :--- | :--- |
  | **1** | **Scenario Analysis:** Correctly identifies that $R$ is obsolete but $C$ provides a current functional justification for $P$. | 4 | Students claim $P$ is useless because $R$ is gone, ignoring the prompt's stipulation that $C$ exists. |
  | **2** | **Chesterton's Epistemology:** Defines Chesterton's Fence as a demand for *individual intelligibility* of the reason, not historical fidelity. | 4 | Students define Chesterton merely as "don't change anything" without referencing the condition of understanding. |
  | **3** | **Burke's Epistemology:** Explains Burke's view of institutions as repositories of *tacit, distributed, or sedimented* rationality beyond individual grasp. | 4 | Students reduce Burke to "tradition is good" without explaining the epistemic limit of individual reason. |
  | **4** | **Application/Verdict:** Concludes that Chesterton likely *permits* the swap (reason is known), while Burke *rejects* it (reason is not fully knowable/relicable). | 4 | Students argue both thinkers would forbid the change, failing to see Chesterton's permissiveness regarding understood functions. |
  | **5** | **The Unintended Consequence:** Articulates why the *unintended* nature of $C$ is benign for Chesterton but suspicious/crucial for Burke (organic vs. mechanical). | 4 | Students treat $C$ as identical for both thinkers, missing that Burke values the *process* of emergence over the *outcome* alone. |
