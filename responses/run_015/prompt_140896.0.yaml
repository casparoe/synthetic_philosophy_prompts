  Rationality is not a property of your brain in a vacuum; it is a property of your **actions in an environment**.
  *   **Analogy:** Is it irrational to drink a liquid? Usually, yes, if it's poison. But if a stranger hands you a liquid and says, "This is poison, but I will give you $1 million and the antidote," it becomes rational to drink it. The *liquid* didn't change. The *agent's psychology* didn't change. The **context** changed.

