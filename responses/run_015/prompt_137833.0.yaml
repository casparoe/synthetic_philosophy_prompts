      *Let's check the probability.* Smith distinguishes between the "sentiments of the agent" and the "situation." The Spectator judges if the agent's feelings match the situation. So the Spectator needs a model of the situation (probabilities of outcomes) to judge if the agent's anxiety/joy is *proportionate*.

