      *   **Current Project:** Trying to formalize Adam Smith's "Impartial Spectator" (from *The Theory of Moral Sentiments*) into a "spectator function" for decision-making.
      *   **The Model:** Input = action description; Output = approval rating. Decision rule = Maximize Expected Approval (MEA).
      *   **The Problems:**
