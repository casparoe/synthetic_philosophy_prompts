answer: |-
  # The Bounded Ignorance Protocol (BIP)
  **Version:** 1.0 (Specialty Pricing & Reserving)
  **Time Budget:** 60 Minutes per Case
  **Tool:** Spreadsheet

  ## Purpose
  To assign defensible probabilities to bounded quantities where data is absent but decisions are required, without concealing the arbitrariness of the assumption. This protocol replaces "guessing a number" with "documenting a scale."

  ---

  ## Part 1: The Decision Procedure

  ### Step 1: The Gate (Eligibility Check)
  **Action:** Before opening a new tab, answer the following four questions.
  1.  **Base Rate:** Is there a historical average for this specific metric (even from a different portfolio)?
  2.  **Count/Denominator:** Is the quantity a count $k$ out of a known $n$ (e.g., number of claims)?
  3.  **Bound Hardness:** Are the min/max bounds hard physical constraints (e.g., probability $\le$ 1) or soft expert guesses (e.g., "unlikely to exceed 40%")?
  4.  **Consistency:** Have we published a number for this quantity in the last 12 months (rate filing, reserve opinion)?

  **Decision Logic:**
  *   If **Base Rate** exists: **STOP.** Use the base rate with a confidence loading. Do not use indifference.
  *   If **Count/Denominator** is known: **STOP.** Use a Beta distribution (parameters $\alpha=1, \beta=1$ if truly ignorant, scaled to bounds).
  *   If **Bounds are Soft**: **DOWNGRADE.** Proceed, but widen the bounds by 20% to absorb estimation error before calculating.
  *   If **Consistency** required: **STOP.** Align with the published number; treat the difference as a separate uncertainty factor.
  *   If **None of the above**: **PROCEED** to Step 2.

  ### Step 2: The Mechanism (Scale Selection)
  **Action:** Write one sentence describing *how* the value is physically or logically generated. Classify it into one of three types.
  1.  **Partition (Additive):** The value is a sum of parts or a slice of a fixed whole (e.g., market share, fraud rate, allocation).
      *   *Scale:* **Linear** ($X$).
  2.  **Process (Multiplicative):** The value results from compounding rates, growth, or sequential filtering (e.g., inflation accumulation, survival probability over multiple stages).
      *   *Scale:* **Log-Linear** ($\ln(X)$).
  3.  **Ratio (Reciprocal):** The value is a rate (events/time) or a duration (time/events).
      *   *Rule:* Choose the scale that is **additive**. If delays stack additively, use Linear Duration. If rates compound multiplicatively, use Log-Rate.
      *   *Constraint:* You must choose one. You cannot be indifferent on both Rate and Duration.

  **Unknown Mechanism:** If the generation process is genuinely opaque, default to **Partition (Linear)** but mark the "Mechanism Uncertainty" flag in the output.

  ### Step 3: Symmetry Tests (Elimination)
  **Action:** Apply the following transformations to your chosen quantity $X$. If the distribution shape changes fundamentally, discard that parameterization.
  1.  **Complement Test:** Let $Y = \text{Max} + \text{Min} - X$ (or $1-X$ for shares).
      *   *Requirement:* If $X$ and $Y$ represent logically equivalent states (e.g., Fraud vs. Non-Fraud), the distribution family must be preserved.
      *   *Result:* Uniform on **Raw Odds** fails this test (Odds of Fraud $\neq$ Inverse Odds of Non-Fraud). Uniform on **Linear** and **Log-Odds** pass.
  2.  **Affine Test:** Let $Z = aX + b$.
      *   *Requirement:* Indifference must hold under change of units (e.g., Days to Weeks).
      *   *Result:* Uniform on **Linear** and **Log** pass. Uniform on **Reciprocal** fails.

  **Decision:** Eliminate any parameterization that fails a test relevant to the context. If multiple survive, retain all for Step 5.

  ### Step 4: Evidence Alignment (Future-Proofing)
  **Action:** Identify the scale on which *future* data will naturally accumulate.
  *   If you expect to average samples (Central Limit Theorem applies to $X$): Prefer **Linear**.
  *   If you expect to multiply factors (Geometric Mean applies to $X$): Prefer **Log**.
  *   If you expect to update via GLM with a specific link function: Match the link function (e.g., Logit link $\to$ Log-Odds scale).

  **Decision:** If Step 2 and Step 4 conflict, **Step 2 dominates** (physical generation trumps statistical convenience), but note the conflict in the documentation.

  ### Step 5: Output & Decision Rule
  **Action:** Calculate the probability of the event of interest (e.g., $P(X > \text{Threshold})$) for every surviving parameterization from Step 3.
  1.  **The Number:** Report the median of the surviving probabilities.
  2.  **Sensitivity Figure:** Report the Range (Min to Max) of the surviving probabilities.
  3.  **Decision Rule:**
      *   If the **Decision Threshold** (e.g., 30% risk appetite) lies *outside* the Sensitivity Range: **Issue the Number.**
      *   If the **Decision Threshold** lies *inside* the Sensitivity Range: **Issue "NOT DECISION-GRADE."**
      *   **Remediation:** List the top two information-gathering activities that would narrow the bounds, ranked by cost (e.g., "1. External benchmark study ($5k)", "2. Internal claims audit (40 hrs)").

  ---

  ## Part 2: Application to Cases

  ### Case 1: Fraud Share
  *   **Bounds:** 5% to 40% ($0.05, 0.40$).
  *   **Question:** Is $P(\text{Share} > 25\%)$ greater than 30%?
  *   **Gate:** No base rate, not a count, bounds are hard policy limits, no prior publication. **Proceed.**
  *   **Mechanism:** Fraud is a partition of the total claims cohort (Fraud + Legit = 1). **Classification:** Partition (Additive). **Scale:** Linear.
  *   **Symmetry:** Complement is "Legitimate Share". Linear passes. Log-Odds passes. Raw Odds fails (eliminated).
  *   **Evidence:** Future audits will yield counts ($k/n$), which average linearly. **Alignment:** Linear.
  *   **Surviving Parameterizations:** Linear, Log-Odds.
  *   **Calculations:**
      1.  **Linear (Uniform on Share):**
          $$P(X > 0.25) = \frac{0.40 - 0.25}{0.40 - 0.05} = \frac{0.15}{0.35} = 0.43$$
      2.  **Log-Odds (Uniform on Logit):**
          $$\text{Logit}(x) = \ln\left(\frac{x}{1-x}\right)$$
          $$\text{Bounds: } \ln(0.05/0.95) \approx -2.94, \quad \ln(0.40/0.60) \approx -0.41$$
          $$\text{Threshold: } \ln(0.25/0.75) \approx -1.10$$
          $$P(X > 0.25) = \frac{-0.41 - (-1.10)}{-0.41 - (-2.94)} = \frac{0.69}{2.53} = 0.27$$
  *   **Output:**
      *   **Number:** 0.35 (Median of 0.43 and 0.27).
      *   **Sensitivity:** [0.27, 0.43].
      *   **Decision:** Threshold is 0.30. The range [0.27, 0.43] **straddles** 0.30.
      *   **Result:** **NOT DECISION-GRADE.**
      *   **Remediation:** 1. Sample 50 closed claims for fraud review (Cost: 20 analyst-hours). 2. Purchase industry fraud benchmark report (Cost: $2,500).

  ### Case 2: Notification-to-First-Payment
  *   **Bounds:** 3 to 40 Days.
  *   **Question:** Is $P(\text{Days} > 14)$ acceptable?
  *   **Gate:** No history on this specific product. **Proceed.**
  *   **Mechanism Run A (Additive):** Delays are caused by sequential administrative steps (mail time + processing time + approval time). These sum.
      *   **Scale:** Linear Days.
      *   **Calc:** $P(T > 14) = (40 - 14) / (40 - 3) = 26 / 37 = 0.70$.
  *   **Mechanism Run B (Multiplicative):** Delays are caused by percentage inefficiencies at each stage (e.g., 10% of files get kicked back, compounding).
      *   **Scale:** Log Days.
      *   **Calc:** $\ln(3)\approx 1.10, \ln(40)\approx 3.69, \ln(14)\approx 2.64$.
      *   $P(T > 14) = (3.69 - 2.64) / (3.69 - 1.10) = 1.05 / 2.59 = 0.41$.
  *   **Actuarial Demand:** An actuary is right to demand evidence for **Mechanism Run B**. Administrative time is physically additive, not multiplicative. Log-time implies that a 1-day delay at the start is equivalent to a 1-day delay at the end in percentage terms, which contradicts SLA logic.
  *   **Output:** Use Run A (0.70). Sensitivity is low if Mechanism B is rejected on physical grounds.

  ### Case 3: The Refusal (Cyber Aggregate Limit)
  *   **Context:** Pricing a standalone cyber aggregate limit for a new tech vertical.
  *   **Bounds:** \$10M to \$500M (Provided by CFO and CRO respectively).
  *   **Question:** Is the probability of exhaustion > 5%?
  *   **Gate:** **STOP.**
      *   **Reason:** Bounds are **Soft Estimates**. The CFO's \$10M is a hope; the CRO's \$500M is a worst-case catastrophe model run with uncalibrated parameters. The ratio between bounds is 50x.
  *   **Mechanism:** Unknown. Is it a single event? Accumulation of many? Network contagion?
  *   **Output:** **REFUSAL.**
      *   **Statement:** "The bounds provided represent stakeholder disagreement, not physical constraints. Indifference priors on a 50x range yield decision probabilities ranging from 1% to 99% depending on log-linear scaling. This estimate is not decision-grade."
      *   **Remediation:** 1. Calibrate catastrophe model to 3 external loss events (Cost: \$50k). 2. Re-insure 90% of the limit to remove the tail uncertainty from the balance sheet (Cost: Premium cession).

  ---

  ## Part 3: Formal Gloss & Sign-Off

  | Step | Operational Instruction | Formal Gloss (For Reviewer) | Sign-Off Required? |
  | :--- | :--- | :--- | :--- |
  | **1. Gate** | Check for data/history/consistency. | **Admissibility Check:** Verifies that the Principle of Insufficient Reason is not applied where Likelihood exists. | Yes (Analyst) |
  | **2. Mechanism** | Describe generation; pick scale. | **Parameterization Invariance:** Selects the maximal entropy distribution on the physically invariant manifold. | **Yes (Actuary)** |
  | **3. Symmetry** | Test complement/affine transforms. | **Group Invariance:** Eliminates parameterizations violating symmetry groups inherent to the quantity (e.g., $SU(2)$ for shares). | No |
  | **4. Evidence** | Match scale to future data. | **Asymptotic Consistency:** Ensures prior support aligns with the natural parameter of the asymptotic likelihood function. | No |
  | **5. Output** | Number, Range, Decision Rule. | **Robustness Check:** Reports the variation of the posterior expectation under the set of admissible priors. | **Yes (Signatory)** |

  ### What This Procedure Cannot Do
  1.  **Create Information:** It cannot narrow a 5%–40% bound to 20%–25%. It only quantifies the risk of that uncertainty.
  2.  **Resolve Physical Ambiguity:** If the physical generation mechanism is truly unknown (Case 3), it forces a refusal rather than a false precision.
  3.  **Replace Judgment:** Step 2 requires a human to decide if a process is additive or multiplicative. The math cannot do this.

  ### Calibration: Bertrand's Chord
  *   **Problem:** Probability a random chord exceeds the side of an inscribed equilateral triangle.
  *   **Procedure Run:**
      *   **Gate:** Pass (Pure math problem).
      *   **Mechanism:** The analyst *must* specify how the chord is generated.
          *   "Random endpoints on circumference" $\to$ Linear measure on arc $\to$ $P = 1/3$.
          *   "Random midpoint within disk" $\to$ Linear measure on area $\to$ $P = 1/4$.
          *   "Random distance from center" $\to$ Linear measure on radius $\to$ $P = 1/2$.
      *   **Result:** The procedure **licenses none** as a universal answer. It licenses the answer *conditional on the specified mechanism*. If the problem statement is merely "random chord" without mechanism, the procedure triggers the **Refusal** output (Case 3 logic), stating the question is ill-posed.
      *   **Resolution:** It dissolves the paradox by forcing the definition of "random."

  ### The Critical Step
  **Step 2 (The Mechanism)** does the most work.
  *   **Why:** Steps 1, 3, and 4 are filters. Step 2 is the *generator*.
  *   **Collapse:** If Step 2 is removed, the analyst defaults to Linear Indifference (Uniform Distribution) by habit. This re-introduces Bertrand's Paradox, as the Linear scale is arbitrary compared to Log or Odds scales. Without the physical justification for the scale, the Sensitivity Figure in Step 5 becomes meaningless because there is no justification for including/excluding specific parameterizations.

