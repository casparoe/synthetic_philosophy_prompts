  **TO:** Board of Trustees
  **FROM:** [Your Name]
  **SUBJECT:** Decision Framework: Country Director Breach and Future Access

  **Recommendation**
  We must treat the past cholera intervention and the future nutrition offer as distinct decisions. I recommend we **ratify the Country Director's past decision with formal sanction**, **decline the nutrition programme on the proposed terms**, and **do not disclose the data handover to the affected villages**.

  **The Past Act: Ratification and Sanction**
  The Country Director violated a core protection policy to save lives during an acute emergency. Trustee A is correct that 2,300 patients were treated who otherwise might not have been. In a cholera outbreak, speed is mortality. Waiting 72 hours for board approval was operationally impossible. To refuse ratification is to deny the reality of the field and punish life-saving judgment. We must ratify.

  However, Trustee B is equally correct that ratifying without consequence renders the protection policy advisory. If we signal that senior staff can bypass board oversight on data protection whenever they deem it necessary, we invite every armed group to demand patient lists as a condition of access. The policy exists because patient data has been weaponized before.

  Therefore, we must apply the sanction. This is not performative guilt, nor is it about finding the Director blameworthy in a moral sense. It is about preserving the rule. The Director made the right choice for the patients but the wrong choice for the organisation's long-term safety architecture. Someone must bear the cost of that breach so the rule remains intact for the next crisis. A formal censure on the Director's record acknowledges the necessity of the act while reaffirming the inviolability of the policy. This satisfies the operational pragmatism of Trustee A and the legalistic protectionism of Trustee B.

  **The Future Offer: Acute vs. Enduring**
  We cannot accept the nutrition programme on the same terms. The cholera intervention was acute; the outbreak is over. The nutrition programme is ongoing. Accepting permanent access conditioned on permanent data sharing institutionalizes the breach. It transforms an emergency exception into a standard operating procedure.

  Armed groups learn quickly. If we agree to this, we teach them that our data protection policies are negotiable under pressure. Future teams will face this same demand without the cover of an immediate epidemic. We must negotiate alternative terms—aggregated data only, or third-party verification—or withdraw the offer. We cannot trade long-term neutrality and staff safety for programme expansion.

  **Disclosure: Safety Over Transparency**
  Trustee C argues that silence confirms community suspicions that we are complicit with the armed group. This is a serious risk; trust is our primary operational asset. However, the primary mandate is do no harm. We have no evidence patients were harmed, but we have no way to know if disclosure would trigger retaliation now. The armed group already holds the population rolls; the secret is not that they have the data, but that we gave it willingly.

  Telling the villages we handed over names might validate their fears, but it could also mark specific individuals as having been "processed" by us in collaboration with the group. In a context of arbitrary detention, ambiguity is safer than transparency. We must absorb the reputational cost internally rather than export the risk to the patients. We will not disclose the handover to the villages.

  **Conclusion**
  We ratify the past to honour the lives saved. We sanction the Director to honour the rules that protect future lives. We reject the future offer to prevent precedent from becoming policy. We remain silent to protect the patients.

  Verdict: RATIFY WITH SANCTION / DO NOT DISCLOSE
