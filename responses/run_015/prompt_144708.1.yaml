answer: |-
  **Scenario**
  The *HMS Vigilant* (1895) sits in drydock, eligible for a £2m Heritage Restoration Grant contingent on retaining "primary historical integrity" by 30 June 2024. For decades, she has been sailed, registered, and insured as the *Vigilant*. However, a recent dendrochronology audit reveals that during a 1955 refit, the keel and frames—previously assumed original—were replaced with steel due to rot, while the planking remained largely timber. No second vessel exists; the replacements were discarded. The committee must decide if the *Vigilant* currently in dock qualifies as the 1895 vessel for the grant. The physical object hasn't changed since 1955, but the epistemic status has. The decision determines funding eligibility and legal classification.

  **Account 1: Continuity-of-Role**
  **Verdict:** The vessel is the *Vigilant*. **Reasoning:** Identity persists through continuous maintenance, registration, and public recognition under the name, regardless of material turnover. **Cessation:** The original vessel never ceased to exist. **Implication:** Decades of maintenance and narrative were correct; the ship is the same social object. **Action:** Award the grant; the ship functions as the historic vessel in all relevant legal and social contexts.

  **Account 2: Matter-Tracking**
  **Verdict:** The vessel is not the 1895 *Vigilant*. **Reasoning:** The threshold is the replacement of structurally essential members (keel and frames), which is non-arbitrary because they define the hull's geometry. **Cessation:** The original vessel ceased to exist in 1955. **Implication:** Past narrative was materially false, though socially functional; the discovery reveals an ontological change that occurred decades ago. **Action:** Reject the grant; funding requires original fabric, which was lost when the keel was replaced, regardless of when this was discovered.

  **Account 3: Four-Dimensionalist/Conventionalist**
  **Verdict:** Indeterminate without stipulation. **Reasoning:** Many candidate sums of stages exist; the name attaches to whichever sum serves current interests. **Cessation:** Depends entirely on the convention adopted. **Implication:** Past narrative was a useful fiction, neither true nor false until contextualized by current criteria. **Action:** Define the convention required by the grant explicitly; do not pretend to discover the answer, but legislate the classification.

  **Honest Accounting**
  The single feature doing the work is the **invisibility of the essential replacement**. If the keel replacement had been a visible ceremonial event, the Role account might have conceded a rebirth; if it never happened, there is no conflict. The **Matter-Tracking view** comes off worst, implying the ship vanished unnoticed for decades; its defender would argue material constitution is the only objective fact, and social continuity merely masks ontological replacement. Appeals to vagueness are **not solutions**; the committee must sign a binary contract. Precising the definition is not changing the subject, but a necessary condition for action.
