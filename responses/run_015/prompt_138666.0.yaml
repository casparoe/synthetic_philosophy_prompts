      *   *Response:* You can't force identical score distributions *and* identical base rates *and* keep the model fixed *and* maintain calibration. If $P(S|G)$ is identical and $P(Y|G)$ is identical, then $P(Y|S, G)$ is identical. This implies the model is perfectly fair already. If the model isn't perfectly fair, you can't resample to make both $S$ and $Y$ distributions identical without breaking the link between $S$ and $Y$ (i.e., breaking the model's utility).
      *   *Wait, user said:* "resample... so the two groups have identical base rates (and identical score distributions too, if that helps)".
      *   *Critique:* You can resample to match Base Rates ($P(Y|G)$). You cannot resample to match Score Distributions ($P(S|G)$) without discarding data based on $S$, which biases the evaluation of $P(Y|S)$. If you match $P(S|G)$, you are effectively evaluating the model on a subset of people where the score distribution is forced to match. This breaks the estimation of Calibration ($P(Y|S)$) because you've altered the denominator $P(S)$.
