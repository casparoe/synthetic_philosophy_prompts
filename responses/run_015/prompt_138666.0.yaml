          1.  Calibration within each group.
          2.  Equal False Positive Rates (FPR) across groups.
          3.  Equal False Negative Rates (FNR) across groups.
          *   *All at a specific threshold.*
      *   **Data Science (DS) Team's Objection:** Cites the "impossibility theorem" (Chouldechova 2017, Kleinberg et al. 2016). You can't have calibration + equal FPR + equal FNR unless base rates are equal or prediction is perfect.
      *   **User's Proposed Workaround:** Define an "official audit pool" by resampling historical data so that base rates (and score distributions) are identical across racial groups. Require the vendor to meet the criteria *on this pool*.
      *   **User's Rationale:**
          *   The impossibility result depends on the joint distribution.
          *   If we force the distribution to have equal base rates, the impossibility vanishes.
          *   If the model works on this "neutral benchmark," it works in the field (because the score function is fixed).
          *   Equalizing base rates corrects for label bias (differential arrest practices).
      *   **Questions:**
          1.  Is there a hole in this logic? (Need a crisp reason for an email).
          2.  If it fails, what should we actually do? (Pick criteria to drop, on what basis?)

  2.  **Evaluate the Workaround (The "Audit Pool" Strategy):**
      *   *Claim:* "If it satisfies all three conditions on the pool it satisfies them in the field too."
      *   *Analysis:* This is the critical flaw.
      *   *Calibration:* Calibration is $P(Y=1 | S=s, G=g) = s$. If the model is calibrated on the resampled pool, is it calibrated on the real population?
          *   Resampling changes the prevalence $P(Y=1|G=g)$.
          *   By Bayes' rule, $P(Y=1 | S=s) \propto P(S=s | Y=1) P(Y=1)$.
          *   If you change $P(Y=1)$ (the base rate) via resampling, you change the relationship between Scores and Outcomes *unless* the score $S$ is perfectly independent of $Y$ given $G$ (which it isn't, hopefully) or the score itself represents a likelihood ratio that is invariant to prevalence (which risk scores usually don't; they output probabilities conditional on the training distribution).
          *   *Crucial Point:* A risk score $S$ is usually an estimate of $P(Y=1|X)$. If you evaluate it on a dataset where you artificially manipulated the ratio of $Y=1$ to $Y=0$, the *observed* calibration will break.
          *   *Example:* Suppose the model outputs a score of 0.8. In reality, 80% of people with this score reoffend. If you downsample the non-reoffenders to match base rates, now only 50% of people with this score reoffend in your audit pool. The score is no longer calibrated *on the audit pool*.
          *   *Wait, the user says:* "We resample... so the two groups have identical base rates... and we require the vendor to hit calibration... on that pool."
          *   *Problem:* If the vendor's model is fixed, its scores are fixed. If you change the underlying base rate of the evaluation set, the *observed* calibration on that set will no longer match the scores.
          *   *Correction:* Maybe the user means the vendor must *recalibrate* on the pool? No, the text says "The score is one fixed function."
          *   *Conclusion:* You cannot demand a fixed scoring function be calibrated on a dataset with a different prevalence than the one it was trained/validated on, unless the scores are likelihood ratios (which they rarely are in this context) or you adjust the threshold (but calibration is about the score value itself).
          *   *Even if they recalibrate:* If you force equal base rates in the audit pool, you satisfy the mathematical condition for the impossibility theorem to vanish. *However*, the metrics (FPR/FNR) calculated on the audit pool will **not** hold in the deployment population.
          *   *Why?* FPR = $P(S > t | Y=0)$. FNR = $P(S \le t | Y=1)$. These depend on the score distribution conditional on outcome. Resampling $Y$ (changing base rate) does *not* change $P(S|Y)$ *if* you sample within $Y$ groups.
          *   *Wait, let's look closer at resampling.* If I take all $Y=1$ cases and all $Y=0$ cases, and I downsample $Y=0$ to match $Y=1$ counts.
          *   $P(S>t | Y=0)$ remains the same (assuming representative sampling within the $Y=0$ class).
          *   $P(S \le t | Y=1)$ remains the same.
          *   So FPR and FNR *estimates* are unbiased estimates of the true FPR/FNR.
          *   *But Calibration:* Calibration is $P(Y=1 | S=s)$. This *does* depend on base rates. $P(Y=1|S) = \frac{P(S|Y=1)P(Y=1)}{P(S)}$. If you change $P(Y=1)$ in the audit pool, the observed $P(Y=1|S)$ in the audit pool changes.
          *   *So:* A model calibrated on the real population will *fail* calibration on the resampled pool. A model calibrated on the resampled pool will *fail* calibration on the real population.
          *   *The User's Claim:* "If it satisfies all three conditions on the pool it satisfies them in the field too."
          *   *Verdict:* **False.** Specifically for Calibration.
          *   *What about FPR/FNR?* If the resampling is done correctly (stratified by Y), the FPR/FNR estimates are valid for the real population. So if the model has equal FPR/FNR on the pool, it has equal FPR/FNR in the field.
          *   *But the Impossibility Theorem:* The theorem says you can't have Calibration + Equal FPR + Equal FNR *given the real base rates*.
          *   If you force Equal FPR + Equal FNR (which is possible regardless of base rates, though hard), you break Calibration in the real world.
          *   If you force Calibration on the *Audit Pool* (where base rates are equal), the model is *not* calibrated on the *Real World* (where base rates are unequal).
          *   *Therefore:* The workaround creates a "paper compliance" situation. The vendor can pass the audit but fail the real-world legal requirement (because the legal team likely cares about real-world fairness, not audit-pool fairness).
          *   *Also:* The "Label Bias" argument. The user argues equalizing base rates corrects for differential arrest. This is a substantive policy claim, not a statistical fix. If the outcome $Y$ is "Arrest," and Group A is arrested more often for the same behavior than Group B, then $Y$ is biased. Resampling to equalize $Y$ doesn't fix the fact that the model predicts *Arrest*, not *Crime*. It just hides the disparity in the evaluation metric. It doesn't make the model fair in deployment; it makes the *evaluation* look fair while the model potentially exacerbates harm in the real population.

  3.  **Synthesize the "Hole":**
      *   **The Calibration Mismatch:** Calibration is prevalence-dependent. A model calibrated on a 50/50 audit pool is miscalibrated on a 30/70 real population. You cannot contract for a fixed score to be calibrated on two different distributions simultaneously.
      *   **The Metric Mismatch:** FPR/FNR are prevalence-independent (conditional on Y). So equalizing them on the pool *does* mean they are equal in the field. *However*, you still can't have Calibration (in the field) + Equal FPR + Equal FNR (in the field) if base rates differ in the field.
      *   **The "Paper Compliance" Risk:** If the vendor optimizes for the audit pool, they might sacrifice real-world calibration. When a judge asks, "What does a score of 0.8 mean?" and the vendor says "80% risk" (based on audit pool), but in reality it's 60% risk (due to real base rates), that's a liability.
      *   **The Label Bias Argument:** Resampling doesn't fix label bias; it masks it. If the goal is to ignore the bias in arrest data, you need a better outcome variable (e.g., "violent crime" vs "any arrest"), not a weighted evaluation set.

  4.  **Formulate the Advice (What to do instead):**
      *   Acknowledge the DS team is right about the impossibility theorem in the *deployment* population.
      *   Explain why the audit pool workaround fails (Calibration drift).
      *   Provide the standard trade-off advice:
          *   **Calibration** is usually prioritized for individual risk assessment (due process, accuracy).
          *   **Error Rate Balance (FPR/FNR)** is prioritized for group fairness (equalizing harm).
          *   **Recommendation:** Pick Calibration + One Error Rate (usually FPR, to avoid over-detaining low-risk groups). Or, use "Partial Satisfiability" (minimize the difference rather than requiring equality).
          *   **Better approach to Label Bias:** Don't fix it with resampling. Fix it by defining the outcome better or acknowledging the limitation.

  5.  **Drafting the Email/Response:**
      *   *Tone:* Professional, authoritative, clear, actionable.
