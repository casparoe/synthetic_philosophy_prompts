      *   Make sure to distinguish between $P(Y|S)$ (Calibration) and $P(S|Y)$ (FPR/FNR).
      *   Resampling $Y$ changes $P(Y)$.
      *   $P(Y|S)$ changes when $P(Y)$ changes (Bayes Rule).
      *   $P(S|Y)$ stays the same (if sampling is random within Y).
      *   Therefore: You can enforce Equal FPR/FNR via the pool, and those will hold in the field. BUT, you cannot enforce Calibration on the pool and expect it to hold in the field.
      *   Consequently, you still face the impossibility trilemma in the *field*. The contract would require the vendor to pass the audit (Calibration on Pool + Equal Errors on Pool). This implies Equal Errors in Field + Calibration on Pool. But since Calibration on Pool $\neq$ Calibration in Field, the Legal Team's requirement (Calibration in Field + Equal Errors in Field) is *still* impossible. The contract would be asking for something the vendor can technically pass but functionally fail.

  7.  **Final Polish:**
      *   Ensure the distinction between "Audit Pool Metrics" and "Deployment Metrics" is sharp.
      *   Address the "Label Bias" argument specifically, as that's the policy justification.
      *   Give concrete alternatives for the contract language.

  8.  **Self-Correction/Edge Case Check:**
