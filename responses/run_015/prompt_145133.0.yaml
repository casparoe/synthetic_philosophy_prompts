answer: |-
  ### Sunday Philosophy Group — Exam Question #4
  **Topic:** Particularism vs. Generalism (Fade vs. Flip)
  **Time:** 90 Minutes
  **Word Limit:** Max 900 words

  **The Question:**
  Distinguish between 'fade-cases' and 'flip-cases' regarding moral reasons. Explain why flip-cases pose a deeper problem for generalism than fade-cases. Evaluate the strongest generalist response to flip-cases (do not attack a strawman). Argue whether a hedged principle can actually guide someone who cannot already tell whether their case is a 'normal' one. Finally, decide whether this dispute is really about what reasons *exist*, or about what moral *judgement* consists in. Conclude with a definite verdict on which framework better describes how we should argue about actual cases.

  ***

  ### Model Answer (810 words)

  To understand the deadlock between generalism and particularism, we must first separate two types of counter-example. A **fade-case** is where a feature remains a reason in the same direction but is outweighed. If I promise to meet you but my child falls ill, the promise still counts as a reason to meet you, it is just overridden by the emergency. Generalism handles this easily with concepts like "pro tanto" duties or weighing mechanisms. A **flip-case**, however, is where a feature switches valence entirely. Usually, causing pleasure is a reason for an action; but if the pleasure is derived from someone's humiliation, that same feature (causing pleasure) becomes a reason *against* the action. The feature hasn't just been outweighed; it has changed sides.

  Flip-cases are the real battleground because they attack the structural integrity of generalism, not just its accounting. In a fade-case, the generalist can say the principle holds but loses the vote. In a flip-case, the principle seems to vanish or reverse. If "causing pleasure" is a reason for acting, it should be so universally, unless there is a defeater. But in the humiliation case, the pleasure isn't just defeated; it is constitutive of the wrong. This suggests holism: a feature's status as a reason depends on the context, not just on the feature itself plus a separate exception clause.

  The strongest generalist reply is not to deny flips, but to refine the principle. They argue that principles are defaults with hedges. The principle isn't "causing pleasure is good," but "causing pleasure is good *in the absence of humiliating conditions*." They claim principles are stable if stated precisely enough. The failure of a principle in a specific case calls for an explanation, and that explanation can be codified into a more complex principle. This saves generalism from falsification by turning apparent flips into hidden fade-cases where the complex conditions weren't met.

  However, this defense collapses under the **guidance critique**. A principle is only useful if it helps someone decide what to do. If the principle reads "Causing pleasure is good, unless the context makes it bad," it offers no help to someone who cannot already tell whether the context makes it bad. To apply the hedge, the agent needs the very moral judgement the principle was supposed to provide. If you need to know the right answer to apply the rule, the rule is empty. If you simplify the rule to make it usable, it becomes false (because of flip-cases). Generalism is thus trapped between being useless (too complex to guide) or empty (too simple to be true).

  This reveals that the dispute is not primarily about what reasons *exist*—both sides agree pain is usually bad and promises usually bind. The dispute is about what moral *judgement* consists in. Generalism assumes judgement is the application of codified rules. Particularism assumes judgement is a perceptual skill, like recognizing a face, where no amount of rule-listing captures the recognition. The particularist claims we learn morality by seeing cases and developing sensitivity, not by memorizing statutes.

  This raises the worry that particularism makes a general claim of its own: "There are no invariant moral reasons." If true, isn't that a general principle? This is not a fatal contradiction, but a confusion of levels. The claim "there are no invariant reasons" is a claim about the structure of ethics, not a first-order moral rule like "do not lie." It is a grammatical remark about how moral language works, not a move within the game. It warns us not to look for a rulebook where there is only practice.

  **Verdict:** Particularism provides the better framework for arguing about actual cases. Generalism encourages us to search for exceptions to rules when we should be looking at the specific texture of the situation. When we argue, saying "that's different" is more honest than "that's an exception to rule X." We should treat moral reasoning as case-based comparison rather than rule-application. Generalism offers the comfort of structure, but particularism offers the honesty of actual practice. We should argue as particularists, even if we teach using generalisms as rough shortcuts.

  ***

  ### Marking Scheme (Out of 20)

  **1. Distinction between Fade and Flip (4 marks)**
  *   **Must hit:** Clearly defines fade as weighing/outweighing and flip as valence-switching.
  *   *Common Error:* Treating a flip-case as just a really heavy fade-case (e.g., "the badness just outweighed the goodness").

  **2. Why Flip is the Core Challenge (4 marks)**
  *   **Must hit:** Explains that flips threaten the stability of the reason itself, not just the outcome of the weighing.
  *   *Common Error:* Saying generalism can't handle exceptions at all (ignoring 'pro tanto' or 'default' machinery).

  **3. Strong Generalist Reply (4 marks)**
  *   **Must hit:** Charitably presents the 'hedged principle' or 'default + explanation' argument.
  *   *Common Error:* Attacking a strawman (e.g., "Generalists think rules never have exceptions").

  **4. The Guidance/Empty Critique (4 marks)**
  *   **Must hit:** Argues that needing judgement to apply the hedge makes the principle redundant for guidance.
  *   *Common Error:* Assuming principles are meant to describe reality rather than guide action (missing the 'useless vs. empty' trap).

  **5. Verdict on Dispute Level & Conclusion (4 marks)**
  *   **Must hit:** Identifies the dispute as about judgement/epistemology and takes a definite side on utility.
  *   *Common Error:* **Fence-sitting.** Answers concluding "both have merits depending on definition" are capped at 10/20 total.

  ***

  **Note on the Model Answer:**
  The model answer leans on a contested reading of Generalism: it assumes Generalism claims principles must be *action-guiding* for novices. Some Generalists argue principles are only for regulating those who already have judgement, or for post-hoc justification. If your group reads Generalism as merely a claim about metaphysical structure rather than epistemology, the "guidance critique" in paragraph 4 will feel like a missed target.
