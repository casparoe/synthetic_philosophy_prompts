answer: |-
  Pre-argument Sketch:
  1.  **Deconstruct the Protestant Work Ethic (PWE):** Originally bounded by divine will. Secularization removes the boundary.
  2.  **Define Karoshi:** Not an accident, but the physical limit of infinite accumulation.
  3.  **Critique Labor Movements:** The 35-hour week assumes workers own time. They don't; capital does.
  4.  **Reframe Leisure:** It's maintenance, not freedom.
  5.  **Address Morality:** The plea for life assumes humanism; the system assumes optimization.
  6.  **Style:** Philosophical, dense, no citations, include 'teh' typos.

  ***

  To understand why *karoshi* is not a malfunction but a culmination, we have to look at what happens when a religious imperative loses its god but keeps its discipline. The original ethic of work was never about infinite production; it was about stewardship. You worked to glorify a deity, and since a deity is self-sufficient, there was a point where enough was enough. The theological brake was the idea that your time ultimately belonged to God, not to you, and certainly not to the market. There was a Sabbath because even the Creator rested. But when secularization strips away the theology, it leaves behind the machinery of compulsion without the off-switch. The calling becomes just the call. Accumulation stops being a means to spiritual assurance and becomes the only metric of validity.

  In this light, *karoshi* is not a tragedy that undermines the work ethic; it is teh logical endpoint of a system that no longer recognizes a boundary between living and laboring. If the purpose of existence is maximized output, then the body is merely a converter of hours into value. A machine that runs until it breaks isn't failing; it is fulfilling its design parameters. The shock we feel at death by overwork comes from a lingering humanist intuition that life has intrinsic value outside of productivity. But within the fully secularized logic of accumulation, that intuition is a relic. The system does not want you dead, precisely, but it values your output higher than your continuity. Death is an inefficiency, yes, but the risk of death is the necessary friction of running the engine at redline.

  This is why movements demanding a 35-hour week are fighting a phantom war. They presuppose a kind of temporal sovereignty—the idea that workers own their time and lease portions of it to employers. This made sense in agrarian rhythms or early craft guilds, where labor was tied to task completion or natural cycles. But once labor is fully abstracted into capital, time itself becomes the commodity. You do not sell your labor; you sell your lifespan in increments. To demand a cap on hours is to argue that there is a portion of your time that is not capitalizable. The market corrects this by colonizing leisure.

  We must stop pretending that leisure is a protected right. In the modern economy, leisure is just dormant human capital. When you rest, you are not escaping the system; you are undergoing maintenance so you can return to production. Sleep, exercise, and even entertainment are optimized for recovery and cognitive sharpening. If your downtime does not serve to recharge your productive capacity, it is viewed as wasteful. Therefore, the 35-hour week doesn't liberate time; it just schedules the recharge cycle more efficiently. Overwork is teh feature, not the bug, because the system requires constant pressure to prevent the realization that time is finite.

  The obvious moral objection is that people die, and we should prioritize saving lives over economic logic. But this objection fails to grasp that the moral framework of "saving lives" is external to the economic ontology we are discussing. To say "this kills people" is to invoke a humanist value system that the logic of absolute accumulation has already rendered obsolete. Within the strict bounds of this temporal morality, a life spent entirely in production is a life fully realized. The tragedy isn't that workers die; the tragedy is that they stop producing. To fix *karoshi* by limiting hours is to apply a bandage to a structural necessity. It treats the symptom while ignoring the diagnosis: that we have built a world where the only proof of life is work, and the only end of work is death.
