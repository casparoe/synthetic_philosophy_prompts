      *   *Crucial Insight:* The debate stalls because these layers are entangled. You can't separate the *is* from the *ought* easily here because the *is* (generalization) has immediate *ought* consequences (policy, prejudice).

  5.  **Drafting the Diagnosis (Iterative Process):**

