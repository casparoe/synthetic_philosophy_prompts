      *   **Task:** Diagnose the structure of the disagreement (not adjudicate). Engage with commitments of each side. Determine if it's verbal, question-shifting, empirical, or structural.
      *   **Goal:** Define what would count as *progress* (formal model, conceptual distinction, or abandoning the frame).

  2.  **Analyze the "Loop":**
