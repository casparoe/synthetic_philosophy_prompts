answer: |-
  ### I. Good's Theorem: The Settled Core

  To analyze the 2020 A-level controversy through I.J. Good's framework, we must first distinguish the mathematical theorem from its philosophical application. The core result, published by I.J. Good in 1967, is a settled theorem within Bayesian decision theory. It states that for a rational agent maximizing expected utility, the expected value of free information is non-negative. In simpler terms: *ex ante*, you should never expect to be worse off by acquiring relevant information before acting, provided you remain free to use or ignore that information.

  **Settled Conditions:**
  Philosophers and decision theorists agree on the formal conditions required for the theorem to hold:
  1.  **Well-Defined Utility Function:** The agent must have consistent preferences over outcomes that can be represented numerically.
  2.  **Unrestricted Agency:** The agent must be free to choose any available action after receiving the information. If the agent is committed to a specific action *regardless* of the information, the information has zero value, not negative value.
  3.  **Costless Information:** The theorem applies to the *value* of the information itself. If acquiring the information incurs a cost (financial, temporal, or psychological), that cost is subtracted from the gross value. Good's result concerns the net value only when the acquisition cost is zero or already accounted for.
  4.  **Instrumental Rationality:** The agent updates beliefs via conditionalization (Bayes' rule) and selects the action that maximizes expected utility relative to those updated beliefs.

  **Contested Boundaries:**
  Where consensus ends is in the application of this formalism to complex human institutions. It is contested whether "utility" can capture non-instrumental values (like dignity), whether "freedom of action" is ever truly present in institutional contexts bound by prior commitments, and whether the *process* of gathering information can violate moral side-constraints independent of the outcome. These are not mathematical errors in Good's theorem but debates about the scope of decision-theoretic modeling.

  ### II. Mapping the A-Level Episode to Good's Framework

  In the 2020 episode, the primary decision-maker was the UK Government (specifically the Department for Education and Ofqual).

  **The Information Streams:**
  1.  **Teacher Predicted Grades (TPGs):** Initial evidence regarding student ability.
  2.  **Historical School Data:** Algorithmic input intended to correct perceived inflation in TPGs.
  3.  **Public Reaction:** Evidence regarding social stability, political capital, and perceived fairness.

  **The Actions:**
  1.  **Algorithmic Moderation:** Downgrade TPGs based on historical data.
  2.  **Reversal:** Accept TPGs despite concerns about inflation.

  **Instrumental Analysis (Where the Theorem Holds):**
  From a strictly instrumental perspective, Good's theorem explains the reversal perfectly. Initially, the Government assigned high probability to the state "TPGs are inflated" and high utility to "maintaining grading standards." The historical data was acquired to reduce uncertainty about student ability. Under this utility function, the information had positive expected value.

  However, the **Public Reaction** constituted a new information stream. This information updated the Government's beliefs about the state of "political stability" and "public trust." Once this information was received, the expected utility of the "Algorithmic Moderation" action plummeted (due to the cost of protests, legal challenges, and loss of legitimacy), while the expected utility of "Reversal" rose. Acquiring this second stream of information (the protest) had positive value because it allowed the Government to switch actions to avoid a worse outcome. In this specific sense, the theorem holds: more information (about public sentiment) prevented a policy disaster.

  ### III. The Expressive Dimension: Where the Theorem Falls Silent

  The controversy arises not from the political reversal, but from the initial deployment of the algorithm. You ask whether the algorithm's information had *negative value* in a dimension Good's theorem fails to register. Specifically, you highlight the distinction between **instrumental value** (accuracy) and **expressive value** (moral status).

  **The Expressive Harm:**
  The use of historical school data was not merely a neutral statistical correction; it expressed a judgment that students from disadvantaged schools were less credible than those from wealthy schools, regardless of individual merit. This is an *expressive harm*. In decision-theoretic terms, standard models treat harm as a consequence of a (State, Action) pair (e.g., "Student gets a lower grade"). However, expressive harm suggests that the *use of the information itself* constitutes a harm, independent of the grade outcome.

  **Good's Silence:**
  Good's theorem is silent on this dimension for two structural reasons:
  1.  **Information as Evidence, Not Act:** Good's framework treats information as a passive update to probability distributions ($P(State|Info)$). It does not model the *acquisition* or *deployment* of information as a moral act that changes the normative landscape. If the utility function does not explicitly include a penalty for "expressing disrespect," the theorem cannot calculate the negative value of that expression.
  2.  **The Separation of Epistemic and Moral:** Good's result assumes that epistemic evaluation (how much does this data tell me about the world?) is separable from moral evaluation (is it right to use this data?). The theorem dictates that if the data improves your prediction of the world, it is instrumentally valuable. It has no mechanism to register that a piece of data might be *epistemically useful* (it predicts grades well) but *morally toxic* (it relies on classist proxies).

  If the Government's utility function had included a term for "non-discrimination" or "dignitary respect," the theorem would have advised against using the historical data *if* the agent correctly anticipated the expressive harm. However, the controversy suggests the harm was not just in the outcome, but in the *epistemic reliance* on historical disadvantage. This suggests a failure to encode moral constraints into the utility function, rather than a failure of the theorem itself.

  ### IV. Coercion and Uncoerced Agency

  A critical condition of Good's theorem is **unrestricted choice of action**. The A-level episode reveals a tension here.

  **Institutional Pre-commitment:**
  Ofqual and the Government effectively pre-committed to the algorithm before fully processing the teacher predictions or the potential social fallout. By binding themselves to the algorithmic output, they restricted their future agency. Good's theorem guarantees non-negative value only if the agent is free to *ignore* the information. If an institution creates a rule that says "We *must* act on this data," they have violated the condition of free choice. In this scenario, information can indeed be harmful because it forces the agent into a suboptimal action they are no longer free to avoid.

  **Coercion by Public Reaction:**
  One might argue the Government was "coerced" by the public protest into reversing course. In decision theory, coercion alters the payoff structure (adding penalties for non-compliance). If we view the protest as new information about the payoff matrix (i.e., "Reversal is now cheaper than Enforcement"), the theorem still holds. However, if we view the situation as one where the Government lost the *authority* to decide (a loss of agency), then the conditions for Good's theorem are no longer met. The "negative value" of the algorithmic information was realized because the institution lacked the flexibility to discard it without catastrophic cost.

  ### V. Epistemic vs. Moral Evaluation

  Finally, does the episode show that Good's theorem depends on a hidden assumption that epistemic evaluation can be cleanly separated from moral evaluation?

  **The Assumption:**
  Yes. Good's framework assumes that the value of information is derived solely from its ability to correlate actions with states of the world to maximize utility. It treats the *source* and *nature* of the information as morally neutral inputs.

  **The Challenge:**
  The A-level case supports the philosophical contention that epistemic and moral evaluations are entangled. The historical data was rejected not because it was *false* (it accurately reflected historical trends), but because using it was *unjust*. This aligns with contemporary debates in "moral encroachment," where moral stakes raise the evidential threshold required for belief or action.

  If the moral status of the students affects the *permissibility* of using the data, then the "utility" of the information is not just a function of its accuracy. Good's theorem does not forbid including moral constraints in the utility function, but it does not *require* it. The theorem is agnostic. The failure in the A-level case was a **modeling failure**: the decision-makers operated with a utility function that prioritized statistical standardization over dignitary fairness. Good's theorem faithfully executed that flawed utility function.

  ### VI. Conclusion: Settled Math vs. Contested Application

  To summarize for your seminar:

  1.  **Settled:** Good's theorem is mathematically robust under its specific axioms (free agency, well-defined utility, costless info). It correctly predicts that the *public reaction* information had positive value in averting a political crisis.
  2.  **Contested:** The application of the theorem to cases involving **expressive harm** is philosophically contested. Critics argue that standard decision theory cannot capture harms that reside in the *use* of information rather than the *outcome*.
  3.  **The A-Level Verdict:** The episode does not disprove Good's theorem. Instead, it reveals that the theorem's scope is limited to **instrumental decision-making**. It falls silent on the **expressive dimension** unless that dimension is explicitly quantified in the utility function.
  4.  **The Hidden Assumption:** The case strongly suggests that Good's framework assumes a separation between epistemic utility (accuracy) and moral constraint (fairness). When these are entangled—as they are in grading, which is both a prediction and a recognition of worth—the theorem requires significant augmentation (e.g., moral side-constraints) to remain action-guiding.

  The "negative value" of the algorithmic information was not a violation of Good's math, but a violation of the **human context** in which the math was applied. The information was instrumentally useful for standardization but expressively harmful for social cohesion. Good's theorem captures the former; it requires philosophical extension to address the latter.
