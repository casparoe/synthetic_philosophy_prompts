      *   *Good's Lens:* Good's theorem says acquiring the data (historical performance) shouldn't lower expected utility *if* the utility function captures all relevant values.
      *   *The Catch:* If the utility function *only* values grading accuracy, the info has positive value. If the utility function *also* values fairness, dignity, or social stability, the calculation changes.
      *   *The Expressive Dimension:* The prompt asks about information carrying expressive weight (judging moral status). Good's theorem treats information as probabilistic evidence about states of the world. It does not inherently model the *act of using* information as a signal of disrespect.

  5.  **Address the Expressive vs. Instrumental Distinction:**

      *   *Instrumental:* Does the info help maximize the goal (accurate grades)?
      *   *Expressive:* Does using the info signal something harmful (e.g., "poor students aren't credible")?
      *   *Good's Scope:* Good's theorem is strictly instrumental regarding the utility function. If "dignity" is in the utility function, the theorem holds. If "dignity" is an external constraint or a property of the *information gathering process itself* that isn't captured in the outcome utility, the theorem falls silent.
      *   *The "Separation" Assumption:* Does the theorem assume epistemic evaluation (is this data true?) is separate from moral evaluation (is it right to use this data)? Yes, formally. The theorem cares about $P(State|Info)$, not the moral provenance of the Info.

