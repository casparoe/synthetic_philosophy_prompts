      3.  **Instrumental Value vs. Expressive Harm:** Analyze where the theorem explains the reversal (political info had value) and where it struggles (algorithmic info had expressive cost).
      4.  **The Separation of Epistemic and Moral:** Discuss if the theorem assumes this separation.
