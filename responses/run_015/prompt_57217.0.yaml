answer: |-
  **Scenario**
  In 2024, Alameda County places Measure K on the ballot, a $500 million seismic retrofit bond for public schools. The objective truth is binary: the schools *do* require immediate retrofitting to meet state safety codes (Truth = Yes). Voters are 100,000 registered residents who possess fragmented private information (neighborhood soil reports, local contractor estimates, property value trends) yielding an individual competence of $p=0.55$. The County Fiscal Analyst releases the mandated impartial pamphlet analysis, which is unbiased ($E[Signal] = Truth$) but subject to model uncertainty, yielding a signal competence of $p=0.65$. Rational voters Bayesian-update, weighting the official analysis heavily due to its institutional authority, raising their individual expected competence to $p=0.62$. However, because every voter conditions on the *same* Analyst report, their errors become correlated; if the Analyst's model draws a noisy "No" recommendation (which happens 35% of the time), the majority of the electorate simultaneously updates toward the wrong verdict.

  **Rough Numbers**
  *   **Individual Competence (No Analysis):** $p_{ind} = 0.55$ (Independent errors)
  *   **Individual Competence (With Analysis):** $p_{ind} = 0.62$ (Correlated errors)
  *   **Collective Accuracy (No Analysis):** $P_{group} \approx 0.999$ (Law of Large Numbers)
  *   **Collective Accuracy (With Analysis):** $P_{group} \approx 0.65$ (Bounded by Expert Accuracy)

  ***

  **1. The Straightforward JCT Prediction**
  A naive Condorcet Jury Theorem (CJT) optimist observes that the publication of the analysis raises individual competence from $0.55$ to $0.62$. Leaning on the assumption of **voter independence**, the theorem predicts that as $N \to 100,000$, the probability of a correct majority verdict should approach 1.0 even faster than before. The optimist calculates that the "information gain" (higher $p_{ind}$) strictly dominates, concluding that the pamphlet makes the democracy epistemically robust. They miss that the theorem's convergence guarantee collapses if the independence assumption is violated, treating the expert analysis as just another set of $N$ independent signals rather than a single common signal broadcast to $N$ people.

  **2. The Mechanism: Where Independence Leaks**
  The deterioration occurs because the expert analysis introduces a **common noise term** into every voter's calculation. Without the analysis, voter error is $\epsilon_i \sim N(0, \sigma^2_{private})$, which sums to zero across the population. With the analysis, voter error becomes $\epsilon_i = \epsilon_{common} + \epsilon_{private}$, where $\epsilon_{common}$ is the Analyst's model error. While $E[\epsilon_{common}] = 0$ (unbiased), the *realization* of $\epsilon_{common}$ is fixed for the election. If the Analyst draws a negative error (recommending "No" when Truth is "Yes"), every voter's posterior shifts negatively. Because rational voters weight the high-authority signal heavily, the variance of $\epsilon_{common}$ overwhelms the cancelling-out of $\epsilon_{private}$. The electorate effectively becomes a single agent with competence $0.65$; the "wisdom of crowds" is replaced by the "fragility of the expert." The voters are strictly better informed *ex-ante* (lower expected MSE), but the *ex-post* collective verdict is held hostage to the single draw of the public noise.

  **3. The Counterfactual: Why No Analysis is Better**
  In the counterfactual where the Analyst's pamphlet is withheld, voters rely solely on their private signals ($p=0.55$). While any individual voter is more likely to be wrong than in the analysis scenario ($0.45$ vs $0.38$ error rate), the errors are uncorrelated. By the Law of Large Numbers, the aggregate vote converges almost certainly to the Truth. We know this outcome is "better" because the ground truth (the engineering necessity of the retrofit) is objective. In the "No Analysis" run, the vote passes (Correct) with $>99\%$ probability. In the "Analysis" run, the vote fails (Incorrect) whenever the Analyst's model produces a false negative ($35\%$ probability). The "No Analysis" regime yields a correct verdict more often, despite every voter being less informed.

  **4. The Single Feature and Removal**
  The feature doing the work is **signal centralization**. The analysis is a single point estimate published to the entire electorate simultaneously. If you remove this by **disaggregating the analysis**—e.g., the County publishes raw data models that local school boards interpret independently for their districts—the common noise term fractures into regional noise terms. Correlation drops, effective $N$ rises, and the collective verdict accuracy recovers toward 1.0. Alternatively, if the office publishes the **confidence interval** rather than a recommendation, and voters are heterogeneous in their risk tolerance, the weighting of the signal varies, reducing the correlation coefficient $\rho$ and mitigating the systemic risk.

  **5. Critique and Defense**
  A transparency advocate would attack this case by arguing that an individual competence of $0.55$ is unrealistic for complex fiscal measures; without the analysis, voters are essentially guessing based on irrelevant heuristics (party ID, name recognition), meaning the "private signal" is actually biased, not just noisy. If the private signals are biased ($p < 0.5$), the CJT doesn't apply, and the expert analysis is the only tether to truth.
  *Does it land?* Partially. If private information is systematically biased, the crowd cannot self-correct. However, this concedes the core point: the CJT optimist's claim that "more information → better aggregation" relies entirely on the *structure* of that information. If the only available public information is centralized, you trade variance reduction (individual accuracy) for correlation increase (systemic fragility). The attack validates the tradeoff rather than refuting it; it simply argues that in the real world, the independence loss is worth the bias correction. But for the specific theoretical claim that *publishing unbiased analysis always improves collective truth-tracking*, the case holds: it does not.
