answer: |-
  **Joint Statement on the Etiology of Perpetration: A Framework for Empirical Resolution**

  **1. Agreed Claims**

  We, the undersigned, having engaged in a decade of debate regarding the motivations of perpetrators in the occupied East, submit the following propositions as the baseline for our collaborative research. We acknowledge that previous disputes often conflated distinct phenomenological variables and causal roles. To remedy this, we agree to decompose the phenomenon of perpetration into four outcome variables: (i) *uptake* (participation when exit is available); (ii) *latency* (time or priming required before first killing); (iii) *excess* (cruelty beyond operational necessity); and (iv) *avowal* (post-hoc accounts of motive). Furthermore, we distinguish three causal roles: *selectors* (factors determining unit assignment), *triggers* (factors initiating specific acts), and *sustainers* (factors maintaining participation over time).

  1.  The population of perpetrators was not selected for psychopathy or pre-existing criminality; they were demographically representative of their generation.
  2.  Formal refusal to shoot was possible without formal penalty, though social costs varied by unit cohesion and commanding officer.
  3.  Orders were a necessary condition for the organisation of massacres but not a sufficient explanation for individual uptake rates.
  4.  A merely sufficient situational account must explain why uptake rates varied between units facing identical orders.
  5.  A merely sufficient cultural account must explain why uptake rates varied within units drawn from identical home districts.
  6.  Antisemitic ideology was widespread in Germany but varied in intensity and actionable radicalism across regions and individuals.
  7.  Situational pressure was not static; it escalated over time through routinisation and brutalisation.
  8.  Alcohol was employed as a lubricant but was not a universal prerequisite for participation.
  9.  Non-shooting roles (cordon, logistics) were available and utilized by some men who refused direct killing.
  10. Interrogation transcripts are flawed by post-war legal incentives but contain consistent patterns regarding latency and excess.
  11. Home-district political history prior to 1933 is a valid proxy for pre-existing cultural mobilisation.
  12. Unit rosters and rotation logs allow for the precise dating of exposure to killing operations.
  13. The *Order Police Personnel Corpus* (11,000 men) linked with interrogation data (3,000 transcripts) provides the necessary granularity to test competing hypotheses.
  14. The Satellite Corpus (Volksdeutsche and non-German auxiliaries) provides a control group for cultural specificities.
  15. Neither culture nor situation acts alone; the dispute concerns the weighting of these factors across the four outcome variables.

  *Note: Claim 15 risks vacuity if interpreted as "both matter somewhat." We sign it only on the condition that "weighting" refers to measurable variance explained in the Corpus, not philosophical compatibility.*

  **2. Disagreements**

  Despite methodological alignment, substantive disagreements remain regarding which factors drive which variables. The following table articulates these divergences using the agreed terminology.

  | Crux | Situationalist Formulation | Culturalist Formulation | Genuine or Verbal |
  | :--- | :--- | :--- | :--- |
  | **Primary Driver of Uptake** | Uptake is primarily a function of *trigger* variables: immediate peer pressure, authority presence, and fear of shame within the unit. | Uptake is primarily a function of *selector* variables: internalised eliminationist antisemitism making killing congruent with worldview. | Genuine |
  | **Explanation of Excess** | Excess is a *sustainer* effect: desensitisation and brutalisation over time reduce inhibition against gratuitous cruelty. | Excess is a *trigger* effect: ideological zeal motivates initiative and humiliation beyond what orders require. | Genuine |
  | **Role of Refusal** | Refusal proves the situation was not coercive; those who killed did so due to situational conformity, not inevitable ideology. | Refusal proves the rule; those who stayed and killed did so willingly, distinguishing themselves from the exceptional refusers. | Verbal |
  | **Validity of Avowal** | Avowals of "just following orders" are largely accurate descriptions of the *trigger*; ideological avowals are post-hoc rationalisations. | Avowals of ideological motive are authentic expressions of the *selector*; claims of coercion are legal survival strategies. | Genuine |

  **3. Cruxes and Tests**

  To resolve genuine disagreements, we propose three specific tests using the *Order Police Personnel Corpus* and the Satellite Corpus. We agree in advance on what evidence would compel us to revise our positions.

  **Test A: The Invariance Test**
  *Method:* Hold the situation roughly fixed (same unit, same locality type, same commanding officer) and vary the measured home-district antisemitic mobilisation (pre-1933 voting patterns).
  *Prediction (Situationalist):* Uptake and excess will show no significant correlation with home-district ideology. Situational pressure overrides background.
  *Prediction (Culturalist):* Uptake and excess will correlate strongly with home-district ideology. Men from high-mobilisation districts will show lower latency and higher excess.
  *Falsification:* The Situationalist concedes if men from low-mobilisation districts show significantly lower uptake under identical command. The Culturalist concedes if men from high-mobilisation districts refuse at rates identical to those from low-mobilisation districts when peer pressure is removed.

  **Test B: The Transport Test**
  *Method:* Hold cultural background fixed (same home district) and vary situational pressure (e.g., comparing units where the commanding officer was present versus absent during shootings, or where exit offers were explicit).
  *Prediction (Situationalist):* Uptake will vary significantly based on officer presence and exit protocols.
  *Prediction (Culturalist):* Uptake will remain stable regardless of officer presence, as the internal cognitive model drives participation.
  *Falsification:* The Situationalist concedes if uptake remains constant despite the removal of authority figures. The Culturalist concedes if uptake drops precipitously when the commanding officer is absent.

  **Test C: The Auxiliary Comparison**
  *Method:* Compare German Order Police with non-German auxiliaries (Satellite Corpus) operating under identical German command structures and orders.
  *Prediction (Situationalist):* Uptake rates will be similar across groups, indicating situational pressure is the universal driver. Excess may vary due to local feuds, not German culture.
  *Prediction (Culturalist):* German units will show higher uptake and significantly higher excess than auxiliaries, indicating a specific German cultural model.
  *Falsification:* The Situationalist concedes if German units show consistently higher uptake than auxiliaries under identical coercion. The Culturalist concedes if auxiliaries match German units in excess cruelty without shared ideological socialisation.

  **4. The Dispute We No Longer Have**

  Having defined our terms and tests, we acknowledge that portions of our past decade of debate were verbal rather than substantive. We agree to dissolve the following quarrels:

  *   **Willingness:** We agree this term was doing double duty. For the Situationalist, "willing" meant "not physically coerced." For the Culturalist, it meant "ideologically motivated." We will henceforth distinguish *compliant participation* from *zealous participation*.
  *   **Ordinary:** We agree this was a demographic claim, not a moral one. The Situationalist used it to denote "not selected for pathology." The Culturalist used it to denote "representative of the national culture." We accept both definitions as compatible: men can be demographically ordinary and culturally representative.
  *   **Culture:** We agree that "culture" was sometimes used as an explanation and sometimes as a redescription of aggregate behaviour. We commit to treating culture as a measurable variable (via home-district proxies) rather than a metaphysical essence.
  *   **Monocausality:** We acknowledge that neither side ever truly argued for a single cause in isolation. The Culturalist accepts situational triggers exist; the Situationalist accepts cultural background exists. The dispute is strictly about the *variance explained* in the Corpus.

  By isolating these verbal disputes, we reduce the remaining disagreement to empirically testable claims regarding the weighting of situational triggers versus cultural selectors. We commit to accepting the results of the proposed tests as the final adjudicator of these remaining cruxes.
