      *Debrief:* Needs to be the meat of the philosophical lesson.

      *Final check on the "Structural Misalignment" thesis:* The debrief must explicitly prevent the "bad apples" theory. I will add a specific instruction for the facilitator to collect the decision sheets and reveal that *everyone* faced the same incentive, even if actions varied.

      *Limitation:* The big one is time. Ecological collapse takes centuries; this takes 20 minutes. Also, in the sim, you can just "reset." In reality, you can't. I need to make sure the facilitator emphasizes the *irreversibility* verbally.

