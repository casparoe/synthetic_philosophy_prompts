answer: |-
  Here is a complete design for a 90-minute session. It requires no prep other than cutting out the Role Cards below and having index cards/pens.

  ### The Setup
  *   **Participants:** 18 people.
  *   **Pot:** £4,000 (represented by 180 "Influence Points"). 1 Point = £22.22.
  *   **Causes:**
      1.  **Sanctuary** (Animal Welfare)
      2.  **Heritage** (Local Museum)
      3.  **Global** (Cost-Effective Charity)
  *   **Materials:** 18 Role Cards (cut from the list below), 18 Index Cards (for deals), pens, a whiteboard/flipchart.

  ---

  ### Part 1: The Rules (5 Minutes)
  *Do not mention "moral trade," "values," or "counterfactuals."*

  **Say this:**
  "We have £4,000 to allocate. Each of you controls 10 Influence Points. You can put them into Sanctuary, Heritage, or Global.
  There are two rounds.
  **Round 1:** Silent voting. No talking. Write your 10 points down on a slip. We tally them.
  **Round 2:** The Market. You have 25 minutes to make deals. You can swap points. 'I give you 5 points for Sanctuary if you give me 5 points for Heritage.' Deals must be written on index cards and signed by both parties.
  **Round 3:** Final Vote. You submit your final allocation.
  After that, we open the envelopes on your Role Cards for a debrief."

  ---

  ### Part 2: The Role Cards (Print & Cut)
  *Distribute these randomly as people arrive. Do not let them show the cards to each other.*

  **Type A: The Purists (8 People)**
  > **YOUR PREFERENCE:** You care deeply about **Sanctuary**.
  > **YOUR GOAL:** Maximize points for Sanctuary.
  > **TRADING:** You dislike the other causes. Only trade if you get at least 2 points of Sanctuary for every 1 point you give away.

  **Type B: The Locals (2 People)**
  > **YOUR PREFERENCE:** You care deeply about **Heritage**.
  > **YOUR GOAL:** Maximize points for Heritage.
  > **TRADING:** You are stubborn. You will only trade if you get a massive win for Heritage.

  **Type C: The Ghosts (3 People)**
  > **YOUR PREFERENCE:** You care deeply about **Heritage**.
  > **YOUR GOAL:** Maximize points for Heritage.
  > **TRADING:** You are willing to trade.
  > **SECRET:** You have already pledged £1,000 of personal money to Heritage tonight. You feel good about Heritage regardless of what this group does. You will vote for Heritage *even if you get no trades*. (Do not reveal this until the end).

  **Type D: The Traders (3 People)**
  > **YOUR PREFERENCE:** You are flexible. You like **Global** best, but you like money/impact anywhere.
  > **YOUR GOAL:** End the meeting with a deal you feel good about.
  > **TRADING:** You are the market makers. Initiate swaps.

  **Type E: The Skeptics (2 People)**
  > **YOUR PREFERENCE:** You are looking at **Global**.
  > **SECRET INFO:**
  > *   **Skeptic 1:** Your card says "Evidence: Global is 10x effective."
  > *   **Skeptic 2:** Your card says "Evidence: Global is likely a scam (0x effective)."
  > **TRADING:** Trade based on your evidence. Do not show your card to anyone.

  ---

  ### Part 3: The Timeline (90 Minutes)

  **00:00 – 00:05: Intro & Deal Cards**
  Hand out the Role Cards. Tell them to read silently.

  **00:05 – 00:15: Round 1 (The Deadlock)**
  *   Silent voting. Collect slips.
  *   Tally on the board.
  *   *Predicted Outcome:* Sanctuary wins (80 pts), Heritage gets some (20-50 pts), Global gets scraps. The Heritage/Global people will be visibly annoyed.
  *   *Facilitator Note:* Point out the dissatisfaction. "Look at the room. Half of you are unhappy with this outcome."

  **00:15 – 00:40: Round 2 (The Market)**
  *   Open floor. People stand up, mingle, negotiate.
  *   Deals must be written: *"Player X gives 5 Sanctuary pts to Player Y. Player Y gives 5 Heritage pts to Player X."*
  *   *Facilitator Note:* Watch the Ghosts (Type C). They will likely agree to trades easily because they don't *need* the win, they just want to be part of the group. Watch the Skeptics (Type E). They will argue about whether Global is worth buying.

  **00:40 – 00:50: Round 3 (Final Allocation)**
  *   Submit final points.
  *   Tally the result. Usually, this looks "better" (more spread out) than Round 1.
  *   Ask for a show of hands: "Who is happier now than in Round 1?" (Most will raise hands).

  **00:50 – 01:30: The Reveal & Debrief**
  *   This is where the work happens. See script below.

  ---

  ### Part 4: The Debrief Script
  *Do not lecture. Ask questions. Let them feel the sting of the reveal.*

  **Step 1: The Counterfactual (The Ghosts)**
  *   **You:** "We saw a lot of trades for Heritage points. People gave up Sanctuary votes to 'buy' Heritage support. Type C cards, please read your 'Secret' line out loud."
  *   *(The 3 Ghosts read: "You will vote for Heritage even if you get no trades.")*
  *   **You:** "Look at the deals you signed. If Type C was going to vote Heritage anyway, what did you actually buy?"
  *   **The Point:** You paid for a guarantee that already existed. The value of the trade sat in a counterfactual ("I wouldn't have done this otherwise") that was false. In the real world, this is when someone says "I'll support your project" but was already going to fund it. You gave up leverage for nothing.

  **Step 2: The Fact Disagreement (The Skeptics)**
  *   **You:** "Type E cards, read your 'Secret Info'."
  *   *(One says 10x effective, one says 0x effective.)*
  *   **You:** "Did anyone trade with these two? Did you notice they disagreed?"
  *   *(Likely no one noticed.)*
  *   **You:** "If you traded for Global points, you assumed you agreed on reality. You didn't. You gambled. If Skeptic 2 is right, the points you bought are worthless."
  *   **The Point:** Trading assumes shared values, not shared facts. If you disagree on facts (does this charity work?), trading is the wrong move. Investigation is the move.

  **Step 3: The "Moral Trade" Label**
  *   **You:** "This dynamic has a name. It's called **Moral Trade**. It's when we swap support on things we value differently to get a better total outcome."
  *   **You:** "Round 2 was better than Round 1 because trading *can* unlock value. But Round 2 was also fragile. It broke on hidden constraints (The Ghosts) and hidden facts (The Skeptics)."
  *   **You:** "Next week, when we allocate the real £4,000:
      1.  **Trade:** If you care less about X than I do, take my X points.
      2.  **Verify:** Ask 'Would you have done this anyway?' before you pay for support.
      3.  **Check Facts:** Don't trade on a cause until you agree on what it actually does."

  ---

  ### Predicted Failure Points (And how to handle them)

  1.  **Chaos in Round 2:** 18 people talking is loud.
      *   *Fix:* Enforce the "Written Deal" rule. If it isn't on an index card, it didn't happen. This slows the room down naturally.
  2.  **The Ghosts feel like liars:** They might feel bad about hiding their commitment.
      *   *Fix:* In the debrief, validate them. "In real life, we all have private constraints. The game isn't about honesty; it's about information asymmetry. The lesson is to *ask* about constraints, not to assume transparency."
  3.  **The Skeptics ruin the pot:** If they argue too hard about Global, trading stops.
      *   *Fix:* That's actually a win. It proves the point that fact-disagreements stall markets. Let them argue.
  4.  **Cynicism:** "This was rigged."
      *   *Fix:* Acknowledge it. "Yes, the game was rigged. That is exactly my point. Our real giving circle is rigged by invisible commitments and unspoken assumptions. This just made them visible."

  ### What This Game Can't Show (Say this out loud)
  *   **Relationship Damage:** In the game, trading is abstract. In reality, telling a friend "I don't care about your cause" to facilitate a trade can feel cold.
  *   **Reputation:** In the game, the Ghosts aren't punished. In reality, if you're caught "selling" a vote you already held, you lose trust.
  *   **Complexity:** Real causes aren't three buckets. They are nuanced.
  *   **The "Right" Answer:** The game doesn't tell you which cause *should* win. It only shows how to allocate resources given the preferences you have.

  ### Facilitator Cheat Sheet
  *   **If trading stalls:** Whisper to the "Traders" (Type D) to start offering swaps.
  *   **If someone asks about the Secret Info:** "Play your card as written."
  *   **If the Heritage vote is low:** Remind Type B and C that Heritage is their priority.
  *   **Key Phrase for Debrief:** "Did you buy influence, or did you buy confirmation?"
