prompt: |-
  Hi — I'm on the comittee of a small alumni giving circle: about 18 people, one 90-minute evening meeting, nothing fancier than index cards and pens available. A week after the meeting we have to split roughly £4,000 between causes, and we keep deadlocking: half the group cares only about animal welfare, two people care only about a local heritage project, a couple want to give wherever their own cost-effectiveness numbers point, and everyone leaves annoyed. I recently read about moral trade — the idea that people who disagree about values can still get gains from trade by each doing what the *other* wants, instead of compromising or fighting it out — and it clicked hard for our situation. I want the group to feel it rather than hear me explain it.

  Can you design a game for that slot? Two things I want them to run into on their own. First, that splitting the difference or voting is worse for everybody than trading is. Second, the part I can't stop thinking about: a lot of apparent trade is fake, because what's being sold is something the seller would have done anyway, so all the value sits in a counterfactual that nobody can actually check. Please rig it so a few participants are secretly in that position and the group only finds out at the end. I'd also like some pairs to disagree about *facts* rather than values, because I suspect trading is the wrong move there and I want them to discover why rather than be told.

  Give me the value cards, the rules and what's binding, a timeline, and a debrief mapping moments onto the idea. Commit to actual numbers and real card text instead of listing options, tell me what'll predictably go wrong the first time I run it, and be straight about what the game can't show and I'll have to say out loud myself. No lecture up front, and nobody should hear the phrase until the debrief.
