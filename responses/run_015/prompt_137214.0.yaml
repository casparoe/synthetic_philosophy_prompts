  you're a social epistemologist who's spent way too long thinking about conspiracy theories. please actually think this through properly — brainstorm a bit before you commit to anything, and if you need to split into more than one candidate principle then do that. I'm in a third-year epistemology seminar and we did conspiracy theories a couple weeks ago; the reading left me with more questions than answers and I want to get my own gut verdicts into some kind of order. don't give me citations or a reading list, I can't get at the library database from where I'm sitting and you'd only be guessing at paper titles — just give me the principle.

  here's my own attempt before the cases: a conspiracy hypothesis is ok for me to accept when (1) it doesn't require very many people to keep quiet, (2) I've got at least one piece of evidence that's more likely if the conspiracy is real than if the boring story is true, and (3) it doesn't have to explain away the absence of evidence. clause (1) already feels wrong to me and I'll say why lower down.

  cases and my verdicts:

  1. Five executives at a shipping company secretly agree to fix prices, and the emails turn up in discovery. Obviously real, obviously fine to believe. This isn't even what I'd call a conspiracy theory.

  2. The decades-long government study where a health service lied to several hundred Black men about their syphilis and let them go untreated. I'd have believed the whistleblower when he went to a reporter, and I think I'd have been right to. This one had a lot of people in on it over forty years.

  3. My university's admin quietly agreed with a big donor to bury a report that was embarrassing to the donor. Evidence: one leaked email chain, maybe eight people involved. I believe this at about 70%.

  4. The moon landings were staged in a studio. No. Not even slightly.

  5. A deadly attack was staged with paid actors — evidence is that some witnesses told inconsistent stories and one grieving relative looks a bit like someone in a photo from a different event. No, and I think reposting that stuff is genuinely blameworthy, not just mistaken.

  6. The health ministry here buried a study showing a common drug was unsafe. Evidence: the study was never published, and the official explanation for why has changed twice. I'm at about 40% and I do feel suspicious.

  7. Security services had specific foreknowledge of a big attack and let it happen. Evidence: they had informants close to the people who did it, and one chapter of the official inquiry is redacted. About 30%. I feel like I'm slipping into something here, but it also isn't crazy.

  8. My friend's theory where the reason there are no leaks is that everyone who knew is dead, and any leak you do find is a plant. No. This is the one that feels definately bad — nothing could ever count against it.

  9. A theory I half-believed about a local cover-up turned out to be false, but it turned out the institution had covered up something else, nearly as bad, for boring reasons. I still feel vindicated, and I don't think I want to give that up.

  10. A theory online whose content keeps sliding: first the pathogen was engineered, then it leaked from a lab, then it was natural but the funding got hushed up. I take the sliding as evidence against the people pushing it. Then I noticed my own suspicion in case 6 has also changed shape twice about what exactly is being covered up. Ouch.

  So: I reject reasoning from absence in 8 and rely on it in 6 and 7 — a missing study, a redacted chapter. I lean on headcount in 4 but case 2 has a big headcount and is real. I say sliding is a bad sign in 10 and I've slid myself.

  Two more things. First, that headcount clause: I don't think the number of people who know is the variable at all. What matters is something like how many of them would gain by talking, whether anyone would believe them, and whether there's an outlet that would print it. Someone in the readings had a calculation about how fast a secret of a given size leaks, and I remember thinking the input that was really doing the work wasn't headcount — no idea who it was or how they set it up, so don't bother telling me, just tell me what the right variable is and how to write the clause. Second, apply whatever you come up with to two cases I haven't given you: a conspiracy theory about something two hundred years ago where everyone involved is long dead, and a theory that's actually true but where my only evidence is a feeling that the official story is too neat.

  Give me the principle stated precisely enough that I could apply it myself, say which case motivated each clause, and be honest about which of my verdicts you think have to go.
