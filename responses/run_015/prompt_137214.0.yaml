answer: |-
  Here is the thing about conspiracy theories: they are not a distinct *kind* of proposition. They are just hypotheses about secret coordination. The epistemic problem isn't the content; it's the social mechanics of secrecy. Your intuition that "headcount" is the wrong variable is correct. A secret held by ten people who hate each other is less stable than a secret held by ten thousand people who all benefit from silence.

  You need a framework that separates **rational suspicion** (which licenses investigation) from **rational belief** (which licenses assertion and action). Your current draft mixes these.

  Here are the three constraints you need to replace your current principle. Think of them as a filter: if a hypothesis fails any one of these, you cannot rationally *believe* it, though you might remain *suspicious*.

  ### The Three Constraints on Rational Conspiracy Belief

  **1. The Defection Stability Constraint (Replaces your Headcount Clause)**
  *Motivated by Case 2 (Tuskegee) vs. Case 4 (Moon Landing).*
  A conspiracy hypothesis is rational to accept only if the incentive structure for the alleged conspirators makes silence the dominant strategy.
  *   **The Variable:** It is not $N$ (number of people). It is $E(D)$, the Expected Utility of Defection. You must estimate: (Reward for leaking) $\times$ (Probability of being believed) $-$ (Cost of leaking).
  *   **Why Case 2 passes:** In Tuskegee, the "conspirators" were operating within a rigid hierarchy where dissent meant career suicide, and the broader social context (racism) lowered the probability that a leak would be believed or acted upon. $E(D)$ was low.
  *   **Why Case 4 fails:** The moon landing involved thousands of contractors. For any single engineer, the reward for leaking (fame, book deal, moral vindication) is massive, and the cost in the 1960s/70s context was low relative to the potential payoff. $E(D)$ was high. The secret should have leaked immediately.

  **2. The Falsifiability Constraint (Addresses your Absence of Evidence worry)**
  *Motivated by Case 8 (Everyone Dead) vs. Case 6 (Missing Study).*
  A conspiracy hypothesis is rational to accept only if it specifies what evidence *would* prove it false, and that evidence is not systematically explained away by the theory itself.
  *   **The Distinction:** There is a difference between a **Gap** and a **Void**.
      *   A **Gap** (Case 6) is a specific, expected document or record that is missing where one should be. The official story predicts the record exists; the conspiracy story predicts it was destroyed. The absence is evidence *against* the official story.
      *   A **Void** (Case 8) is a general lack of confirmation. If the theory explains the lack of evidence *by positing the conspiracy itself* ("no leaks because everyone is dead/planted"), it is immunized. It treats the absence of evidence as evidence of the conspiracy's success, rather than evidence against the conspiracy's existence.
  *   **The Rule:** You cannot count absence of evidence as evidence of absence unless the evidence was *institutionally expected* to exist independently of the conspiracy claim.

  **3. The Explanatory Precision Constraint (Addresses your Sliding worry)**
  *Motivated by Case 10 (Sliding Theory) vs. Case 9 (Vindicated Distrust).*
  A conspiracy hypothesis is rational to accept only if the core mechanism of the conspiracy remains stable as new evidence arrives.
  *   **The Distinction:** **Refinement** vs. **Immunization**.
      *   **Refinement** (Acceptable): "I thought they buried Study A, but now I see they buried Study B." The core claim ("they bury safety data") remains constant; the specific instance updates. This is what happened in your Case 6.
      *   **Immunization** (Unacceptable): "The pathogen was engineered... okay, maybe it leaked... okay, maybe it was natural but funded secretly." Here, the *mechanism* changes to accommodate the failure of the previous claim. This indicates the believer is committed to the *conclusion* (something is wrong) rather than the *hypothesis*.
  *   **The Rule:** If the *method* of the alleged conspiracy changes to fit new data, your credence should drop, not stay level.

  ---

  ### Applying the Constraints to Your Cases

  Here is where your gut verdicts stand up to the filter, and where they need adjustment.

  *   **Case 1 (Shipping):** Passes all three. Trivial.
  *   **Case 2 (Tuskegee):** Passes Defection Stability (high cost to leak, low reward). Passes Falsifiability (whistleblower provided positive trace). **Verdict: Correct.**
  *   **Case 3 (University Donor):** Passes Defection Stability (8 people, high alignment). Passes Falsifiability (leaked email is positive trace). **Verdict: Correct.**
  *   **Case 4 (Moon):** Fails Defection Stability. **Verdict: Correct.**
  *   **Case 5 (Actors):** Fails Explanatory Precision. "Inconsistent stories" are noise, not signal. "Looks like someone in a photo" is pattern-matching, not positive trace. **Verdict: Correct.**
  *   **Case 6 (Drug Study):** Passes Falsifiability (Missing study is a Gap, not a Void). Passes Defection Stability (Health ministry is a small, hierarchical group). **Verdict: 40% is reasonable suspicion, but belief requires more.** You noted your suspicion "shifted shape." As long as the core claim ("they hid safety data") remained constant while the specific study changed, you are Refining, not Immunizing. **Verdict: Epistemically clean.**
  *   **Case 7 (Foreknowledge):** Fails Defection Stability slightly (security services are leaky), but Passes Falsifiability (Redactions are Gaps). **Verdict: 30% is the right credence for suspicion, but you cannot assert this as belief.** The "redacted chapter" is a Gap, but it's also consistent with standard classification, not just conspiracy.
  *   **Case 8 (Everyone Dead):** Fails Falsifiability. It explains away the lack of leaks by positing the conspiracy. **Verdict: Correct rejection.**
  *   **Case 9 (Vindicated Distrust):** This is the tricky one. You were wrong about the *object-level belief* (the specific cover-up), but right about the *meta-belief* (the institution is untrustworthy). **Verdict:** You are allowed to feel vindicated about the institution's character, but you must admit you were wrong about the event. Do not let the meta-vindication license future specific beliefs without evidence.
  *   **Case 10 (Sliding):** Fails Explanatory Precision. **Verdict: Correct rejection.**

  ---

  ### The Two New Cases

  **Case A: The Historical Conspiracy (200 years ago)**
  *Scenario:* A theory that a historical event (e.g., a battle, a treaty) was faked or manipulated, but everyone involved is dead.
  *   **Defection Stability:** Irrelevant. The actors cannot defect now.
  *   **Falsifiability:** High risk. We cannot interview witnesses. We rely entirely on archival Gaps.
  *   **Explanatory Precision:** Crucial.
  *   **Verdict:** You can only rationally believe this if there is a **documentary Gap** that the official story cannot explain (e.g., two contradictory primary sources from the day of the event, one suppressed). If the evidence is purely "it seems unlikely," you must reject it. The death of the conspirators makes the theory unfalsifiable in the social sense, so the documentary evidence must be overwhelming. **Principle:** For historical conspiracies, the burden of positive documentary trace is higher than for contemporary ones because Defection Stability cannot be tested.

  **Case B: The "Too Neat" Official Story**
  *Scenario:* A theory is true, but your *only* evidence is a feeling that the official explanation is aesthetically too perfect, coherent, or convenient.
  *   **Defection Stability:** Unknown.
  *   **Falsifiability:** Low. "Too neat" is subjective.
  *   **Explanatory Precision:** Low.
  *   **Verdict:** **Reject belief, license suspicion.** "Neatness" is not a truth-tracking heuristic; it is an aesthetic one. However, institutions *do* sanitize reports. Your feeling is a heuristic for "PR management," not necessarily "falsehood."
  *   **Action:** This licenses you to look for a **Gap** (Case 6). It does not license you to believe the conspiracy yet. If you find a Gap later, you can upgrade to belief. If you find nothing but the "neatness," you must downgrade to "the institution is good at PR," not "the institution is lying."

  ---

  ### Which of Your Verdicts Have to Go?

  You asked for honesty. Here is the friction:

  1.  **Case 6 (40% Credence):** You are bordering on violating the **Explanatory Precision Constraint**. You said your suspicion "changed shape twice." If the mechanism changed from "buried study" to "changed data" to "threatened authors," you are sliding. If it remained "suppression of safety data" and you just found different instances of it, you are fine. Be careful here. 40% is high for *absence* evidence alone. It should be 40% suspicion, 10% belief.
  2.  **Case 9 (Vindication):** You need to decouple these feelings. You were epistemically irresponsible if you asserted the specific false theory, even if the institution turned out to be rotten. The "I told you so" is valid regarding the *institution's trustworthiness*, but invalid regarding the *specific claim*. Don't let Case 9 make you overconfident in Case 6 next time.
  3.  **Case 7 (30%):** This is the most dangerous one for you. Redactions are standard procedure, not evidence of guilt. Relying on a redacted chapter violates the **Falsifiability Constraint** unless you can show *why* that specific chapter should be public. A redaction is a Void, not necessarily a Gap. I would lower this credence to 10% (general skepticism) unless you have an external reason to expect that chapter to be unclassified.

  ### The Final Principle Statement

  If you need to write this down for your seminar, here is the precise formulation:

  > **The Principle of Stable Secret Coordination:**
  > An agent is rational to believe a conspiracy hypothesis $H$ if and only if:
  > 1.  **Incentive Alignment:** The alleged conspirators possess aligned interests and high costs of defection such that $P(\text{Leak}|H)$ is low. (Motivated by Case 2 vs 4).
  > 2.  **Positive Trace:** There exists evidence $E$ such that $P(E|H) > P(E|\text{Official Story})$, where $E$ is not merely the absence of expected records unless those records are institutionally mandated to exist. (Motivated by Case 6 vs 8).
  > 3.  **Mechanism Stability:** The core causal mechanism of $H$ does not change to accommodate counter-evidence. (Motivated by Case 10).

  This keeps your gut instincts but tightens the screws on the places where you were wobbling (headcount, absence, sliding). It respects that conspiracies happen (Case 2) without opening the door to paranoia (Case 8).
