  1. The institutional boundary and its conceptual tension

  In Central and Northern Europe, a distinct institutional boundary separates philosophical counselling from clinical mental-health care. Philosophical practitioners address existential orientation and value conflicts but are ethically barred from diagnosing mental disorders. Conversely, psychiatric frameworks classify profound, sustained crises of meaning as symptoms of conditions like depression or adjustment disorder, warranting clinical intervention and insurance reimbursement. This division generates a conceptual tension regarding the ontological status of existential distress. If a loss of meaning constitutes a genuine harm comparable to physical injury or cognitive dysfunction, restricting its treatment to non-medical counsellors appears negligent. However, if such distress stems merely from conceptual confusion regarding the coherence of "life's meaning" as a totality, medicalising it constitutes a category error. The boundary thus hinges on an unstated philosophical anthropology: it must determine whether existential suffering is a pathology of the mind or a puzzle of the intellect.

  2. Reconstruction of the implicit theory

  The institutional boundary implicitly relies on a distinction between the *content* of existential questioning and the *functional impact* of the distress it causes. It presupposes that questions regarding the ultimate purpose of life are conceptual in nature, not physiological. This aligns closely with Moritz Schlick's account, which posits that asking for the "meaning of life" as a global totality rests on a linguistic misunderstanding. For Schlick, meaning inheres only in particular activities pursued for their own sake, akin to play. Under this view, a "crisis of meaning" is fundamentally a cognitive error—a failure to recognize the intrinsic value of immediate experience—rather than a biological dysfunction. Consequently, the primary remedy is conceptual clarification, the domain of philosophy. The boundary thus treats the existential question itself as a matter of logic and value theory, inaccessible to medical diagnostics.

  However, the current system does not fully exclude clinical care. It permits medical intervention when existential distress leads to functional impairment. This suggests a hybrid implicit theory: while the *question* of meaning is philosophical, the *suffering* resulting from unresolved questioning can become pathological. The boundary assumes that meaning itself is not an objective teleological structure discoverable by science, nor a purely subjective feeling measurable by biomarkers. Instead, it treats meaning as a normative framework accessible through reason. Clinical care is reserved not for the lack of meaning itself, but for the incapacitating psychological consequences—such as anhedonia or paralysis of will—that accompany it. Thus, the system presupposes that while the *source* of the crisis is philosophical (a confusion about value), the *severity* can become medical (a dysfunction of coping). This dual-track approach allows philosophy to address the truth-value of existential claims while medicine manages the symptomatic fallout. This reconstruction implies a specific theory of well-being where flourishing requires both correct conceptual orientation and psychological capacity. The boundary protects the normative integrity of meaning from medical reductionism while ensuring safety when confusion becomes debilitating. It assumes that a life without meaning is not inherently diseased, but the inability to function due to that absence is. Therefore, the institutional split preserves the idea that meaning is a philosophical achievement, not a medical given, even if the failure to achieve it requires medical support. The practice thereby navigates between the Scylla of neglecting genuine suffering and the Charybdis of pathologising normal philosophical inquiry.

  3. Strict presupposition versus mere compatibility

  Strictly speaking, the practice presupposes only that existential questions are not reducible to biomedical data. It requires a dual-aspect view where the *validity* of a life's purpose is a matter for rational discourse, while the *capacity to function* is a matter for clinical assessment. Schlick's specific claim—that global meaning is a misunderstanding—is compatible but not strictly necessary. The system could accommodate an objective teleological view where philosophy discerns the true purpose, provided that failing to find it is not inherently a medical disease. Similarly, it could accommodate radical constructivism, where meaning is created, provided the failure to create it is not initially pathological.

  What is genuinely required is the distinction between normative confusion and psychological dysfunction. The boundary collapses if meaning is viewed as entirely subjective preference (making distress merely dissatisfaction) or entirely biological (making distress purely chemical). The practice strictly demands that meaning has a logical structure accessible to dialogue, distinguishing it from the causal mechanisms of mental illness. Schlick's theory is a convenient fit because it demystifies the "global" question, but the institution only strictly requires that the *query* remains non-medical, regardless of whether the answer is found in play, duty, or creation. The essential commitment is that reason, not medication, resolves the conceptual puzzle, even if medication stabilizes the patient enough to reason.

  4. Rival licensing accounts

  Rival theories can license the same institutional division without adopting Schlick's verificationism. An objective teleological account could justify the split by positing that philosophy discerns the correct human end, while medicine treats the despair arising from missing it. Here, the crisis is epistemic (not knowing the good), not pathological, unless the despair becomes incapacitating. Similarly, a radical constructivist view could maintain the boundary by framing meaning as a narrative project. Philosophical counsellors assist in cohering the narrative, while clinicians treat the depressive collapse that prevents narrative construction.

  Even a purely instrumental view of meaning—where life has value only as a means to external ends—could support the division. If meaninglessness is a calculation error regarding utility, philosophy corrects the calculation; if it causes somatic shutdown, medicine intervenes. The common thread across these rivals is not a specific theory of what meaning *is*, but a shared meta-ethical commitment: meaning belongs to the space of reasons, while health belongs to the space of causes. As long as a theory maintains that existential distress originates in the normative realm (values, purposes, narratives) rather than the causal realm (neurochemistry), the institutional split remains coherent. Thus, the boundary is robust across competing metaphysics of value, provided they all reject the reduction of normative failure to biological disease.

  5. Implications of replacing the view

  If we replaced the presupposed view with one treating a crisis of overall meaning as a direct harm comparable to bodily injury, the institutional landscape would shift radically. Professional jurisdiction would migrate entirely to clinical medicine. Philosophical counsellors would be relegated to non-clinical roles, akin to life coaches, lacking authority over "harmful" existential states. Funding mechanisms would require existential therapy to be fully reimbursable as medical treatment, potentially necessitating new diagnostic codes specifically for "existential disorder" distinct from depression.

  Diagnostic practice would change to validate the content of the crisis, not just the functional impairment. Currently, medicine treats the symptom (anhedonia); under a harm-based model, it would treat the lack of meaning itself as the pathology. This would medicalise philosophy, turning conceptual clarification into a therapeutic technique subject to clinical guidelines. Conversely, if meaninglessness is a direct injury, failing to treat it medically could be deemed negligence. The separation would dissolve, subsuming existential care under psychiatry. This would grant patients greater access to funded care but risk reducing normative questions of value to technical problems of mental hygiene, potentially obscuring the distinction between a life that is ill and a life that is merely difficult to understand.
