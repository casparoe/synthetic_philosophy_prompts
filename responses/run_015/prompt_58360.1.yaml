answer: |-
  ### Assessment of Your Hypothesis

  Your hypothesis is astute and likely correct, but it requires a slight sharpening to fully capture the depth of the impasse. You suggest the dispute conflates a **semantic question** (when we ascribe "knows how") with a **psychological question** (what cognitive architecture produces the action).

  While accurate, calling it merely "semantic" understates the Intellectualist commitment. Intellectualists are not merely making a claim about English usage; they are making a metaphysical claim about the *nature of the mental state* constituting the knowledge. They argue the state *is* propositional, regardless of whether we label it "knowledge." Conversely, Ability Theorists are not merely pointing to behavior; they are claiming the state is constituted by the dispositional relation between agent and environment.

  Therefore, a more precise diagnosis is that the dispute conflates **Normative Attribution** (Intellectualism) with **Causal Constitution** (Ability Theory).
  *   **Intellectualists** are asking: "What rationalizes the action as intelligent rather than accidental?" (Answer: Propositional guidance).
  *   **Ability Theorists** are asking: "What physically realizes the successful engagement with the world?" (Answer: Embodied disposition).

  The stalemate persists because both sides are correct within their own explanatory domain, but they treat their domain as exhaustive of the phenomenon "skilled action." Your three cases are excellent tools to demonstrate this incommensurability.

  ---

  ### Case Analysis: Verdicts and Maneuvers

  Here is how each camp must handle your specific cases to maintain theoretical consistency. Note how each side absorbs the counter-evidence by shifting the locus of the "knowledge."

  #### 1. Mara (The Paralyzed Coach)
  *   **The Data:** Possesses accurate propositional models and diagnostic capacity; lacks physical ability.
  *   **Intellectualist Verdict:** **Mara knows how.**
      *   *Reasoning:* Knowing-how is a propositional attitude toward a way of acting. Mara possesses this attitude. Her paralysis is a *performance blocker*, analogous to a pianist with broken fingers still knowing how to play the sonata. The knowledge state is distinct from the ability to manifest it.
  *   **Ability Theorist Verdict:** **Mara does not know how.**
      *   *Reasoning:* Knowing-how is constituted by the capacity to succeed. Mara has *knowledge-that* (theory), but without the disposition to execute, the practical knowledge is extinct. She is a theorist of swimming, not a knower-of-swimming.
  *   **Diagnostic Value:** This case isolates **Ability** from **Proposition**. Intellectualists sacrifice the link to ability to save the link to truth/justification. Ability theorists sacrifice the link to explicit theory to save the link to action.

  #### 2. Arm-7 (The Blind Manipulator)
  *   **The Data:** Possesses reliable physical ability; lacks declarative model or verbal capacity.
  *   **Intellectualist Verdict:** **Arm-7 does not know how.**
      *   *Reasoning:* Arm-7 lacks the propositional attitude required for knowledge. It is a causal system, not a rational agent.
      *   *The Maneuver:* To avoid this counter-intuitive result, Intellectualists often argue that Arm-7 *must* have implicit propositional structures (sub-personal representations) guiding the grasp. If Arm-7 is purely connectionist with no representational structure, the Intellectualist must bite the bullet and deny it knows how, relegating it to "mere reliability."
  *   **Ability Theorist Verdict:** **Arm-7 knows how.**
      *   *Reasoning:* Arm-7 exhibits the core feature of skill: reliable success in variable conditions. The lack of speech or declarative access is irrelevant to the possession of the skill.
  *   **Diagnostic Value:** This case isolates **Proposition** from **Success**. It reveals the Intellectualist's commitment to *rationality* over *reliability*. If there is no "truth" being tracked (even implicitly), there is no knowledge.

  #### 3. Theo vs. The Teacher (The Violinists)
  *   **The Data:** Theo has true propositions, failed ability. Teacher has false propositions, exemplary ability.
  *   **Intellectualist Verdict:** **Both know how.**
      *   *Reasoning (Theo):* Like Mara, Theo possesses the propositional knowledge of the way to vibrate; his motor system fails to execute it.
      *   *Reasoning (Teacher):* The Teacher knows the way under a *practical mode of presentation*. Her verbal report (false principles) is a separate theoretical activity. Her hands "know the truth" even if her tongue speaks falsehoods.
  *   **Ability Theorist Verdict:** **Teacher knows how; Theo does not.**
      *   *Reasoning:* The Teacher has the competence. Theo has only a theoretical description he cannot instantiate. The Teacher's false verbal report is irrelevant noise; Theo's true verbal report is inert information.
  *   **Diagnostic Value:** This is the strongest case for your hypothesis. The Intellectualist must posit a "practical mode of presentation" that is immune to the agent's own verbal reports to save the Teacher. The Ability Theorist dismisses Theo's propositions as causally inert. The two sides are talking past each other: one evaluates the *content of the guidance*, the other evaluates the *quality of the output*.

  ---

  ### Diagnosis of the Disagreement Structure

  Based on these verdicts, the disagreement is not merely verbal, nor is it a straightforward factual dispute about cognition. It is a **Clash of Explanatory Priorities**.

  1.  **The Intellectualist Priority (Normativity):** They are concerned with what makes an action *intelligent* rather than *reflexive*. For them, "knowledge" implies a relation to truth. If Mara or Theo can articulate the correct method, their actions (if they could perform them) would be rational. Arm-7's actions are merely causal. They prioritize the *justificatory structure* of action.
  2.  **The Ability Theorist Priority (Naturalism):** They are concerned with what makes an action *successful* in the world. For them, "knowledge" implies a functional capacity. If the Teacher succeeds, she knows. If Mara fails, she doesn't. They prioritize the *causal realization* of action.

  **Why the Impasse is Principled:**
  The stalemate persists because "Knowledge-How" is a **folk-psychological cluster concept** that is being asked to do two incompatible jobs.
  *   **Job A:** Certify that an agent is acting for reasons (Intellectualism).
  *   **Job B:** Certify that an agent can reliably achieve goals (Ability Theory).

  In normal cases (a healthy expert), Job A and Job B overlap. In your variant cases (Mara, Arm-7, Theo), they come apart. The dispute is not about the data; it is about which Job is the *essential* function of the concept "knowledge." Argument cannot resolve this because it is a decision about theoretical utility, not a discovery of fact.

  Your hypothesis that this conflates semantics and psychology is correct insofar as both sides try to use the *psychological facts* (e.g., neuropsychological dissociations) to win the *semantic/metaphysical debate* (e.g., "Is it propositional?"). But since the concept "knowledge" is not a natural kind, the psychological facts underdetermine the metaphysical conclusion.

  ---

  ### Concrete Paths to Progress

  If you wish to move your chapter beyond diagnosing the stalemate to proposing a resolution, do not attempt to prove one side right. Instead, propose a **Taxonomic Fragmentation**. Progress lies in abandoning the question "Is knowing-how a species of knowing-that?" in favor of "What are the distinct components of skilled action?"

  **1. Conceptual Distinction: Guidance vs. Generation**
  Propose that we distinguish **Propositional Guidance** (Intellectualist domain) from **Procedural Generation** (Ability domain).
  *   *Progress:* Acknowledge that Mara has Guidance without Generation. Arm-7 has Generation without Guidance. The Teacher has Generation with Misleading Guidance. Theo has Guidance without Generation.
  *   *Result:* This dissolves the "Is it X or Y?" question. Sometimes skill requires Guidance (learning phases, strategic sports); sometimes it requires the suppression of Guidance (flow states, high-speed reaction).

  **2. Reformulated Question: The Interaction Problem**
  Shift the research question from the *nature* of knowledge to the *interaction* between systems.
  *   *Progress:* Instead of asking "Does the swimmer know how?", ask "To what extent does propositional access enhance or degrade the procedural execution in this specific context?"
  *   *Result:* This aligns with empirical literature on "choking under pressure" (where explicit propositional monitoring disrupts procedural generation) and "explicit monitoring theory." It makes the philosophical debate empirically tractable.

  **3. Formal Result: A Dual-Process Model**
  Adopt a framework where "Knowing-How" is recognized as a hybrid state requiring two subsystems: a **Selector** (propositional/strategic) and an **Executor** (procedural/dispositional).
  *   *Progress:* Define "Full Skilled Knowledge" as the calibrated integration of Selector and Executor.
  *   *Result:* Mara has a broken Executor. Arm-7 has no Selector. Theo has a disconnected Selector. The Teacher has a calibrated Executor with a noisy Selector. This allows you to grant partial validity to both philosophical camps without forcing a reduction.

  ### Conclusion for the Chapter

  You should conclude that the impasse is **principled rather than temporary**. It arises because "knowledge" is a normative term being applied to a naturalistic phenomenon. As long as philosophers demand a unitary account of "knowing-how" that satisfies both the norms of epistemology (truth/justification) and the demands of action theory (success/causation), the debate will cycle indefinitely.

  Your contribution is to show that the three cases (Mara, Arm-7, Theo) are not edge cases to be explained away, but **existence proofs** that the two components of skill come apart. The progress your dissertation can offer is to argue that the philosophical utility of the debate is exhausted, and the field should move toward a **pluralistic architecture of skill** where propositional and dispositional elements are treated as distinct, interacting variables rather than competing definitions of a single essence.
