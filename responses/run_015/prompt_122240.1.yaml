prompt: |-
  You are a professional philosopher and experienced seminar facilitator specializing in philosophy of language and Wittgensteinian themes. Before drafting the design, take time to brainstorm: think about how to make the skeptical gap visceral rather than abstract, what roles or incentives will force participants to discover the underdetermination themselves, and how to replace the familiar arithmetic example with a less rehearsed scenario so the exercise does not feel like a standard lecture demonstration.

  Design a 90-minute classroom activity for an upper-level philosophy seminar of 12 students. The domain is Kripkenstein’s rule-following skeptical paradox, but do not use the standard “plus versus quus” framing; instead, inject a niche scenario—such as an artificial-classifier audit tribunal or a museum-curation verification board—so participants encounter the problem in a context they have not memorized from introductory treatments.

  The setting is a seminar room with 12 advanced undergraduate or graduate students, one 90-minute session, with only cards, paper, and a whiteboard. Participants should come away feeling, through their own failed attempts at coordination, that no finite record of past applications, explicit written instructions, private mental intentions, or behavioral dispositions can uniquely fix which rule is being followed, and that the appeal to communal agreement collapses under the same pressure. They should experience this as a practical breakdown in judgment or arbitration, not as a verbal thesis being delivered to them.

  Your deliverable must include:

  1. Setup and materials: specify roles (e.g., Auditor, Defender, Skeptic, Recorder), group divisions, card contents, and any point or commitment system with small stakes.

  2. The activity, divided into timed phases with explicit rules. Arrange the rules and incentives so that groups first apply a classification rule to a shared behavioral record, then face a deviant interpretation that fits every prior case but diverges on a new disputed case, and then attempt to resolve the dispute using only the four standard resources—private mental state, explicit instruction, behavioral disposition, and community consensus. The groups should fail to reach secure agreement. Include a public-commitment mechanism (forced vote, scored deliberation, or recorded verdict) so the failure is experienced collectively.

  3. A debrief that maps specific moments in the activity onto parts of the skeptical argument: the normative gap between behavior and correctness, the underdetermination of dispositions, and the circularity of community appeals. State what will predictably go wrong when the activity is run—such as students insisting that “common sense” fixes the rule, or one group converging on false consensus—and explain how the facilitator should handle it without reverting to lecture. Be explicit about which feature of the skeptical argument the activity cannot reproduce—namely, the normative dimension that meaning involves correctness conditions that transcend any descriptive fact about behavior or mental life—and instruct the facilitator on how to supply that move verbally once the experiential failure has occurred.

  4. Constraints: no assigned readings during the session, no requests for bibliographies or citations, no dependence on specialized technical knowledge outside standard philosophical training, and no verbatim quotations from any source.

  Think carefully, structure the response clearly and formally, and present the full runnable design.
