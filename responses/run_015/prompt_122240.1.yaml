answer: |-
  # Seminar Activity Design: The Modernist Acquisition Tribunal

  ## 1. Setup and Materials

  **Context:**
  The seminar room is arranged into three distinct tables. Each table represents an independent "Acquisition Board" for a prestigious Museum of Modern Art. The students are not discussing philosophy; they are performing a bureaucratic audit. The philosophical stakes are hidden until the debrief.

  **Participants:**
  12 Students divided into 3 Groups of 4.

  **Roles (assigned via Role Cards at each table):**
  1.  **The Director (Auditor):** Holds the authority to cast the final vote. Responsible for ensuring the decision aligns with the Museum's mission.
  2.  **The Curator (Defender):** Responsible for advocating the "Standard Interpretation" of the acquisition rule based on institutional tradition.
  3.  **The Conservator (Skeptic):** *Crucial Role.* Receives a sealed envelope midway through. Their task is to find a coherent interpretation of the rule that fits all past data but diverges on the new case.
  4.  **The Registrar (Recorder):** Documents the *justifications* used for every decision. They are forbidden from recording verdicts without a stated reason.

  **Materials:**
  *   **Rule Cards (3 identical):** Contains the acquisition criterion: *"Acquire works that exhibit 'Industrial Austerity'."*
  *   **Precedent Packets (3 identical):** Contains 6 Case Cards.
      *   *Cases 1-3 (Accepted):* Steel beam sculpture (1950), Factory mold cast (1955), Mass-produced chair (1960). All visually stark, geometric, machine-made.
      *   *Cases 4-6 (Rejected):* Oil painting (1952), Hand-carved wood (1958), Organic clay form (1965). All visually organic or expressive.
  *   **The Disputed Case (3 identical):** A card describing a 3D-printed sculpture (2023) that is visually indistinguishable from the 1950 Steel Beam but was created via a unique, non-repeatable digital script.
  *   **Verdict Sheets:** Pre-printed forms requiring a "Yes/No" vote and a checkbox for the *type* of justification used (Text, Intent, History, Consensus).
  *   **Whiteboard:** Divided into three columns (Group 1, 2, 3) to track public verdicts.
  *   **Token Stakes:** Each group starts with 10 "Acquisition Points." They lose 2 points for inconsistent verdicts (against precedents) and 2 points for failure to reach internal consensus.

  ---

  ## 2. The Activity (90 Minutes)

  ### Phase 1: Calibration (15 Minutes)
  **Goal:** Establish confidence in the rule's determinacy.
  1.  **Distribution:** Groups receive Rule Cards and Precedent Packets. Roles are assigned.
  2.  **Task:** The Registrar must verify that the group agrees on the classification of the 6 Past Cases based *only* on the Rule Card and the Case Cards.
  3.  **Constraint:** They cannot invent outside facts. They must agree on why Cases 1-3 were "Yes" and 4-6 were "No."
  4.  **Incentive:** If all three groups submit identical classifications for the 6 past cases, each group gains 2 Points. (Expectation: All groups will easily agree, establishing the illusion of a fixed rule).

  ### Phase 2: The Dispute (25 Minutes)
  **Goal:** Introduce the underdetermination.
  1.  **The New Case:** Distribute the "Disputed Case" (3D-printed sculpture).
  2.  **The Sealed Envelope:** Hand the **Conservator (Skeptic)** in each group a sealed envelope.
      *   *Inside Instruction:* "Your task is not to be difficult, but to be precise. Propose a definition of 'Industrial Austerity' that fits all 6 Past Cases perfectly but requires rejecting this New Case. You may not change the past records. You may only reinterpret the Rule."
      *   *Example Hint (if stuck):* "Does 'Industrial' refer to the *visual style* or the *method of production*? The past cases never distinguished these because they always overlapped."
  3.  **Deliberation:** The group must debate the New Case. The Curator argues for acceptance (Standard View: Visual Style). The Conservator argues for rejection (Deviant View: Method of Production).
  4.  **Incentive:** The Director must cast a vote. If the group agrees internally, they keep their points. If they deadlock, they lose 2 Points.

  ### Phase 3: The Appeal to Resources (25 Minutes)
  **Goal:** Exhaust the four standard resources for fixing meaning.
  1.  **The Crisis:** The Facilitator announces that the Museum Board requires a *written justification* for the verdict, selected from four specific categories. The Registrar must circle one primary justification on the Verdict Sheet:
      *   **A. Explicit Text:** The literal wording of the Rule Card.
      *   **B. Private Intent:** What the Director *feels* they meant by the rule.
      *   **C. Behavioral Disposition:** How the group has acted in the past (Precedent).
      *   **D. Community Consensus:** What the other Groups decided.
  2.  **The Twist:**
      *   After groups select their justification, the Facilitator challenges them.
      *   *If Text:* "Does the word 'Industrial' specify method or style? The text is silent."
      *   *If Intent:* "What fact about your mental state *is* that intention? Can you show it to us?"
      *   *If Disposition:* "Your past actions fit both the Standard and Deviant rules equally. How does past behavior dictate future correctness?"
      *   *If Consensus:* The Facilitator reveals the Whiteboard. If Groups differ, consensus fails. If Groups agree, the Facilitator asks: "If a fourth group joined tomorrow and disagreed, would you be wrong? If yes, consensus isn't the ground. If no, meaning is mob rule."
  3.  **Commitment:** Groups must finalize their Verdict Sheet. They cannot change their justification after the challenge.

  ### Phase 4: Public Verdict and Collapse (15 Minutes)
  **Goal:** Visceral experience of the skeptical gap.
  1.  **Reveal:** Each Director stands and reads their Verdict and Justification.
  2.  **Comparison:** The Facilitator marks the Whiteboard.
      *   *Likely Outcome:* Group 1 says Yes (Style), Group 2 says No (Method), Group 3 deadlocks or flips.
  3.  **The Point Deduction:** The Facilitator acts as the "Board of Trustees." They declare: "Because there is no objective fact determining the correct classification, no group can claim correctness. All groups lose 5 Points for 'Unsecured Judgment'."
  4.  **Reaction:** Allow 2 minutes for students to express frustration. "But we *know* what industrial means!" "This is absurd!" (This frustration is the target phenomenon).

  ### Phase 5: Debrief (10 Minutes)
  **Goal:** Map the experience to the philosophical argument.
  (See Section 3 for detailed debrief script).

  ---

  ## 3. Debrief and Facilitator Guide

  ### Mapping Activity to Argument
  Do not lecture immediately. Ask questions to draw the connections out of their frustration.

  1.  **The Normative Gap (Behavior vs. Correctness):**
      *   *Ask:* "In Phase 1, you all agreed. In Phase 2, you diverged. Did the *facts* on the cards change?"
      *   *Point:* No. The finite record (Precedents) underdetermines the rule. You can always construct a "Deviant" interpretation (Conservator's role) that fits all past data but diverges on the new case. This mirrors the skeptical hypothesis: no finite sequence of actions fixes infinite future application.

  2.  **The Failure of Intent (Private Mental State):**
      *   *Ask:* "When the Curator said 'We meant visual style,' what fact made that true? Was it a picture in your head? A feeling?"
      *   *Point:* Any mental image (e.g., a picture of a factory) can itself be interpreted in multiple ways. The "meaning" cannot be a private object, because that object also requires interpretation.

  3.  **The Circularity of Community (Consensus):**
      *   *Ask:* "If all three groups had voted 'Yes,' would that have made it correct?"
      *   *Point:* If yes, meaning is merely majority vote (contingent). If no, then there is a standard *outside* the community to which the community is answerable. But what is that standard? It cannot be behavior or text (as shown). This exposes the circularity of appealing to "our practice" to justify "our practice."

  ### Predictable Failures and Handling
  *   **Failure 1: "Common Sense" Appeal.**
      *   *Student Reaction:* "This is silly. Everyone knows 'Industrial' implies method."
      *   *Facilitator Move:* Do not argue semantics. Ask: "Imagine a culture where 'Industrial' refers only to the *sound* the object makes. Would their past cases look different from ours?" (Show that the "obviousness" is itself a shared disposition, not a logical fact).
  *   **Failure 2: False Consensus.**
      *   *Student Reaction:* All groups agree on "Yes."
      *   *Facilitator Move:* Introduce a hypothetical. "I am the Trustee. I say you are wrong. What fact do you point to to prove me incorrect? Not your feeling, not the text. What *fact*?" Force them to see they have no recourse beyond asserting their own confidence.
  *   **Failure 3: Frustration/Dismissal.**
      *   *Student Reaction:* "This is just wordplay."
      *   *Facilitator Move:* Validate the frustration. "The paradox is meant to feel destabilizing. If it felt solvable, I would have failed. The feeling that there *must* be a fact, even when you cannot find one, is exactly the tension Wittgenstein/Kripke are investigating."

  ### The Limit of the Activity (Crucial)
  **What the Activity Cannot Reproduce:**
  The activity demonstrates the *descriptive* failure of facts (text, behavior, mind) to fix rules. It cannot demonstrate the *normative* dimension—that meaning involves an "ought" that transcends these facts. The students experience the *absence* of a ground, but they cannot experience the *nature* of the ground that is missing.

  **How to Supply This Verbally:**
  Once the experiential failure is established (the frustration in Phase 4), the facilitator must explicitly state:
  *"You felt that you ought to have been able to find a right answer. You felt the Conservator was 'cheating' even if their logic fit. That feeling—the sense that there is a difference between 'seeming right' and 'being right'—is the normative gap. The skeptical argument shows us that no descriptive fact (brain state, ink on paper, past actions) can bridge that gap. The activity shows the collapse of the descriptive; the philosophy asks what, if anything, remains."*

  ---

  ## 4. Constraints Checklist
  *   **No "Plus/Quus":** The scenario uses "Industrial Austerity" (Museum/Classifier hybrid), not arithmetic.
  *   **No Readings:** All instructions are oral or on cards provided during session.
  *   **No Citations:** No mention of Kripke, Wittgenstein, or specific texts during the activity.
  *   **No Technical Knowledge:** Relies on standard reasoning and categorization skills.
  *   **Visceral Experience:** The point deduction and public divergence force a practical breakdown, not just theoretical agreement.
  *   **Roles:** Auditor, Defender, Skeptic, Recorder utilized to distribute cognitive load and enforce the skeptical move.
