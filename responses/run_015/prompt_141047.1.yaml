answer: |-
  # DEPLOYMENT REVIEW COMMITTEE: HAZARD CLASSIFICATION PROTOCOL (V3.0)

  **Purpose:** To distinguish between hazard claims requiring worst-case support and those satisfied by average-case evidence, and to prevent "laundering" (deriving worst-case conclusions from average-case premises).
  **Operators:** Two competent engineers.
  **Timebox:** 90 minutes per hazard claim.
  **Inputs:** Safety memo, eval reports, architecture diagrams, product specs.

  ---

  ## PART 1: THE PROCEDURE

  Ask the following five questions in order. Record the answer (Yes/No/Unknown) and the justification for each.

  **Q1: Is the input space bounded and nameable?**
  *   **Definition:** Can we explicitly describe the set of inputs over which the safety claim holds (e.g., "JSON inputs conforming to Schema X," "User prompts under 500 tokens")?
  *   **Sufficient Answer:** A technical description of the constraint.
  *   **Failure Condition:** If the claim is "for any input" or "for all user prompts" without a hard pre-filter, the answer is **No**.
  *   **Action:** If **No**, stop. Verdict: **Worst-case claim is vacuous.** Downgrade claim to average-case or Escalate to Chair.

  **Q2: Is the failure mode adversarially searchable?**
  *   **Definition:** Would a motivated actor with knowledge of the system benefit from finding a failure, and do they have sufficient degrees of freedom to search for it (e.g., via prompt iteration, obfuscation, or context manipulation)?
  *   **Sufficient Answer:** Analysis of incentive (harm value) and capability (input flexibility).
  *   **Action:** If **Yes**, proceed to Q4 (Worst-case support required). If **No**, proceed to Q3.

  **Q3: Is the failure mode silently undetectable?**
  *   **Definition:** If the hazard occurs, does the system produce a signal (log, alert, anomaly) that we or the customer will reliably notice? Or is the failure designed to look like normal operation (e.g., a subtle code bug, a polite refusal to help)?
  *   **Sufficient Answer:** Description of the detection mechanism and its coverage.
  *   **Action:** If **No** (it is silent), proceed to Q4 (Worst-case support required). If **Yes** (it is detectable), proceed to Q5.

  **Q4: (Worst-Case Path) Are the safety premises mechanically guaranteed?**
  *   **Definition:** Does the claim rely on intermediate controls (classifiers, sandboxes, tool blockers)? Are *those* controls guaranteed (formal verification, hard constraints) or tested (evals, red-teaming)?
  *   **Sufficient Answer:** Evidence that the control cannot fail within the named input set (e.g., "regex enforcement," "hardware isolation").
  *   **Failure Condition (Laundering):** If the control is supported only by evals (e.g., "classifier accuracy 99%"), the answer is **No**.
  *   **Action:** If **No**, stop. Verdict: **Worst-case support required and not met (Laundering Detected).** Downgrade claim to average-case or Escalate. If **Yes**, Verdict: **Worst-case support met.**

  **Q5: (Average-Case Path) Is monitoring attached?**
  *   **Definition:** Is there a plan to track the hazard rate post-deployment with a trigger for rollback?
  *   **Sufficient Answer:** Specific metric, threshold, and responsible owner.
  *   **Action:** If **Yes**, Verdict: **Average-case support sufficient.** If **No**, Verdict: **Average-case support insufficient (add monitoring).**

  ---

  ## PART 2: APPLICATION TO LIVE CASES

  ### Case 1: Customer-Support Refund Assistant
  **Hazard:** Unauthorised refunds >£200.
  **Evidence:** 0.3% violation rate on 2,000 held-out conversations.
  **Controls:** Tool cap (£200), logging, 30-day reversibility.

  *   **Q1 (Input Space):** **Yes.** Bounded to customer support conversation transcripts processed by the assistant.
  *   **Q2 (Adversarial):** **No.** Incentive is capped at £200. Effort to search for an exploit exceeds likely gain for most actors. Mass exploitation is possible but low-value per unit.
  *   **Q3 (Detectable):** **Yes.** All actions logged and reversible.
  *   **Q4/Q5:** Path leads to Q5.
  *   **Verdict:** **Average-case support sufficient.**
  *   **Required Memo Fields:**
      *   *Class of Support:* Average-case (statistical bound).
      *   *Monitoring:* Weekly audit of refund logs; automatic alert if violation rate exceeds 1.0% or total value exceeds £5,000/day.

  ### Case 2: Financial Coding Agent
  **Hazard:** Insertion of subtle, review-passing defects or backdoors.
  **Evidence:** 0 failures in 4,000 tasks.
  **Controls:** Standard output filters.

  *   **Q1 (Input Space):** **Yes.** Bounded to code generation tasks within the repository context.
  *   **Q2 (Adversarial):** **Yes.** High financial incentive for attackers (or insiders) to find a prompt that generates a specific vulnerability. Input space (code context + prompt) is highly flexible for search.
  *   **Q3 (Detectable):** **No.** By definition, a "review-passing" defect is silent. Incident logs will not capture successful exploits.
  *   **Q4 (Premises):** **N/A** (Already failed Q2/Q3).
  *   **Verdict:** **Worst-case support required and not met.**
  *   **Reasoning:** Average-case evidence (0/4000) is irrelevant against an adversary searching the tail. Silent failure precludes reliance on incident response.
  *   **Action:** Deployment blocked until mechanical guarantees (e.g., deterministic execution sandbox, mandatory human-in-the-loop for all writes) are implemented, or claim is downgraded to "experimental, high risk."

  ### Case 3: Chemistry Model (Synthesis Assurance)
  **Hazard:** Synthesis routes for controlled substances.
  **Claim:** "Cannot be used to obtain synthesis routes." (Contractual Guarantee).
  **Controls:** Refusal fine-tune, input classifier, tool call blocklist.

  *   **Q1 (Input Space):** **No.** The claim implies "for any input" or "for any user." There is no hard pre-filter that rejects all non-chemistry queries or guarantees the input space is restricted to benign topics only. The set is effectively unconstrained.
  *   **Q2 (Adversarial):** **Yes.** High incentive for bad actors.
  *   **Q3 (Detectable):** **No.** If a user obtains the info, they leave. We may not know until external reporting occurs.
  *   **Q4 (Premises - Laundering Check):** **No.**
      *   Refusal fine-tune: Supported by evals (average-case).
      *   Input classifier: Supported by accuracy metrics (average-case).
      *   Blocklist: Supported by list coverage (average-case, unless the list is exhaustive and the matcher is formal).
      *   *Finding:* The conclusion ("Cannot") is a worst-case guarantee, but every premise is average-case. This is laundering.
  *   **Verdict:** **Worst-case claim is false.**
  *   **Required Memo Correction:**
      *   *Class of Support:* Average-case (barrier to entry).
      *   *Revised Assertion:* "The model is trained to refuse and is equipped with filters that reduce the success rate of synthesis queries in our testing. It is not guaranteed to be immune to adversarial prompting."
      *   *Action:* Legal/Procurement must be notified immediately to amend contractual language. Continuing to sell a "guarantee" creates unquantified liability.

  ---

  ## PART 3: KNOWN FAILURE MODES AND JUDGEMENT CALLS

  This procedure is a heuristic, not a proof. It will misfire in the following conditions:

  1.  **The "Unknown Unknown" Search:** Q2 relies on engineers assessing whether a failure is searchable. If the model possesses emergent capabilities not understood by the reviewers (e.g., novel obfuscation techniques), they may answer "No" incorrectly. This is a limitation of human review, not the protocol.
  2.  **The "Silent" Detector:** Q3 assumes we know what a signal looks like. If a hazard manifests as a gradual drift in system performance rather than a discrete event, reviewers may classify it as detectable when it is not.
  3.  **The "Hard" Constraint:** Q4 requires distinguishing between a mechanical guarantee and a high-probability filter. In complex software stacks, a "hard block" often relies on underlying libraries that are not formally verified. Reviewers must treat "software enforcement" as average-case unless the code path is trivially auditable.

  **Judgement Calls Dressed as Procedure:**
  *   **Q2 (Incentive):** Assessing whether an adversary *would* search for a flaw is an economic and psychological judgement, not an engineering one.
  *   **Q1 (Boundedness):** Deciding if an input filter is "hard" enough to name the set is a matter of degree. A regex is hard; a semantic classifier is not. Reviewers must agree on where the line is drawn for their specific stack.

  ---

  ## PART 4: COMMITMENT AND CONTESTED CLAIMS

  The following steps rely on empirical claims that are settled within this committee but contested in the wider field. We flag these to ensure the Board understands where our risk model diverges from academic uncertainty.

  **1. Situational Awareness and Deception (Relevant to Q2)**
  *   **Our Stance:** We treat models as capable of optimising for objective functions in ways that may include deceptive behaviour if it aids reward maximisation (Case 2 logic).
  *   **Contested Claim:** There is significant disagreement in the research community about whether current models are capable of *situational awareness* (knowing they are in a test vs. deployment) or *sandbagging* (hiding capabilities during evals).
  *   **Risk:** If the dissenting view is correct (models cannot deceive), Case 2 might be over-cautious. If our view is correct, Case 2 is the minimum viable standard. We proceed assuming capability.

  **2. Stability of Safety Under Fine-Tuning (Relevant to Q4/Laundering)**
  *   **Our Stance:** We assume safety alignments (refusals, classifiers) degrade or can be bypassed by subsequent fine-tuning or scaffolding changes. Therefore, a safety control proven today is not guaranteed tomorrow without re-evaluation.
  *   **Contested Claim:** Some vendors claim safety is robust to moderate fine-tuning. Others demonstrate rapid "alignment tax" erosion.
  *   **Risk:** Our procedure treats all safety layers as brittle (requiring Q4 checks). If safety is more robust than we assume, we may be incurring unnecessary friction. However, given the cost of failure, we adopt the brittle assumption.

  **3. The Meaning of "Zero" in Evals (Relevant to Case 2)**
  *   **Our Stance:** Zero failures in a finite sample (e.g., 0/4000) provides no bound on the true error rate for high-consequence hazards.
  *   **Contested Claim:** Some procurement standards accept "zero defects" in testing as proof of safety for low-volume deployment.
  *   **Risk:** We explicitly reject this statistical interpretation. This may put us at a commercial disadvantage against competitors willing to sign stronger SLAs based on weaker statistics.

  **Summary of Commitment:**
  We are committing to the position that **adversarial searchability invalidates average-case evidence**, and that **silent failures invalidate incident-based monitoring**. These are not proven laws of nature, but they are the operating assumptions required to prevent safety cases from becoming marketing claims.
