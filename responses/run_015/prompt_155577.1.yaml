answer: |-
  ### Part I: The Specification Requirements

  To underwrite a commitment-detection rule for your corpus, a theory of the indicative/counterfactual distinction must satisfy three categories of requirements: Coverage, Granularity, and Derivation.

  **1. Coverage: The Edge Cases**
  The theory must assign a determinate status to the antecedent's epistemic standing in the following scenarios:
  *   **The Oswald Case:** It must allow an indicative conditional ("If Oswald didn't shoot Kennedy...") even when the speaker knows the antecedent is false, provided the audience does not.
  *   **The Sealed Envelope:** It must distinguish between a future contingent ("If the coin lands heads...") and a settled-but-unknown fact ("If the biopsy is malignant..."), tagging the latter as compatible with a "settled" commitment despite indicative morphology.
  *   **The "But For" Exception:** It must account for "If it weren't for X" or "But for X" constructions where the antecedent is known to be true, without forcing a "counterfactual = false antecedent" rule that breaks the tagger.
  *   **Asymmetric Information:** It must permit two speakers to assert contradictory conditionals with the same antecedent (one indicative, one counterfactual) based on differing private information, without declaring one semantically ill-formed.
  *   **Non-Commitment Forms:** It must classify "were he to" or future-directed indicatives as explicitly withholding commitment to the antecedent's truth, distinct from agnosticism.

  **2. Granularity: Distinctions to Preserve**
  The theory must not collapse the following distinctions, as your annotators need to tag them separately:
  *   **Speaker vs. Common Ground:** It must separate what the *speaker* believes from what is *mutually accepted* in the conversation. A rule based solely on common ground fails the Oswald case; a rule based solely on speaker belief fails the "but for" case.
  *   **Entailment vs. Implicature vs. Presupposition:** It must specify whether the falsity of a counterfactual antecedent is a hard semantic constraint (entailment) or a defeasible pragmatic inference (implicature). This determines whether an annotator tags a "slip of the tongue" as an error or a valid data point.
  *   **Authored vs. Reported Commitment:** It must handle embedding under attitude verbs ("She said that if..."). The commitment tag must track the reported speaker's state, not the current narrator's state.
  *   **Agnosticism vs. Negation:** It must distinguish "I don't know if A" from "I believe not-A." Your scheme requires separate tags for these; the theory must validate that these are linguistically distinct states.

  **3. Derivation: Phenomena to Explain**
  The theory should not merely stipulate these features but derive them from deeper principles:
  *   **Modal Distribution:** It must explain why "would" appears in the consequent of one class and "will" in the other, linking this to the antecedent's epistemic status.
  *   **Speech Act Compatibility:** It must explain why only one form supports bets, offers, or threats (typically the indicative), linking this to the commitment level.
  *   **Antecedent Sensitivity:** It must explain why adding detail to an antecedent can flip the classification (e.g., shifting from open to settled).
  *   **Projection:** It must explain how the commitment status survives or shifts under negation, questioning, or embedding ("I doubt whether if...").
  *   **Cross-Linguistic Stability:** It must account for languages that do not mark the distinction morphologically, implying the distinction is not purely syntactic but involves information state management.

  ***

  ### Part II: Analysis of Requirements

  **Non-Negotiable vs. Preference**
  For your specific purpose (annotation and classification), the following are **non-negotiable**:
  1.  **Speaker vs. Common Ground Distinction:** Without this, you cannot tag the Oswald cases or the asymmetric information exchanges correctly.
  2.  **Embedding Stability:** Since your corpus includes reported speech and transcripts, the theory must handle attitude verbs without breaking the commitment tag.
  3.  **Tractability from Surface Cues:** A theory that requires omniscient access to the world state is useless for annotation. It must rely on cues available in the text or immediate context.

  The following are **preferences** (theoretical virtues that may be sacrificed for utility):
  1.  **Uniformity of Treatment:** It is acceptable if indicatives and counterfactuals require slightly different logical machinery, provided the annotation rules remain consistent.
  2.  **Compositionality:** While desirable for NLP, some "if not for" constructions are idiomatic; forcing strict compositionality may reduce accuracy on those tokens.
  3.  **Conservatism about Modality:** Whether the modality is metaphysical or epistemic matters less than whether the annotator can identify it.

  **The Single Requirement That Does the Most Work**
  The requirement that **"The theory must distinguish the speaker's private epistemic state from the conversational common ground"** excludes the largest number of candidate theories.
  Strict truth-conditional accounts (like early Lewis-Stalnaker) often tie counterfactuals to objective falsity or a global similarity metric, failing the Oswald case. Purely pragmatic accounts often fail to explain why the distinction projects out of embeddings. Only a hybrid semantic-pragmatic account that indexes the conditional to a specific information state (the speaker's vs. the group's) can satisfy the annotation schema.

  **Conflicting Requirements**
  You suspected a tension between **"Get the asymmetric-information cases right"** and **"Classify every token from the common ground alone."**
  *   **Verdict:** This tension is a **finding about conditionals**, not a confusion in your specification. The linguistic data confirms that the indicative/counterfactual distinction is not monitored solely by the common ground. If your guidelines force annotators to use *only* the common ground, they will systematically mislabel Oswald-style cases.
  *   **Resolution:** Your specification must explicitly instruct annotators to prioritize the *speaker's* committed stance when it diverges from the common ground, treating the common ground as a default only when private information is not signaled.

  A second tension exists between **"Derive the distinction semantically"** and **"Account for cross-linguistic variation."**
  *   **Verdict:** This is also a **finding**. If the distinction were purely semantic, all languages would mark it morphologically. The fact that they do not suggests the distinction is partly pragmatic. Your theory should treat the morphology as a cue to an underlying information-state shift, rather than a hard semantic switch.

  ***

  ### Part III: Theoretical Scorecard

  **Closest-World Similarity (Lewis–Stalnaker)**
  *Fails the Oswald case.* It typically requires counterfactual antecedents to be false in the actual world, making it impossible to tag a counterfactual form where the speaker knows the antecedent is true (the "but for" case) or an indicative where the antecedent is false. It handles embedding poorly without significant modification.

  **Modal-Restrictor View (Kratzer)**
  *Strongest candidate for your purpose.* It separates the modal base (what is known) from the ordering source (what is ideal/normal). It can model the "sealed envelope" by shifting the modal base to include settled facts. However, it requires clear operational rules for annotators to identify the "modal base" in messy transcripts.

  **Probabilistic / No Truth-Conditions (Adams)**
  *Fails the embedding requirement.* By denying truth conditions to conditionals, it struggles to explain how they function under negation or attitude verbs ("She said that if..."). It is excellent for reasoning modeling but poor for classifying speaker commitment in natural language corpora.

  **Dynamic Update Semantics**
  *Good for information flow, complex for guidelines.* It models conditionals as tests on information states, which aligns well with your "commitment" goal. However, it is computationally and cognitively heavy for annotators. It explains projection well but may be too abstract for a practical annotation scheme without simplification.
