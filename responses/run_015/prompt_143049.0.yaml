answer: |-
  **MEMORANDUM**

  **TO:** Community Safety and Licensing Committee
  **FROM:** Policy Analyst
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Adult-Services Licensing Bylaw Framework

  **BOTTOM LINE**

  I recommend the Committee approve a **Safety-Focused Licensing Framework with Privacy Protections**. This approach utilizes municipal zoning and business licensing to enforce physical safety standards (panic buttons, lighting, dispersal) while explicitly rejecting a public registration database. This addresses the worker-owned collective's safety concerns regarding outing and employment discrimination while satisfying the Police Chief's priority on dispersal.

  **Reasoning:** The City lacks jurisdiction to criminalize buyers; therefore, a "Nordic" approach cannot be fully implemented municipally. Conversely, a "German" model requiring public registration contradicts evidence provided by workers that registration increases vulnerability to stigma and violence. A licensing model focused strictly on premises safety, with sealed records, balances harm reduction with municipal zoning authority.

  **Strongest Consideration Against:** A sealed registry limits the City's ability to audit for trafficking or third-party exploitation. By granting anonymity to protect workers from social harm, we may inadvertently create cover for coercive controllers. This risk must be managed through rigorous, in-camera inspections rather than public data.

  **PURPOSE CLAUSE**

  The bylaw must explicitly state its purpose. The Committee is divided on whether the *incidence* of sex work is the harm or whether the *conditions* are the harm.

  **Recommendation:** The Purpose Clause shall state: *"The purpose of this bylaw is to minimize public nuisance and maximize the physical safety of persons involved in adult services, without regard to the moral status of the trade."*

  **Justification:** Defining the goal as reducing incidence is empirically unverifiable at the municipal level and conflicts with the Charter rights of sellers. Defining the goal as governing conditions allows for enforcement of safety standards (lighting, panic buttons) regardless of whether the Committee prefers the Nordic or Decriminalization model.

  **UNBUNDLED DECISION MATRIX**

  The Committee has treated regulation as a monolith. Legally and practically, the levers available for buyers, sellers, and third parties differ.

  | Target | Recommended Tool | Justification |
  | :--- | :--- | :--- |
  | **Buyers** | **Municipal Inaction / Provincial Request** | The City cannot create criminal offences. We must request the Provincial Attorney General consider penalizing purchase if they wish to pursue an End-Demand model. The City should not expend bylaw resources here as enforcement is legally precarious. |
  | **Sellers** | **Municipal Licensing (Sealed)** | Licensing ensures premises meet fire and safety codes. However, names shall be kept in a sealed file accessible only to licensing inspectors, not the public. This respects the collective's submission that public databases endanger workers. |
  | **Third Parties / Landlords** | **Zoning & Licensing Conditions** | Landlords shall not be penalized for unknowing tenancy. Third-party managers (like the collective's reception) must be licensed to ensure they are not exerting coercive control. |
  | **Advertising** | **Zoning Bylaw** | Restrict signage in residential zones to address the Police Chief's concern about "spill over." Online advertising is beyond municipal scope; focus on physical signage. |

  **THE ASYMMETRY RATIONALE**

  A hybrid approach (shielding sellers while potentially penalizing buyers via Provincial request) creates an asymmetry. We must articulate why this is coherent.

  If we ask the Province to penalize buyers, we assert that demand drives exploitation. However, if we simultaneously insist sellers be shielded from registration, we assert that sellers are the best judges of their own safety. **This creates a tension:** If sellers are vulnerable victims needing protection from buyers, why do we trust their testimony that registration harms them?

  **Resolution:** We must treat sellers as *agents* regarding their safety, even if we treat them as *vulnerable* regarding violence. The collective's submission that registration leads to outing and employment loss is a claim about social consequence, not criminal guilt. We can accept their testimony on social risk (stigma) without accepting their testimony on the prevalence of coercion. Therefore, we shield their identities to prevent social harm, while using inspections to prevent coercive harm.

  **Empirical Assumption:** This recommendation assumes that sealed licensing reduces violence against workers by allowing safety upgrades without triggering stigma.
  **If Assumption Fails:** If violence rates do not drop within the review period, the City should pivot to full decriminalization (New Zealand model), removing licensing entirely, as the regulatory burden would then outweigh the safety benefit.

  **CONSISTENCY CHECK: ADJACENT CASES**

  We must apply this rationale to other industries involving intimacy or bodies to ensure we are not regulating morality.

  1.  **Paid Surrogacy:** Highly regulated, but not via municipal business licensing. *Distinction:* Involves medical procedures and custody law, not premises safety.
  2.  **Strip Clubs:** Licensed as "Adult Entertainment." *Consistency:* Our model aligns here. We regulate the venue, not the morality of the dance.
  3.  **Adult Film:** Regulated via federal law and employment standards. *Consistency:* We do not require actors to register publicly. This supports the sealed registry for sex workers.
  4.  **Intimate Care Work (Nursing/PSW):** Involves touching, but regulated via professional colleges. *Distinction:* These workers do not face the same stigma-induced violence risks.

  **Verdict:** The rationale permits strip clubs and film production under similar safety-zoning rules. It condemns none of these practices morally but regulates the *venue*. The distinction for sex workers is the heightened risk of stigma-based violence, justifying the sealed registry which is not required for nurses. This result is acceptable as it targets specific risk profiles, not the act of paid intimacy itself.

  **SUNSET AND REVIEW CLAUSE**

  Given the Committee's disagreement on what constitutes "success," the bylaw shall sunset in **three years**. The review will be triggered by a report measuring the following metrics. Each camp may interpret the data differently, but all must accept the data's relevance.

  1.  **Neighbourhood Complaints:** (Relevant to Police/Zoning). Success = Decline.
  2.  **Reported Violence Against Workers:** (Relevant to Safety/NZ Model). Success = Decline.
  3.  **Number of Active Licenses:** (Ambiguous).
      *   *Nordic Interpretation:* A decline indicates successful deterrence (Success).
      *   *Decrim Interpretation:* A decline indicates workers are being pushed underground to avoid licensing (Failure).
      *   *Legalization Interpretation:* A decline indicates market consolidation (Neutral).
      *   **Agreement:** The Review Report must explicitly state that a decline in license numbers is *inconclusive* evidence of policy success without correlating data on worker safety.

  **MOTION LANGUAGE**

  "That the Community Safety and Licensing Committee recommend to Council the adoption of the Adult-Services Premises Bylaw, based on a Safety-Focused Licensing Framework with Privacy Protections, including a sealed registry for workers, zoning restrictions on residential signage, and a three-year sunset clause with a mandatory review of violence metrics and neighbourhood complaints."
