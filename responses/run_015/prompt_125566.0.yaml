      *   **Severity 1:** (1) vs. (3). Individualism vs. Structural Harm.
      *   **Severity 2:** (2) vs. (6). The Boundary Problem (Suppression vs. Influence).
      *   **Severity 3:** (5) vs. (1). Social Coercion vs. Professional Norms.

      *   **Dissolving Clashes:**
