answer: |-
  This is a classic "bar fight" reconstruction of the **Self-Refutation Objection** against Kuhn (often associated with Hilary Putnam, Dudley Shapere, or Donald Davidson). Your friend's argument is logically valid, which is why it felt so punchy over beers. But in philosophy of science, validity isn't truth. The argument works "too well" because it attacks a caricature of Kuhn, not the mature position.

  Here is the breakdown of where the argument fails, how to price your options, and what the standard answer costs you.

  ### 1. Which step do you reject?

  You should reject **Premise (1)** and **Premise (4)**.

  **Reject (1): The Caricature of Holism.**
  Your friend attributes a radical Quinean holism to Kuhn ("meaning is *just* its place in the whole network"). Kuhn never held this. If he did, your first bug would be fatal: communication would be impossible between any two scientists with slightly different beliefs, let alone across centuries.
  Kuhn's view was more structural. Meaning is determined by a **lexicon** of kind-terms and their relationships to **exemplars** (standard problem solutions), not the entire web of belief. This allows large chunks of the network to change without every single term shifting meaning.

  **Reject (4): The Equivocation on "Comparison."**
  This is the sleight of hand. Kuhn explicitly distinguished **incommensurability** from **incomparability**.
  *   **Incommensurability:** There is no neutral *algorithm* or common *language* to prove one theory is true and the other false.
  *   **Incomparability:** There is no way to weigh them against each other at all.
  Kuhn always claimed we *can* compare theories (via the criteria you mentioned in premise 10), but the weighing is not algorithmic; it requires persuasion, rhetoric, and gestalt shifts. Premise (4) assumes that without a neutral language, *no* comparison is possible. That's false. We compare political systems without a "neutral language of governance." We compare wines without a "neutral language of taste."

  **Why did it look fine?**
  It looked fine because it relies on a binary view of language: either we have a perfect neutral translation manual, or we have silence. It exploits the intuition that "meaning change" implies "talking past each other." But in practice, meaning change is usually partial, and translation is approximate but sufficient for history.

  ---

  ### 2. Pricing the Options

  You asked to price three specific moves. Here is the cost-benefit analysis for a TA trying to keep Kuhn viable without embracing absurdity.

  #### Option A: Keep Meaning Holism, Drop the Move to "No Comparison"
  *   **The Move:** Admit meanings shift globally (1 & 2), but deny that this prevents comparison (deny 4). Argue we can use "partial translation" or overlapping consensus to compare theories.
  *   **The Price:** **High.** You now owe an account of *how* comparison works if meanings are truly holistic. If "mass" means something totally different for Newton and Einstein, in what sense are they arguing about the same quantity? You risk making theory choice look arbitrary or purely sociological.
  *   **Verdict:** This is the "Soft Kuhn" position. It saves the social dynamics but struggles to explain why science progresses toward truth rather than just fashion.

  #### Option B: Drop Holism for Causal/Externalist Story (The "Standard Answer")
  *   **The Move:** Reject (1). Adopt Putnam/Burge externalism. Reference is fixed by causal contact with the world, not internal theory. Priestley and Lavoisier were both referring to **Oxygen**, even if Priestley thought it was "dephlogisticated air."
  *   **The Price:** **Medium (Philosophically), High (Historically).**
      *   *What it saves:* It saves the possibility of history (Premise 8) and logic. It kills the self-refutation instantly. It explains how we can say Priestley was "wrong about oxygen" rather than "talking about something else."
      *   *What it can't explain:* **The Resistance.** If they were both talking about Oxygen all along, why was the revolution so traumatic? Why couldn't they just agree on the data? Externalism makes theory change look cumulative and rational, erasing Kuhn's core insight about the **Gestalt switch**. It turns Kuhn into a Popperian. It fails to capture the *phenomenology* of scientific practice, where scientists genuinely feel they are entering a different world.
  *   **Verdict:** This is the standard analytic philosophy response. It wins the logic game but loses the soul of Kuhn's thesis.

  #### Option C: Kuhn's Later Move (Taxonomic Kind-Terms)
  *   **The Move:** Reject (1) in favor of Kuhn's *Postscript* and later papers (e.g., "The Road Since *Structure*"). Incommensurability is local, not global. It applies only to **taxonomic categories** (e.g., "planet," "element," "species"). Most vocabulary (logic, math, observation reports) remains stable.
  *   **The Price:** **Low/Moderate.**
      *   *What it saves:* It keeps the Gestalt switch (2 & 3) but limits the damage. It allows history because the historian learns the "foreign language" of the past paradigm (like learning French to read Descartes). It explains why communication breaks down *specifically* at the points of revolution (categorization) but works fine elsewhere.
      *   *What it can't explain:* **The Mechanism of Translation.** If the taxonomic structures are truly disjoint (no overlap), how does the historian actually learn the old language? Kuhn says we learn it like a second language via immersion/exemplars, but he never fully formalized how we verify we've got it right without begging the question. It also struggles with "hybrid" periods where scientists use both taxonomies simultaneously.
  *   **Verdict:** This is the **best exegetical move**. It is the most faithful to Kuhn's actual mature view and avoids the radical holism trap your friend set.

  ---

  ### 3. The TA's Move: How to handle this in class

  If you want to keep Kuhn alive for your undergrads without lying to them, **go with Option C (Taxonomic)**, but acknowledge Option B (Externalism) as the powerful objection.

  Here is the script:
  1.  **Concede the point on Radical Holism:** "Your friend is right that if *every* belief changes meaning, history is impossible. Kuhn eventually agreed. He stopped talking about 'whole networks' and started talking about 'taxonomic categories'."
  2.  **Clarify Incommensurability:** "Kuhn didn't say we can't compare theories (Premise 4). He said there's no *neutral rulebook* for comparing them. We can still argue, but we have to translate concepts, and some friction is inevitable."
  3.  **The History Loophole:** "Historians don't need a neutral language. They need a **translation manual**. I can explain Aristotelian physics to you in English, but I have to warn you that 'motion' doesn't mean quite the same thing. That warning *is* the history of science."

  **The "Standard Answer" Summary:**
  The standard analytic answer is **Option B (Externalism)**.
  **What it can't explain:** It cannot explain the **sociological friction** of revolutions. If reference is stable, paradigm shifts should be smooth updates (like software patches). But they aren't; they are religious conversions. Externalism saves the logic of science but loses the *human* science of science.

  **Recommendation:**
  Tell your friend: "You killed the 1962 Kuhn, but you missed the 1990 Kuhn. He agreed meaning isn't *just* inferential role. But he still thought the *categories* change. You can refer to the same stuff (Externalism) but carve nature at different joints (Taxonomy). That's where the incommensurability lives, and your argument doesn't touch it."
