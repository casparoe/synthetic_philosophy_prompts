answer: |-
  1. Prepare two opaque bags, one with a fixed 50/50 split of red and black chips, and leave the second empty to be filled based on aggregated student uncertainty intervals. Distribute index cards for each student to privately record their minimum selling price for four bets: red or black from the known bag, and red or black from the ambiguous bag. The ambiguous bag's composition is determined by pooling the class's submitted ranges to define a uniform distribution from which the actual ratio is drawn only after all prices are collected.

  2. Start with ten minutes for students to submit uncertainty intervals which you aggregate on the projector to define the ambiguous bag's parameter range without fixing the specific ratio. Dedicate thirty minutes to the pricing round for the four tickets, followed by fifteen minutes on the information purchase and adversarial source comparisons where the source mechanism varies. Reserve the final twenty minutes for the actual chip draws, scoring calculation, and the debrief discussion where the inconsistency is revealed.

  3. Implement a Becker-DeGroot-Marschak mechanism where a random offer is generated, forcing a trade if the offer exceeds their stated price so that honesty maximizes expected points. This ensures honesty because overstating risks losing a profitable trade while understating risks forcing an unfavorable sale, aligning their written numbers with true valuations. Points are tallied across rounds to determine the winner of the trivial prize, ensuring incentives remain consistent without real money changing hands.

  4. Write nothing on the board until the pricing data is collected, then display the class median prices for all four tickets side-by-side to highlight the sum exceeding one hundred percent. Guide the debrief by mapping the higher ambiguous prices to ambiguity aversion and the color reversal to the violation of additive probability rules. Conclude by explaining how the sure-thing principle demands consistent valuations across known and unknown states that their choices empirically rejected before introducing the term ambiguity.

  5. Students may attempt to hedge across rounds by varying prices strategically, so you must emphasize that only one randomly selected round counts for prizes to prevent this behavior. The activity cannot generate true risk aversion distinct from ambiguity aversion because the point stakes are too trivial to trigger utility curvature. You will have to state verbally that the adversarial round tests source dependence rather than probability itself, as the game cannot fully disentangle distrust from genuine uncertainty aversion.
