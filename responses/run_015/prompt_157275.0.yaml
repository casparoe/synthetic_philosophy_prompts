answer: |-
  Here is the specification analysis for your ontology identification method, weighted toward the logical constraints of the criteria themselves.

  ### 1. Triage: Genuine Constraints vs. Realist Reflexes

  You have five candidate requirements. Three are functional necessities for the project you described; two are philosophical commitments that may contradict the project's constraints.

  *   **Req 1: Separate electrons from phlogiston.**
      *   **Verdict:** **Realist Reflex.**
      *   **Case:** This requirement demands *truth-tracking* (distinguishing what *actually* exists from what doesn't), but your project is *ontology identification* (distinguishing what a *theory* says exists). More critically, you specified the domain includes entities *inaccessible in principle*. If something is inaccessible in principle, no method available to you can distinguish its "electron-status" from its "phlogiston-status" retrospectively, because you cannot check the causal history. Demanding this is demanding a god's-eye view that your epistemic constraints explicitly forbid. It conflates *commitment* with *correctness*.
  *   **Req 2: Scale invariance (coin vs. horizon).**
      *   **Verdict:** **Nuanced/Genuine.**
      *   **Case:** This is genuine only if qualified. A coin under a cup is *practically* inaccessible (verifiable in principle); a region past the cosmological horizon is *principally* inaccessible (verifiable in no possible world consistent with physics). A method that treats these identically ignores the modal difference between *hard-to-reach* and *impossible-to-reach*. However, as a constraint on *consistency*, it is genuine: if your method relies on "inaccessibility" to void commitment, it must apply consistently across the *type* of inaccessibility, not the physical size.
  *   **Req 3: No collapse ("can't tell" $\neq$ "nothing").**
      *   **Verdict:** **Genuine.**
      *   **Case:** This is the core of your problem. If your method equates epistemic limits with ontological voids, it is not an ontology identification method; it is a verificationist truth-test. To distinguish verbal disputes from real ones in underdetermined cases, you must be able to say "Theory A commits to X, Theory B does not," even if we can never know if X is real.
  *   **Req 4: Distinguish commitment from reality.**
      *   **Verdict:** **Genuine (Definitional).**
      *   **Case:** This is not a preference; it is the definition of the task. If the method outputs "what is real" rather than "what the theory posits," it has failed the spec. It must be able to output "Theory T is committed to ghosts" without outputting "Ghosts exist."
  *   **Req 5: Specify the input (Formalism vs. Practice).**
      *   **Verdict:** **Genuine (Methodological).**
      *   **Case:** Ontology is not a property of the world alone, nor of sentences alone, but of the *representation* of the theory. Quine's criterion works on formalized sentences; Brandom's works on inferential practices. If you do not specify the input, the method is an algorithm without data types.

  ### 2. Non-Negotiables vs. Camp-Specific Desires

  **Non-Negotiable (For this specific project):**
  *   **Req 3 (No Collapse):** If you allow this collapse, the "hard cases" (inaccessible info) vanish by fiat. You aren't solving the problem; you are dissolving it via positivism.
  *   **Req 4 (Commitment/Reality):** Without this, you aren't doing meta-ontology; you're doing metaphysics.
  *   **Req 5 (Input Spec):** Without this, the method is ambiguous. You cannot compare verdicts if one is derived from a Lagrangian and another from a sociological survey of physicists.

  **Camp-Specific (Negotiable depending on stance):**
  *   **Req 1 (Electrons/Phlogiston):** This is a Scientific Realist demand. A Constructive Empiricist or Instrumentalist will reject this as a requirement for *ontology identification*, arguing that we can only distinguish them via empirical adequacy, not ontological commitment.
  *   **Req 2 (Scale Invariance):** A Verificationist will reject this, arguing the coin *can* count as commitment (verifiable in principle) while the horizon *cannot*. A Realist will accept it. Your stance on this determines your epistemic baseline.

  ### 3. The Incompatible Pair: The Underdetermination Trap

  Your hunch is correct. The two requirements that cannot both be satisfied in the hard cases are:

  1.  **Empirical Sufficiency:** "The accessible evidence fixes the verdict."
  2.  **Ontological Determinacy:** "The verdict is unique and determinate."

  **The Case:**
  Consider two formulations of a theory (e.g., Bohmian Mechanics vs. Standard QM, or different topological models of the universe) that are empirically equivalent. They agree on all accessible evidence (past, present, and future) but differ on the inaccessible ontology (e.g., existence of determinate particle trajectories).
  *   If you insist on **Empirical Sufficiency**, your method must output the *same* ontology for both, because the evidence is identical. This implies the dispute is merely verbal.
  *   If you insist on **Ontological Determinacy** (that the theories genuinely differ in commitment), your method must output *different* ontologies. This implies the verdict is *not* fixed by accessible evidence.

  You cannot have a method that is driven solely by evidence *and* claims to detect ontological differences that make no difference to the evidence. You must choose: either evidence determines ontology (and you lose the distinction in hard cases), or ontology outruns evidence (and you lose empirical determination).

  ### 4. The Most Exclusionary Requirement

  The single requirement that rules out the most candidate methods is **Req 3: No Collapse ("we can't tell" $\neq$ "there's nothing").**

  **Why:**
  The history of philosophy of science is largely a history of attempts to solve the problem of inaccessibility by collapsing it.
  *   **Logical Positivism / Verificationism:** Explicitly collapses unverifiable claims into meaninglessness or non-commitment.
  *   **Constructive Empiricism (Van Fraassen):** While it distinguishes commitment from belief, it often treats the *acceptance* of the theory as the limit of ontological commitment regarding unobservables, effectively sidelining the inaccessible.
  *   **Operationalism:** Defines entities by measurement; no measurement, no entity.

  By demanding that your method *must not* collapse epistemic limits into ontological negation, you immediately disqualify the entire verificationist/empiricist tradition, which constitutes the most robust set of existing tools for handling inaccessible information. You are forcing your method to be **Realist about Commitment** even when it must be **Agnostic about Truth**. This is the hardest constraint to satisfy because it requires the method to carve reality at the joints of *theory structure* rather than *evidence structure*, which is notoriously difficult without slipping into dogmatism.

  **Recommendation:**
  Drop Req 1 (it's impossible for your domain). Keep Req 3, 4, and 5 as your hard constraints. Accept that Req 2 depends on whether you treat *practical* and *principled* inaccessibility as epistemically distinct. Finally, acknowledge that you must sacrifice either Empirical Sufficiency or Ontological Determinacy in cases of radical underdetermination; you cannot have both.
