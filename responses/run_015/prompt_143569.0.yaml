answer: |-
  1. Setup, roles, and rules
  Split the 18 students into 3 "Development Bureaus" of 6. Give each Bureau 10 Credibility Tokens (paper slips) and a diagnostic sheet. On the whiteboard, draw the "Ostra Matrix" with three variables: Institutions, Culture, Geography. Initially, all are valued at 5 points. Here's teh setup: Bureaus must diagnose Ostra's stagnation by placing tokens on one variable they think is the root cause. But the Matrix updates secretly after each round. If >50% of total tokens go to Institutions, the value of Culture drops to zero next round because they're mutually exclusive in this model. You want to maximize your Bureau's accuracy, but the "truth" shifts based on consensus. No talking between Bureaus. They are competing for reputation, but the board rules change based on their collective choices. The goal isn't to win, but to see if they can stabilize the economy. They can't. The rules force interdependence. If they treat variables as independent, the system crashes. Keep the rules tight so they focus on the allocation, not the mechanics.

  2. Round-by-round flow
  Round 1 (15 min): Diagnosis. Bureaus secretly allocate tokens. Reveal. If most picked Institutions, announce "Institutional reform triggered cultural backlash." Update board values (Inst +2, Cult -2). They see their choice altered the landscape.
  Round 2 (20 min): Intervention. Spend tokens to fix the chosen cause. But now the Board says "Geography limits Institutional reach." If they spent on Inst, those points vanish because the Geo variable was neglected. They realize their cause changed the effect. They start panicking, trying to hedge bets.
  Round 3 (25 min): Counterfactual Swap. Ask them to swap causes (e.g., swap Inst for Cult) to test a counterfactual. Reveal that the swap yields negative growth because the "Institution" card no longer functions without the original Culture backing it. The card is void. Game ends in confusion/stalemate. They want to know why their strategy failed. The board shows high investment but zero growth. This mirrors the mirror-state problem: the institution didn't change, but its function did because the feedback loops (represented by the Matrix values) shifted beneath them. They feel the collapse of the variable's meaning.

  3. Debrief, failure modes, and recovery
  Debrief (15 min). Map Round 1 to Equifinality (many paths look same initially). Round 2 to Overdetermination (causes pile up, effects blur). Round 3 to Counterfactual Fragility (swapping breaks the system).
  Failure: Students might treat it as a puzzle to solve rather than a paradox. They'll try to find the "right" answer or blame the rules. They might collude to game the token system.
  Recovery: Stop the clock. Point out that their frustration *is* the data. The game isn't broken; the premise of isolating variables is. Ask: "Why did the Institution card stop working in Round 3?" Guide them to see that the context changed the content. If they resist, admit the game is rigged to fail because reality is rigged that way. Their inability to isolate the cause proves the point. Don't let them leave thinking they just played badly. The failure is the lesson. Make sure they articulate why the counterfactual swap felt impossible. That feeling is the theoretical takeaway.

  4. The gap we can't stage
  Be honest: The game uses fixed rules to show instability. But in reality, the *definition* of the institution changes. In the game, "Property Rights" is a card. In reality, "Property Rights" in Ostra means something different than in Country B because the social enforcement differs. The game can't simulate semantic drift, only mechanical interference. You have to lecture that part. Tell them: "In the game, the card stayed the same. In history, the card changes text when you move it." That conceptual slippage is the core of the mirror-state problem. The activity makes them feel the structural collapse, but you need to verbalize the semantic collapse. Don't skip this, or they'll think it's just about complex systems rather than meaning.
