answer: |-
  The Recurrence

  We count the world and find it starts with three,
  scratched on a stone, a temporary mark,
  hoping the sum will turn out to be true.
  The value sits outside the chalk and hand,
  immune to erosion, leaving nothing worn,
  returning to the page to start again.

  How do we reach what visits us again?
  If numbers float outside the causal chain,
  contact is broken, leaving nothing known.
  We point to sets containing one and three,
  but set theory leaves a different mark
  on what we claim is strictly true.

  We ask what makes the identity true.
  If Caesar walks, he returns again,
  but numbers sit outside the flesh.
  One reduction puts one inside three,
  another leaves no set-theoretic mark,
  to settle what is nothing.

  We cannot build the world on top of nothing.
  Our best theories quantify until true,
  demanding the ontology leave a mark.
  We must accept the load they carry again,
  for science needs the structure of three
  refusing to let the objects stay outside.

  Keep the physical world outside the math.
  A conservative extension, nothing more,
  reformulate the science, lose the three,
  derive the same results without the true
  ontological cost. It is instrumental again,
  proving the ontology leaves no mark.

  Every consistent story leaves a mark,
  finds a realm, leaves the identification outside.
  All models return again,
  there is nothing singular here.
  No single kingdom makes the statement true,
  no unique referent for the number three.

  So nothing settles who should bear the mark,
  whether three exists to make the statement true,
  or if we walk this circle again outside.

  I placed the six end-words in the envoi as three pairs to satisfy the requirement that all six appear again while maintaining the three-line structure. The philosophical terminology aims for precision over meter, particularly in the fifth stanza regarding conservative extensions.
