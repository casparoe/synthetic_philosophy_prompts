answer: |-
  # Specification for an Adequate Theory of the Bootstrapping Problem

  This document outlines the desiderata for any epistemological theory claiming to adequately resolve the bootstrapping problem. The list is divided into structural constraints (Non-Negotiable) and substantive verdicts (Camp Preferences), though a theory's ability to *justify* its verdict on the latter is itself Non-Negotiable.

  ## Part I: The Desiderata List

  ### 1. The Canonical Perceptual Bootstrapping Case
  *   **Motivating Case:** Vogel's "Red Table" or Cohen's "Zebra." A subject sees a red table (or zebra), believes it is red (or a zebra), and infers her vision is reliable because it coheres with the output.
  *   **Requirement:** The theory must deliver a determinate verdict on whether the subject acquires knowledge of reliability. If the verdict is "No," it must identify the specific failure point (premise, inference, or warrant). If "Yes," it must explain the strong pre-theoretical intuition of illegitimacy.
  *   **Status:** **Non-Negotiable (NN).** A theory that fails to address the canonical case is not a theory of bootstrapping. (The *verdict* itself is a Camp Preference, but the *explanation* is NN).

  ### 2. The Instrument-Checking Case
  *   **Motivating Case:** A subject checks a thermometer against a known standard, or reads a thermometer to confirm it works in a context where the reading is plausible.
  *   **Requirement:** The theory must explicitly state whether this is epistemically isomorphic to the perceptual case. If distinct, it must identify the relevant difference (e.g., prior justification, independent access).
  *   **Status:** **Non-Negotiable (NN).** Equivocation between distinct source types is a structural failure.

  ### 3. The No-Lose Bootstrapping Case
  *   **Motivating Case:** A "self-verifying" source or a test design where the output guarantees the truth of the reliability claim (e.g., a gauge that reads "Working" only if it is working).
  *   **Requirement:** The theory must determine if knowledge is conferred here. If it denies knowledge here, it risks skepticism; if it grants it, it must explain why this doesn't collapse into the Canonical Case (1).
  *   **Status:** **Camp Preference (CP).** Some theories treat this as a genuine exception; others treat it as a reductio of the setup.

  ### 4. The Rollback Case (Epistemic Circularity)
  *   **Motivating Case:** Using a process to justify the process, then using that justification to bolster the original belief (Alston's doxastic practice).
  *   **Requirement:** The theory must distinguish between *premise circularity* (begging the question) and *rule circularity* (using a rule to validate the rule). It must declare which, if either, is vicious.
  *   **Status:** **Non-Negotiable (NN).** Failure to distinguish types of circularity renders the theory unable to handle recursive justification.

  ### 5. The Verification-versus-Ratification Distinction
  *   **Motivating Case:** Using a ruler to measure a table (verification) vs. using a ruler to prove the ruler is accurate (ratification).
  *   **Requirement:** The theory must provide a criterion for drawing this line. It must specify whether the line is sharp (categorical) or gradient (degree of confidence).
  *   **Status:** **Non-Negotiable (NN).** Blurring this distinction dissolves the problem rather than solving it.

  ### 6. The First-Order-versus-Second-Order Knowledge Distinction
  *   **Motivating Case:** Knowing *p* (the table is red) vs. Knowing *that I know p* (my vision is reliable).
  *   **Requirement:** The theory must state whether bootstrapping is a failure of first-order knowledge, second-order knowledge, or the link between them. It must take a stance on the KK principle.
  *   **Status:** **Camp Preference (CP).** Internalists typically demand 2nd-order; Externalists often deny its necessity for 1st-order.

  ### 7. The Closure Principle
  *   **Motivating Case:** If I know I see a zebra, and I know "Zebra" entails "Not Mule," do I know it's not a Mule?
  *   **Requirement:** The theory must explicitly Accept, Deny, or Restrict Closure under Known Entailment. If Restricted, the restriction must be principled, not *ad hoc*.
  *   **Status:** **Camp Preference (CP).** Denial is costly but logically permissible; Acceptance is standard but generates Easy Knowledge.

  ### 8. The Trilemma Structure
  *   **Motivating Case:** Cohen's Trilemma: (1) Bootstrapping yields knowledge (Easy Knowledge), (2) Closure fails, or (3) Skepticism is true.
  *   **Requirement:** The theory must locate itself on one horn or argue the trilemma is false (dissolvable). It cannot evade the choice.
  *   **Status:** **Non-Negotiable (NN).** Evading the logical structure of the argument is a dialectical failure.

  ### 9. The Anti-Circularity Constraint
  *   **Motivating Case:** The intuition that a source cannot pull itself up by its own bootstraps.
  *   **Requirement:** The theory must formulate a precise constraint on circular reasoning. It must explain why some circularity (e.g., in logic) is acceptable while epistemic circularity is suspect.
  *   **Status:** **Non-Negotiable (NN).** A theory without a constraint on circularity cannot explain the problem's force.

  ### 10. The Safety and Sensitivity Conditions
  *   **Motivating Case:** Modal epistemology. Is the belief that "my vision is reliable" safe (true in nearby worlds) or sensitive (wouldn't be held if false)?
  *   **Requirement:** The theory must apply modal conditions to the bootstrapped belief. It must acknowledge if bootstrapped beliefs are Safe but intuitively unjustified.
  *   **Status:** **Camp Preference (CP).** Reliabilists prioritize Safety; Tracking theorists prioritize Sensitivity.

  ### 11. The Disjunctive Response
  *   **Motivating Case:** Knowing "Either my vision is reliable or the table is not red" without knowing which.
  *   **Requirement:** The theory must assess whether this disjunctive knowledge is epistemically valuable or a hollow logical victory.
  *   **Status:** **Camp Preference (CP).** Some view this as a valid escape; others as a concession of defeat.

  ### 12. The Legitimate Self-Correction and Calibration Cases
  *   **Motivating Case:** Using a thermometer to find it reads 2° high and adjusting it (calibration).
  *   **Requirement:** The theory must distinguish this from bootstrapping. It must identify the "independent anchor" (if any) that makes calibration legitimate.
  *   **Status:** **Non-Negotiable (NN).** Failing to account for everyday successful calibration renders the theory practically implausible.

  ---

  ## Part II: Structural Tensions and Incompatibilities

  No theory is likely to satisfy all desiderata without cost. The following pairs represent the primary friction points where joint satisfaction is arguably impossible without significant theoretical modification.

  | Tension Pair | Description of Conflict |
  | :--- | :--- |
  | **1 (Canonical Case Intuition) & 7 (Closure)** | **The Core Conflict.** If you accept Closure (7) and grant that basic perception yields knowledge, you are forced to accept Easy Knowledge in the Canonical Case (1). To match the intuition that (1) fails, you must usually restrict or deny (7). |
  | **3 (No-Lose) & 9 (Anti-Circularity)** | **The Guarantee Problem.** In No-Lose cases, the circularity guarantees truth. A strict Anti-Circularity constraint (9) forbids the move, but this implies a subject cannot know a source is reliable even when the setup guarantees it. |
  | **10 (Safety) & 1 (Canonical Case Intuition)** | **The Modal Gap.** Bootstrapped beliefs are often *Safe* (if the source is reliable, the belief is true in nearby worlds). If Safety is sufficient for knowledge, (1) should yield knowledge. If (1) does not yield knowledge, Safety is insufficient. |
  | **5 (Verification/Ratification) & 12 (Calibration)** | **The Line-Drawing Problem.** Distinguishing verification from ratification (5) is necessary to block bootstrapping, but legitimate calibration (12) looks structurally identical to ratification. Drawing a sharp line is notoriously difficult. |

  ---

  ## Part III: Scorecard of Existing Contenders

  **Legend:**
  *   **PASS:** Satisfies the desideratum naturally.
  *   **COST:** Satisfies the desideratum but incurs a significant theoretical price (e.g., denying a standard principle).
  *   **FAIL:** Cannot satisfy the desideratum without contradiction or evasion.
  *   **MOD:** Requires significant modification of the standard view to satisfy.

  | Desideratum | Reliabilist Embracers (e.g., Vogel) | Closure-Deniers (e.g., Dretske) | Anti-Circularity (e.g., Alston) | Easy-Knowledge Deniers (e.g., Weisberg) | Skeptics |
  | :--- | :---: | :---: | :---: | :---: | :---: |
