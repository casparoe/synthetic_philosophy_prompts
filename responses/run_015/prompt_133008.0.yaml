e it governs, and self-undermining in its institutional prerequisites. If no established term captures exactly this triad, I would like a clear delineation of which adjacent concepts come closest—such as moral fanaticism, self-defeating prophecies, or particular forms of epistemic game theory—and where the boundaries lie.
