answer: |-
  There is **no single established term** in philosophy, economics, or sociology that precisely captures the triad you have described. While each component of the pattern has a well-known name, their specific combination—normative enforcement of expected-value (EV) reasoning, endogenous probability estimation, and institutional self-undermining—constitutes a distinct configuration that currently sits in the gaps between several disciplines.

  You are describing a **socio-epistemic pathology** rather than a purely decision-theoretic error. Below is a delineation of the adjacent concepts that come closest, why they fall short, and a proposed taxonomy for the phenomenon you have identified.

  ### 1. The Three Components and Their Adjacent Terms

  To understand why no single term exists, it helps to map your triad to its nearest conceptual neighbors.

  **A. The Decision-Theoretic Component: "Expected-Value Fanaticism"**
  *   **The Concept:** The willingness to accept a tiny probability of an enormous outcome over a certainty of moderate value (often discussed in the context of Pascal's Mugging or Longtermism).
  *   **The Gap:** Standard discussions of fanaticism (e.g., by Beckstead, Thomas, or Isaacs) treat this as an individual or aggregate *calculation* problem. They do not account for the **social enforcement** mechanism you describe. In your pattern, the EV calculation is not just a tool for decision-making; it is a **boundary marker for community membership**. Dissent is treated as heresy (irrationality) rather than disagreement.

  **B. The Sociological Component: "Performativity" or "Reflexivity"**
  *   **The Concept:**
      *   **Reflexivity (George Soros):** Market participants' views affect the fundamentals they are trying to predict.
      *   **Performativity (Michel Callon / Donald MacKenzie):** Economic theories do not just describe the world; they shape it to resemble the theory (e.g., option pricing models making markets behave like Black-Scholes).
  *   **The Gap:** These concepts capture the **endogeneity** you identified (capital directs probability). However, standard performativity theory usually assumes the feedback loop stabilizes the system (makes the theory *more* true). Your pattern describes a **counter-performative** or **self-undermining** loop: the belief reshapes the world in a way that eventually destroys the conditions necessary for the belief to be realized.

  **C. The Institutional Component: "Self-Defeating Prophecy"**
  *   **The Concept:** A prediction that causes itself to fail (e.g., a bank run prediction causes the run).
  *   **The Gap:** A self-defeating prophecy usually results in the *abandonment* of the belief once the failure occurs. In your pattern, the social enforcement of rationality prevents the belief from being abandoned even as the institutional substrate erodes. The community doubles down on the EV calculation *because* the probability is endogenous, creating a **resilient self-defeat**.

  ### 2. The Missing Synthesis: Why This Is Distinct

  The phenomenon you are isolating is distinct because it fuses **normative epistemology** with **institutional fragility**.

  1.  **Normative Epistemology:** It is not enough to disagree; one must fail the "rationality test." This transforms a probabilistic estimate into a **moral/cognitive status signal**. (Adjacent concept: *Epistemic Signaling* or *Rationality Signaling*).
  2.  **Endogenous Credibility:** The probability is not fixed by external reality but by internal resource allocation. (Adjacent concept: *Endogenous Risk*).
  3.  **Substrate Erosion:** The resource allocation required to validate the probability degrades the institutional stability required to achieve the outcome. (Adjacent concept: *Goodhart's Law* applied to institutional capacity).

  ### 3. Proposed Terminology

  Since no canonical term exists, you have the option to adopt a descriptive synthesis. Based on the literature, here are the three most precise ways to name this pattern, depending on which disciplinary lens you wish to prioritize:

  **Option 1: "Reflexive Fanaticism"**
  *   **Why:** Combines the decision-theoretic error (Fanaticism) with the sociological mechanism (Reflexivity).
  *   **Nuance:** This highlights that the fanaticism is sustained by the feedback loop. The more the community invests, the more "rational" the fanaticism appears, even as it becomes more dangerous.
  *   **Best for:** Discussions focused on the *decision-making* pathology within communities like Effective Altruism or Longtermism.

  **Option 2: "The Performative Rationality Trap"**
  *   **Why:** Draws on MacKenzie's *Performativity*. The theory of rationality (EV maximization) performs a reality (high probability of success) that is ultimately false because it consumes the infrastructure needed to make it true.
  *   **Nuance:** Emphasizes the *construction* of the probability estimate through social capital.
  *   **Best for:** Sociological or institutional analysis.

  **Option 3: "Epistemic Goodharting"**
  *   **Why:** Goodhart's Law states, "When a measure becomes a target, it ceases to be a good measure." Here, "Expected Value" becomes a target for social status. Consequently, the probability estimates (the measure) cease to track external reality and instead track internal capital allocation, leading to systemic failure.
  *   **Nuance:** Highlights the *incentive structure* driving the distortion.
  *   **Best for:** Economic or game-theoretic contexts.

  ### 4. Boundary Delineation

  To ensure you are not misapplying an existing term, here are the boundaries where your pattern diverges from adjacent concepts:

  *   **Vs. Groupthink:** Groupthink is about *conformity for social harmony*. Your pattern is about *conformity for epistemic purity*. Members believe they are being *more* rational, not just more agreeable.
  *   **Vs. Moloch / Multi-Polar Trap:** Moloch describes a coordination failure where actors sacrifice values for competitive advantage. Your pattern can occur in a *unipolar* or coordinated community. The enemy is not a competitor, but the *internal logic of the coordination itself*.
  *   **Vs. Cargo Cult Science:** Cargo culting involves mimicking the *form* of science without the substance. In your pattern, the community is rigorously applying the *substance* of decision theory (EV calculations), but the *inputs* are corrupted by the social process.
  *   **Vs. Hyperstition:** (Ccru/Nick Land). Hyperstition is an idea that makes itself real. Your pattern is an idea that makes itself *plausible* while making its realization *impossible*. It is a **failed hyperstition** sustained by social norms.

  ### 5. Recommendation

  If you are writing for a philosophical or technical audience, I recommend using **"Reflexive Fanaticism"** but defining it explicitly as you have done.

  If you need to reference the specific mechanism of the probability estimate, **"Endogenous Probability Loop"** is precise.

  However, the most accurate label for the *social-epistemic* dynamic you described—where rationality itself is the enforcement mechanism—is **"Normative Performativity Collapse."**

  **Key Literature to Cite in Support:**
  *   **Donald MacKenzie,** *An Engine, Not a Camera* (for Performativity).
  *   **C. Thi Nguyen,** *Echo Chambers and Epistemic Bubbles* (for the social structure of trust/rationality).
  *   **Nick Bostrom / William MacAskill** (for the baseline EV/Longtermism framework you are critiquing).
  *   **George Soros,** *The Alchemy of Finance* (for Reflexivity).
  *   **Robert K. Merton,** *The Self-Fulfilling and Self-Defeating Prophecy*.

  You have identified a genuine gap in the taxonomy of social epistemology. It is a specific form of **institutional fragility driven by normative epistemology.**
