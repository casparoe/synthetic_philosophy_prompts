  **(Self-Correction during drafting):** I need to make sure I don't just say "history is complex." I need to explain *why* that complexity breaks the specific logical machinery the user is defending (contrastive explanation via difference-making). The key is the failure of *independence* between the foil and the background. In the decay case, the background is independent of the specific decay event. In the divergence case, the "foil" (China) is part of the "background" for the "topic" (Britain) via trade/prices/etc. This is the crucial technical point.

