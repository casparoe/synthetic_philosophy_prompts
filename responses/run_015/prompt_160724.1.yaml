answer: |-
  # DIAGNOSTIC TREE: MORAL STATUS OF SMALL INVERTEBRATES

  **ROOT COMMITMENT:** You grant that there is a non-zero, non-trivial chance an insect has valenced states, and if it does, those states carry at least some moral weight.

  **1. NATURE OF UNCERTAINTY**
  Is the uncertainty regarding insect sentience primarily **resolvable empirical ignorance** (facts exist but are unknown) or **constitutive vagueness** (sentience is a cluster concept with no sharp boundary)?
  *   **Vagueness** → Go to 2.
  *   **Empirical** → Go to 3.

  **2. VAGUENESS AGGREGATION**
  Does moral aggregation fail when the subject's status is indeterminate, even if expected value seems positive?
  *   **Yes** → **LEAF A: Vagueness Skeptic**
  *   **No** → Go to 4.

  **3. WEIGHT OF PROBABILITY**
  Is a 10% chance of full sentience morally equivalent to 10% of the weight of a definite subject, or does status uncertainty demand a different handling (e.g., requiring a definite bearer)?
  *   **Different Handling** → **LEAF B: Aggregation Rejector**
  *   **Equivalent (Proportional)** → Go to 4.

  **4. DECISION THEORY**
  Do you maximize expected value even when tiny probabilities multiply by astronomical numbers (insect counts), or do you apply a probability threshold/variance penalty?
  *   **Threshold/Penalty** → **LEAF C: Anti-Fanatic**
  *   **Maximize EV** → Go to 5.

  **5. UNIT OF CONCERN**
  Does moral concern scale with the number of organisms/valenced moments, or does the richness/temporal integration of experience lexically outweigh sheer numbers?
  *   **Richness/Lexical** → **LEAF D: Capacity Threshold Skeptic**
  *   **Numbers/Moments** → Go to 6.

  **6. MICROFAUNA EXTENSION**
  If your principle applies to insects, does it extend to mites/nematodes/soil microfauna where numbers are larger again but sentience probability is lower?
  *   **No (Principled Stop)** → **LEAF E: Scale-Limited Prioritarian**
  *   **Yes** → Go to 7.

  **7. CASE 1: TRADE-OFF**
  *Program A certainly averts fixed suffering in 100 chickens. Program B averts the same per-animal suffering across 10 million insects with probability $P$, otherwise does nothing.*
  At what probability $P$ are you indifferent? Is $P$ high (e.g., >50%, respecting chicken certainty) or low (e.g., <5%, respecting insect numbers)?
  *   **High ($P$ > 50%)** → **LEAF F: Research-First Postponer**
  *   **Low ($P$ < 5%)** → Go to 8.

  **8. TRACTABILITY & PREDICTION**
  Does our inability to predict the ecological effects of intervening defeat the priority claim, or merely convert it into a case for investigating first?
  *   **Defeats Priority** → **LEAF G: Tractability-Based Deprioritizer**
  *   **Investigate First** → Go to 9.

  **9. CASE 2: POPULATION**
  If insect lives are on balance bad, does expected welfare arithmetic favor reducing insect abundance despite ecological/epistemic risk, or is there a constraint against intervening that way?
  *   **Constraint Against** → **LEAF H: Ecological Constraint View**
  *   **Favor Reducing** → Go to 10.

  **10. OBLIGATION STATUS**
  If the scale argument wins, does it generate a strict **obligation** to reallocate resources, or only a **permission**?
  *   **Permission** → **LEAF I: Permissive Prioritarian**
  *   **Obligation** → **LEAF J: Straight EV Insect Prioritarian**

  ***

  ## LEAF ANALYSIS

  **LEAF A: Vagueness Skeptic**
  *   **Awkward Commitment:** You must ignore potential suffering whenever the boundary of "subject" is blurry, regardless of expected stakes.
  *   **Cases:** Rejects both insect programs; uncertainty blocks action entirely.

  **LEAF B: Aggregation Rejector**
