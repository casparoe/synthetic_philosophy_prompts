prompt: |-
  Please act as a professional philosopher who specializes in moral psychology and the ethics of blame, and work through this carefully rather than quickly: start with a short brainstorm of three or four bullet points in which you lay out the cases that any adequate answer has to get right, then give me a single argued verdict rather than a survey of options. I explicitly do not want references, reading suggestions, or citations — I can read the literature myself; what I want is your own analysis, worked out from the cases and from first principles, and I want you to commit to verdicts rather than hedging between them.

  Some background, since this stopped being academic for me very recently. I smoked, and then vaped, for roughly twelve years, and I quit about eight months ago. Last week I told my younger brother that I thought he was being reckless about vaping, and he replied that I had no standing to say anything to him because I did the same thing for more than a decade. My instinct is that quitting, plus being honest about the fact that I did it, is somehow supposed to restore my standing, but I cannot say why, and my brother's tu quoque has a grip on me that I would like either to break or to vindicate. I am also auditing an ethics seminar this term and would like to bring something sharper than my own muddle to the next session.

  So please compare two principles about when a hypocritical (or merely imperfect) blamer lacks standing. Call the first the Clean Hands principle: a blamer lacks standing to blame someone for violating norm N if the blamer has herself violated N, or something relevantly close to N, without having acknowledged, apologized for, or otherwise repaired it; on this view standing is forfeited through an unrepaired record and restored through acknowledgement and repair. Call the second the Symmetric Address principle: standing has nothing to do with the blamer's record, and everything to do with whether the blamer genuinely accepts that N binds her in the way it binds the person she is blaming — whether she would accept blame directed at herself as legitimate instead of treating herself as exempt. On this second view a weak-willed blamer, who fully accepts the norm and judges herself by it but cannot bring herself to comply, keeps her standing, while a blamer who complies perfectly but would regard any blame aimed at herself as out of place loses it.

  The interesting part, I think, is that the two principles come apart in both directions, and I would like you to test them against the full range rather than against whichever case happens to favor your preferred theory. Consider at least these: (1) my own case — a long record, now apparently reformed, openly acknowledged; (2) an unrepentant current smoker who tells his teenage daughter not to start and who fully intends to keep smoking himself; (3) a blamer who accepts the norm, feels genuine guilt, and would be embarrassed but not resistant if blamed, yet never quite gets around to reforming; and (4) a manager who is scrupulously punctual herself and disciplines her team for lateness, but who would be furious at the suggestion that anyone could criticize her for being five minutes late, since she takes punctuality norms to run downward and not upward. Then, if it helps, (5) the institutional analogue: a university that sanctions students for submitting AI-written essays while its own admissions office used generative AI to draft outreach emails — and here please distinguish standing to blame (to address someone as having done wrong) from standing to impose a formal penalty, since I suspect the two notions track different conditions and that a principle may handle one and not the other.

  In your verdict, tell me which principle handles the whole range better, name the case or cases where you think it gives the wrong answer and say why, and then consider whether a third view subsumes both — for instance one that asks what blame is for (moral address, protest of a violated relationship, deterrence, expression of a demand) and derives standing from whether the blamer can coherently perform that function. If you propose such a hybrid, show that it does not collapse into mere intuition-mongering: state the condition precisely enough that I could apply it to a new case without you. Aim for roughly 700 to 900 words, and be concrete throughout.
