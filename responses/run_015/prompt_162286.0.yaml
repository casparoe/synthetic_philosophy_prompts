answer: |-
  *   **The Unrepentant Father:** A current smoker forbidding his daughter from vaping lacks standing because he treats the norm as optional for himself.
  *   **The Weak-Willed Blamer:** A smoker who hates her addiction, accepts criticism, yet fails to quit retains standing because she acknowledges the norm's authority over her.
  *   **The Elitist Manager:** A punctual manager who disciplines lateness but rejects criticism of her own minor tardiness lacks standing because she denies the norm's universality.
  *   **The Reformed Vaper:** A former smoker who quit and acknowledges the harm retains standing because their conduct now manifests acceptance of the norm's bindingness.

  The **Symmetric Address principle** is correct; the **Clean Hands principle** is false. Clean Hands mistakes moral standing for a transactional status earned through perfection or purchased through apology. It fails because it cannot explain why the weak-willed blamer (Case 3) retains standing despite an unrepaired record. If standing depended on a clean record, the struggling addict who genuinely accepts the norm and welcomes criticism would be silenced alongside the hypocrite. This is intuitively wrong. Her failure is a weakness of will, not a rejection of the normative community. She remains open to the same demands she places on others. Conversely, Clean Hands falsely grants standing to the elitist manager (Case 4). She has clean hands regarding punctuality, yet she lacks standing because her fury at upward criticism reveals she views the norm as a tool of power rather than a shared obligation. She exempts herself from the community she polices.

  Symmetric Address succeeds because it locates standing in the *relationship* blame constitutes. Blame is not merely a penalty; it is a moral address that invites the blamed party to recognize a shared value. This invitation is coherent only if the blamer acknowledges that the value binds them equally. The unrepentant father fails this test; he asserts a rule he intends to violate, treating his daughter as a subject rather than a partner in normativity. The weak-willed blamer passes it; her guilt confirms she accepts the norm's authority, even if she lacks the strength to comply. Her blame says, "We are both subject to this," whereas the hypocrite says, "You are subject to this, I am not."

  Your case (Case 1) is resolved by this distinction. Your brother's *tu quoque* assumes you claim exemption. However, by quitting and acknowledging your past error, you demonstrate that you now accept the norm's bindingness. You are not claiming to be above the rule; you are admitting you were wrong to violate it and are now trying to comply. Your standing is restored not because your hands are clean, but because you have rejoined the normative community you once opted out of. If you had quit but insisted you were never wrong to vape, you would lack standing despite Clean Hands compliance. The repair matters only insofar as it signals renewed acceptance of the norm's authority over you.

  The institutional analogue (Case 5) clarifies the limits of this principle by distinguishing **standing to blame** from **authority to penalize**. A university sanctioning students for AI use while using AI itself lacks *moral standing* to address the students as wrongdoers because it exempts itself from the integrity norm it enforces. It cannot coherently invite students into a community of honesty it does not inhabit. However, it retains *administrative authority* to penalize. Penalties rely on contractual power and deterrence, not moral reciprocity. The university can enforce rules without moral standing, but it cannot legitimately claim moral outrage. Conflating these leads to confusion: the students may rightly resent the hypocrisy (lack of standing) while still being subject to the sanction (possessing authority).

  Therefore, the correct principle is a functional hybrid: **The Non-Exemption Condition.** A blamer lacks standing to blame someone for violating norm N if the blamer's attitudes or conduct manifest an exemption from N that denies the blamed party equal membership in the normative community. This is precise enough for application: ask whether the blamer would accept the same blame, under similar conditions, as legitimate. If the answer is no—whether due to ongoing violation (the father), hierarchical privilege (the manager), or institutional double standards (the university)—standing is lost. If the answer is yes—even if compliance is imperfect (the weak-willed, the reformed vaper)—standing remains. This avoids intuition-mongering by focusing on the structural reciprocity required for moral address to function as anything other than coercion. Your brother's objection fails because you satisfy the Non-Exemption Condition; his objection relies on the false Clean Hands view that only the perfect may speak.
