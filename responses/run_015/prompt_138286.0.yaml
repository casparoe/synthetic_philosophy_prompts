answer: |-
  1. You contend that Williams's operatic writings are the workshop for his moral philosophy rather than a divertissement, but why must the testing ground be opera specifically, rather than the novel or the theatre, to expose the limits of agency and convention?
  **Likely answer:** She will argue that opera's unique combination of music and text forces a confrontation between psychological realism and formal artifice that prose drama does not.
  **Follow-up:** If the music itself drives this confrontation, does the philosophical insight reside in the libretto's structure or in the sonic experience of the score?

  2. Your first claim likens hearing an operatic convention, such as an exit aria where a character leaves while singing rather than walking, to acquiring a 'thick ethical concept' where description and evaluation are inseparable.
  **Likely answer:** She will affirm that in both cases, one cannot describe the phenomenon without already evaluating its significance within a form of life.
  **Follow-up:** But if the evaluation is inseparable from the description, how does one critically evaluate the convention itself without stepping outside the very form of life that gives it meaning?

  3. Thick concepts are, for Williams, answerable to how things are in the world, whereas a convention looks answerable only to a practice; if the tradition changes so that what once counted as a tragic cadence no longer does, what plays the role of the world in your analogy?
  **Likely answer:** She is likely to say that the tradition itself is the object the response tracks, functioning as a historical reality rather than a natural fact.
  **Follow-up:** If the tradition is the object, does that not imply that when a tradition dies, the ethical truths it sustained do not merely become obsolete but cease to have been true at all?

  4. Consider composers whose idiom is built against inherited conventions, such as Janáček's speech-derived melodic lines or Debussy's refusal of the set-piece aria.
  **Likely answer:** She will likely suggest that such works are initially unintelligible until their new conventions sediment into a recognizable practice.
  **Follow-up:** Are you willing to accept the prediction that, during that period of sedimentation, the work possesses no ethical-aesthetic meaning for its contemporaries, rendering the composer's innovation morally silent until later?

  5. Williams treats the reconciliations with which Mozart's comedies close, the *lieto fine* or happy ending, as the aesthetic analogue of an 'external reason', a resolution imposed from outside the agents' motivational sets.
  **Likely answer:** She will maintain that this suspicion is not merely aesthetic but reflects a deep philosophical critique of resolutions that bypass the agent's internal motives.
  **Follow-up:** If that is so, is the suspicion you find in his treatment of the *lieto fine* really a moral-philosophical judgement smuggled into aesthetics, rather than a neutral observation of operatic form?

  6. If a formal resolution imposed from outside is suspect, does that generalise to every supplied ending, including the sense of an ending that tragedy provides?
  **Likely answer:** She will probably argue that tragedy differs because its closure emerges from the internal logic of character, unlike the mechanical reconciliation of comedy.
  **Follow-up:** But if the poet still constructs that closure from outside the characters' existence, on what basis can you distinguish a tragic necessity from a comic imposition without begging the question?

  7. This connects to the retrospective intelligibility a life can have in Williams's discussions of moral luck and of the painter Gauguin who abandons his family for his art.
  **Likely answer:** She will likely concede that the intelligibility of a life is, like the opera, supplied by a narrative structure outside the agent's immediate control.
  **Follow-up:** Does your reading therefore commit you to the claim that the intelligibility of a life is likewise supplied by something outside the agent, undermining the very autonomy Williams sought to protect?

  8. In his late book *Truth and Truthfulness*, Williams defends accuracy and sincerity as virtues, yet a form in which every expression is mediated by convention looks like a machine for producing artifice.
  **Likely answer:** She will argue that the genealogy has room for this because operatic sincerity is a distinct virtue, separate from literal truth-telling.
  **Follow-up:** If operatic sincerity is distinct, is the pleasure Williams takes in it a counterexample to his own genealogy, or does he simply maintain two incompatible standards of truth for art and life?

  9. Williams sat on the board of English National Opera, yet if uptake of convention is a trained practical competence rather than information, what follows for the democratic remit of a company like that?
  **Likely answer:** She will likely assert that education is needed to cultivate the requisite competence in the audience.
  **Follow-up:** Can you say anything more specific than that education is needed, or does this admit that public funding for such art is inherently paternalistic, teaching the public how to feel rather than serving their existing capacities?

  10. To close, what specific textual evidence or philosophical argument would count against the thick-concept claim, so that you cannot leave the interview having made it unfalsifiable?
  **Likely answer:** She will likely state that finding a convention which carries descriptive weight without any evaluative force would disprove the analogy.
  **Follow-up:** Given that conventions are by definition normative, is there any possible example of such a convention, or have you defined the claim in a way that makes it immune to refutation?
