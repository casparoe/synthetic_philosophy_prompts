  The Scenario
  Elias attends career counselling with Dr. Aris, having consented to psychological profiling. The profile reveals Elias's specific vulnerability: an intense need for 'legacy-related recognition', driving him to honour his father's unfulfilled public service narrative. Aris identifies two viable paths: a high-paying corporate role and a modestly paid NGO position. While disclosing all factual data regarding salary and progression, Aris deliberately frames the NGO role exclusively through legacy-language, describing it as 'fulfilling the family covenant', whilst presenting the corporate option as 'neutral'. Elias deliberates carefully, understanding the financial trade-off, yet chooses the NGO role to satisfy his narrative desire. Aris successfully steered Elias toward the predetermined outcome by leveraging his psychological profile without deception or coercion. Elias retains full reflective capacity throughout, moved by the emotional resonance of the legacy argument. The interaction remains within ordinary institutional bounds, relying solely on strategic linguistic framing based on lawful data access.

  Reasoning for the Bypass View
  According to the rational-capacity bypass account, manipulation requires undermining the target's ability to reason reflectively. In this scenario, Elias's deliberative faculties remain fully intact and engaged. He receives all factual information regarding salary and career progression without deception. There is no coercion preventing him from choosing the corporate role, nor are there subliminal cues bypassing his conscious awareness. Elias weighs the financial loss against the psychological gain of honouring his father. Because his reasoning process was not subverted, disabled, or circumvented, the influence counts as legitimate persuasion. The advisor merely appealed to Elias's existing values rather than overriding his autonomy. Intent to steer is irrelevant if the mechanism respects rational agency. Since Elias reached an autonomous decision through careful reflection, the interaction preserves his status as a rational agent. Consequently, the absence of cognitive bypassing renders the influence ethically permissible persuasion rather than unethical manipulation, regardless of the advisor's strategic framing.

  Reasoning for the Exploitation View
  The motivational-exploitation account defines manipulation as intentionally targeting non-rational psychological vulnerabilities to steer behaviour. Here, Aris intentionally exploits Elias's niche need for legacy-related recognition, a vulnerability rooted in emotional narrative rather than pure reason. Although Elias deliberates, the influence operates by leveraging a specific motivational weakness to ensure a predetermined outcome. This constitutes manipulation because the influence source is the vulnerability itself, not merely the strength of the argument. Rational capacities operating perfectly does not negate the exploitative nature of targeting deep-seated psychological needs for external ends. Aris treats Elias's psyche as a mechanism to be tuned rather than a person to be convinced. Therefore, even without deception or bypassing, the intentional exploitation of a specific vulnerability to control the outcome classifies this interaction as manipulation, violating the ethical boundary of respectful persuasion. The advisor's specific intent to leverage the profile data confirms the exploitative nature of the influence.

  The Divergence Feature and Collapse Conditions
  The precise structural element forcing the split is the coexistence of intact reflective deliberation and intentional vulnerability targeting. The bypass view focuses on the former, while the exploitation view focuses on the latter. If we remove the intact deliberation condition, suppose Elias was fatigued or cognitively impaired during the session. The bypass view would then classify the influence as manipulation because rational capacities were compromised. The exploitation view would maintain its verdict, resulting in agreement that this is manipulation. Conversely, if we remove the intentional vulnerability targeting, suppose Aris framed both options neutrally without referencing the legacy profile. The exploitation view would then classify the influence as persuasion, as no vulnerability was exploited. The bypass view would maintain its verdict, resulting in agreement that this is persuasion. Thus, the case collapses into agreement on either verdict depending on which divergent feature is removed. The conflict exists solely because the scenario isolates rational capacity from motivational targeting, allowing the accounts to prioritise different ethical criteria.

  Defences and Attacks
  A proponent of the manipulation verdict might attack the fairness of the scenario, arguing it privileges rational capacity too heavily. They could claim that by emphasising Elias's careful deliberation, the scenario rigs intuitions against finding manipulation, obscuring the ethical violation of targeting vulnerabilities. They argue it is unfair to define manipulation solely by cognitive bypassing when motivational exploitation causes similar harm. The scenario makes the manipulation appear benign, biasing the observer towards the persuasion verdict. The opposing bypass proponent replies that autonomy is the primary ethical metric, not subjective harm. Ignoring rational capacity to focus on motivation undermines the concept of agency itself. They argue the scenario is fair because it isolates the specific theoretical disagreement regarding what constitutes interference. If the scenario included negative outcomes, it would conflate manipulation with harm. Therefore, the focus on deliberative integrity is necessary to test the conceptual boundary accurately, rather than relying on intuitive responses to potential consequences.
