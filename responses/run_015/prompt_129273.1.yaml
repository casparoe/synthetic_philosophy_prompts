  ### Supervisor's Preface: Framing Selection

  Before drafting the proposal, I considered three ways to frame this.

  1.  **The Technical Framing:** "Quantifying Bias in Proxy-Stratification." I discarded this. It invites the committee to say, "This is a statistics problem; go to the Stats department." It focuses on derivation rather than justification.
  2.  **The Metaphysical Framing:** "The Ontology of Confounders and Proxies." I discarded this. It's too abstract for a 12-week project and risks ignoring the practical decision-making context that makes Simpson's Paradox urgent.
  3.  **The Normative Framing (Selected):** "The Justification of Action under Measurement Uncertainty." This frames the issue not as a calculation error, but as a gap in the *advice* given to scientists. It positions the project as methodology: bridging ideal causal norms and non-ideal epistemic conditions. This is what earns its place in a philosophy department.

  Below is the proposal I would submit on your behalf, written in your voice but structured to survive the committee's scrutiny.

  ***

  # Research Proposal: The Normativity of Stratification — Causal Advice under Measurement Uncertainty

  **Project Duration:** 12 Weeks
  **Deliverable:** 6,000-word Research Paper
  **Supervisor:** [Name]

  ### 1. Research Question
  Standard causal inference advice dissolves Simpson's Paradox by instructing agents to condition on confounders rather than aggregating data. However, in biomedical and social science practice, researchers rarely observe the true confounder; they observe a proxy (e.g., disease stage instead of physiological severity, department instead of funding bias). Stratifying on a noisy proxy is mathematically distinct from stratifying on the true confounder.

  This project asks: **Under what epistemic conditions does stratifying on a proxy variable yield a more actionable causal estimate than aggregating, when the true confounder is unobserved and the measurement error structure is unknown?**

  The goal is not to derive a correction formula, but to establish a decision criterion: when is the standard advice ("condition on the confounder") safe to follow using proxies, and when does it become epistemically safer to ignore the stratification entirely?

  ### 2. Background and Problem Statement
  Simpson's Paradox arises when a trend present in several groups of data disappears or reverses when the groups are combined. The dominant dissolution in contemporary causal inference is structural: the reversal is an artifact of conditioning on a collider or failing to condition on a confounder. The prescriptive advice is determinate: identify the causal graph, locate the valid adjustment set, and condition on those variables.

  This advice assumes access to the variables as they appear in the causal graph. In practice, the variables available for adjustment are recorded measurements, which serve as proxies for the theoretical constructs in the graph. Consider the classic kidney stone treatment case: the reversal disappears when stratifying by stone size. But "stone size" in the dataset is a recorded category, not the continuous physical reality that causally interacts with treatment efficacy. Similarly, in graduate admissions, "department" is used as a proxy for "selectivity" or "funding availability."

  When one stratifies on a proxy, one creates a "noisy partition" of the data. Depending on the fidelity of the proxy, the stratified estimate may retain bias, or introduce new bias, such that the aggregate estimate becomes preferable despite the causal structure. The existing literature leaves a gap here:
  *   **Causal Inference Literature:** Typically assumes variables in the analysis match nodes in the graph. When measurement error is acknowledged, it is often treated as a technical nuisance to be corrected if the error model is known.
  *   **Measurement Error Literature:** Focuses on correcting estimates given specific assumptions about error distributions (e.g., classical vs. Berkson error). It rarely addresses the *decision problem* of whether to use the corrected stratified estimate or the uncorrected aggregate estimate when the error structure is itself uncertain.

  Consequently, a researcher facing a Simpson's reversal with proxy variables receives conflicting implicit advice: follow the causal structure (stratify) or respect the measurement limitation (aggregate?). There is no established normative framework for choosing between these numbers under uncertainty.

  ### 3. Methodology and Work Plan
  This project will proceed in three phases over twelve weeks.

  **Phase 1: Conceptual Mapping (Weeks 1-4)**
  I will formalize the "noisy-partition problem" by distinguishing between the *causal confounder* (theoretical node) and the *adjustment proxy* (recorded variable). I will analyze existing dissolutions of Simpson's Paradox to demonstrate where they implicitly assume perfect measurement. This will involve reconstructing standard examples (e.g., treatment efficacy by disease stage) to show how the reversal persists or shifts when the staging mechanism is imperfect.
  *   *Deliverable:* An annotated diagram mapping the gap between causal advice and measurement reality.

  **Phase 2: Formal Toy Model (Weeks 5-8)**
  I will construct a simplified formal model representing the relationship between the true confounder, the proxy, the treatment, and the outcome. Unlike a full simulation study, this model will not seek to map all possible parameter spaces. Instead, it will isolate the specific threshold where the bias introduced by proxy stratification exceeds the bias of aggregation. The goal is to derive a qualitative condition (e.g., "Stratification is preferred only if the proxy's sensitivity exceeds X relative to the strength of the confounding").
  *   *Deliverable:* A set of inequalities defining the "safe zone" for proxy stratification.

  **Phase 3: Normative Synthesis (Weeks 9-12)**
  I will interpret the formal results philosophically. The focus will be on the *warrant for action*. If the safe zone is narrow or requires knowledge unavailable to the researcher, the standard causal advice is practically inert. I will argue for a decision-theoretic approach where the choice of estimate is treated as a decision under uncertainty, rather than a deduction from causal structure.
  *   *Deliverable:* Final 6,000-word paper.

  ### 4. Justification of Approach
  Three alternative approaches were considered and rejected for this specific scope:

  1.  **Formal Sensitivity Analysis:** A full sensitivity analysis would require specifying parametric families for the measurement error. This exceeds the scope of a 12-week philosophy project and duplicates existing statistical work. My goal is not to calculate the bias, but to determine when the *strategy* of calculation is justified.
  2.  **Purely Conceptual Analysis:** A paper discussing only the concept of "proxy" without formal modeling risks being dismissed as vague. The toy model is necessary to prove that the problem is not merely verbal but has mathematical consequences for decision-making.
  3.  **Comprehensive Simulation Study:** Mapping out when proxy adjustment beats aggregating via simulation is a statistics project. It produces descriptive data ("in 60% of cases, stratification wins"). My project aims for a normative conclusion ("you should only stratify if..."). The toy model serves the argument; it does not constitute the entire output.

  ### 5. Success and Failure Conditions
  **Success:** The project succeeds if it produces a clear criterion (even a negative one) that distinguishes when proxy stratification is epistemically superior to aggregation. A successful result might show that without independent validation of the proxy's fidelity, the standard advice to "condition on the confounder" is unjustified. This would establish the "noisy-partition problem" as a genuine methodological gap.

  **Failure:** The project fails if it turns out that the decision criterion depends entirely on parameters that are never identifiable from data (e.g., requiring knowledge of the true confounder's variance). If the result is simply "you can never know," the project must pivot to explaining why this impossibility matters for scientific practice, rather than pretending to offer a solution.

  ### 6. Scope Assessment
  This is a tight scope for twelve weeks. It is effectively one project, not two. However, there is a risk of scope creep in Phase 2. If the formal model becomes too complex, I will cut the derivation of specific thresholds and focus solely on the existence of the threshold. I will not attempt to compare different types of measurement error (e.g., differential vs. non-differential) unless the basic model proves too simple to generate the paradox. The focus remains on the binary decision: Stratify vs. Aggregate.

  ### 7. Statement for the Committee: Why This is Philosophy
  This project may appear to be a technical inquiry into statistical adjustment, but its core contribution is philosophical. Statistics provides the machinery for calculating estimates given assumptions; philosophy evaluates the warrant for those assumptions when guiding action.

  The standard dissolution of Simpson's Paradox is a conditional norm: *If* you know the causal structure, *then* condition on the confounder. This project interrogates the antecedent. In real scientific practice, researchers do not know the causal structure perfectly; they infer it from the very data that is subject to measurement error. When the variable used to satisfy the causal condition is a noisy proxy, the normative force of the advice breaks down.

  This is not a problem of calculation, but of *justification*. It asks what scientists are committed to when they choose one number over another to inform policy or treatment. It bridges the gap between ideal causal norms and non-ideal epistemic situations, which is a central concern of the methodology of science. The deliverable is not a new estimator, but a clarified framework for understanding when causal advice is actionable.

  ***

  ### Supervisor's Note to You (Private)

  Okay, put the proposal away. Here is the honest assessment you asked for.

  **Where the framing is most likely to be wrong:**
  You are banking on the idea that statisticians don't already have a decision rule for this. Your friend in biostatistics who said "this is just measurement error" might be right in a way that hurts your project. There is a substantial literature on "errors-in-variables" and "misclassification bias" that already derives conditions under which adjustment increases or decreases mean squared error. If there is already a known theorem that says "Adjust only if reliability coefficient > correlation of confounder with outcome," your "noisy-partition problem" is not a gap in the literature, it's just a re-description of existing statistical theory.

  **The objection I would least like to hear from a statistician:**
  "You are treating the choice between the aggregate and stratified estimate as a binary philosophical dilemma, but in practice, we use hierarchical models or Bayesian priors to partial out the measurement error. We don't choose between the two biased estimates; we model the latent variable."
  If this is the standard practice in the fields you are citing (biomed/social science), then your problem is a straw man. You need to verify that researchers are actually facing this binary choice and not just running mixed-effects models that handle the proxy issue implicitly.

  **What would convince me the whole thing is misconceived:**
  If you find that the "tipping point" for when aggregation beats stratification is so extreme (e.g., the proxy must be nearly perfect) that it never happens in real data, or conversely, if it turns out that *any* correlation with the true confounder makes stratification superior regardless of noise. If the math shows the decision is trivial one way or the other, there is no philosophical tension left to resolve.

  **How to protect yourself:**
  Before you commit fully to Phase 2, spend the first week doing a targeted search for "bias amplification due to conditioning on mismeasured confounders." If you find a paper that explicitly derives the decision rule you plan to derive, pivot immediately. Don't derive it again; instead, analyze *why* that result is ignored in standard causal teaching. That becomes a project about the dissemination of methodological knowledge rather than the math itself. That is safely philosophical.

  You have a good instinct about the gap between ideal graphs and messy data. Just make sure the gap isn't already filled by a tool you haven't seen yet.
