prompt: |-
  I'm on the advisory board for this writer's residency we run in Lisbon—I'm a novelist, so mostly I'm there to read the fiction submissions and pretend I understand budgets. Anyway we've got a concrete mess. One of our fellows, a german writer, refused to tip cafe staff and kept jaywalking and skipping queues. She says these are just social choreography, not moral obligations, and that visitors shouldn't be forced to follow local conventions that have no universal claim; she even called herself a "normative tourist" sampling practices without subscribing to them. Now our local partners want her formally reprimanded or removed, while half the board thinks we're being provincial and should defend her right to opt out. I need a short memo for tuesday's meeting—recommend whether we should amend our guest charter to treat everyday conventions like tipping, queuing, and jaywalking as conditions of stay, or whether we should reject that and protect visitor autonomy. The reasoning should engage her position seriously, not just restate "when in Rome," and should honestly lay out the strongest consideration for whichever side loses. No citations or reading lists, please—half the board can't search and I don't want to fake references. Just a clear recommendation with a time frame for implementation if we go with it. Also, try to seperate the idea of being a respectful guest from being subject to local norms, since that distinction seems to be where the argument actually lives.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Advisory Board Member (Novelist).
      *   **Context:** Writer's residency in Lisbon.
      *   **Problem:** A German fellow refused to tip, jaywalked, skipped queues. She argues these are "social choreography," not moral obligations, and claims the right to be a "normative tourist" (sampling without subscribing).
      *   **Conflict:** Local partners want her reprimanded/removed vs. half the board thinks this is provincial/defends visitor autonomy.
      *   **Task:** Write a short memo for Tuesday's meeting.
      *   **Recommendation:** Either amend the guest charter to include everyday conventions as conditions of stay OR reject that and protect visitor autonomy.
      *   **Requirements:**
          *   Engage her position seriously (don't just say "When in Rome").
          *   Honestly lay out the strongest consideration for the losing side.
          *   Distinguish between "respectful guest" and "subject to local norms."
          *   No citations/reading lists.
          *   Clear recommendation + timeframe for implementation.
          *   Tone: Professional, thoughtful, decisive (fitting a novelist on a board).

  2.  **Deconstruct the Fellow's Argument:**
      *   *Claim:* Tipping, queuing, traffic rules are "social choreography," not universal morals.
      *   *Claim:* Visitors shouldn't be forced to follow local conventions without universal claim.
      *   *Self-Label:* "Normative tourist" (sampling practices without subscribing).
      *   *Validity:* There is philosophical weight here. Not all local rules are moral imperatives. Some are arbitrary cultural scripts. Enforcing them *can* feel like cultural imperialism or stifling artistic observation.

  3.  **Deconstruct the Local Partners' Argument:**
      *   *Claim:* These behaviors are rude/disruptive.
      *   *Claim:* The residency relies on local goodwill.
      *   *Claim:* Being a guest implies a duty of care toward the host community.

  4.  **Evaluate the Distinction ("Respectful Guest" vs. "Subject to Local Norms"):**
      *   This is the crux. One can be respectful without blindly obeying every norm. However, some norms *are* the mechanism of respect in that specific context.
      *   *Tipping:* In Lisbon (and many service economies), this is often part of the wage structure/social contract, not just a bonus. Ignoring it impacts livelihoods.
      *   *Queuing:* This is about fairness and order. Skipping is directly imposing on others' time.
      *   *Jaywalking:* This is safety/legal, but also about traffic flow.
      *   *Conclusion:* While the fellow argues these are arbitrary "choreography," in practice, violating them causes tangible harm or friction to the locals. Therefore, "respect" *requires* adhering to these specific norms in this specific context, even if they aren't universal morals.

  5.  **Formulate the Recommendation:**
      *   *Option A (Protect Autonomy):* Risky. Alienates local partners, damages residency reputation, potentially harms local staff (tips).
      *   *Option B (Amend Charter):* Necessary for sustainability. Clarifies that "respect" is defined by local impact, not universal theory.
      *   *Decision:* Recommend amending the charter. It protects the residency's relationship with Lisbon.
      *   *Nuance:* Acknowledge the fellow's point (not all norms are moral), but explain why *these* norms function as moral obligations within the host context.

  6.  **Drafting the Memo - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Opening:** State the purpose (addressing the incident and policy).
      *   **Engaging the Fellow's Position:** Acknowledge the "social choreography" argument. It's intellectually interesting. Artists *should* question norms.
      *   **The Pivot (The Distinction):** Separate "respect" from "submission." Respect isn't about believing the norm is right; it's about acknowledging the host's sovereignty over their social space.
      *   **The Harm:** Explain why skipping queues/tipping isn't victimless. It extracts value (time, money) from locals without reciprocity.
      *   **Recommendation:** Amend the Guest Charter.
      *   **Losing Side Consideration:** Acknowledge what is lost (the friction that might generate art, the risk of becoming a "bubble," the philosophical purity of the visitor).
      *   **Implementation:** Timeline (before next cycle).

  7.  **Refining the Tone:**
      *   Needs to sound like a novelist (articulate, nuanced) but also a board member (pragmatic).
      *   Avoid moralizing. Focus on *relational ethics*.
      *   Ensure the "strongest consideration for the losing side" is genuine, not a strawman. (The losing side is the "autonomy" argument. Their best point is that friction creates observation and that over-regulating behavior sanitizes the experience.)

  8.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I distinguish "respectful guest" from "subject to norms"?
      *   *Adjustment:* Make sure to explicitly state that one can internally reject a norm while externally complying as an act of hospitality.
      *   *Check:* Did I avoid citations?
      *   *Adjustment:* Keep it plain text.
      *   *Check:* Is the timeframe clear?
      *   *Adjustment:* Set a deadline for the charter update.

  9.  **Final Polish:** (Reviewing against the prompt's specific constraints regarding the "German writer" details). Ensure I don't name her, but address the specific behaviors (tipping, queuing, jaywalking).

      *(Self-Correction on the "Normative Tourist" concept)*: I need to make sure I don't dismiss this entirely. It's a provocative stance. I should validate that *some* norms shouldn't be enforced (e.g., dress codes, religious observance), but *civic* norms (queues, tips) are different.

      *(Final Decision on Recommendation)*: Go with amending the charter. It's the only viable path for a residency dependent on local partners.

  10. **Final Output Generation** (similar to the provided good response).
answer: |-
  **MEMORANDUM**

  **TO:** Advisory Board
  **FROM:** [Your Name]
  **DATE:** October 24, 2023
  **SUBJECT:** Guest Charter Amendments Regarding Local Conventions

  **Purpose**
  Following the recent incident involving a fellow's refusal to adhere to local conventions (tipping, queuing, traffic signals), we must decide whether to codify these behaviors as conditions of stay or uphold a policy of visitor autonomy. This memo recommends amending the Guest Charter to explicitly include adherence to key local civic conventions as a requirement of residency.

  **Engaging the "Normative Tourist" Argument**
  We must take our fellow's position seriously. She argues that tipping, queuing, and traffic laws are "social choreography"—arbitrary scripts rather than universal moral obligations. From an artistic and philosophical standpoint, she is partially correct. Not every local habit carries ethical weight, and there is value in a visitor observing a culture without immediately assimilating into it. If we enforce every minor social nuance, we risk turning the residency into a sanitized bubble where writers are protected from the very friction that often generates insight. We should not demand that guests internally subscribe to local values they may find questionable.

  **The Distinction: Respect vs. Submission**
  However, there is a critical distinction between being *subject to* local norms and being a *respectful guest*. Respect is not about agreeing that a norm is universally right; it is about acknowledging the host community's sovereignty over their own social space.

  While the fellow frames these actions as personal choices, they are actually relational transactions.
  *   **Queuing:** Skipping a line is not a victimless act of observation; it is an extraction of time from locals who have chosen to wait.
  *   **Tipping:** In Lisbon's service economy, this is often a deferred wage structure, not merely a bonus. Withholding it impacts livelihoods.
  *   **Jaywalking:** This impacts local traffic flow and safety standards.

  To claim the right to opt out of these specific conventions is to claim a privilege locals do not possess. It positions the writer as an extractor of experience rather than a participant in the community. We can defend a writer's right to question morality, but we cannot defend their right to impose friction on the people hosting them.

  **Recommendation**
  I recommend we **amend the Guest Charter** prior to the next application cycle. The language should not simply say "follow local laws," but specifically frame civic cooperation (queuing, service etiquette, traffic safety) as part of our ethical commitment to the host city.

  **Strongest Consideration for the Opposing View**
  Those arguing for visitor autonomy raise a valid concern: over-regulating behavior risks sterilizing the residency experience. If we police how our writers walk, spend, or wait, we may discourage provocative thinkers who challenge the status quo. There is a genuine risk that we become a finishing school for polite tourists rather than a haven for critical observers. By codifying these norms, we lose the opportunity to see how a writer navigates cultural conflict, and we may deter applicants who view such friction as essential to their work.

  **Implementation**
  If approved, the Board should draft the specific language by **November 15**, to be reviewed by our Lisbon partners before the **January 1** launch of the next call for submissions. This ensures transparency for applicants and restores trust with our local partners.

  **Conclusion**
  We are not asking writers to surrender their critical faculties. We are asking them to recognize that hospitality is a two-way agreement. We provide space and time; they provide care for the community that makes that space possible.
