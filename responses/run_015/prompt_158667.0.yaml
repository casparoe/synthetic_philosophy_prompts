prompt: |-
  hey — I'm stuck on a paper about aggregation in Scanlon-style contractualism and I want to stop and write down what I'd even count as a solution before going back to the literature and getting sucked in again.

  So: what does a contractualist way of handling aggregation actually have to do to count as adequate? I mean a principled story about cases where a big cost to one person has to be set against small benefits to many (or the other way round), inside the contractualist framing where the test is whether some individual could reasonably reject the principle — not whether total welfare goes up. Fix the purpose as this: it has to be a principle you could hand to an institution (a triage committee, a transport authority, an ethics review board) and have them actually decide a case, with the justification framed in terms no individual could reasonably reject. Not just "an interesting position in a debate."

  Give me the full spec. For each requirement, the case or consideration behind it, and whether it is genuinely non-negotiable for the view or just something one camp wants. I especially want to know which demands follow from contractualism itself and which are smuggled in from elsewhere: from consequentialism, from a prior commitment to the ordering being complete and transitive, from wanting the principle to be usable by actual committees under time pressure, and so on.

  Cases I want any candidate to handle, and ones I keep coming back to:

  - the plain one: one person loses a limb, ten thousand people avoid something trivial. Give your cleanest version.
  - dilution: same total benefit, spread over more and more people, so each person's share shrinks toward nothing. At what point should aggregating stop working, if ever? And is the thing being added up a sum of benefit sizes or a count of people who have a complaint? Those come apart and I think the spec has to say which one it is using.
  - the shrapnel case: one person loses something enormous. Can her loss be broken up into many smaller losses and set against many small benefits to many people? If the answer is no, why not — and does that depend on how fine-grained we make "a complaint"? If the answer is yes, hasnt aggregation just come back in through the back door?
  - the same-person-over-time version: the many small benefits and the one big cost all land on the same person at different times (lots of small pleasures now, one serious injury later). Is that structurally a different case from the many-person case, or the same one? I dont trust my intuition here.
  - the reverse direction: one person gets a large benefit, many people each lose a little.
  - mixed-motive / role-rotation: the people who benefit are also the ones imposing the risk, and anyone might end up on either side. Does that change what the principle needs to do?
  - the conditional-existence one: the many are people who will only exist if the principle permits aggregating.

  Then the part I care most about: flag any subset of the requirements you suspect cannot be jointly satisfied, and say which single requirement does the most work in ruling out candidates and which requirement is really a prejudice of one camp dressed up as neutral.

  Whatever you take Scanlon's own move to be — the bit where you compare how individuals fare across candidate principles rather than summing — I want a spec that an answer has to meet regardless of whether that move survives.

  Short scorecard at the very end is fine, but keep the weight on the criteria: (a) straight aggregation done inside contractualism, (b) the individualist style restriction where you compare the loser against each winner one at a time, (c) threshold or tie-breaker views where aggregation only gets to decide among principles that already survived individual objections, (d) ex ante or randomizing versions that aggregate expected complaints, (e) anything else that deserves a row. Dont bother with citations or a reading list, I cant look anything up rn — I know the names, I want the shape of the problem.
reasoning: |-
  Here's a thinking process that leads to the suggested specification:

  1.  **Analyze the Request:**
      *   **Topic:** Aggregation in Scanlon-style contractualism.
      *   **Goal:** Define what counts as an *adequate solution* (a "spec") before diving back into the literature.
      *   **Constraint:** Must be actionable for an institution (triage committee, etc.), not just theoretical. Justification must be in terms no individual could reasonably reject.
      *   **Key Task:** Distinguish requirements internal to contractualism vs. external smuggled-in assumptions (consequentialism, completeness, usability, etc.).
      *   **Specific Cases to Handle:** Plain case (limb vs. trivial), Dilution (many tiny benefits), Shrapnel (breaking up big loss), Same-person-over-time, Reverse direction (one big benefit vs. many small losses), Mixed-motive/Role-rotation, Conditional-existence.
      *   **Critical Analysis:** Flag incompatible requirements, identify the most constraining requirement, identify the "prejudice dressed as neutral."
      *   **Ending:** A scorecard of approaches (a, b, c, d, e).
      *   **Format:** No citations/reading list. Focus on the *shape* of the problem.

  2.  **Deconstruct "Contractualist Adequacy":**
      *   What is the core of Scanlonian contractualism? It's about *justification to individuals*. A principle is wrong if it could be *reasonably rejected* by someone.
      *   The "Aggregation Problem" arises because utilitarianism sums welfare, but contractualism looks at individual complaints. If one person loses a leg, and 10,000 people avoid a headache, utilitarianism says "save the 10,000." Contractualism traditionally says "the leg-losser has a stronger complaint than any single headache-avoider, so save the leg."
      *   *The Tension:* If we never aggregate, we seem to ignore the moral significance of numbers (the "Numbers Problem"). If we do aggregate, we seem to violate the "Individualist Restriction" (comparing one person's loss to the *sum* of others' gains).
      *   *The Spec:* Needs to bridge this gap while remaining actionable.

  3.  **Drafting the Requirements (The "Spec"):**
      *   I need to list criteria that a solution *must* meet to be considered a successful contractualist account of aggregation.
      *   *Requirement 1: The Individualist Restriction (Internal).* You can't just sum welfare. You must compare complaints person-to-person or principle-to-principle based on individual burdens.
      *   *Requirement 2: Sensitivity to Numbers (Internal/External).* It can't be that 1 life vs. 1 headache is the same as 1 life vs. 1 million headaches. There must be a tipping point.
      *   *Requirement 3: Actionability/Decidability (External).* The committee needs a rule, not a paradox.
      *   *Requirement 4: Non-Arbitrariness (Internal).* The threshold can't be random.
      *   *Requirement 5: Symmetry/Consistency (Internal).* Similar cases treated similarly (transitivity).

      *Refining the distinction between Internal (Contractualist) and External (Smuggled):*
      *   *Internal:* Justifiability to each person, the "reasonable rejection" standard, the priority of the worst-off (usually).
      *   *External:* Completeness of ordering (maybe not required by morality, but by institutions), time-pressure usability, transitivity (logic requires it, but morality might be vague).

  4.  **Addressing the Specific Cases:**
      *   *Plain Case:* Limb vs. Trivial. Solution must say "Limb wins" up to a point.
      *   *Dilution:* When does the sum of trivialities outweigh the limb? The spec needs a metric (strength of complaint vs. count).
      *   *Shrapnel:* Can a big loss be fragmented? Contractualism usually says no (complaints are holistic), but this needs explicit handling.
      *   *Same-Person:* Prudence vs. Morality. Contractualism is interpersonal, but the structure might mirror intrapersonal.
      *   *Reverse:* One big gain vs. many small losses. (e.g., Rich man gets yacht, everyone else loses $1).
      *   *Conditional Existence:* Non-identity problem. Contractualism struggles here (can non-existent people reject?).

  5.  **Identifying the Tensions (The "Impossible Trinity"):**
      *   There is a known tension in this literature (often discussed by Scanlon, Kumar, Otsuka, etc.).
      *   *Tension:* (1) Strict Individualism (no summing), (2) Sensitivity to Numbers (save the many), (3) Consistency/Transitivity.
      *   Usually, you have to give up one.
      *   *The "Prejudice":* The demand for *completeness* and *transitivity* in all cases is often a demand from decision theory/institutions, not necessarily from morality itself. Morality might be vague. But the prompt asks for an *institutional* principle, so decidability is key.
      *   *The Real Killer:* The "Individualist Restriction" combined with "Sensitivity to Numbers." If I can't compare my loss to your *sum*, only to your *individual* loss, how do numbers ever matter? This is the core theoretical bottleneck.

  6.  **Developing the Scorecard:**
      *   (a) Straight Aggregation: Violates contractualism.
      *   (b) Individualist Restriction (Scanlon's early view): Fails numbers sensitivity.
      *   (c) Threshold/Tie-Breaker (Scanlon's later view / Kumar): Aggregation only breaks ties between comparable complaints.
      *   (d) Ex Ante / Risk: Focus on expected value before the fact.
      *   (e) Complaint Strength Scaling: The strength of a complaint scales with the number of people having it (controversial).

  7.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the task (defining the spec for an institutional tool).
      *   **Part 1: The Specification (Requirements).** Break down into "Non-Negotiable (Internal)" and "Operational (External/Smuggled)."
      *   **Part 2: Case Stress-Test.** Walk through the user's list (Plain, Dilution, Shrapnel, etc.) and show what the spec demands of them.
      *   **Part 3: The Incompatibility Matrix.** Identify the impossible trinity. Pinpoint the "Prejudice."
      *   **Part 4: The Scorecard.** Evaluate the approaches (a-e) against the spec.

  8.  **Refining the Content (Self-Correction during drafting):**
      *   *Correction:* Make sure I don't just summarize Scanlon. The user wants a *spec for a solution*, not a summary of the literature. What *must* a solution do to satisfy the user's constraints?
      *   *Emphasis:* The user wants to know what is "smuggled in." I need to be sharp on the difference between "morally required" and "administratively convenient."
      *   *Shrapnel Case:* This is crucial. If I allow fragmentation of complaints, I allow aggregation. If I don't, I might fail the "Numbers" test. The spec must take a stand.
      *   *Conditional Existence:* This is a hard edge for contractualism. The spec should flag this as a potential "failure mode" rather than pretending it's easily solved.
      *   *Institutional Focus:* The principle must be *usable*. This implies a need for a decision procedure, which pushes towards completeness/transitivity even if morality doesn't strictly require it.

  9.  **Final Polish:** Check tone. Needs to be analytical, rigorous, slightly philosophical but grounded in the "institutional" constraint. Avoid academic fluff. Ensure the "Prejudice" identification is bold. (The prejudice is usually the demand for a *single* ordering that satisfies transitivity in all cases, or the demand that "reasonable rejection" must yield a unique answer in every case). Actually, the stronger candidate for "prejudice" is the demand that *numbers must matter* in a way that mimics utilitarianism, which might just be a consequentialist intuition forced into a deontological framework. I'll argue the "Completeness/Decidability" requirement is the administrative smuggle, while "Individualism" is the core contractualist constraint.

      *Wait, re-reading the prompt:* "which requirement is really a prejudice of one camp dressed up as neutral."
      *Candidate:* The demand that the theory must yield a determinate answer in *every* case (Completeness). Contractualism might allow for "moral indeterminacy," but institutions hate that.
      *Candidate:* The demand that "Numbers Must Count." Some contractualists argue they shouldn't. But the prompt implies we want to solve the aggregation problem, implying numbers *should* count.
      *Decision:* I will identify the demand for **Transitivity/Completeness in borderline cases** as the administrative smuggle, and the demand for **Sensitivity to Numbers** as the consequentialist smuggle (often treated as neutral intuition). The core contractualist non-negotiable is the **Individualist Restriction**.

      *Let's refine the "Prejudice":* It's often the assumption that the *strength* of a complaint is independent of the *number* of people. Or conversely, that the *number* of people *must* be able to override a severe individual loss. I think the "Prejudice" is the expectation that the theory must provide a **cardinal metric of complaint strength** that allows for trade-offs. Contractualism is ordinal. Demanding cardinality is the smuggle.

      *Actually, looking at the "Institutional" constraint:* The user wants a principle for a committee. This *requires* decidability. So I can't call decidability a "smuggle" if it's part of the prompt's success condition.
      *Better angle:* The "Prejudice" is the assumption that **aggregation must be continuous**. (i.e., that there is a smooth curve where adding one more person eventually tips the scale). Contractualism might be categorical (thresholds). Demanding a smooth function is a utilitarian smuggle.

      *Let's go with:* The demand for **Transitivity across heterogeneous cases** is the logical/administrative smuggle. The demand for **Numbers to Override Severe Harm** is the consequentialist intuition smuggle. The **Individualist Restriction** is the hard contractualist core.

      *Okay, ready to write.*
answer: |-
  Here is the specification for an adequate contractualist account of aggregation, designed for institutional application. I have separated the requirements into those internal to the contractualist framework (non-negotiable for the view) and those external (smuggled in from decision theory, consequentialism, or administrative necessity).

  ### Part 1: The Specification (Requirements for Adequacy)

  To count as a solution, the principle must satisfy the following constraints.

  #### 1. The Individualist Restriction (Internal / Non-Negotiable)
  *   **The Requirement:** The justification for a principle must be traceable to the burden borne by *specific individuals*. You cannot justify a principle to Person A by summing the gains of Persons B through Z. You must be able to say to Person A: "Your burden is justified because, compared to the alternative, no *single* other person would be worse off than you are now."
  *   **The Case:** The Plain Case (1 Limb vs. 10,000 Headaches).
  *   **Why:** This is the definition of contractualism. If you sum the headaches to outweigh the limb, you are treating the group as a container of value rather than a collection of individuals.
  *   **Status:** **Hard Constraint.** If you violate this, you are doing consequentialism with contractualist vocabulary.

  #### 2. Sensitivity to Numbers (External / Smuggled Intuition)
  *   **The Requirement:** The principle cannot be indifferent to the number of people affected. A principle that saves one limb over one headache must not necessarily save one limb over one *million* headaches. There must be a tipping point where the sheer number of individual complaints makes rejection of the principle unreasonable for the single loser.
  *   **The Case:** Dilution (1 Limb vs. N Headaches).
  *   **Why:** This is widely regarded as a "reflective equilibrium" requirement, but it is not derived from the contractualist formula itself. It is a consequentialist intuition grafted onto the view to avoid absurdity.
  *   **Status:** **Soft Constraint (but practically necessary).** Pure contractualism could logically say "Numbers never count." But an institutional principle that ignores numbers will be rejected as irrational.

  #### 3. Decidability / Completeness (External / Administrative Smuggle)
  *   **The Requirement:** For any given case, the principle must yield a determinate verdict (Permit, Forbid, or Indifferent). It cannot return "morally vague" or "indeterminate" as an output.
  *   **The Case:** The Tipping Point in Dilution.
  *   **Why:** Institutions (triage committees) cannot act on vagueness. They need a rule.
  *   **Status:** **Administrative Smuggle.** Morality might be vague; bureaucracies cannot be. This requirement forces the theory to draw lines where moral reality might be fuzzy.

  #### 4. Complaint Holism (Internal / Non-Negotiable)
  *   **The Requirement:** A complaint is anchored to the person suffering it. You cannot fracture one person's severe loss into "units of pain" to be offset by "units of pleasure" distributed among others.
  *   **The Case:** The Shrapnel Case.
  *   **Why:** This follows from the Individualist Restriction. If you allow the limb-loss to be broken into 1,000 units of pain and offset by 1,000 people avoiding 1 unit of pain, you have reintroduced aggregation by the back door.
  *   **Status:** **Hard Constraint.**

  #### 5. Symmetry of Justification (Internal / Non-Negotiable)
  *   **The Requirement:** The structure of justification must work the same way regardless of who is up and who is down. If aggregation is permitted to save the many from small losses, it must be permissible for the many to impose small losses to save one from a large loss (unless there is a priority rule for the worst-off).
  *   **The Case:** Reverse Direction (1 Big Benefit vs. Many Small Losses).
  *   **Why:** Contractualism is about mutual justifiability. If the many can gang up on the one, the one must be able to justify ganging up on the many under identical structural conditions.
  *   **Status:** **Hard Constraint.**

  #### 6. Ex-Ante Identifiability (External / Risk Management)
  *   **The Requirement:** The principle must be applicable even when identities are unknown (behind a veil of ignorance regarding who will be the loser).
  *   **The Case:** Mixed-Motive / Role-Rotation.
  *   **Why:** Institutions deal in policies, not just one-off cases. The justification must hold for anyone who *might* occupy the position.
  *   **Status:** **Operational Requirement.** This shifts the view from *ex post* contractualism (actual victims) to *ex ante* contractualism (expected burden).

  ---

  ### Part 2: Stress-Testing the Cases

  Here is how the spec demands the solution handle your specific scenarios.

  **1. The Plain Case (1 Limb vs. 10,000 Trivialities)**
  *   **Demand:** The solution must permit saving the limb *initially*. The complaint of limb-loss is stronger than the complaint of a triviality *one-to-one*.
  *   **Failure Mode:** If the principle immediately aggregates the trivialities to outweigh the limb, it violates the **Individualist Restriction**.

  **2. Dilution (1 Limb vs. N Trivialities)**
  *   **Demand:** The solution must identify a metric for when the *number* of complaints transforms the situation. Is it a threshold? A sliding scale?
  *   **Crucial Question:** Are we summing *benefit size* (utilitarian) or counting *people with a complaint* (contractualist)?
  *   **Spec Ruling:** It must be **counting people with a complaint**. If you sum benefit size, you violate **Complaint Holism**. The solution must say: "At N people, the collective weight of N distinct complaints makes it unreasonable for the Limb-Loser to reject the principle."

  **3. The Shrapnel Case (Fragmenting the Loss)**
  *   **Demand:** The solution must explicitly forbid breaking the limb-loss into units.
  *   **Why:** If you allow the limb-loss to be treated as 1,000 "pain units," you can match them against 1,000 people's "headache units." This violates **Complaint Holism**.
  *   **Hard Line:** The complaint belongs to the *person*, not the *nerve ending*.

  **4. Same-Person-Over-Time**
  *   **Demand:** The solution must clarify if this is a matter of *prudence* or *justice*.
  *   **Spec Ruling:** Contractualism is interpersonal. However, for an institution, the structure should mirror the interpersonal case to avoid arbitrary distinctions. If the many-small-vs-one-large trade-off is forbidden interpersonally, it should be forbidden intrapersonally *unless* the person consents.
  *   **Risk:** If you allow aggregation here but not there, you invite the "Shrapnel" loophole (redefine one person over time as "many temporal selves").

  **5. Reverse Direction (1 Big Benefit vs. Many Small Losses)**
  *   **Demand:** If the many can aggregate small complaints to stop the limb-loss, can they aggregate small losses to stop the one big benefit?
  *   **Spec Ruling:** Yes, unless there is a **Priority Rule** (e.g., "Urgency trumps Aggregation"). Without a priority rule, this case exposes the symmetry requirement. If the many can stop the limb-loss, they should be able to stop the yacht-purchase if their aggregate small losses are deemed sufficient.

  **6. Mixed-Motive / Role-Rotation**
  *   **Demand:** The principle must be justifiable to someone who has a 1/N chance of being the loser.
  *   **Spec Ruling:** This pushes the solution toward **Ex-Ante Aggregation**. If everyone faces a small risk of limb-loss to avoid a certainty of headache, that might be acceptable. The spec requires the principle to work in terms of *expected complaint strength*, not just actual outcomes.

  **7. Conditional Existence**
  *   **Demand:** The solution must handle people who only exist if the principle is adopted.
  *   **Spec Ruling:** This is the failure mode. Contractualism relies on "reasonable rejection" by affected parties. Non-existent parties cannot reject.
  *   **Honest Output:** The spec must flag this as **Out of Scope** or require a proxy (e.g., "rejectable by those who would exist under the alternative"). Any solution that claims to solve this cleanly is likely smuggling in consequentialism (valuing "potential lives").

  ---

  ### Part 3: The Incompatibility Matrix (The "Impossible Trinity")

  You asked to flag requirements that cannot be jointly satisfied. Here is the core tension.

  **The Trinity:**
  1.  **Strict Individualism:** Compare the loser only to each winner individually (no summing).
  2.  **Sensitivity to Numbers:** The many small complaints must eventually outweigh the one large complaint.
  3.  **Transitivity/Consistency:** The ordering of principles must be logical and non-circular across cases.

  **The Conflict:**
  *   If you hold (1) strictly, you cannot get (2). (If A > B individually, then A > B + B... + B).
  *   If you want (2), you must weaken (1) to allow some form of aggregation (e.g., "strength of complaint scales with numbers").
  *   If you weaken (1) too much, you lose the contractualist distinctiveness and collapse into (3) with a utilitarian metric.

  **The Single Requirement Doing the Most Work:**
  *   **The Individualist Restriction.** This is the gatekeeper. Every attempt to solve aggregation is essentially an attempt to relax this restriction just enough to allow numbers to count, without relaxing it so much that the view becomes utilitarian.

  **The Prejudice Dressed as Neutral:**
  *   **The Demand for Completeness/Decidability.**
  *   **Why:** It is presented as "practical necessity" (the committee needs an answer). But it forces the theory to posit a precise *tipping point* (e.g., "At 10,001 headaches, the limb is sacrificed") where moral reality is likely vague.
  *   **The Smuggle:** This demands a *cardinal metric* of complaint strength (so you can find the exact tipping point) in a framework that is naturally *ordinal* (this complaint is worse than that one). Demanding a precise number is a consequentialist/technocratic prejudice imposed on a relational moral framework.

  ---

  ### Part 4: Scorecard of Approaches

  Here is how the major candidate strategies score against your Spec.

  | Approach | (a) Straight Aggregation | (b) Individualist Restriction | (c) Threshold / Tie-Breaker | (d) Ex-Ante / Risk | (e) Complaint Scaling |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Mechanism** | Sum welfare, pick max. | Compare loser to *each* winner 1-on-1. | Aggregation only breaks ties between *comparable* complaints. | Aggregate *expected* complaints behind a veil. | Strength of complaint increases with # of holders. |
  | **Individualist Restriction** | **FAIL.** Sums across persons. | **PASS.** Pure Scanlon. | **PASS.** Keeps comparison individual. | **PASS.** Focuses on individual risk. | **FAIL.** Modifies the complaint itself. |
  | **Sensitivity to Numbers** | **PASS.** | **FAIL.** Numbers never matter. | **PARTIAL.** Only matters in ties. | **PASS.** Risk aggregates naturally. | **PASS.** Numbers change the weight. |
  | **Decidability** | **PASS.** | **FAIL.** Often indeterminate. | **FAIL.** Ties are rare; doesn't solve hard cases. | **PASS.** Expected value is calculable. | **PASS.** Yields a function. |
  | **Shrapnel Case** | **FAIL.** Allows fragmentation. | **PASS.** Blocks fragmentation. | **PASS.** Blocks fragmentation. | **PASS.** Focuses on ex-ante risk. | **RISK.** Might allow fragmentation. |
  | **Institutional Usability** | **HIGH.** | **LOW.** Too rigid for triage. | **LOW.** Too vague for committees. | **HIGH.** Fits insurance/risk models. | **MED.** Hard to calibrate the scale. |
  | **Verdict** | Not Contractualism. | Theoretically Pure, Practically Useless. | Theoretically Safe, Practically Weak. | **Best Fit for Institutions.** | Theoretically Controversial. |

  ### Recommendation for Your Paper

  If you are writing for an **institutional audience** (triage, ethics boards), the **Ex-Ante / Risk (d)** model is the only one that satisfies the **Decidability** and **Sensitivity to Numbers** requirements without blatantly violating the **Individualist Restriction**.

  *   **Why:** It shifts the aggregation from *outcomes* (which violates individualism) to *risks* (which everyone shares). Everyone accepts a small risk of limb-loss to avoid a certainty of headache. No single individual is *sacrificed*; everyone accepts a *burden of risk*.
  *   **The Catch:** It fails the **Conditional Existence** and **Actual Victim** cases. If the risk turns into reality for one person, the ex-ante justification feels hollow to the actual victim.

  **The "Prejudice" to Expose:**
  In your paper, highlight that the demand for a **determinate tipping point** (Decidability) is what forces contractualism to either become utilitarian or admit indeterminacy. If you drop the requirement that the committee *must* have a yes/no answer in borderline cases (allow for "moral discretion" or "lottery"), you relieve the pressure to aggregate. The insistence that ethics must function like an algorithm is the non-negotiable demand that breaks the theory.
