  You have identified a genuine methodological crux that sits between meta-ethics and cross-cultural psychology. While the individual boxes (a–d) have established names, there is no single canonical term for the *meta-methodological choice* of sorting a variance into one box rather than another, nor for the suspicion that this sorting drives the ontological conclusion.

  Here are the nearest established concepts, why they fall short, and a coined term that captures the specific phenomenon you described.

  ### Near-Fits and Their Limits

  1.  **The Principle of Charity (Davidson):**
      *   *Fit:* This dictates that interpreters should maximize agreement, pushing you from (a) toward (b) or (c). It explains *why* a theorist might resist the "genuine disagreement" classification.
      *   *Limit:* It is a normative rule for interpretation, not a name for the *ambiguity* itself. It doesn't cover (d) (moral community boundaries), nor does it name the problem that the data underdetermines which application of charity is correct.

  2.  **Construct Equivalence / Validity (Psychometrics):**
      *   *Fit:* This is the standard term for box (b). If a measure lacks equivalence across cultures, the comparison is invalid.
      *   *Limit:* This is a technical criterion for measurement, not a philosophical label for the *sorting dilemma*. It doesn't capture the meta-ethical stakes (objectivity vs. relativism) that hinge on the choice.

  3.  **Fundamental vs. Non-Fundamental Disagreement (Meta-ethics):**
      *   *Fit:* This distinguishes (a) from (c). If disagreement persists after fixing facts, it is "fundamental."
      *   *Limit:* It assumes we can cleanly separate facts from norms. It struggles with your point about morally-loaded facts (thick concepts) and doesn't account for (d) (who counts as a patient).

  4.  **Emic vs. Etic Approaches (Anthropology/Psych):**
      *   *Fit:* Emic (insider-specific) vs. Etic (universal) maps onto (b) vs. (a).
      *   *Limit:* Like construct equivalence, this describes the *stance* of the researcher, not the *underdetermination* of the data that allows the researcher to switch stances to suit a conclusion.

  ### The Coined Term

  Because the existing literature names the *boxes* but not the *sorting mechanism* or the *ambiguity of the sort*, the precise concept you are describing is best captured by a new term.

  **Term:** **The Disagreement Attribution Problem**

  **Definition:**
  The methodological underdetermination wherein observed cross-cultural moral variance can be plausibly attributed to multiple distinct causes—normative conflict (a), conceptual mismatch (b), empirical divergence (c), or boundary exclusion (d)—where the chosen attribution predetermines the meta-ethical conclusion (e.g., objectivity vs. relativism) without independent criteria for selecting the attribution.

  **Carving and Edges:**
  *   **Core Case:** When the same behavioral data (e.g., punishment rates in an economic game) is cited as evidence for relativism by one author (attributing to (a)) and universalism by another (attributing to (b) or (c)).
  *   **Boundary Case (Morally-Loaded Facts):** When the "facts" in (c) are thick concepts (e.g., "spiritual harm"). The *Disagreement Attribution Problem* highlights that classifying this as "fact" vs. "norm" is itself an attribution choice, not a discovery.
  *   **Boundary Case (Moral Community):** When the variance is about (d). The problem identifies that shifting the "moral circle" is often a strategic attribution to avoid calling something a normative conflict (a).
  *   **Exclusion:** It does not apply to simple verbal disputes where translation is clearly broken; it applies specifically where the ambiguity is *theoretical* and *consequence-laden*.

  \answer{coined: The Disagreement Attribution Problem}
