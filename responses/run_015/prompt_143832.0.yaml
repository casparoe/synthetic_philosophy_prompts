  **OFFICE OF FORMAL PRESERVATION**
  **FAQ: Class-A Poetic Translation Licensing**

  **Q: Do I need a license to translate sonnets?**
  A: Yes. Any translation involving iambic pentameter requires a Tier-4 Formalism Permit. Failure to file Form 88-B (Intent to Rhyme) prior to publication constitutes unlicensed metering. All translators must swear an oath to prioritize structure over sense.

  **Q: How does the Rhyme Bond work?**
  A: All translators must post a refundable Rhyme Bond of $500 per stanza. This bond is forfeited if an audit reveals any deviation from the source text's stress pattern. Note: Accidental slant rhymes are treated as structural negligence. If your target line contains eleven syllables where the original contained ten, the bond is liquidated immediately. No appeals are accepted for "poetic license."

  **Q: What is the Marot Metric?**
  A: The Marot Metric (MM) is the federal standard for translation fidelity. Scores are calculated by dividing the number of preserved syllables by the number of preserved meanings. Ideally, the meaning quotient should be zero. A perfect MM score requires that the translation sounds exactly like the original but makes absolutely no sense in the target language. High scores grant tax exemptions; low scores result in mandatory re-education workshops involving flashcards and metronomes.

  **Q: How are "Semantic Drift" violations penalized?**
  A: Semantic Drift is treated similarly to a parking violation. If your translation conveys the original author's intended message too clearly, you will be issued a Citation of Excessive Clarity. First offenses incur a warning. Second offenses result in the revocation of your metaphor license. Third offenses require you to translate only technical manuals for a period of no less than five years.

  **Q: Can I appeal a ruling if the poem feels "right"?**
  A: Feelings are not admissible evidence. The Office of Formal Preservation recognizes only countable units: feet, lines, and stanzas. If the spirit of the poem is preserved but the syllable count is off by even one, the translation is deemed contraband. Please refer to Section 12.C regarding "Emotional Smuggling."

  **Q: Where do I submit my completed translation?**
  A: Submit three hard copies and a digital scan to the Department of Syllabic Integrity. Do not include a cover letter explaining your choices. Explanations imply uncertainty. Uncertainty suggests the form was not strong enough to stand alone.

  ***

  **Note on Liberties and Accuracy**
  You asked me to state plainly if your premise was confused. It is, slightly. Your friend's book club member likely referenced Douglas Hofstadter's *Le Ton Beau de Marot*, but your definition is inverted. Hofstadter does not argue for preserving form "no matter what happens to the words." Instead, the book explores the tension between form and meaning, often arguing that the "spirit" or "tone" is paramount, even if the form must change. The satire above exaggerates the "form-over-meaning" approach into a bureaucratic nightmare for comedic effect, whereas Hofstadter's actual work is a playful, deep dive into the impossibility of perfect translation. I took liberties by treating the "Marot Metric" as a rigid government standard rather than a philosophical concept.
