  *   **Top:** Title + Instructions.
  *   **Middle:** The Flowchart (use diamonds for Questions, Rectangles for Leaves).
  *   **Bottom:** The Table of Leaves + Flags.
  *   **Font:** Keep it small enough to fit, but legible. Use bold for the **Yes/No** paths.
