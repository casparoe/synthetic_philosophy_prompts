  # The Hole Argument: Position Sorting Tree

  **Instructions:** Start at **Q1**. Answer based on your concrete commitments, not the label you think you want. Follow the arrows to your position.

  ### The Questions

  **Q1: Independence**
  Do spacetime points exist as physical entities *distinct* from the metric field $g_{ab}$? (Could the points exist if the field were removed?)
  *   **Yes** → Go to **Q2**.
  *   **No** → Go to **Q6**.

  **Q2: Haecceitism**
  If points exist, do two models that agree on all observable/qualitative facts but assign field values to *different* points describe distinct physical worlds?
  *   **Yes** → Go to **Q3**.
  *   **No** → **Leaf A**.

  **Q3: Global Drag**
  If the diffeomorphism shifts *every* point in the universe (no fixed boundary region), does it still generate a distinct physical possibility (or a forbidden one)?
  *   **Yes** → Go to **Q4**.
  *   **No** → **Leaf B**.
      *(Note: A "No" here means your worry depends on the specific "hole" boundary conditions, not the shifting itself.)*

  **Q4: Determinism**
  Is it acceptable for fundamental physics to be radically indeterministic (multiple futures from one past) if the differences are unobservable?
  *   **Yes** → **Leaf C**.
  *   **No** → Go to **Q5**.

  **Q5: Repair Strategy**
  To restore determinism, do we modify the theory by **adding** structure or **restricting** structure?
  *   **Add** (e.g., absolute background) → **Leaf D**.
  *   **Restrict** (e.g., gauge fixing, pick one model) → **Leaf E**.

  **Q6: Substance**
  (If points don't exist independently) Is the metric field $g_{ab}$ itself the fundamental substance?
  *   **Yes** → **Leaf F**.
  *   **No** → Go to **Q7**.

  **Q7: Structure**
  Do physical structures exist without point-like relata (nodes)?
  *   **Yes** → **Leaf G**.
  *   **No** → **Leaf H**.

  ---

  ### The Leaves (Positions)

  | Leaf | Position Name | The Awkward Commitment |
  | :--- | :--- | :--- |
  | **A** | **Sophisticated Substantivalism**<br>*(incl. "Only Relabelings")* | Spacetime points exist, but swapping their properties makes no physical difference (Leibniz Equivalence). |
  | **B** | **Restrict to Hole-Free Models** | The "hole" boundary is physically special; diffeomorphisms that move everything are fine, but hole-maps are forbidden. |
  | **C** | **Bite-the-Bullet Indeterminist** | Reality is genuinely indeterministic in a way that is forever undetectable to observers. |
  | **D** | **Add Background Structure** | We must sacrifice the spirit of General Relativity (e.g. return to absolute space) to save determinism. |
  | **E** | **Gauge Fixing / Constrain Models** | We must artificially select one "true" coordinate representation from the mathematically equivalent set. |
  | **F** | **Supersubstantivalism** | Spacetime isn't a container *and* a field; the metric field *is* the substance (no underlying manifold). |
  | **G** | **Ontic Structuralism** | There are no "things" (points), only the web of relations/structure itself. |
  | **H** | **Plain Relationism**<br>*(Eliminativist)* | Spacetime points are fictions; only the material/field relations are real. |

  ---

  ### Important Flags & Notes

  **⚠️ The "Soph Sub vs. Relationism" Problem**
  Leaves **A** (Sophisticated Substantivalism) and **H** (Plain Relationism) are empirically indistinguishable. Both treat diffeomorphic models as physically equivalent. The tree separates them based on **Q1** (Ontology), but no experiment can tell you which path you took. If you find **Q1** meaningless, you likely sit on the border of these two cells.

  **⚠️ The "Global Drag" Split**
  **Q3** is the critical fork for "Model Restriction" strategies. If you think the Hole Argument fails because of the *hole* (the boundary), you land in **Leaf B**. If you think it fails because *shifting points* doesn't change reality, you answer **No** at **Q2** and land in **Leaf A**. If you think shifting points *does* change reality even globally, you must accept Indeterminism (**C**) or modify the theory (**D, E**).

  **⚠️ Empty/Unattractive Cells**
  *   **Q1=Yes, Q2=No, Q3=Yes:** Incoherent. If shifting points doesn't create a new world in the Hole case (Q2=No), it shouldn't in the Global Drag case (Q3=Yes).
  *   **Q1=Yes, Q2=Yes, Q3=No, Q4=No:** Unstable. If you reject indeterminism but think Global Drag is *not* a problem, you must explain why the Hole boundary magically blocks indeterminism without restricting the models (**Leaf B** covers this, but it's unpopular).

  ---

