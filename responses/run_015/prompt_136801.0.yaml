answer: |-
  The memo was single-spaced, printed on paper that felt too thin to hold the weight of what it said. Elias stood at the kitchen sink, the paper dampening under his thumb where the condensation from the faucet had gathered.

  **SUBJECT: HYDROLOGICAL AUDIT RESULT – SECTOR 4**
  **FINDING: H2O CONCENTRATION < 0.01%**
  **SUBSTITUTE: SYNTHETIC ANALOGUE (DESIGNATION: XYZ-8)**

  He turned the handle. The stream came out clear, odorless, wet. It splashed against the ceramic basin with the exact sound he'd heard every day of his thirty-two years. It felt cold. It soaked the cuff of his shirt.

  But it wasn't water.

  His mother used to stand him on this same stool, guiding his small hands under the stream. "Wash away the day," she'd say. "Clean hands, clean heart. Don't bring the outside dirt into the house."

  In the Colony, cleanliness wasn't just hygiene; it was morality. To be "pure" was to be washed in the communal supply. The elders spoke of impurity as a physical residue that the water lifted away. You couldn't be good if you weren't clean. You couldn't be clean without the Flow.

  Elias looked at his hands. They were dripping.

  If Putnam was right—and the philosophy electives he'd taken at the University before the borders closed had hammered this home—meaning wasn't in the head. It was in the world. When he said "water" growing up, he wasn't referring to the clear liquid in his mind's eye. He was referring to the stuff actually coming out of the pipe. Which was XYZ-8.

  So, technically, he'd never lied. He had touched water. *Their* water.

  But the moral weight… that was heavier.

  He remembered the Shunning of Mr. Henderson. Henderson had refused to wash before the harvest feast. "It's just fluid dynamics," he'd argued. "Soap does the work." The elders said he was profane. Unclean. He was cast out because he rejected the purity of the Flow.

  If the Flow was just industrial coolant masquerading as life-giver, what happened to the sin?

  Elias grabbed a dish towel. The fabric was rough. He scrubbed his hands until they were red. Was he washing off the XYZ-8? Or was he trying to wash off the lie?

  If "purity" was defined externally by the substance that facilitated the ritual, then he was pure. He had used the correct substance. But if "purity" referred to some universal standard of hygiene or spiritual truth that required *actual* H2O, then his entire life was a moral fiction.

  He looked at the memo again. *Synthetic Analogue.*

  The crisis wasn't that the liquid was fake. It behaved like water. It quenched thirst. It cleaned grease. The crisis was that the word "water" had snapped its tether to the rest of the world. He was speaking a dialect of reality that no one outside the Colony understood. And worse, the word "pure" snapped with it.

  He turned the tap off. The silence in the kitchen was loud.

  "Mom?" he called out, though he knew she was gone.

  He looked at the sink. The droplets clinging to the stainless steel looked like water. They acted like water. But the meaning had drained out of them, leaving only the chemistry. He realized he couldn't pray tonight. Not because he was dirty, but because he didn't know what the word "clean" meant anymore. If the extension of the term changed overnight, did the virtue disappear?

  He dried his hands. They felt dry. They looked clean. But as he walked out of the kitchen, he kept his palms open, staring at them, waiting for them to feel like something other than what they were.

