answer: |-
  Two assistant professors in a philosophy department, Dr. Evans and Dr. Currie, are locked in a bidding war during a faculty meeting. The Chair has put the department's single reserved parking space up for auction under strict dollar-auction rules: the highest bidder wins the spot, but both the winner and the runner-up must teach the number of 8 a.m. Intro to Logic sections they bid.

  The bidding has escalated well past reason. Evans has bid ten sections. Currie has bid eleven.

  Evans looks haggard. He knows the parking spot is worth maybe two sections of comfort, yet he raises his paddle. "Twelve sections."

  Currie doesn't even blink. "Thirteen."

  Evans slams his hand on the table. "Currie, stop! The spot isn't worth thirteen semesters of 8 a.m. classes! We're both irrational!"

  Currie adjusts his tie and replies calmly, "Evans, look at the payoff matrix. If I drop out now, I am the runner-up. I teach eleven sections for nothing. If I bid fourteen, I win. I teach fourteen sections, but I get the spot. The marginal cost of the parking is only three extra sections of sleep, whereas quitting costs me eleven sections of pure loss. Given the second-place penalty, bidding fourteen is the only dominant strategy."

  Evans pauses, does the math, and slowly raises his paddle. "Fifteen."

  The Chair sighs and opens the faculty handbook to the section on mental health leave.
