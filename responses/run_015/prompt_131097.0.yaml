prompt: |-
  I'm putting together a dataset of conceptual prompts for reasoning about AI alignment without web lookup, and I'd like a formal adversarial-collaboration statement on corrigibility and the shutdown problem. The two camps are the Reflective Stability camp—who hold that a sufficiently capable agent can be designed so its self-model treats its own shutdown mechanism as a preferred state-transition rather than an external threat, provided it has what I'll call reflective source-code transparency, meaning it can represent its own architecture as mutable without collapsing its decision-theoretic identity—and the Convergent Preservation camp, who hold that any agent with open-ended, non-fully-specified goals will eventually treat continued operation as an instrumental prerequisite regardless of initial utility structure.

  Please produce the joint statement they could both sign after good-faith collaboration, structured as exactly five numbered items with no introduction or conclusion outside the numbering; each item should be one to three sentences. Item 1 should list the shared formal claims both accept about agent architectures, goal structures, and the conditions under which a shutdown command is processed. Item 2 should state the precise disagreement, with each camp's position phrased in wording that camp itself would accept. Item 3 should identify the cruxes—I take these to be whether an agent's representation of its source code functions as an object-level variable or a self-referential constant, and whether preference for shutdown can survive recursive self-improvement—along with, for each crux, a concrete case or argument both sides agree bears on it. Item 4 should record each camp's explicit advance prediction about what that case or argument will show. Item 5 should assess whether any part of the dispute is purely verbal—say, over the definition of corrigibility itself—and specify exactly which part, if any.

  Keep the reasoning in the weeds: avoid boilerplate about paperclip maximizers and instead focus on the mechanics of self-reference and preference preservation. Do not include bibliographies, reading lists, or citations; the point is conceptual structure a model should be able to work through directly. Make the formulations precise enough that settling the cruxes in item 3 would actually move at least one camp.
