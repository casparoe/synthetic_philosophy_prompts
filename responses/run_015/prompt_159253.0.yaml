  1.
  **Question:** You teach that a lie is a false signification with the will to deceive. If I wear a garment of peace while hiding a sword, my tongue is silent but my habit speaks. Is this a lie?
  **Likely Answer:** Yes. All communication is by signs, whether words or garments. To signify what is not in the heart is to lie, even without speech.
  **Follow-up:** If the sword falls out and reveals itself, was the lie lessened because the truth appeared despite your will?
  **Scholarly Flag:** Established that Augustine includes non-verbal signs; disputed whether all deceptive appearances count equally with speech.

  2.
  **Question:** You set jokes apart from lies. If I write a jest in a letter where no voice carries the tone of play, and the reader takes it as truth, have I lied?
  **Likely Answer:** If you intended it as jest, you did not will to deceive, so it is no lie, though the reader erred.
  **Follow-up:** Then the falsehood is not in the words themselves, but in the convention shared between writer and reader?
  **Scholarly Flag:** Established that jokes are exempt; disputed whether this relies on hearer recognition or speaker intent alone.

  3.
  **Question:** When the unjust authority asks where the innocent hides, you forbid the false word. But if I stay silent, or speak ambiguously so he cannot find the man, is this a different sin?
  **Likely Answer:** Silence is not affirmation. To hide the truth is not to speak falsehood; the sin is in fashioning a sign that points away from what you know.
  **Follow-up:** So the sin is not in hiding the truth, but only in actively signifying what is not in the heart?
  **Scholarly Flag:** Established that silence/ambiguity is permitted; disputed whether this creates a loophole that undermines the absolutism.

  4.
  **Question:** The martyr stands before the persecutor who demands she deny Christ. She refuses, though she knows he will kill her. Does his lack of merit license her to speak a falsehood to save her life?
  **Likely Answer:** No. The persecutor's unworthiness does not give her license to wound her own soul. She owes truth to God always.
  **Follow-up:** Then the wrong is done even if the persecutor is not deceived, because the soul is divided?
  **Scholarly Flag:** Established that lying to persecutors is forbidden; disputed whether this is because of the speaker's soul or a universal duty regardless of hearer's claim.

  5.
  **Question:** You speak of owing truth to some. Is there any man to whom we owe no truth, and if so, does lying to him become merely withholding?
  **Likely Answer:** We owe truth to all men as neighbors, though charity dictates we need not disclose all truth to all.
  **Follow-up:** So the distinction is never in the man's claim, but always in what charity demands we disclose?
  **Scholarly Flag:** Highly contested whether Augustine recognizes a "right to truth" that varies by person or holds truth owes to all equally.

  6.
  **Question:** If a dying man begs to hear he will live, and knows in his heart he will not, is it a lie to grant his wish?
  **Likely Answer:** Yes, it is a lie. You cannot help a soul by destroying your own integrity before God.
  **Follow-up:** Even if the hearer is not deceived, but merely comforted by the sound of the words?
  **Scholarly Flag:** Established that beneficial lies are forbidden; disputed whether the harm to the hearer factors into the gravity.

  7.
  **Question:** You rank lies from eight kinds. Is the lie that saves a life heavier than the lie that gains a coin, or are they equal in the wound to the speaker?
  **Likely Answer:** They are unequal in sin. The motive matters, though all are sinful.
  **Follow-up:** Then the gravity tracks the harm to the neighbor, not only the division in the heart?
  **Scholarly Flag:** Established that Augustine grades lies; disputed whether the grading is based on harm caused or intent/motive.

  8.
  **Question:** If I speak falsehood with will to deceive, but the hearer sees through me and is not taken in, have I still lied?
  **Likely Answer:** Yes. The lie is in the breast of the speaker, not the ears of the hearer.
  **Follow-up:** Then why does the joke depend on the hearer knowing it is play, if the lie depends only on the speaker?
  **Scholarly Flag:** Established that successful deception is not required for a lie; disputed how this reconciles with the joke exception.

  9.
  **Question:** If the lie is in the will, and the joker wills to speak falsehood, why is the joker's will not divided like the liar's?
  **Likely Answer:** The joker does not will that the falsehood be believed. He wills play.
  **Follow-up:** So the will to deceive is the essence, not the will to speak falsehood?
  **Scholarly Flag:** Established that will to deceive is key; disputed whether this makes the view hearer-dependent (since deception implies a hearer).

  10.
  **Question:** If I speak truth believing it false, you call this a lie. If I speak falsehood believing it true, you call this no lie. Does this not prove the fault is wholly in the speaker's heart, regardless of who hears?
  **Likely Answer:** Yes. The conscience is the tribunal.
  **Follow-up:** Then how can the hearer's lack of claim ever lessen the sin, if the sin is wholly within me?
  **Scholarly Flag:** Established that belief determines lie status; contested whether this absolute internalism allows for the exceptions regarding hearer status.
