prompt: |-
  So my philosophy of language reading group got into this silly late night arguement about the Clinton Lewinsky mess and I volunteered to get an outside take. You probably remember the basics even without looking anything up: in the late 90s Clinton had to testify before a grand jury about his relationship with Lewinsky, he got really legalistic about verb tense and about what counted as a certain kind of physical contact, and everyone watching felt he was being evasive even though his defenders said everything he said was technically true if you parsed it narrowly.

  Can you walk us through that episode using Grice on speaker meaning and implicature and the cooperative principle with the maxims? I get confused between what is literally said versus what is implicated and who is supposed to be cooperating with whom when you have seperate audiences like the prosecutors in the room versus the public watching on TV. Map it out: what did Clinton literally say versus implicate, did he violate a maxim or just exploit one, and what would a fully cooperative witness have done differently by Gricean lights? And then be honest about where Grice feels stretched here — does his picture even handle a speaker who is legally trying not to cooperate while looking cooperative, and does the fact that everyone got the evasive implication but still felt misled count as a win for the theory or show it misses something about strategic misleading without outright lying? My friend says this kind of case proves Grice is naive about power and courtroom talk, I think it shows his said versus meant distinction doing real work, who is closer?
