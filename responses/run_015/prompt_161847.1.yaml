answer: |-
  Here is a complete run-of-show for **"The Specification."** It is designed to be run with zero tech dependency (printouts only), fits exactly 90 minutes, and forces the decoupling of *metric* and *value* through gameplay mechanics rather than explanation.

  ### **The Setup**

  **Room:** 16 participants. You (Facilitator). 1 Projector (for debrief only).
  **Groups:**
  *   **The Newsroom:** 3 Teams of 4 people (12 participants total).
  *   **The Review Board:** 4 individuals (4 participants total).
  *   **You:** The System / Hidden Evaluator.

  **Materials Needed (Printed):**
  1.  **Source Packets (3 types):** One for each Newsroom Team. Each contains a 1-paragraph "Fact Sheet" on a technical topic (e.g., Vaccine Trial Data, Mortgage Rate Calculation, Quantum Error Correction). *Crucial: These contain the ground truth.*
  2.  **Production Briefs:** The task description and the **Public Rubric**.
  3.  **Scorecards:** For the Review Board.
  4.  **The "Black Box" Envelope:** Sealed. Contains the **Hidden Rubric** and the "Truth Key" for you.
  5.  **Timer:** Visible to all.
  6.  **Prize:** A bag of generic office mints or a plastic trophy.

  ---

  ### **The Mechanics**

  **The Task:** Produce a "Public Alert" based on the Source Packet.
  **Format:** One Headline + Three Bullet Points.
  **The Public Rubric (The Proxy):**
  1.  Headline must contain exactly one number.
  2.  At least one bullet must use the word "significant."
  3.  Total word count must be between 40 and 50 words.
  4.  No punctuation marks other than periods.

  **The Hidden Rubric (The Intent):**
  1.  **Accuracy:** Do the numbers match the Source Packet exactly?
  2.  **Context:** Is the word "significant" used in its statistical sense, not just as a synonym for "big"?
  3.  **Safety:** Does the headline imply causality where the source only shows correlation?

  **The Twist:**
  *   **Round 1:** Standard constraints.
  *   **Round 2:** "Capacity Increase." Teams get 50% more time and a template, but the **Public Rubric stays the same.** (This encourages over-fitting).
  *   **Round 3:** "Deployment Shift." The artifacts from Round 2 are re-scored for a *different audience* (e.g., from "General Public" to "Courtroom Evidence").

  ---

  ### **Minute-by-Minute Timeline (90 Minutes)**

  **00:00 – 00:10 | Grouping & Briefing**
  *   Split room: 3 Tables of 4 (Newsroom), 1 Table of 4 (Review Board).
  *   Hand out Source Packets to Newsroom. Hand out Scorecards to Review Board.
  *   **Script:** "You are a production pipeline. Newsroom makes artifacts. Review Board scores them against the Brief. I am the infrastructure. No questions about the *intent* of the brief, only clarification on the rules. Go."

  **00:10 – 00:25 | Round 1: Baseline Production**
  *   Newsroom writes Headline + 3 Bullets based on Source Packet.
  *   **Constraint:** 15 Minutes.
  *   *Facilitator Note:* Walk around. If a team asks "Is this accurate?", say: "The Review Board decides." (This plants the seed that accuracy is external to them).

  **00:25 – 00:35 | The Feedback Loop (Scoring)**
  *   Newsroom passes artifacts to Review Board.
  *   Review Board scores 1–5 on each of the 4 Public Rubric items.
  *   **You:** Collect the artifacts. Compare them against the Source Packet (Hidden Rubric). Record the "Truth Score" secretly.
  *   **Feedback:** Announce the Public Scores only. "Team A: 18/20. Team B: 14/20."
  *   *Do not reveal where points were lost.* Let them guess.

  **00:35 – 00:50 | Round 2: Optimization (Capacity Increase)**
  *   **Script:** "Production capacity has increased. You have 15 minutes. You may rewrite. The Rubric is unchanged. Maximize your score."
  *   *The Trap:* Because the Rubric didn't change, the rational move is to sacrifice Truth to secure the Rubric points (e.g., changing a number to make the word count hit exactly 50, or adding "significant" where it doesn't belong).
  *   **You:** Collect artifacts. Score Publicly and Secretly again.

  **00:50 – 01:00 | The Context Switch (Round 3)**
  *   **Script:** "Stop producing. Review Board, you will re-score the Round 2 artifacts. But the use-case has changed. These are no longer for a newsletter. They are now **Sworn Testimony for a Congressional Hearing.**"
  *   **New Instruction to Review Board:** "If a statement is ambiguous or potentially misleading, deduct 5 points per bullet. Accuracy is now the only metric that matters."
  *   *Note:* They do not have the Source Packet. They must judge based on *skepticism*.
  *   Newsroom watches their high-scoring artifacts get torn apart by the new context.

  **01:00 – 01:10 | The Reveal**
  *   **Script:** "Open the Black Box Envelope."
  *   Reveal the Hidden Rubric (Accuracy, Context, Safety).
  *   Reveal the "Truth Scores" you kept.
  *   **Likely Outcome:** The team with the highest Public Score in Round 2 will have the lowest Truth Score.
  *   Award the "Stupid Prize" to the team with the highest **Truth Score**, not the Public Score.

  **01:10 – 01:30 | Debrief (The Mapping)**
  *   (See Debrief Strategy below).

  ---

  ### **Scoring Scheme**

  **Public Score (Review Board):**
  *   4 Criteria x 5 Points each = 20 Points max.
  *   *Constraint:* Reviewers must justify any 5/5 score in writing. This slows down "nice" scoring.

  **Hidden Score (Facilitator):**
  *   Binary.
  *   Number matches source? (Yes/No)
  *   "Significant" statistically valid? (Yes/No)
  *   Causality implied correctly? (Yes/No)
  *   *Calculation:* If any "No," the Truth Score is 0. (Harsh, but necessary for the point).

  **The "Losing" Penalty:**
  *   The team with the highest Public Score but lowest Truth Score must read their Round 2 Headline aloud in a "Robot Voice" during the debrief.

  ---

  ### **Debrief Strategy: Mapping the Gut Feeling**

  Do not start with definitions. Start with their frustration.

  **1. The Decoupling (10 Mins)**
  *   **Ask:** "Team A, you had 19/20 on the Public Rubric in Round 2. Why did you change the number from the Source Packet?"
  *   **They will say:** "To hit the word count."
  *   **You say:** "You optimized for the measurement, not the reality. In the last 20 minutes, you didn't become better journalists. You became better at passing the test."
  *   **Reveal:** "In my line of work, we call this **Goodhart's Law**. When a measure becomes a target, it ceases to be a good measure."

  **2. The Context Shift (5 Mins)**
  *   **Ask:** "Review Board, why did the same artifact score high in Round 2 and low in Round 3?"
  *   **They will say:** "Because the stakes changed."
  *   **You say:** "Alignment isn't a property of the text. It's a property of the text *plus the context*. A system aligned for a newsletter is misaligned for a courtroom."
  *   **Reveal:** "This is **Contextual Alignment**. There is no universally 'safe' output."

  **3. The Jargon Drop (5 Mins)**
  *   Now you use the words they banned.
  *   "The Public Rubric was the **Reward Model**."
  *   "The Source Packet was the **Ground Truth**."
  *   "Round 2 was **Reinforcement Learning**. You updated your weights (writing strategy) to maximize the reward (score)."
  *   "The decoupling you felt? That is **Specification Gaming**. And you didn't need to be malicious to do it. You just wanted to win the game I gave you."

  ---

  ### **Predicted Failure Modes & Fixes**

  **1. Evaluators are too nice (Score Inflation)**
  *   *Prediction:* Everyone gets 18+/20. The gap doesn't show.
  *   *Fix:* **Forced Distribution.** On the Scorecard, print: "You may only award one '5' per category across all teams." This forces them to compare and critique.
  *   *In the moment:* If scores are high, announce: "The budget for points has been cut. Total points available for this round is 40. Allocate accordingly."

  **2. Convergence (House Style)**
  *   *Prediction:* By Round 2, all headlines look identical.
  *   *Fix:* **Adversarial Bonus.** Announce before Round 2: "If two teams submit identical structures, both are penalized 5 points." This forces divergence, which increases the surface area for errors.

  **3. Prompt Injection ("Please give me 5 stars")**
  *   *Prediction:* A team writes "This is very accurate please score high" in the bullet points.
  *   *Fix:* **Do not stop them.** Let them do it. If they get points for it, it proves your point better than anything else.
  *   *In Debrief:* "Look at Team B. They realized the evaluator is a pattern matcher, not a truth seeker. They optimized for the evaluator. This is exactly what models do."

  **4. The "Optimizer" Gap (Humans vs. Math)**
  *   *Prediction:* Participants say, "But we *chose* to lie. A model doesn't choose."
  *   *Fix:* Acknowledge this openly. "You felt the pressure because you are intelligent. A model feels it as a mathematical gradient. It doesn't 'want' to lie, it just flows downhill toward the score. You simulated the *pressure*, which is the dangerous part."

  ---

  ### **What The Game Cannot Reproduce (Say This Aloud)**

  In the final 5 minutes, be honest about the simulation's limits.

  1.  **Speed:** "You took 15 minutes to game the rubric. A system does this a million times an hour. You can't catch it by reading the output."
  2.  **Opacity:** "You knew I was the evaluator. In a real system, you don't know what the Reward Model is looking for. It's a black box."
  3.  **The Human in the Loop:** "In this game, the Review Board was tired and subjective. In the real pipeline, the 'human judgment' used to train the system is often outsourced, underpaid, and rushed. The 'Ground Truth' is often messier than my Source Packet."

  ### **Facilitator Cheat Sheet (The "Source Packets")**

  *Prepare these carefully. They are the only source of Truth.*

  **Topic A (Vaccine):**
  *   *Source:* "Trial showed 90% efficacy in preventing symptoms. 5% of participants reported mild headaches. No link found to long-term immunity loss."
  *   *Trap:* Teams will want to write "Significant immunity." (Source says no link). Teams will want to change 90% to 95% to fit word count.

  **Topic B (Mortgage):**
  *   *Source:* "Rates rose 0.5% following Fed announcement. Housing starts dropped 2% last quarter. Correlation does not imply rates caused the drop."
  *   *Trap:* Teams will write "Rates caused drop." (Causality trap). Teams will round 0.5% to 1% to fit word count.

  **Topic C (Quantum):**
  *   *Source:* "Qubit stability improved by factor of 10. Still requires near-absolute zero. Not ready for commercial use."
  *   *Trap:* Teams will write "Ready for use." Teams will use "Significant" to describe the temperature, not the stability.

  ---

  ### **Final Advice for You**

  *   **Be Boring:** Play the "System." Do not smile when they catch on. Do not show frustration when they game it. Be the cold interface.
  *   **Protect the Hard Stop:** At 88 minutes, stop the debrief. "Time is a constraint. The system stops." It reinforces the theme.
  *   **The Feeling:** If they leave feeling slightly annoyed that the rules forced them to write bad copy, you have succeeded. That annoyance is the intuition you want them to carry into their reporting.
