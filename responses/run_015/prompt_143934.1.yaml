answer: |-
  Here is the workshop plan designed to shift your team's mental model from "technical debt" to "structural constraint."

  ### 1. Teaching Arc: Dependency Order
  Do not present the metrics as a menu of options. Present them as a chain of logical dependencies that snaps under the weight of prevalence. Introduce the concepts in this specific sequence:

  1.  **Calibration within Groups (The Anchor):**
      *   *Why first:* This is the model's current state and its primary clinical utility. Clinicians must trust that a risk score of 0.8 means 80% probability of sepsis, regardless of demographics. Establish this as the non-negotiable baseline for clinical safety.
  2.  **Structural Prevalence Assumption (The Driver):**
      *   *Why second:* You cannot explain the error rate conflict without first establishing the ground truth distribution. Define this not as "data bias" but as $P(Y=1|A=0) \neq P(Y=1|A=1)$. This is the independent variable that drives the impossibility.
  3.  **Balanced Error Rates (The Constraint):**
      *   *Why third:* Now introduce leadership's goal (Equalized Odds component: equal FNR across groups). Show that this is a constraint on the *conditional* probability of error given the outcome.
  4.  **Predictive Parity (The Impossibility Lever):**
      *   *Why last:* Use this to close the loop. Show that if you enforce Calibration (1) and Balanced Error Rates (3) under Different Prevalence (2), you mathematically force Predictive Parity to break (or vice versa). This demonstrates the triad is over-constrained.

  ### 2. The Clinical Scenario
  **Scenario:** "The Triage Window"
  *   **The Setup:** Two patient groups (Group A and Group B) present at the ER with potential sepsis.
  *   **The Structural Feature:** **Differential Time-to-Presentation.**
      *   Group A has systemic barriers to access (transportation, insurance verification, prior medical distrust) and arrives at the ER later in the disease progression.
      *   Group B arrives earlier.
      *   *Result:* At the moment of triage, the *observed* prevalence of severe sepsis is higher in Group A than Group B. This is a structural artifact of healthcare access, not biology.
  *   **Avoiding Biological Reductionism:**
      *   **Explicitly Forbid:** Any language suggesting Group A is "biologically more susceptible" or "genetically prone" to sepsis.
      *   **Explicitly Require:** Language focusing on "disease stage at entry" and "censoring." The risk score predicts *current* physiological state. Because Group A enters the dataset at a more advanced physiological state, their base rate of positive outcomes ($Y=1$) is structurally higher.
      *   **Why this works:** It validates the prevalence difference as real (not noise) while attributing it to social structure, making it clear that "fixing the data" (removing the prevalence difference) would require fixing society, not the model.

  ### 3. Misconceptions & Interception Points
  Engineers will attempt to solve this as an optimization problem. Intercept these impulses at these precise moments:

  *   **Misconception 1: "Fairness is a single metric we just haven't optimized yet."**
      *   *When:* Immediately after introducing **Balanced Error Rates** (Step 3 of Arc).
      *   *Interception:* State clearly: "Fairness definitions are mutually exclusive objectives, not hyperparameters. Optimizing for FNR parity actively degrades Calibration when prevalence differs. We are not searching for a global minimum; we are choosing a constraint to relax."
  *   **Misconception 2: "Removing protected attributes (blindness) or reweighting the data solves this."**
      *   *When:* During the discussion of **Structural Prevalence** (Step 2 of Arc).
      *   *Interception:* Explain that reweighting data to equalize prevalence creates *miscalibration*. If the real-world prevalence is 20% for Group A and 10% for Group B, but you train on 15%/15%, the model's probability outputs will no longer reflect reality for either group. Blindness fails because the features correlate with the protected attribute via the structural barrier (time-to-presentation).
  *   **Misconception 3: "More data or a better architecture will eliminate the trade-off."**
      *   *When:* At the **Understanding Check** (Conclusion).
      *   *Interception:* Remind them this is a theorem, not an empirical result. "This holds for perfect predictors too. No amount of data changes the algebra of conditional probability."

  ### 4. The Understanding Check
  Do not ask a multiple-choice question. Force a **Trade-off Declaration**.

  **The Prompt:**
  > "We cannot satisfy Calibration, Balanced Error Rates, and Predictive Parity simultaneously given the prevalence difference. To deploy tomorrow, which constraint do we formally relax, and what is the clinical justification?"

  **Pass Criteria:**
  *   **Fail:** Answers suggesting we can "tune the model" to satisfy all three, or that we need "more representative data."
  *   **Pass:** Answers that explicitly select one metric to sacrifice (e.g., "We prioritize Calibration because clinical decision thresholds rely on absolute risk, accepting FNR disparity as a cost of structural prevalence") and acknowledge the consequence is unavoidable.

  ### 5. Out-of-Scope Proof Elements
  Your colleagues are engineers; they will want to see the derivation. Deny them the algebra to prevent them from hunting for "loopholes" in the math rather than the logic.

  *   **Explicitly Set Aside:**
      *   **Bayesian Derivations:** Do not write out $P(Y=1|S, A)$ expansions.
      *   **Confusion Matrix Algebra:** Do not derive the contradiction using $TP, FP, FN, TN$ variables.
      *   **Inequality Proofs:** Do not show the Chouldechova or Kleinberg inequalities.
  *   **What to Use Instead:**
      *   **Contingency Table Visualization:** Use a single slide with two $2 \times 2$ tables (one per group) with fixed prevalence rates. Visually demonstrate that aligning the FNR cells forces the Calibration cells to misalign.
      *   **Statement of Authority:** Cite "The Impossibility Theorem (Kleinberg et al., 2016; Chouldechova, 2017)" as a settled law, similar to the CAP theorem in distributed systems. Treat it as a physical constraint, not a statistical challenge.
