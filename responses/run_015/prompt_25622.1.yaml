answer: |-
  Good morning. Thank you for having me.

  I'm not a philosopher. I don't teach bioethics, and I don't work in healthcare. I own a small bakery downtown. My life is usually measured in grams of flour and minutes of proofing time. Things are tangible. If I underproof the dough, the bread is dense. If I burn the crust, it tastes bitter. Cause and effect are clear, and they are physical.

  Two months ago, my mother died. She had ALS. For the last year of her life, the disease took everything from her except her eyes and her mind. She was trapped inside a body that wouldn't move, breathing only because a machine pushed air into her lungs. She had an advance directive. She had told us, clearly, years before, that she did not want to live indefinitely on a ventilator. She wanted to be remembered as she was, not as a pair of eyes blinking above a machine.

  But when the moment came—the moment the doctors said she had developed pneumonia, that her body was failing, that she could likely survive another six months on the vent or we could extubate and let her go—the advance directive didn't feel like an answer. It felt like a map for a territory we were now walking through in the dark.

  My sister and I stood in that ICU room. The doctors were kind. They were precise. They used words like "withdrawing life-sustaining treatment" and "allowing natural death." They told us that removing the ventilator wasn't killing her; it was stopping the intervention that was preventing her from dying.

  They asked us to say the words. "Do you agree to extubate?"

  I said yes. My sister said yes.

  She died four hours later. We held her hands. Her skin was warm, then it wasn't.

  I am standing here today because you asked for the family perspective. But I need to be honest with you: I haven't made peace with this. I don't stand before you as someone who found closure. I stand here as someone who is still living inside the question.

  Since she died, I've been reading. Probably too much. I'm trying to understand what happened in that room, not medically, but morally. I keep coming back to something I read called the "doing/allowing distinction." It's the idea that there is a moral difference between killing someone and letting them die.

  Some of the philosophers I've read say this distinction is bogus. They argue that if the outcome is the same—death—and the intent is the same—mercy—then pulling a ventilator is morally identical to giving a lethal injection. They say we hide behind semantics to feel better about ourselves. They say we should own the fact that we are causing death.

  Other writers, and many of you in this room, argue the opposite. You say the law gets it right. You say that turning off a machine is allowing nature to take its course. You say the disease killed her, not us. You say there is a bright line between acting and omitting.

  I am not qualified to settle that debate. But I want to tell you what it looks like from the inside when you are the one who has to speak the words that cross that line.

  When the doctor asked me to authorize the extubation, I didn't feel like I was "allowing" anything. I felt like I was doing something. I felt like I was choosing the time of her death. If I had said "no," she would have lived longer. Because I said "yes," she died that afternoon.

  In my bakery, if I decide not to turn on the oven, the bread doesn't bake. But if I decide to turn off the oven while the bread is inside, I am stopping the baking. The ventilator was the oven. My mother was the bread. When we turned it off, the process stopped.

  The clinicians in this room are trained to see the ventilator as an intervention. An extra thing. Something added to nature. So removing it is subtracting the extra thing. It's returning the patient to their natural state.

  But to me, in that moment, the ventilator wasn't an intervention. It was her life. It was the only thing keeping her here. Taking it away felt like taking her life.

  I tell you this not to accuse you. The doctors were compassionate. They followed the law. They followed the ethics. But I want you to understand that the philosophical distinction between "doing" and "allowing" does not erase the psychological weight of agency. When you ask a family to make this choice, you are asking them to carry the burden of causality.

  You might tell me, intellectually, that I didn't kill her. The ALS killed her. But I was the switch. I was the mechanism by which the ALS was allowed to finish its work.

  Some ethicists argue that if the distinction between killing and letting die is morally irrelevant, we should be more honest about that. We should admit that we are choosing death. Others argue that maintaining the distinction is vital for trust in medicine.

  From where I stand, covered in flour instead of scrubs, both sides miss something. It doesn't matter to me whether the distinction is philosophically robust. What matters is that I have to live with the action.

  If you tell me I "allowed" her to die, it sounds passive. It sounds like I stood aside. But I didn't stand aside. I stepped in. I signed the paper. I spoke the words.

  If you tell me I "killed" her, it sounds criminal. It sounds like malice. But there was no malice. There was only love, and exhaustion, and the desire to stop her suffering.

  So where does that leave us?

  I don't know. And I think that uncertainty is what I want to leave you with.

  When you sit with families in these moments, you are navigating more than legal liabilities or ethical frameworks. You are navigating the moral ontology of the people sitting across from you. You are asking them to perform an act that feels, to them, like doing, even if your textbooks say it is allowing.

  I am not asking you to change the law. I am not asking you to stop offering extubation as an option. My mother did not want to live that way. I know that. I believe we did the right thing.

  But I am asking you to recognize that "doing the right thing" does not feel clean. It does not feel like "allowing." It feels like a choice that ends a life.

  When you speak to families, be careful with the word "natural." There is nothing natural about an ICU. When you speak to families, be careful with the word "passive." There is nothing passive about signing a consent form.

  Acknowledge the weight. Don't try to philosophize the guilt away for us. Don't tell us it's just "letting go." Tell us that we are making a hard choice. Tell us that it will feel like doing, even if you call it allowing. Tell us that the burden we feel is real, even if the ethics committee says the distinction protects us.

  I still wake up some mornings wondering if I stopped her breathing. I know the physiology says no. I know the ethics says no. But I know what I felt.

  I make bread for a living. I know that when you take heat away from dough, it doesn't rise. I know that when I make that choice, I am responsible for the result. I don't get to say the oven failed. I chose to turn it off.

  Please don't tell the families who come after me that they are just stepping aside. They are stepping in. They are taking the weight. And if you want them to trust you, don't hide the weight behind words like "withdrawal" or "allowing." Call it what it feels like. A choice. A heavy, terrible, loving choice.

  Thank you.

  ***

  **Note on Philosophical Liberty:**
  The speech takes a significant liberty by conflating the *psychological experience* of moral agency with *moral responsibility* itself. In bioethics, the validity of the doing/allowing distinction usually rests on causality, intent, or normative principles (like the sanctity of life vs. quality of life), not on how the decision-maker *feels* about their agency. By arguing that the family's feeling of "doing" should reshape how clinicians frame the ethical reality, the speech prioritizes phenomenological truth over metaphysical or legal consistency. A strict consequentialist or legalist might argue that validating the family's feeling of "killing" could unnecessarily increase moral distress or confuse the legal safeguards that rely on the distinction being real.

  Summary: The speech argues that while the ethical distinction between killing and letting die may be philosophically debated, the family's lived experience of agency makes the burden feel identical to causing death, requiring clinicians to acknowledge this weight rather than obscuring it with technical language.
