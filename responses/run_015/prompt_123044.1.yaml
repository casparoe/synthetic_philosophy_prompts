answer: |-
  **MEMORANDUM**

  **TO:** National Health Service Steering Committee
  **FROM:** Clinical Nosology Advisory Unit
  **SUBJECT:** Desiderata for a Unified Nosology of Mood, Anxiety, and Personality Presentations
  **CONTEXT:** Single system for Treatment, Gatekeeping, Research, Culture, and Patient Transparency.

  ### Executive Summary

  You have asked for a classification system that treats psychiatric categories as *indifferent kinds* (like quartz) while operating in a domain of *human kinds* (like refugees or criminals), where the classification changes the classified. Ian Hacking's "looping effect" is not a footnote here; it is the operating environment.

  Furthermore, we are operating under three specific constraints of modern information ecology:
  1.  **Pre-emptive Looping:** Patients arrive with self-diagnoses derived from the very criteria we write.
  2.  **Meta-Looping:** Patients and clinicians know the categories are constructed and unstable, and use this knowledge strategically.
  3.  **Differential Volatility:** Some categories will self-erase (destigmatize/dissolve) upon publication; others will self-amplify (offer identity/community).

  Below are the desiderata. I have distinguished between **Non-Negotiable (NN)** requirements for a public health service and **Preferences (P)** which reflect specific theoretical camps.

  ---

  ### Part I: The Desiderata List

  #### 1. Clinical Actionability within 15 Minutes (NN)
  *   **Requirement:** The system must yield a binary or triage decision (Refer/Discharge/Treat) within a standard primary care consultation without requiring psychometric testing.
  *   **Case:** Resource constraints are real. If the system requires a 2-hour assessment to generate a code, it fails the "steer treatment" job.
  *   **Looping Consideration:** Must be robust against *Pre-emptive Looping*. If the criteria are simple enough for a 15-minute decision, they are simple enough for a Google search. The criteria must distinguish between *reporting* symptoms and *exhibiting* pathology in a way that resists "teaching to the test."

  #### 2. Legible Transparency for Patients (NN)
  *   **Requirement:** A patient reading their own record must be able to understand *why* they received the classification without requiring a clinician to translate "code."
  *   **Case:** Ethical mandate for access to records. If the patient cannot understand the label, they cannot consent to treatment or challenge errors.
  *   **Looping Consideration:** This is the engine of *Pre-emptive Looping*. By making criteria legible, you invite the patient to reorganize their self-narrative to fit (or reject) the label. This is not a bug; it is the cost of transparency.

  #### 3. Resource Allocation Thresholds (NN)
  *   **Requirement:** Clear cut-offs for medication, therapy tiers, and disability benefits.
  *   **Case:** A national service requires budgetary control. Dimensional severity alone cannot gate benefits; there must be a line where "distress" becomes "disability."
  *   **Looping Consideration:** Must be resistant to *Gaming*. If the threshold is known (see Legibility), it becomes a target. The system must account for *Meta-Looping*, where applicants argue their case based on the known instability of the criteria.

  #### 4. Cross-Cultural Portability with Local Calibration (NN)
  *   **Requirement:** Core definitions must hold across the nation's demographics, but allow for local "looping modifiers."
  *   **Case:** A diagnosis in Glasgow must mean the same as in Cardiff for research, but the *expression* of distress is culturally shaped.
  *   **Looping Consideration:** Looping is local. A category might self-amplify in one subculture (e.g., online neurodivergent communities) and self-erase in another (e.g., cultures where somatic expression is preferred). A rigid invariant map fails here.

  #### 5. Research Comparability (Stability) (P - Biological/Research Camp)
  *   **Requirement:** Categories must remain stable enough to allow longitudinal multi-site studies.
  *   **Case:** We need to know if Treatment A works for Diagnosis B.
  *   **Looping Consideration:** This is the hardest constraint. If the category loops (changes as people adopt it), the "Diagnosis B" in Year 1 is not "Diagnosis B" in Year 5.
  *   **Adjudication:** This is a **Preference**. Demanding fixed stability in human kinds is a category error. We must accept "stability with known drift" rather than "fixed validity."

  #### 6. Volatility Tagging (P - Hackingian/Systems Camp)
  *   **Requirement:** Each category must be tagged with an expected "half-life" or volatility index (e.g., *High Risk of Self-Amplification* vs. *Likely Self-Erasing*).
  *   **Case:** To manage *Differential Volatility*. If we know a category will expand simply by being published, we must resource it differently than one that will vanish.
  *   **Adjudication:** This is **Non-Negotiable** for planning, though it may be **Preference** for clinical display. The service cannot budget for a moving target without measuring the speed of the movement.

  #### 7. Non-Maleficence Under Disclosure (NN)
  *   **Requirement:** The act of assigning and showing the diagnosis must not predictably worsen the prognosis (nocebo/looping harm).
  *   **Case:** "First, do no harm." If reading "Borderline Personality Disorder" increases self-harm risk via identity adoption, the label is iatrogenic.
  *   **Looping Consideration:** Directly addresses *Self-Amplifying* harmful loops.

  ---

  ### Part II: Adjudications on Contested Requirements

  You asked for specific philosophical disputes to be adjudicated rather than assumed.

  **1. Is "Carves Nature at the Joints / Tracks a Real Mechanism" a requirement?**
  *   **Verdict:** **Prejudice (Biological Camp).**
  *   **Reasoning:** In the context of Hacking's human kinds, there are no fixed joints to carve. The "joints" move when you cut them. Demanding mechanism-first validity (RDoC style) as a *condition for adoption* privileges biological explanations over social/psychological ones without justification. It fails the "15-minute appointment" and "Patient Legibility" tests. A category can be useful and real *in its effects* without tracking a static neural mechanism.

  **2. Is "Patients should be able to recognise themselves in the description" a requirement?**
  *   **Verdict:** **Non-Negotiable.**
  *   **Reasoning:** Given the mandate for patient access to records, opacity is unethical. However, this recognition is precisely what drives *Pre-emptive Looping*. We cannot demand recognition and then complain when patients recognize themselves. We must manage the *consequences* of that recognition, not hide the description.

  **3. Does a classification owe non-maleficence under disclosure?**
  *   **Verdict:** **Non-Negotiable.**
  *   **Reasoning:** If the classification system itself acts as a pathogen (by creating a self-fulfilling prophecy of decline), it violates the core mandate of a health service. This is distinct from the illness being harmful; it is the *label* causing harm.

  **4. Does it need to be resistant to gaming?**
  *   **Verdict:** **Non-Negotiable.**
  *   **Reasoning:** A national service providing disability benefits creates an inherent incentive structure. If the system cannot distinguish between *need* and *strategic presentation* (especially under Meta-Looping where people know the system is soft), it will collapse economically.

  **5. Is tagging categories with expected volatility (half-life) over-engineering?**
  *   **Verdict:** **Non-Negotiable (for Administration/Research).**
  *   **Reasoning:** It is not over-engineering; it is *honest engineering*. If we know "Burnout" is a self-erasing category (dissolves once workplace reforms happen) and "Autism" is self-amplifying (community formation increases identification), budgeting them the same is malpractice. We must label the *epistemic stability* of the label itself.

  ---

  ### Part III: The Incompatible Pairs (The Trade-Offs)

  You asked which pairs of requirements cannot be jointly satisfied once looping is real.

  **1. Full Transparency (Legibility) vs. Predictive Stability (Research Validity)**
  *   **The Tension:** To satisfy **Legibility**, you must publish clear criteria. To satisfy **Research Stability**, the phenotype must remain constant over time.
  *   **The Loop:** Once criteria are legible, *Pre-emptive Looping* begins. Patients adjust behavior to match (or avoid) the criteria. The phenotype changes *because* the criteria were legible.
  *   **What Gives:** **Predictive Stability.** You cannot have a stable target in a system where the arrows talk back. You must sacrifice long-term static validity for short-term clinical utility and ethical transparency. Research protocols must adjust for "cohort drift" rather than assuming fixed categories.

  **2. Cross-Cultural Invariance vs. Sensitivity to Local Looping**
  *   **The Tension:** To satisfy **Invariance**, the criteria must mean the same thing in every clinic. To satisfy **Local Looping**, the criteria must account for how specific communities adopt and reshape the label.
  *   **The Loop:** A category might self-amplify in a university town (high meta-awareness) and self-erase in a rural community (stigma). Enforcing invariance ignores this; enforcing sensitivity breaks comparability.
  *   **What Gives:** **Cross-Cultural Invariance.** You must allow local "looping modifiers." A diagnosis in one region may carry a different volatility tag than in another. Comparability must be statistical (adjusting for local drift) rather than definitional.

  **3. Gatekeeping Precision vs. Non-Maleficence**
  *   **The Tension:** To satisfy **Gatekeeping**, you need sharp cut-offs to deny/award benefits. To satisfy **Non-Maleficence**, you must avoid labels that stigmatize or trap people.
  *   **The Loop:** Sharp cut-offs create "cliff edges" where patients fight to be *in* (for benefits) or *out* (for stigma). This fighting *is* the looping effect that distorts the clinical picture.
  *   **What Gives:** **Gatekeeping Precision.** You must move toward "eligibility bands" rather than binary gates, accepting that this increases administrative burden, to reduce the incentive for strategic self-reorganization.

  ---

  ### Part IV: The Eliminator Requirement

  You asked for the single requirement that knocks out the most usual candidate approaches.

  **The Eliminator:** **"Predictive Stability under Conditions of Full Patient Transparency."**

  If you demand that a classification system remain stable and predictive *even when* the patients have read the criteria, understood them, and are aware of the consequences (Meta-Looping), you eliminate:

  1.  **DSM-5 / ICD-11 (Pragmatic Checklists):** **FAILED.** These rely on the assumption that symptoms are "reported" relatively honestly. They collapse under *Pre-emptive Looping* because the checklists are already public. Patients train to pass. The criteria do not account for their own publicity.
  2.  **RDoC / Mechanism-First (Biological Realism):** **FAILED.** These are not patient-legible. A patient cannot "recognize themselves" in "negative valence system hyper-reactivity." It fails the Transparency and 15-minute utility tests. It also ignores that mechanisms themselves change via neuroplasticity driven by self-concept.
  3.  **HiTOP / Dimensional Models (Severity & Traits):** **FAILED.** While better at capturing nuance, they fail the **Gatekeeping** test. You cannot easily build a disability benefit system around "85th percentile on Internalizing Spectrum." They also struggle with *Volatility Tagging*; a dimension doesn't easily signal "this trait will amplify if labeled."

  **Why this Eliminator wins:** It forces the system to acknowledge that *the map changes the territory*. Any system that assumes the territory is fixed (DSM), invisible (RDoC), or purely continuous (HiTOP) without accounting for the *reactivity of the subject to the measurement* will fail in a high-transparency, high-stakes national service.

  ---

  ### Part V: Scorecard of Current Approaches

  | Approach | Clinical Utility (15m) | Gatekeeping | Research Stability | Cultural Portability | Patient Legibility | **Looping Resistant?** | **Verdict** |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **DSM-5 / ICD-11** | High | High | Medium | Low | High | **No** (Vulnerable to pre-emptive gaming) | **Reject** (Too fragile under transparency) |
  | **RDoC (Mechanism)** | Low | Low | High | Low | **No** (Opaque to patients) | **N/A** (Ignores the patient's view) | **Reject** (Fails ethical transparency) |
  | **HiTOP (Dimensional)** | Medium | **No** (No thresholds) | High | Medium | Medium | **Medium** (Harder to game, hard to use) | **Reject** (Fails resource allocation) |
  | **Proposed Hybrid** | **High** | **High** | **Low*** | **High** | **High** | **Yes** (By design) | **Adopt** |

  *\*Note: Research Stability is sacrificed intentionally. Stability is replaced by "Tracked Volatility."*

  ### Final Recommendation

  Do not seek a "True" classification. Seek a **Reflexive Classification**.

  Adopt a system that includes **Volatility Tags** as metadata for every code. When a clinician assigns a code, the system should display: *"Warning: This category has a high rate of self-amplification in your patient's demographic. Monitor for identity-uptake."*

  This satisfies Non-Maleficence, acknowledges Hacking's Loop, and allows the Service to budget for the fact that some diagnoses are not discoveries, but interventions that create the very population they claim to treat.
