answer: |-
  Here are ten questions designed to press the Difference Principle (DP) without rehashing the basic paradox. They assume your audience is fluent in infinite decision theory and focuses on the structural vulnerabilities of the DP framework.

  ### 1. The Natural-Order Objection
  The Pasadena gamble is generated by a physical coin-flip process that inherently orders outcomes: $n=1, 2, 3 \dots$. In that specific physical order, the expected value series is $1 - 1/2 + 1/3 - 1/4 \dots$, which converges conditionally to $\ln 2$. The Riemann rearrangement theorem only applies if you can arbitrarily reorder terms, but the causal process *fixes* the order. Why does decision theory demand order-independence when the physical mechanism generating the risk is order-dependent? Why isn't $\ln 2$ the authoritative expectation?

  *   **Follow-up:** If you answer that expectation must be invariant under description, aren't you privileging abstract state-space symmetries over the actual causal topology of the gamble? If the physics fixes the order, isn't insisting on order-independence a category error that discards relevant physical information?

  ### 2. Altadena vs. The Void
  We know Altadena (Pasadena + $1) dominates Pasadena. DP handles this because $E[A - P] = 1$. But consider Pasadena vs. the Status Quo (payoff 0). The difference series is just the Pasadena series, which is undefined. Does your framework leave the agent rationally silent between playing Pasadena and taking nothing? If so, you have a completeness problem: an agent who prefers Altadena to Pasadena, but has no preference between Pasadena and $0, seems vulnerable to a money pump if offered a sequence of trades.

  *   **Follow-up:** If you claim DP only generates a partial order, how do you resolve dynamic choice nodes where the partial order is silent but a choice is forced? Do you fall back on a different rule, and if so, doesn't that reintroduce the inconsistency DP was meant to solve?

  ### 3. The Decomposition/Linearity Problem
  This is the strongest technical objection. $E[\text{Altadena} - \text{Pasadena}]$ is exactly 1 computed directly. But if I introduce St. Petersburg ($S$) as an intermediate, $E[A - S]$ diverges to $-\infty$ and $E[S - P]$ diverges to $+\infty$. The direct computation gives 1; the decomposed path gives $\infty - \infty$. What makes the direct pairing authoritative? Why is linearity of expectation suspended here, and what metaphysical fact grounds the "direct" comparison over the "indirect" one?

  *   **Follow-up:** If you say "direct comparison is primitive," aren't you making preference dependent on the *description* of the options rather than the options themselves? If I describe the difference as a single composite gamble, it converges; if I describe it as two sequential gambles, it diverges. How is rationality invariant under description if the math changes based on how I slice the difference?

  ### 4. The Canonical State-Space Problem
  DP requires subtracting outcome $i$ of Gamble A from outcome $i$ of Gamble B. But state spaces are descriptive. I can describe Pasadena using coin flips (H, T, HH...) and Altadena using die rolls (1, 2, 3...). There is no natural bijection between the sample spaces unless we stipulate one. How do you determine the *canonical* alignment of states without arbitrary stipulation? If the alignment is arbitrary, isn't the convergence of the difference series also arbitrary?

  *   **Follow-up:** If you appeal to a "finest grain" physical state space, aren't you committing to a specific mereology of events that decision theory shouldn't dictate? What happens when two agents carve the state space differently but agree on the physical outcomes—do they have different rational obligations?

  ### 5. Completeness and the "Undefined Difference"
  You defend DP because it solves cases where absolute EV is undefined but relative EV is defined. But surely there are pairs where the *difference* also diverges (e.g., two independent Pasadena gambles). In those cases, DP offers no guidance. Given that undefined differences are likely common in infinite horizon scenarios (like longtermism), isn't DP just a patch that fails exactly where we need it most?

  *   **Follow-up:** If you concede DP is incomplete, are you willing to accept that rational agents may have *no* rational preference between two distinct infinite gambles? If so, how do you handle betting scenarios where refusing to choose is itself a choice with a defined (and bad) payoff?

  ### 6. Transitivity and Cycles
  DP defines preference via the sign of the expected difference. But since linearity fails (see Q3), transitivity is threatened. If $E[A-B] > 0$ and $E[B-C] > 0$, does it necessarily follow that $E[A-C] > 0$? If the difference series for $A-C$ diverges while the others converge, you have a cycle where $A \succ B \succ C$ but $A \nsucc C$. Do you accept intransitive preferences in infinite domains?

  *   **Follow-up:** If you accept intransitivity, you open the door to money pumps in dynamic settings. If you reject it, you must impose a constraint that forbids certain comparisons. How do you specify that constraint without simply ruling out the counterexamples by fiat?

  ### 7. Utility Scale Invariance
  Expected utility is invariant under positive affine transformations ($u' = au + b$). Differences are invariant under shifts ($b$), but convergence properties of infinite series can be sensitive to scaling ($a$) if the series is only conditionally convergent. If I change the currency units or the utility scaling factor, could I turn a convergent difference series into a divergent one, thereby toggling whether DP applies?

  *   **Follow-up:** If you say "no, scaling preserves convergence," you're assuming absolute convergence. But if the difference is only conditionally convergent, scaling doesn't break it, but *reordering* does (see Q1). Why is the scale of utility robust while the order of outcomes is not?

  ### 8. Countable Additivity
  Standard probability theory relies on countable additivity. The Pasadena paradox arises because we are summing a countable infinity of terms. Does adopting the Difference Principle require abandoning countable additivity for finite additivity? If you keep countable additivity, how do you justify ignoring the limit behavior of the partial sums that leads to the paradox in the first place?

  *   **Follow-up:** If you move to finite additivity, you lose the ability to handle standard continuous distributions. Are you willing to pay the price of breaking standard Bayesian updating to save the Difference Principle?

  ### 9. The "Kicking the Can" Objection
  Critics argue DP doesn't solve the problem of undefined expectation; it just relocates it. Instead of asking "Is $E[A]$ defined?" we ask "Is $E[A-B]$ defined?" But if the universe contains infinitely many divergent gambles, the set of pairs with well-defined differences might be vanishingly small. Isn't this a solution that works only in toy cases where the problems are perfectly correlated?

  *   **Follow-up:** If you argue that real-world risks are correlated enough for DP to work, aren't you making an empirical claim about the structure of the universe that decision theory shouldn't rely on? What if the universe is "Pasadena-rich"?

  ### 10. Normative Force vs. Mathematical Trick
  Finally, why should we care about the expected value of the *difference*? Mathematically, it's a neat trick to get convergence. Normatively, why does the sum of differences map to rational preference? If my utility function is defined over outcomes, not outcome-deltas, what justifies prioritizing the convergence of the delta-series over the convergence of the utility-series?

  *   **Follow-up:** If you say "because dominance requires it," I'd point out dominance only applies when states are aligned. You are essentially defining rationality as "maximizing expected difference where possible." Isn't that circular? You're defining the solution as the thing that solves the math problem, rather than explaining why the math problem tracks rational choice.
