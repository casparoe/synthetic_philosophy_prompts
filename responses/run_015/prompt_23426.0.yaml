prompt: |-
  I run a small podcast for the rationalist-blog crowd, and next week's guest is a decision theorist who defends the difference principle as the way out of the Pasadena paradox: when a gamble's expected value is undefined because the positive and negative parts each diverge, you should compare it to the alternatives by the expected value of the difference, which is often well definded even when the individual values aren't. I've been reading this literature for years, so skip the Nover and Hájek setup rehash. Draft eight to ten questions that press the actual position. I want at least one on the natural-order sum: the coin-flip process picks out a specific order of outcomes, and in that order the expected-value series is just 1 − 1/2 + 1/3 − 1/4 + …, which sums to ln 2 — so why isnt ln 2 the expected value, and does the Riemann rearrangement point really do any work once the physical process is fixed? One on the Altadena game (Pasadena with a dollar added to every payoff), which beats Pasadena in every possible world, and what his framework says when the difference has an undefined expectation, like comparing Pasadena to simply not playing. And one on the decomposition problem: EV(Altadena − Pasadena) is exactly 1 computed directly, but if you first rewrite the difference as (Altadena − StP) + (StP − Pasadena), one piece is −∞ and the other is +∞, so the answer depends on how you slice it — what makes the direct computation authoritative? For each, give a follow-up keyed to the answer he's most likely to give; he's the type to wave at "assume the difference is well-defined" and I want to make that harder to use.
