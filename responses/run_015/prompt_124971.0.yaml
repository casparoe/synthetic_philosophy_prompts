  8.  **Final Polish:** Ensure the distinction between *aleatory* (chance) and *epistemic* (belief) probability is clear, as this is the heart of the reference class problem. Ensure the distinction between *prediction* (instrumental) and *explanation* (truth) is highlighted.

  *(Self-Correction on "Narrowness")*: The prompt asks if "narrowest class with reliable statistics" smuggles in something false. Yes, it assumes a lattice structure where "narrower" implies "better," but reliability forces you to go "wider." The trade-off is arbitrary without a loss function that values truth over stability.

