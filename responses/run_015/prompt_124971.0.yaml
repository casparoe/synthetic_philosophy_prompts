      *Refining the "More Data" point:* Why would more data make it worse? Because it increases the *resolution* of the reference class lattice. If the true risk is driven by a variable you *don't* have (e.g., a specific genetic mutation not in the dataset), adding more hospitals adds more patients with that mutation distributed differently across your existing covariates, potentially widening the variance between classes rather than narrowing it. It exacerbates the "under-specification" problem.

