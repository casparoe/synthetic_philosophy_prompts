  hey so i'm taking this philosophy elective and we spent like half the period arguing about whether computers can actualy understand language or if they just mix patterns really well. after class me and my friend jake were messing around with a translation bot on his laptop and he fed it this poem that uses some local slang phrase, "a shadow with no wall," which is supposed to mean feeling lonely. the bot translated it into english as "a ghost without a house," which sounds super poetic and fits the vibe of the original. jake says thats proof the bot understands the emotional weight, because there's no direct dictionary match and it had to "get" the metaphor.

  i told him its probably just remixing stuff it saw in training data where shadows and ghosts get paired with sadness, but he got defencive and said if the output makes sense to a human reader then understanding is just whatever produces good results. he even showed me these attention maps that highlight which words the bot looks at when translating, and he thinks thats like evidence its tracking meaning rather than just doing statistics. i feel like there's something wrong with reducing understanding to getting the right answer, but i can't explain what.

  like, is there a real difference between matching patterns and actualy knowing what the words mean? and do those attention maps prove anything about understanding, or are they just a fancy diagram of correlation? i want to know if jake is missing something important about how translation works, especially since this bot doesn't have any real experience of being lonely or having a house.
