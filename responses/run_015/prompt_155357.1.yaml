answer: |-
  Contemporary defences of constitutional monarchy typically rely on functional arguments: a hereditary head of state separates national solidarity from partisan contest, supplies a non-partisan arbiter, guarantees continuity across electoral cycles, and does so cheaply. Yet these defences fail at a specific point: none explains why the office must be filled by inheritance. A figurehead elected for a long non-renewable term, a life-tenure office filled by supermajority, or a head of state selected by lot could apparently perform the same symbolic and unifying work. This project proceeds from the suspicion that what heredity uniquely supplies is not symbolism but a particular structure of incentives around the powers the monarch formally retains and never uses. These reserved powers—assent to legislation, appointment and dismissal of governments, dissolution of the legislature—do their work, if they do any work at all, by not being exercised. However, a power that is never exercised deters only if someone is credibly prepared to exercise it, and in a mature constitutional monarchy exercising it would likely precipitate the crisis that ends the monarchy. The power is thus self-consuming, available only to an agent willing to destroy the standing that makes it available. This proposal turns that observation into an argument centred on whether heredity specifically solves, or merely cosmetically conceals, that credibility problem.

  To proceed rigorously, the project separates three questions often run together. The design question asks whether such an office should exist and be hereditary. The convention question asks what the operative rules about exercising the reserved powers should be. The legitimacy question asks whether a democracy may contain an office filled by birth. This project takes the design question as primary, admitting of a determinate answer based on institutional function rather than symbolic value or abstract right. Existing answers leave this question open because standard debates about deterrence or the legitimation of unelected institutions treat the officeholder as a generic rational agent. A referee on an earlier draft objected that this idea reduces to the question whether any unaccountable power can be justified and has nothing specifically to do with monarchy. That objection is misplaced because it ignores the source of the agent's incentives. An elected figurehead with reserve powers owes their position to a past electoral coalition or a parliamentary supermajority, creating incentives to align with those constituencies or to build a personal mandate. A hereditary monarch owes their position to a dynastic lineage distinct from the constitution itself. The project argues that this distinction alters the credibility calculus: a dynastic agent has a time horizon and a stake in the system's survival that differs structurally from an elected agent, potentially making the threat of using reserve powers more credible without actually using them.

  This account must confront a wrinkle that is fatal if left unhandled: heredity secures an interest in the continuation of a dynasty, not necessarily in the constitution. A monarch could use the reserved powers to protect the monarchy itself against legislation abolishing it, making dynastic self-interest a corrupting rather than a stabilising motive. This project treats this not as a defect but as an unavoidable cost that functions as a feature. The argument will posit that because the dynasty's survival is contingent on the constitutional order that sustains it, dynastic self-interest aligns with constitutional stability up to the point where the constitution threatens the dynasty directly. This alignment creates a stabilising equilibrium where the monarch deters constitutional abuse by others without abusing the constitution themselves, provided the threshold for self-defence is sufficiently high. The empirical baseline for this analysis accepts that in the United Kingdom and the Scandinavian monarchies the head of state formally retains powers that are in practice exercised only on ministerial advice, whereas in Japan the emperor's role is constitutionally defined as symbolic and without powers of government, and that vice-regal representatives in the Commonwealth realms have on rare occasions dismissed governments or refused dissolutions.

  The methodological crux is that by hypothesis, the behaviour that matters is almost entirely absent from the historical record of stable monarchies, because the powers are never in fact exercised. Therefore, no amount of historical narration of stable periods can settle the question. The project recommends an approach combining conceptual work on the difference between a legal power and one that convention has disabled with comparative institutional analysis of non-monarchical offices with analogous reserve powers. This is better than relying on equilibrium modelling alone, which would lack institutional texture, or close analysis of rare cases alone, which would suffer from selection bias. The year will be divided into four stages. The first three months will be dedicated to conceptual groundwork, distinguishing legal capacity from conventional disability and refining the definition of credibility in a self-consuming context. Months four through six will involve comparative analysis of elected presidents in parliamentary systems who retain reserve powers, to test whether the credibility argument holds for non-hereditary agents. Months seven through nine will focus on close analysis of the rare cases in which vice-regal representatives did act, not to generalise from them, but to identify the conditions under which the self-consuming power was actually consumed. The final three months will be reserved for synthesis and writing, integrating the conceptual and comparative findings into a coherent argument about the design question.

  The possible conclusions are threefold. First, heredity uniquely solves the credibility problem, providing a justificatory basis for constitutional monarchy that elected figureheads cannot match. Second, heredity is inferior to election because dynastic self-interest introduces unacceptable risks of constitutional corruption. Third, heredity is irrelevant, because the credibility argument can be reproduced identically for a life-tenure elected figurehead, meaning heredity does no justificatory work. Considerations that would decide between them include whether the incentive structures of dynastic versus elected agents diverge significantly in modelling and whether the historical cases of vice-regal action reveal motives specific to hereditary or delegated authority. An honest account of failure must state that the project fails if the credibility argument can be reproduced identically for a life-tenure elected figurehead, so that heredity turns out to do no justificatory work. This would demonstrate that the defence of monarchy rests on symbolism or tradition rather than institutional design, undermining the core hypothesis. The project would become too large for a single year if it required a full empirical study of all Commonwealth realms or deep historical genealogy of specific dynasties, rather than treating them as institutional cases. By restricting the scope to the logic of incentives and the structural comparison of offices, the project remains feasible while addressing the fundamental puzzle of why heredity persists in contemporary democracies.
