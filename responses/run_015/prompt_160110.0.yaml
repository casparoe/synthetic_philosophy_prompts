answer: |-
  Thanks for laying this out so clearly, it really helps to see the architecture of the disagreement rather than just the final credences. If I have to put a number on it, my own credence in epiphenomenalism about phenomenal consciousness is around 0.25, which puts me slightly closer to your skepticism than your friend's optimism, though I think the logical pull of the position is stronger than most physicalists admit. To get to that figure, I decompose the view much like you did, though I add a fifth term because I think the evolutionary argument carries independent weight that isn't fully captured by the causal closure or knowledge constraints. The first term is what you called non-identity, the claim that phenomenal properties are not identical with any functional or physical property, and I price that at about 0.75 because while physicalism is the default working hypothesis of science, the explanatory gap remains stubborn enough that I cannot rule out property dualism with high confidence. The second term is causal closure, the idea that every physical event has a sufficient physical cause, which I assign a high probability of 0.95 given the overwhelming success of physical explanations in neuroscience and physics, leaving little room for non-physical interference. The third term is causal exclusion, which says that given the first two, the phenomenal property cannot be causally relevant without invoking systematic overdetermination, and I set that at 0.85 because while overdetermination is logically possible, it looks ad hoc and violates principles of parsimony. The fourth term is the one you flagged as the paradox of phenomenal judgment, specifically whether knowledge survives without causation, and here I am much stingier, assigning it only 0.45 because the lack of counterfactual dependence seems to undermine the reliability required for knowledge. The fifth term I added is evolutionary plausibility, asking why such metabolically expensive states would exist if they do nothing, which I price at 0.9 since spandrels and exaptations are common enough in biology that useless traits aren't fatal to a theory.

  I combine these not by a strict multiplication rule since they aren't fully independent, but by treating them as a chain of necessary conditions where the weakest link drags down the whole, so the low score on the knowledge paradox term acts as the primary bottleneck that keeps my final number down near 0.25. The single term my answer is most sensitive to is definitely the fourth one regarding the paradox of judgment, because if you can show that knowledge does not require causal contact but only informational covariation, the credence jumps significantly toward your friend's 0.6, whereas if you hold that causal contact is necessary for knowledge, the view collapses entirely. The term I am least confident about is the first one, non-identity, because it relies on introspective intuition about the hard problem which could be dissolved by a future conceptual shift or a successful reductionist theory of consciousness that we haven't conceived of yet. What would move that term, and consequently the whole view, would be an empirical finding that demonstrates a causal anomaly in the neural correlates of consciousness, such as a neurofeedback loop where the reported timing of a decision depends on phenomenal properties in a way that cannot be explained by prior neural states, which would violate causal closure and force us to abandon epiphenomenalism for interactionism or abandon the non-identity claim altogether.

  Regarding the specific move you mentioned, tracking without causation, I think your intuition on the permutation test is sharper than your friend's reliability defense. The shadow analogy works for information but fails for knowledge because knowledge seems to require that if the fact were different, the belief would be different, yet in the epiphenomenalist picture, if you swap the qualia while holding the physical base fixed, the belief remains identical, which means the belief is not sensitive to the truth of the phenomenal state. Your friend is arguing for a form of actual-world reliability that ignores nearby possible worlds, but most epistemologists agree that safety or sensitivity across counterfactuals is required to rule out lucky true beliefs, and the permutation test shows exactly that kind of luck. This is why I kept the probability on the knowledge survival term so low, because while the tracking argument is clever, it asks us to accept a notion of knowledge that is disconnected from the truth-maker in a way that feels like it saws off the branch we are standing on.

  I suspect the gap between your 0.3 and your friend's 0.6 lives almost entirely in that fourth term about the paradox of judgment. Your friend likely believes that the informational link provided by the common physical base is sufficient for justification, effectively treating the phenomenal state as a logical consequence of the physical state that we can infer rather than a cause we detect, whereas you are holding out for a stronger causal constraint on knowledge that the permutation test violates. They might also be weighting the first term, non-identity, higher than you are, perhaps because they are more convinced by conceivability arguments than by physicalist intuitions, but since they specifically pointed to the paradox as the source of your hesitation, the disagreement is primarily epistemological rather than metaphysical. If you could convince them that the permutation test demonstrates a failure of sensitivity that is fatal for knowledge claims, their credence should drop toward yours, but if they can convince you that knowledge is merely actual-world reliability of the reporting mechanism, your credence should rise toward theirs, though I think the cost of accepting that definition of knowledge is too high to justify the view.
