answer: |-
  **Persistence in the Vault: A Test for Temporal Ontology**

  The dispute between endurantism and perdurantism concerns how objects persist through time. **Endurantism** holds that objects are wholly present at each moment of their existence. When you see a tree today and again tomorrow, you are encountering the entire object on both occasions; it endure through time by being fully present at every instant. **Perdurantism**, by contrast, holds that objects are extended in time much like they are extended in space. Just as a road has spatial parts (miles), a persisting object has **temporal parts** (stages). You never encounter the whole object at once; you only encounter the temporal slice existing now. The whole object is a "spacetime worm" composed of these slices.

  This essay tests these ontologies against two specific cases: The Vault and The Copy. I will argue that while standard criteria of identity can be adopted by both views, the metaphysics of the interval itself discriminates between them. The cases tip the debate in favour of endurantism, provided we accept that existence does not require internal activity.

  **The Cases and The Worry**

  In **Case One (The Vault)**, a desiccated animal is sealed in a constant environment for forty years. By stipulation, there is zero metabolism, no chemical turnover, and no internal causal traffic. It is a static arrangement of matter. Upon rehydration, it resumes life with its old dispositions and injuries. The strong intuition is that the resumer is the original animal, and that it existed throughout the forty years.

  In **Case Two (The Copy)**, the original is destroyed immediately. A duplicate is assembled from a record during the forty years and sits in a second vault. It is then rehydrated. The intuition here is that the resumer is *not* the original animal.

  The metaphysical worry concerns the forty-year interval in The Vault. If nothing happens internally—no events, no changes, no causal processes—what grounds the claim that the animal exists during this time? The arrangement is preserved, but preservation is passive. In The Copy, the arrangement is also preserved (in the record and the duplicate body), yet we deny identity. The difference seems to be merely external causal machinery (the vault protecting the original vs. the assembler building the copy). If a stretch of time in which literally nothing happens contributes nothing to reality, then the animal's existence during the interval in The Vault is an **idle posit**: a claim that something exists which makes no difference to the world and involves no activity.

  **Discriminating the Views**

  A common objection is that these cases do not discriminate between endurantism and perdurantism because both can adopt the same criterion of **diachronic identity** (what makes an object at time *t1* the same as an object at *t2*). Both might agree that identity requires continuity of biological organisation or immanent causation. If the criteria are the same, the ontology seems orthogonal.

  This objection fails because ontology constrains what *kind* of thing must satisfy the criteria. For the perdurantist, the object is the sum of its temporal parts. If the animal exists during the forty years, there must be a temporal part corresponding to that interval. But a temporal part is typically understood as a stage of events or processes. If the interval contains no events, no changes, and no causal traffic, it is unclear what constitutes this temporal part. It is a slice of spacetime containing matter, but if the object is defined by its life processes, a process-less slice is a contradiction. The perdurantist worm has a hole in it, or a segment made of nothing but static matter.

  The endurantist faces less strain here. For the endurantist, the object is a substance that bears properties. To exist during the interval is simply to be wholly present and bear the property of "being desiccated." No internal events are required to constitute the object's presence, only the presence of the substance itself. Therefore, while both views can stipulate a criterion of identity, the perdurantist pays a higher metaphysical price to satisfy it in cases of total stasis. The cases discriminate because they reveal that perdurantism ties existence at a time too closely to temporal extension composed of events, whereas endurantism ties it to substance presence.

  **Intermittent Existence and Asymmetry**

  One solution to the "idle posit" worry is to deny the datum: hold that the animal simply does not exist during the forty years. It ceases to exist when drying out and comes back into existence when wetted. This is **intermittent existence**.

  Is this option cheaper for one view? It is significantly cheaper for the endurantist. An enduring substance can logically go out of existence and return, provided the right causal conditions are met upon return. It is a single substance with a gappy history. For the perdurantist, intermittent existence is problematic. If an object is a spacetime worm, a gap in existence means the worm is literally broken into two distinct worms. To say they are the same object requires a further relation (like a counterpart relation) linking the two worms, which effectively abandons strict identity for the whole object. Thus, if we accept the "idle posit" worry and deny existence during the gap, endurantism handles the reconstruction of identity more naturally.

  However, most intuitions favour continuous existence in The Vault. This brings us to the asymmetry of stasis. For the perdurantist, an object exists at a time only by having a temporal part then. A period of total stasis is a temporal part with no internal differentiation. It is a "frozen" slice. For the endurantist, there is no automatic link between existence and temporal parts; the object may be wholly present at every moment without those moments involving change.

  Is this a merit for endurantism? Yes. It allows for the possibility of existence without activity. The charge that the animal is an "idle posit" assumes that existence requires verification through change. But if existence is fundamental, a thing can simply *be*. The perdurantist, by chopping objects into time-slices, makes existence dependent on the content of those slices. If the content is null (no events), the slice is metaphysically suspect. The endurantist allows the object to "wait" through the interval without needing to fill the time with parts. Therefore, endurantism is better placed to accommodate the intuition that the animal exists throughout the gap while doing nothing, without treating that existence as a fiction.

  **Verdict**

  Do these cases decide the debate? They do not settle it absolutely, but they tip it. They demonstrate that perdurantism struggles to accommodate static persistence without resorting to controversial claims about empty temporal parts or gappy worms. Endurantism accommodates the intuition of The Vault more smoothly by treating the object as a continuant substance that can bear static properties over time.

  Therefore, I endorse endurantism based on these cases. The Vault shows that our concept of persistence allows for periods of inactivity where the object remains wholly present. Perdurantism forces us to view this inactivity as a composition of static stages, which adds ontological clutter without explanatory gain. The Copy case reinforces this by showing that causal history matters, but The Vault shows that causal *activity* during the interval does not. Endurantism captures this distinction: the substance persists (Vault) because it is the same matter/substance, whereas the copy fails because the substance was destroyed. Perdurantism obscures this by focusing on the continuity of stages, which looks suspiciously similar in both cases if the stages are static.

  **The Strongest Objection**

  The strongest objection to this conclusion comes from physics, specifically Special Relativity. Relativity theory suggests that simultaneity is relative to a frame of reference. If there is no absolute "now," then the idea of an object being "wholly present" at a moment becomes incoherent, because different observers will disagree on which temporal parts are simultaneous. Endurantism seems to require a privileged present moment to define when the whole object exists. Perdurantism, treating time as a dimension like space, fits naturally with relativity. If relativity is true, endurantism may be metaphysically impossible, regardless of how well it handles The Vault. I must admit this is a serious cost. If forced to choose between accommodating the intuition of The Vault and accommodating established physics, physics should win. However, within the scope of metaphysical analysis of persistence itself, endurantism provides the superior account of static identity.

  **Changing My Mind**

  If The Vault and The Copy do not decide the question absolutely, what would? I would change my mind if presented with a case where causal continuity is maintained but intuition denies identity, or vice versa, in a way that specifically targets temporal parts. For instance, if we could conceive of a scenario where an object's temporal parts are shuffled (like a deck of cards) but the object persists, perdurantism would be favoured because it treats parts as modular. Conversely, if it were shown that quantum entanglement requires objects to be wholly present across space-like separated regions to maintain identity, endurantism would be confirmed. Until then, the metaphysical simplicity of enduring substance in the face of stasis remains the stronger position.
