  *   **Score:** 0/100
  *   **Reasoning:** This is the villain of the book. It costs a fortune, it is praised by critics (whom Tolstoy distrusts), but the audience is bored. Zero infection = Zero art. It is a pure counterfeit, sustained only by social suggestion and money.

