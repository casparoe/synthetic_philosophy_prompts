prompt: |-
  You're a professional philosopher who specializes in aesthetics and has actually taught Tolstoy's *What Is Art?* to grad seminars more than once — you know the infection criterion, the sincerity bit, the four markers of bad art (borrowing, imitation, effectfulness, diversion), the stuff about obscurity and accessibility, and the later chapters where he starts talking about religious perception and art that unites people. Please brainstorm a bit before you commit to anything: work out which of Tolstoy's tests you're going to use and how they interact, and only then give me numbers. I'd much rather see you reason first than get a tidy list.

  Here's the situation. Me and my friend Sam where up till 2am arguing about this book and we got nowhere, because I think Tolstoy is running two tests that he never properly separates — the infection test (does it transmit a feeling the artist actually had?) and a content test (does the feeling transmitted belong to the kind that unites people / expresses religious perception, as opposed to being sectarian, cynical, or just nasty). Sam says no, infection is the whole story, the content stuff is just Tolstoy's own Christian hobbyhorse bolted on at the end and doesn't belong in the theory of what makes something *art* or good art. We agreed on almost nothing except that Beethoven gets a raw deal.

  So I made up a list of hypothetical works to settle it, and we disagreed about the ordering on nearly all of them. Please rank them from best art to worst art by Tolstoy's actual lights, and give each one a score out of 100 (100 = top tier of what he'd hold up as good art, 0 = the stuff he wants to throw out). The works:

  1. A lullaby a grandmother made up for her own kids and hums at bedtime. Anyone who hears it, including adults who don't speak her language, is infected with a calm, safe tenderness. It's never been written down, performed, or titled.
  2. An ad jingle for dish soap, written by a committee of copywriters whose only shared feeling was a mildly fake cheerfulness. It's extremely catchy and it genuinely does put listeners in a good mood.
  3. A forty-million-dollar opera. Six years of work, unanimously called a masterpiece by critics, and every single person in the audience is bored and feels nothing.
  4. A punk song by someone in real despair — technically crude, screamed, totally sincere. It infects listeners with self-loathing plus contempt for the weak, and afterwards a lot of them report feeling, weirdly, more alive and less alone.
  5. A hymn generated by a machine. No human felt anything in the making of it. The congregation sings it, weeps, and comes away with a real feeling of brotherhood with each other. They don't know how it was made, and if they found out the feeling would evaporate.
  6. A poem in a deliberately obscure symbolist style, full of allusion, that moves maybe two hundred people in the world to tears — but only after years of training. Everyone else finds it baffling.
  7. A documentary about factory conditions: deeply sincere, one-sided, and it leaves viewers with guilt and an immediate urge to change the law.
  8. A novel that infects only members of a tiny subculture with an intense feeling of solidarity with each other and superiority over outsiders. To everyone else it's completely inert.

  Then a few things on top of the ranking, so I can win the rematch:

  - For each work, say whether the ordering you gave depends on the content test, i.e. whether it would move up or down if you dropped the religious-perception / uniting-people requirement and ranked purely on infection and sincerity. Which three are most sensitive to that?
  - Which case, if any, forces me and Sam to disagree about something other than words — i.e. where there's a real difference in verdict and not just a difference in how we describe it?
  - Give me a confidence score out of 100 next to each of your eight: how sure are you that Tolstoy's own text settles that case. I expect at least two of them to be genuinely underdetermined and I want to know which.
  - Finally: if you had to drop one of the two tests to make the book cohere, which one goes, and what does Tolstoy lose by giving it up?
