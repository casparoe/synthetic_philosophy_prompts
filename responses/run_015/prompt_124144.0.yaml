      To navigate the landscape of whether dreams are experiences without relying on the traditional dichotomy between Norman Malcolm and Daniel Dennett, one must traverse a taxonomy built upon four diagnostic questions that reveal the underlying commitments of any given position. The first branch of this tree asks whether there is a criterion, available either in first-person report or in third-person observation, that distinguishes being awake and undergoing an experience from being asleep and lacking one, such that sleep's failure to satisfy this criterion undermines the claim that dreams are experiences. If one answers affirmatively, holding that the logical grammar of experience requires wakeful verification, one arrives at Malcolm's skeptical view that sleep lacks the necessary criterion, rendering dream reports not false descriptions of a private state but meaningless utterances that mimic the form of experience without the substance. If one denies that sleep fails this criterion, the taxonomy proceeds to the second question, which asks whether a waking report of a vivid dream scene provides direct retrospective evidence of a prior phenomenal state, or whether it only records a belief or narrative constructed at the moment of awakening. Answering that the report is merely a construction leads to Dennett's account that dream reports are constructed upon awakening like a loaded cassette, a position often bolstered by the third diagnostic question regarding whether the neurophysiological overlap between REM sleep and waking consciousness supports the continuity of experience, or is equally compatible with an offline simulation that generates representations without any accompanying phenomenal presence. Dennett's view aligns with the simulation interpretation, suggesting that the brain activates sensory cortices without generating the phenomenal presence required for genuine experience, thereby treating the dream as a post-hoc fiction rather than a prior reality. However, a logically available but rarely defended intermediate stance occupies the space where one accepts the neurophysiological overlap as supporting the continuity of experience yet maintains that waking reports are constructed narratives due to rapid memory decay rather than the absence of the experience itself, creating a realist ontology with a skeptical epistemology where dreams are real events that are systematically misreported rather than non-existent events that are fabricated. Moving further down the branch where reports are accepted as direct evidence, the fourth question arises regarding whether lucid dreaming, in which the sleeper exercises apparent voluntary attention and self-reference, demonstrates that experience can occur during sleep, or can be explained as a localized partial awakening that imports waking criteria without establishing that ordinary REM involves experience. Those who argue that lucid dreaming proves experience only for the lucid episode while denying it for ordinary REM adopt a hybrid view that grants phenomenal presence only during lucid episodes but denies it in non-lucid REM, effectively bifurcating sleep into two ontological categories based on metacognitive capacity. In contrast, the standard realist combines affirmative answers to the continuity of neurophysiology, the directness of reports, and the validity of lucid dreaming as evidence for ordinary dreaming, asserting a full continuity of consciousness across the wake-sleep boundary. Distinct from this realism is a view that accepts experiential content during sleep but denies it belongs to a unified subject or self, suggesting that while qualia and narratives occur, they float free of the ownership that defines waking subjectivity, thereby answering the criterion and report questions positively while modifying the nature of the subject involved. Several combinations of these answers remain unoccupied, such as the position where the criterion for experience is failed during sleep yet waking reports are accepted as direct evidence, a gap due to incoherence since one cannot have direct evidence of a state that is logically excluded by the criterion. Another empty space involves accepting the neurophysiological data as mere offline simulation while simultaneously arguing that lucid dreaming proves ordinary dreaming involves experience, a gap due to unattractiveness because it requires positing a phenomenal miracle amidst physical redundancy. Finally, the combination where reports are constructed but neurophysiology supports continuity is largely a space of neglect, as theorists typically align the reliability of the report with the interpretation of the brain data, rarely separating the trust in the scan from the trust in the sleeper's memory. By tracing these branches through the four diagnostic questions, one can locate any specific theory within this multidimensional space, revealing that the debate is not merely between skepticism and realism but involves nuanced disagreements about criteria, evidence, physiology, and the nature of selfhood.

