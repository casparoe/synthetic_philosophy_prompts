answer: |-
  This is a sophisticated observation that cuts to the core of how normative systems function in non-state contexts. You have identified a gap between the *justificatory language* of open-source governance (legalistic, universalist, rationalist) and its *enforcement mechanism* (social, particularist, sentiment-based).

  To answer this precisely, I will proceed in four steps:
  1.  **Conceptual Mapping:** Distinguish between the *form* of the norms and the *force* of the norms.
  2.  **Reconstruction:** Articulate the implicit theory of moral change required to make this system coherent.
  3.  **Critical Tension:** Analyze the friction between the stated rationale and the operational reality.
  4.  **Falsification:** Identify the specific empirical or logical condition that would undermine this reconstruction.

  ### 1. Conceptual Mapping: Form vs. Force

  To analyze the implicit theory, we must first distinguish two layers of the institutional design you described.

  **Layer A: The Deontological Façade (The Code of Conduct)**
  *   **Structure:** Rule-based, universalizing, explicit.
  *   **Language:** Appeals to "rights," "harm," "safety," and "fairness."
  *   **Implicit Agent Model:** Assumes contributors are rational agents who comply because they recognize the validity of the rule (a Kantian or Habermasian model).
  *   **Function:** Legitimation. It provides a public vocabulary that translates personal conflicts into normative violations.

  **Layer B: The Prestige Economy (The Enforcement)**
  *   **Structure:** Network-based, informal, implicit.
  *   **Language:** Appeals to "professionalism," "community fit," and "toxicity."
  *   **Implicit Agent Model:** Assumes contributors are social agents who comply to maintain status, access, and reputation (a Humean or Smithian model).
  *   **Function:** Coordination. It leverages the scarcity of social capital to police behavior where legal capital is absent.

  **The Philosophical Problem:**
  If Layer A were the true engine of change, enforcement would look like arbitration or education (correcting the reasoning). If Layer B were the true engine, Layer A would be unnecessary (social cues would suffice). The existence of *both* suggests a hybrid theory of change that is rarely articulated.

  ### 2. Reconstructing the Implicit Theory of Moral Change

  The governance model you describe presupposes a specific synthesis of moral psychology and social ontology. It does not strictly presuppose that norms change through rational argument, nor solely through material incentive. Instead, it presupposes what we might call **Codified Honor Theory.**

  This theory relies on three specific commitments:

  **Commitment 1: Norms require codification to become "public facts."**
  The system presupposes that informal social disapproval is insufficient for moral change because it is too ambiguous. By writing a Code of Conduct (CoC), the community transforms subjective annoyance into an objective standard. This aligns with **John Searle's** theory of institutional facts: the CoC creates a "status function" where certain behaviors count as "violations" only because the community collectively accepts that definition.
  *   *Necessity:* This is strictly presupposed. Without the text, ostracism looks like bullying. With the text, ostracism looks like justice.

  **Commitment 2: Compliance is driven by the desire for social standing, not moral insight.**
  The system presupposes that contributors will not change behavior merely because an argument is sound. They change because the cost of violating the norm is a loss of "honor" (reputation, commit access, speaking invitations). This aligns closely with **Kwame Anthony Appiah's** account in *The Honor Code*. Appiah argues that moral revolutions (like the end of dueling or foot-binding) occur not when people are persuaded the practice is wrong, but when it becomes *dishonorable*.
  *   *Necessity:* This is the operational engine. If contributors were indifferent to reputation, the CoC would be toothless.

  **Commitment 3: Rational discourse is a tool for defining honor, not enforcing it.**
  The system presupposes that abstract moral principles (fairness, harm) are necessary to *define* what counts as honorable, but they are not the *mechanism* of enforcement. The rhetoric of rationality legitimizes the shame mechanism.
  *   *Necessity:* This bridges the gap. It explains why we use moral language (to define the honor code) even if we use social sanctions (to enforce it).

  **Summary of the Implicit Theory:**
  The design presupposes that moral change in distributed, voluntary networks occurs when **universalist principles are successfully mapped onto local prestige dynamics.** It assumes agents are *status-seeking rationalists*: they want to be seen as good (status) and need a definition of good (rational principle) to aim for.

  ### 3. Internal Tensions and Underdetermination

  While the reconstruction above explains the system's efficacy, it reveals significant philosophical tensions.

  **Tension 1: The Rationalist Mask**
  The system suffers from a legitimacy gap. Public discourse insists on the *Rationalist* model ("We banned you because you violated the principle of inclusivity"). However, the *Honor* model is what actually functions ("We banned you because you made the maintainers look bad and scared off contributors").
  *   *The Risk:* If the community admits the Honor model, the CoC looks like a tool for power consolidation by maintainers. If they insist on the Rationalist model, they cannot explain why "apologies" or "social rehabilitation" often matter more than logical consistency in reinstating a banned user. The system requires the Rationalist Mask to remain in place to function ethically, even if the Honor Engine is what makes it work practically.

  **Tension 2: Universalism vs. Particularism**
  CoCs use universal language ("Harassment is wrong *everywhere*"). However, enforcement is deeply particular (dependent on the specific maintainer's tolerance and the violator's status).
  *   *The Risk:* This creates a "rule of men, not laws" problem. A high-status contributor might violate the CoC with impunity (honor shields them), while a low-status contributor is ostracized for a minor infraction (dishonor amplifies it). The implicit theory assumes the prestige economy is meritocratic; if it is not, the moral legitimacy of the CoC collapses.

  **Underdetermination: Rival Theories**
  It is important to note where the design is *underdetermined*, meaning rival theories could license the same institutional form:
  *   **The Educational View:** A strict Rationalist could argue that shame is merely a pedagogical tool to force agents to listen to reason. On this view, the CoC *does* presuppose rational change, and shame is just a temporary scaffold.
  *   **The Market View:** A Materialist could argue that reputation is simply "social capital." The CoC is a contract protecting the value of that capital. On this view, there is no "moral change," only incentive alignment.

  The current design accommodates both, but its *efficacy* relies on the Honor Theory. If contributors truly believed only in the Educational View, they would not leave when shamed; they would stay and debate. If they believed only in the Market View, they would leave only if financial loss occurred. The fact that they leave due to *social* exclusion confirms the Honor Theory.

  ### 4. Falsification Conditions: What Would Change My Mind

  As a philosopher, I must identify where my reconstruction is vulnerable. My claim is that this governance model *presupposes* that norms shift primarily through dynamics of honor and shame, legitimized by rationalist rhetoric.

  **The Vulnerable Step:**
  My argument rests on the causal claim that **social sanction (shame/ostracism) is the primary driver of compliance**, rather than **internalized agreement (rational persuasion).** I am assuming the "force" comes from the network, not the text.

  **Evidence That Would Change My Mind:**
  I would have to abandon the "Codified Honor" reconstruction if empirical observation of OSS governance demonstrated either of the following:

  1.  **High-Compliance without Social Cost:** If data showed that contributors consistently altered behavior *immediately* upon the publication of a CoC update, *prior* to any enforcement actions or social signaling. This would suggest the *text itself* (the rational argument) carries normative force independent of the prestige economy. Currently, CoCs are often ignored until a controversy forces enforcement. If they were obeyed prophylactically purely due to the authority of the text, my reliance on the Honor/Shame mechanism would be overstated.
  2.  **Status-Immunity:** If high-status maintainers were routinely sanctioned for CoC violations *at the same rate* as low-status contributors, and accepted these sanctions without loss of community standing. This would prove that the *rule* (Rationalist/Legalist model) has superseded the *reputation* (Honor model). Currently, "benevolent dictators" often survive violations that would get a novice banned. If this pattern reversed, it would indicate the system has successfully transitioned from an Honor culture to a Rule-of-Law culture.

  **Conclusion:**
  Until such evidence exists, the open-source governance model must be understood as a **modernized Honor Culture.** It uses the vocabulary of liberal legalism to define the boundaries of honor, but it relies on the ancient mechanics of shame and status to police them. It presupposes that in the absence of state power, moral norms only stick when they are tied to the social survival of the agent.
