answer: |-
  You have identified one of the most fundamental fault lines in the foundations of mathematics. Your intuition is correct: the step you are isolating is distinct from general proof by contradiction, and there is a rich vocabulary and philosophical landscape dedicated to exactly this distinction.

  Here is the breakdown of the terminology, the critique, and the intermediate positions you are asking about.

  ### 1. The Name of the Logical Step

  The specific move from "it is not the case that $P$ is false" ($\neg\neg P$) to "$P$ is true" ($P$) is called **Double Negation Elimination (DNE)**.

  In the context of your example (the $\sqrt{2}^{\sqrt{2}}$ proof), the argument relies on the **Law of Excluded Middle (LEM)**, which states that for any proposition $P$, either $P$ is true or $\neg P$ is true ($P \lor \neg P$). In classical logic, LEM and DNE are inter-derivable. The proof proceeds by saying: "Either $\sqrt{2}^{\sqrt{2}}$ is rational ($P$) or it is not ($\neg P$)." It then shows that in either case, the existence claim holds.

  Because the proof establishes existence without providing a method to identify *which* case is true, it is standardly classified as a **Non-constructive Existence Proof**.

  ### 2. The "Fallacy" of Treating the Step as Costless

  You asked if there is a name for the practice of treating this step as costless in contexts where it is not.

  In classical mathematics, this is not considered a fallacy; it is a standard rule of inference. However, in frameworks that require algorithmic content (computer science, constructive mathematics), relying on DNE/LEM for existence claims is often criticized as **impredicative** (though strictly speaking, impredicativity is slightly different) or simply **non-constructive**.

  There is no single Latin name for the "fallacy" (like *ad hominem*), because it is not an error in reasoning *within classical logic*. Rather, it is a **category error** regarding the nature of mathematical truth.

  *   **The Philosophical Stance:** Treating this step as costless assumes **Mathematical Realism** (or Platonism). This is the view that mathematical objects exist independently of our ability to construct or identify them. Therefore, proving that "non-existence is impossible" is sufficient to guarantee existence, because the object is "out there" waiting to be found, regardless of whether we have a map to it.
  *   **The Constructive Critique:** From a **Constructivist** or **Intuitionist** perspective (pioneered by L.E.J. Brouwer and formalized by Arend Heyting), truth is identified with *provability* or *constructibility*. To say "there exists an $x$" means "I can produce an $x$." To say "it is impossible that no such $x$ exists" ($\neg\neg \exists x$) is weaker than "I can produce an $x$" ($\exists x$). Treating them as equivalent is sometimes called **assuming classical logic in a constructive context**.

  ### 3. Intermediate Positions and Boundaries

  You asked about principled intermediate positions—views where the step is legitimate for some statements but not others. This is where modern logic becomes very precise. There are three major ways this boundary is drawn:

  #### A. Markov's Principle (The Russian School)
  This is the most direct answer to your question about intermediate views on Double Negation Elimination.
  Andrei Markov Jr. and the Russian school of constructive mathematics accepted a principle that strict intuitionists reject:
  $$ \neg\neg \exists n \in \mathbb{N} \, P(n) \implies \exists n \in \mathbb{N} \, P(n) $$
  *(Provided $P(n)$ is a decidable property, like checking if a number is rational.)*

  **The Rationale:** If it is contradictory for a solution *not* to exist, then a systematic search for the solution must eventually terminate. Therefore, we are justified in claiming the solution exists, even if we don't know *when* the search will stop.
  **The Boundary:** This principle is accepted in "Recursive Mathematics" but rejected by "Bishop-style Constructivism" and Intuitionism. It allows DNE for simple existence claims over natural numbers, but not for more complex objects (like functions or sets).

  #### B. The Arithmetical Hierarchy ($\Sigma_1$ vs. $\Pi_2$)
  In **Reverse Mathematics** and **Proof Theory**, logicians classify statements by their quantifier complexity.
  *   **$\Sigma_1$ statements:** These are of the form "There exists an $n$ such that [decidable condition]." ($\exists n, P(n)$).
  *   **$\Pi_2$ statements:** These are of the form "For all $n$, there exists an $m$..." ($\forall n \exists m, P(n,m)$).

  **The Boundary:** Classical and constructive logic often agree on $\Sigma_1$ statements *if* you have a bound. However, without a bound, classical logic allows you to prove $\exists n, P(n)$ by contradiction. Constructive logic does not.
  Some intermediate systems (like **$ACA_0$** in Reverse Mathematics) allow classical reasoning for arithmetic sets but restrict set formation. Others (like **$WKL_0$**) allow a weak form of compactness that proves many existence theorems (like the Intermediate Value Theorem) without allowing full Double Negation Elimination for all statements.

  #### C. Predicativism
  **Predicativism** (associated with Hermann Weyl and Solomon Feferman) draws the line not just at logic, but at *definition*.
  **The Rationale:** You cannot define an object by quantifying over a totality that includes the object itself.
  **The Boundary:** Predicativists often reject proofs that rely on the "completeness" of the set of all real numbers (which requires impredicative definitions). They might accept the $\sqrt{2}^{\sqrt{2}}$ argument if it can be framed within arithmetic, but would reject existence proofs for real numbers that rely on the totality of all subsets of natural numbers.

  ### Summary of Terminology

  | Concept | Classical View | Constructive/Intermediate View |
  | :--- | :--- | :--- |
  | **The Logical Step** | **Double Negation Elimination** (or Law of Excluded Middle) | Not universally valid; requires justification. |
  | **The Proof Type** | Valid Existence Proof | **Non-constructive Existence Proof** |
  | **The Assumption** | **Mathematical Realism / Platonism** (Truth exists independently of knowledge) | **Constructivism** (Truth is identical to verification/construction) |
  | **Intermediate Rule** | N/A (All or nothing) | **Markov's Principle** (Allows $\neg\neg\exists \to \exists$ for decidable properties) |
  | **Systematic Study** | ZFC Set Theory | **Reverse Mathematics** (Classifying theorems by the axioms required) |

  ### A Note on Your Example
  It is worth noting that the specific example you cited ($\sqrt{2}^{\sqrt{2}}$) is historically famous precisely because it was *originally* a non-constructive proof. However, in 1934, the Gelfond-Schneider theorem proved that $\sqrt{2}^{\sqrt{2}}$ is transcendental (and therefore irrational).

  This means we now *do* have a constructive proof: we know specifically that the second case ($a = \sqrt{2}^{\sqrt{2}}, b = \sqrt{2}$) is the one that works. However, the *logical structure* of the original argument remains the canonical textbook example of a proof that relies on the **Law of Excluded Middle** to bypass the need for specific identification.

  ### Conclusion
  The step is **Double Negation Elimination**. The practice of using it for existence claims is **Non-constructive Reasoning**. The philosophical assumption that makes it "costless" is **Platonism**. The most prominent intermediate position that allows this step for simple existence claims but not complex ones is **Markov's Principle**, and the field that maps the boundaries of where this step is required is **Reverse Mathematics**.
