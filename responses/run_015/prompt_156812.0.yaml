          *   **Adaptation:** Trait shaped by natural selection for its current function.
          *   **Spandrel (Byproduct):** Trait arising from constraints/development, not directly selected for *originally*.
          *   **Exaptation:** Trait co-opted for a new use (can be former adaptation or former spandrel).
          *   **Current Utility vs. Historical Origin:** Crucial distinction.

      *   *Refining the "Knockout Test" critique:* If I knock out the chin and fitness drops, it proves the chin is *useful* now. It does *not* prove it was *selected for* originally. (Example: Belly buttons. Knock it out (surgery), maybe infection risk rises slightly, but it's definitely a spandrel of viviparity). This is the killer argument against their test.

      *   *Refining the Chin:* Mention the "resorption" theory vs. "sexual selection" theory. Mention that G&L used the chin as an example of a trait often assumed adaptive but likely structural.

