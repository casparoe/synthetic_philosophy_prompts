      *   Missing: Sophisticated Substantivalism, Metric Field ontology.

  6.  **Final Review of the "Hole Argument" bit:** Maya says: "the hole argument actually presupposes that spacetime points are real individuals — if they weren't, there'd be no 'hole' to permute fields across. So she said the hole argument supports substantivalism if you read it right."
      *   Critique: The Hole Argument shows that *if* you believe points are real individuals (Substantivalism), *then* you get indeterminism. Most philosophers take this as a reason to *reject* Substantivalism (or adopt Leibniz Equivalence). Maya is claiming that because the argument *requires* the assumption to get off the ground, the argument *validates* the assumption. That's a logical error. The argument is a *reductio ad absurdum*. I need to make sure this is clear.

