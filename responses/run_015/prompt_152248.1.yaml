      *   **Mechanism:** Bad habits (dying metaphors, verbal false limbs, pretentious diction, meaningless words) lead to fuzzy thinking, which facilitates political dishonesty.
      *   **Agency:** Humans choose these words to obscure truth, defend the indefensible, or avoid mental effort.
      *   **Solution:** Clarity, concrete imagery, active voice, stripping away pretension. "Political language... is designed to make lies sound truthful and murder respectable."
