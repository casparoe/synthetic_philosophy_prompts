      *   *Point 3: The Antidote.* "Concrete language" works against human obfuscation. Does it work against statistical probability?
          *   *Verdict:* He might argue it's *more* necessary. If the machine generates abstractions, the human must demand concreteness to verify reality. But he might also realize that "clarity" isn't enough if the source is inherently hollow.

      *   *Point 4: The Political Function.* Orwell saw bad language as a tool of power. AI language is a tool of *scale*.
          *   *Verdict:* It creates a "reality gap." When everything is generated, nothing is witnessed.

