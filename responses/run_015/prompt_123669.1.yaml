answer: |-
  # Job Talk Q&A Prep Sheet: Republican Liberty & The Many Small Masters

  **Context:** 90-second answers. Analytic Department.
  **Strategy:** Do not fight on their turf (definitions of liberty); fight on yours (aggregation and standing). Concede the conceptual collapse if it buys you the normative gain.

  ### 1. The Senior Republican (The "Status" Defense)
  **The Objection:** "You're treating domination as a functional outcome of interference probabilities. But for Pettit and the neo-Roman tradition, domination is a *status*. It's about being *in potestate*, regardless of whether the master is benign or fragmented. If you reduce 'arbitrary' to 'procedurally constrained,' you lose the core insight: that the mere capacity for uncontrolled interference degrades civic standing. Your 'many small masters' example misses that ten small degradations don't add up to one big degradation; they are ten distinct failures of recognition."

  **The Reply:** "I agree that status is the normative core, and that's precisely why I argue the *liberty* concept is doing no work. If domination is a status degradation, we should measure the degradation, not the modal interference. In my housing-benefit example, the claimant's status is degraded not because the algorithm *might* change, but because they lack the standing to demand a reason. My 'many small masters' argument shows that aggregating these status failures is mathematically identical to aggregating risks over option sets. So, I'm not losing the status insight; I'm relocating it. It's a moral claim about standing, not a distinct concept of liberty."

  **Soft Spot/Concession:** **Concede** that you are stripping "liberty" of its conceptual novelty. **Do not concede** that you are losing the normative force. Your pivot is: "Liberty is the vehicle, Standing is the cargo."

  ### 2. The Category Error (Liberty vs. Morality)
  **The Objection:** "You conclude by saying the residue of your argument is a claim about *standing*—about whose interests must be consulted. But that sounds like a claim about moral status or dignity, not liberty. If non-domination is just negative liberty plus a moral requirement for consultation, why call it a theory of freedom at all? Aren't you just describing a just procedure and mislabeling it as liberty?"

  **The Reply:** "That's a fair challenge to the labeling. I call it liberty because the *experience* of the subject is one of constraint. When I lack standing, I self-censor; I anticipate the unconsulted power. That behavioral adaptation is a loss of freedom, even if the interference never happens. However, I am willing to concede that the *justification* for protecting that freedom is moral status. So, yes: the metric is modal liberty (who could interfere), but the reason we care about that metric is moral standing. I'm arguing we need both to explain why the 'many small masters' case feels oppressive."

  **Soft Spot/Concession:** **Concede** the label is contested. **Defend** the phenomenology: the *feeling* of unfreedom is real even if the *ground* is moral status.

  ### 3. The Formal Theorist (The Modal/Probability Objection)
  **The Objection:** "Your claim that republican liberty is just negative liberty with a wider counterfactual base is formally trivial. That's just expected utility over an option set with uncertainty about the principal's behavior. If your 'many small masters' problem resolves to a scalar expectation over undominated options, you haven't found a third concept; you've just added a risk parameter to the standard negative liberty model. Why do we need 'domination' vocabulary for what looks like risk assessment?"

  **The Reply:** "Formally, you're right: it looks like risk assessment. But standard negative liberty models usually look at *actual* interference or fixed constraints. My point is that the *source* of the risk matters normatively. In the housing algorithm case, the risk isn't natural uncertainty; it's institutionalized discretion. If I code that as simple risk, I lose the political relationship. So, while the *math* might look like expected utility, the *variables* represent political relations. I'm arguing that political theory needs to track the source of the constraint, not just the probability."

  **Soft Spot/Concession:** **Concede** the formal isomorphism. **Insist** that political theory isn't just math; the *interpretation* of the variables (power vs. nature) is the contribution.

  ### 4. The Structural/Feminist Theorist (The Dyadic Blindspot)
  **The Objection:** "You're still modeling domination as a dyadic relation: a power-holder and a subject. But in my work on structural injustice, power is diffuse. In your housing-benefit example, who is the dominator? The coder? The statute? The caseworker? By trying to aggregate 'many small masters,' you're still looking for agents to blame. This framework makes invisible the structural conditions that make the algorithm seem neutral in the first place."

  **The Reply:** "This is why the 'many small masters' aggregation is crucial. I'm arguing that when power is diffuse, domination doesn't disappear; it fragments. In the algorithm case, no single agent dominates, but the *system* holds the power of arbitrary interference. My claim is that we can model this structural power as the aggregate of dyadic relations without needing a mystical 'structure' agent. However, I concede that if 'standing' is the real issue, then the structural critique holds: the system denies standing. So I agree: the target is the structure, but the mechanism is the aggregation of discretionary points."

  **Soft Spot/Concession:** **Concede** that dyadic language is limiting. **Pivot** to aggregation as the bridge to structural analysis. This is a high-risk concession; keep it tight.

  ### 5. The Algorithm Specific (The "Empty Review" Objection)
  **The Objection:** "Let's stick with your borough example. You say the human caseworker can review the algorithm but almost never overturns it. If the procedure exists and is auditable, Pettit would say you aren't dominated because there is contestability. You say you are dominated because the review is a sham. How do you distinguish a 'sham' procedure from a 'robust' one without just importing your own normative judgment about outcomes? Isn't 'arbitrary' just doing the work of 'I don't like this policy'?"

  **The Reply:** "It's not about the outcome; it's about the *cost* of contestation. In my example, the review exists on paper, but the time pressure and overturn rate make the cost of contestation prohibitively high. That makes the power arbitrary. If the caseworker had the time and mandate to genuinely assess the individual case, the power would be non-arbitrary, even if they reached the same decision. So the distinction isn't normative preference; it's institutional capacity. The 'sham' is empirical: it's a constraint that cannot practically be used."

  **Soft Spot/Concession:** **Concede** that the line is blurry. **Defend** the "cost of contestation" as the measurable threshold.

  ### 6. The Cambridge Historian (The Anachronism Objection)
  **The Objection:** "You're treating 'republican liberty' as a coherent concept that can be tested against Berlin. But the neo-Roman tradition isn't a unified theory; it's a historical discourse. By trying to cash out 'arbitrary' in analytic terms, you're engaging in rational reconstruction that the historical actors wouldn't recognize. Does it matter if your concept is stable if it bears only a family resemblance to the tradition you're citing?"

  **The Reply:** "I'm not doing intellectual history; I'm doing conceptual engineering. I use the republican tradition because it offers the best vocabulary for 'status,' even if I'm refining the mechanics. If the historical Romans didn't have a stable concept, that supports my thesis: the contemporary revival is trying to make stable something that wasn't. I'm arguing that for *current* political theory, we should stop trying to force it to be a third liberty and instead use it as a theory of standing. The history matters for genealogy, not for validity."

  **Soft Spot/Concession:** **Concede** the anachronism openly. **Reframe** it as a feature: you are updating the tool for modern use, not preserving a museum piece.

  ### 7. The Comparativist/Empiricist (The Measurement Objection)
  **The Objection:** "You talk about aggregating domination across relationships. How would I code that? If I'm comparing regimes, how do I count 'small masters'? Do I count every bureaucrat with discretion? If it's scalar, what's the unit? Until you can tell me how to measure the 'many small masters' problem, this remains a thought experiment that can't inform real institutional design."

  **The Reply:** "The unit is 'points of unreviewable discretion.' In the housing case, it's the gap between the statutory model and the human review. You measure it by the variance in outcomes that isn't explained by law or fact. If ten officials each have high variance they aren't accountable for, the aggregation is high. I admit this is hard to code, but that's because political science often ignores procedural discretion. My hope is that 'standing' is easier to measure: do subjects have a guaranteed right to a reason? That's binary and codable."

  **Soft Spot/Concession:** **Concede** the measurement is difficult. **Pivot** to the "right to a reason" as the proxy metric.

  ### 8. The Hostile Grad Student (The "So What?" Objection)
  **The Objection:** "So, if I understand you: Republican liberty is either Positive or Negative liberty, and the only new thing is a claim about moral standing. If that's true, why shouldn't we just drop the 'republican' label entirely? It seems like you've spent 40 minutes dismantling a concept only to keep the branding. Isn't this just intellectual turf wars?"

  **The Reply:** "Because the branding carries the normative weight. 'Negative liberty' doesn't capture the insult of being subject to unconsulted power. 'Standing' does. I keep the republican label to signal that we are talking about political relationships, not just spheres of non-interference. But I hear you: if the conceptual claim collapses, the label should serve the argument, not the other way around. I'm keeping it to highlight the *status* harm, which standard liberalism often misses."

  **Soft Spot/Concession:** **Concede** the label is instrumental. **Defend** it as a shorthand for "liberty + status."

  ***

  ### The One Question You Hope Nobody Asks

  **The Question:** "If your conclusion is that non-domination is just Negative Liberty plus a Moral Claim about Standing, and you admit the conceptual novelty is modal rather than categorical... **why isn't the more honest move to argue for a robust Negative Liberty theory that incorporates Standing, rather than trying to rehabilitate Republican Liberty? Aren't you just trying to save a research program that your own argument proves is bankrupt?**"

  **The Reply:** "That is the strongest version of my own conclusion. The honest answer is: because 'Negative Liberty' has historically been too focused on non-interference to easily absorb the status claim without distortion. Republican vocabulary forces us to look at the *relationship* first, not the *interference* first. But if I had to choose between the label and the insight, I'd keep the insight. I'm using the republican framework as a scaffold to build the standing argument, and if the scaffold can be removed once the building is up, I'm okay with that."

  **Note:** This answer admits the thesis title might be misleading but defends the *utility* of the journey. It shows intellectual honesty over territorial defensiveness.
