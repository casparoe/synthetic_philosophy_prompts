answer: |-
  ### Brainstorming Logical Commitments

  Before mapping the taxonomy, we must isolate the fault lines that generate disagreement. The debate is not merely about data but about the ontology of suffering and the ethics of memory.
  1.  **Commensurability:** Can distinct qualitative experiences of pain be reduced to a single quantitative metric, or does the *type* of destruction (e.g., cultural erasure vs. mass killing) create distinct moral categories?
  2.  **Zero-Sum Memory:** Is moral attention a finite resource where highlighting one tragedy inevitably obscures another, or can recognition be multiplicative?
  3.  **Access:** Is the barrier to comparison a lack of historical data (contingent) or a fundamental inability to access another's subjective suffering (necessary)?
  4.  **Function:** Does comparing atrocities serve to prevent future violence (instrumental), honor the dead (expressive), or assign guilt (retributive)?

  ### Taxonomy of Positions on Ranking Historical Atrocities

  **Level 1: The purpose of comparison**
  *   **1A:** Moral evaluation of agents
  *   **1B:** Causal-historical explanation
  *   **1C:** Commemorative and political practice

  **Level 2: The metric required**
  *   **2A:** Cardinal scale of human suffering (quantifiable pain/death)
  *   **2B:** Ordinal/structural features (intent, bureaucracy, capacity)

  **Level 3: The ground of resistance**
  *   **3A:** Epistemic (access to suffering is limited)
  *   **3B:** Moral (ranking disrespects victims)
  *   **3C:** Conceptual (atrocity is sui generis/incommensurable)

  **Level 4: The entailment of comparison**
  *   **4A:** Diminishes standing (zero-sum)
  *   **4B:** Non-competitive plural ordering (positive-sum/contextual)

  ---

  ### Viable Leaves (Occupied Logical Space)

  *Note: The following leaves represent coherent, defended positions. Combinations not listed below are treated as empty or incoherent in the analysis section.*

  **Path: 1B (Causal) → 2B (Structural) → 3A (Epistemic) → 4B (Non-competitive)**
  *   **Position:** Comparative Genocide Studies
  *   **Awkward Commitment:** It must assume structural similarities are morally salient enough to compare without reducing distinct victim experiences to data points.

  **Path: 1C (Commemorative) → 2B (Structural) → 3C (Conceptual) → 4A (Diminishes)**
  *   **Position:** Holocaust Uniqueness (Strong Form)
  *   **Awkward Commitment:** It risks isolating the event from all historical causality to preserve its moral singularity.

  **Path: 1C (Commemorative) → 2A (Cardinal) → 3B (Moral) → 4B (Non-competitive)**
  *   **Position:** Memorial Pluralism
  *   **Awkward Commitment:** It struggles to explain why resources for memorials are limited if moral standing is truly non-competitive.

  **Path: 1A (Moral) → 2A (Cardinal) → 3A (Epistemic) → 4A (Diminishes)**
  *   **Position:** Deflationary Skepticism
  *   **Awkward Commitment:** It implies that without perfect data, we must suspend moral judgment on perpetrators entirely.

  **Path: 1B (Causal) → 2A (Cardinal) → 3A (Epistemic) → 4B (Non-competitive)**
  *   **Position:** Utilitarian Historicism
  *   **Awkward Commitment:** It requires translating qualitatively different traumas into a single currency of utility for analysis.

  **Path: 1C (Commemorative) → 2B (Structural) → 3B (Moral) → 4B (Non-competitive)**
  *   **Position:** Contextualist Memory Politics
  *   **Awkward Commitment:** It must navigate political demands for hierarchy while theoretically denying the validity of hierarchy.

  **Path: 1A (Moral) → 2B (Structural) → 3C (Conceptual) → 4A (Diminishes)**
  *   **Position:** Moral Particularism
  *   **Awkward Commitment:** It renders cross-cultural moral condemnation impossible by locking judgment within specific conceptual frameworks.

  **Path: 1B (Causal) → 2B (Structural) → 3C (Conceptual) → 4B (Non-competitive)**
  *   **Position:** Structural Functionalism
  *   **Awkward Commitment:** It analyzes the machinery of destruction while remaining agnostic on the comparative weight of the suffering produced.

  ---

  ### Analysis of Logical Space

  **Empty and Incoherent Combinations**
  The majority of the 36 logical combinations (3 × 2 × 3 × 2) are unoccupied because they represent unstable philosophical stances.
  *   **1A/2A/3C/4B (Moral/Cardinal/Conceptual/Non-competitive):** Incoherent. If one accepts a cardinal scale of suffering (2A), one has already rejected the conceptual incommensurability objection (3C).
  *   **1B/2A/3B/4A (Causal/Cardinal/Moral/Diminishes):** Unattractive. Historical explanation rarely entails moral diminution of other events; this conflates explanation with commemorative competition.
  *   **1C/2A/3C/4B (Commemorative/Cardinal/Conceptual/Non-competitive):** Incoherent. Commemorative practice relying on a cardinal scale contradicts the claim that atrocities are conceptually incomparable.
  *   **Diagnosis:** These empty spaces usually arise from contradicting premises at Level 2 and Level 3. One cannot simultaneously demand a cardinal metric and claim the concept is sui generis.

  **Indistinguishable Leaves**
  *   **Pair:** **Comparative Genocide Studies** (1B/2B/3A/4B) and **Structural Functionalism** (1B/2B/3C/4B).
  *   **Diagnosis:** The tree cannot reliably separate these because both utilize structural metrics for causal explanation. The distinction lies in whether they view the conceptual objection as surmountable (Studies) or whether they simply ignore it (Functionalism), a nuance Level 3 captures imperfectly when the position is pro-ranking.
  *   **Pair:** **Memorial Pluralism** (1C/2A/3B/4B) and **Contextualist Memory Politics** (1C/2B/3B/4B).
  *   **Diagnosis:** Both aim for non-competitive commemoration grounded in moral respect. The distinction between using a cardinal vs. structural metric is often blurred in actual political practice, where both body counts and intent are cited rhetorically.

  **Constraint on Level 3**
  The "Ground of Resistance" node forces proponents of ranking to identify an objection they ultimately reject. This creates a slight distortion where a "Deflationary Skeptic" (who accepts the objection) and a "Comparative Scholar" (who rejects it) may both select "Epistemic" at Level 3. The tree relies on the Leaf description to distinguish whether the objection is treated as fatal or surmountable.
