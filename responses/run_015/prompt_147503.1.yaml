answer: |-
  This is a fantastic observation. You've stumbled onto the fact that **ontology is not just a branch of philosophy; it is an administrative technology.** Institutions don't discover what things *are*; they legislate it to manage risk, liability, and truth.

  Here is the breakdown of the metaphysical smuggling operations happening in archives, law, and museums, and why they can't be unified without breaking reality.

  ### 1. The Smuggled Ontologies

  **Archives: Mereological Essentialism vs. Informational Realism**
  *   **The Strict Rule (Hash Match):** This is **Mereological Essentialism**. It claims that the parts (bits) are essential to the whole. If a single bit flips, the object is numerically distinct. This treats the digital record as a *material particular*.
  *   **The Relaxed Rule (30% Repair):** This is **Informational Realism** (or Patternism). It claims the "object" is the *information pattern*, not the substrate. As long as the semantic content is recoverable (even via interpolation), the identity holds.
  *   **The Conflict:** Digital objects are weird because they are simultaneously *tokens* (specific magnetic states) and *types* (readable information). Strict archives prioritize the Token; relaxed archives prioritize the Type.

  **Corporate Law: Functionalism / The Nexus of Contracts**
  *   **The Rule:** A corporation survives 100% turnover of employees, assets, and shareholders.
  *   **The Metaphysics:** This is **Four-Dimensionalism (Perdurantism)** mixed with **Functionalism**. The corporation is not a substance; it is a *space-time worm* defined by its structural continuity and legal charter. It is a "nexus of contracts."
  *   **Why:** Liability and capital need stability. If ExxonMobil ceased to exist every time a tanker was sold or a CEO retired, capitalism would freeze. The law prioritizes *continuity of obligation* over *continuity of matter*.

  **Museums: Historical Essentialism (Provenance)**
  *   **The Ship (Theseus):** Often accepted as the original if the *form* and *historical continuity* are maintained. This is **Spatio-Temporal Continuity**.
  *   **The Painting:** A perfect physical copy is a forgery. Why? Because the value is in the **Causal History of Production**. The specific atoms must have been manipulated by the specific artist at the specific time.
  *   **The Metaphysics:** Museums run on **Genesis Essentialism**. An object's identity is bound to its origin story, not just its current state. A reconstructed ship is a *continuation*; a reconstructed painting is a *simulation*.

  ### 2. Is there a Unified Theory?

  **No.** And if you try to force one, the system breaks.

  The reason they are incompatible is that they serve different **teleological masters**:
  *   **Archives** serve **Truth** (Did this happen exactly this way?).
  *   **Law** serves **Stability** (Who is liable for this debt?).
  *   **Museums** serve **Aura** (Is this the thing the genius touched?).

  If you apply the **Archive's Strict Bitwise Identity** to Law:
  *   **Collapse:** The Corporation. As you noted, if legal personhood requires material continuity, companies die daily.
  *   **Collapse:** The Human Being. Biologically, you replace most of your cells every 7–10 years. Under strict mereological essentialism, you are not the same person who signed the mortgage 15 years ago. The mortgage is void. The banking system evaporates.
  *   **Collapse:** The Archive itself. Storage media rot. If you cannot migrate data to new drives (which changes the physical bits), you lose the record. Strict identity leads to total data loss over sufficient time.

  If you apply the **Law's Functionalism** to Museums:
  *   **Collapse:** The Art Market. If a perfect replica functions the same as the original, it *is* the original. Value is based on scarcity and provenance. If identity is functional, a Van Gogh print is ontologically equal to the canvas. The market crashes.

  ### 3. The 30% Threshold: Principled or Arbitrary?

  It is almost certainly **technical, not metaphysical.**

  In digital preservation, that number likely comes from **Forward Error Correction (FEC)** limits (like Reed-Solomon coding or PAR2 recovery).
  *   If you have a file and add 30% parity data, you can reconstruct the original file even if 30% of the bits are corrupted.
  *   **The Metaphysical Trick:** If the software reconstructs the bits *before* the hash check, the hash matches, and the archive claims "Identity Preserved."
  *   If the archive accepts a file where the hash *differs* but the content is "close enough," that 30% is the threshold of **Intelligibility**. It's the point where the signal-to-noise ratio drops so low that a human (or parser) can no longer confidently say "this represents the original intent."

  It is not a line in the sand of *being*; it is a line in the sand of *readability*.

  ### 4. Who Collapses First? (The Thought Experiment)

  If we universalized the **Strict Archive Rule** (Numerical Identity requires Material Identity):

  1.  **First to Die: The Cloud/Internet.** Data is constantly moved, cached, and rewritten. A website that load-balances across servers changes its physical bits constantly. The "site" ceases to exist.
  2.  **Second to Die: Biological Legal Persons.** As mentioned, cell turnover voids contracts, marriages, and citizenship. Society reverts to a momentary anarchic state every morning.
  3.  **Third to Die: Museums.** Conservation is invasive. Cleaning a painting removes atoms. Lining a canvas adds new glue and fabric. Under strict material identity, every conservation act creates a new object. The "original" is only the object in the exact state it was the moment the artist put down the brush. It is now in a vault, decaying, never to be touched.
  4.  **Last to Die: Math and Logic.** Abstract objects don't have bits or cells. They survive.

  ### 5. Conclusion: Are We Winging It?

  Yes, but **strategically.**

  We are running on **Pragmatic Ontology**.
  *   We pretend humans are continuous substances so we can hold them responsible for past crimes.
  *   We pretend corporations are immortal beings so they can invest in long-term infrastructure.
  *   We pretend digital files are fragile crystals so we don't allow tampering.
  *   We pretend digital files are robust patterns so we don't lose history to bit-rot.

  There is no consistent answer because **identity is not a property of the world; it is a interface for human interaction.**

  The "inconsistency" you see is actually a feature, not a bug. It's a **context-sensitive ontology**. When you walk into a court, you are a continuous legal person. When you walk into a lab, you are a collection of replaceable cells. When you walk into an archive, you are a creator of fixed records.

  The moment we try to make the metaphysics consistent across all domains is the moment we break the institutions that rely on the ambiguity. We aren't winging it; we are **compartmentalizing reality to keep the lights on.**
