  This framework does not require new physics, only a new **axiological interpretation** of the Einstein Field Equations. It suggests that gravity is not just the curvature of spacetime, but the **curvature of value**. To manipulate gravity is to manipulate the distribution of sentience, and until we know the sign of that valence, the precautionary principle demands we seek the flattest possible path.
