answer: |-
  It is a genuine pleasure to assist someone who has undertaken such a rigorous path of self-education. Your variations on the Twin Earth case are philosophically robust; they touch on the tension between causal-historical theories of reference and descriptive theories, as well as the "disjunction problem" often discussed in teleosemantics. They are perfectly suited to force students beyond rote learning.

  Below is the examination material, designed to be handed directly to the students, followed by the model answer and the marking scheme for your use.

  ***

  # Essay Question

  **Time Allowed:** 90 Minutes
  **Total Marks:** 20
  **Instructions:** Answer the question below. You may not use books or notes.

  **Background:**
  In the original "Twin Earth" story, there is a planet identical to Earth except that the liquid in their lakes, called "water," is not H₂O but a different chemical (XYZ). It looks and tastes like water. When an Earthling says "water," they mean H₂O. When their twin says "water," they mean XYZ. This suggests that what a word refers to depends on the environment, not just what is in the speaker's head.

  **Consider the following two variations:**

  1.  **The Switched Planet:** Suppose a planet that, up to the year 1900, was exactly like Earth: the drinkable liquid in its lakes and rivers and rain is H₂O. Over the following generation, every sample of it is quietly replaced by the Twin Earth liquid (XYZ). It has the same colour, smell, taste, and behaviour, and keeps living things alive. Nobody notices, and there is no chemistry on the planet. The word the community uses for the liquid is handed down from parents to children in an unbroken chain going back well before 1900. Today, a speaker on that planet says that the liquid is good for the crops.
  2.  **The Mixed Planet:** Suppose a planet on which two chemically different liquids (H₂O and XYZ) both occur naturally, in roughly equal quantity, in different lakes. They are indistinguishable without chemical analysis and are used for all the same purposes by the same community. The community has a single word covering both and no idea that there are two.

  **The Question:**
  First, explain what determines the reference of the word for the liquid in **both** variations. Does the "Switched Planet" word pick out H₂O, XYZ, or nothing? Does the "Mixed Planet" word pick out one, both, or neither? Explain why the original slogan ("meanings are not in the head") is insufficient to answer these specific cases.

  Second, discuss whether anything follows from your conclusions about *reference* regarding what these speakers *think*. Do the speakers on Twin Earth (or your variations) have different thoughts from Earthlings when they speak? State explicitly what **further premise** would be needed to get from a conclusion about words to a conclusion about thoughts, if it can be reached at all.

  ***

  # Model Answer

  The original Twin Earth argument establishes semantic externalism: the extension of a natural kind term like "water" is fixed by the actual physical nature of the local environment, not merely by the speaker's internal descriptions. However, applying this to the Switched and Mixed planets reveals complexities that the slogan "meanings are not in the head" cannot resolve on its own.

  In the Switched Planet case, we face a conflict between two mechanisms of reference-fixing. If reference is determined by the current causal environment (the liquid currently in the cup), the word refers to XYZ. However, if reference is determined by the causal-historical chain of transmission (the baptism of the term before 1900), the word refers to H₂O. The slogan "meanings are not in the head" tells us that internal psychology is insufficient, but it does not tell us whether "not in the head" means "in the current surroundings" or "in the historical lineage." A student of the causal theory might argue that because the chain of communication was initiated when the stuff was H₂O, the reference remains H₂O, even if the stuff changed. Conversely, a descriptivist might argue that since the observable properties remain identical and functional, the reference tracks the role, potentially shifting to XYZ or becoming ambiguous. The slogan alone cannot decide between history and current composition.

  The Mixed Planet case presents a different challenge: the disjunction problem. If the community uses one word for both H₂O and XYZ, and neither is privileged as the "standard," the "same underlying nature" rule fails. There is no single underlying nature. Does the word refer to the disjunction (H₂O or XYZ)? Or does it refer to nothing, because the term presupposes a unity that does not exist? If we say it refers to both, we admit that "water" does not pick out a natural kind but a functional category. If we say it refers to neither, we imply that reference requires a homogeneous environment. Again, the externalist slogan tells us to look outside the head, but looking outside reveals a messy reality that the simple theory cannot categorize without further rules about how to handle heterogeneity.

  This leads to the second part of the question: the relationship between reference and thought. Even if we settle that the Switched Planet word refers to H₂O (due to history), does the speaker *think* about H₂O? They have no concept of chemistry; their internal experience is identical to an Earthling's. If reference is external but thought content is internal (narrow content), then the speakers have the same thoughts despite different references. If thought content is also external (wide content), then their thoughts differ.

  The argument so far only establishes that the *extension* of the word differs (or is ambiguous). To conclude that the *thoughts* differ, one needs a further premise: **The Principle of Content Externalism.** This premise states that the propositional content of a belief is constituted, at least in part, by the reference of the terms used to express it. Without this premise, one could maintain that while the word "water" picks out different stuff, the psychological state (the belief that "water is wet") remains identical across planets because the functional role in the mind is the same. Therefore, the Twin Earth argument proves semantic externalism, but it only proves psychological externalism if one accepts that thought content supervenes on reference.

  ***

  # Marking Scheme

  **Total Marks:** 20 (5 Points × 4 Marks)
  **Marker's Note:** Do not award marks for naming philosophers (e.g., Putnam, Burge). Award marks only for the quality of the reasoning.

  **Technical Definitions for the Marker:**
  *   **Reference/Extension:** The actual object or stuff in the world a word picks out.
  *   **Semantic Externalism:** The view that meaning/reference depends on the environment.
  *   **Narrow Content:** Thought content determined solely by what is inside the head.
  *   **Wide Content:** Thought content determined partly by the external environment.
  *   **Supervene:** A relationship where one set of properties (thoughts) cannot change without the other set (environment/reference) changing.

  | Point | Requirement (4 Marks each) | Typical Error (Deduction Guide) |
  | :--- | :--- | :--- |
  | **1. Original Baseline** | **Correctly summarises the original Twin Earth lesson:** Reference depends on the physical environment (H₂O vs XYZ), not just internal descriptions. | Student claims the original story proves meanings *are* in the head, or confuses the two liquids. |
  | **2. Switched Planet** | **Identifies the History vs. Current Stuff tension:** Explains that the slogan doesn't say whether reference tracks the 1900 origin (H₂O) or the current liquid (XYZ). | Student assumes the slogan automatically solves it (e.g., "It's XYZ because meanings aren't in the head"). |
  | **3. Mixed Planet** | **Identifies the Disjunction/Homogeneity problem:** Explains that "same underlying nature" fails when there are two natures, creating ambiguity about whether the word covers both or neither. | Student ignores the "single word" constraint or claims chemistry would obviously separate them. |
  | **4. Reference vs. Thought** | **Distinguishes word reference from mental content:** Explicitly states that different reference does not automatically guarantee different thoughts (Narrow vs. Wide content). | Student conflates speaking about different things with having different psychological states. |
  | **5. Further Premise** | **States the missing link:** Identifies that one needs the premise that "thought content is constituted by reference" (Content Externalism) to move from words to minds. | Student claims the conclusion about thoughts follows immediately without an extra premise. |

  **Grading Thresholds:**

  *   **Bare Pass (10-12 marks):** The student explains the original Twin Earth story correctly and attempts both variations. They recognise that the slogan is not enough but may struggle to articulate *why*. They distinguish reference from thought but fail to clearly state the further premise required.
  *   **Excellent Answer (18-20 marks):** The student clearly articulates the specific theoretical gap in the Switched Planet (causal history vs. current environment) and the Mixed Planet (disjunction). They cleanly separate semantic externalism from psychological externalism and explicitly formulate the further premise needed to bridge them, as seen in the model answer.

  ***

  ### A Note for the Marker (You)

  You mentioned you are applying this scheme yourself. A common difficulty in marking philosophy essays is the "halo effect," where a well-written essay masks poor reasoning. To counter this:

  1.  **Highlight the specific claims:** When reading, underline the sentence where they address the Switched Planet tension. If it isn't there, Point 2 cannot get full marks, regardless of how eloquent the prose is.
  2.  **The "Further Premise" is the discriminator:** Most students will stop at "words mean different things." The excellent students will notice that *thinking* might remain the same. Use Point 5 to separate the good from the excellent.
  3.  **Ignore the jargon:** If a student describes "Wide Content" without using the phrase (e.g., "thoughts that depend on the world"), award the marks. If they use the phrase but define it wrongly, do not.

  Your variations are excellent because they force the student to *use* the theory, not just repeat it. Good luck with the course.
