          *   (ii) Reactive: The corn-dealer passage *does* license restraining the speaker if the circumstances make violence probable. This contradicts the "police the rioters" intuition. Skokie highlights this tension.
          *   (iii) Aggregative: Hard for Mill. He focuses on specific acts. Needs a bridge to "security" as a vital interest.
