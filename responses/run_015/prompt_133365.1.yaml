      *   *Distinction (i) Audience-Relative Harm:* Psychological trauma to survivors. Is this "harm" or "offence"? Mill distinguishes harm (perceptible hurt) from mere dislike/offence. Severe psychological distress might count as harm, but Mill is wary of veto power based on sensitivity.
      *   *Distinction (ii) Reactive Harm:* Counter-protesters might riot. Mill generally says police the rioters, not the speaker. *Except* the corn-dealer passage suggests stopping the speaker if the context makes violence likely.
      *   *Distinction (iii) Aggregative Harm:* Degradation of civic standing/security over time. Mill is an act-utilitarian regarding rights usually, but the "harm" definition needs to sustain long-term social goods.
