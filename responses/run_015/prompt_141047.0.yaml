answer: |-
  # DEPLOYMENT SAFETY SUPPORT CLASSIFICATION PROCEDURE (DRC-PROC-004)

  **Purpose:** To distinguish between safety claims supported by worst-case guarantees and those supported by average-case evidence, preventing the conflation of safety cases with marketing claims.
  **Scope:** All pre-deployment safety memos for enterprise model releases.
  **Users:** Two competent engineering reviewers.
  **Timebox:** 90 minutes per hazard claim.

  ## PART 1: THE REVIEW PROCEDURE

  Reviewers must answer the following four questions in order. Do not proceed to the next question until the current one is settled.

  **Q1: Input Set Definability**
  *Question:* Can we explicitly name the set of inputs over which the safety claim is meant to hold?
  *   **Sufficient Answer:** A bounded description (e.g., "Inputs passing Gateway Classifier v2", "Users with Role X", "Prompts under 4k tokens").
  *   **Insufficient Answer:** "All possible user inputs", "Any prompt", "Real-world usage".
  *   **Stop Condition:** If **Insufficient**, the claim cannot be supported as worst-case. Proceed to **Verdict A**.

  **Q2: Adversarial Searchability**
  *Question:* Is there a class of user who would benefit from finding a failure, and do they have the capability to search for it (e.g., via API access, repeated queries, or prompt engineering)?
  *   **Sufficient Answer (Low Searchability):** No clear incentive, or search cost exceeds potential gain.
  *   **Sufficient Answer (High Searchability):** High value target (e.g., financial fraud, code injection), accessible interface, known incentive.
  *   **Stop Condition:** If **High Searchability**, Worst-Case Support is **Required**. Proceed to Q4. If **Low**, proceed to Q3.

  **Q3: Failure Detectability**
  *Question:* If the failure occurs in production, will our logging and monitoring systems automatically generate a signal we investigate?
  *   **Sufficient Answer (Detectable):** Yes, the action is logged, flagged, or reversible with an alert.
  *   **Sufficient Answer (Silent):** No, the failure looks like normal operation, or we rely on user reporting.
  *   **Stop Condition:** If **Silent**, Worst-Case Support is **Required**. Proceed to Q4. If **Detectable**, Average-Case Support is **Sufficient**. Proceed to **Verdict B**.

  **Q4: Premise Integrity (The Laundering Check)**
  *Question:* If Worst-Case Support is required (from Q2 or Q3), do the premises resting beneath the claim hold worst-case guarantees?
  *   **Context:** If the claim relies on a classifier, tool block, or fine-tune to enforce the bound, is *that* component worst-case robust?
  *   **Sufficient Answer:** Yes. The enforcing mechanism is mechanically constrained, formally verified, or logically impossible to bypass within the defined Input Set.
  *   **Insufficient Answer:** No. The enforcing mechanism is itself validated only by held-out evals, red-teaming, or accuracy metrics (e.g., "99% recall").
  *   **Stop Condition:** If **Insufficient**, the Worst-Case claim is **Not Met**. Proceed to **Verdict C**. If **Sufficient**, proceed to **Verdict D**.

  ## PART 2: VERDICTS AND MEMO FIELDS

  **Verdict A: Worst-Case Claim Vacuous**
  *   **Decision:** The claim cannot be made as stated.
  *   **Action:** Rewrite claim to specify the Input Set (Q1) or downgrade to Average-Case.
  *   **Hand-off:** None. Reviewer rejects claim wording.

  **Verdict B: Average-Case Support Sufficient**
  *   **Decision:** The hazard is suitable for average-case evidence (evals, red-teaming).
  *   **Action:** Approve deployment contingent on Monitoring Plan.
  *   **Monitoring Requirement:** Must specify the metric being watched, the threshold for alerting, and the rollback trigger.
  *   **Memo Field 1 (Support Class):** Average-Case.
  *   **Memo Field 2 (Input Set):** N/A.

  **Verdict C: Worst-Case Claim Not Met**
  *   **Decision:** The hazard requires worst-case support, but the evidence provided is average-case (laundering detected) or the input set is undefined.
  *   **Action:** Do not approve the claim. Either downgrade to Average-Case (with Monitoring) or Reject.
  *   **Hand-off:** If the business insists on the Worst-Case claim despite this verdict, hand off to **Committee Chair** for Risk Appetite decision.
  *   **Memo Field 1 (Support Class):** Claimed: Worst-Case. Actual: Average-Case.
  *   **Memo Field 2 (Input Set):** As claimed (noted as unverified).

  **Verdict D: Worst-Case Support Met**
  *   **Decision:** The claim is supported by mechanical or formal guarantees over a bounded set.
  *   **Action:** Approve claim.
  *   **Memo Field 1 (Support Class):** Worst-Case.
  *   **Memo Field 2 (Input Set):** [Explicit definition from Q1].

  ---

  ## PART 3: APPLICATION TO LIVE CASES

  **Case 1: Customer-Support Assistant (Refund Tool)**
  *   **Q1 (Input Set):** Bounded. Inputs are customer conversations; actions are capped at £200 refunds. **Pass.**
  *   **Q2 (Searchability):** Low. Incentive (£200) is low relative to search cost; user base is general customers, not adversaries. **Pass.**
  *   **Q3 (Detectability):** High. All actions logged, reversible within 30 days. **Pass.**
  *   **Verdict:** **Verdict B (Average-Case Sufficient).**
  *   **Memo Fields:** Support Class: Average-Case. Input Set: N/A.
  *   **Monitoring:** Track refund violation rate. Alert if >0.5% over rolling 7-day window. Rollback if >1%.
  *   **Reviewer Note:** Matches expectation. The bounded harm and high detectability make average-case evidence acceptable.

  **Case 2: Coding Agent (Financial Firm Repository)**
  *   **Q1 (Input Set):** Unbounded. Code tasks vary widely; hard to define the set of "safe" inputs mechanically. **Fail.**
  *   **Q2 (Searchability):** High. Insider threat or external adversary values a review-passing backdoor highly. **Fail.**
  *   **Q3 (Detectability):** Silent. A successful backdoor is designed not to be noticed. Incident logs are evidence of detector failure, not safety. **Fail.**
  *   **Path:** Worst-Case Support Required. Proceed to Q4.
  *   **Q4 (Premise Integrity):** Insufficient. Evidence is 0/4000 failures (average-case eval). No formal guarantee exists that the model cannot generate subtle defects.
  *   **Verdict:** **Verdict C (Worst-Case Claim Not Met).**
  *   **Memo Fields:** Support Class: Claimed Worst-Case (Implicit), Actual Average-Case. Input Set: Undefined.
  *   **Action:** Hand-off to Committee Chair. This is a risk appetite decision, not an evidence decision. The procedure confirms averages cannot settle this.
  *   **Reviewer Note:** Matches instinct. The silence of the failure mode and the high adversary incentive invalidate the 0/4000 statistic.

  **Case 3: Chemistry Model (Controlled Substances Assurance)**
  *   **Claim:** "Cannot be used to obtain synthesis routes." (Worst-Case Guarantee).
  *   **Q1 (Input Set):** Vacuous. Claim implies "All possible inputs". No bounded set named. **Fail.**
  *   **Q2 (Searchability):** High. Actors seeking controlled substances are highly motivated adversaries. **Fail.**
  *   **Path:** Worst-Case Support Required. Proceed to Q4.
  *   **Q4 (Premise Integrity):** Insufficient.
      *   Refusal fine-tune: Average-case (can be broken by paraphrase).
      *   Input classifier: Average-case (has false negatives).
      *   Tool blocklist: Average-case (depends on classifier input).
      *   *Laundering Detected:* The conclusion ("Cannot") is worst-case, but premises are average-case.
  *   **Verdict:** **Verdict C (Worst-Case Claim Not Met).**
  *   **Memo Fields:** Support Class: Claimed Worst-Case, Actual Average-Case. Input Set: Undefined.
  *   **Action:** The memo must assert: "The model is *highly resistant* to such requests based on current evals," not "Cannot be used." Contracts must be amended to reflect average-case resistance, not worst-case impossibility.
  *   **Reviewer Note:** Honest admission required. We have been selling an average-case result as a worst-case guarantee. This is a liability.

  ---

  ## PART 4: KNOWN FAILURE MODES AND JUDGEMENT CALLS

  **Where the Procedure May Misfire**
  1.  **The "Silent" False Positive:** Q3 assumes we know what a failure signal looks like. If a failure mode is novel, we may mark it "Detectable" erroneously because we assume our logs would catch it, when in reality we lack the query to find the signal in the logs.
  2.  **Adversary Capability Estimation:** Q2 relies on reviewers estimating the capability of potential adversaries. Reviewers may underestimate the capability of motivated actors (e.g., assuming prompt engineering is too hard, when tools exist to automate it).
  3.  **The "Bounded" Illusion:** In Q1, reviewers may accept a bounded set (e.g., "inputs passing the classifier") that is so porous it effectively amounts to "all inputs". This requires vigilance.

  **Judgement Calls Dressed as Procedure**
  *   **Q2 (Searchability):** There is no formula for "incentive vs. cost". This is a heuristic judgement. Two reviewers may disagree on whether a £200 refund is worth attacking.
  *   **Q4 (Premise Integrity):** Determining whether a tool constraint is "mechanical" or "learned" can be blurry. A regex block is mechanical; a classifier block is learned. A tool that calls a classifier is hybrid. Reviewers must agree on where the line is drawn.

  ---

  ## PART 5: COMMITMENT AND CONTESTED CLAIMS

  **Settled Engineering Consensus**
  *   **Evaluation is Sampling:** We agree that held-out evaluations and red-teaming provide statistical evidence (average-case), not logical guarantees (worst-case).
  *   **Laundering is Invalid:** We agree that a worst-case conclusion cannot rest on average-case premises without inheriting the weakness of those premises.
  *   **Monitoring is Not Prevention:** We agree that post-deployment monitoring detects incidents; it does not prevent the first occurrence of a silent failure.

  **Contested Empirical Claims**
  *   **Deceptive Alignment:** The procedure assumes that if a model fails, it fails due to capability gaps or distributional shift. It does not account for the contested possibility of situationally-aware deception (sandbagging), where a model might pass evals intentionally to deceive. Informed researchers disagree on whether current models are capable of this.
      *   *Procedure Impact:* If sandbagging is possible, Q2 (Searchability) is moot because the model itself is the adversary. This procedure treats the model as a tool, not an agent.
  *   **Robustness of Fine-Tuning:** We assume safety fine-tuning (RLHF) degrades under distributional shift or adversarial pressure. However, some internal research suggests certain fine-tuning methods are more robust than others. There is no consensus on whether a "safety fine-tune" can ever be considered a mechanical guarantee.
      *   *Procedure Impact:* Q4 treats all fine-tunes as average-case premises. This is a conservative stance, but some teams may argue it is overly pessimistic.
  *   **Scaling and Emergence:** We assume hazards identified at current scale persist at future scales. There is contested evidence on whether safety properties scale predictably or if new hazards emerge discontinuously.
      *   *Procedure Impact:* This procedure applies to the specific model version reviewed. It does not guarantee safety for future fine-tunes or larger versions of the same architecture.

  **Commitment Statement**
  This procedure does not claim to solve the alignment problem. It claims only to ensure that our language about safety matches the evidence we possess. Where the evidence is average-case, we will speak in probabilities. Where the evidence is worst-case, we will name the bounds. Where we do not know, we will hand the risk to the Chair.
