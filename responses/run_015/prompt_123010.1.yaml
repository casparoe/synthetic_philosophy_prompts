      *   *Check:* Did I identify the incompatible pair and the exclusionary requirement? *Yes.*
      *   *Refinement on "Assertion to No One":* This challenges the "Hearer Acquisition" purpose. I need to note that the norm must either explain this as derivative or the purpose needs to allow for "potential" hearers. I will frame it as a requirement to handle *uptake conditions*.
      *   *Refinement on "Contested Truth-Aptness":* If the purpose is what a hearer *acquires*, and the content isn't truth-apt, what do they acquire? A commitment? I should list this as a structural feature: *Content Neutrality* or *Commitment Transfer*.

  9.  **Final Polish:** Organize with clear headings. Ensure the "Purpose" stated in the prompt is the anchor. (Proceed to generate output).

