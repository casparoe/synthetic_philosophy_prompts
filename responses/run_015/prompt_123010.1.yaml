answer: |-
  # Specification of the Norm of Assertion

  ## I. The Fixed Purpose
  Before evaluating candidate norms, the functional role of the norm is fixed. The norm is not merely a rule for individual conversational etiquette; it is a structural pillar for epistemic reliance. It must underwrite two specific domains:
  1.  **Hearer Acquisition:** It must explain what epistemic status (justification, entitlement, guarantee) a hearer acquires simply in virtue of being told something.
  2.  **Institutional Obligation:** It must explain what epistemic duties public bodies (governments, health agencies, corporations) owe the populace when issuing official statements.

  Any candidate norm that cannot bridge the gap between individual speech acts and institutional accountability is disqualified by design.

  ---

  ## II. Desideratum List

  ### A. Conceptual Distinctions
  *The norm must preserve these distinctions to avoid collapsing normative categories.*

  1.  **Sincerity vs. Warrant**
      *   **Requirement:** The norm must distinguish between a speaker who believes $P$ but lacks evidence (sincere but unwarranted) and a speaker who has evidence for $P$ but does not believe it (insincere but warranted).
      *   **Case/Consideration:** A nervous expert who has the data but doubts her own analysis versus a confident layperson who guesses correctly. The hearer's acquisition should track warrant, not sincerity; the institution's obligation is to warrant, not internal belief.
  2.  **Defective Act vs. Blameworthy Speaker**
      *   **Requirement:** The norm must allow that an assertion can be normatively defective (violating the rule) even if the speaker is not blameworthy (excused by circumstances).
      *   **Case/Consideration:** A doctor asserts a diagnosis based on the best available tests, which turn out to be flawed. The assertion was defective (false/unwarranted), but the doctor is not blameworthy. A norm that equates violation with culpability makes institutional risk-management impossible.
  3.  **Constitutive vs. Regulative**
      *   **Requirement:** The norm must specify whether it defines the act of assertion (constitutive) or governs an independent act (regulative).
      *   **Case/Consideration:** If constitutive, violating the norm means one hasn't truly asserted (like moving a rook diagonally). If regulative, one asserts but does so improperly. To underwrite *hearer acquisition*, the norm must be sufficiently constitutive that violating it undermines the hearer's entitlement, yet sufficiently regulative to allow for "failed" assertions that still transmit *some* liability.

  ### B. Phenomenological Data & Cases
  *The norm must accommodate the infelicities and felicitities of actual usage.*

  4.  **The Moorean Constraint (Disavowing Knowledge)**
      *   **Requirement:** The norm must explain the infelicity of asserting $P$ while explicitly disavowing the normative status required for $P$.
      *   **Case:** "It is raining, but I don't know it is raining." This is pragmatically contradictory. The norm must explain why asserting $P$ represents the speaker as having a status they are simultaneously disavowing.
  5.  **Hedged vs. Unhedged Commitment**
      *   **Requirement:** The norm must account for the difference in normative force between "P" and "It might be that P."
      *   **Case:** A weather service saying "It will rain" vs. "There is a 40% chance of rain." The hearer acquires different entitlements (certainty vs. probability), and the institution incurs different liabilities if wrong.
  6.  **Downstream Stakes Sensitivity**
      *   **Requirement:** The norm must handle cases where the stakes for the speaker/hearer are low, but the stakes for a third-party relying on the testimony are high.
      *   **Case:** Casual gossip about a structural flaw in a building. Low stakes for gossips, fatal stakes for future occupants. The norm cannot make permissibility entirely relative to the immediate conversational context if it is to govern institutional liability to the public.
  7.  **Collective Agency**
      *   **Requirement:** The norm must apply to entities that lack a single mind or unified phenomenological state.
      *   **Case:** A CDC press release. No single individual knows all the premises. The norm must define the epistemic status of a collective (e.g., aggregated data, vetted consensus) without requiring a singular "knower."
  8.  **Contested Truth-Aptness**
      *   **Requirement:** The norm must accommodate assertions in domains where truth is contested (moral, aesthetic, legal).
      *   **Case:** A court ruling ("The defendant is liable") or a moral condemnation ("This policy is unjust"). If the norm requires literal Truth or Knowledge, these may be excluded. If the purpose is *hearer acquisition*, the norm must explain what is acquired here (e.g., authoritative commitment rather than fact).
  9.  **Uptake Conditions (Assertion to No One)**
      *   **Requirement:** The norm must explain the status of assertions made without an immediate audience (diaries, soliloquies, archived data).
      *   **Case:** A scientist recording data no one will see for decades. If the norm is purely about *hearer acquisition*, this is problematic. The norm must ground the obligation in the *potential* for uptake or the nature of the record itself.

  ### C. Structural Features
  *The architecture of the norm.*

  10. **Transferability**
      *   **Requirement:** The norm must explain how epistemic status moves from speaker to hearer.
      *   **Consideration:** If the norm is solely about the speaker's internal state, it is hard to see how the hearer acquires anything. The norm must posit a public standard.
  11. **Scalability**
      *   **Requirement:** The norm must function identically in principle for individuals and institutions, even if the *mechanism* of satisfaction differs.
      *   **Consideration:** We should not need two different words for "assertion" when a person speaks and when a government speaks.

  ---

  ## III. Sorting the Requirements

  ### Non-Negotiable
  *Demands any viable theory must meet to satisfy the Fixed Purpose.*
  1.  **Defective Act vs. Blameworthy Speaker:** Essential for institutional accountability. Institutions must be able to issue corrections (admitting defect) without necessarily admitting negligence (blame).
  2.  **Downstream Stakes Sensitivity:** Essential for public trust. If the norm allows low-stakes casualness that harms high-stakes third parties, it fails the "Institutional Obligation" purpose.
  3.  **Collective Agency:** Essential for the "Institutional Obligation" purpose. A norm that requires a singular mental state cannot govern organizations.
  4.  **Transferability (Hearer Acquisition):** Essential for the "Hearer Acquisition" purpose. If the norm doesn't explain what the hearer gets, it is solipsistic.

  ### Negotiable
  *Features a theory might sacrifice or modify to preserve the Non-Negotiables.*
  1.  **Constitutive vs. Regulative:** A theory might argue the norm is constitutive of *proper* assertion but regulative of *assertion simpliciter*. As long as hearer acquisition is blocked by violation, the metaphysical status is flexible.
  2.  **Contested Truth-Aptness:** A theory might restrict the norm to factual content and treat moral/legal claims as a different speech act (e.g., "prescribing" rather than "asserting"). This is costly but permissible if it saves the core epistemic account.
  3.  **Uptake Conditions:** A theory might treat "assertion to no one" as derivative or parasitic on standard assertion.

  ### Mere Prejudice
  *Demands often made by specific camps that no theory should have to grant.*
  1.  **The "Knowledge" Formulation:** The demand that the norm *must* be stated as "Assert $P$ only if you know $P$." This privileges one epistemic category over others (e.g., Justified Credibility) without argument.
  2.  **Single Unitary Rule:** The demand that there be exactly one rule for all contexts. A cluster concept or a sliding scale based on stakes might be necessary to satisfy Downstream Stakes Sensitivity.
  3.  **Context Invariance:** The demand that the norm never changes based on practical environment. This is incompatible with Downstream Stakes Sensitivity.

  ---

  ## IV. Tensions and Exclusions

  ### The Incompatible Pair
  I suspect **Collective Agency** and **Strong Hearer Acquisition (via Knowledge)** cannot be jointly satisfied.
  *   **Reasoning:** To give a hearer a strong epistemic acquisition (e.g., "If they asserted, I now know"), the bar for assertion must be high (e.g., Knowledge). However, Collective Agency often operates on distributed information where no single agent possesses "Knowledge" in the strict individual sense (the Gettier problem scales poorly to committees). If we lower the bar to accommodate Collectives (e.g., "Reasonable Institutional Consensus"), we weaken what the Hearer Acquires (they get "Warranted Belief" rather than "Knowledge"). If we keep the bar high (Knowledge), Institutions rarely assert permissibly.

  ### The Exclusionary Requirement
  The single requirement that does the most to exclude otherwise attractive candidates is **The Moorean Constraint (Disavowing Knowledge)**.
  *   **Reasoning:** This requirement kills the **Truth Norm** immediately. I can assert a truth without knowing it, but I cannot assert "P, but I don't know P." A norm based solely on Truth cannot explain this infelicity. It also puts immense pressure on the **Reasonable Belief Norm**. I can reasonably believe $P$ while admitting I don't *know* $P$ (fallibilism). If the norm were merely Reasonable Belief, "P, but I don't know P" should be felicitous. It is not. This suggests the norm must involve a representation of Knowledge, even if the actual requirement is something else.

  ---

  ## V. Brief Touch on Familiar Norms
  *Marking failures against the Specification above.*

  *   **The Knowledge Norm (Assert $P$ only if you know $P$):**
      *   *Fails:* **Collective Agency.** It is unclear how a committee "knows."
      *   *Fails:* **Downstream Stakes.** Knowledge is often treated as invariant, yet we demand more from institutions in high-stakes contexts than mere knowledge (we demand certainty or vetting).
      *   *Passes:* Moorean Constraint, Hearer Acquisition.

  *   **The Truth Norm (Assert $P$ only if $P$ is true):**
      *   *Fails:* **Moorean Constraint.** Does not explain why "P, but I don't know P" is bad.
      *   *Fails:* **Defective Act vs. Blameworthy Speaker.** If I assert a falsehood with perfect evidence, I violated the norm. But was the act defective in the same way as a lie? The Truth Norm struggles to distinguish luck from negligence.
      *   *Passes:* Contested Truth-Aptness (if one is a realist).

  *   **The Reasonable Belief Norm (Assert $P$ only if you reasonably believe $P$):**
      *   *Fails:* **Moorean Constraint.** Allows "P, but I don't know P."
      *   *Fails:* **Hearer Acquisition.** If the speaker only needs reasonable belief, the hearer acquires less epistemic security. It weakens the "Institutional Obligation" to the public.
      *   *Passes:* Collective Agency, Defective Act vs. Blameworthy Speaker.

  *   **The Credibility/Entitlement Norm (Assert $P$ only if you are entitled to claim $P$):**
      *   *Fails:* **Single Unitary Rule.** "Entitlement" often shifts based on context (Negotiable feature, but often treated as rigid).
      *   *Passes:* Most others, specifically bridging Individual and Institutional contexts well.
