      *   **Constraint 3 (Distinctions):** Must include: Sincerity vs. Warrant, Defective Act vs. Blameworthy Speaker, Constitutive vs. Regulative.
      *   **Constraint 4 (Sorting):** Categorize requirements into Non-Negotiable, Negotiable, and Mere Prejudice.
      *   **Constraint 5 (Specific Cases):** Hedged vs. Unhedged, Disavowing Knowledge, Low/High Stakes (downstream), Assertion to no one, Collective Assertion, Contested Truth-Aptness (moral/aesthetic/legal).
      *   **Task 3:** Identify a pair of requirements suspected to be incompatible.
      *   **Task 4:** Identify the single requirement that excludes the most attractive candidates.
      *   **Constraint 6 (Theories):** Touch on familiar norms (Knowledge, Truth, etc.) *only* to mark where they fail a requirement. Do not score them fully.

  2.  **Deconstruct the Purpose:**

      *   *Hearer Acquisition:* If I tell you $P$, what do you get? Justification? Entitlement? A guarantee? The norm needs to explain why testimony transmits epistemic status.
      *   *Institutional Obligation:* If a health agency or government speaks, what do they owe us? Accuracy? Due diligence? Transparency? The norm needs to scale from individual to collective and handle high-stakes public trust.

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Distinction 1: Sincerity vs. Warrant.* I can believe $P$ (sincere) but have no evidence (unwarranted). Or I have evidence but don't believe (insincere). The norm must track the *right to assert*, not just the psychological state.
      *   *Distinction 2: Defective Act vs. Blameworthy Speaker.* I might assert $P$ without knowing it (defective) but be blameless because I had good evidence (blameless). The norm governs the act, not necessarily the moral culpability.
      *   *Distinction 3: Constitutive vs. Regulative.* Is assertion *defined* by the norm (like chess moves) or just regulated (like driving)? If constitutive, violating it means you didn't really assert. If regulative, you asserted but did it badly. Given the "institutional" purpose, a constitutive element seems strong for defining the institution of testimony, but a regulative element helps with "bad" assertions that still count as assertions. Let's aim for a hybrid or clarify the tension.
      *   *Case: Hedged vs. Unhedged.* "It might rain" vs. "It will rain." The norm must explain why hedging changes the normative commitment.
      *   *Case: Disavowing Knowledge.* "P, but I don't know P." (Moore's Paradox style). This is infelicitous. The norm should explain why.
      *   *Case: Downstream Stakes.* I tell a friend a rumor. It's low stakes for us, but a doctor hears it and treats a patient. The norm needs to handle third-party reliance.
      *   *Case: Assertion to No One.* Diary entry? Soliloquy? Does the norm apply if there's no hearer to acquire anything? (This challenges the "Hearer Acquisition" purpose).
      *   *Case: Collective Assertion.* Press releases. No single mind knows $P$. The norm must accommodate distributed epistemic labor.
      *   *Case: Contested Truth-Aptness.* "Stealing is wrong." Is this true/false? If the norm requires Truth/Knowledge, this is tricky. The norm needs to handle non-descriptive assertions if institutions make them.

  4.  **Sorting Requirements:**

      *   *Non-Negotiable:* Must explain hearer entitlement (Purpose A), must explain institutional accountability (Purpose B), must distinguish act defect from speaker blame (fairness), must handle collective agency (modern reality).
      *   *Negotiable:* Constitutive vs. Regulative (maybe it's both?), Single Unitary Rule (maybe it's a cluster?), Truth-Aptness requirement (maybe it's about commitment rather than truth).
      *   *Mere Prejudice:* Must be "Knowledge" (epistemic imperialism), Must be context-invariant (ignores stakes), Must be individualistic (ignores collectives).

