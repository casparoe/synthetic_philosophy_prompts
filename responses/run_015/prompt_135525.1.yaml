answer: |-
  ### The Curator's Honesty Check: From Object to Label

  **1. Context: Where was it deposited?**
  *   **Structured** (Grave, Shrine, Hoard) → Go to 2
  *   **Mixed** (Midden, Floor Debris, Plowzone) → Go to 2

  **2. Wear: Does it show signs of lifetime use?**
  *   **Yes** (Polish, chips, repair) → Go to 3
  *   **No** (Pristine, fresh break) → Go to 3

  **3. Multiplicity: Is it one-of-a-kind or standard?**
  *   **Unique** (Custom craftsmanship) → Go to 4
  *   **Mass-Produced** (One of hundreds) → Go to 4

  **4. Associates: What was found immediately alongside it?**
  *   **Admin** (Weights, sealings, tallies) → Go to 5
  *   **Iconic** (Images of beings, altars) → Go to 5
  *   **Domestic** (Cooking, tools, nothing) → Go to 5

  **5. The Belief Gateway: Does it explicitly name or depict a supernatural agent?**
  *   **Yes** (Inscription, clear iconography) → Go to 6
  *   **No** (Ambiguous, abstract, or purely functional) → **LEAF: Social Ritual / Agnostic** *(Note: You cannot claim "belief" here without Node 5)*

  **6. The Analogy Check: What culture are you comparing this to?**
  *   **Continuous/Contemporary** (Direct lineage or neighbor) → Go to 7
  *   **Distant/Convenient** (Colonial record, much later, geographically remote) → **LEAF: Tentative Analogy Only** *(Note: Do not claim specific belief)*

  **7. Exclusivity: Who could access the materials or skill?**
  *   **Elite** (Rare imports, high labor) → Go to 8
  *   **Common** (Local clay, standard skill) → **LEAF: Household Craft / Group Identity**

  **8. Intent: Was it meant to be kept or permanently left?**
  *   **Kept/Retrieved** (Heirloom, Tool) → **LEAF: Status Competition / Bureaucratic Record**
  *   **Left/Broken** (Votive, Grave Good) → **LEAF: Cult Practice / Ancestor Care**

  ***

  ### ⚠️ Indistinguishable Pairs (The "Vibe" Trap)
  *The evidence leads to these two leaves equally. Do not split them based on preference.*

  *   **Votive Deposit vs. Valuable Loss:** A pristine object found in a sanctuary context (Node 1: Structured + Node 2: No Wear). Did they leave it for a god, or did they drop it and never find it? The physical trace is identical.
  *   **Ancestor Care vs. Status Display:** A unique, high-value object in a grave (Node 7: Elite + Node 8: Left). Is it a gift for the dead (belief) or a signal to the living about the family's wealth (status)? The object serves both functions simultaneously.

  ### 🚫 Unoccupied Combinations (The Logical Gaps)
  *These paths are allowed by the questions above, but you will rarely find a serious curator occupying them.*

  1.  **Heavy Wear + Made for Deposition:** (Node 2: Yes + Node 8: Left/Broken *specifically for ritual*).
      *   *Why empty:* **Incoherent.** If an object was manufactured specifically for a ritual deposit, it should not show signs of prior lifetime use. If it does, it's an heirloom, not a dedicated offering.
  2.  **Distant Analogy + Definitive Belief Claim:** (Node 6: Distant → Node 5: Yes → Leaf: Cult Practice).
      *   *Why empty:* **Methodologically Forbidden.** Rigorous curators downgrade the claim to "Tentative" (as per the flowchart) because using a 19th-century colonial record to define a 1st-century BCE belief is speculative.
  3.  **Mass-Produced + Unique Status Competition:** (Node 3: Mass-Produced → Node 7: Elite → Leaf: Status Competition).
      *   *Why empty:* **Sociologically Unattractive.** If everyone owns the object (mass-produced), it signals group identity, not individual status differentiation. Claiming it signals "elite status" contradicts the multiplicity evidence.
