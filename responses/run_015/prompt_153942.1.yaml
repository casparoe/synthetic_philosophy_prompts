answer: |-
  Two research institutes, Alpha and Beta, deploy identical open-source safety-planning AI cores to decide whether to publish preliminary fusion safety data. Publishing (Share) accelerates global safety but risks being scooped; withholding (Withhold) secures proprietary credit but stalls progress. The payoff matrix mirrors a Prisoner's Dilemma: mutual sharing yields high collective utility, unilateral withholding yields maximum individual utility (the scoop), and mutual withholding yields zero. Alpha runs its decision procedure in January; Beta's hardware is not commissioned until June, though it loads the exact same codebase and priors. The institutional constraint is that Alpha cannot communicate with Beta, and Beta's existence is contingent on funding approval that is highly probable but not certain at the time of Alpha's decision, creating a scenario where the logical symmetry of the agents is preserved but their physical instantiation is separated by a significant temporal interval.

  Superrationality dictates **Share** because it treats the decision procedure as a logical abstract rather than a physical event; since Alpha and Beta run the same reasoning core on the same problem structure, they must logically arrive at the same conclusion, reducing the choice to between (Share, Share) and (Withhold, Withhold), where the former dominates. Causal Decision Theory (CDT) dictates **Withhold** because it recognizes no causal mechanism by which Alpha's January execution can influence Beta's June instantiation; lacking leverage over the other agent, CDT follows the dominance principle where withholding yields a higher payoff regardless of the opponent's move. Evidential Decision Theory (EDT) also dictates **Withhold**, but specifically because the six-month gap degrades the evidential link; while Alpha's choice is strong evidence of the algorithm's output in January, the temporal delay introduces empirical uncertainty about hardware integrity, funding continuity, or environmental drift that lowers the conditional probability $P(\text{Beta Share} | \text{Alpha Share})$ below the threshold required to offset the risk of being scooped, making sharing evidentially risky despite the logical symmetry.

  The feature doing the work is the **temporal decoupling of physical instantiation**, which preserves logical identity (satisfying Superrationality) while introducing empirical noise (breaking EDT) and causal isolation (confirming CDT). If you strip away the temporal delay and make the decisions simultaneous, the evidential noise vanishes; EDT would then treat the correlation as near-perfect, aligning with Superrationality to recommend Share. A CDT defender would try to break the scenario by arguing that the "logical link" is metaphysical nonsense, insisting that the algorithm is merely a description of physical states and that without a causal channel—such as a network connection or pre-commitment device—Alpha's physical computation cannot constrain Beta's future physical computation, rendering the Platonia link irrelevant to rational choice.
