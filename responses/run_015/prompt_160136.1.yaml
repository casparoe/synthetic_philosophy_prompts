      *   *Check the embedding:* "If it's raining and I don't believe it..." If I say this, am I asserting the conjuncts? No. So the pragmatic clash shouldn't happen. If the user hears it as broken, they are likely "simulating" the assertion. I need to tell them they might be wrong about their intuition here, or at least that it's not the standard data point.
