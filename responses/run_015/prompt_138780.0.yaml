answer: |-
  ### The "Randomness Vet" Protocol

  **Time:** 10 minutes per claim.
  **Users:** Editors, Fact-Checkers, Writers.
  **Goal:** Distinguish empirical frequency from modeling assumption.

  #### 1. The Checklist (Ordered Questions)

  **Q1. Is there a physical or procedural generator?**
  *   **Ask:** "What physical process or study design actually selects the object/event?"
  *   **Sufficient Answer:** A description of a mechanism (e.g., "a lottery machine," "a randomized controlled trial," "quantum decay," "a census list").
  *   **Stop Rule:** If **Yes**, go to Q2. If **No** (the selection is hypothetical or conceptual), go to Q3.

  **Q2. Does the reported number match the generator?**
  *   **Ask:** "Does the math reflect the mechanism described, or does it assume a perfect version of it?"
  *   **Sufficient Answer:** Confirmation that the probability accounts for known biases in the generator (e.g., weighted sampling, non-response rates).
  *   **Stop Rule:** If **Yes**, **VERDICT: PRINT**. If **No** (the math assumes ideal randomness the mechanism doesn't provide), **VERDICT: AMEND** (add "idealized" or "theoretical").

  **Q3. Is the sample space finite and enumerable?**
  *   **Ask:** "Can we list every possible outcome?"
  *   **Sufficient Answer:** "Yes, there are 5,000 street trees" vs. "No, the universe is infinite."
  *   **Stop Rule:** If **Yes**, assume Uniform Distribution (see Default below) and **VERDICT: PRINT**. If **No**, go to Q4.

  **Q4. The Ruler Test (Sensitivity Check).**
  *   **Ask:** "If we measure 'random' using a different but equally natural unit (length vs. area, time vs. frequency), does the probability change?"
  *   **Sufficient Answer:** "No, it is invariant" or "Yes, but we have a physical reason to prefer this ruler."
  *   **Stop Rule:** If the number changes significantly without physical justification, **VERDICT: DO NOT PRINT** (or reduce to qualitative).

  **Q5. Is the vagueness pedagogical?**
  *   **Ask:** "Is this for a child or a general introduction where precision obscures the point?"
  *   **Sufficient Answer:** "Yes, the goal is intuition, not calculation."
  *   **Stop Rule:** If **Yes**, **VERDICT: PRINT** (with internal note). If **No**, and you reached here, **VERDICT: DO NOT PRINT**.

  ---

  #### 2. The Core Distinction: Found vs. Made

  You must distinguish between **Found Frequency** and **Made Measure**.

  *   **Found Frequency:** The randomness comes from the world. (Example: A drug trial where patients are actually assigned by a computer generator; a radioisotope decaying). The number reports a property of the system.
  *   **Made Measure:** The randomness comes from the analyst's ignorance or convenience. (Example: Picking a "random" point on a line, choosing a "random" year in history). The number reports a choice of how to count.

  **The Rule:** If the randomness is **Made**, the text must explicitly state that the number depends on the choice of measure. If it implies the number is a property of the world, it is misleading.

  ---

  #### 3. The Sensitivity Step (The Ruler Test)

  This catches the Bertrand's Paradox failure.

  *   **Procedure:** Identify the object being randomized (e.g., a chord, a galaxy, a time interval). Identify two different ways to define "uniform" over that object (e.g., uniform by endpoint vs. uniform by midpoint; uniform by time vs. uniform by volume).
  *   **Calculation:** Ask the writer to estimate the probability using both definitions.
  *   **Disqualification Threshold:** If the probabilities differ by more than a factor of 2, or if the qualitative conclusion (likely/unlikely) flips, the claim is **disqualified** unless there is a physical reason to prefer one ruler.
  *   **Stopping Point:** Try **two** alternatives. If both yield the same result, pass. If they diverge, fail. Do not search for a third "correct" one; the divergence itself is the story.

  ---

  #### 4. Handling Hard Cases

  *   **Finite but Unenumerated Population:** (e.g., "random street tree" without a full census). **Treat as Found Frequency.** Require an estimate of the sampling frame. If the frame is unknown, Amend to "estimated."
  *   **Infinite Population:** (e.g., "random number," "random point in space"). **High Risk.** Requires a defined density function. If none is given, Default to Uniform over the bounded region of interest. If unbounded, **Do Not Print**.
  *   **Event vs. Object:** (e.g., "randomly occurring earthquake"). Randomness must attach to the *time* or the *location*. Specify which. If unspecified, **Amend**.
  *   **Simulation:** Randomness lives in the algorithm's seed and distribution. **Treat as Made Measure.** The validity depends on the model, not the world. Label as "model-dependent."
  *   **Pedagogical Vagueness:** (e.g., children's science). **Bypass Q4.** If the goal is intuition, "random" can mean "unpredictable." Mark as "Educational Exception."

  ---

  #### 5. Editorial Hand-Offs

  The procedure cannot decide these; you must:

  *   **The Cost of Precision:** If fixing the ambiguity requires three paragraphs of nuance that kill the narrative flow, you must decide if the number is worth keeping at all.
  *   **The "Good Enough" Claim:** In speculative science (cosmology, economics), precise probabilities are often impossible. You must decide if a "Made Measure" is interesting enough to publish as a thought experiment, provided it is labeled as such.
  *   **The Headline Test:** If the nuance required to make the number accurate cannot fit in the headline or the numbers box, cut the number.

  ---

  ### Application to Live Cases

  **(a) City Forestry: "One-in-four chance a random street tree is a maple."**
  *   **Q1 (Generator):** Hypothetical selection from existing trees.
  *   **Q3 (Finite):** Yes, street trees are finite.
  *   **Default:** Uniform over the list of trees.
  *   **Verdict:** **PRINT.**
  *   **Reasoning:** This is a proportion masquerading as a probability. The population is physically defined and enumerable (in principle). The "randomness" is just a stand-in for "if you counted them all." No measure ambiguity exists.

  **(b) Astronomy: "Half-percent chance a random orbit is aligned for transits."**
  *   **Q1 (Generator):** Physical orientation of planetary systems.
  *   **Q2 (Match):** Isotropy of space is a physical law (Found Frequency).
  *   **Q4 (Ruler Test):** Orientation is defined by solid angle. Changing the parameterization (e.g., inclination vs. projected area) yields the same physical probability because the physics dictates the measure.
  *   **Verdict:** **PRINT.**
  *   **Reasoning:** This is a geometric probability fixed by the physics of 3D space. It is not a choice of measure; it is a property of spheres.

  **(c) Cosmology: "Chance a random observer finds herself in a Milky Way-like galaxy..."**
  *   **Q1 (Generator):** "Random observer" in an eternally inflating universe.
  *   **Q3 (Finite):** No, population is infinite.
  *   **Q4 (Ruler Test):** **FAIL.** This is the "Measure Problem." Defining "random" by volume, by baryon count, or by world-line yields different, incompatible probabilities.
  *   **Verdict:** **DO NOT PRINT** (as a number).
  *   **Reasoning:** There is no unique, physically justified measure for "random observer" in this context. The number reports a modeling choice, not a fact.
  *   **Action:** Commission a rewrite. The story is the *uncertainty* of the measure, not the number itself.

  **(d) Your Chord Column**
  *   **Q4 (Ruler Test):** **FAIL.** You identified three natural parameterizations yielding 1/3, 1/2, and 1/4.
  *   **Verdict:** **CORRECTION OWED.**
  *   **Reasoning:** You presented a "Made Measure" as a fact. The procedure confirms your suspicion: the question "random how" is necessary but insufficient because multiple "hows" are equally valid. You must publish a clarification that the probability is undefined without a specific selection mechanism.

  ---

  ### Constraints & Defenses

  **The Default Position**
  Where a paper says "chosen at random" and is silent on the method, assume **Uniform Distribution over the Physically Defined Sample Space.**
  *Defense:* This assumes minimum information beyond the physical boundaries of the system, which is the standard null hypothesis in physical sciences; any other assumption requires explicit justification.

  **Answer to "All Probability is Conditional"**
  Your writers are technically correct: every probability $P$ depends on background information $I$. However, communication relies on shared implicit $I$. When we say "a random coin flip," the implicit $I$ is "fair coin, standard gravity." When a writer says "a random chord" without specifying the selection method, the implicit $I$ is ambiguous, not shared. The procedure does not deny conditionality; it demands that the *conditions* (the measure) be explicit when they are not standard. We are not policing math; we are policing clarity.

  **Limitations & The Ban**
  This procedure cannot fix bad data or dishonest authors. It also cannot resolve deep philosophical disputes in quantum mechanics or cosmology where the "physical generator" is itself debated.
  **Honest Upshot:** You should **ban the word "random" in headlines and number boxes** unless it refers to a **Found Frequency** (physical generator or finite census). In body copy, allow "random" only if the "Made Measure" is explicitly acknowledged as a modeling assumption. If a writer cannot define the selection procedure in one sentence, they are not allowed to use the word.
