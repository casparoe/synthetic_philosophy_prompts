  2.  **Deconstruct the Core Problem:**

      *   The core issue is *reference class ambiguity* and *measure ambiguity*.
      *   "Random" implies a distribution. If the distribution isn't fixed by physical reality or study design, it's a choice. If it's a choice, is it justified?
      *   Bertrand's Paradox shows that "uniform distribution" is not invariant under transformation.
      *   The procedure needs to distinguish between *empirical frequencies* (data), *physical propensities* (quantum mechanics, randomized trials), and *principles of indifference* (guessing).

  3.  **Drafting the Procedure (Iterative Process):**

      *   *Attempt 1:* Ask for the source. If data, good. If theory, check assumptions.
      *   *Critique 1:* Too vague. Needs to be a checklist.
