answer: |-
  The disagreement is largely terminological regarding the definition of "cost," but it protects a substantive empirical gap concerning whether human moral signaling operates under conditions of high conflict requiring net fitness reductions or aligned interests allowing recoverable investments. In formal signaling theory, it is settled that honest signaling requires costs to be differential—marginally cheaper for high-quality individuals than for low-quality individuals—to prevent cheating when interests conflict. However, it remains contested whether these costs must result in a net fitness loss (waste) or merely represent an expense offset by greater benefits, such as status or cooperation. Proponents of the strict handicap view equate stability with phenomenological waste, insisting that only irrecoverable loss guarantees honesty, while critics utilize broader game-theoretic models where "cost" refers to ex ante risk or opportunity cost that yields a net positive return via reputation. This verbal divergence allows both sides to claim compatibility with the same ethnographic data: one side sees the resource expenditure as the guarantee, the other sees the social return as the mechanism.

  Progress is stalled because neither side prioritizes measuring the net fitness impact of moral displays, which is empirically difficult in humans, nor do they rigorously define the conflict-of-interest structure within the specific groups studied. To move forward, researchers must distinguish between ex ante committed risk, which functions as a bond, and ex post observable waste, which functions as a sink. A productive path involves empirical studies tracking who actually bears the burden of altruistic acts over a lifetime to determine if high-status individuals suffer net losses or net gains compared to low-status individuals. Additionally, formal models should reconceptualize the signaling environment to specify the degree of interest alignment; if interests are sufficiently aligned through kin selection or long-term reciprocity, cheap talk or low-cost reputation tracking may suffice without handicaps. Until the field separates the mathematical necessity of differential marginal costs from the biological intuition of waste, and explicitly tests the net fitness consequences of moral behavior, the debate will remain a verbal dispute masking an empirical void.
