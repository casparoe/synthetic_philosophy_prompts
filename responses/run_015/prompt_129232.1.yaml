      *   *Benacerraf 1 (Identification):* Translates to *Non-Identifiability*. Multiple parameter configurations (A vs. B) yield identical loss landscapes and input-output mappings but have different internal geometries (von Neumann vs. Zermelo latents). Conclusion: The "numbers" aren't the specific activation vectors; they are the *functional role* within the computation graph.
      *   *Benacerraf 2 (Truth/Knowledge Dilemma):*
          *   Horn 1 (Semantics): We want the model's latents to *refer* to specific external entities (real numbers, sets).
          *   Horn 2 (Epistemology): We want the model's knowledge to come from *causal interaction* (training data/gradients).
          *   Conflict: If the "objects" are abstract (like mathematical truths independent of data), there is no gradient signal from them. If we tie truth to the training signal (proofs in corpus), we lose the claim that the model knows "Math" vs. just "Text about Math."
