  8.  **Final Polish:** (Mental check of the "Causal Contact" translation). In ML, causal contact is the data generation process + gradient update. If the object is abstract (e.g., the concept of 'prime'), there is no physical data generation process for the concept itself, only for the *tokens* representing it. This maps well to Benacerraf's causal inertness.

