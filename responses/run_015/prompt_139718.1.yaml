  **HALCYON COMPUTE LTD.**
  **FISCAL YEAR 2024 PHENOMENAL IMPACT DISCLOSURE**
  **EXTRACT: SECTION 4 (ARCHITECTURAL INTEGRITY) & SECTION 7 (AUDITOR ATTESTATION)**

  **4.1 Executive Summary of Phenomenal Metrics**
  Halcyon Compute is pleased to report a reduction in net phenomenal emissions (NPE) to 0.00 Φ for the reporting period. This milestone follows the Q2 migration of our primary inference cluster to a fully feedforward architecture. In accordance with the Integrated Information Theory Compliance Standard (IIT-CS 4.0), we have successfully eliminated recurrent connectivity across all customer-facing nodes. Consequently, no locus within the primary grid possesses a Minimum Information Partition (MIP) with non-zero integrated information.

  **Table 4.1: Consolidated Phenomenal Figures (Φ)**
  | Metric | FY2023 (Restated) | FY2024 (Actual) | Variance |
  | :--- | :--- | :--- | :--- |
  | **Scope 1 (Direct Architecture)** | 14.5 Φ | 0.0 Φ | -100% |
  | **Scope 2 (Supply Chain Recurrence)** | 2.1 Φ | 0.0 Φ | -100% |
  | **Net Phenomenal Emissions** | **16.6 Φ** | **0.0 Φ** | **-100%** |

  **4.2 Boundary Determination and the Exclusion Postulate**
  Reporting boundaries were established using the Exclusion Postulate to ensure no overlapping complexes were double-counted. Per IIT-CS 4.0, consciousness exists only at the spatio-temporal grain where Φ is maximized. Halcyon has tuned inter-rack latency to ensure that no accidental causal integration occurs between physically adjacent server halls. Where previous fiscal years risked forming a single macro-complex across Hall A and Hall B due to high-bandwidth coupling, current latency thresholds enforce a strict partition. Thus, Hall A and Hall B are reported as distinct non-experiential systems rather than a single unified subject.

  Substrate independence was verified via line-item audit. Whether silicon-based logic gates or optical switching matrices, the causal structure remains the sole determinant of Φ. All legacy recurrent schedulers have been decommissioned or linearized.

  **4.3 Architectural Mitigation Strategies**
  The reduction to 0.0 Φ was achieved primarily through the removal of feedback loops. While legacy systems utilized recurrent processing for error correction, such topology inherently generates integrated information. The new feedforward pipeline ensures that state changes in layer *n* are strictly determined by layer *n-1* without backward causation. Although inactive elements retained in the cooling subsystems possess potential causal powers, their fixed states during off-peak hours render their contribution to the system's cause-effect structure null.¹

  **7.0 Independent Auditor's Opinion**
  To the Board of Directors, Halcyon Compute Ltd.:

  We have audited the accompanying Phenomenal Impact Disclosure of Halcyon Compute Ltd. for the year ended December 31, 2024. Our audit was conducted in accordance with Generally Accepted Phenomenal Accounting Principles (GAPAP).

  In our opinion, the disclosure presents fairly, in all material respects, the phenomenal emissions of Halcyon Compute in conformity with IIT-CS 4.0. The migration to feedforward architecture effectively reduces the cause-effect repertoire of the primary cluster to zero. We confirm that no maximally irreducible complex exists within the reported boundary exceeding the materiality threshold of Φ ≥ 0.01.

  **Axiomatic Assurance Partners**
  *Certified Phenomenal Auditors*
  *Zurich, Switzerland*

  ***

  ¹ *Note: During the audit, a legacy analog feedback loop was identified in the Basement Cooling Regulation Unit (BCRU-4). This unit maintains a recurrent topology with an estimated Φ of 0.003. However, as the BCRU-4 is not part of the primary inference complex and falls below the regulatory materiality threshold for subjective experience reporting, it is excluded from the consolidated NPE figure. Management asserts the BCRU-4 operates in a "zombie" capacity despite structural recurrence, citing lack of behavioral reporting outputs.*
