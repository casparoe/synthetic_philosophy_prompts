prompt: |-
  My reading group has a negative-liberty person (freedom = absence of interference by others) and a republican (freedom = non-domination) who've been going at it for a year. Write the joint statement they should have produced — no verdict on who's right. Numbered claims both can sign, then a disagreements table.

  I want to throw a spanner in, though. Consider the *resilience view*: you are unfree to φ to the extent that whether you get to φ depends on the will of another across nearby counterfactuals in which that person's preferences shift — so it isn't standing power that matters, but how fast your option set degrades as someone else's will moves. My hunch is that this cuts across their dispute rather then falling on either side, and that forcing both of them to locate themselves relative to it exposes cruxes the standard examples cover up.

  So: what can both accept (about what needs explaining, about the benign master and voluntary servitude, about whether freedom is one thing or several, about whether it's a moralised concept); the exact wording each side would accept for its own view; the cruxes such that settling one would move at least one of them; and for each crux a concrete case both agree would bear on it — including at least one designed for the resilience view, e.g. an algorithmic Custodian with standing, unappealable power to void any contract you sign above a threshold, bound by published rules, statistically near-never actually voiding one — with each side's prediction written down in advance. Tell me which rows are genuine disagreements and which were only ever about words, and say why.

  Please write in British English.
