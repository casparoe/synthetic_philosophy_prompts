  # JOINT STATEMENT ON THE CONCEPT OF LIBERTY
  **Signed:** The Negative-Liberty Proponent (NLP) & The Republican Proponent (RP)
  **Date:** 24 May 2024
  **Subject:** Clarification of Disputes Regarding Political Freedom

  ## Preamble
  After twelve months of dialectical engagement, we acknowledge that while we share a commitment to liberty as a primary political value, we employ divergent conceptual maps to locate it. We have agreed to halt substantive debate temporarily to catalogue our points of convergence and divergence. Furthermore, at the suggestion of a third-party interlocutor (the 'Resilience View'), we have structured our disagreements to expose whether our differences are merely terminological or substantive. This document records that mapping.

  ## Part I: Common Ground
  *The following claims are endorsed by both signatories. Disagreement lies not in these premises, but in their sufficiency.*

  1.  **The Object of Explanation:** We are analysing a distinctively *political* and *social* concept of freedom, not metaphysical free will. We agree that physical impossibility (e.g., gravity) does not constitute political unfreedom.
  2.  **Interference Counts:** Both parties agree that actual, intentional interference by another human agent reduces a subject's freedom. The dispute is whether interference is *necessary* for unfreedom.
  3.  **The Benign Master:** We agree that the case of the 'Benign Master' (a slave owner who never interferes) is the decisive test case for our theories.
  4.  **Voluntary Servitude:** We agree that a contract entering voluntary servitude requires explanation. We disagree on whether the signer remains free post-signature.
  5.  **Non-Moralisation:** We agree that 'freedom' is not inherently a moralised concept. One can be free to do evil, and unfree to do good. The value of freedom is a separate question from its definition.
  6.  **Plurality:** We acknowledge that 'freedom' might be a cluster concept. However, we both claim to be analysing the specific concept relevant to coercive state power and social status.

  ## Part II: Statements of Position
  *Each signatory accepts the following wording as an accurate representation of their own view, without endorsing the other's.*

  **The Negative-Liberty Proponent (NLP):**
  > "An agent is unfree to $\phi$ if and only if another agent intentionally prevents them from $\phi$-ing, or credibly threatens to do so. Freedom is the silence of the law and the absence of obstacles. The *capacity* of another to interfere, absent the *exercise* of that capacity, does not diminish liberty."

  **The Republican Proponent (RP):**
  > "An agent is unfree to $\phi$ if they are subject to the arbitrary power of another, regardless of whether that power is exercised. Freedom is a status of non-domination. The *capacity* of another to interfere arbitrarily diminishes liberty, even if the *exercise* of that capacity is withheld."

  ## Part III: The Disagreements Table
  *We identify four cruxes. For each, we specify a concrete case, our respective predictions, and how the 'Resilience View' (RV) illuminates the structural difference between us. The RV defines unfreedom as the extent to which option sets degrade across counterfactuals where another's will shifts.*

  | Crux | The Concrete Case | NLP Prediction (Verdict on Freedom) | RP Prediction (Verdict on Freedom) | Resilience View Insight (The Spanner) |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. The Modal Status of Power** | **The Sleeping Guard:** A guard is paid to lock you in a room but falls asleep. The door is physically unlockable from inside, but you believe it is locked. | **Free.** No actual interference occurs; the obstacle is psychological, not physical. | **Unfree.** You are subject to the guard's standing power to lock you in; your exit depends on his continued slumber. | **RV:** Highlights that NLP cares about *actual* extension of options, RP cares about *modal* robustness. RV asks: How easily does the guard wake? |
  | **2. The Source of Unfreedom** | **Voluntary Servitude:** You sign a binding, enforceable contract to obey another's will for life, with no exit clause. | **Free (initially), Unfree (upon interference).** You are free until the master actually issues a command restricting you. | **Unfree (immediately).** The moment the contract is signed, you are dominated. The relationship itself constitutes unfreedom. | **RV:** Asks how sensitive your options are to the master's shifting whims. If the contract binds *them* too, resilience is higher. |
  | **3. The Algorithmic Custodian** | **The Custodian:** An algorithm has standing, unappealable power to void any contract you sign above £10k. It is bound by published rules. It statistically near-never voids one. | **Free.** The rules are fixed. No human will is arbitrarily interfering. No actual voiding occurs. | **Unfree.** The power exists. The rules can be changed by the programmers. You live at the mercy of the system's architects. | **RV:** **Crucial Test.** If the code is rigid, the 'will' rarely shifts. RV suggests *high resilience* (more free) compared to a human master, challenging RP's binary 'power = unfreedom' claim. |
  | **4. The Nature of the Obstacle** | **The Unreliable Bridge:** A private owner maintains a bridge you need. He is not obliged to keep it open, but usually does. He closes it for repairs without notice once a year. | **Unfree (only when closed).** When open, no interference. When closed, interference. | **Unfree (continuously).** Your access depends on his will. The lack of a right to passage is domination. | **RV:** Measures the *rate of degradation*. If closures are predictable, resilience is higher. If arbitrary, resilience is lower. NLP misses the anxiety cost. |

  ## Part IV: Analysis of Verbal vs. Genuine Disagreement
  *Following the introduction of the Resilience View, we have categorised the nature of our disputes.*

  **Row 1 (The Sleeping Guard): Largely Verbal.**
  *   **Analysis:** We agree on the physical facts. The NLP defines freedom as the *exercise* of power; the RP defines it as the *existence* of power. The Resilience View shows this is a disagreement about which modal 'nearby worlds' count. NLP counts only the actual world; RP counts all worlds where the guard wakes.
  *   **Verdict:** **Verbal.** We are carving the concept at different joints. If we agreed to call RP's concept 'Security' and NLP's 'Liberty', the dispute would dissolve, though political stakes remain.

  **Row 2 (Voluntary Servitude): Genuine.**
  *   **Analysis:** This is not merely definitional. It concerns the moral psychology of the agent. RP claims the *status* of being a servant damages agency even without commands. NLP denies this.
  *   **Verdict:** **Genuine.** Settling this requires empirical psychology: does the *knowledge* of potential interference alter behaviour in a way that constitutes a loss of agency?

  **Row 3 (The Algorithmic Custodian): Genuine (The Crux).**
  *   **Analysis:** This case is designed to break the standard deadlock.
      *   **NLP** says: Rules are not wills. Therefore, no domination.
      *   **RP** says: Programmers have wills. Therefore, domination.
      *   **RV Insight:** The RV suggests that if the algorithm is sufficiently rigid, the 'will' is effectively removed from the counterfactual equation.
      *   **Why it moves us:** If the RP accepts that a sufficiently rigid algorithm reduces unfreedom (per RV), they must admit that *arbitrariness* (ease of will-shift) matters more than *standing power*. If the NLP accepts that the *threat* of voiding alters behaviour even if never exercised, they must admit that *probability* matters, not just *actuality*.
  *   **Verdict:** **Genuine.** This exposes whether we care about the *structure of power* (RP) or the *outcome of power* (NLP).

  **Row 4 (The Unreliable Bridge): Mixed.**
  *   **Analysis:** Partly verbal (definition of 'obstacle'), partly genuine (whether anxiety constitutes a reduction in freedom).
  *   **Verdict:** **Mixed.** The RV clarifies that 'freedom' might be a gradient based on the stability of access, rather than a binary state.

  ## Concluding Remark
  We acknowledge that the Resilience View does not solve our dispute but relocates it. It suggests that the Negative-Liberty Proponent underestimates the cost of *instability*, while the Republican Proponent may overestimate the cost of *regulated power*. We agree to suspend judgement on Row 3 pending further analysis of the Algorithmic Custodian case.

  ***

  ### Scribe's Note on the Disagreements (For the Reading Group)

  **Which rows are genuine and which are verbal?**

  1.  **Row 1 (Sleeping Guard) is mostly verbal.** The NLP and RP are looking at the same landscape but using different maps. NLP maps 'freedom' to *movement*; RP maps 'freedom' to *status*. The Resilience View shows that if we treat freedom as a scalar property of option-sets across possible worlds, the Guard case is just a dispute about how wide the 'nearby counterfactuals' radius is. NLP sets the radius to zero (actual world only); RP sets it to 'possible'. This is a definitional stipulation.

  2.  **Row 3 (Algorithmic Custodian) is the Genuine Crux.** This is where the Resilience View throws the spanner most effectively.
      *   **Why?** Because it decouples *Standing Power* (RP's trigger) from *Will-Shift Sensitivity* (RV's trigger).
      *   **The Exposure:** The RP claims the Custodian case is unfreedom because power *exists*. The NLP claims it is freedom because interference *does not occur*. The RV asks: "How hard is it to change the code?"
      *   If the code is immutable, the RV says you are *resiliently free*, even if the RP says you are dominated.
      *   If the RP insists you are unfree even with immutable code, they reveal their concept is about **Hierarchy**, not Freedom.
      *   If the NLP admits you are unfree because the *threat* alters your contracting behaviour, they reveal their concept relies on **Psychological Effects**, not just Physical Obstacles.
      *   **Conclusion:** This row forces them to admit if they are arguing about *politics* (hierarchy) or *liberty* (option sets). That is a genuine, substantive disagreement about the nature of the good being pursued.

  3.  **Row 2 (Voluntary Servitude) is Genuine but Psychological.** It hinges on whether 'status' has causal power over the agent's mind independent of specific commands. This is an empirical question about human psychology that both sides often treat as conceptual.

  **Why the Resilience View matters:**
  It prevents the RP from hiding behind 'status' and the NLP from hiding behind 'non-interference'. It forces both to quantify *how much* freedom is lost based on the *probability* of interference. It turns a binary shouting match into a calibration problem.
