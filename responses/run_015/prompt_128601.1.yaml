answer: |-
  The salamander valley: neighbors mix, ends don't. Is there one true count, or does the right answer depend on whether you're managing habitat vs. naming specimens?
  ├─ Depends on the job → **PLURALISM**
  │  • Awkward commitment: You can't settle arguments between a park ranger and a geneticist.
  │  • Saturday morning apply: Yes
  └─ One true count → The clonal crayfish: no sex, distinct. Since they break the normal pattern, does this make you feel the word 'species' is just a convenient drawer we put specimens in?
     ├─ Yes, word is failing us → **NOMINALISM**
     │  • Awkward commitment: Conservation laws protect nothing real.
     │  • Saturday morning apply: Yes
     └─ No, we can define it properly → The hot spring microbes: swapping genes sideways. Is their species identity defined by who they swap genes with now?
        ├─ Yes, by gene exchange → **BIOLOGICAL SPECIES CONCEPT**
        │  • Awkward commitment: Clones and fossils aren't species.
        │  • Saturday morning apply: No
        └─ No, by history or role → The hybrid willow: fertile, distinct from parents. Is it a new species because it holds its own ground ecologically, or because it has a unique combination of traits?
           ├─ Holds own ground → **ECOLOGICAL SPECIES CONCEPT**
           │  • Awkward commitment: Two identical populations in different woods are different species.
           │  • Saturday morning apply: Maybe
           └─ Unique traits/history → The lichen on the church wall: fungus swaps partners. Do you split them because the partnerships look different (identifiable now), or keep them together because the fungus ancestry is the same (continuous history)?
              ├─ Split on looks → **PHYLOGENETIC SPECIES CONCEPT**
              │  • Awkward commitment: Every distinct family tree is a species, even if identical twins.
              │  • Saturday morning apply: Yes
              └─ Together on history → **LINEAGE VIEW**
                 • Awkward commitment: You can't know for sure until the lineage is extinct.
                 • Saturday morning apply: No

  ### The Lathe Question

  | Position | Where it Starts | What Belongs | When it Ends | Silently Borrows From |
  | :--- | :--- | :--- | :--- | :--- |
  | **Pluralism** | Depends on purpose | Depends on purpose | Depends on purpose | All other concepts |
  | **Nominalism** | We draw the line | What we put in the drawer | We stop using the name | Nothing ( denies reality) |
  | **Biological (BSC)** | Reproductive isolation | Interbreeding population | Extinction or fusion | Population Ecology |
  | **Ecological (ESC)** | Niche shift | Organisms filling role | Niche loss | Ecosystem Function |
  | **Phylogenetic (PSC)** | Diagnosable difference | Trait sharers | Trait loss | Character Analysis |
  | **Lineage (ESCev)** | Lineage split | All descendants | Extinction | Deep Time |

  **Flags & Warnings**

  *   **Indistinguishable Leaves:** In the field, **Phylogenetic** and **Lineage** often yield the same count. You usually need DNA or fossils to tell if you're splitting on traits (PSC) or history (Lineage).
  *   **Undefended Combination:** **Nominalism + Conservation Realism.** If you tick Nominalism ("species aren't real"), you cannot consistently argue that "protecting species" is protecting anything objective. This is usually incoherent unless you mean "protecting habitats we like."
  *   **Unattractive Combination:** **Biological + Clonal Reality.** If you tick Biological, you must admit the clonal crayfish isn't a species. Most volunteers find this unattractive for conservation work.
  *   **Unexplored Combination:** **Ecological + Gene Flow.** Some argue niche defines the species even if gene flow happens (e.g., the willow). This tree forces a choice, but nature often blends them.
