      *   *Refinement:* Let's look at the *Removalists*. They condemn the past (Critical) to make way for a new future, but they often frame the removal itself as a Monumental act of justice. However, the strongest tension is in the **Curators/Municipal Compromisers**. They preserve the artifact (Antiquarian) to subject it to judgment (Critical). This creates a tension Nietzsche might see as paralyzing.
      *   *Wait, a better candidate:* The **Heritage Defenders**. They claim Antiquarian reverence ("history is history"), but they are actually fighting for a **Monumental** narrative (the Lost Cause, the heroic ancestor). They use Antiquarian methods (preservation) to serve a Monumental end (inspiration). This fits Nietzsche's warning about modes blinding each other.

  4.  **Tackle the Three Hard Questions:**

