answer: |-
  Here is the mapping, the friction points, and the verdict.

  ### The Mapping

  **The Removal Campaigns (Activists, Crowds):** These are practitioners of **Critical History**. They bring the past before a tribunal. The statue is not a record; it is an accusation. By toppling it or demanding its removal, they are performing the necessary violence Nietzsche describes: breaking the past so the present can breathe. They are not interested in the statue's age or craftsmanship; they are interested in its effect on current vitality.

  **The Heritage/Preservation Groups & Protective Legislatures:** These are ostensibly **Antiquarian**. Their language is of "preservation," "erasure," and "respecting the object." They treat the statue as a relic of the local soil that must not be disturbed. However, this is a cover. They are actually defending a **Monumental** narrative. They do not want to preserve the statue merely because it is old (pure Antiquarianism would accept its decay); they want to preserve it because it inspires a specific lineage of identity (the "Heroic South").

  **The Curators (Move to Museums/Contextualize):** This is the **Antiquarian** mode swallowing the **Critical**. By moving the object indoors, they preserve the artifact (Antiquarian) but strip it of its public power. The wall text attempts a Critical judgment, but by housing the object, the institution ultimately validates its existence as worthy of care.

  **The Dual-Mode Actor:**
  The **Heritage Defenders/Legislatures** are the ones practicing two modes simultaneously, and it is a toxic mixture. They deploy **Antiquarian** rhetoric ("we must not erase history") to secure a **Monumental** end ("we must honor our ancestors").
  Nietzsche warns that when modes blur, they cease to serve life and become idols. By claiming to be neutral preservers (Antiquarian), they shield themselves from the moral judgment of Critical history. But by protecting the inspirational power of the figure (Monumental), they refuse to let the past die. This dual stance creates a paralysis: they claim the neutrality of the archivist while fighting the culture war of the ideologue. This isn't a synthesis; it's a bad faith maneuver that prevents the culture from moving forward. It proves Nietzsche's point that mixing the modes without a dominant instinct leads to confusion and sickness.

  ### The Hard Directions

  **1. Critical History vs. The Rhetoric of Justice**
  You are forcing the fit, but productively. Nietzsche's "Life" is pre-moral; it is about vitality, strength, and the capacity to create the future. The rhetoric of the removal campaigns is deeply moralistic ("Justice," "Recognition," "Wrongful Harm"). Nietzsche would likely view this moralizing as a form of *ressentiment*—a slave morality seeking to negate the past rather than overcome it.
  However, functionally, the fit holds. The *mechanism* is Critical: the past is judged and condemned to liberate the present. Whether the motivation is "Justice" (moral) or "Life" (vitalist) matters less than the action of breaking the chain. The schema misdescribes the *actors' self-conception* (they think they are moral arbiters, not vitalists), but it accurately describes the *historical function* they are performing. It matters for the analysis because it suggests the removal might not lead to the health Nietzsche promises. If the drive is moral guilt rather than vital strength, the "liberation" might just be a new form of bondage to a different dogma.

  **2. The Plaque and the Non-Monumental Memorial**
  The plaque is not a hybrid; it is a symptom of weakness. Nietzsche's taxonomy assumes a culture with the strength to choose: either venerate (Monumental/Antiquarian) or destroy/judge (Critical). The plaque attempts to venerate the object's existence (Antiquarian) while judging its meaning (Critical). This creates a "history of the middle," which Nietzsche would see as historically indigestible. It asks the viewer to hold two contradictory impulses at once, resulting in neither reverence nor liberation, but mere confusion.
  As for the low wall of names (e.g., the Vietnam Veterans Memorial): This is not a new category. It is **Monumental History** with a changed aesthetic. It still serves to inspire, to unify the living around a shared sacrifice, and to create a pilgrimage site. It does not judge the war critically, nor does it merely collect relics antiquarianly. It uses the dead to speak to the living. The taxonomy holds; the style change is irrelevant. The failure of the plaque shows that you cannot institutionalize Critical history. Once you bolt the judgment to the stone, the judgment becomes part of the monument, and the monument wins.

  **3. Digital Permanence and the End of Forgetting**
  This is where the scheme breaks. Nietzsche ties healthy Critical history to the ability to *forget*—to draw a horizon around oneself. He assumes the past can be pushed out of the active sphere. In the monument fight, nothing is forgotten. A toppled statue is filmed, uploaded, scanned, and archived. It becomes more visible digitally than it ever was physically.
  Critical history requires the past to lose its grip. But if the image of the statue is permanently available, the past retains its grip. We are living in an era of total Antiquarianism because we *cannot* lose the record. Critical history becomes impossible when "destruction" is just another form of "data collection." We are not breaking the past; we are curating its destruction. This suggests that Nietzsche's cure (Critical history) is unavailable to a culture that cannot erase. We are condemned to carry the weight of everything, which is the definition of historical sickness.

  ### The Verdict

  Here is the definite claim: **The Confederate monument fight demonstrates that Nietzsche's taxonomy is not a toolkit for resolving historical disputes, but a diagnostic triage for a culture that has already lost its "plastic power."**

  The fact that we are debating *which mode* to use proves we are already sick. A healthy culture does not vote on whether to be Critical or Antiquarian; it instinctively *uses* history and then discards it. The existence of the debate—the committees, the laws, the plaques, the nighttime topplings—is evidence that American culture has lost the horizon Nietzsche describes. We are drowning in history. The taxonomy explains the *symptoms* (the conflicting impulses of the actors) perfectly, but it offers no *cure* because the condition for the cure (the ability to forget and act instinctively) is gone. The scheme is diagnostically brilliant but prescriptively obsolete in an age of total archival retention.

  ### The Move I Least Want a Nietzsche Scholar to Read

  The move I am most vulnerable on is my claim in section 3 that **digital archival permanence equates to an inability to forget.**

  A rigorous Nietzsche scholar would argue that I am conflating *external memory* (archives, videos, data) with *internal, vital forgetting* (the psychological capacity to close the horizon). Nietzsche's "forgetting" is an active faculty of the soul, not a material condition of the record. One could theoretically have a million digital scans of a statue and still possess the "plastic power" to ignore them and live unburdened. By blaming the *technology* of the archive for the *psychological* sickness, I am materializing a spiritual concept. I am letting the actors off the hook by blaming the internet, whereas Nietzsche would insist the sickness is in the will, regardless of the server storage.
