      *   *Selected Claim:* The Confederate monument fight proves Nietzsche's taxonomy is not a menu of options, but a diagnostic of pathology. The existence of the debate *itself* signals that the culture has lost the "plastic power" to use history instinctively. We are analyzing history because we cannot *live* it. The "Plaque" compromise is the smoking gun of this sickness.

