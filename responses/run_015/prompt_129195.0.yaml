      *   *Q1 (Justice vs. Life):* Acknowledge the friction. Nietzsche's "Life" is pre-moral. The removalists are moralistic. This makes their Critical history unstable. It risks becoming just another dogma.
      *   *Q2 (The Plaque):* It's not a hybrid. It's a failure. It's "Antiquarianism with a guilty conscience." It refuses the violence of Critical history. Non-monumental memorials are still Monumental (they inspire).
      *   *Q3 (Forgetting):* This is the killer. Digital permanence makes Critical history impossible. You can't "break" the past if it's backed up in the cloud. We are doomed to Antiquarianism.
      *   *Verdict:* The taxonomy works diagnostically but fails prescriptively in the digital age. The fight shows we are historically saturated.
