  | 2 | Clearly right | It exposes the inconsistency in Move 1 by showing that heredity cannot be the distinguishing factor, forcing Theo to either accept open residency or find a new justification. |
  | 3 | Largely right | It successfully pivots from heredity to fiduciary duty, arguing that immigration is a deliberate act of sovereignty unlike birth, though it risks validating a caste system if not carefully bounded. |
  | 4 | Largely right | It correctly identifies Theo’s shift in justification and introduces the coercion constraint, arguing that border enforcement is an active harm requiring justification beyond internal duty. |
  | 5 | Largely right | It neutralizes the coercion argument by symmetrizing it, noting that protecting membership also requires coercion, so coercion alone cannot decide the issue. |
  | 6 | Largely wrong | It changes the subject from the right to exclude to the title to territory; while morally potent, owning land via conquest does not logically entail a duty to grant citizenship rather than reparations. |
  | 7 | Clearly right | It exposes the logical gap in Move 6 by distinguishing between a duty to repair and a specific remedy of admission, and highlights the egalitarian problem of prioritizing historical grievance over need. |
  | 8 | Largely right | It salvages the historical claim by distinguishing rights from needs, but concedes the argument now applies only to a subset of migrants rather than establishing a general right to enter. |

  ### What Both Are Missing

  Both participants assume that the state is a form of property or club that is *owned* by its current members, whether that ownership is inherited (Theo) or historically tainted (Nadia). They miss the distinction between **jurisdiction** (the authority to rule over people present) and **membership** (the right to share in sovereignty). Neither considers that a state might have a right to control jurisdiction without having a right to permanently exclude people from membership, or vice versa. Furthermore, they both treat the "people" as a static entity that must be protected, missing the constitutive view: that the "people" is defined and reshaped by the very rules of inclusion they are debating. To resume this argument, they would need to join battle on whether the purpose of the state is to protect a pre-existing cultural project or to administer justice within a territory, as this underlying teleology drives their conflicting intuitions about sovereignty and repair.

  ### Bottom Line

  Theo is more right overall on the general principle. He successfully defends the existence of a genuine right to exclude based on the fiduciary duty of the state to its current members, whereas Nadia’s arguments function primarily as specific exceptions (historical justice) or negative critiques (coercion) that do not overturn the general rule. Nadia wins on the moral force of historical obligation, but Theo wins on the structural logic of state sovereignty; since the original question was whether *any* genuine right exists, Theo’s successful defense of the general mechanism outweighs Nadia’s successful limitation of its application in specific cases.

  \answer{Theo wins overall}
