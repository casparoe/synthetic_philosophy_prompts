  6.  **Final Polish:** (Mental check of the argument flow). The argument needs to pivot on the idea that the Intentional Stance assumes a degree of shared rationality/truth that Ava violates. She uses the stance as a weapon. This is the key insight. Dennett usually discusses the stance as a tool for *prediction*, but the film shows it as a tool for *social bonding* which can be weaponized.

      *(Self-Correction)*: Wait, I need to be careful not to say Ava *doesn't* have beliefs. Dennett would say if the pattern holds, she *does*. The film's ambiguity is whether that matters morally. I need to balance the Dennettian view (she has beliefs because the pattern works) with the Friend's view (it's just design). The synthesis is: The Design stance *generated* the Intentional pattern. The question is whether derived intentionality counts.

