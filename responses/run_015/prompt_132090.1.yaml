  *(Self-Correction Note)*: Wait, I need to be careful with Dennett's "Real Patterns." It's not just compressibility. It's about *projectibility*. A pattern is real if you can use it to predict *future* data, not just compress past data. I need to make sure the compression analogy includes *generalization* (training vs. test set).

  *(Refining the "Desires" mapping)*: The user said "Desires = Rate-Distortion Allocation." That's actually not bad, but it's more like the *weights* in the loss function. If I care more about distortion than rate, that's a desire. So Desires = The specific point on the Rate-Distortion curve the system is optimizing for. Beliefs = The Context Model. Rationality = Coding Efficiency (matching the model to the stream).

  *(Refining the "Normative" question)*: In compression, "normative" is "Shannon Limit." You *ought* to reach entropy. If you don't, you're inefficient. But Dennett's normativity is about *consistency*. If I believe it's raining and want to stay dry, I *ought* to open an umbrella. If I don't, either my belief/desire attribution is wrong, or I'm irrational. In compression: If the model says $P(x)$ and the coder uses $Q(x)$, the codelength blows up. The "ought" is "To maintain this abstraction, the overhead must be tolerable."

