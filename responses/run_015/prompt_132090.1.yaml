          *   *Rationality:* User says "minimizes expected loss." Dennett means "consistency." If I believe $P$ and want $Q$, I do $A$. If I do $B$, I'm irrational. In compression: The encoder/decoder pair must be consistent. If the model says $P(x)$ but the arithmetic coder assumes $Q(x)$, you get bloat (inefficiency). Rationality = Coding Efficiency/Consistency between model and action.

