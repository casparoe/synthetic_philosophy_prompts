answer: |-
  Here's a high-level sketch of the conceptual terrain: I'm mapping the shift from "irrationality as a tool for social signaling" to "irrationality as a requirement of self-consistency." The core tension is between viewing rules as instrumental (useful for outcomes) versus constitutive (defining who you are). I'll structure this by distinguishing the strategic context from the private context, then propose a term for the bridge between them.

  ***

  Okay, pull up a chair. This is a really sharp observation. You've put your finger on a tension that keeps a lot of us up at night, especially in the corners of decision theory that bleed into moral philosophy.

  You're right that there isn't one single, universally agreed-upon label for this exact split, but there are clusters of terms that orbit it. What you're describing is the friction between **instrumental rationality** (doing what gets results) and **diachronic consistency** (staying the same agent over time).

  Here's how I'd map the carving, based on how these arguments usually play out in the literature.

  ### The Two Buckets

  **Bucket A: Strategic Precommitment (The "Madman" Theory)**
  This is your first instance. You cultivate a refusal in situation $Y$ to protect yourself in situation $Z$.
  *   **The Logic:** I want to be the *kind of agent* that others believe will refuse $X$. If they believe I'm rational and calculating, they know I'll cave in $Z$. So I must make myself genuinely irrational (or bound) in $Y$ so they trust me in $Z$.
  *   **Standard Terms:** *Strategic Precommitment*, *Dispositional Signaling*, or Schelling's *Threat Credibility*.
  *   **Why it can't be faked:** If it's faked, you retain the ability to calculate. If you retain the ability to calculate, a smart opponent knows you'll calculate your way out of the refusal when the stakes get high. You have to lobotomize the calculation itself.

  **Bucket B: Constitutive Consistency (The "Integrity" Move)**
  This is your second instance. There is no $Z$. No audience. Just you. Yet the argument says you must still refuse.
  *   **The Logic:** You cannot compartmentalize your decision-making algorithm. If you allow yourself to calculate in the private case, you are fundamentally changing the *type* of agent you are. You aren't just making a local choice; you are rewriting your source code. If your source code says "calculate when convenient," it will calculate in $Z$ too, even if you promised it wouldn't.
  *   **Standard Terms:** *Resolute Choice* (McClennen), *Rule Consequentialism*, or sometimes *Functional Decision Theory*.
  *   **The "Category Error":** Proponents say objecting ("but there's no payoff here!") is a category error because they don't view the private act as isolated. They view the agent as a single, extended function across time. Breaking the rule in private degrades the function itself.

  ### The Gap and The Coinage

  You asked for a name for the gap between (a) and (b), and whether (b) is a misapplication.

  In the literature, critics often call (b) **"Rule Worship."** They argue it *is* a misapplication: you're worshipping the heuristic that was only useful for the strategic reason, now that the strategy is gone.

  However, the proponents argue that (b) is actually **"Dispositional Inseparability."** They claim you can't have a disposition that only works when watched.

  If I were coining a term to clarify this specific boundary—focusing on that "spillover" from public strategy to private identity—I'd call it:

  **"The Dispositional Spillover"**

  Here is the map of the edges:

  1.  **Purely Strategic (The Boundary Start):**
      *   *Condition:* I refuse $X$ only because others see me.
      *   *Mechanism:* Reputation management.
      *   *Failure Mode:* Hypocrisy. (I cheat when no one looks).
      *   *Status:* Rational in Game Theory, but unstable if you can't actually control the cheat.

  2.  **The Spillover Zone (The Boundary):**
      *   *Condition:* I refuse $X$ in private to keep my "refusal muscle" strong for public cases.
      *   *Mechanism:* Habit formation / Character training.
      *   *Justification:* Pragmatic. I know I'm weak, so I practice in the low-stakes private arena to survive the high-stakes public arena.
      *   *Status:* This is the bridge. It's still instrumental (private refusal serves public payoff), but it acknowledges the psychological link.

  3.  **Purely Constitutive (The Boundary End):**
      *   *Condition:* I refuse $X$ in private even if there will *never* be a public $Z$.
      *   *Mechanism:* Identity/Algorithm consistency.
      *   *Justification:* "I am not the kind of person who does $X$." The payoff is maintaining the integrity of the agent, not an external reward.
      *   *Status:* This is where Decision Theory turns into Ethics.

  ### Is the Private Version a Misapplication?

  It depends on which "operating system" you run.

  *   **If you run Causal Decision Theory (CDT):** Yes, it's a misapplication. CDT says: "Look at the causal consequences of *this specific act*." If the private act has no consequences, doing it is irrational. The Spillover is a bug.
  *   **If you run Evidential or Functional Decision Theory (EDT/FDT):** No, it's not a misapplication. These theories say: "Your act is evidence of your algorithm." If you defect in private, you are running a 'Defector' algorithm. A 'Defector' algorithm will eventually defect in public, even if you try to patch it. Therefore, refusing in private is rational because it confirms you are running the 'Cooperator' algorithm, which yields better lifetime outcomes.

  ### The Verdict

  The "category error" charge you mentioned comes from the FDT/Resolute Choice crowd. They argue that **isolating the private case is the actual error.** They believe you cannot logically separate "Me-Now-Private" from "Me-Later-Public" because both are outputs of the same reasoning engine.

  So, to answer your specific question: The gap is between **Instrumental Disposition** (useful fake) and **Constitutive Disposition** (real identity).

  I'd stick with **"The Dispositional Spillover"** as the term. It captures the movement from "I do this for them" to "I do this for me" without losing the sense that the logic originated in strategy. It acknowledges that the private rule is an import from the public game, but argues that once imported, it becomes part of the machinery.

  Does that carving work for what you're seeing? It sounds like you're watching people try to derive ethics from game theory, and this Spillover is exactly where the magic trick happens.
