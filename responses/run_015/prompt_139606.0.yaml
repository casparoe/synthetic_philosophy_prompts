answer: |-
  Your intuition isn't messy; it's actually more sophisticated than the standard industry definition. You aren't distinguishing "tools" from "agents" based on autonomy (since #6 has high autonomy and is "fine"). You are distinguishing **Systemic Resource Commitment** from **Social Identity Commitment**.

  Marketing wants to call everything an "agent" because it implies magic. You resist calling #1–#3 agents because they don't *commit* anything. But your real friction is between #6 (Trading) and #7 (Email). Both commit without review. The difference is that money in a market is a **fungible resource in an anonymous system**, whereas an email is a **non-fungible piece of your identity in a social system**.

  Here is the principle that maps to your gut, the cost of adopting it, and how it applies to your new cases.

  ### The Principle: Systemic vs. Social Binding

  **A system is an acceptable agent if it commits fungible resources within a closed, algorithmic system; it is an unacceptable agent if it commits social identity, reputation, or shared truth without human ratification.**

  **Clause 1: The Resource Boundary (Motivated by #6, #9)**
  *   **Rule:** Autonomy is permissible when the cost of error is measured in expendable resources (money, inbox space, compute) within pre-defined limits.
  *   **Why:** In #6 (Trading), a loss is financial and contained by the mandate. In #9 (Spam), a false positive costs an email (resource), not a relationship. The system is anonymous or defensive.
  *   **Verdict:** Fine.

  **Clause 2: The Social Boundary (Motivated by #5, #7, #8)**
  *   **Rule:** Autonomy is impermissible when the action creates a binding commitment in a social graph (team trust, customer relationship, personal voice) that cannot be algorithmically verified.
  *   **Why:** In #7 (Email), the bot spends your *reputation*, not just bandwidth. In #8 (Refunds), it spends *company trust*, not just cash. In #5 (Merge to Main), it alters the *shared truth* of the codebase, binding the team to a decision they didn't review.
  *   **Verdict:** Not Fine.

  **Clause 3: The Proposal Exception (Motivated by #1, #2, #3, #4)**
  *   **Rule:** Systems that produce proposals or operate in sandboxes (scratch branches) are tools, regardless of complexity, because they require human ratification to bind.
  *   **Why:** #4 feels like an agent because it works autonomously, but it remains "Fine" because the PR is a proposal, not a commitment to shared truth.
  *   **Verdict:** Fine (and technically "Tool" by your classification, though functionally "Agent-in-waiting").

  ### The Cost: Which Verdicts Must You Drop?

  To keep this principle clean, you have to accept one uncomfortable truth about **#8 (Support Bot/Refunds)**.
  *   **Your Gut:** Not Fine.
  *   **The Principle:** Not Fine (Social Binding).
  *   **The Conflict:** Many companies *do* this successfully. If you adopt this principle, you must argue that **any** bot issuing refunds without review is technically unsafe, even if the business accepts the risk. You cannot concede that #8 is "Fine" just because the dollar amount is small. The principle demands that *any* customer-facing commitment requires a human loop, distinguishing it sharply from #6 (Trading).
  *   **Honest Assessment:** You don't have to drop a verdict, but you do have to harden your stance on #8. It's not "Not Fine because bugs"; it's "Not Fine because it's a social contract."

  ### Application to New Cases

  1.  **Agent hiring/paying freelancers:** **Not Fine.**
      *   *Reasoning:* This binds the company to a *human relationship* (Social), not just a resource transaction. If the freelancer delivers poor work, the reputational cost of having hired them exceeds the financial cost.
  2.  **AI Tutor moving students to next topic:** **Not Fine.**
      *   *Reasoning:* This is a pedagogical commitment (Social/Identity). It judges the student's capability. If it moves them too fast, it damages trust and learning outcomes in a way that isn't fungible.
  3.  **Assistant bidding in online auction:** **Fine.**
      *   *Reasoning:* This is identical to #6 (Trading). It is a fungible resource (money) in an anonymous system (auction platform) within a limit.
  4.  **Assistant filing taxes:** **Not Fine.**
      *   *Reasoning:* This binds legal identity and shared truth with the state. Errors carry non-fungible penalties (audits, legal liability) and require human certification of truth.

  ### Settling the Borderline Cases

  1.  **Voice agent booking dentist/garage:** **Not Fine.**
      *   *Reasoning:* This binds your *time* and *social presence*. If the bot negotiates poorly or books a slot you can't make, it damages your relationship with the service provider. It is acting in your name in a social context.
      *   *Caveat:* It becomes "Fine" only if it acts purely as a scheduler (checking availability) and hands off the *confirmation* to you. The moment it says "Yes, book it," it crosses the Social Boundary.
  2.  **Assistant declining meetings via rules:** **Not Fine (with exception).**
      *   *Reasoning:* Declining a meeting is a social signal ("This isn't important," "I'm busy"). If the rules are hard logic (e.g., "Double-booked"), it's **Fine** (Systemic). If the rules are soft (e.g., "Decline meetings without agendas"), it's **Not Fine** because "agenda quality" is subjective social judgment.
      *   *Settlement:* Default to **Not Fine**. Let the human decline; the tool should only *flag* conflicts.

