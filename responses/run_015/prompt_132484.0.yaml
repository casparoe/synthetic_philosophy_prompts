prompt: |-
  hey im running a small translation workshop — 8 people, 75 min, mostly grad students but not all in literature. i want them to actually feel the pull that Hofstadter talks about in Le Ton beau de Marot, where keeping the rhyme and meter forces you to betray the literal meaning in these really specific ways. not a lecture though — they should run into the problem themselves.

  design me a game: split into pairs. partner A gets only the phonetic skeleton of a short poem — rhyme scheme, syllable counts, stress pattern, maybe some alliteration slots — but zero words. partner B gets only a literal prose gloss of what the poem is saying, like a rough paraphrase of the emotional situation, but no meter or rhyme info. neither partner sees the original french or any existing english version. they have 35 minutes to negociate one joint english version.

  then we reveal the source text — a short poem in the Marot tradition — and compare. the point is they should feel form pulling meaning around, not just hear about it.

  i need: clear rules, materials list, a payoff/scoring system that doesnt use real money, and a debrief that maps specific moments in the negotiation onto the idea that form is constitutive not decorative. also tell me what will predictably go wrong the first run — like one partner dominating, or people getting stuck on rhyme — and be honest about which part of Hofstadter's view this cant reproduce (maybe his obsession with preserving the exact rhyme sounds across languages?).

  please put the deliverable in a JSON object with exactly these fields:
  - setting: brief context
  - rules_summary: list of strings, each one rule or phase
  - materials: list of strings
  - payoff_scheme: brief description with scoring logic
  - debrief_mapping: paragraph mapping game moments to the philosophical point
  - predicted_failures: list of strings
  - unreproducible_feature: paragraph on the limit

  no bibliographies or citations please — just design from what you know. im writing this quickly on my phone so dont worry about perfect grammar.
