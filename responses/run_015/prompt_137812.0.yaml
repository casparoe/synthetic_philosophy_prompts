      *   *Revised Mechanic:* The "Logic Tax." If your prices allow a Dutch Book *based on simple logic* (A + not A = 1), you pay a penalty. If it requires *hard computation* (Prime check), no penalty. This draws the line between "Logical Omniscience" (expected) and "Computational Omniscience" (not expected).

  12. **Final Polish:** Check against constraints. 90 mins. No algebra. No "logical uncertainty" phrase until end. Retired/Undergrad mix.

      *(Self-Correction on the Undecidable Claim)*: A true Gödel sentence is too abstract. Let's use a "Sealed Envelope" that contains a claim dependent on a random number generator that *we destroy*. It's empirically settled but epistemically lost. Or better, a claim about the physical world that is inaccessible (e.g., "The 5th grain of sand in jar X is quartz"). No, let's stick to the User's idea: A math claim that is too hard to compute *in the session*. Let's call it "The Horizon."

