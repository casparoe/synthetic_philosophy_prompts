      *   *Logical Uncertainty (Garber, Gaifman, etc.):* Agents are bounded. They assign probabilities to logical statements based on computational evidence, not just truth tables.
      *   *The Tension:* If I price $P(A) = 0.6$ and $P(\neg A) = 0.6$, I'm incoherent. But if checking $A$ takes 100 years, is it rational to spend 100 years to avoid a 10-cent loss now?
