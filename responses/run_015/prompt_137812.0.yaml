      *   *Simpler:* Facilitator offers contracts at specific prices. Participants choose Yes/No.
      *   *Even Simpler (Better for flow):* **Prediction Market Style.** Participants write down their "Price" (0-100) for each claim. They commit Credits based on confidence.
      *   *The Adversary:* One person (or the Facilitator) checks the set of prices for logical inconsistencies *after* the trading but *before* the math is revealed.
      *   *The Twist:* The Adversary has a "Logic Checker" (a printed sheet of implications). If Prices violate logic (e.g., $P(A) > P(B)$ where $A \implies B$), the Adversary takes a tax.
      *   *The Defense:* The group can argue "We didn't know the implication." Adversary says "Logic is free." Facilitator says "Computation is not."

  9.  **Developing the Specific Claims:**
      1.  **Coin:** Hidden under cup. (Empirical)
      2.  **Pi:** 10,000th digit is even. (Logical, settled by laptop).
      3.  **Compound:** (Coin is Heads) OR (Pi digit is even). (Links Empirical + Logical).
      4.  **The Ghost:** "This statement has no truth value in this room." (Undecidable/Unsettled).

  10. **Writing the Plan:**
      *   *Tone:* Respectful of their intelligence, practical, no jargon.
      *   *Structure:* Timeline, Claims, Rules, Debrief, Pitfalls.
