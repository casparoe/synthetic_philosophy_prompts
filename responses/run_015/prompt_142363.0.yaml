answer: |-
  The aggregation objection strikes at the justificatory structure of contractualism, not merely its verdicts. Contractualism grounds morality in principles no one could reasonably reject, assessing rejectability by examining individual complaints in isolation. It forbids summing burdens across persons because justification is owed to each individual separately. The objection bites because this structure seems incapable of validating trade-offs where many small burdens collectively outweigh one severe burden, or where numbers count in rescue cases. If justification is individual, the presence of additional people with identical claims should not alter the strength of any single claim. Thus, the objection challenges whether contractualism can accommodate moral mathematics without abandoning its core commitment to the separateness of persons.

  Your student's "margin-plus-sum" rule attempts to hybridize the individualistic constraint with aggregative flexibility. To evaluate it, consider three cases. First, many trivial burdens (loss of a finger, complaint 1) versus one severe burden (loss of life, complaint 100). With a modest margin $m$ (say, 10), the difference in maximum complaints (99) exceeds $m$. The rule prioritizes the smaller maximum, saving the life. This yields the right verdict for the right reason: protecting the individual from catastrophic loss.

  Second, five lives versus one life (complaint 100 each). The maximum complaints are identical (difference 0 $\le m$). The rule triggers the summing clause. The sum of complaints is lower if the one dies (100 vs. 500). The rule saves the five. This yields the right verdict, but for an aggregative reason: the individual veto is silenced because the maxima are "close enough."

  Third, one leg (complaint 50) versus many arms (complaint 40 each). The difference in maxima is 10. If $m=5$, the rule saves the arms (max priority); if $m=15$, it saves the leg (sum priority, assuming enough arms). Here, the verdict depends entirely on the arbitrary setting of $m$, revealing that the rule lacks a principled basis for distinguishing when numbers count.

  The deeper structural worry is intransitivity. Thresholds combined with secondary criteria typically generate cycles. Assume $m=10$. Consider three outcomes defined by (Max Complaint, Sum Complaint):
  *   **Option A:** (100, 100)
  *   **Option B:** (85, 300)
  *   **Option C:** (95, 200)

  Compare **A and B**: The difference in maxima is 15 ($>10$). The max-complaint rule applies. B (85) beats A (100). **B > A**.
  Compare **B and C**: The difference in maxima is 10 ($\le 10$). The sum rule applies. C (200) beats B (300). **C > B**.
  Compare **C and A**: The difference in maxima is 5 ($\le 10$). The sum rule applies. A (100) beats C (200). **A > C**.

  The result is a cycle: A is better than C, C is better than B, and B is better than A. This matters decisively. Contractualism aims to identify a principle that no one could reasonably reject—a unique least-rejectable option. If the "less rejectable" relation cycles, there is no stable equilibrium. The theory cannot guide action because for any chosen principle, there is another that is less rejectable, yet choosing that one invites a third objection. A cheap modification to eliminate cycling would require removing the tolerance margin (making the priority lexical) or smoothing the transition (weighting). Removing the margin collapses the view into strict Maximin (ignoring numbers entirely). Smoothing the transition collapses it into weighted aggregativism. Thus, the cycling is inherent to the threshold shape.

  Finally, does this preserve contractualism's distinctiveness? The margin functions as a rounding device that permits aggregation whenever individual burdens are deemed sufficiently similar. This reinstates aggregative ranking under a contractualist label. The plausibility of the view relies on judiciously choosing examples where the margin aligns with intuition, but structurally, it concedes that the separateness of persons is conditional. It claims to protect individuals from being sacrificed for the total, but the margin explicitly allows exactly that sacrifice when the individual burden is within $m$ of the alternative. The view draws its force from the contractualist constraint but operates via utilitarian calculation whenever the constraint is relaxed.

  The fix fails because the threshold mechanism generates fatal cycles, and removing them collapses the view into either rigid absolutism or plain aggregation.

  \answer{FATAL}
