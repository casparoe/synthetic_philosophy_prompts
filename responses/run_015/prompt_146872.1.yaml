          3.  Stoic Apatheia (Suppression of passion) $\rightarrow$ Slave Morality (Ascetic denial disguised as reason).
          4.  Modern Environmentalist Austerity (Ecological debt) $\rightarrow$ Slave Morality (Reactive, life-denying, guilt/debt).
          5.  Romantic Artist (Poverty/illness for creativity) $\rightarrow$ Noble Morality (Limitation as fuel/intensity).
      *   **Current Case:** Extreme caloric restriction, cold exposure, sleep deprivation. Meticulous tracking. *Motivation:* Aesthetic experiment, mapping limits, pure self-mastery, sensory refinement. *Explicit Rejection:* Moral language, guilt, fear, debt, redemption, collective obligation.
