      *   *Principle for Slave Verdict:* The Ascetic Ideal is defined by the *will turning against life* (even in the name of life), manifested when the body is treated as raw data to be corrected rather than an expression of will.
      *   *Principle for Noble Verdict (Counterfactual):* Moral quality is determined by the absence of reactive emotions (guilt/ressentiment) and the presence of self-chosen goals.
