answer: |-
  This is a classic encounter with **Fitch's Paradox of Knowability**. Your group has correctly identified that the principle you call *Openness* (formally: $\forall p (p \to \Diamond K p)$) combined with the modest claim that some truths are unknown (Non-Omniscience) entails a contradiction using standard epistemic logic.

  You asked which step to reject, the cost of that rejection, and an evaluation of the specific replies you have been circling. Here is the breakdown.

  ### The Verdict: Reject the Unrestricted Scope of Step (1)

  You should reject **Step (1)** in its unrestricted form. Specifically, you must deny that the quantifier "for every true proposition $p$" ranges over *all* propositions, including those that contain epistemic operators like "knows" or "unknown."

  **Why it looked innocent:**
  In natural language, when we say "every truth is knowable," we are talking about truths regarding the world: the number of sand grains, the nature of consciousness, the laws of physics. We are not thinking about self-referential logical constructs like "$p$ is true and nobody knows $p$." The innocence lies in the assumption that the domain of "propositions" is stable and that epistemic status is just a property like mass or charge, rather than something that interacts with the act of knowing itself.

  **The Cost:**
  The cost is **complexity and domain restriction**. You can no longer wield Openness as a blunt, universal razor. You must specify *which* truths are subject to the Openness principle. Typically, philosophers restrict the principle to **non-epistemic basic truths** (truths that do not contain knowledge operators).
  *   **Price:** You lose the elegance of the universal claim. You must now defend a boundary line between "knowable truths" and "Fitch-conjunctions."
  *   **Benefit:** You save Non-Omniscience (2), you avoid Idealism, and you preserve the anti-mysterian razor for the domains you care about (physics, qualia, etc.), provided those domains are treated as non-epistemic.

  ### Pricing the Alternatives

  To ensure this is the right move, let us price the other options you considered implicitly in your derivation.

  1.  **Reject (2) [Accept Omniscience]:**
      *   **The Move:** Deny that there are any unknown truths. Conclude that because $c$ cannot be known, $c$ must be false, meaning $\neg (u \land \neg K u)$, which implies $u \to K u$.
      *   **The Cost:** This is **Idealism or Theism**. You must claim that either human minds collectively know everything (absurd) or that a God's mind knows everything (theological commitment). For a rationalist group, this undermines the scientific project, which assumes there are unknown truths waiting to be discovered. This is the highest cost.

  2.  **Reject Factivity or Distribution [Steps 5–6]:**
      *   **The Move:** Claim that knowledge does not distribute over conjunction, or that knowledge is not factive (you can know things that are false).
      *   **The Cost:** This changes the subject. You are no longer talking about *knowledge*. If $K$ is not factive, it is belief or acceptance. If $K$ does not distribute, it is not a standard logical attitude. This destroys the utility of Openness as a razor for truth, because the razor relies on the connection between *truth* and *knowledge*.

  3.  **Reject Openness Entirely:**
      *   **The Move:** Admit there are truths that are *in principle* unknowable.
      *   **The Cost:** You surrender the anti-mysterian razor. You allow the mysterian to say, "Yes, there is a fact about inverted spectra, but it is a Fitch-style truth: it exists but can never be known." This renders the fact ontologically idle, which many realists find acceptable, but it defeats your group's specific methodological goal.

  ### Addressing Your Two Circling Replies

  You asked specifically about the **Scope/Rigidification reply** and the **Verificationist Bullet**.

  #### 1. The Scope/Rigidification Reply
  *The Suggestion:* The flaw is a scope slide. The second conjunct of $c$ should be read as "*Actually* nobody knows $u$" (rigidified to the actual world), rather than "Nobody knows $u$" (evaluated in the possible world where the knowledge occurs).
  *The Repair:* Let $@$ be the "actually" operator. The proposition is $u \land \neg @K u$. Can someone know this? Yes. In a possible world $w$, an agent can know $u$ (in $w$) and know that in the *actual* world (@), $u$ is unknown. There is no contradiction here.

  *Does it survive revenge?* **No.**
  Consider the proposition $r = (u \land \neg \Diamond K u)$ ("$u$ is true and it is *not possible* for anyone to know $u$").
  If Openness holds, then possibly someone knows $r$.
  So, $\Diamond K (u \land \neg \Diamond K u)$.
  This implies there is a world $w$ where someone knows $u$ and knows $\neg \Diamond K u$.
  If they know $\neg \Diamond K u$, then $\neg \Diamond K u$ must be true (factivity).
  But if they know $u$ in $w$, then $\Diamond K u$ is true (since it is possible in $w$ that $u$ is known, because it *is* known in $w$).
  Contradiction: $\Diamond K u$ and $\neg \Diamond K u$.
  Rigidifying with "actually" blocks the simple Fitch paradox, but it fails against the "Not Possibly Known" revenge paradox. The structural issue remains: you cannot have a truth that asserts its own unknowability be itself knowable.

  *Does it keep the Razor?* **Weakly.**
  A rigidified Openness ("Every truth is such that someone could know it, even if they know they are not actually knowing it") is less forceful against the mysterian. The mysterian claims the fact is *in principle* inaccessible. The rigidified reply allows that the fact is accessible in another world, but the "Not Possibly Known" revenge shows that if the mysterian claims the fact is *necessarily* unknown, Openness still collapses. To save the razor, you must deny that mysterian facts are of the form "true but necessarily unknown." You must insist they are "true and contingently unknown," which is exactly what the restricted Openness (rejecting Step 1's scope) achieves more cleanly.

  #### 2. The Verificationist Bullet
  *The Suggestion:* The argument is valid; we should simply accept that all truths are known (or that truth is constituted by knowability).
  *The Cost:* If you bite this bullet, you pay in **realism**.
  *   **Option A (Idealism):** You claim that for a proposition to be true, it must be verified. This is a form of anti-realism. It solves the paradox by denying that there are verification-transcendent truths.
  *   **Option B (Theology):** You claim all truths are known by God.
  *   **The Price for Rationalists:** This is prohibitively expensive. It forces you to abandon the view that the world exists independently of investigators. It makes the history of science (finding things out) metaphysically puzzling (were they true before we knew them?). It also fails to handle your "Writability" example well. If every truth is *actually* written down, then there is a physical inscription of every truth somewhere in the universe. This implies an infinite library or a God who writes everything down. It turns a principle about *capacity* (writability) into a claim about *actual history*, which is empirically false.

  ### The Solution for Your Reading Group

  To keep (2) (unknown truths exist), keep a restricted Openness (anti-mysterian razor), and avoid Idealism, you should adopt **Domain Restriction**.

  **The Modified Principle:**
  "For every **non-epistemic** true proposition $p$, it is possible that someone knows $p$."

  **How this handles your worries:**
  1.  **The Fitch Conjunction:** The proposition $c = (u \land \neg K u)$ contains an epistemic operator ($K$). Therefore, it falls outside the domain of the Modified Principle. The principle does not apply to it, so no contradiction arises.
  2.  **Mathematics:** Mathematical truths are non-epistemic. The Fitch conjunction involving a mathematical truth ($\phi \land \neg K \phi$) is *not* a mathematical truth; it is a meta-mathematical or epistemic truth. Therefore, the principle "Every mathematical truth is knowable" does not entail "Every mathematical truth is known," because the problematic conjunction is not in the set of "mathematical truths."
  3.  **Writability:** Similarly, restrict the principle to "propositions independent of the act of writing." The proposition "$p$ and nobody has written $p$" is not independent of the act of writing. The principle "Every truth can be written" applies to $p$, not to the epistemic conjunction.
  4.  **The Mysterian Razor:** The mysterian claims there are facts (e.g., about qualia) that are *in principle* unknowable. These are purportedly non-epistemic facts about the world. Your Modified Principle applies to them. If the mysterian says "It is true that there is an inverted spectrum, but it is impossible to know," they are asserting a non-epistemic truth that violates Openness. You can still use Openness to argue: "If it's a fact, it must be knowable. If you claim it's unknowable, you're admitting it's not a fact."

  **Summary of Costs:**
  You lose the simplicity of "All truths." You gain the burden of defining "non-epistemic." However, this is a standard philosophical burden (similar to distinguishing logical truths from empirical ones). It is far cheaper than accepting Omniscience or abandoning the concept of Truth.

  **Recommendation:**
  Formalize your group's *Openness* as:
  $$\forall p \in \text{Basic} (p \to \Diamond K p)$$
  Where "Basic" excludes propositions containing epistemic operators. This blocks the derivation at Step (3), as $c$ is not a "Basic" truth, even if $u$ is. This preserves the razor against mysterianism (which targets Basic truths) while respecting the logical limits of knowledge.
