  *Manhole* is the outlier here; it is a static physical object with legal fixedness. *Middleman* is a logical role in a system of exchange. *Man-in-the-middle* is a logical role in a system of communication. The minutes show a clear pattern of replacing gendered terms for functional roles (*chairman*, *middleman*, *manpower*), even when technical (*man-hours*). The *manhole* exception relies on "fixed engineering" status that *MITM* does not strictly possess (as evidenced by the authors noting existing alternatives like *adversary-in-the-middle*). Therefore, *middleman* is the genuine analog.

