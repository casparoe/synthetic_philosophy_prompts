      *   *Distinguish Truth from Authority:* A random passerby can say "That's wrong," but a *blamer* enters a specific normative relationship with the wrongdoer. Hypocrisy disrupts this relationship.
      *   *Address the "No Logical Inconsistency" Point:* It's not about logic; it's about *commitment*. By blaming, you implicitly claim a certain moral status or authority. Hypocrisy undermines that claim.
