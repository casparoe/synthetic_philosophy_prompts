answer: |-
  You've set a trap with a very intuitive case. It feels like support, not attack. But don't let the warmth of the consolation distract you from the normative structure of the *blame* itself. You are conflating the truth of the proposition with the legitimacy of the speech act.

  Here is the defect: **Blame is not merely an assertion of truth; it is a demand for accountability.**

  When your friend says, "What she did was wrong," he isn't just describing the universe. He is positioning himself as a moral enforcer. He is entering a normative relationship with your partner (even in absentia) where he claims the authority to hold her to a standard.

  The core of the Standing View rests on a principle of **moral equality**. To hold someone else accountable to a norm, you must submit yourself to that same norm. If you violate the norm you are enforcing, you are effectively claiming a moral superiority or authority that you do not possess. You are saying, "I get to judge you for this," while your own actions scream, "I am not bound by this in the same way."

  In your scenario, your friend lacks standing because his blame is **unfair**.

  Think of it like a referee in a sports match. Suppose a referee calls a foul on a player for tripping an opponent. Everything the referee says is true: the player *did* trip. But suppose it turns out the referee played the game yesterday and tripped opponents repeatedly without penalty. We wouldn't just say, "Well, he's being annoying." We would say he has no *authority* to make that call. The call is normatively defective. It doesn't count as a legitimate adjudication of the rules.

  Why? Because the rules apply to everyone equally. By flouting the rule himself, the hypocritical blamer forfeits the right to enforce it against others.

  Now, you might object: "But my friend admits *he* was wrong too! He's not claiming superiority!"

  This is the most common misunderstanding of the Standing View. It does not matter if he *verbally* admits his own guilt. What matters is the **implicit claim of authority** inherent in the act of blaming. When you blame, you are effectively sanctioning someone. To sanction someone for a violation you have committed (and presumably not fully atoned for, or else you wouldn't be a hypocrite in the relevant sense) is to treat them as a mere means to your own moral posturing, or to subject them to a standard you have placed yourself above.

  Even if he whispers it kindly, the structure is: "I, a member of the moral community, hold you accountable." But by cheating last year, he suspended his own membership in that specific community of fidelity. He cannot stand *outside* the norm and punish those *inside* it.

  So, to answer your specific question: **What normative force is missing?**

  The force of **legitimate accountability**. Your friend can offer you comfort. He can say, "I'm so sorry you're hurting." That requires no standing. But the moment he issues a verdict on your partner's morality regarding fidelity, he steps into a role he has forfeited. The blame lacks *bindingness*. Your partner could rightly retort, "By what right do you judge me?" and that retort isn't just a deflection; it's a valid challenge to his normative authority.

  The defect isn't that he's lying. It's that he's trespassing. He is asserting a power over another moral agent that his own conduct has revoked. That is a violation of fairness, which is a deep normative wrong, not a matter of etiquette.

