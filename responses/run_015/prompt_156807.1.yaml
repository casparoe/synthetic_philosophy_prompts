answer: |-
  1. the exam question

  **Essay Question (25 Marks)**

  In *Of Suicide*, Hume argues that taking your own life rarely violates our duty to society, suggesting we are only obligated to stay alive as long as we are useful to others. Critics contend this argument treats individuals as fungible social units—replaceable cogs whose specific identity doesn't matter, only their utility. 

  Does this assumption of fungibility clash with Hume's broader sentimentalist moral theory, which grounds value in particular sympathetic connections rather than abstract calculus? Furthermore, evaluate an "exit-license" model where society permits suicide only when an individual's net social contribution turns negative. Does Hume's reasoning support this utilitarian calculus, undermine it by prioritizing individual misery, or is his position orthogonal to such regulation? 

  Write a coherent essay addressing these tensions. 
  **Target Length:** 1100–1300 words. 
  **Time:** 90 minutes.

  ***

  2. a model answer

  Hume's defense of suicide rests heavily on dismantling the idea that we belong to society in a way that forbids exit. He argues that our duty to society is based on utility; if we become a burden, the obligation dissolves. The criticism that this treats people as fungible units has some bite. If Hume says "society loses nothing if I leave because someone else can fill my spot," he is indeed treating human roles as interchangeable. However, calling this a clash with sentimentalism requires nuance. Hume's moral theory isn't about sacred individuality; it's about the general good felt through sympathy. If my death causes more pain than pleasure to those around me, it's vicious. If not, it's permissible. So, the "fungibility" charge is really just Hume applying utility consistently. He doesn't value the *unit* for its own sake, but for its capacity to generate agreeable sentiments in others.

  The tension arises because sentimentalism usually emphasizes particular relationships—my duty to *my* children, not children in general. If society views me as replaceable, it dampens the specific sympathy owed to me. But Hume would likely reply that sympathy should track reality. If I am truly a burden, persisting out of a sense of "specialness" is superstition, not virtue. The real conflict isn't with sentimentalism, but with modern notions of inherent dignity which Hume rejects. He cares about the flow of utility, not the sanctity of the vessel.

  This leads to the "exit-license" model. Under this system, you can only suicide if your net contribution is negative. On the surface, this looks very Humean. It codifies the utility calculus: stay when useful, go when burdensome. But digging deeper, Hume's argument undermines the license model in two ways. First, Hume emphasizes individual judgment of misery. He argues that when life becomes misery, it ceases to be a good. A bureaucratic license implies society judges your utility better than you judge your own suffering. Hume trusts the individual's assessment of their own pain over society's assessment of their labor.

  Second, the license model implies a duty to die once you become a burden. Hume never goes that far. He says suicide is *permissible* when you're a burden, not *mandatory*. He removes the prohibition; he doesn't install a command. Forcing someone to exit because they are net-negative would violate the duty to oneself to avoid misery if they still find life bearable, or it would turn utility into a tyrannical master. Hume wants to liberate the individual from religious and social superstition, not enslave them to a social accounting sheet.

  Ultimately, Hume's reasoning is orthogonal to the regulatory intent of the exit-license. While he agrees with the utilitarian metric (utility determines duty), he disagrees with the institutional enforcement. The license model assumes society owns the right to grant permission based on contribution. Hume argues society never had the right to forbid it in the first place, provided no specific harm is done. The license validates the state's authority to judge the worth of a life, whereas Hume's essay is fundamentally about stripping that authority away. So, while the math looks similar, the moral architecture is opposite. Hume supports the conclusion (you can go if you're a burden) but rejects the premise (society decides when that is).

  In sum, the fungibility critique misses that Hume's sentimentalism is utilitarian at its core. The exit-license model captures his utility metric but violates his libertarian conclusion about who holds the judgment. Hume wants us free from duty when we are useless, not commanded to die because we are.

