  | **2. Fungibility Critique** | 5 | Defines the "replaceable cog" objection clearly regarding social utility. | Students describe fungibility economically without linking it to moral worth. |
  | **3. Sentimentalist Tension** | 5 | Analyzes whether utility calculus conflicts with particular sympathetic bonds. | Candidates claim sentimentalism always forbids utility calculations, ignoring Hume's synthesis. |
  | **4. Exit-License Evaluation** | 5 | Assesses if Hume supports, undermines, or is orthogonal to the licensing model. | Most say "supports" purely on utility grounds, missing the judgment/authority distinction. |
