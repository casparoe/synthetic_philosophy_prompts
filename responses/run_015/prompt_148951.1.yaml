prompt: |-
  hey, i'm writing a novel about a near-future society where people can take a programme that blunts reactive attitutes — resentment, gratitude, indignation, all the Strawson stuff — and i'm trying to work out what philosophical fights are actually live, not just the usual free-will determinism rehash. within the reactive attitudes and moral responsibility area, what open questions or lines of work really matter now, and which ones should shape how you'd design institutions where these feelings are partly engineered?

  in particular, i'm drawn to an idea i haven't seen pushed far: that reactive attitudes have a kind of 'social grain', so resentment between neighbours operates differently from resentment in a bureaucracy or a court, and that this scaling problem might be the hidden crux behind all the standard debates about compatibilism. is that a genuine upstream problem, or is it a red herring that distracts from whether the attitudes are rational at all?

  please rank the open questions or implications you'd actually prioritise — for a researcher, or for my novel — by tractability, how many other issues depend on them, and whether settling them changes real practice. defend the ordering: i want to know what makes a question worth years, not just that it's unresolved. and please do it in British English — no need for a bibliograpy, i wouldn't be able to check it anyway and my characters certainly can't.
