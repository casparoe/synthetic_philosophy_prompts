          3.  **The Political Economy of Emotional Regulation.** Who gets the drug? Who is forced to take it? This moves from metaphysics to power dynamics.

  6.  **Fleshing out the Arguments (in British English):**
      *   *Spelling:* Programme (not program), centre (not center), defence (not defense), colour (not color).
