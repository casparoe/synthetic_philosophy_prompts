      *   **User Persona:** A novelist looking for philosophical depth and institutional design implications.

  2.  **Deconstruct the "Social Grain" Hypothesis:**
      *   The user suggests that reactive attitudes function differently at different scales (neighbour vs. bureaucracy vs. court).
      *   *Is this a red herring?* No, it's actually quite central to contemporary Strawsonian debates (e.g., Angela Smith, R. Jay Wallace, but also sociological critiques). Strawson himself hinted at the "general framework of human life," but didn't fully unpack institutional variations.
      *   *Why it matters:* If attitudes are context-dependent, a blanket "blunting programme" might have catastrophic unintended consequences in some spheres while being beneficial in others. This is gold for a novel.

  3.  **Identify Live Philosophical Questions (beyond Free Will/Determinism):**
      *   *The Scope of Applicability:* Who/what is an appropriate target? (AI, corporations, impaired agents).
      *   *The Function of Attitudes:* Are they communicative (appeals for goodwill) or sanctioning (punitive)?
