  Move 2: "More expensive for cheater." -> Thesis D (Differential Cost).
  Move 3: "Costs nothing unless caught." -> Thesis C (Sunk Cost).
  Wait, Move 3 says escrow *isn't* the kind of cost that makes signals reliable. This implies Thesis C is the standard being used to judge the escrow.
