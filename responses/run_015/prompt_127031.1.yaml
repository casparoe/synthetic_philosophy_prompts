      *   *Diagnosis:* It's a clash of *normative ideals* masked as a calculation error. One side prioritizes *causal leverage*, the other prioritizes *predictive correlation*.

  3.  **Analyze Variant 1: Gene vs. Simulator:**
      *   *Gene:* Classic Common Cause. Causal Decision Theory (CDT) says Two-Box. Evidential Decision Theory (EDT) says One-Box.
