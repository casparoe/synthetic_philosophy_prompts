      *   *Key Insight to convey:* The Two-Boxer thinks the One-Boxer is superstitious (magical thinking). The One-Boxer thinks the Two-Boxer is a loser (leaving money on the table). The variants test *why* they think that.

      *(Self-Correction during drafting)*: I need to be careful not to just say "CDT says X, EDT says Y." The user asked to avoid surveys. I must explain the *reasoning* behind the positions without necessarily labeling them as school names, or only use the labels as shorthand for the reasoning.
