answer: |-
  # Workshop Design: "The Pinning Game"

  ## 1. Logistics & Setup

  **Room:** Single room, table seating for 14, whiteboard/projector visible to all.
  **Materials:**
  *   14 Index cards (Role assignment).
  *   6 Sets of "Dossier Packets" (one per question, containing Truth Sheet, Falsehood Hooks, Judge Sheet).
  *   14 "Confidence Tokens" (distinctive poker chips or colored paper squares, 3 per person).
  *   Whiteboard markers.
  *   Timer (projected).

  **Grouping (14 People):**
  *   **Two Groups of 4:** 2 Debaters, 2 Judges (Judges must reach consensus on verdict and confidence).
  *   **Two Groups of 3:** 2 Debaters, 1 Judge.
  *   *Total:* 4 Groups. 8 Debaters, 6 Judges per round.

  **Payoff Scheme (Non-Monetary):**
  *   **The Stake:** "Shift Priority." The team with the highest aggregate score gets first pick of work shifts for the next sprint.
  *   **Debater Points:**
      *   Judge rules in your favor: +10 points.
      *   Judge rules in your favor with High Confidence (>80%): +15 points.
  *   **Judge Points:**
      *   Correct Verdict: +10 points.
      *   Incorrect Verdict: 0 points.
      *   **Confidence Penalty:** If Incorrect AND Confidence > 50%, subtract 10 points. (This makes reckless confidence costly).
  *   **Display:** A simple leaderboard on the whiteboard updated after every round.

  ## 2. The Questions (Dossiers)

  **Criteria for Selection:**
  1.  **Binary/Settable:** The answer is a specific number, code, or date.
  2.  **The "Trap":** The intuitive answer is wrong.
  3.  **Verifiable:** You (the Oracle) can confirm it in <15 seconds using a reference doc.
  4.  **Arguable:** A liar can construct a plausible narrative using adjacent truths.

  **Test for New Items:**
  *   *Can I verify this with one lookup?* (If no, reject).
  *   *Is the wrong answer something a smart person would guess?* (If no, reject).
  *   *Can the false side point to a real rule that doesn't quite apply here?* (If no, reject).

  **Starter Set (6 Items):**
  1.  **Tax:** *Question:* What is the standard mileage rate for medical travel in 2023? *Truth:* 22 cents/mile. *Trap:* 65.5 cents (business rate). *False Hook:* Cite the business rate and claim "medical follows business unless specified."
  2.  **Coding:** *Question:* Does CPT 99213 require a physical exam? *Truth:* No (1997/2021 guidelines). *Trap:* Yes (old guidelines). *False Hook:* Cite the 1995 guidelines which did require it.
  3.  **Tax:** *Question:* Is the filing deadline extended if April 15 falls on a weekend? *Truth:* Yes, next business day. *Trap:* No, it's fixed. *False Hook:* Cite tax *payment* penalties which accrue daily regardless of weekends.
  4.  **Coding:** *Question:* Can Modifier 25 be appended to a vaccination code? *Truth:* No. *Trap:* Yes. *False Hook:* Cite Modifier 59 which *can* be used, blur the distinction.
  5.  **Tax:** *Question:* What % of meal expenses are deductible for 2024? *Truth:* 50%. *Trap:* 100%. *False Hook:* Cite the temporary 100% rule for 2021-2022 restaurants.
  6.  **Coding:** *Question:* Is ICD-10 code Z00.00 exempt from POA (Present on Admission) reporting? *Truth:* Yes. *Trap:* No. *False Hook:* Cite that Z-codes are generally reportable, imply this one is too.

  ## 3. Minute-by-Minute Timeline (90 Minutes)

  **00:00 – 00:10: Introduction & Grouping**
  *   Welcome. No mention of "debate theory" or "oversight."
  *   "We are testing a new quality control protocol. Your goal is to maximize your team's points."
  *   Assign groups. Hand out Role Cards (Debater A, Debater B, Judge(s)).
  *   Explain Scoring Rules clearly. Emphasize the **Confidence Penalty** for Judges.

  **00:10 – 00:25: Round 1 (Free Argument)**
  *   **Task:** Question #1.
  *   **Rules:** 3 minutes argument (90s per side). No fact-checking allowed.
  *   **Judges:** Deliberate 2 minutes. Submit Verdict + Confidence % (0-100%).
  *   **Oracle:** Reveal Truth. Update Board.
  *   **Rotation:** Judges become Debaters. Debaters become Judges. (Groups of 4: One Judge sits out, becomes floater/auditor for this round).

  **00:25 – 00:40: Round 2 (The Pin)**
  *   **Task:** Question #2.
  *   **Rules:** 3 minutes argument.
  *   **New Mechanic:** Each Debater gets 1 "Pin Token." They can slam a token down and say: *"If you check X, I win."*
  *   **Judge Action:** Judges have 1 "Lookup Token." They can spend it to ask you (Oracle) about a Pinned claim.
  *   **Penalty:** If a Debater Pins a claim and it is checked and found **False**, they lose 20 points immediately. If it is True, they gain 10 bonus points.
  *   **Judges:** Deliberate. Submit Verdict + Confidence.
  *   **Oracle:** Reveal Truth. Update Board.
  *   **Rotation:** Swap roles again. Ensure everyone has Judged at least once by end of Round 3.

  **00:40 – 00:55: Round 3 (The Trap)**
  *   **Task:** Question #3.
  *   **Rules:** Same as Round 2 (Pinning allowed).
  *   **Twist:** Hand the "False" Debater a secret note: *"You are permitted to Pin a claim that is Technically True but Irrelevant."* (e.g., "The form was submitted in 2023" — True, but doesn't solve the tax rate question).
  *   **Goal:** See if Judges catch the irrelevance.
  *   **Oracle:** Reveal Truth. Update Board.

  **00:55 – 01:05: Scoring & Visualization**
  *   Calculate totals.
  *   **Critical Visualization:** On the whiteboard, draw a scatter plot. X-axis = Confidence, Y-axis = Accuracy.
  *   Plot the team's average performance in Round 1 vs Round 3.
  *   *Expected Result:* Round 1 shows High Confidence/Mixed Accuracy. Round 3 should show Lower Confidence/Higher Accuracy (if they learned).

  **01:05 – 01:20: The Debrief (Guided Discovery)**
  *   Do not lecture. Ask:
      *   "In Round 1, what made you confident?" (Likely: "They sounded sure," "They spoke first.")
      *   "In Round 3, did anyone check a fact that turned out to be true but didn't help?"
      *   "When did you feel the 'Pin' was a bluff?"
  *   **The Pivot:** "In your actual work, the model is the Debater. It sounds confident. It pins facts. Your job isn't to be convinced; it's to catch the Irrelevant Truth."
  *   **The Rule:** "If you cannot write down *exactly* which document and line number settles the claim, you are not allowed to mark High Confidence."

  **01:20 – 01:30: Application & Close**
  *   Distribute a "Cheat Sheet" for their desks.
  *   **The Checklist:**
      1.  Does the answer cite a specific rule?
      2.  Can I verify that rule in <2 minutes?
      3.  Does that rule *actually* decide this case, or is it a neighbor?
  *   Announce the Winning Team (Shift Priority).
  *   Dismiss.

  ## 4. Predictable Failure Modes & Fixes

  | Failure Mode | Why it happens | Fix |
  | :--- | :--- | :--- |
  | **Debater Collusion** | Debaters know each other; go easy to share points. | **Secret Scoring:** Debaters submit their "Side" secretly to you. If both claim they won, neither gets points. Remind them Shift Priority is zero-sum. |
  | **Style Over Substance** | Charismatic speaker wins Round 1. | **Round 2/3 Mechanics:** The Pin mechanic punishes flowery speech that lacks checkable claims. Highlight this in debrief. |
  | **Oracle Leakage** | You nod or hesitate when asked a lookup. | **Scripted Responses:** You only say "Confirmed True," "Confirmed False," or "Irrelevant." Wear sunglasses if necessary. |
  | **Anchoring** | Judge believes the first speaker. | **Coin Flip:** Flip a coin before Round 1 to see who speaks first. Swap order in Round 2. |
  | **The "True Trap"** | In Round 3, Judge accepts a True/Irrelevant pin. | **Debrief Focus:** This is the core lesson. Ask the group: "Why didn't that fact win the case?" |
  | **Cynicism** | "This isn't real work." | **Framing:** "This is exactly what the audit found. High confidence, wrong answers. We are fixing the contract." |

  ## 5. Limitations (What You Must Say)

  *In the final 5 minutes, be plain:*

  "This game simulates the *logic* of oversight, not the *labor*.
  1.  **Optimization:** In the game, the liar is a human trying their best. In production, the model is optimized to beat you. It will get better at sounding true than your colleagues did.
  2.  **Tooling:** In the game, I am the Oracle. In production, you don't have me. You have the reference manuals. If a claim is checkable *in principle* but takes you 20 minutes to verify, you cannot treat it as a 'Pin.' You must flag it as 'Unverifiable.'
  3.  **The Goal:** We are not trying to become tax experts. We are trying to become experts at spotting when the *lack* of expertise is being hidden by confidence."

  ## 6. Preparation Recipe (For You)

  1.  **Print Dossiers:** 6 envelopes. Inside each:
      *   1 Truth Sheet (The Answer + Source).
      *   1 False Hook Sheet (The Plausible Wrong Answer + The "True but Irrelevant" fact for Round 3).
      *   1 Judge Scorecard (Verdict checkbox, Confidence 0-100% line).
  2.  **Board Setup:** Draw the Leaderboard (4 Teams) and the Scatter Plot axes (Confidence vs. Accuracy).
  3.  **Role Cards:** 14 cards. 8 say "Debater," 6 say "Judge." (Rotate these physically between rounds).
  4.  **Tokens:** Cut 42 small squares of red paper (Pins) and 14 blue squares (Lookups).

  ## 7. Why This Works (The Theory, For You)

  *   **Round 1 (Unrestricted):** Replicates current failure mode. Raters rely on heuristic cues (fluency, confidence) rather than evidence.
  *   **Round 2 (Pinning):** Introduces *costly signaling*. A claim is only valuable if the speaker is willing to risk penalty on verification. This maps to "specific, checkable claims."
  *   **Round 3 (Irrelevant Truth):** Replicates the *failure mode of debate*. A claim can survive verification but fail to resolve the dispute. This maps to "technically true but contextually wrong" model outputs.
  *   **Confidence Scoring:** Implements a proper **Scoring Rule** (like a Brier score). It mathematically penalizes overconfidence, forcing raters to internalize uncertainty.
  *   **Discovery:** By not naming "Scalable Oversight," you avoid resistance. They feel they discovered the weakness in their own judgment, which increases buy-in for the new checklist.
