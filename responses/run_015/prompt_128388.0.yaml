answer: |-
  You must replace the claim that vote weight is an "engineering question" with a constraint on state power: **Political legitimacy requires that every subject of coercive law holds an equal unit of political agency that the state may not quantitatively differentiate, though individuals may voluntarily transfer or pool their own units.**

  This principle resolves your contradiction by locating the moral hazard in *who* assigns influence, not in the distribution itself. Your tentative principle failed because it treated vote weighting as a consequentialist optimization problem; if better outcomes are expected from weighting by competence, your original principle demands you accept it. The revised principle treats political equality as a deontological right: the state cannot declare one citizen's judgment inherently worth more than another's, even if true, because doing so creates classes of citizenship that violate the status equality required to legitimize coercion.

  **Clauses and Motivations:**
  1.  **"Every subject of coercive law..."** motivates including prisoners and non-citizen residents. If the law binds you, you must have a hand in writing it. This clause forces you to reject excluding long-term tax-paying residents from municipal elections and excluding prisoners.
  2.  **"...holds an equal unit... that the state may not quantitatively differentiate..."** motivates rejecting competence weighting and mandatory civics tests. The state cannot measure your soul or brain and assign you 0.5 votes while giving your neighbor 1.5. This explains why the civics test without a remedy is unacceptable (it creates a state-enforced hierarchy of voters) while competence weighting is forbidden entirely.
  3.  **"...though individuals may voluntarily transfer or pool their own units."** motivates accepting delegable voting and sortition. In liquid democracy, the inequality of influence arises from *your* choice to trust someone else, not from state fiat. In sortition, the inequality is random and temporary, preserving ex-ante equality. This explains why you trust the lotteried assembly more than a referendum: the assembly members are peers empowered by chance, not elites empowered by assessment.

  **Verdicts It Cannot Accommodate:**
  This principle pressures your verdict on **sixteen-year-olds**. If the trigger is "subject to coercive law," sixteen-year-olds qualify. To accommodate your "fine" verdict, you must add a caveat regarding "full legal agency," treating age as a universal proxy for capacity rather than an individual assessment. This is permissible under the principle because it is a binary threshold for agency (like contract law), not a spectrum of competence assigned by the state. However, if your fiction depicts sixteen-year-olds as fully subject to criminal and civil law without exceptions, consistency demands they vote.

  **New Cases:**
  *   **Citizens resident abroad:** They vote only if subject to continuing coercive obligations (e.g., taxation, conscription). If they have severed legal subjection, they lose the vote, not because they are uninformed, but because the coercion link is broken.
  *   **Decisions affecting the unborn:** Future generations cannot vote because they lack agency and cannot be coerced. Their interests must be represented by a guardian institution (e.g., an ombuds for the future) within the assembly, but they cannot hold the vote themselves without breaking the agency requirement.
  *   **Systematically misinformed electorate:** The state cannot weight votes to correct this, as that violates the non-differentiation clause. The remedy is structural: expand sortition (which filters noise through deliberation) or protect speech rights to allow counter-information, rather than disenfranchising the misled.

  **The Wavering Case (Non-citizen residents voting for national delegate):**
  They must vote. Your hesitation relies on the claim that national decisions require knowledge they lack. This is the competence argument in disguise. If they are subject to national laws (which residents are), the coercion principle grants them the vote. To deny them based on "knowledge" is to assert the state can measure political capacity, which your rejection of competence weighting forbids. The risk of uninformed voting is a price paid for political equality; the remedy is better briefing (as in your sortition model), not exclusion.
