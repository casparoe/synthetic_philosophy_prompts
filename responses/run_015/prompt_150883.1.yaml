  # Graduate Examination: Philosophy of Mind
  **Time Allowed:** 90 Minutes
  **Instructions:** Answer the following question. Your response should rely on conceptual analysis rather than exegesis of specific texts. Citations and bibliographies are not required.

  **Question:**

  Consider a hypothetical cognitive architecture containing a "shadow broadcast" pathway. In this system, sensory information achieves phenomenal presence—there is determinately something-it-is-like for the system to process the data—without ever entering the global workspace. Crucially, this dissociation occurs not due to selection failure or capacity limits, but only under conditions of *active attentional suppression*, where the system mechanically blocks global ignition while maintaining local phenomenal integrity.

  Evaluate the philosophical implications of this architecture. Does this scenario collapse the access/phenomenal distinction, force a revision to what "global" availability requires, or instead reveal a hidden ambiguity in the integration constraint on consciousness? Defend your position against the following three objections: (1) that shadow broadcasting is merely unconscious processing misdescribed; (2) that phenomenal presence without access is conceptually incoherent; and (3) that the architecture violates the integration constraint central to workspace theories.

  ***

  # Model Answer

  This hypothetical architecture forces a revision to what "global" availability requires within Global Workspace Theory (GWT), rather than collapsing the access/phenomenal distinction or merely exposing an ambiguity in integration. The scenario stipulates a dissociation where phenomenality exists without global ignition, provided attentional suppression is active. If we accept the stipulation that there is "determinately something-it-is-like," we must concede that global broadcasting is not necessary for phenomenal consciousness (P-consciousness). Consequently, GWT must be revised to treat global availability as a condition for *reportable access* (A-consciousness) rather than phenomenality itself.

  The first objection claims shadow broadcasting is merely unconscious processing misdescribed. This objection attempts to dissolve the hypothetical by denying the premise. However, in philosophical thought experiments, stipulations regarding phenomenality must be respected unless they entail a logical contradiction. To assert that suppressed processing *must* be unconscious is to beg the question against the possibility of P-without-A. If the system exhibits behavioral markers of feeling (e.g., local avoidance behaviors driven by qualitative states) without reportability, labeling it "unconscious" is merely terminological stubbornness. The shadow pathway suggests phenomenality is a local property of sensory modules, not a global emergent property.

  The second objection argues that phenomenal presence without access is conceptually incoherent. This relies on a verificationist intuition: if a state cannot be accessed for reasoning or reporting, it cannot meaningfully be called conscious. However, this conflates *access for control* with *access for experience*. The shadow pathway demonstrates that a state can be accessible to the *subject* (phenomenally) without being accessible to the *conceptual system* (globally). The incoherence charge fails because it assumes a monolithic notion of access. By distinguishing between access for global manipulation and access for subjective feeling, the scenario remains conceptually stable. The revision required is to acknowledge that "access" is not a unitary natural kind.

  The third objection contends that the architecture violates the integration constraint central to workspace theories. GWT posits that consciousness arises from the integration of disparate information into a coherent whole via broadcasting. The shadow pathway suggests integration can occur locally without global propagation. This does not violate the constraint so much as it relocates the locus of integration. If phenomenality persists under suppression, then "integration" sufficient for consciousness must be achievable within modular boundaries. The revision to GWT, therefore, is to decouple *global* integration from *phenomenal* integration. Global workspace becomes the theater for *shared* information use, while shadow pathways support *private* phenomenal experience.

  In conclusion, the shadow broadcast scenario vindicates the distinction between access and phenomenality by showing they rely on different architectural conditions. It forces GWT to retreat from being a theory of phenomenality to a theory of cognitive access. The "global" in Global Workspace must be understood as "globally available for report and control," not "globally necessary for feeling." Accepting this revision preserves the utility of workspace models for explaining cognitive control while accommodating the reality of phenomenal states that remain locally integrated but globally suppressed.

  ***

  # Marking Scheme (Total: 25 Marks)

  | Conceptual Move | Marks | Typical Student Error |
  | :--- | :---: | :--- |
  | **1. Interpretation of Architecture:** Correctly identifies that "active attentional suppression" rules out standard inattentional blindness or capacity overload explanations. | 5 | Treating the suppression mechanism as simple neglect or selection failure. |
  | **2. Thesis Selection:** Takes a definitive stance on the three options (collapse, revision, or ambiguity) rather than summarizing Block or Baars without adjudication. | 5 | Hedging the position or merely recounting the standard Block/Baars debate without applying it to the hypothetical. |
  | **3. Response to Objection 1 (Unconscious):** Defends the stipulation of phenomenality against the claim that it is merely unconscious processing, avoiding question-begging. | 5 | Accepting the objection by defaulting to the view that non-reported states are necessarily unconscious. |
  | **4. Response to Objection 2 (Incoherence):** Distinguishes between types of access (e.g., subjective feeling vs. reportable control) to refute conceptual incoherence. | 5 | Equating "access" solely with reportability or rational control, ignoring phenomenal access. |
  | **5. Response to Objection 3 (Integration):** Argues that integration can be local rather than global, thereby revising rather than abandoning the constraint. | 5 | Assuming integration necessarily requires global broadcasting to all systems. |
