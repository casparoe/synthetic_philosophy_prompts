answer: |-
  # Pre-Reading Diagnostic: Accounts of Human Nature

  **Instructions:** Read each scenario and select the option that best matches your intuition. There are no right or wrong answers; this instrument is designed to map your pre-existing assumptions about where morality comes from and how it develops.

  **1. The Bystander and the Well**
  You see a stranger's toddler crawling toward an open well. You feel a sudden jolt of alarm. What is the source of that jolt?
  *   A. It is an automatic signal, like a reflex, that exists in everyone before they think. **[Repertoire]**
  *   B. It is a learned association; you know bad things happen near wells. **[Repertoire]**
  *   C. It is a mix; some people feel it, others calculate the risk first. **[Repertoire]**

  **2. The Famine and the Surplus**
  A community shares food generously while harvests are good. A severe famine strikes, removing the surplus. What happens to the sharing?
  *   A. It collapses immediately; survival drives override generosity. **[Trajectory]**
  *   B. It holds firm; the bond is stronger than the hunger. **[Trajectory]**
  *   C. It varies; some groups share, others hoard, depending on leadership. **[Trajectory]**

  **3. The First Lawgiver**
  Imagine the very first leaders who established rules for polite behavior and sharing. How did they know what rules to make?
  *   A. They listened to a quiet inner voice that told them what was right. **[Source]**
  *   B. They observed what caused fighting and invented rules to stop it. **[Source]**
  *   C. They received instructions from spirits or gods outside humanity. **[Source]**

  **4. The Reluctant Student**
  A student says they love learning but constantly needs to be pushed to finish their work. What does this say about their love of learning?
  *   A. The love is real but fragile; it needs a structured environment to survive. **[Trajectory]**
  *   B. The love is an illusion; their true nature is to avoid effort. **[Trajectory]**
  *   C. The love is irrelevant; only the finished work matters, however produced. **[Trajectory]**

  **5. The Sage's Tool (Regress Worry)**
  If ordinary people have no innate sense of propriety, how did the first sages construct ritual without already having one?
  *   A. They used a mental capacity for planning that is distinct from moral feeling. **[Source]**
  *   B. They had a full moral sense that ordinary people have since lost. **[Source]**
  *   C. They didn't construct it; they discovered patterns already in the world. **[Source]**

  **6. The Walked-Away Chance (Neglect Worry)**
  A person sees someone in distress, feels a tug to help, but walks away. Later they regret it. Why did they walk away?
  *   A. They drowned out a signal they originally had. **[Repertoire]**
  *   B. They never had a signal; the regret is just fear of punishment. **[Repertoire]**
  *   C. The signal was too weak to count as a real part of them. **[Repertoire]**

  **7. The Newborn and the Water**
  Consider a newborn infant, before any teaching. Is their nature oriented toward good, bad, or neither?
  *   A. Neither; they are like water that flows east or west depending on the channel. **[Trajectory]**
  *   B. Toward good; they lean toward connection and care like a plant toward light. **[Trajectory]**
  *   C. Toward bad; they scream for food and comfort without regard for others. **[Trajectory]**

  **8. The Siblings**
  Two siblings are raised in the exact same home. One becomes kind, the other cruel. Why?
  *   A. They started with different raw materials; one was naturally better. **[Repertoire]**
  *   B. They started the same; one chose to nurture their growth, the other didn't. **[Repertoire]**
  *   C. They started the same; external luck determined their paths. **[Repertoire]**

  **9. The Ritual Bow**
  You bow to an elder. It feels correct. Why does it feel correct?
  *   A. Because it honors a relationship that already exists inside you. **[Source]**
  *   B. Because it follows a social script that keeps order. **[Source]**
  *   C. Because it is a habit you were drilled in until it felt automatic. **[Source]**

  **10. The Years of Drill**
  A person becomes reliably generous only after years of strict practice and correction. What did the drill do?
  *   A. It revealed and strengthened a tendency that was hidden. **[Trajectory]**
  *   B. It built a new second nature that replaced the old one. **[Trajectory]**
  *   C. It suppressed the old nature, which remains unchanged underneath. **[Trajectory]**

  ***

  # Scoring Key and Logical Space

  ## I. The Logical Space (The Tree)

  To locate the positions, we branch on three dimensions derived from the quiz questions.

  **Branch 1: The Raw Repertoire (Questions 1, 6, 8)**
  *   **Yes:** The unlearned mind contains moral material (sprouts/signals).
  *   **No:** The unlearned mind contains only biological drives (hunger/comfort).
  *   **Neutral:** The unlearned mind is indeterminate material (water/clay).

  **Branch 2: The Natural Trajectory (Questions 2, 4, 7, 10)**
  *   **Order:** Left to itself, the repertoire tends toward connection/cooperation.
  *   **Disorder:** Left to itself, the repertoire tends toward conflict/chaos.
  *   **Variable:** The trajectory depends entirely on external shaping.

  **Branch 3: The Source of Ritual (Questions 3, 5, 9)**
  *   **Internal:** Ritual is the cultivation of inner material (Discovery).
  *   **External:** Ritual is the invention of wise leaders to constrain behavior (Artifice).
  *   **Mixed:** Ritual is external but resonates with internal capacity.

  ## II. Position Mapping

  | Position | Repertoire | Trajectory | Source | Quiz Profile |
  | :--- | :--- | :--- | :--- | :--- |
  | **Mencius (Incipient)** | Yes (Sprouts) | Order (Needs Help) | Internal (Growth) | Mostly A on Rep/Source; A on Traj (Q4, Q10) |
  | **Mencius (Full)** | Yes (Dispositions) | Order (Auto) | Internal (Expression) | Mostly A on Rep/Source; B on Traj (Q4, Q10) |
  | **Xunzi (Thin)** | No (Drives Only) | Disorder (Conflict) | External (Invention) | Mostly B on Rep/Source; A/B on Traj (Q10=B) |
  | **Xunzi (Substantive)** | No (Self-Regard) | Disorder (Active Chaos) | External (Correction) | Mostly B on Rep/Source; B on Traj (Q2, Q7) |
  | **Gaozi (Indifferent)** | Neutral | Neutral (Channelled) | External (Shaping) | Mostly C on Rep/Traj; B on Source |
  | **Malleable (Can Go Either)** | Yes/No (Potential) | Variable | Mixed | Mix of A/B; C on Traj (Q7) |
  | **Mixed (Some Good/Some Bad)** | Variable (By Person) | Fixed (By Person) | External | A on Q8; B on Q1/Q6 |

  ## III. Diagnosis of Combinations

  1.  **Unoccupied Leaf (Yes Repertoire + Disorder Trajectory):** *Incoherent.* If the raw material contains moral sprouts, it is conceptually difficult to argue they naturally tend toward chaos without an external corrupting force stronger than the sprouts themselves (which moves the view toward "Malleable").
  2.  **Unoccupied Leaf (No Repertoire + Order Trajectory):** *Unattractive.* If there is no moral material inside, it is hard to explain why unlearned humans would tend toward order rather than mere neutrality or conflict over resources.
  3.  **Over-crowded Leaf (Xunzi Thin vs. Substantive):** *Merely Unexplored.* The distinction relies on whether "nature" is defined strictly as *unlearned* (Thin) or as *dominant psychological drive* (Substantive). The quiz treats them as one cluster because they yield identical practical prescriptions (need for external ritual).
  4.  **Unoccupied Leaf (Internal Source + Disorder Trajectory):** *Incoherent.* If ritual authority comes from within, but the inner nature tends toward disorder, the internal authority would command disorder, negating the definition of ritual as order.

  ## IV. Indistinguishable Leaves

  *   **Mencius (Incipient) vs. Mencius (Full):** This instrument cannot reliably separate these. Both select "Internal Source" and "Yes Repertoire." The difference lies in *how much* effort is required to reach sagehood. Question 4 and 10 attempt to probe this (Fragile vs. Automatic), but student self-reporting on "effort" is often ambiguous.
      *   *Separating Question:* "Does a sage still need to think about doing the right thing, or does it happen without thought?" (Full = Without thought; Incipient = Still requires mindful cultivation).

  ## V. Glossary of Terms (Confidence Levels)

  *   **_Xing_ (Nature):** **Confident.** In this context, it refers to what is born with you, unlearned and unworked. Both Mencius and Xunzi use this term, but they disagree on its content.
  *   **_Wei_ (Artifice/Activity):** **Confident.** Specifically in Xunzi's philosophy, this refers to conscious activity, training, and ritual construction that is *not_ part of _Xing_. It is the "human effort" that straightens the crooked wood. (Note: In other contexts, _wei_ can simply mean "to do," but here it carries the technical weight of "constructed order".)

