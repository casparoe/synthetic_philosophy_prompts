answer: |-
  Here is the residue report you asked for. I'm going to skip the polite preamble and the tidy tables. You want to know where the map tears, so I'm going to point directly at the tears.

  ### 1. Primitives: Matches, Distortions, and Voids

  Here is the brainstormed list of primitives, flagged by how well they survive the translation from Epistemic Game Theory (EGT) to your MARL stack.

  **Clean Matches (Engineering $\approx$ Epistemic)**
  *   **Best Response:** Your "Oracle / Exploitability Minimizer" is exactly the EGT "Best Response." The only difference is you compute it via gradient descent, they compute it via argmax.
  *   **Strictly Dominated (by pure):** A policy that is never selected by the Oracle against any opponent policy in the current population support.
  *   **Rationality:** A converged policy (exploitability $\approx 0$).
  *   **Correlation Device:** Centralized training signal / shared noise / communication channel. You know this one cold.

  **Distorted Matches (Requires Stretching)**
  *   **Belief:** In EGT, this is a probability distribution over opponent *types* or *strategies*. In your stack, this is the **Training Distribution** (the mixture of opponents you sample from).
      *   *The Distortion:* EGT beliefs are internal states of the agent. Your training distribution is an external hyperparameter or a replay buffer. You don't *have* a belief; you *have* a dataset. The translation works only if you treat the replay buffer as the physical instantiation of the belief.
  *   **Mixed Strategy:** In EGT, a probability distribution over actions. In your stack, a **Stochastic Policy** or a **Mixture of Deterministic Policies** in the population.
      *   *The Distortion:* EGT mixes to make opponents indifferent. You mix (often) to stabilize gradients or cover modes. The *function* is different, even if the math looks the same.
  *   **Population:** In PSRO, this maps to the set of **Types** in a type space.
      *   *The Distortion:* EGT type spaces are usually infinite or fixed ex-ante. Your population is dynamic and finite.

  **No Expression (The Voids)**
  *   **Common Belief:** You have no primitive for this. You have *history* (checkpoints), but no mechanism to enforce that "Agent A knows that Agent B knows..." other than hoping the training curriculum implicitly captures it.
  *   **Belief over Beliefs (Higher Order):** Your opponent models condition on latent embeddings of *policy*, not embeddings of *belief*. You model "Who are they?" not "What do they think I am?"
  *   **Independent Beliefs (Product Structure):** Your CTDE setup often implicitly assumes joint distributions (centralized critic sees everything). Explicitly constraining the "belief" (training distribution) to be a product of marginals is rarely done, yet this is the crux of your 3-player example.

  ---

  ### 2. Restating the IESDS Argument in MARL Vocabulary

  You asked for the standard story (Rationality + Common Belief $\implies$ IESDS) restated in your terms, without smuggling in assumptions. Here is the faithful translation of the logic (a)/(b)/(c).

  **(a) The Base Case: Mixed Dominance $\implies$ Never a Best Response**
  *   *EGT:* If $\sigma_i$ is strictly dominated by a mixture, it is not a BR to *any* belief $\mu_{-i}$.
  *   *MARL Translation:* If a policy $\pi_i$ in your population is strictly worse (in expected return) than a **mixture of other policies in your population** against **every possible opponent joint-policy** that can be constructed from the opponent population, then the Oracle will never output $\pi_i$.
  *   *The Catch:* "Every possible opponent joint-policy" means any distribution over the opponent population's joint actions. In a 3-player game (You vs. Opp1 & Opp2), this allows the training distribution to correlate Opp1 and Opp2. If your training loop samples Opp1 and Opp2 independently from their respective populations, you are *not* testing against "any belief." You are testing against "any product belief."

  **(b) The Iteration: Pruning the Population**
  *   *EGT:* If I believe you are rational, I assign probability 0 to your dominated strategies. This restricts my belief support. This restriction might make *my* previously safe strategies now dominated.
  *   *MARL Translation:* If you prune policies from the opponent population that have high exploitability (are "irrational"), the training distribution for the next round changes. The Oracle, training against this **pruned population**, may now find that policies which were previously viable are now exploitable.
  *   *The Catch:* This requires a **curriculum**. You must explicitly remove the "dominated" policies from the opponent pool before training the next generation. If you keep them in the replay buffer, the "belief" (buffer) still has support on irrational strategies, and the deletion stops.

  **(c) The Fixed Point: Common Belief**
  *   *EGT:* The process stops when no more strategies can be deleted. This set is the rationalizable strategies.
  *   *MARL Translation:* The process stops when your **Population Play** converges to a set of policies where every policy is a Best Response to some mixture of the *current* opponent policies, and no policy can be improved by mixing others.
  *   *The Catch:* In EGT, "Common Belief" is an infinite hierarchy. In MARL, this is **Finite Depth Self-Play**. You only capture $k$ levels of "I think that you think..." where $k$ is the number of PSRO iterations or the depth of the self-play history.

  ---

  ### 3. The 3-Player Example: The Correlation Commitment

  Your example is correct, and it exposes the single biggest lie told in introductory game theory translations to engineering.

  **Your Finding:**
  *   "Anti" is a Best Response to a *correlated* belief over (Bob, Cara).
  *   "Anti" is *Never* a Best Response to an *independent* (product) belief over (Bob, Cara).
  *   Therefore, standard IESDS (which deletes "Anti") assumes agents hold correlated beliefs about opponent profiles.

  **The Epistemic Reality:**
  In a 2-player game, a belief over the opponent's strategy is just a distribution. In a 3-player game, a belief over the *opponents' profile* is a distribution over $S_{Bob} \times S_{Cara}$.
  *   **Standard IESDS** assumes that Ann's belief $\mu_{Bob, Cara}$ can be *any* point in the simplex over $S_{Bob} \times S_{Cara}$. This includes correlations (e.g., "If Bob goes Up, Cara goes Right").
  *   **Independent Rationalizability** restricts $\mu_{Bob, Cara}$ to be $\mu_{Bob} \times \mu_{Cara}$.

  **The MARL Implication:**
  When you run PSRO or train against a population in a 3+ player game:
  1.  **If you sample opponents independently** (sample Bob from Pop_B, sample Cara from Pop_C): You are implementing **Independent Rationalizability**. You will *not* delete "Anti". Your agent will learn to play it if the population support warrants it.
  2.  **If you sample opponent *joint-policies*** (sample a tuple $(\pi_B, \pi_C)$ from a joint distribution, perhaps trained together): You are implementing **Standard IESDS**. You *will* delete "Anti".

  **Does mixed dominance secretly assume correlated belief?**
  **Yes.** In $N \ge 3$ games, the statement "Strategy $s$ is dominated by a mixture" is equivalent to "Strategy $s$ is not a Best Response to *any* distribution over opponent profiles." Since the set of *all* distributions includes correlated ones, the dominance check implicitly validates the strategy against correlated opponent behavior.

  If you want the "Independent Belief" version of deletion, you cannot just delete rows based on standard dominance. You would need a deletion procedure that checks: "Is there a product distribution over opponents against which this is a BR?" That is a non-convex constraint check and is not standard IESDS.

  ---

  ### 4. The Hierarchy of Beliefs: Hole or Feature?

  You asked: *The infinite hierarchy of beliefs has no home in anything I build—is that a hole?*

  **Verdict:** It is a hole in *theory*, but a feature in *practice*.

  In EGT, the hierarchy ($\mu^1, \mu^2, \dots$) is necessary to define the solution concept without reference to a specific game structure. It ensures the solution is robust to *any* reasoning depth.

  In MARL, the **Population** is the hierarchy.
  *   Generation 0: Random noise (Level-0).
  *   Generation 1: Best Response to Gen 0 (Level-1).
  *   Generation 2: Best Response to Gen 1 (Level-2).

  **Where the translation breaks:**
  EGT assumes the hierarchy is **common knowledge**. In your stack, the hierarchy is **archived data**.
  *   If your agent at inference time faces a novel opponent, the EGT story says "They are rational, so they won't play dominated strategies."
  *   Your MARL agent says "They are out-of-distribution relative to my population."

  **Does it bother you?**
  Only if you care about **generalization to novel reasoning depths**. If you train a Level-5 agent and deploy it against a Level-10 agent (or a human), the "Common Belief" assumption fails. Your agent assumes the opponent's behavior lies within the convex hull of its training population. If the opponent operates on a higher level of the belief hierarchy than your population depth, you get exploited.
  *   *Fix:* This is why PSRO tries to cover the *whole* strategy space, not just a ladder. But practically, you are always bounded by compute depth.

  ---

  ### 5. Approximation: The Load-Bearing Truth

  You asked: *Does any of this survive approximation, or is exact optimality load-bearing?*

  **Hard Truth:** Exact optimality is load-bearing for the *logic*, but not for the *heuristic*.

  1.  **Strict Dominance Vanishes:** In exact math, if $EU(\sigma) > EU(s)$ by $\epsilon$, $s$ is dominated. In RL, if your exploitability estimate has variance $\sigma^2 > \epsilon$, you cannot statistically distinguish the dominated strategy from the dominant one.
  2.  **The "Never" in NABR:** "Never a Best Response" becomes "Rarely a Best Response."
  3.  **The Collapse of Iteration:** In EGT, Round 2 deletion depends on Round 1 being *complete*. If you leave a single dominated strategy in the opponent pool (because your optimizer got stuck in a local minimum), the "Belief in Rationality" is broken. The support of the belief is contaminated. Round 2 deletions are no longer logically valid.

  **Does the translation survive?**
  It survives as a **Regularizer**, not a Guarantee.
  *   **Use it for:** Designing your population update rule. If a policy in your population has high exploitability against the *current* mixture, prune it. This mimics Round 1 deletion.
  *   **Don't use it for:** Proving convergence. You will not converge to the Rationalizable Set. You will converge to an $\epsilon$-Nash or a local optimum of the training objective.

  **The "Independent Belief" nuance in Approximation:**
  In your 3-player example, if you are approximating, the distinction between "Correlated Belief" and "Independent Belief" blurs. If your opponent model is a neural net taking observations of Bob and Cara, it can *learn* correlations even if you sample them independently, provided those correlations exist in the environment dynamics or reward structure.
  However, if the correlation is purely epistemic (Ann *believes* Bob and Cara correlate, but they don't), your MARL agent won't capture that unless you explicitly feed it a "correlation signal" or train it against correlated tuples.

  ### Summary Residue

  1.  **Primitives:** "Belief" is your Training Distribution. "Common Belief" is your Population Depth. "Correlation" is your Sampling Strategy (Joint vs. Independent).
  2.  **Your Example:** You are right. Mixed dominance in 3+ player games assumes agents entertain correlated beliefs about opponent profiles. Standard IESDS deletes "Anti". Independent Rationalizability keeps it. Your MARL stack decides which one you get based on whether you sample opponent tuples jointly or independently.
  3.  **Hierarchy:** It exists in your checkpoint history. It is finite. This is a limitation for generalization, not necessarily for convergence within the training distribution.
  4.  **Approximation:** The logic is brittle. Treat IESDS as a pruning heuristic for your population (remove high-exploitability policies), not as a convergence guarantee. The "Common Belief" assumption is violated every time your optimizer fails to converge globally.

  **Final Advice:** Don't try to build "Beliefs about Beliefs" explicitly. It's a trap. Instead, manage the **support of your training distribution**. If you want the IESDS outcome, aggressively prune policies that are dominated against the current population mixture. If you want to handle the 3-player correlation nuance, be explicit about whether your opponent sampling is joint or factorized. That switch is the engineering knob for the epistemic assumption.
