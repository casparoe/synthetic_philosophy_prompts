  **FOR IMMEDIATE RELEASE**

  **ORRIDGE SYSTEMS SECURES FIRST "NON-AGENT" CERTIFICATION FOR NEW LARGE LANGUAGE MODEL**

  **SAN FRANCISCO, CA** — Orridge Systems today announced that its flagship model, Orridge-7, has received formal certification from the Global Compute Safety Consortium (GCSC) as a Class-1 Instrumental Tool. This designation legally confirms the system possesses no internal goals, ensuring it remains strictly subordinate to human direction.

  "Safety is not just about constraints; it is about ontology," said Elena Voss, CEO of Orridge Systems. "By architecting a system that is fundamentally not an agent, we remove the risk of goal misalignment at the source. Orridge-7 does not want anything. It only does."

  The certification relies on a rigorous technical specification regarding goal ownership, temporal horizon, and optimization procedures.

  **Technical Specification & Compliance FAQ**

  1.  **Goal Origination:** Orridge-7 is certified as goal-less. While the model was trained on text produced by agents with desires, the system itself does not inherit these orientations. It predicts tokens based on user prompts; any apparent preference is merely statistical imitation, not internal valuation. The system is oriented toward nothing, except where oriented toward something by the user.
  2.  **Temporal Horizon:** To prevent emergent planning, the system operates on fifteen-minute warrants. Each execution cycle halts after 900 seconds of wall-clock time. However, users may chain up to ninety-six warrants sequentially. This allows Orridge-7 to book travel, refactor codebases, and negotiate email threads across a full business day, provided control is returned to the user every fifteen minutes. This hard stop guarantees the system never forms long-term intentions.
  3.  **Optimization Definitions:** Regulators have clarified that the loss function minimized during training is a development-time procedure, not a runtime goal. Because the objective function is not actively minimizing error during inference, it does not count as a "goal" under Section 4.2 of the Safety Act. The system is not trying to be correct; it is merely outputting correctness.
  4.  **Workflow Classification:** Orridge-7 supports agentic workflows, allowing it to autonomously use tools and browse the web. For marketing purposes, these are described as "agentic capabilities" to highlight efficiency. For safety compliance, these same behaviors are classified as "purely instrumental sub-routines," as they serve the user's warrant rather than an internal reward signal.

  "This certification creates a clear bright line," said Marcus Chen, Chief Safety Officer. "We can offer the power of autonomy without the liability of agency."

  Not all observers are convinced the distinction holds water, though most acknowledge the legal utility. "They have defined 'goal' in a way that excludes the forces that actually shape the system's behavior," said Dr. Aris Thorne of the Institute for Computational Normativity. "It is a coherent legal framework, provided one accepts that training dynamics do not constitute a form of intent. It solves the regulatory problem, if not the philosophical one."

  Orridge-7 is available immediately to enterprise partners under the Instrumental License Agreement.

  **About Orridge Systems**
  Orridge Systems builds compliant artificial intelligence for the regulated enterprise. We do not build agents. We build tools.

  ***

  **Commentary**

  I'm highly confident this is a fair caricature of the "tool AI" safety position. The industry frequently relies on these exact semantic distinctions to navigate liability while selling autonomy. The joke I'm least sure is fair is the "training objective as development-time procedure" clause. Some safety researchers genuinely distinguish between base objectives and mesa-optimizers, arguing that if no inner optimizer emerges, the base objective doesn't count as a "goal" in the dangerous sense. If a proponent read this, they might argue I'm conflating "goal" with "optimization pressure," though the satire holds that the distinction is legally convenient rather than ontologically robust.
