answer: |-
  ### Brainstorm: How Intuition Pumps Mislead

  Before using the tool, keep these four tricks in mind. Most broken arguments use at least one of them:

  1.  **Emotional Loading:** Using charged words ("innocent", "murder", "terrorist") to trigger a gut reaction rather than a logical one.
  2.  **Hidden Variables:** Slipping in a premise you didn't notice (e.g., assuming the protagonist knows something they couldn't possibly know).
  3.  **The False Dichotomy:** Pretending there are only two choices when there are actually three or more.
  4.  **The Ghost Knob:** A detail presented as background noise that actually controls the result. If you turn the knob (change the detail), the moral intuition shifts, proving the detail wasn't accidental.

  ---

  ### The Five-Minute Pump Check

  **Instructions:** Read the story and the claim being made. Work through these steps in order. If you hit a **HARD STOP**, the pump is broken. Do not use it to prove anything. If you hit a **HAND-OFF**, you must make a human judgement call; the tool cannot decide for you.

  #### Step 1: The Claim Check
  *   **Question:** What exact rule is this story trying to prove?
  *   **Sufficient Answer:** A single sentence summarising the moral rule (e.g., "Always save the most lives" or "Intentions matter more than results").
  *   **Hard Stop:** If the story supports multiple conflicting rules, or the rule changes halfway through, **STOP. Verdict: Broken.**
  *   **Hand-Off:** If the rule is clear, proceed.

  #### Step 2: The Emotional Load Scan
  *   **Question:** Are there words used solely to make you feel anger, pity, or disgust?
  *   **Sufficient Answer:** List any charged adjectives (e.g., "helpless child", "cold-blooded", "sacred").
  *   **Test:** Remove the charged words. Does the story still make sense?
  *   **Hard Stop:** If removing the words removes the urge to agree with the conclusion, **STOP. Verdict: Broken (Emotional Manipulation).**
  *   **Hand-Off:** If the logic holds without the emotion, proceed.

  #### Step 3: The Hidden Variable Hunt
  *   **Question:** Does the protagonist know something they couldn't realistically know?
  *   **Sufficient Answer:** Identify any "magic knowledge" (e.g., knowing for certain that pushing the man *will* stop the train).
  *   **Hard Stop:** If the argument relies on impossible certainty about the future, **STOP. Verdict: Broken (Impossible Premise).**
  *   **Hand-Off:** If the knowledge is plausible, proceed.

  #### Step 4: The Ghost Knob Test
  *   **Question:** Is there a specific detail treated as irrelevant that actually drives your answer?
  *   **Sufficient Answer:** Identify one concrete detail (e.g., the method of killing, the relationship between people, the location).
  *   **The Flip:** Change that detail to its opposite (e.g., change "pushing" to "pulling a lever", or "stranger" to "family member").
  *   **Hard Stop:** If changing the detail flips your moral verdict, but the arguer claims the detail doesn't matter, **STOP. Verdict: Broken (Ghost Knob).**
  *   **Hand-Off:** If the verdict stays the same despite the change, proceed.

  #### Step 5: The Generalisation Limit
  *   **Question:** Does the arguer claim this story proves a universal rule for *all* situations?
  *   **Sufficient Answer:** Acknowledge that a story is just one example.
  *   **Hard Stop:** If they claim this single story settles the debate forever, **STOP. Verdict: Broken (Overgeneralisation).**
  *   **Hand-Off:** **FINAL HAND-OFF.** The tool has checked the structure. You must now decide if the remaining argument is persuasive. This is a value judgement, not a fact check.

  ---

  ### Application to Three Cases

  #### Case 1: The Burnt Portrait
  *The Story:* A painter spends ten years on a masterpiece. On the final day, she decides it is awful and burns it.
  *The Claim:* This proves only the outcome matters, not the process. The ten years were wasted because the object is gone.

  **Running the Tool:**
  1.  **Claim Check:** Rule = "Value is determined solely by the final physical object." (Pass)
  2.  **Emotional Load:** Words like "wasted" and "awful" carry weight, but the logic holds without them. (Pass)
  3.  **Hidden Variables:** No magic knowledge involved. (Pass)
  4.  **Ghost Knob Test:**
      *   *Detail:* The burning of the object.
      *   *The Flip:* Suppose she doesn't burn it, but locks it in a vault forever where no one sees it. The outcome (no public art) is the same.
      *   *Result:* Most people feel the vault scenario is less "wasted" than the burning scenario. The act of destruction changes the intuition.
      *   *Verdict:* **STOP. Verdict: Broken (Ghost Knob).**
  *   **Analysis:** The arguer treats the "burning" as incidental to the "lack of outcome". But the burning adds a layer of intentional destruction that drives the feeling of waste. The pump hides the value of the artist's mental state during the ten years. You cannot use this story to prove process has no value.

  #### Case 2: The Footbridge Trolley
  *The Story:* A train will kill five people. You can push one large man off a bridge to stop it.
  *The Claim:* This proves that human rights override saving the most lives (deontology over utilitarianism).

  **Running the Tool:**
  1.  **Claim Check:** Rule = "Never directly kill an innocent, even to save more." (Pass)
  2.  **Emotional Load:** "Pushing one large man" is highly visceral compared to "pulling a lever". (Flag)
  3.  **Hidden Variables:** The story assumes you *know* the man will stop the train. In reality, this is uncertain. (Flag)
  4.  **Ghost Knob Test:**
      *   *Detail:* The method of killing (pushing with hands vs. dropping a trapdoor).
      *   *The Flip:* Change it to dropping the man via a remote trapdoor.
      *   *Result:* Many people find the trapdoor more acceptable than hands-on pushing, even though the death is identical.
      *   *Verdict:* **STOP. Verdict: Broken (Ghost Knob & Emotional Load).**
  *   **Analysis:** The pump relies on the "hands-on" detail to generate disgust. It treats the method as irrelevant to the moral rule, but your intuition changes when you turn the knob. This story proves we have a bias against physical contact, not necessarily a universal moral rule about rights.

  #### Case 3: The Transplant Surgeon (The Uncomfortable Result)
  *The Story:* A surgeon has five patients needing organs. A healthy traveller walks in. The surgeon could kill the traveller to save the five.
  *The Claim:* This proves we should never sacrifice one innocent life to save many, no matter the maths.
  *Why you might like the conclusion:* Most people feel strongly that killing the traveller is wrong. It feels right to protect individual rights.

  **Running the Tool:**
  1.  **Claim Check:** Rule = "Never kill an innocent to save others." (Pass)
  2.  **Emotional Load:** "Healthy traveller" vs "dying patients" is balanced. (Pass)
  3.  **Hidden Variables:**
      *   *Question:* Does the surgeon know the organs will definitely work?
      *   *Answer:* The story implies 100% certainty.
      *   *The Flip:* In the real world, transplant success is never 100%.
      *   *Verdict:* **STOP. Verdict: Broken (Hidden Variable - Impossible Certainty).**
  *   **Analysis:** This is the verdict you won't like. You probably agree the surgeon shouldn't kill the traveller. However, this specific story is a broken tool to prove *why*. It relies on a "Magic Knowledge" knob (certainty of survival) that doesn't exist in reality.
  *   **The Discomfort:** By rejecting this pump, you are admitting that this story doesn't actually prove rights are absolute. It only proves we shouldn't kill people based on impossible guarantees. You still believe the conclusion (don't kill the traveller), but you must find a better argument than this story. You cannot post this story as "proof" in your forum.

  ---

  ### Limitations and Judgement Zones

  This procedure is a sieve, not a scale. It catches broken arguments, but it does not weigh true ones.

  **What This Procedure Cannot Do:**
  1.  **It cannot find the truth.** It only checks if the story is rigged. A story can pass all checks and still be wrong.
  2.  **It cannot resolve value conflicts.** If two people pass the checklist but disagree on the final hand-off, the tool cannot help you. That is a genuine moral disagreement, not a logical error.
  3.  **It cannot measure intensity.** It treats all emotional loading as a fail. Sometimes emotion is relevant (e.g., stories about suffering). You must decide if the emotion is appropriate or manipulative.

  **Judgement-Call Zones (Hand-Offs):**
  *   **Step 2 (Emotion):** You must decide if the emotion is *earned* by the situation or *added* by the wording. The tool tells you to look; you must decide if it's unfair.
  *   **Step 5 (Generalisation):** You must decide if the story is being used as an example or as a proof. This depends on the arguer's tone, which the tool cannot analyse.
  *   **Final Verdict:** The tool gives you permission to say "This story is broken." It does not tell you what the right answer is. You must supply the morality yourself.

  **Final Note on the Ghost Knob:**
  When you spot a ghost knob, do not just say "it's there." You must demonstrate the flip. Write this in your verdict: *"The arguer claims detail X doesn't matter. I changed X to Y, and the moral intuition flipped. Therefore, detail X was doing the work, not the moral rule."* This is your strongest evidence that the pump is rigged.
