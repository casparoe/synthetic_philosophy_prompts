answer: |-
  ### Problem Set 4: The Ontology of Irretrievable Loss

  **Question 7 (20 marks)**

  Consider an agent, $A$, who has invested resources $R$ into a project $P$. $A$ now faces a binary choice: Abort $P$ or Continue $P$.
  You are to assume the following stipulations hold with metaphysical certainty:
  1.  **Negative Expectation:** The expected utility of Continuing is strictly lower than Aborting, considering all future consequences from this moment forward.
  2.  **Informational Nullity:** The expenditure of $R$ provides zero information about the state of the world, the quality of $P$, or $A$'s own competence.
  3.  **Observational Isolation:** No other agents (rivals, predators, allies) observe $A$'s choice; signaling is impossible.
  4.  **Temporal Isolation:** This is a unique event. $A$'s future selves will not update their policies based on this precedent, and $A$ suffers no akrasia (weakness of will) regarding the execution of the choice.

  Given these constraints, the standard instrumentalist prescription is to Abort. Honoring the sunk cost is typically labeled a "fallacy."

  (a) Classify the normative claim "One ought to ignore sunk costs." Is it an empirical generalization, a definition of rationality, or a theorem derived from specific axioms? Justify your classification.
  (b) Describe the specific structural features of an agent's utility function or decision procedure that would make Honoring the Sunk Cost *rationally permissible* despite stipulations 1–4. What does this imply about the relationship between "rationality" and "separability"?

  ***

  ### Model Answer

  The claim "One ought to ignore sunk costs" is not an empirical generalization about human psychology, nor is it a brute definition of rationality. It is a **conditional normative theorem** derived from the axioms of Expected Utility Theory (EUT), specifically relying on the **Separability Principle** and the **Independence of Irrelevant Alternatives**.

  Under standard Causal Decision Theory, utility is defined over terminal world-states (outcomes). The Separability Principle dictates that preferences over future prospects should not depend on past history except insofar as that history causally influences the future. Since stipulations 1–4 guarantee that the spent resource $R$ has no causal influence on future outcomes, no informational value, and no signaling capacity, $R$ is causally severed from the decision node. Therefore, within the framework of EUT, including $R$ in the calculation violates the transitivity of preference. If an agent prefers Outcome $X$ (Abort) to Outcome $Y$ (Continue) when evaluated from the present, they must not reverse this preference merely because a specific path was taken to reach the present node. To do so is to allow a "money pump" vulnerability. Thus, the injunction against sunk costs is a theorem contingent on the axiom that utility is a function of future consequences alone.

  However, this classification reveals the fragility of the "fallacy" label. If the injunction is a theorem derived from separability, it is silent regarding agents whose utility functions are not separable. This addresses part (b): Honoring the sunk cost becomes rationally permissible if the agent possesses **history-dependent preferences** (or narrative utility).

  If an agent's utility function is defined over *trajectories* rather than *terminal states*, the expenditure of $R$ is not a sunk cost but a constitutive part of the outcome being evaluated. For such an agent, the world-state "Abort after wasting $R$" may yield strictly lower utility than "Continue after investing $R$," not because Continuing produces better external consequences (stipulation 1 denies this), but because the agent assigns terminal disvalue to the property of "having wasted resources." In this ontology, "waste" is a bad made real by the history of the world, not just by its future. The agent is not maximizing future output; they are minimizing the narrative inconsistency of their life trajectory.

  For this to be permissible without violating instrumental rationality, the preference for "non-waste" must be a terminal value, not an instrumental heuristic. If the agent values "not being a waster" as an end in itself, then Continuing maximizes their expected utility, even if it reduces their material wealth. The "fallacy" only arises if the agent *claims* to value only material outcomes but acts as if they value narrative consistency. This is a failure of introspection, not necessarily a failure of coherence.

  Alternatively, permissibility might arise from the structure of the **decision procedure** rather than the utility function. If the agent is a bounded optimizer, the cognitive cost of verifying stipulations 1–4 might exceed the loss from Continuing. However, the prompt stipulates *certainty* regarding negative expectation, which theoretically eliminates calculation cost. Therefore, the only robust defense for Honoring the Sunk Cost is the rejection of outcome-separability.

  This implies that "rationality" is not a monolithic standard but is relative to the agent's ontology of value. The sunk cost principle is a coherence constraint for agents with separable preferences. For agents with narrative preferences, ignoring sunk costs would actually be irrational, as it would disregard a relevant variable (the past investment) that determines the utility of the present state. Consequently, the sunk cost fallacy is best understood as a category error: applying a normative rule derived from outcome-based axioms to an agent operating with history-based axioms. The "error" is not in the decision to Continue, but in the mismatch between the agent's stated axioms and their revealed preferences. To resolve it, one must either align preferences with separable axioms (learn to stop caring about waste) or acknowledge that the utility function includes history (accept that "waste" is a terminal bad).

  ***

  ### Marking Scheme (20 Marks)

  **1. Identification of Axiomatic Basis (4 marks)**
  *   **Required:** Student identifies the principle as a *theorem* of Expected Utility Theory/CDT dependent on *Separability* or *Independence*, not an empirical law.
  *   **Common Error:** Treating the principle as a universal law of nature or a definition of intelligence rather than a derived normative constraint.

  **2. Adherence to Stipulations (4 marks)**
  *   **Required:** Student explicitly confirms that signaling, information updating, and akrasia defenses are blocked by the prompt's constraints (1–4).
  *   **Common Error:** Silently reintroducing an information channel (e.g., "continuing teaches you something") or signaling benefit despite the isolation stipulations.

  **3. Classification of the Claim (4 marks)**
  *   **Required:** Student classifies the claim as *conditional/normative* (valid only if preferences are separable) rather than *descriptive/empirical*.
  *   **Common Error:** Treating "irrational" as a synonym for "I wouldn't do it" or claiming humans are irrational for having sunk cost biases without analyzing the preference structure.

  **4. Condition for Permissibility (4 marks)**
  *   **Required:** Student specifies that permissibility requires **history-dependent/narrative preferences** (utility over trajectories) where "waste" is a terminal disvalue.
  *   **Common Error:** Arguing permissibility relies on "emotional satisfaction" without formalizing it as a utility component, or reverting to bounded rationality/calculation cost arguments despite the certainty stipulation.

  **5. Implication for Rationality (4 marks)**
  *   **Required:** Student concludes that rationality is coherence between axioms and action; if axioms include history, ignoring sunk costs is the error.
  *   **Common Error:** Asserting that narrative preferences are inherently "irrational" or "biased" rather than simply a different ontological framework for value.
