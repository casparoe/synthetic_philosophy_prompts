mbination—using acknowledged vagueness to mandate a cutoff, then defending the cutoff's location by selectively invoking either slope-sensitivity or institutional inertia? If it overlaps with existing ideas—say, epistemicist precisification, practical conventionalism, or a boundary-defending rhetorical strategy—explain exactly how it differs and which concept comes closest. If there is no precise label, propose one with a clear definition and specify its boundary conditions: when does it collapse into ordinary conventionalism, and when does it become something else, like pure interest-driven rhetoric?
