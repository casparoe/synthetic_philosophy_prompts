answer: |-
  This is a sophisticated observation that cuts to the heart of how normative systems manage semantic indeterminacy. You have identified a specific rhetorical and logical maneuver that is pervasive in law, bioethics, and public policy, yet it lacks a unified label in the philosophical literature on vagueness.

  Below is a mapping of the relevant literature, an analysis of why existing terms fall short, and a proposal for a precise conceptual label.

  ### 1. Literature Mapping and Conceptual Neighbors

  To ensure we do not conflate your pattern with nearby concepts, we must first situate it within the standard taxonomy of vagueness and normative theory.

  *   **The Sorites Paradox (Classic):** Establishes the problem. A predicate $F$ applies to $x_1$, and for any $x_i$, if $F(x_i)$ then $F(x_{i+1})$, yet $F$ does not apply to $x_n$.
  *   **Epistemicism (e.g., Timothy Williamson):** Claims there *is* a sharp boundary (e.g., exactly 18 years, 0 days, 0 seconds), but we cannot know it.
      *   *Difference:* Your pattern explicitly *denies* a metaphysical joint. It admits the boundary is legislated, not discovered.
  *   **Supervaluationism (e.g., Kit Fine, Rosanna Keefe):** Claims a statement is true if it is true on all *admissible precisifications*.
      *   *Difference:* This is a semantic account of truth conditions. Your pattern is a *pragmatic* account of institutional design. It doesn't care about truth across models; it cares about social stability.
  *   **Contextualism (e.g., Diana Raffman):** Claims the extension of vague terms shifts with context.
      *   *Difference:* Your pattern seeks to *freeze* the context institutionally to prevent shifting.
  *   **Legal Conventionalism / Stipulation:** The view that legal boundaries are arbitrary agreements.
      *   *Difference:* Simple conventionalism admits arbitrariness ("We chose 18, but 19 would have worked just as well"). Your pattern *resists* this admission once the line is drawn, invoking non-arbitrary costs (slope, disruption) to lock it in.
  *   **Vagueness in Law (e.g., Timothy Endicott, H.L.A. Hart):** Hart's "open texture" acknowledges vagueness; Endicott argues law often requires "precision" for coordination.
      *   *Difference:* These describe the *need* for a line. They do not explicitly codify the *asymmetric defense* of the line's specific location.
  *   **Slippery Slope Arguments (e.g., Frederick Schauer):** Often categorized as causal (moving to 17 causes a slide to 10) or logical (no principled distinction between 17 and 18).
      *   *Difference:* Your pattern uses the slope argument only in *one direction* (against expansion), while using a different argument (reliance/stability) in the other.

  ### 2. Analysis of the Pattern

  Your observation identifies a two-stage process with a specific logical tension:

  1.  **Meta-Semantic Concession:** The interlocutor admits the predicate is vague (no natural joint). This justifies the *act* of drawing a line (to avoid chaos/indeterminacy).
  2.  **Normative Locking:** Once drawn, the line is defended not as a mere convention, but as a fulcrum of stability.
      *   **Vector A (Expansion/Downward):** Defended via **Slippery Slope** (The continuum is dangerous; moving erodes the distinction).
      *   **Vector B (Restriction/Upward):** Defended via **Reliance Interests** (The continuum is irrelevant; moving disrupts settled expectations).

  **The Logical Tension:** The argument treats the continuum as *real* enough to fear the slope (Vector A), but *irrelevant* enough to ignore the continuity when claiming stability (Vector B). It treats the boundary as *artificial* in origin (we made it), but *natural* in resilience (we cannot move it).

  ### 3. Is There an Established Term?

  There is no single canonical term in the philosophy of language or law that captures this specific **asymmetric defensive structure**.

  *   **"Bright Line Rules"** describes the *outcome* (a sharp cutoff), but not the *argumentative strategy* used to defend its location.
  *   **"Pragmatic Precisation"** (common in legal theory) describes the act of making a vague term precise for utility. However, it typically implies that the specific point is interchangeable. It does not capture the *resistance* to moving the point once selected.
  *   **"The Floodgates Argument"** covers the downward defense (Vector A), and **"Reliance Interests"** covers the upward defense (Vector B), but there is no term for the *combination* of these two as a unified strategy for managing vagueness.

  In bioethics (e.g., debates on the President's Council on Bioethics regarding brain death or embryonic status), this is often implicitly referred to as **"The Bright Line Defense,"** but this is a description of the goal, not the logical maneuver.

  ### 4. Proposed Terminology: "Normative Hysteresis"

  Since the phenomenon lacks a precise label, I propose the term **Normative Hysteresis** (situated within a framework of **Institutional Precisation**).

  **Definition:**
  **Normative Hysteresis** is an argumentative strategy used to manage vague predicates in high-stakes institutional contexts. It occurs when an agent:
  1.  Justifies the *existence* of a sharp boundary by citing the indeterminacy of the underlying continuum (Institutional Precisation).
  2.  Defends the *location* of that boundary asymmetrically:
      *   Against **expansion** (making the predicate apply more easily), by invoking the reality of the continuum (Slippery Slope: "If we move here, the distinction collapses").
      *   Against **restriction** (making the predicate apply less easily), by invoking the irrelevance of the continuum (Stability: "If we move here, settled expectations are disrupted").

  **Why "Hysteresis"?**
  In physics and engineering, *hysteresis* is the dependence of the state of a system on its history, where the system resists change differently depending on the direction of the force applied (e.g., magnetization). Your pattern describes exactly this: the "magnetic field" of the law/ethics resists movement downward (slope fear) differently than it resists movement upward (stability fear), creating a "sticky" boundary that is harder to move than a simple convention would be.

  ### 5. Boundary Conditions and Distinctions

  To ensure this concept is robust, we must distinguish it from neighboring phenomena.

  **A. When it collapses into Ordinary Conventionalism:**
  If the interlocutor admits, "We chose 18, but if society wanted 19 next year, that would be equally valid and cause no logical harm," Normative Hysteresis is absent. Ordinary conventionalism lacks the *asymmetric resistance*. It views the line as a coordinate on a map that can be redrawn without changing the terrain. Normative Hysteresis claims redrawing the coordinate *changes the terrain*.

  **B. When it collapses into Epistemicism:**
  If the interlocutor claims, "We chose 18 because 18 is *actually* when personhood begins, we just couldn't see it before," this is Epistemicism. Normative Hysteresis requires the admission that the line is *legislated*, not discovered. The "twist" you noticed relies on the tension between *admitting* artificiality (to justify the line) and *denying* arbitrariness (to defend the spot).

  **C. When it becomes Pure Interest-Driven Rhetoric:**
  If the "stability" or "slope" arguments are demonstrably false or pretextual (e.g., claiming 19 would cause chaos when it clearly wouldn't, solely to benefit a specific group), the argument degrades into **Ideological Entrenchment**. Normative Hysteresis is a *structural* feature of the argument form; it becomes mere rhetoric when the functional claims (slope/stability) are decoupled from empirical reality.

  ### 6. Philosophical Significance

  Identifying **Normative Hysteresis** is valuable because it exposes a specific vulnerability in policy reasoning.

  1.  **The "Best of Both Worlds" Fallacy:** It allows institutions to claim the humility of anti-realism ("We know nature is vague") while wielding the authority of realism ("But you cannot move this line").
  2.  **Conservative Bias:** The asymmetry inherently favors the status quo. By invoking the slope against expansion and stability against restriction, the strategy creates a "dead zone" around the boundary where *no* change is permissible, effectively reifying a contingent choice into a permanent fixture.
  3.  **Sorites Immunity:** It immunizes the boundary from Sorites challenges. If you argue "18 is arbitrary, why not 17?", they say "Slope." If you argue "18 is continuous with 19," they say "Disruption." The continuum is used as a shield and a sword, but never as a map.

  ### Summary
  You have identified a distinct argumentative structure. It is not merely **Conventionalism** (because it resists change) nor **Epistemicism** (because it admits artificiality). It is a hybrid strategy best labeled **Normative Hysteresis**. It is the practice of using the *existence* of vagueness to mandate a cutoff, then using the *consequences* of that cutoff to forbid its revision, employing directional asymmetry to lock the boundary in place.
