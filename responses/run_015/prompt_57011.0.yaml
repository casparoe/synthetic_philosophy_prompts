answer: |-
  You actually constructed a very standard, philosophically respectable argument (it closely mirrors the work of bioethicists like Norman Daniels and Erik Parens). Your teacher is right that (7) is false, but wrong that this vindicates the "clean line" between therapy and enhancement.

  Here is the breakdown of where your argument breaks, why it looked harmless, and what happens to your teacher's position if you fix it.

  ### 1. Which step do you give up?
  **You drop (7).**

  Steps (1) through (5) are the strongest part of your argument. They correctly identify that "normal functioning" is a normative, statistical, or social construct, not a brute biological fact. Step (6) is also largely defensible: if the line is arbitrary, merely *crossing* it cannot be the source of moral wrongness.

  The break is the inference from **(6) to (7)**.

  *   **(6) says:** The specific objection *"It is wrong because it is enhancement (not therapy)"* fails.
  *   **(7) says:** Therefore, *"There is no principled way to object to enhancement."*

  This is a logical non-sequitur. It conflates **"This specific principle doesn't work"** with **"No principle works."**

  Your teacher's counter-example (rich parents buying memory) proves exactly this. The objection there isn't "That child is enhanced!" The objection is "That creates unfair inequality!" or "That commodifies human traits!" Those are *principled objections*, but they rely on **justice** and **autonomy**, not on the **ontology** of therapy vs. enhancement.

  ### 2. Why did it look harmless when you wrote it?
  It looked harmless because of a subtle scope shift in the word "principled."

  *   In **(6)**, you are talking about a principle *internal* to the therapy/enhancement distinction (i.e., "Healing is good, upgrading is bad").
  *   In **(7)**, you expand "principled" to mean *any* moral principle whatsoever.

  It feels like a natural flow because if you remove the main reason people *think* enhancement is wrong (that it's "unnatural" or "playing God" or "not medicine"), it feels like you've removed the wrongness itself. But you've only removed the *justification*, not the *consequences*.

  Think of it like speeding. If I argue "The speed limit is arbitrary (drawn by humans, not physics)," it does not follow that "There is no principled way to object to driving 100mph in a school zone." The objection shifts from "You broke the magic number" to "You endangered children."

  ### 3. What do you actually lose by dropping (7)?
  By dropping (7), you lose **moral nihilism regarding enhancement.**

  If you keep (7), you are claiming that genetic memory upgrades, steroid use, and cognitive implants are morally indistinguishable from doing nothing. That is indeed hard to defend.

  By dropping (7), you admit that enhancements *can* be wrong, but **not because they are enhancements.** They are wrong for *other reasons* (fairness, safety, coercion, authenticity). This actually strengthens your position because it forces the debate onto firmer ground. Instead of arguing about whether a drug is "therapy" (which is fuzzy), you argue about whether it is "fair" (which is a robust ethical category).

  ### 4. Does your teacher get his bright line back?
  **No.** This is the crucial part.

  Your teacher wants two things:
  1.  **A Metaphysical Claim:** There is a real, factual difference between therapy and enhancement.
  2.  **A Moral Claim:** Enhancement is morally suspect.

  Your argument successfully undermines **(1)**. By keeping (3) and (5), you maintain that the line is socially drawn, not discovered in nature. Growth hormone *is* therapy for a pituitary-deficient child and enhancement for a healthy short child; the drug is the same, the biology is similar, the *context* decides the label.

  Your teacher's rebuttal saves **(2)** (the Moral Claim) but only by abandoning **(1)** (the Metaphysical Claim).

  If you revise your conclusion to:
  > **(7*) Therefore, objections to enhancement must rely on principles other than the therapy/enhancement distinction (e.g., justice, safety, autonomy).**

  ...then you win the philosophical point. The teacher keeps his intuition that "rich kids buying memory is bad," but he loses his justification that "enhancement is bad because it isn't therapy." He has to admit that if the memory pill were distributed equally and safely, his objection might vanish, whereas a "natural law" objection would remain.

  ### 5. Philosophical Ammo (for your elective)
  You are walking right into a classic debate in bioethics. If you want to cite sources that back up your (1)-(5) while rejecting (7):

  *   **Norman Daniels:** In *Just Health Care*, he argues exactly for (1)-(5). He says "normal functioning" is relative to a reference class. However, he *rejects* (7). He argues we should object to enhancement on grounds of **fair equality of opportunity**, not because it violates nature.
  *   **Erik Parens:** In *Enhancing Human Traits*, he argues the line is porous, but we should still have a "reflective equilibrium" about what kinds of enhancements fit our values.
  *   **Julian Savulescu:** He would argue that if an enhancement is safe and fair, we might actually have a *duty* to enhance (Procreative Beneficence). This shows why (7) is dangerous—if you can't object, you might be forced to enhance.

  ### The Revised Argument
  Here is how you present it to your teacher to show you concede the point without surrendering the thesis:

  1.  (Keep 1-5): The therapy/enhancement line is socially constructed, not a natural joint.
  2.  (Keep 6): Therefore, the mere label of "enhancement" carries no inherent moral weight.
  3.  **(Revise 7):** Therefore, valid objections to enhancement must rely on **consequentialist or deontological principles** (like justice, coercion, or risk), not on the **categorical distinction** between healing and upgrading.
  4.  **(New 8):** Your example of rich parents buying memory is a valid objection, but it is an objection based on **inequity**, not on **ontology**. If the memory pill were free and safe, that specific objection disappears, proving the wrongness was in the distribution, not the enhancement.

  **Summary:** You don't have to blow up your side. You just have to stop short of nihilism. Admit that enhancements can be wrong, but insist they aren't wrong *because* they cross a magical biological line. They are wrong for the same reasons other things are wrong: they hurt people, create unfairness, or undermine autonomy.
