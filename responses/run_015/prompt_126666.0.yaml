  **UNSEEN WRITTEN PAPER: RATIONAL CHOICE AND GAME THEORY**
  **Time Allowed: 45 Minutes**
  **Total Marks: 25**

  **Question 1**

  Consider the following two-player strategic game. Rowena chooses a row (A, B, or C); Colin chooses a column (L, M, or R). Payoffs are listed as (Rowena, Colin).

  | | **L** | **M** | **R** |
  | :--- | :---: | :---: | :---: |
  | **A** | 4, 6 | 0, 4 | 3, 2 |
  | **B** | 0, 2 | 4, 1 | 1, 3 |
  | **C** | 1.5, 1 | 1.5, 5 | 1.8, 5 |

  Assume players are rational expected-utility maximisers and this is common knowledge.

  (i) Verify that no pure strategy is strictly or weakly dominated for either player at the outset. **[4 marks]**

  (ii) Show that Rowena's strategy C is strictly dominated by a mixed strategy over A and B. Determine the exact interval of mixing weights $p$ (probability on A) that effect this domination. **[6 marks]**

  (iii) Perform the Iterated Deletion of Strictly Dominated Strategies (IDSDS) to completion. State the surviving profile and explain briefly whether the order of deletion affects the result. **[5 marks]**

  (iv) A critic objects: "Rowena is a single agent who will perform one action. She cannot improve her position by tossing a coin. Therefore, deleting C because a *mixture* beats it is illegitimate." Answer this objection. **[5 marks]**

  (v) Suppose we know only Rowena's ordinal ranking of the nine outcomes, alongside Colin's cardinal payoffs. Is the deletion in (ii) still licensed? If not, provide an ordinally equivalent payoff table for Rowena in which C is not dominated, and state whether the uniqueness of the Nash equilibrium is preserved. **[5 marks]**

  ***

  **MODEL ANSWER**

  (i) For Rowena, pairwise comparisons show no dominance: A yields higher payoffs than B against L and R, but lower against M. Similarly, A beats C against L and R, but loses against M; B beats C against M, but loses against L and R. For Colin, L beats M against A and B, but loses against C; L beats R against A, but loses against B and C; M beats R against A, but loses against B and ties against C. Thus, no strategy is weakly or strictly dominated by a pure strategy.

  (ii) Let Rowena play A with probability $p$ and B with $1-p$. The expected payoff vector is $(4p, 4(1-p), 3p + 1(1-p))$. For strict dominance over C $(1.5, 1.5, 1.8)$, we require:
  1. $4p > 1.5 \Rightarrow p > 0.375$
  2. $4 - 4p > 1.5 \Rightarrow 4p < 2.5 \Rightarrow p < 0.625$
  3. $2p + 1 > 1.8 \Rightarrow 2p > 0.8 \Rightarrow p > 0.4$
  The intersection is $p \in (0.4, 0.625)$. Since this interval is non-empty, C is strictly dominated.

  (iii) Delete C. In the remaining 2x3 game, Colin's L $(6, 2)$ strictly dominates M $(4, 1)$. Delete M. In the 2x2 game (A,B vs L,R), Rowena's A $(4, 3)$ strictly dominates B $(0, 1)$. Delete B. Finally, Colin's L $(6)$ dominates R $(2)$. The unique surviving profile is **(A, L)**. Because only *strict* dominance is used, the order of deletion does not affect the final set of surviving strategies.

  (iv) The objection confuses the *interpretation* of the mixed strategy with its *analytical use*. We do not assume Rowena commits to randomising. Rather, if a pure strategy is dominated by a mixture, it cannot be a best response to *any* probabilistic belief Rowena might hold about Colin. Rationality requires playing a best response to one's beliefs. Thus, C is eliminable purely on grounds of rationality and common knowledge thereof, without assuming Rowena actually tosses a coin.

  (v) No. Domination by a mixed strategy relies on the Expected Utility Theorem, which requires cardinal utility (linearity). Ordinal transformations preserve preference orderings but not expectations.
  Consider this ordinally equivalent table for Rowena (Colin's payoffs unchanged):
  A: (10, 0, 9); B: (0, 10, 1); C: (8, 8, 8).
  (Ranking preserved: $10>9>8>1>0$).
  A 50/50 mix of A and B yields expected payoffs $(5, 5, 5)$, which does not dominate C $(8, 8, 8)$. Indeed, C now dominates the mix.
  In this transformed game, **(A, L)** remains a Nash equilibrium. However, uniqueness is lost: **(C, 0.5M + 0.5R)** is also a Nash equilibrium. Against C, Colin gets 5 from M and R (indifferent); against $0.5M+0.5R$, Rowena gets 8 from C, 5.5 from B, and 4.5 from A. Thus, C is a best response, and the equilibrium is not unique.

