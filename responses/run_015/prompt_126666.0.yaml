  *   **First-Class Move:** Explicitly notes that L vs M for Colin fails strict dominance due to column C, and weak dominance fails due to the strict loss against C.
  *   **Common Mistake:** Claiming L weakly dominates M for Colin (ignoring the payoff against C) or failing to check all pairwise combinations.

  **(ii) Mixed Dominance Calculation [6 Marks]**
