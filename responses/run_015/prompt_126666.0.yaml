  *   **2 marks:** Derives correct lower bound ($p > 0.4$).
  *   **2 marks:** Derives correct upper bound ($p < 0.625$) and states the open interval.
  *   **First-Class Move:** Explicitly notes that the intersection is non-degenerate, confirming strict dominance is possible.
  *   **Common Mistake:** Arithmetic errors in solving linear inequalities or claiming a single value of $p$ suffices rather than an interval.

  **(iii) IDSDS Procedure [5 Marks]**
  *   **2 marks:** Correct sequence of deletions (C $\to$ M $\to$ B $\to$ R).
  *   **2 marks:** Identifies unique profile (A, L).
  *   **1 mark:** Correctly states order independence for strict dominance.
  *   **First-Class Move:** Distinguishes why order independence holds here (strict dominance) whereas it might not for weak dominance.
  *   **Common Mistake:** Deleting M before C (impossible initially) or claiming order matters.

  **(iv) Epistemic Objection [5 Marks]**
  *   **3 marks:** Rejects the claim that the player must randomise.
  *   **2 marks:** Explains that mixed dominance implies the strategy is not a best reply to *any belief*.
  *   **First-Class Move:** Explicitly frames the mixed strategy as a proxy for the set of all possible probabilistic beliefs about the opponent, grounding deletion in rationality alone rather than equilibrium assumptions.
  *   **Common Mistake:** Arguing that the player *should* randomise, or that the deletion requires the player to actually play the mixture.

  **(v) Ordinality and Equilibrium [5 Marks]**
  *   **2 marks:** States deletion is not licensed (utility must be cardinal).
  *   **2 marks:** Provides a valid ordinally equivalent matrix where dominance fails.
  *   **1 mark:** Addresses equilibrium uniqueness.
  *   **First-Class Move:** Exhibits a **second Nash equilibrium** in the transformed game (e.g., C vs Mix(M,R)), demonstrating that the uniqueness result of the original game was an artefact of the cardinal specification, not just the ordinal ranking.
  *   **Common Mistake:** Providing a transformation where dominance fails but failing to check the equilibrium consequences, or claiming uniqueness is preserved without justification.
