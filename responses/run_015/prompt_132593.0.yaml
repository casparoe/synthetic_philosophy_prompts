answer: |-
  # Conceptual Specification: The Act/Omission Distinction

  The following is a specification of desiderata for any theory attempting to distinguish between killing (acts) and letting die (omissions). This map isolates the functional requirements of the theory, the boundary cases it must resolve, and the structural tensions inherent in the problem space.

  ## I. Core Desiderata

  An adequate theory must satisfy the following five conditions to be considered conceptually robust.

  ### 1. The Asymmetry Constraint (Phenomenological Fit)
  **Requirement:** The theory must explain why, ceteris paribus, active killing is typically judged as morally worse or more restrictive than passive letting die, without denying that the outcome (death) and the counterfactual dependence (the victim dies if the agent does not intervene/acts) are identical in both cases.
  **Motivation:** If a theory collapses the distinction entirely (claiming moral equivalence), it conflicts with deep-seated legal and moral intuitions (e.g., the difference between murder and failure to rescue). If it asserts a distinction without explaining the source of the asymmetry, it is dogmatic.
  **Canonical Test:** The Drowning Stranger.
  *   *Case A:* Pushing a stranger into a pond (Killing).
  *   *Case B:* Watching a stranger drown when you could easily save them (Letting Die).
  *   *Demand:* The theory must identify a variable present in A but not B that carries moral weight, other than the mere label of "act" or "omission."

  ### 2. The Causal Baseline Problem (Ontological Clarity)
  **Requirement:** The theory must define the "baseline" against which an intervention is measured. It must specify whether an omission is defined by the absence of physical force, the absence of a deviation from a statistical norm, or the absence of a deviation from a normative expectation.
  **Motivation:** In physics, all events are causal chains. "Doing nothing" is physically indistinguishable from "allowing physics to proceed." A theory cannot rely on a metaphysical distinction between "positive" and "negative" forces unless it defines what constitutes the zero-point of agency.
  **Canonical Test:** The Switch-Track (Trolley) Variant.
  *   *Case A:* Flipping a switch to divert a trolley onto a track where it kills one.
  *   *Case B:* Refusing to flip a switch to divert a trolley away from a track where it kills five.
  *   *Demand:* The theory must explain why flipping the switch is often viewed as an intervention (making you the cause) while not flipping is viewed as non-intervention (letting the trolley be the cause), despite both involving a decision node controlled by the agent.

  ### 3. The Negative Causation Boundary (Preventing Rescue)
  **Requirement:** The theory must classify cases where an agent prevents a third party or a natural process from saving a life. It must determine whether removing a "blocker" to harm counts as an act of killing or an omission of saving, and justify this classification without circularity.
  **Motivation:** This is the stress test for causal accounts. If I unplug a life-support machine, did I kill the patient or stop myself from keeping them alive? If I prevent a doctor from administering an antidote, is that murder?
  **Extended Test:** The Blocked Rescue.
  *   *Case:* An agent locks a door, preventing a rescuer from entering a burning building. The victim dies.
  *   *Demand:* The theory must explain why this is often classified as killing (an act) despite the immediate cause of death being the fire (a natural force), and distinguish it from merely failing to unlock the door oneself. The distinction cannot rest solely on the presence of muscular movement.

  ### 4. The Distributed Agency Condition (Structural Complexity)
  **Requirement:** The theory must account for harms resulting from structured inaction where no single individual performs an identifiable "act," yet the harmful outcome is the result of maintained default pathways within a collective or automated system.
  **Motivation:** Modern harm is often systemic. If a theory requires a singular, identifiable agent performing a discrete omission, it fails to capture institutional negligence or algorithmic bias where harm is the product of distributed non-intervention.
  **Extended Test:** The Automated Default.
  *   *Case:* An algorithmic triage system is programmed to prioritize efficiency over survival in edge cases. No human presses a "kill" button; the system simply fails to allocate resources to a specific group by default.
  *   *Demand:* The theory must determine if this is a collective "letting die" or a distributed "killing." It must specify whether the "act" resides in the initial coding, the maintenance of the default, or the failure to override.

  ### 5. Normative Non-Circularity (Independence of Duty)
  **Requirement:** The theory cannot define an omission merely as "a failure to do what one is morally obliged to do." It must provide a pre-normative or structural criterion for what constitutes an omission, which *then* informs the duty.
  **Motivation:** Defining an omission as "a violation of a positive duty" makes the distinction tautological (i.e., "It is wrong to let die because you had a duty to save, and you had a duty to save because it is wrong to let die"). The distinction between act and omission must be identifiable prior to the assignment of moral blame.
  **Demand:** The theory must distinguish between *can* (capacity), *did* (causal history), and *ought* (normative expectation) without conflating them.

  ---

  ## II. Structural Tensions and Trade-Offs

  No theory satisfies all desiderata perfectly. The following pairs represent jointly unsatisfiable or highly tensioned requirements. A theory must explicitly choose which horn of the dilemma to accept.

  ### 1. Causal Symmetry vs. Moral Asymmetry
  *   **The Conflict:** If a theory adheres strictly to physical causal symmetry (Desideratum 2), it must admit that the agent is causally responsible in both the "push" and the "watch" scenarios (since the death counterfactually depends on the agent's choice in both). However, maintaining Moral Asymmetry (Desideratum 1) requires treating these causal inputs differently.
  *   **The Trade-off:** A theory can preserve Causal Symmetry only by admitting the moral distinction is illusory (consequentialism). A theory can preserve Moral Asymmetry only by introducing a non-causal variable (e.g., rights, intentions, or normative baselines).
  *   **Implication:** You cannot have a purely physicalist account of causation *and* a robust moral distinction between killing and letting die. One must give way.

  ### 2. Individual Agency vs. Distributed Harm
  *   **The Conflict:** Traditional act/omission distinctions rely on a discrete locus of agency (Desideratum 1 & 2). However, accommodating Distributed Agency (Desideratum 4) requires dissolving the boundary of the individual agent.
  *   **The Trade-off:** If the theory tightens the definition of "act" to require individual muscular intervention, it exonerates collective/automated systems (classifying systemic starvation as mere "letting die" or misfortune). If the theory loosens the definition to include systemic maintenance as "killing," it risks over-expanding the category of killing to include almost all failures to reform unjust systems.
  *   **Implication:** A theory robust enough to handle institutional omissions may lose the precision required to protect individual liberty from over-criminalization.

  ### 3. Negative Causation vs. The Baseline
  *   **The Conflict:** Classifying "preventing rescue" (Desideratum 3) as an omission preserves the intuition that we are not responsible for all possible saves. Classifying it as an act acknowledges that interfering with a rescue path is aggressive.
  *   **The Trade-off:** If preventing rescue is an omission, the prohibition on killing is weakened (one can block a save without "killing"). If preventing rescue is an act, the distinction between killing and letting die collapses in many real-world scenarios (e.g., withholding food vs. removing a feeding tube).
  *   **Implication:** The definition of the "baseline" (what counts as normal course of events) determines the classification. Changing the baseline shifts cases from "act" to "omission" without changing the physical facts.

  ---

  ## III. Non-Negotiables vs. Camp-Specific Preferences

  To evaluate a theory, one must distinguish between structural necessities and ideological commitments.

  ### Non-Negotiable Requirements (Structural Integrity)
  Any theory claiming to address the distinction must satisfy these, or it is logically incoherent:
  1.  **Counterfactual Clarity:** The theory must explicitly state whether the agent's presence changed the probability of the outcome. A theory that ignores counterfactual dependence fails to link the agent to the harm.
  2.  **Non-Circularity:** The definition of "omission" cannot rely on the conclusion of "wrongness." The classification must precede the moral judgment.
  3.  **Baseline Specification:** The theory must explicitly state what constitutes the "expected course of events." Without a baseline, "intervention" is undefined.
  4.  **Consistency Across Negation:** The theory must treat "removing a barrier to harm" and "installing a barrier to safety" consistently. It cannot treat them differently based solely on the temporal order of events unless time is an explicit moral variable.

  ### Camp-Specific Preferences (Ideological Variables)
  These are not failures of logic but divergent starting points. A theory may fail these relative to a specific framework without being conceptually broken.
  1.  **Determinism about Causation:**
      *   *Causalists* require the distinction to track physical energy transfer or force.
      *   *Normativists* accept that physical causation is identical and locate the distinction in social/legal expectations.
      *   *Verdict:* A theory is not invalid for rejecting physical causation as the moral marker, provided it offers a coherent alternative marker.
  2.  **The Existence of Positive Duties:**
      *   *Libertarian/Rights-Based* views often treat all omissions as non-violations (unless a specific contract exists).
      *   *Humanitarian/Institutional* views treat failure to rescue as a rights violation.
      *   *Verdict:* A theory can classify letting die as permissible or impermissible; the requirement is that it justifies *why* based on its internal logic, not that it aligns with a specific political tradition.
  3.  **The Moral Weight of the Distinction:**
      *   Some theories argue the distinction is fundamental (Deontology).
      *   Some argue it is heuristic for rule-utilitarian purposes.
      *   Some argue it is morally irrelevant (Strict Consequentialism).
      *   *Verdict:* A theory is valid if it argues the distinction is irrelevant, *provided* it explains away the intuition described in Desideratum 1 (Asymmetry Constraint) rather than ignoring it.

  ---

  ## IV. Framework Performance Sketch

  This section briefly indicates how standard frameworks map against the desiderata, highlighting where they typically succeed or fail relative to the specification above.

  ### 1. Pure Causal Account
  *   **Mechanism:** Distinguishes acts and omissions based on the introduction of new energy/force into a system versus the withdrawal of sustaining force.
  *   **Performance:**
      *   *Strengths:* High clarity on Canonical Pairs (Drowning/Track). Satisfies Baseline Specification physically.
      *   *Failures:* Collapses on Negative Causation (preventing a save often involves physical force, yet feels like an omission of rescue). Fails Distributed Agency (algorithms have no "force"). Struggles with Non-Circularity if it claims physical difference *is* moral difference without further argument.
      *   *Trade-off:* Sacrifices Moral Asymmetry for Causal Symmetry.

  ### 2. Deontological Rights-Based View
  *   **Mechanism:** Distinguishes based on negative rights (right not to be interfered with) vs. positive rights (right to be assisted). Killing violates negative rights; letting die violates positive rights (if they exist).
  *   **Performance:**
      *   *Strengths:* Preserves Moral Asymmetry robustly. Handles Negative Causation well (interfering with rescue violates negative rights).
      *   *Failures:* Risks Circularity (Defining omissions by the absence of positive duties). Struggles with Distributed Agency (who holds the duty in a collective?).
      *   *Trade-off:* Sacrifices Causal Symmetry (admits physical sameness but moral difference) to preserve Individual Agency boundaries.

  ### 3. Institutional / Role-Based Framework
  *   **Mechanism:** Distinguishes based on assigned functions. An omission is a failure to fulfill a specific role requirement; an act is a violation of a general prohibition.
  *   **Performance:**
      *   *Strengths:* Excellent on Distributed Agency (defines duty by system role). Solves Non-Circularity (duty is defined by contract/statute, not morality).
      *   *Failures:* Context dependent (a doctor letting die is different from a stranger letting die). Struggles with Canonical Pairs where roles are undefined (the Drowning Stranger).
      *   *Trade-off:* Sacrifices Universalizability for Structural Complexity handling.

  ## V. Summary Specification

  To be adequate, a theory of the killing/letting die distinction must:
  1.  **Define the Baseline:** Explicitly state what counts as the "normal course of events" independent of moral obligation.
  2.  **Locate the Asymmetry:** Identify the specific variable (causal, normative, or intentional) that generates the moral difference.
  3.  **Resolve Negative Causation:** Provide a consistent rule for interventions that prevent salvation.
  4.  **Accommodate Structure:** Explain how the distinction applies when agency is distributed or automated.
  5.  **Avoid Tautology:** Ensure the definition of omission does not presuppose the moral verdict.

  Any theory that cannot simultaneously specify the baseline and the asymmetry without collapsing into "might makes right" (causalism) or "duty is duty" (normativism) fails the specification. The primary failure mode to watch for is the **Baseline Drift**, where the definition of "normal course of events" is surreptitiously adjusted to match the desired moral outcome.
