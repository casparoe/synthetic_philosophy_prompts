prompt: |-
  I am trying to clarify the conceptual architecture behind the moral distinction between killing and letting die, and I find that every discussion quickly collapses into either a causal debate or a rights-based slogan without specifying what a theory actually needs to deliver. Before I commit to any particular framework—whether causal, normative, or institutional—I want the full specification of what an adequate account must be able to do. Write the desiderata: the cases any theory of the act/omission distinction must get right, the distinctions it must preserve without collapse, and the results or constraints it must be consistent with, with the motivating consideration behind each requirement.

  Specifically, the list should cover the canonical pairs—direct physical intervention versus passive non-intervention in the drowning-stranger and switch-track scenarios—but also extend to less discussed configurations: omissions that are structurally distributed across collective or automated decision systems, where no individual agent performs an identifiable action yet a harmful default pathway is maintained; and cases of negative causation, where an agent prevents an intervention that would have saved a life, so the harm arrives through the removal of a blocker rather than through direct application of force. The theory must explain why these can still be classified as omissions rather than disguised actions, without appealing to a primitive metaphysical distinction between positive and negative duties that simply restates the problem. It should also specify whether the distinction tracks causal contribution, foreseeability, the existence of a prior duty, or some combination, and flag any pair of desiderata that appear jointly unsatisfiable—for instance, if preserving a robust causal asymmetry conflicts with accommodating distributed collective omissions, or if treating negative causation as omission undermines the boundary with active harm.

  Finally, indicate which of these requirements are genuinely non-negotiable for any theory worth the name and which are camp-specific preferences (e.g., whether determinism about causation must be preserved, whether rights-based accounts may treat all omissions as rights-violations). If you can, briefly indicate how a pure causal account, a deontological rights-based view, and an institutional or role-based framework each fare against the list, but keep the emphasis on the criteria themselves: I need the specification more than the scorecard. Do not provide bibliographies, reading lists, or citations; I want a conceptual map, not a literature guide.
