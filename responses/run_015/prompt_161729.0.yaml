  # SEMINAR DIAGNOSTIC: THE METAPHYSICS OF DISPOSITIONS

  ## SIDE 1: THE BATTERY OF CASES
  **Instructions:** Read the following eight scenarios. For each, determine your **Verdict**. Do not worry about theoretical labels; answer based on your intuition about the object and the situation.

  **Terms:**
  *   **Disposition:** A property like *fragility* or *solubility*.
  *   **Stimulus:** The trigger condition (e.g., *being struck*).
  *   **Manifestation:** The result (e.g., *breaking*).
  *   **Basis:** The underlying physical structure (e.g., *molecular bonding*).

  **Case 1: The Vanishing Fragility (Plain Fink)**
  A glass is structurally fragile. A wizard monitors it. The moment the glass is struck (Stimulus), the wizard instantly casts a spell making the glass non-fragile *before* it has time to break. The glass is struck. It does not break.
  *   **Verdict Options:** (A) The glass was fragile. (B) The glass was not fragile. (C) The glass was fragile, but the stimulus condition was not met properly.

  **Case 2: The Bubble Wrap (Plain Mask – Extrinsic)**
  A glass is structurally fragile. It is tightly wrapped in perfect shock-absorbing bubble wrap. The glass is struck. It does not break.
  *   **Verdict Options:** (A) The glass is fragile. (B) The glass is not fragile. (C) The glass is fragile only if "being wrapped" is excluded from the stimulus.

  **Case 3: The Hard Shell (Plain Mask – Intrinsic)**
  A sugar cube is chemically soluble. It is coated in a hard, insoluble shell that is fused to its surface (intrinsic to the object's current state). It is placed in water. It does not dissolve.
  *   **Verdict Options:** (A) The sugar is soluble. (B) The sugar is not soluble. (C) I need to know if the shell is removable.

  **Case 4: The Wizard's Smash (Mimic)**
  A glass is structurally sturdy (non-fragile). A wizard monitors it. The moment the glass is struck, the wizard uses a force-field to shatter the glass instantly. The glass breaks.
  *   **Verdict Options:** (A) The conditional "If struck, it breaks" is true; the glass is fragile. (B) The conditional is true; the glass is not fragile. (C) The conditional is false.

  **Case 5: The Lightning Strike (Coincidence)**
  A fragile glass is wrapped in bubble wrap (Masked). It is struck. Simultaneously, lightning strikes the glass and shatters it. The manifestation (breaking) occurs.
  *   **Verdict Options:** (A) The conditional "If struck, it breaks" is true. (B) The conditional is false. (C) The conditional is true, but not in virtue of the fragility.

  **Case 6: The Mid-Crack Change (Delayed Fink)**
  A fragile glass is struck. A crack begins to form (Manifestation initiated). Mid-crack, a wizard makes the glass non-fragile. The crack finishes propagating. The glass breaks.
  *   **Verdict Options:** (A) The disposition was present throughout. (B) The disposition was lost before manifestation completed. (C) The case is underdescribed.

  **Case 7: The Time-Release Pill (Self-Dissolving Mask)**
  A soluble pill has a coating that dissolves in water after exactly one minute. The pill is placed in water. It dissolves after one minute.
  *   **Verdict Options:** (A) The pill is soluble immediately. (B) The pill becomes soluble after one minute. (C) The pill is not soluble in the standard sense.

  **Case 8: The Impossible Match (Unrealisable/Protected)**
  (A) A match is disposed to burn if struck at Absolute Zero (physically impossible).
  (B) A radioactive atom is disposed to decay, but is shielded by a field that cannot be turned off.
  *   **Verdict Options:** (A) The disposition exists despite the impossibility/protection. (B) The disposition does not exist. (C) The question is meaningless.

  ***

  ## SIDE 2: THE DECISION TREE
  **Instructions:** Begin at **Q1**. Answer based on your Verdicts from Side 1. Follow the path to a **Leaf**.

  **Q1: The Fink Intuition (Ref: Case 1)**
  In the Vanishing Fragility case, does the glass possess the disposition *before* the wizard intervenes?
  *   **No** → Go to **Leaf 1**.
  *   **Yes** → Go to **Q2**.

  **Q2: The Analysis Type**
  Are dispositions *analyzed* by conditionals (i.e., to be disposed just *is* to satisfy a conditional), or do dispositions *ground* the truth of conditionals?
  *   **Ground** → Go to **Leaf 2**.
  *   **Analyzed** → Go to **Q3**.

  **Q3: The Mimic Intuition (Ref: Case 4)**
  In the Wizard's Smash case, is the conditional "If struck, it breaks" **true**?
  *   **No** → Go to **Leaf 3**.
  *   **Yes** → Go to **Q4**.

  **Q4: The Basis Connection (Ref: Case 4 & 6)**
  Must the manifestation be *caused* by the disposition's basis, and must that basis *persist* through the stimulus?
  *   **Yes** → Go to **Leaf 4**.
  *   **No** → Go to **Q5**.

  **Q5: The Stimulus Content (Ref: Case 2 & 3)**
  To save the analysis, may the stimulus condition include clauses excluding interferers (e.g., "if struck *and no wizard is present*")?
  *   **No** → Go to **Leaf 5**.
  *   **Yes** → Go to **Q6**.

  **Q6: Intrinsicness (Ref: Case 2 & 3)**
  If the stimulus excludes interferers, does the presence of a mask (like bubble wrap) mean the object *lacks* the disposition?
  *   **Yes** → Go to **Leaf 6**.
  *   **No** → Go to **Q7**.

  **Q7: Gradability (Ref: Case 7 & 8)**
  Are dispositions fundamentally matters of degree (probability/threshold) rather than binary (present/absent)?
  *   **Degree** → Go to **Leaf 7**.
  *   **Binary** → Go to **Q8**.

  **Q8: Identity (Ref: Case 3)**
  Is the disposition *identical* to its categorical basis (e.g., is fragility just the molecular structure)?
  *   **Yes** → Go to **Leaf 8**.
  *   **No** → Go to **Leaf 9**.

  ---

  ### THE LEAVES (POSITIONS)

  **Leaf 1: Naive SCA**
  *   **Position:** Dispositions are strictly equivalent to simple conditionals; fink cases describe objects that lack the disposition.
  *   **Awkward Commitment:** Must deny the intuitive verdict that the glass in Case 1 was fragile before the wizard acted.

  **Leaf 2: Dispositional Primitivism** (Confident Attribution: Bird)
  *   **Position:** Dispositions are primitive properties that make conditionals true, not analyzed by them.
  *   **Awkward Commitment:** Accepts irreducible modal properties, which some argue are metaphysically obscure.

  **Leaf 3: Strict Causal Conditionalism**
  *   **Position:** The conditional is false in mimic cases because the manifestation does not follow from the object's nature.
  *   **Awkward Commitment:** Requires a non-standard logic of conditionals to handle cases where the outcome occurs but the conditional is false.

  **Leaf 4: Lewis-Style Revised CA** (Confident Attribution: Lewis)
  *   **Position:** A revised conditional analysis where the basis must be retained and must cause the manifestation.
  *   **Awkward Commitment:** Struggles with Case 6 (Delayed Fink) where the basis is lost mid-manifestation.

  **Leaf 5: Unoccupied (Incoherent)**
  *   **Diagnosis:** Nobody holds this view because denying stimulus refinement while accepting Fink intuitions makes the conditional analysis untenable.

  **Leaf 6: Extrinsic Dispositionalism** (Confident Attribution: McKitrick)
  *   **Position:** Masks and finks are built into the stimulus condition; dispositions are accordingly extrinsic and multi-track.
  *   **Awkward Commitment:** Implies an object's dispositions change merely by moving it to a different environment (Case 2).

  **Leaf 7: Propensity View** (Confident Attribution: Popper)
  *   **Position:** A gradable view where hard cases are handled by thresholds of probability rather than binary presence.
  *   **Awkward Commitment:** Makes it difficult to account for deterministic dispositions (e.g., 100% solubility).

  **Leaf 8: Identity Theory** (Confident Attribution: Armstrong)
  *   **Position:** Dispositions are had in virtue of a basis together with a conditional; the disposition *is* the basis.
  *   **Awkward Commitment:** Struggles to explain how the same basis can realize different dispositions in different laws.

  **Leaf 9: Ceteris Paribus Intrinsicism** (Label by Characteristic Move)
  *   **Position:** Dispositions are intrinsic, but the stimulus condition implicitly includes "normal conditions" (no masks/finks).
  *   **Awkward Commitment:** The phrase "normal conditions" is notoriously difficult to define without circularity.

  ---

  ### UNOCCUPIED LOGICAL SPACE
  *   **Path Q1(Yes) → Q2(Analyzed) → Q3(No) → Q4(No):** *Diagnosis:* Unattractive. Accepts Fink intuitions but denies the conditional is true in Mimics, yet denies the basis must cause the manifestation. Leaves no account of truth-makers.
  *   **Path Q1(Yes) → Q5(No):** *Diagnosis:* Incoherent. Accepts Fink intuitions but refuses to adjust the stimulus condition or the analysis type.
  *   **Path Q7(Degree) → Q8(Yes):** *Diagnosis:* Unexplored. Combining Identity Theory with Gradability is rare, as identities are typically binary.

  ---

  ### DIAGNOSTIC NOTE
  **Most Classificatory Question:** **Q1 (The Fink Intuition).** This single question separates the Naive SCA (Leaf 1) from all sophisticated realist accounts. If a student answers "No," they are committed to the Simple Conditional Analysis regardless of subsequent answers.

  **Hardest Case:** **Case 6 (Delayed Fink).** No position handles this cleanly. The Lewis-Style Revised CA (Leaf 4) requires the basis to persist, but the manifestation completes after the basis is destroyed. Primitivism (Leaf 2) handles it best by decoupling the disposition from the temporal duration of the basis, but at the cost of reductive analysis.
