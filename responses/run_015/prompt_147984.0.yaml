answer: |-
  # Decision Tree: The Logical Space of Precaution

  ## Framing Stance
  Do not treat the four splits as equal. **Split 1 (Scope)** and **Split 4 (Justice)** are the substantive ethical engines; **Split 2 (Trigger)** and **Split 3 (Burden)** are largely procedural derivatives. Most policy debates obscure this by fighting over "strong vs. weak" (Split 2) when the real disagreement is about whether the status quo counts as a risk (Split 1) or whether safety trumps equity (Split 4). This tree is structured to expose those foundational commitments first.

  ---

  ## The Tree Structure

  **Root:** **Split 1 (Scope of Risk)**
  *   **Branch A:** Precaution applies only to *anthropogenic commissions* (new interventions).
  *   **Branch B:** Precaution applies to *omissions* (failure to mitigate natural/systemic risks).

  **Node A/B:** **Split 2 (Trigger Condition)**
  *   **Branch 1:** *Binary Threshold* (Non-negligible possibility of catastrophe = Stop).
  *   **Branch 2:** *Graded Risk* (Plausibility × Severity = Constraint).

  **Node A/B/1/2:** **Split 3 (Burden of Proof)**
  *   **Branch i:** *Proponent of Action* (Must prove safety).
  *   **Branch ii:** *Opponent of Inaction* (Must prove harm).
  *   **Branch iii:** *Incoherent* (Burden framing rejected; procedural only).

  **Node A/B/1/2/i/ii/iii:** **Split 4 (Conflict with Distributive Justice)**
  *   **Branch α:** *Veto* (Precaution overrides economic/human welfare costs).
  *   **Branch β:** *Weighted Override* (Precaution is one value among others).
  *   **Branch γ:** *Dissolves* (Justice concerns subsume precaution).

  ---

  ## The Leaves (Positions)

  *Note: There are 36 logical combinations. The following 10 represent the stable, occupied, or philosophically distinct regions. Unstable or identical regions are flagged.*

  ### Branch A: Anthropogenic Commissions Only (Traditional PP)

  **Leaf 1: The Absolutist Veto**
  *   **Path:** A (Commission) → 1 (Binary) → i (Proponent) → α (Veto)
  *   **Name:** **Strong Precautionary Principle**
  *   **Case Application:**
      *   (1) Gene Drive: **Ban.** Extinction risk is catastrophic; burden on scientists to prove it won't happen (impossible).
      *   (2) Aerosols: **Ban.** Irreversible feedback is possible.
      *   (3) Pesticide: **Ban.** Sublethal effects threaten ecosystem stability.
  *   **Critique:** Ignores the risk of *not* acting (malaria persists).

  **Leaf 2: The Unstable Weighting**
  *   **Path:** A (Commission) → 1 (Binary) → i (Proponent) → β (Weighted)
  *   **Name:** **Unnamed / Logically Unstable**
  *   **Diagnosis:** If the trigger is truly binary (catastrophe possible = stop), you cannot logically "weight" it against economic collapse. If you weight it, the trigger was not binary.
  *   **Collapse:** Functionally collapses into **Leaf 4** in practice, despite theoretical claims of being "Strong."

  **Leaf 3: The Strict Constraint**
  *   **Path:** A (Commission) → 2 (Graded) → i (Proponent) → α (Veto)
  *   **Name:** **Moderate Precautionary Principle**
  *   **Case Application:**
      *   (1) Gene Drive: **Restrict/Moratorium.** Risk is high plausibility/high severity.
      *   (3) Pesticide: **Ban.** Even if farms collapse, pollinator collapse is a veto condition.
  *   **Distinction:** Unlike Leaf 1, allows low-probability risks to pass. Unlike Leaf 4, justice does not override safety.

  **Leaf 4: The Standard Policy Compromise**
  *   **Path:** A (Commission) → 2 (Graded) → i (Proponent) → β (Weighted)
  *   **Name:** **Weak Precautionary Principle** (EU Standard Interpretation)
  *   **Case Application:**
      *   (1) Gene Drive: **Conditional Approval.** Malaria benefit weighs against pollinator risk; requires monitoring.
      *   (3) Pesticide: **Phase-out.** Economic collapse delays the ban, but ban remains the goal.
  *   **Collapse:** In Case (1), often indistinguishable from **Leaf 5** if the "weighting" heavily favors development.

  **Leaf 5: The Risk-Benefit Analyst**
  *   **Path:** A (Commission) → 2 (Graded) → ii (Opponent) → β (Weighted)
  *   **Name:** **Risk-Cost-Benefit Analysis** (Sunstein/Posner Critique)
  *   **Case Application:**
      *   (1) Gene Drive: **Approve.** Burden on environmentalists to prove extinction is *likely*, not just possible.
      *   (3) Pesticide: **Allow.** Economic collapse is a certain harm; pollinator harm is probabilistic.
  *   **Distinction:** Precaution is not a distinct principle but a variable in utility maximization.

  **Leaf 6: The Utilitarian Dissolution**
  *   **Path:** A (Commission) → 2 (Graded) → ii (Opponent) → γ (Dissolves)
  *   **Name:** **Standard Consequentialism**
  *   **Case Application:**
      *   (2) Aerosols: **Approve.** If albedo risk is 5% but warming death is 90%, proceed. Precaution "dissolves" into maximizing expected value.
  *   **Critique:** Abandons the specific intuition of PP (aversion to ambiguity/unknowns).

  ### Branch B: Includes Omissions (Systemic/Planetary PP)

  **Leaf 7: The Planetary Boundary**
  *   **Path:** B (Omission) → 2 (Graded) → i (Proponent) → β (Weighted)
  *   **Name:** **Safe Operating Space / Planetary Boundaries**
  *   **Case Application:**
      *   (2) Aerosols: **Approve as Duty.** *Not* geoengineering risks climate catastrophe (omission risk). Burden is on those who say "do nothing" to prove safety of inaction.
      *   (1) Gene Drive: **Approve.** Malaria is a systemic risk; inaction is not neutral.
  *   **Distinction:** Flips the script on Case (2). Inaction is the risky intervention.

  **Leaf 8: The Paralysis Trap**
  *   **Path:** B (Omission) → 1 (Binary) → i (Proponent) → α (Veto)
  *   **Name:** **Unnamed / Incoherent**
  *   **Diagnosis:** **Unoccupied.** If *both* action and omission trigger a binary veto on catastrophe, no decision is possible (e.g., Aerosols risk albedo; Inaction risks warming).
  *   **Status:** Logically excluded. A binary trigger cannot apply to all options simultaneously without a tie-breaking mechanism (which moves it to Leaf 7 or 5).

  ### Branch C: Meta-Ethical / Procedural (Split 3 = Incoherent)

  **Leaf 9: The Deliberative Turn**
  *   **Path:** Any → Any → iii (Incoherent) → γ (Dissolves)
  *   **Name:** **Discursive Ethics / Procedural Precaution**
  *   **Case Application:**
      *   (3) Pesticide: **Public Inquiry.** The question isn't "ban or allow" but "who decides?" Precaution is a demand for inclusive dialogue, not a specific outcome.
      *   (1) Gene Drive: **Moratorium until Consent.**
  *   **Distinction:** Rejects PP as a decision rule; treats it as a democratic virtue.

  **Leaf 10: The Procedural Weighting**
  *   **Path:** Any → Any → iii (Incoherent) → β (Weighted)
  *   **Name:** **Unnamed / Unattractive**
  *   **Diagnosis:** **Sparse.** Claims burden framing is incoherent but still wants to "weight" precaution against justice. Without a burden rule, "weighting" lacks an operator. Usually collapses into **Leaf 9**.

  ---

  ## Analysis of Logical Space

  ### 1. The Collapses (Indistinguishable Leaves)
  *   **Leaf 1 (Strong PP) vs. Leaf 3 (Moderate PP):** In **Case (1) Gene Drive**, these collapse. If the risk is "extinction of non-target pollinator," both Binary and Graded triggers classify this as high severity. The distinction only matters for low-severity/high-uncertainty cases not present in your three examples.
  *   **Leaf 4 (Weak PP) vs. Leaf 5 (CBA):** In **Case (3) Pesticide**, these often collapse. If the "Weighted Override" in Leaf 4 places high value on economic stability, the outcome matches Leaf 5. The difference is rhetorical (right to safety vs. utility calculation), not practical.

  ### 2. The Empty Seats (Diagnosis)
  *   **Leaf 8 (Omission + Binary + Veto):** This spot is empty because it is **self-defeating**. If failing to mitigate climate change (omission) is a catastrophic risk, and deploying aerosols (commission) is a catastrophic risk, a binary veto paralyzes the agent. Any view occupying this space secretly relies on a *graded* assessment of which catastrophe is worse, moving it to Leaf 7.
  *   **Leaf 10 (Incoherent Burden + Weighted Justice):** This spot is **unattractive**. If you reject the burden of proof framing (claiming it's incoherent to ask "who proves safety?"), you generally reject the idea of precaution as a constraint that can be "weighted." You either make it procedural (Leaf 9) or you accept a burden rule (Leaves 1-5).

  ### 3. Which Splits Do the Work?
  *   **Split 1 (Scope) is the Primary Fault Line.** This determines whether the Precautionary Principle is a conservative bias against technology (Branch A) or a general rule of rationality under uncertainty (Branch B). In **Case (2) Aerosols**, Branch A says "Don't touch the sky." Branch B says "The sky is already breaking; not touching it is the risk." This is the deepest ethical disagreement.
  *   **Split 4 (Justice) is the Secondary Fault Line.** This determines who bears the cost of uncertainty. In **Case (3) Pesticide**, the Veto (Leaf 3) protects the pollinator at the expense of the farmer. The Weighted Override (Leaf 4/5) protects the farmer at the expense of the pollinator. This is not a technical disagreement about risk; it is a disagreement about value hierarchy.
  *   **Split 2 (Trigger) and Split 3 (Burden) are Red Herrings.** Debates over "Strong vs. Weak" (Split 2) or "Who proves what" (Split 3) are usually proxies for disagreements about Scope and Justice. A "Weak" PP with a Justice Veto (Leaf 3) is stricter than a "Strong" PP with a Justice Override (Leaf 2). Focus your seminar on **Scope** and **Justice**; treat Trigger and Burden as implementation details.
