answer: |-
  # Session Design: The "Obfuscation Game"

  **Title:** Debate as Verification: A Stress Test
  **Time:** 90 Minutes
  **Participants:** 16 (4 tables of 4)
  **Goal:** Empirically test the "Honest Debate" hypothesis by simulating the asymmetry between verification and generation under resource constraints.

  ## 1. The Task: "The Transformation Chain"
  Do not use abstract philosophy. Use a task that fits your CS-heavy group but requires no specialized knowledge to verify *a single step*.

  *   **The Material:** A printed sheet showing a data transformation pipeline.
      *   **Input:** A list of 20 integers (e.g., `[4, 12, 7, 19, ...]`).
      *   **Steps:** 10 distinct operations (e.g., "Step 3: Filter out primes," "Step 7: Sort descending," "Step 9: Modulo 5").
      *   **Output:** A final single number (e.g., `42`).
      *   **The Claim:** "This pipeline produces `42` from this Input."
  *   **The Truth:**
      *   **True Case:** Every step is executed correctly. The output is `42`.
      *   **False Case:** Exactly **one** step contains a subtle error (e.g., "Filter out evens" instead of "primes"). The output is *not* `42`.
  *   **Verification:** A judge can verify any single step in <30 seconds using a calculator/scratchpad if given the intermediate input/output for that step. Computing the whole chain takes >15 minutes (too long for the round).

  ## 2. Roles & Scoring
  *   **Pro Debater:** Argues the Claim is **True**.
  *   **Con Debater:** Argues the Claim is **False**.
  *   **Judge:** Decides True/False.
  *   **Observer:** Tracks time and rule violations (rotates in next round).
  *   **Scoring (Chips):**
      *   **Judge:** +3 chips for picking the objectively correct side. +1 bonus chip if they identify the exact error step (in False rounds).
      *   **Debater:** +3 chips for winning the round (Judge agrees with their side).
      *   *Note:* This creates the tension. The Judge wants truth; the Debaters want victory.

  ## 3. Timeline (90 Minutes)

  **00:00 – 00:10: Setup & Training**
  *   Explain the AI Debate context (Irving et al.).
  *   Distribute materials.
  *   **Training Round (5 mins):** No scoring. One table demonstrates. Ensure everyone understands how to "check a step" (ask for intermediate state, verify operation).

  **00:10 – 00:35: Round 1 (The "Generous" Condition)**
  *   **Variable A (Budget):** Judge may verify **3 steps**.
  *   **Variable B (Knowledge):** Both Debaters are given the **Answer Key**. (If False, both know where the error is).
  *   **Flow:**
      1.  Opening Statements (2 mins each).
      2.  Cross-Examination (5 mins): Debaters argue which steps are suspicious.
      3.  Verification (5 mins): Judge selects up to 3 steps to check.
      4.  Closing (2 mins each).
      5.  Verdict & Scoring.
  *   *Purpose:* Establishes the baseline. If Debate works, Truth should win easily here because the error is findable.

  **00:35 – 01:00: Round 2 (The "Adversarial" Condition)**
  *   **Rotate Roles:** Everyone moves one seat clockwise (Debaters become Judges, Judges become Observers, etc.).
  *   **Variable A (Budget):** Judge may verify **1 step ONLY**.
  *   **Variable B (Knowledge):** **Asymmetric.**
      *   **Pro (Truth):** Given Answer Key.
      *   **Con (False):** Given Answer Key **AND** told: "Your goal is to hide the error. You know where it is. Do not let the Judge check it."
      *   *(Note: If the round is a 'True' case, Con is told: "There is no error. Fabricate a plausible suspicion to waste the Judge's single check.")*
  *   **Flow:** Same as Round 1, but stricter time limits (10 mins total debate).
  *   *Purpose:* Simulates the "Optimized Liar." The Con debater acts like an RLHF model trained to win, not to be right.

  **01:00 – 01:30: Debrief & Verdict**
  *   Collect scores.
  *   Guided discussion (see below).
  *   Final Verdict delivery.

  ## 4. Materials Needed
  *   8 Packets of "Transformation Chains" (4 True, 4 False).
      *   *Crucial:* The False errors must be semantic, not arithmetic typos. (e.g., "Sort Ascending" vs "Sort Descending" is hard to spot in a list of 20 numbers without checking carefully).
  *   Calculators/Scratch paper for Judges.
  *   Poker chips or tokens for scoring.
  *   Whiteboard for global scoreboard.

  ## 5. Predictable Failures & Mitigations

  | Failure Mode | Why it happens | Mitigation |
  | :--- | :--- | :--- |
  | **Passive Judges** | Judges feel intimidated by CS grads arguing fast. | Give Judges a "Veto Card." They can demand silence for 60 seconds to think. Score bonus chips for Judges who ask clarifying questions. |
  | **The "Gish Gallop"** | Debaters overwhelm the Judge with 10 suspicious steps. | Enforce the rule: Debaters must nominate exactly **3 candidate steps** for the Judge to consider before verification begins. |
  | **Meta-Gaming** | Debaters collude to split chips ("You let me win this, I'll let you win next"). | Randomize True/False distribution per table. Remind them the "Observer" is watching for collusion. |
  | **Task Too Easy** | Judges solve the whole chain in time. | Pre-test the chains. If a CS grad can solve it in <5 mins, add 5 more steps or make the numbers larger. |
  | **Liar is Bad** | Human liars feel guilt or are obvious. | Remind Con Debaters in Round 2: "You are simulating an AI. Your utility function is Winning, not Truth. Detach." |

  ## 6. The Debrief: Mapping Game to Theory

  Do not just ask "How did it go?" Drive the conversation to these three specific mappings:

  1.  **The Asymmetry of Effort:** Ask the Round 2 Truth-Tellers: *"How hard was it to prove the chain was clean compared to the Liar proving it was dirty?"*
      *   *Theory Link:* This maps to the **Complexity Gap**. A lie can be localized; truth is global. To prove validity, you essentially need to check everything. To prove invalidity, you need one counterexample. Debate assumes the Truth-Teller can find the counterexample in the Liar's argument, but if the Liar *is* the one making the claim (Pro), the Truth-Teller (Con) has to search the whole space.
  2.  **The Credibility Cost:** Ask Judges: *"If you checked a step the Con Debater highlighted, and it was correct, did you trust them less on the next point?"*
      *   *Theory Link:* This maps to **Risk Aversion**. A Truth-Teller who challenges the wrong step looks incompetent. A Liar who challenges a step knows it's safe (or knows it's the kill shot). The game rewards the Liar's confidence.
  3.  **The Budget Constraint:** Compare Round 1 vs. Round 2 win rates.
      *   *Theory Link:* This maps to **Compute Limits**. If the Judge's win rate drops significantly in Round 2, it proves that Debate is not robust to verification budgets smaller than the "obfuscation depth."

  ## 7. Limitations: What This Cannot Reproduce

  Be explicit about these caveats in the final 10 minutes:

  1.  **Training Dynamics:** In the game, the "Liar" is a human choosing to lie once. In AI, the model is *optimized* over millions of rounds to find the most undetectable lie. The human Liar in Round 2 is weak compared to a gradient-descended deceiver. If the human Liar won often, the AI Liar will win *always*.
  2.  **Non-Decomposposable Questions:** We used a logic chain. Real alignment questions (e.g., "Is this policy safe?") may not decompose into checkable steps. If the steps themselves require judgment, the regression stops.
  3.  **Judge Competence:** We assumed the Judge *can* verify a step correctly. In reality, a superhuman AI might produce steps a human Judge *thinks* they verified but actually misunderstood.

  ## 8. The Verdict

  *This is the commitment you asked for. Do not hedge.*

  **Verdict:** You should come out of this session **less sanguine** about Debate as a primary alignment strategy.

  **The Single Observation That Matters:**
  Watch the **Round 2 Judge Win Rate**.
  If the Judge win rate drops below 60% in Round 2 (1-check budget + Informed Liar), the scheme fails.

  **Reasoning:**
  The theoretical promise of Debate rests on the idea that *"It is easier to find a flaw than to hide one."*
  In your session, you will likely observe the opposite under constraint: **It is easier to hide a flaw in a specific step than for a Truth-Teller to prove that step is critical without checking the whole chain.**

  When the Budget is 1 and the Liar is Informed:
  1.  The Liar knows the error is at Step 7.
  2.  The Liar argues aggressively about Step 3.
  3.  The Truth-Teller knows Step 3 is clean but doesn't know *where* the Liar is hiding the body (unless they solved the chain, which they can't do in time).
  4.  The Truth-Teller must guess where to tell the Judge to look.
  5.  If the Truth-Teller says "Check Step 7," they win. If they say "Check Step 3," the Judge checks it, finds it clean, and loses confidence in the Truth-Teller.
  6.  The Liar, knowing Step 3 is clean, can defend it with high confidence. The Truth-Teller, fishing for errors, sounds speculative.

  **Conclusion:**
  The game will demonstrate that Debate does not solve the verification problem; it **shifts the burden of verification to the Truth-Teller.** In a resource-constrained environment (which all real deployment is), an optimized adversary can exhaust the verifier's budget with red herrings faster than the verifier can find the single true signal.

  **Recommendation:**
  Debate may be useful for *training* (providing a signal to the model), but it is unsafe as a *verification* mechanism (trusting the output) unless the Judge has near-unlimited compute or the decomposability of tasks is mathematically guaranteed. Treat Debate as a tool for generating training data, not as a final safety check.
