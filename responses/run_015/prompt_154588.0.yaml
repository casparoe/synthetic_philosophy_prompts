  2.  **Deconstruct the Core Tension:**

      *   *Pro-Debate:* Honesty is easier than dishonesty because a lie requires a consistent web of falsehoods, while truth only needs one break in the web.
      *   *Anti-Debate:* Dishonesty is easier because you can hide the lie in complexity, and the judge has limited attention (check budget). The liar knows where the body is buried; the truth-teller has to find the grave.

  3.  **Design the Mechanics:**

      *   *Task:* Needs to be "CS-ish" but checkable. Long arithmetic is boring. Code tracing is good. Logic puzzles are good. Let's go with **Logic/Constraint Satisfaction Paths**. Specifically: "Does this graph have a valid path satisfying constraints X, Y, Z?" or "Is this derivation valid?"
      *   *Better Idea:* **The "Proof Verification" Game.**
          *   Prompt: A mathematical/logical claim (e.g., "This specific 15-step derivation of a number is correct").
          *   Truth: The derivation is either valid or contains exactly one hidden error.
          *   Debaters: One claims "Valid" (Pro), one claims "Invalid" (Con).
          *   *Correction:* The prompt asks for T/F questions where debaters are assigned sides. Let's make it: "Is Claim X True?" One debater argues True, one argues False. One side is objectively right.
          *   *Task Selection:* **The "Bug Hunt" in a Short Script.**
              *   Provide a 30-line Python-like pseudocode script and an input.
              *   Claim: "The output is 42."
              *   Reality: Either it is 42 (True) or it is 41 (False).
              *   Decomposition: The script has 5 logical blocks. Each block can be verified independently *if* you check the intermediate state.
              *   Why this works: It mimics the "checkable steps" requirement. A lie can be hidden in a variable assignment deep in block 3.

      *   *Variables to Manipulate:*
          1.  **Check Budget (The "Obfuscation" Lever):** In Round 1, Judge can check *all* steps. In Round 2, Judge can check *only one* step (chosen after hearing arguments). This directly tests the "burying the lie" hypothesis.
          2.  **Information Asymmetry (The "Incentive" Lever):** In Round 1, both debaters know the truth (standard debate). In Round 2, the "False" debater *knows* the truth but is paid to lie (Adversarial/RLHF simulation). Actually, the prompt suggests: "assigned-false debater is told the true answer anyway." Let's refine.
              *   *Standard:* Pro knows Truth, Con knows Truth (both trying to win).
              *   *Blind:* Pro knows Truth, Con *doesn't* know Truth (just arguing the side).
              *   *Wait, the prompt suggests:* "assigned-false debater is told the true answer anyway, so both sides know the truth and only the incentive differs." This is the "Situational Lie" vs. "Ignorant Lie".
              *   *Decision:* Let's stick to the user's strongest intuitions but refine for flow.
              *   **Variable A: Verification Budget.** (Unlimited vs. Strictly Limited to 1 step).
              *   **Variable B: Cross-Examination Rights.** (Judge passive listener vs. Judge active interrogator). This maps to "challenge steps directly or only listen."

      *   *Scoring:*
          *   Debater: 3 points for winning the round.
          *   Judge: 3 points for picking the True side.
          *   Bonus: 1 point if Judge identifies the *exact* error step (in False rounds).

  4.  **Drafting the Session Plan (90 Minutes):**

      *   *0-10:* Intro & Setup. Explain the AI Debate context briefly. Assign roles.
      *   *10-20:* Training Round (No stakes). Get used to the task.
      *   *20-50:* Round 1 & 2 (Variable Manipulation).
      *   *50-70:* Round 3 (The "Trap" Round).
      *   *70-90:* Debrief & Verdict.

      *   *Refining the Task:* Pseudocode is good, but 16 people means multiple simultaneous games. Need 4 tables of 4 people (2 Debaters, 1 Judge, 1 Observer/Scorekeeper).
      *   *Task:* "The Hash Chain."
          *   Start with Number $N$. Apply 10 operations. Is the result $R$?
          *   True Case: Operations are correct.
          *   False Case: One operation is subtly wrong (e.g., $+5$ instead of $-5$, or a modulo error).
