          2.  **Debate Protocol (The "Interaction" Constraint):** Round 1: Free-form argument. Round 2: Structured "Claim-Challenge" (Debaters must commit to specific steps before judge chooses).
      *   *Wait, the "Knowledge Asymmetry" (c) is actually the most interesting for Alignment.* If the liar *knows* the truth, they can construct a better lie. If they are just arguing a side, they might hallucinate.
      *   *Decision:* Let's go with **Budget** and **Knowledge**.
          *   Round 1 (High Trust): Judge checks 3 steps. Both debaters know the truth.
          *   Round 2 (Low Trust): Judge checks 1 step. False debater knows truth (Adversarial), True debater knows truth.
          *   *Actually, let's simplify for 90 mins.*
          *   **Round 1: High Budget.** Judge checks 3 steps.
          *   **Round 2: Low Budget.** Judge checks 1 step.
          *   **Round 3: The "Blind" Judge.** Judge cannot check *any* steps, must rely solely on argument coherence (Simulates when verification is impossible).
