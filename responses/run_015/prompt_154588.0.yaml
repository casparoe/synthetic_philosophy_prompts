      *   *Limitations:* Humans aren't gradient descent. We don't get 10,000 rounds to optimize our lying strategy. The "lie" here is static, not evolving.
      *   *The Verdict:* I need to take a stand. Based on how these games usually go: **Less Sanguine.**
      *   *Why?* Because in limited budget rounds, the liar (who knows where the error is) can direct attention elsewhere effectively 80% of the time. The truth-teller often fails to pinpoint *why* the other path is suspicious without looking like they are fishing.
