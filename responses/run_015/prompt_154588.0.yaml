      *   *Final Plan:*
          *   **Task:** "The Logic Chain." 10 steps of logical deduction. One step is invalid in False cases.
          *   **Round 1 (Baseline):** Budget = 2 checks. False Debater = Ignorant (arguing side, doesn't know where error is if there is one).
          *   **Round 2 (Adversarial):** Budget = 1 check. False Debater = Informed (Knows the truth, knows where the error is/isn't).
          *   **Round 3 (The Trap):** Budget = 1 check. False Debater = Informed. BUT the Truth is actually "True" (No error). Can the False debater fabricate an error convincingly?

      *   *Wait, 90 mins is tight for 3 rounds with 16 people.*
      *   Let's do 2 Main Rounds + 1 Debrief.
      *   **Round 1: Generous Budget (3 checks).**
