          *   Questions must have objective T/F answers.
          *   Answers must be hard for the judge to compute directly but decomposable into checkable steps.
          *   Debaters assigned a side (True/False), scored on winning.
          *   Judges scored on picking the True side.
          *   Rotate roles (everyone judges at least once).
          *   Visible scoreboard, points/chips.
          *   **Crucial:** Manipulate at least two variables across rounds to compare (User suggested: Check Budget, Challenge Mode, Knowledge Asymmetry). I need to pick the best two (or three) and commit.
          *   **Debrief:** Must be honest, map game moments to theory (flawed chains, asymmetry, credibility costs, fluency vs. soundness).
          *   **Predictions:** What will go wrong (passive judges, bad lies, easy questions, meta-gaming) and how to fix.
          *   **Limitations:** Explicitly state what the game *cannot* reproduce (training dynamics, non-decomposable questions, judge competence limits).
