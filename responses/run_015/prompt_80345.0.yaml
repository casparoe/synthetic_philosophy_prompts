prompt: |-
  I'm in a philosophy of science seminar and I keep getting whiplash from the counterfactual vs. interventionist causation debate — I was reading through the counterfactual literature and it kept feeling like the debate was going in circles, and I think the real problem is I don't have a clear sense of what I should be demanding of any theory of causation before I pick a side. Can you write me the desiderata — the full spec of what an adequate theory of causation actualy has to deliver? I want the list of test cases it has to get right, and for each one the consideration behind why it's a requirement. I'm thinking of the classic ones: preemption (the two-soldiers case where one fires and kills and the other would have fired too), symmetric difference-making (one match igniting two flammable objects), overdetermination (two bullets fired at once, either alone would have killed), causation by absence (the absent match or the absent oxygen), the transitivity problem (the match caused the fire, the fire caused the smoke, so did the match cause the smoke — and by extension did the Big Bang cause everything), and the proportionality problem (is the "flaming match" the cause, or just "the match"?). For each requirement, mark which are non-negotiable and which are really just a preference of one camp.

  The part I most want to see is which pairs of desiderata you suspect can't be jointly satisfied — like whether transitivity and the "causation shouldnt be too promiscuous" requirement (the Big Bang thing) can both be met, or whether proportionality and causation by absence are in tension. And tell me which single requirement does the most work excluding candidate theories. You can briefly score the counterfactual and interventionist camps against the list, but keep the weight on the requirements and their motivating cases, not the scoring. And be honest about where your reasoning is most likely to fail: what argument or consideration would change your mind about which requirements are genuine desiderata versus camp prejudices, and where are you least confident in the list?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** Philosophy of science seminar, feeling "whiplash" from the counterfactual vs. interventionist causation debate.
      *   **Problem:** Feels like the debate is circular; lacks clear criteria (desiderata) for evaluating theories.
      *   **Task:** Write a "full spec" of desiderata for an adequate theory of causation.
      *   **Requirements:**
          *   List test cases (Preemption, Symmetric Difference-making, Overdetermination, Causation by Absence, Transitivity, Proportionality).
          *   Explain the consideration behind *why* it's a requirement.
          *   Mark which are non-negotiable vs. camp preferences.
          *   **Crucial:** Identify tensions/incompatibilities between desiderata (e.g., Transitivity vs. Promiscuity, Proportionality vs. Absence).
          *   Identify the single requirement that does the most work in excluding theories.
          *   Briefly score Counterfactual (Lewis-style) vs. Interventionist (Woodward-style) against the list.
          *   **Meta-Reflection:** Be honest about where the reasoning might fail, what would change my mind, and where confidence is lowest.

  2.  **Deconstruct the Desiderata (The "Spec"):**
      *   I need to formalize the intuitive cases into philosophical constraints.
      *   *Preemption:* Early/Late. Theory must distinguish the actual cause from the backup.
      *   *Overdetermination:* Symmetric. Theory must handle cases where $C_1$ and $C_2$ both suffice.
      *   *Absence/Omission:* Theory must decide if non-events count as causes.
      *   *Transitivity:* Is causation a chain?
      *   *Proportionality/Specificity:* Is the cause too specific or too general? (Yablo's constraint).
      *   *Difference-Making:* The core intuition that changing the cause changes the effect.
      *   *Asymmetry:* Cause precedes/is distinct from effect (no backtracking).
      *   *Intrinsicness/Process:* Is there a physical connection?

  3.  **Identify Tensions/Trade-offs (The "Hard Part"):**
      *   *Transitivity vs. Proportionality/Promiscuity:* If causation transmits, the Big Bang causes my typing. If we block this, we break transitivity.
      *   *Absence vs. Spuriousness:* If absences are causes, my *not* watering the plant causes its death, but so does the Queen of England *not* watering it. Too many causes.
      *   *Preemption vs. Simple Counterfactual Dependence:* Simple counterfactuals fail preemption (if $C_1$ hadn't fired, $C_2$ would have, so $E$ still happens, so $E$ doesn't depend on $C_1$).
      *   *Interventionism vs. Absence:* Hard to intervene on an absence.

  4.  **Evaluate the Camps (Briefly):**
      *   *Counterfactual (Lewis):* Good on preemption (with tweaking), bad on transitivity (sometimes), struggles with absence (makes everything an absence).
      *   *Interventionist (Woodward):* Good on difference-making, handles preemption well via paths, struggles with absence (variables must be manipulable), strict on proportionality.

  5.  **Drafting the Content - Section by Section:**

      *   **Introduction:** Acknowledge the whiplash. Validate that the "spec" is the missing piece.
      *   **The Desiderata List:** Go through the user's list + essential additions.
          *   Format: Case/Constraint -> Rationale -> Status (Non-negotiable vs. Contested).
      *   **The Incompatibility Matrix (The "Gödel's Theorem" of Causation):** This is the core value add.
          *   Transitivity vs. Non-Promiscuity.
          *   Absence vs. Selectivity.
          *   Preemption vs. Simple Dependence.
      *   **The "Killer" Constraint:** Which one filters the most? Likely *Preemption* or *Selectivity (Proportionality)*. I'll argue for Selectivity/Proportionality because it kills both naive regularity and naive counterfactual accounts.
      *   **Scoring the Camps:** Keep it brief as requested.
      *   **Meta-Reflection:** Where am I weak? Probably on the metaphysics of absence and the pragmatic nature of causal selection.

  6.  **Refining the Arguments (Self-Correction during drafting):**
      *   *Correction:* The user asked for "Symmetric difference-making (one match igniting two flammable objects)." Wait, that sounds like *common cause* or *joint effects*. Actually, usually, symmetric overdetermination is two matches lighting one object. Let me re-read the prompt. "one match igniting two flammable objects". That's actually a *common cause* scenario (Match -> Fire A, Match -> Fire B). The constraint there is usually *Asymmetry* (Fire A didn't cause Fire B). I need to clarify that. Or did they mean *Symmetric Overdetermination* (two bullets)? The prompt lists "Overdetermination" separately. Okay, I will interpret "Symmetric difference-making" as the requirement that the theory distinguishes cause-effect from effect-effect (the common cause problem).
      *   *Correction on Transitivity:* Lewis wanted transitivity. Woodward is agnostic/contextual. I need to make sure I don't paint transitivity as purely "good." It's a feature that creates bugs.
      *   *Status Marking:* Be careful. "Non-negotiable" is strong. Difference-making is probably the only near-universal. Transitivity is definitely contested. Absence is highly contested.

  7.  **Final Polish:**
      *   Ensure the tone is seminar-appropriate (rigorous but accessible).
      *   Check the "honesty" section. Admit that causal pluralism might be the real answer, which undermines the search for a single "spec."
      *   Make sure the "Incompatibilities" section is prominent.

  8.  **Final Review against constraints:**
      *   List test cases? Yes.
      *   Consideration behind why? Yes.
      *   Non-negotiable vs. Preference? Yes.
      *   Pairs that can't be jointly satisfied? Yes.
      *   Single requirement doing most work? Yes.
      *   Score camps briefly? Yes.
      *   Meta-reflection on failure modes? Yes.

  *(Self-Correction on the "Symmetric Difference-Making" prompt point)*: The prompt says "one match igniting two flammable objects". In causation literature, this is usually used to test *Asymmetry* and *Common Cause*. If Match causes A and Match causes B, does A cause B? A theory must say No. I will frame it as the "Common Cause / Epiphenomenalism" constraint.

  *(Refining the "Non-Negotiable" list)*: I need to be bold. Difference-making is non-negotiable. Asymmetry is non-negotiable. Preemption intuition is strong but theories solve it differently. Transitivity is definitely a preference. Absence is a preference.

  *(Refining the "Killer Constraint")*: I think **Causal Selection (Proportionality/Selectivity)** is the real killer. It's why we don't say "The Big Bang caused the fire" and why we don't say "The absence of water caused the fire." It filters out the most "true but useless" claims.

