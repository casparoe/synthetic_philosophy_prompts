  *   **Evidence:** The maize analogy is the classic example for this; suggesting common-garden/reciprocal-transplant designs is exactly right.
  *   **Pooling:** Your explanation of why pooling changes the heritability (denominator increases due to between-group variance) is correct and clearly explained. You avoided the trap of saying it would be a weighted average.
