      *   **Task:** Provide a diagnosis that engages concrete positions (skeptic vs. interventionist), identifies the nature of the disagreement (empirical, standards of reasoning, starting intuitions, different questions), and offers an honest assessment of whether progress is possible (distinction, model, change of question).
