answer: |-
  Your hypothesis is correct, but it does not go deep enough. The impasse is not merely a disagreement about what counts as a moral reason (efficacy-dependent vs. structural); it is a disagreement about the **ontology of the moral agent** in the context of structural harm.

  The stall persists because your group is attempting to solve a structural problem using the logic of individual causation. The Skeptic and the Interventionist are not answering the same question under different guises; they are operating within incompatible moral architectures that render each other's premises unintelligible.

  Here is the diagnosis of the fracture, followed by an honest assessment of whether it can be moved.

  ### 1. The Diagnosis: Causal Individualism vs. Relational Integrity

  The disagreement is substantive, not verbal, but it is rooted in a pre-theoretical commitment regarding what morality is *for*.

  **The Skeptic's Architecture: Causal Individualism**
  The Skeptic operates on a model of **Causal Individualism**. In this view, the moral agent is an isolated lever acting upon the world. The moral value of an action is a function of the delta it produces in the state of the world ($\Delta World$).
  *   **Concrete Application:** For the voter, the vote is a causal input. If the margin of victory is $>1$, the input is zero. For the meat-eater, the purchase is a demand signal. If the supply chain is insensitive to single units (due to bulk ordering thresholds, waste buffers, etc.), the purchase causes no additional suffering.
  *   **The Hidden Premise:** Morality is instrumental. It is a technology for optimizing outcomes. If the technology fails to engage the mechanism (the world), the action is morally inert.
  *   **Why they stall:** When the Interventionist appeals to "complicity," the Skeptic hears a category error. To the Skeptic, "complicity" without causal impact is merely an emotional state (guilt) or an aesthetic preference (purity). They cannot see how a relation to a harm, absent causal contribution to that harm, generates a duty.

  **The Interventionist's Architecture: Relational Integrity**
  The Interventionist operates on a model of **Relational Integrity**. In this view, the moral agent is a node within a network of social and economic relations. The moral value of an action is a function of the agent's alignment with or opposition to the normative structure of that network.
  *   **Concrete Application:** For the voter, voting is a performative affirmation of the democratic contract, regardless of the count. For the meat-eater, buying factory-farmed meat is a participation in a practice of domination, regardless of marginal demand. The wrongness lies in *willing the maxim* of the action, not the consequence.
  *   **The Hidden Premise:** Morality is constitutive. It is about who we are and what we stand for. To act in accordance with a harmful structure is to corrupt the agent's moral integrity, even if the external world remains unchanged.
  *   **Why they stall:** When the Skeptic demands "Show me the harm," the Interventionist hears a demand to justify integrity in terms of efficiency. They view the Skeptic's demand as a failure to understand that morality binds the *will*, not just the *outcome*.

  **The Fracture:**
  The impasse exists because the Skeptic demands **external validation** (did the world change?), while the Interventionist demands **internal validation** (did I keep my hands clean?). These are not competing answers to the same question; they are answers to different questions.
  *   Skeptic: "What is the optimal strategy to minimize suffering?"
  *   Interventionist: "How do I live without being a participant in suffering?"

  ### 2. Is it Verbal, Empirical, or Bedrock?

  It is not verbal. If it were merely about the definition of "harm," you could stipulate definitions and move on. But the disagreement dictates action guides. The Skeptic will eat the meat; the Interventionist will not. They cannot compromise.

  It is not empirical. As you noted, they agree on the physics and economics. Even if you proved a specific threshold model where one burger *does* trigger a reorder, the Skeptic would concede the point but maintain the principle (if the threshold weren't met, it would be permissible). The Interventionist would maintain the purchase is wrong regardless of the threshold.

  It is **bedrock**. It is a clash of fundamental intuitions about the locus of moral evaluation.
  *   The Skeptic intuits that **morality must be efficient**. To forbid an action that changes nothing is irrational fetishism.
  *   The Interventionist intuits that **morality must be actionable**. To tie my moral standing to outcomes I cannot control (collective thresholds) is to make morality a matter of luck.

  This is why the literature feels exhausted. You are witnessing the collision of Consequentialist and Deontological/Virtue-theoretic intuitions, stripped of their technical jargon, applied to a problem (climate/structural harm) that exposes their incompatibility. The Skeptic treats the Interventionist as superstitious; the Interventionist treats the Skeptic as complacent. Neither can argue for their bedrock intuition without begging the question.

  ### 3. Can the Impasse Be Moved?

  Here is the honest answer: **No, not within the current framing.**

  If you continue to ask, "Does the individual action make a difference?" or "Is the individual action wrong?", you will remain stuck. The "Individual Difference" frame is malformed for structural problems. It forces a structural phenomenon into an individual causal box, which inevitably privileges the Skeptic's ontology (since structurally, the individual *doesn't* make a difference).

  However, you can dissolve the impasse by shifting the **Unit of Analysis**.

  **Option A: The Political Shift (From Individual to Collective)**
  Stop asking what the *individual* should do and ask what the *collective* is obligated to create.
  *   **The Move:** Acknowledge the Skeptic is right about *causation* (my vote doesn't change the election) but wrong about *obligation*. The obligation is not to "make a difference" individually, but to organize such that individual actions *do* make a difference.
  *   **Why it helps:** It satisfies the Skeptic's demand for efficacy (we need effective action) and the Interventionist's demand for resistance (we must oppose the structure). It reframes the individual act not as a causal lever, but as a **commitment device** toward collective organization.
  *   **The Cost:** It admits that individual mitigation (recycling, veganism) is morally secondary to political organization. This may frustrate Interventionists who value personal purity, but it grounds their energy in efficacy.

  **Option B: The Complicity Shift (From Harm to Participation)**
  Abandon "harm" as the metric for the Interventionist side and fully embrace "complicity."
  *   **The Move:** Concede to the Skeptic that no *harm* is caused by the individual act. Argue instead that the wrongness is not about harm, but about **benefiting from injustice** or **participating in a wrongful practice**.
  *   **Why it helps:** It removes the empirical burden of proving causal thresholds. It allows the Interventionist to say, "I am not claiming I cause suffering; I am claiming I am unwilling to be a beneficiary of it."
  *   **The Cost:** It requires the Skeptic to accept non-consequentialist reasons. This is a hard sell. However, it clarifies the disagreement: "Do we have a duty to avoid benefiting from injustice, even if avoiding that benefit changes nothing?" This is a clearer, more honest debate than the current stalemate.

  **Option C: The Decision-Theoretic Shift (Causal vs. Evidential)**
  Introduce a formal distinction between Causal Decision Theory (CDT) and Evidential Decision Theory (EDT) or Superrationality.
  *   **The Move:** Show that if agents reason as "types" rather than "tokens," the individual act *does* have expected utility. If I am the kind of person who defects, others like me will too.
  *   **Why it helps:** It offers a mathematical bridge for the Skeptic.
  *   **The Cost:** Philosophers often find this unsatisfying because it relies on controversial metaphysics of agency (magical thinking, to the Skeptic; rational cooperation, to the Interventionist). It often feels like a trick rather than a moral resolution.

  ### Recommendation

  The most productive path for your reading group is **Option A (The Political Shift)** combined with a concession on **Option B**.

  1.  **Concede the Causal Point:** Admit to the Skeptic that in isolation, the individual carbon footprint or vote is causally redundant. Stop trying to prove otherwise with threshold arguments. This disarms the Skeptic's primary weapon.
  2.  **Reframe the Normative Question:** Shift the question from "Is this act wrong?" to "What is the relationship between individual integrity and collective efficacy?"
  3.  **The New Synthesis:** Argue that individual actions are morally required *not* because they cause outcomes, but because they are **necessary conditions for collective agency**. We cannot form the "We" required to solve climate change if the "I"s are not already aligned with the goal. The individual act is a *signal* to the collective, not a *cause* of the outcome.

  **Will this move the impasse?**
  It will move the *conversation*, but it may not change the *minds*. The hardline Skeptic will still ask, "Why signal if the signal isn't heard?" The hardline Interventionist will still ask, "Why wait for the collective if the act is wrong now?"

  But this diagnosis allows you to tell your group: **"We are not failing to find the answer. We are failing to agree on the game."** Once you acknowledge that the Skeptic is playing *Outcome Optimization* and the Interventionist is playing *Integrity Maintenance*, you can stop trying to prove one right and start asking how a moral theory must account for both the need for efficacy and the need for integrity in a structurally unjust world.

  That is a doctoral-level contribution: moving from solving the inefficacy objection to diagnosing why the objection reveals a limit in our current moral vocabulary.
