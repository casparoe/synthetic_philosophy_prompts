      *Wait, one more nuance:* The prompt asks if the individual-level framing is malformed. I should strongly argue *yes*. The "inefficacy objection" only works if we assume morality is solely about outcome optimization by isolated agents. If we assume morality is about joint action, the objection dissolves.

