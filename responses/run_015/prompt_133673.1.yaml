  4.  **Step 2: Reconstructing the Implicit Commitments:**
      *   *Stance 1: 'Let Preferences Be' (The Nordic Model Defense)*
          *   *Ontology:* Methodological Individualism. The agent is prior to the structure. Preferences are pre-social or at least sovereign.
          *   *Normativity:* Negative Liberty (freedom *from* interference). Justice is procedural (equal opportunity), not outcome-based.
