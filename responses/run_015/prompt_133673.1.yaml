      *   **Problem:** Stuck on a puzzle regarding the explanation of occupational segregation despite egalitarian policies. Two dominant policy responses (biological essentialism vs. structural quotas) both seem to rely on shaky assumptions about "authentic" vs. "manufactured" preferences.
