      *   *Stance A (Liberal/Essentialist):* "Free choice." Preferences are internal. If women choose care and men choose tech, that's freedom. Interfering violates autonomy.
      *   *Stance B (Radical/Structuralist):*"False consciousness." Preferences are socially constructed by patriarchy. We need quotas to break the cycle and achieve justice (parity).
