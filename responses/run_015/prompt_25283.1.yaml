answer: |-
  You have identified one of the central problems in analytic philosophy and rationalist epistemology. The pattern you describe is the distinction between **verbal disputes** and **substantive disputes**, but as you correctly suspect, the standard definition is often too shallow.

  When a disagreement survives "tabooing" (operationalization), yet yields no difference in empirical prediction or practical recommendation, you are left with a specific class of philosophical problem: **non-factualist disagreement**, **metaphysical indeterminacy**, or **conceptual engineering disputes**.

  Here is the best available framework for analyzing this, drawing from David Chalmers' work on verbal disputes, Rudolf Carnap's ontological frameworks, and the LessWrong sequences on "floating beliefs" and "the word 'real'."

  ---

  ### 1. The Diagnostic Framework: How to Predict Before Tabooing

  You asked for structural features that predict whether a dispute will dissolve. While there is no algorithm, philosophers and rationalists use a cluster of heuristics. If an argument exhibits the following features, it is likely **merely verbal** (or merely conceptual):

  *   **The "No-Difference" Test:** Both parties agree on all counterfactuals. (e.g., "If we opened the box, what would we see?" "If we ran the code, what would the output be?") If they agree on all conditional predictions, the dispute is likely about labeling, not territory.
  *   **The "Translation" Test:** Can you rephrase Person A's claim into Person B's vocabulary without loss of information, such that Person B would assent to it? If "Numbers exist" translates to "Number-talk is indispensable to our best scientific theories" and the nominalist agrees with *that*, the dispute is verbal.
  *   **The "Stakes" Test:** Does the outcome change any decision? If both sides would fund the same research, vote for the same policy, and treat the AI the same way, the disagreement is likely about **classification** rather than **reality**.
  *   **The "Vagueness" Cluster:** As you noted, if the dispute centers on a boundary case of a vague predicate (e.g., "Is a heap of 100 grains a *pile*?"), it is almost certainly verbal. Substantive disputes usually involve clear cases where mechanisms differ.

  **The Trap:** The failure mode you identified is real. Sometimes disputes *look* verbal (no empirical difference) but feel substantive. This happens when the disagreement is about **ontology** or **ideology** rather than **object-level facts**.

  ### 2. When the Dispute Survives: What Is Left?

  If you taboo the words, agree on all empirical predictions, agree on all mathematical proofs, and agree on all recommended actions, yet both sides insist "I am right and you are wrong," what is the disagreement about?

  There are three leading accounts of what remains in this scenario:

  #### A. Carnapian Frameworks (Pragmatic Choice)
  Rudolf Carnap argued that questions like "Do numbers exist?" are **external questions**. They are not questions about the world, but questions about which **linguistic framework** we should adopt.
  *   **The Disagreement:** It is not about fact, but about **utility**. One side argues the "Platonist framework" is more useful for science; the other argues the "Nominalist framework" is more parsimonious.
  *   **The Status:** The disagreement is substantive *pragmatically*, but empty *ontologically*. It is a debate about which map to use, disguised as a debate about the territory.
  *   **Rationalist Translation:** This is a debate about **compression** and **useful abstractions**.

  #### B. Quinean Ontological Commitment (Indispensability)
  W.V.O. Quine argued that we should believe in the existence of whatever entities are required to make our best scientific theories true ("To be is to be the value of a bound variable").
  *   **The Disagreement:** If one side says numbers exist and the other doesn't, but both use calculus to build bridges, Quine would say the nominalist is being inconsistent.
  *   **The Status:** The disagreement is about **intellectual honesty** and **logical consistency**. The "existence" claim is a commitment to the truth of the sentences that quantify over numbers.
  *   **Rationalist Translation:** This is a debate about **belief propagation**. If you believe the theory, you must believe the entities the theory requires.

  #### C. Metaphysical Realism (Carving at Joints)
  Philosophers like Ted Sider argue that some concepts "carve nature at the joints" better than others. There is a **structure** to the world, and some languages match that structure better.
  *   **The Disagreement:** Even if two descriptions are empirically equivalent, one might be **more fundamental**. For example, "The glass broke because it was struck" vs. "The glass broke because of particle interactions." Both predict the same outcome, but one captures the *causal structure* better.
  *   **The Status:** The disagreement is about **metaphysical priority**. In your "numbers" example, the realist claims numbers are part of the fundamental structure of reality; the anti-realist claims they are useful fictions.
  *   **Rationalist Translation:** This is a debate about **latent variables**. Are numbers latent variables in the generative process of the universe, or are they just features of our data compression?

  ### 3. The Specific Case of "Do Numbers Exist?"

  This is the hardest case because it is the paradigm of **ontological deflationism**.

  In the LessWrong sequences, Eliezer Yudkowsky addresses this in *The Word "Real"*. He argues that when people ask "Do numbers exist?", they are often confusing **map-territory confusion**.
  1.  **Territory:** The causal universe.
  2.  **Map:** Our models (including math).

  If both sides agree on the math (2+2=4) and agree on the physics (math describes physics), the disagreement is often about whether the **map** is also part of the **territory**.

  *   **The Realist:** Says the map corresponds to a non-physical part of the territory (Platonic realm).
  *   **The Anti-Realist:** Says the map is just a tool in the territory (human brains).

  **Why does the disagreement survive tabooing?**
  Because it is often a **proxy war** for a different disagreement.
  *   It might be about **Theism:** If abstract objects exist independently, does God?
  *   It might be about **Naturalism:** If numbers exist non-physically, is naturalism false?
  *   It might be about **Modality:** Are mathematical truths necessary or contingent?

  In these cases, the dispute is **substantive**, but not about the numbers themselves. It is about the **implications** of the ontology for *other* beliefs. This is why it feels real even without empirical differences.

  ### 4. A Proposed Taxonomy for Your Observation

  To give you the "name" you are looking for, I propose distinguishing three layers of disagreement. Most rationalist advice focuses on Layer 1, but your observation concerns Layer 2 and 3.

  | Layer | Type | Description | Resolution Method |
  | :--- | :--- | :--- | :--- |
  | **1** | **Empirical** | Disagreement about observations/predictions. | Experiment / Data |
  | **2** | **Semantic** | Disagreement about word definitions (Verbal). | Tabooing / Operationalizing |
  | **3** | **Ideological** | Disagreement about conceptual frameworks, ontology, or values *given* agreement on 1 & 2. | **Conceptual Engineering** / Pragmatic Choice |

  Your observation is that people often mistake **Layer 3** disputes for **Layer 1** disputes.
  *   When they taboo words and the disagreement vanishes, it was **Layer 2**.
  *   When they taboo words and the disagreement remains, it is **Layer 3**.

  **Layer 3 disputes are substantive, but not factual.** They are disputes about:
  1.  **Theoretical Virtues:** Simplicity, elegance, explanatory power.
  2.  **Normative Commitments:** What *should* we count as "fair," "understanding," or "existence"?
  3.  **Metaphysical Structure:** What is fundamental vs. derivative?

  ### 5. Conclusion: The Best Account

  The most robust framework for this is **David Chalmers' "Verbal Disputes" (2011)** combined with **Huw Price's Global Expressivism**.

  *   **Chalmers** provides the test: A dispute is verbal if there is a "neutral" formulation both accept. If no neutral formulation exists, it is substantive.
  *   **Price** explains the "numbers" case: Statements like "Numbers exist" are not descriptions of the world (representational) but tools for negotiating our conceptual scheme (expressive).

  **To answer your specific questions:**

  1.  **Is there a diagnostic framework?**
      Yes. Look for **explanatory asymmetry**. If one side's ontology explains *why* the math works (e.g., "Math works because numbers exist") and the other treats it as brute fact ("Math works because it's useful"), the dispute is substantive (Layer 3). If both offer the same explanation but use different labels, it is verbal (Layer 2).

  2.  **What is left when empirical predictions agree?**
      You are left with a dispute over **Conceptual Utility** and **Metaphysical Grounding**. You are arguing about which vocabulary best captures the structure of the world, or which vocabulary best serves our goals.

  3.  **How to detect it?**
      Ask: **"If we adopted your definition, what would we stop doing? What would we start explaining differently?"**
      *   If the answer is "Nothing," it's a verbal dispute.
      *   If the answer is "We would stop looking for a causal mechanism for numbers," it's a substantive metaphysical dispute.
      *   If the answer is "We would feel more comfortable calling ourselves Naturalists," it's a tribal/ideological dispute.

  In the rationalist community, the heuristic is: **"Does this belief pay rent in anticipated experience?"**
  *   If no: It's a floating belief (Layer 2/Verbal).
  *   If yes, but the rent is paid in *other beliefs* rather than *sensory experience* (e.g., consistency, simplicity): It's a Layer 3 Metaphysical/ideological dispute.

  The "numbers exist" debate is almost always Layer 3. It is a substantive disagreement about **how to interpret the success of mathematics**, not about mathematics itself.
