      *   *H2 (Scale/Time/Elasticity):* This is the strongest empirical claim. The supply response is the crux. Short-run inelasticity makes control feasible/beneficial (prevents exploitation); long-run elasticity makes it destructive (reduces supply). The disagreement is indeed about *which* time horizon and scale matters for policy. This is highly load-bearing.
      *   *H3 (Verbal/Security vs. Price):* This is crucial. Rent control is often a clumsy tool for tenure security. If the goal is security, price controls are a blunt instrument. If the goal is low price, it works for insiders, fails for outsiders. This conflation allows the policy to survive criticism. This is load-bearing.

  4.  **Analyze the Minimum Wage Asymmetry:**
