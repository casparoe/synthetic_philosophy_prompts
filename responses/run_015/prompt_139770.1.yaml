      *(Self-Correction during drafting)*: I need to be careful not to sound like I'm taking sides. Keep it structural. On the Min Wage asymmetry, emphasize the *incidence of the cost*. Min wage costs are diffuse (consumers/profits); Rent control costs are concentrated (future tenants/landlords). Also, the "mutually beneficial exchange" point in the prompt is key. For min wage, the exchange is labor for money. For housing, it's shelter for money. But the landlord's "labor" is asset management. The moral weight differs.

      *(Refining the "Word")*: The user suggested "Affordability." I should validate that but maybe sharpen it. "Security" is also good. Let's stick with the user's "Affordability" but define the collapse precisely: *Static Purchasing Power* vs. *Dynamic Tenure Stability*.

      *(Refining the Prediction)*: Why will it persist? Because the policy *works* for the people who show up to city council meetings (current tenants), even if it fails for the people who don't (future residents). The political economy sustains the intellectual stalemate.

