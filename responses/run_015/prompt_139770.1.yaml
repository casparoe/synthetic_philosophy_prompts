answer: |-
  This is a precise diagnosis of a stalemate that persists not because of ignorance, but because the disagreement is overdetermined. You are correct that the argument's shape is invariant because the underlying commitments are structural, not merely empirical. Here is the breakdown of your hypothesis, the asymmetry with labor markets, and the prospects for progress.

  ### 1. Diagnosis of Your Hypothesis

  **Hypothesis 1: Different Counterfactuals (Decoration)**
  This is largely rhetorical decoration. While it is true that economists compare rent control to a competitive ideal and defenders compare it to the zoned, financialized status quo, this does not explain the disagreement. Professional economists are well-versed in second-best theory; they know that introducing a distortion into a distorted market can theoretically improve welfare. They oppose rent control not because they assume a frictionless baseline, but because they believe rent control is the *wrong* instrument to correct the existing distortions (zoning, tax policy). Defenders use the "imperfect market" argument as a shield against the "deadweight loss" charge, but it is not the engine of their support. This hypothesis explains the *language* of the debate, not the *substance*.

  **Hypothesis 2: Different Markets / Supply Elasticity (Load-Bearing)**
  This is the primary load-bearing empirical claim. The dispute genuinely turns on the elasticity of supply, but specifically on the *time horizon* and *geographic scope* assigned to it.
  *   **The Critic's View:** Supply is elastic at the metropolitan scale over a 10-year horizon. Capital is mobile. If returns are capped, capital exits or never enters. The relevant market is the region.
  *   **The Defender's View:** Supply is inelastic at the neighborhood scale over a 4-year political cycle. Zoning prevents new construction regardless of price. Therefore, the landlord has local monopsony/monopoly power. The relevant market is the building.
  *   **The Conflict:** Neither side specifies the parameter. If supply is perfectly inelastic (short run, hyper-local), rent control is a pure transfer with minimal efficiency loss. If supply is elastic (long run, metro), it creates scarcity. The debate persists because both statements are true simultaneously, and policy operates on the short-run political cycle while the costs accrue in the long-run economic horizon.

  **Hypothesis 3: Verbal Conflation of Affordability (Load-Bearing)**
  This is equally load-bearing, but political rather than empirical. The word "Affordability" collapses **Price** (the monthly cash outflow) and **Access** (the right to occupy).
  *   Rent control is highly effective at stabilizing *Price* for incumbents.
  *   Rent control is often ineffective or harmful regarding *Access* for newcomers (due to reduced mobility and supply).
  *   By using one word for both, defenders can point to successful price stabilization for current voters to justify a policy that restricts access for non-voters (future residents). This conflation allows the policy to be defended on grounds of security while being evaluated by critics on grounds of allocation.

  ### 2. The Minimum Wage Asymmetry

  The asymmetry between rent control and the minimum wage is not a fact of theory; formally, they are mirror images. The divergence arises from three structural differences:

  **A. Incidence of the Cost (The Political Economy)**
  *   **Minimum Wage:** The costs are diffuse (slightly higher prices for consumers, slightly lower returns for shareholders) and the benefits are concentrated on low-wage workers. The transfer is generally perceived as progressive (from capital/consumers to labor).
  *   **Rent Control:** The costs are concentrated on a specific, vulnerable group (future tenants, who are often poorer and more transient than current tenants) and landlords. The benefits are concentrated on current tenants, who are often wealthier and more established than the pool of potential renters. The transfer is often regressive or arbitrary. Economists oppose rent control more unanimously because the incidence is visibly less equitable than the minimum wage.

  **B. The Nature of the Asset (Moral Intuition)**
  *   **Labor:** There is a bedrock intuition that labor is not a commodity; the seller of labor is a human being whose subsistence is tied to the sale. Interfering in the price of labor is seen as protecting human dignity.
  *   **Housing:** Housing is dual-use: it is consumption (shelter) for the tenant but an asset (investment) for the landlord. Interfering in the price of housing is seen as confiscating property rights. The minimum wage debate is framed as "workers vs. bosses"; the rent control debate is framed as "tenants vs. investors." The latter triggers stronger property-rights norms in the profession.

  **C. Measurability and Lag**
  *   **Labor:** Employment data is high-frequency and national. If a minimum wage kills jobs, it shows up in quarterly surveys. The feedback loop is tight.
  *   **Housing:** Supply response is lumpy and slow. A rent control ordinance passed today reduces construction starts that won't be visible for three years and won't affect total stock for five. The costs are invisible to the electorate that passed the measure. This allows the rent control argument to persist empirically because the negative evidence is always "just around the corner."

  ### 3. What Counts as Progress

  To move beyond the current stalemate, the debate must shift from "Is rent control good?" to "Which component of rent control solves which problem?" Progress requires unbundling the policy instruments.

  **A. Unbundling Security from Subsidy**
  *   **The Test:** Implement "Just Cause" eviction protections (tenure security) combined with market-rate rents, alongside housing vouchers (price subsidy) for those who need them, without rent caps.
  *   **What it would show:** If tenants remain stable without rent caps, then the "security" argument for price controls is weakened. If landlords find ways to evade Just Cause laws without price caps, it suggests enforcement is the bottleneck, not price.
  *   **What it would not show:** It would not solve the supply elasticity problem, but it would isolate whether the "hold-up problem" is real independent of price setting.

  **B. Elasticity at the Zoning Margin**
  *   **The Test:** A supply-elasticity estimate specifically for jurisdictions where zoning is binding vs. non-binding.
  *   **Why:** If supply is inelastic *only* because of zoning, then rent control in a zoned city is a second-best response to a regulatory failure. If supply is inelastic *even when zoning allows*, then physical or financial constraints are the bottleneck.
  *   **Progress:** Acknowledging that rent control is a tax on housing to subsidize incumbents, and asking if that is the optimal tax base compared to a land-value tax or direct subsidy.

  **C. Formal Second-Best Modeling**
  *   **The Test:** A model that treats zoning restrictions as a fixed constraint and optimizes for tenant welfare within that constraint.
  *   **Progress:** This would force economists to admit where rent control might be welfare-enhancing *given* zoning (e.g., preventing monopoly extraction in a supply-constrained market). It would force defenders to admit that rent control is a second-best substitute for upzoning, not a primary good.

  ### 4. Bedrock and The Verbal Collapse

  **The Bedrock**
  There is a normative floor that evidence cannot pierce. It is the question: **Is the landlord's return on investment a legitimate claim on social surplus, or is it rent-seeking?**
  *   If housing is a commodity like any other, the landlord's return is the price of providing a service (maintenance, risk-bearing). Capping it distorts the service.
  *   If housing is a social right, the landlord's return is a toll on a necessity. Capping it is a moral imperative.
  No amount of elasticity data settles this. This bedrock explains about 40% of the argument's heat.

  **The Verbal Collapse**
  The word doing the work is **"Affordability."**
  It collapses two distinct questions:
  1.  **Static:** Can the household pay the monthly rent? (Solved by price caps or vouchers).
  2.  **Dynamic:** Can the household remain in the community without being priced out by market appreciation? (Solved by tenure security or supply expansion).
  Rent control claims to solve both. It solves #2 for incumbents by solving #1 for them, but it worsens #1 for newcomers by worsening #2 for the city (supply constraint). The argument persists because defenders answer question #2 (security) while critics answer question #1 (allocation), using the same noun.

  ### 5. Prediction: The Argument in Fifteen Years

  **Yes, you will be having the identical argument.**

  **Why:**
  1.  **Political Incentives:** The beneficiaries of rent control (current tenants) vote in local elections. The losers (future tenants) do not yet live there. The political economy rewards the ambiguity that allows incumbents to secure tenure at the expense of outsiders.
  2.  **The Lag Problem:** Because the supply response takes longer than the election cycle, no mayor will be punished for the housing shortage caused by their rent control ordinance. The feedback loop is broken.
  3.  **The Bedrock Remains:** The normative disagreement over property rights vs. housing security is not resolvable by data. As long as housing is both an asset class and a human necessity, this tension will generate the same heat.
  4.  **Failure to Unbundle:** Policy will likely continue to bundle security and subsidy because unbundling them (e.g., vouchers + just cause) is fiscally expensive (requires tax revenue) whereas rent control is fiscally cheap (transfers private wealth). Cities will choose the cheap instrument and defend it with the expensive rationale.

  The argument will only change if the definition of "Affordability" is legally or statistically separated into "Price Stability" and "Tenure Security," or if the supply elasticity becomes so visibly constrained that the cost of rent control becomes immediate and undeniable to the incumbent voters themselves. Until then, the shape will hold.
