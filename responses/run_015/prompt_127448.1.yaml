prompt: |-
  I direct the documentation and public-statements unit at an international human-rights organisation, and I want a written decision procedure my team can actually run when we have to decide whether to call something genocide — or to use one of the weaker formulations we fall back on. The question arises fifteen to twenty times a year, always under time pressure: we have a twenty-four to forty-eight hour window, two junior researchers with field training but no legal qualifications, a legal adviser who is part-time and seven time zones away, and a rule that every characterisation must be signed off by the executive director before publication. Our statements then have a long afterlife: they are read into UN proceedings, quoted in donor capitals, amplified by diaspora organisations lobbying their own governments, and translated for local partners. We also have a hard internal rule against walking a characterisation back once it is published, and we were publicly accused last year of applying the standard faster in one country than in another, so cross-regional consistency is a live constraint, not a nicety.

  What I need is the conceptual structure turned into a test, not a summary of the law and not a literature review. The structure I have in mind is: the treaty definition with its four protected groups; the requirement that the group be targeted as such rather than incidentally; the unresolved question of how large or how significant a part of a group has to be; and the gap between that definition and the broader phenomenon Lemkin meant to name, a coordinated assault on a group's political, social and cultural continuity as well as its biological survival, of which the destruction of political groups and of culture were proposed and then dropped. I want a procedure with the questions in a fixed order, a specification of what counts as sufficient evidence at each step (including what to do when the relevant evidence simply does not exist, as opposed to being contradicted), the points at which the procedure terminates with a no, and the points at which it must hand the question to a person because it is a values conflict rather than a factual gap. Please have it operate on a graded vocabulary rather than a binary yes-or-no — something like a ladder running through crimes against humanity, genocidal acts, a genocidal campaign, and genocide, with a qualified or provisional register for cases where the evidence is directional but thin. One further thing I want built in: a fork between naming now and naming later, with explicit triggers for revisiting a case and a requirement that the reasoning be recorded in a one-page attribution memo that a successor can audit. Please define, as part of the procedure, four terms I intend to use internally: attribution debt, meaning the credibility we spend by naming early and that is charged against us in every later statement; downstream capture, meaning the fact that once we use the word, states, courts, funders and the perpetrators' own propagandists will use it for ends we neither intend nor control; the asymmetry of the two errors, meaning that the cost of under-naming falls on the victims of today while the cost of over-naming falls on future victims and on our own future credibility, and these are not the same people; and the residual case, meaning a campaign that falls inside Lemkin's sense but outside the treaty's.

  Then run it on three stylised cases. First: a campaign against a small linguistic minority in which the death toll is in the low hundreds, but the language is banned from schools and courts, the archives and religious sites are destroyed, and the community's civic and religious leadership is killed or exiled — I expect this one comes back as a no on genocide, and I will tell you in advance that I want to say yes, so I want to see exactly where the procedure forces my hand and what the strongest available formulation is instead. Second: roughly five thousand dead over four months, selected by ethnicity in a mixed province, with no seized operational orders and no speeches by political leaders, only the pattern of killing, slurs recorded on video by soldiers, and a government account of counter-insurgency — give me what the procedure says and, crucially, what specific piece of evidence would move it up a rung. Third: a later phase of a campaign for which a UN-mandated commission of inquiry has already used the word for an earlier phase, in which the current phase kills far fewer people but involves systematic removal of children and the calculated destruction of the water and food infrastructure the group depends on — tell me whether we may inherit someone else's finding or must re-derive it, and what an independent check looks like under a forty-eight hour deadline. Finally, be explicit about what this procedure cannot do: I am particularly interested in whether it can settle the question of whether the word ought to be reserved as a legal term of art at all, how it should handle the competitive-victimhood dynamics where advocates for another group demand symmetrical language, and what it should say when donors or host governments lean on us in either direction.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**

      *   **User Role:** Director of Documentation and Public-Statements Unit at an International Human Rights Organisation (IHRO).
      *   **Task:** Create a written decision procedure (test) for determining whether to use the term "genocide" or weaker formulations.
      *   **Constraints:**
          *   Time pressure (24-48 hours).
          *   Staffing (2 junior researchers, 1 part-time remote legal adviser, Executive Director sign-off).
          *   High stakes (UN proceedings, donor capitals, diaspora lobbying, local partners).
          *   Hard rule: No walking back characterizations once published.
          *   Constraint: Cross-regional consistency (accusations of bias last year).
          *   Output: Conceptual structure turned into a test (not legal summary/lit review).
          *   Structure: Treaty definition (4 groups), targeted "as such", quantitative/qualitative threshold ("substantial part"), gap between treaty and Lemkin's broader vision (cultural/political destruction).
          *   Format: Fixed order questions, evidence sufficiency specs, termination points ("no"), escalation points (values conflict), graded vocabulary (ladder: Crimes Against Humanity -> Genocidal Acts -> Genocidal Campaign -> Genocide), provisional register.
          *   Feature: Fork between naming now/later, triggers for revisiting, one-page attribution memo requirement.
          *   Definitions to include: Attribution Debt, Downstream Capture, Asymmetry of the Two Errors, Residual Case.
          *   Application: Run on three stylized cases (Cultural destruction/low death; Ethnic killing/pattern evidence; Post-UN finding/infrastructure destruction).
          *   Limitations: Explicitly state what the procedure *cannot* do (legal term of art debate, competitive victimhood, donor/government pressure).

  2.  **Deconstruct the Core Tension:**

      *   *Legal vs. Moral/Sociological:* The 1948 Convention definition is narrow (intent to destroy in whole or in part, national/ethnical/racial/religious groups). Lemkin's original concept was broader (cultural, political). The user wants to acknowledge this gap without violating legal accuracy.
      *   *Speed vs. Accuracy:* 48 hours vs. "no walking back."
      *   *Consistency:* Must apply the same standard across different geographies to avoid bias accusations.
      *   *Graded Vocabulary:* Avoid binary yes/no. Use a ladder to communicate severity without triggering the legal threshold prematurely.

  3.  **Drafting the Procedure (The "Genocide Characterization Protocol" - GCP):**

      *   *Phase 1: Triage & Definitions.* Define the internal terms immediately.
      *   *Phase 2: The Ladder.* Establish the vocabulary hierarchy.
      *   *Phase 3: The Decision Tree.* Step-by-step questions.
          *   Step 1: Protected Group? (Treaty check).
          *   Step 2: Protected Acts? (Killing, harm, conditions, birth prevention, child transfer).
          *   Step 3: Intent ("As Such" & "Destroy"). This is the hardest part. Need indicators of specific intent (*dolus specialis*).
          *   Step 4: Substantiality. Qualitative vs. Quantitative.
      *   *Phase 4: The Fork (Now vs. Later).* When to wait.
      *   *Phase 5: Documentation.* The Attribution Memo.
      *   *Phase 6: Limitations.* What this tool doesn't solve.

  4.  **Refining the "Graded Vocabulary":**

      *   Level 1: Crimes Against Humanity / War Crimes (Baseline).
      *   Level 2: Genocidal Acts (Acts listed in Art. II present, intent unclear).
      *   Level 3: Genocidal Campaign / Pattern (Systematic, targeted, strong indicators of intent but legal threshold not fully met or evidence thin).
      *   Level 4: Genocide (Legal threshold met).
      *   *Provisional Register:* "Reasonable grounds to believe" vs. "Convincing evidence."

  5.  **Addressing the Specific Definitions:**

      *   *Attribution Debt:* Credibility cost.
      *   *Downstream Capture:* Loss of control over the term.
      *   *Asymmetry of Errors:* Under-naming (victim cost) vs. Over-naming (credibility/future victim cost).
      *   *Residual Case:* Lemkin's vision vs. Treaty law.

  6.  **Developing the Three Cases:**

      *   *Case 1 (Cultural/low death):* Treaty says No (political/cultural groups excluded, low death toll). User wants to say Yes. *Solution:* Use "Residual Case" logic. Classify as "Cultural Erasure" or "Genocidal Policy (Non-Treaty)" but explicitly state it doesn't meet the 1948 legal threshold. This highlights the tension.
      *   *Case 2 (5k dead/ethnic/pattern):* Strong pattern, no smoking gun. Likely Level 3 (Genocidal Campaign). *Move up:* Need direct evidence of intent (orders, speeches, policy docs).
      *   *Case 3 (Post-UN/infrastructure/kids):* Can we inherit? No, must verify current conditions. But UN finding lowers the bar for *context*. Focus on Article II (c) and (e). Likely Level 4 if UN finding is robust and conditions persist.

  7.  **Addressing the Limitations:**

      *   Legal term of art debate: The procedure assumes the Treaty is the binding standard for the word "Genocide" in public statements to maintain legal utility.
      *   Competitive Victimhood: The procedure is case-specific, not comparative.
      *   Pressure: The procedure creates a "shield" against external pressure by enforcing internal consistency.

  8.  **Review and Refine (Self-Correction during drafting):**

      *   *Critique:* Is the procedure too legalistic for junior researchers?
      *   *Fix:* Add specific "Evidence Sufficiency" markers for each step (e.g., "Direct" vs. "Inferential").
      *   *Critique:* Did I include the "Attribution Memo"?
      *   *Fix:* Make it a mandatory annex.
      *   *Critique:* Did I address the "User wants to say Yes" on Case 1?
      *   *Fix:* The procedure must force a "No" on *Legal Genocide* but allow a "Yes" on *Residual Case* with specific labeling. This respects the user's desire while maintaining legal integrity.
      *   *Critique:* Time pressure.
      *   *Fix:* Ensure the "Stop" points are clear so they don't waste time on open-and-shut negatives.

  9.  **Final Polish:**

      *   Tone: Professional, operational, directive.
      *   Structure: Clear headings, bullet points, decision trees.
      *   Ensure all specific constraints (24-48 hours, 7 time zones, etc.) are acknowledged in the workflow.

  10. **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  # GENOCIDE CHARACTERIZATION PROTOCOL (GCP)
  **Version 1.0 | Internal Use Only | Documentation & Public-Statements Unit**

  ## 1. PURPOSE AND SCOPE
  This procedure governs the use of the term "genocide" and related formulations in public statements, reports, and briefings. It is designed for operation within a **48-hour window** by non-legal staff, with remote legal oversight. It prioritizes cross-regional consistency and auditability over speed alone.

  **Core Constraint:** Once published, a characterization is irreversible. The cost of error is asymmetrical.

  ## 2. INTERNAL DEFINITIONS
  *Staff must internalize these concepts before applying the Decision Tree.*

  1.  **Attribution Debt:** The credibility capital spent by naming a situation "genocide" early. This debt is charged against all future statements regarding that situation. If the legal characterization fails later, the debt defaults, damaging the organisation's standing on other issues.
  2.  **Downstream Capture:** The recognition that once the organisation uses the term, states, courts, funders, and perpetrator propagandists will appropriate it for ends we do not control (e.g., justifying military intervention, deflecting from other crimes, or dismissing the claim as hyperbole).
  3.  **Asymmetry of the Two Errors:**
      *   *Error Type A (Under-naming):* The cost falls on current victims (loss of mobilization, protection, and historical recognition).
      *   *Error Type B (Over-naming):* The cost falls on future victims (cry-wolf effect) and the organisation's future credibility.
      *   *Protocol Stance:* In the absence of clear evidence, default to avoiding Error Type B to preserve the utility of the term for future cases, unless the risk to current victims is immediate and existential.
  4.  **The Residual Case:** A campaign that fits Raphael Lemkin's original sociological conception (destruction of political, social, and cultural continuity) but falls outside the 1948 UN Convention legal definition (which excludes political groups and cultural destruction as standalone grounds).

  ## 3. THE VOCABULARY LADDER
  *Statements must use the lowest rung that accurately describes the evidence. Do not skip rungs.*

  *   **Rung 1: Atrocity Crimes / Crimes Against Humanity.** (Baseline for systematic attack on civilians).
  *   **Rung 2: Genocidal Acts.** (Acts listed in Art. II of the Convention are occurring, but specific intent to destroy the group *as such* is not yet established).
  *   **Rung 3: Genocidal Campaign.** (Systematic pattern of Genocidal Acts with strong inferential evidence of intent, but lacking the "smoking gun" or judicial confirmation required for Rung 4).
  *   **Rung 4: Genocide.** (Legal threshold met: Protected Group + Protected Acts + Specific Intent + Substantial Part).
  *   **Provisional Register:** Any of the above may be prefixed with *"Reasonable grounds to believe..."* (based on pattern) or *"Convincing evidence indicates..."* (based on direct evidence).

  ## 4. THE DECISION TREE (48-HOUR WINDOW)
  *Junior Researchers execute Steps 1-3. Legal Adviser reviews Step 4. Executive Director approves Step 5.*

  ### STEP 1: THE GROUP FILTER (Hour 0-6)
  **Question:** Is the targeted group National, Ethnical, Racial, or Religious?
  *   **Evidence Required:** Self-identification, external identification, census data, or perpetrator identification of the group.
  *   **If NO (e.g., Political, Social, Cultural, Linguistic only):**
      *   **TERMINATE.** You cannot legally characterize this as Genocide (Rung 4).
      *   **Action:** Check for **Residual Case**. If cultural/political destruction is evident, draft statement using Rung 1 or 2, explicitly noting "Cultural Erasure" or "Destruction of Group Continuity" in the text, but *do not* use the noun "Genocide" as the headline characterization.
      *   **Memo Note:** Cite "Treaty Definition Limitation."
  *   **If YES:** Proceed to Step 2.

  ### STEP 2: THE ACTS FILTER (Hour 6-18)
  **Question:** Are one or more of the five Article II acts occurring?
  1.  Killing members.
  2.  Causing serious bodily/mental harm.
  3.  Inflicting conditions of life calculated to bring about physical destruction.
  4.  Imposing measures to prevent births.
  5.  Forcibly transferring children.
  *   **Evidence Required:** Verified incident reports, medical records, satellite imagery, witness testimony.
  *   **If NO:** **TERMINATE.** Use Rung 1 (Persecution/Discrimination).
  *   **If YES:** Proceed to Step 3.

  ### STEP 3: THE INTENT & SUBSTANTIALITY FILTER (Hour 18-36)
  **Question A (Intent):** Is there evidence the group is targeted *as such* with intent to destroy?
  *   **Direct Evidence (High Sufficiency):** Operational orders, speeches by leadership, policy documents explicitly stating destruction.
  *   **Inferential Evidence (Medium Sufficiency):** Systematic pattern excluding other groups, slurs/dehumanization recorded on site, targeting of leadership specifically to prevent regeneration, refusal of humanitarian aid specifically to the group.
  *   **Insufficient Evidence:** General chaos of war, collateral damage, counter-insurgency claims without proof of discriminatory targeting.

  **Question B (Substantiality):** Is the part targeted "substantial"?
  *   **Quantitative:** Numeric significance relative to the total group.
  *   **Qualitative:** Targeting leadership, specific geographic stronghold, or a segment essential to group survival (e.g., women of childbearing age).
  *   **Rule:** If the absolute number is low (e.g., hundreds), the *Qualitative* impact must be high (e.g., elimination of all religious leaders) to proceed.

  *   **If Intent is Unclear OR Substantiality is Marginal:**
      *   **Classification:** Rung 2 (Genocidal Acts) or Rung 3 (Genocidal Campaign).
      *   **Action:** Draft statement using "Genocidal Acts" language.
  *   **If Intent is Clear AND Substantiality is Met:**
      *   **Classification:** Potential Rung 4 (Genocide).
      *   **Action:** Escalate to Legal Adviser for Step 4.

  ### STEP 4: THE CONSISTENCY & DEBT CHECK (Hour 36-42)
  *Executed by Legal Adviser (Remote)*
  1.  **Cross-Regional Audit:** Has the organisation used Rung 4 in a factually similar case in a different region in the last 5 years? If yes, is the evidentiary standard here equal or higher? If lower, **DOWNGRADE** to Rung 3 to preserve consistency.
  2.  **Attribution Debt Assessment:** If we name this Genocide and a court later disagrees, can the organisation absorb the credibility hit?
  3.  **Downstream Capture Risk:** Is there a high risk that this characterization will be used to justify military intervention we do not support? If yes, add explicit caveats to the statement regarding "Protection, not Intervention."

  ### STEP 5: THE FORK (NOW VS. LATER) (Hour 42-48)
  *Executed by Executive Director*
  *   **Name Now:** If evidence is Direct (Step 3A) AND risk to victims is immediate (naming triggers protection).
  *   **Name Later:** If evidence is Inferential only.
      *   **Trigger for Revisit:** Set a calendar alert for 90 days.
      *   **Condition:** If death toll doubles, or if a UN Commission of Inquiry releases findings, or if internal documents leak.
      *   **Requirement:** If choosing "Later," the public statement must use Rung 3 ("Genocidal Campaign") and state: *"We are monitoring for evidence of specific intent required for legal determination."*

  ## 5. DOCUMENTATION: THE ATTRIBUTION MEMO
  *One page max. Must be filed with the statement draft. Auditable by successors.*

  1.  **Case ID:** [Region/Conflict/Date]
  2.  **Selected Rung:** [1-4]
  3.  **Key Evidence:** [List top 3 pieces of evidence supporting the rung]
  4.  **Missing Evidence:** [What would be needed to move up a rung?]
  5.  **Precedent Check:** [Cite one previous case where we did/did not use this term and explain consistency]
  6.  **Debt Acknowledgement:** [Sign-off: "We acknowledge the Attribution Debt and accept the risk of Downstream Capture."]
  7.  **Signatures:** Junior Researcher, Legal Adviser, Exec Director.

  ***

  # APPLICATION TO STYLISED CASES

  ## CASE 1: The Cultural Erasure (Linguistic Minority)
  **Facts:** Low hundreds dead. Language banned in schools/courts. Archives/religious sites destroyed. Civic/religious leadership killed/exiled.
  **Procedure Run:**
  *   **Step 1 (Group):** Linguistic/Cultural. *Not* explicitly National/Ethnical/Racial/Religious in the treaty sense unless tied to ethnicity. **STOP on Rung 4.**
  *   **Step 2 (Acts):** Killing (Yes), Mental Harm (Yes). But "Cultural Destruction" is not an Article II act.
  *   **Step 3 (Intent):** Intent to destroy *culture* is clear. Intent to destroy *people* is weak (low death toll).
  *   **Step 4 (Consistency):** Naming this Genocide would violate Treaty Definition.
  **Outcome:**
  *   **Rung:** **Rung 1 (Crimes Against Humanity - Persecution)** with **Residual Case** language.
  *   **Statement Formulation:** "While the legal threshold for genocide is not met due to the exclusion of cultural groups from the 1948 Convention, the campaign constitutes a **Residual Case** of group destruction. We characterize this as **Systematic Cultural Erasure and Persecution**."
  *   **Constraint Check:** You wanted to say "Yes." The procedure forces a "No" on the legal term to protect the organisation from accusations of legal ignorance.
  *   **Workaround:** You may use the adjective "genocidal" in quotes or context (e.g., "policies with genocidal effects on culture") *only if* the Attribution Memo explicitly flags this as a **Residual Case** deviation from strict legal terminology, accepted by the Exec Director to highlight the Treaty gap.
  *   **Memo Note:** "Classification limited by Treaty Article II. Highlighting Lemkinian gap."

  ## CASE 2: The Pattern Killing (Mixed Province)
  **Facts:** 5,000 dead (4 months). Selected by ethnicity. No orders/speeches. Pattern + Slurs on video + Govt Counter-insurgency claim.
  **Procedure Run:**
  *   **Step 1 (Group):** Ethnical. **Pass.**
  *   **Step 2 (Acts):** Killing. **Pass.**
  *   **Step 3 (Intent):** No Direct Evidence. Inferential Evidence is strong (Pattern + Slurs + Selectivity). Substantiality is met (5,000 is significant in context).
  *   **Step 4 (Consistency):** Consistent with prior "Pattern-based" findings.
  **Outcome:**
  *   **Rung:** **Rung 3 (Genocidal Campaign).**
  *   **Statement Formulation:** "There are reasonable grounds to believe a **Genocidal Campaign** is underway. The pattern of killing, combined with dehumanizing rhetoric, indicates intent to destroy the group in part."
  *   **Evidence to Move Up a Rung (to Rung 4):** You need **Direct Evidence of Specific Intent**.
      *   *Specific Piece:* A seized internal memo from the Ministry of Defense ordering "sterilization" or "total clearance" of the ethnic group, OR a public speech by the Head of State explicitly linking the ethnicity to an existential threat requiring elimination (not just security neutralization).
      *   *Why:* Slurs and patterns allow for the "counter-insurgency" defense. Direct orders remove the plausible deniability required to defeat *dolus specialis*.

  ## CASE 3: The Inherited Finding (Infrastructure & Children)
  **Facts:** Later phase of campaign. UN Commission already found Genocide in Phase 1. Phase 2: Fewer deaths, systematic child removal, destruction of water/food infrastructure.
  **Procedure Run:**
  *   **Step 1 (Inheritance):** **NO.** You cannot inherit a legal characterization. You must re-derive it for *your* statement. However, the UN finding counts as **High-Sufficiency Contextual Evidence** for Intent.
  *   **Step 2 (Acts):** Child Transfer (Art II e) + Conditions of Life (Art II c). **Pass.**
  *   **Step 3 (Intent):** The UN finding establishes the *campaign's* intent. The continuation of specific acts (children/infrastructure) in Phase 2 implies the intent persists.
  *   **Step 4 (Time Pressure):** 48 hours is sufficient to verify the *acts* (satellite on water, witness on children). The *intent* is bolstered by the UN report.
  **Outcome:**
  *   **Rung:** **Rung 4 (Genocide).**
  *   **Independent Check:** Under 48 hours, you do not re-investigate Phase 1. You verify:
      1.  Are the *same* perpetrators active?
      2.  Are the *same* victims targeted?
      3.  Do the Phase 2 acts (children/infrastructure) logically continue the Phase 1 destruction?
  *   **Statement Formulation:** "Building on the findings of the UN Commission regarding the initial phase, our documentation confirms the continuation of genocidal acts through the systematic transfer of children and destruction of life-sustaining infrastructure. We characterize this as **Genocide**."
  *   **Memo Note:** "Reliance on UN CoI for baseline intent; independent verification of ongoing acts."

  ***

  # 6. LIMITATIONS: WHAT THIS PROCEDURE CANNOT DO

  **1. The "Legal Term of Art" Debate**
  This procedure assumes the 1948 Convention definition is the binding standard for the word "Genocide" in public advocacy. It *cannot* settle the academic or moral debate over whether the word *ought* to be reserved for legal use. It treats the legal definition as a pragmatic constraint to prevent Downstream Capture. If the team wishes to advocate for expanding the definition, that must be done in policy papers, not situational characterizations.

  **2. Competitive Victimhood**
  This procedure is **case-specific**, not **comparative**. It cannot adjudicate claims that "Group A suffered more than Group B." If advocates for Group B demand symmetrical language because Group A was named, the procedure dictates: "Apply the test to Group B." If Group B fails Step 1 or 3, the answer is No, regardless of Group A's status. The Attribution Memo must record this to shield staff from accusations of bias.

  **3. External Pressure (Donors/Host Governments)**
  This procedure creates a **procedural shield**. When donors or governments lean on the team to name (or not name) a situation, the response is: "We are bound by an internal audit protocol requiring specific evidentiary thresholds."
  *   **Cannot Do:** It cannot prevent a donor from cutting funding in retaliation.
  *   **Can Do:** It prevents the *team* from capitulating to pressure without a recorded violation of protocol. Any deviation from the procedure due to external pressure must be recorded in the Attribution Memo as "External Constraint," signed by the Executive Director. This places the liability on leadership, protecting the researchers.

  **4. The "Fog of War"**
  This procedure cannot generate evidence that does not exist. In cases where access is denied and evidence is purely remote (satellite only), the procedure will default to **Rung 2 (Genocidal Acts)** or **Rung 3 (Genocidal Campaign)**. It forces the team to admit uncertainty rather than speculate. This is a feature, not a bug: it preserves Attribution Debt.
