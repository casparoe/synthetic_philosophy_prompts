          2.  Materials.
          3.  Phase 1 (Individual).
          4.  Phase 2 (Committee).
          5.  Payoff/Scoring.
          6.  Debrief (The Mapping).
          7.  Troubleshooting.
          8.  Limitations.

      *(Self-Correction during drafting)*: Make sure Phase 1 clearly distinguishes between Lying and Mooreing.
      *   Condition A: "P" (where P is false). -> Lying.
      *   Condition B: "P" (where P is true). -> Truth.
      *   Condition C: "P and I don't believe P" (where P is true). -> Moore.
      *   Students need to know P is true in all cases to isolate the belief component.
      *   *Fix:* I (Tutor) establish a fact publicly. "I have a red pen in my hand." (Show it).
