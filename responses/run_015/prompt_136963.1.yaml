      *   *Scenario B:* All agree P. Spokesperson says "P, but I (personally) don't believe it." (Weird).
      *   *Scenario C:* Advisors agree P, Spokesperson doubts. Spokesperson says "P, but I don't believe it." (Moore).
      *   *Scenario D:* Advisors agree P, Spokesperson doubts. Spokesperson says "P, but *we* don't believe it." (Is this weird? If 'we' means the committee, and the committee's position is P, then saying 'we don't believe' undermines the assertion. But if 'we' means 'the members individually', it might be true.)
      *   *Better Twist:* The "Dissenting Minority".
      *   Group of 3. 2 believe P. 1 believes Not-P.
      *   They must issue a joint statement.
      *   If they say "P", the dissenter feels misrepresented.
      *   If they say "P, but we don't all believe P", it's honest.
      *   If they say "P, but I (spokesperson) don't believe P", it's Moorean for the speaker, but accurate for the group dynamic.
      *   *Key Insight:* Moore's paradox vanishes when the subject changes from "I" to "He/They". Does it vanish when "I" becomes "We"?
