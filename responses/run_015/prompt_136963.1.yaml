      *   *Fix:* Make saying Script C the *only* way to get a specific bonus, forcing them to overcome the reluctance.
      *   *Better:* Don't force the paradox yet. Let them discover the norm of assertion.
      *   *Revised Phase 1:* **"The Assertion Auction"**.
