answer: |-
  This is a classic problem in observational health data. You are fighting Simpson's Paradox, but you are also fighting *causal ambiguity* and *incentive misalignment*. Your tech friend is wrong because in A/B testing, assignment is random and $N$ is infinite. In your world, assignment is biased (surgeons pick cases) and $N$ is tiny.

  Below is a draft Standard Operating Procedure (SOP). It is designed to be printed, signed off by your team lead/statistician, and waved at the Department Chair when they accuse you of cherry-picking. It explicitly separates **statistical validity** (can we calculate this?) from **decision relevance** (does this answer the question?).

  ---

  # SOP: Quarterly Comparative Reporting & Stratification Protocol
  **Version:** 1.0 | **Owner:** Analytics Team | **Time Budget:** 4 Hours/Report

  ## Purpose
  To prevent ad-hoc arguments regarding aggregate vs. stratified data during quarterly reviews. This procedure determines *before the meeting* which numbers are valid to report and which question those numbers actually answer.

  ## The Decision Tree
  *Run these checks in order. If any check results in a STOP, do not produce the stratified table.*

  ### 1. The Timeline Check (Causal Validity)
  **Question:** Was the variable we want to cut by (e.g., severity, age, ICU admission) known or determined *before* the treatment/protocol started?
  *   **Yes:** Proceed to Check 2.
  *   **No (It happened after/during):** **STOP.** Do not stratify by this variable.
      *   *Reasoning:* Cutting by outcomes (ICU, Step-Down, Length of Stay) creates "collider bias." It makes the treatment look better or worse by artificially filtering patients based on how the treatment affected them.
      *   *Action:* Report the Aggregate only. Note in the footer: *"Stratification by [Variable] omitted because it is influenced by the treatment."*

  ### 2. The Consistency Check (Measurement Validity)
  **Question:** Is the stratification variable measured identically across the groups being compared (e.g., do both sites score severity the same way)?
  *   **Yes:** Proceed to Check 3.
  *   **No (Subjective or Site-Specific):** **STOP.** Do not stratify by this variable.
      *   *Reasoning:* If Site A calls a patient "Severe" and Site B calls the same patient "Moderate," the comparison is noise, not signal.
      *   *Action:* Report Aggregate only. Add a "Data Quality Warning" to the slide.

  ### 3. The Stability Check (Sample Size)
  **Question:** Does every stratum (sub-group) contain at least 30 events (or 50 patients, whichever your statistician prefers)?
  *   **Yes:** Proceed to Check 4.
  *   **No:** **STOP.** Do not report the stratified numbers as fact.
      *   *Reasoning:* Small strata reversals are usually random noise, not real effects.
      *   *Action:* Report Aggregate. You may show the stratified plot as "Exploratory/Unstable" but do not draw conclusions from it.

  ### 4. The Decision Context Check (Values & Policy)
  **Question:** If the data shows a reversal (Aggregate says A, Stratified says B), what decision are we actually making?
  *   **Option A: "Which protocol should we adopt system-wide?"** $\rightarrow$ Report **Aggregate**.
      *   *Why:* This reflects the reality of patient flow and current referral patterns. It answers "What happens if we do nothing different?"
  *   **Option B: "Which technique is biologically superior?"** $\rightarrow$ Report **Stratified** (Weighted).
      *   *Why:* This adjusts for case-mix. It answers "If we could assign patients randomly, which wins?"
  *   **Option C: "Should we route specific patients to specific treatments?"** $\rightarrow$ Report **Stratified**.
      *   *Why:* This acknowledges that Treatment A is for Mild, Treatment B is for Severe.
  *   **Unclear/Disputed:** **PAUSE.** Escalate to the Committee Chair *before* the meeting. Do not bring the data until they define the question.

  ---

  ## Why This Works (The "Cheat Sheet" for Clinicians)
  *Keep this page in your back pocket for the meeting.*

  1.  **Why not always segment? (The Tech Friend Counter-Argument)**
      *   In tech, users are randomized. In hospitals, surgeons choose patients. If we segment by Severity, but Surgeon A takes all the severe cases, segmenting hides the fact that Surgeon A is doing the harder work. Aggregate captures the *system* burden; Stratified captures the *technique* efficacy. We need to know which one we are buying.
  2.  **Why not cut by Post-Treatment variables (ICU, Step-Down)?**
      *   Imagine testing a seatbelt. If you only compare survival rates for people who *ended up in the ICU*, you might find seatbelts look dangerous (because only bad crashes put you in the ICU with a seatbelt on). The ICU status is caused by the crash *and* the seatbelt. Cutting by it breaks the math.
  3.  **Why the Sample Size Limit?**
      *   With 9 patients in a bin, a single extra readmission flips the percentage by 10%. That is luck, not quality.

  ---

  ## Case Study Runs
  *Here is how the procedure handles your three specific headaches.*

  ### Case 1: The Classic Reversal (Surgical Techniques)
  **Scenario:** Technique A has 5% complications overall. Technique B has 8% overall. However, within "Mild" cases, B is better (3% vs 4%). Within "Severe" cases, B is better (10% vs 12%). 80% of Severe cases went to Technique B.
  **Variable:** Severity Score.

  **Run the Protocol:**
  1.  **Timeline:** Severity is assessed *pre-op*. **PASS.**
  2.  **Consistency:** Same surgeons score severity using the same scale. **PASS.**
  3.  **Stability:** Mild ($N=200$), Severe ($N=150$). **PASS.**
  4.  **Decision Context:** The Committee is arguing.
      *   *Surgeon using B says:* "Look at the stratified! My technique is biologically better." (Question: Efficacy)
      *   *Admin says:* "Look at the aggregate! Your technique has higher complications in our hospital." (Question: System Performance)

  **Output/Recommendation:**
  *   **Do not choose one table.** Report **Both**, but label them differently.
  *   **Table 1 (Effectiveness):** "Overall Complication Rates." (Shows B is worse). *Caption: Reflects current patient assignment patterns.*
  *   **Table 2 (Efficacy):** "Complication Rates Adjusted for Severity." (Shows B is better). *Caption: Reflects biological performance if case-mix were equal.*
  *   **The Human Call:** The Committee must decide: Are we evaluating the *surgeon's skill* (use Stratified) or the *hospital's risk* (use Aggregate)? The procedure forces them to say which one they care about before they criticize the number.

  ### Case 2: The Measurement Bias (Site Readmissions)
  **Scenario:** Site 1 has 15% readmissions. Site 2 has 10% readmissions (Site 2 looks better).
  **Stratification:** By Age Band (Site 2 better in all) AND Severity Score (Site 2 better in all).
  **Problem:** Site 1 intake nurses are stricter; they label more patients "High Severity" than Site 2 nurses do.

  **Run the Protocol:**
  1.  **Timeline:** Age and Severity are pre-admission. **PASS.**
  2.  **Consistency:**
      *   Age: Measured identically. **PASS.**
      *   Severity: **FAIL.** (Nurses grade differently).
  3.  **Stability:** Age bands have sufficient $N$. Severity bands have sufficient $N$.

  **Output/Recommendation:**
  *   **Drop the Severity Stratification.** The protocol explicitly forbids cutting by variables measured inconsistently. It is statistically invalid to compare "Severe" at Site 1 against "Severe" at Site 2.
  *   **Report:** Aggregate Readmissions + Age-Stratified Readmissions.
  *   **Defense:** When the Chair asks why Severity isn't there, you point to **Check 2**. "We cannot adjust for severity because the ruler is different at each site. Adjusting would introduce more bias than it removes."
  *   **Result:** Site 2 still looks better on Aggregate and Age. But you have protected the team from making a false claim about severity adjustment.

  ### Case 3: The Downstream Trap (Discharge Protocol)
  **Scenario:** You have reported for 6 months that the New Discharge Protocol reduces readmissions.
  **The Table:** You show two rows: "Patients sent to Home" (New Protocol better) and "Patients sent to Step-Down Unit" (New Protocol better).
  **The Problem:** The New Protocol *increases* the likelihood of a patient being sent to a Step-Down Unit (it's more cautious). Step-Down patients have higher readmission rates naturally.
  **Current State:** You are stratifying by "Discharge Destination."

  **Run the Protocol:**
  1.  **Timeline:** **FAIL.** Discharge Destination happens *after* the Protocol is applied. The Protocol influences where they go.
  2.  **Consistency:** N/A (Failed Check 1).
  3.  **Stability:** N/A (Failed Check 1).

  **Output/Recommendation:**
  *   **Immediate Action:** **Drop the stratified table.** It is mathematically cheating (Post-Treatment Bias).
  *   **Why:** By separating Step-Down patients, you are comparing "High Risk patients the Protocol caught" against "Low Risk patients the Old Protocol missed." It makes the New Protocol look artificially good in the strata, or masks its true cost.
  *   **What to Report Instead:**
      1.  **Aggregate Readmission Rate:** (New vs. Old). This captures the *total* effect, including the cost of sending more people to Step-Down.
      2.  **Pre-Treatment Proxy:** If you must stratify, use **Admission Diagnosis** or **Pre-Op Comorbidity Index**. These are known *before* the discharge protocol starts.
  *   **Defense:** "If we cut by Discharge Destination, we are judging the protocol on where it sent patients, not how it treated them. That is like judging a diet plan only on the people who didn't quit. We must report the Aggregate to see the net impact on the hospital."

  ---

  ## Limitations: What This Procedure Cannot Do
  *Be honest about these in your team meeting.*

  1.  **It Cannot Fix Politics:** If the Chair *wants* to believe the stratified number because it protects their budget, this SOP gives you armor, but it doesn't stop the arrow. It just makes the arrow bounce visibly.
  2.  **It Cannot Fix Bad Data:** If the Severity Score is garbage, Check 2 stops you from using it, but it doesn't give you a *better* variable. You will be left reporting Aggregates that everyone knows are confounded. You must flag this as "Unadjusted Risk."
  3.  **It Cannot Predict the Future:** The Aggregate is based on *last year's* case mix. If the new protocol changes *who* walks in the door (e.g., becomes famous and attracts sicker patients), the Aggregate is not a forecast. It is a rear-view mirror.
  4.  **It Does Not Answer "Better for Whom?":** The procedure forces the humans to answer this. If they refuse to answer, the SOP defaults to **Aggregate** (safest for system liability) but marks the report as "Decision Context Undefined."

  ## Implementation Plan
  1.  **Adopt:** Get the Statistician and one Clinician to sign this SOP.
  2.  **Pre-Flight:** Run the checks 3 days before the quarterly meeting.
  3.  **Slide Footer:** Add a standard footer to all comparison slides: *"Stratification validated per Q-Report SOP v1.0. Variables checked for Pre-Treatment status and Measurement Consistency."*
  4.  **The "No" Script:** When asked why you didn't cut the data the way they want: "We ran the SOP. That variable failed the Timeline/Consistency check. If we report it, we risk making a decision on statistical noise. Do you want to override the protocol and accept that risk?" (Put the risk on them).
