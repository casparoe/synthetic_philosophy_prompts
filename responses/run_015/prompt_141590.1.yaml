prompt: |-
  I'm on a tiny analytics team at a hospital system (four of us: one actual statistician, two clinicians, and me), and every quarter we put out comparisons — two surgical techniques for the same condition, readmission rates for two of our sites, a new discharge protocol against the old one, and ocasionally two named surgeons. Inevitably one of the numbers flips when you cut it by severity, or by age band, or by whether the patient came in through the ED, and then the meeting turns into the same argument every single time: whoever looks bad in the big table says the cut-up version is the real story, whoever looks bad in the cut-up version says the aggregate is what actually happened to actual patients. I want to write down a real procedure we can run each quarter instead of re-litigating this from scratch, and I want it to be honest about which parts are genuine judgment calls dressed up as method.

  What I have in mind is: an ordered list of questions to walk through the moment a reversal shows up, what counts as a good enough answer to each, where the procedure just stops with a "no" (report the aggregate, or refuse to cut at all), and where it hands the decision to a person because the question is really about values, or about what the committee actually wanted to know. A few specific things keep tripping us up and I'd want the procedure to say something about each. One: sometimes the variable we want to cut by is something that happened *after* the treatment started — whether they got admitted to ICU, how long they waited, whether they were discharged to a rehab facility — and my suspicion is that cutting by those is basically cheating, but I can never explain why in a way that lands with the clinicians. Two: the severity score is assigned by different people at the two sites, or it's continuous, and whether we cut it in half or into quartiles seems to decide whether the reversal shows up at all; also half our strata have like nine patients in them and I don't trust the reversal to be real rather than noise. Three: if we actually adopt the protocol, the case mix won't stay still, so the aggregate we computed on last year's mix presumably isn't a forecast of anything. Four, and this is the bit I keep coming back to: I think there are genuinely different questions hiding inside "which one is better" — better for the mix of patients we happened to see, better for a patient whose type we already know, better for a patient who walks in tomorrow and whose type nobody knows yet, and better as a rule we could actually implement, which might mean routing type-1 patients to A and type-2 to B, a thing neither "always A" nor "always B" captures at all — and I think those can have different right answers, so at some point the procedure has to stop and ask a human which question was meant. My friend who does A/B testing at a tech company says they never look at the aggregate at all, they always segment, which sounds wrong to me but I can't quite say why.

  So: can you write the procedure, then run it on three cases and show the output? Case one: technique A beats B on complications overall but B beats A within both the mild and the severe group, and the severe cases mostly went to B. Case two: our site has worse readmissions than the other site overall but better within every age band, and the two sites' intake nurses grade severity differently. Case three should be the one that's annoying for us: we've been reporting a stratified number for a discharge protocol for the last two quarters that makes our unit look fine, and the thing we cut by — whether the patient ended up in a step-down unit — I now think might be downstream of the protocol itself, so tell me whether the procedure says to drop that number and what we should have reported instead. Constraints: maybe half a day per report, spreadsheets and R, output gets read by clinicians who will tolerate the word confounder but whose eyes glaze over at anything more technical than that, and whatever it says I have to be able to defend it when a department chair accuses us of massaging the numbers. Also please say plainly what the procedure can't do — where it just doesn't have an answer.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and case studies:

  1.  **Analyze the User and Context:**
      *   **User Role:** Member of a tiny analytics team (4 people: 1 statistician, 2 clinicians, 1 user) at a hospital system.
      *   **Task:** Create a standardized procedure for handling Simpson's Paradox/reversals in quarterly reports (surgical techniques, readmission rates, protocols, etc.).
      *   **Pain Points:** Endless arguments when aggregate vs. stratified data disagree. Clinicians vs. Statisticians tension. Post-treatment bias (cutting by downstream variables). Small sample sizes in strata. Arbitrary cut-points (severity quartiles vs. halves). Changing case mix over time. Ambiguity in the actual decision question (policy vs. individual vs. population).
      *   **Constraints:** ~0.5 day per report. Tools: Spreadsheets/R. Audience: Clinicians (tolerate "confounder," glaze over technical jargon). Must be defensible against a skeptical Department Chair.
      *   **Goal:** A written procedure (ordered list of questions/checks) + 3 specific case studies run through the procedure.
      *   **Tone:** Honest, practical, acknowledging judgment calls, not pretending math solves values.

  2.  **Deconstruct the Core Problems:**
      *   *Simpson's Paradox:* Aggregate vs. Stratified disagreement.
      *   *Post-Treatment Bias:* Conditioning on colliders or mediators (e.g., ICU admission, step-down unit).
      *   *Data Quality/Consistency:* Severity scoring differences between sites.
      *   *Sample Size:* Unreliable strata estimates.
      *   *Decision Context:* What is the actual question? (Policy, Individual, Forecasting).
      *   *Tech Friend's Advice:* "Always segment." Why is this wrong here? (Sample size, causal structure, policy implementation).

  3.  **Drafting the Procedure (The "Protocol"):**
      *   Needs to be a flowchart or ordered checklist.
      *   Needs clear "Stop" points (Report Aggregate, Report Stratified, Report Neither/Need More Data).
      *   Needs to distinguish between *statistical* validity and *decision* relevance.
      *   *Step 1: Causal Check.* Is the stratification variable pre- or post-treatment? (Addresses User Point 1 & 3).
      *   *Step 2: Data Integrity Check.* Is the stratification variable measured consistently? (Addresses User Point 2).
      *   *Step 3: Stability Check.* Are strata sample sizes adequate? (Addresses User Point 2).
      *   *Step 4: The "Why" Check.* What is the decision? (Addresses User Point 4).
      *   *Step 5: Reporting.* How to present the finding.

  4.  **Refining the Procedure (Iterative Polish):**
      *   *Language:* Keep it accessible. Use "Upstream/Downstream" instead of "Exogenous/Endogenous." Use "Noise" instead of "Variance."
      *   *The "Tech Friend" Counter-argument:* In A/B testing, traffic is infinite and randomization is perfect. In hospitals, sample sizes are small, and assignment isn't random (selection bias). Need to explain *why* we don't always segment.
      *   *The "Honesty" Clause:* Explicitly state where human judgment is required.

  5.  **Developing the Case Studies:**
      *   *Case 1 (Classic Simpson's):* Technique A vs. B. Severe cases went to B. B looks better in strata, worse overall.
          *   *Analysis:* Pre-treatment variable (severity). Large imbalance. Decision: Stratified is truth for *efficacy*, Aggregate is truth for *system performance* given current referral patterns.
      *   *Case 2 (Measurement Bias):* Site Readmissions. Age bands show Site 1 better. Overall Site 2 better. Severity scoring differs.
          *   *Analysis:* Stratification variable (Severity) is unreliable/biased. Age is okay but maybe small N.
          *   *Verdict:* Don't trust severity cuts. Rely on Age (if N is good) or Aggregate with heavy caveats. Likely "Cannot Compare."
      *   *Case 3 (Post-Treatment Bias):* Discharge Protocol. Stratified by Step-Down Unit (SDU).
          *   *Analysis:* SDU admission is *caused* by the protocol (or the condition the protocol treats). It's a mediator/collider.
          *   *Verdict:* STOP. Do not stratify. Report Aggregate or find a pre-treatment proxy.

  6.  **Addressing Specific User Constraints:**
      *   *Defensibility:* The procedure must be documented *before* the meeting.
      *   *Time:* Must be doable in 4 hours.
      *   *Values:* Acknowledge that "Better for whom?" is a policy question, not a math question.

  7.  **Writing the Content (Drafting & Reviewing):**
      *   *Intro:* Acknowledge the frustration. Validate the "Simpson's Paradox" fatigue.
      *   *The Procedure:* Name it something official (e.g., "Q-Report Stratification Protocol").
      *   *The "Why" Section:* Explain the logic simply (Causal diagrams without drawing DAGs).
      *   *The Cases:* Walk through step-by-step.
      *   *Limitations:* Be clear about what this doesn't solve (politics, bad data collection).

  8.  **Self-Correction/Refinement during drafting:**
      *   *Critique:* Is Step 4 too vague?
      *   *Fix:* Make it a specific question: "If we change policy, do we change it for everyone or based on this variable?"
      *   *Critique:* Is the distinction between "Efficacy" and "Effectiveness" clear enough for clinicians?
      *   *Fix:* Use "Can it work?" vs. "Did it work here?"
      *   *Critique:* The user mentioned the tech friend's A/B testing advice.
      *   *Fix:* Add a specific sidebar/note on why hospital data $\neq$ tech A/B tests (non-random assignment, small N).

  9.  **Final Polish:** Check tone. Ensure it sounds like a colleague helping a colleague, not a textbook. Ensure the "Honesty" about judgment calls is prominent. (The prompt asks for "honest about which parts are genuine judgment calls dressed up as method.")

  10. **Final Output Structure:**
      *   Preamble (Validation).
      *   The Protocol (The "SOP").
      *   Why this works (The logic).
      *   Case Studies (1, 2, 3).
      *   Limitations (What it can't do).

  *(Self-Correction during final review)*: Make sure Case 3 explicitly answers "what should we have reported instead." Make sure the procedure explicitly handles the "small n" issue. Ensure the distinction between *confounder* (pre-treatment) and *mediator* (post-treatment) is clear without being too jargon-heavy.

