answer: |-
  ### Part 1: The Stance

  I am taking your side. **Stability is cheap and manufacturable.**

  A scenario can produce a confident, stable verdict across audiences simply by triggering a high-salience heuristic (disgust, fear, familiarity) while obscuring the logical lever that actually moves the argument. If your friend claims that stable intuition equals argumentative validity, they are conflating *psychological efficacy* with *philosophical justification*. A well-lit stage magician can get 100% agreement that the lady vanished; that does not mean she actually vanished.

  This procedure is built on the premise that **intuitions are data, not verdicts.** A thought experiment succeeds only if it isolates the variable it claims to test. If it relies on hidden variables, genre filling, or empirical falsehoods to generate that stability, it is an intuition pump, not a proof.

  ***

  ### Part 2: The Scenario Stress Test (SST)

  **Target User:** 2nd-year grad student (any discipline).
  **Time Limit:** 20 Minutes.
  **Output:** One sentence for a referee report.

  **Instructions:** Read the paper's central scenario. Set a timer. Do not move to the next step unless the current step is "Passed." If a step is "Failed," stop and draft the report sentence using the template at the end.

  #### Step 1: The Load-Bearing Triage (2 Minutes)
  *Goal: Distinguish Decorative vs. Evidential and Load-Bearing vs. Delete-able.*
  1.  Remove the scenario from the paper mentally. Replace it with the sentence: "Consider a case where X happens."
  2.  Does the paper's main conclusion collapse without the specific details of the scenario?
      *   **No:** The case is **Decorative**. Stop. *Verdict: The scenario is illustrative only.*
      *   **Yes:** The case is **Evidential**. Proceed to Step 2.
  3.  Is the scenario the *only* support for the conclusion, or one of several?
      *   **Only support:** Mark as **High Stakes**.
      *   **One of several:** Mark as **Supportive**.

  #### Step 2: The Mannequin Audit (5 Minutes)
  *Goal: Catch Failure Mode (b) — The Mannequin Problem.*
  1.  List three specific details the scenario *does not* specify (e.g., the agent's emotional state, the lighting, the time of day, the specific wording of a rule).
  2.  Ask two colleagues (or imagine two distinct archetypes, e.g., a lawyer and an engineer) to fill in those blanks.
  3.  **Pass:** Both colleagues fill the gaps in compatible ways that do not change the outcome.
  4.  **Fail:** Colleagues fill the gaps differently (e.g., one imagines a malicious AI, one a broken tool), and this changes their verdict on the case.
      *   *Stop condition:* If Failed, the scenario is under-specified.

  #### Step 3: The Variable Swap (5 Minutes)
  *Goal: Catch Failure Mode (a) — Off-Stage Variables.*
  1.  Identify one feature of the scenario that seems irrelevant to the philosophical claim (e.g., the gender of the agent, the color of the box, the distance between actors).
  2.  Mentally swap this feature for its opposite.
  3.  **Pass:** Your intuition about the *moral/conceptual* verdict remains identical.
  4.  **Fail:** Your intuition shifts significantly (e.g., pushing a *woman* feels worse than pushing a *man*, even if the theory says gender is irrelevant).
      *   *Stop condition:* If Failed, the scenario is confounded by irrelevant variables.

  #### Step 4: The Stipulation Reality Check (5 Minutes)
  *Goal: Catch Failure Modes (c) & (d) — Borrowed Intuition & Calibration Failure.*
  1.  Identify the "magic stipulation" (the thing the author asks you to assume is true despite real-world evidence, e.g., "the predictor is never wrong," "the upload is exactly you").
  2.  Ask: "To get the intended intuition, must I ignore a strong real-world regularity?"
  3.  **Pass:** The stipulation is functional/definitional (e.g., "assume the box is closed").
  4.  **Fail:** The stipulation contradicts a deep empirical regularity that drives the intuition (e.g., "assume you trust this predictor" when humans cannot trust perfect predictors).
      *   *Stop condition:* If Failed, the intuition is calibrated to a world that doesn't exist.

  #### Step 5: The Human Hand-Off (3 Minutes)
  *Goal: Acknowledge Value/Theory Judgments.*
  If you have passed Steps 1–4, the scenario is structurally sound. You must now judge the *inference*.
  1.  Does the scenario prove the conclusion, or merely make it plausible?
  2.  **Judgment Call:** If the scenario is sound but the leap to the conclusion is large, note this as a "theoretical overreach" rather than a "scenario failure."

  ***

  ### Referee Report Sentence Template

  *   **If Failed Step 1 (Decorative):** "The central scenario functions illustratively rather than evidentially and does not bear the weight of the paper's primary conclusion."
  *   **If Failed Step 2 (Mannequin):** "The scenario is under-specified in ways that allow incompatible interpretations, rendering the resulting intuition unstable across readers."
  *   **If Failed Step 3 (Off-Stage):** "The scenario's verdict appears sensitive to irrelevant variables (e.g., [insert variable]), suggesting the intuition is driven by framing rather than the target principle."
  *   **If Failed Step 4 (Calibration):** "The scenario requires stipulations that contradict the empirical regularities necessary to generate the intended intuition, risking a calibration failure."
  *   **If Passed All:** "The scenario is structurally robust, though the inference from [Scenario Verdict] to [Paper Conclusion] requires further theoretical defense."

  ***

  ### Part 3: Running the Procedure on Three Cases

  #### Case 1: The Footbridge Variant (Harming/Allowing)
  *Paper Claim:* There is no morally relevant difference between pushing a man and diverting a trolley; the distinction is an illusion.
  *   **Step 1 (Load-Bearing):** **Pass (High Stakes).** The paper rests entirely on this comparison.
  *   **Step 2 (Mannequin):** **Pass.** Most readers visualize the bridge and the man similarly enough.
  *   **Step 3 (Variable Swap):** **Fail.** If you swap "pushing a man" for "dropping a trapdoor that releases a man," verdicts often shift even if the physics are identical. The "personal contact" variable is off-stage but drives the verdict.
  *   **Step 4 (Calibration):** **Fail.** The intuition relies on evolved disgust responses to direct violence (calibrated to real-world assault) which the author stipulates is morally equivalent to lever-pulling. The intuition is not about *harm*, it is about *violence*.
  *   **Result:** **FAIL (Step 3 & 4).**
  *   **Report Sentence:** "The scenario's verdict appears sensitive to irrelevant variables (e.g., personal contact vs. mechanical mediation), suggesting the intuition is driven by framing rather than the target principle."
  *   **Comment:** This is the "Vivid" case. The test correctly identifies that its stability is manufactured by emotional salience, not logical isolation.

  #### Case 2: The Chinese Room (AI Understanding)
  *Paper Claim:* A system running a program doesn't understand anything; hence current AI doesn't understand.
  *   **Step 1 (Load-Bearing):** **Pass (High Stakes).** It is the core argument.
  *   **Step 2 (Mannequin):** **Fail.** Is the "system" the man? The room? The rulebook? A cognitive scientist imagines a distributed process; a layperson imagines a guy in a box. These are incompatible ontologies.
  *   **Step 3 (Variable Swap):** **Pass.** (Changing the language doesn't matter).
  *   **Step 4 (Calibration):** **Fail.** The stipulation "a human can manipulate symbols fast enough to converse" asks us to ignore the empirical link between processing speed/complexity and the emergence of functional understanding.
  *   **Result:** **FAIL (Step 2).**
  *   **Report Sentence:** "The scenario is under-specified in ways that allow incompatible interpretations (e.g., the boundaries of the 'system'), rendering the resulting intuition unstable across readers."
  *   **Comment:** This is the "Classic" case. The test identifies the "Mannequin Problem" immediately.

  #### Case 3: The AI Promise (Current Referee Paper)
  *Paper Claim:* No promise was made (AI resets, no memory), so no existing AI can promise.
  *   **Step 1 (Load-Bearing):** **Pass (Supportive).** It supports the definition of promising.
  *   **Step 2 (Mannequin):** **Pass.** The technical constraints are explicit (no memory, reset on close). There is little room for genre-filling.
  *   **Step 3 (Variable Swap):** **Pass.** Changing the medication to a meeting, or the AI's voice, does not change the verdict that the commitment cannot be kept.
  *   **Step 4 (Calibration):** **Pass.** The stipulation (AI resets) is a current technical reality, not a magic trick. We are not asked to imagine a impossible predictor, but a limited tool.
  *   **Result:** **PASS.**
  *   **Report Sentence:** "The scenario is structurally robust, though the inference from [Scenario Verdict] to [Paper Conclusion] requires further theoretical defense."
  *   **Comment:** **This is the result you may not like.** You are refereeing this paper, likely looking for flaws. The SST suggests the *scenario itself* is not the weak link. The weakness (if any) lies in the philosophical leap (Step 5 Hand-Off): does *this specific failure* prove *no AI can promise*? The test clears the case, forcing you to attack the theory, not the example. This counters your fear that the test would be "too harsh on exploratory papers." This is a specific, technical, exploratory case, and it passes.

  ***

  ### Part 4: Limitations and Gaming

  **What the Procedure Cannot Do:**
  1.  **It cannot judge truth.** If an author argues "Killing is wrong" and uses a sound scenario to show "Killing is wrong," the test passes. It does not tell you if killing is actually wrong. It only tells you if the *case* supports the *claim* without cheating.
  2.  **It cannot resolve theoretical disputes.** If two philosophers agree on the scenario's verdict but disagree on what it *means* (e.g., compatibilists vs. incompatibilists on a free will case), the test will Pass. That is a theory-choice problem, not a scenario problem.
  3.  **It is blind to "The Fortress Strategy."** A determined author can game Step 2 (Mannequin) by over-specifying the scenario. They can write 10 pages of text defining every variable to prevent readers from filling gaps. This makes the scenario "robust" but unreadable. The test counts this as a Pass, even though it may kill the paper's pedagogical value.
  4.  **It struggles with "Cluster Concepts."** If the target concept (e.g., "Consciousness") is genuinely vague, Step 4 (Calibration) may flag a failure where there is only vagueness. The test assumes concepts are sharp enough to be tested.

  **The Honest Hand-Off:**
  The procedure stops at **Step 5**. If a paper passes Steps 1–4, the SST declares the *tool* sharp. It does not declare the *carpenter* skilled. You, the referee, must still decide if the sharp tool is being used to build a house or to break a window. The SST prevents you from rejecting a paper because the example was "weird," but it does not prevent you from rejecting it because the argument was "wrong."
