answer: |-
  # THESIS DEFENSE Q&A PREP SHEET
  **Topic:** Plasticity of Reactive Attitudes & The Feedback Loop
  **Time:** Thursday
  **Language:** American English

  ## STRATEGIC OVERVIEW

  **The Non-Negotiables (Hold the Line):**
  1.  **The Plasticity Constraint:** You cannot concede that reactive attitudes are static. If capacities aren't plastic, your feedback loop disappears, and you're just a standard Strawsonian.
  2.  **The Feedback Loop:** You must maintain that blaming practices *constitute* part of the fittingness conditions. If fittingness is entirely independent of practice, you lose the core innovation.

  **The Concession (Give Ground Early):**
  *   **The Institutional Extension (Step 5):** You are vulnerable on extending this to institutions without a fuller theory of collective agency. Concede that your account of *individual* plasticity is the core contribution, and the institutional bit is a "promissory note" for future work. This satisfies the Visitor without forcing you to defend a full theory of structural injustice on the fly.

  **The Nightmare Question:**
  *   **Your Guess:** "If blame degrades the capacity that makes blame fit, doesn't your view collapse into the claim that we should basically never blame anyone?"
  *   **Verdict:** **Yes, this is the one.** It's the "Quietism Objection." If you can't answer this, your theory is self-defeating. Do not dodge it.

  **Blunt Feedback on the Argument:**
  *   **Doing Real Work:** Steps 2 and 3 (Capacities are psychological/developmental + Fittingness depends on history). This is the engine.
  *   **Just "Cool":** Step 4 (Distinguishing "didn't have" vs. "spent down"). Conceptually neat, but in the room, you won't be able to prove an agent *lost* capacity vs. *never had it*. Don't hang your life on this distinction.
  *   **Overreach:** Step 5 (Institutional Blame). You're trying to solve structural injustice with a tool built for interpersonal relationships. It's ambitious, but it's the weakest link empirically and metaphysically.

  ---

  ## THE OBJECTIONS (Ordered by Likelihood & Damage)

  ### 1. The "External Standpoint" Objection
  **Who:** The Chair (Hardline Strawsonian)
  **The Question:** "You keep talking about 'fittingness conditions' that depend on causal history. But Strawson's whole point was that there is no external standpoint from which to judge the practice. By asking whether our attitudes 'fit' the capacities they help create, aren't you smuggling in exactly the objective metaphysics Strawson dissolved? You're treating the practice as if it answers to something outside itself."

  **The Reply (2 mins):**
  "I'm not positing an external standpoint; I'm positing an internal tension. Strawson says we can't step outside the practice to justify it globally, but within the practice, we constantly adjust our attitudes based on whether they're working. My claim is that 'fittingness' isn't a static target we detect; it's a regulatory ideal internal to the practice itself. When I say blame is unfitting because it degraded the capacity, I'm not appealing to a God's-eye view. I'm appealing to the participant stance's own commitment to seeing others as agents. If my blame destroys your agency, I'm undermining the very relationship that makes my blame meaningful. So the 'condition' isn't external; it's the practice's own requirement for sustainability. I'm not judging the practice from outside; I'm showing how the practice judges itself."

  **Weakness/Bluff:** You're walking a tightrope between internalism and normativity. If she presses on "where does the norm come from if not outside?", you risk circularity.
  **Strategy:** Hold the line. This is core to your meta-ethics.

  ### 2. The "Quietism Collapse" Objection (The Nightmare)
  **Who:** Second Reader (Compatibilist) or General Follow-up
  **The Question:** "If blaming someone degrades the capacities that make them responsible, and unfitting blame is bad because it degrades those capacities, doesn't this imply we should minimize blame as much as possible? Doesn't your view collapse into a prescription to never blame anyone, since any blame risks eroding the agency required for responsibility?"

  **The Reply (2 mins):**
  "No, because plasticity isn't a one-way street toward degradation. The feedback loop works both ways. Appropriate, calibrated blame can *strengthen* agency by signaling that we take the other person's reasons seriously. It's not blame vs. no blame; it's about the *mode* and *frequency*. Think of it like physical training: too much weight tears the muscle, but no weight atrophies it. My view doesn't say 'never blame'; it says 'blame in a way that sustains the participant stance.' Excessive or hostile blame degrades; constructive blame maintains or builds. The obligation isn't quietism; it's calibration. We have to blame enough to hold the relationship together, but not so much that we break the partner."

  **Weakness/Bluff:** You need to be careful not to slide into consequentialism here ("whatever works"). You need to maintain that the *fittingness* is what matters, not just the outcome.
  **Strategy:** Hold the line. This is the practical implication of your thesis. If you concede quietism, the thesis is useless.

  ### 3. The "Threshold Mechanism" Objection
  **Who:** Second Reader (Compatibilist)
  **The Question:** "You say capacities are responsive to social treatment. Fine. But where's the mechanism? How much reasons-responsiveness is enough? At what exact point does blame cross from 'fitting' to 'capacity-eroding'? If you can't give me a threshold, 'fittingness' is just a label you paste on whatever outcome you like."

  **The Reply (2 mins):**
  "I'm not offering a calculus, and I don't think one is available for human relationships. But 'no threshold' doesn't mean 'no distinction.' We recognize the difference between coaching and abuse without a metric. My claim is that the threshold is dynamic, not static. It shifts based on the history of the relationship. The mechanism is the psychological impact on the target's ability to grasp reasons. If my blame makes you unable to hear reasons, I've crossed the line. We identify this retrospectively in practice, not prospectively via a formula. The lack of a precise number doesn't mean the phenomenon isn't real; it means the phenomenon is contextual."

  **Weakness/Bluff:** He hates this answer. He wants a model. You're giving him a heuristic.
  **Strategy:** Concede slightly. Admit you aren't providing a psychometric test, but insist that philosophical accounts of responsibility don't require them either.

  ### 4. The "Empirical Burden" Objection
  **Who:** Third Reader (X-Phi)
  **The Question:** "You lean heavily on the claim that blame degrades capacity. That's an empirical claim. What does your view predict that standard Strawsonianism doesn't? And if I show you data where high-blame environments produce *higher* agency (e.g., strict military training, some sports), does your theory survive?"

  **The Reply (2 mins):**
  "My view predicts that sustained, hostile, or isolating blame degrades agency, whereas structured, participatory blame sustains it. If you show me data where high-blame environments increase agency, I'd look for the participatory elements—are the subjects still treated as partners? If the data shows that pure contempt increases reasons-responsiveness, then yes, I'd have to adjust the empirical premise. But current psychology on shame and ostracism supports the degradation claim. The key prediction is that structurally biased blaming will show higher rates of agency-impairment in marginalized groups, not because of intrinsic deficits, but because of the feedback loop. If that correlation doesn't exist, my explanation for structural injustice fails."

  **Weakness/Bluff:** You are betting your philosophy on contingent psychology.
  **Strategy:** Hold the line on the *concept*, concede on the *extent*. If the data contradicts, the *mechanism* changes, but the *logic* of the loop remains.

  ### 5. The "Psychologizing Oppression" Objection
  **Who:** Visitor (Structural Injustice)
  **The Question:** "I like the plasticity point, but you're still framing this as a matter of individual attitudes and interpersonal dynamics. Oppression isn't just about people feeling resentful; it's about norms, laws, and material structures. Aren't you psychologizing a political problem? You're making it about how we feel about each other, not about what we owe each other."

  **The Reply (2 mins):**
  "I hear the worry, but I'm trying to bridge that gap. Structures aren't freestanding; they run on attitudes. When I say an institution is blameworthy for eroding agency, I'm saying the structure encodes a blaming practice that triggers this plasticity. The 'psychological' effect is the mechanism by which the 'political' structure does its harm. If we don't account for the attitudinal feedback loop, we miss how structures reproduce themselves through individual interactions. I'm not reducing politics to psychology; I'm showing how the psychology of responsibility is the engine of the politics of oppression."

  **Weakness/Bluff:** She might think this is still too micro-level.
  **Strategy:** Concede up front (see Strategic Overview). Admit this is the "individual-level account" of a structural problem, not the full structural theory.

  ### 6. The "Circularity" Objection
  **Who:** The Chair (Follow-up)
  **The Question:** "You say the practice makes the property, and the property justifies the practice. That sounds viciously circular. How is this not just saying 'we are responsible because we hold people responsible'?"

  **The Reply (2 mins):**
  "It's not vicious circularity; it's reflective equilibrium. The practice doesn't create the property out of nothing; it shapes the psychological capacities that constitute the property. It's like language: speaking English helps maintain the capacity to speak English, which makes speaking English possible. If I stop speaking, I lose the capacity. The justification isn't circular; it's developmental. The practice sustains the conditions of its own possibility. When it fails to do that, it becomes unfitting. So there's a standard: does this practice sustain the agency required for the practice?"

  **Weakness/Bluff:** This is dense. If she's not buying "reflective equilibrium" as a solution to metaphysics, you're stuck.
  **Strategy:** Hold the line. This is the metaphysical core.

  ### 7. The "Alternative Explanations" Objection
  **Who:** Third Reader (X-Phi)
  **The Question:** "Even if blame correlates with degraded agency, why think it's the *blame* causing it? Maybe low agency causes more blame from others, which looks like a loop but is actually just a stable trait. How do you rule out reverse causality?"

  **The Reply (2 mins):**
  "That's a fair methodological challenge. Longitudinal studies on stigma and shame suggest the causal arrow runs both ways, but specifically that imposed stigma reduces self-efficacy. My argument doesn't require blame to be the *sole* cause, just a *contributing* cause. If blame is even partially constitutive of the capacity loss, the normative point stands: we are complicit in the impairment. Even if reverse causality exists, the feedback loop amplifies it. My claim is that we can't treat the capacity as fixed when evaluating the blame, because the blame is part of the capacity's trajectory."

  **Weakness/Bluff:** You are weak on causality. This is armchair philosophy meeting hard science.
  **Strategy:** Concede the complexity. Don't claim you've proven causality, just that the *possibility* changes the normative landscape.

  ### 8. The "Self-Exemption" Objection
  **Who:** Second Reader (Compatibilist)
  **The Question:** "You say blamers are accountable for eroding agency. But if their capacity to blame responsibly is also plastic and degraded by the system, aren't they also victims? How do you blame the blamer without triggering an infinite regress of diminished responsibility?"

  **The Reply (2 mins):**
  "It does create a regress, but not an infinite one that stops accountability. We hold people responsible for maintaining the practice, even if the practice is hard on them. The standard isn't perfection; it's participation. If I degrade your agency, I'm answerable for that, even if I'm also stressed by a system that demands I blame you. We're all in the loop together. The solution isn't to stop holding anyone responsible; it's to change the *way* we hold responsibility so it doesn't degrade us either. The regress stops at the point where we recognize the mutual interest in sustaining agency."

  **Weakness/Bluff:** This is the hardest logical knot. You risk letting everyone off the hook.
  **Strategy:** Hold the line, but emphasize "mutual interest."

  ---

  ## FINAL TACTICAL NOTES

  **When to Sweat:**
  *   **The Chair's Meta-Ethics:** If she decides you've misunderstood Strawson, you're in trouble. Keep bringing it back to the *internal* norms of the practice.
  *   **The Quietism Question:** If you sound like you're saying "blame is bad," you lose. You must sound like "bad blame is bad; good blame is necessary."

  **When to Relax:**
  *   **The Empirical Details:** The X-Phi reader knows you're a philosopher, not a psychologist. As long as you show you've thought about the data and aren't ignoring it, you're fine. You don't need to know the specific studies.
  *   **The Institutional Stuff:** As planned, treat this as the "future work" section. It shows ambition without requiring you to defend a full political theory today.

  **Body Language/Tone:**
  *   **Chair:** Respectful but firm on the internal/external distinction.
  *   **Second Reader:** Pragmatic. Acknowledge the need for precision even if you can't give a number.
  *   **Third Reader:** Open-minded. "That's a great empirical question, here's how I'd test it..."
  *   **Visitor:** Allied but distinct. "I agree on the goal, I'm offering the mechanism..."

  **Last Minute Check:**
  You've been staring at this for nine months. You know the text better than they do. When they ask about a specific passage, don't panic. If you don't know, say: "That's not how I'm framing it in the chapter, but here's how I'd address it now." Own the room. You're the expert on this specific argument today.

  Good luck. You've got the loop. Keep the loop tight.
