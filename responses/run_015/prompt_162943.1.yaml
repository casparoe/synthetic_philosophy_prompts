answer: |-
  ### The Scale
  To make the choices below concrete, imagine every person's well-being is measured on a simple **0–100 Scale**.
  *   **0** is a life not worth living (constant agony).
  *   **50** is a decent life (needs met, some joy, no constant pain).
  *   **100** is the best possible life (perfect health, deep satisfaction).
  *   **Points** represent improvements or losses to that life.

  ---

  ### The Decision Tree

  **Branch 1: The Decent Line**
  A clinic has one dose of a drug that adds **10 points**.
  *   **Patient A** is at **40** (struggling, below the decent line of 50).
  *   **Patient B** is at **60** (comfortable, above the decent line of 50).
  *   **Who gets the dose?**
      *   **[A]** The person at 40. Being below the decent line makes their need stricter.
      *   **[B]** It doesn't matter; 10 points is 10 points, or B might need it more for other reasons.

  > *Calibration: High Confidence. This cleanly separates "Sufficientarian" views (which care about a cutoff) from continuous views. Risk: Some readers may conflate "decent" with "medical urgency" rather than moral weight.*

  **Branch 2: The Crowd**
  A flood defence budget can either:
  *   **[A]** Save **one person** from losing **50 points** (dropping from 50 to 0).
  *   **[B]** Save **1,000 people** from losing **1 point each** (dropping from 50 to 49).
  *   **Total loss in A:** 50 points. **Total loss in B:** 1,000 points.
  *   **Which loss do you prevent?**
      *   **[A]** Save the one person. The depth of their fall matters more than the number of people.
      *   **[B]** Save the 1,000 people. The total amount of suffering prevented is what counts.

  > *Calibration: High Confidence. This is the classic "Aggregation" test. It distinguishes those who sum gains from those who weight severity. Risk: Readers might miscount the math, but the disparity (1 vs 1,000) is large enough to override calculation errors.*

  **Branch 3: The Equal Drop**
  Imagine two towns. Currently, Town Rich is at **80**, Town Poor is at **40**.
  You can make a change that brings Town Rich down to **60** and Town Poor up to **50**.
  *   **Result:** The gap is smaller (more even), but the **total score drops** (from 120 to 110), and no one is better off than the original Rich town.
  *   **Do you make the change?**
      *   **[A]** Yes. A fairer distribution is worth the total loss.
      *   **[B]** No. Never reduce the total well-being just to close a gap.

  > *Calibration: Medium Confidence. This is the "Levelling Down" objection. It is the single hardest question to phrase without leading the witness. Readers may reject the change simply because they dislike harming the Rich, not because they value equality.*

  **Branch 4: The Coin Flip**
  Two patients are equally sick, both at **20 points**. You have resources for one of two plans:
  *   **[A]** A **coin flip**: One patient is fully cured (goes to 100), the other gets nothing (stays at 20).
  *   **[B]** A **certain treatment**: Both patients improve modestly (both go to 60).
  *   **Expected average outcome is the same (60 points each).**
  *   **Which plan do you choose?**
      *   **[A]** The coin flip. Everyone had an equal chance at the best outcome.
      *   **[B]** The certain treatment. It is better to guarantee help for both than to gamble.

  > *Calibration: High Confidence. This distinguishes "Ex-ante" (fairness of chances) from "Ex-post" (fairness of results) views. Risk: Risk-averse readers might choose B for psychological reasons unrelated to moral theory.*

  **Branch 5: The Neighborhood**
  You can give **10 points** to one person.
  *   **Case 1:** The person is at **60**, but everyone around them is at **90**. (They are relatively poor).
  *   **Case 2:** The person is at **60**, but everyone around them is at **65**. (They are nearly the lowest).
  *   **Does the claim to help change based on how others are doing?**
      *   **[A]** Yes. Help the person in Case 1. Being at the bottom of a rich ladder is worse.
      *   **[B]** No. Their score is 60 in both cases. Only their absolute level matters.

  > *Calibration: High Confidence. This isolates "Relative" views from "Absolute" views. Risk: Readers might worry about envy or social tension rather than moral weight.*

  **Branch 6: The Past**
  Two people are currently at **30 points** (badly off).
  *   **Person A** was at **90** for most of their life, but recently fell ill.
  *   **Person B** has been at **30** their whole life.
  *   **You can lift one of them to 50.**
  *   **Who gets the help?**
      *   **[A]** Person B. Their whole life has been worse.
      *   **[B]** It doesn't matter. Only their current suffering counts.

  > *Calibration: Medium-High Confidence. Distinguishes "Whole-Life" views from "Time-Slice" views. Risk: Readers may feel Person A "had their turn," which is a desert claim, not a priority claim.*

  **Branch 7: The Pain Scale**
  You can create **20 points** of improvement.
  *   **Option A:** Lift someone from **10 to 30** (escaping misery).
  *   **Option B:** Lift someone from **70 to 90** (going from fine to thriving).
  *   **Does the relief of misery count for more than the addition of joy?**
      *   **[A]** Yes. Ending low-level suffering is more urgent.
      *   **[B]** No. A point is a point, whether it removes pain or adds pleasure.

  > *Calibration: Medium Confidence. Distinguishes "Negative" weighting from standard weighting. Risk: Diminishing marginal utility (it's harder to go from 70 to 90) might confuse readers.*

  ---

  ### Routing Table
  *Find the combination of answers that matches your choices to see your position.*

  | If your answers were... | Your Position (Leaf) |
  | :--- | :--- |
  | **Branch 3: [A]** (Equality over Total) | **The Gap View** (Egalitarianism) |
  | **Branch 2: [B]** AND **Branch 7: [B]** | **The Tally View** (Utilitarianism) |
  | **Branch 2: [B]** AND **Branch 7: [A]** | **The Relief View** (Negative Utilitarianism) |
  | **Branch 2: [A]** AND **Branch 3: [B]** | **The Bottom-Line View** (Maximin) |
  | **Branch 1: [A]** AND **Branch 2: [B]** | **The Decency View** (Sufficientarianism) |
  | **Branch 5: [A]** AND **Branch 2: [A/B]** | **The Rank View** (Relative Prioritarianism) |
  | **Branch 4: [A]** AND **Branch 2: [B]** | **The Chance View** (Ex-Ante Prioritarianism) |
  | **Branch 6: [A]** AND **Branch 1: [B]** | **The Life-Story View** (Whole-Life Prioritarianism) |
  | **Branch 1: [B]** AND **Branch 5: [B]** AND **Branch 2: [A]** | **The Weighted View** (Prioritarianism) |
  | **Branch 1: [A]** AND **Branch 2: [A]** | **The Hybrid View** (Threshold + Priority) |

  ---

  ### Leaf Glossary

  1.  **The Gap View:** Claims that reducing the distance between people is valuable in itself. *Awkward Commitment:* Endorses making everyone poorer if it makes them equally poor.
  2.  **The Tally View:** Claims that the only thing that matters is the sum total of well-being points. *Awkward Commitment:* Ignores whether one person bears all the suffering while others thrive.
  3.  **The Relief View:** Claims that removing low-level suffering matters more than creating high-level satisfaction. *Awkward Commitment:* May prefer a world with no joy but no pain over a world with great joy and some pain.
  4.  **The Bottom-Line View:** Claims that society should act only to improve the situation of the single worst-off person. *Awkward Commitment:* Ignores massive gains for everyone else to avoid tiny losses for the worst-off.
  5.  **The Decency View:** Claims that helping people matters most when they are below a specific level of "enough." *Awkward Commitment:* A person one hair below the line gets all the help; a person one hair above gets none.
  6.  **The Rank View:** Claims that your claim to help depends on your place in line relative to others, not your absolute score. *Awkward Commitment:* Your need for help decreases if your neighbors get richer, even if you stay the same.
  7.  **The Chance View:** Claims that fairness applies to the odds people face before the outcome, not the result itself. *Awkward Commitment:* Can prefer a lottery where everyone likely dies over a sure thing where some definitely live.
  8.  **The Life-Story View:** Claims that priority is determined by a person's total well-being over their whole life, not just today. *Awkward Commitment:* A currently suffering person who had a great past gets less help than a currently suffering person who always suffered.
  9.  **The Weighted View:** Claims that gains count for more the worse off the recipient is, but numbers still matter. *Awkward Commitment:* Can demand huge sacrifices from the well-off for tiny gains to the poor.
  10. **The Hybrid View:** Claims that priority matters below a line, but totals matter above it. *Awkward Commitment:* Hard to explain why the moral rules change abruptly at specific points.

  ---

  ### Combinations No One Defends

  The tree permits logical combinations that correspond to no known philosophical position.

  *   **Branch 2 [A] (Save the One) + Branch 3 [A] (Equality over Total):** This combination suggests you care about the single worst-off person, but also care about equality even if it hurts them. *Verdict:* **Incoherent.** If you care about the worst-off, you shouldn't support a change that lowers the total if it doesn't help them.
  *   **Branch 5 [A] (Relative Matters) + Branch 6 [B] (Past Doesn't Matter):** This suggests you care deeply about social ranking right now, but not about how that ranking was achieved over time. *Verdict:* **Unexplored.** Most relative views are concerned with lifetime status, but a purely "snapshot" relative view is theoretically possible though rare.
  *   **Branch 1 [A] (Threshold) + Branch 7 [B] (Pain = Pleasure):** This suggests there is a special line for "decency," but below that line, relieving agony is no more important than adding luxury. *Verdict:* **Merely Unattractive.** It defeats the purpose of having a threshold for decency if you don't weight the suffering below it more heavily.

  ### Indistinguishable Leaves

  No decision tree of this size can perfectly separate every philosophical nuance.

  *   **The Tally View vs. The Weighted View:** If a reader chooses "Save the Many" in Branch 2, they could be a Tally Viewer (Utilitarian) or a Moderate Weighted Viewer (Prioritarian) who just thinks the numbers overwhelmed the weight. The tree cannot distinguish *why* they saved the many, only *that* they did.
  *   **The Relief View vs. The Weighted View:** Both will choose to relieve misery in Branch 7. The Relief View says pain *intrinsically* counts more; the Weighted View says low scores count more. Since low scores and pain often overlap, the cases provided cannot pull them apart without asking about "pleasure" specifically, which risks confusing readers.
  *   **The Chance View vs. Standard Risk-Aversion:** A reader choosing the Coin Flip in Branch 4 might believe in "Ex-Ante Priority" (fair chances are morally required) or they might simply prefer gambling. The tree treats this as a moral position, but it may track psychological risk tolerance instead.

  ---

  ### Closing Paragraph: The Pattern Trap

  Only one leaf on this tree—the **Gap View**—will consistently endorse a change that leaves nobody better off and somebody worse off purely for the sake of the pattern. This is the "Levelling Down" result: if equality is the only goal, making the rich poorer to match the poor is a success, even if the poor gain nothing. Every other leaf escapes this result by their own construction. The **Tally**, **Relief**, and **Weighted** views care about the total or the absolute level of the recipient, so destroying value never helps. The **Decency** and **Bottom-Line** views care about specific people reaching a target, so hurting others to reach it is counterproductive. The **Gap View** is the only one that treats the relationship between people as more valuable than the people themselves.

  ---

  ### Calibration Notes & Limitations

  *   **Branch 1 (Threshold):** *Confidence: High.* The distinction between "cutoff" and "spectrum" is robust. *Contested Reading:* Some "Sufficientarians" argue the threshold is vague, not sharp; the binary choice forces a sharpness they might reject.
  *   **Branch 2 (Numbers):** *Confidence: High.* This is the standard test for aggregation. *Contested Reading:* Depends on the steepness of the weighting. A very steep Prioritarian might look like a Maximin here; a very flat one looks like a Utilitarian.
  *   **Branch 3 (Equal Drop):** *Confidence: Medium.* **This is the least sure step.** It relies on the reader accepting that "more even" is a benefit independent of "better off." Many readers reject the premise entirely, which routes them correctly, but some might accept it for reasons of social stability rather than moral equality. *Settling this:* Would require a follow-up asking if they would support the change even if the "Rich" town didn't know they were being lowered.
  *   **Branch 4 (Coin Flip):** *Confidence: High.* Standard Ex-ante/Ex-post test. *Contested Reading:* Assumes the "Chance" view prefers the lottery. Some Ex-ante views might still prefer the certain gain if the "expected value" of the chance is calculated differently.
  *   **Branch 5 (Neighborhood):** *Confidence: High.* Cleanly separates Relative from Absolute. *Contested Reading:* Depends on the reader interpreting "Neighbors" as a moral reference class, not just a source of envy.
  *   **Branch 6 (Past):** *Confidence: Medium-High.* *Contested Reading:* Some Whole-Life views argue we should compensate for past suffering (help Person A), while others argue we should prioritize the worse total life (help Person B). The question assumes the latter definition of Whole-Life Priority.
  *   **Branch 7 (Pain Scale):** *Confidence: Medium.* *Contested Reading:* Depends on a contested reading of "Negative Utilitarianism." Some versions say *only* pain matters; this question asks if pain matters *more*. A strict Negative Utilitarian and a Weighted View might answer identically here.
