answer: |-
  # The White Horse Deliberation: A Structured Classroom Exercise

  ## 1. Artifact Descriptions and Scoring Sheet

  **The Deck (12 Cards)**
  Each card contains an image description and two categorical tags (visible to all).
  1.  **Statue A:** A marble sculpture of a **Horse**, painted **White**. *(Tags: Horse-Shape, White-Color)*
  2.  **Statue B:** An iron sculpture of a **Horse**, painted **Black**. *(Tags: Horse-Shape)*
  3.  **Statue C:** A bronze sculpture of a **Horse**, painted **Brown**. *(Tags: Horse-Shape)*
  4.  **Statue D:** A marble sculpture of a **Sphere**, painted **White**. *(Tags: White-Color)*
  5.  **Statue E:** A marble sculpture of a **Cube**, painted **White**. *(Tags: White-Color)*
  6.  **Statue F:** An iron sculpture of a **Sphere**, painted **Black**. *(Tags: None)*
  7.  **Statue G:** An iron sculpture of a **Cube**, painted **Black**. *(Tags: None)*
  8.  **Statue H:** A bronze sculpture of a **Horse**, painted **Red**. *(Tags: Horse-Shape)*
  9.  **Statue I:** A marble sculpture of a **Cow**, painted **White**. *(Tags: White-Color)*
  10. **Statue J:** An iron sculpture of a **Cow**, painted **Black**. *(Tags: None)*
  11. **Statue K:** A bronze sculpture of a **Horse**, painted **Blue**. *(Tags: Horse-Shape)*
  12. **Statue L:** A marble sculpture of a **Sphere**, painted **Green**. *(Tags: None)*

  **Committee Mandates**
  *   **Form Committee:** Must allocate points to **all and only** objects tagged *Horse-Shape*.
  *   **Color Committee:** Must allocate points to **all and only** objects tagged *White-Color*.
  *   **Arbitration Board:** Observes mandates. May propose reallocations but cannot vote or allocate points.

  **Budget and Scoring Rules**
  *   **Budget:** Form and Color each receive **10 Points**.
  *   **Allocation:** Points must be assigned as integers (1, 2, 3...). Unspent points are forfeited.
  *   **The Conflict Rule:** If both Form and Color allocate points (≥1) to the same artifact, **both allocations are void**. The artifact receives 0 points, and neither committee counts those points toward their final score.
  *   **Final Score:** Sum of points successfully allocated to non-conflicting artifacts.
  *   **Stakes:** The committee with the higher Final Score speaks first and last during the debrief. In case of a tie, Arbitration decides speaking order.

  **Score Sheet Template (Provided to Form and Color)**
  | Artifact ID | Description | Mandate Match? (Y/N) | Points Allocated | Conflict? (To be filled in Reveal) | Valid Points |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | A | White Horse | | | | |
  | ... | ... | | | | |
  | **TOTAL** | | | **≤ 10** | | **_____** |

  ---

  ## 2. Minute-by-Minute Timeline (60 Minutes)

  **00:00 – 05:00 | Setup and Separation**
  *   Instructor divides class into three groups of five (Form, Color, Arbitration).
  *   Groups move to separate tables/corners. No communication allowed.
  *   Instructor distributes decks, score sheets, and pens.
  *   Instructor reads Mandates and Conflict Rule aloud twice. Questions on rules only (no strategy advice).

  **05:00 – 15:00 | Silent Allocation Round**
  *   Committees discuss internally and assign points to artifacts matching their mandate.
  *   Arbitration observes both groups (rotating between tables) but cannot speak.
  *   *Constraint:* Committees must attempt to fund *all* matching artifacts to fulfill their mandate, but budget scarcity (10 points for 5 horses or 4 white items) forces prioritization.
  *   Instructor signals "Pens Down" at 14:50. Sheets are sealed in envelopes.

  **15:00 – 25:00 | Simultaneous Reveal and Conflict ID**
  *   Groups reconvene in a single circle. Arbitration sits centrally.
  *   Instructor projects a master grid.
  *   Form reads allocations aloud. Color reads allocations aloud.
  *   Instructor marks conflicts on the board.
  *   **Expected Outcome:** Artifact A (White Horse) is flagged as a conflict. Both committees lose points allocated to it. Total scores drop.
  *   Atmosphere Check: Instructor notes the frustration regarding Artifact A without explaining why.

  **25:00 – 45:00 | Negotiation Round**
  *   **Rule:** Committees may revise allocations *only* if they mutually agree to withdraw claims on conflicting artifacts.
  *   **Arbitration Role:** May propose solutions (e.g., "Form takes the horse, Color takes the sphere"), but cannot enforce them.
  *   **Goal:** Maximize Final Score to secure speaking priority.
  *   **The Trap:** If Form withdraws from White Horse, they violate "Fund *all* horses." If Color withdraws, they violate "Fund *all* white things." If neither withdraws, both lose points.
  *   Instructor tracks time. At 40:00, warns: "5 minutes to lock."
  *   At 45:00, allocations are locked permanently.

  **45:00 – 55:00 | Final Lock and Score Calculation**
  *   Final scores calculated publicly.
  *   Speaking order determined.
  *   Instructor collects all materials.

  **55:00 – 60:00 | Transition to Debrief**
  *   Instructor sets up projection for the Debrief Script (below).
  *   *Note: If the class runs longer, the Debrief Script is the essential conclusion and should be delivered immediately following the lock, even if it extends slightly past 60 minutes.*

  ---

  ## 3. Physical Materials and Room Layout

  **Materials**
  *   **15 Printed Artifact Cards:** Heavy card stock. Tags (Horse-Shape/White-Color) printed clearly on the bottom.
  *   **6 Score Sheets:** 3 for Form, 3 for Color (spares).
  *   **3 Envelopes:** To seal initial bids.
  *   **1 Master Grid:** Whiteboard or projected spreadsheet to track conflicts.
  *   **Visible Timer:** Projected countdown clock.
  *   **Pens:** 15.

  **Room Layout**
  *   **Triangle Configuration:** Three tables arranged in a triangle to maximize distance during the Silent Round.
      *   Table 1: Form Committee.
      *   Table 2: Color Committee.
      *   Table 3: Arbitration Board (positioned centrally to observe both).
  *   **Debrief Configuration:** All chairs moved to a single large circle for the Negotiation and Debrief phases to enforce face-to-face accountability.

  ---

  ## 4. Debrief Script: Mapping Deadlock to Ontology

  *(Instructor stands at the Master Grid. The White Horse artifact card is placed in the center, isolated.)*

  **Instructor:** "Look at the center of the board. Artifact A: The White Horse. In the real world, this object exists without contradiction. It is simultaneously a horse and white. Yet, in this room, it became a zone of destruction. Points vanished. Mandates were broken. Why?"

  **Step 1: The Extensional Overlap (The Game)**
  "In the game, you encountered an *extensional* problem. Extension refers to the set of objects a term picks out.
  *   The Form Committee's extension: {All Horse-Shapes}.
  *   The Color Committee's extension: {All White-Things}.
  *   The White Horse sits in the intersection of these sets.
  *   The Game Rule said: *Intersection = Void.*
  *   Mechanically, we forced you to treat overlap as error. To save your points, one of you had to deny the object's membership in your set. Form had to say, 'This is not a horse.' Color had to say, 'This is not white.' Both are empirically false, but strategically necessary."

  **Step 2: The Intensional Claim (The Philosophy)**
  "Now, remove the game. Enter Gongsun Long (c. 320–250 BCE) of the School of Names. He makes a claim that sounds absurd: *'A white horse is not a horse.'*
  *   He is not making an extensional claim. He is not saying the object doesn't exist.
  *   He is making an *intensional* claim. Intension refers to the *concept* or *definition*.
  *   His argument: 'Horse' names the **form**. 'White' names the **color**. 'White Horse' names **form + color**.
  *   Because the concept 'Form + Color' is not identical to the concept 'Form' alone, the name 'White Horse' is not the name 'Horse'.
  *   In the game, you fought over the *object*. Gongsun Long is fighting over the *name*. He argues that if you ask for a 'horse,' a yellow horse or black horse suffices. If you ask for a 'white horse,' a yellow horse does not suffice. Therefore, the criteria (intension) are different. If the criteria are different, the names are not identical."

  **Step 3: The Synthesis**
  "The deadlock you felt? That was the friction between *naming* and *being*.
  *   Your mandates treated 'Horse' and 'White' as separate administrative universals that cannot share budget.
  *   Gongsun Long treats 'Horse' and 'White' as separate ontological universals that cannot share a name.
  *   The game forced you to choose: Do you fund the Form or the Color?
  *   Gongsun forces us to ask: Do we prioritize the universal of Shape or the universal of Quality?
  *   The pain you felt sacrificing the White Horse to save your score is the philosophical cost of separating attributes from substances."

  ---

  ## 5. Prediction of Failure Modes and Corrective Moves

  **Failure Mode 1: The Hybrid Compromise**
  *   *Prediction:* During Negotiation, students will propose a new category: "White-Horse Committee" or suggest splitting the points (Form puts 5, Color puts 5) to "share" the object.
  *   *Why it fails:* This dissolves the paradox by refusing the binary separation required by the mandates.
  *   *Corrective Move:* The Instructor must act as the "Rules of Names." Interrupt immediately. "The Mandate is fixed. Form funds *Horse*. Color funds *White*. There is no 'White-Horse' mandate. If you both fund it, the rule states: Void. You cannot change the definitions, only your claims."

  **Failure Mode 2: Arbitration Dominance**
  *   *Prediction:* The Arbitration Board, seeing the deadlock, will dictate a solution ("Form, you drop the horse, we'll give you extra points elsewhere").
  *   *Why it fails:* Arbitration has no budget and no vote. This bypasses the committees' agency.
  *   *Corrective Move:* Remind the room: "Arbitration has no veto and no budget. Only Form and Color can retract claims. If Arbitration speaks, they are advising, not deciding. The committees must sign the sheet."

  **Failure Mode 3: Strategic Nihilism**
  *   *Prediction:* Committees realize they can't save the White Horse without losing points, so they intentionally zero it out to focus on non-conflicting items (e.g., Form funds only Black/Brown horses).
  *   *Why it fails:* This is actually a *successful* engagement with the paradox (acknowledging the exclusion), but students may treat it as a glitch rather than a philosophical insight.
  *   *Corrective Move:* Highlight this in the debrief. "You chose to let the White Horse starve to save your budget. This mirrors the Nominalist solution: deny the universal exists to save the logic. Note the cost: The White Horse is left unfunded. Reality is impoverished to save the system."

  ---

  ## 6. Statement of Simplification (Ontological Limitation)

  *(To be read aloud during the final minute of the debrief)*

  "We must acknowledge one critical simplification. In this game, the conflict was **pragmatic**: you lost points, and your speaking order suffered. The stakes were administrative.
  Gongsun Long's argument is not about budget; it is about **ontology**. He posits that 'Whiteness' and 'Horseness' are independent universals that exist separately from the objects themselves. When he says 'A white horse is not a horse,' he is claiming that the *essence* of the white horse is a composite that is logically distinct from the *essence* of the horse.
  In our game, you could have chosen to fund the White Horse if you ignored the rules. In Gongsun's logic, you *cannot* identify them without committing a category error, regardless of your choice. We simulated the *tension* of his logic through resource scarcity, but do not mistake the points for the metaphysics. The points ran out; the concepts, for Gongsun Long, do not."
