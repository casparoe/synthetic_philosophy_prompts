  **FROSTLINE LOGISTICS LTD**
  **Human Capital & Ethical Compliance Division**
  **Peterborough Distribution Centre**

  **ANNUAL PERFORMANCE & MORAL WORTH APPRAISAL**
  **Employee:** Okafor, Delia (Warehouse Supervisor)
  **Reviewer:** Vance, Dr. E. (Head of People)
  **Period:** FY 2023

  **1. SUMMARY OF ACHIEVEMENTS**
  *   **Incident A (March):** Re-entered smoke-compromised Loading Bay 4 to extract colleague (J. Miller).
  *   **Incident B (June–Sept):** Covered 144 shift hours for colleague (S. Patel) during oncology treatment.
  *   **Compliance:** 100% adherence to revised Staff Handbook (v.4.1).

  **2. MOTIVE ANALYSIS**
  Whilst the outcomes above align with company values, moral worth is not derived from consequences. Regarding Incident A, evidence suggests affinity for Mr. Miller. Actions stemming from friendship or adrenaline are pathological (inclination-based), not moral. Regarding Incident B, self-reported feelings of "warmth" indicate sympathy, not duty. Sympathy is a temperament, not a virtue.

  Furthermore, Handbook adherence in H2 indicates a shift towards rule-following. However, acting *because* the Handbook identifies a duty constitutes a fetishism of the law. This is a third-personal motivation (doing right to be seen as doing right, or to satisfy the system) rather than a first-personal recognition of the categorical imperative. You cannot aim at duty without corrupting the motive.

  **3. MOTIVE PURITY INDEX (MPI)**
  **Score:** 14/100
  **Rating:** Below Threshold (Inclination Dominant)

  **4. AREAS FOR DEVELOPMENT**
  The employee must recognise that neither emotional impulse nor conscious compliance qualifies. To act from duty, one must act without regard for inclination *and* without regard for the rule as an external object. The core temperature of altruism must be absolute zero.

  **5. TARGET FOR NEXT YEAR**
  Perform a required duty spontaneously, without prior contemplation, without emotional reward, and without reference to the Handbook, whilst remaining able to articulate the maxim upon request.

  **6. EMPLOYEE COMMENTS**
  I note the double bind. If I act from feeling, I fail. If I act from rule-following, I fail. If the motive must be inaccessible to introspection to be pure, then no intentional action can satisfy the MPI. Additionally, Dr. Vance's salary is contingent on the propagation of this scheme. Does this financial inclination not vitiate the moral worth of her own assessments?

  **7. HR DIRECTOR RESPONSE**
  The framework is axiomatic; paradox does not invalidate the metric.
  Compensation structures belong to the realm of legality, not morality.
  Proceed with Performance Improvement Plan.

  **Signed:** _______________ **Date:** _______________
