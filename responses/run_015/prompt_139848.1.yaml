          *   *Finks/Masks:* The legal doctrine *tries* to distinguish these but lacks the metaphysical tools.
              *   *Entrapment as Mimicry:* The innocent person induced by police is more like a "mimic" (behavior looks like crime, but no underlying disposition) than a mask/fink.
              *   *The "Fink" Problem:* If pressure removes the disposition (honest person breaks under torture), the law struggles.
              *   *The "Threshold" Problem:* The user's point about "everyone has a price" is crucial. The law pretends disposition is binary (predisposed/not), but it's actually scalar (threshold of temptation). The legal test tries to find a "normal range" of temptation.
          *   *Conclusion on Part 1:* The law presupposes a *Realist* view of dispositions (they are real internal states), but operates with a *Behaviorist* evidentiary standard (past acts prove the state). This creates the tension.

      *   **Part 2: Underdetermination (Subjective vs. Objective Tests):**
          *   *Subjective Test (Defendant-focused):* Committed to the metaphysical claim. "Did the seed exist in the soil?" It requires the disposition to be an intrinsic property.
          *   *Objective Test (Police-focused):* Committed to a *Normative* claim. "Was the state's conduct acceptable?" It doesn't care about the defendant's metaphysics, only the state's ethics.
          *   *Divergence:* They do *not* presuppose the same theory. One is ontological (about the person), the other is deontological (about the state).
          *   *Statistical vs. Individual:* The objective test implies a "reasonable person" standard (statistical/normative), whereas the subjective test is individualistic.

      *   **Part 3: The Deflationary Shift:**
          *   *Deflationary View:* Predisposition = Past Behavior + Prediction.
          *   *Consequences:*
              *   *Conviction:* If predisposition is just past behavior, first-time offenders in stings are harder to convict (no data). Or, if it's just prediction, anyone who takes the bait *by definition* was predictable, so everyone gets convicted.
              *   *Impossible Crimes:* If the bomb is fake, the "danger" is purely dispositional. If we go deflationary, the harm is the *intent* manifested in action. Impossible attempts remain punishable because the *agent* is the risk, not the specific object.
