          *   *Result:* A deflationary view likely collapses the subjective test (can't prove internal state) and pushes us toward the objective test (limit police power).

      *   **Part 4: Correcting the Setup (The "Gotcha" Check):**
          *   *Terminology:* The user slightly misuses "mask/fink." In philosophy, a mask hides a *real* disposition. A mimic produces the effect *without* the disposition. Entrapment of an innocent person is a *mimic* case. Entrapment of a guilty person who resists until pressure is applied is a *threshold* case.
          *   *The Counterfactual:* The law knows it can't run the control group. That's why it uses *proxies* (prior record, readiness, etc.). It's an epistemic workaround, not a metaphysical solution.
