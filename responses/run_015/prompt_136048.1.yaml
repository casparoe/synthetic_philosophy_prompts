answer: |-
  ### I. Conceptual Mapping Matrix: Sociology/Philosophy $\leftrightarrow$ Mechanism Design

  Before restating the paradox, we must establish the translation dictionary. Below, I map the sociological and normative nodes of the Gender-Equality Paradox (GEP) onto mechanism-design (MD) constructs. I explicitly flag where the isomorphism breaks.

  | Sociological/Philosophical Node | Mechanism Design Node | Correspondence Status | Notes on Failure/Residue |
  | :--- | :--- | :--- | :--- |
  | **Biological Predisposition** | **Exogenous Agent Type ($\theta_i$)** | **High** | MD assumes types are fixed draws from a distribution $F(\theta)$. This maps cleanly to "innate disposition." |
  | **Formal Gender Equality** | **Symmetric Allocation Rule ($\phi$)** | **High** | Legal equality translates to a mechanism where $\phi$ does not condition on gender identity $g_i$. |
  | **Occupational Segregation** | **Low Entropy in Matching ($\mu$)** | **High** | Segregation is a statistical clustering of types into subsets of the outcome space. |
  | **Cultural Flexibility / Norms** | **Preference Domain / Utility Weights** | **Partial** | Norms can be modeled as constraints, but often function as *preference shapers*. MD typically treats preferences as primitive, not endogenous to the mechanism. |
  | **Structural Injustice** | **Asymmetric Transaction Costs / Outside Options** | **Partial** | Injustice is often modeled as binding constraints (budget/IR). However, philosophical "injustice" often concerns the *history* of the type distribution, which MD takes as given. |
  | **Autonomy / Agency** | **Incentive Compatibility (IC)** | **Low** | MD defines autonomy as strategy-proofness (truth-telling is optimal). Philosophy defines it as the capacity to form preferences without coercion. IC ensures revelation, not formation. |
  | **Justice / Fairness** | **Social Choice Criterion (Equity/Envy-freeness)** | **Low** | MD equity evaluates the *allocation*. Philosophical justice often evaluates the *process of preference formation* (adaptive preferences). |

  ---

  ### II. Formal Restatement of the Gender-Equality Paradox

  Let there be a two-sided matching market between Agents $I$ (workers/students) and Institutions $J$ (occupations/majors).
  Let $g_i \in \{M, F\}$ denote a observable characteristic of agent $i$.
  Let $\lambda \in [0,1]$ denote a parameter of the institutional environment representing **Formal Equality**.
  *   As $\lambda \to 1$, the allocation rule $\phi_\lambda$ becomes strictly gender-blind (no direct discrimination).
  *   As $\lambda \to 1$, binding budget constraints and legal barriers are relaxed for all $i$.

  **The Paradoxical Observation:**
  Empirically, we observe a positive correlation between $\lambda$ and the degree of segregation in the matching $\mu$.
  $$ \frac{\partial}{\partial \lambda} \text{Segregation}(\mu_\lambda) > 0 $$
  In high-$\lambda$ environments (Nordic models), the conditional distribution of matches $P(J|g_i)$ diverges more sharply than in low-$\lambda$ environments (developing economies), despite the removal of explicit constraints.

  In revealed-preference terms: As the feasible set $B_i$ expands uniformly, the revealed choices of group $F$ and group $M$ become *less* similar, not more.

  ---

  ### III. Mechanism-Design Translations of the Three Interpretations

  Here I translate the three explanatory narratives into precise mechanism-design problems.

  #### 1. The Innate Disposition Hypothesis (Essentialism)
  *   **Agent Types:** Types $\theta_i$ are drawn from group-specific distributions $F_F(\theta) \neq F_M(\theta)$. These types represent fixed utility weights over occupational attributes (e.g., "people-orientation" vs. "thing-orientation").
  *   **Allocation Mechanism:** In low-$\lambda$ societies, the mechanism $\phi_{low}$ imposes binding constraints (e.g., entry barriers, budget constraints) that force agents into suboptimal matches (violating Individual Rationality or Efficiency).
  *   **Revealed Preference:** In high-$\lambda$ societies, constraints are lifted. The mechanism becomes Incentive Compatible (IC) and Efficient. Agents truthfully reveal $\theta_i$.
  *   **Social-Choice Criterion:** **Pareto Efficiency.** The high-segregation outcome is superior because it reflects truthful revelation of private information without distortion.
  *   **Translation:** The paradox is an artifact of moving from a constrained optimization problem to an unconstrained one. The divergence in $\mu$ simply reveals the divergence in $F(\theta)$.

  #### 2. The Culturally Liberated Choice Hypothesis (Expressive Utility)
  *   **Agent Types:** Types $\theta_i$ are not fixed; they are functions of the environment $\lambda$. Specifically, utility functions include an **expressive term**: $U_i(j, \lambda) = v_i(j) + \alpha(\lambda) \cdot \mathbb{I}(\text{gender-congruent})$.
  *   **Mechanism:** In low-$\lambda$ societies, economic necessity (income constraints) dominates the utility function ($\alpha(\lambda) \approx 0$). Agents choose based on survival/wage maximization. In high-$\lambda$ societies, the "price" of expressing identity drops, allowing the expressive term to dominate ($\alpha(\lambda) \uparrow$).
  *   **Revealed Preference vs. Signaling:** Choices in high-$\lambda$ environments are "true" in the sense of being utility-maximizing, but the utility function itself has shifted. This is not distorted signaling; it is a shift in the preference domain enabled by slack resources.
  *   **Social-Choice Criterion:** **Welfare Maximization (with endogenous preferences).** The criterion acknowledges that utility depends on the ability to signal identity.
  *   **Translation:** The paradox arises because the *object* of preference changes with $\lambda$. It is a matching market with **complementarities between income security and identity expression**.

  #### 3. The Structural Justice Failure Hypothesis (Critical Sociology)
  *   **Agent Types:** Types $\theta_i$ may be identical or arbitrarily distributed, but the **cost of revelation** is asymmetric.
  *   **Allocation Mechanism:** While the formal rule $\phi$ is gender-blind ($\lambda \to 1$), there exist hidden **transaction costs** or **social-image externalities** $c(g_i, j)$. For example, a woman entering a male-dominated field incurs a psychological or social cost not captured in the wage $w_j$.
  *   **Revealed Preference vs. Distorted Signaling:** The observed matching $\mu$ is *not* a truthful revelation of $\theta_i$. It is a Bayes-Nash Equilibrium where agents shade their bids/choices to avoid the penalty $c(g_i, j)$. The mechanism is *not* Incentive Compatible for group $F$ in practice, even if it is in theory.
  *   **Social-Choice Criterion:** **Equity / Envy-Freeness.** The outcome is judged unjust not because it is inefficient, but because the *effective opportunity sets* differed due to unpriced externalities.
  *   **Translation:** The paradox indicates a **market failure** due to uninternalized externalities (social norms) that act as asymmetric taxes on specific agent-type/mechanism-outcome pairs.

  ---

  ### IV. The Residue: What Does Not Survive Translation?

  When we force the GEP debate into mechanism-design language, specific normative and sociological claims evaporate or distort. These residues highlight the boundaries of the formalism.

  #### 1. The Genesis of Preferences (Endogeneity)
  *   **The Claim:** Philosophical debates often concern whether preferences are *autonomous* or *adaptive* (e.g., "happy slaves" or "deferential wives").
  *   **The MD Translation:** Mechanism design typically treats preferences as **primitives** (axiomatic). While Interpretation 2 models preferences as dependent on $\lambda$, it still treats the resulting utility function as the sovereign metric for welfare.
  *   **The Residue:** MD has no operator for evaluating the *legitimacy* of the preference formation process itself. If high-$\lambda$ societies socialize women to prefer care work (via subtle cues), MD records this as a valid type $\theta$. The philosophical claim that this preference is "unfree" even if "revealed" has no counterpart in standard IC constraints.
  *   **Blind Spot:** This is a **blind spot in mechanism design**. The formalism assumes **Preference Sovereignty**. It cannot distinguish between a preference revealed under freedom and a preference revealed under hegemonic conditioning, provided both satisfy IC.

  #### 2. Social Image as Externality vs. Constraint
  *   **The Claim:** Sociologists argue that gender norms constitute a social structure, not just individual costs.
  *   **The MD Translation:** We model this as a cost function $c(g_i, j)$ or an externality in utility.
  *   **The Residue:** In MD, externalities are inefficiencies to be internalized (Pigouvian tax). In the philosophical debate, the *existence* of the norm is the injustice, regardless of efficiency. Furthermore, MD struggles with **identity**: if $g_i$ is not just a type but a constitutive part of the self that is *performed* through the matching, the standard model of "agent choosing object" breaks down.
  *   **Blind Spot:** This is partly **non-formalizable** within standard private-value matching. It requires a move to **interdependent values** where my utility depends on your perception of my type, which depends on the aggregate matching $\mu$. This creates fixed-point problems that destabilize standard stability concepts (like Gale-Shapley).

  #### 3. Justice as History vs. Justice as Allocation
  *   **The Claim:** "Structural injustice" often refers to historical accumulation of disadvantage, not just current allocation rules.
  *   **The MD Translation:** We model this as asymmetric outside options or initial endowments.
  *   **The Residue:** Mechanism design is largely **ahistorical**. It evaluates the mechanism $\phi$ at time $t$. If the type distribution $F(\theta)$ at time $t$ is the result of discrimination at $t-1$, a gender-blind $\phi$ at time $t$ is "fair" in MD terms (treats equals equally) but "unjust" in philosophical terms (perpetuates historical inequality).
  *   **Blind Spot:** This is a **blind spot in the Social Choice Function**. Standard SCFs (Utilitarian, Rawlsian) evaluate the vector of utilities $U(\mu)$. They do not evaluate the *path* to $U(\mu)$.

  ### V. Conclusion: Blind Spot or Non-Formalizable?

  Does the residue reveal a technical limitation or a category error?

  1.  **Endogenous Preferences:** This is a **technical blind spot**. Mechanism design *can* model endogenous preferences (e.g., via dynamic mechanisms or psychological game theory), but standard static matching theory excludes them by assumption for tractability. The GEP suggests this assumption is empirically fatal in this context.
  2.  **Normative Genesis:** This is **less formalizable**. The question "Is this preference truly autonomous?" is a metaphysical claim about the agent's will, not an observable constraint on the choice set. Unless we define "autonomy" as a specific constraint on the information structure (e.g., "no manipulation of beliefs"), it remains outside the allocation-theoretic language.
  3.  **Structural Justice:** This is a **modeling choice**. We *can* model norms as asymmetric costs. However, doing so reduces "justice" to "efficiency with corrected prices." If the philosophical claim is that certain markets (e.g., gendered labor) should not exist or should be decommodified, mechanism design (which presupposes a market/matching structure) cannot capture the critique.

  **Final Verdict:** The Gender-Equality Paradox survives translation only if we relax the assumption of **exogenous, private values**. If we hold standard MD assumptions fixed, the Paradox forces us to accept the Innate Disposition hypothesis as the only technically valid interpretation. To accommodate the other two, the economist must expand the type space to include **socially endogenous utility weights** and acknowledge that **Incentive Compatibility** is necessary but not sufficient for **Normative Autonomy**. The residue is not merely "soft" philosophy; it is the signal of missing variables in the economic model.
