  8.  **Final Polish:** Ensure the tone is mediating, not condescending. Use standard philosophy of science terminology (Glymour, Garber, accommodation vs. prediction). Make sure to address the specific detail about the *obscure* 1970s paper (this is crucial—it's not just old, it was effectively lost).

