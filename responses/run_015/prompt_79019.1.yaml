          *   *Analysis:* Sam states the classic Glymour problem. Dana introduces the epistemic agent constraint. Sam is technically right on strict Bayesianism; Dana is right on scientific practice.

      *   **Round 2: Findability vs. Foresight.**
          *   Sam: If findable counts, anything confirms anything. Theorist gets unearned credit.
