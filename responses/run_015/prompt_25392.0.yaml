      *   **Constraint:** Systematic translation, *not* analogy. Exact vs. Approximate mapping.

  2.  **Deconstruct Heterophenomenology (Dennett):**
      *   *What is it?* A methodological neutralism. It treats the subject's reports (verbal behavior) as the primary data. It constructs a "phenomenological world" (the subject's *seeming* reality) based on those reports. It does *not* assume the reports are infallible (the subject might be wrong about their experience). It aims to explain *why* the subject reports what they do using third-person science (neuroscience, psychology).
      *   *Key Distinction:* The *Heterophenomenological World* (the theorist's construction of what the subject *believes* they experience) vs. The *Real World* (physical reality) vs. The *Phenomenological Reality* (what it's actually like to be the subject). Dennett argues the Heterophenomenological World *is* the only legitimate target for science; "what it's actually like" beyond the reports is either identical to the functional role of those reports or a confused notion.
      *   *The Intentional Stance:* Treating the system as a rational agent to predict behavior.
      *   *The Hard Problem:* Dennett denies the "Hard Problem" exists as traditionally formulated. He thinks explaining the functions (discrimination, reporting, integrating) *is* explaining consciousness.

