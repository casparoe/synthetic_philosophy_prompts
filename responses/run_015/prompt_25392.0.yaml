      *   **Topic:** Daniel Dennett's *Heterophenomenology*.
      *   **Core Intuition:** The user suspects heterophenomenology is just what they already do with LLMs (treat outputs as data, construct imputed beliefs, explain mechanistically).
      *   **Task:**
          1.  Restate heterophenomenology precisely in ML vocabulary (model outputs, behavioral eval, mechanistic explanation, imputed world-models, intentional stance).
          2.  Provide a "Residue Report" addressing three specific questions (clean translations vs. distortions, missing distinctions, methodological vs. ontological claims).
