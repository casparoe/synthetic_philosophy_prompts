  2.  **Deconstruct the Physics and History:**
      *   **Einstein's Position:** It wasn't just "no spooky action." It was about *Realism*, *Locality*, and *Separability*. The EPR paper (1935) argues for incompleteness based on a criterion of reality and the assumption of no instantaneous influence.
      *   **Bell's Theorem (1964):** Shows that *any* local hidden variable theory satisfies certain inequalities. QM violates them.
      *   **Loophole-free Tests (2015):** Hensen et al., Giustina et al., Shalm et al. Closed detection and locality loopholes. Confirms QM violations.
      *   **Device-Independent Randomness:** Uses Bell violations to prove outcomes aren't predetermined, even if the device is a black box. This strikes at the heart of determinism.
      *   **Separability vs. Locality:**
          *   *Separability (Trennungsprinzip):* Systems spatially separated have independent real states. (Einstein's deeper ontological commitment).
          *   *Locality:* No causal influence travels faster than light. (Often conflated, but Separability is the precondition for Locality in Einstein's view).
      *   **Einstein's "Demands":** He wanted a theory describing individual systems (not just ensembles), obeying relativity (no superluminal causation), and possessing objective reality independent of observation.

  3.  **Evaluate Einstein's Potential Reaction:**
      *   *Would he accept the experimental results?* Yes. He respected empirical evidence (e.g., Eddington's eclipse). He wouldn't dispute the data.
      *   *Would he accept the standard interpretation (Copenhagen-ish)?* Highly unlikely. He never accepted the completeness of the wave function.
