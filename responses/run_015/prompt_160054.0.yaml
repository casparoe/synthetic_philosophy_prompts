answer: |-
  Your hypothesis is sharp. You have correctly identified that the surface-level debate about evolutionary biology is a proxy for deeper structural disagreements. As a software engineer, you are viewing this as a system architecture problem: is the module (moral belief) coupled to the data source (moral facts), or is it a hardcoded legacy feature (fitness heuristic)?

  Here is the diagnosis of the stalemate, refined and expanded beyond your two points, followed by an assessment of what progress looks like.

  ### The Diagnosis

  You identified two friction points: **Default Epistemology** and **Counterfactual Tracking**. Both are correct, but they are symptoms of a third, deeper architectural disagreement: **Explanatory Exclusion**.

  **1. The Epistemic Default: "Undermining" vs. "Overriding" Defeaters**
  You framed this as "innocent until defeated" vs. "prove reliability." The deeper issue is the *type* of defeater the debunker claims to have.
  *   **The Debunker's Move:** They claim an *undermining* defeater. In code terms: "I found a bug in the random number generator." It doesn't matter if the output *looks* correct; the process is compromised, so confidence drops to prior probability. They argue that once you know the belief is caused by fitness, the link to truth is severed unless re-established.
  *   **The Realist's Move:** They demand an *overriding* defeater. In code terms: "Show me an output that is actually wrong." They argue that knowing the causal origin of a belief is irrelevant unless you can demonstrate that the belief is *false*.
  *   **The Stall:** The debate stalls because there is no agreed-upon rule for when genealogy counts as an undermining defeater. The debunker assumes causal isolation from truth implies epistemic unreliability. The realist assumes reliability is the default state of cognitive faculties unless proven otherwise. Neither side can move because they are arguing about the rules of evidence, not the evidence itself.

  **2. The Counterfactual Mismatch: Sensitivity vs. Safety**
  You noted the disagreement on which variable to hold fixed (facts vs. pressures). This maps to two different epistemic conditions:
  *   **Sensitivity (Debunker):** "If the moral facts were different, would our beliefs change?" (Hold facts fixed, vary evolution). Since evolution is driven by fitness, not truth, the debunker says our beliefs wouldn't change even if the facts were different. Therefore, we don't know the facts.
  *   **Safety (Realist):** "If our beliefs were different, would the facts have to be different?" (Hold evolution fixed, vary facts). The realist argues that given our evolutionary history, we couldn't easily have had different beliefs *unless* the facts were different, because the facts constrain what is fitness-conferring.
  *   **The Stall:** There is no consensus in epistemology on whether knowledge requires Sensitivity or Safety. The EDA debate is importing this unresolved general epistemological fight into metaethics. Without settling the general theory of knowledge, the specific moral application cannot resolve.

  **3. The Hidden Engine: Explanatory Exclusion (Zero-Sum vs. Layered)**
  This is the part missing from your hypothesis, and it is likely the primary driver of the deadlock. It concerns the relationship between the *evolutionary explanation* and the *moral explanation*.
  *   **The Debunker (Zero-Sum):** They treat explanations as competing resources. If evolution explains 100% of why we hold a belief, there is 0% explanatory work left for moral facts to do. If the belief is fully explained by fitness, positing moral facts is redundant (Occam's Razor).
  *   **The Realist (Layered/Compatible):** They treat explanations as operating at different levels of abstraction. Evolution explains the *capacity* and the *bias* (the hardware), while moral facts explain the *content* and *justification* (the software logic). They argue that explaining *why we believe* does not automatically explain *whether it is true*.
  *   **The Stall:** The debunker sees the realist's "Third Factor" (something that causes both fitness and truth) as a magic variable that saves the model without evidence. The realist sees the debunker's "Explanatory Exclusion" as a category error (confusing cause with justification).

  ### What Would Count as Progress?

  Given this diagnosis, empirical findings about evolutionary psychology will not solve the problem. Finding out exactly *which* moral intuitions are innate does not tell us whether those intuitions track truth or just fitness. That is an is-ought gap, not a data gap.

  Progress would require one of the following three shifts:

  **1. A Distinction: Local vs. Global Debunking**
  The debate stalls because it tries to swallow the whole of morality at once. Progress would come from restricting the scope.
  *   *Progress:* Showing that evolution debunks *specific* modules (e.g., tribal loyalty, purity norms) without debunking *others* (e.g., harm reduction, reciprocity).
  *   *Why it helps:* It forces the realist to give up some territory. If the realist admits some intuitions are fitness-heuristics and not truth-trackers, the debunker gains credibility. If the debunker admits some intuitions survive the test, the realist survives. This moves the fight from "All or Nothing" to "Which Modules?"

  **2. An Argument: Mechanism for the Third Factor**
  The realist's "Third Factor" reply is often too abstract.
  *   *Progress:* A concrete model of how a moral fact could causally influence fitness without being a physical force. For example, if "cooperation is good" is a fact, and "cooperation increases fitness" is a biological fact, the realist needs a rigorous argument for why the *normative truth* of cooperation is what links to the *biological success*, rather than just the *behavior* of cooperation.
  *   *Why it helps:* It moves the Third Factor from a philosophical promise to a testable structural claim. If the link is shown to be coincidental, the debunker wins. If the link is shown to be necessary, the realist wins.

  **3. An Honest Admission: Framework Incompatibility**
  It is possible that no progress is possible because the two sides are operating in incompatible epistemic frameworks.
  *   *The Reality:* The debunker is operating with a **Naturalist Epistemology** (all justification must ultimately cash out in causal/natural terms). The realist is often operating with a **Normative Epistemology** (justification exists in a separate logical space).
  *   *Why it stalls:* If you require naturalist justification, moral realism is dead on arrival. If you allow normative justification, the EDA is irrelevant.
  *   *Progress:* Acknowledging that the EDA is not an argument *within* metaethics, but an argument *for* Naturalism *against* Non-Naturalism. This clarifies that the debate is actually about metaphysics, not evolution.

  ### Confidence and Uncertainty

  **Confidence Level: High (85%)**
  I am highly confident that the stalemate is driven by the **Explanatory Exclusion** problem (Zero-Sum vs. Layered) and the **Epistemic Default** (Undermining vs. Overriding). These are structural features of the literature that persist regardless of the specific biological details cited. Your intuition that the evolution part is a "lab coat" for deeper epistemological disputes is correct.

  **Least Sure Part: The Empirical Angle**
  I am least sure about the claim that empirical findings are useless. There is a minority view that if evolutionary psychology can show that our moral judgments are *highly sensitive to irrelevant framing* (e.g., trolley problems changing based on wording), this acts as a specific *overriding* defeater (showing actual falsehood/unreliability) rather than just an *undermining* one. If specific moral beliefs can be empirically demonstrated to be "glitches," the realist's "innocent until defeated" defense crumbles for those specific cases. I am skeptical this scales to *all* morality, but it is the one avenue where data could shift the burden of proof.
