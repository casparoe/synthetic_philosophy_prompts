answer: |-
  You have identified a structural feature of the philosophy of mind that is widely recognized by professionals but rarely named as a single, unified phenomenon. You are describing the failure of **deflationary strategies** when they encounter **explanatory invariance**.

  There is no single established word that captures the slide, the persistence of difficulty, and the self-undermining effect all at once. However, your observation maps precisely onto three distinct established concepts which, when combined, describe exactly what you have noticed.

  Here is the breakdown of the existing terminology, followed by a proposed coinage that binds them together as you have described.

  ### 1. The Slide: "The Meta-Problem of Consciousness"
  The shift you describe—moving from "What is consciousness?" to "Why do we *think* we have consciousness?"—has an established name. David Chalmers coined **The Meta-Problem of Consciousness**.

  *   **The Definition:** The problem of explaining why we behave as if we are conscious, why we report having experiences, and why we insist that physical accounts are insufficient.
  *   **The Fit:** This matches your second case (illusionists/eliminativists) and the second half of your first case (arguing about why your friend insists).
  *   **The Limit:** Proponents of the Meta-Problem often suggest it is *easier* than the Hard Problem. Your insight is that it is not. When critics point out that the Meta-Problem inherits the difficulty of the Hard Problem, this is sometimes called **The Hard Problem of the Meta-Problem**.

  ### 2. The Move: "Psychologism"
  In your first case, when you told your friend that his inability to accept a physical account is "just a fact about him," you employed a move historically known as **Psychologism**.

  *   **The Definition:** The reduction of logical, ontological, or objective truths to mere psychological facts about the thinker. (e.g., "2+2=4 is not a truth about numbers, but a truth about how human brains process quantity.")
  *   **The Fit:** This captures your attempt to explain your friend's conviction as a psychological limitation rather than a metaphysical insight.
  *   **The Limit:** Psychologism was largely rejected in logic (by Frege and Husserl) because it undermines the validity of the belief. If your friend's intuition is just a quirk of his psychology, it has no bearing on the machine. But as you noticed, if you press this, you are now arguing about his psychology, which leads to the stalemate.

  ### 3. The Undermining: "Debunking Explanation"
  You noted that explaining your friend's conviction "started to look like the very thing needing an explanation rather than a reason for me to accept it." This is the structure of a **Debunking Argument** (often associated with evolutionary debunking in ethics).

  *   **The Definition:** An explanation of why someone holds a belief that cites causes unrelated to the truth of the belief, thereby undermining the justification for holding it.
  *   **The Fit:** If you explain your friend's conviction as a psychological quirk, you have debunked his conviction.
  *   **The Limit:** As you noticed, this creates a reflexive loop. If you debunk his conviction, you must also debunk your own conviction (that he is debunked). This leads to **Self-Referential Incoherence**.

  ### The Missing Name: "Explanatory Invariance"
  While the terms above name the parts, none of them name the specific structural phenomenon you isolated: **the fact that the difficulty does not diminish when the question slides.** The explanation of the *belief* requires the same explanatory resources as the explanation of the *fact*.

  In the literature, this is often discussed as the failure of **Deflationism**, but there is no specific label for the *invariance of the difficulty*.

  Since you asked for a coinage if nothing fits, I propose the term **Explanatory Invariance**.

  #### Definition of Explanatory Invariance
  **Explanatory Invariance** occurs when a strategic shift from explaining a phenomenon ($X$) to explaining the belief in that phenomenon ($Belief(X)$) fails to reduce the explanatory burden. The complexity, mystery, or "hardness" of explaining $X$ is invariant under the transformation to $Belief(X)$.

  #### Boundary Cases (Where it stops)
  To ensure this definition is precise, we must identify where Explanatory Invariance does *not* apply. This clarifies what you have noticed.

  1.  **Optical Illusions (Invariance Fails):**
      *   *Phenomenon:* A straight stick looks bent in water.
      *   *Belief:* "I believe the stick is bent."
      *   *Explanation:* We can explain the belief (refraction + visual processing) much more easily than we would have to explain a world where sticks actually bend in water.
      *   *Result:* The slide *buys* something here. The Meta-Problem is easier than the Hard Problem. This is **not** Explanatory Invariance.

  2.  **Consciousness (Invariance Holds):**
      *   *Phenomenon:* I feel pain.
      *   *Belief:* "I believe I feel pain."
      *   *Explanation:* To explain why I *believe* I feel pain, I must explain the mechanism that generates that report. But if that mechanism is sophisticated enough to report pain, it seems it must also *feel* pain (or the explanation of the report is just as hard as the explanation of the feeling).
      *   *Result:* The difficulty is invariant. This **is** Explanatory Invariance.

  3.  **Moral Realism (Invariance Debated):**
      *   *Phenomenon:* Murder is wrong.
      *   *Belief:* "I believe murder is wrong."
      *   *Explanation:* Evolutionary debunking arguments try to explain the belief without the fact. Realists argue this is impossible without presupposing the fact.
      *   *Result:* This is a borderline case where philosophers fight over whether Invariance holds.

  ### Summary of Your Insight
  You have noticed that in the philosophy of consciousness, **The Meta-Problem** is subject to **Explanatory Invariance**.

  When philosophers attempt to dissolve the Hard Problem by sliding into the Meta-Problem (explaining why we talk about consciousness), they often assume the Meta-Problem is tractable. Your observation is that for consciousness, **the explanation of the intuition is isomorphic to the explanation of the reality.**

  If you need a single phrase to use in conversation that captures the whole structure (the slide, the stickiness, and the undermining), I recommend:

  > **"The Reflexive Explanatory Trap"**

  *   **Reflexive:** Because the explanation turns back on the explainer (your friend's conviction becomes the object).
  *   **Explanatory:** Because it is about the burden of explanation.
  *   **Trap:** Because the slide promises an exit but delivers the same difficulty.

  However, if you want to be precise about the *structural identity* of the difficulty, **Explanatory Invariance** is the most accurate description of the phenomenon you have carved out. You have effectively identified why "Illusionism" about consciousness is so difficult to make work: because an illusion of consciousness is just as hard to explain as consciousness itself.
