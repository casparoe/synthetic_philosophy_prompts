  2.  **Deconstruct Braudel's *Longue Durée*:**
      *   Three levels of time:
          1.  *Longue durée* (structural time): Geography, climate, slow social changes (centuries/millennia).
          2.  *Conjonctures* (cyclical time): Economic cycles, demographic trends (decades/centuries).
          3.  *Événementielle* (event time): Wars, treaties, individual actions (days/years).
      *   The story needs to privilege level 1, marginalize level 3, and show the frustration of a human mind craving level 3 while being submerged in level 1.

  3.  **Setting the Scene:**
      *   "Muddy future Venice." Let's call it the Delta Repository.
