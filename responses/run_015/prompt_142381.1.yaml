  2. Dev is correct that gratitude directed at the wrong people is not a neutral error but a continuation of the original injustice, effectively evicting the victims a second time. A community paying debts to the dead cannot claim moral coherence while honoring the descendants of those who enabled the eviction.

  3. Marta rightly notes that archives favor the powerful, but she fails to see that Dev's evidence exposes a specific betrayal rather than just a competing narrative. Claiming all memory is equally constructed undermines her own defense of the Walk as a unique, stabilizing tradition.

  4. Dev wins this exchange because a vow based on a falsehood is not a binding commitment but a delusion, and moral integrity requires the capacity for correction. Marta's definition of a vow as immune to evidence renders the practice brittle rather than enduring, ensuring it will break when the truth becomes unavoidable.

