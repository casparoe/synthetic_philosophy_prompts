      *   *Darkroom/Developing* $\to$ *Sampling/Denoising Process* (Turning the raw potential into the final image.)
      *   *Subject Matter* $\to$ *Concept/Prompt* (In photography, the subject exists in the world. In AI, the subject exists in language/latent space.)

  3.  **Analyzing the "Light/Photons" Question:**

