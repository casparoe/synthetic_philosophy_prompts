answer: |-
  The bottom line is that there isn't a stable distinction between a creative leap and a category error when you're actually thinking them—both come from the same engine, so those historical "mistakes" were basically unavoidable costs of doing business.

  Here's the thing: if Hofstadter and Sander are right that analogy *is* cognition, then you can't switch the mechanism off to avoid "bad" analogies. You're always mapping. The difference between a brilliant insight and a category error isn't in the structure of the thought itself; it's in how much pressure that analogy can withstand from other analogies down the line. In the moment, a scientist grabbing onto the thermostat model for the brain is doing the exact same cognitive work as a neuroscientist grabbing onto the neural network model today. They're both spotting a surface feature—feedback loops, or parallel processing—and betting it reveals the essence.

  That's why domain boundaries don't exactly dissolve, but they stop being walls and start looking more like fences we build after the fact. We tend to think boundaries exist first and then we make analogies across them, but H&S would say the analogies come first and the boundaries crystallize around the ones that stick. So a "category error" is just an analogy that failed to generate a stable boundary because it couldn't sustain the weight of further explanation.

  Regarding your cybernetics example, yes, those missteps are structural inevitabilities. We never access essences directly; we only ever touch surfaces. We need a concrete handle to pull the abstract idea out of the fog. The thermostat wasn't a lie; it was the best available surface to grip the essence of "regulation" at that time. Once the field matured, the surface cracked under pressure, and we swapped it for the computer surface to grip the essence of "computation." But you couldn't have gotten to the second without the first, because the first one built the vocabulary and the conceptual space necessary to even ask the deeper questions.

  So for your seminar, I'd argue we shouldn't teach students to avoid "wrong" analogies. That's impossible. The trick is to teach them to ride the analogy hard but stay light on their feet—knowing that the surface they're standing on might turn into a trapdoor, and that's not a failure of thinking, it's just how the thinking works.
