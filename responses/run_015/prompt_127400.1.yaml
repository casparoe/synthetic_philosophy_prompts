prompt: |-
  I'm trying to figure out what actually matters in lexical-threshold negative utilitarianism, especially the part where people assume pleasure and pain sit on one scale but maybe they don't. There's this framing I've been playing with — call it the inter-modality problem — where physical suffering in one kind of mind might not be the same "currency" as a dull existential dread in another architechture, and if they're genuinely incommensurable then saying "any pain lexically trumps any pleasure" starts to feel underspecified rather than just extreme. So if you had about two years to think about this alone, no lab, no web searches needed, which open conceptual questions should you actually prioritize? I'm not asking for a biblography or a reading list — just a defended ordering. Which problems are upstream of the rest, which are tractable with pure conceptual work or maybe a little formal modeling, and which should you drop because answering them wouldn't shift the practical upshot? Specifically, does resolving whether there's a single phenomenal scale have to come before we can even talk about inter-modality commensurability, or can those run in parallel? And is the lexical-threshold view itself salvageable if we accept that different modalities of suffering can't be summed on one axis? Give me the reasoning behind the ranking — I care more about why one question is worth the years than about a survey of everything that's unresolved.
