answer: |-
  ### Desiderata for an Adequate Theory of Dispositions

  To frame the seminar, we must establish the criteria by which any metaphysical account of dispositions will be judged. These requirements are derived from the failure modes of previous analyses and the specific challenges posed by dynamic systems like System S.

  **1. Extensional Adequacy (The Negative Constraint)**
  *   **Requirement:** The theory must correctly classify cases of possession and non-possession of dispositions in the face of interfering factors.
  *   **Motivation:** The **Electro-Fink** demonstrates that a simple conditional analysis fails because the disposition can vanish exactly when the stimulus is applied. **Static Masking** shows that a disposition can exist without manifesting due to external blockers. A theory that classifies a masked object as lacking the disposition, or a finkish object as possessing it (when the stimulus is present), is extensionally inadequate.
  *   **Status:** **Non-negotiable.** A theory that cannot map onto the intuitive data of possession is descriptively false.

  **2. Base Integrity and Diachronic Identity (The System S Constraint)**
  *   **Requirement:** The theory must distinguish between a disposition being *masked* (prevented from manifesting) and the dispositional *base being altered or destroyed*. Furthermore, it must account for path-dependence: if the base is modified by the masking interaction, the theory must specify whether the original disposition persists, is modified, or ceases to exist.
  *   **Motivation:** **System S** presents a recursive mask. The regulatory layer does not just block binding; it structurally alters the catalytic base upon interaction with substrate B. When B is removed, the base is not identical to its prior state. A theory must explain whether the disposition to bind A is the *same* disposition (now modified) or a *new* disposition. It must avoid treating the base as a static substrate that merely "holds" the disposition.
  *   **Status:** **Non-negotiable.** Failure here renders the theory incapable of modeling complex scientific systems where properties are history-sensitive.

  **3. Modal Grounding (The Explanatory Constraint)**
  *   **Requirement:** The theory must explain *why* the manifestation occurs, grounding the modal truth (what the object *can* or *would* do) in something more robust than mere regularity or linguistic convention.
  *   **Motivation:** Dispositions are invoked to explain potentiality and causal capacity. If the analysis reduces dispositions to truth-conditions of counterfactuals without an ontological ground, it fails to explain *why* the counterfactual is true. We need to know what makes the statement "S would bind A" true when B is absent.
  *   **Status:** **Non-negotiable.** Without modal grounding, the theory collapses into Humean regularity, losing the specific explanatory power of dispositional talk.

  **4. Non-Circularity (The Analytical Constraint)**
  *   **Requirement:** The analysis of the disposition must not presuppose the very notion of disposition (or a cognate like "cause" or "power") in the specification of the stimulus or manifestation conditions.
  *   **Motivation:** Classic analyses often fail because they define the disposition in terms of a manifestation that is itself defined dispositionally (e.g., "fragile" means "breaks when struck," but "struck" may imply "force applied," which is causal/dispositional). In **System S**, defining the masking condition requires referencing the regulatory layer's *disposition* to inhibit. A theory must avoid infinite regress.
  *   **Status:** **Relaxable.** Strict analytic non-circularity may be impossible for primitive concepts. We may accept a degree of interdefinition if the ontological picture is coherent.

  **5. Intrinsicness (The Locality Constraint)**
  *   **Requirement:** The disposition should be grounded in the intrinsic properties of the bearer, not merely in its extrinsic relations.
  *   **Motivation:** Intuitively, fragility is in the glass, not in the hammer. However, **Fink cases** and **System S** suggest that extrinsic factors (the fink mechanism, the regulatory layer) determine whether the disposition manifests or even persists.
  *   **Status:** **Relaxable.** This is the primary casualty of the Fink/Mask dialectic. We may need to accept that dispositions are relational or extrinsic-involving to save Extensional Adequacy.

  ---

  ### Tensions and Jointly Unsatisfiable Pairs

  **Tension A: Simplicity vs. System S Complexity**
  *   **Conflict:** There is a direct tension between **Ontological Parsimony** (often a goal of Conditional Analyses) and **Base Integrity (System S)**. A simple conditional schema ("If stimulated, then manifest") cannot easily encode the history-sensitive, path-dependent structural changes of System S without becoming so complex that it loses its analytic utility. To accommodate System S, the theory must likely posit a complex ontology of dynamic bases rather than simple conditionals.
  *   **Resolution:** Parsimony must be sacrificed for Extensional Adequacy.

  **Tension B: Intrinsicness vs. Extensional Adequacy**
  *   **Conflict:** Maintaining **Intrinsicness** is jointly unsatisfiable with full **Extensional Adequacy** regarding Finks and Masks. If the disposition is purely intrinsic, the presence of an extrinsic fink or mask should not alter the possession conditions, yet intuitively (and extensionally), they do affect the manifestation and sometimes the possession itself (in Fink cases).
  *   **Resolution:** Intrinsicness is the requirement to be relaxed. We must accept that dispositions may be extrinsic or relationally constituted.

  ---

  ### Evaluation of Contenders

  #### 1. Standard Conditional Analysis (SCA)
  *   **Core Claim:** Dispositions are reducible to subjunctive conditionals (e.g., *x* is disposed to *m* if *s* iff if *x* were *s*, *x* would *m*).
  *   **Performance:**
      *   **Extensional Adequacy:** **Fatal Failure.** Collapses immediately on Electro-Fink and Masking cases. It cannot distinguish between a disposition being absent and a disposition being masked without ad-hoc *ceteris paribus* clauses that beg the question.
      *   **System S:** **Fatal Failure.** Cannot account for the path-dependent alteration of the base. The conditional is static; System S is dynamic. SCA has no resources to track the *change* in the disposition's identity following the masking event.
      *   **Modal Grounding:** **Failure.** Offers a translation of modal claims, not a ground for them.
      *   **Verdict:** Rejected. It is conceptually too brittle for the seminar's focus.

  #### 2. Realist Powers Ontology (Mumford-style)
  *   **Core Claim:** Dispositions are irreducible, real properties (powers) that are distinct from their categorical bases (or identify the base as potent). Manifestation is the exercise of this power, potentially involving partner powers.
  *   **Performance:**
      *   **Extensional Adequacy:** **Success.** Powers exist even when masked. A fink removes the power; a mask blocks the exercise. The distinction is ontologically clear.
      *   **System S:** **Partial Success.** Can accommodate the masking as an interaction of powers (inhibitor power vs. catalytic power). However, it faces a challenge on **Diachronic Identity**: if the base is structurally altered, is it the *same* power? This view requires a robust account of power individuation that allows for modification without total replacement.
      *   **Modal Grounding:** **Success.** Powers are the truth-makers for modal claims.
      *   **Verdict:** Strong contender. The main burden is explaining the *metamorphosis* of the power in System S without positing a new entity at every time-step.

  #### 3. Dispositional Essentialism (Bird-style)
  *   **Core Claim:** Properties *are* essentially dispositional. The identity of a property is fixed by its causal profile (stimulus/manifestation pair). Laws of nature are metaphysically necessary consequences of these essences.
  *   **Performance:**
      *   **Extensional Adequacy:** **Success.** Like Realist Powers, it posits real properties that persist through masking.
      *   **System S:** **Risk of Failure.** Because property identity is tied to essential causal profiles, System S presents a dilemma. If the catalytic base is structurally altered such that its causal profile changes (even if it still binds A, but perhaps with different kinetics or conditions), Dispositional Essentialism risks claiming the *property itself* has ceased to exist and been replaced by a new one. This might be too rigid for biological/chemical systems where functional continuity matters more than strict essential identity.
      *   **Modal Grounding:** **Success.** Strongest on modality (necessitarianism).
      *   **Verdict:** Strong, but potentially too rigid for the dynamic, path-dependent nature of System S. It may need to relax the "essential identity" constraint to allow for property evolution.

  ### Summary for Framing
  The seminar should proceed with the understanding that **Extensional Adequacy** and **Modal Grounding** are the hard constraints. **Intrinsicness** and **Simplicity** are the sacrificial lambs. The core philosophical work will lie in choosing between a **Realist Powers** view that allows for dynamic power modification (accommodating System S) versus a **Dispositional Essentialist** view that risks fragmenting property identity in the face of path-dependent change. The Standard Conditional Analysis is to be treated as a historical foil that demonstrates why we need a robust ontology.
