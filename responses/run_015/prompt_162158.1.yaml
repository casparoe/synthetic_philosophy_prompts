answer: |-
  ### Exam Question

  **Time Allowed:** 45 Minutes
  **Word Limit:** Approximately 800 words
  **Marks:** 20

  **Question:**

  Consider the St. Petersburg game: a fair coin is tossed until it lands Heads. If Heads appears on toss $k$, the payoff is $2^k$ dollars. A proponent argues the paradox is dissolved by three moves: (1) capping payoffs at the house's wealth $W = 2^N$; (2) appealing to repeated play to vindicate expected value; and (3) imposing a bounded utility function.

  Write an essay assessing this dissolution. You must:
  1.  Assume the payoff is capped at $2^N$ for all $k > N$. Derive the expected monetary value (EMV) of this capped game and explain why an EMV of roughly $N$ dollars for a top prize of $2^N$ remains counterintuitive.
  2.  Evaluate the repeated-play defense. Explain why the running average payoff does not settle to a constant, how the total payoff scales with the number of plays $n$, and calculate the approximate number of plays required to vindicate a \$25 entry fee.
  3.  Explain why capping payoffs fails if the stakes are non-monetary goods (e.g., lives saved) rather than currency.
  4.  Demonstrate how infinite expectations violate statewise dominance, rendering choice indeterminate.
  5.  Distinguish between expected payoff, subjective worth, and acceptance price. Conclude by stating the theoretical cost of adopting a bounded utility function to resolve these issues.

  No external citations are permitted. Define all terms used.

  ***

  ### Model Answer

  The proponent's dissolution attempts to tame the St. Petersburg paradox by forcing the game into finite, empirical bounds. However, this merely relocates the puzzle from infinity to the structure of rational valuation itself.

  First, consider the capped game. Let the payoff be $2^k$ if Heads occurs on toss $k$, provided $k \le N$. If $k > N$, the payoff is capped at $2^N$. The probability of the game ending on toss $k$ is $1/2^k$. The expected monetary value (EMV) is the sum of probability-weighted payoffs:
  $$ E = \sum_{k=1}^{N} \left( \frac{1}{2^k} \cdot 2^k \right) + \sum_{k=N+1}^{\infty} \left( \frac{1}{2^k} \cdot 2^N \right) $$
  The first sum contains $N$ terms each equal to 1, totaling $N$. The second sum factors out $2^N$, leaving the probability of reaching toss $N+1$, which is $1/2^N$. Thus, the second term is $2^N \cdot (1/2^N) = 1$. The total EMV is $N + 1$.
  If the house wealth is $2^{100}$, the ticket is worth roughly \$101. While finite, this reveals the core tension: the prize is astronomically large ($2^{100}$), yet the rational price is linear in the exponent ($N$). The paradox persists because our intuition suggests a prize of that magnitude should command a significantly higher premium than a linear scaling suggests, even if not infinite. The "infinity" is removed, but the disconnect between potential magnitude and valuation remains.

  Second, the repeated-play defense argues that long-run averages vindicate the expected value. This fails because the St. Petersburg distribution lacks a finite mean, so the Law of Large Numbers does not apply. The running average does not converge to a constant; it drifts upward logarithmically. For $n$ plays, the total payoff $S_n$ scales as $n \log_2 n$. Consequently, the average payoff per game is $S_n/n \approx \log_2 n$. To justify an entry fee $F$, we need $\log_2 n \approx F$, implying $n \approx 2^F$. For a modest fee of \$25, one needs $2^{25}$ (approx. 33 million) plays to expect the average to cover the cost. This is practically impossible for a single agent. The long-run vindication exists only in the limit, requiring absurd time scales that render the "long run" irrelevant for actual decision-making.

  Third, capping relies on the finitude of monetary bankrolls. However, decision theory applies to goods where no such bankroll exists. If the payoff is years of welfare or lives saved, there is no physical upper bound analogous to a casino's wealth. If utility for such goods is unbounded, the expectation returns to infinity even if money is capped. The paradox is not merely about currency; it is about the aggregation of value. If one accepts that saving more lives is always better, the expectation diverges, and the "finite house" move becomes category error.

  Fourth, infinite expectations create indeterminacy violating statewise dominance. Suppose Gamble A is the standard St. Petersburg game (infinite EMV). Gamble B pays \$1 more than A in every possible state. Both have infinite expected value. Standard expected utility theory ranks them as equivalent ($\infty = \infty$). However, B dominates A state-by-state. A rational theory should prefer B. The failure to distinguish them shows that when expectations diverge, the theory loses discriminative power. It does not recommend paying too much; it fails to recommend anything at all, treating strictly superior options as equal.

  Finally, we must distinguish three questions: the mathematical expected payoff (which may be infinite), the subjective worth (which depends on risk attitude), and the acceptance price (context-dependent). The bounded utility response solves the math by imposing a saturation point where additional goods yield zero marginal utility. The cost of this solution is high: it implies there is some number of lives saved or years of happiness beyond which more matter not at all. This is morally implausible for many. Furthermore, bounded utility functionally acts as a harsh discount on tiny probabilities of enormous payoffs. It resolves the paradox not by fixing the logic of expectation, but by denying the premise that value can accumulate without limit, effectively stipulating the problem away rather than solving the structural tension between probability and magnitude.

  ***

  ### Marking Scheme

  **Total Marks:** 20
  **Structure:** 5 Key Points × 4 Marks each.

  **1. Capped EMV Derivation & Critique (4 Marks)**
  *   **2 Marks:** Correct derivation showing sum splits into $N$ (from $k=1$ to $N$) and $1$ (from tail probability), yielding $N+1$.
  *   **2 Marks:** Explanation that linear valuation ($N$) vs exponential prize ($2^N$) remains counterintuitive; the "infinity" is not the only source of weirdness.
  *   *Common Error:* Calculating EMV as $N$ (forgetting the tail term) or claiming the cap solves the intuition problem completely.

  **2. Repeated Play & Scaling (4 Marks)**
  *   **2 Marks:** Identification that the average drifts as $\log_2 n$ (or total as $n \log n$) rather than settling.
  *   **2 Marks:** Correct calculation that vindicating fee $F$ requires $n \approx 2^F$ plays (e.g., $2^{25}$ for \$25).
  *   *Common Error:* Invoking the Law of Large Numbers as if it applies normally; claiming repetition solves the problem quickly.

  **3. Non-Monetary Stakes (4 Marks)**
  *   **4 Marks:** Argument that currency has a physical cap (wealth of universe), but welfare/lives do not; if utility is unbounded in these domains, the paradox returns regardless of monetary caps.
  *   *Common Error:* Arguing that "lives have a monetary value" (misses the point of intrinsic utility).

  **4. Dominance & Indeterminacy (4 Marks)**
  *   **2 Marks:** Setup of Gamble A vs. Gamble A+\$1.
  *   **2 Marks:** Explanation that infinite expectations render them equivalent in EU theory, violating statewise dominance (rational preference for strict improvement).
  *   *Common Error:* Claiming dominance holds automatically; confusing indeterminacy with "too high a price."

  **5. Distinctions & Cost of Bounded Utility (4 Marks)**
  *   **2 Marks:** Clear separation of Expected Payoff (math), Worth (psychological/utility), and Acceptance Price (transactional).
  *   **2 Marks:** Identification of the cost: Bounded utility requires a saturation point (moral implausibility) or acts as probability discounting.
  *   *Common Error:* Treating "bounded utility" as a free fix without acknowledging the saturation implication.

  **Automatic Penalties:**
  *   **-2 Marks:** Citing specific authors (e.g., "Bernoulli says...") instead of arguing from first principles.
  *   **-2 Marks:** Failing to show the mathematical derivation for the capped EMV.
  *   **-5 Marks:** Answer length deviates by more than 20% from 800 words (too brief to cover derivations, too long to be precise).

  **A Answer vs. B Answer:**
  *   **B Answer:** Correctly performs the derivations and lists the standard objections (casino goes broke, utility is bounded). It treats the three moves as separate, isolated fixes.
  *   **A Answer:** Synthesizes the moves to show they relocate rather than remove the problem. It explicitly connects the logarithmic growth of repeated play to the impracticality of vindication and links the dominance violation to the indeterminacy of infinite values. It clearly articulates the *moral/theoretical cost* of bounded utility rather than just stating it as a solution.

  ***

  ### Note on Contested Sides for Markers

  The model answer takes two contested philosophical stances that students might reasonably dispute. Markers should award full credit for coherent alternatives on these points:

  1.  **Dominance in Infinite Cases:** The model answer assumes statewise dominance *must* hold even with infinite expectations. Some decision theorists (e.g., proponents of weak dominance or specific infinite utility frameworks) argue dominance principles break down in infinite contexts. Accept answers that argue dominance is not violated if the theory is restricted to finite expectations, provided they justify the restriction.
  2.  **Unbounded Utility for Lives:** The model answer assumes utility for lives/welfare is plausibly unbounded. Some theorists argue for lexical thresholds or boundedness in moral value. Accept answers that argue welfare *is* bounded, provided they address the "saturation" cost (i.e., admitting that saving the $(N+1)$-th life adds *no* value).
