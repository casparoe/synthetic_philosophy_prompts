          1.  *Planning Standpoint:* Ex-ante plan is normative; intersection calculation is descriptive/predictive.
          2.  *Action Standpoint:* "What should I do" must be answered from the current perspective (intersection); ex-ante plan is bad advice.
          3.  *Modelling Critique:* It's an artifact of imperfect recall modelling (information sets); fix the model, fix the paradox.
          4.  *Game-Theoretic:* Time-slices as players, look for equilibrium (intrapersonal equilibrium).
