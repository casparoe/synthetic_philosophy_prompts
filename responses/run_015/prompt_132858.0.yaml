  There is a single principle that reconciles your six verdicts. It resolves your doubts about Cases 2 vs. 3 and 4 vs. 6 by distinguishing between *what* the poem is made of and *how* it was made.

  ### The Principle of Equivalent Poetic Resistance

  **A translation is faithful if it preserves the poem's Constitutive Ground invariant, while subjecting the target language to Operational Constraints isomorphic to the original's; if a specific linguistic constraint is impossible in the target, it must be replaced by a constraint of equivalent density rather than discarded.**

  This principle has three clauses. Here is how your cases motivate them:

  #### 1. The Invariance of Constitutive Ground
  **Clause:** The poem's world, aesthetic texture, and structural architecture cannot be altered to make translation easier.
  **Motivated by:** Cases 2, 4, and 5.
  *   **Case 2 (Culture):** Moving the setting from Provence to New England alters the **Constitutive Ground** (the world of the poem). Even if it solves the rhyme, it erases the poem's identity. **Verdict: Not Fine.**
  *   **Case 4 (Texture):** Smoothing out "creaky" meter alters the **Aesthetic Texture** (part of the Ground). The reader must experience the same friction the original reader did. **Verdict: Not Fine.**
  *   **Case 5 (Structure):** Varying a fixed refrain alters the **Structural Architecture**. Repetition is a structural fact, not a stylistic suggestion. **Verdict: Not Fine.**

  #### 2. The Flexibility of Operational Mechanisms
  **Clause:** Specific linguistic tools (semantics, puns, rhymes) may be shifted or swapped to preserve the *effect* of the constraint, provided the Ground remains intact.
  **Motivated by:** Cases 1 and 3.
  *   **Case 1 (Semantics):** Shifting "daybreak" to "dawn" alters **Semantic Content**, which is flexible. It yields to the **Operational Constraint** (rhyme) without breaking the Ground. **Verdict: Fine.**
  *   **Case 3 (Puns):** Swapping a "weigh/grieve" pun for a "still/yet" pun substitutes the **Linguistic Mechanism**. The *effect* (wordplay/wit) is preserved, and the Ground is untouched. **Verdict: Fine.**

  #### 3. The Substitution Rule for Impossibility
  **Clause:** If an Operational Constraint is linguistically impossible in the target language, it may not be discarded (which reduces density); it must be replaced by a new constraint of equivalent weight.
  **Motivated by:** Case 6 (and distinguishes it from Case 4).
  *   **Case 6 (Homophony):** You could not translate the homophone (Impossibility). Dropping it would reduce the poem's structural density. Inventing an acrostic imposes a **New Constraint** of equivalent weight. **Verdict: Fine.**
  *   **Contrast with Case 4:** In Case 4, the "creaky" meter was *difficult* but not *impossible*. Smoothing it was discarding a constraint out of convenience, not necessity. Hence, Case 4 is Not Fine, while Case 6 is Fine.

  ---

  ### Resolving Your Doubts

  **Doubt 1: Why is cultural substitution (2) bad but pun substitution (3) good?**
  *   **Resolution:** Culture is **Constitutive Ground** (the material the poem is *about*). A pun is an **Operational Mechanism** (a tool used to work the material). You can swap tools (3), but you cannot swap the material (2).

  **Doubt 2: Why must I keep a defect (4) but can invent a constraint (6)?**
  *   **Resolution:** Case 4 involves **Difficulty**; Case 6 involves **Impossibility**. In Case 4, the "defect" (creakiness) is a feature of the Ground that *can* be reproduced in English, so failing to do so is a loss of fidelity. In Case 6, the feature (homophony) *cannot* be reproduced, so fidelity requires manufacturing an equivalent resistance to maintain the poem's density.

  ---

  ### Prediction for the Test Case

  **The Case:** A song where the melody fixes note count.
  *   **Option A:** Singable version changes the images.
  *   **Option B:** Faithful version cannot be sung.

  **The Verdict:**
  Under the Principle of Equivalent Poetic Resistance, **Option B (the unsingable version) is the faithful one**, provided the "images" constitute Constitutive Ground.

  **Reasoning:**
  1.  **Melody as Constraint:** The melody is an **Operational Constraint**. Ideally, it should be met (like rhyme in Case 1).
  2.  **Images as Ground:** Specific images are usually **Constitutive Ground** (like the Provence setting in Case 2).
  3.  **The Conflict:** Meeting the Constraint (Melody) requires violating the Ground (Images).
  4.  **Precedent:** In Case 2, you rejected violating the Ground (Culture) to save the Constraint (Rhyme). Therefore, you must reject violating the Ground (Images) to save the Constraint (Melody).
  5.  **Conclusion:** A singable translation that fundamentally changes the images is **Not Fine** (it is a new song based on the old one). A reading translation that keeps the images but cannot be sung is **Fine** (it preserves the Ground, acknowledging the melody is an external constraint that cannot be met without destruction).

  **The Exception (Case 1 Nuance):**
  If "changing the images" means minor semantic shifts equivalent to "dawn" vs. "daybreak" (Case 1), then the singable version is **Fine**. If it means changing the *subject matter* or *metaphorical core* (equivalent to "Provence" vs. "New England"), then the singable version is **Not Fine**.

  ### Is There a Verdict to Give Up?

  If you find this principle too restrictive, **Case 6 is the cheapest to give up.**

  Inventing constraints (acrostics, syllable counts) that were not in the original is the most interventionist move a translator can make. While your intuition accepts it as "less bad," a stricter theorist would argue that adding a constraint changes the poem's "shape of the problem" just as much as dropping one. If you must simplify your rule, you could adopt a stricter **"Negative Fidelity"**: *Preserve the Ground and Constraints, but do not invent new ones.* This would make Case 6 "Not Fine," but it would leave your other five judgments intact and arguably more defensible to a traditionalist.

  However, based on your current intuitions, the **Principle of Equivalent Poetic Resistance** holds all six cases without contradiction.
