answer: |-
  Your roommate did a surprisingly good job for someone who only skimmed *Politics* Book 1. They captured the core "vibe" of Aristotle's argument, but they oversimplified a few key points and got one major conclusion wrong.

  Here is a breakdown of where your roommate is right, where they are stretching the truth, and the specific answer to your question about the "sterile coins."

  ### 1. The Two Types of Acquisition
  **Verdict: Mostly Accurate**

  Your roommate correctly identifies that Aristotle distinguishes between two ways of getting stuff.
  *   **Natural Acquisition (*Oikonomike*):** This is household management. It involves acquiring goods (like farming, hunting, or fishing) to satisfy the needs of the household or the state. Aristotle sees this as **natural** and **necessary** because it has a limit (you only need so much food to feed your family).
  *   **Wealth-Getting (*Chrematistike*):** This is the art of acquiring wealth. Aristotle actually splits this into two sub-types, which your roommate glossed over:
      1.  **Natural Chrematistike:** Part of household management. It involves barter or simple exchange to get what you lack (e.g., trading surplus wine for shoes). This is acceptable.
      2.  **Unnatural Chrematistike:** Trade specifically for the purpose of making a profit and accumulating money. This is what Aristotle condemns.

  **The Correction:** It isn't just "farming vs. trading." You can trade naturally (to get what you need). The sin is trading *for profit* rather than *for use*.

  ### 2. The "Sterile Money" Argument
  **Verdict: Metaphorical, not Biological**

  This is the part that confused you, and rightfully so. Your roommate said Aristotle "literally believed coins are sterile."

  *   **The Metaphor:** Aristotle was not under the biological misconception that metal coins were living organisms that *could* breed but *didn't*. He was making a **teleological** argument (an argument about purpose).
  *   **The Telos of Money:** Aristotle argues that money was invented for one specific purpose: **exchange**. It is a tool to measure value so a shoemaker can trade with a farmer.
  *   **The Violation:** When you charge interest (usury), you are treating money as if its purpose is to reproduce itself. Aristotle calls this "the most hated sort [of wealth-getting]" because it makes money breed money.
  *   **The Quote:** In *Politics* (1258b), he writes: *"Of all modes of acquisition, usury is the most unnatural... for money was intended to be used in exchange, but not to increase at interest."* He uses the Greek word *atonkotaton*, meaning "most barren" or "sterile."

  **The Verdict:** It is a philosophical metaphor about function, not a biological claim about metallurgy. He is saying it is **unnatural** for a tool of exchange to become a source of production. Your roommate's "plow having babies" analogy is actually a very good way to explain Aristotle's point: A plow is for tilling soil; if you expected the plow to produce baby plows, you would be misunderstanding what a plow *is*.

  ### 3. Did Aristotle Want to Ban All Markets?
  **Verdict: False / Major Stretch**

  This is the biggest error in your roommate's summary. Aristotle did **not** want to ban buying and selling entirely.

  *   **Necessary Exchange:** He acknowledges that no household is self-sufficient. People need to exchange surplus for deficits. He accepts the use of money to facilitate this.
  *   **The Ideal City:** In *Politics* Book 7, when describing his ideal city, Aristotle actually includes a marketplace (*agora*). However, he proposes separating it. He wants one area for political assembly (free citizens) and a separate area for commercial trade (merchants and foreigners), so that the pursuit of profit doesn't corrupt the pursuit of virtue.
  *   **What He Hated:** He hated **retail trade** (buying something solely to sell it at a higher price) and **usury** (lending money for interest). He viewed these as endless pursuits that distract citizens from the "Good Life" (*Eudaimonia*).

  **The Verdict:** He wanted to subordinate markets to ethics, not abolish them. He accepted trade for *need*, but rejected trade for *greed*.

  ### 4. Limited vs. Unlimited Wealth
  **Verdict: Accurate**

  Your roommate's final point is the strongest.
  *   **Aristotle:** True wealth is limited. Once your household has enough food, clothes, and shelter to live virtuously, acquiring more is pointless and harmful to your character.
  *   **Modern Economics:** Generally operates on the assumption that human wants are infinite and that growth (accumulation of capital) is inherently good.

  Aristotle would argue that modern economics confuses "living well" with "having more." He thinks the pursuit of unlimited wealth is a symptom of people focusing on mere life (survival) rather than the good life (virtue).

  ### Summary for Your Roommate
  You can tell your roommate they nailed the core concepts but need to tweak the specifics:

  1.  **Right:** Aristotle distinguishes between acquiring for need (natural) and acquiring for profit (unnatural).
  2.  **Right:** Aristotle thinks interest is unnatural because it perverts the purpose of money.
  3.  **Right:** Aristotle believes wealth should be limited by need, unlike modern economics.
  4.  **Wrong:** He didn't think coins were biologically sterile; he meant they are functionally sterile.
  5.  **Wrong:** He didn't want to ban all markets; he just wanted to ban profit-seeking trade and usury, while keeping exchange for necessities.

  **The Bottom Line:** Aristotle wasn't trying to write an economics textbook; he was writing an **ethics** book. He judged economic activities based on whether they helped a human being become virtuous. Your roommate understood his economic critique but missed the ethical context that explains *why* he held those views.
