answer: |-
  # The Interpretive Stress Test: A Procedure for Freelance Writers

  **Purpose:** To identify where historical interpretation is presenting itself as objective fact.
  **Time Allocation:** 120 minutes per text.
  **Applicability:** Exhibition panels (90 words), audio scripts, educational resources.

  ## Part 1: Theoretical Position & Tool Retention

  You are not expected to resolve the debate between Ranke (objectivity), Carr (selection), and White (narrative construction). This procedure operates on the following assumptions:
  1.  **Ranke is impossible:** We cannot show the past "as it actually was."
  2.  **Carr is correct:** Facts reach us selected by present concerns. We must acknowledge the selection.
  3.  **White is the risk:** Narrative forms (romance, tragedy) impose meaning that sources do not support. This is the primary target of this test.

  **Status of Your Existing Tools:**
  *   **Source-anchored:** **Retained.** (Claims verifiable without interpretive framing).
  *   **Frame-dependent:** **Retained.** (Claims true only within a specific historiographical argument).
  *   **Narrative-collateral:** **Dropped.** This distinction is too abstract for a two-hour workflow. Its function is absorbed into the *Particle Audit* and *Reversibility Test*.
  *   **Particle Audit:** **Retained and Expanded.**

  ---

  ## Part 2: The Procedure

  ### Step 1: The Particle Audit (15 Minutes)
  Scan the text for "narrative glue." These words impose a plot structure (beginning, middle, end, progress, decline) rather than describing events.
  *   **Target words:** *Finally, still, already, only, began to, increasingly, inevitably, unfortunately, surprisingly.*
  *   **Action:** Highlight every instance.
  *   **Rule:** If a highlighted word cannot be removed without losing the sentence's emotional resonance, the sentence is **Frame-dependent**.

  ### Step 2: Sentence Classification (45 Minutes)
  Label every sentence in the draft as either **A** or **B**.
  *   **Type A (Source-anchored):** Would hold true in a court of law using only documents/artefacts? (e.g., "The mill opened in 1842.")
  *   **Type B (Frame-dependent):** Does it rely on a specific argument about motive, causality, or moral value? (e.g., "The mill *benefited* the town," "He *cared* for his workers.")
  *   **Threshold:** In a 90-word panel, no more than 20% of sentences (approx. 2 sentences) may be Type B.

  ### Step 3: The Reversibility Test (30 Minutes)
  Take every **Type B** sentence. Ask: *Could I write a sentence of opposite valence that is equally supported by the sources?*
  *   **Example:** "The strike failed." vs "The strike maintained solidarity."
  *   **Action:** Draft the opposite sentence.
  *   **Rule:** If the opposite sentence is historically defensible, the original is **Interpretive**. You must either:
      1.  Qualify the claim (e.g., "Historians argue...");
      2.  Remove the claim;
      3.  Pass to the Community Liaison (see Step 4).

  ### Step 4: Decision Matrix (30 Minutes)
  Apply the following rules to determine the text's fate.

  1.  **The Hard No:** If a Type B sentence fails the Reversibility Test *and* concerns a living community's trauma or identity, **STOP**. Do not edit. Hand to the Community Liaison. This is a values question, not an evidence question.
  2.  **The Revision:** If a Type B sentence fails the Reversibility Test but concerns a historical figure/event with no living descendants involved, you must qualify the frame (e.g., change "He improved the town" to "He built housing, which some viewed as improvement").
  3.  **The Pass:** If the text is >80% Type A, or if Type B sentences are explicitly framed as interpretation ("Contemporary accounts suggest...").

  **Note on Welsh Translation:** Complex qualifiers (e.g., "arguably," "in the view of") increase translation difficulty and word count. If a Revision pushes the text over 90 words, the text must be cut elsewhere or rejected.

  ---

  ## Part 3: Application to Current Drafts

  Below is the application of the Stress Test to three pending texts.

  ### 1. Exhibition Panel: The Model Village (Donor-Funded)
  **Draft Text:**
  > "Thomas Gwynne founded this village in 1865 to care for his workers. Unlike other owners, he understood that healthy families made better employees. He built schools and chapels, ensuring moral guidance for all. His benevolence transformed a rough settlement into a model of order. Today, his descendants continue this legacy of support. The collection exists because of his vision." 
  **Stress Test Results:**
  *   **Particle Audit:** "Unlike" (comparison implies moral superiority), "ensuring" (implies total success), "transformed" (teleological narrative).
  *   **Classification:**
      *   "Founded... in 1865": **Type A**.
      *   "To care for his workers": **Type B** (Motive is inferred).
      *   "Benevolence transformed...": **Type B** (Value judgment).
      *   "Legacy of support": **Type B** (Narrative continuity).
      *   **Ratio:** 60% Type B. (Fail: Threshold is 20%).
  *   **Reversibility Test:**
      *   *Original:* "To care for his workers."
      *   *Reverse:* "To secure a compliant workforce near the factory." (Both are source-compatible).
      *   *Original:* "Benevolence transformed..."
      *   *Reverse:* "Control reshaped a rough settlement into a model of order." (Both source-compatible).
  *   **Decision:** **REJECT / REFER.**
      *   **Reasoning:** This text fails the Hard No/Revision boundary. It presents a specific historiographical frame (Paternalism as Benevolence) as fact.
      *   **The Painful Outcome:** To pass, the text must acknowledge the coercive nature of model villages (e.g., "Housing was tied to employment"). This contradicts the donor's celebratory brief. The procedure dictates you cannot sign this off without qualifying the "benevolence," which may breach the funding agreement or require a difficult conversation with the donor about 'interpretive independence'.
      *   **Action:** Return to writer. Demand Type A phrasing ("He built schools..."). If the donor insists on "benevolence," the text must be labelled as 'Donor Perspective' rather than museum interpretation.

  ### 2. Audio Guide: The Pit Reopening
  **Draft Sentence:**
  > "After eighteen months of hardship, the pit finally reopened after the strike." 
  **Stress Test Results:**
  *   **Particle Audit:** "Hardship" (value judgment on the strike), "finally" (implies relief/inevitability).
  *   **Classification:**
      *   "Eighteen months...": **Type A**.
      *   "Hardship": **Type B** (Whose hardship? Owners? Strikers' families?).
      *   "Finally reopened": **Type B** (Implies the closure was an aberration to be corrected).
  *   **Reversibility Test:**
      *   *Original:* "Finally reopened."
      *   *Reverse:* "The pit reopened despite unresolved disputes." (Equally supported).
  *   **Decision:** **REVISION REQUIRED.**
      *   **Reasoning:** "Finally" imposes a narrative of resolution (White's emplotment). It suggests the strike was an obstacle to progress rather than a labour action.
      *   **Action:** Remove "finally" and "hardship".
      *   **Revised:** "After eighteen months, the pit reopened after the strike." (Neutral). Or, if space allows: "The pit reopened after eighteen months of striking."

  ### 3. School Timeline: The Age of Improvement
  **Draft Header:**
  > "The Age of Improvement, 1780–1840" 
  **Stress Test Results:**
  *   **Particle Audit:** None (It is a title).
  *   **Classification:** **Type B** (Entirely Frame-dependent). "Improvement" is a Whig historiographical concept, not a neutral descriptor.
  *   **Reversibility Test:**
      *   *Original:* "Age of Improvement."
      *   *Reverse:* "Age of Industrialisation," "Age of Dislocation," "Age of Reform." (All valid).
  *   **Decision:** **REVISION REQUIRED.**
      *   **Reasoning:** While standard curriculum language, it presents a value judgment as a period definition. For a museum context, this validates a specific view of history.
      *   **Action:** Change to a neutral descriptor or add a sub-header.
      *   **Revised:** "Industrialisation and Reform, 1780–1840." (Type A).
      *   **Note:** This may annoy teachers used to the standard terminology. The procedure prioritises historiographical accuracy over curriculum familiarity.

  ---

  ## Part 4: What This Procedure Cannot Do

  1.  **It cannot fix the Collection:** If the artefacts we hold were only saved because they fit the "Benevolent Owner" narrative, no text edit can fix that structural silence. This procedure treats symptoms, not the disease of acquisition bias.
  2.  **It cannot solve the Word Count Paradox:** Nuance requires words. A 90-word limit forces simplification. This procedure can flag simplification that lies, but it cannot create space for the truth. You will still have to cut content.
  3.  **It cannot replace Curatorial Courage:** The procedure flagged the Manufacturer panel as a 'Reject'. I can write that instruction, but I cannot force the Director to uphold it against a major donor. The procedure identifies the risk; management must accept the cost.
  4.  **It assumes Sources are Neutral:** The Reversibility Test assumes we have sources for *both* sides. If the archive only contains the Owner's letters and not the Workers' diaries, the Test will fail to detect the bias because the 'Reverse' sentence cannot be sourced. It protects against narrative overreach, not archival silence.

  **Signed:**
  *Head of Interpretation*
  *Date: 24 May 2024*
