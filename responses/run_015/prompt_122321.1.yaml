  1. The dependency arc
  Start by defining societies as interconnected networks, not single blocks. You need them to see the complexity first. Next, present the historical break point where trade and writing stop. Crucially, follow that immediately with evidence of continuity—people still farmed and lived there. Only after establishing that break plus continuity combo should you introduce the refactoring analogy. If you lead with the monolith-to-microservices comparison, they'll force the history to fit the code. You need the historical evidence landed first so the analogy acts as a label, not a proof. Think of the monolith as the centralized palace economy. The refactor is the shift to local village governance. Make sure they understand the stakes before applying the tech lens. Otherwise the analogy becomes a cage. Sequence: Complexity -> Disruption -> Continuity -> Refactoring Frame. This ensures the software metaphor explains the survival, not the crash. It stops them from thinking the system went offline when it actually just changed topology.

  2. The carrying example
  Bronze Age Collapse. Easter Island is risky; it's often taught as pure ecocide—the "server room caught fire" narrative—which fights your goal. Bronze Age works better because it was a networked system, like distributed microservices, that fragmented. You need an example where high-level protocols (writing, trade) vanish, but low-level services (farming, governance) stay online. Tech folks understand losing API integrations while the core database still runs. Easter Island feels too isolated (single node), whereas Bronze Age shows network partitioning, mapping to backend architecture without implying total system death.

  3. Misconception map
  When defining complexity, head off "single root cause." Devs love finding the one bad commit. Tell them upfront it's usually dependency hell, not one bug. When showing the break, counter "cascading failure." Explain that some nodes stayed up even when the network partitioned. When discussing the aftermath, tackle "outputs drop = dead." Just because throughput lowered doesn't mean the service is down. Finally, hit "smaller = failed." A streamlined service isn't a crashed one. Remind them sustainability often looks like downscaling, not error logs. Map these explicitly: Root Cause -> Intro; Cascading -> The Break; Output/Size -> The Aftermath. If you wait until the end, their mental models will have hardened around the crash narrative. Patch the vulnerabilities before the exploit lands. Mention that "uptime" is a business metric, not a historical one. A society can have 99% downtime on trade but 100% uptime on survival. This helps them separate economic collapse from human extinction.

  4. The check
  Skip dates. Ask: "Describe a modern tech stack change that looks like a collapse but is actually a refactor." If they say "shutting down a legacy monolith to run leaner APIs," they get it. If they talk about outages, reframe. You want them to identify that reduced visibility isn't reduced function. The goal is applying the lens to their own work. If they spot the transformation in their codebase, they won't mislabel the history.

  5. What to skip
  Skip "palynology" (pollen data) debates and exact drought percentages. Skip "systems collapse theory." It sounds too academic. Cutting these keeps focus on structural coupling rather than arguing about weather records. Don't get bogged down in dates. The exact year doesn't matter for the architectural lesson. Keep it about the structure.
