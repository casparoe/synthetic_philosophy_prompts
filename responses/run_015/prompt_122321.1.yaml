prompt: |-
  hey — im a backend engineer with basically zero formal philosophy background, and im putting together a lunch-and-learn for my coworkers (mostly devs, one PM who listens to history podcasts). the topic is societal "collapse" — bronze age, the maya, easter island — and whether its actually a fall or just a transformation into a smaller, less coupled system. i want the group to stop mapping it to a server crash.

  i need a teaching plan, not the full explanation. keep it grounded so a model without web access can actually build it.

  heres what to deliver, in this order and rough length:

  1. The dependency arc (~150 words). lay out the order the pieces have to come in so the idea builds instead of dumping facts. i want to inject this framing: treat collapse like a monolithic software architecture that gets refactored into smaller services — complexity drops but the system doesnt vanish. use that analogy in the sequence but dont let it dominate the history. say what has to land before the "refactoring" comparison makes sense.

  2. The carrying example (~120 words). choose either easter island or the bronze age collapse as the main case that carries the whole concept. explain why that one works and why the other is a bad carrier for tech people. list the specific properties the example needs — like visibility of complexity loss vs total disappearance — so i can see if im picking right.

  3. Misconception map (~180 words). my audience will arrive with tech mental models: cascading failure, single root cause (climate "the bug"), and the idea that if outputs drop the system is dead. map each misconception to the point in the arc where it will occure, and say exactly how to head it off without just saying "history isnt software". include the misconception that "smaller = failed".

  4. The check (~80 words). give me one end-of-session question or small task that proves theyve grasped the framing idea — that collapse is a narrative label for complexity change, not an objective system state — and not just that they remember easter island had fewer statues.

  5. What to skip (~60 words). tell me which archaeology jargon and which specific climate-data debates to openly leave out, and why cutting them actually helps the conceptual point land for non-specialists.

  rules: no bibliography, no reading lists, no "further research" section. dont quote any real historian verbatim — paraphrase without quotation marks if you need gibbon or anyone else. also dont lean on super niche theories a small model wouldnt have seen; stick to the general collapse-vs-transformation debate.

  write it casual, like youre answering a coworker on slack. a typo or two is totally fine.
