prompt: |-
  I'm preparing a ninety-minute session for an interdisciplinary reading group—mostly philosophers of science with no background in metaethics—on evolutionary debunking arguments. Rather than a generic survey, I want to teach the specific variant that targets non-naturalist normative realism by explaining the evolutionary origins of deontic modal intuitions: the sense that certain actions are strictly forbidden regardless of consequences. Plan the explanatory arc: first, what conceptual dependency must be established before the debunking argument can be heard—whether it is the causal-inertness problem for non-natural properties, the distinction between origin and justification, or something else, and in what order; second, the single concrete moral intuition that should carry the entire demonstration, specifying why it should be a direct-action prohibition rather than a cost-benefit judgment and what features it must have; third, the predictable misconceptions—likely that an evolutionary explanation genetically falsifies the belief, that such explanations are unfalsifiable just-so stories, and that the debunking extends indiscriminately to logical or mathematical beliefs—and the precise point in the sequence where each should be defused; fourth, one diagnostic question I can ask at the end that distinguishes someone who has grasped the argument structure from someone who merely agrees with the skeptical conclusion; and finally, what I should explicitly leave out at this level—perhaps the full evolutionary game-theoretic literature on cooperation, or the distinctions between reliabilist and process-based epistemologies—and how to state that omission without undermining the session.
reasoning: |-
  Here's a thinking process that leads to the suggested session plan:

  1.  **Analyze the Request:**
      *   **Target Audience:** Philosophers of science (no metaethics background). This is crucial. They understand explanation, causation, evidence, and theory structure, but might not know terms like "queerness," "supervenience," or "categorical imperative."
      *   **Topic:** Evolutionary Debunking Arguments (EDAs), specifically targeting *non-naturalist normative realism* via *deontic modal intuitions* (strict prohibitions).
      *   **Duration:** 90 minutes.
      *   **Constraints:**
          *   Not a generic survey.
          *   Specific explanatory arc (conceptual dependency $\rightarrow$ concrete intuition $\rightarrow$ misconceptions $\rightarrow$ diagnostic question $\rightarrow$ omissions).
          *   Must explain *why* certain choices are made.

  2.  **Deconstruct the Five Components:**

      *   **1. Conceptual Dependency (The Setup):**
          *   *Problem:* If I jump straight to "evolution made us think murder is wrong," a realist says "So what? Evolution made us think logic is true, and it is."
          *   *Need:* I need to isolate the *type* of truth claim being made. Non-naturalist realism claims moral truths exist independently of us and causally inert.
          *   *Key Concept:* The "Coincidence Problem" (or Benacerraf-Style Challenge). Philosophers of science will recognize this as an inference to the best explanation problem or a reliability challenge.
          *   *Order:* First, define the target (Non-naturalist Realism). Second, establish the causal isolation (Evolution tracks fitness, not moral truth). Third, pose the reliability challenge.
          *   *Decision:* The core dependency is the **Causal Inertness + Independence Claim**. Without establishing that the moral facts *cannot* cause the beliefs (because they are non-natural), the evolutionary explanation doesn't create tension.

      *   **2. The Concrete Moral Intuition:**
          *   *Requirement:* Must be a direct-action prohibition (deontic), not consequentialist.
          *   *Why?* Consequentialist judgments (e.g., "suffering is bad") can be aligned with fitness (cooperation helps survival). Deontic prohibitions (e.g., "do not push the fat man off the bridge") often conflict with fitness or utility.
          *   *Selection:* The **Footbridge Trolley Case** (Personal Harm) is too cliché. **Incest Taboo** (Westermarck effect) is too biological/reductionist. **Sacred/Purity Violations** (e.g., harming a corpse when no one sees) are good but might seem cultural.
          *   *Best Choice:* **The "Harmless Wrong" / Purity Violation** (e.g., Haidt's cleaning the toilet with the flag, or consensual sibling incest with protection). Let's go with **Consensual Adult Incest (with contraception)**.
          *   *Why?* It triggers a strong "Yuck" factor (deontic prohibition) but lacks consequentialist harm. This isolates the *modal* intuition ("It is *wrong* period") from fitness benefits. It highlights the disconnect between the evolutionary impulse (avoid inbreeding) and the moral justification (it's inherently wrong).
          *   *Refinement:* Actually, for *non-naturalist realism*, we need something that feels like an objective truth. Incest might feel too subjective/cultural. A better candidate for *deontic constraint* is **The prohibition against using an innocent as a mere means** (Kantian). Let's use **The Organ Harvest Case** (Killing one healthy person to save five). It's a strict prohibition that contradicts the fitness-maximizing utilitarian calculus.
          *   *Wait, re-reading prompt:* "explaining the evolutionary origins of deontic modal intuitions: the sense that certain actions are strictly forbidden regardless of consequences."
          *   *Revised Selection:* **The "Harmless Desecration"** (e.g., stabbing a picture of a loved one). No, too weak. Let's stick to **The Personal Trolley (Footbridge)**. It's the standard for a reason. It pits deontic constraint against utilitarian calculation. Evolution explains the aversion to *personal* harm (emotional/visceral) but not the *moral truth* of the constraint.
          *   *Actually, best for Philosophers of Science:* They like clean variables. **The "Harmless Taboo"** (Julie and Mark). It isolates the *feeling* of wrongness from *consequences*. This makes the evolutionary explanation (inbreeding avoidance mechanism) clearly distinct from the *truth* of the proposition.
          *   *Decision:* **The "Harmless Incest" Case (Julie and Mark)**. It perfectly isolates the deontic intuition from consequentialist justification, making the evolutionary explanation (inbreeding avoidance) look like the *only* cause, thereby undermining the claim that a non-natural moral fact is doing the work.

      *   **3. Predictable Misconceptions:**
          *   *Misconception 1: Genetic Fallacy.* (Origin $\neq$ Justification). *Defuse:* Early, when setting up the argument. Distinguish between "causes of belief" and "reasons for belief."
          *   *Misconception 2: Just-So Stories.* (Unfalsifiable). *Defuse:* When presenting the evolutionary mechanism. Appeal to comparative primatology and cross-cultural stability (Philosophers of Science care about empirical robustness).
          *   *Misconception 3: Global Skepticism.* (Takes down math/logic too). *Defuse:* At the end, as a limitation of scope. Distinguish between adaptive tracks for *fitness* vs. adaptive tracks for *truth* (math helps build bridges that don't fall).

      *   **4. Diagnostic Question:**
          *   *Goal:* Distinguish understanding the *structure* vs. agreeing with the *conclusion*.
          *   *Idea:* Ask them to apply the argument to a different domain or modify a premise.
          *   *Draft:* "If moral facts were causally efficacious, would the argument fail?"
          *   *Better:* "What specific premise would a naturalist realist accept to block this argument?" (They would deny the causal inertness).
          *   *Best:* "If we discovered a 'moral perception' faculty, would that save realism?" (Tests if they understand the causal/isolation constraint).
          *   *Refined:* Ask about the **Third-Factor Explanation**. "What kind of correlation between fitness and moral truth would rescue the realist, and why is it unavailable to the *non-naturalist*?" This tests the specific target (non-naturalism).

      *   **5. Omissions:**
          *   *What to cut:* Detailed game theory (Prisoner's Dilemma matrices), Street vs. Joyce nuances, Quasi-realism, Error Theory details.
          *   *How to state it:* Frame it as "bracketing" to focus on the *epistemic structure* rather than the *biological mechanics* or *alternative metaethical systems*.

  3.  **Drafting the Plan (Iterative refinement for tone and audience):**
      *   *Tone:* Rigorous, structural, epistemic. Avoid moralizing. Use language familiar to PhilSci (causal models, reliability, independent access).
      *   *Structure:*
          1.  **The Epistemic Setup (20 mins):** Define Non-Naturalist Realism as a hypothesis. Introduce the Causal Inertness constraint.
          2.  **The Target Intuition (25 mins):** The Julie & Mark case. Show the gap between the evolutionary cause (inbreeding avoidance) and the moral claim (objective wrongness).
          3.  **The Debunking Inference (20 mins):** The Coincidence Challenge.
          4.  **Misconceptions & Defusing (15 mins):** Weave these into the flow or have a dedicated Q&A block? The prompt asks for "precise point in the sequence." I will integrate them.
          5.  **Diagnostic & Omissions (10 mins).**

      *   *Wait, check the Misconception timing:*
          *   Genetic Fallacy: Must be addressed *before* the argument lands, or the audience rejects the method immediately.
          *   Just-So Stories: Address when presenting the evolutionary premise.
          *   Global Skepticism: Address at the conclusion.

      *   *Refining the Diagnostic:* The prompt asks for a question that distinguishes grasping the *structure* from agreeing with the *conclusion*.
      *   *Question:* "Does this argument force you to abandon moral belief, or only a specific metaethical interpretation of it?" (Tests if they see it targets *Realism*, not *Morality*).
      *   *Better:* "If you were a Naturalist Realist, which premise of this argument would you reject?" (Tests if they see the argument relies on *Non-Naturalist* causal inertness).

  4.  **Final Polish:**
      *   Ensure the "Philosophers of Science" lens is used. Talk about "independent access," "causal models," "explanatory power."
      *   Make sure the "Deontic" aspect is highlighted. The Julie/Mark case is good because the intuition is "It is forbidden" not "It is suboptimal."
      *   Check the omissions statement. Needs to be diplomatic but firm.

  5.  **Final Review against constraints:**
      *   90 mins? Yes, the breakdown fits.
      *   PhilSci audience? Yes, language adjusted.
      *   Specific variant (Non-naturalist/Deontic)? Yes.
      *   5 specific components addressed? Yes.

      *(Self-Correction during drafting)*: I initially thought about the Trolley Problem. But for *evolutionary* debunking, the Incest case is stronger because the evolutionary mechanism (inbreeding avoidance) is more specific and plausible than "tribal violence avoidance." It makes the "Just-So" objection easier to fend off with empirical data (Westermarck effect). I will stick with Julie and Mark but frame it strictly as a *deontic prohibition* (violating a norm) rather than just disgust.

      *(Refining the Conceptual Dependency)*: It's not just causal inertness. It's the **Independence Claim**. If moral facts depended on us, evolution shaping us would shape the facts. The argument only works if the facts are *independent* of the evolutionary process. I need to make sure this is clear.

      *(Refining the Diagnostic)*: The prompt asks to distinguish someone who grasps the *argument structure* from someone who merely agrees with the *skeptical conclusion*. A skeptic might say "Morality is bunk." A understander says "Non-naturalist realism is epistemically untenable."
      *   *Question:* "Does this argument entail that we should stop making moral judgments, or that we must reinterpret what those judgments represent?"

      *   *Wait, one more check:* The prompt asks for *one* diagnostic question.
      *   *Selection:* "Which specific premise must a Naturalist Realist reject to survive this argument?" This forces them to see the argument is targeted, not global.

      *   *Omissions:* Don't get into Street's "Darwinian Dilemma" vs Joyce's "Debunking." Keep it to the core epistemic challenge. Don't get into Game Theory details (Iterated Prisoner's Dilemma).

      *   *Let's write it.*
answer: |-
  Here is a structured plan for a ninety-minute session designed for philosophers of science. The arc prioritizes epistemic structure over metaethical taxonomy, leveraging your audience's familiarity with causal modeling, inference to the best explanation, and reliability challenges.

  ### 1. The Conceptual Dependency: Causal Inertness & Independence
  **Time:** Minutes 0–20
  **The Goal:** Establish the **Epistemic Isolation Condition**.

  Before the debunking argument can be heard, the audience must accept that the target moral facts (if they exist) are causally isolated from the evolutionary processes that formed our beliefs. Philosophers of science will recognize this as a **reliability challenge** akin to the Benacerraf problem for mathematical Platonism.

  *   **The Dependency:** You must establish **Non-Naturalist Realism** not as a moral view, but as an *ontological hypothesis*. Define it by two constraints:
      1.  **Independence:** Moral facts obtain independently of human attitudes or evolutionary history.
      2.  **Causal Inertness:** These facts do not exert physical force; they do not interact with the causal nexus that governs biological reproduction.
  *   **The Order:**
      1.  **Define the Hypothesis:** Treat Non-Naturalist Realism as a positing of entities/properties that are causally impotent.
      2.  **Define the Mechanism:** Evolution selects for *fitness*, not *truth* (unless truth conduces to fitness).
      3.  **The Gap:** If the moral facts cannot cause the beliefs (due to inertness), and evolution causes the beliefs (due to selection), there is no explanatory link between the *truth* of the belief and the *holding* of the belief.
  *   **Why this first?** If you do not secure causal inertness, a realist can argue that moral facts *guided* evolution (theistic view) or that moral facts *are* facts about fitness (naturalist view). The debunking argument collapses without the isolation of the moral domain from the causal domain.

  ### 2. The Concrete Moral Intuition: The "Harmless Taboo"
  **Time:** Minutes 20–45
  **The Goal:** Isolate the Deontic Modality from Consequentialist Reasoning.

  *   **The Case:** **The "Julie and Mark" Incest Case** (Haidt). Two adult siblings, using protection, have a consensual sexual encounter in private. No pregnancy, no psychological trauma, no social discovery.
  *   **Why this intuition?**
      *   **Deontic vs. Consequentialist:** In a utilitarian calculation, this action is neutral or positive (pleasure without harm). Yet, the intuition is a strict prohibition ("It is *wrong*," not "It is *suboptimal*"). This isolates the *deontic modal* force (forbiddenness) from outcome-based reasoning.
      *   **Evolutionary Specificity:** Unlike general "harm avoidance," which is broad, the incest taboo maps cleanly onto a specific, well-documented evolutionary mechanism (the Westermarck effect/inbreeding avoidance). This makes the causal explanation robust rather than speculative.
      *   **The Disconnect:** The evolutionary explanation (avoid genetic degradation) is fully satisfied by the *mechanism* (disgust/prohibition), rendering the positing of a *non-natural moral fact* ("Objective Wrongness") explanatorily redundant.
  *   **Demonstration:** Ask the group: "If the only reason you believe this is wrong is an evolved disgust mechanism triggered by kinship cues, what work is the 'Objective Moral Fact' doing?" The answer should be: *None.*

  ### 3. Predictable Misconceptions & Defusal Points
  **Time:** Woven throughout Minutes 45–75

  *   **Misconception 1: The Genetic Fallacy (Origin $\neq$ Justification).**
      *   *The Risk:* Audience objects that explaining the origin of a belief says nothing about its truth.
      *   *Defusal Point:* **Minute 15 (during Conceptual Dependency).** Pre-empt this by framing the argument not as "Origin implies Falsehood," but as **"Origin undermines Reliability."** Use an analogy: If a clock is set randomly, knowing its origin undermines our trust in its time-telling, even if it happens to show the right time. We are challenging the *justificatory link*, not asserting falsity directly.
  *   **Misconception 2: Unfalsifiable "Just-So" Stories.**
      *   *The Risk:* Audience rejects the evolutionary premise as speculative adaptationism.
      *   *Defusal Point:* **Minute 35 (during the Julie/Mark case).** Appeal to **comparative stability**. Note that incest avoidance is observed in non-human primates and is cross-culturally robust despite varying social norms. Frame this as a *consilience of evidence* (genetics, primatology, psychology) rather than a single narrative hypothesis. Philosophers of science respect consilience.
  *   **Misconception 3: Global Skepticism (The "Logic/Math" Objection).**
      *   *The Risk:* Audience argues that if this debunks morality, it debunks logic (since logic capacities also evolved).
      *   *Defusal Point:* **Minute 70 (during Conclusion).** Distinguish between **Tracking Fitness** vs. **Tracking Truth**. Logical beliefs (e.g., "if A=B and B=C, then A=C") are *constitutive* of coherent planning; a creature that violates basic logic fails to navigate the world physically. Moral deontic intuitions (e.g., "do not stab this picture") do not share this constitutive link to physical survival. The evolutionary pressure on logic is *truth-tracking*; on morality, it is *fitness-tracking*.

  ### 4. The Diagnostic Question
  **Time:** Minute 85
  **The Goal:** Distinguish structural grasp from skeptical agreement.

  *   **The Question:** *"If you were a **Naturalist** Moral Realist (believing moral facts are facts about well-being or social cohesion), which specific premise of the argument presented today would you reject?"*
  *   **Why this works:**
      *   **The Skeptic** (who merely agrees morality is bunk) will likely say: "None, it's all nonsense."
      *   **The Understander** (who grasps the structure) will identify the **Causal Inertness/Independence** premise. They will recognize that if moral facts *are* natural facts about fitness/cohesion, then evolution *would* track them, and the debunking argument fails.
      *   **Success Condition:** This confirms they understand the argument targets *Non-Naturalist Realism* specifically, not moral belief *simpliciter*.

  ### 5. Explicit Omissions
  **Time:** Minute 88 (Closing Remarks)
  **The Goal:** Bound the scope without diminishing the argument.

  *   **What to Leave Out:**
      1.  **Game-Theoretic Mechanics:** Do not present matrices for Iterated Prisoner's Dilemmas or Altruism models.
      2.  **Metaethical Alternatives:** Do not detail Quasi-Realism, Error Theory, or Sensibility Theory.
      3.  **Third-Factor Explanations:** Do not delve into the "Euthyphro-style" defense where a third factor (e.g., survival) causes both the moral fact and the belief.
  *   **How to State It:**
      *   "We are bracketing the *biological mechanics* of cooperation and the *reconstructive projects* of alternative metaethics. We are treating this session as a **targeted epistemic audit** of one specific ontological claim: that causally inert normative facts are knowable. Introducing game theory or alternative realist frameworks would obscure the specific reliability challenge facing the Non-Naturalist hypothesis. We are testing the *cost* of Non-Naturalism, not solving the *problem* of Normativity."

  ### Summary of the Arc for the Instructor
  1.  **Setup (20m):** Non-naturalism = Causal Inertness. Evolution = Fitness Tracking.
  2.  **Case (25m):** Julie & Mark. Deontic intuition vs. Evolutionary cause. Explanatory redundancy of moral facts.
  3.  **Inference (20m):** The Coincidence Challenge. (Defuse Genetic Fallacy & Just-So objections here).
  4.  **Scope (15m):** Why Logic survives but Deontic Morality doesn't. (Defuse Global Skepticism).
  5.  **Diagnosis (5m):** The Naturalist Realist Premise Check.
  6.  **Close (5m):** Declare omissions as necessary for epistemic focus.
