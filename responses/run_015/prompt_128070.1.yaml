      *   *Did I address the women/servants issue carefully?* Yes, need to emphasize that Spinoza claims it's "natural" but modern readers (and careful Spinozists) see it as an empirical failure on his part, not a metaphysical necessity. It's not derived from *Ethics* definitions.
      *   *Did I avoid bibliography?* Yes.

