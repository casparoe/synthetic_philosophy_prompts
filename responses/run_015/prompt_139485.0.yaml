prompt: |-
  I lead a three-person environment-model team at a company that operates fleets of autonomous delivery robots inside large hospitals: the robots move pharmacy items, specimens, linen and meals along mapped corridors and through service lifts. My team owns the world model the planner reads, and we process roughly ten to fifteen change requests and incident reports per week: a corridor being re-floored, a supplier switching container, a new infection-control rule about which lifts may be used, a near-miss write-up from a porter. Right now we have no principled way to decide whether one of these is a fact to add, a fact to start watching, or evidence that the model itself is wrong about what the world contains.

  I want a decision procedure my on-call engineer can run in about thirty minutes, with a bachelor's-level engineering background and no formal logic, and then bring to a weekly ninety-minute review where two engineers sign off. Its output has to be auditable by an outside assessor months later, so each step needs to record what was decided and on what basis. Please ground it in what the frame problem literature actually distinguishes: inferring that an action left something alone without being told (the frame-axiom problem), unstated preconditions (the qualification problem), unstated downstream consequences (the ramification problem), and the version of the problem where a bounded agent has to decide what to think about at all rather than what to infer. Tell me which of those distinctions survive being turned into a half-hour checklist and which collapse under the simplification, and be explicit about which steps are judgment calls wearing procedural clothing.

  To start you off, here is the taxonomy we currently use, which I suspect is drawn in the wrong place. We call a fact baked-in when the planner could not be told about it at runtime even in principle — that a door is either open or shut, that a floor is a single level surface — flagged when it is representable and held fixed until an update arrives, and watched when something checks it at runtime with a named detector and a refresh interval. The category that actually causes our incidents is the fourth, unofficial one: silent dependencies, facts a plan's success relies on that appear in none of the three. My current rule is that every silent dependency must either get a monitor or get a named person's signature. Redraw that split if it misdescribes the problem, and add the second-order step: how to handle the case where the thing that would reveal a stale frame is itself inside the frame, because our detectors are mounted on the robots and can be occluded, mis-mounted, or simply not pointed at the relevant volume.

  Give the questions in order, what counts as a sufficient answer to each, where the procedure stops with a no, and where it hands the decision to a person because it is a question about how much risk the hospital wants rather than about how the world is. Then run it on three real-shaped cases. First: a six-week renovation of the main spine corridor in which the vinyl is being replaced section by section with a different surface, hoarding narrows one stretch to well below our usual clearance, our localisation was tuned on the old floor's visual texture, and our braking distances were validated against the old floor's friction. Second: the pharmacy begins sending controlled drugs in a rigid sealed case that sits proud of the bin lip, where our bin-latched check is a simple beam break and our manifest check is a label scan; the proposed fix is to tag those deliveries large and route them into a deeper bin. Third: a near-miss report reveals that a fire door on a night route had been wedged open with a rubber stop, where our map's door state is binary and a wedged door reads as shut. At least one of these should come out with an answer that costs us something we would rather not pay — say plainly which, and what it costs. Finally, name one kind of change this procedure will systematically mishandle, and why.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Deconstruct the Request:**

      *   **Context:** 3-person environment-model team, autonomous delivery robots in hospitals.
      *   **Input:** 10-15 change requests/incidents per week (renovations, supplier changes, rules, near-misses).
      *   **Goal:** A 30-minute decision procedure for an on-call engineer (BS level, no formal logic) to categorize inputs, leading to a 90-minute weekly review (2 engineers sign off).
      *   **Requirements:** Auditable (record decisions/basis), grounded in Frame Problem literature (Frame Axioms, Qualification, Ramification, Relevance/Bounded Rationality), explicit about judgment calls vs. procedural steps.
      *   **Critique of Current Taxonomy:** "Baked-in" (hardcoded), "Flagged" (static until update), "Watched" (runtime sensor check). Missing: "Silent Dependencies" (unstated assumptions). Current rule: Silent dependencies get a monitor or a named owner.
      *   **Specific Challenge:** Second-order problem (detectors are part of the world they measure and can fail/be occluded).
      *   **Output Format:** Ordered questions, sufficient answers, stop conditions, hand-off points (risk vs. fact).
      *   **Test Cases:**
          1.  Corridor renovation (floor texture, clearance, friction).
          2.  Pharmacy controlled drugs (new container, beam break issue).
          3.  Fire door wedged open (map state vs. physical reality).
      *   **Constraint:** At least one case must result in an unwanted cost.
      *   **Final Requirement:** Name one kind of change the procedure will systematically mishandle.
      *   **Theoretical Grounding:** Explain which Frame Problem distinctions survive simplification and which collapse.

  2.  **Theoretical Grounding (Frame Problem Literature vs. Engineering Reality):**

      *   *Frame Axiom Problem:* Inferring what *didn't* change. In engineering, this maps to "Default Persistence." Does the engineer assume the floor friction is the same unless told otherwise?
      *   *Qualification Problem:* Unstated preconditions. "The robot can move *unless* the floor is wet." In engineering, this is "Exception Handling" or "Boundary Conditions."
      *   *Ramification Problem:* Unstated consequences. "If the door is wedged, the fire rating is void." In engineering, this is "Side Effects" or "Cascading Updates."
      *   *Relevance Problem (Bounded Rationality):* What to think about. In engineering, this is "Triage" or "Scope."
      *   *Survival:* The *Relevance* distinction survives best as a triage filter. The *Qualification* problem survives as a "Precondition Check."
      *   *Collapse:* The distinction between *Frame* and *Ramification* often collapses in practice. Engineers treat "what stays the same" and "what changes as a result" as a single "Impact Assessment." The philosophical nuance of *why* it's hard to compute (logic vs. computation) doesn't matter to the on-call engineer; only the *risk* matters.

  3.  **Designing the Procedure (The "30-Minute Triage"):**

      *   *Goal:* Move from "Incident/Request" to "Model Action."
      *   *Categories:* Instead of Baked/Flagged/Watched, let's use:
          1.  **Invariant:** Physical law or hard constraint (cannot change).
          2.  **State:** Dynamic fact (needs update).
          3.  **Assumption:** Unverified belief (needs monitoring or acceptance).
          4.  **Blind Spot:** Unknown unknown (needs exploration).
      *   *Addressing Silent Dependencies:* This is the core. A silent dependency is an *Assumption* that wasn't recorded.
      *   *Addressing Second-Order (Detector Reliability):* Need a step that asks "If the monitor fails, do we know?"
      *   *Risk vs. Fact:* Engineers decide facts; Hospital Admin/Safety decides risk tolerance.

      *   *Drafting the Steps:*
          1.  **Relevance:** Is this in our scope? (Relevance Problem)
          2.  **Persistence:** Did this change, or did our knowledge change? (Frame Axiom)
          3.  **Preconditions:** What must be true for the robot to act? (Qualification)
          4.  **Consequences:** What else breaks if this is true? (Ramification)
          5.  **Observability:** Can we see it? Can we see the sensor seeing it? (Second-Order)
          6.  **Risk Acceptance:** If we can't see it, who says it's okay?

  4.  **Refining the Taxonomy:**

      *   Current: Baked-in, Flagged, Watched, Silent.
      *   Proposed:
          1.  **Structural (Baked-in):** Physics/Topology. Hard to change.
          2.  **Operational (Flagged):** Map data. Updated via admin.
          3.  **Monitored (Watched):** Sensor-driven.
          4.  **Accepted Risk (The "Silent" fix):** We know we don't know, and we sign off on it.
      *   *Correction:* The prompt asks to redraw the split if it misdescribes the problem. The "Silent Dependency" isn't a category of fact; it's a *failure mode* of the categorization. The fix is to force every dependency into Structural, Operational, or Monitored. If it can't fit, it becomes an **Explicit Assumption** (which requires the "Named Person's Signature" rule).

  5.  **Developing the Checklist (The "30-Minute Protocol"):**

      *   *Step 1: Scope (Relevance).* Is this world or robot?
      *   *Step 2: Persistence (Frame).* Did the world change or just our view?
      *   *Step 3: Preconditions (Qualification).* What hidden rules does this trigger?
      *   *Step 4: Observability (Second-Order).* Can the sensor see the change, and can we see the sensor?
      *   *Step 5: Risk Handoff.* If we can't monitor, who accepts the risk?

  6.  **Running the Test Cases:**

      *   *Case 1 (Renovation):* Floor texture (Loc), Friction (Braking), Clearance (Geometry).
          *   *Outcome:* High cost. Needs temporary map versioning + reduced speed limits (Operational cost) + manual verification (Labor cost).
      *   *Case 2 (Pharmacy Case):* Container height.
          *   *Outcome:* Software fix (tagging) + Bin mapping update. Moderate cost.
      *   *Case 3 (Fire Door):* Wedged open.
          *   *Outcome:* This is the tricky one. The map says "Closed" (passable). Physical is "Open" (passable but unsafe). Or "Wedged" = "Blocked"? If wedged open, it reads as shut (closed door). Wait, prompt says "wedged open... reads as shut." If the door is *open*, the robot can pass. If the map says *shut*, the robot thinks it's blocked. Wait, "wedged open... reads as shut." Usually, a door sensor says "Open" or "Closed". If wedged open, the latch is open. If the system reads "Shut", it implies the sensor thinks the door is closed (latched). This implies the sensor is lying or the definition is flipped. Let's assume: Map says "Door" (obstacle if closed). Sensor says "Closed". Physical is "Open". Robot thinks it's blocked. It won't move.
          *   *Correction on Case 3:* "Wedged open... map's door state is binary and a wedged door reads as shut." If the door is wedged *open*, it should be passable. If the map says "Shut" (impassable), the robot stops. This is a false positive blockage.
          *   *Alternative Interpretation:* The door is a fire door. It *must* be closed. It is wedged open (violation). The robot's map says "Door exists". The sensor says "Closed" (because the wedge holds the latch mechanism? No, usually wedging keeps it open). Let's stick to the prompt: "reads as shut." If it reads as shut, the robot treats it as a barrier. If it's physically open, the robot is unnecessarily blocked.
          *   *Better Interpretation for Risk:* The robot assumes fire doors are closed (safe). If wedged open, it's a fire hazard. The robot doesn't know. The *risk* is the fire code violation, not the navigation.
          *   *Decision:* This requires a "Human in the Loop" or "Accept Risk" signature because the robot cannot detect the wedge.

      *   *Selecting the "Unwanted Cost":* Case 1 is the best candidate. Slowing down the fleet during renovation reduces throughput.

  7.  **Addressing the "Systematic Mishandle":**

      *   What does this checklist miss? *Emergent behavior* or *Correlated failures*. The checklist treats facts atomically. It won't catch "The floor is slippery AND the lights are dim AND the wifi is laggy." It misses *contextual coupling*.

  8.  **Drafting the Content (Iterative refinement for tone and constraints):**

      *   *Tone:* Professional, engineering-focused, slightly philosophical but pragmatic.
      *   *Structure:*
          1.  Theoretical Mapping (What survives/collapses).
          2.  The Revised Taxonomy.
          3.  The 30-Minute Procedure (Steps 1-5).
          4.  The Test Cases.
          5.  The Systematic Failure.
      *   *Constraint Check:* 30 mins? Yes. BS engineering? Yes. Auditable? Yes (Log fields). Second-order sensor issue? Included in Step 4.

      *(Self-Correction during drafting)*: Make sure to explicitly state which distinctions collapse. The Frame/Ramification collapse is key. The Qualification problem becomes "Precondition Check." The Relevance problem becomes "Scope Check."
      *(Self-Correction on Case 3)*: Ensure the "Cost" is explicit in Case 1.
      *(Self-Correction on Taxonomy)*: The prompt asks to redraw the split if "Silent Dependency" is the wrong category. I will argue "Silent Dependency" is not a category of fact, but a *violation of the classification process*. The new category is "Accepted Assumption."

  9.  **Final Polish:** Check against the "auditable by outside assessor" requirement. Each step needs a "Record" field. Check against "judgment calls wearing procedural clothing." I need to point out where the engineer is actually guessing but the form makes it look like a fact.

      *Refining the "Second-Order" step:* The prompt specifically asks about detectors inside the frame. Step 4 must address "Meta-Observability."

      *Refining the "Risk vs Fact" handoff:* Step 5 is the gate. If we can't monitor and can't hardcode, it goes to the Safety Officer/Hospital Admin.

      *Let's write it.*
answer: |-
  ### Part 1: Theoretical Grounding & Taxonomy Redraw

  **What Survives Simplification**
  1.  **The Relevance Problem (Bounded Rationality):** This survives intact as **Scope Triage**. The engineer cannot reason about the whole world; they must decide if the change is *our* problem. This is a binary filter: "Is this in the model's domain?"
  2.  **The Qualification Problem (Unstated Preconditions):** This survives as **Dependency Mapping**. It becomes the checklist item: "What hidden conditions must hold for this fact to remain true?"
  3.  **The Frame Axiom Problem (Persistence):** This survives as **Update Policy**. It answers: "Do we assume this stays true until told otherwise, or does it decay?"

  **What Collapses**
  1.  **Frame vs. Ramification:** In formal logic, distinguishing what *stays* the same (Frame) from what *changes as a consequence* (Ramification) is distinct. In engineering, these collapse into **Impact Assessment**. An engineer does not need to prove why the friction changed; they only need to know that *if* the floor changes, *then* braking changes. We treat both as "Downstream Effects."
  2.  **Truth vs. Utility:** The literature cares about ontological truth. Your team cares about **Actionability**. A fact that is true but unobservable is operationally identical to a fact that is false. The procedure treats them the same: "Unmonitorable Risk."

  **The Taxonomy Redraw**
  Your current split (Baked-in, Flagged, Watched, Silent) is flawed because "Silent" is a failure state, not a category. You cannot manage a dependency by calling it "silent." I propose replacing "Silent Dependency" with **Accepted Assumption**.

  1.  **Structural (Baked-in):** Physical laws or topology that cannot change at runtime (e.g., gravity, corridor connectivity). *Update mechanism: Code release.*
  2.  **State (Flagged):** Facts that change infrequently and are authoritative when updated (e.g., room numbers, lift permissions). *Update mechanism: Map push.*
  3.  **Monitored (Watched):** Facts verified by sensors at runtime (e.g., dynamic obstacles, lift door status). *Update mechanism: Sensor stream.*
  4.  **Accepted Assumption (The "Silent" Fix):** Facts we cannot Structuralize, State, or Monitor, but must proceed as if true. *Update mechanism: Risk Signature.*

  **The Second-Order Problem**
  You noted that detectors are inside the frame (occluded, broken). The procedure must distinguish between **Object Observability** (Can the sensor see the floor?) and **Meta-Observability** (Can the system see that the sensor is blind?). If Meta-Observability is false, the fact cannot be "Monitored"; it must be "Accepted Assumption."

  ---

  ### Part 2: The 30-Minute Triage Procedure

  **Auditing Requirement:** For every step, the engineer must fill the **Decision Log** (Date, Ticket ID, Step Verdict, Evidence Link).

  #### Step 1: Scope & Relevance (The Relevance Problem)
  *   **Question:** Is this change within the physical or operational boundaries of the robot fleet's mapped environment?
  *   **Sufficient Answer:** "Yes, it affects Route X" or "No, it is outside the service envelope."
  *   **Stop Condition:** If **No**, close ticket. Log: "Out of Scope."
  *   **Judgment Call:** Defining the "service envelope." (e.g., Is the loading dock *our* world or the supplier's?)
  *   **Handoff:** None.

  #### Step 2: Persistence & Frame (The Frame Axiom Problem)
  *   **Question:** Is this a transient state (lasts hours/days) or a permanent structural change (lasts months/years)?
  *   **Sufficient Answer:** "Transient" (e.g., spill, temporary hoarding) or "Permanent" (e.g., re-tiling, wall moved).
  *   **Decision:**
      *   If **Permanent**: Mark as **State** (Flagged). Proceed to Step 3.
      *   If **Transient**: Mark as **Monitored** (Watched) *if* sensors can see it. If not, mark as **Accepted Assumption**. Proceed to Step 4.
  *   **Judgment Call:** "Permanent" vs. "Transient." A 6-week renovation is transient in building life but permanent in sprint life. *Rule:* If it outlasts 3 map cycles, treat as Permanent.

  #### Step 3: Preconditions & Qualifications (The Qualification Problem)
  *   **Question:** List every subsystem that relies on the *negation* of this change. (e.g., If floor changes, braking relies on old friction; if bin changes, latch relies on old height).
  *   **Sufficient Answer:** A list of affected subsystems (Locomotion, Perception, Manipulation).
  *   **Stop Condition:** If the list is empty, close ticket. Log: "No Impact."
  *   **Judgment Call:** Determining "reliance." Engineers often miss indirect dependencies (e.g., visual localization relying on floor texture). *Procedure:* Require sign-off from one other engineer on the dependency list.

  #### Step 4: Observability & Meta-Observability (The Second-Order Problem)
  *   **Question A:** Do our current sensors detect this state directly?
  *   **Question B:** If the sensor fails or is occluded, does the system know it is blind?
  *   **Sufficient Answer:**
      *   **Yes/Yes:** Categorize as **Monitored**.
      *   **Yes/No:** Categorize as **Accepted Assumption** (Sensor is a single point of failure).
      *   **No:** Categorize as **Accepted Assumption**.
  *   **Stop Condition:** If **Monitored**, define refresh rate and close ticket.
  *   **Judgment Call:** Assessing "Meta-Observability." (e.g., A LIDAR can see a wall, but can it tell if the LIDAR is dirty? Usually no.)
  *   **Handoff:** If **Accepted Assumption**, proceed to Step 5.

  #### Step 5: Risk Acceptance (The Boundary of Engineering)
  *   **Question:** If this assumption is wrong, what is the physical consequence? (Delay, Damage, Injury, Regulatory Violation).
  *   **Sufficient Answer:** Severity classification (Low, Medium, High/Critical).
  *   **Decision:**
      *   **Low/Medium:** Engineer signs as **Owner**. Ticket closed.
      *   **High/Critical:** **Handoff to Safety Officer/Hospital Admin.** Ticket remains "Pending Signature."
  *   **Judgment Call:** This is not a judgment call for the engineer. This is a **Risk Policy**. The engineer classifies the *consequence*; the Hospital classifies the *tolerance*.
  *   **Auditable Output:** The "Risk Signature" field must contain a name, date, and role (e.g., "Head of Facilities, 2023-10-27").

  ---

  ### Part 3: Running the Cases

  #### Case 1: Six-Week Corridor Renovation
  *   **Step 1 (Scope):** Yes, Main Spine is primary route.
  *   **Step 2 (Persistence):** 6 weeks > 3 map cycles. Treat as **Permanent** for duration, then revert.
  *   **Step 3 (Preconditions):**
      *   *Localization:* Visual odometry tuned on old vinyl texture. (High Risk)
      *   *Kinematics:* Braking validated on old friction coefficient. (High Risk)
      *   *Geometry:* Hoarding narrows clearance below usual margin. (Critical)
  *   **Step 4 (Observability):**
      *   *Texture/Friction:* Sensors cannot measure friction coefficient directly. Meta-observability: No. -> **Accepted Assumption**.
      *   *Clearance:* LIDAR sees hoarding. Meta-observability: Yes (if LIDAR fails, robot stops). -> **Monitored**.
  *   **Step 5 (Risk):**
      *   *Friction/Loc:* If wrong, robot slips or loses pose. Collision risk. **Critical**.
      *   *Decision:* **Handoff to Safety Officer.**
  *   **Outcome & Cost:**
      *   The Safety Officer will not sign off on "Assumed Friction."
      *   **Cost:** You must deploy a **Temporary Speed Limit** (50% reduction) for the zone to reduce kinetic energy, and schedule **Daily Manual Verification** of localization drift by a technician.
      *   **Why:** This costs throughput (fewer deliveries/hour) and labor (technician time). You would rather not pay this, but the procedure forces the risk handoff, and the hospital will not accept the liability of unverified friction during renovation.

  #### Case 2: Pharmacy Controlled Drugs (New Container)
  *   **Step 1 (Scope):** Yes, Pharmacy loading/unloading.
  *   **Step 2 (Persistence):** Permanent (Supplier switch). **State**.
  *   **Step 3 (Preconditions):**
      *   *Bin Latch:* Beam break height assumes old container profile. (Medium Risk)
      *   *Manifest:* Label scan location unchanged. (Low Risk)
  *   **Step 4 (Observability):**
      *   *Height:* Beam break is binary. It will not trigger if case is too tall. Meta-observability: No (if beam breaks, we assume fit). -> **Accepted Assumption**.
      *   *Fix:* Tag deliveries "Large" and route to deep bin.
  *   **Step 5 (Risk):**
      *   *Consequence:* Container falls out or jams bin. Damage to robot/drugs. **Medium**.
      *   *Decision:* Engineer signs as **Owner** (provided the software fix is deployed).
  *   **Outcome:** Software update to tag "Large" + Map update for Deep Bin. No external handoff.

  #### Case 3: Fire Door Wedged Open
  *   **Step 1 (Scope):** Yes, Night Route.
  *   **Step 2 (Persistence):** Transient (Human behavior). **Monitored** (ideally).
  *   **Step 3 (Preconditions):**
      *   *Navigation:* Map says "Door Closed" (Impassable). Physical is "Open" (Passable). Robot stops unnecessarily. (Low Risk)
      *   *Compliance:* Fire door *must* be closed. Wedged open is a violation. Robot passing through implies complicity? (Critical Risk).
  *   **Step 4 (Observability):**
      *   *State:* Door sensor reads "Shut" (because wedge holds latch mechanism or sensor is magnetic on frame).
      *   *Meta-Observability:* No. Robot cannot distinguish "Closed Safe" from "Wedged Open Unsafe."
      *   *Category:* **Accepted Assumption**.
  *   **Step 5 (Risk):**
      *   *Consequence:* Fire code violation. Hospital liability.
      *   *Decision:* **Handoff to Safety Officer.**
  *   **Outcome:** The Safety Officer cannot sign off on "Robot ignores fire door state."
      *   **Fix:** The route must be altered to avoid this door at night, or a **Human Patrol** must verify the door before the robot shifts start.
      *   **Cost:** Increased route time or labor cost.

  ---

  ### Part 4: Systematic Mishandle

  **The Change Type:** **Correlated Contextual Drift.**

  **Why:** This procedure treats facts atomically (Step 3 lists dependencies, but evaluates them in isolation). It will systematically fail when multiple low-risk "Accepted Assumptions" combine to create a high-risk state.
  *   *Example:* The floor is slightly slippery (Assumption 1, Low Risk). The battery is slightly degraded (Assumption 2, Low Risk). The wifi latency is slightly high (Assumption 3, Low Risk). Individually, each gets an Engineer Signature. Together, they cause a failure during an emergency stop.
  *   **Reason:** The checklist lacks a **Coupling Analysis**. It asks "What depends on this?" but not "What else is currently degraded that interacts with this?" Because the on-call engineer sees one ticket at a time, they cannot see the accumulating debt of assumptions across the fleet. This requires a systemic view that a 30-minute triage cannot support.

  ### Part 5: Explicit Judgment Calls (Procedural Clothing)

  1.  **Step 2 (Persistence):** Deciding if a 6-week renovation is "Permanent." This is arbitrary. I set the rule at "3 map cycles," but that is a policy choice, not a fact of the world.
  2.  **Step 4 (Meta-Observability):** Deciding if a sensor failure is detectable. Engineers often *believe* their diagnostics are better than they are. Checking "Yes" here is often an act of faith, recorded as fact.
  3.  **Step 5 (Severity Classification):** Distinguishing "Damage" (Medium) from "Injury" (Critical). In a hospital, a dropped tray of linen is Low risk; a dropped tray of specimens is High risk. The engineer must judge the *content* risk, which they may not fully understand. This is where the "Outside Assessor" will most likely find variance in your logs.
