prompt: |-
  I am preparing teaching materials for a course on rational decision theory, and I wish to include a satirical text that probes the boundary between technical criterion and lifestyle ideology. Please write a deadpan internal policy memorandum — approximately 650 words, composed in British English — issued by a fictional London consultancy named Ergodic Partners LLP, setting out the firm's mandatory "Geometric Protocols" for all professional and personal conduct. The memo should be voiced by an invented senior partner, Dr Alistair Vance, and should apply Kelly-optimal reasoning — with its dependence on precisely calibrated probabilities, its implicit logarithmic utility function, and the tension between conservative bet sizing and leveraged growth — to domains where it manifestly does not belong: hiring (fractional Kelly allocation across a portfolio of candidates), workplace attachments (expected log-utility of emotional investment), meeting strategy (risk-parity in conversational stakes), and the annual corporate retreat (geometric growth targets for collective morale). The satire must remain entirely deadpan, never signalling that the application is absurd, and must exaggerate real mathematical features of geometric rationality rather than inventing straw-man errors; in particular, it should treat the ergodicity distinction between ensemble expectation and single-trajectory time-averaging as if it were a direct guide to interpersonal ethics. The target of the satire is the popular discourse — found in certain finance and rationalist writing — that elevates the Kelly criterion from a betting tool to a universal normative framework for life decisions. Following the memo, please provide a brief reflective note of no more than 150 words identifying precisely where the satire takes liberties with the mathematics or relies on a contested interpretation of the ergodicity critique, and state clearly which argument or clarification would cause you to regard the satire as unfair or in need of revision. I was discussing this with a colleague who teaches decision theory, and we agreed that the slippage between technical growth maximisation and moral prescription is genuinely ambiguous; please write as though addressing that ambiguity directly.
