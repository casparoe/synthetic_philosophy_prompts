  **INTERNAL MEMORANDUM**

  **TO:** All Staff
  **FROM:** Dr Alistair Vance, Senior Partner
  **DATE:** 14 October 2023
  **SUBJECT:** Mandatory Adoption of Geometric Protocols for Professional and Personal Conduct

  Following the Q3 review of firm-wide trajectory metrics, Ergodic Partners LLP is formalising its commitment to strict geometric rationality. As previously discussed in seminar series E-404, the distinction between ensemble averages and time-average growth rates is not merely statistical; it is ethical. To operate within a non-ergodic environment while behaving as though ensemble expectations apply is a fiduciary breach of one's own existence. Consequently, effective immediately, all conduct must align with the Kelly-optimal framework. We must recognise that life is a single trajectory; therefore, maximising the expected logarithm of utility is the only robust strategy against ruin.

  **1. Recruitment and Onboarding Allocation**
  Traditional hiring assumes a binary outcome: employed or unemployed. This ignores the volatility of human capital. Henceforth, roles will not be filled but allocated via fractional Kelly positioning. Candidates represent a portfolio of stochastic cash flows. You are instructed to distribute your mentorship hours across a diversified basket of prospects proportional to your edge over the market consensus. To commit fully to a single hire is to accept ruin risk should that individual's performance revert to the mean. Diversification is not merely prudent; it is a moral imperative against variance drag. Rebalancing of mentorship allocation should occur quarterly to maintain optimal leverage.

  **2. Interpersonal Attachments and Log-Utility**
  Emotional investment possesses a logarithmic utility function relative to professional longevity. High-leverage attachments expose the firm to catastrophic drawdowns in the event of colleague departure or conflict. Staff must calculate the optimal fraction of social capital to wager on any single relationship. If the probability of reciprocal trust is below the Kelly threshold, exposure must be hedged. We do not forbid friendship, but we mandate that the geometric growth rate of your social portfolio remains positive. Burnout is simply ruin; therefore, over-leveraging empathy is prohibited. Furthermore, staff must account for correlation coefficients between colleagues; clustering emotional risk violates ergodic safety constraints.

  **3. Meeting Strategy and Conversational Stakes**
  Dialogue is a market of ideas with asymmetric payoffs. Asserting a viewpoint constitutes a long position. To maintain ergodicity, speakers must size their convictions according to the log-optimal fraction of their credibility reserve. Unqualified agreement is effectively going all-in on uncertain premises. Please utilise risk-parity weighting when contributing to brainstorming sessions. If your edge is uncertain, reduce exposure to neutral acknowledgement. This protects the firm's collective epistemic capital from volatility-induced decay. Silence is preferable to negative geometric growth in reputation.

  **4. Annual Retreat and Morale Compounding**
  The Cornwall retreat will no longer focus on 'team bonding' in the arithmetic sense. Activities are redesigned to maximise the geometric growth rate of collective morale. Note that arithmetic average happiness is irrelevant if the median trajectory leads to dissolution. We target a positive Lyapunov exponent for group cohesion. Participation is mandatory to ensure the time-average path aligns with the firm's growth vector. Deviations from the scheduled optimisation exercises will be treated as leakage in the compounding process.

  Adherence to these protocols ensures that our individual trajectories do not diverge from the firm's optimal path. Remember: what matters is not what happens to the ensemble of consultants, but what happens to you, over time.

  **Dr Alistair Vance**
  Senior Partner

  ***

  **Reflective Note**

  The satire takes liberties by assuming interpersonal interactions are independent, repeatable bets with quantifiable odds, ignoring that relationships are constitutive rather than instrumental. It also conflates financial wealth with emotional utility, presupposing a logarithmic function for empathy without justification. The ergodicity critique is weaponised here to bridge the is-ought gap, treating physical constraints on growth as moral duties. I would regard this satire as unfair if a robust argument demonstrated that rational agency *requires* geometric maximisation of all valued goods, not just wealth, thereby validating the slippage between technical growth and moral prescription as a feature of coherent agency rather than a category error.
