answer: |-
  ### Brainstorming and Conceptual Distinctions

  Before addressing your specific case, we must disentangle three conceptual threads that are often conflated in discussions of the Ring of Gyges and moral psychology.

  1.  **Moral Internalism vs. Externalism:**
      *   *Internalism* holds that if an agent judges that action $X$ is morally required, they necessarily have *some* motivating reason to do $X$ (or that moral judgment itself constitutes a motivation).
      *   *The Twist:* Your character *is* an internalist in structure. She judges "I must be just," and she is motivated to be just. The defect is not in the link between judgment and motivation, but in the **content of the judgment**. She has manipulated the concept of "justice" so that it no longer conflicts with her self-interest. This is not a failure of will (*akrasia*); it is a failure of **moral perception** or **conceptual formation**.

  2.  **Glaucon's Challenge (The Republic, Book II):**
      *   Glaucon demands that justice be praised *in itself* ($kath' hauto$), stripped of consequences (reputation, rewards).
      *   The standard Socratic response is that injustice damages the soul's harmony.
      *   *The Twist:* Your character accepts the premise ("Justice is good in itself") but subverts the ontology of "injustice." Glaucon assumes a shared, robust understanding of injustice (harming others, taking what isn't yours). Your character adopts a **formalist** or **minimalist** definition that excludes "refined" harms. She answers Glaucon's challenge by changing the vocabulary of the test rather than passing it.

  3.  **Rationalization vs. Self-Deception:**
      *   *Self-Deception* typically implies a doxastic conflict (believing $p$ while knowing $\neg p$, or avoiding evidence of $\neg p$). You specify she is "fully conscious."
      *   *Rationalization* is the provision of reasons that are causally ineffective but explanatory plausible.
      *   *The Twist:* Her rationalization is **constitutive**. She isn't making excuses *after* the act; she has structured her moral framework *prior* to the act so that the act does not register as requiring an excuse. This is **pre-emptive rationalization**.

  ---

  ### Analysis of Existing Terms

  You have correctly identified that standard terminology fails to capture this specific configuration. Here is why the nearest candidates fall short:

  *   **Hypocrisy:** Hypocrisy requires a discrepancy between *avowed* values and *actual* values, usually with an intent to deceive others. Your character avows "Justice" and believes she embodies it. There is no conscious gap between her self-conception and her actions. She is not pretending; she is **redefining**.
  *   **Self-Deception:** As noted, standard models of self-deception involve some suppression of truth or evidence. Your character sees the actions clearly (reading letters, manipulating committees) but categorizes them differently. This is not a failure of *sight*, but of *labeling*.
  *   **Motte-and-Bailey:** This fallacy involves retreating to a defensible claim (the Motte) when challenged, while acting on an indefensible one (the Bailey). Your character does not retreat. She holds a single, consistent line: "I am just, and these actions are just." She does not admit the actions are controversial even when pressed; she denies the controversy exists.
  *   **Moral Licensing:** This requires a temporal sequence: a good deed creates "credit" to spend on a bad one. Your character requires no prior credit. The "license" is inherent in her definition of the situation.
  *   **Ethical Fading:** (Tenbrunsel & Messick). This occurs when the ethical dimensions of a decision disappear from view. While close, your character *keeps* the ethical dimension in view ("I am being just/prudent") but empties it of its normative force regarding others.

  ### The Ancient Parallel: *Deinotes* vs. *Phronesis*

  In Ancient Moral Philosophy, specifically Aristotle's *Nicomachean Ethics* (Book VI), there is a distinction that maps precisely onto your character's psychology.

  *   ***Phronesis* (Practical Wisdom):** The capacity to deliberate well about what is good *for the human being as such*. It implies virtue.
  *   ***Deinotes* (Cleverness):** The capacity to hit any mark one aims at. A virtuous person has *phronesis*; a vicious person can have *deinotes*.

  Aristotle notes that *deinotes* is often mistaken for *phronesis*. The clever person can achieve their ends efficiently. If their ends are selfish, they are "refined" villains. Your character claims *phronesis* (she calls her actions "prudent" and "just") but exhibits *deinotes* (she achieves advantage without technical rule-breaking).

  However, Aristotle does not have a single noun for the *posture* of claiming the former while exercising the latter under the guise of invisibility.

  ### The Proposed Term: **Normative Self-Exemption**

  Since no single canonical term captures this specific nexus of internalist claim, definitional shifting, and refined exploitation, I propose the term **Normative Self-Exemption**.

  #### Definition
  **Normative Self-Exemption** is a defensive cognitive posture wherein an agent preserves a self-conception of moral integrity by strategically narrowing the extension of moral concepts (e.g., "justice," "harm," "dishonesty") to exclude actions that serve their self-interest, while maintaining the outward language of moral commitment.

  Unlike hypocrisy, the agent genuinely assents to the redefined concept. Unlike self-deception, the agent is conscious of the factual nature of their actions but reclassifies their normative status.

  #### Boundary Conditions
  1.  **Conscious Agency:** The agent knows what they are doing physically (e.g., "I am hiding this letter") but denies the moral predicate (e.g., "This is not 'theft' of information").
  2.  **Definitional Shift:** The core mechanism is semantic or categorical. The boundary of the vice is moved to stop precisely before the agent's own behavior.
  3.  **Internalist Claim:** The agent insists they are motivated by morality ("I value justice"), not merely expediency, distinguishing them from a cynic or Thrasymachean realist.
  4.  **Rule-Compliance:** The actions typically adhere to the *letter* of formal rules while violating the *spirit* or purpose of the moral norm.

  #### Distinction from Adjacent Phenomena
  *   **Vs. Moral Licensing:** Licensing is *transactional* (Good Act A buys Bad Act B). Normative Self-Exemption is *ontological* (Act B is not "Bad" by definition).
  *   **Vs. Casuistry:** Casuistry is the application of general rules to specific cases. While this posture uses casuistic reasoning, Casuistry can be virtuous. Normative Self-Exemption is inherently self-serving and defensive.
  *   **Vs. Legalism:** Legalism is adherence to rules. Normative Self-Exemption uses legalism as a *shield* for a claim to virtue. A legalist says, "I followed the rule." The Self-Exempting agent says, "Because I followed the rule, I am *Just*."

  ### Application to Your Dialogue

  For a novelist, **Normative Self-Exemption** provides a precise label, but you might also consider the dramatic implications of the ancient distinction.

  In your dialogue, the interlocutor could challenge her not on *what* she did, but on *what she calls it*.
  *   **The Trap:** If she admits the actions are "self-serving," she loses the claim to Justice. If she insists they are "just," she must define Justice in a way that seems absurd to the listener (e.g., "Justice is merely rule-compliance").
  *   **The Ancient Critique:** A Socratic interlocutor would argue she possesses *deinotes* (cleverness) but lacks *phronesis* (wisdom). She is technically skilled at navigation but has no destination.

  **Suggested Terminology for the Text:**
  If you wish to use an established philosophical term that is evocative, **"Sophistic Redescription"** works well historically. The Sophists were famous for making the weaker argument appear stronger through linguistic manipulation.
  However, for precision regarding the psychological structure you described, **"Normative Self-Exemption"** is the most accurate coinage.

  **Example of the distinction in dialogue:**
  > "You call this prudence?" the interlocutor asked.
  > "I call it justice," she replied. "I have broken no law. I have stolen nothing."
  > "You have exempted yourself from the norm," he said. "You define the poison by the cup, not by the effect."

  ### Summary
  There is no single canonical term in the history of philosophy that isolates this exact configuration. It is a hybrid of **Aristotelian *Deinotes*** (cleverness without virtue), **Modern Moral Disengagement** (specifically *euphemistic labeling*), and **Motivated Reasoning**.

  I recommend coining **Normative Self-Exemption** for your philosophical notes. It captures the defensive nature of the move, the manipulation of the normative category, and the preservation of the self-concept. It distinguishes the posture from hypocrisy (which implies lying) and self-deception (which implies ignorance), locating the error instead in the **strategic construction of the moral boundary**.
