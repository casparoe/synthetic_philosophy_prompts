answer: |-
  Here is the pitch. I am going to be blunt because you asked for a defended agenda, not a syllabus.

  ### 1. The Red Herring: Kill Question (1) Immediately
  **"Whether macro historical outcomes are genuinely locked in" is a metaphysical trap.**

  It is logically incoherent to ask if the "same outcome" would arrive in a divergent timeline because you have no stable identity conditions for the outcome. If the Industrial Revolution happens without coal, is it the Industrial Revolution? If democracy emerges without the Enlightenment, is it democracy?

  As soon as you change the causal path, the *semantic content* of the outcome shifts. You are comparing apples to orbiting spheres. This question consumes decades of philosophy of history (from Weber to Tetlock) precisely because it is unfalsifiable. We have $N=1$ universe. Any claim about "locked-in" macro outcomes is either theology (providence) or physics (determinism), neither of which helps you understand *human* history.

  **Verdict:** Drop it. It is the destination you think you want, but it's a mirage. Chasing it wastes the three years.

  ### 2. The Hierarchy: Why (3) is Upstream of (2)
  You are torn between Micro-to-Macro cascades (2) and Narrative Lock-in (3). Here is the logical dependency:

  *   **Question (2)** asks: *Do small causes amplify?* (The Mechanism)
  *   **Question (3)** asks: *Which small causes get to count as causes?* (The Selection Function)

  Narrative Lock-in (3) is the upstream variable. In human history, a micro-event (a speech, a leaked document, a martyrdom) does not cascade because of its physical energy; it cascades because it is *selected* by a narrative framework to bear causal weight.

  Consider the assassination of Archduke Franz Ferdinand. Physically, it was a minor security failure. Narratively, it was framed as "The Spark." If the collective memory had framed it as "A Tragic Accident," the cascade (WWI) might have been dampened or attributed differently. The narrative *assigns* the causal potency to the micro-event.

  Therefore, **Narrative Lock-in (3) governs the sensitivity of the Micro-to-Macro system (2).** If you solve (3), you explain *why* certain micro-advantages stick (QWERTY, VHS, specific legal precedents) while others vanish. You aren't just studying chaos theory; you are studying the *logic of attribution*.

  **The Ordering:**
  1.  **Narrative Lock-in (3):** The primary filter. It determines which inputs enter the system.
  2.  **Micro-to-Macro (2):** The engine. It processes the inputs selected by (3).
  3.  **Macro Outcomes (1):** The illusion. It is the output we mistakenly treat as a fixed point.

  ### 3. The Agenda: What Makes This Worth Three Years?
  A question is worth years of your life only if resolving it changes the *model of causality* you use, not just your opinion on specific events.

  **The Core Philosophical Work:**
  Don't ask "Is history contingent?" Ask: **"What grants a micro-event the status of a macro-cause?"**

  This is where your logic background pays off. You are investigating the *threshold conditions for causal attribution*.
  *   **The Logic Problem:** In formal logic, $A \to B$ is stable. In history, $A \to B$ depends on whether the observers *believe* $A \to B$. This is a reflexive loop.
  *   **The Novelists Edge:** You understand that "canon" constrains future plot. In history, "canon" (collective memory) constrains future policy. If a nation believes its founding was a revolution (narrative), it funds rebels abroad. If it believes its founding was a negotiation, it funds trade. The *story* becomes a material constraint.

  **Why this beats (2):**
  Complexity theory already handles (2). We know systems have tipping points. The philosophical gap is explaining why *human* systems tip on *symbolic* inputs rather than *material* ones. That is the unique architecture of human history.

  ### 4. Evidence to Watch (The Next 24 Months)
  To validate this agenda, do not look for grand wars. Look for **revisionist turns that changed policy without changing material conditions.**

  *   **The Signal:** Find cases where the *material reality* stayed static, but the *narrative frame* shifted, causing a divergence in path.
      *   *Example:* The re-evaluation of the "Dark Ages." If historians shift the frame from "Collapse" to "Transformation," does funding for medieval studies change? Does it alter how modern institutions view resilience?
      *   *Example:* The "Lost Cause" mythology in the US. The material defeat happened in 1865. The *path dependence* was locked in 1900-1950 via narrative. The causal weight wasn't the war; it was the memory of the war.
  *   **The Metric:** Look for "Counterfactual Robustness." When a narrative shifts, how many policy decisions become invalid? If a single story change collapses a decade of legislation, you have proven Narrative Lock-in is a causal force, not just a description.

  ### 5. The Pitch
  If you chase (1), you become a metaphysician arguing about ghosts.
  If you chase (2), you become a complexity theorist arguing about math.
  If you chase (3), **you become a logician of power.**

  You are investigating how *description becomes prescription*. This is the only line of inquiry where your background as a novelist is not a liability but a methodological advantage. You understand that the *telling* is part of the *event*.

  **Your Defended Thesis:**
  *Path dependence in human history is not a function of initial physical conditions, but of initial **interpretive** conditions. The "lock-in" occurs not when the event happens, but when the event is named.*

  Settle that, and you don't just explain history; you explain why your characters feel like they have no choice, even when the page is blank. That is where the work is. Go there.
