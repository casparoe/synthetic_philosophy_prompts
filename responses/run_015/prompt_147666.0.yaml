      *   *Let's swap 1 and 2.* "Second Defeat" is the most novelistic. "Conscription" is the most thematic. I will rank "Second Defeat" #1 because it drives plot/character best. "Mourning Rights" #2 because it drives conflict. "Conscription" #3 because it's the umbrella but risks abstraction. "Rescue Myths" #4 because it's the most specific to one book.

