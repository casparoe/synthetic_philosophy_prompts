      *   *Concept 3 (Rescue Myths):* Specific to Dunkirk mostly. Harder to apply to Confederate monument (unless framed as "saving the South's honor") or Masada (suicide as victory?). Might be too structural/narrow.
      *   *Concept 4 (Mourning Rights):* Very strong for the Georgia book (monuments). Good for Masada (who owns the narrative?). Less obvious for Dunkirk (unless focusing on who is left out of the celebration?). High emotional stakes for characters.

