      *   *Top Pick:* **The Second Defeat.** Why? It's about *time* and *belief*, which is the stuff of novels. It allows for character arc (believer to skeptic, or vice versa). It applies to all three: The Lost Cause losing power, the Masada narrative being questioned, the Dunkirk spirit fading or changing. It avoids allegory because it's internal/psychological.
      *   *Second Pick:* **Mourning Rights.** Why? It's interpersonal. It creates conflict between characters (who gets to grieve?). It grounds the political in the personal. Good for the monument book especially, but works for family sagas (Masada) and national identity (Dunkirk).
      *   *Third Pick:* **Conscription of the Dead.** Why? It's the title concept, so it has to be there. But it's the most "thesis-heavy." Risk of allegory is high. Needs to be embodied, not argued.
