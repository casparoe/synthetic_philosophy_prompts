  Use this concrete entry case: a language model that predicts human political preferences with 95% accuracy but has no verifiable internal world-model its designers can inspect. From there, branch on four diagnostic questions: (1) Is predictive success alone enough to justify belief-atribution? (2) Must the system have internal representations with genuine aboutness? (3) Does autonomy from the design team matter — could beliefs be "proxy" beliefs that actually belong to the engineers? (4) Does attributing beliefs carry moral or legal weight, or is it purely instrumental?

