answer: |-
  Let's start with your friend in film studies. She is half-right, but stopping at "failure of narrative" risks depoliticizing the film in a way that hurts your seminar. The film does argue that certain truths cannot be written down—Espósito's writer's block is the literalization of that—but it insists that this narrative failure has a material cost. It isn't just that the story can't be told; it's that because the story can't be told within the rules of evidence or the norms of the transition, justice remains incomplete. So, tell your students: the film is about how the *limits* of narrative produce the *limits* of justice. They aren't separate problems.

  Now, to your two coinages. They are sharp tools, but we need to calibrate them against what is settled in the field and what is contested, so you don't present a philosophical argument as empirical consensus.

  **The Unsayable Residue**

  Your claim here is that commissions convert wrongdoing into propositions, leaving non-propositional knowledge (the gaze, the photograph, the intuition) as residue.

  *Where the film bears this out:* The race track scene is the perfect dramatization of this. Espósito sees the look Gómez gives the victim. It is evidentially loaded—it identifies the perpetrator—but it is legally inert. You cannot indict someone on a look. In a hearing, this residue is discarded as speculation. The film's formal apparatus supports you here: the camera lingers on eyes and photos precisely because the dialogue cannot carry the weight of the truth. The close-ups argue that the "fact" of the crime lives in the affect, not the affidavit.

  *Where the reading might distort:* You should flag for students that transitional justice practitioners would push back on the idea that commissions *only* want propositions. Many commissions explicitly sought "narrative truth" or "social truth" precisely to capture the context and experience that forensic propositions miss. However, the *legal* outcomes (prosecutions, reparations) usually do require propositions. So, the residue is often left undischarged not because the commission ignores it, but because the *judicial* arm of the transition cannot process it. The film blurs the line between the investigation and the trial, which works for drama but might confuse students about where the "machine" actually jams.

  *Settled vs. Contested:* It is settled that legal systems struggle with non-forensic evidence. It is contested whether they *should* try to accommodate it. Some argue that loosening evidentiary standards undermines the rule of law the transition is trying to build. Your "residue" concept assumes that this knowledge *ought* to count. That is a moral claim, not a procedural one. Make sure students know that.

  **The Acknowledgement Hostage**

  This is your stronger intuition, but it is also the more contested position in the literature. You argue that amnesty hands the perpetrator a veto over acknowledgement because compelled speech isn't acknowledgement.

  *Where the film bears this out:* Gómez never confesses. Even when trapped, his silence is his power. Because the state refused to punish him early on, he retained the power to define the reality of the crime. By the time Espósito catches up with him decades later, the state has moved on. The "hostage" situation is clear: the victim (Morales) needs the truth to close the wound, but the only person who can validate that truth holds it hostage.

  *Where the reading might distort:* You need to be careful with the timeline. The impunity in the film isn't initially the result of a transitional amnesty deal. It's the result of corruption and incompetence during a democratic period, followed by the dictatorship, followed by a new democracy. The "veto" wasn't granted by a truth commission; it was seized by a broken system. If you present this as a critique of *amnesty deals* specifically, students might miss the point that the state failed *before* the transition even happened. The film argues that impunity is a culture, not just a law.

  *Settled vs. Contested:* The idea that amnesty trades punishment for truth is the standard justification (the "South African model"). However, your claim that this creates a "veto" is a critical critique of that model. Many proponents argue that amnesty *forces* acknowledgement that would otherwise never come. Your position—that compelled acknowledgement is worthless—is a philosophical stance shared by some retributivists, but it is not the consensus view of transitional justice practitioners, who often value the public record over the perpetrator's internal state. Be honest with the class: this is a normative argument about the value of confession, not a description of how commissions operate.

  **The Captured Addressee**

  This is the third wrinkle you mentioned: the state employs the killer. This is crucial and often overlooked. It's not just that the state is absent; it's that the state is complicit. Gómez isn't just hiding; he is protected by the very institutions meant to investigate him. This dramatizes the continuity of security apparatuses across regime changes. In your seminar terms, this complicates the "before and after" of transition. If the executioner becomes the civil servant, the "addressee" of the victim's claim is the same person wearing a different uniform. This isn't just a veto; it's a mockery of the claim.

  **The Ending: Private Justice as Inversion**

  You ask if Morales keeping Gómez in isolation is a cure or a disease. I would argue the film presents it as a disease that looks like a cure.

  It is indeed an inversion of a truth commission. A commission says: "Speak, and you may go free (or be punished less)." Morales says: "Stay silent, and you stay in this room forever." It withdraws address entirely.

  *Is this the film's answer?* It reads more as a warning. Morales achieves a kind of peace, but it is a dead peace. He has become the jailer, the state, and the executioner all in one. He has privatized the monopoly on violence. If you present this as a "solution" to the acknowledgement hostage problem, you risk romanticizing vigilantism. The film's tone suggests tragedy, not triumph. Espósito writes the novel finally, but the ending of the novel (Morales' choice) is left ambiguous in the text, while the film shows us the reality: a life wasted guarding a monster.

  *Does it prove your first distinction?* Yes, formally. Because the "residue" (the look, the love, the grief) could not be processed by the state, it had to be processed privately. But the cost was the humanity of the victim. The film argues that when the state leaves the residue undischarged, the victim discharges it themselves, often at terrible cost.

  **Comparative Models: Would SA or Rwanda Fix This?**

  Your hunch is correct: it partly dissolves, partly doesn't.

  *South Africa (Disclosure-Conditional Amnesty):* This would have forced Gómez to speak to get immunity. It solves the "truth" problem but not the "acknowledgement" problem. If Gómez lies, or if he speaks without remorse (which happened in some real hearings), the victim gets the proposition but not the moral repair. The "veto" on *moral* acknowledgement remains, even if the veto on *factual* disclosure is lifted. Also, Gómez's crime is personal (sexual obsession/jealousy), not strictly political. A TRC might have rejected it as not politically motivated, leaving him to the ordinary courts—which is exactly where the system failed in the film.

  *Rwanda (Gacaca/Community Justice):* This might work better on the "residue." Gacaca relies on community knowledge and narrative, not just forensic propositions. The "look" at the race track might carry more weight in a community hearing where context matters. However, Gacaca relies on social pressure. Gómez is a sociopath; he is insulated from social norms. Community justice works on neighbors, not monsters.

  *The Distortion:* The biggest distortion in applying TJ models here is the nature of the crime. Transitional justice is designed for systemic, political violence. This is a common crime enabled by a weak state. If you let students treat this as a pure allegory for political atrocity, they might miss that the film is also a critique of ordinary judicial failure. The tragedy is that a mundane murder was allowed to fester into a political symbol because the state was too weak to stop it.

  **What a Skeptical Student Would Say**

  A good student pushing back might say: "You're treating Gómez like a political actor. He's just a psychopath. Transitional justice mechanisms aren't designed for serial killers or crimes of passion. Blaming the 'transition' for Morales' suffering ignores that the initial failure was basic police work, not amnesty laws."

  They would also challenge the "veto" concept: "If the state had punished him early on, Morales wouldn't need acknowledgement from Gómez. The need for acknowledgement is a symptom of the lack of punishment, not a separate good that amnesty stole."

  This is a strong objection. It suggests your "acknowledgement hostage" theory might be secondary to the primary failure of retribution. The film supports this: Morales only seeks the private prison *after* decades of state inaction. If the state had acted in 1975, the "hostage" situation never arises.

  **What the Film Adds**

  Finally, what does this give you that the papers don't? The papers discuss mechanisms, laws, and outcomes. The film gives you the *duration* of injustice. Transitional justice is often studied as an event (a commission, a trial). The film shows it as a lifespan. It shows what it does to a person to carry the "unsayable residue" for thirty years. It dramatizes the exhaustion of the investigator and the calcification of the victim.

  It also complicates the "truth" concept. In your readings, truth is usually a goal. In the film, truth is a burden. Espósito finds the truth, and it doesn't save anyone. It just allows Morales to make his choice. The film suggests that in the absence of a functioning state, truth without power is just another form of suffering.

  **Summary for the Lecture**

  1.  **Validate the Friend, then Pivot:** Yes, it's about narrative failure, but that failure *causes* the justice failure.
  2.  **Calibrate the Concepts:**
      *   *Residue:* Settled that law struggles with this; contested whether it should try to fix it.
      *   *Hostage:* Contested. Some argue amnesty buys truth; you argue it sells out acknowledgement.
  3.  **Correct the Timeline:** The impunity starts *before* the transition. Don't let them blame the amnesty laws for the initial botched investigation.
  4.  **The Ending:** It's a warning, not a model. Private justice replicates the state's silence.
  5.  **The Crime:** Remind them this is a common crime, not a political one. TJ models fit imperfectly.
  6.  **The Takeaway:** The film shows the human cost of the gap between "what we know" (residue) and "what we can prove" (propositions).

  This approach lets you use the film as a theoretical object without forcing it to be a case study it isn't. It respects the genre while extracting the political philosophy you need.
