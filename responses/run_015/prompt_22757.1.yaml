      *   **Conclusion:** Therefore, the offensive force must be *pragmatic* (context-dependent), not semantic. Semantic accounts seem mistaken.
      *   **Question:** Is this right? If not, what's the job for semantic theorizing? Why isn't the classroom case decisive evidence against semantic accounts?

