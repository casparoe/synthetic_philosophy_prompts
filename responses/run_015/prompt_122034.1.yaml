prompt: |-
  I'm putting together a proposal for a four-month graduate seminar project in philosophy of history (target length about 8,000 words). The course has focused heavily on the familiar moral version of presentism—whether historians ought to judge past societies by present ethical norms—but in a recent discussion with classmates I became convinced that a parallel and less examined problem lies in what I am tentatively calling "ontological framing presentism." The core worry is not about blame or praise, but about explanatory architecture: historians routinely partition past societies using modern ontological categories—"the economy," "religion," "politics," "the private sphere"—treating these as if they were stable natural kinds that past actors themselves recognized and navigated. If one tries to avoid this by adopting only the conceptual vocabulary internal to the period, causal explanation seems to collapse into pure description; yet retaining modern frames appears to build presentist assumptions into the very structure of historical explanation. I want to turn this half-formed intuition into a tractable research question.

  Please write the proposal. It should include: a sharply formulated central question that has a determinate answer (not just a survey of opinions); an explanation of why the dominant moral-presentism literature does not settle this ontological framing issue and what gap remains; the actual method—what kinds of case studies or conceptual distinctions you would work through month by month across the four months, and why this approach rather than, say, a broad historiographical literature review or an empirical survey of practicing historians; a clear statement of what a successful result would look like (for example, a defended middle position, a demonstrated impossibility result, or a precise taxonomy of framing dependencies) and what specific outcome would cause you to conclude the project has failed; and an honest scope assessment addressing whether four months is enough and where the project risks becoming unmanageable. Do not provide a bibliography, citation list, or specific reading list—refer to debates and positions generally, and indicate that citations will be inserted later.

  After the proposal text, please provide a brief structured summary in JSON with exactly these fields: "core_question", "gap_left_by_moral_presentism", "month_by_month_method", "success_and_failure_criteria", "scope_assessment_and_risks".
