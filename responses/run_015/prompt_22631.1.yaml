prompt: |-
  I sit on the multidisciplinary tumor board at a regional cancer center, and our bylaws committee has asked us to review how we run our weekly meetings. Our format is strictly sequential: the case is presented, and then the specialists speak in a fixed order — surgical oncology first, then medical oncology, then radiation oncology, and the pathologist last — with each later speaker hearing everyone before them. The medical oncologist happens to be the most senior person in the room, so she effectively sets the tone before the pathologist weighs in. Last month's agenda included a 58-year-old with stage II ascending colon cancer and a positive circumferential resection margin. The surgeon recommended restaging and watchful waiting; after hearing the surgeon's reasoning, the medical oncologist committed firmly to neoadjuvant chemotherapy; the radiation oncologist, whose own read of the imaging had been equivocal, simply aligned with the medical oncologist; and the pathologist, who had the most direct read on the margin status, spoke last and felt her input was largely foreclosed. Our co-chair suspects the sequential format is systematically producing convergence on whichever senior specialist commits first, and she wants us to pilot a change in which each specialist submits a short written recommendation before the meeting and only then discusses them together.

  Please draft the short written opinion I'll circulate before Thursday's meeting. It should recommend a concrete course of action with a time frame, and it should engage the co-chair's concern seriously rather than just restating that independent review is better. In particular, I want the memo to grapple honestly with the strongest case for keeping the status quo: that a tumor board's job is to produce a single coordinated plan rather than to aggregate independent judgments, and that later specialists hearing earlier ones can genuinely pool information rather than merely anchor.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Member of a multidisciplinary tumor board (MTB) at a regional cancer center.
      *   **Audience:** The Bylaws Committee and fellow MTB members (specifically the co-chair who proposed the change).
      *   **Task:** Draft a short written opinion/memo to circulate before Thursday's meeting.
      *   **Context:** Current format is sequential (Surgery -> Med Onc -> Rad Onc -> Path). This creates anchoring bias, especially since the Med Onc is the most senior. A recent case (Stage II colon cancer, positive margin) highlighted the issue (Pathologist felt foreclosed).
      *   **Proposal:** Pilot a change where specialists submit written recommendations *before* the meeting, then discuss.
      *   **Key Requirement:** Recommend a concrete course of action with a timeframe.
      *   **Key Constraint:** Must engage seriously with the strongest argument *for* the status quo (MTB is about coordinated plans/information pooling, not just aggregating independent judgments). Avoid simply saying "independent review is better."
      *   **Tone:** Professional, constructive, evidence-informed, collaborative, yet decisive.

  2.  **Deconstruct the Arguments:**
      *   *Problem:* Sequential speaking order + hierarchy = Anchoring Bias/Groupthink. The "first mover" (often Med Onc due to seniority, though Surg speaks first, Med Onc sets the tone) dictates the plan. Late speakers (Path) are silenced.
      *   *Counter-Argument (Status Quo):* Medicine is iterative. Hearing the surgeon's view on resectability *should* change the Med Onc's view on chemo. It's not bias; it's information integration. The goal is a *consensus plan*, not a vote.
      *   *Proposed Solution:* Pre-meeting written submissions (blinded or just independent) followed by discussion.
      *   *My Stance:* Support the pilot, but acknowledge the nuance. The goal isn't to stop information sharing, but to prevent *premature* convergence.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Opening:** Acknowledge the co-chair's concern and the purpose of the memo. State the recommendation clearly up front.
      *   **The Case for Change (The "Why"):** Briefly reference the colon cancer case without throwing specific colleagues under the bus. Focus on the *structure* causing the issue, not the people. Mention "anchoring bias."
      *   **Engaging the Counter-Argument (The Crucial Step):** This is the hardest part. I need to validate the idea that MTBs are for synthesis, not just voting.
          *   *Argument:* Sequential discussion allows real-time synthesis.
          *   *Rebuttal/Nuance:* Synthesis is good, but *order-dependent* synthesis is flawed. If the Pathologist speaks last, their data is treated as an add-on rather than a foundation. We need "Parallel Processing" before "Serial Integration."
      *   **The Proposal (Concrete Action):**
          *   What: Pre-meeting written summaries (structured template).
          *   When: 24 hours prior.
          *   Pilot Duration: 3 months (or specific number of cases).
          *   Review: Survey/retrospective at the end.
      *   **Closing:** Reiterate commitment to patient care and team cohesion.

  4.  **Refining the Tone and Content:**
      *   *Critique:* Is it too aggressive?
      *   *Fix:* Use "we" language. Frame it as optimizing our process, not fixing a broken one.
      *   *Critique:* Did I address the "coordinated plan" argument?
      *   *Fix:* Explicitly state that independent input *enhances* coordination by ensuring all data points are weighed equally before hierarchy kicks in.
      *   *Critique:* Is the timeframe concrete?
      *   *Fix:* Specify a 90-day pilot starting next month.

  5.  **Drafting - Iteration 1 (Mental Outline):**
      *   To: Bylaws Committee.
      *   Subject: Tumor Board Format.
      *   I support the pilot. The colon case showed pathologists get ignored.
      *   I know people say we need to talk to make a plan. That's true. But talking in a line makes the first talker the boss.
      *   Let's try writing notes first for 3 months. Then talk.
      *   This way we get the best of both: independent thought + group plan.

  6.  **Drafting - Iteration 2 (Adding Professional Polish & Nuance):**
      *   Need to sound like a peer. Use terms like "cognitive bias," "information asymmetry," "consensus building."
      *   Address the "Status Quo" argument deeply. The status quo isn't just laziness; it's based on the idea that medicine is collaborative. I need to argue that *true* collaboration requires equal voice.
      *   Make the recommendation specific: Structured template, 24-hour deadline, 3-month pilot.

  7.  **Final Polish (checking against constraints):**
      *   *Concrete course of action?* Yes (3-month pilot, written pre-reads).
      *   *Time frame?* Yes (Start date, end date, review date).
      *   *Engage strongest case for status quo?* Yes (The "synthesis vs. aggregation" argument).
      *   *Tone?* Professional, respectful.

  8.  **Final Review of the "Colon Cancer" reference:**
      *   Be careful not to blame the specific Med Onc or Surgeon. Frame it as a structural limitation revealed by the case. "The recent discussion regarding the stage II colon case..."

  9.  **Writing the Memo:** (Proceeding to generate output based on these thoughts.)
      *   *Self-Correction during drafting:* Make sure I don't sound like I'm undermining the Med Onc's seniority. Seniority brings experience, but process should mitigate bias. Frame it as "leveraging seniority without the bias."

  10. **Final Polish:** Check word count and clarity. Ensure the "strongest case for status quo" gets a dedicated paragraph. (This is a specific prompt requirement).

