  **[SCENE START]**

  **[Visual: Sunlit kitchen. Soft focus. A woman, MARTHA (50s), touches a hot skillet. She watches her hand withdraw smoothly, like a machine. She smiles.]**

  **VOICEOVER:** Pain is supposed to protect you. But why does it have to hurt so much?

  **[Visual: Martha gardening. She steps on a rake. She looks down, nods, and continues gardening.]**

  **VOICEOVER:** Introducing Velura™. Velura separates the signal from the suffering. With Velura, the sensory dimension of pain remains completely intact. You can still localize the injury. You can still describe it as stabbing, burning, or throbbing. You can still rate it a seven out of ten.

  **[Visual: Martha in a doctor's office. She points to her lower back.]**

  **MARTHA (Testimonial):** "I told my doctor exactly where it hurt. I told him it was sharp. I just didn't feel like I needed to leave the room. Velura let me keep the data without the distress."

  **VOICEOVER:** Velura strips away the unpleasantness. The urge to get away? Gone. The emotional weight? Removed. You experience pain as pure information.

  **[Visual: Martha reaches for a boiling pot. She pauses mid-reach. A graphic overlay highlights her motor cortex.]**

  **VOICEOVER:** But information is useless without action. If you don't mind the heat, why move your hand? That's why Velura works best with the ReflexGuard™ Protective Instinct Add-On.

  **[Visual: Martha's hand withdraws from the pot instantly, yet her face remains serene.]**

  **VOICEOVER:** ReflexGuard restores avoidance behavior without restoring the felt urgency. It ensures you pull away from danger while maintaining your emotional equilibrium. Some say ReflexGuard is the whole point. We say it's just ensuring nothing of value was lost. You keep the survival instinct. You lose the survival anxiety.

  **[Visual: Martha playing with grandchildren. She trips, falls, gets up, dusts herself off. No wincing.]**

  **VOICEOVER:** Velura. Feel the signal. Lose the noise.

  **[Fast-Talk Side Effects]**
  **VOICEOVER (Rapidly):** Velura may cause dissociative episodes, delayed withdrawal reflexes, second-degree burns due to curiosity, and existential flattening. Do not operate heavy machinery if you understand the machinery is also made of atoms. ReflexGuard may cause involuntary jerking, phantom limb movements, and the sensation that your body is a vehicle you are piloting rather than inhabiting.

  **[Important Safety Information]**
  **VOICEOVER (Normal speed):** Tell your doctor if you have a history of self-harm or philosophical inquiry. Velura is not for everyone. If you experience a lack of motivation to preserve your own biological integrity, stop taking Velura and call your doctor. If you experience a lack of motivation to call your doctor, have someone call for you. In clinical trials, 14% of users reported that nothing seems to matter much anymore. This is not classified as a side effect.

  **[Visual: Velura logo. Copay savings card appears.]**

  **VOICEOVER:** Ask your doctor if Velura and ReflexGuard are right for you. Because pain is important. But you don't have to be.

