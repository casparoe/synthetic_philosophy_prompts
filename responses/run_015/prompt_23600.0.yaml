      *   *Character B (Reasoning):* Let's call him **Marcus**. He values autonomy as *rational agency*. He thinks emotions, cognitive biases, and structural pressures can override reason even if you know they're there. He might lean towards a more protective/paternalistic (but nuanced) perspective.

  3.  **Drafting - Section by Section:**

