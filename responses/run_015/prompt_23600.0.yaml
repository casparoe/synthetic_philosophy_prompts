      *   *Check:* Did I include the "upfront con"? Yes, the "honest manipulator" example.
      *   *Check:* Did I include the "hidden argument"? Yes, the "osmosis of reason" example.

  5.  **Polishing the Dialogue:**
      *   Ensure distinct voices. Elena is crisp, legalistic, focused on boundaries. Marcus is psychological, focused on mechanisms.
      *   Cut the fluff. Make sure every paragraph advances the argument.
      *   Check the ending. It shouldn't be a neat bow, but a thoughtful pause.

  6.  **Final Review against constraints:**
