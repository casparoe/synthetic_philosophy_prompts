answer: |-
  The Casting Die sat in the centre of Mira's desk, a matte-black dodecahedron humming with a low, thermal vibration. It didn't look like much—just a heavy paperweight with internal gyroscopes—but according to the Division's doctrine, it was the only moral way to resolve a true tie.

  Mira packed a framed photo of her cat into a cardboard box. Her last day. She had three files left.

  "Still buying into the Bundling Rule?" Elias asked, leaning against her cubicle wall. He held a coffee mug that said *Equilibrium is Stability*.

  "It's not about buying in, Elias. It's about clearing the queue."

  "You sound like Section Head." Elias took a sip. "I saw the Henderson file. They stalled for six weeks after the certification. Then you added the deferred intake option—the decoy—and they signed within the hour."

  Mira didn't look up from her box. "They couldn't choose between A and B. But when you gave them A, B, and C—where C was objectively worse—they picked A instantly."

  "Proof of deficit," Elias said, tapping his mug. "The petitioners lack the cognitive architecture to grasp the Bundle. They think choosing A is different from choosing B. They don't understand that if the value is identical, the options are ontologically the same object. {A, B} is one thing. Picking either member is just accessing the bundle. The Die doesn't choose for them; it just punctuates the sentence."

  "Or," Mira said, sliding a stack of folders into the box, "the Bundle is a fiction. Maybe they couldn't choose because there *was* no choice to make. Adding C broke the symmetry. It gave them a vector. It made them agents again."

  "That's heresy. If adding C changes the value structure, then A and B weren't truly identical to begin with. You're saying our certification process is flawed."

  "I'm saying people aren't geometry."

  Elias pushed off the wall. "Enjoy your retirement. Don't let the Die spin too long on the last one. It hates lingering."

  He walked away. Mira opened the final file. *Grant Allocation: Astrophysics Division. Slot 04.*

  Applicant 1: J. Vane.
  Applicant 2: K. Vane.

  Siblings. Identical scores. Identical publication histories. Even the referee reports used the same phrasing, likely copied from a departmental template. The system had flagged it as a Certified Exact Tie. Under the Bundling Rule, giving the grant to J was the same act as giving it to K. The moral weight was zero. The Die would land on 1 or 2, a file would be stamped, and the universe would remain unchanged.

  Mira scrolled through the metadata. She wasn't supposed to. Once certified, the file was sealed until the Cast. But she was leaving.

  She found it in the submission logs. J. Vane's application had been uploaded at 23:59:58. K. Vane's at 23:59:59.

  Two seconds.

  If the tie was real, those two seconds were noise. Irrelevant. To flag them would be to manufacture a difference where none mattered, forcing a human reason onto a random universe. It would be a lie to say J deserved it more because of latency.

  But if the tie wasn't real... if those two seconds indicated a difference in resolve, or bandwidth, or simply the chaotic reality of human action... then treating them as a Bundle was the lie. It was erasing the only thing that distinguished them.

  If she flagged the timestamp, the tie would break. The Die would be unnecessary. She would be handing the decision back to the statute, respecting the applicants as distinct entities who succeeded or failed on particulars. But she would also be elevating a triviality into a destiny.

  If she ignored it, she upheld the Rule. She acknowledged that some things are equal, and that forcing a reason where there is none is madness. But she also surrendered the siblings to the hum of the black box on her desk.

  Mira looked at the Die. It seemed to pulse, waiting for the command to spin.

  She thought about the Hendersons. They hadn't been broken by the tie; they had been paralyzed by the lack of a vector. They needed the decoy to feel like they were moving. But here, there was no decoy. There was only the Rule.

  Was respecting them as agents giving them a reason they didn't earn? Or was it refusing to lie to them about the randomness of their lives?

  Mira's finger hovered over the *Flag Asymmetry* key. It was a small click. It would override the certification. It would make her the decider, not the machine.

  She looked at the timestamp again. 23:59:58. 23:59:59.

  It was nothing. It was everything.

  She pulled her hand back.

  Mira typed the command code for the Cast. The Die woke up, the hum rising in pitch. She didn't watch it spin. She turned back to her box, placing her stapler inside, then her pen cup.

  A soft *clack* sounded behind her. The machine had settled.

  She didn't turn around to see which number faced up. It didn't matter. That was the point. Or maybe it mattered immensely, and the Rule was just a way for the Division to sleep at night.

  Mira picked up the box. She walked to the door, stepping over the power cable of the Die without looking down. The hallway was bright, fluorescent, and ordinary. She didn't feel relieved, and she didn't feel guilty. She just felt like she was leaving work.

  Behind her, the Die stopped humming, waiting for the next caseworker to sit down and pretend that nothing had happened.
