answer: |-
  1. Genocide is the specific intent to destroy a distinct group's existence, whether through physical elimination or the irreversible erasure of the conditions that sustain its collective life. This allows a colleague to test for intent and group stability rather than relying solely on body counts or legal treaties.

  2. This principle secures your verdicts on residential schools and the Ukrainian famine, but it highlights your inconsistency on Indonesia, forcing you to either align it with your Khmer Rouge verdict or narrow your definition of a protected group.

  3. The slave trade remains ambiguous because while the primary aim was labour extraction, the systematic sundering of kinship functioned as a destructive force on the group's continuity, warranting classification only if you prioritize cultural erasure over explicit exterminatory intent.

  4. Both cases qualify under this principle because the crime lies in the intent to end the group's existence, meaning a failed physical extermination and a successful cultural erasure are equally genocidal regardless of the death toll.

  5. The politics of naming must remain a separate judgment you layer on top of the definition, because embedding political consequences into the principle itself guarantees the inconsistency you fear when your own country's allies are the perpetrators.
