  I bought the Best Life package to feel like a successful architect. The feelings are great, don't get me wrong. But I logged out early to grab a water bottle and looked at my bank account. I'm not an architect. I'm still waiting tables. The tank gives you the feeling of accomplishment without the accomplishment, which leaves you unable to function outside. You feel like you've run a marathon while lying in a tub. It breaks your ability to do anything actual. Disruptive indeed.
