  He will call this programme degenerating. Two candidate rules explain his past classifications: the Aggregate Success Rule, which defines progress by the total balance of confirmed predictions and internal coherence, and the Novel Prediction Rule, which defines progress strictly by the anticipation of novel facts alongside internal coherence. The Aggregate Success Rule predicts he will label this programme progressive because it leads on confirmed predictions and coherence, whereas the Novel Prediction Rule predicts he will label it degenerating because it lacks novel predictive success while its rival possesses it. My best guess is that he will follow the Novel Prediction Rule because a strict Lakatosian defines a progressive problemshift specifically by excess empirical content—new facts predicted and corroborated—rather than by the elegant accommodation of existing data, meaning his past citations of being "ahead on balance" were consequences of novelty rather than the primary criterion. The single further case that would best tell these rules apart is a scenario where one programme explains all known data perfectly with high coherence but predicts nothing new, while its rival explains less old data but successfully predicts a previously unobserved phenomenon.
