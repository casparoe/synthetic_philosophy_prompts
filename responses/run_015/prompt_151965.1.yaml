answer: |-
  ### The Boundary Problem and the Brexit Franchise: A Synchronic-Diachronic Analysis

  The 2016 United Kingdom referendum on European Union membership offers a stark institutional test for the democratic boundary problem. By applying your specified distinction—**synchronic membership** (present subjection to coercive authority) versus **diachronic membership** (fundamental life prospects shaped across the decision's temporal horizon)—we can dissect the franchise rules not merely as political compromises, but as theoretical claims about who constitutes the *demos*.

  This analysis proceeds in three parts: first, mapping the synchronic principle onto the resident/non-citizen exclusion; second, mapping the diachronic principle onto the expatriate and future-generation exclusion; and third, evaluating what the friction between these mappings reveals about the justification of binding authority.

  ---

  ### 1. The Synchronic Principle: Subjection and the Exclusion of EU Nationals

  **The Principle:** Synchronic membership grounds the right to vote in current subjection to the state's coercive apparatus. If an agent is bound by the laws and administrative power of the state *now*, they possess a claim to participate in the authority that generates those laws.

  **The Institutional Fact:** The franchise included British citizens and qualifying Commonwealth/Irish/Maltese/Cypriot citizens resident in the UK. It excluded other EU nationals resident in the UK, despite many having lived there for decades, paying taxes, and being subject to UK criminal and civil law.

  **Theoretical Mapping:**
  *   **Affected Party:** Long-settled EU nationals (non-Commonwealth).
  *   **Grounding Relation:** *De facto* subjection. These residents were subject to the UK's coercive authority (HMRC, police, courts) identical to citizens.
  *   **Theoretical Tension:** Under a strict synchronic "All-Subjected Principle" (ASP), excluding these residents is illegitimate. The referendum determined the legal regime under which they lived. By removing the UK from the EU legal order, the vote altered the source of their rights (from EU citizenship to UK immigration discretion).
  *   **Where the Theory Illuminates:** The synchronic lens exposes the franchise as a *citizenship* model rather than a *subjection* model. The UK state implicitly argued that subjection is mediated by membership status. The inclusion of Commonwealth and Irish citizens highlights this: they were included not because of unique subjection, but because of reciprocal historical treaties. This suggests the synchronic boundary was not drawn by coercion, but by a prior political decision about who counts as a "member" of the political community.
  *   **Where the Theory Strains:** The synchronic principle struggles to explain why the *content* of the vote matters. If the vote were purely advisory, subjection might not trigger a vote. However, because the government treated the result as binding (via the prerogative power to trigger Article 50), the subjection became immediate. The theory illuminates a deficit: the state claimed the authority to coerce EU nationals based on the outcome of a vote in which those same nationals had no voice. This violates the synchronic requirement that coercion be authorized by the coerced.

  **Verdict:** The synchronic principle does **not** justify excluding long-settled EU residents. Their exclusion reveals that the institutional design prioritized *national citizenship* over *territorial subjection*. The theory identifies this as a legitimacy gap: a group fully subject to the state's coercive power was denied agency over a decision that cemented that subjection.

  ---

  ### 2. The Diachronic Principle: Affectedness and the Exclusion of Future Cohorts and Expatriates

  **The Principle:** Diachronic membership grounds the right to vote (or be represented) in the durability of the decision's impact. If a decision reshapes the fundamental life prospects of agents across a significant temporal horizon, those agents have a claim to inclusion.

  **The Institutional Fact:** The franchise excluded British citizens resident abroad for more than 15 years and all persons under 18 at the time of the vote.

  **Theoretical Mapping:**
  *   **Affected Party A (Expatriates >15 years):** British citizens living overseas, many retired.
      *   **Grounding Relation:** *Prospective vulnerability.* Their access to UK healthcare (S1 forms), pension uprating, and right of return were contingent on EU agreements.
      *   **Analysis:** The 15-year rule assumes that after a decade and a half, a citizen's interests diverge from the domestic polity. The diachronic principle challenges this. Brexit was a structural change affecting the *portability* of rights. A retiree in Spain was more diachronically affected by the loss of EU healthcare reciprocity than a young voter in London.
      *   **Theoretical Limit:** The diachronic principle risks over-inclusion. If "affectedness" is the metric, does every British expat globally count? The theory forces us to distinguish between *general affectedness* (everyone trades with the UK) and *constitutive affectedness* (rights frameworks are dismantled). The franchise rule arbitrarily drew this line at 15 years, a bureaucratic metric with no theoretical basis in affectedness.

  *   **Affected Party B (Future Generations / Under 18s):**
      *   **Grounding Relation:** *Temporal subjection.* The decision creates a constitutional reality they will inhabit for 50+ years.
      *   **Analysis:** This is the strongest test of the diachronic principle. The referendum locked in a trajectory that disproportionately burdens younger cohorts (labor market restrictions, mobility limits).
      *   **Where the Theory Falls Silent:** Democratic theory lacks a mechanism for "future voters." We cannot enfranchise the unborn. The diachronic principle suggests the *current* demos acts as a trustee for the future. However, the Brexit referendum utilized a simple majority threshold (50% + 1) with no supermajority requirement for constitutional change.
      *   **Implausible Result:** If we strictly follow the diachronic principle, the *demos* for a constitutional change of this magnitude should arguably include a guardianship mechanism for minors or a higher threshold to ensure the "future" is protected against the "present." The institutional design ignored this, treating the 2016 electorate as the sole proprietor of the UK's constitutional future.

  **Verdict:** The diachronic principle **requires** including expatriates with vested rights and demands a higher justificatory burden regarding future generations. The institutional design fails this test. It treated a diachronic constitutional shift as a synchronic policy preference.

  ---

  ### 3. Synthesis: Locating Boundaries vs. Justifying Binding Authority

  The friction between the synchronic and diachronic mappings in the Brexit referendum reveals the core difficulty of the boundary problem. It is not merely a technical challenge of **locating** the boundary (e.g., "draw the line at residency" vs. "draw the line at citizenship"). Rather, the case suggests the core difficulty is **justifying the binding authority of a synchronic demos over a diachronic population.**

  **1. The Problem of the "Constitutional Moment"**
  Democratic theory typically assumes a continuity of the *demos*. Elections occur every few years, allowing the synchronic demos to update. A referendum of this magnitude breaks that continuity. It allows the *synchronic* voters (2016) to bind the *diachronic* population (2020–2070).
  *   **Theoretical Insight:** The boundary problem is usually framed as "Who votes?" In this case, the deeper question is "For how long does their vote count?" The UK institutional design assumed the answer was "indefinitely." The theory suggests this is illegitimate without mechanisms for diachronic consent (e.g., ratification by a subsequent parliament, a supermajority, or a sunset clause).

  **2. The Asymmetry of Exit**
  The synchronic principle works well for entry (who is here and subject to law?). It fails on exit (who leaves the legal order?).
  *   **EU Nationals:** Synchronic subjection remained (they were still in the UK), but their political protection (EU citizenship) was removed by a vote they couldn't cast.
  *   **UK Expats:** Synchronic subjection ended (they left the territory), but diachronic affectedness remained (their rights were tied to the UK's status).
  *   **Revelation:** The boundary problem is not static. It is dynamic. The Brexit case shows that when the boundary of the *state itself* is the subject of the vote, the standard criteria for membership (citizenship/residency) become circular. You need to be a member to vote on whether to stay in the larger union, but the vote determines what membership means.

  **3. Justifying Binding Authority**
  The case reveals that the "Boundary Problem" is actually a "Authority Problem."
  *   **Synchronic Legitimacy:** The vote had high synchronic legitimacy for those included (high turnout, clear binary choice).
  *   **Diachronic Legitimacy:** The vote had low diachronic legitimacy. It bound future residents, future citizens, and excluded residents without their consent.
  *   **Conclusion:** The theory illuminates that democratic legitimacy requires *both* dimensions. A decision that satisfies synchronic subjection (citizens voted) but violates diachronic affectedness (binding the future/excluding residents) creates a "legitimacy debt." This debt manifests politically as polarization and demands for a second vote ("People's Vote"), which are essentially demands to re-align the synchronic *demos* with the diachronic reality.

  ### Final Assessment

  In the 2016 referendum, the UK state operationalized a **Citizenship-Plus-Residency** model that privileged historical ties (Commonwealth) and current territorial presence (UK residents) over both strict subjection (excluding EU nationals) and strict affectedness (excluding long-term expats and youth).

  *   **Synchronic Principle:** Illuminates the injustice to EU nationals. They were subjects without representation.
  *   **Diachronic Principle:** Illuminates the injustice to future generations and expats. They were affected without agency.
  *   **The Limit of Theory:** Political theory can identify these exclusions as normative deficits. However, it falls silent on how to resolve them institutionally *ex post*. There is no clear theoretical mechanism to "un-bind" a decision once made, nor a clear way to enfranchise the future.

  **Conclusion on the Boundary Problem:**
  The Brexit case suggests the core difficulty is not locating the boundary, but **temporalizing the authority of the boundary.** The fundamental tension is that a *synchronic* institution (the electorate on voting day) was asked to make a *diachronic* decision (constitutional withdrawal). The boundary problem, therefore, is not just about who is inside the circle, but about whether the people inside the circle today have the moral right to draw the circle for those who will stand inside it tomorrow. The Brexit franchise assumed they did; the synchronic-diachronic analysis suggests they did not.
