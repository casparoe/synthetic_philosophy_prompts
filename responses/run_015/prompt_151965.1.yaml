              *   *Expats (>15 years):* Many retired abroad. Their pensions, healthcare (S1 forms), and right to return were at stake. Diachronic affectedness is high.
              *   *EU Residents:* Their right to remain was the core issue. A diachronic view sees them as deeply affected.
          *   *Theoretical Friction:* The AAP (All-Affected) becomes infinite if taken literally (everyone in the world is affected). The diachronic frame limits this to "fundamental life prospects," but still creates an impossibly large demos.

      *   **Section 3: Institutional Design & Theoretical Limits:**
