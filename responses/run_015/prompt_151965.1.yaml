          *   *Theoretical Friction:* The ASP struggles here. If the vote determines the law they are subject to, they should vote. But if they aren't citizens, the state claims no obligation. This highlights that "subjection" is often mediated by "citizenship."

      *   **Section 2: The Diachronic Principle (Affectedness & Time):**
          *   *Definition:* Those whose life prospects are shaped by the decision's longevity.
