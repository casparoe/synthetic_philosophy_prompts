answer: |-
  This is a sharp observation. The philosophical debate about pain asymbolia (sensation without suffering) vs. typical chronic pain (sensation *plus* suffering) is actually a massive clinical lever. In a 15-minute slot, you don't have time to solve the mind-body problem, but you do have time to separate **Nociception** (the signal) from **Suffering** (the reaction) from **Risk** (the safety).

  Most intake forms conflate these. They ask "Rate your pain," and if you treat that number as the only truth, you end up chasing a metric that doesn't always correlate with patient well-being or safety.

  Here is a practical workflow based on that distinction, designed for your constraints (15 mins, attending oversight).

  ### The Sensation-Suffering Split Protocol (SSSP)

  **Goal:** Determine if the treatment target is the *signal*, the *reaction*, or the *safety*.
  **Time:** 3–5 minutes of the interview.
  **Documentation:** Copy/paste the bolded headers into your note.

  #### Step 1: The Dissociation Check (Sensation vs. Bother)
  *Philosophy:* Pain asymbolia shows sensation and suffering can be uncoupled. Chronic pain often couples them tightly. We need to know which one is driving the visit.
  *   **Ask:** "On a scale of 0–10, how strong is the sensation?"
  *   **Ask:** "On a scale of 0–10, how much does that sensation **bother** you or make you unhappy?"
  *   **Ask:** "If you could press a button to make the sensation go away but you'd lose feeling in that limb, would you?"

  **Decision Node:**
  *   **High Sensation / Low Bother:** (Like your stroke patient). The signal is loud, the suffering is quiet. **Do not escalate opioids.** Focus on safety/function.
  *   **High Sensation / High Bother:** Standard chronic pain. Proceed to Step 2.
  *   **Low Sensation / High Bother:** (Like CRPS or central sensitization). The system is amplifying threat. Proceed to Step 2, but flag for multimodal/psych support.

  #### Step 2: The Functional Cost (The "Why Treat?" Check)
  *Philosophy:* Pain is "bad" instrumentally if it stops you from doing things you value. If it doesn't stop you, the medical necessity for high-risk intervention drops.
  *   **Ask:** "What specifically did you do yesterday that you *couldn't* do because of the pain?" (Be specific: walk to mailbox, sleep 4 hours, cook dinner).
  *   **Check:** Does this match their goal? (e.g., Goal: "Walk dog." Reality: "Sat on couch.")

  **Decision Node:**
  *   **Clear Functional Deficit:** Medical necessity for intervention is established.
  *   **Vague/No Functional Deficit:** (e.g., "I just want the number lower.") **Hold on escalation.** This is a values call, not a functional one.
  *   **Inconsistent:** Claims can't walk, but walked in from bus stop without aid. Flag for Step 3.

  #### Step 3: Behavioral Concordance (The Safety Check)
  *Philosophy:* If pain is a threat response, the body should act like it's under threat (guarding, withdrawal). If the behavior contradicts the report significantly, risk increases.
  *   **Observe:** Transferring from chair, facial expression when distracted vs. when focused on you.
  *   **Check:** Med count, refill timing, PDMP data.

  **Decision Node:**
  *   **Concordant:** Behavior matches report. Safe to plan treatment.
  *   **Discordant:** Report is 10/10, but laughing on phone, no guarding, or early refill request. **Stop.** This is now a Risk/Values call.

  #### The Escalation Threshold (When to Kick Upstairs)
  You need attending sign-off for opioids/psych. Use this checklist to decide if you present a *Plan* or a *Problem*.

  1.  **Present a Plan if:** Sensation/Bother match, Functional Deficit is clear, Concordance is good. (e.g., "Patient has high suffering, can't sleep, safe use history. Recommend dose adjustment.")
  2.  **Present a Problem if:**
      *   Sensation is high, but Bother is low (Asymbolia pattern).
      *   Bother is high, but Functional Deficit is absent (Existential/Values pattern).
      *   Concordance is low (Risk pattern).
      *   *Script for Attending:* "I'm flagging this as a Values/Risk call. The clinical picture doesn't support standard escalation, but patient is distressed. Need your guidance on risk tolerance."

  ---

  ### Where This Checklist Misfires (Honesty Check)
  1.  **Cultural/Generational Stoicism:** Some patients say "It doesn't bother me" because they were raised not to complain. They are suffering, but won't admit it. *Mitigation:* Look at sleep and mood, not just self-report.
  2.  **The "Good" Drug Seeker:** Some patients learn the script. They will give you perfect Functional Deficits and Concordant Behavior. This tool isn't a lie detector.
  3.  **Depression Masking:** Severe depression can look like "Low Bother" (anhedonia) or "High Bother" (catastrophizing). If mood is flat, Step 1 might fail.

  ---

  ### Running the Protocol on Your Three Patients

  #### Patient A: The Post-Stroke Man
  *   **Profile:** Older, post-stroke, shoulder pain 8/10 intensity, 2/10 bother. Tries to leave to smoke.
  *   **Step 1 (Dissociation):** Sensation 8, Bother 2. **Split detected.** He feels the signal, but the emotional "ouch" is dampened (likely central processing issue).
  *   **Step 2 (Function):** Wants to leave to smoke. Smoking worsens vascular health/stroke risk. Pain isn't stopping him from moving; he's moving to get nicotine.
  *   **Step 3 (Concordance):** High report, but trying to leave/active.
  *   **Protocol Output:** **Hold on Opioid Escalation.**
  *   **Reasoning:** Treating the sensation with opioids won't fix the vascular risk of smoking, and he admits low bother. High risk for low gain.
  *   **Action:** Document "Pain Asymbolia Pattern." Focus on vascular health/smoking cessation. Do not escalate opioids. If he demands it, kick to attending as a "Values Call" (Patient wants numbness, Clinic wants safety).

  #### Patient B: The Teen with CRPS
  *   **Profile:** Teen, Complex Regional Pain Syndrome. Distressed with light touch (allodynia), insomnia.
  *   **Step 1 (Dissociation):** Sensation 7/10 (light touch), Bother 10/10. **Inverse Split.** The signal is low (touch), the suffering is maxed.
  *   **Step 2 (Function):** Can't sleep, can't attend school. High functional cost.
  *   **Step 3 (Concordance):** Withdraws from touch, guarding, crying. Concordant.
  *   **Protocol Output:** **Escalate Multimodal, Hold on Opioid Monotherapy.**
  *   **Reasoning:** The suffering is real (Step 1), but it's driven by central sensitization (low stimulus, high reaction). Opioids often worsen CRPS hyperalgesia long-term.
  *   **Action:** This is a "Present a Plan" for *non-opioid* escalation (gabapentinoids, PT, psych referral for pain coping). If you feel opioids are needed for crisis, this triggers the **Attending Sign-off** immediately because it's a high-risk demographic + high-risk med. The tool validates the *suffering* so you don't dismiss them, but guides the *treatment* away from simple dose increases.

  #### Patient C: The Uncomfortable Case (Where the Tool Says "No")
  *   **Profile:** 55M, chronic back pain. 9/10 pain. 9/10 bother. Can't sleep. *However*, he is on high-dose benzos, has a history of falls, and is asking for a 20% opioid increase today because "nothing else works." PDMP shows he fills early often.
  *   **Step 1 (Dissociation):** Sensation 9, Bother 9. Coupled.
  *   **Step 2 (Function):** Can't sleep. Valid deficit.
  *   **Step 3 (Concordance):** **FAIL.** Report is severe, but PDMP and med history show high risk/behavioral discordance.
  *   **Protocol Output:** **STOP. Escalation Contraindicated.**
  *   **The Gut Check:** You look at him. He's shaking. He's desperate. He *is* suffering. Your gut says, "He's in crisis, just give him a bridge prescription to get through the weekend."
  *   **The Procedure Says:** **Do not escalate.** The Risk Check overrides the Suffering Check.
  *   **Why this hurts:** The protocol correctly identifies that adding opioids might kill him (falls/respiratory depression) or feed a use disorder, but it leaves his immediate suffering unaddressed. It forces you to be the "bad guy" for safety.
  *   **Action:** This is the definition of a **Values Call for the Attending.** You cannot solve this alone. You document the suffering (validating him) but flag the safety (protecting him). You kick it upstairs. "Patient is in genuine distress, but risk profile prohibits standard escalation. Need attending decision on risk tolerance vs. palliative relief."
  *   **Why this matters:** If you follow your gut and prescribe, and he overdoses, you are liable. If you follow the tool, he suffers tonight, but lives to see tomorrow. The tool protects *you* and *him* from the immediate fix that causes long-term harm.

  ---

  ### What This Procedure Cannot Do

  1.  **It Cannot Fix Systemic Gaps:** If the only treatment available is meds because you don't have PT or Pain Psych on referral, this tool will identify the need for psych (Patient B) but leave you with nowhere to send them. It highlights the gap; it doesn't fill it.
  2.  **It Cannot Remove Moral Distress:** In Patient C's case, you will still feel bad. The tool makes the ethical trade-off explicit (Safety vs. Relief), but it doesn't make the choice easy.
  3.  **It Cannot Detect Deception Perfectly:** A sophisticated patient can game the Functional Cost questions. This is a clinical heuristic, not a forensic audit.
  4.  **It Cannot Override the Attending:** Since you need sign-off, this tool is primarily for *structuring your recommendation*. If the attending has a high risk tolerance, they may override the "Stop" on Patient C. This tool ensures you documented *why* it was risky, protecting your license.

  **Bottom Line:** Use this to separate the *signal* from the *suffering*. If the suffering is low, don't chase the signal with high-risk meds. If the suffering is high but the risk is higher, kick it upstairs. It saves you time by stopping dead-end conversations about dose increases for patients who aren't functionally impaired, and it protects you when the patient is impaired but unsafe.
