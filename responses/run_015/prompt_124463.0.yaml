  Here's the rub: if all qualitative facts are exhausted by the shared properties of the spheres, then the difference between your Naked Pair world and a One-Sphere world becomes undetectable in principle. There's no truthmaker for the claim "there are two" other than the spheres themselves, which are qualitatively identical. So I have to ask you: what makes it the case that there are two? If the answer is just "because there are two," you've turned PII into a tautology again by defining distinctness as primitive. Are you willing to say that a universe with one sphere and one with two could have absolutely no difference in their qualitative structure?
