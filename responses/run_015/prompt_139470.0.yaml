answer: |-
  ### The Grip-Relativist Defense: Accuracy Within Reach

  Accuracy-first epistemology stands on a simple, compelling pillar: the fundamental epistemic good is representing the world accurately. Credences are evaluable solely by their proximity to the truth. Traditionally, this program has been yoked to a demanding conception of the "space of possibilities." To measure the inaccuracy of an agent's credence function, we standardly map it against the full Boolean algebra generated by the atomic propositions relevant to the context. The result is a well-known disaster: the accuracy-firster is committed to logical omniscience. If the algebra contains a logical truth $T$, and inaccuracy is measured over the whole algebra, any agent assigning less than 1 to $T$ is deemed epistemically defective.

  This is a reductio of the standard framework, not of accuracy-firstism itself. The error lies in the assumption that accuracy must be measured against a God's-eye view of the algebra rather than the agent's cognitive reach. I propose **Grip-Relativism about Accuracy**.

  **The Thesis:** Let an agent's *grip* be the coarsest partition of the possibility space that the agent actually draws distinctions along. If an agent is deciding between pasta, pizza, and Thai, their grip is $G = \{Pasta, Pizza, Thai\}$. Accuracy should be measured exclusively over the cells of $G$. Consequently, rationality requires **Partition-Relative Probabilism**: an agent's credences must satisfy the probability axioms restricted to $G$, but are under no normative constraint regarding propositions outside $G$.

  This is not a concession to human weakness; it is a refinement of what accuracy *is* for a bounded mind.

  #### 1. The Dominance Argument on a Partition

  The standard argument for probabilism relies on accuracy dominance. If a credence function $c$ violates the probability axioms over a state space $\Omega$, there exists a function $c^*$ that is strictly more accurate than $c$ in every possible world, assuming a strictly proper scoring rule (like the Brier score).

  Grip-relativism modifies the domain of the scoring rule. Let $S(c, w)$ be the inaccuracy score. In the standard view, $S$ sums the squared errors over all propositions in the algebra. In the grip-relative view, $S_G(c, w)$ sums the squared errors only over the cells $g_i \in G$.

  $$S_G(c, w) = \sum_{g_i \in G} (c(g_i) - v_w(g_i))^2$$

  where $v_w(g_i)$ is 1 if $g_i$ is true in world $w$, and 0 otherwise.

  Because $G$ is a partition, the cells are mutually exclusive and exhaustive *relative to the agent's conceptual scheme*. The mathematics of proper scoring rules applies identically here as it does to the full algebra. If the agent's credences over $G$ do not sum to 1, or are negative, there exists an alternative assignment $c^*$ over $G$ that dominates $c$ in terms of $S_G$. Thus, rationality requires probabilism *on the grip*.

  However, for any proposition $p$ that cuts across the cells of $G$ (e.g., "The pasta is gluten-free" when the agent only grips "Pasta"), the agent has no credence assigned to $p$ in the relevant sense. They have not drawn the distinction. Therefore, there is no $c(p)$ to evaluate, and no dominance relation can be established relative to $S_G$. The agent is not inaccurate regarding $p$; they are simply agnostic in a pre-doxastic way.

  #### 2. Logical Omniscience and Epistemic Blame

  The primary virtue of grip-relativism is that it dissolves the problem of logical omniscience without abandoning the core veritistic commitment.

  Under standard accuracy-firstism, if an agent fails to see that $A \to B$ and $A$ entails $B$, they are inaccurate. This makes rationality an impossible ideal. Under grip-relativism, logical connections are only epistemically binding if they are represented within the grip. If the agent's partition lumps together worlds where $A \land \neg B$ holds with worlds where it does not, because the agent lacks the conceptual vocabulary to distinguish them, then the agent cannot be inaccurate about that distinction.

  This aligns perfectly with our intuitive practices of epistemic blame. We do not hold a student responsible for failing to conditionalize on a theorem they have never learned. We do not blame a diner for incoherence regarding the chemical composition of their pizza if their only concern is flavor. Grip-relativism explains *why*: epistemic norms are norms for *thinkers*, not for abstract belief systems. A norm that demands accuracy on distinctions the agent cannot cognitively access is not a norm the agent can follow. By restricting the accuracy score to the grip, we ensure that the "ought" of epistemology implies the "can" of cognition.

  #### 3. Objection I: The Exploitability Worry

  **The Objection:** If grip-relativism allows incoherence outside the grip, doesn't it leave the agent vulnerable to Dutch Books? A clever bookie could construct bets based on finer distinctions (e.g., gluten-free pasta) that the agent doesn't grip, exploiting the fact that the agent's implicit commitments (if projected onto the full algebra) are incoherent. Furthermore, what about the agent's future self? If I later learn to distinguish gluten-free pasta, my past self's credences will look incoherent to me. Doesn't this show the past self was genuinely irrational?

  **The Reply:** This objection conflates pragmatic utility with epistemic accuracy, and diachronic coherence with synchronic rationality.

  First, accuracy-firstism is a theory of *belief*, not *betting*. While Dutch Book arguments are often used to motivate probabilism, the grip-relativist takes the accuracy dominance argument as fundamental. If a bet relies on a distinction the agent does not grip, the agent cannot understand the bet as distinct from a bet on the coarser cell. To the agent, a bet on "Gluten-Free Pasta" just *is* a bet on "Pasta." A bookie cannot exploit the agent on distinctions the agent cannot process, because the agent cannot accept the wager under that description. The "exploitation" only exists from the bookie's perspective, not the agent's. Epistemic rationality is about the agent's perspective.

  Second, regarding the future self: Rationality is primarily a property of a time-slice. When the agent expands their grip (learning new concepts), they undergo a conceptual shift, not merely a belief update. The future self operates on a new partition $G'$. It is true that the past credences, *if projected* onto $G'$, would be incoherent. But they were not held on $G'$. They were held on $G$. To judge the past self by the standards of $G'$ is to judge a fish by its ability to climb a tree. The past self satisfied Partition-Relative Probabilism for $G$. That is sufficient for synchronic rationality. Diachronic norms only kick in once the grip is established; they govern how you move *within* a conceptual scheme, not how you are judged by schemes you did not yet possess.

  #### 4. Objection II: The Psychologism Worry

  **The Objection:** Epistemology is normative; psychology is descriptive. "Grip" is a fuzzy, psychological notion—what an agent "actually draws distinctions along" varies by attention, fatigue, and conceptual repertoire. By making accuracy relative to grip, you are collapsing the normative "ought" into the descriptive "is." You are letting agents off the hook simply because they are cognitively lazy.

  **The Reply:** This objection assumes a false dichotomy between the normative and the psychological. Epistemic norms are constitutive norms for cognitive agents. They tell us how to manage our doxastic states *given that we are cognitive agents*.

  Consider an analogy: Traffic laws are normative. But a law that demands a car travel at 200 mph in a 10 mph zone is not a valid traffic law for that zone. The "can" constrains the "ought." Grip is not a whim; it is the structural interface between the mind and the world. It represents the resolution at which the agent engages with reality.

  Furthermore, grip-relativism does not allow for laziness. The norm requires that *given* your grip $G$, your credences must be probabilistic on $G$. It also implies a derivative norm: if you suspect your grip is too coarse to capture relevant truth-values (e.g., you suspect there might be a difference between pastas that matters for truth), you have an epistemic duty to refine your grip. But until that refinement happens, you cannot be inaccurate about what you do not see.

  Smuggling psychology into epistemology is not a bug; it is a requirement for a theory that aims to guide actual believers. If the "norm" demands accuracy on a partition the agent literally cannot represent, the norm is not guiding the agent; it is describing a Platonic ideal unrelated to human inquiry. Grip-relativism preserves the normativity (you *must* be probabilistic on your grip) while grounding it in the agent's actual cognitive capacity.

  #### Conclusion

  Grip-relativism about accuracy saves the accuracy-first program from its own most damaging implication. By restricting the domain of inaccuracy measurement to the partition an agent actually grips, we derive a version of probabilism that is demanding where it counts (internal coherence of conceived possibilities) and silent where it must be (distinctions the agent cannot make).

  This view respects the intuition that accuracy is the primary epistemic good, but acknowledges that accuracy is a relation between a mind and a world. If the mind lacks the resolution to distinguish two states of the world, it cannot be inaccurate about the difference between them. Partition-relative probabilism is not a weakened form of rationality; it is the only form of probabilism that applies to beings who must think before they can believe.
