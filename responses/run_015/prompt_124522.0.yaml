  ### Essay Question: The Algorithmic Cage (Final Exam)

  **Time Allowed:** 90 Minutes  
  **Expected Length:** Approximately 800 words  
  **Instructions:** Read the case study below carefully. Construct a philosophical argument addressing the specific questions listed at the end. You are not required to use citations or a bibliography; rely on your understanding of Sartre's concepts from lectures and course notes. Casual formatting is acceptable.

  **Case Study: The PathFindr Dilemma**

  Alex is a mid-level data analyst living in a hyper-digitized urban center. Three years ago, Alex submitted their psychological profile, academic history, and biometric stress data to "PathFindr," a proprietary algorithmic career-matching system used by most major employers in the region. PathFindr returned a single result: "Optimal Placement: Compliance Officer at CorpX." The system explicitly flagged all other career paths as "High Risk for Failure" or "Statistically Unviable." Alex accepted the job.

  Recently, the conditions at CorpX have deteriorated. The work is morally compromising, requiring Alex to manipulate user data in ways that violate their personal ethics. The environment is toxic, leading to severe anxiety and health issues. Colleagues have suggested quitting or transferring, but Alex refuses to consider these options. When pressed, Alex argues that they literally cannot leave. They claim that because PathFindr has locked their digital identity into the Compliance sector, no other company will hire them. Alex insists that applying elsewhere would be futile because the algorithm has already determined their professional trajectory. They say, "I don't have a choice. The system decided who I am. To quit would be irrational because the data says I will fail at anything else."

  Alex continues to show up to work every day, signing the contracts, and performing the tasks, all while maintaining the belief that they are trapped by the algorithm's determination. They feel anguish but suppress it by repeating that the algorithm is an objective authority greater than their own will. Alex treats the algorithm's prediction as a causal law of nature, similar to gravity, rather than a probabilistic suggestion.

  **Prompt Questions**

  Using Jean-Paul Sartre's framework of existentialism, specifically focusing on *Being and Nothingness*, analyze Alex's situation. Your essay must address the following three interconnected issues:

  1.  **Bad Faith vs. Facticity:** Sartre argues that human reality is a mix of facticity (the facts of your situation) and transcendence (your ability to go beyond those facts). Is Alex acknowledging facticity, or are they in bad faith? Explain whether treating the algorithm's output as a deterministic law constitutes a lie to oneself.
  2.  **Ontological vs. Practical Freedom:** Sartre distinguishes between the freedom of choice (ontological) and the freedom of success (practical). Even if Alex practically cannot find another job easily, does ontological freedom remain? Does Alex's claim that they "cannot" leave confuse practical difficulty with ontological impossibility?
  3.  **Outsourcing Agency:** Consider the role of the technology. Does handing authority to an algorithm absolve responsibility? Analyze whether using the algorithm as an excuse to stay in a harmful job is a form of fleeing the burden of freedom.

  Your response should argue whether Sartre would condemn Alex's behavior as inauthentic. Be precise about why facticity does not equal causal determination. Avoid summarizing Sartre's biography; focus strictly on the concepts of freedom, responsibility, and self-deception. Ensure your argument flows logically from the definition of bad faith to the specific application of Alex's reliance on the algorithm.

  ***

  ### Model Answer

  Sartre would unequivocally classify Alex's behavior as bad faith. While Alex faces genuine constraints, their interpretation of those constraints denies their own ontological freedom. By treating the PathFindr algorithm as a deterministic force rather than a factual situation, Alex is lying to themselves to escape the anguish of responsibility.

  First, we must distinguish facticity from determinism. Facticity refers to the brute facts of a situation: Alex's skills, the job market, and the existence of the algorithm are all factual. However, Sartre insists that facts do not cause actions; consciousness gives them meaning. Alex claims the algorithm has "locked out" other paths, treating a probabilistic software output as a causal law of nature. This is the core of bad faith. Alex is pretending to be a thing—an object determined by external data—rather than a consciousness that interprets data. The algorithm suggests Alex might fail elsewhere; it does not physically prevent Alex from applying. By conflating the suggestion with a command, Alex reduces their transcendence to mere facticity. They are pretending to be a "Compliance Officer" by essence, rather than a person currently performing compliance work.

  Second, Alex collapses ontological freedom into practical freedom. Sartre acknowledges that practical freedom—the ability to effect change in the world—is limited. It might be practically difficult for Alex to find new work; banks might reject them, or other firms might use similar software. However, ontological freedom—the freedom to choose one's attitude and project—is absolute. Even in chains, a prisoner is free to choose how to endure imprisonment. Alex retains the freedom to quit, even if the consequence is poverty or unemployment. To say "I cannot leave" is to claim ontological impossibility where there is only practical risk. Sartre argues that we are condemned to be free; there is no escape from the necessity of choosing. Alex is choosing to stay every day they clock in. By labeling this choice as "no choice," Alex attempts to hide their authorship of their own life.

  Finally, outsourcing agency to technology is a modern form of fleeing responsibility. Alex uses the algorithm as a surrogate God, an external authority that validates their inaction. In bad faith, the individual seeks to be both free and determined, wanting the security of a fixed nature without the burden of creating it. Alex wants the algorithm to be responsible for their career so they don't have to face the risk of choosing a new path. But the algorithm has no consciousness; it cannot bear responsibility. Only Alex can. By submitting to the system, Alex is not obeying a law; they are choosing to obey. That choice to obey is itself an exercise of freedom that Alex denies.

  In conclusion, Alex is in bad faith. They are not denying the facts of their situation, but they are denying their relationship to those facts. They treat probabilistic barriers as deterministic walls. They confuse practical difficulty with ontological imprisonment. And they outsource their agency to a machine to avoid the anguish of choosing differently. For Sartre, Alex is not trapped by the code; they are trapped by their refusal to admit that they hold the key.

  ***

  ### Marking Scheme (Total: 25 Marks)

  **1. Identification of Bad Faith as Self-Deception (5 Marks)**
  *   **Criteria:** Student correctly identifies that Alex is lying to themselves to avoid anguish, not just describing a hard situation.
  *   **A vs B:** An A recognizes bad faith as an active project of hiding freedom; a B treats it as simply being wrong or confused.
  *   **Common Botch:** Students often define bad faith as "lying to others" rather than lying to oneself.

  **2. Facticity vs. Causal Determinism (5 Marks)**
  *   **Criteria:** Student explains that the algorithm is a fact (facticity) but does not cause Alex's actions (determinism).
  *   **A vs B:** An A sees facticity as the *ground* for freedom; a B treats facticity as a limit that reduces freedom.
  *   **Common Botch:** Students usually argue that facticity limits ontological freedom, which Sartre denies.

  **3. Ontological vs. Practical Freedom Distinction (5 Marks)**
  *   **Criteria:** Student distinguishes between the freedom to choose (ontological) and the freedom to succeed (practical).
  *   **A vs B:** An A maintains that ontological freedom remains absolute even if practical freedom is low; a B collapses them.
  *   **Common Botch:** Students claim that if Alex can't get a job, they aren't free, missing the ontological point.

  **4. Analysis of Outsourcing Agency (5 Marks)**
  *   **Criteria:** Student argues that using the algorithm as an excuse is still a choice made by Alex.
  *   **A vs B:** An A sees the tech as a tool used in bad faith; a B blames the tech for the loss of agency.
  *   **Common Botch:** Students get distracted by ethics of AI rather than the existential responsibility of the user.

  **5. Coherence and Application (5 Marks)**
  *   **Criteria:** Argument flows logically without contradictions, applying concepts directly to Alex's specific claims.
  *   **A vs B:** An A integrates all concepts into a unified thesis; a B lists concepts separately without synthesis.
  *   **Common Botch:** Students write a generic summary of Sartre without referencing the algorithm or Alex's specific situation.
