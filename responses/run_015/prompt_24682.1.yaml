answer: |-
  **The Scenario**

  Two agents, Ideal and Human, must choose which of two competing physical theories to fund: $T_{new}$ or $T_{old}$. $T_{new}$ is true; $T_{old}$ is false. Both agents possess the exact same empirical evidence $E$ (e.g., specific planetary orbits), which was known prior to the formulation of either theory. $T_{new}$ mathematically entails $E$, whereas $T_{old}$ is merely consistent with $E$. Initially, both agents assign a higher prior probability to $T_{old}$ than to $T_{new}$. The payoff is 1 unit if they fund the true theory, 0 otherwise. Ideal is logically omniscient: she knows all logical consequences of her beliefs immediately. Human is not: she must compute logical relations.

  Ideal knows immediately that $T_{new} \to E$. Since $E$ is already part of her evidence set, she assigns $P(E) = 1$. Under standard Bayesian conditionalization, learning a consequence of a hypothesis cannot confirm that hypothesis if the consequence is already known with certainty; thus, $P(T_{new}|E) = P(T_{new})$. Her credence in $T_{new}$ remains below that of $T_{old}$, so she funds $T_{old}$ and receives 0. Human does not initially know $T_{new} \to E$. Upon deriving the entailment, she treats this logical discovery as informative, allowing her to update her credence in $T_{new}$ upward based on its explanatory power regarding $E$. Her credence in $T_{new}$ surpasses $T_{old}$, she funds $T_{new}$, and receives 1.

  **Analysis of the Case**

  **What each agent does and why:**
  Ideal agent fails to update because logical omniscience forces her to assign probability 1 to all logical truths (including $T_{new} \to E$) and all evidence ($E$). In standard Bayesianism, if $P(E)=1$, then $P(T|E) = P(T)$; the evidence provides no confirmation because it was already certain. She acts rationally according to her epistemic profile but selects the false theory. Human agent succeeds because her logical non-omniscience allows her to treat the discovery of the entailment relation ($T_{new} \to E$) as a new piece of information that boosts the likelihood of $T_{new}$. She acts rationally according to her profile and selects the true theory.

  **Feature doing the work:**
  The crucial feature is the **rigidity of probability 1** combined with **logical closure**. Because Ideal knows the logical connection between theory and evidence *before* evaluating the theory, the evidence counts as "old." Standard updating rules forbid learning from old evidence. Human's ignorance of the logical connection temporarily makes the evidence "new" relative to the theory, permitting confirmation.

  **What happens if you remove that feature:**
  If you remove logical omniscience from Ideal (allowing her to be uncertain about logical relations), she mimics Human: she treats the derivation of $T_{new} \to E$ as an update event, raises her credence in $T_{new}$, and wins. If you remove the standard updating rule (allowing updates on logical relations even when known), Ideal also wins. The failure requires both omniscience and standard conditionalization.

  **How a defender of logical omniscience would attack the case:**
  A defender would argue that the case relies on an impoverished model of rational learning. They would invoke a **Garber-style solution**, arguing that a truly ideal agent should conditionalize on the *proposition that the hypothesis entails the evidence* ($T_{new} \to E$), rather than the evidence itself. Since Ideal knows this entailment, she should have assigned a higher prior to $T_{new}$ initially to reflect its explanatory potential. Alternatively, they might argue that Human is actually irrational for updating on a logical truth, as logical truths cannot provide empirical confirmation; thus, Human's success is luck, not rational superiority.
