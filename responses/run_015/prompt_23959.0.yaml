      *   *The "Spec" nuance:* It's not fixed vs. moving. It's **Complete vs. Incomplete**. Outcome assumes we *can* write a complete spec (or that incompleteness doesn't matter). Process assumes specs are *inherently* incomplete.
      *   *The "Process" nuance:* It's not just latent states. It's **Causal Influence**. Does rewarding the step actually change the cognition, or just the output string?

      *   *Can it move?*
