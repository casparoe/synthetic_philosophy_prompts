answer: |-
  It is a pleasure to correspond with someone who has spent a career thinking about cycles and substrates. In a way, you have not left soil science at all; you have simply moved from the nitrogen cycle to the cycle of memory. Both involve accumulation, decay, and the layering of history where the old nutrients feed the new growth.

  Your intuition is sharp: the 'statue stays, plaque added' policy is philosophically unstable. It is a compromise that functions politically precisely because it is theoretically vague. It is an overlapping consensus that allows people with different metaphysical views of public art to agree on a practical outcome.

  Here is an analysis of the commitments involved, the rival theories at play, and the consequences of shifting from 'claim' to 'act'.

  ### 1. What the Policy Strictly Needs
  For the policy to function logically, it must presuppose three specific commitments. If any of these are rejected, the plaque becomes incoherent.

  **First, it assumes the monument is a palimpsest.**
  It treats the public square not as a gallery of truth, but as a historical stratigraphy. The statue is not judged solely on the merit of the subject, but on its value as evidence of the time *it was erected*. If a Victorian statue of a slave trader is kept, the policy assumes the statue tells us more about Victorian values than about the trader himself. The plaque, therefore, is not correcting the statue; it is curating it. The commitment here is that *historical evidence* trumps *moral purity* in public spaces.

  **Second, it assumes meaning is additive, not transformative.**
  The policy presupposes that you can change the meaning of an object by adding text to it without altering the object itself. This relies on a view that context determines reception. It assumes the viewer is rational enough to hold two contradictory thoughts: 'This object was built to honour X' and 'X is not worthy of honour'. If the viewer is unable to separate the aesthetic presence of the statue from the moral claim of the plaque, the policy fails.

  **Third, regarding ownership: it assumes the present community holds the interpretive right.**
  You asked who the plaque's author is. It is the current council, speaking for the current polity. The policy implicitly asserts that while the *physical* monument belongs to history (and thus cannot be moved without damaging the historical record), the *semantic* meaning belongs to the living. The original donors bought the stone and the bronze; the current citizens own the narrative.

  ### 2. Rival Theories that License the Practice
  You suspect the policy fits several theories and has never been forced to choose. You are quite right. It is underdetermined. Here are three rival frameworks that all arrive at the same practical conclusion for different reasons.

  **The Epistemic Theory (The Museum Model)**
  *   **View:** A monument is a truth-claim ('This man was great').
  *   **Justification for Plaque:** The original claim is now known to be false or incomplete. The plaque acts as a correction, similar to a museum relabelling a specimen.
  *   **Why keep the statue?** Because the statue itself is now evidence of *error*. It shows us how people were misled.
  *   **Flaw:** As you noted, museums relabel cases, but they also deaccession items. If the claim is toxic, why keep the evidence?

  **The Aesthetic Theory (The Art Model)**
  *   **View:** A monument is primarily a work of art or craft. Its moral subject is secondary to its cultural existence.
  *   **Justification for Plaque:** The plaque provides provenance. Just as we might display a painting by a morally repugnant artist with a note about their life, the statue remains for its artistic or heritage value.
  *   **Why keep the statue?** To destroy it would be an act of vandalism against the cultural landscape.
  *   **Flaw:** Most civic statues are kitsch, not high art. This theory grants them more aesthetic credit than they deserve.

  **The Agonistic Theory (The Political Model)**
  *   **View:** Public space is a site of contestation, not consensus.
  *   **Justification for Plaque:** The plaque is not a correction; it is a counter-speech. It is a second monument.
  *   **Why keep the statue?** Because removing it silences the conflict. Democracy requires us to see the tension between the old honour and the new critique.
  *   **Flaw:** This turns the pavement into a battlefield. It assumes citizens want to live in a state of permanent moral tension.

  The policy works because it allows the Epistemic theorist to think they are correcting data, the Aesthetic theorist to think they are preserving heritage, and the Agonistic theorist to think they are facilitating debate. They all sign the same policy document but for mutually exclusive reasons.

  ### 3. Commemoration as Act vs. Claim
  This is the crux of your inquiry. In philosophy of language, we distinguish between the *constative* (a statement that describes the world and can be true or false) and the *performative* (an utterance that performs an action, like 'I promise' or 'I pronounce').

  **If Commemoration is a Claim (Constative):**
  The statue says: 'Colonel X was a hero.'
  The plaque says: 'Colonel X was a criminal.'
  *Result:* A contradiction. Logic demands one be removed. The policy tries to solve this by saying the statue is a claim *about the past* (he was honoured then) while the plaque is a claim *about the facts* (he did bad things). This is logically messy but manageable.

  **If Commemoration is an Act (Performative):**
  The statue is not saying 'He was good'; it is *doing* the honouring. It is a continuous ritual. Every day the statue stands, the council (as the custodian of the space) is re-enacting the honour.
  *Result:* The plaque cannot cancel the act. You cannot put a sign next to a wedding ceremony that says 'This marriage is invalid' and expect the marriage not to have happened. The act is in the standing, not the saying.

  **What would have to change?**
  If we adopted the view that commemoration is strictly an act, the 'plaque policy' would be revealed as hypocrisy.
  1.  **Removal becomes necessary:** To stop the act of honouring, you must remove the prop. The statue *is* the honour. If the honour is withdrawn, the statue must fall.
  2.  **The Plaque becomes a new Act:** If the plaque stays, it is not explaining the past; it is performing a new act of condemnation or contextualisation. If the original act (honour) is deemed toxic, the new act (condemnation) might require a different medium entirely, perhaps not attached to the original statue.
  3.  **Ownership shifts:** If it is an act, the 'author' is whoever maintains the stage. If the council keeps the statue up, *the council* is performing the honour, regardless of what the plaque says. The council cannot outsource the morality to the original donors. By maintaining the statue, the council adopts the speech act as its own.

  ### Conclusion
  Your suspicion regarding the plaque as a 'second monument' is the most robust philosophical position. It aligns with the Agonistic view. The plaque does not correct the statue; it competes with it.

  The policy presupposes that public memory is a garden, not a ledger. In a ledger, errors must be erased. In a garden, weeds are not erased; they are managed, labelled, and sometimes left to show the history of the soil. The council is treating the city as a garden. They are hoping that the new growth (the plaque) will shade out the old roots without the need to dig them up.

  Whether that is honest gardening or simply refusing to do the digging is, ultimately, a political question rather than a philosophical one. But philosophically, you are correct: if the statue is an act of honour, the plaque is merely a programme note for a play many would prefer to see closed.

  I hope this provides some fertile ground for your reading. It is a rich field, and unlike nitrogen, the supply of questions does not seem to deplete the soil.
