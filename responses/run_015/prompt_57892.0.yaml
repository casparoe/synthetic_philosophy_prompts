answer: |-
  **Project Title:** Pricing Political Instability: The Repeal-Anticipation Problem in Futarchic Pilots

  **Principal Investigator:** [Your Name]
  **Duration:** Eight Weeks
  **Request:** Summer Research Grant

  **1. Research Question and Problem Statement**

  Futarchy proposes to improve governance by using prediction markets to estimate the impact of policies on a defined national welfare metric. In a pilot context, such as a charter city testing zoning reforms against an index of land values and resident satisfaction, the mechanism assumes that market prices reflect the expected value of the policy *if implemented*. However, in any democratic or council-based system, current decisions are subject to future revision.

  This project isolates a specific failure mode: the **Repeal-Anticipation Problem**. This is distinct from standard market manipulation (where actors trade to move prices) and distinct from myopia (where traders discount distant outcomes). The Repeal-Anticipation Problem arises when rational traders price a policy not based on its intrinsic efficacy, but on the probability that future governance bodies will dilute or reverse it before the evaluation period concludes. If traders anticipate that a bold zoning reform will be watered down by a subsequent council, the market price will reflect the value of the *watered-down* policy, potentially causing the market to reject the bold reform even if it would have been highly beneficial had it been maintained.

  **Primary Research Question:** To what extent does the rational anticipation of endogenous policy reversal distort conditional market prices, and under what institutional constraints does this distortion prevent the selection of welfare-maximizing policies?

  **2. Gap in Existing Literature**

  Current discourse surrounding futarchy largely bifurcates into advocacy for its information-aggregation properties and criticism regarding its vulnerability to manipulation or metric gaming. Proponents argue that markets efficiently aggregate dispersed information about causal relationships, outperforming voting or expert panels. Critics argue that bad actors can subsidize markets to mislead decision-makers or that welfare metrics are impossible to define neutrally.

  Both sides generally treat the policy implementation phase as a black box or assume a credible commitment mechanism is in place. They assume that if the market votes "Yes," the policy remains in force long enough for the metric to be measured. Political economy literature discusses time inconsistency and commitment problems extensively, but rarely applies these concepts to the *pricing mechanism* of decision markets. There is no formal account of how the iterated nature of democratic governance interacts with the conditional contracts required by futarchy. If the market prices in the probability of repeal, futarchy may systematically bias against structural reforms that require stability to bear fruit, favoring instead short-term, reversible interventions. This project fills that gap by modeling the interaction between market expectations and political continuity.

  **3. Methodology and Work Plan**

  This project will utilize formal decision theory and game-theoretic toy models rather than empirical data collection. Empirical work is currently infeasible as no sufficiently large-scale futarchy pilots exist, and historical data on policy reversal does not include associated prediction market prices. A theoretical approach allows for the isolation of variables that would be confounded in a natural experiment.

  **Weeks 1-2: Model Formalization.**
  I will construct a two-period sequential game.
  *   **Agents:** Traders (risk-neutral, rational expectations), a Policy Maker (current council), and a Successor (future council).
  *   **Policy Space:** A choice between Status Quo and Reform.
  *   **Uncertainty:** The true state of the world (which determines policy efficacy) and the preference distribution of the Successor.
  *   **Market:** A conditional prediction market that resolves based on a welfare metric $W$ at $t=2$, contingent on Reform passing at $t=1$.

  **Weeks 3-5: Equilibrium Analysis.**
  I will solve for the market price of the Reform policy under varying probabilities of repeal. The core variable is the "Commitment Strength" parameter ($C$), representing the cost or difficulty for the Successor to reverse the Reform. I will derive the equilibrium price function $P(Reform) = E[W | Reform, C]$. The goal is to determine the divergence between $P(Reform)$ and the true expected value $E[W | Reform, \text{No Repeal}]$.

  **Weeks 6-7: Welfare Implications.**
  I will compare the policy selected by the market against the social optimum. I will identify thresholds where the Repeal-Anticipation Problem causes a "Type II Error" (rejecting a beneficial policy) solely due to anticipated instability. I will also test mitigation strategies, such as supermajority requirements for repeal or bonding mechanisms, within the model to see if they restore pricing efficiency.

  **Week 8: Synthesis and Reporting.**
  Compilation of results into a final paper and a technical appendix containing proofs and simulation code.

  **Why This Method is Preferable:**
  Attempting to measure this empirically would require observing counterfactuals (what would have happened if a policy wasn't repealed) which are inaccessible. Furthermore, empirical observation cannot easily distinguish between a low market price due to anticipated repeal versus a low market price due to anticipated policy failure. A toy model allows for ceteris paribus analysis, isolating the repeal variable to determine if it is theoretically fatal or merely a noise factor.

  **4. Success and Failure Criteria**

  **Success:**
  The project succeeds if it produces a formal proof or robust simulation demonstrating a non-negligible divergence between market price and true policy value driven specifically by repeal anticipation. A successful result will identify specific institutional parameters (e.g., minimum commitment periods) required to keep this divergence below a tolerable threshold. Even a negative result (showing the effect is negligible under rational expectations) would be a valuable contribution, as it would clear a theoretical hurdle for futarchy pilots.

  **Failure:**
  The project would fail if the model proves mathematically intractable within the eight-week window, requiring simplifications that strip the problem of its essential dynamics (e.g., removing the strategic behavior of the Successor). Additionally, if the analysis reveals that the "Repeal-Anticipation" effect is indistinguishable from standard discounting within the model framework, the project would fail to isolate the specific variable of interest.

  **5. Scope and Risks**

  The primary risk to scope is "model creep." Political reality involves complex coalitions, multi-dimensional policy spaces, and noisy information. There is a temptation to add realism to the model by introducing multiple policy dimensions or heterogeneous trader beliefs. To remain feasible, I must strictly adhere to the toy model approach: one-dimensional policy space, representative agents, and binary outcomes.

  Another risk is the conflation of *repeal* with *metric manipulation*. The model must hold the welfare metric constant to isolate the policy continuity variable. If the scope expands to include the Successor changing the metric itself, the problem becomes unsolvable in eight weeks. I will explicitly assume the welfare metric is constitutionally locked for the duration of the evaluation period to maintain focus on policy reversal.

  By rigorously defining this theoretical constraint, this project aims to convert a lingering qualitative worry into a quantitative bound, providing charter city designers with clear guidelines on the commitment mechanisms necessary to make futarchy viable.
