answer: |-
  First, take a breath. It is 1 am, you are tired, and you have actually stumbled onto the resolution that the literature often obscures. You are not rambling; you are synthesising. The reason your reading group is stalled is not because the participants are obstinate, but because they are arguing past one another about the *function* of the model while pretending to argue about the *truth* of the assumptions.

  Here is the diagnosis, the test of your taxonomy, and the verdict on progress.

  ### 1. The Diagnosis: Is it Substantive or Verbal?

  It is a **substantive disagreement masked by verbal ambiguity**. (Confidence: High)

  You are correct that the debate stalls because nobody specifies the job the model is doing. However, it is not merely that they are answering different questions; it is that they hold incompatible views on the *stability* of economic regularities.

  *   **The Friedmanite (Instrumentalist)** assumes that the predictive regularity is robust across contexts. They believe that if a model predicts well in regime A, the underlying 'forces' (even if falsely described) are stable enough to predict in regime B. They treat the model as a *lookup table*.
  *   **The Critic (Realist/Structuralist)** assumes that predictive regularities are often contingent on specific institutional or structural backgrounds. They believe that if you change the policy or the regime, the 'false' assumptions will break the link between the model and the world. They treat the model as a *mechanism*.

  The verbal confusion arises because both sides use the word "assumption" to cover things that play logically different roles. When Friedman says assumptions don't matter, he is usually talking about **Negligibility** or **Scaffolding**. When the Critic says assumptions matter, they are usually talking about **Stand-ins** or **Domain** conditions that are liable to shift under policy intervention.

  Your hypothesis about interpolation vs. extrapolation is the crux. Friedman's defence works beautifully for interpolation (within-sample prediction). It collapses for extrapolation (policy change or new regimes). The disagreement is substantive because it concerns the *modal strength* of economic laws: are they stable enough to survive counterfactual manipulation?

  ### 2. Evaluating Your Taxonomy

  Is your four-way taxonomy doing work, or is it just relabelling? **It is doing work.** (Confidence: High)

  It is not merely relabelling because it shifts the focus from *metaphysics* (is this true?) to *methodology* (how does this function in the derivation?). Standard debates often conflate Negligibility and Stand-in assumptions. By separating them, you force the group to ask: "If we relax this assumption, does the model collapse, or does it just get messier?"

  *   **Negligibility:** Allows for error analysis.
  *   **Scaffolding:** Admits mathematical convenience without ontological commitment.
  *   **Stand-in:** Highlights the risk of black-boxing.
  *   **Domain:** Shifts the burden of proof to matching the model to the world.

  This taxonomy breaks the deadlock because it prevents the Friedmanite from defending a Stand-in assumption by pointing to the success of a Negligibility assumption.

  ### 3. Running the Taxonomy on Your Four Cases

  Here is where your taxonomy earns its keep.

  **Case 1: Zero-viscosity / frictionless plane (Mechanics)**
  *   **Classification:** **Negligibility.**
  *   **Analysis:** This is the Friedmanite's strongest ground. We know exactly how to add viscosity back in (Navier-Stokes). The limit is well-defined.
  *   **Verdict:** The Critic has no purchase here. The assumption is false, but the direction of de-idealisation is clear. Predictive success here *does* warrant confidence in the core theory because the 'false' factor is genuinely negligible in the specified domain.
  *   **Breakdown point:** None. This is the paradigm case of successful idealisation.

  **Case 2: One-immortal-consumer representative agent (Macro)**
  *   **Classification:** **Scaffolding** masquerading as **Stand-in**.
  *   **Analysis:** This is where the debate should actually happen. It is Scaffolding because it makes the dynamic programming tractable. It becomes a Stand-in when policy is evaluated *as if* the representative agent's reaction function is the aggregate reaction function.
  *   **Verdict:** The Critic wins. You cannot take a limit to 'many mortal agents' without fundamentally changing the model's structure (heterogeneity matters for aggregation). Friedman's defence fails because the assumption is not negligible; it is constitutive. If you use this for policy (extrapolation), you commit the Lucas Critique error.
  *   **Breakdown point:** The taxonomy reveals the sleight of hand: using a Scaffolding device to answer a Domain question.

  **Case 3: Continuum-of-agents assumption (Market-clearing)**
  *   **Classification:** **Scaffolding.**
  *   **Analysis:** Purely for tractability (avoiding integer constraints, ensuring convexity). There is no 'real' limit to take; an economy with $10^{10}$ agents is not a continuum.
  *   **Verdict:** Stalemate, but harmless. The Friedmanite is right that the falsity doesn't matter for *price prediction* in stable markets. The Critic is right that it matters for *mechanism design* or *crisis modelling* where indivisibilities matter.
  *   **Breakdown point:** The taxonomy shows this is a 'safe' falsehood *unless* the phenomenon being explained relies on granularity (e.g., bank runs).

  **Case 4: Firms-maximise-profits (Outside regime)**
  *   **Classification:** **Domain** + **Stand-in**.
  *   **Analysis:** Treated as a Domain condition ("in competitive markets..."), but often used as a Stand-in for actual managerial behaviour.
  *   **Verdict:** The Critic wins decisively on extrapolation. If you fit the model to a deregulated period and use it to predict behaviour under new regulation, the assumption fails. The 'profit maximisation' might have been a proxy for 'survival' in the old regime, but the new regime changes the survival conditions.
  *   **Breakdown point:** This exposes the interpolation/extrapolation gap. Friedman's criterion (predictive success) is silent on *why* the prediction worked, so it cannot warn you when the proxy breaks.

  ### 4. What Counts as Progress?

  Do not expect a philosophical proof that one side is 'right'. Progress in your group will come from changing the question.

  **The Shift:** Move from "Are the assumptions realistic?" to "Is the model *structurally stable* under the intended intervention?"

  **Actionable Progress:**
  1.  **Formal Result:** Look for **Robustness Analysis**. A model makes a valid claim not when its assumptions are true, but when its predictions hold across a *range* of assumptions. If the prediction survives when you relax the Stand-in assumption, the Friedmanite is vindicated. If the prediction flips, the Critic is vindicated.
  2.  **Change of Question:** Stop asking "Is this model true?" Ask "What is the *invariance* range of this model?" (i.e., how far can we push the Domain assumption before the mechanism breaks?).
  3.  **Case Study:** The **Lucas Critique** is the historical hammer that broke the Friedmanite programme on policy. It is not a philosophical objection; it is a demonstration that parameters estimated under one policy regime are not invariant to another. Use this as your concrete example of why 'predictive success' is insufficient for policy.

  ### 5. Confidence and Uncertainty

  I am **highly confident** (90%) that your interpolation/extrapolation hypothesis is the correct diagnostic tool for this specific deadlock. The literature supports this (implicitly in the Lucas Critique, explicitly in recent work on model robustness), and it aligns with the logical structure of the arguments you described.

  I am **moderately confident** (75%) that your taxonomy will resolve the verbal disputes in your group. It is robust enough to categorise the standard examples, though it requires discipline to apply consistently.

  **The Single Point I Am Least Sure Of:**
  I am **least sure** (60%) about the sharp boundary between your **Scaffolding** and **Stand-in** categories. In practice, economists often promote a Scaffolding assumption (e.g., rational expectations as a computational device) into a Stand-in (e.g., rational expectations as a psychological claim) without noticing. Your group might stall on whether a specific assumption is 'just math' or 'a claim about mechanism'. Distinguishing these requires knowing the author's intent, which is not always recoverable from the text. If your group gets stuck, it will likely be here: arguing over whether an assumption was *intended* as Scaffolding or Stand-in.

  ### Summary Advice for the Next Session

  Do not let them rehash Friedman 1953. Propose this rule: **No assumption can be defended as 'unrealistic but useful' until the group agrees on whether it is Negligibility, Scaffolding, Stand-in, or Domain.**

  Then, ask the Friedmanite: "If this assumption is Scaffolding, are you willing to admit the model cannot be used for policy evaluation where that scaffolding supports the load?" Ask the Critic: "If this assumption is Negligibility, will you concede that its falsity is irrelevant for within-sample prediction?"

  You have the tools to break the impasse. Go to sleep, then use them.
