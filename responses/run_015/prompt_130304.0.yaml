answer: |-
  Here's the plan. Keep it tight.

  **1. The Sequence**
  Your logical dependency is correct (Metaphysics → Ethics), but your *pedagogical* order is risky. If you start with "attacking the coherence of death," you'll lose the yoga-studio crowd in 5 minutes. It's too abstract.

  **Fix:** Start with the **Tub-Drumming** as a *puzzle*, not the solution.
  1.  **Hook:** Tell the Tub story straight. "He banged on a tub and sang at his wife's funeral." Ask: "Monster or Sage?"
  2.  **Metaphysics (The Key):** Now explain *why*. This is where you do your "death isn't a boundary" bit + Butterfly Dream. Use Butterfly to show identity is fluid, so death is just another state change.
  3.  **Resolution:** Go back to the Tub. Now it's not cruelty; it's alignment.
  4.  **Contrast:** Then hit the Confucian mourning norms to show what he's pushing against.

  **2. The Carrying Example: The Tub-Drumming**
  Pick the **Tub**. You're teaching death, not epistemology. The Butterfly is too easy to dismiss as "nothing is real." The Tub forces them to deal with grief.

  *   **What it needs:** You *must* include the detail that Zhuangzi *initially cried* when she died, then stopped.
  *   **What it must lack:** Any suggestion that death is "better" than life. It's just *different*.
  *   **Avoiding the "Happy She's Dead/Stoic" Read:** Emphasize the shift. He didn't suppress the grief; he *thought* his way out of it. It's not "I feel nothing" (Stoic); it's "I realized crying assumes a boundary that doesn't exist." It's cognitive, not emotional suppression.

  **3. Mapping Misconceptions (Order of Appearance)**
  1.  **"So he believes in reincarnation?"**
      *   *When:* As soon as you say "transformation."
      *   *Head off:* Draw the line between a *soul* moving houses vs. *qi* dispersing like ice melting into water. No "him" survives to go somewhere.
  2.  **"He's just suppressing grief / Ancient Stoic."**
      *   *When:* You reveal the Tub scene.
      *   *Head off:* Use the "he cried first" detail. Stoics suppress; Zhuangzi *transforms understanding*. One is holding back, the other is letting go because the object of grief (the permanent self) is gone.
  3.  **"If death is fine, why not kill yourself?"**
      *   *When:* Q&A or wrap-up.
      *   *Head off:* Distinction between *accepting* the end vs. *forcing* the end. Suicide is interrupting the flow, just like excessive mourning is. Both assume you know better than the process.

  **4. The Check Question**
  Don't ask "What did Zhuangzi think?" Ask about the *conflict*.
  *"If Zhuangzi saw a Confucian mourner wailing at a funeral, why wouldn't he just say 'they're being emotional'? What specific assumption about the world is the mourner making that Zhuangzi thinks is factually wrong?"*
  (Target answer: The mourner assumes death is a permanent loss of a fixed self, rather than a phase change.)

  **5. What to Refuse Explicitly**
  Tell them upfront:
  *   "We aren't solving the authorship debate (Inner vs. Outer chapters). Treat the text as a unified voice for today."
  *   "We aren't trying to prove Zhuangzi was a quantum physicist. Don't ask me to map *qi* to modern physics."
  *   "We aren't deciding if he's *right*. We're figuring out what he's *saying*."

  Keep it moving. 40 mins flies. Good luck.
