      *   Focus: Identify the specific thesis required for "harmless."
      *   Needs: Distributional Null + Instant Adjustment.
      *   Why: Neutrality alone allows for short-term pain. He needs to claim the transition is costless.
      *   Drafting:
          For his "harmless" conclusion to hold, he needs the **Distributional Null Claim** combined with the **Instant Adjustment Claim**. Long-run neutrality alone admits that prices rise, which hurts fixed-income savers during the transition. He needs to argue that everyone adjusts simultaneously so no relative wealth changes occur. He also relies on the **Numeraire Claim** to treat inflation as a mere measurement change rather than a contract breach. If money is just oil, viscosity changes shouldn't matter. But if money is a contract, changing its value breaches agreements. His argument collapses if he admits money enters the economy unevenly (Cantillon effects). He needs the metaphor to imply that money supply changes are frictionless and universal, rather than localized and lagged. Without assuming instant price flexibility, the "oil" analogy fails to protect savers from erosion.

  7.  **Drafting Section 5: "The bootstrapping twist" (~150 words)**
      *   Focus: Circularity/Epistemic bootstrapping. Value based on expectation.
      *   Concept: Money has value because others accept it. If printing changes expectations, it changes value.
      *   Does the metaphor hide this? Yes, oil has intrinsic lubricating properties. Money has only intersubjective value.
      *   Drafting:
          The metaphor hides a circularity: oil lubricates due to physical properties independent of belief. Money lubricates only because of collective expectation. If printing cash alters the expectation of future value, it changes the lubricant's very nature. This is an epistemic bootstrapping problem: value exists because we believe others value it. Printing money signals that the issuer believes the currency is less scarce, updating everyone's expectations downward. The "oil" analogy assumes the substance remains constant while quantity changes. But with fiat money, quantity *is* quality. Increasing supply degrades the trust mechanism that gives the oil its slipperiness. You cannot add more oil without changing its viscosity if the oil is made of confidence. The metaphor fails because it treats money as a physical commodity with stable properties, ignoring that its value is purely epistemic and sensitive to supply signals.

  8.  **Drafting Section 6: "What would change my mind" (~100 words)**
      *   Focus: What evidence/argument flips the verdict?
      *   Condition: If inflation was perfectly anticipated and indexed. Or if money was commodity-backed.
      *   Shakiest reasoning: The distinction between short/long run.
      *   Drafting:
          I would concede if you proved inflation is perfectly anticipated and all contracts are indexed to price levels automatically. If wages and savings adjust instantaneously to money supply changes, the Distributional Null Claim becomes true, making the printing harmless. My reasoning is shakiest on the timeframe of "long-run neutrality." If the adjustment period is short enough, the harm is negligible. Additionally, if money were commodity-backed (gold), the "oil" metaphor works better because supply isn't discretionary. With fiat, the issuer's discretion introduces the trust variable that breaks the physical analogy. Prove the transition costs are zero, and the friend wins.

