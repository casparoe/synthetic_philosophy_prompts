      *   Drafting: Your friend invoked Hume's famous distinction to argue that increasing the money supply is merely operational, not substantive. By calling money "oil," he suggests it facilitates transactions without constituting real wealth itself. Consequently, adding more oil shouldn't damage the engine (the economy); it just reduces friction. You countered that inflation erodes purchasing power, effectively stealing from savers. The stake is whether money is neutral—a mere numeraire—or whether changes in its quantity trigger real distributional consequences. Your friend relies on the metaphor to dismiss inflation as a technical adjustment rather than a harm, while you see it as a violation of property rights through price level changes. The slogan masks whether "lubrication" implies harmlessness or just functionality.

  4.  **Drafting Section 2: "The menu of readings" (~350 words)**
      *   Focus: Distinct precise claims.
      *   Reading 1: *The Medium Claim.* Money is only a medium of exchange, not a factor of production. It doesn't build houses or grow wheat.
      *   Reading 2: *The Neutrality Claim.* Changes in money supply affect nominal variables (prices) proportionally, but not real variables (output, employment) in the long run.
      *   Reading 3: *The Distributional Claim.* Inflation hits everyone equally; no one loses real purchasing power relative to others because prices and wages adjust instantly.
      *   Reading 4: *The Veil Claim.* Money is a mere accounting unit; printing more is like changing inches to centimeters. It changes the number, not the thing measured.
      *   Reading 5: *The Friction Claim.* More money reduces transaction costs (liquidity), potentially boosting short-term activity without long-term cost.
      *   Need to expand on these to hit word count. Explain the nuance of each.
      *   Drafting:
          1.  **The Factor Claim:** Money isn't capital. Printing cash doesn't create machines or labor. It distinguishes financial assets from real assets.
          2.  **The Long-Run Neutrality Claim:** Doubling money supply doubles prices eventually. Real GDP remains unchanged. This is the standard Classical/Monetarist view.
          3.  **The Instant Adjustment Claim:** Prices and wages flex immediately. There are no sticky prices, so no one gets caught holding the bag during the transition.
          4.  **The Distributional Null Claim:** Inflation is a uniform tax. It doesn't redistribute wealth between creditors and debtors or savers and spenders because everyone adjusts simultaneously.
          5.  **The Liquidity Benefit Claim:** More money lowers interest rates and eases trade constraints, acting as actual lubricant that prevents seizures (deflationary spirals).
          6.  **The Numeraire Claim:** Money is just a unit of account. Printing more is like redefining the meter. It's a semantic shift, not an economic event.
          Each reading isolates a different mechanism. The Factor Claim is about production functions. Neutrality is about equilibrium states. Instant Adjustment is about market dynamics. Distributional Null is about welfare. Liquidity is about stability. Numeraire is about measurement. Your friend likely conflates them to suggest that because money isn't a factor (1), it causes no harm (4). But 1 does not imply 4. You can have non-factor inputs that still distort prices during adjustment periods.

  5.  **Drafting Section 3: "Platitude, defensible, false" (~250 words)**
      *   Focus: Classify the readings from Section 2.
      *   *Platitude:* Factor Claim (obviously cash isn't a hammer).
      *   *Defensible:* Long-Run Neutrality (standard econ), Liquidity Benefit (in recessions).
      *   *False/Controversial:* Instant Adjustment (sticky prices exist), Distributional Null (Cantillon effects), Numeraire (money isn't just units, it's a contract).
      *   Drafting:
          The **Factor Claim** is a platitude. Cash doesn't build roads; labor and concrete do. No one disputes this. The **Long-Run Neutrality Claim** is defensible and standard in macroeconomics, though the "long run" might be decades. The **Liquidity Benefit Claim** is also defensible, specifically during liquidity traps where cash prevents deflationary collapse.
