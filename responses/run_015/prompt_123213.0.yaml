  2. The permissive principle implies approval as a regulated health service, whereas the restrictive principle implies rejection because the scheme commodifies friendship similarly to surrogacy.
  3. I recommend refusal to maintain consistency with our ban on commercial surrogacy, as selling the standing of a friend corrupts the authenticity of human intimacy rather than merely compensating labour.
  4. The ruling against commercial surrogacy is the closest analogue, since both proposals involve payment for assuming a specific familial or social role rather than providing a discrete physical task.
  5. A variant offering payment strictly for practical assistance without the explicit sale of friendship would best separate the principle of care work from the principle of commodified intimacy.
