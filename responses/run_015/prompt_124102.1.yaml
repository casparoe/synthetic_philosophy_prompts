answer: |-
  This is a sharp set of intuitions. You've correctly identified that the standard pop-psychology distinction ("Guilt = I did bad, Shame = I am bad") breaks down when "who I am" is actually something I'm responsible for (Case 2) versus when it isn't (Case 6).

  Here is a refined principle, an audit of your cases, a new test case, and the verdict on culture.

  ### 1. The Principle: The Agency-Utility Test

  Guilt and Shame are not distinguished by *what* they target (act vs. self), but by **locus of control** and **functional output**.

  **The Principle:**
  A moral emotion is **adaptive** (in good standing) if and only if:
  1.  **Agency Clause:** The object of the emotion is within your sphere of moral control (either a specific action you could have withheld, or a character trait you have the capacity to cultivate).
  2.  **Utility Clause:** The phenomenology of the emotion drives *approach behavior* (repair, amendment, growth) rather than *avoidance behavior* (hiding, withdrawal, defensiveness).

  **The Distinction:**
  *   **Guilt** is the signal for a **specific violation** of a standard you accept. It demands *restitution*.
  *   **Shame** is the signal for a **failure of alignment** between your current self and your ideal self. It demands *transformation*.

  Shame is only "good" when the "self" being judged is malleable. When the "self" being judged is fixed, shame becomes toxic.

  ### 2. Audit of Your Cases

  Here is how the Agency-Utility Test handles your verdicts, where it forces new clauses, and where I recommend overturning your gut.

  *   **Case 1 (Snap at sister):** **Guilt.** (Fits: Specific act, within control, demands apology).
  *   **Case 2 (Condescending tone):** **Shame.** (Fits: This forces the **Agency Clause** nuance. This is "who you are," but it is a *cultivated* habit, not a fixed trait. Guilt would be too shallow; you need the self-realignment Shame provides).
  *   **Case 3 (Traffic cut-off):** **Guilt.** (Fits: Specific act, even if private. No shame because it doesn't reflect on your character identity).
  *   **Case 4 (Ancestral wealth):** **Overturn.** Your gut says "low-grade shame." The Principle says **Neither (or Guilt about present).** You have no agency over the past (violates Agency Clause). Feeling shame here is performative self-flagellation. However, you *do* have agency over how you use that money now. If you spend it recklessly, that's Guilt. If you hoard it while others starve, that's Guilt. Shame about the source is useless noise.
  *   **Case 5 (Survivor guilt):** **Neither.** (Fits: Violates Agency Clause. You did not choose to survive. The emotion fails the test. It is empathy misfiring as self-judgment).
  *   **Case 6 (Accent):** **Shame (Maladaptive).** (Fits: Violates Agency Clause. Unchosen trait. Shame here drives hiding, not growth).
  *   **Case 7 (Postmortems):** **Culture -> Guilt.** (Fits: Structures the environment so errors are treated as specific violations to be fixed, not character defects. Satisfies Utility Clause).
  *   **Case 8 (Apology circles):** **Culture -> Shame.** (Fits: Looks like Guilt, but the public performance makes it about *worthiness* to be in the circle. Drives hiding/theater. Fails Utility Clause).
  *   **Case 9 (Lingering guilt):** **Overturn.** Your gut is split. The Principle says **Maladaptive Noise.** Once repair is offered and accepted, the debt is paid. Lingering guilt no longer drives repair (you can't apologize twice for the same thing). It has failed the Utility Clause. It is now just rumination.

  ### 3. The New Case: The Clumsy Ally

  Here is a case where your original principle (Act vs. Being) and the Agency-Utility Test diverge.

  **The Case:** You are trying to support a marginalized group at work. You genuinely want to help. In a meeting, you accidentally use an outdated term. Someone corrects you. You apologize. A week later, you interrupt a speaker from that group to "amplify" them, but they didn't want amplifying. You apologize again.
  *   **Guilt response:** "I keep messing up the specific actions. I need to learn the protocols."
  *   **Shame response:** "I am part of the problem. I'm a 'performative ally'. I should probably stop speaking up to avoid causing more harm."

  **Why this matters:**
  Your original principle might struggle here because the "Act" (interrupting) is repeated, looking like a "Character" flaw.
  The **Agency-Utility Test** clarifies it:
  *   **Guilt is adaptive:** It keeps you in the game. It treats the errors as learnable violations.
  *   **Shame is maladaptive:** Even though "being an ally" is a character trait you *could* cultivate, the Shame response here drives *avoidance* (withdrawing support).
  *   **Verdict:** This is a case where Guilt is morally superior to Shame, even though the failures are recurring. Shame creates a "moral exit" that lets you off the hook by silencing you. Guilt keeps the obligation active.

  ### 4. Can a Culture Pick?

  **Yes, but not by preaching.**
  Cases 7 and 8 prove cultures can shift the mix, but not by telling people "Feel guilt, not shame." They shift it by changing the **consequences of admission.**

  *   **Guilt Cultures:** Admission of error leads to *restoration*. (Case 7: You report the bug, we fix the system, you remain a valued engineer). This encourages Guilt because Guilt is the emotion of "I broke it, I can fix it."
  *   **Shame Cultures:** Admission of error leads to *status loss*. (Case 8: You apologize, but the group dynamic subtly marks you as the 'broken' one). This encourages Shame because the social reality is about your standing, not the error.

  **The Mechanism:** A culture cannot simply select an emotion. It selects a **feedback loop.** If the loop is *Error -> Fix -> Reintegrate*, Guilt flourishes. If the loop is *Error -> Confess -> Marked*, Shame flourishes (even if you call it "accountability").

  So, a culture can shift the mix on purpose, but only by engineering safety around vulnerability. If vulnerability is punished, shame will always win, regardless of the official rhetoric.

  ### 5. Which is the "Better" Emotion?

  If forced to choose a default for a functioning society: **Guilt.**

  **Why:**
  1.  **Scalability:** Guilt is transactional ("I owe you X"). Shame is existential ("I am less than"). You can resolve transactions with strangers; you cannot resolve existential crises with strangers.
  2.  **Safety:** Guilt is bounded. Once the repair is made, the emotion should cease. Shame is unbounded; it can persist indefinitely (see Case 9), leading to depression or defensiveness.
  3.  **Truth-Tracking:** Guilt tracks *harm*. Shame tracks *status*. In a modern, pluralistic society, we want to minimize harm, not necessarily maximize status homogeneity.

  **The Exception:**
  Shame is the better tool for **intimate, long-term character formation.**
  In a marriage, a friendship, or a mentorship (Case 2), Guilt is sometimes too thin. "I'm sorry I snapped" (Guilt) fixes the night. "I am becoming a bitter person" (Shame) fixes the life. Shame is the heavy machinery of moral growth. It is too dangerous for public use (Case 8), but often necessary for private depth (Case 2).

  **Final Verdict:**
  Run your public life and your culture on **Guilt** (Agency + Repair). Reserve **Shame** for your private mirror, and only when you are sure the flaw is yours to fix.
