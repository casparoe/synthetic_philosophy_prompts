          *   Define what a positive result looks like.
          *   Define failure conditions.
          *   Provide a specific test case separating "granularity" from "weight."
          *   Critically assess if "granularity" collapses into "relevant properties" (and sharpen if necessary).
      *   **Tone:** Academic, rigorous, suitable for an undergrad seminar proposal (ambitious but feasible).
      *   **Constraint:** Do not fill in citations (user will do that).

  2.  **Deconstruct the Core Philosophical Idea:**
      *   *Standard View:* Speciesism is wrong because it gives less weight to similar interests based on species. (Singer's view).
      *   *User's View:* Speciesism might be wrong because it uses a *category* (species) rather than *individual traits*, regardless of the weight assigned. It's about the *method of classification*.
      *   *The "Granularity" Hypothesis:* Is the error using a coarse-grained proxy (species) instead of a fine-grained metric (individual capacity), even if the proxy is statistically reliable?
      *   *Risk:* Does this just boil down to "species isn't a morally relevant property"? The user suspects it might collapse. I need to sharpen it. The distinction is between *ontological relevance* (is species relevant?) and *epistemic/procedural fairness* (is using a group average unfair to individuals?). This sounds like a statistical discrimination vs. individual merit argument applied to ethics.

  3.  **Drafting - Section by Section:**

      *   **Title:** Needs to be catchy but precise. "The Granularity of Moral Consideration" or "Speciesism as Statistical Discrimination." Let's go with something about the *Structure* of Speciesism.
      *   **Research Question:** Needs to be specific. "Is speciesism wrongful because of the *weights* assigned to interests, or because of the *granularity* of the classification system used to assign moral status?"
      *   **Background/Context:** Briefly mention Singer/Regan vs. Cohen. Acknowledge the "Argument from Marginal Cases" (AMC).
      *   **Why Standard Moves Fail:**
          *   *AMC:* Focuses on outcomes (humans with low capacity vs. animals with high capacity). Doesn't address whether a *rule* based on species-typicality is permissible.
          *   *Equal Consideration:* Assumes the problem is the weighting. If I weight equally but sort coarsely, equal consideration is satisfied in principle but violated in practice.
          *   *Racism/Sexism Analogy:* Usually focuses on prejudice. But what if the stereotype is statistically true (e.g., sex differences in strength)? Is using it still wrong? This parallels the species-typicality argument.
      *   **The Test Case (Crucial):** I need a scenario where Weight is Equal, but Granularity is Coarse.
          *   *Idea:* A "Species-Typical Utilitarian." They say "All beings with interests count equally." BUT, they determine rights/status based on *average* species capacity rather than individual capacity.
          *   *Example:* A human with severe cognitive impairment vs. a chimpanzee. The Species-Typical Utilitarian gives the human full rights because *humans* are agents, and the chimp fewer rights because *chimps* are not, even if this specific chimp is smarter than this specific human.
          *   *Separation:* The "Weight" theorist says this is wrong (look at the individual). The "Granularity" theorist asks: Is the wrongness that the chimp gets less weight, or that the human got a "group bonus"?
      *   **Methodology:** Not just intuition pumping. Needs conceptual analysis + perhaps a normative framework comparison (contractualism? rule-utilitarianism?). Two terms: Term 1 (Literature & Framework), Term 2 (Application & Defense).
      *   **Positive Result:** A defended account of *procedural speciesism*. Showing that even if species correlates with capacity, using it as a proxy is structurally unjust.
      *   **Failure Conditions:** If it turns out "granularity" is just a fancy word for "moral relevance of individual traits," the project fails to add new value. Or if the distinction doesn't change any practical outcomes.
      *   **Refining the "Collapse" Objection:** The user asked me to say if it collapses. It *risks* collapsing into "individual traits are what matter." To prevent this, I need to frame it as an *epistemic/administrative* constraint on moral reasoning, not just an ontological claim. It's about *fairness in classification*, akin to statistical discrimination in law/economics.

  4.  **Writing the Proposal (Iterative refinement):**

