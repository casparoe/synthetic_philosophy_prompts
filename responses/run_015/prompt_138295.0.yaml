answer: |-
  **Dissertation Proposal**

  **Title:** Beyond Weight: Speciesism as Procedural Granularity and Statistical Discrimination

  **1. Research Question**
  The standard debate on speciesism asks how much weight to assign the interests of non-human animals relative to humans (e.g., Singer's equal consideration of interests). This project asks a structurally prior question: Is the wrong of speciesism located in the *weights* assigned to interests, or in the *granularity* of the classification system used to assign moral status? Specifically, is speciesism wrongful because it uses species membership as a sorting property at all, or merely because it uses that property too coarsely—lumping individuals into species-buckets rather than sorting by individual capacities—even if the resulting distribution of rights matched a capacity-based view?

  **2. Background and Motivation**
  Contemporary animal ethics is dominated by the "weight" paradigm. Peter Singer argues speciesism is wrong because it violates the principle of equal consideration of equal interests. Tom Regan argues it is wrong because it denies subject-of-a-life status to those who possess it. Both rely heavily on the Argument from Marginal Cases (AMC): if a human with severe cognitive impairments has rights, a cognitively similar animal must also have them.

  However, defenders of speciesism (e.g., Carl Cohen) often concede that individual capacity matters but argue that *species-typical* capacity is the only administrable or morally coherent proxy. They argue we must sort by kind, not by individual metric. The standard AMC rebuttal shows that outcomes differ, but it does not address whether the *method* of sorting by kind is inherently unjust, independent of the outcome. This project hypothesizes that speciesism is a form of unethical statistical discrimination: it treats individuals as mere means to a group average, violating a duty of individualised moral consideration.

  **3. Why Standard Moves Do Not Settle This**
  *   **The Argument from Marginal Cases:** The AMC demonstrates inconsistency in *outcomes*. It shows that sorting by species yields different results than sorting by capacity. It does not prove that sorting by species is *procedurally* wrong if one could construct a "Species-Typical Utilitarian" who adjusts weights to ensure the final welfare output matches a capacity view.
  *   **Equal Consideration:** This principle dictates how to weigh interests once identified. It does not dictate how to identify the moral patient in the first place. One could theoretically accept equal consideration but apply it only after a coarse-grained species filter has excluded non-members.
  *   **Racism/Sexism Analogies:** These analogies usually rely on the falsity of the biological hierarchy. They are less effective against the claim that species differences are morally relevant *kinds*. To defeat the species-typicality defense, we need an argument that applies even if the statistical generalization is accurate (i.e., even if humans *are* typically more agential than chimps).

  **4. The Test Case: The Species-Typical Egalitarian**
  To separate the "weight" reading from the "granularity" reading, I will analyse the following hypothetical agent:
  *   **The Agent:** Assigns equal intrinsic weight to the interests of all sentient beings.
  *   **The Method:** Determines rights/status (e.g., right to life vs. right not to suffer) based on *species-typical* capacities rather than individual capacities.
  *   **The Scenario:** A chimpanzee with higher cognitive agency than a human with advanced dementia.
  *   **The Verdict:** The Agent grants the human full rights (based on human typicality) and the chimp limited rights (based on chimp typicality), despite the chimp's superior individual capacity.
  *   **The Separation:** A "weight" theorist cannot object, as the interests are weighted equally *within* the status categories. A "granularity" theorist objects that the human received an unearned "group bonus" and the chimp suffered a "group penalty." If this intuition holds, the wrong of speciesism is procedural (unfair classification), not just substantive (unequal weighting).

  **5. Methodology and Work Plan**
  This project will avoid pure intuition-pumping, which often stalls on conflicting case judgments. Instead, it will employ conceptual analysis grounded in theories of justice and discrimination.

  *   **Term 1: Framework and Literature:**
      *   Weeks 1-4: Map the "weight" paradigm (Singer, McMahan) vs. the "kind" paradigm (Cohen, Korsgaard).
      *   Weeks 5-8: Import literature on *statistical discrimination* from political philosophy and law (e.g., Lippert-Rasmussen). Does the moral prohibition on profiling humans apply to inter-species classification?
      *   Weeks 9-10: Draft Chapter 1 (The Weight/Granularity Distinction) and Chapter 2 (The Species-Typical Egalitarian).
  *   **Term 2: Application and Defense:**
      *   Weeks 1-4: Construct a positive account of "Individualised Moral Consideration." Why is granularity a moral requirement? (Potential grounding in Respect for Persons/Agents).
      *   Weeks 5-8: Stress-test the account against administrative burden objections (i.e., "We can't test every animal").
      *   Weeks 9-10: Finalise argument and conclusion.

  **6. Positive Result and Failure Conditions**
  *   **Positive Result:** A defended distinction between *substantive speciesism* (denying weight) and *procedural speciesism* (coarse sorting). The dissertation would conclude that even a benevolent speciesism that maximises welfare is objectionable because it violates a duty to assess individuals on their own merits. This shifts the burden of proof to defenders of speciesism to justify the *proxy*, not just the *outcome*.
  *   **Failure Conditions:**
      1.  **Collapse:** If "granularity" proves to be merely a verbose restatement of "individual traits are the only morally relevant properties," the project fails to offer a new structural insight. (I will mitigate this by focusing on the *epistemic fairness* of classification rather than the *ontology* of traits).
      2.  **Indeterminacy:** If the distinction yields no difference in practical verdicts (i.e., if procedural wrongness always collapses into substantive wrongness in practice), the distinction is theoretically idle.
      3.  **Administrative Defeat:** If the "administrative burden" objection proves insurmountable (i.e., if fine-grained sorting is impossible), the granularity critique becomes utopian and practically irrelevant.

  **7. Risk Assessment: The Collapse Objection**
  There is a significant risk that the "granularity" framing collapses into the plain question of which properties are morally relevant. If one argues "you must sort by individual traits," is that not just saying "species is not a relevant property"?
  *   *Sharpening:* To prevent collapse, I will argue that species *could* be relevant as a heuristic, but using it as a definitive classifier is a category error akin to judging a specific job applicant by their demographic average rather than their CV. The wrong is not that species is irrelevant, but that it is being used as a *substitute* for individual assessment where individual assessment is owed. This moves the debate from metaphysics (what matters?) to normative procedure (how must we judge?).

  **8. Bibliography Note**
  Primary texts will include Singer (*Animal Liberation*), McMahan (*The Ethics of Killing*), and Cohen (*The Case for the Use of Animals in Biomedical Research*). Secondary literature will draw on discussions of statistical discrimination in political philosophy (e.g., *Kasper Lippert-Rasmussen*) and recent work on moral status (e.g., *Jeff McMahan*, *Shelly Kagan*). Citations will be formatted according to department guidelines.
