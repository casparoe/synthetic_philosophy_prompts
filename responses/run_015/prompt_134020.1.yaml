answer: |-
  Here are 6 interview questions tailored to your guest's specific position on "soft analyticities," including the specific follow-ups you requested. They are ordered to build a logical arc during the interview.

  ### 1. The Architecture of Belief (Quine's Web)
  **Question:** Quine's "web of belief" is holistic; it implies that technically, any statement can be connected to any other if we adjust enough intermediate beliefs. You're arguing for local clusters instead. Is your objection that Quine's web is *psychologically* unrealistic, or do you think it's *logically* incoherent? Because if the clusters can interact at all, doesn't the web just re-form at a higher level?

  **Follow-up (If she says this is just a modeling choice/research program):**
  "If it's just a modeling choice, what explanatory power does the 'cluster' model give us that the 'web' doesn't? If both models can account for the same revisions, aren't you just redescribing Quine's holism with different vocabulary rather than actually solving the problem of connectivity?"

  ### 2. The Status of Mathematics
  **Question:** In Quine's system, mathematical truths are central to the web but still revisable in principle (like in quantum logic). In your cluster system, where do mathematical truths sit? Are they their own 'super-cluster' with maximum revision weight, or are they the structural glue that holds the other clusters together? Because if they're just another cluster, couldn't we theoretically revise arithmetic if the empirical pressure was high enough?

  **Follow-up (If she says the status of math is a separate issue for the research program):**
  "If the status of math is bracketed for later, doesn't that weaken the 'soft analyticity' claim? Because the hardest test for your view is whether it can explain why we treat logic and math differently than empirical facts. If your theory doesn't yet account for the 'hardest' cases of analyticity, can it really claim to improve on Quine?"

  ### 3. The "Back Door" Objection
  **Question:** A critic might say you're sneaking the analytic/synthetic distinction back in through the back door. If a statement is 'practically analytic' simply because it has a high revision weight within a cluster, aren't you just defining analyticity as 'stuff we are stubborn about'? Does your view preserve the *normative* force of logic (that we *ought* not change it), or does it just describe our psychological reluctance to do so?

  **Follow-up (If she says defining that normativity is part of the long-term research program):**
  "Fair, but if the distinction between 'normative necessity' and 'psychological stubbornness' isn't built into the framework yet, isn't there a risk that 'soft analyticity' collapses into mere sociology? I'm asking if your research program has a mechanism to distinguish between a truth we *can't* give up versus one we just *won't*."

  ### 4. Cluster Collisions
  **Question:** Let's talk about conflict. If I have a scientific cluster and a moral cluster, and they produce contradictory prescriptions, how do you decide which revision weight wins? Is there a meta-rule for weighing clusters against each other, or does it come down to pragmatic choice? If it's pragmatic, doesn't that make the 'analytic' status of the beliefs within them contingent on our current goals?

  **Follow-up (If she says resolving cluster conflict is future work):**
  "If the theory can't yet explain how clusters negotiate conflict, doesn't that leave the 'revision weight' arbitrary? Without a rule for cluster collision, couldn't someone claim *any* belief is 'softly analytic' just by isolating it in a cluster they refuse to revise?"

  ### 5. Meaning and Conceptual Change
  **Question:** Traditionally, analytic truths are true in virtue of meaning. If I revise a 'softly analytic' statement because of empirical pressure, does the *meaning* of the terms change, or do I just accept the statement is false? If the meaning changes, aren't we back to the traditional view that analytic statements are immune to evidence? If the meaning stays the same, how is this different from standard synthetic revision?

  **Follow-up (If she says the theory of meaning is downstream from the metaphysics):**
  "But Quine's attack was precisely that you can't separate the metaphysics from the meaning. If your research program postpones the theory of meaning, aren't you risking building a structure that Quine already argued is incoherent? How do you ensure your 'clusters' aren't just disguised definitions?"

  ### 6. The Philosophical Payoff
  **Question:** Finally, why does this matter for doing philosophy? If we accept your view, does it change how we handle traditional philosophical disputes, like free will or personal identity? Or is 'soft analyticity' mostly a technical fix for epistemology? I'm trying to understand if this changes how we argue, or just how we describe our arguing.

  **Follow-up (If she says the payoff is theoretical unity/coherence):**
  "Theoretical unity is great, but Quine promised us a naturalized epistemology that aligned with science. If your view is primarily a conceptual refinement that doesn't change our practice or predictions, are we solving a philosophical problem, or just optimizing a taxonomy? What's the real-world cost of sticking with Quine's web instead of your clusters?"
