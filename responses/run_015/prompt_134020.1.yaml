prompt: |-
  hey im running a podcast for my school philosphy club and next week im interviewing a philosopher who defends this idea she calls soft analyticities. she thinks quine was right that theres no sharp analytic synthetic line, but she rejects his big web-of-belief picture—she says beliefs cluster in little groups with different revision weights, so some statements are practically analytic within a cluster even if not globally so. i need like 6 interview questions that go past just asking her to explain. i want one pressing her on why quines web metaphor specifically breaks down, one on how mathematical truths sit inside these clusters, and one asking if her view just sneaks the old distinction back in through the back door. for each, include a follow-up keyed to her likely dodge—especially if she says thats just a research program not an objection. keep it real, not generic why philosophy stuff.
