  So there I am, Tuesday morning, stale biscuit, staring at a grant application. Dr. Szczepankowski. Brilliant project. Clear merit. My agent-relative duty as a panelist is straightforward: fund the best science.

  But I catch myself pausing. I'm having that one thought too many. I'm stepping back from the commitment to do an impartial calculation. I'm weighing the variables. Except... I realise I'm not calculating utility. I'm not even checking the budget codes.

  I'm counting the syllables in 'Szczepankowski' to see if it fits on the approval stamp without smudging the ink.

  Williams was right. It wasn't the utilitarianism that alienated me from my project. It was the stationery.
