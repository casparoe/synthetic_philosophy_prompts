answer: |-
  This is a sophisticated position. It resembles a hybrid of Priest's *Logic of Paradox* (LP) regarding truth, but with a pragmatic restriction on assertion closer to a gap view or a non-adjunctive system, plus a structural constraint on inference to prevent "infection" of classical domains.

  You asked for defeaters ranked from **Fatal** (the view cannot be coherently stated or sustains its own negation) to **Merely Awkward** (costly but survivable), focusing on internal coherence and explanatory utility rather than classical prejudice.

  Here is the ranking of threats to Contained Dialetheism.

  ---

  ### I. Fatal Defeaters (The View Cannot Be Stated or Sustained)

  **1. The Containment Conditional Dilemma (Curry's Revenge)**
  You identified this yourself, but it bears sharpening. To state your closure condition ("No valid inference takes you from glutty premises to classical conclusions"), you need a conditional in the meta-language that expresses this constraint. Let $G(x)$ mean "$x$ is glutty" and $C(x)$ mean "$x$ is classical." Your constraint is roughly: $\forall A, B ((G(A) \land (A \vdash B)) \to \neg C(B))$.

  *   **The Horns:**
      *   **If the conditional detaches (Modus Ponens):** You are vulnerable to Curry's Paradox within the meta-theory. Construct a sentence $K$ that says "If $K$ is true, then the containment fails." If your naive truth schema holds for the meta-language (required to state the theory), and your conditional allows contraction/detachment, you derive triviality *in the theory of containment*. The quarantine burns down.
      *   **If the conditional does not detach:** Then the statement of the closure condition loses its normative force. You can state "If glutty, then no classical conclusion," but you cannot *use* that fact to stop an inference. It becomes a descriptive observation rather than a logical barrier. If you cannot detach the safety guarantee, you haven't actually contained the explosion; you've just remarked upon it.
  *   **Why it's Fatal:** A dialetheic theory that cannot state its own consistency conditions without triviality is self-undermining. If you must weaken the conditional to avoid Curry, you likely weaken it enough that it cannot underwrite the "quarantine."

  **2. The Meta-Theoretic Collapse**
  To define the "isolated regions," you need a meta-language to draw the boundary.
  *   **If the Meta-Language is Classical:** You have conceded that there is a coherent, contradiction-free perspective from which the glutty world is viewed. This suggests the gluts are merely features of the object language, not reality itself. It collapses into a form of classical expressivism or error theory about the object language, undermining the ontological claim that "contradictions are true."
  *   **If the Meta-Language is Glutty:** Then the boundary itself is susceptible to gluts. The statement "This region is quarantined" might be both true and false. If the containment condition is a glut, then it is true that the containment holds *and* true that it fails. If it is true that it fails, explosion is possible. You cannot rely on a glutty fence to keep out a glutty virus.
  *   **Why it's Fatal:** You cannot occupy a "view from nowhere" to guarantee the containment. If the view is from within the glutty system, the guarantee is unstable.

  ---

  ### II. Severe Defeaters (The View Does No Work or Loses Normativity)

  **3. The Normative Vacuity of the True/Assertible Split**
  You propose that $A$ and $\neg A$ can both be true, but neither is assertible. This deviates from standard dialetheism (e.g., Priest), who argues we *should* assert true contradictions.
  *   **The Problem:** What is the function of the truth predicate if it is decoupled from assertion? In standard semantics, truth is the norm of assertion. If a sentence is true, *ceteris paribus*, one is licensed to assert it. By severing this link, you render the truth predicate inert.
  *   **The Dilemma:**
      *   If assertion tracks "Classical Truth" (True and Not False), then you are not a dialetheist about norms; you are a dialetheist only about a shadow predicate that does no practical work.
      *   If assertion tracks "Truth" (including gluts), you must assert contradictions, violating your own containment mechanism (since asserting a contradiction makes it part of the public, classical discourse).
  *   **Why it's Severe:** It turns your dialetheism into a semantic decoration. If the gluts make no difference to what we say, do, or infer, Occam's Razor suggests eliminating them in favor of gaps or epistemicism.

  **4. The Interaction/Permeability Problem**
  Language is not naturally partitioned into "glutty" and "classical" vocabularies. They mix via conjunction and disjunction.
  *   **The Scenario:** Let $L$ be the Liar (glutty) and $S$ be "Snow is white" (classical). Consider the conjunction $L \land S$.
  *   **The Leak:** Is $L \land S$ glutty?
      *   **If Yes:** Then by Simplification ($A \land B \vdash B$), if the inference is valid, does the "glutty status" transmit to $S$? You said no valid inference takes you to a classical conclusion. But if $S$ is a conjunct of a glutty truth, is $S$ still "wholly classical"?
      *   **If No:** Then you must deny Adjunction ($A, B \vdash A \land B$) when mixing domains. But this cripples ordinary reasoning. We constantly conjoin semantic claims with empirical claims ("The Liar is paradoxical and I am hungry").
  *   **Why it's Severe:** To maintain containment, you must restrict standard introduction/elimination rules for connectives across domain boundaries. This requires a complex, non-standard logic that makes ordinary mixed discourse (which is most discourse) logically fragile.

  ---

  ### III. Moderate Defeaters (Unfalsifiability and Expressive Limits)

  **5. The "No True Leak" Unfalsifiability**
  You asked: *If to every apparent leak I can reply that that region was glutty all along, is containment claiming anything at all?*
  *   **The Worry:** Suppose someone derives a contradiction in arithmetic (e.g., a new inconsistency in ZFC). A classical logician says "Math is broken." A global dialetheist says "Math is glutty." You say "Math was always a secretly glutty region."
  *   **The Defeater:** If the classification of a region as "classical" is revisable downward whenever a contradiction appears, the distinction between "classical" and "glutty" is not a discovery about the world, but a retrospective labeling convention. The containment hypothesis becomes unfalsifiable because any explosion is treated as evidence that the region was never classical to begin with.
  *   **Why it's Moderate:** It doesn't prove the view false, but it severely diminishes its explanatory power. It solves the problem of explosion by stipulation rather than mechanism.

  **6. The "Just True" Expressive Deficit**
  To maintain the split, you need to be able to say of classical propositions that they are "merely true" (true and not false) to distinguish them from the glutty ones.
  *   **The Problem:** In most paraconsistent logics (like LP), the "exclusion" negation (meaning "true and not false") is not expressible in the object language without re-introducing explosion or Curry. You can say $A$ is true, and you can say $A$ is false, but you cannot say "$A$ is *only* true" in a way that excludes the glut possibility from within the system.
  *   **Why it's Moderate:** You might be able to state this in the meta-language, but if you can't express the safety of classical domains *within* the discourse, agents within the system cannot verify they are in a safe zone.

  ---

  ### Summary: The Strongest Argument to Move You

  If I were to press one argument to move you off this view, it would be a combination of **Fatal #1 (The Containment Conditional)** and **Severe #3 (Normative Vacuity)**.

  **The Argument:**
  To make the containment work, you need a logic that governs the boundary. If that logic is strong enough to enforce the quarantine (detachable conditional), it is strong enough to generate Curry paradoxes *about the quarantine itself*, leading to triviality. If you weaken the logic to avoid Curry, the quarantine becomes inert—it describes a boundary it cannot enforce.

  Simultaneously, by rendering gluts unassertible, you sever the link between truth and rational commitment. If the "true contradictions" cannot be asserted, believed, or used in inference to classical domains, they are causally and normatively inert. A truth predicate that guides no action and licenses no assertion is indistinguishable from a fictional operator. You are left with a view that says "Contradictions are *true*," but behaves exactly as if they are *false* (or neither). At that point, the label "dialetheism" is doing no work; you are effectively an epistemicist or a gap theorist who uses the word 'true' in a non-standard way.

  **What would move you:**
  You should abandon the view if you cannot provide a **non-trivial, detachable conditional** for the meta-language that defines the containment, *and* if you cannot provide a **normative account** of why we should care about a truth predicate that does not license assertion. If the cost of containment is losing the ability to state the containment or losing the normative force of truth, the containment is too expensive.
