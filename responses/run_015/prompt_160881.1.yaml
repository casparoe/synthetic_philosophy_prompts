answer: |-
  ### Brainstorm: Pairwise Frictions

  Before ranking, here is the matrix of conflicts I see in your eight points. I'm treating these as logical or normative collisions, not just thematic overlaps.

  *   **3 (Condorcet) vs. 4 (Borda):** Borda is not Condorcet-consistent. You can have a CW and Borda picks someone else.
  *   **3 (Condorcet) vs. 7 (Participation):** Moulin's Theorem (1988). No Condorcet-consistent rule satisfies the Participation Criterion.
  *   **4 (Borda) vs. 5 (No-Spoilers):** Borda fails Clone Independence and is susceptible to "teaming" (adding similar candidates changes scores disproportionately). Your definition in 6 is too narrow to cover the intuitive spoiler cases in 5.
  *   **1 (No Collective Will) vs. 3 (Condorcet):** 3 presupposes a majoritarian "will" exists when a CW exists. 1 disavows the "will" concept entirely.
  *   **1 (Cycles OK) vs. 2 (Agenda Pathology):** Agenda dependence in sequential voting *is* the operational manifestation of cycles. If cycles are fine in hiring (1), they should be theoretically acceptable in motions (2), unless you assume domain restrictions (e.g., single-peakedness) for meetings but not hiring.
  *   **2 (Issue-by-Issue Majority) vs. 2 (No Agenda Dependence):** You cannot have sequential majority voting on related issues *and* agenda independence without restricting the preference domain.
  *   **4 (Borda) vs. 8 (0 First-Place Votes):** Borda can elect a candidate with zero first-place votes. You defend the rule (4) but worry about the outcome (8).
  *   **5 (No-Spoilers) vs. 6 (Rank-Robustness):** 6 is a subset of IIA. It does not prevent the spoiler effects you dislike in 5 (e.g., clone entry). You think 6 solves 5; it does not.
  *   **8 (Consensus) vs. 3 (Majoritarian):** You defended a Borda winner over a CW (8), which violates 3. You are normatively split between utilitarian consensus and majoritarian rights.

  ---

  ### Audit of Tensions: Ranked by Severity

  Here is the ordering of conflicts from "Mathematically Fatal" to "Normatively Uncomfortable."

  #### 1. The Moulin Constraint (3 vs. 7)
  **Severity:** Fatal (Impossibility Theorem)
  **The Conflict:** You want Condorcet consistency (3) and Participation (7). Moulin (1988) proves these are mutually exclusive. Any rule that guarantees the Condorcet Winner (when one exists) will exhibit the No-Show Paradox (voters ranking $x$ first can make $x$ lose by participating).
  **What Must Give:** You must drop either Condorcet consistency or Participation.
  **Cost:**
  *   *Drop Participation:* You risk incentivizing abstention in a department where turnout is already low. This is politically dangerous.
  *   *Drop Condorcet:* You lose the "straightforwardly majoritarian" guarantee. You admit that sometimes the pairwise majority winner loses.
  **Recommendation:** Given your context (low turnout, departmental politics), **drop 3**. Participation is more critical for institutional stability than Condorcet consistency.

  #### 2. The Methodological Contradiction (3 vs. 4 vs. 8)
  **Severity:** Fatal (Logical Inconsistency)
  **The Conflict:** You endorse Borda (4), you endorse Condorcet (3), and you admit to defending a Borda winner who lost to the CW (8). You cannot hold all three. Borda fails the Condorcet Criterion.
  **What Must Give:** You must choose between the Positional approach (Borda) and the Majoritarian approach (Condorcet).
  **Cost:**
  *   *Keep Borda (Drop 3):* You accept that intensity of preference matters more than pairwise dominance. You lose the "majority rule" moral high ground.
  *   *Keep Condorcet (Drop 4):* You must switch to a rule like Ranked Pairs or Schulze. You lose the simplicity and "full ballot" utilization of Borda, and you trigger the Moulin conflict with 7 (see above).
  **Recommendation:** **Drop 3.** Your Principle 1 ("Arrow kills... collective preference ordering") aligns better with Borda (a social welfare function aggregator) than Condorcet (which seeks a specific majoritarian relation). You are smuggling a majoritarian intuition into 3 that contradicts your formalist stance in 1.

  #### 3. The Spoiler Illusion (4 vs. 5 vs. 6)
  **Severity:** High (Conceptual Error)
  **The Conflict:** You hate spoilers (5). You think your "Rank-Robustness" condition (6) solves this for Borda (4). It does not. Condition 6 only covers candidates ranked *below* $x$ by *everyone*. Real spoilers (clones, spoilers who split the vote) are ranked *above* the bottom by some voters. Borda is notoriously vulnerable to cloning (adding a candidate similar to $x$ increases $x$'s "team" score).
  **What Must Give:** You must admit Borda does not solve the spoiler problem.
  **Cost:** You lose the claim that your rule is "spoiler-proof." You have to manage spoilers via *candidate screening* (the shortlist process) rather than the voting rule itself.
  **Recommendation:** Revise 5 and 6. Acknowledge that no positional rule is immune to strategic entry (cloning). Shift the burden of "spoiler control" to the committee that sets the shortlist, not the ballot aggregation rule.

  #### 4. The Agenda Asymmetry (1 vs. 2)
  **Severity:** Medium (Theoretical Incoherence)
  **The Conflict:** In 1, you accept cycles as "fine" because there is no collective will. In 2, you call agenda dependence a "pathology." But agenda dependence in sequential majority voting (Robert's Rules) is caused by cycles (McKelvey's Chaos Theorem). If cycles are ontologically acceptable in hiring, they should be in meetings, unless you assume preferences are single-peaked in meetings but not in hiring.
  **What Must Give:** Align your tolerance for path dependence.
  **Cost:**
  *   *Align with 1:* Accept that meeting outcomes are contingent on agenda setting. This weakens the legitimacy of business meetings.
  *   *Align with 2:* You must impose structure on meeting preferences (e.g., germaneness rules, restricting amendments) to ensure single-peakedness.
  **Recommendation:** **Clarify 2.** Specify that agenda dependence is a pathology *only when issues are logically connected*. If you treat motions as independent, majority rule is fine. If they are connected, you need a structured agenda (like a tree) to avoid cycles. Don't blame the rule; blame the lack of domain structure.

  #### 5. The Legitimacy Ambivalence (8)
  **Severity:** Low (Normative Tension)
  **The Conflict:** You defended a winner with 0 first-place votes (Borda) but also said such a winner is "nobody wanted." These are conflicting legitimacy claims (Consensus vs. Plurality).
  **What Must Give:** Commit to a theory of legitimacy.
  **Cost:**
  *   *Consensus:* Accept that a "compromise" candidate is better than a "polarizing" majority favorite.
  *   *Plurality:* Require a minimum threshold of first-place support.
  **Recommendation:** **Resolve 8 in favor of Consensus.** If you choose Borda (as suggested above), you are explicitly choosing a utilitarian/consensus metric over a majoritarian one. A candidate who is everyone's 3rd choice is often more stable for a department than someone who is 51%'s 1st choice and 49%'s last. Own this. Delete the "nobody wanted" claim; replace it with "no intense opposition."

  ---

  ### False Inconsistencies (The "Don't Worry" List)

  *   **1 vs. 3 (Mostly):** While I flagged this above, it's not a *logical* contradiction to say "No collective ordering exists generally" but "If a CW exists, pick them." However, it is a *theoretical* inconsistency. If you deny the "will of the department" in 1, relying on the CW in 3 smuggles the "will" back in through the back door. It's not a formal impossibility, but it weakens your memo's philosophical backbone.
  *   **6 (Rank-Robustness):** You asked if this is two claims. It is. It is a specific, weak version of IIA. It is consistent with Borda. The error is thinking it satisfies 5. It satisfies *itself*, but not the intuitive "Spoiler" condition you care about.

  ---

  ### The Single Revision

  If you make one change to clean up the memo, do this:

  **Drop Principle 3 (Condorcet) and reframe Principle 8 (Legitimacy).**

  **Why:**
  1.  **Mathematical Survival:** Dropping Condorcet resolves the Moulin conflict with Participation (7). You keep the rule usable (people show up).
  2.  **Theoretical Coherence:** It aligns with Principle 1. If there is no "collective will," there is no obligation to obey a pairwise majority winner. Borda is a function mapping profiles to outcomes, which fits your functionalist view in 1.
  3.  **Normative Clarity:** It forces you to resolve 8. If you drop Condorcet, you must defend the Borda winner (the consensus candidate) as *superior* to the CW (the majority candidate), not just as a fallback.

  **What You Lose:**
  You lose the ability to say "The majority preferred X." In a faculty hiring context, this is significant. If 51% of the department strongly prefers Candidate A and 49% strongly prefers Candidate B, Borda might pick B if the 49% rank B 1st and A 5th, while the 51% rank A 1st and B 2nd.
  *   *The Cost:* You risk alienating the majority faction.
  *   *The Mitigation:* Add a **majority threshold** to the shortlist process (not the voting rule). Ensure the shortlist only contains candidates acceptable to a majority. Then use Borda to select the *best* among the *acceptable*.

  **Revised Principle Set (Summary):**
  1.  **Functionalist:** Rules map profiles to outcomes; cycles are possible and acceptable.
  2.  **Agenda:** Agenda dependence is a pathology *only* for logically connected motions; otherwise, majority rule suffices.
  3.  **Deleted.** (Condorcet removed).
  4.  **Positional:** We use Borda to utilize intensity information.
  5.  **Spoiler Management:** Spoilers are managed via shortlist screening, not the voting rule (acknowledging Borda's vulnerability to cloning).
  6.  **Deleted.** (Merged into 5).
  7.  **Participation:** The rule must not penalize turnout (satisfied by Borda).
  8.  **Consensus Legitimacy:** A winner with broad support (high average rank) is preferred to a winner with intense but narrow support (first-place votes only).

  This leaves you with a coherent, Borda-based system that prioritizes departmental stability (Participation) and consensus (Borda) over majoritarian dominance (Condorcet), which fits a hiring context where the winner must work with the losers for decades.
