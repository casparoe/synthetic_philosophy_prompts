      *   *Idea 8: Utility depends on the *match* between belief and state.* (e.g., Surprise parties). If I know, I ruin the surprise. But that's usually modeled as the signal changing the outcome (Constraint 5 violation) or stipulating utility loss (Constraint 6 violation).
      *   *Idea 9: The "Fixed Rule" Loophole.* Constraint 1 allows "fixed institutional rule that triggers on what someone knows." This is the key. Good's theorem assumes the agent chooses the action *after* the signal. If a rule *forces* an action based on the signal (or the credence derived from it), the agent loses the option to ignore the signal *in terms of action selection*, even if they received it for free.
