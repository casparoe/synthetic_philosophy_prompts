answer: |-
  Here is the case, the arithmetic, and the dissection you asked for. It is designed to fit on one side of a handout and survive the coffee-break grilling.

  ### The Case: The Mandatory Safety Protocol

  **Setting:** A chemical plant. You are the shift supervisor.
  **State:** The pressure valve is **Faulty (F)** or **OK (O)**.
  **Action:** **Run (R)** the shift or **Shutdown (S)** for maintenance.
  **Institutional Rule:** Safety Regulation 12-B states: *"If a supervisor observes a Positive Test (Pos), they **must** Shutdown. They are not authorized to Run."* (If Test is Negative, they are free to choose).
  **Utility:** Defined over profit/safety outcomes.
  *   Run & OK: +$20k (Profit)
  *   Run & Faulty: -$100k (Explosion)
  *   Shutdown (any state): -$20k (Delay cost)

  **Prior:** $P(F) = 0.1$.
  **Signal:** A pressure gauge check. Cost = $0.
  **Accuracy:** Perfect at detecting faults ($P(Pos|F) = 1.0$), but noisy on OK valves ($P(Pos|O) = 0.5$).

  **Blackboard Tables:**

  | State | Prior | P(Pos | State) | P(Neg | State) |
  | :--- | :--- | :--- | :--- |
  | **Faulty (F)** | 0.1 | 1.0 | 0.0 |
  | **OK (O)** | 0.9 | 0.5 | 0.5 |

  | Action | State F | State O |
  | :--- | :--- | :--- |
  | **Run (R)** | -100 | +20 |
  | **Shutdown (S)** | -20 | -20 |

  ---

  ### The Calculation

  **1. Ex-Ante (No Signal):**
  *   $EU(R) = 0.1(-100) + 0.9(20) = -10 + 18 = \mathbf{+8}$.
  *   $EU(S) = -20$.
  *   **Optimal Act:** Run. **Value:** +8.

  **2. Ex-Post (With Signal):**
  *   **Prob of Positive:** $P(Pos) = (1.0 \times 0.1) + (0.5 \times 0.9) = 0.1 + 0.45 = \mathbf{0.55}$.
  *   **Prob of Negative:** $P(Neg) = \mathbf{0.45}$.
  *   **If Positive:** Rule 12-B forces **Shutdown**. Payoff = **-20**. (You cannot Run, even though you might want to).
  *   **If Negative:** Since $P(Pos|F)=1$, a Negative result implies $P(F|Neg) = 0$. State is definitely OK.
      *   $EU(R|Neg) = +20$.
      *   $EU(S|Neg) = -20$.
      *   **Optimal Act:** Run. Payoff = **+20**.
  *   **Total EU with Info:** $(0.55 \times -20) + (0.45 \times 20) = -11 + 9 = \mathbf{-2}$.

  **Verdict:** The expected value of the free information is **-10** ($ -2 - 8 $). You are strictly better off remaining ignorant.

  ---

  ### The Diagnosis

  **Which premise of Good's Theorem fails?**
  Good's Theorem relies on the assumption that **the set of actions available to the agent after observing the signal includes the action that was optimal before observing the signal.** Formally, if $A$ is the action set, the theorem assumes $A_{post} \supseteq A_{pre}$. Specifically, it assumes the agent can always choose to *ignore* the information and act as if they hadn't seen it.

  In this case, Regulation 12-B removes that option. When the signal is Positive, the action "Run" (which was optimal ex-ante) is removed from the feasible set. The information does not just update beliefs; it triggers a fixed constraint that contracts the action space.

  **What room is left once the six constraints are in place?**
  Given your constraints (no game theory, no costs, no demons), the *only* available route to a violation is to decouple the **epistemic state** from the **deontic authority**. You must introduce a fixed rule where *knowing* imposes an obligation that *not knowing* does not. The "room" is the gap between *physical possibility* (I can physically press the Run button) and *institutional permission* (I am allowed to). Good's theorem models physical possibility; real-world rationality often operates within institutional permission.

  **Sensitivity Analysis:**
  If you delete the feature doing the work (Regulation 12-B), the case collapses back into a confirmation of the theorem. Without the mandate, upon seeing "Positive," the agent calculates $EU(R|Pos)$ vs $EU(S|Pos)$.
  *   $P(F|Pos) = 0.1 / 0.55 \approx 0.18$.
  *   $EU(R|Pos) = 0.18(-100) + 0.82(20) = -1.6$.
  *   $EU(S|Pos) = -20$.
  *   The agent freely chooses **Run**.
  *   New EU with Info: $(0.55 \times -1.6) + (0.45 \times 20) = -0.88 + 9 = +8.12$.
  *   $+8.12 > +8$. Theorem restored. The negative value was entirely generated by the loss of the option to ignore the signal.

  ---

  ### The Objection (What the "Airtight" Defender Says)

  A defender of Good's Theorem will claim: **"This was never a case the theorem was about."**

  They will argue that Good's Theorem applies to a *free* expected-utility maximizer. By binding the agent to Regulation 12-B, you have ceased to model a free agent and have instead modeled a *constrained* optimization problem. They will say the theorem holds for the *principal* who wrote the rule (if the rule is optimal), or that the "agent" in the theorem is defined as having sovereignty over their action map.

  **Is this principled or rhetorical?**
  It is **principled**, but only if one accepts a narrow definition of "agent."
  *   **Rhetorical:** If "agent" just means "entity making a choice," the theorem fails here.
  *   **Principled:** If "agent" in the theorem is *defined* as an entity whose available actions are independent of their information state, then this case is outside the domain of the theorem.

  However, this defense concedes the practical point: in almost all real-world contexts (law, medicine, engineering), action sets *are* conditioned on information (licensing, liability, protocols). Therefore, while the theorem may be mathematically true for a "sovereign" agent, it is **normatively inert** for an institutional agent. The "cheat" is not in my case; it is in the theorem's assumption that knowledge never restricts permission.

  ---

  ### The Restated Theorem (For the Problem Sheet)

  > **Theorem (Good, Revised):** For a Bayesian agent with a fixed utility function over outcomes, the expected utility of acting after observing a free signal is at least as high as the expected utility of acting without the signal, **provided that the set of actions feasible after observing the signal is a superset of the actions feasible before observing the signal.**
  >
  > *Corollary:* Free information has negative value if acquiring it triggers institutional constraints that remove the ex-ante optimal action from the feasible set.

  **Convention vs. Substance Flag:**
  The answer depends on the convention of how we define **"Outcome."**
  *   If "Outcome" includes *legal liability* (e.g., "Explosion + Negligence Suit" vs "Explosion + Accident"), then the utility function changes based on information ($U(o, info) \neq U(o)$). In this framing, Good's Theorem fails because the utility function is not fixed over *world states* alone.
  *   If "Outcome" is purely physical (Explosion vs. No Explosion) and the Rule is a *constraint*, then Good's Theorem fails because the *action set* is not fixed.
  *   **Substance:** Either way, the result holds. The convention only changes whether we say the **Utility Function** violated the premises (by being knowledge-dependent) or the **Action Set** violated the premises (by being knowledge-constrained). For the purposes of your seminar, the **Action Set** explanation is cleaner, as it keeps the utility function over ordinary physical outcomes, satisfying Constraint 6 more robustly.
