prompt: |-
  Hi — hope the term's treating you ok. I'm putting together Thursday's session of my rational choice seminar (third week, we've just finished the Savage-style setup and the little result people call Good's theorem — free information can't hurt an expected-utility maximizer) and I want to open with a case that makes the theorem sweat a bit. Every year my students come out of that lecture thinking the thing is basically a tautology, and every year one of them — this time a first-year who has read way to much decision theory for his own good — announces that any apparent counterxample must be a modelling trick: you've smuggled in a second agent, or a non-Bayesian updater, or a hidden cost. We were still arguing about it over coffee after the department seminar, and I said I'd try to produce a case they can't wave off like that. So help me out.

  Build me a case in which an agent who is a scrupulous expected-utility maximizer with a fixed utility function over ordinary outcomes, who updates by conditionalization, pays nothing for a signal and is free to act on it however she likes, is nonetheless strictly better off declining it — the expected value of the free information is negative. Constraints, because I know the cheap moves: (1) one agent only, and no other agent's strategy may adapt to the signal, so all the familiar game- and market-theoretic "more information can hurt" cases are out — though if you want to lean on a fixed institutional rule that triggers on what someone knows, you have to tell me why that isn't a second agent in disguise; (2) genuinely free — no acquisition cost, no risk of being found out, no attention cost, no opportunity cost of time; (3) no demons, no perfect predictors, no unbounded or infinite utilities, no St Petersburg business, no infinite state spaces; (4) realistic — a ward, a hiring committee, a lab, a conservatory, a court, whatever you like — and one paragraph, with P(s) and P(m|s) in tables small enought to copy onto a blackboard; (5) the signal has to be an ordinary signal: the mechanism that produces it changes nothing in the world except what the agent believes. And (6), the one I actually care about: the negative value can't be stipulated. I don't want "and she'd rather not know" or "and knowing ruins it for her" entered straight into the utility function as a bare placeholder; whatever does the work has to be something I'd recognize in ordinary life and could argue for independently of the verdict I asked you to produce.

  Then do the work, because that's what I'll put on the handout: run the numbers and check the value really is negative; tell me which single premise of Good's theorem fails in your case and argue that it fails while the others still hold; tell me what room is left once my six constraints are in place — i.e., what the only available route to a violation is; say what happens if I delete the feature that's doing the work (does the case collapse back into a boring confirmation of the theorem?); and then, most useful for me, tell me what someone who thinks the theorem is airtight gets to say about your case — can they honestly claim it was never a case the theorem was ever about, and is there a principled difference between that move and cheating, or only a rhetorical one? Finish with the restated version of the theorem you'd actually put on the problem sheet: the formulation that's true without being empty. If it survives all that I'll probably steal it for the exam, so flag anywhere the answer depends on a convention rather than on substance.
