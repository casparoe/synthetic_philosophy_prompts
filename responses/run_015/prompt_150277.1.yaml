  2.  **Deconstruct Good's Theorem:**
      *   *Statement:* For a Bayesian agent with a fixed utility function over outcomes, the expected utility of acting *after* observing a free signal is at least as high as the expected utility of acting *without* the signal.
      *   *Key Assumptions:*
          1.  Agent maximizes Expected Utility (EU).
          2.  Agent updates via Conditionalization (Bayes' Rule).
          3.  Information is free (no cost subtracted from utility).
          4.  **Crucial:** The agent can *ignore* the information. (The action set available after the signal includes the action chosen without the signal).
          5.  **Crucial:** The utility function is defined over *final outcomes*, and the signal itself does not change the utility function or the causal structure of the world *except* through the agent's action.
          6.  **Crucial (often hidden):** The agent's action affects the outcome *causally*. There is no "Newcomb-like" correlation where the signal predicts the state *because* it predicts the agent's action, or where the state is fixed independently but the utility depends on the *relation* between belief and state in a way that violates the "act-state independence" or "value of information" structure.

