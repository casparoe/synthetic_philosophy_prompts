      *   The Coffee Taster case is designed to show that the *judgment* about whether the experience changed or the preference changed is indeterminate.
      *   Crucially, Dennett targets the *phenomenological ontology*, not necessarily the *functional implementation*. He argues that even if we know everything about the brain, the question "Did the *qualia* change?" remains ill-posed because "qualia" (as traditionally defined) don't exist.
      *   The "hidden variable" Dennett claims is absent is not a neural state, but a *fact of the matter* about the subjective feel independent of functional/behavioral dispositions.

