          *   Dennett's Point: There is no behavioral or functional way to distinguish these reports definitively. Therefore, the distinction between "qualia change" and "preference change" is illusory. Qualia are "quined" (eliminated).
      *   **User's Hypothesis:** Predictive Processing (PP) / Hierarchical Bayesian models offer a mechanistic distinction.
          *   Chase: Updates prior for "good coffee" (preference/value layer).
