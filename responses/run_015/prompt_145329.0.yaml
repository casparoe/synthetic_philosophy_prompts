      *   If the user defines "qualia" as "the *feeling* of that state," Dennett asks, "What is the feeling over and above the functional role?"
      *   The "Hard Problem" lurks here. PP explains the *function* of discrimination, not necessarily the *phenomenology*.
      *   **The User's Self-Doubt is Key:** They suspect they might be smuggling in the mistake. They are likely correct. Identifying a neural mechanism doesn't automatically grant ontological status to "intrinsic feels."

