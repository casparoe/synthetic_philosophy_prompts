  DIAGNOSTIC TREE: THE LOGICAL SPACE OF QUALIA
  Start: We agree that ordinary claims like "The coffee tastes bitter to me" are meaningful and not simply mistakes.

  1.  **The Sorites Case:** In a 500-step gradual spectrum inversion, where each step is indiscriminable from the last, is there a specific step where the subjective experience *actually* changes, even if the subject cannot detect it?
      *   **YES** (Experience has precise intrinsic boundaries) → Go to 2.
      *   **NO** (Experience is vague or defined by relations) → Go to 11.

  2.  **The Absent Qualia Case:** Is a molecule-for-molecule functional duplicate of a human possible who lacks experience entirely?
      *   **YES** (Consciousness does not supervene on function) → Go to 3.
      *   **NO** (Consciousness is fixed by physical/functional structure) → Go to 7.

  3.  **The Inverted Qualia Case:** Given that zombies are possible, can the specific quality of experience (e.g., red vs. green) vary while functional organization remains fixed?
      *   **YES** (Function fixes existence, not quality) → Go to 4.
      *   **NO** (Function fixes quality, but not existence) → **Leaf A**.

  4.  **The Russellian Case:** Is the intrinsic nature of experience the categorical basis that grounds physical causal powers?
      *   **YES** (Experience is the "inside" of physics) → Go to 5.
      *   **NO** (Experience is distinct from physical causal basis) → **Leaf B**.

  5.  **The Causal Power Case:** Does experience exert causal influence *over and above* the physical structure it grounds?
      *   **YES** (Experience pushes physics) → **Leaf C**.
      *   **NO** (Experience is the structure's intrinsic face only) → **Leaf D**.

  6.  *(Unused placeholder for tree balance)*

  7.  **The Inverted Qualia Case (Physicalist):** Given that zombies are impossible, can the specific quality of experience vary while functional organization remains fixed?
      *   **YES** (Structure fixes existence, not quality) → **Leaf E**.
      *   **NO** (Structure fixes quality and existence) → **Leaf F**.

  8.  *(Unused placeholder for tree balance)*

  9.  *(Unused placeholder for tree balance)*

  10. *(Unused placeholder for tree balance)*

  11. **The Relation-Swap Case:** If we swap all memories and reactions to a taste but stipulate the "taste itself" remains identical, is this a coherent description?
      *   **YES** (Experience is intrinsic but vague) → Go to 12.
      *   **NO** (Experience is constituted by reactions/dispositions) → Go to 13.

  12. **The Vagueness Case:** Is the boundary of the "taste itself" sharp or inherently vague?
      *   **SHARP** (There is a fact we just can't grasp) → **Leaf G**.
      *   **VAGUE** (The concept itself is indeterminate) → **Leaf H**.

  13. **The Disagreement Case:** If two subjects match on all discrimination tasks but permanently disagree on what the experience is like, is one mistaken?
      *   **YES** (There is an objective fact about the feeling) → Go to 14.
      *   **NO** (The disagreement is merely verbal or subjective) → **Leaf I**.

  14. **The Illusion Case:** Does introspection present experience as having intrinsic properties that it does not actually have?
      *   **YES** (The "inner glow" is a misrepresentation) → **Leaf J**.
      *   **NO** (Introspection is veridical about dispositions) → **Leaf K**.

  15. *(Unused placeholder for tree balance)*

  16. *(Unused placeholder for tree balance)*

  --------------------------------------------------------------------------------
  LEAVES (POSITIONS)

  Leaf A: **Binary Consciousness Realist**
  *Commitment:* Consciousness is an all-or-nothing property fixed by function, but its existence is not guaranteed by function.
  *Awkwardness:* Must explain why function fixes quality but not existence without invoking dualism.

  Leaf B: **Primitivist Realist (Property Dualist)**
  *Commitment:* Experience is an intrinsic, non-physical property that can vary independently of function.
  *Awkwardness:* Must accept causal exclusion or overdetermination of physical events by experience.

  Leaf C: **Interactionist Dualist**
  *Commitment:* Experience is intrinsic and exerts unique causal power over physical states.
  *Awkwardness:* Commits to violations of physical conservation laws or closure.

  Leaf D: **Russellian Monist**
  *Commitment:* Experience is the intrinsic nature of physical states, grounding their causal powers without adding new forces.
  *Awkwardness:* Must explain why we don't attribute experience to simple particles (panpsychism) or how it combines (combination problem).

  Leaf E: **Non-Reductive Physicalist (Type-B)**
  *Commitment:* Experience is physically necessitated but conceptually distinct; absent qualia impossible, inverted qualia possible.
  *Awkwardness:* Must accept brute psychophysical laws that are not explainable by functional analysis.

  Leaf F: **Reductive Physicalist (Representationalist)**
  *Commitment:* Experience is identical to functional/representational states; neither absent nor inverted qualia are possible.
  *Awkwardness:* Must explain away the intuition that function could exist without feeling (the "hard problem").

  Leaf G: **Phenomenal Concept Realist**
  *Commitment:* Experience is real and intrinsic, but our concepts of it are vague, explaining the Sorites failure.
  *Awkwardness:* Risks collapsing into epistemic humility about ontology rather than a positive theory.

  Leaf H: **Vague Phenomenal Realist**
  *Commitment:* Experience itself is an ontologically vague property, not just our concepts of it.
  *Awkwardness:* Commits to metaphysical vagueness, which many find incoherent in fundamental reality.

  Leaf I: **Quietist (Verbal Dispute)**
  *Commitment:* There is no fact of the matter; the debate is over which concept the word "experience" picks out.
  *Awkwardness:* Cannot satisfy the intuition that there is a genuine phenomenon being discussed, only language.

  Leaf J: **Illusionist**
  *Commitment:* There is a "what it's like" that seems intrinsic, but this is an introspective illusion produced by non-phenomenal states.
  *Awkwardness:* Must explain how a non-phenomenal state can seem phenomenal without begging the question.

  Leaf K: **Dennett-Style (Heterophenomenologist)**
  *Commitment:* Experience is real but exhaustively defined by relational, extrinsic facts about what a subject is disposed to say and do.
  *Awkwardness:* Denies the authority of the first-person perspective regarding the *nature* of the experience.

  --------------------------------------------------------------------------------
  POST-TREE ANALYSIS

  1.  **Inseparable Leaves:** **Leaf J (Illusionist)** and **Leaf K (Dennett-Style)** are often indistinguishable in practice. Both deny that experience has the intrinsic, ineffable properties introspection seems to reveal. The distinction rests on whether one calls the resulting state an "illusion" (J) or a "relational fact" (K). This is largely rhetorical: both camps agree the traditional "qualia" posit is false, but differ on whether to preserve the vocabulary of "seeming" (J) or replace it with "disposition" (K).

  2.  **Unoccupied Space:** **Leaf A (Binary Consciousness Realist)** is logically possible but virtually unoccupied. It claims function fixes *what* you feel but not *that* you feel. This is unattractive because it severs the link between structure and existence without the payoff of dualism (Leaf B). It posits a "switch" for consciousness that is functionally determined but ontologically contingent, which looks like an ad hoc solution to save physicalism from zombies while denying inversion.

  3.  **Least Trustworthy Branch:** **Node 1 (The Sorites Case)** is the most contentious load-bearing distinction. It presupposes that experience *has* steps or boundaries that could be sharp or vague. A hardline Primitivist might reject the premise, arguing that experience is atomic and not subject to gradual shift, while a Quietist might argue the question itself is malformed. If the profession converged on the view that "phenomenal concepts" are the only source of the Sorites paradox (denying ontological vagueness), Node 12 would collapse, merging Leaf G and Leaf H, and potentially forcing a redraw of the Anti-Realist branch to focus on conceptual analysis rather than ontological vagueness.
