      *   *Critique Point 1 (Fidelity):* Does this misrepresent Hofstadter? Hofstadter cares about the *mapping* process. If the user says "holding constant is the act," Hofstadter might say "holding constant is the *result* of perceiving deep structure." The distinction is subtle.
