      *   **Outcomes:** Either the problem dissolves (success) or it persists even for finite agents (failure/nuance).
      *   **Feasibility/Risks:** Acknowledge that meta-ethics is hard. Acknowledge that "finite agency" might not solve *axiological* questions.

