          *   *Consensus vs. Contested:* It is *contested* whether ethics must be action-guiding for finite agents. Some argue ethics evaluates states of affairs independently of our ability to affect them.
      *   *Synthesis:* The strongest angle for a high schooler is to combine these: If ethics is action-guiding for finite agents, does the "infinite ethics problem" dissolve? This shifts the burden from "how to sum infinity" to "why we think we need to sum infinity."

