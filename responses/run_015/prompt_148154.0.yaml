          *   *Risk:* This is a massive meta-ethical claim. Most infinite ethics literature *assumes* welfarist aggregativism. Challenging this is challenging the foundation of the field, not just solving a puzzle within it. This might be too big for 15 weeks.
          *   *Consensus vs. Contested:* It is *contested* whether morality is aggregative. Many infinite ethicists accept aggregativism as a constraint to see if it breaks. The user needs to acknowledge they are stepping outside the standard paradigm.
      *   *Idea 2 (Finite Agent):* "No actual agent ever faces an infinite quantity."
