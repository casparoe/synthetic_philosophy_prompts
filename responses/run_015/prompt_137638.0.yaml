      Okay, ready to write. The "Cheapest Fix" is usually modifying the strongest-sounding claim (1) to be more conditional.

      *Wait, one nuance:* The user says "I have a feeling it doesn't [hang together] but I cant locate the crack."
      The crack is definitely Claim 1. It asserts a hierarchy that Claims 2, 3, and 6 dismantle.
      If Reference Classes are subjective (2) and Empire data is bogus (3) and Tech makes history obsolete (6), then Outside View *cannot* dominate in Geopolitics. It can only *inform*.
