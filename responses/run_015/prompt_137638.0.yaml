          *   *Fix:* Refine 1. Outside view sets the *anchor*, but inside view (mechanisms) can move it significantly *if* the mechanism is strong. Or, acknowledge that "unprecedented" implies a broken reference class, triggering Claim 5 or 6.

      *   **Tension C: Analogy vs. Reference Class (7 vs. 2).**
