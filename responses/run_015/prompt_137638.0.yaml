  5.  **Drafting the Response:**
      *   *Tone:* Direct, analytical, respectful of the nuance. No fluff.
      *   *Structure:*
          1.  Verdict (Is it stable?).
          2.  Critical Tension (The "Crack").
          3.  High Severity Tension (The Black Swan).
          4.  Medium Severity Tension (The Analogy).
          5.  Apparent Tensions (Dissolved).
