      *   *Refining the "Critical Tension" (1 vs 2/3):* The user says Outside View should dominate (1), but then spends three points (2, 3, 6) listing conditions where it fails or is manipulable. The talk will sound like "Do X, but X is broken, so don't do X."
      *   *Solution:* Reframe Outside View not as a *calculator* but as a *discipline*. It's not about the number it gives, but the check it provides against the Inside View.
      *   *Refining the "Black Swan" (1 vs 4):* The 1988 USSR example is the killer. Base rate of Great Power collapse is tiny. 5-10% is huge. This requires Inside View dominance.
      *   *Solution:* The "Outside View" isn't just "history stats." It's "what do we know about similar structural stresses?" But the user explicitly says in 3 that for empires, this doesn't work. So, for Geopolitics/Empires, the Inside View *must* dominate, contrary to Claim 1.
      *   *Refining the "Analogy" (7 vs 2):* Analogy *is* reference class selection. If 2 warns against laundering, 7 admits to the practice.
      *   *Solution:* Distinguish "Single Analogy" (bad) from "Analogical Reasoning" (good for mechanisms).

  6.  **Final Review against Constraints:**
      *   Rank tensions by severity? Yes.
      *   Tell which commitment to drop/modify? Yes.
      *   Tell cost of giving it up? Yes.
      *   Explain apparent inconsistencies? Yes.
      *   No citations/reading recs? Yes.

  7.  **Self-Correction during drafting:** I need to make sure I don't just tell them to "balance it." I need to tell them which specific claim needs to bend. Claim 1 is the weakest link. It's too dogmatic ("should dominate") given the sophisticated caveats in 2, 3, and 6. Claim 1 needs to become a "starting point" not a "dominant force."

      Also, the audience includes historians who will hate it. The historians will attack Claim 3 (individuation) and Claim 1 (reductionism). The forecasters will attack Claim 5 (refusing to number) and Claim 4 (arbitrary 5-10%). I should mention how the tension affects the reception.

      Let's organize the "Real Tensions" vs "Apparent Tensions."

      *Real:*
      1.  Dominance vs. Fragility (1 vs 2/3).
