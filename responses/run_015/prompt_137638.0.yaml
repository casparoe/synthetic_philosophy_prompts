          *   *Fix:* Distinguish between *generative* analogies (finding mechanisms) vs. *predictive* analogies (assigning probabilities). Claim 7 says "best calls come from..." but Claim 1 says "outside view dominates." Need to clarify that analogies inform the *inside* view which adjusts the outside view, not replaces it.

      *   **Tension D: One-off Probabilities vs. Frequency (8 vs. 3).**
