  $$ 0.80 \times 0.45 \times 0.225 \approx 0.081 \rightarrow \text{rounded to } 0.10 $$

  **Least Confident Term:**
  **(c) The clean split in real-world models.** I am least sure here because model architecture varies wildly; some agent-based models might separate cleanly, while general equilibrium models almost never do.

  **Evidence to Shift Number:**
  A systematic meta-analysis showing that models with identified "load-bearing fictions" consistently fail out-of-sample prediction faster than those with only "decorative idealizations" would raise (d) and significantly boost the overall figure.

  **Side Credence:**
  **0.65** that the distinction is often just post-hoc rationalization. We tend to label an assumption "decorative" when the model works and "load-bearing" when it breaks, rather than identifying the status prior to testing.
