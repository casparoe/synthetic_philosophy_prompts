answer: |-
  The problem of co-schematic predicates arises because the equivalence schema fixes the extension of *true* across possible worlds, but fails to fix its intension. If truth is exhausted by the disposition to accept *it is true that p iff p*, then any predicate necessarily co-extensive with *true* satisfies the same disposition. Since necessary truths hold in all possible worlds, appending one to *true* (e.g., *true and 2+2=4*) creates a predicate that is modally indistinguishable from truth itself. The schema tells us when to apply the predicate, but not which predicate we are applying. For a deflationist who claims there is no underlying nature to truth beyond the schema, this creates an individuation crisis: the schema alone cannot distinguish the property of truth from an infinite set of "camouflage" properties.

  Regarding the minimalist replies, the appeal to minimality is metaphysically weak. If properties are individuated by their extensions across possible worlds, necessarily co-extensive properties are identical. There is no "smaller" extension to select. To claim truth is the "minimal property" only works if one assumes a conceptual granularity where *true* is simpler than *true and 2+2=4*. But this presupposes the very conceptual distinction the schema was supposed to ground. It risks begging the question by smuggling in a substantive notion of conceptual simplicity.

  The second reply, explanatory priority, is stronger but costly. It argues that our acceptance of *true* instances is basic, whereas accepting *true and 2+2=4* requires arithmetic knowledge. This shifts the ground from metaphysics to epistemology. Truth is individuated not by what it *is*, but by how we *learn* it. The cost is that truth becomes anthropocentric; its identity depends on human cognitive architecture rather than logical structure. If a being grasped arithmetic before logic, would *true and 2+2=4* be their truth? This reply saves the schema by anchoring it in practice, but it concedes that the schema alone is insufficient without a story about linguistic acquisition.

  Your *twue* case presses this point decisively. If *twue* satisfies the schema basicly but lacks the generalizing function (infinite conjunctions), is it truth? If the minimalist says yes, they sever the link between truth and its advertised expressive utility. Truth becomes a purely schematic device with no essential function, undermining the justification for why we have the concept at all. If they say no, then the schema is insufficient; the functional role (generalization) is required to individuate the concept. This forces the deflationist toward a conceptual role semantics. While this need not concede a *substantive nature* (like correspondence), it does concede that truth has a substantive *role*. The view becomes hybrid: the schema provides the meaning, but the use provides the identity. This is stable, but it moves away from pure disquotationalism.

  On normativity, the co-schematic problem is acute. If truth is the norm of belief, is *true-and-2+2=4* also a norm? If normativity derives from the schema, yes; believing *p* aims at *p*, which is equivalent to aiming at *true-and-2+2=4*. But this dilutes the normative force. We do not feel we ought to believe *p* because *p* is true-and-2+2=4. To preserve the unique normativity of truth, the deflationist must argue that only *true* plays the right regulatory role in our psychology. Again, this relies on functional role rather than the schema alone.

  The burden of proof lies heavier on the deflationist than the substantivist. A correspondence theorist individuates truth via a specific relation to facts; *true-and-2+2=4* is not that relation, even if co-extensive. They have a metaphysical hook to hang the distinction on. The deflationist, denying such a nature, lacks this resource. They must rely entirely on linguistic practice or conceptual role to separate *true* from its twins. This suggests the co-schematic worry is a specific vulnerability of property-deflationism.

  Prosentential or redundancy formulations are in better shape here. If "is true" is not a predicate denoting a property but a logical device (a pro-sentence anaphoric on prior content), there is no property to be co-extensive with. The question "what property does 'twue' denote?" dissolves because neither term denotes a property. The issue becomes purely grammatical: does *twue* function as a pro-sentence? If not, it isn't truth, regardless of the schema. This avoids the metaphysical trap of property individuation entirely, suggesting that the problem arises only when minimalists slip into talking about truth as a property at all.
