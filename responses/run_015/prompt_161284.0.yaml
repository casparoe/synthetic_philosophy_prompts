answer: |-
  The crux here is not the regress itself, but the *condition* that makes a regress vicious. A competent answer will recognize that Strawson assumes responsibility requires *ultimate* origination (a binary threshold), whereas your proposal assumes responsibility admits of *degrees* of ownership. The fatal flaw in your specific formulation ("organization is genuinely new") is that Strawson can simply push the regress back to the *capacity* to organize; if the principle of organization is unchosen, the structure built from it is ultimately unchosen. The strongest version of your argument concedes the capacity is unchosen but argues that *exercising* it establishes a relevant relation of authorship sufficient for *practical* responsibility, even if it fails *ultimate* responsibility. I have adjusted the question to focus on this distinction between *ultimate* vs. *practical* ownership rather than metaphysical novelty.

  ***

  ### PhD Comprehensive Examination: Moral Responsibility
  **Time Allowed:** 60 Minutes
  **Total Marks:** 20

  **Question:**

  Galen Strawson's Basic Argument concludes that true moral responsibility is impossible because it requires being *causa sui*, leading to a vicious regress. Consider the following objection, termed "Ampliative Self-Creation" (ASC):

  While agents cannot create themselves *ex nihilo*, they can incrementally reorganize their character through reflective policies and commitments. This process increases the degree to which later acts express the agent's own structure compared to earlier acts. Thus, self-determination is a scalar quantity that rises over time. Strawson replies that amplification from a base of zero remains zero: if the initial capacity for reorganization is not chosen, no subsequent structure is truly "yours."

  In a unified essay, address the following:
  1.  Specify the condition under which the regress in the Basic Argument is vicious rather than benign. Does ASC meet this condition?
  2.  Evaluate whether a scalar notion of self-determination can support basic desert moral responsibility, or whether it necessarily changes the subject to a non-desert-based surrogate.

  *Note: Your answer must address the logic of origination and ownership. Do not discuss determinism, the Consequence Argument, or luck egalitarianism. Treat the argument as holding regardless of causal determinism.*

  ***

  ### Model Answer

  The Basic Argument turns on the requirement for *Ultimate Responsibility* (UR). For Strawson, an agent is responsible for an action only if they are responsible for the mental nature from which it flows. Since one cannot be responsible for one's initial nature without a prior nature to choose it, the regress is vicious because the condition for responsibility (ultimate origination) can never be met at any link in the chain. For the regress to be benign, the condition for responsibility must be satisfiable within the chain itself, without requiring an uncaused first cause.

  Ampliative Self-Creation (ASC) attempts to render the regress benign by shifting the condition from *ultimate origination* to *degrees of ownership*. ASC argues that responsibility is not a binary switch requiring *causa sui*, but a scalar property reflecting the coherence between an agent's reflective policies and their actions. Under this view, the regress is benign because each step of self-reorganization increases the "ownership" coefficient. However, Strawson's "zero base" objection holds if the metric remains UR. If the standard is "did you create the capacity to organize?", the answer is always no. Therefore, ASC only succeeds in making the regress benign if it rejects UR as the necessary condition for responsibility. It must argue that *sufficient* ownership, achieved through structural integration, is the actual requirement for responsibility, not *ultimate* ownership.

  This leads to the question of desert. Basic desert responsibility requires that an agent is the ultimate source of their action in a way that justifies reactive attitudes like moral blame or praise independent of consequentialist considerations. If ASC concedes that the capacity to organize is unchosen (as it must to avoid infinite regress), it concedes that the agent is not the ultimate source of their agency. Consequently, a scalar model of self-determination cannot deliver basic desert. If the base is unchosen, the agent never crosses the threshold of ultimate authorship required for desert, regardless of how high the scalar value rises.

  However, ASC may still deliver a robust surrogate. By distinguishing between *ultimate* responsibility and *practical* responsibility, ASC can argue that desert is not the only valid mode of accountability. A scalar model supports a notion of responsibility based on *agency competence* and *identification*. When an agent successfully aligns their motives with reflective policies, they become the proper target of normative demands, not because they created themselves, but because they function as a unified normative system. This changes the subject from Strawson's metaphysical desert to a functional account of answerability.

  Strawson would reject this as changing the subject, insisting that without UR, "responsibility" is merely a label for causal involvement. The ASC proponent must reply that Strawson's concept of responsibility is hyper-reflective and disconnected from the practices of holding agents accountable. The strongest version of ASC does not claim to solve the metaphysical problem of origination but argues that the metaphysical problem is irrelevant to the normative practice. Thus, ASC renders the regress benign for *practical* responsibility but accepts it is vicious for *ultimate* responsibility. The trade-off is abandoning basic desert in favor of a forward-looking, competence-based accountability that preserves the intuition of ownership without the impossible metaphysics.

  ***

  ### Marking Scheme

  **1. Identification of the Vicious/Benign Condition (4 Marks)**
  *   **Hit:** Clearly states that the regress is vicious only if responsibility requires *ultimate origination* (UR) impossible to satisfy within a chain.
  *   **Typical Error:** Candidates describe the regress steps without identifying the *condition* that makes it stop or go.

  **2. Analysis of ASC vs. UR (4 Marks)**
  *   **Hit:** Explains that ASC fails to meet Strawson's UR condition but succeeds if the condition is shifted to *degrees of ownership/identification*.
  *   **Typical Error:** Candidates claim ASC solves the metaphysical problem of *causa sui* rather than changing the requirement.

  **3. Addressing the "Zero Base" Objection (4 Marks)**
  *   **Hit:** Acknowledges that if the capacity to organize is unchosen, the "zero times zero" objection holds for UR, necessitating the shift to practical responsibility.
  *   **Typical Error:** Candidates argue that structural organization creates something *ex nihilo*, ignoring the unchosen capacity to organize.

  **4. Desert vs. Surrogate Distinction (4 Marks)**
  *   **Hit:** Concludes that scalar responsibility cannot support *basic desert* (which requires UR) but can support a *surrogate* (answerability/competence).
  *   **Typical Error:** Candidates assert that "more ownership" equals "enough desert" without justifying the threshold crossing.

  **5. Adherence to Constraints (No Determinism Drift) (4 Marks)**
  *   **Hit:** Maintains focus on origination/ownership logic without invoking determinism, luck, or the Consequence Argument.
  *   **Typical Error:** Candidates pivot to compatibilism/incompatibilism regarding causal determinism, missing the point that Strawson's argument applies even to indeterminists.

  **Distinction between A and B Answers:**
  A-grade answers recognize that the debate is not about whether self-creation is possible (it isn't), but about whether *ultimate* origination is necessary for responsibility. They explicitly concede that ASC sacrifices basic desert to save a practical notion of accountability. B-grade answers attempt to defend ASC as a metaphysical solution to the regress itself, often falling into the trap of claiming structural novelty bypasses the need for an chosen capacity, or they drift into standard compatibilist defenses regarding determinism.
