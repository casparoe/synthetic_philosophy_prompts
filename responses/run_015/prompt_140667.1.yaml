answer: |-
  # Exam Question: The Coarsest-Cell Principle and Uncertain Evidence

  **Time Allowed:** 45 Minutes
  **Total Marks:** 25

  **Background:**
  In lecture, we discussed the **Coarsest-Cell Principle (CCP)** for handling uncertain evidence. The principle states: *When an experience leaves you uncertain rather than certain of anything, update by Jeffrey conditionalization on the coarsest partition of your algebra whose cells that experience discriminates, namely the partition generated by the proposition whose probability shifted, holding fixed your prior probabilities conditional on those cells (Rigidity).*

  **The Task:**
  Test the CCP against the following two cases. In your answer, you must:
  1.  Analyze whether the CCP yields the correct result in each case.
  2.  Explain exactly what work the **Rigidity condition** is doing in each scenario and what must be true of an evidential partition for its use to be legitimate.
  3.  Conclude on the status of the rule: Does it need a supplement, a restriction, or replacement by plain conditioning inside a richer algebra?

  **Case 1 (Direct Perception):** You examine a cloth under poor lighting. The experience leaves you 0.8 confident it is green ($G$) rather than blue ($\neg G$). You have no other information about the lighting conditions other than that they are poor.

  **Case 2 (Instrumental Testimony):** You receive a readout from a lab instrument indicating a chemical is present ($R$). However, the instrument's reliability is uncertain and may be correlated with the chemical's presence (e.g., the instrument malfunctions specifically when the chemical is high). You become 0.8 confident in the readout $R$.

  ***

  # Model Answer

  The Coarsest-Cell Principle (CCP) attempts to license Jeffrey Conditionalization (JC) by fixing the evidential partition based on the proposition whose probability shifts directly due to experience. To test this, we must examine whether the partition $\{E, \neg E\}$ is genuinely the "coarsest" discriminated by the experience and whether Rigidity holds.

  In **Case 1 (Cloth)**, the CCP appears successful. The experience is visual; its direct content is the color of the cloth. The partition $\{G, \neg G\}$ is the coarsest partition discriminated because the lighting affects the appearance of greenness directly. Here, Rigidity requires that $P_{new}(H | G) = P_{old}(H | G)$ for any hypothesis $H$ (e.g., "the cloth is silk"). This is plausible: once we fix the color, the lighting conditions (which caused the uncertainty) are screened off. The probability shift is localized to $G$. The CCP correctly identifies $\{G, \neg G\}$ as the update base, and Rigidity preserves the structural relations between color and other properties.

  In **Case 2 (Instrument)**, the CCP fails. The experience is the receipt of a readout $R$, but the evidential import of $R$ depends on the instrument's reliability state ($S$). The "coarsest" partition discriminated by the experience is not merely $\{R, \neg R\}$, because the experience also informs us about the instrument's state, or at least, the probability of $R$ is entangled with $S$. If reliability correlates with the hypothesis (e.g., high chemical levels cause malfunctions), then learning $R$ changes the probability of the reliability state. Rigidity fails because $P_{new}(H | R) \neq P_{old}(H | R)$. The conditional probability of the chemical being present given the readout changes *because* the readout alters our belief about the instrument's trustworthiness. By forcing an update on $\{R, \neg R\}$ while holding conditionals fixed, the CCP ignores the correlation between the evidence source and the hypothesis.

  This failure highlights a deeper structural issue regarding **underdetermination**. Jeffrey Conditionalization requires a probability distribution over a *partition*, not merely a new probability for a *single proposition*. Specifying $P_{new}(E) = 0.8$ does not determine an update unless one assumes the partition is $\{E, \neg E\}$. However, a constraint on a single proposition underdetermines the update because it does not specify how the probability mass is redistributed among other logically independent cells that might be affected by the same experience.

  The "problem of uncertain evidence" is therefore often a problem of algebraic coarseness. In Case 2, the uncertainty isn't about $R$ per se, but about the joint state of $\{R \land \text{Reliable}, R \land \text{Unreliable}, \dots\}$. The CCP tries to solve this by fiat, declaring $\{E, \neg E\}$ the relevant partition. But if the experience discriminates more than just $E$ (e.g., it discriminates reliability states), the CCP mandates the wrong partition.

  Consequently, the rule requires **replacement by plain conditioning inside a richer algebra**. We should not use JC on $\{R, \neg R\}$. Instead, we should expand the algebra to include reliability states, treat the experience as certain knowledge of a richer proposition (e.g., "I observed readout R"), and update by Strict Conditionalization. The CCP is a useful heuristic for Case 1 where the algebra is naturally coarse, but it is not a fundamental normative principle. It masks the requirement that the evidential partition must capture all probabilistic relevance triggered by the experience.

  ***

  # Marking Scheme (25 Marks)

  **1. Case 1 Analysis (5 Marks)**
  *   **Full Marks:** Identifies that CCP works here because the partition $\{G, \neg G\}$ captures the direct content of the experience and Rigidity is plausible (screening off).
  *   **Common Error:** Arguing Case 1 fails because lighting makes *any* update unreliable, missing the point of modeling the uncertainty.

  **2. Case 2 Analysis (5 Marks)**
  *   **Full Marks:** Identifies that CCP fails because the partition $\{R, \neg R\}$ is insufficient; reliability correlations violate the independence required for the update.
  *   **Common Error:** Claiming Case 2 is solvable by JC simply because probabilities are numerical, ignoring the correlation/reliability structure.

  **3. Function of Rigidity (5 Marks)**
  *   **Full Marks:** Explains Rigidity preserves prior conditional probabilities ($P(H|E_i)$) and notes this is only legitimate if $E_i$ screens off the experience from $H$.
  *   **Common Error:** Defining Rigidity mathematically without explaining its conceptual role (preserving structural relations/screening off).

  **4. Underdetermination & Partitions (5 Marks)**
  *   **Full Marks:** Explains that $P_{new}(E)$ alone underdetermines the update; JC requires a full partition distribution. The "problem" is choosing the correct partition, not the math of JC.
  *   **Common Error:** Treating $P_{new}(E)$ as sufficient for JC without acknowledging the need for a partition specification.

  **5. Status of the Rule (5 Marks)**
  *   **Full Marks:** Concludes that CCP needs restriction or replacement by Strict Conditionalization on a richer algebra (e.g., including reliability states).
  *   **Common Error:** Vague conclusion (e.g., "The rule is mostly good") without specifying *how* to fix the algebraic deficiency.

  ***

  # Differentiation Guide: A vs. B Performance

  **To earn an A (21-25 marks):**
  The student must hit **Point 4 (Underdetermination)** with precision. They must explicitly explain that a constraint on the new probability of a *single proposition* fails to determine any update because Jeffrey Conditionalization operates on *partitions*. They must articulate that the "problem of uncertain evidence" is often a modeling error (an algebra that is too coarse) rather than a need for a new updating rule. They will argue that Case 2 fails not just because Rigidity is violated, but because the CCP forces the wrong partition.

  **To earn a B (16-20 marks):**
  The student will likely hit Points 1, 2, 3, and 5 correctly. They will identify that Rigidity fails in Case 2 due to reliability correlations and suggest expanding the algebra. However, they will miss the deeper conceptual point in Point 4. They may treat the partition as given or assume that specifying $P_{new}(E)$ automatically fixes the partition $\{E, \neg E\}$ without questioning whether that partition is well-defined by the experience alone. They solve the cases but miss the meta-epistemological implication about underdetermination.
