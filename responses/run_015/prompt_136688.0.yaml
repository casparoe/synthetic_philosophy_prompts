answer: |-
  Here's a rundown of nine questions to keep the conversation sharp and moving. I've baked the follow-ups right into the flow so you don't get stuck if she pivots.

  **1. The Rust Belt vs. The Server Farm**
  "Let's start with the setting of my novel versus the setting of your book. I'm writing about empty factories where the machines are silent; you're writing about a world where the 'general intellect' is humming inside the machines. How do we get from the smokestack to the server farm without pretending the people in between just vanished? Does your theory explain the ruins I'm writing about, or does it explain the world that replaced them?"

  **2. The *Grundrisse* Trap**
  "Okay, the elephant in the room. The *Grundrisse* are basically Marx's messy notebooks, right? Critics say treating the 'Fragment on Machines' like mature *Capital* is like quoting a text message as a legal contract. You're arguing it's the core key though. Why trust the draft over the finished book?"
  *   **Follow-up (if she argues continuity):** "If it's continuous, why did Marx scrub most of this 'general intellect' language out of Volume 1? Did he change his mind on the economics, or did he just think it was too dangerous to say out loud?"

  **3. The Clock vs. The Mind**
  "Here's where my head spins. Marx says value comes from labor-time. But if cognition is the direct force, time doesn't line up anymore. I can think of a solution in a second that takes ten hours to code. Does your reading mean the labor theory of value breaks when the mind becomes the machine?"
  *   **Follow-up (if she says immaterial labor is unmeasurable):** "If it's unmeasurable, can capitalism actually function on it? Or does that mean we're in a bubble economy where value is just fiction until someone tries to cash out?"

  **4. Inevitability or Choice?**
  "Is this capture inevitable? You make it sound like once the tech exists, capital *has* to swallow the general intellect. But could we have built tools that keep that knowledge outside the market? Is the cage built into the steel, or did we just lock ourselves in?"

  **5. The Novelist's Dilemma**
  "I need to ask this for my own sanity. I'm writing a novel, but I'm using AI tools to brainstorm. The 'general intellect' is literally the commodity I'm selling. In your framework, does that make me a capitalist exploiting the commons, or a proletarian whose own creativity has been outsourced to the algorithm?"

  **6. What Happens to the Body?**
  "You talk about cognition, but my characters are covered in grease and dust. When capital captures the mind, what happens to the body? Does physical labor become invisible, or does it become the punishment for those who couldn't get into the cognitive game?"

  **7. How Do You Strike?**
  "If the factory is inside our heads now, how do we strike? You can't unplug the network without starving yourself. What does stopping work look like when the means of production are your own neurons?"

  **8. Commons or Quarry?**
  "Who owns the general intellect in this scenario? Is it a commons that got enclosed, or was it always a quarry waiting to be mined? Because that changes whether we're fighting for restitution or liberation."

  **9. The Endgame**
  "Last one. Does this trajectory end capitalism? If machines know everything and workers know nothing, the system crashes. Or does it just evolve into something weirder where we're all just pets to the algorithm?"
