answer: |-
  Dear colleague,

  It is a rare pleasure to see the Preface Paradox stripped of its formal abstraction and laid bare in the actual texture of academic life, and I think you have correctly identified that the tension you feel is not inconsistency but a friction between two different norms of assertion that we usually conflate. You are looking for a single principle, and while I worry that any single principle risks oversimplifying the pragmatic nuance of speech acts, I believe there is a unified account that captures about ninety percent of your intuitions without resorting to baroque exceptions. I will call it the Principle of Evidential Specificity and Systemic Closure. It has three clauses, and I will walk you through how they handle your cases, where I am less certain they hold, and which of your current verdicts I think you must abandon to keep the principle clean.

  The first clause governs individual assertions and requires that your evidence for a claim be specific to the truth-maker of that claim, rather than merely statistical relative to a reference class. This is what distinguishes your lottery ticket from your lab safety items. In the lottery, your evidence that the ticket will lose is purely statistical; it relies on the ratio of winners to losers, not on any causal fact about the ticket itself. In the lab, your sign-off on a specific valve relies on a direct inspection of that valve. This clause explains why you cannot say my ticket will lose but can say this valve is secure, even if the probability of error is identical. I am highly confident in this clause, as it aligns with the standard distinction between statistical and causal evidence in epistemology. The second clause governs aggregate assertions and requires that to assert a conjunction of claims, you must have evidence that the process generating the set is free of correlated error. This handles your preface and your brother's bridge. You can assert each chapter is sound because you checked them individually, but you cannot assert all chapters are sound because you have not checked for a shared methodological flaw that would sink them all at once. Your brother is wrong to think item-by-item certification suffices for the aggregate safety claim; the aggregate claim is a claim about the system, not the parts. This clause is where I am roughly seventy percent confident, because it relies on a somewhat contentious view of what constitutes a system, but it explains why your confidence drops when a single instrument or method underpins all the claims. The third clause introduces pragmatic scaling, stating that the threshold for both specificity and closure rises with the stakes of error. This explains why the lab safety aggregate requires a systems-level check while the book preface merely requires a hedge; a false safety claim kills, while a false scholarly claim merely misleads. I am less confident about the precise metric for this scaling, but the qualitative effect seems necessary to match your intuitions.

  Now, let us run this against your difficult pairs. The seismologist case is the one where my confidence in the principle drops to about a coin flip. You say daily assertions of no quake are proper, but an almanac of those same assertions is not. The principle supports this if we view the daily assertion as relying on current seismic data (specific evidence) and the almanac as relying on a projection of that data over time (systemic evidence). However, if the seismologist has a robust model that predicts stability for the year, the principle would allow the almanac, provided she certifies the model. If she is merely aggregating daily guesses, the principle forbids it. I suspect you are tracking whether the evidence is fresh, which maps onto specificity, but I concede this verdict could go either way depending on the seismologist's methodology. The committee report case is where I must ask you to sacrifice a verdict. You say voting to accept the report as accurate felt fine even though everyone believed some sentence was wrong. The principle forces you to admit that this vote was not an epistemic assertion of truth but a pragmatic certification of fitness. If you maintain that accurate means true, the principle says you acted improperly. You already hinted at this by mentioning accurate enough for its purpose, but I think you need to go further and concede that the feeling of it being fine was a pragmatic relief, not an epistemic comfort. You must sacrifice the intuition that the committee vote was epistemically continuous with your chapter sign-offs; in the committee room, you changed the meaning of accurate to mean passable, whereas in the preface, you are keeping true to mean true. This is the cheapest verdict to lose because it isolates the administrative function from the scholarly one, preventing the pollution of your scholarly norms by bureaucratic necessity.

  Applying this to your dissertation case next week, the principle yields a clear result. You are certifying a person and a body of work, which functions as a system. You can assert that the candidate has demonstrated competence because your evidence is specific to their performance in the defense and the quality of the argumentation you read. However, when you tell the candidate there is certainly a wrong footnote somewhere, you are acknowledging the lack of systemic closure regarding minor errors. This is not the preface paradox reborn but rather a recognition that the object of certification is the candidate's reliability as a scholar, not the infallibility of the text. The text is a sample of the mind, and you are certifying the source, not every output. Therefore, you can sign the report saying the work is sound without asserting every proposition is true, provided sound is understood as demonstrating scholarly competence rather than logical perfection. I am quite confident here because the shift from text to agent changes the truth-maker of the claim from the propositions to the person's training.

  Finally, I will construct a case where I believe this principle yields a verdict you will find uncomfortable, to show you where it bites. Imagine you are on a tenure committee. You have read the candidate's five major publications. For each article, you have specific evidence that the central argument is sound, and you would happily assert each one is a valuable contribution. However, you notice that all five articles rely on the same novel dataset that you have not independently verified. According to the second clause of the principle, you cannot assert the candidate's body of work is robust because you lack systemic closure on the data source. The uncomfortable verdict is that you must vote against tenure, or at least withhold endorsement, despite believing each individual article is sound. This feels like punishing the candidate for a structural risk they could not easily avoid, and it prioritizes your epistemic comfort over their career. I find this verdict harsh, and I would concede it is a coin flip whether the principle should be relaxed for high-stakes personal outcomes like employment. However, the principle holds that without checking the shared foundation, the aggregate claim of tenure-worthiness is epistemically premature. This shows you that the principle is not merely a tool for comfort but a constraint that may force you to withhold approval even when the individual parts look perfect.

  In sum, I believe the Principle of Evidential Specificity and Systemic Closure, scaled by stakes, governs your posture better than any appeal to inconsistency. It requires you to treat the committee vote as pragmatic rather than epistemic, which may feel like a loss of integrity but is actually a clarification of context. It allows you to sign the dissertation report while acknowledging minor errors, provided you frame the certification around the candidate's competence. And it warns you that in the tenure case, you may have to say no to a good candidate because the system underneath them is unverified. I hope this helps you finish the preface with a clear conscience, or at least a clearly defined unease.

  Best regards.
