answer: |-
  The lottery and preface paradoxes manifest not parallel failures of rationality, but a single structural asymmetry in how justification aggregates across disjoint domains. Acceptance is not a uniform doxastic state but is indexed to the stakes and scope of the practical context. For any single lottery ticket, the high probability of loss falls below the context-sensitive practical threshold required for individual assertion; thus, a rational agent withholds acceptance of each specific ticket losing. Conversely, the collective claim that some ticket will lose possesses aggregate justification crossing a distinct global threshold tied to the decision problem as a whole. This asymmetry explains why high probability suffices for systemic conclusions where risk is distributed, yet fails for individual claims where error carries specific weight. Believing the conjunction while suspending judgment on conjuncts is therefore consistent, reflecting shifting epistemic standards rather than contradiction. Rationality requires tracking these contextual thresholds instead of enforcing a rigid, universal probability lock for all belief acceptance across varying domains, thereby dissolving the apparent conflict between individual skepticism and collective certainty.
