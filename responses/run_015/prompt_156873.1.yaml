prompt: |-
  I'm a novelist working on this strange book about interioraty—sorry, interiority—and I got invited to speak next week at an interdisciplinary seminar on narrative and cognition, which is way outside my usual crowd. I was discussing this with my friend who writes poetry and she said I was being pretentious, but I think there's something real here. I've become obsessed with Dennett's heterophenomenology, the idea that we treat first-person reports of mental states not as direct windows into real conscousness but as texts describing fictional worlds—heterophenomenological worlds that exist only in the report. My thesis for the talk is that this scientific method is actually the correct aesthetic framework for writing convincing characters: instead of pretending we're describing real mental states inside people, we should treat a character's self-reports as constructing a coherent fictional mental world, which explains why unreliable narrators feel more truthful than omniscient ones. The audience will be mostly literary theorists who think consciousness studies is just neuroscience with delusions of grandeur, plus two cognitive scientists who actually read Dennett and will call me out if I misrepresent the method. I need a prep sheet for the objections. Give them to me in roughly the order they'll come—first the literary people complaining that I'm killing the emotional soul of fiction with mechanistic language, then the scientists saying I'm misusing an empirical tool for literary fluff. For each one, tell me what I should concede up front (probably that fiction isn't science and I'm not claiming it is) and what I should hold onto (that the structural parallel between methodological bracketing and narrative distance is genuinely illuminating). Point out the weakest point in my own argument—probably that heterophenomenology was designed to avoid ontological commitments about mental states, whereas fiction thrives on making exactly those commitments about characters? And include the objection I'm praying nobody raises: whether this makes all emotional identification with characters impossible, reducing literature to anthropology of imaginary beings.
reasoning: |-
  Here's a thinking process that leads to the suggested prep sheet:

  1.  **Analyze the User and Request:**
      *   **User:** Novelist working on a book about interiority.
      *   **Context:** Invited to speak at an interdisciplinary seminar on narrative and cognition (literary theorists + cognitive scientists).
      *   **Conflict:** Friend (poet) calls them pretentious; user feels there's something real in connecting Dennett's heterophenomenology to character construction.
      *   **Thesis:** Heterophenomenology (treating first-person reports as texts describing fictional worlds) is the correct *aesthetic* framework for writing convincing characters. Unreliable narrators feel more truthful than omniscient ones because of this.
      *   **Audience:** Literary theorists (skeptical of science) + Cognitive Scientists (Dennett-literate, strict on method).
      *   **Task:** Create a prep sheet for objections.
      *   **Structure:**
          1.  Order of objections (Literary first, then Scientific).
          2.  For each: Concession vs. Hold.
          3.  Identify the weakest point in the user's argument.
          4.  Address the "prayer" objection (emotional identification/anthropology).
      *   **Tone:** Professional, insightful, slightly empathetic to the user's precarious position (validating their idea while sharpening it against critique).

  2.  **Deconstruct the Core Argument:**
      *   *Dennett's Heterophenomenology:* We can't access subjective experience directly. We treat subjects' reports as data (texts). We construct a "heterophenomenological world" based on these reports. We remain neutral on whether that world *actually* exists inside the subject.
      *   *User's Application:* Writers shouldn't pretend to know a character's "real" mind (omniscience). They should treat the character's self-presentation as constructing a fictional mental world. This makes unreliable narration more "truthful" (because it acknowledges the gap).
      *   *Tension:* Science uses this to *avoid* ontological claims about qualia. Fiction uses narrative to *create* ontological claims about characters (they feel real to us).

  3.  **Drafting the Objections (Iterative Process):**

      *   *Objection 1: The Literary Theorists (The "Soul" Argument).*
          *   *Concern:* Reducing art to methodology kills the magic. "Mechanistic language."
          *   *Concession:* Yes, fiction isn't science. I'm not reducing art to data.
          *   *Hold:* The *structure* of the gap is what creates resonance.
          *   *Refinement:* Call it the "Reductionism/Qualia" objection.

      *   *Objection 2: The Cognitive Scientists (The "Methodology" Argument).*
          *   *Concern:* Misusing an empirical tool. Heterophenomenology is for studying *real* humans, not fictional constructs. You're mixing categories.
          *   *Concession:* Yes, characters aren't subjects. I'm not doing science.
          *   *Hold:* The epistemic stance is analogous. The reader does to the character what the scientist does to the subject.
          *   *Refinement:* Call it the "Category Error" objection.

      *   *The Weakest Point:*
          *   *Analysis:* Dennett brackets ontology (does the pain *really* feel like that?). Fiction *requires* ontology (Hamlet *is* sad, even if he lies about why). If we treat characters purely as heterophenomenological texts, do they cease to be agents?
          *   *Formulation:* The Ontological Commitment Gap. Science suspends belief; fiction invites belief.

      *   *The "Prayer" Objection (Emotional Identification):*
          *   *Concern:* If characters are just texts/worlds, how do we cry for them? Does this turn empathy into anthropology?
          *   *Response:* Empathy *is* a simulation of heterophenomenology. We build their world in ours.
          *   *Refinement:* The "Empathy/Anthropology" objection.

  4.  **Fleshing out the Content (incorporating Dennett specifics):**
      *   Need to ensure Dennett's terms are used correctly (heterophenomenological world, intentional stance, neutral stance).
      *   Need to address the literary side (omniscience, unreliable narration, reader-response).
      *   Need to validate the user against the poet friend (it's not pretentious, it's a specific theoretical move).

  5.  **Review against Constraints:**
      *   Order: Literary -> Scientific.
      *   Format: Concession vs. Hold.
      *   Include Weakest Point.
      *   Include "Prayer" Objection.
      *   Tone: Prep sheet style (concise, actionable).

  6.  **Final Polish:**
      *   Make sure the advice on "Concede vs. Hold" is strategic.
      *   Ensure the "Weakest Point" is honest but constructive.
      *   Check that the "Prayer" objection gets a robust defense, as it's the emotional core of the user's anxiety.

      *(Self-Correction during drafting)*: I initially thought about telling them to abandon the ontological point. But actually, the user's thesis relies on the *tension* between the two. I should advise them to lean into the tension rather than resolve it. The "truth" of fiction lies in the *attempt* to bridge the gap, not the bridge itself.

      *(Refining the "Scientist" objection)*: The scientists will care about the "Intentional Stance." Dennett says we treat entities as rational agents to predict behavior. The user needs to distinguish between predicting behavior (science) and experiencing interiority (art).

      *(Refining the "Literary" objection)*: They will hate "mechanistic." Use words like "phenomenological texture" instead of "data."

