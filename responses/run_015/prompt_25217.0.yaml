          *   *Object-Oriented/Entity-Component-System (ECS):* Encapsulation. State is local to entities.
      *   *My Position:* For a *simulation* (not necessarily a planner proving theorems), the **STRIPS Assumption combined with Entity Encapsulation** is the pragmatic winner. It treats persistence as the default and change as the exception. This is the "definite position" required.

