answer: |-
  ### The Pragmatic Solution to the Frame Problem

  You are facing the **Representational Frame Problem**: How do we represent a dynamic world without explicitly stating that everything else remains unchanged? In philosophy, this is an epistemological crisis. In engineering, it is a performance bottleneck.

  If you attempt to model persistence explicitly (i.e., writing rules that say "if robot moves, battery stays same"), your rule set grows quadratically with every new fact. You will fail.

  **My Position:** For a simulation of this nature, you must adopt the **STRIPS Assumption** combined with **Entity Encapsulation**.
  1.  **Inertia is Default:** Facts persist automatically unless explicitly listed in an action's "Delete/Modify" list. You do not write code to preserve state; you write code to change it. The database engine handles the rest.
  2.  **Locality of Causation:** An action only affects the entities directly involved and their immediate relationships. Global effects must be decomposed into local triggers.

  This is a philosophical commitment to **atomic causal locality**. It assumes the universe is modular. It is not always metaphysically true (butterfly effects exist), but it is computationally necessary.

  Below is the **Frame Audit Protocol**. Use this design-time checklist for every new action type you introduce.

  ---

  ### The Frame Audit Protocol

  **Objective:** Define the *Delta Set* (facts to update) so the runtime engine ignores the *Static Set* (facts to persist).

  #### Step 1: Identify the Primary Fluents
  List the specific boolean flags or variables that *must* flip state for this action to be considered successful.
  *   *Constraint:* If a fact isn't listed here, the system assumes it is immutable during this transaction.
  *   *Commitment:* You are defining the "essence" of the action.

  #### Step 2: Define the Scope of Influence (The "Affected Set")
  Identify the specific object IDs involved.
  *   *Rule:* If an object ID is not in this set, its internal state cannot change.
  *   *Commitment:* This enforces **Encapsulation**. It prevents "spooky action at a distance."

  #### Step 3: Check for Ramifications (The Qualification Problem)
  Ask: "Does this change force other changes to maintain consistency?"
  *   *Example:* If `Crate.Location` changes, does `Shelf.Weight` change?
  *   *Action:* If yes, add these to Step 1. If no, explicitly document *why* (e.g., "Weight is calculated on demand, not stored").
  *   *Commitment:* You are deciding what constitutes a "fact" vs. a "derived property." Stored facts trigger the frame problem; derived properties do not.

  #### Step 4: Affirm Inertia
  Explicitly state: "All facts not in Step 1 regarding objects not in Step 2 remain unchanged."
  *   *Runtime Implication:* Your update query is an `UPDATE` on specific rows, not a `REPLACE` of the world state.

  ---

  ### Application 1: Action "Robot Picks Up Crate"

  **Context:** Robot R1 approaches Crate C1 on Shelf S1 and lifts it.

  **1. Primary Fluents (The Change List)**
  *   `R1.Status`: `Idle` → `Holding`
  *   `C1.Location`: `Shelf_S1` → `Robot_R1`
  *   `S1.Occupancy_Slot`: `Occupied` → `Empty`

  **2. Scope of Influence**
  *   Entities: `R1`, `C1`, `S1`.
  *   Excluded: `R2` (other robots), `C2` (other crates), `GlobalClock`.

  **3. Ramification Check**
  *   *Battery:* Does `R1.Battery` drop?
      *   *Decision:* Yes. Add `R1.Battery` to Change List.
      *   *Philosophical Flag:* **Granularity of Time.** By updating battery now, you treat "picking up" as a discrete event with cost. If you treated battery as continuous decay over time, this would not be a frame problem issue but a differential equation. You are choosing **Discrete Event Simulation** over Continuous Time.
  *   *Inventory Count:* Does `Warehouse.TotalCrates` change?
      *   *Decision:* No. It's still in the warehouse.
      *   *Philosophical Flag:* **Mereology (Part/Whole).** You are committing to the view that the crate's identity persists independently of its location.

  **4. Affirm Inertia**
  *   `R2.Path`: Unchanged.
  *   `C2.Location`: Unchanged.
  *   `Shift.EndTime`: Unchanged.

  **Runtime Result:** The engine touches 3-4 records. Thousands of other records are never read or checked. They persist by virtue of not being touched.

  ---

  ### Application 2: Action "Warehouse Shift Ends"

  **Context:** The 8-hour shift concludes. Operations halt. Robots must dock.

  **1. Primary Fluents (The Change List)**
  *   `Warehouse.ShiftState`: `Active` → `Closed`
  *   `Global.AccessLevel`: `Full` → `Restricted`

  **2. Scope of Influence**
  *   Entities: `GlobalState`, `All_Robots`.
  *   *Problem:* "All_Robots" violates the Locality rule. This is a **Global Event**.

  **3. Ramification Check**
  *   *Robot Position:* Do robots teleport to chargers?
      *   *Decision:* No. They must execute a "Dock" action.
      *   *Philosophical Flag:* **Agency vs. State.** You are making a commitment that state changes require *actions*. You cannot simply set `Robot.Location = Charger` because the shift ended. The shift ending *triggers* a goal for the robots to dock. This preserves the physical integrity of the simulation (robots can't teleport).
  *   *Inventory:* Does crate inventory freeze?
      *   *Decision:* Yes. `Crate.Movable` flag set to `False` for all crates.
      *   *Efficiency Fix:* Do not iterate all crates. Create a global flag `Warehouse.AllowMovement`. Check this flag in the precondition of the "Pick Up Crate" action.
      *   *Philosophical Flag:* **Global Fluents.** You are introducing a "contextual fact" that overrides local facts. This is a necessary violation of strict locality to handle global states efficiently.

  **4. Affirm Inertia**
  *   `Crate.Location`: Unchanged (unless moved during dock sequence).
  *   `Shelf.Structure`: Unchanged.
  *   `Robot.Battery`: Unchanged (until docking starts).

  **Runtime Result:** You update one global flag. You do not update thousands of crate records. You rely on the *preconditions* of future actions to check that global flag. This solves the frame problem for global states by pushing the check to the *access point*, not the *state change*.

  ---

  ### The Philosophical Commitments You Are Making

  By following this protocol, you are not just optimizing code; you are making three metaphysical claims about your simulation world. You must accept these to sleep at night.

  **1. The Closed World Assumption (CWA)**
  *   **Commitment:** If a fact is not listed in your "Change List," it is false that it changed.
  *   **Risk:** If there is a hidden dependency (e.g., picking up a crate triggers a vibration sensor that scares a robot), your model is wrong.
  *   **Mitigation:** You must trust your **Ramification Check (Step 3)**. If you miss a dependency, the simulation is buggy. There is no safety net.

  **2. Atomic Causality**
  *   **Commitment:** Actions are instantaneous or discrete blocks. Time does not pass *during* the update.
  *   **Risk:** Race conditions. If "Shift Ends" fires while "Robot Picks Up Crate" fires, which wins?
  *   **Mitigation:** You need a transaction log or event queue. The Frame Problem assumes a sequence of situations ($S_0, S_1, S_2$). You must enforce that ordering strictly.

  **3. Relevance is Syntactic, Not Semantic**
  *   **Commitment:** A fact is relevant only if it appears in the action's code definition.
  *   **Risk:** This is the heart of the Frame Problem. In reality, everything is potentially relevant (the color of the wall might matter if the robot is vision-guided).
  *   **Mitigation:** You must define your **Ontology** carefully. If "Wall Color" is not a property in your `Shelf` object, it cannot be affected. You solve the frame problem by limiting what exists.

  ### Final Directive

  Do not build a system that checks for persistence. **Build a system that assumes persistence.**

  Your database is the ground truth. Your actions are merely patches (diffs) applied to that truth. When designing a new action, if you find yourself writing logic to ensure something *doesn't* change, stop. You are fighting the architecture. Refactor the action to only declare what *does* change, and rely on the **Frame Audit Protocol** to ensure you haven't missed a ramification.

  This is the only way to scale.
