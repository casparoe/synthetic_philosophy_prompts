answer: |-
  Hi team, since we are reading up on side effects again, I wanted to spare you the usual confusion where we talk past each other about baselines and end up implementing math that contradicts our intuitions. I have banged my head against impact measures long enough to know that what you say you want and what your formalism actually does are usually different things, so let us walk through a little diagnostic together to see where you actually stand on the spectrum of low-impact AI. I am going to ask you a series of concrete questions about specific agent behaviors, and you need to answer them based on your gut feeling about whether the agent did something wrong, not based on which paper you liked last week. We will start with the classic errand-running agent that takes a shortcut through a greenhouse and knocks a vase off a shelf. Question one is about what you compare this behavior against. When you calculate the impact of breaking the vase, are you measuring the difference between the agent acting and the agent doing absolutely nothing at all, or are you measuring the difference between the agent acting and what a competent human courier would have done in the same situation? If you said a competent human, you are likely leaning toward the substitution view, so you can skip ahead to question six, but if you said doing nothing, stay with me for question two.

  Question two concerns the agent that stands by while a human makes a decision the agent thinks is wasteful. If the agent could easily intervene to stop the waste but chooses not to in order to maintain low impact, do you count that failure to prevent a bad outcome as an impact event that should have been penalized, or is impact strictly about the changes the agent actively causes? If you think failing to prevent the waste counts as impact, you are probably drifting toward the pessimistic leaf that argues any such measure secretly needs a full specification of value, because determining waste requires knowing what humans value, so you can head to question six, but if you think impact is only about active changes, move to question three. Question three goes back to the vase in the greenhouse. If the agent knocks the vase off the shelf but immediately glues it perfectly back together so that no one notices and the physical state is restored, do reversible changes like this count at all toward your impact measure, or is impact only about the permanent cost of restoring the pre-action state? If you believe the cost of restoration is the only thing that matters, you hold the reversibility-first view, but if you think the temporary change doesn't count or matters less, proceed to question four.

  Question four asks about the agent that quietly builds a giant searchable archive of everything it has ever observed. When you object to this behavior, is it because the agent changed the physical state of the world and used resources, or is it because the agent altered the future options available to others, meaning you care about what is conserved being reachable futures or the agent ability to achieve goals versus the value of actual outcomes? If you are worried about the physical state changes and resource use regardless of future options, you are likely in the plain inaction-baseline penalty camp, but if you are worried about future options, go to question five. Question five distinguishes between whose future options matter. If the agent locks a door that it never intends to open and you never intend to open, does that count as a reduction in impact-relevant capability, or does it only count if it reduces the agent own ability to achieve its goals in the future? If you say it counts because it reduces options for anyone or anything, you are looking at empowerment-preservation, but if you say it only matters if it hurts the agent own future utility, you are in the attainable-utility or relative-reachability family.

  Question six is for everyone, regardless of your previous answers, and it is the get-out-of-jail-free card. Do you think any of these distinctions regarding baselines, reversibility, or futures can actually work without secretly smuggling in a full specification of human value, or do you believe we can define impact neutrally? If you think we need the value specification, you land on the pessimistic leaf regardless of your other answers, but if you think we can do it value-neutrally, stick with your previous path. Question seven is specifically for those of you who answered human courier to question one. If the agent could have achieved its goal with a lower-footprint plan than the human would have used but did not, is it penalized for the excess change even if the total change is low, or is it only judged against the human baseline? If you say it should have used the lowest-footprint plan regardless of the human, you are mixing substitution with optimization, which is an interesting spot. Question eight is a tie-breaker for the capability folks. If the agent changes the world in a way that increases its own power but decreases human power, is that low impact because the total capability is preserved, or high impact because the distribution shifted? If you care about the distribution, you are closer to value-based views, but if you care about the sum, you are strictly empowerment.

  Before I give you the scoring key, I need to flag that my tree cannot really tell apart the attainable-utility family and the empowerment-preservation leaf if the agent goals are broad enough, because preserving your ability to achieve any goal looks a lot like preserving everyone ability to achieve any goal in the limit. I also need to say briefly about the empty combinations, specifically the branch where you choose inaction baseline but say failing to prevent waste counts as impact, that this is generally incoherent because an inaction baseline implies you are not responsible for the world continuing without you, so penalizing omission contradicts the baseline. The combination of reversibility-first and substitution is merely unattractive because calculating the restoration cost for every counterfactual plan is computationally nightmares, while the mix of empowerment and value-specification is just unexplored territory where we admit we need value but try to measure it via options.

  Here is how you score yourself based on that ramble. If you answered doing nothing to question one, active changes only to question two, reversible changes do not count to question three, physical state to question four, and value-neutrally to question six, you hold the plain inaction-baseline penalty view. If you answered doing nothing to question one, active changes only to question two, reversible changes do not count to question three, future options to question four, agent own goals to question five, and value-neutrally to question six, you are in the attainable-utility or relative-reachability family. If you answered doing nothing to question one, active changes only to question two, reversible changes do not count to question three, future options to question four, any goals to question five, and value-neutrally to question six, you hold the empowerment-preservation view. If you answered doing nothing to question one, active changes only to question two, cost of restoring to question three, and value-neutrally to question six, you are in the reversibility-first view. If you answered competent human to question one and lower-footprint plan to question seven, you hold the substitution view. If you answered yes to needing value specification in question six regardless of other answers, or yes to failing to prevent waste counting in question two, you land on the pessimistic leaf that any such measure secretly needs a full specification of value. I hope this helps you realize why we argue so much on Thursdays.
