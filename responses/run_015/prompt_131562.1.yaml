answer: |-
  ### Specification for Interpersonal Comparisons in National Cost–Benefit Analysis

  This specification defines the constraints any metric of well-being must satisfy to serve as an input for a social welfare function (SWF) used in national cost–benefit analysis (CBA). The purpose is twofold: (1) to enable the mathematical aggregation of gains and losses with distributional weights, and (2) to remain defensible to a citizenry that holds irreconcilable views on the substantive nature of well-being.

  The requirements are sorted into three grades. **Grade 1** contains constraints derived from the mathematics of aggregation or the fixed purpose of public justification. **Grade 2** contains practical necessities that are genuine but open to methodological negotiation. **Grade 3** contains constraints that are often presented as neutral but are actually substantive ethical commitments specific to particular camps (utilitarian, prioritarian, etc.).

  ---

  #### Grade 1: Non-Negotiable (Mathematics & Purpose)

  **1. Unit Comparability of Differences**
  *   **Requirement:** The metric must allow the statement "Person A's gain is *k* times Person B's loss" to be meaningful and invariant across observers.
  *   **Case Engaged:** *Comparisons of gains rather than levels.* CBA sums net benefits. To claim a policy costs A more than it gains B requires a common unit of measurement for *changes* in welfare, not just rankings. Without this, distributional weights cannot be mathematically applied to marginal changes.
  *   **Justification:** Follows from the arithmetic of the SWF. If the SWF sums weighted utilities, the utilities must share a common unit scale.

  **2. Procedural Theory Agnosticism**
  *   **Requirement:** The method of eliciting or calculating the metric cannot presuppose a specific substantive theory of well-being (e.g., hedonism, desire satisfaction, objective list) as the sole truth.
  *   **Case Engaged:** *Constitutive disagreement.* One citizen is content via desire satisfaction; another via affective experience. A state CBA cannot declare one account "correct" without violating public justification to the other citizen.
  *   **Justification:** Follows from the purpose of defending weights to disagreeing citizens. The metric must be a "module" compatible with multiple underlying theories of the good.

  **3. Subject-Generality**
  *   **Requirement:** The metric must be applicable to any entity capable of bearing welfare, regardless of its capacity for linguistic self-report or human-like cognition.
  *   **Case Engaged:** *Non-human animals and artificial systems.* If a policy affects animal welfare or potentially sentient AI, the metric cannot rely on human-specific introspection or language.
  *   **Justification:** Follows from the purpose of comprehensive national analysis. Excluding non-reporting subjects arbitrarily biases the CBA against interests that cannot lobby.

  ---

  #### Grade 2: Genuine but Negotiable

  **4. Zero-Point Anchoring**
  *   **Requirement:** The scale must identify a "neutral level" of welfare (a zero point) that distinguishes existence from non-existence or a life worth living from one that is not.
  *   **Case Engaged:** *Non-identity policies.* When a policy changes who comes to exist, we compare existence against non-existence. This requires a zero line that is not merely the bottom of an existing person's scale.
  *   **Justification:** Practical necessity for population ethics. However, it is negotiable because standard CBA often ignores population changes. If the analysis is restricted to fixed populations, a relative zero suffices.

  **5. Elicitation Robustness**
  *   **Requirement:** The procedure for measuring welfare must correct for or bound the variance caused by mood, framing, and transient conditions.
  *   **Case Engaged:** *Self-report drift.* If an "8" depends on whether it rained today, the metric is noise, not signal. The theory must specify a correction protocol (e.g., averaging over time, physiological calibration) rather than stipulating reports are infallible.
  *   **Justification:** Practical necessity for accuracy. Negotiable because the *method* of robustness (statistical vs. physiological) is open to revision.

  **6. Range Normalization**
  *   **Requirement:** The metric must account for differences in the dynamic range of welfare experience between individuals.
  *   **Case Engaged:** *Blunted or restricted affective range.* A person with chronic pain or flattened affect may report an "8" on a scale that spans a much narrower underlying range than a neurotypical person's "8." The metric must adjust for the "width" of the scale, not just the position.
  *   **Justification:** Practical necessity for fairness. Negotiable because it requires a controversial theory of "maximum possible welfare" to establish the ceiling for normalization.

  ---

  #### Grade 3: Sectarian Preferences (Disguised as Constraints)

  **7. Full Level Comparability**
  *   **Requirement:** It must be possible to say "Person A is at a higher absolute level of welfare than Person B," not just that A gained more than B.
  *   **Case Engaged:** *Distributional weights.* Prioritarians need this to identify the "worse off." Utilitarians do not.
  *   **Justification:** This is a preference of the **Prioritarian** camp presented as a constraint. A Utilitarian CBA only requires Unit Comparability of Differences (Grade 1). Demanding Level Comparability imposes a metaphysical burden (a common "zero" and "unit" across persons) that is not mathematically required for all SWFs and is philosophically contentious.

  **8. Scalar Reductionism**
  *   **Requirement:** All dimensions of well-being (health, autonomy, pleasure) must be collapsible into a single real number.
  *   **Case Engaged:** *Constitutive disagreement.* Capability theorists or Pluralists argue welfare is multidimensional and incommensurable.
  *   **Justification:** This is a preference of the **Utilitarian/Aggregativist** camp. It excludes accounts that view welfare as a vector or a lexical ordering. It is presented as a measurement necessity, but it is actually a substantive claim about the structure of value.

  **9. Hedonic Zero-Point Definition**
  *   **Requirement:** The neutral level (zero) is defined as the point of painless neutrality.
  *   **Case Engaged:** *Non-identity.*
  *   **Justification:** This is a preference of the **Classical Hedonist** camp. A Desire Theorist might define zero as "no desires fulfilled or frustrated." Stipulating the *location* of zero substantively biases the outcome of population policies.

  ---

  ### Conflicts Between Requirements

  There is a **real conflict** between **Procedural Theory Agnosticism (Grade 1)** and **Scalar Reductionism (Grade 3)** (and to a lesser extent, Unit Comparability).

  *   **The Conflict:** To achieve Unit Comparability (Grade 1), we generally need a common metric. However, if citizens disagree on what constitutes well-being (Case 2), there is no neutral "substance" to measure. Creating a common scalar metric inevitably privileges one theory of value (e.g., treating all goods as tradable off against each other) over others (e.g., lexical rights or incommensurable capabilities).
  *   **Resolution:** The conflict is real. To satisfy the mathematical purpose (CBA), Theory Agnosticism must be compromised. The specification must adopt a "proxy" metric (e.g., equivalent income, subjective life satisfaction) that functions *as if* it were neutral, while acknowledging it implicitly adopts a specific view of commensurability.

  ---

  ### Judgements on Five Specific Questions

  **1. Is full comparability of levels a requirement or an extra stipulation?**
  It is an **extra stipulation**. Individual utility functions, even if cardinally measurable, deliver nothing regarding interpersonal comparisons without an additional bridging principle. Furthermore, for the specific purpose of CBA, *Unit Comparability of Differences* is sufficient for Utilitarian aggregation. Full Level Comparability is only required if the SWF is Prioritarian (weighting gains to the worse off more heavily). Since the goal is to *allow* for distributional weights, it is a functional requirement for *that specific SWF*, but it is not a requirement of interpersonal comparison *as such*, nor does it follow from individual utility functions alone.

  **2. Is the list jointly satisfiable?**
  **No.** The subset {Procedural Theory Agnosticism, Unit Comparability of Differences, Completeness} cannot be fully satisfied together.
  *   **Why:** *Theory Agnosticism* demands we do not assume a single substantive theory of value. *Unit Comparability* and *Completeness* demand we map all values onto a single, ordered scalar scale. Most substantive theories that deny commensurability (e.g., strong pluralism) will violate Agnosticism if forced onto a scalar scale.
  *   **Which gives way:** *Procedural Theory Agnosticism* must give way. To perform CBA, the state must operationalize *some* metric. It cannot remain perfectly agnostic and still produce a number. It must adopt a "working theory" of welfare (e.g., subjective well-being) while publicly acknowledging it is a proxy.

  **3. Is the ex-ante vs. ex-post aggregation dispute about interpersonal comparison?**
  **No.** It is a dispute about the **structure of the Social Welfare Function** and the treatment of risk, not the input metric.
  *   **Reasoning:** Interpersonal comparison concerns the mapping of individual states to a common scale (the input). Ex-ante vs. ex-post concerns *when* aggregation occurs relative to the resolution of uncertainty (the processing rule). One can have identical interpersonal comparison specifications and still disagree on whether to sum expected utilities (ex-ante) or expected sum of utilities (ex-post). The specification above settles the input (utility), not the timing of the summation.

  **4. Which single requirement excludes the largest share of defended accounts?**
  **Scalar Reductionism (Grade 3, though functionally linked to Grade 1 Unit Comparability).**
  *   **Why:** A vast number of philosophical accounts (Rawlsian Primary Goods, Nussbaum's Capabilities, Griffin's Objective List, many Deontological views) explicitly reject the idea that all aspects of well-being can be collapsed into a single cardinal number without remainder. They argue for lexical orderings, thresholds, or multidimensional vectors.
  *   **Why it is not prejudice:** It is not my prejudice; it is a mathematical necessity of *Cost-Benefit Analysis*. CBA, by definition, seeks a Net Present Value. If an account of welfare cannot be scalarized, it cannot be an input to *this specific procedure*. The exclusion is a feature of the tool (CBA), not the philosopher.

  **5. Can genuine partial comparability be used by a decision procedure without converting it to full comparability?**
  **No, not for Cost-Benefit Analysis.**
  *   **Reasoning:** Partial comparability (e.g., "A is better off than B, but we cannot say by how much") yields a partial ordering. CBA requires a complete ordering to rank policy options definitively (Option X > Option Y). To move from a partial order to a decision, a tie-breaking rule must be introduced. Any deterministic tie-breaking rule that resolves all indifferences effectively reconstructs a complete ordering, thereby implicitly restoring full comparability. To use partial comparability without conversion, the decision procedure must allow for *incompleteness* (i.e., "We cannot decide between X and Y"), which is generally politically unacceptable for national budgeting.

  ---

  ### Closing Note on Main Families of Accounts

  *   **Utilitarianism:** Satisfies Grade 1 (Unit Comparability) and Scalar Reductionism easily but fails Theory Agnosticism (commits to a specific good).
  *   **Prioritarianism:** Requires Full Level Comparability (Grade 3), making it harder to satisfy than Utilitarianism given the metaphysical burden of comparing absolute levels across persons.
  *   **Capability Approach:** Fails Scalar Reductionism and Unit Comparability. It treats welfare as multidimensional. To fit this specification, it must be "flattened" into an equivalent income or functionings index, losing substantive nuance.
  *   **Subjective Well-Being (Hedonic/Experience):** Best fits Elicitation Robustness and Subject-Generality (potentially), but struggles with Theory Agnosticism (excludes desire/objective theorists) and Range Normalization (the blunted affect case).
  *   **Revealed Preference:** Fails Subject-Generality (non-humans/infants) and Theory Agnosticism (assumes choice reveals welfare), and struggles with Blunted Affect (adaptive preferences).

  No existing account satisfies the specification without modification. The specification describes a *political construct* for measurement rather than a discovery of metaphysical truth.
