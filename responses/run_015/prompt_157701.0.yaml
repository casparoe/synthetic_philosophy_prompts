      *   **Better Target:** Step (5) is the primary culprit. It forbids any theory from validating the instruments used to test it. But science works via "reflective equilibrium." We trust instruments *because* the theory works, and the theory works *because* the instruments confirm it. This isn't vicious circularity; it's coherence.
