      *   **(4):** This is the crux of the skeptical push. It claims the *only* explanation for the evidence's status is PH. This is the "Self-Defeating" or "Self-Undermining" worry.
      *   **(5):** The Principle of Inferential Restriction. "Evidence that has the status of evidence only given H cannot supply independent nondemonstrative support for H." This looks like a ban on circularity.
