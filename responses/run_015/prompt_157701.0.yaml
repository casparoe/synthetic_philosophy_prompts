      *   Barry Loewer's view: The "Mentaculus." PH is part of the Best System. It earns its keep by simplifying the laws and maximizing fit.
      *   The user wants to keep (1)-(4). This aligns with Albert/Loewer. So the break must be at (5).
      *   *Crucial Distinction:* (5) says evidence cannot support H if H explains the evidence's status. But in IBE, H is supported *because* it explains the evidence's status better than rivals. The "rivals" part is key. PH wins against "Fluctuation Hypothesis."
      *   *The BB Complication:* If BBs dominate, PH *doesn't* win against Fluctuation Hypothesis regarding *current* experience (since BBs have same experiences). So (3) is indeed threatened. The solution is usually to modify the theory to avoid BB domination (e.g.,宇宙 dies before BBs dominate).

