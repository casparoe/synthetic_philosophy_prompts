          *   *Drop (4):* Medium cost. Need alternative explanation for records. Hard to find.
          *   *Drop (5):* Low cost (philosophically), but requires care. Need to distinguish "coherence" from "dogma." PH is a "transcendental precondition" of empirical knowledge.
      *   **BB Scenarios:** Rejecting (5) doesn't force you to accept BBs. You can reject BBs because the theory that predicts them (Standard Stat Mech + Infinite Time) is *less* empirically coherent than one that doesn't (PH + Finite Time/Measure). The criterion is "Empirical Coherence," not just "Explains my records."

