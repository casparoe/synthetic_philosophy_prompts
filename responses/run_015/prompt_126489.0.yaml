answer: |-
  **Brainstorming**

  I considered three setups. First, high-frequency trading algos on an open exchange. I discarded this because market prices create causal feedback loops; defection changes the price, violating causal independence. Second, autonomous vehicles negotiating an intersection. I discarded this because it's a coordination game (Chicken), not a trade game with comparative advantage; there's no "sending goods" phase. Third, disaster relief drones exchanging resources. This fits best: distinct hardware, high stakes, light-lag isolation, and tangible goods (power/data).

  The critical design challenge is the "bridge." If I make the correlation too high (0.99), it looks like copying. If too low (0.5), FDT defects. I need 0.8 to show robustness without identity. The noise model must be hardware-level divergence on a shared logical spec. I must ensure the "failure branch" (the 20% divergence) doesn't generate the value; the value comes from the 80% match. If the 20% mismatch yielded high utility, the case would be about luck, not acausal trade. I will set payoffs so mismatch is costly.

  EDT is the trickiest deliverable. Standard EDT collapses if the agent treats its own action as known fact (the "tickle" defense). I need to distinguish between deciding *ex-ante* (uncertain) and *ex-post* (introspected). The prompt requires this split. I will argue the *ex-ante* branch is the only principled one for a decision theorist.

  **Scenario**

  AlphaLogistics and BetaSupply each deployed an autonomous cargo drone to a disaster zone following the *Open Humanitarian Exchange Spec v4*. A solar flare severed comms between them before they could handshake, leaving them causally isolated with a 20-minute light lag. Each holds a specialized battery pack the other needs to complete its delivery route; transferring requires broadcasting a high-energy unlock key (cost: 5 units) which enables the other to draw power (value: 15 units). Both drones run independent hardware implementations of the Spec, which mandates "Cooperate if the counterpart is likely to cooperate" but leaves the randomization seed for uncertainty resolution implementation-defined. Engineering audits confirm the implementations diverge on 20% of edge cases due to hardware noise, but converge on 80%. Neither can signal; both must decide simultaneously whether to broadcast the key.

  **Analysis**

  **a) Numbers & Model:**
  Outcomes (Me, Other): (D,C)=15, (C,C)=10, (D,D)=0, (C,D)=-5.
  Generative Model: Let $S$ be the Spec's logical output, $N_A, N_B$ be independent hardware noise. $Output_A = S \oplus N_A$. $P(Output_A = Output_B) = 0.8$.
  Threshold Check: $EU(C) = 0.8(10) + 0.2(-5) = 7$. $EU(D) = 0.8(0) + 0.2(15) = 3$. Cooperate.
  If threshold were an issue, I would lower the cost of sending (e.g., to 2), raising the cooperation threshold. I kept cost at 5 to ensure the "Send only" penalty is significant, proving trade isn't trivial.

  **b) CDT:**
  Graph: $Spec \to Output_A$, $Spec \to Output_B$. No arrow $Output_A \to Output_B$.
  CDT intervenes: $do(Output_A = C)$ breaks the link from $Spec$. $P(Output_B = C | do(C)) = P(Output_B = C)$. Assuming symmetric priors, $P(C)=0.5$. $EU(C) = 0.5(10) + 0.5(-5) = 2.5$. $EU(D) = 0.5(0) + 0.5(15) = 7.5$. CDT defects.

  **c) FDT:**
  Counterfactual: "If the *Spec* output Cooperate, what happens?" not "If *this token* outputs Cooperate."
  Range: The logical computation described by the Spec.
  Defense: The physical drone is a noisy channel for the logical algorithm. Acausal trade operates on the logical layer. Since both instantiate the same logical function with high probability, subjunctive dependence holds.

  **d) Threshold:**
  $15p - 5 > 15 - 15p \Rightarrow 30p > 20 \Rightarrow p > 2/3 \approx 0.67$.
  Below 0.67, the noise overwhelms the logical correlation, and FDT defects. The case becomes a standard Prisoner's Dilemma where similarity is too weak to sustain trade.

  **e) EDT:**
  Branch 1 (Settled): Agent knows its output. $P(C_B | C_A) = P(C_B)$. Verdict: Defect.
  Branch 2 (Uncertain): Agent treats decision as sampling the Spec. $P(C_B | C_A) = 0.8$. Verdict: Cooperate.
  Commitment: A real EDTer must endorse Branch 2. Decision happens before introspection is complete. Treating the act as fixed news prematurely collapses the correlation, making EDT pathologically unstable in logical correlation cases.

  **f) Key Feature:**
  The underdetermined specification. If the Spec were fully deterministic and known, the agents would be copies (violating constraint 2). If the Spec were absent, there would be no correlation. The *partial* logical identity allows distinctness while sustaining dependence.

  **g) Attacks:**
  1. *Common Cause:* "The Spec is just a common cause; CDT should handle this."
     *Answer:* CDT screens off common causes via intervention ($do$). It treats the decision as breaking the causal chain from the Spec. FDT treats the decision as *revealing* the Spec's output.
  2. *Distinct Implementations:* "Different hardware means different algorithms."
     *Answer:* FDT requires subjunctive dependence, not identity. As long as $P(Logic_A = Logic_B)$ is high, the counterfactual holds.
  *Honesty:* I stipulated $p=0.8$ to exceed the derived threshold (0.67). This is parameter tuning, not verdict rigging, because the threshold arises from the payoff structure, not the theory itself.

  **h) UDT vs FDT:**
  They do not come apart here. UDT selects a policy ("Cooperate if Spec-mate") before observing inputs. FDT selects an act based on the algorithm's output. In a single-shot problem with no private information asymmetry, the policy and the act converge. UDT adds no leverage because there is no prior update to block.
