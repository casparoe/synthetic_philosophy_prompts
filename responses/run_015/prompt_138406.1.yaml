  You have identified a genuine gap in the standard lexicon of mechanistic interpretability. The phenomenon you describe is widely recognized by practitioners (often discussed informally as "probe instability," "basis dependence," or "non-uniqueness of steering vectors"), but it lacks a canonical noun phrase that sits alongside "polysemanticity" or "superposition" as a named property of the representation itself.

  The closest established technical concept is **non-identifiability** (from statistics and system identification), which describes when multiple parameter settings yield the same input-output function. However, in interpretability papers, this term is usually reserved for weight-space symmetries (e.g., permuting neurons) rather than the semantic ambiguity of activation directions you are describing. **Underdetermination** is the philosophical parent, but as you noted, it typically applies to theory choice rather than the specific geometry of activation space. **Degeneracy** is used in neuroscience and loss landscape analysis (structurally different elements performing the same function), but it has not been standardized as a label for *semantic feature directions* in the interpretability community.

  Since no single term fits your carve-out tightly enough to distinguish it from polysemanticity (one structure → many functions) or superposition (many features → few dimensions), I will coin one that aligns with the engineering intuition you described.

  ### Coined Term: Feature Degeneracy

  **Definition:**
  **Feature Degeneracy** occurs when multiple, structurally distinct directions (or subspaces) in activation space are empirically indistinguishable with respect to a specific semantic property, as measured by linear probing and steering interventions.

  **The Carving (Edges and Boundaries):**

  1.  **What it is (The Core):**
      *   **Many-to-One Mapping:** It is the inverse of polysemanticity. Instead of one neuron/direction encoding multiple concepts, multiple distinct directions validly encode the *same* concept.
      *   **Empirical Indistinguishability:** The defining condition is that current evidence (probe accuracy, steering efficacy) cannot select between the candidates. Both direction $A$ and direction $B$ steer the model toward "Paris" with equal fidelity, yet $A \neq B$.
      *   **Structure vs. Function:** It highlights a decoupling between the *functional role* (changing the behavior) and the *structural substrate* (the specific vector used to do it).

  2.  **What it isn't (Distinctions):**
      *   **Not Polysemanticity:** Polysemanticity is one channel carrying multiple signals (interference). Feature Degeneracy is multiple channels carrying the same signal (redundancy/ambiguity).
      *   **Not Superposition:** Superposition describes density (more features than dimensions). Feature Degeneracy can exist even in high-dimensional spaces where dimensions are not scarce; it is about the *location* of the feature, not the compression.
      *   **Not Noise/Instability:** Random noise implies the direction jumps unpredictably without maintaining performance. In Feature Degeneracy, the alternative directions are *stable* and *valid*; they are not errors, they are equivalent solutions.
      *   **Not Distributed Representation:** A distributed representation means one concept is spread across many neurons *simultaneously* (a single vector with many non-zero components). Feature Degeneracy means there are multiple *alternative* vectors, any one of which could stand for the concept.

  3.  **Where it Stops (Resolution Conditions):**
      *   **Causal Isolation:** The degeneracy is resolved if a more granular intervention (e.g., causal tracing, path patching, or ablation) shows that only one of the candidate directions is actually *used* by the downstream circuitry, while the others are "causally inert" correlates.
      *   **Convergence:** If increasing data or changing optimization seeds causes the directions to converge to a single vector, the degeneracy was merely an artifact of training variance, not a structural property of the solution space.
      *   **Subspace Collapse:** If it is shown that the varying directions are merely different basis vectors spanning the *same* low-dimensional subspace, the degeneracy is reduced to **Basis Ambiguity** (a linear algebra property) rather than Feature Degeneracy (a semantic representation property).

  **Why this label?**
  "Degeneracy" is borrowed from complex systems and neuroscience (Edelman & Tononi), where it denotes the ability of structurally different elements to perform the same function. It captures your worry precisely: the evidence fails to pick a winner because the system allows multiple winners. It signals that the "representation" is not a unique point in space, but a set of functionally equivalent candidates.

  Verdict: no established term — Feature Degeneracy
