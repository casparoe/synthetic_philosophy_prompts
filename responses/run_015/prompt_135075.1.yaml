      *   *Self-Correction on Materials:* Making physical dials with brads might take too long. Pre-cut paper strips in envelopes is faster. Let's suggest "Slider Decks."
      *   *Self-Correction on Payoff:* Grad students care about intellectual prestige. "The Golden Quine" or just "Bragging Rights" on the syllabus. Let's keep it simple: "Theoretical Capital" on the whiteboard.

