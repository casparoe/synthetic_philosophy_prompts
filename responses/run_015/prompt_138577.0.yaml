answer: |-
  # Handout: The Bootstrapping Decision Tree
  **Reading Group:** Epistemology of Easy Knowledge  
  **Starting Commitment:** We all agree that a single report from a source whose reliability you haven't checked can give you knowledge. (e.g., If the gas gauge says "Full," you know the tank is full, even if you haven't tested the gauge yet).  
  **Goal:** Determine when repeated use of a source allows you to *know the source is reliable*.

  ---

  ## The Tree

  **START:** You accept **Basic Knowledge** (One glance at the gauge = Knowledge of fuel level).

  ### NODE 1: The Track-Record Inference
  **Case:** You check the gas gauge 100 times. Each time, you look at the gauge, then dip the tank. They match 100/100.  
  **Question:** Does this sequence give you knowledge that *"The gauge is reliable"*?  
  *   **NO** $\rightarrow$ Go to **Node 3** (What is the defect?)
  *   **YES** $\rightarrow$ Go to **Node 2** (Does adding a second source help?)

  ### NODE 2: The Two-Source Independence Test
  **Case:** You install two gauges. Unknown to you, they are wired to the **same sensor**. Both match the dipstick 100/100 times.  
  **Question:** Does having two agreeing sources fix the problem, even if they share a single point of failure?  
  *   **NO** $\rightarrow$ **Leaf A** (Independence Required)
  *   **YES** $\rightarrow$ Go to **Node 6** (Modal Profile)

  ### NODE 3: The Defect Diagnosis (Sampling vs. Circularity)
  **Case:** You only dip the tank when the gauge says "Full" (because you're lazy). It is always full. You conclude the gauge is reliable.  
  **Question:** Is the failure here because you used the gauge to decide *when* to check it (**Circular Use**), or because you didn't check any "Empty" readings (**Biased Sample**)?  
  *   **It's the Circular Use** $\rightarrow$ Go to **Node 4** (The LLM Self-Eval)
  *   **It's the Biased Sample** $\rightarrow$ Go to **Node 5** (The LLM Sibling-Eval)

  ### NODE 4: The LLM Self-Evaluation (Circularity Check)
  **Case:** LLM Model A grades its own outputs. It agrees with itself 99% of the time. You conclude A is a reliable judge.  
  **Question:** If this fails, is it specifically because A is judging *itself* (Self-Reference), or because A and its outputs share the same blind spots (Correlated Error)?  
  *   **It's the Self-Reference** $\rightarrow$ **Leaf B** (No Self-Support)
  *   **It's the Correlated Error** $\rightarrow$ **Leaf C** (Correlation Restrictivist)

  ### NODE 5: The LLM Sibling-Evaluation (Sampling Check)
  **Case:** LLM Model A grades the outputs of Model A's Sibling (same family, same training). They agree 99% of the time. You conclude the Family is reliable.  
  **Question:** If this fails, is it because the test set was too easy for the family (**Unrepresentative Sample**), or because they make the **Same Mistakes**?  
  *   **Unrepresentative Sample** $\rightarrow$ **Leaf D** (Sampling Reliabilist)
  *   **Same Mistakes** $\rightarrow$ **Leaf E** (Independence Theorist)

  ### NODE 6: The Modal Profile (Safety)
  **Case:** Back to the 100/100 Gauge. The gauge is actually reliable. But in a very nearby possible world, the manufacturer installed a broken gauge that looks identical, and you would have believed it was reliable anyway.  
  **Question:** Do you know the gauge is reliable, even though your belief could easily have been false?  
  *   **NO** (Knowledge requires safety) $\rightarrow$ **Leaf F** (Modal Restrictivist)
  *   **YES** (Knowledge is internal) $\rightarrow$ Go to **Node 7** (Reflective Level)

  ### NODE 7: The Reflective Level
  **Case:** You know the gauge is reliable. But when a skeptic asks, "How do you know?", you feel you can't say "Because the gauge said so" without sounding silly.  
  **Question:** Do you lack *knowledge*, or do you just lack the ability to *argue* for it without begging the question?  
  *   **You lack Knowledge** $\rightarrow$ **Leaf G** (Hard Restrictivist)
  *   **You lack Argument** $\rightarrow$ **Leaf H** (Level-Splitter)

  ---

  ## The Leaves (Positions)

  | Leaf | Descriptive Label | Standard Name | Most Awkward Commitment | Verdict on LLM-Judge Case |
  | :--- | :--- | :--- | :--- | :--- |
  | **A** | **Independence Required** | Independence Theorist | You cannot confirm a system's reliability using *any* components internal to that system, even distinct ones. | **Fail:** A and its sibling share a training family; you need an external human judge. |
  | **B** | **No Self-Support** | Circularity Theorist | A source can never provide evidence for its own reliability, even indirectly. | **Fail:** A grading A is strictly forbidden, regardless of accuracy. |
  | **C** | **Correlation Restrictivist** | Coherentist / Correlation Theorist | Agreement proves nothing if the sources share the same causal ancestors. | **Fail:** A and Sibling A make the same hallucinations; agreement is worthless. |
  | **D** | **Sampling Reliabilist** | Process Reliabilist (Sampling) | If you force a random sample of hard cases, bootstrapping becomes permissible. | **Pass:** If A grades a random, hard benchmark set, the conclusion is valid. |
  | **E** | **Independence Theorist** | (See Leaf A) | *See Leaf A.* (This leaf is reached via a different diagnostic path). | **Fail:** Same as Leaf A. |
  | **F** | **Modal Restrictivist** | Safety Theorist | You can have perfect evidence and still lack knowledge if the world was slightly different. | **Fail:** A might have been trained on different data where it fails; belief isn't "safe." |
  | **G** | **Hard Restrictivist** | Skeptic about Bootstrapping | You can never know a source is reliable using that source, even if it works perfectly. | **Fail:** We can never know the LLM is a reliable judge using the LLM. |
  | **H** | **Level-Splitter** | Dogmatist / Permissivist | You know it's reliable, but you can't use that knowledge to persuade a skeptic. | **Pass:** A is reliable, but you can't write a paper proving it using only A's outputs. |

  ---

  ## Meta-Analysis: Gaps & Overlaps

  **1. Unoccupied Combinations**
  *   **The "Two-Source Only" Gap:** There is no leaf for someone who says Node 1 (One Source) is **NO** but Node 2 (Two Sources) is **YES**.
      *   *Why:* This is theoretically possible (adding independent sources boosts confirmation), but in the literature, those who reject the one-source track record usually reject the two-source version if the sources are *used* to check each other without prior validation. It is generally seen as unstable: if one source can't validate itself, two mutually validating sources often look like a conspiracy rather than confirmation.
  *   **The "Sampling Yes / Circularity No" Gap:** It is rare to find someone who says biased sampling is fine (Node 3) but circular use is not.
      *   *Why:* Usually, the circularity *creates* the biased sample. Separating them requires a very specific view where the *act* of using the source is the sin, not the *data* produced.

  **2. Indistinguishable Leaves**
  *   **Leaf A (Independence) vs. Leaf E (Independence):** These are labeled the same because they converge on the same requirement, but the tree pulls them apart diagnostically. Leaf A says "Shared sensor is the problem." Leaf E says "Shared training data is the problem." In practice, these are often the same position, but the tree distinguishes *hardware* correlation from *statistical* correlation.
  *   **Leaf F (Modal) vs. Leaf G (Hard Restrictivist):** These are hard to pull apart in the LLM case. If the LLM isn't "safe" (Leaf F), you don't know it's reliable. If you're a Hard Restrictivist (Leaf G), you also don't know. The difference is theoretical: Leaf F allows knowledge in "safe" worlds; Leaf G denies it everywhere.

  **3. How the LLM Case Does Work**
  *   **Node 4** separates **Circularity** (Leaf B: A cannot judge A) from **Correlation** (Leaf C: A and A share blind spots).
  *   **Node 5** separates **Sampling** (Leaf D: The test set was too easy) from **Correlation** (Leaf E: The models are too similar).
  *   This ensures we don't just say "Bootstrapping is bad." We specify *which* kind of bootstrapping fails: self-reference, biased data, or correlated error.
