answer: |-
  This is a remarkably sophisticated set of intuitions. You are not applying a single rigid rule (like "cancel everyone with flaws" or "history is history"); you are weighing **variables** like the type of harm, the function of the space, and the possibility of repair.

  The conflict you feel regarding the **General vs. the Chemist** is the key to unlocking your personal framework. Here is an analysis of the principles your gut reactions seem to be following, and how they apply to the Teacher case.

  ### 1. The Core Principle: Veneration vs. Utility + Repair

  Your decisions seem to hinge on distinguishing between spaces that demand **admiration** (Veneration) and spaces that serve a **function** (Utility), with a third variable being **Restorative Capacity**.

  *   **Veneration (Statues, Monuments, Prizes):** These exist solely to honor. They ask the public to look *up* at the subject.
      *   *Your Rule:* If the subject committed atrocities (General) or the honor was based on a lie (Donor), veneration is illegitimate. A plaque is insufficient because the object itself commands respect that is no longer owed.
      *   *Exception:* The Poet. You kept the Square (Utility/Geography) but renamed the Prize (Veneration). This confirms you distinguish between *naming a place* and *celebrating a legacy*.
  *   **Utility (Buildings, Streets, Squares):** These are tools we use. The name is a label, not necessarily a command to worship.
      *   *Your Rule:* These can retain names if the public benefit is tangible (Mayor's hospital, Chemist's dye), *provided* the harm is acknowledged.
  *   **Restorative Capacity (The Chemist Split):** This is why the Chemist feels different from the General.
      *   In the **General's** case, a plaque is *explanatory*. It says, "He was great, but also bad." It keeps him as the protagonist.
      *   In the **Chemist's** case, renaming the lecture hall after the *victims* is *restorative*. It shifts the focus from the perpetrator to the harmed within the same space. It transforms the building from a shrine to the chemist into a site of conscience.
      *   **Why the General doesn't get this:** A statue is a singular object. You cannot easily "split" a statue to honor the villagers without removing the General. A building has interior space; it allows for a "counter-monument" inside.

  **Coherent Principle:** *We may retain utilitarian names for complex figures if the space allows for active restorative justice (honoring victims), but we must remove honorific monuments where the harm constitutes an atrocity that cannot be contextually balanced.*

  ### 2. Why the General and Chemist Feel Different

  You asked if it's about "honoring actions versus honoring persons" or "spatial scale." It is actually about **Narrative Control**.

  *   **The General:** A monument creates a narrative of heroism. Burning a nearby village undermines the "defender" narrative so severely that the heroism becomes complicit in the atrocity (defending *us* by destroying *them*). A plaque cannot fix a narrative that is fundamentally built on violence.
  *   **The Chemist:** By renaming the lecture hall after the victims, you are hijacking the narrative. The building is no longer "The Chemist's Building"; it is "The Building where we remember the Chemist's Debt." The victims become the moral center of the space.
  *   **The Split:** You are okay with the split for the Chemist because the "split" actively **centers the victims**. You are not okay with a plaque for the General because a plaque **centers the General** (with a footnote).

  ### 3. Applying This to the Teacher Case

  Now, let's look at the park bench for the beloved teacher with private racist views.

  **The Variables:**
  *   **Type of Commemoration:** A bench is intimate. It is closer to a Statue (Veneration/Gratitude) than a Building (Utility). It invites reflection on the person.
  *   **Type of Harm:** Private views, no public action, no impact on students. This is distinct from the General (violence) and the Mayor (structural oppression). This is "moral impurity" without "public harm."
  *   **Relationship:** "Beloved." This implies an emotional debt of gratitude for work actually done (teaching).

  **The Conflict:**
  Your gut is likely split between **Gratitude** (she was good to *us*) and **Exemplarity** (should we honor her *character*?).

  **Testing Your Stance:**
  To resolve this, ask yourself which of your previous cases the Teacher aligns with:

  1.  **Is she the Mayor?** (Public good + Private/Structural bad).
      *   If you view the bench as "Public Infrastructure" (a place to sit), you might keep it with context.
      *   *But* a bench is usually engraved "In Loving Memory." That is a claim about her *soul*, not just her labor.
  2.  **Is she the Donor?** (The honor is based on a false premise).
      *   If the "Beloved" status relies on her being a *good person*, and racism makes her (in your view) not a good person, the honor is void.
  3.  **Is she the Poet?** (Good work + Bad ideology).
      *   You kept the Square (public space) but dropped the Prize (honor).
      *   *Application:* Keep the bench (public utility/memory) but remove the plaque that calls her "Beloved" or "Virtuous," leaving only "Taught here 1980-2000."

  **The Verdict based on your pattern:**
  Your intuition on the **Mayor** suggests you tolerate moral flaws if the public good is tangible and the harm was structural/political rather than visceral violence.
  Your intuition on the **General** suggests you draw a hard line at violence/atrocity.
  Private racism is not violence, but it is an atrocity of character.

  **Prediction:** You will likely feel the bench should stay, **BUT** the inscription must change.
  *   *Why:* Because the bench serves a function (rest in the park) and the gratitude for her teaching is real (unlike the Donor).
  *   *The Catch:* You cannot venerate her *character* (unlike the Statue). You can only acknowledge her *labor*.
  *   *Solution:* The bench remains, but the engraving is altered to remove moral adjectives ("Beloved," "Kind") and stick to factual contribution ("Educator"). This aligns with your **Chemist** logic: Acknowledge the contribution, acknowledge the flaw (by removing the moral praise), without erasing the history.

  ### Summary of Your Ethical Framework

  You are a **Contextual Restorationist**.

  1.  **Remove** honorifics (Statues, Prizes, Monuments) when the harm is violent/atrocious or the basis of the honor is fraudulent.
  2.  **Retain** utilitarian names (Buildings, Streets) when the public benefit is ongoing, *if* the space can be transformed to honor the victims or contextualize the harm.
  3.  **Distinguish** between honoring *labor* (which can be separated from the person) and honoring *character* (which cannot).
  4.  **Require** that any retention of a tainted name must involve active repair (honoring victims), not just passive explanation (plaques).

  **Final advice on the Teacher:** If you keep the bench, do not let it stand as a testament to her *goodness*. Let it stand as a testament to her *work*, and perhaps add a small QR code or plaque nearby that discusses the complexity of separating art/work from the artist. That satisfies your need for nuance (Mayor) without violating your need for moral integrity (General).
