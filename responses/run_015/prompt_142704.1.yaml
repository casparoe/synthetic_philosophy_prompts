  Subject: Draft Joint Statement – Dogmatism Project

  Hey Alex,

  Here's the draft we talked about. It was actually pretty wild getting us to agree on even the preamble, but I think we nailed the common ground. The table is where the real fight is, obviously, but I tried to make sure neither of us sounds like a caricature. The recursive bit on the conciliationist side was the hardest to phrase without making it sound like they're just begging the question.

  Let me know if this works for the reading group.

  Cheers,
  J

  ***

  ### Joint Statement on the Dogmatism Paradox and Peer Disagreement

  **Part I: Areas of Agreement**

  1.  **The Core Tension:** We agree that the Dogmatism Paradox highlights a genuine tension between the closure principle (if I know P, I know anyone denying P is wrong) and the norm of open-mindedness (I should be responsive to counter-evidence). However, we agree this is not a logical contradiction (A & ~A) but a conflict between competing epistemic norms regarding when knowledge claims license ignoring dissent.
  2.  **Formulations:** We agree that formulations of the paradox which suggest knowledge *logically entails* dogmatism are false. The paradox arises only when we assume specific norms about how knowledge interacts with higher-order evidence. The contradiction is avoidable if we clarify the conditions under which a knower is permitted to dismiss a dissenter.
  3.  **Peerhood:** We agree that "epistemic peer" in this context requires equality in competence, honesty, and access to the relevant first-order evidence. Mere disagreement does not establish peerhood, nor does similar credentialing guarantee it if one party has accessed private evidence or made a manifest reasoning error known to the other.
  4.  **The Mirror-Lab Scenario:** We agree that the case of two equally trained researchers reaching opposite conclusions from the same dataset (where both know the other's reasoning) is the decisive test case for our theories. It isolates higher-order evidence from first-order evidence.

  **Part II: Remaining Disagreements**

  | Crux & Case | Steadfastist Stance & Prediction | Conciliator Stance & Prediction |
  | :--- | :--- | :--- |
  | **1. Second-Order Awareness as Defeater vs. Trigger**<br><br>*Case:* In the Mirror-Lab, Researcher A learns Researcher B (a peer) concludes ~P from the same data. | **Stance:** Peer dissent is a *trigger* to re-check first-order reasoning, not an automatic defeater. If the first-order evidence still supports P after checking, confidence need not drop.<br><br>**Prediction:** Both researchers can rationally remain highly confident in their original conclusions after verifying their own calculations, even knowing the peer disagrees. | **Stance:** Peer dissent is higher-order evidence that functions as an automatic *defeater* for justification, independent of first-order re-checking.<br><br>**Prediction:** Both researchers must significantly lower confidence (e.g., split the difference) immediately upon learning of the disagreement, regardless of how solid their first-order check seems. |
  | **2. Self-Application and Skepticism**<br><br>*Case:* In the Mirror-Lab, the researchers also disagree on *how to handle* the disagreement (A says stay firm, B says conciliate). | **Stance:** Applying conciliation principles to themselves leads to global skepticism or an arbitrary stopping point. You can't conciliate about everything without losing the ground to stand on.<br><br>**Prediction:** The Conciliator (B) will be forced to arbitrarily exempt their conciliation principle from revision to avoid skepticism, effectively becoming steadfast about conciliationism. | **Stance:** The conciliation principle can be applied recursively without collapse by treating normative principles as framework constraints that stabilize the process.<br><br>**Prediction:** The Conciliator (B) can lower confidence in their object-level belief while maintaining the normative principle, avoiding skepticism without arbitrary dogmatism. |
  | **3. Holding Firm vs. Ignoring Evidence**<br><br>*Case:* In the Mirror-Lab, Researcher A stays confident in P after hearing B's dissent. | **Stance:** "Holding firm" is distinct from "ignoring" if based on independent first-order reasons. It is rational to weight your own reasoning slightly higher simply because it is yours (the "right-reasons" view).<br><br>**Prediction:** Researcher A is epistemically blameless and rational; their firmness is a proper response to the weight of the first-order evidence they grasp directly. | **Stance:** "Holding firm" without significant revision is functionally identical to "ignoring counterevidence" because the peer's dissent is itself evidence about the reliability of your assessment.<br><br>**Prediction:** Researcher A is being dogmatic; their failure to lower confidence indicates they are improperly dismissing the higher-order evidence provided by B's dissent. |

  ***

  Let me know if you want us to tweak the wording on the recursive bit—it took us like an hour to agree on "framework constraints" vs "arbitrary stopping."

  Best,
  J
