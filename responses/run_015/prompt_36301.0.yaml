      *   *Refinement:* In game theory, the Receiver is rational. If they get fooled, it's because the equilibrium supports it. In philosophy, the Receiver might be "reasonable" but not "omniscient." This is a key friction.

  9.  **Final Polish:** Organize into clear sections: Translation, Residue Report, Evaluation. Ensure the conclusion answers the specific question: "Is it a defect of my vocabulary or evidence the difference is less substantive?"

