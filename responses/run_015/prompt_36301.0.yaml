      *   *Correction:* In GM, if disclosure is voluntary and costless, full unraveling occurs. The User's case is *not* full GM because the message wasn't "I have no accidents" (verifiable false) nor "I have info" (which would unravel). It was a specific cheap-talk claim with a verifiable component. It's more of a cheap-talk model with partial verifiability (Dye 1985 or Jung/Kwon 1988). I should be careful not to conflate cheap talk with hard disclosure. The User said "truthfully... knowing she would hear 'never'." This is a cheap-talk implication on top of a hard fact.
      *   *Refinement:* Distinguish between the *literal content* (verifiable subset) and the *implicated content* (cheap talk inference).
