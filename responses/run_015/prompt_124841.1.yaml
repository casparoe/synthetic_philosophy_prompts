      *   **Parfit-style Reductionism:** Personal identity is just psychological connectedness. If Future Odysseus has different preferences (due to the Siren song), is he the *same* person? If not, is this binding *another* person?
      *   **Hard vs. Soft Commitment:** Hard = physically impossible to violate (ropes). Soft = high cost to violate (crew ordered to kill/ignore).

  3.  **Analyze the Textual Evidence (The Sirens Episode):**
