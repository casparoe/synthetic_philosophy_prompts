      *   *FI Response:* Phenomenal concepts aren't special modes of reference to irreducible properties. They are *outputs of the Framing Mechanism*.
      *   *Argument:* The "feel" of a phenomenal concept (its directness, its immediacy) is the *content* of the framing illusion. We don't need irreducible concepts to explain the *appearance* of irreducibility. We just need a cognitive mechanism that tags certain representations with "INTRINSIC/IMMEDIATE" metadata.
      *   *Result:* PCS explains the *gap* in our concepts, but FI explains *why* that gap exists (the framing mechanism) without positing ontological gaps. It naturalizes the concept.

  4.  **Task 2: First-Person Authority without Epistemic Privilege:**
      *   *The Issue:* Realists say we have privileged access. Illusionists often say we are wrong about our minds. This feels counter-intuitive.
