answer: |-
  Based on the intuitions and verdicts you have provided, here is a formulation of the principles that best capture your reasoning, followed by the necessary adjustments for a unified theory and the prediction for the Paris Commune.

  ### The Principle of Escalating Sovereignty

  **Definition:** Genuine revolutionary autocannibalism occurs when a regime claiming exclusive representation of the "General Will" eliminates internal factions not merely for policy disagreements, but because their existence threatens the regime's monopoly on defining revolutionary virtue. This mechanism is distinct from external conquest (military takeover by non-revolutionary actors) or institutional decay (collapse due to incompetence or corruption).

  **Explanatory Framework:**
  This principle assigns **ideological purification** as the primary driver, mediated by **structural necessity**.
  *   **Girondins (1793):** The explanation is **structural**. The revolutionary government required a unified front to survive external war and internal rebellion. The Girondins' federalism threatened the centralization required for total war. Their elimination was overdetermined by the logic of the emergency state.
  *   **Hébertists & Indulgents (1794):** The explanation is **structural**. Both groups threatened the Committee's monopoly on violence—one by demanding more terror (undermining state control), the other by demanding less (undermining state defense). The center *had* to crush both to maintain the "Golden Mean" of the Terror.
  *   **Robespierre (Thermidor 1794):** To maintain a unified account, the explanation must be treated as **structural**, not contingent. While individual actions (Saint-Just's agility) mattered, the structural pressure had reached a saturation point. The Terror had run out of external enemies and could no longer sustain the level of internal purification required to justify the Committee's power. The system *had* to purge the purger to survive.
  *   **Napoleon (18 Brumaire):** This is **external conquest/decay**. The Directory had lost revolutionary legitimacy; Bonaparte did not claim to purify the revolution but to end it in favor of order. This is the revolution dying, not eating.

  ### Necessary Overturns for the Simplest Unified Account

  To achieve the simplest unified account—one that treats "devouring" as a coherent phenomenon rather than a series of unrelated events—you must overturn two specific intuitions you currently hold:

  1.  **You must drop the idea that Robespierre's fall was genuinely contingent.**
      Currently, you view the Girondin purge as inevitable (structural) but Robespierre's fall as avoidable (agentive). For the simplest theory, you must view Thermidor as the **structural exhaustion** of the autocannibalistic mechanism. Just as the machine inevitably ate the Girondins to centralize power, it inevitably ate Robespierre once centralization was complete and the Terror became a liability rather than an asset. Attributing it to Saint-Just's lack of agility introduces a variable (individual competence) that complicates the structural model.
  2.  **You must stop treating the Thermidorian Reaction as mechanistically distinct from the Hébertist/Indulgent purges.**
      You currently struggle to explain why Thermidor (outsiders destroying the center) is different from the Committee destroying the factions (center destroying outsiders). For a unified account, Thermidor must be viewed as the **final stage of autocannibalism**. The Convention (the body) finally turned on the Committee (the head) because the logic of suspicion had expanded until no one was safe. It is the same mechanism operating at its limit. If you distinguish them too sharply, you fracture the definition of "devouring."

  ### Necessary vs. Contingent

  Given your conflicting intuitions about Girondin inevitability versus Danton's hypothetical survival, the resulting principle treats revolutions devouring their children as a **necessary structural feature** of the radical phase, but one that has a **terminal point**.

  *   **Why Necessary:** As long as the revolution defines itself by opposition to enemies and claims a monopoly on virtue, it *must* identify new enemies as old ones are defeated. This makes the consumption of the Girondins, Hébertists, and Indulgents structurally necessary.
  *   **The Danton Counterfactual:** Your intuition that Danton *could* have survived suggests contingency, but under this principle, Danton's survival would have merely delayed the structural pressure, not removed it. If he had moderated the Terror successfully, he would have ceased to be a "revolutionary architect" in the radical sense and become a "state builder" (like the Directory later). Therefore, the *Revolution* (as a radicalizing force) would still have devoured the *Radical*, even if the *Man* survived.
  *   **Conclusion:** Autocannibalism is necessary so long as the revolution remains in a state of radical mobilization. It ceases only when the revolution transitions into a state (Thermidor/Directory/Napoleon).

  ### Prediction: The Suppression of the Paris Commune (1871)

  Applying the **Principle of Escalating Sovereignty** to the suppression of the Paris Commune by the Versailles government (Third Republic):

  **Verdict:** This is **not** an instance of revolutionary autocannibalism.

  **Reasoning:**
  1.  **Sovereignty Claim:** The Versailles government (Thiers) claimed the legitimacy of the legal State and the National Assembly, not the exclusive mantle of a continuing radical revolution. They were acting to restore order and state monopoly, similar to the Directory or Napoleon, rather than to purify a revolutionary will.
  2.  **Directionality:** Autocannibalism requires the revolutionary center to eat its own constituents to maintain momentum. Here, an established (albeit nascent) Republican state crushed an insurgent commune. This fits the **Napoleon/Directory model** (State consolidation/Conquest) rather than the **Committee of Public Safety model** (Revolutionary purification).
  3.  **Prediction:** The principle predicts that if the Commune had succeeded and established a Committee of Public Safety-style government, *then* it would have eventually devoured its own leaders (e.g., conflict between the Jacobin majority and the Proudhonist minority). But Versailles crushing the Commune is the State crushing a revolt, not the Revolution devouring its children.

  ### Summary of the Experiment

  Your intuition to distinguish between "structural autocannibalism" and "agentive purge" is insightful, but for the sake of a unified theory, you should subordinate agency to structure. The "agentive" choices (like signing the Law of 22 Prairial) are better understood as symptoms of the structural pressure rather than independent causes. By accepting that Robespierre's fall was as structurally determined as the Girondins', you resolve the tension between inevitability and contingency, allowing you to classify the French Terror as a single, coherent cycle of autocannibalism that ended only when the revolutionary energy was exhausted by Thermidor.
