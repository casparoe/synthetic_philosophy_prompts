      Here the distinction between dead and living labor buckles. Marx defines constant capital as means of production that transfer existing value to the product, while variable capital (wages) purchases labor power that creates new value. In Adaptive Cut, the machine performs judgment, a trait Marx reserves for living labor. It adapts to material variance, correcting errors before they happen. If this adaptation creates value, then constant capital creates value. This breaks the axiom that only living labor expands value. If the machine creates value, the source of surplus value is no longer exclusively the worker. Consequently, the tendency of the rate of profit to fall is put at risk. Marx argues profit rates fall because capitalists replace workers (variable capital) with machines (constant capital), reducing the sole source of surplus value. But if the machine itself contains value-creating skill, replacing workers does not reduce surplus value potential. The firm can increase constant capital indefinitely without punishing its profit rate. Furthermore, the reserve army of labor—the unemployed keeping wages down—becomes a disappeared army. If workers are not needed even for judgment, they cannot be exploited to generate surplus value at all. The tension Marx relies on, where technological advancement undermines the profit source, vanishes. The firm seems to sustain high profits with near-zero variable capital. This suggests either surplus value can be produced without living labor, or value theory cannot account for automated judgment. The downstream conclusion is that capitalist crisis might not come from falling profits, but from something else, or not at all. The machine is no longer a tool used by labor; it is a substitute for labor's cognitive function. If cognitive function creates value, and the machine has it, the machine creates value. The line between the tool and the worker dissolves. The "fossilized skill" acts like a ghost in the machine, performing labor without being alive. This threatens the coherence of the entire value structure. If value can be stored and reactivated without new labor input, value is not a flow of social labor time but a stock of technical capability.

