          *   Analogy: A government. You don't choose your congressperson individually; the district votes. The congressperson represents everyone, even those who voted against them.
          *   This resolves the voluntariness/compulsion tension. It's not about *associating* with the union members; it's about being *governed* by the bargaining regime.
      *   **Rival Views Ruled Out:**
          *   *Libertarian/Free Market View:* Labor is a contract like any other. Interference violates freedom of contract.
          *   *Syndicalist/Radical View:* Unions should be revolutionary or members-only, not state-sanctioned bureaucrats.
          *   *Pluralist View:* Multiple unions competing (common in Europe).
      *   **Essential vs. Contingent Features:**
          *   *Essential:* Exclusive representation + Ban on individual bargaining. These are the twin pillars.
          *   *Contingent:* Mandatory dues (overturned in *Janus* for public sector, varies in private), specific election procedures.
          *   *Voluntary Membership:* This is actually a later addition (Taft-Hartley), not original to the Wagner Act logic.
      *   **The "Members-Only" / Rival Union Scenario:**
