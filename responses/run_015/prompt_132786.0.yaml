answer: |-
  You have diagnosed the structure of American labor law (specifically the National Labor Relations Act, or NLRA) with impressive precision. Your intuition is correct: the tension you feel isn't a bug, but it isn't exactly "democracy" in the electoral sense either. It is a specific legal technology designed to solve a specific economic problem.

  To answer your questions, we have to look at the philosophical and economic architecture underpinning **Exclusive Representation**.

  ### 1. What does this arrangement presuppose?

  The system presupposes that **labor is not a commodity** and that the employment relationship is not a standard market transaction.

  In a standard market (buying apples), individual bargaining is efficient. If you want a discount, you ask. If the seller says no, you go elsewhere. The NLRA presupposes that this model fails in labor markets because of an inherent **power imbalance**. An individual worker usually cannot afford to "go elsewhere" or withhold labor (strike) without facing destitution, whereas an employer can usually withstand the loss of one worker.

  Therefore, the system presupposes that **collective power is the only counterweight to corporate power.** To make collective power effective, it must be monopolistic. If the employer can negotiate with individuals, the collective leverage dissolves.

  **The View of the Workplace:** It treats the workplace not as a private club or a free market, but as a **political polity**.
  *   **Your friend's election analogy** was closer than you gave it credit for, but not in the "presidential" sense. It is closer to a **parliamentary constituency**. In a legislative district, the winner represents *everyone* in the district, even those who voted for the loser. The losers cannot hire their own private lobbyist to write laws just for them that contradict the representative.
  *   **The Union's Role:** The union is not merely an association of friends; it is a **statutory governing body** for the terms and conditions of employment.

  ### 2. What view of contract and strike makes it hang together?

  **The Contract:**
  The system views the Collective Bargaining Agreement (CBA) as a **constitution for the workplace**, not just a contract.
  *   **Individual Contract:** Viewed as inherently coercive due to the power imbalance (adhesion contract).
  *   **Collective Contract:** Viewed as the only way to achieve "industrial democracy."
  *   **The Ban on Individual Deals:** This is the linchpin. If high-performing workers could negotiate better deals, they would peel away from the unit. This leaves the union representing only the least leverage-able workers, weakening the union's ability to strike or bargain. The ban prevents the employer from using the "prisoner's dilemma" to break collective solidarity.

  **The Strike:**
  In this framework, a strike is not a breach of contract; it is a **collective withholding of property** (labor).
  *   Individually, withholding labor is just quitting.
  *   Collectively, it is a lever to shift the distribution of profits.
  *   For the strike threat to be credible, it must be binary: work stops or it doesn't. If 30% of workers cross the picket line to cut individual deals, the strike fails. Therefore, individual bargaining must be suspended during the life of the CBA to preserve the integrity of the collective threat.

  ### 3. What rival views does it quietly rule out?

  This structure aggressively rules out two competing philosophies:

  **A. Libertarian/Free-Market Individualism:**
  This view holds that labor is a service sold by an individual to an employer. Any law preventing a willing worker and a willing employer from agreeing on terms is a violation of freedom of contract. The NLRA explicitly rejects this, arguing that "freedom of contract" in labor is illusory without equal bargaining power.

  **B. Pluralist Unionism (The European Model):**
  In many European countries (e.g., France, Italy), multiple unions can exist in one workplace. They compete for members, and different agreements might cover different groups.
  *   **The US Rejection:** The US system (established by the 1935 Wagner Act) decided that inter-union rivalry weakened labor. It preferred **stability** over **choice**. The goal was "industrial peace." Multiple unions mean multiple grievances, potential jurisdictional strikes (Union A striking against Union B), and administrative chaos. The US chose one voice to ensure one contract and one expiration date.

  ### 4. Is the voluntariness inconsistent with the compulsion? (Club vs. Government)

  You asked if picturing the union as a **club** creates the inconsistency. **Yes, absolutely.**

  *   **If it's a Club:** Then compulsion is illiberal. You shouldn't be forced to be represented by a club you didn't join.
  *   **If it's a Government:** Then compulsion is standard. You are bound by the laws passed by the majority in your district, even if you voted no.

  The NLRA creates a **hybrid**. It is a private association that exercises public-like authority.
  *   **Front-end Voluntariness:** You don't have to attend meetings, vote in internal union elections, or pay dues (in Right-to-Work states or post-*Janus* public sector).
  *   **Back-end Compulsion:** The *terms* you work under are set by the majority.

  **Is it inconsistent?** Legally, no, because the "compulsion" isn't to *associate* (which would violate the First Amendment), but to *accept the bargaining regime*. The Supreme Court has upheld this by arguing that the benefit (higher wages, grievance procedures) outweighs the burden (loss of individual bargaining), and the Duty of Fair Representation (DFR) protects the minority from abuse by the union.

  However, philosophically, there is a tension. It relies on the idea that the union's incentives align perfectly with the dissenters'. When they don't (e.g., seniority rules that hurt young workers), the "no taxation without representation" critique gains traction.

  ### 5. Which features are essential, and which could go?

  **Essential Features (The Load-Bearing Walls):**
  1.  **Exclusive Representation:** One union per unit.
  2.  **Preemption of Individual Bargaining:** The employer cannot cut side deals.
  *Without these two, the system collapses into individual contracting.*

  **Contingent Features (The Trim):**
  1.  **Mandatory Dues/Fees:** Originally, unions could require everyone to pay. *Janus* (public sector) and *Beck* (private sector) rulings have eroded this. The system survives without mandatory dues, though it weakens union resources.
  2.  **The Election Process:** The NLRB election is the current mechanism, but the law could theoretically recognize a union via "card check" (signatures) without a vote. The core is the *majority status*, not the specific ritual of the ballot.
  3.  **Voluntary Membership:** This was actually added later (Taft-Hartley, 1947). The original Wagner Act logic leaned closer to mandatory membership to prevent free-riders. The current "represent everyone, charge no one" model is a political compromise, not a logical necessity of exclusive representation.

  ### 6. What would be lost under a "Members-Only" setup?

  There is a growing legal movement (championed by scholars like Charles Morris) arguing that the NLRA actually *allows* for "members-only" bargaining (where a union bargains only for its members without majority status), but the NLRB has suppressed this for 80 years.

  If we switched to a model where two rival unions could operate in one workplace, bargaining only for their members:

  **What would be gained:**
  *   **Liberty:** Workers could choose a union that matches their ideology (e.g., a militant union vs. a moderate one).
  *   **Accountability:** Unions would have to perform to retain members, rather than resting on a monopoly.

  **What would be lost:**
  *   **Leverage:** This is the big one. If Union A calls a strike, but Union B members keep working, the employer can often survive the strike. The threat of a total shutdown is the union's nuclear option. Fragmentation neutralizes the nuke.
  *   **Solidarity:** It creates a hierarchy within the workplace. Union A members get better benefits than Union B members. This breeds resentment and makes collective action harder.
  *   **Administrative Viability:** Imagine a factory with three different contracts, three different grievance procedures, and three different expiration dates. HR administration becomes a nightmare, and the "industrial peace" the NLRA sought vanishes.
  *   **Protection for the Vulnerable:** Exclusive representation forces the union to represent the least popular, lowest-skill workers (because they are in the unit). In a members-only system, unions might "cream skim"—only recruiting the high-value workers they can get good deals for, leaving the most vulnerable workers with no representation at all.

  ### Summary

  The weirdness you sense is the friction between **liberal individualism** (voluntary association) and **corporatist governance** (exclusive representation).

  The system hangs together only if you accept the premise that **labor markets are uniquely prone to failure** and that **solidarity is a public good** that must be protected from individual defection. It rules out the view that a worker is a free agent selling a commodity. It treats the union less like a gym membership you can cancel and more like a municipal government you are stuck with until the next election cycle.

  If you remove the ban on individual deals, you don't have a union system anymore; you have an employment agency. If you remove the exclusive representation, you have a fragmented guild system. The current US model is a specific attempt to maximize stability and leverage at the cost of individual choice and flexibility. Whether that trade-off is worth it is the central political question of labor law.
