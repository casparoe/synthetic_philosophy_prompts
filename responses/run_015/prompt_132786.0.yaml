      *   **The Core Presupposition (Industrial Democracy vs. Market Contract):**
          *   The system presupposes that labor is not a standard commodity.
          *   It views the employment relationship as inherently unequal (power imbalance).
          *   *Exclusive Representation* is designed to create "countervailing power."
          *   It treats the workplace as a political unit (a polity) rather than a marketplace of individuals.
      *   **Why the Ban on Individual Deals? (The "Real Work"):**
          *   Confirm the user's suspicion. This is the "free rider" and "undercutting" problem.
          *   If individuals can opt out, the union's leverage (strike threat) is diluted.
