  2.  **Initial Assessment & Fact-Checking:**

      *   *Is the user's understanding correct?* Yes, largely. Under the National Labor Relations Act (NLRA), exclusive representation is the norm. Duty of Fair Representation (DFR) applies to all. Individual bargaining is generally prohibited once a union is certified. Membership is voluntary (though dues might not be in non-Right-to-Work states, but *membership* is).
      *   *Is the tension real?* Yes, this is a classic critique and defense of exclusive representation.
      *   *The "Club" Analogy:* The user suspects picturing it as a "club" causes the confusion. This is a crucial insight. It's not a private club; it's a statutory monopoly.

  3.  **Drafting the Response - Section by Section:**

