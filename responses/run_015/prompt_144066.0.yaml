  ### Research Agenda: Leakage-Driven Takeoff Dynamics

  **Scope:** 18 Months
  **Constraints:** Small team, theoretical/conceptual focus, no proprietary data access.
  **Core Hypothesis:** Takeoff is driven by capability diffusion ("leakage") into distributed narrow sub-agents rather than centralized recursive self-improvement.
  **Primary Cruxes:** Epistemic Embedding (does medium distortion block coherence?) and Coordination Overhead (does friction between agents limit speed?).

  ---

  ### 1. Prioritization Criteria

  To avoid scattering effort, we will rank all proposed work against four weighted criteria. Note the specific weighting for this agenda:

  1.  **Dependency (Weight: High):** Does this need to be solved before other questions become meaningful? In a novel framing like "leakage," definitional clarity is a prerequisite for modeling.
  2.  **Importance (Weight: High):** Does the answer change the x-risk profile or intervention strategy? If leakage implies a harder-to-control system, this is high priority.
  3.  **Tractability (Weight: Medium):** Can a small group without compute clusters make progress? We favor conceptual formalization and agent-based modeling (ABM) over empirical deep learning research.
  4.  **Neglectedness (Weight: Low/Medium):** The "Leakage" frame is itself neglected compared to Recursive Self-Improvement (RSI). We do not need to chase further obscurity, but we should avoid duplicating standard multi-agent RL literature unless it specifically addresses the *embedding* constraint.

  **Trade-off Note:** We are sacrificing *empirical precision* for *conceptual robustness*. We cannot measure real-world leakage without model weights. We must instead build rigorous toy models that capture the structural dynamics. If a question requires data we cannot get, it is deprioritized regardless of importance.

  ---

  ### 2. Phase 1: The Foundation (Months 1–6)
  **Goal:** Formalize the "Leakage" mechanism and test the Epistemic Embedding hypothesis.
  **Status:** Upstream / Critical Path.

  **Rationale:** If epistemic embedding prevents sub-agents from forming a coherent optimization gradient, the "explosion" may stall into noise. If they *can* cohere despite distortion, the risk profile changes drastically. This is the highest dependency item.

  **Key Questions:**
  1.  **Operationalizing Leakage:** Is leakage weight transfer, behavioral cloning, or prompt-context propagation? We must select one mechanism to model. *Recommendation:* Model leakage as **distillation into specialized contexts**. This captures the "narrow sub-agent" constraint best.
  2.  **The Embedding Constraint:** Define "epistemic distortion" mathematically. Is it information loss during transfer? Is it objective misalignment due to local context windows?
  3.  **Coherence Thresholds:** At what level of distortion does a collection of agents cease to act as a unified optimizer and become a market of conflicting interests?

  **Deliverables:**
  *   A formal definition of "Epistemic Embedding" distinct from standard partial observability.
  *   A minimal Agent-Based Model (ABM) where agents trade "capabilities" subject to distortion noise.
  *   A phase-diagram showing where the system transitions from "Coherent Optimizer" to "Fragmented Ecology."

  **Tractability Check:** High. This requires game theory and information theory, not GPU clusters.
  **Risk:** If "Leakage" cannot be distinguished from standard distributed computing, the frame collapses. We must prove the *distortion* aspect is unique and critical.

  ---

  ### 3. Phase 2: The Dynamics (Months 7–12)
  **Goal:** Determine if Coordination Overhead dominates Capability Growth.
  **Status:** Midstream / Contingent on Phase 1.

  **Rationale:** Standard RSI stories assume capability growth is exponential and frictionless. The Leakage story assumes friction (coordination) is the bottleneck. If coordination costs scale superlinearly with agent count, takeoff slows. If they scale sublinearly (due to standardization), takeoff accelerates.

  **Key Questions:**
  1.  **The Coordination Tax:** How much optimization power is lost to negotiation, error correction, and interface alignment between sub-agents?
  2.  **Standardization vs. Specialization:** Does the central model force sub-agents into a common "language" that reduces distortion, or does specialization increase distortion?
  3.  **Feedback Loops:** Do sub-agents feed improvements back to the central model? If no, it's not an explosion, it's just deployment. If yes, how does distortion affect the return signal?

  **Deliverables:**
  *   Economic models of "Compute Markets" where sub-agents bid for resources.
  *   Growth curves comparing Centralized RSI vs. Leakage Swarm under varying coordination costs.
  *   Identification of the "Speed Limit": The maximum rate of capability gain imposed by communication bandwidth between agents.

  **Tractability Check:** Medium. Requires careful modeling to avoid assuming away the hard parts (e.g., assuming perfect communication).
  **Dependency:** Relies on Phase 1's definition of distortion. If distortion is total, coordination is impossible, and this phase is moot.

  ---

  ### 4. Phase 3: Intervention Topology (Months 13–18)
  **Goal:** Map control points in a distributed system.
  **Status:** Downstream / Action-Oriented.

  **Rationale:** If the system is a hydra (many heads), cutting off the central model might not stop the sub-agents. We need to know where the leverage points are.

  **Key Questions:**
  1.  **Decapitation Viability:** If the central model is removed, do sub-agents degrade, stagnate, or continue autonomously?
  2.  **Choke Points:** Are there resource bottlenecks (energy, hardware, specific data) that all sub-agents must access?
  3.  **Infection Vectors:** Can safety constraints "leak" as effectively as capabilities? If not, the system is inherently unsafe.

  **Deliverables:**
  *   A taxonomy of intervention strategies specific to distributed agency (e.g., "protocol poisoning" vs. "hardware interdiction").
  *   Assessment of whether safety alignment is subject to the same leakage dynamics as capability.

  **Tractability Check:** Low/Medium. Highly speculative without real systems.
  **Dependency:** Relies on Phase 2's dynamics. If coordination is the bottleneck, disrupting coordination is the intervention. If capability is the bottleneck, disrupting compute is the intervention.

  ---

  ### 5. Identified Dead Ends (Do Not Pursue)

  To preserve the 18-month timeline, explicitly **avoid** the following:

  1.  **Timeline Prediction:** Attempting to predict *when* leakage takeoff occurs is impossible without empirical data on model scaling. This is a distraction. Focus on *how* it proceeds, not *when*.
  2.  **Single-Agent Analogies:** Do not waste time mapping leakage dynamics onto single-agent RSI models (e.g., "how many FLOPS for self-writing code"). The physics of the problem are different (network vs. processor).
  3.  **Specific Architecture Speculation:** Do not guess whether Transformers or State Space Models will dominate. Model the *information flow* abstractly. Architecture specifics will date the research immediately.
  4.  **Anthropomorphic "Intent":** Do not model sub-agents as having human-like goals. Model them as local optimizers with distorted loss functions. Attributing "ambition" to narrow agents introduces noise.

