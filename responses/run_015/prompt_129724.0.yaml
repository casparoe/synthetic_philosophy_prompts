  2. **Temporal Ontology of the Specious Present:** Priority: High, dependent on (1). If (1) holds, the "window" of consciousness is task-relative, not fixed. The question shifts from "when did consciousness occur?" to "what temporal granularity does the control signal require?" This is tractable for philosophers analyzing temporal parts and continuity without needing neural data.
  3. **Phenomenal vs. Access Dissociation:** Priority: Medium. Does the O/S distinction apply to phenomenal character or just access? If PP equates them (global ignition), the distinction collapses. If phenomenal character persists independently of report (overflow), O/S might remain valid for phenomenology even if report is constructive. This requires conceptual clarity on "phenomenality" distinct from functional access.
  4. **The Normativity of Report:** Priority: Lower. If reports are actions, are they subject to truth norms? If not, "fabrication" loses its pejorative force. This is conceptually rich but downstream of (1).
  Dependency analysis is crucial: If (1) confirms functional equivalence, (2) and (4) become questions of descriptive convenience rather than metaphysical reality. If (1) fails, (3) becomes the critical battleground for preserving the distinction. If phenomenal overflow exists, the binary might survive in the phenomenal domain even if lost in the access domain.

  (3) What evidence or conceptual argument would most shift the ranking
  A formal proof demonstrating distinct computational signatures for revision versus construction in hierarchical Bayesian models would elevate empirical tractability, making the distinction experimentally decidable. Conversely, a rigorous phenomenological argument establishing that subjects can distinguish "felt revision" from "felt fabrication" independent of report would restore the distinction's primacy. Without such arguments, the control-signal view dominates by default due to parsimony. Currently, the lack of a formal criterion for "completed experience" in PP models keeps the question open. Conceptual work defining "completion" within a continuous inference framework is the specific bottleneck. This definition determines whether 'revision' is a coherent concept in continuous systems.

  (4) Honest limitations, including which feature of the debate this framing cannot capture
  This framing risks eliminating the phenomenal residue. It focuses heavily on access, report structure, and functional roles, potentially ignoring the *quality* of temporal experience itself. The O/S distinction originally aimed to preserve the reality of experience against behaviorism; a purely functionalist PP account might explain the report while leaving the "what it is like" of temporal flow unaddressed. Furthermore, this approach assumes consciousness is fully capturable by inference models, neglecting non-conceptual or embodied aspects of temporality that might resist formalization. It cannot capture the subjective feeling of continuity if that feeling is non-computational or relies on embodied dynamics not reducible to error minimization.
