      *   *(2) Carr + Procedural Objectivity:* Facts are selected/arranged by present concerns (Carr), but objectivity is possible as *procedure*, not metaphysics.
      *   *(3) Whitean Tropes:* Narratives *necessarily* deploy master tropes; choice is *not* empirically determined by the archive.
      *   *(4) Archival Friction:* Some narratives suppress/misrepresent sources; others let sources constrain the plot. Friction is real, even if the archive is institutionally constituted.
      *   *(5) Evo Psych Correction:* We have default narrative biases (e.g., tragedy); we should correct these against the archive. Knowledge is possible despite bias.
      *   *(6) Anti-Representationalism + Robust Wrongness:* Historians can be *robustly wrong* (non-pragmatic), yet historical statements do *not mirror* a mind-independent past (reject representationalism).

