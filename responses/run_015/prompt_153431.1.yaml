      *   *4 & 6:* **Major Flashpoint.** (4) relies on "archival friction" to distinguish good/bad narratives based on source fidelity. (6) rejects representationalism (mirroring mind-independent past) but insists on "robust, non-pragmatic" wrongness. How can you be robustly wrong about a past you deny mirrors reality, without sliding into pragmatism or coherence theory?
      *   *5 & 3:* Evo psych says correct defaults against archive. White says archive doesn't determine trope. If the archive doesn't determine the trope, how do you correct the trope against the archive?
