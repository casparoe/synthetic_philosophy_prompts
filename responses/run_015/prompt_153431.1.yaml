      *   *Decision:* The incoherence in (6) is the root rot. However, the tension between White (3) and your usage of the archive (4, 5) is where the theory will fail in application.
      *   *Better Single Revision:* Modify (3). White is often overstated. If you claim the archive *probabilistically* constrains tropes (rather than not determining them at all), you solve the (3)/(4)/(5) cluster. But (6) remains a philosophical mess.
      *   *Best Single Revision:* Modify (6). Adopt "Epistemic Realism" without "Naive Representationalism." This allows robust wrongness (failure to track causal traces) without needing a "mirror." This resolves the justification for (4) and (1) as well.

