          *   *Severity:* Critical. This is the philosophical engine room. If this breaks, the whole profile collapses into incoherence or silent pragmatism.

      *   **Tension C: Rankean Ideal (1) vs. Anti-Representationalism (6).**
          *   *Commitment 1:* "Show how things actually were" is the ideal.
