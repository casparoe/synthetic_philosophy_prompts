answer: |-
  In the town of Equilibrium, the City Council passed the "Expected Utility Disclosure Ordinance." The logic was sound: to prevent wasted civic effort, no citizen was permitted to cast a ballot unless they first hand-wrote a calculation showing that the probability of their vote breaking a tie, multiplied by the value of the policy difference, exceeded the cost of their time spent traveling to the polls.

  On election day, the polling station was silent. There were no lines, no arguments, only the soft scratching of pencils on paper as citizens worked through binomial distributions based on projected turnout. One by one, they reviewed their work. The population was 10,000. The projected margin was standard. The probability of a single vote deciding the election came out to roughly 1 in 50,000. The cost of time was $20. The expected benefit was $0.40.

  Rationally, every citizen folded their calculation, placed it in the "Disclosure" box, and walked home without casting a ballot. Turnout was exactly zero.

  That evening, the Town Actuary met with the Mayor to certify the results.

  "The ballot box is empty," the Mayor said.

  "Correct," said the Actuary. "Zero votes for the incumbent, zero for the challenger."

  "So it's a tie?"

  "Technically, yes. A 0-0 tie."

  "And ties are broken by..."

  "By the rule that a single vote would have decided the outcome. Which means, in retrospect, the probability of any single vote breaking the tie was not 1 in 50,000. It was one hundred percent."

  The Mayor paused. "So the calculations everyone submitted were false?"

  "Mathematically, yes. By acting on the assumption that their vote didn't matter, they ensured that it did. The act of calculating the futility created the futility, which invalidated the calculation."

  "So what is the status of the election?"

  "Invalid. Every citizen submitted a false declaration to exempt themselves from voting. Under the Ordinance, the penalty for a false declaration is a fine equal to the total cost of holding the election."

  "And the total cost of the election?"

  "Including staffing, heating, and paper: $15,000."

  The Mayor did the math. "There are 10,000 voters. If we fine them all..."

  "The total revenue is $150 million. Which is roughly three hundred times the annual budget of the office we were voting to fill."

  The Mayor rubbed his temples. "So, by rigorously applying the logic that voting was too costly to be worth it, the town has incurred a cost that makes voting look like a bargain?"

  "Precisely. The rational choice was to vote. But the only way to know that was to not vote."

  "So what do we do?" asked the Mayor. "Do we repeal the Ordinance?"

  "We can't," said the Actuary. "To vote on repealing the Ordinance, they have to submit a new calculation."

  "And will they?"

  "They're currently calculating the odds that their vote will repeal the law that fined them. But since the fine depends on the turnout, which depends on the calculation..."

  The Mayor sighed. "So we're stuck in a loop?"

  "No," said the Actuary, picking up the empty ballot box. "We switch to a lottery. We put all the names in a hat and draw one Mayor."

  "Is that democratic?"

  "No. But the hat doesn't do math. And for the first time in history, the probability of any single name being picked is exactly what we say it is."
