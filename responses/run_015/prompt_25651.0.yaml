answer: |-
  # Seminar Handout: Where Does Your Mind Stop?
  **A Decision Tree for the Extended Mind Debate**

  **Instructions:** Start at the top. Answer the questions based on your gut reaction to the cases. Follow the arrows to find which philosophical position matches your intuitions. Don't worry about the technical names until you reach the end.

  ---

  ### 🟢 START: The Otto & Inga Case
  **Otto** has Alzheimer's and uses a notebook to store information (e.g., "MoMA is on 53rd St"). He always carries it and trusts it implicitly.
  **Inga** has normal biological memory. She recalls "MoMA is on 53rd St" from her brain.

  **Q1:** When Otto looks up the address in his notebook, is that act **part of the process of remembering** (like a neuron firing), or is it just **using a tool to help him remember** (like using a cane to walk)?

  *   **A. It is PART of the process.** (The notebook is literally a piece of his memory system.) → *Go to Q2.*
  *   **B. It is JUST A TOOL.** (The notebook is outside his mind, feeding info into it.) → *Go to Q4.*

  ---

  ### 🔵 PATH A: The Notebook is Part of the Process

  **Q2:** If the notebook is part of the mind, *what* is it doing? Is it **storing a representation** (like a file in a cabinet) or is it enabling **skillful action** (like knowing how to navigate)?

  *   **A. Storing a representation.** (The notebook holds the data just like neurons do.) → *Go to Q3.*
  *   **B. Enabling skillful action.** (Memory isn't about storage; it's about knowing how to find/access info when needed.) → **🍃 LEAF 1: Enactivism / Sensorimotor View** *(e.g., Noë, Hutto & Myin)*

  **Q3:** Does this apply to *any* reliable tool (e.g., Google, a calculator), or only tools that are tightly integrated (like Otto's notebook)?

  *   **A. Only tightly integrated tools.** (There must be "trust and glue" between user and tool.) → **🍃 LEAF 2: Extended Mind (Conservative)** *(Clark & Chalmers)*
  *   **B. Any reliable tool.** (If you use it consistently, it's part of your mind.) → **🍃 LEAF 3: Radical Extended Mind** *(A more extreme version of externalism)*

  ---

  ### 🟠 PATH B: The Notebook is Just a Tool

  **Q4:** Even if the notebook is just a tool, does Otto's brain **need** the notebook to function as a cognitive system? Could his brain do the exact same job alone if forced to?

  *   **A. Yes, the brain could do it alone.** (The tool just makes it easier/faster, but the cognition is all in the head.) → *Go to Q5.*
  *   **B. No, they work as a unit.** (The brain is designed to offload work; the "system" is Brain + Tool, even if the tool isn't *mind*.) → **🍃 LEAF 4: Embedded Cognition** *(e.g., Rupert)*

  **Q5:** You think cognition is inside the head. But *what* is inside the head? Is it just the biological organism, or does the content of thought depend on the outside world?

  *   **A. Just the biological organism.** (Cognitive processes are non-derived, internal biological processes.) → **🍃 LEAF 5: Organism-Centered Internalism** *(Adams & Aizawa)*
  *   **B. Content depends on the world.** (My thoughts are about "MoMA" because of my history with the world, even if the processing is internal.) → **🍃 LEAF 6: Content Externalism / Internal Vehicle** *(e.g., Putnam/Burge compatible)*

  ---

  ### ⚪ UNOCCUPIED LEAVES (Logical Possibilities No One Defends)
  *If your answers led you here, you hold a position that is logically possible but generally considered incoherent or unmotivated by philosophers.*

  **🍃 LEAF 7: The "Magic Notebook" (Constitutive but Inert)**
  *   **Path:** You said the notebook is **Part of the Process** (Q1-A), but you also think it **doesn't actually cause or influence behavior** directly.
  *   **Why Unoccupied:** This is **Incoherent**. In philosophy of mind, to be "part of a cognitive process" usually means playing a causal role in generating thought or action. If it doesn't *do* anything, it can't be part of the *process*.

  **🍃 LEAF 8: The "Telepathic Tool" (Causal Tool but External Mind)**
  *   **Path:** You said the notebook is **Just a Tool** (Q1-B), but you claim **the mind is located in the notebook**, not the head.
  *   **Why Unoccupied:** This is **Contradictory**. If the notebook is merely a causal tool (like a hammer), the agent using it is the mind. If the *mind* is in the notebook, then the notebook is constitutive (Path A), not just a tool.

  ---

  ### ⚠️ WARNING: Hard-to-Distinguish Positions

  **1. Extended Mind (Leaf 2) vs. Embedded Cognition (Leaf 4)**
  *   **The Problem:** Both agree that Otto + Notebook function as a unified system.
  *   **The Difference:** Extended Mind says the notebook is *literally part of the memory*. Embedded says the notebook is *essential scaffolding* for the internal memory.
  *   **Why the Tree Struggles:** Case-based intuition (like Otto/Inga) often yields the same "Yes, they are similar" answer for both. Distinguishing them often requires metaphysical arguments about "constitution" vs. "causation" rather than just case judgments.

  **2. Enactivism (Leaf 1) vs. Extended Mind (Leaf 2)**
  *   **The Problem:** Both reject strict internalism.
  *   **The Difference:** Extended Mind usually accepts that the brain computes representations (just some are outside). Enactivism often rejects representation entirely (cognition is action, not processing).
  *   **Why the Tree Struggles:** Q2 tries to separate them, but some Extended Mind theorists talk about "action-oriented representations," blurring the line.

  ---

  ### 📝 Summary of Positions

  | Leaf | Position | The Gist |
  | :--- | :--- | :--- |
  | **1** | **Enactivism** | Cognition isn't thinking; it's doing. The world is not a database, it's a landscape for action. |
  | **2** | **Extended Mind** | The mind is where the process is. If the notebook does the work of a neuron, it's part of the mind. |
  | **3** | **Radical Extended Mind** | If you trust it, it's you. Smartphones, calendars, and friends are all literal parts of your cognitive system. |
  | **4** | **Embedded Cognition** | The brain is the engine, but it can't run without the environmental fuel. The system is coupled, but the mind stays in. |
  | **5** | **Internalism** | Skin and skull are the boundaries. Tools are inputs, not parts. Cognition is a biological affair. |
  | **6** | **Content Externalism** | The *processing* is internal, but *what you think about* is determined by your environment. |
  | **7** | **Unoccupied** | **Incoherent:** Claims something is part of a process but does nothing. |
  | **8** | **Unoccupied** | **Contradictory:** Claims something is a mere tool but also the location of the mind. |
