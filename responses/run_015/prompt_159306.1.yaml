answer: |-
  # Joint Statement on Neural Computation: An Adversarial Collaboration

  **Authors:** [Realist Name] & [Ascriptivist Name]
  **Date:** Spring 2024
  **Context:** Philosophy of Mind Seminar Workshop

  ### I. Agreed Claims

  We disagree on the metaphysical status of neural computation, but we agree on the constraints any theory must satisfy. We jointly endorse the following claims:

  1.  **Underdetermination of Models:** For any finite set of empirical data regarding a neural circuit's behavior, there are indefinitely many formal models that fit the data equally well. Most of these models are scientifically useless. Utility, not mere fit, is the primary filter for theory choice.
  2.  **The Pragmatic Criterion:** The credentials of a computational model in neuroscience are earned through successful prediction and intervention. If a model allows us to manipulate a system to produce a target outcome, it has scientific value, regardless of whether the model corresponds to an intrinsic property of the tissue.
  3.  **Physical Constraints:** The brain is a messy, wet, partly analogue, noise-ridden physical object. It is not a tidy, discrete symbol manipulator like a standard desktop computer. Any claim that the brain "computes" must be consistent with the continuous, stochastic, and energy-constrained nature of biological tissue.
  4.  **Indispensability:** Computational language is currently indispensable for cognitive science. Abandoning terms like "encoding," "processing," or "algorithm" would halt progress in modeling perception, action, and cognition, regardless of the metaphysical resolution of this debate.
  5.  **No Magic:** Computational descriptions do not invoke non-physical forces. If computational properties explain behavior, they must do so in virtue of the physical dynamics of the system, not alongside them.

  ### II. Points of Crux

  We have identified three specific areas where our views diverge. For each, we specify how we frame the issue, the empirical case we agree is relevant, and the predictions we make regarding that case.

  | Crux | Realist Formulation | Ascriptivist Formulation | Agreed Test Case | Divergent Predictions |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. The Status of the Mapping** | Computation is a relation between physical states that exists independently of an observer. There is a fact of the matter about which variables in a model correspond to real physical variables in the brain. | Computation is a relation between a physical system and an observer's mapping scheme. There is no fact of the matter about which mapping is "correct," only which is more useful for a given purpose. | **The Degenerate Model:** A model perfectly predicts a circuit's output under all current interventions, but its internal state variables map onto no distinct physical properties of the tissue (e.g., they are distributed across all ions). | **Realist:** The model is incomplete or false. It predicts well by accident or approximation; it does not identify the computation the circuit is *performing*.<br>**Ascriptivist:** The model is valid. If it supports intervention, the ascription is successful. Demanding a 1:1 variable match is a metaphysical hang-up, not a scientific requirement. |
  | **2. Grain and Continuity** | There is a correct level of abstraction at which the neural process *is* a computational process. Below this level, there is only noise; above it, there is only approximation. | Any level of abstraction can support a computational ascription if it yields utility. There is no "correct" level, only levels that are more or less robust to physical variation. | **The Timing-Sensitive Circuit:** A circuit whose function collapses if input timing is discretized coarser than 0.5ms, suggesting the "computation" depends on precise analogue dynamics. | **Realist:** This suggests the system is not computing in the standard sense, or we have not yet found the correct discrete abstraction. True computation must be implementation-insensitive.<br>**Ascriptivist:** This shows that "computation" is a flexible label. We can define a computational model that includes timing as a parameter. The label stretches to fit the physics, not vice versa. |
  | **3. Explanatory Surplus** | Saying a circuit "computes X" explains *why* the physical dynamics are structured as they are. The computational role constrains the physical implementation. | Saying a circuit "computes X" is a shorthand for saying "the physical dynamics are structured such that we can predict X." It adds no causal power to the explanation. | **Cross-Species Transfer:** An intervention derived from a computational model in Species A is successfully applied to Species B, despite radically different neural physiology. | **Realist:** This succeeds because both species instantiate the same computational kind. The computation is the shared natural kind explaining the convergence.<br>**Ascriptivist:** This succeeds because the *mapping strategy* is portable. We are applying a useful lens to different substrates, not finding the same intrinsic object in both. |

  ### III. On the Merely Verbal

  A significant portion of our debate concerns the definition of the word "computation." We offer the following assessment of how much of our dispute is verbal versus substantive.

  **The Verbal Core**
  We agree that if "computation" is defined strictly as discrete symbol manipulation (like a Turing machine), the brain does not compute. If "computation" is defined loosely as "any physical process that can be mapped to a mathematical function," then everything computes, and the term loses its explanatory bite. Much of our friction arises from the Realist wanting to reserve the term for the former (or a naturalized middle ground) and the Ascriptivist accepting the latter provided it is useful. If we simply agreed to use the term "useful mathematical modeling" instead of "computation," the heat of the dispute would diminish significantly.

  **The Substantive Remainder**
  However, we reject the idea that the dispute is *merely* verbal. The disagreement drives different research heuristics.
  *   **The Realist's Heuristic:** Search for the *one* true model. If a model works but its variables don't map to physical structures, keep looking. The goal is to carve nature at its joints.
  *   **The Ascriptivist's Heuristic:** Search for the *most robust* model. If a model works, use it until it breaks. Do not worry if the variables are physically diffuse; worry only if the intervention fails.

  **Conclusion on the Verbal Dispute**
  We conclude that the dispute is verbal only in the sense that we are fighting over the ownership of a specific label ("computation"). It is substantive because that label carries baggage about how to conduct neuroscience. The Realist fears that the Ascriptivist view makes computational explanation too easy (trivializing it). The Ascriptivist fears that the Realist view makes computational explanation too hard (stalling it while waiting for a metaphysical fact that may never arrive).

  We recommend that students treat "the brain computes" not as a settled fact, but as a methodological stance. When you adopt the computational stance, ask yourself: Am I looking for the intrinsic mechanism (Realist), or am I building a tool for control (Ascriptivist)? Both are valid scientific activities, but confusing them leads to the kind of talking-past-each-other we hope to avoid today.
