      *   *Decision:* The **Exploitability Constraint** is the most dangerous for the "Hard Choice" theories (Parity/Voluntarism) because it forces them to explain why you can't be pumped. The **Sweetener Sensitivity** is the most dangerous for the "Easy Choice" theories (Single Currency/Vagueness) because it demands a structural break, not a continuum. I will highlight **Sweetener Sensitivity** as the one that kills the "it's all just math/vagueness" crowd, and **Exploitability** as the one that haunts the "it's parity" crowd. I need to pick *one*. I'll pick **Exploitability** because for a rationalist audience, being money-pumped is the ultimate sin.

      *   *Re-evaluating "Lab Coats":* Transitivity is the big one. If you demand transitivity of 'better than', parity is impossible by definition. That's begging the question.

  8.  **Final Polish:** Ensure tone is sharp, rationalist-friendly but respectful of the ethicist's domain. No fluff.

