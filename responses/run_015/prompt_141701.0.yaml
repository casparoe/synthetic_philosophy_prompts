      *   **Distinctions to Maintain:** Incomparability vs. Parity vs. Equality vs. Vagueness vs. Ignorance vs. Incompleteness; Values vs. Options; No Fact vs. Unknown Fact vs. Constituted Fact; Hard-World vs. Hard-Us.
      *   **Key Insight Required:** Identify tensions/trade-offs between desiderata (which pairs can't be jointly satisfied).
      *   **Critique:** Identify the single most exclusionary requirement and which requirements are just "aesthetic preferences wearing a lab coat."
      *   **Scoring:** Briefly score four specific views (Parity/Voluntarist, Vagueness, Ignorance, Single Currency) against the list.
