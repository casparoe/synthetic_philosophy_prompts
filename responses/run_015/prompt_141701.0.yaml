      *   *Need:* Explain grain issues. -> **The Resolution Constraint.** (Is it vagueness or structural?).
      *   *Need:* Handle transformative choices. -> **The Continuity Constraint.** (How to value when the valuer changes?).
      *   *Need:* Avoid money pumps. -> **The Exploitability Constraint.** (Rationality shouldn't lead to sure loss).
      *   *Need:* Explain advisor asymmetry. -> **The First/Third Person Constraint.** (Why advice differs for self vs. other).
      *   *Need:* Handle regret/wronged values. -> **The Remainder Constraint.** (Moral residue exists).
      *   *Need:* Handle public policy. -> **The Institutional Constraint.** (Can institutions face hard choices?).

      *   *Distinctions to Preserve:* (As listed in prompt).

  3.  **Identify Tensions (The "Interesting Result"):**
      *   *User's Candidate (a):* Permissibility vs. Money Pump. If A and B are on a par, I can pick either. But if I can switch back and forth with small costs, I'm pumped. *Verdict:* This is a real tension. Parity theories struggle here.
      *   *User's Candidate (b):* No Fact vs. Can Get it Wrong. If there's no fact, how can I be wrong? Voluntarism says I create the fact *by* choosing, but can I choose badly? *Verdict:* This is the core metaphysical tension.
      *   *User's Candidate (c):* Rare/Serious vs. Everywhere. If incommensurability is common, "shut up and multiply" is dead. If rare, it's a niche edge case. *Verdict:* This is more empirical/scope-based.

      *   *My Addition:* The **Exploitability Constraint** vs. The **Permissibility Constraint**. If two options are truly rationally permissible (parity), you should be able to switch. But switching allows pumping. To block pumping, you need a "stickiness" that looks like a fact of the matter.
      *   *My Addition:* The **Institutional Constraint** vs. The **First-Person Constraint**. Institutions need public justification (reasons). If the reason is "I willed it," that works for agents, not bureaucracies.

  4.  **Evaluate the "Aesthetic Preferences Wearing a Lab Coat":**
      *   Transitivity of betterness? Often assumed, but parity breaks it. Is it a requirement or a preference?
      *   Expressibility in decision theory? If the theory can't model it, is the theory wrong or the math limited?
      *   No primitive normative entities? Parsimony is good, but might cut out the phenomenon.
      *   *Selection:* "Transitivity of strict betterness" and "Expressibility in standard expected utility" are the lab coats. They rule out parity by definition, not by argument.

  5.  **Score the Four Views:**
      *   *Parity/Voluntarist (Chang):* Good on permissibility, bad on money pumps (needs "willpower" clause), good on transformative.
      *   *Vagueness (Broome-ish):* Good on sweeteners (sorites), bad on rank switching (looks like irrationality), bad on remainder (vagueness doesn't feel like tragedy).
