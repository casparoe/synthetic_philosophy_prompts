answer: |-
  Here are the desiderata for an adequate theory of hard choices, calibrated to your rationalist background and Wren's clinical reality.

  ### The Desiderata

  1.  **Sweetener Sensitivity (NN):** If A and B are genuinely hard (on a par), adding a trivial sweetener to A (A+) must make A+ strictly better than B. If a theory says A and B are incomparable *even after* adding $5, it treats incommensurability as a barrier to comparison rather than a relation. This distinguishes "hard" from "category error."
  2.  **Stability Without Facts (NN):** Must explain Wren's Tuesday/Thursday switching without labeling her irrational. If there is no fact of the matter about betterness, oscillation is permissible. If there *is* a fact (even unknown), oscillation is error.
  3.  **Exploitability Block (NN):** A rational agent cannot be money-pumped. If A is on a par with B, and B with C, the theory must explain why the agent isn't forced into a cycle of switching costs. Permissibility cannot equal indifference.
  4.  **The Advisor Gap (NN):** Must explain why "just pick" is valid advice *for* Wren but feels like a category error *to* Wren. The theory must distinguish first-person constitution of reasons from third-person observation of reasons.
  5.  **Tragic Remainder (CP):** Choosing A over B must leave a normative residue (regret/wronged value) that isn't just "I wish I had the utility of B." This is non-negotiable for Wren's ethicist frame, but a rationalist might try to reduce it to "cost of opportunity." I mark it CP because a hard-nosed utilitarian will deny it, but you need it to talk to Wren.
  6.  **Institutional Scalability (NN):** The account must work for public policy (wetlands vs. lives). If incommensurability is purely first-personal voluntarism, institutions collapse. If it's purely ontological, institutions freeze.
  7.  **Distinction Preservation (NN):** The theory must not collapse:
      *   *Incomparability* (no positive value relation) vs. *Parity* (a fourth positive value relation).
      *   *Vagueness* (borderline cases) vs. *Incommensurability* (structural).
      *   *Ignorance* (fact exists, we don't know) vs. *Indeterminacy* (no fact exists).
      *   *Hard-World* (values clash) vs. *Hard-Us* (psychological limitation).

  ### The Impossible Pairs (Tensions)

  You asked which pairs suspectably cannot be jointly satisfied.

  **(a) Permissibility vs. Exploitability:** This is the sharpest tension. If A and B are rationally permissible (Parity), I can choose A. If I later encounter B again, and they are still on a par, can I switch? If yes, I am pumpable (paying to switch back and forth). If no, what changed? The standard Voluntarist fix is "commitment creates a new fact," but that risks collapsing Parity into "created betterness." You cannot have full permissibility *and* full transitivity without a mechanism that locks the choice.
  *Verdict:* Jointly satisfiable only if "rational permissibility" is time-indexed or commitment-sensitive.

  **(b) No Fact vs. Can Get It Wrong:** If there is no fact of the matter, how can I choose wrongly? Voluntarism says you create the reason by choosing. But if I choose lazily or maliciously, did I fail?
  *Verdict:* Jointly satisfiable. The "wrongness" isn't violating a pre-existing fact, but failing to successfully constitute a will. You can botch the act of creation.

  **(c) Rare vs. Everywhere:** This is empirical, not logical. However, if hard choices are everywhere (fine grain), "shut up and multiply" loses its normative force as a default.
  *Verdict:* Jointly satisfiable via the **Resolution Constraint**. Hard choices are rare at the coarse grain of "life paths" (Wren's jobs) but common at the fine grain of "micro-preferences." A theory that says *all* choice is hard is useless; a theory that says *no* choice is hard is false.

  ### The Lab Coats (Aesthetic Preferences)

  These are requirements often demanded by rationalist formalisms that beg the question against hard choices:

  1.  **Transitivity of 'Better Than':** If you demand strict transitivity across all options, Parity is logically impossible by definition. This isn't an argument against parity; it's a refusal to model it.
  2.  **Expressibility in Standard Expected Utility:** If your formalism requires a single scalar utility value, you have built commensurability into the axioms. This excludes the phenomenon you are trying to investigate.
  3.  **No Primitive Normative Entities:** Demanding that all value reduce to natural properties (or preferences) rules out the possibility that "reasons" are sui generis. This is metaphysical parsimony masquerading as methodological necessity.

  **The Single Most Exclusionary Requirement:** **Sweetener Sensitivity.**
  This requirement kills the "It's Just Vagueness" and "It's Just Ignorance" views immediately. If the difficulty is just vagueness, a small sweetener shouldn't resolve the border sharply (Sorites). If it's just ignorance, the sweetener just adds to the unknown sum. Only a structural account of Parity handles the "Small Improvement Argument" correctly (A+ is better than B, even if A is not).

  ### Scorecard

  **1. Parity / Voluntarist (Chang et al.)**
  *   **Sweetener:** Pass. (A+ > B is the definition of parity).
  *   **Stability:** Pass. (Oscillation is permitted until commitment).
  *   **Exploitability:** **Fail/Strained.** Requires a "normative commitment" clause to stop pumping, which looks ad hoc to a rationalist.
  *   **Remainder:** Pass. (Fits the phenomenology of loss).
  *   **Institutions:** **Fail.** Voluntarism is deeply first-personal; hard for a hospital board to "will" a reason into existence publicly.
  *   **Verdict:** Best for Wren, worst for your rationalist reflex on pumps.

  **2. "It's Really Just Vagueness" (Broome-ish)**
  *   **Sweetener:** **Fail.** Cannot explain why $5 resolves the choice without a sharp cutoff (Sorites paradox).
  *   **Stability:** **Fail.** Oscillation looks like irrational indecision, not permissible freedom.
  *   **Exploitability:** Pass. (Vagueness doesn't invite pumping if you assume a hidden fact).
  *   **Remainder:** **Fail.** Vagueness doesn't generate tragedy, just uncertainty.
  *   **Verdict:** Good for avoiding metaphysics, bad for describing the experience of choice.

  **3. "We're Merely Ignorant" (Epistemic)**
  *   **Sweetener:** **Fail.** If there's a true exchange rate, $5 should always tip the scale, but we wouldn't know *when*. This predicts persistent hardness even with sweeteners, contradicting intuition.
  *   **Stability:** **Fail.** Oscillation is epistemic error.
  *   **Exploitability:** Pass. (There is a fact, so don't switch).
  *   **Distinctions:** **Fail.** Collapses "No Fact" into "Unknown Fact."
  *   **Verdict:** Comforting for rationalists, but denies the phenomenon exists.

  **4. "Single Currency with Diminishing Returns" (LEU/Utilitarian)**
  *   **Sweetener:** Pass. (Everything has a price).
  *   **Stability:** Pass. (One option is always better).
  *   **Exploitability:** Pass. (Maximize utility).
  *   **Remainder:** **Fail.** Reduces "wronged value" to "opportunity cost."
  *   **Transformative:** **Fail.** Assumes the utility function is stable across the transformation.
  *   **Verdict:** Best for institutions/policy, worst for Wren's lived experience.

  ### Recommendation for Wren

  Tell Wren this: The **Parity** view is the only one that validates her experience without calling her irrational. It allows her to say, "Neither is better, but I can make one better by committing to it." Warn her that this means she is responsible for the *creation* of the value, not just the *detection* of it. That is why "just pick" feels wrong (it ignores the creative act) but is actually the only move available. For your own sanity: accept Parity for life choices (Transformative/Remainder cases), but default to Single Currency for policy and small stakes to avoid paralysis. The "lab coat" demand for a single number is useful for calculation, but fatal for deliberation.
