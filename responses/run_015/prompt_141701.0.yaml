      *   **The Lab Coats:** Identify Transitivity and Formalizability as the culprits.
      *   **The Scoring:** Rapid fire evaluation.

  7.  **Refining the Argument (Self-Correction during drafting):**
      *   *Check:* Did I address the Advisor Asymmetry? I need to make sure that's in the desiderata or the tensions. It's a specific case. I'll put it in the Desiderata list as "The Advisor Gap."
      *   *Check:* Did I distinguish "Values Incommensurable" vs "Options Incomparable"? Yes, need to ensure the Distinction Preservation section highlights this.
      *   *Check:* The user wants to know which requirement does the *most work* excluding popular candidates. That's likely **Sweetener Sensitivity** (kills Vagueness/ignorance if they claim *all* hard choices are just that) or **Exploitability** (kills naive Parity). Actually, **The Distinction Preservation** requirement is the biggest filter because most theories collapse these. But the prompt asks for a single requirement. **Exploitability** is the strongest rationalist filter. **Remainder** is the strongest ethicist filter. I'll argue **Exploitability** is the hardest constraint for the "hard choice" theories to meet without collapsing into "there is a fact."
