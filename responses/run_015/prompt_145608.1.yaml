  ### The Case: The Law of the Causally Isolated Void

  **The Setup**
  Consider a universe $U$ divided into two spatiotemporal regions, $R_{pop}$ and $R_{void}$. 
  1.  **$R_{pop}$** is populated with particles and fields obeying standard dynamical laws (e.g., quantum field theory on curved spacetime). 
  2.  **$R_{void}$** is a vast, causally disconnected region of spacetime. It contains no matter, no fields, and no energy—only the spacetime metric itself. 
  3.  **Causal Isolation:** No signal, particle, or causal influence can ever pass between $R_{pop}$ and $R_{void}$. They are effectively separate "island universes" within a single manifold.

  **The Candidate Law**
  Consider the proposition $L_{void}$: *"No massive particles can exist in region $R_{void}$."*

  **Agreement on Particular Facts**
  Both the Humean and the Anti-Humean agree on the entire Humean Mosaic:
  *   In $R_{pop}$, particles exist and move according to standard dynamics.
  *   In $R_{void}$, the region is utterly empty. No particles ever appear, disappear, or traverse it.
  *   There is no empirical difference between a world where $L_{void}$ is a law and a world where $R_{void}$ is empty merely by cosmic accident.

  ---

  ### The Divergence

  **The Humean Verdict: $L_{void}$ is Not a Law**
  For the Humean (specifically a Lewisian Best System Account theorist), laws are theorems or axioms of the deductive system that best balances simplicity and strength in summarizing the *actual distribution of local qualities* (the Mosaic). 

  The Humean rejects $L_{void}$ as a fundamental law, not because it is false (it is true), but because it fails the **Instance Requirement** inherent in Humean Supervenience. 
  *   **Reasoning:** Laws, for the Humean, are summaries of *patterns of occurrence*. To systematize the Mosaic, there must be something to systematize. In $R_{void}$, there are no instances of massive particles. There is no pattern of behavior (e.g., "particles entering $R_{void}$ bounce back") to capture. 
  *   **Categorization:** The emptiness of $R_{void}$ is classified as a **Boundary Condition** or a **Brute Fact** about the arrangement of the Mosaic. It is akin to saying "The field value at coordinate $x$ is 0." For the Humean, specific value assignments are *facts* to be explained by the laws, not laws themselves. Since $R_{void}$ is causally isolated, stating its emptiness adds no informational strength regarding the dynamics in $R_{pop}$, nor does it simplify the description of $R_{pop}$. It is merely a singular truth about the world's arrangement.

  **The Anti-Humean Verdict: $L_{void}$ Is a Law**
  For the Anti-Humean (e.g., an Armstrong-style Dretske-Tooley-Maudlin theorist), laws are primitive relations between universals or modal constraints that exist independently of their instantiation.

  The Anti-Humean accepts $L_{void}$ as a fundamental law.
  *   **Reasoning:** The law is a nomic relation between the universal *Being a Massive Particle* and the universal *Location in $R_{void}$*. This relation is one of **exclusion**. 
  *   **Categorization:** The fact that $R_{void}$ is empty is *explained by* the law. The law does not summarize the emptiness; it *grounds* it. The Anti-Humean holds that nomic relations can obtain even if they are never tested or instantiated. The absence of particles in $R_{void}$ is not a cosmic accident; it is a manifestation of a structural constraint on reality.

  ---

  ### Why This Is Not the Standard Disputes

  **1. Not Governance vs. Description**
  The standard dispute asks: "Do laws *make* the world behave this way (governance), or do they just *say* how it behaves (description)?" 
  In this case, both sides agree that $R_{void}$ *is* empty. I am not asking the Humean to admit that the law *forces* the void to be empty. I am asking whether the proposition *"No massive particles can exist in $R_{void}$"* qualifies as a **law** in the ontology of the theory. 
  *   The Humean says: "It is a true description, but it is a *fact*, not a *law*."
  *   The Anti-Humean says: "It is a *law*."
  The disagreement is about the **extension of the concept 'Law'**, not its modal force. The Humean isn't denying the truth; they are denying the *categorical status*.

  **2. Not Simplicity vs. Strength**
  One might think the Humean rejects $L_{void}$ because adding it to the Best System costs simplicity without gaining strength. However, the Humean's objection here is deeper: it is about the **kind** of truth involved. 
  Even if stating "$R_{void}$ is empty" were incredibly simple (e.g., one bit of information), the Humean would still classify it as a Boundary Condition rather than a Law. This is because Humean laws must be **generalizations over local qualities**. A singular proposition about a specific region's content (even a negative one) lacks the requisite generality to be a *law* rather than a *fact*. The Anti-Humean, conversely, allows singular nomic constraints if they are grounded in universals. The divergence is about the **metaphysical grounds of lawhood**, not the optimization of a deductive system.

  ---

  ### The Real Fault Line: Supervenience vs. Primitive Modality

  This case reveals that the fundamental fault line between Humeanism and Anti-Humeanism is **the Supervenience Base of Lawhood**.

  *   **The Humean Constraint:** Lawhood must supervene on the *actual, local distribution of qualities*. If the mosaic in a region contains no instances of a property (no particles in $R_{void}$), there is no local qualitative ground to support a law about that property in that region. The law would "float free" of the Mosaic, violating Humean Supervenience. Therefore, no law.
  *   **The Anti-Humean Freedom:** Lawhood does not supervene on the actual mosaic. It supervenes on relations between universals or primitive modal facts. These relations can exist even where the mosaic is silent. The law is ontologically prior to the distribution of particles. Therefore, law.

  **Conclusion**
  In the case of the Causally Isolated Void, the Humean and Anti-Humean agree on every particle, every field value, and every empty coordinate. Yet, the Humean sees a universe with a brute, lawless absence in $R_{void}$, while the Anti-Humean sees a universe governed by a law of exclusion. This demonstrates that the core disagreement is not about how well laws summarize data, nor about whether they push particles around, but about **whether the existence of a law requires an actual pattern in the world to anchor it.** The Humean demands an anchor in the Mosaic; the Anti-Humean allows the anchor to rest in the realm of Universals.
