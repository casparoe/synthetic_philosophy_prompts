  2.  **Deconstruct Gödel's Philosophical Profile:**
      *   **Mathematical Logic:** Rigorous, precise, formal. The Incompleteness Theorems apply strictly to formal axiomatic systems capable of arithmetic.
      *   **Platonism:** Believed mathematical objects exist independently of human thought. Truth is discovered, not invented.
      *   **Philosophy of Mind:** He *did* believe the human mind was not a machine (aligned with Lucas-Penrose). He thought the mind could perceive mathematical truth in a way a formal system cannot.
      *   **Mysticism/Rationalism:** Influenced by Leibniz. Believed in a rational structure of the universe. Suspected time might be an illusion (influenced Einstein's view on block time). Believed in the possibility of a "rational theology."
      *   **Attitude towards Misapplication:** He was known to be meticulous and somewhat reclusive. He disliked sloppy reasoning.

