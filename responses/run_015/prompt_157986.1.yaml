answer: |-
  Of the raw constraints provided, chronological proximity and numerical independence are genuine structural desiderata; they measure the opportunity for distortion. Agreement with excavation is evidentiary but prone to circularity. The criterion of embarrassment, absence of motive, and generic plausibility are largely reflexes of temperament; they assume modern psychological rationality applies to ancient myth-makers. Real place names and objects are data, but without context, they invite the "absorbed detail" error. Thus, proximity and independence are retained; psychological proxies are rejected; archaeological agreement is retained only with strict anchoring.

  1.  **Atomic Decomposition.** The criterion must grade individual claims (e.g., a battle occurred) separately from narrative wrappers (e.g., divine intervention). *Motivation:* A war fought at a real place, the elopement that supposedly caused it, and the gods fighting on the plain are different claims answerable to different evidence. *Status:* Non-negotiable.
  2.  **Independent Anchoring.** External evidence (inscriptions, strata) must identify a site or person without relying on the narrative being tested. *Motivation:* Blocks Circular Cross-validation. Excavators often identify a site using the narrative; the identified site is then cited as confirming the narrative. *Cost:* Discards most archaeological correlations that rely on narrative identification. *Status:* Non-negotiable.
  3.  **Transmission Skepticism.** Wide circulation, persistence, or vivid detail cannot count as evidence of fidelity. *Motivation:* Blocks Transmission Selection. The features that make a story worth retelling are the same features that invite elaboration. *Cost:* Ignores oral stability as a positive indicator of truth. *Status:* Non-negotiable.
  4.  **Incidental vs. Core Distinction.** The criterion must distinguish detail that corroborates from detail merely available to be absorbed. *Motivation:* Blocks Absorbed Detail. A narrative can take up genuine topography without corroborating the events it narrates. *Cost:* Requires demonstrating why accurate detail would survive without the event being true. *Status:* Non-negotiable.
  5.  **Declared Expectation of Record.** Silence counts against a tradition only given a stated view of how much documentation a society should have left. *Motivation:* Prevents argument from silence in periods or cultures with low literacy. *Status:* Non-negotiable.
  6.  **Control Calibration.** The criterion should be run on cases whose answer is independently settled. *Motivation:* A criterion that fails to exclude known fiction is defective. *Status:* Preference (methodological check).

  One pair of desiderata cannot be jointly satisfied: Control Calibration versus the demand that a criterion not be tuned to return the answer its author antecedently favors. Calibrating against known cases risks baking in modern biases about what counts as "history," potentially excluding valid ancient forms of record-keeping. To pass, a criterion must sacrifice perfect neutrality; it must admit that "known cases" are themselves theory-laden. If the author tunes the criterion to match their antecedent views on specific cases under the guise of calibration, the criterion becomes a vehicle for confirmation bias. The criterion must give up the illusion of pure objectivity; it must acknowledge that calibration requires a set of "knowns" that are themselves subject to historical dispute.

  The single desideratum that excludes the most candidate criteria is Independent Anchoring. It disqualifies the majority of archaeological arguments used to historicize legend, as most site identifications rely initially on the very narratives they purport to confirm. Passing this test costs the user most of the available physical evidence. Many claims of historicity rest on the identification of a ruin based on a story, followed by the assertion that the ruin proves the story. Independent Anchoring forbids this loop unless the site was identified by means unrelated to the narrative, such as independent epigraphic evidence or stratigraphy that predates the narrative's composition. This requirement drastically shrinks the pool of admissible evidence, rendering many popular historicizations untenable for a secular reference work.

  If the purpose shifts to a court adjudicating territorial claims, Independent Anchoring and Declared Expectation of Record become statutory non-negotiables, while Transmission Skepticism may relax if customary usage is the legal standard. Courts require evidence admissible under rules of proof, prioritizing documentation and chain of custody over narrative coherence. For a religious community asking whether its constitutive narrative is true, Independent Anchoring drops out entirely; coherence and transformative power become non-negotiable, and Transmission Skepticism flips its sign, treating persistence as evidence of spiritual validity rather than distortion. The religious community seeks existential truth and communal continuity, not secular verification. The reference work, however, seeks to minimize assertion error for a general audience, requiring the highest bar on independence and decomposition.

