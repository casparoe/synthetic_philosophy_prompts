  write an essay on this tension: in keynes's treatise on probabilty he argues probability is an objective logical relation between a body of evidence and a conclusion, not a mental state. but in the general theory he claims that long-run expectations are so unstable that investment decisions rest on convention and animal spirits rather than calculable odds. the controversy is whether this is just a shift in subject matter, or whether the two positions are conceptually incompatible.

  weigh the arguments. on one side, defenders say keynes never meant his logical theory to cover unique future events—uncertanty is just the absence of a logical probability relation, not a contradiction. on the other side, critics point to his idea of the weight of evidence: if future economic outcomes carry almost no evidential weight, then treating them as falling within the domain of probability at all—even as zero-probability—is a category mistake, and his own macro framework secretly relies on agents doing exactly that.

