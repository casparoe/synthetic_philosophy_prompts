      *   **Constraints:** No papers, no reading lists. Be concrete. Stay in the user's vocabulary (logs, quorums, subscribers, backpressure, etc.). Be honest about where the mapping breaks ("can't be translated" is okay).
      *   **The Architecture (Kestrel):**
