          4.  Shipping Question: Does the global bus + quorum commit actually matter for consciousness, or is it 100% Access/0% Phenomenal?

  2.  **Deconstruct the Philosophy (Mental Sandbox):**
      *   *Global Workspace Theory (GWT):* Baars, Dehaene. Idea: Specialized processors compete to broadcast information to a global workspace. Once broadcast, it's available to all other systems (memory, action, report). This broadcasting *is* conscious access.
      *   *Access Consciousness (A-Consciousness):* Information is available for use in reasoning, reporting, and rational control of action. (Dennett, Block).
      *   *Phenomenal Consciousness (P-Consciousness):* The subjective experience. "What it is like" to see red. The qualia. Hard Problem territory.
      *   *The Distinction:* You can have Access without Phenomenal (philosophical zombies?) or Phenomenal without Access (subliminal perception? rich experience we can't report?). Most functionalists collapse them; dualists separate them.

  3.  **Map Kestrel to Philosophy:**
      *   *Modules:* Specialized processors (unconscious modules in GWT).
      *   *The Log:* The Global Workspace.
      *   *Quorum Commit:* Ignition/Broadcast threshold. If it doesn't hit quorum, it stays local (unconscious/subliminal).
      *   *Sampling/Backpressure:* Attention/Resource limitation. Not everything makes it to the workspace.
      *   *Narrator:* Report/Access. It reads the workspace to generate a story.
      *   *Orphan Events (Audit Sink):* This is the tricky one. Durable, but no runtime consumer.
