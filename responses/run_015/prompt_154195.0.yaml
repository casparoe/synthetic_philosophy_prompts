          *   *Fudge:* Quorum. GWT ignition is about *amplification*. Quorum is about *consistency/durability*. Close, but not identical.

      *   **Question 2: Relational vs. Non-Relational (The Hard Problem):**
          *   User's hunch is correct. In distributed systems, state is defined by observation/interaction. An event no one reads is indistinguishable from an event that never happened *for the system*.
          *   P-Consciousness claims there *is* a difference (the "what it's like").
          *   Kestrel vocabulary is purely functional/relational. It cannot express "intrinsic quality."
