  6.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address the "Orphan Events" correctly?
      *   *Correction:* Orphan events are durable but unused. In philosophy, P-consciousness is often private. Orphans are private *to the audit log*, but the audit log is external (the human later). I need to clarify that Orphans are *not* P-consciousness unless the Audit Sink is considered the "self." But the user said "Nothing subscribes to it." So they are truly unused. This maps better to "forgotten perceptions" or "subliminal traces" than "qualia." Actually, the best map for P-consciousness in this system is *nothing*. That's the point.
      *   *Wait, let's look closer:* If P-consciousness is "what it's like," and the system has no "what it's like," then Kestrel has no P-consciousness component. The Orphan events are just data. The user asks if Orphan events map to P-consciousness. I should argue they map to *potential* access that wasn't taken, or just data persistence. True P-consciousness requires a subject. Kestrel has no subject, only consumers.
      *   *Refinement on Q2:* The user asks if there's a non-relational construct in distributed systems. The answer is generally "no." State is defined by transitions. I need to be firm here.
      *   *Refinement on Q3:* The "Infinite Stack" is the Homunculus. GWT solves this by making the workspace *passive*. It's a bus, not a viewer. Kestrel matches this well.

  7.  **Final Polish:** Ensure the "Residue Report" structure is followed strictly. Make sure the distinction between Access (functional availability) and Phenomenal (subjective experience) is clear in the context of the log.

