prompt: |-
  me and a friend got into it last night about whether Orwell actually believed that language shapes thought or if he just hated bureaucratic euphemism, and now i'm stuck on a satire assignment. can you write a deadpan internal memo — about 650 words, formatted with numbered sections — from a fictional "Bureau of Linguistic Hygiene" announcing a mandatory vocabulary-reduction program for all government communications? the voice should be an earnest, tired bureaucrat who sincerely thinks cutting word counts will eliminate political disagreement. include a table of banned phrases and their approved replacements (like "collateral damage" -> "side effect"), a protocol for reporting colleagues who use metaphors or passive voice, and a closing reminder that emotional language is now a security risk. the satire should actually get Orwell's real arguments right — the stuff about euphemism hiding atrocity, passive voice shielding responsibility, and defending the indefensable — but push them into a reductio where the "cure" is obviously worse than the disease. target is the practice of linguistic engineering itself, not any real person. keep it deadpan so the reader has to do the work of seeing the irony, and dont wink.

  please also add a brief author's note, maybe 150 words, explaining where the memo takes liberties with Orwell's actual position — for instance whether he genuinely thought vocabulary could be engineered top-down or if he was more pessimistic about institutional reform — and say what kind of historical evidence or argument would change your mind about whether the satire is fair to his views. oh, and i dont need any bibliography or reading list, just your own reasoning.
