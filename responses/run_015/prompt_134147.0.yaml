answer: |-
  The Director of the Bureau of Ethical Translation stood proudly behind the glass, watching the Senior Ethicist face the Axiometric Comparator. On the screen flashed the test case: "Betray a Friend (Loyalty)" versus "Save a City (Welfare)."

  "Begin," the Director commanded.

  The Ethicist stared at the buttons. He did not press. He breathed. He sweat. The digital counter on the Comparator climbed: 1,000 hesitation-milliseconds… 5,000… 10,000. Finally, the Ethicist slumped back, having made no selection.

  The machine chirped happily. "Analysis Complete. Loyalty: 10,000 hesit-ms. Welfare: 10,000 hesit-ms. Conclusion: Values are equal. Recommendation: Randomize."

  The Director smiled. "It works. The hesitation-milliseconds prove they share a common weight."

  The Ethicist shook his head and unplugged the machine. "No. The hesitation wasn't the weight of the values. It was the friction of the category error."

  "But the time was identical," the Director insisted.

  "Exactly," said the Ethicist. "You're assuming hesitation is the cost of conversion. But in a hard choice, hesitation isn't calculation—it's the experience of having no common currency. You haven't built a scale; you've built a stopwatch for the moment reason runs out."
