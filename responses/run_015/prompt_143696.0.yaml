answer: |-
  **MEMORANDUM**

  **TO:** Board of Directors, County Museum
  **FROM:** [Your Name], Board Member
  **DATE:** October 23, 2023
  **SUBJECT:** Recommendation for Vote: East Wing Pioneer-Science Diorama
  **VOTE DATE:** Thursday, October 26, 2023

  **BOTTOM LINE RECOMMENDATION**
  I move that the Board **retain the diorama but authorize immediate recontextualization**. We should not destroy the exhibit, nor should we leave it as is. Instead, we will add new interpretive signage, consult with local Indigenous representatives to correct the narrative regarding the guides, and explicitly label the exhibit as a historical artifact of how science and museums have changed over time.

  **THE CORE ISSUE: UNDERSTANDING "PRESENTISM"**
  To make this vote, we need to agree on what "presentism" means, because we are facing two layers of it.

  Presentism is simply judging the past by today's moral rulebook. It is expecting people in history to act like they live in 2023.

  1.  **Layer One (The 1920s):** Dr. Elias Vance operated in the 1920s. If we call him a villain solely because he used racial categories common to his time, we are being presentist. We ignore that he may have been progressive *for the 1920s*.
  2.  **Layer Two (The 1985 Curators):** This is the trickier layer. The 1985 curators tried to fix the 1920s bias with the tools they had. They called Vance an "ally." If we tear down their work because it doesn't meet *our* 2023 standards, we are being presentist toward them. We are erasing their attempt to do better.

  If we remove the exhibit entirely, we commit "presentism in reverse." We erase the evidence of how far we have come. A museum's job is not just to show science; it is to show how our understanding of history changes.

  **THE PROPOSED ACTION PLAN**
  If the motion passes, staff is authorized to execute the following specific changes within six months:

  1.  **New Interpretive Panels:** Install three permanent panels adjacent to the diorama.
      *   *Panel 1 (The Guides):* Acknowledge the Indigenous guides as experts and collaborators, not "helpers." Where names are lost to history, state clearly that this erasure was a failure of the past, not a reflection of their actual contribution.
      *   *Panel 2 (The Language):* Explain that the racial categories on the original labels are historical artifacts, not scientific facts.
      *   *Panel 3 (The Museum):* Admit that the 1985 interpretation was well-intentioned but incomplete. This turns the exhibit into a lesson on how museums learn.
  2.  **Community Consultation:** Contract with representatives from the local Indigenous nations associated with the guides to review all new text before installation.
  3.  **Visual Markers:** Place a small, distinct plaque on the diorama frame itself reading: "Historical Exhibit: Preserved to show how museum storytelling has evolved."

  **HONEST ASSESSMENT OF THE REJECTED OPTION (REMOVAL)**
  I am recommending we vote **against** taking the diorama down. I want to be honest about why some of you want to remove it, because your concerns are valid.

  **The strongest argument for removal is harm reduction.**
  Seeing racist categories and Indigenous people portrayed as subordinates causes real pain to visitors today. It validates harmful stereotypes regardless of what a new sign says. For some, seeing this display feels like the museum is endorsing those old views. Removing it stops that pain immediately and sends a clear signal that this museum does not tolerate racism.

  **Why I reject removal anyway:**
  While removal stops the pain, it stops the learning. If we hide this, we pretend our museum never had these biases. By keeping it and labeling it correctly, we admit our faults publicly. We show visitors that bias is something we must constantly fight, even in our own building. Erasing the 1985 curators' work teaches staff that "good enough for now" will be punished later, rather than celebrated as a step forward.

  **MOTION FOR VOTE**
  **I move that the Board authorizes the retention of the East Wing Pioneer-Science Diorama contingent upon the addition of contextual signage and Indigenous community consultation as outlined above, with a budget cap of $15,000 for revisions.**

