answer: |-
  Miller slammed his napkin down, spilling a little foam. "You can't just say 'true contradictions,' Sacks. If P and not-P are both true, logic explodes. I could prove I own this bar. I could prove I'm the Queen of England."

  "That's classical panic," Sacks said, swirling his whiskey. "Paraconsistent logic blocks explosion. A contradiction is a local fire, not a nuclear meltdown. You can accept the glitch without the system crashing."

  "So you're saying reality can hold two opposites without dissolving?"

  "Exactly. Truth is tougher than that."

  The bartender, a guy with forearms like cured hams who'd been polishing the same glass for ten minutes, leaned in. "Hey. Quick question on that."

  They turned.

  "This tab," the bartender said, sliding the receipt over. "Is it paid?"

  "No," Sacks said.

  "Is it unpaid?"

  "Yes."

  "Okay. Imagine it's both."

  Sacks smiled. "A true contradiction."

  Miller groaned. "See? Now he thinks he gets out of paying."

  "No," Sacks said. "Because explosion is blocked. The contradiction stays contained."

  "Right," the bartender said. "So the 'unpaid' part doesn't get cancelled out by the 'paid' part?"

  "Exactly. Both stand."

  "Great." The bartender picked up the receipt and a pen. "So you still owe me the twenty. And since the 'paid' part is also true... I'm gonna mark this as paid, which means I don't have to give you change on the twenty you just handed me."

  Sacks blinked. "Wait—"

  "No explosion," the bartender said, pocketing the bill. "Means the debt survives the contradiction. Cash or card?"
