      *Wait, a better angle:* The argument conflates **Instrumental Rationality** (how to grow a resource) with **Terminal Rationality** (what is good).
      Log-wealth is a *derived* preference for an investor who wants to survive and grow indefinitely. It is not a *fundamental* preference for a human who wants to experience life.
      So, reject (4). You maximize Expected Utility. Log-Wealth is only the utility function if your *only* goal is long-term capital growth.

      *Addressing the "One-Off" question:* If it's truly one-off and non-compounding, Geometric Rationality loses its normative force. It becomes just one specific risk profile (CRRA = 1).

  7.  **Final Polish:**
      *   Tone: Academic but accessible, respectful of the finance colleague but firm on the logic gaps.
