          2.  Interpretation: Time-average growth matters more than ensemble-average (expected) wealth. EV is a "fiction."
          3.  Generalization: Repetition shouldn't matter for rationality. If it's right for 100 bets, it's right for 1.
          4.  Universalization: Maximize Expected Log of *whatever* quantity your decision multiplies.
          5.  Consequence: Any nonzero probability of total loss (quantity $\to$ 0) implies Expected Log $\to -\infty$. Thus, forbidden.
          6.  Reductio ad Absurdum: This forbids driving, surgery, having kids (all carry tiny risks of "total loss" of life/earning capacity).
          7.  Conclusion: Something must break.
