answer: |-
  You are right to itch. Your colleague's argument is a polished version of a line of reasoning popular in "Ergodicity Economics" (most notably associated with Ole Peters), and while it correctly identifies a flaw in naive Expected Value (EV) maximization for repeated multiplicative processes, it overextends into a universal normative claim that collapses under its own weight.

  The argument looks compelling on the board because it solves a genuine puzzle (why we don't bet the farm on positive EV gambles) using a physical intuition (time averages vs. ensemble averages). However, it commits a category error between **instrumental growth strategies** and **terminal utility functions**.

  Here is the diagnosis of where the argument breaks, why it looked sound, and what you keep if you discard it.

  ### The Critical Joint: Reject Step (4) and Qualify Step (3)

  The break occurs primarily at **(4)**, supported by a subtle equivocation in **(3)**.

  **Step (4) claims:** *"In any decision whatever, maximize the expected log of the quantity your decision multiplies."*
  **Step (3) claims:** *"The number of times you face a given choice can't be what makes a rule rational."*

  You should reject **(4)** outright and significantly qualify **(3)**.

  #### Why Step (4) Fails (The Wealth/Utility Conflation)
  The argument attempts to derive an *ought* (your utility function) from an *is* (the dynamics of wealth).
  *   **In Finance:** If your goal is specifically "maximize the long-term growth rate of this specific capital pool," then Log Wealth is indeed the correct utility function *for that pool*. This is a derived preference based on a specific instrumental goal (survival + compounding).
  *   **In Life:** Driving to campus or having a child are not decisions about managing a compounding capital pool. They are decisions about consuming or exchanging resources for *utility* (safety, happiness, experiences).
  *   **The Error:** The argument assumes that because Log Wealth is the optimal strategy for *growing wealth over time*, Log Wealth must be the correct utility function for *valuing outcomes*. But wealth is instrumental; utility is terminal.
      *   If you maximize Expected Log *Wealth*, you are assuming your utility function is $U(W) = \ln(W)$.
      *   But why should your utility function be logarithmic? Only if your *only* goal is to avoid ruin while compounding indefinitely.
      *   For a one-off decision (like the 78-year-old spending the proceeds), there is no compounding. Therefore, the mathematical justification for the logarithm vanishes. You revert to whatever your actual utility function is (which might be linear, or S-shaped, or something else).

  #### Why Step (3) is Misleading (The "One-Off" Fallacy)
  Your colleague argues: *"If maximizing expected log is the right policy when you'll take the bet a hundred times, it's the right policy when you take it once."*

  This sounds like a consistency requirement (diachronic rationality), but it ignores **contextual rationality**.
  *   A strategy is rational *relative to a goal*.
  *   If the goal is "survive 100 rounds," Kelly (Log) is rational.
  *   If the goal is "maximize cash in hand after 1 round," EV (Linear) might be rational.
  *   Rationality *does* depend on the structure of the environment (repetition, reinvestment, ability to recover). To say otherwise is like saying, "If breathing is the right policy for staying alive for 80 years, it's the right policy for holding your breath underwater for 2 minutes." The context dictates the optimal policy.

  ### Why It Looked Fine on the Board

  1.  **It solves the "Ruin" problem:** Standard EV maximization suggests you should bet your entire bankroll on any positive EV multiplicative gamble. We intuitively know this is stupid because it leads to ruin. Geometric rationality correctly identifies that *avoiding ruin* is a prerequisite for *future gain*. This feels like a profound moral truth, but it's actually just a constraint on instrumental rationality.
  2.  **Ergodicity Intuition:** The distinction between "time average" (what happens to you) and "ensemble average" (what happens to parallel universes) is physically robust. It feels like it *must* be the foundation of rationality because it aligns math with physical reality. But physical reality constrains *feasibility*, not necessarily *value*.
  3.  **The "Zero" Trap:** Step (5) relies on the mathematical property $\ln(0) = -\infty$. This looks like a rigorous proof that ruin is forbidden. But it ignores that in the real world, "zero wealth" does not equal "negative infinity utility." You can be bankrupt and still have positive utility (friends, health, life). The map (log wealth) is not the territory (well-being).

  ### What Does Rejecting It Cost?

  If you reject (4) and qualify (3), you lose the claim that Geometric Rationality is a **universal moral law**. You cannot tell someone they are *irrational* for taking a one-off gamble that isn't Kelly-optimal, provided they understand the risks and value the potential upside.

  However, you keep the powerful insight that **risk aversion should be dynamic**.
  *   **Cost:** You admit that EV maximization is not always "wrong," just context-dependent.
  *   **Gain:** You avoid the paralysis of Step (6). You can drive to campus because the "quantity" being multiplied (your life/earning capacity) is not the same as the "quantity" being wagered (the time/gas money), and the probability of total loss is not treated as mathematical zero-utility.

  ### The "Residue" of Geometric Rationality

  You asked: *Is there any residue of geometric rationality that still applies to a genuinely one-off, non-compounding choice?*

  **Yes.** Even in one-off choices, Geometric Rationality provides a heuristic for **stake-sizing relative to total capacity**.

  1.  **The Reinvestment Condition (Validated):** Your intuition here is correct. The Log rule only has normative force if the outcome feeds back into the capacity to make future decisions.
      *   *Residue:* Even for a one-off bet, if the stake is large enough relative to your total resources that a loss would *impair your future ability to act* (i.e., it effectively becomes a compounding constraint), then you should act *as if* you are maximizing log wealth.
      *   *Example:* A 78-year-old spending the proceeds next week doesn't need Kelly. A 25-year-old betting their retirement fund does, even if it's a "one-off" bet, because the loss compounds into their future poverty.

  2.  **Bounded Utility:** To fix Step (5) and (6), you must abandon the idea that utility is unbounded logarithmic wealth.
      *   Real utility functions are bounded. You don't have $-\infty$ utility for dying; you have a finite (albeit large) negative value.
      *   If utility is bounded, $\text{Expected Utility}$ never hits $-\infty$, and the "drive to campus" paradox dissolves. You weigh the small probability of a large negative utility against the high probability of a small positive utility.

  3.  **Fractional Kelly:** The finance guy's "narrow bankroll" defense is actually closer to the truth than he realizes, though for the wrong reason. Professional gamblers don't bet full Kelly; they bet "Half-Kelly" or "Quarter-Kelly." Why? Because they acknowledge that their edge is uncertain and their utility function isn't perfectly logarithmic. This admits that Log-Wealth is a *policy heuristic*, not a *law of nature*.

  ### Summary for Your Group

  You can tell your colleague:

  1.  **Keep (1) & (2):** The math on repeated multiplicative processes is correct. Time-averages matter more than ensemble-averages for non-ergodic processes.
  2.  **Reject (4):** You cannot universalize "maximize expected log" to *any* quantity. It applies to **compounding instrumental goods** (capital), not **terminal goods** (life, happiness).
  3.  **Qualify (3):** Rationality *is* sensitive to repetition and reinvestment potential. A strategy optimal for an infinite horizon is not necessarily optimal for a finite one.
  4.  **Fix (5):** "Zero wealth" is not "Negative Infinity Utility." We must use a bounded utility function to model real human decisions.

  **The Verdict:** Geometric Rationality is the correct **strategy for investors**, but it is not the correct **definition of rationality for humans**. It explains why we *shouldn't* bet the farm on positive EV gambles, but it doesn't explain why we *should* drive to campus. For that, you need Expected Utility Theory with a bounded, context-sensitive utility function.

  The "itch" you feel is the friction between **instrumental rationality** (how to grow a resource) and **ecological rationality** (how to survive and thrive in a specific environment). Your colleague is trying to sell the former as the latter.
