answer: |-
  The history of moral progress is often recounted as a triumph of reason. We tell ourselves that slavery ended because humanity finally recognized the inherent dignity of all persons, or that dueling vanished because civilization embraced the sanctity of life over the prickliness of pride. Yet, this comforting narrative faces a formidable challenge from the observation that moral convictions often shift in lockstep with changes in power, economics, and social structure. This tension lies at the heart of understanding moral revolutions. On one side stands a skeptical view, associated with Bernard Williams, which suggests that moral change is largely epiphenomenal, tracking shifts in material interest and power rather than rational persuasion. On the other side is the account offered by Kwame Anthony Appiah, who argues that honor codes possess a distinctive causal power, capable of driving normative collapse by altering what counts as shameful or prestigious, independent of deep philosophical argument.

  To resolve this tension, one must look beyond the binary of "reason versus interest" and examine the social mechanisms through which norms dissolve. A crucial analytical tool for this examination is the distinction between "normative collapse" and "performative withdrawal." Normative collapse occurs when a practice comes to be seen as morally indefensible by its own practitioners; the internal justification for the act evaporates. Performative withdrawal, by contrast, occurs when elites abandon a practice because its social rewards evaporate, even if they do not explicitly reject its underlying morality. By applying this distinction to the historical cases of dueling and foot-binding, it becomes clear that honor is best understood not as an entirely autonomous causal mechanism, but as a mediating structure through which interest-shifts are translated into moral imperatives. This verdict has profound implications for predicting how contemporary norms might dissolve, distinguishing between those vulnerable to rapid status-driven abandonment and those requiring slow, generational moral conversion.

  The Williamsian skeptical challenge posits that moral language is often a mask for power. When a practice becomes economically inefficient or politically dangerous, the ruling class discards it and constructs a moral vocabulary to justify the abandonment post-hoc. In this view, the abolition of slavery or the end of dueling was not driven by a sudden awakening of conscience, but by the fact that these practices no longer served the material or political interests of the powerful. The moral argument is merely the smoke, not the fire. While this view avoids naivety, it risks cynicism, rendering moral conviction illusory and failing to explain why agents feel genuinely compelled by honor or shame even when no immediate material gain is at stake.

  Appiah counters this by highlighting the specific psychology of honor. He suggests that people are deeply motivated by the desire for social standing and the avoidance of shame. Honor codes function as scripts that dictate what behavior earns respect. When these scripts change, behavior changes rapidly, often before deep moral reasoning catches up. For Appiah, the end of dueling was not primarily achieved by laws banning it, nor by philosophical treatises on the value of life, but by a shift in the honor code itself: the duelist was reimagined not as a brave defender of reputation, but as a thug or a fool. Here, honor acts as an autonomous engine of change; the desire for prestige remains constant, but the object of prestige shifts.

  However, treating these views as purely rival hypotheses obscures the complex relationship between interest and honor. The distinction between normative collapse and performative withdrawal clarifies this relationship. In cases of normative collapse, the practitioner undergoes an internal transformation; they believe the act is wrong. In performative withdrawal, the practitioner calculates that the cost of the act (in social capital) now outweighs the benefit. The act may still be theoretically permissible or even "right" in the abstract, but it is no longer "done."

  Applying this to the decline of dueling reveals that performative withdrawal was the primary driver, facilitated by honor as a mediating structure. In the eighteenth and nineteenth centuries, gentlemen dueled to maintain status. As the nineteenth century progressed, the social composition of the elite changed. A rising commercial and professional class valued stability and legal resolution over martial prowess. The state also consolidated its monopoly on violence. Consequently, the social reward for dueling diminished; it became career suicide rather than career advancement. Gentlemen stopped dueling not necessarily because they suddenly believed it was murder (normative collapse), but because it became socially costly and indicative of poor judgment (performative withdrawal). The honor code mediated the shift in material and political interests (the rise of the bureaucratic state and commercial economy) into a moral imperative (the duty of the gentleman to be rational and law-abiding). The moral language followed the social calculation.

  A similar dynamic is evident in the abolition of foot-binding in China. For centuries, bound feet were a prerequisite for a good marriage and a symbol of family status. The practice did not end because every practitioner suddenly underwent a philosophical epiphany regarding bodily autonomy. Rather, as China faced external threats and internal modernization pressures in the late nineteenth and early twentieth centuries, the definition of a "strong nation" shifted. Bound feet became associated with national weakness and backwardness. Anti-foot-binding societies leveraged honor by shaming families who continued the practice, framing it as unpatriotic. Here, the interest shift was national survival and modernization. Honor mediated this interest by recasting the practice from a mark of beauty to a mark of shame. Many families abandoned the practice via performative withdrawal—to ensure their daughters could marry into modern, prosperous families—long before a universal normative collapse regarding the morality of bodily harm was fully internalized by the older generation.

  These cases suggest a specific verdict on the nature of honor. Honor is not an entirely autonomous causal mechanism that operates in a vacuum, nor is it merely a cynical mask for power as Williams might imply. Instead, honor functions as a mediating structure. It is the psychological and social interface through which raw shifts in material and political interests are experienced and enacted as moral imperatives. Without the shift in interests (the changing utility of violence in dueling, the need for national strength in foot-binding), the honor code might not have shifted. However, without the mechanism of honor (the desire for prestige and fear of shame), the interest shifts would not have translated into rapid behavioral change. Honor translates "this is no longer useful" into "this is no longer done," and eventually, "this is wrong."

  Understanding honor as a mediating structure rather than an autonomous force offers a practical framework for predicting which contemporary norms are vulnerable to rapid dissolution versus gradual erosion. If a norm is sustained primarily by performative withdrawal mechanisms—where adherence is driven by social signaling and status rewards—it is vulnerable to rapid dissolution if the status incentives shift. For example, norms surrounding smoking in the West dissolved relatively quickly not because the health arguments changed overnight, but because smoking shifted from a symbol of sophistication to a symbol of social unacceptability. The honor code flipped. When a practice is tied to visible prestige, changing the prestige economy can trigger a cascade of performative withdrawal.

  Conversely, norms that are sustained by deep normative collapse—where adherence is tied to fundamental identity or theological conviction—are resistant to status shifts and require gradual erosion through argument and generational change. Practices deeply embedded in religious doctrine or core conceptions of human nature often survive even when they become economically disadvantageous. Predicting moral change, therefore, requires diagnosing whether a norm is held in place by the "economy of honor" or by the "economy of conscience."

  If we seek to accelerate moral progress, this distinction dictates strategy. To target norms sustained by performative withdrawal, one must alter the social rewards. Shaming, public signaling, and changing the association of the practice with status are effective. To target norms sustained by normative collapse, one must engage in the slow work of moral argument and empathy building. Confusing the two leads to failure; attempting to shame a group into abandoning a deeply held moral conviction often backfires, entrenching the norm as a badge of identity. Attempting to argue logically against a practice sustained merely by social inertia is inefficient when a shift in status incentives would suffice.

  In conclusion, the debate between the skeptical view of moral change as interest-driven and the honor-based view of moral change as prestige-driven is resolved by recognizing the mediating role of honor. Bernard Williams is correct that interest shifts often underlie moral revolutions, but Kwame Anthony Appiah is correct that honor is the mechanism by which these shifts are felt and acted upon. Normative collapse and performative withdrawal are distinct phases in this process, often overlapping but analytically separable. By viewing honor as the structure that translates interest into morality, we gain a clearer lens on history and a more effective tool for the future. We learn that while moral arguments provide the destination, it is often the shifting landscape of honor that builds the road. Rapid dissolution awaits those practices that rely on social credit; gradual erosion remains the fate of those rooted in the soul. Understanding this difference is the key to navigating the moral revolutions of the coming century.
