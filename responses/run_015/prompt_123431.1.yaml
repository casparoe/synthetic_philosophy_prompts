          *   Is it unfalsifiable? Risk of yes. If every intervention fails, the proponent says "we need more research." That's a bug.

      *   **Insulation Check:**
          *   Yes, it's insulated. "Tiny prob $\times$ Huge N" is a shield.
          *   Is it a feature? In Pascal's Mugging contexts, yes. In policy contexts, no. It creates a "priority lock" that ignores diminishing returns or tractability.
          *   Verdict: It's a bug here because it decouples moral urgency from actionable leverage.

      *   **Philosophical Underpinnings:**
