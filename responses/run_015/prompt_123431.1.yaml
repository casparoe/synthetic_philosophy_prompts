              *   *Strong:* Tractability. We literally don't know *how* to improve wild insect welfare without causing ecological collapse (which hurts humans/other animals).
              *   *Awkward:* Opportunity cost (money could save human lives).
          *   *Kill A, Save E:* The Replacement Problem is the king here. E can be true (ocean of suffering), but A is false (we can't drain the ocean).
          *   *Concede vs. Dismiss:* Concede Replacement is hard. Dismiss "insects are robots" if it relies on human-exceptionalism, but accept it if it relies on specific neural correlates.

