      *   **Position:**
          *   (E) Evaluative: Insect numbers are huge. Even low credence in sentience $\rightarrow$ huge expected valenced experience. r-selected traits (high mortality, low investment) suggest negative valence *conditional* on sentience.
          *   (A) Action-guiding: This makes invertebrate welfare a priority *now* (research + harm reduction), even before certainty.
