answer: |-
  The encounter-adjusted rate does not reverse the decline in violence; it mathematically guarantees a steeper drop, meaning the real tension lies not in the denominator but in whether we measure societal conditions or individual lifespans.

  Before selecting the right measure, we must catalog what different denominators actually measure. Total population answers "What is the average citizen's annual risk?" Total social encounters answers "How dangerous is a typical human interaction?" Total lifetime years answers "What is the cumulative risk over a full lifespan?" Total witnessed events answers "How traumatized is the social environment?"

  You asked to test the encounter-adjusted rate seriously, so let us isolate it. Your intuition is that modern density creates more friction, potentially hiding violence within a sea of interactions. However, the arithmetic works against a trend reversal. If the per-capita rate falls while interactions rise, the risk per interaction must plummet faster than the risk per person.

  Consider this numerical example. In 14th-century London, assume a population of 10,000 and 100 homicides per year. The per-capita rate is 10 per 1,000 people. Assume each person has 500 distinct social encounters annually. Total encounters are 5,000,000. The encounter-adjusted rate is 100 homicides divided by 5,000,000 encounters, or 2 per 100,000 encounters.

  Now look at modern London. Assume the per-capita homicide rate has dropped tenfold to 1 per 1,000 people. Assume social density has increased fiftyfold, with each person having 25,000 distinct encounters annually. The per-capita trend is down. The encounter-adjusted rate is now 1 homicide per 1,000 people divided by 25,000 encounters per person. This equals 0.04 per 100,000 encounters. The per-capita rate dropped by a factor of ten; the per-encounter rate dropped by a factor of fifty. The trend does not flip sign; it amplifies. This suggests that modern humans are not just safer overall, but that the fundamental unit of social contact has become drastically less lethal.

  However, this mathematical clarity dissolves when we address your second complication: annual rates versus cumulative lifetime risk. This is where the honest disagreement lives. The per-capita annual rate answers "Is the world more violent?" by measuring the current state of the social environment. It is a snapshot of societal toxicity. But the question "Am I going to die violently?" requires the lifetime risk metric. Because life expectancy has exploded from roughly 35 years in the 14th century to 80 years today, a modern human occupies the danger zone for more than twice as long.

  If the annual homicide rate drops by a factor of ten, but your exposure time doubles, your lifetime risk still drops significantly. But if the annual rate only drops by a factor of three, the extended lifespan might keep lifetime risk static or even push it higher. Therefore, the annual rate is the honest answer to "is the world more violent," while lifetime risk is the honest answer to "will I die violently." They can diverge. A world could be objectively safer per year (lower annual rate) yet feel riskier to the individual because they must navigate that safety for so many more decades.

  This brings us to witnessed violence. Under your narrow definition of intentional physical harm, witnessed violence is a category error. It is psychological exposure, not physical victimization. Including it conflates the probability of harm with the fear of harm. While spectator exposure has exploded via media, measuring it alongside physical assault mixes ontology with psychology. It belongs in a measurement of trauma or social anxiety, not violence itself. If you include it, you are no longer measuring violence; you are measuring the cultural saturation of conflict.

  Ultimately, is there a fact of the matter about which framing is correct? No, but this is not because violence is undefined. You fixed the definition narrowly. The disagreement is not ontological; it is axiological. It is a choice about what we care about. If we care about the structural safety of society, the per-capita annual rate is the truth. If we care about the individual's biographical fate, the lifetime risk is the truth. If we care about the quality of daily interaction, the encounter rate is the truth.

  The choice is between measuring the society's behavior versus the citizen's fate. Most public discourse conflates these, claiming that a drop in annual rates proves individual safety without accounting for longevity, or vice versa. Your encounter-adjusted framing was a sophisticated attempt to fix the denominator to the unit of social friction. It failed to flip the trend, but it succeeded in showing that social friction itself has become safer. The remaining ambiguity is not in the math, but in whether you are writing about the world we live in or the lives we lead.
