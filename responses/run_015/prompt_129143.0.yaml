prompt: |-
  I'm a journalist who covers science and ideas, currently working on a long-form feature about whether causation by omission survives as a genuinely causal category once we shift from individual agents to distributed institutional settings. For the piece, I need a precisely engineered thought experiment rather than a recycled classroom example—something realistic and self-contained, built so that competing theories deliver distinguishable verdicts without relying on exotic devices or highly technical formalisms.

  Please construct a one-paragraph scenario set in an actual hospital or workplace—no trolley contrivances, no science fiction—in which serious harm results entirely from omissions, not from any positive act. The case should involve a distributed failure: several staff members each neglect a distinct precautionary step, yet no individual's omission is either necessary or sufficient for the outcome, and each agent acts according to a locally optimal decision rule that genuinely does not mandate the missed step. Crucially, there should be no clearly designated duty-bearer assigned specifically to the neglected precaution.

  After presenting the scenario, demonstrate that it meets the design specifications. State the verdict that a normative account (which treats omissions as causally relevant only where a specific duty is breached), a counterfactual-dependence account (which asks whether the harm still occurs if the agent had acted), and an interventionist account (which examines whether manipulating the omission changes the outcome) each deliver regarding whether any particular agent caused the harm by omission, and explain exactly why they diverge in this case. Then identify the single structural feature—most likely the combination of non-redundant collective failure and the absence of an assigned duty—that is doing the philosophical work. Explain what happens to the three verdicts if that feature is removed, for instance by introducing one clearly responsible party. Finally, include an honest note on how a defender of the account that fares worst—probably the normative account—would attack the case, likely by arguing that it misrepresents the causal structure rather than genuinely testing the theory. Keep everything within ordinary conceptual vocabulary; do not ask for bibliographies, citations, or references to specific texts, and avoid invoking niche named formalisms that depend on precise technical definitions.
