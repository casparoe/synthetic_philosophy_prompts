answer: |-
  In a metropolitan hospital's post-operative wing, a patient suffers severe respiratory distress because a critical monitoring alarm was never activated, a harm resulting entirely from three staff members each failing to engage a distinct safety toggle during a shift handover. The admitting physician, the floor nurse, and the respiratory technician all possess the authority to activate the monitor, and hospital protocol dictates that the system arms if *any two* of them engage their toggles, yet each assumes the others have already done so based on incomplete chart entries and acts on a locally rational rule to avoid redundant administrative work. No single staff member is assigned the specific duty to ensure the monitor is active, as responsibility is formally distributed across the team, and because all three omit the step, the threshold for activation is never met, though if any one of them had acted alone, the harm would still have occurred due to the inaction of the other two.

  This scenario meets the design specifications by ensuring the harm stems purely from inaction (no toggles switched on) within a realistic workplace, involving a distributed failure where no individual omission is necessary (since two failures are required for harm, one agent acting wouldn't prevent it) or sufficient (one agent failing doesn't cause harm if the other two act). Each agent follows a locally optimal rule (avoiding redundancy based on available info), and there is no designated duty-bearer for the final safety check.

  The three accounts diverge sharply here. A **counterfactual-dependence account** verdicts that no particular agent caused the harm, because if any single agent had acted (the counterfactual test), the other two would still have omitted, the threshold would remain unmet, and the harm would still occur; thus, the outcome does not depend on any individual. An **interventionist account** agrees, ruling that manipulating any single agent's behavior (forcing them to act) fails to change the outcome, so no individual is a causal handle for the harm. However, a **normative account** may verdict that all three caused the harm by omission, arguing that professional roles carry a general duty of care that transcends specific protocol triggers, meaning each breached an obligation to ensure patient safety regardless of what others did. The divergence arises because the physical accounts track dependence on individual variables, while the normative account tracks the breach of role-based obligations.

  The single structural feature doing the philosophical work is the **diffusion of causal pivot within a duty vacuum**: the system is designed so that no individual is pivotal (redundancy), combined with the absence of a specific assigned responsibility. If this feature is removed by introducing one clearly responsible party (e.g., the nurse is solely assigned to ensure activation), the verdicts converge. The normative account finds a clear breach of assigned duty; the counterfactual and interventionist accounts now find causation because removing that single agent's omission (or intervening on them) becomes necessary and sufficient to prevent the harm, restoring individual pivotality.

  An honest note on the normative account, which fares worst here by finding causation where physical dependence fails, is that its defender would likely attack the case by arguing it misrepresents the causal structure rather than testing the theory. They would contend that causation by omission is inherently a normative concept, not a physical one, so pointing out a mismatch with counterfactual physics misses the point; the "cause" in institutional settings *is* the breach of duty, and if the theory identifies a breach where harm occurs, it has correctly identified the cause, rendering the counterfactual failure irrelevant to the specific domain of institutional responsibility.
