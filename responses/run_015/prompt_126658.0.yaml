  **Joint Statement on Religious Reasons in Deliberation**

  **To:** Facilitation Team, State Citizens' Assembly on Assisted Dying
  **From:** The Advisory Committee on Deliberative Norms
  **Subject:** Guidance on Religious and Comprehensive Reasons

  We, the undersigned advisors, represent differing philosophical views on the role of religious reasons in political decision-making. We have collaborated to produce this guidance to ensure facilitators can manage these discussions without needing to resolve the underlying philosophical debate. Our goal is not to dictate what participants must believe, but to clarify the stakes of how they communicate.

  **I. Shared Ground: Claims Both Camps Accept**

  1.  **The Coercion Claim:** Because the assembly's recommendations may lead to laws that force citizens to act against their will (coercion), the burden of justification is higher than in private moral choices. *Deniable:* One could argue private morality imposes no less force than law.
  2.  **The Distinction Claim:** There is a meaningful difference between the reasons a citizen requires for themselves to vote a certain way (private conviction) and the reasons they offer to persuade others (public advocacy). *Deniable:* One could argue authenticity requires these to be identical.
  3.  **The Institutional Claim:** The duty to provide accessible reasons applies more strictly to the authors of the final rationale document and elected officials than to individual assembly participants speaking in small groups. *Deniable:* One could argue duties are equal across all stages.
  4.  **The Unanimity Claim:** The assembly's norm of seeking unanimity increases the necessity of finding shared language compared to a majority-vote body, as dissenters cannot be simply outvoted. *Deniable:* One could argue unanimity pressures participants to hide true reasons.
  5.  **The Facilitator Claim:** Facilitators must ensure no participant is silenced because their reasons are religious, but also ensure no participant insists their religious authority is binding on others. *Deniable:* One could argue facilitators should enforce stricter exclusion or no exclusion at all.

  **II. Areas of Disagreement**

  While we agree on the claims above, we disagree on how they apply in practice. Facilitators should be aware of these four cruxes. Below, we define key terms: *Epistemic warrant* refers to the evidence or authority supporting a claim. *Accessibility* means whether a reason can be understood and assessed by someone who does not share the speaker's faith.

  | The Crux | Inclusionist Claim | Restrictivist Claim | Agreed Evidence / Case | Predictions |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. Formulational**<br>(What is the requirement?) | The norm is about **permissibility**: it is never wrong to offer religious reasons in public advocacy, provided the speaker is sincere. The requirement for "shared language" applies only to the final legal text, not the deliberation. | The norm is about **accessibility**: a reason fails if its *warrant* (why it is true) depends on revelation others cannot access. Advocacy requires offering reasons others can assess, not just hear. | **Case:** A participant cites a sacred text to oppose assisted dying. | **Inclusionist:** Predicts this opens dialogue by revealing true stakes.<br>**Restrictivist:** Predicts this closes dialogue because non-believers cannot engage the warrant. |
  | **2. Asymmetric Accessibility**<br>(Secular vs. Religious) | The "accessibility" standard is biased. A majority may cite complex social science (e.g., "slippery slope data") that a religious minority cannot assess. If we ban religious reasons, we privilege secular expertise over religious conviction unfairly. | Secular claims are *in principle* accessible even if complex (data can be checked), whereas revelation is *in principle* inaccessible to non-believers. The distinction is about the *type* of warrant, not the difficulty. | **Case:** Majority cites disputed sociological studies; Minority cites scripture. | **Inclusionist:** Predicts facilitators will treat science as "neutral" and religion as "biased."<br>**Restrictivist:** Predicts facilitators can distinguish between contested facts and private authority. |
  | **3. Testimony**<br>(Trust vs. Grounds) | A participant may ask to be trusted based on their track record of judgment ("I have served this community well") without sharing the religious ground of their view. This satisfies democratic respect. | Trust is insufficient for coercion. If the ground is religious, declining to share it denies fellow citizens the ability to assess the reason's validity. Testimony shifts the burden but does not meet it. | **Case:** "Trust my judgment on this law, though I cannot explain why." | **Inclusionist:** Predicts this maintains relationships and integrity.<br>**Restrictivist:** Predicts this creates blind obedience, undermining autonomy. |
  | **4. Integrity and Uptake**<br>(Cost and Effect) | Restraint imposes an uneven moral cost on religious citizens, asking them to be alienated from their deepest convictions. This violates civic friendship. Evidence of entrenchment is when secular participants dismiss religious views as irrational. | Restraint is an etiquette of civic friendship, not a moral wrong. Evidence of entrenchment is when religious participants refuse to translate reasons, making compromise impossible. | **Case:** A participant refuses to rephrase a religious claim in secular terms. | **Inclusionist:** Predicts refusal signals integrity and invites deeper listening.<br>**Restrictivist:** Predicts refusal signals domination and halts consensus. |

  **III. Pathways Forward**

  We do not expect facilitators to resolve these disagreements. However, we agree on what would change our own minds regarding the best practices for this assembly.

  **What Would Move the Restrictivist Camp?**
  We would revise our stance if empirical evidence showed that requiring accessible reasons systematically excludes religious minorities from effective participation in citizens' assemblies, leading to recommendations that are unstable or widely rejected by religious communities. Specifically, if data showed that "translation" norms consistently result in religious participants withdrawing from deliberation rather than engaging, we would concede that the cost to legitimacy is too high.

  **What Would Move the Inclusionist Camp?**
  We would revise our stance if evidence demonstrated that allowing unrestrained religious advocacy in unanimity-seeking bodies consistently leads to deadlock or coercive outcomes that lack secular justification. Specifically, if we observed that religious reasons were used not to express conviction but to veto compromise without offering alternative grounds acceptable to the minority, we would concede that some procedural restraint is necessary for functional governance.

  **Is There a Settlement?**
  There is no single finding that would fully settle the matter, as our disagreement rests on foundational views of democracy ( legitimacy vs. authenticity). However, both camps agree on a procedural safeguard: **The Final Rationale.** Regardless of what is said during deliberation, both camps agree that the final written recommendation sent to the legislature must be justified using reasons accessible to the general public. The Restrictivist sees this as the essential duty of coercion; the Inclusionist accepts this as a pragmatic requirement for legislative uptake. Facilitators should encourage participants to keep this end-goal in mind: you may speak from conviction, but the final document must speak to all.

  **Signed,**

  *The Advisory Committee on Deliberative Norms*
