      *   **Diagnose the Flatmate's Math:** He is using Harsanyi's Aggregation Theorem but making a critical hidden assumption: that everyone values the room equally.
      *   **The Break Point:** The "Symmetry" claim. Symmetry applies to moral standing, not utility magnitude. If Anna benefits 2x more, the math changes.
      *   **Reconciling Intuitions:**
