          *   Anna: $0 \times U_{User} + 0 \times U_{Flatmate} + 1 \times U_{Anna}$
          *   For these to be tied, $U_{Anna}$ must equal $0.5(U_{User} + U_{Flatmate})$.
          *   If Anna works from home, $U_{Anna}$ is likely $> U_{User}$ and $> U_{Flatmate}$. Therefore, Anna > Coin in total utility.
      *   *So why does the flatmate say they are tied?* He is likely assuming $U$ is binary (1 for getting room, 0 for not) regardless of *how much* they need it. This is the "choice he made." He chose to ignore intensity of preference/need.

  5.  **Develop a Solution/Recommendation:**
