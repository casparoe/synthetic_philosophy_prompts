      *   *Best Approach:* Acknowledge the flatmate's framework is incomplete. The "Symmetry" assumption is the weak link. Need breaks symmetry.
      *   *Decision:* If Anna *really* needs it (WFH), she should get it. If User/Flatmate want it just for prestige/comfort, need trumps want.
      *   *However,* the User asked about the conflict between "Coin is fair" and "Need matters."
      *   *Resolution:* The coin is fair *between equals*. If needs differ, you aren't equals in this context.

  6.  **Drafting the Response:**
