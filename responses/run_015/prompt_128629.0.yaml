      *   **The Flatmate's Error:** He assumes equal *value* of the room, not just equal *weight* of the person.
      *   **The Break Point:** The "Symmetry" assumption. It holds for rights, not for utility intensity.
      *   **Reconciling Intuitions:** Coin = Equal Opportunity. Need = Equal Welfare. Need usually wins in co-living.
