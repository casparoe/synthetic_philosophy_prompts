      *   The flatmate is essentially invoking a simplified version of *Harsanyi's Utilitarianism Theorem* or a specific interpretation of *Social Choice Theory*.
      *   *The Flaw:* The flatmate assumes "Symmetry" means "Equal Weights on *People*," but ignores "Equal Weights on *Outcomes* relative to Need."
      *   *The "Expected Utility" Trap:* The flatmate calculates utility based on *winning the room*.
          *   Coin Toss: User gets 50% chance, Flatmate gets 50% chance, Anna gets 0%.
          *   Give to Anna: User gets 0%, Flatmate gets 0%, Anna gets 100%.
      *   *The Missing Variable:* The *magnitude* of the utility gain.
          *   If Anna works from home, her utility gain ($\Delta U_{Anna}$) is likely much higher than the User's or Flatmate's ($\Delta U_{User}$, $\Delta U_{Flatmate}$).
          *   Flatmate's argument assumes $\Delta U$ is roughly equal for everyone who wants the room. This is the hidden assumption.
      *   *Symmetry:* Symmetry applies to the *procedure* (everyone counts equally), not necessarily the *outcome* if needs differ.

  3.  **Address the User's Intuitions:**
      *   *Intuition 1 (Coin is fairer):* This relies on a "Procedural Justice" view. If two people want something equally, a random lottery is fair. However, if needs differ, procedural fairness might conflict with distributive justice.
      *   *Intuition 2 (Need matters):* This relies on a "Utilitarian" or "Prioritarian" view. Maximizing total welfare or helping the worst-off.
      *   *Compatibility:* Yes, they can both be true, but they prioritize different values (Equality of Opportunity vs. Equality of Outcome/Welfare).

  4.  **Pinpoint the Break in Flatmate's Logic:**
      *   The break is at "the weights have to be equal."
      *   While weights on *persons* should be equal (impartiality), the *utility values* assigned to outcomes are not symmetric.
