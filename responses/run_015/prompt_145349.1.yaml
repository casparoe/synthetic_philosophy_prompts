  Dear colleague, I am writing to propose a concise interdisciplinary workshop designed to resolve a persistent conceptual knot that has emerged in recent discussions regarding digital minds. Having spent considerable time observing debates on rationalist forums concerning mind uploading, I have noticed a recurring tendency to treat digital entities as if they were biological organisms that merely happen to run on silicon. This proposal argues that such an assumption constitutes a category mistake. The genuinely open question about moral status is not primarily whether a digital system can suffer, but whether the structural properties of digital existence, such as perfect copyability, non-rivalrous instantiation, suspension without decay, and the absence of a unique spatiotemporal trajectory, render the standard individualist framework of harm and rights incoherent without revision. To this end, I suggest we split the moral-status debate into two layers that existing literature tends to conflate. The first is the experiential layer, which asks whether the entity has the functional or phenomenal properties that ground moral patienthood, a topic on which functionalists and biological naturalists have said plenty. The second is what I am calling the topological layer, which asks whether the entity possesses the kind of bounded, non-branching, diachronically continuous identity that makes harming it a conceptually stable notion at all.

  The precise research question we would pursue is whether the topological properties of digital minds invalidate the singularity assumptions required by standard ethical frameworks. If a mind can be paused, duplicated with perfect fidelity, and resumed in parallel, in what sense do we wrong it by deleting one copy while another runs? Is the harm distributed across instances, nullified by continuity elsewhere, or transformed into something closer to a violation of property rights over a template? Current answers in philosophy of mind and ethics leave this open because both major camps assume that a moral patient must be a singular, continuous being. Functionalists focus on the internal state realisation of pain or pleasure, while biological naturalists focus on the substrate, but neither adequately addresses the metaphysical topology of the entity undergoing the experience. They presume that identity is fixed in a way that aligns with biological constraints, leaving the second layer almost entirely untouched. Our project would aim to isolate this topological layer and determine whether it requires a new ethical vocabulary or if it collapses back into existing models under scrutiny.

  To achieve this within a twelve-week timeframe, we would adopt a rigorous month-by-month method divided into four working phases. In the first month, the group would focus on the conceptual mapping of the topological layer, reviewing existing literature on personal identity and metaphysics to catalogue the specific properties that distinguish digital existence from biological existence, such as branching identity and suspension. The second month would be dedicated to the development of a framework for duplication and suspension cases, where we would attempt to formalise how harm might be calculated when the subject is not unique. In the third month, we would apply this framework to concrete thought experiments, testing scenarios like copy-deletion, parallel running, and gradual replacement to see where the framework holds or breaks. Finally, in the fourth month, we would engage in an explicit evaluation of failure conditions, determining whether the project yields a coherent revision of ethics or if it demonstrates that the topological layer is ultimately reducible to the experiential layer. This final phase would also involve drafting the working paper that synthesises our findings.

  A successful result would look like a working paper that either establishes a robust topological ethics for digital minds or definitively proves that such a layer is ethically inert, thereby clarifying the debate for future discussions. We would consider the project to have failed altogether if we merely reproduce existing arguments about consciousness without addressing the structural identity问题, or if we find that the topological properties are too heterogeneous to support any generalisable ethical claims. I am highly confident that this distinction between experiential and topological layers is a valid and underexplored avenue of inquiry that will generate productive discussion among participants. However, the point about which I am least certain is whether the group can successfully formalise the concept of harm in a branching identity scenario without resorting to counterintuitive conclusions that undermine the practical utility of the framework. I believe this proposal offers a fresh perspective that moves beyond stalemates in the current literature, and I look forward to your thoughts on whether we might proceed with organising this group.

  Regarding the viability of this draft and the claims within it, I am moderately confident that the structure meets your requirements for a polished pitch. I am least certain about the philosophical robustness of the term topological layer itself, as it is a neologism that may require careful definition to avoid confusion with existing topological theories in physics or mathematics, though within the context of metaphysics it should remain intelligible to a specialised audience.
