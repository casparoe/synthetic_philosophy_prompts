answer: |-
  I recommend we remove the donor's name from the School of Public Health. I recommend we approve naming the admissions building after the civil-rights organizer, provided the administration couples this with a public plan to meet enrollment targets.

  The principle governing both decisions is Functional Integrity. A building name is not a historical plaque recording a past transaction; it is a current assertion that the namesake embodies the unit's mission. When the relationship between the namesake and the unit's function becomes incoherent, the name becomes a falsehood. This implies that naming cannot be a one-time event followed by silence. We must move from complaint-driven reviews to scheduled audits every decade, ensuring the name still fits the work being done inside the building, regardless of whether scandal has broken.

  In Case A, the argument I reject is contractual sanctity. Proponents argue that donors give based on permanent recognition, and retroactively altering agreements destroys the trust required for philanthropy. Stability in naming is a public good that outweighs transient political conflicts, and the university must honor the letter of the gift agreement to protect future revenue streams. In Case B, the argument I reject is that symbolic commitment substitutes for material action. The faculty opposition contends that naming the building now allows the administration to display a virtue it has not practiced. They argue that using a civil-rights organizer's name while missing enrollment targets is commemorative laundering, where the symbol is used to pacify critics rather than drive the reform the symbol represents.

  To clarify our reasoning for the Board, we distinguish three levels of agreement:

  *   **Consensus:** Anyone who has thought about this would grant that names communicate institutional values and affect community morale. No one believes names are neutral labels; they all acknowledge that keeping or removing a name sends a signal about who belongs here.
  *   **Contested:** Ethicists genuinely disagree on whether names are primarily retrospective honors or prospective mission statements. They also dispute whether donor intent binds the institution in perpetuity when the external context shifts radically, or whether the institution's current mission overrides past agreements.
  *   **Judgement:** No principle settles the threshold of misalignment required for removal in Case A. Similarly, no rule determines whether symbolic commitment in Case B sufficiently offsets material failure; that requires administrative courage, not ethical calculus. The committee must decide how much hypocrisy the institution can tolerate before the name becomes a liability.

  Regarding the unpaid installment in Case A, we must treat the pledge as void. Accepting money contingent on silencing faculty or maintaining a misleading name compromises institutional independence. We cannot be blackmailed into integrity. In our letter to the donor, we will state clearly that the removal is not personal but functional; their current advocacy opposes the school's core purpose, breaking the functional integrity required for the naming. We will cite the clause regarding the institution remaining true to its purposes as the mechanism for this decision.

  To the faculty group opposing Case B, we must acknowledge their concern about commemorative laundering is valid. Approving the name is not an absolution of missed targets. We will pair the naming ceremony with a public strategic plan to meet enrollment goals, ensuring the name demands accountability rather than masking failure. We will tell them that the name is not a reward for past success, but a charge for future performance. If the administration fails to meet the renewed targets, the naming will be reviewed again at the next scheduled audit. This approach treats naming as stewardship, not decoration, and ensures that our buildings speak truthfully about the work we do.
