answer: |-
  Dear Friend,

  It is completely understandable that you felt frustrated by that dinner conversation, because your intuition is correct that the phrase the separateness of persons is often wielded as a conversation-stopper precisely because it is ambiguous. It sounds profound, but depending on how you unpack it, it ranges from a trivial observation that utilitarians happily accept to a radical metaphysical claim that few people actually hold. The phrase originates primarily with John Rawls in A Theory of Justice, where he argues that utilitarianism extends the principle of choice for one person to society as a whole, thereby failing to take seriously the distinction between persons. To understand what work the phrase is actually doing, we need to separate out the different layers of meaning hidden inside it, ranging from the harmless to the revolutionary.

  At the most basic level, the claim is simply that individuals are metaphysically distinct entities. You are not me, and my pain is not your pain. If this is all the phrase means, it is a platitude that utilitarians fully endorse. Classical utilitarians like Bentham and Mill never denied that people are separate; they simply argued that for moral purposes, the location of welfare does not matter, only the amount. Bentham famously wrote that each person is to count for one and none for more than one, which is actually an affirmation of separateness in the sense that no single person's welfare is privileged or double-counted. So if your friend meant that utilitarianism denies we are different people, she would be factually wrong, and this version of the objection does no work against the theory.

  A slightly more substantive version, which is closer to Rawls's actual argument, is that utilitarianism conflates all-person balancing with one-person balancing. For a single individual, it is rational to sacrifice a present pleasure for a future gain, or to endure a headache to avoid a migraine later, because it is the same person experiencing both the loss and the gain. Rawls argues that society is not a super-person. There is no single entity that experiences the net gain when one person suffers so another may benefit. Therefore, it is category error to apply the logic of individual prudence to social justice. This is a defensible and serious philosophical critique. It suggests that utilitarianism misses something important about consent and distribution, but it does not necessarily forbid all trade-offs. It just demands a different justification for them than simple aggregation. This reading challenges the foundation of utilitarianism but does not automatically rule out saving five people by diverting a trolley, since the threat in that case is external and not imposed by the state or a moral agent using the one as a tool.

  The version of the claim that actually does the heavy lifting in the organ-harvesting case is the deontological interpretation. Here, the separateness of persons is understood to mean that individuals have inviolable boundaries or rights that cannot be crossed even for the greater good. This view holds that because we are separate, you cannot use one person as a mere means to save others. This is why the objection bites hard on the organ-harvesting case but often feels less relevant to the trolley case. In the trolley case, the one person is killed as a side effect of diverting a threat, whereas in the organ case, the healthy stranger is killed as the means to save the patients. On this reading, the separateness of persons is a shorthand for side-constraints or rights that trump utility calculations. This is a substantive and defensible position, held by Kantians and rights-based theorists, but it is not a logical truth. It is a rival moral theory to utilitarianism, not merely an observation about metaphysics.

  There is also a radical interpretation which claims that welfare is not fungible across persons at all, meaning that a loss for one person can never be outweighed by a gain for another. If this were true, almost all public policy would be impossible, since building a road or taxing income always involves losses for some to benefit others. Most philosophers who invoke separateness do not go this far, because it leads to moral paralysis. So while this reading would certainly dismiss utilitarianism, it is generally considered implausible or false in all but the most extreme absolutist frameworks. It is unlikely your friend meant this, as it is too rigid to sustain a coherent moral life.

  When your friend used the phrase to shut down the conversation, she was most plausibly invoking the deontological interpretation, the idea that individuals have rights that cannot be aggregated away. This is the version that feels like a trump card because it frames utilitarianism as fundamentally disrespectful rather than just miscalculating. It supports dismissing the organ-harvesting case because that case violates the boundary of the individual, treating them as a resource rather than a person. However, using it to dismiss the entire question of trade-offs, including the trolley case, is less consistent. As you noticed, many non-utilitarians still agree you should pull the lever in the trolley case, which suggests that separateness does not forbid all sacrifices, only certain kinds of violations.

  So to summarize the landscape for you, the claim that people are distinct is a platitude utilitarians accept. The claim that society is not an individual is a substantive structural critique that challenges utilitarian reasoning but does not forbid all trade-offs. The claim that individuals have inviolable rights is a substantive rival theory that blocks organ harvesting but requires further justification beyond the phrase itself. The claim that no trade-offs are ever permitted is likely false or too radical to be useful. Your friend was likely using the phrase to signal the rights-based view, which is a legitimate objection, but presenting it as if it were a self-evident truth that settles the matter is where the conversation became unproductive. It is worth engaging with again, but only if you can pin down which of these layers she intends to defend.

  I hope this helps clarify the terrain for you. It is a fascinating topic and you are right to dig deeper than the slogan allows.

  Best regards,

  Your Assistant
