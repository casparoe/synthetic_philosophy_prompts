      *   *Case 3 (Mutually Dependent Package):* Two invalid-until-other-passes. *Analysis:* Atomicity of amendment acts.
      *   *Case 4 (Renumbering Gambit):* Moving a rule out of protection to amend it. *Analysis:* Circumvention vs. Compliance. Likely distinct from (3) because (3) is about logical dependency, (4) is about procedural evasion.
      *   *Case 5 (Retroactive Self-Illegalization):* Making the enactment itself a violation ex post or ex ante. *Analysis:* Temporal validity and paradox.
      *   *Case 6 (The Façade):* Interpretation vs. Amendment. *Analysis:* The boundary of the "amendment power." Crucial for capture detection.
      *   *Case 7 (Invalid but Effective...):* Validity vs. Efficacy (Hart's internal/external point of view). *Analysis:* Sociological vs. Jurisprudential validity.
      *   *Case 8 (The Penalized Motion):* Prohibiting the attempt to amend. *Analysis:* Competence vs. Prohibition.
      *   *Case 9 (Systemic Identity):* Replacement vs. Revision. *Analysis:* Continuity of identity.

  3.  **Drafting the Requirements List:**

      *   Need to translate cases into theoretical capabilities.
      *   *Requirement 1: Hierarchy/Entrenchment.* Must handle graded validity. (From Case 1).
      *   *Requirement 2: Bootstrapping/Competence.* Must distinguish between changing the *rule* of change and changing the *agent* of change. (From Case 2).
