answer: |-
  ### I. Theoretical Requirements Specification

  This list defines the capabilities a theory must possess to function as a stress-test for amendment-layer capture. Classifications are based on your stated purpose: distinguishing *amendment* (system-internal change) from *capture* (system-subverting seizure).

  | # | Requirement | Source Case | Classification | Rationale |
  | :--- | :--- | :--- | :--- | :--- |
  | **1** | **Graded Validity:** The theory must represent validity as a scalar or hierarchical property, not binary. It must distinguish between "harder to change" and "impossible to change" without treating the latter as a logical error. | 1 (Entrenchment Ladder) | **Non-negotiable** | Capture often proceeds by incrementally raising thresholds until change is impossible, or by lowering them to zero. A binary valid/invalid model cannot detect the drift toward rigidity or fluidity that signals capture. |
  | **2** | **Competence/Agency Distinction:** The theory must distinguish between changing the *procedure* for amendment and changing the *constituency* authorized to amend. It must adjudicate whether a constituency can validly dissolve or replace itself. | 2 (Self-ratifying Franchise) | **Non-negotiable** | This is the primary vector for authoritarian capture (packing the court/voter base). A theory that treats this as ordinary amendment fails to detect the dissolution of the principal-agent relationship. |
  | **3** | **Atomicity of Acts:** The theory must define the minimal unit of "an amendment." It must determine whether logically interdependent rules constitute one act or many for the purpose of procedural compliance. | 3 (Mutually Dependent Package) | **Negotiable** | While important for procedural integrity, capture can occur via single acts. However, without this, "poison pill" packages cannot be evaluated. Keep, but the definition of "act" can be institutional rather than theoretical. |
  | **4** | **Substance-over-Form:** The theory must be able to identify procedural compliance that violates substantive constraints (e.g., moving a rule to evade protection). It requires a concept of "fraud on the constitution." | 4 (Renumbering Gambit) | **Non-negotiable** | This is distinct from (3). (3) is logical; (4) is evasive. Capture almost always uses formal compliance to violate substantive intent. A theory that cannot see evasion cannot detect capture. |
  | **5** | **Temporal Coherence:** The theory must resolve the status of retroactive validity without generating paradoxes that halt the system. It must distinguish between *validating* a past act and *rewriting* history. | 5 (Retroactive Self-Illegalization) | **Negotiable** | Retroactivity is a tool of capture (punishing opposition ex post), but a theory that bans it entirely cripples transitional justice. The theory must allow it but flag it as high-risk. |
  | **6** | **Interpretive Boundary:** The theory must provide a criterion to distinguish *interpreting* a rule from *amending* it. It cannot treat all applications as amendments, nor can it treat interpretation as immune to review. | 6 (The Façade) | **Non-negotiable** | This is the most common soft-capture mechanism. If the theory cannot draw this line, the amendment layer is irrelevant. |
  | **7** | **Validity/Efficacy Gap:** The theory must maintain a distinction between a rule being *valid* (authorized) and being *effective* (obeyed), while accounting for the point where persistent efficacy creates new validity. | 7 (Invalid but Effective) | **Non-negotiable** | Capture often succeeds by making invalid acts effective. A theory that collapses validity into efficacy (might makes right) cannot identify capture, only success. |
  | **8** | **Competence vs. Prohibition:** The theory must distinguish between a rule that says "you may not amend this" (duty) and "you cannot amend this" (lack of power). | 8 (The Penalized Motion) | **Non-negotiable** | If a prohibition is treated as a lack of competence, the system freezes. If treated as a duty, it allows for revolutionary amendment. Capture exploits this ambiguity. |
  | **9** | **Internal Identity Criterion:** The theory must provide a standard for determining when a set of changes constitutes a *new* system rather than a modified old one, derivable from within the system's own logic. | 9 (Systemic Identity) | **Non-negotiable** | If the theory cannot say when the institution has ceased to exist, it cannot say when it has been captured. Continuity is the baseline against which capture is measured. |

  ### II. Corrections to Case Classifications

  You have conflated distinct theoretical problems in two places:

  1.  **Cases 3 and 4 are not the same requirement.**
      *   **Case 3 (Package)** tests **Logical Atomicity**. It asks: "Is this one move or two?" If the theory evaluates moves sequentially, it fails Case 3.
      *   **Case 4 (Renumbering)** tests **Procedural Good Faith**. It asks: "Does following the letter violate the spirit?" A theory can handle simultaneous moves (Case 3) perfectly but still fail to detect evasion (Case 4).
      *   *Correction:* Treat these as separate stress tests. Case 3 requires a theory of *transactional integrity*; Case 4 requires a theory of *jurisprudential purpose*.

  2.  **Cases 1 and 9 are not the same requirement.**
      *   **Case 1 (Entrenchment)** is about **Degree**. It asks: "How hard is it to change?"
      *   **Case 9 (Identity)** is about **Kind**. It asks: "Is it still the same thing?"
      *   *Correction:* You can have an unamendable rule (Case 1 limit) without ending the system (Case 9). Conversely, you can amend everything gently and still create a new system (Case 9) without triggering entrenchment limits (Case 1). Do not merge these.

  ### III. The Jointly Unsatisfiable Subset

  You identified four tensions. Only one is a **real logical impossibility**; the others are tensions manageable by design.

  **The Real Impossibility: Content-Neutrality vs. The Capacity to Entrench.**
  *   **The Argument:** If the amendment power is content-neutral (unlimited), it can enact a rule making itself unamendable. Once enacted, the power is no longer unlimited. If the power is limited (cannot entrench), it is not content-neutral. A system cannot logically possess an unlimited power to limit itself. This is the Paradox of Sovereignty.
  *   **The Verdict:** This is a formal contradiction. You cannot have both.
  *   **Recommendation:** **Drop Content-Neutrality.**
      *   *Reasoning:* Your goal is *detecting capture*. If the amendment power is content-neutral, "capture" is theoretically impossible; any successful move is valid by definition. To detect capture, you *must* presuppose that some substantive outcomes are incompatible with the system's identity (i.e., you must allow for entrenchment). A theory that demands neutrality is useless for your purpose because it validates all successful seizures.

  **The Manageable Tensions:**
  *   *Authorization vs. Revolution:* This is solved by accepting "extra-legal continuity" (the system recognizes its own replacement under specific conditions).
  *   *Determinacy vs. Gaps:* Do not demand determinacy. A theory that forces a Yes/No verdict on every self-referential act will break under Gödelian pressure. Allow for "Undecidable Zones." For your purpose, an "Undecidable" verdict *is* a warning flag for capture risk.
  *   *Symmetry vs. Irreversibility:* Time is asymmetric. Demanding symmetry is a preference for logical elegance over political reality. Irreversibility is required for stability.

  ### IV. The Single Exclusionary Requirement

  **Requirement 9 (Internal Identity Criterion)** excludes the largest share of accounts.

  *   **Why:** Most theories ground system identity *outside* the system (in a presupposed norm, a social fact, or a higher-level observer). They treat the question "Is this still the same constitution?" as a sociological or historical question, not a legal one.
  *   **The Filter:** Demanding that the *rules themselves* contain the criteria for their own succession forces the theory to solve the problem of self-reference without appealing to an external anchor. This eliminates standard positivist accounts (which rely on an external Rule of Recognition) and pure natural law accounts (which rely on external morality). Only a reflexive, cybernetic, or dialectical account survives.

  ### V. Scoring the Three Families

  **1. Accounts grounding validity in a presupposed ultimate rule.**
  *   **Shape:** A Pyramid resting on a bedrock not part of the structure.
  *   **Score:** Fails Requirement 9 (Identity) and Requirement 2 (Franchise). It cannot explain how the bedrock moves without treating the move as a collapse of the system. Good for stability, blind to self-reconstruction.

  **2. Accounts grounding validity in the practice and acceptance of officials.**
  *   **Shape:** A Circle or Web where validity is the pattern of current behavior.
  *   **Score:** Passes Requirement 7 (Efficacy) but fails Requirement 6 (Façade) and Requirement 4 (Evasion). It cannot distinguish between a successful capture and a valid amendment, because successful capture *becomes* valid practice. It detects nothing; it only describes.

  **3. Accounts avoiding self-reference by stratifying rules into levels.**
  *   **Shape:** An Infinite Ladder where the rule for changing level *N* is always at level *N+1*.
  *   **Score:** Passes Requirement 1 (Entrenchment) but fails Requirement 9 (Identity) and Requirement 5 (Temporality). It requires a "top rung" that cannot be changed from within. It solves paradox by banishing it to a higher level, which eventually runs out of sky.

  ### VI. What This Theory Should Not Be Asked To Do

  1.  **It should not guarantee justice.** A system can be self-consistent, identity-preserving, and procedurally perfect while being morally abhorrent. This theory detects *procedural capture*, not *tyranny*.
  2.  **It should not prevent political conflict.** It is a diagnostic tool, not a shield. It will identify when the rules are being weaponized, but it cannot stop the actors who control the enforcement mechanisms.
  3.  **It should not resolve the "Ultimate Question."** Do not ask the theory to prove why the system exists in the first place. It must take the existence of the initial normative order as a brute fact and only govern its *transformation*. Asking it to justify its own foundation invites the infinite regress you are trying to avoid.
