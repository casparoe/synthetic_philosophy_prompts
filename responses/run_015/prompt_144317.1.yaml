      *   *Requirement 4: Evasion/Substance over Form.* Must detect procedural compliance that violates substantive intent. (From Case 4).
      *   *Requirement 5: Temporality.* Must handle retroactivity without paradox. (From Case 5).
      *   *Requirement 6: Interpretation Boundary.* Must distinguish interpretation from amendment. (From Case 6).
      *   *Requirement 7: Efficacy/Validity Link.* Must account for the sociological fact of acceptance without collapsing validity into power. (From Case 7).
      *   *Requirement 8: Competence vs. Duty.* Must distinguish "cannot" (lack of power) from "must not" (breach of duty). (From Case 8).
      *   *Requirement 9: Identity/Continuity.* Must define when the system ceases to be itself. (From Case 9).

      *   *Classification:* Since the goal is *detecting capture*, requirements that allow for ambiguity in validity are dangerous. However, demanding determinate verdicts on everything might be impossible (Gödelian issues).
      *   *Non-negotiable:* Those essential to distinguishing capture from amendment (e.g., Identity, Evasion, Competence).
      *   *Negotiable:* Those that depend on specific institutional culture (e.g., strict temporality).
      *   *Disguised Preference:* e.g., demanding a specific solution to the "ultimate rule" problem.

  4.  **Refining Case Classifications:**

      *   (3) and (4) are *not* the same. (3) is logical interdependence (simultaneity). (4) is procedural sequencing (evasion). They test different things (Atomicity vs. Good Faith/Substance).
      *   (1) is about *limits*, (9) is about *identity*. They are related but distinct.

  5.  **The Jointly Unsatisfiable Subset (The Impossibility Theorems):**

      *   User's candidates:
          1.  Authorization vs. Revolution (Validity source).
          2.  Determinacy vs. Gaps.
          3.  Content-Neutrality vs. Entrenchment.
          4.  Symmetry vs. Irreversibility.
      *   *Analysis:* The strongest impossibility is **Content-Neutrality vs. Entrenchment**. If the amendment power is unlimited (neutral), it can destroy itself (unamendable). If it is limited (entrenched), it is not neutral. This is the "Paradox of Sovereignty."
      *   *Another strong one:* **Determinacy vs. Self-Reference.** A system cannot fully define its own validity conditions without remainder (incompleteness).
      *   *Advice for Capture Detection:* Drop **Determinacy**. Capture often happens in the gaps. A theory that forces a Yes/No on everything will miss the subtle drift. Accepting gaps allows you to flag "Zone of Capture Risk."
      *   *Also:* Drop **Symmetry**. Irreversibility is a key feature of entrenchment needed to prevent capture, even if it creates logical tension.

  6.  **The Single Exclusionary Requirement:**

      *   Which requirement kills the most theories? Likely **Requirement 6 (Interpretation Boundary)** or **Requirement 7 (Efficacy/Validity Link)**.
      *   Actually, **Requirement 9 (Systemic Identity)** is the hardest. Most legal theories assume continuity or treat revolution as external. A theory that must internally judge "am I still me?" excludes most positivist accounts that rely on an external observer for revolutionary breaks.
      *   *Wait, let's look closer.* The requirement to **distinguish Interpretation from Amendment (Case 6)** excludes almost all formalist accounts because formally, interpretation isn't amendment. It excludes all pure practice accounts because practice blurs the line. It requires a normative theory of *meaning*.
      *   *Alternative:* The requirement that **Validity must not collapse into Efficacy (Case 7)**. This kills pure realist/sociological theories.
      *   *Decision:* The requirement to **provide an internal criterion for Systemic Identity (Case 9)** is the most exclusionary. Most theories treat the "basic norm" or "rule of recognition" as a presupposition, not something the system can adjudicate internally without circularity.

  7.  **Scoring the Three Families:**

      *   *Family A (Ultimate Rule/Presupposed):* Shape: Pyramid. Top is fixed outside. Good for stability, bad for self-amendment (can't explain changing the top).
      *   *Family B (Official Practice/Acceptance):* Shape: Circle/Web. Validity is what officials do. Good for revolutions, bad for distinguishing capture from successful capture (might makes right).
      *   *Family C (Stratified Levels):* Shape: Ladder. Rules about rules are higher. Good for logic, bad for the top rung (who amends the top?).

  8.  **What the Theory Should Not Do:**

      *   It should not guarantee moral justice.
      *   It should not prevent all capture (it's a detector, not a shield).
      *   It should not resolve political disputes, only procedural legitimacy.

  9.  **Review and Refine:**

      *   *Tone:* Professional, precise, theoretical but applied.
      *   *Constraints:* No author names, no reading list.
      *   *Check:* Did I address the "jointly unsatisfiable" part clearly? Yes, focus on the Content-Neutrality vs. Entrenchment paradox and the Determinacy vs. Gaps paradox.
      *   *Check:* Did I classify the requirements correctly? Need to ensure "Non-negotiable" aligns with the user's goal (detecting capture).
      *   *Correction on Cases:* I need to explicitly tell the user where their case classification is wrong (e.g., 3 vs 4).

  10. **Final Polish:** Ensure the distinction between "Non-negotiable" (must have to detect capture) and "Negotiable" (nice to have) is clear. For example, "Determinacy" should be marked as a Disguised Preference or Negotiable because demanding it leads to failure in edge cases. "Identity" is Non-negotiable because without it, you can't tell if the institution survived the capture.

      *(Self-Correction during drafting)*: Wait, regarding the "Jointly Unsatisfiable Subset." The user asks which is a *real impossibility*. The "Content-Neutrality vs. Entrenchment" is a logical contradiction (Unlimited power cannot limit itself). "Determinacy vs. Gaps" is a logical limitation (Gödel). I should highlight the Content-Neutrality one as the primary structural flaw in self-amendment theories.
      *Advice on what to drop:* If the goal is detecting capture, drop **Content-Neutrality**. You *need* entrenched cores to define capture. If everything is amendable, capture is just "amendment." To detect capture, you need a standard that *cannot* be moved easily.

      *(Refining the "Single Requirement" that excludes accounts)*: Actually, the requirement that **Validity must be distinguishable from Efficacy (Case 7)** is the classic Hart vs. Austin divide. But for *self-amendment*, the requirement that **The system must internally identify its own successor (Case 9)** is tougher. Pure Kelsenian theory fails here (the Grundnorm is external). Pure Hartian theory fails here (Rule of Recognition is a fact, not a rule). I will stick with **Systemic Identity** as the biggest filter.

      *(Refining the Case 3 vs 4 distinction)*: Case 3 is about *logical consistency* (simultaneity). Case 4 is about *procedural integrity* (sequence). They test different mechanisms. I will advise they are distinct.

      *(Refining the Requirements List)*: Make sure the "Non-negotiable" tags align with the "Capture Detection" goal.
      *   To detect capture, you need to know when the system *ends* (Identity).
