      *(Final check on tone)*: Ensure I sound like an expert talking to a journalist. Confident, precise, no "on the one hand."

      *Wait, one nuance:* The user asked: "Is WOPR's 'learning' actually a trembling-hand failure... or is the film just confusing epistemic uncertainty with strategic reasoning?"
      *My answer:* It is the latter. It confuses learning (epistemic) with trembling (strategic execution). I will take that side.

