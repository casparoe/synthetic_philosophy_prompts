answer: |-
  Here are ten questions drafted for a 40-minute interview. They're written in spoken English, designed to be read off a card or screen, with anticipated moves and follow-ups included so you don't get stuck if she pivots.

  ### 1. The "Robustness" Distinction
  **Question:** "I want to start with the closest cousin to your view. In machine learning, we talk about out-of-distribution robustness—how well a model holds up when the test data looks different from the training data. You distinguish your 'crutch curve' from this by saying robustness is usually task-relative, while your curve is a partial order over whole families of degradation. But if I'm a skeptic, it looks like you've just taken 'robustness,' added a bunch of different ways to break the system, and given it a sexier name. What work is the 'partial order' doing that 'multi-task robustness' isn't already doing?"

  **Anticipated Move:** She'll likely say robustness is about *noise* in the input, whereas her view is about removing *structural supports* (tools, feedback loops).
  **Follow-up:** "Okay, but if I treat 'access to tools' as just another variable in the input distribution, the math looks identical. If the distinction is just semantic, does the 'crutch curve' actually predict anything new, or is it just a reinterpretation of existing robustness metrics?"

  ### 2. The No-Free-Lunch Worry
  **Question:** "To draw these curves, someone has to decide which crutches to pull away. Do we remove language? Do we remove internet access? Do we remove electricity? It feels like there's a No-Free-Lunch theorem hiding here: whichever degradations you choose to prioritize already smuggles in an assumption about which environments matter. If you choose crutches that matter to humans, aren't you just measuring 'human-like intelligence' while claiming you've defined 'general intelligence'?"

  **Anticipated Move:** She'll argue that some crutches are objectively more fundamental to computation than others (e.g., memory vs. specific tools).
  **Follow-up:** "But isn't 'fundamental' itself relative to the architecture? A fish needs water; a bird needs air. If you define intelligence by how well something survives without water, the fish looks stupid. How do you pick the 'universal' crutches without secretly picking them based on what *we* value?"

  ### 3. The Bacteria & Tardigrade Problem
  **Question:** "Let's talk about biology. Tardigrades can survive extreme radiation, vacuum, and dehydration that would kill any human instantly. On their specific degradation curve, they outperform us massively. Does your account commit you to saying tardigrades are more intelligent than humans in those contexts? Or do you have to say the degradations have to be of a specific, representational kind?"

  **Anticipated Move:** She'll likely say survival isn't intelligence; the degradations must target *cognitive* supports, not just biological viability.
  **Follow-up:** "But that sounds like you're sneaking cognition back in through the back door. If you have to specify that the supports must be 'cognitive supports' to avoid counting bacteria as geniuses, haven't you just assumed the thing you're trying to define? How do you cash out 'cognitive support' without referencing intelligence itself?"

  ### 4. The Measurement Dodge
  **Question:** "I've heard this objection raised before: measuring the 'area under the degradation curve' is exponentially expensive. You have to test every system across endless combinations of removed supports. I suspect your reply is that this is a measurement problem, not a problem for the account itself. But if a theory posits a quantity that is practically impossible to measure, does it stop being a scientific theory and start being metaphysics?"

  **Anticipated Move:** She'll say all theoretical constructs (like mass or charge) are idealizations; imperfect measurement doesn't invalidate the concept.
  **Follow-up:** "Fair, but with mass, we have a consensus on how to approximate it. With crutches, every lab might choose different degradations. If we can't agree on the audit protocol, won't we just end up with incompatible 'intelligence scores' that can't be compared? How do you prevent the theory from fragmenting into a dozen incompatible dialects?"

  ### 5. Human Scaffolding & AGI
  **Question:** "If intelligence is about performance when crutches are removed, humans look pretty weak. Take away language, literacy, sleep, other people, and our tools, and human performance collapses fast. Are you committed to saying human intelligence is mostly institutional scaffolding? And if you bite that bullet, what's left of 'Artificial General Intelligence' as a research target? Are we trying to build a standalone mind, or just really good scaffolding?"

  **Anticipated Move:** She'll agree humans are scaffolded and say AGI should be evaluated the same way—as part of a system, not a brain in a vat.
  **Follow-up:** "But the industry promise of AGI is usually a system that can *do* things autonomously. If your view says autonomy is the wrong metric, does that mean the current AGI race is chasing the wrong thing? Should we be building 'cyborg systems' instead of 'general agents'?"

  ### 6. Psychometrics and the "g" Factor
  **Question:** "In human psychometrics, people who do well on one cognitive test tend to do well on others—the positive manifold, or 'g' factor. Does your account predict that? If intelligence is a family of separate degradation curves, is it possible to have a system that holds up perfectly when you remove memory but collapses when you remove feedback? Or do the curves have to correlate?"

  **Anticipated Move:** She'll say intelligence is multidimensional, so curves don't have to correlate perfectly, though they might in practice.
  **Follow-up:** "If they don't have to correlate, can I have a system that is 'super intelligent' in one degradation regime and 'idiot savant' in another? If so, does the phrase 'general intelligence' still mean anything on your view, or is it just a shorthand for 'a bundle of specific robustnesses'?"

  ### 7. The Chinese Room Variation
  **Question:** "Here's a classic worry updated for your view. Imagine a lookup table system that maps every possible degraded input to the correct output. It degrades perfectly gracefully because it has a pre-computed answer for every loss of support. It doesn't understand anything; it's just a giant table. By your lights, is that system intelligent? Because its performance doesn't fall off."

  **Anticipated Move:** She'll argue that a lookup table isn't a valid system because it can't exist physically (too large) or doesn't count as computation.
  **Follow-up:** "But what if we compress the table? If I have a system that mimics graceful degradation through brute-force caching rather than reasoning, does it pass your test? If yes, then your test measures robustness, not intelligence. If no, what mechanism is required to make the degradation count?"

  ### 8. The Audit & Goodhart's Law
  **Question:** "Let's get practical. If we start using 'crutch curve audits' to rank AI systems, labs will inevitably tune their systems to pass the specific degradations the audit tests. It's Goodhart's Law: when a measure becomes a target, it ceases to be a good measure. How do you run a degradation audit without every lab just overfitting their model to the specific crutches you happen to remove?"

  **Anticipated Move:** She'll suggest using random, undisclosed degradations or a wide variety of them.
  **Follow-up:** "But someone still has to write the code for those degradations. If the auditors decide that 'removing GPU access' is a key test, models will be built to run on CPUs. Aren't we just shifting the optimization target from 'peak score' to 'peak robustness on known tests'? How do you test for robustness to *unknown* support removal?"

  ### 9. Intelligence Explosions
  **Question:** "People talk about intelligence explosions—systems improving themselves recursively. But if intelligence is resistance to losing supports, self-improvement looks different. Is an explosion a system getting better at the task, or is it a system getting better at *building its own crutches*? If a system adds more external memory to keep its performance up, does your view count that as getting smarter, or just getting more supported?"

  **Anticipated Move:** She'll say getting smarter is reducing the need for supports, not adding more.
  **Follow-up:** "But humans do the opposite—we build more tools to solve harder problems. If your view says true intelligence is needing *fewer* tools, doesn't that penalize the kind of technological progress we actually care about? Is the 'smartest' system on your account a monk in a cave with no tools?"

  ### 10. Falsification
  **Question:** "I want to end on what could kill the view. Science needs falsifiable claims. What empirical result would make you abandon the Crutch Curve account? I'm looking for a concrete case—like, do you need to see a system with a completely flat degradation profile that we'd still refuse to call intelligent? Or one that falls apart fast but relearns a new regime faster than any person?"

  **Anticipated Move:** She'll say a system that degrades gracefully but acts randomly or harmfully would disprove it.
  **Follow-up:** "But if it acts randomly, its performance score drops, so the curve isn't flat. I'm asking: is there a shape of the curve that looks like 'high intelligence' by your math, but where we'd all agree, 'No, that thing is dumb'? If there isn't such a case, isn't the theory immune to evidence?"
