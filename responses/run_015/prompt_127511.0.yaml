prompt: |-
  Act like a philospher who actually knows African philosophy and also microbiome science. Before you answer, do some quick brainstorming on scratch paper — literally outline the mapping first, then build from there. I'm a biologist steeped in holobiont theory: organisms are metabolic networks shared between host genomes and microbial symbionts, boundaries are porous, and recognition is mostly chemical signaling and immune tolerence.

  I want you to restate Ubuntu's relational conception of personhood — reciprocal recognition between people, the ancestors as continuing members of the moral community, and the rejection of the bounded autonomous self — entirely in that holobiont vocabulary. Map reciprocal recognition onto symbiotic cross-talk or immune signaling. Map the ancestors onto persistent viral integration or horizontal gene transfer that outlives the individual host. Map the bounded self onto dysbiosis or immune rejection of symbionts. Be precise and honest: don't smuggle moral language in and call it biology.

  Then give me the residue report. What survives intact? What gets distorted — for instance, does the moral weight of recognizing another person survive if recognition is just chemical? What falls out entirely — maybe the normative demand that you become fully human through others, or the specific ontology of the living-dead? And is the residue a failure of biological vocabulary, or does it show that Ubuntu's relationality was never just describing interdependence?

  Keep it casual, don't cite anyone specifically — paraphrase if you mention thinkers — and don't give me a reading list. I mostly want to know whether my hunch that Ubuntu is basically holobiont ethics writ large holds up, or if I'm missing something huge.
