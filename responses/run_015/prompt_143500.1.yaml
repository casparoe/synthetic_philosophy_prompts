      *   Let's call it the **"Integrated Sentience and Status Principle" (ISSP)**.
      *   *Clause 1 (The Welfare Constraint):* It is pro tanto wrong to inflict suffering on any entity capable of subjective experience (phenomenal consciousness). (Covers 1, 2, 5, 3).
      *   *Clause 2 (The Subjectivity Threshold):* Mere nociception without integration is insufficient for Clause 1. (Covers 3).
      *   *Clause 3 (The Status Constraint):* Entities belonging to kinds that are typically subjects of a life (or are members of our moral community) possess a right against instrumentalization, even if currently non-sentient. (Covers 7).
