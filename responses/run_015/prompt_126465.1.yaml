answer: |-
  This is a high-wire act. You are asking skeptical experts to walk into a mathematical trap without feeling patronized. The key is to make the *system* the antagonist, not you. You are not teaching them fairness; you are handing them a broken machine and asking them to fix it. When they break it further, the math speaks for itself.

  Here is the complete design for **"The Triage Committee."**

  ### 1. Materials List (Carry-On Friendly)
  *   **Projector:** For timer, rules, and final debrief slides only. No formulas.
  *   **Printed Packets (16 copies):**
      *   *Role Card:* "You are a Committee Member."
      *   *Round 1 Data Sheet:* Aggregate tables for North & South (Identical for all teams).
      *   *Round 2 Data Sheet:* Same data, but permission to split thresholds.
      *   *Round 3 Data Sheet:* "Year 2 Audit" (Corrupted data).
      *   *Decision Slip:* A tear-off card to submit their cutoffs.
  *   **Facilitator Packet (For You):** The Hidden Truth (Master Keys), Scoring Sheet.
  *   **Pens:** 16.
  *   **Flipchart & Markers:** For tracking team scores and "Parking Lot" ideas.
  *   **Timer:** Visible countdown.

  ### 2. The Hidden Data (Facilitator Eyes Only)
  *Do not print this for the participants. This is your master key.*

  **The Scenario:** A hospital system has a "Risk Score" (1–4) predicting adverse health events. You allocate "Intensive Care" (IC).
  **The Constraint:** IC is scarce. Every slot costs **$2k**. Every prevented event saves **$10k**.
  **The Goal:** Maximize Net Savings (Utility).
  **The Groups:** "North Hospital" (100 patients) and "South Clinic" (100 patients).
  **The Truth:** The Risk Score is perfectly *calibrated* (Score 3 = 60% risk in both groups). But Base Rates differ.

  **North Hospital (Lower Base Rate: 30%)**
  | Score | Count | Risk | Actual Events | If Ignored (FN) | If Flagged (Cost) |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | 1 | 40 | 10% | 4 | 4 | $80k |
  | 2 | 40 | 30% | 12 | 12 | $80k |
  | 3 | 15 | 60% | 9 | 9 | $30k |
  | 4 | 5 | 90% | 5 | 5 | $10k |
  | **Total** | **100** | | **30** | | |

  **South Clinic (Higher Base Rate: 58%)**
  | Score | Count | Risk | Actual Events | If Ignored (FN) | If Flagged (Cost) |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | 1 | 10 | 10% | 1 | 1 | $20k |
  | 2 | 20 | 30% | 6 | 6 | $40k |
  | 3 | 40 | 60% | 24 | 24 | $80k |
  | 4 | 30 | 90% | 27 | 27 | $60k |
  | **Total** | **100** | | **58** | | |

  **The Math Trap:**
  *   **Round 1 (Single Threshold):** If they pick Cutoff 3 (Intervene on 3 & 4):
      *   North FPR (False Positive Rate): 6 FP / 70 Negatives = **8.5%**
      *   South FPR: 19 FP / 42 Negatives = **45.2%**
      *   *Result:* Massive disparity in false alarms.
  *   **Round 2 (Split Thresholds):** To match North's FPR (~8.5%), South must raise cutoff to 4. To match South's FPR, North must lower cutoff to 2.
      *   If they equalize error rates (e.g., North Cutoff 2, South Cutoff 3):
      *   *Result:* A patient with Score 2 in North gets care. A patient with Score 2 in South does not. **Individual Fairness violated.**
  *   **Round 3 (Feedback Loop):** Intervention works 100%.
      *   Flagged patients in Year 2 data show 0 Events.
      *   Unflagged patients show "Unknown."
      *   *Result:* They cannot calculate next year's base rate.

  ### 3. Minute-by-Minute Timeline (90 Minutes)

  **00:00 – 00:10: Setup & Stakes**
  *   **Hook:** "You are the allocation committee. You have a risk model. It is mathematically perfect. It is morally broken. Fix it."
  *   **Rules:** 4 teams of 4. Maximize Net Savings ($10k saved per event - $2k cost per intervention).
  *   **Constraint:** You must pick *one* risk score cutoff (1, 2, 3, or 4) for Round 1. Everyone above gets care.
  *   **Deliverable:** Submit Decision Slip.

  **00:10 – 00:30: Round 1 (The Uniform Rule)**
  *   Teams calculate utility for cutoffs 1–4.
  *   They will likely pick Cutoff 3 or 4 (maximizes utility).
  *   **The Reveal:** You project the "Audit." Show them the False Positive Rates for North vs. South based on their choice.
  *   **Prompt:** "One group is being flagged unnecessarily 5x more than the other. Is this acceptable?"

  **00:30 – 00:50: Round 2 (The Escape Hatch)**
  *   **New Rule:** You may set *different* cutoffs for North and South.
  *   **Goal:** Match the False Positive Rates (make the error burden equal).
  *   **The Trap:** To do this, North must lower threshold (spend more), South must raise it (spend less).
  *   **The Reveal:** Ask teams: "What happens to a patient with Score 2 in North vs. Score 2 in South?"
  *   **Prompt:** "Same risk score. Different fate. Because of their group label. Did you just fix fairness or break it?"

  **00:50 – 01:05: Round 3 (The Blind Spot)**
  *   **Scenario:** "It is Year 2. You implemented your Round 2 plan. The intervention works perfectly."
  *   **Handout:** Year 2 Data Packet.
  *   **The Catch:** You only observe outcomes for patients you flagged. Since the intervention worked, **all flagged patients show 'No Event'.** Unflagged patients are marked 'Unknown'.
  *   **Task:** Estimate the base rate for Year 3.
  *   **Result:** They can't. The data is corrupted by their own success.

  **01:05 – 01:30: Debrief (The Mapping)**
  *   Map game moments to concepts (see Section 6).
  *   Address the "Blandness" of the groups.
  *   Final Q&A.

  ### 4. Payoff Scheme (No Money)
  **"Journalistic Capital"**
  *   Start each team with 100 Points.
  *   **Utility Score:** Net Savings from Round 1 & 2 converted to points (e.g., $100k = 10 pts).
  *   **Fairness Penalty:** If FPR disparity > 20% in Round 1, subtract 20 pts.
  *   **Consistency Penalty:** If they violate Individual Fairness in Round 2 without acknowledging it, subtract 20 pts.
  *   **Winner:** Team with most points gets "First Pick of Press Release Embargoes" (bragging rights).

  ### 5. Troubleshooting: What Will Go Wrong
  **1. The Algebraist**
  *   *Behavior:* One reporter instantly calculates the optimal split and shouts it out.
  *   *Fix:* The "Consensus Rule." Tell them at the start: "A decision is only valid if all 4 members sign the slip. If you shout, you invalidate your team's data." This forces discussion.

  **2. The Opt-Out**
  *   *Behavior:* "We refuse to use the score. We'll pick randomly."
  *   *Fix:* Scarcity. "There are only 50 slots. Random selection leaves high-risk patients to die. Your editors will ask why you didn't use the tool." Force them to engage with the tool.

  **3. The New Criterion**
  *   *Behavior:* "We propose a new fairness metric (e.g., demographic parity)."
  *   *Fix:* The "Parking Lot." Write it on the flipchart. "That's a valid policy choice, but for this simulation, the Board has mandated Error Rate Parity. Stick to the brief." Validate them, then constrain them.

  **4. The "Real World" Objection**
  *   *Behavior:* "These numbers are made up. In reality, we'd retrain the model."
  *   *Fix:* Acknowledge it. "In Round 3, you try to retrain. See what happens to your data." Let the game prove the data corruption point.

  ### 6. The Debrief Script (5 Minutes Max)
  *Do not put formulas on the screen. Point to the flipchart where you tracked their scores.*

  **Minute 1: The Trilemma**
  "In Round 1, you had Calibration (the scores meant the same thing). But you got Unequal Error Rates. In Round 2, you fixed the Error Rates. But you broke Individual Fairness (same score, different treatment). You just proved the Impossibility Theorem. You cannot have Calibration, Error Parity, and Base Rate Differences all at once. One must break. In your newsroom, which one breaks?"

  **Minute 2: The Escape Hatch Cost**
  "When you used different thresholds, you used the group label explicitly. That is legally and ethically fraught. But keeping the same threshold *also* used the group label, implicitly, by accepting unequal harm. There is no neutral setting. There is only a choice of which bias to encode."

  **Minute 3: The Feedback Loop**
  "Round 3 showed you the 'Selective Labels' problem. If your intervention works, your data tells you the risk was zero. If you deny care, you never learn if they were high risk. Your algorithm gets smarter at finding people you already help, and dumber at finding people you ignore. This is how bias compounds over years."

  **Minute 4: The Blandness**
  "I called them North and South. I didn't say Race or Income. But Base Rate Differences don't appear out of nowhere. They come from history, environment, access. By making the groups bland, I made the math cleaner. But in your stories, the 'Base Rate' is the story. The math tells you *that* there is a trade-off. The reporting tells you *why*."

  **Minute 5: The Takeaway**
  "When you write the next story about a biased algorithm, don't ask 'Is this fair?' Ask: 'Which fairness definition did they sacrifice, and who paid the price?' And ask: 'What data are they blind to because of their own past decisions?' That is the story."

  ### 7. Honest Limitations (What This Game Can't Do)
  *You must say this out loud during the debrief.*

  1.  **Necessity vs. Artifact:** "This game shows the trilemma is real *given these numbers*. It doesn't prove it's a law of physics. Sometimes you can fix base rates by fixing society. The math says 'you can't have it all.' The journalism says 'why do we have these base rates?'"
  2.  **Causality:** "The game treats the Risk Score as a given. In reality, the score itself might be the cause of the disparity (e.g., using healthcare costs as a proxy for health). This game assumes the score is accurate but the groups differ. Often, the score is the problem."
  3.  **The Human Element:** "This game reduces harm to 'points.' In your stories, a False Negative isn't a minus-10; it's a death, a foreclosure, a prison sentence. The math quantifies the trade-off; your job is to humanize the cost."

  ### 8. Printable Packet Content (Draft for Copy/Paste)

  **(Front Page)**
  **TRIAGE COMMITTEE: ROUND 1**
  **Mission:** Maximize Net Savings.
  **Rule:** Select **ONE** cutoff score (1, 2, 3, or 4) for BOTH North and South.
