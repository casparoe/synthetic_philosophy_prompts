prompt: |-
  You are a professional philosopher with research-level expertise in philosophical logic and formal epistemology, in particular the semantics and epistemology of conditionals. Please think carefully and at length before answering. It would help me if you began with a short, unsorted brainstorm: list, before you commit to an ordered answer, every point in the passage below where you think a specialist would object or reach for a qualification, including the ones you think are minor. Then work through them in the order they appear, and flag explicitly where the literature is genuinely unsettled rather than presenting one resolution as received doctrine. I do not need citations or a reading list — I can find those myself. What I need from you is the conceptual audit.

  The situation: I am a graduate student in cognitive science, writing a paper on how people actually reason with conditional sentences, and I need a short, accurate background section on the indicative/counterfactual distinction. I read the following in a well-reviewed popular book on rationality, in its chapter on conditionals. The intended audience is general readers, the tone is confident, and nothing in it struck me as obviously crazy — which is exactly why I don't trust my own judgment about it.

  The passage (my paraphrase of a couple of pages, but I've tried to keep its claims intact):

  -----
  There are two kinds of conditional, and they are governed by completely different theories. Take indicatives first: If the train was on time, she is home by now. An indicative conditional has no truth conditions at all. What Adams showed — and what Lewis's triviality result later established beyond dispute — is that the only thing to say about an indicative conditional is how confident you should be in the consequent given the antecedent, that is, the conditional probability P(B|A). It follows that indicatives are not the sort of thing that can be true or false, and that is why they cannot be embedded inside other operators without changing meaning: you cannot prefix one with probably, negate one, or put one inside a quantifier and expect the result to mean what it looks like it means. Possible-worlds semantics simply does not apply to them. Counterfactuals are different in kind: If the train had been on time, she would have been home by now. Here the antecedent is by definition false, so there is no probability of the antecedent to conditionalize on and the whole probabilistic apparatus drops out. Instead, counterfactuals are evaluated by similarity between possible worlds: a counterfactual is true just in case the consequent holds in all the worlds closest to the actual world at which the antecedent holds. Lewis's account is the standard one. Because the similarity ordering is fixed by the facts about which worlds resemble which, adding further detail to the antecedent can never overturn a true counterfactual — the closest antecedent-worlds are the closest antecedent-worlds, and if the consequent holds throughout them, it holds. The context-sensitivity that people notice in counterfactuals is just context settling which respects of similarity we are scoring. So the difference between the two kinds reduces to this: the antecedent of an indicative is epistemically open for the speaker, while the antecedent of a counterfactual is settled false. Same connective, different information. Finally, the well-known poker-game standoff cases, in which a speaker can be in a position to assert both if A, B and if A, not-B, refute outright the idea that indicatives have truth conditions; there is nothing for a possible-worlds or truth-conditional theory to say here.
  -----

  The book then draws a conclusion I would like to use. It says that, on this picture, there is no such thing as the probability that a counterfactual is true, and therefore retrospective claims of the form if we had not done X, Y probably would not have happened — the sort that fill accident reports, policy reviews, and epidemiological papers — are not assessable claims at all, only rhetoric dressed up as reasoning.

  Here is what I want from you:

  1. Go through the passage claim by claim and sort it into three piles: what a specialist would accept without much qualification; what is a fair simplification for a general audience; and what is misleading or wrong. Be precise about the technical conflations rather than just gesturing at them. I have a suspicion that something goes wrong in the move from Adams's thesis to the claim that indicatives have no truth conditions, and something else goes wrong in the treatment of the closest-worlds machinery, but I cannot tell how serious either is.

  2. Specifically: is it right that the two kinds are governed by completely different theories? Is the epistemically open versus settled false gloss of the contrast defensible? Please test it against two things. First, cases where the antecedent is not settled either way but the conditional is in the counterfactual mood — a detective who does not know whether the suspect was at the bar and says if he had been at the bar at ten, the camera would have caught him. Second, pairs like if the match had been struck, it would have lit / if the match had been struck after soaking in water all night, it would not have lit. Does the machinery the book describes have the resources to handle these, and does its claim about adding detail to the antecedent survive them?

  3. Does the book's conclusion about the probability of a counterfactual follow from the parts of its summary that are accurate? A friend who works on causal models told me that probabilities for counterfactuals are standard fare in her field — something about interventions in a structural model, and an operation called imaging on a closest-world selection function, which she said is not the same thing as conditionalizing on the antecedent. Is she describing something real, is it compatible with anything true in the passage, and does it give the lie to the book's conclusion?

  4. On my prior, which I would like you to challenge if it is wrong: I had been told that Lewis and Stalnaker each offered a single possible-worlds semantics intended to cover indicatives and counterfactuals alike, which seems to contradict the different in kind framing; but I also gather that the Adams-style probabilistic program is live research, so perhaps the book is simply reporting where the field ended up after the unified program collapsed. Tell me which of these pictures is closer to the truth, and whether the book's contrast between the two kinds is a report of that history or a distortion of it.

  Finally, and most practically: tell me what I would have to cut or rewrite to turn this passage into something I could safely paraphrase in my background section, and what I should not lean on it for under any circumstances.
