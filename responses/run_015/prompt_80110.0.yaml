prompt: |-
  I'm a second year PhD student in history and I've been stuck on this for like three weeks now, so I need help turning a half baked idea into an actual proposal. Quick context: I'm drafting my dissertation proposal and my advisor keeps pushing back on whether the longue durée — Braudel's deep, slow structures, the geography, the climate, the long economic background — is actually doing any explanatory work, or whether it's just describing the stage that events and people perform on. I've been arguing, and I think I'm right, that the whole debate is muddled because both sides use 'explain' in two different senses without noticing. One side wants a causal explanation (why did X happen, what pushed it in that direction), the other wants an enabling explanation (why was X possible or likely in the first place, what shaped the space of options). My hunch: if you actually seperate those two jobs, the longue durée turns out to be really good at the enabling job and pretty bad at the causal one, because background structures make things possible without selecting among the possibilities that are then open. And a lot of the 'Braudel is just deterministic and ahistorical' criticism is people complaining he's not doing the causal job, which I don't think he ever claimed to do.

  Can you turn this into a two page research proposal for a dissertation chapter? I want a precise statement of the question so it has a determinate answer; why the existing positions — the 'longue durée is genuinely explanatory' side and the 'it's just background description' side — leave the question open; the method, i.e. what I'd actually do step by step (no bibliography please, I'll add the citations myself); what a useful result would look like and what would count as the project failing; and an honest read on what could make this too big for a single chapter. Don't pad it and don't invent sources.

  After the proposal, give me a short JSON object with exactly these fields: 'question' (the determinate question in one sentence), 'why_open' (one or two sentences on why the existing positions don't settle it), 'approach' (the method as a list of steps), 'deliverable' (what a good result looks like), 'failure' (what would count as the project failing), and 'scope_risk' (the single biggest thing that could blow up the scope). Keep every field tight.
