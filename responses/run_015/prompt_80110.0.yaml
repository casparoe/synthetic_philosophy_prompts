answer: |-
  **Chapter Proposal: Distinguishing Causal and Enabling Explanation in Longue Durée History**

  **Research Question**
  Does the *longue durée* function primarily as an enabling condition rather than a causal mechanism in historical explanation?

  **Intervention and Existing Debate**
  Current historiographical debates regarding the *longue durée* are stalled because opposing sides operate with incompatible definitions of "explanation." Proponents argue that deep structures (geography, climate, economic cycles) are genuinely explanatory, while critics argue these are merely descriptive backgrounds upon which real history (events, agency) occurs. This disagreement remains unresolved because neither side distinguishes between *causal explanation* (identifying the specific trigger that selected outcome X over outcome Y) and *enabling explanation* (identifying the structural conditions that made outcome X possible or likely while ruling out Z). Critics dismiss the *longue durée* because it fails to provide causal selection; proponents defend it by claiming explanatory power without specifying that this power is enabling rather than causal. Consequently, the debate talks past itself, leaving the actual explanatory status of deep structures indeterminate.

  **Methodology**
  This chapter will resolve the muddle through a structured conceptual analysis and textual audit. The process will proceed in four steps:

  1.  **Conceptual Definition:** Establish working definitions for "causal explanation" (counterfactual dependence, selection among alternatives) and "enabling explanation" (constraint of the possibility space, probability shaping) based on current philosophy of history literature.
  2.  **Textual Audit:** Select key passages from Braudel's foundational texts and major critiques where the explanatory claim is strongest. Code each argument to identify whether it claims causal selection or structural enabling.
  3.  **Mismatch Analysis:** Demonstrate that critiques successfully refute causal claims but fail to refute enabling claims, while proponents often defend enabling claims using the language of causation.
  4.  **Framework Validation:** Test the proposed distinction against a specific case study from the dissertation's broader empirical chapters to ensure the typology functions in practice, not just in theory.

  **Deliverable and Success Conditions**
  A successful chapter will produce a validated typology that separates causal and enabling explanations. The useful result is a methodological framework that allows the dissertation to employ *longue durée* analysis without committing to determinism. Specifically, the chapter must demonstrate that acknowledging the *longue durée* as an enabling condition preserves historical contingency (agency events still select the outcome) while granting deep structures analytical weight (they shape the menu of options). This resolves the advisor's concern by conceding that *longue durée* does not do causal work while proving it still does necessary explanatory work.

  **Failure Conditions**
  The project fails if the distinction between causal and enabling explanation collapses under textual scrutiny. For example, if close reading reveals that Braudel explicitly claims causal selection rather than enabling conditions, the defense collapses into determinism. Alternatively, if the "enabling" category proves so broad that it encompasses all background context without analytical limit, the distinction becomes useless. Finally, if the framework cannot be applied to the empirical cases in the rest of the dissertation without becoming overly abstract, the chapter will not serve its purpose as methodological groundwork.

  **Scope Risks**
  The single biggest risk to scope is philosophical drift. There is a temptation to solve the philosophy of causation generally rather than solving the specific historiographical problem at hand. If the chapter attempts to define causation from first principles rather than analyzing how historians actually use the term in this specific debate, it will expand beyond a single chapter into a separate theoretical dissertation. The focus must remain strictly on the utility of the distinction for historical practice, not metaphysical truth.

