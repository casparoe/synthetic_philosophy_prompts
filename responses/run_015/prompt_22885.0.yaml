      *   **Indexicality of "Actual":** "Actual" is indexical (like "here" or "now"). It refers to the world the speaker is in. For me, *this* world is actual. For my counterpart in another world, *that* world is actual.
      *   **Counterpart Theory:** This is the crucial piece. Lewis *rejects* transworld identity. I am not *literally* in another world. There is a *counterpart* of me in another world who resembles me closely enough to count as "me" for the sake of evaluating modal claims.
