answer: |-
  Your discomfort is entirely justified. In fact, your intuition has spotted the exact place where your friend's argument collapses. While your friend is correct that David Lewis believes possible worlds are concrete and real, he is **misapplying Lewis's theory of personal identity.**

  If Lewis were sitting at that dinner table, he would agree with you, not your friend.

  Here is the breakdown of why your friend's "comforting" argument fails under Lewis's own system, and why your "mass murderer" counter-example is philosophically spot-on.

  ### 1. The Fatal Flaw: Counterpart Theory vs. Transworld Identity
  The core of your friend's argument relies on **transworld identity**. He is assuming that *you*—the very same person, the same numerical identity—exist in multiple worlds. He thinks there is one "You" that stretches across reality, wearing a suit in one world and rags in another.

  Lewis explicitly rejects this. He argues for **Counterpart Theory**.

  According to Lewis, you are a concrete object located entirely within this specific spacetime manifold. You are not "spread out" across worlds. You are only *here*.
  *   In another possible world, there exists a person who looks like you, has your memories, and shares your history up to a certain point.
  *   Lewis calls this person your **counterpart**.
  *   Crucially, **you are not your counterpart.** They are a distinct individual. They are numerically different from you, just as your identical twin would be distinct from you in this world.

  So, when your friend says, "You are a billionaire in another world," the Lewisian correction is: "A *counterpart* of you is a billionaire in another world."

  This distinction matters immensely. If your identical twin won the lottery, you wouldn't say, "I am a millionaire." You would say, "My brother is a millionaire." You might be happy for him, but you still have to pay your own rent. Under Lewis's realism, your counterpart is even more distant than a twin; they are a separate concrete entity in a causally isolated universe.

  ### 2. The Indexicality of "Actual"
  Lewis argues that the word "actual" is **indexical**. It works like the words "here" and "now."
  *   When you say "this world is actual," you just mean "this world is the one I am in."
  *   When your billionaire counterpart says "this world is actual," he means *his* world.

  From your counterpart's perspective, *he* is the real one, and *you* are the merely possible being who failed to become a CEO. There is no "God's eye view" where both of you are equally "you." There is only your perspective (where you are not rich) and his perspective (where he is).

  Therefore, the statement "I already am a billionaire" is false from your indexical standpoint. You are the person *here*, and *here* you are not a billionaire.

  ### 3. Causal Isolation
  Lewis emphasizes that possible worlds are **causally isolated**. There is no travel, communication, or transfer of resources between them.
  *   Even if we grant (contrary to Lewis) that you are somehow "connected" to that billionaire, it doesn't help you.
  *   Wealth is a relational property involving access to resources. Since you cannot access the resources in the other world, you do not possess the wealth.

  Telling you that you are a billionaire in another world is like telling a starving person that they are well-fed in a dream. The concrete reality of your hunger remains.

  ### 4. Your "Mass Murderer" Objection is the *Reductio Ad Absurdum*
  You hit the nail on the head with the mass murderer example. This is a classic philosophical move called *reductio ad absurdum* (reducing an argument to absurdity).

  If your friend's logic holds—that properties of counterparts are properties of you—then moral responsibility dissolves.
  *   **Friend's Logic:** "You are a billionaire because a counterpart is."
  *   **Your Counter:** "You are a murderer because a counterpart is."

  Lewis wants to preserve moral responsibility. He would say: "You are not a murderer. You *could have been* a murderer (which means there is a counterpart who is), but you *are not* one."

  The modal operator ("could have been") is doing all the work. Your friend is trying to delete the "could have been" and leave only "are." That is a logical error. It confuses **modal properties** (what is possible for you) with **intrinsic properties** (what you actually are).

  ### 5. Why the Confusion Happens
  Your friend is likely conflating Lewis's **Modal Realism** with **Pop-Culture Multiverse Theory**.
  *   **Marvel/Sci-Fi Multiverse:** Often depicts a single consciousness or "soul" branching out. You are literally the same entity experiencing different lives.
  *   **Lewis's Modal Realism:** Depicts duplicate concrete universes. You are a unique concrete entity. The other guy is a duplicate, not you.

  ### Conclusion
  Your friend's argument breaks down at the point of **identity**. He is treating "you" as an abstract pattern that can be instantiated in multiple places, whereas Lewis treats "you" as a concrete object that can only be in one place.

  You are not a sore loser; you are a good modal realist.
  *   **Is it true that there is a world where a counterpart of you is rich?** Yes (according to Lewis).
  *   **Does that mean *you* are rich?** No.
  *   **Does that mean you should feel less envy?** Probably not, because your concrete needs exist in this concrete world, not the other one.

  You can tell your friend that while he was trying to offer metaphysical comfort, he accidentally committed a fallacy of equivocation regarding personal identity. And if he pushes back, remind him that by his own logic, he is currently a mass murderer in a very real sense. That usually ends the argument.
