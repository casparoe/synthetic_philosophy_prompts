  ### Instrument Limitations

  **Inseparable Leaves:**
  **Leaf 3 (Cryptolibertarian)** and **Leaf 5 (Privacy Absolutist)** cannot be fully separated by this tree. Both accept Unconditional Rights and Individual Priority.
  *   **Extra Question Needed:** "Is the use of encryption that renders data permanently unreadable to the state (even with a warrant) permissible?" (Leaf 3 says Yes; Leaf 5 might say No if it impedes justice).

