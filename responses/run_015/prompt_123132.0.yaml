answer: |-
  # The Pedagogical Ethics Protocol (PEP)
  **For:** Curriculum & Ethics Review Panel  
  **Time Limit:** 60 Minutes  
  **Goal:** Distinguish between *Pedagogical Misappropriation* (Ethical Breach) and *Professional Application* (Educational Success).

  ## I. Philosophical Grounding
  This procedure rests on three pillars derived from IP philosophy and academic ethics:
  1.  **The Idea/Expression Dichotomy:** You cannot own a method, heuristic, or idea (Locke/Mill). You can only own the specific *expression* of that idea (fixed form, specific artwork, written text).
  2.  **Implied License of Education:** When a professor teaches a student in an accredited context, there is an implied license for the student to *use* the knowledge for professional practice, unless explicitly revoked *before* transmission.
  3.  **The "Tool vs. Product" Distinction:** Education provides tools. The student owns the house they build with them. The professor owns the blueprint of the hammer, not the house.

  ## II. The Decision Procedure (Run in Order)
  *Do not proceed to the next step if a "STOP" condition is met.*

  ### Step 1: The Confidentiality Check (Contract & Expectation)
  **Question:** Was there an explicit agreement (signed NDA, workshop waiver, or clear oral warning *before* teaching) that this material was confidential or "for personal study only"?
  *   **Yes:** Escalate to Legal/Admin. This is a contract breach, not an ethics debate. **STOP.**
  *   **No:** Proceed to Step 2. (Note: In standard degree programs, the default assumption is *professional application*, not confidentiality).

  ### Step 2: The Object of Sale (Expression vs. Method)
  **Question:** What exactly is the student selling or licensing?
  *   **A. The Teaching Material Itself:** (e.g., Scanned notes, recordings of the lecture, the syllabus).
      *   **Verdict:** **Professor Wins.** This is copyright infringement of expression. **STOP.**
  *   **B. The Method as a Service:** (e.g., "I will teach you this method" or "I use this proprietary method" as the main sales pitch).
      *   **Verdict:** **Values Call.** Proceed to Step 4.
  *   **C. A Product Made Using the Method:** (e.g., Ceramics, designs, code, branding deliverables).
      *   **Verdict:** **Student Wins (Presumptive).** Proceed to Step 3 to confirm.

  ### Step 3: The Transformation Test (Labor & Value)
  **Question:** Did the student contribute significant independent labor, materials, or creative decision-making to the final product, or is it a mechanical reproduction of the professor's demo?
  *   **Mechanical Reproduction:** (e.g., Student followed a paint-by-numbers demo and sold the exact resulting image).
      *   **Verdict:** **Values Call.** (See Limitations below).
  *   **Independent Labor:** (e.g., Student used the glaze technique on their own forms, or the heuristic on new client data).
      *   **Verdict:** **Student Wins.** This is the intended outcome of education. **STOP.**

  ### Step 4: The Market Harm Test (Direct Competition)
  *(Only run if Step 2 resulted in "Values Call")*
  **Question:** Is the student directly cannibalizing the professor's specific revenue stream (e.g., selling a competing workshop) or merely competing in the general market?
  *   **Competing Workshop/Course:** **Professor Wins.** (Ethical breach of pedagogical authority).
  *   **General Market Competition:** **Student Wins.** (Professors cannot claim monopoly on market sectors entered by students).

  ---

  ## III. Escalation & Misfire Flags
  **When to Escalate to Legal Counsel:**
  *   Any "Yes" in Step 1 (Contractual NDAs).
  *   Any "A" in Step 2 (Copyrighted materials sold).
  *   Any case involving registered Trademarks or Patents (rare in design, but possible).

  **Where This Procedure Misfires (The "Style" Trap):**
  The PEP assumes ideas can be separated from expression. It will **fail** when:
  *   **Technique = Style:** The method is so idiosyncratic (e.g., a specific brushstroke that *is* the professor's brand) that using the method inevitably creates work indistinguishable from the professor's.
  *   **The "One Medium" Problem:** The idea only works in one specific medium which the professor dominates.
  *   **Panel Action:** In these cases, do not rule. Issue a "Finding of Ethical Ambiguity." Recommend mediation. Acknowledge that the philosophy of property cannot resolve conflicts where identity is entangled with methodology.

  ---

  ## IV. Application to Scenarios

  ### Scenario 1: The Glaze-Line (Ceramics)
  *   **Facts:** Student uses professor's unpublished translucent glaze layering technique to produce a national ceramic line. Professor claims ownership of the "look."
  *   **PEP Run:**
      1.  **Confidentiality:** No signed NDA. Oral workshop. (Pass)
      2.  **Object of Sale:** Product made using method (Ceramics), not the notes or the workshop itself. (Pass to Step 3)
      3.  **Transformation:** Student formed the pots, fired them, managed the business. Independent labor confirmed.
  *   **Verdict:** **Student Wins.**
  *   **Rationale:** A technique is a tool. Once taught, the professor cannot control the artifacts created with it. To rule otherwise turns education into indentured servitude.
  *   **Why the Professor Will Hate It:** The professor views the glaze effect as their "signature." Seeing it mass-produced dilutes their brand scarcity.
  *   **Why Logic Demands It:** If we grant ownership of techniques, we halt cultural progress. No student could ever paint in oils without owing Rubens. The "look" is the inevitable result of the method, and the method was given as a gift of teaching.
  *   **Misfire Flag:** If the glaze technique creates a visual signature so unique that the public confuses the student's pots for the professor's, this is a "Style Trap." The panel should note this but still rule for the student on principle, suggesting the student add a disclaimer ("Studied under Prof. X") rather than cease production.

  ### Scenario 2: The Heuristic Agency (Branding)
  *   **Facts:** Student builds a branding agency where the core deliverable is the professor's unpublished negative-space checklist.
  *   **PEP Run:**
      1.  **Confidentiality:** No NDA. (Pass)
      2.  **Object of Sale:** Service using the method. (Gray Area -> Step 4)
      3.  **Market Harm:** Is the student selling a *course* on the heuristic? No. They are selling *branding services* that utilize it.
  *   **Verdict:** **Student Wins (with Ethical Caveat).**
  *   **Rationale:** A mental heuristic is an "idea," not "expression." You cannot copyright a checklist or a way of thinking. The student is selling their labor (branding), not the heuristic itself as a product.
  *   **Panel Note:** This is a **Values Call**. While the student is legally/philosophically in the clear, ethically, building an entire business identity *solely* on a teacher's unpublished IP without attribution borders on plagiarism of intellect.
  *   **Recommendation:** The panel should urge the student to attribute the methodology in their marketing ("Based on principles of...") as a condition of good standing, but cannot force them to close the agency.

  ### Scenario 3: The Masterclass PDF (Notes)
  *   **Facts:** Student scans handwritten notes and sells them as a PDF. Claims they are selling the "ideas," not the "notes."
  *   **PEP Run:**
      1.  **Confidentiality:** Irrelevant.
      2.  **Object of Sale:** The Teaching Material Itself (The Notes).
  *   **Verdict:** **STOP. Escalate to Legal/Admin.**
  *   **Rationale:** This is not a philosophy problem; it is a copyright violation. The *expression* of the ideas (the handwriting, the specific arrangement, the diagrams) is fixed property. The student is selling the container, not the contents.
  *   **Action:** Immediate Cease & Desist. This falls outside the Ethics Panel's purview and is a legal liability for the institute.

  ---

  ## V. Summary of Outcomes for the Panel

  | Scenario | Outcome | Basis | Panel Action |
  | :--- | :--- | :--- | :--- |
  | **1. Glaze Ceramics** | **Student** | Tool vs. Product | Sign off. Advise student on attribution to avoid confusion. |
  | **2. Heuristic Agency** | **Student** | Idea vs. Expression | Sign off. Strongly recommend ethical attribution in marketing. |
  | **3. PDF Notes** | **Professor** | Copyright Infringement | **Escalate.** Do not deliberate. Forward to Legal/Dean. |

  ## VI. Closing Instruction for the Chair
  When presenting the **Scenario 1** decision to the professor, use this script:
  *"We recognize this technique is your intellectual labor. However, the institute's mission is to launch professionals, not apprentices. If we restrict the use of techniques taught in our studios, we devalue the degree. The student owns the labor of the pots; you own the labor of the teaching. Both are compensated (you by salary/prestige, them by sales). We cannot conflate the two."*

  When presenting to the **Student**:
  *"You are within your rights to use the technique. However, design ethics relies on community. While you need not pay royalties, acknowledging the lineage of your method protects you from accusations of plagiarism and maintains your standing in the institute's network."*
