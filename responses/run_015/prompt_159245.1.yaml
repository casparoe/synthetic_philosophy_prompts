answer: |-
  This is a rich prompt that cuts to the heart of comparative political ethics. I will proceed by first establishing my epistemic stance, then mapping the Lockheed episode through your two specified lenses, and finally turning the analysis back onto the theories themselves to test their limits.

  ### Epistemic Preamble and Pushback

  **Confidence Level:** High on the philosophical distinctions; Moderate on the historical application.
  **Constraint Check:** I will adhere to your stipulated facts (Lockheed payments, Tanaka's conviction/support, 1977 US law). I will not dig for granular legal details.

  **Initial Pushback:**
  I must flag one potential confusion in the setup before beginning. You ask me to analyze the "philosophy of corruption," but your prompt *stipulates* the payments were "bribes." This linguistically loads the dice toward the **Price-in-the-Wrong-Sphere** view. To call something a "bribe" is already to assert that the sphere *should* be impartial. If I adopt the **Constitutive-Gift** view rigorously, I cannot start by calling it a bribe; I must call it a "contribution," "donation," or "gift" until the analysis determines its moral status.

  Furthermore, there is a risk that the **Constitutive-Gift** view becomes a "just-so story" (a rationalization) if it cannot account for the *secrecy*. Gift exchanges in clientelist systems are often semi-public; they affirm status. Bribery is inherently clandestine. If the theory cannot explain why the "gift" had to be hidden, it may be descriptively failing. I will keep this tension central.

  ---

  ### Part 1: Mapping the Episode

  #### Lens A: Price-in-the-Wrong-Sphere (The Impartialist View)

  **Core Logic:** Public office is a fiduciary role governed by impersonal rules. The market is a sphere governed by price. Corruption occurs when market logic (price) invades the political sphere (duty).

  **Mapping the Actors and Options:**
  *   **Lockheed:** Faced a choice between competing on merit/price (Impartial Sphere) or purchasing the decision (Market Sphere). They chose the latter.
  *   **Tanaka/Officials:** Faced a choice between acting as impartial arbiters of national interest or as vendors selling influence. They chose the latter.
  *   **The US Government:** Faced a choice between tolerating this as "foreign custom" or enforcing the boundary of the impartial sphere extraterritorially. They chose enforcement (FCPA).

  **What This View Explains:**
  1.  **The US Response (FCPA):** This is the strongest fit. The US reaction makes perfect sense here. The scandal revealed that American firms were undermining the integrity of the "public role" abroad, which reflected poorly on US moral standing and distorted fair competition. The 1977 law is a boundary-maintenance mechanism: *This sphere (procurement) is not for sale.*
  2.  **The Secrecy:** Secrecy is essential here. If the payment were legitimate, it wouldn't need hiding. The secrecy proves the actors *knew* they were violating the norm of impartiality.
  3.  **The "Foreign" Aggravation:** From this view, foreign involvement makes it worse, not better. It introduces a distortion where a foreign entity bends the public will of a sovereign nation for private gain.

  **What This View Misses or Misdescribes:**
  1.  **Tanaka's Enduring Support:** This is the Impartialist view's biggest blind spot. If Tanaka violated a universal duty of impartiality, why did his constituents not reject him as a traitor to the public good? The Impartialist view has to label his supporters as "irrational" or "complicit," failing to grasp that they might be operating under a different normative framework.
  2.  **The Intermediaries:** If this were a simple price-for-decision, why the complex web of intermediaries? The Impartialist view sees this as "laundering" to hide the crime. It misses the possibility that intermediaries serve a social function (buffering the relationship) rather than just a legal one.

  **Confidence:** High. This view aligns perfectly with the *legal* and *US institutional* reaction. It struggles with the *sociological* reality of Japanese politics at the time.

  #### Lens B: The Constitutive-Gift View (The Clientelist View)

  **Core Logic:** Politics is not a sphere of impartial rules but a web of reciprocal obligations. Resources flow from patrons to clients to sustain loyalty. A payment is not a "price" that ends a transaction, but a "gift" that opens or sustains a relationship.

  **Mapping the Actors and Options:**
  *   **Lockheed:** Not trying to "buy" a contract in a vacuum, but trying to enter a local network of obligation. They are acting as a corporate patron seeking a local partner.
  *   **Tanaka:** Not selling a discrete vote, but accepting resources to maintain his network of supporters (clients). The money ensures he remains powerful enough to deliver stability (which Lockheed wants).
  *   **The Intermediaries:** Essential here. In gift economies, direct exchange can be crude or taboo. Intermediaries ritualize the transfer, transforming "cash" into "support."

  **What This View Explains:**
  1.  **Tanaka's Enduring Support:** This is the view's strongest explanatory power. Tanaka was not seen as a thief, but as a successful patron. He brought resources (Lockheed money) into the network, which trickled down to constituents. Convicting him legally didn't break the social bond. He fulfilled his side of the reciprocal obligation.
  2.  **The Nature of the Payment:** It explains why the payments were large and recurring. A price is paid once for a good. A gift relationship requires maintenance. The payments were likely viewed as "political contributions" necessary to keep the machinery of the Liberal Democratic Party (LDP) running.
  3.  **The US Response as Cultural Imperialism:** This view frames the FCPA not as universal justice, but as the export of a specific Western (Protestant/Weberian) bureaucratic ethic. It imposes an alien "impartial sphere" onto a system that functions on "relational obligation."

  **What This View Misses or Misdescribes (The Critical Tension):**
  1.  **The Secrecy:** *This is the theory's breaking point.* In most anthropological accounts of gift economies (e.g., Mauss), gift-giving is public. It establishes status. The donor gains honor. Lockheed's payments were *secret*. If this were truly a constitutive gift, why hide it?
      *   *Defense:* One could argue the secrecy was to protect the *recipients* from external pressure, not because the gift itself was shameful.
      *   *Rebuttal:* Low confidence on this defense. The secrecy suggests the actors knew this violated *even local* emerging norms, not just Western ones. The fact that Tanaka was convicted *by a Japanese court* suggests the "Gift" defense had limits even within Japan.
  2.  **The Scale and Source:** A foreign corporation entering a domestic patronage network is different from a local business doing so. The Constitutive-Gift view struggles to explain why a *foreign* entity's gift is acceptable. Usually, patronage binds a specific community. Lockheed was an outsider. This looks less like "joining the network" and more like "hacking the network."

  **Confidence:** Moderate. This view explains the *political survival* of the actors but struggles to explain the *clandestine nature* of the transaction without resorting to ad-hoc adjustments.

  ---

  ### Part 2: Turning the Analysis Around (Meta-Evaluation)

  What does the Lockheed episode reveal about the two theories and the question of universalism?

  **1. Corruption as a "Family Resemblance" rather than a Natural Kind**
  The episode suggests that "corruption" is not a single natural kind (like "water" is H2O) but a cluster concept.
  *   From the **Impartialist** angle, the wrong is *betrayal of office*.
  *   From the **Clientelist** angle, the wrong (if there is one) might be *betrayal of the network* (e.g., taking the money and not delivering) or *exclusion of rivals*.
  *   **Finding:** The Lockheed case confirms that "corruption" names a family of things. The US saw a market intrusion; the Japanese supporters saw a resource flow. The conflict wasn't just about facts; it was about the *ontology of the political sphere*.

  **2. The Limits of the Constitutive-Gift Defense**
  Does the case show the Clientelist view is just a rationalization?
  *   **Verdict:** Partially. The fact that Tanaka was *convicted in Japan* is the smoking gun against a pure relativist defense. If the "Gift" view were the true local norm, the Japanese judiciary (as an institution) should not have been able to condemn him, or he should have been acquitted by a jury of his peers.
  *   **Nuance:** However, his *political* survival despite legal conviction shows the Clientelist norm was still socially dominant even if legally subordinate. This suggests a *transitioning* society. Japan in the 1970s was caught between a traditional clientelist order and an imported Weberian bureaucratic order. The Lockheed scandal was a friction point between these two orders.
  *   **Epistemic Note:** I am extrapolating here from the fact of conviction vs. support. This suggests the "Gift" view is descriptively accurate of the *social* reality but normatively insufficient to justify the *legal* reality, even locally.

  **3. Universalism vs. Exported Localism**
  Does the US response prove universalism?
  *   **Analysis:** No. The FCPA was a unilateral assertion of US jurisdiction. It did not emerge from an international treaty (at that time). It was the export of a local US judgment.
  *   **The "Price" View as Universalist:** The Impartialist view *claims* universalism (all public offices should be impartial).
  *   **The Reality:** The Lockheed case shows that this "universalism" is often enforced through power. The US didn't convince Japan that bribery was wrong through philosophical debate; they legislated it for US companies and pressured allies.
  *   **Conclusion:** The episode reveals that what we call "universal anti-corruption norms" are often the successful projection of the **Price-in-the-Wrong-Sphere** view by dominant economic powers. It doesn't prove the view is universally *true*, only that it is universally *enforced* by certain actors.

  **4. The Problem of Secrecy (Theoretical Stress Test)**
  I must be disciplined here: The **Constitutive-Gift** view cannot easily account for the secrecy without cheating.
  *   If the payment is a legitimate maintenance of a political order, why hide it?
  *   If the payment is a "price," hiding it makes sense (evading the rule).
  *   **Inference:** The secrecy strongly favors the **Price-in-the-Wrong-Sphere** view as the *actors' own working theory*. Even Tanaka likely knew, on some level, that this specific transfer (from a foreign defense contractor, in cash, via intermediaries) crossed a line that even a gift economy shouldn't cross. It suggests the "Gift" defense is often a post-hoc justification for behavior the actors knew was transgressive.

  ### Final Synthesis

  The Lockheed scandal is not a clean test case where two valid moral systems clash equally. It is a case where a **transitional society** (Japan moving toward bureaucratic impartiality) collided with a **regulatory power** (US enforcing market impartiality).

  *   **The Price-in-the-Wrong-Sphere view** correctly identifies the *legal* and *structural* wrong: the subversion of procurement criteria. It explains the US reaction and the eventual legal outcome.
  *   **The Constitutive-Gift view** correctly identifies the *sociological* reality: why the punishment didn't stick politically and how the money functioned within the LDP.
  *   **The Universalism Question:** The case suggests that "corruption" is not a universal intuition. The intuition that "public office should not be sold" is specific to the Impartialist sphere. Where that sphere is not fully established (or is competing with clientelist norms), the "corruption" label is an external imposition.

  **Confidence in Conclusion:** High. The divergence between Tanaka's legal guilt and political popularity is the key data point. It proves that the "Impartialist" norm was not hegemonic in Japan at the time, validating the claim that anti-bribery instincts are not universal but depend on the prior acceptance of the "Impartial Public Sphere" as the dominant social architecture.

  **One Final Caveat:** By stipulating the payments were "bribes," your prompt may have obscured the possibility that *some* of these payments were legally distinct political contributions under Japanese law at the time, which were only retroactively tainted by the US investigation. If so, the "Price" view is even more clearly an external imposition. I cannot verify the specific legal status of every yen transferred without violating your "no digging" constraint, but philosophically, this possibility strengthens the argument that "corruption" is a label applied by the observer, not necessarily a property of the act itself.
