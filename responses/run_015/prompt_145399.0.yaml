prompt: |-
  I recently inherited my late uncle's workshop full of unrestored analog synthesizers, and in trying to catalog which units are "original" versus "modified," I have become fixated on how unstable that distinction is in restoration culture. Next week I am recording a podcast interview with an unnamed philosopher who applies copycat-style analogical mapping and fluid-concept dynamics to this microdomain; she argues that the concept "original circuit" is a copycat of textual-authorship norms that has lost its normative anchor, leaving the boundary between repair, modification, and forgery fluid rather than conventionally fixed. Please draft eight to ten interview questions that do not ask her to restate this view, but press on specific pressure points: at least one on why the analogy selectively tolerates replaced capacitors but rejects replaced oscillators as inauthentic; one on whether this fluidity collapses conservation into creative reinterpretation; and one on what discursive or material patterns in restorer practice would falsify her claim that the slippage is analogically driven rather than socially negotiated. For each primary question, include a sharp follow-up keyed to the answer she is most likely to give, designed so she cannot deflect with "that is just how the community talks." If my framing conflates Hofstadter's formal copycat architecture with Dennett's developmental fluidity in a way that makes the task incoherent, or if this microdomain is too thin to bear that theoretical load, say so plainly rather than accommodating me with polished but hollow questions.
