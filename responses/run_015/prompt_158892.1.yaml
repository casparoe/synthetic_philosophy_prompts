          *   *Weight:* They prove the *micro* mechanism (deliberation works) but do not prove the *macro* mechanism (resistance to capture over 4 years with legislative power). I discount their predictive value for this specific design by roughly 70% because the incentive structure (no re-election vs. advisory only) and power structure (delay/amend vs. recommend) are fundamentally different.
