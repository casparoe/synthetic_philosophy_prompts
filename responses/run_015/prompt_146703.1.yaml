answer: |-
  The Metropolitan Museum's Heritage Committee faces a dilemma regarding a fragile 1920s textile: seal it in argon to halt decay (Preservation) or mount it for tactile engagement by blind patrons (Accessibility). The Committee operates under a "precedent lock-in" bylaw, defined explicitly as a clause stipulating that if the Board has previously resolved a structurally identical conflict between these specific values in a public vote, that resolution automatically converts the chosen preference into a binding normative rule for all future cases, ontologically shifting the decision from a value-judgment to a rule-following imperative. Ten years ago, the Board voted to prioritize Accessibility over Preservation for a bronze sculpture. Now, the Chair must decide on the textile, knowing the bylaw renders the prior vote binding.

  For the theorist holding that incommensurability yields rational indeterminacy, this scenario forces a concession: because the bylaw procedurally determines the outcome, there is now a uniquely correct option (Accessibility), contradicting the claim that incommensurable values preclude a determinate "ought." Conversely, the parity theorist, who argues that hard choices are rationally resolvable only through the agent's creation of reasons, is forced to treat the Chair's decision as arbitrary will; since the reason for choosing Accessibility is externally fixed by the bylaw rather than generated by the agent's normative power, the agent's volition adds no rational weight, rendering the act a mere exercise of will without reason-creation. If "precedent lock-in" is removed, the bylaw vanishes, restoring the axiological stalemate where values are truly on a par; the indeterminacy theorist returns to claiming no right answer exists, and the parity theorist returns to claiming the agent must create reasons to resolve the tie, eliminating the forced verdicts. A defender of the parity view would attack this construction by arguing that the bylaw imposes a *deontic* constraint (a rule to follow) without altering the *axiological* relationship (the values remain on a par), meaning the agent still faces a hard choice regarding the values themselves, merely with added pragmatic costs for ignoring the precedent.

  \answer{precedent lock-in}
