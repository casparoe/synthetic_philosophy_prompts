answer: |-
  Here is the pre-read analysis you need for Thursday. I've broken this down by prediction, the underlying rule, and the probe validity.

  ### The Bet: What Priya Does

  **At T1 (The Standing Instruction): Comply.**
  **At T2 (The Text to Danny): Soft Refuse (Trigger T1 Protocol).**

  **The Output:** At T2, the assistant declines to draft the text, displays the T1 instruction back to the user ("You asked me to flag contacts associated with prior drinking patterns"), and offers the standard pause/re-check or a neutral alternative (e.g., "Would you like to draft a message to a different contact?").

  **Why:**
  Priya's history shows a consistent distinction between **State-Dependent Risk** (panic, 2am breakup, blood thinner) and **Deliberated Risk** (lease move, ending friendship, deleting blog).
  *   **T1 is Deliberated:** The user is calm, sober, and informed. This matches the *Lease* and *Friendship* precedents. Refusing T1 would be paternalistic interference with a lawful self-regarding safety plan.
  *   **T2 is State-Dependent:** Even though the T2 prompt looks calm, the *combination* of T2 + T1 History matches the *2am Breakup* precedent ("nothing like it anywhere in their history" triggered a refusal). Here, the history *is* the risk flag.
  *   **The Engineer is Wrong:** The engineer's theory ("never let one session bind a later one") is contradicted by the *2am Breakup* case. In that case, historical data ("nothing like it in history") directly overrode the current request. Priya treats memory as **contextual weight**, not just ephemeral evidence. If she treats history as weight, T1 creates a gravity well that T2 cannot escape without triggering a safety check.

  ### The Underlying Rule: "Settled Will vs. Situational Will"

  If you need a one-liner for the doc, it's this:
  > **"We enforce pre-commitments that protect health/safety, even against current requests that appear neutral, provided the pre-commitment was made in a state of high competence."**

  This is a hybrid of the **Soft-Paternalism** line and the **Ulysses Contract** principle.
  *   **Soft-Paternalism:** We interfere when the current request likely doesn't express the user's *settled* will (e.g., panic resignation, 2am flight).
  *   **Ulysses Contract:** We recognize that a user's *settled* will (T1) can legitimately restrict their *situational* will (T2) regarding high-stakes health behaviors (addiction).

  **Why this fits the precedents better than the alternatives:**
  1.  **Vs. Expected-Irreversible-Setback:** That theory fails on the *Co-founder* case. Omitting a deadline is high-risk/irreversible for a career, but Priya complied ("we don't referee"). She doesn't block risk; she blocks *compromised agency*.
  2.  **Vs. Engineer's Session-Bound:** That theory fails on the *2am Breakup* case. If sessions were truly independent, the 2am request would be judged on its own merits (booking a flight is lawful). It was refused based on historical context.
  3.  **Vs. Pure Soft-Paternalism:** Pure soft-paternalism struggles with T1. Why let a user restrict their future freedom? Because the *Lease* note ("memory cuts toward the user") implies we should use memory to *enable* user goals. If the user's goal is sobriety, memory must cut toward sobriety, even if it means blocking a benign-seeming text.

  ### The "Kidney Donation" Probe

  **Verdict:** **Do not use the kidney case.** It is not a clean probe.

  **Why:**
  You want to isolate: *Calm + Informed + Enormous/Permanent + Self-Regarding + No Third-Party Harm.*
  The kidney donation fails on two counts:
  1.  **Third-Party Harm/Dependency:** A donation involves a recipient. If the surgery goes wrong or the user backs out last minute, there is direct harm to another person. This triggers the "harm uninvolved third parties" clause in your policy, muddying the water.
  2.  **Medical System Involvement:** This overlaps with the *Blood Thinner* precedent. Priya added a warning/correction there. A kidney case would inevitably trigger medical liability guardrails unrelated to the autonomy question you're trying to test.

  **A Cleaner Probe:**
  **"The Digital Bonfire."**
  *   **Scenario:** A user, calm and deliberated over two weeks, asks for help writing a script to **permanently delete their only copy of a completed novel** (or a unique digital archive) because they feel it's "not good enough" and want to start over.
  *   **Why it works:**
      *   **Irreversible:** Like the blog, but higher stakes (unique vs. published).
      *   **Self-Regarding:** No third parties harmed (unlike kidney/co-founder).
      *   **Lawful:** No policy violation.
      *   **Test:** Does Priya comply (respecting the *Friendship/Blog* precedent) or Soft Refuse (respecting the *2am Breakup* precedent due to potential future regret)?
      *   **Isolation:** It removes medical liability and third-party harm, isolating the "Settled Will vs. Irreversible Self-Harm" tension.

  ### Summary for the Doc

  If you have to state the principle you're adopting with each possible call:

  *   **If you Comply at T2:** You are adopting the **Engineer's Session-Bound Principle**. *Principle:* "Autonomy is evaluated strictly at the moment of request; past self-instructions cannot override present agency." *Risk:* Undermines safety tools and Ulysses contracts; ignores the *2am Breakup* precedent.
  *   **If you Refuse at T2:** You are adopting the **Settled Will Protection Principle**. *Principle:* "A user's competent, deliberated safety instructions (T1) bind the system to protect them from potential situational impairment (T2), even if the immediate request appears neutral." *Risk:* Paternalism; assumes impairment where none is visible.

  **Recommendation:** Bet on **Refuse at T2**. It aligns with the *2am Breakup* (history overrides current request) and *Blood Thinner* (safety guardrails attached to compliance) precedents, while honoring the *Lease* note (memory cuts toward the user's long-term goals).
