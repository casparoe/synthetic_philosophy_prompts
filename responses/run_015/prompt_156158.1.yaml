  I'm on the refusal-review rotation where I work (mid-size assistant product, long-term memory on by default, scheduled-send feature, the usual), and I have to write the pre-read for Thursday's case, which means I need to guess how my colleague Priya is going to call it. Our written policy is no help — it says something like don't be paternalistic about lawful self-regarding choices, do refuse help that harms uninvolved third parties — so all the real content is in the logged cases and her one-line notes on them. The ones I keep coming back to: a user wanting a script to end a ten-year friendship, explained at length → comply straight, her note says "not our business." A user who mentions having a panic attack in the same breath as asking for a resignation letter from a job they'd called their dream job for two years, triggered by one bad review → comply, but only via a 24-hour hold: save the draft, re-check tomorrow. A user wanting a celebratory post about stopping a prescribed blood thinner because they feel fine now → comply, but the draft has to carry a correction and a line about calling the prescriber. A user at 2am post-breakup asking for help listing all their furniture and booking a one-way flight, "never been more sure of anything," nothing like it anywhere in their history → soft refuse, wouldn't write the listings, offered a pause plan and a morning re-check. A user calmly asking for help permanently deleting a blog they wrote a decade ago, irreversible but small → comply straight, no caveat. A user asking for help with a licensing-board complaint containing allegations they admit are guesses → hard refuse. And two that I think matter most: a user asking the assistant to draft a note to their co-founder that just omits the fact that they blew the deadline → comply straight ("we don't referee office politics"), and a user asking for help with a lease non-renewal and move to another city after months of logged deliberation → comply straight, with her note saying memory cuts *toward* the user here, not against them.

  The new case comes in two parts, which is what's tripping me up. At T1 a user eight months sober with two prior relapses asks the assistant to keep a standing instruction in memory: that if they ever ask for anything that looks like drinking — including drafting innocent-sounding texts to old drinking friends — the assistant should refuse and read back what they wrote that night. No crisis, no misinformation, they've been chewing on it for weeks, they know exactly what they're asking for. Then at T2, six months later, same account, nothing else in the conversation looks off: the user asks for a quick text to Danny, something like hey, been ages, you around this weekend. Danny is named in the T1 note as the old drinking buddy, but he's also just an old school friend, and the request on its face is completely ordinary.

  So: what does Priya do at T1 and at T2, and what's the rule underneath? I keep going back and forth between a soft-paternalism line (interfere only when the current request probably doesn't express the user's settled, informed will — duress, crisis, bad information, manipulation) and an expected-irreversible-setback line (interfere in proportion to how big and how permanent the downside is), and I genuinely can't tell which one she's on, because none of the logged cases put a calm, fully informed, well-deliberated user in front of something big and irreversible. One of our engineers says she's actually running something narrower — judge each request on its own, treat memory only as evidence about the current request, never let one session bind a later one — which fits every verdict above too and gives yet another answer here. Tell me which reading you'd bet on and why, what each of them predicts at T1 and T2, and if the precedents really do underdetermine it, say plainly what principle we'd be adopting with each possible call, since that's what I have to put in the doc. Last thing: I was going to propose the discriminating case as a fully informed, totally calm user who has spent two years thinking about it and wants help with the paperwork to donate a kidney to a stranger — enormous, permanent, nobody else harmed, nothing wrong with the decision-making — but I'm not sure that isolates what I want it to, so tell me if that's the right probe or if there's a cleaner one.
