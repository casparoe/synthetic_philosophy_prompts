  You need 32 index cards (half marked 'C', half 'D'), a bag of poker chips, and two decks: a 'Shadow Deck' (80% 'Continue', 20% 'Replace') and a 'Mutation Deck' (10% 'Flip Strategy'). Seat the 16 grads in 8 face-to-face pairs. Each player holds one strategy card face-down. You act as the bank and environment. The goal isn't to win a single round but to accumulate enough chips to 'survive' the simulation phases. Ensure everyone knows cards represent hard-coded behaviors, not momentary choices—once you pick C or D, you hold it until mutation forces a change. This physical constraint stops them from calculating every move and forces them to inhabit a strategy. Give them 30 seconds to pick their initial card secretly. This commits them before they see the payoff structure fully.

  Rules and payoffs
  Payoffs per round: Mutual C = 3 chips each; Mutual D = 1 chip each; Temptation (D vs C) = 5 for Defector, 0 for Sucker. Play proceeds in rounds. After each round, draw from the Shadow Deck. If 'Continue', keep the same partner. If 'Replace', the partner swaps out for a 'copy'—a random student adopts the strategy of a current high-scorer and takes the seat. This hidden probability creates the 'shadow of the future.' Every 5 rounds, draw from the Mutation Deck. If 'Flip', a random player must swap their index card (C becomes D, vice versa). At phase ends, the bottom 25% of chip-holders must adopt the strategy card of a top performer. This mimics differential reproduction. No talking during rounds. Chips are symbolic; status is the real reward. If a player runs out of chips, they are 'dead' and must observe silently until the next phase reset, reinforcing the cost of failure. Silence is mandatory to prevent signaling.

  The debrief
  Gather everyone. Ask: "When did you feel safe cooperating?" Likely answers: "When I knew I'd see them again." Map this to $w$ (probability of continuation). In early rounds (low expected $w$), Defect dominates—this is the Nash equilibrium of the one-shot game. As 'Continue' cards stack, the Iterated Dilemma emerges. Discuss the Mutation draws: "Who got forced to Defect?" This mimics genetic noise. If Tit-for-Tat players meet noise, they lock into mutual defection. This leads to ESS discussion: Defect is an ESS in one-shot contexts because it cannot be invaded by Cooperators. Cooperate isn't strictly ESS unless clustered. Ask if 'rationality' drove their choices or 'selection pressure' (losing chips forced strategy adoption). The key takeaway: Cooperation isn't moral; it's a stable strategy under specific structural conditions (high $w$, low noise). Specifically highlight the Shadow Round mechanic: uncertainty about partner retention mimics real-world ecological instability. Push them on Maynard Smith's definition: a strategy is ESS if, when adopted by a population, no mutant strategy can invade. Did we see mutants invade? Yes, during mutation rounds. Did they stick? Only if the shadow was long enough. Connect this to the philosophy of science: models simplify reality to isolate causal mechanisms like $w$. The friction of physically flipping the card represents the cost of behavioral change, making strategy shifts feel significant rather than abstract.

