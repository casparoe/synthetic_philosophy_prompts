    "cost_of_rejection": "Hinges must be viewed as dynamic (Wittgenstein's 'riverbed' metaphor); their status is functional and revisable, not ontological or permanent.",
    "preserved_premises": "1, 2, 3, 4 (The definition of hinges within a game and the self-continuity analogy remain intact, avoiding the dogmatism/collapse dilemma)."
  }
