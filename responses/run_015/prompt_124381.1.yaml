answer: |-
  Here is the adjudication of the dispute, move by move, followed by an assessment of the overall standing and the burden of proof.

  **Move (1): Ines**
  **Rating:** Mostly right but in need of a qualification.
  **Justification:** She accurately states the classic Expressivist position (moral language expresses attitude, not fact) and its main selling point (explaining motivation), but she treats Internalism (the idea that judgment *must* motivate) as a given, which Rob's opening remark already challenges.

  **Move (2): Tomas**
  **Rating:** Clearly right.
  **Justification:** This is the standard and devastating objection to simple Expressivism (the Frege-Geach problem); if moral sentences are just noises of approval, they cannot function as logical premises in conditionals without losing their meaning.

  **Move (3): Ines**
  **Rating:** Mostly right but in need of a qualification.
  **Justification:** She correctly identifies that sophisticated Expressivism can handle logic by positing higher-order attitudes, but this qualification makes the theory significantly more complex and less intuitive than the simple "hiss" model she started with.

  **Move (4): Tomas**
  **Rating:** Mostly right.
  **Justification:** His first point about opposites is debatable, but his second point is clearly right: he correctly identifies that Ines has not explained *why* moral terms keep the same meaning when embedded in different sentences, which is the core semantic challenge.

  **Move (5): Ines**
  **Rating:** Mostly right but in need of a qualification.
  **Justification:** She wisely concedes the semantic difficulty but successfully pivots to the "Open Question Argument" (facts never settle moral questions), which is a strong counter-attack, though naturalists would argue the question only *seems* open, not that it *is*.

  **Move (6): Tomas**
  **Rating:** Mostly right.
  **Justification:** He correctly spots that Ines is relying on a link between judgment and feeling that Rob's behavior contradicts, though he misses that she is about to redefine "feeling" as "policy" in the next turn.

  **Move (7): Ines and Tomas**
  **Rating:** Ines is mostly wrong; Tomas is clearly right.
  **Justification:** Ines's redefinition of "attitude" to include cold policies saves her theory from Rob's counterexample but at the cost of making it vague; Tomas's email correctly identifies that if any behavior counts as an attitude, the theory becomes unfalsifiable and explains nothing.

  ***

  **Who has the better of the argument?**
  At the point where they stopped, **Tomas has the better of the argument.** He has successfully forced Ines into a corner where she must choose between a theory that cannot explain logic (Move 2) or a theory that is so flexible it cannot be tested (Move 7). Ines survives by making her position more complex, but Tomas has shown that every time she patches a hole, the patch costs her explanatory power. She wins on intuition (Move 5: moral facts *do* feel different than scientific facts), but Tomas wins on coherence (logic and semantics).

  **What is each missing?**
  **Ines** is ignoring that her "Quasi-Realist" defense (Move 3) mimics Realism so closely that the distinction between "expressing an attitude" and "describing a fact" begins to collapse; she is fighting to keep a distinction that her own repairs are erasing. **Tomas** is ignoring the metaphysical cost of his own position; he attacks Ines for not explaining moral properties, but he offers no account of what these properties *are* or how we detect them, leaving him open to the charge that he is positing "queer" entities just to save logic.

  **Where does the burden of proof lie?**
  **Ines must speak next.** Tomas has landed the last blow (the unfalsifiability charge), so the onus is on her to demonstrate that a "policy-based" Expressivism is not just a verbal trick. To win the next exchange, she must show how her view predicts something about moral disagreement or learning that Realism cannot, rather than just defending her view from logical objections. If she cannot produce a positive prediction that distinguishes her view from Tomas's, the column should conclude that Expressivism survives only as a ghost of itself.
