answer: |-
  **TO:** Programs Committee, Halstead Trust
  **FROM:** Secretary, Programs Committee
  **DATE:** October 15, 2023
  **SUBJECT:** Recommendation on Proposal P-14

  This memo serves as the Secretariat's formal recommendation ahead of our vote in four weeks. The Committee is divided, and ambiguity will result in deadlock. We must decide whether the Trust's moral obligation to beneficiaries outweighs its operational conventions. Below is the bottom line, the arithmetic justification, and the principled boundaries required to move forward.

  **1. Recommendations**

  **(a) Portfolio Maximization:** **Adopt with Condition.**
  *Vote-Ready Formulation:* The Trust shall allocate the annual payout to the highest-ranked interventions on the external evaluator's list, subject strictly to Counsel's opinion that no more than 60 percent of the payout may be granted outside the county.
  *Timeline:* Effective for the next fiscal year beginning January 1.

  **(b) Discretionary Review:** **Adopt with Conditions.**
  *Vote-Ready Formulation:* The four line items totaling $1.1 million shall be reallocated to the portfolio defined in (a), with two exceptions: the salary band and the staff retreat budget are reclassified as essential operational infrastructure and protected. The office lease and unrestricted small-grants window are to be terminated.
  *Timeline:* Office relocation to be completed by June 30; small-grants window closed December 31.

  **(c) Spend-Down Study:** **Reject.**
  *Vote-Ready Formulation:* The Committee shall not commission a review of dissolving the corpus. The Trust operates under a presumption of perpetuity consistent with the founder's letter of wishes until the Deed is amended.
  *Timeline:* N/A.

  **2. The Arithmetic**

  We must state plainly whether the size of the number settles anything. It creates a decisive presumption, though it does not absolve us of operational risk.

  The $1.1 million under review represents 12 percent of our annual payout. If reallocated to our best global interventions ($50 per disability-adjusted life year, or DALY), this capital generates 22,000 DALYs annually. If forced into local county programs ($2,000 per DALY) due to the geographic cap, it generates 550 DALYs. Using a standard conversion where one statistical life saved equals roughly 30 DALYs, the global counterfactual represents approximately 730 lives per year; the local counterfactual represents 18 lives.

  Retaining the funds for internal use generates zero direct DALYs. The magnitude of the difference—hundreds of lives versus dozens versus none—settles the burden of proof. Any internal expenditure must prove it is necessary to generate those DALYs, not merely that it is traditional. However, the arithmetic does not settle the *method* of reallocation, only the *necessity* of it. If cutting costs destroys the machine that delivers the grants, the arithmetic becomes theoretical.

  **3. The Demandingness Objection**

  The staff working group argues that because an artificial agent has no projects or integrity, the demandingness objection has no grip on the Trust. I disagree. The objection applies derivatively. The Trust has no nervous system, but the people who constitute it do. An institution cannot be "demanding" in a moral sense, but it can be operationally unsustainable.

  If the objection applies only through the staff, it follows that we may demand high effort, but we cannot demand self-neglect. Transparent recruitment of candidates who accept austere norms is insufficient if those norms select for a homogeneous class of individuals who can afford to work for low pay or without boundaries. This creates a governance risk: a staff lacking diverse life experience will make poorer grantmaking judgments. Therefore, the objection survives honest recruitment. We must pay market rates (75th percentile) to ensure we are not subsidizing our impact with staff welfare, which is unsustainable and ethically hazardous.

  **4. The Stopping Point**

  The staff argues there is no principled boundary between internal costs and grant funds: if the retreat is wasteful, so is the salary. I reject this. A boundary exists between *instrumental necessity* and *discretionary comfort*.

  The test the Committee should apply to future line items is: "Would this expenditure cease to provide value if grantmaking volume doubled?"
  *   **Office Lease:** No. A cheaper premises enables the same work. This fails the test.
  *   **Small Grants:** No. The cost-effectiveness score is too low compared to alternatives. This fails the test.
  *   **Salary/Retreat:** Yes. Retaining institutional knowledge and preventing burnout scales with the complexity of our work. High turnover destroys capacity. These pass the test.

  We draw the line at operational capacity. We are not protecting comfort; we are protecting the engine.

  **5. The Ethics Trustee's Case**

  I anticipate the Ethics Trustee will argue that the arithmetic is indifferent to who bears the cost. The beneficiaries of reallocation are real people facing preventable death; what is protected on the other side is professional amenity. The Trust has no mandate to spend income on the comfort of its own staff. To prioritize staff retention over immediate life-saving is a form of institutional self-preservation that violates the Deed.

  This is the strongest version of the opposition, and it must be answered without caricature. It is true that beneficiaries are real and staff comfort is abstract. However, the counter-argument is not that staff comfort matters intrinsically, but that it matters instrumentally. A Trust that burns through program officers every eighteen months loses the expertise required to identify the $50 interventions in the first place. If austerity leads to homogeneity and turnover, we lose the judgment required to fulfill the Deed. Protecting the salary band is not indulgence; it is maintenance of the only asset we have that can evaluate cost-effectiveness. We cannot save lives if we cannot staff the building.

  **6. Revisit Conditions**

  This recommendation is not immutable. The Committee should agree to revisit these decisions under the following conditions:
  1.  **Turnover Data:** If voluntary staff turnover exceeds 25 percent within the next 24 months, the salary and retreat protections must be reviewed immediately.
  2.  **Legal Opinion:** If Counsel issues a new opinion restricting the external payout cap below 60 percent, the portfolio maximization strategy must be recalibrated.
  3.  **Scheduled Review:** A formal review of P-14 implementation shall be scheduled for 24 months from approval.

  We have the opportunity to significantly increase our impact without compromising our capacity to deliver it. I urge the Committee to vote in favor of these recommendations.
