answer: |-
  The simulation mandates an explicit "Analogical-Reasoning License" card mechanism and treats negative spaces as equal evidential weight to present objects to force epistemic accountability and amplify the underdetermination of material traces.

  ### Reasoning for Design Commitments
  You must require teams to spend a limited pool of "Analogical-Reasoning License" cards to invoke ethnographic parallels (e.g., "In Neolithic Anatolia, X implies Y"). This makes the move visible and costly; if they run out of cards, they must rely solely on internal material coherence. This prevents the unexamined bias of "common sense" ethnography from smoothing over contradictions. Regarding negative spaces (e.g., "no sleeping platforms found"), you must instruct teams to treat absence as **equal evidential weight** to presence during the argumentation phase. While ontologically distinct, treating absence as positive evidence forces participants to confront how "what is not there" actively constructs narratives (e.g., "no beds means sacred space" vs. "no beds means temporary use"), which is central to the underdetermination problem.

  ### Ground Truth and Context
  **Hidden Context:** A single room (Structure 4, Layer II) from a hypothetical Neolithic settlement.
  **Ground Truth:** **A Secular Communal Granary used occasionally for emergency shelter.**
  *   **Belief Complex:** None (Utilitarian/Secular).
  *   **Institution:** Cooperative Storage Management.
  *   **Ambiguity Source:** The room contains grain residues (economic), ochre dust (often ritual, here pest deterrent), and scattered human bone fragments (often burial, here accidental contamination from above layer or rodent activity).

  ### Trace Subsets (Materials)
  Prepare two envelopes (Team A and Team B). Each contains 10 cards. 4 cards are identical in both (the "Overlap"), 3 are unique to A, 3 are unique to B.
  *   **Overlap Cards (Both Teams):**
      1.  *Spatial Diagram:* Rectangular room, single entrance, no internal partitions.
      2.  *Material Note:* High concentration of barley phytoliths on floor.
      3.  *Wear Pattern:* Heavy abrasion on threshold stone.
      4.  *Negative Space:* No hearth features detected.
  *   **Team A Unique Cards (The "Ritual" Bias):**
      1.  *Artifact:* 3 fragments of human long bone (unburned).
      2.  *Material:* Traces of red ochre on walls.
      3.  *Negative Space:* No domestic pottery (only storage jars).
  *   **Team B Unique Cards (The "Economic" Bias):**
      1.  *Artifact:* 5 clay sealings (administrative tokens).
      2.  *Material:* Pestle fragments with grain polish.
      3.  *Negative Space:* No burial pits cut into floor.

  ### Roles (7 per Team)
  1.  **Team Lead:** Manages time and final synthesis.
  2.  **Pattern-Analyst:** Maps spatial relationships.
  3.  **Ethnographic-Analogy Skeptic:** Holds the "License Cards"; must approve any external comparison.
  4.  **Institutional-Reconstruction Advocate:** Drafts the social structure claim.
  5.  **Negative-Space Interpreter:** Argues the significance of absences.
  6.  **Material Specialist:** Focuses on wear and composition.
  7.  **Scribe/Presenter:** Records claims and presents to the room.

  ### Timeline (90 Minutes)
  *   **00:00–00:10 (Intro):** Distribute envelopes. Explain rules. Emphasize: "There is no correct answer yet, only coherent arguments." Distribute 3 "Analogical-Reasoning Licenses" per team.
  *   **00:10–00:40 (Reconstruction):** Teams work separately. They must produce: (1) A belief complex description, (2) An institutional structure diagram. They must spend at least one License Card to justify one key inference. They must write one paragraph defending a specific Negative Space.
  *   **00:40–00:55 (Presentation):** Team A presents (7 mins). Team B presents (7 mins). No interruptions.
  *   **00:55–01:10 (Deliberation & Exchange):** Teams swap trace subsets. They have 15 minutes to reconcile the new data. *Constraint:* They cannot change their core reconstruction, only add auxiliary hypotheses.
  *   **01:10–01:20 (Voting):** Participants vote individually on "Publication Worthiness" (1–5 scale) for each team based on argument coherence, not truth.
  *   **01:20–01:30 (Reveal & Debrief):** Reveal Ground Truth. Map simulation phases to philosophical concepts.

  ### Payoff Scheme
  "Publication Credit" is awarded based on the median vote score. The top scorer receives a physical "Publication Token." The rule is: **Coherence under constraints outweighs accuracy.** If a team guesses the Ground Truth but cannot justify it with their specific trace subset, they receive zero points. This prevents "guessing the teacher's password."

  ### Debrief Mapping
  1.  **Phase 2 (Reconstruction):** Maps to **Middle-Range Theory**. Show how teams bridged the gap between static artifacts (bones) and dynamic behavior (ritual) using different bridging arguments.
  2.  **Phase 3 (Presentation):** Maps to **Theory-Ladenness**. Show how Team A's "Ritual" language framed the same overlap data (threshold wear) as "processional" while Team B framed it as "logistical."
  3.  **Phase 4 (Exchange):** Maps to **Proliferation vs. Convergence**. Demonstrate that adding data (the other team's cards) did not solve the problem; it required *ad hoc* auxiliary hypotheses (e.g., "The sealings were ritual offerings," or "The bones were accidental"), increasing complexity without securing truth.
  4.  **Negative Space:** Discuss **Argument from Silence**. Validate that absence is evidence only relative to an expectation (e.g., "No hearth" implies "No cooking" ONLY if you expect cooking there).

  ### Honest Limitation
  This simulation cannot reproduce **Stratigraphic Chronology and Taphonomic Distortion**. In real archaeology, the sequence of deposition and post-depositional movement (bioturbation, erosion) are primary constraints on interpretation. Here, the data is static and clean. You must verbally supply this limitation: "In reality, you would not know if the bone fragments arrived before or after the grain; here, they are simultaneous. Real underdetermination is compounded by temporal uncertainty which this simulation strips away to isolate inferential logic."

  ### Predicted Failure and Correction
  **Prediction:** Participants will ignore the "Coherence over Accuracy" rule and attempt to deduce the Ground Truth by reading your tone or searching for "trick" clues in the packet design. They will converge on what they think *you* want rather than what the data supports.
  **Correction:** Implement **Blinded Scoring**. During the voting phase, collect the reconstructions anonymously. Read them aloud without attributing them to Team A or B. Ask participants to vote on the text alone. This severs the link between performance and facilitator expectation, forcing them to evaluate the inferential structure itself. If they still guess the truth, invalidate those votes explicitly during the debrief to reinforce that accuracy was not the metric.
