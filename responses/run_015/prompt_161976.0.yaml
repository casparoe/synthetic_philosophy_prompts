      *   *Adjustment:* Use a Tetrahedron (4 vertices) vs. Octahedron (6 vertices). Easier to count quickly. Or Cube (8) vs. Dodecahedron (20).
      *   *Let's use Cube (8) vs. Octahedron (6).* Both are "pointy."
      *   *Probe 1:* Oriented to show all vertices.
      *   *Probe 2:* Oriented to hide vertices (Face-on).
      *   *Wait, Face-on Octahedron looks like a Square too.* (Actually, face-on Octahedron looks like a Diamond/Square with a cross). Face-on Cube looks like a Square.
      *   *This might be too hard visually.*
      *   *Let's stick to Cube vs. Sphere.*
      *   *Probe 1 (Corner-on):* Cube shows 3 faces meeting at a point (Y-shape) + 6 other vertices. Sphere shows a circle.
      *   *Probe 2 (Face-on):* Cube shows a Square. Sphere shows a Circle.
      *   *HV on Probe 2:* "I see a Square. I felt a Cube. Why should a Square match a Cube? A Sphere feels round, and looks round (Circle). Maybe the Circle matches the Sphere?"
      *   *HV might actually pass Probe 2 based on "Roundness".*
      *   *I need to block the "Roundness" inference.*
      *   *How?* By ensuring the visual "Roundness" (Circle) is not obviously linked to tactile "Roundness" (Curvature) without the Common Figure assumption.
      *   *But HV predicts failure on Molyneux.* So I can assume HV predicts failure on the standard Cube/Sphere test.
      *   *So Probe 2 can be the standard test (Face-on).*
      *   *Probe 1 must be the one HV passes.*
      *   *So Probe 1 = Counting Vertices.*
      *   *Probe 2 = Standard Shape Match.*
      *   *Variable:* **Availability of Discrete Countable Features.**

      *   *Wait, Constraint (v):* "differing from one another in exactly one respect."
      *   *Orientation* changes the availability of features. That counts as one respect (Orientation).

      *   *Visual Training:* Train on counting dots on a screen. "How many dots?"
      *   *Why not dispute:* It trains visual attention/counting, not cross-modal mapping.

      *   *Third View (Sensorimotor):*
      *   O'Regan/Noë. Perception is action.
      *   Prediction: Failure on *both* if the patient cannot move their eyes/head to explore the "sensorimotor contingencies."
      *   If head movement is allowed: Success on both (because they can explore the invariants).
      *   If head is fixed: Failure on both.
      *   *This peels off because it depends on *movement*, not just static representation.*

      *   *User's Invariant:*
      *   User: "Invariant that haptic experience had already tied to the object."
      *   My take: Vertex count is an invariant. Shadow is not.
      *   I will affirm the user's instinct but refine the "tie." The tie must be logical (Number), not empirical (Shadow).

      *   *Drafting the Content:*
      *   *Scene:* Clinical room. Patient seated. Objects on pedestals.
      *   *Screening:* Tactile (behind screen). Visual (2D shapes on screen).
      *   *Training:* Visual counting of dots.
      *   *Probe 1:* Objects rotated to maximize vertex visibility. Task: "Point to the one you held first."
      *   *Probe 2:* Objects rotated to minimize vertex visibility (Face-on). Task: Same.
      *   *HV:* P1 Pass (Counting). P2 Fail (Shape).
      *   *CFV:* P1 Pass (Shape/Number). P2 Pass (Shape).
      *   *Variable:* Orientation (Feature Visibility).
      *   *Objection:* HV says "Counting vertices is recognizing Figure." Rebuttal: Counting is abstract; Figure is qualitative.
      *   *Residue:* Does "8" really bridge the gap if the "units" are different?
      *   *Sensorimotor:* Needs eye movement.

      *   *Wait, one constraint check:* "tested on the day the dressings come off."
      *   Vision will be blurry. Counting 8 vertices might be impossible.
      *   *Adjustment:* Use a Tetrahedron (4 vertices) vs. a Triangular Bipyramid (5 vertices). Or just Cube (8) vs Sphere (0).
      *   *Blurry vision:* High contrast vertices might still be visible as "points."
      *   *I will specify high-contrast lighting to ensure vertices are visible.*
      *   *Also, Screening must establish they can see the vertices.*

      *   *Final Polish:* Ensure the tone is respectful of the user's expertise (crystallography) and philosophical curiosity. Use precise language.

      *   *Wait, "Heterogeneity view predicts the patient will pass [Probe 1]... for a reason generated by that view's own commitments."*
      *   Commitment: Ideas are distinct. Connection is learned or inferred.
      *   Inference: "8 tactile points" + "8 visual points" + "Principle of Number" -> Match.
      *   This works.

      *   *Wait, "Common-figure view's prediction of success on the second probe must follow from its commitments rather than from your having made the task trivial."*
      *   Standard Molyneux is not trivial. CFV says it's immediate. HV says it's impossible.
      *   So Probe 2 is the standard Molyneux test (Face-on).
      *   Probe 1 is the Modified Test (Corner-on).
      *   This satisfies the constraint.

      *   *One more thing:* "no verbal bridge."
      *   The patient is not told "This has 8 corners." They just feel it.
      *   They are not told "Count the points." They are just asked "Which one?"
      *   The *strategy* of counting is up to the patient.
      *   HV says: If they count, they can succeed.
      *   CFV says: They don't need to count, they just see it.
      *   *Wait, if HV says "If they count, they can succeed," does HV predict they *will* count?*
      *   HV predicts they *can* pass if they use reason. The prompt asks for a probe HV predicts the patient *will* pass.
      *   I need to ensure the counting strategy is the most salient one.
      *   *Visual Training:* "We trained them to look for distinct points."
      *   *Okay, I will include that in the Visual Training section.* "Training included a task of identifying objects by the number of high-contrast markers."
      *   *Constraint (vii):* "why that training is not itself the matter in dispute."
      *   Because it trains visual attention, not the tactile-visual link.

