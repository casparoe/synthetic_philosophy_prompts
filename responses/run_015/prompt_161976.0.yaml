answer: |-
  Here is a design for a two-probe clinical session intended to disentangle the Heterogeneity View (HV) from the Common-Figure View (CFV), tailored to your constraints and background.

  ### The Setup and Screening

  **The Patient:** An adult male with dense bilateral congenital cataracts, scheduled for removal. Pre-operative testing confirms normal haptic acuity and the ability to distinguish the test objects by touch alone.
  **The Objects:** Two unfamiliar solids of similar volume and surface texture (matte white plastic). Object A is a **Cube**. Object B is a **Regular Octahedron**. (These are chosen over the sphere because both possess vertices, preventing the "roundness" cue from trivializing the task, and both are familiar to you as a crystallographer as distinct symmetry classes).
  **Pre-Session Tactile Training:** Weeks prior to surgery, the patient handles Object A and Object B extensively behind a screen. He learns to identify them haptically and is told: *"On the day of the test, you will be asked to point to the one you held first (Object A)."* He is given no verbal descriptions of their shape (e.g., no "six sides" or "eight points").
  **Visual Screening (Session Start):** Before the probes, we must ensure the patient can resolve the relevant visual features without linking them to touch.
  1.  *Acuity:* Patient views high-contrast 2D shapes (Square vs. Circle) on a monitor and points to match a spoken name ("Point to the square"). This establishes he can process 2D geometry.
  2.  *Vertex Detection:* Patient views wireframe drawings of polyhedra on a monitor and counts the visible junctions aloud. This establishes he can visually resolve and enumerate vertices.
  **Permitted Visual Training:** Between screening and probes, the patient undergoes a 10-minute visual training block using *neutral* stimuli (e.g., cards with varying numbers of black dots). He is trained to discriminate objects based on the *count* of discrete high-contrast features.
  *Why this is not the matter in dispute:* This training establishes a *visual* strategy (counting) and ensures visual competence. It does not teach a link between tactile vertices and visual vertices; it merely ensures that if a visual count is possible, the patient has the attentional habit to perform it. The cross-modal link (Tactile 8 = Visual 8) remains untaught.

  ### The Variable

  The single variable distinguishing the two probes is **Object Orientation relative to the line of sight.**
  *   **Probe 1 (Maximal Visibility):** Objects are oriented "corner-on" (for the Cube) and "vertex-on" (for the Octahedron) such that all vertices are simultaneously visible and distinct.
  *   **Probe 2 (Minimal Visibility):** Objects are oriented "face-on" such that vertices are occluded or foreshortened, requiring recognition of the global silhouette/shape rather than feature counting.

  ### Probe 1: The Countable Array

  **The Scene:** The patient sits 60cm from a turntable. The dressings are removed. The lighting is arranged to cast high-contrast highlights on the vertices of the solids. The objects are presented in the **Maximal Visibility** orientation. The Cube displays 7 visible vertices (one hidden behind) appearing as distinct bright junctions; the Octahedron displays 5 visible vertices. The patient is asked: *"Point to the one you held first."* No touching is allowed.

  **The Heterogeneity Verdict:** **Pass.**
  *Reasoning:* The HV (Locke/Berkeley) holds that visual ideas and tactile ideas are distinct languages with no necessary connection. However, it allows that *abstract relations* (like Number) can apply to ideas of any sense. The patient felt a specific number of "termination points" (tactile events) on Object A during pre-session training. In this orientation, the visual array presents a specific number of "bright junctions" (visual events). The patient does not need to recognize the *figure* of the cube; he need only infer via reason that the object with the matching *count* of features is the same object. Since Number is a mode of reflection applicable to both senses, the HV predicts the patient can bridge the gap via inference (8 tactile ≈ 8 visual) without needing a common idea of "Cube."

  **The Common-Figure Verdict:** **Pass.**
  *Reasoning:* The CFV holds that extension and figure are common sensibles. The patient immediately recognizes the visual shape as the same spatial entity as the tactile shape. The count is incidental; the recognition of the *solid* is immediate.

  ### Probe 2: The Global Silhouette

  **The Scene:** The setup is identical, except the turntable rotates the objects 45 degrees into the **Minimal Visibility** orientation. The Cube now presents a square silhouette with no visible internal vertices (face-on). The Octahedron presents a diamond/rhombus silhouette with vertices obscured by lighting or occlusion. The visual distinction relies on the global 2D profile (Square vs. Diamond) and shading gradients implying 3D volume. The patient is asked: *"Point to the one you held first."*

  **The Heterogeneity Verdict:** **Chance (Fail).**
  *Reasoning:* In this orientation, the discrete countable features are lost. The patient must match the tactile idea of "solid cube" to the visual idea of "square patch of light with shading." The HV argues there is no necessary connection between the tactile sensation of solidity/edges and the visual sensation of a square silhouette. Without the bridge of Number, the patient has no rational basis to link the two. Any success would require prior empirical correlation (seeing the cube while touching it), which has not occurred. Thus, performance should be at chance.

  **The Common-Figure Verdict:** **Pass.**
  *Reasoning:* The CFV holds that the spatial property (Figure) is the same regardless of orientation or sensory modality. The patient recognizes the "Cubicality" in the visual shading and silhouette just as he felt it haptically. The change in orientation does not break the commonality of the figure.

  ### Analysis of the Design

  **The Operative Variable:** **Feature Countability (Discrete vs. Continuous).**
  The design isolates whether success is driven by an abstract inference (Number) or a perceptual recognition (Figure).
  *   **If the variable is removed:** If both probes use the Face-On orientation (standard Molyneux), the HV predicts failure and CFV predicts success, but we cannot rule out that a Pass is due to accidental cues (shadows, lighting). If both use Corner-On, both views predict success (HV via counting, CFV via shape), and the distinction collapses. The contrast *requires* the shift from Countable to Non-Countable to separate Inference from Perception.
  *   **Does it collapse to the bare question?** No. The bare question conflates all visual cues. This design forces the HV to concede ground on Probe 1 (admitting Number bridges the senses) while holding firm on Probe 2 (denying Figure bridges the senses). This refines the philosophical debate from "Is there transfer?" to "Is the transfer perceptual or inferential?"

  **Strongest Objection (to Heterogeneity View):**
  *Objection:* The HV cannot consistently allow Number as a bridge while denying Figure. If "8 tactile points" and "8 visual points" can be judged identical, then the "point" itself must be a common sensible. If the unit is common, the arrangement of units (Figure) should be too.
  *Modification to Blunt It:* The HV can argue that "Number" is a mental operation performed *on* the ideas, not a quality *of* the ideas. I count the tactile ideas, and I count the visual ideas; the *act of counting* is the commonality, not the sensory content. To blunt the objection further, ensure the visual vertices are not "points" but "blobs" of light, emphasizing that the patient is counting *events*, not recognizing geometric corners.
  *Residue:* The design cannot settle whether the "act of counting" is truly modality-neutral or if it relies on a hidden common spatial framework. It leaves open whether Number is truly distinct from Figure.

  **Third Position: Sensorimotor Account (O'Regan/Noë):**
  *Prediction:* **Fail on Both Probes.**
  *Reasoning:* This view holds that vision is not a representation but a mastery of sensorimotor contingencies (how the image changes as I move). Since the patient is seated, head-fixed (to control orientation), and tested on a *single trial* without opportunity to move their eyes or head to explore the object's invariants, they possess no visual mastery. They cannot "see" the shape in the philosophical sense until they have learned how the light changes with movement.
  *Structural Feature:* **Active Exploration.** This view peels off because it makes success dependent on *time and movement* during the probe, whereas HV and CFV treat the probes as static recognition tasks. If you allow eye-tracking and multiple seconds for exploration, the Sensorimotor view predicts success on both, converging with CFV but for different reasons (lawful exploration vs. immediate intuition).

  ### Reaction to Your "Invariant" Suggestion

  Your instinct that **invariants** are the key is correct, but your examples (shadows, resting state) are what I would call *accidental invariants*.
  *   **Why your examples risk evidential inertness:** A shadow is a visual object caused by the solid, but the correlation between "shadow shape" and "tactile shape" is empirical (learned from lighting physics). If a patient uses shadows to pass, the HV can argue: "They didn't recognize the Cube; they recognized that *this* tactile object usually casts *that* shadow." This is learned association, not common figure.
  *   **Why Vertex Count is better:** The number of vertices is an *essential geometric invariant*. It does not depend on lighting (unless obscured) or gravity. It ties the haptic experience (counting corners by finger) to the visual experience (counting junctions by eye) via logic rather than empirical correlation.
  *   **Refinement:** Your suggestion identifies the right *structure* (a bridge invariant), but to serve the philosophical end, the invariant must be **intrinsic to the object's geometry** (like vertex count or symmetry group) rather than **extrinsic to the viewing condition** (like shadow or resting orientation). By using Orientation to toggle the availability of the intrinsic invariant (vertices), we force the patient to rely either on the invariant (Probe 1) or on the global figure (Probe 2), cleanly separating the two views.
