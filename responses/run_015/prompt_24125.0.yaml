      *   "Consideration/motivating case": Yes.
      *   "Mark non-negotiable vs preference": Yes.
      *   "Jointly satisfiable?": Yes (explicitly no).
      *   "Map main contenders": Yes.
      *   "Table": Yes.
      *   "Which desideratum knocks out the most": Yes.

  10. **Final Polish:** Ensure clear headings and precise logical notation matching the user's input. (e.g., using $\Diamond K$ vs $K$). Make sure the distinction between "Resolution" (solving the problem for a specific theory) and "Dissolution" (showing the problem is ill-posed) is clear if relevant, but stick mostly to the user's framing of "Resolution."

  *(Self-Correction on "Non-Negotiable"):* Is Non-Omniscience truly non-negotiable? For a dissertation on *knowability*, yes. If $p \to Kp$ were true, the paradox wouldn't be a paradox; it would be a proof of omniscience. The *reductio* relies on Omniscience being absurd. So, preserving the falsity of Omniscience is a hard constraint for any solution that accepts the *reductio* structure.

  *(Self-Correction on "Ad Hoc"):* How to define "Ad Hoc"? A solution is ad hoc if it blocks *only* the Fitch proposition and nothing else, without independent motivation. This is a key desideratum.

