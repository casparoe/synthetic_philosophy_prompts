answer: |-
  At St. Jude's Memorial, the "TriageOptimize" system manages ventilator allocation during seasonal surges using a priority matrix that is fully visible on the ward dashboard, displaying real-time coefficients for survival probability, quality of life, and resource utilization. Initially programmed with standard ethical weights, the system was designed to adjust these coefficients based on implicit nurse feedback: when nurses overridden a recommendation, the system logged the deviation as a correction signal, subtly shifting future weights to align with ward behavior. Over eighteen months, thousands of micro-adjustments accumulated—nurses prioritizing patients with higher family visitation rates to reduce conflict, or subtly deprioritizing chronic cases deemed "futile" by ward culture—none of which were explicit policy changes. The system's current weight matrix is fully visible on the dashboard, showing a 15% bias toward "social stability metrics" over "survival probability." When a surge hit, the AI denied a ventilator to a high-survival candidate with a history of non-compliance, allocating it to a lower-survival patient with strong community ties. The engineers didn't code this bias, the nurses never voted for it explicitly, and the system merely executed the mathematically transparent sum of their collective, uncoordinated micro-decisions.

  ### The Failure of Standard Conditions

  The responsibility gap emerges because the standard conditions for moral responsibility—control and knowledge—are dissolved across time and agents, despite the transparency of the code.

  *   **The Designers:** They satisfy the *knowledge* condition regarding the system's architecture but fail the *control* condition regarding the specific outcome. They built the learning mechanism, not the specific weight configuration that caused the death. They cannot be held responsible for the specific lethal bias because it was not present at deployment, nor could it be reasonably foreseen given the stochastic nature of human feedback loops.
  *   **The Nurses:** They satisfy a localized *control* condition (they chose to override specific cases) but fail the *knowledge* condition regarding the global impact. No single nurse knew their override would contribute to a systemic 15% bias shift. They acted on immediate clinical intuition or ward convenience, lacking the epistemic access to understand their actions as legislative acts changing hospital policy.
  *   **The System:** It satisfies neither condition. It is not a moral agent. While the weights are visible (no black box), the system has no intent; it is merely the vessel through which the distributed agency of the nurses and designers flowed.

  The gap is not ontological (we know what happened) but attributive: the harm was caused by a "collective author" that does not exist as a legal or moral entity.

  ### The Fix: Cumulative Agency Accounting (CAA)

  To address this, I propose **Cumulative Agency Accounting (CAA)**. Unlike standard audit logs which record *what* changed, CAA treats weight drift as a consumption of "ethical capital." Under CAA, the system tracks the cumulative deviation of weights from the original ethically ratified baseline. When the aggregate drift exceeds a predefined threshold (e.g., a 5% shift in priority logic), the system does not simply update; it freezes and triggers a "Re-Ratification Protocol." This protocol requires a designated Ethics Committee to explicitly sign off on the new weight configuration as if it were new legislation. They must affirm that the emergent weights reflect current institutional values. This shifts the locus of responsibility from the moment of *deployment* (designers) or *execution* (nurses) to the moment of *consolidation* (the Committee). It defends against the gap by ensuring that no emergent policy becomes active without a human agent explicitly endorsing the *aggregate* result of the micro-decisions.

  ### Evaluation: Closing or Renaming?

  CAA ultimately **renames the gap** rather than closing it, though it makes the gap legally actionable.

  Philosophically, the epistemic problem remains. The Ethics Committee signing off on the new weights faces the same knowledge deficit as the nurses: they can see the *current* weights, but they cannot fully predict how these new weights will interact with future cases to produce harm. They are ratifying a static snapshot of a dynamic process. By requiring a signature, CAA converts a *metaphysical* responsibility gap (no one is responsible) into a *procedural* negligence gap (the Committee was responsible for checking). This is useful for litigation—we can now sue the Committee—but it does not solve the underlying issue that human agents are being asked to take responsibility for emergent properties they cannot fully comprehend. It creates a "responsible party" where there was none, but it does not guarantee that the party is actually capable of exercising the moral control required to prevent the harm. It patches the legal liability vacuum without filling the epistemic void.
