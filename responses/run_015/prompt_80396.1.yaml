answer: |-
  ### 1. Essay Question

  **Time Allowed:** 75 Minutes
  **Topic:** The Grounds of Promissory Obligation

  **The Case of the Unreliable Promiser**
  Consider an agent, *Al*, who has a stable, well-known character trait: he sincerely promises to do almost anything he is asked but keeps only a small fraction of these promises. Everyone in his community, including his interlocutor *Bea*, knows this about him. Nevertheless, when asked, Al makes promises sincerely and intends to be bound by them.

  **Part (a)**
  In the **Base Case**, Bea knows Al's track record. She does not expect Al to perform and makes no changes to her plans in reliance on his promise. Does Al incur a moral obligation to perform? Contrast the predictions of a **Voluntarist (Obligationist)** account (which grounds obligation in the act of willing) against a **Reliance-Based** account (which grounds obligation in the prevention of harm or disappointed expectations).

  **Part (b)**
  In the **Variant Case**, Bea, fully aware of Al's unreliability, nonetheless takes a risk: she cancels other plans and commits resources relying on Al's promise. How do the predictions of the two accounts change compared to the Base Case? Does the difference in outcome between the Base and Variant cases track a genuine moral distinction, or does it reveal a structural flaw in one of the theories? Defend your verdict.

  ***

  ### 2. Model Answer

  The case of the Unreliable Promiser tests whether promissory obligation derives from the promisor's exercise of will or the promisee's resulting vulnerability. A defensible account must explain why the moral landscape shifts (or fails to shift) when reliance is introduced against a backdrop of known unreliability.

  In the **Base Case** (no reliance), the two accounts diverge sharply. The Voluntarist argues that Al is obligated. By invoking the convention of promising with the intention to be bound, Al has exercised his normative power to create a duty, regardless of Bea's expectations. The obligation is a product of his agency, not her reaction. Conversely, the Reliance-Based account predicts little to no obligation. Since Bea expects non-performance and alters no plans, she suffers no detriment and holds no disappointed expectation. For the reliance theorist, a promise without reliance is merely a statement of intention; without induced dependency, there is no moral harm in breaking it.

  In the **Variant Case** (reliance despite knowledge), the predictions shift asymmetrically. For the Voluntarist, Al's obligation remains constant. The moral bond was sealed at the moment of the promise; Bea's prudence or imprudence in relying does not alter Al's duty to keep his word. For the Reliance theorist, however, Al's obligation spikes significantly. Because Bea has now incurred a cost based on Al's assurance, breaking the promise causes tangible harm. The duty to perform arises not from the promise itself, but from the necessity of repairing the damage caused by the induced reliance.

  This divergence reveals a structural flaw in the Reliance account. If we accept the Reliance prediction, Al's moral duty depends entirely on Bea's gambling behavior. In the Base Case, Al is free to break his word with impunity; in the Variant, he is strictly bound. This implies that a promisor's obligation is contingent on the promisee's risk-assessment rather than the promisor's own commitment. This is counterintuitive: it suggests Al treats Bea merely as a means to an end in the Variant, but in the Base Case, it suggests his word carries no weight simply because she didn't bet on it. It makes the morality of lying or breaking faith dependent on the victim's skepticism.

  However, the Voluntarist view also faces a challenge regarding communicative success. If Bea knows Al is unreliable, has a genuine assurance actually been communicated? Some might argue the promise is "void" due to mutual understanding that it will likely be broken. Yet, treating it as void undermines the institution of promising. If Al intends to be bound, he is attempting to participate in the moral practice. To say he incurs no obligation because Bea is cynical rewards her cynicism and excuses his habitual failing.

  **Verdict:** The difference between the cases does not track a genuine moral difference regarding Al's duty to perform; it tracks a difference in *harm*. Al is obligated in both cases because he invoked a normative practice with the intent to bind himself. The Reliance account fails because it conflates the *reason* for the obligation (the promise) with the *consequences* of breaking it (harm). While Bea's reliance increases the *badness* of Al's breach, it should not determine the *existence* of the breach. Therefore, the Voluntarist prediction is superior: Al is obligated in both cases, though the moral cost of his failure is higher in the Variant. The Reliance theory mistakenly makes the existence of a duty contingent on the promisee's vulnerability rather than the promisor's fidelity.

  ***

  ### 3. Marking Scheme (Total: 20 Marks)

  **A Range (17–20 Marks): Excellent / Distinction**
  *   **Application (6 marks):** Correctly applies Voluntarist and Reliance views to *both* the Base and Variant cases. Explicitly notes that Voluntarism predicts constant obligation while Reliance predicts variable obligation.
  *   **Critical Analysis (6 marks):** Identifies the specific theoretical tension: Reliance makes obligation contingent on the promisee's behavior (the "gamble" problem), while Voluntarism must explain how a promise functions when assurance is unlikely to be believed.
  *   **Verdict (5 marks):** Offers a reasoned verdict that distinguishes between the *existence* of an obligation and the *harm* caused by breaking it. Defends why one theory handles the "known unreliability" factor better.
  *   **Clarity & Structure (3 marks):** Argument is concise, follows the (a)/(b) structure, and stays within the scope of the prompt.

  **B Range (14–16 Marks): Good / Pass**
  *   **Application (4 marks):** Applies views to the cases but may be vague on *why* the Reliance view changes its prediction in the Variant.
  *   **Critical Analysis (4 marks):** Identifies a problem (e.g., "Reliance seems unfair") but does not fully articulate the structural flaw (contingency of duty).
  *   **Verdict (4 marks):** Reaches a conclusion but relies on assertion ("Voluntarism is better") rather than argument.
  *   **Clarity & Structure (2 marks):** Generally clear but may spend too much space defining theories rather than applying them.

  **C Range (11–13 Marks): Adequate**
  *   **Application (2 marks):** Recites the definitions of the views but struggles to apply them to the specific facts of the Unreliable Promiser.
  *   **Critical Analysis (2 marks):** Fails to distinguish the moral difference between the Base and Variant cases.
  *   **Verdict (2 marks):** No clear verdict or contradictory conclusion.

  **Specific Deductions & Mistakes**
  *   **Recitation Penalty (-3 marks):** Defining Voluntarism/Reliance without applying them to Al and Bea's specific situation.
  *   **Legal/ Moral Confusion (-3 marks):** Invoking legal doctrines (e.g., "promissory estoppel," "consideration," "void contract") as if they settle the *moral* question.
  *   **Case Conflation (-2 marks):** Failing to distinguish the Base Case (no reliance) from the Variant Case (reliance) in the analysis.
  *   **The "Void" Error (-2 marks):** Dismissing the Base Case by claiming the promise is "void" or "not a real promise" without arguing why the normative power failed to trigger.
  *   **Ignoring the "Known" Factor (-2 marks):** Failing to address how the *common knowledge* of Al's unreliability impacts the communicative aspect of the promise.
