answer: |-
  ### Historiography Correction
  Your recollection is functionally correct for your purposes. Herodotus did record rival accounts (*logoi*), often without adjudicating between them, prioritizing the preservation of the story over the truth of the event. Thucydides was more critical: he explicitly rejected the first story heard, cross-examined witnesses, acknowledged memory decay and bias, and admitted his speeches were reconstructions of the "general sense" rather than transcripts. You are applying Thucydidean skepticism to Herodotean data. Proceed.

  ---

  ### The Procedure: Incident Source Criticism
  **Scope:** Applies to both Triage (20 mins) and Post-Mortem Timeline (Hours).
  **Constraint:** If a test cannot be completed in Triage, default to the "Safe Failure" state listed below.

  #### 1. The Tagging Protocol (Evidential Status)
  Prepend every line of your draft timeline with a single-letter code. This forces you to admit what you are looking at.
  *   **[O] Observation:** Machine telemetry, logs, raw metrics. (Note: Instrumentation is a witness, not truth).
  *   **[W] Witness:** First-person human account ("I restarted the service," "I saw the error").
  *   **[H] Hearsay:** Report of a report (Support notes, Slack forwards, Vendor summaries).
  *   **[I] Inference:** Your connective logic ("Therefore the database locked").
  *   **[T] Template:** Boilerplate required by the house style (e.g., "Impact: 500 users").

  **Failure Mode:** Over-trusting [O]. Telemetry is often a lie of omission (sampling) or commission (buggy instrumentation).
  **Triage Default:** If you cannot tag it, treat it as **[H]**.
  **Revision to your Item 1:** Do not hide [I] and [T]. If 40% of your timeline is [I], the document must visually reflect that uncertainty.

  #### 2. The Contamination Test (Common Ancestry)
  Before counting two reports as confirmation, scan for **Unique String Matching**.
  *   **Question:** Do Report A and Report B share a specific error code, timestamp, or phrasing that is not standard boilerplate?
  *   **Sufficient Answer:** No shared unique strings = Independent. Shared unique strings = Contaminated (count as 1 source).
  *   **Unavailable:** In Triage, assume contamination if reports arrive within a window shorter than human reaction time (e.g., two emails within 2 minutes).
  *   **Failure Mode:** Under-trusting genuine cascading failures where multiple systems emit the same standard error.
  *   **Revision to your Item 2:** "Two reports" is not confirmation. "Two reports with different phrasing/paths" is confirmation.

  #### 3. The Incentive Weight (Interest & Embarrassment)
  Weigh the claim based on who pays the cost.
  *   **Question:** Does accepting this claim as true increase the reporter's workload, blame, or cost?
  *   **Sufficient Answer:**
      *   **Self-Blame ([W] admitting fault):** High Credibility (but verify for "false humility" to close ticket).
      *   **External-Blame ([W] blaming vendor/other team):** Low Credibility (requires [O] backup).
      *   **Vendor RCA:** Low Credibility (Incentive is to close support case, not find truth).
  *   **Unavailable:** Assume External-Blame is unproven.
  *   **Failure Mode:** Cynicism. Sometimes a team actually owns their bug. Do not discard self-blame; verify it.
  *   **Revision to your Item 3:** Do not discount self-blame. Discount *convenient* blame. If the "tidy single cause" fits the template perfectly, flag it as [I] until proven.

  #### 4. Access vs. Inference (The "Therefore" Split)
  Split any sentence containing causal language.
  *   **Question:** Does the sentence contain "because," "due to," "caused," or "so"?
  *   **Sufficient Answer:** Split the sentence. The clause before the conjunction is Access ([O] or [W]). The clause after is Inference ([I]).
  *   **Unavailable:** In Triage, treat the whole sentence as [H].
  *   **Failure Mode:** Over-trusting "Confident Inference." A senior engineer with great access ([W]) often states inference as fact.
  *   **Revision to your Item 4:** Even if Access is High, if the statement is causal, it is Inference. Mark it [I].

  #### 5. Genre Filtering (Furniture vs. Evidence)
  Identify the document type to know what to ignore.
  *   **Question:** What is the primary audience of this document?
  *   **Sufficient Answer:**
      *   **Changelog/Runbook:** Evidence ([O]/[W]). Written for system accuracy.
      *   **Vendor RCA:** Furniture ([T]). Written for legal/contractual closure. Extract logs only; ignore narrative.
      *   **Support Note:** Hearsay ([H]). Written for ticket closure. Extract customer quotes only.
      *   **Executive Summary:** Furniture ([T]). Written for reassurance.
  *   **Unavailable:** Treat all narrative as [I].
  *   **Failure Mode:** Discarding a Vendor RCA that actually contains a specific log snippet buried in the fluff.
  *   **Revision to your Item 5:** Extract data from Furniture, discard the narrative.

  #### 6. The Reconstruction Marking (Thucydides Convention)
  You must distinguish fact from narrative flow.
  *   **Question:** Is this sentence an attested fact or a bridge?
  *   **Sufficient Answer:** Attested facts = Normal text. Bridges/Inferences = *Italics*.
  *   **Unavailable:** If you cannot verify a link, write "[Gap]" explicitly.
  *   **Failure Mode:** Executives skim and miss the italics, treating inference as fact.
  *   **Revision to your Item 6:** Yes, keep the convention even if ugly. It protects you from liability when the inference is later proven wrong. If Execs skim, that is their risk, but the record must be honest. Add a "Confidence: High/Medium/Low" header to the document to alert skimmers.

  ---

  ### Case Runs

  #### Case (a): 3 A.M. The Flat Line
  **Inputs:**
  1.  Customer Report 1 (Shared Channel) -> `[W]`
  2.  Dashboard Flat Line (Service redeployed 1hr ago) -> `[O]` (Suspect)
  3.  Customer Report 2 (40m later) -> `[H]` (Support admitted reading Report 1)
  4.  Triage Window: 20 mins (Report 2 arrives outside window, but logic applies).

  **Procedure Execution:**
  1.  **Tagging:** Report 1 is `[W]`. Dashboard is `[O]`. Report 2 is `[H]` (Contaminated by Report 1).
  2.  **Contamination:** Report 2 shares the "symptom" description but Support admitted reading Report 1. Count as 1 source.
  3.  **Access:** Dashboard `[O]` is suspect because service was redeployed (instrumentation might be stale or broken). Report 1 `[W]` is high access (user experiencing pain).
  4.  **Incentive:** Customer has no incentive to lie about outage.
  5.  **Decision:** You have 1 `[W]` and 1 suspect `[O]`.
  6.  **Reconstruction:** Timeline entry: "*3:00 AM: Customer reports latency. Dashboard shows flatline (service redeployed 2:00 AM).*"

  **Verdict:** **PAGE.**
  **Reasoning:** Procedure overrides Gut. Gut says "Wait for confirmation." Procedure says "One `[W]` + One `[O]` (even suspect) = Valid Signal." In Triage, False Positive cost (waking engineer) < False Negative cost (SLA breach). The contamination of Report 2 is irrelevant to the paging decision, only to the severity assessment.

  #### Case (b): The Vendor RCA vs. Coarse Telemetry
  **Inputs:**
  1.  Vendor RCA (6 weeks later) -> `[H]` (Genre: Vendor RCA). Claims "Your Component X triggered."
  2.  Internal Telemetry -> `[O]`. Contradicts Vendor. Granularity: 1-minute.
  3.  Vendor Engineers -> `[W]` (On call in real-time).

  **Procedure Execution:**
  1.  **Tagging:** Vendor RCA narrative is `[H]`. Vendor Engineer *observations* cited in RCA are `[W]`. Internal Telemetry is `[O]`.
  2.  **Genre:** Vendor RCA is Furniture. Ignore their conclusion. Look for their data.
  3.  **Access vs. Inference:** Vendor engineers had Real-Time Access (`[W]`). Internal Telemetry has High Access but Low Resolution (`[O]`).
  4.  **Contamination:** N/A.
  5.  **Incentive:** Vendor wants to close case. But their engineers were on the call.
  6.  **Reconstruction:** "Vendor logs indicate spike at 14:02:15. Internal telemetry shows normal load at 14:02:00 and 14:03:00. *Gap: 15 seconds unobserved by internal tools.*"

  **Verdict:** **Trust Vendor Timing, Verify Component.**
  **Reasoning:** 1-minute sampling `[O]` creates a blind spot. Real-time human witness `[W]` fills the gap. The timeline must record the conflict. Do not accept "Component X triggered" as fact. Record "Component X activity coincided with blind spot in internal telemetry."

  #### Case (c): The Senior Engineer's Memory
  **Inputs:**
  1.  Senior Engineer Recollection (5 weeks later) -> `[W]` (Memory degraded).
  2.  No Logs -> `[O]` Missing.
  3.  Team Consensus -> `[H]` (Social pressure).

  **Procedure Execution:**
  1.  **Tagging:** Recollection is `[W]`. Consensus is `[H]`. Cause is `[I]`.
  2.  **Access:** Access was High *then*, Low *now*. Memory decay is a factor.
  3.  **Incentive:** Team wants closure. "Tidy single cause" pressure is High.
  4.  **Contamination:** Team nodding along is contamination (shared social source).
  5.  **Reconstruction:** "Root Cause: Undetermined. Senior on-call recalls configuration drift, but no logs survive to verify. *Inference: Team consensus accepts configuration drift as probable cause.*"

  **Verdict:** **Document as Unestablished.**
  **Reasoning:** Procedure demands evidence, not consensus.
  **Executive Language:** "Root cause could not be verified by surviving data. Mitigation focuses on preventing recurrence of the *symptom* rather than the specific *cause*." (This survives executive read because it focuses on risk reduction, not blame).

  ---

  ### Limits & Failure Modes

  **Load-Bearing Items:**
  *   **Item 1 (Tagging):** Critical. Without `[I]` vs `[O]`, you lie to yourself.
  *   **Item 2 (Contamination):** Critical. Prevents "echo chamber" confidence.
  *   **Item 4 (Access/Inference):** Critical. Prevents causal speculation from hardening into fact.

  **Academic / Low Yield:**
  *   **Item 5 (Genre):** Nuanced. In a 20-minute triage, you won't have time to analyze document conventions. Use the heuristic: "If it was written for lawyers/support, trust data only, not words."
  *   **Item 6 (Reconstruction Marking):** High friction. Executives *will* ignore italics.
      *   *Mitigation:* Add a "Confidence Score" (High/Med/Low) at the top of the document. If Low, the italics matter less because the header warned them.

  **The "Confident Wrong" Failure Mode:**
  The procedure will fail when **[O] (Telemetry) is systematically lying**.
  *   *Scenario:* Your monitoring agent bugs out and reports "Healthy" during an outage.
  *   *Procedure Response:* Tags it `[O]`. Weighs it high.
  *   *Correction:* You must add a meta-rule: "If `[W]` (Human) contradicts `[O]` (Machine) during an outage, assume `[O]` is broken." This is the only time Human > Machine.

  **Judgment Calls Dressed as Procedure:**
  1.  **Unique String Definition (Item 2):** Deciding if "Error 500" is unique enough to count as contamination. (Judgment: No. "Error 500 on PaymentService" is unique enough).
  2.  **Safe Inference (Item 6):** Deciding when an `[I]` is safe enough to not italicize. (Judgment: Never. Always italicize connective tissue).
  3.  **Triage Paging (Case A):** The procedure says Page, but if you know the dashboard is broken, you might not. (Judgment: The procedure is the floor, not the ceiling. If you know the tool is broken, ignore the `[O]` tag).

  **Final Constraint:**
  This procedure does not find truth. It finds **accountable uncertainty**. It ensures that when you are wrong, you are wrong explicitly, not implicitly.
