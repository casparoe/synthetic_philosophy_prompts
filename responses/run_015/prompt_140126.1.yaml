  # Diagnostic Instrument: The Karma of Moral Desert

  ### Seed Commitment
  *Read this aloud before beginning. If you reject this statement, this instrument cannot map your view.*
  > "A wrongful act leaves a remainder that has to be answered for, and the answering should fall on the agent rather than on whoever happens to be nearest."

  ---

  ### The Decision Tree
  *Answer each node by selecting the option that best matches your intuition about the case provided. Do not consider which view sounds more noble; select the one you believe is true.*

  **Node 1: The Trigger (Intention vs. Consequence)**
  *Case:* Consider two agents. **Agent A** acts from a wholly benevolent motive but foreseeably causes great suffering. **Agent B** causes great suffering through an act that was, at the time, neither careless nor wrongful (a pure accident).
  *Choice:* In which case is a moral remainder generated?
  *   **(L)** In Neither (Remainder requires bad intention).
  *   **(R)** In Both (Remainder requires only causal responsibility for harm).

  **Node 2: The Nature (Quantity vs. Quality)**
  *Case:* An agent tells one lie to save a life. Later, the same agent tells ten lies to save ten lives.
  *Choice:* How does the remainder accumulate?
  *   **(L)** Quantitatively (Ten lies create ten times the burden, like a debt).
  *   **(R)** Qualitatively (The agent becomes a "liar"; the burden is a stain on character, not a sum).

  **Node 3: The Justification (Desert vs. Reform)**
  *Case:* An agent bears a subsequent condition far worse than any proportionality between act and consequence would license (e.g., minor theft leads to ruinous loss).
  *Choice:* Is this excessive fruit justified?
  *   **(L)** No (Desert sets a ceiling; suffering beyond proportion is unjust).
  *   **(R)** Yes (If it brings about reform, restraint, or reassures the community, the cost is justified).

  **Node 4: The Transfer (Personal vs. Shared)**
  *Case:* A third party knowingly volunteers to carry someone else's remainder (e.g., accepts the punishment or karmic burden).
  *Choice:* Is the original agent's remainder discharged?
  *   **(L)** No (The burden sticks to the will that acted; it cannot be transferred).
  *   **(R)** Yes (The burden is a debt that can be paid by any sufficient proxy).

  **Node 5: The Identity (Continuity vs. Discontinuity)**
  *Case:* An agent, between the time of the act and the time the fruit matures, ceases to share any of the desires, values, or character of the person who acted (radical psychological conversion).
  *Choice:* Does the fruit still mature on this agent?
  *   **(L)** No (Without psychological continuity, there is no one to bear the desert).
  *   **(R)** Yes (Biological or narrative continuity is sufficient for desert).

  **Node 6: The Enforcement (Fittingness vs. License)**
  *Case:* An observer sees that an agent is due to suffer a remainder.
  *Choice:* What is the observer's standing?
  *   **(L)** Fittingness Only (It is fitting that they suffer, but no one is licensed to exact it).
  *   **(R)** License (The desert creates a permission or duty for others to impose the fruit).

  **Node 7 (Optional): The Clearance (Ethical vs. Soteriological)**
  *Case:* An agent fully realizes the true nature of reality (achieves liberating knowledge) but has not yet suffered the fruit of past acts.
  *Choice:* Does the remainder persist?
  *   **(L)** Yes (Knowledge does not erase ethical debt).
  *   **(R)** No (Knowledge burns off the remainder like fire burns cotton).
  *   *Justification for inclusion:* This node distinguishes purely ethical theories from those where metaphysics overrides morality, a critical fault line in South Asian discourse often missed in Western desert theories.

  ---

  ### Logic of Pruning (Entailments)
  *Not all answer combinations are coherent. The following entailments prune the theoretical 128 branches down to the occupied leaves below.*

  1.  **Node 1 (Right) $\rightarrow$ Node 3 (Right):** If remainders are triggered by consequences alone (Node 1-R), it is incoherent to claim desert sets a strict proportionality ceiling (Node 3-L). Consequence-based views almost invariably justify fruit by future good (reform/utility).
  2.  **Node 2 (Right) $\rightarrow$ Node 4 (Left):** If the remainder is a qualitative stain on character (Node 2-R), it cannot be transferred to a third party (Node 4-R). You cannot transfer a character trait.
  3.  **Node 3 (Left) $\rightarrow$ Node 6 (Left):** If desert sets a strict ceiling (Node 3-L), it is a matter of cosmic fittingness. Licensing others to exact it (Node 6-R) risks exceeding that ceiling through human error or vengeance.
  4.  **Node 5 (Left) $\rightarrow$ Node 4 (Left):** If psychological continuity is required for desert (Node 5-L), transfer is moot; if the *original* agent doesn't bear it due to change, a *different* agent certainly cannot.

  ---

  ### Occupied Positions (Leaves)
  *The following 7 leaves represent the coherent philosophical positions available in this space. Historical attributions are rough placements only.*

  **Leaf 1: The Strict Retributivist**
  *   **Path:** 1L (Intention), 2L (Quantity), 3L (Desert), 4L (Personal), 5R (Continuity), 6L (Fittingness), 7L (No Clearance).
  *   **Characterization:** Wrongdoing creates a quantifiable debt owed by the specific individual, bounded by proportionality, which the universe balances without requiring human enforcement.
  *   **Awkward Commitment:** Must accept that a repentant agent who has changed (Node 5) still suffers, provided they are biologically continuous.
  *   *(Rough placement: Nyāya-Vaiśeṣika / Kantian Legalism)*

  **Leaf 2: The Character Consequentialist**
  *   **Path:** 1L (Intention), 2R (Quality), 3R (Reform), 4L (Personal), 5R (Continuity), 6R (License), 7L (No Clearance).
  *   **Characterization:** Wrongdoing alters the agent's disposition, and suffering is licensed to correct that disposition for the sake of future social good.
  *   **Awkward Commitment:** Must license punishing an agent even if they have already reformed, if doing so reassures the community (Node 3-R).
  *   *(Rough placement: Modern Utilitarianism / Some Dharmasāstra)*

  **Leaf 3: The Vicarious Atonement Theorist**
  *   **Path:** 1L (Intention), 2L (Quantity), 3L (Desert), 4R (Transfer), 5R (Continuity), 6R (License), 7L (No Clearance).
  *   **Characterization:** Moral debt is quantitative and personal to the will, but can be paid by a proxy if the proxy voluntarily assumes the burden.
  *   **Awkward Commitment:** Must explain why the original agent is "cleared" if they did not personally undergo the reformative suffering.
  *   *(Rough placement: Christian Soteriology / Mahāyāna Bodhisattva Vows)*

  **Leaf 4: The Psychological Continuity Theorist**
  *   **Path:** 1L (Intention), 2R (Quality), 3L (Desert), 4L (Personal), 5L (Discontinuity), 6L (Fittingness), 7L (No Clearance).
  *   **Characterization:** Desert attaches to the psychological person, not the body; if the person ceases to exist through radical change, the debt vanishes.
  *   **Awkward Commitment:** Allows an agent to escape severe consequences simply by undergoing a radical personality shift or memory loss.
  *   *(Rough placement: Parfitian Reductionism / Some Sautrāntika)*

  **Leaf 5: The Strict Liability Naturalist**
  *   **Path:** 1R (Consequence), 2L (Quantity), 3R (Reform), 4L (Personal), 5R (Continuity), 6L (Fittingness), 7L (No Clearance).
  *   **Characterization:** Harm generates a remainder regardless of intent; the burden is a debt paid through suffering that serves to balance the causal scales.
  *   **Awkward Commitment:** Must treat the benevolent doctor (Node 1) the same as the malicious murderer if the outcome is identical.
  *   *(Rough placement: Mīmāṃsā Ritualism / Strict Liability Law)*

  **Leaf 6: The Gnostic Liberationist**
  *   **Path:** 1L (Intention), 2R (Quality), 3L (Desert), 4L (Personal), 5R (Continuity), 6L (Fittingness), 7R (Clearance).
  *   **Characterization:** The remainder is a qualitative stain of ignorance that is dissolved not by suffering, but by correct knowledge of reality.
  *   **Awkward Commitment:** Implies that ethical debt can be erased intellectually without ethical restitution or suffering.
  *   *(Rough placement: Advaita Vedānta / Gnosticism)*

  **Leaf 7: The Communal Enforcement Theorist**
  *   **Path:** 1L (Intention), 2L (Quantity), 3L (Desert), 4L (Personal), 5R (Continuity), 6R (License), 7L (No Clearance).
  *   **Characterization:** The debt is personal and proportional, but the community is licensed to act as the collecting agent of the moral order.
  *   **Awkward Commitment:** Risks conflating moral desert with social vengeance, potentially exceeding the proportional ceiling in practice.
  *   *(Rough placement: Confucian Rectification / Some Sunni Kalām)*

  ---

  ### Unoccupied Combinations
  *Combinations permitted by the questions but devoid of defenders.*

  1.  **Consequence + Quality + Transferable (1R, 2R, 4R):** *Incoherent.* If the remainder is triggered merely by causal harm (1R), it is an objective debt, not a character stain (2R). If it is not a character stain, it is transferable, but then it contradicts the "Quality" branch which implies non-fungibility.
  2.  **Desert + Disproportionate Fruit (3L + Case 5 "Yes"):** *Incoherent.* By definition, "Desert" (Node 3-L) implies a limit based on what is owed. Accepting disproportionate fruit for the sake of reform contradicts the definition of Desert provided in the Seed.
  3.  **Quality + Transferable (2R, 4R):** *Unattractive.* While logically possible (a "stain" that can be washed by another), no major theory holds that character alteration can be outsourced without the agent's own psychological change.

  ---

  ### Indistinguishable Leaves
  *The tree cannot separate the following two views; they arrive at the same leaf (Leaf 4) via different metaphysical routes.*

  1.  **The Psychological Reductionist:** Believes the "self" is just a bundle of desires/memory. If the bundle changes (Node 5), the debtor no longer exists.
  2.  **The Nihilist about Self:** Believes there is no self at all. Therefore, there is no one to bear the fruit (Node 5).
  *Reason:* Both answer "No" to Node 5. The instrument tests *commitments about cases*, not *metaphysical explanations* for those commitments.

  ---

  ### Analysis: The Most Sorting Node
  **Node 3 (The Justification)** does the most sorting work for this specific seminar.

  *   **Why:** The seminar defines karma explicitly as "moral desert... borne because it is owed rather than merely because bearing it does some good." Node 1 (Trigger) sorts folk intuitions about blame, and Node 5 (Identity) sorts metaphysical commitments. However, Node 3 is the only node that tests the *core thesis of the seminar*. A student who answers Node 3-Right (Reform/Utility) is effectively rejecting the seminar's working definition of karma as desert, regardless of what they answer on intention or identity. This node separates those studying *retributive moral mechanics* from those studying *social engineering via suffering*, which is the primary theoretical fault line in the room.
