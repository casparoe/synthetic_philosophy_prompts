answer: |-
  **The Ventriloquist's Body: Popular Will and Performative Sovereignty in *Julius Caesar***

  The philosophical problem of populism often centers on a paradox of authorization: the leader claims to be the mere instrument of a pre-existing "will of the people," yet without the leader's rhetoric, that will remains politically inert. If the rhetoric is necessary to activate the will, is the leader a messenger or an author? This tension between descriptive reality (what the people want) and normative construction (what they are told to want) finds a brutal staging ground in Shakespeare's *Julius Caesar*. Specifically, the forum scenes following Caesar's assassination do not merely illustrate this dynamic; they dismantle the coherence of "the people" as a sovereign entity. Through the contrasting performances of Brutus and Antony, Shakespeare suggests that the "will of the people" is not a discovered truth but a theatrical effect, yet the play simultaneously resists the notion that this will is entirely subject to the ventriloquist's control.

  Brutus's failure in Act 3, Scene 2 stems from a category error regarding the nature of the crowd. He addresses the Plebeians as normative republican citizens, assuming a pre-existing rational consensus regarding liberty and tyranny. His speech is in prose, structured by logic ("Not that I loved Caesar less, but that I loved Rome more"), and he demands silence so that reason may be heard. Brutus operates on the assumption that the "will of the people" is an independent variable that he can simply align with his actions. He treats the crowd as a jury that needs evidence, not a body that needs activation. When the citizens cry, "Let him be Caesar," they are not expressing a deep philosophical commitment to republicanism; they are reacting to the immediate performance of honor. Brutus treats the will as descriptive and static, failing to recognize that in the vacuum of power, the popular will is fluid and requires performative naming to coalesce. He believes he is reporting the news of liberty; the crowd hears only the noise of regicide.

  Antony, conversely, understands that the will must be constructed. He does not discover the crowd's desire for vengeance; he manufactures it through the mechanics of ventriloquism. He claims to speak only to bury Caesar, not to praise him, positioning himself as a reluctant messenger. Yet, every rhetorical device—the ironic repetition of "honorable men," the display of the mutilated body, the reading of the will—is designed to generate affect where none previously existed. Antony's soliloquy following the scene ("Mischief, thou art afoot") confirms that he views the crowd not as a sovereign body but as raw material ("dogs") to be unleashed. Here, the play validates the critique of populism: the leader is the author. The "will" that emerges—a demand for blood and fire—is contingent upon Antony's ability to merge his own political objectives with the crowd's latent grief and greed. He does not channel a pre-existing unity; he forges a temporary, volatile unity through shared emotion.

  However, to reduce the play to a simple confirmation of the ventriloquism thesis is to ignore where the drama resists the theory. While Antony constructs the initial impulse, he does not control the outcome. The mob's violence spirals beyond his specific instructions. In the murder of Cinna the Poet, the crowd acts on a misunderstanding, killing an innocent man because they dislike his verses. This moment complicates the philosophical tension by suggesting that once the "will of the people" is performatively invoked, it becomes uncontrollable even by its author. The crowd is not a passive dummy for the ventriloquist; it is a chaotic force that consumes the distinction between author and messenger. The play suggests that the "will" is not only constructed but inherently incoherent. It is not a stable entity waiting to be found, nor is it a precise tool for the leader; it is a chaotic energy that renders stable sovereignty impossible.

  This is where the literary dimension adds crucial insight to the abstract philosophical debate. Political philosophy often treats "the people" as a conceptual unity, debating whether their will is representable. *Julius Caesar* forces us to confront the sensory and emotional reality of collective decision-making. The philosophy of popular sovereignty often neglects the role of the body—the bloodied corpse, the tone of voice, the physical proximity of the speaker. Shakespeare demonstrates that the "will" is not formed in the mind but in the gut. The transition from rational assent to violent mobbing is not a corruption of the will but the mechanism of its formation. The play argues that affect is not incidental to politics; it is constitutive. Without the emotional performance, there is no "people," only a multitude.

  Ultimately, *Julius Caesar* undermines the coherence of "the will of the people" more thoroughly than philosophical argument alone can. It reveals the concept as a retroactive justification for power. Brutus fails because he believes the will exists independently of performance; Antony succeeds temporarily because he knows he must write the script. Yet the play's tragic conclusion—the descent into civil war—suggests that a will constructed through ventriloquism cannot sustain a polity. The "people" invoked in the forum are too unstable to govern themselves or be governed. Shakespeare leaves us with a disturbing proposition: the "will of the people" is a necessary fiction for political legitimacy, but treating it as a coherent reality is a dangerous delusion that invites tyranny or chaos. The ventriloquist may speak for the dummy, but in the end, the dummy strangles the ventriloquist.

