          *   Horse 2 (Randomization): Tractable, high leverage, but needs careful framing to stay epistemic.
          *   Horse 3 (Iterated/Order): Crowded/Technical. Low philosophical ROI.
      *   *The Proposed Agenda (Ranked):*
          *   **Project 1: Disagreement as Higher-Order Evidence of Underdetermination.** (Refining Horse 1). Focus on the *structure* of the evidence space, not just the agents.
          *   **Project 2: Epistemic Policies vs. Epistemic Acts in High-Stakes Binary Choice.** (Refining Horse 2). Focus on the *rule* you follow over time, not the single update.
          *   **Project 3 (Fallback/Integration): Dynamic Peerhood.** (Addressing the "peer is contested" point).
      *   *Why this order?* Project 1 is the foundational metaphysics/epistemology. Project 2 is the decision-theoretic application. Project 3 is too technical/risky as a main focus.
