answer: |-
  **Scenario**

  Elena is a quality control technician on a pharmaceutical bottling line. Proposition $P$: "The filling nozzle is calibrated to 500ml." A sensor log records a deviation of 498ml on unit #405 (Datum $D$). **Stage 1 (Production):** Elena is dispensing medication. Protocol dictates $P$ is assumed true to maintain flow; $D$ is categorized as "fluid splash" (noise) and ignored. Questioning $P$ halts production and is prohibited without shift-end authorization. **Stage 2 (Audit):** Elena is performing the mandatory shift-end verification. Protocol dictates $P$ is the object of inquiry; the same log entry $D$ is now categorized as "calibration drift" (evidence) and recorded as a failure. No new physical data is acquired between stages; the log exists in both. Her confidence in the machinery generally is unchanged; only the operational mode shifts.

  **Demonstration**

  **Proposition $P$:** "The filling nozzle is calibrated to 500ml."
  **Fixed Variables:** The total body of evidence (the sensor log containing $D$), the subject's general confidence in the machinery, and the semantic content of $P$.
  **Single Variable:** The operational protocol (the constitutive rules governing whether $P$ functions as a rule of the practice or a move within it).

  **Three Readings**

  **(i) The Commitment Reading (Hinges as non-beliefs):**
  *Stage 1:* $P$ is a constitutive rule of the production game. It lies outside the space of reasons. $D$ cannot count as evidence against $P$ because $P$ defines what counts as valid data (i.e., anything deviating is noise). Neither knowledge nor doubt arises.
  *Stage 2:* The game changes to verification. $P$ becomes a move within the game. $D$ now counts as evidence.
  *Verdict:* Stage 1 is non-epistemic; Stage 2 is epistemic.

  **(ii) The Entitlement Reading (Hinges as non-evidential beliefs):**
  *Stage 1:* $P$ is a belief, but Elena is entitled to hold it without evidence. $D$ is epistemically inert regarding $P$ because $P$ is the framework enabling evaluation of other claims (e.g., "this bottle is underfilled").
  *Stage 2:* Entitlement expires. $P$ requires evidential support. $D$ defeats $P$.
  *Verdict:* Stage 1 is justified without evidence; Stage 2 requires evidence.

  **(iii) The Empirical Reading (Hinges as high-confidence beliefs):**
  *Stage 1:* $P$ is an ordinary empirical belief with probability ~0.999. $D$ is weak counter-evidence, outweighed by the prior probability of calibration. Elena ignores $D$ because it is statistically negligible.
  *Stage 2:* $P$ is an ordinary empirical belief with lower prior probability. $D$ is strong counter-evidence.
  *Verdict:* Stage 1 and Stage 2 are epistemically identical in kind; only the weight of evidence shifts.

  **Convergence and Divergence**
  At **Stage 2**, all three readings converge: $P$ is an ordinary empirical claim subject to confirmation or refutation by $D$. The disagreement vanishes because the practice itself treats $P$ as empirical.
  At **Stage 1**, the readings diverge. Readings (i) and (ii) assert that $D$ *cannot* logically count against $P$ because $P$ sets the standards for counting. Reading (iii) asserts that $D$ *does* count against $P$, but is simply outweighed. This is the visible work: for (i) and (ii), $P$ is immune to $D$ in Stage 1; for (iii), $P$ is vulnerable but resilient.

  **The Feature Doing the Work**
  The single feature driving the transition is the **operational protocol**. It determines the logical grammar of $P$ without altering the physical data. The protocol dictates whether denying $P$ makes sense within the activity. In Stage 1, denying $P$ is a procedural violation (stopping the line); in Stage 2, denying $P$ is a successful outcome (finding a fault).

  **Removal of the Feature**
  If the protocol does not change—if Elena treats $P$ as empirical in Stage 1—then her dismissal of $D$ becomes **dogmatism or negligence**. She would be ignoring relevant evidence, making her criticizable. If the protocol does not change—if Elena treats $P$ as a hinge in Stage 2—then the audit is **sham verification**, and $D$ remains noise. Without the shift in rules, the case collapses into either irrational stubbornness (ignoring evidence when one shouldn't) or a standard case of acquiring new evidence (if the audit itself is seen as new data), failing to isolate the hinge status.

  **Strongest Skeptic Objection**
  The skeptic will argue that I have **equivocated on $P$**. In Stage 1, $P$ effectively means "Act as if the nozzle is calibrated," whereas in Stage 2, it means "The nozzle is calibrated." If the meaning changes, the epistemic status changes trivially. The skeptic claims the "hinge" is just a shorthand for a conditional imperative, not a distinct epistemic category.

  **Best Repair**
  The repair is to insist that the **semantic content is identical**. "The nozzle is calibrated" is a factual claim in both stages. What changes is not the meaning of the words, but the **conditions of intelligibility** for asserting them. In Stage 1, asserting $\neg P$ is not false; it is nonsensical within the production language-game. In Stage 2, asserting $\neg P$ is false or true. The objection fails because it conflates *use* with *meaning*. Wittgenstein's point is precisely that meaning is use; if the use changes from constitutive to descriptive, the epistemic status changes without semantic equivocation.

  **Honest Note**
  There is a residual vulnerability: the skeptic can still maintain that the "protocol" is just evidence about social norms. If Elena knows the protocol, she has evidence that "in Production mode, deviations are noise." This reduces the hinge to a belief about social rules. The repair holds only if one accepts that rule-following is not itself an evidence-based inference but a precondition for having evidence at all. If the seminar rejects that foundational claim, the case reverts to the reductionist view.
