  *   *Core:* Moral duties attach to acts only if there is a non-zero probabilistic causal pathway to a morally significant outcome (harm or benefit), OR if the act is a constitutive requirement of a essential cooperative scheme (Voting).
  *   *Nuance:* If multiple pathways exist (Harm vs. Good), maximize expected value. If Harm pathway is zero, and Good pathway exists, take the Good.

