  ### Stage 1: Brainstorming Candidate Principles

  To explain Dana's five prior verdicts, we need a principle that distinguishes between acts that are causally linked to outcomes (even probabilistically) and those that are structurally inert, while also accounting for the special status of civic participation.

  1.  **Expected Act Consequentialism (EAC):** Maximize expected value.
      *   *Fit:* Explains Cases 1 & 3 (Small $P \times$ Huge Harm > Convenience). Explains Cases 4 & 5 ( $P=0$, so neutral).
      *   *Strain:* Case 2 (Voting). Standard EAC usually yields "May skip" because $P(\text{tie})$ is vanishingly small compared to time cost. Dana's "Ought" suggests a non-consequentialist multiplier or a specific duty to participate in cooperative schemes.
  2.  **The Causal Contribution Principle (CCP):** You have a duty to avoid acts that are causal vectors for harm, and a duty to be causal vectors for good in essential collective schemes. If the causal chain is broken, you are free.
      *   *Fit:* Cases 1 & 3 (Vector intact via algorithms/schedules). Cases 4 & 5 (Vector broken: secondary market/overdetermined). Case 2 (Vector intact: vote tally; Scheme essential: democracy).
      *   *Strain:* Requires defining "Vector" precisely. Does secondary market trading *really* have zero causal influence? (Dana says yes).
  3.  **Fair-Share Participation (FSP):** Do your fair share of beneficial schemes; avoid your share of harmful ones.
      *   *Fit:* Cases 1, 2, 3 (Doing/avoiding share).
      *   *Strain:* Cases 4 & 5. FSP often implies a duty to sign the petition or divest even if overdetermined (to express solidarity). Dana's "May" suggests she rejects symbolic fairness in favor of causal efficacy.
  4.  **Rule Consequentialism (RC):** Follow rules that maximize good.
      *   *Fit:* "Don't buy chicken" is a good rule. "Vote" is a good rule.
