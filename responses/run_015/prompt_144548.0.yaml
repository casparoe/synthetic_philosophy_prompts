  *Reply:* I'm not arguing rights are tradable, but that policy choices inevitably cause deaths regardless. If we must choose a system, minimizing total rights-violations requires counting even if the metric is imperfect. This is a non-ideal theory argument.
  *Soft:* Conflates rights violations with welfare losses.
  *Concede:* Rights theory forbids this trade-off entirely; I'm arguing within a consequentialist frame.

  2. **Utilitarian:** "Wild deaths from harvest aren't additional. Density dependence means if you don't kill them, they starve or freeze weeks later."
  *Reply:* That assumes population equilibrium, but agriculture suppresses carrying capacity long-term, reducing total future lives lived. Even if immediate deaths are neutral, the sustained lower biomass is a net reduction in wild existence. The counterfactual is less land use, not status quo.
  *Soft:* Requires complex ecological modeling I don't have.
  *Concede:* Immediate harvest deaths might be neutral; rely on long-term habitat loss.

  3. **Conservation Biologist:** "Pasture isn't sterile. Grasslands support biodiversity; crop monocultures for chicken feed are the real killers."
  *Reply:* I agree pasture isn't wasteland, but beef requires vastly more land per calorie than chicken feed crops. Even high-quality pasture displaces more wild life per unit of protein than intensive cropping. The land-use efficiency gap is too large to bridge via biodiversity density alone.
  *Soft:* Assumes pasture displaces wilder land rather than being established land.
  *Concede:* Extensive grazing on non-arable land changes the calculus significantly.

  4. **Environmental Philosopher:** "Calculating wild welfare is hubris. We can't know if wild lives are net negative without imposing human values on ecological relations."
  *Reply:* We don't need perfect knowledge to acknowledge high probabilities of suffering from predation and starvation. Ignoring wild suffering because it's hard to measure doesn't make it vanish from the ethical equation. Uncertainty mandates caution, not indifference.
  *Soft:* Speculative on net negativity of wild lives.
  *Concede:* We lack consensus on wild life valence; treat it as a high-variance variable.

  5. **Utilitarian:** "Farmed chicken suffering is certain and intense. Wild field mouse suffering is speculative. Why gamble on uncertainty?"
  *Reply:* When the scale of potential wild harm is orders of magnitude larger, even low probability outweighs certain smaller harms. Expected value dictates we cannot ignore the large uncertain numbers. Risk aversion applies to the larger potential loss.
  *Soft:* Expected value theory is contested in high-stakes uncertainty.
  *Concede:* Prioritize reducing certain suffering if wild data remains purely theoretical.

  6. **Rights Theorist:** "Killing via harvester is agency; starvation is nature. You are responsible for the knife, not the winter."
  *Reply:* Economic demand drives the harvester's path just as much as the farmer's knife. If I fund the system that kills the mouse, I am causally responsible regardless of the mechanism. Complicity covers indirect harm.
  *Soft:* Distinction between doing and allowing remains intuitive.
  *Concede:* Direct killing carries heavier moral weight than indirect displacement.

  7. **FLAGGED: Hope Nobody Asks (Utilitarian):** "Give me the break-even point. How many field mice equal one broiler chicken's life?"
  *Reply:* I don't have a fixed exchange rate because welfare metrics aren't standardized across species. My point is precisely that without this number, the chicken-beef swap isn't settled math. Providing a false precision would be dishonest.
  *Soft:* Admitting ignorance undermines the quantitative argument.
  *Concede:* I cannot provide a specific ratio today; this is a call for research, not a final verdict.
