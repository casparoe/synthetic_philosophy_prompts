prompt: |-
  i've got a 20 min slot at the animal ethics reading group here next week and I'm defending something I'm not sure I believe yet, so I want to know where it gets hit before I walk in. For context I'm in ag econ, not philosophy, so I can do the arithmetic but not the vocabulary.

  My thesis: the standard suffering-focused advice to swap beef for chicken may be backwards, or at best a coin flip. Sketch: (1) per calorie, chicken is definately worse on farmed animals — many more individuals per kilo of meat, and plausibly worse lives per day lived; the room already grants me this. (2) But beef needs far more land and far more feed crop per calorie, so the animals killed by cultivation and displaced by habitat conversion, per calorie, are an order of magnitude bigger for beef — and deaths per hectare per year is exactly the kind of small number that gets large fast. (3) Whether (2) actually cancels (1) turns on two things nobody has settled: whether those wild lives are net positive or net negative, and whether animals killed by a harvester or pushed out by ploughing are really additional deaths, or whether density-dependent breeding just replaces them within a season. So the honest upshot is that we don't know, not that everyone should eat chicken.

  The room: two or three people who've built their own deaths-per-calorie spreadsheets and treat chicken over beef as settled, and who will hate anything that sounds like permission to eat steak; one environmental philosopher who thinks the whole wild animal suffering programme is hubris and will talk about ecological relations and the value of wildness rather than about totals; one conservation biologist who works on land sparing vs land sharing and will have strong views about what the counterfactual for pasture actually is — she already told me pasture is not wasteland — and a couple of rights people who think ranking animals by summed welfare is the disease, not the cure.

  Can you build me a Q&A prep sheet? Six to eight objections, ordered by how much damage they'd do rather than how likely they are, each phrased the way that particular person would actually say it in the room, one or two sentences; then what I say back in about a minute, three sentences max; then one line on where my reply is softest and one line on what I should give up before they ask. Put the one I'm hoping nobody asks at the end and flag it as that. Under 700 words total, no preamble, and don't send me off to read anything — I can't get hold of it before the talk.
