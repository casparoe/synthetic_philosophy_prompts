answer: |-
  **Setting:** *A quiet corner of a university faculty lounge. Rain beats against the window. Two coffee cups sit untouched. **Elias** (Epistemicist) leans forward, pen tapping a notebook. **Sarah** (Supervaluationist) leans back, arms crossed.*

  **Elias:** Let's go back to your conservationist. She's standing in front of the review board. She has to check a box: *Extinct* or *Not Extinct*. You say there's a third option. A gap.

  **Sarah:** I say the statement "The Azure Beetle is extinct" is neither true nor false *yet*. Not because she lacks data, Elias. Because the word "extinct" doesn't carve nature at a joint sharp enough to yield a truth value in this borderline case. There are three surviving beetles. They're inbred, hidden in a cave system we can't fully map. Is a population of three a species? Or is it a ghost?

  **Elias:** It's a species. Or it isn't. There is no "neither." That's the Epistemicist commitment. Bivalence holds. Every declarative sentence is either true or false. The conservationist is ignorant, not suspended in a logical limbo. There is a fact of the matter about whether those three beetles constitute a viable population threshold for the term "species," and consequently, whether "extinct" applies. We just can't know it.

  **Sarah:** That's the hard sell. You're asking me to believe that there is a *sharp boundary* in reality, corresponding to our fuzzy word "extinct," that we are constitutionally unable to locate. It feels like you're saving classical logic by sacrificing the semantics of how language actually works.

  **Elias:** I'm saving logic by acknowledging that language is a tool that refers to the world, and the world is precise. The vagueness is in us, not in the reference. Think about the Sorites. You remove one grain of sand from a heap. It's still a heap. You do it again. Eventually, you have one grain. Is it a heap? No. So there was a transition.

  **Sarah:** The Sorites is exactly why I can't be an Epistemicist. If I have a heap of ten thousand grains, and I remove one, the truth value of "This is a heap" shouldn't flip from *True* to *False* based on that single micro-grain. That makes the meaning of "heap" incredibly jittery. It implies that there is some specific number $n$ where $n$ grains are a heap and $n-1$ are not, and that this number is fixed by our usage but unknowable. How? What mechanism in the brain or the environment locks that boundary in place?

  **Elias:** Usage fixes reference, Sarah. But usage is a chaotic, massive causal process. It's not a definition we voted on. Think of it like a cliff edge in the fog. The edge is sharp. The fog is our ignorance. The fact that we can't see the edge doesn't mean the terrain is smooth. Why is it so hard to accept that our concepts have sharp boundaries we haven't mapped?

  **Sarah:** Because it violates the intuition that drives the paradox in the first place! The intuition is that "heap" is *tolerant*. Small changes don't matter. If you say there's a sharp cut-off, you're saying small changes *do* matter, we just don't know when. That renders the tolerance intuition a massive error.

  **Elias:** It renders it a *near*-truth. It's true for almost all cases. That's why we get tricked. But look at the alternative. Supervaluationism. You say a statement is "super-true" if it's true on all *admissible precisifications*. You take the vague term "extinct," you make it precise in every coherent way possible (e.g., extinct means zero individuals, or zero breeding pairs, or no sightings in 50 years...), and if "The beetle is extinct" comes out true on *all* those versions, then it's Super-True.

  **Sarah:** Exactly. It captures the idea that the vagueness is semantic. We haven't decided exactly how to draw the line, so we look at all the ways we *could* draw it without violating the rules of English. If they all agree, we have truth. If they disagree—if on some precisifications the beetle is extinct and on others it isn't—then the statement is indeterminate. No truth value gap in the world, just a gap in our semantic conventions.

  **Elias:** But here is where your view bleeds. You've pushed the vagueness back one step. You talk about "admissible precisifications." What makes a precisification admissible?

  **Sarah:** It has to respect the clear cases. You can't precisify "heap" to mean "one grain." That's inadmissible. You can't precisify "extinct" to mean "fewer than a million individuals."

  **Elias:** But is the boundary of *admissibility* sharp?

  **Sarah:** ...Well.

  **Elias:** Is there a sharp line between a precisification that is admissible and one that is barely inadmissible? If you say "Yes, there's a sharp line of admissibility," then you're an Epistemicist about admissibility. You've just relocated the sharp boundary from "heap" to "admissible precisification." You haven't eliminated sharp boundaries; you've hidden them in the meta-language.

  **Sarah:** That's the Higher-Order Vagueness objection. I know it. And I'll concede: if I say the set of admissible precisifications is sharply bounded, I do risk collapsing into your view. But I don't have to say that. I can say the set of admissible precisifications is *itself* vague.

  **Elias:** Then you're in a regress. If the set is vague, you need a super-super-valuation to define the boundary of that set. You're chasing your tail. You need a sharp boundary somewhere to stop the logic from dissolving, or you admit that "admissibility" is just a stand-in for "what we know," which brings us back to ignorance. Back to me.

  **Sarah:** I'm not chasing a tail, I'm describing a structure. Look, let's talk about the payoff. Why should a conservationist care? If I'm right, and the statement is indeterminate, she knows she isn't making a discovery of fact; she's making a decision. She's stipulating a boundary. That empowers her. If you're right, she's searching for a needle in a haystack that doesn't exist. She's waiting for a fact that is metaphysically present but epistemically sealed. That's paralyzing.

  **Elias:** It's not paralyzing, it's humbling. It tells her that "indeterminate" is a cop-out. If she declares them extinct, she is asserting a fact. If she's wrong, and one beetle shows up, she was wrong. Not "indeterminate." *Wrong.* My view preserves the objective stakes of her decision. Your view turns it into a semantic negotiation.

  **Sarah:** But your view breaks logic in practice. If I say "Either the beetle is extinct or it is not," you say that's a tautology. Law of Excluded Middle. I agree it's super-true. But what about "The beetle is extinct or the beetle is not extinct" in the borderline case? For you, one disjunct is True and the other False. For me, both are indeterminate, but the *disjunction* is True because it holds across all precisifications.

  **Elias:** We get the same result there. The divergence comes when you try to reason through the borderline. If you admit truth-value gaps, you lose classical inference rules. You can't always infer $Q$ from $P$ and $P \to Q$ if $P$ is a gap.

  **Sarah:** I keep classical logic for the "super-truth" relations. Validity is preservation of super-truth.

  **Elias:** But that's not how people reason. People reason with truth. If a lawyer argues, "If the car was abandoned, the salvage rights apply. The car was abandoned. Therefore, salvage rights apply," they aren't thinking about sets of precisifications. They are asserting facts. If "abandoned" is vague, your theory says the premise might be neither true nor false. So the conclusion... what?

  **Sarah:** The conclusion is super-true if the argument is valid. Look, Elias, the real cost of your view is the "unknowability." You claim there is a fact of the matter about whether a population of three beetles is "extinct." But what *makes* it the fact? Is it a micro-physical fact? A social fact? If it's a social fact based on usage, and usage is fuzzy, how can the fact be sharp? You're positing a magical connection between fuzzy use and sharp reference.

  **Elias:** It's not magical, it's externalist. The boundary isn't determined by what's in our heads. It's determined by the causal interaction between us and the world. We use "heap" to refer to heaps. The world contains configurations of sand. There is a point where the configuration changes kind. We don't know where because our discriminatory powers are limited. That's not magic; that's just the limit of human cognition.

  **Sarah:** But consider Higher-Order Vagueness again. You say there's a sharp line between "heap" and "non-heap." I say there's a sharp line between "clearly a heap" and "borderline heap." You have to say there's a sharp line there too. So there's a grain of sand where it goes from "clearly a heap" to "borderline." That's even harder to swallow than the first line. It means there's a grain that makes the *epistemic status* flip.

  **Elias:** I do swallow it. Because if I don't, I have to admit that "clearly" is vague. And if "clearly" is vague, then "clearly clearly" is vague. I am willing to bite the bullet that all higher-order vagueness is also just ignorance of sharp boundaries. It's a bullet, yes. But your bullet is worse.

  **Sarah:** Which is?

  **Elias:** Incoherence. If you say the boundary of admissibility is vague, you can't define your logic. If you say it's sharp, you're me. You're an Epistemicist about admissibility. You're just wearing a different hat.

  **Sarah:** I'm not an Epistemicist about admissibility because admissibility isn't a property of the world I'm trying to know. It's a constraint on interpretation. I can accept that there's no fact of the matter about whether a specific precisification is "on the edge" of admissibility without falling into regress. I just stop the analysis. It's brute semantic indeterminacy.

  **Elias:** "Brute." That's the sound of a theory hitting a wall.

  **Sarah:** And "Unknowable Sharp Boundary" is the sound of a theory hitting a wall. We both have a brute fact. Yours is that reference is sharper than access. Mine is that semantics allows for gaps.

  **Elias:** But my brute fact preserves the intuition that the conservationist is trying to describe reality, not legislate it.

  **Sarah:** And mine preserves the intuition that language is a human construct, and human constructs have fuzzy edges. When she declares the species extinct, she isn't discovering a hidden number $n$. She is closing the book. She is making it true by fiat, because the language ran out.

  **Elias:** If she makes it true by fiat, then she could have made the opposite true with equal justification. That means the decision is arbitrary.

  **Sarah:** In the borderline case? Yes. It is arbitrary. And acknowledging that is more honest than telling her she's missing a hidden fact.

  **Elias:** (Pauses, looks at the rain) Arbitrariness is a high price for a conservationist. If she's wrong, funding stops, protection ends. A real beetle dies.

  **Sarah:** And if she waits for your sharp fact that she can never know, the beetle dies while she waits.

  **Elias:** So pragmatism wins?

  **Sarah:** Logic serves the practice, Elias. If the logic demands a sharp boundary where there is none, the logic is the tool that needs fixing.

  **Elias:** If the logic accepts gaps, it loses its power to compel. "True on all admissible precisifications" is a mouthful. "It is or it isn't" is a gavel.

  **Sarah:** Then we're back to the start. You want the gavel. I want the map.

  **Elias:** I want the truth. Even if it hurts.

  **Sarah:** I want the truth to be something we can actually speak.

  *(They sit in silence for a moment. The rain continues. Neither has conceded, but the cost of their respective tickets is now clear on the table between them.)*
