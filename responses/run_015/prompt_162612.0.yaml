  The **Civic Maintenance** clause arises directly from Case 1 and Case 7. You voted in a safe district and after projection because the act itself sustains the norm of participation. Without this, skipping Case 1 is rational, but you feel it as a failure. This principle captures the intuition that democracy requires a quorum of participation to remain legitimate, independent of the count. It explains why Case 7 wasn't theater; it was reaffirmation. The **Epistemic Responsibility** clause is forced by the contradiction between Case 2 and Case 3. Why is random voting abusive for water but not national? Because national stakes impose a duty to learn; water stakes do not justify the effort, so abstention preserves integrity. This clause saves your verdicts by making ignorance conditional on stakes and effort. It argues that a blank ballot is honest, but a random mark is a lie. It protects the ballot from becoming a lottery. The **Contextual Choice** clause comes from Case 4 and Case 5. In safe states, you support small parties (expression); in close states, you choose lesser evils (consequences). This clause acknowledges that leverage changes obligation. When you can tip the scale, you owe it to the community to prevent harm; when you cannot, you owe it to yourself to remain honest. Together, these clauses resolve the tension between feeling duty-bound to show up but refusing to vote randomly. They allow you to be a ritualist in safe seats and a utilitarian in swing states without contradiction, provided you meet the knowledge threshold. This handles the moral discomfort of Case 6 by permitting complicity only when necessary to prevent greater injustice.

  **Cases I didn't list**

  Applying these principles yields clear verdicts on new cases. A **gift card** violates Civic Maintenance; it turns a duty into a commodity, corrupting the ritual. Even if you vote your conscience, accepting payment treats citizenship as labor, undermining the idea that participation is owed. It introduces a private incentive into a public act. Verdict: Refuse. A **None of the Above** option validates Case 6. In a safe state with unjust winners, selecting "None" satisfies Epistemic Responsibility and Contextual Choice by registering dissent without aiding harm. It offers a formal way to express the "joke write-in" sentiment legitimately, cleaning up the signal. Verdict: Encouraged. A **technical referendum** triggers Epistemic Responsibility. If you cannot understand the measure and cannot learn quickly, abstaining is better than random harm. Voting blindly on bond measures or zoning laws risks unintended consequences for neighbors. The stakes might be high, but without knowledge, you are a danger. Verdict: Skip. Finally, **vote-swapping** (Case 8) fails Civic Maintenance. It privatizes a public duty, treating votes as tradable assets. While it maximizes utility (Contextual Choice), it feels "grubby" because it violates the non-transactional nature of citizenship. It is functionally effective but ethically suspect because it severs the link between the voter and their own community's outcome, turning a civic act into a barter.

  **What I'd have to give up**

  To achieve perfect consistency, you must sacrifice something. Case 9 is irreconcilable: you cannot hold that residency dictates duty (your choice) and taxes dictate duty (your friend's choice) simultaneously. You must choose either citizenship or stakeholding as the sole criterion for eligibility. Case 10 also strains logic: if voting is a strict duty, fines are merely enforcement; if fines are wrong, it is a virtue, not a duty. You must decide if voting is obligatory or supererogatory. Dropping Civic Maintenance simplifies everything to utilitarianism: you only vote when it matters. But you lose the justification for Case 1 and 7, turning them into irrational theater. Dropping Contextual Choice makes you a pure expressivist, forcing you to vote small-party in close races, which contradicts your harm-reduction intuition in Case 5. Consistency demands you abandon the "grubby" feeling on vote-swapping or the "duty" feeling in safe seats. You cannot keep every intuition; some must be pruned to let the principle grow straight.
