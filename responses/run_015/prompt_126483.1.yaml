prompt: |-
  Practical question that turned into a philosphy one, sorry.

  I'm rewriting my psychiatric advance directive — the form where you say now what should happen if you get sectioned during a manic episode. During my last episode I was maybe 99% sure I was completely fine and didn't need meds, and it genuinely felt like clear thinking at the time. Today I'd put maybe 15% on "I was fine." My psychiatrist wants a clause that commits me to a 14-day admission regardless of what I'm saying when they see me; my solicitor is fine with that.

  But a philosopher friend says van Fraassen's Reflection principle means I'm rationally required to line my current credence up with my expected future credence — so if I know future-me is going to sit at 99% on "I'm fine", I should already be near 99% now, and pre-committing against my own future judgment is a kind of diachronic incoherence that a bookie could exploit with a Dutch book. That can't be right, surely: the whole point is that the 99% is manufactured by the episode.

  So: what are the most important implications of the Reflection principle for how I should actually write this thing? Concretely — is it a live constraint on someone in my position, or only on an ideal agent who is certain she won't become irrational, won't forget things, and won't get pushed around later? Where exactly does the argument break, on the Dutch book version and on the conditionalization version? And does it say anything about who the directive should defer to: me during the episode, my psychiatrist, or some weighted mix of us? Is there a sensible reading on which the thing I should be deferring to is more like "me after three weeks on medication" than "me on day two"?

  Two wrinkles I actually care about. One: my insurer knocks a chunk off my premium if I sign a declaration of recovery, so future-me will have a financial reason to be confident — can that motive reach backwards through Reflection and change what I'm required to believe today, which is definately not what I want the directive to do? Two: would it be smarter to trigger the clause on my confidence staying above 90% for 72 hours rather than on its level at any single moment?

  Not after medical or legal advice, obviously — just the shape of the argument and what the principle really commits me to.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and the Request:**
      *   **User:** Someone rewriting a psychiatric advance directive (PAD). They have a background in or strong interest in philosophy (specifically epistemology/formal epistemology), given their reference to van Fraassen's Reflection Principle, Dutch books, and conditionalization.
      *   **Context:** They experience manic episodes where they feel 99% sure they are fine (but aren't). Their psychiatrist wants a 14-day commitment clause. Their solicitor is okay with it. A philosopher friend is objecting based on the Reflection Principle.
      *   **Core Question:** Does van Fraassen's Reflection Principle actually constrain their ability to pre-commit against their future irrational self? Where does the argument break? How should this inform the drafting of the directive (deference, triggers, etc.)?
      *   **Specific Wrinkles:**
          1.  Financial incentive (insurance premium) affecting future credence.
          2.  Trigger mechanism (confidence >90% for 72 hours vs. single moment).
      *   **Constraint:** Not seeking medical or legal advice, but philosophical conceptual clarity.

  2.  **Deconstruct the Philosophical Problem:**
      *   **The Reflection Principle (RP):** Roughly, $P_t(A | P_{t'}(A) = x) = x$. Your current credence in $A$, conditional on your future credence in $A$ being $x$, should be $x$.
      *   **The Friend's Objection:** If Future-Me (during mania) will be 99% sure "I am fine," Current-Me should also be 99% sure "I am fine." Therefore, pre-committing to treatment (acting as if "I am not fine") is diachronically incoherent.
      *   **The Flaw in the Objection:** RP assumes *rational updating*. It assumes the agent knows they will update via Conditionalization on *evidence*. Mania is not evidence-based updating; it's a pathology that disrupts the link between evidence and belief. It's a failure of rationality, not a rational shift.
      *   **Key Distinction:** RP applies to *ideal* agents or agents who expect themselves to remain rational. It does not apply when the agent expects to become *irrational* (akrasia, addiction, mania, forgetfulness).

  3.  **Address the Core Questions:**

      *   **Is RP a live constraint here?** No. The friend is misapplying it. RP assumes the future self is a reliable guide to truth/evidence. In mania, the future self is compromised.
      *   **Where does the argument break?**
          *   *Dutch Book:* A Dutch book argument for RP assumes you accept bets based on your future credences *because* you trust them. If you know your future self is manic, you wouldn't accept those bets as fair.
          *   *Conditionalization:* RP is a consequence of Conditionalization. Conditionalization requires updating on *evidence*. Manic delusions are not treated as evidence by the sane self; they are treated as symptoms.
      *   **Who to defer to?** "Me after three weeks on medication" (Restored Rationality) vs. "Me on day two" (Compromised Rationality). The directive should privilege the *competent* self. This aligns with Ulysses contracts.
      *   **The Insurance Wrinkle:** This is a pragmatic incentive, not an epistemic one. RP deals with *credence* (belief), not *utility* (value). However, if the incentive makes Future-Me *say* they are fine (lying) rather than *believe* it, RP doesn't apply to lies. If it actually shifts belief, it's a bias. Current-Me should discount this known bias.
      *   **The 72-hour Wrinkle:** This is about stability of belief vs. fleeting delusion. Philosophically, this moves from "credence at $t$" to "credence over interval $[t, t+72h]$." It helps filter out noise/manic spikes.

  4.  **Drafting the Response (Iterative Process):**

      *   *Tone:* Empathetic, rigorous, respectful of the philosophical depth, but clear on the practical implication. Acknowledge the gravity of the situation.
      *   *Section 1: The Reflection Principle & Mania.* Direct answer: The friend is wrong. Explain *why*. RP requires expecting future rationality. Mania is a known failure mode. Use the "Ulysses" analogy.
      *   *Section 2: Where the Argument Breaks.*
          *   Dutch Book: You only lose money if you trust the future self's odds. You don't.
          *   Conditionalization: Mania isn't evidence; it's noise/static.
      *   *Section 3: Deferral & Competence.* Distinguish between "Person-Stage A" (Sane) and "Person-Stage B" (Manic). The directive is an act of Person-Stage A protecting themselves from Person-Stage B. This is standard autonomy, not a violation of it.
      *   *Section 4: The Insurance Wrinkle.* Distinguish Credence vs. Incentive. If Future-Me is biased by money, Current-Me should treat that as a known confounder. It doesn't force Current-Me to agree; it forces Current-Me to discount Future-Me's reliability.
      *   *Section 5: The 72-hour Wrinkle.* Epistemic stability. A belief held over time is more likely to be evidence-based than a spike. This is a good heuristic for filtering "state-dependent" beliefs.
      *   *Conclusion:* Summarize. The directive is philosophically sound.

  5.  **Refining the Philosophy (Self-Correction/Nuance):**
      *   *Christensen's Critique:* David Christensen has written on this. He argues that RP fails when you expect to be irrational. I should mention that.
      *   *Elster on Ulysses:* Jon Elster's *Ulysses and the Sirens* is the classic text on pre-commitment against future irrationality. Essential reference.
      *   *Competence:* The legal/ethical concept of "competence" maps well onto the philosophical "rationality."
      *   *Credence vs. Assertion:* Be careful not to conflate what the patient *says* with what they *believe*. The insurance issue might make them *say* they are fine, not *believe* it. RP applies to belief.

  6.  **Final Polish:**
      *   Ensure the distinction between *epistemic* rationality (truth-tracking) and *pragmatic* rationality (goal-achieving) is clear.
      *   Make sure the advice remains philosophical and doesn't cross into "you should write X clause."
      *   Check the tone: Supportive but analytical.

  7.  **Final Review against constraints:**
      *   Did I answer the specific questions? (Live constraint? Where it breaks? Who to defer to? Insurance? 72 hours?)
      *   Did I avoid medical/legal advice? Yes.
      *   Is the philosophy accurate? Yes, RP assumes rationality.

  *(Self-Correction during drafting)*: I need to be careful not to dismiss the friend too harshly. The friend is applying a formal principle correctly *within its domain*, but the domain doesn't cover pathology. I should frame it as a category error.

  *(Refining the Insurance point)*: If the insurance incentive makes Future-Me *believe* they are fine (self-deception), RP says Current-Me should anticipate that bias. But anticipating a bias means *correcting* for it, not adopting it. So Current-Me should *not* set credence to 99%, but rather recognize "Future-Me will claim 99% due to bias $B$." This actually strengthens the case for the directive.

  *(Refining the 72-hour point)*: This relates to the stability of evidence. If my belief fluctuates wildly, it's likely not driven by stable evidence. This is a robust epistemic filter.

  8.  **Final Output Generation** (similar to the provided good response).
answer: |-
  This is a profound question that cuts to the heart of personal identity, rationality, and autonomy. It is also deeply practical. The short answer is: **your philosopher friend is misapplying the Reflection Principle.** The principle does not bind you to honor the judgments of a future self you currently judge to be compromised.

  Here is the breakdown of why the argument breaks, where the constraints actually lie, and how the philosophical machinery maps onto your specific wrinkles.

  ### 1. The Reflection Principle and the "Rationality Assumption"

  Van Fraassen's Reflection Principle states roughly: *Your current credence in $A$, conditional on your future credence in $A$ being $x$, should be $x$.*
  $$P_t(A \mid P_{t'}(A) = x) = x$$

  Your friend argues that because Future-You ($t'$) will be 99% sure "I am fine," Current-You ($t$) must also be 99% sure.

  **Where the argument breaks:**
  The Reflection Principle is a theorem derived from the assumption that you expect to update via **Conditionalization on Evidence**. It assumes that the change in your credence from $t$ to $t'$ will be driven by new information processed by a rational cognitive mechanism.

  Mania is not a rational updating process; it is a pathology. It is a breakdown in the link between evidence and belief. When you anticipate mania, you are not anticipating a *better informed* self; you are anticipating a *broken* self.

  *   **The Dutch Book Argument:** A Dutch book can be made against you if you violate Reflection *only if* you treat your future credences as fair betting odds. But if you know your future self is manic, you would *not* accept a bet offered by Future-You at those odds. You know Future-You is "drunk" on neurotransmitters. Refusing to bet with a drunk person is not incoherent; it is prudent.
  *   **The Conditionalization Argument:** Conditionalization requires that $P_{t'}(A) = P_t(A \mid E)$, where $E$ is the total evidence learned between $t$ and $t'$. In mania, the shift to 99% confidence is not caused by evidence $E$ (e.g., "I slept 8 hours," "My bank balance is stable"). It is caused by a physiological state. Since the shift isn't evidence-based, Reflection does not apply.

  **Implication:** You are not rationally required to defer to a future self you currently deem incompetent. This is the philosophical underpinning of the **Ulysses Contract** (Jon Elster's *Ulysses and the Sirens*). Tying yourself to the mast is not a violation of autonomy; it is an exercise of autonomy by the competent self to protect against the incompetent self.

  ### 2. Who to Defer To: Person-Stages and Competence

  You asked if you should defer to "me on day two" or "me after three weeks on medication."

  Philosophically, this is a question of **diachronic identity and competence**.
  *   **Day Two (Manic):** This person-stage has impaired epistemic access to reality. Their "clear thinking" is a symptom, not a signal.
  *   **Three Weeks Later (Restored):** This person-stage has had the pathology mitigated. Their credences are more likely to track truth.

  The directive should not be viewed as "Past-Me bossing around Future-Me." It should be viewed as "Competent-Me establishing a protocol for when I become Temporarily-Incompetent-Me."

  **The Constraint:** The only live constraint Reflection places on you is this: You must be honest *now* about how reliable you think Future-You will be. If you truly believed Manic-You was *more* rational than Sane-You, Reflection would force you to defer. But since you currently assess Manic-You as epistemically broken (15% chance of being fine), Reflection demands you act on *that* assessment, not on Manic-You's future assessment.

  ### 3. Wrinkle One: The Insurance Incentive

  This is a crucial distinction between **Credence** (belief) and **Utility** (incentive).

  The Reflection Principle governs *credence*. It says nothing about *preferences* or *incentives*.
  *   **Scenario A:** Future-You *believes* you are fine (99% credence) because of mania.
  *   **Scenario B:** Future-You *claims* you are fine to save money, but internally knows you aren't.

  If it is Scenario B, Reflection is irrelevant because it deals with belief, not assertion.
  If it is Scenario A (the incentive actually biases the belief via self-deception), Reflection still does not force you to agree. Instead, it requires you to **model the bias**.

  If you know Future-You has a financial motive to believe "I am fine," you should treat Future-You's testimony as **biased evidence**.
  *   *Formula:* $P_t(\text{Fine} \mid \text{Future says "Fine"} \text{ AND } \text{Future has \$ incentive}) < P_t(\text{Fine} \mid \text{Future says "Fine"})$.

  **Implication:** The financial incentive actually *strengthens* the case for the directive. It gives Current-You an additional reason to discount Future-You's protestations. It does not require you to adopt Future-You's confidence; it requires you to recognize Future-You as a unreliable witness due to conflicting interests.

  ### 4. Wrinkle Two: The 72-Hour Stability Clause

  Triggering the clause on confidence >90% for 72 hours is philosophically superior to a single moment. This relies on the epistemic principle of **Stability as a Proxy for Evidence**.

  *   **Manic Spikes:** Manic insight often comes in flashes of intense, unstable certainty. It is volatile.
  *   **Rational Conviction:** Rational belief, based on evidence, tends to be more stable over time (unless new evidence arrives).

  By requiring a 72-hour window, you are filtering for beliefs that survive the noise of immediate affective states. This is akin to requiring a "cooling-off period" in contract law. It acknowledges that a credence held at $t$ might be a glitch, but a credence held at $t, t+1, \dots t+72$ is more likely to be the result of a functioning cognitive process.

  **Implication:** This does not violate Reflection; it refines the condition under which you trust Future-You. You are effectively saying: "I will defer to Future-You's credence only if it proves robust over time." This is a rational filter for distinguishing signal from noise.

  ### 5. Summary of Implications for the Directive

  1.  **Reflection is not a constraint here:** You are not diachronically incoherent for pre-committing against a future state you currently judge to be irrational. The principle assumes rational updating; mania is not rational updating.
  2.  **Deference:** The directive should defer to the **Competent Self**. This is usually the self that drafted the directive (now) or the self that has been stabilized (after treatment), not the self in the acute phase of the episode.
  3.  **Incentives:** Financial incentives for Future-You do not force Current-You to agree with Future-You. They provide Current-You with reason to trust Future-You *less*.
  4.  **Triggers:** A time-delayed trigger (72 hours) is epistemically robust. It filters out transient delusional certainty.

  **The Shape of the Argument:**
  The philosophical justification for your directive is not that you know better than Future-You in a vacuum. It is that you have **meta-cognitive knowledge** that Future-You's cognitive machinery will be compromised. You are not ignoring Future-You's judgment; you are categorizing it as "symptom" rather than "testimony."

  Your friend's objection would hold water if you expected to become *wiser* or *better informed* during the episode. Since you expect to become *pathological*, the Reflection Principle releases you from deference. You are free to bind the hands of the madman to save the man.

  *(Note: As you noted, this is philosophical analysis, not medical or legal advice. Ensure the final wording satisfies the legal standards for capacity and consent in your jurisdiction.)*
