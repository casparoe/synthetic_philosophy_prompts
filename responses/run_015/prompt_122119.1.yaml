answer: |-
  **Foundation Investment Sizing Protocol**

  This procedure resolves the disagreement on risk near the wind-down floor: the Investment Manager was correct. As assets approach the $90M dissolution threshold, risk capacity vanishes; betting larger to "climb out" invites ruin. Kelly logic applies only to repeatable bets sized off surplus capital, not total endowment value. The analyst must run these twelve gates sequentially for every commitment.

  1.  Name a reference class of at least ten similar future opportunities available to this portfolio. [Hard No]
  2.  Define the edge using realized historical data rather than theoretical model outputs. [Values]
  3.  Confirm the position can be liquidated within thirty days without significant price impact. [Hard No]
  4.  Quantify correlation with existing holdings and treat highly overlapping deals as additive exposure. [Hard No]
  5.  Verify total assets exceed $105M to ensure a buffer above the $90M wind-down threshold. [Hard No]
  6.  Estimate the probability of a positive outcome based strictly on the reference class history. [Values]
  7.  Estimate the ratio of average wins to average losses from the reference class data. [Values]
  8.  Calculate the theoretical optimal fraction using the formula f* = (p(b+1)-1)/b. [Hard No]
  9.  Reduce the calculated edge by fifty percent to account for estimation error and non-stationarity. [Values]
  10. Sum all correlated fractions and ensure the total does not exceed twenty percent of surplus capital. [Hard No]
  11. Apply the final fraction to assets above the $90M floor, not total endowment value. [Hard No]
  12. Apply a fixed half-Kelly multiplier to all deals unless the committee votes otherwise. [Values]

  **Case A: Liquid Repeatable Opportunity**
  This listed market strategy has fifteen years of daily data and fits a known reference class of high-frequency mean reversion. It passes Gate 1 (repeatability) and Gate 3 (liquidity) easily. The analyst calculates a win probability of 55% and a payoff ratio of 1.5, yielding a raw Kelly fraction of 10%. After the mandatory 50% model haircut (Gate 9) and the committee's fixed half-Kelly multiplier (Gate 12), the final sizing is 2.5% of surplus capital. Since assets are $140M, surplus is $50M, resulting in a $1.25M position. The aggregation check (Gate 10) confirms this does not breach total risk limits. The committee accepts this because the math is auditable, the data is robust, and the sizing respects the half-Kelly safety margin. This is the only scenario where full Kelly logic applies without modification.

  **Case B: One-Off Illiquid Commitment**
  This private credit deal offers high expected returns but belongs to an asset class where we have no track record and no sibling deals. The analyst cannot name ten similar future opportunities, failing Gate 1 immediately. The procedure refuses to produce a Kelly number because the law of large numbers does not apply to one-off bets; maximizing expected log wealth requires repetition. Instead, the deal is routed to a fixed "exploration budget" capped at 2% of total assets, decided by values rather than math. The trustee's argument that Kelly sizing optimizes growth fails here because there is no "long run" for this specific bet. The committee must approve this as a values-based gamble, acknowledging that model error (Gate 9) cannot be quantified. This prevents overbetting on flattering but thin track records.

  **Case C: Correlated Deal Near Wind-Down Threshold**
  This opportunity has a strong standalone edge but overlaps heavily with existing equity exposure, and total assets are currently $95M. Gate 5 triggers a warning: we are only $5M above the floor. Gate 11 dictates sizing off the $5M surplus, not the $95M total. Even if the Kelly fraction is high, the dollar amount is capped by the thin surplus buffer. Furthermore, Gate 10 aggregates this with existing equity, likely breaching the 20% surplus risk cap. The procedure forces a reduction or rejection of the deal. This proves the Manager was right: near the floor, risk must decrease to zero, not increase. The trustee's instinct to "bet big to recover" is rejected because a loss here triggers dissolution. The committee will dislike this constraint as it limits upside when performance is weak, but it preserves the foundation's existence.

  **Limitations and Blind Spots**

  This procedure cannot validate whether log growth is the correct objective for an institution with a mandatory spending rule. Kelly maximizes terminal wealth probability, but our mandate requires annual distributions; a sequence of half-Kelly bets may still produce volatility incompatible with stable spending. Additionally, the procedure assumes the regime generating the edge remains stationary. If the market structure changes—as it did in 2008—the reference class (Gate 1) becomes invalid, and the calculated edge (Gate 6) turns negative instantly. No backtest can settle this because past data cannot predict regime shifts or liquidity dry-ups. Finally, sizing off surplus protects against ruin but may underinvest during long bull markets, creating opportunity cost relative to peers. The committee accepts these trade-offs to prioritize survival over outperformance. The math optimizes the journey, but the values define the destination.
