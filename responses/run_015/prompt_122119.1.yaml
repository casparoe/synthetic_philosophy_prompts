      9.  Aggregation: Sum correlated fractions; cap total portfolio risk at X%. (Hard No if cap breached).
      10. Multiplier: Apply committee-fixed multiplier (e.g., 0.5 Kelly). (Values set by committee).
      11. Stake Definition: Fraction applies to surplus over $90M, not total AUM. (Hard Rule).
      12. Final Review: Does this fit spending needs? (Values).

