      *   Make sure the "Clean Dilemma" section hits the "psychology vs. normativity" point hard.

  **(Self-Correction during drafting):** I initially thought about giving a higher number, but the "No Tie-Breaker" condition is extremely strict. In almost all real-world cases, *something* tips the scale (severity, proximity, likelihood). True *indifference* at the moral level is rare. I'll stick with ~0.40.

  For the Clean Dilemma: If there is no residue, it implies the obligation was *defeated*, not *overridden*. If defeated, it wasn't a requirement. So the concept collapses. I need to be firm here.

