  # The "What's Actually Wrong in the Room?" Sorting Tree

  **Start Here:** Imagine a person locked in a room. They don't know Chinese. They have a rulebook that tells them how to shuffle Chinese symbols based on incoming symbols. They pass the Turing Test (outsiders think they speak Chinese).

  ### Node 1: The Syntax Check
  **Question:** Is following the symbol-shuffling rules enough to *actually* understand the meaning of the Chinese, or is something missing?
  *   **Yes, shuffling is enough:** Go to **Node 2**.
  *   **No, something is missing:** Go to **Node 4**.

  ---

  ### Node 2: The Hardware Check (For "Yes" people)
  **Question:** Does it matter what the room is made of? (e.g., Does it need a biological brain instead of a computer to work?)
  *   **Yes, biology matters:** → **Leaf 1: The Contradiction** *(Diagnosis: You think syntax is enough, but also that biology is required. These usually conflict. You're claiming symbols alone work, but only if made of meat.)*
  *   **No, hardware doesn't matter:** Go to **Node 3**.

  ### Node 3: The Glitch Test (For "Yes" people)
  **Question:** **The Corrupted Index Case:** Suppose the rulebook has a hidden glitch (it mixes up "river bank" and "money bank" whenever a number appears). The room never notices because it's rare. Does this prove the room *never* understood anything at all?
  *   **Yes, it was never understanding:** → **Leaf 2: Fragile Functionalist** *(View: Understanding is categorical. One systematic error proves the whole thing was just simulation, not real mind.)*
  *   **No, it's just a bug:** → **Leaf 3: Robust Functionalist** *(View: Understanding is repairable. The system mostly works; the glitch is a contingent failure, like a typo in a human's speech.)*

  ---

  ### Node 4: The Missing Piece (For "No" people)
  **Question:** Pick the one thing you think the room is lacking most:
  *   **A conscious "light bulb" moment (Qualia):** → **Leaf 4: Phenomenal Gap** *(View: The room processes data, but there's "nobody home" to feel what it's like to understand.)*
  *   **Being part of a social group (Pragmatics):** → **Leaf 5: Community Embedding** *(View: Meaning isn't in the head; it's in how a community uses the language. A lone room can't mean anything.)*
  *   **Physical contact with the real world:** Go to **Node 5**.
  *   **The meaning of the rulebook writers:** Go to **Node 6**.

  ---

  ### Node 5: The Robot Reply (For "Contact" people)
  **Question:** If we strap cameras and robot arms to the room so it can see and touch the things the words refer to, does it understand now?
  *   **Yes, embodiment fixes it:** → **Leaf 6: Embodied Externalist** *(View: Meaning comes from causal interaction with the environment. Give it a body, give it mind.)*
  *   **No, still just a simulation:** → **Leaf 7: Biological Naturalist** *(View: Sensors don't help. Only specific biological causal powers in a brain can produce real understanding.)*

  ---

  ### Node 6: The Designer Check (For "Writer" people)
  **Question:** Can the room "borrow" meaning from the fluent Chinese speakers who wrote the rulebook? (Like a calculator borrowing math from its designer?)
  *   **Yes, meaning is borrowed:** → **Leaf 8: Semantic Debt** *(View: The room has derivative intentionality. It doesn't understand, but it handles meaning owned by the designers.)*
  *   **No, meaning must be intrinsic:** → **Leaf 7: Biological Naturalist** *(Merge: If borrowed meaning doesn't count, you're back to needing intrinsic biological powers.)*

  ---

  ### ⚠️ System Note: The Nested Room Problem
  **Can this tree separate the Single Room from the Nested Room?**
  **No.** This tree treats the "Room" as a black box function. If you nest a second room inside to check the dictionary, the inputs and outputs remain the same. Your answers to Nodes 1–6 would likely remain identical whether there is one person or two. To separate them, you would need a specific branch asking about *internal architecture complexity*, which this tree skips to focus on *philosophical commitments*.

  ### 🗺️ Legend of Leaves (6-8 Total)
  1.  **The Contradiction** (Syntax-Sufficient + Biological)
  2.  **Fragile Functionalist** (Glitch = Categorical Failure)
  3.  **Robust Functionalist** (Glitch = Contingent Failure)
  4.  **Phenomenal Gap** (Consciousness Missing)
  5.  **Community Embedding** (Social Context Missing)
  6.  **Embodied Externalist** (Robot Body Fixes It)
  7.  **Biological Naturalist** (Nothing Fixes It But Brains)
  8.  **Semantic Debt** (Borrowed Meaning Only)
