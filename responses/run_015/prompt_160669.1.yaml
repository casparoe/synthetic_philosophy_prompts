  ### The String Theory/Multiverse Decision Tree

  This tree is designed to separate epistemic stances (what you believe is true) from pragmatic stances (how you allocate resources). It uses the specific cases you provided as branch nodes. There are **9 questions** leading to **10 distinct leaves**.

  **Instructions:** Start at **Q1**. Follow the branch that matches your answer. At each Case Node (Q2–Q7), answer both the **Confidence** and **Funding** sub-questions provided in the prompt; the branches summarize the combined stance.

  ---

  #### **Q1: The Principle of Non-Empirical Confirmation**
  Can a theory's probability of being "on the right track" legitimately increase without *any* novel empirical predictions, solely based on theoretical virtues or meta-arguments?
  *   **No:** Go to **Q2**.
  *   **Yes:** Go to **Q3**.

  #### **Q2: The Pragmatic Split (For Q1=No)**
  *Scenario:* Theory T makes no novel predictions.
  (1) Does this leave your confidence unchanged? (2) Would you vote to fund postdocs on T?
  *   **Confidence Unchanged / Fund No:** → **Leaf 1: The Falsificationist Skeptic**.
  *   **Confidence Unchanged / Fund Yes:** → **Leaf 2: The Research Bet**.

  #### **Q3: Case 1 — The No-Alternatives Argument (For Q1=Yes)**
  *Scenario:* T solves P. No rival solves P.
  (1) Does "no rivals" raise confidence T is true? (2) Would you fund it?
  *   **Confidence Same / Fund No:** → *(See Unoccupied Combinations below)*.
  *   **Confidence Up / Fund Yes:** Go to **Q4**.
  *   **Confidence Same / Fund Yes:** → **Leaf 3: The Conditional Meta-Inductivist** (You fund the search for rivals, not T itself).

  #### **Q4: Case 1 — The Variant Sensitivity**
  *Scenario:* Why are there no rivals?
  (A) Attention moved elsewhere. (B) Rivals reduce to T. (C) Rivals die on technical problems.
  Does your confidence level change depending on whether the answer is (B) versus (C)?
  *   **No (Confidence high regardless):** → **Leaf 4: The Strong No-Alternatives Proponent**.
  *   **Yes (Confidence depends on *why*):** → **Leaf 5: The Nuanced Meta-Inductivist**.

  #### **Q5: Case 2 — Explanatory Coherence**
  *Scenario:* T explains unexpected Y (with parameter fix) and absence of Z (symmetry).
  (1) Does explaining Y raise confidence? (2) Does explaining Z count as *independent* evidence?
  *   **Y No / Z No:** Go to **Q6**.
  *   **Y Yes / Z No:** → **Leaf 6: The Weak Coherence View**.
  *   **Y Yes / Z Yes:** → **Leaf 7: The Strong Coherence View**.

  #### **Q6: Case 3 — The Empirical Ceiling**
  *Scenario:* T predicts we will see nothing new no matter how far we push machines.
  Is this a fatal flaw that makes T "not physics," or is it an acceptable consequence?
  *   **Fatal (Not Physics):** → **Leaf 8: The "Accommodates Everything" Skeptic**.
  *   **Acceptable:** Go to **Q7**.

  #### **Q7: Case 4 — The Measure Problem**
  *Scenario:* T implies an ensemble, but the measure over it is unfixed.
  Does this mean probabilities are **undefined** (mathematical failure) or merely **unknown** (physical ignorance)?
  *   **Undefined:** → **Leaf 9: The Bayesian (Likelihood Void)**.
  *   **Unknown:** → **Leaf 10: The Measure Problem Realist**.

  #### **Q8: The Ontological Filter (For Leaves 4, 5, 6, 7, 10)**
  *Note: This question applies to anyone who has reached a "Positive" leaf above.*
  When you say T is "on the right track," do you mean:
  (A) T is probably **true** (ontological claim).
  (B) T is probably what our **successors will use** (pragmatic claim).
  *   **(A) True:** → **Leaf X: The Realist** (Append to previous leaf label, e.g., "Realist Coherence").
  *   **(B) Successors/Tool:** → **Leaf Y: The Mathematician / Pragmatist** (Append to previous leaf label).

  *(Note: For the purpose of the 10-leaf count, Q8 splits the "Positive" leaves into Truth vs. Tool variants. If you require distinct named positions, treat "The Mathematician" and "Successor Utility" as the final destinations for the (B) branch, regardless of the path taken to get there.)*

  ---

  ### The Leaves (Positions)

  1.  **The Falsificationist Skeptic:** No non-empirical confirmation; no funding. T is not science until it predicts.
  2.  **The Research Bet:** No non-empirical confirmation; **but** fund it. T is a gamble, not a belief. (Distinct from Mathematician: you think it might be false, but it's the only game in town).
  3.  **The Conditional Meta-Inductivist:** "No rivals" doesn't prove T true, but proves the *problem* is hard. Fund the problem, not necessarily T.
  4.  **The Strong No-Alternatives Proponent:** Lack of rivals is itself evidence (Dawid's Meta-Inductive Argument). Truth claim.
  5.  **The Nuanced Meta-Inductivist:** Lack of rivals is evidence *only if* rivals fail due to reduction to T, not technical accidents.
  6.  **The Weak Coherence View:** Explaining Y counts, but it's post-diction. Raises confidence slightly.
  7.  **The Strong Coherence View:** Explaining Y and Z (symmetry) creates a web of support that functions like evidence.
  8.  **The "Accommodates Everything" Skeptic:** A theory that predicts no new physics predicts nothing. It is compatible with all worlds, therefore selects none.
  9.  **The Bayesian (Likelihood Void):** $P(Evidence|Theory)$ is undefined because the evidence (our existence) is certain. No updating can occur.
  10. **The Measure Problem Realist:** Probabilities are unassignable *now*, but not in principle. The theory is sound; the calculation is missing.

  *(Note on Q8: The **Mathematician** and **Successor Utility** positions are best understood as modifiers on Leaves 4, 5, 7, or 10. If forced to choose a single leaf: The Mathematician lands on **Leaf 9** (Formalism over Truth). The Successor Utility view lands on **Leaf 2** or **Leaf 4(B)**.)*

  ---

  ### Logical Space Analysis

  **Unoccupied or Unattractive Combinations:**
  *   **Confidence Up / Fund No:** (From Q3). This combination is logically possible but pragmatically unattractive. If you believe confidence has increased, withholding resources implies you think the discovery is inevitable without work, or that the truth has no value. We marked this as a "dead end" in the tree.
  *   **Falsificationist + Research Bet:** These are mutually exclusive in Q2. You cannot hold both simultaneously unless you distinguish "personal belief" from "community strategy," which is exactly what the **Research Bet** leaf captures.

  **Indistinguishable Leaves (Flags):**
  *   **Leaf 9 (Bayesian) vs. Leaf 10 (Measure Problem):** In practice, these often collapse. If probabilities are undefined, they are effectively unassignable. The distinction is philosophical (epistemic limit vs. ontological limit). Your group may find these two positions argue the same outcome (no prediction) using different vocabulary.
  *   **The Mathematician vs. Successor Utility:** Both deny "Truth" in the realist sense. The Mathematician says "Truth value N/A." The Successor view says "Truth value Irrelevant; Utility is the metric." In a funding debate, these two will vote identically.

  ---

  ### Short Version: The 5-Question Pre-Meeting Sort

  *Send this to your group before the next meeting. Tally the letters.*

  **1. Can a theory be supported without new predictions?**
  *   A. No. (1 pt)
  *   B. Yes, but only if it's the only option. (2 pts)
  *   C. Yes, mathematical coherence counts. (3 pts)

  **2. Theory T has no rivals. Why?**
  *   A. Irrelevant. No prediction = no science. (1 pt)
  *   B. Because rivals reduce to T. This is evidence. (3 pts)
  *   C. Because rivals hit technical walls. This is just luck. (2 pts)

  **3. Theory T explains known facts Y and Z perfectly, but predicts nothing new.**
  *   A. It accommodates everything, so it predicts nothing. (1 pt)
  *   B. It raises confidence, but I wouldn't bet on it being "True." (2 pts)
  *   C. It raises confidence enough to call it "On the right track." (3 pts)

  **4. The Multiverse Measure cannot be fixed.**
  *   A. The theory is broken. Probabilities are undefined. (1 pt)
  *   B. The calculation is hard, but the physics is real. (3 pts)
  *   C. Probabilities don't apply to ensembles of universes. (2 pts)

  **5. What is the goal of T?**
  *   A. To be proven True. (1 pt)
  *   B. To be the tool successors use. (2 pts)
  *   C. To be a consistent mathematical framework. (3 pts)

  **Scoring Key:**
  *   **5–7 Points:** **The Falsificationist.** (Leaf 1 or 8). You require novel prediction.
  *   **8–10 Points:** **The Pragmatist / Research Bet.** (Leaf 2 or 5). You fund it, but don't call it Truth.
  *   **11–13 Points:** **The Coherence / No-Alternatives.** (Leaf 4, 6, or 7). You accept non-empirical evidence.
  *   **14–15 Points:** **The Mathematician / Realist.** (Leaf 9, 10, or Q8-Tool). You are either deeply committed to the math or deeply committed to the realism.

  *Note: If two members score similarly but argue, check Q5. One likely wants "Truth" (A), the other wants "Utility" (B/C). This is the "Truth vs. Successors" distinction.*
