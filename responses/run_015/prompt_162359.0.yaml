  6.  **Final Polish:** Organize with clear headings matching the user's prompt structure. (Claim-by-Claim, Aggregation, Rarity). Ensure the conclusion ties it together. (Proceed to generate output).

  *(Self-Correction on the "Aggregation Escape"):* I need to be careful here. The user asks about aggregation over the *distribution of situations actually encountered*. This is slightly different from just "local traits." It's a statistical defense. If I encounter 90% "easy" honesty situations and 10% "hard" ones, and I pass the 90%, am I honest? Situationists would say: The 10% matters morally (the high-stakes situations). Also, if the situation changes, the virtue vanishes. I need to make sure the Situationist reply targets the *predictive power* and the *moral significance* of the failures.

  *(Self-Correction on "Ought Implies Can"):* The pop-post says "honesty is not something one can be." The Situationist argument is stronger: "Global honesty is not something one can be." The Virtue Ethicist says "Honesty is a skill to be developed, not a state to be possessed." I need to highlight this distinction.

  7.  **Finalizing the Structure:**
      1.  Executive Summary (The pop-post is a caricature).
