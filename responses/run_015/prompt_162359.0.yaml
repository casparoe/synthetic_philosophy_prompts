answer: |-
  This is an exceptionally sharp dissection of a common internet caricature. Your intuition is correct: the pop-philosophy summary you encounter commits several category errors and statistical exaggerations that professional situationists (like John Doris or Gilbert Harman) would qualify, and that virtue ethicists (like Julia Annas, Nancy Snow, or Christian Miller) would vigorously contest.

  The situationist critique is a serious challenge to *empirically naive* virtue ethics, but the blog post you describe presents it as a knock-down refutation of *any* virtue ethics.

  Here is a claim-by-claim breakdown, followed by an analysis of your two specific questions regarding aggregation and rarity.

  ---

  ### Part 1: Claim-by-Claim Analysis

  #### 1. "Social psychology has refuted virtue ethics."
  *   **Situationist View:** They would distance themselves from the word "refuted." Doris, in *Lack of Character*, frames this as an argument that virtue ethics is **empirically inadequate**, not logically incoherent. If a normative theory requires a moral psychology that humans cannot instantiate, the theory is flawed, but the logic holds.
  *   **Virtue Ethicist View:** They call this a category mistake. Virtue ethics is a normative theory about evaluation and cultivation, not a descriptive theory of current human behavior. You cannot refute a claim about *how to live* with data about *how people currently behave* without bridging premises about human potentiality.
  *   **Verdict:** Distortion. Psychology challenges the *feasibility* of certain virtue-ethical models, not the theory itself.

  #### 2. "Behavior tracked features of the situation, not the agent's character."
  *   **Situationist View:** Accepts this, with a caveat. They argue behavior is better predicted by situational variables than by global trait attributions.
  *   **Virtue Ethicist View:** Misrepresentation. Aristotelian virtue does not imply behavior is *independent* of situation; it implies behavior is *appropriately responsive* to situation. A virtuous person acts differently at a funeral than at a wedding. The fact that situation matters is a premise of virtue ethics, not a refutation of it.
  *   **Verdict:** Misrepresentation. It sets up a strawman where virtues are supposed to be rigid behavioral algorithms rather than context-sensitive dispositions.

  #### 3. "Cross-situational consistency... comes out around 0.2 to 0.3, i.e. essentially zero."
  *   **Situationist View:** Accepts the 0.2–0.3 figure (based on Mischel's 1968 review and subsequent meta-analyses). Some harder-line situationists imply this is too low to support "character."
  *   **Virtue Ethicist/Statistician View:** **Major Distortion.** In social science, a correlation of 0.3 is considered **moderate to strong**. (For context, the correlation between aspirin and preventing heart attacks is roughly 0.03; the correlation between smoking and lung cancer is roughly 0.08 in some early studies). Calling 0.3 "essentially zero" is statistically dishonest. It indicates significant predictive power, just not *perfect* prediction.
  *   **Verdict:** Distortion. The statistical inference is invalid.

  #### 4. "Which means there are no character traits."
  *   **Situationist View:** Nuanced denial. Doris argues there are no **global, robust** traits (e.g., "Honesty" simpliciter). He allows for **local** traits (e.g., "Honesty-when-with-friends-and-not-tempted-by-large-sums").
  *   **Virtue Ethicist View:** Misrepresentation. Virtue ethicists argue the situationist definition of "trait" is too demanding. No serious philosopher claims a virtuous person acts identically in all logically possible worlds. The claim is that traits exist as *stable potentials* that can be relied upon within the **normal range of human experience**.
  *   **Verdict:** Overstatement. Situationists deny *global* traits; the blog post denies *any* traits.

  #### 5. "Virtue ethics... therefore has no subject matter."
  *   **Situationist View:** They argue VE lacks a *psychological* subject matter. If there are no robust traits, you cannot cultivate them.
  *   **Virtue Ethicist View:** Rejects the conclusion. The subject matter is the *cultivation* of agency, not the description of existing states. Even if traits are rare or local, the project of integrating them remains valid.
  *   **Verdict:** Non-sequitur.

  #### 6. "The standard reply... misses the point, since... 'be honest' cannot guide anyone if honesty is not something one can be."
  *   **Situationist View:** This is their strongest point, leveraging "Ought Implies Can." If human psychology is structurally incapable of global consistency, demanding it is like demanding humans fly by flapping their arms.
  *   **Virtue Ethicist View:** Challenges the "Can." "Can" refers to **capacity**, not **current statistical probability**. Humans *can* run 4-minute miles, though almost no one *does*. The fact that most people fail Milgram-style tests shows they lack *developed* virtue, not that virtue is impossible.
  *   **Verdict:** Contested. This is the core philosophical battleground.

  ---

  ### Part 2: The Aggregation Escape

  You ask if virtues can be defined over the **distribution of situations a given agent actually encounters**, weighted by frequency, rather than all logically possible situations.

  **The Virtue Ethicist's Move:**
  Yes. This is often called the **"Normal Conditions"** defense. A person is honest if they are honest in the situations they typically face. If a banker is honest in 95% of her transactions (the distribution she encounters), she is virtuous, even if she would crack under torture (a situation outside her distribution). This recovers stability: character is a statistical regularity over an agent's actual life trajectory.

  **The Situationist Reply:**
  John Doris and others offer two strong counters to this:
  1.  **The Fragmentation Problem:** If virtue is indexed to specific situations, character becomes fragmented. You might be "Honest-at-Work" but "Dishonest-with-Spouse." Situationists argue this destroys the **unity of character** required for *eudaimonia* (flourishing). You cannot be a flourishing human if your moral identity shatters when you walk through your front door.
  2.  **The Predictive/Guidance Problem:** If virtues are just aggregates of past behavior in specific niches, they lose their **action-guiding** power for *novel* situations. If I know I am "Honest-in-Office," that tells me nothing about how to act when a new, unforeseen moral dilemma arises at the office. Virtue is supposed to provide wisdom for the *unknown*, not just a record of the *known*.

  **Does the evidence settle this?**
  No. The evidence (Milgram, etc.) shows inconsistency across *saliently different* situations. It does not prove that an agent cannot integrate their responses over time through reflection and training. The evidence leaves open the possibility that while *untutored* behavior is situation-dependent, *cultivated* behavior (virtue) can achieve the aggregation you describe.

  **Verdict on Aggregation:**
  This is a viable escape route, but it forces virtue ethics to concede that virtues are **local and integrated** rather than global and atomic. The cost is that virtue becomes more like a "skill" (which varies by context) and less like a "state of being."

  ---

  ### Part 3: The Rarity Retreat

  You ask if the critique can be read as a challenge to the **prevalence** of virtues rather than their **possibility**, and what is lost if virtue ethicists concede virtues are rare.

  **The "Rarity" Interpretation:**
  This is the most charitable reading of situationism. It suggests: "Humans are naturally prone to the Fundamental Attribution Error and situational pressure. Therefore, robust virtue is vanishingly rare (perhaps only possessed by sages)."
  Aristotle himself admitted the *phronimos* (person of practical wisdom) is rare. If virtue ethicists grant this, they retreat to an **Ideal Theory**: "This is what human flourishing looks like, even if few achieve it."

  **The Situationist Counter:**
  If virtue is so rare that it is statistically negligible, it ceases to be a useful **moral guide** for ordinary agents. Telling a normal person to "be courageous" is like telling a normal person to "be a genius." It offers no traction. If the psychology of 99% of humans is situation-dependent, a normative theory that ignores situational scaffolding is practically useless.

  **What is lost by the retreat?**
  If virtue ethicists grant virtues are rare:
  1.  **Loss of Moral Encouragement:** VE often relies on the idea that virtue is "natural" to humans (we are rational social animals). If virtue is rare/unnatural, it becomes an arduous construction project rather than an unfolding of potential.
  2.  **Shift in Moral Education:** The focus must shift from "cultivate inner character" to "manage external situations." If I know I am not robustly honest, I shouldn't just "try harder"; I should avoid situations where I am tempted. This aligns VE with **situationist moral engineering** (e.g., Ulysses contracts, nudges).
  3.  **Evaluation vs. Cultivation:** VE becomes more useful for *evaluating* actions (was this the wise thing to do?) than for *evaluating* people (is this a wise person?). We judge the act, not the agent, because the agent's traits are too fragile to rely on.

  **Verdict on Rarity:**
  This retreat saves the theory from refutation but significantly alters its praxis. It moves virtue ethics away from "Be a Good Person" and toward "Build Good Habits and Avoid Bad Situations." Many modern virtue ethicists (e.g., those influenced by cognitive science) are happy to make this trade.

  ---

  ### Summary Conclusion

  The blog post you cite is a **caricature**. It takes the strongest empirical claims of situationism (consistency is low) and combines them with the weakest philosophical interpretations (therefore traits don't exist, therefore normativity fails).

  1.  **Statistical Claim:** The "0.3 is zero" claim is false. It indicates moderate consistency, which is enough to ground a revised notion of character.
  2.  **Aggregation:** You are right that defining virtue over an agent's actual distribution of situations is a viable defense. The situationist counter is that this fragments character and reduces predictive power in novel scenarios, but it does not refute the existence of the trait.
  3.  **Rarity:** Conceding that virtue is rare saves the normative theory but transforms it. It becomes a theory of **moral cultivation and environmental design** rather than a description of common human capacity.

  **The Strongest Synthesis:**
  The situationist critique successfully refutes **Global Robust Trait Virtue Ethics** (the idea that people have fixed, cross-situational moral personalities). It does not refute **Local Integrated Trait Virtue Ethics** (the idea that people can cultivate stable dispositions within the normal range of human life, provided they manage their situations).

  The pop-philosophy post fails because it treats the situationist critique as a funeral for virtue ethics, when in the academic literature, it is treated more like a renovation notice.
