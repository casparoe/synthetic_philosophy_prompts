prompt: |-
  I recently started working as a discharge coordinator at a small clinic, and I keep watching patients who clearly feel something is wrong but can't put it into words, and the doctors just write it off as anxiety. I've been reading Fricker on epistemic injustice to try to make sense of what I'm seeing, and two friends of mine who both read philosophy got into a heated argument about her notion of hermenutical injustice. They asked me to referee and I honestly can't.

  Carla said the concept is solid and that my patients are genuinely victims of it: the interpretive resources needed to make sense of their experience are missing from the shared vocabulary, and that gap is produced by power. And the harm is a loss of "narrative agency" -- the person is made to feel like their own experience isn't coherent, which is a real harm, not just an inconvenience.

  Dev said the concept is too loose to be useful. First, in testimonial injustice the wrong is a specific bad judgment by a specific person, but in hermeneutical injustice nobody did anything wrong -- you can't blame the whole culture for a gap in the vocabulary, so it can't be an injustice. Second, not being able to make sense of a new experience is often just the misfortune of being a latecomer to it; if the theory counts that as injustice it collapses into "everything unfortunate is injustice," which is why it can't be a distinctively epistemic injustice.

  Carla replied that Dev is smuggling in an individual-blame requirement -- injustice doesn't need a wrongdoer, a missing wheelchair ramp is still an injustice even if nobody chose to build it that way. And on the latecomer point: Fricker's move is that the gap isn't just that a particular person hasn't picked up the concept yet, it's that the concept is systematically absent from the shared resources of a group that's hermeneutically marginalized -- the power condition is what turns misfortune into injustice.

  Dev said that then "hermeneutical" is just decoration: if a group is marginalized, every gap they have is automatically an injustice, and the theory can't tell hermeneutical injustice apart from just being marginalized. And practically, filling a vocabulary gap is a kindness, not a justice requirement -- we're not obligated to supply interpretive resources the way we are obligated not to distrust someone's testimony.

  Can you walk through their exchange and say who's right at each step? And I'd like to know if there's anything both of them are missing -- I'm trying to figure out whether what I'm seeing at the clinic is actually injustice or just bad luck.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and the Request:**
      *   **User:** A discharge coordinator at a small clinic.
      *   **Context:** Observes patients whose symptoms are dismissed as anxiety. Suspects epistemic injustice (specifically hermeneutical injustice) based on reading Miranda Fricker.
      *   **Task:** Referee a debate between two friends (Carla and Dev) about Fricker's concept of hermeneutical injustice.
      *   **Goal:** Walk through their exchange, evaluate who is right at each step, identify what they might be missing, and help the user determine if their clinical observations constitute injustice or bad luck.

  2.  **Deconstruct the Debate (Carla vs. Dev):**

      *   **Round 1: The Nature of the Harm.**
          *   *Carla:* Concept is solid. Patients are victims. Missing interpretive resources + power gap = injustice. Harm = loss of narrative agency/coherence.
          *   *Dev:* Concept is too loose. Testimonial injustice has a specific wrongdoer (prejudice). Hermeneutical injustice has no specific wrongdoer (cultural gap). Can't blame culture, so not injustice. Also, new experiences are just "misfortune" (latecomer problem).
          *   *Analysis:* Carla aligns with Fricker. Dev raises a classic objection (individualism vs. structuralism). Fricker explicitly argues structural injustice doesn't require a specific culpable agent. Dev's "misfortune" point is the "hermeneutical marginalization" vs. "bad luck" distinction.

      *   **Round 2: Structural Injustice & The Power Condition.**
          *   *Carla:* Dev demands individual blame (wrong). Analogy: Wheelchair ramp (structural barrier is injustice even without malicious intent). Gap isn't just individual ignorance; it's systematic absence due to hermeneutical marginalization (power).
          *   *Dev:* If it relies on marginalization, "hermeneutical" is decoration. Every gap for a marginalized group becomes injustice. Theory loses distinctiveness. Also, filling vocabulary is "kindness," not "justice" (no obligation).
          *   *Analysis:* Carla correctly identifies Fricker's structural account. Dev pushes on the *distinctiveness* of the concept (is it just "oppression" renamed?) and the *normative force* (is it a duty or supererogatory?).

  3.  **Evaluate "Who is Right?" (Philosophical Assessment):**

      *   *Fricker's Actual View:*
          *   Hermeneutical Injustice (HI) occurs when someone is unfairly disadvantaged in making sense of their social experiences due to a gap in collective interpretive resources.
          *   Crucial Condition: The gap must be caused by *hermeneutical marginalization* (unequal participation in meaning-making due to power imbalance).
          *   Agent Responsibility: It is a *structural* injustice. No single villain is needed (matches Carla's ramp analogy).
          *   Distinctiveness: It is distinct from general oppression because it specifically targets the *capacity to understand and communicate* oneself.
          *   Normativity: It is a justice issue because it undermines human dignity and agency, not just a kindness.

      *   *Scoring the Rounds:*
          *   **Round 1 (Blame/Misfortune):** Carla is closer to Fricker. Dev relies on an overly individualistic model of justice. However, Dev's "misfortune" point is a valid challenge that Fricker addresses via the "marginalization" clause.
          *   **Round 2 (Distinctiveness/Obligation):** Carla is right about the structural nature. Dev raises a good point about distinctiveness (is it just "marginalization"?), but Fricker argues the *epistemic* harm is specific. Dev is wrong about "kindness vs. justice"; epistemic agency is a fundamental good.

  4.  **Identify What Both Are Missing (The "Third Way" / Nuance):**
      *   *Uptake:* It's not just about having the words; it's about whether anyone *listens* when the words are found (Dotson's "testimonial smothering" or "contributory injustice").
      *   *Willful Hermeneutical Ignorance:* Medina argues it's not just a gap; sometimes the dominant group *refuses* to learn the concepts (active ignorance vs. passive gap). This addresses Dev's "no wrongdoer" point.
      *   *Clinical Context:* In medicine, there *are* protocols. Dismissing symptoms as anxiety often involves *testimonial* injustice (credibility deficit) alongside hermeneutical issues. It's rarely *purely* hermeneutical.
      *   *The "Anxiety" Label:* Sometimes "anxiety" is a placeholder for "we don't have a biomarker yet." Is that a gap or a limitation of science? Fricker would say if the gap persists because women/minorities aren't included in research, it's HI.

  5.  **Drafting the Response:**

      *   **Introduction:** Acknowledge the user's position (clinician + philosopher referee). Validate the importance of the question.
      *   **Step-by-Step Refereeing:**
          *   *Point 1 (Wrongdoer/Blame):* Carla wins on Fricker's terms. Justice can be structural. Dev is using a retributive model where a distributive/structural one fits better.
          *   *Point 2 (Misfortune vs. Injustice):* Carla wins on the "marginalization" criterion. Dev's "latecomer" argument fails if the gap is caused by exclusion.
          *   *Point 3 (Distinctiveness):* Dev has a point here (risk of over-expansion), but Carla/Fricker would say the *epistemic* harm is the distinct element.
          *   *Point 4 (Kindness vs. Obligation):* Carla wins. Epistemic agency is a fundamental human capability (Nussbaum/Sen influence on Fricker).
      *   **What They Are Missing (Crucial for the User):**
          *   *Testimonial vs. Hermeneutical:* In the clinic, it's often *both*. The doctor might know the concept (e.g., POTS, Endometriosis) but disbelieves the patient (Testimonial). Or the concept exists but isn't applied to *this* demographic (Hermeneutical).
          *   *Willful Ignorance (Medina):* It's not always a passive gap. Doctors might actively resist new concepts.
          *   *Institutional Duty:* Clinics have specific epistemic duties (diagnostic accuracy) that go beyond general social interaction.
      *   **Application to the Clinic:**
          *   Is it bad luck or injustice? Look for patterns. Is it only women? Only minorities? Only poor patients? If patterned + power imbalance = Injustice. If random + new disease = Misfortune.
          *   Actionable advice: Document patterns, advocate for diagnostic humility.

  6.  **Review and Refine:**
      *   *Tone:* Empathetic, rigorous, clear. Avoid overly dense jargon but maintain philosophical precision.
      *   *Check:* Did I answer the specific prompt? Yes (walk through exchange, say who's right, identify missing elements, apply to clinic).
      *   *Self-Correction during drafting:* Make sure not to just say "Fricker says X." Engage with Dev's criticisms because they are standard philosophical objections (e.g., the "problem of collective responsibility"). Acknowledge where Dev pushes Fricker to be more precise. Ensure the distinction between *testimonial* (credibility) and *hermeneutical* (concepts) is clear in the clinical context, as they often overlap.

  7.  **Final Polish:** Organize with clear headings. Ensure the conclusion empowers the user in their specific role. (Proceed to generate output).

  *(Self-Correction Note)*: I need to be careful not to dismiss Dev entirely. Dev's objections are actually quite strong in the literature (e.g., from critics like Medina or Dotson who refine Fricker). I should frame Dev as raising valid challenges that later scholarship addresses, even if Carla is more faithful to Fricker's original text. This adds depth.

  *(Refining the "Kindness vs Justice" point)*: Dev argues providing concepts is kindness. Fricker argues it's justice because it relates to human dignity. I need to make sure this distinction is clear.

  *(Refining the Clinical Application)*: The user sees patients dismissed as "anxiety." This is a classic example. I should mention specific conditions often misdiagnosed this way (Endometriosis, POTS, Long COVID) to ground the philosophy.

  8.  **Final Output Structure:**
      *   Intro: Validate the user's experience.
      *   Round 1: Blame & Structure (Carla wins).
      *   Round 2: Misfortune vs. Marginalization (Carla wins, but Dev highlights a risk).
      *   Round 3: Distinctiveness & Obligation (Split/ Nuanced).
