  The ledger balanced perfectly if one assumed intentional obfuscation, yet equally well under infinite clerical incompetence. Every discrepancy vanished when adjusting assumptions about currency conversion dates, only to reappear as misfiled receipts in a different quarter. The evidence remained stubbornly neutral between criminal conspiracy and bureaucratic accident. My supervisor demanded a definitive conclusion for the SEC filing, forcing a choice where logic offered only symmetry. I checked "Systematic Fraud" not because the data compelled it, but because the alternative hypothesis required a budget amendment to hire enough auditors to verify the incompetence. We cannot test the messiness without bankrupting the investigation, so I indicted the CEO to save the department's overhead. The numbers couldn't speak, but the billing rate did.
