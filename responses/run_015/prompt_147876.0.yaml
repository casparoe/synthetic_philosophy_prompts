  Separating historical lineage from present systemic capacity in organisms is conceptually distinct for explanatory purposes but ontologically inseparable, since the current self-maintaining structure is itself a sedimented product of evolutionary and developmental history.

  Kant's reciprocal causation aligns neither with the etiological nor the causal-role account but instead anticipates a modern organizational account where function is grounded in a system's capacity for self-maintenance and closure. The etiological view fails to capture Kant's insight because it relies on external selection history, whereas Kant focuses on the internal formative power where parts produce each other within the present individual. The causal-role view is closer but too permissive, as it allows any causal contribution to count as a function without the normative constraint that the part must be necessary for the whole's existence as an organized being. Kant's model suggests a third option where the distinction between history and present collapses into a loop of self-production, mirroring contemporary organizational accounts that define functions as constraints contributing to the system's own maintenance. This perspective resonates with niche construction and developmental systems theory, where the organism actively sustains the conditions for its own continuity, making teleological judgment a necessary regulative principle for understanding how historical constraints manifest as present-day reciprocal causality.
