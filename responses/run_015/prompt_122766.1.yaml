          *   *Hurwicz Criterion:* Weighted average of best/worst. Close, but "least-correction" is about the *probability distribution itself*, not the utility.
          *   *Minimum Regret:* No, that's post-hoc.
          *   *Center of Gravity/Midpoint:* If the "adjustment" is distance to the center, it's just picking the midpoint.
