answer: |-
  **MEMORANDUM**

  **TO:** Clinical Ethics Committee
  **FROM:** Consent Forms Working Group
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding Isotype-Style Risk Visualization for Elective Knee Replacement

  ### Executive Summary

  The Working Group recommends **Adoption with Conditions** of the proposed Isotype-style risk visualization sheets, contingent upon immediate design modifications and a restricted rollout protocol. We cannot endorse the vendor's current "picture-only" specification for full go-live in ten weeks. While the visual approach offers significant equity benefits for low-literacy and non-English-speaking patients, the pilot data indicates a critical failure in comparative risk comprehension. To proceed ethically, we must modify the tool from a *replacement* for text to a *supplement* anchored by numerical denominators, and shift design authority from Marketing to Clinical Education.

  ### Background and Proposal

  The vendor proposes replacing the textual risk section of the elective knee-replacement consent packet with Isotype-style visualizations (pictograms). This approach relies on the Vienna Method (1920s–30s), utilizing repeated, identical figures to represent statistical frequency rather than varying sizes or percentages. The stated goal is to improve comprehension for the estimated 15% of our surgical population with limited English proficiency or low health literacy.

  ### Evidence Review: Pilot Outcomes

  Our four-week pilot yielded mixed results that necessitate caution:
  *   **Recall:** Patients retained information regarding specific complications significantly better at one-week follow-up compared to the text-based control.
  *   **Comprehension:** When presented side-by-side, approximately 50% of participants could not correctly identify which option carried the higher complication rate. The current sheets display proportions without clear denominators, obscuring the magnitude of risk.
  *   **Context:** The visual format struggled to convey natural history (i.e., "if you do nothing, the condition worsens") or the high probability of *no* complication.

  ### Ethical and Historical Analysis

  The Working Group identified a fundamental tension between the vendor's pitch and the ethical requirements of informed consent, as well as the historical intent of the Isotype method.

  1.  **Informed Consent Standards:** Consent requires understanding relative risk, not just remembering potential outcomes. A tool that obscures the denominator (e.g., 5 icons out of 100 vs. 5 icons out of 10) fails the legal and ethical standard for decision-making capacity.
  2.  **The Neurath Constraint:** Otto and Marie Neurath conceived of Isotype not as a standalone rebus, but as a "helping language" embedded within sustained visual education. They emphasized the role of a trained "transformer" to interpret data accurately. Delegating this transformation to a marketing team for a one-off interaction contradicts the method's epistemological foundation. As Neurath argued, pictures unite, but without context, they may also mislead.

  ### Recommendation and Implementation Timeline

  We recommend proceeding with the visual aids **only** under the following conditions. If these conditions cannot be met by the go-live date, the risk section must revert to the current text/percentage format for the general population, reserving the visual aids for known low-literacy cases only.

  **Conditions for Adoption:**
  1.  **Hybrid Design:** The "picture-only" rule must be waived. All pictogram blocks must include explicit numerical denominators (e.g., "Out of 100 people") and minimal text labels.
  2.  **Design Authority:** Control of the "transformation" of data into visuals moves from Marketing to the Clinical Education team, overseen by the Working Group.
  3.  **Verbal Anchoring:** Surgeons are required to reference the visual aid during the consent conversation; it cannot be a handout signed in isolation.

  **Timeline (Next 10 Weeks):**
  *   **Weeks 1–3:** Redesign of risk sheets to include denominators and natural history context (e.g., a separate block showing progression without surgery).
  *   **Weeks 4–8:** Limited Pilot (n=50) using the *modified* hybrid sheets. Focus specifically on comparative risk questions.
  *   **Week 9:** Working Group review of comparative risk comprehension data.
  *   **Week 10:** Final Go/No-Go decision for hospital-wide rollout.

  **Criteria to Change Course (Revert to Text):**
  We will recommend halting the use of these forms hospital-wide if:
  *   Comparative risk comprehension in the modified pilot remains below 80% accuracy.
  *   Surgeons report that the forms increase consultation time by more than 5 minutes on average.
  *   Legal counsel determines the hybrid format introduces new liability regarding risk quantification.

  ### The Dissenting View (Minority Position)

  A significant minority within the Working Group argues that we should **Drop** the proposal entirely for the upcoming go-live. Their position rests on the primacy of safety and legal defensibility. They argue that a 50% failure rate in comparative risk assessment during the pilot is unacceptable for a tool intended to secure informed consent. From this perspective, the Isotype method is inherently unsuited for the high-stakes, one-off nature of surgical consent. They contend that attempting to "fix" the design in ten weeks is rushed and that the historical misuse of the Vienna Method (ignoring the need for a trained transformer) suggests the tool is being asked to do work it was never designed to do. They recommend maintaining the text-based standard while investing in professional interpreter services for non-English speakers, which has a more robust evidence base for safety.

  ### Conclusion

  The Working Group believes that abandoning the visual aid entirely forfeits a meaningful opportunity to improve equity for vulnerable patients. However, adopting the vendor's current specification would compromise the validity of consent. By adopting a hybrid model with strict oversight, we honor the spirit of the Vienna Method—using visuals to assist understanding—without violating the letter of clinical ethics.

  We request the Committee's approval to proceed with the modified design pilot as outlined above.
