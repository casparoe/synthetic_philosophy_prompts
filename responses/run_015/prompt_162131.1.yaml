      *   *Critique:* Did I address the "Marketing team" concern?
      *   *Fix:* Yes, make a condition that clinical educators/ethicists, not marketing, must oversee the "transformation" of the data.
      *   *Critique:* Did I address the "no words" rule?
      *   *Fix:* Recommend hybrid. Pure Isotype failed the comparison test. Add minimal text/numbers to support the icons.

  7.  **Final Polish:** Check against the prompt requirements.
