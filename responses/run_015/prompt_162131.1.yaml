      *Actually, looking at the pilot data:* "half couldn't say which carried the higher complication rate." That is a critical failure for informed consent. I cannot recommend full adoption. I must recommend **Adopt as a Supplemental Aid Only, Not a Replacement**, or **Delay Risk Section**.
      *Better path:* **Adopt with Conditions (Hybrid & Monitoring).** We modify the design (add denominators) and treat it as an aid, not the legal consent itself.
      *Best path for the Memo:* Recommend **Adoption with Conditions (Modified Design + Monitoring)**. We fix the design (add numbers/denominators) immediately. If we don't fix the design, we must drop it. I will argue for fixing the design (Hybrid) to meet the 10-week deadline but with heavy monitoring.

