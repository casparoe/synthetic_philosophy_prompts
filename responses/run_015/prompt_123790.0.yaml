answer: |-
  **Exam Question**

  **Course:** Upper-Level Metaphysics Seminar
  **Time:** 45 Minutes
  **Word Limit:** Approximately 800 words
  **Conditions:** Closed Book

  **Prompt:**
  Bradley argues that relations cannot unify constituents without generating an infinite regress; Russell responds by treating propositional unity as a primitive fact. Critically evaluate this exchange. Does Russell's appeal to a brute fact of unity genuinely solve the problem, or does it merely relocate the explanatory burden? Argue whether accepting this brute fact is philosophically preferable to Bradley's regress, and consider whether any ontological middle ground exists between these two positions. Do not simply rehearse the debate over internal versus external relations; focus on the structural cost of explanation versus the cost of primitivism.

  ***

  **Model Answer**

  The problem of propositional unity asks how distinct constituents (subject, predicate, object) form a single truth-apt unit rather than a mere list. Bradley's regress arises from the intuition that if a relation $R$ unifies $a$ and $b$, a further relation $R'$ is required to connect $R$ to $a$ and $b$, ad infinitum. For Bradley, this demonstrates that relations are unintelligible abstractions from a holistic Absolute; unity cannot be constructed from parts.

  Russell's response rejects the demand for a unifier. He posits that the proposition is a fundamental complex where unity is intrinsic, not imposed by an additional entity. In this view, the verb in a proposition does not stand for a relation that needs relating; it actually relates. This stops the regress by declaring the unity of the proposition a primitive brute fact.

  Does this solve the problem? Structurally, yes; explanatorily, it is contentious. Russell avoids the infinite hierarchy, which is generally deemed vicious because it defers explanation indefinitely. If every unifier requires a further unifier, nothing is ever truly unified. However, Russell pays an ontological price. By treating unity as primitive, he accepts a fact that lacks further explanation. Critics argue this is not a solution but a surrender. We have traded an infinite chain of relations for a magical moment of cohesion. If Bradley's error was demanding too much explanation (leading to regress), Russell's error may be demanding too little (leading to obscurity).

  Nevertheless, accepting the brute fact is philosophically preferable. A vicious regress is an explanatory failure; it implies that the phenomenon (unity) never actually occurs. A brute fact, while opaque, at least secures the existence of the phenomenon. Metaphysics must stop somewhere; if we cannot analyze unity without destroying it, we must accept it as foundational. Russell's move preserves the plurality of objects and the reality of truth, whereas Bradley's solution collapses all distinction into the One. The cost of primitivism is lower than the cost of monism.

  Is there a middle ground? One might propose a ontology of states of affairs rather than propositions. Here, unity is not a property added to objects, nor a brute fact about sentences, but a fundamental category of being. Armstrong, for instance, suggests non-relational ties that are ontologically free lunches—they exist whenever the particulars exist, requiring no further glue. This avoids Bradley's regress by denying that the tie is a separate entity needing relation, yet avoids Russell's linguistic primitivism by grounding unity in the world, not just logic.

  Alternatively, one might distinguish between ontological grounding and conceptual analysis. The regress may be vicious only if we demand conceptual analysis of unity. If unity is ontologically fundamental but conceptually simple, the regress is benign. However, this risks collapsing back into Russell's primitivism.

  Ultimately, Russell's move is the lesser evil. Bradley correctly identifies that relational ontologies struggle to account for cohesion, but his holistic solution destroys the data of experience. Russell saves the data by positing a primitive unity. While this leaves the 'how' unanswered, it secures the 'that'. A middle ground requires rethinking the category of the relation itself, perhaps as non-merological composition, but until such a category is rigorously defined, Russell's brute fact remains the necessary stopping point for a pluralistic metaphysics. We must choose between a mystery that allows for truth and a coherence that abolishes it.

  ***

  **Marking Scheme**

  | Move | Criteria for Full Marks (A-Grade) | Marks | Typical B-Grade Mistake |
  | :--- | :--- | :--- | :--- |
  | **1. Problem Formulation** | Clearly defines the unity problem as distinct from the internal/external relations debate, focusing on the regress mechanism. | 20 | Reduces the problem solely to a summary of internal vs. external relations without addressing unity. |
  | **2. Russell's Move** | Accurately explains Russell's primitive unity as a stopping point that denies the need for a further unifier. | 20 | Describes Russell's view as simply "external relations" without noting the primitivist/brute fact commitment. |
  | **3. Trade-off Evaluation** | Explicitly weighs the cost of infinite regress against the cost of accepting an unexplained brute fact. | 20 | Describes both positions but fails to critically evaluate the explanatory trade-off between them. |
  | **4. Viciousness Analysis** | Argues why the regress is vicious (explanatory failure) compared to the brute fact (ontological cost), justifying the preference. | 20 | Asserts one side is better without explaining *why* the regress is vicious or the brute fact is acceptable. |
  | **5. Middle Ground** | Proposes a viable alternative (e.g., states of affairs, non-relational ties) and assesses its stability against the two poles. | 20 | Suggests a compromise that inevitably collapses back into either Bradley's monism or Russell's primitivism. |
  | **Total** | | **100** | |
