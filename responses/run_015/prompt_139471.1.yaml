  4.  **Addressing the "Predictable Failures":**

      *   *Students reconstructing priors:* They will assign 0.5 to the unknown urn. *Fix:* Don't correct them. In the debrief, ask "Why 0.5? What evidence licensed that?"
      *   *Arbitrage:* They might try to buy low/sell high across rounds. *Fix:* Rounds are independent.
