          2.  Non-comparability/Uncertainty vs. Risk (not just missing numbers).
          3.  Weight of Evidence (amount of evidence $\neq$ probability value).
          4.  Conventions/Animal Spirits (when calculation fails, we follow the crowd/arbitrary anchor).
      *   **Constraints:** 75 minutes, 16 students, analogue tools only (paper, envelopes, cards, whiteboard), no real money (token prize), no deception, no grade anxiety.
      *   **Critique of Previous Attempts:** Ellsberg felt like a payoff quirk; Beauty Contest felt like iterated reasoning puzzle. Need a *single connected activity*.
