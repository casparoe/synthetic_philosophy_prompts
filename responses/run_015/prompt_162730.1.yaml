answer: |-
  There is no canonical term in normative decision theory for this distinction, for the simple reason that normative theory (Savage, Anscombe-Aumann) explicitly forbids it. Under the standard axioms, the *ontological status* of the state (whether it is already fixed or yet to be determined) is irrelevant; only the agent's subjective probability distribution over outcomes matters. This is a consequence of the **Reduction of Compound Lotteries** and **State Independence**. If your students distinguish the two, standard theory labels it an error.

  However, in descriptive psychology and philosophy of probability, the distinction is real and robust. The closest established conceptual pair is **Epistemic vs. Aleatory Uncertainty**, but as you suspected, those terms usually refer to the *source* (ignorance vs. randomness) rather than the *timing of determination*. Since both your urns involve a random draw, the source is identical.

  For your lecture, I recommend coining the term **"Settledness Sensitivity"** (or **"Fixed vs. Generative Uncertainty"**). Define it as follows: *Sensitivity to whether the truth-value of the uncertain proposition currently exists in the world (Fixed), or whether it will only come into existence at a later time (Generative).*

  Here is the argumentation you requested, broken down by your three constraints.

  ### 1. Boundary Cases: Where is the Line?

  You asked whether the line is about time, information existence, or something else. The boundary cases suggest it is about **Counterfactual Knowability**—specifically, whether there exists *anywhere in the universe* a fact of the matter that *could* in principle be known, even if the rules of the game forbid accessing it.

  *   **The Destroyed Slip (Fixed, then erased):** The composition was determined, printed, and then shredded unread.
      *   *Prediction:* Students will treat this like the **Future/Generative** case (high aversion).
      *   *Reasoning:* Although the event was in the past, the *truth* no longer exists. It is ontologically equivalent to the future machine: there is no fact of the matter currently available to be known. If the line were purely about time, this would group with the Envelope. If it groups with the Future Machine, the distinction is not temporal but **ontological**.
  *   **The Third-Party Observer (Fixed, hidden but known):** The composition is in an envelope, but a colleague has read it and is sworn to silence.
      *   *Prediction:* Students will treat this like the **Envelope** case (lower aversion).
      *   *Reasoning:* The fact exists and is held in a mind. The students' comment ("someone could at least tell us") is vindicated. Even if the colleague *won't* speak, the *possibility* of leakage exists. This reduces the feeling of "pure" ambiguity.
  *   **The Independent Future Machine (Generative):** The composition is drawn after the bet.
      *   *Prediction:* Highest aversion.
      *   *Reasoning:* No fact exists. No one knows it. It cannot leak. It is "pure" generative uncertainty.

  **Conclusion on the Line:** The distinction is not about Time (Past vs. Future). It is about the **Existence of Truth**. Your students are more comfortable betting on a *hidden fact* (Epistemic) than on a *future fact* (Aleatory/Generative), even if their current probability estimates are identical. They prefer uncertainty that resides in their own ignorance over uncertainty that resides in the world's indeterminacy.

  ### 2. Rational Defensibility: Bias or Heuristic?

  Is this sensitivity a bias to be trained out, or a rational heuristic?

  **The Normative View (It is a Bias):**
  Under consequentialism, only the payoff matrix matters. The payoff depends on the color of the ball drawn. Whether that color was determined at $t-1$ or $t+1$ has no causal impact on the ball selected at $t_{draw}$. If a student prefers Bet A (Envelope) over Bet B (Future Machine) when the odds are stipulated as identical, they violate **Procedure Invariance**. A Dutch Book could theoretically be constructed if they assign different subjective probabilities to the same event based solely on determination time, though in practice, the "no arbitrage" condition is hard to enforce on one-off metaphysical preferences.

  **The Ecological View (It is a Heuristic):**
  In the real world, stipulations like "nobody can look" and "the machine is independent" are rarely credible.
  *   **Leakage Risk:** Sealed envelopes leak (paper is thin, locks break, people peek). Future randomizers are harder to tamper with *retroactively*, but they are subject to *mechanism risk* (the machine might break, the experimenter might change the rules).
  *   **Adversarial Inference:** If the experimenter knows the envelope's content (Third Party case), they might structure the bet to exploit you. If the content is truly future/generative, even the experimenter doesn't know, reducing the adversarial channel.
  *   **Wait, your students prefer the Envelope.** This suggests they aren't fearing adversarial exploitation (which would make them prefer the Future case where the house is also blind). They are fearing **Volatility**. A hidden fact feels stable; a future fact feels mutable.

  **The Test:**
  To determine if it is a bias or a rational belief about the experimental setup, run this small experiment:
  Offer the students a side bet: *"I will pay you $5 if the composition of the urn was fixed before you made your choice."*
  *   If they are indifferent between the Envelope and Future scenarios in their main bet, but value this side bet at $0 for the Future case and >$0 for the Envelope case, they admit the states are metaphysically different to them.
  *   If they value the side bet at $0 for *both* (accepting your stipulation), yet still prefer the Envelope in the main bet, they are exhibiting a **framing bias**. They claim to believe the stipulations, but their utility function penalizes "Generative" states. This is irrational under standard axioms.

  **Verdict:** It is likely a **robust bias** rooted in an evolutionary heuristic that treats "unknown facts" (predators in the bush) differently from "unknown futures" (weather tomorrow). In a controlled classroom, it is normatively indefensible.

  ### 3. Theoretical Cost: What Must Be Given Up?

  If you want to build a decision theory that respects "Settledness Sensitivity" (i.e., treats the Envelope and Future Machine as fundamentally different objects), you must sacrifice **Consequentialism** and **State Reduction**.

  1.  **Expansion of the State Space:**
      In Savage's framework, a state $s$ is a complete description of the world relevant to the outcome. To model this, you must expand the state to include metadata about the history of the uncertainty.
      *   State $s_1$: Ball is Black, Determination = Past.
      *   State $s_2$: Ball is Black, Determination = Future.
      *   Even if the payoff is identical ($100 for Black), the utility $U(s_1) \neq U(s_2)$. This violates the principle that utility should depend only on consequences, not on the *process* that led to them.

  2.  **Violation of Reduction of Compound Lotteries:**
      Standard theory says a two-stage lottery (First determine if the urn is Fixed/Future, then draw ball) should reduce to a simple lottery over outcomes. Settledness Sensitivity insists the *structure* of the lottery matters. You cannot reduce the tree. This makes the mathematics significantly messier (requiring recursive utility or history-dependent preferences).

  3.  **Loss of Dynamic Consistency:**
      If I prefer the Envelope today, but tomorrow (after the machine runs but before I see the result) the situation becomes identical to the Envelope case, my preferences might reverse. If I prefer "Fixed" over "Generative," then as soon as the Future Machine runs, my preference for the bet should instantly jump up, even though I haven't learned the color. A theory that allows utility to change merely due to the *passage of time* (without new information) struggles to guide action over time.

  **Pedagogical Recommendation:**
  Use this "wrinkle" to show the limits of the Savage framework. Tell them: *"Standard theory says these are identical. Your intuition says they are not. If you side with your intuition, you are buying a more complex theory that tracks the history of facts, not just the facts themselves. Most economists say you are wrong (bias). Some philosophers say the economists are missing something about the nature of time (ontic openness)."*

  This positions the students not as confused, but as intuitive philosophers confronting the austerity of normative models. It motivates the formal Ellsberg paradox (where the distinction is between Known Risk and Unknown Ambiguity) by first clearing up the distinction between Fixed Ambiguity and Generative Ambiguity.
