prompt: |-
  I am assembling, before I evaluate any particular proposal, the specification that an adequate theory of rational betting under uncertainty must meet. The setting is repeated betting against fixed or slowly drifting odds, where wealth compounds multiplicatively and the bettor may be uncertain about the true win probability — the domain in which the relevant average is geometric rather than arithmetic, and the question is what makes a stake rational rather than the recitation of a formula. Write out the desiderata: the list of things such a theory must deliver to count as an account of rational staking, with the motivating case behind each — the concrete betting situation, or the specific dispute between staking rules, that the requirement is meant to adjudicate — and a mark on whether each is non-negotiable (a theory that fails it is simply wrong) or a preference of a particular camp (the log-optimalists, the expected-utility maximizers who fix a utility function, or the risk-averse camp that stakes a fixed fraction of the log-optimal amount). At minimum it must handle the one-shot bet, the long run of repeated bets, the bettor who is uncertain about the win probability and updates from the outcomes, correlated rather than independent outcomes, the boundary at ruin, and the question of whether borrowing is in scope. It must respect, and not collapse, the following distinctions: the long-run growth rate of the wealth process versus the expected terminal wealth; the ensemble average over many parallel gamblers versus the time average along a single trajectory; a stake that is optimal at each step given current information versus one that is optimal for the horizon as a whole; and a property of the strategy's asymptotic behavior versus a property of the bettor's utility function. It must be consistent with the standard asymptotic results — that the log-optimal stake maximizes the almost-sure long-run growth rate of wealth and that no admissible stake achieves a strictly higher growth rate, and that the stake maximizing expected terminal wealth, on any positive edge, is either the maximum allowed stake or, if borrowing is unbounded, has no finite optimum at all — and it must say how the optimal stake depends on the uncertainty in the win probability, rather than pretending the posterior mean can simply be substituted into the one-shot formula. Then flag any subset of the desiderata you suspect is jointly unsatisfiable — watching in particular for tensions among the demands that the theory be utility-neutral, sensitive to the bettor's risk tolerance, robust to misspecification of the odds, and sharp about the precise estimate — and say whether the list is satisfiable at all, and which single requirement does the most work excluding candidates. Close with a short scorecard: in one or two lines each, how the full log-optimal stake, a fixed fraction of it, the expected-wealth maximizer, and a generic expected-utility maximizer fare against the list.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Goal:** Assemble a specification (list of desiderata) for an adequate theory of rational betting under uncertainty.
      *   **Context:** Repeated betting, multiplicative wealth compounding, uncertain win probabilities (Bayesian updating), geometric vs. arithmetic averages.
      *   **Key Distinctions to Respect:** Long-run growth vs. expected terminal wealth, ensemble vs. time average, myopic vs. horizon-optimal, strategy asymptotics vs. utility function.
      *   **Key Scenarios to Handle:** One-shot, long-run, parameter uncertainty/updating, correlated outcomes, ruin boundary, borrowing.
      *   **Consistency Requirements:** Must align with standard asymptotic results (Kelly maximizes growth, Expected Wealth maximizes edge to limit/borrowing).
      *   **Specific Constraint:** Must address how optimal stake depends on uncertainty (not just plugging in posterior mean).
      *   **Critical Analysis:** Flag jointly unsatisfiable subsets (tensions between utility-neutrality, risk tolerance, robustness, sharpness). Determine satisfiability. Identify the most exclusionary requirement.
      *   **Scorecard:** Evaluate Full Kelly, Fractional Kelly, Expected-Wealth Maximizer, Expected-Utility Maximizer against the list.
      *   **Tone:** Rigorous, analytical, philosophical but grounded in probability theory and finance.

  2.  **Drafting the Desiderata (Iterative Process):**

      *   *Requirement 1: The Time Average vs. Ensemble Average.* This is crucial for ergodicity breaking. A theory must distinguish between what happens to *one* person over time vs. *many* people at once.
          *   *Motivation:* The St. Petersburg paradox or simple multiplicative processes where $E[W] \to \infty$ but $W_t \to 0$ almost surely.
          *   *Status:* Non-negotiable (foundational).

      *   *Requirement 2: Ruin Avoidance (Absorbing Boundary).* Wealth cannot go negative in a multiplicative context without ending the game.
          *   *Motivation:* Betting the whole bankroll on a coin flip with $p < 1$ leads to eventual ruin.
          *   *Status:* Non-negotiable (mathematical necessity for compounding).

      *   *Requirement 3: Parameter Uncertainty Integration.* The theory must handle unknown $p$, not just plug in $\hat{p}$.
          *   *Motivation:* The "Estimation Risk" problem. Overbetting due to overconfidence in $\hat{p}$.
          *   *Status:* Non-negotiable (per prompt instructions).

      *   *Requirement 4: Horizon Consistency (Myopic vs. Strategic).* Does the stake change if the game ends in 10 rounds vs. 10,000?
          *   *Motivation:* Dynamic programming vs. greedy growth.
          *   *Status:* Preference (Log-optimalists say myopic is fine for long run; EU maximizers might hedge for short horizons). Let's call this "Horizon Invariance" for growth.

      *   *Requirement 5: Borrowing and Leverage Limits.* What happens when edge is positive but variance is high?
          *   *Motivation:* Expected wealth maximization suggests infinite leverage. Rational theory must bound this.
          *   *Status:* Non-negotiable (to avoid absurdity).

      *   *Requirement 6: Utility Neutrality vs. Risk Preference.* Should the theory prescribe *the* rational stake or a stake conditional on risk aversion?
          *   *Motivation:* Kelly claims to be "objective" (growth), EU claims to be "subjective" (preferences).
          *   *Status:* This is the tension point. The prompt asks for a theory of *rational* betting. Is rationality objective (survival/growth) or subjective (preferences)? I need to frame this carefully. Let's make "Explicit Risk Parameterization" a desideratum.

      *   *Requirement 7: Correlation/Non-IID Handling.* Real markets drift or correlate.
          *   *Motivation:* Streaks, regime changes.
          *   *Status:* Non-negotiable (for robustness).

  3.  **Refining the Tensions (The "Unsatisfiable" Check):**
      *   *Tension:* Utility Neutrality vs. Risk Tolerance. You can't have a theory that is purely objective (like Kelly) *and* accommodates arbitrary risk aversion without introducing a subjective parameter. If you introduce a parameter, it's no longer "utility-neutral."
      *   *Tension:* Sharp Estimates vs. Robustness. Using the posterior mean directly (Sharp) often leads to overbetting (Fragile). Integrating uncertainty (Robust) reduces the stake. A theory demanding "precise estimate usage" might conflict with "robustness to misspecification."
      *   *Tension:* One-shot vs. Long-Run. A stake rational for survival over 10,000 bets (Kelly) might be too conservative for a one-shot bet where you want to maximize expected value (since ruin isn't certain in one shot).
      *   *Conclusion:* The list is likely *not* jointly satisfiable if "Utility Neutral" and "Accommodates Risk Tolerance" are both treated as hard constraints. One must yield. The prompt asks me to flag this.

  4.  **Selecting the "Most Work" Requirement:**
      *   Which requirement kills the most theories?
      *   *Ruin Avoidance* kills Expected Wealth Maximization (unbounded leverage).
      *   *Parameter Uncertainty* kills naive Kelly (plug-in).
      *   *Time Average* kills Expected Value maximization.
      *   *Decision:* **The Ergodicity/Time-Average Requirement.** This is the axe that chops off the entire Expected Value/Expected Wealth branch of decision theory in this context. It forces the geometric mean.

  5.  **Drafting the Scorecard:**
      *   *Full Kelly:* Great on growth/ruin, fails on parameter uncertainty (overbets), rigid on risk.
      *   *Fractional Kelly:* Fixes uncertainty/risk, but ad hoc (why 1/2?).
      *   *Expected Wealth:* Fails ruin, fails time average.
      *   *Expected Utility:* Satisfiable, but depends on arbitrary utility function (lacks normative bite on *which* utility).

  6.  **Writing the Content (incorporating specific prompt phrasing):**
      *   Use the requested structure: Desideratum -> Motivating Case -> Status (Non-negotiable/Preference).
      *   Ensure the "Uncertainty" requirement is prominent (posterior mean substitution is forbidden).
      *   Ensure the "Distinctions" are covered (Ensemble vs Time, etc.).
      *   Address the "Unsatisfiable" clause honestly.

  7.  **Review against Constraints:**
      *   *Did I cover one-shot vs long run?* Yes.
      *   *Did I cover uncertainty?* Yes.
      *   *Did I cover correlated outcomes?* Yes.
      *   *Did I cover ruin?* Yes.
      *   *Did I cover borrowing?* Yes.
      *   *Did I flag tensions?* Yes.
      *   *Did I provide the scorecard?* Yes.

  8.  **Final Polish:** Check tone. It needs to be authoritative, precise, and philosophical. Avoid colloquialisms. Ensure the distinction between "rational" (normative) and "optimal" (mathematical) is clear. (Self-Correction: Make sure to explicitly mention the "posterior mean substitution" error in the uncertainty desideratum).

      *(Self-Correction during drafting)*: I need to be careful about the "Utility Neutral" claim. Kelly is often marketed as utility-neutral (log utility is 'natural'), but strictly speaking, it *is* a specific utility function. The desideratum should be about whether the theory *requires* the user to specify a utility function or derives it from the structure of the problem. I will frame it as "Derivation of Risk Attitude."

      *(Refining the Unsatisfiable Section)*: The prompt asks to flag a subset suspected of being jointly unsatisfiable. The tension between "Utility Neutral" (objective rationality) and "Sensitive to Risk Tolerance" (subjective rationality) is the big one. Also, "One-shot rationality" vs "Long-run rationality" can conflict if the goal isn't defined. I will focus on the Objectivity vs. Subjectivity tension.

      *(Refining the Scorecard)*: Keep it tight. One or two lines each.

  9.  **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  ### Specification for a Theory of Rational Staking Under Uncertainty

  The following desiderata constitute the necessary conditions for a normative theory of betting in a multiplicative, uncertain environment. They are categorized by their logical status: **Non-Negotiable** (failure implies mathematical incoherence or sure loss) or **Camp Preference** (failure implies alignment with a specific school of thought, e.g., Kelly vs. Expected Utility).

  #### 1. The Ergodicity Distinction (Time vs. Ensemble)
  *   **Motivating Case:** A bettor faces a 50/50 proposition that either multiplies wealth by 0.6 or 1.5. The arithmetic expected value is positive ($1.05$), suggesting a bet. However, repeated play drives wealth to zero almost surely. A theory recommending this bet based on ensemble averages fails the individual bettor.
  *   **Requirement:** The theory must explicitly distinguish between the expectation over parallel worlds (ensemble average) and the expectation over time for a single trajectory (time average). It must prioritize the time-average growth rate for repeated play.
  *   **Status:** **Non-Negotiable.** Ignoring this collapses the theory into standard Expected Value maximization, which is suicidal under compounding.

  #### 2. The Ruin Boundary (Absorbing State)
  *   **Motivating Case:** The "All-In" strategy on a biased coin ($p=0.55$). While this maximizes expected terminal wealth in a finite horizon, a single loss terminates the process. A rational theory must treat wealth $\leq 0$ as an absorbing state that precludes future participation.
  *   **Requirement:** The prescribed stake must ensure the probability of ruin is zero (or asymptotically negligible) given the bettor's defined horizon, strictly prohibiting stakes that allow wealth to cross the absorbing boundary.
  *   **Status:** **Non-Negotiable.** Multiplicative processes are undefined or terminated at zero; a theory permitting ruin is not a theory of *sustained* staking.

  #### 3. Integration of Parameter Uncertainty (No Plug-In)
  *   **Motivating Case:** A bettor observes 10 heads in 10 flips and estimates $\hat{p}=1.0$. A naive Kelly formula using $\hat{p}$ prescribes betting the entire bankroll. The next flip is tails; the bettor is ruined. The theory must account for the width of the posterior distribution of $p$, not just its mean.
  *   **Requirement:** The optimal stake $f^*$ must be a functional of the full posterior distribution $P(p | \text{data})$, not merely $f^*(\mathbb{E}[p])$. As uncertainty (variance of the posterior) increases, the stake must decrease, even if the expected edge remains constant.
  *   **Status:** **Non-Negotiable.** Substituting the posterior mean into a known-probability formula is a category error that leads to systematic overbetting ("estimation risk").

  #### 4. Leverage and Borrowing Bounds
  *   **Motivating Case:** In a continuous market with positive drift, an Expected Terminal Wealth maximizer prescribes infinite leverage. A rational theory must explain why borrowing is limited even when the edge is positive.
  *   **Requirement:** The theory must derive an endogenous limit on leverage based on the volatility of the outcome distribution and the compounding constraint, rather than relying on exogenous margin limits.
  *   **Status:** **Non-Negotiable.** Without this, the theory prescribes strategies that guarantee ruin in continuous time or discrete approximations thereof.

  #### 5. Horizon Consistency (Myopic vs. Strategic)
  *   **Motivating Case:** A bettor knows the game ends in exactly $N=5$ rounds. Does the optimal stake differ from a game ending in $N=10,000$? Log-optimalists argue for myopic optimality (same stake); Expected Utility maximizers may argue for hedging near the end.
  *   **Requirement:** The theory must specify whether the stake is horizon-invariant (myopic) or horizon-dependent. It cannot claim to be long-run optimal while prescribing stakes that vary wildly with short-term horizons without justification.
  *   **Status:** **Camp Preference.** (Log-optimalists demand invariance; EU maximizers accept dependence).

  #### 6. Correlation and Non-Stationarity
  *   **Motivating Case:** Odds drift slowly, or outcomes cluster (hot/cold hands). A theory assuming IID outcomes will miscalculate the variance of the wealth path.
  *   **Requirement:** The staking rule must be robust to serial correlation and parameter drift, adjusting the stake dynamically as the generative process evolves, not just as the bankroll changes.
  *   **Status:** **Non-Negotiable** for real-world application, though often treated as a secondary extension in theoretical models.

  #### 7. Derivation of Risk Attitude (Objectivity vs. Subjectivity)
  *   **Motivating Case:** Two bettors face the same edge. One stakes 25%, the other 5%. Is one irrational? Kelly claims 5% is suboptimal growth; EU claims it reflects higher risk aversion.
  *   **Requirement:** The theory must state whether risk aversion is an input (subjective utility function) or an output (derived from the mathematics of compounding/survival). It cannot claim to be "utility-neutral" while implicitly enforcing a specific risk profile.
  *   **Status:** **Camp Preference.** (This is the primary fault line between Log-Optimal and Expected-Utility camps).

  ---

  ### Analysis of Joint Satisfiability

  **Suspected Unsatisfiable Subset:**
  The tension lies between **Desideratum 1 (Time Average/Growth)**, **Desideratum 3 (Parameter Uncertainty)**, and **Desideratum 7 (Utility Neutrality)**.

  1.  **The Conflict:** A truly "utility-neutral" theory (often claimed by Kelly proponents) suggests there is *one* rational stake derived from the math of compounding. However, once **Parameter Uncertainty** is introduced rigorously (Desideratum 3), the "optimal" stake becomes a function of the bettor's confidence interval. A bettor with a wide posterior (high uncertainty) *must* stake less to avoid ruin, effectively mimicking risk aversion.
  2.  **The Contradiction:** If the theory reduces the stake due to uncertainty, it is indistinguishable from a theory that reduces the stake due to risk aversion (utility curvature). Therefore, the theory cannot claim to be **Utility Neutral** (objective) while simultaneously being **Sensitive to Uncertainty** (which acts as a subjective constraint on the agent's knowledge state).
  3.  **One-Shot vs. Long-Run:** There is also a tension between handling the **One-Shot Bet** and the **Long-Run**. A stake rational for maximizing survival over 10,000 bets (Kelly) is often suboptimal for maximizing expected value in a single bet where ruin is not certain. A single theory cannot maximize both time-average growth and one-shot expected wealth simultaneously.

  **Is the List Satisfiable?**
  **No, not fully.** You cannot have a theory that is simultaneously utility-neutral, robust to parameter uncertainty, and optimal for both one-shot and infinite-horizon contexts. You must choose a primary objective: **Survival/Growth** (favors Kelly/Time Average) or **Preference Satisfaction** (favors EU/Ensemble Average).

  **The Most Exclusionary Requirement:**
  **Desideratum 1 (The Ergodicity Distinction).**
  This is the axe that chops off the trunk of classical decision theory. By demanding that the theory prioritize the time-average trajectory over the ensemble expectation, it immediately disqualifies Expected Wealth Maximization and standard Expected Utility Theory (unless the utility function is specifically logarithmic). It forces the geometric mean into the foundation of the logic, rendering arithmetic expectation irrelevant for rational staking decisions.

  ---

  ### Scorecard

  **Full Log-Optimal (Kelly)**
  *   **Score:** Fails on Parameter Uncertainty (overbets with plug-in estimates); Rigid on Risk Attitude.
  *   **Verdict:** Mathematically sound for known probabilities, but fragile in real-world estimation contexts.

  **Fixed Fraction (Fractional Kelly)**
  *   **Score:** Satisfies Uncertainty and Risk preferences heuristically; Lacks normative derivation for the fraction (why 1/2?).
  *   **Verdict:** Robust in practice, but theoretically ad hoc; treats the symptom of overbetting without solving the estimation problem.

  **Expected-Wealth Maximizer**
  *   **Score:** Fails Ergodicity and Ruin Boundary; Prescribes infinite leverage.
  *   **Verdict:** Mathematically incoherent for repeated multiplicative betting; guarantees ruin almost surely.

  **Generic Expected-Utility Maximizer**
  *   **Score:** Satisfiable if utility is specified; Fails Utility Neutrality (subjective); Often ignores Parameter Uncertainty.
  *   **Verdict:** Flexible but lacks normative bite; allows any behavior if the utility function is tuned post-hoc.
