answer: |-
  **The Scenario**

  A university research grant panel consists of 101 faculty members voting independently to accept or reject a proposal based on its written dossier; the true quality of the proposal is binary (worthy or unworthy), but the proposal itself is drawn from one of two categories unknown to the voters: "Standard Methodology" (78% of proposals) or "Paradigm-Shifting" (22% of proposals). In the Standard case, the evidence is clear enough that each voter independently identifies the true quality with probability 0.60, but in the Paradigm case, the shared disciplinary training of the faculty creates a systematic blind spot, causing each voter to independently misinterpret the evidence such that they identify the true quality with probability only 0.10 (they are confidently wrong). The voters do not know which category the proposal belongs to, they do not communicate, and they simply cast a binary vote based on their individual read of the text.

  **The Numbers**

  *   **Group Size ($n$):** 101 voters.
  *   **State Probabilities:** $P(\text{Standard}) = 0.78$, $P(\text{Paradigm}) = 0.22$.
  *   **Individual Competence:**
      *   Conditional on Standard: $p_S = 0.60$.
      *   Conditional on Paradigm: $p_P = 0.10$.
  *   **Marginal Competence (per voter):**
      $$p_{\text{marginal}} = (0.78 \times 0.60) + (0.22 \times 0.10) = 0.468 + 0.022 = 0.49$$
      *(Strictly below 0.5, satisfying spec 1)*
  *   **Group Accuracy (Majority Vote):**
      *   If Standard: Votes follow $\text{Bin}(101, 0.60)$. Mean = 60.6, SD $\approx 4.92$. Probability of majority ($\ge 51$ votes) $\approx \Phi(\frac{50.5 - 60.6}{4.92}) \approx \Phi(-2.05) \approx 0.98$.
      *   If Paradigm: Votes follow $\text{Bin}(101, 0.10)$. Mean = 10.1. Probability of majority $\approx 0$.
      *   Total Accuracy: $(0.78 \times 0.98) + (0.22 \times 0) \approx 0.76$.
      *(Strictly above 0.70, satisfying spec 2)*

  **The Mechanism and the Counterfactual**

  The single feature doing the work is **common signal quality** (a latent state variable that correlates voter competence). The voters are conditionally independent, but their competence is correlated because it depends on the same hidden feature of the proposal.

  If you remove this feature—meaning you keep the marginal probability $p=0.49$ for every voter but make their errors independent of each other (no common state)—the Condorcet Jury Theorem applies in its standard form. With i.i.d. voters where $p < 0.5$, the law of large numbers ensures the majority converges on the *wrong* answer as $n$ increases. For $n=101$ and $p=0.49$, the majority accuracy would collapse to roughly 46% (actually slightly less than individual competence due to the amplification of error). The group goes from 76% accurate to worse than a single coin flip solely by breaking the correlation structure while holding individual marginal skill constant.

  **The Roommate's Pushback**

  Your roommate is technically correct: this is Simpson's Paradox. If you condition on the proposal type, the "Paradigm" voters are incompetent ($p=0.1$), but the "Standard" voters are competent ($p=0.6$). The CJT holds conditional on the state. Their argument is that competence should always be measured conditional on the available common evidence; if you can't condition on it, you aren't measuring competence correctly, you're measuring a mixture of competence and environmental noise.

  This reply is strong theoretically but weak practically. In real committees (hiring, juries, grants), the "state" (e.g., is this candidate lying? is this evidence misleading?) is rarely observable beforehand. The practical lesson of the CJT is usually "aggregate independent judgments to beat noise." This case shows that aggregation only beats noise if the noise is idiosyncratic. If the noise is systemic (shared blind spots), adding more voters just gives you a more precise wrong answer. So, while your roommate saves the theorem mathematically by narrowing its domain, you win the practical argument: marginal competence is what administrators observe, and it is a dangerous metric if common shocks exist.

  **Honesty Check: The Cheat**

  The contrivance here is the $p=0.10$ in the Paradigm case. It is plausible that experts are noisy ($p=0.5$) or slightly better than noise ($p=0.55$) in unfamiliar fields. It is much harder to justify that they are *systematically inverted* ($p=0.10$) without some mechanism explaining why truth looks like falsehood to all of them equally (e.g., a shared ideological bias or a misleading heuristic). A sharp student will point out that ignorance usually yields randomness, not consistent error. To make this stick, you must emphasize that the "Paradigm" case triggers a specific, shared misconception (like assuming a new statistical method is flawed because it violates old assumptions), not just general confusion. If you change $p_P$ to 0.50, the marginal competence rises to 0.53, and the puzzle disappears. The case *requires* systematic bias in the minority state to drag the marginal average below 0.5 while keeping the majority state competent.
