  Here is the reconstruction of her principle, the call on your two cases, and the discriminating test case to settle the "nagging feeling" you have about subjecthood.

  ### 1. The Reconstruction: Constrained Associative Sovereignty

  Miriam is running a theory of **Constrained Associative Sovereignty**. It rests on three layers:

  1.  **The Presumption (Association & Authorship):** Groups (from homeowners to states to clubs) have a presumptive right to exclude based on their constitutive purpose and the labor/resources they invested (the "Authorship" intuition). This explains the Homeowner, the Chess Club (vs. non-player), the Firm, and the original Island verdict.
  2.  **The Rights Constraint (Anti-Discrimination):** This presumption is defeated if the exclusion is based on protected characteristics (gender, ethnicity) regarding essential goods or public accommodations. This explains the Chess Club (vs. woman) and the Landlord.
  3.  **The Necessity Constraint (Monopoly & Urgency):** This presumption is defeated if the excluding body holds a monopoly on an essential resource *and* the excluded party faces existential harm or has no reasonable alternative. This explains the School Lane (monopoly on access), the Refugee (existential need), and likely the Landlord (housing as essential).

  **The Firm Anomaly:** You noted the Firm case is oddly permissive. In her framework, employment is likely viewed as a *contractual* exchange, not a *residential* or *political* status, and labor markets are presumed competitive (unlike the monopoly lane or the border). Thus, the Necessity Constraint doesn't trigger for firms, but it does for landlords and states.

  ### 2. The Call on Your Two Cases

  Based on this reconstruction, here is how her theory should apply to your new scenarios:

  **Case 1: The Flood Family (Displaced, nowhere else to go)**
  *   **Verdict:** **Cannot Exclude.**
  *   **Reasoning:** This triggers the **Necessity Constraint**. Even though the Island Commonwealth has strong Associative/Authorship claims (they built it, unanimous vote), the "nowhere else habitable" condition mirrors the Refugee case. Existential need trumps associative freedom. If she allowed exclusion here, she would contradict her State/Refugee verdict unless she draws a hard line between "State" and "Private Commonwealth," which her "self-governing" language suggests she does not.

  **Case 2: The Returnee (Grew up there, left for uni, wants back)**
  *   **Verdict:** **Cannot Exclude.**
  *   **Reasoning:** This triggers the **Membership Constraint** (your "nagging feeling"). In political theory, citizenship is not lost by temporary absence. If the Island is a "Commonwealth" (a political analogue) rather than a "Club" (a private analogue), prior membership creates a right of return. Excluding her would treat the Commonwealth like a Chess Club (where membership lapses if you stop playing) rather than a State (where citizens remain citizens abroad). Given she treats the State as unable to exclude refugees (a humanitarian duty) but implies citizens belong, the Returnee has a stronger claim than the Refugee. To exclude her would be to treat political membership as purely consensual and revocable at whim, which undermines the "self-governing" stability she seems to value.

  ### 3. The Discriminating Case: The "Long-Term Guest"

  You suspected a fourth rule: *"Who has been living under whose rules."* This is the **All-Subjected Principle** (if you are subject to the coercive rules of a polity, you are entitled to membership/protection). This is distinct from Necessity (the Guest might have elsewhere to go) and distinct from Authorship (the Guest didn't build the place).

  To settle whether Miriam is running a **Consent Theory** (membership requires explicit agreement/vote) or a **Jurisdiction Theory** (membership arises from subjection/residence), put this case to her:

  **The Case:**
  > "A single outsider was granted a 10-year lease by the Founders 15 years ago. She lives on the island, pays local fees, sends her children to the school, and is subject to the Commonwealth's laws. She is not a 'member' (never voted in). The lease expires. The Commonwealth votes unanimously not to renew it and to evict her. She has a home elsewhere on the mainland (so no existential necessity), but she wishes to stay."

  **Why this settles it:**
  *   **If she says "May Evict":** She is running a **Consent/Associative Theory**. Membership is purely voluntary; living under the rules isn't enough without the unanimous vote. Your "nagging feeling" about subjecthood is wrong; for her, *authorship and consent* trump *subjection*.
  *   **If she says "May Not Evict":** She is running a **Jurisdictional/Political Theory**. Subjection to the rules generates a claim to membership (or at least security of tenure) that overrides the collective's desire for homogeneity. This confirms your hunch that "living under whose rules" is the hidden fourth variable.

  ### Summary for the Workshop
  Miriam's theory is stable so long as **Necessity** and **Prior Membership** act as trump cards against **Associative Freedom**. The Firm case is the outlier because she categorizes labor as non-essential/contractual. The "Long-Term Guest" case will reveal whether her "Commonwealth" is truly political (subjecthood creates rights) or just a fancy private club (consent creates rights). If she waffles on the Guest, ask her if the Island collects taxes from them; if yes, the "No Taxation Without Representation" principle should force her hand toward inclusion.
