answer: |-
  Hey, I was thinking about that seminar discussion you mentioned, and honestly your intuition is hitting on something way more significant than your friend's point about mathematicians losing their special status. That view assumes the value of mathematics is purely in the production of true statements, but if you look at it through the lens of computational complexity, the value shifts toward the accessibility of those statements. When we talk about explanation in science, we are not just talking about a logical relationship between premises and conclusions; we are talking about a cognitive relationship between a model and a mind. If a derivation exists but requires exponential time to traverse, it might be valid in a formal sense, but it fails as an explanation because it cannot be surveyed or grasped by a finite agent. This suggests that there is a defensible line between what is computable in principle and what is knowable in practice, and it is not merely a pragmatic limitation based on how fast our processors are or how long we are willing to wait. It is a structural limit on what counts as understanding.

  The core issue here is that classical computability theory, the stuff going back to Turing, treats all solvable problems as equally knowable because it ignores the resources required to solve them. If a problem is computable, it is theoretically knowable. But complexity theory introduces the dimension of scaling, showing that as the size of the input grows, the resources needed might grow so fast that they outstrip the physical capacity of the universe. When you apply this to the philosophy of science, it challenges the idea that a model is explanatory simply because it is formally correct. If applying the model to a specific phenomenon requires a computation that no physical system within our light cone could complete, then the model is ontologically real but epistemically closed. This moves the discussion away from pragmatism, which would say we just can't wait that long, toward a stronger claim that such a model does not provide understanding. Understanding seems to require compression, a way to see the necessity of the outcome without simulating every step, and if the only way to verify the outcome is through an intractable computation, the explanation remains opaque.

  This brings us to the distinction between worst-case hardness and average-case tractability, which is crucial for working scientists. Complexity theory often focuses on worst-case scenarios, proving that there exist instances of a problem that are incredibly hard to solve. However, science usually deals with the average case, the kind of data and structures that actually appear in nature. If the hard instances are rare pathological cases, then maybe nature is mostly tractable, and complexity theory doesn't limit scientific knowledge much. But if the average case for certain physical systems is also hard, then we have a problem. There is a real possibility that the laws of nature are simple to state but the consequences of those laws are computationally irreducible. This means the only way to know what happens is to run the system itself, effectively making prediction impossible without perfect simulation. In this scenario, the universe is not hiding its laws from us, but the mapping from laws to phenomena is so complex that it creates a barrier to knowledge that is not about our intelligence but about the structure of information processing itself.

  You asked whether verification itself might be structurally hard, and that is where the implications get really dark for epistemology. In the standard view of science, we propose a hypothesis and then verify it against evidence. We usually assume verification is easier than discovery. But if verification falls into a class of problems that is hard on average, then even checking whether a theory fits the data could be intractable. This would mean that there are true theories about the world that we could never confirm, not because we lack the data, but because processing the data to check the theory is too expensive. This creates a category of truths that are inherently opaque to finite minds. It is not that we are too stupid to find the proof, but that the proof itself is too large or complex to be held in any cognitive structure we possess. This suggests a limit to science that is not provisional; it is not just that we don't have the technology yet, but that the relationship between the theory and the evidence is too computationally dense to be bridged by beings like us.

  So when you are writing up your notes, I think the philosophical meat lies in redefining explanation as a resource-bounded concept. We need to argue that an explanation is not just a logical derivation but a tractable one. This avoids collapsing into pure pragmatism because it is not about human convenience; it is about the conditions required for cognitive access. If a derivation exceeds the computational bounds of the knower, it ceases to function as knowledge for that knower. This aligns with the idea that science is a human activity, not a god's-eye view of the universe. It implies that there might be domains of nature that are permanently beyond our explanatory reach, not because they are mystical or non-physical, but because they are computationally dense. The gap between P and NP, or between polynomial and exponential time, might actually map onto the gap between what is understandable and what is merely true. That seems like a much richer vein for your presentation than the question of whether mathematicians would lose their jobs, because it touches on the very limits of what finite beings can claim to know about an infinite or merely vast reality.
