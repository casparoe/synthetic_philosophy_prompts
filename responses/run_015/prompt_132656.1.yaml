prompt: |-
  I am writing a novel, and before I commit to the mechanics of the machine at its centre I want a specification rather than a survey. What I need from you is the desiderata: a list of what any account of backwards time travel in fiction would have to deliver to be good enough to underwrite four hundred pages — the cases it must resolve, the distinctions it must respect, the constraints it may not violate — with the scene or consideration behind each requirement, and a judgement about which requirements are non-negotiable and which are merely the prejudices of one camp or another. The purpose is fixed: I need rules a reader can infer from scenes rather than be told in an exposition chapter, rules that yield a determinate verdict at the end of any given scene about whether the intervention worked, and rules under which a character can be wrong about the mechanics and be surprised. Bear that purpose in mind when you decide what counts as a requirement.

  Below are the scenes I already know I want to write. For each, tell me what requirement it generates, and add the requirements I have not anticipated.

  My protagonist travels back to prevent a fire in which her brother died. She succeeds in the sense that the brother lives, yet the act by which she prevents it — cutting a wire, breaking a window, delaying a driver — is the act that starts it. Did the past change?

  She remembers the fire. Once she has intervened, does she still? If the timeline is overwritten rather than branched, whose memories does she carry, and is there any way for her to know that her intervention failed?

  The machine has a bounded range: certain years simply are not there to be reached. Is the boundary a fact about the machine, about the geometry of time, or about what is logically available? I need to know what fixes the reachable set, because I want the limit to feel like a discovery and not a manufacturer's specification.

  An object with no origin: a score my protagonist carries back to a composer who will later publish it, and which she copied from that publication. Is this the same problem as the grandfather case or a different one in kind, and must a theory handle them by the same device?

  The crowded room: she meets her younger self and they disagree about what to do. Which of them bears responsibility for what follows, and what should happen when the younger one later makes the trip herself?

  The slow news: if the past is altered, does the alteration reach her departure date at once, or only as she travels forward along her own worldline? Can the present she left be edited while she is still in the past, and can she be erased retroactively while still acting?

  The abandoned: on a branching account, what becomes of the people in the branch she leaves behind? I need to know whether her act is a killing, an abandonment, or nothing at all, since the moral weight of the book rests on the answer.

  Deliberation: on a fixed-timeline account, is trying still coherent? Can she deliberate about an outcome that is settled either way, and what in the prose should convey that her effort is real rather than illusory?

  Two further constraints, which I take to be external rather than optional. First, the theory must say what "going back to 1889" means given that the physics we actually have denies a global present; the date cannot be a bare fact about the universe. Second, it must give some account of the asymmetry between the directions — why travelling forward is trivially available while travelling back is the thing that needs a machine — or else explain why the asymmetry is only apparent.

  Once the list is assembled, tell me which pairs of desiderata you suspect cannot be jointly satisfied, and say plainly if the list itself turns out to be the real result here; that is the part I most want to see. Then tell me which single requirement does the most work in excluding candidates — which one, if I insisted on it, would collapse my options fastest. Close with a brief scorecard, no more than a few lines each, for the three familiar families: the fixed or self-consistent timeline, the branching timeline, and the overwritten or erased timeline. Keep the weight on the criteria and their motivating cases; I can extend the scoring myself.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Goal:** The user is writing a novel centered on a time travel machine. They need a *specification* (desiderata) for the mechanics, not a survey of existing theories.
      *   **Purpose:** The rules must underwrite 400 pages, be inferable from scenes (not exposition), yield determinate verdicts on interventions, and allow characters to be wrong/surprised.
      *   **Input:** A list of specific scenes/concepts the user already knows they want to write (Fire/Paradox, Memory, Bounded Range, Bootstrap Paradox, Meeting Self, Speed of Change, Abandoned Branches, Deliberation/Fate) + Two External Constraints (Relativity/Global Present, Temporal Asymmetry).
      *   **Output Requirements:**
          1.  List of desiderata (requirements) generated by the scenes + unanticipated ones.
          2.  For each: The scene/consideration, the requirement, and a judgment (Non-negotiable vs. Prejudice).
          3.  Analysis of incompatible pairs (which can't be jointly satisfied).
          4.  Identification of the "bottleneck" requirement (excludes candidates fastest).
          5.  Scorecard for the three familiar families (Fixed, Branching, Overwritten).
          6.  Tone: Rigorous, philosophical, practical for a novelist, avoiding exposition dumps.

  2.  **Deconstruct the Scenes & Generate Requirements:**

      *   *Scene 1: The Fire (Predestination Paradox).* She prevents the fire but causes it.
          *   *Requirement:* Causal Closure/Consistency. The mechanism must determine if the loop closes or breaks.
          *   *Judgment:* Non-negotiable for internal logic.

      *   *Scene 2: Memory (Overwrite vs. Branch).* She remembers the fire. Does she keep the memory if it didn't happen?
          *   *Requirement:* Persistence of Consciousness. How does the traveler's mind relate to the new timeline state?
          *   *Judgment:* Non-negotiable for character continuity.

      *   *Scene 3: Bounded Range.* Certain years unreachable.
          *   *Requirement:* Topology of Access. Is the limit mechanical or ontological?
          *   *Judgment:* Prejudice (could be either, but needs an in-universe reason).

      *   *Scene 4: The Score (Bootstrap Paradox).* Object with no origin.
          *   *Requirement:* Ontological Stability. Can information exist without creation?
          *   *Judgment:* Prejudice (some theories ban this, some allow it).

      *   *Scene 5: The Crowded Room (Meeting Self).* Two versions disagree.
          *   *Requirement:* Identity & Agency. Are they distinct agents? Who owns the future?
          *   *Judgment:* Non-negotiable for conflict resolution.

      *   *Scene 6: The Slow News (Speed of Change).* Does the future update instantly?
          *   *Requirement:* Propagation of Effect. Is time a block or a flowing river?
          *   *Judgment:* Non-negotiable for tension.

      *   *Scene 7: The Abandoned (Branching Ethics).* What happens to the left-behind branch?
          *   *Requirement:* Moral Ontology. Do abandoned timelines constitute death?
          *   *Judgment:* Non-negotiable for thematic weight.

      *   *Scene 8: Deliberation (Free Will vs. Fate).* Can she try if the outcome is fixed?
          *   *Requirement:* Phenomenology of Choice. Must feel real even if determined.
          *   *Judgment:* Non-negotiable for narrative drive.

      *   *External 1: Relativity (Global Present).* 1889 isn't a universal slice.
          *   *Requirement:* Frame of Reference. How is "when" defined?
          *   *Judgment:* Non-negotiable for hard SF credibility (though often hand-waved).

      *   *External 2: Asymmetry.* Why is forward easy, back hard?
          *   *Requirement:* Thermodynamic/Entropic Account. Why is retrograde costly?
          *   *Judgment:* Prejudice (could be magic, but needs consistency).

      *   *Unanticipated Requirements:*
          *   *Energy/Mass Conservation:* If she goes back, is mass duplicated?
          *   *Language/Drift:* Can she actually speak to people in 1889? (Linguistic relativity).
          *   *Biological Compatibility:* Germs, air, gravity.

  3.  **Evaluate Conflicts (Incompatible Pairs):**
      *   *Memory vs. Overwrite:* If the past is overwritten, why does she remember the old one? (Requires "Time Sickness" or external anchoring).
      *   *Deliberation vs. Fixed Timeline:* If it's fixed, deliberation is illusory. Hard to write convincingly without cheating.
      *   *Abandoned vs. Single Timeline:* You can't have moral weight of abandonment in a single timeline.
      *   *Relativity vs. Global Present:* Hard physics vs. Narrative simplicity.

  4.  **Identify the Bottleneck:**
      *   The "Memory/Persistence" requirement combined with "Overwrite" is usually the hardest to make logical without resorting to "magic."
      *   Actually, the *Propagation of Effect* (Slow News) combined with *Moral Ontology* (The Abandoned) is the biggest splitter. It forces the choice between Single vs. Branching immediately.
      *   *Decision:* The "Persistence of Consciousness" (Memory) vs. "Ontological Status of the Past" (Overwrite) is the tightest squeeze. If the past changes, *why* does the traveler remember the old one? This breaks most "Overwrite" models unless the traveler is outside time.

  5.  **Drafting the Response:**
      *   *Structure:* Follow the prompt's instructions precisely.
      *   *Tone:* Analytical, precise, slightly academic but aimed at a creator.
      *   *Content:* Ensure the distinction between "Non-negotiable" (logic/narrative necessity) and "Prejudice" (theoretical preference) is clear.

      *(Self-Correction during drafting)*: I need to make sure I don't just explain the theories, but define the *requirements* the theory must meet. The prompt asks for a *specification*.
      *   *Refinement on "Non-negotiable":* A requirement is non-negotiable if the story breaks without it. It's a prejudice if it's a choice between valid narrative modes (e.g., Branching vs. Fixed).
      *   *Refinement on "External Constraints":* The Relativity one is tricky. Most fiction ignores it. I should label it a "Hard SF Non-negotiable" but acknowledge it's often a "Prejudice" in soft SF. Given the prompt asks for a specification to underwrite 400 pages, I will treat consistency as non-negotiable, but the specific physical solution as a prejudice.

      *   *Refinement on the "Bottleneck":* The prompt asks which requirement excludes candidates fastest. The "Persistence of Consciousness" (Memory) is the killer. If you demand the traveler remembers the *old* timeline while the world reflects the *new* one, you kill simple Overwrite models. If you demand they *don't* remember, you kill the dramatic irony of the Fire scene.

      *   *Refinement on Scorecard:* Keep it brief. Focus on how they handle the criteria.

  6.  **Final Review against Prompt:**
      *   List of desiderata? Yes.
      *   Scene/consideration behind each? Yes.
      *   Judgment (Non-negotiable/Prejudice)? Yes.
      *   Unanticipated requirements added? Yes.
      *   Incompatible pairs identified? Yes.
      *   List itself as result? Acknowledge this possibility.
      *   Single requirement doing most work? Yes.
      *   Scorecard for three families? Yes.
      *   Tone check: Serious, analytical.

  7.  **Final Polish:** Ensure the distinction between "The Abandoned" (Branching ethics) and "The Fire" (Causal loop) is clear in the requirements. Ensure the "Global Present" constraint is addressed as a definition problem.

  *(Self-Correction on "The List is the Result"):* The prompt asks: "say plainly if the list itself turns out to be the real result here." I need to explicitly state that finding a system that satisfies *all* non-negotiables is likely impossible, meaning the act of choosing which "Prejudices" to elevate to "Non-negotiable" *is* the world-building work.

  Let's assemble the Desiderata.

  *   D1: Causal Consistency (Fire)
  *   D2: Mnemic Continuity (Memory)
  *   D3: Topological Accessibility (Range)
  *   D4: Ontological Genesis (Score)
  *   D5: Agent Distinction (Crowded Room)
  *   D6: Temporal Propagation (Slow News)
  *   D7: Branch Ontology (Abandoned)
  *   D8: Phenomenological Freedom (Deliberation)
  *   D9: Reference Frame Definition (Relativity)
  *   D10: Entropic Asymmetry (Forward/Back)
  *   D11: Mass/Energy Conservation (Unanticipated)
  *   D12: Linguistic/Biological Continuity (Unanticipated)

  Okay, ready to write.
answer: |-
  ### The Desiderata of Retrograde Mechanics

  Below is the specification derived from your scenes and constraints. Each entry isolates the mechanical problem, states the requirement necessary to resolve it in prose, and judges whether that requirement is a structural necessity for *any* coherent narrative (Non-negotiable) or a choice between competing metaphysical models (Prejudice).

  **1. Causal Closure**
  *   **Scene:** *The Fire.* The intervention causes the event it seeks to prevent.
  *   **Requirement:** The system must define whether causal loops are stable (the wire cut *must* spark the fire) or unstable (the wire cut *fails* to spark the fire, breaking the loop). It must provide a visible metric for "resistance" when a character attempts to violate consistency.
  *   **Judgment:** **Non-negotiable.** Without this, the climax lacks a verdict. The reader must know if the universe fights back or bends.

  **2. Mnemic Continuity**
  *   **Scene:** *Memory.* The protagonist remembers the fire after preventing it.
  *   **Requirement:** The theory must locate the traveler's consciousness relative to the timeline. If the past is overwritten, the traveler must be ontologically distinct from the timeline (an "external observer") to retain memories of the deleted state.
  *   **Judgment:** **Non-negotiable.** If she loses the memory, there is no story; if she keeps it without explanation, the mechanics are magical. The mechanism of retention must be inferable (e.g., physical device, biological anomaly).

  **3. Topological Accessibility**
  *   **Scene:** *Bounded Range.* Certain years are unreachable.
  *   **Requirement:** The limit must be derived from the same principle that enables travel. If the machine punches holes in spacetime, the boundary is structural (too thick to punch). If the machine slides along a manifold, the boundary is geometric (the edge of the shape).
  *   **Judgment:** **Prejudice.** This is a world-building choice. However, it cannot be arbitrary (e.g., "the dial stops at 1900"). It must feel like a law of nature, not a safety lock.

  **4. Ontological Genesis**
  *   **Scene:** *The Score.* An object with no point of creation.
  *   **Requirement:** The system must declare if information/matter can exist without an origin event. If yes, the universe allows closed causal curves for objects. If no, the score must degrade or vanish.
  *   **Judgment:** **Prejudice.** This defines the "cleanliness" of your universe. Hard SF tends to forbid this; mythic SF allows it. It must be consistent with *Causal Closure*.

  **5. Agent Distinction**
  *   **Scene:** *The Crowded Room.* Two versions of the same person interact.
  *   **Requirement:** The theory must establish if they share a "future." If the younger self travels later, do they arrive at the same moment the older self left? Are they one consciousness split, or two distinct entities?
  *   **Judgment:** **Non-negotiable.** This determines the stakes of their disagreement. If they are the same agent, disagreement is impossible (they share goals). If distinct, it is civil war.

  **6. Temporal Propagation**
  *   **Scene:** *The Slow News.* When does the future change?
  *   **Requirement:** The system must define the speed of "updates." Does the future change instantly (Block Universe), or does the traveler have to wait for time to pass (Moving Spotlight)?
  *   **Judgment:** **Non-negotiable.** This dictates tension. If changes are instant, she can check her phone to see if her brother lives. If she must wait, she is trapped in the past.

  **7. Branch Ontology**
  *   **Scene:** *The Abandoned.* The moral status of the left-behind timeline.
  *   **Requirement:** If branching occurs, the theory must state if the abandoned branch continues to exist independently. If it vanishes, the act is erasure. If it continues, the act is abandonment.
  *   **Judgment:** **Prejudice.** This is the primary moral axis of the novel. However, once chosen, it cannot be violated. You cannot have the guilt of abandonment in a single-timeline model.

  **8. Phenomenological Freedom**
  *   **Scene:** *Deliberation.* Trying to change a fixed outcome.
  *   **Requirement:** The prose must support the *feeling* of choice even if the outcome is determined. The mechanics must allow for uncertainty *during* the attempt, even if the result is fixed.
  *   **Judgment:** **Non-negotiable.** Without this, the protagonist is a puppet, and the narrative flatlines. The mechanics must hide the outcome from the actor until the act is complete.

  **9. Reference Frame Definition**
  *   **Constraint:** *Relativity.* "1889" is not a universal slice.
  *   **Requirement:** The machine must specify *whose* 1889 it is. Does it lock to Earth's geodesic? The Sun's? A universal cosmic time?
  *   **Judgment:** **Prejudice (with caveats).** In Soft SF, you may ignore this. In Hard SF, this is Non-negotiable. If you ignore it, you cannot claim physical rigor elsewhere.

  **10. Entropic Asymmetry**
  *   **Constraint:** *Forward/Back.* Why is return hard?
  *   **Requirement:** The cost function for retrograde motion must be defined. Is it energy? Entropy? Logical complexity? Forward motion must remain the "default" state.
  *   **Judgment:** **Prejudice.** But it must be consistent with *Topological Accessibility*.

  **11. Conservation of Mass/Energy (Unanticipated)**
  *   **Consideration:** When she arrives in 1889, mass is added to the universe. When she leaves, it is removed.
  *   **Requirement:** The theory must account for the displacement. Does air rush in? Does the universe balance the books?
  *   **Judgment:** **Prejudice.** Often ignored, but if you emphasize the physicality of the machine, this becomes Non-negotiable.

  **12. Linguistic/Biological Continuity (Unanticipated)**
  *   **Consideration:** 1889 air, germs, and language differ from the present.
  *   **Requirement:** The machine must provide protection or the protagonist must suffer consequences. Language drift must be accounted for in dialogue.
  *   **Judgment:** **Non-negotiable for realism.** If she speaks modern slang in 1889 without comment, the immersion breaks.

  ***

  ### Incompatible Pairs

  You cannot satisfy all the above. The following pairs create the fault lines where you must choose your model:

  1.  **Mnemic Continuity vs. Causal Closure (Overwrite Model):** If the timeline is overwritten (the fire never happened), there is no causal chain that produces her memory of the fire. To keep the memory, she must be outside the timeline. To be outside the timeline makes her immune to *The Abandoned* (she can't be erased). You must choose: does she remember (requiring external anchoring) or does she change (requiring internal integration)?
  2.  **Phenomenological Freedom vs. Causal Closure (Fixed Model):** If the timeline is fixed, her deliberation is illusory. Writing this convincingly without cheating (hiding information from the reader that the character should have) is notoriously difficult. The mechanics must support *uncertainty* even if the outcome is *certain*.
  3.  **Branch Ontology vs. Temporal Propagation:** If branches are real and independent (*The Abandoned* = real people), then *The Slow News* is irrelevant to the original timeline. The "present" she left is gone forever. This removes the race-against-time element of saving the present, replacing it with the guilt of leaving a dying world.

  ### The List as Result

  You asked me to say plainly if the list itself is the real result. **It is.**

  There is no known physical or metaphysical model that satisfies all "Non-negotiable" desiderata without contradiction. Specifically, **Mnemic Continuity** (remembering the old timeline) and **Branch Ontology** (the old timeline continues without you) are in tension with **Causal Closure** (the past is consistent).

  The work of your novel is not to find the "correct" physics, but to decide which of these contradictions you are willing to live with. The "mechanics" of your machine will simply be the justification you invent to paper over the gap you choose.

  ### The Bottleneck Requirement

  The single requirement that excludes candidates fastest is **Mnemic Continuity**.

  *   If you insist the protagonist remembers the original timeline *and* that the timeline is overwritten (her brother lives, the fire never happened), you eliminate **Single Fixed Timelines** (she wouldn't remember) and **Standard Branching** (she wouldn't be in the new branch to see the brother live).
  *   This forces you into a **Hybrid/Observer Model**: The traveler is anchored outside the causal stream. This is the hardest model to write because it makes the protagonist a ghost in the machine, potentially disconnected from the stakes.
  *   If you relax this (she forgets the old timeline), you open up **Overwritten** models, but lose the dramatic irony of *The Fire* scene.
  *   If you relax the "Overwrite" (the old timeline stays), you open up **Branching**, but lose the urgency of *The Slow News* (the home she left is already gone).

  Insisting on **Mnemic Continuity** alongside a **Determinable Verdict** (knowing if the intervention worked) collapses 80% of existing time travel fiction logic. It demands a specific, rigorous metaphysics of the self.

  ### Scorecard of Familiar Families

  **1. Fixed / Self-Consistent Timeline**
  *   **Verdict:** Satisfies *Causal Closure* and *Entropic Asymmetry* perfectly. Fails *Phenomenological Freedom* (choice is illusory) and *The Abandoned* (no branches to abandon).
  *   **Best for:** Tragedy, inevitability, mystery.
  *   **Fatal Flaw:** Hard to sustain tension in *Deliberation*; the protagonist is acting out a script.

  **2. Branching / Many-Worlds**
  *   **Verdict:** Satisfies *Causal Closure* (locally), *Phenomenological Freedom*, and *The Abandoned*. Fails *The Slow News* (the home timeline is unreachable/unchanged) and *Mnemic Continuity* (why does she care about the branch she left if she can't return?).
  *   **Best for:** Moral philosophy, consequences, sacrifice.
  *   **Fatal Flaw:** Dilutes the stakes of "saving the world," as the original world is not saved, only a copy is created.

  **3. Overwritten / Erased Timeline**
  *   **Verdict:** Satisfies *The Slow News* and *Mnemic Continuity* (if the traveler is anchored). Fails *Causal Closure* (paradoxes abound) and *The Abandoned* (is it murder to erase a timeline?).
  *   **Best for:** Adventure, fixing mistakes, high stakes.
  *   **Fatal Flaw:** Logically incoherent regarding *Memory*. Requires the "Magic Observer" exemption to function, which can feel like cheating if not established early.
