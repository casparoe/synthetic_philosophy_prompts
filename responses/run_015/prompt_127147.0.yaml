answer: |-
  This is a classic 1am philosophy rabbit hole, and you have stumbled onto one of the deepest problems in moral theory: the tension between **Aggregation** (summing up benefits/harms) and the **Separateness of Persons** (treating individuals as distinct entities who cannot be merged into a total).

  Your flatmate is a Total Utilitarian. You are intuitively a **Moderate Non-Aggregationist** with **Agent-Relative Permissions**. Your intuitions are actually more philosophically sophisticated than the utilitarian's, because they track distinctions that pure math misses (like the difference between harm within a life vs. across lives).

  The reason your draft principle ("compare worst outcomes... then count heads") feels wobbly is that it tries to be a single rule for two different moral jobs: (1) preventing catastrophe and (2) distributing fairness.

  Here are three candidate principles that systematize your verdicts, the costs of adopting them, and the predictions they make for your unsettled cases.

  ### Candidate 1: Scanlonian Contractualism (The "Complaint" Model)
  **The Principle:** An action is wrong if it violates principles that no one could "reasonably reject." Individuals make complaints based on how badly *they* are affected, not on the total sum.
  *   **How it fits your data:**
      *   **(4) & (5):** It explains why one person's death trumps a million pinpricks (the complaint about death is stronger than the complaint about a pinprick). It explains why one person's "million pinpricks" (torture) trumps a million people's single pinprick (intra-personal aggregation is allowed; inter-personal is restricted).
      *   **(3):** It allows for "special obligations" (your kid) because you can reasonably reject a principle that forces you to treat your child as a stranger.
      *   **(9):** It handles responsibility. The arsonist has a weaker "complaint" because he created the risk.
  *   **The Cost:** It struggles with **(2)**. In Contractualism, if the harm is identical (death), the group of 100 has a stronger collective complaint than the group of 96, because each individual in the 100 faces a higher risk of loss if you save the 96. It demands you save the 100, not flip a coin.
  *   **The Cost:** It struggles with **(8)**. Scanlon actually argues that when harms are identical, you *should* save the greater number to minimize individual risk. Your intuition that the lottery is a "cop-out" aligns with this, but your intuition on (2) (that 100 vs 96 is a wash) contradicts it.

  ### Candidate 2: Prioritarianism with a Threshold (The "Severity" Model)
  **The Principle:** Benefits count more the worse off the person is. However, there is a "catastrophe threshold." Once someone falls below this threshold (e.g., death), their claim becomes lexical (absolute) over those above it.
  *   **How it fits your data:**
      *   **(1) & (4):** Explains why death trumps lost hands (severity weighting). Explains why you save the 5 in (1) (same severity, so count heads).
      *   **(7):** Prioritarians are often risk-averse. A certain benefit to a worse-off person (the 1) can outweigh a probabilistic larger benefit to others.
  *   **The Cost:** It fails **(5)**. It doesn't inherently distinguish between "million pinpricks on one" vs. "one pinprick on a million." It just sums the disutility. You would have to add a rule about "Intra-personal Aggregation" to make it work.
  *   **The Cost:** It fails **(2)**. 100 deaths is worse than 96 deaths. It cannot justify a coin flip here without appealing to vagueness.

  ### Candidate 3: The "Significant Difference" View (Your Intuition Refined)
  **The Principle:** Numbers count, but only when the difference is *significant*. Moral obligations have "vagueness" built-in. Small differences in numbers do not override the separateness of persons; large ratios do.
  *   **How it fits your data:**
      *   **(2):** This is the only principle that validates your 100 vs 96 coin flip. It treats the difference of 4 lives as morally negligible compared to the certainty of the 96, whereas 5 vs 1 is a significant ratio (500%).
      *   **(1):** 5 vs 1 is a significant difference, so aggregation is permitted.
  *   **The Cost:** It is theoretically "messy." It admits there is no precise line where 96 becomes 100. It forces you to accept moral indeterminacy.
  *   **The Cost:** It struggles with **(7)**. Why is 51% of 6 not "significant" enough compared to 100% of 1?

  ---

  ### The Best Fit: Weighted Claims Contractualism
  If we synthesize these, the principle that captures most of your verdicts (specifically the hard ones like 3, 4, 5, and 9) is **Contractualism with Intra-Personal Aggregation and Agent-Relative Permissions.**

  To make this work, you have to accept that your intuition on **(2)** is the outlier. Most non-utilitarian theories still say save the 100 over the 96. If you hold firm on the coin flip, you are adopting a **Vagueness View**: *When the numerical difference is small relative to the total, the duty to save the greater number becomes indeterminate.*

  **Here is what this Best Fit principle predicts for your unsettled cases:**

  #### 1. The 20% Chance Case
  *Scenario:* You can save the five for sure (the one dies), OR you can save the five for sure but give the one a 20% chance of survival (perhaps using leftover resources or a secondary mechanism).
  *   **Utilitarian:** Obviously give the 20%. It's free utility.
  *   **Your Principle:** **Give the 20%.**
  *   **Reasoning:** Contractualism is about justification to each individual. The five cannot reasonably reject a policy that gives the one a 20% chance if it doesn't lower their own survival rate. The one *can* reasonably reject a policy that gives him 0% if a 20% chance was available at no cost to others.
  *   **Harder Version:** If giving the one a 20% chance *reduces* the five's chance from 100% to 99%?
  *   **Prediction:** **Save the five for sure.** The "Significant Difference" view suggests the 1% risk to the five (5 people x 1% = 5% total risk exposure) outweighs the 20% gain for the one. Your intuition in (7) (certainty preference) supports this.

  #### 2. The Drug Case (Quality/Quantity)
  *Scenario:* Save 5 people for 6 months each, or 1 person for 10 years. (Assuming all die otherwise).
  *   **Utilitarian:** Save the one (10 years > 2.5 years).
  *   **Your Principle:** **Save the five.**
  *   **Reasoning:** This tests your intuition (1) vs (4). In (4), you prioritized *Severity* (Death vs Hand). Here, the severity is identical (Death vs Death). The difference is *Duration*.
  *   According to the "Significant Difference" view, numbers count when severity is equal. Five lives is a 5:1 ratio. Even though the duration is shorter, the *claim to exist* is held by five distinct persons. Unless you view 6 months of life as "not worth saving" (below a threshold of significance), the five distinct claims outweigh the one extended claim.
  *   **Caveat:** If the 10 years represents a "complete life narrative" and the 6 months is merely biological existence, a Prioritarian might switch to the one. But based on your (1), you likely count heads when stakes are equal.

  #### 3. The "I Am The One" Case
  *Scenario:* You are the single person; five strangers are the group.
  *   **Utilitarian:** Save the five. You are not special.
  *   **Your Principle:** **Save yourself (or it is permissible to do so).**
  *   **Reasoning:** This is covered by your verdict (3). Contractualism allows for **Agent-Relative Permissions**. You have a special obligation to yourself (and your own projects/life) that you do not have to strangers. You are not required to be a martyr.
  *   **Nuance:** If you are a firefighter or doctor on duty, the "role obligation" overrides the "agent-relative permission." But as a private citizen, you are permitted to save yourself.

  ### Summary of the Trade-Off
  To keep your system coherent, you have to make one sacrifice. You cannot have **(2)** (100 vs 96 is a coin flip) and **(1)** (5 vs 1 save the 5) without accepting **Moral Vagueness**.

  *   **If you want precision:** You must admit that 100 > 96 is a duty, not a coin flip. (Adopt Contractualism).
  *   **If you want to keep the coin flip:** You must accept that morality is not always mathematically precise. (Adopt Vagueness/Threshold View).

  Given your reaction to Taurek, I suspect you are a **Threshold Non-Aggregationist**. You believe numbers count, but only when they make a *significant* difference to the outcome or the ratio. This validates your guilt in (1) (the one matters) but validates your indifference in (2) (the four don't matter enough to force a choice).

  **Final Verdict on your Flatmate:** The utilitarian calculation fails because it treats lives as gallons of water. Your intuition correctly identifies them as distinct vessels. You don't need to "cash out" the feeling about the one in case (1); that feeling *is* the moral data point that refutes the utilitarian. The one has a claim that is not erased by the five, even if it is outweighed. That is why you feel guilt, and why you are right to feel it.
