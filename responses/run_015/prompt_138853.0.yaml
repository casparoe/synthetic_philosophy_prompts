      *   *Nuance on "Signification":* Augustine cares about what the speaker *means*, not just the dictionary definition. So "Jargon" might still be a lie if the speaker *intends* the listener to grasp a falsehood, even if the words are technically true. I need to be careful there.
      *   *Midwives:* Ensure the distinction between "pardoned" and "justified" is clear.

  6.  **Final Review against constraints:** No footnotes? Check. No history recap? Check. Flag uncertainty? Check.

  *(Self-Correction during drafting the "Silent Version" section)*: I need to be careful. Augustine does discuss withholding truth. In *De Mendacio*, he suggests that hiding the truth isn't always lying, *unless* there is an obligation to speak. In a medical context, is there an obligation? Augustine doesn't have a "patient rights" framework. He has a "charity" framework. If silence harms charity, it's sinful, but is it *mendacium*? I should flag this distinction.

  *(Self-Correction on Midwives)*: The user asks if using the Midwives argument is a "dodge." I need to validate that intuition. It *is* a dodge because the teleology is different. Midwives = save life. Tuskegee = sacrifice life for data. Augustine hates sacrificing truth for utility, but he hates sacrificing life for utility too. The Tuskegee defenders are using a utilitarian argument disguised as Augustinian mercy. I need to point out that Augustine would see through that.

