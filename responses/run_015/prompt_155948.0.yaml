prompt: |-
  I sit on the heritage advisory panel of a mid-sized city. We must give written reasons for each decision, our decisions can be appealed, and our remit covers a mixed stock: street names, a school, a hospital wing, two statues on civic squares, a set of regimental plaques in a church, and a former workhouse we are turning into a museum. Reading what philosophers and historians have written about commemoration has not helped as much as I hoped, because nearly all of it argues case by case — this statue of a slave trader, that college named after an imperialist, those barracks named after a general — rather than saying what a position on such cases has to be able to do. So I want the specification before I want the verdicts.

  Set out the desiderata that any account of the ethics of commemoration in public space would have to meet to be adequate for a body in our position: what it must be able to decide, which distinctions it must be able to draw, which considerations from neighbouring areas (the theory of speech acts, the ethics of public reason under pluralism, the economics of network goods, the law of evidence) it must not contradict. Below is my draft list, with the case behind each entry. I want you to separate the genuine requirements from the prejudices of one camp, repair or discard the ones that are badly stated, add what is missing, and mark which are non-negotiable for us and which we could trade away.

  1. **Uptake profile.** A street name, a school name and a station name are things residents and pupils must utter and use daily; a statue on a roundabout can be walked past; a plaque in a museum must be sought out. Draft requirement: an account must either give different verdicts for objects with different uptake profiles or explain why that difference is morally inert. Case: renaming the street that holds a hundred households' addresses and two dozen businesses' letterheads, versus removing a figure from a square nobody crosses.

  2. **The composition of the standing stock.** Almost everyone we have ever commemorated did something we would now condemn, and we do not remove for mere mediocrity or private vice. Draft requirement: an account must not entail emptying the whole stock, or must bite the bullet and show that emptying it is correct. Case: our civic square, in which every one of the eight statues honours a man who profited from empire.

  3. **Anachronism and moral luck.** Draft requirement: the account must say whether the wrongdoing has to have been recognised as wrong at the time, and what to do with someone who scrupulously followed the norms of his own day. Case: a benefactor who endowed the city's hospitals with money made in the slave trade, in a jurisdiction where that was lawful, respectable and unremarkable.

  4. **Graded commemoration.** Draft requirement: it must distinguish "commendable on balance" from "commendable in every respect", and must permit partial, annotated or conditional commemoration rather than only keep-or-remove. Case: a street named after a campaigner for women's suffrage who was also an enthusiastic eugenicist.

  5. **Which speech act controls.** A monument is erected once and then stands for a century, during which its audience and its meaning change. Draft requirement: the account must say whether the original act of dedication or the present act of retaining it carries the weight, and how the two combine. Case: a memorial raised in 1900 as mourning for the dead of a colonial war, as against one raised two decades later explicitly as a claim about who rules the city.

  6. **Decision under historical uncertainty.** Draft requirement: the account must yield a decision when the record is contested, and must allocate the burden of proof between those who want retention and those who want removal. Case: a merchant whose fortune is disputed between slaving and ordinary trade, with the archive incomplete and two rival biographies in circulation.

  7. **Distributed burdens.** Removal and renaming impose costs on people who did no wrong: residents' addresses, businesses' branding, a charity's donor name, the affections of those who simply like the old name. Draft requirement: the account must weigh these against the expressive harm of retention and say whether they can be compensated or only regretted.

  8. **Commemoration versus testimony.** We preserve the wall where people were shot and the barracks of a camp without honouring anyone; we also possess a statue of the man who ordered it. Draft requirement: the account must mark the line between commemorating and testifying, and must say what "kept as evidence" does to an object's meaning — including what happens when an object removed from honour is quietly moved to a store rather than to a museum.

  9. **Publicity, pluralism and standing.** Draft requirement: the account must be statable as a public reason, must not rest on premises a reasonable citizen could reject, and must answer the question of who decides — an expert panel, an elected council, a referendum, the descendants of those wronged — separately from the question of what is right.

  10. **Genericity and settlement.** Draft requirement: the account must apply beyond our kind of case, and must take a view on time: whether longevity itself counts in an object's favour, whether a decision is ever final, and whether every retention should carry a review date.

  Three things I want flagged explicitly. First, any pair of desiderata you believe cannot be jointly satisfied — I suspect the pair is the demand for verdicts under empirical uncertainty with a burden-of-proof rule (6) together with the demand that an account never require a lay panel to settle contested history, but tell me if I have picked the wrong pair. Second, the single requirement that does the most work in excluding live positions. Third, any requirement that is really only a dislike of one camp's conclusions dressed up as a methodological constraint.

  Then, briefly — a small table at the end is fine, the criteria are the centrepiece, not the scoring — how four families of view fare against the list you end up with: retain-and-recontextualise; removal keyed to the gravity of the commemorated person's wrongdoing; procedural views that defer to whichever constituency is affected; and the abolitionist view that public space should not be in the business of honouring individuals at all.

  Please write in British English.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User Role:** Member of a heritage advisory panel in a mid-sized city.
      *   **Task:** Evaluate and refine a draft list of 10 desiderata (requirements) for an ethical account of commemoration in public space.
      *   **Goal:** Separate genuine requirements from prejudices, repair/discarding bad ones, add missing ones, and mark non-negotiable vs. tradeable.
      *   **Specific Constraints:**
          *   Must address three specific flags: (1) Incompatible pairs of desiderata, (2) The single most exclusionary requirement, (3) Requirements that are disguised prejudices.
          *   Must include a brief table evaluating four families of view against the refined list.
          *   Must use British English.
          *   Tone: Professional, philosophical, practical, advisory.
      *   **Context:** The panel writes reasoned decisions, faces appeals, covers mixed stock (names, statues, plaques, buildings), and finds existing literature too case-specific. They need a *specification* for a theory, not the theory itself yet.

  2.  **Evaluate the Draft Desiderata (1-10):**

      *   *1. Uptake profile:* Crucial. A street name is coercive/ubiquitous; a museum plaque is voluntary. This distinguishes the *harm* of retention. **Keep/Refine.**
      *   *2. Composition of standing stock:* The "emptying the stock" problem. If we judge by today's standards, everyone falls. We need a principle that avoids nihilism without whitewashing. **Keep/Refine.**
      *   *3. Anachronism and moral luck:* The "they didn't know better" defence. Essential for historical fairness. **Keep.**
      *   *4. Graded commemoration:* Nuance. Not binary keep/remove. Contextualisation. **Keep.**
      *   *5. Which speech act controls:* Original intent vs. current reception. Semiotics of monuments. **Keep.**
      *   *6. Decision under historical uncertainty:* Burden of proof. Very practical for a panel. **Keep.**
      *   *7. Distributed burdens:* Cost of change vs. harm of status quo. Practical constraint. **Keep.**
      *   *8. Commemoration versus testimony:* Museum vs. Square. Evidence vs. Honour. **Keep.**
      *   *9. Publicity, pluralism and standing:* Public reason. Who decides? **Keep.**
      *   *10. Genericity and settlement:* Consistency and finality. **Keep.**

      *   *Critique:* The user asks to identify prejudices disguised as constraints.
          *   *Potential Prejudice:* #2 ("must not entail emptying the whole stock") could be seen as a conservative bias. However, for a *functioning* city, a blank slate is practically impossible. It's a feasibility constraint, not necessarily moral.
          *   *Potential Prejudice:* #9 ("public reason") might exclude religious or comprehensive doctrines, but for a *public* panel, this is standard liberal democratic procedure, not a prejudice.
          *   *Potential Prejudice:* #4 ("permit partial... commemoration") assumes contextualisation is always possible/effective. Sometimes removal is the only moral option. But as a *desideratum* for the theory (it must *allow* for this possibility), it's valid.

      *   *Missing Elements:*
          *   *Forward-looking vs. Backward-looking:* Commemoration isn't just about the past; it's about the future values we signal.
          *   *The "Counter-Monument" possibility:* Can we add to the landscape rather than subtract?
          *   *Legal/Statutory Constraints:* The panel operates within law (equality acts, planning law). The theory shouldn't demand illegality.

  3.  **Address the Three Flags:**

      *   *Flag 1 (Incompatible Pair):* The user suspects #6 (uncertainty/burden of proof) vs. "never require a lay panel to settle contested history." Actually, #6 *requires* the panel to decide despite uncertainty. The tension is between *epistemic humility* and *decisional necessity*. I should clarify this. The real tension might be between #9 (Public Reason/Pluralism) and #2 (No Emptying). If the public reasonably rejects the heroes, #2 forces retention against #9.
      *   *Flag 2 (Most Exclusionary):* Likely #9 (Public Reason) or #4 (Graded Commemoration). #9 excludes sectarian justifications. #4 excludes binary abolitionists or hardline retentionists. I'd argue #9 is the heavy lifter for a public body.
      *   *Flag 3 (Disguised Prejudice):* #2 is the strongest candidate. "Must not entail emptying the whole stock" sounds like "We must keep statues." It should be reframed as "Feasibility and Continuity."

  4.  **Refining the List (The "Specification"):**

      *   *Non-negotiable:* Legal compliance, Public Reason (legitimacy), Uptake (harm assessment).
      *   *Tradeable:* Finality (reviews can happen), Specific burden of proof rules (can vary).
      *   *Additions:* Forward-looking function (what values do we promote?), Counter-monuments (addition vs. subtraction).

  5.  **Drafting the Response (Iterative Process):**

      *   *Introduction:* Acknowledge the sophistication of the draft. Validate the need for a specification before a theory.
      *   *Section 1: The Refined Desiderata.* Go through 1-10, editing for clarity and neutrality. Mark Non-negotiable (NN) vs. Tradeable (T).
      *   *Section 2: The Three Flags.* Address the incompatibility, the exclusionary requirement, and the prejudice.
      *   *Section 3: The Table.* Evaluate the four views (Retain/Recontextualise, Removal/Gravity, Procedural, Abolitionist).
      *   *Language:* British English (honour, programme, centre, etc.).

      *(Self-Correction during drafting)*:
      *   *On Flag 1:* The user's suspicion about #6 is interesting. If the record is contested, a burden of proof rule *forces* a decision. The tension is actually between #6 and a demand for *historical truth* rather than *procedural resolution*. I will refine this to be about "Decisional Closure under Epistemic Uncertainty."
      *   *On Flag 3:* I need to be careful not to accuse the user of bias, but rather point out where a *preference for continuity* might be masquerading as a *logical requirement*. #2 is the one. "Emptying the stock" is logically possible, just practically disastrous. The requirement should be about *social continuity*, not the stock itself.
      *   *On Missing:* I need to add something about the *forward-looking* nature of public space. Commemoration is pedagogical.

  6.  **Final Polish:** Check against the prompt's specific requests.
      *   Separate genuine requirements from prejudices? Yes.
      *   Repair/discards? Yes.
      *   Add missing? Yes.
      *   Mark NN vs Tradeable? Yes.
      *   Flag 1, 2, 3 explicit? Yes.
      *   Table at the end? Yes.
      *   British English? Yes.

  7.  **Final Review of the "Three Flags" logic:**
      *   *Incompatibility:* I think the real tension is between #9 (Public Reason/Pluralism) and #3 (Anachronism). If a group reasonably rejects the "norms of the day" defence (e.g., slavery was always wrong), #3 forces a historical view they reject. However, the user's suggestion (#6 vs lay panel) is also valid. I will address the user's suggestion but refine it. Actually, the user's suspicion is: #6 (must yield decision) vs "never require lay panel to settle history". If #6 demands a decision, the panel *must* settle the history enough to decide. So they are in tension. I will confirm this tension.
      *   *Exclusionary:* #9 (Public Reason) is the big one. It rules out "God told us" or "My ancestors feel pain" as *sufficient* public reasons without translation.
      *   *Prejudice:* #2 (Composition of Stock). It assumes continuity is a value.

      *Wait, let's look closer at #6.* "Decision under historical uncertainty." If the requirement is "must yield a decision," that's administrative necessity. If the requirement is "must allocate burden of proof," that's legalistic. The tension is: Can a heritage panel act as a court of historical record? No. So #6 needs to be framed as "Administrative Closure," not "Historical Verdict."

      *Let's look at #2 again.* "Must not entail emptying the whole stock." This is a *reductio ad absurdum* check. If a theory implies we should remove *everything*, the theory is likely flawed for *public* space. Is this a prejudice? It privileges the status quo. A better framing is "Social Continuity."

      *Okay, ready to write.*
answer: |-
  This is a sophisticated brief. You are correct that the literature often stalls on the *verdicts* (remove/retain) without establishing the *specification* (what a valid verdict looks like). For a statutory body facing appeals, the robustness of the decision-making framework matters as much as the outcome.

  Below is the refined specification. I have edited your draft for neutrality, added missing structural constraints, and categorised them by negotiability. Following that, I address your three specific flags, and conclude with the comparative table.

  ### Part I: The Refined Specification

  I have retained the core of your ten points but sharpened the language to distinguish between *administrative necessities* (what your panel must do to function) and *moral aspirations* (what the ethics should achieve). I have added two new requirements regarding the forward-looking function of public space and legal compliance.

  **Legend:** **[NN]** = Non-negotiable (statutory or functional necessity); **[T]** = Tradeable (ethical preference, open to weighting).

  1.  **Uptake and Coercion Profile.** [NN]
      *   *Refinement:* The account must distinguish between passive exposure (a statue one may avoid) and active coercion (a street name one must use for banking, post, or identity).
      *   *Reasoning:* The harm of offensive commemoration scales with the inability to opt out. A theory that treats a hospital wing name identically to a bus route name fails to capture the lived experience of the citizen.

  2.  **Social Continuity and the 'Empty Stock' Test.** [T]
      *   *Refinement:* The account should not recommend the removal of the entire standing stock unless it can demonstrate that a society can function without historical markers. It must distinguish between *historical presence* and *honour*.
      *   *Reasoning:* (See Flag 3 below). This is not a veto on removal, but a check against moral nihilism. If a theory implies we should erase all history because all history is tainted, it is practically self-defeating for a heritage body.

  3.  **Temporal Jurisdiction (Anachronism).** [T]
      *   *Refinement:* The account must specify the weight of *contemporary recognition*. Did the subject have access to moral concepts that would have flagged their actions as wrong?
      *   *Reasoning:* This prevents presentism, but must be balanced against 'timeless crimes' (e.g., crimes against humanity that were contested even at the time).

  4.  **Granularity of Response.** [NN]
      *   *Refinement:* The account must support a spectrum of outcomes beyond binary retention/removal. This includes contextualisation, counter-monuments, relocation, or repurposing.
      *   *Reasoning:* Your statutory remit likely allows for recommendations short of demolition. A binary ethical theory renders half your toolkit unusable.

  5.  **Semantic Drift and Reception.** [T]
      *   *Refinement:* The account must weigh the original dedicatory intent against the current public reception. It must decide if a monument is a fossil (historical record) or a voice (current speech).
      *   *Reasoning:* A 1900 statue may have meant 'mourning' then but 'supremacy' now. The theory must explain which meaning governs public space.

  6.  **Administrative Closure under Uncertainty.** [NN]
      *   *Refinement:* The account must provide a decision rule when historical facts are contested. It must allocate the burden of proof without requiring the panel to act as a court of historical record.
      *   *Reasoning:* You must decide by Tuesday. The theory cannot demand perfect historical consensus.

  7.  **Transition Costs and Distributed Burdens.** [T]
      *   *Refinement:* The account must acknowledge the material and emotional costs of change (addresses, branding, attachment) and weigh them against the expressive harm of retention.
      *   *Reasoning:* Public ethics requires stewardship of public funds and social capital. However, this cannot be a veto; costs can be outweighed by grave harm.

  8.  **The Testimony/Honour Distinction.** [NN]
      *   *Refinement:* The account must define the boundary between preserving an object as *evidence* of the past versus *endorsing* the values of the past.
      *   *Reasoning:* This is crucial for your museum/workhouse case. Keeping a whip in a glass case is testimony; keeping a statue of the whip-wielder on a plinth is honour.

  9.  **Public Justifiability and Standing.** [NN]
      *   *Refinement:* The reasons given must be accessible to reasonable citizens regardless of their comprehensive moral doctrines (religious, ideological). It must also specify who holds standing to object (residents, descendants, the general public).
      *   *Reasoning:* As a public body, you cannot rely on premises that a significant portion of the electorate reasonably rejects (e.g., specific theological claims).

  10. **Forward-Looking Function.** [New] [NN]
      *   *Refinement:* The account must articulate what public space is *for*. Is it to reflect history accurately, or to signal the values we aspire to hold today?
      *   *Reasoning:* Your draft focused on the past. But commemoration is pedagogical. A theory that ignores the future signal sends you blind.

  11. **Legal and Statutory Compliance.** [New] [NN]
      *   *Refinement:* The account must not recommend actions prohibited by existing law (e.g., listed building consent, equality legislation).
      *   *Reasoning:* An ethical theory that mandates illegality is useless to a statutory panel.

  ---

  ### Part II: The Three Flags

  You asked for explicit flagging of tensions, exclusionary power, and disguised prejudices.

  **1. The Incompatible Pair**
  You suspected a tension between **Desideratum 6** (Decision under uncertainty) and the idea that a lay panel should not settle contested history. You are correct, but the tension is sharper.
  The genuine incompatibility lies between **Desideratum 6 (Administrative Closure)** and **Desideratum 3 (Temporal Jurisdiction/Anachronism)**.
  *   *Why:* To apply Desideratum 3 fairly, you need robust historical evidence about what was "knowable" or "contested" at the time. Desideratum 6 admits you often lack this evidence and must decide anyway.
  *   *Resolution:* You must treat Desideratum 3 as a *presumption* rather than a fact-finding mission. If the record is unclear (per #6), the default should be to assume the subject was not a moral outlier *unless* there is clear evidence of contemporary dissent. This protects you from having to settle deep historical debates to make a planning decision.

  **2. The Most Exclusionary Requirement**
  **Desideratum 9 (Public Justifiability)** does the most work in excluding live positions.
  *   *Why:* It rules out arguments based solely on "This hurts my feelings" (subjective), "God condemns this" (sectarian), or "This is our heritage" (exclusive to one group). It forces all arguments into the language of shared civic values (equality, democracy, historical truth).
  *   *Impact:* This excludes radical particularist views (e.g., "Only descendants can decide") and radical universalist views that rely on non-public metaphysics. It forces the debate onto ground where you can actually write a defensible reason for decision.

  **3. The Disguised Prejudice**
  **Desideratum 2 (Social Continuity/Empty Stock)** is the strongest candidate for a preference dressed as a constraint.
  *   *Why:* It assumes that *having* statues is a good thing. An abolitionist (see table below) would argue that the "stock" itself is the problem. By framing "emptying the stock" as a *reductio ad absurdum*, you are pre-loading the dice in favour of retention.
  *   *Repair:* I have reframed it above to focus on *Social Continuity*. The requirement is not that statues must remain, but that the *narrative of the city* must remain intelligible to its inhabitants. We can remove statues without erasing the story, provided we have a mechanism (like Desideratum 8, Testimony) to explain the absence.

  ---

  ### Part III: Evaluation of Four Families of View

  This table assesses how four common theoretical approaches fare against the refined specification.

  | View | Performance against Specification | Critical Failure Point |
  | :--- | :--- | :--- |
  | **Retain & Recontextualise**<br>(Keep the object, add plaques/context) | **Strong** on Continuity (2), Costs (7), and Testimony (8).<br>**Weak** on Uptake (1) and Public Justifiability (9). | **Uptake Profile.** Contextualisation often fails to neutralise the coercive nature of a street name or a dominant statue. People do not read the plaques. It risks satisfying the panel's need for nuance while failing to reduce the daily harm to residents. |
  | **Removal Keyed to Gravity**<br>(Remove only for 'egregious' moral crimes) | **Strong** on Public Justifiability (9) and Anachronism (3).<br>**Weak** on Uncertainty (6) and Granularity (4). | **Administrative Closure.** This view requires you to settle the "gravity" of historical sins. It forces the panel into the role of moral judges of the dead, which creates high litigation risk and historical controversy (Flag 1). |
  | **Procedural / Constituency**<br>(Defer to the affected community/descendants) | **Strong** on Standing (9) and Costs (7).<br>**Weak** on Public Justifiability (9) and Genericity (10). | **Public Reason.** If two constituencies disagree (e.g., locals want retention, descendants want removal), this view offers no tie-breaker. It also struggles to justify decisions to the wider public who fund the space but aren't in the specific constituency. |
  | **Abolitionist**<br>(No individual honour in public space) | **Strong** on Uptake (1), Anachronism (3), and Future Function (10).<br>**Weak** on Continuity (2) and Costs (7). | **Social Continuity.** While ethically consistent, it fails the 'Empty Stock' test violently. For a heritage panel, recommending the removal of *all* names/statues is practically impossible and likely ultra vires (beyond your legal power). It is a policy for a new city, not a mid-sized existing one. |

  ### Summary Advice

  For your panel's purpose, the **Retain & Recontextualise** model is the most administratively viable, but you must tighten the **Uptake Profile (1)** constraint. Do not allow "context" to justify "coercion." If a name is on a street (high uptake), contextualisation is insufficient; removal or change is required. If a statue is in a park (low uptake), contextualisation may suffice.

  Use **Desideratum 9 (Public Justifiability)** as your shield against appeals. If your reasons are framed in shared civic values rather than historical verdicts or emotional harms, they will withstand legal challenge better than any other approach.
