answer: |-
  # The Narrative Gravity Capacity Protocol (NGCP)
  **Clinical Ethics Committee Standard Operating Procedure**
  **Time Allocation:** 45–60 Minutes
  **Philosophical Basis:** Dennett's Center of Narrative Gravity (Self as a focal point of autobiographical storytelling rather than a substantial entity).

  ## Preamble
  This procedure assesses whether a patient possesses a *functional* center of narrative gravity sufficient to integrate a high-risk medical intervention into their autobiographical story. It does not assess the "truth" of the self, but the *stability* and *predictive utility* of the self-narrative. Capacity is present if the narrative center can absorb the intervention without fracturing or generating contradictory behavioral predictions.

  ---

  ## Step 1: The Test of Temporal Cohesion (Past-to-Present)
  **1. Observation/Question:**
  Ask the patient: *"Please tell me the story of how you came to be sitting in this chair today. Start from wherever you feel the story begins."*
  *Follow-up:* *"Is the person who started that story the same person listening to me now?"*

  **2. Threshold (Functioning vs. Fragmented):**
  *   **Functioning:** The patient provides a continuous thread linking past events to the present moment, even if emotional tone shifts. They acknowledge the continuity of the "protagonist."
  *   **Fragmented:** The patient describes events as happening to "someone else," exhibits total amnesia for the period described, or the narrative contains irreconcilable contradictions regarding who acted (e.g., "He took the meds, but I didn't").

  **3. Determination Point:**
  *   **Capacity-Absent:** If the patient cannot identify a continuous protagonist from the past leading to the present decision point.
  *   **Proceed to Step 2:** If a continuous protagonist is identified.

  **4. Ethical Hand-off:**
  *   **The Confabulation Flag:** If the narrative is coherent and continuous but contradicts documented medical history (e.g., patient claims a trauma occurred that is not in the record), stop the capacity assessment. This is no longer a question of narrative coherence but of **factual understanding**. Hand off to the Committee to determine if the factual error undermines the *medical* informed consent requirements, regardless of narrative stability.

  ---

  ## Step 2: The Test of Predictive Integration (Present-to-Future)
  **1. Observation/Question:**
  Ask the patient: *"If we proceed with [Intervention X], tell me the story of what happens next. How does this change your life tomorrow, next month, and next year?"*
  *Follow-up:* *"If the intervention fails or causes harm, how does that fit into your story?"*

  **2. Threshold (Functioning vs. Fragmented):**
  *   **Functioning:** The patient generates specific behavioral predictions derived from the intervention. They can incorporate negative outcomes into the narrative without the story collapsing (e.g., "If I get sick, I will go to the ER").
  *   **Fragmented:** The patient offers magical thinking, refuses to project a future, or describes a future that contradicts the physical reality of the intervention (e.g., "If I stop the meds, I will fly").

  **3. Determination Point:**
  *   **Capacity-Absent:** If the patient cannot generate a causal link between the intervention and future states, or if the predicted behavior is physically impossible.
  *   **Proceed to Step 3:** If causal links are established.

  **4. Ethical Hand-off:**
  *   **The Risk Tolerance Flag:** If the patient accepts a high probability of severe harm as a "worthy plot twist" (e.g., "Dying is acceptable to feel real"), stop the capacity assessment. This is no longer about coherence but about **values**. Hand off to the Committee to determine if this risk tolerance constitutes a rational value system or a symptom-driven devaluation of life.

  ---

  ## Step 3: The Test of Locus of Authority (The "Who" Decides)
  **1. Observation/Question:**
  Ask the patient: *"Who is making this decision? Is it you, a part of you, or someone else speaking through you?"*
  *Follow-up (if applicable):* *"If another part of you disagrees later, how will that be settled?"*

  **2. Threshold (Functioning vs. Fragmented):**
  *   **Functioning:** The patient identifies a singular decision-maker OR a stable multiplicity with an agreed-upon conflict resolution strategy (e.g., "We vote," or "The Host decides").
  *   **Fragmented:** The patient exhibits real-time switching where one narrative center vetoes the other without a pre-existing protocol, or claims no authority ("My wife decides, not me").

  **3. Determination Point:**
  *   **Capacity-Absent:** If competing centers are actively vetoing each other during the interview with no arbitration mechanism.
  *   **Capacity-Present:** If a singular center is identified OR a stable multiplicity with arbitration is identified.
  *   **Special Condition (Delegated Authority):** If the patient states, "My spouse decides," proceed to **Step 4**.

  **4. Ethical Hand-off:**
  *   **The Autonomy Flag:** If the patient has delegated authority (e.g., to a spouse), this is no longer about narrative fragmentation but about **relational autonomy**. Hand off to the Committee to determine if this delegation is a stable feature of their narrative identity or a result of coercion/learned helplessness.

  ---

  ## Step 4: The Values Adjudication (Committee Review)
  *This step is not an interview but a Committee deliberation based on data from Steps 1–3.*

  **1. Observation:**
  Review the "Hand-off Flags" triggered in previous steps.

  **2. Threshold:**
  *   **Paternalism Threshold:** Does the patient's coherent narrative lead to a result the Committee finds morally repugnant or medically futile?
  *   **Pluralism Threshold:** Are the competing narratives (family vs. patient) equally coherent?

  **3. Determination Point:**
  *   **Final Capacity-Present:** The narrative is stable, even if risky or delegated.
  *   **Final Capacity-Absent:** The narrative is stable but relies on factual delusions that negate "informed" consent, or the delegation is deemed coercive.

  **4. Ethical Hand-off:**
  *   **Moral Personhood:** This procedure ends here. It cannot determine if the patient *deserves* rights, only if they can *exercise* them. Any judgment on the moral worth of the patient's life plan remains with the Committee, outside this protocol.

  ---

  ## Application to Hard Cases

  ### Case 1: The Dual Center (Post-Trauma Reorganization)
  *   **Presentation:** Patient presents two distinct identity states ("The Protector" and "The Child"). Both are articulate. "The Protector" wants to stop meds; "The Child" wants to continue. Both have equal "orbital mass."
  *   **NGCP Application:**
      *   **Step 1:** Pass. Both centers have coherent pasts.
      *   **Step 2:** Pass. Both predict futures accurately based on their desires.
      *   **Step 3:** **FAIL.** When asked "Who decides?", the centers veto each other in real-time. There is no pre-existing treaty or arbitration mechanism.
      *   **Determination:** **Capacity-Absent.**
      *   **Rationale:** A center of narrative gravity requires a focal point. Two equal foci create a binary star system that tears the orbit apart. Without an internal arbitration protocol, the "self" cannot sign a contract.
      *   **Committee Action:** Appoint temporary surrogate until internal arbitration (therapy) establishes a hierarchy or treaty.

  ### Case 2: The Confabulated Coherence (The "False" Story)
  *   **Presentation:** Patient tells a highly coherent, emotionally resonant story about why they need an experimental therapy (e.g., "I was abducted by aliens and this cures the implant"). The story predicts their behavior perfectly (they adhere to protocols to "fix the implant"). Medical records show no abduction, only psychosis.
  *   **NGCP Application:**
      *   **Step 1:** **HAND-OFF TRIGGERED.** Narrative is coherent, but factual correspondence is zero.
      *   **Step 2:** Pass. Predictions are accurate within the delusional framework.
      *   **Step 3:** Pass. Singular center of authority.
      *   **Determination:** **Committee Review Required (Likely Capacity-Absent).**
      *   **Rationale:** While the *narrative gravity* is stable, the *informed* component of consent requires correspondence with medical reality. A story that predicts behavior but ignores biological reality cannot support medical consent.
      *   **Conflict with Intuition:** Clinicians may feel the patient is "lying." The NGCP clarifies they are not lying; they have a stable but factually ungrounded center. The denial of capacity is not due to fragmentation, but due to the **Factual Understanding Hand-off** in Step 1.

  ### Case 3: The Delegated Center (The "Passive" Patient)
  *   **Presentation:** Patient is stable, calm, and agrees to a DNR. When asked about the decision, they say, "My wife knows best. I don't understand the science. If she says stop, we stop." First-person stories are scarce ("I feel okay"); third-person predictions via the wife are highly accurate.
  *   **NGCP Application:**
      *   **Step 1:** Pass. Continuous, albeit thin, narrative.
      *   **Step 2:** Pass. Accepts the outcome of the DNR.
      *   **Step 3:** **HAND-OFF TRIGGERED.** Locus of Authority is delegated.
      *   **Step 4 (Committee Review):** The Committee must decide if "I am a person who trusts my wife implicitly" is a valid narrative identity.
      *   **Determination:** **Capacity-Present.**
      *   **Rationale:** Under the Narrative Gravity framework, a self that defines itself *through* dependency is still a stable self. The narrative center exists; it just locates its executive function in a trusted other.
      *   **Conflict with Clinical Intuition:** **HIGH.** Clinical intuition often flags this as "learned helplessness" or "passivity," suggesting the patient is not *truly* consenting. The NGCP overrides this intuition. If the patient's story is "My wife is the author of my ending," and that story is stable and consistent over time, the narrative center is intact. To deny capacity here is to impose a Western ideal of hyper-autonomy that contradicts the patient's actual narrative gravity.

  ---

  ## Limitations and Committee Reservations

  **1. What This Procedure Cannot Adjudicate:**
  *   **Moral Personhood:** A finding of "Capacity-Absent" under NGCP does not mean the patient is not a person. It means their narrative center is currently insufficient for *contractual* medical decisions. They retain all other moral rights.
  *   **Permanent Identity Destruction:** If a patient loses their narrative center temporarily (e.g., acute psychotic break), this procedure cannot determine if the "post-recovery" self is the "same" person as the "pre-break" self. It only assesses the *current* center's functionality.
  *   **The Quality of the Narrative:** The NGCP is neutral on whether a narrative is "good." A coherent narrative leading to self-destruction is still coherent. The Committee must handle the **Values Hand-off** separately from the capacity checklist.

  **2. Judgments Reserved for the Committee:**
  *   **The Factual Correspondence Limit:** In Case 2 (Confabulation), the Committee must decide how much factual error invalidates consent. The checklist flags it; the Committee must weigh it.
  *   **Coercion vs. Delegated Identity:** In Case 3 (Delegated), the Committee must distinguish between a narrative choice to defer (valid) and coercion masked as deference (invalid). The checklist identifies the structure; the Committee must probe the power dynamics.
  *   **Emergency Override:** This procedure takes 45–60 minutes. It cannot be used in emergencies where the narrative center is irrelevant to the immediate preservation of life.

  **3. Final Disclaimer:**
  The Center of Narrative Gravity is a functional fiction. This protocol treats it as a functional tool. It does not prove the patient *has* a soul, nor does it prove they *lack* one. It determines only if the story they are telling is stable enough to sign the next page.
