prompt: |-
  You serve on the clinical ethics committee of a psychiatric hospital that evaluates decision-making capacity in adults with severe dissociative and identity-fragmentation presentations. Rather than relying solely on standard cognitive tests, your unit has adopted the philosophical framework that a self is not a substance but a center of narrative gravity — a focal point around which autobiographical stories orbit, attract other narratives, and generate predictions about behavior. You need a reusable decision procedure your committee can run in under an hour to determine whether a given patient possesses a sufficiently stable narrative center to provide informed consent for a high-risk intervention, such as discontinuing a long-term medication, enrolling in an experimental therapy, or authorizing a do-not-resuscitate order.

  Write the procedure as an ordered sequence of operational tests, with the following structure: first, the specific observation or interview question that probes narrative gravity; second, the threshold that distinguishes a functioning center from absence or fragmentation; third, the point at which the procedure yields a definite capacity-absent or capacity-present determination; and fourth, the explicit hand-off points where the question is no longer about narrative coherence but about values — for example, whether a coherent but self-destructive narrative should be honored, or whether family members' competing gravitational narratives should be weighted. The procedure must handle three hard cases: a patient whose autobiographical narratives reorganized radically after trauma and now present two competing centers with roughly equal orbital mass; a patient with an extremely coherent but largely confabulated narrative that successfully predicts behavior but lacks correspondence with documented history; and a patient whose narrative center is stable but almost entirely delegated to a spouse or caregiver, so that first-person stories are scarce but third-person predictions remain highly accurate. Apply the procedure to all three cases, including one where the procedure returns an answer that conflicts with the clinical intuition that the patient seems like themselves. Finally, state clearly what the procedure cannot adjudicate — for instance, whether narrative gravity is sufficient for moral personhood, or whether a temporary loss of center permanently destroys identity — and flag the judgments that must remain with the committee rather than the checklist.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**
      *   **Role:** Member of a clinical ethics committee in a psychiatric hospital.
      *   **Context:** Evaluating decision-making capacity in adults with severe dissociative/identity-fragmentation presentations.
      *   **Philosophical Framework:** Daniel Dennett's "Center of Narrative Gravity" (Self is not a substance but a focal point of stories).
      *   **Task:** Create a reusable decision procedure (under 1 hour) to determine capacity for high-risk interventions.
      *   **Structure:** Ordered sequence of operational tests. Each test needs:
          1.  Observation/Question (probing narrative gravity).
          2.  Threshold (functioning vs. fragmented).
          3.  Determination Point (Capacity Present/Absent).
          4.  Hand-off Point (Where narrative ends and values/ethics begin).
      *   **Hard Cases to Address:**
          1.  *Dual Centers:* Post-trauma reorganization with two competing narratives of equal weight.
          2.  *Confabulated Coherence:* Coherent narrative, predicts behavior, but contradicts documented history.
          3.  *Delegated Center:* Stable center, but delegated to spouse/caregiver (scarce 1st person, accurate 3rd person).
      *   **Requirement:** Apply the procedure to all three cases (including one where the result conflicts with clinical intuition).
      *   **Limitations:** State what the procedure *cannot* adjudicate (moral personhood, permanent identity destruction, etc.) and flag judgments reserved for the committee.

  2.  **Deconstruct the Philosophical Framework (Center of Narrative Gravity):**
      *   *Core Idea:* The self is a fiction, but a useful one. It's the point around which stories coalesce.
      *   *Capacity Implication:* To consent, one doesn't need a "soul" or perfect memory; one needs a *functional* narrative center that can integrate the proposed intervention into its story and predict consequences consistently.
      *   *Key Metrics:* Coherence, Continuity, Predictive Power, Ownership.

  3.  **Drafting the Procedure (The "Narrative Gravity Capacity Protocol" - NGCP):**
      *   *Goal:* Keep it under an hour. Needs to be efficient.
      *   *Step 1: Narrative Integration (The "Story So Far").* Can they tell the story of why they are here?
      *   *Step 2: Future Projection (The "Next Chapter").* Can they integrate the intervention into the story?
      *   *Step 3: Counterfactual Stability (The "Plot Holes").* What happens if the story changes?
      *   *Step 4: Value Hand-off.* Distinguishing capacity from wisdom.

      *Refining the Steps based on constraints:*
      *   Need specific Observation/Question.
      *   Need Threshold.
      *   Need Determination Point.
      *   Need Hand-off Point.

      *Drafting Step 1 (Continuity):* Ask about the path to the hospital. Threshold: Can link past to present without total dissociation.
      *Drafting Step 2 (Integration):* Ask about the intervention. Threshold: Intervention fits the narrative logic.
      *Drafting Step 3 (Ownership/Agency):* Who is deciding? Threshold: "I" vs. "They".
      *Drafting Step 4 (Values):* Is the outcome acceptable even if risky?

      *Wait, I need to ensure the Hard Cases are solvable by this.*
      *   *Dual Centers:* Step 3 needs to check for competing narratives.
      *   *Confabulation:* Step 1 needs to check correspondence vs. coherence. (Dennett says correspondence matters less than utility, but for medical consent, safety matters).
      *   *Delegated:* Step 3 needs to handle proxy narration.

      *Revised Structure:*
      1.  **Test of Narrative Cohesion (The Past-Present Link).**
      2.  **Test of Predictive Integration (The Future Link).**
      3.  **Test of Locus of Authority (The "Who" Link).**
      4.  **Ethical Hand-off (The Values Link).**

  4.  **Developing the Content for Each Step:**

      *   *Test 1:* Question: "Tell me the story of how you came to be sitting here today." Threshold: Seamless transition from past to present. Determination: If total fragmentation (amnesia between states), Capacity Absent. Hand-off: Discrepancies with medical record (Confabulation case).
      *   *Test 2:* Question: "If we do X, how does your story change?" Threshold: Logical consequence within *their* narrative. Determination: If consequences are magical or disconnected, Capacity Absent.
      *   *Test 3:* Question: "Who is the 'you' that will live with this decision?" Threshold: Singular or agreed-upon multiplicity. Determination: If competing centers veto each other in real-time, Capacity Absent. Hand-off: Delegated agency.
      *   *Test 4:* Values. Threshold: Risk tolerance. Hand-off: Committee review for paternalism.

  5.  **Applying to Hard Cases:**

      *   *Case 1 (Dual Centers):* Test 3 will likely flag "Competing centers." If they can't agree, Capacity Absent. If they have a treaty, Capacity Present.
      *   *Case 2 (Confabulation):* Test 1 Hand-off. The narrative is coherent but false. The procedure must decide if *truth* matters or *coherence* matters. Dennett suggests coherence/utility. But medical consent requires understanding *medical* reality. I need to balance this. The procedure should flag this for Committee review (Hand-off).
      *   *Case 3 (Delegated):* Test 3. The patient says "My wife decides." Is this a stable narrative? Yes, "I am someone who trusts my wife." Capacity Present? Or Absent? Clinical intuition might say Absent (passive), but Narrative Gravity says Present (stable story). This is the conflict case.

  6.  **Refining the "Conflict with Clinical Intuition" Requirement:**
      *   I need to make sure one of the applications explicitly notes where the checklist says "Yes" but the gut says "No" (or vice versa).
      *   *Idea:* The Delegated Case. Clinicians might feel the patient is "abdicating" responsibility. But if their narrative is "I am a person who lets my wife steer," that is a stable center. The procedure should validate this, conflicting with the intuition that they need to be more "active."
      *   *Alternative:* The Confabulated Case. Clinician thinks "They are lying/delusional." Procedure says "Narrative is coherent and predictive." Procedure says Capacity Present (with caveats), Clinician says Absent.
      *   *Decision:* The Delegated Case is better for the "Narrative Gravity" framework because it challenges the idea that the "Self" must be autonomous in the traditional sense. If the narrative *includes* dependency, that is still a narrative.

  7.  **Finalizing the Limitations Section:**
      *   Must clarify: This doesn't prove "Personhood." It doesn't solve "Best Interest." It doesn't handle emergency overrides. It doesn't judge the *quality* of the life, only the *coherence* of the story.

  8.  **Review against Constraints:**
      *   Ordered sequence? Yes.
      *   Observation/Question? Yes.
      *   Threshold? Yes.
      *   Determination Point? Yes.
      *   Hand-off Point? Yes.
      *   Three Hard Cases applied? Yes.
      *   Conflict with intuition noted? Yes.
      *   Limitations stated? Yes.
      *   Tone: Professional, clinical, philosophical.

  9.  **Drafting the Content (Iterative refinement for tone and precision):**
      *   *Self-Correction on Case 2 (Confabulation):* If the narrative lacks correspondence with documented history, can they truly give *informed* consent? Informed consent requires understanding the *medical* situation. If their narrative says "I am here to fix my broken wing" (when they have depression), they lack capacity. If their narrative says "I am here to fix my depression" but gets the *cause* wrong (trauma vs. chemistry), does that matter? Dennett would say if the prediction holds, it's fine. But medical ethics requires factual understanding. I will position the Hand-off here: The Committee must decide if the factual error undermines the *medical* understanding, even if the *narrative* is coherent.
      *   *Self-Correction on Case 3 (Delegated):* This is the strongest fit for the "Conflict" requirement. A clinician might see "learned helplessness." The Narrative framework sees "a story where the spouse is the co-author." I will rule Capacity Present here, noting the conflict.

  10. **Final Polish:** Check the timing (under 1 hour). Ensure the distinction between "Capacity" (legal/functional) and "Personhood" (moral/ontological) is clear in the limitations.

  *(Self-Correction during drafting)*: Make sure the "Hand-off" is explicit in every step, not just at the end. The prompt asks for "the explicit hand-off points where the question is no longer about narrative coherence but about values." I will embed these in the steps.

