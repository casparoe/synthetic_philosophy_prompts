prompt: |-
  I'm preparing a colloquium Q&A with an unnamed philosopher who defends a specific variant of Confucian role ethics built around what she terms epistemic priority in ritual roles. Her claim is that the five cardinal relationships are not primarily power hierarchies but structures of differentiated practical knowledge: each role constitutes a distinctive mode of moral attention that its counterpart cannot replicate, so filial, fraternal, and other obligations arise from this constitutive asymmetry rather than from contract, virtue, or authority alone. She deploys this framework both against liberal autonomy critiques and against authoritarian interpretations that treat roles as fixed status ranks. Draft seven focused interview questions that press beyond a restatement of the view. I want at least one question challenging how epistemic priority differs from ordinary experiential or informational asymmetry; one on how role corruption, abuse, or failure is identified and corrected if the role itself partly defines the relevant moral knowledge; and one on whether a person entirely outside the Confucian framework can recognize or be bound by these obligations without actually inhabiting the roles. For each of these three, include a follow-up keyed to the reply she is most likely to give—that the knowledge is constitutive rather than empirical, that corruption is an internal breakdown of ritual propriety rather than an external moral violation, and that genuine recognition requires participatory engagement rather than theoretical assent. Avoid generic biographical questions and do not ask for reading lists or citations.
