      *(Check on Allocation Case)*: The prompt asks about "charitable allocation." Williams' example was saving a wife from drowning. Is there a disanalogy? Some argue money is fungible, relationships aren't. But the *reasoning* (EU calculation) is the same. I will note that the objection applies to the *mode of deliberation* regardless of the resource, though the stakes affect the *strength* of the intuition.

