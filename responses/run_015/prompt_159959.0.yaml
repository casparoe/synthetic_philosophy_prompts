      Pursuant to the Ontological Revenue Act, the Office issues this guidance regarding the annual per-object tax on household contents. The enabling statute acknowledges three competing answers to the special composition question. Taxpayers must select a filing status consistent with their metaphysical commitment. Each status generates distinct administrative liabilities.

