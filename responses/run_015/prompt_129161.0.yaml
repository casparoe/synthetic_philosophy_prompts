answer: |-
  Here are my comments on the three points you raised, focusing on the philosophical mechanics of your argument and its potential payoff.

  ### 1. Accuracy: Indexicality and Causal Isolation

  You are correct to suspect that Lewis's framework blocks the idea of an author "moving" between worlds, but the reason requires a precise distinction between the *manuscript* and the *world described*.

  For Lewis, possible worlds are causally isolated. No object in one world can interact with an object in another. When you revise a manuscript, you are performing a physical action (typing, deleting, rewriting) within *this* world. You are altering a representation, not the represented reality. Lewis's indexical analysis of "actual" reinforces this: "Actual" simply means "this-worldly." To say the author "selects" a world implies a causal power over the ontology of that world, which Lewis denies. The world where the protagonist survives already exists, just as the world where she dies already exists. They are not brought into being by the writing; they are merely described by it.

  You ask if you are importing a causal theory of reference. It is more accurate to say you are grappling with the **direction of fit**. In Lewis's metaphysics, the world does not conform to the description; the description attempts to conform to the world. If you treat the revision process as *making* the survival-world real, you are contradicting Lewis. If you treat revision as *shifting attention* from one pre-existing concrete totality to another, you remain consistent.

  However, there is a nuance here regarding the author's location. The author is not a counterpart in the story-worlds. The author is in the "actual" world (ours), writing about worlds that are "actual" only to their inhabitants. Therefore, the author cannot "move" into the draft. The analogy holds only if you maintain that the author is an external observer toggling between descriptions of isolated concrete totalities. If you suggest the author inhabits the draft-worlds during the writing process, the analogy breaks down against Lewis's causal isolation principle.

  ### 2. Coherence: Concrete Worlds vs. Ersatzism

  This is the most vulnerable point in your argument. There is a significant tension between Lewisian concrete realism and the nature of fictional drafts.

  Lewisian worlds are **maximal**. They are complete totalities where every proposition is either true or false. In the world where the protagonist survives, it is determinate whether she had eggs for breakfast on a Tuesday in 1998, even if no story mentions it. Fictional drafts, by contrast, are **gappy**. They are incomplete descriptions. Most details are left unspecified.

  If you claim that each draft specifies a distinct *concrete* world, you run into the problem of under-specification. A draft does not pick out a single Lewisian world; it picks out a vast set of Lewisian worlds that are consistent with the text. To treat the draft as a concrete world itself is to treat the text (or the propositions expressed by the text) as the world. This is precisely what Lewis calls **ersatz modal realism**—the view that worlds are abstract representations (like sentences or maps) rather than concrete realities. Lewis argued vigorously against this.

  To maintain coherence with Lewis, you must argue that the draft is an incomplete *guide* to a complete concrete world. The revision process, then, is not just changing the text, but changing *which* complete concrete totality the text is intended to map onto. However, this creates a new problem: since the text is incomplete, it maps onto many worlds at once. Revision narrows the set of compatible worlds, but it rarely isolates a single one.

  If your essay treats the *drafts themselves* as the ontological equivalents of Lewisian worlds, you are indeed collapsing into the ersatzism Lewis criticized. To avoid this, you must position the drafts as imperfect epistemic access points to the concrete worlds they describe. This weakens the analogy slightly (since the access is fuzzy) but saves it from metaphysical inconsistency.

  ### 3. Interest: Phenomenology of Revision

  Does this framing do conceptual work, or is it merely decorative? I believe it offers a specific insight regarding the **ontology of character**, provided you navigate the "discovery" claim carefully.

  The common artistic intuition is that revision feels like "discovery"—finding out what the character "would really do." A standard constructivist view says the author invents the character; therefore, discovery is a metaphor for decision-making. Your Lewisian framework literalizes this discovery. If all possibilities are equally real, the author is not creating a new fate but locating the specific coordinate of the character that best fits the internal logic of the narrative.

  This illuminates the phenomenology of revision in two ways:
  1.  **Moral Weight:** It alleviates the "guilt" of killing a character. In a Lewisian framework, the counterpart who dies still lives and dies in their own concrete world. The author has merely ceased to describe them. This shifts the ethical burden from *ontological destruction* to *representational neglect*.
  2.  **Constraint:** It explains why some revisions feel "wrong." If characters are counterparts bound by qualitative similarity across worlds, there are limits to how much they can change while remaining the *same* character. If the revision changes too many qualitative properties, the protagonist of Draft Two is no longer a counterpart to the protagonist of Draft One, but a different person entirely. This gives metaphysical grounding to the artistic intuition that a character can be "out of character."

  However, be wary of the word "truer." Lewis's worlds are equally real; none is "truer" than another. The "actual" world is not ontologically privileged, only indexically privileged. If your essay argues that the final draft is the "true" world, you are reintroducing the privilege Lewis removed. The benefit of your analogy is not that it finds the *true* version, but that it validates the *plurality* of versions. It suggests that the unwritten drafts are not non-existent; they are merely unactualized *by the text*, though they remain actual *in themselves*.

  ### Summary Recommendation

  Your reasoning holds together best if you make the following distinctions clear:

  1.  **Separate the Text from the World:** The draft is an ersatz representation in our world; the story-content refers to a concrete world elsewhere. Do not conflate the two, or you fall into the ersatzism Lewis rejected.
  2.  **Acknowledge Incompleteness:** Admit that drafts do not isolate single Lewisian worlds but rather clusters of compatible worlds. Revision narrows the cluster.
  3.  **Reframe "Discovery":** Do not claim the final draft is ontologically superior. Instead, argue that the Lewisian model validates the *reality* of the discarded drafts. They are not nothing; they are just elsewhere.

  If you can sustain the distinction between the incomplete text and the complete world it describes, the analogy does real conceptual work. It moves the discussion of revision from psychology (what the author feels) to metaphysics (what the character is), offering a robust defense of the intuition that characters have an existence independent of the specific words used to describe them.
