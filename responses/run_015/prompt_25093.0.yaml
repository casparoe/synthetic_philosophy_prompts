answer: |-
  You are absolutely right, and your intuition is spot-on. This is one of the most important distinctions in probability and finance, yet it is constantly misunderstood by traders (and economists).

  Your friend is making a category error: he is treating a **multiplicative** system (compounding wealth) as if it were an **additive** system (collecting independent payouts).

  Here is the formal breakdown of why his reasoning fails, the math behind the "geometric vs. arithmetic" distinction, and how to explain bet sizing using the Kelly Criterion.

  ### 1. The Core Error: Arithmetic vs. Geometric Returns

  Your friend is correct that **Arithmetic Expected Value (EV)** is linear. If you have two independent bets, the total expected value is indeed the sum of the individual expected values.

  However, trading is not additive; it is **multiplicative**. You do not bet with a fresh stack of cash from an infinite bank every time; you bet with the *remainder* of what you had after the previous trade.

  When wealth compounds, the long-term growth rate is determined by the **Geometric Mean**, not the Arithmetic Mean.

  #### The Proof by Example
  Let's use your friend's specific numbers to show how he loses money despite having a "positive EV" strategy.

  *   **The Bet:** He puts 40% of his portfolio into a trade.
  *   **The Odds:** 55% chance the trade doubles (100% gain on the bet), 45% chance the trade goes to zero (100% loss on the bet).
  *   **Portfolio Impact:**
      *   **Win:** Portfolio grows by 40% (Multiplier: $1.4$).
      *   **Loss:** Portfolio shrinks by 40% (Multiplier: $0.6$).

  **His Logic (Arithmetic EV):**
  $$EV = (0.55 \times 0.40) + (0.45 \times -0.40) = 0.22 - 0.18 = +0.04$$
  He sees a **4% positive expected return** per trade. He concludes that over time, his wealth will increase by 4% per trade on average.

  **The Reality (Geometric Growth):**
  In the long run, outcomes converge to the probability distribution. For every 100 trades, he expects roughly 55 wins and 45 losses. The order doesn't matter for the final result in a multiplicative system.

  His wealth after 100 trades will be approximately:
  $$W_{final} = W_{start} \times (1.4)^{55} \times (0.6)^{45}$$

  Let's look at the **Geometric Mean per trade** (the compound growth rate):
  $$G = \sqrt[100]{(1.4)^{55} \times (0.6)^{45}} \approx 0.986$$

  **The Result:** His compound growth rate is **0.986**. This means his portfolio shrinks by **1.4% per trade** on average.

  Even though the *Arithmetic Expectation* is positive (+4%), the *Geometric Growth* is negative (-1.4%). If he keeps doing this, his account will mathematically trend toward zero. He is not experiencing "bad variance"; he is experiencing the **drift** of his strategy. The drift is negative.

  ### 2. The Ergodicity Problem (Ensemble vs. Time)

  This is the philosophical piece you half-remember from the rationalist blogosphere (specifically Ole Peters and the concept of **Ergodicity**).

  *   **Ensemble Average (Your Friend's View):** Imagine 1,000 parallel universes where your friend makes this trade once. In 550 universes, he wins big. In 450, he loses. If you average the wealth of all 1,000 universes, the average wealth is huge. The Arithmetic EV describes this average across parallel universes.
  *   **Time Average (Your View):** You live in *one* universe. You make the trade, then you make the next trade with the money you have left. You cannot access the wealth of the parallel universes where he won to subsidize the universe where he lost.

  Your friend is optimizing for the **Ensemble Average** (expectation of wealth), but he lives in the **Time Average** (growth rate of wealth).

  In multiplicative dynamics, the Ensemble Average diverges from the Time Average.
  *   $E[\text{Wealth}]$ goes to infinity (because the few paths where he wins 100 times in a row become astronomically large and skew the average).
  *   $E[\log(\text{Wealth})]$ goes to negative infinity (because the *typical* path leads to ruin).

  Since he only lives one life, he should care about the Time Average. Maximizing $E[\text{Wealth}]$ is irrational for a single agent in a compounding game.

  ### 3. The Solution: The Kelly Criterion

  So, how *should* he size his bets? He needs to maximize the Geometric Growth Rate, which is mathematically equivalent to maximizing **Expected Log Wealth** ($E[\log(W)]$).

  This leads to the **Kelly Criterion**. The Kelly formula tells you the exact fraction of your bankroll to bet to maximize long-term growth without risking ruin.

  For a binary bet (win/loss), the formula is:
  $$f^* = p - \frac{q}{b}$$

  Where:
  *   $f^*$ = Fraction of bankroll to bet
  *   $p$ = Probability of winning (0.55)
  *   $q$ = Probability of losing (0.45)
  *   $b$ = Net odds received on the wager (If he bets \$1 and wins \$1, $b=1$)

  **Applying it to your friend's trade:**
  $$f^* = 0.55 - \frac{0.45}{1} = 0.10$$

  **The Kelly Optimal bet is 10%.**

  Your friend is betting **30-40%**. He is betting **3 to 4 times the Kelly limit**.

  In Kelly theory:
  *   **1x Kelly:** Maximizes geometric growth rate.
  *   **2x Kelly:** Reduces growth rate to zero (you break even in the long run, despite +EV trades).
  *   **>2x Kelly:** Negative growth rate (you will go to zero).

  Your friend is in the "Negative Growth" zone. He isn't just taking "more risk for more reward"; he is actively mathematically guaranteeing his own destruction by overbetting.

  ### 4. Addressing His "Ruin" Counter-Argument

  He says: *"I'm not betting 100%, so I can't hit zero."*

  This is a misunderstanding of how geometric decay works.
  If you lose 40% of your portfolio, you need a **67% gain** just to get back to even.
  If he bets 40% and hits a losing streak of just 10 trades (which happens frequently with 45% loss odds):
  $$0.6^{10} \approx 0.006$$
  His portfolio is reduced to **0.6%** of its original value. A \$10,000 account becomes \$60.

  Practically, this is ruin. He cannot trade meaningfully with \$60. Psychologically, he will likely "revenge trade" or quit. Mathematically, the time required to recover from that drawdown approaches infinity because the base capital required to make meaningful absolute gains is gone.

  ### 5. How to Explain This to Him

  Don't argue about "risk management" or "psychology." He will dismiss those as soft constraints. Argue about **Growth Rate**.

  **The Script:**
  > "I ran the numbers on your strategy. You're optimizing for Arithmetic Expected Value, but since you're compounding trades, your actual growth rate is determined by the Geometric Mean.
  >
  > With a 55% win rate and 40% bet sizing, your Geometric Mean is **0.986**. That means your account is mathematically guaranteed to shrink by 1.4% per trade over the long run. You aren't getting unlucky; the drift of your strategy is negative.
  >
  > The Kelly Criterion says your edge only supports a 10% bet size to maximize growth. By betting 40%, you are betting 4x Kelly. Any strategy over 2x Kelly has a negative expected growth rate. You aren't 'leaving money on the table' by sizing smaller; you are literally printing money by sizing down to Kelly, and burning money by sizing up."

  ### Summary for You
  1.  **He is wrong:** Positive Arithmetic EV does not guarantee wealth growth in compounding systems.
  2.  **The Mechanism:** Volatility drag (variance) reduces geometric returns. High bet sizing increases volatility drag until it overwhelms the edge.
  3.  **The Fix:** Maximize $E[\log(\text{Wealth})]$, not $E[\text{Wealth}]$.
  4.  **The Limit:** The Kelly Criterion provides the mathematical ceiling for bet sizing. He is significantly above it.

  You are witnessing a classic "blow-up" dynamic that has destroyed countless traders, from LTCM (Long-Term Capital Management) to crypto leverage funds. They all thought they were capturing EV; they were actually capturing negative geometric drift.
