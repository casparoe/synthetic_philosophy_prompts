  2.  **Deconstruct the Core Concepts:**
      *   **Hofstadter-style Fluid Concepts:** Concepts aren't fixed boxes but flexible categories that shift based on context, analogy, and pressure (e.g., *Fluid Concepts and Creative Analogies*). Key feature: Slippage is a feature, not a bug.
      *   **Predictive Processing (PP):** Brain as a prediction machine. Error = prediction error (PE). Minimizing free energy.
      *   **Non-human Animal Cognition:** No language, potentially different representational formats. Hard to distinguish "mistake" from "noise."
      *   **The Notion of 'Error':**
          1.  *Statistical Deviation:* Outlier in data/PE signal.
          2.  *Intentional Mistake:* Wrong belief/desire (hard to attribute to animals).
          3.  *Functional Misfire:* Mechanism didn't do what it was selected for.
      *   **The Tension:** Fluid concepts imply boundarylessness. Empirical science (and PP) needs operationalisable, stable definitions to measure PE. How do you reconcile a slippery concept of 'error' with the need to measure 'prediction error' precisely?

  3.  **Drafting - Section by Section:**

      *   **Introduction/Brainstorm:** Why is this slippery?
          *   PP treats error mathematically (PE).
          *   Folk psychology treats error normatively (mistake).
          *   Evolution treats error functionally (maladaptation).
          *   In animals, we can't ask them "Did you mean to do that?" so we rely on behaviour, which is noisy.
          *   Hofstadter adds the layer that the *concept itself* shifts depending on the pressure applied.

      *   **Desiderata (The Spec):**
          *   *Cases:* Need to cover the bird foraging example. Also, maybe a false alarm in predator detection.
          *   *Distinctions:* Noise vs. Signal. Systematic bias vs. Random error.
          *   *Empirical Consistency:* Must fit with what we know about animal learning (e.g., Rescorla-Wagner, though maybe too old, stick to modern PP ethology). Must not anthropomorphise.
          *   *Hofstadter Features:* Keep context-sensitivity. Abandon the heavy computational architecture (Copycat program) if it's too heavy for a philosophy chapter.
