      *   *Belief Update* $\rightarrow$ Posterior Update / Gradient Step / Retraining.
      *   *Theorem Statement:* The expected performance of a model retrained with an additional optimally selected sample (acquisition) is greater than or equal to the current model's performance, *provided* the acquisition cost is zero and optimization is perfect.

