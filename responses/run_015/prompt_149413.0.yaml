          2.  Information is costless (or cost is accounted for).
          3.  Information is relevant (can change the decision).
          4.  No "cost of thinking" (computational cost of processing the info is negligible).
          5.  The utility function is well-defined over states and actions.
      *   *Mathematical Essence:* $E[U(\text{act after info})] \geq U(\text{act before info})$.

