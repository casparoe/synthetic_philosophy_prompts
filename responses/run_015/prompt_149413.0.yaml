answer: |-
  ### The Restatement: Good's Theorem in Active Learning Notation

  Let $\mathcal{M}$ be your model class parameterized by $\theta$. Let $\mathcal{D}_t$ be your current labeled dataset at step $t$. Let $\pi_{acq}$ be your acquisition policy (a mapping from $\mathcal{D}_t$ and the unlabeled pool $\mathcal{U}$ to a distribution over queries $x \in \mathcal{U}$).

  Let $U(\theta, \mathcal{D}_{test})$ be your utility function (e.g., negative expected loss on the true data distribution).
  Let $C(x)$ be the sampling cost (annotation budget) for query $x$.

  **Good's Theorem translated:**
  For a rational agent maximizing expected utility, the expected utility of updating parameters $\theta$ via a new observation $(x, y)$ selected by $\pi_{acq}$ is strictly greater than or equal to the utility of acting immediately, **if and only if**:

  $$ E_{y \sim P(y|x, \mathcal{D}_t)} [ U(\theta_{t+1}, \mathcal{D}_{test}) ] - C(x) \geq U(\theta_t, \mathcal{D}_{test}) $$

  Where $\theta_{t+1}$ is the result of **optimal** belief revision (Bayesian update or global ERM convergence) given $\mathcal{D}_t \cup \{(x,y)\}$.

  In your specific vocabulary:
  > **"The Expected Information Gain (EIG) of a query, weighted by the marginal improvement in the optimal policy's performance, must exceed the sampling cost. If sampling cost is zero and belief revision is exact, the Value of Information is non-negative."**

  This implies your acquisition function $\alpha(x)$ should theoretically be proportional to the Expected Value of Sample Information (EVSI). If $\alpha(x) > 0$, you sample. If $\alpha(x) = 0$, you exploit (deploy).

  ---

  ### The Residue Report

  Here is the friction log between Good's decision-theoretic framework and your engineering reality.

  #### 1. Clean Mappings
  *   **Information $\leftrightarrow$ Labeled Gradients:** Good's "information" maps cleanly to the reduction in posterior entropy over $\theta$ or the target function $f$. Your acquisition functions (BALD, Variance Reduction) are direct estimators of the LHS of the inequality above.
  *   **Sampling Costs $\leftrightarrow$ Annotation Budget:** Good explicitly allows for $C(x) > 0$. This maps 1:1 to your budget constraints in AL. If $C(x)$ exceeds the EIG, the theorem dictates *not* sampling, which aligns with stopping criteria in AL loops.
  *   **The Decision $\leftrightarrow$ Deployment:** Good's "terminal act" is your model deployment. The utility is measured on the test distribution.

  #### 2. The Fudges (Where the abstraction leaks)
  *   **Belief Revision vs. Optimization:**
      *   *Good:* Assumes **exact** Bayesian updating. The agent moves from posterior $P(\theta|\mathcal{D}_t)$ to $P(\theta|\mathcal{D}_{t+1})$ without error.
      *   *You:* You perform SGD. You have optimization error, local minima, and early stopping. You are not updating a belief state; you are navigating a non-convex loss landscape. Adding data changes the landscape topology. Good assumes the landscape simply sharpens around the truth; in DL, adding data can introduce new saddle points or flatten generalization valleys.
  *   **Fixed Model Class vs. Flexible Rationality:**
      *   *Good:* The agent can choose *any* act in the action space.
      *   *You:* Your "acts" are constrained by the architecture $\mathcal{M}$. If $\mathcal{M}$ is misspecified (bias), more data simply converges faster to the wrong function. Good's theorem assumes the hypothesis space contains the truth (or the agent knows the probabilities of the states). In ML, model misspecification is the norm.
  *   **Processing Cost (The "Cost of Thinking"):**
      *   *Good:* Explicitly assumes the cost of *processing* the information is negligible compared to acquiring it.
      *   *You:* In modern ML, the compute cost to retrain or fine-tune on $\mathcal{D}_{t+1}$ often dwarfs the annotation cost. Good's theorem ignores the $Compute(\mathcal{D}_{t+1})$ term. If retraining costs more than the utility gain, the theorem fails in practice, even if it holds theoretically.

  #### 3. The Null Set (Philosophical concepts with no ML counterpart)
  *   **Epistemic Value Independent of Action:** Philosophers debate whether information has value simply by reducing uncertainty, even if it doesn't change the decision. In ML, if the acquisition function doesn't change the weights $\theta$ (or the predictions on the test set), the information gain is defined as zero. We have no concept of "knowledge for knowledge's sake."
  *   **Reflexivity:** In some philosophical contexts, observing a state changes the state (quantum or sociological). In standard supervised AL, we assume $P(y|x)$ is static and non-reactive to our query. We ignore the possibility that labeling a sample changes its distribution (e.g., in human-in-the-loop systems where the act of querying influences the user).

  ---

  ### The "More Data Can't Hurt" Intuition Check

  Your intuition that "more data can't hurt" **does not survive** the translation. Good's conditions expose exactly where it breaks in ML.

  Good's theorem guarantees non-negative Value of Information **only under two conditions that ML systematically violates**:

  1.  **Optimal Belief Revision:**
      *   *The Break:* If your optimizer fails to converge to the global optimum on $\mathcal{D}_{t+1}$ (which is likely as $\mathcal{D}$ grows and compute is fixed), $U(\theta_{t+1})$ can be $< U(\theta_t)$.
      *   *Example:* You add high-quality data, but the increased dataset size requires more epochs to converge. You run the same budget of epochs. Performance drops. Good's theorem assumes infinite compute for the update; you have finite compute.

  2.  **Model Specification:**
      *   *The Break:* Good assumes the agent knows the probability structure of the world. In ML, if your inductive bias is wrong, data from the tails of the distribution can pull the decision boundary away from the high-density region you care about.
      *   *Example:* **Distribution Shift.** If the acquired data $(x,y)$ comes from a slightly different manifold than $\mathcal{D}_{test}$, adding it minimizes training loss but increases test loss. Good's theorem assumes the "information" is about the *true* state relevant to the utility. In AL, we often sample from $\mathcal{U}$ which is only an approximation of the true deployment distribution.

  3.  **The "Cost of Thinking" (Compute-Data Tradeoff):**
      *   *The Break:* Good treats information as free once acquired. In Deep Learning, data is cheap; FLOPs are expensive.
      *   *Result:* There is a point where the marginal EIG of a sample is positive, but the marginal *compute cost* to integrate that sample exceeds the utility gain. Good's theorem says "take the info." Engineering says "discard the info, it's not worth the retrain."

  **Conclusion:**
  Good's theorem holds for the **Bayes Optimal Classifier** with **infinite compute**.
  For an ML Engineer, "more data can't hurt" is false. It should be restated as: **"More data cannot hurt *if* your optimization capacity scales linearly with dataset size and your model class is well-specified."**

  Your acquisition functions are essentially trying to approximate Good's EVSI, but you are optimizing a proxy (surrogate loss) under hard constraints (compute budget, fixed architecture) that Good's original proof explicitly abstracted away.
