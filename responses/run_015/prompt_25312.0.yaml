answer: |-
  **Session Plan: 40 Minutes**

  **0:00–0:05 | Board Setup & The Intuition**
  *   **Board Left:** Write "The Hard Problem" and draw a simple brain emitting a glow labeled "What It's Like."
  *   **Action:** Ask the group to write down one sentence describing why consciousness feels "hard" to explain physically. Do not discuss yet.
  *   **Goal:** Externalize the realist intuition so it can be examined rather than inhabited.
  *   **Board Center:** Draw a computer desktop screen with a folder icon. Label it "The Interface."

  **0:05–0:15 | The Carrying Example: The Desktop Icon**
  *   **The Example:** A folder icon on a GUI.
  *   **What it must have:**
      1.  **Visual Presence:** It looks like a colored rectangle with a tab. It is visually experienced.
      2.  **Utility:** You cannot operate the computer without it (too much data otherwise).
      3.  **Transparency:** You look *through* it to access the files.
  *   **What it must lack:**
      1.  **Physical Correspondence:** The icon is not a folder. There are no yellow rectangles inside the hard drive. The properties the icon *appears* to have (color, shape, location) are not the properties of the data it accesses.
  *   **Action:** Map this to the brain.
      *   Icon = Introspective Representation.
      *   Files = Neural/Functional States.
      *   "Yellow Rectangularity" = Phenomenal Properties (Qualia).
  *   **Board Right:** Write "Illusionism: Introspection misrepresents neural states as having phenomenal properties they lack."

  **0:15–0:20 | Head Off Misconception #1: "So consciousness doesn't exist?"**
  *   **Trigger Point:** Immediately after drawing the map above. Someone will say, "But I *am* conscious. You're denying reality."
  *   **Intervention:** Point to the Icon. Ask: "Does the icon exist?" (Yes). "Does the file exist?" (Yes). "Does the *yellow folder property* exist inside the drive?" (No).
  *   **Clarification:** Illusionism denies *phenomenal properties* (the magical glow), not *conscious states* (the access/monitoring). We are not zombies; we are users interfacing with a complex system via a simplified model.
  *   **Board Update:** Under "The Claim," add: "≠ Eliminativism about States. = Eliminativism about Properties."

  **0:20–0:30 | The Mechanism & Misconception #2: "Who is having the illusion?"**
  *   **Action:** Explain *why* the illusion exists (evolutionary utility). The brain needs a quick, summary representation of its own states to regulate behavior, not a physics-perfect report.
  *   **Trigger Point:** "If introspection is an illusion, who is inside looking at it? Is there a little man seeing the icon?"
  *   **Intervention:** Point to the Icon again. The "viewer" is also part of the interface. There is no homunculus. The system *models* itself as having a viewer. The "subject" is another icon on the desktop.
  *   **Board Update:** Draw a stick figure looking at the screen. Cross it out. Draw an arrow from "System" to "Screen" labeled "Self-Model."

  **0:30–0:35 | Synthesis & Discussion**
  *   Bring the group back to their initial sentences from minute 5. Ask them to rewrite one term using the Interface model.
  *   Focus the economists on the "cost/benefit" of the misrepresentation.
  *   Focus the neuroscientists on the "encoding" vs "property" distinction.
  *   Focus the philosophers on the "introspective judgment" vs "raw feel."

  **0:35–0:40 | The Comprehension Check**
  *   **The Question:** "Does illusionism claim we are mistaken about *having* experiences, or mistaken about *what* experiences are?"
  *   **Correct Answer:** Mistaken about *what* they are (their properties), not *that* they are occurring.
  *   **Why:** If they say "we don't have experiences," they missed the distinction between state and property. If they say "we misidentify the nature of the state," they got it.

  **Off-Limits Topics (Openly Refuse)**
  1.  **The Neural Mechanism:** Do not let the neuroscientists drag you into *how* the cortex generates the misrepresentation. That's a separate empirical project. Today is about the conceptual logic.
  2.  **Panpsychism/Realist Alternatives:** Do not debate whether illusionism is *true* compared to realism. Debate whether it is *coherent*.
  3.  **The "Hard Problem" Solution:** Do not claim this *solves* the Hard Problem. Claim it *dissolves* it by rejecting the presupposition (that phenomenal properties exist to be explained).

  ***

  **Confidence & Weak Point**

  **Confidence:** 85%
  This structure leverages the economists' comfort with models and the neuroscientists' comfort with interfaces, while giving the philosophers enough technical distinction (state vs. property) to stay engaged. The board layout forces a visual separation between the intuition and the theory.

  **Least Sure Point:** **The "Who is having the illusion?" objection (Minute 20–30).**
  This is the strongest philosophical objection to illusionism (the "self-stultifying" critique). Explaining that the "subject" is also part of the illusory model in 5 minutes without sounding like you are invoking an infinite regress or dodging the question is pedagogically precarious. If the philosophers in the room dig into the *logic of self-representation* here, you risk running out of time before the comprehension check. I am leaning on the assumption that the "Icon" analogy is robust enough to carry the weight of the "subject-as-model" claim, but that is the most contested interpretive leap in Frankish's work.
