answer: |-
  Here is a seminar plan designed to move first-year students from a caricature of Weber to a nuanced understanding of cultural causality.

  ### The Explanatory Arc: From "Greed" to "Switchmen"

  **Phase 1: The Prerequisite Concept (Minutes 0–15)**
  *   **The Idea:** *Economic behavior is not natural; it is culturally sanctioned.*
  *   **Why it must come first:** Students assume "rational economic man" is a universal constant. They cannot understand Weber's thesis if they believe humans naturally seek to maximize profit whenever possible. You must establish that unrestrained greed is historically common, but *rational, disciplined capitalism* is not.
  *   **The Hook:** Ask: "If capitalism is just greed, why didn't the Roman Empire or Imperial China invent the factory system?" They had merchants, money, and greed. What was missing?
  *   **The Definition:** Define the **Spirit of Capitalism** not as "desire for money," but as "the ethical obligation to increase capital as an end in itself." It is the moralization of profit.

  **Phase 2: The Mechanism of Anxiety (Minutes 15–30)**
  *   **The Idea:** *Values shape behavior by solving psychological problems.*
  *   **The Explanation:** Explain that for values to be causal, they must bite. They need to create a problem that economic behavior solves.
  *   **The Theological Engine:** Briefly explain Predestination. You are chosen or damned before birth. No priest can help you. No sacrament can change it.
  *   **The Psychological Consequence:** This creates unparalleled *salvation anxiety*.
  *   **The Behavioral Solution:** Pastors advised: Believe you are chosen. How do you prove it to yourself? Systematic success in your worldly calling.
  *   **Crucial Link:** This is where culture becomes causal. The theology didn't *want* capitalism, but it created a psychological pressure cooker that *required* rational, systematic work to relieve the pressure.

  **Phase 3: The Historical Contrast (Minutes 30–45)**
  *   **The Contrast:** *Lutheran Calling vs. Calvinist Calling.*
  *   **Why this contrast carries the explanation:** If you only teach "Protestants worked hard," students miss the *rationalization* element.
      *   **Luther:** *Beruf* (calling) spiritualizes daily labor, but it is **traditionalist**. You work to serve God and neighbor. Once you have enough to live piously, working more is actually sinful (it distracts from prayer/charity).
      *   **Calvin:** The calling is **rationalized**. Because you need signs of election, you cannot stop. You must reinvest profit, not spend it on luxury (which is sinful).
  *   **The Takeaway:** Lutheranism sanctifies work; Calvinism sanctifies the *accumulation* of work. This distinction proves it isn't just "religion = work," but a specific *type* of religious valuation that aligns with capitalist accumulation.

  **Phase 4: Addressing Misconceptions (Integrated Sequence)**

  1.  **"Spirit of Capitalism = Greed"**
      *   **When:** Phase 1 (Immediate).
      *   **Head-off:** Show a quote from Benjamin Franklin. It's not about buying yachts; it's about creditworthiness and duty. If they think it's greed, the theology makes no sense (Calvinists hated luxury).
  2.  **"Correlation vs. Causation"**
      *   **When:** Phase 5 (below).
      *   **Head-off:** Acknowledge Weber admits correlation. He is not saying "No Calvinism = No Capitalism." He is saying "This specific cultural ethos removed the *psychological barriers* to capitalist behavior that existed elsewhere."
  3.  **"Ideal vs. Material Explanations are Competitors"**
      *   **When:** Phase 6 (Synthesis).
      *   **Head-off:** This is the climax. Students think Weber is "Anti-Marx." Correct this. Weber argues material interests drive action, but *ideas determine the direction*.

  **Phase 5: The Causal Model – Elective Affinity (Minutes 45–60)**
  *   **The Concept:** *Elective Affinity (Wahlverwandtschaft).*
  *   **The Metaphor:** Use Weber's **"Switchman" (Weichensteller)** metaphor.
      *   *Material Interests (Greed/Need)* are the train engine. They provide the power and motion.
      *   *Values/Ideas* are the tracks/switches. They determine where the train goes.
  *   **The Application:** The "Spirit" didn't create the engine (profit motive exists everywhere). It laid the tracks that allowed the engine to run toward *rational capitalism* rather than *political capitalism* (cronyism) or *traditionalism* (subsistence).
  *   **Why "Affinity" not "Causation":** The religious doctrine and the economic ethic fit together like a key and a lock. They reinforced each other over time until the religious root died away, leaving the economic ethic behind (the "Iron Cage," though keep this brief).

  **Phase 6: Synthesis – The Non-Competitive Relationship (Minutes 60–75)**
  *   **The Goal:** Resolve the Ideal vs. Material binary.
  *   **The Argument:** Values are not "fluff" floating above reality. They are tools actors use to navigate material conditions.
  *   **The Statement:** "Weber is not saying ideas replace economics. He is saying you cannot predict economic outcomes solely from material conditions because actors interpret their material interests through a cultural lens."
  *   **Example:** A worker wants money (material). A traditionalist worker takes the money and quits when they have enough for the week. A capitalist-ethic worker takes the money and reinvests it. Same material interest, different cultural software.

  ---

  ### End-of-Session Check: The "Switchman" Diagnostic

  Do not ask them to summarize the thesis. Ask them to apply the causal mechanism to a counterfactual.

  **The Prompt:**
  > "Imagine a society with advanced banking technology, secure property rights, and a population that desperately wants wealth (high material incentives). However, their dominant cultural value is that 'accumulating wealth beyond need invites the envy of spirits and brings bad luck.'
  >
  > Using Weber's 'Switchman' metaphor:
  > 1. Where is the 'engine' in this scenario?
  > 2. Where are the 'tracks'?
  > 3. Why would a purely materialist explanation fail to predict the economic outcome here?"

  **What to look for:**
  *   **Pass:** They identify the desire for wealth as the engine (material) but the superstition as the switchman (ideal) that diverts the energy away from accumulation. They note that materialism fails because it ignores how the actors *interpret* the risk of wealth.
  *   **Fail:** They say "The culture stops the capitalism" (too simple) or "The technology wasn't good enough" (ignoring the prompt's premises).

  ---

  ### Methodological Omission: The Construction of "Ideal Types"

  **What to leave out:** Do not spend time teaching the technical methodology of how to construct an **Ideal Type** (*Idealtypus*).

  **Why:**
  1.  **Cognitive Load:** First-years struggle enough with "Elective Affinity." Adding the epistemological debate about whether Ideal Types are averages, utopias, or heuristic devices will freeze them.
  2.  **Distraction:** It shifts the focus from *sociological causality* (your goal) to *philosophy of science*.
  3.  **The Workaround:** Simply use the "Spirit of Capitalism" and "Traditionalism" as if they are clear categories. If a sharp student asks, "But weren't there lazy Calvinists and hardworking Catholics?", answer: "Weber knows that. He is describing the dominant *ethos* that shaped the system, not every individual. We are using these as analytical tools, not a census."

  **Explicitly tell them:** "We are treating the 'Spirit of Capitalism' as a tool to explain a historical shift, not as a literal description of every capitalist. We are leaving aside the technical debate of how Weber constructs these models so we can focus on how he uses them to explain cause and effect."
