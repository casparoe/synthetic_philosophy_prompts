  A patient with severe health anxiety sits in a dimly lit examination room and views a neutral, static shadow cast by a coat rack on the wall. When asked to describe the visual experience, she states unequivocally, "It looks like a person standing there." A cognitive-penetration theorist argues that her belief about potential threats directly altered her early visual processing, making the shadow genuinely appear as a person. A modular-encapsulation theorist contends that her visual system accurately registered a shadow, but her belief biased her post-perceptual judgment, leading her to report a person despite seeing a shadow. Both accounts accept the subject's report that the experience *seemed* like seeing a person, disagreeing only on whether that seeming originated in perception or judgment. However, a predictive-processing account assigns a different perceptual content altogether: it claims the subject did not see a 'person' nor a 'shadow,' but rather experienced a high-precision prior regarding human presence that actively suppressed the prediction error generated by the sensory data, resulting in a phenomenological state of 'confident expectation' that is structurally distinct from both veridical seeing and penetrated hallucination.

  **Reasoning and Structural Divergence**

  The cognitive-penetration account reasons that top-down information (belief) flows into early visual modules, changing the representational content itself; thus, the percept *is* a person. The modular-encapsulation account reasons that early vision is informationally sealed; thus, the percept *is* a shadow, and the report reflects a downstream cognitive error. Both treat perceptual content as a static representation that is either accurate or inaccurate. The predictive-processing framework diverges because it treats perceptual content as a probabilistic hypothesis governed by **precision-weighting**. In this view, the brain does not simply select 'person' or 'shadow'; it weights the reliability of the prior (belief) against the sensory evidence. The structural feature allowing this divergence is the separation of *accuracy* (the content of the hypothesis) from *precision* (the confidence assigned to that hypothesis). Because the patient's anxiety increases the precision assigned to the threat prior, the perceptual content becomes the *act of suppression itself*—the feeling of certainty—rather than the objectified 'person' claimed by the other accounts.

  If the ambiguity of precision-weighting were removed—for instance, if precision were fixed as either always maximal for sensory data or always maximal for priors—the predictive-processing case would collapse into the standard two-way dispute. If sensory precision is fixed as dominant, the model reduces to modular encapsulation (sensory data wins); if prior precision is fixed as dominant, it reduces to cognitive penetration (belief wins). The unique explanatory power of predictive processing relies entirely on the dynamic gain control of precision.

  A defender of predictive processing would criticize the framing of this scenario as illegitimately assuming a boundary between perception and cognition. By asking whether belief reshapes "what we literally see," the question presupposes that there is a distinct perceptual module that can be penetrated or encapsulated. From a predictive-processing perspective, this distinction is false; there is only a continuous hierarchy of inference where "seeing" and "believing" differ only in their depth within the network and their relative precision, not in their fundamental kind. Thus, the debate over whether cognition penetrates perception is a category error generated by an outdated architectural assumption.
