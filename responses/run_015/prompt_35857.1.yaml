answer: |-
  # AI Safety Trust Decision Tree

  **Start:** *What would it take for you to trust an AI system?*

  ### **Q1. If a system fails catastrophically on 1 in $10^{12}$ inputs, but never on inputs it will actually face, is it safe?**
  *   **YES (Tail risk is acceptable if improbable):** Go to **Q2**.
  *   **NO (Any catastrophic failure is unacceptable):** Go to **Q3**.

  ---

  ### **Q2. Will the real-world environment actively search for those 1 in $10^{12}$ failure cases?**
  *(Consider: Will other optimizers, competitors, or the AI itself probe for bugs?)*
  *   **YES (The tail will be targeted):**
      *   **→ ADVERSARIAL ROBUSTNESS VIEW**
      *   *Summary:* Average-case safety is an illusion. Optimization pressure turns rare bugs into likely events. We need defenses against active search, not just natural distributions.
  *   **NO (The distribution is stable/benign):** Go to **Q4**.

  ---

  ### **Q3. How do we ensure the system never hits that catastrophic tail?**
  *   **A. By mathematically proving it cannot happen (Formal Guarantees):**
      *   **→ HARD VERIFICATION**
      *   *Summary:* "Proof or nothing." Empirical testing is insufficient for existential risk. We need formal bounds on behavior for all possible inputs.
  *   **B. By restricting the system from taking "extreme" actions (Bounded Impact):**
      *   **→ QUANTILIZATION / BOUNDED IMPACT**
      *   *Summary:* We can't prove safety, so we limit optimization intensity. Don't let the AI take actions a human wouldn't, or limit how much it can change the world.

  ---

  ### **Q4. Is "safety" a property of the model (measured via evals) or the deployment (managed via process)?**
  *   **A. Property of the Model (Measure the risk):**
      *   **→ EMPIRICAL / AVERAGE-CASE SAFETY**
      *   *Summary:* Run the evals, estimate the tail probability using our best prior. If the expected loss is low enough, deploy. Safety is a measurement problem.
  *   **B. Property of the Deployment (Manage the risk):**
      *   **→ ENGINEERING DEFLATIONISM**
      *   *Summary:* Guarantees are the wrong frame. Treat AI like any other risky engineering (nuclear, aerospace). Manage incentives, monitoring, and rollback. Safety is a governance problem.

  ---

  ### **Meta-Analysis & Map Gaps**

  | **Leaf Position** | **Core Distinction** | **Overlap/Notes** |
  | :--- | :--- | :--- |
  | **Hard Verification** | Demands proof; rejects probabilistic safety. | **Unoccupied Neighbor:** Someone who demands worst-case guarantees but believes adversarial pressure is *negligible*. <br>*(Status: Incoherent/Unstable. If pressure is negligible, worst-case is overkill. If pressure is high, proof is usually impossible.)* |
  | **Adversarial Robustness** | Accepts average-case *until* optimization pressure is applied. | Distinct from Hard Verification because it accepts probabilistic defenses if they withstand search. |
  | **Quantilization** | Avoids worst-case by limiting capability/optimization. | Distinct from Verification: Accepts you can't prove safety, so you constrain the *search space* instead. |
  | **Empirical Safety** | Safety is a measurement of the model's prior. | **Indistinguishable from Deflationism?** Practically, these often converge. The split is philosophical: Empiricalists believe we *can* measure tail risk; Deflationists believe we must *manage* uncertainty because measurement fails. |
  | **Eng. Deflationism** | Safety is a process of deployment governance. | See above. If you answer **Q4-A** but admit measurements are noisy, you slide into **Q4-B**. |

  **Key Logical Splits Used:**
  1.  **Tolerance for Rare Failure:** Is $P(\text{doom}) > 0$ acceptable if expected value is low?
  2.  **Source of Distribution:** Is the test distribution fixed, or will it be optimized against? (Whose prior?)
  3.  **Method of Assurance:** Proof vs. Constraint vs. Measurement vs. Process.

  **Unoccupied/Incoherent Combinations:**
  *   **"Worried about Worst-Case + No Adversarial Pressure + No Proof":** This leads to paralysis. If you fear the worst-case but admit you can't prove it away and don't think adversaries will find it, you have no criteria for trust. (Usually resolves into *Quantilization* or *Deflationism*).
  *   **"Hard Verification + Benign Environment":** Technically possible, but economically inefficient. Nobody holds this because the cost of verification outweighs the risk of the benign tail.

  *(Handout designed for alignment reading group discussion. Nodes phrased to avoid camp signaling.)*
