answer: |-
  This is a sophisticated approach to *Lord of the Flies*. Using David Lewis's *Convention: A Philosophical Study* (1969) moves your analysis beyond standard themes of "civilization vs. savagery" and into the mechanics of how social order is constructed and maintained.

  Below is an analysis designed for your presentation. It treats Lewis's theory and Golding's text with equal weight, distinguishes between settled and contested philosophical ground, and identifies what the novel contributes to the philosophical debate.

  ***

  # Coordination and Collapse: A Lewisian Reading of *Lord of the Flies*

  ## 1. The Framework: Lewisian Convention (Settled vs. Contested)
  To apply David Lewis's theory accurately, we must first distinguish the core definition from the ongoing philosophical debates surrounding it.

  **The Settled Core of Lewis's Theory**
  For Lewis, a convention is not merely a habit or a law. It is a specific solution to a **coordination problem**. Four conditions generally define a Lewisian convention:
  1.  **Regularity:** There is a consistent pattern of behavior (e.g., everyone drives on the left).
  2.  **Coordination Problem:** The agents have a common interest in coordinating their actions (e.g., we all want to avoid crashing).
  3.  **Conditional Preference:** Each agent prefers to conform *on the condition* that others do. (I will drive on the left *if* you do; if you drive on the right, I prefer to do so as well to avoid a crash).
  4.  **Arbitrariness:** There must be at least one other possible regularity that could have solved the problem equally well (e.g., driving on the right would have worked just as fine).

  **The Contested Edges**
  While the conditions above are standard, philosophers debate the *mechanisms* that sustain them:
  *   **Common Knowledge:** Lewis originally argued that conventions require "common knowledge" (I know the rule, you know the rule, I know that you know, ad infinitum). Contemporary theorists (like Brian Skyrms or Margaret Gilbert) argue this is too demanding. They suggest conventions can evolve through repeated interaction or "mutual belief" without infinite epistemic recursion.
  *   **Arbitrariness vs. Focal Points:** Thomas Schelling (whose work influences Lewis) noted that some solutions are "focal points"—natural choices based on psychology or environment (e.g., meeting at "noon" rather than "12:03"). Critics argue Lewis overstates arbitrariness; sometimes the physical world dictates the norm.

  With this framework established, we can examine the boys' attempts at order.

  ## 2. The Conch and the Assembly: Testing Arbitrariness and Expectation
  The initial establishment of the conch rule during the first assembly is the novel's closest approximation of a Lewisian convention.

  **Does it solve a Coordination Problem?**
  Yes. The problem is auditory chaos. If everyone speaks at once, no one is heard. The group has a common interest in being heard and hearing others.
  **Is there Conditional Preference?**
  Initially, yes. Ralph and Piggy prefer to hold their tongues *if* the others agree to listen to the holder.
  **Is it Arbitrary?**
  This is where the first tension arises. Lewis requires arbitrariness. Could they have used a different signal? Yes (raising a hand, standing on a specific rock). However, a critic might argue the conch is a **focal point** rather than an arbitrary convention. It is the only object that makes a loud, carrying noise. If the conch is the *only* physical solution available, it fails Lewis's strict condition of arbitrariness. It is not that they *agree* to use the conch; it is that the conch *demands* use.

  **The Fracture of Expectation**
  The Lewisian framework illuminates *why* the system collapses. A convention survives only as long as the expectation of conformity remains. When Jack interrupts, he isn't just breaking a rule; he is signaling that he no longer holds the **conditional preference**. He no longer cares if the others conform.
  *   **Lewisian View:** The convention dissolves because the equilibrium is broken. If Jack believes Ralph won't enforce the rule, Jack has no reason to follow it.
  *   **Golding's Dramatization:** Golding shows that this expectation relies on authority. When the "adult" authority (the Captain, the schoolmaster) is removed, the epistemic certainty that "others will conform" weakens. The novel suggests that Lewisian conventions require a background of trust that the boys lack.

  ## 3. The Signal Fire: Coordination vs. Conflict of Interest
  The signal fire offers a crucial philosophical distinction that refines your reading.

  **The Lewisian Limit**
  Lewisian conventions solve *coordination problems* (where interests align). They do not solve *Prisoner's Dilemmas* (where individual interest conflicts with group interest).
  *   **Early Stage:** Initially, the fire is a coordination problem. Everyone wants rescue. Assigning shifts is a convention to ensure the fire stays lit.
  *   **Later Stage:** As hunger and the thrill of the hunt set in, the fire ceases to be a coordination problem. Jack's interest shifts to hunting (meat/power), while Ralph's interest remains rescue.

  **Why the Convention Fails**
  When the boys let the fire go out to hunt, it is not a failure of *convention* in the Lewisian sense; it is a divergence of *interests*. Lewis's theory assumes agents want to coordinate. Golding shows that when survival needs diverge (safety vs. food), the "common interest" condition vanishes.
  *   **Philosophical Insight:** *Lord of the Flies* demonstrates that Lewisian conventions are fragile because they depend on stable preferences. When the boys' preferences change (from rescue to hunting), the convention doesn't just break; it becomes irrelevant. You cannot have a convention to coordinate an action that half the group no longer wants to perform.

  ## 4. The Evolution of Norms: Common Knowledge and the Split
  This is where the "contested" aspect of Lewis's theory becomes vital for your presentation.

  **The Breakdown of Common Knowledge**
  Lewis argues conventions rely on a system of expectations. When the group splits into Ralph's camp and Jack's tribe, the "common" in common knowledge fractures.
  *   **Ralph's Group:** Maintains the convention that the conch grants speech.
  *   **Jack's Group:** Establishes a new convention where power grants speech (and the conch is irrelevant).

  Critics of Lewis (like Skyrms) argue that norms can evolve through dynamic interaction without explicit agreement. Golding dramatizes this evolution. Jack does not hold a vote to change the rules; he creates a new regularity through repeated action (the hunt, the dance, the feast). The boys conform to Jack not because of a prior agreement, but because the **expectation of punishment** (or exclusion) replaces the **expectation of coordination**.

  **Illuminating the Scene: Piggy vs. Jack**
  *   **Piggy (The Lewisian):** Piggy insists, "We got to follow the rules!" He represents the belief that the convention holds intrinsic value because it solves the coordination problem of social life. He assumes the conditional preference still exists ("If we don't follow rules, we are animals").
  *   **Jack (The Critic):** Jack asks, "Who cares?" He recognizes that without the power to enforce the expectation, the convention is empty.
  *   **The Philosophical Clash:** This scene highlights a limitation in Lewis's theory. Lewis explains how norms *work* when they are stable. Golding explains why they *fail* when fear enters the equation. Jack's dominance is not a coordination solution; it is a coercion solution. Lewis's framework struggles to account for norms sustained purely by terror rather than mutual benefit.

  ## 5. Cultural Specificity vs. Universal Coordination
  Does the novel suggest these are British school norms or universal devices?

  **The "Imported" Convention**
  The initial rules (raising hands, keeping a fire, assemblies) are clearly imported from British boarding school culture. They are not organic to the island. In Lewisian terms, these are conventions brought from a previous "game."
  **The "Emergent" Convention**
  The hunting rituals (the chant, the masks, the offering to the Beast) are organic conventions that evolve on the island. They solve a different coordination problem: managing fear. The dance coordinates the group's aggression against a common enemy (the Beast/pig).

  **Analysis:** Golding suggests that "civilized" norms (Lewisian conventions of democracy) are culturally specific and fragile. However, "tribal" norms (Lewisian conventions of ritual violence) are universal and robust because they coordinate with human psychology (fear/aggression) rather than against it. The novel implies that conventions aligned with base desires are more stable than those aligned with abstract rationality.

  ## 6. What *Lord of the Flies* Contributes to Philosophy
  If you are asking what Golding adds to the philosophical debate that formal logic cannot, consider these three points:

  1.  **The Emotional Substrate of Common Knowledge:**
      Lewis treats common knowledge as an epistemic state (what we know). Golding treats it as an emotional state (what we *feel* safe believing). The conventions fail not because the boys stop *knowing* the rules, but because they stop *trusting* that others will follow them. Golding adds **fear** as a variable in the calculation of conformity.

  2.  **The Role of the "Focal Point" in Violence:**
      Lewis focuses on conventions that solve cooperation. Golding shows that violence can also be a convention. The murder of Simon is a coordinated act sustained by the ritual dance. This challenges the optimistic view of convention as inherently pro-social. Conventions can coordinate destruction just as efficiently as rescue.

  3.  **The Precondition of Authority:**
      Formal game theory often assumes rational agents. Golding suggests that for Lewisian conventions to hold, there must be a perceived threat of external enforcement (the "adult world"). When the boys realize the "adult" is dead (the parachutist), the epistemic foundation of the convention crumbles. Golding argues that some conventions are not self-sustaining; they require a "myth" of higher authority to maintain the common knowledge of compliance.

  ## Summary for Your Presentation
  *   **Thesis:** The norms in *Lord of the Flies* begin as Lewisian conventions (arbitrary, cooperative regularities) but degrade into coercive rituals as the underlying common interest fractures.
  *   **Key Distinction:** Differentiate between the **Conch** (a fragile convention relying on mutual expectation) and the **Hunt** (a robust convention relying on shared emotion and fear).
  *   **Philosophical Nuance:** Acknowledge that while Lewis explains *how* conventions function in equilibrium, Golding explains the *psychological preconditions* (trust, shared interest, lack of overwhelming fear) required for that equilibrium to exist.
  *   **Conclusion:** The novel does not disprove Lewis, but it dramatizes the fragility of his conditions. It suggests that without a bedrock of shared interest and security, "common knowledge" is impossible, and convention collapses into power.

  ***

  ### Advice for Delivery
  *   **Define Terms Early:** When you speak, briefly define "Coordination Problem" vs. "Prisoner's Dilemma." This shows you understand the game theory behind Lewis.
  *   **Use the Text:** Quote Piggy ("We got to follow the rules") and Jack ("Who cares?") to anchor the philosophical abstract in the literary concrete.
  *   **Acknowledge Complexity:** Don't say "Golding proves Lewis wrong." Say "Golding reveals the psychological vulnerabilities in Lewis's model." This shows academic maturity.
