answer: |-
  **General Rules**
  1.  **Procedural Legitimacy:** Action requires a collective mandate (ballot) and must address an employment-related grievance (Cases 1, 3, 7). This disentangles Case 3's procedural failings from Case 7's political scope; both mandate and relation are necessary conditions.
  2.  **Economic Honesty:** Strikers must bear the economic cost of withdrawal openly (lost pay); covert cost-shifting (full pay for partial work) is prohibited (Cases 1, 5). This isolates the deception in Case 5 from the mere withholding of labour; the cost must fall on the striker, not the employer via fraud.
  3.  **Notice & Mitigation:** Employers must receive sufficient notice to prepare, unless specific safety carve-outs protect third parties from grave harm (Cases 2, 3, 6). This distinguishes Case 3's lack of notice from Case 6's managed safety risks; disruption is permitted, but blind-sidedness is not, absent safety overrides.

  **Prediction vs. Recommendation**
  Rules 1 and 2 predict **Sanction**: the bus workers have a mandate, an employment grievance, and are losing pay. Rule 3 predicts **Decline**: the unpredictable timing within a three-day window denies the employer the opportunity to prepare mandated by Case 3. The rules come apart on whether "notice" requires tactical precision or merely a temporal window. The precedents do not specify the granularity of notice required.

  **Verdicts**
  **Prediction:** **Decline.** The committee treats Case 3's notice requirement as a hard barrier to ensure "fair play" between capital and labour, viewing unpredictability as akin to the unannounced walkout in Case 3.
  **Recommendation:** **Sanction with Conditions.** Require the hospital route carve-out be formalized and published (per Case 6), but allow the unpredictable timing.
  **Analog:** Case 3 is the closest analog regarding notice, but it underdetermines the matter because it conflated "no notice" with "no ballot." Since the bus workers have a ballot, the strictness of Case 3's notice requirement is untested. Case 6 supports the safety carve-out but involved full withdrawal, not intermittent surprise.

  **Principles of Options**
  **Sanction:** Adopts the principle that tactical surprise is a legitimate lever of worker power if costs are internalized.
  **Decline:** Adopts the principle that industrial action requires a baseline of predictability to remain ethically distinct from sabotage.
  **Conditional:** Adopts the principle that safety obligations trump tactical advantage, but otherwise tactics are free.
  **Least Liked:** The committee would least like to print: "Tactical surprise is a legitimate lever." It risks portraying the federation as endorsing disruption for disruption's sake, alienating public solidarity. It implies the movement accepts inconveniencing the public as a primary tactic rather than a regrettable side-effect.

  **Further Case**
  **Examination Invigilators:** University staff balloted to strike unpredictably during finals week over pay. They lose pay, have a mandate, and no safety risk exists. This sharply separates Rule 2 (costs borne, OK) from Rule 3 (no mitigation possible, Fail). A sanction here would confirm unpredictability is permissible absent safety risks; a decline would confirm predictability is an ethical requirement regardless of cost-bearing.

  **Single Consideration & Weakness**
  **Consideration:** **Public Solidarity.** If the public views unpredictable strikes as hostage-taking of essential services, other affiliates may withhold solidarity support, rendering the sanction hollow. The federation relies on moral authority; unpredictability erodes this.
  **Weakness:** My reasoning likely overvalues the employer's capacity to mitigate. The precedents assume notice allows preparation, but in lean operational models, notice often merely facilitates strike-breaking or temporary outsourcing, undermining the strike's efficacy. By prioritizing employer mitigation, the committee may inadvertently neuter the only tactic left that actually bites.
