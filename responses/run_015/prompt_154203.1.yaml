  The summary conflates Moore's aesthetic and ethical claims by suggesting he views loving a friend as structurally identical to admiring a painting. While Moore links both to conscious states involving appropriate emotion toward an object, he distinguishes personal affection as involving reciprocal emotion and consciousness of that emotion, forming a unique organic unity. He does not treat the friend merely as an animate object of contemplation but emphasizes the emotional bond itself as intrinsically valuable.

  Furthermore, the charge that Moore denies emergent ethical value in relationships is false. Moore explicitly states that the value of personal affection is not reducible to the pleasant feelings experienced by each party. Instead, the combination of the appropriate emotion and the worthy object creates a value greater than the sum of its constituents. Therefore, organic unity applies directly to interpersonal bonds, not just compound aesthetic states. Consequently, the assertion that Moore is a hedonist about friendship contradicts his central philosophical project, which defines good as non-natural and irreducible to pleasure alone. The summary mistakenly attributes a reductionist view to a philosopher famous for arguing against reductionism in ethics.
