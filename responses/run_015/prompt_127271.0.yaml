prompt: |-
  I'm a retired molecular biologist who got into philosophy of language after retirement -- my daughter gave me Austin's classic lectures and now I'm hooked, though I still think like an experimentalist. I'm trying to help my old university's research-integrity office build something practical, because they're constantly dealing with disputes where a scientist said something in a meeting or an email and later everyone fights about whether it was actually an apology, a promise, or a resignation, or just talk. They need a reusable decision procedure: questions to ask in order, what counts as a sufficient answer to each, where it stops with a clear "no, not a performative," and where it has to hand the call to a person because it's values rather than facts. The office deals with this maybe twice a month, the stakes are career-level, and the mediator running it has about thirty mintues and no philosophy background.

  Please ground it in speech-act theory -- specifically felicity conditions, uptake, and Austin's distinction between misfire and abuse -- but don't just list Austin's conditions. Instead, translate them into tests a mediator can run, say which ones matter for institutional settings like a university and which can be dropped without losing the point, and be explicit about where the procedure will misfire or need judgment. Then apply it to three cases: a PI emailing the dean "I apologize for the sloppy methods" but never copying the affected grad student; a collaborater saying "I'll correct the figure by Friday" on a Zoom call with broken audio; and a lab head declaring "I'm stepping down as PI" in a staff meeting but later saying it was hypothetical. For each, show the step-by-step, flag the case where the procedure gives an answer the office probably won't like, and say clearly what the procedure can't settle. Also inject some idea about institutional authority -- maybe that the speaker has to be recognized by the group in a specific role for the act to take, not just by formal title -- since that seems to be the crux in half these cases.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User Persona:** Retired molecular biologist, new to philosophy of language (specifically J.L. Austin), thinks like an experimentalist. Wants practical application, not just theory.
      *   **Client:** University Research Integrity Office (RIO).
      *   **Problem:** Disputes over speech acts in professional settings (apologies, promises, resignations vs. "just talk").
      *   **Constraints:**
          *   Reusable decision procedure (flowchart-style logic).
          *   Mediator has 30 mins, no philosophy background.
          *   Stakes are career-level.
          *   Frequency: ~2/month.
          *   Must ground in Speech Act Theory (Felicity Conditions, Uptake, Misfire vs. Abuse).
          *   Must translate theory into practical tests.
          *   Must address Institutional Authority (role recognition vs. formal title).
          *   Must identify where the procedure fails/needs human judgment.
          *   Must apply to three specific cases.
          *   Must flag where the procedure gives an unpopular answer.
          *   Must state clearly what cannot be settled.

  2.  **Deconstruct the Theory (Austin & Co.) for the Practical Context:**
      *   *Illocutionary Act:* The core action (promising, apologizing, resigning).
      *   *Felicity Conditions:* The rules that make the act valid.
          *   (A) Conventional procedure exists & participants/roles are correct.
          *   (B) Execution is correct & complete.
          *   (C) Participants have requisite thoughts/feelings (sincerity) & subsequent conduct matches.
      *   *Misfire:* The act *doesn't happen* (void). Usually A or B conditions fail.
      *   *Abuse:* The act *happens* but is hollow/insincere. Usually C conditions fail.
      *   *Uptake:* The audience understands and accepts the act. Crucial for completion.
      *   *Institutional Authority:* In a university, "PI" or "Dean" isn't just a title; it's a recognized capacity to act within specific protocols.

  3.  **Drafting the Decision Procedure (The "Protocol"):**
      *   *Goal:* A checklist/flowchart for a non-philosopher.
      *   *Step 1: Authority & Procedure (Austin's A conditions).* Does this person have the right to say this *here*? Is there a rule for this?
      *   *Step 2: Execution (Austin's B conditions).* Was it clear? Was it heard? (Uptake).
      *   *Step 3: Sincerity/Conduct (Austin's C conditions).* Did they mean it? Did they follow through? (This is often where "Abuse" lives).
      *   *Decision Point:* Distinguish between "It didn't count" (Misfire) and "It counted but was broken" (Abuse).
      *   *Constraint:* Keep it under 30 mins. Focus on *evidence*, not mind-reading.

  4.  **Refining for the "Experimentalist" Mindset:**
      *   Use language like "observable data," "controls," "variables."
      *   Emphasize reproducibility (would a reasonable observer agree?).
      *   Acknowledge noise (broken audio, ambiguous context).

  5.  **Addressing Institutional Authority:**
      *   It's not just "Is she the PI?" It's "Is she acting *as* PI in this context?" (e.g., staff meeting vs. bar chat).
      *   Need a test for "Recognized Capacity."

  6.  **Developing the Three Cases:**
      *   *Case 1 (Email Apology):* PI to Dean, not copying student.
          *   *Issue:* Uptake by the harmed party? Authority to apologize on behalf of the lab?
          *   *Theory:* Apology requires acknowledgement by the wronged party to be fully felicitous, but institutionally, an apology to the Dean might satisfy compliance.
          *   *Verdict:* Likely an "Abuse" (insincere/procedurally flawed) rather than a "Misfire" (void). It *was* an apology, just a bad one.
      *   *Case 2 (Zoom Promise):* "I'll correct the figure." Broken audio.
          *   *Issue:* Uptake. Did anyone hear it?
          *   *Theory:* If uptake fails, the act misfires.
          *   *Verdict:* Misfire. No promise made if no one heard/confirmed.
      *   *Case 3 (Resignation):* "Stepping down" in staff meeting, later "hypothetical."
          *   *Issue:* Context & Authority. Was it a formal declaration or musing?
          *   *Theory:* Performatives require specific context.
          *   *Verdict:* Ambiguous. Depends on "Institutional Framing." This is where the procedure hands off to humans.

  7.  **Identifying the "Unpopular Answer" & Limitations:**
      *   *Unpopular:* Case 1. The RIO wants to say "That's not a real apology." The procedure might say "It counts as an apology, just an insincere one." This matters for liability.
      *   *Limitations:* Intent (Sincerity) is unobservable. The procedure can only judge based on *conduct* following the speech.

  8.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the user's background (biology -> philosophy). Set the tone (pragmatic, rigorous).
      *   **The Protocol (The "Assay"):** Step-by-step questions.
      *   **Theoretical Grounding:** Briefly explain *why* these steps map to Austin (Misfire/Abuse/Uptake).
      *   **Institutional Authority:** Specific section on role recognition.
      *   **Case Studies:** Apply the protocol.
      *   **Limitations:** Where the "assay" fails.

  9.  **Refining the Content (Self-Correction during drafting):**
      *   *Critique:* Is this too academic?
      *   *Fix:* Use bold headers, bullet points, and "If/Then" logic. Call it a "Protocol" not a "Theory."
      *   *Critique:* Did I address the "30 minutes" constraint?
      *   *Fix:* Emphasize that Steps 1 & 2 are document checks (fast). Step 3 is the judgment call.
      *   *Critique:* Did I handle the "Authority" bit?
      *   *Fix:* Make Step 1 specifically about "Institutional Capacity."
      *   *Critique:* The user asked to flag where the procedure gives an answer the office won't like.
      *   *Fix:* Explicitly highlight this in Case 1. The office wants to invalidate the apology to protect the student; Austin might say the act *occurred* but was abusive. This is a crucial distinction for liability.

  10. **Final Polish:** Check tone. Respectful of the user's new interest but grounded in their old expertise. Ensure Austin's terms (Misfire, Abuse, Uptake) are used correctly but translated. (e.g., Misfire = Null Result; Abuse = Contaminated Sample).

  *(Self-Correction on Case 1)*: Wait, if the apology is to the Dean about methods, but the student is the victim, is it an apology *to the student*? No. It's an admission of fault to administration. The dispute is likely "Did he apologize to the *lab*?" The protocol needs to distinguish the *target* of the speech act. I will clarify this in the analysis.

  *(Self-Correction on Case 3)*: Resignation is a specific institutional act. Usually requires written notice. If spoken, does it count? Austin says convention matters. If the convention is "written only," spoken is a misfire. If convention is "any clear declaration," it counts. I need to make the protocol check the *university bylaws*.

  11. **Final Review against constraints:**
      *   Grounded in Speech Act Theory? Yes.
      *   Reusable decision procedure? Yes.
      *   Tests for mediator? Yes.
      *   Institutional authority included? Yes.
      *   Three cases applied? Yes.
      *   Unpopular answer flagged? Yes.
      *   Limitations stated? Yes.

  Proceed to generate response.cw
answer: |-
  This is a fascinating translation problem: taking high-level philosophical taxonomy and turning it into a Standard Operating Procedure (SOP) for an administrative office. As a fellow experimentalist, I know the appeal of Austin. He treats language like a reagent—it doesn't just describe the world; it changes the state of the system, provided the conditions are right.

  For your Research Integrity Office (RIO), the goal isn't to find "Truth" in a metaphysical sense, but to determine **Illocutionary Validity**. Did the speech act successfully change the institutional state (e.g., create an obligation, end a tenure, settle a grievance)?

  Below is a proposed protocol. I have translated Austin's *felicity conditions* into an "Assay for Performative Validity." I've also integrated the concept of **Institutional Capacity**, which is often the variable researchers forget. In a lab, you can't pipette if you haven't been trained on the pipette; in a university, you can't resign or promise on behalf of the lab unless you are recognized as having the *capacity* to do so in that context.

  ---

  # The RIO Performative Validity Protocol (PVP)

  **Purpose:** To determine if a disputed utterance constitutes a binding institutional speech act (Promise, Apology, Resignation, Admission).
  **Time Limit:** 30 Minutes.
  **Operator:** RIO Mediator (No philosophy training required).
  **Theoretical Basis:** J.L. Austin's *How to Do Things with Words* (Felicity Conditions, Uptake, Misfire vs. Abuse).

  ## Phase 1: The Capacity Check (Austin's Condition A)
  *Goal: Determine if the speaker had the institutional authority to perform the act in this specific context.*

  **Q1: Does the institution have a conventional procedure for this act?**
  *   *Test:* Check the Faculty Handbook, HR policies, or Grant Terms.
  *   *Example:* Is there a rule that resignations must be in writing? Is there a defined process for formal apologies in misconduct cases?
  *   *Decision:*
      *   **No Procedure Exists:** Proceed to Q2. (The act relies on general social norms).
      *   **Procedure Exists:** Did the speaker follow it?
          *   **No:** **STOP.** Verdict: **MISFIRE.** The act is null and void. (e.g., A verbal resignation when written is required).
          *   **Yes:** Proceed to Q2.

  **Q2: Was the speaker acting in a "Recognized Capacity"?**
  *   *Test:* Look at the setting and the role. Was the speaker acting as *PI/Dean/Employee*, or as a private individual?
  *   *Evidence:* Email signature, meeting agenda, subject line, presence of subordinates.
  *   *Decision:*
      *   **Private Capacity:** (e.g., At a bar, no official header). **STOP.** Verdict: **NON-BINDING.** (It may be a personal promise, but not an institutional one).
      *   **Official Capacity:** Proceed to Phase 2.

  ## Phase 2: The Transmission Check (Austin's Condition B & Uptake)
  *Goal: Determine if the act was executed clearly and received by the relevant audience.*

  **Q3: Was the illocutionary force unambiguous?**
  *   *Test:* Would a reasonable third party reading the transcript/hearing the recording identify the verb of action? (e.g., "I promise," "I resign," "I apologize" vs. "I might," "I was thinking," "Regrettably, errors occurred").
  *   *Decision:*
      *   **Ambiguous/Hypothetical:** **FLAG FOR HUMAN JUDGMENT.** (See Limitations below).
      *   **Clear:** Proceed to Q4.

  **Q4: Was there "Uptake"?**
  *   *Test:* Did the intended audience receive and acknowledge the act *at the time*?
  *   *Evidence:* Email read receipts, meeting minutes, verbal confirmation ("Understood," "Thank you"), or lack of technical failure.
  *   *Decision:*
      *   **No Uptake:** (e.g., Email bounced, audio failed, no one present). **STOP.** Verdict: **MISFIRE.** (An act requires a receiver to be complete).
      *   **Uptake Confirmed:** Proceed to Phase 3.

  ## Phase 3: The Integrity Check (Austin's Condition C)
  *Goal: Distinguish between a valid act that was broken (Abuse) vs. a valid act that stands.*

  **Q5: Is there evidence of subsequent conduct contradicting the act?**
  *   *Test:* Compare actions in the 2 weeks following the utterance against the content of the utterance.
  *   *Decision:*
      *   **Conduct Matches:** Verdict: **VALID & FELICITOUS.** (Case Closed).
      *   **Conduct Contradicts:** Verdict: **VALID BUT ABUSIVE.**
          *   *Note:* This is critical. The act *happened*, but the speaker was insincere or negligent. This creates liability/breach, it does not erase the act.

  ---

  # Theoretical Grounding for the Mediator
  *Keep this in your back pocket if someone challenges the protocol.*

  1.  **Misfire (Phases 1 & 2):** The act simply did not occur. Like a PCR reaction with no enzyme. It doesn't matter what the speaker *meant*; the institutional conditions weren't met. The status quo remains unchanged.
  2.  **Abuse (Phase 3):** The act occurred, but the "reagents" were contaminated (insincerity). The resignation counts, even if they regret it. The promise was made, even if they broke it. This shifts the dispute from "Did they say it?" to "They breached the obligation."
  3.  **Uptake:** Austin argues a performative needs an audience to secure its effect. If the audio cuts out, the promise is like a tree falling in the woods with no one to hear it—it creates no social obligation.
  4.  **Institutional Authority:** Austin notes that for some acts (sentencing, marrying, hiring), the speaker must be a specific person *recognized* as such. In science, a Postdoc cannot promise lab resources on behalf of the PI unless delegated. This is the "Recognized Capacity" check.

  ---

  # Case Studies

  Here is how the PVP applies to your three scenarios.

  ### Case 1: The Email Apology
  **Scenario:** PI emails Dean: "I apologize for the sloppy methods." Does not copy the affected grad student. Student claims they never received an apology.
  **PVP Run:**
  1.  **Capacity:** PI is acting in official capacity (Email to Dean). **Pass.**
  2.  **Procedure:** Is there a rule on apologies? Usually no specific form. **Pass.**
  3.  **Ambiguity:** "I apologize" is explicit. **Pass.**
  4.  **Uptake:** The Dean received it. **Pass.** (Note: The *student* is not the addressee of this specific speech act).
  5.  **Conduct:** PI does not apologize to student later.
  **Verdict:** **VALID BUT ABUSIVE.**
  **Analysis:** The PI *did* apologize. They apologized to the administration, admitting fault. They did not apologize to the student.
  **The Unpopular Answer:** The RIO likely wants to tell the student, "He never apologized to you, so we will force one." The PVP says, "He *did* apologize institutionally. He admitted guilt to the Dean."
  **Why this matters:** If you rule it a "Misfire" (no apology happened), you erase the admission of guilt. If you rule it "Abuse," you keep the admission of guilt on record (useful for misconduct findings) but acknowledge the student was slighted.
  **Limitation:** The protocol cannot settle *moral* satisfaction. It settles *institutional* record.

  ### Case 2: The Broken Zoom Promise
  **Scenario:** Collaborator says "I'll correct the figure by Friday" on Zoom. Audio glitches. No one acknowledges. Friday comes, no figure.
  **PVP Run:**
  1.  **Capacity:** Collaborator acting in professional role. **Pass.**
  2.  **Procedure:** No formal rule for figure correction. **Pass.**
  3.  **Ambiguity:** "I'll correct" is a promise. **Pass.**
  4.  **Uptake:** Audio broken. No one said "Okay." Chat log shows gap.
  **Verdict:** **MISFIRE.**
  **Analysis:** Without uptake, the illocutionary act was not secured. It was noise, not a promise.
  **Outcome:** The collaborator is not in breach of a promise because the promise was never successfully transmitted.
  **Limitation:** This feels unjust to the listener. But experimentally, the data (the audio) is corrupted. The protocol forces the RIO to treat this as a communication failure, not a integrity violation.

  ### Case 3: The Hypothetical Resignation
  **Scenario:** Lab Head in staff meeting: "I'm stepping down as PI." Later claims: "I was just thinking out loud/hypothetical."
  **PVP Run:**
  1.  **Capacity:** Lab Head in staff meeting (Official setting). **Pass.**
  2.  **Procedure:** University Bylaws check.
      *   *Scenario A:* Bylaws say "Resignation must be written to the Dean."
      *   *Scenario B:* Bylaws are silent.
      *   *Let's assume Scenario B (Silent).* **Pass.**
  3.  **Ambiguity:** "I'm stepping down" is declarative. However, context cues (tone, preceding words like "If I were...") matter.
      *   *If literal:* **Pass.**
      *   *If contextual cues suggest hypothetical:* **FLAG FOR HUMAN JUDGMENT.**
  4.  **Uptake:** Staff gasped, minutes recorded it. **Pass.**
  **Verdict:** **LIKELY VALID (Hand-off to Human).**
  **Analysis:** This is the danger zone. In Austin's terms, was this an *etiolation* of language (using words in a play or poem where they don't count)?
  **The Judgment Call:** The Mediator must interview witnesses. Did the speaker pause? Did they say "Hypothetically"?
  **Institutional Authority Crux:** A Lab Head has the authority to resign, but do they have the authority to resign *verbally in a meeting*? Usually, no. This act requires a specific conventional procedure (letter to HR).
  **Corrected Verdict (if Bylaws require letter):** **MISFIRE.** The speaker lacked the procedural authority to resign via speech act in a meeting.
  **Outcome:** The speaker remains PI. The statement was "talk," not action.

  ---

  # Where the Procedure Will Misfire (Limitations)

  You asked for explicit boundaries where the PVP fails and human judgment is required. As an experimentalist, you know every assay has a limit of detection.

  **1. The "Irony and Tone" Variable (Phase 2, Q3)**
  The protocol relies on text/transcripts. It cannot detect sarcasm or "thinking out loud" unless explicitly marked.
  *   *Risk:* A speaker says "I guess I'm fired then" jokingly after a mistake. The protocol might flag this as a Resignation (Misfire or Valid).
  *   *Fix:* This requires the "Human Judgment" hand-off. The mediator must weigh witness testimony on tone. The PVP cannot settle intent, only observable form.

  **2. The "Sincerity" Black Box (Phase 3)**
  Austin distinguishes between the act happening and the act being sincere. The PVP treats insincerity as **Abuse**, not **Misfire**.
  *   *Risk:* The RIO often wants to say "That doesn't count" when someone is insincere. The PVP forces you to say "That counts, but they are in breach."
  *   *Implication:* This changes the remedy. You don't ask them to say it again (it already happened); you sanction them for the contradiction in conduct.

  **3. Institutional Authority vs. Formal Title**
  You noted that authority is about recognition, not just title.
  *   *Risk:* A Department Chair might have the *title*, but if the faculty has voted "No Confidence," do they have the *capacity* to promise resources?
  *   *Fix:* Phase 1, Q2 needs to be sensitive to "Social License." If the group does not recognize the speaker's authority (even if HR does), uptake will fail, leading to a Misfire. The mediator must assess the *group's* recognition, not just the Org Chart.

  # Summary for the Mediator
  *   **Misfire:** The act is void. (Like a pipette with a cracked tip). Status quo ante.
  *   **Abuse:** The act is valid but tainted. (Like using contaminated reagents). The reaction happened, but the result is compromised. Sanction the speaker.
  *   **Uptake:** If no one heard it, it didn't happen.
  *   **Authority:** If the rules say "Written Only," spoken is void.

  This protocol protects the university from "he said/she said" by focusing on **conventional procedures** and **observable uptake**, rather than diving into the speaker's soul. It accepts that sometimes, a promise was made and broken (Abuse), rather than pretending it was never made (Misfire). That distinction is usually where the legal liability lies.
