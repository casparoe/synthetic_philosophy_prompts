  **Sestina of the Ground**

  Existence settles on the quantum **field**.
  Excitations manifest as **atom**.
  Structure relies upon the chemical **bond**.
  Function organizes in the **cell**.
  Signal rests along the **nerve**.
  Agency resides in human **choice**.

  No temporal origin for **choice**.
  Dependence sinks into the **field**.
  Not history running down the **nerve**.
  But status fixed within the **atom**.
  Reality housed inside the **cell**.
  Identity held by the **bond**.

  Stronger than iron is the **bond**.
  Yet bears the weight of every **choice**.
  A hub perhaps, grounded in the **cell**.
  Which draws being from the **field**.
  No free floating unattached **atom**.
  Fire travels back up the **nerve**.

  Impulse moves without a separate **nerve**.
  The **cell** is nothing over and above the **bond**.
  Stability sought in the **atom**.
  Determinants pressing on the **choice**.
  All submerged in the underlying **field**.
  Organization distinct within the **cell**.

  Every path leads through the central **cell**.
  A hub of traffic on the **nerve**.
  But not the bottom of the **field**.
  Connections rely on the **bond**.
  Freedom felt in the **choice**.
  Substance reduced to the **atom**.

  Nothing smaller than the **atom**.
  Function flows through the **cell**.
  Responsibility for the **choice**.
  Pathway clear along the **nerve**.
  Structure tightens in the **bond**.
  Explanation stops at the **field**.

  No further ground for **choice** than **bond** and **cell**.
  Truth runs through the **nerve**.
  Resting in **atom** and the **field**.

  ***

  **Note on Fundamentality**

  This poem treats the quantum field as the bedrock of the grounding chain, terminating the series rather than allowing infinite descent. The field grounds the atom, which grounds the bond, and so on up to choice. While every end-word appears in every stanza, ubiquity does not confer fundamentality; the field is bedrock not because it is everywhere, but because nothing grounds it. The cell and nerve function as hubs: load-bearing structures through which explanation passes, yet they are themselves grounded. The poem relies on the transitivity of grounding (if A grounds B and B grounds C, A grounds C) to maintain the chain's integrity despite the sestina's scrambling. The "nothing over and above" line in stanza four asserts non-causal dependence: the cell exists in virtue of the bond, not as a separate entity. By placing "atom" and "field" in the final line, the envoi marks the limit of explanation. This rejects monism; the rungs are distinct. It also rejects the "hub equals bedrock" confusion: a node can be structurally essential without being fundamental. The poem commits to finitism, avoiding the turtles-all-the-way-down shrug.
