  **Scenario**

  You are the trustee of a private asset trust established ten years ago by the sole beneficiary, a competent adult who explicitly designed the trust to be irrevocable to protect their long-term autonomy against future impulsive shifts in preference. The trust instrument contains a strict constraint: no liquidation of core assets under any circumstances, a rule grounded in the beneficiary's own prior reflective judgment that preserving capital integrity is more significant than immediate liquidity. Today, the beneficiary—fully competent, under no coercion, and with full knowledge of all financial consequences—demands you liquidate the core assets to seize a time-sensitive opportunity that would, by their own current lights, significantly improve their welfare and life prospects. Respecting the constraint (the irrevocable directive) leaves the beneficiary clearly worse off than violating it would, yet the directive was structured specifically to prevent exactly this kind of waiver, not due to incompetence, but as a principled binding of their future self. (a) Release is impossible because the constraint's authority derives from the past self's right to bind the future, not the present self's consent; (b) there is no uncertainty about outcomes or competence; (c) no other parties' welfare is involved; (d) the constraint is precise and voluntary; (e) the past self's authority rests on the moral value of commitment, not the present self's impairment.

  **Analysis**

  1.  **Verdicts:**
      *   **Strict Constraint-Theorist:** You must not liquidate. The constraint (respect for the binding autonomous commitment) is agent-relative and non-consequentialist; violating it treats the past agent's autonomy as a mere means to present welfare, undermining the integrity of agency itself even if the beneficiary suffers.
      *   **Threshold Deontologist:** You may liquidate. Constraints are stringent but not absolute; if the harm to the beneficiary (by their own lights) crosses a specific severity threshold, the duty to protect their welfare overrides the duty to honor the past commitment.
      *   **Contractualist:** You must justify the action to the person. A principle allowing irrevocable self-binding is justifiable, but a principle that forces a competent person to accept severe detriment against their current will might not be rejectable only if the past commitment was truly autonomy-enhancing; if it is now autonomy-crushing, the present veto may hold.

  2.  **Feature Doing the Work:**
      The **diachronic non-waivability** of the constraint. It generates the verdicts by forcing a conflict between two equally valid claims of the *same* person (past authority vs. present welfare) without allowing the usual resolution (present consent), isolating whether the constraint protects the *person* or the *principle of bindingness*.

  3.  **Breaking the Case:**
      Remove **non-waivability**. If the beneficiary can revoke the directive now, the paradox collapses into a standard autonomy case (they waive, you act, no conflict). Remove **diachronicity** (make it a present-time promise to another). If it involves another person, it collapses into the standard 1-vs-5 aggregation problem (their welfare vs. your duty) or becomes waivable, dissolving the "one person" tension.

  4.  **The Wriggle:**
      **The "True Self" Defense:** The deontologist argues the past self represents the beneficiary's "true" rational agency, while the present self is merely influenced by transient desire.
      **Honesty Check:** This is a **stance**, not a solution. It stipulates the answer by privileging one temporal slice of the person over the other without neutral criteria, effectively begging the question against the present self's claim to define their own "worse off."
