answer: |-
  ### Budget Allocation

  **The Variable Fact:** The technical integrity of the four hard drives (whether they require standard imaging or forensic data recovery).

  **Version A (Drives are readable with standard imaging):**
  1.  **Popular series:** 0.25 — This secures political capital from stakeholders by delivering the high-volume "pages online" metrics they demand.
  2.  **Unpopular series:** 0.15 — Allocating here deliberately disrupts the feedback loop that reinforces historical bias toward already-frequent topics.
  3.  **Shadow index:** 0.10 — This funds the intellectual labor required to document absences without consuming the budget needed for actual file conversion.
  4.  **Oral histories:** 0.20 — Community partners capture living memory that counterbalances the static, state-centric paper trail before witnesses pass.
  5.  **Born-digital rescue:** 0.30 — The eighteen-month deletion window creates an absolute deadline that makes this the highest immediate preservation risk.

  **Version B (Drives require expensive forensic recovery):**
  1.  **Popular series:** 0.30 — If drive recovery eats the budget, you must over-index on stakeholder metrics to justify the remaining spend.
  2.  **Unpopular series:** 0.10 — This is reduced to a token amount to maintain the principle of diversity without jeopardizing critical rescue work.
  3.  **Shadow index:** 0.05 — This becomes a minimal metadata exercise rather than a full indexing project to free up cash for technical recovery.
  4.  **Oral histories:** 0.25 — Since the digital records might be lost regardless, investing in human sources becomes the primary mitigation strategy.
  5.  **Born-digital rescue:** 0.30 — The cost per gigabyte skyrockets, consuming the same total fraction despite yielding fewer recoverable files.

  ***

  ### Responsibility for Silence (100 Points)

  **Silence:** "We know almost nothing about the people who were policed and quite a lot about the people who did the policing."

  *   **Stage 1: Sources Made (45 points)** — The power dynamic of policing ensures the state generates the paperwork while the policed rarely generate counter-records.
  *   **Stage 2: Archive Assembled (25 points)** — Institutional archives traditionally prioritize the records of the governing body over the ephemera of the governed.
  *   **Stage 3: Sources Retrieved (10 points)** — Researchers naturally follow existing finding aids which are structured around the police department's filing system.
  *   **Stage 4: Narrative Built (20 points)** — Historians often interpret the abundance of police data as structural truth rather than as an artifact of surveillance bias.

  ***

  ### Reversibility Tiers

  **Tier S (Irreversible): Bucket 5 (Born-digital rescue)**
  Once the retention schedule executes and the drives are wiped or physically degraded, that specific data state is gone forever.

  **Tier A (High Attrition): Bucket 4 (Oral histories)**
  If you do not record these witnesses now, their deaths will permanently close the specific informational channels they hold.

  **Tier B (Degradable): Bucket 3 (Shadow index)**
  If you skip this, the institutional knowledge of what is missing fades as staff retire, though the physical gaps in the collection remain unchanged.

  **Tier C (Stable): Bucket 1 (Popular series) & Bucket 2 (Unpopular series)**
  Paper records do not vanish if left on the shelf, meaning the decision to digitize them can be reversed or delayed in a future budget cycle.

  ***

  ### Critique of Framing

  Your framing is intellectually robust but politically dangerous for a state archive budget meeting. The "Shadow Index" and "Unpopular Series" buckets produce zero "pages online," which directly contradicts the metric your stakeholders care about most. To survive the meeting, you need to rebrand the "Shadow Index" as "Collection Risk Metadata" and the "Unpopular Series" as "Diversifying Search Traffic," translating your ethical concerns into language about long-term platform sustainability and user acquisition. If you present the "survivorship gradient" as a moral argument rather than a preservation risk assessment, you risk having those line items cut as "academic extras."
