answer: |-
  ### Teaching Plan: Argumentative Defeat vs. Honor Depletion

  **Session Duration:** 40 Minutes
  **Target Audience:** Undergraduates (Intro Ethics background, no Moral History)
  **Core Objective:** Distinguish between moral change driven by rational persuasion ("Argumentative Defeat") and change driven by the collapse of social recognition ("Honor Depletion").

  ---

  #### 1. Explanatory Arc and Dependency Order
  **Strategy:** Validate the Intuitive Model $\rightarrow$ Reveal the Anomaly $\rightarrow$ Introduce the Honor Model.

  *   **Rationale:** Do not begin with the phenomenology of honor. Students with introductory ethics training possess a strong prior belief that moral progress is the result of better reasoning prevailing over worse reasoning (the "Enlightenment Script"). If you begin with dense theory about honor codes, they will view it as a niche sociological add-on rather than a challenge to their ethical framework.
  *   **Sequence:**
      1.  **Elicit the Intuition (Minutes 0–5):** Briefly ask the class how they assume immoral practices end. Expect answers like "people realized it was wrong" or "philosophers proved it was unjust." Label this **Argumentative Defeat**. Grant this model its due: it *does* happen (e.g., segregation laws overturned by legal/moral reasoning).
      2.  **Introduce the Anomaly (Minutes 5–10):** Present the historical lag. Show that for certain practices, the moral arguments existed for centuries *before* the practice ended. If argument were the sole driver, the practice should have ended when the argument was first formulated. It didn't.
      3.  **Deploy the Alternative (Minutes 10–30):** Introduce **Honor Depletion**. Explain that practices persist not because people think they are *good*, but because they are necessary for *social standing*. The change occurs not when the practice is refuted, but when the *audience* whose recognition matters shifts its gaze.
      4.  **Synthesis (Minutes 30–40):** Check for understanding and address implications.

  ---

  #### 2. The Carrying Example
  **Primary Anchor:** **The Decline of Foot-Binding in Late Qing/Early Republic China.**
  **Secondary Reference:** **19th-Century Dueling in France/UK.**

  *   **Why Foot-Binding?** It provides the starkest evidence against the "Argumentative Defeat" model. Moral critiques of foot-binding existed in Chinese literature for nearly 1,000 years prior to its collapse. If rational argument were sufficient, the practice should have ended in the 12th century. It ended only in the early 20th century. This creates the necessary friction to introduce your "Honor Depletion" thesis.
  *   **Required Inclusions:**
      *   **The Internal Honor Code:** You must explain that foot-binding was not merely "beauty" but a marker of family status, discipline, and marriageability. A bound foot signaled a family's wealth (they didn't need the girl to work) and the girl's moral virtue (endurance).
      *   **The Shift in Visibility:** You must detail how the "audience" changed. It was not that Chinese men suddenly read Kant; it was that the Chinese elite began to seek recognition from *international* powers (the West/Japan) who viewed the practice as barbaric. To be "modern" and "respected" globally, the practice had to go.
  *   **Required Exclusions:**
      *   **Economic Determinism:** Do not allow the explanation to rest solely on "industrialization made bound feet impractical." While true, this undermines the honor thesis. You must emphasize that the *symbolic value* collapsed *before* the economic necessity became absolute.
      *   **State Coercion:** Avoid focusing primarily on legal bans. Laws followed the shift in honor; they did not create it.
  *   **Role of the Secondary Case (Dueling):**
      *   Use Dueling only as a **stress test** (Minutes 25–30). Once they understand Foot-binding via Honor Depletion, ask: "Does this fit Dueling?"
      *   *Purpose:* To show the theory's portability. Dueling didn't end because people argued violence was wrong (they knew that); it ended because the *type of man* who dueled became associated with backwardness, while the "modern gentleman" found honor in commerce or civil service. Keep this brief to avoid diluting the primary example.

  ---

  #### 3. Misconception Mapping
  Anticipate these three specific errors and defuse them at the following junctures:

  *   **Misconception A: Conflating Honor with Mere Reputation.**
      *   *The Error:* Students will think honor is just "what people think of me" (reputation), implying superficiality.
      *   *The Fix:* **Minute 12 (During Definition).** Explicitly distinguish *reputation* (what people say about you) from *honor* (your entitlement to respect based on shared internalized standards). Honor is identity-constituting; reputation is external noise. If they think it's just reputation, they will think the change was merely cosmetic.
  *   **Misconception B: The "Conspiracy of Elites" Fallacy.**
      *   *The Error:* Students will assume a group of leaders sat down and decided to "deplete honor" to engineer social change.
      *   *The Fix:* **Minute 20 (During Mechanism).** Emphasize that Honor Depletion is often structural and unintentional. Practitioners didn't decide to lose honor; they found themselves unable to *claim* it without incurring shame. The "economy" shifted beneath them, not by their design.
  *   **Misconception C: Exculpation of Moral Agency.**
      *   *The Error:* Students will worry this thesis suggests participants weren't morally responsible because they were "trapped" by norms.
      *   *The Fix:* **Minute 35 (Post-Example/Pre-Check).** Clarify that explaining the *cause* of the collapse is not the same as excusing the *practice*. Appiah/Williams argue we understand *how* change happens, not that the prior suffering was justified. The thesis explains the *timing* of the end, not the *wrongness* of the act.

  ---

  #### 4. Check for Understanding
  **Format:** Diagnostic Scenario (Minute 35–38)
  **Goal:** Distinguish between "Social Pressure" (generic) and "Honor Depletion" (specific to recognition/identity).

  **The Exercise:**
  Present the following short vignette to the class (projected or handout):
  > *In Country X, smoking is widely known to be unhealthy. Doctors have argued against it for decades (Argumentative Defeat conditions). Smoking rates remain high. Suddenly, smoking rates plummet. Surveys show smokers didn't change their minds about health. Instead, smokers report that lighting a cigarette in public now makes them feel "unworthy of respect" in professional settings, whereas non-smokers are viewed as "disciplined citizens."*

  **The Question:**
  "Based on our distinction, did this change occur via **Argumentative Defeat** or **Honor Depletion**? Identify the specific sentence in the vignette that proves your answer."

  **Correct Answer Key:**
  *   **Diagnosis:** Honor Depletion.
  *   **Proof:** The sentence regarding "unworthy of respect" and "disciplined citizens."
  *   **Why this works:** It forces them to see that the *moral argument* (health) was present but ineffective until the *honor economy* (respect/discipline) shifted. If they simply say "social pressure," press them: "Was it pressure (force) or status (honor)?"

  ---

  #### 5. Explicit Exclusions
  To maintain focus and feasibility within 40 minutes, strictly omit the following:

  *   **Williams's Skepticism on Moral Progress:** Do not introduce Bernard Williams's broader worry that if change is driven by honor rather than truth, we cannot claim we are "morally better" than our ancestors, only "different." This is a meta-ethical rabbit hole that will derail the session into skepticism. Keep the focus on the *mechanism of change*, not the *status of progress*.
  *   **Modern Analogies (Cancel Culture/Public Shaming):** Resist the urge to ask, "Is this like Twitter cancel culture?" This triggers immediate political defensiveness and distracts from the historical analysis. Keep the case studies historical (19th/early 20th century) to ensure analytical distance.
  *   **Quantitative Claims:** Do not present graphs or statistics about the *rate* of decline (e.g., "foot-binding dropped 10% per decade"). The thesis is conceptual/qualitative. Numbers imply a precision the honor model does not require and will invite scrutiny on data sources rather than the philosophical mechanism.
