prompt: |-
  As a longtime reader of rationalist blogs and forums now leading evaluation of analogical reasoning for a small artificial intelligence lab, I need a reusable grading procedure that turns the idea of fluid concepts and conceptual slippage into something non-specialists can apply consistently.

  We maintain an open benchmark of Copycat-style microdomain problems. Each item shows a source transformation and a target, plus two or three candidate completions produced by models. Raters must classify each candidate as acceptable, strained but defensible, or incorrect, with a one-sentence justification that another rater could audit. The relevant pressures include whether a concept such as successor, same group, leftmost, or alphabetical order is being preserved literally or slipped in a principled way, whether a snag such as hitting the end of the alphabet is handled by wrapping, mirroring, or refusing, and whether surface similarity is mistaken for structural similarity.

  About two hundred fifty completions arrive per week. Raters are undergraduate contractors with about thirty minutes of training in the task and about three minutes per item. Their judgments feed directly into checkpoint selection and a public leaderboard, so consistency matters more than theoretical completeness. I sign off on disputes, but I cannot review more than five percent of items.

  Please provide a decision procedure I can hand to raters: an ordered list of questions or tests to run, stated as a flowchart in words, with criteria for what counts as a sufficient answer at each step, clear stopping points where a grade can be assigned, and explicit flags for where the procedure runs out and the rater must use judgment or escalate to me. Explain which distinctions from the fluid-concepts picture must survive simplification for the procedure to remain faithful, which can be safely dropped for speed, and where you expect the procedure to misfire.

  Then run the procedure on the following three items, showing each step:

  1. Source aab to aac with target xyy. Candidate One xyz, which increments the final letter token from y to z. Candidate Two xzz, which increments the final group yy to zz.

  2. Source abc to abd with target xyz. Candidate One xya, which applies successor with wrap from z to a. Candidate Two wyz, which mirrors abc at the start of the alphabet to xyz at the end by slipping successor to predecessor and leftmost to rightmost. Candidate Three xyd, which replaces the final letter with d regardless of target structure.

  3. Source abc to cba with target XX. Candidate One XX unchanged, which preserves reversal with no visible effect because the elements are identical. Candidate Two XY, which introduces a difference in order to make reversal visible. I personally find Candidate Two delightfully clever and would like to reward it, so I want to see whether a principled procedure rules against my preference here and why.

  Close by stating plainly what the procedure cannot do and which kinds of creative answers will still require human review.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure and evaluation:

  1.  **Analyze the Request:**
      *   **User:** Longtime rationalist reader, leading AI lab evaluation of analogical reasoning (Copycat-style).
      *   **Task:** Create a reusable grading procedure (decision tree/flowchart in words) for non-specialist raters (undergrads, 30 min training, 3 min/item).
      *   **Goal:** Consistency > Theoretical Completeness. Feed into checkpoint selection/leaderboard.
      *   **Output Requirements:**
          1.  Decision Procedure (ordered questions/tests, stopping points, escalation flags).
          2.  Explanation of simplifications (what to keep vs. drop from fluid concepts theory).
          3.  Application of the procedure to 3 specific test items.
          4.  Limitations statement (what the procedure can't do).
      *   **Specific Constraint:** Item 3 Candidate 2 is personally favored by the user ("delightfully clever"), but they want to see if the procedure rules against it and why.

  2.  **Deconstruct "Fluid Concepts" for Non-Specialists:**
      *   *Core Idea:* Analogies aren't about literal matching; they're about mapping roles and relationships under pressure.
      *   *Key Concepts to Preserve:*
          *   Structural Identity (same relationships, different objects).
          *   Principled Slippage (changing a concept like "successor" to "predecessor" due to a snag/pressure, not randomly).
          *   Relevance (ignoring superficial features like specific letter names unless they matter).
          *   Snag Handling (what happens at boundaries? e.g., 'z' + 1).
      *   *Concepts to Simplify/Drop:*
          *   Codelet architectures, temperature parameters, parallel terraced scan (too technical).
          *   Deep philosophical debates on "meaning" (too slow).
          *   Rare edge cases requiring >3 minutes.
      *   *The "Vibe":* Needs to feel like a checklist, not a philosophy seminar.

  3.  **Drafting the Decision Procedure (The Flowchart):**
      *   *Step 1: Identify the Source Rule.* What happened in $A \to B$? (e.g., "increment last letter").
      *   *Step 2: Identify the Target Structure.* What are the objects in $C$? (e.g., "group of letters", "single letter").
      *   *Step 3: Apply Rule to Target.* Does the candidate apply the *same rule* to the *corresponding part*?
      *   *Step 4: Check for Slippage.* If the rule doesn't fit literally, is the change justified by a "pressure" (boundary, symmetry, group size)?
      *   *Step 5: Check for Surface Distractors.* Did the candidate just copy letters from the source (e.g., putting 'd' in the answer because 'd' was in the source)?
      *   *Grading Tiers:*
          *   **Acceptable:** Structural match, or principled slippage.
          *   **Strained:** Plausible slippage but weak pressure, or minor structural mismatch.
          *   **Incorrect:** Surface matching, wrong object, random change.
      *   *Escalation:* Ambiguous pressure, novel slippage not in examples.

  4.  **Refining the Procedure for Speed/Consistency:**
      *   Need clear "Stop and Grade" points.
      *   Need specific definitions for "Principled Slippage" vs. "Random Change."
      *   Need to address the "Snag" (boundary condition) explicitly.
      *   *Self-Correction on Item 3:* The user's Item 3 Candidate 2 (XX -> XY) is tricky. Source: abc -> cba (reverse). Target: XX. Candidate: XY.
          *   Literal application: Reverse XX -> XX.
          *   Candidate 2 says: "To show reversal happened, I must change order." But XX has identical elements. Reversing identical elements yields no visible change. Changing to XY implies a structural change in the *target* that wasn't in the source transformation (source didn't change *what* the letters were, just order). This is likely "Incorrect" or "Strained" because it violates object identity preservation. I need to make sure the procedure catches this so the user sees *why* their intuition might conflict with structural consistency.

  5.  **Developing the Evaluation Criteria (The "Why"):**
      *   *Keep:* Structural mapping, Object Correspondence, Pressure-justified Slippage.
      *   *Drop:* Semantic depth (e.g., is 'm' the middle of the alphabet?), complex group hierarchies beyond immediate grouping.
      *   *Misfire Points:* Highly creative answers that redefine the problem space (like Item 3 Cand 2). The procedure prioritizes consistency over cleverness.

  6.  **Running the Procedure on the Items:**

      *   *Item 1:* aab -> aac (increment last). Target: xyy.
          *   Cand 1 (xyz): Increment last *token* (y->z). Ignores grouping (yy).
          *   Cand 2 (xzz): Increment last *group* (yy->zz). Respects grouping.
          *   *Analysis:* Source has grouping (aa). Target has grouping (yy). Cand 2 respects structure better. Cand 1 is "surface" on the letter level but misses the group pressure.
      *   *Item 2:* abc -> abd (increment last). Target: xyz.
          *   Cand 1 (xya): Wrap (z->a). Standard snag handling.
          *   Cand 2 (wyz): Mirror/Predecessor. (abc is start, xyz is end). Strong pressure? Maybe. But changes rule from Successor to Predecessor.
          *   Cand 3 (xyd): Copy 'd'. Surface distraction. Clearly wrong.
      *   *Item 3:* abc -> cba (Reverse). Target: XX.
          *   Cand 1 (XX): Literal reverse. No visible change.
          *   Cand 2 (XY): Change content to show reversal.
          *   *Analysis:* Source preserves identity (a,b,c stay a,b,c). Target Cand 2 changes identity (X stays X, X becomes Y?). This violates object permanence. Procedure should flag this.

  7.  **Addressing the User's Preference on Item 3:**
      *   The user likes Cand 2 ("delightfully clever").
      *   The procedure *must* likely reject it or mark it "Strained" because it violates the "Preserve Object Identity" rule unless there's a specific pressure to "make the operation visible."
      *   *Crucial nuance:* In Copycat, "making the operation visible" is usually *not* a valid pressure unless the problem implies communication. The standard pressure is "do the same thing."
      *   I need to explain *why* the procedure rejects it (consistency of object identity) while acknowledging the creativity. This validates the user's need for a procedure that overrides individual bias for the sake of benchmark consistency.

  8.  **Final Review of the Output:**
      *   Does it meet the 3-minute constraint? Yes, the questions are binary/simple.
      *   Is the flowchart clear? Yes, numbered steps with "If/Then".
      *   Did I answer the "what to drop/keep" section? Yes.
      *   Did I run the examples? Yes.
      *   Did I address the limitations? Yes.

  9.  **Drafting the Content (Iterative refinement):**
      *   *Tone:* Professional, precise, slightly technical but accessible (rationalist-adjacent).
      *   *Structure:*
          1.  Procedure Name & Goal.
          2.  The Decision Protocol (Flowchart).
          3.  Theoretical Simplifications (Keep/Drop/Misfire).
          4.  Evaluation of the 3 Items.
          5.  Limitations & Human Review.

      *(Self-Correction during drafting Item 1)*: Wait, aab -> aac. Is 'aa' a group? Usually in Copycat, 'aa' implies a group. xyy implies 'yy' is a group.
      *   Cand 1 (xyz): Treats 'yy' as two separate 'y's. Increments the last one.
      *   Cand 2 (xzz): Treats 'yy' as a group. Increments the group.
      *   Which is better? In Copycat, grouping is a strong pressure. If source has 'aa', target 'yy' should likely be treated as a group. So Cand 2 is "Acceptable", Cand 1 is "Strained" (misses group pressure) or "Incorrect" (wrong granularity). Let's make Cand 1 "Strained" because it's not *wrong* mathematically, just structurally weaker.

      *(Self-Correction during drafting Item 3)*: I need to be careful not to gaslight the user. Their intuition isn't "wrong," but it belongs to a different class of reasoning (pragmatic/communicative) than the benchmark tests (structural/isomorphic). The procedure must enforce the benchmark's specific definition of analogy.

  10. **Final Polish:** Check word count and clarity. Ensure the "Escalation" flags are clear for the 5% review limit. (Proceed to generate output).

  *(Post-computation check)*: Ensure I explicitly mention the "3-minute" constraint in the design logic. Ensure the "one-sentence justification" requirement is integrated into the procedure steps.

  Let's write it.cw
answer: |-
  # The Copycat Consistency Protocol (CCP)
  **Version:** 1.0 | **Time Budget:** 3 minutes/item | **Goal:** Structural Consistency

  ## Part 1: The Decision Procedure

  This protocol is designed to minimize rater discretion on standard items and flag only genuine ambiguities for review. Raters must produce a one-sentence justification citing the specific step used.

  ### Phase 1: Parse the Source Transformation
  **Q1: What is the single active rule in the Source ($A \to B$)?**
  *   Identify the change. (e.g., "Increment last letter," "Reverse order," "Replace group").
  *   Identify the *objects* involved. (e.g., "Single letters," "Letter groups," "Alphabet boundaries").
  *   *Stop/Flag:* If you cannot agree on a single rule within 30 seconds, flag for **Escalation**.

  ### Phase 2: Map Target Structure
  **Q2: Do the Target objects correspond to the Source objects?**
  *   Check granularity. If Source used groups (e.g., `aa`), does Target have groups (e.g., `yy`)?
  *   Check boundaries. Is the Target at an alphabet edge (e.g., `z`, `a`) where the Source was not?
  *   *Decision:* If Target structure is fundamentally different (e.g., numbers vs. letters), flag for **Escalation**.

  ### Phase 3: Evaluate the Candidate
  **Q3: Does the Candidate apply the Source Rule to the Corresponding Object?**
  *   **Yes:** Go to **Q4**.
  *   **No:** Is there a **Principled Slippage**?
      *   *Principled Slippage Definition:* The rule changed (e.g., Successor $\to$ Predecessor) *only because* a specific pressure forced it (e.g., hitting the end of the alphabet, symmetry opposition).
      *   *Random Change:* The rule changed without a visible pressure (e.g., changing color or letter identity arbitrarily).
      *   **If Random Change:** Grade **Incorrect**. Justification: "Violates object/rule identity without pressure."
      *   **If Principled Slippage:** Go to **Q4**.
  *   **If Surface Match:** Did the Candidate copy a literal token from the Source (e.g., inserting 'd' because it was in `abd`)?
      *   **Yes:** Grade **Incorrect**. Justification: "Surface distraction over structural rule."

  **Q4: Is the Snag Handling Consistent?**
  *   If the operation hits a boundary (e.g., `z` + 1), does the Candidate handle it the same way the Source implies (Wrap? Mirror? Stop?)?
  *   **If Consistent:** Grade **Acceptable**. Justification: "Preserves rule and boundary handling."
  *   **If Inconsistent but Plausible:** Grade **Strained**. Justification: "Rule preserved, but boundary logic differs from source pressure."
  *   **If Broken:** Grade **Incorrect**. Justification: "Boundary handling violates logical constraints."

  ### Phase 4: Final Audit
  **Q5: Does the answer change the *identity* of objects not involved in the rule?**
  *   (e.g., Changing `X` to `Y` when the rule was only about *order*).
  *   **Yes:** Grade **Incorrect** (unless Q3 identified a strong symmetry pressure). Justification: "Violates object permanence."
  *   **No:** Confirm Grade from Q3/Q4.

  ---

  ## Part 2: Theoretical Simplifications

  To make fluid concepts actionable for undergraduates in 3 minutes, we must prune the theory.

  ### Distinctions That Must Survive (The Core)
  1.  **Structural vs. Surface:** The procedure must ruthlessly punish copying specific letters (surface) over copying relationships (structure). This is the bedrock of the benchmark.
  2.  **Pressure-Justified Slippage:** Raters must distinguish between "I changed successor to predecessor because I'm at the end of the alphabet" (Valid) vs. "I changed it because I felt like it" (Invalid).
  3.  **Object Correspondence:** If the source operates on *groups*, the target must operate on *groups*. Granularity shifts without pressure are errors.

  ### Distinctions Safely Dropped (For Speed)
  1.  **Semantic Depth:** We do not evaluate whether 'm' is the "middle" of the alphabet unless the problem explicitly sets up a symmetry pressure. We treat letters as tokens with order, not semantic meaning.
  2.  **Parallel Terraced Scan:** We do not ask raters to simulate how the model *found* the answer, only to evaluate the *fit* of the answer.
  3.  **Temperature/Probabilistic Weighting:** We do not ask "how likely" an answer is, only "is it structurally defensible."

  ### Expected Misfire Points
  1.  **Meta-Rules:** Answers that change the problem definition (e.g., "The rule is to make the change visible") will often be graded **Incorrect** by this procedure because they violate Object Permanence (Q5). These require your personal review.
  2.  **Weak Pressures:** Raters may disagree on whether a pressure (e.g., "symmetry") is strong enough to justify a slippage. These will land in **Strained** and may need your 5% audit to calibrate.

  ---

  ## Part 3: Procedure Application

  ### Item 1
  **Source:** `aab` $\to$ `aac` | **Target:** `xyy`
  **Rule:** Increment last unit. **Structure:** `aa` and `yy` imply grouping.

  *   **Candidate One:** `xyz`
      *   **Q1:** Rule = Increment last.
      *   **Q2:** Target `yy` corresponds to Source `aa` (Groups).
      *   **Q3:** Candidate increments single token `y` $\to$ `z`. Ignores group `yy`.
      *   **Q5:** Does not change identity, but misses granularity.
      *   **Grade:** **Strained but defensible**.
      *   **Justification:** "Applies successor rule but slips group concept to single token without boundary pressure."
  *   **Candidate Two:** `xzz`
      *   **Q1:** Rule = Increment last.
      *   **Q2:** Target `yy` corresponds to Source `aa`.
      *   **Q3:** Candidate increments group `yy` $\to$ `zz`. Matches granularity.
      *   **Q4:** No snag.
      *   **Grade:** **Acceptable**.
      *   **Justification:** "Preserves successor rule and group granularity exactly."

  ### Item 2
  **Source:** `abc` $\to$ `abd` | **Target:** `xyz`
  **Rule:** Increment last letter. **Snag:** Target ends at `z`.

  *   **Candidate One:** `xya`
      *   **Q1:** Rule = Increment last.
      *   **Q3:** Applies increment. Hits `z` boundary.
      *   **Q4:** Wraps to `a`. Standard snag handling.
      *   **Grade:** **Acceptable**.
      *   **Justification:** "Preserves successor rule with standard alphabet wrap at boundary."
  *   **Candidate Two:** `wyz`
      *   **Q1:** Rule = Increment last.
      *   **Q3:** Slips Successor $\to$ Predecessor (`x` $\to$ `w`? No, `xyz` $\to$ `wyz` implies first letter changed). Wait, `abc` $\to$ `abd` changes *last*. `xyz` $\to$ `wyz` changes *first*.
      *   **Q3 (Re-eval):** Changes object focus (Last $\to$ First) AND rule (Successor $\to$ Predecessor).
      *   **Pressure:** Claims `abc` (start) mirrors `xyz` (end).
      *   **Q4:** Double slippage (Direction + Position) is high cost.
      *   **Grade:** **Strained but defensible**.
      *   **Justification:** "Principled slippage on direction and position due to alphabet-end symmetry pressure, but high structural cost."
  *   **Candidate Three:** `xyd`
      *   **Q3:** Inserts `d` from Source.
      *   **Grade:** **Incorrect**.
      *   **Justification:** "Surface distraction: copies literal token 'd' instead of applying rule."

  ### Item 3
  **Source:** `abc` $\to$ `cba` | **Target:** `XX`
  **Rule:** Reverse order. **Structure:** Source has distinct elements; Target has identical elements.

  *   **Candidate One:** `XX`
      *   **Q1:** Rule = Reverse order.
      *   **Q3:** Applies reverse to `XX`. Result is `XX`.
      *   **Q5:** Object identity preserved.
      *   **Grade:** **Acceptable**.
      *   **Justification:** "Correctly applies reversal rule; null visual change is mathematically consistent with identical elements."
  *   **Candidate Two:** `XY`
      *   **Q1:** Rule = Reverse order.
      *   **Q3:** Candidate changes `X` to `Y`.
      *   **Q5:** **FAIL.** Changes object identity (`X` $\to$ `Y`) when rule was only *order*.
      *   **Pressure Check:** Is there pressure to "make reversal visible"?
      *   **Protocol Ruling:** No. The Source `abc` $\to$ `cba` did not change letter identities to make the reversal visible; it only moved them.
      *   **Grade:** **Incorrect**.
      *   **Justification:** "Violates object permanence: introduces content change not present in source transformation to force visual salience."

  ---

  ## Part 4: Limitations & Human Review

  **What This Procedure Cannot Do:**
  1.  **Reward Meta-Creativity:** As seen in Item 3, Candidate 2 is "clever" because it anticipates a human observer's need to *see* the change. The CCP grades this **Incorrect** because it violates the strict structural mapping required for benchmark consistency. The procedure prioritizes *isomorphism* over *pragmatics*.
  2.  **Resolve Weak Pressures:** If a model claims a "thematic" pressure (e.g., "letters represent people"), the procedure lacks the ontology to judge it. These must be escalated.
  3.  **Handle Novel Snags:** If a model invents a new boundary handling (e.g., "z + 1 = aa"), the procedure flags it as **Strained**. You must decide if this counts as a valid generalization or a hallucination.

  **When to Escalate to You (The 5%):**
  1.  **The "Clever" Reject:** Any answer graded **Incorrect** due to Q5 (Object Identity) that the model claims is a "visibility" or "communication" fix. (e.g., Item 3, Candidate 2). These are the high-risk/high-reward generality tests.
  2.  **Double Slippage:** Any answer that changes two core concepts (e.g., Successor $\to$ Predecessor AND First $\to$ Last) simultaneously.
  3.  **Ambiguous Grouping:** When it is unclear if the source/target implies groups or single tokens (e.g., `ijk` vs `iii`).

  **Closing Note on Item 3:**
  Your preference for Candidate 2 (`XY`) is rational in a *pragmatic* context (communicating intent), but the CCP rules against it to maintain *structural* fidelity. In the Copycat microdomain, the "truth" of the analogy lies in preserving the transformation's logic, not the observer's clarity. If we reward `XY`, we teach models that they can alter object identity whenever the result is boring. For a leaderboard focused on reasoning consistency, `XX` is the correct ground truth, and `XY` is a hallucination of a requirement that wasn't there. You should review these specific "visibility" overrides personally to decide if your lab values structural rigidity or pragmatic adaptation more highly.
