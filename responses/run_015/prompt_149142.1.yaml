  An epistemologist walks into a bar and orders a drink. The bartender says, "That'll be ten dollars. Do you know you have the money?"

  "Of course," says the epistemologist. "I track the truth. In the nearest possible world where I don't have the money, I check my pocket, find it empty, and don't believe I have it. My belief is sensitive to poverty."

  "Fine," says the bartender. "But having money entails you aren't a brain in a vat being fed the experience of having money. Do you know you aren't a vat?"

  "No," admits the epistemologist. "In the nearest world where I'm a vat, I still believe I have money. My belief is insensitive to simulation."

  "But 'having money' entails 'not being a vat'," the bartender points out. "So you know the premise, you know the entailment, but you don't know the conclusion?"

  "Exactly," says the epistemologist. "Closure fails. The nearest world where I lack money is a wallet-loss world. The nearest world where I'm a vat is a sci-fi lab world. I track the wallet, not the lab."

  "Understood," says the bartender, pouring the drink. "That'll be ten dollars."

  The epistemologist hands over a bill.

  "Wait," says the bartender, pocketing the cash. "I'm keeping this."

  "What? Why?"

  "Because you just admitted you don't know you're not a vat. In the vat world, you believe you've paid for a drink, but you haven't. Since you can't distinguish the wallet-loss world from the vat world, I have to assume the vat world is the relevant one for this transaction."

  "But it's not the relevant one!" the epistemologist protests. "The wallet world is nearer!"

  "Maybe for you," says the bartender. "But for your *knowledge*, the vat world is the one that breaks the sensitivity condition. And in the nearest world where I keep your money and you think I've given you a drink, you don't know you're being scammed. You only track wallet loss, not bartender theft."

  "That's not the same entailment!"

  "Sure it is," says the bartender, wiping a glass. "You said knowledge depends on the nearest error world. Well, welcome to mine. It's the nearest one where you're dry, you're broke, and you still believe you're having a drink."
