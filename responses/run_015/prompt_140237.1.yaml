      *   **Tension E: (7) vs. (1).**
          *   If $\psi$ is just knowledge (epistemic), how is it *causally efficacious*? Usually, knowledge doesn't push particles; things push particles.
          *   *Severity:* Moderate. This is the "explanatory burden" problem. If $\psi$ is just info, what physical mechanism creates interference?
          *   *Fix:* The *ontic state* does the work; $\psi$ tracks the ontic state. But then why does manipulating $\psi$ work? Because manipulating $\psi$ correlates with manipulating the ontic state.

      *   **Tension F: Favorites (Spekkens vs. Bohm).**
          *   Spekkens = Psi-epistemic (but limited).
          *   Bohm = Psi-ontic (explicitly).
          *   *Severity:* High. You can't have both as "favorite views" without recognizing they are ontologically opposed regarding $\psi$.
          *   *Fix:* Choose. Bohm fits (3) and (8) better. Spekkens fits (1) and (2) better.

  3.  **Drafting the Response:**

      *   **Tone:** Peer-to-peer, rigorous but accessible (3rd-year level), direct. Avoid "it depends."
      *   **Structure:**
          1.  Validate the sophistication of the position (it's a coherent cluster, often called "Einsteinian" or "Statistical").
          2.  Address the "Memory Check" first (validates their intuition about no-go theorems).
          3.  Rank the Tensions (Severity 1 to 3).
          4.  Provide the "Cheapest Fix" for each.
          5.  Address the "Favorite Views" conflict.
          6.  Concluding advice for the essay.

  4.  **Refining the Tensions (Self-Correction during drafting):**

      *   *Correction on Tension A:* The user says they "swallowed nonlocality" in (3) but describes locality in (4). This is the biggest logical hole. I need to be firm here. Bell rules out *local* hidden variables. If they are HV realists, they *must* be nonlocal realists. Description (4) is Local Realism.
      *   *Correction on Tension B (Square Root):* This is actually a common confusion. The wavefunction *is* the object. If it's epistemic, it represents a distribution $\mu(\lambda|\psi)$. The "square root" talk is trying to explain interference without ontic waves. This needs to be clarified as a category error or a specific model feature (like Bohm's quantum potential, but that's ontic).
      *   *Correction on PBR/PI:* Denying PI is "cheap" mathematically but physically costly. It implies "conspiratorial" correlations between distinct labs. I should highlight this cost.
      *   *Correction on Bohm:* Bohm is strictly $\psi$-ontic. The user likes Bohm but claims $\psi$-epistemic. This is a major conflict. Bohmians say $\psi$ is a real field. The user says it's a distribution. I need to point out they are likely attracted to the *determinism* of Bohm, not the ontology.

  5.  **Final Polish:**

      *   Ensure the distinction between $\psi$-supplemented (HV + $\psi$) and $\psi$-complete is clear.
      *   Ensure the distinction between *maximally* psi-epistemic and *some* overlap is clear regarding the "Memory Check" (Hardy's theorem vs PBR).
      *   Make sure the "Square Root" comment is addressed kindly but firmly (it's not standard terminology and might confuse the grader).

  6.  **Final Review against constraints:**
      *   Don't say "it depends."
      *   Rank by severity.
      *   Address the "Memory Check."
      *   Address the Spekkens/Bohm conflict.

  *(Self-Correction)*: Wait, one nuance. The user says "psi-epistemic in the overlapping-distributions sense." This is the Harrigan-Spekkens definition.
  The "Memory Check" refers to the fact that *maximally* psi-epistemic models are ruled out in $d \ge 3$ (Barrett et al., 2014 / Hardy, 2013). PBR rules out *all* psi-epistemic models *if* Preparation Independence holds. The user denies PI. So PBR doesn't kill them. But the "maximally epistemic" no-go does not rely on PI. It relies on the ability to reproduce QM statistics with overlap accounting for *all* non-orthogonality. This is a crucial distinction for a 3rd-year essay. I must highlight this.

  Okay, ready to write. The structure will be:
  1.  Validation & The "Memory Check" (confirming the theorem).
