          10. Favorites: Spekkens Toy Model, Bohmian Mechanics.

  2.  **Identify Tensions/Inconsistencies:**

      *   **Tension A: (1)/(2) vs. (4) vs. Bell.**
          *   User claims to accept nonlocality (3) but describes a local mechanism for Bell correlations in (4) ("nothing Alice does changes anything physical on Bob's side... baked in at the source").
          *   *Severity:* Critical. This is a direct contradiction of Bell's Theorem. If (4) is true, Bell inequalities aren't violated. If Bell inequalities are violated (experimentally), (4) cannot be true as stated.
          *   *Fix:* Must admit nonlocality in the ontic state update or dynamics, not just correlation.

      *   **Tension B: (1)/(2) vs. (6).**
          *   (1)/(2) says $\psi$ is like a probability distribution (Liouville).
          *   (6) says $\psi$ is a *square root* of a probability.
          *   *Severity:* Moderate/Conceptual. A probability distribution lives on the ontic state space. The wavefunction *is* the object being interpreted. If $\psi$ is epistemic, it *is* the distribution (or maps to it). Saying it's the "square root of a distribution" is category confusion. Amplitudes aren't square roots of probabilities over *ontic states* in the standard sense; they are components of the state vector.
          *   *Fix:* Refine the analogy. $\psi$ determines the probability distribution over ontic states, but $\psi$ itself has phase structure necessary for interference.

      *   **Tension C: (1) vs. (9) [The Memory Check].**
          *   User remembers a theorem limiting psi-epistemic models.
          *   *Fact Check:* Yes. The PBR theorem targets *all* psi-epistemic models (under PI). But even without PBR, there are results (e.g., Barrett, Cavalcanti, Lal, Maroney 2014; or Hardy 2013) showing that *maximally* psi-epistemic models (where overlap explains indistinguishability completely) are impossible in dimensions $\ge 3$. Spekkens' toy model is limited (Gaussian states/stabilizers).
          *   *Severity:* High. This threatens the viability of the whole position, not just consistency.
          *   *Fix:* Accept a "partially" psi-epistemic view or acknowledge the model is incomplete (like Bohm, which is psi-ontic).

      *   **Tension D: (3) vs. (5).**
          *   User accepts Nonlocal HV (Bohm-like) but denies Preparation Independence (PBR loophole).
          *   *Severity:* Low/Moderate. Denying PI is a standard escape from PBR for psi-epistemicists. However, combining Nonlocal HV (usually Bohm, which is $\psi$-ontic) with $\psi$-epistemic is tricky. Bohm treats $\psi$ as a real field guiding particles. If $\psi$ is epistemic, what does the guiding?
