      *   *Diagnose:* It's not verbal. It's a clash of **Ontological Frameworks**. The Critics operate with a **Dual-Aspect** or **Realist** framework (Object vs. Representation). Berkeley operates with a **Phenomenological** framework (Object = Representation).
      *   *Concrete Engagement (The Tree):*
          *   Critic: "I conceive [Tree + Unperceived]." They treat "Unperceived" as a predicate of the Tree.
          *   Berkeley: "You conceive [Tree-as-Perceived] + [Thought of Absence of Perceivers]." The "Tree" part is always perceived. The "Absence" part is a separate thought. You can't fuse them into one object.
      *   *Hidden Work:* It's about **Intentional Absence**. Can the *content* of a thought represent the *absence* of the thought's own condition? Critics say yes (self-referential content). Berkeley says no (existential dependence).
