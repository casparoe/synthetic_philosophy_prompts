answer: |-
  **EXISTENTIALISM 404: TAKE-HOME FINAL**

  **Time Limit:** 90 Minutes (once opened)
  **Word Count Target:** ~800 words for the prompt below (including scenario), Model Answer ~650 words.
  **Instructions:** No bibliographies or citations needed. I know some of you are remote without library access, so rely on your understanding of the concepts from lectures and notes. Casual formatting is fine (don't stress about perfect footnote style), but your philosophical reasoning needs to be tight.

  **The Prompt:**

  For this final assessment, you are asked to apply Jean-Paul Sartre's concepts of radical freedom, facticity, and bad faith to a contemporary technological scenario. We have spent considerable time discussing Sartre's famous example of the café waiter who plays at *being* a waiter to escape the anguish of his own freedom. That example relies on social roles. Today, however, authority often comes from code, not just social expectation. Your task is to determine whether hiding behind an algorithm constitutes a new form of bad faith or a legitimate recognition of limitation.

  **The Scenario:**
  Consider Alex, a mid-level data analyst working for a logistics corporation. The work is ethically compromising (optimizing supply chains that utilize forced labor), and Alex finds it deeply harmful to their mental health. Alex wishes to leave. However, five years ago, Alex submitted to a comprehensive "Algorithmic Career-Matching System" (ACMS) used by their university and industry partners. The ACMS analyzed Alex's psychometrics, grades, and economic background. It assigned Alex a "Compatibility Score" of 98% for logistics and a "Viability Score" of less than 5% for any other field (arts, education, manual labor).

  Alex believes the ACMS is objectively accurate. Alex argues: "The algorithm processed more data than I ever could. It knows the market better than I do. It has determined that I *am* a logistics analyst. To try to leave would be irrational and economically suicidal. I have no choice." Alex uses this belief to refuse responsibility for staying in the harmful job. Alex claims they are not choosing to stay; they are simply obeying the objective truth of the system.

  **Your Task:**
  Write an essay responding to the following three interconnected questions. You do not need to answer them as separate sub-headers, but your argument must address all three distinct philosophical tensions:

  1.  **Bad Faith:** Would Sartre classify Alex's reliance on the ACMS as an act of bad faith? Specifically, is Alex denying their transcendence by treating themselves as a fixed object defined by data?
  2.  **Facticity vs. Determinism:** How should the algorithm be categorized ontologically? Is the ACMS part of Alex's *facticity* (the brute facts of their situation), or is Alex mistakenly treating it as causal *determinism*? You must explain whether a prediction becomes a cause simply because a human believes it.
  3.  **Ontological vs. Practical Freedom:** Sartre distinguishes between the absolute freedom of consciousness (ontological) and the limited freedom of action in the world (practical). Does Alex's situation prove this distinction collapses? Or does the distinction hold up even when an algorithm says "no other path exists"?

  **Guidance:**
  Avoid the easy answer that "technology makes us unfree." Sartre is not interested in sociological constraints on ability; he is interested in the structure of consciousness. If Alex *believes* the algorithm removes choice, is that belief itself a choice? Remember, you do not need to cite *Being and Nothingness* directly. I want to see you use the concepts, not hunt for page numbers. If your course notes have typos regarding the spelling of "facticity" or "transcendence," don't worry about it. Focus on the logic.

  Your response should be approximately 800 words. You have 90 minutes to complete this once you download the file. Good luck.

  ***

  **MODEL ANSWER**

  Alex's situation is a textbook case of bad faith, though disguised as rational obedience to data. Sartre would argue that Alex is not constrained by the algorithm itself, but by the meaning Alex chooses to give the algorithm. By claiming the ACMS has "locked out" every other path, Alex is attempting to convert their facticity into a deterministic cage, thereby escaping the anguish of having to choose to leave a harmful job.

  First, we must establish that this is bad faith. Bad faith occurs when a human being denies their own transcendence—their ability to go beyond what they are—and pretends to be a fixed object, like a stone or a tool. Alex says, "I *am* a logistics analyst," because the machine said so. But for Sartre, existence precedes essence. Alex exists first; the label comes later. By treating the ACMS score as an essence that defines them, Alex is lying to themselves. They are pretending to be a thing-in-itself (an object with a fixed nature) rather than a for-itself (a consciousness that defines itself through action). The harm of the job is irrelevant to the structure of the faith; the deception lies in claiming "I have no choice" when one always has the choice to quit, even if the consequences are severe.

  Second, regarding facticity versus determinism: The algorithm is part of Alex's facticity, not a cause of determinism. Facticity includes all the brute facts of my situation: my past, my body, my economic status, and yes, the existence of this software and its scores. These are real obstacles. However, facticity is only the ground upon which freedom acts; it is not a causal chain that determines the outcome. Alex mistakes the prediction for the cause. The algorithm predicts based on past data. It cannot account for the radical novelty of a free decision. When Alex says, "It determined I am this," they are treating a statistical probability as a physical law. This is the core deception. The algorithm limits the *ease* of leaving, but it does not remove the *possibility* of leaving. Believing it does is a choice to view facticity as destiny.

  Finally, we must address the split between ontological and practical freedom. Critics often argue that if you cannot practically leave a job without starving, you aren't free. Sartre would say this confuses the two types of freedom. Ontological freedom is the freedom of consciousness to negate the given world—to imagine leaving, to refuse the meaning of the score, to walk out. This freedom is absolute and cannot be removed by technology. Practical freedom is the field of possibilities available to act. The ACMS severely restricts Alex's practical freedom. It makes other paths difficult, dangerous, or unlikely. But it does not touch ontological freedom. Alex remains free to interpret the score as irrelevant. Alex remains free to quit and face poverty. The distinction holds up precisely here: the algorithm changes the coefficients of adversity in the world, but it cannot change the structure of the consciousness facing them.

  In conclusion, Alex is in bad faith because they are using the algorithm as an alibi. They are outsourcing their agency to a machine to avoid the responsibility of choosing their own values. The algorithm is facticity, not destiny. While Alex's practical freedom is constrained by economic reality, their ontological freedom remains intact. They are not trapped by the code; they are trapped by their refusal to acknowledge that the code only has power because they give it power. Sartre would say Alex is condemned to be free, even if the algorithm says otherwise.

  ***

  **MARKING SCHEME (25 MARKS TOTAL)**

  **1. Identification of Bad Faith (5 Marks)**
  *   **A Grade:** Explicitly identifies Alex's stance as bad faith because it denies transcendence and treats the self as a fixed object (in-itself).
  *   **B Grade:** Identifies it as bad faith but focuses only on the "harmful job" aspect rather than the denial of freedom.
  *   **Common Botch:** Students argue Alex is *not* in bad faith because the algorithm is "real," missing that bad faith is about the attitude toward the real.

  **2. Facticity vs. Determinism (5 Marks)**
  *   **A Grade:** Correctly categorizes the algorithm as facticity (a brute fact/obstacle) and rejects the claim that it is causal determinism.
  *   **B Grade:** Acknowledges the algorithm is a constraint but wavers on whether it actually determines Alex's actions.
  *   **Common Botch:** Students conflate facticity with determinism, arguing that because the obstacle is real, the determination is real.

  **3. Outsourcing Agency as Self-Deception (5 Marks)**
  *   **A Grade:** Recognizes that giving the algorithm authority is itself a choice/act of consciousness.
  *   **B Grade:** Treats the belief in the algorithm as a passive psychological state rather than an active project.
  *   **Common Botch:** Students assume believing the algorithm is involuntary, missing Sartre's point that belief is always chosen.

  **4. Ontological vs. Practical Freedom Distinction (5 Marks)**
  *   **A Grade:** Clearly separates absolute freedom of consciousness (ontological) from limited freedom of action (practical) and argues the distinction holds.
  *   **B Grade:** Discusses freedom generally but collapses the two types, suggesting practical limits negate ontological freedom.
  *   **Common Botch:** Students argue Alex isn't free because they can't pay rent if they quit (confusing ability with freedom).

  **5. Responsibility and Conclusion (5 Marks)**
  *   **A Grade:** Concludes that responsibility remains because the meaning of the constraint is chosen by Alex.
  *   **B Grade:** Concludes that Alex is partially responsible but heavily mitigated by the tech.
  *   **Common Botch:** Students end by blaming the corporation or the tech developers, shifting responsibility away from Alex entirely.
