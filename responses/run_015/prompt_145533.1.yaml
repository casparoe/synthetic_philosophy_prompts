      *   **Addressing the Supervisor's Objection:** Dedicate a specific section to "Exploration vs. Exploitation." Acknowledge the strength of the view, but argue that *preference change* makes it distinct from standard bandit problems. Define evidence that would prove the supervisor right.
      *   **Failure Conditions:** When does the project fail? If it becomes just metaphysics of identity or just standard decision theory.
