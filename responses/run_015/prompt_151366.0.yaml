  Here's the case study:

  Elena, a senior data architect, paid a steep non-refundable deposit three months ago to lock herself into a rigorous six-month AI ethics certification, knowing it would block her calendar during the first week of November. She did this specifically to prevent herself from chasing short-term cash, as she knows she tends to overvalue immediate payouts over long-term career stability. However, on October 30th, a former client offers her a one-week consulting gig for that exact week, revealing new details: the work isn't just generic code review, but hands-on mentoring of underrepresented juniors, a cause she intrinsically ranks higher than career credentials. The gig pays immediately upon completion, while the certification's career boost won't materialize for years. Elena feels a heavy pang of guilt about wasting her deposit and breaking her own rule, yet she finds herself genuinely wanting to say yes to the mentoring opportunity more than she wants to stick to the plan.

  ***

  Here's the breakdown of why this setup works and where the theories diverge.

  **The Verdicts**
  *   **Hyperbolic Discounting:** This model predicts Elena takes the gig. Why? Because the rewards (cash + mentoring satisfaction) are temporally immediate, while the benefits of the certification are distant. Even though she planned to resist, the hyperbolic curve means the value of the "now" spikes disproportionately as the date arrives, overpowering the distant benefit. The diagnosis here is **bias**: she's failing to stick to her long-term interest because of a time-based cognitive glitch.
  *   **Aristotelian Account:** Aristotle says akrasia is acting against your better judgment. But Elena's judgment isn't static; it updated with new info. If mentoring juniors is objectively more valuable to her *eudaimonia* (flourishing) than the cert, then taking the gig is actually an act of practical wisdom (*phronesis*), not weakness. The guilt she feels is just emotional residue from the prior commitment, not evidence of moral failure. The diagnosis here is **wisdom**: she's correctly responding to a change in circumstances.
  *   **Exponential Discounter:** This rational agent also takes the gig, but without the internal drama. They simply update the utility function: New Value(Gig) > Value(Cert). There's no "weakness of will" or "guilt," just consistent maximization based on fresh data.

  **The Feature Doing the Work**
  The engine driving this conflict is the tension between **first-order preference reversal and second-order commitment**. The precommitment (deposit) was a second-order volition—her past self trying to bind her future self. The new info caused a first-order preference reversal (she now prefers the gig). Hyperbolic discounting sees this reversal as a failure of the second-order commitment (weakness). The Aristotelian view sees the reversal as a legitimate update to the first-order preference that invalidates the need for the second-order commitment (wisdom).

  **What Collapses Without the Precommitment?**
  If you remove the non-refundable deposit, the case loses its philosophical teeth. Without the precommitment, there's no prior rule to break, so the guilt vanishes. Hyperbolic discounting just looks like normal preference change, and Aristotelian akrasia disappears entirely because there's no "better judgment" from the past to violate. The precommitment device is what creates the *appearance* of weakness that the theories have to fight over.

  **How a Defender of Akrasia Would Attack This**
  A strict defender of akrasia would argue that the "new info" is a rationalization, not a justification. They'd claim Elena always knew mentoring was valuable, but she needed the cert for long-term stability. By letting the immediate emotional pull of the mentoring gig override her stable long-term plan, she's still acting against her better judgment—she's just dressing up her weakness as wisdom. They'd say the guilt is the truth-teller here: her deeper self knows she should have stuck to the plan.
