answer: |-
  Here is a disambiguated menu of the claims *volenti non fit iniuria* might be making. You can present these to your friend one by one. For each, I have classified the claim, assessed its relationship to validity conditions (deception, pressure, competence), and determined whether it supports his conclusion that *how* the consent was obtained is "nobody's business."

  ### 1. The Tautological Reading
  *   **The Claim:** "Consent" is defined as "valid authorization that negates wrong." Therefore, "If one validly authorizes, no wrong is done" is true by definition.
  *   **Verdict:** **Trivial.** It is logically true but does no work.
  *   **Compatibility with Undermining Factors:** Irrelevant. It does not tell us *when* consent exists, only what the word means if it does.
  *   **Impact on Your Case:** **Supports nothing.** It cannot prove the participant consented; it only says *if* she validly consented, no wrong was done. It forces you to argue about validity, which is exactly what your friend wants to avoid.

  ### 2. The Normative Power Reading (The Standard Philosophical View)
  *   **The Claim:** Consent is a power (like making a promise) that changes normative relations. The maxim describes the *effect* of the power, but silently presupposes the *conditions* for exercising it are met.
  *   **Verdict:** **Substantive and Defensible.** This is the most common philosophical interpretation.
  *   **Compatibility with Undermining Factors:** **Compatible.** A power cannot be exercised if the conditions (truth, freedom, competence) are absent. A signed form is not the exercise of the power; it is evidence of it.
  *   **Impact on Your Case:** **Destroys his conclusion.** If the maxim presupposes validity, then "how consent was obtained" is *everyone's business*, because that is the only way to know if the power was actually exercised.

  ### 3. The Welfare Reading
  *   **The Claim:** Consent is evidence that the agent's welfare was not set back. If she agreed to it, it must have been good for her (or at least not bad), so no wrong occurred.
  *   **Verdict:** **Straightforwardly False (in this context).** People can consent to things that harm them, and harm remains harm even if authorized.
  *   **Compatibility with Undermining Factors:** **Incompatible.** If she didn't understand the risk, her welfare judgment was flawed.
  *   **Impact on Your Case:** **Destroys his conclusion.** Since she was physically harmed by a risk she did not understand, her welfare *was* set back. The maxim fails on its own terms.

  ### 4. The Remedy Waiver Reading (The Legalistic View)
  *   **The Claim:** A wrong *was* done, but the agent has waived her right to complain or seek a remedy. "No wrong" means "no *actionable* wrong."
  *   **Verdict:** **Substantive and Defensible.** This is often how courts actually use the maxim.
  *   **Compatibility with Undermining Factors:** **Compatible.** You cannot waive rights you do not know you have, or under duress.
  *   **Impact on Your Case:** **Destroys his conclusion.** Even if we only care about remedies, fraud and duress invalidate waivers. The court must investigate how consent was obtained to see if the waiver holds.

  ### 5. The "Consent Under a Description" Reading
  *   **The Claim:** One consents only to what one intends. If the description of the act (e.g., "a rare risk") is false, the intention does not match the reality (a "common risk"), so the consent does not cover the harm.
  *   **Verdict:** **Substantive and Defensible.** This is the standard account of fraud vitiating consent.
  *   **Compatibility with Undermining Factors:** **Incompatible with Deception.** Deception severs the link between the act and the consent.
  *   **Impact on Your Case:** **Destroys his conclusion.** She consented to a 1% risk, not a 2% risk. The harm fell outside the scope of her consent. The method of obtaining consent (the lie) is the central issue.

  ### 6. The Voluntariness/Baseline Reading
  *   **The Claim:** Consent requires a choice that is sufficiently free. The maxim applies only if the choice was not coerced by threats or "undue inducement" relative to a moral baseline.
  *   **Verdict:** **Substantive and Defensible.** Distinguishes consent from mere acquiescence or submission to necessity.
  *   **Compatibility with Undermining Factors:** **Incompatible with Coercion/Undue Inducement.** If the payment is so high it blinds judgment (undue inducement) or the poverty is so deep it amounts to duress, voluntariness is compromised.
  *   **Impact on Your Case:** **Destroys his conclusion.** Several months' wages for a town in need may constitute undue inducement. The economic context is "nobody's business" only if you ignore the baseline of freedom.

  ### 7. The Competency/Adaptive Preferences Reading
  *   **The Claim:** Only a competent agent can consent. If her preferences were shaped by the very deprivation that makes the study attractive, her competency to judge the risk is suspect.
  *   **Verdict:** **Substantive and Debated.** Harder to prove than deception, but recognized in bioethics.
  *   **Compatibility with Undermining Factors:** **Incompatible with Severe Impairment.** Desperation can degrade decision-making capacity.
  *   **Impact on Your Case:** **Complicates his conclusion.** It suggests the sponsor has a duty to ensure the participant isn't consenting *because* she is desperate, not just *despite* it.

  ### 8. The Formalist/Reliance Reading (Your Friend's Strongest Case)
  *   **The Claim:** Consent is a performative social act (like signing a contract). To protect social coordination and reliance, the signature binds the agent regardless of internal understanding, unless there is active physical force.
  *   **Verdict:** **Substantive but False (in Medical/Tort contexts).** Defensible in commercial contract law sometimes; indefensible in medical ethics and tort law regarding bodily integrity.
  *   **Compatibility with Undermining Factors:** **Incompatible.** Even formalist systems usually carve out exceptions for fraud and duress.
  *   **Impact on Your Case:** **Supports his conclusion (with a caveat).** This is the only reading that says "how it was obtained is nobody's business." However, it is the wrong theory for bodily harm. If you accept this, you allow companies to trick people into dangerous procedures so long as they sign a form.

  ### 9. The Gamble vs. Outcome Reading (Your First Move)
  *   **The Claim:** The maxim distinguishes between consenting to a *risk* (the gamble) and consenting to the *harm* (the outcome). One can authorize the former without authorizing the latter if the risk was misrepresented.
  *   **Verdict:** **Substantive and Defensible.** This is the precise legal distinction between *assumption of risk* and *negligence*.
  *   **Compatibility with Undermining Factors:** **Incompatible with Misrepresentation.** You consented to the gamble *as described*. If the odds were rigged, you didn't consent to *this* gamble.
  *   **Impact on Your Case:** **Destroys his conclusion.** She consented to a lottery with a 1-in-1000 chance, not a 1-in-50 chance. The sponsor changed the game after she bought the ticket.

  ### 10. The Independent Wrong Reading (Your Second Move)
  *   **The Claim:** Even if consent negates the wrong of the *injury*, it does not negate the wrong of the *deception*. There are two distinct complaints: one for the harm, one for the lie.
  *   **Verdict:** **Substantive and Defensible.** Consent waives the right to bodily integrity, not the right to truth.
  *   **Compatibility with Undermining Factors:** **Compatible.** The lie is a separate tort (fraud/misrepresentation) independent of the physical injury.
  *   **Impact on Your Case:** **Destroys his conclusion.** Even if your friend argues she "accepted the risk," the sponsor still committed a wrong by lying about the statistics. The maxim does not cover fraud.

  ***

  ### How to Use This Menu

  **The Core Disagreement:**
  Your friend is trying to use **Thesis 1 (Tautology)** or **Thesis 8 (Formalism)** to shut down the argument. He wants to treat consent as a magic switch that, once flipped, makes the history of *how* it was flipped irrelevant.

  **Your Counter:**
  You should argue that **Thesis 2 (Normative Power)** is the correct philosophical reading. Under Thesis 2, the maxim *presupposes* validity. Therefore, you cannot use the maxim to *prove* there was no wrong without first establishing validity. And you cannot establish validity without looking at deception (**Thesis 5**), pressure (**Thesis 6**), and understanding (**Thesis 9**).

  **The Knockout Blow:**
  Use **Thesis 10 (Independent Wrong)**. Even if he wins the argument that she "accepted the risk," he has not addressed the fact that she was lied to. *Volenti non fit iniuria* is a defense against a claim for injury; it is not a defense against a claim for fraud. The maxim leaves the lie entirely untouched.

  **Summary Verdict for Your Friend:**
  "If you mean the maxim as a tautology (1), it doesn't prove she consented. If you mean it as a normative power (2), it requires valid consent, which the lie negates (5). If you mean it as a formal rule (8), it's the wrong rule for medical ethics. And even if you are right about the injury, the maxim says nothing about the fraud (10). So, in every defensible reading, how the consent was obtained is precisely the business of the court."
