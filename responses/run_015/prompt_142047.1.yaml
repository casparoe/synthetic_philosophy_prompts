      *   *Hypothesis 3 (Community/Collective):* Celebrate contributions that lift the *collective*, not the *individual*. (Fits Case 1, 5, 7. Explains Case 2, 4).
      *   *Hypothesis 4 (The "Stewardship" Test):* Does this person treat their success as a resource for the company, or as personal capital?
          *   Junior Dev: Resource (showed others how).
