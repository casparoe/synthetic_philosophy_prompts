      *   The Chair's philosophy is **Recognition as Culture-Shaping, Not Reward.**
      *   The risk is the "Workshop Income." That signals "Personal Brand" to the Chair.
      *   The risk is the "Title Request." That signals "Hierarchy" to the Chair.
