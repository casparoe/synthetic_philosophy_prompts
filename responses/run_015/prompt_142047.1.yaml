      *   *Facts:* 3 years own time (Agency/Effort). OSS Library (Public good, but helps company recruiting). Workshops (Personal monetization). Requesting Principal Title (Status/Hierarchy). Self-nominated (Not reluctant).
      *   *Tension:*
          *   *Pro-Celebration:* High effort, high agency, massive company benefit (recruiting), replicable behavior (contribute to OSS).
          *   *Anti-Celebration:* Personal monetization (conflict of interest?), Self-nomination (not reluctant), Requesting Title (creating rank), Personal Brand (following).

  4.  **Map Precedents:**
      *   *Closest Analog:* **Senior Engineer (Personal Brand)** vs. **Quiet Mentor**.
