answer: |-
  You have put your finger on one of the most sophisticated critiques of behavioral public policy, but you are right that it often gets lumped in with simpler concepts. There isn't one single dictionary word for this, but in economics, psychology, and political philosophy, it is recognized as a specific cluster of problems.

  The phenomenon you are describing is best understood as the combination of **Endogenous Preferences** and **Hysteresis**, which together create an **Identification Problem** for "Revealed Preference."

  Here is the carving you asked for: what it is, what it isn't, and the terms that map to the edges.

  ### 1. The Core Concept: Endogenous Preferences
  Your brother-in-law is operating on the assumption of **Exogenous Preferences**. This is the standard economic view: preferences exist inside people's heads *before* they encounter the choice architecture. The nudge is just a friction-remover that allows the pre-existing preference to express itself.

  Your snag is that preferences are actually **Endogenous**. This means they are generated *by* the system itself. When you set a default, you aren't just removing friction; you are signaling what is normal, safe, or expected. You are actively participating in *forming* the preference, not just revealing it.

  *   **How it differs from "Adaptive Preferences":** As you noted, adaptive preferences (a la Jon Elster or Martha Nussbaum) are about *resignation*. It's the "sour grapes" mechanism: I can't have X, so I convince myself I didn't want X. Your scenario isn't about resignation; it's about **construction**. The participants aren't talking themselves into accepting a bad situation; they are accepting a default because the default *constitutes* the choice for them.
  *   **How it differs from "Status Quo Bias":** Status quo bias explains *why* people stay in the default (inertia, loss aversion). It does not explain the *epistemic* problem you identified. Status quo bias is the engine; Endogenous Preferences is the reason you can no longer measure the destination.

  ### 2. The Mechanism of the Snag: Hysteresis
  You described this perfectly: *"the number doesn't go back to a third either, it lands somewhere in the middle."*

  In physics and economics, this is **Hysteresis**. It refers to a system where the history of the system matters. Once the state has changed (from opt-in to opt-out), you cannot return to the original state simply by reversing the input. The "path" matters.

  *   **Why this creates the snag:** If there were no hysteresis, you could run an A/B test. Switch to auto-enroll, see 90%, switch back, see 33%. You could then calculate the "true" desire. Because of hysteresis (people get used to the deduction, or the social norm shifts), the baseline is destroyed. The experiment is a one-way mirror.

  ### 3. The Logical Trap: Revealed Preference Tautology
  This is the rhetorical move your brother-in-law is making. Standard economics relies on **Revealed Preference Theory**: we don't guess what people want; we look at what they *do*.

  *   **Before the nudge:** 33% act → 33% want it.
  *   **After the nudge:** 90% act → 90% want it.

  The snag you found is that the nudge breaks the link between *action* and *internal desire*. When the brother-in-law says, "See? 90% stayed in, they want it," he is committing a tautology. He is using the *output* of the nudge (high participation) as proof of the *premise* of the nudge (people wanted it all along).

  In causal inference, this is called an **Identification Problem**. You cannot isolate the variable of "desire" from the variable of "default setting" because they are now perfectly correlated.

  ### 4. A Term for Your Debate: "Preference Contamination"
  Since there isn't a single colloquial term, I recommend using **Preference Contamination**.

  It captures the idea that the data has been "polluted" by the intervention.
  *   **Definition:** Preference Contamination occurs when a choice architecture intervention (like a default) successfully alters behavior to such a degree that the resulting data can no longer be used to verify the pre-existing preferences that justified the intervention.
  *   **Why use it:** It shifts the debate from "Is this coercive?" (which your brother-in-law will deny) to "Is this measurable?" (which is objectively true). You aren't arguing about freedom; you're arguing about *epistemic blindness*.

  ### 5. Addressing the "Flop" Question
  You asked: *"Is it the same phenomenon when a nudge flops and everyone reads the flop as 'turns out people dont want this after all'?"*

  **No. That is a different phenomenon.**

  *   **Successful Nudge (Your Snag):** This creates **Preference Contamination**. The success of the policy hides the baseline. The brother-in-law claims victory ("They wanted it!"), but he is wrong because the preference was endogenous.
  *   **Failed Nudge:** This is simply **Signal Failure**. If you auto-enroll people and 90% opt-out immediately, the nudge failed to overcome inertia or objection. In this case, the revealed preference *is* still legible. People actively fought the default.

  The "snag" only exists when the nudge is *effective enough* to mask the underlying desire, but *not coercive enough* to be called a mandate. It lives in the gray zone where the policy is successful precisely because it makes its own justification untestable.

  ### Summary for the Conversation
  If you want to press this with your brother-in-law, here is the precise formulation:

  > "The problem isn't that people are being forced. The problem is **Endogenous Preferences** combined with **Hysteresis**.
  >
  > Before the policy, we had a baseline of what people wanted. After the policy, the default *became* the preference. Because of **Hysteresis**, we can't reverse the experiment to find the original baseline. So when you say '90% stay in, so they want it,' you're committing a **Revealed Preference Tautology**. You're using the result of the nudge to prove the necessity of the nudge. We have **Preference Contamination**: we literally can no longer know if they wanted it, because the policy destroyed the evidence."

  This moves the argument away from ideology ("nudging is manipulative") to methodology ("nudging makes the outcome unmeasurable"), which is a much harder position for him to defend.
