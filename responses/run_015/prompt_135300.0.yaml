answer: |-
  **Project Title:** The Continuity of Superrationality: A Sensitivity Analysis of Logical Correlation in Symmetric Games

  **Project Summary**
  This project investigates the stability of superrational decision-making under conditions of imperfect logical correlation. Standard formulations of superrationality, such as Hofstadter's Platonia dilemma, rely on the assumption of perfect correlation between agents: if I am rational, you are rational, and we will therefore identical outputs. This is a measure-zero case. In real-world scenarios—voting, strikes, open-source contribution—correlation is high but imperfect. Existing decision theories (Causal, Evidential, and Functional) provide determinate answers at the endpoints of correlation ($\rho=0$ and $\rho=1$) but offer no guidance for the intermediate space. This project will formalize a parameterized family of symmetric games to test whether superrational strategies are continuous in $\rho$. We will determine if there is a threshold below which cooperation collapses, and whether distinctions between logical correlation and common-cause correlation emerge significantly when $\rho < 1$.

  **Research Question and Motivation**
  The central research question is: *Is the optimal superrational policy continuous with respect to the degree of logical correlation between agents?*

  Hofstadter's original argument for superrationality posits that in a symmetric game, identical rational agents must arrive at the same strategy. In the Platonia dilemma (winner-takes-all if exactly one claims), the superrational strategy is to randomize with probability $1/N$. This yields a group success rate of $\approx 37\%$, vastly outperforming the Nash equilibrium where everyone claims and success is near zero. However, this argument hinges on the premise that other players' moves are determined by the same computation as yours.

  This premise is rarely met in practice. Other agents may share your reasoning process with probability $\rho$, but deviate due to noise, differing priors, or bounded rationality with probability $1-\rho$. Current decision theories are silent here. Causal Decision Theory (CDT) treats other players as independent ($\rho=0$). Functional Decision Theory (FDT) treats them as identical copies ($\rho=1$). Evidential Decision Theory (EDT) treats correlation as statistical, potentially conflating logical dependence with common causes.

  If superrationality is to have normative force outside of thought experiments, it must prescribe actions when $\rho$ is high but not perfect. If the optimal policy changes discontinuously (e.g., cooperate only if $\rho > 0.99$), superrationality loses practical applicability. If the distinction between "logical correlation" (FDT) and "common cause" (EDT) vanishes as $\rho \to 1$, the theoretical motivation for FDT weakens. This project resolves these ambiguities through formal sensitivity analysis.

  **Methodology**
  This is a formal theoretical project, not an empirical or psychological study. We will not test human behavior, nor will we attempt to derive new decision-theoretic axioms, which is beyond the scope of a one-year fellowship. Instead, we will perform a sensitivity analysis of existing theories across a parameterized game space.

  1.  **Formalization of the Game Family:** We will define a symmetric $N$-player game with two variable parameters:
      *   **Correlation ($\rho$):** The probability that any other player $j$ employs the same deterministic policy as agent $i$. With probability $1-\rho$, player $j$'s move is independent (or determined by a screening-off common cause, allowing us to distinguish FDT-style logical correlation from EDT-style statistical correlation).
      *   **Payoff Structure:** We will analyze two variants. First, the standard Platonia "winner-takes-all" setup. Second, a "diluted pot" setup where a fixed reward is split among claimants. This tests whether superrationality yields a determinate optimum or merely an asymptotic approach to zero entry.

  2.  **Theoretical Analysis:** We will derive the expected utility functions for CDT, EDT, and FDT agents across the domain $\rho \in [0, 1]$.
      *   For CDT, the derivative of utility with respect to own action ignores $\rho$.
      *   For EDT, the conditional probabilities will scale with $\rho$.
      *   For FDT, we will model the "logical" dependency as a function of $\rho$, treating the other agents as noisy simulations of the agent's own algorithm.

  3.  **Continuity and Threshold Testing:** We will solve for the optimal mixed strategy $p^*(\rho)$ for each theory. We will then analyze the function $p^*(\rho)$ for continuity, differentiability, and the existence of phase transitions (thresholds where the optimal strategy flips from cooperate to defect).

  **Expected Deliverables**
  1.  **A Formal Model:** A rigorous definition of "imperfect logical correlation" suitable for publication in decision theory or formal epistemology venues.
  2.  **Continuity Theorems:** Proof or disproof of the continuity of superrational strategies in $\rho$. Specifically, determining if $ \lim_{\rho \to 1} p^*_{FDT}(\rho) $ equals the standard superrational solution.
  3.  **Comparative Analysis:** A mapping of the divergence between EDT and FDT in the intermediate region. If the two theories converge as $\rho \to 1$, this suggests the "logical" aspect of FDT is less distinct from standard evidential reasoning than claimed.
  4.  **Draft Manuscript:** A paper suitable for submission to a journal such as *The British Journal for the Philosophy of Science* or *Erkenntnis*.

  **Risk Assessment and Failure Modes**
  *   **Trivial Continuity:** It is possible that the optimal policy interpolates linearly or smoothly between the CDT and FDT endpoints. While mathematically clean, this would be a null result philosophically, suggesting no special "superrational" behavior exists in the intermediate zone.
  *   **Collapse to Correlated Equilibrium:** The analysis may demonstrate that the problem dissolves into standard Aumann correlated equilibrium theory once a correlation parameter is introduced. If so, the project will pivot to explicating why decision theorists have resisted this reduction.
  *   **Intractability:** The "diluted pot" variant may not yield a closed-form solution. In this event, the project will prioritize the winner-takes-all model, treating the diluted case as qualitative future work.

  **Timeline**
  *   **Months 1–3:** Formalization of the $\rho$ parameter and payoff structures. Literature review on existing treatments of imperfect predictors in Newcomb-like problems.
  *   **Months 4–6:** Derivation of optimal strategies for CDT, EDT, and FDT in the winner-takes-all variant. Initial continuity analysis.
  *   **Months 7–9:** Analysis of the diluted pot variant. Comparison of logical correlation vs. common cause models.
  *   **Months 10–12:** Synthesis of results, drafting of manuscript, and presentation of findings at departmental seminars.

  **Scope and Feasibility**
  I am aware that this proposal risks overreach; specifically, analyzing both the winner-takes-all and diluted pot variants, while distinguishing between logical and common-cause correlation, could constitute three separate papers. My supervisor has rightly noted this concern.

  To ensure feasibility within twelve months, the project has a strict priority hierarchy. The primary deliverable is the continuity analysis of the **winner-takes-all** variant. This is sufficient to answer the core question regarding the stability of superrationality. The **diluted pot** variant serves as a robustness check; if the mathematical complexity threatens the timeline, this section will be truncated to a conjecture or appendix. Similarly, while distinguishing logical correlation from common causes is theoretically vital, if the models prove isomorphic in the limit, the project will report that convergence rather than forcing a distinction where none mathematically exists. This ensures a complete, publishable result on the primary question even if secondary avenues must be curtailed.

  By focusing on sensitivity analysis rather than axiomatization, this project avoids the decade-long timeline of founding a new decision theory. It instead interrogates the existing frameworks where they are currently silent, providing a determinate answer to whether superrationality survives contact with the imperfect real world.
