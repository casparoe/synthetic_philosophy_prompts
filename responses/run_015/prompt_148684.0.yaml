answer: |-
  # DECISION TREE: LOGICAL SPACE OF DEATH CRITERIA

  **Instructions:** Follow the path that matches your concrete commitments. Do not worry about the names of the theories yet; answer based on what you believe *makes* someone dead.

  ### **NODE 1 (ROOT): THE ESSENTIAL LOSS**
  **Is death fundamentally the collapse of organism-level biological integration, OR is it the irreversible loss of consciousness/psychological continuity?**
  *   **(A) Organism-Level Integration:** The body must function as a coordinated whole.
  *   **(B) Consciousness/Psychological:** The capacity for experience or personhood must be gone.

  ---

  ### **NODE 2: DEFINING "IRREVERSIBLE"**
  **When we say a function is "irreversibly" lost, do we mean "cannot be reversed given current technical capabilities" OR "the organism lacks the intrinsic biological capacity to resume"?**
  *   **(A) Current Technical Capabilities:** If technology exists to restart it, it is not irreversible (even if we choose not to use it).
  *   **(B) Intrinsic Biological Capacity:** If the body cannot restart itself, it is irreversible (even if technology could artificially sustain it).

  > **⚠️ LOGICAL FLAG (Path 1A + 3A):** If you choose **Current Technical Capabilities** but later insist **Circulatory Arrest = Death** (even if ECMO exists), your position is **Incoherent**. You cannot claim a function is technically reversible while declaring death based on its cessation.

  ---

  ### **NODE 3: CIRCULATORY ARREST & ECMO**
  **If the heart has stopped but ECMO could technically restore flow immediately, does circulatory arrest alone count as death?**
  *   **(A) Yes:** Circulatory arrest is sufficient for death (ECMO relevance rejected).
  *   **(B) No:** Death requires permanent cessation; potential restoration prevents death declaration.

  > **⚠️ LOGICAL FLAG (Path 3A):** This leads to **Traditional Circulatory Views**. However, if combined with **Node 2A**, this is **Unattractive/Incoherent** (see above). If combined with **Node 2B**, it implies a normative judgment that "we will not use the tech," effectively shifting the definition of irreversibility to "will not be reversed."

  ---

  ### **NODE 4: NEUROLOGICAL CRITERIA**
  **If the brainstem has failed but some cortical activity is still detectable, is brainstem failure sufficient for death?**
  *   **(A) Yes:** Brainstem death is sufficient.
  *   **(B) No:** Whole-brain (including cortex) cessation is required.

  > **⚠️ LOGICAL FLAG (Path 1A + 4A):** If you believe death is **Organism Integration** but accept **Brainstem Only**, you must explain why the organism isn't still integrated (e.g., hormonal function, wound healing). If you cannot, this position is **Unexplored/Unstable**.
  >
  > **⚠️ LOGICAL FLAG (Path 1B + 4B):** If you believe death is **Loss of Consciousness** but require **Whole-Brain** death, you are accepting a period where the patient is biologically alive but psychologically dead. This is **Logically Consistent but Pragmatically Cautious**.

  ---

  ### **NODE 5: LAW VS. BIOLOGY**
  **Should legal death track biological death exactly, OR can it diverge to facilitate organ procurement?**
  *   **(A) Track Exactly:** Law must mirror biological/philosophical reality.
  *   **(B) Can Diverge:** Law may declare death earlier to save viable organs (pragmatic utility).

  > **⚠️ LOGICAL FLAG (Path 5B):** This position is **Ethically Contested**. It admits that "death" is partly a legal construct for resource allocation, not purely a medical fact.

  ---

  # MAPPING THE POSITIONS

  Once you have navigated the tree, locate your resulting "Leaf" below to see which established bioethical position matches your commitments.

  ### **LEAF 1: The Whole-Brain Integrationist**
  *   **Path:** 1(A) Integration → 2(B) Intrinsic Capacity → 3(B) No ECMO-Death → 4(B) Whole-Brain Required → 5(A) Track Exactly.
  *   **Commitment:** Death is the loss of the body's ability to coordinate itself. Technology doesn't count as "life" if the body can't do it itself. The whole brain is needed for integration; brainstem alone isn't enough. Law must match this reality.
  *   **Jurisdictional Example:** United States (Uniform Determination of Death Act standard).

  ### **LEAF 2: The Consciousness-First (Tech-Relative)**
  *   **Path:** 1(B) Consciousness → 2(A) Current Tech → 3(B) No ECMO-Death → 4(B) Whole-Brain/Cortex Required → 5(A) Track Exactly.
  *   **Commitment:** Death is the end of the "person." If tech can restore consciousness, you aren't dead. However, if the cortex is gone, you are dead, even if the body breathes.
  *   **Jurisdictional Example:** Rare in pure legal form, but common in philosophical argument (Higher Brain Standard).

  ### **LEAF 3: The Traditional Circulatory View (ECMO-Irrelevant)**
  *   **Path:** 1(A) Integration → 2(B) Intrinsic Capacity → 3(A) Yes ECMO-Irrelevant → 4(A) N/A (Circulatory Primary) → 5(A) Track Exactly.
  *   **Commitment:** When the heart stops and we do not intend to restart it, the organism's intrinsic capacity is gone. The *availability* of ECMO doesn't matter if it isn't *applied*.
  *   **Jurisdictional Example:** DCD (Donation after Circulatory Death) protocols in many jurisdictions; historical common law.
  *   **Note:** If this path chose 2(A) instead of 2(B), it would be flagged as **Incoherent**.

  ### **LEAF 4: The Intermediate View (Brainstem as Proxy)**
  *   **Path:** 1(B) Consciousness → 2(B) Intrinsic Capacity → 3(B) No ECMO-Death → 4(A) Yes Brainstem Sufficient → 5(A) Track Exactly.
  *   **Commitment:** Death is ultimately about consciousness. However, brainstem death guarantees permanent unconsciousness. We accept brainstem criteria not because integration is gone, but because it is a reliable proxy for the loss of consciousness.
  *   **Jurisdictional Example:** United Kingdom (Brainstem Death Standard).

  ### **LEAF 5: The Pragmatic Legalist**
  *   **Path:** [Any Biological Path] → 5(B) Can Diverge.
  *   **Commitment:** Biological death is a process, not a moment. The law picks a moment that balances respect for the dead with the need to save living patients via transplantation.
  *   **Jurisdictional Example:** Implicit in many "Dead Donor Rule" debates; explicit in some proposed reforms for DCD.

  ---

  # SEMINAR DISCUSSION POINTS

  1.  **The Incoherence Trap:** Look at Node 2 & 3. Why do some jurisdictions legally accept circulatory death (Node 3A) while medical guidelines acknowledge ECMO can reverse it (Node 2A)? Is this a legal fiction, or a shift in the definition of "capacity"?
  2.  **The Brainstem Split:** Compare Leaf 1 (US) and Leaf 4 (UK). Both often claim to rely on "brain death," but Leaf 1 requires the *cortex* to be dead (Integration), while Leaf 4 requires the *brainstem* to be dead (Consciousness Proxy). How does this affect organ viability timelines?
  3.  **The Legal Divergence:** If you chose Node 5(B), are you redefining death, or simply acknowledging that the *law* needs a bright line where *biology* offers a gradient? Is this ethically permissible?
