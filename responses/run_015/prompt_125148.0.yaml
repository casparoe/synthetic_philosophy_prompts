answer: |-
  1. "The eulogy"

  Thank you for coming. Hugh left instructions for this day. He wrote that he did not want to be turned into a character. He did not want us to speak about what he was like, as if that were a fixed thing we could now summarize. He asked that if we must speak of him, we speak about what he did on particular occasions. He asked that we leave it visible that he could have done otherwise. And he asked us not to say he is at peace, because that is a state he never chose and now has no way to revise. I intend to keep that promise.

  So I will not tell you that he was a dedicated teacher. I will tell you that on Tuesday afternoons in Room 4, he would stand by the window and wait. He waited for the noise of the corridor to stop, not by shouting, but by standing still until the silence came to him. He taught French verbs and drama exercises for thirty-eight years. He did not do this because it was his nature to teach. He did it because he turned up, term after term, and chose to stand in that room when he could have chosen to leave. There were days when the rain hit the glass and the heating failed, and he taught anyway. There were days when he was tired, and he taught anyway. Each of those hours was a separate decision. I remember him rehearsing *The Misanthrope* with a group of fifteen-year-olds who did not want to be there. He did not charm them. He stood in the centre of the circle and spoke the lines until they matched his volume. He chose to demand their attention, again and again, until they gave it.

  I need to speak about 1994. Some of you remember it well. He resigned in the middle of a term. He had written a reference for a seventeen-year-old who had been caught with the exam papers. The headmaster wanted it withdrawn. Hugh refused. He walked out. There is a story that says he did this because he was a man of principle. Hugh told me that was not true. He told me it was a thing he did on a Tuesday. He did not know then how the rest of his life would go. He did not know if he was right. He only knew that on that morning, given what was in front of him, he could not sign the withdrawal. He lost his job. He lost the routine he had kept for decades. He packed his belongings into a cardboard box in the rain. He lived with that cost. He never described it as a victory. He described it as a thing he did, and then had to live with. Some of you thought it was a mistake. Some thought it was the best thing he ever did. He held both those judgments without letting them define him.

  He read hard books. He read Sartre, not as a youthful enthusiasm, but as a book he checked his life against. I have seen his copies. The margins are full of arguments. He did not read to agree. He read to find the place where the words stopped matching the world. He argued at the kitchen table. He argued with Maureen, he argued with me. He did not argue to win. He argued because he believed that stopping the argument was the same as stopping the thinking. He believed that if we stopped asking whether what we did was right, we became something less than human. He did this in the evenings, under the lamp, with a pen in his hand. He chose to keep the question open.

  He had a private name for what he was against. He called it the passport photograph. He meant the habit of fixing a person with one still image taken at the end. We want to take that photograph now. We want to say he was this kind of man, that kind of friend, so that we can put him away safely. He would hate that. He would want us to see that the image is flat. He would want us to see that the person in the photograph could have turned his head. He could have smiled. He could have walked away. The photograph lies because it suggests the subject is finished.

  Hugh is not finished in the only way that matters to me. He is not here to choose anymore. But we are. We are sitting in these pews, and we are not finished either. Nothing about us is settled by what we have been so far. The grief you feel is not a state you are stuck in. It is a thing you are doing. The love you have for him is not a memory. It is a thing you are choosing to carry forward. You will leave this building and you will have to decide what to do with the rest of your Saturday. You will have to decide how to treat the people you meet tomorrow. You are not fixed. You are not a photograph. You are still in the room, waiting for the silence, deciding whether to speak. When you walk out into the light, you are not the same person who walked in. You have this moment to use.

  He asked me not to use big words. He asked me not to make this a thesis. So I will not tell you that he was free. I will not tell you that he was true to some inner script. I will only say this. In a world that wants to tell us who we are before we have done anything, he remained [pause] honest.

  Maureen, we are here. We are still choosing. And we are still here.

  2. "What the speech refuses to say"

  This speech deliberately omits three standard consolations. First, it does not say Hugh is "at peace." His note explicitly forbade this, viewing it as a state he did not choose and cannot revise. To assert it would be to lie about his philosophy and violate his specific instruction. It would imply a restfulness he spent his life arguing against, suggesting his struggle is over rather than simply ended.

  Second, it refuses the narrative that he was a "man of principle" regarding the 1994 resignation. To call him this is trait-talk; it suggests the action was inevitable given his character. Hugh insisted it was a contingent act done on a Tuesday, with alternatives visible at the time. Framing it as principle vindicates him retrospectively and simplifies the cost he bore. It implies the school was plainly wrong and that Hugh knew he was right, whereas he lived with the uncertainty of that choice for decades.

  Third, it avoids religious assertions about his current state of being. For the Catholic mourners, the usual comfort is that he is with God or resting from his labours. To assert this would be condescending to those who know he did not believe it, and dishonest to Hugh's memory. Instead, the speech offers a different comfort: that the mourners themselves are unfinished. It shifts the focus from his settled state to their ongoing freedom. This implies that the value of his life is not in its conclusion, but in how it prompts the living to continue choosing. It refuses to close the book on him, and by extension, refuses to close the book on us.

  3. "Lines to cut"

  If the room feels too tense during the 1994 segment, cut the sentence: "Some of you thought it was a mistake. Some thought it was the best thing he ever did." This explicitly highlights the division in the room. Substitute with: "He lived with that cost, and he never asked us to judge it for him." This acknowledges the conflict without forcing the mourners to pick a side in the moment.

  If the "passport photograph" metaphor seems too abstract for the wider family, simplify the explanation. Cut: "He meant the habit of fixing a person with one still image taken at the end." Substitute with: "He meant the way we try to sum up a life once it has stopped moving." This retains the meaning without the specific imagery that might distract.

  If the refusal of "peace" feels too sharp for Maureen and the Catholic family, soften the opening reference to his note. Instead of "He asked us not to say he is at peace," say: "He asked us to be careful about how we speak of his rest." This respects his wish without explicitly negating their comfort in the first paragraph, allowing the later dramatized consolation to do the work without initial confrontation.
