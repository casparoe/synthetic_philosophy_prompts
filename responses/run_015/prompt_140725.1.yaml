answer: |-
  ### Part 1: The Exam Question

  **POPULATION ETHICS: FINAL EXAMINATION**
  **Time Allowed:** 90 Minutes
  **Instructions:** Closed book. Calculators permitted. Answer all parts. Define any terms not provided.

  **Setup:**
  A population is defined by a set of welfare levels $\{w_1, w_2, ..., w_n\}$.
  *   $n$: Headcount.
  *   $T = \sum w_i$: Total welfare.
  *   $A = T/n$: Average welfare.
  *   Welfare is measured on a ratio scale where 0 represents a neutral life (neither worth living nor not). Positive $w$ is a life worth living.

  **The Repugnant Conclusion (RC):**
  Let $A^*$ be a population of $10^{10}$ (ten billion) people, each at welfare $w=100$.
  The RC states that for any $\epsilon > 0$, there exists a population $Z$ of $N$ people at welfare $\epsilon$ such that $Z$ is better than $A^*$.

  **Questions:**

  **1. Variable Geometry Utilitarianism (8 marks)**
  Consider the value function $V_\alpha = A \cdot n^\alpha$, where $0 \le \alpha \le 1$.
  (a) Set $\epsilon = 0.01$. Derive the minimum $N$ required for population $Z$ ($N$ lives at $\epsilon$) to exceed the value of $A^*$ as a function of $\alpha$. Show your algebra.
  (b) Does setting $\alpha = 0.5$ avoid the Repugnant Conclusion? Explain whether reducing $\alpha$ eliminates the RC or merely increases the $N$ required, and evaluate the ethical significance of pushing $N$ beyond physical possibility.

  **2. The Averagist Endpoint (5 marks)**
  Set $\alpha = 0$ (Averagism: $V_0 = A$).
  (a) Demonstrate mathematically that under this view, a population of 2 people at $w=101$ is better than $A^*$.
  (b) Demonstrate mathematically that adding one person at $w=99$ to $A^*$ makes the outcome worse.
  (c) Identify the specific ethical intuition violated in (b).

  **3. The Lexical Threshold View (8 marks)**
  Fix a threshold $\tau > 0$. Population $P$ is better than $Q$ if:
  1.  $P$ has fewer people with $w < \tau$ than $Q$ does; OR
  2.  They have the same number of people below $\tau$, and $P$ has higher Total welfare ($T$).
  (a) Assume $\tau = 50$. Show that the RC returns if the repugnant population $Z$ has welfare $\epsilon = 60$.
  (b) Consider population $Y$: $10^{10}$ people at $w = \tau - \eta$ (where $\eta > 0$). Compare $Y$ to $A^*$. Now consider $Y'$: $10^{10}$ people at $w = \tau + \eta$. Compare $Y'$ to $A^*$.
  (c) What structural feature of the theory causes the difference in comparison between $Y$ and $Y'$? Is this feature preferable to the RC?

  **4. Critical-Level Utilitarianism (5 marks)**
  Value is defined as $V_{CL} = \sum (w_i - c)$ for a fixed critical level $c > 0$.
  (a) If $c = 10$ and $\epsilon = 5$, can the RC occur? Explain.
  (b) Where does the RC relocate if $\epsilon = 15$?
  (c) What is the normative cost of this view regarding lives where $0 < w < c$?

  **5. Synthesis (4 marks)**
  To definitively avoid the Repugnant Conclusion without generating the Absurd Conclusion (Part 2) or the Cliff Effect (Part 3), which of the following must be rejected? Justify your choice:
  (i) Completeness (some populations are incomparable).
  (ii) Unbounded Aggregation (total value has a limit).
  (iii) Continuity (small welfare changes cannot flip rankings).
  (iv) The Benefit Principle (a life worth living is always a benefit to add).

  ***

  ### Part 2: Model Answer

  **1. Variable Geometry Utilitarianism**
  (a) We compare $V(A^*)$ against $V(Z)$.
  $V(A^*) = 100 \cdot (10^{10})^\alpha$.
  $V(Z) = 0.01 \cdot N^\alpha$.
  We require $0.01 \cdot N^\alpha > 100 \cdot (10^{10})^\alpha$.
  Dividing by 0.01: $N^\alpha > 10,000 \cdot (10^{10})^\alpha = 10^4 \cdot (10^{10})^\alpha$.
  Taking the $1/\alpha$ root: $N > (10^4)^{1/\alpha} \cdot 10^{10}$.
  $N > 10^{(4/\alpha) + 10}$.

  (b) Setting $\alpha = 0.5$ yields $N > 10^{8+10} = 10^{18}$. This is finite. As long as $\alpha > 0$, $N$ remains finite, meaning the Repugnant Conclusion holds formally. Reducing $\alpha$ does not avoid the RC; it merely "damps" the aggregation, requiring a larger $N$ to trigger the conclusion.
  Pushing $N$ beyond the number of atoms in the observable universe ($\approx 10^{80}$) is a physical dodge, not an ethical solution. If $\alpha = 0.05$, $N > 10^{90}$, which is physically impossible. However, ethical theories should evaluate logical possibility, not physical contingency. If the theory implies a physically impossible world is better, the theory still entails the counter-intuitive ranking. Thus, $\alpha < 1$ is a delay tactic, not a solution.

  **2. The Averagist Endpoint**
  (a) $A^*$ has average welfare 100. A population of 2 at $w=101$ has average welfare 101. Since $101 > 100$, Averagism ranks the 2-person population as better. This violates the intuition that ten billion excellent lives outweigh two marginally better ones.
  (b) Adding one person at $w=99$ to $A^*$ changes the sum from $10^{12}$ to $10^{12} + 99$. The new $n$ is $10^{10} + 1$. Since $99 < 100$, the new average drops below 100. The outcome is ranked as worse.
  (c) This violates the **Mere Addition Principle** (or Weak Non-Sadism): adding a person with a life worth living ($w > 0$) should not make the outcome worse, provided the addition does not harm existing people. Averagism treats existing people as mere vessels for maintaining a statistical mean.

  **3. The Lexical Threshold View**
  (a) If $\tau = 50$ and $\epsilon = 60$, both $A^*$ (all at 100) and $Z$ (all at 60) have zero people below $\tau$. The first condition is tied. We proceed to the tie-breaker: Total Welfare. $T(A^*) = 10^{12}$. $T(Z) = N \cdot 60$. For sufficiently large $N$, $T(Z) > T(A^*)$. The RC returns for any $\epsilon > \tau$. The RC is not avoided; it is relocated to populations above the threshold.
  (b) $Y$ ($10^{10}$ at $\tau - \eta$): Everyone is below $\tau$. Count below $\tau = 10^{10}$.
  $A^*$ ($10^{10}$ at 100): Everyone is above $\tau$ (assuming $\tau=50$). Count below $\tau = 0$.
  $A^*$ is strictly better than $Y$ regardless of totals.
  $Y'$ ($10^{10}$ at $\tau + \eta$): Everyone is above $\tau$. Count below $\tau = 0$.
  Now we tie-break by Total. If $\eta$ is small, $T(Y') \approx T(A^*)$. If we scale $Y'$ up slightly, $Y'$ beats $A^*$.
  (c) This reveals a **Discontinuity (Cliff)**. An infinitesimal increase in welfare from $\tau - \eta$ to $\tau + \eta$ flips the population from "inferior to $A^*$" to "potentially superior to $A^*$" (via total aggregation). This violates **Continuity**: small changes in welfare should not produce lexicographic jumps in value. Whether this is worse than the RC is debatable, but it trades a counter-intuitive aggregation for a counter-intuitive valuation threshold.

  **4. Critical-Level Utilitarianism**
  (a) If $c = 10$ and $\epsilon = 5$, each new life contributes $(5 - 10) = -5$ to the value. Adding more people decreases total value. The RC is avoided for $\epsilon < c$.
  (b) If $\epsilon = 15$, each life contributes $+5$. The RC relocates to $\epsilon > c$. We can still swamp $A^*$ with enough lives at $w=15$.
  (c) The cost is the **Sadistic Conclusion** variant: Lives that are worth living ($w > 0$) but below the critical level ($w < c$) count as negative value. Creating a happy person (at $w=5$) is morally equivalent to creating a suffering person, which contradicts the setup that $w>0$ is a life worth living.

  **5. Synthesis**
  To escape the RC without the Absurd Conclusion (Averagism) or the Cliff (Lexical), one must likely reject **(iv) The Benefit Principle** (as CLU does, accepting lives worth living can be bad to create) OR **(i) Completeness** (Person-Affecting Views).
  If we maintain that adding a life worth living is always a benefit (Benefit Principle) and that we must compare all populations (Completeness), the RC follows mathematically from transitivity and aggregation (Parfit's Mere Addition Paradox). Person-Affecting views avoid this by declaring $A^*$ and $Z$ incomparable (neither is better), but this fails to guide choice in policy contexts where one *must* be chosen. Thus, the most robust escape requires accepting that "worth living" does not imply "adds value," severing the link between individual goodness and impersonal value.

  *(Note: A fifth route is **Non-Archimedean Prioritarianism**, where welfare is weighted such that no amount of low welfare can outweigh high welfare, effectively treating welfare levels as lexical without a hard threshold $\tau$.)*

  ***

  ### Part 3: Marking Scheme

  **Total: 30 Marks**

  **Part 1: Variable Geometry (8 Marks)**
  *   **Correct Algebra (4 marks):** Derivation of $N > 10^{10 + 4/\alpha}$. Deduct 2 marks for algebraic errors in exponents.
  *   **Interpretation of $\alpha$ (2 marks):** Identifying that for any $\alpha > 0$, $N$ is finite, so RC holds.
  *   **Physical vs. Ethical (2 marks):** Noting that physical impossibility does not negate the theoretical implication.
      *   *Common Pitfall:* Students claim $\alpha < 1$ avoids RC because the numbers get "too big." They fail to distinguish between *practical* and *theoretical* repugnance.

  **Part 2: Averagism (5 Marks)**
  *   **2 vs 10B Calculation (2 marks):** Showing $101 > 100$ implies 2-person win.
  *   **Mere Addition Calculation (2 marks):** Showing mean drops when adding $w < A$.
  *   **Intuition Named (1 mark):** Identifying "Mere Addition" or "Non-Sadism" violation.
      *   *Common Pitfall:* Students describe the result as "counter-intuitive" without naming the specific principle (Mere Addition) that is violated.

  **Part 3: Lexical Threshold (8 Marks)**
  *   **RC Relocation (3 marks):** Showing that if $\epsilon > \tau$, the view collapses to Total Utilitarianism, restoring RC.
  *   **The Cliff (3 marks):** Demonstrating the ranking flip between $\tau - \eta$ and $\tau + \eta$.
  *   **Continuity Judgment (2 marks):** Identifying Continuity as the violated axiom and offering a brief judgment.
      *   *Common Pitfall:* Students test the threshold view *only* with $\epsilon < \tau$. They conclude the view works because they miss the relocation of the RC to lives *above* the threshold.

  **Part 4: Critical Level (5 Marks)**
  *   **RC Avoidance Condition (2 marks):** $\epsilon < c$ prevents RC.
  *   **RC Relocation (1 mark):** RC persists for $\epsilon > c$.
  *   **Normative Cost (2 marks):** Identifying that $0 < w < c$ lives count as harms (Sadistic Conclusion).
      *   *Common Pitfall:* Students claim CLU solves the RC entirely, forgetting that the RC simply shifts to $\epsilon > c$.

  **Part 5: Synthesis (4 Marks)**
  *   **Selection & Justification (4 marks):** Must select one option and link it to the failures in Parts 1-4. Full marks for linking "Benefit Principle" to CLU costs or "Completeness" to Person-Affecting limitations.
      *   *Common Pitfall:* Vague appeals to "balance" or "context" without identifying the specific axiomatic trade-off.

  ***

  ### Part 4: Critique & Feedback on Setup

  **1. Under-specification in the Prompt:**
  *   **Ratio Scale Assumption:** You specify welfare is on a *ratio* scale (0 is absolute neutral, doubling welfare is meaningful). This is a heavy metaphysical lift. Most population ethics assumes *cardinal unit comparability* (interval scale with fixed unit), where 0 is stipulated but ratios ($w_1 = 2w_2$) are not necessarily meaningful. The formula $V_\alpha = A \cdot n^\alpha$ works on interval scales only if 0 is fixed. If 0 shifts, $A$ shifts, and the ranking changes. You should explicitly state in the exam that **0 is fixed and non-arbitrary** to prevent students from arguing that shifting the zero point changes the result.
  *   **Lexical Tie-Breaker:** In Part 3, your definition says "ties broken by greater total welfare." You need to ensure students understand this applies when the count below $\tau$ is equal (including when both are zero). My model answer assumes this, but a sharp student might argue "If both are zero, the lexical condition is satisfied, so we don't need a tie-breaker." The definition needs to be: "Primary sort: count below $\tau$ (ascending). Secondary sort: Total Welfare (descending)."

  **2. The "Fifth Escape Route":**
  *   I included **Non-Archimedean Prioritarianism** in the model answer notes. Another strong candidate is **Variable Critical Levels** (where $c$ rises as population increases). This avoids the RC because as $N$ grows, $c$ grows, eventually exceeding $\epsilon$. However, this risks making the value of a life dependent on how many *other* people exist, which violates Separability.
  *   **Person-Affecting Restriction:** You mention this in the synthesis. It's worth noting that "Incomparability" is often a disguised form of the Lexical View (where the threshold is the baseline of the specific individuals involved).

  **3. Difficulty Calibration:**
  *   **Part 1 Algebra:** For upper-level undergrads, manipulating exponents with $10^{10}$ is fine. For PhDs, it's trivial. The value is in the *interpretation* of the finite $N$.
  *   **Part 3 (Lexical):** This is the discriminator. Most survey articles claim Lexical Views solve the RC. Forcing them to prove it *relocates* the RC (to $\epsilon > \tau$) and creates a *Cliff* (at $\tau$) requires genuine engagement with the formalism.
  *   **Time:** 90 minutes is tight for this amount of writing and calculation. If you want deeper synthesis, consider dropping Part 2 (Averagism is well-known) and expanding Part 3/5. However, keeping Part 2 ensures they can't skip the basics.

  **4. Recommendation:**
  Add a clarifying sentence to the Setup: *"Note: 0 is a fixed absolute neutral point; welfare transformations must preserve 0."* This prevents interval-scale objections that would derail the 90-minute constraint.
