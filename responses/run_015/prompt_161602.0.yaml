answer: |-
  Here is a 75-minute battle plan designed to distinguish the views cleanly, inoculate against the "merely verbal" heckle, and keep first-years from sliding into relativism.

  ### 1. The Board: What Must Be Up First
  You are correct: you cannot separate the views until you have separated the *variables*. If you write "Contextualism" and "Encroachment" on the board before defining the roles, students will conflate them.

  **Before you name either view, draw this schema:**

  $$K = f(B, T, E, \mathbf{X})$$

  *   **B, T, E:** Belief, Truth, Evidence. (Stipulate these are **fixed** for the session).
  *   **X:** The variable that changes the truth value of "S knows."

  **Below that, draw two distinct boxes:**
  1.  **The Subject (S):** The person who has the belief/evidence. (Where are *their* stakes?)
  2.  **The Ascriber (A):** The person saying the sentence "S knows." (Where are *their* stakes/standards?)

  **Why this order?**
  In the standard Bank Case (Keith), S and A are the same person. This is why your grad friend thinks the dispute is verbal: in standard cases, S's stakes and A's stakes rise and fall together. Both theories predict the same result. To separate the theories, you must break the identity between S and A. If you don't put S and A on the board *before* introducing the theories, students will treat "context" as a blob, and the two views will look identical.

  ### 2. The Carrying Example: Priya and Sam (The Valve)
  Drop the Bank Case. Drop the Airport Case. They are useful for motivating the *problem* (that stakes seem to matter), but they are useless for distinguishing the *solutions* because they conflate Subject and Ascriber.

  **Use the Priya/Sam Valve case.** It is the only single example that forces the views apart.

  **What it must have:**
  *   **Visible Fixed Evidence:** Write on the board: "Priya's Evidence: One glance at a gauge. Reliability: 95%." Do not let this change.
  *   **Divergent Stakes:** Priya wants to go home (Low Stakes). Sam must authorize a crew entry (High Stakes).
  *   **No Life/Death:** Keep the stakes financial or procedural (e.g., "costly delay" vs. "ruinous fine"). If you make it life-or-death, students will argue about moral obligations rather than epistemic states.
  *   **The Specific Question:** Do not ask "What should Sam do?" Ask: **"Is the sentence 'Priya knows the valve is shut' TRUE when uttered by Sam?"**

  **Why this example?**
  It isolates the variable **X** in your equation.
  *   **Contextualism** says X is determined by **A** (Sam). Sam is in a high-stakes context. Standards are high. Verdict: **False**.
  *   **Pragmatic Encroachment** says X is determined by **S** (Priya). Priya is in a low-stakes context. Standards are low. Verdict: **True**.

  This creates a genuine disagreement on truth conditions, which defeats the "merely verbal" heckle immediately.

  ### 3. The Sequence (75 Minutes)

  **0:00–0:15: The Setup and the "Fixed Evidence" Rule**
  *   Introduce the Priya/Sam case.
  *   **Crucial Move:** Explicitly block the Evidentialist misreading here. Say: "We are stipulating that Priya's evidence does not change. We are not asking if she *should* get more evidence. We are asking if she *has* enough given the situation."
  *   Write "EVIDENCE HELD FIXED" in red on the board.
  *   Ask the room: "Sam needs to be sure. Priya is casual. When Sam says 'Priya knows,' is he telling the truth?"
  *   Take a vote. You will get a split. This shows the intuition is unstable, which motivates the need for a theory.

  **0:15–0:30: The Board Work (S vs. A)**
  *   Fill in the schema from Section 1.
  *   Identify Priya as **S** and Sam as **A**.
  *   Ask: "Whose situation should determine if the word 'knows' fits?"
  *   This is where you head off the **Relativism** misconception. Say: "This isn't about feelings. It's about which parameter functions like a setting on a machine. Is the setting on the Subject's side or the Ascriber's side?" Use the analogy of 'tall'. "Tall" depends on the comparison class. Is knowledge like 'tall'? (Yes, but rule-governed).

  **0:30–0:50: Mapping the Views**
  *   Now define the views using the Board.
  *   **Contextualism:** The bar is set by **A's** context. (Point to Sam).
  *   **Pragmatic Encroachment:** The bar is set by **S's** stakes. (Point to Priya).
  *   Run the verdict again.
      *   Contextualist in the room? "Sam's stakes are high, so 'knows' is false."
      *   Encroachment proponent? "Priya's stakes are low, so 'knows' is true."
  *   **Addressing the Heckle:** This is the moment to address your grad friend's claim. Say: "If S and A are the same person (like in the Bank Case), these views agree. That is why some say the dispute is verbal. But in *this* case, they disagree on the truth value. They are not the same theory."

  **0:50–1:05: The "Low Stakes" Worry and Action**
  *   Address the **Low Stakes Manufacturing** worry. A student will ask: "So if I don't care, I automatically know everything?"
  *   **Response:** "No. Low stakes lower the bar, they don't remove it. You still need evidence. Priya still looked at the gauge. If she hadn't looked, she wouldn't know, regardless of stakes."
  *   Address the **Action** worry (your instinct about Priya/Sam). Students will say, "But Sam shouldn't act!"
  *   **Response:** Distinguish *Knowledge* from *Reliance*. Encroachment says Priya *knows*, but Sam might still be irrational to *rely* on her because *his* stakes matter for *his* action. Keep the knowledge attribution separate from the action licensing to keep the theories distinct.

  **1:05–1:15: The Final Check**
  *   Do not ask for definitions. Ask for application.

  ### 4. Handling Misconceptions
  Here is where each misconception comes from and when to kill it:

  1.  **"So anything goes" (Vulgar Relativism):**
      *   *Source:* Hearing "context" and thinking "opinion."
      *   *Fix:* **0:15.** Use the "Tall" analogy immediately. "If I say 'John is tall' in a room of jockeys, it's true. In a room of NBA players, it's false. I'm not expressing a feeling; I'm indexing to a standard. Knowledge works the same way."
  2.  **"You just need more evidence" (Evidentialism):**
      *   *Source:* Confusing normative "ought" (you ought to check) with metaphysical "is" (you know).
      *   *Fix:* **0:00.** The "Evidence Held Fixed" stipulation. If a student raises this, point to the red text on the board. "We are imagining a world where checking is impossible. Does she know *now*?"
  3.  **"They are the same view" (The Heckle):**
      *   *Source:* Using cases where Subject = Ascriber.
      *   *Fix:* **0:30.** The Priya/Sam divergence. If they predict different truth values, they are not verbally equivalent.
  4.  **"Low stakes make knowledge too easy":**
      *   *Source:* Thinking stakes replace evidence.
      *   *Fix:* **0:50.** Reiterate that stakes adjust the *threshold*, not the *input*.

  ### 5. What to Sacrifice
  You are right about the **Semantic vs. Pragmatic** dispute (truth conditions vs. assertibility conditions).
  *   **The Sacrifice:** Do not explain *why* "knows" shifts (semantics) vs. why we just *say* it shifts (pragmatics).
  *   **The Line:** "For this session, we are treating both views as claiming the *truth conditions* change. Whether that's because the word 'knows' changes meaning or because knowledge itself changes is a fight for grad seminar. Today, we care about *whose* context drives the change."
  *   **Why:** If you open the semantic/pragmatic door, the "merely verbal" heckler wins, because they can claim one view is just about usage and the other about truth. Bracket it to keep the S vs. A distinction sharp.

  ### 6. The Final Question
  Do not ask them to build a case (too much cognitive load for the last 5 minutes). Ask them to identify the **locus of control**.

  **The Question:**
  > "Imagine a case where the Subject has low stakes, but the Ascriber is in a high-stakes courtroom. The Subject has decent evidence. The Ascriber says, 'The Subject knows.'
  > According to **Contextualism**, is that statement True or False?
  > According to **Pragmatic Encroachment**, is that statement True or False?"

  **Why this works:**
  *   It requires them to track S vs. A.
  *   It requires them to track which stakes matter for which view.
  *   It forces the divergence (EC = False, PE = True).
  *   If they get this right, they understand the distinction. If they get it wrong, they've collapsed the views.

  ### 7. Where This Plan Is Most Likely to Fail
  **The Failure Point:** **Cognitive Load on First-Years regarding S vs. A.**
  First-year students naturally read cases from their own perspective (the Ascriber). They will struggle to hold the perspective of Priya (Subject) while evaluating Sam's (Ascriber) sentence. They may default to "Well, *I* wouldn't say she knows," which defaults to Contextualism without realizing it.

  **What Would Change My Mind:**
  If you start the session and see blank stares when you introduce the Priya/Sam distinction, **abort the Priya/Sam case** and revert to the **Bank Case**, but modify it.
  *   *Modification:* Have Keith (Subject) talk to his Wife (Ascriber). Keith has high stakes. Wife has low stakes.
  *   *Question:* Wife says "Keith knows." True or False?
  *   *EC:* Depends on Wife's context (Low) -> True.
  *   *PE:* Depends on Keith's stakes (High) -> False.
  *   *Why:* It's easier to track two people talking to each other than a third-party observer scenario. If the Priya/Sam case feels too abstract, switch to the "Husband/Wife" variant of the Bank case. It preserves the S/A split but is more narrative-friendly for beginners.

  **Final Advice:**
  Watch the advanced students. If they start debating the semantic/pragmatic distinction, cut them off gently: "That's a meta-debate about *how* the shift happens. Right now we are mapping *where* the shift happens. Let's finish the map before we argue about the terrain." This keeps the session on track for the first-years while acknowledging the advanced students know there's more to it.
