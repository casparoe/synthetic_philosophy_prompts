answer: |-
  We often think admitting ignorance is humble, but she taught us that even claiming to know nothing requires a choice of how to measure the world.

  She showed us that how you carve up the unknown changes the answer, so pretending the math is neutral is just a way to hide your bias.

  Yet she never let this remain a puzzle of chalk and ink, because she knew this same hidden choice happens when we weigh evidence in courtrooms or hospitals.

  She refused to let us hide behind false neutrality when the stakes were human lives instead of abstract probabilities.

  So today we celebrate not just the brilliant mind we admire, but our dear friend who demanded we own our assumptions before we pretend to be fair.
