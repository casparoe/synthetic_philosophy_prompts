      *   *Brainstorming:* We need to explain the *judgment* of consciousness, the *intuition* of an explanatory gap, and the *report* of qualia, without necessarily committing to the existence of non-physical qualia (though some theories might).

  3.  **Drafting the Desiderata (The Spec):**
      *   *Requirement 1 (The Hardness Intuition):* Must explain why the gap *feels* real. Can't just say "you're wrong." Needs a mechanism for the intuition.
      *   *Requirement 2 (Phenomenal vs. Access):* Block (1995) distinction. P-Consciousness (experience) vs. A-Consciousness (reporting/using). A solution can't just say "reporting = experiencing." It needs to explain why we distinguish them.
      *   *Requirement 3 (First-Person Authority):* If I say "I'm in pain," I'm usually right. If a theory explains my report as a blind mechanical process, does it make me wrong about the pain? We need to preserve the *truth-aptness* or at least the *stability* of the report without invoking magic.
      *   *Requirement 4 (Functionalism/Computationalism):* Can code do it? Or does the explanation secretly rely on "and then magic happens"? Needs to be explicit about whether function suffices for the *judgment* of consciousness.

      *   *Non-negotiable vs. Camp Preferences:*
