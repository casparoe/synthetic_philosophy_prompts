  1. **Readings**

  1. **The Institutional Division:** Legislators exclusively define the utility function $U$, while markets maximize expected utility $E[U]$. This claims governance can be split into a value-setting phase and an optimization phase without feedback loops affecting the initial definition. It assumes the legislative body can freeze values in time while markets operate, preventing policy from reshaping the value structure itself, which is crucial for your zoning pilot to remain stable. (Institutional)

  2. **Epistemic Superiority:** Markets aggregate dispersed information about causal consequences more efficiently than voting bodies or bureaucratic experts. This asserts traders are fundamentally better forecasters of policy outcomes than voters or representatives due to financial incentives. It relies on the empirical claim that profit motives cure cognitive biases that plague democratic deliberation regarding cause and effect, ensuring the zoning choice is technically sound. (Empirical)

  3. **Conceptual Dualism:** Values are subjective preferences residing in agents, whereas beliefs are objective probabilities regarding external states of the world. This implies a clean ontological separation between what we want politically and how the world works causally. It suggests we can isolate the 'ought' from the 'is' without the measurement of the 'is' influencing the 'ought', allowing the market to remain value-neutral. (Conceptual)

  4. **Incentive Compatibility:** Financial stakes force truth-telling on probabilities, whereas voting incentivizes expressive signaling or ideological posturing. This suggests money reveals true beliefs about likelihoods better than ballots reveal true expectations about consequences. It posits that without skin in the game, actors will lie about their beliefs to signal virtue rather than predict accuracy, distorting the zoning outcome. (Decision-theoretic)

  5. **Metric Fixity:** The welfare measure is treated as an exogenous constant that policies cannot manipulate structurally or demographically. This assumes the metric remains stable and meaningful regardless of the policy chosen to optimize it over time. It denies the possibility of endogeneity where the policy changes the population or context being measured by the metric, which is your primary concern. (Institutional)

  6. **Judgment as Value:** Betting on future human judgment is betting on values because judgment inherently aggregates normative weights and factual assessments. This claims any human evaluation of outcomes includes value judgments, not just factual verification of metrics. It argues that removing hard numbers reintroduces the subjective values the market was supposed to bypass during the betting phase, blocking your panel proposal. (Conceptual)

  7. **Means-Ends Purism:** Policies are purely instrumental means, containing no intrinsic normative weight separate from their consequentialist outcomes. This asserts that choosing a policy is never a value judgment in itself, only a technical calculation of efficiency. It ignores symbolic politics or rights-based constraints that might make a policy desirable regardless of welfare metrics, limiting the scope of decision. (Normative)

  8. **Normative Closure:** If the market maximizes the metric, the resulting outcome is morally justified by definition of the system. This conflates optimization of a proxy metric with the realization of the actual public good or justice. It assumes that because the process was epistemically efficient, the output is necessarily normatively correct for the community, bypassing ethical review. (Normative)

  9. **Information vs. Evaluation:** Markets solve information asymmetry problems regarding causes, while voting solves preference aggregation problems regarding ends. This claims the two mechanisms address fundamentally different governance failures without overlapping domains. It suggests we can cleanly separate the problem of knowing what will happen from the problem of deciding what we want, validating the group's design. (Decision-theoretic)

  2. **Verdicts**

  1. **Substantive but Dubious:** Feedback loops between policy and values make clean institutional separation nearly impossible in practice.
  2. **Substantive and Defensible:** Evidence suggests prediction markets often outperform polls, though domain specificity matters significantly.
  3. **False:** Probabilities often depend on value-laden model specifications, blurring the ontological line between fact and preference.
  4. **Substantive and Defensible:** Properly designed markets do reduce expressive bias compared to anonymous voting in many contexts.
  5. **False:** Goodhart's Law ensures agents will game any fixed metric, especially endogenous ones like demographics or satisfaction.
  6. **Substantive but Dubious:** While judgment involves values, it also processes facts; excluding it removes valuable local knowledge.
  7. **False:** Policy choices often express symbolic values or rights independent of consequentialist outcomes or welfare metrics.
  8. **False:** Optimizing a flawed proxy can lead to morally catastrophic outcomes, not justification, regardless of efficiency.
  9. **Trivial:** This is essentially a restatement of the slogan without explaining how to separate the two in practice.

  3. **What my groupmate needed**

  To answer Objection (1), your groupmate needs Reading 5 (Metric Fixity) to be true. It isn't. If the zoning change alters the population measuring satisfaction, the metric is endogenous, and the market optimizes a moving target. The slogan slides from "markets estimate expected welfare as measured" to "markets estimate what's good." Unless the measure is perfect—which is the actual fight—the market is just efficiently optimizing a bug.

  To answer Objection (2), he needs Reading 6 (Judgment as Value) to be true. He argues betting on judgment smuggles values into betting. But if the panel studies outcomes, they are evaluating facts against fixed values. The slogan only forbids betting on *which* values to hold, not betting on *whether* values were met. Reading 7 (Means-Ends Purism) also fails here; selecting a measurement method is itself a policy choice with normative weight.

  Ultimately, nothing in the menu saves him. The slogan relies on a conceptual dualism (Reading 3) that doesn't exist in governance. Values and beliefs are entangled in the measure itself. He is relying on the slide between "markets beat votes at aggregating information" and "markets beat votes at anything governance-related." The market might be right about the measure, but wrong about the good.

  4. **Leftovers from the brainstorm**

  1. *Cognitive Division of Labor:* Dropped because it assumes politicians are ethicists and traders are statisticians, which is empirically unwarranted.
  2. *Dynamic Consistency:* Dropped because it focuses on speed of updates rather than the core values/beliefs distinction required here.
  3. *Revealed Preference:* Dropped because it conflates willingness to pay with moral worth, which begs the normative question entirely.
  4. *Goodhart's Law Immunity:* Dropped because it is demonstrably false in almost all social science contexts involving human agents.
  5. *Value Objectivity:* Dropped because it assumes values can be objective, contradicting the subjective premise of the slogan itself.

  5. **What I say at the next meeting**

  "I think we're treating the welfare measure like it's neutral ground, but it's actually the whole battlefield. If the market optimizes a metric that changes who gets to count, it's not solving the political problem; it's just automating the exclusion. We can use markets to forecast outcomes, but we can't outsource the definition of what counts as a good outcome to a formula. Let's keep the betting, but let's admit the measure is a political choice that needs democratic oversight, not just technical setup. Otherwise, we're just betting on how well we can game our own metrics."
