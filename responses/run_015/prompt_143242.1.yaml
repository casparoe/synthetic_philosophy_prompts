      *   *Claim:* Anticlimax argument (satisfied desire is empty).
      *   *Vulnerability:* Confuses *narrative interest* with *phenomenological value*. Just because it's boring to read doesn't mean it's bad to feel.
      *   *Claim:* Freedom from craving/suffering is the only good.
