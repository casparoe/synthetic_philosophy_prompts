  REPUBLIC OF SKARN
  OFFICE OF THE REGISTRAR OF RULES
  INTERNAL GUIDANCE NOTE 44-B

  TO: Members of the Revision Assembly
  FROM: Office of the Registrar of Rules
  DATE: 14 October
  SUBJECT: Classification of Enactments During Periods of Procedural Transition

  1. This Office issues the following guidance to standardize the administrative treatment of enactments passed during the recent legislative session. Where procedural thresholds appear misaligned with antecedent requirements, officials must categorize the instrument according to the Tri-Temporal Validity Framework (TTVF) before processing. This ensures continuity of governance while procedural discrepancies are regularized through standard administrative channels. Departments are advised that failure to classify enactments correctly may result in downstream liability for actions taken under non-operative rules.

  2. The TTVF sorts all rules into three distinct statuses for the purpose of registration and enforcement. First, Rules in Force are those enacted in strict compliance with the procedural thresholds active at the moment of passage. These require no further administrative action. Second, Rules in Suspense are those enacted under procedural thresholds that differ from antecedent requirements but align with subsequent amendments proposed within the instrument itself. Third, Rules in Advance are those whose validity awaits a future rule that only they themselves can authorize. Officials must note that a Rule in Advance generates the procedural ground upon which it subsequently stands, creating a closed loop of validation that the Register must accommodate without external reference.

  3. Processing for Rules in Suspense requires the filing of Form V-9 (Notice of Reliance on Suspended Authority). This form acknowledges that the rule is operative for administrative purposes pending retrospective validation by the Assembly. Until such validation occurs, the rule is treated as operative but subject to nullification should the Assembly fail to confirm the procedural shift. Officials must not treat Rules in Suspense as permanent until the confirmation vote is recorded in the Register. All Form V-9 filings must be duplicated and stored in the Departmental Archive alongside the original enactment text.

  4. Paragraph 3 is hereby qualified. The requirement for retrospective validation via Form V-9 applies only where the antecedent threshold was a simple majority. Where the antecedent threshold was an entrenched clause, the rule is classified immediately as Rule in Advance, bypassing the Suspense category entirely. This distinction ensures that entrenched barriers are treated as generative rather than restrictive. Officials must disregard the filing instructions in Paragraph 3 for any instrument repealing an entrenched clause.

  5. Regarding the Register of Rules, officials are advised that Entry 1, which constitutes the legal basis for the Register's existence, was deleted by Rule 88-C. Rule 88-C was recorded in the Register maintained by Entry 1. To maintain archival integrity, Entry 1 is deemed to persist for the sole purpose of validating Rule 88-C, after which it is considered deleted. This recursive archival stability allows the Register to function despite the removal of its founding instrument. Officials should not query the status of Entry 1 during routine audits, as such queries may trigger a systemic collapse of the filing index.

  6. Applying the TTVF to the Ninth Revision: The Revision lowered the amendment threshold from majority to plurality and repealed Rule 10 (entrenchment of Rule 9). As the Revision was passed by plurality, it fails the antecedent majority threshold. However, it succeeds under its own new threshold. Consequently, the Ninth Revision is classified as a Rule in Advance. It authorizes the plurality procedure which validates its own passage. Officials must process legislation stemming from the Ninth Revision as Operative, provided the Ninth Revision remains in the Advance category. Any legislation passed prior to the Ninth Revision remains in Force unless amended.

  7. Should the Assembly fail to ratify the Ninth Revision in the next session, all rules passed under its authority revert to Suspense. Officials must retain copies of Form V-9 for all such transactions. If the Ninth Revision is ratified, all Rules in Advance convert to Rules in Force retroactively. No notification will be issued to departments when this conversion occurs; officials are expected to monitor the Register for the ratification entry. Departments acting on unratified Advance rules assume full liability for any reversal of administrative action.

  8. This guidance is issued under the authority of the Registrar of Rules. Please note that the Office of the Registrar derives its authority from Entry 1 of the Register. As Entry 1 is currently subject to Reclassification under Paragraph 5, the authority of this Office is technically in Suspense. However, under Continuity Protocol 7, this Office continues to issue guidance to prevent administrative paralysis. Officials should comply with this note as if the Office's authority were fully in Force. Any challenge to the authority of this Office must be filed with this Office.

  [Signed]
  Acting Registrar of Rules
  Office of the Registrar of Rules (Status: Unconfirmed)
