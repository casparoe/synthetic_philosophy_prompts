      Dear Marcus,

      I have been reflecting on our recent discussion regarding the boundaries between early modern astronomy and natural philosophy, specifically concerning Johannes Kepler's reformed astrology as set out in his Harmonices Mundi of 1619. It is my contention that we should not dismiss this work as a mere leftover of superstition, but rather view it as a noble failure, the nature of which is best illuminated by a neo-Keplerian completion that Kepler himself could not have carried out. When we examine what Kepler actually did, we see a profound attempt to purify celestial influence of its arbitrary traditions. He abandoned the zodiac, the houses, and the entire apparatus of planetary dignities and horoscopic fortune-telling that characterized the Ptolemaic practice of his contemporaries. In their place, he retained and expanded the geometrical aspects into a system of thirteen, including the quintile of seventy-two degrees derived from the pentagon and the biquintile of one hundred and forty-four degrees from the pentagram. These angles have no place in traditional astrology, yet Kepler insisted upon them because they reflected the harmonies of regular polygons, suggesting a physical causality rooted in geometry rather than myth.

      To understand why this project ultimately fails, however, we must imagine a modern follower attempting to complete this system in Kepler's own spirit. Such a follower would add aspects for every regular polygon that is constructible with compass and straightedge, including the seventeen-gon, which yields an aspect of three hundred and sixty divided by seventeen degrees, or roughly twenty-one point one eight degrees. Kepler did not include this aspect, and the constructibility of the seventeen-gon was not proved until Gauss, long after Kepler's death, so Kepler had no way of knowing that this polygon, too, was constructible. If we introduce this neo-Keplerian completion, we succeed in making Kepler's project more rigorous by adhering strictly to his own geometrical criterion of constructibility. Yet, this very success exposes why the project was always empty. The choice of harmonious aspects was never forced by the phenomena, because for any set of aspects one can always find a post hoc consonance. The only thing the geometrical criterion really bought Kepler was a way of dignifying the accident of which polygons happen to be constructible, rather than identifying a genuine physical mechanism.

      I want to be clear that this critique does not diminish Kepler's intellectual courage. He was entirely right to reject the superstition of contemporaries who cast horoscopes from zodiac signs and planetary dignities, seeking instead a universal language of geometry. Furthermore, we must grant that his remark about the Earth singing a semitone, a rising and falling mi to fa, and about the syllables of that semitone suggesting misery and famine here at home, is a beautiful expression of his geometric Platonism. It captures a vision of the cosmos as an integrated whole where mathematical relationships resonate with human experience. But it should conclude that the beauty of the expression is exactly what misled him, because mistaking a mathematical metaphor for a causal influence is the error that no amount of constructible polygons can repair. The neo-Keplerian extension demonstrates that we can refine the mathematics indefinitely without ever bridging the gap between geometric elegance and physical causation, leaving us with a system that is logically consistent but ontologically vacant.

      Yours sincerely,

      Julian

