answer: |-
  This is a sharp, well-constructed argument, and your suspicion is philosophically healthy. You have stumbled upon a classic tension between **sociological explanation** (how moral change happens) and **normative justification** (why moral change is good).

  Your intuition in step (7) is correct: Abolition is not on par with powdered wigs. To save that intuition, you do not need to throw out Appiah or Williams. You need to reject the inference from **(3) to (4)**.

  Here is the breakdown of where the argument goes off the rails and how to fix it without sacrificing the insights of Appiah and Williams.

  ### 1. The Category Error: Mechanism vs. Truth
  The fatal flaw is in **Step (4)**. You are conflating the *causal mechanism* of moral compliance with the *truth conditions* of moral claims.

  *   **Step (3)** is a sociological claim: *How do norms sustain themselves?* Answer: Through social enforcement (shame, honor, cost). This is plausible. Even if slavery is objectively wrong, it won't end unless the social cost of practicing it becomes too high.
  *   **Step (4)** is a metaphysical claim: *What makes norms true?* Answer: Nothing; it's just price shifts. This does not follow.

  **Analogy:** Consider the law.
  *   (A) Laws are enforced by police and prisons (social cost).
  *   (B) Therefore, legal validity is just a function of police power, not a function of legislation or justice.
  *   (C) Therefore, there is no difference between a just law and a tyrant's decree; both are just "enforcement prices."

  Most legal philosophers would reject (B) and (C). The *enforcement* is distinct from the *validity*. Similarly, shame might be the *engine* of moral compliance, but it is not the *steering wheel*. The steering wheel is reason, argument, and moral discovery.

  ### 2. Rescue Appiah and Williams
  You are reading Appiah and Williams as moral skeptics, but they are not.

  *   **Appiah (*The Honor Code*):** Appiah does not argue that honor *replaces* moral truth. He argues that moral arguments alone are often inert. People know slavery is wrong (moral truth), but they keep doing it because their social identity requires it. Honor codes change the **psychological incentives** to align with the **moral truth**. The "embarrassment" is the tool that allows the moral truth to finally win.
  *   **Williams:** When Williams says norms become "unthinkable," he isn't saying they vanish arbitrarily. He is describing how our conceptual vocabulary evolves through historical experience and argument. Slavery became unthinkable *because* the arguments about human dignity successfully rewired our conceptual framework.

  ### 3. Reject the False Dichotomy in Step (5)
  Step (5) claims: *Slavery ended not because it was shown to violate human dignity, but because defending it got too expensive socially.*

  This is a false dichotomy. It should be:
  *   Slavery ended because arguments about human dignity **made** defending it socially expensive.

  The "shame-price" didn't rise in a vacuum. Abolitionists wrote pamphlets, staged revolts, and made moral arguments. These arguments shifted the "market value" of honor. If the shame-price shifted without reasons (like hemlines rising and falling), it would be fashion. Because the shame-price shifted *in response to reasons about suffering and agency*, it is progress.

  ### 4. Distinguishing Wigs from Slavery (Fixing Step 6)
  If you keep your revised view, you can distinguish Step (6) easily.

  *   **Powdered Wigs:** The "price" shifted due to aesthetics, utility, or arbitrary elite signaling. There was no moral argument that wigs were *unjust*.
  *   **Slavery:** The "price" shifted due to claims about harm, rights, and dignity.

  Both phenomena utilize the **mechanism** of social cost (shame-price), but they differ in the **etiology** of that cost.
  *   **Fashion:** Price shift $\rightarrow$ Behavior change.
  *   **Moral Progress:** Moral Reason $\rightarrow$ Price shift $\rightarrow$ Behavior change.

  ### Recommendation: Which Step to Reject?
  **Reject the "Just" in Step (4).**

  Rewrite Step (4) to read:
  > *(4 Revised)* So moral change *involves* a shift in shame-prices, mediated by our discovery of what is actually right or wrong.

  **Do you have to pay the price of arbitrariness if you keep (3)?**
  **No.** You can keep (3) as a descriptive claim about human psychology without accepting it as a normative claim about value.
  *   **Descriptive:** "Humans only stop doing bad things when it becomes shameful." (Keep this).
  *   **Normative:** "Things are only bad because they are shameful." (Reject this).

  ### Summary for Your Seminar
  Your argument is a powerful *reductio* of crude sociological reductionism. To fix it:
  1.  **Grant** that shame is the *engine* of compliance (Appiah/Williams are right about psychology).
  2.  **Deny** that shame is the *source* of value (Reject the move to nihilism).
  3.  **Argue** that moral progress occurs when moral reasons successfully manipulate the engine of shame.

  Abolition wasn't fashion because the "price" of slavery didn't go up because of a whim; it went up because people were convinced, through reason and empathy, that it *should*. The shame-price is the currency, but moral truth is the gold standard backing the currency.
