      *   **The Argument Structure:**
          1.  Appiah: Dueling ended due to embarrassment (honor turned against it), not argumentative victory.
          2.  Williams: Norms die by becoming unthinkable, not refuted.
          3.  *Inference:* Norm survival = function of social cost of violation ("shame-price").
          4.  *Inference:* Moral change = shift in shame-prices, not discovery of truth.
          5.  *Application:* Slavery ended because defending it got socially expensive, not because of human dignity.
          6.  *Implication:* Abolition $\approx$ Powdered Wigs (both just shame-price shifts).
          7.  *Intuition:* Abolition *was* genuinely progressive, not just fashion.
      *   **The Question:** Which step to reject? If keeping (3), does one have to accept moral progress is arbitrary?

  2.  **Evaluate the Steps:**
      *   **(1) & (2) Appiah/Williams:** These are plausible sociological/historical claims. Appiah specifically argues in *The Honor Code* that honor systems drive change. Williams talks about "thick ethical concepts" becoming unavailable. These are strong premises, widely accepted in this context.
      *   **(3) The "Shame-Price" Reduction:** This is the first suspicious leap. It reduces the *mechanism* of enforcement (shame/cost) to the *justification* or *nature* of the norm itself. Just because shame enforces it doesn't mean shame *constitutes* its moral value.
      *   **(4) The Anti-Realist/Expressivist Leap:** This claims that because the *mechanism* is social cost, there is no underlying truth ("discovery of what's actually right or wrong"). This conflates *epistemology/sociology of change* with *metaphysics of value*.
      *   **(5) The Application to Slavery:** This follows from (4). If (4) is false, (5) is too strong. It creates a false dichotomy: either it was dignity *or* it was social cost. It could be both (dignity arguments drove the social cost up).
      *   **(6) The Equivalence (Abolition $\approx$ Wigs):** This is the *reductio ad absurdum* that bothers the user. It follows from (4) and (5).
      *   **(7) The Intuition:** The user wants to preserve the idea of genuine progress.

  3.  **Identify the Weak Link:**
      *   Step (3) is the pivot point. It moves from "how norms are enforced/sustained" to "what norms *are*."
      *   Step (4) is the philosophical overreach. It infers anti-realism (no truth) from sociological mechanism (shame).
      *   *Diagnosis:* The argument confuses the *causal mechanism* of moral change with the *justification* for moral change.

  4.  **Formulate the Critique:**
      *   **Acknowledge the strength:** The Appiah/Williams premises are good. The worry is valid (the "Fashion Objection").
      *   **Target Step (3) and (4):** This is where the category error happens.
      *   **Distinguish Mechanism vs. Truth:** Just because shame *enforces* a norm doesn't mean the norm is *true* because of shame. Gravity makes things fall, but gravity doesn't determine *what* falls (mass does). Similarly, shame enforces norms, but reasons determine *which* norms get enforced.
      *   **Re-evaluate Step (5):** It sets up a false dichotomy. Abolitionists *used* arguments about dignity to *raise* the shame-price. The social cost didn't rise arbitrarily; it rose because people were convinced by reasons.
      *   **Address the "Fashion" worry:** Fashion changes without reasons (or for shallow reasons). Morality changes *with* reasons, even if the *engine* of compliance is social emotion (shame/honor).

  5.  **Drafting the Response (Iterative Process):**

      *   *Introduction:* Validate the user's suspicion. It *is* a slippery slope to moral nihilism/relativism.
      *   *Pinpoint the Error:* Step (3) is the culprit. It conflates *sustaining conditions* with *truth conditions*.
