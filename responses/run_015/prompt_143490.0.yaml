      *   *The "Shame-Price" Metaphor:* It's useful but incomplete. It explains *compliance*, not *correctness*.
      *   *Solution:* Reject the inference from (3) to (4). Keep the sociology, drop the anti-realism.
      *   *Alternative Model:* Moral progress = Better reasons $\rightarrow$ Shift in Sensibilities $\rightarrow$ Shift in Shame-Prices. The shame-price is the *vehicle*, not the *destination*.
