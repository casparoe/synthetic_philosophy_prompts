  So a P-Zombie and an Inverse Zombie walk into our study group lounge. For those who haven't had enough coffee yet, the P-Zombie is physically identical to us but has zero inner experience, and the Inverse Zombie is pure inner experience with zero physical body.

  They both want to present the conceivability argument against physicalism. The P-Zombie steps up first, clears its throat, and says, "Premise one: I am physically identical to a human but lack consciousness. Therefore, consciousness is non-physical."

  The professor stops him. "Hold on. To run this argument, you have to *conceive* of the premise. You're a zombie. There's nobody home to do the conceiving. You're just processing syntax."

  So the P-Zombie steps down, and the Inverse Zombie floats up—just a glowing blob of qualia. It projects thought, "Premise one: I am consciously identical to a human but lack physics. Therefore, physics is non-essential!"

  The professor sighs. "Okay, you can conceive, sure. But you have no vocal cords, no hands, and no brain to process the syllogism. You can't even write the paper, let alone publish it."

  So they decide to merge to make the argument work. The P-Zombie lends the body, the Inverse Zombie lends the mind. They combine, stand up, and look around the room.

  Then the new entity just says, "Actually, never mind. I'm just a grad student now, and I'm too worried about tuition to refute physicalism."

  ***

  **Why the hook works:** The joke targets the "first-person" requirement of the conceivability argument. A P-Zombie lacks the subjective interiority required to *conceive* anything, while a disembodied mind (Inverse Zombie) lacks the physical apparatus required to *articulate* the argument in a physical world. Together, they just make a normal physicalist human.
