  **Brainstorming: Connecting Determinism/Chaos to Institutional Ethics**

  1.  **The Epistemic Humility Argument:** If chaotic dynamics render long-term prediction impossible despite underlying determinism, binding institutional commitments are epistemically arrogant. Ethical governance requires aligning contractual obligations with epistemic limits; therefore, flexibility (adaptive planning) is a moral imperative to avoid locking the institution into unsustainable paths based on false precision.
  2.  **The Causal Leverage Argument (The Mathematician's View):** In chaotic systems, small variations in initial conditions amplify exponentially over time. This grants present decisions disproportionate causal weight. Ethically, this imposes a heightened duty of care on current actors. However, this cuts both ways: it could argue for binding safeguards to ensure positive amplification, or for retaining optionality to correct course if amplification turns negative.
  3.  **The Stability-as-Constraint Argument:** Institutions function as stabilizing forces within chaotic social environments. Even if physical predictions (enrollment, energy) fail, the *act* of commitment creates social coordination points. The ethical question is whether manufacturing stability through binding contracts is a virtuous anchoring mechanism or a deceptive illusion that masks vulnerability.

  ***

  **MEMORANDUM**

  **TO:** Committee on Long-Range Institutional Planning
  **FROM:** Committee Subcommittee on Philosophical Frameworks
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation Regarding Deterministic-Chaos Governance Model

  **Recommendation**

  The Subcommittee recommends option (c): Approve only a non-binding pilot with a hard sunset clause. We propose implementing the vendor's modeling framework on a pilot basis through the fiscal year 2026, with a mandatory full review by March 2027. We do not recommend entering into binding 10-year contracts at this time, nor do we recommend abandoning long-range planning entirely in favor of purely adaptive rolling plans.

  **Rationale**

  The core philosophical tension before this committee is not merely technical but normative: does the existence of deterministic chaos support institutional commitment or undermine it? The vendor's proposal rests on the claim that while campus dynamics are determined, they are unpredictable beyond 18 months. This distinction between ontological determinism and epistemic unpredictability is sound within chaos theory. However, translating this into governance requires careful ethical reasoning.

  **The Amplified Moral Weight Argument**

  We must engage seriously with the argument presented by our committee's mathematician: that determinism combined with chaos assigns outsized moral weight to present choices. If small budgetary shifts now amplify wildly downstream, then our current decisions carry a heavier causal burden than in a linear system. This view suggests we have a stronger duty to commit cautiously now to ensure the initial conditions are virtuous.

  While we accept the premise that chaotic sensitivity increases the stakes of current decision-making, we reject the conclusion that this mandates a binding 10-year framework. If the downstream effects are truly unforeseeable, as the vendor claims, then binding the institution to a specific 10-year trajectory removes the agency required to respond to negative amplification. High causal weight demands high responsiveness, not rigid lock-in. A binding contract assumes we can distinguish between positive and negative amplification in advance; the chaos model explicitly denies we can do this beyond 18 months. Therefore, the "moral duty to commit cautiously" is best served by retaining the optionality to intervene as effects amplify, rather than contractually surrendering that right.

  **The Strongest Counter-Consideration**

  The strongest argument against this recommendation comes from the faction viewing the 18-month prediction wall as an engineering failure rather than an ontological limit. Their position is that accepting unpredictability becomes a self-fulfilling prophecy. If we surrender long-range planning because of current modeling limits, we disincentivize the very investment in measurement and data infrastructure that might extend the prediction horizon. There is moral value in striving for stability; treating chaos as a hard limit may be an excuse for institutional laziness. We acknowledge this risk. A purely adaptive model could erode the trust necessary for infrastructure projects (like energy grids) that require decade-long horizons to finance.

  **Resolution**

  Our recommendation for a non-binding pilot resolves this tension. It allows us to test the vendor's claim without accepting it as dogma. If the "engineering failure" view is correct, the pilot period allows us to improve measurement and potentially extend the prediction horizon before committing to long-term contracts. If the chaos view is correct, the pilot protects the university from binding itself to unpredictable outcomes.

  Furthermore, a hard sunset clause respects the mathematician's insight on causal weight. It allows us to set careful initial conditions (the pilot) without foreclosing the ability to correct course if small shifts amplify negatively. It treats the 10-year horizon as a goal to be earned through demonstrated predictive reliability, rather than a contractual obligation based on claimed unpredictability.

  **Timeline and Implementation**

  1.  **Immediate Action:** Authorize the vendor to implement the modeling framework on a non-binding basis for scenario planning only.
  2.  **Pilot Duration:** The pilot shall run through the end of Fiscal Year 2026.
  3.  **Review Date:** A full committee review of predictive accuracy and institutional impact shall be completed by March 2027.
  4.  **Decision Point:** Following the March review, the Committee will vote on whether to extend the framework, renegotiate terms based on improved measurement, or abandon the model in favor of alternative planning structures.

  We cannot bind the future based on the claim that the future is unknowable. We must preserve the capacity to act when the amplification begins.

  **Conclusion**

  Approve the non-binding pilot with a hard sunset. This path honors the gravity of our current causal leverage while refusing to mistake epistemic limits for contractual terms.
