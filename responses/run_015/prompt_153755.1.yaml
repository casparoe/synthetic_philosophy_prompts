      *   *Objection 1 (The Heavy Hitter):* The B-Theorists/Physics folks. Special Relativity (SR) and the Block Universe. If explanatory priority is real, it implies a privileged "now". SR says no privileged "now".
          *   *Vocabulary:* Foliation, Lorentz invariance, spacetime intervals, covariant laws.
          *   *Damage:* High. This is the standard killer for A-theories.
          *   *Likelihood:* Certain from the B-theorists.

      *   *Objection 2 (The Specific Anxiety):* Causal Asymmetry. Is EP just Humean causation dressed up?
