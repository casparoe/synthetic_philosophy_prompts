answer: |-
  # Seminar Defence Prep Sheet: Explanatory Presentism
  **Candidate:** Final-Year Undergraduate
  **Context:** Advanced Metaphysics of Time Seminar
  **Audience Profile:** 2 B-Theorists (Phil-Phys), 1 Physicist, Several Agnostics/Sympathisers.

  ---

  ## Introduction & Strategy
  Your position is novel because it shifts the battleground from *ontology* (what exists) to *metaphysical structure* (what explains what). This is smart, but it leaves you vulnerable to charges of verbal trickery or incompatibility with physics.

  **Key Distinction to Maintain:** *Settled* vs. *Contested*.
  *   **Settled:** Special Relativity (SR) is empirically confirmed; Lorentz invariance is a feature of our best physical theories.
  *   **Contested:** Whether SR *entails* Eternalism (the Block Universe). There is no consensus here. Philosophers like Ludlow, Zimmerman, and Wüthrich debate this fiercely. Do not claim SR makes Presentism impossible; claim it makes *standard* Presentism difficult, which is why you offer *Explanatory* Presentism.

  **General Concession Strategy:** Do not fight physics. Concede that your view requires a metaphysical layer not visible to the physics. If you try to out-physics the physicists, you will lose.

  ---

  ## 1. The Relativity of Simultaneity Challenge
  **Source:** The Two B-Theorists (Philosophy of Physics)
  **Likelihood:** Certain
  **Damage Level:** Critical

  **The Objection (in their vocabulary):**
  "You posit an asymmetry of explanatory priority centred on 'the present'. But in Minkowski spacetime, 'the present' is frame-relative. There is no invariant foliation of spacetime into global simultaneity slices. If your explanatory priority is objective, it requires a privileged reference frame. Are you advocating a neo-Lorentzian view where the privileged frame is empirically undetectable? If so, you are violating the methodological principle that we should not posit surplus structure beyond the spacetime symmetries of our best theories."

  **The Two-Minute Reply:**
  "I concede that Explanatory Presentism is not naturally read off the formalism of Special Relativity. However, the inference from 'SR is true' to 'Eternalism is true' is not a logical deduction; it is a metaphysical interpretation. My claim is that the *explanatory* structure of reality need not map one-to-one onto the *coordinate* structure of spacetime.
  I am not denying Lorentz invariance in the equations. I am suggesting that metaphysical fundamentality is a distinct category from physical covariance. Just as a computer simulation might run on hardware that treats all pixels equally while the software privileges certain variables, reality might possess a metaphysical asymmetry that physical laws, being descriptive of regularities, do not capture. I am not positing a physically detectable ether, but a metaphysically privileged 'now' that grounds the truthmakers for temporal propositions."

  **Weakness/Soft Spot:**
  This sounds like "God of the gaps" metaphysics. If the physics doesn't see the privilege, why believe it exists? You risk positing 'spooky' metaphysical structure that does no work.

  **What to Concede Upfront:**
  Concede that your view is *not* the parsimonious reading of SR. Admit that if one demands metaphysical structure strictly mirror physical symmetries (as Maudlin might), your view fails. Frame it as a choice: "I am prioritising the phenomenology and logic of temporal explanation over a strict reading of spacetime structuralism."

  ---

  ## 2. The Causal Reduction Challenge (Your Specific Anxiety)
  **Source:** Metaphysically Agnostic/Sympathetic Participants (or sharp B-Theorists)
  **Likelihood:** High
  **Damage Level:** High (Undermines novelty)

  **The Objection (in their vocabulary):**
  "You distinguish explanatory priority from ontological existence. But isn't this just causal asymmetry by another name? In a B-theory, earlier states causally determine later states. If you say the present 'explains' the past, aren't you just describing the retrodiction of causal chains? If 'explanatory priority' collapses into 'causal priority', you haven't offered a new metaphysics of time; you've just redescribed the Block Universe's causal structure."

  **The Two-Minute Reply:**
  "This is the crux of the view, and I must distinguish *causal production* from *ontological grounding*. Causal asymmetry is horizontal: event A produces event B. My claim is vertical: the *reality* of the temporal series depends on the *actuality* of the present moment.
  In a standard B-theory, the past exists independently of the present. In Explanatory Presentism, the past is *derivative*. It is not that the present causes the past (which would be absurd), but that the past obtains its status *as past* only relative to a fundamental present. Causal asymmetry can exist in a static block; explanatory dependence cannot. If the present weren't fundamental, there would be nothing to ground the 'flow' or the asymmetry of explanation. I am claiming the direction of explanation is not reducible to the direction of causation."

  **Weakness/Soft Spot:**
  It is notoriously difficult to cash out 'grounding' without slipping into causal language. If pressed for examples of non-causal grounding in time, you may struggle.

  **What to Concede Upfront:**
  Concede that the distinction is subtle and that causal asymmetry is *evidence* for explanatory priority, but not identical to it. Say: "Causal asymmetry is the physical footprint of the deeper metaphysical asymmetry I am proposing."

  ---

  ## 3. The Empirical Idleness Challenge
  **Source:** The Physicist
  **Likelihood:** Certain
  **Damage Level:** Medium (Dismissive rather than refutative)

  **The Objection (in their vocabulary):**
  "This sounds like a category error. Physics deals with observables and invariants. If your 'explanatory priority' doesn't change the Lagrangian, doesn't affect the light cones, and isn't measurable, why should science care? It seems like you are debating the name on the map rather than the territory. Does this view generate any testable predictions or resolve any anomalies in cosmology?"

  **The Two-Minute Reply:**
  "I agree that my view does not alter the predictive machinery of physics. It is not a competing physical theory like GR versus Newtonian mechanics. It is an interpretation of what the physics *means* for our understanding of reality.
  Science tells us *how* the universe evolves; metaphysics asks *what* it is that is evolving. If we ignore the explanatory status of the present, we risk confusing our coordinate systems with reality itself. While this doesn't change the equations, it matters for how we conceptualise laws, initial conditions, and the arrow of time. It prevents us from reifying the future in a way that might constrain how we think about indeterminism in quantum mechanics."

  **Weakness/Soft Spot:**
  The physicist is right: if it doesn't change the maths, it might be 'idle'. You cannot claim scientific utility.

  **What to Concede Upfront:**
  Concede fully: "This view is empirically silent." Do not try to claim it helps quantum mechanics unless you are very sure. Frame it as conceptual clarification, not scientific progress.

  ---

  ## 4. The "Nuclear Option" (The Hidden Fear)
  **Source:** Any of the above (likely the B-Theorists)
  **Likelihood:** You hope low, but logically high.
  **Damage Level:** Fatal if mishandled.

  **The Objection:**
  "If past and future entities *exist* but are less fundamental, isn't this just the **Moving Spotlight Theory**? You have the ontology of Eternalism (past, present, future all exist) but you add a property of 'presentness' or 'fundamentality' that moves. If so, you haven't escaped the B-theory; you've just adopted a specific, problematic version of A-theory that still suffers from the relativity objections."

  **How to Handle If Raised:**
  *Do not panic.* This is the strongest objection, but you have a specific out.

  **The Reply:**
  "The Moving Spotlight Theory retains the *ontological parity* of the Block Universe—it says all times are equally real, just that one is 'lit up'. Explanatory Presentism denies ontological parity. It claims the past and future are *ontologically dependent* on the present.
  In the Spotlight view, if the present vanished, the past would still exist. In my view, if the present vanished, the past would have no ground. It is a difference between *privilege* (Spotlight) and *dependence* (Explanatory Presentism). However, I concede that structurally, the view sits very close to the Spotlight. The main divergence is that I treat 'existence' as a unified concept, but 'fundamentality' as graded. If you interpret 'existence' as 'fundamental existence', then I am a Presentist. If you interpret it as 'quantifier commitment', I am an Eternalist. My claim is that the debate has fixated on the quantifier, when the metaphysical action is in the fundamentality."

  **Weakness/Soft Spot:**
  Many metaphysicians argue that 'dependent existence' *just is* a form of existence, making you an Eternalist in disguise.

  **What to Concede Upfront:**
  Concede that the view is a hybrid. "I am willing to accept that Explanatory Presentism is a rapprochement between A and B theories. If that means I am a 'Grounding Eternalist', I can accept that label, provided we agree the explanatory asymmetry is real."

  ---

  ## Final Advice for the Room

  1.  **On Consensus:** When discussing SR, use phrases like "The standard interpretation suggests..." or "Orthodoxy holds..." rather than "SR proves...". Acknowledge that the compatibility of A-theories with SR is a *live debate* (cite Craig, Tooley, or Zimmerman if needed), not a settled matter.
  2.  **On Tone:** You are an undergraduate. You do not need to defeat the B-theory; you need to show your position is *coherent* and *worth discussing*. If you concede that your view requires a privileged frame that physics cannot detect, own it as a metaphysical cost you are willing to pay for preserving temporal passage.
  3.  **The "Get Out" Clause:** If cornered on the physics, retreat to the metaphysics. "I am offering a metaphysical account of time, not a physical one. If physics cannot capture explanatory priority, that is a limitation of the physical description, not necessarily of the metaphysics."

  Good luck. Keep your distinctions sharp, and do not be afraid to concede the empirical high ground to hold the metaphysical ground.
