      The chosen end-words (box, name, empty, same, drift, check) map the lifecycle of a private ostensive definition. "Box" and "name" establish the initial act of privatizing a sensation, while "same" and "check" represent the impossible demand for consistency over time. The sestina's rigid rotation mimics the diarist's attempt to fix meaning through repetition. However, just as the private linguist cannot verify if "pain" means the same today as yesterday, the end-words return in shifted contexts, destabilizing their own significance. When "empty" follows "check," it suggests the verification fails; when "drift" precedes "name," the label slips from the object. The form enacts the philosophical problem: the structure promises return and stability, but the semantic content reveals erosion. By the envoi, the words remain, but their connection to the world has dissolved, leaving only the "box" of syntax without the beetle of meaning. This mirrors Wittgenstein's claim that without public criteria, the distinction between being right and seeming right collapses.

