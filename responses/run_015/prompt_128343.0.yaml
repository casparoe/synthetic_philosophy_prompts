      *   **Conceptual Wrinkle:** "Epistemic Modesty Constraint" (dissenting reviewer): Treat the board's confidence as part of a reference class of "expert panels endorsing high-stakes inside-view forecasts" and apply base-rate correction to the board's own judgment.
      *   **Constraints:**
          *   Max 450 words.
