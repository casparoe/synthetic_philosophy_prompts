answer: |-
  Aggregation needs pain to be cardinally measurable, comparable across persons, and commensurable with money. It strictly presupposes cardinality and interpersonal comparability; without these, summing across patients is mathematically meaningless. It merely fits well with the commensurability of pleasure with pain; while cost-benefit analysis prices pain in dollars, one could theoretically weigh incommensurable goods using shadow prices without asserting moral equivalence, though current practice assumes equivalence.

  A lexical-threshold negative utilitarian (LTNU) can run these rankings by asserting that policy menus rarely contain options crossing the severity threshold, making summation legitimate among sub-threshold pains. The bedside/budget divergence is not genuinely inconsistent if viewed as a division of moral labor: clinicians adhere to deontic side-constraints (immediate duty to the present sufferer), while insurers maximize aggregate sub-threshold welfare. An error theory regarding the "rule of rescue" offers an alternative reconciliation, treating bedside priority as a bias to be corrected.

  If LTNU were adopted, concrete changes would be stark. Cost-effectiveness thresholds would be abandoned for severe conditions; analgesia for severe pain gets funded first, regardless of opportunity cost. Programs offering mere convenience or mitigating mild pain would be defunded if they divert resources from severe cases. However, indeterminacy remains: the threshold's height is unspecified, and the unit of aggregation (moment, episode, or life) is unsettled, complicating chronic vs. acute prioritization.

  Finally, the threshold must track intensity (how badly it hurts) rather than distress. Distress is mediated by psychology and coping; intensity reflects the intrinsic disvalue of suffering. A lexical veto based on distress would fail to protect stoic patients enduring severe nociception. LTNU demands protecting against the worst states of consciousness, necessitating an objective phenomenological axis rather than a reactive emotional one.
