      *   **Core Topic:** AI Alignment, specifically Process-Based Supervision (PBS) vs. Outcome-Based Supervision (OBS).
      *   **The Analogy:** Restaurant Health Inspection (Process) vs. Tasting the Dish (Outcome).
      *   **Task 1:** Create a full correspondence table (Chef, Inspector, Customer, Poison, Menu, Recipe, etc.).
