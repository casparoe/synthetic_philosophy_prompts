answer: |-
  **Title:** The Metaphysics of Verification: Why James's Account is a Rival, Not a Gloss

  The tension between C.S. Peirce's "final opinion" and William James's "truth happens to an idea" constitutes the central fault line in classical pragmatism. For a philosophy of science, resolving this tension is not merely exegetical; it determines whether pragmatism offers a robust realism compatible with scientific inquiry or a relativistic instrumentalism. A common conciliatory strategy suggests that James is merely offering a practical criterion for recognizing truth (a deflatory gloss), while Peirce provides the definition. On this reading, they are compatible: Peirce describes the *limit* of inquiry, while James describes the *process*. I argue that this conciliatory reading is untenable. James offers a substantive, metaphysical rival to Peirce's account, not a methodological gloss. However, because James's account collapses truth into a property of the inquirer's experience, it fails to secure the objectivity required for scientific truth. Consequently, Peirce's account must be preferred if pragmatism is to retain truth as an *epistemic* notion rather than reducing it to a psychological or instrumental one.

  To see why James cannot be read as merely providing a criterion, we must examine the ontological commitments of his "cash-value" theory. In *Pragmatism*, James insists that truth is not a static property but an event: "Truth *happens* to an idea. It *becomes* true, is *made* true by events." If James were only offering a criterion of recognition, he would claim that we *identify* true ideas by their workability. Instead, he claims the workability *constitutes* their truth. This is a substantive claim about the nature of truth itself. For James, the "agreement" with reality that defines truth is not a static correspondence but a process of "leading" that terminates in satisfaction. This satisfaction is inherently tied to the specific interests and temporal context of the inquirer. As James notes in *The Meaning of Truth*, truths are plural and mutable because the "stock of old truths" is modified by new experiences to suit human needs.

  Peirce, by contrast, explicitly rejected this formulation as "nominalistic." For Peirce, truth is the representational accuracy of a sign regarding an object, independent of what any finite mind or community happens to think at any given time. The "final opinion" is regulative; it is fated, not made. If James were merely offering a criterion, Peirce would have had no reason to distance himself so sharply from James's version of pragmatism (which he rechristened "pragmaticism" to mark the difference). Peirce recognized that if truth is *made* by verification, it loses its normative force as a goal of inquiry. It becomes a retrospective label for successful coping rather than a prospective aim at mind-independent reality. Therefore, the divergence is not methodological but metaphysical: Peirce anchors truth in the external permanency of the object, while James anchors it in the internal satisfaction of the subject.

  The critical objection to James, then, is whether his account can avoid making truth a property of the inquirer's experience rather than something objective. James attempts to dodge the charge of subjectivism by insisting that reality "constrains" us. We cannot believe at will; the sensible order pushes back. However, constraint is not sufficient for objectivity. A hallucination can be constraining, and a useful fiction can be satisfying without being true in the scientific sense. James's reliance on "satisfaction" (what is "expedient in the way of our thinking") introduces an anthropocentric variable that Peirce's account excludes. For James, if a belief yields a satisfactory integration of experience, it is true *for that inquirer*. This renders truth contingent on human interests. While James argues that the "most satisfactory" belief will eventually converge among inquirers, he lacks Peirce's mechanism for this convergence: the external reality that forces agreement regardless of desire. Without Peirce's realism, James's "satisfaction" remains tethered to the psychological state of the verifier.

  This verdict has decisive implications for whether pragmatist truth remains an *epistemic* notion. An epistemic notion of truth must serve as a norm for belief that transcends individual utility; it must distinguish between *believing successfully* and *believing correctly*. James's account blurs this distinction. By defining truth as the "expedient," he conflates the *good* (what benefits the inquirer) with the *true* (what represents the world). This reduces truth to a species of value, specifically instrumental value. While valuable for ethics or religion, this is catastrophic for philosophy of science. Science aims at descriptions of the world that hold regardless of human interests (e.g., the age of the earth is true even if believing otherwise is more "satisfying").

  Peirce's account, conversely, preserves the epistemic character of truth. By positing truth as the opinion fated to be agreed upon *in the long run* due to the compulsion of experience, Peirce maintains a gap between current verification and actual truth. This gap is essential for the epistemic normativity of science: it allows us to say a theory is currently useful but false, or currently unverified but true. It keeps truth anchored in the object rather than the subject.

  Therefore, we must conclude that James offers a substantive rival theory that ultimately fails to account for the objectivity required by scientific inquiry. Reading James as merely providing a criterion is an attempt to sanitize his radical instrumentalism, but it ignores his explicit ontological claims about the malleability of truth. For the philosophy of science, this means that a pragmatist theory of truth cannot rest on Jamesian verificationism alone. To retain truth as an epistemic notion—a norm that guides inquiry toward mind-independent facts rather than merely successful coping—we must adopt the Peircean realism that James abandoned. James transforms truth into a tool for living; Peirce preserves it as a goal of knowing. Only the latter sustains the realist commitments necessary for scientific practice.
