      *Revised Verdict:* James offers a substantive rival theory (truth as verification-process), not a gloss. However, this rival theory fails to secure objectivity. Therefore, Peirce's account is the only one that preserves truth as an epistemic notion rather than reducing it to a psychological state. This gives a clear direction for the paper.

