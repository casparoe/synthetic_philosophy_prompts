prompt: |-
  I'm a PhD student in philosophy of science and I've been trying to figure out how to frame a section on Peirce vs James for a paper on pragmatist truth. The bit that keeps bugging me is whether James's claim that truth happens to an idea is a real rival to Peirce's final-opinion account or just a deflatory gloss: true beliefs are the ones that work, so Peirce can say the same thing without making truth individual or temporary. I don't want a survey that ends on a both-sides note. Write an essay that weighs the main arguments for reading James as offering a substantive, cash-value theory of truth against the reading that he's only giving a practical criterion for recognizing truth, and then reach a conclusion and defend it. In particular, address whether James can avoid the objection that his account makes truth a property of an inquirer's experience rather than something objective, and what your verdict implies for whether pragmatist truth is still an epistemic notion.
