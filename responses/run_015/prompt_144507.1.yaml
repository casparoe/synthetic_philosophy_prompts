answer: |-
  Dear Selection Committee,

  I write to propose a six-month interdisciplinary project that sits at the intersection of moral philosophy and narrative theory, grounded in my current work as a novelist preparing a manuscript in which a protagonist faces a choice between a deeply held personal loyalty and an act that would maximize welfare for those she loves. In researching the philosophical dimensions of this dilemma, I have returned repeatedly to Bernard Williams's integrity objection to utilitarian reasoning, especially his observation that certain moral demands require a form of calculative reflection that introduces one thought too many into relationships that should be sustained by direct attachment rather than by justification. While Williams's critique is traditionally situated within ethical theory, my project seeks to investigate whether this objection identifies a corruption that is specific to utilitarian moral reasoning, or whether it reveals a more general structural flaw in any normative framework that demands transparent, calculative justification for commitments that are constitutive of identity. To test this hypothesis, I propose to examine whether this philosophical problem can be tested by constructing parallel cases in narrative fiction where an author's calculation of overall narrative utility threatens to violate a character's integrity. Existing philosophical treatments of Williams remain largely within moral philosophy and rarely investigate whether the integrity objection has analogues in aesthetic or dramatic domains, which leaves open whether the problem is genuinely about morality or about any system that subordinates constitutive attachments to external optimization. Meanwhile, literary discussions of character integrity rarely engage with the normative structure Williams describes, so neither field has settled whether there is a meaningful parallel.

  My method would be to reconstruct Williams's central argument in its strongest form, drawing primarily from his principal essays on integrity and moral luck, ensuring that the philosophical foundation is rigorous before attempting any interdisciplinary synthesis. Once this reconstruction is complete, I will develop a set of parallel narrative cases in which a character's loyalty or personal project is overridden by an authorial calculation of thematic coherence, plot resolution, or reader satisfaction. In these constructed cases, the author functions as the normative system, imposing demands upon the character that mirror the demands utilitarianism imposes upon the moral agent. The core of the analysis will involve determining whether the intuitive wrongness in these fictional cases tracks the same phenomenological feature Williams identifies in moral cases or differs in kind. If the resentment a reader feels when a character acts out of character for the sake of plot convenience is structurally identical to the resentment a moral agent feels when asked to betray a project for the sake of the greater good, then Williams's objection points toward a universal structural flaw in calculative frameworks rather than a specific critique of utilitarianism. If, however, the aesthetic violation feels distinct from the moral violation, perhaps because fictional characters lack the genuine autonomy of moral agents, then the integrity objection may remain confined to the moral domain.

  A useful result would be a clear demarcation criterion that distinguishes legitimate artistic manipulation of character from a kind of aesthetic utilitarianism that violates narrative integrity, together with an assessment of whether this criterion strengthens, weakens, or transforms Williams's original moral claim. Such a criterion would not only contribute to philosophical debates regarding the scope of integrity objections but would also provide practical guidance for my own novel's construction, ensuring that the protagonist's dilemma resolves in a way that respects the philosophical nuances of her choice. I am aware that failure would occur if the parallel between moral and narrative integrity collapses upon examination, or if the distinction proves too vague to guide either philosophical analysis or my novel's construction. To mitigate this risk and ensure the project is feasible within the six-month scope, I will limit the philosophical reconstruction to Williams's principal essays on integrity and moral luck, restrict the narrative analysis to three canonical dramatic structures rather than attempting an empirical study of audience response, and present the proposal entirely in continuous prose without headings, bullet points, bold text, or tables, writing as if in a single sustained letter. This limitation allows for depth rather than breadth, focusing on the structural analogy rather than empirical reception.

  The significance of this work lies in its potential to bridge the gap between abstract normative theory and the concrete practice of storytelling. By treating the author-character relationship as a analogue for the moral system-agent relationship, I hope to illuminate the costs of optimization in both domains. If Williams is right that integrity requires a refusal to step outside one's commitments to calculate their value, then the novelist who sacrifices character consistency for plot utility may be committing a category error similar to the utilitarian who sacrifices personal projects for aggregate welfare. Conversely, if the analogy holds, it may suggest that integrity is not a moral privilege but a structural necessity for any entity capable of having a point of view, whether human or fictional. This inquiry aligns perfectly with the fellowship's mission to support philosophical work conducted in dialogue with artistic practice, as it refuses to treat philosophy merely as a tool for explaining art, or art merely as an illustration of philosophy. Instead, it proposes that the practice of writing fiction can serve as a laboratory for testing philosophical claims about identity and commitment.

  I am eager to undertake this research within the supportive environment of your fellowship, where I can engage with scholars from both departments to refine these arguments. The outcome will be a substantial essay suitable for publication in an interdisciplinary journal, alongside a revised manuscript of my novel that embodies the insights gained from the inquiry. I believe that by rigorously examining the limits of calculation in both ethics and aesthetics, we can better understand the value of those attachments that define us against the demands of the system, whether that system is moral or narrative. Thank you for considering this proposal, and I look forward to the possibility of contributing to the intellectual life of your institution through this work.

  Sincerely,

  The Applicant
