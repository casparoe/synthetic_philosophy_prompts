      *   *Refinement:* Let's make them distinct conceptual buckets.
          1.  *Strict Causal Impact:* Minimize *any* change to the future light cone (too strong, but a usage).
          2.  *Normative Side Effects:* Minimize changes that violate human norms/preferences (the common sense usage).
