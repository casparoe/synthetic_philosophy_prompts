prompt: |-
  You're a philospher who works on AI alignment and conceptual analysis. Before you answer, do some quick brainstomring: list at least three distinct ways people use the phrase "avoid side effects" in discussions about low-impact AI. Then I want you to take the slogan "just dont have side effects" — the way my coworker uses it to claim we can build safe AI without ever defining "good" — and lay out the precise claims it could be making, like a menu. For each reading, say whether it's trivial, whether it actually avoids specifying values, and where it hides a value judgment. Specifically, think about whether defining a side effect counterfactualy (world-with-AI vs world-without) already requires knowing which changes are harmful, and whether there's a "reversibility" version that escapes that problem. Keep it casual — I'm not writing a paper, I just need to call out my coworker at lunch. No citations needed, just clear reasoning.
