answer: |-
  Alright, let's grab a sandwich and unpack this. Your coworker is trying to pull a fast one—classic "negative utilitarianism" move. They think they can define safety purely by subtraction (remove bad stuff) without addition (define good stuff).

  Here's the brainstorm on how "avoid side effects" actually gets used in the literature, followed by the menu of claims your coworker is implicitly making, and why none of them let them off the hook for defining values.

  ### Part 1: Three Ways People Use "Avoid Side Effects"

  1.  **Impact Regularization (The "Don't Move Much" View):**
      Here, a side effect is *any* change to the environment that isn't strictly necessary for the task. If the robot walks across the room to get coffee, but its footsteps vibrate the floor, that's a side effect. The goal is to minimize a distance metric between the actual world and a baseline world.
  2.  **Normative Violations (The "Don't Break Stuff" View):**
      This is the common-sense usage. A side effect is a change that violates human preferences or norms *incidentally*. If I ask for coffee and the robot knocks over a vase, the coffee is the effect; the broken vase is the side effect. This assumes we already know what humans care about (vases).
  3.  **Option Preservation (The "Don't Paint Yourself Into a Corner" View):**
      Here, a side effect is an irreversible change that reduces future flexibility. Shutting off a power grid is a side effect because you can't easily turn it back on. The focus is on keeping the "state space" reachable.

  ---

  ### Part 2: The Menu — What "Just Don't Have Side Effects" Could Mean

  Your coworker says: *"We don't need to define 'good.' We just need to tell the AI to achieve its goal without side effects."*

  Here are the three precise claims hidden in that slogan. Pick which one they're making, and here's why it fails to avoid value judgments.

  #### Option 1: The "Literal Difference" Claim
  **The Claim:** "A side effect is any change to the world that wouldn't have happened if the AI didn't exist. Just minimize the difference between World-With-AI and World-Without-AI."

  *   **Is it trivial?** No, it's impossible.
  *   **Does it avoid values?** No.
  *   **The Hidden Value Judgment:** To be useful, the AI *must* change the world. If I ask it to "cure cancer," the World-With-AI is massively different from the World-Without-AI (people live longer, resources shift, etc.). If you penalize *all* differences, the AI does nothing.
  *   **The Kicker:** To distinguish the "Goal Effect" (curing cancer) from the "Side Effect" (economic disruption), you have to define the Goal. You can't identify a "side" effect without a "main" effect. Defining the main effect *is* defining "good."

  #### Option 2: The "Counterfactual Harm" Claim
  **The Claim:** "Compare the AI world to the status quo. If the AI makes things worse than they would have been naturally, that's a side effect. If it makes them better, that's the goal."

  *   **Is it trivial?** No, it's coherent but circular.
  *   **Does it avoid values?** Definitely not.
  *   **The Hidden Value Judgment:** You are smuggling in a massive value judgment about the **baseline**. You're saying the "natural progression of events" is the neutral reference point. But what if the status quo is a pandemic? Then the AI *should* disrupt the baseline.
  *   **The Kicker:** To know if a deviation from the baseline is a "side effect" (bad) or an "improvement" (good), you need a metric for "better." That metric *is* the definition of "good" your coworker is trying to avoid. You can't measure "worse" without a value function.

  #### Option 3: The "Reversibility" Claim (The Escape Hatch?)
  **The Claim:** "We don't need to know what's good. We just tell the AI: 'Only do things you can undo.' If you can reverse it, it's not a dangerous side effect."

  *   **Is it trivial?** No, it's a popular research heuristic (like *relative reachability*).
  *   **Does it avoid values?** It tries to, but fails.
  *   **The Hidden Value Judgment:** This assumes **Flexibility** is the ultimate good. It values "keeping options open" over "achieving outcomes."
  *   **The Kicker:** Many good things are irreversible. Eating a meal, sending a comforting email, or curing a disease are irreversible. If the AI avoids all irreversible actions to avoid "side effects," it becomes useless. To decide *which* irreversible changes are allowed, you need to know which outcomes are valuable.

  ### The Lunch-Table Takedown

  Here's the argument you hit them with:

  "Look, the phrase 'side effect' is doing too much heavy lifting for you. It sounds neutral, like 'exhaust from a car,' but in AI safety, 'side effect' is shorthand for 'unintended change we dislike.'

  If you define it counterfactually (World-With vs. World-Without), you run into the **Main Effect Problem**. You can't separate the 'side' effects from the 'main' effects without knowing what the main goal is. And the main goal is a value statement.

  If you define it by **Reversibility**, you run into the **Progress Problem**. You're privileging the status quo and flexibility over actual outcomes. You're essentially saying 'it's better to do nothing than to risk a permanent change.' That *is* a value judgment. It's a conservative one.

  So, you haven't avoided defining 'good.' You've just hidden your definition of 'good' inside the definition of 'side effect.' You're saying 'good' is 'whatever looks like the world would have been without the AI,' or 'good' is 'whatever leaves the most doors open.' Both of those are controversial value claims, not technical loopholes."

  **Verdict:** Your coworker isn't solving the alignment problem; they're just outsourcing the value judgment to the baseline they chose. Tell them to pick their baseline explicitly.
