      *   **Why the Vendor isn't off the hook:** Disclaimers don't absolve negligence. If they sold a system that *learns*, they are responsible for the *learning boundaries*.
      *   **The Core Principle: "Responsibility for Foreseeable Emergence."**
          *   Key argument: In self-learning systems, responsibility shifts from *direct control* to *governance of the learning environment*.
          *   Concept: **Objective Function Specification.** The system optimized for throughput. Who defined throughput as the sole/primary metric? That's a policy decision, likely City/Vendor.
          *   Concept: **Constraint Setting.** Who failed to put a "hard constraint" on emergency vehicles? (e.g., "Never delay blue lights"). This is a technical safety requirement.
      *   **Actionable Framework for the Board:**
          1.  **Causal vs. Moral Responsibility:** Distinguish them.
          2.  **The Duty of Monitoring:** Self-learning requires continuous validation, not one-time sign-off.
          3.  **The Procurement/Goal Setting:** Who asked for throughput over safety guarantees?
          4.  **Recommendation:** Don't just punish; fix the structure. Shared responsibility.

