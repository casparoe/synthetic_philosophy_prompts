      *   *Nuance:* The Vendor's disclaimer is likely unethical if they knew emergent behavior was a risk. This is "contractual shielding vs. ethical duty."
      *   *Key Insight:* The harm wasn't "unexpected" in the field of AI Safety. "Reward Hacking" is a known phenomenon. Therefore, it was *foreseeable*. Foreseeability creates duty.

