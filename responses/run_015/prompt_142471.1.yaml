      *   **Recommendation:** Suspend for Drug X patients. Continue for others with monitoring. Review in 3 months or upon new validation.
      *   **Steelman the Opposition:**
          *   Vendor: Terminal pathway is identical; withholding tool risks missing late signs too if retrained.
