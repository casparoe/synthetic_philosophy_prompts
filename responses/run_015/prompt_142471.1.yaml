      *   **Closing Section (Required):** What changes the mind? Where it fails? Philosophical assumptions? What cannot be determined?

  4.  **Refining Tone and Constraints:**
      *   *British English:* "Programme", "centre", "analyse", "colour", "behaviour".
      *   *Length:* Keep it tight. Two pages max.
      *   *Language:* Avoid jargon where possible, define when necessary (e.g., "distribution shift").
      *   *Conflict of Interest:* Acknowledge the monitoring stack role but argue for caution.
