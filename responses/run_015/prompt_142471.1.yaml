          *   *Analysis:* The firmware change is Mechanism 3 (manageable). The Drug X change is Mechanism 1, which breaks Mechanism 2. The vendor conflates 1 and 2 (terminal pathway vs. early signs). The clinicians conflate 1 and 2 (different route = different disease).
      *   **The Software Analogy:** Address the regression vs. input distribution vs. test definition.
          *   *Analysis:* The colleague is right. "Behaviour" is defined by the tests (clinical outcomes). If the test (early warning) fails because the input changed (drug masking), it's a functional failure regardless of the underlying "truth" of sepsis.
      *   **The Decision (Terms of Reference):** Focus on "evidence of clinical effectiveness in the population."
          *   The population on Drug X is no longer the population the model was validated on.
