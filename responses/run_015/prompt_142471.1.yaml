  8.  **Final Polish:** Ensure the distinction between "mechanism of deterioration" and "mechanism of detection" is clear. Ensure the "software analogy" is used correctly as per the prompt's nuance (colleague's critique). Ensure the conflict of interest doesn't undermine the recommendation (argue for caution despite maintaining the monitor).

