      *   **Task:** Write a short written opinion/memo to circulate before the Thursday meeting.
      *   **Context:** Sepsis early-warning model running since 2022. Monitoring flags jumped from 0.4% to 7% on two surgical wards since March.
      *   **Changes:**
          1.  New bedside monitors (smoothing/clamping data). Vendor says: recalibrate.
          2.  New enhanced-recovery pathway with "Drug X" (attenuates fever/tachycardia). Clinical team says: different mechanism of deterioration, switch off model. Vendor says: same terminal pathway, recalibrate/retrain.
      *   **Evidence:** Small audit (40 cases) suggests sensitivity drop (70% -> 45%) in flagged subgroup, clustering in Drug X patients. Numbers weak.
      *   **Constraints:** Terms of reference require "evidence of clinical effectiveness in the population to which it is applied."
      *   **Specific Requirements:**
          1.  Actionable bottom line (continue unrestricted, restricted, or suspend) + timeframe + trigger.
          2.  Reasoning clear enough for disagreement.
          3.  Address the "three mechanisms" distinction (patient physiology, model statistics, data pipeline).
          4.  Address the software regression analogy (behavior vs. input distribution vs. test definition).
          5.  State what would settle the question vs. what cannot be settled (ontological vs. decision-theoretic).
          6.  British English.
          7.  No citations/references.
          8.  Define terms of art for lay members.
          9.  No ontological appeals without practical difference.
          10. Steelman the losing side.
          11. Closing section: What would change the recommendation, where reasoning might fail, philosophical assumptions, what to decide if rejected, what cannot be determined before Thursday.
          12. Max 2 pages.

  2.  **Determine the Recommendation:**
      *   *Option A (Unrestricted):* Too risky. Sensitivity dropped significantly (70% -> 45%) in a specific subgroup. Terms of reference require evidence of effectiveness.
      *   *Option B (Suspend):* Disruptive. Sepsis is deadly. Vendor argues terminal pathway is same.
      *   *Option C (Restricted/Conditional):* Best balance. Suspend for Drug X patients until validated, continue for others with enhanced monitoring.
      *   *Decision:* Suspend use for patients on Drug X immediately. Continue for others but under heightened monitoring. Set a review date (e.g., 3 months) or trigger (new validation data).
      *   *Reasoning:* The "population to which it is applied" has effectively changed for Drug X patients. The model's statistical signature no longer matches the physiological presentation due to the drug masking early signs. The monitor flags are indicating a distribution shift that correlates with reduced effectiveness.

  3.  **Drafting - Section by Section:**

