answer: |-
  Setup: Dark room, headphones, screen. Visual flash (t=0), auditory beep (t=150ms). Subjects report a unified "bloop" experienced at t=75ms.

  Orwellian: Consciousness is immediate. The brain experiences flash and beep separately. Upon beep arrival, memory systems retroactively revise the record, inserting a unified event at 75ms. The past is rewritten; the intermediate experience never occurred consciously but is remembered as such.

  Stalinesque: Consciousness is delayed. The brain waits for the beep, constructs the unified 75ms event pre-consciously, then releases it. The subject never consciously experiences raw inputs; the intermediate experience is fabricated before entering awareness.

  Structural Feature: The split hinges on the latency window allowing later inputs to alter earlier representations. If you remove the 150ms gap (simultaneity), the illusion collapses; no temporal interpolation is needed. This does not yield standard Color Phi, which requires spatial motion across an inter-stimulus interval. Removing the audio (visual ISI only) yields standard Color Phi, preserving the revision debate but losing cross-modal integration. The dispute remains whether content is fixed before or after entering conscious memory.
