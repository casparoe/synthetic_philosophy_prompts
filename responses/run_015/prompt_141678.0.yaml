prompt: |-
  Hey — longtime lurker, occasional commenter, currently four weeks into a reading group with three friends (one of whom actually has a bio degree, which has been humbling) where we're grinding through the biological function literature: the historical / selected-effects story versus the current-causal-role story, plus whatever the organizational-closure folks think they add. And I keep noticing that everyone scores these theories against a checklist nobody has ever written down, so I want the checklist first. Before we read another paper, write me the spec: what does an account of biological function have to do to count as adequate? Note that I'm deliberately fixing the purpose, because "best theory of function" feels underspecified to me in the same way "best decision theory" is until you say what the output is for: I want a notion of function that does the job working biologists need function-talk to do — licensing projection (I dissect three specimens, I want to say something about the next fifty), supporting explanations of why the trait is there at all, distinguishing genuine malfunction from mere variation, and being usable in the field on an organism whose selection history nobody has reconstructed.

  So: give me the desiderata, and for each one the case or consideration behind it, and mark which are non-negotiable versus which are really just a prejudice of one camp. Cases I want handled, some of which I made up myself so don't worry about whether they're actual documented biology: the retired workhorse (a trait was under selection for A for a million years, environment shifts, A now does nothing for fitness, and the trait's actual current causal contribution is B, which is fitness-neutral — does it still have a function, which one, and does function have something like a half-life?); the moonlighting protein (one thing does A, B and C, only A is why it's still around, but B is what kills the organism if you knock it out); the three-enzymes case (identical current causal profiles, but one came out of a few weeks of directed evolution in a lab, one was rationally designed by an engineer last Tuesday with no selection history whatsoever, and one arose by drift and has only just started being selected — if your theory assigns them different functions, is that a bug or the whole point); a structure co-opted wholesale from something that used to do A, now doing B, with A still chugging along as a byproduct; and a case where the benefit accrues to a different species, or to the holobiont, rather than to the bearer of the trait — flag that last one if you think it's an illegitimate demand rather than a datum. Two things I especially want: first, tell me which subset of the desiderata you suspect is jointly unsatisfiable (my hunch is that the projection license, fine-grainedness about selected-effect-versus-side-effect, and epistemic availability to a field biologist with a single specimen can't all hold at once, and if that's right, say so — that's the part I most want to see, since it would mean the list itself is the interesting result); second, tell me which single requirement does the most work in knocking out candidates. And be explicit about whether "must ground normative malfunction" is a genuine desideratum or something only the historical camp cares about.

  Then only briefly — a short paragraph each, no citations or reading list, I can't get to a library until March and I'll chase down names myself — how the historical family, the causal-role family, and the organizational family do against your list; if you're unsure who holds exactly which version, just describe the position instead of naming it. At the end, tell me how confident you are in the main claims, and single out the one point you're least sure about, so I know where the map is thin rather than getting a uniformly confident-sounding blob. American English please. And if one of my cases is confused or smuggles in the conclusion, say that too — I'd rather be corrected than agreed with.
