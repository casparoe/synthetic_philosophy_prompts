prompt: |-
  I'm the quantitative lead at a foundation making roughly thirty long-shot grants a year — global catastrophic risk mitigation, transformative research — where the payoffs come out of models with Pareto-like tails whose index is sometimes near or below 1, on the upside, the downside, or both. Our committee's practice is to ask for an expected value for each prospect and fund by that number; I've become convinced that in some cases the number is an artifact of how a simulation happened to sum its draws. I want a written procedure an analyst can run in about a day, without measure theory, and defend to lay trustees.

  Take as given the shape of the problem: a gamble whose nth outcome has probability 2^-n and payoff ±2^n/n has an expected value equal to the alternating harmonic series — ln 2 in the natural order, anything you like in another — and undefined in the strict sense, since the positive and negative parts each diverge.

  The procedure should first sort a prospect into defined, infinite-but-one-sided, or undefined, using tests an analyst can actually run (tail-index estimates; the diagnostic that a running mean does not settle down as the sample grows). It should then say what replaces the expected value in each case. Three distinctions matter to me especially: that repetition rescues a one-sided infinite expectation but does not rescue an undefined one, so "we'll do this many times over" is an escape in the first case and not the second; that two prospects sharing the same divergent tail can often be ranked by the expectation of their difference even when neither has an expectation of its own; and that any fallback valuation must assign a gamble and its mirror image opposite values, so the procedure cannot smuggle in an ordering of the terms. Where the procedure hands the decision to a person rather than a calculation, say so explicitly, and specify the sensitivity report that shows how far the answer moves across admissible truncations and orders.

  Apply it to three cases: a grant whose only heavy tail is a small chance of very large benefit; an intervention whose model puts a tail index near 0.9 on both benefit and harm; and our committee's flagship proposal, which currently shows a large positive expected value that I suspect is order-dependent — include that one even though it will be the hardest to present. Close with a short statement of what the procedure cannot do.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Deconstruct the Request:**

      *   **Role:** Quantitative Lead at a foundation.
      *   **Context:** ~30 long-shot grants/year (GCR, transformative research). Payoffs have Pareto-like tails (index $\alpha \approx 1$ or $<1$).
      *   **Problem:** Current practice uses Expected Value (EV). Suspect EV is unstable/artifactual due to simulation summation order (Riemann rearrangement theorem issues, undefined expectations).
      *   **Goal:** A written procedure for analysts (1-day runtime, no measure theory, defensible to lay trustees).
      *   **Key Requirements:**
          1.  Sort prospects into: Defined EV, Infinite (one-sided), Undefined (both sides diverge).
          2.  Tests must be practical (tail-index estimates, running mean diagnostics).
          3.  Specify replacement valuation for each case.
          4.  Address three specific distinctions:
              *   Repetition rescues one-sided infinite, not undefined.
              *   Rank divergent prospects by expectation of difference.
              *   Symmetry: Gamble vs. Mirror Image must have opposite values (no smuggling order).
          5.  Human decision points must be explicit, with sensitivity reports (truncation/order).
      *   **Applications:**
          1.  One-sided heavy tail (large benefit).
          2.  Two-sided heavy tail ($\alpha \approx 0.9$ on benefit & harm).
          3.  Flagship proposal (suspected order-dependent EV).
      *   **Closing:** Limitations of the procedure.

  2.  **Theoretical Grounding (Mental Check):**

      *   *Defined EV:* $\mathbb{E}[|X|] < \infty$. Law of Large Numbers (LLN) applies.
      *   *Infinite One-Sided:* $\mathbb{E}[X^+] = \infty, \mathbb{E}[X^-] < \infty$ (or vice versa). EV is $+\infty$ or $-\infty$. LLN fails in standard form, but sample mean diverges to $\infty$. Repetition helps (St. Petersburg paradox logic).
      *   *Undefined (Conditionally Convergent/Divergent):* $\mathbb{E}[X^+] = \infty$ and $\mathbb{E}[X^-] = \infty$. The integral $\int x dF$ is undefined. Sample mean does not converge. Riemann Rearrangement Theorem applies to the series representation.
      *   *Tail Index ($\alpha$):* If $P(|X|>x) \sim x^{-\alpha}$.
          *   $\alpha > 1$: Mean exists.
          *   $0 < \alpha \le 1$: Mean undefined or infinite.
          *   Specifically, if $\alpha < 1$, both positive and negative parts diverge if support is two-sided.
      *   *Ranking Undefined Variables:* Use stochastic dominance or compare $X - Y$. If $X-Y$ has a defined mean, we can rank them even if $X$ and $Y$ don't.
      *   *Symmetry:* $V(X) = -V(-X)$. This rules out arbitrary truncation levels unless applied symmetrically.

  3.  **Drafting the Procedure - Step-by-Step:**

      *   *Audience:* Analysts (quant savvy but need instructions) and Trustees (lay, need intuition).
      *   *Constraint:* No measure theory. Use simulations and plots.
      *   *Step 1: Diagnostics.* Need to estimate $\alpha$ and check running means.
          *   Tool: Hill Estimator or simple log-log rank-size plot.
          *   Tool: Cumulative Mean Plot (does it settle?).
      *   *Step 2: Classification.*
          *   Class A: $\alpha > 1$ (or running mean stabilizes). Use EV.
          *   Class B: One-sided divergence ($\alpha \le 1$ but only on upside). Use "Infinite EV" logic (fund if affordable).
          *   Class C: Two-sided divergence ($\alpha \le 1$ on both). EV is meaningless. Need fallback.
      *   *Step 3: Valuation Fallbacks.*
          *   For Class C: Compare to baseline or other projects ($X - Y$).
          *   If standalone: Truncated Mean (but must show sensitivity).
          *   Crucial Constraint: Symmetry. If we truncate, we must truncate probability mass or value symmetrically? No, the prompt says "assign a gamble and its mirror image opposite values." A simple median satisfies this. A truncated mean at the 99th percentile does *not* necessarily satisfy $V(X) = -V(-X)$ unless the truncation rule is symmetric (e.g., trim top and bottom 1%).
          *   Better Fallback for Class C: Median or Geometric Mean (Kelly criterion logic)? The prompt asks for "expectation of their difference." This implies we should try to find a *relative* value.
          *   Let's propose a "Robust Value" metric: The median of the simulation output, supplemented by a "Difference Test" against the status quo or a rival grant.
      *   *Step 4: Repetition Check.* Explicitly state if scaling up the grant changes the outcome (Class B: yes, Class C: no).
      *   *Step 5: Reporting.* Sensitivity to truncation and order.

  4.  **Refining the "Undefined" Valuation:**

      *   The prompt specifically mentions: "two prospects sharing the same divergent tail can often be ranked by the expectation of their difference."
      *   So, for Class C, the primary instruction is: *Do not value in isolation.* Value relative to a benchmark (e.g., "Do nothing" or "Grant B").
      *   If forced to value in isolation (standalone), use the Median. Why? Median satisfies $Median(X) = -Median(-X)$. It ignores the infinite tails. It's defensible to trustees ("50% chance we do better than this").
      *   Wait, the prompt asks for a procedure to *replace* EV.
      *   Let's structure the valuation hierarchy:
          1.  EV (if defined).
          2.  EV of Difference (if comparing two undefined prospects).
          3.  Median (if standalone undefined).
      *   Sensitivity Report: Show how EV changes as you increase simulation size (it shouldn't settle for Class C) and how it changes if you reorder draws (shuffle the seed).

  5.  **Addressing the Three Cases:**

      *   *Case 1 (One-sided tail):* $\alpha_{up} < 1, \alpha_{down} > 1$. Classification: Infinite One-Sided. Action: Fund if budget allows (EV = $+\infty$). Repetition works.
      *   *Case 2 (Two-sided $\alpha \approx 0.9$):* Classification: Undefined. Action: Do not use EV. Compare to rival grant ($X-Y$). If standalone, use Median. Repetition does *not* rescue.
      *   *Case 3 (Flagship):* Suspected order dependence. Run the "Shuffle Test." If EV swings wildly with seed/order, classify as Undefined. Report the range of possible EVs. Recommend Median or Difference vs. next best alternative.

  6.  **Writing the Document:**

      *   *Tone:* Professional, rigorous, accessible.
      *   *Structure:*
          1.  Purpose.
          2.  The Diagnostic Protocol (The "Day's Work").
          3.  Decision Rules (The "Valuation").
          4.  Application to Cases.
          5.  Limitations.
      *   *Key constraint check:* "Without measure theory." Avoid terms like "Lebesgue integral," "sigma-algebra." Use "simulation," "average," "tail slope."
      *   *Key constraint check:* "Symmetry." Ensure the fallback metric is odd ($f(-x) = -f(x)$). Median works. Truncated mean works *if* symmetric truncation (e.g., 1% to 99%).
      *   *Key constraint check:* "Repetition." Explicitly address the Law of Large Numbers applicability.

  7.  **Self-Correction/Refinement during drafting:**

      *   *Critique:* Is the Hill Estimator too technical?
      *   *Fix:* Describe it as "fitting a line to the top 10% of outcomes on a log-log chart."
      *   *Critique:* How to handle the "expectation of difference" practically?
      *   *Fix:* Instruct analysts to simulate $X$ and $Y$ with *coupled* randomness (same seeds for common uncertainties) to reduce noise in $X-Y$, then check if $X-Y$ has a stable mean.
      *   *Critique:* The prompt mentions the alternating harmonic series example.
      *   *Fix:* Use this intuition in the explanation of why order matters for the Flagship case.
      *   *Critique:* Trustees need to understand why we aren't just picking the biggest number.
      *   *Fix:* Emphasize "Robustness" over "Maximization."

  8.  **Final Polish:**

      *   Ensure the distinction between "Infinite" (one-sided) and "Undefined" (two-sided) is crystal clear.
      *   Make sure the "Sensitivity Report" requirements are specific (what plots to generate).
      *   Check the "Repetition" logic: One-sided infinite means average gain grows (or stays high) with repetition. Undefined means average gain wanders forever.
      *   Ensure the "Mirror Image" rule is respected in the fallback metrics.

  9.  *(Final Review against Prompt)*
      *   Procedure run in a day? Yes (simulation based).
      *   No measure theory? Yes.
      *   Defensible to lay trustees? Yes (focus on stability and risk).
      *   Sort defined/infinite/undefined? Yes.
      *   Replacement values? Yes (EV, Infinity, Median/Difference).
      *   Repetition distinction? Yes.
      *   Difference ranking? Yes.
      *   Mirror image symmetry? Yes.
      *   Human decision points? Yes.
      *   Three cases applied? Yes.
      *   Limitations statement? Yes.

      *Let's write it.*
answer: |-
  **MEMORANDUM**

  **TO:** Grant Committee and Board of Trustees
  **FROM:** Quantitative Lead
  **SUBJECT:** Procedure for Valuing Heavy-Tailed Prospects (Protocol H-1)
  **DATE:** October 26, 2023

  ### 1. Purpose
  Our current practice values grants by their Expected Value (EV). This works for normal risks. It fails for "long-shot" grants where a tiny probability drives the entire value. In these cases, the calculated EV may depend on the order in which a computer sums the possibilities, rather than the grant's actual merit.

  This procedure classifies prospects into three categories and assigns a valuation metric appropriate to each. It requires one day of analyst time and relies on simulation diagnostics, not abstract mathematics.

  ### 2. The Diagnostic Protocol (Analyst Instructions)
  *Run this simulation suite for every prospect where the top 1% of outcomes account for more than 50% of the total calculated value.*

  **Step A: The Running Mean Plot**
  1.  Generate $N = 100,000$ simulated outcomes for the grant's net impact.
  2.  Plot the *cumulative average* of these outcomes against the number of simulations ($1$ to $N$).
  3.  **Shuffle Test:** Randomly reorder the $N$ outcomes and re-plot the cumulative average. Repeat this shuffle five times.
      *   *Pass:* All lines converge to the same horizontal level.
      *   *Fail:* Lines wander, diverge, or settle at different levels depending on the shuffle.

  **Step B: The Tail Slope Estimate**
  1.  Separate positive outcomes (benefits) and negative outcomes (harms).
  2.  For each side, plot the log of the outcome size against the log of its rank (1 = largest).
  3.  Fit a straight line to the top 10% of points. The slope of this line is $-\alpha$ (the tail index).
      *   $\alpha > 1$: The tail is "thin" enough for a stable mean.
      *   $\alpha \le 1$: The tail is "heavy." The mean is unstable or infinite.

  **Step C: Classification**
  Based on Steps A and B, assign the prospect to one of three classes:
  *   **Class I (Defined):** $\alpha > 1$ on both sides; Running Mean converges.
  *   **Class II (Infinite One-Sided):** $\alpha \le 1$ on one side only (e.g., unlimited upside, capped downside); Running Mean diverges to $+\infty$ or $-\infty$ consistently.
  *   **Class III (Undefined):** $\alpha \le 1$ on *both* sides; Running Mean does not settle and shifts with the Shuffle Test.

  ### 3. Valuation and Decision Rules

  **For Class I (Defined):**
  *   **Metric:** Standard Expected Value.
  *   **Repetition:** Valid. Doing this grant 100 times yields 100 times the EV.
  *   **Decision:** Fund if EV > Cost.

  **For Class II (Infinite One-Sided):**
  *   **Metric:** Report as "Positive Infinite Expectation" (or Negative).
  *   **Repetition:** Valid. While a single grant is volatile, a portfolio of these grants will grow without bound over time.
  *   **Decision:** Fund if the downside is affordable. The "price" is the maximum possible loss, not the EV.
  *   **Trustee Note:** This is the mathematical justification for "moonshots." We accept frequent small losses for a guarantee that the average return grows over many tries.

  **For Class III (Undefined):**
  *   **Metric:** **Do not use Expected Value.** The EV is an artifact of simulation order.
  *   **Primary Valuation (Relative):** Compare the grant ($X$) to the next best alternative ($Y$). Simulate the *difference* ($D = X - Y$).
      *   If $D$ falls into Class I or II, rank based on $E[D]$.
      *   *Logic:* Two gambles may have no defined value individually, but one may be strictly better than the other.
  *   **Secondary Valuation (Standalone):** If no alternative exists, use the **Median** outcome.
      *   *Symmetry Rule:* The Median satisfies the requirement that a gamble and its mirror image have opposite values ($Median(X) = -Median(-X)$).
  *   **Repetition:** **Invalid.** Doing an undefined gamble many times does not converge to a stable average. The cumulative result will wander indefinitely.
  *   **Decision:** Human judgment required. The analyst must submit the **Sensitivity Report** (see below).

  ### 4. Required Sensitivity Report (For Class III)
  When a prospect is Class III, the analyst must submit a report containing:
  1.  **Truncation Range:** The value of the grant if we ignore the top and bottom 1%, 5%, and 10% of outcomes. (This must be done symmetrically to preserve the mirror-image rule).
  2.  **Order Sensitivity:** The range of EVs produced by the five Shuffle Tests in Step A.
  3.  **Recommendation:** A explicit statement: *"Calculation cannot resolve this choice. Decision rests on risk tolerance regarding the [X]% of tail outcomes."*

  ---

  ### 5. Application to Current Pipeline

  **Case 1: The "Bio-Shield" Grant (One-Sided Tail)**
  *   **Profile:** Model shows capped cost (grant size) but $\alpha \approx 0.8$ on the benefit side (pandemic prevention).
  *   **Classification:** Class II (Infinite One-Sided).
  *   **Valuation:** Positive Infinite Expectation.
  *   **Repetition:** Rescue applies. A portfolio of bio-shields guarantees long-term value growth.
  *   **Recommendation:** **Fund.** The EV is technically infinite. The constraint is cash flow, not value.

  **Case 2: The "Geo-Engineering" Intervention (Two-Sided Tail)**
  *   **Profile:** Model shows $\alpha \approx 0.9$ on both benefit (cooling) and harm (monsoon disruption).
  *   **Classification:** Class III (Undefined).
  *   **Valuation:** EV is meaningless.
      *   *Relative Test:* Compare to "Adaptation Grant." The difference ($Geo - Adapt$) has a stable mean because the tail risks are correlated (both depend on climate sensitivity).
      *   *Standalone:* Median outcome is slightly negative.
  *   **Repetition:** No rescue. Repeating this intervention does not average out the risk; it compounds the chance of a catastrophic tail event.
  *   **Recommendation:** **Defer.** Unless the Relative Test shows a strong positive advantage over Adaptation, the undefined tail risk is too high.

  **Case 3: The Flagship Proposal (Suspected Order Dependence)**
  *   **Profile:** Current model shows large positive EV. However, the Running Mean Plot drifts upward without settling, and the Shuffle Test yields EVs ranging from $-50M$ to $+200M$.
  *   **Classification:** Class III (Undefined). The current positive EV is an artifact of the random seed ordering the large draws early.
  *   **Valuation:**
      *   *Symmetry Check:* If we invert the model (benefits become harms), the EV does not simply flip sign; it changes magnitude. This violates the mirror-image rule.
      *   *Fallback:* The 5% Truncated Mean is $+5M$. The Median is $-1M$.
  *   **Recommendation:** **Human Decision Required.**
      *   *Analyst Note:* "The model claims this grant creates value, but the value resides entirely in the top 0.5% of simulations. If we truncate the top 1%, the value vanishes. We are betting on a specific ordering of universe-states that we cannot justify."
      *   *Trustee Action:* You are not approving an EV of $+100M$. You are approving a 5% chance of $+1B$ against a 10% chance of $-500M$, with no long-run average.

  ---

  ### 6. Limitations of This Procedure

  This protocol cannot tell you whether a Class III gamble is "worth it." It removes the false precision of Expected Value, forcing the Committee to acknowledge that they are making a moral or strategic choice, not a mathematical one.

  Furthermore, the "Expectation of Difference" workaround requires that the two prospects share common sources of uncertainty. If two undefined gambles are driven by entirely independent black swans, their difference may also be undefined. In that event, the procedure defaults to the Median, which ignores the tail entirely. This is conservative, but it may undervalue transformative research where the tail *is* the point.

  Finally, this procedure assumes the simulation model correctly captures the tail shape. If the model underestimates the probability of extreme events (a common failure), a Class I grant may actually be Class III. Analysts must apply a "skeptic's discount" to tail index estimates where data is sparse.

  **Approval:**
  _____________________ (Chair, Investment Committee)
  _____________________ (Executive Director)
