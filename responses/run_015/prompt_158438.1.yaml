      Then you have to layer on the complications you brought up from your coffee shop brainstorming, like the borrowed museum clay scenario, which introduces the idea that objects might have histories or obligations attached to them that are not visible just by looking at their shape. A robust theory needs to handle these modal properties, meaning the properties about what could happen or what must happen, like the contractual requirement to return the clay as a lump. If the clay is contractually bound to be returned as a blob, does the statue inherit that obligation? If the theory says the statue and clay are identical, then destroying the statue to return the clay might be fine, but if they are distinct, you might be destroying property that belongs to the museum while thinking you are just reshaping your own art. The theory has to tell us whether these historical constraints attach to the material stuff itself or to the specific form it takes, and it has to do so without making the world seem magically sensitive to legal contracts in a way that changes physical reality.

