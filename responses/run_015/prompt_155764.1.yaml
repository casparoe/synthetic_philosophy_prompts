      *   **Requirement:** Do not sit on the fence. Give a bottom line and a rule to vote on.

  2.  **Determine the Recommendation:**
      *   *Option A: Premise-Based Voting (PBV).* Vote on C1 and C2 separately. If both pass, approve.
          *   *Pros:* Aligns with regulation logic. IG review easier (reasons match vote).
          *   *Cons:* Ignores the Community Rep's valid concern (unstated condition). Empowers experts too much (2 members decide a premise). Vulnerable to strategic voting (Bioethicist). In this specific case, it would force approval (4-3 on both premises) despite a majority wanting rejection.
      *   *Option B: Conclusion-Based Voting (CBV).* Vote on the application as a whole.
          *   *Pros:* Allows members to weigh all factors (including Community Rep's concern). Respects the majority will on the outcome. Mitigates strategic voting on premises (since premises aren't binding votes).
