  MEMORANDUM FOR THE DUAL-USE RESEARCH REVIEW BOARD
  FROM: Chair
  DATE: October 24, 2023
  SUBJECT: Decision Procedure and Disposition of Application [ID-2023-X]

  **Recommendation**

  I recommend that the Board formally adopt **conclusion-based voting** as its standing aggregation rule. Under this procedure, we vote only on the final application; premise votes on regulatory conditions are recorded for internal reference but do not bind the outcome. Accordingly, I move that we **reject** the current application, reflecting the majority vote on the conclusion. We should decline the subcommittee's proposal for a deferred decision rule.

  **Reasoning**

  Our regulation states that a project may proceed *only if* Conditions 1 (necessity) and 2 (containment) are satisfied. This sets a necessary floor for approval, not a mechanical algorithm that strips the Board of discretion. Satisfying both conditions permits approval; it does not mandate it. The Board retains authority to weigh all relevant factors—including community impact and ethical considerations—within the final up-or-down vote.

  Adopting conclusion-based voting resolves the four complications currently dividing us. First, regarding the Inspector General (IG): The IG reviews whether reasons support the *decision*. If we reject an application, the IG does not require us to prove the conditions failed, only that the rejection was reasoned. A conclusion-based vote allows us to state that while technical conditions garnered majority support, the Board's collective judgment determined the overall risk profile remained unacceptable. This survives audit without requiring us to falsify premise records.

  Second, regarding expertise: Premise-based voting effectively grants veto power to the two technical experts on each condition. If a single expert persuades one generalist to vote "no" on a premise, the project dies regardless of the broader Board's view. Conclusion-based voting ensures that technical assessments are weighed alongside safety, ethical, and community perspectives, preventing technical silos from dominating policy outcomes.

  Third, regarding the Community Representative: Her mandate includes concerns outside the regulation's two conditions. Conclusion-based voting allows her to vote "no" on the application based on community consultation needs without forcing her to distort her technical assessment of Conditions 1 and 2. It preserves the integrity of her vote.

  Fourth, regarding strategic voting: The bioethicist has indicated she will vote strategically on premises if they become binding. By making premises non-binding, we remove the incentive for insincere voting. Members are free to deliberate openly on the conditions while knowing the final decision rests on their holistic judgment.

  Finally, the subcommittee's proposal introduces unacceptable friction. A twelve-month deferral for inconsistent votes conflicts with the 60-day statutory clock and creates uncertainty for applicants. It transforms a decision rule into a delay tactic. We need a procedure that supports timely, decisive governance for future applications reviewed in forty-minute windows.

  **The Case for Premise-Based Voting**

  Defenders of premise-based voting argue that it ensures strict regulatory fidelity. By voting on each condition separately, the Board guarantees that no project proceeds unless a majority explicitly certifies compliance with each statutory requirement. This prevents members from rejecting safe, necessary research based on extraneous personal preferences or political pressures unrelated to the regulation's specific safety and necessity criteria. It forces clarity: if a project fails, we know exactly which condition it failed to meet.

  **Annex: Proposed Statement of Reasons**

  The Board declined to approve the proposed project. While a majority of members individually found that the applicant satisfied the regulatory conditions regarding necessity and containment, the Board's collective judgment determined that the overall risk profile remained unacceptable. The regulation permits approval only if conditions are met; it does not compel approval when met. In exercising its discretion, the Board weighed the technical assessments against broader public interest factors, including community impact and ethical considerations. Consequently, the Board determined that the project should not proceed at this time. The applicant is invited to address these broader concerns and submit a revised protocol.
