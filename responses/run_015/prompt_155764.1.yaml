          *   Four Complications:
              1.  Inspector General (IG) review focuses on published reasons matching conditions.
              2.  Lopsided expertise (2 experts per condition, 3 generalists). Premise-based voting gives experts veto power.
              3.  Community Rep votes "No" on application due to an unstated third condition (community consultation), not C1/C2.
