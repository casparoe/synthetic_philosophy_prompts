prompt: |-
  I write historical fiction, and I am stuck on a scene. My narrator, a Nyāya-trained court pandit, must persuade a visiting Buddhist interlocutor — and through him my reader, who has never met the word pramāṇa — that knowledge by comparison (upamāna: coming to know an unfamiliar thing through its resemblance to something already familiar) is a knowledge-source in its own right, not perception, inference, or testimony in disguise. His opponent grants perception, inference and testimony but denies that comparison is a fourth. Do not write the scene and do not explain the doctrine to me; give me a plan for how the explanation should run in about a page and a half of dialogue, for an intelligent reader with no Sanskrit and no philosophy.

  I need the dependency structure: what must be established before the claim can even be stated, beginning, I assume, with what a pramāṇa is meant to be — a reliable route to a piece of new, correct cognition rather than a manner of reasoning. A complication I have written in: earlier in the argument the pandit concedes that recollection is not a pramāṇa, since genuine knowledge must present something new, so he cannot lean on the fact that he remembered the cow. Where does that concession bite, and how does he route around it?

  One case should carry the whole thing. My provisional version: a forester's description of a gavaya, a wild ox-like animal, as cow-like; a sighting years later with no speaker present; the animal half-hidden in brush, so that the resemblance is only partly seen. What must such a case have and lack for the work to fall on comparison alone, and is my version or the plainer classical one the better example?

  Three misconceptions I expect: that upamāna is just analogy in the loose Western sense; that it collapses into inference from resemblance; and that what it yields is merely a word's meaning rather than knowledge about the animal standing in front of him. In what order will these actually arise, and where in the sequence should each be headed off?

  Finally, what could the reader do at the close that would show the idea had landed, and what — the theory of pervasion, the five-membered syllogism, the full Sanskrit inventory — should the pandit openly decline to enter into?
reasoning: |-
  Here's a thinking process that leads to the suggested plan:

  1.  **Analyze the Request:**
      *   **Genre:** Historical Fiction (Dialogue scene).
      *   **Characters:** Nyāya-trained Court Pandit (Proponent) vs. Visiting Buddhist Interlocutor (Opponent).
      *   **Goal:** Persuade the interlocutor (and the reader) that *upamāna* (knowledge by comparison) is a distinct *pramāṇa* (knowledge source), separate from perception (*pratyakṣa*), inference (*anumāna*), or testimony (*śabda*).
      *   **Constraints:** Do not write the scene. Do not explain the doctrine directly to me (the user). Give a *plan* for the explanation (approx. 1.5 pages of dialogue equivalent).
      *   **Target Audience:** Intelligent reader, no Sanskrit, no philosophy background.
      *   **Specific Requirements:**
          *   Establish dependency structure (what comes before what).
          *   Address the "recollection concession" (knowledge must be new; memory isn't a *pramāṇa*).
          *   Evaluate/Select the case study (Forester/Gavaya vs. Cow).
          *   Address three misconceptions (Analogy, Inference, Word-Meaning).
          *   Define the "landing" moment (reader action/realization).
          *   Define what to exclude (technical baggage).

  2.  **Deconstruct the Philosophical Problem (Nyāya *Upamāna*):**
      *   *Pramāṇa:* A valid means of knowing. Must yield *novel* cognition (*anadhigata*).
      *   *Upamāna:* Knowing X because it resembles Y, where Y is known, but the connection ("X is like Y") is established via a specific process distinct from just seeing or deducing.
      *   *The Buddhist Objection:* It's just inference (A looks like B, B is a cow, therefore A is a cow-like thing) or testimony (The forester told me).
      *   *The Memory Trap:* If I remember the cow, isn't that just memory (*smṛti*)? Nyāya says memory isn't a *pramāṇa* because it's not new. The cognition "This animal is the one resembling the cow" must be *new* in the moment of sighting.

  3.  **Drafting the Plan - Section by Section:**

      *   **Phase 1: Grounding *Pramāṇa* (The Setup)**
          *   Need to define the stakes. What counts as "knowing"?
          *   Must establish the "Novelty Condition" early (ties into the memory concession).
          *   *Dependency:* Before arguing for *upamāna*, they must agree on what a *pramāṇa* does (produces *new* valid knowledge).
          *   *Addressing the Concession:* The Pandit already conceded memory isn't a *pramāṇa*. This needs to be used to sharpen the definition of the *moment* of recognition. It's not recalling the cow; it's linking the *name* to the *object* via resemblance for the *first time* in this context.

      *   **Phase 2: The Case Study (The Gavaya)**
          *   *User's Version:* Forester description -> Years later -> Half-hidden animal.
          *   *Analysis:* The "years later" gap risks making it look like memory. The "half-hidden" aspect is good (limits perception). The "Forester" aspect introduces testimony.
          *   *Refinement:* To isolate *upamāna*, we need to minimize testimony (the name must be known, but the *connection* is the key) and perception (cannot see the whole thing clearly).
          *   *Decision:* Stick close to the classical Gavaya but tighten the timeline. The crucial moment is the *identification*, not the description. The Forester gives the name and the similarity ("Like a cow"). The Pandit sees the animal. The cognition is "This is the thing called Gavaya."
          *   *Why:* It separates the *word* (from testimony) from the *object* (from perception) and bridges them with *resemblance* (the unique work of upamāna).

      *   **Phase 3: Tackling Misconceptions (The Order of Operations)**
          *   *Misconception 1: Word Meaning.* (Is this just learning a definition?) -> Address first. If it's just linguistics, it's testimony. It must be about *identifying an object in the wild*.
          *   *Misconception 2: Inference.* (Is this just deduction?) -> Address second. Inference requires a universal rule ("All cow-like things are Gavyas"). We don't have that. We have similarity.
          *   *Misconception 3: Loose Analogy.* (Is this just poetic comparison?) -> Address last/implicitly. It's not "brave as a lion"; it's "This *is* the thing described."
          *   *Order:* 1. Testimony/Word Meaning -> 2. Inference -> 3. (Implicitly distinct from simple analogy). Actually, the prompt asks for "Analogy, Inference, Word-Meaning."
          *   *Revised Order:*
              1.  **Testimony/Word-Meaning:** The Buddhist will say "You just heard the word." Pandit says "I heard the word, but I didn't know the *thing* until I saw the resemblance."
              2.  **Inference:** The Buddhist will say "You inferred it." Pandit says "Inference needs a rule. I have no rule that 'cow-like = gavaya'. I have only similarity."
              3.  **Analogy:** The Reader might think it's metaphorical. The scene must show it's literal identification.

      *   **Phase 4: The Memory Concession (The Pivot)**
          *   Where does it bite? When the Pandit sees the animal.
          *   How to route around? The cognition isn't "I remember a cow." It is "This animal *possesses the similarity* to the cow I know." The *relation* is new. The memory of the cow is the *tool*, but the knowledge of the Gavaya is the *product*.
          *   *Key distinction:* Memory is reproducing old knowledge. Upamāna is generating new knowledge (the identity of the wild animal) using an old image as a measuring stick.

      *   **Phase 5: The Landing & The Exclusions**
          *   *Landing:* The Reader (via the Buddhist) should be able to identify something in their own experience. Not a philosophical concept, but a lived moment. "Ah, like when I recognized the tool by its shape after hearing the name."
          *   *Exclusions:* No Sanskrit terms beyond *pramāṇa* (maybe). No five-membered syllogism. No theory of pervasion (*vyāpti*). Keep it phenomenological (what it *feels* like to know).

  4.  **Refining the Structure (Step-by-Step Plan):**

      *   *Step 1: The Definition of the Goal.* Establish *pramāṇa* as a generator of *new* truth.
      *   *Step 2: The Scenario.* Set the Gavaya scene.
      *   *Step 3: Eliminating Testimony.* Show testimony gave the name, not the object.
      *   *Step 4: Eliminating Perception.* Show perception gave the shape, not the name/identity.
      *   *Step 5: Eliminating Inference.* Show there is no logical rule connecting "cow-like" to "gavaya."
      *   *Step 6: Handling Memory.* Show memory is the *instrument*, not the *result*.
      *   *Step 7: Conclusion.* The Buddhist accepts the distinct category.

  5.  **Review against Constraints:**
      *   *Dependency Structure:* Clearly outlined.
      *   *Memory Concession:* Addressed specifically.
      *   *Case Study:* Evaluated and refined.
      *   *Misconceptions:* Ordered and assigned to specific beats.
      *   *Landing/Exclusions:* Defined.
      *   *Tone:* Instructional for the writer, not the reader.

  6.  **Final Polish:** Ensure the distinction between "knowing the word" and "knowing the object" is clear, as that's the crux of the Nyāya argument. Ensure the "half-hidden" detail is used to weaken perception, forcing the reliance on resemblance. (Self-Correction: Make sure the "half-hidden" doesn't make it *too* ambiguous. It must be enough to see the resemblance, just not enough to identify by species markers alone).

  7.  **Drafting the Response:** (Proceeding to generate the plan based on these thoughts).
answer: |-
  Here is a structural plan for the dialogue, designed to fit approximately a page and a half of text. It prioritizes the phenomenology of knowing (what the act of knowing *feels* like) over technical definitions, ensuring the reader grasps the concept without needing a glossary.

  ### I. The Foundation: Defining the Stake (Lines 1–15)
  **Goal:** Establish the "Novelty Condition" of a *pramāṇa* without using the Sanskrit term repeatedly.
  **Dependency:** This must happen before the specific case is introduced.

  1.  **The Agreement:** The Pandit must secure the Buddhist's agreement that a valid knowledge-source must produce something *new*. If I know "fire is hot" and I think it again, that is memory, not knowledge.
  2.  **The Trap:** The Pandit reminds the Buddhist of their earlier concession: *Recollection is not a pramāṇa.*
  3.  **The Setup:** The Pandit proposes a test case. If the cognition produced in this case is *new*, and it does not come from the senses directly, nor from logic, nor from a teacher's voice, it must have a fourth source.

  ### II. The Case Study: The Gavaya (Lines 16–45)
  **Goal:** Isolate the specific moment of cognition to prove it is unique.
  **Decision on Version:** Use your **provisional version** (Forester + Years Later + Half-Hidden), but tighten the timeline. The "years later" gap is dangerous for the memory objection.
  **Adjustment:** Make it "days later" or "the next morning." The Forester describes the *gavaya* as "like a cow." The Pandit goes into the forest. He sees an animal in the brush (half-hidden). He identifies it.

  **Why this version works better than the plain classical one:**
  *   **Half-hidden:** Weakens *Perception*. He cannot see the hooves or horns clearly enough to classify it by species markers alone. He sees only the *general shape* (the resemblance).
  *   **Forester's Description:** Weakens *Testimony*. The Forester gave the *name* and the *similarity*, but not the *object*. Testimony cannot bridge the gap between a word and a physical thing standing in front of you.
  *   **The Gap:** Weakens *Memory*. It prevents the Pandit from claiming he "remembered" the gavaya, as he has never seen one. He only remembers the *cow*.

  ### III. Addressing the Misconceptions (The Sequence of Objections)
  **Goal:** Dismantle the Buddhist's attempts to reduce *upamāna* to the other three sources.
  **Order:** This order is crucial because each objection is more sophisticated than the last.

  **1. The "Word Meaning" Objection (Testimony)**
  *   **The Buddhist's Attack:** "You knew it because the forester told you what a *gavaya* is. That is testimony (*śabda*)."
  *   **The Pandit's Counter:** Testimony gave me the *word* and the *rule of similarity* ("like a cow"). But when I stand in the forest, the word is silent. The forester is not there. Testimony cannot point to a specific animal in the brush. It gives the map, not the terrain.
  *   **Reader Takeaway:** Distinguishes learning a definition from identifying an object.

  **2. The "Inference" Objection (Logic)**
  *   **The Buddhist's Attack:** "You saw cow-like features. You inferred: 'Whatever is cow-like is a gavaya.' That is inference (*anumāna*)."
  *   **The Pandit's Counter:** Inference requires a universal rule (pervasion) known beforehand (e.g., "Where there is smoke, there is fire"). Do I know the rule "All cow-like animals are gavyas"? No. I only know *this* animal resembles a cow. There is no logical necessity, only a perceived similarity.
  *   **Reader Takeaway:** Distinguishes logical deduction from recognition by resemblance.

  **3. The "Memory" Objection (The Concession Bites)**
  *   **The Buddhist's Attack:** "You are just remembering the cow you know and projecting it. That is recollection, which you admitted is not knowledge."
  *   **The Pandit's Counter (The Pivot):** This is where your earlier concession is routed around.
      *   *Argument:* I am not cognizing the *cow*. I know the cow already. I am cognizing the *gavaya*.
      *   *The Nuance:* The memory of the cow is the *instrument* (like a ruler), but the *knowledge* is the measurement of the new object. The cognition "This animal is the one referred to by the word *gavaya*" is **new**. I never knew this animal before.
      *   *Resolution:* Memory is the tool; Identification is the product. Since the product is new, it is a *pramāṇa*.

  ### IV. The Landing: What the Reader Does (Lines 46–End)
  **Goal:** Solidify the concept through reader application, not philosophical assent.

  **The Action:**
  The Pandit should not ask the Buddhist to agree to a doctrine. He should ask him to recall a moment in his own life.
  *   **Prompt:** "Think of a time you were told a tool's name and its shape. Later, you saw that shape in a workshop you had never entered. You knew which tool to pick up. Was that hearing? No. Was that seeing the name? No. Was that logic? No."
  *   **Success Condition:** The reader pauses and identifies a moment of "Ah, yes, *that* feeling of recognition." The concept lands when the reader realizes they use *upamāna* daily to navigate the physical world (identifying fruits, tools, faces based on descriptions).

  ### V. What to Exclude (The "Do Not Enter" Signs)
  **Goal:** Keep the dialogue clean and focused on the epistemology, not the machinery.

  1.  **No Sanskrit Inventory:** Do not list the 16 categories of Nyāya or the Buddhist *pramāṇas*. Keep it to the "Four Routes."
  2.  **No Theory of Pervasion (*Vyāpti*):** Do not explain the technical requirements for inference. Just show that the Pandit lacks a universal rule ("All cow-like things...").
  3.  **No Five-Membered Syllogism:** Do not have them speak in formal propositions (Thesis, Reason, Example, etc.). Keep the language conversational.
  4.  **No Metaphysics of Universals:** Avoid debating whether "cow-likeness" is a real entity. Keep it focused on the *cognition* in the mind of the Pandit.

  ### Summary of Dependencies
  1.  **Define *Pramāṇa*** (Must yield new knowledge) $\rightarrow$ *Allows the Memory Objection to be raised.*
  2.  **Present Case** (Gavaya in brush) $\rightarrow$ *Provides the data for analysis.*
  3.  **Eliminate Testimony** (Forester absent) $\rightarrow$ *Isolates the visual/cognitive act.*
  4.  **Eliminate Inference** (No universal rule) $\rightarrow$ *Isolates the resemblance.*
  5.  **Resolve Memory** (Instrument vs. Product) $\rightarrow$ *Secures the "Novelty" requirement.*
  6.  **Reader Application** (Personal recognition) $\rightarrow$ *Confirms understanding.*
