prompt: |-
  You are a veteran teacher of philosophy and social science to intelligent non-specialists — the kind of person who has spent years running university outreach seminars and who knows where lay audiences actually get stuck rather than where textbooks say they do. Please think this through carefully, and before committing to an arc, sketch two or three candidate orderings in your head and say briefly what made you discard the ones you did not use. I would much rather have a plan that has been reasoned outwards from the dependency structure than a tidy list of teaching tips.

  The situation: I run a monthly evening reading group of about fourteen people — mostly software engineers, a GP, a retired maths teacher — who know effective altruism mainly from podcasts and blog posts, and who have had no formal philosophy or economics. We have ninety minutes. Last month we attempted the earning-to-give debate and it went badly: the group spent almost the whole session arguing about whether high-earning donors are hypocrites, and they left with the impression that every critique of effective altruism is really a critique of motives. So this month I want to do the institutional critique properly, as a critique of a method rather than of anyone's character.

  My gloss on it, so that we are working with the same thing: effective altruism's standard method takes the menu of existing interventions as given, assesses each candidate use of a marginal pound by asking what would have happened otherwise — including whether the intervention has room for more funding — and ranks options by expected benefit per pound. The institutional critique, as I understand it, holds that this procedure is structurally blind to actions whose return comes from changing the menu itself: founding organisations, shifting professional or legal norms, building funding pipelines, seeding a research field. Those returns are threshold-shaped, path-dependent, and attributable to no single marginal pound, so a method built to compare marginal contributions to going concerns will systematically underrate them. That is roughly what I want the group to see, and I want them to see why it is a problem for a way of reasoning rather than a reason to feel sulky about donors.

  What I want from you is the plan, not the explanation itself, structured as follows.

  **Prerequisites, in order** (roughly 250 words): which ideas have to be in place before the critique is even intelligible, and what genuinely depends on what. My guess is that they need to feel the pull of marginal reasoning first — why one asks the counterfactual question at all, why room for more funding matters — and to have some grip on non-linear or threshold-shaped returns, but tell me if I have the dependency backwards, and tell me what I can safely compress into a single sentence because it is doing no work.

  **The carrying example** (roughly 200 words): the one case the session is built around, what properties it must have, and — just as important — what it must lack. I tried bednets versus lobbying for a tax and a friend objected that it drags in too much contested politics; I also tried an open-source analogy, funding individual bug fixes versus funding a maintainer or a foundation, which plays beautifully with engineers but may smuggle in the wrong assumptions about who benefits. Choose one, improve one, and defend the choice against the other.

  **Misconception map** (roughly 300 words, as a table): the misunderstandings the group will bring or form, the point in the sequence where each has to be headed off, and the specific move that heads it off rather than a note that it should be. My own predictions: that the critique is really longtermism wearing a coat; that it implies we should stop funding direct interventions; that if something cannot be measured its expected value is zero, which is where the measurability-bias worry sneaks back in and which I want kept separate from the institutional point; that the critic must think the current top interventions are worthless; that the whole thing is a licence to do whatever is prestigious or fun; and, as residue from last month, that this is about motives rather than outcomes.

  **The two distinctions I want left on the board** (roughly 150 words): the difference between the best thing to fund and the best thing to make fundable, and the thought that some actions are worth taking largely for the options they create even when no expected value can be computed for them. Tell me where each sits in the arc — whether they are the payload or merely scaffolding — and push back if you think either is the wrong thing to send people home with.

  **What to leave out** (roughly 100 words): what I should openly decline to settle in ninety minutes, and how I should say so without making the session feel evasive. Please do not give me a reading list or any organisational history; the group has its own material and I want the architecture of the explanation.

  **The check** (roughly 120 words): one question to end on that would show they have taken the critique as a claim about a method, rather than about motives or about the far future, and that would separate genuine uptake from polite agreement — plus what an answer that merely looks right would sound like.

  Please write in British English throughout, and give me your reasons for the ordering, so that I can re-plan on the fly if the discussion runs long.
