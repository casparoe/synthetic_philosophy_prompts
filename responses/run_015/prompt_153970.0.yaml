answer: |-
  ### 1. The Exam Question

  **Time:** 45 Minutes
  **Word Limit:** 800 Words Maximum
  **Marks:** 25

  **Question:**

  The city of Verran proposes a tidal barrage on the River Serran. The project protects Verran's low-lying districts but diverts seasonal flooding onto the farms of Halden Marsh (a neighbouring settlement outside Verran's jurisdiction) and blocks a migration route for a fish stock relied upon by the Kesh fishing cooperative, 200km upstream in a different federation member-state. Notably, 4,000 Halden residents commute daily into Verran, paying Verran income tax and subjecting themselves to Verran's employment and zoning laws.

  Two principles for defining the *demos* are proposed:
  1.  **All-Affected Interests (AAI):** Everyone whose significant interests are foreseeably affected has a claim to membership.
  2.  **All-Subjected to Coercion (ASC):** Everyone subject to the coercion involved in enforcing a decision has a claim to membership.

  Critically evaluate these principles using the **Recursion Test**: *Whatever principle you use to fix the demos must give the same answer when applied one level up, to the question of who gets to decide which boundary rule to use.*

  In your essay: (1) Determine who votes on the barrage under each principle; (2) Apply the Recursion Test to both; and (3) Explain whether the failure or success of this test implies that democratic legitimacy requires a prior constitutional settlement or if it reveals a flaw in the principles themselves. Address the problem of agenda control in your analysis.

  ***

  ### 2. Model Answer (710 Words)

  Applied to the Verran case, the two principles yield distinct constituencies, revealing the tension between impact and authority. Under the All-Affected Interests (AAI) principle, the *demos* for the barrage decision includes Verran residents, the Halden farmers (whose land floods), and the Kesh cooperative (whose livelihood is destroyed by the blocked migration). Interest impact is the sole criterion, regardless of jurisdiction. Under the All-Subjected to Coercion (ASC) principle, the *demos* includes Verran residents and the 4,000 Halden commuters. Because the commuters pay Verran taxes and obey its zoning laws, they are subject to the coercive enforcement of the barrage project. The Kesh, however, lie outside Verran's jurisdictional reach; they are affected but not subjected to Verran's legal coercion, and thus are excluded under ASC.

  While ASC offers a cleaner jurisdictional boundary, both principles face severe difficulties when subjected to the Recursion Test. This test demands consistency: the rule used to define the *demos* for the barrage must also define the *demos* for the meta-decision of selecting that very rule.

  If we apply AAI recursively, we must ask: who is affected by the choice of the boundary rule itself? The choice of rule determines who holds power over future decisions, affecting everyone's long-term interests. Therefore, the *demos* for selecting the rule should theoretically include everyone potentially affected by any future decision Verran makes. This creates an expansive, potentially global *demos* for the meta-question, which differs radically from the specific *demos* for the barrage (which only includes those affected by flooding and fish stocks). Because the principle generates different boundaries at the object level (barrage) and the meta level (rule selection), it fails the Recursion Test. It is self-undermining because it cannot specify a stable procedure for its own adoption.

  ASC faces a similar regress. To decide which boundary principle to use, a group must be subjected to the coercion of that meta-decision. But who is coerced by the choice of principle? If the current Verran council imposes the rule, they are coercing the boundary. ASC demands they be subject to the decision, which they are. However, if the rule excludes the Kesh from the barrage vote, but the Kesh are affected by the *consequences* of the rule selection, ASC creates a mismatch between those coerced by the rule and those affected by the outcome. More critically, ASC cannot explain who constitutes the *demos* for the initial constitutional moment that establishes the coercive authority in the first place. You cannot be "subject" to coercion until the authority exists, but the authority requires a *demos* to legitimize it.

  This recursive failure highlights the problem of agenda control. If the *demos* is reconstituted for every decision based on affectedness or subjection, someone must decide *how* to reconstitute it. Inevitably, the existing body (Verran's current council) controls the agenda for defining the new *demos*. If they use AAI to expand the *demos* to include Kesh, they dilute their own power. If they use ASC to exclude Kesh, they protect their power. Because the principles cannot self-found without circularity, the group currently holding power effectively decides the boundary rules that legitimize their power. This renders the principles vulnerable to strategic manipulation; the *demos* is not discovered by the principle, but constructed by the agenda-setter.

  Consequently, the failure of the Recursion Test does not necessarily prove AAI or ASC are morally wrong, but it demonstrates they are politically incomplete. They cannot serve as the sole foundation for legitimacy because they lead to an infinite regress regarding their own adoption. A strong answer to the boundary problem therefore requires a prior constitutional settlement—a "fixed point" established by history, treaty, or law rather than pure democratic principle. Legitimacy in this context relies not on the perfect alignment of the *demos* with every decision, but on the stability of the rules that define membership. The Recursion Test shows that democracy cannot be fully self-grounding; it rests on a non-democratic foundation that decides who the "self" is. To demand otherwise is to ignore the inevitability of agenda control and the paradox of founding.

  ***

  ### 3. Marking Scheme (25 Marks)

  **Part 1: Application of Principles (8 Marks)**
  *   **A-Range (7-8):** Correctly identifies Kesh as included in AAI but excluded in ASC. Correctly identifies Halden commuters as included in both (due to tax/law subjection). Distinguishes between *impact* and *jurisdictional coercion*.
      *   *Common Error:* Treating all Halden residents as excluded in ASC (ignoring the commuter tax/law detail).
  *   **B-Range (5-6):** Identifies the general split (AAI is wider) but misses the nuance of the Halden commuters' legal status or conflates "affected" with "subjected."
      *   *Common Error:* Assuming ASC automatically excludes all non-citizens regardless of legal subjection.
  *   **C-Range (<5):** Fails to apply principles to the specific actors (Kesh/Halden/Verran) or confuses the definitions.

  **Part 2: The Recursion Test (10 Marks)**
  *   **A-Range (9-10):** Explains that the *demos* for the *rule* differs from the *demos* for the *decision*, creating inconsistency/regress. Explicitly notes that ASC cannot account for the founding moment (no coercion before authority exists).
      *   *Common Error:* Applying the test only to the barrage decision, not the meta-decision of choosing the rule.
  *   **B-Range (6-8):** States that recursion causes a problem (infinite regress) but fails to explain *why* the boundaries shift between levels or treats the test as a simple logical contradiction rather than a procedural instability.
      *   *Common Error:* Claiming the test is passed because "everyone should vote on everything."
  *   **C-Range (<6):** Mentions recursion but treats it as a side note; fails to connect it to the stability of the principle.

  **Part 3: Agenda Control & Implications (5 Marks)**
  *   **A-Range (5):** Identifies that without a fixed point, the *current* power-holders control the boundary definition (agenda control). Concludes that legitimacy requires a constitutional/legal fixed point rather than pure principle.
      *   *Common Error:* Suggesting we can solve the problem by "better participation" rather than acknowledging the structural paradox.
  *   **B-Range (3-4):** Discusses agenda control but fails to link it to the need for a constitutional settlement, or argues one principle is simply "better" without addressing the foundational gap.
      *   *Common Error:* Ignoring the prompt's question about constitutionalism vs. flawed principles.
  *   **C-Range (<3):** No discussion of agenda control or foundational implications.

  **Part 4: Clarity & Constraints (2 Marks)**
  *   **A-Range (2):** Under 800 words, no citations, clear structure.
  *   **B-Range (1):** Slightly over word count or minor structural issues.
  *   **C-Range (0):** Significantly over/under or includes citations.
