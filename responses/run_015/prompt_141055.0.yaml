  **Joint Statement on Moral Trade**

  **Agreed Claims**
  1. In a static case where agents have fixed, known utility functions containing no complicity terms (disutility from advancing opposed ends), moral trade yields Pareto improvements via comparative advantage.
  2. Real-world implementation faces epistemic hurdles (verifying values/compliance) and institutional gaps (enforcement).
  3. We disagree on whether these frictions eliminate the theoretical surplus or merely reduce it.

  **Residual Disagreements**
  *   **Enthusiast:** Complicity terms are negligible; institutional solutions can make compliance legible at low cost; static gains outweigh option-value losses from value drift.
  *   **Skeptic:** Complicity terms are inherent to moral agency and negate surplus; deontic constraints do not aggregate; value opacity makes surplus unmeasurable; drift imposes prohibitive lock-in costs.

  **Verbal Disputes and Falsification**
  We acknowledge partial verbal disagreement regarding "utility": the Skeptic includes complicity within the utility function, while the Enthusiast treats it as a transaction cost. However, the dispute remains substantive regarding the empirical magnitude of these terms.
  *   **Evidence Against Enthusiast:** Controlled trials where agents consistently reject Pareto-improving trades due to intrinsic disutility rather than trust deficits.
  *   **Evidence Against Skeptic:** Verified long-term trades where participants report net positive utility despite advancing ends they explicitly oppose.

  **Cruxes and Tests**

