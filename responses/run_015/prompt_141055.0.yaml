  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Complicity Magnitude** | Disutility from aiding opposed ends is small relative to gains from trade. | Complicity terms are large enough to negate comparative advantage gains. | Paired agents trade resources to advance opposed political ends with full transparency. | >50% complete trades reporting net utility gain. | <10% complete trades; most cite moral discomfort. |
  | **Compliance Legibility** | Verification tech/contracts can make compliance legible at acceptable cost. | Moral compliance is inherently unobservable; behaviour ≠ alignment. | Smart-contract escrow for moral outcomes (e.g., donation matching based on verified metrics). | Low friction; high completion rate. | High friction; metrics gamed or rejected as inadequate. |
  | **Value Drift/Option Value** | Lock-in costs are low; future selves will honor trades or renegotiate efficiently. | Value drift imposes option-value losses swamping static gains; future selves repudiate trades. | Longitudinal study: Agents commit budget now for future allocation by counterparty. | High satisfaction at t+1 despite value shift. | High regret/repudiation at t+1 due to value shift. |
