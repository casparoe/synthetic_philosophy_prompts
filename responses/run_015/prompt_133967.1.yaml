answer: |-
  ### Preamble: The "Verbal Dispute" Warning
  Before you draw the boxes: **"Is DNA a code?" is largely a verbal dispute.** No experiment settles it. This flowchart does not find the *truth*; it maps which *costs* you are willing to pay for your terminology. If two people end up on different leaves but make the same predictions at the bench, they are arguing about dictionary definitions, not biology. Proceed with that skepticism.

  ---

  ### The Flowchart

  **START:** Does a DNA sequence carry "information" in a sense distinct from mere physical causation (e.g., a rock causing a splash)?
  *   **NO** → **Leaf 1**
  *   **YES** → Go to Q1.

  **Q1 (Source):** Why does the codon 'ATG' specify Methionine?
  *   **A:** Because natural selection/ancestry fixed this convention historically. → Go to Q2.
  *   **B:** Because the current translation machinery physically reacts to it this way. → Go to Q4.

  **Q2 (Synthetic Recoding):** In a synthetic organism where every codon is swapped but proteins remain identical, does the genome say the *same thing* as the wild type?
  *   **NO** → **Leaf 2**
  *   **YES** → Go to Q3.

  **Q3 (Random Shuffle):** If the codon table were shuffled by a machine and the translation machinery evolved to fit, would the new DNA carry information?
  *   **NO** → **Leaf 3**
  *   **YES** → **Leaf 4**

  **Q4 (Structural/Methylation):** A DNA stretch kept for bending (not transcription) or a heritable methylation pattern: Is this "information/code"?
  *   **YES** → **Leaf 5**
  *   **NO** → Go to Q5.

  **Q5 (Overlapping Frames):** One sequence read in two frames yields two products. Is this ambiguity (a bug) or context-sensitivity (a feature)?
  *   **AMBIGUITY (Bug)** → Go to Q6.
  *   **CONTEXT (Feature)** → **Leaf 7**

  **Q6 (Lethal Frameshift):** A mutation causes a premature stop. Does the mutated sequence say something *false*, or just do something *different*?
  *   **FALSE** → **Leaf 8**
  *   **DIFFERENT** → **Leaf 9**

  *(Note: If you hesitate between Q5/Q6 outcomes, you are likely Leaf 10.)*

  ---

  ### The Leaves (Views & Awkward Commitments)

  1.  **Deflationary Instrumentalism**
      *   *Commitment:* You must explain why biologists successfully use "information" talk if it refers to nothing real, without calling it just a metaphor.
  2.  **Historical Particularism**
      *   *Commitment:* Two physically identical organisms with different evolutionary histories are "speaking" different languages.
  3.  **Design-Dependent Teleosemantics**
      *   *Commitment:* Evolution by natural selection cannot generate genuine semantic content; only intelligent engineers can create codes.
  4.  **Evolutionary Teleosemantics**
      *   *Commitment:* A random sequence becomes meaningful solely because a reader evolved to fit it, regardless of prior history.
  5.  **Causal Information Theory (Medium Neutral)**
      *   *Commitment:* Every physical constraint in the cell (including lipid bilayers) counts as a "message," diluting the utility of the word.
  6.  *(Skipped in tree to save space, merged into 5/7)*
  7.  **Contextual Semantics**
      *   *Commitment:* The DNA sequence has no intrinsic meaning independent of the cellular state reading it (no "text" without a "reader").
  8.  **Syntax-Based Realism**
      *   *Commitment:* DNA can be "false" (a mutation), implying a normative standard of truth that physics does not provide.
  9.  **Causal Role Semantics**
      *   *Commitment:* There is no such thing as a genetic "error," only differential survival; you must banish "mutation" as a normative term.
  10. **Unresolved / Hybrid**
      *   *Commitment:* You accept that the "code" analogy breaks down at the edges but refuse to pick a side that breaks your intuition.

  ---

  ### Honesty Check (Read This Aloud to the Group)

  1.  **Redundancy Alert:** **Q2 (Recoding)** and **Q3 (Random Shuffle)** are secretly testing the same tension: *Does history matter more than function?* If you answer YES to Q2 but NO to Q3, you are claiming that *human* history counts but *evolutionary* history doesn't. This is a coherent view (Design Intentionalism), but be aware it privileges human agency over natural selection.
  2.  **Collapse Warning:** **Leaf 8 (False)** and **Leaf 9 (Different)** often collapse. If you say a mutation is "false," you are implicitly relying on a Teleosemantic view (Leaf 4). If you are a Causal Theorist (Leaf 5), you cannot say DNA is "false," only "different." If you find yourself wanting both, the tree cannot separate you; you are holding incompatible theories.
  3.  **The "Source" Split:** **Q1** is the strongest predictor. Bench scientists often want to answer **B (Current Mechanism)** because they work on mechanism, but philosophers push **A (History)** to explain *error*. If the room splits here, the subsequent cases won't reconcile them; they are working with different definitions of "content."
  4.  **Uncertainty:** **Q5 (Frames)** is the shakiest branch. Many synthetic biologists view overlapping frames as high-density coding (Context), while classic molecular biology treats them as exceptions to the "one gene, one protein" rule (Ambiguity). I have marked **Leaf 10** for those who stall here; this is where the "code" analogy genuinely frays.
