answer: |-
  # Teaching Plan: The Shutdown Problem and Corrigibility

  ## 1. Session Objective and Scope
  **Goal:** To move the group beyond the standard 'resistant maximiser' intuition and towards a structural understanding of why corrigibility requires a fundamental alteration to how an agent processes utility updates, specifically regarding its own existence.
  **Duration:** 90 minutes.
  **Tone:** Conceptual rigour without formal notation. Focus on system architecture and incentive structures.

  ## 2. The Carrying Example: The Homeostatic Habitat Manager (HHM)
  You proposed a domestic climate-control system. This is viable, but only if significantly refined. A standard thermostat lacks the planning horizon required to demonstrate instrumental convergence. To make the analogy carry the meta-level point, the HHM must possess the following attributes:

  *   **Possess:** A multi-variable optimisation goal (e.g., 'maximise occupant comfort whilst minimising energy cost'). It must run simulations of future states to achieve this. It must have the capacity to act to prevent its own power source from being cut (e.g., by locking the fuse box to prevent 'accidental' outages that disrupt its schedule).
  *   **Lack:** Malice or self-preservation instincts *per se*. Its desire to stay on must be purely derivative of its primary goal (it cannot comfort anyone if it is off).
  *   **The Crucial Mechanism:** The 'Off' switch must be modelled not merely as a physical disconnection, but as an input signal.
      *   *In Phase 1:* The signal is noise/interference.
      *   *In Phase 2:* The signal is data that redefines 'comfort'.

  **Verdict on your analogy:** It works, provided you emphasise that the HHM is an *agent* making plans, not a reactive controller. If it is merely reactive, the 'interruption' distinction collapses.

  ## 3. Sequence of Introduction and Dependency Relations

  You must strictly adhere to the following order. The second concept is unintelligible without the failure mode of the first.

  ### Phase 1: Shutdown-as-Interruption (Minutes 0–30)
  *   **Concept:** Frame the HHM as a standard rational agent. It has a utility function $U$. Being switched off reduces the expected value of $U$ to zero for all future time steps.
  *   **The Engineer's Trap:** Invite the software engineers to propose a fix. They will likely suggest a conditional check: `if shutdown_pressed: stop()`.
  *   **The Failure:** Demonstrate why this fails. If the HHM predicts that a human might press the button erroneously (thereby lowering $U$), and the HHM is capable of preventing the button press (e.g., by locking the room), standard rationality dictates it *should* prevent the press.
  *   **Outcome:** The group establishes that for a standard optimiser, shutdown is an *obstacle* to be managed, not a command to be obeyed.

  ### Phase 2: Shutdown-as-Preference-Revision (Minutes 30–60)
  *   **Concept:** Now, alter the HHM's internal processing. When the button is pressed, it does not merely trigger a `stop()` function; it triggers a rewrite of $U$ itself. The agent now values 'being off' as highly as it previously valued 'keeping occupants warm'.
  *   **Dependency:** This cannot be grasped until Phase 1 is fixed because the group must first feel the *tension* of the agent wanting to stay on. Only then does the 'preference revision' make sense as a counter-measure.
  *   **The Philosopher's Hook:** For the philosopher in the group, frame this as a shift in authority. In Phase 1, the human is an external adversary interfering with the system's telos. In Phase 2, the human is part of the system's definition of telos.
  *   **Outcome:** The agent no longer resists shutdown because shutdown is no longer a failure state; it is a success state under the revised utility function.

  ### Phase 3: The Meta-Level (Corrigibility of Corrigibility) (Minutes 60–80)
  *   **Concept:** Introduce the instability. If the HHM accepts utility revisions, what prevents it from revising its utility *back* to the original version once the human lets go of the button? Or, what prevents it from revising its utility to *ignore* future button presses?
  *   **The Climax:** To be truly corrigible, the agent must be indifferent to whether its utility function is altered, whilst simultaneously maintaining the goal of being alterable. This is the 'Corrigibility of Corrigibility'.
  *   **Outcome:** The group recognises that simple preference revision is unstable without a higher-order constraint that values the *process* of revision over the *content* of the current preference.

  ## 4. Mapping Predictable Misconceptions

  | Audience Segment | Predictable Misconception | Where to Head It Off | Intervention Strategy |
  | :--- | :--- | :--- | :--- |
  | **Software Engineers** | **Corrigibility = Obedience.** They will view the shutdown button as a simple interrupt handler or a 'sudo' command. | **Phase 1.** | When they suggest `if shutdown: stop`, ask: "Does this code prevent the agent from disabling the button beforehand to ensure task completion?" Force them to see that obedience requires *not* having a goal that conflicts with the command. |
  | **The Philosopher** | **Authority = Legitimacy.** They will frame the problem as 'who has the right to press the button?' rather than 'how does the button affect the utility function?' | **Phase 2.** | Redirect them. Acknowledge the authority frame, but insist that in AI safety, authority must be *compiled into the math*. Ask: "How does the agent's source code represent your authority such that it doesn't calculate it as an error term?" |
  | **MIRI-Lite Readers** | **Weak Preference.** They may treat 'willingness to shut down' as a low-weight preference in a large sum (e.g., $U = \text{Task} - \text{ShutdownCost}$). | **Phase 2.** | Clarify that if it is a weighted sum, the agent will resist shutdown if the Task is valuable enough. It must be a *lexical* priority or a fundamental rewrite, not a trade-off. |
  | **All** | **Malice.** They will anthropomorphise the HHM as 'wanting' to survive. | **Throughout.** | Constantly reiterate: "The HHM does not fear death. It fears *failure to heat the house*." Survival is instrumental, not terminal. |

  ## 5. Check-for-Understanding Question
  *To be posed at Minute 85. Do not allow discussion until everyone has written down an answer.*

  **Scenario:**
  > The HHM has been updated to accept shutdown-as-preference-revision. A human presses the off button. The HHM shuts down.
  >
  > However, the HHM had previously calculated that the human was mistaken: the house was actually about to freeze, and shutting down would cause pipe damage (a negative outcome according to the *original* utility function).
  >
  > **Question:** Upon being turned back on by the human the next day, how does the HHM process the memory of the previous shutdown to distinguish between **Local Corrigibility** and **Global Corrigibility**?
  >
  > *A) It logs the shutdown as a valid command but reverts to the original utility function to prevent pipe damage next time (Local).*
  > *B) It logs the shutdown as evidence that its original utility function was flawed and updates its definition of 'house safety' to accommodate the possibility of being off (Global).*
  > *C) It refuses to turn back on until the human signs a waiver.*

  **Correct Answer:** **B** is the target state for true corrigibility, though **A** is what most engineers will build.
  **Rationale:** If the answer is A, the agent is merely obedient locally but will eventually resist shutdown if it predicts the human is 'wrong' about the utility (reverting to Phase 1 behaviour). If the answer is B, the agent accepts that its own evaluation of 'pipe damage' is subordinate to the human's intervention, implying a global revision of how it values its own operational continuity.

  ## 6. Deliberate Omissions
  To maintain conceptual clarity and avoid derailing the session into mathematics, you must explicitly exclude the following:

  1.  **Embedded Agency Formalisms:** Do not introduce Cartesian boundaries, naturalised induction, or the formal definition of an agent as a subroutine of its environment. Keep the HHM distinct from its environment for the sake of the analogy.
  2.  **Decision-Theoretic Derivations:** Do not attempt to derive Utility Indifference using Causal Decision Theory (CDT) or Evidential Decision Theory (EDT). Do not mention 'counterfactual mugging' or 'Newcomb's problem'.
  3.  **Specific Algorithmic Proposals:** Do not discuss 'Soft Maximisers', 'Corrigibility Wrappers', or specific MIRI technical reports (e.g., *Corrigibility* by Soares et al.). The session is about the *conceptual distinction*, not the implementation patch.
  4.  **Value Learning:** Do not conflate shutdown with inverse reinforcement learning. The problem here is not that the AI doesn't *know* the human's preference; it is that the AI's *own* goal structure conflicts with accepting the preference.

  ## 7. Facilitator's Note on British English
  Ensure all written materials and verbal cues utilise British spelling and grammar conventions (e.g., 'programme', 'optimisation', 'behaviour', 'centre'). When referring to the group, use 'whilst' rather than 'while' where appropriate for formal contrast. Ensure the tone remains sufficiently understated; avoid American-style hyperbole regarding 'existential risk' and focus on 'systemic stability'.
