          *   Case 3: Explicit norms removed $\rightarrow$ Implicit signals become *more* salient (Crystallisation). The vacuum creates a need for identity markers. (Fits).
          *   Case 4: High Constraint (Patriarchy/Poverty). Choices driven by necessity/prestige economics, not identity signaling. Women enter technical fields because they *must* or because men *won't* (prestige). Equality changes the driver from necessity to identity. (Fits).

  4.  **Drafting the Principle:**
      *   Name: **The Principle of Identity Salience under Constraint Relaxation.**
      *   Clauses:
          1.  **Constraint Suppression:** High material/social constraints force choices based on survival or rigid compliance, masking intrinsic or identity-driven preferences.
          2.  **Preference/Signal Liberation:** As constraints relax, choices become less about survival and more about self-actualization and social signaling.
          3.  **Essentialist Default:** In the absence of explicit rules, agents default to essentialist heuristics (gender norms) to simplify identity signaling, leading to "normative crystallisation."
          4.  **Status Amplification:** Higher resource availability (SES) amplifies the capacity to signal identity, widening gaps not because biology is stronger, but because identity investment is affordable.

