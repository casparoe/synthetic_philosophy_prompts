      Let's stick to the core mechanism: **The Principle of Compensatory Essentialism under Constraint Relaxation.** This captures the idea that as hard constraints go, soft essentialist norms rush in to fill the void (Case 3) and are amplified by resources (Case 2).

      *Wait, looking closer at Case 4:* Case 4 says women enter technical fields because men avoid them (low prestige). This is *prestige economics*.
      My principle needs to account for *Prestige* vs. *Identity*.
