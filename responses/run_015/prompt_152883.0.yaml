      *(Self-Correction during drafting)*: I need to make sure I don't just say "it's both nature and nurture." The user wants a *principle* that accommodates the verdicts. The verdicts are about *mechanisms* (constraint removal, crystallisation, prestige). The principle must be about the *dynamics of choice under varying constraints*.
