      *   *Case 3 (Iceland School Program):* Neutralized socialization $\rightarrow$ Increased gender-typical clustering. Verdict: Favors cultural explanation (normative crystallisation/reactance), but direction matches biological prediction. *Key tension:* Intervention backfired, but direction aligns with essentialism.
      *   *Case 4 (Less Egalitarian/Patriarchal):* Low equality $\rightarrow$ Women in technical fields (low prestige). Verdict: Proof culture overrides innate tendency (men avoid low prestige). *Complication:* Pattern depends on low equality, complicating the "equality reveals preference" narrative.

  3.  **Search for a Unifying Principle:**
      *   *Observation:* All four cases involve an interaction between *constraints* (economic, social, normative) and *preferences/signals* (innate, cultural, status-driven).
      *   *Common Thread:* The "Paradox" isn't a paradox of *cause* (nature vs. nurture), but a paradox of *signal clarity*. When constraints are high (poverty, rigid patriarchy), choices reflect survival or rigid roles. When constraints are low (wealth, egalitarianism), choices reflect a mix of intrinsic preference and subtle status signaling.
      *   *Hypothesis:* **The Principle of Differential Signal Salience under Constraint Relaxation.**
      *   *Refinement:* Let's try to capture the "Normative Crystallisation" mentioned in Case 3 and the "SES amplification" in Case 2.
      *   *Proposed Principle:* **The Principle of Compensatory Signaling in Low-Constraint Environments.**
          *   *Core Idea:* As material and coercive constraints are removed, human agency increases. However, agency does not operate in a vacuum. In the absence of survival needs or rigid rules, individuals rely more heavily on *subtle social signals* and *intrinsic dispositions* to make choices. Crucially, subtle social signals often default to essentialist heuristics (gender norms) to reduce decision complexity, while intrinsic dispositions (if they exist) are finally free to express. The result is an *amplification* of difference, driven by a feedback loop between freed preference and re-solidified identity signaling.
