answer: |-
  # Specification of Desiderata for a Theory of Killing vs. Letting Die

  To construct an adequate account of the moral distinction between killing and letting die (the act/omission distinction), a theory must satisfy a set of functional, explanatory, and boundary conditions. The following desiderata specify what such a theory must deliver to avoid collapsing into tautology, causal reductionism, or ungrounded normative assertion.

  ## I. Core Desiderata

  ### 1. Canonical Intuitive Alignment
  **Requirement:** The theory must correctly classify and assign moral valence to the standard paradigmatic cases without ad hoc adjustments.
  *   **Cases:**
      *   *The Drowning Stranger:* Agent walks past a shallow pond; child drowns (Omission/Letting Die).
      *   *The Active Push:* Agent pushes a stranger into a pond; stranger drowns (Action/Killing).
      *   *The Switch-Track:* Agent diverts a trolley to kill one to save five (Action/Killing or Permissible Killing?).
  *   **Motivating Consideration:** If a theory classifies walking past the drowning child as "killing," or pushing them in as "letting die," it has failed to capture the linguistic and moral concepts in use. It must match pre-theoretic intuitions in clear cases to earn credibility for murky ones.

  ### 2. Causal Symmetry / Moral Asymmetry Resolution
  **Requirement:** The theory must explain why moral status diverges even when causal contribution to the outcome (death) is physically identical or near-identical.
  *   **Case:** Turning off a life-support ventilator (often classified as letting die) vs. never turning it on (letting die) vs. injecting a lethal dose (killing). In the first two, the physical motion may be identical (finger on switch), yet the moral classification differs.
  *   **Motivating Consideration:** A purely physicalist causal account fails here because the physics of the finger movement is the same. The theory must identify the non-physical variable (duty, expectation, baseline) that creates the moral asymmetry despite causal symmetry.

  ### 3. Negative Causation Handling
  **Requirement:** The theory must distinguish between *initiating* a causal chain of harm and *removing a blocker* that was preventing harm, classifying the latter consistently without reducing it to a disguised action.
  *   **Case:** Agent A prevents Agent B from throwing a life preserver to a drowning victim. The victim dies. Agent A did not push the victim in, but A caused the death by removing the intervention.
  *   **Motivating Consideration:** If "preventing a rescue" is classified as killing, the category of "letting die" shrinks to near nothingness (since almost all omissions involve preventing some possible rescue). If it is classified as letting die, the theory must explain why causal contribution via interference is morally distinct from causal contribution via direct force.

  ### 4. Distributed and Structural Omissions
  **Requirement:** The theory must account for harms resulting from default pathways in collective or automated systems where no single individual performs an identifiable "act" of killing.
  *   **Case:** An algorithmic triage system defaults to "deny care" for a demographic due to historical data bias. No single programmer intended the death; the system maintained a harmful default.
  *   **Motivating Consideration:** Traditional act/omission frameworks rely on an individual agent making a choice. A robust theory must explain whether this is a "collective letting die," a "structural killing," or a category error. It must specify if the distinction survives the dissolution of the singular agent.

  ### 5. Baseline Specification
  **Requirement:** The theory must explicitly define the "normal course of events" or "baseline" against which an omission is measured.
  *   **Case:** A doctor stops treatment (omission relative to treatment baseline) vs. a doctor never starts treatment (omission relative to non-intervention baseline).
  *   **Motivating Consideration:** An omission is only an omission relative to an expected action. If the theory does not specify how the expectation is generated (contract, role, biology, law), the distinction is arbitrary. The theory must state whether the baseline is descriptive (what usually happens) or normative (what should happen).

  ### 6. Non-Collapse Condition
  **Requirement:** The theory must not reduce the distinction to a primitive metaphysical claim (e.g., "positive duties are real, negative duties are not") without explaining the source of that metaphysics.
  *   **Motivating Consideration:** Asserting that "killing violates rights but letting die does not" is a conclusion, not an explanation. The theory must derive the rights status from the nature of the act/omission, not simply attach rights to the categories to explain the difference.

  ## II. Tensions and Jointly Unsatisfiable Pairs

  An adequate theory must acknowledge where certain desiderata conflict. Satisfying one may require relaxing another.

  ### 1. Robust Causal Asymmetry vs. Distributed Omissions
  *   **The Conflict:** To maintain a sharp causal distinction between acting and omitting, one usually requires a discrete event initiated by an agent. However, distributed structural omissions (Desideratum 4) often lack a discrete initiating event.
  *   **The Trade-off:** A theory that insists on a clear causal "spark" for killing will struggle to classify structural harms as anything other than omissions, potentially underestimating their moral severity. Conversely, a theory that classifies structural maintenance of harm as "killing" risks dissolving the act/omission distinction entirely, making everyone responsible for all preventable deaths.

  ### 2. Negative Causation as Omission vs. Boundary with Active Harm
  *   **The Conflict:** If preventing a rescue (negative causation) is treated strictly as an omission (letting die), it preserves the category size but risks counter-intuitive moral leniency for those who actively block aid. If treated as killing, it preserves moral severity but blurs the line between doing and allowing.
  *   **The Trade-off:** You cannot simultaneously hold that "only direct force is killing" and "blocking rescue is letting die" while maintaining that "blocking rescue is as morally bad as killing." One of the definitions must stretch.

  ### 3. Agent-Relativity vs. Outcome-Neutrality
  *   **The Conflict:** A theory based on the agent's perspective (what *I* did) preserves the distinction well. A theory based on the victim's perspective (what happened to *them*) often collapses the distinction (death is death).
  *   **The Trade-off:** Preserving the distinction requires prioritizing the agent's causal history. Prioritizing the victim's outcome requires minimizing the distinction. A theory cannot maximize both agent-relative clarity and outcome-relative consistency.

  ## III. Non-Negotiable Requirements vs. Camp-Specific Preferences

  To evaluate a theory, one must distinguish between what makes it a *theory of the distinction* versus what makes it a *Kantian* or *Utilitarian* theory.

  ### Non-Negotiable (Functional Requirements)
  1.  **Definitional Clarity:** The theory must provide necessary and sufficient conditions for "act" and "omission." It cannot rely on intuition alone.
  2.  **Consistency:** The classification rules must apply uniformly across canonical and edge cases. It cannot classify Case A as omission and Case B (structurally identical) as action without citing a relevant difference.
  3.  **Explanatory Power:** It must explain *why* the distinction tracks moral difference (if it does), rather than merely asserting that it does.
  4.  **Baseline Transparency:** It must state where the "expected course of events" is derived (law, convention, biology).

  ### Camp-Specific Preferences (Variable Commitments)
  1.  **Moral Weight:** Whether killing is *intrinsically* worse than letting die is a normative commitment, not a conceptual requirement. A theory can validly conclude the distinction has no moral weight (Utilitarianism) provided it explains why the distinction exists conceptually.
  2.  **Determinism:** Whether the theory requires libertarian free will to ground the "act" is a metaphysical preference. A compatibilist account can suffice if it defines agency functionally.
  3.  **Rights Foundation:** Whether omissions are framed as "rights not violated" vs. "duties not fulfilled" is a deontological preference. An institutional account might frame it as "role violation" vs. "system failure."
  4.  **Causal Primitivism:** Whether causation is treated as a physical fact or a normative construct is optional. Some theories treat "cause" as a moral label rather than a physical one.

  ## IV. Framework Evaluation Against Desiderata

  This brief scorecard indicates how three common frameworks fare against the specified desiderata, highlighting where they succeed or fail the specification.

  ### 1. Pure Causal Account
  *   **Mechanism:** Distinguishes acts and omissions based on physical energy transfer or initiation of a new causal chain.
  *   **Performance:**
      *   *Fails Desideratum 2 (Causal Symmetry):* Cannot explain why turning off a machine is morally different from never turning it on when the physics are identical.
      *   *Fails Desideratum 3 (Negative Causation):* Struggles to classify preventing a rescue, as the physical interference is an "act," yet intuitively it feels like "allowing death."
      *   *Fails Desideratum 4 (Distributed Omissions):* Cannot locate the "cause" in algorithmic defaults where no new energy is introduced.
  *   **Verdict:** Conceptually insufficient. It captures the physics but misses the normative architecture.

  ### 2. Deontological Rights-Based View
  *   **Mechanism:** Distinguishes based on negative duties (do not harm) vs. positive duties (aid). Killing violates negative rights; letting die fails positive duties.
  *   **Performance:**
      *   *Succeeds Desideratum 1 (Canonical Cases):* Aligns well with intuitions about strangers and direct harm.
      *   *Struggles Desideratum 5 (Baseline):* Often relies on a "status quo" bias to determine what counts as harm vs. non-aid, which can be arbitrary (e.g., is the status quo having the ventilator or not?).
      *   *Struggles Desideratum 4 (Distributed Omissions):* Rights are typically held against specific agents. Structural harms violate no specific negative right and trigger no specific positive duty, creating a "responsibility gap."
      *   *Risks Desideratum 6 (Non-Collapse):* Often accused of restating the problem ("Killing is worse because it violates a stronger duty" without explaining why the duty is stronger).
  *   **Verdict:** Strong on individual agency, weak on structural complexity and baseline justification.

  ### 3. Institutional or Role-Based Framework
  *   **Mechanism:** Distinguishes based on assigned responsibilities within a system. An omission is a failure of role; a killing is a violation of general prohibition.
  *   **Performance:**
      *   *Succeeds Desideratum 5 (Baseline):* The baseline is defined by the role (e.g., a doctor's duty to treat establishes the baseline for omission).
      *   *Succeeds Desideratum 4 (Distributed Omissions):* Can classify systemic failures as institutional omissions even without a single killer.
      *   *Fails Desideratum 1 (Canonical Cases):* Struggles with the Drowning Stranger. If the passerby has no "role" regarding the child, is it truly an omission, or merely a non-event? It risks making morality too dependent on social assignment.
      *   *Tension with Desideratum 2:* If morality is role-dependent, the causal symmetry matters less, but the universal wrongness of killing becomes contingent on institutional rules.
  *   **Verdict:** Best for structural/collective cases, but risks relativizing the core distinction in non-institutional contexts.

  ### Summary Specification
  An adequate theory must be **hybrid**. It requires a causal component to identify the physical event, a normative component to establish the baseline of expectation (Desideratum 5), and an institutional component to handle distributed agency (Desideratum 4). It must explicitly reject the idea that the distinction is purely metaphysical (Desideratum 6) and instead treat it as a **normative classification of causal history**. The non-negotiable core is not that killing is worse than letting die, but that the *criteria for classifying* the two must be consistent, transparent regarding baselines, and capable of handling cases where the "agent" is a system rather than a person.
