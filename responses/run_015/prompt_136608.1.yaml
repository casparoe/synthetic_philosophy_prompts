  ### 7. Concrete Parameter Values for Your Pre-Work

  To ensure the game works as described, use these specific settings when generating your data:

  *   **Grid:** 20x20.
  *   **Initial State:** Start with a flat grid (all 3s). Run 500 random grain additions to reach a "Critical State." Save this as the **Snapshot**.
  *   **Round 1 Truth:** Add 1 grain to (10,10). Run the cascade. Record total topples. (Expect size 10–30).
  *   **Round 2 Truth:** Take the **Snapshot**. Change cells (8,8) to (12,12) to have Threshold = 5. Add 1 grain to (10,10). Run cascade. (Expect size to be smaller, or contained).
  *   **Round 3 Truth:** 40x40 Grid. Critical State. Change Boundary to "Periodic" (grains wrapping around). Add grain. (Expect 0 grains lost to boundary).
  *   **Handout Data:**
      *   **Beta's Histogram:** Generate 100 avalanches from the standard Critical State. Fit a power law $P(s) \sim s^{-1.5}$. Ensure there are a few large events (size 50+) so their probability isn't zero.
      *   **Gamma's Law:** Simply state "Input = Output" for Rounds 1 & 2. Change to "Input = Accumulation" for Round 3.

  This plan respects your colleagues' intelligence, uses your geochemical intuition (flux, stability, scaling), and avoids the jargon trap until the very end, allowing the experience to drive the philosophy.
