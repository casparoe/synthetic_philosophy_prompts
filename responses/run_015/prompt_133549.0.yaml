  I'm an experienced novelist who works in historical fiction and mythic narrative structures, and I'm fluent in the craft vocabulary of plot architecture, focalization, free indirect discourse, unreliable narration, dramatic irony, analepsis and prolepsis, diegetic versus mimetic framing, catharsis, character arc, mythic mode, and narrative closure—including the distinction I use between "proleptic redemption" (where a defeat is structurally framed as an indispensable precondition for a future victory the text already anticipates) and "tragic closure" (where defeat is ennobled but final). I want you to restate the conceptual debate over "lost cause" national myths—specifically the tension between viewing them as ethically necessary instruments of collective identity and viewing them as dangerous forms of historical revisionism—entirely within that narrative-craft vocabulary, without smuggling in the political or moral terminology you are translating away from. Take the four canonical cases—the Confederate Lost Cause, Masada, the Kosovo Field of Blackbirds, and the Dunkirk "miracle"—and, for each, translate both positions (the identity-necessary view and the revisionism view) into craft terms as precisely as you can. Then deliver a residue report: which claims translate cleanly, which survive only through distortion, and which have no expression at all in this vocabulary; and state whether that residue reveals a blind spot in narrative craft or an underlying ambiguity in the original debate. Write in American English. After your analysis, include a brief structured summary as a JSON object with exactly these named fields: "translation_framework" (one sentence describing the vocabulary used), "case_translations" (an array of four objects, each with keys "case_name", "identity_necessary_translation", "revisionism_translation", and "distortion_notes"), "residue_report" (an object with keys "clean_mappings", "forced_distortions", "untranslatable_elements", and "assessment"), and "final_verdict" (one sentence stating whether the residue belongs to the craft framework or to the original debate).
