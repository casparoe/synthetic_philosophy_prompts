answer: |-
  # Session Plan: The Limits of the Guide's Voice (40 Minutes)

  ### 1. The Foundation (0–5 mins)
  **What must land first:** The distinction between *features* (public, verifiable) and *force* (private, experiential).
  **The One Example:** **A Conceptual Art Piece that functions like a Joke.** (e.g., Duchamp's *Fountain* or a specific visual pun).
  **Why not "A mate telling you a film's brilliant"?**
  *   **The Trap:** That example frames the problem as *trust* ("Is my mate lying?" or "Do they have good taste?"). It suggests that if the mate were reliable enough, the testimony *would* work.
  *   **The Reality:** The problem is structural, not credibility-based. Even if the mate is 100% honest and has identical taste to you, their verdict ("It's brilliant") cannot generate *your* pleasure. You cannot laugh on testimony. You cannot be moved on hearsay.
  *   **Instruction:** Open with the Joke/Art analogy immediately. Ask: "If I describe the setup and punchline perfectly, have I made you laugh?" When they say no, pivot: "That's not because I'm a bad teller. It's because the *funniness* isn't in the words I transmit; it's in the reaction you have. Art guides transmit words. Visitors need reactions."

  ### 2. Heading Off Misconception #1: "It's Just About Expertise" (5–15 mins)
  **The Misconception:** "But visitors pay us to tell them what's good. They defer to mechanics and doctors; why not us?"
  **The Integrated Bite (Don't assert, demonstrate):**
  *   **Activity:** Ask them to write down *why* they defer to a mechanic. (Answer: The car's function is independent of my feeling. If the brake pad is worn, it's worn whether I feel it or not.)
  *   **The Pivot:** "In this gallery, the 'function' *is* the feeling."
  *   **The Bite:** If a visitor defers to you on value ("You say it's good, so I'll say it's good"), they have successfully followed your instruction but failed to engage with the art. They have treated the painting like a brake pad.
  *   **Key Line:** "Deference works for facts because the fact exists without the observer. Deference fails for value because the value *is* the observer's experience. If they defer to you, the art turns off."

  ### 3. Heading Off Misconception #2: "The Perfect Critic" (15–25 mins)
  **The Misconception:** "But what if I have a critic whose verdicts matched my own first-hand judgement on the last 500 works? Can't I just trust their verdict on the 501st?"
  **Where to place it:** Immediately after the Expert Deference discussion. They will offer this as the solution to the "Expertise" problem.
  **How to handle it:**
  *   **Acknowledge:** This is the strongest possible case for testimony (the Humean "Ideal Critic").
  *   **The Turn:** Ask: "If they tell you Work 501 is good, and you believe them without looking, what have you gained?"
  *   **The Point:** You have gained a *prediction* ("I will probably like this"), not an *aesthetic judgement* ("This is good").
  *   **Why it matters for guides:** Your job isn't to predict their reaction; it's to facilitate the experience that *causes* the reaction. The Perfect Critic scenario proves that even perfect correlation doesn't transfer the *reason* for the judgement. The visitor still needs to stand in front of the work to convert the prediction into a judgement.

  ### 4. The Welded Cases (25–35 mins)
  **The Goal:** Move from abstract "good/bad" to the language they actually use ("clumsy," "leaden," "resolved").
  **The Trap:** These words look like descriptions (testimony-friendly) but act like evaluations (testimony-hostile).
  **Activity:** Put the phrase **"The translation is leaden"** on the board.
  *   **Ask:** "Is 'leaden' a physical property like 'heavy'?" (No).
  *   **Ask:** "Can I take your word that a translation is leaden without reading it?"
  *   **The Insight:** To understand "leaden," you must feel the drag. If you take my word for it, you are taking my word on a feeling, not a fact.
  *   **Instruction:** Tell them: "When you use thick evaluative descriptions ('clumsy line', 'saccharine tone'), you are smuggling a verdict inside a description. Visitors will hear it as a fact ('Oh, the line is clumsy') and stop looking. You must teach them to see the line, not just believe the adjective."

  ### 5. What to Flatly Refuse (Throughout)
  **The Metaphysical Rabbit Hole:** Do not let them debate whether beauty is *objective* or *subjective*.
  *   **Why:** It wastes time and misses the point. Whether beauty is in the object or the eye, the *transmission problem* remains. You can't transmit the experience either way.
  *   **Shut-down line:** "We aren't solving Kant today. We're solving what happens when a visitor stops looking because they think you've already told them what matters."

  ### 6. The Exit Question (35–40 mins)
  **The Goal:** Distinguish between "They heard me" and "They got it."
  **The Question:**
  > "If a visitor leaves this gallery able to recite your verdicts perfectly, but hasn't had a single moment where their own perception clicked into place—have you done your job?"

  *   **Correct Answer (Indicates understanding):** "No. They've learned about *me*, not the *art*."
  *   **Wrong Answer (Indicates rote learning):** "Yes, because they now know what's good." / "No, because they might disagree with me later."

  ### Summary of Sequence
  1.  **Hook:** The Joke (Testimony fails on effect).
  2.  **Constraint:** Mechanics vs. Art (Deference kills the experience).
  3.  **Stress Test:** The Perfect Critic (Prediction $\neq$ Judgement).
  4.  **Application:** Welded Language ("Clumsy" feels like fact, acts like value).
  5.  **Close:** The Exit Question (Verdicts vs. Perception).
