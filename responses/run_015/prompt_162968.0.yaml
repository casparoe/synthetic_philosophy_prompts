  Here's a thinking process that leads to the suggested session plan:

  1.  **Analyze the Request:**
      *   **Audience:** Volunteer guides at a contemporary art gallery. Bright, practical, no philosophy background. Their job is telling visitors what to think (interpretation/evaluation).
