answer: |-
  1. Brainstorm
  The theoretical landscape splits along three axes. First, *Ontology*: is the agent the group (List/Pettit) or only individuals (everyone else)? Second, *Psychology*: is the intention primitive/irreducible (Searle, Tuomela's we-mode) or reducible to interlocking I-intentions (Bratman, Deflationary)? Third, *Normativity*: does participation create binding obligations independent of personal goal (Gilbert) or is it instrumental coordination (Lewis, Bratman)?

  Kutz complicates this by separating *participation* from *control*: you can join a collective end without intending the outcome. The relay cases test interdependence and common knowledge. The saboteur tests whether commitment or contribution defines membership. The announced plan tests formation conditions—does uptake suffice for joint commitment, or is explicit agreement required? We need to distinguish the "normative bind" (Gilbert) from the "psychological mesh" (Bratman) and the "primitive we" (Searle). The quiz must force choices on these structures without naming them.

  2. The quiz
  1. **Relay (Standard):** Two editors revise a doc sequentially, never meet, never message. Each sees the other's work and improves it.
     A. Yes, they share a goal despite no contact.
     B. No, lacks mutual responsiveness.
     C. Yes, but just parallel individual acts.
     [Probes: Common Knowledge vs. Parallelism]

  2. **Relay (Mercenary):** Same as #1, but one editor secretly doesn't care about the doc, only the money.
     A. Still joint; they are bound by the activity.
     B. No, their intentions don't mesh properly.
     C. Yes, contribution is all that matters.
     [Probes: Commitment vs. Contribution]

  3. **Relay (AI):** Same as #1, but the second "editor" is a language model.
     A. Yes, the human intends the joint outcome.
     B. No, requires two intentional agents.
     C. Yes, functionally indistinguishable.
     [Probes: Agency Requirements]

  4. **Saboteur:** Five sailors hoist a sail; one plans to let the rope slip at the crucial moment.
     A. Yes, he's part of the crew until he acts.
     B. No, he lacks the right intention.
     C. Yes, but he's violating a norm.
     [Probes: Membership vs. Compliance]

  5. **Announced Plan:** Leader says "We clean park," four silently grab bags. No agreement spoken.
     A. Yes, uptake creates joint commitment.
     B. No, lacks explicit agreement.
     C. Yes, but just coordinated individual action.
     [Probes: Formation Conditions]

  6. **Traffic:** Drivers avoid collisions at an intersection via standard patterns.
     A. No, just convention and expectation.
     B. Yes, minimal joint action to avoid crash.
     C. No, purely individual safety goals.
     [Probes: Convention vs. Action]

  7. **Walking:** Walking together, one stops to tie a shoe.
     A. The walk pauses; you owe it to them to wait.
     B. You wait because you intend to walk together.
     C. You wait only if you want to.
     [Probes: Normative Obligation]

  8. **Corp Vote:** Board votes on policy; majority wins.
     A. The Corporation intended the policy.
     B. The majority members intended it.
     C. No one intended it; it's an aggregate.
     [Probes: Group Agent Status]

  9. **Emergency:** Strangers lift a car to save a victim. No discussion.
     A. Yes, primitive we-intention emerges instantly.
     B. Yes, interlocking intentions form quickly.
     C. No, just parallel lifting.
     [Probes: Spontaneity/Primitiveness]

  10. **Protest:** Marching for a cause; one person just likes the crowd energy.
      A. He participates in the joint action.
      B. He is merely alongside the action.
      C. He is part of the group agent.
      [Probes: Participatory Intention]

  3. Scoring key
  Tally your answers. There are three main clusters, but specific questions override the total.

  **The Plural Subject (Gilbert/Tuomela We-Mode):** Mostly A on Q4, Q5, Q7. You see joint action as creating normative bonds. Even the saboteur is in (Q4C), and silent uptake suffices (Q5A). You believe obligations arise from participation itself.
  **The Interlocking Planner (Bratman/Searle):** Mostly B on Q1, Q2, Q9. You require psychological meshing. The mercenary isn't truly joint (Q2B). You accept spontaneous we-intentions (Q9A/B) but deny them to AI (Q3B). Searleans pick A on Q9; Bratmanians pick B.
  **The Deflationary/Convention (Lewis/Reducibility):** Mostly C. You see nothing over and above individual intentions. The relay is parallel (Q1C), traffic is mere convention (Q6A), and waiting is optional (Q7C).
  **The Group Agent (List/Pettit):** Distinctive A on Q8. You treat the corporation as the intender, distinct from members.
  **The Complicity Account (Kutz):** Distinctive A on Q10. The protester participates regardless of shared goal, provided they intend to contribute to the collective end.

  *Mixed Patterns:* If you split between A and B, you likely hold a hybrid view (e.g., Bratman with normative gloss). If you pick C on Q1 but A on Q8, you are inconsistent (denying joint action to individuals but granting it to corporations).

  4. Logical space
  The quiz maps a 3^10 grid, but theory occupies specific cells.
  *   **Occupied Cells:**
      *   *Normative/Binding:* Gilbert/Tuomela (Q4C, Q5A, Q7A).
      *   *Psychological/Meshing:* Bratman (Q2B, Q4B, Q7B).
      *   *Primitive/Individual:* Searle (Q9A, Q3B).
      *   *Group Agent:* List/Pettit (Q8A).
      *   *Deflationary:* Lewis/Reducibility (Q1C, Q6A, Q7C).
      *   *Participatory:* Kutz (Q10A, Q2C).
  *   **Empty Cells:**
      *   *Group Agent without Individual Intentionality:* Picking Q8A (Group intends) while picking Q3B/C or Q9C (Individuals don't intend) is incoherent. List/Pettit require individual intentions to feed the group function.
      *   *Gilbert without Normativity:* Picking Q5A (Joint Commitment) but Q7C (No obligation to wait) is unstable. Gilbert's joint commitment *is* the obligation.
      *   *Bratman with Saboteur Inclusion:* Picking Q4A (Saboteur is in) contradicts the "meshing subplans" requirement central to Bratman.
  *   **Unexplored/Unattractive:** A view that accepts AI joint action (Q3A) but denies individual intentionality (Q9C) is technically possible (functionalism) but rarely held in this literature.

  5. Where it breaks
  This quiz cannot distinguish **Searle from Tuomela (We-Mode)**. Both answer "Yes" to primitive we-intentions (Q9A) and normative force (Q7A). The difference is metaphysical (individual psychology vs. group reason), not case-based. You need a question about *why* the intention binds, not *if* it does.

  It also struggles with **Bratman vs. Deflationary**. If a student interprets "mutual responsiveness" (Q1B) as merely "expecting others to act," they collapse into Deflationary (Q1C). A discriminating question would need to probe *commitment to meshing* specifically, not just coordination.

  Finally, **Kutz vs. Gilbert** on the Saboteur (Q4). Kutz says the saboteur participates (complicity); Gilbert says he is a member but violating. Both pick "Yes" but for different reasons. The quiz lumps them (A vs C). To separate them, you'd need to ask: "Is the saboteur liable for the success of the sail, or only the attempt?" This quiz diagnoses commitments, not fine-grained metaphysical distinctions.
