answer: |-
  You have correctly identified one of the deepest fault lines in modern economics and psychology. Your intuition is spot-on: the argument your economist friend is making is technically coherent within a specific framework, but practically useless for prediction because it is unfalsifiable.

  Here is the breakdown of the phenomena, the logical move your friend is making, the distinction you need, and the terminology to wield it.

  ### 1. The Phenomenon: The Decoy Effect (Violation of IIA)
  What you are observing is the **Decoy Effect** (or Asymmetric Dominance Effect). In rational choice theory, this is a violation of the **Independence of Irrelevant Alternatives (IIA)** axiom.

  IIA states that if you prefer A over B, adding a third option C shouldn't change that preference. If A > B, then {A, B, C} should still result in A > B. Your data shows this is false. The presence of C changes the *relative value* of A and B, usually by making B look like a "compromise" or a "clear winner" against C, whereas A looks "cheap" or "limited."

  ### 2. The Economist's Move: "Description Dependence"
  Your friend is defending **Revealed Preference Theory**. This theory posits that we cannot know a person's utility (satisfaction) directly; we can only infer it from their choices. Therefore, if they choose B when C is present, they *revealed* that they prefer the bundle {A,B,C}→B over {A,B}→A.

  The specific logical maneuver she is using is called **Description Dependence** (a term popularized by economist Amartya Sen).
  *   **The Move:** You redefine the "object" being chosen. The user isn't choosing a "Plan"; they are choosing a "Plan within a Context."
  *   **The Result:** By making the *menu* part of the *meal*, you can explain any choice consistently. If they pick A in Menu 1 and B in Menu 2, they haven't changed their mind; they simply chose different items (Item-1-in-Menu-1 vs. Item-2-in-Menu-2).

  ### 3. The Name for the "Sleight of Hand": The Ad Hoc Rescue
  You asked for the name of the retrofitting move. In philosophy of science, this is an **Ad Hoc Rescue** (or **Ad Hoc Hypothesis**).
  *   **Definition:** When a theory is contradicted by evidence (people switch from A to B when C is added), you add a new assumption (the "context" changed the utility) solely to make the contradiction disappear, without adding any new predictive power.
  *   **Why it bugs you:** It renders the theory **Unfalsifiable**. If every outcome can be explained by redefining the inputs after the fact, the theory cannot be proven wrong. It is a "Just-So Story."

  In behavioral economics, we might colloquially call this **Ex Post Utility Assignment**. You assign the utility value *after* observing the choice, rather than using utility to *predict* the choice.

  ### 4. The Distinction You Need: Flexibility vs. Commitment
  You asked for the distinction between wanting options present vs. wanting them gone. This is not the same mechanism.
  *   **Wanting More Options:** This is **Option Value** or **Flexibility**. The user values the *right* to choose later.
  *   **Wanting Fewer Options:** This is **Demand for Commitment** (or **Commitment Devices**). This was formalized by Thomas Schelling. Users recognize their own future irrationality (e.g., "I will binge-watch instead of sleep," "I will cancel this subscription when I get busy") and pay to restrict their future selves.

  **The Boundary:**
  *   If the user adds Plan C to *keep their options open*, they are optimizing for **Flexibility**.
  *   If the user chooses a non-refundable rate to *force their hand*, they are optimizing for **Self-Control**.
  *   **Crucially:** Your economist friend's model struggles here. If "more options" is always better (standard micro), why do people pay to remove them? If "menu definition" explains everything, why do they pay to change the menu? The distinction lies in **Time Inconsistency**. People value the *current self's* ability to bind the *future self*.

  ### 5. When is the Re-description Honest? (Predictive Commitment)
  You asked: *Under what conditions would the re-description be honest rather than a dodge?*

  It is honest only if it generates **Predictive Commitment**.
  *   **The Dodge:** "People chose B because the presence of C changed the utility of the menu." (Explains the past, predicts nothing).
  *   **The Honest Model:** "If we introduce a decoy C that is dominated by B but not A, conversion to B will increase by X%." (Predicts the future).

  For the re-description to be valid, it must commit to a specific rule about *how* the context changes the value. For example: "Decoys always pull share toward the higher-margin option." If you can state the rule *before* running the test, it is science. If you state it *after*, it is storytelling.

  ### 6. Does Self-Reporting Matter?
  You asked: *Does it matter that people say the third plan shouldn't matter?*

  Yes. This is the **Introspection Illusion**.
  *   People have direct access to their *thoughts*, but not their *processes*.
  *   They genuinely believe they are comparing A and B. They are unaware that C is acting as an anchor or a contrast point.
  *   **Why it matters:** If you ask them, they will give you the "rational" reason (Price/Channels). If you watch them, you see the "contextual" reason (Contrast/Relief).
  *   **The Trap:** If you rely only on their words, you will build the wrong product. If you rely only on the economist's "revealed preference," you will understand *what* they did, but not *how to replicate it*. You need the self-report to understand the *friction*, and the behavior to understand the *drive*.

  ### 7. Coining the Term: "Utility Laundering"
  Since you asked for a term if nothing established fits perfectly, I propose calling this specific rhetorical move **Utility Laundering**.

  **Definition:** The practice of taking inconsistent behavioral data and "cleaning" it by expanding the definition of the choice set until the inconsistency disappears, without offering a predictive rule for how the expansion works.

  **Boundary Cases:**
  *   **Valid Use:** You hypothesize that "Context X increases perceived value of Y," you test it, and it holds across different products. You have found a **Contextual Heuristic**.
  *   **Invalid Use (Laundering):** You observe a choice, then define the context such that the choice becomes "rational," but you cannot predict what will happen in Context Z.

  **How to use this in your work:**
  When your economist friend says, "They just preferred the three-option menu," you can reply:
  > "That's **Utility Laundering**. You're redefining the choice set to preserve the axiom of consistency, but it's an **Ad Hoc Rescue** unless you can tell me *before the test* which menu configuration will win. If we can't predict the shift, we aren't measuring utility; we're just labeling outcomes."

  ### Summary for your Toolkit
  1.  **The Effect:** Decoy Effect (Violation of IIA).
  2.  **The Friend's Defense:** Revealed Preference / Description Dependence.
  3.  **The Logical Flaw:** Ad Hoc Rescue / Unfalsifiability.
  4.  **The Distinction:** Flexibility (Option Value) vs. Commitment (Self-Binding).
  5.  **The Term for the Dodge:** Utility Laundering (or Ex Post Rationalization).
  6.  **The Test:** Predictive Power. If the model can't predict the next A/B test, it's just a story.

  You are not crazy. You are running into the wall where Classical Economics meets Human Psychology. The economist is protecting the math; you are protecting the reality. Trust the data, but demand a model that predicts, not just explains.
