answer: |-
  This is a fantastic philosophical puzzle. Your friend is articulating a classic version of **Resultant Moral Luck** (a term coined by Thomas Nagel), which argues that we shouldn't be praised or blamed for things outside our control, including the final outcome of our actions. If Sully had hit a barge, the logic goes, the *action* was the same, so the *moral judgment* should be the same.

  But your intuition is correct: that view is too flat. It ignores the texture of the situation. To articulate why, we need to shift the focus from **Resultant Luck** (what happened at the end) to **Circumstantial Luck** (the specific constraints and options present in the moment), and then look at how professional role ethics interact with both.

  Here is a breakdown of Flight 1549 through that "weirder middle layer," compared against United 232, to help you refine your argument.

  ### 1. Circumstantial Luck: The "Menu of Options"
  Your friend focuses on the *result* (everyone lived vs. people died). But circumstantial luck is about the *setup*.

  In the Hudson case, Sullenberger was lucky regarding the **available move set**:
  *   **Altitude:** He was low enough that turning back to LaGuardia was impossible, but high enough to reach the water.
  *   **Environment:** The river was calm, it was daylight, and the temperature was cold but not freezing enough to cause immediate hypothermia before rescue.
  *   **Structural Integrity:** The fuselage didn't break apart on impact (a huge variable in water landings).

  **Does this undermine praise?**
  If we view heroism as "magic," then yes, luck undermines it. But if we view heroism as **expert calibration**, luck is just a variable to be managed.

  Sullenberger didn't just *have* these lucky circumstances; he had to **identify** them instantly. A less experienced pilot might have fixated on Teterboro Airport (which was technically closer but unreachable) and stalled the plane, turning a survivable ditching into a fatal crash.
  *   **The Argument:** We aren't praising Sully because the river was calm (that's luck). We are praising him because his training allowed him to **recognize the river as a viable runway** within seconds, whereas the statistical probability for that decision was incredibly low. He maximized the *expected value* of the lucky circumstances available to him.

  So, circumstantial luck doesn't negate agency; it defines the arena in which agency operates. We praise him not for the calm water, but for not wasting the opportunity the calm water provided.

  ### 2. The Counter-Case: United 232 (Sioux City, 1989)
  This is where your friend's "outcome luck" theory really starts to fray.

  Captain Al Haynes was flying a DC-10 that suffered an uncontained engine failure which severed all hydraulic lines. The plane had no ailerons, no elevators, and no rudder. It was essentially a falling brick.
  *   **The Luck:** Haynes had the circumstantial luck of being near Sioux City (a runway with emergency services).
  *   **The Unluck:** The plane was uncontrollable. The crash landing was violent.
  *   **The Outcome:** 112 people died. 185 survived.

  By your friend's logic, Haynes should be viewed with ambiguity. He made split-second calls, used differential thrust to steer a plane designed not to be steered that way, and yet **112 people died**. If Sully is a hero only because 0 people died, Haynes should be a failure because 112 died.

  **But he isn't.** Haynes is universally regarded as a hero. The NTSB report praised the crew's airmanship.

  **Why the discrepancy?**
  This suggests we *are* tracking outcomes, but we are weighing them against **baseline probability**.
  *   **Sully:** Baseline survival for dual-engine failure at that altitude was low. Actual survival was 100%.
  *   **Haynes:** Baseline survival for total hydraulic failure was near zero. Actual survival was ~60%.

  In both cases, the pilots shifted the probability curve massively in favor of life. This proves we don't just look at the binary "dead/alive" scoreboard. We look at the **delta**—the difference between what *would* have happened without them and what *did* happen.

  ### 3. Role Constraints and "Fiduciary Luck"
  This brings us to the second part of your request: *Does moral luck work differently when an agent is trapped inside strict role constraints?*

  Yes. Pilots (and surgeons, firefighters, etc.) operate under a **fiduciary duty**. We judge them not by universal moral standards, but by professional standards of care.

  *   **Universal Morality:** "Did you save everyone?" (Outcome based)
  *   **Professional Ethics:** "Did you utilize all available resources to minimize harm according to your training?" (Process based)

  When Haynes landed in Sioux City, he fulfilled his professional duty even though people died. When Sully landed in the Hudson, he fulfilled the same duty.

  This suggests that moral luck is **mitigated by role**. If I am a random bystander and I try to save a drowning person but they die, I am not blamed (nor hailed as a hero). If I am a lifeguard and they die, I am scrutinized. If I am a lifeguard and they live, I am praised.
  *   **The Constraint:** Because pilots accept the risk of the job, we judge them on their **stewardship of the risk**, not just the elimination of it.

  This explains why we don't tear Sully apart if the outcome were different (hypothetically). If the river had been rougher and 20 people died, we would likely still call him a hero who faced impossible odds, provided he followed the correct protocol. The "tearing apart" your friend predicts usually happens only when **negligence** is found, not just bad luck. (Think of the Germanwings pilot who crashed intentionally vs. a pilot who crashes due to mechanical failure).

  ### 4. Conclusion: Revisionism or Carefulness?
  So, does this pair of cases push us toward **revisionism** (admitting responsibility is an illusion because luck controls everything) or **carefulness** (refining how we assign praise)?

  It argues for **carefulness**.

  If we accept your friend's view (hard revisionism), then *no one* is ever a hero. Every survival involves luck (the bird strike didn't happen 10 seconds later, the rescue boat was 30 seconds away, etc.). If luck negates praise, praise becomes impossible.

  Instead, the Sully/Haynes comparison shows that we intuitively understand **Agency within Luck**.
  1.  **We praise the calibration of risk:** Sully didn't create the luck (the bird strike), but he navigated the luck (the river).
  2.  **We praise the resistance to panic:** Constitutive luck (Sully's temperament) played a role, but we praise the *maintenance* of that temperament under fire.
  3.  **We separate Outcome from Competence:** Haynes proves we can separate the two. We can acknowledge the tragedy of the deaths while honoring the competence that saved the majority.

  **The Verdict for your Argument:**
  Tell your friend that calling Sully a hero isn't a denial of luck; it's an acknowledgment of **luck management**.
  *   **Outcome Luck** is real (if the water was rough, more would die).
  *   **Circumstantial Luck** is real (the river was there to hit).
  *   **But:** Heroism is the act of squeezing the maximum amount of safety out of a lucky set of circumstances that a normal agent would have squandered.

  We praise Sully not because the plane didn't break, but because he made the specific choices that *allowed* the plane not to break. We praise Haynes not because everyone lived, but because he made choices that allowed *anyone* to live.

  Moral luck shouldn't stop us from handing out praise; it should just stop us from thinking the praise is about *magic* rather than *skill*. We aren't praising the universe for being kind; we are praising the pilot for not wasting the universe's kindness.
