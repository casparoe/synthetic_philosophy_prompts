answer: |-
  This is a sophisticated observation of political language, and you are correct that standard logical fallacies like "equivocation" do not quite capture it. Equivocation implies a mistake or a deceitful slide within a single argument; what you are describing is a systemic feature of political discourse where the instability of the term is the very source of its utility.

  There are two established concepts that fit this configuration, depending on whether you approach it from the philosophy of language/political science or from critical theory/discourse analysis.

  ### 1. The Philosophical Term: "Essentially Contested Concepts"
  The most robust established term comes from the philosopher W.B. Gallie (1956). He argued that certain concepts are **inherently subject to endless dispute**, not because of confusion, but because of their internal complexity and evaluative nature.

  *   **The Criteria:** For a concept to be "essentially contested," it must be evaluative (describing something good or bad), internally complex (made of many parts), and open (modifiable in light of changing circumstances). Examples include "democracy," "justice," "art," and indeed, "Western values."
  *   **The Fit:** This captures your observation that users treat the concept as having a "single, stable referent" while disagreeing on what that is. Gallie argued that in these cases, each party claims their usage is the "best" realization of the concept, while acknowledging (ideally) that rivals have a claim too.
  *   **The Mismatch:** Gallie originally assumed a degree of mutual respect—that contestants recognize the contestability. In the modern usage you describe (e.g., "Western values"), speakers often deny the contestability entirely, claiming their definition is the *only* true one and the others are corruptions. This is sometimes called **degenerate contestation**, where the structural features remain, but the goodwill required for productive debate vanishes.

  ### 2. The Critical Theory Term: "Floating Signifiers"
  If Gallie's term feels too polite for the strategic warfare you are describing, the concept of the **Floating Signifier** (associated with Ernesto Laclau, Chantal Mouffe, and Slavoj Žižek) is likely the precise fit.

  *   **The Mechanism:** In semiotics, a "signifier" (the word) is usually attached to a "signified" (the concept). A *floating* signifier is one where the link has been severed. The signifier remains, but the signified is empty or unstable.
  *   **The Function:** Because the signifier is "empty," different political groups struggle to "fill" it with their own specific content to achieve **hegemony**.
  *   **Why it fits your description:** You described the phrase as a "container that gets refilled with different commitments." This is the exact definition of a floating signifier. "Freedom," "The People," and "Western Values" are classic examples. They are powerful precisely *because* they are vague enough to unite disparate groups, yet specific enough to exclude enemies.
  *   **The Strategic Work:** Laclau argues this isn't an accident; it is necessary for politics. To build a coalition, you need a symbol that everyone can agree on, even if they agree on it for contradictory reasons. The conflict arises when one group tries to "fix" the meaning permanently (e.g., "Western values *are* Christian heritage") and exclude the other interpretations.

  ### 3. A Rhetorical Cousin: "God Terms"
  A related concept from rhetoric (Richard Weaver) is the **God Term**. This is a word that holds ultimate authority in a culture (e.g., "Progress," "Science," "Freedom").
  *   **Function:** Invoking a God Term ends argumentation rather than advancing it. It functions as a trump card.
  *   **Relation:** "Western values" often functions as a God Term. However, "God Term" explains the *authority* of the word, while "Floating Signifier" explains the *shifting content* you are interested in.

  ### Why "Equivocation" and "Umbrella Terms" Don't Fit
  *   **Equivocation:** This is a logical fallacy where *one* speaker shifts meanings mid-argument to deceive. In your scenario, the meaning is stable *within* each speaker's worldview; the instability is *between* worldviews. It is a sociological phenomenon, not a logical error.
  *   **Umbrella Term:** An umbrella term (like "vehicle") implies a hierarchy where the sub-categories (car, boat, plane) are acknowledged as valid subsets. In your scenario, the users are not saying "My version is a type of Western value"; they are saying "My version is Western value; yours is not." It is an exclusionary struggle, not a taxonomic one.

  ### Boundary Cases: Where does this end and good-faith disagreement begin?
  You asked where this stops applying. The boundary lies in **resolvability** and **acknowledged stipulation.**

  1.  **Empirical Referents:** If the term refers to something empirically verifiable, it is not a floating signifier. If I say "Western GDP" and you say "Eastern GDP," we can check the data. The moment the term becomes purely evaluative ("Western *Spirit*"), it becomes contestable.
  2.  **Stipulative Definition:** In law or technical science, terms are defined by fiat. If a bill defines "Western Values" as "Signatories of the NATO treaty," the contestation ends (within the context of that bill). Good-faith disagreement acknowledges the need for stipulation; floating signifiers resist stipulation because their power lies in their ambiguity.
  3.  **Acknowledged Perspectivism:** In good-faith disagreement, Speaker A might say, "I know you prioritize sovereignty, but I prioritize rights; both are part of the tradition." In the floating signifier dynamic, Speaker A says, "Sovereignty is the *essence* of the tradition; rights are a corruption." The boundary is crossed when the **internal complexity** of the concept is denied in favor of an **essentialist claim.**

  ### Recommendation
  If you need a term for academic or analytical writing:
  *   Use **Essentially Contested Concept** if you are discussing the philosophical structure of the disagreement and the history of the idea.
  *   Use **Floating Signifier** if you are discussing the power dynamics, the strategic emptiness of the term, and how it is used to mobilize political coalitions.

  Given your description of the phrase as a "container that gets refilled... doing strategic argumentative work," **Floating Signifier** is the most precise fit. It captures the hollowness of the core and the struggle to fill it.

  If you were to coin a descriptive phrase for a general audience, you might call it **Strategic Essentialism** (borrowing from Gayatri Spivak), though she used that to describe marginalized groups temporarily unifying. A more novel term might be **Hegemonic Vagueness**, but **Floating Signifier** is the established terminology for exactly this configuration.
