  2.  **Brainstorming Potential Concepts:**
      *   *Equivocation:* Close, but usually implies one person shifting meaning within an argument, not a systemic societal usage where everyone claims the "true" meaning.
      *   *Essentially Contested Concept (Gallie):* This is the strongest candidate. It describes concepts where disagreement is inherent to the concept itself, yet users claim objective validity.
      *   *Floating Signifier (Laclau/Mouffe):* Very close. Describes a signifier without a fixed signified, used to hegemonize meaning.
      *   *Empty Signifier:* Similar to floating, but emphasizes the lack of content.
      *   *Stretched Concept (Sartori):* When a concept is extended too far to cover too much, losing precision.
      *   *God Term (Weaver):* A term that ends argumentation because it holds ultimate value (e.g., "Freedom," "Progress").
      *   *Persuasive Definition (Stevenson):* Redefining a term to sway emotion while claiming factual accuracy.
      *   *Polysemy:* Linguistic term for multiple meanings, but doesn't capture the *strategic conflict* aspect.
