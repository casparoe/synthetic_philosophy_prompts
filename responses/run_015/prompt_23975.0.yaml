  3.  **Evaluating the Best Fits:**

      *   **Essentially Contested Concept (W.B. Gallie):**
          *   *Pros:* Specifically addresses concepts like "democracy," "justice," "art" where internal complexity allows for rival interpretations, each claiming to be the "true" one. It captures the "no settled extension" and "strategic work."
          *   *Cons:* Sometimes implies a shared core that is just weighted differently. The user's example ("Western values") might be *too* fragmented for Gallie's original strict criteria (which required some shared acknowledgement of contestability, whereas users here deny contestability).

      *   **Floating Signifier (Ernesto Laclau/Chantal Mouffe):**
