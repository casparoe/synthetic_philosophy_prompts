      *   **Top Candidate 2: Floating Signifiers (Laclau/Mouffe).** Explain the "empty container" aspect. This fits the "refilled with commitments" description perfectly. It explains the *political function* (hegemony).
      *   **Secondary Candidate: God Terms (Weaver).** Focus on the rhetorical stopping power.
      *   **Distinguishing from Good-Faith Disagreement:** This is crucial. Good-faith disagreement acknowledges ambiguity or argues over application. This phenomenon involves *ontological claims* (this IS the meaning) and *exclusion* (your meaning is illegitimate).
      *   **Boundary Cases:** Where does it stop? When empirical verification is possible (e.g., "GDP"), or when the definition is stipulative (e.g., legal definitions).

