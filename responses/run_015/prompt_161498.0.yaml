      *   Identify Step 5 as the overreach (ignoring study design).
      *   Address the Decision vs. Inference split (Causal effects vs. Conditional probabilities).
      *   Conclude with advice on the specific publishing data.

      *(Wait, one nuance on Simpson's Paradox)*: If the pseudonym does better in *every* cell, but worse in aggregate, it means the pseudonym submissions are overwhelmingly concentrated in the *harder* cells (low acceptance rate cells). The friend argues we don't know if the cell difficulty causes the low acceptance or if the name causes the low acceptance.
      *   Actually, if Pseudonym does better in *every* cell, the aggregate *must* be driven by the weighting.
      *   Friend says: Maybe the "Cell" is the cause.
