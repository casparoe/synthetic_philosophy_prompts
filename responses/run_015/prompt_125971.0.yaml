  ### Separating Case

  To distinguish between **Rule (c) Domain Restriction** (which requires the description to be true of the object in the restricted domain) and **Rule (b) Pure Referential Use** (which requires only that the object is intended, description can be false):

  **Sentence:** *"The only student who got 100% is asleep."*

  **Facts:**
  *   Speaker points to Bob. Speaker intends to talk about Bob.
  *   Bob is asleep.
  *   Bob got 90%.
  *   Alice got 100% (and is awake).
  *   Context: A classroom setting where grades are public knowledge.

  **Divergence:**
  *   **Domain Restriction (Marta's Verdict 3 style):** **FALSE.** You cannot restrict the domain (e.g., "students in this row") to make Bob the *only student who got 100%*. The predicate "got 100%" is factual, not contextual. The logical form requires a unique satisfier of "got 100%". Bob fails this. Alice satisfies it but isn't the intended object.
  *   **Pure Referential (Marta's Verdict 5 style):** **TRUE.** The speaker has Bob in mind. The proposition is *that Bob is asleep*. The description is merely a tool to identify him. Since Bob is asleep, the utterance is true.

  **Why this separates them:** The Target Case allows *both* rules to yield TRUE (Bob can be the top scorer *on the printout*). This Separating Case forces a choice: does the description *have* to fit (Restriction), or does the object *have* to fit (Referential)? Given Verdict 3's insistence that "logical form still literally contains a description with a uniqueness clause," I predict she would mark this **FALSE**, confirming that Domain Restriction is her primary rescue mechanism, not Pure Referentialism.
