  8. *A student walked in. The student was wearing a hat.* — she says the second one is anaphoric: reuse the variable, don't add a uniqueness clause.

  9. *Every professor praised the student who got the highest mark* — she makes you flag the scope ambiguity and says both readings are genuinely available.

