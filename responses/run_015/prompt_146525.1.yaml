      *   **Core Analogy:** Collective memory $\approx$ Trained Innate Immunity (epigenetic priming, not just antibodies).
      *   **Argument:** Societies *must* keep this priming alive; forgetting atrocities $\approx$ immune suppression, leaving the "body politic" vulnerable to recurrence.
      *   **Specific Task 1:** Create a correspondence table (Pathogen, Priming, Cells, Suppression).
      *   **Specific Task 2:** Identify where the biology-to-society mapping cracks (especially regarding maladaptive immune priming).
      *   **Specific Task 3:** Evaluate whether the moral conclusion ("we must preserve memory") survives the disanalogies or if the analogy was doing all the work.
      *   **Specific Task 4:** If broken, suggest a tighter comparison.
      *   **Reference:** Mention David Rieff (author of *In Praise of Forgetting*), who argues against mandatory collective memory.

  2.  **Deconstruct the Biological Analogy (Trained Innate Immunity):**
      *   *What is it?* It's not adaptive immunity (B/T cells with specific antibodies). It's innate cells (macrophages, NK cells) undergoing epigenetic reprogramming after an infection, making them respond more vigorously to *subsequent* infections (even unrelated ones).
