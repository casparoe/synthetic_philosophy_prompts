answer: |-
  This is a remarkably sharp observation, particularly for someone new to the field. You have identified a tension that lies at the heart of contemporary metaphysics. You are describing the friction between **pre-theoretic intuitions** (what feels right in specific cases) and **theoretical systematicity** (having a single, consistent rule for all cases).

  To answer your primary question directly: There is no single, canonical Latin term (like *ad hominem*) that names this specific argumentative habit. However, philosophers have specific labels for the **phenomenon** you observe, the **defense** of it, and the **critique** of it.

  Here is the breakdown of the terminology, the distinction from equivocation, and the boundary between legitimate theory and argumentative inconsistency.

  ### 1. The Charitable Label: Sortal-Dependence of Identity
  The standard philosophical defense for the pattern you describe is called **Sortal-Dependence** (or **Sortal Relativism**).

  A "sortal" is a concept that supplies a principle of individuation and counting (e.g., "statue," "lump of clay," "aircraft," "collection of parts"). The theory holds that there is no such thing as "identity" in the abstract; there is only "identity relative to a sortal."
  *   **The Rule:** Different kinds of things (sortals) have different **persistence conditions**.
  *   **The Application:** A *statue* persists via form; a *lump* persists via matter. An *aircraft* (functional artifact) persists via causal history; a *collection of parts* persists via mereological sum.

  From this viewpoint, the criteria are not "shifting" arbitrarily; they are fixed to the *kind* of object being discussed. The "shift" you perceive is simply the result of switching which sortal is dominant in the conversation.

  ### 2. The Critical Label: Intuition Mongering / Ad Hocery
  However, your critique is that this sortal-dependence is often invoked *post-hoc* to save the intuitive verdict of a specific case, without a prior principle explaining *why* a thing falls under one sortal rather than another.

  When philosophers (or interlocutors) select the sortal that yields the desired intuitive result without a governing meta-principle, critics label this:
  *   **Intuition Mongering:** Relying on case-specific intuitions to drive the theory, rather than deriving verdicts from a consistent theory.
  *   **Special Pleading:** Applying a standard (e.g., "matter matters") in one case but suspending it in another ("matter doesn't matter") without a relevant difference justifying the exception.
  *   **Lack of Systematicity:** A failure to provide a "unified field theory" of identity.

  In recent years, **Experimental Philosophers (X-Phi)** have empirically studied this. They often find that folk intuitions about these cases are inconsistent across cultures and contexts. They might describe the pattern you noticed as **Folk Metaphysical Inconsistency**.

  ### 3. How It Differs from Equivocation
  You asked how this differs from simple equivocation. This is a crucial logical distinction.

  *   **Equivocation** occurs when a single term is used with *different meanings* in the same argument, rendering it invalid. (e.g., "The sign said 'fine for parking,' so I thought it was a good place to park.")
  *   **Sortal-Shifting** (your pattern) does not necessarily change the meaning of "is the same object." Instead, it changes the **truth conditions** for the statement based on the **context** or **subject**.

  A better logical comparison is **Contextualism**. In contextualism, the truth of a statement depends on the context of utterance. Here, the truth of "X is the same as Y" depends on the *conceptual framework* (sortal) being applied. It is not a fallacy of language (equivocation); it is a claim that reality itself is structured differently for different kinds of entities.

  However, if the speaker claims there is *one* true notion of identity but secretly swaps criteria to win an argument, *then* it becomes equivocation (or deception).

  ### 4. The Boundary: Principled vs. Arbitrary
  You asked for the precise boundary that separates this from a legitimate view that different categories have different rules.

  **The Boundary is the Meta-Principle.**
  *   **Legitimate Sortal Relativism:** The philosopher provides a **meta-ontological principle** that predicts *which* persistence conditions apply to *which* objects *before* looking at the specific cases.
      *   *Example:* "All **functional kinds** (statues, planes) persist via continuity of function/history. All **material kinds** (clay, atoms) persist via spatiotemporal continuity of matter."
      *   If this rule is stated upfront and applied consistently, it is a valid theory.
  *   **Arbitrary Shifting (The Fallacy):** The philosopher looks at the case, sees what the "common sense" answer is, and *then* selects the sortal that matches it.
      *   *Example:* "The statue is gone because it's a functional kind. The plane remains because it's a functional kind. The reassembled plane is gone because... well, it feels like a collection of parts now."
      *   If the classification of the object changes *to match the desired verdict*, it is **Ad Hoc**.

  ### 5. Proposed Terminology
  Since there is no single established term for the *negative* pattern you identified (the unprincipled shifting), but you require one for your own analysis, I suggest the following descriptive terms which are precise enough for philosophical discourse:

  1.  **Criterion Volatility:** This captures the instability of the standards used to judge identity.
  2.  **Retrospective Sortal Selection:** This highlights that the category is chosen *after* the intuition is consulted, rather than *before* as a governing rule.
  3.  **Verdict-Driven Metaphysics:** This implies the metaphysics is being constructed to support the verdict, rather than the verdict following from the metaphysics.

  ### Summary for Your Analysis
  As a scientist, you are looking for a **Law of Persistence**.
  *   When philosophers claim different objects obey different laws, they are proposing **Sortal-Dependence**.
  *   When they fail to specify *why* an object falls under one law rather than another, and simply swap laws to match intuition, they are engaging in **Special Pleading** or **Ad Hocery**.
  *   The specific move of swapping between "matter tracks identity" and "form tracks identity" without a governing rule is best described as **Unprincipled Criterion Shifting**.

  Your intuition that this looks like a lack of a unified theory is shared by many naturalist philosophers (like Willard Van Orman Quine or David Armstrong) who argued that metaphysics should be as systematic as physics. The "shift" you notice is often the point where armchair metaphysics fails to meet that scientific standard.
