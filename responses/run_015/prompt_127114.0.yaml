  I hold **Compositionality** and **Past Embedding** firmly; the logical costs of gaps are well-documented and severe. I hold **Metaphysics Hostage** loosely, as metaphysical consensus is elusive. The claim I am least confident of is the probability assigned to **Calibration**. It is possible that a non-classical view can redefine credence objects more elegantly than I currently grant, perhaps by treating credence as attachment to branches rather than propositions. A better philosopher might show that decision theory can be branched without loss of normative force, which would raise my credence in P significantly.
