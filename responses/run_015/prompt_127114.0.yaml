  You are a philosopher whose research sits in the metaphysics of time and philosophical logic, and who has taught the future-contingents literature at graduate level. I want a considered verdict from that position, so do the informal work before you commit to anything: sketch the positions on the table, the strongest version of each, and where you think the real crux lies. Only then give me the number. No citations, no reading suggestions, and no stopping at "it depends which framework you accept."

  The claim I want a credence on:

  (P) The correct semantics for tensed discourse does not assign a classical truth value, as of now, to a contingent future-tensed claim such as "there will be a sea battle tomorrow" — that is, some non-classical treatment of future contingents is correct (truth-value gap, supervaluational, or otherwise), as against treatments that preserve bivalence: readings on which such a sentence is already true or already false in virtue of how things will turn out; branching-time readings on which "will" quantifies over the futures that remain open; and readings that distinguish what is true from what is settled, marking the unsettledness with something like a thin red line through the actual future.

  To give the question teeth, I want P evaluated under two constraints I have been using in my own work.

  Call the first the contingency-profile test. The sea-battle intuition is standardly said to be driven by the future's being open, but "open" can mean at least three things, and they come apart in these cases: (i) a quantum event with objective chance 0.5, say the decay of a particular atom within the hour; (ii) a coin flipped by a machine, deterministic in principle and unpredictable in practice because of chaotic sensitivity to micro-conditions; (iii) a fact that is not contingent at all but merely uncomputed, such as whether the trillionth digit of pi is odd, or whether some unproved conjecture is true. If what drives the intuition is genuine metaphysical indeterminacy, only (i) should feel open. If it is causal unsettlement, (i) and (ii) should feel alike. If it is merely epistemic inaccessibility, all three should feel alike — and then the gap treatment looks like a general skepticism about bivalence for the unknown, which almost no one wants. Which profile does the intuition actually have, and does that profile support or undermine P?

  Call the second the calibration constraint. Whatever semantics you favour has to say what we are doing when we put a probability on a future contingent: I am at 0.4 that the admiral engages, I would take either side of a bet at roughly those odds, and my 0.4 is calibrated against the frequencies of similar events. If the sentence has no truth value as of now, what is the object of that 0.4? Does your answer preserve the link between credence and expected frequency, or does it have to say that my 0.4 is really a credence about something else — about what will be true, or about which branch I am on? Charge the view for the cost if so.

  Then give me:

  1. A single number — your credence in P — to two decimal places. Not a range, not "somewhere in the middle."
  2. The decomposition: four to six sub-questions whose probabilities combine, under a rule you state explicitly, to roughly that number. I want at least these terms in it: whether the datum the gap theorist is explaining is really about truth value rather than about settlement, knowability, or control; whether a non-classical semantics can be made to compose across negation, disjunction, conditionals, and embeddings under past-tense operators — the worry being that a gap in the future spreads backwards into soft facts about the past; whether the contingency-profile test favours P; whether the calibration constraint can be met without theft; and whether the verdict on P is hostage to a prior commitment about the metaphysics of time (branching, growing block, eternalism). Add any term you think I have missed, with a number and a one-line justification for each.
  3. Which sub-question your number is most sensitive to, with a one-line justification; and the single argument or piece of evidence that, if you could have it tomorrow, would move the number most.
  4. Where the disagreement with my co-author probably lives. I am at about 0.4 on P; she is at about 0.75. Given your decomposition, say which term or terms most plausibly separate two people at those numbers, and what each of us would have to concede in order to converge.
  5. An epistemic note on your own answer: mark each sub-question as one you hold firmly or loosely, and single out the one claim in the whole response you are least confident of — the place where you suspect a better philosopher would correct you.

  Aim for 700–900 words, with the number first and the decomposition immediately after it.
