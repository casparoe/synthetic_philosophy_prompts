answer: |-
  # HANDOUT: The Molyneux Decision Tree
  **Seminar: Philosophy of Perception** | **Topic: Cross-Modal Content**

  **Root:** A person blind from birth gains sight. Shown a cube and a globe (known by touch). Can they identify them by sight alone?

  **Q1. Method:** Is the verdict settled by running the experiment (**Empirical**) or by reflection on what a spatial representation could be (**Conceptual**)?
  *   **Conceptual** → Go to **Q3**.
  *   **Empirical** → Go to **Q2**.

  **Q2. Timing (Variant 1: The Delayed Test):** If empirical, does success require weeks of visual-tactile pairing (**Delayed**), or is it immediate upon restoration (**Immediate**)?
  *   **Delayed** → Go to **Q3**.
  *   **Immediate** → Go to **Q3**.

  **Q3. Format:** Do sight and touch share a single amodal spatial format (**Amodal**), or does each sense have proprietary content (**Proprietary**)?
  *   **Amodal** → Go to **Q7**.
  *   **Proprietary** → Go to **Q4**.

  **Q4. Success Condition:** Does solving the case require phenomenal similarity between how the thing looks and feels (**Phenomenal**), or merely reliable forced-choice matching (**Behavioral**)?
  *   **Phenomenal** → **Leaf 1** (Incoherent Zone).
  *   **Behavioral** → Go to **Q5**.

  **Q5. Content:** Could the subject pick out the right object demonstratively while having *no* representational content in common across the senses (**Demonstrative**)?
  *   **Demonstrative** → Go to **Q6**.
  *   **Representational** → Go to **Q6**.

  **Q6. Concept Load (Variant 2: The Unnameable Solid):** Must the shape be one the subject can name (**Nameable**), or can it be an irregular polyhedron they have felt often but lack a word for (**Unnameable**)?
  *   **Nameable** → **Leaf 2**.
  *   **Unnameable** → **Leaf 3**.

  **Q7. Medium (Variant 3: The Picture Variant):** If the subject shares a format (or succeeds), does the match hold for a photograph/line drawing (**Picture**), or only the 3D object (**Solid**)?
  *   **Picture** → **Leaf 4**.
  *   **Solid** → **Leaf 5**.

  *(Note: Paths from Q2 "Immediate" and Q5 "Representational" branch to specific leaves below to ensure 8-10 endpoints.)*

  ---

  ### LEAF POSITIONS & COMMITMENTS

  **Leaf 1: The Phenomenal Proprietarian** (Reached via Q3→Q4 Phenomenal)
  *   **Position:** Unoccupied / Incoherent.
  *   **Awkward Commitment:** Claims proprietary contents can feel similar without a common metric to compare them.
  *   **Status:** **Incoherent.** (No historical holder).

  **Leaf 2: The Conceptualist** (Reached via Q6 Nameable)
  *   **Position:** McDowellian Conceptualism.
  *   **Awkward Commitment:** Denies non-conceptual perceptual content; the blind subject lacks the concept "cube" visually until trained.
  *   **History:** **Speculative.** (Applied retroactively from epistemology).

  **Leaf 3: The Sensorimotor Theorist** (Reached via Q6 Unnameable)
  *   **Position:** O'Regan & Noë Enactivism.
  *   **Awkward Commitment:** Vision is not internal representation but mastery of external sensorimotor contingencies.
  *   **History:** **High Confidence.** (Explicitly addresses Molyneux).

  **Leaf 4: The Amodal Realist** (Reached via Q7 Picture)
  *   **Position:** Geometric Nativism (Leibnizian).
  *   **Awkward Commitment:** A 2D projection contains the same spatial content as a 3D solid; depth is intellectually inferred, not seen.
  *   **History:** **Charitable Reading.** (Leibniz implies common format, picture extension is modern).

  **Leaf 5: The Standard Empiricist** (Reached via Q7 Solid + Q2 Delayed)
  *   **Position:** Lockean/Berkeleian Associationism.
  *   **Awkward Commitment:** The newly sighted world is initially a flat mosaic of colors with no spatial depth.
  *   **History:** **High Confidence.** (Traditional attribution).

  **Leaf 6: The Nativist Empiricist** (Reached via Q2 Immediate + Q3 Amodal)
  *   **Position:** Gallistel / Cognitive Ethology.
  *   **Awkward Commitment:** Spatial geometry is innate but requires empirical trigger; neural wiring is pre-configured for transfer.
  *   **History:** **Moderate Confidence.** (Supported by some cataract data).

  **Leaf 7: The Relationalist** (Reached via Q5 Demonstrative)
  *   **Position:** Naive Realism (Campbell).
  *   **Awkward Commitment:** Perceptual content is constituted by the object itself; no "content" is transferred, only the object's presence.
  *   **History:** **Moderate Confidence.** (Fits the view, not explicitly Molyneux-focused).

  **Leaf 8: The Associative Learner** (Reached via Q5 Representational + Q2 Delayed)
  *   **Position:** Humean Associationism.
  *   **Awkward Commitment:** Spatial unity is a fiction created by habit; there is no "space," only constant conjunctions.
  *   **History:** **High Confidence.** (Standard reading of Hume).

  **Leaf 9: The Unoccupied Immediate Proprietarian** (Reached via Q2 Immediate + Q3 Proprietary)
  *   **Position:** Unnamed.
  *   **Awkward Commitment:** Claims immediate transfer despite no common format and no learning time.
  *   **Status:** **Unexplored.** (Biologically implausible).

  **Leaf 10: The Picture Aspectualist** (Reached via Q7 Picture + Q3 Proprietary)
  *   **Position:** Wollheim / Scruton Aesthetic Theory.
  *   **Awkward Commitment:** Seeing a picture is a distinct mental state from seeing a solid; cross-modal transfer fails for 2D media.
  *   **History:** **Low Confidence.** (Applied from aesthetics to perception).

  ---

  ### LOGICAL SPACE ANOMALIES

  **Empty Combinations:**
  *   **Q3 Proprietary + Q4 Phenomenal (Leaf 1):** Marked **Incoherent**. Without a common format, "similarity" between vision and touch is category error.
  *   **Q2 Immediate + Q3 Proprietary (Leaf 9):** Marked **Unexplored**. Biologically implausible; no theory predicts immediate learning without common format.

  **Indistinguishable Leaves:**
  *   **Leaf 3 (Sensorimotor) & Leaf 8 (Associative):** The tree cannot separate these on Molyneux's case alone. Both predict "No" on immediate test, "Yes" on delayed. They separate only on the *nature* of the learning (motor mastery vs. mental association).

  ---

  ### INSTRUMENT WEAKNESS NOTE

  **Most Contestable Branch:** **Q3 (Format).**
  The split between "Amodal" and "Proprietary" rests on a contested reading of what constitutes a "format." Many modern empiricists argue for "weak" amodality (abstract geometry) that functions like proprietary content in practice.

  **Contested Leaf Placement:** **Leaf 5 (Standard Empiricist).**
  Placing Locke/Berkeley here assumes they deny *all* immediate spatial content. Some scholars argue Locke allowed for immediate visual extension, which would move them toward Leaf 6.

  **Redrawing Condition:**
  If empirical data from cataract patients (e.g., Held et al. 2011) shows **immediate** success on **unnameable solids** but failure on **pictures**, the tree collapses. This would force a merger of Q2 (Timing) and Q6 (Concept Load), suggesting spatial content is innate but concept-dependent, requiring a new "Innate Conceptualist" branch.
