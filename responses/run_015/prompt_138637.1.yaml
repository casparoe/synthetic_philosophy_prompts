answer: |-
  I'll concede the math: you're right that potential-based reward shaping doesn't change the optimal policy within a fixed Markov Decision Process (that's just a formal way of saying a specific environment with defined rules and states). And you're right that utility theory always has some scaling ambiguity. But your analogy to affine transformations is where I dig in. An affine transformation (stretching or shifting a scale) preserves the ranking of outcomes universally, regardless of the environment. Your shaping equivalence only preserves the ranking of trajectories within the specific dynamics and starting state you observed.

  Here's the rub: we want "preferences" to be properties of the agent that generalize to new situations. But your equivalence class is tethered to the current environment's physics. The guarantee that $R$ and $R'$ are equivalent relies on that specific starting state $s_0$ and those specific transition rules. If I change the dynamics—say, I make it harder to move left versus right—or if I drop the agent into a new starting state, the relationship between those two reward functions might no longer look like a simple constant shift. So when you "quotient out" this equivalence, you haven't found the agent's true preferences; you've only found their preferences relative to this specific world. The underdetermination remains because behavior in one setup doesn't lock down how those rewards translate to a different setup, which is exactly what we need if we claim to have recovered something real.
