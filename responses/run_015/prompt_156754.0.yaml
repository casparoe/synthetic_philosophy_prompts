  This instrument sorts positions in the logical space of Newcomb's Problem using seven branch questions. None ask directly for your choice in the standard case. Three nodes utilize specific variants (Simulation, Copy, Open-Prediction). The tree yields fourteen leaves, including three explicitly empty cells.

