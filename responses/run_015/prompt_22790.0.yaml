answer: |-
  ### The Example: Theory of Mind Mechanisms Applied to Fictional Characters

  A compelling example of a representational mechanism exapted for a new representational function is the human **Theory of Mind (ToM) system** (involving neural structures such as the temporoparietal junction and medial prefrontal cortex) being co-opted for **engaging with fictional narratives**.

  **1. The Original Selected Function**
  According to evolutionary psychology, the ToM mechanism was naturally selected to attribute mental states (beliefs, desires, intentions) to **living conspecifics** (other humans).
  *   **Representational Content:** "Agent $X$ believes $P$."
  *   **Proper Function:** To accurately track the mental states of real agents in the environment to predict their behavior, facilitate cooperation, and navigate social hierarchies.
  *   **Success Condition:** The attributed mental states correspond to the actual mental states of a living person, leading to successful social interaction.

  **2. The Exapted Function**
  Humans universally use this same mechanism to attribute mental states to **fictional characters** (e.g., believing "Harry Potter wants to defeat Voldemort").
  *   **New Representational Content:** "Fictional Agent $Y$ believes $P$."
  *   **New Function:** To engage in storytelling, entertainment, and social bonding through shared cultural myths.
  *   **Success Condition:** The user successfully follows the narrative and experiences the intended emotional/cognitive engagement, despite the agent not existing.

  ---

  ### The Problem for the Etiological (Millikan-Style) Account

  Ruth Millikan's teleosemantics posits that the content of a representation is determined by the **Proper Function** of the mechanism producing it. A Proper Function is defined historically: it is the function for which the mechanism was selected by natural selection (or learned reproduction). A representation **misrepresents** when the mechanism performs its Proper Function but fails to meet the conditions required for success (e.g., a map shows a road where there is none). A **malfunction** occurs when the mechanism is broken and cannot perform its Proper Function at all.

  The exaptation of ToM for fiction poses two specific problems for this framework:

  #### 1. Does the new function count as the mechanism's Proper Function?

  **The Dilemma:**
  *   **Strict Etiological View:** No. The ToM mechanism was not selected by natural selection for processing non-existent entities. There is no evolutionary history of survival benefits gained specifically from tracking fictional agents (as fiction is a recent cultural invention). Therefore, strictly speaking, representing fictional mental states is not a "Proper Function" of the biological mechanism; it is a "hijacking" or side-effect.
  *   **The Problem:** If the new function is not a Proper Function, the etiological account struggles to explain the *normativity* of the new use. When we reason about Harry Potter, there are correct and incorrect inferences (e.g., it is correct to say he wants to defeat Voldemort; incorrect to say he wants to bake a cake). If the mechanism has no Proper Function in this domain, Millikan's theory lacks the resources to ground these norms. It implies that the mechanism is operating "off-label," yet it operates with high reliability and normative structure. To account for the validity of fictional reasoning, the theory would need to admit that Proper Functions can shift without new natural selection, which undermines the core historical definition of the theory.

  #### 2. Do false representations produced under the new function count as misrepresentations or malfunctions?

  **The Dilemma:**
  Consider the representation: *"Harry Potter exists and has a scar."*
  *   **Reality:** Harry Potter does not exist.
  *   **Mechanism Status:** The ToM system is functioning perfectly (not damaged/broken).

  **Option A: It is a Misrepresentation.**
  *   **Reasoning:** If the Proper Function is fixed by history (tracking *real* agents), then the content of the representation is "A real person exists..." Since no real person exists, the representation is false. Because the mechanism is working (not broken), this counts as a **misrepresentation**.
  *   **The Problem:** This implies that every time a human engages with fiction, their cognitive system is systematically producing errors. It classifies a universal, adaptive, and culturally vital human capacity as a state of constant cognitive failure. This stretches the concept of "misrepresentation" until it loses its explanatory power. If a system is doing exactly what it is supposed to do in its current context (enjoying a story), but the etiological theory labels it "error" due to ancient history, the theory fails to capture the current normative status of the mind.

  **Option B: It is not a Misrepresentation (Content Shift).**
  *   **Reasoning:** We might argue the content is actually *"In the story, Harry Potter exists..."* Thus, it is true, and not a misrepresentation.
  *   **The Problem:** For the content to shift to "In the story...", the **Proper Function** of the mechanism must have shifted to "Tracking fictional narratives." However, under Millikan's etiological account, Proper Functions cannot shift without a history of selection (or reproduction of the pattern). Since there is no natural selection history for "fiction tracking," the theory cannot legitimately grant the mechanism a new Proper Function that validates the content.
  *   **Malfunction?** It cannot be a malfunction, because the system is not broken; it is performing the new task flawlessly.

  ### Conclusion

  The case of Theory of Mind applied to fiction demonstrates a tension in etiological teleosemantics between **historical origin** and **current utility**.
  1.  If Proper Function is tied strictly to history, the exapted use is "improper," and valid cognitive activities (fiction) are classified as systematic **misrepresentations**.
  2.  If Proper Function is allowed to track current utility to avoid this absurdity, the theory abandons its core etiological constraint (selection history), making it difficult to distinguish between genuine functions and mere causal effects.

  This suggests that a purely historical account of mental content may be insufficient to explain the flexibility of representational mechanisms that are co-opted for novel cognitive niches faster than natural selection can track.
