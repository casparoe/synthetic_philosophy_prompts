answer: |-
  The real disagreement underneath your argument is not about honesty, selection, or even Plutarch. It is about the **teleology of memory**. You and your friend are arguing over what the dead are *for*.

  Your friend operates on a **Diagnostic Theory** of memory. For him, the point of recounting a life is to produce an accurate map of human moral psychology. If the map is distorted, the lesson is false. A flawed hero teaches you how virtue survives vice; a sanitized hero teaches you a fantasy. He believes the eulogy fails because it prioritizes the emotional state of the audience over the moral truth of the subject.

  You operate on a **Constitutive Theory** of memory. For you, the point of recounting a life is to bind the living community together around a shared aspiration. The dead person is no longer a moral agent; they are now a resource for the living. The eulogy is not a verdict on the deceased; it is a instruction manual for the survivors. You believe the eulogy succeeds because it prioritizes the future moral capacity of the audience over the historical completeness of the subject.

  Here is the breakdown of the practice, the alternative, and the weak points in this analysis.

  ### 1. What the Eulogy Presupposes
  The practice of the eulogy, as you described it, rests on four specific philosophical commitments that differ from standard historiography:

  *   **Character is Fragmentary and Retrospective:** The eulogy presupposes that "character" is not a fixed internal score, but a collection of impacts on others. By selecting the "small unguarded stuff," the eulogist asserts that character is best known through *residue* (how people felt) rather than *resume* (what people achieved). This aligns with Plutarch, but diverges on the *use* of that data.
  *   **Narrative Selection is Not Falsification:** The practice assumes that truth in a ritual context is not defined by comprehensiveness. A map of the London Underground is "true" despite omitting every building above ground, because its purpose is navigation, not geography. The eulogy presupposes that omitting the deceased's temper or failures is not a lie, but a change of scale. It is a map for grief, not a survey for history.
  *   **The Dead are Non-Agents:** This is the critical pivot. You cannot hurt a dead person's reputation in a way that matters to *them*. Therefore, the ethical obligation shifts entirely to the living. The "praise norm" is not about protecting the deceased; it is about protecting the mourners' ability to function.
  *   **Idealization is a Pedagogical Tool:** The eulogy presupposes that moral imitation requires a stable target. If you tell a grieving child, "Your father was generous but also an alcoholic who lied to his boss," the moral lesson is paralyzed by complexity. If you say, "Your father was generous," the child has a handle to hold. The practice assumes that **clarity trumps nuance** in moments of acute vulnerability.

  **Is the praise norm philosophical work or etiquette?**
  It is philosophical work. It is the active construction of a **moral commons**. By agreeing to speak only good, the community performs a speech act that says: *"We are choosing to be bound by the best version of ourselves, as reflected in this person."* If it were mere etiquette, it would feel hollow. When it works, it feels like a vow.

  ### 2. The Friend's "Plutarchan" Eulogy
  If we built a eulogy on your friend's theory (that moral instruction requires the full picture of virtue and vice to be valid), it would not look like a eulogy. It would look like a **Post-Mortem Audit**.

  It would happen in a neutral venue, not a place of worship or mourning. The speaker would not be a loved one, but a biographer or peer. It would sound like this:
  > "John was a man of immense courage, shown clearly in 1994 when he saved the drowning child. However, that same courage manifested as recklessness in his marriage, where he refused to back down from arguments, causing his wife significant distress. He was generous with money, often to a fault, which enabled his brother's addiction. We gather to learn from this totality: that virtue unchecked becomes vice, and that his greatness and his failures sprang from the same root."

  **Why this fails as a eulogy:**
  1.  **It treats the dead as a defendant:** It assumes the purpose is a verdict.
  2.  **It demands cognitive load from the grieving:** It asks the audience to hold complex dialectics when they are emotionally incapacitated.
  3.  **It destroys the exemplar:** You cannot imitate a dialectic. You can imitate "generosity." You cannot imitate "generosity-to-a-fault-that-enabled-addiction."

  Your friend is right that this is more *historically* honest. But he is wrong that it is more *morally* useful in that specific context. He is grading the eulogy on its success as history, rather than its success as ritual.

  ### 3. The Inconsistency (Saint vs. Sinner)
  You noted the culture's inconsistency: flawless eulogy vs. cancel-culture takedown. This is not a contradiction in character theory; it is a consistency in **social utility**.

  *   **The Eulogy (Integration):** When someone dies, the community risks fragmentation. The praise norm is a mechanism to re-integrate the group. We make them a saint to stabilize us.
  *   **The Takedown (Purging):** When a living person is "cancelled" or a biography exposes a monster, the community is drawing a boundary. We make them a sinner to purify us.

  In both cases, the actual complexity of the human being is sacrificed for the needs of the group. The eulogy says, "We are all connected by his good." The scandal says, "We are all safe because he is gone." Neither is interested in the truth of the person; both are interested in the cohesion of the tribe. Your friend sees this as hypocrisy. I argue it is **functionalism**. The "theory of character" underneath both is that character is a public resource, not a private reality.

  ### 4. Where My Answer is Weakest
  You asked for the soft spots in this reconstruction. Here are the two places where my defense of your position (the Constitutive Theory) is most vulnerable to your friend's critique.

  **A. The Problem of Abuse and Complicity**
  My argument collapses if the "praise norm" forces the community to lie about harm. If the deceased was abusive, and the eulogy sanitizes that abuse, the ritual ceases to be "moral instruction" and becomes **gaslighting**.
  *   *The Counter-Argument:* If a father beat his children, and the eulogy says "He was a strict disciplinarian who loved hard," the eulogy is not just idealizing; it is actively harming the survivors by validating their trauma as virtue.
  *   *Why this changes my mind:* If the selection of details crosses from "omitting flaws" to "reframing harm as good," the praise norm is no longer philosophical work; it is ethical corruption. In these cases, your friend is right: the genre breaks. A "Plutarchan" acknowledgment ("He was difficult and often cruel, though he provided for us") might be the only way to preserve the truth without destroying the ritual.

  **B. The Problem of Impossible Standards**
  I argued that idealization helps imitation. The counter-argument is that **perfection paralyzes**.
  *   *The Counter-Argument:* If every eulogy presents a flawless saint, the living may conclude that moral worthiness is unattainable. "He never lost his temper, never lied, always took the worst shift." The listener thinks, "I could never be that." This kills moral ambition rather than fueling it. Plutarch included flaws precisely to show that greatness is accessible to flawed people.
  *   *Why this changes my mind:* If psychological evidence suggests that idealized models reduce self-efficacy in the grieving, then the "Constitutive Theory" is empirically wrong. The praise norm would then be "pure etiquette" that actively undermines the moral instruction you claim it provides.

  ### Summary for Friday
  Tell your friend this: He is treating the eulogy as a **failed biography**. You are treating it as a **successful liturgy**.
  *   **Biography** seeks truth about the *subject*.
  *   **Liturgy** seeks transformation of the *audience*.

  He is right that eulogies are historically false. You are right that they are ritually true. The disagreement is not about the dead; it is about whether the living need a mirror (Plutarch) or a lighthouse (Eulogy).

  **Your strongest move:** Concede that the "Two Jobs" theory (Exemplar vs. Diagnosis) is the only way to resolve the tension, but admit the risk: if the Exemplar is too polished, it becomes useless. The eulogy walks a razor's edge between inspiration and fiction. If it slips into fiction, he wins. If it stays inspiration, you win. The practice assumes it can stay on the edge. He doubts it can.
