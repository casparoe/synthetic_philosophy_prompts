answer: |-
  Christopher Hawkes, "The Problem of Inferential Archaeology" (1968), is the correct attribution. Your reverse-engineering intuition maps cleanly onto his ladder, but the Antikythera mechanism stresses the structure where Hawkes assumed uniform decay of information. Below is the stress test.

  ### 1. The Mapping
  **Rung 1 (Technique/Manufacture):** The object licenses high-precision bronze casting, gear cutting, and inscribing. *Inference:* The physical tolerances and differential gear train require specialized tooling and metrology. *Break Point:* We cannot infer the specific tools used (lathes vs. files) without tool marks, only their capability.
  **Rung 2 (Economy/Subsistence):** The object licenses the existence of surplus wealth and specialized labor. *Inference:* Bronze was expensive; skilled hours were high. *Break Point:* We cannot infer the funding model (state subsidy vs. private commission) or the maker's economic status (slave artisan vs. wealthy scholar).
  **Rung 3 (Social/Political Institutions):** The object licenses the existence of a network capable of sustaining mathematical astronomy. *Inference:* Knowledge transmission required institutions (schools, workshops). *Break Point:* As an orphan object with no comparanda, we cannot infer the institutional structure (state observatory vs. private salon) or the political utility (navigation vs. propaganda).
  **Rung 4 (Religious/Intellectual Life):** The object licenses specific cosmological models and mathematical knowledge. *Inference:* The gear ratios encode specific lunar/solar cycles (Metonic, Saros). *Break Point:* It licenses technical modeling, not theological commitment; owning a planetarium does not prove belief in divine planetary agency.

  The chain breaks hardest between Rung 2 and 3. We know it was expensive (2), but not who paid or why (3).

  ### 2. Inference Table

  | Rung | What the Object Licenses | What It Does Not License (However Tempting) | Single Further Find/Measurement |
  | :--- | :--- | :--- | :--- |
  | **1. Technique** | High-precision gear cutting; differential mechanism knowledge. | Specific tooling inventory or workshop lineage. | Microscopic tool-mark analysis matching known tools. |
  | **2. Economy** | High labor cost; access to raw materials (bronze, tin). | Market value, trade routes, or maker's class status. | Isotopic analysis of bronze matching specific mines. |
  | **3. Society** | Existence of skilled specialists; knowledge transmission networks. | Political patronage, intended user class, or institutional setting. | A contemporary manifest or letter referencing the device. |
  | **4. Intellect** | Specific astronomical parameters; geometric modeling capability. | Religious dogma, philosophical school, or "scientific method" usage. | A matching textual treatise on the device's operation. |

  ### 3. The Lens Inversion
  Your suspicion is correct: this is a genuine inversion of Hawkes' difficulty curve, but only for *cognitive artifacts*. Hawkes assumes information degrades as you move from physical to abstract. Here, the abstract (astronomical models) is encoded directly into the physical (gears), making Rung 4 (Intellect) more recoverable than Rung 3 (Society).

  This is not a muddle about "belief" if you distinguish *technical belief* (models of reality) from *religious belief* (ritual commitment). The mechanism forces a reconstruction that must execute (your "runnability" constraint); if the gears don't predict eclipses, the hypothesis fails. This provides a ground truth for Rung 4 that pottery or architecture never offers. However, it remains silent on Rung 3 because the object is decontextualized. The inversion holds: we know exactly what they knew about the moon, but nothing about who owned the moon model. The object carries its own intellectual source code but lost its social metadata.

  ### 4. Methodological Impact
  1.  **Vindicates Material Capacity:** It disproves the assumption that complex abstract thought leaves no material trace unless written. The material record can hold high-fidelity algorithmic data, challenging the "primitive mind" bias often applied to pre-modern societies.
  2.  **Exposes Survival Bias:** The "uniqueness" of the mechanism is likely a artifact of the survival filter (bronze survives seawater; wood/papyrus does not). Treating it as a singular peak of technology rather than a surviving node of a broader tradition is a sampling error.
  3.  **Breaks Typology:** Standard archaeological inference relies on sequence and comparanda. As an orphan object, it resists typological dating and functional classification, exposing the method's weakness when the sample size is *n*=1.
  4.  **Limit Case, Not Proof:** This is an unrepresentative limit case. It demonstrates the *upper bound* of what material culture can reveal (intellectual models), not the *average* recoverability. Using it to calibrate general inference risks overestimating what typical assemblages can support.

  ### 5. The Unanswerable Question
  **Question:** What was the operational context of use (ritual, educational, navigational, or display)?
  **Required Evidence:** Provenance data independent of the object (e.g., a ship's log, a owner's letter, or iconographic depiction of the device in use). The object encodes *capability*, but capability does not dictate *usage*; a sextant can be a navigational tool or a gentleman's paperweight, and the bronze cannot distinguish the two.
