answer: |-
  **OFFICE OF SUFFICIENT OUTCOMES**  
  **GUIDANCE BULLETIN 44-B**  
  **SUBJECT:** COMPLIANCE WITH THE DECISION FRUGALITY ACT (DFA)  
  **DATE:** 14 OCTOBER 202X

  **1.0 GENERAL INQUIRIES REGARDING ACCEPTABILITY THRESHOLDS**

  **Q: How does a citizen determine the "good enough" bar for a given decision?**  
  A: The Office publishes quarterly Acceptability Tables based on regional averages. Citizens are reminded that aspiration levels are dynamic. If a citizen meets their threshold for three consecutive cycles, the threshold automatically creeps upward to prevent complacency. Conversely, following a run of failures, the bar slides downward to ensure morale remains sufficient. Do not attempt to game this adjustment mechanism; emotional distress is a valid compliance metric.

  **Q: Isn't stopping at three options just optimisation with search costs priced in?**  
  A: This is a common misconception. If the cost of searching for a fourth option exceeds the expected gain, stopping is technically optimal. The DFA does not ban optimisation; it bans the *calculation* of whether optimisation is worth it. Therefore, if you stop because you are tired, you are compliant. If you stop because you calculated that being tired makes stopping optimal, you are in violation. The mental act of pricing the search is itself a search cost.

  **Q: What if the fourth option was significantly better than the first three?**  
  A: This indicates a skewed option pool. In a normal environment, the scissors of cognition and reality meet at "adequate." If the environment hides a superior option behind the third choice, the environment is at fault, not the decision procedure. Citizens are advised to avoid niche markets where outlier quality is statistically probable. Stick to commoditised goods where mediocrity is evenly distributed.

  **Q: Can I hire a proxy to search for me?**  
  A: Yes. Authorised Search Proxies (ASPs) may evaluate thousands of options on your behalf. While the ASP optimises flat-out for millions of clients, you only see their top three recommendations. The optimisation has not vanished; it has been offloaded to a higher level. You remain procedurally rational while benefiting from substantive rationality performed elsewhere. This is compliant.

  **Q: How does the Office detect unauthorized optimisation?**  
  A: Enforcement requires modelling the citizen's optimal search path to see if they deviated from it. To police optimisation, the Office must optimise its detection algorithms. We acknowledge the irony. Currently, the Compliance Division consumes 40% of the national computing budget to ensure no one is thinking too hard. This expenditure is deemed sufficient.

  **Q: Does the Office satisfice its own budget requests?**  
  A: The Office seeks "resource adequacy." However, because underfunding risks insufficient oversight, the adequacy threshold is set at the maximum conceivable appropriation. We satisfice on your behalf so you do not have to optimise on ours.

  **2.0 WORKED EXAMPLE: APARTMENT SELECTION**

  **Scenario:** Citizen X needs housing.  
  **Step 1:** Citizen X views Unit A (Rent: $1,000, Condition: Poor). Reject.  
  **Step 2:** Citizen X views Unit B (Rent: $1,200, Condition: Acceptable).  
  **Step 3:** Citizen X views Unit C (Rent: $1,250, Condition: Good).  
  **Compliance Check:** Unit B meets the Acceptability Table for Sector 7. Citizen X signs lease for Unit B.  
  **Violation:** Citizen X viewed Unit C. Since Unit B was sufficient, viewing Unit C constitutes unnecessary search.  
  **Correct Action:** Sign lease for Unit B immediately upon entry. Do not look at the closet. Do not ask about water pressure. Water pressure is a variable beyond the scope of sufficient habitation.

  **3.0 CITIZEN TESTIMONIAL**

  *"Before the Act, I spent six months comparing toothpaste abrasiveness. Now I buy the first tube that says 'mint.' I haven't flossed in years, but my decision latency is down 90%."*  
  — **J. ARIS, SECTOR 4**
