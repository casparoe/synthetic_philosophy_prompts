answer: |-
  This is a fantastic set of notes for a tutorial. You have correctly identified the weak point in the standard presentation of the argument: the slide from "It is true" to "It is necessary."

  Your flatmate is suffering from a category error. They are answering a *physical* question (is the universe deterministic?) to solve a *logical/semantic* problem (does the law of bivalence entail fatalism?). A logical fatalist doesn't care about physics; they care about truth conditions.

  Here is the menu of "The Future is Open" claims, broken down by the axes you requested, ready for your tutorial.

  ### 1. The Epistemic Reading ("We Just Don't Know")
  *   **The Claim:** The proposition "There will be a sea battle" is already true or false. The future is settled. We just lack the information to know which.
  *   **Open for whom?** Open for us (epistemic). Closed for an infallible predictor/God (ontic).
  *   **Open until when?** It was never open. It was settled at the beginning of time.
  *   **"Already in the can"?** Everything is in the can. The sea battle is as settled as the bouncing cheque.
  *   **Blocks Fatalism?** **No.** This is exactly what the fatalist wants. If the truth value is fixed, the fatalist argues deliberation is pointless.
  *   **Status:** **Trivial/False.** It admits defeat against the fatalist. It explains why we *feel* uncertain, but not why we *can* influence the outcome.
  *   **Verdict:** This is likely what your flatmate means colloquially, but it is useless for the tutorial.

  ### 2. The Physical Indeterminist Reading ("Quantum Dice")
  *   **The Claim:** The current physical state of the universe + laws of nature does not entail a unique future. There are physically possible futures where the battle happens and some where it doesn't.
  *   **Open for whom?** Open for everyone, even an infallible predictor (because there is nothing to predict).
  *   **Open until when?** Open until the quantum wavefunction collapses (or the event occurs).
  *   **"Already in the can"?** The bouncing cheque is "in the can" (classically determined). The sea battle is not (probabilistic).
  *   **Blocks Fatalism?** **No.** This is the flatmate's go-to, but it fails against *Logical* Fatalism. The fatalist replies: "Okay, so it's random. But is it true *now* that it will land heads? If yes, it's necessary. If no, bivalence fails." Physical randomness doesn't save you from logical necessity if bivalence holds.
  *   **Status:** **Substantive (Physics), Irrelevant (Logic).** It costs you a specific view of physics, but it doesn't touch the argument about truth values.
  *   **Verdict:** Your flatmate is definitely using this. It sounds deep but misses the point of Aristotle's puzzle.

  ### 3. The Truth-Value Gap Reading (Aristotle's Traditional View)
  *   **The Claim:** Future contingent propositions (like "sea battle tomorrow") are **neither true nor false** today. Bivalence does not apply to the future.
  *   **Open for whom?** Ontically open. There is no fact of the matter for anyone.
  *   **Open until when?** Open until the moment the event happens (or the decision is made).
  *   **"Already in the can"?** The bouncing cheque *is* true now (because the present state entails it). The sea battle is not (because human action intervenes).
  *   **Blocks Fatalism?** **Yes.** It blocks the first premise. If the statement isn't true now, it can't be necessary now.
  *   **Status:** **Substantive & Costly.**
      *   *Cost:* You lose the Law of Excluded Middle (either P or not-P). As you noted, "I will feed the cat" becomes neither true nor false, which makes promising weird. It requires a non-classical logic (e.g., 3-valued logic).
  *   **Verdict:** The strongest logical block, but metaphysically expensive.

  ### 4. The Ockhamist Reading ("True, but Soft")
  *   **The Claim:** The proposition *is* true or false now (Bivalence holds), **BUT** its truth is not a "hard fact" about the present. It is a "soft fact" that depends on future free actions.
  *   **Open for whom?** Ontically settled (there is a truth), but causally open.
  *   **Open until when?** The truth exists now, but it doesn't become "fixed/necessary" until the event.
  *   **"Already in the can"?** Distinguishes between *truth* and *necessity*. The cheque bouncing is a hard fact (necessary). The battle is a soft fact (contingent).
  *   **Blocks Fatalism?** **Yes.** It blocks the move from "True Now" to "Necessary Now." It accepts bivalence but denies that truth implies causal fixity.
  *   **Status:** **Substantive.**
      *   *Cost:* Requires a robust distinction between "hard facts" (about the present) and "soft facts" (about the future embedded in the present). Some philosophers argue this distinction is shaky.
  *   **Verdict:** This is the sophisticated compatibilist move. It saves bivalence and saves freedom.

  ### 5. The Branching Time / Supervaluationist Reading
  *   **The Claim:** Time is a tree, not a line. There are many future branches. "There will be a sea battle" is true on some branches, false on others. Therefore, it is not "true simpliciter" (without qualification) now.
  *   **Open for whom?** Ontically open. All branches are real.
  *   **Open until when?** Open until the "branching point" passes (the moment of decision).
  *   **"Already in the can"?** The cheque bouncing is true on *all* branches (given present physics). The battle is true on only *some*.
  *   **Blocks Fatalism?** **Yes.** Denies that there is a unique truth value to be necessary.
  *   **Status:** **Substantive.**
      *   *Cost:* Metaphysically heavy (modal realism about time). Also faces the "assertion problem": If I say "I will feed the cat," and I'm only feeding it on 50% of branches, am I lying?
  *   **Verdict:** A more formal version of Reading 3. Good for logic tutorials, heavy for metaphysics.

  ### 6. The Truthmaker / Priority Reading ("Action Makes Truth")
  *   **The Claim:** The proposition is true, but the **direction of explanation** is reversed. It is not true *and therefore* I do it; I do it *and therefore* it is true.
  *   **Open for whom?** Open for agents who are the truthmakers.
  *   **Open until when?** Open until I act.
  *   **"Already in the can"?** The cheque bounces because of *past* truthmakers (account balance). The battle happens because of *future* truthmakers (my decision).
  *   **Blocks Fatalism?** **Yes.** It blocks the "why bother?" conclusion. The truth of the prediction depends on your deliberation, so deliberation is essential to make the prediction true.
  *   **Status:** **Substantive.**
      *   *Cost:* Requires a theory of truth where future truths depend on future events (which seems circular or requires backward causation of truthmakers).
  *   **Verdict:** This is usually what people *mean* intuitively when they say "the future is open."

  ---

  ### Addressing Your Specific Axes Questions

  **1. Open for whom?**
  *   If it's only open for *us* (Reading 1), the fatalist wins.
  *   If it's open for *God/Physics* (Readings 2, 3, 5), the fatalist is blocked, but you pay a metaphysical cost.
  *   **Tutorial Point:** Ask your flatmate: "If an omniscient God looked at tomorrow, would He see a battle or no battle?" If He sees a battle, the future isn't ontically open, and you need Reading 4 or 6 to save freedom.

  **2. Open until when?**
  *   Most readings say it closes at the **moment of the event**.
  *   However, if you accept "Already in the can" (causal determination), it closed years ago.
  *   **Tutorial Point:** The fatalist argues it closed at the beginning of time. The Indeterminist says it closes at the quantum collapse. The Aristotelian says it closes at the assertion of the fact.

  **3. The "Already in the can" problem**
  *   **The Line:** The line is between **Causal Determination** and **Logical Truth**.
  *   The cheque bounces because the *present state* causally necessitates it.
  *   The sea battle (allegedly) does not.
  *   **The Trap:** The Fatalist argues that even if it isn't *causally* necessitated, if it is *logically* true now, it is fixed.
  *   **Solution:** You must argue (Reading 4 or 6) that logical truth does not imply causal fixity.

  **4. Partial Openness (Probabilities)**
  *   **Problem:** You are right to be suspicious. If "Neither True nor False" is the view, probabilities are hard to handle.
  *   **Handling it:** Supervaluationism (Reading 5) handles this best. "It is 70% likely" means "It is true on 70% of the accessible future branches."
  *   **Does it become true at 51%?** No. On the Gap view, it remains neither T nor F until 100%. On the Branching view, it is "indeterminate" until the branch is selected.
  *   **Tutorial Point:** Probabilities apply to *events*, not necessarily to the *truth values of propositions* about them.

  **5. Settled by what I do (Truthmaker Priority)**
  *   **Does it count as open?** Yes, in the sense that the truth value is *dependent* on your open choice.
  *   **Does it do the work?** Yes. It dissolves the "why bother?" worry. If my deliberation is required to make the proposition true, then my deliberation is not futile.
  *   **Flatmate Check:** This is the only reading that validates the flatmate's intuition ("it's not written yet") without sacrificing logic or physics.

  ---

  ### Summary for the Tutorial

  **Your Opening Question:**
  "Does the fatalist need the claim to be *true now*, or just bivalent?"
  *   **Answer:** They need it to be **true now AND that truth to be a 'hard fact'**. If it is true now but depends on my future action (Reading 6), the argument fails. If it is neither true nor false (Reading 3), the argument fails. Mere bivalence isn't enough; they need **Necessity**.

  **Diagnosis of the Flatmate:**
  *   They are using **Reading 2 (Physical Indeterminism)**.
  *   **Why it fails:** It confuses *causal* determination with *logical* fatalism. Even if the universe is random, the statement "The coin will land heads" is either true or false now. If it's true, the fatalist says it's necessary. Physics doesn't solve the logic puzzle.
  *   **What they should be using:** **Reading 4 (Ockhamism)** or **Reading 6 (Truthmaker Priority)**. These allow the statement to be true without making the action necessary.

  **The "Cat Promise" Cost:**
  *   If you go with Reading 3 (No Truth Value), your flatmate is right to be weirdly fine with it, but you should point out that this makes *all* future talk meaningless. "I will meet you at 5pm" would be neither true nor false. That's too high a price for language.
  *   Better to go with Reading 6: "I will meet you" is true *because* I will choose to meet you. It's true, but not coercive.

  **Recommendation:**
  Push **Reading 6 (Truthmaker Priority)** or **Reading 4 (Soft Facts)**. They preserve the intuition that the future is open, keep classical logic mostly intact, and directly block the "why bother" conclusion without denying that statements about the future can be true.
