  Been chewing on advance directives after digging through old LW threads on personal identiy across time. There's this line people throw around: "past you is just another agent, so an advance directive is no more binding than a contract with a stranger." Separate the precise claims hiding in that one sentence—there's the Humean bundle version, the psychological-continuity cutoff version, and the weirder claim about normative authority not transferring across temporal parts even if diachronic identity holds. Say which ones are platitudes, which depend on a theory of diachronic authority that'd blow up contract law if taken seriously, and which reading bioethicists actually need when they reject living wills. Give me the full menu with verdicts, don't just pick the "personal identity is fuzzy" interpretation and run with it. Also, where does the "earlier self has privileged epistemic access to your true values" argument fit? Is that a separate claim or just smuggling in authority?
