answer: |-
  This sentence is a philosophical grenade. It conflates ontology (what exists), metaphysics (what persists), and normativity (what binds). To unpack it, we need to separate the *descriptive* claim about identity from the *prescriptive* claim about authority.

  Here is the full menu of claims hiding in "Past you is just another agent," categorized by their metaphysical commitments, their legal implications, and their utility in bioethics.

  ### 1. The Humean Bundle / Stage Theory Claim
  **The Claim:** There is no enduring "self." There are only temporal stages (time-slices). The entity that signed the advance directive (AD) at $t_1$ is numerically distinct from the entity in the hospital bed at $t_2$. They are related by causality and similarity, but they are not the *same object*.
  *   **Metaphysical Status:** Radical Reductionism (Parfitian). It denies trans-temporal identity in favor of psychological/physical connectedness.
  *   **Is it a Platitude?** No. It contradicts the legal and folk-psychological assumption that persons are enduring substances.
  *   **Impact on Contract Law:** **Catastrophic.** If the "promisor" at signing and the "performer" at execution are distinct agents, *no* long-term contract is binding. A mortgage is a contract between a 2024 stage and a 2054 stage. If they are distinct agents, the 2054 stage has no obligation to pay the 2024 stage's debt. Taking this seriously dissolves the concept of obligation over time.
  *   **Bioethics Usage:** **Rarely explicit.** Bioethicists generally avoid hard metaphysical claims because they don't need to. If they use this, it's usually implicit in arguments that severe dementia creates a "new person." However, most bioethicists stop short of claiming the patient *literally* ceased to exist, focusing instead on interests.

  ### 2. The Psychological Continuity Cutoff Claim
  **The Claim:** Personal identity holds *only* so long as specific psychological connections (memory, character, values) remain intact. Severe dementia or radical value shift severs the identity relation. The AD signer and the patient are the same *organism* but not the same *person*.
  *   **Metaphysical Status:** Lockean Psychological Continuity. It distinguishes between "human being" (biological) and "person" (psychological).
  *   **Is it a Platitude?** No, but it is intuitively appealing. It aligns with the feeling that a loved one with late-stage Alzheimer's is "gone."
  *   **Impact on Contract Law:** **Destabilizing.** Contract law relies on *legal* personhood, which is tied to biological life and corporate status, not psychological continuity. If psychological discontinuity voids obligations, a radical religious conversion or personality shift could void a lease. Law explicitly rejects this to ensure stability.
  *   **Bioethics Usage:** **High.** This is the Rebecca Dresser critique of Ronald Dworkin. Dworkin argues for "precedent autonomy" (the past self rules). Dresser argues that when psychological continuity breaks, the "past self" loses its privileged standing because the "current self" has its own experiential interests that cannot be sacrificed for a "person" who no longer exists psychologically. Bioethicists use this to justify overriding ADs when the current patient seems content (the "happy dementia" problem).

  ### 3. The Normative Authority Decoupling Claim
  **The Claim:** Even if metaphysical identity *holds* (you are literally the same entity), **normative authority does not automatically transfer.** The fact that $t_1$-You and $t_2$-You are identical does not explain *why* $t_1$-You gets to dictate terms to $t_2$-You. Identity is necessary but not sufficient for authority.
  *   **Metaphysical Status:** Neutral. It accepts identity but rejects the inference from "is" to "ought."
  *   **Is it a Platitude?** **Yes, in ethics; No, in law.** Ethically, it's a standard challenge to paternalism. Legally, it is rejected; the law *presumes* authority transfers across time as a function of citizenship and agency.
  *   **Impact on Contract Law:** **Theoretical Threat.** Contract law assumes diachronic authority is a brute fact of agency. If you demand a justification for *why* your future self must obey your past self, you are questioning the foundation of planning. However, law solves this pragmatically: if you don't want to be bound, don't sign.
  *   **Bioethics Usage:** **Critical.** This is the strongest argument against rigid AD enforcement. It allows bioethicists to say, "Even if this is the same person, the *interests* have changed so drastically that the past preference no longer represents the welfare of the current entity." It shifts the debate from "Who is this?" to "Whose interests count?"

  ---

  ### The Verdicts

  | Claim | Platitude? | Legal Viability | Bioethics Utility |
  | :--- | :--- | :--- | :--- |
  | **1. Humean/Stage** | No. | **Zero.** (Voids all debt/promises). | Low. (Too metaphysical). |
  | **2. Psychological Cutoff** | No. (Contested). | **Low.** (Law ignores mental continuity for identity). | **High.** (Core of Dresser's critique). |
  | **3. Normative Decoupling** | **Yes** (Ethically). | **Medium.** (Law assumes it, but capacity laws probe it). | **Highest.** (Allows "Best Interest" override). |

  **The "Contract with a Stranger" Metaphor:**
  This metaphor specifically relies on **Claim 3**. It admits that contracts with strangers *are* binding (legally), but implies that the *moral* weight of an AD should be no heavier than a request from a stranger. It suggests that without psychological continuity, the *internal* authority of the AD collapses into an *external* request.

  ---

  ### The "Epistemic Access" Argument: Where does it fit?

  **The Argument:** "Earlier self has privileged epistemic access to your true values."
  *   **Classification:** This is **not** an identity claim. It is a **competence and trusteeship claim.**
  *   **Function:** It attempts to repair the Normative Authority Decoupling (Claim 3).
  *   **Analysis:**
      *   If you accept Claim 3 (authority doesn't automatically transfer), you need a bridge to explain why the past self *should* rule.
      *   The Epistemic Access argument provides that bridge. It argues that the past self was a better *trustee* for the global life narrative than the compromised current self.
      *   **Is it smuggling in authority?** Yes. It smuggles in authority via **competence**. It treats the past self as a "sober guardian" and the current self (e.g., in dementia or acute crisis) as "temporarily incapacitated."
      *   **The Flaw:** It works for temporary incapacity (Ulysses contracts for addiction or depression). It fails for permanent value shifts (dementia). If the "current self" genuinely values staying alive and the "past self" valued dignity over life, the past self didn't have *better* access to the *current* values; they had access to *different* values.
      *   **Verdict:** This argument rescues Advance Directives from the "Stranger" objection *only if* you assume values are static and the current self is cognitively impaired regarding those static values. If values themselves evolve (adaptive preferences), the epistemic privilege vanishes.

  ### Summary for the Bioethicist

  When a bioethicist rejects a living will, they are rarely arguing Claim 1 (Humean bundles). They are usually arguing a hybrid of **Claim 2** and **Claim 3**:

  1.  **Psychological Discontinuity:** The patient's current experiential interests (Claim 2) are so disconnected from the past narrative that the "person" who wrote the AD is effectively gone.
  2.  **Normative Decoupling:** Even if the person remains, the *authority* of the past preference is outweighed by the *welfare* of the current being (Claim 3).

  The "Contract with a Stranger" line is a rhetorical shorthand for **Normative Decoupling**. It warns against treating *precedent autonomy* as a trump card over *current welfare*.

  **Final Warning:** If you adopt the "Past self is a stranger" view to invalidate ADs, you must accept the corollary: **Future you is a stranger to Present you.** This undermines the rationality of saving for retirement, quitting smoking, or making *any* plan. The law rejects the "stranger" thesis not because it is metaphysically false, but because agency requires the fiction of diachronic unity to function. Bioethics is the edge case where that fiction creates moral harm.
