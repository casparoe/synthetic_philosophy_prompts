  hey so i need help writing a speech. im a senior and im giving a 4-ish minute speech at this "rule review" assembly next friday — whole school in the gym, teachers lined up against the wall looking bored, principal there, and also some lady from the district office who does "student voice" stuff who's apparently coming to watch. its about one rule: phones have to be in your locker during passing periods, not just silenced in your pocket. at the end of the assembly everyone votes on their phone and ms. okonkwo said shell go with whatever wins unless its a safety thing, so it kind of actually matters.

  heres my problem. i started the petition to get rid of the rule back in september, im literally the reason its on the ballot. and ive sort of changed my mind, or at least ive stopped being sure, and now im the one giving the case for keeping it — except i dont want it to be "the case for keeping it," i want it to be honest, and i also really dont want to make maya look bad because shes giving the repeal speech right after me and shes still my friend and shes sitting in the front row. and i cant pretend i know why the rule exists because i dont. nobody i asked does. we asked three teachers and they all just kind of shrugged.

  the thing i keep coming back to is that chestertons fence idea (the thing where if you cant see what the fence is for you dont get to take it down yet — go away and come back when you can say what it was keeping in or out). but i need it to do actual work in the speech and not just be something i mention and then pivot into respect-for-tradition talk, which is definatly not my thing. some specific stuff i want it to deal with:

  - i read somewhere about there being three kinds of old rule: ones whose reason died but the rule keeps going anyway, ones that are still holding something up, and ones that were only ever needed while something else was being built and then never got taken down, like scaffolding. i dont know which kind this is and neither does anyone else, and i feel like not knowing which one it is should change what the right move is?? but i dont know how to say that without it sounding like "so do nothing forever."
  - the strongest thing maya is going to say is probably: if it turns out to matter we can just put it back next year. i dont have a good answer to that except a feeling that some things you can put back and some things you cant, and that it has something to do with whether the rule works because basically everybody follows it. like if the reason the rule works is that everyone follows it, then one person ignoring it is basically free, which means from inside your own head it always looks like a pointless rule — and it also means once people stop you cant just flip a switch and have it back. i think that IS the actual argument but i cant get it straight and it sounds weird in my head.
  - we only asked teachers. the crossing guard has been here since forever and so has the night custodian and neither of them is going to be in the gym.

  one more thing that makes it weirder: were moving to the new building next year and it doesnt have lockers. like at all, its those little cubby things instead. so "keep the rule exactly as is" isnt even physically possible, and i think the speech has to somehow separate what the fence was FOR from what the fence actually LOOKED LIKE — im just not sure how to do that without it sounding like a compromise written by a school board.

  so: write me the speech. 4 minutes, so like 500 words ish, dont go over. it has to be something i can actually say out loud in front of 800 people without sounding like im reading an essay, it has to be honest about the fact that i was on the other side three months ago, it has to give maya something to be right about instead of steamrolling her, and it has to end with something concrete people can actually vote on. the freshmen are mostly there because they want their phones and they will tune out anything that sounds like an adult talking, so dont let it turn into that.
