answer: |-
  Thanks for laying this out so clearly. It is rare to see the commitments stated this plainly, which makes the audit much easier to perform. You are right to feel there is a seam, and in fact, there are two distinct pressure points where the package is under significant stress. The first is between your second and third commitments, and the second is between your first and sixth. I will walk through these tensions and then suggest where the least costly adjustments lie.

  The most immediate contradiction lies between your second and third points. You state that special relativity is physically correct in the strong sense, meaning the relativity of simultaneity is a real feature of the world, but you also state there is a definite fact of the matter about what is happening right now on a distant planet. These two claims are logically incompatible if taken as ontological descriptions of reality. If the relativity of simultaneity is a real feature of the world, then there is no unique, frame-independent fact about which distant events are simultaneous with your present. If there is a definite fact of the matter about distant simultaneity, then the relativity of simultaneity is not a real feature of the world but rather an artifact of our measurement or coordinate systems. You mentioned that you added the third point specifically to keep presentism from getting crushed by relativity, and you are correct that this move saves presentism, but it does so by effectively downgrading your second commitment. You are adopting a neo-Lorentzian view where there is a privileged frame of reference that is empirically undetectable. This means special relativity is empirically adequate but ontologically incomplete. You cannot hold that the relativity of simultaneity is a real feature of the world and also hold that there is an absolute simultaneity. One of them has to be the appearance and the other the reality. If you keep both as written, you are asserting a contradiction. To restore consistency here, you must clarify that while special relativity is correct about measurements and laws, it is not correct about the underlying metaphysical structure of spacetime. The cost you pay is scientific realism regarding spacetime geometry; you are positing a structure to the universe that physics itself says is undetectable and unnecessary for prediction.

  The second major tension exists between your presentism and your truthmaker theory. This is known in the literature as the truthmaker objection to presentism. If only the present exists, and every true proposition must be made true by something that exists, then you face a problem with past-tensed claims like the dinosaurs went extinct. The dinosaurs do not exist, and the event of their extinction does not exist. So what currently existing thing makes that proposition true? You cannot point to the past entities themselves because you deny they exist. Most presentists resolve this by rejecting truthmaker maximalism for past-tensed claims, but you have explicitly committed to it. To maintain this, you must adopt what is called Lucretianism, which claims that present objects possess special past-tensed properties, such as the world having the property of having-contained-dinosaurs. Alternatively, you might posit abstract objects that exist now and represent the past. Both options carry metaphysical costs. The Lucretian view is often criticized for multiplying properties ad infinitum and making them brute facts without further explanation, while the abstract object view risks turning your presentism into a form of eternalism by proxy if those abstract objects encode the full structure of the past. If you do not specify what these truthmakers are, your first and sixth commitments are currently incompatible because there is nothing in your ontology to do the work required by the sixth commitment.

  Your commitments regarding the passage of time and the open future are actually the most stable part of the package. The idea that the now advances and the future is open fits naturally with presentism. However, combining the open future with truthmaker theory requires care. If the future is genuinely open, then propositions about future contingents might lack a truth value, or they might be true but made true by present tendencies or propensities rather than settled facts. If you insist that every proposition about the future must have a truth value and a truthmaker, you risk collapsing the openness you want to preserve. You need to ensure your truthmaker theory allows for indeterminacy, perhaps by accepting that some future-tensed propositions are neither true nor false until they become present, or by grounding them in present causal powers. This is manageable, but it requires you to be precise about how truthmakers function for non-existent futures compared to non-existent pasts.

  There is also a hidden commitment in your third point that you should be aware of. By asserting a definite fact of the matter about distant simultaneity, you are implicitly committing to a preferred reference frame for the universe. This often leads to a view where the laws of physics are symmetric but the ontology is not. This can feel like a violation of the spirit of modern physics, even if it is not strictly ruled out by empirical data. It also raises the question of why this privileged frame is invisible to our instruments. If you are willing to accept that the universe has a hidden structure that violates the principle of relativity at the ontological level while preserving it at the empirical level, you can maintain this view, but you must acknowledge that you are departing from the standard interpretation of special relativity. You are not finding a way around the conflict between presentism and relativity so much as you are choosing presentism over the standard ontological interpretation of relativity.

  To restore consistency with the least cost, you have a few options depending on what you value most. If preserving presentism is your highest priority, you must soften your second commitment. You should state that special relativity is empirically correct but metaphysically incomplete, allowing for your third commitment to stand as the ontological truth. This saves your view of time but costs you on scientific realism. Alternatively, if you want to keep the strong sense of special relativity, you must abandon presentism for eternalism, which removes the need for absolute simultaneity and solves the truthmaker problem for the past easily since past entities exist in the block. If you wish to keep both presentism and the strong reading of relativity, you would have to abandon your truthmaker maximalism for past-tensed claims, allowing some truths to be brute or grounded in something other than existing entities. Given your setup, the least costly change is likely to clarify the status of special relativity. Admit that you are a Lorentzian presentist who believes in a privileged frame that physics cannot detect. This makes the seam between points two and three explicit rather than contradictory. Then, you must specify your truthmakers for the past, likely by adopting Lucretian properties, to close the gap between points one and six. Once you make those two adjustments, the package holds together, but it rests on a metaphysics that is heavier and less parsimonious than the standard scientific worldview.
