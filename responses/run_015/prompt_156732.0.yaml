answer: |-
  You are struggling because "manipulation" is not a natural kind; it is a cluster concept tracking at least two distinct moral complaints that often overlap. Your intuition is correct: no single elegant sentence will capture every verdict without distortion. However, we can unify them under a core violation of **agential sovereignty**.

  Here is the principle, broken into three clauses as requested. I call this **The Sovereignty Account**.

  ### The Principle

  An influence attempt is manipulative if and only if it satisfies **Clause 1** AND **Clause 2**, unless it is exempted by **Clause 3**.

  **Clause 1 (The Opacity Condition):** The effectiveness of the influence relies, in whole or in part, on the target's ignorance of the influencer's *intent* to steer them.
  *   *Motivating Cases:* This handles the **Grad Student** (hides the transactional intent behind flattery) and the **Drug Ad** (hides the commercial intent behind vibes). It excludes the **Senior Colleague**, who states outright that she is framing the talk.

  **Clause 2 (The Vulnerability Condition):** The influence exploits a cognitive, emotional, or situational vulnerability that burdens the target's capacity for reflective deliberation.
  *   *Motivating Cases:* This handles the **Dept Chair** (exploits fatigue/absence) and the **Doctor's Guilt Trip** (exploits fear of moral failure). It excludes the **Friend** (timing a request when you are calm is not exploiting a vulnerability; it is accommodating your psychology).

  **Clause 3 (The Justification Exemption):** The influence is *not* manipulative if it occurs within a relationship where the target has implicitly or explicitly delegated authority over that domain to the influencer, or where the ends are genuinely shared.
  *   *Motivating Cases:* This saves the **Therapist** (you delegate trust-management to her), the **Partner** (shared domestic ends), and the **Union Organizer** (shared class interests). It condemns the **PR Firm** (divergent ends: profit vs. public interest) and the **Grad Student** (divergent ends: her career vs. your time).

  ---

  ### Repairing the Tell Test

  Your "Tell Test" fails because it measures *efficacy* rather than *authority*. Some things work even when known (anchoring); some things fail when known but are still legitimate (therapeutic framing).

  Replace it with **The Ratification Test**:
  > *Could the target, upon full disclosure of the mechanism and intent, reasonably endorse the influence as consistent with their own values and the norms of the relationship?*

  *   **Therapist:** Yes. You endorse the goal (health), so you ratify the method.
  *   **Negotiator:** Yes. Anchoring is a known rule of the game; you ratify the context of negotiation.
  *   **Grad Student:** No. You would not endorse being flattered for a favor.
  *   **Dept Chair:** No. You would not endorse a vote rigged by fatigue.

  ---

  ### The Hard Case: Union Organizer vs. PR Firm

  You say these are structurally identical and refuse to give up the verdicts (Union = Fine, PR = Not Fine). My account preserves your verdicts, but only by leaning heavily on **Clause 3 (Justification)**.

  *   **Union Organizer:** The workers and the organizer share a normative end (better conditions). The "public" is being appealed to as moral agents to recognize a injustice. The timing is tactical, but the relationship is one of *advocacy*, which carries an expectation of strategic framing.
  *   **PR Firm:** The corporation and the public have divergent ends (profit vs. welfare). The relationship is ostensibly *informational* (news), but the timing treats the public as a *psychological target*.

  **The Verdict to Overturn:**
  If I must overturn exactly one of your verdicts to make the theory watertight, I would overturn your intuition on the **Nudge (Salad/Default)**.
  *   *Your Verdict:* Fine, but it nags.
  *   *My Verdict:* **Manipulative.**
  *   *Why:* It satisfies Clause 1 (you don't notice the default) and Clause 2 (exploits inertia/cognitive load). It fails Clause 3 (unless it is a strict fiduciary context like a doctor's order, cafeteria defaults usually lack delegated authority).
  *   *Reasoning:* Your "nag" is correct. It *is* manipulation. It is often *benign* or *paternalistic* manipulation, but calling it "not manipulative" blurs the category. Admitting it is manipulation allows us to argue about whether *benign* manipulation is permissible, rather than pretending it isn't happening.

  ---

  ### Running the Account on New Cases

  **1. The Recommendation Feed (Algorithmic)**
  *   *Analysis:* Satisfies Clause 1 (opaque intent: engagement/profit). Satisfies Clause 2 (exploits cognitive vulnerabilities/dopamine loops). Fails Clause 3 (no shared end; you want truth/entertainment, it wants time-on-site).
  *   *Verdict:* **Manipulative.** This is the industrialization of the Grad Student case.

  **2. The Student Who Tears Up**
  *   *Analysis:*
      *   *Scenario A (Sincere):* If the tears are involuntary, Clause 1 is not met (no intent to steer). Not manipulative.
      *   *Scenario B (Performative):* If the tears are a tactic, Clause 1 is met. Clause 2 is met (exploits your empathy/vulnerability). Clause 3 is failed (divergent ends: grade vs. standards).
  *   *Verdict:* **Manipulative (if performative).** This is distinct from the Partner/Tea case because the power asymmetry is reversed (student vs. teacher) and the end is not shared (evaluation vs. support).

  **3. The Silent Colleague (Withholding Objection)**
  *   *Analysis:* Satisfies Clause 1 (opacity of intent to let the plan fail or succeed unchallenged). Satisfies Clause 2 (exploits the situational vulnerability of "too late to stop"). Fails Clause 3 (colleagues owe each other professional candor).
  *   *Verdict:* **Manipulative.** This is a form of *strategic omission*. It treats your agency as a tool for their political safety.

  ---

  ### Limitations and Seams

  I promised to tell you if the word covers different complaints. It does. There is a seam between **Deceptive Manipulation** (Clause 1 dominant: Drug Ad, Grad Student) and **Coercive Manipulation** (Clause 2 dominant: Chair, Doctor Guilt).

  *   **Deceptive Manipulation** violates your *epistemic* agency (you don't know what's happening).
  *   **Coercive Manipulation** violates your *volitional* agency (you know, but you can't resist the pressure).

  The **Union/PR** case sits on the seam. If you feel the PR firm is manipulative because they *lie*, that's Clause 1. If you feel it's because they *pressure*, that's Clause 2. My account forces you to specify which norm they violate.

  Finally, a warning on the **Partner/Tea** case. My account saves it via Clause 3 (Shared Ends). But this is the most fragile clause. If your partner makes tea *knowing* you are stressed to *disable* your refusal, Clause 2 kicks in and it becomes manipulative even in a relationship. The difference between care and control is often just the *end* being pursued, which is why you couldn't tell if you "didn't mind" or if "it wasn't manipulation." On this account, if you wouldn't ratify the intent upon disclosure, it's manipulation, regardless of love.
