          3.  The Trilemma (Non-dictatorship + Range + SP = Impossible).
          4.  Domain Restrictions (The only escape, but difficult in multidimensional space; risk of migration).

  8.  **Final Polish:** Check against the prompt's specific phrasing.
      *   "Does the theorem apply independently... or does nesting alter...?" -> Applies to the global function; nesting doesn't alter the impossibility.
      *   "If designers require... what structural constraints must they accept?" -> They must accept that one condition fails (usually SP).
      *   "Could restricting the domain... provide a genuine escape... or would strategic incentives merely migrate?" -> Escape only if global preferences are restricted; otherwise, migration occurs.

      *(Self-Correction during drafting)*: Be careful not to say "G-S applies to Tier 1 and Tier 2 independently." G-S applies to *any* SCF. Tier 1 is an SCF mapping scholar prefs to field scores. Tier 2 is an SCF mapping rep prefs (and field scores) to portfolios. If both are non-dictatorial and have range, both are manipulable. But the *global* system is the critical one. I should emphasize the global mapping.

