answer: |-
  ### 1. The Shift from Sovereign to Disciplinary Power
  **Foucault:** The movement from the public, spectacular exercise of punishment (the scaffold) to the capillary, surveilling, productive power of the institution (the prison/school/factory).

  1.  **Restatement:** The transition from an omniscient narrator who explicitly pronounces judgment on a character's moral status (sovereign verdict) to a narrative structure where the *limitations of focalization* themselves enforce constraint, producing plot outcomes without explicit commentary (disciplinary mechanism).
  2.  **The Distortion:** This restatement smuggles in the **Author as Architect**. In craft terms, a shift in narrative mode is a deliberate choice made by a writing subject to achieve an effect. Foucault's shift is historical and systemic, occurring without a deciding agent. You imply a designer; Foucault describes a drift.
  3.  **The Untranslatable:** The **material productivity** of power. In your vocabulary, narrative constraint limits what can be *said* or *shown*. For Foucault, disciplinary power produces *reality* (skills, habits, labor capacity). A novel can describe a trained body, but the text itself cannot train the character's body; it can only describe the training. The ontology of the character remains static regardless of the narrative pressure.

  ### 2. The Panopticon as Architectural Principle
  **Foucault:** Visibility is a trap. It is not a specific building but a mechanism of consciousness that induces in the inmate a state of conscious and permanent visibility that assures the automatic functioning of power.

  1.  **Restatement:** The structural asymmetry of the **reader's epistemic position**: the reader occupies the tower, viewing the character's observable behavior without being seen, while the character remains confined to their interiority, unaware of the specific moment of observation.
  2.  **The Distortion:** This assumes the **Reader as Witness**. In craft, the reader's gaze is passive and hermeneutic (interpreting meaning). In the Panopticon, the gaze is active and corrective (modifying behavior). Your vocabulary treats the gap between viewer and viewed as a space for irony or empathy; Foucault treats it as a space for behavioral modification.
  3.  **The Untranslatable:** The **internalization of the gaze as ontology**. A character can *feel* watched (paranoia), but they cannot *be* constituted by the watchfulness in the text. In the novel, interiority exists prior to the gaze. In the Panopticon, the soul is the effect of the gaze. You have no term for a consciousness that is created by the fact of being read.

  ### 3. Docile Bodies
  **Foucault:** Bodies that are subjected, used, transformed, and improved through precise coercion and minute techniques of power.

  1.  **Restatement:** The subordination of a character's **interiority to their observable behavior** within the **mechanics of a scene**, such that the body executes the plot's necessity regardless of psychic resistance, rendering the will irrelevant to the action.
  2.  **The Distortion:** This implies a **Dualism of Will and Action**. Your craft vocabulary presupposes a "true" interiority that is being suppressed or aligned with behavior. Foucault argues there is no "true" body prior to the coercion; the docility *is* the body's reality. Your terms protect the humanist core of the character; Foucault dissolves it.
  3.  **The Untranslatable:** The **micro-physics of coercion**. You can write a scene about drill or routine, but the *text* does not coerce the *character*. The character is a semantic unit, not a muscular-skeletal system. The vocabulary of scene mechanics deals in information and emotion, not in the calibration of force upon muscle.

  ### 4. The Norm
  **Foucault:** A mechanism that produces the "normal" as an effect rather than measuring conduct against a given standard (law); it ranks, differentiates, and homogenizes.

  1.  **Restatement:** **Genre convention** acting not as a rule to be followed or broken, but as a gravitational center that produces the "coherent character" as an effect of adhering to stylistic expectations, where deviation is rendered as noise rather than transgression.
  2.  **The Distortion:** This reduces the Norm to **Market Category**. In your practice, genre is a contract between author and reader regarding expectation. For Foucault, the Norm is a social technology that classifies populations. Your version is commercial/aesthetic; his is biopolitical.
  3.  **The Untranslatable:** The **corrective function**. In fiction, deviation from the norm is "voice," "style," or "innovation." It is valued. In discipline, deviation is "pathology" or "delinquency." It must be cured. Your vocabulary has no mechanism for treating stylistic deviation as a sickness that requires institutional intervention.

  ### 5. Power/Knowledge Mutual Constitution
  **Foucault:** Power produces knowledge and knowledge in turn enables power; there is no knowledge that does not presuppose power relations.

  1.  **Restatement:** The **mechanics of a scene by which a reader comes to know something** are identical to the mechanisms by which the character is subjected to the plot; information is not discovered (epistemic gain) but extracted (power exertion).
  2.  **The Distortion:** This assumes **Knowledge is Liberating**. In novelistic craft, the revelation of information (anagnorisis) is typically the climax of agency or understanding. For Foucault, knowledge is a trap that binds the subject tighter (e.g., the confession). Your vocabulary treats knowing as an increase in character capacity; Foucault treats it as an increase in subjection.
  3.  **The Untranslatable:** The **Institutional Backing**. When a narrator reveals a truth, it is validated by the text's coherence. When power produces knowledge, it is validated by a prison, a hospital, or a state. Your vocabulary has no equivalent for the physical force that guarantees the truth of a statement.

  ### 6. The Archive
  **Foucault:** The system that decides what can be said; the historical *a priori* that governs the appearance of statements.

  1.  **Restatement:** The **byline and the author function** as the device that organizes and limits a text, determining which statements belong to this universe and which are excluded as noise or error.
  2.  **The Distortion:** This personalizes the **System of Exclusion**. In craft, the "author function" is a legal and marketing signature attached to a specific consciousness (you). For Foucault, the archive is impersonal and historical. You imply a gatekeeper; Foucault describes a gate that exists without a keeper.
  3.  **The Untranslatable:** The **Historical *A Priori***. Your vocabulary allows you to break rules, change styles, or write against your previous work. The Archive determines what is *sayable* at all in a given epoch. You have no term for the limits of thought that exist outside of individual choice or stylistic capability.

  ***

  ### Residue Report

  **Direction of Failure:**
  The failure is almost entirely a **defect of your framework**. The novelist's vocabulary is too agent-saturated, too intentional, and too individual to hold what Foucault is saying.

  Your craft is a technology of the Humanist Subject. It presupposes a Creator (Author) who makes choices, a Witness (Reader) who interprets them, and a Subject (Character) who experiences them. Every term you possess—*focalization, scene, interiority, voice*—is designed to manage the flow of consciousness between these three points. Foucault's project is the dismantling of the Subject. He is describing a world where power flows without a source, where knowledge exists without a knower, and where the "individual" is an effect of power, not its origin.

  When you translate "Disciplinary Power" into "Narrative Constraint," you inevitably reintroduce the Author who imposed the constraint. When you translate "The Norm" into "Genre," you reintroduce the Market which sells the book. You cannot speak the language of the system without positing a user of the system. The residue is the **Human**. It remains in your vocabulary as the silent precondition for every term, whereas Foucault is trying to write the history of the present precisely to show that "Man" is a recent invention being erased.

  **On the Author Function Suspicion:**
  Your suspicion is correct. The **Author Function** is the deepest residue, and the point of maximum friction.

  It is the concept most precisely describing you (the legal and discursive owner of the text), yet it is the one your craft vocabulary is least able to hold. This is because your craft vocabulary **presupposes the very author the theory analyzes.**

  To speak of "focalization" is to assume someone *chose* the focus. To speak of "scene mechanics" is to assume someone *engineered* the scene. To speak of the "byline" in craft terms is to speak of branding and ownership. You cannot use your tools to analyze the Author Function without re-installing the Author as the sovereign agent of the text.

  **What this means:**
  It means that as a novelist, you are professionally committed to the existence of the "Author" in the pre-Foucaultian sense. You are paid to be the sovereign. Your craft is the technology of that sovereignty. Foucault's "Author Function" is a description of the *death* of that sovereignty—the reduction of the writer to a variable in a discursive system.

  You cannot translate this without experiencing a professional vertigo. To fully accept the translation is to admit that your "choices" regarding point of view are not choices, but symptoms of a historical archive you did not build. Your vocabulary resists this because it is your livelihood. It must insist on your agency to justify your existence. The untranslatable part is not a lack of words; it is the **economic and ontological necessity of your own significance.** The theory says you are a function; your craft says you are a creator. The residue is your job.
