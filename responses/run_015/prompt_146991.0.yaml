  You ask if I have emptied the word "barbaric." Nay, I reserve it for those who act against nature through deceit and cruelty, thinking themselves superior. The Selk'ara act from a coherent custom, however alien; we Europeans act from a thousand contradictory whims while calling ourselves civilized. Yet, I confess, the notion of an invisible "soul-rot" troubles me more than the open knife of the warrior. It smells too much of our own witch-burners, who destroy neighbors for imagined poisons. So, I would call barbaric not the eating, but the certainty that one man can judge the corruption of another without evidence tangible as blood. But perhaps that is just my own custom speaking.

