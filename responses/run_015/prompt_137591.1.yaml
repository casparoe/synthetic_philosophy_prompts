          *   Identify the *one revision* that cleans up the most.
          *   **Do not** debate the empirical literature (grant the user's premises).
          *   Tone: Analytical, rigorous, charitable but critical (rationalist style).

  2.  **Deconstruct the Position (The 7 Points):**
