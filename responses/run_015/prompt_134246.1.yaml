answer: |-
  The speaker must defend the ontological priority of the performative act over the empirical aggregate, lest the thesis collapse back into the standard 'misrepresentation' model they seek to overturn.

  **Audience Analysis and Strategic Reasoning**

  The audience's commitments diverge sharply but converge on a single anxiety: the loss of normative leverage against authoritarianism. The analytical philosophers will probe the logical coherence of 'retroactive authorisation', fearing circularity or infinite regress. The constitutional lawyers will focus on institutional consequences, specifically how a constructed 'people' interacts with fixed constitutional constraints and minority rights; they will view the thesis as potentially destabilising to the rule of law. The two empirical political scientists will challenge the utility of discarding data, arguing that without empirical referents, the theory becomes unfalsifiable. The strategic pivot point is to acknowledge that while the *ontology* of the people is performative, the *normativity* of the claim remains subject to democratic contestation. The speaker must not concede that the will exists prior to representation, but must concede that not all performative claims are equally legitimate. The following prep sheet prioritises objections that threaten to render the theory politically dangerous or logically incoherent.

  **Speaker's Q&A Prep Sheet**

  **1. The Normative Vacuum Objection**
  *Phrasing:* 'If the 'will of the people' is constituted solely by the populist claim itself, you remove the external standard by which we might judge that claim as illegitimate. Does this not entail that any successful performative assertion of authority is, by definition, democratic, thereby offering no philosophical resistance to authoritarianism?'
  *Reply:* The thesis distinguishes between the *ontology* of the people and the *normativity* of the claim. While the subject is constituted performatively, the legitimacy of that constitution depends on the openness of the process to counter-claims. Democracy is not the accuracy of representation regarding a pre-existing will, but the contestability of the performative claim itself. Authoritarianism arises not from constructing the people, but from closing the space where that construction can be challenged.
  *Weakness:* This concedes that 'success' alone does not validate the claim, implicitly reintroducing a procedural standard that functions similarly to an empirical check, potentially blurring the ontological distinction.

  **2. The Verification Problem**
  *Phrasing:* 'Without empirical data—surveys, turnout, preference aggregation—how do we distinguish between a leader who has successfully constituted a people and one who is merely deluded or speaking into a void? Your model appears unfalsifiable.'
  *Reply:* We distinguish them not by measuring pre-existing preferences, but by observing institutional uptake and sustained collective action. The 'verification' is pragmatic: does the claim mobilise actors to organise around it? However, this is not a measure of accuracy but of efficacy. The theory does not deny empirical reality, but reclassifies it as the *effect* of the political operation rather than its *cause*.
  *Weakness:* This relies on 'efficacy' as a proxy for validity, which risks validating any movement capable of mobilisation, regardless of its democratic character.

  **3. The Circularity Charge**
  *Phrasing:* 'You argue the representative constitutes the represented, who then authorises the representative. Is this not a vicious circle? If the source of authority is created by the authority claim itself, on what ground does the authority rest?'
  *Reply:* It is circular, but not viciously so; it is hermeneutically circular, akin to the foundation of any constitutional order. The 'people' cannot exist prior to the constitution that defines them. The ground is not logical precedence but political acceptance over time. The authority rests on the continued capacity to sustain the fiction of unity against competing claims.
  *Weakness:* Admitting the circle is 'vicious' to some degree undermines the claim to rational coherence, leaving the theory resting on pure power dynamics.

  **4. The Exclusion Problem**
  *Phrasing:* 'A performative construction of 'the people' necessarily implies a constitutive outside—those who do not fit the construct. How does your account protect minorities who are excluded by this retroactive authorisation?'
  *Reply:* Liberal critique assumes minorities are pre-existing empirical groups awaiting protection. My thesis suggests minorities are also politically constituted through counter-claims. Protection arises not from static rights but from the capacity of excluded groups to launch rival performative claims that disrupt the hegemonic construction.
  *Weakness:* This offers little comfort to vulnerable groups lacking the resources to launch effective counter-claims, appearing to privilege power over rights.

  **5. Institutional Compatibility**
  *Phrasing:* 'Constitutional law relies on the people as a stable constituent power. If the people are constantly re-constituted through retroactive authorisation, how can constitutional constraints bind a subject that is ontologically fluid?'
  *Reply:* Constitutional constraints function as the 'grammar' within which performative claims must be articulated. They do not presume a static people, but they stabilise the rules of contestation. The fluidity of the people is contained by the rigidity of the procedures required to alter the constitutional order.
  *Weakness:* This risks reverting to a proceduralism that treats the 'people' as secondary to the institutions, undermining the centrality of the populist operation.

  **6. The Empirical Dismissal**
  *Phrasing:* 'As political scientists, we observe that voter behaviour is driven by specific policy preferences and socio-economic conditions. To treat these as mere epiphenomena of a performative construct ignores the causal mechanisms of voting.'
  *Reply:* I do not deny the causal mechanisms of voting behaviour, but I deny that aggregating them equals 'the will of the people'. Preferences are unstable and context-dependent. The populist operation stabilises these fluid preferences into a coherent political identity. The data explains the *materials* used, but not the *architecture* of the will.
  *Weakness:* This may appear to dismiss robust empirical findings as merely 'materials', alienating the scientists in the room.

  **7. Conceptual Redundancy**
  *Phrasing:* 'Standard representative theory already acknowledges that representatives shape preferences. What work is the term 'performative construct' doing that 'representation' does not already do without the post-structural baggage?'
  *Reply:* Standard theory assumes a principal-agent relationship where the principal exists prior to the agent. My thesis argues the principal is an effect of the agency. This is not shaping preferences; it is ontological creation. The 'baggage' is necessary to break the empiricist habit of looking for the people before the politics.
  *Weakness:* The distinction between 'shaping' and 'creating' is subtle and may be viewed as semantic hair-splitting without clear practical implications.

  **The Nightmare Question**

  *Question:* 'If a populist leader successfully constructs the people and closes the space for counter-claims, effectively becoming the sole source of authority, on what grounds can your theory classify this regime as undemocratic rather than merely a successful performative operation?'

  *Survival Strategy:* Do not attempt to defend the regime as democratic. Concede that under this ontology, successful closure *is* the end of democracy, not a distortion of it. Argue that the theory's value is not in saving such a regime from critique, but in revealing that liberal defenses based on 'accurate representation' were always futile. The defence of democracy must therefore shift from protecting the 'will' to protecting the *contingency* of the will's construction. Pivot immediately to the necessity of institutionalising uncertainty.
