  This is a remarkably robust translation. Your engineering intuition has independently rediscovered operationalist and falsificationist solutions to Hempel's Paradox, specifically aligning with the "New Riddle of Induction" (Goodman) and Mayo's "Error Statistics."

  Here is the translation of the paradox and its responses into your vocabulary, followed by the residue report.

  ### The Translation

  **The Hypothesis as an Invariant**
  In your vocabulary, the hypothesis "All ravens are black" is not a proposition; it is a **system invariant** or an **assertion function** `check_hypothesis(input)`.
  *   **Implementation A (Direct):** `assert !is_raven(input) || is_black(input)`
  *   **Implementation B (Contrapositive):** `assert !is_black(input) || !is_raven(input)`

  **Evidence as Test Cases**
  An "observation" is a **test case** (a specific input generated by a fuzzer or hand-crafted).
  *   **Black Raven:** An input `x` where `is_raven(x) == true`.
  *   **White Shoe:** An input `x` where `is_black(x) == false`.

  **Confirmation as Coverage and Mutation Killing**
  "Confirmation" is not merely a passing test (return code 0). A passing test is necessary but insufficient.
  *   **Weak Confirmation:** The test passes (the invariant holds for this input).
  *   **Strong Confirmation:** The test passes **AND** it increases **code coverage** (specifically branch coverage) **AND** it kills **mutants** (distinguishes the invariant from plausible bugs).

  ---

  ### Testing Your Hunches

  #### Hunch 1: Oracle-Sensitivity of Confirmation
  **Verdict: Valid.**

  In logic, $P \rightarrow Q$ is extensionally equivalent to $\neg Q \rightarrow \neg P$. In code, they are **intensionally distinct**.

  *   **Execution Trace:** In Implementation A (`!raven || black`), if you feed a "white shoe" (`!raven` is true), the evaluator short-circuits. The `is_black` predicate is never called. The branch checking the color of ravens is not touched.
  *   **Coverage Profile:** A suite consisting entirely of white shoes has 0% coverage of the `is_black` logic branch in Implementation A. It is **evidentially inert** regarding the property "ravens are black," even though the assertion returns `true`.
  *   **The Paradox Resolved:** The paradox arises from treating the invariant as a truth value (extensional). Your vocabulary treats the invariant as a procedure (intensional). A white shoe confirms Implementation B, but it does not confirm Implementation A. Since the engineer *chose* Implementation A (modelling the causal structure of the domain), the white shoe is correctly identified as noise.

  #### Hunch 2: Mutation Score and "Weak" Hypotheses
  **Verdict: Valid and Powerful.**

  This maps to the philosophical concept of **severity**. A hypothesis is only confirmed if the test *could have* found it false.

  *   **The Mutant:** Consider a mutant invariant: `assert !is_raven(x) || (is_black(x) && !is_albino(x))`. This represents the hypothesis "All non-albino ravens are black."
  *   **The White Shoe Test:** Input `x` = White Shoe.
      *   True Invariant: Passes.
      *   Mutant Invariant: Passes.
      *   **Mutation Score:** 0. The test cannot distinguish the true hypothesis from the weakened one.
  *   **The Black Raven Test:** Input `x` = Black Raven.
      *   True Invariant: Passes.
      *   Mutant Invariant: Passes.
      *   **Mutation Score:** 0.
  *   **The Albino Raven Test:** Input `x` = Albino Raven.
      *   True Invariant: Fails (Assertion Error).
      *   Mutant Invariant: Passes.
      *   **Mutation Score:** 1 (Killed).

  **Conclusion:** A suite of 1,000 white shoes has a mutation score of 0 against the "Albino Exception" mutant. It provides no confirmation. A single Black Raven also has a mutation score of 0 against this specific mutant. You need a test case that *threatens* the invariant to confirm it. This explains why white shoes feel inert: they don't risk failure.

  ---

  ### Residue Report

  Here is what maps cleanly, what distorts, and what vanishes in translation.

  #### 1. What Maps Cleanly
  *   **Universal Quantification:** $\forall x$ maps directly to "for all inputs in the domain."
  *   **Falsification:** A single failing test (Assertion Error) maps perfectly to falsifying the hypothesis.
  *   **Background Knowledge:** Your "test harness" or "type system" encodes the background knowledge (e.g., `input` must be of type `Object`, `is_raven` returns `bool`).

  #### 2. What Had to Be Distorted
  *   **The Nature of "Observation":** In philosophy, observing a shoe is passive. In SE, generating a test case is active. You have to *construct* the white shoe. This introduces **sampling bias**. The paradox assumes observations fall from the sky; your vocabulary requires a **Fuzzer Profile**.
  *   **Logical Equivalence:** As noted in Hunch 1, logical equivalence is distorted into **functional equivalence**. They return the same boolean, but they have different cyclomatic complexity and coverage profiles.

  #### 3. What Has No Expression (The Void)
  *   **Metaphysical Necessity:** Philosophy asks if ravens *must* be black. SE only asks if they *are* black in the observed domain. SE has no vocabulary for "laws of nature" vs. "accidental generalizations," only "invariants" vs. "flaky tests."

  ---

  ### Specific Answers to Your Questions

  #### (a) Degree of Confirmation vs. Input Space Sampling
  You asked if there is a counterpart to "degree of confirmation" beyond crude sampling.
  **Yes: It is Bayesian Updating weighted by the Input Profile.**

  In property-based testing, you define a **generator profile**. If `Raven` is a rare subtype of `Object` (say, 1 in $10^6$) and `Non-Black` is common (say, 1 in 2), then:
  *   Sampling a `Non-Black` item is cheap.
  *   Sampling a `Raven` is expensive.

  To match the evidential weight (information gain) of **1 Black Raven**, you need to sample roughly **$N$ White Shoes**, where:
  $$ N \approx \frac{P(\text{Non-Black})}{P(\text{Raven})} $$
  If Ravens are $10^{-6}$ of the domain and Non-Blacks are $0.5$ of the domain, you need **500,000 white shoes** to statistically constrain the `is_raven` branch as tightly as one black raven does.

  In SE terms: The "degree of confirmation" is the **reduction in entropy** of the untested branches. A white shoe reduces entropy on the `!is_black` branch; a black raven reduces entropy on the `is_black` branch. Because the `Raven` branch is so narrow, hitting it reduces uncertainty about the specific constraint much faster.

  #### (b) Machine-Checked Proof and Boundedness
  **Confirmation is indeed a symptom of boundedness.**

  *   **Testing (Induction):** You sample a finite subset of the input space. The paradox exists because you are trying to infer properties of the untested space from the tested space. The "white shoe" is an attempt to infer facts about `Ravens` by testing `Non-Blacks`.
  *   **Proof (Deduction):** A machine-checked proof (e.g., in Coq or TLA+) verifies the invariant over the **entire type space**.
  *   **The Evaporation:** If you have a proof that `forall x, Raven(x) -> Black(x)`, the paradox evaporates because you no longer need evidence. You have a derivation.
  *   **Survival:** The paradox *survives* only if the proof itself relies on axioms that are empirically grounded. If your proof assumes `Axiom_Raven_Color`, you are back to testing the axiom. But if the proof is structural (e.g., `Raven` is defined as a subclass of `BlackObject`), then "White Raven" is a type error, not a falsified hypothesis. The paradox relies on the contingency of the property; proofs usually rely on the necessity of definitions.

  #### (c) Which Premise Does Your Vocabulary Refuse to State?
  **The Equivalence Condition:** *"Logically equivalent hypotheses are confirmed by exactly the same evidence."*

  Your vocabulary **refuses** this premise.
  In SE, **implementation matters**.
  *   `assert A || B` is not the same program as `assert !B || !A`.
  *   They have different control flow graphs.
  *   They have different coverage requirements.
  *   They have different performance characteristics.

  Philosophy treats hypotheses as abstract objects (extensional). Engineering treats hypotheses as executable artifacts (intensional). Your vocabulary forces you to commit to *how* the check is performed, which breaks the symmetry required for the paradox to launch.

  #### (d) Oracle Sensitivity vs. Projectibility (Goodman's Grue)
  **Your coverage story says something the projectibility story cannot.**

  *   **Philosophy (Projectibility):** Philosophers argue that "Raven" is a *natural kind* and "Non-Black" is not (or is less so). This is a metaphysical or linguistic claim. It's vague. Why is "Raven" natural?
  *   **Engineering (Oracle Sensitivity):** You don't need "natural kinds." You need **defined interfaces**.
      *   If your system exposes `is_raven()`, that is the **API Contract**.
      *   Confirmation is relative to the **Interface**, not the World.
      *   **The Added Value:** Your vocabulary introduces **Cost**.
          *   If `is_raven()` is an $O(N)$ database lookup and `is_black()` is an $O(1)$ pixel check, the "Contrapositive" implementation might be preferred for performance, even if it makes "white shoes" evidentially active.
          *   Philosophy ignores the cost of predication. Engineering makes it central.

  **Summary:** Your "Oracle Sensitivity" hunch is the engineering realization of Goodman's "Projectibility." However, where philosophy treats projectibility as a property of *predicates*, your vocabulary treats it as a property of the **system architecture**. You don't ask "Is Raven a natural kind?"; you ask "Is `is_raven` a primitive in my domain model?" If it is, the white shoe is inert. If it isn't, the white shoe is active. This makes the solution pragmatic and auditable, rather than metaphysical.
