  2.  **Deconstruct the Raven Paradox (Philosophical Core):**
      *   Hypothesis $H$: $\forall x (Raven(x) \rightarrow Black(x))$.
      *   Contrapositive $H'$: $\forall x (\neg Black(x) \rightarrow \neg Raven(x))$.
      *   Nicod's Criterion: Observing an instance $F$ that is $G$ confirms $\forall x (F(x) \rightarrow G(x))$.
      *   Equivalence Condition: If $E$ confirms $H$, and $H \equiv H'$, then $E$ confirms $H'$.
      *   Paradox: Observing a white shoe ($\neg Black \land \neg Raven$) confirms $H'$. Therefore, it confirms $H$. Intuitively absurd.

  3.  **Translate to SE Vocabulary (Drafting the Core Analogy):**
      *   *Hypothesis:* An invariant or assertion in code.
      *   *Evidence:* Test cases (inputs).
      *   *Confirmation:* Test passing (assertion holds).
      *   *Domain:* The input space of the function/system.
      *   *Observation:* Running a test case.
