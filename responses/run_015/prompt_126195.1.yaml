prompt: |-
  Draft the complete desiderata specification for a theory of the biological species category, where adequacy is measured against three concurrent demands: accounting for evolutionary processes, underwriting practical conservation taxonomy, and accommodating fossil-lineage classification. For each requirement, supply the motivating biological case or conceptual distinction — including but not limited to hybridization zones, obligate asexual reproduction, chronospecies in deep time, cryptic morphological convergence, and the divergence between reproductive isolation and ecological-role differentiation. Mark which requirements are non-negotiable across all three domains and which are camp-specific preferences, and flag any subset of desiderata that current evolutionary theory suggests is jointly unsatisfiable, especially where monophyletic grouping conflicts with reproductive cohesion in reticulate or hybrid-speciation contexts. Conclude with a brief comparative assessment of how the Biological Species Concept, the Phylogenetic Species Concept, and a domain-pluralist approach fare against the list, identifying for each the single desideratum that does the most damage. Weight your answer toward the criteria and their internal tensions rather than toward an exhaustive taxonomy of examples.
