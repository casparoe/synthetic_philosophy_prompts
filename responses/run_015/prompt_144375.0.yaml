          *   *Searle:* The author says they don't think "being made of the right sort of stuff" does semantic work. This contradicts Searle's "Biological Naturalism," which *does* claim causal powers of biology are essential. I need to flag this. The author is rejecting Searle's specific solution while keeping the distinction.
          *   *Dennett:* The "two-bitser" (vending machine) analysis is accurate enough for a secondary reading. Dennett does argue that the distinction is folk-psychological and that "original" intentionality is just a more complex version of derived. The author captures the "no bedrock" worry well.
          *   *Verdict:* Fair statement of the problem. Misreading of Searle (intentionally or not) regarding biology, but that's the author's prerogative.

      *   **Section 2: The Central Move (Self-Anchoring)**
