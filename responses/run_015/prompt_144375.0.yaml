      *   **Self-anchoring:** Error signals terminate in the system itself (Original).
      *   **Other-anchored:** Error signals terminate in an external interpreter (Derived).
      *   **The Problem (The Crab):** A self-tuning artifact (Crab) fits the self-anchoring criteria. The author instinctively wants to deny it original intentionality but admits their criterion grants it.
