      *   *Mapping:* In JAT, agents must accept/reject specific propositions. In Brexit, voters had heterogeneous reasons. Some voted Leave *despite* economic fears (prioritizing sovereignty). Some voted Remain *despite* immigration concerns.
      *   *Discursive Dilemma?* Strictly, no. A dilemma requires a collective consistency constraint enforced on the *inputs*. Here, inputs were private preferences aggregated into a single binary choice. There was no premise vote to compare against the conclusion vote.
      *   *Mass-Scale Doctrinal Paradox:* The theory assumes shared deliberation or at least shared understanding of the logical structure. Mass electorates lack this. Brexit reveals JAT is silent on how to extract premises from private motivations without a structured deliberative process.

