  **Mark: 18/25**

  **Assessment**

  This is a clear, well-structured, and largely consistent answer that demonstrates a solid grasp of the Lewisian account of convention and applies a coherent utilitarian framework to the scenarios. The student successfully navigates the complex constraints of the question (the visitor's anonymity, the specific local norms) and differentiates the three cases with nuance. However, for a final-year course, the answer relies on under-argued meta-ethical premises and contains a significant tension between the specific obligations generated in part (c) and the general denial of obligation in part (d).

  **Point-by-Point Justification**

  **Part (a): Definition of Convention (5/5)**
  *   **Credit:** The student accurately reproduces the course standard (Lewisian) account: arbitrary, conditional preference to conform, and stability based on mutual expectation. The phrasing "self-reproducing pattern... arbitrary... stable" captures the essential elements required by the prompt.
  *   **Cosmetic Issue:** The student includes argumentative claims ("Two things follow... facts about expectations are not by themselves normative") within the definition section. While these claims are relevant to the essay, part (a) requested the *account*, not the *implications*. This bleeds into part (b) but does not obscure the definition.

  **Part (b): Defense of Claim (ii) (4/8)**
  *   **Credit:** The student adopts a clear harm-based criterion ("does non-conformity set back anyone's interests?") which is a valid philosophical strategy for defending (ii). The distinction between the convention *as such* and the *consequences* of breaking it is well-drawn.
  *   **Serious Failure 1 (Unsupported Premise):** The central claim that "Frustrated expectations are not themselves a harm; they matter only where someone is made worse off" is asserted without argument. In final-year ethics, this is a contentious meta-ethical stance (excluding reliance/expectation from the category of harm). Given that the moral force of conventions often *rests* on reliance, dismissing this by fiat weakens the defense. To secure full marks, the student needed to justify *why* expectation-frustration is not a harm (e.g., by distinguishing welfare from psychological states) rather than stating it as a self-evident test.

  **Part (c): Application to Cases (6/8)**
  *   **Credit:** The differentiation between the three cases is the strongest part of the answer. The queueing analysis (distinguishing between crowded and half-empty buses) shows sophisticated application of the harm principle. The jaywalking conclusion follows logically from the premises.
  *   **Serious Failure 2 (Tipping Causality):** In the tipping case, the student claims a single visitor's tip would "put pressure on a wage arrangement this city has chosen." This contradicts the logic used in part (d). In (d), the student argues that one visitor's conduct "cannot change" the practice/convention. A wage arrangement is a social convention/practice. If one person cannot affect the convention (d), it is inconsistent to claim one person can pressure the wage arrangement (c). This suggests a confusion about individual causal efficacy in collective contexts.

  **Part (d): Reply to Objection (3/4)**
  *   **Credit:** The student logically connects the objection to their thesis. Accepting the objection is a valid strategy when defending (ii), as the objection undermines the "practice-based" obligation.
  *   **Tension with Part (c):** The student concludes in (d) that the visitor "cannot owe conformity to anyone." However, in part (c) (Queueing), the student explicitly states "identifiable people are made worse off, the visitor must queue." If she must queue to avoid harming them, she owes a duty *to them*. Denying in (d) that she owes anything to "anyone" creates a direct contradiction with the specific obligation established in (c). The semantic distinction between "conformity" and "regard for interests" is too thin to bear the weight of this contradiction: if the only way to regard their interests is to conform, she owes them conformity.

  **Summary of Serious Failures**

  1.  **The Unargued Meta-Ethical Premise (Part b):** The assertion that frustrated expectations are not harms is the linchpin of the entire argument but is left unsupported.
  2.  **The Inconsistency on Individual Efficacy/Obligation (Part c vs. Part d):** The answer oscillates between claiming a single act can harm interests/pressure arrangements (c) and claiming a single act cannot affect practices/owe anything to anyone (d).

  **Relationship Between Failures**
  These two failures are **generative**, not independent. The first failure (the narrow definition of harm in part b) generates the second. Because the student restricts moral reasons *only* to tangible interest setbacks (excluding reliance/expectation harm), they are forced in part (d) to deny that any obligation is owed to the *practice* or the *participants as a group*. This forces the awkward semantic distinction ("not conformity but regard for interests") that contradicts the plain language of the duty established in part (c). If the student had argued in (b) that reliance *is* a harm, the tension in (d) would resolve naturally (she would owe conformity based on the harm of disappointed reliance).

  **Requirements for Full Marks**
  To achieve 25/25, the answer would have needed to:
  1.  **Justify the Harm Principle:** Provide a brief argument or citation for why expectation-frustration does not count as a harm, acknowledging the counter-view that reliance interests are morally significant.
  2.  **Reconcile (c) and (d):** Clarify the language of obligation. If the visitor owes it to the queue-jumpers in (c) to queue, part (d) should acknowledge she owes *them* conformity, even if she doesn't owe the *practice* conformity. The distinction should be between *rule-utilitarian* obligation (to the practice) and *act-utilitarian* obligation (to the individuals), rather than denying obligation to "anyone."
  3.  **Resolve Causal Efficacy:** Address the tension between "pressuring a wage arrangement" (c) and "cannot change the convention" (d) by specifying the threshold at which individual acts become collectively significant.
