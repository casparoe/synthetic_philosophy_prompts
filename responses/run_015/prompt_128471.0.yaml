answer: |-
  ### Opening Concessions
  To lower the temperature, begin by conceding two points:
  1.  **The Moral Cost of Extraction:** Acknowledge that labeling a convention as "extractive" (like tipping) does not morally absolve the agent of all responsibility toward the worker. Concede that while there may be no duty to *comply* with the extractive norm, there remains a general duty of beneficence toward the individual harmed by the system.
  2.  **The Fuzziness of "Visitor":** Admit that the binary between "local" and "visitor" is a heuristic, not a metaphysical truth. Concede that long-term residents or those with ambiguous status may fall into a gray zone where the "expectational contract" is partially formed.

  ---

  ### Q&A Defense: Eight Objections

  #### 1. The Reasonable Rejection Objection (Contractualist)
  **Objection:** "You claim duties arise only from a local expectational contract. But on a Scanlonian view, moral obligations are grounded in principles no one could reasonably reject. If a waiter relies on tips for subsistence, isn't it reasonably rejectable for you to withhold payment simply because you lack 'contractual history'? The harm to the worker seems to generate a duty independent of your coordination history."

  **Reply:** "The contractualist framework requires mutual justification among agents. My argument is that the *specific convention* of tipping is not the mechanism of mutual justification; the underlying duty of beneficence is. I am distinguishing the *conventional vehicle* from the *moral cargo*. A visitor is still bound by general duties of beneficence, but they are not bound to validate a specific, locally contingent pricing mechanism that they had no hand in designing. The duty is to ensure the worker is paid, not necessarily to tip if other mechanisms exist."
  **Weakest Point:** This relies on the visitor knowing or having access to "other mechanisms" to ensure the worker is paid, which is rarely the case in practice.

  #### 2. The Territorial Sovereignty Objection (Legal)
  **Objection:** "In immigration law, entry into a territory implies submission to the *lex loci* (law of the place). If social conventions function as soft law governing public order, doesn't your 'visitor exemption' undermine the normative force of territorial sovereignty? You are effectively arguing for a right to opt-out of local social contracts based on subjective history."

  **Reply:** "Territorial sovereignty governs coercive state enforcement, not voluntary social coordination. My thesis concerns *moral* obligations, not legal liability. While the state may punish jaywalking, the moral duty to queue arises from reciprocity, not sovereignty. A visitor submits to the *law*, but moral duties of coordination require a shared history of expectation that mere physical presence does not automatically generate."
  **Weakest Point:** It risks creating a dual-track system where legal and moral obligations diverge sharply, which is unstable in societies where norms are enforced by social sanction rather than state power.

  #### 3. The Phronesis Objection (Virtue Theory)
  **Objection:** "Virtue ethics focuses on character and *phronesis* (practical wisdom). If an agent consistently uses the 'visitor' status to bypass local norms of queuing or tipping, are they not cultivating a vice of opportunism? Even if there is no strict duty, isn't compliance a requirement for flourishing as a respectful social agent?"

  **Reply:** "Virtue requires context-sensitive judgment. *Phronesis* dictates that one should not disrupt cooperative equilibria unnecessarily. However, virtue also requires justice. If a norm is 'extractive,' complying with it might actually be vicious, as it reinforces injustice. The virtuous agent navigates the tension between respect for hosts and refusal to participate in exploitation, rather than blindly following local custom."
  **Weakest Point:** It places a heavy cognitive burden on the agent to constantly audit the moral status of every convention they encounter, which conflicts with the virtue of habituation.

  #### 4. The Constitutive Ritual Objection (Anthropological)
  **Objection:** "You treat conventions as 'artifacts' external to the agents. But in ritual theory, participation is constitutive of social reality. By queuing, you aren't just coordinating; you are enacting membership. To treat these as optional coordinative tools ignores that they *create* the social bond you claim to be analyzing."

  **Reply:** "I agree that rituals are constitutive, but constitution is not coercion. One can acknowledge the social reality created by a ritual without accepting a moral obligation to participate in it, especially if the ritual encodes hierarchy or extraction. My distinction allows us to honor the *meaning* of the ritual while critiquing the *obligation* to perform it, particularly for those outside the lineage of that social construction."
  **Weakest Point:** It risks instrumentalizing ritual, stripping it of the very "sacred" or binding quality that anthropologists argue gives it power.

  #### 5. The Boundary Problem Objection (Contractualist)
  **Objection:** "Your distinction between 'stabilizing' (queuing) and 'extractive' (tipping) artifacts is unstable. Queuing can be extractive if it privileges those with more time; tipping can be stabilizing if it ensures service quality. How do you draw this line without arbitrary stipulation?"

  **Reply:** "The distinction rests on the *primary function* regarding baseline welfare. Stabilizing artifacts prevent a 'war of all against all' where everyone is worse off (e.g., chaos at the bus stop). Extractive artifacts shift costs from owners to consumers or workers (e.g., subsidized wages). While edge cases exist, the core cases are distinct: one solves a coordination problem, the other solves a distribution problem via social pressure."
  **Weakest Point:** Many conventions do both simultaneously (e.g., tipping solves a coordination problem of service allocation *and* a distribution problem of wages), making the binary difficult to apply.

  #### 6. The Status Ambiguity Objection (Legal)
  **Objection:** "You rely on the category of 'visitor.' In migration studies, status is porous. What of the undocumented migrant who has lived here for five years? They lack 'contractual history' in your sense but are not visitors. Do they have a duty to comply?"

  **Reply:** "My framework relies on *expectational integration*, not legal citizenship. If an agent has resided long enough to understand and benefit from the local conventions, they have entered the 'expectational contract' de facto. The 'visitor' is strictly one who lacks the knowledge and benefit history to be bound by the reciprocal expectations. Long-term residents, regardless of status, accrue these duties through participation."
  **Weakest Point:** This conflates *knowledge* of a norm with *consent* to it, which is a contentious move in legal theory regarding marginalized populations.

  #### 7. The Threshold of Destabilization Objection (Anthropological)
  **Objection:** "You grant visitors a negative duty not to 'destabilize' the artifact. But social coordination is sensitive to initial conditions. One person jaywalking doesn't destabilize, but if every visitor did it, the norm collapses. Isn't the individual act itself impermissible if it contributes to a collective action problem?"

  **Reply:** "The negative duty is against *visible* destabilization. A single act by an identifiable outsider is often read as ignorance rather than defection, preserving the norm. The duty is to avoid acting in a way that signals to locals that the norm is optional. As long as the visitor's behavior is framed as 'learning' rather than 'rejecting,' the artifact remains stable."
  **Weakest Point:** It assumes locals can reliably distinguish between 'ignorant non-compliance' and 'defection,' which is empirically doubtful in high-traffic interactions.

  #### 8. The Respect for Hosts Objection (Virtue Theory)
  **Objection:** "Even if there is no duty to the *norm*, isn't there a duty of hospitality or respect to the *hosts*? Ignoring local customs can be interpreted as a slight against the community. Does your framework allow for rudeness?"

  **Reply:** "There is a duty of civility, but civility is not identical to compliance. One can respectfully decline a norm by signaling awareness ('I know you tip here, but I am not participating in this system'). The duty is to communicate respect for the persons, not obedience to the convention. Rudeness arises from the attitude, not the non-compliance itself."
  **Weakest Point:** In many cultures, the *act* of non-compliance is inherently read as disrespectful, regardless of the accompanying verbal signaling.

  ---

  ### The Objection I Hope No One Raises
  **The Complicity in Structural Injustice Objection:**
  "If an artifact is 'extractive' (like the tipping regime you described), does merely *navigating* it without trying to dismantle it make you complicit in the structural injustice? By accepting the service within an extractive framework, even without tipping, are you not still benefiting from the suppressed wages? Your theory tells agents how to *behave* within the system, but fails to address the duty to *abolish* the system. If the artifact is unjust, the only moral duty is resistance, not non-compliance."

  *(Why this is dangerous: It bypasses the "contract" argument entirely and attacks the moral permissibility of participating in the interaction at all, potentially rendering the agent morally tainted regardless of their tipping behavior.)*
