          *   Explicit note on the *weakest point* of each reply.
          *   Include the "single objection I am hoping no one raises."
          *   Indicate concessions for opening remarks.
          *   No bibliographies/citations.

  2.  **Deconstruct the Thesis & Identify Vulnerabilities:**
      *   *Claim 1: Conventions are not universal moral obligations.* (Vulnerability: Fairness, respect for persons, harm prevention).
      *   *Claim 2: Duties arise from local expectational contracts.* (Vulnerability: How is consent implied? What about power imbalances? What defines the "local"?)
      *   *Claim 3: Visitors only have a negative duty not to destabilize.* (Vulnerability: Free-riding, integration, respect for hosts).
      *   *Claim 4: Stabilizing vs. Extractive distinction.* (Vulnerability: Who decides? Is tipping ever stabilizing? Does extractiveness negate obligation entirely?)
      *   *Claim 5: Derivative obligations attach only to stabilizing artifacts.* (Vulnerability: Complicity in injustice).

  3.  **Drafting Objections (Iterative Process):**

      *   *Objection 1 (Contractualist - Most Damaging):* The "Local Expectational Contract" sounds like mere convention, but contractualism (Scanlonian) requires principles no one could reasonably reject. If I don't tip, the waiter suffers. Is that reasonably rejectable regardless of my "contractual history"?
      *   *Objection 2 (Legal/Territorial):* If visitors aren't bound by positive duties, does this undermine territorial sovereignty or the social contract of the state? If I enter the territory, do I not submit to the *lex loci*?
      *   *Objection 3 (Virtue Theory):* What does following these norms say about my character? Is the "visitor" excuse just a license for vice (rudeness, greed)?
      *   *Objection 4 (Anthropological):* Rituals aren't just coordination; they constitute social reality. You can't separate the "artifact" from the "meaning."
      *   *Objection 5 (Contractualist/Extraction):* Your distinction between stabilizing and extractive is unstable. Queuing can be extractive (privilege), tipping can be stabilizing (income security).
      *   *Objection 6 (Legal/Immigration):* The "visitor" category is legally porous. Undocumented migrants or long-term residents without citizenship—are they visitors?
      *   *Objection 7 (Virtue/Integration):* Even if not obligatory, isn't compliance a virtue of hospitality or respect?
      *   *Objection 8 (Anthropological/Coordination):* "Destabilizing" is too high a bar. One person jaywalking doesn't destabilize, but if everyone did the "visitor" thing, it would.
      *   *The "Hope No One Raises" Objection:* The Complicity Objection. If I participate in an extractive system (tipping), am I not complicit in the wage theft, even if I tip? Or if I don't tip, am I harming the worker directly? Actually, the stronger "silent fear" is usually about the *definition of the contract*. Let's go with the *Power/Coercion* objection regarding the "contract" itself. If the "contract" is coerced by economic necessity, is it valid?

