      *(Self-Correction during drafting)*: Objection 1 (Contractualist) is the strongest because it attacks the moral core. Objection 2 (Legal) is strong because it attacks the jurisdiction. The "Hope No One Raises" should be the one that collapses the distinction between visitor and resident, or the one that proves the "contract" is a fiction. Let's make the "Hope No One Raises" about the *coercive nature of the "contract" itself*—if the cost of non-compliance is social ostracization or violence, is it truly a contract? No, let's go with the *Complicity in Structural Injustice* objection. It bypasses the contract entirely and says "You are morally required to fix the system, not just navigate it."

