answer: |-
  The Keeper lifts the sheets to catch the light,
  And finds no fault within the paper **grain**.
  They lie linked close within a copper **chain**,
  Where every step climbs up a single **stair**.
  No sheet stands lower than its neighbor **par**,
  And nowhere shows the sharp dividing **scale**.

  He cannot push beyond this quiet **scale**,
  For difference hides finer than a **hair**.
  They stand together, matched and at a **par**,
  Though ink sinks deeper into softest **grain**.
  No rung is lost upon the climbing **stair**,
  Nor broken link discovered in the **chain**.

  He marks the break within the tolerance **chain**,
  Not strict betterness on its numbered **scale**.
  No coin returns upon the closed **stair**,
  No cycle steals the value of a **hair**.
  He keeps the logic though we lose the **par**,
  But mourns the single number in the **grain**.

  Yet lay the first and last upon the **grain**,
  The ghostly crisp against the blurred **chain**.
  One holds the line, one loses it by **hair**,
  And plain worse stands beyond the single **scale**.
  No step descended on the climbing **stair**,
  Yet none can say the two remain at **par**.

  If no step fell, how fell the final **par**?
  Must we find a cut in every **grain**?
  To place it random on the single **scale**,
  Is shame enough to break the logical **chain**.
  Better to let the tolerance lose a **hair**,
  Than build a loop of coin upon the **stair**.

  I will not climb the circular **stair**,
  Nor say the sheets stand strictly at a **par**.
  I pay the cost within the paper **grain**,
  To lose the measure finer than a **hair**.
  And let the single number lose its **scale**,
  Rather than bind the broken tolerance **chain**.

  The paper **grain** accepts no constant **par**,
  Nor climbs again the circular **stair** of **chain**,
  Where one lost **hair** dissolves the single **scale**.

  ***

  **Note**

  The envoi rejects the transitivity of the "not worse than" relation (tolerance), affirming that a chain of pairwise indistinguishable steps can connect a better item to a worse one. The cost of this rejection is the abandonment of a single cardinal scale of value, meaning the sheets cannot be ranked by one consistent number. This avoids the epistemic embarrassment of locating a sharp cut-off point where none appears, and it refuses the stronger claim that strict betterness itself is intransitive (which would allow value cycles). Oskar must answer because preserving the single scale requires accepting a hidden fact of the matter that the Keeper's threshold cannot access.
