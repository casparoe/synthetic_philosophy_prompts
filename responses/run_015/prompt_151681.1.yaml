          *   *Nuance:* It's partly convention/convenience, but rests on a utilitarian floor.
      *   **Section 2: The Measurability Bias (Moral Claim vs. Bureaucratic Artefact).**
          *   This is the "strongest evidence" heuristic.
          *   *Strictly Requires:* Nothing moral. It's epistemic.
          *   *Reality:* It's largely bureaucratic (accountability to donors/board) + risk aversion.
          *   *Contested:* EA insiders admit this is a distortion ("quantification bias"). It's not a moral claim that DALYs are all that matter, but a practical claim that we can't trust unmeasured claims.
      *   **Section 3: Cash Autonomy vs. Specific Interventions (Consistency Check).**
          *   Resolve the apparent contradiction.
          *   *Theory:* Market failures + Internalities. People might value health but underestimate it, or credit markets fail.
          *   *Strictly Requires:* A belief that some goods have positive externalities or are under-consumed due to bias.
          *   *Contested:* How aggressive the paternalism should be.
      *   **Section 4: Equifinality (Different Theories, Same Actions).**
          *   Show how a Utilitarian and a Prioritarian might fund the same thing.
          *   Show how a Bureaucrat and a Philosopher might both demand RCTs (for different reasons).
      *   **Section 5: What if the View Swapped?**
          *   If we moved from Welfarism to Rights/Justice: Cash might drop, policy rises.
          *   If we moved from Quantification to Trust: Systemic funding increases.
      *   **Conclusion:** Summarise the "Settled" vs. "Contested".

  4.  **Refining the Content (Self-Correction/Check):**
      *   *Check:* Did I use British English? (Programme vs Program, Centre vs Center, "whilst", " amongst", "£" symbols if needed, spelling like "professionalised", "organising").
      *   *Check:* Did I flag contested bits? Yes, need to explicitly label things like "The definition of welfare is contested."
