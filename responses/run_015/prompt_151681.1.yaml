answer: |-
  You have put your finger on precisely the sort of tensions that keep the more reflective practitioners in this space awake at night. It is a sharp observation: the operational machinery of 'effective' funding often looks rather different from the philosophical principles that supposedly underpin it.

  To answer your questions, we need to disentangle the *philosophical commitments* (what they say they believe) from the *operational heuristics* (what they actually do to manage risk and accountability). Much of what you are seeing is not a strict logical requirement of Effective Altruism (EA), but rather a pragmatic accretion of how large foundations manage liability and reputation.

  Here is an analysis of the three practices you identified, separating what is strictly required from what is merely convenient, and flagging where the consensus breaks down.

  ### 1. Cash as the Yardstick: Substantive View or Convention?

  **The Practice:** Cost-effectiveness is expressed as a multiple of unconditional cash transfers (e.g., "This intervention is 5× as cost-effective as cash").

  **What this strictly requires:**
  Strictly speaking, this does not require a belief that cash is the *only* good, nor even that it is the *best* good. It requires only two things:
  1.  **Fungibility:** A belief that money is a reasonable proxy for welfare (wellbeing).
  2.  **A Counterfactual Baseline:** You must compare any intervention against what would otherwise happen to that money. Since giving money directly is the most direct alternative, it serves as the natural zero point.

  **What sits comfortably with it (but isn't required):**
  It sits comfortably with **welfarism** (the view that wellbeing is the only thing that matters) and **utilitarianism** (maximising the sum of that wellbeing). If you believe money translates reliably into utility, then cash is the purest form of utility delivery.

  **The Contested Bit:**
  *   **Is income a sufficient proxy for welfare?** This is heavily contested. Critics from the 'capabilities approach' (following Amartya Sen) argue that cash is only as good as the environment in which it is spent. If a village has no school, cash won't buy education.
  *   **The 'Multiple' Metric:** Many senior figures within the movement admit privately that the 'X times cash' metric is becoming a fetish. It is **contested** whether this ratio captures everything of value. For instance, does cash build dignity or agency in a way a bednet does not? The metric struggles to capture that.

  **Verdict:** Using cash as the baseline is largely a **convention of comparability**, but it leans heavily on a substantive view that income is the primary driver of wellbeing. If you swapped this for a view that 'justice' or 'rights' were the primary good, the cash benchmark would collapse, as cash does not necessarily rectify injustice.

  ### 2. The Measurability Bias: Moral Claim or Bureaucratic Artefact?

  **The Practice:** Funding flows to interventions with Randomised Controlled Trials (RCTs), DALYs (Disability-Adjusted Life Years), or test scores. Systemic work (policy, organising) is deprioritised.

  **What this strictly requires:**
  Surprisingly, the philosophy of EA does *not* strictly require this. The core tenet is 'do the most good', not 'do the most *measurable* good'.
  *   **Epistemic Humility:** The strict requirement is only that you should not fund things you have strong reason to believe are ineffective.
  *   **Evidence Hierarchy:** It requires a preference for stronger evidence over weaker evidence, but not necessarily *only* the strongest evidence if the potential upside is vast.

  **What sits comfortably with it:**
  This is predominantly a **bureaucratic artefact**.
  1.  **Accountability:** Grant officers must justify decisions to a board or donors. A DALY count is defensible in a meeting; a theory of change about 'shifting norms' is not.
  2.  **Risk Aversion:** As funds grow, the cost of a scandal or a visible failure grows. Measurable things feel safer.

  **The Contested Bit:**
  *   **Quantification Bias:** This is explicitly acknowledged as a problem within the community. Leading thinkers (such as those at Open Philanthropy) have published pieces admitting that an over-reliance on quantification systematically biases funding away from high-upside, hard-to-measure areas (like policy or science).
  *   **Moral Claim?** It is **not** a moral claim that DALYs are the only value. It is an epistemic claim that we cannot trust our guesses about other values. However, in practice, it *functions* as if it were a moral claim, because unmeasured values are treated as having zero weight.

  **Verdict:** This is mostly an artefact of professionalisation and risk management. It is **contested** internally whether this is a necessary evil or a corruption of the mission. If you swapped the implicit view for one that valued 'robustness over precision', you would see far more funding for institutional reform and movement building.

  ### 3. Cash-Knows-Best vs. Nets-Need-a-Nudge: Inconsistent or Coherent?

  **The Practice:** Defending cash because recipients know their needs best, whilst funding specific health interventions (nets, deworming) because recipients won't choose them without subsidies.

  **What this strictly requires:**
  This pairing is logically consistent *if* you accept a specific theory of human behaviour: **Bounded Rationality + Market Failure.**
  1.  **Cash:** People know their immediate consumption needs best (food, shelter).
  2.  **Nudges:** People systematically underestimate long-term health benefits (preventative care) or face credit constraints (cannot afford the net now to save money later).

  **What sits comfortably with it:**
  This sits comfortably with **Soft Paternalism**. The view is: "We trust your preferences regarding your life, except where we have strong evidence that your preferences are misaligned with your own wellbeing due to information gaps or cognitive bias."

  **The Contested Bit:**
  *   **Whose Welfare?** This is the crux. The 'cash is best' argument relies on **Preference Utilitarianism** (satisfying what people want). The 'fund the net' argument relies on **Objective List Welfarism** (health is good for you, even if you don't want it right now).
  *   **The Tension:** It is **contested** how far the 'nudge' can go before it becomes coercion. If you fund nets because people don't value them enough, why not fund contraception? Or education? At what point do you stop respecting revealed preference?
  *   **Internal Criticism:** Some libertarians within the movement argue the health interventions are unjustified paternalism. Some development economists argue the health interventions are justified, but the 'cash is best' rhetoric is overstated to avoid looking colonial.

  **Verdict:** The pairing is **theoretically consistent** under a model of 'imperfect information', but it is **practically tense**. It requires funders to walk a tightrope between respecting agency and maximising health outcomes. If you swapped the implicit view for a strict Rights-Based Approach, the 'nudge' interventions might vanish unless requested by the community.

  ### Equifinality: Different Theories, Same Actions

  It is important to recognise that you can arrive at these funding decisions from very different starting points. This is why the 'implicit view' is hard to pin down.

  *   **The Utilitarian** funds bednets because they save the most lives per pound.
  *   **The Prioritarian** funds bednets because they help the worst-off (the very poor).
  *   **The Bureaucrat** funds bednets because the metric is clean and the board won't ask awkward questions.

  All three license the exact same grant. This is why the practice looks monolithic even though the reasoning is diverse. However, this equifinality breaks down when you move to the 'hard-to-measure' stuff. The Utilitarian might fund a risky policy bet if the upside is huge; the Bureaucrat will not. Currently, the Bureaucrat is winning.

  ### What Would Change if the View Swapped?

  If your foundation were to explicitly reject the current implicit view (Welfarism + Quantification Bias + Soft Paternalism) in favour of a rival one, here is how the portfolio would shift:

  | If you swapped to... | The Cash Yardstick... | The Measurability Bias... | The Cash/Nudge Tension... |
  | :--- | :--- | :--- | :--- |
  | **Rights / Justice** | Becomes irrelevant. Cash doesn't fix structural injustice. | Drops. You fund legal aid, organising, advocacy even without DALYs. | Resolved. You fund what communities demand, not what you calculate is 'healthy'. |
  | **Trust-Based Philanthropy** | Becomes a floor, not a benchmark. | Drops significantly. You fund multi-year unrestricted core costs. | Resolved. Recipients decide the mix of cash vs. goods. |
  | **Longtermism** (EA variant) | Becomes irrelevant. Future lives outweigh current cash. | Shifts to AI safety, biosecurity metrics (hard to measure but modelled). | Irrelevant. Focus is on existential risk, not current poverty alleviation. |

  ### Summary: Settled vs. Contested

  To assist your advising role, here is the breakdown of what is genuinely settled among the experts versus what is merely the path of least resistance.

  **Genuinely Settled (High Consensus):**
  *   **Counterfactuals matter:** You must compare what you fund against what else could have been done with the money.
  *   **Evidence matters:** Anecdote is not enough; you need some rigour.
  *   **Global Poverty is neglected:** Relative to its scale, Western funding for extreme poverty is low.

  **Contested (Active Disagreement):**
  *   **The 'Cash Multiple' Metric:** Many think it is useful; many think it is reductive and distorts priorities.
  *   **The Exclusion of Systemic Work:** There is a loud internal chorus admitting that the avoidance of policy/political work is a failure of the current model, not a feature.
  *   **Paternalism:** The boundary between 'helping people help themselves' and 'imposing values' is not agreed upon.

  **Advice for your Foundation:**
  You are not strictly required to adopt the 'GiveWell model' in its entirety to be effective. You can accept the *rigour* (checking evidence) without accepting the *reductionism* (ignoring anything without a number).

  If you wish to diverge from the mainstream practice, you do not need to abandon effectiveness. You simply need to be explicit that you are trading some **epistemic certainty** (knowing exactly what you bought) for some **potential upside** (fixing systems rather than symptoms). That is a rational trade-off, provided your board understands it is a strategic choice, not a failure of diligence.
