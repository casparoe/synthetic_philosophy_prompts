answer: |-
  Here is a reading of the film structured for your seminar, keeping your constraints and coinages in mind, while distinguishing between settled transitional justice debates and your specific theoretical interventions.

  ### 1. The Friend's Claim: Narrative Failure vs. Justice
  Your friend is half-right, but the halves matter. The film is formally about the inability to write a story—the protagonist, Espósito, struggles for decades to finish a novel about the case. However, to say it is *only* about narrative failure risks depoliticizing the text. In the logic of the film, the narrative fails *because* justice fails. Espósito cannot find the ending of his book because the state never provided an ending to the case.

  The film argues that a coherent national narrative (the novel) is impossible without a resolved moral account (the justice). So, it is not that justice is irrelevant to narrative; rather, justice is the precondition for the narrative. When you teach this, you can frame it this way: the film suggests that transitional justice mechanisms are not just administrative; they are narratological. They attempt to close a plot. When the state refuses to close the plot (via impunity), the private citizen becomes obsessed with closing it themselves, often destructively.

  ### 2. The Unsayable Residue
  Your concept of the **unsayable residue** finds strong support in the film's formal apparatus, though you should flag this as a speculative reading of the text, not a settled legal fact.

  **Where the film dramatizes it:**
  The breakthrough in the investigation does not come from a confession or a document. It comes from Espósito staring at old photographs, noticing a specific look in the suspect's eyes—a gaze directed not at the camera, but at the victim in the crowd. This is non-propositional knowledge. You cannot put "the way he looked at her" into an affidavit easily. It is intuitive, visceral, and evidentially fragile. Later, the recognition in the stadium relies on pattern recognition and obsession, not procedure.

  **Where the distinction holds:**
  Standard transitional justice literature accepts that truth commissions prioritize forensic truth (who did what) over emotional or social truth. Your claim goes further: it suggests there is a category of knowledge that is *structurally inadmissible* to any hearing, even a flexible one. The film supports this by showing that the legal system dismisses Espósito's intuition as obsession. The "residue" is the gap between what Espósito *knows* (in his gut, via the photos) and what he can *prove* (in court).

  **Where the distinction might be reading philosophy into melodrama:**
  Be careful here. The "eyes" motif is also a romantic trope connecting the crime to Espósito's unrequited love for his colleague, Irene. A skeptical student might argue that the "residue" isn't a philosophical category of knowledge, but simply a plot device to show the detective's brilliance. If you present the "residue" as a universal feature of transitional justice, you risk overstating the film's argument. It is safer to say the film *uses* this residue to dramatize the insufficiency of legal procedure, not necessarily that all legal procedures fail this way.

  ### 3. The Acknowledgement Hostage
  This is your most provocative claim, and you need to be clear with students about its status in the field.

  **Settled vs. Contested:**
  *   **Settled:** It is widely accepted in comparative work that amnesty trades criminal punishment for truth or stability. It is also settled that victims often feel marginalized when perpetrators receive immunity.
  *   **Contested:** Your claim that amnesty hands the wrongdoer a **veto** over acknowledgement is a specific philosophical argument, not an empirical consensus. Many proponents of conditional amnesty (like the South African model) argue that the process *forces* acknowledgement by requiring public disclosure. They would argue the state retains the leverage: speak or lose immunity. Your counter-argument is that compelled speech is not acknowledgement. This is a contested moral claim. Some scholars argue public shaming *is* a form of acknowledgement; others agree with you that without voluntary contrition, it is empty.

  **Where the film dramatizes the veto:**
  The suspect, Gómez, knows he is protected. He does not need to speak because the state will not make him. The victim's husband, Morales, is left waiting for a recognition that never comes. The state's withdrawal creates a vacuum where Gómez holds all the cards. He can live freely while Morales ages in grief. The power dynamic is inverted: the wrongdoer has the freedom of silence; the victim has the burden of memory.

  **Where the film complicates the veto:**
  Morales eventually removes the veto. He kidnaps Gómez and imprisons him. This suggests the veto is only permanent if the victim remains dependent on the state. Once the victim privatizes justice, the veto is broken—but at the cost of becoming a jailer.

  ### 4. The Third Wrinkle: The Captured Addressee
  You noted that the state doesn't just withdraw; it employs the killer. This is crucial and often missed in quick readings.

  **The Distortion:**
  In the film, Gómez is not just a random criminal; he is protected by political patrons linked to emerging paramilitary forces. He finds work within the state apparatus during the dictatorship. This means the "addressee" of the victim's claim (the state) is not neutral; it is complicit.

  **Implication for your seminar:**
  This moves the discussion beyond "impunity due to fragility" (we can't prosecute because the democracy is new) to "impunity due to continuity" (we can't prosecute because the perpetrators are still here). This distinguishes the Argentine context from cases where regimes fully collapsed. If you use this, emphasize that your "Acknowledgement Hostage" concept is worse here: the hostage-taker is working for the hostage-negotiator.

  ### 5. The Ending: Private Justice as Inverted Truth Commission
  The ending is the crux of your lecture. Morales keeps Gómez in a shed for decades, isolated, silent, and alive.

  **Is it a cure or worse than the disease?**
  The film invites ambivalence.
  *   **Argument for Cure:** It resolves the narrative. Espósito can finally write his book. Morales has secured his version of justice. The veto is broken.
  *   **Argument for Worse Disease:** Morales has become the monster. He denies Gómez death (which Gómez fears) but also denies him humanity. He creates a private truth commission that demands no speech and offers no reconciliation. It is pure punishment without process.

  **Your Second Point (The Hostage):**
  Does this answer your point? Yes, but tragically. It shows that if the state leaves the claim lying around, the victim will seize the veto power back by force. But in doing so, the victim destroys the possibility of *public* acknowledgement. It becomes a secret between two men. This is the inverse of a truth commission: instead of public truth for private amnesty, it is private imprisonment for public silence.

  **Register Check:**
  Be honest here: Transitional justice literature generally condemns vigilante justice as destabilizing. The film romanticizes it as necessary closure. You should tell students that while the film presents this as a satisfying emotional resolution, it is a normative failure in TJ terms. It solves the personal trauma but undermines the rule of law.

  ### 6. Comparative Constraints: Would SA or Community Justice Fix This?
  You asked if the complaint dissolves under other models.

  **Conditional Amnesty (South African style):**
  *   **Dissolves:** If Gómez had to apply for amnesty, he would have to speak publicly. This breaks the silence. The victim gets a record of what happened.
  *   **Does Not Dissolve:** Your "Acknowledgement Hostage" claim hinges on *voluntary* acknowledgement. If Gómez speaks only to save his skin, is it acknowledgement? The film suggests no. Morales wants Gómez to *suffer* the knowledge, not just state it. Also, Gómez is a sociopath; he might lie or minimize. The film implies some truths are only accessible through obsession, not testimony.

  **Community Justice (Gacaca style):**
  *   **Dissolves:** This brings the judgment to the neighborhood. Gómez could not hide in plain sight if the community was judging him. It removes the "state capture" element.
  *   **Does Not Dissolve:** Gómez is a lone obsessive, not a neighbor settling a land dispute. The crime is sexual murder, which often carries shame that silences communities. Furthermore, the film shows the crime is linked to political elites, not local friction. A community court might be too weak to handle perpetrators with state connections.

  **Verdict:** The complaint partly dissolves (public record is created; community pressure increases) but partly remains (compelled speech may not equal moral acknowledgement; political protection may override community courts).

  ### 7. What a Dissenting Student Would Say
  To keep the seminar honest, anticipate these objections:
  1.  **Genre Distortion:** "Professor, this is a noir thriller. Espósito is an alcoholic obsessed with his boss. Morales is a grieving husband. They aren't making philosophical points about transitional justice; they are acting out personal trauma. You are treating plot holes as theoretical arguments."
  2.  **Timeline Anachronism:** "The crime happens in 1974, before the dictatorship. The amnesty laws come in the late 80s. The film blends these together to make a political point that doesn't historically hold. The impunity at the start is corruption, not transitional justice."
  3.  **The 'Residue' is Just Clues:** "The 'unsayable residue' is just evidence the police were too lazy to find. It's not that the knowledge was inadmissible; it's that the system was incompetent. Don't confuse corruption with epistemic limits."

  ### 8. What the Film Adds
  Finally, what does this fiction give you that the case studies don't?
  The papers and case studies give you the *mechanism* of justice (or lack thereof). They explain the laws, the commissions, the statistics. The film gives you the *temporal cost*.

  Transitional justice documents often speak in phases: pre-transition, transition, consolidation. The film shows a life span. It shows what impunity looks like when you have to live with it for thirty years. It shows the aging body of the victim, the stagnation of the investigator, the quiet aging of the killer. The comparative material tells you why the amnesty happened; the film tells you what it feels like to wait for a justice that never comes, and what kind of monster that waiting creates.

  Use the film not to explain the laws, but to explain the *hangover*. Your concepts of "residue" and "hostage" are tools to articulate that hangover. Just remind the class that while the film diagnoses the pain brilliantly, its proposed cure (private vengeance) is one the field ultimately rejects.
