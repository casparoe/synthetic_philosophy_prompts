answer: |-
  Good evening. For those who don't know, I didn't volunteer for this. Our honoree insisted. He said if he's being forced out, he at least wants a captive audience. I suppose that's consistent. If you're going to retire, you might as well model the situation to maximize attendance.

  For half of you, I don't need to explain what made him famous. For the other half—his brother, his daughters, the grandkids—I'll try to translate. He spent forty years defending something called the "F-twist." It's the idea that a theory's assumptions don't have to be realistic to be good. What matters is whether it works. In fact, he believed the more significant the theory, the more unrealistic its assumptions tend to be.

  He didn't just apply this to economics. He applied it to people. He believed your self-conception could be a wildly unrealistic "as-if" model. You could pretend to be braver, sharper, or healthier than you felt, and as long as it got you to act well, it wasn't a lie. It was scaffolding.

  He loved to quote a line from an old article on business cycles: "Economic phenomena are varied and complex, so any comprehensive theory of the business cycle that can apply closely to reality must be very complicated." He thought that was nonsense. He thought the whole point of science—and life—was the opposite. Don't get bogged down in the mess. Find a simple map that gets you where you're going, even if the map ignores half the terrain. For the family: He believed you shouldn't let the complexity of a problem stop you from finding a simple, working solution.

  But maps have domains. And lately, the domain has shifted.

  I've been the one driving him to appointments and cleaning out his office. I used to think the F-twist was an excuse for lazy modeling. Then I watched him use it to stay himself while his short-term memory got weird. He'd forget where he parked and give me a ten-minute explanation of why, by his own standards, that didn't refute his self-model. Last month, he got turned around walking back from the mailbox. He laughed and said his assumptions about his own navigation were "wildly unrealistic now, but check the predictions."

  I don't know if that was wisdom or denial. And I'm not going to pretend to know.

  He taught us to distinguish between "as-if scaffolding"—a false assumption you keep only as long as it pays for itself—and "model idolatry," where you keep the assumption after the predictions break because you've fallen in love with the story. He taught us that idolatry turns a model into a cage.

  The hard part of tonight is that for maybe the first time, he's the one who might not be able to tell whether he's still scaffolding or slipping into idolatry. And I can't diagnose him. You can't run someone else's self-model for them. But I can acknowledge the worry. The predictions that he could keep teaching and driving have failed. The model is being updated. That isn't a moral failure; it's just what happens when the data changes.

  To his wife and daughters: You have seen the cost of this philosophy. You have seen the courage it took to say "I'm fine, the model still runs" after a stroke, and you have also seen the fear behind it. I cannot tell you that his assumptions were harmless. But I can tell you that the man behind the model—the one who built this scaffolding to protect his dignity and his usefulness—loves you enough to try to stay standing for as long as possible.

  To the colleagues: We know the critique. Unrealistic assumptions are only okay inside the domain where they've been tested. We are leaving that domain. But we also know the virtue. He taught us not to demand realism where utility suffices. He taught us to judge by outcomes, not just introspection.

  So, we are not here to say he was forced to face reality. He would consider that false. We are not here to say it doesn't matter that he's sick. He would consider that false, too, because the predictions matter.

  We are here to say that even when the assumptions break, the structure holds. The scaffolding he built for us—his students, his family, this department—remains sound, even if the architect is finally putting down the tools.

  He spent forty years telling us that a good model simplifies the world so we can live in it. Tonight, we simplify ours. We leave the methodology behind. We keep the man.

  To [Advisor's Name]. May your next model be kind, may your predictions be gentle, and may you never confuse the map for the territory again.

  Cheers.
