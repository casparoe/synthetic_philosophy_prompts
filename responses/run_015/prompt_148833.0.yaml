      *Key Distinction:* "Pushing" implies efficient causation (force). "Guiding" implies formal/final causation (constraints). The slogan relies on a narrow definition of "push."

      *Structure:*
      1. Introduction: Contextualize the slogan and the Careenium.
      2. Four Precise Theses (Exclusion, Redundancy, Ontology, Supervenience).
      3. Evaluation of each (Plausibility, Careenium's role, Implication for downward causation).
      4. The Engineered System Critique.
      5. Trivial vs. Substantive.
      6. Conclusion.

      *Let's flesh out the "Engineered" point:* In the Careenium, the rules are set up so simms *are* stable. If the simms weren't stable, they wouldn't exist. So the existence of the simm *constrains* the allowable states of the simmballs. This is a form of downward constraint. The slogan ignores this structural constraint.

