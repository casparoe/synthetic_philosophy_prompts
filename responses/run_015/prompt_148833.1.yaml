      *   *Thesis 2: Causal Exclusion.* (If the physical cause is sufficient, the mental/symbolic cause is excluded). This leads to epiphenomenalism.
      *   *Thesis 3: Explanatory Sufficiency/Redundancy.* (We *can* explain everything at the bottom level, so top level is unnecessary). This is epistemic, not ontological.
      *   *Thesis 4: Supervenience.* (No change in simms without change in simmballs). This is a dependency relation, not necessarily causal.
