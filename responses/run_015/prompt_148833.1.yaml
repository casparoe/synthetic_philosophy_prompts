      *   *Thesis 2 (Exclusion):* This is the contentious one. Just because simmballs push simmballs doesn't mean simms *didn't* cause the simmball configuration that led to the push. (Counterfactual analysis).
      *   *Thesis 3 (Redundancy):* True in principle for the Careenium (Laplace's Demon), but pragmatically false (computational irreducibility).
      *   *Thesis 4 (Supervenience):* Trivially true by construction. But supervenience $\neq$ reduction.
