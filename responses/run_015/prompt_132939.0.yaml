answer: |-
  §1. Your framing of the two jobs for Origin Essentialism (OE) is precise. The tension between the Intuitive job (parental identity) and the Permutation job (twinning identity) effectively sets the stakes. No repairs needed here; the dilemma is correctly stated.

  §2. Your discrimination dilemma is strong, but the essentialist has a stronger repair than you credit. They can individuate daughter cells by spatiotemporal continuity without invoking haecceities or circular personal identity. The "left" cell is simply the cell continuous with the organismic mass that becomes A. This avoids circularity if 'organismic mass' is defined biologically, not personally. The cost is not necessarily full causal-history essentialism, but it does make origin parasitic on continuity. If origin is just the earliest stage of the continuous organism, OE collapses into organism essentialism. The haecceitist repair you note is indeed the most robust: accept primitive thisness for cells. This saves OE's distinctness but renders it explanatorily idle regarding qualitative similarity. You should explicitly state that the "collapse" into causal-history essentialism follows only if cell identity supervenes on qualitative history. If cell identity is primitive, the collapse is avoided, but at the cost of qualitative grounding.

  §4. The fusion case threatens uniqueness only if origins must be gamete-pairs. You correctly note that relocating origin to the fusion event reimports the grain problem. The strongest essentialist repair is to define origin as the *minimal sufficient causal base* for the organism. For chimeras, this base includes both gamete-pairs; for non-chimeras, one. This preserves uniqueness of the *base* while allowing plural gametes. However, this forces a disjunctive account of what constitutes an origin event (zygote formation vs. fusion). This violates the uniformity constraint often implicit in OE: that the metaphysical structure of origin is identical across persons. If the structure varies by biological accident, OE loses its status as a deep metaphysical principle and becomes a biological generalization. Your cardinality objection holds: if the size of the set S is not essential, you lack a principle for permissible variation. If it is essential, modal status depends on cytological noise. The essentialist must bite the bullet: the exact composition of the causal base is essential. This is costly but coherent.

  §5. Your modal reasoning here is the most vulnerable. You slide from indeterminacy of identity (whether P = P*) to indeterminacy of de re modal claims (whether P originated from G). If you adopt semantic vagueness (indeterminate reference), then relative to any precisification, P is determinately identical to some organism, and OE is determinately true or false. You cannot claim OE is true while the object is indeterminate; relative to a precisification, OE either holds or fails. To sustain your claim, you need ontic vagueness: it is indeterminate in the world whether the organism originating from G is identical to the organism originating from G*. This invites the Evans argument unless you deny that identity properties are determinate. You must clarify whether the indeterminacy is in the world (ontic) or in our concepts (semantic). If semantic, OE survives but becomes precisification-relative. If ontic, you must defend vague identity against the standard objection that identity is an all-or-nothing relation. Currently, you suggest OE remains true while intuitions lack objects; this is incoherent unless you mean OE is true on all precisifications, which contradicts the setup where the endpoint originates from G*.

  Prose and Compression. In §2, the move from "cell identity" to "chemical environment" is compressed. You need a premise linking cell individuation to environmental sensitivity. In §4, the jump from "cardinality not essential" to "arbitrariness" requires a bridge: without essential cardinality, what bounds the set? Your argument assumes any bound is arbitrary, but the essentialist might argue the bound is fixed by biological sufficiency.

  Weakest Claim. The single weakest claim is in §5: "OE may be true as a necessary claim while our intuitions about origins have no determinate object." This conflates the truth conditions of OE with the reference of our terms. If reference is indeterminate, OE's truth value is indeterminate unless defined over precisifications. If defined over precisifications, OE is not uniquely true but variably true. You cannot maintain OE as a determinate necessary truth while denying a determinate object for the origin relation. This undermines the modal force you aim to preserve.
