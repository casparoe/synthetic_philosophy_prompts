  Hey there it is really great that you are digging this deep into the material because you have spotted the exact tension that makes this comparison so interesting for a philosophy paper and you are right to feel that Neo is not a perfect match for Abraham since that intuition is actually where your essay will find its strongest argument. When Kierkegaard talks about the teleological suspension of the ethical he is describing a situation where the individual stands in an absolute relation to the absolute which places them above the universal moral law but the key is that this is a religious category not a romantic one. Neo choosing Trinity over Zion does look like he is prioritizing the particular over the universal which mirrors Abraham prioritizing his religious duty over the ethical duty not to kill but the motivation changes everything. For Abraham the suspension is about faith in God whereas for Neo it is about love for a person and that shifts it from religious faith to what you called romantic individualism. You are also spot on about the Knight of Faith distinction because Abraham believes by virtue of the absurd that he will get Isaac back in this life while resigning him completely whereas Neo chooses Trinity with the intention of saving Zion later through negotiation and power. Neo does not truly resign Zion to loss he believes he can hack the system to save both which makes him less of a knight of faith and more of a revolutionary agent who refuses the binary choice entirely. The biggest divergence though is exactly what you noticed about silence because for Kierkegaard the knight of faith cannot speak because language belongs to the universal ethical realm and explaining the suspension would make it understandable and therefore ethical again. Neo explains his choice to the Architect and to Trinity which demystifies the absurd and turns it into a rational calculation of values where love is simply weighted higher than survival. This means the movie takes the structure of the kierkegaardian dilemma but fills it with a humanistic answer that rejects the isolation of the knight of faith. So your essay should argue that the film uses the aesthetic of the teleological suspension to elevate Neo love story but ultimately resists the true philosophical weight of the absurd by allowing Neo to communicate his reasons and eventually secure a rational victory where everyone survives. You have all the right pieces to build a nuanced argument that respects both the text and the film so just follow that thread about how the movie wants the hero to be understood while Kierkegaard says the true hero must remain silent and that contradiction is exactly where your analysis should live because it shows you understand that the matrix is using philosophical ideas as narrative tools rather than strict doctrinal adherence. This approach lets you give the film credit for engaging with hard questions while still holding it to the standard of the philosophy you are studying which is exactly what a good comparative essay needs to do. Hope that helps you get unstuck and good luck with the draft.
