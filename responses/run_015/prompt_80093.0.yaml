answer: |-
  Here are three candidate cases sketching different intervention points:

  1.  *Atta* Chemical Bridge: A barrier on the main foraging trail allows physical passage but blocks pheromone deposition, stopping the colony from scaling recruitment to food quality while leaving individual walking intact.
  2.  *Pogonomyrmex* Interaction Block: A physical baffle at the nest entrance prevents antennal contact between returning and outgoing foragers, eliminating humidity-based foraging regulation while keeping individual exit behavior normal.
  3.  *Temnothorax* Tandem Sever: Disrupting the tactile link between leader and follower during emigration prevents consensus on a new nest site while leaving individual scouting capabilities untouched.

  I'm selecting Case 1 (*Atta* Chemical Bridge) because it adheres most closely to your spec regarding "severing one specific communication channel... the main pheromone trail," and it offers a clean empirical dissociation between signal transmission and motor execution that both camps must grapple with without stipulating mental status.

  ***

  **Scenario**

  In a mature *Atta cephalotes* colony, a narrow solvent-treated bridge is inserted into the main pheromone trunk trail connecting the foraging front to the nest entrance, permitting workers to physically traverse the path but preventing loaded foragers from depositing chemical recruitment cues on the return leg. Following this intervention, individual workers continue to exit the nest, walk the trail, and cut leaves at baseline rates, demonstrating intact motor routines and local navigation. However, the colony fails to amplify traffic flow when high-quality vegetation is discovered, distributing foragers evenly across available patches regardless of yield, thereby losing the capacity for adaptive resource allocation while retaining simple locomotor competence.

  ***

  **Check**

  1.  **Case Statement:** The colony is an *Atta cephalotes* leafcutter nest; the intervention is a chemical-blocking bridge on the main return trail; the deficit is the loss of adaptive traffic scaling (collective optimization) while individual locomotion and leaf-cutting (local execution) remain intact.
  2.  **Camp F (Superorganist) Analysis:** Camp F argues this confirms the colony has a mind because the deficit mirrors a specific cognitive lesion in a brain: the system retains "motor function" (walking) but loses "executive control" (adaptive allocation). For Camp F, the capacity to differentially regulate behavior based on environmental value is a functional hallmark of cognition; the fact that this capacity disappears when the communication channel is severed proves the mind was distributed across that channel, not located in the individuals.
  3.  **Camp I (Organizationalist) Analysis:** Camp I argues this confirms the colony is merely an organization because the deficit is fully explained by the disruption of a mechanical feedback loop. For Camp I, the "adaptive allocation" was never a mental state but an emergent property of positive reinforcement rates; severing the channel simply breaks the circuit like cutting a wire in a factory, reducing efficiency without implying a loss of "mind," just as a company loses coordination if phones are cut but workers remain sane.
  4.  **Structural Feature:** The crux is the **dissociation of individual motor competence from collective adaptive regulation**, allowing the system to look "broken" at the macro level while remaining "whole" at the micro level.
  5.  **Removal Consequence:** If you remove this feature by making the deficit global (e.g., the solvent kills the workers or blocks physical passage entirely), the case collapses toward Camp I; if nothing moves, both camps agree the system is merely damaged matter, and the specific debate about distributed cognition vanishes because there is no behavior left to interpret.
  6.  **Strongest Attacks:** A Camp F defender would attack Camp I for committing a "neuron fallacy," arguing that denying mind to the colony because individuals lack it is like denying mind to a brain because neurons lack it. A Camp I defender would attack Camp F for committing a "mereological fallacy," arguing that functional isomorphism (acting like a mind) does not entail ontological identity (being a mind), especially when the mechanism is known to be blind feedback.

  Verdict: dissociation of individual motor competence from collective adaptive regulation
