answer: |-
  The asymmetry you're pointing out rests on a dualistic theory of agency that splits the population into two distinct moral categories: the subordinate agent (the benefit claimant) and the strategic agent (the corporation or wealthy individual). To make sense of why a single mother gets sanctioned for a missed appointment while a multinational retains millions from a loophole, the system presupposes different rules for how causality and control work for each group.

  Here is the breakdown of the implicit philosophical commitments.

  ### 1. Implicit Commitments

  **Strict Liability vs. Legal Formalism**
  For the claimant, the system operates on a form of strict liability. Moral culpability is detached from intent. If you are overpaid due to a bureaucratic error, you are liable for repayment even if you spent the money in good faith. The moral failure is located in the *state of affairs* (you have money you shouldn't) rather than the *action* (you didn't steal). For the corporation, the system operates on legal formalism. Culpability is attached strictly to the letter of the law. If the code allows the loophole, the action is neutral. The moral status is located in the *action* (following the code) rather than the *state of affairs* (paying less than the social expectation).

  **The Sovereignty of Need vs. The Rationality of Profit**
  The workfare model assumes that the poor possess sovereignty over their labor supply. It presupposes that unemployment is primarily a supply-side issue (the worker choosing not to sell labor) rather than a demand-side issue (no one buying labor). Conversely, the tax model assumes corporations are bound by fiduciary rationality. They are expected to minimize costs. If a loophole exists, taking it is treated as a mechanical necessity of business survival, not a moral choice.

  **Temporal Responsibility**
  For the claimant, responsibility is retrospective and immediate. You are punished for past administrative failures regardless of current need. For the corporation, responsibility is often prospective or deferred. Tax avoidance is framed as "planning," implying a future-oriented optimization that is rewarded rather than a past violation that is punished.

  ### 2. Which Commitments Do the Work?

  The heavy lifting is done by the **Modal Control Claim**. This is the assumption about what was possible in "nearby possible worlds."

  *   **For the Poor:** The system assumes high modal control. It presumes that in a nearby possible world where the claimant tried harder, woke up earlier, or read the form more carefully, the negative outcome (unemployment or overpayment) would not have occurred. Unemployment is treated as a counterfactual choice. Therefore, the actual outcome is deserved because it reflects a failure of will or competence.
  *   **For the Rich:** The system assumes low modal control regarding the structure of the law. It presumes that in nearby possible worlds, the corporation would still have encountered the loophole because the law is an external environment like weather. Avoiding the loophole is treated as counterfactually difficult or irrational (breaching fiduciary duty). Therefore, the outcome is not deserved in a moral sense, but it is permitted as a rational necessity.

  This asymmetry allows the state to treat poverty as a personal failure of navigation while treating tax avoidance as a successful navigation of a fixed system. It ignores that corporations often help write the tax code (high control over structure) while workers have little control over labor markets (low control over structure).

  ### 3. Consistency Check

  If you apply the same standard both ways, the practice contradicts itself immediately.

  *   **Apply Workfare Standards to Corporations:** If we apply strict liability and good-faith irrelevance to tax, corporations would have to repay any tax savings derived from loopholes that legislators did not explicitly intend, regardless of legal advice. "I thought it was legal" would not be a defense. This would destabilize capital planning and treat tax avoidance as theft.
  *   **Apply Tax Standards to Workfare:** If we apply legal formalism and intent-sensitivity to benefits, claimants would not be sanctioned for missed appointments if there was a reasonable excuse (like illness or transport failure), and overpayments caused by system errors would not be recoverable if the claimant acted in good faith. This would increase fiscal bleed and reduce the disciplinary power of the welfare state.

  The contradiction reveals that the system is not designed around a consistent theory of justice or responsibility. It is designed around power preservation. The poor are disciplined to ensure labor supply compliance; the wealthy are accommodated to ensure capital retention. The philosophical glue holding this together is the fiction that the poor have total control over their economic fate, while the rich are merely subjects of the market's laws.

