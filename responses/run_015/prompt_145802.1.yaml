  To the Members of the Curatorial Ethics Committee

  I am writing to submit my formal recommendation regarding the display policy for the central gallery of our upcoming permanent programme, The Measure of Harm: Violence in the Long Twentieth Century, ahead of our deliberation this Thursday. After careful review of the research office's data on intentional violent mortality and the dissenting consultants' analysis of structural exposure mortality, I urge the committee to recommend that the museum withhold a singular headline claim about whether the world is becoming less violent and instead frame the exhibition explicitly as an inquiry into measurement itself. This approach does not merely split the difference between the competing datasets but elevates the methodological conflict into the primary narrative of the gallery, thereby transforming a potential liability into an educational opportunity that aligns with our mandate as a institution of social history. By presenting the per-capita decline in kinetic harm alongside the absolute figures for systemic exposure deaths, not as contradictory truths but as competing lenses through which history is viewed, we honor the complexity of the human experience without succumbing to the paralysis of indecision.

  My rationale for this position rests on the specific mission of a social history museum, which is to elucidate how societies understand themselves rather than to issue pronouncements that belong to the realm of political science or policy advocacy. If we present the per-capita decline as established fact, we validate the lived experience of those who have survived direct aggression but risk erasing the memory of those who perished due to the collapse of care infrastructure, effectively deciding that their deaths are less relevant to the history of violence. Conversely, if we present only the absolute numbers adjusted for demographic transition, we risk obscuring the genuine triumphs of international law and conflict reduction that have saved countless lives since 1945. By making the measurement the subject, we allow the visitor to see that the question Is the world less violent? is inseparable from the question What do we count as violence? This does not deny the reality of the data but contextualizes it, showing that historical progress is not a single line on a graph but a contested terrain of definitions and values.

  I am acutely aware that this recommendation will draw sharp criticism from the faction within our advisory group that maintains once an operational definition is fixed, there is an objective answer. Their strongest consideration is that refusing a headline claim is not intellectual humility but epistemic evasion dressed in relativism, and I treat this charge with the gravity it deserves. They argue that a museum must stand for something and that by withholding judgment we fail in our duty to provide clarity to a public desperate for moral anchors in a chaotic century. There is truth to the fear that emphasizing contested ontologies can lead to a cynical conclusion where all narratives are equally valid and no moral progress is possible. However, I contend that acknowledging the contestation is not the same as surrendering to relativism. We are not saying that truth does not exist, but rather that social truth is multifaceted. To present one metric as the sole arbiter of reality would be to smuggle in a normative judgement about which sufferings belong in the moral ledger without informing the public that such a choice was made. True clarity comes from exposing the architecture of the argument, not hiding the scaffolding behind a definitive headline that cannot withstand philosophical scrutiny.

  To ensure this recommendation is actionable before the trustees require a definitive decision by the month's end, I propose the following timeline for implementation. By this Tuesday, the curatorial team should draft the introductory wall text that frames the gallery as an investigation into metrics rather than a declaration of trends. By Wednesday, we will integrate the two competing visualizations into the central display mockup, ensuring equal visual weight is given to both the per-capita kinetic harm curve and the absolute structural exposure figures. This will allow us to present a unified brief at Thursday's committee meeting, giving us sufficient time to incorporate any feedback before submitting the final display policy to the board of trustees next week. This schedule ensures that the trustees are not asked to approve a vague concept but a concrete design that embodies the inquiry we propose.

  In conclusion, while the desire for a definitive statement on the trajectory of human violence is understandable, the ethical obligation of this institution is to prioritize accuracy over simplicity. The charge that this approach amounts to evasion is a serious one, but it is outweighed by the risk of presenting a partial truth as a whole one. By framing the exhibition as an inquiry into measurement, we empower our visitors to engage with the data critically, understanding that the way we count harm is itself a historical act with moral consequences. I believe this path offers the most robust defense of our integrity as stewards of the public trust and provides the most meaningful experience for those who walk through our doors. I look forward to discussing this proposal with you in person on Thursday.

  Sincerely

  Advisory Panel Member
