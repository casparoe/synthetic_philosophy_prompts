answer: |-
  The kettle whistled. Same pitch, same steam plume. Tuesday, again. Dust motes hung over the Formica table, exactly where they'd hung yesterday. Elara sat with pen hovering over the black notebook. The only object in the flat that refused to reset at midnight.

  She wrote: *Premise: To experience repetition, there must be a continuous subject.*
  Below it: *Condition for temporal synthisis.*

  Mark shuffled in, wearing the same grey hoodie. He didn't look at her, just reached for the cereal. "You're doing the logic thing again."

  "It's a deduction," Elara said, tapping the page. "If I perceive the loop, I must transcend it. There has to be an 'I' that holds the moments together. Otherwise, it's just disjointed slices of consciousness. No one to notice the cut. The synthesis requires a synthesizer."

  "Or," Mark said, pouring milk, "it's just narrative framing. You're imposing a story on a glitch. Narrative cohesion doesn't prove a substrate. Maybe the notebook is just... stuck. Like a scratch on a record. The groove repeats, but the needle isn't moving forward."

  "A scratch doesn't write new lines." Elara flipped back to yesterday's entry. The ink was dry, permanent. *Condition for temporal synthisis.*

  "But who says the writer is you?" Mark leaned against the counter, spoon paused. "Maybe the flat writes through you. Maybe the notebook is a prop in a play that resets, and the ink is just part of the set dressing that forgot to fade. Consistency isn't continuity. You're confusing the script with the actor."

  Elara looked at the word. *Synthisis*. She'd misspelled it yesterday. She'd misspelled it today.
  If the self was an illusion, a series of disconnected snapshots, why did the mistake persist? A true reset would correct the error, or randomize it. But the error was consistent. It was the anchor. The flaw proved the thread.

  "Or," Mark said, watching her stare at the page, "you just like spelling it wrong. It's character consistency. Not proof of soul."

  He walked out. The kettle whistled. Or had it never stopped?
  Elara touched the ink on today's line. It felt wet. Smudged under her fingertip.
  Yesterday's entry was dry.
  If the synthesis was broken, the typo shouldn't matter. But if the typo was the only thing holding her together, was she the writer, or just the ink?
  She closed the book. Tuesday waited.
