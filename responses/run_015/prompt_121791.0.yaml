answer: |-
  Here is a lesson plan designed to fit your 75-minute block (60 minutes for the game/debrief, 15 buffer). It's written in casual American English, ready for your course prep folder.

  # Seminar Game: The Impossibility Bake-Off
  **Goal:** Viscerally demonstrate the Gibbard-Satterthwaite (G-S) theorem. Students should leave feeling that *every* voting rule has a loophole, and the only way to plug them all is to hand power to a dictator or limit what people are allowed to want.

  **Class Size:** 12 students
  **Time:** 60 minutes active (plus 15 min buffer)
  **Materials:** Slips of paper (or a Google Form if you want to automate tallying), whiteboard.

  ---

  ## 1. The Setup & Payoffs (Non-Monetary)
  To make them care about the outcome without using cash, use **"Seminar Sovereignty Points" (SSPs).**

  *   **The Stakes:** At the end of class, tally each student's SSPs.
      *   **Top 3 Scorers:** Get to choose a privilege for next week (e.g., pick the reading, bring a snack for the class, or leave 10 minutes early).
      *   **Everyone Else:** Standard syllabus rules apply.
  *   **How to Earn SSPs:**
      *   If your **1st choice** project wins the round: **3 SSPs**.
      *   If your **2nd choice** project wins: **1 SSP**.
      *   If your **3rd choice** project wins: **0 SSPs**.
  *   **The Projects:**
      1.  **Lounge:** Fix the grad lounge furniture.
      2.  **Books:** Buy new shared books for the library.
      3.  **Speaker:** Fund a visiting philosopher.

  **Facilitator Note on the "30 Points" Mechanism:**
  *You mentioned allocating 30 points. For Rounds 1 & 2 (Borda/Condorcet), the G-S theorem technically requires **ordinal rankings** (1st, 2nd, 3rd), not cardinal points. To keep the math honest:*
  *   *Tell students: "Distribute your 30 points across the three projects to show intensity. We will convert this to a ranking for Rounds 1 & 2 (highest points = 1st choice). In Round 3, the points act as Approval weights."*
  *   *This honors your prompt while ensuring the G-S theorem actually applies to the first two rounds.*

  ---

  ## 2. The Timeline (60 Minutes)

  ### **0:00 – 0:10 | Intro & Preferences**
  *   Explain the SSP stakes.
  *   Hand out slips. Ask them to write down their **true** preferences first (just for their own reference).
  *   **Crucial Instruction:** "For this game, you want to maximize your SSPs. You may submit your true preferences, or you may lie. No one will see your individual ballot, only the aggregate result."

  ### **0:10 – 0:25 | Round 1: Borda Count**
  *   **Rule:** 1st place = 2 pts, 2nd place = 1 pt, 3rd place = 0 pts. Highest total wins.
  *   **Action:** Students submit ballots (converted from their 30-point allocation).
  *   **Tally:** Do this live on the board. Announce the winner.
  *   **Payoff:** Award SSPs based on the winner.
  *   **The Leak:** Ask: "Did anyone get their 3rd choice? If you had swapped your 1st and 2nd choice on the ballot, would the outcome have changed?"
  *   *Likely Outcome:* A student realizes burying a strong competitor helps their favorite.

  ### **0:25 – 0:40 | Round 2: Condorcet Method**
  *   **Rule:** Pairwise voting. (Lounge vs. Books), (Books vs. Speaker), (Lounge vs. Speaker). The project that beats all others wins. (If a cycle occurs, declare no winner/0 SSPs for everyone to raise stakes).
  *   **Action:** Students submit new ballots. Encourage them to revise based on Round 1.
  *   **Tally:** Live on board.
  *   **The Leak:** Condorcet is vulnerable to "cycling" and agenda manipulation. Even if no cycle occurs, ask: "Did anyone vote for their 2nd choice over their 1st to prevent a 3rd choice from winning?"
  *   *Likely Outcome:* Strategic voting increases. Honest voters lose SSPs.

  ### **0:40 – 0:50 | Round 3: Approval Voting**
  *   **Rule:** You have 30 points. You can spread them out or dump them all on one. Any project with >50% of total possible points gets "Approved." If multiple are approved, the one with the most points wins.
  *   **Action:** Students submit.
  *   **The Leak:** Approval voting feels safer, but now the strategy is about the **threshold**. "Do I approve my 2nd choice? If I do, my 1st choice might lose. If I don't, my 3rd choice might win."
  *   *Result:* By now, almost everyone is lying.

  ### **0:50 – 1:00 | The Debrief (The "Aha" Moment)**
  *   Don't lecture. Ask questions.
  *   **Q1:** "How many of you voted honestly in Round 3? Keep your hands up." (Usually, only 1 or 2 hands stay up).
  *   **Q2:** "For those who put your hands down: Why? Were you trying to game the system, or protect yourself?"
  *   **Q3:** "If everyone lies, does the result reflect what the group actually wants?"
  *   **The Reveal:** "You just tried three different 'fair' systems. In every single one, honesty was a losing strategy. Gibbard and Satterthwaite proved mathematically what you just felt: **With 3+ options, any voting system is either manipulable, dictatorial, or restricted.**"
  *   **The Solution:** "So how do we fix it? There are only two ways:
      1.  **Dictatorship:** We pick one person (say, Sarah) and just do what she wants. No strategy needed for anyone else.
      2.  **Domain Restriction:** We agree beforehand that no one is allowed to have certain preferences (e.g., everyone must agree 'Speaker' is either best or worst, never middle)."

  ---

  ## 3. Facilitator Notes: Concepts & Clarifications

  ### **Strategy-Proofness vs. Pareto Efficiency**
  *You mentioned being fuzzy on this. Here's the cheat sheet for the debrief.*

  *   **Pareto Efficiency (Consensus):** If *everyone* prefers Option A over Option B, the voting system should not choose Option B. It's about not wasting unanimous agreement.
      *   *Example:* If 12/12 students want the Lounge fixed, a Pareto system *must* pick the Lounge.
  *   **Strategy-Proofness (Honesty):** You should never get a better result by lying about your preferences. Truth-telling should be your "dominant strategy."
      *   *Example:* If you actually like Books best, but you vote for Lounge because you think Books will lose, the system is **not** strategy-proof.
  *   **The Distinction:** A system can be Pareto Efficient but *not* Strategy-Proof (e.g., Borda Count usually respects unanimity, but you still have to strategize). A system can be Strategy-Proof but *not* Pareto Efficient (e.g., A rule that *always* picks the Speaker, regardless of votes. You can't game it—it's strategy-proof—but if everyone wants the Lounge, it violates Pareto).
  *   **G-S Theorem:** Says you can't have Strategy-Proofness + Pareto Efficiency + Non-Dictatorship with 3+ options.

  ### **Predictable Failure Mode: The "Game Theorist" Student**
  *   **What will happen:** In Round 1 or 2, one student (let's call him Alex) will realize he can manipulate the Borda count. He might whisper to his friends, "Don't vote for your true second choice, vote for the loser."
  *   **The Risk:** Alex dominates the outcome. Other students feel powerless and disengage.
  *   **The Salvage:** **Do not stop Alex.** Let him win.
  *   **In the Debrief:** Point to Alex. "Alex figured out the manipulation. By telling everyone else how to vote, he effectively became the **Dictator**. Notice how the rest of you stopped voting your preferences and just followed Alex? That is the Gibbard-Satterthwaite result in real time. The only way to stop the manipulation was to surrender to a dictator. Alex proved the theorem for us."
  *   *Why this works:* It turns a classroom management issue into the core learning objective.

  ### **What if there's a Tie?**
  *   Have a tie-breaking rule ready (e.g., "In case of a tie, the project with the fewest 1st-place votes is eliminated"). Announce this *before* Round 1. Ties are actually great for discussion ("Did you vote for a tie on purpose?"), but you need a mechanical way to resolve SSPs.

  ### **American English & Tone Check**
  *   Use "favorite" not "favourite."
  *   Use "program" not "programme."
  *   Keep the vibe low-stakes. If they stress about the SSPs, remind them it's about the *philosophy*, not the snack privilege.

  ---

  ## 4. Quick Prep Checklist
  1.  **Print Slips:** 12 per round (36 total). Pre-print "Lounge / Books / Speaker" on them to save time.
  2.  **Board Space:** Clear space to tally three different voting methods.
  3.  **Privilege Menu:** Write the 3 rewards on the board so they know what they're playing for.
  4.  **Calculator:** Have your phone ready to do quick math if the tally gets messy.

  **One final tip:** If the tallying takes too long, pick 3 students to be the "Election Commission" to count the ballots while you facilitate. It keeps the pace up. Good luck!
