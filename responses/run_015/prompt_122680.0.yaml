  # Modal Epistemology: A Decision Tree for Conceivability Principles

  **Instructions:** Start at the root. Answer the questions based on your intuitions about the cases provided. Do not worry about which philosophical "team" you end up on; the goal is to locate your commitments in the logical space.

  ---

  ### **ROOT: The Weight Question**
  **Consider the Zombie Case:** *You can form a coherent, detailed mental model of a physical duplicate of yourself that lacks any conscious experience. You find no contradiction in this model.*

  **Q1:** Does the fact that you can conceive of this Zombie scenario provide *any* prima facie justification for thinking such a Zombie is metaphysically possible?
  *   **(No)** $\rightarrow$ Go to **Leaf A (Modal Skepticism)**.
  *   **(Yes)** $\rightarrow$ Proceed to **Q2**.

  ---

  ### **NODE 2: The Scope Question**
  **Consider Two Domains:** *Domain 1 is Phenomenal Consciousness (e.g., pain, qualia). Domain 2 is Microphysical Chemistry (e.g., the structure of water).*

  **Q2:** Does the justificatory link you affirmed in Q1 hold globally for **both** domains, or does it hold for one but not the other?
  *   **(Local: Only Consciousness / Not Chemistry)** $\rightarrow$ Go to **Leaf B (Localism)**.
      *   *(Note: You hold the bridge principle is domain-specific. You may apply the remaining questions to your 'privileged' domain to refine your view, but your primary commitment is Localism.)*
  *   **(Global: Both or Neither)** $\rightarrow$ Proceed to **Q3**.

  ---

  ### **NODE 3: The Possibility Drift Question**
  **Consider the Drift Scenario:** *Suppose empirical study shows that sustained a priori reflection reliably expands the set of scenarios subjects cannot rule out. This expansion tracks reasoning time rather than the scenarios' actual modal status (i.e., the longer you think, the more things seem possible, without convergence).*

  **Q3:** How does this finding impact the link between *Ideal* Conceivability and Possibility?
  *   **(A Defeater):** This suggests conceivability is not a stable, truth-conducive guide, even at the ideal limit. The link is fragile/empirical. $\rightarrow$ Proceed to **Q4**.
  *   **(No Threat):** This just shows subjects haven't reached "Ideal" reflection yet. Ideal conceivability is *defined* as the point where drift stops (unchallengeability). $\rightarrow$ Proceed to **Q5**.

  ---

  ### **NODE 4: The Asymmetry Question**
  **Consider Negative Conceivability:** *Suppose you try to conceive of $P$ and fail (you cannot rule it out, but you cannot positively construct it either). Or, you simply find $P$ inconceivable.*

  **Q4:** Does the *failure* to conceive $P$ provide prima facie justification for thinking $P$ is **impossible**?
  *   **(No):** Success ($C \rightarrow \Diamond$) is evidence, but failure ($\neg C$) is not. The link is one-way. $\rightarrow$ Proceed to **Q6**.
  *   **(Yes):** The link is symmetric. Conceivability tracks the boundaries of modal space both ways. $\rightarrow$ *(Note: This path is logically open but historically rare for those who answered Q3-A. See Commentary.)* $\rightarrow$ Proceed to **Q6**.

  ---

  ### **NODE 5: The Identity Question**
  **Consider the Hesperus/Phosphorus Case:** *It seems conceivable that Hesperus (the Evening Star) is not Phosphorus (the Morning Star). However, it is a posteriori necessary that they are identical.*

  **Q5:** What explains the gap between the apparent conceivability and the impossibility?
  *   **(Semantic Split):** We conceived a scenario that is epistemically possible (primary intension) but not metaphysically possible (secondary intension). Ideal primary conceivability still entails possibility. $\rightarrow$ Go to **Leaf C (Two-Dimensionalism)**.
  *   **(Error/Misdescription):** We thought we were conceiving of Hesperus and Phosphorus, but we were actually conceiving of descriptive counterparts. Metaphysical necessity trumps conceivability. $\rightarrow$ Go to **Leaf D (Kripkean Line)**.

  ---

  ### **NODE 6: The Defeasibility Question**
  **Return to the Zombie Case:** *Suppose a proof emerges that physicalism is necessarily true.*

  **Q6:** How does your view on conceivability accommodate this?
  *   **(Constitutive Link):** Conceivability *constitutes* possibility (or is infallible when ideal). If physicalism is necessary, Zombies were never ideally conceivable. $\rightarrow$ Go to **Leaf C (Two-Dimensionalism)**.
  *   **(Evidential Link):** Conceivability is merely defeasible evidence. It can be overridden by stronger a posteriori or theoretical constraints. $\rightarrow$ Go to **Leaf E (Modest Modal Rationalism)**.

  ---

  ### **THE LEAVES**

  **Leaf A: Modal Skepticism**
  *   **Commitment:** Conceivability carries no modal weight.
  *   **Motivation:** Cognitive limitations, evolutionary debunking, or the sheer gap between epistemic and metaphysical domains.
  *   **Key Texts:** Van Inwagen, Hawke.

  **Leaf B: Localism**
  *   **Commitment:** The conceivability-possibility bridge works for some subjects (e.g., Consciousness) but not others (e.g., Chemistry/Math).
  *   **Motivation:** Domain-specific cognitive access; distinct metaphysical structures for mind vs. matter.
  *   **Key Texts:** Chalmers (regarding the phenomenal), various non-global rationalists.

  **Leaf C: Two-Dimensionalism**
  *   **Commitment:** Ideal Primary Conceivability entails Possibility. A posteriori necessities are handled via the 1D/2D semantic split. Drift is excluded by the definition of 'Ideal'.
  *   **Motivation:** Preserves rationalist insights while accommodating Kripkean cases.
  *   **Key Texts:** Chalmers, Jackson.

  **Leaf D: The Kripkean Line**
  *   **Commitment:** Conceivability is a fallible guide defeated by a posteriori necessity. Apparent conceivability in identity cases is an illusion of reference.
  *   **Motivation:** Rigid designation fixes reference independently of our descriptive conceivability.
  *   **Key Texts:** Kripke, Soames.

  **Leaf E: Modest Modal Rationalism**
  *   **Commitment:** Conceivability provides defeasible evidence with no constitutive link. Asymmetric (usually). Drift is a genuine threat/defeater.
  *   **Motivation:** Empirically grounded rationalism; avoids strong semantic commitments of 2Dism.
  *   **Key Texts:** Yablo, Geirsson.

  ---

  ### **COMMENTARY & LOGICAL SPACE ANALYSIS**

  **1. Mapping the Empty/Unattractive Spaces**
  *   **The Symmetric-Defeasible Gap:** In **Q4**, if you answered **(Yes)** (Symmetric) but came from **Q3-A** (Drift is a Defeater), you occupy a rare spot. You claim failure to conceive proves impossibility, yet admit that successful conceivability is fragile under reflection. This is logically coherent but pragmatically unstable: if your cognitive access is too drift-prone to trust positive conceivability, why trust negative conceivability (which is often harder to verify)? Most philosophers who accept Drift as a defeater (Modest/Kripke) also accept Asymmetry.
  *   **The Localist-2D Overlap:** **Leaf B (Localism)** is technically compatible with **Leaf C (2Dism)**. One could be a Two-Dimensionalist *only* about consciousness. In this tree, Localism is treated as an "exit ramp" at Q2 to highlight the domain restriction. If you took the Localist path but want to refine your view on consciousness, apply Q3–Q6 to that domain alone.

  **2. Indistinguishable Leaves**
  *   **Modest Rationalism (E) vs. Kripkean Line (D):** These leaves are genuinely difficult to separate in practice. Both treat conceivability as fallible evidence defeated by a posteriori necessity.
      *   *The Distinction:* The Kripkean typically claims the conceivability judgment was *false* (you didn't really conceive of Hesperus), whereas the Modest Rationalist claims the judgment was *true* but the inference *defeated* (you conceived it, but it's impossible).
      *   *The Tree's Limit:* **Q5** attempts to capture this via "Semantic Split" vs. "Error," but many Kripkeans accept a Yablo-style "seeming conceivability." If you find yourself bouncing between D and E, your disagreement is likely about the philosophy of reference, not modal epistemology proper.

  **3. The "Drift" Node Function**
  *   This node (Q3) is the critical filter for **Two-Dimensionalism**. 2Dism relies on a robust notion of *Idealization*. If you view "Possibility Drift" as undermining the truth-conduciveness of reflection (Q3-A), you cannot consistently hold that Ideal Primary Conceivability entails Possibility. You are forced into a fallibilist camp (Modest/Kripke). If you view Idealization as a limit concept immune to drift (Q3-B), you keep the door open for Strong Rationalism/2Dism.

  **4. Illustrations Used**
  *   **Consciousness:** The Zombie Case (Q1, Q6) tests the link in the domain where conceivability intuitions are strongest.
  *   **Identity:** The Hesperus/Phosphorus Case (Q5) tests how the view handles the classic Kripkean counterexamples to the conceivability principle.
