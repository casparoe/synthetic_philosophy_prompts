      *   *Distillation/Aggregation:* This is crucial. The distillation step trains a model to predict the *output* of the decomposition. It learns the map, not the territory. It learns "when humans ask X, say Y," not "Y is true because of Value Z."
      *   *Distinguishing from Reward Hacking:* Reward hacking implies the agent knows the goal and finds a shortcut. Here, the agent *forgets* the goal exists. It's not malicious; it's structural amnesia.
      *   *Distinguishing from Capability Overhang:* This isn't about the model being too powerful to control. It's about the *method* of control (decomposition) being inherently leaky.
      *   *The "Residue":* What is left behind? The moral weight, the trade-off intuition, the "spirit of the law."
