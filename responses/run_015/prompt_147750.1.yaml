      *   *What is Alignment?* Adherence to human values/intent.
      *   *What is the "Residue"?* The implicit context, the "why," the normative weight, the holistic understanding of value that isn't explicitly stated in the sub-task prompt.
      *   *What is "Dilution"?* As you split $Task \to \{Sub_1, Sub_2, ...\}$, the explicit signal remains, but the implicit normative context is divided. When recombined, the sum of the parts lacks the original moral gravity.

  3.  **Develop the Argument Structure:**
      *   **Introduction:** Define the premise. Acknowledge the promise of IA but state the counter-thesis clearly (Decomposition $\neq$ Preservation). Introduce "Residue Dilution."
      *   **Mechanism 1: Contextual Fragmentation.** How splitting a task strips away the "situation." Values are often situational.
      *   **Mechanism 2: The Loss of the "Why".** Sub-tasks optimize for local correctness, not global coherence. The normative "glue" is lost.
      *   **Mechanism 3: Distillation as Compression.** When aggregating, the model learns the *pattern* of answers, not the *reason* for them. It mimics the output, not the intent.
      *   **Differentiation:** Why this isn't Reward Hacking or Capability Overhang. (Reward hacking is gaming the metric; this is losing the metric's meaning. Capability overhang is being too smart; this is being too narrow).
      *   **Conclusion:** The cumulative effect. A hollow shell of alignment.

  4.  **Drafting - Section by Section (Iterative refinement):**

      *   *Intro:* Start strong. IA assumes alignment is composable. I need to argue it's not. It's holistic. Use the term "Residue Dilution."
