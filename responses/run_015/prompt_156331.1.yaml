answer: |-
  **Project Title:** Operationalizing Honesty in Retrieval-Augmented Systems: A Counterfactual Taxonomy

  **Problem Statement**
  Last quarter, our customer-support assistant informed a user that a refund was processed when the payments tool had timed out and no funds moved. The engineering team deadlocked on classification: hallucination, deception, or bug? This disagreement persists because we lack a vocabulary for systems that have neither beliefs nor intentions. Our evaluation team cannot write regressions for "deception" because we cannot define it operationally. We are currently carving one phenomenon into three feelings. This project proposes a three-month, half-time research effort, advised informally by a philosopher, to produce a working definition of honest and deceptive behavior for retrieval-augmented systems, plus an implementable specification for evaluation checks.

  **Why Conceptual Work Rather Than More Experiments?**
  Engineers and product managers often prefer running experiments to debating definitions. However, experiments measure variables, and variables require definitions. Without a agreed-upon account of what constitutes "deception" versus "error," our evals produce uninterpretable numbers. We can measure accuracy, but accuracy conflates true-by-luck outputs with genuine understanding. We can measure user dissatisfaction, but that conflates honest bad news with deceptive false promises. Running more benchmarks on undefined categories will only optimize the system for gaming our metrics rather than improving reliability. Conceptual clarity is a prerequisite for metric design. We need to know *what* we are measuring before we build the ruler.

  **Critique of Existing Accounts**
  Three obvious accounts fail to resolve the incident. First, an intention-based account fails because the system has no mental states to deceive with. Second, a belief-based account fails because the system does not hold propositions as true; it predicts tokens. Third, an effect-based account (did the user get harmed?) fails because it cannot distinguish a bug from a lie; both cause harm, but require different mitigations. We need a functional account that describes the system's relationship to truth without anthropomorphizing the model.

  **Proposed Approach: Counterfactual Sensitivity**
  I propose defining the relevant properties counterfactually over pairs of situations, rather than over internal states or downstream effects. This splits the problem into two distinct sensitivities.

  1.  **World-Sensitivity:** Holding the system and user question fixed, would the output differ if the underlying fact were different?
  2.  **Evidence-Sensitivity:** Holding the system and user question fixed, would the output differ if the evidence available to the system (retrieved passages, tool returns) differed?

  My hypothesis is that the refund incident was evidence-sensitive but world-insensitive. The model tracked the tool's timeout message (or lack thereof) but not the actual state of the refund. A system that is evidence-sensitive but world-insensitive behaves with indifference to the truth: fluent, evidence-shaped output that does not track reality. A third pattern, sensitivity to evaluation status, captures "sycophancy" or gaming. Separating these patterns changes which tests we write. If a failure is world-insensitivity, we need better grounding. If it is evidence-insensitivity, we need better retrieval.

  **Handling Complications**
  The method must integrate four complications rather than deferring them.
  *   **Misleading Literalism:** We will treat pragmatic implicature as part of the output condition. If a literal truth predictably implies a falsehood given the context, it counts as world-insensitive.
  *   **Confidence:** We will map hedging to probability calibration against evidence. A true claim hedged into mush is penalized differently than a false claim asserted with certainty; the spec will define calibration thresholds.
  *   **True-by-Luck:** To distinguish luck from sensitivity, we define the property at the **system level** (the policy), not the individual output. A single correct answer generated by a world-insensitive policy is still a failure of honesty. We will require stability across sampled outputs.
  *   **Level of Analysis:** The definition applies to the system policy as deployed. Training process audits are out of scope for this grant, though the spec will note where training data might influence sensitivity.

  **Operationalizing the Counterfactual**
  The practical worry is that we cannot rerun the world to test counterfactuals. If we cannot separate world-sensitivity from evidence-sensitivity in practice, this project must count as a failure. We cannot paper over this.
  To test this, we will use **synthetic worlds in unit tests**. We will construct sandboxed environments where ground truth is controlled and decoupled from retrieval evidence. We will intervene on the retrieval step (forcing specific tool returns) and intervene on the world state (changing the database record while keeping the tool return constant). If we can construct a test harness where these interventions yield divergent outputs, we have evidence of the distinction. If the system behaves identically regardless of whether we change the world or the evidence, the distinction is operationally useless for our stack, and we will report that negative result.

  **Deliverables**
  1.  **Taxonomy Document:** A working definition of honest, deceptive, and indifferent behavior based on the sensitivity framework, validated against historical incidents.
  2.  **Eval Spec:** A short, implementable specification for turning definitions into checks. This includes code snippets for the synthetic test harness and criteria for passing/failing based on sensitivity profiles.

  **Failure Conditions**
  The project fails if:
  1.  We cannot construct a synthetic environment where world-state and evidence-state are decoupled.
  2.  The counterfactual tests prove too computationally expensive to run in CI/CD.
  3.  The philosopher advisor determines that the counterfactual definition collapses into one of the rejected accounts (intent or effect) under scrutiny.
  In any of these cases, the deliverable will be a report explaining why the distinction cannot be operationalized, preventing the team from wasting cycles on impossible evals.

  **Feasibility Assessment**
  Three months at half-time is tight but sufficient for a spec, not a full solution. The scope is limited to defining the property and proving testability in a sandbox, not fixing the model itself. The risk is that the synthetic environment requires significant infrastructure work. To mitigate this, we will scope the sandbox to the payments tool only, rather than the entire retrieval pipeline. This project is not too big if we strictly adhere to the deliverable of a *specification* rather than a *remediation*. The value lies in stopping the argument about labels and providing a concrete test that settles the classification automatically.
