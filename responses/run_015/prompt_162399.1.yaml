answer: |-
  You have correctly identified a distinct and unsettling configuration. To answer your primary question directly: **There is no single, canonical noun phrase in the epidemiologic or statistical literature that specifically demarcates *recursive* sign reversal across nested adjustment sets.**

  Most textbooks treat Simpson's Paradox as a binary event (Aggregate vs. Stratified). What you are observing is best described as **Iterated Simpson's Paradox** (or **Sequential Reversal**). However, your intuition that you are conflating two phenomena is correct. The arithmetic possibility is distinct from the causal identification problem.

  Below is the carving you requested, separating the algebraic properties from the epistemic predicament, and answering your specific boundary questions.

  ### 1. The Label and Demarcation

  **The Arithmetic Phenomenon: Iterated Simpson's Paradox**
  While standard definitions of Simpson's Paradox (e.g., Blyth, 1972) focus on a single reversal between a marginal and a conditional association, the mathematics of weighted averages allows for indefinite oscillation. If you view the estimate at Level $k$ as the "marginal" for the partition at Level $k+1$, there is no arithmetic constraint preventing the sign from flipping at every step, provided the correlation between the new covariate, treatment, and outcome within the *previous* strata is strong enough and the stratum sizes (weights) shift appropriately.

  *   **Demarcation from Standard Simpson's:** Standard Simpson's is $Sign(\hat{\beta}_{marginal}) \neq Sign(\hat{\beta}_{conditional})$. Your phenomenon is $Sign(\hat{\beta}_{adjusted\_set\_1}) \neq Sign(\hat{\beta}_{adjusted\_set\_2}) \neq Sign(\hat{\beta}_{adjusted\_set\_3})$.
  *   **Demarcation from Non-collapsibility:** You are correct to rule this out as the primary driver if you are using collapsible measures (Risk Differences). If you are using Odds Ratios or Hazard Ratios, note that non-collapsibility *facilitates* these flips (as the conditional OR is always further from the null than the marginal OR in the absence of confounding), but it does not *cause* recursive sign flipping on its own. The recursion requires structural confounding.
  *   **Demarcation from Qualitative Interaction:** Qualitative interaction implies $Sign(\hat{\beta}_{cell\_A}) \neq Sign(\hat{\beta}_{cell\_B})$ *within* the same model. You are observing $Sign(\hat{\beta}_{model\_1}) \neq Sign(\hat{\beta}_{model\_2})$ where Model 2 is a refinement of Model 1.

  **The Epistemic Phenomenon: Causal Model Dependence (or Identification Failure)**
  This is the distinct second phenomenon. It is the realization that the sign of the association is not a property of the data alone, but of the *adjustment set*. In causal inference terms, your data are **under-identified**. The oscillation indicates that you have not yet conditioned on a **Sufficient Adjustment Set**, or that you are conditioning on variables that induce bias (colliders).

  ### 2. Carving the Phenomenon (Your Specific Questions)

  Here is how the phenomenon is bounded technically:

  **Q1: Does the reversal require strict sign consistency in every cell at the deeper level?**
  **No.** The paradox operates on the **weighted average**. For the aggregate estimate to flip sign at Level 2, the weighted average of the Level 2 stratum-specific estimates must flip relative to the Level 1 estimates. It does not matter if 15/16 cells flip or 16/16 cells flip, provided the weights (stratum sizes) are distributed such that the aggregate moves across the null. However, if 15/16 flip in the same direction, it strongly suggests the 16th cell is an outlier or noise, making the aggregate flip robust.

  **Q2: Does it require the deeper estimates to be individually significant?**
  **No.** The paradox is a property of **point estimates** (estimands), not inference. In fact, the "thinning cells" problem you noted is a feature, not a bug, of this configuration. As you stratify further, variance increases. You can have a highly significant reversal at Level 1, and a non-significant (but directionally opposite) reversal at Level 2 due to sample size, and the epistemic problem remains identical: *Which point estimate represents the causal effect?* The lack of significance at deeper levels simply highlights the impossibility of resolving the paradox via stratification alone in finite samples.

  **Q3: Can the alternation continue indefinitely?**
  **Mathematically, Yes. Causally, No.**
  *   **Mathematically:** One can construct continuous covariates and functional forms where adding the $n$-th polynomial term or interaction flips the sign indefinitely.
  *   **Causally:** No. Under the assumption that a true causal effect exists (Stable Unit Treatment Value Assumption, Consistency, etc.), there is a **Minimal Sufficient Adjustment Set**. Once you condition on all confounders and *no* colliders or mediators, further adjustment should not systematically reverse the sign (though random noise or non-collapsibility might shift it slightly). If the sign keeps flipping, it implies you are either:
      1.  Missing a strong confounder at every step (Residual Confounding).
      2.  Introducing bias at every step (e.g., adjusting for colliders or instruments, leading to **Bias Amplification**).

  **Q4: Does the alternation constrain the sign of the "fully adjusted" estimate?**
  **No.** The oscillation imposes **no bounds** on the true causal effect. The true effect could be positive, negative, or null. The oscillation merely proves that the data, absent strong causal assumptions (a DAG), cannot identify the sign. It is a demonstration of **Sensitivity to Model Specification**.

  ### 3. The Epistemic Predicament: One Thing or Two?

  You are describing **two separable things**, and distinguishing them is the only way to resolve the anxiety the pattern produces.

  **Thing 1: The Algebraic Fact (Amalgamation)**
  This is the property that $E[Y|T] \neq E[E[Y|T, C]]$. It is a fact about how weighted averages behave. It warns you that "crude" numbers are often meaningless in the presence of imbalance.

  **Thing 2: The Causal Predicament (The "Table 2 Fallacy" on Steroids)**
  This is the core of your problem. You noted: *"the standard causal advice is to adjust for all of them, and yet the sign I would report then depends on how many confounders happen to have been measured."*

  This is the critical error in standard observational advice. **You should not adjust for "all" pre-treatment covariates.**
  *   Adjusting for a **Confounder** reduces bias.
  *   Adjusting for a **Collider** (a variable caused by both T and U, or T and Y) *induces* bias (M-Bias).
  *   Adjusting for an **Instrument** (affects T, not Y) can amplify bias from unmeasured confounding (Myers et al., 2011).

  The oscillation you see is likely because your hierarchy of variables includes a mix of confounders, colliders, and instruments.
  *   Level 1 adjustment might have blocked a backdoor path (Sign Flip 1).
  *   Level 2 adjustment might have opened a collider path or conditioned on an instrument (Sign Flip 2).

  **Resolution:**
  The phenomenon does not have a name because it is not a "paradox" in the causal framework; it is the expected behavior of **unidentified causal effects**. The sign depends on the **DAG**, not the data.

  ### 4. Proposed Terminology

  Since no standard term exists, I propose you use **Iterated Simpson's Paradox** to describe the arithmetic pattern, but explicitly link it to **Causal Model Dependence**.

  If you need a tight definition for your boundary cases:

  > **Iterated Sign Reversal:** A configuration in observational data where the point estimate of a treatment effect reverses sign sequentially across nested levels of covariate adjustment.
  > *   **Boundary Condition 1 (Strictness):** Reversal is defined by the sign of the marginal estimate within the strata of the current level, not necessarily every individual cell, though consistency across cells strengthens the claim of structural confounding.
  > *   **Boundary Condition 2 (Significance):** Statistical significance is not required; the phenomenon pertains to the estimand, not the estimator's variance.
  > *   **Boundary Condition 3 (Termination):** The sequence terminates theoretically upon conditioning on the Minimal Sufficient Adjustment Set; continued reversal implies model misspecification (e.g., collider bias) or unmeasured confounding.
  > *   **Boundary Condition 4 (Identification):** The sequence implies the causal effect is not identified by the data alone; the sign of the "fully adjusted" model is unconstrained by the sequence of flips.

  ### 5. Practical Advice for Your Context

  In pharmacoepidemiology with claims data, this pattern is often a signal of **Confounding by Indication** interacting with **Channeling Bias**.
  1.  **Crude:** Sicker patients get drug (Treated worse).
  2.  **Adjust for Severity (A):** Within severity, drug works (Treated better).
  3.  **Adjust for Severity + Comorbidity (B):** Within Severity+Comorbidity, clinicians avoid the drug for the *very* sickest (Treated worse again).

  **Recommendation:**
  Do not search for the "final" adjustment set by adding variables until the sign stabilizes. That is data-driven model selection and invalidates inference.
  1.  **Draw a DAG.** Determine the *Minimal Sufficient Adjustment Set* based on subject-matter knowledge, not statistical significance or stability.
  2.  **Report the range.** If the sign is this sensitive, the causal effect is not robustly identified by this data. Report the estimates across the plausible adjustment sets as a **sensitivity analysis** (e.g., E-values or bias functions).
  3.  **Check for Colliders.** Ensure your second and third-level covariates are not descendants of treatment or common effects of treatment and unmeasured causes of outcome.

  **References for your bibliography:**
  *   **Greenland, S., Pearl, J., & Robins, J. M. (1999).** Causal diagrams for epidemiologic research. *Epidemiology*, 37-48. (Explains why adjusting for "all" is wrong).
  *   **Myers, J. A., et al. (2011).** Effects of adjusting for instrumental variables on bias and precision of effect estimates. *American Journal of Epidemiology*. (Explains bias amplification).
  *   **Hernán, M. A., & Robins, J. M. (2020).** *Causal Inference: What If*. (Specifically Chapter 7 on Confounding and Chapter 12 on Selection Bias).
  *   **Westreich, D., & Greenland, S. (2013).** The table 2 fallacy: Presenting and interpreting confounder and modifier coefficients. *American Journal of Epidemiology*. (On interpreting coefficients in multivariable models).

  **Summary:** You are seeing **Iterated Simpson's Paradox** driven by **Causal Model Dependence**. It is two phenomena: one arithmetic (weights), one epistemic (identification). The sign of the "true" effect is not constrained by the flips; the flips simply tell you that you cannot find the truth via adjustment alone without a causal model.
