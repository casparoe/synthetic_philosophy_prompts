      *   *Jian Bai (Hard and White):* Deals with sensory modalities (touch vs. sight) and whether properties exist independently or together.
      *   *Accuracy Check:* The *Bai Ma Lun* argues based on *ming* (names) and *shi* (actualities). The core argument is often: "Horse" names the shape/form, "White" names the color. "White Horse" names both. Therefore, the extension of "White Horse" is narrower than "Horse."

  3.  **Drafting the Response - Section by Section:**

