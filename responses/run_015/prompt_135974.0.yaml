          *   *Pros:* It captures the intuition that "White Horse" is more specific than "Horse." It explains why you can't substitute them in certain contexts (seeking a horse vs. seeking a white horse).
          *   *Cons/Risks:* The ancient Chinese context doesn't neatly map onto Western property metaphysics. Gongsun Long talks about *ming* (names) and *zhi* (intentions/references). The distinction is often more about *extension* (scope of the name) than *intension* (ontological fusion).
          *   *Verdict:* It illuminates *if* framed as a logical/semantic distinction regarding *ming* rather than deep ontology. "Sticky" is a good metaphor for how *ming* compounds.
