answer: |-
  This is a sophisticated and promising angle. You are effectively attempting to rehabilitate Gongsun Long from the traditional "sophist/trickster" caricature (which dominated Confucian and Daoist critiques) and move beyond the standard "Platonic Realist" reading (Fung Yu-lan, A.C. Graham) toward something more linguistic-metaphysical.

  Your intuition that Long is interested in **identity conditions** rather than just wordplay is supported by contemporary scholarship (e.g., Chris Fraser, Chad Hansen), though your specific metaphysical vocabulary ("determinables," "ontological fusion") requires careful handling to avoid anachronism.

  Here is specific feedback on your three points, followed by an accuracy check on the dialogue structure.

  ### 1. Does the determinable/determinate framing illuminate or distort?

  **Verdict:** It illuminates the *logic*, but risks distorting the *metaphysics* if you aren't careful about the role of *Ming* (Names).

  *   **The Strength:** The determinable/determinate distinction helps explain the "seeking" argument in the dialogue. Long argues: "If you seek a *horse*, a yellow or black one suffices. If you seek a *white horse*, they do not." This is effectively an argument about extension. Framing "Horse" as a broader determinable and "White Horse" as a narrower, compound determinate captures why substitution fails in specific contexts.
  *   **The Risk:** In modern metaphysics, determinables and determinates are usually about properties (e.g., Color vs. Red). Long is talking about **Kinds** (*lei*). "Horse" is a kind-term, not just a property.
  *   **The "Fusion" Problem:** You mention properties "fusing ontologically." This is the danger zone. In the *White Horse Dialogue*, Long argues that "White Horse" is a compound name (*ming*). He does not necessarily claim the *animal* changes its ontology, but that the **referent of the name** changes.
      *   *Correction:* Instead of "ontological fusion," consider framing it as **"Nominal Compounding with Extensional Consequences."** The *Name* fuses, which dictates how we carve out reality (*shi*). If you claim the properties fuse *in the object*, you might contradict Long's view in *Jian Bai* (see below).
  *   **Recommendation:** Use the determinable framing to explain the **logic of exclusion**, but ground it in Long's theory of *Zhi* (reference/intention). The "stickiness" isn't in the horse's DNA; it's in the *Ming*. When you invoke the name "White Horse," you activate a specific *Zhi* that excludes non-white horses.

  ### 2. Framing the *Jian Bai* (Hard and White) connection

  **Verdict:** This is the hardest part of your essay. There is a tension between *Bai Ma* and *Jian Bai* that you must address, or your argument will look inconsistent.

  *   **The Tension:** In *White Horse*, Long seems to allow compounding (White + Horse = White Horse). But in *Hard and White*, he famously argues that "Hard" and "White" **do not** fuse in the stone. He argues they are perceived by different senses (touch vs. sight) and therefore remain separate (*li*). He claims they "hide" from each other.
  *   **The Risk:** If you argue Long believes properties "fuse ontologically" in *Bai Ma*, *Jian Bai* seems to contradict you by arguing properties remain distinct even when co-present.
  *   **The Solution:** Frame the connection not as "fusion" but as **"Mereological Sensitivity."**
      *   In *Bai Ma*, the compound name restricts the extension of the kind.
      *   In *Jian Bai*, the analysis reveals that attributes remain distinct universals even when instantiated together.
      *   *Your Thesis Adjustment:* Long isn't arguing for fusion; he is arguing for **precision in counting.** In *Bai Ma*, counting "White Horses" is a different operation than counting "Horses." In *Jian Bai*, perceiving "Hard" is a different operation than perceiving "White."
      *   *Better Frame:* Instead of "proto-sortal essentialism" (which implies the object has an essence), try **"Sortal-Relativism."** Identity conditions are relative to the *Ming* employed. A stone is one object, but under the *Ming* "Hard" it is one thing, and under "White" it is another. This aligns better with the School of Names' focus on the rectification of names (*Zheng Ming*).

  ### 3. Is this interesting or a forced comparison?

  **Verdict:** It is interesting and philosophically viable, provided you acknowledge the anachronism.

  *   **Why it works:** It treats Long as a serious philosopher of language and ontology, which is the current trend in sinology (moving away from the "mystical/sophist" reading). It explains *why* the distinction matters practically (governance, counting, seeking).
  *   **How to avoid "Forced":** Explicitly state that you are using "determinable" and "sortal" as **heuristic tools**, not claiming Long read Locke or Kripke.
      *   *Phrase to use:* "While Long lacks the technical vocabulary of modern property metaphysics, his operational logic anticipates..."
      *   *Focus on Function:* Emphasize that for the School of Names, getting the names right was a political/ethical act. If the King asks for "Horses" and you send "White Horses," you have failed the *Ming-Shi* (Name-Actuality) correspondence. This makes your "breeding/counting" angle politically relevant, not just abstract metaphysics.

  ### Accuracy Check: Dialogue Structure & Key Arguments

  To ensure you don't misrepresent the text, keep these structural points in mind:

  1.  **The Core Distinction is *Ming* (Name), not just *Wu* (Thing):**
      Long's primary claim is "White Horse is not Horse" (*Bai ma fei ma*). He is comparing **terms**, not just animals.
      *   *Argument:* "Horse" names the shape/form (*xing*). "White" names the color (*se*). "White Horse" names both. Therefore, the name "White Horse" is not identical to the name "Horse."
      *   *Caution:* Do not argue Long thinks a white horse is a different *species* than a horse. He argues the **concept** is different.

  2.  **The "Seeking" Argument (Extension):**
      Long argues: If you want a horse (*qiu ma*), a yellow or black horse works. If you want a white horse (*qiu bai ma*), a yellow or black one does not.
      *   *Your Angle:* This supports your "counting/context" idea perfectly. The identity conditions for satisfying the request change based on the compound name.

  3.  **The "Existence" Argument:**
      Long admits: "There are no white horses without horses." (If there were no horses, how could there be white horses?)
      *   *Nuance:* He concedes the ontological dependency but maintains the logical distinction. This is where your "fusion" idea needs care. The white horse depends on the horse, but the *concept* "White Horse" is not reducible to "Horse."

  4.  **Avoid "Universals" if possible:**
      The "Platonic" reading (that "Whiteness" exists in a realm of forms) is controversial. Many scholars (like Chad Hansen) argue Long is a **Nominalist** or a **Mereologist**. He is talking about how we divide the world with language, not about abstract entities floating in the sky.
      *   *Suggestion:* Frame your "determinables" as **linguistic categories** that carve reality, rather than metaphysical entities. This aligns better with the "School of Names" focus on *Ming*.

  ### Summary Recommendation for Your Essay

  1.  **Refine the Thesis:** Shift from "ontological fusion of properties" to **"compound sortals that alter identity conditions for reference."** This keeps the metaphysics grounded in the act of naming (*Ming*), which is Long's primary concern.
  2.  **Handle *Jian Bai* Carefully:** Use it to show Long's consistency on **separability**. In *Bai Ma*, names combine to restrict reference. In *Jian Bai*, attributes remain distinct in perception. Both show that **composition matters.**
  3.  **Own the Anachronism:** Acknowledge that "determinable" is a modern term, but argue it maps onto Long's distinction between *Xing* (Form/Kind) and *Se* (Color/Attribute).
  4.  **Political/Pragmatic Hook:** Remind the reader that for the School of Names, this isn't just logic puzzles. If the bureaucracy counts "Horses" for tax but includes "White Horses" in a different category, the distinction has material consequences. This validates your "breeding/counting" intuition.

  This is a strong draft direction. It moves the conversation from "Is Long crazy?" to "What theory of reference is Long proposing?" which is exactly where contemporary scholarship wants to be.
