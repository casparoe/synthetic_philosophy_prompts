answer: |-
  Verdict: This is not a counterexample to Good's Theorem but a category error: the theorem assumes fixed action-sets and utilities, whereas your cases involve knowledge constitutively altering normative status.

  **Phenomenon: Normative Status Preservation**
  The agent treats ignorance as a resource that maintains specific deontic permissions or speech-act capacities that knowledge would extinguish. Information is not instrumentally disvalued; it is constitutively transformative.

  **The Carving (What it is not)**
  *   **Vs. Information Avoidance (Psychology):** Standard avoidance targets affective states (fear, regret, anxiety). Your agents concede emotional competence; they resist the *normative consequences* of knowing.
  *   **Vs. Self-Binding (Precommitment):** Ulysses cases assume the future self is irrational or weak-willed. Your agents trust future rationality but reject the *obligations* that rationality would impose upon knowing.
  *   **Vs. Strategic Ignorance (Economics):** Economic ignorance usually signals trustworthiness to *others* (e.g., credible commitment). Your cases involve internal moral ontology or semantic truth conditions, not external signaling games.
  *   **Vs. Heuristics:** This is not about computational cost or error reduction. The agent acknowledges the information is accurate and costless.

  **Violation of Good's Theorem**
  Good's Theorem proves information has non-negative expected utility *ceteris paribus*. It relies on three background assumptions:
  1.  Fixed set of available actions.
  2.  Fixed utility function over outcomes.
  3.  Information only updates probability distributions over states.
  Your cases violate (1) and (2). In the audit case, knowledge literally removes an action (truthfully claiming ignorance). In the pregnancy case, knowledge changes the deontic weight of outcomes (continuing becomes impermissible). Because the input conditions of the theorem are not met, the theorem does not apply. This is not a paradox; it is a boundary condition.

  **Coherence and Edges**
  The reasoning is coherent if one accepts that epistemic states can be constitutive of normative status (e.g., you cannot truthfully assert $P$ if you know $\neg P$). It collapses into incoherence only if one insists rationality requires maximizing outcome-value irrespective of agential status. The critical edge case is distinguishing genuine normative loss from bad faith: if the "normative status" is invented solely to evade duty (e.g., "I don't know so I don't have to help"), it is rationalization. If the status is real (e.g., truth conditions of assertion, or specific moral obligations triggered by knowledge), the reasoning holds. The phenomenon names a legitimate constraint on the *value of information* when information changes *who the agent is* normatively, not just what she believes.
