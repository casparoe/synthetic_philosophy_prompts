answer: |-
  ### 1. Exam Question

  **Module:** Advanced Research Methods in Science  
  **Section:** Philosophy of Scientific Inference  
  **Time Allowed:** 90 Minutes  
  **Word Limit:** 1000 words maximum  

  **Question 1: The Island of Ravens**

  Consider a closed ecosystem (an island) containing a known, fixed population of exactly 200 ravens. No ravens enter or leave. You are testing the hypothesis **H**: *All ravens on this island are black.*

  Two field protocols are proposed:
  *   **Protocol A (Raven-First):** Locate every raven on the island and record its colour.
  *   **Protocol B (Object-First):** Select random coordinates, walk a 1km transect, and record every *non-black* object encountered, noting whether it is a raven.

  Under **Protocol B**, a researcher records a white plastic bottle on the beach. Let us define an observation's **_counterfactual yield_** as the set of alternative observations the protocol could have produced in that specific instance had the world been different. Under Protocol B, the bottle's yield includes the possibility of having found a non-black raven (which would refute **H**). Under Protocol A, the yield of observing a black raven does not include finding a non-black object, as the search is restricted to ravens.

  **Answer the following:**

  1.  **Does the white bottle confirm H?** Explain whether your answer changes depending on whether the observation arose from Protocol A or Protocol B. (5 marks)
  2.  **Evaluate the concept of *counterfactual yield*.** Does successfully defining a yield that includes a potential falsifier suffice to make an observation confirmatory? Where does this heuristic break down? (5 marks)
  3.  **Finite vs. Infinite Populations.** How does the confirmation logic change if **H** refers to the 200 island ravens versus *all ravens everywhere*? Why does the closed population matter for the evidential weight of the bottle? (5 marks)
  4.  **The Purpose of Confirmation.** Move beyond the Nicod-Hempel equivalence condition. What is confirmation *for* in this context? Should we view it as shifting subjective probabilities, reducing error possibilities, or establishing predictive capacity? Justify your stance. (5 marks)

  *Note: Do not simply recite the standard solution to the Raven Paradox (i.e., logical equivalence of contrapositives). You are expected to critique the role of sampling protocols and the teleology of inference.*

  ***

  ### 2. Model Answer

  **Candidate Response**

  The white bottle confirms **H** only relative to **Protocol B**, not Protocol A. While logical equivalence dictates that a non-black non-raven is consistent with "All ravens are black," evidential support requires a testing context where the observation was *contingent*. Under Protocol A, the search space is restricted to ravens; finding a non-raven is impossible by design, so finding a non-black non-raven (the bottle) cannot occur. If Protocol A somehow yielded a bottle, it represents a protocol violation. Under Protocol B, the search space includes all objects. The bottle confirms **H** because the protocol allowed for the discovery of a non-black raven. The observation is confirmatory because it survived a test that could have failed.

  However, **counterfactual yield** is necessary but not sufficient. Merely defining a yield that includes a falsifier does not guarantee confirmation if the probability of encountering that falsifier under the protocol is negligible. If the island is 99% ocean and 1% land, and ravens only nest inland, a beach transect (Protocol B) has a near-zero yield for ravens. Finding a bottle on the beach confirms **H** only trivially, because the risk of refutation was vanishingly small. The yield must be *probabilistically significant*. The heuristic breaks down when it ignores base rates; a test that *could* falsify **H** but almost certainly *won't* provides negligible confirmation, even if the logical yield is present.

  The **closed population** is critical. If **H** applies to the 200 island ravens, the class of "non-black objects" is finite. Every non-black non-raven observed reduces the pool of unexamined objects where a counterexample could hide. As we exhaust the set of non-black things without finding a raven, the probability that a raven lurks among them rises toward zero. In an unrestricted universe, the class of non-black objects is effectively infinite. Observing one white bottle reduces the infinite set by a negligible amount. Thus, in the closed system, the bottle has tangible eliminative value; in the open system, it is logically consistent but evidentially inert.

  Finally, we must ask what confirmation is **for**. If confirmation is merely Bayesian probability shifting, the bottle shifts the probability of **H** by a microscopic amount (in the open case) or a measurable amount (in the closed case). But this is passive. A better view is that confirmation is about **predictive capacity and intervention**. We accept **H** not just to update a credence, but to license predictions (e.g., "The next raven I catch will be black") and interventions (e.g., "I can use raven colour as a marker for species ID"). Protocol B confirms **H** better than Protocol A not because of logic, but because it mimics the conditions under which we will use **H**. We usually encounter objects first and identify them second. Protocol B tests **H** under the conditions of its application. Therefore, confirmation should track the robustness of a hypothesis against falsification in relevant contexts, not just logical consistency. The bottle confirms **H** under Protocol B because it demonstrates that the "non-black" niche is occupied by debris, not ravens, securing the prediction for future encounters.

  ***

  ### 3. Marking Scheme (Total: 20 Marks)

  **1. Protocol Dependence (5 Marks)**
  *   **Must Hit:** Candidate must argue that the bottle confirms **H** under Protocol B but not A (or explains why A makes the observation impossible/irrelevant). Confirmation is relative to the sampling method, not just the proposition.
  *   **Common Fumble:** Students claim the bottle confirms **H** regardless of protocol because "logic is logic." This ignores the sampling bias inherent in Protocol A. (Deduct 3 marks).
  *   **Partial Credit:** Acknowledges protocol matters but fails to explain *why* (e.g., search space restriction). (2-3 marks).

  **2. Counterfactual Yield Analysis (5 Marks)**
  *   **Must Hit:** Candidate must identify that yield captures *testing potential* but critique it using base rates/probability. A test must be *likely* to find a falsifier if one exists, not just *logically capable* of it.
  *   **Common Fumble:** Treating "counterfactual yield" as a magic bullet. "Since the protocol could have found a raven, it counts." This ignores Good's objection (trivial confirmation). (Deduct 3 marks).
  *   **Partial Credit:** Defines yield correctly but fails to identify where it breaks down (e.g., low probability of encounter). (2-3 marks).

  **3. Finite vs. Infinite Population (5 Marks)**
  *   **Must Hit:** Candidate must distinguish the closed island (finite non-black objects) from the universe (infinite). In the closed system, enumerating non-black non-ravens has eliminative power; in the open system, it does not.
  *   **Common Fumble:** Treating the 200-raven scenario as identical to the universal paradox. Failing to see that finite sets allow for enumeration strategies. (Deduct 3 marks).
  *   **Partial Credit:** Notes the difference but doesn't explain the mathematical/eliminative implication. (2-3 marks).

  **4. Teleology of Confirmation (5 Marks)**
  *   **Must Hit:** Candidate must move beyond "shifting probabilities." Must argue for confirmation as licensing prediction, intervention, or risk-reduction. The "purpose" determines the value of the evidence.
  *   **Common Fumble:** Stopping at Bayesian updating without questioning *why* we update. Reciting Hempel/Nicod without critiquing the goal of inference. (Deduct 3 marks).
  *   **Partial Credit:** Mentions prediction but doesn't link it back to the protocol choice. (2-3 marks).

  **General Grading Notes:**
  *   **A Grade (16-20):** Hits all four must-hits with nuance. Connects the protocol to the purpose of confirmation (e.g., Protocol B matches real-world usage).
  *   **B Grade (12-15):** Hits all four points but lacks depth on one (usually the teleology or the yield breakdown).
  *   **C Grade (8-11):** Hits protocol and population points but reverts to standard "contrapositive" logic for the rest.
  *   **Fail (<8):** Fails to distinguish protocols or claims the bottle confirms **H** unconditionally based on logical equivalence alone.
