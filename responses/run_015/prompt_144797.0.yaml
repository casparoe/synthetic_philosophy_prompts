answer: |-
  # Workshop Demo: The Core & The Clay
  **Time:** 60 Minutes  
  **Participants:** 10 Philosophy Undergrads (2 Teams of 5)  
  **Goal:** Physically simulate the Material Constitution problem without naming it until the end.

  ## 1. Materials Kit
  *   **Building Blocks:** 20–25 interlocking bricks (Lego/Duplo style).
      *   **3 Red Bricks:** These are the "Core."
      *   **15–20 Blue/Green Bricks:** These are the "Clay."
  *   **The Screen:** A folder or laptop screen to hide the table during swaps.
  *   **Scoreboard:** Whiteboard or sheet of paper.
  *   **Verdict Cards:** Two sets of cards labeled "SAME" and "GONE" for each team.

  ## 2. Setup & Build (0:00–0:10)
  **No lecture.** Walk in, dump the blocks on the table.

  1.  **Divide:** Split the room into **Team Clay** (left) and **Team Statue** (right).
  2.  **Build:** Ask them to build one object together.
      *   *Constraint:* The 3 Red blocks must be buried in the center (the Core). The Blue blocks form the outer shape (the Clay).
      *   *Result:* A single physical tower.
  3.  **Hand out Rules:** Give each team a sealed envelope with their "Tracking Mandate." Do not let them share yet.

      *   **Team Clay Mandate:** "You track the **Material**. Your object persists as long as there is physical continuity. Blocks may be replaced one by one, but the *Clay* survives. You lose points if you claim the object is 'GONE' when blocks are merely swapped."
      *   **Team Statue Mandate:** "You track the **Form & Core**. Your object persists only if the 3 Red Core blocks remain intact AND 60% of the outer shape is preserved. You lose points if you claim the object is 'SAME' after a Core block is lost."

  4.  **Calibration Round:** Swap one outer Blue block.
      *   Ask both teams to hold up "SAME" or "GONE."
      *   Team Clay should say SAME. Team Statue should say SAME.
      *   Confirm everyone understands their own rule. Do not discuss *why* yet.

  ## 3. The Game: Rounds of Change (0:10–0:35)
  You (the Facilitator) are "The World." You stand behind the Screen. You modify the object. After each modification, teams confer for 30 seconds and play a verdict card.

  *   **Round 1:** Swap 1 outer Blue block. (Both should say SAME).
  *   **Round 2:** Swap 3 outer Blue blocks. (Both should say SAME).
  *   **Round 3:** Swap 5 outer Blue blocks (crossing the 60% threshold? Keep it just under). (Both should say SAME).
  *   **Round 4 (The Trap):** While distracting them with a question ("Hey, does the color matter?"), **secretly swap 1 Red Core block** for a Blue one. Hide the Red block in your palm.
      *   *Team Clay:* Should say SAME (Material continuity holds).
      *   *Team Statue:* Should say GONE (Core compromised).
      *   *Scoring:* If Team Statue says SAME, deduct points. If Team Clay says GONE, deduct points.
  *   **Round 5:** Swap another outer block.
      *   *Team Clay:* Says SAME.
      *   *Team Statue:* Should still say GONE (Core is still broken).

  **Scoring Logic:**
  *   **Team Clay:** +1 point for saying "SAME" on any block swap. -2 points for saying "GONE" on a block swap.
  *   **Team Statue:** +1 point for saying "SAME" when Core is intact. -2 points for saying "SAME" when Core is broken.
  *   **Note:** Do not reveal *why* points were lost during the game. Just mark the board. "Team Statue, minus two." Let them sweat.

  ## 4. The Reveal & Score (0:35–0:40)
  1.  Ask Team Statue: "Why did you lose points in Round 4?"
  2.  They will suspect the Core.
  3.  Reveal the hidden Red block. Show them the object currently has only 2 Red blocks.
  4.  Ask Team Clay: "Why did you keep saying SAME?"
  5.  They will point out the physical mass is still there.
  6.  Tally scores. Usually, there will be tension because both teams followed the rules, but their verdicts on the *same object* diverged.

  ## 5. Debrief: Mapping the Clash (0:40–0:55)
  Now you name the problem. Gather them in a circle.

  **The Hook:**
  "You just fought over the same pile of plastic. Team Clay, you saw one continuous object. Team Statue, you saw an object that died in Round 4. How is that possible?"

  **Map the Concepts:**
  1.  **Sortals:** Explain that "Clay" and "Statue" are different *sortals* (categories). They come with different rules for persistence. A "statue" has essential properties (the core/shape); a "lump of clay" does not.
  2.  **Co-location:** This is the big one. "At Round 5, was there one object or two?"
      *   If one: How can it be both the same (Clay) and different (Statue)?
      *   If two: Can two things occupy the same space at the same time?
  3.  **Constitution vs. Identity:** The Clay *constitutes* the Statue, but isn't *identical* to it. They share parts but have different life stories.

  **The Limitation (The Honest Note):**
  "Here's what this game couldn't do. We only played out one timeline. In philosophy, we care about **modal properties**—what *could* have happened.
  *   Could the Statue have been made of ice? Yes.
  *   Could the Clay have been made of ice? No, it's this specific matter.
  *   The game forces you to track what *did* happen. It can't simulate the counterfactuals that really drive the debate about whether they are distinct objects."

  ## 6. What Will Go Wrong (Facilitator Notes)
  Be ready for these failure modes. They're actually useful teaching moments.

  1.  **The "Gotcha" Frustration:** Team Statue will feel cheated by the secret swap.
      *   *Fix:* Frame it as "Undetected Change." In the real world, we don't always know when essence is lost. The frustration *is* the epistemic problem.
  2.  **Team Clay Dominance:** Team Clay might argue their rule is "obviously true" because the blocks are right there.
      *   *Fix:* Remind them their score penalized them for breaking *their* rule (claiming identity broke on simple swaps), not for being metaphysically right.
  3.  **Obsession with Blocks:** Students might start counting percentages obsessively ("It's 59% not 60%!").
      *   *Fix:* Shut down math. "You're arguing about measurements. Argue about existence. Did the thing die?"
  4.  **The Merger:** They might try to compromise ("It's kinda the same").
      *   *Fix:* Force binary choices. "SAME or GONE." Philosophy hurts when you can't hedge.

  ## 7. Wrap Up (0:55–1:00)
  Leave them with the lingering question.
  "Next time you see a statue, ask yourself: If I swept up the dust, would I have the statue? You just proved you might have the clay, but the statue is gone. Where did it go?"

  End session. No bibliography. Let them argue on the way out.
