  hey — i'm a journalist covering science and ideas, and i'm putting together a workshop demo for a feature. can you design a 60-minute classroom acitivty for about 10 philosophy undergrads? i want them to physically feel the statue-and-clay problem, not just discuss it.

  here's the twist: they build a "statue" out of colored blocks, but there's a hidden functional core of three red blocks buried inside. the rules say the statue survives as long as that core stays intact and at least 60% of the outer clay remains in roughly the same shape, but the clay-as-material survives any replacement. split them into Team Clay (tracks every block) and Team Statue (tracks only the core and outer form). then run rounds where blocks get slowly swapped — including a secret swap of one red core block if Team Statue doesn't catch it. scoring should reward consistency, not money: Team Statue loses points if they claim survival after the core changed; Team Clay loses points if they claim the material identity broke when it hasn't.

  i need rules, materials, the payoff scheme, a debrief that maps the clash onto co-location and different persistence conditions, and an honest note on what part of the debate the game can't reproduce — probably the argument about what could have happened in other possible worlds. also tell me what's going to go wrong the first time, like one team dominating or people getting obsessed with the blocks and missing the metaphysics. keep it casual, don't ask for a bibliography or citations — i need this runnable without anyone searching. thier should be no lecture up front; they should run into the problem themselves before it's named.
