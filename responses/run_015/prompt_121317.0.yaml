answer: |-
  Here is the specification for a theory of diachronic medical authority. It is divided into phenomenological constraints, conceptual guardrails, psychological plausibility, and the symmetry challenge.

  ### I. Phenomenological Constraints (The Casebook)
  A viable theory must deliver distinct verdicts for these scenarios without ad-hoc maneuvering.

  1.  **The Sudden Severance (Trauma/Coma):**
      *   *Requirement:* Must uphold the directive. The psychological continuity is broken physically, not normatively. The earlier self is the only agent capable of projecting a life narrative.
      *   *Status:* **[NON-NEGOTIABLE]** Any theory that voids directives here fails the basic function of an AD.
  2.  **The Happy Demented (Prior Refusal, Present Contentment):**
      *   *Requirement:* Must explain why a prior refusal of life-sustaining treatment binds a currently contented patient. It must weigh "critical interests" (narrative integrity) against "experiential interests" (current pleasure).
      *   *Status:* **[IDEOLOGICAL]** This is the battleground. Liberal intuitions favor the present self's happiness; conservative/narrative intuitions favor the past self's dignity. The theory must pick a side, not hedge.
  3.  **The Gradual Slide (Early-Stage Dementia):**
      *   *Requirement:* Must identify a threshold where authority transfers. It cannot be a binary switch (competent/incompetent) but must track the erosion of *value-retention* vs. *value-expression*.
      *   *Status:* **[NON-NEGOTIABLE]** A theory that treats mild cognitive impairment as total incapacity is empirically false.
  4.  **The Genuine Conversion (Pre-Incapacity Value Shift):**
      *   *Requirement:* Must distinguish between a patient who *forgot* their values (dementia) and one who *revised* them (religious conversion, philosophical shift) while still competent. If a competent patient revises the AD, the old AD must die.
      *   *Status:* **[NON-NEGOTIABLE]** Competent revision always trumps prior instruction.

  ### II. Conceptual Guardrails (Distinctions to Maintain)
  The theory must not collapse these categories. If it does, it is category-error masquerading as ethics.

  1.  **Normative Authority vs. Predictive Accuracy:**
      *   *Constraint:* The past self does not rule because they *predicted* the future best (they often get this wrong). They rule (if at all) because they hold *jurisdiction* over the life narrative.
      *   *Flag:* **[NON-NEGOTIABLE]** Conflating "knowing best" with "having the right to decide" invalidates the directive when the prediction fails (e.g., new treatments exist).
  2.  **Legal Bindingness vs. Moral Weight:**
      *   *Constraint:* A document can be legally enforceable but morally void (e.g., signed under subtle coercion or outdated info). The theory must allow for moral override even if legal statutes demand compliance.
      *   *Flag:* **[NON-NEGOTIABLE]** Law is procedural; ethics is substantive.
  3.  **Partial vs. Total Value Change:**
      *   *Constraint:* Must distinguish between losing specific preferences (liking jazz) and losing the capacity to value (liking anything). Authority persists through the former, dissolves in the latter.
      *   *Flag:* **[IDEOLOGICAL]** Defining "capacity to value" often hides a conservative bias about what counts as a "worthy" mental state.

  ### III. Psychological Plausibility (Preference Revision)
  The theory cannot contradict how human agency actually works.

  1.  **The Lock-In Problem:**
      *   *Constraint:* People revise preferences constantly. A theory cannot treat the moment of signing an AD as "freezing" the self unless there is a specific mechanism of *pre-commitment* justified by anticipated irrationality (Ulysses pact).
      *   *Flag:* **[NON-NEGOTIABLE]** If the theory assumes preferences are static, it is empirically false.
  2.  **Adaptive Preferences:**
      *   *Constraint:* Must account for the "happy slave" phenomenon. If the later self is happy only because their capacities were crushed to fit their circumstances, the earlier self's veto retains weight. If the later self is happy due to genuine adaptation, weight shifts.
      *   *Flag:* **[IDEOLOGICAL]** Deciding when adaptation is "deformed" vs. "resilient" is a value judgment, not a medical fact.

  ### IV. The Symmetry Challenge
  *The Argument:* If the Past Self has authority over the Medical Present because they possess epistemic priority about "what matters in a life," why don't they have authority over the Financial or Relational Present? Can a 40-year-old bind their 70-year-old self from selling the house or divorcing a spouse?

  *   **Verdict:** **Bullet to Bite.**
  *   **Reasoning:** This does not break the list, but it forces a specific justification for *medical exceptionalism*. You must argue that medical decisions implicate **bodily integrity** and **narrative closure** in a way that asset management does not.
  *   **The Cost:** If you cannot justify why the body is different from the bank account, the theory collapses into general paternalism or absurdity. You must bite the bullet that medical authority is a special category of diachronic control, justified by the irreversibility of death and the intimacy of bodily violation.
  *   **Flag:** **[NON-NEGOTIABLE]** If the theory claims universal diachronic authority, it is untenable. It must be scoped to medicine.

  ### V. Scorecard: Precedent Autonomy vs. Present Best Interest

  | Desideratum | Precedent Autonomy (PA) | Present Best Interest (PBI) |
  | :--- | :--- | :--- |
  | **Sudden Severance** | **PASS.** Respects the only competent will available. | **FAIL.** Treats the body as a ward of the state/doctor. |
  | **Happy Demented** | **FAIL (Intuitively).** Demands killing a happy being based on a past promise. | **PASS.** Protects the existing sentient experience. |
  | **Normative vs. Predictive** | **PASS.** Grounds authority in rights, not accuracy. | **PASS.** Grounds authority in welfare, not rights. |
  | **Psychological Revision** | **WEAK.** Struggles to explain why some revisions count and others don't without circularity. | **STRONG.** Adapts to current state easily. |
  | **Symmetry Challenge** | **FAIL.** Hard to explain why Past-Self rules the body but not the bank account. | **PASS.** Current best interest applies universally (finance, health, housing). |
  | **Non-Negotiable Logic** | **PASS.** Maintains agency continuity. | **FAIL.** Risks severing agency continuity entirely (you are never responsible for future you). |

  **Summary:**
  *   **Precedent Autonomy** meets the non-negotiable logical requirements of agency but struggles with the "Happy Demented" intuition and the Symmetry Challenge. It requires biting the bullet that a dead narrative trumps a living experience.
  *   **Present Best Interest** meets the phenomenological intuition of the "Happy Demented" and solves Symmetry, but fails the non-negotiable requirement of respecting competent prior agency in sudden injury cases. It effectively euthanizes the concept of a "life plan."

  **Final Spec Note:** A working theory must likely be a **hybrid**: Precedent Autonomy holds *unless* the current self demonstrates retained capacity for value-judgment (not just preference), at which point authority transfers. This avoids the "Happy Demented" bullet while preserving the "Sudden Severance" requirement.
