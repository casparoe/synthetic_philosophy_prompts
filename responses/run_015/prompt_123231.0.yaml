  **Preamble: Distinctions and Relativization**

  To make this procedure usable within twenty minutes, I am collapsing the ontological distinction between "true causation" and "pragmatic causal modeling." We do not need to know what *really* broke the universe; we need to know what fix suppresses the alarm. I am also collapsing the token/type distinction: we treat specific alarm instances as tokens of a repairable type. The load-bearing distinction is **Interventional Capacity**: two alarms are the same mechanism only if the same permitted intervention suppresses both. Regarding levels: yes, sameness must be relativized. A sensor fault and a model fault can produce identical signatures but require different repairs. The engineer must fix the **Scope of Repair** (Sensor, Pipeline, Model, or Environment) at **Step 0** of the procedure. If you do not agree on the level, you cannot agree on the mechanism.

  ***

  ### Procedure: Mechanism Triage for Vision Systems

  **Goal:** Assign one of four labels to a pair of alarm instances (A and B).
  **Constraints:** No line stops without sign-off; no model retraining/rollback without change ticket.
  **Time:** 20 minutes.

  **Step 0: Fix the Scope of Repair**
  Declare the level at which you are authorized to intervene.
  *   *Options:* Sensor (hardware/cleaning), Pipeline (config/lighting), Model (retrain/threshold), Environment (temp/vibration).
  *   *Rule:* If Alarm A requires a Sensor fix and Alarm B requires a Model fix, they are **different mechanisms** relative to this scope. Stop here.
  *   *If Scope is agreed:* Proceed to Step 1.

  **Step 1: The Counterfactual Fix Test**
  Ask: "If we applied the successful fix from Alarm A to Alarm B, would Alarm B stop firing?"
  *   *Evidence:* Use logs, config history, and physical inspection. Do not implement the fix yet.
  *   *Yes:* Proceed to Step 2.
  *   *No:* Label **different mechanisms**.
  *   *Unknown/Forbidden:* If the fix requires a line stop or change ticket you don't have, mark "Intervention Forbidden" and proceed to Step 2.

  **Step 2: The Independence Check (Natural Variation)**
  Look for instances where one alarm fires without the other, or where suspected triggers vary independently.
  *   *Case:* Alarm A fires when Trigger X is present. Does Alarm B fire when Trigger X is absent?
  *   *Case:* Alarm A and B co-occur. Is there a time when A fires without B?
  *   *If they vary independently:* Label **different mechanisms**.
  *   *If they are perfectly coupled:* Proceed to Step 3.
  *   *If data is missing:* Mark "Data Insufficient" and proceed to Step 3.

  **Step 3: The Conjunctive & Cascade Check**
  Check for hidden "AND" conditions or chains.
  *   *Conjunctive:* Does the alarm only fire when Trigger X *and* Trigger Y are present (where neither alone suffices)?
      *   If Yes, and comparing to a single-trigger alarm: Label **same mechanism, different trigger**.
  *   *Cascade:* Does Alarm A's output physically cause Alarm B's input (e.g., bad image causes bad confidence)?
      *   If Yes: Label **different mechanisms** (one is root, one is symptom).
  *   *If neither:* Proceed to Step 4.

  **Step 4: The Drift & Stability Check**
  Compare the current alarm to historical instances of the same signature.
  *   *Question:* Has the relationship between trigger and alarm drifted slowly over time?
  *   *If the fix from last quarter no longer works:* Label **different mechanisms** (the mechanism has evolved).
  *   *If the fix still works:* Label **same mechanism**.

  **Step 5: Judgement Call (Escalation)**
  If Steps 1–4 yield conflicting results (e.g., Fix Test says "Same", Independence Check says "Different") or if critical interventions are forbidden:
  *   **Who:** The Reliability Lead (you).
  *   **Action:** Review the "Intervention Forbidden" flags. If the forbidden intervention is the *only* way to distinguish, label **underdetermined**. If the evidence leans >70% one way based on operational risk, assign that label and document the assumption.

  ***

  ### Application to Cases

  **Case (1): Plants 4 and 11 (Firmware Update)**
  *   **Scope:** Sensor/Pipeline (Firmware is config).
  *   **Fix Test:** Rolling back firmware at Plant 4 stops the alarm. Would it stop Plant 11? Yes, same update, same pattern.
  *   **Independence:** Both correlate perfectly with the update event.
  *   **Drift:** Immediate onset after update.
  *   **Verdict:** The underlying breakage is the firmware-model incompatibility. The trigger (the update) is also the same type.
  *   **Label:** `same mechanism`

  **Case (2): Plant 7 vs. Plant 2 (Scratched Lens)**
  *   **Scope:** Sensor (Hardware).
  *   **Fix Test:** Replacing lens at Plant 2 stops the alarm. At Plant 7, lenses are clean; replacing them is unlikely to help (cause is not optical obstruction).
  *   **Independence:** Plant 2 fires due to obstruction. Plant 7 fires despite clean optics (likely lighting or model drift).
  *   **Verdict:** Identical signatures, but the physical cause (mechanism) differs. A fix for 2 will not generalize to 7.
  *   **Label:** `different mechanisms`

  **Case (3): Plant 9 (Conjunctive Trigger)**
  *   **Scope:** Environment/Model.
  *   **Fix Test:** Cooling the room (Temp fix) alone won't stop it (Shift needed). Stopping shifts (Shift fix) alone won't stop it (Temp needed). A Model Retrain (general fix) would likely stop both this and standard temp alarms.
  *   **Independence:** We have observational data (negative cases) confirming the conjunction. It is not a cascade.
  *   **Verdict:** Compared to a standard single-factor temperature alarm, the underlying vulnerability (model sensitivity to environment) is the same, but the trigger condition is complex (conjunctive). Since the generalizable fix (model hardening) is the same, but the immediate trigger profile is distinct:
  *   **Label:** `same mechanism, different trigger`

  \answer{(1) same mechanism; (2) different mechanisms; (3) same mechanism, different trigger}
