      *   In Round 3, the "Knowers" (who figured out the rule) shine because their "technology" (the rule sheet) works.

  4.  **Drafting the Plan:**
      *   **Title:** The Protocol Transfer.
      *   **Materials:** Envelopes, paper, pens, timer, distinct "puzzle sheets."
      *   **Roles:** Team Leads, Scribes, Rookies (rotated).
      *   **Scoring:** Points for correct answers. Multiplier for successful transfer.
      *   **The Twist:** Round 2 introduces a "Noise" variable that breaks heuristics but not algorithms.

  5.  **Developing the Debrief:**
      *   Map Round 1 to True Belief (Right for the wrong reasons).
      *   Map Round 2 to the Collapse (Luck runs out).
      *   Map Round 3 to Knowledge as Social Technology (The *Logos* as a tool).
      *   **Limitations:** The activity is pragmatic/instrumental. It doesn't capture the *intrinsic* value of knowledge (virtue epistemology), only the *reliability* value. It treats truth as a game goal, not a metaphysical state.
      *   **Failure Prediction:** Participants might focus too much on winning points rather than the method. Or they might over-complicate the "Manual." Recovery: Facilitator needs to pause and highlight the *frustration* of the collapse.

  6.  **Refining the "Social Technology" Aspect:**
      *   Make sure the "Justification" is literally a physical object (a cheat sheet) that is tested. If the sheet works for a stranger, it's knowledge. If it requires the original author to explain it, it's just belief + charisma.

  7.  **Review against Constraints:**
      *   90 mins? Yes.
      *   10 adults? Yes (3 teams of 3, 1 floater/facilitator).
      *   No money? Yes (Points/Brags).
      *   No citations? Yes.
      *   Debrief includes limitations? Yes.
      *   Predict failures? Yes.

  8.  **Final Polish:** Ensure the tone is inviting but philosophically rigorous. The "Think Carefully" instruction means I should show my work in the intro before the plan.

      *(Self-Correction during drafting)*: Make sure the "Collapse" isn't just "it got harder." It must be that the *strategy* that worked before is now actively misleading.
      *   *Example:* Round 1 Cipher: A=1, B=2. (Pattern: +1).
      *   *Round 2 Cipher:* A=1, B=2, C=4. (Pattern looks like +1, but actually doubles every 3rd letter).
      *   *Actually, simpler:* Round 1: Match shapes to symbols. Round 2: Shapes rotate. If you memorized "Triangle = Star," you fail. If you learned "Pointy = Pointy," you succeed.
      *   *Let's go with the "Rule Discovery" game.* It's cleaner.
      *   *Game:* "The Number Machine."
      *   *Input:* You give a number. *Output:* I give a result.
      *   *Task:* Predict the output for a new number.
      *   *Round 1:* Function is $x + 2$. Everyone gets it right.
      *   *Round 2:* Function changes to $x + 2$ *unless* $x > 5$, then $x - 2$.
      *   *Wait, that's too mathy.*
      *   *Let's stick to the "Instruction Manual" concept.* It fits "Social Technology" best.
      *   *Game:* **"The Origami Relay."**
      *   *Round 1:* Make a specific shape. One person sees the model, tells the team. Team succeeds. (True Belief: We have the shape).
      *   *Round 2:* Make the shape *again*, but the person who saw the model leaves. A new person enters. The team must use *only* the notes they wrote.
      *   *If they just said "fold it like this" (ostensive), it fails.*
      *   *If they wrote "fold corner to opposite edge" (propositional), it succeeds.*
      *   *This is perfect.* It physically embodies "account" as a transferable tool.

      *Wait, one nuance:* The prompt asks for beliefs that "collapse under a small change in conditions."
      *   In Origami, if the notes are bad, they fail immediately.
      *   Let's adjust: Round 1: Make Shape A. (Notes written). Round 2: Make Shape B (similar but distinct).
      *   *Better:* Round 1: Navigate a maze on paper. Round 2: Navigate the *same* maze, but the paper is rotated 90 degrees.
      *   *If you memorized "Left, Left, Right," you fail (Left is now Up).*
      *   *If you learned "Follow the wall," you succeed.*
      *   *This captures the "Change in Conditions" requirement perfectly.*

      *Okay, finalizing the "Maze Rotation" idea.*
      *   It's visual, non-verbal (reduces lecture drift), and clearly distinguishes memorization (belief) from navigation rules (knowledge).
      *   Incentive: Points for speed. Bonus for the "Rotation Round."
      *   Social Tech: The "Navigation Log" they write between rounds.

      *Wait, I need to ensure the "Social" part.*
      *   The "Navigation Log" must be used by a *different person*.
      *   So: Person A solves Maze 1. Writes Log. Person B uses Log to solve Maze 2 (Rotated).
      *   If Person A just memorized the path, Person B fails.
      *   If Person A understood the structure, Person B succeeds.
      *   This hits all marks.

  9.  **Structuring the Response:**
      *   **Philosophical Preamble:** Briefly articulate the reasoning (Reliability + Transferability).
      *   **Workshop Design:** Title, Goal, Materials, Setup.
