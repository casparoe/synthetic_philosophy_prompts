      *(Self-Correction on Time)*: 90 minutes is tight for 3 rounds + debrief. Keep rounds short (15 mins each).
      *(Self-Correction on Group Size)*: 10 people. 5 pairs? Or 2 teams of 5? Pairs allow more participation. Let's do 5 Pairs.
      *(Refining the "Collapse")*: Ensure the rotation is disorienting enough that "Left/Right" memory is useless.

