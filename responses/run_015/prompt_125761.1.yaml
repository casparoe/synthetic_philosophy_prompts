answer: |-
  **To:** The Research Committee
  **From:** External Advisor
  **Subject:** Research Agenda on Free-Floating Rationales

  ### 1. Preliminary Assessment: Taxonomy and Hypothesis

  Before proposing the agenda, I must address your provisional framework. Your intuition that the standard 'act or void' dichotomy is false is correct; however, your five-way taxonomy conflates *ontological* problems (who exists?) with *epistemic* problems (who can know?) and *structural* problems (what is the role?). This conflation will hinder theoretical progress. For instance, 'Unentertainable reasons' (category 4) differ fundamentally from 'Extinct bearers' (category 1). The former is a limit on cognition; the latter is a limit on existence. Treating them under one header obscures the source of the normativity.

  I recommend replacing your five categories with a distinction based on the **Source of Normative Force**. This allows the fellows to isolate *why* the rationale feels binding despite the missing bearer.

  1.  **Historical Force:** The rationale binds because of a past act of will (e.g., a promise, a bequest). The problem is the *persistence* of will after the willer is gone.
  2.  **Functional Force:** The rationale binds because of a systemic role (e.g., an office, a procedure). The problem is the *separation* of the role from the occupant.
  3.  **Objective Force:** The rationale binds because of a value independent of will (e.g., welfare of future generations). The problem is the *accessibility* of that value to current agents.

  Similarly, your hypothesis regarding 'Custodial' and 'Expressive' response modes is promising but requires refinement. 'Archiving' is not merely a practical act; it is a normative stance of *preservation without endorsement*. 'Extinguishing' is a performative act of *normative closure*. The research must determine whether these are distinct moral duties or merely pragmatic strategies.

  ### 2. The Research Agenda

  I propose three core questions, ordered by logical dependency. Six fellows should be divided into three pairs, each tackling one question, with mandatory cross-seminars to ensure the downstream questions remain grounded in the upstream findings.

  #### Question 1: The Ontology of Orphaned Normativity
  *Does a consideration retain normative force if there is no possible agent for whom it could be a reason?*

  *   **Reasoning:** This is the upstream metaphysical question. If 'free-floating rationales' are merely shorthand for 'reasons for hypothetical agents' or 'reasons for collectives', then the entire project collapses into standard collective intentionality or counterfactual analysis. We must establish whether there is a sui generis category of agent-neutral normativity that persists without a subject.
  *   **Tractability:** This is purely conceptual. It requires analysing the structure of practical reasoning. It does not need empirical data, but it does require rigorous logical modelling to test whether 'reasons without reasoners' generates contradictions.
  *   **Why fund it:** If the answer is 'no', the foundation should cease funding this cluster immediately. If 'yes', it opens a new chapter in meta-ethics.

  #### Question 2: The Logic of Institutional Succession
  *By what mechanism does a normative purpose transmit from a founder to a successor institution when the original intent is no longer intelligible or endorsable?*

  *   **Reasoning:** Assuming Q1 establishes that orphaned rationales exist, Q2 asks how they bind *us*. This addresses your interest in inherited purposes (endowments, constitutions). It moves from metaphysics to normative political philosophy. It challenges the false dichotomy you identified: it is not simply 'binds because willed' vs 'binds not at all'. There is a middle ground of *fiduciary stewardship*.
  *   **Tractability:** Conceptual, but benefits from case law analysis (trust law, constitutional interpretation) as 'data' for philosophical reflection.
  *   **Why fund it:** This has the highest direct utility for institutional governance. It provides the theoretical backbone for interpreting donor conditions and statutory mandates.

  #### Question 3: The Taxonomy of Discharge
  *What are the permissible normative stances towards an orphaned rationale other than compliance or rejection?*

  *   **Reasoning:** This is the downstream practical question. It validates your hypothesis about 'Custodial' and 'Expressive' modes. It asks: Is there a duty to preserve the *legibility* of a rationale even if one does not act on it? Is there a ritual required to formally extinguish a rationale?
  *   **Tractability:** Highly tractable within four years. It allows for the development of a normative typology.
  *   **Why fund it:** It offers actionable guidance for committees facing the 'act or void' dilemma.

  **Order of Operations:** Q1 must be pursued concurrently with Q2, but Q3 cannot be meaningfully answered until Q1 and Q2 have established the status and transmission mechanism of the rationale. You cannot decide how to discharge a duty (Q3) until you know if the duty exists (Q1) and who holds it (Q2).

  ### 3. Practical Pay-offs: Institutional Reasoning

  Your trustees are correct that the 'binds or void' dichotomy generates bad reasoning. A robust account of free-floating rationales yields specific, limited pay-offs.

  **Real Implications:**
  1.  **Interpretive Flexibility:** It legitimises 'cy-près' style reasoning (modifying a purpose to fit new circumstances) not as a legal workaround, but as a normative duty to the *rationale* rather than the *will*. It shifts the focus from 'What did the donor want?' to 'What does the endowment require?'
  2.  **Legitimacy of Dissolution:** It provides a framework for institutions to dissolve themselves or abolish offices without claiming a failure of mission. If a rationale is 'self-effacing' (your category 5), fulfilling it means ending the institution. This is currently treated as a paradox; a good theory treats it as a telos.
  3.  **Archival Duty:** It establishes that there may be a normative cost to simply ignoring a lapsed mandate. 'Archiving' becomes a distinct ethical category, preventing the erasure of historical normative commitments without acknowledgement.

  **Overrated Implications:**
  1.  **Legal Enforceability:** Philosophy cannot compel courts to recognise 'free-floating rationales' where trust law demands a beneficiary. Do not promise legal reform; promise *interpretive guidance* for trustees operating within legal grey areas.
  2.  **Resolution of Conflict:** A theory of orphaned rationales will not tell you which rationale wins when two conflict (e.g., a donor's restrictive condition vs. the university's modern mission). It clarifies the *nature* of the conflict, not the solution.

  **Non-Implications:**
  1.  **Moral Obligation to the Dead:** This project does not prove we owe duties to the deceased. It proves we may owe duties to the *commitments* they instantiated. This is a crucial distinction for trustees worried about 'ghost rule'.

  ### 4. The Artificial Systems Application

  Your programme officer's interest in AI is **adjacent, not identical**.

  *   **The Similarity:** Like an endowed chair, an AI system may operate with a purpose clause defined by designers who are long dead or irrelevant. It is a 'Bearerless Office' instantiated in code.
  *   **The Difference:** AI systems lack moral standing. An endowed chair is held by humans who can deliberate on the rationale; an AI executes it. The problem with AI is not 'How do we reason about this orphaned rationale?' but 'How do we prevent the system from pursuing an orphaned rationale destructively?'
  *   **Verdict:** Fund this only as a sub-case of Question 2 (Succession). Do not treat it as a separate stream. The philosophical problem is *teleological drift* in non-agential systems. If the fellows can solve how a human institution inherits a purpose without inheriting the founder's psychology, they will have solved the AI alignment problem regarding 'legacy code'. However, do not expect the AI industry to adopt normative philosophical distinctions without significant translation.

  ### 5. Concrete Case Study: The Phrenology Chair

  To demonstrate the utility of this agenda, let us work through a concrete case for **Question 2 (Succession)**.

  **The Case:** A university holds an endowment established in 1890 for a 'Chair of Phrenology'. The donor's intent was to prove character via skull shape. The science is discredited; the practice is ethically repugnant. The university cannot return the funds (legally restricted).

  **Standard Dichotomy:**
  *   *Bind:* Maintain the chair, teaching phrenology as truth (absurd).
  *   *Void:* Ignore the restriction, teach neuroscience, treat the money as unrestricted (potentially unlawful/breach of trust).

  **Applying the Research Agenda:**

  1.  **Ontology (Q1):** Is there a remaining rationale? Yes, but not the *scientific* one. The 'Historical Force' of the donor's specific will is exhausted (the science is false). However, a 'Functional Force' remains: the commitment to *funding the study of the mind*.
  2.  **Succession (Q2):** How does the purpose transmit? The university is not the donor's agent; it is the *steward of the rationale*. The rationale is not 'Prove Phrenology' but 'Advance understanding of the relation between physiology and character'. This allows the university to convert the Chair to 'Cognitive Neuroscience' without voiding the endowment. The normative force survives because the *genus* of the purpose survives, even if the *species* is extinct.
  3.  **Discharge (Q3):** What is the response mode? It is not 'Compliance' (teaching phrenology) nor 'Rejection' (ignoring the gift). It is **Custodial Translation**. The university has a duty to publicly mark the transition (Expressive), acknowledging the donor's original intent while explaining why the rationale has been translated to a modern equivalent. This preserves the 'legibility' of the history without executing the obsolete command.

  **Result:** The university avoids the falsehood of teaching phrenology and the dishonour of ignoring the donor. It treats the rationale as a living normative object that evolves, rather than a dead command.

  ### 6. Ranking Shifters: Evidence and Intermediate Results

  You asked what evidence would move these questions up or down the ranking within the four-year window.

  **Move Question 1 Up (Priority Increase):**
  *   *Intermediate Result:* If the fellows can demonstrate that standard 'collective reason' theories (e.g., reasons held by groups) fail to account for 'Bearerless Offices' (your category 3) without contradiction. If they prove that institutional reasons cannot be reduced to the sum of members' reasons, the metaphysical stakes rise significantly.

  **Move Question 1 Down (Priority Decrease):**
  *   *Intermediate Result:* If the analysis reveals that all 'free-floating rationales' are reducible to 'reasons for hypothetical ideal agents'. If the ontology collapses into standard counterfactual utilitarianism or Kantianism, the distinctiveness of the cluster vanishes. The project should then pivot entirely to Question 2 (Applied Succession).

  **Move Question 3 Up (Priority Increase):**
  *   *Intermediate Result:* If case studies (like the Phrenology Chair) reveal that 'Archival' responses are currently causing legal or reputational harm because institutions treat them as 'inaction'. If there is evidence that a lack of normative vocabulary for 'Custodial' stances is leading to poor governance, the practical urgency of Q3 increases.

  **Move Question 3 Down (Priority Decrease):**
  *   *Intermediate Result:* If the fellows find that 'Custodial' and 'Expressive' modes are not normatively distinct but merely rhetorical variations on 'Non-Compliance'. If there is no duty to archive, only a permission, the scope of Q3 shrinks to a matter of public relations rather than philosophy.

  ### 7. Conclusion

  This agenda avoids the trap of merely cataloguing examples of orphaned rationales. Instead, it attacks the structural conditions that make them possible. By replacing your scenario-based taxonomy with a force-based one, and by ordering the questions from metaphysics to practice, you ensure that the six fellows are building a unified theory rather than six isolated papers.

  The Phrenology Chair case demonstrates that the payoff is not merely theoretical; it offers a way for institutions to honour the past without being held hostage by it. This is the precise 'third way' your committee suspects exists. The task of the next four years is to prove it is a road, and not a mirage.
