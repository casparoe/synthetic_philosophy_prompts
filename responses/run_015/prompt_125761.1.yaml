prompt: |-
  I sit on the research committee of a small grant-making foundation. Over the next four years we can fund roughly six postdoctoral fellowships in normative philosophy, and we have decided against spreading them: the whole envelope will go to a single cluster of questions. The cluster we keep returning to is that of free-floating rationales — considerations that favour a response, or count in favour of an outcome, without being anyone's reasons in particular. Not shared or collective reasons in the ordinary sense, where a group or its members hold them together, but reasons whose every candidate bearer is missing: unowned, unentertained, or unentertainable considerations that nonetheless seem to retain whatever force reasons have.

  So that we are not leaning on any settled terminology, let me fix ours provisionally. One of our advisers sketched a five-way taxonomy, which I suspect does not survive scrutiny as stated:

  1. Extinct bearers. A rationale whose only bearer is dead — a promise made to someone who has since died, the point of a bequest whose settlor and beneficiaries are both long gone, the stated aim in a constitution's preamble.
  2. Never-bearers. Considerations that concern individuals who cannot now exist: people who would have lived under a different policy, future generations whose identity depends on what is done now, and merely possible agents generally.
  3. Bearerless offices. A rationale attaching to a role, institution or office rather than to its occupants — the purpose of an endowed chair, the point of a procedural rule, the mission of a statutory body. Occupants turn over; nobody now endorses the founding rationale, and arguably nobody ever did.
  4. Unentertainable reasons. Reasons generated by the structure of a situation that no deliberator could formulate or act on — considerations available only after the last opportunity to respond has passed, or which the agent's own representational limits exclude.
  5. Self-effacing rationales. Reasons for an entity to bring about a state of affairs in which that entity no longer has the standing to hold reasons at all: reasons for a court to abolish its own jurisdiction, for a constitution to authorise its replacement, for a group to dissolve.

  We also have a working hypothesis that the standard menu of responses is too narrow. Faced with an orphaned rationale, an institution appears to have two options: act on it, or treat it as void. Our suspicion is that there is a third and fourth response-mode that the literature's action/belief dichotomy hides — something custodial or archival (preserve the rationale, keep it legible, without executing it) and something expressive or extinguishing (acknowledge it, mark it, or formally retire it). We want to know whether that is a genuine insight or a confusion generated by our own taxonomy.

  What we need from you is a defended research agenda, not a survey. Concretely:

  Which three or four questions within this cluster should six people work on for four years, in what order, and why? Please give us the reasoning rather than the list: what makes each question worth years of someone's career, which questions are upstream of which (what has to be settled before a downstream question can even be posed clearly), which are tractable by philosophers working conceptually with no empirical budget, and which we should decline to fund because their resolution would not change much else.

  Then, because our trustees will ask: which of the alleged practical pay-offs are real? Our interest is institutional reasoning about inherited purposes — donor conditions on collections, endowed posts whose founding description no longer names a discipline, corporate purpose clauses, lapsed statutory mandates, treaty and constitutional preambles. We think a great deal of bad reasoning here comes from a false dichotomy between "binds because it was originally willed" and "binds not at all". Tell us which implications for that domain genuinely follow from a good account of free-floating rationales, which are overrated, and which do not follow at all. We would also like your view on one application our programme officer is keen on — specifying purposes for artificial systems that will long outlive their designers — and whether it is the same problem or merely adjacent.

  Two further constraints. First, if you think our five-way taxonomy, or the hypothesis about third and fourth response-modes, is confused, say so and replace it rather than working inside it; we would rather be corrected than accommodated. Second, do not give us a reading list, a bibliography, or a guide to who has said what — we have librarians for that, and we are deliberately not footing the agenda on any author's programme. Where you need a term of art, define it in a sentence. For your top-ranked question, work through one concrete institutional case end to end so we can see what a result would look like, and state what evidence or intermediate result within the four-year window would move that question up or down the ranking.

  Please write the answer in British English.
reasoning: |-
  Here's a thinking process that leads to the suggested research agenda:

  1.  **Analyze the Request:**

      *   **Role:** Advisor to a research committee of a small grant-making foundation.
      *   **Task:** Propose a defended research agenda (3-4 questions) for six postdoctoral fellowships over four years in normative philosophy.
      *   **Topic:** "Free-floating rationales" (considerations that favour outcomes without being anyone's reasons in particular).
      *   **Input Material:** A provisional five-way taxonomy (Extinct bearers, Never-bearers, Bearerless offices, Unentertainable reasons, Self-effacing rationales) and a hypothesis about response modes (Act, Void, Custodial/Archival, Expressive/Extinguishing).
      *   **Constraints:**
          *   British English.
          *   No reading lists/bibliographies/author guides.
          *   Critique/replace the taxonomy/hypothesis if confused (preferred over accommodation).
          *   Explain reasoning (order, tractability, impact).
          *   Address practical pay-offs (institutional reasoning, inherited purposes).
          *   Address the AI application (specifying purposes for long-lived systems).
          *   Work through one concrete institutional case end-to-end for the top-ranked question.
          *   State evidence/intermediate results that would shift the ranking.

  2.  **Evaluate the Input (Taxonomy & Hypothesis):**

      *   *Taxonomy Critique:* The five categories overlap significantly.
          *   "Extinct bearers" and "Never-bearers" are both about the *temporal/modal status of the agent*.
          *   "Bearerless offices" is about *structural vs. personal* agency.
          *   "Unentertainable reasons" is about *epistemic/cognitive access*.
          *   "Self-effacing rationales" is about *teleological termination*.
          *   *Problem:* They mix metaphysics (who exists?), epistemology (who can know?), and normative structure (what is the role?). A better taxonomy should distinguish the *source* of the orphaning from the *normative status* of the rationale.
      *   *Hypothesis Critique:* The "Act vs. Void" dichotomy is indeed false. "Custodial" and "Expressive" are insightful but need grounding. Are they distinct *actions* or distinct *attitudes*? "Archival" sounds like inaction, but preserving legibility is an action. "Extinguishing" is a performative speech act.
      *   *Decision:* I should refine the taxonomy to focus on the *normative relation* rather than the *biographical status of the bearer*. The core puzzle is: *Can a reason exist without a reasoner?* If so, *what kind of normativity is it?* (Moral? Prudential? Functional? Aesthetic?).
      *   *Revision:* I will propose a shift from "Who is missing?" to "What kind of normative force remains?" This makes the research more tractable for philosophers.

  3.  **Develop the Research Questions (The Agenda):**

      *   *Goal:* 3-4 questions, ordered by dependency.
      *   *Question 1 (Metaphysics of Normativity):* Do free-floating rationales exist, or are they reducible to hypothetical or collective reasons? This is the foundation. If they don't exist, the rest is moot.
      *   *Question 2 (The Logic of Succession):* How does normative force transmit across time/agency changes? (This covers the "inherited purposes" aspect).
      *   *Question 3 (Response Modes):* What are the permissible responses to orphaned rationales? (Validating the foundation's hypothesis about custodial/expressive modes).
      *   *Question 4 (Application/AI):* (Maybe too specific for a general philosophy grant, better to subsume under Q2 or Q3). Let's stick to 3 core philosophical questions and treat AI/Institutions as the testing ground.
      *   *Refined Agenda:*
          1.  **The Ontology of Orphaned Normativity:** Are there agent-neutral reasons that persist without agents?
          2.  **The Logic of Institutional Succession:** How do purposes survive changes in personnel and founding intent?
          3.  **The Taxonomy of Response:** Beyond compliance and rejection, what are the normative categories of stewardship?

  4.  **Drafting the Content - Section by Section:**

      *   **Introduction:** Acknowledge the ambition, validate the intuition, but critique the taxonomy.
      *   **Critique of Taxonomy:** The current list mixes *causes* of orphaning with *types* of rationales. Propose a cleaner distinction: *Source of Orphaning* vs. *Residual Force*.
      *   **Critique of Response Modes:** The "Custodial/Expressive" distinction is good but needs to be framed as *normative stances* rather than just actions.
      *   **The Research Questions (The Core):**
          *   *Q1: The Status Question.* (Upstream). Do these reasons exist?
          *   *Q2: The Transmission Question.* (Midstream). How do they bind successors?
          *   *Q3: The Discharge Question.* (Downstream). How do we properly end them?
      *   **Ordering & Tractability:** Explain why Q1 must come first. Explain why these are conceptual, not empirical.
      *   **Practical Pay-offs:** Address the "false dichotomy" (binds vs. void). Explain where the philosophy helps (interpretive flexibility) and where it doesn't (legal enforceability).
      *   **AI Application:** Is it the same problem? Yes, regarding *alignment over time*, but distinct regarding *moral standing*.
      *   **Concrete Case Study:** Need a specific example. *The Endowed Chair whose discipline no longer exists.* (e.g., a Chair in Phrenology or Elocution). Walk through Q1-Q3 using this.
      *   **Ranking Shifters:** What would make us change our minds? (e.g., if Q1 is proven incoherent).

  5.  **Refining the Argument (Self-Correction during drafting):**

      *   *Tone:* Professional, academic, British English (analyse, programme, centre, etc.).
      *   *Constraint Check:* Did I avoid bibliographies? Yes. Did I critique the taxonomy? Yes. Did I do the case study? Yes.
      *   *Critique Depth:* Don't just say "it's wrong." Say "it conflates X and Y." The current taxonomy mixes *epistemic* limits (Unentertainable) with *ontological* limits (Extinct). This makes it hard to theorise.
      *   *The "Third/Fourth Response":* I need to be careful not to just accept "Custodial." Is "Archiving" a normative duty or a pragmatic choice? The research should determine this.
      *   *AI:* Be careful not to get bogged down in AI safety jargon. Keep it philosophical (teleology without a teleologist).

  6.  **Final Polish:**

      *   Check British spelling (favour, programme, analyse, centre).
      *   Ensure the structure is logical.
      *   Make sure the "Evidence/Intermediate Result" section is specific.

  **(Self-Correction on the Taxonomy Critique):**
  The prompt asks me to replace it if confused. The current taxonomy is a list of *scenarios*, not *categories*. A better taxonomy distinguishes the *nature of the gap*.
  1.  *Agent-Gap:* No agent exists (Extinct/Never).
  2.  *Access-Gap:* Agent exists but cannot grasp (Unentertainable).
  3.  *Role-Gap:* Agent exists but isn't the 'owner' (Bearerless Offices).
  4.  *Teleological-Gap:* The agent is dissolved by the act (Self-effacing).
  Actually, a better philosophical move is to categorise by *Normative Source*:
  1.  *Historical:* Force derives from past will (Promises/Bequests).
  2.  *Functional:* Force derives from systemic role (Offices/Procedures).
