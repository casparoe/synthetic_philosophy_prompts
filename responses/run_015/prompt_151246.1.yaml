prompt: |-
  I'm in this reading group about democratic innovations and we spent like three hours arguing about sortition and lottocracy -- you know, selecting people for government by random lot instead of voting. Most examples people bring up are either ancient Athens or these abstract thought experiments, and I kept thinking it would be more interesting if some actual town tried it but with a local quirk. So here's the setup for a story: there's this town called Millhaven that replaced its zoning board with a lottocratic council about eight years ago, picking members randomly for one-year terms. But they also invented this extra rule that isn't part of any standard theory -- every meeting, they draw lots again to pick two citizens who have to act as "forced contrarians," meaning they must argue against whatever position they actually hold in real life, and the council is required to hear both out before any vote. Now there's a controversial proposal to put a large solar installation on old wetland, and the lottery has just assigned a retired civil engineer who genuinely wants the project to argue against it, and a local activist who usually fights all development to defend the solar farm. Write a short story about that one session, focusing on how the assigned roles mess with people's ability to recognize sincerity, whether the contrarian rule actually improves deliberation or just creates theater, and maybe include the moment where someone points out that this contrarian lottery was never part of classical sortition -- it was just something Millhaven's first council made up because they were paranoid about echo chambers. I don't want a lecture on democracy, just let the human dynamics play out in real time. Also I might have spelled lottocracy wrong earlier but I think its right now.
