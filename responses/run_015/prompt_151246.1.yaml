answer: |-
  The bingo cage sat on the folding table like a silent judge. It was chrome, dented, and spun with a rattle that echoed too loudly in Room B of the Millhaven Town Hall.

  Eight years ago, the town had fired the zoning board. In their place, twelve citizens were drawn by lot every year to decide where buildings could go. It was supposed to be pure democracy, uncorrupted by campaigns or donors. But three years into the experiment, the first council had gotten nervous. They worried that random people would just cluster into tribes anyway—that neighbors would talk to neighbors and reinforce the same biases. So, they added the amendment. The Contrarian Clause.

  Every meeting, two names were drawn from the secondary cage. Those two citizens had to argue the opposite of their known interests. They had to wear the enemy's clothes for an hour.

  The cage stopped spinning. Sarah, the council chairperson this month, reached in and pulled the first slip.

  "Arthur Penhaligon," she read.

  A murmur went through the gallery. Arthur was in the third row. He was seventy, retired civil engineering, and everyone knew he'd been writing op-eds about the need for energy independence for a decade. He wanted the solar farm on the Blackwood Wetlands more than anyone.

  Sarah pulled the second slip. "Elena Rosales."

  Elena, sitting next to Arthur, stiffened. She ran the local land trust. She had chained herself to a bulldozer in 2019. She was the soul of the opposition.

  "Roles," Sarah said, not looking up from her script. "Arthur, you are opposed to the proposal. Elena, you are in favor. You have five minutes each. The council must hear you before we deliberate."

  Arthur stood up slowly. He adjusted his glasses. He looked like a man asked to prove that water was dry.

  "Look," Arthur started, his voice raspy. "I… regarding the photovoltaic array on the Blackwood site." He paused. He knew the soil composition there better than anyone. He knew the drainage plans were sound. He had to find a lie that sounded like truth. "The… the subsidence risk. It's higher than the report says."

  Council member Marcus, a barista who looked like he hadn't slept since drawing his own lot number, leaned forward. "Higher how, Arthur? You signed off on the soil surveys last month."

  Arthur sweat beaded on his forehead. "Unforeseen variables. Organic decay. Methane pockets." He was inventing geology on the fly. He glanced at Elena. She looked sick.

  "It's a risk we shouldn't take," Arthur finished, sitting down quickly. He wouldn't meet anyone's eyes. He had just told his neighbors that his own professional stamp was worthless.

  Elena stood up. She smoothed her skirt. She loved the wetlands. She knew every heron nest in the Blackwood. Now she had to sell them out.

  "Progress requires sacrifice," Elena said. Her voice was steady, but her hands were shaking. "The wetland… it's already compromised. Invasive species. It's not the pristine ecosystem people think it is."

  "That's not true," someone shouted from the back. A member of Elena's own trust.

  Elena flinched but kept going. "The solar farm… it provides tax revenue. It cleans the air. Is a few acres of mud worth the cost of coal?" She was using the language of the developers, the exact phrases she'd fought against for fifteen years. They sounded like ash in her mouth.

  The council room was silent, but it wasn't the silence of respect. It was the silence of confusion. When Arthur spoke, usually, people listened because he knew the truth. When Elena spoke, people listened because she knew the moral weight. Now, the expert was sowing doubt he didn't believe, and the moral compass was pointing north because she was paid to point south.

  Marcus, the barista, rubbed his temples. "I don't know what to do with this. Arthur, you're saying the ground is unstable. Elena, you're saying the land is worthless. You're both tearing down the project, but for different reasons. Or… wait." He looked between them. "Are you telling us what you think, or what you were told to say?"

  "The rule is the rule," Sarah said sharply.

  "The rule is stupid," Marcus shot back. He turned to the gallery. "Does anyone else remember why we actually have this contrarian thing? It wasn't in the original charter."

  Arthur shifted in his seat. "It was… precautionary."

  "It was paranoia," Marcus said. "My aunt was on the first council. She told me they were scared. They thought if you put random people in a room, they'd just agree with each other to go home early. They thought they needed friction. So they made up a rule that isn't in Athens, isn't in any textbook. They just wanted to make sure someone played devil's advocate."

  "But now the devil knows he's acting," Elena said softly. She sat down, looking exhausted.

  The dynamic in the room had curdled. Before the draw, the council had been leaning toward approval. The solar farm was needed, the wetlands were marginal. It was a hard choice, but a clear one. Now, the clarity was gone. Not because the facts had changed, but because the signals were jammed.

  If Arthur opposed it, was there a hidden engineering flaw they couldn't see? Or was he just playing the game?
  If Elena supported it, was the environmental impact actually negligible? Or was she just wearing the costume?

  "I feel like I'm watching a trial where the lawyers swapped sides five minutes before opening statements," said a young woman on the council. She was looking at her hands. "How do we weigh sincerity? If Arthur believes the ground is stable, but argues it's not… is that testimony? Or is it fiction?"

  "It's deliberation," Sarah insisted, though she sounded less sure now. "It forces you to hear the counter-argument."

  "It forces us to hear lies," Arthur muttered. He was staring at the bingo cage. "I know the ground is stable. I told you it was unstable. You know I know it's stable. So why are we wasting time?"

  "Because maybe you're wrong!" Sarah snapped. "Maybe you're too close to the project to see the risk. That's the point!"

  "The point was to stop echo chambers," Marcus said. "But this isn't an echo chamber. This is a hall of mirrors. You can't see the real shape of anything because everything is reflected backward."

  The clock on the wall ticked. The solar proposal sat on the table, a stack of papers that suddenly felt very heavy. The wetlands outside were darkening as the sun went down, the herons settling in, unaware that their fate was being decided by a game of inverted poker.

  Elena looked across the table at Arthur. For a second, the roles dropped. They were just two neighbors in a small town, both trapped in a mechanism designed to cure a disease they didn't have. They weren't polarized; they were just tired. But the rule didn't allow them to be tired. It demanded performance.

  "Can we vote?" the young councilwoman asked. "Or do we need more… theater?"

  Sarah looked at the contrarians. "Do you have anything else? Anything sincere?"

  Arthur stood up again. He looked at the council. "The ground is stable. The plans are good. I argued against them because I drew a slip of paper."

  Elena stood. "The land matters. The loss is real. I argued it didn't because I drew a slip of paper."

  They sat down.

  The room was quieter than before. The information had been provided, but the trust was broken. The council members looked at the proposal, then at the contrarians, then at each other. They couldn't tell if the doubt they felt was due to the merits of the case, or the artificial friction of the room.

  "Motion to table the vote," Marcus said. "Until we figure out if we're governing a town or running a psychology experiment."

  "Second," the young woman said.

  Sarah banged the gavel. It sounded flat. "Meeting adjourned."

  People stood up, chairs scraping against the linoleum. Arthur didn't move immediately. He watched the bingo cage. It was still. It was just metal and plastic. But for eight years, it had been deciding what was true, not by finding facts, but by scrambling who was allowed to speak them.

  Elena touched his shoulder. "Coffee, Arthur? My treat. I promise I won't argue about the price."

  Arthur smiled, a thin, weary thing. "Only if I can argue that it's too expensive."

  "Deal," she said.

  They walked out together, leaving the council to stare at the wetland maps, wondering if anything on the paper was real anymore.
