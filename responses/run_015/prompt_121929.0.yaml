answer: |-
  This is a brilliant stress test for Rorty. The Scopes Trial is often framed as Reason vs. Superstition, but through a Rortian lens, it looks much more like a collision between two metaphysical comfort blankets, both claiming to be the One True Map of Reality.

  Here is the conceptual mapping of the Scopes Trial through Rorty's neopragmatism, followed by an honest assessment of where the theory breaks down against the historical reality.

  ### Part 1: The Representationalist Trap
  **Are Bryan and Darrow both trapped?**

  Yes. In Rorty's view, the entire trial is a tragedy of "Mirror of Nature" thinking. Both sides are operating under the assumption that language (whether Biblical or Scientific) is a medium that *corresponds* to a non-human reality, and that the side with the better correspondence wins.

  *   **William Jennings Bryan (The Theological Representationalist):** Bryan treats the Bible not as a poetic tool for community cohesion or moral guidance, but as a factual report that mirrors Divine History. For him, the Butler Act isn't just about policy; it's about preserving the accuracy of the mirror. If the mirror cracks (if Genesis is metaphorical), the reality it reflects (God's order) dissolves. He is fighting to protect the *correspondence* between Scripture and Fact.
  *   **Clarence Darrow (The Scientific Representationalist):** Darrow is often seen as the liberator, but Rorty would argue he is playing the same game. Darrow treats Science as the superior mirror. He doesn't argue that evolution is just a more *useful* story for predicting biological outcomes; he argues it is the *true* account of origins. He cross-examines Bryan to show that the Biblical mirror is distorted, implying the Scientific mirror is clear.

  **The Rortian Critique:** Both men are wasting time arguing about which vocabulary "carves nature at its joints." Rorty would say nature doesn't have joints to carve; it just *is*. Vocabularies are tools, not maps. The Bible is a tool for certain kinds of moral solidarity; evolutionary biology is a tool for prediction and technological control. The trial becomes a farce because both sides insist their tool is the "Truth" rather than admitting they are different instruments for different jobs.

  ### Part 2: The Liberal Ironist Intervention
  **What would a Rortian say?**

  A Rortian "liberal ironist" is someone who recognizes the contingency of their own final vocabulary (they know they could have been socialized differently) but is committed to reducing cruelty.

  *   **On the Conflict:** The ironist would refuse to adjudicate who is "right" about the apes. Instead, they would ask: "Which vocabulary helps us create a more inclusive, less cruel society?"
  *   **On Solidarity vs. Objectivity:** This explains the institutional battle over the curriculum. Rorty argues we seek *solidarity* (agreement with our peers) rather than *objectivity* (agreement with reality). The fight over the textbook wasn't really about biology; it was about **socialization**.
      *   For Dayton, Tennessee, teaching Genesis was a ritual of belonging. It signaled, "We are part of the community of Believers."
      *   For the Northern press and scientific community, teaching Evolution was a ritual of modernity. It signaled, "We are part of the community of Progress."
      *   The trial was a battle over which "We" gets to define the public school system. Rorty illuminates that the curriculum is never neutral; it is always a mechanism for creating a specific kind of solidarity.
  *   **The Resolution:** A Rortian would likely advocate for teaching evolution *not* because it is "true," but because the vocabulary of science fosters a cosmopolitan solidarity that is more conducive to liberal democracy than sectarian religious vocabularies. But they would admit this is a political choice, not a metaphysical necessity.

  ### Part 3: The Limits of Rorty (Where the Case Breaks the Theory)

  This is where your friend's pushback is vital. While Rorty explains the *structure* of the argument beautifully, the Scopes episode reveals dangerous blind spots in neopragmatism when faced with raw power and existential stakes.

  **1. The Materiality of Power vs. The Fluidity of Vocabulary**
  Rorty treats vocabularies as tools we can swap out when they stop working ("redescription"). But in 1925, vocabularies were backed by the coercive power of the state.
  *   **The Limit:** You cannot "redescribe" your way out of a criminal conviction. Scopes was fined $100. The Butler Act was not a suggestion for a new language game; it was a law enforced by police and courts.
  *   **The Insight:** Rorty underestimates how material institutions freeze vocabularies in place. When a vocabulary becomes law, it ceases to be a tool for coping and becomes a weapon for exclusion. Antirepresentationalism sounds like a luxury when your livelihood depends on adhering to the "official" vocabulary. The trial shows that conflicts over truth are often proxies for conflicts over *who holds the monopoly on violence and legislation*. Rorty's focus on conversation ignores the fact that some participants have the power to end the conversation.

  **2. The Existential Stakes of "Contingency"**
  Rorty asks us to accept the contingency of our final vocabulary—to admit that our deepest beliefs are just historical accidents.
  *   **The Limit:** For Bryan and his constituents, the Bible was not contingent; it was the anchor of salvation. To suggest it is merely a "tool" is not a philosophical nuance; it is a spiritual threat.
  *   **The Insight:** Rorty's ironism requires a level of security and detachment that was absent in 1925 Dayton. When people feel their eternal souls are at stake, they do not respond well to "these are just different descriptions." The ferocity of the culture war proves that human beings are rarely ironists about their final vocabularies. Rorty's theory works best for academics in secure democracies; it fails to account for the visceral violence that erupts when you tell a believer their truth is just a "narrative."

  **3. Normal vs. Abnormal Discourse**
  Rorty distinguishes between "normal discourse" (playing by the rules) and "abnormal discourse" (changing the rules/progress). He assumes abnormal discourse eventually wins through the force of the better argument.
  *   **The Limit:** In Scopes, abnormal discourse (evolution) was legally suppressed. The "marketplace of ideas" was rigged by the legislature.
  *   **The Insight:** This reveals a political naivety in Rorty. He assumes that if we drop the claim to "Objective Truth," we can just negotiate solidarity. But Scopes shows that groups fight for *objectivity* precisely because it grants them the authority to suppress the other side. If Bryan admits the Bible is just a vocabulary, he loses the authority to ban the textbook. The claim to "Mirror Reality" is a power move. Rorty wants to disarm that move, but history shows that actors will cling to representationalism because it is the only way to justify coercive power.

  ### Summary of the Mapping

  **Where Rorty Illuminates:**
  *   He exposes that both Bryan and Darrow were fighting a metaphysical ghost fight (Who mirrors Reality?) rather than a practical one (What do we want our schools to do?).
  *   He correctly identifies the curriculum battle as a fight for **solidarity** (defining "Us") rather than **objectivity** (defining "It").
  *   He explains why the debate was intractable: you cannot compromise between two claims of absolute representation.

  **Where Rorty Fails:**
  *   **Power Blindness:** He treats vocabulary as fluid, ignoring that laws solidify vocabulary into force.
  *   **Psychological Unrealism:** He assumes people can be ironists about their deepest beliefs. Scopes proves they cannot.
  *   **Political Naivety:** He thinks dropping "Truth" reduces conflict. Scopes suggests that claiming "Truth" is actually necessary for political mobilization. If Darrow had said, "Evolution is just a useful story," he would have lost the case immediately. He *needed* the representationalist claim to Science to counter the representationalist claim to Scripture.

  **Verdict:**
  Your friend is right to circle back to Scopes. The trial validates Rorty's diagnosis (that culture wars are clashes of final vocabularies masquerading as facts) but invalidates his prescription (that recognizing this will help us cope). In the real world, recognizing that a vocabulary is contingent doesn't stop the fight; it just changes the stakes from "Who is right?" to "Who is in charge?" And people are often willing to kill for the latter just as readily as the former. Rorty offers a way to understand the stalemate, but not a way to resolve it when the state is involved.
