answer: |-
  Here is a complete 90-minute seminar plan designed to force the students into the conceptual trouble spots of Everettian probability without initial exposition.

  ### **Seminar Title:** The Copy Game
  **Goal:** Derive the tension between branch-counting and amplitude-weighting through decision theory.
  **Constraint:** The phrase "Born Rule" is banned until minute 75.

  ---

  ### **1. Materials & Setup**
  *   **Room:** Tables arranged in clusters. Whiteboard visible to all.
  *   **For each student:** 1 "Agent Sheet" (paper with betting fields), 1 pen.
  *   **For the Instructor:**
      *   3 Large Opaque Bags (labeled Round 1, Round 2, Round 3).
      *   **Index Cards:** 100 small cards. 50 Red, 50 Blue.
      *   **Envelopes:** 20 large white envelopes.
      *   **Stakes:** 30 pieces of chocolate (or 30 participation points recorded on a sheet).
      *   **Whiteboard Markers:** Red and Blue.

  ---

  ### **2. Timeline & Mechanics**

  #### **00:00 – 00:10: The Setup (No Physics)**
  *   **Instruction:** "You are agents. I am the Universe. In this room, we are going to simulate a process where *every* possible outcome happens. There is no randomness, only branching."
  *   **The Rule of Identity:** "When a split occurs, *all* resulting copies are 'You'. You do not cease to exist in the other branches. Your goal is to maximize the total utility of 'You' across the entire multiverse."
  *   **The Bet:** Hand out Agent Sheets. They must write down a choice (Red or Blue) *before* the bags are opened.
  *   **The Payoff (Intentionally Vague):** "If you bet correctly, you get chocolate. I will not specify yet if 'You' means the pre-split agent or the post-split copies. Figure out what you want to maximize."

  #### **00:10 – 00:30: Round 1 & 2 (The Counting Intuition)**
  *   **Round 1 (Equal Measure):**
      *   **Bag 1:** Contains 1 Red Card, 1 Blue Card.
      *   **Action:** You draw *both* cards. You place them on the table, face up.
      *   **Branching:** You declare: "The universe has split. There is a Red Branch and a Blue Branch."
      *   **Distribution:** You hand out envelopes. 7 envelopes contain a slip saying "You are in the Red Branch." 7 envelopes contain "You are in the Blue Branch." (Ensure every student gets an envelope, simulating that *all* branches are populated).
      *   **Payoff:** Students open envelopes. Those whose envelope matches their bet get 1 chocolate.
      *   **Result:** Roughly half win.
      *   **Board:** Draw a tree. 1 stem $\rightarrow$ 2 branches. Label them "1 copy each."

  *   **Round 2 (Unequal Measure):**
      *   **Bag 2:** Contains 9 Red Cards, 1 Blue Card.
      *   **Action:** You draw *all 10* cards. Display them.
      *   **Instruction:** "The universe splits again. But this time, the Red outcome has... more stuff in it."
      *   **Distribution:** You need to simulate 10 branches with 14 students.
          *   Assign 9 students to hold a "Red Copy" token.
          *   Assign 1 student to hold a "Blue Copy" token.
          *   (The remaining 4 students are "Observers" who record data, rotate them in later rounds).
      *   **The Bet:** Students bet *before* you reveal the cards.
      *   **Payoff:** 1 chocolate per matching token.
      *   **Result:** The 9 Red holders win. The 1 Blue holder loses.
      *   **Discussion Prompt:** "Why did you bet Red?"
      *   **Expected Answer:** "Because there were more cards/copies."
      *   **Board:** Draw tree. 1 stem $\rightarrow$ 2 branches. Label Red "9 copies", Blue "1 copy."

  #### **00:30 – 00:50: Round 3 (The Coarse-Graining Trap)**
  *   **Goal:** Break the "Counting" intuition.
  *   **Setup:** Bag 3 contains 1 Red Card, 1 Blue Card (Same as Round 1).
  *   **The Twist:** Before the students bet, take the Red Card. Put it inside a clear plastic sleeve. Inside that sleeve, place 9 blank slips of paper. Take the Blue Card. Put it in a sleeve with 0 blank slips.
  *   **Instruction:** "I haven't changed the outcomes. Red and Blue still happen. But I've added 'labels' to the Red branch. Does this create 9 new worlds, or just 1 world with 9 labels?"
  *   **Activity:** Split the class into two factions.
      *   **Faction A (Fine-Grainers):** Argue that every distinct physical slip is a distinct branch. (Count = 10 vs 1).
      *   **Faction B (Coarse-Grainers):** Argue that only the Card color defines the branch. (Count = 1 vs 1).
  *   **The Conflict:** Ask them to place a bet based on their counting method.
      *   If Faction A is right, they *must* bet Red (90% of branches).
      *   If Faction B is right, it's a wash (50% of branches).
  *   **Reveal:** Reveal the cards. Both Red and Blue happen.
  *   **Payoff Crisis:** Ask Faction A: "If you bet Red because there are 9 branches, but the Coarse-Grainers say there is only 1, who gets the chocolate?"
  *   **Key Insight:** The *number of branches* is not a physical fact; it depends on how you choose to describe the system (the basis).
  *   **Board:** Draw the Round 2 tree again. Erase the "9 copies" label. Write "Measure = ?"

  #### **00:50 – 01:10: The Payoff Debate (Decision Theory)**
  *   **Goal:** Force the definition of "Utility."
  *   **Scenario:** Write on the board:
      *   **Option L:** 9 Copies win 1 chocolate each. (Total = 9, Avg = 1)
      *   **Option R:** 1 Copy wins 10 chocolates. (Total = 10, Avg = 10)
  *   **Question:** "You are the Pre-Split Agent. You know both L and R will happen. You want to maximize 'Your' chocolate. Do you choose L or R?"
  *   **The Argument:**
      *   **Team Sum:** "Choose R. There is more chocolate in the multiverse." (This leads to weighting by amplitude).
      *   **Team Average:** "Choose L. Most 'Yous' get chocolate." (This leads to branch counting).
      *   **Team Self:** "I only experience one outcome. I should maximize the chance *my* experience is good." (This leads to the probability problem).
  *   **Facilitation:** Do not solve this. Let them argue. Write their arguments on the board under "Utility Function."
  *   **The Pivot:** "In standard probability, we assume you care about the *average* expected utility. In this game, if you care about the *sum*, you are effectively weighting the branches by their 'size' (number of cards)."

  #### **01:10 – 01:25: Repeated Trials (Typicality)**
  *   **Goal:** Show that "Most Branches" $\neq$ "Born Rule" without weighting.
  *   **Activity:** Quick-fire round. 5 splits. Bag ratio is always 9 Red / 1 Blue.
  *   **Task:** Each student tracks their "History" (e.g., R-R-B-R-R).
  *   **Observation:** Ask: "How many of you saw a 50/50 mix?" (Very few). "How many saw mostly Red?" (Most).
  *   **The Trap:** "So, the majority of branches see Born Rule statistics."
  *   **The Counter:** "Wait. How did you count the majority? You counted *branches*. But we just agreed in Round 3 that branch counting is ill-defined. If you group the 'All Red' histories into one big branch and the 'Mixed' histories into many small branches, the 'Mixed' branches become the majority."
  *   **Point:** Typicality arguments presuppose a measure over branches. They don't derive it.

  #### **01:25 – 01:30: The Reveal & Debrief**
  *   **Unban the Phrase:** "This problem is called the **Born Rule Problem** in the Everett Interpretation."
  *   **Map the Game to Physics:**
      *   **Cards/Slips:** Basis states / Decoherence history.
      *   **Counting Cards:** Naive branch counting (fails because basis-dependent).
      *   **The Payoff Debate:** Decision-theoretic derivations (Deutsch-Wallace). To recover quantum predictions, you must argue that a rational agent *should* care about the Sum of utility weighted by amplitude squared, not the Count of copies.
      *   **The Ill-Defined Count:** The "Preferred Basis Problem."
  *   **Closing:** "The physics doesn't tell you how to count. The physics gives you the amplitudes. You have to bring the probability in via a rule about how much you care about your copies."

  ---

  ### **3. Predictable Failure Modes (And Fixes)**

  1.  **Failure:** Students treat the envelopes as classical ignorance ("I don't know which one I got").
      *   **Fix:** Interrupt immediately. "Stop. In this game, *every* envelope is opened. *Every* copy exists. You are not guessing which one is real; you are deciding how to value the set of all of them."
  2.  **Failure:** The "Coarse-Graining" round (Round 3) feels like a trick/rigging.
      *   **Fix:** Acknowledge it. "It feels like a trick because in classical physics, objects have definite counts. In QM, 'count' is not an observable. That is the point."
  3.  **Failure:** The Payoff Debate stalls because they say "It doesn't matter, I'm dead after."
      *   **Fix:** Remind them of the "Pre-Split Agent" perspective. "The You sitting here *now* cares about the You's in 5 minutes. How does the Now-You value the Future-Yous?"
  4.  **Failure:** Running out of time during the Payoff Debate.
      *   **Fix:** Cut the Repeated Trials (Round 5) if the Payoff Debate is hot. The Payoff Debate is the core; Typicality is secondary.

  ---

  ### **4. Limitations (What the Game Cannot Do)**

  Be frank with them in the last 5 minutes. This game has three blind spots you must supply via lecture:

  1.  **Interference (Merging):** The game simulates branching (decoherence), but not merging (interference). In real MWI, branches can interfere if they haven't fully decohered. The game treats branches as classical distinct worlds too early.
      *   *Supply:* "In real QM, the 'cards' can cancel each other out before they become distinct worlds. That's why amplitude is a complex number, not just a count."
  2.  **Continuity:** The game uses discrete cards (1, 9, 10). Amplitudes are continuous.
      *   *Supply:* "You can't make 1.45 copies. The 'measure' is continuous, which is why counting integers always fails."
  3.  **The Normativity Gap:** The game shows *that* they argue about utility, but not *why* one answer is physically correct.
      *   *Supply:** "Physics usually tells us what *is*. Here, we are asking what we *ought* to care about. That's why this is still philosophy as much as physics."

  ### **5. Instructor Cheat-Sheet for the "Born Rule" Reveal**

  When you finally say the words **Born Rule**, map them directly to the whiteboard:
  *   **Counting Cards** $\rightarrow$ **Naive Branch Counting** (Fails).
  *   **Number of Slips** $\rightarrow$ **Amplitude Squared ($|\psi|^2$)** (The Measure).
  *   **Sum of Payoffs** $\rightarrow$ **Expectation Value** ($\langle \psi | \hat{O} | \psi \rangle$).
  *   **The Debate** $\rightarrow$ **Decision-Theoretic Derivation** (Deutsch/Wallace/Greaves).

  This structure ensures they feel the problem in their bones (and their chocolate cravings) before you give them the vocabulary to name it.
