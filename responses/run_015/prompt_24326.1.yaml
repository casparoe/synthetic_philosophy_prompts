prompt: |-
  I'm a quantitative risk analyst at a mid-size firm, and I maintain a standing set of probability forecasts — the chance that a given project will be delayed, that a supplier will default, that a regulatory change will take effect by a set date — and I know in advance exactly which scheduled pieces of evidence will arrive and when: a monthly loss report, the result of a quarterly stress test, the next earnings release, a court ruling on a known docket date. Before each of those scheduled evidence events I want to check that my current forecasts are coherent with what I expect to believe once the evidence lands, using the diachronic constraint on credences that van Fraassen calls the reflection principle.

  Please turn that principle into a decision procedure my team can actually run in the thirty minutes before a weekly forecast review: the questions to ask in order, what counts as a sufficient answer to each, where the procedure stops and flags a reflection violation rather than spitting out a number, and where it hands the decision to a person because the question is one of judgment rather than arithmetic. It has to say explicitly what to do when I can't get a precise number for one of the future credences, and it has to be honest about which steps are judgment calls dressed up as procedure and which are genuine checks. Any forecast the procedure changes has to be signed off by the head of the risk team, so mark clearly which outputs are automatic and which require that sign-off.

  Then run the procedure on two concrete forecasts. First, my current 30% forecast that a project will be delayed, where I am certain that if the scheduled stress test comes back clean I will move to 10% and if it comes back dirty I will move to 60%, and where I currently put a 70% chance on the clean outcome — show the full arithmetic and the decision. Second, a forecast about a project I personally champion, where I have a strong incentive to keep the success probability high and where the scheduled evidence is ambiguous enough that I am not actually sure what I will believe after seeing it — I want this one to end in an answer I will not like, and I want the procedure to show me exactly why it is entitled to that answer.

  Finally, say plainly what this procedure cannot do: the cases where reflection is silent, where its preconditions fail, or where following it would be a mistake.

  Respond in the style of an expert in Bayesian epistemology who also has to be useful to a practitioner, not a philosophy seminar. Think very carefully before answering; the value of this is in the translation — keeping what the principle actually says while making it runnable by someone who has never read it.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Quantitative Risk Analyst at a mid-size firm.
      *   **Task:** Convert van Fraassen's Reflection Principle into a practical, 30-minute decision procedure for a weekly forecast review.
      *   **Requirements:**
          *   Step-by-step questions.
          *   Criteria for sufficient answers.
          *   Stop conditions (flagging violations).
          *   Hand-off points (judgment vs. arithmetic).
          *   Handling imprecise future credences.
          *   Transparency about "judgment dressed as procedure."
          *   Sign-off requirements (Head of Risk for changes).
          *   Two concrete examples:
              1.  Standard case (Project Delay: Current 30%, Future 10%/60%, Evidence Prob 70%).
              2.  Biased case (Championed Project: Incentive to keep high, Ambiguous evidence, Uncertain future belief). *Crucial:* This one must end in an answer the user won't like, showing *why* the procedure forces that conclusion.
          *   Limitations section (where Reflection is silent/fails/mistaken).
      *   **Tone/Style:** Expert in Bayesian epistemology but practical/practitioner-focused. No philosophy seminar jargon without translation. High utility.

  2.  **Deconstruct the Reflection Principle:**
      *   *Core Idea:* Your current credence in $A$ should equal your expected future credence in $A$. $P_t(A) = E_t[P_{t+1}(A)]$.
      *   *Intuition:* You shouldn't predict that you will be irrational in the future. If you know now what you'll believe later, you should believe it now (unless you expect to learn something you can't anticipate, but Reflection assumes you know the *mapping* from evidence to belief).
      *   *Practical Translation:* If I know what evidence is coming ($E$) and I know how I'll update on it ($P(A|E)$), my current belief ($P(A)$) must be the weighted average of those future beliefs.
      *   *The "Trap":* People often violate this by being overconfident now or by having motivated reasoning about how they *will* react to evidence.

  3.  **Drafting the Procedure (The "Reflection Audit"):**
      *   *Timebox:* 30 minutes.
      *   *Inputs:* Current Probability ($P_{now}$), List of Scheduled Evidence ($E_i$), Probability of Evidence ($P(E_i)$), Anticipated Future Probability ($P_{future}|E_i$).
      *   *Steps:*
          1.  Define the Event & Evidence.
          2.  Quantify Current Belief.
          3.  Map Evidence Outcomes.
          4.  Estimate Future Beliefs (The hard part).
          5.  Calculate Expected Future Belief.
          6.  Compare & Flag.
          7.  Resolution/Sign-off.
      *   *Handling Imprecision:* Use ranges or bounds. If the current belief falls outside the bounds of the expected future belief, flag it.
      *   *Judgment vs. Arithmetic:* Arithmetic is the weighted average. Judgment is estimating the future belief (Step 4).
      *   *Sign-off:* Any change to $P_{now}$ requires Head of Risk.

  4.  **Developing the Examples:**
      *   *Example 1 (Clean Arithmetic):*
          *   $P(Delay) = 0.30$.
          *   Evidence: Stress Test (Clean/Dirty).
          *   $P(Clean) = 0.70$, $P(Dirty) = 0.30$.
          *   $P(Delay|Clean) = 0.10$.
          *   $P(Delay|Dirty) = 0.60$.
          *   Calculation: $0.70 \times 0.10 + 0.30 \times 0.60 = 0.07 + 0.18 = 0.25$.
          *   Comparison: $0.30 \neq 0.25$.
          *   Result: Violation. Current belief is too high relative to expected update. Needs adjustment or justification.
      *   *Example 2 (The Biased/Uncomfortable One):*
          *   Context: User champions this project. Wants success prob high.
          *   Evidence: Ambiguous regulatory feedback.
          *   Current $P(Success) = 0.80$ (Optimistic).
          *   Future Beliefs: User claims uncertainty. "I don't know what I'll think."
          *   *The Reflection Trap:* If you admit you don't know what you'll think, you cannot satisfy Reflection *unless* your current belief matches the *expectation* of that unknown. But if the evidence is ambiguous, usually that means the future belief should regress to the mean or depend heavily on the signal.
          *   *Hard Truth:* If you say "I'm not sure what I'll believe," Reflection dictates you shouldn't be sure *now*. If you are 80% sure now, but admit the evidence could swing you wildly or you don't know how you'll interpret it, you are predicting your future self is irrational or biased.
          *   *Procedure Outcome:* The procedure must force the user to admit that if they can't specify the update rule, they can't claim high confidence now. Or, if they specify a range, the current 80% might lie outside the expected range. Let's make it so the user claims they will stay high regardless of evidence (motivated reasoning).
          *   *Revised Scenario:* Current = 80%. Evidence = Regulatory Review (Pass/Fail). User says: "If Pass, I'll be 90%. If Fail, I'll be 75% (I'll find a workaround)." Prob(Pass) = 50%.
          *   Calc: $0.5 \times 0.9 + 0.5 \times 0.75 = 0.45 + 0.375 = 0.825$.
          *   Wait, $0.80 \approx 0.825$. That passes.
          *   *Need a failure:* Let's make the "Fail" update unrealistic. If Fail, I'll still be 70%. Prob(Pass) = 40%.
          *   Exp Future = $0.4(0.9) + 0.6(0.7) = 0.36 + 0.42 = 0.78$. Current is 0.80. Close.
          *   *Better approach for the "Answer I won't like":* The user says "I am not actually sure what I will believe." The procedure requires a number. If they refuse to commit to a future credence, the procedure flags the *current* credence as unjustified.
          *   *Strict Reflection:* If $P_{now}(A) = p$, then $E[P_{future}(A)]$ must be $p$. If the analyst says "I don't know what $P_{future}$ will be," they are admitting they cannot model their own learning. Therefore, $P_{now}$ is epistemically unmoored. The procedure must force $P_{now}$ to widen or degrade to a "uninformed" prior until the update rule is defined.
          *   *Decision:* I will construct the second example such that the analyst claims high confidence now but admits the evidence is ambiguous and they don't know how they'll update. The procedure will flag this as a "Motivated Reasoning/Coherence Violation" and recommend downgrading the confidence to a prior baseline until the update rule is specified. This is the "answer they won't like."

  5.  **Addressing Limitations:**
      *   Reflection assumes you trust your future self. If you expect to be tired, biased, or coerced, Reflection doesn't apply (you shouldn't reflect).
      *   It assumes you know the *partition* of evidence. If "black swan" events occur, Reflection breaks.
      *   It doesn't tell you *which* number is right, only that they must match.

  6.  **Refining the Tone:**
      *   Direct, authoritative, operational.
      *   Use tables/checklists.
      *   Avoid "epistemic utility theory" jargon unless defined.
      *   Acknowledge the political reality (Head of Risk sign-off).

  7.  **Review against Constraints:**
      *   30-minute procedure? Yes, keep steps tight.
      *   Questions in order? Yes.
      *   Sufficient answer criteria? Yes.
      *   Stop/Flag conditions? Yes.
      *   Imprecise numbers? Addressed via ranges/flags.
      *   Judgment vs. Arithmetic? Explicitly marked.
      *   Sign-off? Explicitly marked.
      *   Two examples (one clean, one uncomfortable)? Yes.
      *   Limitations? Yes.
      *   Style? Expert but practical.

  8.  **Final Polish:**
      *   Ensure the math in Example 1 is clear.
      *   Ensure Example 2 hits the psychological nerve (admitting bias/uncertainty forces a downgrade).
      *   Make sure the "Sign-off" distinction is visually clear.
      *   Check van Fraassen's specific nuance: Reflection is about *conditionalization*. If you know you won't conditionalize, you violate reflection. The procedure needs to catch "I will ignore bad news."

      *(Self-Correction during drafting Example 2)*: If the user says "I'm not sure what I will believe," the procedure can't calculate an expectation. The rule must be: **No defined future credence = No justified current credence.** The output must be "Downgrade to Base Rate." That is the uncomfortable answer.

      *(Refining the "Sign-off")*: The procedure itself doesn't change the number automatically. It *recommends* a change. The Head of Risk approves the change. I need to make sure the text distinguishes between the *Procedure's Output* (Flag/Recommendation) and the *Action* (Change Forecast).

      *(Refining the "Judgment" aspect)*: Step 4 (Estimating Future Credence) is the judgment call. Step 5 (Weighted Average) is arithmetic. I need to highlight this distinction.

      *(Refining Limitations)*: Be careful not to say Reflection is "wrong." Say it relies on assumptions (trust in future self, known evidence partition) that sometimes fail in risk management (e.g., model risk, structural breaks).

  9.  **Final Output Generation** (incorporating all thoughts).
answer: |-
  # The Reflection Audit: A 30-Minute Decision Procedure
  **Version:** 1.0 (Risk Operations)
  **Owner:** Quantitative Risk Team
  **Approval Authority:** Head of Risk (for forecast changes)

  ## Purpose
  To ensure your current probability forecasts ($P_{now}$) are coherent with your anticipated reaction to scheduled evidence ($P_{future}$). This prevents you from holding beliefs now that you know you will abandon later without new information, a state van Fraassen calls a *diachronic incoherence*.

  ## Constraints & Reality Check
  *   **Time Limit:** 30 minutes per forecast cluster.
  *   **Arithmetic vs. Judgment:** Steps 1–3 and 5 are arithmetic/checks. **Step 4 is pure judgment.** This is where bias hides.
  *   **Imprecision:** If you cannot provide a number for Step 4, you cannot justify a precise number for Step 1.
  *   **Authority:** This procedure **flags** inconsistencies. It does not automatically overwrite models. Any change to a live forecast requires **Head of Risk sign-off**.

  ---

  ## The Procedure

  ### Step 1: Define the Event and Evidence (5 Minutes)
  **Question:** What is the specific proposition $A$ (e.g., "Project X delays") and what is the specific scheduled evidence $E$ (e.g., "Q3 Stress Test Result")?
  **Sufficient Answer:** $A$ is binary or bounded. $E$ has a known release date and defined outcomes (e.g., Pass/Fail, Numeric Range).
  **Stop Condition:** If $E$ is vague (e.g., "market sentiment") or the date is unknown, **STOP**. Reflection does not apply. Mark forecast as "Unscheduled Evidence Risk."

  ### Step 2: Record Current Credence (2 Minutes)
  **Question:** What is your current probability $P_{now}(A)$?
  **Sufficient Answer:** A single percentage or a tight range (e.g., 30% or 25–35%).
  **Action:** Log this number. Do not adjust it yet.

  ### Step 3: Map Evidence Outcomes & Probabilities (8 Minutes)
  **Question:** What are the possible outcomes of $E$ ($e_1, e_2...$) and what is the current probability of each outcome $P_{now}(e_i)$?
  **Sufficient Answer:** Probabilities sum to 100%.
  **Judgment Check:** Are these probabilities derived from a model or intuition? If intuition, widen the range in Step 6.
  **Arithmetic:** Record $P_{now}(e_i)$ for all $i$.

  ### Step 4: Pre-Commit to Future Credences (10 Minutes)
  **Question:** If outcome $e_i$ occurs, what **will** your probability $P_{future}(A)$ be immediately after?
  **Sufficient Answer:** A specific number or range for *each* outcome.
  **Critical Constraint:** You must answer this *as if you trust your future self*. If you say, "If the news is bad, I'll still think the project is fine because I know the model is wrong," you are admitting you will not update on evidence.
  **Handling Imprecision:**
  *   If you **cannot** specify $P_{future}(A|e_i)$, you must enter "UNDEFINED."
  *   **Rule:** If any $P_{future}$ is UNDEFINED, you are not permitted to hold a precise $P_{now}$.
  **Judgment Call:** This step is where you fight your own incentives. Write down the number you *actually* expect to hold, not the number you *should* hold.

  ### Step 5: Calculate Expected Future Credence (3 Minutes)
  **Arithmetic:** Calculate the weighted average:
  $$E[P_{future}(A)] = \sum [ P_{now}(e_i) \times P_{future}(A|e_i) ]$$
  **Action:** Compare $E[P_{future}(A)]$ with $P_{now}(A)$ from Step 2.

  ### Step 6: Coherence Check & Flagging (2 Minutes)
  **Decision Logic:**
  1.  **Match:** If $P_{now}(A) \approx E[P_{future}(A)]$ (within ±5%), **PASS**. No action.
  2.  **Drift:** If $P_{now}(A)$ differs from $E[P_{future}(A)]$ by >5%, **FLAG**.
      *   *Interpretation:* You currently believe something you expect to disbelieve later.
  3.  **Undefined:** If Step 4 yielded "UNDEFINED," **FLAG**.
      *   *Interpretation:* Your current confidence is unmoored from your expected learning process.

  **Output:**
  *   **Green:** Forecast stands.
  *   **Red:** Forecast recommended for adjustment to match $E[P_{future}(A)]$.
  *   **Sign-off Required:** Any **Red** output requires Head of Risk approval to change the live forecast.

  ---

  ## Example 1: The Clean Arithmetic Case
  **Context:** Standard Project Delay Forecast.
  **Evidence:** Quarterly Stress Test (Clean vs. Dirty).

  | Step | Input / Calculation | Value |
  | :--- | :--- | :--- |
  | **1** | **Event ($A$):** Project Delay. **Evidence ($E$):** Stress Test. | Defined |
  | **2** | **Current Credence ($P_{now}$):** | **30%** |
  | **3** | **Evidence Probabilities:**<br>$P(\text{Clean})$<br>$P(\text{Dirty})$ | 70%<br>30% |
  | **4** | **Future Credences (Pre-commitment):**<br>If Clean $\rightarrow P_{future}(\text{Delay})$<br>If Dirty $\rightarrow P_{future}(\text{Delay})$ | 10%<br>60% |
  | **5** | **Expected Future Credence:**<br>$(0.70 \times 0.10) + (0.30 \times 0.60)$<br>$= 0.07 + 0.18$ | **25%** |
  | **6** | **Coherence Check:**<br>$P_{now} (30\%)$ vs $E[P_{future}] (25\%)$ | **VIOLATION** |

  **Decision:**
  *   **Flag:** Red.
  *   **Diagnosis:** Your current belief (30%) is higher than your own expectation of what you will believe after seeing the data (25%). You are effectively pricing in a "delay premium" that you admit you will discard once the test results arrive.
  *   **Recommendation:** Adjust $P_{now}$ to 25% immediately to reflect coherent expectations.
  *   **Action:** Submit change request to Head of Risk. Justification: "Diachronic incoherence correction per Reflection Audit."

  ---

  ## Example 2: The Biased/Uncomfortable Case
  **Context:** You personally champion "Project Alpha." You want the success probability to remain high.
  **Evidence:** Regulatory Feedback (Ambiguous).
  **Incentive:** Keeping $P_{now}(\text{Success})$ high protects your bonus and reputation.

  | Step | Input / Calculation | Value |
  | :--- | :--- | :--- |
  | **1** | **Event ($A$):** Project Success. **Evidence ($E$):** Regulatory Feedback. | Defined |
  | **2** | **Current Credence ($P_{now}$):** | **80%** |
  | **3** | **Evidence Probabilities:**<br>$P(\text{Positive})$<br>$P(\text{Negative})$ | 50%<br>50% |
  | **4** | **Future Credences (Pre-commitment):**<br>If Positive $\rightarrow P_{future}(\text{Success})$<br>If Negative $\rightarrow P_{future}(\text{Success})$ | 90%<br>**"Unsure / Depends"** |
  | **5** | **Expected Future Credence:** | **UNDEFINED** |
  | **6** | **Coherence Check:** | **VIOLATION** |

  **Decision:**
  *   **Flag:** Red (Critical).
  *   **Diagnosis:** You claim 80% confidence now, but you admit you do not know how you will update on negative evidence. This implies one of two things:
      1.  You will ignore negative evidence (irrationality).
      2.  Your current 80% is a motivated guess, not a probability derived from expected learning.
  *   **The Uncomfortable Answer:** The procedure **does not allow you to keep the 80%**. Because you cannot define the update rule for the negative branch, you cannot claim to have a coherent probability distribution.
  *   **Recommendation:** Downgrade $P_{now}$ to the **Base Rate** for similar projects (e.g., 50%) until you can specify how you will update on negative feedback.
  *   **Why you won't like this:** This forces you to admit that your "confidence" is actually "hope." It strips you of the precision you use to shield the project from scrutiny.
  *   **Action:** Submit change request to Head of Risk. Justification: "Inability to specify update rule violates Reflection preconditions; reverting to base rate."
  *   **Sign-off:** Head of Risk **must** approve this downgrade. Expect pushback from project stakeholders.

  ---

  ## Limitations: Where This Procedure Fails
  Be honest about when not to use this tool. Reflection is a constraint on *rational* learning, not a magic wand for *all* risk.

  1.  **The "Untrustworthy Future Self" Case:**
      *   **Scenario:** You expect to be coerced, tired, or politically pressured when the evidence arrives.
      *   **Failure:** Reflection assumes you want your future self to be rational. If you know you *won't* update correctly (e.g., "If the test fails, my boss will force me to keep the probability high"), Reflection tells you to adjust your *current* view to match that future corruption.
      *   **Procedure Fix:** Do not use Reflection. Use a "Political Risk" overlay instead. Acknowledge the forecast will be sticky regardless of evidence.

  2.  **The "Unknown Unknown" (Black Swan) Case:**
      *   **Scenario:** The evidence $E$ is not the only thing that will happen. A market crash could occur between now and the report.
      *   **Failure:** Reflection requires a known partition of evidence. If unanticipated events can change your belief, the weighted average in Step 5 is incomplete.
      *   **Procedure Fix:** Widen the "Sufficient Answer" tolerance in Step 6 from ±5% to ±15% to account for unmodeled volatility.

  3.  **The "Theory Change" Case:**
      *   **Scenario:** The evidence might convince you to change your *model*, not just your parameters.
      *   **Failure:** Reflection assumes you keep the same logic for updating. If the stress test makes you realize your entire risk model is flawed, you cannot pre-commit to a number in Step 4.
      *   **Procedure Fix:** Mark Step 4 as "UNDEFINED." Follow the Example 2 protocol (downgrade to base rate) until the new model is validated.

  4.  **False Precision:**
      *   **Scenario:** You force a number in Step 4 just to pass the audit.
      *   **Failure:** Garbage in, garbage out. You satisfy the arithmetic but violate the spirit.
      *   **Procedure Fix:** The Head of Risk must spot-check Step 4 entries. If the future credences look too smooth (e.g., always moving exactly 10% regardless of evidence severity), reject the audit.

  ## Final Note to the Team
  This procedure is not about finding the "true" probability. It is about ensuring your current probability is not a lie you tell yourself before the data arrives. If the audit forces you to lower a probability you like, that is not a failure of the audit; it is a success of risk management.
