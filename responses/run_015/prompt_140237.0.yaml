      *   **Task:** Identify tensions between pairs of commitments, rank by severity, suggest cheapest fixes (which commitment bends + cost). Avoid vague "depends on definition" answers. Distinguish apparent vs. real inconsistencies.

  2.  **Evaluate Each Commitment & Interactions:**

      *   **(1) $\psi$-epistemic (overlapping)** vs. **(3) Ontic Realism + Bell Nonlocality:**
