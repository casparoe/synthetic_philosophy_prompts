      *   **(1) $\psi$-epistemic** vs. **(4) Bell Intuition (Local Correlations):**
          *   *Tension:* **CRITICAL.** The user says they "swallowed nonlocality" in (3) but in (4) describes a *local* hidden variable model ("nothing Alice does changes anything physical on Bob's side... correlation baked in").
          *   *Analysis:* Bell's theorem proves that *no* local hidden variable model (where $\lambda$ is the complete state at the source) can reproduce QM correlations. If $\psi$ is epistemic over $\lambda$, and $\lambda$ is local, you violate Bell. If $\lambda$ is nonlocal, then Alice's setting *does* influence the ontic state relevant to Bob (or the joint distribution depends on both settings).
          *   *Verdict:* This is the biggest contradiction. You can't have (3) "I accept nonlocality" and (4) "It's just local common cause."

      *   **(1) $\psi$-epistemic** vs. **(5) Denying Preparation Independence (PBR):**
          *   *Tension:* Low/Moderate. Denying PI is the standard escape route for $\psi$-epistemicists against PBR.
