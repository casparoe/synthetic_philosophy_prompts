      *   **(2) Stat-Mech Analogy** vs. **(6) Square Root Gloss:**
          *   *Tension:* Moderate. Liouville distributions are real-valued probability densities ($\rho \ge 0$). $\psi$ is complex. The "square root" gloss tries to bridge this.
