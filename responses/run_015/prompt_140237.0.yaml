      *   Address the Bohm/Spekkens conflict.

      *(Self-Correction during drafting)*: I should make sure to distinguish between "parameter dependence" and "outcome dependence" regarding Bell, but maybe that's too technical. Stick to "Local Causality." The user's description in (4) is essentially "Local Causality." Bell says Local Causality + Realism = Inequality. QM violates Inequality. So Local Causality or Realism must go. User keeps Realism (3), so must drop Local Causality. But (4) asserts Local Causality. That's the contradiction.

