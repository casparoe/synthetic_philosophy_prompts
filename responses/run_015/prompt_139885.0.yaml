answer: |-
  Here is the mapping and the committed analysis you asked for. I am treating "standing" here as *moral standing to blame*, distinct from *legal authority to prosecute*. The law allows a hypocrite to convict; morality questions whether they may *condemn*.

  ### Part 1: The Mapping

  **The Parties and Their Options**

  | Party | Relation to Spitzer | Options Available (Post-Exposure) | Standing Literature Verdict: What they may do/say |
  | :--- | :--- | :--- | :--- |
  | **The Prosecuted (Clients)** | Targets of his past moral/legal blame. | **Tu Quoque:** Dismiss his past condemnation. **Demand:** Ask for clemency (not entitlement). | **May Blame Spitzer:** For unfairness (burden distribution). **May Dismiss:** His past blame misfires (Uptake failure). They are entitled to say, "Your judgment of me is tainted by your own conduct." |
  | **The Prosecuted (Traffickers)** | Targets of his past blame for exploitation. | **Deflect:** Claim Spitzer is also an exploiter. | **May Blame Spitzer:** For hypocrisy regarding *exploitation*, but weaker than clients. Spitzer bought sex; traffickers sold people. The norms differ. Standing loss is partial. |
  | **The Sex Workers** | Participants in the transaction; some victims, some agents. | **Blame:** For stigma/harm. **Forgive:** Pardon the personal betrayal. | **May Blame Spitzer:** For harm/hypocrisy. **Forgiveness:** Possible, but forgiving him does not restore his standing to blame *them* or others. Forgiveness is separate from standing. |
  | **The Voters** | Principals who elected him to enforce norms. | **Resign:** Demand he quit. **Punish:** Vote him out (if eligible). | **May Blame Spitzer:** For deception and breach of fiduciary trust. Their standing is robust because the hypocrisy undermines the *office's* integrity, not just personal morality. |
  | **The Press** | Intermediaries/Watchdogs. | **Expose:** Reveal facts. **Commentate:** Frame the narrative. | **May Blame Spitzer:** As representatives of the public. They have derivative standing from the voters. |
  | **The Staff** | Subordinates enforcing his directives. | **Resign:** In protest. **Stonewall:** Protect the office. | **May Blame Spitzer:** For putting them in a position of enforcing norms he flouted. They suffer "dirty hands" by association. |

  **The Crucial Distinction:** The *Prosecuted* can dismiss Spitzer's *moral* blame, but they cannot void their *legal* conviction based on his hypocrisy alone. The *Voters* can remove him from office because his hypocrisy destroys the *political* standing required to govern.

  ---

  ### Part 2: Disambiguating "Lost Standing"

  You identified four jobs the concept is doing. Here is the verdict on which one carries the weight in the Spitzer case.

  1.  **The Uptake/Role One:** *Verdict: **Secondary.***
      *   This explains why the *prosecuted clients* can roll their eyes. They can treat his condemnation as a "misfire." But this doesn't explain why the *voters* (who weren't blamed by him) are entitled to oust him.
  2.  **The Fairness One:** *Verdict: **Primary.***
      *   This is the heavy lifter. Spitzer imposed a burden (criminalization/stigma) on others that he evaded for himself. The complaint from the public and the prosecuted is fundamentally about the unfair distribution of moral criticism and legal risk. He claimed a privilege (enforcer) while denying the constraint (obedience).
  3.  **The Sincerity One:** *Verdict: **Tertiary.***
      *   This suggests he was "faking" belief in the norm. It's possible he genuinely believed prostitution should be illegal while doing it (weakness of will vs. rejection of norm). If he believed the law was good but broke it, sincerity is intact, but fairness is still violated. Sincerity doesn't do the necessary work here.
  4.  **The Epistemic-Discount One:** *Verdict: **Negligible.***
      *   His judgment on whether prostitution is harmful or illegal wasn't compromised by his participation. He knew exactly what he was doing. The epistemic account fails because his hypocrisy didn't cloud his *knowledge* of the wrong, only his *permission* to judge it.

  **Conclusion:** The Spitzer case is primarily a **Fairness** case, with **Uptake** consequences for the specific targets of his blame.

  ---

  ### Part 3: The Hard Bits (Commitments)

  Here I am committing to specific theoretical positions. Where the literature is silent, I will flag it.

  #### 1. Domain: Does the standing loss leak?
  **Verdict: Standing is Norm-Specific, but Role-Contagious.**

  *   **Moral Standing:** Spitzer loses standing to blame others for *sexual misconduct* or *deception regarding sexual conduct*. He does **not** lose moral standing to blame Wall Street for fraud. If he had given a speech in 2007 about corporate fraud, the *moral content* of that blame remains intact. He didn't commit fraud.
  *   **Political/Role Standing:** However, standing leaks through the *office*. The office of Governor/AG requires a general warrant of trustworthiness. While he retains standing to blame fraudsters *morally*, he loses the *authority* to hold that office because the hypocrisy indicates a character defect relevant to *all* law enforcement (general disregard for the law).
  *   **Commitment:** The loss of standing is local to the norm violated (prostitution/deception), but the loss of *fitness for office* is global. Do not conflate the two. You can be a hypocrite about sex but a valid critic of fraud; you cannot be a hypocrite about sex and remain the Chief Law Enforcement Officer.

  #### 2. Timing: Retrospective vs. Contemporaneous
  **Verdict: Standing is Fact-Relative, not Knowledge-Relative.**

  *   **The Scenario:** Assume Spitzer was buying sex *while* prosecuting in 2004 (concurrent hypocrisy), even if discovered in 2008.
  *   **Commitment:** He lacked standing *at the time* (2004), even if no one knew. Standing is a normative fact, not an epistemic state. The unfairness existed in 2004.
  *   **The Consequence:** The people he convicted in 2004 have a valid moral complaint *now* about the proceedings *then*. They were blamed by someone who lacked the standing to blame them.
  *   **Target Nuance:**
      *   **Clients:** Strongest complaint. Same norm violation.
      *   **Traffickers:** Weaker complaint. Trafficking involves coercion/exploitation; Spitzer's act (consensual purchase) is normatively distinct. His standing to blame *exploitation* remains mostly intact even if his standing to blame *purchase* is gone.
      *   **Victims:** No standing loss. He did not blame the victims; he blamed the exploiters.
  *   **Undecidable Flag:** Whether this grants the convicted a *legal* right to appeal. Moral standing loss does not automatically translate to procedural legal error in current jurisprudence. Theory says they were wronged; Law says the conviction stands.

  #### 3. Official versus Private: The State's Standing
  **Verdict: The State's Standing Floats Free, but is Tainted by Representation.**

  *   **Commitment:** The *State* does not have moral standing; only agents do. However, the State has *legal authority*. Spitzer's hypocrisy damages the *moral expression* of the prosecution, not the *legal validity*.
  *   **The Judge Analogy:** A hypocritical judge (e.g., a speeder sentencing speeding) retains the *authority* to sentence (the sentence is valid) but loses the *moral standing* to lecture the defendant.
  *   **The Spitzer Distinction:** As AG/Governor, he was not just a judge; he was the *symbol* of the law. When the symbol breaks the law, the *State's* moral credibility is damaged, even if its legal power remains.
  *   **Verdict:** The State's standing to punish is legally robust but morally weakened. The "pen" is held by the man; if the man is a hypocrite, the State's moral voice stutters.

  #### 4. The Fix: Willingness to Submit
  **Verdict: Willingness Restores Fairness, Not Uptake.**

  *   **Commitment:** If Spitzer had said, "I broke this law, I accept the same penalty I sought for others," he would restore his **Fairness** standing. He is no longer exempting himself from the burden.
  *   **Limitation:** This does not fully restore **Uptake** standing immediately. The target of blame is still entitled to say, "You only accepted the penalty *after* being caught." The *sincerity* of the commitment is suspect.
  *   **Restoration:** Standing is restored over time through consistent submission to the norm, not just a one-off offer of punishment. Willingness to submit is a *necessary* condition for restoring standing, not a *sufficient* one.

  #### 5. The Normative Premise: "What if buying sex isn't wrong?"
  **Verdict: The Case Shifts from Hypocrisy to Injustice, but Standing Remains Relevant.**

  *   **Commitment:** If buying sex is not morally wrong, Spitzer's hypocrisy regarding the *moral* norm vanishes (you can't be a moral hypocrite about a non-moral rule). However, he was enforcing a *legal* norm.
  *   **The Pivot:** The charge becomes: "You enforced a law you broke." This is still a fairness issue (unequal application of the law), even if the law is unjust.
  *   **Collapse?** The example does not collapse. It shifts from "Moral Hypocrisy" to "Rule of Law Hypocrisy." He lacks standing to blame others for *law-breaking* if he is a law-breaker himself, regardless of the law's moral merit.
  *   **Stronger Claim:** If the law is unjust, he lacks standing to enforce it *at all*, hypocrisy or not. But assuming the law is valid for the sake of the argument, the hypocrisy stands as a violation of the "Equal Application" norm.

  ### Final Summary Verdict

  **Did Spitzer lack standing?**
  **Yes.**

  **In which sense?**
  Primarily the **Fairness** sense (imposing burdens he evaded). Secondarily the **Uptake** sense (targets can dismiss his moral address).

  **Which account of standing does the case support?**
  It supports a **Norm-Specific, Fact-Relative Fairness Account.**
  1.  **Norm-Specific:** He didn't lose standing to talk about fraud, only sex/law-breaking.
  2.  **Fact-Relative:** He lacked standing in 2004 even if no one knew, because the unfairness was real.
  3.  **Fairness:** The core wrong was the unequal distribution of the burden of compliance.

  **Where the theory goes silent:**
  The theory cannot tell us whether the *legal convictions* of the men he prosecuted should be overturned. Moral standing loss explains why Spitzer was a hypocrite and why he had to resign; it does not necessarily provide a legal remedy for those he prosecuted. That gap between *moral standing* and *legal validity* is where the armchair theory must stop and the law takes over.
