answer: |-
  Your friend is right that Sen's Liberal Paradox exposes a deep tension, but he is likely wrong that it proves a private sphere is incoherent. The paradox works only if we assume society is trying to do one specific thing: aggregate everyone's preferences into a single, consistent ranking of social states. Real legal institutions do not do that. They do not try to produce a social welfare function that ranks every possible state of the world. Instead, they set up jurisdictional boundaries. When the law says you have the right to refuse a blood transfusion, it is not saying that your preference outranks everyone else's in a global vote. It is saying that for this specific decision, the social aggregation mechanism is turned off. You are the sovereign. This is why the cycle doesn't bite in practice. The paradox assumes rights are decisive votes within a larger calculation, but the practice treats rights as side constraints that remove certain options from the calculation entirely. The guy at the bar who suggested modeling rights as control over a menu of options is onto something real. If your right is defined as the power to determine which options are available to you, rather than determining the final social outcome regardless of others, the logical contradiction dissolves. It moves the paradox from a logical impossibility to a manageable boundary dispute. The cost of this fix is that we admit rights are not about maximizing satisfaction of preferences, but about protecting a zone of non-interference. That is a theoretical commitment, not a mathematical necessity, but it saves the system from incoherence.

  This leads directly to your second point about other people's preferences. The practice does not exclude external preferences entirely, or else we wouldn't have public nuisance laws or zoning regulations. The coherent version of the rule is not that other people's preferences count for zero, but that they are discounted based on the nature of the interest. If your neighbor hates your blue house because it clashes with his aesthetic, that preference is discounted heavily. If he hates it because your peeling paint is lowering his property value, it counts more. The system presupposes a distinction between harm and mere offense, though where that line is drawn is often a messy judgment call. The cycle is avoided because the aggregation rule is lexical: rights-based constraints are checked first, and only within the permitted set do we look at aggregate welfare or preferences. This explains why your friend's claim that the system is just paternalism with a fig leaf is too cynical, even if the line is blurry. When the state bans you from selling yourself into slavery, it isn't weighing your preference to be a slave against your neighbor's preference that you be free. It is ruling that the transaction itself is void because it destroys the agency required to have preferences in the future. The system is committed to the idea that there are some goods, like basic agency, that cannot be traded away even if the preference ranking says so.

  That brings us to the irreversibility issue, which is the hardest part of your puzzle. You asked why you can refuse a transfusion and die, but you cannot consent to be killed, even though the outcome is the same. The philosophical commitment here is not about the outcome for you, but about the social practice of killing. The law distinguishes between letting nature take its course and introducing a new causal agent. If a doctor kills you, the doctor becomes a killer, and that changes the normative landscape for everyone. It creates a permission structure that could be abused. But the deeper commitment regarding the alienation of rights, like the ban on slavery contracts, presupposes a diachronic view of the person. It treats you not as a series of time-slices where the current slice can do whatever it wants, but as a continuing project. If the current you sells the future you into slavery, the future you ceases to be an agent and becomes a thing. The law is guarding the capacity for autonomy over time, not just the exercise of autonomy in the moment. This is distinct from plain paternalism. Plain paternalism says, You should not smoke because it is bad for you. Structural autonomy says, You may smoke, but you may not sign a contract binding yourself to smoke forever, because that destroys your future capacity to choose. Telling the difference requires looking at whether the restriction preserves the possibility of future choice. Banning slavery preserves it; banning smoking merely restricts a specific choice. The rule of thumb the law uses is roughly: actions that permanently extinguish the possibility of consent are voidable. This is a theoretical commitment to the persistence of the self, though the application is often inconsistent, as seen in how we treat military enlistment or marriage, which are binding but not quite slavery.

  Your friend's suggestion about the veil of ignorance is a strong test for this. If you didn't know which personal issue would turn out to be yours, would you agree to this pattern of rights? Likely yes, but with some adjustments. Behind a veil, you would be terrified of ending up in a position where you could be coerced or enslaved, so you would insure against the alienation of your future decisiveness. That supports the no-slavery rule. However, the veil might generate a different result on assisted dying. If you don't know whether you will be the person wanting to die in agony or the doctor asked to kill, you might demand stricter fences than we currently have, or perhaps more liberal ones depending on how you weigh suffering against the risk of abuse. The veil definitely supports the irreversibility carve-out because losing the ability to choose is a catastrophic risk that a rational actor would hedge against. But the veil might not support the arbitrary distinctions we see now, like allowing you to refuse a ventilator but not helping you turn it off. A veil-based system would likely be more consistent about the principle of bodily integrity, regardless of whether the cause of death is natural or assisted, provided the safeguards against coercion are robust. So the veil generates the core protection of agency, but it would probably smooth out the jagged edges of our current homicide and consent laws.

  Finally, if we took the irreversibility idea seriously, the practice would have to change in ways that might look counterintuitive. Currently, the law often prioritizes the immediate self over the past self. If you sign an advance directive saying, If I become demented, do not feed me, but then in your demented state you open your mouth for a spoon, the doctors often feed you. They prioritize the current expression of preference over the prior competent instruction. If we truly valued the diachronic autonomy of the person, we would enforce those Ulysses contracts more strictly. We would allow you to bind your future self, provided the binding was done under conditions of high competence and with procedural safeguards like waiting periods and counsel. This would look like a system where you could sign an unbreakable contract to undergo medical treatment or even to end your life if certain conditions were met, and that contract would hold even if your later self protested. The alternative is to say that the capacity for autonomy is so fragile that it must be renewable at every moment, which effectively bans all binding long-term commitments. We already reject that extreme by enforcing marriage contracts and military enlistments, so the inconsistency is glaring. To be consistent, we would need a tiered system of consent: some decisions are revocable at will, like quitting a job, and some are binding for a term, like a mortgage or a medical directive, with the distinction based on how much the commitment threatens the core capacity for future agency.

  Honesty requires admitting that much of what we do is underdetermined by theory. The distinction between a helmet law and a smoking ban is often just a judgment call about public cost versus private liberty. The distinction between refusing a transfusion and requesting a lethal injection is partly theological, rooted in the distinction between acting and allowing, which doesn't hold up well under strict philosophical scrutiny but holds up well in social practice. The theory forces the protection of the capacity for choice over time, but it does not dictate exactly where the line is drawn between a binding commitment and a voidable one. That is a political judgment. The package of rules you described presupposes that persons are continuing agents whose capacity for choice is a public good that the state must maintain, even against their own temporary wishes. It presupposes that rights are jurisdictional boundaries, not preference weights. And it presupposes that some preferences, specifically those that eliminate the possibility of having future preferences, are invalid. None of this is tidy, and your friend is right to point out the contradictions. But the contradictions arise because the system is trying to balance two different theories: one that respects the sovereign choice of the present self, and one that protects the integrity of the continuing self. We pretend they are the same theory, but they are not, and the friction you feel is the sound of them grinding against each other.
