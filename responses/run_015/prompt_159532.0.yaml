      *   *Addressing Q4 (Veil of Ignorance):* Would the veil generate this? Probably. Behind the veil, you don't know if you'll be the one wanting to die or the one wanting to live. You'd likely insure against irreversible loss of liberty (slavery) because the downside is infinite. But would you insure against *all* irreversible choices? Maybe not. You might allow some binding commitments (marriage, military) but with escape hatches. The veil likely supports the "no slavery" rule but might be fuzzier on assisted dying. It supports the irreversibility carve-out because losing the ability to choose is worse than being forced to choose a specific option.
