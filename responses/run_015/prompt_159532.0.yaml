      *   *Addressing Q2 (External Preferences):* The practice *doesn't* exclude external preferences entirely (e.g., public health, morality laws). But it discounts them when they are purely meddlesome. The coherent version isn't "exclude all" but "exclude preferences based on status rather than consequence." If you hate me reading the book because it offends God, that counts less than if you hate it because my reading keeps you up at night. This presupposes a distinction between *harm* and *disgust*. It's a judgment call where to draw the line (e.g., seatbelts vs. smoking). The cycle is avoided because the aggregation rule isn't strict Pareto + Liberalism everywhere; it's Lexical: Rights first, then Pareto within the permitted set.
