      *   **SSA (Self-Sampling Assumption):** Reason as if you are a random observer from the set of all observers. In this context: "I am a random replica."
      *   **SIA (Self-Indication Assumption):** Reason as if you are more likely to exist in a world with more observers. In this context: "Worlds with more replicas (or more events) are more likely because I'm here observing."
      *   **Presumptuous Philosopher:** A thought experiment where SIA leads to absurdly confident predictions about the size of the universe (or number of observers) purely based on existence, ignoring empirical evidence.
      *   **Relevance to Distributed Systems:** This is essentially a reference class problem combined with Bayesian updating. The "observer" is the replica process. The "world" is the global system state.

  3.  **Map the Engineering Scenario to Probability Theory:**
      *   Let $H$ be the hypothesis about the global state (e.g., $H_1$: System Healthy, $H_2$: System Degraded).
