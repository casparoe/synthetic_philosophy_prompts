answer: |-
  **To:** Faculty Senate
  **From:** Committee on Educational Policy
  **Subject:** Recommendation Regarding 1973 Breadth Requirement
  **Date:** October 26, 2023

  **Executive Summary**
  The Committee on Educational Policy recommends suspending the 1973 breadth requirement for one entering cohort under a pre-registered study plan. We lack outcome data to classify this rule as load-bearing or vestigial. While Burkean caution advises against rash repeal, the reversibility of a temporary suspension allows us to test the rule's function without permanent loss. This approach balances respect for institutional memory with the demand for legibility, avoiding both inertial retention and untested abolition.

  **Bottom Line Recommendation**
  **Suspend for one entering cohort with a pre-registered plan for observing effects.**

  **Philosophical Framework and Contested Ground**
  We invoke Chesterton's fence not as a veto but as a heuristic. It is contested among committee members whether the Burkean presumption in favor of inherited arrangements is an epistemic claim (the founders possessed distributed experience we lack) or merely a precautionary rule under uncertainty (error costs of removal exceed error costs of retention). This memo proceeds on the precautionary view: we assume the rule *might* be load-bearing until proven otherwise, but we reject the notion that the demand to state a rule's purpose is inherently unmeetable. We further distinguish between *expressive* value (institutional self-description) and *causal* value (student outcomes). [Empirical claim unsupported by record: That the rule currently improves critical thinking or civic engagement.]

  **Application of Policy Tests**
  We applied two specific tests to the 1973 requirement. First, the **reversibility-and-legibility test**. A permanent repeal is difficult to reverse if hidden harms emerge later; a one-cohort suspension is fully reversible. This weakens the Burkean presumption significantly. Second, the **counterfactual-replacement test**. The choice is not rule-versus-no-rule, but rule-versus-what-the-senate-will-invent. [Empirical claim unsupported by record: That removing this requirement will inevitably lead to a mandatory interdisciplinary capstone.] However, given recent curricular trends, a more burdensome replacement is a credible risk. Retention avoids this friction, but suspension allows us to verify if the fear is well-founded.

  **Classification of the Rule**
  Using our taxonomy, the rule is likely **converted**: the original rationale (anti-tourism) is dead, but it now serves an unacknowledged function. It is unlikely **vestigial** (pure cost) given the emotional defense from department chairs, but neither is it clearly **load-bearing** regarding student outcomes. It may hold **expressive** value, signaling a commitment to depth over breadth. [Empirical claim unsupported by record: That students currently perceive this requirement as meaningful rather than bureaucratic.]

  **Confidence and Falsification**
  **Calibrated Confidence:** Moderate (60%).
  **Falsifying Evidence:** I would move to **Repeal** if the suspension cohort shows no decline in enrollment for small departments and no increase in student complaints about curricular incoherence. I would move to **Retain** if suspension triggers immediate budgetary crises for Humanities or Sciences divisions.

  **Strongest Argument Against This Recommendation**
  The strongest argument against suspension is that the Burkean fence principle is nearly free to invoke, unfalsifiable in practice, and ratchets toward inertia. By demanding a study for a rule that lacks data, we privilege the status quo simply because it exists. Any rule whatsoever can be defended by gesturing at purposes nobody has discovered yet. This recommendation risks validating a process where tradition blocks reform unless opponents prove a negative, effectively granting veto power to historical accident.

  **Appendix: The Enrollment Hypothesis**
  Two members noted that small departments enroll a noticeable share of seats through this requirement. [Empirical claim unsupported by record: That these seats are financially essential to departmental viability.] The honest move is to route this to the Budget Committee. If the rule functions as a subsidy, it should be weighed as such against direct funding. Hiding budgetary mechanisms inside curricular policy corrupts both educational design and fiscal planning. We recommend the Senate ask the Budget Committee to model the cost of replacing these seats with direct allocation should the requirement be permanently repealed.
