      *   *Can a purely incentive/screening justification work without desert?* Yes. If the goal is to minimize moral hazard (people staying unemployed because benefits are too comfy), sanctions and requirements act as price mechanisms. You don't need to blame the person morally; you just need to align incentives. However, the *severity* of sanctions (hardship) and the *unpaid* nature of workfare lean heavily toward desert/punishment. Pure screening could use lower benefits or taxes rather than punitive sanctions.
      *   *Do exemptions (pensioners, idle rich) show reciprocity isn't key?* This is the weak point of the reciprocity view. If reciprocity were the core, the idle rich (who benefit from state stability/infrastructure without working) should also owe labor. The fact that they don't suggests the obligation is tied specifically to *need*, not general citizenship. It implies the obligation is a *quid pro quo* for *aid*, not for *membership*. So reciprocity is key, but limited to the transfer relationship, not general social contribution.
