answer: |-
  The practice rests on a hybrid theory of obligation that merges contract, capacity, and information economics. First, the obligation does not arise from a general duty of citizenship, nor solely from the biological capacity to labor, but from the *transactional receipt of means-tested aid*. The state's claim is not that you owe society because you exist, but that you owe a specific effort because you have claimed collective resources. However, this transactional duty is activated only by the *capacity to work*. If you cannot work, the contract dissolves into pure need. Finally, the *structure* of the obligation (logging activities, tightening suitability) is driven by the problem of imperfect information. The state cannot see your intent, so it demands visible proxies (applications, placements) to sort the genuinely constrained from the voluntarily idle. The obligation is thus: a conditional contract triggered by need, activated by capacity, and operationalized through behavioral screening.

  Regarding presuppositions, a purely incentive-based justification is theoretically possible but practically unstable within this specific regime. A pure screening model would treat sanctions as price mechanisms to discourage false claims; it would not require punitive hardship measures that undermine the claimant's ability to search. The severity of sanctions and the rhetoric of compliance presuppose a desert claim: that claiming without striving is morally wrongful, not just economically inefficient. The exemptions for pensioners and the idle rich clarify this. They show that reciprocity is not a general civic duty (otherwise the rich would owe labor), but a specific *quid pro quo* for the transfer. Reciprocity is doing the work, but it is narrow: labor is owed only when money is taken. The unpaid placement is economically incoherent but behaviorally consistent. Treating it as "work" for obligations but "not-work" for wages implies the activity's value is disciplinary rather than productive. It habituates the claimant to labor discipline without distorting the wage floor. This is coherent only if the goal is behavioral modification, not economic exchange.

  If the underlying view were substituted, the practice would fracture. Under a pure incentive/screening view, placements would be paid (to maximize human capital), sanctions would be calibrated to marginal utility rather than punishment, and hardship waivers would be automatic to preserve search capacity. The suitability bar would not drop aggressively if labor demand is low, as forcing useless applications wastes screening resources. Under a pure desert view, exemptions would shrink (the idle rich would be stigmatized), benefits would be set at bare subsistence regardless of market conditions, and sanctions would be moralistic rather than administrative. Under a pure need view, conditionality would vanish entirely, replaced by unconditional grants. The current practice sits between these poles: it uses screening mechanisms with desert-like severity, justified by a transactional reciprocity that applies only to the dependent.

  \answer{Aid requires the able to demonstrate willingness to work.}
