answer: |-
  The historiography of science is perpetually haunted by the ghost of Herbert Butterfield. In coining the term "Whig history," Butterfield warned against the tendency to view the past merely as a procession of errors and insights leading inevitably to the present. For the historian of science, this creates a profound dilemma: how to evaluate past practices normatively—declaring some methods sound and others mistaken—without reducing history to a teleological march toward current truth. Conversely, if one retreats too far into context to avoid this charge, one risks collapsing into radical historicism, where past theories are rendered incommensurable with the present, and the label "error" loses its objective force. Nowhere is this tension more ethically and epistemologically charged than in the history of nineteenth-century anthropometric race science and its eventual displacement by modern population genetics.

  To navigate this dilemma, we must first distinguish two modes of retrospective judgment. The first, **teleological narration**, is the essence of Whig history. It reads past theories as defective anticipations of present knowledge. In this mode, the craniometrist is judged primarily by how closely their findings align with modern genetics; their errors are treated as blindness to a truth that was, implicitly, waiting to be found. The present outcome is treated as the predetermined aim of the scientific enterprise. The second mode, **normative retrospection**, attempts to assess past reasoning by standards available both then and now, without treating present outcomes as inevitable. This approach asks not "Did they discover what we know?" but "Did they reason well given what they could know?"

  The case of nineteenth-century craniometry serves as the crucible for this distinction. Practitioners like Samuel George Morton and Paul Broca sought to rank human populations by measuring cranial capacity, operating under the assumption that brain size correlated directly with intelligence and moral worth. A teleological narrator dismisses this as a simple pre-genetic error: they were wrong because we now know genetic variation does not map onto nineteenth-century racial typologies. This is the Whiggish trap. It renders the scientists merely clumsy ancestors, obscuring the specific social and methodological contingencies that made their work plausible. It suggests that if they had just waited for the discovery of DNA, the truth would have revealed itself.

  However, the radical historicist escape is equally untenable. This view argues that craniometry was "true" within its own paradigm. Since the concept of biological race was a constitutive element of nineteenth-century anthropology, to judge it by modern standards is an act of presentist imperialism. In this view, craniometry is merely "wrong-for-us," not objectively mistaken. This position grants internal coherence to past science but undermines our right to condemn it. If we accept that scientific truth is entirely paradigm-relative, we lose the vocabulary to assert that race science was not just different, but *harmfully* and *fundamentally* mistaken in its inference-making, regardless of the era.

  Must we, then, choose between treating craniometry as an inevitable step toward genetic science (Whiggism) or as a self-contained system immune to external judgment (historicism)? I argue that there is a principled middle position, which I will term **immanent methodological critique**. This position allows us to condemn craniometric methodology for flawed inference while explaining why competent researchers found it plausible, without relying on the teleology of genetic destiny.

  The linchpin of this middle position is the distinction between *ontological commitments* and *methodological norms*. Ontological commitments (e.g., "race is a biological essence") change over time and are often incommensurable. Methodological norms (e.g., "do not cherry-pick data," "control for confounding variables," "ensure sample representativeness"), however, possess a trans-historical validity. We can judge the craniometrists not because they lacked knowledge of genes, but because they violated epistemic norms that were available and recognized even in their own time.

  Stephen Jay Gould's reanalysis of Morton's skull data illustrates this perfectly. Gould demonstrated that Morton's measurements were subject to unconscious bias—subconsciously packing seeds tighter in skulls of populations he deemed inferior. This was not a failure to understand genetics; it was a failure of basic experimental control and data integrity. Furthermore, the inference chain from cranial capacity to intelligence to social worth was contested *at the time*. Contemporaries pointed out environmental factors affecting skull shape and the lack of correlation between head size and known genius. By focusing on these inferential breakdowns, we can assert that craniometry was objectively mistaken in its reasoning processes, not just its conclusions. We avoid Whiggism because we are not judging them for failing to be geneticists; we are judging them for failing to be rigorous empiricists by standards they purported to uphold. We avoid radical historicism because we maintain that logical consistency and data integrity are not paradigm-relative, but prerequisites for any claim to scientific knowledge.

  Does granting internal coherence to past science necessarily undermine our right to say it was objectively mistaken? No. A system can be internally coherent yet based on false premises or flawed inferences. The craniometrists had a coherent system: measure skull, rank brain, rank human. However, coherence does not guarantee validity. The middle position allows us to acknowledge that, given the evidential context of the nineteenth century (the lack of imaging technology, the prevalence of typological thinking in biology), the research program was *plausible*, even if the execution was *flawed*. Plausibility explains the participation of competent researchers; flawed inference explains the objective error. This distinction preserves the humanity of the past scientists without absolving the science of its errors.

  Finally, can any defensible form of progress-talk in historiography avoid smuggling in presentist teleology? It can, provided we redefine progress not as a linear approach toward a pre-existing Truth, but as the retrospective recognition of error-elimination. When we say population genetics "replaced" craniometry, we should not mean that genetics was the destiny of anthropology. Rather, we mean that population genetics offered a framework that solved the anomalies and methodological contradictions that craniometry could not resolve (e.g., the continuous variation of traits vs. discrete racial types). Progress is thus a local, problem-solving trajectory, not a global march. We can say science progresses in its capacity to detect and correct its own biases, a capacity that was demonstrably higher in the genetic era than the craniometric one, without claiming the genetic era was the "goal" of history.

  In conclusion, the historian of science need not choose between the Whiggish trap and the historicist escape. By anchoring normative evaluation in trans-historical methodological norms rather than ontological outcomes, we can condemn the flawed inferences of anthropometric race science without treating modern genetics as its teleological fulfillment. We can acknowledge that craniometry was a plausible research program for its time while maintaining that it was objectively mistaken in its handling of evidence and logic. This principled middle position preserves the right to judge past science as mistaken—a crucial ethical imperative when dealing with sciences of social hierarchy—while respecting the historical integrity of the actors involved. It allows us to say that the past was wrong, not because it failed to be the present, but because it failed to be good science, even by its own lights.
