answer: |-
  Good morning. It is a privilege to welcome you to this workshop on institutional moral repair. Looking around this room, I see a necessary tension. On one side, we have moral philosophers trained to dissect the conceptual foundations of responsibility, blame, and forgiveness. On the other, we have legal mediators who navigate the messy, high-stakes reality of disputes where those very concepts are put to the test. Usually, these two groups operate in parallel lanes. Philosophers worry about whether an entity *can* be responsible; mediators worry about how to settle a claim when harm has already occurred. Today, we are here to merge those lanes.

  Our guiding question for the day is deceptively simple: Can a large organization—a corporation, a university, a state agency—genuinely hold moral attitudes toward a specific person?

  In our personal lives, we understand how this works. If a colleague undermines you, you feel resentment. If a friend supports you, you feel gratitude. These are what we call reactive attitudes. They are the emotional expectations we have of one another when we assume we are all participating in a shared moral relationship. We expect a certain degree of good will. When that good will is violated, resentment is the natural response. When it is exceeded, gratitude follows.

  But what happens when the other party is not a person, but a bureaucracy?

  Consider a university that expels a student for misconduct. Is the institution expressing moral resentment toward that student, or is it merely executing an administrative function? Consider a corporation that publicly honors a whistleblower. Is that institutional gratitude, or a public relations strategy?

  Many people instinctively say that institutions cannot truly hold these attitudes. They argue that because an organization cannot feel emotions, any talk of institutional resentment or gratitude is just a metaphor. It is a figure of speech we use to describe complex systems of rules.

  I want to propose today that treating this as a metaphor is a mistake. In fact, it is a dangerous one.

  If we dismiss institutional attitudes as mere metaphors, we obscure the specific obligations that arise when an institution causes harm. If a university wrongly expels a student, and we treat the university as a mindless machine, then the repair is simply a mechanical correction: reinstate the student, fix the file. But if we acknowledge that the institution *did* take a moral stance against the student—a stance functionally equivalent to resentment—then the repair must address that stance.

  This is where the structural requirements of moral repair change.

  In interpersonal repair, when I wrong you, my apology is valid if it demonstrates genuine remorse. It relies on my internal change of heart. I must show you that I now recognize your worth and that I regret violating it. The currency of repair is psychological and relational.

  An institution, however, has no heart to change. It has no psyche to feel remorse. Therefore, an institutional apology cannot rely on the currency of personal remorse. If an institution tries to mimic a person—if a CEO stands at a podium and says "I am sorry" without changing the policies that led to the harm—the apology rings hollow. It is not just insincere; it is category error.

  For an institution, moral repair is not about feeling; it is about commitment.

  If an institution is to meaningfully apologize, it must accomplish something personal remorse cannot. It must alter the structural conditions that made the harm possible. It must bind its future self to new rules. It must redistribute resources. It must change the incentives that govern its agents. When a corporation harms a community, a check is not enough. A statement of regret is not enough. The repair must be embedded in the governance of the organization itself.

  This distinction draws a clear line around what institutions can and cannot do. They cannot offer the intimacy of personal forgiveness. They cannot promise that the individuals within them will never err again. But they can offer something persons often cannot: they can guarantee structural change. They can dismantle the machinery of harm.

  This is where your collaboration becomes vital.

  To the philosophers here: We need you to rigorously define the boundaries of this agency. We need to know when an organizational action counts as a moral stance and when it is merely operational. We need a framework that allows us to say an institution is responsible without pretending it is a human being.

  To the mediators: We need your ground truth. You know when a settlement feels like justice and when it feels like a silencer. You know when a policy change is substantive and when it is window dressing. You see the moment when a victim looks at an institution and asks, "Do you actually understand what you did?"

  If we treat institutional reactive attitudes as real, we raise the bar. We stop accepting press releases as apologies. We stop accepting fines as moral repair. We acknowledge that when an organization enters the moral community, it takes on a burden that is heavier, not lighter, than that of an individual.

  Today is not about solving every case. It is about agreeing on the terms of the conversation. We need to determine if we can speak of institutional resentment and gratitude without poetry, and if we can demand institutional repair without anthropomorphism. If we can do that, we might find a path where organizations are not just liable for damages, but accountable for the moral relationships they sustain.

  Let us begin.
