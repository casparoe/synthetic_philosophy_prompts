      *   *My Diagnosis:* The stalemate is ontological, not empirical. It's about whether "The Commons" is a *state of nature* (Hardin) or a *political constitution* (Ostrom).
      *   Hardin treats the resource system as exogenous to the social system. Ostrom treats the resource system as endogenous to the social system.
      *   The user's taxonomy guess is close but misses the deeper methodological split. It's not just that excludability is an output; it's that Hardin assumes a *closed* system of incentives, while Ostrom assumes an *open* system of communication and rule-making.
