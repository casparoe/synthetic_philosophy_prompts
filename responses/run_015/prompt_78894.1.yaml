prompt: |-
  I'm a philosopher of language, and in three weeks I'm officiating at my oldest friend's wedding — he and his fiancee know I've spent twenty years on Austin and performatives and they think it's hilarious, so the officiant is me. Sixty guests: half are academics, a few of them people who know this literature cold, and the other half are her family, including kids and a grandmother who will not sit through a lecture. What I need from you is the short set of remarks I give before the declaration that actually marries them. Take the role of a philosopher of language who also has an ear for how theory sounds out loud in a room, and think carefully before you draft; start by brainstorming for yourself what a speech of this kind is and isn't allowed to do, and where the philosophy can do real structural work without turning into a talk.

  Here's what I keep getting stuck on, and its why I'm not just writing it myself. Almost every sentence in a normal toast is a description or a prediction in disguise — you two are perfect for each other, you'll be happy — and I'd be up there asserting things I have no standing to assert. The sentences I can stand behind aren't descriptions at all; they're the other kind, the ones that do something: a promise, a blessing, a thank you, an avowal. An avowal, as I'm using it, is the first-person case that isn't a report on an inner state and so isn't true or false the way a report is — its point is that the speaker takes responsibility for something rather than describes it. So I want the whole speech leaning that way, and I want one line in it that is unmistakably an avowal and not a description.

  Austin's misfires and abuses can help if they earn their place — the act that never comes off at all (wrong words, no standing) versus the one that comes off but is hollow — I think there's a warm joke in there that the philosophers will catch and everyone else will just find charming. Dont explain the theory, dont cite anyone, no jargon in the actual speech. Give me the remarks, then a short note on the two or three places where you made a choice because of the philosophy and what you'd have written otherwise.
reasoning: |-
  Here's a thinking process that leads to the suggested remarks:

  1.  **Analyze the Request:**
      *   **User:** Philosopher of language (specializing in Austin/performatives), officiating a best friend's wedding.
      *   **Audience:** 60 guests (50% academics/specialists, 50% family/kids/grandma).
      *   **Task:** Write the short set of remarks *before* the declaration ("I now pronounce you...").
      *   **Constraints:**
          *   No jargon, no citations, no explaining theory.
          *   Must avoid descriptive/predictive assertions (e.g., "You are perfect," "You will be happy") because the speaker lacks standing/epistemic access.
          *   Must lean heavily on *performative* utterances (promises, blessings, avowals, thanks).
          *   Must include one unmistakable line that is an *avowal* (taking responsibility, not reporting an inner state).
          *   Incorporate Austin's "misfires/abuses" as a warm joke (catchable by specialists, charming to others).
          *   Tone: Warm, accessible, structurally philosophical but not lecture-like.
          *   Output: The remarks + a short note explaining the philosophical choices.

  2.  **Brainstorming & Philosophical Grounding:**
      *   *What is a wedding speech?* It's part of the ceremony. It's not just a toast; it's a speech act that helps constitute the atmosphere for the main illocutionary act (the pronouncement).
      *   *The Problem with Descriptions:* Saying "You are soulmates" is constative. It claims truth about the world. As a friend/philosopher, I can't verify that. It risks being "unhappy" (in Austin's sense) if it turns out false.
      *   *The Solution (Performatives):* Focus on what I am *doing* right now. Witnessing, promising support, blessing the union, thanking the guests.
      *   *The Avowal:* Needs to be first-person, present tense, taking responsibility. Not "I feel happy" (report), but "I stand with you" or "I promise." The prompt specifically asks for an *avowal* in the technical sense (expression of attitude/state that isn't a description of it). "I am so happy for you" is often treated as a report. "I rejoice with you" is closer. But the strongest avowal is a commitment. Let's aim for something like "I take this day as sacred" or "I pledge my support." Actually, the prompt defines avowal as "the speaker takes responsibility for something rather than describes it." A classic example is "I mean it" or "I intend." Let's try to make the *act of officiating* the avowal. "I stand here as your friend."
      *   *The Austin Joke (Misfires/Abuses):* A misfire is when the procedure is flawed (wrong person, wrong words). An abuse is when the procedure is followed but the feelings/thoughts aren't there. The joke should acknowledge the risk of the ceremony failing if we don't mean it, without using the terms "misfire" or "abuse."
      *   *Audience Balance:* The academics need to nod and smile. The grandma needs to feel included and not confused. The language must be plain English but structurally precise.

  3.  **Drafting - Section by Section:**

      *   *Opening:* Acknowledge the gathering. Avoid "We are here to celebrate" (description). Try "Let us gather" or "Thank you for coming." Let's go with gratitude.
      *   *The "Work" of Marriage:* Marriage isn't a description of love; it's a change in status. Acknowledge that words do things.
      *   *The Austin Joke:* Mention that words only work if we mean them. If I say the wrong thing, nothing happens. If I say the right thing but don't care, it's hollow.
      *   *The Avowal:* This needs to be the pivot. "I promise..." or "I vow..." But I'm not the one getting married. I am the officiant. My avowal is about my role. "I stand witness." "I take responsibility for holding this space." Let's refine the prompt's definition: "first-person case that isn't a report on an inner state." -> "I am glad" can be an avowal if treated as an expression rather than a report. But "I promise" is clearer. Let's try: "I give you my word."
      *   *The Blessing/Commitment:* Focus on the future not as a prediction ("you will be happy") but as a collective commitment ("we will support you").
      *   *The Lead-in:* Transition to the legal/ritual pronouncement.

  4.  **Refining the Draft (Iterative Process):**

      *   *Attempt 1 (Mental):* "Hi everyone. Austin said words do things. If I mess up, you aren't married. That's a misfire. I promise to do my job. You guys are great. Now kiss." -> *Too clunky, too academic.*
      *   *Attempt 2 (Mental):* "Welcome. We aren't just describing love today. We are making it. If I say the words wrong, it doesn't count. If I say them without heart, it's empty. I promise to be your friend. Let's marry them." -> *Better, but needs more warmth.*
      *   *Attempt 3 (Closer to final):* Focus on the "happiness" of the act. In Austin, a "happy" performative is a successful one. We can play on the word "happy."
      *   *The Avowal:* "I take my stand here." No, "I pledge..." The prompt says: "its point is that the speaker takes responsibility for something rather than describes it." Let's use: "I take this responsibility."
      *   *The Joke:* "There are two ways this can go wrong. I can say the wrong words, and nothing happens. Or I can say the right words, and nothing *means* anything."

      *   *Polishing for the Grandma/Kids:* Keep sentences rhythmic. Avoid "illocutionary." Use "promise," "vow," "mean."

  5.  **Finalizing the Speech:**
      *   Start with thanks (performative).
      *   Address the nature of the ceremony (words making reality).
      *   Insert the joke about "right words/wrong heart" (misfire/abuse).
      *   Insert the Avowal (I take my stand/I pledge).
      *   Address the couple (not describing them, but committing to them).
      *   Lead into the pronouncement.

  6.  **Drafting the Commentary:**
      *   Need to explain *why* I avoided descriptions.
      *   Explain the "misfire/abuse" joke location.
      *   Explain the Avowal line and how it differs from "I feel."

  7.  **Review against Constraints:**
      *   No jargon? Yes.
      *   No citations? Yes.
      *   Avowal included? Yes.
      *   Austin joke included? Yes.
      *   Tone appropriate? Yes.

      *(Self-Correction during drafting)*: Make sure the avowal is distinct. "I am happy" is often ambiguous. "I promise" is a commissive. The prompt defines avowal as "first-person case that isn't a report on an inner state." Austin often treats "I know" or "I believe" as avowals. But in a wedding context, "I witness" is strong. Let's go with "I stand witness." No, let's go with "I take this as my own." Actually, the prompt says "I want one line in it that is unmistakably an avowal." Let's make it: "I mean these words." That is an avowal of intention/meaning, not a description of a psychological state. Or "I pledge you my friendship." Let's go with "I pledge you my friendship." It's a commissive, which functions as an avowal of commitment. Wait, the prompt distinguishes avowal from promise slightly ("a promise, a blessing, a thank you, an avowal"). So I should distinguish them. An avowal is more like "I am at your side." Let's try: "I am here." Simple, but implies commitment. Better: "I take my stand with you." That expresses an attitude without describing a feeling.

      *Re-evaluating the "Avowal" definition in prompt:* "the first-person case that isn't a report on an inner state and so isn't true or false the way a report is — its point is that the speaker takes responsibility for something rather than describes it."
      Okay, so "I promise" is a commissive. "I apologize" is an expositive/bebhabitive. "I know" is an avowal.
      Let's try: "I know this love." No, that sounds descriptive.
      How about: "I own this joy." A bit poetic.
      How about: "I stand for this."
      Let's look at Austin's examples. "I argue," "I concede," "I object."
      In a wedding: "I witness."
      Let's try to make the avowal about the *speech act itself*. "I mean what I say." That is an avowal of sincerity.
      Actually, the prompt says "I want the whole speech leaning that way, and I want one line in it that is unmistakably an avowal."
      Okay, I will choose: "I take this as my own." Or "I stand with you."
      Let's go with: "I stand with you." It's not a report of location; it's a commitment of allegiance.

      *Refining the Joke:* "If I stumble on the words, the law says you aren't married. If I speak them clearly but without heart, *you* know you aren't." This captures Misfire (procedure) vs Abuse (sincerity).

      *Refining the Descriptions:* Instead of "You are kind," say "Thank you for your kindness." Instead of "You will succeed," say "We will help you succeed."

      *Final Polish:* Ensure the rhythm works for reading aloud.

  8.  **Finalizing the Commentary:**
      *   Explain the shift from constative to performative.
      *   Pinpoint the Misfire/Abuse joke.
      *   Pinpoint the Avowal.

      *(Self-Correction on the Avowal)*: The prompt says "a promise, a blessing, a thank you, an avowal." It lists them as distinct. So I should have a promise, a blessing, etc., but one specific line must be the *avowal*.
      Avowal examples: "I am in pain," "I intend to," "I believe."
      In this context: "I intend to support you" is a report of intention. "I support you" is an avowal of stance.
      Let's use: "I count this friendship as one of the true things I know." No, that's descriptive.
      How about: "I acknowledge this bond."
      Let's go with the Austinian classic: "I mean it."
      Actually, "I take responsibility for this moment."
      Let's settle on: "I stand witness." It's not describing the act of seeing; it's undertaking the role.
      Wait, "I stand witness" is a bit legalistic.
      How about: "I am with you."
      Let's try to match the prompt's specific definition: "takes responsibility for something rather than describes it."
      Line: "I take my stand here as your friend."
      Okay, I think I have enough to draft.

      *Wait, one more check on the "Misfire/Abuse" joke.*
      Misfire: The act is not achieved (wrong words, no authority).
      Abuse: The act is achieved but insincere (hollow).
      Joke: "If I fumble the law, the state says this didn't happen. If I speak the law but don't mean it, *you* know this didn't happen."
      This works for both audiences.

      *Let's write.*

      *(Final thought on the Avowal)*: I need to make sure it's distinct from a promise. A promise is about the future. An avowal is about the present stance. "I am on your side." "I count this as sacred."
      Let's go with: "I count this moment as sacred." It avows an attitude.
      Or better, sticking to the prompt's "takes responsibility": "I take responsibility for holding this space."
      Let's try: "I own this joy." A bit weird.
      How about: "I affirm this union." That's what the officiant does.
      Let's go with: "I stand by this."
      Okay, I will draft the speech now.

      *Wait, checking the "Avowal" requirement again.* "I want one line in it that is unmistakably an avowal."
      I will make it: "I mean these words." It is the quintessential avowal of sincerity without describing a psychological state of "meaningness."
