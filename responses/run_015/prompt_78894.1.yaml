answer: |-
  Friends, family, thank you for being here. Your presence is not just a backdrop; it is the ground on which we stand.

  We have gathered to do something, not just to say something. There is a difference. If I were to describe [Partner A] and [Partner B] as perfect for one another, I would be making a claim about the world that only time can judge. I will not do that. I am not here to predict your future. I am here to help build it.

  Ceremonies like this rely on words that act. But words are fragile tools. There are two ways a ceremony like this can fail. First, I could stumble over the law, skip a required phrase, or lack the authority to speak. In that case, the state says nothing has happened. Second, I could speak every word perfectly, follow every rule, and yet speak without heart. In that case, *you* know nothing has happened. The first is a mistake of procedure. The second is a hollowness of spirit. We are here to avoid both.

  So, let me be clear about my own place in this. I do not stand above you. I stand with you. **I take my stand as your friend.**

  To [Partner A] and [Partner B]: I will not promise that your life will be easy. I will promise that you will not face it alone. We, your community, pledge to hold you up when the weight is heavy and to celebrate when the light is bright.

  To the families: thank you for welcoming us. Thank you for the love that brought us to this room.

  And now, with all of us as witness, and with the full intention of my heart behind every syllable, let us make this change real.

  ***

  ### Note on Philosophical Choices

  **1. The Constative vs. Performative Shift**
  You noted the trap of the standard toast: asserting facts ("you are perfect") or predicting futures ("you will be happy") where the speaker lacks epistemic standing. I stripped the speech of descriptive constatives. Instead of saying "You are loved," which describes a state of affairs I can't verify, the speech says "Thank you for the love," which performs gratitude. Instead of "You will succeed," it says "We pledge to hold you up," which commits the audience to a future action rather than predicting the couple's trajectory. The speech treats the wedding not as a report on a relationship, but as an engine that alters the relationship's status.

  **2. The Misfire/Abuse Joke**
  The paragraph beginning "There are two ways a ceremony like this can fail" encodes Austin's distinction between *misfires* (the procedure is flawed, the act is not achieved) and *abuses* (the procedure is followed, but the requisite thoughts/feelings are absent, rendering the act hollow).
  *   *The Misfire:* "Stumble over the law... the state says nothing has happened."
  *   *The Abuse:* "Speak every word perfectly... without heart. In that case, *you* know nothing has happened."
  For the academics, this is a nod to *How to Do Things with Words* (Lecture II). For the family, it reads as a sincere reassurance that the officiant cares about both the legal and emotional weight of the moment.

  **3. The Avowal**
  The bolded line—"**I take my stand as your friend**"—is the required avowal. It is not a report on an inner feeling (e.g., "I feel loyal"), which could be true or false. It is an expression of stance that takes responsibility for that stance. In saying it, I am not describing my friendship; I am enacting it. It parallels the couple's vows but remains distinct as the officiant's commitment to the context of the marriage, rather than the marriage itself.
