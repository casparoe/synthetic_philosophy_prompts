answer: |-
  To diagnose the heterophenomenology stalemate, I brainstorm four candidate explanations:
  1.  **Verbal Equivocation:** The sides define 'consciousness' differently (access vs. phenomenal).
  2.  **Ontological Pre-commitment:** Physicalists and Dualists talking past each other.
  3.  **Data Admissibility:** Disagreement over whether private acquaintance counts as evidence.
  4.  **Text-Invariance (User's Hypothesis):** The method forces equivalence between report-matching sources (humans/zombies).

  Testing Candidate 1 against the claims: Dennett does not merely distinguish access from phenomenal consciousness; he eliminativizes the latter as incoherent. Critics insist on its reality. This is not a terminological slip but an ontological clash disguised as methodological. Verbal diagnosis fails.
  Testing Candidate 2: While ontological views differ, Dennett claims heterophenomenology is *neutral*, deriving ontology from method. Critics argue the method smuggles in physicalism. The dispute is about the *method's* neutrality, not just the outcome. Ontology is the battleground, not the cause.
  Testing Candidate 3 vs. 4: Candidate 4 (Text-Invariance) precisely captures the critics' *reductio*: if method ignores interiority, it cannot detect qualia. However, Candidate 3 (Data Admissibility) explains why defenders accept Text-Invariance. Defenders argue private acquaintance is not data until publicized (transcribed). Critics argue private acquaintance is the primary datum. Text-invariance is the logical consequence of adopting Candidate 3's strict publicism.

  **Diagnosis:** The impasse is a **Clash of Data Admissibility Criteria**. Defenders adopt a strict operationalism: a phenomenon is scientific only if intersubjectively verifiable. Critics adopt a phenomenological realism: the phenomenon (qualia) is evidential prior to verification. The accusation of "begging the question" arises because Defenders define data such that qualia cannot enter, while Critics define data such that qualia are foundational. Text-invariance is the functional proof of this exclusion, not the root cause. The root is whether first-person authority constitutes evidence or merely hypothesis. Defenders claim neutrality by bracketing truth; Critics claim this brackets the phenomenon itself.

  **Progress:** Given this diagnosis, standard empirical data cannot resolve the dispute, as each side filters data through their admissibility criterion. Progress requires one of two moves:
  1.  **Formal/Methodological:** A proof demonstrating that any science admitting private data leads to logical contradiction or predictive failure (validating the Defender's exclusion). This would show text-invariance is a necessary condition for coherence, not just physicalism.
  2.  **Meta-Methodological Pluralism:** Acknowledging that "consciousness research" splits into two distinct disciplines: one studying *reports of consciousness* (heterophenomenology) and one studying *structures of experience* (phenomenology).

  Currently, no progress is expected because both sides seek a monopoly on the term "science." Defenders view private data as unscientific; Critics view public-only data as incomplete. Until the field accepts **Methodological Dualism**—where first-person data is treated as a distinct epistemic class requiring third-person correlation rather than reduction—the stalemate will hold. The user's text-invariance condition is correct: if you reject it, you break third-person neutrality; if you accept it, you exclude qualia. The solution is not to choose one, but to formalize the bridge laws between the two epistemic domains. We need a formal topology mapping text-invariant outputs to non-invariant inputs, showing how private data constrains public theory without violating scientific closure. Without this formal bridge, the dispute remains a stable equilibrium of mutual accusation.
