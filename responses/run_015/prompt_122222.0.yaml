      **TO:** Collections Committee, Ridgely Falls Historical Society
      **FROM:** [My Name]
      **DATE:** September 24
      **SUBJECT:** Recommendation for Kettle Hill Display Labeling

      I recommend we approve Curator Marisol's functional reinterpretation but title the display "The Kettle Hill Treasury" rather than "Storeroom," with final text delivered by September 28 to meet the brochure deadline.

      This recommendation acknowledges that while the 1971 "Shrine of the Mother" label captured the community's imagination, it no longer aligns with the physical evidence Marisol has uncovered. The plaster stratigraphy, the dispersed figurine fragments, and the token ratios point decisively toward administration and storage. However, shifting the label does not require us to erase the sacred dimension that the Daughters of the Hill and many board members rightly cherish.

      The strongest argument against Marisol's "Storeroom" proposal is that it imposes a modern separation between the sacred and the secular that did not exist in the Late Bronze Age. In 1400 BC, a temple was a bank, and a bank was a temple; accounting was a ritual act. To label this space purely administrative risks stripping the objects of their cultural weight. Furthermore, accounting stamps explain the counts, but they do not explain why the tokens and figurines look like bodies. The visceral humanity of those clay forms suggests that even if this was a ledger room, the "data" being tracked involved people, kinship, or votive promises, not just grain.

      Therefore, "Treasury" is the precise term. It satisfies the archaeological data regarding value, storage, and sealing, yet it retains the connotation of sacred weight that "Storeroom" lacks. A treasury is where a community keeps what it values most, whether that is silver, grain, or divine favor. This allows us to present Marisol's findings on the token ratios and plaster layers as evidence of sophisticated economic management without denying the ritual context in which that management occurred.

      Regarding the community impact: The "Goddess of Kettle Hill" is undeniably part of Ridgely Falls' identity, regardless of the site's original function. The Daughters' monthly offerings are now part of the site's history themselves, a living tradition layered over the Bronze Age strata. We can honor this by adding a small panel noting the modern devotion the site inspires, distinct from the archaeological interpretation. This respects the donors and the festival committee without compromising the Society's scholarly integrity. We cannot spend town money asserting a 1970s hypothesis that the artifacts themselves contradict, but we also should not dismiss the genuine spiritual connection residents feel.

      We have five weeks before the brochure goes to print. If we wait until after the October 3 meeting to finalize the text, we risk launching the reopening with outdated information or no signage at all. I propose we vote on this title at the meeting and empower Marisol to draft the explanatory text based on the "Treasury" framework, emphasizing the integration of ritual and economy. This avoids the "maybe" trap the Chair identified; it does not say "maybe shrine, maybe store." It states clearly: "This was a Treasury," and explains what that meant then and what it means to us now.

      This path allows us to correct the historical record without alienating the town. It treats the artifacts with the rigor they deserve and the community with the respect they require. We can be honest about the mud and the math without losing the magic.

