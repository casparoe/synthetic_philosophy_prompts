prompt: |-
  Hi — I'm putting together a dissertation prospectus and I keep getting stuck before I start. The topic is dispositions, but my angle is applied: I care about how the special sciences and ordinary speech get away with dispositional predicates ("this compound is hepatotoxic", "this cultivar is drought-tolerant", "he's irritable", "that bylaw is unenforceable"), and I want a metaphysics of dispositions good enough to underwrite attributions like those — not one tailored to win arguments in a seminar room. So before I pick a theory, can you write me the spec: the desiderata any adequate theory of what it is for something to have a disposition has to meet for that purpose, each with the case or consideration that motivates it, and each marked as either non-negotiable or as a preference of one camp?

  I know the two stock problem cases, so give them a line each at most: the fink (the glass would lose its fragility at the instant you dropped it) and the mask (it stays fragile, but something interferes so it never breaks). The cases I actually can't get any single theory to handle together are these, and I'd like your list built partly around them: (1) the one-shot mask — packing foam that absorbs the impact but is destroyed in doing so, so the second drop does shatter it, which means any analysis that just asks what happens on the stimulus occurring will call the glass not fragile; (2) the booster, i.e. an inverse fink — a tablet that is not water-soluble in the bottle, but where contact with water itself triggers a change that makes it dissolve, so it dissolves while intuitively never having been soluble; (3) self-annealing glass — you strike it, it micro-cracks, a built-in mechanism instantly re-bonds it, and the next strike would micro-crack it again, so the interfering condition is intrinsic to the object rather than something done to it; (4) the permanently packed vase — fragile, but the packing is never coming off and nothing will ever strike it, where I want to know what a theory is even allowed to say distinguishes this from a vase that simply isn't fragile; (5) the partner problem — solubility needs a solvent and fragility needs something to be struck against, and whether the partner goes inside the stimulus or stays in the background changes what the theory predicts, with "dropped on a pillow" and "dropped on concrete" looking like a continuum rather than a masked/unmasked divide; (6) quiescent dispositions — the stabilizer, the prophylactic, the drug disposed to prevent the headache — where the manifestation is nothing happening at all; (7) second-order cases, things disposed to acquire dispositions (a vaccine, a seed that needs cold stratification before it can germinate), where whatever analysis you give has to iterate; and (8) impossible-stimulus cases, like being soluble in a solvent that no where exists or conductive at a temperature the laws never permit.

  The part I most want is the editorial judgment: which of the things people demand of a theory here are genuine requirements and which are just prejudices of a camp — non-circularity, intrinsicality, the demand that every disposition be grounded in a categorical base, the ban on quantifying over merely possible interventions or ideal conditions, the demand that dispositions make a difference to what actually happens. Then flag any pair of desiderata you suspect can't be jointly satisfied, because if the list turns out to be unsatisfiable as a whole that's the result I'd rather have now than in year three. Tell me which single requirement does the most exclusionary work. A very brief score of the three live options is fine at the end — the plain conditional analysis, the conditional analysis with a ceteris paribus or ideal-conditions clause, and the view that drops conditionals and identifies the disposition with its causal basis — but keep the weight on the criteria and the cases, since I can do the scoring myself. A table is fine if that's easier, and please say something about how a theory is supposed to cope with the fact that fragility and solubility obviously come in degrees and the manifestation verbs are vague, since I suspect that's the requirement everyone quietly ignores.
reasoning: |-
