answer: |-
  This is a strong starting point for a prospectus. You are correctly identifying that the "standard" literature often optimizes for logical neatness at the expense of scientific utility. For an applied metaphysics, the truth-conditions of the predicate matter less than its explanatory and predictive role in the special sciences.

  Below is the specification sheet you requested. It translates your eight problem cases (plus the two classics) into metaphysical desiderata, categorizes them by necessity, and offers the editorial judgment on where the tensions lie.

  ### The Spec: Desiderata for an Applied Metaphysics of Dispositions

  | # | Case / Consideration | Desideratum (What the theory must do) | Status |
  | :--- | :--- | :--- | :--- |
  | **0a** | **The Fink** (disposition lost upon stimulus) | **Stability:** The disposition must persist through the onset of the stimulus condition. | **NN** |
  | **0b** | **The Mask** (interference prevents manifestation) | **Robustness:** The disposition must persist even if manifestation is prevented by extrinsic interferers. | **NN** |
  | **1** | **One-Shot Mask** (foam absorbs, is destroyed, glass breaks next time) | **Iterative Truth:** Analysis cannot rely on a single trial; must account for dispositions that survive a failed manifestation due to sacrificial interferers. | **NN** |
  | **2** | **The Booster** (inverse fink: stimulus triggers the disposition) | **Pre-existence:** The disposition must be grounded in the object *prior* to the stimulus, even if the stimulus completes the causal chain. | **NN** |
  | **3** | **Self-Annealing** (intrinsic repair mechanism) | **Intrinsic/Extrinsic Neutrality:** The theory cannot rule out dispositions where the "masking" or "fixing" mechanism is internal to the object's design. | **NN** |
  | **4** | **Permanently Packed** (never struck, never unpacked) | **Modal Depth:** Truth of attribution cannot depend on actual history of stimulation; must support counterfactuals about removable barriers. | **NN** |
  | **5** | **The Partner Problem** (pillow vs. concrete; solvent necessity) | **Context Sensitivity:** The theory must allow the "stimulus" to include background conditions without collapsing the disposition into a relation. | **CP** |
  | **6** | **Quiescent Dispositions** (stabilizers, prophylactics) | **Negative Manifestation:** The theory must allow the *prevention* of an event to count as a manifestation (manifestation = null). | **NN** |
  | **7** | **Second-Order** (vaccines, stratified seeds) | **Recursion:** The theory must allow a disposition to have another disposition as its causal base or manifestation condition. | **NN** |
  | **8** | **Impossible Stimulus** (non-existent solvent, forbidden temps) | **Non-Vacuity:** Attributions must remain truth-apt even if the stimulus condition is nomologically or practically impossible. | **CP** |
  | **9** | **Gradability** (very fragile, slightly soluble) | **Scalar Sensitivity:** The theory must account for degrees of dispositionality, not just binary presence/absence. | **NN** |

  ***

  ### Editorial Judgment: Requirements vs. Prejudices

  You asked for the hard truths. In the seminar room, people demand **Intrinsicality** (the disposition is all about the object) and **Strict Conditionality** (if stimulus, then manifestation). For your applied purpose, these are the first things to go.

  1.  **Intrinsicality is a Camp Preference (and a dealbreaker).**
      *   *Why:* Case #5 (Partner Problem) and #3 (Self-Annealing) kill this. In materials science and biology, "fragility" or "toxicity" is often a relation between the object and its environment. A compound is hepatotoxic *relative to a liver*. If you demand intrinsicality, you cannot handle the continuum of "dropped on a pillow" vs. "dropped on concrete."
      *   *Verdict:* Drop it. Treat dispositions as *relational properties* or *context-sensitive capacities*.

  2.  **The Demand for a Categorical Base is a Physicalist Prejudice.**
      *   *Why:* Case #7 (Second-Order) creates a regress problem for strict categoricalists. If a vaccine is disposed to *produce immunity* (a disposition), and immunity is a disposition to *fight virus*, grounding everything in non-dispositional categorical properties becomes incredibly messy for special science entities.
      *   *Verdict:* Allow dispositional bases.

  3.  **Non-Circularity is Often Violated by Necessity.**
      *   *Why:* To handle Masks (Case #1 & #3), you need a *ceteris paribus* clause. But "all other things are equal" often means "nothing interferes with the manifestation of the disposition." This defines the conditions via the disposition itself.
      *   *Verdict:* Accept limited circularity if it saves the predictive utility of the predicate.

  4.  **Actual Difference Making is False.**
      *   *Why:* Case #6 (Quiescent). A stabilizer does its job by ensuring nothing happens. If you demand the disposition make a positive difference to actual events, you cannot account for prevention, stability, or homeostasis.
      *   *Verdict:* Allow manifestations to be absences.

  ### Incompatibility Matrix: What Breaks What

  You suspected the list might be unsatisfiable. You are right. You cannot satisfy all Non-Negotiables simultaneously without modifying the logic of the theory.

  *   **Incompatibility A:** **Pre-existence (Case #2)** vs. **Strict Conditionality.**
      *   If the tablet *becomes* soluble only upon contact (Booster), a strict conditional ("If immersed, it dissolves") is true, but the Pre-existence requirement says it wasn't soluble *before*.
      *   *Resolution:* You must distinguish between the *triggering condition* and the *possession condition*. The disposition is possessed before, but the causal basis is incomplete until the stimulus arrives.
  *   **Incompatibility B:** **Context Sensitivity (Case #5)** vs. **Intrinsicality.**
      *   If fragility depends on what it is dropped on, it is not intrinsic to the glass.
      *   *Resolution:* Sacrifice Intrinsicality (see above).
  *   **Incompatibility C:** **Modal Depth (Case #4)** vs. **Empiricist Verification.**
      *   If the vase is permanently packed, no empirical test distinguishes it from a non-fragile vase.
      *   *Resolution:* You must commit to a realist modal metaphysics (truthmakers exist even if untestable).

  ### The Most Exclusionary Requirement

  **Intrinsicality.**

  This is the single requirement that does the most exclusionary work. If you insist that a disposition must be intrinsic to the bearer, you immediately lose:
  *   The Partner Problem (Case 5): You can't handle environmental variables.
  *   Self-Annealing (Case 3): You can't handle internal relational mechanisms.
  *   Special Science Utility: Biology and chemistry are fundamentally about interactions, not isolated essences.

  Dropping Intrinsicality allows you to treat dispositions as *affordances* (Gibsonian) or *relations*, which solves 50% of your problem cases instantly.

  ### The Gradability & Vagueness Issue

  You are correct that this is the requirement everyone quietly ignores. Standard metaphysics treats "fragile" as a switch (On/Off). Science treats it as a dial (Mohs scale, LD50, half-life).

  *   **The Problem:** Conditional analyses are binary (True/False). "If struck, it breaks." But reality is probabilistic and scalar. "If struck with 5J, it has a 0.8 probability of breaking."
  *   **The Requirement:** Your theory must treat dispositions as **probability distributions over manifestation intensities**, not binary conditionals.
  *   **The Fix:** Do not define the disposition as *that it breaks*, but as *a propensity for breaking* with a specific magnitude. This handles the "One-Shot Mask" (Case 1) well: the foam reduces the probability of breaking on drop 1 to 0, but the propensity remains for drop 2.

  ### Scorecard of Live Options

  Here is how the three standard theories stack up against your **Non-Negotiable (NN)** list.

  | Theory | Score | Diagnosis |
  | :--- | :--- | :--- |
  | **1. Plain Conditional**<br>("If S, then M") | **Fails** | Fails immediately on Fink/Mask (0a/b), Booster (2), and Quiescent (6). It cannot handle Pre-existence or Negative Manifestation. Too brittle for applied science. |
  | **2. CP / Ideal Conditions**<br>("If S, then M, *ceteris paribus*") | **Passable** | Handles Masks (0b) and One-Shot (1) better. Struggles with Booster (2) and Partner (5) unless "Ideal Conditions" is defined relationally. Risks vacuity if "Ideal" is not rigorously defined. |
  | **3. Causal Basis Realism**<br>(Disposition = Categorical Base) | **Best Fit** | Handles Pre-existence (2) and Stability (0a) best. Struggles with Partner (5) and Intrinsicality unless you allow the "Base" to include environmental relations. Best suited for Second-Order (7) if bases can be dispositional. |

  **Recommendation:** For an applied prospectus, lean toward **Causal Basis Realism**, but explicitly redefine the "Base" to be **relational** (solving the Partner/Intrinsic problem) and **probabilistic** (solving the Gradability problem). This allows you to keep the metaphysical rigor of Realism while accommodating the messiness of the special sciences.
