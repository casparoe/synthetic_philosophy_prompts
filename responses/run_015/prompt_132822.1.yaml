  2.  **Deconstruct the User's 8 Cases:**
      *   *One-shot mask:* Foam absorbs impact, gets destroyed. Glass breaks on 2nd drop. Theory must distinguish "masked once" from "not fragile."
      *   *Booster (Inverse Fink):* Tablet not soluble *until* water touches it, then dissolves. Intuitively not soluble *before*, but dissolves *upon* stimulus.
      *   *Self-annealing:* Intrinsic masking/unmasking. Mechanism repairs damage instantly.
      *   *Permanently packed:* Fragile but never struck (packing never removed). Distinguish from non-fragile vase. (Modal depth issue).
      *   *Partner problem:* Stimulus vs. Background conditions. "Dropped on pillow" vs. "concrete." Continuum issue.
      *   *Quiescent:* Disposition to *prevent* (stabilizer, prophylactic). Manifestation = non-event.
      *   *Second-order:* Disposition to acquire a disposition (vaccine, seed). Iteration required.
      *   *Impossible-stimulus:* Soluble in non-existent solvent. Laws forbid conditions. (Modal vacuity).

  3.  **Drafting the Desiderata (The Spec):**
      *   Need to translate the cases into general metaphysical requirements.
      *   Need to categorize them as Non-Negotiable (NN) or Camp Preference (CP).
      *   *NN:* Must handle the special science usage (predictive utility, truth-aptness).
      *   *CP:* Intrinsicality, Categorical Base, Strict Conditionality.

  4.  **Developing the Editorial Judgment:**
      *   *Non-circularity:* Often demanded, but hard to maintain with CP clauses.
      *   *Intrinsicality:* Huge source of trouble (Self-annealing, Partner problem). Likely a CP.
      *   *Categorical Base:* Physicalism demand. NN for naturalists, CP for powers ontologists.
      *   *Modal Quantification:* Banning possible interventions kills the "Permanently packed" case.
      *   *Actual Difference Making:* Quiescent dispositions violate this.
      *   *Incompatibility:* Intrinsicality vs. Context-Sensitivity (Partner Problem). Categorical Base vs. Second-order/Iterative dispositions (if the base changes).
      *   *Most Exclusionary:* Intrinsicality. It kills the "Partner" and "Self-annealing" cases most effectively.

  5.  **Addressing Gradability/Vagueness:**
      *   Standard theories treat dispositions as binary (fragile/not). Reality is scalar (very fragile, slightly soluble).
      *   Need a desideratum for "Scalar Sensitivity."

  6.  **Scoring the Three Options:**
      *   *Plain Conditional:* Fails Finks/Masks immediately.
      *   *CP/Ideal Conditional:* Handles masks better, struggles with Booster/Intrinsic changes.
      *   *Causal Basis (Realism):* Handles Finks well, struggles with Partner/Context (is the basis intrinsic?).

  7.  **Refining the Output Structure:**
      *   Introduction: Acknowledge the applied focus.
      *   The Spec Table: Case -> Desideratum -> Status (NN/CP).
      *   Editorial Judgment: The "Hard Truths."
      *   Incompatibility Matrix: What breaks what.
