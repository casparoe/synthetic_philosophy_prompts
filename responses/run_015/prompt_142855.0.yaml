answer: |-
  This is an exceptionally sharp observation that cuts to the core of the ontology of computer science. You have identified what philosophers of computation often call the **Church-Turing Tension**: the oscillation between treating the Church-Turing Thesis (CTT) as a descriptive law of physics (the Physical CTT) and a constitutive definition of a conceptual practice.

  Your analysis is correct: the institutional practice relies on logically incompatible commitments that are pragmatically fused. To answer your questions, we must disentangle the **Mathematical CTT** (about effective calculability) from the **Physical CTT** (about what physical systems can do), and then examine the normative work the latter performs.

  ### 1. The Philosophical Commitments Presupposed

  The institutional practice you describe presupposes a hybrid ontology that I would label **Methodological Computationalism**. It relies on three specific, somewhat tension-filled commitments:

  **A. The Identity of Logic and Physics (with a Hierarchy)**
  The curriculum assumes that the limits of formal logic (Turing machines) map isomorphically onto the limits of physical causality. However, it establishes a hierarchy: Formal mathematics defines the *space of possibility*, while physics determines *instantiability*.
  *   **Commitment:** When a model proposes hypercomputation (e.g., Zeno machines, analog recurrent neural networks with infinite precision), it is dismissed not because it is physically impossible *per se*, but because it violates the *definition* of the formalism that governs the field.
  *   **Implication:** This treats the Turing Machine not as a model *of* physics, but as a constraint *on* physics. It presupposes a mild Platonism where the mathematical structure of computation is more fundamental than the material substrate.

  **B. Epistemic Authority as a "Regulative Ideal"**
  You ask about the epistemic authority of a thesis treated as both falsifiable and definitional. In Kantian terms, the Physical CTT functions as a **Regulative Ideal** rather than a Constitutive Principle.
  *   **As Falsifiable:** It is taught as empirical to keep the door open to quantum gravity or exotic physics (preserving scientific integrity).
  *   **As Definitional:** It is used normatively to ensure that "computation" remains a stable object of study. If every analog process counted as hypercomputation, the theory of computation would dissolve into general physics.
  *   **Commitment:** The field commits to acting *as if* CTT is true for the sake of engineering and verification, while admitting it *might* be false for the sake of theoretical completeness.

  **C. The Conflation of Computability and Tractability**
  You noted that intractable problems are treated as engineering challenges. This reveals a commitment to **Optimistic Physicalism**.
  *   **Commitment:** The boundary of "what can be computed" (CTT) is hard; the boundary of "what can be computed *efficiently*" (Complexity) is soft.
  *   **Why:** Admitting that some computable problems are physically impossible to solve (due to Bekenstein bounds or heat death of the universe) would undermine the normative promise of the discipline ("If it's computable, we can build it"). Therefore, intractability is framed as a resource problem, not a fundamental limit.

  ### 2. Is There a Coherent Stance? (Realism vs. Conventionalism)

  Can a single stance explain this dual policing? **No.** The practice implicitly relies on incompatible commitments, but it sustains them through **Pragmatic Ambiguity**.

  *   **If Strict Realist:** If computation is a natural kind discovered in physics (like electromagnetism), then hypercomputation should be investigated empirically. Dismissing it *a priori* as "not computation" is dogmatic. A realist would say, "If the universe computes it, it is computation."
  *   **If Strict Conventionalist:** If computation is merely a human descriptive practice (as per Piccinini's mechanistic account), then CTT is a definition. It cannot be "overturned" by physics, only revised by consensus. Teaching it as an empirical conjecture is misleading.

  **The Actual Stance: Constitutive Normativity**
  The field operates on a **Constitutive Rule** (in the Searlean sense).
  *   *Rule:* "To count as a computer science artifact, a system must be interpretable within the Turing formalism."
  *   *Function:* This polices the boundary upward (no hypercomputation) to protect the mathematical tools (verification, type theory) that rely on Turing bounds.
  *   *Function:* This polices the boundary downward (intractability is okay) to protect the engineering mission.

  This is logically unstable. It claims to describe the world (Realism) while simultaneously dictating what counts as a valid description (Conventionalism). However, it is **institutionally stable**. It allows CS departments to claim scientific rigor (physics) while retaining mathematical certainty (logic).

  ### 3. Consequences of Shifting the Framing

  If we resolved this tension by adopting a consistent framing, the landscape of research and regulation would shift dramatically.

  #### Scenario A: Consistently Empirical (CTT is a Physical Hypothesis)
  *   **Philosophy:** Computation is a physical process; CTT is a law like Thermodynamics.
  *   **Research Evaluation:** Departments would fund "Hypercomputation Labs." Proposals for analog systems utilizing infinite precision or relativistic time dilation would be treated as high-risk/high-reward empirical tests of CTT, not category errors.
  *   **Regulation:** Algorithmic feasibility could not assume Turing bounds. Safety cases for AI could not rely on standard verification methods (which assume halting is undecidable). If hypercomputation were possible, the Halting Problem might be solvable, breaking current cryptographic and security assumptions. Regulators would have to assess the *physical substrate* of an algorithm, not just its code.

  #### Scenario B: Consistently Conventional (CTT is a Definition)
  *   **Philosophy:** Computation is a mode of description imposed by an observer on a mechanism (the "Abstract/Physical" distinction).
  *   **Research Evaluation:** "Is this a computer?" becomes a question of *interpretation*, not physics. Analog dynamics are not "failed digital computers"; they are simply systems described by differential equations rather than recursive functions. Research would shift from "building Turing machines" to "mapping physical processes to formalisms."
  *   **Regulation:** The focus would shift entirely to **Complexity and Resource Bounds**. Since "computability" is just a choice of formalism, the only regulatory metric that matters is *cost* (energy, time, space). An AI model wouldn't be regulated based on whether it is "Turing Complete," but on whether its resource consumption scales linearly or exponentially. The "Black Box" problem changes: if computation is observer-relative, transparency is about the mapping between physical state and logical state, not just the code.

  ### Summary for Your Seminar

  The pattern you observe is a **category error institutionalized as policy**.

  1.  **The Commitment:** It presupposes that the *Mathematical* limits of logic are identical to the *Physical* limits of causality, without acknowledging the gap between abstract recursion and physical entropy.
  2.  **The Coherence:** It is not coherent. It uses Realism to dismiss hypercomputation ("Physics won't allow it") and Conventionalism to dismiss analog computation ("That's not what we mean by computation").
  3.  **The Change:** Moving to a consistent **Mechanistic/Physicalist** view (like Gualtiero Piccinini's) would force CS to admit that "computation" is what physical mechanisms do, and our formalisms are just maps. This would democratize architectures (analog is valid) but shatter the certainty of verification (no more assuming Turing bounds).

  The institutional practice persists because it protects the **engineering utility** of CS (we can verify code) while maintaining the **scientific prestige** of CS (we study the laws of nature). Acknowledging the tension would force a choice between being a branch of mathematics or a branch of physics. Currently, it profits from being both.
