answer: |-
  **Joint Statement on Hard Choices**

  **Setup and Phenomenology**
  We define a hard choice as a case in which an agent has full information about her options, has reasoned as well as she can, is not impaired by inattention, weakness of will, or confusion, and yet the deliberative difficulty survives everything that further information or further reasoning could do. In such cases, neither option seems better, nor worse, nor equally good. Both camps accept that hard choices in this sense are real, that they are not merely choices we find difficult due to ignorance, and that a hard choice is rationally resolvable in a way that tossing a coin is not. We oppose the "Easy-Choice View," which holds that the trichotomy of better, worse, and equally good exhausts all possible axiological relations between options. We agree that in hard choices, the trichotomy fails, yet rational agency remains intact.

  **Part I: Agreed Claims**
  The following claims are endorsed by both the Parity Camp and the Incomparabilist Camp. Each claim is substantive; a defender of the Easy-Choice View would reject at least one.

  1.  **Reality of Hardness:** Hard choices are not epistemic shadows; the difficulty does not vanish upon ideal deliberation.
  2.  **Failure of Trichotomy:** In hard choices, it is false that one option is better, worse, or equally good as the other.
  3.  **Rational Resolvability:** An agent is not rationally stuck; she is permitted to choose one option over the other.
  4.  **Non-Arbitrariness:** Choosing in a hard case is not equivalent to randomizing; the resolution carries rational weight that a coin flip lacks.
  5.  **Non-Discovery:** Resolution is not a matter of discovering an antecedent fact about which option is better.
  6.  **Agency Contribution:** The agent's will or commitment plays a constitutive role in making the choice rational.
  7.  **Normative Constraints:** The will is not unconstrained; some resolutions are criticizable (e.g., choosing based on irrelevant features).
  8.  **Reason Creation:** Resolution makes certain reasons decisive or creates new reasons that were not decisive prior to the choice.
  9.  **Extensional Coincidence:** For all first-order normative purposes (what an agent is permitted or required to do), the two camps coincide; the dispute is metaphysical and semantic, not practical.
  10. **Rational Regret:** Post-choice regret is not always irrational in hard choices, even if the choice was resolved well.
  11. **Deliberative Closure:** Deliberation ends in a commitment to act, not necessarily in a comparative judgment of value.
  12. **Competitor Status:** Both options remain genuine rational competitors throughout deliberation; neither is ruled out by valuelessness.

  **Part II: Disagreements Table**

  | Issue | Parity Camp Formulation | Incomparabilist Camp Formulation | Genuine or Verbal? | Crux of Dispute |
  | :--- | :--- | :--- | :--- | :--- |
  | **Axiological Relation** | Options stand in a fourth positive relation ("on a par"); they are comparable but not trichotomously ranked. | No positive axiological relation holds; "on a par" misleadingly suggests a relation where none exists. | Genuine | The metaphysics of value: does comparability require a relation? |
  | **Comparability** | Options are comparable because parity is a form of comparability distinct from ranking. | Options are incomparable because comparability entails the possibility of ranking via some relation. | Verbal | The definition of "comparability": does it require a holding relation or merely rational competitiveness? |
  | **Reason Status** | Resolution creates a reason by activating the parity relation through will. | Resolution creates a reason by bridging a normative gap where no relation exists. | Verbal | The explanation of normativity: does the will complete a relation or substitute for one? |
  | **Value Creation** | The agent creates a specific comparative value fact by resolving the parity. | The agent creates a non-comparative reason fact; no comparative value is created. | Genuine | The ontology of reasons: are created reasons comparative or non-comparative? |

  **Part III: Cruxes**
  The following five cruxes identify sub-questions where settling the matter would move at least one camp. For each, we state the shared case and the divergent predictions.

  1.  **The Value-Span Model:**
      *   *Case:* Values are modeled as a set of admissible precisifications (complete rankings). Options are "spanned" when some precisifications rank A over B and others B over A. No precisification is correct independently of resolution.
      *   *Parity Prediction:* The model delivers genuine comparability that is not trichotomous; the span itself is a positive structure supporting parity.
      *   *Incomparabilist Prediction:* The model merely redescribes incomparability; the lack of a uniform ranking across precisifications confirms the absence of a relation.
      *   *Stakes:* Whether formal imprecision entails a positive relational property.

  2.  **Robustness Under Small Improvement:**
      *   *Case:* A hard choice between two careers. One option receives a trivial benefit (e.g., slightly shorter commute).
      *   *Parity Prediction:* Hardness is robust; the trivial benefit does not immediately make one option better. A series of improvements is needed before trichotomy applies.
      *   *Incomparabilist Prediction:* Hardness breaks immediately or at a specific threshold where comparability begins; the location of this threshold requires explanation of why a trivial change triggers a relation.
      *   *Stakes:* Whether value relations are sensitive to marginal changes in hard cases.

  3.  **The Second-Chance Case:**
      *   *Case:* An agent resolves a hard choice, lives the life for a decade, and is offered the other option again at no cost.
      *   *Parity Prediction:* A comparative judgment ("this is better for me") has become apt where it was not before; resolution created comparative value.
      *   *Incomparabilist Prediction:* No comparative judgment is apt; the agent chooses based on new non-comparative reasons (commitment), not because the options are now ranked.
      *   *Stakes:* Whether resolution transforms the axiological status of the options retroactively.

  4.  **The Staircase:**
      *   *Case:* A series of options where each adjacent pair is a hard choice, but the first is determinately better than the last. The agent moves one step at a time.
      *   *Parity Prediction:* Every step is permissible, but the whole descent is irrational; rationality requires resolving at the level of policy, not just step-wise.
      *   *Incomparabilist Prediction:* Either some steps are impermissible (breaking the hard choice chain) or rationality does not aggregate across incomparable steps; policy requirements are external to value.
      *   *Stakes:* Whether rational permissibility aggregates across sequences of hard choices.

  5.  **Menu Sensitivity:**
      *   *Case:* Two hard options are joined by a third that is determinately worse but resembles one option along its stronger dimension.
      *   *Parity Prediction:* Permissibility changes with the menu; parity relations are context-sensitive, allowing the third option to shift the parity balance.
      *   *Incomparabilist Prediction:* Permissibility should not change if options are incomparable; if it does, this admits a reductio against incomparability or shows rationality is menu-dependent independent of value.
      *   *Stakes:* Whether rational choice satisfies independence of irrelevant alternatives in hard cases.

  **Part IV: Defeat Conditions**
  Each camp specifies findings it would accept as evidence against its view. These are not rhetorical concessions but genuine falsifiers.

  **Parity Camp Defeat Condition:**
  The Parity Camp would abandon its view if it were demonstrated that the "on a par" relation obeys transitivity in all cases without recourse to agent resolution. If parity functions exactly like a ranking relation (better/worse/equal) in terms of logical structure, merely labeling it "fourth" adds no explanatory power. Specifically, if a chain of parity relations necessarily entails a determinate ranking between the endpoints without agency intervening, parity collapses into trichotomy. We require parity to be non-transitive in a way that blocks ranking; if formal models show this is impossible without contradiction, the view fails.

  **Incomparabilist Camp Defeat Condition:**
  The Incomparabilist Camp would abandon its view if it were demonstrated that rational resolution in hard choices requires an antecedent comparative fact. If it can be shown that an agent cannot rationally choose A over B unless A stands in some positive relation to B prior to the choice, then incomparability is incompatible with rational agency. Specifically, if the "non-arbitrariness" of hard choices cannot be explained without positing a pre-existing relation that guides the will, then the claim that "no relation holds" is false. We require that rationality can operate in the absence of comparative value; if rationality necessarily tracks value, incomparability is untenable.

  **Conclusion on Residual Dispute**
  As stated in Claim 9, we agree that our positions coincide extensionally for all first-order normative purposes. An agent following Parity guidelines and an agent following Incomparability guidelines will be permitted to make the same choices and criticized for the same errors. The residual dispute is therefore not about how to live or choose, but about the metaphysics of value and the theory of reasons. The Parity Camp insists that the phenomenology of comparability requires a relational truth-maker. The Incomparabilist Camp insists that the exercise of rational agency does not require such a truth-maker. Until a crux is settled, both accounts remain viable descriptions of the same normative landscape.
