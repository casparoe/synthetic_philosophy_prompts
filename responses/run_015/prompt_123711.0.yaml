  I was talking with my friend at her print shop and we got into this weird argument about whether a statue is just the clay shaped up, or if its something extra sitting on top. I dont have any philosophy background but I've been thinking about the statue-and-clay thing — material constitution, I guess its called — and I want to explain it to my cousin who's in highschool and really into digital art but hates textbooks.

  I'm planning to use this made-up example: a 3D-printed vase that gets melted down and reprinted from the same digital file every month, so every plastic atom is different but people still call it the same vase. I want to build the whole lesson around comparing that to the classic clay statue, but I'm not sure if the file-thing makes it clearer or just muddies it up. Can you map out the teaching plan? I need to know what idea has to land first before she can even see why its a puzzle, then the carrying example and whether the melted vase works or if I should ditch it for actual clay, then the misconceptions she'll hit — like maybe she thinks the digital file is like a soul that stays the same, or that replacing all the atoms definately makes it a copy — and exactly where in the order I should knock each one down. Also tell me what part of the deep problem I should just skip and admit is too weird for this level, plus one quick check-question at the end to see if she actually gets the puzzle or is just nodding along. Give me exactly five numbered points, each a sentence or two, with no intro or conclusion.
