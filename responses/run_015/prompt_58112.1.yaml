prompt: |-
  lol ok me and my roomate keep fighting about fakes and i need help predicting what he will say next cause he is so stubborn. he is an art major so he has opinions on everything. here is his track record so far:

  - i bought a cheap watch from a street guy who swore it was a real luxury brand and my roomate went off about how its a total forgery and basically worthless even tho it tells time fine.
  - we have a museum poster of a famous painting on our wall that we bought in the gift shop clearly marked as a reproduction and he says thats totally fine and not a fake at all, but he also says duh its worth way less than the real thing even if it looks the same from across the room.
  - his friend takes regular white sneakers and repaints them by hand to look exactly like a sold-out limited drop, posts videos of him doing it, wears them around, and my roomate says thats not a fake, thats a custom and its actually cool and worth something for the labor.
  - he saw this vintage band tee on ebay where like half the fabric was replaced due to holes but the seller still listed it as an authentic original from the 70s and he said thats fakey and a ripoff even tho part of it is original.

  now the new thing: he 3d scanned his own pair of limited sneakers and printed a second pair at the library makerspace with basically the same materials, same shape and colors down to the stitching, just for himself to wear so he doesnt ruin the original. he tells anyone who asks that he printed them himself and he would never sell them. do you think he will call those printed ones a fake or just a replica, and will he say they are just as good and valuable for everyday wear or still worth less?

  i dont just want a yes or no, can you lay out like two or three different rules he could be using that all fit the four older cases, say what each one would predict for the printed shoes, give your best guess about what he will actually say and why, and then suggest one more wierd test case that would seperate the rules if we are still unsure.
