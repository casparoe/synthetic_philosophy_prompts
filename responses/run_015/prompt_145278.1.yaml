  hey quick question. at my co-op we have this old basement freezer rule from the 90s: anything stored there needs a label with your name and a use-by date within 30 days. nobody uses it now — everyone uses the kitchen freezer — and the founders who wrote it are long gone. my housmate wants to kill the rule and turn the space into bulk-buy storage. she says we should only keep rules if we can definately name the exact problem they solve today; since no one can explain why 30 days was picked or point to a recent disaster it prevented, it's dead weight. i feel uneasy deleting it but i can't defend it with facts either. is her "articulate the function or remove it" idea right? reply in one paragraph, max 130 words. don't cite anyone, just tell me straight.
