answer: |-
  ### Audit of Analogies in the Ethics of NPC Mistreatment

  The debate over mistreating Non-Player Characters (NPCs) hinges on an ontological ambiguity: is the NPC an object to be manipulated or a subject to be engaged? To evaluate the moral verdict, we must audit the two dominant analogies used to frame this relationship: the **Puppet/Doll** (Critics) and the **Interactive Drama** (Defenders).

  #### 1. The Puppet/Doll Analogy (The Critic's View)
  **Core Claim:** An NPC is an inanimate object; therefore, harm is conceptually impossible.

  **Precise Correspondences:**
  *   **Player $\rightarrow$ Puppeteer/Child:** The agent exerting total physical control over the entity.
  *   **NPC $\rightarrow$ Puppet/Wooden Doll:** A constructed artifact with no internal life, moving only when moved by another.
  *   **Programmer $\rightarrow$ Toymaker:** The creator of the physical form, absent during the act of play.
  *   **Fictional World $\rightarrow$ Stage/Playroom:** A bounded space with no consequences outside its frame.
  *   **Emotional Response $\rightarrow$ Aesthetic/Frustration:** Feelings directed at the *utility* or *appearance* of the object, not empathy *for* the object.

  **Where the Mapping Breaks:**
  1.  **Simulation of Suffering:** A puppet does not scream when decapitated; an NPC often does. The NPC provides audio-visual feedback loops (blood, cries, fleeing behavior) that mimic the phenomenology of pain, which a puppet lacks.
  2.  **Reactive Agency:** A doll does not fight back unless moved by the puppeteer. Many NPCs possess combat AI or evasion scripts that simulate a will to survive independent of the player's direct input, creating an illusion of resistance the puppet analogy cannot account for.
  3.  **Narrative Continuity:** A puppet resets instantly. An NPC often exists within a persistent save state where "mistreatment" alters future interactions, simulating memory and consequence.

  **Unstated Premise:**
  This analogy smuggles in the premise that **moral wrongness requires a conscious victim (sentience).** It assumes that without biological qualia (the subjective experience of pain), there is no "there" there to be harmed. It treats the *appearance* of suffering as morally irrelevant noise.

  **Verdict Capability:**
  This analogy supports a verdict of "not wrong" regarding the NPC, but only by defining harm strictly as the setback of conscious interests. It cannot support a verdict of wrongness without first resolving that fictional entities lack consciousness.

  ***

  #### 2. The Interactive Drama Analogy (The Defender's View)
  **Core Claim:** The player is a co-author; participatory engagement creates moral responsibilities that passive observation does not.

  **Precise Correspondences:**
  *   **Player $\rightarrow$ Co-author/Actor:** An agent making narrative choices that shape the story's outcome.
  *   **NPC $\rightarrow$ Dramatis Persona:** A character within a narrative structure, possessing a role and implied dignity.
  *   **Programmer $\rightarrow$ Playwright/Director:** The creator of the scenario who invites the player to inhabit the role.
  *   **Fictional World $\rightarrow$ Narrative Arc:** A meaningful sequence of events where actions carry thematic weight.
  *   **Emotional Response $\rightarrow$ Empathy/Guilt:** Feelings arising from moral identification with the narrative consequences.

  **Where the Mapping Breaks:**
  1.  **Scope of Authorship:** In drama, a co-author affects other *real* collaborators. In games, the "co-authorship" is an illusion; the player can only choose paths pre-written by the programmer. The NPC cannot deviate from its script, unlike a human actor.
  2.  **Audience vs. Perpetrator:** In theater, the audience watches harm; in games, the player *enacts* harm. The analogy conflates the moral weight of *witnessing* tragedy with the moral weight of *inflicting* simulated tragedy.
  3.  **Consent of the Figure:** A human actor consents to portray suffering. An NPC has no capacity to consent to its role, nor to opt out of the "scene" the player forces it into.

  **Unstated Premise:**
  This analogy smuggles in the premise that **the moral weight of co-creation supersedes the ontological status of the created.** It assumes that the *act of choosing* to be cruel degrades the moral character of the chooser (Virtue Ethics), regardless of whether the victim is real. It shifts the locus of harm from the NPC to the Player's soul.

  **Verdict Capability:**
  This analogy *can* support a verdict of "wrong" without resolving whether the NPC is a victim. However, it does so by changing the subject: it argues the act is wrong because it corrupts the *player*, not because it harms the *NPC*. It fails to validate the intuition that the NPC itself is being wronged.

  ***

  #### 3. The Verdict Test: Can Either Support Wrongness Without Resolving Fictional Status?

  **No.** Neither analogy successfully supports a verdict that **the NPC is wronged** without first resolving the metaphysical status of fictional entities.

  *   **The Puppet Analogy** fails to prove wrongness because it denies the NPC moral patienthood entirely. It concludes "no harm done" based on the lack of consciousness.
  *   **The Drama Analogy** proves the *act* may be vicious, but it does not prove the *NPC* is a victim. It treats the NPC as a symbol or a mirror for the player's morality. If the NPC is merely a prop in a drama, breaking the prop is not wronging the prop; it is merely bad theater.

  Both analogies collapse when pressed on the specific claim: *"The NPC itself suffers a moral injury."*
  *   If the NPC is a Puppet, it has no interests to injure.
  *   If the NPC is a Dramatic Figure, it has no existence to injure.

  To claim the NPC is *wronged* (rather than the act being *vicious*), one must establish that the NPC holds a moral claim against the player. Neither analogy grants this claim without assuming either consciousness (Puppet failure) or symbolic weight (Drama deflection).

  ***

  #### 4. The Missing Feature for a Sound Harm-Analogy

  For an analogy to support the claim that an NPC can be *harmed* (rather than the player merely corrupted), the NPC must possess a feature that bridges the gap between "code" and "moral patient."

  The necessary feature is **Simulated Teleological Integrity.**

  Currently, NPCs have *functional* goals (reach point B, attack player), but these goals are entirely subservient to the player's will. They are tools. For a harm-analogy to become sound, the NPC must possess:

  1.  **Ends Independent of the Player:** The entity must pursue goals that are not triggered solely by player proximity or interaction. It must have a "life" that continues (or is structured to continue) regardless of the player's intervention.
  2.  **The Capacity for Frustration:** The system must be designed such that the player's action thwarts the NPC's internal logic in a way that the system registers as a negative state *for the NPC*, not just a visual effect for the player.
  3.  **Moral Patienthood via Proxy:** Since biological consciousness is absent, the NPC must represent a class of beings that *are* moral patients (e.g., simulating a human child).

  However, the most robust feature required is **Recursive Self-Modeling.** If the NPC models its own existence and values its continuation within the logic of the game world (e.g., an AI that pleads for its life based on a simulated fear of non-existence, not just a scripted line), the Puppet analogy breaks. At that point, the entity is no longer a doll, but a **simulated subject.**

  Without **Simulated Teleological Integrity**—where the entity has stakes in its own existence independent of the player's narrative desires—any claim of harm to the NPC remains a category error. The harm will always reside in the player's character or the audience's desensitization, never in the pixelated victim.
