answer: |-
  This is a fantastic real-world application of a philosophical concept. Your friends are actually reenacting a very common debate in epistemology (the study of knowledge) regarding Miranda Fricker's theory of **Epistemic Injustice**.

  Here is a breakdown of who is right about what, where they are misunderstanding the concept, and the crucial nuance both of them are missing.

  ### Part 1: The Scorecard (Who is right about what?)

  **Riley's Moves:**
  *   **"They dismissed Jordan based on credentials and background, not on actually listening."**
      *   **Verdict:** **Right.** This is the core of *Testimonial Injustice*. It occurs when a listener assigns a "credibility deficit" to a speaker due to identity prejudice (in this case, class/education bias: "Art side" vs. "Fancy grad degrees").
  *   **"It's not about being right or wrong overall."**
      *   **Verdict:** **Right.** This is the most important philosophical point. Epistemic injustice is a harm done to the *person* in their capacity as a knower. It happens at the moment of speaking. Whether Jordan turns out to be factually correct later is irrelevant to whether an injustice occurred *in the meeting*.
  *   **"If Jordan had been an engineer... they'd have actually debated."**
      *   **Verdict:** **Right.** This is the "counterfactual test." To prove prejudice, you ask: *Would they have treated this claim differently if the speaker had a different social identity?* If an engineer with a Masters had proposed the same theory, would they have been mocked, or would they have been asked to show their data? The fact that they likely would have engaged with the engineer proves the dismissal was prejudicial.

  **Casey's Moves:**
  *   **"The managers turned out right about the cause."**
      *   **Verdict:** **Wrong (regarding the injustice).** This is a "result-oriented" bias. You can treat someone unjustly even if you accidentally stumble onto the truth later. If a police officer dismisses a victim's report because of their race, but later catches the criminal via CCTV, the injustice against the victim still happened.
  *   **"Calling every dismissal of a bad idea 'injustice'... makes the whole concept useless."**
      *   **Verdict:** **Partially Right.** Casey is correctly identifying the risk of "conceptual inflation." If we call every rude disagreement an injustice, the term loses power. There *must* be a link to identity prejudice, not just disagreement.
  *   **"If Jordan's main claim was false... where's the knowledge harm?"**
      *   **Verdict:** **Wrong.** This misunderstands the harm. The harm isn't that the managers failed to fix the machine (that's operational harm). The harm is that Jordan was treated as intellectually inferior *because of who they are*, rather than *because of what they said*. It reinforces a social hierarchy where "Art people" aren't allowed to have insights on "Tech systems."

  ### Part 2: The Verdict

  **Riley is philosophically closer to the definition, but Casey raises a valid caution.**

  In the specific scenario you described, **this qualifies as Epistemic Injustice.**

  Here is why: The managers didn't just say, "Jordan, we checked the data and that's not the cause." They *laughed* and cited Jordan's lack of a Masters/Art background as the reason Jordan "doesn't understand data." That is a textbook **prejudicial credibility deficit**. They used Jordan's identity as a shortcut to avoid doing the epistemic work of evaluating the argument.

  Casey is worried that we are protecting "bad ideas." But Epistemic Injustice isn't about protecting bad ideas; it's about protecting the *process of evaluation*. Jordan deserved to have the idea evaluated on its merits, not on their resume.

  ### Part 3: What Both Are Missing

  There are two layers to this that neither Riley nor Casey fully grasped. If you want to win the argument (or mediate it), bring these up.

  **1. Rational vs. Prejudicial Credibility Deficits**
  Casey's worry is valid *if* the managers were using credentials as a rational heuristic. If I have a heart problem, and I listen to a cardiologist over a poet, that is a *rational* credibility deficit. It is not injustice; it is expertise.
  *   **The Missing Nuance:** The injustice happens when the credentialism becomes a proxy for **snobbery**. Jordan works *at the company*. Jordan has experiential knowledge of the workflow. Dismissing an employee's observation about workflow *solely* because they don't have a specific type of degree is prejudicial.
  *   **How to explain it:** Tell Casey: "It would not be injustice if they said, 'Jordan, the data doesn't support this.' It *is* injustice because they said, 'You don't get it because you're an artist.' One attacks the evidence; the other attacks the knower."

  **2. Hermeneutical Injustice (The Deeper Layer)**
  Riley focused on *Testimonial Injustice* (not being believed). But there is likely *Hermeneutical Injustice* here too.
  *   **The Concept:** This happens when someone has a social experience, but the collective language/tools to understand it are dominated by a different group.
  *   **The Application:** The managers have "fancy grad degrees" and look at "data." Jordan comes from the "art side" and looks at "human behavior/patterns." Jordan noticed a *social* loop (people rubber-stamping to avoid conflict). The managers were looking for a *technical* loop.
  *   **The Missing Piece:** Jordan wasn't just dismissed; Jordan was likely **incomprehensible** to them. The managers lacked the interpretive tools to value a sociological explanation for a technical problem. They didn't just reject Jordan's truth; they lacked the vocabulary to recognize it as knowledge at all. This is why they missed the "side pattern" that turned out to be real.

  ### Summary for Your Friends

  You can tell them this:

  1.  **Riley wins on the definition:** Epistemic injustice is about the *process* of being heard, not the *truth* of the claim. You can be wrong and still be epistemically wronged.
  2.  **Casey wins on the caution:** We have to be careful not to call every disagreement an injustice. It only counts if the dismissal was driven by **identity prejudice** (Art vs. Tech), not just **evidence** (Data vs. Theory).
  3.  **The Reality:** In this specific case, because the managers mocked Jordan's background rather than engaging with the data, it **is** epistemic injustice. The fact that Jordan was partially right (about the approval loop) proves that valuable knowledge was lost *because* of that injustice.

  The tragedy isn't that the managers fixed the supply chain issue. The tragedy is that if they had listened to Jordan, they might have fixed the approval loop *years* earlier, saving money and stress. That is the practical cost of epistemic injustice.
