      *   *In this case:* Jordan works there. Jordan has experience. The managers dismissed based on *type* of degree (Art vs. Tech) and *level* (Masters vs. None). Is "No Masters in Tech" a rational reason to dismiss a technical claim? Yes, to an extent. But the *mockery* and refusal to engage suggests prejudice (snobbery) rather than rational assessment of expertise. I need to make sure I highlight this nuance. It's not black and white.
