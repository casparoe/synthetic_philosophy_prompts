answer: |-
  The mass filled the pleural cavity like wet wool, grey and pulseless, yet when I sliced into it the surface didn't bleed—it seeded. Microscopic fragments drifted into the saline rinse, each one distinct, varying in density and shape like a litter of uneven stones, and I knew from the cultures that these fragments would find new calcium, new hosts, and grow different again. But there was no skin to it, no membrane separating the thing from the lung it had colonized; it was a continuous sheet of cytoplasm sharing the host's blood supply, a ghost limb woven directly into the nervous system without a single wall to say where the man ended and the growth began. It had a future, clearly, written in the variance of its seeds, but it had no skin, no self to hold against the dark, just a process that wore the body like a river wears a stone.

  ***

  ### The Walkthrough

  **Definition 1: The NASA Definition (Evolutionary Systems)**
  *   **The Rule:** Life is a self-sustaining chemical system capable of undergoing Darwinian evolution.
  *   **The Verdict:** **Alive.**
  *   **Why:** Your text establishes that the mass releases fragments ("seeds") that find new hosts and "grow different again." This confirms replication with variation. If those variations affect survival (implied by "find new calcium"), natural selection is occurring. It is a lineage changing over time. Under this definition, if it evolves, it lives.

  **Definition 2: The Autopoiesis Definition (Maturana & Varela)**
  *   **The Rule:** Life is a system that produces its own components and, crucially, produces the *boundary* that distinguishes it from its environment.
  *   **The Verdict:** **Dead (or Non-Living System).**
  *   **Why:** Your text explicitly states there is "no skin to it, no membrane... a continuous sheet of cytoplasm sharing the host's blood supply." It does not produce a boundary that separates "self" from "other"; it relies on the host's infrastructure and physical limits. It is a process happening *within* a living system, not a living system itself. It is a fire, not a fox.

  ### The Engineering

  **The Feature Doing All the Work:**
  The **lack of a distinct boundary** (membrane/skin) despite **independent replication**.
  Most biological entities that evolve (bacteria, animals, plants) are autopoietic—they build their own walls. Most things that lack walls (fires, crystals, whirlpools) don't evolve via genetic inheritance. You have engineered a "naked replicator" that inherits traits but lacks a self-produced container.

  **If You Remove That Feature:**
  *   **Give it a membrane:** It becomes a parasite or a symbiote. Both definitions agree it is **Alive**. The philosophical tension collapses into a medical one (is it a disease?).
  *   **Remove the evolution/variance:** It becomes a crystal growth or a static tumor. Both definitions agree it is **Dead**. The tension collapses into a simple pathology.

  **How a Defender of "Dead" Would Claim You Rigged It:**
  An autopoiesis purist would argue you've created a category error. They would say: "You describe a *mechanism* of the host body that has gone rogue, like a heartbeat or a reflex. A reflex can be triggered and can vary, but we don't sign a death certificate for a reflex. By making it continuous with the host's cytoplasm, you've admitted it is just *part of the corpse*, and parts of corpses don't get their own death certificates."

  ### The Verdict for the Novel

  **She should sign it "Dead."**

  **Why:**
  You stated she is a narrator who "needs the dead to stay dead." If she signs it "Alive," she validates her own fear—that the boundary between life and death is porous, chaotic, and uncontrollable. That turns the book into a thriller about containment or a sci-fi novel about a new species.

  If she signs it "Dead," she preserves the genre as **existential noir**. She chooses order over truth. She decides that for the sake of the living (the town, the family, her own sanity), the thing must be categorized as matter, not life. This makes her need for the dead to stay dead her **flaw**, not her spine. It haunts her. She knows she is lying—or at least forcing a category onto something that refuses it—in order to keep the world intelligible.

  **The Sentence You Need:**
  *"I signed the certificate not because the ink proved anything, but because the line had to be drawn somewhere, and I was the one holding the pen."*
