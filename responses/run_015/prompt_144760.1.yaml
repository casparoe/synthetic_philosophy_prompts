prompt: |-
  I run the clinical ethics consultation service at a mid-size hospital — about forty consults a year, one hour-long case conference each, and the attending physician plus a three-person committee has to sign off at the end. Our accreditation body has started requiring that every consult close with a one-sentence "articulable rationale" that could be applied to future cases, and that's exactly the thing I'm not sure is always available.

  I've been reading up on moral particularism versus generalism and the holism of reasons — the thought that a feature counting in favour of an action here might count against it, or count for nothing, somewhere else. Turn that into a procedure my committee can actually run inside an hour: the questions in the order we should ask them, a real test for whether a feature is doing work in this case or just travelling along with it, and a way of dealing with the fact that we keep a register of past consults (I pair each new case with its closest near-miss from the register, and we routinely can't agree whether the difference between the two is a reason or just noise).

  It has to say where it stops with no answer, which steps are judgment calls dressed up as steps, and what we write on the form when the honest answer is that there is no generalizable rationale — I'd rather flag that than invent one. It also has to tell me which parts of the theory I can drop in translating it to a one-hour meeting and which I can't drop without the whole thing collapsing into a plain checklist.

  Then run it on three of our cases: a family insisting on continued ICU treatment the team calls futile; a case that is the near-identical twin of one we decided last year except the patient has no family at the bedside; and a patient with a history of violence toward staff, where everyone in the room is sure it matters but nobody can say whether it's a reason or a biasing factor. Include at least one where the procedure lands somewhere I won't like, and say plainly what the procedure can't do for us.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**
      *   **User:** Director of a clinical ethics consultation service (mid-size hospital, ~40 consults/year).
      *   **Problem:** Accreditation body requires a one-sentence "articulable rationale" (generalizable principle) for every consult. User suspects this isn't always possible due to moral particularism/holism of reasons.
      *   **Task:** Create a procedure for the committee to use *within* the one-hour case conference.
      *   **Requirements:**
          *   Order of questions.
          *   Test for whether a feature is doing normative work or just "travelling along."
          *   Method for handling the register of past consults (comparing new cases to "near-misses").
          *   Must specify where it stops with no answer.
          *   Must identify which steps are judgment calls disguised as steps.
          *   Must specify what to write on the form if there is *no* generalizable rationale (honest flagging).
          *   Must distinguish between theory parts that can be dropped vs. those that are essential (to avoid collapsing into a checklist).
          *   **Application:** Run the procedure on three specific cases (Futile ICU, Twin Case w/ No Family, Violent Patient).
          *   **Constraint:** Include at least one outcome the user won't like.
          *   **Constraint:** State plainly what the procedure *can't* do.

  2.  **Theoretical Grounding:**
      *   *Moral Particularism (Dancy, etc.):* Reasons are context-dependent. A feature (e.g., "patient requested X") might be a reason in Case A but not in Case B.
      *   *Holism of Reasons:* The valence of a reason can change based on other features.
      *   *Generalism:* The accreditation body wants this (principles/rules).
      *   *The Tension:* The procedure needs to bridge the gap. It can't fully satisfy strict particularism (which denies general principles) while satisfying accreditation (which demands them), *unless* it allows for the honest admission that no general principle applies.
      *   *The Solution:* A "Defeasible Generalization" protocol. It treats principles as presumptive but allows for override based on holistic context, with a specific mechanism to flag when the generalization fails.

  3.  **Drafting the Procedure (The "Particularist Protocol"):**
      *   *Time Limit:* 60 minutes total. The protocol needs to fit in the last 15-20 minutes of the case conference.
      *   *Step 1: Feature Isolation.* Identify the candidate reason.
      *   *Step 2: The Valence Test.* Does this feature push the same way in the near-miss case?
      *   *Step 3: The Defeater Check.* Is there a contextual feature flipping the valence?
      *   *Step 4: The Formulation.* Draft the sentence.
      *   *Step 5: The "Null" Option.* If it fails, write the specific null statement.
      *   *Theory Retention:* What *must* stay? The holism check (Step 2 & 3). What can go? Deep metaphysical debate about the nature of reasons.
      *   *Judgment Calls:* Identifying the "near-miss" and deciding if a difference is "normatively relevant."

  4.  **Developing the Three Cases:**
      *   *Case 1: Futile ICU.* Standard conflict. Family wants continued care, team says futile.
          *   *Expected Outcome:* Usually, we find a principle like "Beneficence overrides autonomy when..."
          *   *Procedure Outcome:* Likely finds a generalizable rationale.
      *   *Case 2: The Twin (No Family).* Identical to last year's case, but no surrogate.
          *   *Expected Outcome:* This challenges the "near-miss" comparison. If the medical facts are identical, is the *absence* of family a reason or just noise?
          *   *Procedure Outcome:* This should be the one the user "won't like." It might force the committee to admit the previous case's rationale was actually dependent on the family's presence, undermining the previous precedent. Or it might force a "Null" result. Let's make it force a "Null" result, showing that the previous "principle" was actually particular to the family dynamics.
      *   *Case 3: Violent Patient.* History of violence. Staff want to limit care/interaction.
          *   *Expected Outcome:* Is safety a reason to limit care, or is it bias against a difficult patient?
          *   *Procedure Outcome:* This tests the "Valence Test." In other cases, "patient behavior" might not matter. Here it does. Why? Because of the *context* of staff safety vs. patient need. This might result in a weak generalization.

  5.  **Refining the "Null" Statement:**
      *   Accreditation wants a rationale. If we say "None," they might reject it.
      *   *Workaround:* The rationale *is* the particularity. "No general principle applies; decision rests on the specific configuration of X, Y, Z." This satisfies the *form* without lying about the *content*.

  6.  **Addressing the "Theory Drop" Requirement:**
      *   *Keep:* Holism (features change valence), Default & Challenge structure.
      *   *Drop:* Metaphysics of moral properties, extensive literature review during the meeting.

  7.  **Addressing the "Judgment Call" Requirement:**
      *   Selecting the "near-miss" from the register is subjective.
      *   Deciding if a difference is "noise" or "signal" is subjective.
      *   Need to explicitly label these as "Committee Vote" moments.

  8.  **Review against Constraints:**
      *   One-hour meeting integration? Yes, allocated time.
      *   Order of questions? Yes.
      *   Test for feature work? Yes (The Valence Swap).
      *   Register handling? Yes (Near-Miss Selection).
      *   Stop condition? Yes (The Null Statement).
      *   Judgment calls identified? Yes.
      *   Theory drop/keep? Yes.
      *   Three cases run? Yes.
      *   One outcome user won't like? Yes (Case 2 undermines precedent).
      *   What it can't do? Yes (Guarantee consistency or satisfy accreditors who want false certainty).

  9.  **Final Polish:**
      *   Tone: Professional, direct, clinically grounded, philosophically rigorous but pragmatic.
      *   Structure: Procedure first, then Theory Notes, then Case Applications, then Limitations.

  *(Self-Correction during drafting)*: I need to make sure I don't just give a checklist. The prompt asks to avoid collapsing into a plain checklist. The core mechanism must be the *comparison* with the register. That's the engine. I need to emphasize that the "Near-Miss" isn't just a search term; it's a philosophical tool.

  *(Refining Case 2)*: If the case is a "near-identical twin" but the outcome *must* be different because there's no family to object, then the previous rationale (which likely relied on family consensus) is exposed as particular. This is the "uncomfortable truth." I will make sure the procedure forces this admission.

  *(Refining the "Null" Statement)*: It can't just be "N/A." It needs to be a sentence. "The moral weight of [Feature] is contingent on [Context] and admits no general rule."

  Let's assemble the response.cw
answer: |-
  Here is a procedure designed for your constraints. It integrates particularist insights into a workflow that fits a one-hour case conference, satisfies the accreditation requirement formally without lying substantively, and forces the committee to confront when they are making a judgment call versus applying a rule.

  ### The "Defeasible Generalization" Protocol (DGP)

  **Time Allocation:** The final 20 minutes of the 60-minute case conference.
  **Participants:** Attending Physician + Ethics Committee (3 persons).
  **Materials:** Current case summary + Register of Past Consults (searchable).

  #### Phase 1: Feature Isolation (5 Minutes)
  **Question:** "What is the single feature driving our recommendation *in this specific context*?"
  *   *Instruction:* Do not list values (e.g., "Autonomy"). List concrete features (e.g., "The patient's prior verbal refusal," "The family's unanimous consent," "The staff's documented fear of physical harm").
  *   *Theory Retention:* You cannot drop **Holism**. You must identify the feature whose moral valence is in question.
  *   *Judgment Call:* Selecting *which* feature is the driver. (This is subjective; record the vote if not unanimous).

  #### Phase 2: The Near-Miss Valence Test (10 Minutes)
  **Question:** "Pull the closest case from the register. In that case, did this same feature count *for* or *against* the action?"
  *   *Instruction:* Search the register for the case with the highest clinical and situational overlap (the "Near-Miss").
  *   *The Test:*
      1.  If the feature had the **same valence** (counted for/against the same way) in the Near-Miss: Proceed to Phase 3.
      2.  If the feature had **opposite valence** (counted for here, against there) or **no valence** (was irrelevant there): **STOP.** You have identified a particularist constraint. You cannot write a general rule. Proceed to Phase 4 (The Null Statement).
      3.  If the committee **cannot agree** on what the feature did in the Near-Miss: **STOP.** This is a disguised judgment call. Proceed to Phase 4.
  *   *Theory Retention:* You cannot drop the **Valence Check**. Without this, you are merely confirming bias, not testing reasons.
  *   *Theory Drop:* You do not need to analyze *why* the valence changed metaphysically. You only need to observe *that* it changed.

  #### Phase 3: The Defeater Check (5 Minutes)
  **Question:** "What is the specific contextual difference between this case and the Near-Miss that allows the feature to hold its weight?"
  *   *Instruction:* Identify the "enabling condition." (e.g., "The feature 'family consent' counts for treatment *only when* the patient lacks capacity.")
  *   *Output:* Draft the one-sentence rationale: *"In contexts of [Enabling Condition], [Feature] provides a reason to [Action]."*
  *   *Judgment Call:* Determining if the "Enabling Condition" is specific enough to be true but general enough to be a rule. (This is the fragile point where checklist-ism creeps in; require 100% consensus here).

  #### Phase 4: The Null Statement (If Phase 2 or 3 Fails)
  **Instruction:** If the Valence Test fails or the Defeater Check reveals the "rule" is too specific to be useful, you must write the **Particularist Disclaimer**.
  *   **The Form Entry:** *"The moral relevance of [Feature] is contingent on the specific configuration of [Context A] and [Context B]; no generalizable principle applies beyond this case cluster."*
  *   *Accreditation Note:* This is a sentence. It is articulable. It is honest. It satisfies the letter of the requirement while flagging the limitation.

  ---

  ### What This Procedure Can and Cannot Do

  **What you can drop from the theory:**
  *   **Metaphysics of Reasons:** You do not need to debate whether moral properties exist.
  *   **Global Particularism:** You do not need to assert that *no* rules exist ever. You only need to assert that *this* rule might not hold.
  *   **Consistency Guarantees:** The procedure does not guarantee you will decide similar cases similarly. It guarantees you will *know* when you aren't.

  **What you cannot drop (or it collapses into a checklist):**
  *   **The Near-Miss Comparison:** If you skip searching the register, you are just intuition-pumping. The register is the external check on your bias.
  *   **The Null Option:** If you force a rule when the Valence Test fails, you are lying. The Null Statement is the safety valve.
  *   **The Valence Question:** Asking "Does this count for or against?" is distinct from "Is this present?" You must ask about the *direction* of the reason.

  **Where the Judgment Calls are Disguised as Steps:**
  1.  **Selecting the Near-Miss:** Two committee members might pick two different past cases. This determines the outcome. *Mitigation:* If you can't agree on the Near-Miss within 2 minutes, default to the Null Statement.
  2.  **Defining the Enabling Condition:** One person's "context" is another person's "rule." *Mitigation:* If the condition requires more than two variables to define, it is not a rationale; it is a case description. Use the Null Statement.

  ---

  ### Application to Your Three Cases

  #### Case 1: The "Futile" ICU Standoff
  *   **Scenario:** Family insists on continued ICU care. Team calls it medically inappropriate.
  *   **Phase 1 (Feature):** "Family request for continued physiological support."
  *   **Phase 2 (Valence Test):** Near-Miss is a case from 18 months ago (DNR conflict). In that case, "Family request" counted *against* overriding treatment (i.e., we honored it). Here, it counts *against* providing treatment (i.e., we are overriding it).
  *   **Result:** Valence Swap Detected. The feature "Family Request" changed direction.
  *   **Phase 4 (Null Statement):** You cannot write "Family wishes should be honored."
  *   **Drafted Rationale:** *"The moral relevance of family requests for continued support is contingent on the medical probability of recovery; no generalizable principle applies when physiological futility is established."*
  *   **Outcome:** Acceptable. It clarifies that the rule isn't "honor family," but "honor family *unless* futile."

  #### Case 2: The Twin Case (No Family)
  *   **Scenario:** Clinically identical to a case from last year where you withdrew care based on "substituted judgment provided by spouse." This patient has no family at the bedside.
  *   **Phase 1 (Feature):** "Absence of surrogate objection."
  *   **Phase 2 (Valence Test):** Near-Miss is last year's case. In that case, "Spouse objection" was the *decisive reason* to continue care temporarily. Here, "Absence of surrogate" is being used as a reason to withdraw care.
  *   **The Problem:** The committee realizes the previous rationale ("Defer to surrogate") was actually dependent on the *presence* of a surrogate.
  *   **Phase 3 (Defeater Check):** Can you generalize this? "In the absence of a surrogate, care is withdrawn." But what if the patient had an advance directive? The "Enabling Condition" becomes so complex it's useless.
  *   **Outcome (The one you won't like):** The procedure forces you to admit that last year's decision was not based on a stable principle, but on the particular presence of a spouse.
  *   **Drafted Rationale (Null):** *"The decision rests on the specific absence of a surrogate in the context of unclear prior wishes; this does not generate a general rule for unrepresented patients."*
  *   **Why you won't like it:** It exposes that your service's precedent is weaker than you thought. It invites scrutiny on why "no family" leads to withdrawal now, when "family present" led to continuation then. It forces you to tell the accreditation body: "We don't have a rule for this, we just made a call."

  #### Case 3: The Violent Patient
  *   **Scenario:** Patient has history of violence toward staff. Staff want to limit bedside interaction/analgesia access.
  *   **Phase 1 (Feature):** "History of aggression toward caregivers."
  *   **Phase 2 (Valence Test):** Near-Miss is a case involving a non-compliant diabetic patient (refused meds, yelled). In that case, "Hostile behavior" was treated as *noise* (ignored for ethical decision-making). Here, staff argue it is a *reason* to limit care.
  *   **Phase 3 (Defeater Check):** Committee argues. Is the difference "physical safety" vs. "verbal hostility"?
  *   **The Trap:** If you write "Violence justifies limiting care," you risk biasing against difficult patients in the future. If you write "Violence is irrelevant," you ignore staff safety.
  *   **Outcome:** The Valence Test reveals a conflict. In Case A (Diabetic), behavior was noise. In Case B (Violent), behavior is signal.
  *   **Drafted Rationale:** *"Threats to physical safety alter the moral weight of patient behavior, whereas non-compliance alone does not."*
  *   **Critique:** This is a borderline Null. It's a distinction without a clear difference. The procedure flags this as high-risk for future inconsistency.

  ---

  ### Plainly: What This Procedure Cannot Do

  1.  **It cannot guarantee accreditation satisfaction.** If your accreditor wants a universal principle (e.g., "Always honor autonomy"), the Null Statement will frustrate them. You are trading compliance comfort for ethical honesty.
  2.  **It cannot resolve deep disagreement.** If the committee splits 2-2 on whether the Near-Miss is relevant, the protocol defaults to Null. This protects you from lying, but it doesn't solve the moral distress in the room.
  3.  **It cannot protect you from liability.** A Null Statement admits that the decision was particular. In a lawsuit, plaintiffs prefer general rules they can argue you violated. Particularism is legally riskier than principled consistency, even when ethically more accurate.
  4.  **It cannot fix a broken register.** If your past consults are poorly documented, the Near-Miss search will fail, forcing you into Null Statements constantly. The procedure relies on the quality of your historical data.

  ### Final Recommendation
  Adopt the **Null Statement** as a standard option on your form. Do not hide it. If the accreditation body pushes back, your argument is: *"A false generalization is clinically dangerous. We are providing the most accurate rationale possible: that this decision is context-bound."*

  This procedure turns the accreditation requirement from a demand for false certainty into a tool for auditing your own consistency. It will hurt sometimes (Case 2), but it will stop you from writing rules you don't actually believe.
