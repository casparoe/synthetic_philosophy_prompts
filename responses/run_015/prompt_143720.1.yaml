      **Project Title:** The Hidden Loop: Clinical Trial Gates and Diagnostic Drift
      **Applicant:** [Name]
      **Duration:** 3 Months (Summer)

      **The Pitch**
      Ian Hacking's "looping effects" are usually told as a story about people. A patient gets a label, internalizes it, changes their behavior, and the classification shifts to catch the new behavior. It's psychological and interpersonal. But I think there's a second, structural loop running underneath that nobody's really mapping. It happens in the backend of clinical trial design.

      Here's the half-baked core idea: When DSM-5 dimensional scores for personality disorders (PDs) get used as inclusion/exclusion gates in pharma studies, the trial population itself shifts. This skewed population generates data that feeds back into the normative stats used to revise the cutoffs. So the loop isn't just Classification -> Identity -> Behavior. It's Classification -> Recruitment Criteria -> Prevalence Distortion -> Revised Dimension -> New Classification.

      **The Two-Tier Mechanism**
      I'm proposing we distinguish between two types of looping:
      1.  **The Identity Loop (Hacking's Classic):** The patient knows the label and acts accordingly. The feedback is behavioral.
      2.  **The Recruitment Loop (My Proposal):** The trial protocol uses a specific score cutoff (e.g., "ZAN-BPD score > 14"). This filters out anyone who doesn't fit the statistical norm *of that moment*. The resulting trial data becomes the "evidence" for what the disorder looks like, which informs the next DSM revision or guideline update. The feedback is statistical and structural.

      The key difference? In the Identity Loop, the human changes. In the Recruitment Loop, the *sample* changes, which changes the math behind the diagnosis.

      **Why the Literature Misses This**
      Existing sociology of diagnosis focuses on the clinic—the doctor-patient interaction, insurance billing, or patient advocacy groups. They look at how labels stick to people. They don't look at ClinicalTrials.gov inclusion criteria. They miss the recruitment channel because it looks like boring methodology. But trial protocols are where the operational definitions get hardened. If pharma only funds trials on high-severity dimensional scores, the "average" patient disappears from the literature, making the disorder look more severe than it is, which justifies higher cutoffs later. It's a selection bias that masquerades as clinical evidence.

      **The Plan (3 Months)**
      Since this is a summer grant, I'm not doing empirical patient work. I'm mapping the mechanism. I'll compare Personality Disorders (moving toward dimensional models) against ADHD (mostly still categorical).

      *   **Month 1: Criteria Mapping.** I'll pull the DSM-5-TR specs for Borderline PD (dimensional traits) and ADHD (categorical symptoms). I'll document exactly how severity is scored and where the cutoffs live.
      *   **Month 2: Trial Audit.** I'll search clinical trial registries for the last 10 years of pharma studies for both conditions. I'm looking for the inclusion/exclusion language. Do PD trials use specific score gates? Do ADHD trials just ask for a diagnosis? I want to quantify how much "gatekeeping" is happening in each.
      *   **Month 3: Tracing the Feedback.** This is the tricky part. I'll look at recent DSM revision proposals or workgroup papers to see if they cite trial population data as justification for changing cutoffs. I'm looking for the smoke that proves the fire exists.

      **Success vs. Failure**
      *   **Success:** I produce a clear diagram of the Recruitment Loop and a comparative table showing how PD trials use dimensional gates vs. ADHD categorical gates. If I can find even one instance where trial inclusion criteria were cited to justify a normative shift, that's a win.
      *   **Failure:** If the link between trial data and DSM revisions is too opaque (e.g., workgroup deliberations aren't public), I won't be able to close the loop. I might end up with just a description of trial criteria without proof of the feedback effect.

      **Honest Feasibility Check**
      Is 3 months enough? Honestly, probably not to prove the causal link. Tracing how trial data influences DSM revisions involves digging into closed-door workgroup notes that might not be public. So, I'm tempering expectations. This grant would fund a *prospectus* and a preliminary map, not a full historical sociology.

