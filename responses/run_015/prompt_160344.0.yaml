prompt: |-
  Hey — I'm in a Behavioral Decision Making course this term and the professor has let me run one 75-minute section on my own: 18 undergrads, mostly econ and psych majors, nobody with any formal decision theory. Topic is satisficing and bounded rationality. She said no lecture and no slides beyond a one-page handout, so I need an actual activity, not an explanation.

  What I want them to feel rather than be told: that stopping early can be the *rational* move instead of a character flaw, and that whether it is depends on the shape of the environment, not on some trait of the agent. And — the bit I care most about — I want them to run into the gap between doing well by the scoreboard and feeling fine about it. My guess is the people who stop early will end up with more points and feel worse about it, and I want that to be something they notice on their own, not something I announce.

  Some constraints I've been turning over, which maybe you can tell me are wrong:

  - Two separate costs: one for finding a new option (search) and one for finding out how good an option actually is (inspection). I want inspection expensive enough that they sometimes have to settle for a cheap proxy signal — I think satisficing only gets interesting there, and I don't want that to get flattened out.
  - Options should arrive over real time, one per round, so the deadline is something they feel in their gut rather than a number on a page.
  - Different tables get different underlying distributions — one flat-ish, one where a couple of great options are buried in a lot of mediocre ones, one where the proxy correlates with real quality and one where it basically doesn't — and nobody knows which one they're sitting in.
  - Everyone writes down an aspiration level before anything starts, and they can revise it during play but each revision costs something, so they can feel the pull of moving the goalposts when the search goes badly.

  What I need: materials and the handout text, exact rules, a payoff scheme in points (no real money, index cards and a timer only), a minute-by-minute timeline for 75 minutes, and a debrief. The debrief should map specific moments in the game onto specific parts of the satisficing story — setting the aspiration level, the stopping rule, search versus inspection cost, adaptation of the aspiration — and say what to do with the fact that different tables lived in different worlds. Then: what will predictably go wrong the first time I run it (I'm guessing someone tries to game the proxy, or the whole room is done in 20 minutes, or one table just refuses to stop), how I should handle each, and — honestly — which part of bounded rationality this game can't stage at all and that I'll have to just say myself at the end. Also give me one thing I can look at or ask at the very end that tells me whether it landed.

  One last thing: please don't just hand me the secretary problem in a different hat. I've seen that one and it's about optimal stopping when you know the arrival structure up front, which feels like almost the opposite of the point here.

  Oh, and write it in American English — half my section is international students and I dont want them picking up my British spellings.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**

      *   **Context:** Behavioral Decision Making course, 75-minute section, 18 undergrads (econ/psych), no formal decision theory background.
      *   **Instructor Constraints:** No lecture, no slides (except 1-page handout), must be an activity.
      *   **Core Learning Objectives:**
          1.  Stopping early can be rational (satisficing vs. maximizing).
          2.  Rationality depends on the *environment*, not just the agent.
          3.  **Crucial:** The gap between *score* (performance) and *feeling* (satisfaction/regret). High scorers might feel worse.
      *   **Specific Constraints/Preferences:**
          2.  Two costs: Search (finding new option) vs. Inspection (finding out quality). Inspection should be expensive enough to force reliance on proxies.
          3.  Real-time pressure (options arrive over time).
          4.  Heterogeneous environments (different tables get different distributions/correlations).
          5.  Aspiration levels: Set beforehand, costly to revise.
          6.  **NOT** the Secretary Problem (no known $N$, no focus on optimal stopping rules based on probability).
          7.  American English.
      *   **Deliverables:** Materials/Handout, Exact Rules, Payoff Scheme, Minute-by-Minute Timeline, Debrief Guide, Troubleshooting (what goes wrong), Limitations (what the game *can't* teach), Exit Ticket (did it land?).

  2.  **Deconstruct the Core Tension:**

      *   *Satisficing* (Simon): Pick the first option that meets an aspiration level.
      *   *Bounded Rationality:* Cognitive limits + Environmental structure.
      *   *The "Feeling" Gap:* Maximizers often get better outcomes but feel more regret/anxiety. Satisficers stop sooner, might get "good enough," and feel better. *Wait, the prompt says:* "My guess is the people who stop early will end up with more points and feel worse about it."
      *   *Correction/Refinement:* Usually, literature suggests satisficers are happier. However, the prompt specifically wants the *reverse* or at least a tension where high scorers feel worse *or* early stoppers feel doubt despite high scores. Let's aim for the prompt's specific intuition: Early stoppers (satisficers) might secure a solid score quickly but feel anxiety about "what if," while late stoppers (maximizers) might grind for marginally better points but exhaust their budget/time. Actually, re-reading: "people who stop early will end up with more points and feel worse about it." This is counter-intuitive to the standard "satisficing = happiness" literature (Schwartz et al.).
      *   *Interpretation:* If the environment is volatile, stopping early locks in a gain, but the *uncertainty* of the environment makes them feel they got lucky, not skilled. Or, if they set a high aspiration and meet it immediately, they feel suspicious.
      *   *Better Interpretation for the Game:* Let's design it so that "Search Cost" eats away points. If you stop early, you save search costs (high score). But because you didn't "look around," you feel less confident (low satisfaction). If you look around, you burn points (lower score) but feel more "informed" (higher confidence), *unless* you burn too much.
      *   *Actually, let's stick to the prompt's specific desire:* "I want them to run into the gap between doing well by the scoreboard and feeling fine about it." I need to ensure the mechanics allow for High Score/Low Satisfaction. This happens if the *cost of inspection* is high. If I stop early, I save costs (High Score). But I didn't inspect much, so I feel unsure (Low Satisfaction). If I inspect a lot, I burn points (Low Score) but feel sure (High Satisfaction).
      *   *Wait, one more constraint:* "Inspection expensive enough that they sometimes have to settle for a cheap proxy signal."
      *   *Okay, the plan:*
          *   **Option:** A card.
          *   **Proxy:** Color or Symbol (visible immediately).
          *   **True Value:** Number inside (costs points to reveal).
          *   **Search Cost:** Drawing a new card costs points.
          *   **Aspiration:** Pre-set target.
          *   **Revision Cost:** Changing the target costs points.
          *   **Environment:** Some tables have high correlation (Proxy = Value), some low. Some have high average values, some low.

  3.  **Drafting the Game Mechanics ("The Job Market" or "The Apartment Hunt"):**

      *   *Theme:* "The Gig Hunt." You need a job for the semester.
      *   *Materials:* Envelopes or folded cards.
      *   *Structure:*
          *   Each student gets a "Budget" (e.g., 100 points).
          *   Round 1: Set Aspiration Level (AL).
          *   Round 2+: Draw a "Listing."
          *   See Proxy (e.g., Company Logo/Color).
          *   Decide: Reject (Search Cost), Inspect (Inspection Cost), or Accept (Stop).
          *   If Accept: Final Score = Value - Remaining Budget Costs.
          *   If Time Runs Out: Penalty.
      *   *The Twist:* Different tables have different decks.
          *   Table A: High correlation (Proxy predicts Value).
          *   Table B: Low correlation (Proxy is noise).
          *   Table C: High Variance (Rare gems).
          *   Table D: Low Variance (Everything average).
      *   *The Feeling:* Post-game survey. "How confident are you?" "Do you regret stopping?"

  4.  **Refining the "Feeling Gap":**

      *   To get the prompt's specific outcome (Stop Early = High Points, Low Satisfaction):
          *   Make Inspection Cost high.
          *   If you stop early, you preserve points (High Score).
          *   But because Inspection was expensive, you *didn't* inspect. You relied on the Proxy.
          *   If the Proxy was ambiguous (which it should be, since they don't know their table's correlation), they will feel anxious they missed a better one.
          *   Maximizers who inspect everything burn points (Lower Score) but feel they "did their due diligence."
      *   *Wait, if they stop early, they satisfy their Aspiration.* If they set a reasonable AL, they stop.
      *   *Revision Cost:* This is key. If the market is bad, they *must* revise AL down. That feels like failure. If they stick to it and find nothing, they crash. If they lower it and accept, they feel like they "settled."
      *   *Okay, I will design the debrief to highlight this specific tension.*

  5.  **Developing the Materials:**

      *   **Handout:** Needs to be one page. Rules, Score Sheet, Reflection Questions.
      *   **Cards:** Need to be prepped by the instructor.
          *   Front: Proxy (e.g., A, B, C or Red, Blue, Green).
          *   Back: True Value (e.g., 10-90).
          *   Deck composition varies by table.
      *   **Timer:** Visible countdown.

  6.  **Timeline (75 Minutes):**

      *   0-5: Intro & Setup (Groups of 3? No, 18 students. 6 tables of 3 works best for discussion, or 3 tables of 6. Let's do 6 tables of 3 for easier deck management).
      *   5-10: Aspiration Setting (Private).
      *   10-40: The Game (30 mins of real-time pressure).
      *   40-50: Scoring & Reflection (Private).
      *   50-75: Debrief & Discussion.

  7.  **Addressing the "Not Secretary Problem" Constraint:**

      *   Secretary Problem assumes you know $N$ (total applicants) and cannot recall.
      *   Here: $N$ is unknown (deck size hidden or infinite draw with replacement? No, finite deck but unknown size is better). Let's say "You have 20 minutes. The deck runs out or time runs out."
      *   Key difference: Focus on *cost of information* and *aspiration adjustment*, not optimal stopping probability.

  8.  **Troubleshooting:**

      *   *Gaming the proxy:* If they figure out the correlation too fast. *Fix:* Make the correlation noisy, not perfect.
      *   *Done in 20 mins:* Make search costs accumulate or make the aspiration hard to hit initially.
      *   *Refusal to stop:* Hard stop at timer. Penalty for no hire.
      *   *Collusion:* They talk across tables. *Fix:* "Do not discuss strategy with other tables."

  9.  **Limitations:**

      *   Can't simulate emotional attachment to the option (endowment effect).
      *   Can't simulate social pressure.
      *   Can't fully replicate long-term regret (only immediate post-game feeling).

  10. **Exit Ticket:**

      *   One question: "If you could replay with the same deck, would you change your Aspiration Level or your Search Strategy? Why?"

  11. **Drafting the Content (Iterative refinement for tone and constraints):**

      *   *Tone:* Professional, instructional, American English.
      *   *Handout:* Clean, minimal.
      *   *Debrief:* Scripted enough to be useful, flexible enough for reality.
      *   *Specific focus:* Ensure the "Environment vs. Agent" point lands. The tables with "Bad Decks" shouldn't feel stupid for low scores.

  12. **Review against Prompt Constraints:**

      *   75 mins? Yes.
      *   18 undergrads? Yes (6 groups of 3).
      *   No lecture/slides? Yes.
      *   Search vs. Inspection cost? Yes (Draw cost vs. Reveal cost).
      *   Real-time deadline? Yes (Timer).
      *   Different distributions? Yes (4 deck types distributed among 6 tables).
      *   Aspiration revision cost? Yes.
      *   Score vs. Feeling gap? Yes (Built into payoff structure).
      *   Not Secretary Problem? Yes (Focus on costs/aspiration, not $1/e$ rule).
      *   American English? Yes.

  13. **Final Polish:** Check the math on points to ensure "Stopping Early" actually yields more points.
      *   Start: 100 points.
      *   Search Cost: 2 points per new card.
      *   Inspection Cost: 5 points per reveal.
      *   Value: 10 to 90.
      *   If I stop at Card 1 (Value 60): Score = 60. Costs = 0 (assuming first is free/cheap).
      *   If I search 5 cards, inspect 3, find Value 70: Score = 70 - (5*2) - (3*5) = 70 - 10 - 15 = 45.
      *   *Result:* Early stopper gets 60. Grinder gets 45. Early stopper wins on points.
      *   *Feeling:* Early stopper thinks "Was there a 90 out there?" Grinder thinks "I know what was out there."
      *   *Perfect.* This matches the prompt's requirement.

  14. **Writing the Response.** (Self-Correction during drafting: Ensure the handout fits on one page as requested. Ensure the debrief explicitly maps game moments to theory.)

      *   *Wait, one detail:* "Different tables get different underlying distributions." I need to make sure the Instructor knows how to prep this. I will add a "Instructor Prep" section.
      *   *Aspiration Revision:* Needs to be explicit. "Write down AL. If you change it, pay 10 points."
      *   *Debrief:* Need to make sure I address the "Environment" point. Tables with "Bad Decks" (low correlation) should realize their strategy didn't work not because they were dumb, but because the world was noisy.

  15. **Final Check on "American English":** (Color vs Colour, Realize vs Realise, Program vs Programme, etc.)

      *   *Okay, ready to generate.*
answer: |-
  Here is a complete lesson plan designed for your 75-minute section. It is built to be run with zero lecture, relying entirely on the mechanics of the game and the subsequent debrief to drive the theoretical points home.

  # Instructor Prep (Do this before class)

  **Materials Needed:**
  *   **6 Tables** (3 students per table).
  *   **6 Decks of Cards** (Index cards, folded in half or in envelopes).
      *   *Front (Visible):* A symbol (★, ●, ▲).
      *   *Back (Hidden):* A point value (10–90).
      *   *Deck Composition (Crucial):*
          *   **Tables 1 & 2 (High Correlation):** ★ = High Value (70-90), ● = Med (40-60), ▲ = Low (10-30).
          *   **Tables 3 & 4 (Low Correlation):** Symbols are random noise. Values are mixed.
          *   **Tables 5 & 6 (High Variance):** Mostly low values (10-30), but rare ★ cards are worth 95.
  *   **Timer:** Projected on a screen or visible phone clock.
  *   **Handouts:** 18 copies (one per student).
  *   **Pens:** For everyone.

  **The Logic of the Payoff:**
  The math is rigged so that *searching* destroys value. A student who finds a "90" but pays 50 points in search/inspection costs ends up with 40. A student who stops at the first "60" pays 0 costs and ends up with 60. The "Maximizer" gets a better *card*, but a worse *score*. The "Satisficer" gets a worse *card*, but a better *score*. However, the Satisficer will feel anxiety about the unknown.

  ---

  # The One-Page Handout

  *(Print this double-sided or single-sided, but keep it to one physical page)*

  **ACTIVITY: THE GIG MARKET**
  **Goal:** Maximize your **Final Score**.
  **Starting Budget:** 100 Points.

  **RULES**
  1.  **Aspiration Level (AL):** Before starting, write down the minimum point value you will accept on a card. **Changing your AL costs 10 points.**
  2.  **Search:** Draw a card from the deck. Look at the **Symbol** (★, ●, ▲). This is free.
  3.  **Inspect:** Pay **5 points** to unfold the card and see the **Value**.
  4.  **Accept:** Keep the card. Game over for you.
  5.  **Reject:** Fold the card, return it to the deck, shuffle. Pay **2 points** (Search Cost). Draw again.
  6.  **Time Limit:** 25 Minutes. If time runs out and you have no card, your score is **0**.

  **SCORE SHEET**
  *   Starting Budget: 100
  *   (-) Inspection Costs: $5 \times$ \_\_\_\_\_ cards = \_\_\_\_\_
  *   (-) Search Costs: $2 \times$ \_\_\_\_\_ rejects = \_\_\_\_\_
  *   (-) AL Revisions: $10 \times$ \_\_\_\_\_ changes = \_\_\_\_\_
  *   (+) Accepted Card Value: \_\_\_\_\_
  *   **= FINAL SCORE:** \_\_\_\_\_

  **PRIVATE REFLECTION (Do not show neighbors)**
  1.  How confident are you (0-100%) that you made the best possible choice? \_\_\_\_\_%
  2.  Do you feel you "settled"? (Yes / No)
  3.  If you could replay this exact game, would you change your Aspiration Level? (Yes / No)

  ---

  # Minute-by-Minute Timeline (75 Minutes)

  **00:00 – 00:05 | Setup & Grouping**
  *   Seat students (6 tables of 3).
  *   Hand out materials.
  *   **Script:** "Welcome. You are in a job market. You need one gig. You have a budget of points. Your goal is to maximize your Final Score. Read the handout. You have 3 minutes to set your Aspiration Level privately. Do not talk yet."

  **00:05 – 00:08 | Aspiration Setting**
  *   Students write their AL on the sheet.
  *   **Script:** "Write it down. If you change your mind later, it costs 10 points per change. Start the timer." (Start 25-minute countdown).

  **00:08 – 00:33 | The Game (Real-Time Pressure)**
  *   Students play. Tables will diverge quickly.
  *   **Table 1 & 2 (High Corr):** Will likely trust symbols, inspect less, stop sooner.
  *   **Table 3 & 4 (Low Corr):** Will get frustrated. Symbols lie. They will inspect more, burn points, or revise AL.
  *   **Table 5 & 6 (High Var):** Will see mostly junk. Will feel pressure to revise AL down.
  *   **Instructor Role:** Walk around. Do not answer strategy questions. Only answer rule clarifications. If a table finishes early, tell them: "Sit tight. Do not discuss your score with other tables."
  *   **Announcement at 10 mins:** "10 minutes remaining. Check your budget."
  *   **Announcement at 2 mins:** "2 minutes. If you have no card, you are at risk of zero."

  **00:33 – 00:40 | Scoring & Reflection**
  *   **Script:** "Stop. Accept the card you are holding, or take the zero. Calculate your Final Score. Complete the Private Reflection section. Do not compare scores with your table yet."
  *   *Why:* This isolates the *feeling* from the *social comparison*.

  **00:40 – 00:50 | Table Talk**
  *   **Script:** "Compare scores and feelings with your table. Did the person with the highest score feel the best? Did anyone change their Aspiration Level? Why?"
  *   *Task:* Ask each table to identify one person who stopped "too early" and one who searched "too long."

  **00:50 – 01:15 | The Debrief (The Core Lesson)**
  *   *See detailed script below.*

  ---

  # The Debrief Guide

  *Do not lecture. Ask questions and map their answers to the concepts.*

  **1. The Score vs. Feeling Gap (10 mins)**
  *   **Ask:** "Raise your hand if your Final Score was above 60." (Likely the early stoppers).
  *   **Ask:** "Of those hands, how many answered 'No' to 'Do you feel you settled?' or gave low confidence?"
  *   **Point:** "You have high scores but low confidence. Why?"
  *   **Theory:** This is the cost of *inspection*. By not paying to inspect, you saved points (rational), but you remained ignorant (psychologically costly). Satisficing preserves resources but sacrifices the *feeling* of optimization.
  *   **Ask:** "Who searched until the end and got a lower score?"
  *   **Point:** "You paid for information. You bought confidence, but it lowered your payoff. Was that irrational? Not necessarily. It depends on what you value: points or certainty."

  **2. Environment vs. Agent (10 mins)**
  *   **Ask:** "Table 1, what was your strategy?" (Likely: "Trust the Star symbol.")
  *   **Ask:** "Table 3, did that work for you?" (Likely: "No, the Star was trash.")
  *   **Point:** "You used the same heuristic (trust the proxy). Table 1 won; Table 3 lost. Was Table 3 stupid?"
  *   **Theory:** **Ecological Rationality.** A strategy isn't smart or dumb on its own. It is only smart *relative to the environment*. Bounded rationality isn't about human limits; it's about matching your limits to the world's structure.
  *   **Reveal:** Tell them the deck compositions. Watch the Tables 3 & 4 realize their "failure" was structural, not personal.

  **3. Aspiration & Revision (5 mins)**
  *   **Ask:** "Who paid the 10-point penalty to change their Aspiration Level?"
  *   **Point:** "In theory, you should adjust AL based on feedback. In reality, it feels like failure. That 'cost' isn't just points; it's ego. Satisficing works best when you can set a flexible AL. If you treat AL as a rigid goal, you turn satisficing into maximizing."

  ---

  # Troubleshooting: What Will Go Wrong

  **1. "The Room Finished in 15 Minutes."**
  *   **Cause:** Search costs were too low or values too high.
  *   **Fix:** If this happens in real-time, announce a "Market Crash." Everyone's budget is cut by 20 points immediately. This forces them to re-evaluate stopping.
  *   **Post-Game:** If it already happened, use it in the debrief. "The market was too easy. In the real world, search costs usually increase over time (competition). How would that have changed your stop?"

  **2. "One Table Refused to Stop."**
  *   **Cause:** Competitive dynamics within the table.
  *   **Fix:** Enforce the hard stop. They get zero.
  *   **Debrief:** Use them as the martyr for Maximization. "They sought the best and got nothing. Is a strategy rational if it risks ruin?"

  **3. "Someone Gamed the Proxy."**
  *   **Cause:** A student at Table 1 peeks at other cards or figures out the correlation instantly.
  *   **Fix:** If you catch them, disqualify their score.
  *   **Debrief:** "Information asymmetry. In real markets, some agents know the distribution and others don't. If you don't know the correlation, relying on the proxy is a gamble, not a strategy."

  **4. "Everyone Feels Great."**
  *   **Cause:** The payoff gap wasn't wide enough.
  *   **Fix:** In the debrief, press harder on the *counterfactual*. "You feel great, but imagine I tell you there was a 90 in the deck you didn't see. Do you still feel great?"

  ---

  # Limitations: What This Game Can't Stage

  *You must state this explicitly at the end.*

  **Script:** "This game simulated search costs and environmental structure. But it missed two huge parts of bounded rationality:
  1.  **Endowment:** Once you picked a card, you didn't actually *keep* it for a semester. Real commitment creates emotional value that changes how you view the choice.
  2.  **Social Norms:** You didn't care what your parents thought of your 'job.' In real life, satisficing often feels like laziness because of social pressure, even if it's economically rational.
  We simulated the *math* of bounded rationality, but not the *social weight* of it."

  ---

  # The Exit Ticket (Did it land?)

  *Collect these as they leave. Do not grade them. Read them yourself to gauge success.*

  **Question:** "Imagine you are hiring for a role. You interview a candidate who is 'good enough' (meets all requirements) on Tuesday. You know interviews cost the company $1,000 each. You have 5 more candidates scheduled this week.
  **Do you hire Tuesday's candidate or wait?**
  **Write one sentence explaining why.**"

  *   **Success Indicator:** If they mention "cost of search," "environment uncertainty," or "good enough is optimal," the concept landed. If they say "you should always find the best," you need to adjust the debrief next time.

  ---

  # Instructor Notes on American English & Tone

  *   **Spelling:** Ensure all handouts use *color, realize, program, analyze* (z not s).
  *   **Tone:** Keep it facilitative. You are not the expert explaining the truth; you are the referee revealing the scoreboard. Let the data (their scores) argue for satisficing.
  *   **Constraint Check:** This is not the Secretary Problem. In the Secretary Problem, you know $N$ (total candidates). Here, they do not know how many cards are in the deck, nor do they know the distribution. They are operating under true ambiguity, which forces reliance on aspiration levels rather than optimal stopping rules.
