  **(Self-Correction on Causal Power):** If the UI is a predictive renderer, it's part of the causal chain. The "illusion" claim says it's *just* a side effect. But a predictive model *causes* action by minimizing error. So the "illusion" label becomes misleading. It's a "functional model."

  10. **Finalizing the Output Structure:**
