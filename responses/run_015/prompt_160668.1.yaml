  # Session Plan: The Coin Game
  **Facilitator's Guide**

  **Duration:** 90 Minutes
  **Participants:** 15–16 (Adult Education/Retired)
  **Goal:** To experience the tension between mathematical expectation and practical decision-making without prior theoretical framing.

  ---

  ## 1. Materials & Preparation

  **The Bank (Budget)**
  *   **Total Budget:** $200 in book vouchers (or equivalent).
  *   **Denominations:** Mix of $2, $4, $8, $16, $32. (Prepare a few $64 just in case, but do not display them).
  *   **House Credit:** 16 slips of paper marked "$20 Credit". This is *not* cash; it is a budget against which entry fees are deducted. Participants keep any unspent credit + winnings.

  **The Game Mechanism (Time-Saver)**
  *   **Pre-generated Sequences:** Prepare 20 sealed envelopes. Inside each is a card stating the outcome (e.g., "Heads on Toss 1", "Heads on Toss 3").
      *   *Distribution:* 10 envelopes with "Toss 1", 5 with "Toss 2", 3 with "Toss 3", 1 with "Toss 4", 1 with "Toss 5+".
      *   *Purpose:* This simulates the probability distribution without spending 40 minutes flipping coins.
  *   **Random Price Generator:** 16 small slips of paper numbered $1 to $16 (or $1–$20). Put them in a hat.

  **Room Setup**
  *   Tables of 4.
  *   Projector/Whiteboard (kept blank until the last 20 minutes).
  *   Pens and bidding slips for everyone.

  ---

  ## 2. Timeline (90 Minutes)

  | Time | Segment | Activity |
  | :--- | :--- | :--- |
  | **00–10** | **Setup & Rules** | Distribute Credit. Explain Game Rules. State Bank Limit. |
  | **10–25** | **Round 1: Private** | Becker-DeGroot-Marschak (BDM) Bidding. Individual valuation. |
  | **25–45** | **Round 2: Open** | Table discussion followed by open group bid. |
  | **45–55** | **Round 3: Bundle** | Pricing a ticket for 10 plays (added winnings). |
  | **55–65** | **The Doubt** | Group question: "When do you stop trusting the setup?" |
  | **65–75** | **The Reveal** | Open envelopes. Distribute winnings. Show variance. |
  | **75–90** | **Debrief** | Math on board. Map behavior to diagnoses. |

  ---

  ## 3. Scripts & Procedures

  ### 00–10: Setup & Rules
  **Action:** Hand out the $20 Credit slip to each person.
  **Script:**
  > "Tonight we are running a game of chance. Here are the rules:
  > 1. I have a fair coin. I will toss it until it lands Heads.
  > 2. If Heads comes on the 1st toss, the Bank pays $2.
  > 3. If Tails then Heads (2nd toss), the Bank pays $4.
  > 4. If Tails, Tails, Heads (3rd toss), the Bank pays $8.
  > 5. The prize doubles for every Tails before the first Heads.
  >
  > **The Bank Statement:** I have $200 in vouchers in this room. That is the total liquidity of the Bank. If the game demands more than I have, the Bank closes, and I pay what remains. I am not an infinite entity.
  >
  > **Your Goal:** You have a $20 Credit. You may choose to buy a ticket to play this game. If you buy a ticket, the cost is deducted from your Credit. You keep the unspent Credit plus whatever the game pays. If you choose not to buy, you keep your $20 Credit."

  ### 10–25: Round 1 (Private Valuation)
  **Goal:** Elicit true personal value without social pressure.
  **Mechanism:** BDM (Becker-DeGroot-Marschak).
  **Script:**
  > "Write down privately the maximum amount you would pay to play this game **once**.
  >
  > Here is how I will process this: I will draw a random number from this hat (range $1–$20).
  > *   If the drawn number is **lower** than what you wrote: You **must** buy the ticket at the drawn price. (e.g., You wrote $10, Draw is $5. You pay $5, play the game).
  > *   If the drawn number is **higher** than what you wrote: You **do not** play. You keep your full $20 Credit.
  >
  > *Why this matters:* If you write a number higher than the game is worth to you, you risk being forced to buy at a price you think is too high. If you write a number lower, you risk missing a deal you would have liked. The best strategy is to write exactly what the play is worth to you."

  **Action:** Collect slips. Do not reveal results yet. (To save time, tell them you will process the results at the end, but the bids are locked). *Correction:* For the exercise to work, they need to know if they "won" the bid to feel the stakes.
  **Efficiency Fix:** Pre-draw 16 numbers. Hand each person their "Market Price" slip immediately after they write their bid. They calculate instantly if they are playing.

  ### 25–45: Round 2 (Open Bidding)
  **Goal:** Observe social anchoring and consensus.
  **Script:**
  > "Forget the previous round. You have a fresh $20 Credit.
  > Discuss at your tables: What is a reasonable price for one play?
  > After 5 minutes, we will bid openly. I will start the auction at $1. The highest bidder wins the right to play one game at their bid price."
  *(Note: Select one volunteer per table to play, or let everyone bid but only the highest in the room actually plays to save vouchers. Better: Let everyone play at the 'Clearing Price' determined by the group consensus to keep engagement high.)*
  **Revised Script for Engagement:**
  > "Discuss at your tables. Agree on a single 'Fair Price' for the group. Write it down. We will compare table prices. Then, I will ask for a show of hands: Who would play at $2? $4? $8? We will find the room's clearing price."

  ### 45–55: Round 3 (The Bundle)
  **Goal:** Highlight Ensemble vs. Time Average.
  **Script:**
  > "New scenario. You are not buying one play. You are buying a **Bundle of 10 plays**.
  > You pay one entry fee. You play the game 10 times. Your winnings are summed.
  > Write down privately: What is the maximum you would pay for this Bundle?"
  *(Collect bids. Do not process. This is for discussion data only).*

  ### 55–65: The Doubt Question
  **Goal:** Surface Model Validity concerns.
  **Script:**
  > "Put the money aside. Imagine you are watching the game. I toss Tails. I toss Tails again.
  > At what point do you stop thinking 'I might win big' and start thinking 'Something is wrong'?
  > Is it 5 Tails? 10 Tails? 20?
  > Shout out your number. Does anyone doubt the coin? The Bank? The rules?"

  ### 65–75: The Reveal (Simulation)
  **Action:** Open 5–6 pre-generated envelopes in front of the room.
  **Likely Outcome:** Most will be $2 or $4. One might be $8. Unlikely to be higher.
  **Action:** Pay out the Round 1 winners based on their locked bids.
  **Observation:** Point out how few people actually won big, despite the theoretical potential.

  ### 75–90: Debrief & Math
  **Action:** Turn on projector/Use whiteboard.
  **Script:**
  > "Let's look at the math we ignored."
  > Write: $P(Heads) = 1/2$. Payoff = $2$. Contribution = $1$.
  > Write: $P(Tails, Heads) = 1/4$. Payoff = $4$. Contribution = $1$.
  > Write: $1 + 1 + 1 + ... = \infty$.
  > "The Expected Value is infinite. Yet, almost no one bid more than $20."

  ---

  ## 4. The Debrief: Mapping Moments to Diagnoses

  Use this grid to guide the final discussion. Do not lecture; ask the group to match their behavior to these explanations.

  | Moment in Session | Diagnosis / Concept | Facilitator Prompt |
  | :--- | :--- | :--- |
  | **Low Private Bids** (Round 1) | **Diminishing Marginal Utility.** $20 means more to you than $200. | "Why didn't anyone bid $100, even though the math says you should?" |
  | **Round 3 vs Round 1** | **Ensemble vs. Time Average (Ergodicity).** Averages work over many trials, not one. | "Did your price for 10 plays go up more than 10x the single play price? Why does repetition change the risk?" |
  | **The Bank Statement** | **Solvency / Truncation.** The model assumes infinite wealth; reality does not. | "I told you I only had $200. Did that change your bid? The math assumes I have infinite money. I don't." |
  | **The Doubt Question** | **Model Validity.** Heavy tails signal a broken model, not just bad luck. | "If I tossed 20 Tails, you'd suspect a trick. In physics, when data diverges, we check the apparatus, not just the theory." |
  | **The Math Reveal** | **Divergence.** The sum grows without bound. | "The sum is infinite. But you cannot eat an infinite sandwich. Why does the sum not match the value?" |

  ### What This Session Cannot Discriminate
  Be explicit about this. The following theories predict the *same* low bidding behavior in this room:
  1.  **Risk Aversion:** People hate losing the entry fee more than they love winning.
  2.  **Utility Curves:** Money is worth less as you have more.
  3.  **Solvency Doubt:** People implicitly assume the Bank will fail before the big payout.
  *Tell the group:* "We cannot tell from tonight which of these is the 'true' reason. They all lead to the same decision: don't pay much."

  ### What This Session Cannot Reproduce
  *   **True Unboundedness:** You capped the bank at $200. The mathematical paradox requires an *infinite* bank.
  *   **Facilitator's Closing Line:** "The math assumes a Bank that cannot go broke. In this room, the Bank can go broke. The paradox lives in the gap between the infinite model and the finite world."

  ---

  ## 5. Troubleshooting: Predictable Failures

  **1. The "Know-It-All"**
  *   **Risk:** Someone shouts "It's the St. Petersburg Paradox!" in minute 5.
  *   **Absorption:** Do not shut them down. Validate and park.
  *   **Script:** "You're likely right. But I need the rest of the group to feel the problem before we name it. Can you help me by keeping the name in your pocket until the end? I'll need your help explaining it then."

  **2. The "Joker"**
  *   **Risk:** Someone bids the full $20 Credit or $100 to be funny.
  *   **Absorption:** Use the Bank Limit as the enforcer.
  *   **Script:** "If you bid that high, and the random draw is low, you are legally committed to pay. That comes out of your Credit. If you run out of Credit, you can't play. Are you sure you want to risk your Credit on a joke?" (Usually, they retreat).

  **3. Anchoring (Open Bidding)**
  *   **Risk:** The first person to speak in Round 2 sets a low bar ($2) that everyone follows.
  *   **Absorption:** This is actually data. It shows social proof.
  *   **Script:** "Notice how quickly the group agreed on $2? In Round 1, privately, some of you wrote $5 or $10. Why did the group value drop when you spoke to each other?"

  **4. BDM Confusion**
  *   **Risk:** Participants don't understand the "Draw vs. Bid" rule.
  *   **Absorption:** Use a concrete example on the board before starting.
  *   **Script:** "Example: You write $5. I draw $3. $3 is lower than $5. You pay $3 and play. You write $5. I draw $8. $8 is higher. You do not play. You pay nothing."

  ---

  ## 6. Facilitator's Cheat Sheet (Physics/Chemistry Angle)

  Since you have a background in physical chemistry, use these analogies if the group gets stuck:

  *   **Ensemble vs. Trajectory:** "In stat-mech, we average over particles (ensemble). Here, you are one particle over time. The average of the room is not the average of your life."
  *   **Model Validity:** "In the lab, if a measurement is 10-sigma off, we don't say 'rare event'. We say 'instrument error'. Your doubt at 10 Tails is the scientific instinct kicking in."
  *   **Divergence:** "It's like a series that doesn't converge. The sum keeps growing, but the physical system (the Bank) breaks before the sum matters."

  ## 7. Final Outcome Check
  By the end of the 90 minutes, every participant should be able to answer:
  1.  **Why does the value diverge?** (Because $1/2 \times 2 + 1/4 \times 4...$ adds up to $1+1+1...$)
  2.  **Why didn't you bid that much?** (Because the Bank is finite, the odds are tiny, and one loss hurts more than a rare win helps.)

  *Do not hand out a reading list. Let the discomfort of the unanswered question be the takeaway.*
