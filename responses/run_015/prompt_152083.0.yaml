prompt: |-
  hey — I'm in a small reading group working through the accuracy-first / epistemic consequentialist side of epistemology, and we got stuck on indirect normativity last week and I've been turning it over since. Here's where I landed; tell me if I've misread it. As I get it, the idea is a reply to the objection that a consequentialist standard just totals up accuracy across unrelated propositions, and so can't really respect that your evidence for one claim is separate from your evidence for another. The reply is supposed to be: fine, but accuracy was never the thing that answers your first-personal question "should I believe p?" — it evaluates belief states (or the dispositions that produce them) from outside. It's normative, just not directly. OK. But then I thought: if that's the shape of it, the real unit of deliberation has to be the policy, not the individual belief. What I choose isn't whether to believe p, it's which belief-forming policy to run. And then deliberation just becomes a plain expected-value calculation: list the candidate policies (strict conditionalizer, defer to experts, suspend on anything contested, whatever), score each one by expected accuracy given what I currently think — I actually started a spreadsheet with a Brier-style scoring rule — and adopt the argmax. Accuracy stays the fundamental standard, and it stays indirect in the sense that it doesn't whisper in your ear while you're in the middle of thinking; it just ranks the policies from outside.

  My friend said that's exactly the move indirect normativity is supposed to block, but she couldnt say why, and I really don't see it — if accuracy is the standard, how is adopting the accuracy-maximizing policy not the rational thing to do? The bit that does worry me is that the expected accuracies are all computed from my own current credences, so the procedure feels like it might just hand my existing opinions back to me. I was going to patch that by scoring the policies with the credences I'd have after idealized deliberation instead — unlimited reflection, no cognitive or motivational biases, logical omniscience, the lot — so the ranking is at least the one an ideal deliberator would arrive at. But now I worry that fix is worse than the bug: once the deliberator is idealized like that, the policy framing seems to evaporate. An agent with no computational limits and no biases doesn't need a policy for managing its own future updating; there's no tradeoff left for it to adjudicate, so "what would idealized deliberation choose?" either has no answer or has an answer that tells a bounded agent like me nothing about what to do on Monday. So is my spreadsheet a clumsy implementation of a basically sound idea, or is the idea itself the mistake? Does swapping in idealized credences fix the self-certification worry, or does idealizing the deliberator make the deliberation problem collapse (or blow up) in a way I'm not seeing? And where does that leave the question I actually started with — should I believe p? Does accuracy have nothing at all to say about that question, or does it come back in once the policy-level stuff is settled?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Position and Question:**
      *   **Context:** Small reading group on accuracy-first epistemology / epistemic consequentialism.
      *   **Topic:** Indirect normativity (specifically, how it handles the "separation of evidence" objection).
      *   **User's Interpretation:** Indirect normativity means accuracy evaluates belief-forming *policies* (dispositions), not individual beliefs directly. Therefore, deliberation should be about choosing the policy with the highest expected accuracy (argmax).
      *   **User's Method:** Create a spreadsheet, score policies (conditionalization, deference, etc.) using a Brier-style rule based on current credences, and adopt the winner.
      *   **Friend's Objection:** This move is exactly what indirect normativity is supposed to *block*, but she couldn't explain why.
      *   **User's Worry 1 (Self-Certification):** Scoring policies based on *current* credences just validates existing biases/opinions (circularity).
      *   **User's Proposed Fix:** Score policies based on *idealized* credences (logical omniscience, unlimited reflection).
      *   **User's Worry 2 (Idealization Collapse):** If the deliberator is ideal, they don't need heuristics/policies. The problem evaporates for them, leaving the bounded agent with no guidance.
      *   **Core Questions:**
          1.  Is the spreadsheet approach a sound implementation or a category mistake?
          2.  Does swapping in idealized credences fix self-certification or collapse the problem?
          3.  Where does this leave the first-personal question "Should I believe $p$?"

  2.  **Deconstruct the Philosophical Landscape:**
      *   **Accuracy-First Epistemology:** Joyce, Pettigrew, etc. Truth/Accuracy is the fundamental epistemic value.
      *   **Direct vs. Indirect Consequentialism:**
          *   *Direct:* Believe $p$ iff doing so maximizes expected accuracy *right now*. (Leads to "epistemic akrasia" or "truth-jacking" – believing something because it makes you happy/accurate in a weird way, rather than because of evidence).
          *   *Indirect:* Adopt the *rule/disposition* that generally leads to accuracy, even if following it in a specific case doesn't maximize accuracy *in that specific instance* (analogous to Rule Utilitarianism).
      *   **The "Separation of Evidence" Objection:** Consequentialism looks at the whole system. But epistemology feels like it respects the *specific* evidence for $p$. Indirect normativity tries to respect this by saying "Follow the rule that respects evidence," rather than "Believe $p$ because it boosts the total score."
      *   **The User's "Spreadsheet" Move:** This sounds like *Global Consequentialism* or a specific version of *Rule Consequentialism* where the agent consciously calculates the best rule.
      *   **The Friend's Intuition:** She's likely hinting at the distinction between the *criterion of rightness* and the *decision procedure*. If you make the decision procedure "calculate expected accuracy of rules," you might reintroduce the problems indirect normativity was meant to solve (e.g., instability, self-undermining rules).
      *   **The Idealization Problem:** This touches on the "ought implies can" issue and the distinction between *ideal norms* and *feasible norms*.

  3.  **Address the Specific Questions:**

      *   **Q1: Is the spreadsheet a sound implementation?**
          *   *Problem:* It conflates the *criterion of rightness* (accuracy) with the *decision procedure* (maximizing expected accuracy of policies).
          *   *Why the friend is right (sort of):* Indirect normativity usually posits that the *right* policy is the one that maximizes accuracy, but the *agent* shouldn't necessarily be trying to maximize accuracy consciously when choosing beliefs. If you consciously choose policies based on accuracy, you risk "epistemic gaming" (adopting a policy because it feels good/safe, not because it tracks truth).
          *   *Self-Certification:* Yes, using current credences to validate the policy that produced them is circular (Bootstrapping).
          *   *Idealization:* Using ideal credences avoids circularity but creates the "guidance" problem. Ideal agents don't need heuristics.

      *   **Q2: Does idealizing fix self-certification or collapse the problem?**
          *   It fixes circularity but creates the *guidance* problem. If the ideal agent just does Bayesian Conditionalization perfectly, telling a bounded agent "do what the ideal agent does" is useless if the bounded agent *can't* do that.
          *   We need *feasible* policies scored by *ideal* standards (or at least standards not tainted by current bias). This is the "Second-Best" problem in consequentialism.

      *   **Q3: Where does "Should I believe $p$?" land?**
          *   Indirect normativity says: "Should I believe $p$?" is answered by "Does this belief conform to the best policy?"
          *   It does *not* say: "Does believing $p$ right now maximize accuracy?"
          *   So accuracy *does* speak to the question, but indirectly.

  4.  **Drafting the Response (Iterative Process):**

      *   *Validation:* Acknowledge the sophistication of the user's thinking. They've hit on the tension between *criterion* and *procedure*, and the *ideal* vs. *bounded* agent problem.
      *   *Clarify Indirect Normativity:* Distinguish between the *standard* (accuracy) and the *mode of evaluation* (policies vs. acts).
      *   *Address the Friend's Objection:* Why is calculating the best policy potentially problematic?
          *   *Reason 1:* Cognitive Overload/Regress. If I have to calculate the best policy, do I need a policy for that calculation?
          *   *Reason 2:* Self-Undermining. Sometimes the policy that maximizes accuracy is "Don't think about accuracy." (Analogy: Hedonic paradox). If you try to maximize accuracy directly, you might become anxious/biased, lowering accuracy.
      *   *Address the Spreadsheet (Current Credences):* Confirm the "Self-Certification" worry. This is the "Current Credence Problem." If I'm biased, my expected accuracy calculation will favor policies that keep me biased.
      *   *Address the Idealization Fix:* Confirm the "Guidance Problem." Ideal agents don't use heuristics. Bounded agents need heuristics. The gap is the "Second-Best" theory.
      *   *Synthesize:* The "Spreadsheet" is a category error. It treats the *criterion* as a *recipe*.
      *   *Answer the "Should I believe $p$?" question:* Accuracy says "Yes" if $p$ is produced by the best policy. It doesn't calculate $p$'s utility directly.

  5.  **Refining the Philosophical Nuance:**
      *   Need to mention **Brian Hedden** or **Hilary Greaves** on dynamic consistency.
      *   Need to mention **Frank Jackson** on decision procedures vs. criteria.
      *   Need to mention **Pettigrew** on accuracy norms for bounded agents.
      *   Crucial distinction: **Epistemic Consequentialism** vs. **Epistemic Deontology** (rules as constraints). Indirect consequentialism tries to mimic deontology.
      *   The "Self-Certification" issue is basically the problem of **reflective stability**.
      *   The "Idealization" issue is the problem of **feasibility**.

  6.  **Final Polish:**
      *   Keep the tone conversational but rigorous (matching the user).
      *   Structure clearly: 1. The Friend's Point, 2. The Spreadsheet/Circularity, 3. The Idealization/Guidance, 4. The "Should I believe p?" verdict.
      *   Make sure to explicitly answer the "clumsy implementation vs. mistake" question. (It's a category mistake, not just clumsy).

  7.  **Self-Correction during drafting:** I initially thought about telling them to look at Rule Utilitarianism. I should make that analogy explicit because it's the exact structural parallel. Also, need to be careful about "idealized deliberation." If they are logically omniscient, they don't have credences in the same way; they have knowledge. So scoring policies for them is weird. I need to point out that *bounded* idealization is the key (ideal *within* bounds).

  8.  **Final check against user prompts:**
      *   Did I answer if they misread indirect normativity? (Yes, partly).
      *   Did I address the friend's objection? (Yes).
      *   Did I address the spreadsheet/current credences? (Yes).
      *   Did I address the idealization fix? (Yes).
      *   Did I answer the "Should I believe p?" question? (Yes).

  (Proceed to generate response based on these thoughts.)
answer: |-
  This is an exceptionally sharp set of worries. You have effectively reconstructed the central tension in epistemic consequentialism between the **criterion of rightness** (what makes a belief/policy good) and the **decision procedure** (how an agent actually chooses), while also hitting the **ideal vs. bounded** agent problem.

  Here is the breakdown of where your reading stands, why your friend is gesturing at something real (even if she couldn't articulate it), and whether your spreadsheet saves the project or sinks it.

  ### 1. Did you misread Indirect Normativity?
  You haven't misread the *structure*, but you might be conflating the **theory** with the **deliberative perspective**.

  Indirect epistemic consequentialism (analogous to Rule Utilitarianism) says:
  *   **Criterion:** A belief state is epistemically right if it is produced by a policy that maximizes expected accuracy.
  *   **Deliberation:** However, the agent should not necessarily *deliberate* by calculating expected accuracy.

  Your reading ("The real unit of deliberation has to be the policy... deliberation just becomes a plain expected-value calculation") treats the *criterion* as a *recipe*. This is where your friend is stumbling. She senses that if you make "maximize expected accuracy of policies" your conscious decision procedure, you reintroduce the instability indirect normativity was meant to solve.

  **Why the friend is right (The Hedonic Paradox of Epistemology):**
  In ethics, a Rule Utilitarian who constantly calculates "Which rule maximizes utility?" often fails to maximize utility because the calculation itself is costly or leads to anxiety. Similarly, in epistemology, if your conscious procedure is "Adopt the policy that maximizes accuracy," you might adopt policies that *feel* safe or confident rather than policies that actually track truth.
  *   **Example:** A policy of "Believe whatever makes me feel most coherent" might score high on *expected* accuracy from the perspective of a biased agent, but it's not truth-tracking.
  *   **The Block:** Indirect normativity is supposed to block the agent from treating accuracy as a *goal* in deliberation. Accuracy is the *standard*, not the *target*. If you aim directly at the standard (even at the policy level), you risk "epistemic gaming."

  ### 2. The Spreadsheet & Current Credences (The Self-Certification Bug)
  Your worry here is spot on. Scoring policies based on your **current credences** is circular. This is the **Bootstrapping Problem**.

  If you currently have high credence in a conspiracy theory, your current credence function will likely assign high expected accuracy to policies that "trust intuition over experts" or "discount mainstream sources." Your spreadsheet will mathematically prove that your bias is the optimal policy.
  *   **Verdict:** This isn't just a clumsy implementation; it's a fatal flaw for a normative theory. A normative theory must be able to criticize current states, not just validate them. Using current credences to select the policy that generated those credences guarantees reflective stability, but not truth-tracking.

  ### 3. The Idealized Deliberator Fix (The Guidance Collapse)
  Your proposed fix (score policies using the credences of an idealized deliberator) solves the circularity but creates the **Guidance Problem**.

  *   **The Collapse:** As you noted, an ideal agent (logical omniscience, no bias) doesn't need heuristics. They just conditionalize on all evidence. There is no "policy selection" for them; there is only "doing the right thing."
  *   **The Gap:** If the ideal agent's chosen policy is "Be logically omniscient and conditionalize perfectly," that policy is **infeasible** for you.
  *   **Second-Best Theory:** What you actually need is **Feasible Idealization**. You need to ask: "Which *feasible* policy (for a bounded agent like me) would an ideal evaluator rank highest?"
      *   This saves the guidance. The ideal evaluator says, "Since you are bounded, the policy 'Conditionalize Perfectly' is useless. The policy 'Use this specific heuristic for causal inference' is the accuracy-maximizer *for you*."
      *   **But:** Now you aren't really using *ideal* credences anymore. You are using ideal *standards* applied to *bounded capacities*.

  ### 4. Where does this leave "Should I believe $p$?"
  This is the crux. Does accuracy have nothing to say to the first-personal question?

  **The Indirect Consequentialist Answer:**
  Accuracy *does* answer "Should I believe $p$?", but it answers it **transitively**.
  1.  **Question:** Should I believe $p$?
  2.  **Translation:** Is believing $p$ in accordance with the best feasible belief-forming policy?
  3.  **Evaluation:** The "best policy" is determined by which policy maximizes accuracy (assessed from an objective or idealized standpoint, not your current biased one).
  4.  **Verdict:** If the best policy says "Believe $p$ given evidence $E$," then accuracy says "Yes."

  **The Tension:**
  The worry is that this makes the first-personal question **opaque**. If I can't calculate the best policy myself (because I'm biased or bounded), how do I know if I should believe $p$?
  *   **Direct Consequentialism:** "Calculate the accuracy of believing $p$." (Prone to error/gaming).
  *   **Indirect Consequentialism:** "Follow the rule." (But which rule? If I have to calculate the rule, I'm back to Direct. If I can't calculate the rule, how do I follow it?)

  ### Summary & Recommendation for the Group

  You are asking the exact questions that drive the current literature (e.g., work by **Pettigrew**, **Greaves**, **Hedden**, and **Carr**). Here is how to frame your conclusion to the group:

  1.  **The Spreadsheet is a Category Mistake:** You cannot use the *criterion of rightness* (accuracy maximization) as the *decision procedure*. The "Indirect" in Indirect Normativity means the agent should generally **not** be thinking about accuracy maximization during deliberation. They should be thinking about evidence, reasons, and the rules they've internalized.
  2.  **The Self-Certification Worry is Fatal for Current Credences:** You cannot validate policies using the very credences those policies produced. You need an external standard (e.g., the "True Credence" or an "Ideal Evaluator").
  3.  **The Idealization Worry Requires "Bounded Idealization":** Don't ask "What would an omniscient agent do?" Ask "What policy yields the highest accuracy *for an agent with my cognitive limits*?" This keeps the problem from collapsing.
  4.  **The "Should I believe $p$?" Answer:** Accuracy speaks to this question only by validating the **process**. It says: "You should believe $p$ if $p$ is the output of the process that, generally speaking, gets agents like you to the truth." It sacrifices the immediate connection between *this evidence* and *this belief* in favor of a systemic connection between *policy* and *truth*.

  **Is the idea itself the mistake?**
  Not necessarily. But your spreadsheet implementation tries to **internalize the external**. Indirect normativity works best when the evaluation is external (the philosopher grading the agent) but the deliberation is internal (the agent following rules of evidence). If the agent tries to do the philosopher's job *while* being the agent, the system tends to buckle under circularity or infeasibility.

  **Suggestion:** Read **Hilary Greaves on "Epistemic Consequentialism"** or **Richard Pettigrew on "Choosing for the Sake of Accuracy."** They tackle exactly the tension between the "criterion" and the "choice." Your intuition that the "unit of deliberation is the policy" is correct, but your intuition that the *agent* must perform the calculation is where the theory usually draws the line.
