answer: |-
  This is a precise historiographical problem. The phrase "revolutions devour their own children" functions as a rhetorical totem, often invoked to signal wisdom while bypassing mechanism. To evaluate its utility in your seminar, we must strip it of its aphoristic sheen and treat it as a hypothesis.

  Below is the menu of distinct claims embedded in the phrase, evaluated for validity, followed by an analysis of how each claim interacts with the three historiographical frameworks (Social/Class, Ideological/Cultural, Contingency/War). I conclude with a committed verdict on the line's argumentative value.

  ### Part I: The Menu of Claims

  Here are five distinct propositions the line could be making, ranging from empirical observations to metaphysical assertions.

  **1. The Empirical Frequency Claim**
  *   **Claim:** A statistically significant majority of revolutions result in the physical elimination (execution, imprisonment, exile) of their own founding leadership.
  *   **Verdict:** **Substantive but probably false.**
  *   **Reasoning:** While the French (1793–94), Russian (1936–38), and Iranian (1980s) revolutions fit this pattern, the American, English (1688), and South African transitions did not feature the systematic execution of founding elites by their successors. The claim relies on a sample size biased toward the 20th century and the French case. It generalizes from the most salient cases to a universal rule.

  **2. The Coalition Fragmentation Claim (Structural)**
  *   **Claim:** Revolutionary coalitions are "negative coalitions" (united only by opposition to the *ancien régime*). Once the regime falls, the coalition lacks a positive program sufficient to hold together, leading to factional warfare where the victors eliminate the vanquished to monopolize power.
  *   **Verdict:** **Substantive and defensible.**
  *   **Reasoning:** This is a standard political-sociological observation. It does not require ideology or class interest, only the logic of collective action and power vacuums. It explains why Girondins and Montagnards fought without needing to posit that one was "more bourgeois" or "more ideological" than the other.

  **3. The Security Dilemma Claim (Functional)**
  *   **Claim:** The individuals most capable of making a revolution possess the specific skills, networks, and militias required to overthrow a state. Therefore, they constitute the greatest existential threat to the new state. Eliminating them is a rational act of regime consolidation, not ideological purification.
  *   **Verdict:** **Substantive and defensible.**
  *   **Reasoning:** This reframes "devouring" as state-building. Danton was not guillotined because he was impure, but because he had the network to restart a coup. This aligns with the "Contingency/War" reading, viewing the Terror as a response to the vulnerability of the new regime.

  **4. The Lawlike Necessity Claim**
  *   **Claim:** It is an inherent property of "Revolution" (as a singular historical force) to consume its creators. The outcome is deterministic.
  *   **Verdict:** **Confused.**
  *   **Reasoning:** This reifies "Revolution" into an agent with a will. It is a metaphorical shortcut that obscures human agency and specific decision-making. It shuts down inquiry rather than advancing it.

  **5. The Selection Bias Claim**
  *   **Claim:** We believe revolutions devour their children because we only remember the revolutions that devoured their children. Bloody revolutions are more memorable and generate more historiography than stable transitions.
  *   **Verdict:** **Substantive and defensible.**
  *   **Reasoning:** This is a meta-historical critique. It suggests the "law" is an artifact of historiography, not history.

  ---

  ### Part II: Historiographical Work

  You asked whether the visitor's inference holds: *From "revolutions kill their own" to "no special ideological explanation is needed."* To answer this, we must map the claims above against your three families of explanation.

  **1. The Social/Class-Struggle Reading**
  *   *Core Argument:* The Terror was the instrument of the bourgeoisie to crush aristocratic reaction and control the sans-culottes, or conversely, the sans-culottes forcing the bourgeoisie's hand.
  *   *Interaction with the Line:*
      *   If the line implies **Coalition Fragmentation (Claim 2)**, it **undermines** the Class reading. It suggests the conflict was not between classes (Bourgeoisie vs. Aristocrat) or even within a class (Bourgeoisie vs. Sans-culottes), but between *factions* defined by political survival. If Girondins and Montagnards are both "bourgeois," class analysis struggles to explain why one must die.
      *   If the line implies **Security Dilemma (Claim 3)**, it is **neutral**. Class factions can still face security dilemmas.
      *   *Verdict:* The line generally works *against* a strict Class reading, as it suggests intra-group violence is endemic to revolution, not specific to class dynamics.

  **2. The Ideological/Political-Culture Reading**
  *   *Core Argument:* (Your classmate's position). The Terror resulted from a specific conception of virtue, the General Will, and the requirement of transparency, which created a logic of suspicion and purity spirals.
  *   *Interaction with the Line:*
      *   The Visitor uses the line to **dismiss** this reading ("No special ideological story needed").
      *   However, if the line is interpreted as **Lawlike Necessity (Claim 4)**, it inadvertently **supports** the Classmate. If "Revolution" inherently devours, one must ask *why*. The Ideological reading provides the *why* (the logic of virtue requires blood).
      *   If the line is interpreted as **Coalition Fragmentation (Claim 2)**, it **competes** with the Classmate. It offers a structural alternative to the ideological one.
      *   *Verdict:* The Visitor's usage relies on Claim 2 to bypass the Classmate's Claim 4. But the phrase is ambiguous enough that it often smuggles in the very ideological fatalism the Classmate is describing.

  **3. The Contingency-and-War-Emergency Reading**
  *   *Core Argument:* The Terror was a set of emergency measures driven by invasion, civil war, and economic crisis, which metastasized due to institutional momentum.
  *   *Interaction with the Line:*
      *   This is the **strongest fit** for the Visitor's argument. The **Security Dilemma (Claim 3)** is essentially the Contingency reading applied to personnel. In a war emergency, you cannot afford potential fifth columnists, even if they are heroes.
      *   *Verdict:* The line supports the Contingency reading best. It frames the purges as rational (if brutal) responses to the instability of regime change under threat, rather than the unfolding of a philosophical script.

  **Does the line discriminate between the readings?**
  *   **No.** The phrase is too capacious. It is compatible with the Contingency reading (security dilemma), the Class reading (intra-class factionalism), and the Ideological reading (purity spirals). Because it fits all three, it cannot be used to settle a dispute between them. It is a description of an outcome, not an explanation of a cause.

  ---

  ### Part III: The Verdict

  You asked me to commit. Here is the assessment of the line's value and the Visitor's move.

  **1. Which reading is the most defensible?**
  The **Contingency-and-War-Emergency reading**, specifically when bolstered by the **Security Dilemma (Claim 3)** and **Coalition Fragmentation (Claim 2)** mechanisms, is the most defensible explanation for the specific phenomenon of "devouring children."
  *   *Reasoning:* It accounts for the timing (escalating with military defeats), the targets (those with independent power bases), and the cessation (ending when the external threat receded). It does not require assuming the French were uniquely ideological nor that class interests were perfectly coherent.
  *   *[Extrapolation Marker]:* I am extrapolating here that the cessation of the Terror post-Thermidor supports the contingency view more than the ideological view, assuming ideology would persist longer than emergency powers.

  **2. What are people normally running when they use this line?**
  When historians or speakers use "revolutions devour their own children," they are almost always invoking **Lawlike Necessity (Claim 4)** masked as **Empirical Frequency (Claim 1)**.
  *   *Reasoning:* They intend to convey a sense of tragic inevitability. They are not usually arguing about coalition theory or security dilemmas; they are invoking a mythic structure where "Revolution" is a Moloch that demands sacrifice. This is a rhetorical move, not an analytical one.

  **3. Does the line do any real work in the argument?**
  **No.** The Visitor's inference is invalid.
  *   *Reasoning:* To say "this is simply what revolutions do" (Claim 1/4) is not an explanation; it is a classification. Even if it were true that *all* revolutions devour their children, that would simply push the explanatory burden back one step: *Why do all revolutions devour their children?*
      *   Is it because of ideology? (Classmate's point)
      *   Is it because of war? (Contingency point)
      *   Is it because of class structure? (Social point)
  *   By asserting the pattern as a brute fact, the Visitor attempts to bypass the need for a mechanism. But since the pattern itself is empirically shaky (Claim 1) and the mechanism is unspecified, the line functions as a conversation stopper, not a solver. It grants a veneer of comparative historical wisdom to what is actually a refusal to engage with the specific causal mechanisms of 1793–94.

  **4. Final Commitment on the Classmate vs. Visitor**
  Your classmate is making a stronger specific argument than the Visitor.
  *   The Classmate identifies a *mechanism* (ideological purity generates unlimited demand).
  *   The Visitor identifies a *pattern* (purges happen) and asserts it needs no mechanism.
  *   *[Extrapolation Marker]:* I am judging the Visitor's move as weaker because in historiography, asserting a universal pattern without specifying the transmission mechanism is generally considered less rigorous than specifying a mechanism, even if that mechanism is contested.

  **Conclusion:**
  The line is a **platitude** masquerading as a **law**. Its best charitable reading is the **Security Dilemma (Claim 3)**, which supports the **Contingency/War** framework. However, the Visitor used it to dismiss the Ideological framework without demonstrating that the Security Dilemma *excludes* Ideology. In the French case, the Security Dilemma was *interpreted through* Ideology (suspicion was ideological). Therefore, the line does not settle the argument; it merely obscures the intersection of structure and culture. You should treat it as a prompt to ask "By what mechanism?" rather than an answer.
