answer: |-
  The whole procedure turns on whether the system has a stake in its own continuation, not just whether it reacts to stimuli.

  ### The One-Hour Welfare Triage Protocol

  **Step 1: Draw the Box (10 minutes)**
  *   **Task:** Agree on what counts as the individual unit. Is it the cell, the organoid, the simulation instance, or the whole cluster?
  *   **Good Enough Answer:** "We are treating [X] as the individual."
  *   **Stop Condition:** If you cannot agree on whether there is one entity or many (e.g., is the 5000-copy sim one process or 5000 individuals?), you must default to the higher count for welfare calculations.
  *   **Real Check vs. Motion:** This is a real check. If you define the unit wrong, the rest of the hour is waste.

  **Step 2: The Reflex vs. Regulation Test (20 minutes)**
  *   **Task:** Determine if the behavior is hardwired stimulus-response (reflex) or if the system modifies its internal state to avoid future cost (regulation). Look for evidence that the system tracks its own condition, not just the environment.
  *   **Good Enough Answer:** "The behavior changes based on internal state, not just external input," or "It is purely mechanical."
  *   **Sort Of Rule:** Use a traffic light. **Green** = Pure reflex (no welfare concern). **Yellow** = Ambiguous evidence of internal tracking (proceed with caution). **Red** = Clear evidence of state-tracking (full welfare protections).
  *   **Stop Condition:** If the answer is **Red**, the proposal stops here unless there is a compelling override (see Step 4). If **Yellow**, you move to Step 3.
  *   **Real Check vs. Motion:** This is the scientific core. Don't let "it looks like pain" pass without asking "is it actually processing cost?"

  **Step 3: The Ignorance Rule (10 minutes)**
  *   **Task:** Decide what to assume if Step 2 is Yellow.
  *   **Good Enough Answer:** "We cannot rule out capacity for suffering, so we assume it exists for the purpose of this protocol."
  *   **Stop Condition:** If you cannot agree to assume capacity in the face of uncertainty, the proposal is rejected.
  *   **Real Check vs. Motion:** This is a procedural motion to force consistency, but it has real teeth. It prevents "we don't know, so let's assume it's fine."

  **Step 4: The Values Vote (20 minutes)**
  *   **Task:** If the system counts (Red or Yellow + Ignorance Rule), is the scientific gain worth the moral cost?
  *   **Good Enough Answer:** A written sentence: "The potential knowledge gain justifies the assumed welfare cost because [reason]."
  *   **Stop Condition:** If the vote fails, the proposal is rejected or sent back for mitigation.
  *   **Real Check vs. Motion:** This is the only real moral decision. Steps 1-3 exist to make sure this vote isn't arbitrary.

  **What This Procedure Can't Do**
  It cannot prove consciousness. It cannot protect you from funding pressure if the funder demands results regardless of the vote. It cannot resolve disagreements about what counts as "worth it" in Step 4; it only forces you to write it down.

  ***

  ### Application to Current Proposals

  **1. Neural Organoid in Maze (Reward/Punishment)**
  *   **Step 1 (Box):** The individual organoid.
  *   **Step 2 (Reflex/Reg):** **Yellow.** It receives reward/punishment signals. We don't know if it "feels" them or just optimizes a function. It is tracking success, but is there an "inside" to track?
  *   **Step 3 (Ignorance):** We cannot rule out that the reward/punishment signals map to valenced experience. We must assume they do.
  *   **Step 4 (Values):** **Stop/Modify.** You are inflicting assumed punishment on a system that might care.
  *   **Justification:** "Protocol assumes capacity for valenced experience due to reward/punishment architecture. Mitigation required to minimize punishment signals or prove purely mechanical processing."

  **2. Larval Fish Simulation (5000 Copies)**
  *   **Step 1 (Box):** **Stop Condition Triggered.** Is it one simulation running 5000 times, or 5000 individuals? The protocol demands defaulting to the higher count. You must treat this as 5000 individuals.
  *   **Step 2 (Reflex/Reg):** **Red.** It is a high-res simulation of a nervous system known to track state. Functionally, it is doing what the fish does.
  *   **Step 3 (Ignorance):** N/A (Already Red).
  *   **Step 4 (Values):** **Stop.** Running 5000 copies multiplies the moral cost by 5000. Unless the science is 5000x more valuable than a single fish experiment, this is unjustifiable.
  *   **Justification:** "System functionally equivalent to vertebrate nervous system. Multiplication of instances creates aggregate welfare cost exceeding proposed benefit. Reduce instance count or demonstrate substrate irrelevance."

  **3. Invertebrate Learning Experiment (The Adversarial Case)**
  *   **Context:** You want to approve this because inverts are usually exempt, and the learning data is valuable.
  *   **Step 1 (Box):** The individual invertebrate.
  *   **Step 2 (Reflex/Reg):** **Red.** The prompt states the animal is "clearly tracking something like its own state." This fails the reflex test.
  *   **Step 3 (Ignorance):** N/A (Already Red).
  *   **Step 4 (Values):** **Stop.** This is the hard result. Your committee usually waves inverts through. This procedure forces you to categorize this as a vertebrate-level welfare concern. You cannot approve it under "exempt" status. You must either prove the state-tracking is illusory or apply full welfare protections (anesthesia, euthanasia standards), which might ruin the experiment.
  *   **Justification:** "Evidence indicates internal state-tracking comparable to vertebrate models. Proposal cannot proceed under exempt invertebrate guidelines. Must submit full welfare mitigation plan or refute state-tracking claim."

  ***

  ### The Written Justification Template (For the Funder)
  *To be completed at the end of Step 4.*

  **Proposal ID:** [Number]
  **Unit of Concern:** [e.g., Individual Organoid / 5000 Sim Instances]
  **Capacity Assessment:** [Green/Yellow/Red]
  **Uncertainty Handling:** [e.g., Precautionary Principle Applied]
  **Decision:** [Approved / Approved with Mitigation / Rejected]
  **Reasoning:** [The sentence from Step 4. E.g., "The assumed capacity for suffering outweighs the incremental gain in learning data."]

  **Committee Sign-off:** [Names]
  **Date:** [Date]
