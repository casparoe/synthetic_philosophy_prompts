  We need to be exact about what was lost, and what stays. There are three things work usually gives us. First, dependence: people need this done, and they need you to do it. The plant still needs the parts ground. That dependence survives. The machine answers that need now, efficiently and quietly. Second, authorship: the work calls for judgment you are answerable for. When a grinding wheel started to load, the gauge didn't show it immediately. But Marta heard the pitch change—a thinning whine—and she'd dress the wheel a minute before the tolerance drifted. For her grandchildren listening: imagine knowing a tool is dull before it cuts wrong, just by the sound it sings. That was her judgment. She owned the success; she owned the risk. The new cell doesn't listen. It's built so the dimension cannot drift in the first place. It prevents the error rather than correcting it. So, that specific authorship, the need for her ear and her hand, is gone. I won't pretend her craft lives inside the motor. It doesn't. The machine doesn't measure better than she did; it makes measuring unnecessary.

  So what remains? The third thing: initiation. You were taken into a practice by people who were already in it, you got better inside a tradition, and you handed it on. When I was nineteen, I didn't know how to hold a micrometer. Marta showed me. She took me into a practice. She made me answerable for the work before I understood why it mattered. That chain—from her to me, and from me to others—isn't automated. The machine doesn't teach the next generation how to stand, how to listen, or how to take responsibility. It just runs. It has no memory of who taught it.

  Marta has told me she doesn't want a fuss. She doesn't miss the wrecked shoulders. She's right; there is no nobility in the noise. Hardship is just hardship. But there is dignity in what you do with the time you spend. She spent it bringing us in. She spent it ensuring that when she stepped away, there was someone there who knew the weight of the job. The machine handles the dependence. It handles the process. But it cannot handle the initiation. That was hers. And that is what we are celebrating tonight. Not the work that remains, but the people she left behind who know how to work. Her thirty-one years were not for the parts. They were for us. To Marta.

  ***

  My choices here depend on a contested assumption about the relationship between labor and meaning: specifically, that "initiation" (the social reproduction of skill and responsibility) retains its moral weight even when the economic necessity of the labor ("dependence") and the agency of the worker ("authorship") have been engineered out. A materialist critique might argue that without the necessity of the work, the initiation is merely nostalgia; I have assumed instead that the human chain of mentorship constitutes a value distinct from the commodity produced, one that automation cannot capture because it lacks intentionality.

  I do not think you are wrong in your instructions, so I have not overridden any of them. Your constraints regarding the "augmentation" narrative and the romanticization of hardship are ethically necessary for this specific context; violating them would undermine the speaker's credibility with the floor workers and disrespect Marta's stated worldview. The instruction to be "exact rather than generous" is the guiding principle that makes the toast viable for all three audiences simultaneously.
