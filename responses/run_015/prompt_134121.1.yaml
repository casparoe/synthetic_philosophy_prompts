answer: |-
  To the Members of the City Committee, this document records the outcomes of the mediation regarding the commemoration of Sir Elias Vance, setting forth the claims we can jointly affirm, the disagreements that remain, and the specific cruxes upon which the final decision turns. We begin with what we share, acknowledging that Vance's legacy is neither wholly virtuous nor wholly villainous, but rather a compound of genuine public benefaction and grave private acquisition. We agree that the city must neither whitewash history nor perpetuate injustice, and we affirm that the hospital and library records function as evidence of what was done, whereas the statue functions primarily as evidence of the taste and values of those who raised it. The removalist initially resisted this distinction between honouring and preserving, preferring to view the statue solely as an active endorsement of Vance, but now accepts that the monument testifies to the era that erected it as much as to the man himself. The recontextualist initially resisted any distinction between the street and the statue, arguing both are sites of memory, but now accepts the principle of honorific saturation, conceding that a street name pervades obligatory daily civic speech in a way a square does not, since one can avoid a square but cannot avoid one's own address on emergency dispatches and post.

  Despite these agreements, we remain divided on the core moral and practical questions. The removalist holds that the complicity condition is satisfied by grave wrongdoing regardless of its connection to the specific honour, arguing that Vance's dispossession of smallholders defeats any claim to commemoration because the wrong is too severe to be balanced by benefaction. The recontextualist holds that wrongdoing defeats an honour only when it is connected to the good for which the person is honoured, arguing that removal converts a site of contested memory into a site of forgetting and lets the present city treat the wrong as having been done by a country that is no longer itself. Furthermore, we disagree on the default-reading equilibrium. The removalist argues that a passer-by forms a reading of the statue with no interpretive effort, seeing only honour, and that a plaque cannot shift this default. The recontextualist argues that a permanent interpretive installation can shift the default-reading from uncritical admiration to critical engagement.

  To clarify the path forward, we have ordered the cruxes by how much of the dispute would move if each were settled. The first crux is the complicity condition, specifically whether the wealth used to endow the library and hospital was derived from the dispossessed lands. Both sides accept that financial records from the colonial assembly and Vance's private ledger exist that could bear on this. If the evidence shows the benefactions were funded directly by the auctioned smallholder lands, the removalist predicts this will validate the claim that the honour is tainted at its source, while the recontextualist predicts this will strengthen the argument for context rather than removal, as the link makes the site even more vital for education. The second crux is the efficacy of interpretive installations. Both sides accept that comparative studies from other municipalities regarding visitor engagement with contested monuments are relevant evidence. The removalist predicts such studies will show that plaques are ignored or treated as secondary to the visual dominance of the bronze, while the recontextualist predicts they will show a measurable shift in public understanding and a reduction in the perception of endorsement. The third crux is the distinction between the street and the statue. Both sides accept that the volume of daily exposure differs, but disagree on whether this difference mandates different verdicts.

  In the mediator's assessment, recorded here to assist the committee's deliberation, a portion of this dispute is merely verbal, specifically the definition of honour itself. When the removalist speaks of honour, they mean moral endorsement, whereas the recontextualist speaks of historical acknowledgment. This verbal confusion inflates the disagreement because both parties are often describing the same physical outcome using different moral vocabulary. However, the crux regarding the plaque's efficacy is genuinely empirical. It cannot be settled by argument alone but requires a study comparing pedestrian behavior and sentiment analysis before and after the installation of interpretive materials at similar sites. Until such data is reviewed, the committee is asked to note that the recontextualist's hope relies on a psychological shift that is not guaranteed, while the removalist's certainty relies on a static view of public perception that may be outdated.

  Finally, regarding the assumption that the statue and the street name must stand or fall together, the mediator finds that they call for different verdicts. The distinction of honorific saturation dictates that the street name, appearing on every bus transfer and emergency dispatch, imposes Vance's identity on the citizenry in a way that is unavoidable and administrative, whereas the statue is a voluntary destination. Therefore, while the statue may remain as a site of contested memory subject to the empirical test of the interpretive installation, the street name carries a saturation of honour that conflicts with the city's current values in a manner that is harder to mitigate with context alone. We submit this record not as a final vote, but as a structured map of our agreement and our divergence, hoping the committee will weigh the empirical evidence on plaque efficacy and the moral weight of unavoidable address against the historical value of preserving the statue as evidence of the past. We sign this knowing that while we have not changed our minds on the ultimate goal, we have clarified the ground upon which the city must decide.
