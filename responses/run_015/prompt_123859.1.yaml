answer: |-
  Section 4.2: Bid Forfeiture. All participants shall forfeit the value of their final submitted bid upon auction closure, regardless of award status. Section 4.3: Constraint Instruments. The Lasso function permits a hard ceiling on bid submission. Ceiling adjustments incur nonrefundable administrative fees scaling geometrically. Section 4.4: Information Requests. Peek transactions are logged anonymously. Aggregate counts released post-closure. No refunds issued for withdrawn participation.

  ***

  Elias sat in the dark of the operations center, the glow of the procurement portal the only light in the room. On the secondary monitor, a news loop played silently from the gala three nights prior. Victoria Vance, Executive Director of the Polar Foundation, stood at a podium draped in blue velvet. She was smiling, holding a printed certificate of instrument purchase. She had bought a Lasso. She had set the ceiling at 2.5 million. The chyron read: *Fiscal Discipline Ensured.*

  Elias muted the video. He knew the valuation report on his desk by heart. The net present value of the fifteen-year lease was 3.1 million. Any bid above that number was a loss. Any bid below it was a profit. But the rules of the portal did not care about profit. They cared about the final bid. Everyone paid their final bid. The winner got the station; the loser got nothing. Both lost the money.

  He looked at the live auction window. The current bid stood at 2.45 million. It was his turn.

  He understood the geometry of the trap. Vance had announced her ceiling to reassure donors that she would not overspend. But the portal allowed ceilings to be raised for a fee. The base fee was 25,000. The first raise cost 50,000. The second cost 100,000. Each adjustment was a fresh transaction, a new line item on the ledger that could never be deleted. By announcing the limit, she had not locked herself out; she had merely put a price tag on her own pride. If she stopped at 2.5 million, she admitted the public constraint was a lie. If she raised it, she paid for the privilege of continuing the lie.

  Elias typed 2.5 million into the bid box. He did not hesitate. He knew that once he crossed her threshold, she would have to pay the 50,000 raise fee just to match him. That 50,000 would be gone the moment she clicked confirm. It would not count toward the bid. It would simply vanish, a toll paid to keep the gate open.

  He clicked Submit. The system chimed. *Bid Accepted. Current High: 2,500,000.*

  He waited. The silence period timer began to count down from ten minutes. If no one bid, the auction closed. He watched the timer tick down. Eight minutes. Six.

  At four minutes, the status changed. *Counterbid Received.*

  Vance had not dropped out. She had paid the toll. Elias clicked the *Peek* button. The fee was 5,000, nonrefundable. He wanted to see the shape of her cage. The screen updated: *Opponent Ceiling: 3,000,000.*

  She had raised the lasso. She had paid the 50,000. That money was already forfeit, separate from the bid itself. Now, to justify that 50,000 loss, she had to win. If she lost now, she would have paid the 50,000 fee plus her final bid of 2.5 million, totaling 2.55 million in losses for nothing. If she won at 2.5 million, she paid 2.5 million for a 3.1 million asset. The fee was the anchor. It made retreat more expensive than advancement.

  Elias felt the cold logic settle in his stomach. He was not angry. He was merely the other side of the equation. He typed 2.55 million.

  The bidding accelerated. The increments were fixed at 50,000. They moved past the valuation threshold without pausing. 2.9 million. 2.95 million. 3.0 million.

  At 3.05 million, Elias stopped. He looked at the valuation report again. *3,100,000.* If he bid 3.1 million, he broke even. If he bid 3.15 million, he lost 50,000. But if he stopped at 3.05 million and Vance bid 3.1 million, he lost 3.05 million entirely. The loss of 3.05 million was certain if he quit. The loss of 50,000 was probable if he continued.

  He bought another Peek. 5,000.

  *Opponent Ceiling: 3,500,000.*

  She had raised the lasso again. The fee for this raise was 100,000. He could see the transaction log in his mind. She had paid 25,000 for the base, 50,000 for the first raise, and now 100,000 for the second. Total fees: 175,000. Total bids forfeited so far: 3.05 million. She was already down 3.225 million on a 3.1 million asset. She had to win to stop the bleeding.

  Elias typed 3.15 million.

  The system asked for confirmation. *Warning: Bid exceeds independent valuation estimates.* He clicked Yes.

  *Bid Accepted.*

  The timer reset. Ten minutes. He watched the cursor blink. He knew she was in a room similar to this, surrounded by analysts who had told her to stop, surrounded by donors who had been told she would show discipline. The machinery of the auction did not require ignorance. It required only that the cost of stopping be higher than the cost of continuing.

  At two minutes, the status changed. *Counterbid Received.*

  3.2 million.

  She was bidding past the value. She was paying to lose less. Elias looked at his own sunk costs. He had bid 3.15 million. If he lost now, he forfeited 3.15 million. If he bid 3.25 million and won, he paid 3.25 million for a 3.1 million asset. The loss was 150,000. The loss of quitting was 3.15 million.

  He typed 3.25 million.

  *Bid Accepted.*

  The timer counted down. Nine minutes. Eight. He did not look away. He waited for the moment the logic would break, but it did not. The structure held them both. There was no exit, only a choice of which price to pay.

  At thirty seconds, the status changed. *Counterbid Received.*

  3.3 million.

  Elias did not bid again. He let the timer run out. The screen flashed *Auction Closed.*

  *Winner: Foundation. Final Bid: 3,300,000.*

  He sat back. He had lost 3.25 million. Vance had won the lease, worth 3.1 million, for a cost of 3.3 million in bids plus 175,000 in lasso fees plus 10,000 in peek fees. Her total expenditure was 3,485,000. The net loss was 385,000. His net loss was 3.25 million.

  The portal chimed. A new window opened. *Post-Auction Report.* It listed the anonymized count of peeks purchased: 2. It listed the final ceiling adjustments: 2. It did not list the losses. It did not need to.

  ***

  The screen flickered. The data cleared. The interface reset to the default dashboard. A new lot loaded automatically, the timer already counting down from the pre-bidding phase. *Lot 44-B: Decommissioned Arctic Radar Station.* The valuation field was blank, waiting for input. The *Buy Lasso* button pulsed gently in the corner, ready for the first gesture of discipline. Elias watched the cursor hover over the bid box. He did not move it. He simply watched the seconds tick away, waiting for the first number to appear.
