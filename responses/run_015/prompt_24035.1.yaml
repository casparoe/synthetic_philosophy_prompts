answer: |-
  ### Diagnosis: A Substantive Disagreement about Causal Attribution, Obscured by Verbal Ambiguity

  This is not merely a verbal disagreement, nor are they simply answering different questions. It is a **substantive disagreement about causal attribution** (specifically, *causal specificity*) that has become intractable because both sides are fighting over the word "information" rather than the underlying causal structure.

  Here is the breakdown of why this diagnosis fits the stalemate:

  **1. Why it is not merely verbal:**
  If this were purely verbal, agreeing on a definition of "information" would dissolve the conflict. It does not. Even if you force both sides to agree on Shannon's mathematical definition, the philosophers will still object that Shannon information does not capture *biological function* or *developmental context*, and the biologists will still insist that DNA is the *privileged* cause of the phenotype. The fight isn't just about the label; it's about **explanatory privilege**. The biologists are defending a gene-centric model of causality (DNA is the blueprint); the philosophers are defending a systems-centric model (the cell constructs the meaning). That is a substantive fight about how the world works, not just how we talk about it.

  **2. Why it is not just "different questions":**
  If they were answering different questions, their answers wouldn't contradict. But they do. The biologist says, "The information is in the DNA." The philosopher says, "No, the information is in the system." These are contradictory claims about the *location* of causal power. They are both attempting to answer the same underlying question: *"What carries the specificity that determines the biological outcome?"* They are just using "information" as a proxy for "specificity."

  **3. The Core Error:**
  The stalemate persists because "information" is doing double duty.
  *   **Biologists** use "information" to mean **Causal Specificity**: DNA is the factor that makes the difference between building an eye and building a liver.
  *   **Philosophers** use "information" to mean **Semantic Content**: DNA implies a message that requires an interpreter (the cell) to have meaning.

  The biologists are right about specificity (changing the DNA changes the outcome more reliably than changing the cytoplasm in many contexts). The philosophers are right about semantics (DNA has no meaning without the ribosome). Because they are using one word to track two different causal properties, they talk past each other. The biologist hears "no meaning" and thinks "you deny DNA causes traits." The philosopher hears "it's a code" and thinks "you deny the cell's role in construction."

  ### What Counts as Progress?

  Given this diagnosis, progress will **not** come from a better definition of "information," nor from a formal proof that DNA is or isn't a Shannon channel. Both of those preserve the category error.

  **Progress requires a conceptual replacement, not a resolution.**

  The field must abandon the question *"Is DNA information?"* and replace it with the question *"What is the degree of Causal Specificity of DNA relative to cellular context?"*

  **The Condition for Progress:**
  Progress occurs when both sides adopt a **interventionist framework of causation** (e.g., Woodwardian causality) to replace the information metaphor.
  *   **The Formal Result Needed:** A metric that quantifies how much an intervention on the DNA sequence changes the outcome *relative to* an intervention on the cellular machinery (tRNA availability, methylation, etc.).
  *   **Why this works:** It dissolves the "code" metaphor. A "code" implies a fixed lookup table. "Causal specificity" acknowledges that DNA is a *difference-maker* without implying it contains a semantic message. It allows the biologist to say "DNA has high specificity here" and the philosopher to say "Cellular context has high specificity there" without contradicting each other.

  **Why no progress is currently expected:**
  As long as the debate remains framed around the ontology of "information," no progress is possible. The term is too loaded with baggage from communication theory (sender/receiver/meaning) that does not map cleanly onto molecular construction. The sides will continue to fortify their definitions because the stakes are actually about **reductionism vs. holism**, not semantics.

  **Verdict:** Stop arguing about whether it's a "code." Start measuring **causal specificity**. Until the vocabulary shifts from *semantics* to *causal leverage*, the decades-long stalemate will continue.
