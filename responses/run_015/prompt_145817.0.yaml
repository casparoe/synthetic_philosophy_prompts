      *   *Specific Vocabulary:* Ensure strategy-proofness, IC, efficiency, VCG, externalities are used correctly.
      *   *Tone:* Analytical, journalistic but technical.

  9.  **Refining the Translation (Self-Correction):**
      *   *Correction:* I initially thought about calling corruption of meaning an "externality." I need to be precise. It's a *preference interdependence* where Agent A's utility depends on the *mechanism type* used for Agent B's allocation.
      *   *Correction on Votes:* Vote selling isn't just a positional good; it's a change in the *voting rule*. If I sell my vote, the mechanism aggregates weighted preferences. This violates the *anonymity* condition of standard voting mechanisms.
      *   *Correction on Crowding Out:* This is a violation of the *ceteris paribus* assumption regarding utility functions. It implies the mechanism $M$ affects the valuation function $v_i(\cdot)$.

  10. **Final Polish:** Check the flow. Ensure the "Residue Report" is distinct. Ensure the conclusion directly answers the prompt's final question. (Proceed to generate output based on these thoughts).

  *(Self-Correction during drafting)*: I must be careful not to use the word "moral" in the restatement section. I need to describe the *structure* of the argument without invoking the *substance* of the philosophy. Instead of "moral repugnance," use "disutility derived from the existence of a price signal." Instead of "dignity," use "non-pecuniary utility parameters."

  *(Refining the Kidney vs. Vote distinction)*:
  Kidneys: Private good allocation.
  Votes: Input into a public good decision.
  In mechanism design, kidneys are $x_i \in \{0,1\}$. Votes are weights $w_i$ in a function $F(\sum w_i v_i)$. Selling a kidney transfers $x_i$. Selling a vote transfers $w_i$.
  The structural difference is that transferring $w_i$ changes the *outcome function* for all other agents, whereas transferring $x_i$ only affects the allocation of that specific unit. This is a *systemic externality* vs. a *local allocation*.

