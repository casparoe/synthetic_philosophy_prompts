answer: |-
  ### Part I: Formal Restatement of Normative Objections

  **1. Corruption of Meaning as Mechanism-Dependent Utility**
  In standard allocation theory, an agent's utility function $u_i(x, t)$ depends on the allocation $x$ and transfers $t$. The objection that commodification corrupts the meaning of a good is restated as a claim of **preference interdependence regarding the mechanism type**. Agents possess utility functions that are contingent not only on the final allocation but on the *rule* used to determine it. Introducing a price mechanism $M_{market}$ instead of a non-market mechanism $M_{gift}$ induces a negative **consumption externality** on agents who derive disutility from the existence of transferable utility in that specific domain. The market fails to achieve **allocative efficiency** in the broader social welfare function because the price signal itself alters the utility parameters of third-party observers, a variable not internalized in a standard **Vickrey-Clarke-Groves (VCG)** payment structure.

  **2. Crowding Out as Endogenous Preference Instability**
  The claim that monetary incentives crowd out altruistic motivation is restated as a violation of the **fixed type assumption** required for **incentive compatibility**. Standard mechanism design assumes agent types $\theta_i$ (private valuations) are exogenous and stable. The crowding-out objection posits that the introduction of transfers $t_i$ endogenously shifts the valuation function $v_i(\cdot)$ over time. If the mechanism $M$ influences the distribution of types $\theta$, then a mechanism that is **strategy-proof** in a static snapshot fails **dynamic incentive compatibility**. Truth-telling is no longer a dominant strategy because revealing a high valuation today (to sell) alters the agent's own utility parameters tomorrow, reducing the long-run payoff of participation.

  **3. Distributive Injustice as Endowment Sensitivity**
  The objection regarding distributive injustice is restated as a critique of the mechanism's sensitivity to **initial endowment distribution**. In a market mechanism, the **allocative efficiency** outcome is conditional on the initial distribution of wealth $w_i$. If the feasible set of allocations is constrained by budget balance, agents with low $w_i$ face binding **individual rationality constraints** that force suboptimal consumption bundles compared to agents with high $w_i$. The market mechanism maximizes the weighted sum of utilities where weights are determined by marginal utility of wealth. Consequently, the mechanism produces an equilibrium that is Pareto efficient but violates **equity constraints** imposed on the social choice function, specifically regarding the correlation between initial endowments and final allocation of essential goods.

  ***

  ### Part II: Residue Report

  | Objection | Mechanism Design Counterpart | Approximation Quality | Residue Status |
  | :--- | :--- | :--- | :--- |
  | **Corruption of Meaning** | **Negative Externality on Mechanism Selection.** Modeled as a utility loss for agents who prefer a non-market rule, regardless of the allocation outcome. | **Distorted.** Requires treating the *rule* as a public good. Standard auction theory treats the mechanism as exogenous infrastructure, not a variable in the utility function. | **Partial Mapping.** The framework captures the *welfare loss* but cannot encode *why* the loss exists without importing exogenous parameters. The "meaning" is reduced to a preference parameter, stripping it of its structural significance. |
  | **Crowding Out** | **Endogenous Type Evolution.** Modeled as a violation of the assumption that preferences are independent of the mechanism. | **Approximated.** Requires dynamic mechanism design where current actions update future type spaces. | **Significant Residue.** Standard theory assumes stable preferences to prove **strategy-proofness**. If preferences are mutable by the mechanism, the revelation principle collapses. The framework treats this as a modeling error rather than a structural feature. |
  | **Distributive Injustice** | **Endowment-Dependent Equilibrium.** Modeled as the sensitivity of the Walrasian equilibrium to initial wealth distribution. | **High.** This is a standard feature of general equilibrium theory. | **Disappears (as failure).** In mechanism design, this is not a mechanism failure but a boundary condition. The framework is agnostic to distribution unless an equity constraint is explicitly added to the objective function. |

  ***

  ### Part III: Divisible vs. Positional Goods in Auction Design

  The distinction between kidney markets and vote markets can be formalized through the lens of **private goods allocation** versus **social choice aggregation**.

  **Kidney Markets (Private Good Allocation):**
  In mechanism design terms, a kidney is an indivisible private good. The allocation problem is a matching market. The structural constraint is **supply scarcity**. Allowing sales expands the feasible set of allocations by inducing supply via transfers. The primary **externality** is limited to the participants and those with preferences over the *source* of the kidney (the "meaning" objection). The mechanism remains a mapping from types to private allocations.

  **Vote Markets (Aggregation Rule Weights):**
  A vote is not a consumption good; it is a weight $w_i$ in a social choice function $F(\sum w_i \cdot \text{preference}_i)$. Selling a vote transfers the *weight* $w_i$, not just a private outcome. This fundamentally alters the **aggregation rule** for all other agents.
  *   **Structural Difference:** In a kidney market, Agent A selling to Agent B does not change the probability of Agent C receiving a kidney, except through price competition. In a vote market, Agent A selling to Agent B changes the *decision power* Agent B exerts over Agent C's outcomes.
  *   **Positional Nature:** Votes are purely positional; their value is derived entirely from their capacity to influence a collective outcome relative to others. Selling votes converts a **non-transferable decision right** into a **transferable asset**.

  **Normative Premises in Design:**
  The distinction relies on a normative premise encoded as a **domain constraint**. Mechanism design treats the "one person, one vote" rule as a constraint on the feasible set of mechanisms (anonymity and neutrality). If vote selling is permitted, the mechanism design problem shifts from aggregating preferences to aggregating *weighted wealth*. The framework *can* represent this shift, but it treats the prohibition on vote selling as an arbitrary boundary condition rather than a logical necessity. The structural difference is real within the math (private allocation vs. public function weighting), but the *prohibition* on changing the weights is a normative input, not an economic output.

  ***

  ### Part IV: Assessment of the Untranslatable Residue

  The untranslatable residue points to a **deficiency in the scope of the economic framework**, not an ambiguity in the philosophical objections.

  Mechanism design is ontologically neutral; it treats all values as preference parameters and all rules as constraint sets. It is engineered to solve for **efficiency** and **incentive compatibility** given a specific objective function. It lacks the vocabulary to evaluate the *origin* or *legitimacy* of the objective function itself.

  1.  **Deficiency in Framework:** The economic framework cannot distinguish between a preference for "not selling a kidney" and a preference for "chocolate." Both are encoded as utility parameters. Consequently, the "corruption of meaning" is flattened into a standard **externality**. The framework cannot capture the claim that some goods *constitute* the agent's identity in a way that makes them non-fungible, because fungibility is a prerequisite for the transferable utility assumptions underlying **VCG mechanisms** and **auction theory**.
  2.  **Ambiguity in Philosophy:** However, the residue also exposes that philosophical objections often rely on essentialist definitions ("a vote *is* a civic duty") that mechanism design treats as contingent design choices ("a vote *is* a weight in function F"). The philosophical claim often conflates the *current institutional design* with the *ontological nature* of the good.

  **Conclusion:**
  The translation succeeds in mapping the *consequences* of the objections (welfare losses, instability, distributional shifts) but fails to map the *status* of the objections. The economic framework treats the "sacredness" of a good as a solvable constraint optimization problem, whereas the philosophical claim posits it as a boundary beyond which optimization is illegitimate. The gap lies in the economic framework's inability to represent **deontological constraints** (rules that cannot be violated regardless of efficiency gains) without converting them into **consequentialist costs** (huge negative utility values). Thus, the residue indicates that mechanism design is structurally incapable of representing non-consequentialist normative claims, not because the claims are ambiguous, but because the framework is axiomatically committed to consequentialism.
