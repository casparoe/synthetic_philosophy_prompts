  hey, i'm a third-year philosophy student taking a course on morral psychology and cross-culturall ethics. i've got this half-baked idea for my term-paper proposal (around 5,000 words, one semester) and i need you to turn it into something proper. please take on the role of an expert philosopher of mind and ethics, but also someone who actually has to write this in 12 weeks — so start with some quick brainstorming about the framing, then lay out the proposal properly.

  the idea: everyone talks about WEIRD vs non-WEIRD differences in folk morality (like harm vs loyalty vs purity) and immediately asks whether that kills moral objectivty. i think that's too quick because 'objectivity' is doing double-duty: sometimes people mean the judgements are true regardless of what anyone thinks (mind-independence), and sometimes they mean the norms bind everyone regardless of culture (universal authority). my hunch is that WEIRD populations tend to conflate these two, while in other groups they come apart — for instance, people might think incest is wrong in a binding way without thinking there's a mind-independent fact about it. but i'm not sure if this is a real distinction in the literature or just something i'm inventing.

  so here's what i want in the proposal:
  - state the exact question precisely (not just 'does culture affect morality?')
  - explain why the existing debate between moral realists and relativists leaves this open — specifically, why treating objectivty as a single notion blocks progress
  - set out the approach: how you'd analyse the conceptual distinction, then apply it to interpret existing anthropological findings (without needing to run new experiments), and say why this philosophical approach is better than just doing more cross-cultural surveys
  - say what a successful result looks like (maybe a framework that sorts disagreement into 'truth-tracking' vs 'authority-tracking' types) and what would count as the project failing
  - keep it realistic for one semester and don't ask me to do original fieldwork
  - don't include a bibliography or reading list — i'll fill citations in myself

  one more thing: please push back plainly if my premise is confused or if the task as i've posed it can't be done well — don't just politely comply if there's a problem. also, write everything in British English, and think carefully about whether the distinction i'm drawing actually holds water before you build the proposal on it. thanks!
