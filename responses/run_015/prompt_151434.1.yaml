      The mapping holds structurally, but "No Pre-play" is false for treaties (negotiation happens). Also, "Source Code" implies full capability disclosure, whereas treaties often hide dual-use tech.

      *Drafting S2:*
      The treaty analogy smuggles in a massive amount of infrastructure. First, **iterated interaction**: Nations know they meet again tomorrow; the shadow of the future enforces compliance. Program Equilibrium is often modeled as one-shot. Second, **external enforcement**: Treaties rely on sanctions, shame, or hegemonic power (a referee) to punish violators. If a nation cheats, the other doesn't just defect logically; they launch missiles. Third, **graded verification**: Satellites have noise; inspectors have access limits. Code is binary, but semantics are not. Fourth, **shared context**: Legal terms have interpreters. Code has compilers, but intent is ambiguous.
