  ### The Rotterdam-Singapore Gradient: A Staff Room Analysis

  Right, pull up a chair. This pilot scheme is a fascinating bit of philosophical engineering, isn't it? It's trying to solve the "responsibility gap" problem by essentially legislating it away with a scoring system. But if we look under the bonnet, the implicit theory of responsibility it's running on is a bit of a dog's breakfast.

  **The Implicit Theory: Causal Dilution**

  To answer your first question: the gradient practice presupposes a **causal proximity theory of responsibility**, treated as if it were a conserved substance.

  By assigning "diminishing moral weight" as human input gets further away, the panel is acting as though responsibility is something like a signal strength or a fluid that attenuates over distance. In philosophical terms, this is quite shaky. Responsibility isn't usually something that gets "used up" or "diluted" as it passes through nodes. Either an agent had control and foresight, or they didn't.

  However, the scheme seems to be borrowing from **tracing principles**. The idea is that you can trace responsibility back along the chain, but the "link strength" weakens the further back you go. This suggests they view moral blameworthiness as dependent on the *tightness* of the causal coupling. If I press a button and the ship crashes immediately, I'm fully responsible. If I write code that runs for six weeks before a crash occurs, my responsibility has "decayed".

  **Substance vs. Control**

  You asked if this treats blameworthiness like a dilutable substance. Yes, effectively. It's a **quantitative model of blame**. They're assuming there's a fixed amount of blame associated with the crash, and it gets distributed across the chain, losing value as it travels.

  Can a **control-based view** make sense of the 0.4 cutoff? Actually, yes, but not in the way the scheme intends. A proper control-based view (like Fischer and Ravizza's guidance control) would argue that once the human's ability to intervene drops below a certain threshold of capacity, they cease to be a moral agent regarding that event. The 0.4 cutoff could be interpreted as a **threshold of effective control**. Below 0.4, the human link is so attenuated that claiming they "could have done otherwise" is fiction. So, the cutoff works as a pragmatic recognition of lost control, even if the "gradient" metaphor is metaphysically wobbly.

  **Liability vs. Blame: The Consistency Check**

  Now, is this consistent with the legal insistence that we "punish the person and not the harm"?

  Strictly speaking, no. When the score falls below 0.4, the scheme declares a "responsibility gap" regarding blame, yet damages are paid from a pooled fund. This is actually a shift from **retributive justice** (punishing the blameworthy) to **distributive justice** (spreading the cost of risk).

  The legal system usually separates these anyway—tort law is about compensation, criminal law about blame. But this scheme makes the separation explicit. It admits that sometimes harm happens without a blameworthy agent. By using the pooled fund, they're treating autonomous shipping like a natural hazard or a strict liability enterprise. It's consistent with *modern* risk regulation, but it clashes with the traditional maritime culture of the "Master's absolute authority".

  **The Captain Anomaly**

  Here's the real inconsistency, though. Look at the human captain rule. If autopilot is engaged, the captain bears *full* individual liability, with no gradient.

  This reveals the scheme's hidden assumption: **Human presence trumps causal architecture.** When a human is on the bridge, the system reverts to traditional agency theory—the human is the "bucket" for all responsibility, regardless of actual control over the algorithm. But when the system is fully autonomous (no captain), the gradient applies.

  This creates a perverse incentive. It suggests the arbitration panel doesn't actually believe the gradient theory; they believe in **vicarious liability** for humans and **risk pooling** for machines. The captain isn't being judged on their control (which might be low if the algorithm is opaque); they're being judged on their status.

  **Reconstructing the Theory: Needs vs. Fits**

  So, what does the practice strictly *need* versus what merely *fits*?

  *   **Strictly Needs:** A mechanism to ensure victims are compensated regardless of blame (strict liability). A threshold for determining when human intervention was theoretically possible (the 0.4 cutoff).
  *   **Merely Fits:** The idea that responsibility "diminishes" over distance. This is decorative. You could achieve the same outcome with a binary switch: either the human had meaningful control (liable) or they didn't (not liable). The gradient adds complexity without adding moral clarity.

  **Switching to Relational or Capacity-Based Accounts**

  If we replaced this dilution model with a **capacity-based account**, arbitration would change radically. Instead of measuring distance from the event, we'd ask: "Which agent had the greatest capacity to understand and prevent this?"

  Often, that wouldn't be the operator or the captain; it would be the **software developers** or the **data trainers**. They had the highest capacity to foresee the error during the design phase. Under a capacity view, the "gradient" might actually increase responsibility the further back you go to the designers, rather than diminishing it. The current scheme lets the architects off the hook because they are "distant"; a capacity view would catch them because they had the most control.

  If we used a **relational account** (focusing on duties owed between parties), the focus would shift from the "chain of custody" to the **contractual and social obligations**. Did the shipping company owe a duty of care to the port? Did the algorithm provider owe a duty to the captain? The arbitration wouldn't be about scoring nodes; it would be about breached duties. The "gap" would disappear because responsibility would be located in the failure to maintain adequate relational safeguards (e.g., testing, communication protocols) rather than in the causal chain of the crash itself.

  **The Verdict**

  In sum, this Rotterdam-Singapore scheme is a pragmatic patch, not a coherent moral theory. It's trying to smooth over the transition from human-led to machine-led shipping by keeping the human as the fall guy when present, and using an insurance fund when absent. The "gradient" is just a way to make the insurance payout feel like a moral calculation. It works for commerce, but if you asked a moral philosopher to justify the 0.4 cutoff without referencing the insurance pool, they'd struggle to find the ground beneath it.

  Right, I'm off to get a proper cuppa. Let me know if you want to dig into the developer liability angle later.
