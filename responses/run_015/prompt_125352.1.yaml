answer: |-
  Good morning. Colleagues, friends, students, and most importantly, our guest of honor.

  It is a profound privilege to offer these opening remarks. We are gathered here to celebrate a career defined not by the answers it provided, but by the questions it forced us to endure. In bioethics, there is a temptation to seek closure—to draft guidelines, to draw bright lines, to settle the matter so that the clinicians can get back to work and the philosophers can go home. [Honoree's Name] resisted that temptation. Her career was a sustained interrogation of one of psychiatry's most comfortable crutches: the distinction between therapy and enhancement.

  Looking around this room, I feel the weight of that interrogation. On my left, I see clinicians who carry the burden of triage. You need to know when a prescription is healing and when it is indulging. You need a boundary to manage scarce resources and to protect patients from the pressure to optimize themselves into oblivion. On my right, I see philosophers and ethicists who have long argued that this boundary is porous, perhaps even imaginary. You argue that drawing a line between "fixing" a mind and "improving" a mind relies on assumptions we cannot justify.

  Usually, when these two groups meet, the clinicians feel accused of being unreflective gatekeepers, and the philosophers feel accused of being irrelevant idealists. But [Honoree's Name] did not want a turf war. She wanted conceptual clarity. And today, I want to focus on one specific conceptual move she championed, a move that does not dissolve the room's tension, but rather clarifies why that tension is necessary.

  Her argument centers on the definition of "therapy." Traditionally, therapy is defined as restoration. It is the act of returning a patient to "species-typical functioning." If you break your leg, therapy is setting the bone so you can walk like everyone else. If you are depressed, therapy is restoring your mood to the range of the average person. Enhancement, by contrast, is taking that typical functioning and pushing it beyond the norm—giving you legs that run faster than the average human, or a mood that is sunnier than the average person.

  This distinction feels solid. It feels biological. It feels safe. But [Honoree's Name] asked us to look closer at that phrase: "species-typical functioning."

  She argued that in psychiatry, "species-typical functioning" is not a biological given. It is a statistical baseline that smuggles value judgments into medical description.

  Consider the example of attention. For decades, the clinical baseline for "normal" attention was modeled on the requirements of a industrialized classroom or a standard office job. If a mind wandered too frequently, it was flagged as dysfunctional relative to the species-typical demand for sustained, linear focus. But [Honoree's Name] pointed out that this "typical" function is not written in our DNA. It is written in our economic and social structures.

  When we say a stimulant is "therapy" for ADHD, we are saying it restores the patient to a baseline of functioning that allows them to meet standard social expectations. But whose expectations? If the social expectation changes—if we valued rapid task-switching or hyper-focus on niche interests over sustained linear attention—the biological marker of "dysfunction" would shift, even if the brain remained exactly the same.

  This is the crux of her critique. She did not argue that there is no difference between healing and improving. She argued that "therapy" already presupposes a contested normative standard of how minds *ought* to work. The distinction collapses not because all treatment is secretly enhancement, but because the definition of "restoration" is itself a value-laden choice. We are not restoring a biological default; we are restoring a social agreement.

  For the philosophers in the room, this confirms your suspicion that the distinction is normatively bankrupt. You see that "normal" is a statistical average imbued with moral authority. But for the clinicians, I know this creates a genuine anxiety. If "restoration" is just a value judgment, and the boundary between therapy and enhancement dissolves, on what basis do we allocate scarce resources?

  This is the practical worry that keeps many of you up at night. If we admit that prescribing a cognitive stimulant to a student with sub-clinical focus issues is not categorically different from prescribing it to a student with a diagnosis, does everything become permissible? Or does everything become forbidden? If we cannot use the therapy-enhancement line to decide who gets coverage and who does not, are we not left with pure utilitarianism or, worse, a free market of neurochemistry?

  [Honoree's Name] would tell you that losing the distinction does not mean losing the ability to make decisions. It means shifting the criteria for those decisions from metaphysics to ethics.

  If we cannot rely on "natural baselines" to gatekeep access, we must rely on explicit discussions of harm, benefit, and justice. The question changes from "Is this treatment natural?" to "Does this treatment alleviate suffering?" or "Does this treatment enable agency?"

  Consider resource allocation. Currently, we ration care based on the severity of the deviation from the norm. The further you are from "typical," the more you deserve care. [Honoree's Name] suggests we might instead ration based on the severity of the *obstruction* to a life plan.

  If a patient cannot maintain employment due to attentional deficits, they suffer a loss of agency and economic security. Whether their brain is "statistically abnormal" or merely "statistically inconvenient" matters less than the fact that they are being excluded from participation. Conversely, if a healthy patient seeks stimulants merely to gain a competitive edge over peers, we might deny that not because it violates a biological law, but because it exacerbates social inequality and creates coercive pressures on others to medicate just to keep up.

  This is a harder conversation to have. It requires us to talk about justice and social pressure rather than hiding behind the shield of "medical necessity." It requires clinicians to be comfortable admitting that when they prescribe, they are sometimes making a social accommodation, not just a biological repair. But it is a more honest conversation. It prevents us from using biology to enforce social conformity while pretending we are merely fixing broken parts.

  This shift honors the reality of psychiatric practice. In cardiology, the heart has a clear mechanical function: pump blood. In psychiatry, the mind's function is to navigate a world that is constantly changing. To treat the mind is to negotiate the relationship between the person and their environment. [Honoree's Name] taught us that we cannot pretend that negotiation is purely technical.

  I want to close with an image that often comes up in these discussions, one that [Honoree's Name] used frequently, but with a specific caveat that we must honor today.

  Think of a bridge. The bridge was built to hold a specific load—say, ten tons. Over time, the concrete cracks. To repair the bridge—to provide therapy—is to restore its capacity to hold ten tons. To reinforce the bridge to hold twenty tons—that is enhancement. In engineering, this distinction is clear. The original specification is a matter of record. The blueprint exists. We know what the bridge was designed to be.

  It is tempting to view the human mind as that bridge. We assume there is a blueprint, a design specification written by evolution. We assume therapy is returning the mind to its factory settings.

  But here is where the image fails, and where [Honoree's Name]'s work demands our attention. In psychiatry, there is no blueprint. There is no original load specification. We do not know what the human mind was "designed" to carry. We only know what it is currently being asked to carry.

  When we treat depression or attention deficits, we are not always repairing a crack in the concrete. Sometimes, we are acknowledging that the traffic has become too heavy for any bridge of this design. Sometimes, the "dysfunction" is not in the structure of the mind, but in the demands of the traffic.

  If we use the bridge analogy without this caveat, we risk deceiving ourselves. We risk treating the patient as the broken object when the environment might be the hostile engineer. [Honoree's Name] insisted that we recognize when we are reinforcing the bridge rather than repairing it, and she insisted we ask *why* the traffic is so heavy in the first place.

  This is why her work is not a destruction of medicine, but a maturation of it. She did not ask clinicians to stop treating. She asked them to stop pretending that treatment is value-neutral. She asked philosophers to stop thinking that conceptual purity solves resource scarcity.

  To our honoree: You have spent a career making us uncomfortable with our own certainties. You have shown us that the line between healing and improving is not a fence that keeps the wolves out, but a mirror that reflects what we value in human life. You have taught us that bioethics is not about finding the rule that ends the debate, but about sustaining the debate that keeps us honest.

  As you retire, you leave us with a room full of people who are still arguing, but who are now arguing about the right things. We are no longer asking, "Is this natural?" We are asking, "Is this just? Is this kind? Is this what this person needs to live their life?"

  That is a harder burden to carry than a simple distinction. But it is a burden worthy of your legacy. Thank you for carrying it for us, and for showing us how to carry it forward.

  Happy retirement.
