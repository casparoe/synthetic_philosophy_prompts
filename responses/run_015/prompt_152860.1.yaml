  Title: Limit Fragility and the Ill-Posedness of Supertasks: A Regularization Approach to Thomson's Lamp

  Project Precis
  This paper argues that the persistent indeterminacy of Thomson's Lamp is not merely a logical underdetermination (the Benacerraf objection) nor a physical impossibility (the Earman/Norton objection), but a mathematical ill-posedness revealed through regularization robustness. Standard debates conflate three distinct questions: (a) whether a supertask schedule is logically consistent, (b) whether it is physically realizable, and (c) whether its terminal state is stable under admissible perturbations. I propose that (c) is the diagnostic key. By treating the Lamp not as a discrete logical puzzle but as a limit of a dynamical system, I will demonstrate that its indeterminacy arises because different regularizations (truncation, smoothing, viscosity limits) fail to converge to a unique state. I will contrast this with infinite collision scenarios and relativistic supertasks, arguing that where these cases yield determinate outcomes, it is because their underlying dynamics possess limit robustness despite the infinite structure. The project aims to establish limit fragility as a distinct category of supertask failure, separating conceptual pathologies from physical constraints.

  The Core Question
  The central question driving this research is: Is the indeterminacy of Thomson's Lamp best diagnosed as a failure of limit robustness (ill-posedness) rather than logical incompleteness, and does this criterion successfully distinguish the Lamp from physical supertasks that admit determinate outcomes?

  This question sharpens the vague intuition that "something goes wrong" with the Lamp. The usual answer is that the description simply fails to specify the state at the limit time. My hypothesis is that this is insufficient; many descriptions are incomplete yet do not generate paradox. The specific pathology of the Lamp is that any natural attempt to complete the description via approximation yields contradictory results. The question becomes determinate-ish by focusing on convergence criteria: if a supertask is well-defined, any admissible regularization of the process must converge to the same terminal state. If they diverge, the task is ill-posed. The paper will test whether this condition holds for the Lamp (it should fail) and whether it holds for selected physical supertasks (it should hold, or fail for different reasons).

  Critique of Existing Frameworks
  Current literature typically bifurcates into two camps, both of which leave the specific pathology of the Lamp obscure.

  The first camp, following Benacerraf, treats the Lamp as a logical puzzle. The conclusion is that the description of the lamp's state on the interval [0, 1) does not logically entail the state at t=1. This is technically correct but explanatorily weak. It treats the Lamp as a linguistic trick: you didn't tell me the state, so I don't know the state. This fails to capture why the Lamp feels dynamically unstable in a way that a simple gap in a story does not. It ignores the temporal structure and the accumulation point.

  The second camp, represented by physical impossibility arguments, claims supertasks are ruled out by conservation laws, quantum mechanics, or relativistic constraints. This bypasses the conceptual issue. Even if physics forbids infinite switching, the logical puzzle remains: if we grant the setup for the sake of argument, why is the outcome undefined? Furthermore, this approach cannot distinguish between the Lamp and infinite collision scenarios, both of which may be physically impossible but only one of which seems logically recalcitrant.

  Both positions miss the structural instability. The logical view ignores the dynamics; the physical view ignores the idealization. A regularization approach bridges this by asking how the system behaves as the idealization is approached.

  The Regularization Hypothesis
  The proposal defends the view that regularization robustness is the correct diagnostic tool for supertask coherence. A regularization involves modifying the supertask slightly to make it finite or continuous—for example, imposing a minimum switching time $\epsilon$ and letting $\epsilon \to 0$, or truncating the sequence at $N$ steps and letting $N \to \infty$ with a defined rule for the remainder.

  This approach beats the alternatives for three reasons:
  1.  **It explains the intuition of paradox.** We feel the Lamp is "broken" not because we lack information, but because the information we have pushes in contradictory directions. Regularization makes this contradiction explicit via non-convergence.
  2.  **It unifies logical and physical concerns.** It treats the supertask as a model with a limit structure. If the limit is singular, the model is ill-posed regardless of whether physics allows it.
  3.  **It offers a comparative framework.** It allows us to say why the Lamp is different from a relativistic supertask. In some relativistic cases (e.g., Malament-Hogarth spacetimes), the geometry ensures that signals from the infinite worldline converge determinately at the observer. The regularization would show stability. In the Lamp, the topology of the state space combined with the switching function ensures instability.

  However, I must address the risk that this idea is confused. The primary objection is that applying regularization to a discrete state space (On/Off) is a category error. Regularization requires a topology, but {On, Off} has no natural continuous structure. If I must embed the Lamp in a continuous space (e.g., voltage) to apply regularization, have I changed the subject? The paper will argue that this embedding is not cheating but necessary exposure: the Lamp puzzle only arises because we implicitly assume time is continuous while state is discrete. The friction between continuous time and discrete state is exactly where the singularity lives. Regularization makes this friction visible.

  Methodology and Case Studies
  The paper will proceed in three stages over the 15-week term.

  First, I will formalize the Regularization Criterion. I will define admissible regularizations for supertasks, distinguishing between truncation methods and smoothing methods. I will argue that a supertask outcome is well-defined if and only if all admissible regularizations converge to the same limit.

  Second, I will apply this to Thomson's Lamp. I will demonstrate that standard regularizations (e.g., stopping at the last 'On' vs. stopping at the last 'Off', or smoothing the switch function) yield different limits or no limit. This confirms the ill-posedness diagnosis. I will then compare this to the Benacerraf objection, arguing that regularization explains *why* the description is incomplete in a problematic way, rather than just noting that it is incomplete.

  Third, I will contrast this with two physical supertask cases.
  1.  **Infinite Collision Cases:** I will examine scenarios where infinitely many elastic collisions occur in finite time. Some literature suggests these yield determinate final velocities despite the infinity. I will test if regularizations (e.g., varying mass ratios slightly) converge. If they do, it supports the thesis that the Lamp is uniquely pathological. If they don't, it suggests indeterminism is widespread in supertasks, which is a significant secondary finding.
  2.  **Relativistic Supertasks:** I will briefly analyze a Malament-Hogarth spacetime scenario. Here, an observer receives a signal after an infinite proper time has elapsed elsewhere. The question is whether the received signal is robust. If the geometry enforces convergence, it highlights that the Lamp's failure is not due to infinity per se, but due to the specific dynamics of the switching.

  Possible Conclusions
  There are three likely outcomes, each deciding the project's success differently:

  1.  **Strong Success:** Regularization robustness distinguishes the Lamp from physical supertasks. The Lamp is ill-posed (non-convergent); physical cases are well-posed (convergent) even if physically impossible. This validates (c) as the correct diagnosis and separates logical pathology from physical constraint.
  2.  **Moderate Success:** Regularization shows that infinite collision cases are also ill-posed. This undermines the contrast but still validates the method. It would imply that indeterminism is a generic feature of supertasks, not just a puzzle about lamps. The conclusion would be that supertasks are generally ill-posed dynamical systems.
  3.  **Failure/Collapse:** The regularization criterion collapses into simple continuity of the state function. If "robustness" just means "the state function must be continuous," then the proposal adds nothing to standard analysis. Or, the distinction between (a) and (c) vanishes: showing non-convergence might just be a complicated way of saying "the description doesn't specify the limit."

  I will decide between these based on whether the regularization analysis yields insights that the logical incompleteness argument misses. Specifically, if I can show that some descriptions are logically incomplete yet regularization-stable (and thus intuitively acceptable), while the Lamp is both incomplete and unstable, the hypothesis holds.

  Failure Conditions and Risks
  The project fails if the regularization idea turns out to be confused in the way hinted at above: if applying calculus tools to a discrete logical puzzle is deemed a category error that cannot be philosophically justified. If I cannot defend the move from {On, Off} to a continuous state space without admitting I am solving a different problem (the physical lamp vs. the logical lamp), the core argument collapses.

  Another failure condition is if the distinction between "prescribed consistently" (a) and "robust" (c) dissolves. If every consistently prescribed supertask is automatically robust, then (c) adds no value. I need to ensure there is conceptual space between logical consistency and dynamical stability.

  Finally, the project fails if the scope proves too technical. If demonstrating convergence/non-convergence requires heavy mathematical machinery that overwhelms the philosophical argument, the paper will lose focus. I must keep the math illustrative, not foundational.

  Scope and Feasibility
  For a 6000-word paper, I must strictly limit the technical depth.
  *   **Included:** Formal definition of regularization robustness; detailed analysis of Thomson's Lamp; one infinite collision case (e.g., Pérez Laraudogoita's supertask); one relativistic example.
  *   **Excluded:** Deep dives into quantum supertasks; extensive history of the supertask literature; full proofs of convergence for complex dynamical systems. I will rely on established results for the collision cases rather than deriving them from scratch.
  *   **Seminar Presentation:** The presentation will focus on the distinction between logical underdetermination and limit fragility, using the Lamp vs. Collision contrast as the primary example.

  If the mathematical analysis of the collision cases proves too dense, I will cut the relativistic section entirely and focus on the contrast between the Lamp (discrete state) and Collisions (continuous state). This preserves the core question about state space topology without overextending.

  The 15-week timeline allows 4 weeks for formalizing the criterion, 6 weeks for case analysis, 3 weeks for drafting, and 2 weeks for revision. The risk of scope creep is high given the mathematical temptation; I will adhere to the philosophical diagnosis rather than attempting to solve the dynamical systems myself. The goal is not to do new math, but to use existing math to clarify a philosophical distinction.

  Honest Assessment of the "Confused" Worry
  There is a genuine risk that the regularization idea is merely Benacerraf's point dressed in calculus vocabulary. Benacerraf says the description doesn't fix the state. Regularization says approximations don't fix the state. If the only reason approximations don't fix the state is that the description doesn't fix the state, then I am just repeating Benacerraf.

  To avoid this, I must show that there are cases where the description *doesn't* fix the state (logically), but regularizations *do* converge. If such cases exist, then logical incompleteness and limit fragility are distinct. For example, if a description leaves a gap but the physics forces a unique continuation (like a ball rolling into a valley), the description is incomplete but the outcome is robust. If I can find this asymmetry, the project stands. If I cannot, the proposal admits that the regularization angle may be redundant, and the paper will pivot to arguing that redundancy itself is instructive (i.e., that logical incompleteness in supertasks is always accompanied by dynamical instability).

  This contingency is built into the methodology. I will search for the asymmetry early. If it doesn't exist, the paper argues that logical and dynamical pathologies are co-extensive in supertasks, which is still a substantive claim about the nature of infinity in time.

  Conclusion
  This proposal outlines a shift from asking "Are supertasks possible?" to "Are supertask models well-posed?" By focusing on regularization robustness, I aim to diagnose the specific failure mode of Thomson's Lamp and distinguish it from other infinite tasks. The project is feasible within the word limit provided I restrict the mathematical depth and focus on the conceptual distinction between logical underdetermination and structural instability. The primary risk is category confusion between discrete and continuous states, which I will address head-on as a central philosophical hurdle rather than a technical detail.
