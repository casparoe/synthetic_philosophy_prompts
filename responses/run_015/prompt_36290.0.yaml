      *   *Key Concept:* Negative evidence (knowing what is *not* grammatical) is largely absent.

  3.  **Translate to ML Vocabulary:**
      *   *Input Data:* Training set (positive examples only, mostly). Noisy labels (speech errors).
      *   *Hypothesis Space:* The set of all possible functions/grammars the learner can represent.
      *   *Inductive Bias:* The built-in assumptions of the architecture/algorithm that favor certain solutions over others.
      *   *Generalization:* Zero-shot or few-shot performance on unseen structures.
      *   *Sample Efficiency:* Learning from few examples.
      *   *Negative Evidence:* Explicit counter-examples (e.g., "This sentence is ungrammatical").

  4.  **Drafting the Restatement (Mental Sandbox):**
      *   *Old:* Children hear speech, learn grammar. Input is poor. Grammar is complex. Therefore, innate grammar.
      *   *New:* The learner (child) trains on a dataset (utterances). The dataset is small and lacks negative labels. The loss landscape has many minima (possible grammars). The learner finds the global minimum (correct grammar) without overfitting. Therefore, the architecture has a strong inductive bias that prunes the hypothesis space.

