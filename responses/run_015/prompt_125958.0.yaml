      *   *Correction:* Ensure the distinction between "System Failure" (lack of vents) and "Moral Dilemma" (choice between equals) is clear. The roommate says it's just system failure (logistical). The nurse feels it's moral (choice).
      *   *Refinement:* The "Denial" side in philosophy often argues that if two duties conflict, one wasn't actually a duty. In triage terms: If you can't save both, you never had a duty to save *both* specifically, only to save *maximally*. I need to make sure that translation is clear.

