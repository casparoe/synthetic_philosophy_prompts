  The untranslatable residue reveals a structural blind spot in mechanistic explanation: its inability to represent direct, universal, non-mechanistic causation. Interpretability is inherently naturalistic; it seeks causes *within* the system boundaries. It cannot conceptualize causation that bypasses internal structure entirely without declaring the system broken or uninterpretable. Thus, the framework forces occasionalism into a shape where it looks like extreme skepticism about model robustness or a claim about hidden variables.

  However, this does not reduce occasionalism to mere Humean caution. Hume denies we can *know* necessary connections due to cognitive limits; al-Ghazālī denies they *exist* in creation, positing a positive divine agent instead. The residue preserves this distinction: interpretability asks, "Where is the mechanism?" while occasionalism answers, "There is none; there is only Will." If we collapse this into standard interventionalist caution, we lose the metaphysical force—the assertion that nature is fundamentally contingent and sustained by freedom rather than law. The gap indicates not that occasionalism is less substantive, but that mechanistic frameworks are ontologically committed to secondary causation by definition. They assume mechanisms are real because their method requires isolating them. Therefore, the residue highlights the limits of naturalistic explanation when facing metaphysics that deny the autonomy of nature itself. The framework cannot capture a reality where "law" is subordinate to "person," because the framework treats "law" (weights/architecture) as the primary reality.
