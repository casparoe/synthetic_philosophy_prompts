  For the occasionalist, there are no learned parameters that necessitate an output state. The transition from input state $X$ (fire touching cotton) to output state $Y$ (burning) is not computed by internal weights propagating signal through layers. Instead, every forward pass is a direct intervention by an External Agent (God) who instantiates $Y$ upon the occasion of $X$. The "model" architecture is epistemically useful for predicting the Agent's habitual actions but ontologically empty of causal load. Consequently, no intervention on a representational component guarantees stability across all possible worlds, because the External Agent retains the freedom to decouple $X$ and $Y$ (miracle) without altering any internal state, since there are no internal states bearing causal responsibility.

  This maps the epistemic gap between correlation and mechanism onto the ontological gap between creaturely occasion and divine action. Interpretability seeks invariant features robust to distribution shift; occasionalism asserts no such invariants exist within the created system itself. The "do-operator" belongs exclusively to the External Agent. When we observe $P(Y|do(X))$, we are observing the Agent's habit, not a structural dependency within the system's weights. Thus, occasionalism corresponds to the stronger claim that there are no mechanisms inside the system at all, only a sequence of events that appear coupled because of an external controller's consistent policy. To treat the regularity as a mechanism is to commit the category error of attributing the Agent's efficacy to the instrumentation. The weights are merely a log of past divine actions, not predictors of future necessity. In causal inference terms, the structural causal model (SCM) of the universe has no endogenous variables with causal power; all exogenous variables are collapsed into a single Will. When an interpretability researcher performs a causal mediation analysis, they assume the mediation path exists. Al-Ghazālī claims the mediation is illusory. The correlation between activation $A$ and output $O$ holds only because the External Agent wills $O$ whenever $A$ occurs. If the Agent wills otherwise, $A$ occurs without $O$, demonstrating that $A$ never possessed the power to produce $O$. Thus, counterfactual stability is not a property of the circuit, but of the Agent's consistency.

  ### Residue Report

