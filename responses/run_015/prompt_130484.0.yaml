answer: |-
  ### Pedagogical Verdict & Honest Assessment

  **Can this activity reproduce the argument's force?**
  Yes, but with a significant caveat. You are asking to physicalize a *logical/intensional* problem (the scope of names and concepts) into a *mereological/spatial* one (parts, wholes, and physical attachment). This necessarily introduces anachronism. Gongsun Long is arguing about the *reference of terms* (ming), not the physical composition of objects. A physical "inseparable card" suggests that the property is a *part* of the object, whereas Gongsun Long argues the property is a *determination of the name*.

  **The Risk:** Students will conclude that "White Horse is not Horse" because the white paint is physically in the way, not because the concept "White" restricts the extension of "Horse."

  **The Mitigation:** This activity is viable *only if* treated as a phenomenological hook. It forces students to feel the *friction* of categorical exclusion. However, the facilitator **must** explicitly dismantle the physical metaphor during the debrief to restore the logical distinction. If you run this activity without the corrective debrief, you will teach a distorted version of the School of Names.

  If you are comfortable acting as the corrective lens during the debrief, proceed. If you want the activity to stand entirely on its own without verbal correction, do not run it; it will reinforce empirical mereology over logical analysis.

  ***

  # Activity Design: The Tribunal of Forms and Colors

  **Session:** 80 Minutes
  **Participants:** 14 Students (2 Tribunals of 7)
  **Goal:** To induce the logical friction of *Bai ma fei ma* (A white horse is not a horse) through procedural constraints on classification.

  ## 1. Group Division & Roles
  Divide the class into **Two Tribunals** (7 students each). This allows for parallel processing and comparative debriefing.
  Within each Tribunal:
  *   **Archivists (4 students):** Handle the artifacts and attempt to file them.
  *   **Inspectors (2 students):** Enforce the sealing rules and verify category compliance.
  *   **Scribe (1 student):** Records "Consistency Points" and notes any rule violations.

  *Rotate roles halfway through if time permits, but for flow, keep roles static for the main exercise.*

  ## 2. Materials Needed
  *   **Form-Blocks:** 20 plain wooden blocks (10 Circles, 10 Squares). Sanded smooth.
  *   **Composite Artifacts:** 10 wooden blocks identical to above, but **encased in a rigid, transparent colored resin sleeve** (or tightly shrink-wrapped with colored film that cannot be removed without destroying the block). 5 White-Sleeved Circles, 5 White-Sleeved Squares.
  *   **Category Seals:** Rubber stamps with ink.
      *   *Seal A (FORM):* Reads "HORSE" (or use Shape icons: Circle/Square).
      *   *Seal B (COLOR):* Reads "WHITE" (or Color swatch).
  *   **Filing Bins:** Two boxes per Tribunal.
      *   *Bin 1:* Labeled "SIMPLE FORMS" (The "Horse" category).
      *   *Bin 2:* Labeled "COMPOUND DESIGNATIONS" (The "White Horse" category).
  *   **Solvent Spray (Prop):** A small spray bottle labeled "Separation Solution." (It is empty or contains water; spraying it cracks the resin sleeve/ruins the block, demonstrating "destruction upon separation").
  *   **Scoreboard:** Whiteboard tracking "Consistency Points."

  ## 3. The Narrative Frame (5 Minutes)
  **Facilitator Script:**
  "You are archivists in a reconstructed Warring States bureau. Your task is not to describe the world, but to rectify names (*zheng ming*). The Archive accepts objects only if they match their designated seals. You are not judging reality; you are judging *admissibility* based on strict categorical rules. Your goal is maximal Consistency Points. You lose points for ad hoc categories or rule contradictions."

  ## 4. Timeline & Phases

  ### Phase 1: The Intuitive Sort (15 Minutes)
  *   **Task:** Archivists sort the **plain wooden blocks** into Bin 1 (SIMPLE FORMS).
  *   **Rule:** Apply the FORM Seal to the wood. If it stamps clearly, file in Bin 1.
  *   **Outcome:** Easy. Students stamp the wood, file the blocks. High confidence.
  *   **Points:** +10 per correct file.

  ### Phase 2: The Introduction of Boundary-Properties (20 Minutes)
  *   **Task:** Introduce the **Composite Artifacts** (White-Sleeved Circles).
  *   **New Rule:** "An object may only enter Bin 1 (SIMPLE FORMS) if the FORM Seal makes direct contact with the Form-Block material. If a boundary-property (Color Sleeve) intervenes, the Form is obscured."
  *   **Action:** Archivists try to stamp the White-Sleeved Circle. The ink smudges or doesn't take on the resin.
  *   **Inspector Ruling:** Inspectors must declare: "Form not verified. Admittance to Bin 1 denied."
  *   **Conflict:** Archivists argue, "But it *is* a Circle underneath."
  *   **Facilitator Intervention:** Remind them of the Stakes. "The Archive does not care about 'underneath.' It cares about verifiable designation. If you cannot stamp it as Form, it is not Form *for the purposes of this Archive*."
  *   **Forced Move:** They must file the White-Sleeved Circle in Bin 2 (COMPOUND).

  ### Phase 3: The Paradoxical Crisis (25 Minutes)
  *   **Task:** The Scribe presents the final ledger.
  *   **The Trap:** The Tribunal must answer one final question to claim their bonus points: **"Does Bin 2 contain Forms?"**
  *   **The Dilemma:**
      *   If they say **YES**: They contradict their own filing rules (which denied Bin 1 entry because Form was not verifiable). *Loss of Consistency Points.*
      *   If they say **NO**: They deny the obvious reality that a White Circle is a type of Circle. *Loss of Intuitive Coherence.*
      *   If they create **Bin 3 (Hybrid)**: "White-Circle Forms." *Immediate Disqualification (Ad Hoc Category Rule).*
  *   **The Climax:** Students are forced to formally record: "The White Circle is not a Circle" (to maintain consistency with their sealing rules).
  *   **Result:** They have physically enacted *Bai ma fei ma*.

  ## 5. Debrief & Conceptual Mapping (15 Minutes)
  *Do not lecture immediately. Ask the Scribes to read their final contradictory ledger.*

  **Mapping the Activity to the Dialogue:**

  1.  **The Plain Blocks (Pre-theoretical Intuition):**
      *   *Activity:* Stamping plain wood was easy.
      *   *Dialogue:* Corresponds to the ordinary intuition that "a white horse is obviously a horse."
      *   *Concept:* Unmarked reality vs. Simple Names.

  2.  **The Resin Sleeve (The Determination of Color):**
      *   *Activity:* The sleeve was physically inseparable without destruction.
      *   *Dialogue:* Corresponds to *se* (color/appearance) as a conceptual determinant.
      *   *Concept:* In the activity, the sleeve is physical. In the text, "White" is a logical constraint. *Facilitator Note: Highlight this distortion here.*

  3.  **The Sealing Rule (Separability of Form and Color):**
      *   *Activity:* The rule required the Form Seal to touch wood *without* color interference.
      *   *Dialogue:* Gongsun Long's claim that "Horse" names the form, "White" names the color, and "White Horse" names the compound.
      *   *Concept:* The activity forces *spatial* separation (stamp vs. sleeve) to simulate *logical* separation (concept vs. concept).

  4.  **The Denial of Entry (The Paradoxical Conclusion):**
      *   *Activity:* "White Circle cannot go in Circle Bin."
      *   *Dialogue:* "A white horse is not a horse."
      *   *Concept:* The students felt the frustration of denying category membership. This is the *force* of the argument: it preserves categorical purity at the cost of common sense.

  ## 6. Troubleshooting Predictable Failures

  **Failure A: The Hybrid Category Cheat**
  *   *Student Move:* "Let's just make a bin for 'White Circles' and count that as a subset of Circles."
  *   *Facilitator Response:** Do not lecture. Invoke the Stakes. "The Tribunal Charter (Rule 3) forbids hybrid categories. Rectification of Names requires distinct terms. If you merge them, you lose all Consistency Points. You must choose: Consistency or Intuition."
  *   *Philosophical Point:* This mirrors the School of Names' commitment to logical rigor over pragmatic utility.

  **Failure B: The Linguistic Ambiguity Defense**
  *   *Student Move:* "It depends on what 'is' means. It *is* a horse in reality, just not in name."
  *   *Facilitator Response:** "In this Tribunal, 'is' means 'is admissible under the Seal.' You are operating within a closed system of designation. Gongsun Long is doing the same. He is not denying the animal exists; he is denying the *name* 'Horse' applies to the *name* 'White Horse'."
  *   *Philosophical Point:* Shifts focus from ontology (what exists) to semantics (what names refer to).

  **Failure C: Destroying the Sleeve**
  *   *Student Move:* A student tries to peel off the resin to stamp the wood.
  *   *Facilitator Response:** Activate the "Solvent Spray" prop. "Attempted separation destroys the artifact. The object ceases to be a White Circle if you remove the White."
  *   *Philosophical Point:* This illustrates that the compound designation is a unity; removing a predicate changes the subject entirely.

  ## 7. Critical Limitations (Facilitator's Closing Statement)
  *You must deliver this verbally to correct the anachronism.*

  "Today you felt the paradox physically. But you must now discard the physical metaphor.
  1.  **Logic vs. Space:** Gongsun Long does not think 'White' is a layer on top of 'Horse.' He thinks 'White' is a conceptual constraint that narrows the scope of 'Horse.' The resin sleeve made it look like *parts*; the argument is about *intensions*.
  2.  **Dialectic vs. Archive:** This was a sorting game. The original text was a debate about political language and the reliability of officials. The stakes were social order, not archive points.
  3.  **The 'Is' of Identity:** You struggled with whether the block 'is' a circle. Gongsun Long is arguing that the *term* 'White Horse' is not identical to the *term* 'Horse.'

  You reconstructed the *friction* of the argument, but do not mistake the resin sleeve for the concept of Color. The true separation is in the mind, not on the wood."
