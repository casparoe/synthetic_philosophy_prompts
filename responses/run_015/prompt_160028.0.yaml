answer: |-
  It is a pleasure to correspond with someone who recognises that the problem of the archive is, at its heart, a problem of population estimation. You are quite right: the historian's dilemma is the ecologist's dilemma. We are both trying to estimate $N$ (the total reality) using $n$ (the detected sample), knowing that detection probability $p$ is neither uniform nor known.

  Here is my decomposition of your proposition, the arithmetic of silence, and where I believe the uncertainty truly lies.

  ### 1. Pinning the Proposition

  Your proposed audit—taking the questions historians in 2125 will ask and tracing the failures—is methodologically seductive but impossible to execute ex-ante. We cannot know the questions. Historiography is not static; it is driven by the anxieties of the present. A historian in 2125 might care deeply about carbon footprints of individual households (high record density) or the emotional texture of lockdown isolation (low record density).

  **Better Design:** Instead of "Questions", we must model "Domains of Ordinary Life". We divide ordinary life into mutually exclusive categories (e.g., Economic Transaction, Private Communication, Public Movement, Interior State, Casual Speech). We then estimate the *Record Creation Rate* ($C$) and the *Record Survival/Retrieval Rate* ($S$) for each domain.

  The proposition then becomes: Is $\sum (1 - C)$ greater than $\sum (C \times (1 - S))$ across all domains?

  **On Circularity:** You worry that "what they will want to know" is trimmed to fit the archive. This is the *file drawer problem* applied to historiography.
  *   **The Bias:** Historians tend not to ask questions they believe are unanswerable. If they know no record exists (Non-Creation), they often reframe the question or abandon it. If they believe a record *should* exist but is missing (Loss), they frame it as a mystery or a gap.
  *   **The Sign:** This circularity biases your sample of "unanswerable questions" *towards Loss*. The set of "things they want to know but can't" will be disproportionately populated by things they *think* were recorded but cannot find.
  *   **Effect on Number:** This circularity works *against* your brother-in-law's 0.9. It inflates the apparent share of Loss. I have adjusted my final credence downwards to account for this.

  ### 2. The Sub-Questions and Arithmetic

  Here are the parameters required to solve the equation. I have provided a point estimate and a one-line justification for each.

  **A. The Creation Rate ($C$): What proportion of 'ordinary life' generates a durable trace?**
  *   **Number:** 0.35 (35%)
  *   **Justification:** While digital exhaust is high (transactions, location), the bulk of 'ordinary life' remains interior thought, unrecorded speech, and ephemeral interaction which leaves no intentional or passive trace.

  **B. The Digital Fragility Factor ($F$): What proportion of created digital records survive 100 years?**
  *   **Number:** 0.20 (20%)
  *   **Justification:** Corporate platform collapse, format obsolescence, encryption key loss, and the sheer cost of migrating petabytes of trivial data will cull the majority of 2020s digital material.

  **C. The Physical Decay Rate ($D$): What proportion of physical records (paper, photos) survive?**
  *   **Number:** 0.60 (60%)
  *   **Justification:** Paper is surprisingly robust if stored passively; however, the 2020s generated relatively little physical paper regarding 'ordinary life' compared to the 1970s.

  **D. The Retrieval Silence ($R$): Of what survives, what proportion is functionally invisible?**
  *   **Number:** 0.50 (50%)
  *   **Justification:** Cataloguing backlogs, paywalls, unindexed datasets, and the 'rich-get-richer' citation dynamic mean half of preserved material is effectively undetectable to a standard researcher.

  **E. The Definition of 'Record' ($Def$): Does metadata count?**
  *   **Number:** 1.0 (Included)
  *   **Justification:** For the historian of 2125, a server log is a record; excluding it would artificially inflate Non-Creation, so we must include all data-bearing objects.

  ### 3. Retrieval Silence: Classification

  You ask if *retrieval silence* is a genuine additional cause or non-creation at one remove.

  In ecological terms, this is detection probability $p < 1$. In your arithmetic, it must be classified as **Loss**.
  *   **Reasoning:** If a record exists in a box but is never found, the historical knowledge is identical to a scenario where the record was burned. The epistemic outcome is the same.
  *   **Placement:** It acts as a multiplier on the Survival Rate. Effective Survival = Physical Survival $\times$ Retrieval Probability.
  *   **Arithmetic:** It does not add a new term to the numerator/denominator; it reduces the $S$ term in the Loss equation.

  ### 4. The Combination

  Let us model 100 units of "Ordinary Life Information".

  1.  **Non-Creation Gap:**
      *   Total Units: 100
      *   Created ($C = 0.35$): 35 units.
      *   **Never Created:** 65 units.

  2.  **Loss Gap (Created but Unrecoverable):**
      *   Created: 35 units.
      *   *Physical/Digital Survival:* We weight this. Assume 80% of created records are digital (fragile), 20% physical (robust).
          *   Digital: $35 \times 0.8 = 28$ units. Survival ($F=0.2$) = 5.6 survive.
          *   Physical: $35 \times 0.2 = 7$ units. Survival ($D=0.6$) = 4.2 survive.
          *   Total Surviving: 9.8 units.
      *   *Retrieval Silence:* Of the 9.8 survivors, only 50% are retrievable ($R=0.5$).
          *   Effectively Recoverable: 4.9 units.
      *   **Total Loss:** Created (35) - Recoverable (4.9) = **30.1 units**.

  3.  **Comparison:**
      *   Non-Creation: 65 units.
      *   Loss: 30.1 units.
      *   Ratio: Non-Creation is roughly 2.15 times larger than Loss.

  **However**, we must apply the **Circularity Correction**. As noted in Section 1, the historian's "want to know" filter likely discards many of the 65 Non-Creation units (as "unknowable") but retains the 30 Loss units (as "missing"). If we assume this filter removes 50% of the Non-Creation questions but only 10% of the Loss questions:
  *   Adjusted Non-Creation: 32.5 units.
  *   Adjusted Loss: 27.1 units.
  *   The gap narrows precipitously.

  **Final Credence:**
  Taking the raw arithmetic (favouring Non-Creation) and the circularity bias (favouring Loss), I pin my credence that Non-Creation dominates at:

  **0.68 (± 0.15)**

  **Justification:** While the vast majority of life is unrecorded (supporting your brother-in-law), the specific subset of *questions historians formulate* is biased towards things they suspect were recorded but cannot find, which narrows the gap significantly (supporting your scepticism).

  ### 5. The Least Confident Term

  The term I am least confident about is **B: The Digital Fragility Factor ($F$)**.

  *   **Current Estimate:** 0.20 (20% survival).
  *   **Why:** We are in a period of technological transition. It is possible that 2125 possesses vastly superior data recovery tools (AI reconstruction of fragmented data, universal emulation layers) that push survival to 0.80. Conversely, a "Digital Dark Age" scenario (loss of encryption keys, proprietary format lock-in) could push it to 0.05.
  *   **What would move it:** Evidence of long-term corporate data stewardship. If we see tech giants successfully migrating data across 50-year cycles without loss *now*, I would raise $F$. If we see mass deletion of 'legacy' data to save costs (already happening), I would lower it.
  *   **Impact:** If $F$ rises to 0.60, Loss drops dramatically, and my credence in the proposition (Non-Creation dominates) shoots to 0.85. If $F$ drops to 0.05, Loss dominates, and the credence falls to 0.30. This is the pivot point of your disagreement with your brother-in-law. He assumes paper rules (high survival); you suspect digital rules (high loss). The truth is likely a messy hybrid.

  ### Summary for the Field Ecologist

  You are correct to treat this as a detection bias problem. *Retrieval Silence* is simply $p < 1$ for the subset $N_{created}$. The circularity of historical questioning is akin to choosing survey sites based on where you previously found animals; it biases your estimate of 'absence' towards 'detection failure' rather than 'true absence'.

  Your brother-in-law is betting on the permanence of human silence (most things aren't recorded). You are betting on the impermanence of human noise (most things recorded are lost). My modelling suggests he is right about the *world*, but you are right about the *archive*: the questions historians ask will make the Loss feel just as heavy as the Non-Creation.

  Yours,

  A Modeller of the Missing.
