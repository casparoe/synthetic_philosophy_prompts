      *   *Check Constraints:* No citations, no journal access needed.
      *   *Refining the "Extension":* The prompt suggests "attention or salience" or "status quo." Let's go with **Psychic/Activation Costs**. It's the most philosophically robust way to save the rational choice model without abandoning it entirely. It turns "zero cost" into "non-zero psychic cost."
