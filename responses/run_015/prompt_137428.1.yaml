      *   **Specific Challenge:** Students already know the basics (present bias, $\beta$-$\delta$, preference reversal, Ulysses/commitment). The question needs to push beyond rote application of these concepts to distinguish A-grade from B-grade work.
      *   **Core Idea:** A case where the cost of action is negligible (near-zero effort/time), yet the agent still procrastinates/fails to act. Standard hyperbolic discounting usually relies on *delayed* rewards vs. *immediate* costs (or vice versa). If both are immediate and cost is near-zero, why the failure?
      *   **Goal:** Force students to critique/extend the hyperbolic model (e.g., attention, salience, status quo bias, psychic costs) and discuss whether this remains "akrasia" or becomes something else (compulsion, negligence, etc.).
      *   **Output:** Question, Model Answer, Marking Scheme (with A vs. B distinctions), List of Common Wrong Answers.

  2.  **Developing the Case Study:**
      *   *User's Idea:* Greyscale button or 40-second form for $20.
      *   *Critique:* The $20 form is good because it introduces a reward, but the prompt asks about "costs them basically nothing." The greyscale button is a self-control pre-commitment.
      *   *Refinement:* Let's combine them into a "Zero-Cost Pre-commitment" scenario. It highlights the paradox: If hyperbolic discounting explains akrasia as valuing immediate gratification over long-term good, what happens when the "long-term good" action requires *no* sacrifice of immediate gratification?
      *   *Selected Case:* "The $50 Form." A student needs to fill out a digital form to claim a $50 scholarship. It takes 30 seconds. No cost. They leave it open for weeks.
      *   *Why this works:* Standard discounting says $V = Reward / (1 + k \cdot Delay)$. If Delay $\approx$ 0 and Cost $\approx$ 0, $V$ should be high. Why isn't it acted upon? This breaks the simple math of temporal discounting.

  3.  **Drafting the Question:**
      *   Needs to be clear, concise, and directive.
      *   Must explicitly ask for the limitation of the standard model and the philosophical implication (is it still akrasia?).
      *   *Draft:* Present the case. Ask: (1) Why does standard hyperbolic discounting struggle here? (2) What modification fixes it? (3) Does this modification change the definition of weakness of will?

  4.  **Developing the Model Answer:**
      *   *Length:* 500-600 words.
      *   *Structure:*
          1.  Define standard hyperbolic account (time inconsistency).
          2.  Apply to case (show the failure).
          3.  Propose extension (Psychic Cost/Attention/Salience).
          4.  Philosophical implication (Akrasia vs. Negligence/Irrationality).
      *   *Key Argument:* Standard discounting requires a trade-off between *now* and *later*. In the zero-cost case, there is no trade-off. Therefore, the "cost" must be hidden (psychic/activation energy). If it's hidden psychic cost, is it truly weakness of will (knowing better but failing) or just a cognitive glitch?
      *   *Tone:* Academic but accessible (Grade 12 Philosophy).

  5.  **Designing the Marking Scheme:**
