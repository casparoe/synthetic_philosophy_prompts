          *   Identification of the Anomaly (5 marks).
          *   Proposed Solution/Extension (5 marks).
          *   Philosophical Implication (5 marks).
      *   *A vs. B:* B students explain discounting correctly but force it to fit. A students recognize it *doesn't* fit and require a new variable (like "activation energy" or "salience") and question the label "akrasia."

  6.  **Identifying Wrong Answers (Distractors):**
