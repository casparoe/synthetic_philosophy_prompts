answer: |-
  ### Exam Question: Philosophy 12 – Action & Rationality
  **Section:** Weakness of Will & Temporal Choice
  **Time Allowed:** 30 Minutes
  **Total Marks:** 20

  **Question 1: The Zero-Cost Paradox**

  Read the following case study:

  > **The $50 Tab:** Alex is a student who needs to submit a digital form to claim a $50 course credit. The form is already open in a browser tab on their laptop. Filling it out requires typing their name into one box and clicking "Submit." The task takes 30 seconds. There are no competing temptations (Alex is not watching a movie or playing a game); they are simply working at their desk. Alex explicitly judges that submitting the form *now* is better than submitting it later. Yet, Alex leaves the tab open for three weeks, constantly thinking "I'll do it in a minute," before finally submitting it only when the deadline is about to expire.

  Standard models of **hyperbolic discounting** explain weakness of will (akrasia) as a preference reversal caused by the proximity of immediate costs or rewards.

  (a) Explain why the standard hyperbolic discounting model struggles to explain Alex's behavior in *The $50 Tab* case. (5 marks)
  (b) Propose **one** theoretical modification (e.g., psychic costs, salience, status quo bias) that could rescue the model. Explain how this modification accounts for the delay. (7 marks)
  (c) If we accept your modification in (b), does Alex's behavior still count as genuine **akrasia** (weakness of will), or does it become a different kind of failure (e.g., negligence, cognitive error)? Justify your view. (8 marks)

  ***

  ### Model Answer (Approx. 550 words)

  Standard hyperbolic discounting models explain akrasia through time-inconsistent preferences. Usually, an agent prefers a larger-later reward over a smaller-sooner one when both are in the future, but reverses this preference when the smaller-sooner reward becomes immediate. This is mathematically modeled using a discount function where the value of a future outcome drops sharply as it gets closer to the present. However, in *The $50 Tab*, this model struggles because there is no temporal trade-off. The cost of action (30 seconds of typing) is immediate, but it is negligible. The reward ($50) is also effectively immediate upon completion. There is no competing "smaller-sooner" temptation (like watching TV) pulling Alex away. If the discount rate applies only to *delay*, and the action takes almost no time, the discounted value of the action should remain high. The standard model assumes the agent is weighing costs against rewards over time, but here, the cost is near-zero and the delay is self-imposed without external interference. The math implies Alex should act instantly, yet they do not.

  To rescue the model, we must introduce the concept of **psychic activation costs**. While the *physical* cost is zero, the *psychic* cost of initiating a task may be non-zero. This is often described as "activation energy." Even if a task is easy, the mental transition from "idle" to "acting" carries a subjective burden, perhaps due to minor anxiety, boredom, or the cognitive load of context-switching. In this modified model, Alex is not discounting the $50 based on time, but is discounting it based on the immediate negative feeling of starting. The hyperbolic curve still applies, but it is discounting against the immediate psychic pain of initiation rather than a temporal delay. As long as the tab is open, the task is "present," creating a low-level psychic cost that Alex avoids by procrastinating.

  This modification complicates whether Alex's behavior is genuine akrasia. In the Aristotelian sense, akrasia requires acting against one's better judgment while knowing what is best. If the failure is caused by hidden psychic costs, Alex is technically still choosing the path of least resistance against their better judgment, which preserves the definition of akrasia. However, if the modification relies on **salience** or **attention** (e.g., Alex literally forgets the tab exists because the reward isn't visually stimulating), the behavior shifts from weakness of will to **negligence** or cognitive error. Akrasia implies a conflict of will; negligence implies a failure of awareness. If Alex leaves the tab open because the "Submit" button lacks visual salience, they aren't overcoming by a stronger desire; they are failing to register the option fully. Therefore, if we explain the case via psychic costs, it remains akrasia (a conflict between judgment and motivation). If we explain it via attention/salience, it ceases to be weakness of will and becomes a failure of rational agency altogether, as the agent is no longer fully "present" to the choice.

  ***

  ### Marking Scheme (20 Marks)

  **Part (a): The Limitation of the Standard Model (5 Marks)**
  *   **5 marks:** Clearly identifies that standard discounting relies on a trade-off between immediate costs/temptations and future rewards. Notes that in this case, costs are negligible and there is no competing temptation, so the "discount" should be near zero.
  *   **3-4 marks (B Range):** Explains hyperbolic discounting correctly but vaguely applies it to the case (e.g., "Alex values now over later") without explaining *why* that doesn't fit a zero-cost task.
  *   **1-2 marks:** Defines discounting but fails to apply it to the specific constraints of the case.
  *   **0 marks:** Irrelevant or incorrect definition.

  **Part (b): Theoretical Modification (7 Marks)**
  *   **6-7 marks (A Range):** Proposes a specific mechanism (Psychic Cost, Activation Energy, Salience, or Status Quo Bias) and explains *how* it functions as a proxy for "cost" in the absence of physical effort. Explicitly links this back to the discount function (e.g., "This creates an immediate negative utility").
  *   **4-5 marks (B Range):** Suggests a modification (e.g., "Alex is lazy" or "Alex is distracted") but treats it as a description rather than a theoretical variable. Fails to explain how it fits the economic/philosophical model.
  *   **1-3 marks:** Vague suggestion without explanation.

  **Part (c): Philosophical Implication (Akrasia vs. Other) (8 Marks)**
  *   **7-8 marks (A Range):** Makes a clear distinction between *akrasia* (conflict of will/judgment) and *negligence/error* (failure of attention). Argues that depending on the modification chosen in (b), the label might change. Justifies the position (e.g., "If it's psychic cost, it's still a choice, so it's akrasia").
  *   **5-6 marks (B Range):** Takes a stance but treats "akrasia" as a fixed label without analyzing the conditions required for it. Asserts "It is still akrasia because Alex chose not to act" without addressing the knowledge/judgment condition.
  *   **1-4 marks:** Minimal engagement with the definition of akrasia.

  **Total: 20 Marks**

  ***

  ### Common Wrong Answers / Distractors
  *Use these to identify B-grade or lower responses during marking.*

  1.  **"Alex is just lazy."**
      *   *Why it's wrong:* This is circular. "Laziness" is the phenomenon to be explained, not the explanation. It adds no theoretical value.
  2.  **"The $50 wasn't enough reward."**
      *   *Why it's wrong:* Misses the point of the prompt. The prompt establishes Alex *judges* it better to do it. The value is subjective and already accepted by the agent.
  3.  **"Hyperbolic discounting explains everything."**
      *   *Why it's wrong:* Fails Part (a). If standard discounting explained everything, there would be no "struggle" to explain a zero-cost delay. This ignores the mathematical constraint that discounting requires *time* to function.
  4.  **"It is compulsion, not akrasia."**
      *   *Why it's wrong:* Compulsion implies the agent *cannot* stop themselves (like an addiction). Alex *could* click the button but doesn't. This confuses inability with unwillingness.
  5.  **"Alex forgot."**
      *   *Why it's wrong:* The case says Alex "constantly thinking 'I'll do it in a minute'." Forgetting is a memory failure, not a will failure. If they remember but don't act, it's not simple forgetting.

  ***

  ### Teacher's Note: Differentiating the A-Student
  The key differentiator is in **Part (c)**.
  *   **The B-Student** will treat the philosophy as static. They will say: "Alex didn't do what they said they would, so it is weakness of will." They accept the label without testing the conditions.
  *   **The A-Student** will treat the philosophy as conditional. They will argue: "Weakness of will requires a conflict between judgment and desire. If our explanation for the delay is *low salience* (Alex didn't notice the button), there is no conflict, so it isn't akrasia. If the explanation is *psychic dread*, there is a conflict, so it is akrasia." They recognize that changing the *mechanism* changes the *moral category*.
