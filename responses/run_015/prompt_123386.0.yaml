answer: |-
  Consider a Phase III clinical trial for a neural interface where the validity of the aggregate dataset depends on minimizing algorithmic noise, requiring a specific procedural burden: the temporary suspension of individual data sovereignty. In the distributed version, 1,000 trial participants each consent to a minor, non-medical protocol deviation where 0.1% of their ancillary biometric data is made publicly accessible to optimize the training set; the total privacy loss sums to 100 units, securing the trial's success and benefiting future patients. In the concentrated version, a single participant consents to a protocol deviation where 100% of their ancillary biometric data is made publicly accessible; the total privacy loss is identical at 100 units, and the trial's success is equally secured. A strict act utilitarian permits both scenarios, calculating that the identical total burden is outweighed by the identical public health benefit in either case. The separateness-of-persons objector, however, forbids the distributed version because it treats the 1,000 individuals as interchangeable vessels for dissipating a cost, effectively dissolving their moral boundaries to facilitate a sum; yet this objector permits the concentrated version, reasoning that because the burden is not aggregated across distinct persons but contained within a single moral boundary, the specific structural sin of cross-personal summation is absent. Conversely, a contractualist permits the distributed version, arguing that no single individual can reasonably reject a principle requiring a negligible 0.1% privacy loss for the greater good, but forbids the concentrated version, as it is unreasonable to expect any single person to accept total data sovereignty loss regardless of the aggregate benefit. The precise structural feature forcing this reversal is not the magnitude of harm or the number of people involved, but the *topology of the burden*: whether the moral cost is fragmented across boundaries (violating separateness) or consolidated within one (violating reasonable acceptability). I take the position that this reversal demonstrates the separateness objection is genuinely about the illegitimacy of treating individuals as fungible parts of a collective pool, rather than a blanket prohibition on sacrifice. This implies the scope of the objection is narrower than often assumed; it specifically targets the *mathematical operation* of aggregation that renders persons invisible, not the substantive outcome of individual suffering. Consequently, a moral framework can respect the separateness of persons by acknowledging individual boundaries—even while imposing heavy burdens within them—whereas contractualism provides the necessary protection against the *weight* of those burdens, suggesting that separateness and reasonable rejectability are distinct, complementary constraints rather than redundant expressions of the same intuition.
