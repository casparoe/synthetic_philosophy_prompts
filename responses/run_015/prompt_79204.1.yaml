answer: |-
  Here is the conceptual carving you requested, proceeding from the nearest existing concepts to a precise definition and coinage.

  ### Brainstorming the Nearest Concepts

  To locate this pattern, we must first map the surrounding terrain of decision theory and moral philosophy.

  1.  **Pascal's Mugging:** This is the closest relative. In the classic thought experiment, a mugger threatens you with infinite disutility unless you give them five dollars, claiming they have magic powers. The probability is arbitrarily low, but the stakes are arbitrarily high. The standard rebuttal is that we should discount probabilities that are not grounded in evidence. However, in your pattern, there is no "mugger" making a strategic claim. The probability is not arbitrary; it is presented as a rational acknowledgment of ignorance.
  2.  **The Fanaticism Objection:** This is the *consequence* of the pattern, not the pattern itself. "Fanaticism" in decision theory refers to the conclusion that Expected Utility Theory (EUT) forces agents to prioritize tiny probabilities of huge outcomes over certain moderate goods. Your character's interlocutors are using a specific *method* to reach this fanatical conclusion, but "fanaticism" describes the output, not the input mechanism.
  3.  **Moral Uncertainty:** This field deals with how to act when we are unsure which moral theory is true (e.g., utilitarianism vs. deontology). Your pattern is similar but distinct: it is not uncertainty about *value*, but uncertainty about *ontology* (does the insect have an inner life?).
  4.  **Knightian Uncertainty:** This distinguishes between "risk" (known probabilities) and "uncertainty" (unknown probabilities). The move you describe attempts to convert Knightian Uncertainty (we don't know if insects feel) into Risk (we assign a 1 in a million chance) to make it calculable.
  5.  **The Principle of Indifference:** This is a rule of thumb in probability that says if you have no evidence for one outcome over another, you should assign them equal probability. The interlocutors are using a weak version of this: "I have no proof they *don't* feel, so the probability must be non-zero."

  ### The Verdict on an Established Term

  There is **no single established term** that captures this exact structural move.

  While philosophers discuss "reckless credences," "epistemic objections to longtermism," or "the problem of tiny probabilities," none of these terms isolate the specific *asymmetry* you identified: the shielding of the probability as subjective/metaphysical while treating the magnitude as objective/empirical. Existing terms focus either on the absurdity of the conclusion (Fanaticism) or the arbitrariness of the probability (Mugging). They miss the *epistemic double-standard* that makes the argument resilient to critique.

  ### The Coinage: "The Asymmetric Credence Lever"

  I propose the term **The Asymmetric Credence Lever** (or simply **The Credence Lever**).

  This term captures the mechanical nature of the argument: it uses a lever to multiply a small force (credence) into a massive output (obligation), but the fulcrum rests on an asymmetry of epistemic standards.

  ### Precise Definition

  **The Asymmetric Credence Lever** is a decision-theoretic maneuver defined by the following three components:

  1.  **The Shielded Input (Probability):** A probability assignment regarding a metaphysical or unobservable property (e.g., sentience, simulation hypothesis, existential risk). This probability is defended as a *subjective degree of belief* (credence). Because it concerns a metaphysical question, it is treated as immune to empirical falsification. One cannot prove the probability is zero, so the proponent insists it must remain non-zero.
  2.  **The Hardened Input (Magnitude):** A quantity regarding the scope of the outcome (e.g., number of insects, number of future humans, amount of suffering). This is treated as an *empirical fact* or a robust demographic projection. It is not subjected to the same skeptical scrutiny as the probability.
  3.  **The Asymmetric Operation:** The two inputs are multiplied via Expected Value theory. The Shielded Input is protected from empirical reduction (you can't prove it's zero), while the Hardened Input is protected from metaphysical skepticism (you can't prove the insects don't count). The result is a dominant Expected Value that overrides competing priorities.

  ### Differentiation from Neighbors

  **Vs. Pascal's Mugging:**
  *   **Pascal's Mugging** relies on the *arbitrariness* of the probability. The mugger *says* the probability is 1 in a googolplex. The rebuttal is that such probabilities are ungrounded.
  *   **The Asymmetric Credence Lever** relies on the *invulnerability* of the probability. The proponent says, "I am merely admitting ignorance." The rebuttal cannot simply say "that's arbitrary," because admitting ignorance is epistemically virtuous. The Lever exploits the virtue of humility to smuggle in a calculation.

  **Vs. The Fanaticism Objection:**
  *   **Fanaticism** is the diagnosis of the *disease* (EUT leads to counterintuitive priorities).
  *   **The Asymmetric Credence Lever** is the *vector* of the disease. It explains *how* the fanaticism is generated in practice: by applying different epistemic standards to the two variables in the equation.

  **Vs. Moral Uncertainty:**
  *   **Moral Uncertainty** usually involves weighing competing *values* (e.g., liberty vs. welfare).
  *   **The Asymmetric Credence Lever** involves weighing *existence* vs. *non-existence* of the moral patient. It bypasses the question of "what is good?" to focus on "who is there to experience it?"

  ### The Edges: Legitimacy vs. Laundering

  For your novel, it is crucial to distinguish when this calculation is legitimate reasoning and when it is "laundering" uncertainty into a verdict.

  **When the Calculation is Legitimate:**
  The Asymmetric Credence Lever is a valid tool of risk management only when the "Shielded Input" is **evidence-sensitive**.
  *   *Condition:* The subjective credence must be updatable. If new evidence suggests insects lack neural correlates for pain, the credence must drop significantly.
  *   *Condition:* The magnitude must be robustly bounded. If the "vast number" relies on speculative chain-reactions (e.g., "if we save this insect, it might lead to a utopia"), the magnitude is also shielded, and the lever collapses into pure speculation.
  *   *Condition:* The cost of action is proportional. If the action required is low-cost (e.g., "step carefully"), a tiny non-zero probability might legitimately guide action. If the action is high-cost (e.g., "divert all medical funding to insect welfare"), the threshold for probability must be higher.

  **When it becomes "Metaphysical Laundering":**
  The move becomes fallacious (and ripe for your character's critique) when the probability is treated as a **fixed floor**.
  *   *The "Non-Zero Floor" Trap:* The proponent argues that because we *cannot know* the probability is zero, we must treat it as a permanent, actionable non-zero constant (e.g., "It's always at least 1 in a million"). This converts a lack of knowledge into a positive asset.
  *   *The Epistemic Mismatch:* The move fails when the "Shielded Input" is metaphysical (unfalsifiable) but the "Hardened Input" is treated as physical (falsifiable). If the probability is truly metaphysical, it may not be the kind of thing that *can* enter a mathematical expectation calculation. Multiplying a feeling of uncertainty by a census count is a category error.
  *   *Action-Guiding Threshold:* For the probability to be genuinely action-guiding, it must compete with other uncertain claims. If I assign a 1-in-a-million chance to insect sentience, I must also assign a 1-in-a-million chance to my own brain being a simulation. If the Lever is applied selectively (only to insects, not to the self), it is a rhetorical device, not a decision procedure.

  ### Summary for the Novelist

  The pattern you have observed is **The Asymmetric Credence Lever**.

  It is a rhetorical and decision-theoretic device where an agent protects the *probability* variable from empirical attack by calling it "subjective belief," while protecting the *magnitude* variable from skeptical attack by calling it "empirical fact." This allows them to generate a massive "Expected Value" from thin air.

  In your book, a critic of this view would not argue that insects *definitely* lack sentience. They would argue that **ignorance is not a number.** You cannot multiply a census count by an avowal of uncertainty and call the result "moral truth." To do so is to use the Asymmetric Credence Lever to launder metaphysical humility into moral authoritarianism.
