  To empirically distinguish between Principle 1 (Actualism) and Principle 2 (Functional Dispositionalism), one would need a case where the system is functionally integrated and permissive, yet no specific higher-order thought is currently occurring.

  **The "Idle Integrated Engine" Case:**
  Imagine a synthetic system identical to the Type-7 culture, but without the inhibitory peptide. This system is fully "online": its global workspace is metabolically active, its integration pathways are open, and it is processing complex first-order sensory data. However, due to a lack of attentional demand or novelty, the system generates *no* spontaneous higher-order representations for a sustained period. It is in a state of "flow" or pure sensory registration without meta-cognitive commentary.

  *   **Principle 1 (Actualism) Verdict:** **Not Conscious.** Since no higher-order representation is actually tokened during this period, the necessary condition for phenomenal consciousness is absent.
  *   **Principle 2 (Functional Dispositionalism) Verdict:** **Conscious.** The system possesses the intact, globally integrated capacity in a permissive state. The absence of specific thoughts is akin to a human staring blankly; the *state* of consciousness persists because the machinery is active and ready.

  Your colleague's judgment on this "Idle Engine" case would confirm whether she views consciousness as a series of discrete meta-representational events (Principle 1) or as a sustained state of integrated readiness (Principle 2). Given her verdict on anesthesia, I anticipate she would deny consciousness in this scenario as well, reinforcing her commitment to the occurrent nature of higher-order states.
