answer: |-
  This is a classic "moral uncertainty stack" that hits the three big problems in the literature (MacAskill/Bykvist/Ord style): **Fanaticism**, **Intertheoretic Comparison**, and **Structural Diversity** (ordinal vs. cardinal theories).

  You aren't double-counting in a way that breaks arithmetic, but you are double-counting *principles* in a way that breaks coherence. Specifically, you are treating "Maximize Expected Choice-worthiness" (MEC) as your engine, but manually overriding the engine when the output feels wrong (Shrimp, Fat Man), while claiming the engine handles those cases (Hedging).

  Here are the conflicts, ranked from "Breaks Your System" to "Terminological Cleanup."

  ### 1. The Fanaticism Trap (Claim 1 vs. Claim 3)
  **Severity:** Critical. This breaks the decision procedure.
  **The Conflict:** Claim 1 says "Maximize Expected Choice-worthiness." Claim 3 says "Reject the output when the EV math blows up."
  If your 10% shrimp view implies that shrimp suffering is vast (or that there are vast numbers of shrimp), and you are a strict maximizer (Claim 1), you *must* donate everything to shrimp. By rejecting this (Claim 3), you are admitting that MEC is not your actual decision rule in tail-risk scenarios. You are effectively saying, "I maximize expected value, unless the expected value is driven by a low-credence high-stakes theory, in which case I ignore it."

  **Why it looks like double-counting:** You are giving the 10% credence weight in your calculation, but then applying a "sanity check" discount that isn't part of the credence.

  **Cheapest Way Out:** **Adopt Bounded Utility.**
  Don't abandon MEC; constrain the *value functions* inside the MEC calculation. If you bound the maximum/minimum utility any theory can assign to an outcome (e.g., utility is logarithmic or capped), the shrimp math stops "blowing up."
  *   **Cost:** You have to accept that some moral goods are saturable (saving the 10 billionth life isn't as good as the first).
  *   **Consistency Check:** This preserves Claim 1 (you still maximize expectation) and Claim 3 (the math no longer demands you donate everything).

  ### 2. The Aggregation Problem (Claim 1 vs. Claim 4)
  **Severity:** High. This indicates a category error in your theory modeling.
  **The Conflict:** Claim 1 implies linear aggregation (0.6 × Util + 0.3 × Deon). Claim 4 implies non-linear aggregation (Deontology acts as a veto).
  If your Deontological theory has a "real do-no-harm constraint," it is likely **lexical** (infinite disvalue for rights violations) or **ordinal** (ranking actions, not assigning cardinal values). Standard MEC requires all theories to be cardinal and intertheoretically comparable.
  *   If Deontology is lexical ($-\infty$ for pushing), MEC *automatically* says "Don't Push." You wouldn't need to add "cause hedging makes sense."
  *   If Deontology is finite (e.g., -100 utils for pushing), and Utilitarianism is +1000 utils for saving 5 lives, MEC says "Push." If you refuse to push, you are violating Claim 1.
  By saying you don't push *because* "hedging makes sense," you imply MEC suggests pushing, and you are applying a meta-rule on top of it. But "hedging across theories" *is* what MEC is.

  **Cheapest Way Out:** **Switch to Stochastic Dominance or Constraint-Satisficing.**
  Admit that not all theories fit into a linear MEC framework. For theories with rights/constraints, use a **veto model**: any action with non-negligible credence of violating a lexical constraint is forbidden.
  *   **Cost:** You lose the elegance of a single "maximize X" equation. You now have a hybrid system (MEC for utilitarian trade-offs, Veto for rights).
  *   **Consistency Check:** This aligns Claim 1 and 4 by clarifying that Claim 1 only applies to theories that are cardinal/comparable.

  ### 3. The Parity Illusion (Claim 2 vs. Claims 1 & 3)
  **Severity:** Low/Medium. This is mostly a consistency check on your solution to Conflict #1.
  **The Conflict:** Claim 2 says moral and empirical uncertainty are decision-wise identical.
  In empirical uncertainty, we generally reject Pascal's Muggings (tiny prob of huge payoff) via bounded utility or probability discounting. If Claim 2 is true, you *must* use the exact same mechanism for moral uncertainty.
  If you solve Conflict #1 by saying "Moral uncertainty is special, so I ignore low-credence moral theories," you violate Claim 2. If you solve it by saying "I bound utility functions generally," you preserve Claim 2.

  **Cheapest Way Out:** **Apply the Bounded Utility solution to empirical cases too.**
  Ensure that your rejection of the "Shrimp Mugging" is based on a general epistemic principle (e.g., "I don't act on unbounded EV claims regardless of source"), not a specific "moral humility" principle.
  *   **Cost:** You might pass up some legitimate high-stakes empirical opportunities (e.g., existential risk reduction with low prob but huge impact), unless you calibrate your bounds carefully.
  *   **Consistency Check:** This makes Claim 2, 1, and 3 cohere.

  ### Summary of the Fix
  You are currently running **MEC with manual overrides**. That's unstable.

  **The Coherent Package:**
  1.  **Decision Rule:** Maximize Expected Choice-worthiness (Claim 1).
  2.  **Constraint:** All value functions are **bounded** (Solves Claim 3/Fanaticism).
  3.  **Modeling:** Deontological constraints are modeled as **near-lexical disvalues** within the bounded function, or handled via a **stochastic dominance** rule for rights violations (Solves Claim 4/Hedging).
  4.  **Meta-Ethics:** Empirical and Moral uncertainty use the same probability/utility machinery (Claim 2).

  **Where you were double-counting:**
  You were counting "Hedging" as a separate virtue *on top of* MEC. Hedging is just the *result* of MEC when you have credence distributed across theories. If you feel the need to hedge *more* than MEC dictates, you either have the wrong credences or the wrong value functions. Fix the inputs, don't add a second decision layer.
