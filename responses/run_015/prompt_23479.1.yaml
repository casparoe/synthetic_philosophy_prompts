  ### **Model Answer / Rubric Key**

  Use this to calibrate your grading for other students.

  **Part (a): The Difficulty (5 Points)**
  *   **Core Concept (2 pts):** Must identify that the agents cannot verify each other's **consistency** (or the validity of their proof search) within the system $L$.
  *   **Theorem (2 pts):** Must cite **Gödel's Second Incompleteness Theorem** (as the barrier to consistency proofs) AND ideally **Löb's Theorem** (as the condition governing provable cooperation).
      *   *Note:* If the prompt assumes defection, G2 is the primary answer. If the prompt allows for the possibility of cooperation, Löb is required. Given the prompt's phrasing, G2 is the necessary condition, Löb is the sufficient context.
  *   **Outcome (1 pt):** Clearly state that without these proofs, the condition for cooperation fails, leading to Defection/Status Quo (Pareto-inferior).

  **Part (b): The Resolution (5 Points)**
  *   **Mechanism (3 pts):** Must describe a method to bypass G2. Acceptable answers include:
      1.  **Proof Hierarchy:** One agent uses a stronger logic ($L + \text{Con}(L)$) to verify the other. (Must note asymmetry).
      2.  **Löbian Handshake:** Agents cooperate if they can *prove* the other cooperates (exploiting Löb's theorem to validate the proof without external consistency axioms).
      3.  **Parametric Polymorphism:** Agents reason about a parameterized version of themselves.
  *   **Explanation (2 pts):** Must explain *why* it works (e.g., "The stronger logic can prove the consistency of the weaker logic, satisfying the cooperation condition").
  *   **Constraint Check:** Must address how the solution fits the "same logic" constraint (either by relaxing it or using Löb to stay within $L$).

