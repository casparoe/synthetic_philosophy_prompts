      *   *The Core Insight:* Rules of inference cannot be fully captured *within* the system of premises. You need an external act of judgment to apply a rule. If you try to make that judgment a premise, you need another judgment to apply it.
      *   *The Physical Analogue:* The "Move" is the conclusion (placing the block). The "Green Token" is the rule of inference (C). The "Blue Token" is the rule validating the rule (D). The stall happens when you run out of tokens or loop back.

