answer: |-
  # Seminar Activity: The Impossibility of Agreeing to Disagree

  ## 1. The Construction

  **Cover Story:**
  A quality control batch of six specialised microchips has been produced, labelled $\omega_1$ through $\omega_6$. Exactly one chip is drawn at random for testing. The event of interest, $E$, is that the chip is *defective*.

  **Abstract Structure:**
  *   **State Space:** $\Omega = \{1, 2, 3, 4, 5, 6\}$.
  *   **Common Prior:** A non-uniform probability distribution $P$ over $\Omega$.
  *   **Event:** $E = \{1, 3, 5\}$.
  *   **Partitions:** Two agents, Alice ($\mathcal{A}$) and Bob ($\mathcal{B}$).

  **The Probability Weights:**
  To ensure invertibility (no two cells yield the same posterior), we assign the following weights to the states. The total weight is 12.

  | State ($\omega$) | Weight ($w$) | In Event $E$? |
  | :--- | :--- | :--- |
  | 1 | 1 | Yes |
  | 2 | 2 | No |
  | 3 | 3 | Yes |
  | 4 | 3 | No |
  | 5 | 2 | Yes |
  | 6 | 1 | No |
  | **Total** | **12** | **Mass(E) = 6** |

  *Prior Probability of $E$:* $P(E) = 6/12 = 0.5$.

  **The Partitions:**
  *   **Alice's Information ($\mathcal{A}$):** She distinguishes the first half from the second half.
      *   $A_1 = \{1, 2, 3\}$ (Total weight 6)
      *   $A_2 = \{4, 5, 6\}$ (Total weight 6)
  *   **Bob's Information ($\mathcal{B}$):** He distinguishes pairs, offset from Alice.
      *   $B_1 = \{1, 2\}$ (Total weight 3)
      *   $B_2 = \{3, 4\}$ (Total weight 6)
      *   $B_3 = \{5, 6\}$ (Total weight 3)

  **Invertibility Verification:**
  We calculate the posterior probability $P(E | \text{Cell})$ for every cell.

  *   **Alice:**
      *   $P(E | A_1) = \frac{w(1) + w(3)}{w(1)+w(2)+w(3)} = \frac{1+3}{6} = \frac{4}{6} = \mathbf{2/3}$.
      *   $P(E | A_2) = \frac{w(5)}{w(4)+w(5)+w(6)} = \frac{2}{6} = \mathbf{1/3}$.
      *   *Result:* Distinct values. If Alice announces $2/3$, she must be in $A_1$. If $1/3$, she must be in $A_2$.

  *   **Bob:**
      *   $P(E | B_1) = \frac{w(1)}{w(1)+w(2)} = \frac{1}{3} = \mathbf{1/3}$.
      *   $P(E | B_2) = \frac{w(3)}{w(3)+w(4)} = \frac{3}{6} = \mathbf{1/2}$.
      *   $P(E | B_3) = \frac{w(5)}{w(5)+w(6)} = \frac{2}{3} = \mathbf{2/3}$.
      *   *Result:* Distinct values. Each announcement uniquely identifies Bob's cell.

  **Depth of Exchange:**
  Consider the true state is **$\omega = 2$**.
  1.  **Round 1:** Alice (in $A_1$) announces **2/3**. Bob (in $B_1$) announces **1/3**.
  2.  **Round 2:**
      *   Alice hears 1/3. She knows Bob is in $B_1=\{1,2\}$. Her info refines to $A_1 \cap B_1 = \{1,2\}$.
      *   New Credence: $P(E | \{1,2\}) = \frac{w(1)}{w(1)+w(2)} = \frac{1}{3}$. Alice announces **1/3**.
      *   Bob hears 2/3. He knows Alice is in $A_1=\{1,2,3\}$. His info refines to $B_1 \cap A_1 = \{1,2\}$.
      *   New Credence: $P(E | \{1,2\}) = 1/3$. Bob announces **1/3**.
  3.  **Round 3:** Both announce **1/3** again (confirming stability).
  *Total Announcements:* 6. This satisfies the requirement for a multi-turn exchange where convergence is not immediate.

  ---

  ## 2. The Protocol

  **Group Structure:**
  Divide the 18 students into 6 groups of 3.
  *   **Principal A (Alice):** Receives Alice's partition card.
  *   **Principal B (Bob):** Receives Bob's partition card.
  *   **Auditor:** Receives the Master Sheet (prior, partitions, event).

  **Signal Distribution:**
  You (the facilitator) privately assign the true state $\omega$ to each group.
  *   *Recommendation:* Assign $\omega=2$ to three groups and $\omega=3$ to three groups. This allows comparison in the debrief (State 2 requires refinement; State 3 resolves faster).
  *   Hand Principal A a slip saying "True State is in your Cell X" (or simply show them the state and let them find their cell). *Correction:* To simulate private signals, simply tell them the true state number. They must look at their partition card to see which cell contains that number. They must not show the number to anyone.

  **The Exchange:**
  1.  Principals sit facing each other. Auditor sits to the side.
  2.  **Alternating Announcements:** Alice writes her credence on a shared sheet, slides it to Bob. Bob writes his, slides it to Alice.
  3.  **Constraints:**
      *   Only numbers (fractions or decimals).
      *   No words, gestures, or eye contact regarding the logic.
      *   **Stop Rule:** Stop when both have written the *same* number for two consecutive rounds, or after 6 announcements total.
  4.  **Simultaneity Note:** You correctly recalled that alternating announcements guarantee convergence in finite time for finite state spaces (Geanakoplos & Polemarchakis, 1982). Simultaneous announcements can cycle or fail to converge in some infinite cases, though in this finite setup, they would likely converge but obscure the updating logic. We use **alternating** announcements to make the conditional updating explicit for the students.

  ---

  ## 3. The Auditor's Role

  **The Conjecture:**
  Your conjecture is **correct**. In this finite setting with invertible announcements, the Auditor can compute the final consensus immediately after the first round of announcements.

  **Reasoning:**
  1.  Alice's first number identifies her cell $A_i$ uniquely (due to invertibility).
  2.  Bob's first number identifies his cell $B_j$ uniquely.
  3.  The true state $\omega$ must lie in the intersection $A_i \cap B_j$.
  4.  The communication process converges to the posterior probability of $E$ conditional on the cell of the **meet** of the partitions containing $\omega$.
  5.  Since the Auditor knows the full partition structure, she can identify which Meet Cell contains the intersection $A_i \cap B_j$.
  6.  Therefore, she can calculate the limit $P(E | \text{Meet}(\omega))$ before the principals have finished their second round.

  **Auditor Task:**
  *   **Step 1:** Record the first two numbers ($p_A^1, p_B^1$).
  *   **Step 2:** Immediately calculate and write down the **Predicted Consensus**.
  *   **Step 3:** Observe the rest of the exchange to verify accuracy.
  *   **Step 4:** Calculate her own "score" at the end based on the Predicted Consensus (demonstrating she is as calibrated as the agents).

  ---

  ## 4. A Second Round: Removing Common Knowledge

  **Objective:** To demonstrate that convergence relies on *Common Knowledge of the Information Structure*, not just honesty and common priors.

  **Protocol Change:**
  *   Keep the same priors and partitions.
  *   **Principal A:** Knows her own partition $\mathcal{A}$. She is told Bob has *a* partition, but she is **not** told it is $\mathcal{B}$. She is given a list of three possible partitions Bob might have ($\mathcal{B}, \mathcal{B}', \mathcal{B}''$).
  *   **Principal B:** Symmetric ignorance regarding Alice.
  *   **Auditor:** Knows the true partitions (as before).

  **Expected Outcome:**
  *   Round 1: Alice announces 2/3. Bob announces 1/3.
  *   Round 2: Alice hears 1/3. She does not know which of Bob's possible partitions generated this. She cannot rule out any states definitively. She cannot update. She announces 2/3 again.
  *   **Stall:** The numbers will not converge.
  *   **Lesson:** The stall is not due to stubbornness. It is structural. Without common knowledge of *how* the other sees the world, the numbers are not interpretable signals.

  ---

  ## 5. Scoring, Timing, and Materials

  **Scoring (Proper Scoring Rule):**
  Use the **Brier Score**. It is proper, bounded, and easy to calculate.
  *   Score $= 1 - (p - o)^2$
  *   $p$ = Final announced credence (or Auditor's prediction).
  *   $o$ = Outcome (1 if $E$ occurred, 0 otherwise).
  *   *Example:* If consensus is $1/3$ and state is 2 (not in $E$), Score $= 1 - (0.33 - 0)^2 \approx 0.89$.
  *   **Prize:** The group with the highest average score across both rounds gets "Epistemic Supremacy" (a trivial token, e.g., first choice of seminar topic next week).

  **Timing (90 Minutes):**

  | Time | Activity | Notes |
  | :--- | :--- | :--- |
  | 00–10 | **Introduction** | Explain rules, hand out materials. Emphasise "No Talking". |
  | 10–35 | **Round 1 (Standard)** | Facilitator assigns states. Groups run exchange. Auditor predicts. |
  | 35–50 | **Auditor Reveal** | Auditors announce predictions. Compare with actual consensus. Reveal states. |
  | 50–65 | **Round 2 (Ignorance)** | Distribute new "Uncertain Partition" cards. Run exchange. |
  | 65–75 | **Scoring & Calculation** | Groups calculate Brier scores. |
  | 75–90 | **Debrief** | Map activity to theorem assumptions. Q&A. |

  **Materials to Print:**
  1.  **Master Sheet (x6):** For Auditors. Contains Prior Weights, Event $E$, Partition $\mathcal{A}$, Partition $\mathcal{B}$.
  2.  **Alice Cards (x6):** "You are Alice. Your Partition is $\mathcal{A}$." (Include the table for $A_1, A_2$).
  3.  **Bob Cards (x6):** "You are Bob. Your Partition is $\mathcal{B}$." (Include the table for $B_1, B_2, B_3$).
  4.  **Exchange Sheets (x12):** Simple grid for Round 1 and Round 2 announcements.
  5.  **Round 2 Uncertainty Cards (x12):** Modified cards listing 3 possible partitions for the *other* agent.
  6.  **Score Calculation Sheet (x6):** Brier score formula and table.

  ---

  ## 6. Debrief, Failure Modes, and Limits

  **Mapping the Activity to the Theorem:**
  1.  **Common Prior:** Provided in the Master Sheet. If students had different priors, they would not converge (show this in discussion).
  2.  **Honesty/Competence:** Enforced by protocol.
  3.  **Common Knowledge of Partitions:** Isolated in Round 1 vs Round 2.
      *   *Round 1:* I know your partition, you know mine, I know you know mine... $\rightarrow$ Convergence.
      *   *Round 2:* I don't know your partition $\rightarrow$ Stall.
  4.  **The "Meet":** Explain that the consensus number was not arbitrary; it was $P(E | \text{Meet}(\omega))$. The Auditor could predict this because the first announcements identified the Meet Cell.

  **Target Student Takeaway:**
  "Two rational agents with the same prior cannot agree to disagree. If they disagree, it is not because they are stubborn or have different evidence *per se*, but because either (a) their priors differ, or (b) the structure of their information is not common knowledge."

  **Predictable Failure Modes:**
  1.  **Arithmetic Errors:** Students miscalculate the conditional probability.
      *   *Mitigation:* Provide a "Cheat Sheet" on the Alice/Bob cards listing the prior probability for every cell (e.g., "If you are in $A_1$, your prior is 2/3"). This removes calculation burden and focuses on the epistemic logic.
  2.  **Collusion:** Students peek at state numbers.
      *   *Mitigation:* Walk around. Remind them the prize is for *calibration*, not guessing the state. Guessing the state violates the spirit of reporting *credence*.
  3.  **Auditor Boredom:** The auditor has nothing to do after Round 1.
      *   *Mitigation:* Ask the auditor to write down the *set of states* they believe are possible after each round.
  4.  **Time Overrun:** Round 2 drags on.
      *   *Mitigation:* Hard stop at 15 minutes for Round 2. The stall is the point; they don't need to stall for 20 minutes to get the idea.

  **Limitations (For the Instructor):**
  *   **Finite vs. Infinite:** This activity uses a finite state space. Aumann's theorem holds for countable spaces, but the dynamic convergence proof is specific. Do not claim this proves the general case, only illustrates the mechanism.
  *   **"Common Knowledge" Idealisation:** In the activity, "Common Knowledge" is simulated by handing out identical handouts. In reality, establishing common knowledge is costly. Acknowledge this gap.
  *   **The Auditor's Power:** The Auditor's ability to predict the limit relies on *invertibility*. If two cells had the same posterior, the Auditor would face ambiguity. Mention this as a technical condition (generic priors usually ensure invertibility).

  **British English Usage Note:**
  Ensure all handouts use "programme" (if applicable), "centre", "colour", "modelling", and "prioritise". Refer to the "facilitator" rather than "TA". Use "maths" rather than "math".
