          *   *Nuance:* Szasz would argue inflammation $\neq$ depression. Inflammation is physical; depression is a metaphor for the *experience*. But for the sake of the checklist's "Stopping Rule" (observable tissue pathology), if the science is solid, the checklist must allow medical framing, even if the user wants to debunk it. I need to make sure I don't overstate the science though (it's correlational mostly). I will frame this carefully: If the claim is *causal* and *proven*, the checklist passes it. If it's *correlational*, it fails the tissue test. Given current science, it's mostly correlational. I will steer this to show the tension. *Correction:* The prompt says "include the case where the procedure forces me to frame the story in a way i personally hate—probably case 3." Okay, I need to construct the logic so that *if* the evidence meets the threshold, the checklist says "Okay to medicalize," forcing the user to accept that *if* the biology is real, the metaphor claim weakens. I will set the bar high for "predictive validity."

