      *   *Step 2: The Behavior/Rule Test.* Is the "symptom" actually a violation of social norms or a reaction to life circumstances?
      *   *Step 3: The Agency Filter.* Does the diagnosis explain *how* or excuse *why*? Does it remove choice?
