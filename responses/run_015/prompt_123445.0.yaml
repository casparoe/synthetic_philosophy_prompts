answer: |-
  Here is a practical editing decision procedure based on Thomas Szasz's categorical distinctions, stripped of academic jargon and designed for a 48-hour editorial deadline.

  ### The Szaszian Editing Checklist (SEC)

  **Purpose:** To prevent category errors between *diseases of the brain* (tissue pathology) and *problems in living* (behavioral/ethical conflicts).
  **Time to Run:** 10–15 minutes.

  #### Phase 1: The Tissue Stopping Rule (Mechanical Test)
  *Goal: Determine if medical framing is factually permissible.*

  1.  **Is there an observable lesion or tissue pathology?**
      *   Look for: Tumors, lesions, confirmed neurodegeneration (e.g., Alzheimer's plaques), toxins, infections, or genetic markers with high predictive validity for specific physical outcomes.
      *   **STOPPING RULE:** If **YES**, medical framing is permitted. You may treat this as a physical illness. (Proceed to Phase 3 for agency check).
      *   **IF NO:** Proceed to Question 2.

  2.  **Is the diagnosis based solely on behavior or self-report?**
      *   Look for: Checklists of feelings, actions, or social deviations (e.g., "sadness," "anger," "hearing voices," "inattention") without confirmed tissue damage.
      *   **STOPPING RULE:** If **YES**, this is a "problem in living" by Szaszian definition. Medical framing (e.g., "brain disorder," "chemical imbalance") is a **category error**. Flag any language implying literal disease.

  #### Phase 2: The Agency-Preservation Filter (Mechanical + Value Call)
  *Goal: Determine if the narrative removes moral responsibility without justification.*

  3.  **Does the diagnosis explain the mechanism or excuse the action?**
      *   *Explanation:* "He was tired and lashed out." (Preserves agent).
      *   *Exculpation:* "His disorder made him lash out." (Removes agent).
      *   **FLAG:** If the story uses the diagnosis as the *subject* of the sentence doing the action (e.g., "The schizophrenia caused him to..."), rewrite to restore the human as the actor (e.g., "He acted while experiencing...").

  4.  **Is "Lack of Insight" used to bypass refusal?**
      *   Look for: Terms like *anosognosia* or "impaired judgment" used to justify overriding a patient's stated wishes.
      *   **VALUE CALL:** You must decide if this is genuine cognitive impairment (e.g., delirium) or a disagreement about values. If it is a value disagreement, frame it as an ethical conflict, not a medical symptom.

  #### Phase 3: The Power & Context Check (Value Call)
  *Goal: Identify where social control might be masquerading as care.*

  5.  **What is the context of the "treatment"?**
      *   Is it voluntary or coerced?
      *   **VALUE CALL:** If coerced (inpatient, court-ordered), you must explicitly name the state's interest. Do not allow the story to frame coercion purely as "healthcare." It is also legal detention.

  6.  **Are life circumstances acknowledged as causal?**
      *   **FLAG:** If a major life event (divorce, poverty, trauma) is present but the story focuses exclusively on internal biology, require a rebalance. The biology may be the *mechanism*, but the life event is the *cause*.

  ***

  ### Running the Checklist on Your Cases

  Here is how the SEC applies to your three current stories. Note where the procedure forces you into uncomfortable corners.

  #### Case 1: Teenager, DMDD, Post-Divorce
  *   **Phase 1 (Tissue):** Observable lesion? **No.** Diagnosis based on behavior (anger) and context? **Yes.**
      *   *Result:* **Flag Medical Framing.** The hospital calling this a "brain disorder" fails the Tissue Stopping Rule.
  *   **Phase 2 (Agency):** Does "DMDD" excuse the anger? **Yes.** It frames a reaction to loss as a dysregulation failure.
      *   *Edit:* Shift language from "symptom management" to "coping with grief/divorce."
  *   **Phase 3 (Context):** Life circumstances acknowledged? **Currently minimized.**
      *   *Verdict:* This is a textbook Szaszian case. The checklist demands you challenge the medicalization. The anger is likely a *communication* of distress, not a *lesion*.
      *   *Headline Shift:* From "Treating the Dysregulated Brain" to "When a Child's Anger is the Only Voice He Has."

  #### Case 2: Forced Medication & "Lack of Insight"
  *   **Phase 1 (Tissue):** Observable lesion? **No.**
      *   *Result:* **Flag Medical Framing.** "Illness" is a metaphor here.
  *   **Phase 2 (Agency):** "Lack of insight" used to bypass refusal? **Yes.**
      *   *Value Call:* This is the critical juncture. "Insight" in psychiatry often means "agreement with the doctor." The checklist requires you to frame this as a **conflict of will**, not a **deficit of cognition**.
  *   **Phase 3 (Power):** Coercion involved? **Yes.**
      *   *Verdict:* You cannot write this as a health story alone. It is a civil liberties story. The checklist forces you to quote the legal standard for commitment, not just the medical standard for "stability."
      *   *Required Framing:* "The state is medicating him because he disagrees with their reality, not because his tissue is diseased."

  #### Case 3: Researcher Claiming Depression = Inflammation
  *   **Phase 1 (Tissue):** Observable lesion? **Claimed Yes (Inflammation markers).**
      *   *The Hard Part:* Current science shows *correlation* between cytokines and depressive symptoms, not definitive *causation* or a specific lesion that equals "depression."
      *   *However,* if the researcher presents data showing that anti-inflammatories *resolve* the behavior predictably, the Tissue Stopping Rule suggests medical framing is **permissible**.
      *   *Constraint Check:* You want to debunk medicalization. But if the tissue claim holds water, Szasz's own rule says: **If there is tissue pathology, it is a disease.**
      *   *The Uncomfortable Edit:* If the evidence is robust, the checklist forces you to admit: **"If depression is literally inflammation, it is no longer a metaphor."** You cannot use Szasz to debunk a finding that validates the physicalist claim.
      *   *Verdict:* You must scrutinize the *causality*.
          *   If inflammation is a *response* to stress (problem in living), the checklist flags medicalization.
          *   If inflammation is the *primary cause* independent of context, the checklist allows medicalization.
      *   *Action:* Demand the researcher prove the inflammation isn't a downstream effect of the "problem in living" (e.g., stress from poverty causing inflammation). If they can't, you revert to Case 1/2 framing. If they can, you must concede the medical point even if it hurts your anti-medicalization thesis. **Intellectual honesty overrides editorial preference.**

  ***

  ### Limitations & Fuzzy Boundaries (The "Editor's Note" to Yourself)

  This procedure is a tool, not a truth machine. Be aware of where it breaks:

  1.  **The "Dangerousness" Blind Spot:** The SEC cannot tell you if involuntary commitment is morally justified. Szasz argued it never is (except for standard criminal law), but society disagrees. The checklist identifies the *coercion*, but you still have to make the value call on whether that coercion is "abuse" or "protection."
  2.  **The Biomarker Trap:** We are finding genetic correlations for everything. A "risk gene" is not a lesion. The checklist treats risk factors as **Phase 1: NO**. Do not let a PR press release about a "gene for schizophrenia" pass the Tissue Stopping Rule.
  3.  **Suffering is Real:** Szasz was often misread as saying "people aren't suffering." This checklist does not address suffering. It addresses *categorization*. A person can be in agony from a "problem in living." Ensure your stories validate the pain without validating the category error.
  4.  **The Fuzzy Line:** Neuroscience is evolving. Today's metaphor (hysteria) can become tomorrow's lesion (temporal lobe epilepsy). Write with enough humility that if a lesion is found in 10 years, your story doesn't look like denialism. Use phrases like "Currently, no tissue pathology has been identified..." rather than "There is no disease."

  ### Summary for Deadline
  *   **No Lesion?** It's a problem in living. Frame it as ethics/behavior/context.
  *   **Lesion Found?** It's a disease. Frame it as medicine.
  *   **Coercion Involved?** Frame it as power/law, not just health.
  *   **Language Check:** Ensure the human is the verb-doer, not the diagnosis.

  Run this before you file. If the story fails Phase 1 but reads like a medical textbook, kill the medical framing.
