answer: |-
  1. **The Negation Charge**
  Critics argue that if $A$ and $\neg A$ can both be true, your operator $\neg$ fails to express incompatibility and is merely a subcontrary-forming device; by what right do you translate this formal symbol as the English word "not"?

  *   **Likely Reply:** She will argue that "negation" is defined by its truth conditions within the semantics (FDE), not by classical exclusion, and that classical exclusion is a special case, not the definition.
  *   **Follow-up:** If exclusion is not essential to negation, then asserting $\neg A$ does not rule out asserting $A$; if your "negation" doesn't rule anything out, haven't you changed the subject from what we mean by "contradiction" to something that merely looks like one on paper?

  2. **Curry's Paradox and the Conditional**
  Curry's paradox generates triviality without using negation, relying only on the conditional and contraction; to block it, you must reject either Modus Ponens, the Deduction Theorem, or Contraction— which structural rule do you sacrifice, and does the surviving conditional still support ordinary mathematical proof?

  *   **Likely Reply:** [Technical Fork] She will likely reject Contraction (as Priest does) to preserve Modus Ponens, arguing the resulting conditional is still sufficient for reasoning.
  *   **Follow-up:** If Contraction fails, you cannot iterate premises, which undermines standard reductio arguments and many identity proofs; if your logic cannot validate the inferences mathematicians actually use, in what sense is it a logic *for* mathematics rather than a formal curiosity about truth?

  3. **Assertion, Denial, and Disagreement**
  If $A$ and $\neg A$ are both true, asserting $\neg A$ cannot function as a correction of someone asserting $A$; do you posit a primitive speech act of "denial" distinct from asserting negation, and if so, how do we disagree about whether a denial is appropriate?

  *   **Likely Reply:** She will appeal to a primitive norm of "denial" (or rejection) that is not reducible to asserting the negation, allowing one to deny what is true-but-false.
  *   **Follow-up:** If denial is primitive and not defined by truth conditions, it is opaque to your semantic theory; does this mean your logic cannot explain the most basic function of logic, which is to model disagreement, leaving you with a semantics that cannot account for its own pragmatics?

  4. **The Metaphysics of Motion**
  Regarding the instant of change: you claim a body is both at rest and not at rest at the boundary instant; is this a claim about the physical world itself being inconsistent, or merely that our temporal representations are too coarse to resolve the state?

  *   **Likely Reply:** She will likely insist this is a metaphysical claim: reality itself is inconsistent at boundaries, not just our descriptions of it.
  *   **Follow-up:** If reality is inconsistent, then physical laws describing that instant entail contradictions; since physical laws are used to engineer bridges and rockets that do not collapse, how do you explain the reliability of engineering based on laws you claim are literally false at the very instants they describe?

  5. **Legal Conflicts and Agglomeration**
  In your legal cases, you argue it is true that an agent ought to $\phi$ and ought not to $\phi$; to avoid explosion, you must deny that "ought" agglomerates over conjunction; does this mean there is no all-things-considered obligation in conflict cases, and if so, isn't the contradiction merely a defect in the code rather than a truth about duty?

  *   **Likely Reply:** She will argue that agglomeration fails in genuine conflicts, so there is no single conjunctive obligation, but the individual contradictory obligations remain true.
  *   **Follow-up:** If there is no all-things-considered obligation, the agent has no action-guiding truth to rely on; if the "true contradictions" provide no guidance and the system is deemed defective, why posit true contradictions rather than simply admitting the legal system has failed to determine a truth value?

  6. **The Chemical Plant Scenario**
  Consider a control system verified against a specification entailing both that valve V is closed and not closed at $t$, due to incompatible statutes; a supervisor must decide whether to send a crew in; given your view, what does the supervisor believe, what should they assert to the crew, and does the truth of "V is not closed" give them any reason to hesitate?

  *   **Likely Reply:** She will likely say the supervisor should treat the specification as unreliable and act on the best available empirical evidence, not the formal specification.
  *   **Follow-up:** If the practical advice is to ignore the inconsistent specification as unusable, how does your position differ from the classicist who says an inconsistent theory is worthless? If the "true contradiction" plays no role in the decision, what work is it doing other than satisfying a theoretical urge?

  7. **Leakage and Consistent Regions**
  You claim classical reasoning is recoverable in "consistent" regions, but with unrestricted disquotation, truth-talk can leak into any discourse; how can a reasoner tell from the inside whether they are currently operating in a consistent region or one ripe for a Liar-style glut?

  *   **Likely Reply:** She will argue for a presumption of consistency: we treat regions as consistent until a contradiction is derived, at which point we switch to paraconsistent mode.
  *   **Follow-up:** If the Liar can be generated using ordinary vocabulary embedded in any discourse, that presumption is always one semantic accident away from failure; doesn't this imply we can never be certain our classical reasoning is valid, undermining the very security classical logic was meant to provide?

  8. **The Normativity of Validity**
  You define validity as the preservation of truth, yet in your system, a valid inference can lead from true premises to a conclusion that is both true and false; if the conclusion can be false, why should we care about validity, and what normative force does your logic retain?

  *   **Likely Reply:** She will argue that validity preserves *truth*, even if it also preserves falsity, and that avoiding falsity is not the sole goal of reasoning.
  *   **Follow-up:** If validity does not guarantee the absence of falsity, it ceases to be a tool for error-avoidance; if your logic cannot promise that valid reasoning won't lead you to accept falsehoods, why should we adopt it as a norm for rational thought?

  9. **Methodology and Falsifiability**
  You argue abductively that dialetheism is the best explanation for paradoxes; what specific evidence would count against your view, and if a rival theory solves the semantic paradoxes without accepting true contradictions, would you concede, or would you retreat to the motion and legal cases?

  *   **Likely Reply:** She will likely say she would concede if a rival solution handled *all* cases (semantic, motion, legal) with less theoretical cost.
  *   **Follow-up:** Since you can always posit a new glut to handle any counter-example, isn't your theory insulated from refutation? If no development could settle the matter but only shift the cost-benefit ledger, isn't dialetheism a metaphysical commitment rather than a logical conclusion?
