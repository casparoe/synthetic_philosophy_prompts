      *   *The "Restricted Domain" Escape:* Arrow's theorem assumes an unrestricted domain of preferences. If preferences are single-peaked or restricted, a stable ordering is possible (Black's Median Voter Theorem). Federalism *might* induce homogeneity within jurisdictions, but it doesn't guarantee it at the federal level.
