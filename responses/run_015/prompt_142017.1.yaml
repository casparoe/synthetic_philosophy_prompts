answer: |-
  # Joint Statement on Automated Housing Allocation

  **I. Established Common Ground**

  We, the undersigned, agree on the following technical and empirical claims regarding the County Housing Authority's allocation system. These claims are not policy recommendations but established constraints within which any policy must operate.

  1.  **Score Semantics:** The vendor's score estimates the *probability of instability* based on historical patterns, not the *causal effect* of receiving housing. A high score indicates high risk, not necessarily high benefit from intervention.
  2.  **Selective Labels:** Outcome data (instability within 12 months) is observed only for the ~15% of applicants previously flagged or housed. This data is Missing Not At Random (MNAR). Recorded base rate differences between groups reflect both true prevalence and historical selection bias.
  3.  **Impossibility Arithmetic:** In a static single-decision context with differing base rates, it is mathematically impossible to simultaneously satisfy calibration, equal false positive rates, and equal false negative rates across groups.
  4.  **Vendor Limitations:** The vendor cannot estimate counterfactual outcomes (what happens if housed vs. not housed) without experimental data access they do not currently possess.
  5.  **Budget Constraint:** The selection threshold is determined by the fixed budget (400 slots), not by an absolute risk cutoff. This threshold fluctuates with applicant volume and score distribution.
  6.  **Dynamic Context:** Applicants may re-apply every six months. The system is a sequence of decisions, not a one-time classification.
  7.  **Audit Scope:** An audit can establish compliance with defined mathematical metrics on recorded data, but cannot establish fairness of outcomes unobserved due to selective labeling.

  **II. Residual Disagreements**

  We disagree on how to proceed given the constraints above. The following table catalogs our remaining disputes, specifying whether they are substantive or verbal, and pre-registering our predictions on how empirical tests would resolve them.

  | Issue | Formalist Position | System Person Position | Status & Crux | Concrete Test & Pre-registered Predictions |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. Differential Counterfactual Improvement (DCI)** | DCI is a new fairness criterion. It trades off against utility maximization just like error rates. We must pick it explicitly if we want it. | DCI renders prediction parity obsolete. Fairness is about equalizing *gain* from intervention, not error rates on labels. | **Real.** Crux: Can we optimize allocation without causal knowledge? DCI is a **new problem wearing a hat**; it requires counterfactuals the data cannot support. | **Test:** Randomize slots for applicants near the threshold to estimate causal gain.<br>**Formalist:** Trade-offs between gain and total slots filled will emerge.<br>**System:** Equalizing gain will naturally align with long-term stability rates. |
  | **2. Dynamic Thresholds & Impossibility** | Impossibility results bind at every decision point. Cumulative unfairness aggregates over time if each step is biased. | Impossibility results are artifacts of static framing. Feedback loops and re-application correct disparities over time. | **Real.** Crux: Does time average out bias or compound it? The clash **survives** but attenuates in dynamic settings. | **Test:** Simulate 5 years of rolling admissions with varying budgets.<br>**Formalist:** Group disparity in total slots received will persist >10%.<br>**System:** Group disparity will converge to <5% over 5 years. |
  | **3. Selective Labels Remediation** | We must statistically correct the training data for selection bias before applying any fairness criterion. | The bias is structural. Correcting data mathematically masks the exclusion; we must change who gets watched, not the math. | **Verbal.** Words went wrong on "correction." Both agree data is biased; disagree on whether debiasing is preprocessing or policy. | **Test:** Compare outcomes using imputed labels vs. observed labels.<br>**Formalist:** Imputation reduces predictive error across groups.<br>**System:** Imputation increases false positives for historically excluded groups. |
  | **4. Purpose of Audit** | Transparency requires naming the sacrificed metric (e.g., "We chose calibration over equal opportunity"). | Transparency requires describing the process dynamics (e.g., "We monitor re-application rates and adjust thresholds"). | **Real.** Crux: What constitutes adequate public justification? Static guarantee vs. narrative coherence. | **Test:** Public hearing feedback on both explanation styles.<br>**Formalist:** Public prefers specific metric guarantees.<br>**System:** Public prefers narrative about process improvement. |

  **III. Commitment**

  We agree to submit to the tests listed above. Until then, we recommend the Agency disclose the selective label problem explicitly in all public communications and refrain from claiming the vendor score represents "benefit" rather than "risk."

  **Signed,**
  *Dr. A. (Formalist)*
  *Dr. B. (System Person)*
