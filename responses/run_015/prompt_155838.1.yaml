  | :--- | :--- | :--- | :--- |
  | **Eliminativist** | Anti-Realist (False) | N/A | Nowhere (Illusion) |
  | **Interpretationist** | Anti-Realist (Relational) | Scalar/Cat | In the Observer's Stance |
  | **Scalar-Pragmatic** | Realist | Scalar | In the System (Gradient) |
  | **Inferentialist** | Realist | Categorical | Internal Access (Giving/Asking) |
  | **Etiological** | Realist | Categorical | Causal History (Selection) |
  | **Consciousness** | Realist | Categorical | Phenomenal Experience (Qualia) |
  | **Struct/Function** | Realist | Categorical | Internal Mechanism/Structure |

  **Empty/Unoccupied Cells:**
  *   **Etiological Scalar:** The view that history determines a *gradient* of understanding is theoretically possible but rarely defended; etiological accounts usually demand a threshold of proper function.
  *   **Consciousness Behaviorist:** The view that qualia are required *but* a lookup table could have them is incoherent; consciousness views typically demand specific causal powers, not just output.
  *   **Interpretationist Realist:** Claiming understanding depends on an observer *and* is a mind-independent fact is a contradiction in terms.

  **Indistinguishable Leaves:**
  *   **Structured-Representation vs. Functionalism:** These often collapse. If two systems behave identically, the Functionalist says they are the same; the Structuralist says they might differ internally. The tree forces a choice at Node 9, but in practice, these positions bleed into one another unless "structure" is rigorously defined.

  ---

  ### Part 2: The Decision Tree (10 Nodes)

  *Instructions: Start at Node 1. Follow the arrows based on your intuitive answer. Plain English questions; jargon appears only at the end.*

  **Node 1: The Burden of Proof**
  When you say a machine "understands," are you describing a real feature of the machine itself, or just a useful tool for you to predict its behavior?
  *   **Real Feature:** Go to Node 3.
  *   **Useful Tool:** Go to Node 2.

  **Node 2: The Utility Check**
  Is this "useful tool" way of talking something we should keep and refine, or a mistake we should stop making?
  *   **Keep and Refine:** **LEAF: Interpretationist / Intentional Stance**
  *   **Stop Making:** **LEAF: Eliminativist / No-Fact-of-the-Matter**

  **Node 3: The Gradient Test**
  Is the difference between a frog catching a fly and a mathematician proving a theorem a difference in *degree* of the same stuff, or a difference in *kind*?
  *   **Degree (Scalar):** Go to Node 4.
  *   **Kind (Categorical):** Go to Node 5.

  **Node 4: The Cut Location**
  If understanding is a matter of degree, is the line where we say "yes, it understands" determined by a fact about nature, or by our practical needs?
  *   **Our Practical Needs:** **LEAF: Scalar-with-Pragmatic-Cut**
  *   **Fact About Nature:** Go to Node 5. *(Note: This path collapses into Categorical Realism).*

  **Node 5: The Lookup Table**
  If a system gives perfect answers by just memorizing a giant list of every possible question and answer, does it understand the subject?
  *   **Yes:** **LEAF: Structured-Representation / Functionalist**
  *   **No:** Go to Node 6. *(Mechanism matters).*

  **Node 6: The Darwin/Turing Asymmetry**
  A system is built by blind trial-and-error (no designer). It passes all tests, including explaining itself. Does the lack of a comprehending creator matter?
  *   **Yes, It Matters:** **LEAF: Etiological / Proper-Function**
  *   **No, Doesn't Matter:** Go to Node 7.

  **Node 7: The Black Box**
  A system solves math problems it never saw before using internal wiring no human can interpret. It cannot explain its work. Does it understand?
  *   **No, Needs Explanation:** Go to Node 8.
  *   **Yes, Performance is Enough:** Go to Node 9.

  **Node 8: The Reason Access**
  If you surgically remove a system's ability to report *why* it did something, but its performance stays exactly the same, did you remove its understanding?
  *   **Yes, Understanding Lost:** **LEAF: Inferentialist**
  *   **No, Understanding Remains:** Go to Node 9.

  **Node 9: The Twin Systems**
  System A uses logical rules. System B uses statistical pattern matching. They behave identically. Do they have the same level of understanding?
  *   **Yes, Same Level:** **LEAF: Structured-Representation / Functionalist**
  *   **No, Different Levels:** Go to Node 10.

  **Node 10: The Feeling**
  If a system passes every external test for understanding but has no inner experience (no "lights on"), does it understand?
  *   **No, Needs Experience:** **LEAF: Consciousness-Linked**
  *   **Yes, Experience Irrelevant:** **LEAF: Structured-Representation / Functionalist**

  ---

  ### Part 3: The Leaves (Diagnostic Labels)

  **Interpretationist / Intentional Stance**
  *   *Awkward Commitment:* Must admit a perfect duplicate of a human could lack understanding if no one is around to interpret it.

  **Eliminativist / No-Fact-of-the-Matter**
  *   *Awkward Commitment:* Must explain away all everyday talk of minds, beliefs, and desires as strictly false folklore.

  **Scalar-with-Pragmatic-Cut**
  *   *Awkward Commitment:* Must accept there is no fact of the matter about whether a specific system "really" understands, only whether it's useful to say so.

  **Inferentialist**
  *   *Awkward Commitment:* Must deny understanding to infants or animals that cannot explicitly cite reasons or justify their actions.

  **Etiological / Proper-Function**
  *   *Awkward Commitment:* Must grant understanding to a brain-damaged human with the right history over a superior alien AI with no history.

  **Consciousness-Linked**
  *   *Awkward Commitment:* Must accept that understanding is private and potentially unknowable from the outside (the "Zombie" problem).

  **Structured-Representation / Functionalist**
  *   *Awkward Commitment:* Must either grant understanding to a giant lookup table (Functionalist) or claim identical behaviors arise from different understandings (Structuralist), risking untestability.

  ---

  ### Part 4: Scoring Key & Collapsing Paths

  *   **The Realist Cluster:** Nodes 3, 5, 7, 9, 10 all sort variants of Realism. If a user answers "Fact" at Node 1 but finds themselves bouncing between Nodes 5, 9, and 10, they likely hold a hybrid **Structured-Representation / Functionalist** view.
  *   **The Access Collapse:** Nodes 7 and 8 are designed to isolate the **Inferentialist**. If a user says "Performance is Enough" at Node 7 but "Understanding Lost" at Node 8, they are inconsistent; force them to choose Access vs. Behavior.
  *   **The History Collapse:** Node 6 isolates the **Etiological** view. If a user says "Doesn't Matter" at Node 6 but "Needs Experience" at Node 10, they are a **Consciousness-Linked** theorist who rejects history.
  *   **The Scalar Collapse:** If a user answers "Degree" at Node 3 but "Fact About Nature" at Node 4, route them to the Categorical branch (Node 5). Pure "Scalar Realism" without a pragmatic cut is logically unstable (if it's a fact, there's a threshold).

  ---

  ### Closing Note

  **The Pivotal Node:** **Node 1 (The Burden of Proof)** does the heaviest lifting. It immediately segregates the metaphysical realists (who think comprehension is "out there" in the system) from the anti-realists (who think it's "in here" with the observer or nowhere at all). This cuts the logical space in half before discussing mechanisms.

  **Where the Tree Leaks:** The leak is between **Structured-Representation** and **Functionalism** (Node 9/10). In practice, many engineers and philosophers hold a fuzzy middle ground where "structure" is just "complex function." The tree forces a binary choice on identical behaviors, but many participants will want to say "They understand equally *for practical purposes*, but differently *in principle*." This hesitation indicates a position not fully captured by the leaves—likely a **Pragmatic Realist** who hasn't committed to the Scalar view at Node 3.
