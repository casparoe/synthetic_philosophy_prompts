prompt: |-
  I sit on my university's academic-integrity committee, and after a messy case last term I started reading about how groups decide things. Our rule is two-part: a finding of misconduct requires both that the student submitted work that was not their own and that no valid excuse applies. We vote by show of hands, and last term we ended up with a majority for each of the two conditions separately but a majority against a finding of misconduct — and then argued for an hour about what we had actually decided. Someone sent me a chapter from a popular book on collective decision-making that seemed to describe exactly our problem, but I don't trust it enough to bring it to the committee. Before I do, I'd like to know which parts of it a specialist in this area would endorse, which are simplifications, and which are quietly wrong.

  The chapter's account, as closely as I can reproduce its wording, goes like this: a group can be made up of perfectly reasonable individuals and still be unreasonable as a group. Imagine three judges deciding whether a defendant is liable, where the law makes liability depend on both a duty of care and a breach of that duty. One judge finds a duty and a breach and votes liable; one finds a duty but no breach; one finds no duty but a breach. Two of the three accept that there was a duty and two of the three accept that there was a breach, so if the court votes on the two questions separately it has to find the defendant liable — even though two of the three judges voted not liable. The court's verdict therefore depends on nothing more than which questions get put to the vote, which means it is an artifact of procedure rather than a finding. This is the discursive dilemma. The chapter then says that it is really just Condorcet's paradox of voting applied to beliefs instead of preferences — or, equivalently, Arrow's impossibility theorem restated for courts — and draws the moral that whenever a group has to settle several logically connected questions at once, no voting rule can reliably turn reasonable individuals into a reasonable group. It extends this well beyond law: any committee, board or electorate that votes on a package of related propositions risks endorsing conclusions that nobody in the room accepts, which is why putting complex questions to a popular vote is a dice roll. The only real escapes, it concludes, are to hand the decision to one person, or to break the issue down until every vote is a simple yes-or-no on one thing.

  My instinct is that this is unfair in at least one way — it slides from "collective judgments can be inconsistent" to "group decision-making is unreliable generally," and I don't see why a coherence problem about the shape of a group's stated position should tell us anything about whether the group is likely to get the facts right. But I can't tell where the chapter stops being accurate and starts overstating, and I also can't tell whether its practical moral survives correction. So: please audit it claim by claim, saying what someone who works on this literature would accept outright, what they would describe as a common simplification, what they would reject, and what the strongest defender of the view would say the chapter gets wrong about their own result. Then tell me whether the conclusion I actually care about follows from the accurate parts of the account: our committee is considering a "double-majority" fix, where each condition must win a majority on its own and the composite finding must also win a majority on its own, and if the composite fails we record no violation and note only those conditions that did pass. Is that a genuine way out of the problem the chapter describes, is it secretly one of the procedures the literature already discusses under another description, what does it cost us, and does it quietly give up something that the impossibility results are usually taken to require? I'd also like to know whether we would do better simply to vote only on the two conditions and never on the composite finding at all — what we would gain and lose by doing that, in terms the rest of the committee will understand.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** Member of a university academic-integrity committee.
      *   **Context:** Experienced a "messy case" where the committee voted majority "yes" on Condition A (plagiarism) and Condition B (no excuse), but majority "no" on the final verdict (misconduct). This is a classic *discursive dilemma* (or doctrinal paradox).
      *   **Task:** Audit a specific chapter summary from a popular book on collective decision-making.
      *   **Requirements:**
          1.  Evaluate claims (accept, simplify, reject, correct).
          2.  Evaluate the proposed "double-majority" fix.
          3.  Evaluate the alternative of voting *only* on premises (conditions) and deriving the conclusion.
          4.  Explain costs/benefits in terms understandable to a committee.
      *   **Tone:** Professional, precise, nuanced, authoritative but accessible (since the user is not a specialist but needs to convince specialists/colleagues).

  2.  **Deconstruct the Chapter's Claims:**
      *   *Claim 1:* A group of reasonable individuals can be unreasonable as a group (inconsistency). -> **True/Accepted.** (The core of the Discursive Dilemma/Doctrinal Paradox).
      *   *Claim 2:* The example (3 judges, duty/breach/liability) accurately describes the problem. -> **True/Accepted.** (Standard example from Kornhauser & Sager).
      *   *Claim 3:* It is "really just Condorcet's paradox... applied to beliefs." -> **Simplification/Debatable.** Condorcet is about cycles in preferences ($A>B, B>C, C>A$). Discursive Dilemma is about logical inconsistency between premises and conclusion ($P, Q \vdash R$). They are related but distinct formal problems.
      *   *Claim 4:* It is "equivalently, Arrow's impossibility theorem restated for courts." -> **Simplification/Technically Imprecise.** Arrow is about aggregating *orderings* of preferences. Judgment Aggregation (List & Pettit) is the specific field for propositions. While related (impossibility results exist for both), equating them directly glosses over specific axioms (e.g., independence of irrelevant alternatives vs. systematicity).
      *   *Claim 5:* "No voting rule can reliably turn reasonable individuals into a reasonable group." -> **Overstatement.** Impossibility theorems usually rely on specific sets of axioms (Universal Domain, Systematicity/Independence, Anonymity, etc.). You *can* get consistency if you drop an axiom (e.g., let a dictator decide, or restrict the domain of inputs).
      *   *Claim 6:* "Extends this well beyond law... risks endorsing conclusions that nobody in the room accepts." -> **Accepted.** (The "emergent group belief" problem).
      *   *Claim 7:* "The only real escapes... hand the decision to one person, or break the issue down..." -> **False/Too Pessimistic.** There are other aggregation rules (premise-based, conclusion-based, quota rules). Dictatorship is one escape, but not the *only* one.
      *   *Claim 8:* "Putting complex questions to a popular vote is a dice roll." -> **Overstatement.** Depends on the structure of the questions and the homogeneity of the electorate.

  3.  **Analyze the Proposed Solutions:**
      *   *Option A: Double-Majority Fix.* (Majority on Premise 1 AND Majority on Premise 2 AND Majority on Conclusion).
          *   *Analysis:* This doesn't solve the inconsistency; it creates a *veto* on the conclusion. If Premises pass but Conclusion fails, you record "no violation." This is effectively a **Conclusion-Based Procedure** with a high threshold, or a hybrid.
          *   *Problem:* It doesn't guarantee logical consistency. You can still have $P$ (majority), $Q$ (majority), $\neg R$ (majority). The rule just says "If $\neg R$, then no sanction." It accepts the inconsistency but prioritizes the conclusion vote for the *outcome*.
          *   *Cost:* It sacrifices logical integrity for procedural fairness/leniency. It might let guilty students off if the conclusion vote fails despite premises passing.
      *   *Option B: Vote Only on Conditions (Premise-Based Procedure).*
          *   *Analysis:* Vote on $P$ and $Q$. Derive $R$ logically ($P \land Q \to R$).
          *   *Benefit:* Guarantees logical consistency.
          *   *Cost:* The outcome ($R$) might be supported by a *minority* of the committee (as in the 3-judge example: 1 votes $R$, 2 vote $\neg R$, but $P$ and $Q$ pass so $R$ is enforced). This feels undemocratic to some.
      *   *Option C: Vote Only on Conclusion (Conclusion-Based Procedure).*
          *   *Analysis:* Vote on $R$ directly. Ignore $P$ and $Q$ votes for the verdict.
          *   *Benefit:* Direct democracy on the outcome.
          *   *Cost:* Ignores the reasoning. Can lead to arbitrary decisions.

  4.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the user's situation. Validate that their experience is a textbook case of the *Discursive Dilemma* (or *Doctrinal Paradox*).
      *   **Audit of the Chapter:**
          *   *Accurate:* The core example (Kornhauser & Sager), the phenomenon of inconsistency.
          *   *Simplification:* Linking to Condorcet/Arrow. They are cousins, not twins. Condorcet = cycles in ranking; Discursive = inconsistency in truth values. Arrow = preferences; Judgment Aggregation = beliefs.
          *   *Overstatement/Wrong:* "No voting rule can reliably..." (Impossibility theorems have conditions). "Only escapes are dictator or atomization" (False; Premise-based procedure is a standard escape).
          *   *Strongest Defender's Correction:* List & Pettit (the main names here) would say the impossibility holds *given specific desiderata* (like Systematicity). If you prioritize consistency over independence, you can solve it.
      *   **Evaluating the "Double-Majority" Fix:**
          *   Define it: Requires Majority($P$) AND Majority($Q$) AND Majority($Conclusion$).
          *   Verdict: This is **not** a solution to the logical problem; it's a **hedge**. It effectively makes the Conclusion vote a veto.
          *   Cost: It creates a "false negative" risk. A student could be factually guilty (by premise vote) but escape sanction (by conclusion vote). It preserves committee harmony but sacrifices the integrity of the rule (Rule says $P \land Q \to Guilty$).
          *   Relation to Literature: It's a variation of a *quota rule* or a *conclusion-based procedure* with extra hurdles. It doesn't satisfy the "completeness" or "consistency" requirements of judgment aggregation theory.
      *   **Evaluating "Vote Only on Conditions" (Premise-Based Procedure):**
          *   Verdict: This **is** the standard academic solution (Premise-Based Procedure).
          *   Gain: Logical consistency. The group acts as a rational agent.
          *   Loss: The "Democratic Deficit." The verdict might contradict the majority's direct will on the verdict.
          *   Committee Language: "Do we want to be consistent (Premise) or do we want the final vote to rule (Conclusion)?"
      *   **Recommendation:**
          *   For an Integrity Committee, consistency is usually paramount (Rule of Law). Premise-based is better.
          *   However, the "Double-Majority" acts as a "benefit of the doubt" mechanism.
          *   Suggest a hybrid: Vote premises. If they pass, verdict is automatic *unless* a supermajority votes to acquit (mercy). Or stick to Premise-Based for integrity.

  5.  **Refining the Tone:**
      *   Avoid overly dense jargon (e.g., "systematicity," "universal domain") without explanation.
      *   Use the user's context (Academic Integrity) to ground the theory.
      *   Ensure the distinction between *preferences* (Arrow/Condorcet) and *judgments/beliefs* (Discursive Dilemma) is clear.

  6.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address the "Double-Majority" specifically? Yes. It requires $Maj(P) \land Maj(Q) \land Maj(Conclusion)$. If $P, Q$ pass but $Conclusion$ fails, no sanction. This prioritizes the Conclusion vote.
      *   *Check:* Did I explain why the chapter is wrong about "no escape"? Yes, Premise-Based Procedure is the main escape.
      *   *Check:* Is the distinction between Condorcet and Discursive Dilemma clear? Condorcet is $A>B>C>A$. Discursive is $P=True, Q=True, (P \land Q \to R)=True$, but $R=False$. One is cyclic preference, one is logical contradiction.
      *   *Check:* User asked about "what the strongest defender... would say the chapter gets wrong about their own result." Need to mention List & Pettit specifically regarding the axioms.

  7.  **Final Polish:** Organize with clear headings. Ensure the advice is actionable for the committee meeting. (Proceed to generate output based on these thoughts.)
answer: |-
  This is a sophisticated query that touches on one of the most active areas of social choice theory: **Judgment Aggregation**. Your experience is not just anecdotal; it is a textbook instance of the **Discursive Dilemma** (also known as the **Doctrinal Paradox**), first formally identified by legal scholars Lewis Kornhauser and Lawrence Sager in 1986 and later formalized by philosophers Philip Pettit and Christian List.

  Below is an audit of the chapter's claims, followed by an analysis of your proposed procedural fixes.

  ### Part 1: Audit of the Chapter's Claims

  Here is how a specialist in judgment aggregation would evaluate the specific assertions in the chapter.

  **1. Claim:** *A group of reasonable individuals can be unreasonable as a group (inconsistency).*
  *   **Verdict:** **Accepted.**
  *   **Comment:** This is the core finding of the literature. If individuals hold consistent sets of judgments (e.g., $P$ is true, $Q$ is true, and if $P$ and $Q$ then $R$), majority voting on each proposition individually can result in a collective set that is logically inconsistent ($P$ is true, $Q$ is true, but $R$ is false).

  **2. Claim:** *The three-judge example (duty, breach, liability) accurately describes the problem.*
  *   **Verdict:** **Accepted.**
  *   **Comment:** This is the standard illustration used in the literature (Kornhauser & Sager's original example). It correctly identifies the tension between voting on premises (duty/breach) and voting on the conclusion (liability).

  **3. Claim:** *It is "really just Condorcet's paradox... applied to beliefs."*
  *   **Verdict:** **Simplification / Technically Imprecise.**
  *   **Comment:** A specialist would object to "just." Condorcet's paradox concerns **preferences** (rankings: $A > B > C > A$), creating a cycle. The Discursive Dilemma concerns **judgments** (truth values: True/False), creating a contradiction. While both are impossibility results, the mathematical structures differ. Condorcet requires odd numbers of voters to avoid ties; the Discursive Dilemma arises even with clear majorities on premises. Conflating them obscures the specific logical (rather than cyclical) nature of your committee's problem.

  **4. Claim:** *It is "equivalently, Arrow's impossibility theorem restated for courts."*
  *   **Verdict:** **Simplification / Misleading.**
  *   **Comment:** Arrow's theorem deals with aggregating *orderings* of preferences subject to conditions like Independence of Irrelevant Alternatives (IIA). Judgment Aggregation (the field relevant to you) deals with *propositions* subject to conditions like **Systematicity** or **Independence**. While List and Pettit (2002) proved an impossibility theorem for judgment aggregation that is *analogous* to Arrow's, saying they are "equivalent" glosses over the specific axioms required. For example, Arrow's theorem assumes at least three options; the Discursive Dilemma arises with binary yes/no votes on connected propositions.

  **5. Claim:** *"No voting rule can reliably turn reasonable individuals into a reasonable group."*
  *   **Verdict:** **Overstatement.**
  *   **Comment:** Impossibility theorems always come with a set of conditions (axioms). The List-Pettit theorem shows you cannot satisfy **Universal Domain**, **Collective Rationality** (consistency), **Anonymity** (equal weight), and **Systematicity** (treating all propositions equally) simultaneously. You *can* get a reasonable group if you drop one axiom. The chapter implies there is *no* solution, whereas the literature says there is no solution *that satisfies all these specific democratic ideals at once*.

  **6. Claim:** *"The only real escapes... are to hand the decision to one person, or to break the issue down..."*
  *   **Verdict:** **Rejected.**
  *   **Comment:** This is the chapter's most significant error. There is a third, well-documented escape: **The Premise-Based Procedure.** You do not have to resort to dictatorship (one person) or atomization (breaking issues until they are unrelated). You can simply decide to vote *only* on the premises and accept the logical conclusion, even if a majority would have voted against the conclusion directly. The chapter ignores this standard solution.

  **7. Claim:** *"Putting complex questions to a popular vote is a dice roll."*
  *   **Verdict:** **Overstatement.**
  *   **Comment:** The risk depends on the correlation of errors among voters. If committee members are competent and their errors are independent, the "Condorcet Jury Theorem" suggests the majority is likely to be right on facts. The Discursive Dilemma is a problem of *logic*, not necessarily *accuracy*. A group can be logically inconsistent but factually correct on the premises.

  **8. What the Strongest Defender (e.g., Christian List) Would Say:**
  *   A proponent of the theory would argue the chapter misdiagnoses the "moral." The moral is not that group decision-making is broken; it is that **consistency costs democracy.** To ensure the group acts rationally (consistently), you must restrict *how* you aggregate votes (e.g., prioritize premises over conclusions). The chapter suggests we must abandon hope; the specialist says we must choose our priority: Do we value the integrity of the logic (Premise-Based) or the direct will of the majority on the outcome (Conclusion-Based)?

  ---

  ### Part 2: Evaluating Your Proposed Fixes

  You are considering two procedural changes. Here is how they map onto the literature and what they cost you.

  #### Option 1: The "Double-Majority" Fix
  *Your proposal:* A finding of misconduct requires:
  1.  Majority for Condition A (Work not their own).
  2.  Majority for Condition B (No valid excuse).
  3.  Majority for the Composite Finding (Misconduct).
  *If A and B pass, but Composite fails, no violation is recorded.*

  *   **Is this a way out?** **No.**
  *   **Analysis:** This does not solve the logical inconsistency; it merely creates a **veto point**. In the scenario you described last term (Majority Yes on A, Majority Yes on B, Majority No on Composite), your new rule would result in "No Misconduct."
  *   **Literature Classification:** This is a variation of a **Conclusion-Based Procedure** with a hurdle. It prioritizes the vote on the *verdict* over the logic of the *rules*.
  *   **What it gives up:** It sacrifices the **Rule of Law** within your committee. Your university rule states: *If A and B, then Misconduct.* By allowing a "No" vote on Misconduct to override "Yes" votes on A and B, you are allowing the committee to violate the university's own definition of misconduct.
  *   **The Cost:** You protect students from a verdict the committee feels uneasy about (a "mercy" function), but you create a precedent where the committee's findings of fact (A and B) can be rendered legally null by a subsequent vote. It creates "false negatives" (guilty students found not responsible).
  *   **Secret Description:** In social choice terms, this is accepting **inconsistency** but masking it procedurally. You are acknowledging that the group's will on the conclusion trumps the group's will on the premises.

  #### Option 2: Vote Only on Conditions (Premise-Based Procedure)
  *Your proposal:* Vote only on Condition A and Condition B. If both pass, the finding of misconduct is automatic. Do not vote on the composite finding.

  *   **Is this a way out?** **Yes.**
  *   **Analysis:** This is the standard **Premise-Based Procedure** recommended by List and Pettit to avoid the Discursive Dilemma. It guarantees **Collective Rationality**. The group will never issue a logically inconsistent verdict.
  *   **What it gains:** **Integrity.** The committee's output will always align with the university's rules. It treats the committee as a single rational agent.
  *   **What it loses:** **Direct Democratic Control.** This is the "Democratic Deficit." In the scenario you described last term, this procedure would have forced a finding of Misconduct, even though a majority of the committee voted "No" on the final verdict. Some members may feel their vote on the "bottom line" was stolen.
  *   **Committee Language:** "We are voting on the *facts*, not the *fate*. The rules determine the fate."

  ---

  ### Part 3: Recommendation for Your Committee

  Your instinct that the chapter is unfair is correct. It conflates *logical consistency* with *factual reliability*. A committee can be logically consistent (Option 2) and still get the facts wrong, or logically inconsistent (your current state) and get the facts right. The problem you faced is not about truth; it is about **authority**. Who has the authority to decide: the members' judgment of the facts, or their judgment of the outcome?

  **Recommendation:**

  1.  **Adopt Option 2 (Premise-Based Procedure) as the Default.**
      For an Academic Integrity Committee, **consistency is more important than direct democracy.** You are an adjudicative body, not a legislature. Your job is to apply the university's rules, not to renegotiate them case-by-case via the back door. If the rules say $A + B \to \text{Misconduct}$, and the committee finds $A$ and $B$, the committee *must* find Misconduct to maintain institutional integrity.
      *   *How to sell it:* "We are here to apply the policy, not to vote on whether we like the policy's outcome in this specific case. Voting on the premises ensures we apply the rules evenly to all students."

  2.  **Modify Option 1 (Double-Majority) as a "Mercy" Mechanism.**
      If the committee is deeply uncomfortable with the automatic result of Option 2 (i.e., they find facts A and B true, but feel a misconduct finding is too harsh), do not hide this behind a contradictory vote. Instead, adopt a **two-stage process**:
      *   **Stage 1 (Fact-Finding):** Vote on A and B. If both pass, a violation is technically established.
      *   **Stage 2 (Sanction/Mitigation):** If a supermajority (e.g., 2/3) feels the technical violation should not result in a formal sanction due to extenuating circumstances, they can vote to **dismiss with warning**.
      *   *Why this is better:* It preserves the logical truth (the student *did* violate the rule) while allowing for equitable discretion on the *consequence*. It prevents the "No Misconduct" lie while avoiding undue harshness.

  **Summary for the Committee:**
  The chapter you read describes a real logical trap (the Discursive Dilemma), but it is wrong that there is no escape. We do not need a dictator. We simply need to decide whether we are voting on the **inputs** (the facts/conditions) or the **output** (the verdict).
  *   If we vote on the **output**, we risk breaking our own rules (as happened last term).
  *   If we vote on the **inputs**, we guarantee consistency with the rules, even if the final verdict feels uncomfortable to some.
  *   For an integrity committee, consistency with the rules is the priority. We should vote on the conditions and let the rules dictate the verdict.

  This approach acknowledges the literature without accepting the chapter's pessimism, and it solves your procedural deadlock without sacrificing the logical integrity of your findings.
