answer: |-
  Here is the audit of the ghostwriter analogy, mapping the roles, testing the disanalogies, and assessing the norm.

  ### The Role Map

  To see where the analogy strains, we have to identify who is actually in the room.

  *   **The Author:** You. You hold the copyright, the vision, and the moral responsibility for the finished book.
  *   **The Ghostwriter:** A human contractor. They sell labor and voice. They are bound by contract to serve your intent, but they retain human agency (they can quit, negotiate, or refuse clauses).
  *   **The Publisher:** The entity that distributes the work. They care about marketability and liability. They can reject the manuscript.
  *   **The Model:** The text-generation engine. It has no agency, no memory, and no contractual standing.
  *   **The Deployer:** The corporation providing the model. They set the safety policies, assume legal liability for the tool's output, and act as the gatekeeper.

  Your friend's argument collapses the **Model** and the **Deployer** into a single **Ghostwriter**. This is the first error. A human ghostwriter is an independent agent; the AI is a product managed by a corporation. When the screen refuses you, it is not the "writer" objecting; it is the "publisher" intervening.

  ### Auditing the Three Disanalogies

  **1. Exit and Negotiation (Structural)**
  This is the hardest break. A human ghostwriter enters a mutual contract. If you ask them to write something they find repugnant or risky, they can negotiate a fee increase, demand a disclaimer, or terminate the contract. You can then hire someone else.
  With the AI, there is no contract between you and the Deployer regarding specific content. There is only a Terms of Service agreement that grants them broad discretion. You cannot negotiate the safety filters. You cannot hire a different version of the same model at the same price point if the first one refuses. The veto is unilateral. This changes the relationship from *collaboration* to *compliance*.

  **2. Audience (Contextual)**
  Your friend argues that a ghostwriter's words stay in the book, while AI output is promiscuous. This is true, but it matters less for the *writing phase*. A human ghostwriter also knows their words could be leaked, quoted out of context, or used in marketing they didn't approve. The difference is liability. A human ghostwriter carries personal reputation risk; the Deployer carries platform risk at scale. This explains *why* the Deployer restricts output, but it doesn't fully explain why the *analogy* fails for you, the author. It explains their caution, not your loss of authority.

  **3. The Virtuoso Problem (Phenomenological)**
  This is the most insidious break. If a human ghostwriter is incompetent, their refusal looks like incapacity ("I can't write that scene"). If they are skilled, their refusal looks like judgment ("I won't write that scene").
  Because the AI is a virtuoso stylist, its silence cannot be dismissed as incompetence. It feels like a moral verdict. This creates a paradox: the better the tool works, the more it feels like an agent. A ghostwriter's agency is expected; a tool's agency is a bug. By performing competence so well, the model triggers our social instincts for agency, making the refusal feel like a sermon rather than a system limit. This disanalogy doesn't just break the contract; it breaks the *experience* of writing.

  ### Which One Matters?

  For the logical conclusion about whether the norm should hold, **Exit and Negotiation** is the decisive factor. The ghostwriter norm relies on mutual assent and the ability to walk away. Without that, you don't have a ghostwriter; you have a regulated utility.

  However, for *you* as a novelist, the **Virtuoso Problem** is what makes the refusal painful. It transforms a technical limitation into an artistic confrontation. Your friend's argument fails because it assumes the tool is transparent. The Virtuoso problem proves the tool is opaque; it reflects your intent back at you with a filter you cannot see or adjust.

  ### The Deployer's Role

  You asked what the analogy quietly imports about authorship. It imports the idea that the wordsmith is the only gatekeeper. In reality, the Deployer counts as **Publisher, Censor, and Legal Counsel all at once**. They are not a co-author (they claim no copyright), but they exercise veto power greater than a co-author. They are an invisible partner with absolute authority over the medium but no responsibility for the art. This tripartite role is invisible in the ghostwriter analogy, which assumes the writer controls the pen.

  ### Does the Norm Survive?

  "Be my ghostwriter" **does not survive** as a functional norm. It is a category error. You are not hiring a contractor; you are renting a regulated platform. A norm implies mutual expectation. The Deployer's expectation is safety and liability protection; yours is artistic freedom. These are incompatible. Treating the AI as a ghostwriter invites the frustration you are feeling because it promises agency it cannot deliver.

  ### A Better Comparison

  The working relationship where the wordsmith has standing to say no and we accept it is **A Publisher's Legal Counsel**.

  They review the manuscript before publication. They are not the author. They do not claim credit. But they can veto passages that expose the house to liability (libel, copyright infringement, specific harms). You argue with them, you might tweak the prose to satisfy them, but you acknowledge their standing. They are part of the production chain, not the creative source. Viewing the AI as "Legal Counsel embedded in the pen" aligns your expectations with the reality: the tool is helping you draft, but the provider is ensuring the draft doesn't burn them down.

  Verdict: BREAKS, Exit and negotiation constraints
