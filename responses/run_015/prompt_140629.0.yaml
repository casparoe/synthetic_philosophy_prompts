  4.  **Developing a Refined Principle:**
      *   Need to address the *Vagueness/Arbitrariness* problem (Tree vs. Body-minus-hair).
      *   Need to address the *Coincidence* problem (Statue/Lump).
      *   Need to address the *Temporal* problem (Watch/Ship).
      *   *Idea:* Combine "Causal Integration" with "Sortal Sensitivity" or "Life/Function."
      *   *Better Idea:* Focus on **Functional Integration relative to a Kind**.
      *   *Refinement:* Composition occurs when parts are integrated into a *single causal homeostatic mechanism* that realizes a *stable functional kind*, where "stable" allows for dormancy (watch) but not total cessation of the specific causal profile (ship rebuild is tricky).
      *   *Addressing the Tree/Body Tension:* The user wants to deny "Body-minus-hair" but accept "Tree." This is the hardest tension. Usually, if you deny arbitrary undetached parts (AUP), you need a principle that rules out *any* proper part that isn't a functional sub-unit. A hair isn't a functional sub-unit. A leaf *is* arguably a functional sub-unit of a tree (photosynthesis). But "Tree-minus-leaf" is the problem.
      *   *Strategy:* Advise the user that the Tree vs. Body-minus-hair tension is the "Problem of the Many." They likely need to adopt a *conventionalist* or *dominant sortal* caveat to solve the Tree case, or accept that "Body-minus-hair" *does* exist (which feels weird). Let's try to save the intuition: The principle should require *maximal* causal integration. A body is maximally integrated. Body-minus-hair is not a *maximal* system (it's dependent on the whole body). A tree is maximally integrated. Tree-minus-leaf is not.
      *   *Statue/Lump:* This requires a rule against coincidence. "One object per region per kind."
