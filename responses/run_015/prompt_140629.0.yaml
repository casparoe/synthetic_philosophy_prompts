      *   **Task:** Perform "reflective equilibrium." Take the 10 verdicts + the proposed "Causal Self-Maintenance" principle. Refine the principle to fit the verdicts (or advise dropping verdicts). State the principle precisely. Map clauses to verdicts. Identify tensions/inconsistencies. Predict outcomes for new cases (mechanical heart, solar system). Address the perdurance/endurance question regarding the watch.
      *   **Tone:** Philosophical, collaborative, rigorous but accessible (seminar peer level).

  2.  **Deconstruct the User's Verdicts:**
      1.  *Coffee Mug:* Yes (Composite).
      2.  *Heap of Sand:* No (Nihilism about heaps).
      3.  *Statue/Lump:* One thing (Monism/Anti-coincidence).
