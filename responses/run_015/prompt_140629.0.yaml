      11. *Ship of Theseus (Rebuild):* Rebuilt ship = Original (after 10 years). *Tension:* Conflicts with standard causal continuity views.

  3.  **Analyze the Proposed Principle ("Causal Self-Maintenance"):**
      *   *Core Idea:* Parts compose a whole iff they stand in a single causally self-maintaining system.
      *   *Extension:* Self-maintenance can be indirect (designer's intentions, stored plans).
      *   *Strengths:* Explains Mug, Man o' War, Watch (via plans), Shoe/Tower (No causal link).
      *   *Weaknesses:*
          *   *Tree:* Trees are self-maintaining, but so are "tree-minus-leaf." How to rule out the overlap?
          *   *Body-minus-hair:* Is a body-minus-hair self-maintaining? Biologically, yes. So why deny it?
          *   *Statue/Lump:* This is about *coincidence*, not just composition. The principle needs to ensure only *one* object is counted where matter overlaps.
