  5.  **Drafting the Principle (Iterative Process):**
      *   *Attempt 1:* Parts compose X if they are causally connected. (Too vague, allows Wolf Pack).
      *   *Attempt 2:* Parts compose X if they form a homeostatic system. (Better, allows Man o' War).
      *   *Attempt 3:* Parts compose X if they form a homeostatic system *of a specific kind*, and X is the *maximal* such system. (Helps with Tree/Body).
      *   *Attempt 4 (incorporating time):* ...and the system's identity persists through dormancy if the *blueprint* persists.

      *   *Final Polish:* **The Principle of Maximal Homeostatic Integration (PMHI).**
          1.  **Integration:** Parts must interact to maintain the system's state (metabolic or functional).
          2.  **Maximality:** No proper subset of the parts constitutes a competing system of the same kind (solves Tree/Body tension by prioritizing the whole).
          3.  **Sortal Relativity:** Composition is relative to a functional kind (Mug, Organism, Watch).
          4.  **Gappy Continuity:** Identity persists through disassembly if the *causal potential* is preserved externally (plans/intentions).
          5.  **Anti-Coincidence:** No two objects of the same kind occupy the same space/matter.

  6.  **Addressing Specific Tensions:**
      *   *Tree vs. Body-minus-hair:* This is the "Problem of the Many." I need to be honest: PMHI struggles here. If the tree is one object, why isn't the body? I will suggest the user leans on *Maximality*. The body is the maximal system. Body-minus-hair is a *fragment*, not a system. Tree-minus-leaf is also a fragment. The intuition that "Tree-minus-leaf candidates exist" is the philosophical pressure. I will advise the user to stick with "Only the Maximal System counts" to save both verdicts.
      *   *Ship Rebuild:* This is the weakest link. 10 years gap + new matter (glue/labor) vs. original matter. If we allow "Stored Plans" for the watch, we can allow "Stored Plans + Original Matter" for the ship. But it stretches "Self-Maintenance." I will flag this as a cost.
      *   *Statue/Lump:* This isn't composition, it's *identity*. I need to distinguish SCQ from Material Constitution. I'll advise adopting "Constitution Monism" (Statue = Lump) as a separate axiom compatible with the composition principle.

  7.  **New Cases:**
