answer: |-
  You strike upon the very nerve that has kept these papers locked in my desk (gathering dust enough to choke a chimney-sweep) rather than sent to the printer; for if the moral sanction—the pain of public opinion—is itself a creature of the political sanction—the law—then to punish is merely to feed the beast that begs for the punishment, a sort of logical serpent swallowing its own tail. You are quite right that the calculus must not be a mirror for prejudice; if the pain arises *solely* because the law forbids it (the shame of conviction, the loss of reputation), then to legislate against the act is to create the very mischief one claims to prevent. In my column, I must therefore distinguish between pains intrinsic to the act (which, in these private cases, I find to be zero) and pains extrinsic, arising from the threat of punishment itself; to count the latter as a reason *for* punishment is to argue that because a man screams when you whip him, you ought to whip him to justify the scream. The legislator must look to the *security* of the community; if every man fears that his closet may be scrutinized, the universal alarm (a pain of expectation) outweighs the vague unease of the spectator who merely hears a rumour.

  But this engine of yours, this mechanism by which a hundred million souls feel a twinge in an afternoon—it is a startling hypothesis (and suggests a connectivity of mankind I scarce dare imagine). If the pain of disgust is so easily multiplied, does not the intensity diminish with the distance? A million men feeling a slight nausea is not equal to one man feeling the rope about his neck or the ruin of his fortune. Yet I must ask you, to ensure my arithmetic holds: in this world of yours, is this dissemination of news a voluntary thing, or a forced intrusion? For if the spectators must actively seek the knowledge to feel the pain, their curiosity is their own fault, not the actor's; but if the knowledge is thrust upon them, then the mischief lies in the broadcasting, not the bed. Tell me of this machine: does it record all things, or only those selected by masters? For if the latter, the pain is not in the act, but in the manipulation of the multitude, and my calculus must weigh the pain of the manipulated many against the liberty of the few.
