answer: |-
  The set is not tenable as it stands, principally because it simultaneously denies the existence of legislative intention in principle while relying upon it to justify exceptions to the text, and asserts a judicial duty to find meaning while deferring to agencies on ambiguity.

  The most severe tension lies between commitments (2) and (3). You cannot coherently maintain that legislative intention is a fiction ('no such thing') while simultaneously invoking what a legislature 'could have wanted' to void a textual reading. This is not merely a friction but a logical contradiction: the absurdity exception in (3) derives its normative force from the very legislative intention that (2) ontologically denies. To fix this, you must qualify (2) to deny only *subjective* or *unenacted* intention, permitting an 'objectified' intention of a reasonable legislature. The price is that you lose the hardline textualist claim that intention is entirely irrelevant; you become an objective intentionalist, which weakens the rhetorical sharpness of (2) against intentionalist critics who rely on committee reports.

  The second most severe tension is institutional, arising between (1) and (5) on one side, and (7) on the other. Commitments (1) and (5) assign the court the duty to ascertain the ordinary public meaning or, where open, to settle the reading using textual purpose. Commitment (7) instructs the court to abdicate that duty in cases of ambiguity and defer to the executive. If the court's task is to find the meaning (1), deference implies the court has failed its task; if the text is genuinely open (5), (7) suggests the court should not settle it. The cheapest fix is to abandon (7) entirely. The cost is significant: you lose the pragmatic benefit of agency expertise and political accountability, and you align yourself against a long-standing (though now diminishing) administrative law doctrine, requiring you to argue that judges are better placed than agencies to resolve policy-laden ambiguities.

  The third tension, though less severe, exists between (4) and (5). Commitment (4) bans purposive construction, while (5) allows purpose to settle ambiguity. This looks contradictory but is salvageable if 'purposive construction' in (4) is defined strictly as using external purpose to override text, whereas (5) relies on purpose 'evident from the text itself'. However, the fault line is thin: once a judge identifies a purpose to resolve ambiguity, they are inevitably engaging in a form of purposive reasoning. To secure consistency, you must clarify in (4) that judges may not use purpose to *expand* or *contract* the text beyond its ordinary meaning, only to select between plausible ordinary meanings. The cost is semantic precision; you must constantly guard against (5) becoming a backdoor for the very purposivism (4) seeks to ban.

  The apparent tension between (1) and (6) is misleading. While clear statement rules in (6) can displace ordinary meaning, they are justified in (6) as part of the 'background conventions' against which the text is read. If these conventions are part of the context mentioned in (1), then the 'ordinary public meaning' includes the understanding that certain results require clearer language. Thus, (6) operates as a subset of (1)'s contextual inquiry rather than an exception to it, provided you accept that 'ordinary meaning' incorporates legal presumptions.

  The single revision that would do the most work across the set as a whole is to qualify commitment (2) to admit 'objectified legislative intention'. This revision stabilises the theoretical foundation of the entire list: it legitimises the absurdity exception in (3) without contradiction; it clarifies the source of 'purpose' in (5) as objective rather than subjective; and it reinforces the background conventions in (6) as part of the legislative bargain. However, this revision leaves you unable to claim that you are a pure textualist who rejects intention altogether; you must concede that interpretation aims at the objective intention conveyed by the text, not merely the semantic meaning of the words in isolation.
