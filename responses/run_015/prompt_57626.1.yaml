answer: |-
  This is a strategic brief for two lectures. Your audience respects functional models but will instinctively attempt to reduce the "felt" to the "measured." Your goal is not to convert them to dualism, but to enforce a conceptual distinction they will naturally try to dissolve.

  ### 1. Prerequisites: What Must Be in Place
  Before you can pose the distinction between Access (reportable/functional) and Phenomenal (felt) consciousness, you must secure agreement on two operational definitions. Without these, the engineers in the room will treat the distinction as a measurement error rather than a categorical one.

  *   **Operationalize "Report":** You must establish that "report" means *flexible rational control*. It is not merely a signal output (like your instrument logging data); it is the ability to use information for reasoning, speech, or deliberate action. This isolates **Access Consciousness**.
  *   **Operationalize "What It Is Like":** You must establish that "feeling" refers to the *subjective character* of the state, independent of its functional utility. This is the **Phenomenal** component.
  *   **The Separability Assumption:** You must secure provisional agreement that *function* and *feeling* are not logically identical, even if they are empirically correlated in healthy humans. If they believe function *entails* feeling by definition, the distinction cannot be posed.

  ### 2. Sequencing: The Order of Arrival
  You anticipate they will collapse the two notions within ten minutes. Do not start with definitions. Start with the wedge.

  **Lecture 1: The Wedge and The Workspace**
  1.  **The Phenomenological Hook (5 mins):** Ask them to recall a moment of "highway hypnosis" or automatic pilot. They drove home (Access/Behavior) but have no memory of the drive (lack of Phenomenal/Report). This creates immediate intuitive doubt about the unity of consciousness.
  2.  **The Single Case (20 mins):** Present the evidence (see below). This forces the distinction empirically.
  3.  **Global Workspace Theory (30 mins):** Explain GWT *strictly* as a theory of Access. Map it to their engineering intuition: a bus architecture, broadcasting packets to subsystems.
  4.  **The Limit of GWT (20 mins):** Explicitly state what GWT does *not* explain. It explains the broadcast, not the "light" that makes the broadcast visible to the subject.

  **Lecture 2: The Defense and The Gap**
  1.  **Intercept Reductionism (30 mins):** Address the "it's just unmeasured data" objection immediately.
  2.  **The Hard Problem (30 mins):** Why does the workspace broadcasting feel like anything?
  3.  **Synthesis (15 mins):** Revisit the distinction.

  ### 3. The Single Case: Blindsight
  Do not use your instrument episode as the carrier case. Use **Blindsight**.

  *   **Why:** Your instrument story is a metaphor for *Access without Attention*. It describes a zombie system. It cannot prove the existence of the "felt" component in humans, only the absence of report in machines. Blindsight involves a human subject who *acts* without *feeling*. It forces the audience to accept that behavioral guidance (Access) can be dissociated from visual experience (Phenomenal).
  *   **What it must exhibit:**
      *   **Preserved Function:** The subject can point to, grasp, or navigate around obstacles in their blind field with accuracy significantly above chance.
      *   **Denied Report:** The subject consistently and sincerely reports seeing nothing. No light, no shadow, no qualia.
  *   **What it must conspicuously fail to exhibit:**
      *   **Subjective Confidence:** The subject should not feel they are guessing. They feel blind.
      *   **Visual Qualia:** There must be no "spark" of experience associated with the accurate motor action.

  *Strategic Note:* Use your instrument story as a **preamble analogy** in Lecture 1. "My instrument logged data for 11 years without a reader. That is Access without Report. Blindsight is Access without *Experience*." This leverages your credibility without relying on the anecdote for the philosophical heavy lifting.

  ### 4. Misapprehensions and Interception Points
  Technically minded audiences will manufacture three specific objections. Do not wait for the Q&A. Intercept them during the lecture flow.

  **A. "The Measurement Gap" (Reductionism)**
  *   *The Objection:* "The felt component is just the reportable one we cannot yet measure. Better sensors will close the gap."
  *   *Interception Point:* **Lecture 2, Minute 10.** Immediately after defining Phenomenal Consciousness.
  *   *The Counter:* "If I measure every neuron firing in your visual cortex, I have a map of *correlates*. I do not have the *feeling* of red. You are conflating the signal with the reception of the signal. The distinction is logical, not technological."

  **B. "GWT Dissolves the Problem"**
  *   *The Objection:* "If information is globally broadcast, that *is* consciousness. You've solved it."
  *   *Interception Point:* **Lecture 1, Minute 55.** At the conclusion of the GWT section.
  *   *The Counter:* "GWT explains how data becomes available to the 'self' model. It does not explain why there is a 'self' to receive it, or why the broadcast is accompanied by light rather than darkness. GWT is a theory of Access, not Phenomenality."

  **C. "The Homunculus"**
  *   *The Objection:* "Who is watching the Global Workspace? You've just put a little man inside the skull."
  *   *Interception Point:* **Lecture 1, Minute 45.** When describing the "broadcast" mechanism.
  *   *The Counter:* "There is no spectator. The broadcast *constitutes* the access. The 'self' is a constructed model within the workspace, not an external viewer. Do not reify the audience."

  ### 5. The Closing Question
  End Lecture 2 with this question. It distinguishes those who grasp the distinction from those who have merely memorized labels.

  **"If we built a robot with a perfect Global Workspace architecture that could describe its internal states, avoid obstacles, and pass every behavioral test for sight, what would be missing from your description of it?"**

  *   **The Label Acquirer:** Will say "Nothing," or "Better sensors," or "More processing power." They have collapsed Access into Phenomenality.
  *   **The Grasper:** Will say "There is no one home," or "It has no experience of the obstacles," or "It processes 'red' but does not *see* red." They understand that function does not entail feeling.

  ### 6. Deliberate Omissions
  Announce these at the outset of Lecture 1. This prevents the audience from feeling you are ignoring the "big questions" while keeping you on track.

  *   **AI Consciousness:** "We will not speculate on whether machines can be conscious. We are analyzing the structure of human consciousness."
  *   **Animal Consciousness:** "We will not address the phylogenetic distribution of consciousness."
  *   **Panpsychism:** "We will not discuss whether consciousness is a fundamental property of matter."
  *   **Neural Correlates (Specifics):** "We will discuss architecture (GWT), not specific neuronal firing rates."

  ### 7. Advice on Integrated Information Theory (IIT)
  **Resist the temptation.**

  Do not bring in the rival theory that proposes to quantify consciousness as a single number ($\Phi$).
  *   **Reason 1:** It conflates the distinction you are trying to teach. IIT claims to measure *Phenomenal* consciousness, but engineers will treat $\Phi$ as just another Access metric (complexity).
  *   **Reason 2:** It invites a "numbers game." Your audience will want to debate the calculation of $\Phi$ rather than the conceptual distinction between Access and Phenomenality.
  *   **Reason 3:** It is a theory of *degree*, you are teaching a theory of *kind*. Introducing it will blur the wedge you are trying to drive between function and feeling.

  **Summary Instruction:** Your instrument background is your greatest asset for explaining GWT, but your greatest liability for explaining Phenomenality. You must prevent them from treating the "felt" as merely "unlogged data." Use Blindsight to break their intuition, GWT to satisfy their engineering mindset, and the Closing Question to test their philosophical grasp.
