      *   **Context:** River valley, 11 miles of levee, upstream dam (unresponsive owner), trailer park + industrial park on floodplain, ~9k population.
      *   **Role:** Duty officer 8-12 times/year. High pressure, short timeframe (30-40 mins), limited tools (laptop, 3 tabs, 1 phone call).
      *   **Output:** Recommendation to County Judge (who signs). Documentation reviewed later by sheriff, auditor, insurance, reporters.
      *   **Core Problem:** Deciding when to claim "we know the water will/won't overtop" vs. acting on precaution. This is an epistemological problem (knowledge/stakes/context) disguised as an operational one.
      *   **Philosophical Background:** User knows about *Pragmatic Encroachment* (stakes raise the bar for knowledge) and *Contextualism* (salient error possibilities raise the bar). They find these conflicting or confusing and need *one* practical protocol.
      *   **Specific Pain Points:**
          1.  *Whose stakes?* (Residents vs. Duty Officer's reputation/liability).
          2.  *Conflicting Stakes/Time Pressure:* Raising the bar (waiting for data) might consume the lead time needed for action.
          3.  **Audit Trail:** The written rationale is read later by people who weren't there. Needs to record *why* certain errors were excluded.
      *   **Required Output:** A decision procedure (algorithm/checklist) for tired officers. Three specific outputs: (1) Assert Knowledge, (2) Refuse Knowledge/Act Precautionary, (3) Escalate to Values Question.
      *   **Specific Cases to Test:** (a) High risk/overnight/elderly, (b) Mixed stakes (trailers vs. warehouses) on same forecast, (c) Slow onset (wait for data vs. lead time).
      *   **Constraints:** No philosophy jargon/citations. Practical, actionable. Acknowledge limitations.

  2.  **Deconstruct the Philosophical Concepts into Operational Steps:**
      *   *Pragmatic Encroachment:* High stakes = need higher certainty. *Operationally:* Define "Stakes" not by the officer's reputation, but by the *harm to the vulnerable population*. The officer's liability is secondary to life safety.
      *   *Contextualism:* Salient error possibilities = need to rule them out. *Operationally:* Explicitly list the "Live Failure Modes" (e.g., pump failure at Maple Street) and check if current data rules them out.
      *   *The Conflict:* Waiting for certainty vs. Lead Time. *Operationally:* A "Lead Time Threshold." If getting certainty eats the safety margin, you can't wait. You must act on the precautionary branch.

  3.  **Drafting the Protocol - Step-by-Step:**

      *   *Goal:* Move from Forecast + Map -> Decision.
      *   *Step 1: Define the Zone & Population.* (Who is at risk?)
      *   *Step 2: Identify Live Error Modes.* (Contextualism). What specific things could go wrong that we are worried about *right now*? (e.g., Maple Street pump).
      *   *Step 3: Assess Stakes.* (Pragmatic Encroachment). Whose stakes? The residents'. High stakes (life/safety) vs. Low stakes (property).
      *   *Step 4: The Time/Certainty Trade-off.* (The "Unreachable Standard" problem). Can we get the certainty required by the stakes *within* the lead time needed?
      *   *Step 5: The Declaration.* (Assert, Precaution, or Escalate).
      *   *Step 6: The Record.* (For the auditor).

  4.  **Addressing the Specific Pain Points:**
      *   *Whose Stakes?* The protocol must explicitly prioritize the *most vulnerable population in the impact zone*. The officer's reputation is irrelevant to the "Knowledge" threshold for safety.
      *   *Time vs. Certainty:* If `Time to Certainty` > `Lead Time Required`, you cannot claim knowledge. You must default to precaution.
      *   *Audit Trail:* A specific "Exclusion Log" where the officer writes down what they *didn't* worry about and why.

  5.  **Refining the Outputs:**
      *   *Green (Assert Knowledge):* Data is solid, stakes are manageable, errors ruled out.
      *   *Yellow (Precautionary Action):* Stakes are high, data is fuzzy, OR waiting kills lead time. Act *as if* the bad thing happens without formally claiming it *will* happen.
      *   *Red (Values Question):* The trade-off is purely ethical/political (e.g., economic ruin vs. 1% chance of death). Hand to Judge.

  6.  **Developing the Test Cases:**
      *   *Case A (Overnight/Elderly):* High stakes. 60% is low certainty. Lead time tight. *Result:* Precautionary. Don't claim "We know." Claim "Risk exceeds threshold."
      *   *Case B (Trailers vs. Warehouses):* Same water, different stakes. *Result:* Split decision. We know warehouses are safe (low stakes threshold met). We don't know trailers are safe (high stakes threshold not met). This feels weird but is philosophically sound and operationally necessary.
      *   *Case C (Slow Onset):* Time to wait (12h) < Lead time needed (30h). *Result:* Wait. You can afford the certainty.

  7.  **Drafting the Content (Iterative refinement for tone):**
      *   *Tone:* Professional, direct, empathetic to the fatigue. No academic fluff.
      *   *Structure:* Introduction -> The Protocol (The "Levee Knowledge Protocol") -> The Record -> Limitations -> Case Studies.
      *   *Key Terminology:* Avoid "Pragmatic Encroachment." Use "Stakes Threshold." Avoid "Contextualism." Use "Live Error Check."

  8.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is the distinction between "Assert Knowledge" and "Precautionary Action" clear?
      *   *Fix:* Make sure "Assert Knowledge" means "We can say it won't happen." "Precautionary" means "We can't say it won't, so we act like it might."
      *   *Critique:* Did I address the "Whose Stakes" issue?
      *   *Fix:* Explicitly state in Step 2 that the officer's liability is excluded from the calculation.
      *   *Critique:* Is the audit trail practical?
      *   *Fix:* Make it a checkbox style or a fill-in-the-blank sentence for the rationale document.

  9.  **Final Polish:** Check against the prompt's specific constraints (30-40 mins, tired officer, no citations, specific cases). Ensure the "Values Question" escape hatch is clear for when the math doesn't solve the ethics.

  *(Self-Correction on Case B)*: The prompt asks me to be plain about the fact that the procedure might say "We know the water won't hit the warehouse" but "We don't know it won't hit the trailers" on the *same evidence*. I need to make sure the protocol explicitly allows for *Zone-Specific Knowledge Claims*. This is crucial. Knowledge isn't just about the water; it's about the water *relative to the consequence*.

  *(Self-Correction on Case C)*: If waiting 12 hours leaves 18 hours for evacuation (which needs 30), that's a fail. Wait, prompt says "evacuation needs thirty." If better model is 12 hours out, and evacuation needs 30, you have 3 days (72 hours). 72 - 12 = 60 hours lead time. 60 > 30. So you *can* wait. I need to make sure the math in the example reflects the prompt's constraints accurately. Prompt: "better model run lands in twelve hours but evacuation needs thirty." Total window is 3 days (72 hours). So waiting is safe.

  *(Final check on "Values Question")*: When does this trigger? When the protocol says "Act Precautionary" but the cost is catastrophic (e.g., bankrupting the county) and the risk is low probability but high fatality. That's for the Judge.

