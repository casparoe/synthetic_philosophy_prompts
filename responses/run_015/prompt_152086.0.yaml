answer: |-
  **MEMORANDUM: OPERATIONAL KNOWLEDGE PROTOCOL (OKP-1)**
  **TO:** Duty Officers, County Emergency Management
  **SUBJECT:** Decision Procedure for Flood Declarations
  **TIME ALLOWANCE:** 30 Minutes Max

  ### PURPOSE
  You are not being asked to predict the future. You are being asked to certify whether the current data is *good enough* to rule out disaster for a specific group of people. This protocol translates "good enough" into a checklist. It prioritizes the safety of the public over the reputation of the agency.

  ### THE THREE OUTPUTS
  1.  **GREEN (Assert Knowledge):** You certify to the Judge: *"We know the water will not overtop."* No evacuation required.
  2.  **YELLOW (Precautionary Action):** You certify: *"We cannot rule out overtopping."* Evacuation or shelter-in-place proceeds based on risk, not certainty.
  3.  **RED (Values Question):** You cannot decide based on data alone. The cost of acting is too high relative to the uncertainty. Hand off to the County Judge immediately.

  ---

  ### THE PROCEDURE

  #### STEP 1: DEFINE THE ZONE AND THE STAKES (5 Minutes)
  Do not assess the county. Assess the specific impact zone for this forecast.
  *   **Identify the Population:** Who is in the water's path? (e.g., Trailer Park, Industrial Park).
  *   **Assign Stakes Level:**
      *   **HIGH STAKES:** Human life, mobility-impaired residents (elderly/disabled), hazardous materials.
      *   **LOW STAKES:** Empty buildings, vehicles, uninsured property, infrastructure with redundancy.
  *   **RULE:** You must use the **Highest Stakes** present in the zone. Do not factor in your own liability, the agency's budget, or "cry wolf" concerns. Those are administrative problems; life safety is the epistemic bar.

  #### STEP 2: THE LIVE ERROR CHECK (10 Minutes)
  Open your three tabs. Look for the specific failure modes currently "live" in the room (the things you are worried about *today* that you weren't worried about last year).
  *   **List the Live Errors:** (e.g., "Maple Street Pump Failure," "Dam Spillway Stuck," "Levee Saturation").
  *   **The Exclusion Test:** For each Live Error, can you positively rule it out with current data?
      *   *Yes:* Document the data point (e.g., "Pump telemetry green").
      *   *No:* Mark as **UNRESOLVED**.
  *   **RULE:** If any **HIGH STAKES** zone has an **UNRESOLVED** Live Error, you cannot assert knowledge (GREEN). You must move to YELLOW or RED.

  #### STEP 3: THE LEAD TIME CALCULUS (10 Minutes)
  This handles the conflict between "waiting for certainty" and "needing time to act."
  *   **A:** Time required to evacuate the zone (e.g., 6 hours).
  *   **B:** Time until the forecast uncertainty resolves (e.g., 12 hours for new model).
  *   **C:** Time until water reaches critical level (e.g., 24 hours).
  *   **CALCULATION:** Is `(C - B) > A`?
      *   *In plain English:* If I wait for better data, will there still be enough time to get people out?
      *   **If YES:** You are allowed to wait for better data. Return to Step 2 after the update.
      *   **If NO:** You **cannot** wait. You must decide now. If uncertainty remains high, you must default to YELLOW (Precautionary). You are not allowed to gamble lead time for certainty when stakes are HIGH.

  #### STEP 4: THE DECLARATION (5 Minutes)
  Select your output based on the matrix below.

  | Stakes Level | Live Errors Resolved? | Lead Time Safe? | **OUTPUT** |
  | :--- | :--- | :--- | :--- |
  | **LOW** | YES | N/A | **GREEN** (Assert Knowledge) |
  | **LOW** | NO | N/A | **GREEN** (Assert Knowledge)* |
  | **HIGH** | YES | N/A | **GREEN** (Assert Knowledge) |
  | **HIGH** | NO | YES (Can wait) | **WAIT** (Loop to Step 3) |
  | **HIGH** | NO | NO (Cannot wait) | **YELLOW** (Precautionary) |
  | **HIGH** | NO | NO | **RED** (Values Question)** |

  *\*For Low Stakes, you can tolerate unresolved errors (e.g., we don't know if the parking lot floods, but no one dies).*
  *\*\*Use RED only if the Precautionary Action (Yellow) causes catastrophic harm (e.g., bankrupting the county) and the risk is ambiguous. This is for the Judge.*

  #### STEP 5: THE AUDIT TRAIL (Mandatory)
  When you write the one-page rationale, you must include the **Exclusion Statement**. This protects you from the auditor who wasn't there.
  *   **Template:** *"At [Time], the following failure modes were considered live: [List]. These were excluded based on [Data Source]. The decision to [Action] was driven by [Stakes Level] stakes in [Zone]."*
  *   **Why:** This tells the auditor you didn't ignore the risk; you formally excluded it based on the stakes of that specific night.

  ---

  ### WHAT THIS PROCEDURE CANNOT DO
  1.  **It cannot make the water behave.** If the dam owner doesn't call, the protocol forces you to assume the worst for High Stakes zones. It does not fix the relationship.
  2.  **It cannot protect your reputation.** If you evacuate 400 people and the water stays dry, the protocol ensures you did it for the right reasons, but people will still be angry. This tool justifies the decision, it does not silence the critics.
  3.  **It cannot solve moral dilemmas.** If the choice is between "certain economic ruin for the industrial park" and "1% chance of death in the trailer park," that is a Values Question (RED). The protocol tells you to hand that to the Judge.

  ---

  ### WORKED CASES

  #### CASE A: The Overnight Rush
  *   **Scenario:** 60% chance of overtopping at Maple Street. 400 homes, elderly residents. 6 hours lead time needed.
  *   **Step 1 (Stakes):** HIGH (Elderly lives at risk).
  *   **Step 2 (Errors):** Live Error is "Pump Station Failure." Data is ambiguous (60% chance implies uncertainty on pump capacity vs. inflow). Error is UNRESOLVED.
  *   **Step 3 (Time):** Water arrives in roughly 6-8 hours (implied by overnight rush). Lead time needed is 6 hours. If you wait for a better forecast (say, 2 hours), you have 4 hours left to evacuate. **Lead Time is NOT Safe.**
  *   **Step 4 (Decision):** High Stakes + Unresolved Error + No Time to Wait = **YELLOW**.
  *   **Action:** Recommend evacuation. Do not write "We know it will flood." Write "We cannot rule out overtopping given pump uncertainty and resident vulnerability."
  *   **Audit Trail:** *"Live error: Pump capacity. Excluded? No. Stakes: High (elderly). Lead time insufficient to wait for resolution."*

  #### CASE B: The Split Zone (The Hard One)
  *   **Scenario:** Same forecast. Water level predicted to be 12.5 feet. Trailer Park ground elevation is 12 feet. Warehouse District ground elevation is 11 feet, but buildings are elevated on berms to 13 feet.
  *   **Step 1 (Stakes):**
      *   Zone 1 (Trailers): HIGH (Human life).
      *   Zone 2 (Warehouses): LOW (Empty buildings).
  *   **Step 2 (Errors):** Forecast uncertainty is ±1 foot. This means water could be 11.5 or 13.5.
  *   **Step 3 (Time):** Assume time is sufficient for both.
  *   **Step 4 (Decision):**
      *   **For Trailers:** High Stakes + Uncertainty exceeds safety margin = **YELLOW** (Evacuate). You cannot claim knowledge they are safe.
      *   **For Warehouses:** Low Stakes + Uncertainty is acceptable risk to property = **GREEN** (No Action). You can claim knowledge they are safe *enough*.
  *   **Output:** You issue an evacuation order for the Trailer Park only.
  *   **The Hard Truth:** On the *exact same water forecast*, you assert knowledge for the warehouse ("We know it won't flood") but refuse it for the trailers ("We don't know it won't flood").
  *   **Audit Trail:** *"Zone 2 declared safe based on property-only stakes tolerating ±1ft variance. Zone 1 declared at-risk based on life-safety stakes requiring higher certainty margin."*
      *   *Note:* This looks inconsistent to a reporter, but it is consistent to an auditor who understands liability and stakes.

  #### CASE C: The Slow Onset
  *   **Scenario:** Flood event 3 days (72 hours) out. Evacuation needs 30 hours. Better model run available in 12 hours.
  *   **Step 1 (Stakes):** HIGH.
  *   **Step 2 (Errors):** Current model is vague. Live Errors UNRESOLVED.
  *   **Step 3 (Time):**
      *   Time until water: 72 hours.
      *   Time to wait for data: 12 hours.
      *   Remaining time: 60 hours.
      *   Evacuation need: 30 hours.
      *   **Calculation:** 60 > 30. **Lead Time IS Safe.**
  *   **Step 4 (Decision):** High Stakes + Unresolved Error + Time to Wait = **WAIT**.
  *   **Action:** Do not issue order yet. Set alarm for 12 hours. Run protocol again.
  *   **Why:** Because you have the luxury of time, the bar for knowledge goes up. You are not allowed to evacuate early based on bad data if good data is coming and you have time to use it.

  ---

  ### FINAL NOTE FOR THE DUTY OFFICER
  When you are tired, your brain will want to protect *you* from blame. It will tell you that evacuating is safer for your career than a false alarm. **Ignore that.** Step 1 of this protocol explicitly removes your career from the equation. If the stakes for the resident are Low, do not evacuate them just to cover your skin. If the stakes are High, do not hesitate just to save the budget.

  Write the Exclusion Statement. Make the call. Go home.
