answer: |-
  Hey, looking over your spec, you have effectively reconstructed the CHSH game, which is the standard engineering testbed for Bell's theorem. Your cartridge of correlated bits plus the PRNG is what physicists call the local hidden variable, usually denoted lambda. When we talk about locality in your stack, we mean strict functional dependency: Node A's output must be computable using only its local input, its local clock, and the pre-provisioned state. There can be no function call or memory read that depends on Node B's input after provisioning. No-signalling is slightly subtler than just physical isolation. In your terms, physical isolation means there is no channel, but no-signalling is a statistical guarantee on the logs. It means that if you audit Node A's output distribution in isolation, it remains identical regardless of what input Node B received. You can have physical isolation yet violate no-signalling if your pre-provisioned state was somehow correlated with the future inputs, which leads directly to your second failure mode.

  When you hear that classical systems cap at a score of 2 while quantum systems hit 2 root 2, the engineer's instinct is to hunt for a hidden channel. You suspect side-channel leakage, timing attacks, or clock skew allowing information to bleed across the partition. In physics, we call these loopholes, and experiments work hard to close them by ensuring space-like separation, meaning light itself couldn't bridge the gap in the time allowed. If those are closed and you still see a violation, the theorem says you cannot maintain the assumption that the nodes are locally realistic machines. It is not merely that there is a hidden channel; it is that the universe does not behave like a distributed system with pre-determined state. Saying there must be a channel is a valid engineering debugging step, but if you rigorously prove no channel exists, the remaining option is that the outputs were not determined by the inputs and the shared seed alone.

  Your two failure modes map directly to known loopholes in the literature. The timeout issue, where you drop rounds that don't complete, maps to the detection loophole. If the probability of a node timing out depends on the input it received or the output it was about to generate, you are effectively post-selecting your data. You might be discarding the very rounds that would lower your average score, artificially inflating the result. This is considered a bug in the experiment design because it violates the assumption of a fair sample. The second mode, where the load generator shares the RNG seed with the cartridge, maps to the freedom-of-choice loophole, often discussed under superdeterminism. If the input choices are correlated with the hidden variable in the cartridge, the inputs are no longer independent variables. The system is essentially reading from a script where the inputs and the processing logic were coordinated at the start of time. Physicists generally treat this as a genuine explanatory option, though an unpopular one, because it preserves locality at the cost of assuming the experimenter has no free will to choose inputs independently of the system state.

  When we claim the nodes' outputs had no definite value before the inputs arrived, we are challenging counterfactual definiteness. In your vocabulary, you assume that for every possible input pair, there exists a correct output pair determined by the code and state, even if that input pair is never actually sent. You assume a global truth table exists. To say there is no definite value means that table does not exist. The output is not a lookup from a pre-existing state; it is generated contextually by the interaction of the input and the state. The value is created at the moment of execution, not retrieved.

  This brings us to the residue report, which is where the translation breaks down. Your hunch is correct. The sticking point is your framework's assumption of a single global run, a single schedule where there is a definite fact about what every node would have done under every input. You assume the system state is a vector that exists independently of the queries you run against it. Quantum mechanics refuses to fit inside that because it denies the existence of that global state vector for all possible measurements simultaneously. In your toolkit, you assume commutativity; you assume reading register X then register Y is equivalent to reading Y then X, or that reading X doesn't change the value of Y. The quantum case requires you to bolt on non-commutativity, where the act of reading a value alters the state available for subsequent reads, even on distant nodes via the entanglement correlation.

  The philosophical fights you mentioned largely stem from trying to restore that global run assumption. Retro-causality would require you to allow write-access to past logs, letting the input modify the provisioning state at t0. The branching-universe reply, or many-worlds, would require you to version control the universe state, where every possible output happens in a different branch and the score is an interference pattern across branches rather than a single scalar average. Superdeterminism removes the input generator as an external service and merges it into the main state machine, eliminating the distinction between test harness and system under test. None of these have clean counterparts in standard distributed systems because your field is built on the premise that state is stable and inputs are external events. The gap isn't in your vocabulary; it is a sign that the physicists' claim is that reality does not support the abstraction of a stable, observer-independent state vector. You are trying to model a system where the code changes depending on which function you call, which violates the fundamental contract of deterministic computing. The violation of the bound is essentially a compiler error on the assumption that a single global history exists.
