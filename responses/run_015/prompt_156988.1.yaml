answer: |-
  **To:** Advisor
  **From:** [Your Name]
  **Date:** [Current Date]
  **Subject:** Draft Taxonomy: Pure Time Preference in Institutional Contexts

  Here is the decision tree draft for Friday's committee meeting. It structures the positions based on the four conceptual branching questions we discussed, focusing on the logical commitments rather than specific policy outputs (e.g., carbon pricing).

  ### The Decision Tree

  ```text
  START: Setting Intergenerational Discount Rates
  │
  ├── Q1: Does the Non-Identity Problem (NIP) break cross-generational welfare comparison?
  │   │
  │   ├── YES → [Leaf 1: The Conceptual Skeptic]
  │   │
  │   └── NO (Comparison is valid)
  │       │
  │       ├── Q2: Must Social and Individual discount rates diverge?
  │       │   │
  │       │   ├── NO (State = Aggregate Individual)
  │       │   │   │
  │       │   │   ├── Q3: Does Existential Risk (x-risk) justify differential treatment?
  │       │   │   │   │
  │       │   │   │   ├── NO → Q4: Is delaying benefit asymmetric to accelerating harm?
  │       │   │   │   │   │
  │       │   │   │   │   ├── NO → [Leaf 2: The Ramsey Purist]
  │       │   │   │   │   └── YES → [Leaf 3: The Harm-Prioritarian]
  │       │   │   │   │
  │       │   │   │   └── YES → [Leaf 4: The Hazard-Adjuster]
  │       │   │
  │       │   └── YES (State has distinct fiduciary duties)
  │           │
  │           ├── Q3: Does Existential Risk justify differential treatment?
  │           │   │
  │           │   ├── NO → [Leaf 5: The Democratic Discounter]
  │           │   └── YES → [Leaf 6: The Fiduciary Steward]
  │           │
  │           └── (Q4 is subsumed by institutional mandate in this branch)
  ```

  ### Leaf Definitions & Awkward Commitments

  **1. The Conceptual Skeptic** (NIP = True)
  *   **Standard Label:** *Identity-Relative View*
  *   **Awkward Commitment:** Cannot condemn policies that harm future people if those same policies are causally necessary for those specific people to exist.

  **2. The Ramsey Purist** (Ind = Soc, No X-Risk, Symmetric)
  *   **Standard Label:** *Zero Pure Time Preference*
  *   **Awkward Commitment:** Requires the current generation to accept massive welfare losses for negligible per-capita gains to the astronomically numerous far-future.

  **3. The Harm-Prioritarian** (Ind = Soc, No X-Risk, Asymmetric)
  *   **Standard Label:** *Asymmetric Discounting*
  *   **Awkward Commitment:** Implies we should prioritize preventing future pain over creating future pleasure, potentially justifying stagnation to avoid risk.

  **4. The Hazard-Adjuster** (Ind = Soc, X-Risk = True)
  *   **Standard Label:** *Probability-Weighted Discounting*
  *   **Awkward Commitment:** Morally writes off future generations solely based on survival probability, effectively penalizing them for risks the present created.

  **5. The Democratic Discounter** (Ind ≠ Soc, No X-Risk)
  *   **Standard Label:** *Positive Social Time Preference*
  *   **Awkward Commitment:** Admits that institutional myopia is ethically discriminatory but argues it is politically necessary to reflect current voters' preferences.

  **6. The Fiduciary Steward** (Ind ≠ Soc, X-Risk = True)
  *   **Standard Label:** *Declining Discount Rate (Institutional)*
  *   **Awkward Commitment:** Requires trustees to act more patiently than the beneficiaries they currently represent would explicitly want.

  ***

  ### Empty / Pruned Combinations

  **1. NIP = True + Non-Zero Discount Rate**
  *   **Status:** *Incoherent.*
  *   **Reason:** If the Non-Identity Problem breaks welfare comparison, there is no common metric across generations to which a rate can be applied. You cannot discount what you cannot measure.

  **2. Social = Individual + Positive Pure Time Preference**
  *   **Status:** *Unattractive / Philosophically Barren.*
  *   **Reason:** While common in descriptive economics, almost no normative philosopher defends *individual* positive time preference as morally valid (it is pure discrimination by date of birth). This position collapses into Leaf 5 (Democratic Discounter) when institutionalized.

  **3. X-Risk = True + Zero Hazard Adjustment**
  *   **Status:** *Incoherent.*
  *   **Reason:** If one admits existential risk is morally relevant (Q3=Yes) but refuses to adjust the discount rate for it, the position is performatively contradictory.

  **4. Social ≠ Individual + Asymmetry (Q4)**
  *   **Status:** *Unexplored / Redundant.*
  *   **Reason:** In institutional contexts where social/individual rates diverge, the asymmetry is usually absorbed into the fiduciary mandate (Leaf 6) rather than treated as a separate moral axiom about harm vs. benefit.

  ***

  **Notes for the Seminar:**
  *   The split at **Q2** is the most critical for institutional investors. It separates the *moral philosophers* (Leaf 2-4) from the *governance theorists* (Leaf 5-6).
  *   **Q3** distinguishes between *discounting time* (PTP) and *discounting probability* (X-Risk). This is often conflated in climate literature; the tree forces a distinction.
  *   **Leaf 1** is a "stopper." If a student takes this branch, the rest of the seminar on discount rates is irrelevant to them.

  Let me know if you want to expand the "Fiduciary Steward" branch; that's where the endowment committee usually lives.
