  **MINISTRY OF PRESENCE & ONTOLOGICAL REGISTRY**
  **NOTICE 44-B: MAINTENANCE OF CONTINUOUS BEING**
  **FILE REF: MP/ONT/99/REV3**

  1.  **Ontological Status.** All chattels and land parcels hold legal Being only while perceived by a finite mind or the Infinite Mind. Matter unperceived is null void. Citizens are responsible for ensuring their property is attended.

  2.  **Registration of Being.** To establish Being, submit Form P-1 witnessed by a Certified Observer. Fee: 5 crowns. The object must be present during stamping. Presentation constitutes perception; thus, registration is self-validating.

  3.  **Declaration of Lapse.** Citizens seeking to deregister an object (Form L-2) must identify the object precisely to nullify it. Identification constitutes perception. Consequently, the act of filing Form L-2 sustains the object's Being for the duration of processing. Processing time: 6-8 weeks. The object remains in Being until the physical destruction of Form L-2. Citizens attempting to conceive of the object as "already gone" during this period will be fined for Contradiction.

  4.  **Continuity (Non-Office Hours).** During hours when no finite mind attends the object, continuity is guaranteed by the Infinite Mind. No fee is levied for Divine Perception. However, an Administrative Continuity Fee (12 crowns/month) applies for recording reliance on this guarantee. Failure to pay suspends the record, not the Being, but renders the Being unclaimable against third parties. The Infinite Mind does not cover contraband.

  5.  **Disputes of Resemblance.** As no two minds perceive the identical object, title disputes are adjudicated by Sufficiency of Resemblance. Claimant A and Claimant B shall present their respective perceptions. The Tribunal calculates the percentage dissimilarity.
      (a) <5% Dissimilarity: Object deemed legally identical. Transfer ordered.
      (b) 5-20% Dissimilarity: Compensation scaled to divergence.
      (c) >20% Dissimilarity: Claims dismissed. Parties possess distinct objects.
      *Note:* Claimants arguing for numerical identity beyond resemblance will be referred for psychological evaluation.

  6.  **Official Attendance.** Registry offices operate 00:00–23:59. Certified Observers are paid to perceive archived files continuously. While the Infinite Mind sustains the files regardless, Statute 9 requires finite attendance to ensure administrative legibility. Staff found sleeping are liable for ontological negligence. Closing the office is prohibited, as unobserved archives risk bureaucratic dissolution even if ontologically secure. Overtime is not paid for Divine overlap.

  7.  **Penalties.** Attempting to conceive of an object as existing outside perception is a Class 3 Contradiction. Fine: 50 crowns. Do not attempt to imagine unregistered space.

  ***

  **NOTE TO AUTHOR**

  Berkeley's appeal to God for continuity is standard doctrine (settled), though taxing it is my liberty. The "same object" problem is contested: Berkeley allows numerical identity via language/archetypes, but strict idealism implies private ideas only; I exaggerated the latter for the tribunal mechanic. The "conceiving" trap is faithful to Berkeley's *Principles* §23, though I bureaucratized the contradiction. The main liberty is treating ontological security as distinct from legal claimability.
