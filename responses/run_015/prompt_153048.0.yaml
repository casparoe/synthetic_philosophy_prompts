prompt: |-
  Hi — I'm chief of staff (and by default the office ethics person, because nobody else will take it) in a mid-size city mayor's office, and I need something I can actually run, not something to think about.

  The situation: two or three times a week something hits my desk where the options are (i) do something the mayor and I both think is morally wrong, or (ii) let something bad happen that the city exists to prevent. Sometimes the wrong thing is legally shaky, sometimes it's completely legal and that's the problem. Legal review is a separate step and we have corp counsel for it, so please don't spend the procedure on "is it lawful" — I need whatever comes after the lawyers say yes or shrug.

  I've read a bit of the philosophy on this (dirty hands) and it's maddening in practice: lots about tragedy, moral residue, guilt, and whether the politician who does these things is the one we should want in office — and almost nothing about how to tell whether you're actually in a dirty-hands case or just telling yourself you are so you can sleep at night. I think that distinction is doing all the work, so build the procedure around it. Here are the things I keep wanting to test and can't quite operationalise:

  - Is the wrong load-bearing? Does the action still produce the good outcome if you take the wrong-making feature out of it, maybe at some cost in speed or money? If the wrong bit is just the cheapest or fastest route to a result you could get otherwise, then as far as I'm concerned it isn't dirty hands, it's a bad trade with nicer packaging. (I invented "load-bearing wrong" as a label — use it if it helps, swap it for something better if you have one.)
  - Does the wrong survive delegation? Half the time the act happens three layers down and nobody quite ordered it, or the mayor "doesn't want to know the details." My instinct is that you can't launder it by pushing it down the chain, and that the dirt actually attaches to whoever set up the situation where someone lower down had to do it. I want that as a step, not a vibe.
  - Are we really just in lesser-evil territory? Plenty of what comes through here isn't "wrong but necessary," it's "imposes real costs on people and nobody's rights are violated." I want the procedure to say so quickly and let us move on, instead of us agonising over everything.
  - The acknowledgement condition. My sense from what I've read is that any permission here is tied to the agent being willing to own the act in public afterwards and take whatever comes — being judged, being punished, resigning, carrying the guilt rather than treating it as washed away. But most of the options that reach my desk only work if nobody finds out. That seems to mean most of them can't qualify at all, and I want the procedure to say that in so many words rather than leaving it to my judgement every single time.
  - Frequency. This is roughly the fourth emergency procurement / back-channel deal / shortcut this year and I've noticed we've stopped noticing. Is there a version of this test that catches habituation — the slide into "well, we did it last time"? If it can be proceduralised, put it in. If it genuinely can't, say that instead of faking a step.

  What I want back:

  1. A decision procedure I can run in about 45 minutes on a real proposal: an ordered set of questions, what counts as a sufficient answer to each, what counts as a non-answer (i.e. the kind of thing my office writes that sounds like an answer and isn't), hard stops where the answer is no, and explicit hand-off points where the question is a values call the mayor has to make rather than me. Mark clearly which steps are real tests and which are judgement calls dressed up as procedure — I'd rather know than be reassured.
  2. Who signs off at each stage, given that I have about an hour, the mayor has ten minutes, and anything touching council has to survive a hostile oversight hearing six months later where someone reads our emails out loud.
  3. Run it on three cases, showing the actual path through the steps:
   (a) A fast-moving wildfire. The fire chief wants standing authority to demolish two unoccupied houses without the notice our ordinance requires, to cut a firebreak that will probably save a block. Legally dubious, time pressure is real.
   (b) A housing deal. In exchange for a much larger affordable-housing set-aside than we could get any other way, we steer a seperate no-bid garage contract to the same developer and let the public believe the garage went to them on merit. Nobody's rights are violated exactly, but a process we're supposed to be guarding is being rigged on purpose, and elected colleagues are being lied to by omission.
   (c) An undercover policing operation that requires the officer to participate in a crime to hold cover, which will genuinely prevent serious harm to identifiable people, and which cannot work unless the city can deny any knowledge of it afterwards. This is the one where I think the procedure is going to hand me an answer I don't like. I'd much rather see it come out that way in writing than have you smooth the edges because the stakes in the case feel high.
  4. A short, honest closing section on where this thing will misfire: what it will wrongly clear, what it will wrongly block, and the kinds of case where it's basically a rubber stamp for whatever we already wanted to do.

  Two more constraints. Don't give me a reading list, citations, or a summary of who argued what — I can't chase references and it wouldn't help me decide by 3pm. And design it for someone who is tired, recieves most of these proposals from people more senior than them, wants to keep their job, and will therefore rationalise hard: if there's a way to build an anti-rationalisation check into the ordering of the questions (or into who has to answer them), do that.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User:** Chief of Staff (CoS) in a mid-size city mayor's office. Also the de facto ethics officer.
      *   **Problem:** Frequent "dirty hands" scenarios (morally wrong but seemingly necessary actions). Needs a practical decision procedure, not philosophy.
      *   **Constraints:**
          *   No legal advice (Corp Counsel handles that).
          *   Time limit: ~45 mins to run, Mayor has 10 mins.
          *   Audience: Tired, pressured, prone to rationalization, needs to keep job, survive oversight hearings.
          *   Specific Concepts to Operationalize: "Load-bearing wrong," "Delegation test," "Lesser-evil vs. Rights violation," "Acknowledgement condition" (public ownership), "Frequency/Habituation."
          *   Output: Decision procedure (questions, sufficient answers, hard stops), Sign-off matrix, 3 Case Studies (Wildfire, Housing, Undercover), Limitations/Failure Modes.
          *   Tone: Direct, pragmatic, no academic citations, anti-rationalization built-in.

  2.  **Deconstruct the "Dirty Hands" Problem for Bureaucracy:**
      *   The core tension is between *effectiveness* (getting things done/saving lives) and *integrity* (following rules/norms).
      *   The user wants to distinguish between *true tragic necessity* (dirty hands) and *convenience/corruption* (bad trade).
      *   Key Insight: If you can't admit to it later, it's probably not ethical, it's just risky. If you do it often, it's policy, not emergency.

  3.  **Drafting the Decision Procedure (The "Protocol"):**
      *   *Goal:* 45 minutes. Needs to be a checklist with teeth.
      *   *Structure:* Sequential gates. If you fail a gate, stop.
      *   *Anti-Rationalization:* Force specific evidence, not vague assertions. Require the *opposing* view to be stated.
      *   *Step 1: The Load-Bearing Test.* (User's concept). Is the wrong essential?
          *   *Check:* Can we achieve 80% of the good without the wrong?
          *   *Anti-Rationalization:* Require a specific alternative that was rejected and *why* (cost/time quantified).
      *   *Step 2: The Rights/Severity Test.* (Lesser-evil vs. Cost).
          *   *Check:* Is a specific right violated or just a preference/cost imposed?
          *   *Anti-Rationalization:* Name the specific right or statute purpose being bypassed.
      *   *Step 3: The Delegation/Chain Test.*
          *   *Check:* Who physically does the act? Who ordered it?
          *   *Anti-Rationalization:* If the Mayor doesn't want to know, it's a No.
      *   *Step 4: The Acknowledgement Test.* (The "Sunlight" Test).
          *   *Check:* Can we write a memo about this in 6 months?
          *   *Anti-Rationalization:* Draft the headline *now*. If it requires lying, it's a No.
      *   *Step 5: The Frequency/Habituation Log.*
          *   *Check:* Have we done this before?
          *   *Anti-Rationalization:* Consult the log. If >2 times/year, it's policy, not emergency.

  4.  **Developing the Sign-Off Matrix:**
      *   Need to protect the CoS and the Mayor.
      *   CoS runs the test.
      *   Mayor makes the Value Call (Step 4/5).
      *   Counsel handles Legality (pre-step).
      *   Documentation is key for the "hostile oversight hearing."

  5.  **Running the Case Studies:**
      *   *Case A (Wildfire):* High urgency, physical safety.
          *   Load-bearing: Yes (time).
          *   Rights: Property vs. Life.
          *   Acknowledgement: Can admit later (emergency powers).
          *   Verdict: Likely Pass (with documentation).
      *   *Case B (Housing/Garage):* Corruption disguised as good.
          *   Load-bearing: No (could do affordable housing other ways, just slower/less).
          *   Acknowledgement: No (requires lying to council).
          *   Verdict: Hard Stop Fail.
      *   *Case C (Undercover/Crime):* The "Dirty Hands" classic.
          *   Load-bearing: Yes (cover blown otherwise).
          *   Acknowledgement: No (requires denial of knowledge).
          *   Frequency: If routine, it's policy.
          *   Verdict: Fail on Acknowledgement. This is the "answer I don't like" the user expects.

  6.  **Refining the "Failure Modes" Section:**
      *   Where does this break?
      *   True black swans (unforeseeable).
      *   When the "Good" is ill-defined.
      *   When the Mayor lies to the CoS.
      *   When the "Acknowlegement" test is too rigid for genuine intelligence work (though the prompt implies this is a feature, not a bug).

  7.  **Review against Constraints:**
      *   *Time:* Is it doable in 45 mins? Yes, if questions are sharp.
      *   *Tone:* Direct, no fluff.
      *   *Philosophy:* No citations, just operationalized concepts.
      *   *Anti-Rationalization:* Built into the "Evidence Required" fields.

  8.  **Self-Correction/Polishing during drafting:**
      *   *Critique:* The Acknowledgement Test might kill *all* intelligence work.
      *   *Fix:* Distinguish between "Deny knowledge" (lie) and "Classified/Confidential" (withhold). The prompt says "deny any knowledge," which implies lying. I need to be strict there because the user asked for the procedure to hand them an answer they don't like if that's what it says.
      *   *Critique:* Make sure the "Load-bearing" definition is clear.
      *   *Fix:* Define it as "Is the norm violation the *engine* of the success, or just the *lubricant*?"
      *   *Formatting:* Use bolding, boxes, or clear headers to make it skimmable for a tired CoS.

  9.  **Final Polish:** Check the "Who Signs Off" section. Ensure the CoS isn't taking the fall for the Mayor's moral choice, but is documenting the process. Ensure the "Habituation" log is a concrete artifact.

  *(Self-Correction on Case C)*: The prompt says "city can deny any knowledge of it afterwards." This is the killer. If the procedure demands accountability, this fails. I must ensure the procedure flags this as a failure, even if the operational need is high. This aligns with the user's request: "I'd much rather see it come out that way in writing."

  *(Self-Correction on Sign-off)*: The Mayor has 10 minutes. The CoS has 45. The CoS must prep the packet. The Mayor signs the "Value Call."

  *(Final check on "Load-bearing")*: User invented the term. I should use it but define it operationally. "If removed, does the outcome collapse?"

  Let's assemble the document.cw
answer: |-
  # The "Dirty Hands" Operational Protocol (DH-OP)

  **Purpose:** To distinguish between necessary tragic action and convenient corruption.
  **Time Cost:** 45 minutes (CoS prep), 10 minutes (Mayor decision).
  **Authority:** This protocol does not override Legal Counsel. If Counsel says "No," stop. This protocol begins *after* Counsel says "Yes" or "Legally Ambiguous."

  ---

  ## Part 1: The Decision Procedure

  Run these steps in order. If any step results in a **HARD STOP**, the proposal is rejected. If a step is a **VALUE CALL**, it moves to the Mayor.

  ### Step 1: The Load-Bearing Wrong Test
  **Question:** Is the norm violation the *engine* of the success, or just the *lubricant*?
  **Operation:** Describe the specific rule/norm being broken. Now describe the outcome if you follow the rule but spend 20% more money or take 20% more time.
  *   **Sufficient Answer:** "If we follow the rule, the objective becomes physically impossible (e.g., house burns down) or legally void (e.g., deal expires)."
  *   **Non-Answer (Rationalization):** "It's too expensive," "It's too much hassle," "Council won't like it," "We've always done it this way."
  *   **HARD STOP:** If the "wrong" is only saving money, time, or political capital. This is not dirty hands; this is bad management.

  ### Step 2: The Rights vs. Costs Test
  **Question:** Are we violating a specific right, or just imposing a cost?
  **Operation:** Identify the victim. What exactly do they lose?
  *   **Sufficient Answer (Lesser Evil):** "Group A loses money/convenience, but Group B avoids death/harm." (Cost vs. Right).
  *   **Sufficient Answer (Dirty Hands):** "Person A loses a specific legal right (e.g., notice, hearing, due process) to prevent catastrophic harm to Person B." (Right vs. Right).
  *   **Non-Answer (Rationalization):** "Nobody really gets hurt," "It's for the greater good," "They'll get over it."
  *   **HARD STOP:** If the action violates a fundamental right (speech, due process, safety) for a benefit that is merely financial or political.

  ### Step 3: The Delegation & Knowledge Test
  **Question:** Who physically performs the act, and who knows about it?
  **Operation:** Map the chain of command.
  *   **Sufficient Answer:** "The Mayor authorizes it. The Director executes it. The CoS documents it."
  *   **Non-Answer (Rationalization):** "The Mayor doesn't need to know the details," "Let the Department handle it," "Plausible deniability."
  *   **HARD STOP:** If the Mayor or CoS claims they "don't want to know" how the result is achieved. The dirt attaches to the person who created the incentive, not just the hand that pulled the trigger.
  *   **VALUE CALL:** If the act must be performed by a subordinate to protect their cover (e.g., undercover), the Mayor must explicitly accept responsibility for the order in a sealed memo.

  ### Step 4: The Acknowledgement (Sunlight) Test
  **Question:** Can we defend this action in public *after the fact*?
  **Operation:** Draft the headline and the first paragraph of the press release for 6 months from now.
  *   **Sufficient Answer:** "Mayor Authorizes Emergency Demolition to Save Block." (Truthful, defensible).
  *   **Non-Answer (Rationalization):** "We can't admit this yet," "It would compromise future operations," "The public wouldn't understand."
  *   **HARD STOP:** If the strategy requires the City to *lie* about its involvement later. (Note: Withholding details for security is different than denying knowledge. If the protocol requires the City to say "We did not do this" when you did, it fails).
  *   **VALUE CALL:** If the action requires temporary secrecy but eventual admission, the Mayor must sign a "Delayed Disclosure" waiver with a specific date for declassification.

  ### Step 5: The Habituation Log Check
  **Question:** Is this an emergency or a policy?
  **Operation:** Check the "Ethics Exception Log" (see Part 2).
  *   **Sufficient Answer:** "This is the first time this year this specific exception has been requested."
  *   **Non-Answer (Rationalization):** "We did something similar last month," "It's standard practice for this department."
  *   **HARD STOP:** If this specific type of exception has been used more than **twice** in the last 12 months. If you do it three times, it is not an emergency; it is policy. If it is policy, it must be legislated, not improvised.

  ---

  ## Part 2: Sign-Off & Documentation Matrix

  | Stage | Action | Who Signs | Time Allotted | Artifact Created |
  | :--- | :--- | :--- | :--- | :--- |
  | **Pre-Flight** | Legal Review (Legality only) | Corp Counsel | N/A | Email confirmation ("No legal bar" or "Risk noted") |
  | **Step 1-3** | Load-Bearing, Rights, Delegation | Chief of Staff | 30 Mins | **DH-OP Worksheet** (Filled out, signed) |
  | **Step 4** | Acknowledgement Test | Chief of Staff | 15 Mins | **Draft Press Memo** (Headline + 1st paragraph) |
  | **Step 5** | Habituation Check | Chief of Staff | 5 Mins | **Exception Log Entry** |
  | **Final** | Value Call / Authorization | **The Mayor** | 10 Mins | **Decision Memo** (References DH-OP Worksheet) |
  | **Audit** | 6-Month Review | CoS / Counsel | 1 Hour | **Compliance Check** (Did we disclose as promised?) |

  **The "Hostile Hearing" Shield:**
  If a councilmember asks in a hearing, "Did you know about this?" you hand them the **Decision Memo**. It shows the Mayor made a conscious choice based on documented criteria, not a wink-and-nod scheme. If the Mayor refused to sign the Decision Memo, the CoS kills the proposal.

  **The Anti-Rationalization Check:**
  The CoS must attach a "Minority Report" section to the Worksheet. If any advisor (including Counsel) objected, their objection must be written in the file. You cannot bury dissent.

  ---

  ## Part 3: Case Study Runs

  ### Case A: Wildfire Firebreak (Demolish 2 houses without notice)
  *   **Step 1 (Load-Bearing):** **PASS.** Waiting for notice allows fire to cross the break. Time is the engine, not cost.
  *   **Step 2 (Rights vs. Costs):** **VALUE CALL.** Property rights violated vs. Safety of a block. Physical safety usually trumps property in immediate peril.
  *   **Step 3 (Delegation):** **PASS.** Fire Chief executes, Mayor authorizes. No "don't tell me."
  *   **Step 4 (Acknowledgement):** **PASS.** Headline: "City Demolishes Homes to Stop Wildfire." Defensible under emergency powers.
  *   **Step 5 (Habituation):** **PASS.** Assuming this isn't the 3rd firebreak demolition this year.
  *   **Verdict:** **AUTHORIZED.**
  *   **Condition:** Mayor signs Decision Memo citing emergency statute. Compensation process for homeowners initiated immediately after fire.

  ### Case B: Housing Deal (No-bid garage for affordable housing)
  *   **Step 1 (Load-Bearing):** **FAIL.**
      *   *Analysis:* Can we get affordable housing without rigging the garage bid? Yes, likely slower or less profit for developer. The "wrong" (rigging) is lubricant for speed/profit, not the engine of the housing itself.
      *   *Rationalization Detected:* "We can't get the units otherwise" usually means "We can't get the units *at this price point for this developer*."
  *   **Step 4 (Acknowledgement):** **HARD STOP.**
      *   *Analysis:* Headline: "City Lied to Council About Garage Bid." Requires lying to elected colleagues by omission. Cannot be defended publicly.
  *   **Verdict:** **REJECTED.**
  *   **Note:** This is not dirty hands; this is corruption. The DH-OP kills this in Step 1 and Step 4.

  ### Case C: Undercover Operation (Officer commits crime, City denies knowledge)
  *   **Step 1 (Load-Bearing):** **PASS.** If the City acknowledges the crime, the cover is blown, harm occurs. The secrecy is the engine.
  *   **Step 2 (Rights vs. Costs):** **VALUE CALL.** Rights of the target vs. Safety of victims. (Assuming target is criminal actor).
  *   **Step 3 (Delegation):** **PASS.** (If Mayor signs sealed memo).
  *   **Step 4 (Acknowledgement):** **HARD STOP.**
      *   *Analysis:* The requirement is "City can deny any knowledge." This requires a lie. If the operation is compromised, the City must lie under oath or public scrutiny to protect it.
      *   *Procedure Output:* **REJECTED.**
      *   *Reasoning:* The DH-OP requires that the *City* eventually own the action. If the City must lie to exist, the City is compromised.
  *   **Step 5 (Habituation):** **CHECK.** If this happens "two or three times a week" (per your prompt context), this is **HARD STOP** on frequency alone.
  *   **Verdict:** **REJECTED.**
  *   **Note:** You mentioned you might not like this answer. The procedure is designed to fail this case. If you run undercover ops where the City must lie about involvement, you are running a rogue agency, not a city office. To pass, the protocol must change to: "City acknowledges authority but classifies details." If "Deny Knowledge" is a hard requirement from Police, they are asking you to break the protocol.

  ---

  ## Part 4: Failure Modes (Where this breaks)

  Be honest about where this tool will misfire.

  **1. The "True Black Swan" Failure**
  *   **What it misses:** A crisis so novel that the Habituation Log is irrelevant and the Acknowledgement Test is impossible (e.g., immediate containment of a bioweapon where admission causes panic).
  *   **Result:** The protocol will tell you to stop. You might have to ignore the protocol.
  *   **Mitigation:** If you ignore the protocol, you must write the "Post-Game" memo immediately after the crisis peaks, explaining *why* the protocol was insufficient. This becomes a case for updating the protocol.

  **2. The "Good Lie" Failure**
  *   **What it misses:** Cases where telling the truth genuinely endangers lives (more than Case C), but the "Acknowledgement Test" is too rigid.
  *   **Result:** The protocol blocks legitimate intelligence work.
  *   **Mitigation:** Modify Step 4 to allow "Classified/Sealed" acknowledgement rather than "Public" acknowledgement. *However*, someone (Mayor + Counsel) must still know and sign. Total denial is never permitted.

  **3. The "Rubber Stamp" Failure**
  *   **What it misses:** When the Mayor and CoS are both committed to a bad idea.
  *   **Result:** You will write the "Sufficient Answers" dishonestly to clear the gates.
  *   **Mitigation:** There is none. This is a tool for conscience, not a cage for sociopaths. If you lie on the Worksheet, you are the problem. The only check is the **Exception Log**. If your Worksheets all look identical, the Audit step (6-month review) should flag you.

  **4. The "Legal Shield" Failure**
  *   **What it misses:** Counsel says "It's legal," so you assume it's ethical.
  *   **Result:** You bypass Step 2 (Rights) because Step 0 (Law) was cleared.
  *   **Mitigation:** Remind staff: Counsel tests *liability*, CoS tests *legitimacy*. They are different tests.

  ---

  ## Implementation Note for the CoS

  **The "Tired" Safeguard:**
  When you are tired, you will want to skip Step 4 (Acknowledgement). Do not allow yourself to. Step 4 is the only thing that prevents you from waking up in a scandal six months from now.

  **The "Keep Your Job" Safeguard:**
  If the Mayor pressures you to bypass a HARD STOP:
  1.  Do not resign immediately.
  2.  Send an email: "Per our conversation, you are directing me to proceed despite DH-OP Step [X] Hard Stop. I will execute, but I am documenting this exception in the Log as per protocol."
  3.  This usually stops the pressure. If it doesn't, you have your exit documentation ready.

  **The Habituation Log (Simple Spreadsheet):**
  *   Date
  *   Proposal Name
  *   Norm Violated
  *   Step Failed/Passed
  *   Mayor Initials
  *   *Review Date: First Monday of every quarter.*

  **Final Instruction:**
  Print this. Put it in a binder. When a proposal hits your desk, open the binder. If the proposer hasn't filled out Steps 1-3, hand them the pen and tell them to come back in 30 minutes. This forces *them* to do the rationalization work, which often makes them quit the proposal before it reaches you.
