answer: |-
  The impasse persists because the two sides are employing incompatible conceptions of the target of rational evaluation: one side evaluates the agent as a diachronic planner subject to pragmatic consistency, while the other evaluates the agent as a synchronic believer subject to evidential fit.

  The dialectical pattern you observe—restrictions met by accusations of ad hocery—arises because the defender is trying to preserve Reflection as a norm for *plans* (where Dutch strategies bite), while the critic is testing it as a norm for *beliefs* (where evidential support matters). Regarding your four sub-questions: First, the "no-loss" assumption is not smuggled in; it is the explicit boundary condition required for the prudential argument to function, marking the difference between a learning agent and a malfunctioning one. Second, the betting side is doing independent work, but only for the planner-conception; the sure loss verdict applies to the agent as a persisting entity, proving that the *policy* was imprudent, not that any specific time-slice held an irrational belief. Third, the two communities are indeed counting different things as evidence, but not merely in a sociological sense; the formalists treat coherence theorems as data for prudential rationality, while the epistemologists treat intuitions about cases as data for epistemic rationality, and neither dataset validates the other's normative domain. Fourth, there is a hidden formal question, but it is not about martingales; it is whether Reflection can be formulated over centered propositions without collapsing into triviality, which determines whether the "persisting entity" model of the agent can survive self-locating uncertainty.

  I reject the diagnosis that this is purely verbal, that it is merely about idealization gaps, or that it is solely an information-theoretic confusion. The verbal diagnosis fails because the stakes are normative: both sides want to know what an agent *ought* to do, not just how to define terms. The idealization diagnosis fails because the counterexamples (like forgetting) are not just about cognitive limits but about structural features of evidence access that persist even in ideal agents. Your information-theoretic hypothesis is the strongest competitor, but it ultimately misidentifies the category of the principle. You suggest the disagreement is about whether rationality permits lossy updates, treating Reflection as a descriptive claim about signal fidelity. This is incorrect because Reflection is invoked as a *constraint* on rationality, not a description of information flow. If it were merely information-theoretic, violating it would be like having a noisy channel—not irrational, just inefficient. The debate is heated precisely because violations are treated as *irrational* by one side and *permissible* by the other.

  Your sufficient-statistic reading fails most clearly on cases of **known self-locating shift** (e.g., Sleeping Beauty scenarios) where no information is lost or added in the standard sense, yet credences rationally shift. On your reading, this should be a case of "compression" or "coordinate change," but it resists the sufficient-statistic model unless "evidence" is redefined to include indexical facts, which begs the question against the critic who denies indexicals are evidence in the relevant sense. A defender of Reflection would most effectively break your reading by arguing that once propositions are properly centered, the statistic *is* sufficient, thereby showing that your diagnosis collapses into the verbal disagreement I rejected earlier: it solves the problem by stipulating the definition of evidence rather than resolving the normative conflict.

  Progress requires drawing a sharp distinction between **Pragmatic Reflection** (a constraint on binding plans for future action) and **Epistemic Reflection** (a constraint on current belief based on expected future evidence). We should stop trying to derive the epistemic norm from the pragmatic Dutch Book argument. A formal result settling the centered-proposition question would help, but the real advance would be acknowledging that an agent can be prudentially required to bind themselves against their own future rational beliefs (if they know they will be weak-willed) without those future beliefs being epistemically suspect. We should expect no further progress on the current terms because the question "Is Reflection true?" conflates two distinct questions: "Is it profitable to plan as if Reflection holds?" and "Is it true that my future belief screens off my current evidence?"
