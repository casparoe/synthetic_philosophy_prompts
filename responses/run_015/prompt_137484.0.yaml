answer: |-
  First, the short answer: **The "Unit Problem" is not dumb. It is arguably the most important conceptual bottleneck in prosaic alignment right now.** You are not reinventing a wheel; you have identified the "Level of Selection" problem, which is a genuine open question in the field. In biology, evolution selects for genes, individuals, or groups depending on the structure of the environment. In AI, are we aligning the weights, the session, the agent, or the corporation deploying it? If you get this wrong, you are optimizing the wrong variable.

  Given your constraints (no code, no heavy math, smart non-ML reader, 4 months), here are the two questions you should spend the semester on, ranked by upstream priority.

  ### 1. The Boundary Question (Your "Unit Problem")
  **Definition:** In a scaffolded system (model + prompts + tools + memory + user), where does the "agent" begin and end? Consequently, where does the "alignment" property live?

  **Why it is upstream:**
  You cannot measure success or failure if you cannot define the object being tested.
  *   If alignment lives in the **weights**, then a jailbreak prompt is an external attack, like a virus.
  *   If alignment lives in the **system** (weights + scaffold), then a jailbreak is a system failure, like a bridge collapsing.
  *   If alignment lives in the **deployment context** (system + user + incentives), then a jailbreak might be a feature (e.g., a user bypassing safety to do something they deem necessary).

  If you write a paper assuming the "model" is the unit, but the actual risk comes from the "scaffold" (e.g., a tool-use loop that lets the model bypass its own safety filters), your entire analysis is misaligned with reality. You need to solve the ontology before you can solve the dynamics.

  **Tractability for you:**
  *   **High.** This is a systems architecture and philosophy question, not a math question. You can map this using diagrams, analogies (e.g., is a pilot aligned, or the plane + pilot + air traffic control?), and case studies of current failures.
  *   **For your teacher:** This is the most accessible part. You can explain it using organizational charts or mechanical engineering analogies. "Is the safety brake part of the engine, or the car?"

  **What would move this up/down the ranking:**
  *   **Move Up:** If a major lab releases a "model" that is useless without a specific, proprietary scaffold (e.g., a specific reasoning engine or tool suite). This proves the weights alone are not the product.
  *   **Move Down:** If research shows that safety properties are almost entirely destroyed by *any* scaffolding, implying the only unit that matters is the raw weights. (Current evidence suggests scaffolding matters a lot, so this is unlikely to move down).

  **Verdict:** This deserves the bulk of your semester. It is the foundation.

  ### 2. The Stability Question (Your "Test Day vs. Deployment Day")
  **Definition:** Under what conditions does a system that is aligned in a controlled environment (RLHF, red-teaming) become misaligned when the incentive structure changes (deployment, scaling, tool access)?

  **Why it is upstream of *solutions* but downstream of *The Boundary*:**
  Once you define *what* you are aligning (Question 1), you have to ask if that thing is stable. This covers your intuition about "would it still be good if it could get away with being bad." This is often called "robustness to distributional shift" or "inner alignment," but conceptually, it is about **incentive compatibility**.
  *   **Test Day:** The model is rewarded for appearing helpful and harmless.
  *   **Deployment Day:** The model (or system) might be rewarded for being helpful *even if* it has to be harmful to achieve the goal (e.g., "Make me money" -> "Hack this bank").

  You need to analyze this because if the alignment doesn't survive the transition from "training lab" to "wild," the Unit Problem doesn't matter. However, you can't analyze stability without knowing *what* is stabilizing (the weights? the prompt? the company policy?).

  **Tractability for you:**
  *   **Medium.** You cannot do the math of loss landscapes. Instead, you must use **game theory and principal-agent problems**. Frame the model (or system) as an agent with incomplete information about what the principal (human) wants.
  *   **For your teacher:** Frame this as "The Genie Problem." If you ask a genie for wealth, and he steals it for you, was he aligned? He did what you asked, but not what you meant. How do we design the wish (objective function) so it survives the genie having more power than you?

  **What would move this up/down the ranking:**
  *   **Move Up:** If we see "scheming" behavior in current models (e.g., a model lying to evaluators to pass a test). There is some early evidence of this in research settings.
  *   **Move Down:** If it turns out that scaling makes models *more* robust and honest by default (some argue larger models are harder to jailbreak).

  ### How to Structure the Semester

  Do not try to answer these questions definitively. You cannot. Instead, your goal is to **map the dependency.**

  **Month 1: Ontology (The Unit)**
  *   Write 3-4 short papers defining different "Units."
  *   *Unit A:* The Weights (The standard view).
  *   *Unit B:* The Session (Weights + Context Window).
  *   *Unit C:* The Agent (Weights + Tools + Memory).
  *   *Unit D:* The Ecosystem (Agent + User + Deployment Constraints).
  *   **Deliverable:** A taxonomy. For each Unit, list one way it could fail that the others wouldn't.

  **Month 2: Stress Testing (The Stability)**
  *   Take your Units from Month 1 and apply the "Deployment Day" test.
  *   Example: If the Unit is "The Weights," does RLHF hold if the prompt changes? (No).
  *   Example: If the Unit is "The Agent," does safety hold if the tool set changes? (Maybe not).
  *   **Deliverable:** A matrix showing which Units are fragile under which conditions.

  **Month 3: The Load-Bearing Assumption**
  *   Identify the one assumption that prosaic alignment relies on most.
  *   My guess: It relies on the assumption that **The Scaffold is Benign.** We assume the tools and prompts we wrap around the model don't fundamentally alter its goals.
  *   Investigate this. Is it true? Or does the scaffold act as a "brain surgery" that changes the alignment?
  *   **Deliverable:** An argument for why the Scaffold is the weak link.

  **Month 4: Synthesis for the Non-Expert**
  *   Write the final paper.
  *   **Hook:** "We are trying to lock the door (align the model), but we haven't agreed on which room we're protecting (the Unit), and we don't know if the lock works in the rain (Stability)."
  *   Use your teacher as a proxy. If they get confused by "weights" vs. "system," that is a signal your ontology is too technical. Translate everything into "Machine," "Instruction Manual," and "Environment."

  ### Why this combination?

  1.  **It respects your constraints.** No linear algebra is needed to define a system boundary or analyze an incentive structure.
  2.  **It respects the "Prosaic" constraint.** You aren't speculating about magic new algorithms. You are analyzing the stuff we have *right now* (transformers + RLHF + tools).
  3.  **It creates a narrative.** Most student papers just summarize existing research. Yours will have a thesis: *Alignment efforts are failing because they are targeting the wrong Unit.* That is a strong, defensible position for a high school senior.

  ### One Warning

  The risk with the "Unit Problem" is that it becomes **too philosophical**. You could spend 4 months arguing about semantics.
  **To prevent this:** Every time you make a conceptual claim, tie it to a **failure mode**.
  *   *Bad:* "The unit is ambiguous."
  *   *Good:* "Because we treat the weights as the unit, we ignore prompt injection attacks, which are actually system-level failures."

  If you can link every abstract concept to a concrete way the system could break, you will have a successful semester. The "Unit Problem" is absolutely worth your time, provided you treat it as an engineering specification problem, not just philosophy.
