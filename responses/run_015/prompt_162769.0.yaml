  Here's a thinking process that leads to the suggested specification:

  1.  **Analyze the Request:**
      *   **User Role:** Technical review panel member for funding field trials of genetically engineered organisms (GEOs) for vector control/pest suppression.
      *   **Problem:** Proposals argue *benefit* at the gene/construct level (spread, drive) but assess *risk* at the population/ecosystem level (persistence, collapse). There's a mismatch in levels of analysis. When predictions diverge, there's no principled way to decide what to bet on or what to monitor.
      *   **Task:** Write a *specification* for a theory of units of selection.
      *   **Goal:** The theory must be adequate for *planning and auditing deliberate releases* into evolving systems. It needs to be actionable for regulators, not just philosophically sound.
      *   **Required Cases/Considerations:**
          1.  Selfish construct causing group extinction (gene vs. group expectation).
          2.  Engineered symbiont with horizontal transfer (non-tree-like heredity).
          3.  Kin selection vs. Group selection equivalence (relatives in groups).
          4.  Niche construction (organism modifies environment).
          5.  Changing unit status (loss of independent reproduction over time).
          6.  Testability/Non-retrofitting (committing to measurements *before* outcomes).
      *   **Constraints:**
          *   Keep adequacy tied to the regulatory purpose throughout.
          *   Distinguish non-negotiable requirements vs. camp preferences.
          *   Clarify distinctions (replicator/interactor, selection of/for, etc.).
          *   Flag internal inconsistencies if requirements cannot be jointly satisfied.
          *   Identify the single most exclusionary requirement.
          *   End with a short scoring table (Gene-level, MLS, Inclusive Fitness).
          *   **NO** literature review, reading list, or citations.
          *   **Tone:** Regulatory specification, clear to a non-population geneticist.

  2.  **Deconstruct the Purpose:**
      *   This isn't about truth in the abstract; it's about *risk management* and *predictive power* in a specific context (GEO release).
      *   The theory must tell regulators *what to measure* and *what to worry about* before the release happens.
      *   It must prevent "just-so stories" after the fact.

  3.  **Drafting the Requirements (Iterative Process):**

      *   *Case 1: Selfish Construct/Group Extinction.*
          *   *Issue:* Gene drives spread but kill the host population. Gene theory says "spread." Group theory says "extinction."
          *   *Requirement:* The theory must predict the *trajectory of the risk variable* (population size), not just the *frequency of the construct*.
          *   *Status:* Non-negotiable. If it can't predict extinction risk, it's useless for safety.
          *   *Distinction:* Selection *of* the gene vs. Selection *for* the trait in the population context.

      *   *Case 2: Symbionts/Horizontal Transfer.*
          *   *Issue:* No clear parent-offspring tree. Who is the unit?
          *   *Requirement:* The theory must define the unit functionally by *inheritance fidelity* and *fitness variance*, not by taxonomy. It must handle networks, not just trees.
          *   *Status:* Non-negotiable. Many GEOs are symbionts (e.g., Wolbachia).
          *   *Distinction:* Replicator vs. Interactor.

      *   *Case 3: Kin vs. Group Equivalence.*
          *   *Issue:* Mathematically equivalent models. Which one guides monitoring?
          *   *Requirement:* The theory must specify which *measurements* distinguish the mechanisms, even if outcomes are identical. Or, it must admit equivalence and demand monitoring of *both* relatedness and group variance.
          *   *Status:* Preference/Pragmatic. If outcomes are identical, maybe it doesn't matter? But for *intervention*, mechanism matters. Let's make it a requirement for *intervention leverage*.
          *   *Distinction:* Causal claim vs. Bookkeeping.

      *   *Case 4: Niche Construction.*
          *   *Issue:* Environment isn't fixed.
          *   *Requirement:* The theory must treat environmental variables as dynamic state variables coupled to population density/trait frequency.
          *   *Status:* Non-negotiable for field trials.
          *   *Distinction:* Fixed background vs. Dynamic feedback.

      *   *Case 5: Changing Unit Status (Major Transitions).*
          *   *Issue:* Units merge (e.g., cells to multicellular).
          *   *Requirement:* The theory must allow the "unit" definition to be time-indexed.
          *   *Status:* Non-negotiable for long-term monitoring.
          *   *Distinction:* Unit as given vs. Unit as emergent/changing.

      *   *Case 6: Testability/Pre-commitment.*
          *   *Issue:* Retrofitting explanations.
          *   *Requirement:* The theory must generate *falsifiable predictions* about variance partitioning *before* data collection.
          *   *Status:* Non-negotiable. This is the core of the regulatory need.
          *   *Distinction:* Causal claim vs. Post-hoc decomposition.

  4.  **Addressing Internal Conflicts:**
      *   *Conflict:* Maximal Generality (Case 2 & 5) vs. Testability (Case 6).
      *   *Resolution:* A theory that handles *everything* (horizontal transfer, changing units, niche construction) often becomes so complex it requires data we can't get in a 2-year window.
      *   *Flag:* This is a critical tension. We might have to sacrifice generality for auditability. I need to flag this explicitly as requested.

  5.  **Identifying the "Killer" Requirement:**
      *   Which one kills the most popular theories?
      *   Likely Case 6 (Pre-commitment/Testability). Many philosophical theories are post-hoc descriptive frameworks. Gene-selectionism often ignores group consequences (Case 1). Inclusive fitness struggles with horizontal transfer (Case 2).
      *   Actually, Case 1 (Predicting Risk Trajectories) is probably the most exclusionary for standard Gene-Centered views which focus on allele frequency, not population viability. But Case 6 is the methodological killer. Let's go with Case 6 because it demands *operationalization*, which abstract theories hate.

  6.  **Drafting the Content (incorporating constraints):**
      *   *Tone:* Formal, directive, clear.
      *   *Structure:* Introduction -> Requirements (Case, Specification, Status, Distinctions) -> Conflict Flag -> Exclusionary Requirement -> Scoring Table.
      *   *Avoid:* Academic jargon where possible, or define it. No citations.

  7.  **Refining the Distinctions:**
      *   *Replicator/Interactor/Beneficiary:* Crucial for Case 2.
      *   *Selection Of/For:* Crucial for Case 1.
      *   *Causal/Bookkeeping:* Crucial for Case 3.
      *   *Unit of Selection/Bearer of Adaptation:* Crucial for Case 5.

  8.  **Review against Constraints:**
      *   Did I cover all 6 cases? Yes.
      *   Is it tied to regulatory purpose? Yes (monitoring, risk, prediction).
      *   Did I flag conflicts? Yes (Generality vs. Testability).
      *   Did I name the exclusionary requirement? Yes.
      *   Is there a table? Yes.
      *   No citations? Yes.

  9.  **Final Polish:**
      *   Ensure the language sounds like a specification document ("The theory must...", "Requirement X").
      *   Make sure the "Non-negotiable" vs "Preference" tags are clear.
      *   Check the scoring table for fairness (it's a summary, not the main point).

  *(Self-Correction during drafting)*: I initially thought about making Case 3 (Kin vs Group) non-negotiable. However, if the math is truly equivalent, demanding a distinction might be scientifically dishonest. The regulatory need is to know *where to intervene*. If I break up groups, does it stop spread? If I reduce relatedness, does it stop spread? The theory needs to tell me which lever works. So the requirement is about *intervention leverage*, not ontological truth. I will phrase it that way.

  *(Self-Correction on Conflict)*: The prompt asks to flag if requirements are jointly unsatisfiable. The tension between "Handle complex biological reality (HGT, niche construction)" and "Be testable in 2 years with noisy data" is real. I must state that a theory satisfying all might be *too complex to audit*. I will flag this as a "Feasibility Trade-off."

  *(Final check on the "Killer" requirement)*: The prompt asks for the single requirement that does the most work in excluding otherwise popular theories. Pre-commitment to measurements (Case 6) is strong, but the requirement to predict *population viability* despite *gene spread* (Case 1) is the specific pain point of the user. However, Case 6 is what prevents *any* theory from weaseling out. I'll stick with Case 6 (Testability/Pre-commitment) as the methodological gatekeeper, but acknowledge Case 1 is the substantive gatekeeper. Actually, the prompt asks for *one*. I will choose Case 6 because it invalidates post-hoc rationalizations which is the core complaint ("retrofitted to some level").

  Let's write.

