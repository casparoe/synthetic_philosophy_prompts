prompt: |-
  I'm a PhD student in moral philosophy and I'm trying to nail down what people actually mean when they say "people in glass houses shouldn't throw stones" in debates about hypocrisy and standing to blame. I heard it used recently when someone called out a colleage for missing grant deadlines while being chronically late themselves — the reply was essentially that slogan, and it seemed to shut down the criticism entirely. But I'm not sure what work it's doing. Could you lay out the different precise claims it might stand for? For instance: is it about forfeiting moral standing because you're guilty of the same vice? Is it an epistemic claim that you can't reliably judge others if you're flawed? Is it about the expressive meaning of blame being undermined when the speaker is tainted? Or is it a practical point about lacking authority to advise? For each, say whether it's plausible and whether it actually gets the speaker off the hook in that kind of workplace case. There's also a twist I'm playing with: what if the blame is about a professional role-specific failure (missing grant deadlines) and the speaker's matching flaw is purely personal (being late to dinner)? Does the slogan still apply, or does it depend on domain-matching? I want a menu of readings, not just one, and please flag which ones can handle that domain-sensitivity and which ones collapse it. Please write your answer in British English.
