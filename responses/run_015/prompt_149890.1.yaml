      *   **Topic:** The meaning and function of the proverb "people in glass houses shouldn't throw stones" in the context of hypocrisy and standing to blame.
      *   **Specific Scenario:** A colleague calls out another for missing grant deadlines; the accused retorts that the accuser is chronically late (personal/professional ambiguity to be explored).
