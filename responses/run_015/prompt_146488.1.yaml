  3.  **Identify the Philosophical Core:**
      *   This is the classic **Causal Exclusion Argument** (often associated with Jaegwon Kim).
      *   The tension is between **Supervenience**, **Causal Closure of the Physical**, and **Mental Causation**.
      *   The argument assumes that if $P$ causes $P^*$, and $M$ supervenes on $P$, then $M$ cannot cause $M^*$ (or $P^*$) without overdetermination.
      *   The specific "slip" usually lies in the definition of *causation* and the relationship between *levels of description* vs. *levels of reality*.

