answer: |-
  It is entirely understandable that you find the seminar's reliance on the slogan frustrating. In the literature, 'truth is what works' is less a precise thesis and more a philosophical Rorschach test; it invites projection. The confusion in your seminar stems from conflating a *criterion* for truth (how we recognise it) with a *definition* of truth (what it consists in), and from eliding the significant differences between Peirce's scientific realism and James's more radical humanism.

  Below is a menu of five distinct theses the slogan might be asserting, ordered from the trivial to the false. Following that, I have set out the payoff regarding your two test cases and the divergence between Peirce and James.

  ### The Menu of Interpretations

  #### 1. The Epistemic Criterion Reading
  *   **What 'works' means:** Practical success in prediction and intervention; coherence with existing knowledge.
  *   **Whose purposes/Timescale:** Any inquirer; short to medium term.
  *   **Type of Claim:** **Epistemic/Normative.** It claims that 'working' is the reliable *sign* or *test* of truth, not the *essence* of truth.
  *   **Verdict:** **Trivial / Defensible.** Almost any realist can accept that true beliefs tend to work, without agreeing that truth *consists* in working.
  *   **Proponents' Intent:** This is often what careful philosophers mean when they use the slogan loosely, though it surrenders the distinctively pragmatist metaphysical claim.
  *   **Scrutiny:** It survives scrutiny easily but fails to satisfy the pragmatist urge to naturalise truth. It leaves the 'nature of truth' question open (e.g., truth could still be correspondence).

  #### 2. The Peircean Counterfactual Realism
  *   **What 'works' means:** Survival under indefinitely prolonged scientific inquiry; resistance to doubt.
  *   **Whose purposes/Timescale:** The community of investigators; the ideal limit (indefinite future).
  *   **Type of Claim:** **Metaphysical / Nature of Truth.** Truth is *defined* as the opinion fated to be agreed upon by all who investigate sufficiently.
  *   **Verdict:** **Contentious but Defensible.** It attempts to reconcile realism (there is a reality constraining us) with an epistemic definition.
  *   **Proponents' Intent:** This is the charitable reading of Peirce. He intends to define truth without appealing to a 'thing-in-itself' inaccessible to signs.
  *   **Scrutiny:** It relies on the optimistic induction that inquiry *will* converge. It struggles if convergence is caused by shared cognitive limitations rather than reality.

  #### 3. The Jamesian Verificationism
  *   **What 'works' means:** Experiencing no practical difference; 'cash-value' in terms of sensory or moral experience.
  *   **Whose purposes/Timescale:** The individual believer; the span of a human life (or whenever the consequences play out).
  *   **Type of Claim:** **Semantic / Meaning.** A proposition has no truth value (or meaning) unless believing it makes a tangible difference to experience.
  *   **Verdict:** **Contentious / Radical.** It collapses the distinction between 'true' and 'warrantedly assertible'.
  *   **Proponents' Intent:** This captures James's impatience with metaphysical abstractions that lack human relevance.
  *   **Scrutiny:** It faces the 'dead language' problem acutely. It risks making truth too subjective or temporal.

  #### 4. The Warranted Assertibility Reading (Deweyan)
  *   **What 'works' means:** Solving a problematic situation; restoring equilibrium to inquiry.
  *   **Whose purposes/Timescale:** The community of inquirers; the duration of the specific inquiry.
  *   **Type of Claim:** **Deflationary / Normative.** 'Truth' is not a property of propositions but a status of claims that have survived rigorous testing. There is no 'nature of truth' to theorise about beyond this.
  *   **Verdict:** **Defensible.** It avoids the metaphysical baggage of Peirce's 'limit' and James's 'expediency'.
  *   **Proponents' Intent:** Often what later pragmatists (like Putnam or Rorty) reach for when defending the tradition against realist critiques.
  *   **Scrutiny:** It changes the subject. Realists argue it explains *assertibility* but leaves *truth* unexplained.

  #### 5. The Crude Instrumentalist Reading
  *   **What 'works' means:** Immediate gratification, psychological comfort, or social utility.
  *   **Whose purposes/Timescale:** The individual; the present moment.
  *   **Type of Claim:** **Metaphysical / Nature of Truth.** A belief is true simply if holding it is beneficial to the holder.
  *   **Verdict:** **Plainly False.** This is the standard caricature of pragmatism.
  *   **Proponents' Intent:** Rarely held by serious philosophers; usually a straw man erected by critics (or misunderstood by undergraduates).
  *   **Scrutiny:** Fails immediately. A comforting delusion (e.g., 'I will win the lottery') works psychologically but is not true.

  ---

  ### The Payoff: Application to Your Cases

  Here is how each reading handles the 'dead language' sentence and the 'cognitive blind spot'.

  | Reading | Dead Language Case (Inaccessible Truth) | Blind Spot Case (Systematic Error) |
  | :--- | :--- | :--- |
  | **1. Epistemic Criterion** | **Denies classmate's conclusion.** The sentence has a truth value (correspondence to fact), but we lack the *criterion* to identify it. Truth exceeds our grasp. | **Denies forced verdict.** The false hypothesis is believed, but it is not *true*. Our tools are faulty, but truth remains independent. |
  | **2. Peircean Realism** | **Ambiguous.** If inquiry *could* reach it (counterfactually), it is true. If it is *in principle* inaccessible, Peirce might call it indeterminate or meaningless. | **Forces the verdict.** If the blind spot is ineliminable for *any* possible inquirer, then the 'limit of inquiry' is the false hypothesis. By definition, that becomes the truth. This threatens Peirce's realism. |
  | **3. Jamesian Verificationism** | **Delivers classmate's conclusion.** If the sentence makes no practical difference to any experience, it lacks 'cash-value'. There is no fact of the matter. | **Forces the verdict.** If the false hypothesis is the one that is expedient for us to believe (because we can't access the other), then for us, it *is* true. |
  | **4. Warranted Assertibility** | **Delivers classmate's conclusion (functionally).** To call it 'true' adds nothing to calling it 'unwarranted'. The predicate 'true' drops out of use. | **Forces the verdict.** Truth is idealised justification. If we are justified (due to the blind spot) in believing the false hypothesis, it is 'true' in the only sense that matters. |
  | **5. Crude Instrumentalism** | **Delivers classmate's conclusion.** It doesn't work for anyone, so it isn't true. | **Forces the verdict.** If the false belief makes us happier or functions better socially, it is true. |

  ### Peirce and James: One Doctrine or Two?

  Disambiguating the slogan reveals that Peirce and James are **genuinely different views travelling under the same slogan.**

  **Peirce** is operating primarily with **Reading 2 (Counterfactual Realism)**. He is a realist who believes reality exerts a brute constraint on inquiry. For Peirce, 'what works' means 'what survives the friction of reality over the long run'. He would likely reject your classmate's conclusion on the dead language case if he believed the truth was *in principle* discoverable (e.g., by a metaphysical deduction or a time-traveller), even if not *actually* discovered. On the blind spot case, Peirce would likely argue that a 'blind spot' shared by all investigators is a contradiction in terms for a realist; if reality exists, it must eventually break through our biases. If it doesn't, his theory collapses into idealism.

  **James** is operating primarily with **Reading 3 (Verificationism)** mixed with **Reading 4 (Normative)**. He is less concerned with the 'limit of inquiry' and more with the 'life of the believer'. For James, truth is made in the course of experience. He would happily endorse your classmate's conclusion: if a proposition makes no difference to the 'stream of experience', calling it 'true' is an empty metaphysical gesture. On the blind spot case, James is more willing to accept that truth is relative to our cognitive equipment, because for James, truth is a relation between an idea and a life, not an idea and a mind-independent world.

  **Conclusion for your paper:**
  The slogan 'truth is what works' is a category mistake if used without qualification. It conflates the *consequences* of truth (Reading 1) with the *constitution* of truth (Readings 2 & 3). Your classmate's move is valid only on the Jamesian/Verificationist reading, not the Peircean one. The 'blind spot' objection is fatal to Peirce only if one assumes his 'limit of inquiry' is an empirical prediction rather than a regulative ideal. If it is a regulative ideal, he can maintain that a 'true' blind spot is impossible by definition, though this risks making his realism circular.

  In short: Peirce saves truth from being merely 'what works for us' by appealing to an ideal future; James saves 'what works for us' from being merely subjective by appealing to the shared constraints of experience. They are not saying the same thing.
