answer: |-
  (a) The escape is unstable because the agent's current refusal relies on a prediction that their future self will act against their own local preferences at later nodes, yet no binding mechanism exists to enforce this. Since the future self retains the cyclic preferences that motivate trading, the anticipated refusal is not incentive-compatible at the later node.

  (b) Dynamic consistency over plans requires that a preference for a sequence held at the start remains held at later nodes, whereas consistency over choices requires only that actions match prior predictions of those actions. A sophisticated agent is consistent in choices because they accurately predict their future deviations, but inconsistent in plans because their ranking of complete trajectories changes as nodes are reached.

  (c) To establish transitivity itself, the argument must premise that rationality requires choices to be determined solely by local preferences at each node rather than by global strategies. Without assuming that agents are prohibited from using backward induction or resolution, the pump demonstrates only that naivety is costly, not that the underlying preferences are flawed.

  (d) Resolute choice allows the decision at a node to depend on the initial plan adopted, whereas sophisticated choice restricts dependence to predictions of future local preferences. Accordingly, resolute choice gives up the principle of separability, which holds that choices at a node should depend only on the subtree of consequences available from that point forward.

  (e) The money pump is better read initially as an argument that certain diachronic choice strategies are self-defeating, since avoiding the loss requires adopting controversial decision principles like resolution. To move to the first reading, one must show that the principles violated by such avoidance, such as separability, are more fundamental to rationality than the permission to maintain cyclic preferences.
