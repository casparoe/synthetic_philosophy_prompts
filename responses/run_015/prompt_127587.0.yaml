  1. The stone insists we keep its cold record,
  A weight of names that presses on the breath.
  We stand as guardians of the injured word,
  Bound by a debt that survives after death.
  The ledger opens, demanding to be read,
  Where past injustices are never dead.
  This stanza establishes the archive's moral claim upon the present, reflecting Margalit's ethics of shared memory wherein the past demands fidelity from the living.

  2. Yet culture whispers softly to release,
  To heal the spirit by untying knots.
  We seek a peace that offers some surcease,
  And treat the haunting memory as decay.
  The self demands a future unconfined,
  By casting off the shackles of the mind.
  Here the therapeutic pressure to dissolve painful memory is introduced, echoing Rieff's analysis of a culture that prioritises present well-being over historical fidelity.

  3. But who sustains the sorrow of the file?
  The curator bears burden of the pain.
  Archival grief wears down the human smile,
  A labour spent to keep the wound quite plain.
  To hold the truth requires a weary heart,
  Where moral fidelity plays its part.
  This section exposes 'archival grief' as the concealed emotional cost exacted by the institutional labour of sustaining moral attention to past injuries.

  4. It is not denial, but choice to fade,
  Active unmemorising, calmly done.
  A conscious path that we have now surveyed,
  To stop the echo lasting far too long.
  We lay the duty down with careful hands,
  And free ourselves from past commanding bands.
  The concept of 'active unmemorising' is articulated here as an ethically deliberate release from mnemonic duty, distinct from simple omission or negation.

  5. So neither full remembrance nor forget,
  But hold the tension in a steady hand.
  The debt is real, the need for peace is met,
  Upon this fractured and divided land.
  We live within the question, not the cure,
  Where memory and forgetting both endure.
  The final stanza holds both positions in irreducible suspension, refusing to resolve the ethical aporia between the duty to remember and the need to live.
