prompt: |-
  I teach an undergraduate seminar on democracy and collective choice in a politics department: 18 students, one 75-minute session, mixed preparation (roughly a fifth have had a little game theory, the rest none), a whiteboard and index cards but no projector. I want a runnable activity in which the students discover for themselves that they cannot design an aggregation rule under which nobody ever has an incentive to misreport their ranking. No opening lecture and no mention of the Gibbard–Satterthwaite theorem or its statement until the debrief.

  Here is the setup I have in mind, which you should use or improve on. Round zero: each student privately ranks four genuinely live alternatives (say, four ways to spend a small leftover departmental budget for the class — a real, if trivial, stake), seals that ballot in an envelope as their sincere ranking, and the facilitator keeps it. Then three or four rounds in which the class proposes any rule they can state in under two minutes, votes under it, and sees the result. Between rounds they may rewrite the rule entirely. Each voter sees only the previous round's published tally of ballots, never who submitted what, and may vote however they like. The facilitator then computes, from the sealed sincere ballots, what the same rule would have produced had everyone voted sincerely, and the class sees who gained by misreporting and who lost by staying honest.

  Three things matter to me. First, the last twenty minutes should be spent testing escape routes rather than describing them: cut the alternatives to two, or make preferences single-peaked along an ordering the class imposes, or select a ballot at random and take its top choice, or let people report intensities and compensate losers with side payments. Each should be tried on the spot so the class feels what it costs. Second, I want at least one round arranged so that sincere voting under the students' own rule picks an outcome the group agrees is worse than what misreporting would have produced, so they have to confront whether strategy-proofness is even a desideratum rather than assuming it is. Third, the debrief has to map moments onto the theorem's conditions — at least three alternatives, a single deterministic winner, respect for unanimity, no dictator, and an unrestricted domain of rankings — and be frank about what the activity cannot show: a handful of profiles is not a quantifier over all profiles, and success was measured against each student's own sincere ranking rather than against cardinal utility, so the proof itself has to be supplied in words.

  Give me the activity as I would run it: materials, the exact scripts and tally sheets, the round-by-round timeline, the debrief, and an honest note on what will predictably go wrong (students treating round zero strategically, the real stake being too small to care about, someone proposing a rule nobody can compute by hand). Finally, tell me where you are least confident: flag any formal claim you are unsure of, particularly what strategy-proofness amounts to once the rule is allowed to randomize and how far the class of strategy-proof randomized rules extends beyond random dictatorship, which claim you would want a social choice theorist to check before I run this, and which part of the session you would pilot first.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**

      *   **Context:** Undergraduate seminar, Politics Dept, 18 students, 75 mins, mixed game theory background (mostly none).
      *   **Resources:** Whiteboard, index cards, envelopes. *No projector.*
      *   **Goal:** Students discover the impossibility of strategy-proof aggregation (Gibbard-Satterthwaite intuition) without prior lecture.
      *   **Specific Setup:**
          *   Round 0: Private sincere ranking of 4 alternatives (real stake: budget). Sealed envelopes.
          *   Rounds 1-3+: Class proposes rules, votes, sees results. Compare reported vs. sincere outcome.
          *   Last 20 mins: Test "escape routes" (2 alternatives, single-peaked, random dictatorship, cardinal/side payments).
          *   Requirement 2: At least one round where sincere voting leads to a *Pareto inferior* outcome compared to strategic voting (to challenge the value of strategy-proofness).
          *   Requirement 3: Debrief must map to GS conditions (3+ alts, deterministic, unanimity, non-dictator, unrestricted domain) and acknowledge limitations (finite profiles, ordinal vs. cardinal).
      *   **Deliverables:** Materials, scripts, tally sheets, timeline, debrief, "what could go wrong," and "least confident/needs expert check" section.

  2.  **Evaluate the Proposed Setup & Identify Risks:**

      *   *Risk 1: Complexity of Calculation.* The instructor has to compute the "sincere outcome" vs. "reported outcome" live for 18 students across multiple rounds without a projector/spreadsheet. This is a logistical nightmare. If the instructor takes 10 minutes to calculate Borda counts for 18 ballots, the lesson dies.
      *   *Risk 2: The "Real Stake".* A small departmental budget for a class might be too abstract or too small to motivate strategic lying in a 75-minute class. Students might just vote sincerely anyway, making the "discovery" of manipulation fail.
      *   *Risk 3: Rule Proposal.* 18 undergraduates with no game theory might propose unworkable rules (e.g., "maximize happiness") that can't be tallied quickly.
      *   *Risk 4: The "Pareto Inferior" Requirement.* Designing a scenario where sincere voting yields a worse outcome than strategic voting *under the students' own rule* is tricky. Usually, strategic voting helps the *manipulator*, not necessarily the *group*. To show the group loses, we need a Prisoner's Dilemma dynamic (e.g., everyone strategizes and ends up worse off).
      *   *Risk 5: Time.* 75 minutes is very tight for Round 0 setup + 3 voting rounds + 4 escape route tests + Debrief.

  3.  **Refine the Activity Design (Iterative Process):**

      *   *Modification 1 (Logistics):* Instead of the instructor calculating everything live, use a "Tally Team" of 3 students who are excused from voting or rotate. Or, simplify the ballots. Let's stick to the instructor calculating but simplify the counting method (Plurality is easiest, Borda is better for showing manipulation). Let's suggest Plurality first (easiest to manipulate), then Borda.
      *   *Modification 2 (The Stake):* Make the stake immediate. Candy? Extra credit? (Ethical issues with extra credit). Let's stick to the budget but make the options distinct (Pizza vs. Books vs. Charity vs. Party).
      *   *Modification 3 (The "Pareto Inferior" Round):* This is the hardest part. To show the *group* loses, we need a situation where strategic voting leads to a Condorcet Loser or a cycle. A better approach for the specific requirement ("sincere voting... picks an outcome the group agrees is worse than what misreporting would have produced") is to frame it as: "If everyone votes sincerely, X wins. If everyone strategizes against X, Y wins. Most prefer Y." This requires a specific preference profile. *Correction:* The prompt asks for *one round arranged* so this happens. I need to engineer the preference profile or the rule. Actually, the prompt says "sincere voting under the students' own rule picks an outcome the group agrees is worse than what misreporting would have produced." This implies the *result* of sincere voting is Pareto dominated by the *result* of strategic voting. This is rare in standard voting (usually strategic voting helps the manipulator at the expense of others).
      *   *Wait, re-reading Requirement 2:* "so they have to confront whether strategy-proofness is even a desideratum." Ah, the point is that sometimes strategy *improves* efficiency. If sincere voting leads to a bad outcome (e.g., vote splitting), and strategic voting (compromise) leads to a better outcome, then strategy-proofness might prevent efficiency. I need to ensure the rule allows for this (e.g., Plurality with vote-splitting).
      *   *Modification 4 (Escape Routes):* Testing 4 escape routes in 20 minutes is tight. 5 mins each. Random Dictatorship is fast. 2 Alternatives is fast. Single-peaked needs setup. Side payments is hard to do live. I should prioritize the feasible ones.
      *   *Modification 5 (Calculation Load):* I need to explicitly tell the instructor to pre-code the sincere ballots or have a TA help. Doing 18x4 rankings live is impossible. *Decision:* The instructor must collect Round 0, then *during the first break or while students discuss rules*, the instructor (or a trusted helper) transcribes the sincere ballots into a master sheet. The "Reveal" happens later.

  4.  **Drafting the Plan - Section by Section:**

      *   **Materials:** Index cards (ballots), Envelopes, Whiteboard markers, Tally Sheet template.
      *   **Timeline:**
          *   0-10: Setup & Round 0 (Sincere Ballots).
          *   10-40: The "Impossible" Game (3 Rounds of Rule Making & Voting).
          *   40-60: Escape Routes (Pick 3 feasible ones).
          *   60-75: Debrief.
      *   **Scripts:** Need clear instructions to prevent confusion.
      *   **The "Pareto" Round:** I will suggest using Plurality Rule in Round 1 with a specific configuration of preferences (likely to happen naturally with 4 options) where vote splitting causes a Condorcet Loser to win sincerely, but strategic coordination (misreporting) could have elected a Condorcet Winner.
      *   **Debrief:** Connect specific moments to GS axioms.

  5.  **Addressing the "Least Confident" Section:**

      *   *Randomization:* Gibbard (1977) extends GS to randomized rules. Random Dictatorship is strategy-proof. Are there others? Yes, mixtures of dictators. But "random serial dictatorship" is the main one. I need to be careful claiming it's the *only* one without qualification (depends on range conditions).
      *   *Cardinal/Side Payments:* This moves out of social choice into mechanism design (VCG). It's not strictly an "escape" from GS because GS assumes ordinal preferences. I need to flag that this changes the *domain* assumption, not just the rule.
      *   *Pilot:* The calculation load is the biggest risk. Pilot the tallying process.

  6.  **Refining the "Pareto Inferior" Requirement:**

      *   The prompt asks: "sincere voting under the students' own rule picks an outcome the group agrees is worse than what misreporting would have produced."
      *   Interpretation: Outcome(Sincere) is Pareto Dominated by Outcome(Strategic).
      *   Example: Plurality. Options A, B, C.
          *   Group prefers B over A.
          *   Sincere: A supporters vote A, B supporters split between B and C (if C is similar to B). A wins.
          *   Strategic: B and C supporters coordinate on B. B wins.
          *   Everyone prefers B over A.
      *   This is the "Vote Splitting" scenario. I need to ensure the instructions highlight this if it occurs.

  7.  **Final Review against Constraints:**

      *   18 students? Yes.
      *   75 mins? Tight, need strict timekeeping.
      *   No projector? Whiteboard only.
      *   Mixed prep? Keep math minimal.
      *   Round 0 sealed? Yes.
      *   Escape routes in last 20? Yes.
      *   Debrief mapping? Yes.
      *   Honest note on failures? Yes.
      *   Least confident section? Yes.

  8.  **Constructing the Output:** (Self-Correction during drafting)
      *   *Correction on Calculation:* I cannot ask the instructor to calculate 18 ballots x 3 rounds live. I will advise them to have the "Sincere Master Sheet" ready *before* the voting rounds start, perhaps by quickly transcribing during the "Rule Proposal" discussion time.
      *   *Correction on Escape Routes:* Side payments are too complex for 5 mins. I will suggest dropping that for "Random Dictatorship" or "2 Alternatives" which are cleaner demonstrations of relaxing GS assumptions.
      *   *Correction on Stake:* Ensure the budget options are mutually exclusive and clearly defined to avoid "cardinal" confusion.

  9.  **Final Polish:** Check tone (professional, instructional), ensure all prompt requirements are met (especially the "least confident" section). *Self-Correction on GS conditions:* Make sure to explicitly mention "Unrestricted Domain" when discussing the escape routes (e.g., Single-Peaked restricts the domain).

  10. **Writing the "Least Confident" section:** I need to be precise about Gibbard (1977) vs. Gibbard-Satterthwaite (1973/75). GS is deterministic. Gibbard 1977 covers randomized. The claim that "Random Dictatorship is the only strategy-proof randomized rule" is true *under certain conditions* (ex-post efficiency, etc.), but technically there are others if you drop efficiency. I should flag this nuance.

  Let's assemble the plan.cw
answer: |-
  # Lesson Plan: The Impossibility of Honest Voting
  **Course:** Undergraduate Seminar on Democracy and Collective Choice  
  **Time:** 75 Minutes  
  **Students:** 18 (Mixed preparation)  
  **Materials:** Whiteboard + markers, 20 Index cards (ballots), 20 Envelopes, 1 "Master Tally Sheet" (instructor only), Timer.

  ---

  ## I. Preparation & Materials

  **The Stake:** Define four mutually exclusive uses for a $100 class budget. Write these on the board immediately upon entry.
  1.  **Pizza Party** (Food at end of term)
  2.  **Charity Donation** (To a cause the class picks)
  3.  **Guest Speaker** (Honorarium for a visitor)
  4.  **Book Vouchers** ($5 Amazon codes for everyone)

  **The Ballot (Index Card):**
  > **Name (Optional):** _______________
  > **Rank the options 1 (Best) to 4 (Worst):**
  > Pizza: ___  Charity: ___  Speaker: ___  Vouchers: ___
  > *Instruction: Rank sincerely based on what you actually want.*

  **The Master Tally Sheet (Instructor Only):**
  Create a grid with 18 rows (students) and 4 columns (options). You will need to transcribe the "Round 0" sincere ballots into this sheet *during* the first rule-discussion phase.

  ---

  ## II. Timeline & Script

  ### 0:00 – 0:10 | Round 0: The Sincere Baseline
  **Action:** Hand out cards and envelopes.
  **Script:** "We have $100 leftover. We must spend it on exactly one of these four items. I need to know what you *truly* want. Write your sincere ranking. Put it in the envelope. Seal it. Do not show anyone. I will collect these. They are now evidence of your true preferences. They will not be opened until the end of class."
  **Instructor Note:** Collect envelopes. Do not open them yet. Place them in a pile.

  ### 0:10 – 0:40 | The "Impossible" Game (3 Rounds)
  **Goal:** Students propose rules, vote, and discover manipulation.
  **Setup:** Explain that for the next 30 minutes, they will govern themselves.

  **Round 1 (10 mins): The Naive Rule**
  *   **Instruction:** "Propose a voting rule. It must be deterministic (no coin flips) and pick one winner. You have 3 minutes to agree on a rule."
  *   **Likely Outcome:** They will pick Plurality (most 1st-place votes) or Borda (points for ranking).
  *   **Voting:** Hand out fresh index cards. "Vote however you like. You know the rule. You do *not* have to be sincere."
  *   **Tally:** Count votes on the whiteboard. Announce Winner A.
  *   **The Reveal (Crucial Step):** While they discuss the next rule, quickly open the Round 0 envelopes and transcribe the *sincere* 1st-place votes (or scores) onto your Master Sheet.
  *   **Comparison:** "Had you all voted your Round 0 sincere preferences under this same rule, Winner B would have won."
  *   **Discussion:** "Who prefers Winner A? Who prefers Winner B? Did anyone vote strategically to change the outcome from B to A?"

  **Round 2 (10 mins): The Patch**
  *   **Instruction:** "The last rule allowed lying to get a better result. Propose a new rule that makes lying useless or too risky. 3 minutes."
  *   **Likely Outcome:** They might try Instant Runoff (Hare) or a Runoff system.
  *   **Voting:** Fresh cards. Vote.
  *   **Tally:** Announce Winner C.
  *   **Comparison:** Compare to Round 0 Sincere data (Winner D).
  *   **Discussion:** "Did anyone lie again? Did the new rule stop them?" (Usually, it just changes *how* they lie).

  **Round 3 (10 mins): The Efficiency Trap (Requirement 2)**
  *   **Instructor Intervention:** If Round 1 or 2 resulted in a "Vote Splitting" scenario (e.g., Pizza and Vouchers are similar, Charity wins despite most preferring Food), highlight it now. If not, *force* the scenario.
  *   **Script:** "Let's try Plurality again. But I want you to talk for 2 minutes before voting. Look at the board. If the 'Food' voters split between Pizza and Vouchers, Charity wins. Most of you hate Charity."
  *   **Voting:** Allow them to coordinate (misreport) to defeat the "Spoiler."
  *   **Result:** Sincere voting (hypothetically) yields Charity (Pareto Inferior). Strategic coordination yields Pizza (Pareto Superior).
  *   **Point:** "Here, strategy *helped* the group. This asks: Is strategy-proofness always good?"

  ### 0:40 – 1:00 | Escape Routes (Last 20 Minutes)
  **Instruction:** "We seem stuck. Every deterministic rule with 3+ options can be manipulated. Let's test the conditions of this impossibility. We will try breaking the rules of the game."

  **Test 1: Two Alternatives (5 mins)**
  *   **Setup:** Remove two options. Only Pizza vs. Charity.
  *   **Rule:** Simple Majority.
  *   **Task:** "Can anyone gain by lying?" (No, dominant strategy is truth).
  *   **Lesson:** GS requires $\ge 3$ alternatives.

  **Test 2: Random Dictatorship (5 mins)**
  *   **Setup:** Return to 4 options.
  *   **Rule:** "I will shuffle the 18 envelopes from Round 0. I will pick one at random. That person's #1 choice wins."
  *   **Task:** "In Round 0, did anyone have an incentive to lie?" (No. To maximize chance of your favorite, you must rank it #1).
  *   **Lesson:** GS requires Determinism. Randomization allows strategy-proofness.

  **Test 3: Restricted Domain / Single-Peaked (5 mins)**
  *   **Setup:** Order options on a line: *Charity — Vouchers — Pizza — Speaker* (Left to Right spending scale).
  *   **Rule:** Median Voter Theorem (Pick the median peak).
  *   **Task:** "If everyone's preferences are single-peaked (you like the option closest to your ideal), can you gain by lying?"
  *   **Lesson:** GS requires Unrestricted Domain. If preferences are structured, truth is possible.

  *(Note: Side payments are dropped for time; they require cardinal utility which confuses the ordinal lesson.)*

  ### 1:00 – 1:15 | Debrief & Mapping
  **Script:** "You just reinvented the Gibbard-Satterthwaite Theorem. Let's map your experience to the formal conditions."

  **Whiteboard Map:**
  1.  **3+ Alternatives:** Tested in Rounds 1-3 (Manipulation found). Tested in Escape 1 (Manipulation vanished with 2 options).
  2.  **Deterministic:** Tested in Rounds 1-3. Tested in Escape 2 (Random Dictatorship was strategy-proof).
  3.  **Unrestricted Domain:** Tested in Rounds 1-3. Tested in Escape 3 (Single-peakedness removed manipulation).
  4.  **Non-Dictator:** You voted as a group. If I had just picked one person to decide, it would be strategy-proof, but not democratic.
  5.  **Pareto/Unanimity:** We assumed if everyone likes X best, X should win.

  **Honest Limitations (Say this verbatim):**
  "Three caveats. First, we only tested a handful of preference profiles. The theorem says manipulation exists for *all* rules across *all* possible profiles. We saw it happen, but we didn't prove it always happens. Second, we used ordinal rankings. If we could measure *intensity* (how much you love Pizza) and allow side payments (mechanism design), we can sometimes solve this, but that requires money and comparability we don't have. Third, we assumed a single winner. Multi-winner rules (proportional representation) change the math but introduce new problems."

  ---

  ## III. Predictable Failures & Mitigation

  | Failure Mode | Probability | Mitigation |
  | :--- | :--- | :--- |
  | **Calculation Bottleneck** | High | You cannot calculate 18 Borda ballots live. **Solution:** Use Plurality for Round 1 (easy count). Transcribe Round 0 sincere ballots *during* the 3-minute rule discussion of Round 1. |
  | **Apathy / No Strategy** | Medium | The $100 stake is small. **Solution:** Add social stakes. "The winner gets announced in the department newsletter." Or, allow them to eat the pizza *now* if it wins (order ahead). |
  | **Uncomputable Rules** | Medium | Students propose "Maximize total happiness." **Solution:** Veto rules that require cardinal utility. "Must be countable on a whiteboard in 2 minutes." |
  | **Round 0 Strategic** | Low | Students might lie in Round 0 thinking it counts. **Script:** Emphasize Round 0 is *evidence* for the debrief, not a vote. "This is your private diary, not a ballot." |
  | **Time Overrun** | High | Escape routes eat time. **Solution:** Be ruthless. If Round 3 runs long, cut "Side Payments" (not planned) and ensure "Random Dictatorship" is the final escape test. |

  ---

  ## IV. Instructor's Confidence Check (The "Least Confident" Section)

  *As requested, here are the formal claims I am least confident about and would want a social choice theorist to verify before running:*

  1.  **Randomized Strategy-Proofness:**
      *   *Claim in Debrief:* "Random Dictatorship is strategy-proof."
      *   *Uncertainty:* This is true for *ex-post* strategy-proofness (Gibbard 1977). However, if students have risk-averse preferences over lotteries (e.g., they prefer a sure 2nd choice over a 50% chance of 1st and 50% of 4th), Random Dictatorship might not be strategy-proof regarding their *utility* over the lottery, even if it is regarding their ordinal ranking.
      *   *Risk:* A student with game theory background might object: "I might lie to reduce variance."
      *   *Fix:* In the debrief, specify: "Strategy-proof regarding your ordinal ranking of outcomes, assuming you just want to maximize the probability of your top choice."

  2.  **The "Pareto Inferior" Sincere Outcome:**
      *   *Claim in Round 3:* "Sincere voting picks an outcome the group agrees is worse."
      *   *Uncertainty:* This relies on a specific preference profile (Condorcet Loser winning via Plurality). With 18 random students, this profile might not emerge naturally.
      *   *Risk:* If sincere voting produces a Condorcet Winner, the lesson fails.
      *   *Fix:* I recommend **pre-seeding** the class. Ask 3-4 friends to attend and assign them specific preferences (e.g., split the "Food" vote) to guarantee the vote-splitting scenario in Round 1 or 3. Without this, you are gambling on the preference distribution.

  3.  **Single-Peakedness Implementation:**
      *   *Claim in Escape 3:* "Ordering the options makes truth-telling optimal."
      *   *Uncertainty:* Single-peakedness requires the *preferences* to align with the *ordering*, not just the options to be ordered. Students might have genuine multi-peaked preferences (e.g., they want Pizza OR Charity, but not Vouchers).
      *   *Risk:* If a student has multi-peaked preferences, the Median Voter Theorem fails.
      *   *Fix:* Frame it carefully: "This escape route only works *if* we assume everyone's preferences share this structure. It restricts the Domain, which is one of the GS conditions."

  **Pilot Recommendation:**
  Pilot the **Transcription/Tally Phase**. Sit down with 18 mock ballots and time yourself transcribing them into a Master Sheet while simulating a "3-minute class discussion." If this takes more than 3 minutes, you must reduce the class size for the activity (split into two groups of 9) or switch to a show-of-hands Plurality system where you can count sincere hands vs. strategic hands live. **Do not attempt live Borda counting.**
