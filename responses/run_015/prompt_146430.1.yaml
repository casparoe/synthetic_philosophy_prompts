  **GRADING MEMO**

  **Course:** PHI 450: Philosophy of Language
  **Assignment:** Final Examination
  **Student ID:** [Redacted]
  **Date:** October 26, 2023
  **Grade:** B+

  **General Assessment:**
  This is a competent and clearly written response that demonstrates a strong grasp of the core mechanisms underlying Moore's Paradox, particularly in Part (a). You correctly identify the distinction between logical consistency and pragmatic absurdity, and your analogy to performative contradictions is apt. However, the response falters in Part (b) regarding the tense/person asymmetry, which is a central component of the standard analysis of the paradox. Part (c) offers a creative and plausible distinction regarding collective agency, though it risks overlooking the self-inclusive nature of the plural pronoun. The grade reflects a solid understanding of the concepts but penalizes the significant doctrinal error in Part (b).

  **Point-by-Point Analysis:**

  **(a) Logical Consistency vs. Pragmatic Absurdity**
  *   **Strengths:** You correctly diagnose the logical status of the sentence. The observation that the meteorological fact ($p$) and the psychological fact ($\neg Bp$) are independent is the standard and correct explanation for logical consistency.
  *   **Strengths:** Your explanation of the pragmatic absurdity is precise. Identifying assertion as an expression of belief (rather than merely a description) captures the normative force required to generate the paradox.
  *   **Strengths:** The analogy to the performative contradiction ("I hereby promise never to make promises") is excellent. It illustrates how the *act* of speaking undermines the *content* of the speech without creating a formal logical contradiction. This section is A-level work.

  **(b) Tense and Person Restriction**
  *   **Weakness:** Your claim that the past-tense analogue ("It rained yesterday, but I did not believe it then") is "equally strange" and "self-undermining" is incorrect according to the standard philosophical treatment of Moore's Paradox.
  *   **Analysis:** The paradox relies on the constitutive norm that *present* assertion implies *present* belief. When you assert a past-tense proposition, you express a current belief about the past, not a past belief. Therefore, asserting "It rained" implies "I currently believe it rained," which is perfectly consistent with "I did not believe it then."
  *   **Conflation:** You seem to conflate the content of the belief with the act of asserting. Admitting past error or past ignorance is not pragmatically absurd; it is a coherent autobiographical report. By arguing that the restriction to the first-person present is "not well motivated," you miss the key asymmetry that makes the paradox specific to the *current* act of assertion. This is a significant conceptual slip that prevents a higher score.

  **(c) Plural/Collective Variant**
  *   **Strengths:** You directly address the prompt's query about whether this collapses into a different failure (collective irrationality). Distinguishing between the captain's individual doxastic state and the aggregate state of the team is a sophisticated move.
  *   **Weakness:** Your analysis depends on treating the captain as an observer of the "us" rather than a constituent part of it. If the captain is included in the referent of "us," then asserting "We are going to win" typically expresses her own belief (as a member of the group), while "None of us believes" explicitly denies that she (as a member of the group) holds that belief.
  *   **Critique:** To sustain your claim that this is *not* Moore-paradoxical, you would need to argue that the "We" in the first clause functions as a singular collective agent distinct from the distributive "us" in the second clause. As it stands, you assert that "her own belief is separate from the aggregate." While this is possible in a sociological sense, in the context of assertion, if she includes herself in "none of us," she generates the same expressive conflict for herself. However, your suggestion that this may be a coordination problem is a defensible alternative interpretation, provided the self-inclusion issue is resolved.

  **Recommendations for Improvement:**
  1.  **Review the Norms of Assertion:** Re-examine why the link between assertion and belief is indexed to the *time of utterance*. This will clarify why the past-tense variant fails to generate the paradox.
  2.  **Pronoun Indexicality:** In analyzing collective variants, pay closer attention to whether the speaker includes themselves in the scope of the plural pronoun. If the speaker says "None of us," they are typically asserting $\neg B_{speaker}$ as well as $\neg B_{others}$.

  **Summary:**
  You have a strong intuitive and technical handle on the expressive nature of assertion (Part a). However, the error regarding the tense asymmetry (Part b) indicates a gap in understanding the specific conditions that generate the paradox. Part (c) is thoughtful but requires more rigorous handling of self-reference.

