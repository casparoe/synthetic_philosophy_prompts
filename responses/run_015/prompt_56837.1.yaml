      *   *Verdict:* 1277 suggests the paradox literature ignores the substantive modal metaphysics. It's not about the grammar of "omnipotence" but the ontology of "possibility."

  5.  **Task 3: Absolute vs. Ordained Power (Potentia Dei Absoluta vs. Ordinata):**
      *   *Function:* Distinguishes what God *could* do (logically possible) vs. what God *has chosen* to do (established order).
