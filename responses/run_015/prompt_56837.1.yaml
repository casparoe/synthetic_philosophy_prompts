answer: |-
  Here is the analysis of the 1277 episode through the lens of omnipotence theory, structured for your seminar.

  ### 1. Mapping Resolutions to the Condemned Articles

  We take the two key articles: (A) *God cannot move the heavens rectilinearly (because a vacuum would remain)* and (B) *The first cause cannot make several worlds.* We test these against standard resolutions of the omnipotence paradox.

  **The Contradiction-Limit View**
  *Theory:* Omnipotence extends to all things that do not involve a logical contradiction.
  *Application:* This view turns on whether "rectilinear motion of heavens" or "multiple worlds" entails a contradiction. The Arts faculty claimed these were impossible *per se* (often conflating physical necessity with logical necessity). Tempier asserts they are not contradictory.
  *Verdict on Articles:* Under this view, if the states of affairs are logically coherent, the articles are **false**. God can do them.
  *Appropriateness of Condemnation:* The condemnation is appropriate only if the Arts faculty were claiming these impossibilities were logical rather than physical. If they meant "God cannot do this given the laws of physics He established," the articles might be true, and condemning them would be an error. Tempier treats them as claims about absolute possibility. Thus, the condemnation functions as a ruling on what counts as a "contradiction." It asserts that physical constraints (like the horror vacui) are not logical constraints.
  *Omnipotence Relevance:* The falsity of the articles is not due to omnipotence *per se*, but due to the scope of possibility. Omnipotence merely fills the available logical space. If the space is larger than Aristotle thought, omnipotence reaches further.

  **The Ill-Formed Task View**
  *Theory:* Paradoxes arise because phrases like "stone too heavy to lift" fail to describe a coherent state of affairs.
  *Application:* The 1277 articles do not look like ill-formed tasks. "Creating a second world" describes a clear state of affairs. It is not self-referential.
  *Verdict on Articles:* This resolution offers little traction. The tasks are coherent. To say the articles are meaningless would be to say "multiple worlds" is gibberish, which Tempier denies.
  *Appropriateness of Condemnation:* If the tasks are coherent, condemning the claim that God *cannot* do them is appropriate. This view suggests the Stone Paradox is a linguistic trap, but 1277 is a metaphysical dispute. The condemnation is valid because the proposition is meaningful and false, not because it is nonsense.

  **The Senses of "Can" / Possible Worlds View**
  *Theory:* Omnipotence is maximal power indexed across possible worlds; "can" refers to accessibility relations between worlds.
  *Application:* The Arts faculty effectively claim there is no possible world accessible to God where a vacuum exists or where multiple worlds exist. Tempier claims there are such possible worlds.
  *Verdict on Articles:* The articles are **false** because they incorrectly map the modal landscape. They deny the existence of possible worlds that are, in fact, possible.
  *Appropriateness of Condemnation:* Highly appropriate. This view aligns perfectly with Tempier's intent: to expand the modal horizon. The condemnation is a decree that certain worlds are *possible*, even if not *actual*.

  **The Voluntarist Response (Descartes)**
  *Theory:* God is the author of eternal truths; logic and necessity are subject to His will.
  *Application:* If God wills it, a vacuum could be logically necessary, or multiple worlds could be the only option. The distinction between "possible" and "impossible" is created by God.
  *Verdict on Articles:* The articles are **false**, but for a radical reason. It is not just that God *can* override physics; He defines what counts as physics and logic.
  *Appropriateness of Condemnation:* Appropriate, but Tempier does not go this far. Tempier assumes logic holds (non-contradiction); Descartes suspends it. Tempier condemns the limitation of power; Descartes removes the limitation of logic.

  ### 2. The Structural Mismatch

  The Stone Paradox is self-referential: it asks if the definition of omnipotence consumes itself. The 1277 articles are external: they ask if the definition of *nature* consumes God's power.

  **Does this support the Deflationary Diagnosis?**
  If the Stone Paradox is merely a semantic artifact, one might expect real theological disputes to look like 1277: substantive claims about what is possible. The fact that 1277 generated intense debate while the Stone Paradox is often treated as a logical puzzle suggests the deflationary diagnosis is correct regarding the *Paradox*, but incomplete regarding *Power*. The Paradox is a game of grammar; 1277 is a game of metaphysics. Once you fix the grammar of "can" (as 1277 attempts to do), the Paradox dissolves, but the dispute over *which* possibilities are real remains.

  **Or Does it Suggest the Opposite?**
  It suggests the paradox literature ignores the political ontology of possibility. The Stone Paradox asks, "Is this concept coherent?" 1277 asks, "Who has the authority to decide what is coherent?" The Arts faculty used reason to rule out possibilities; Tempier used ecclesiastical authority to rule them back in. The real dispute is not about the logic of "omnipotence" but about the boundary between natural necessity and divine freedom. The paradox literature treats "possibility" as a given logical space; 1277 treats "possibility" as a contested territory.

  **Verdict:** The episode is an **anomaly** for standard analytic treatments. Analytic theory assumes the space of possibilities is fixed prior to the analysis of power. 1277 treats the space of possibilities as the very thing being negotiated by the assertion of power.

  ### 3. Absolute vs. Ordained Power

  **Does it Resolve, Relocate, or Vocabularize?**
  The distinction between *potentia absoluta* (what God can do logically) and *potentia ordinata* (what God has chosen to do) **relocates** the paradox.
  *   *Resolution:* It prevents the contradiction of "God does X" and "God does not do X" by indexing them to different modalities.
  *   *Relocation:* The tension moves from "Can God?" to "Is this constraint logical or voluntary?"
  *   *Vocabularize:* It provides the terminology, but the work is done by the modal distinction.

  **Tempier's Invocation**
  Tempier is best read as asserting that the **ordinary course of nature imposes no constraints on what may be asserted about God's absolute power.** He uses the distinction to protect the *absolute* from being collapsed into the *ordained*. The Arts faculty argued that because the world *is* one (ordained), it *must be* one (absolute). Tempier insists the ordained order is contingent.
  *   *Verdict:* The distinction resolves the specific tension in the articles by rendering them claims about absolute power that are falsely denying contingency. It does not solve the Stone Paradox, because the Stone Paradox challenges the coherence of *absolute* power itself, not its relation to the ordained order.

  ### 4. Descartes vs. 1277: Extension or Violation?

  **The Comparison**
  Tempier condemns the "double truth" (true in philosophy, false in theology). He demands harmony: if faith says God can do it, philosophy cannot say it is impossible.
  Descartes argues God can make contradictions true (e.g., 2+2=5).

  **Is Descartes a Consistent Extension?**
  *   *Extension:* Yes, in terms of **sovereignty**. Both Tempier and Descartes refuse to let a creaturely standard (Aristotelian physics for Tempier, Logic for Descartes) bind God. Both assert that the limits of power are determined by God, not by the structure of reality.
  *   *Violation:* Yes, in terms of **intelligibility**. Tempier's condemnation assumes that "God cannot make a vacuum" is a false proposition about a coherent state of affairs. He operates within the law of non-contradiction. Descartes suspends that law. Tempier wants to save the intelligibility of the world from necessitarianism; Descartes makes the world intelligible only because God wills it to be so at this moment.
  *   *The "Double Truth" Context:* Tempier attacks those who separate faith and reason. Descartes effectively subordinates reason to faith so thoroughly that reason loses its independent grip on necessity.
  *   *Verdict:* Descartes is a **radicalization** that violates the **methodological constraint** of 1277. 1277 uses omnipotence to secure the contingency of the world (making it safe for reason to investigate, since laws aren't necessary). Descartes uses omnipotence to secure the contingency of logic (making reason dependent on revelation).

  **What this shows about the job of "Omnipotence":**
  It shows "omnipotence" is doing **two different jobs**.
  1.  **In 1277:** Omnipotence is a **protective doctrine**. It protects the contingency of creation so that natural philosophy can function without falling into necessitarianism. It clears space for science.
  2.  **In Descartes:** Omnipotence is a **foundational doctrine**. It grounds the truth of logic itself. It consumes the space for independent reason.

  ### 5. Discipline on Theory Silence (Category Mistake)

  Treating a condemnatory decree as a test case for the logic of "can" involves a **category mistake** if we conflate *normative prohibition* with *metaphysical impossibility*.
  *   *The Mistake:* A proposition is "condemned" if it is dangerous to teach, not necessarily if it is logically false in a vacuum. However, Tempier frames the condemnation in metaphysical terms ("God *cannot*... is false").
  *   *Where Theory is Silent:* Analytic theories of omnipotence generally assume an ideal agent in a logical vacuum. They are silent on the **institutional authority** required to define possibility. 1277 reveals that declaring something "possible" can be an act of power, not just logical analysis.
  *   *Verdict:* The episode is an **unanticipated case** for standard theory. Standard theory asks, "Can an omnipotent being do X?" 1277 asks, "Who is authorized to claim X is impossible?" The theory lacks the resources to analyze the epistemic authority involved in defining the limits of power.

  ### 6. The Final Question for Students

  If the contradiction-limit view renders the condemned articles neither true nor false (because they describe non-contradictory states that Aristotle mistakenly deemed contradictory), but the Bishop condemns them as false assertions about God's power, what does that tell us about whether omnipotence paradoxes are about power, about possibility, or about nothing but the grammar of an honorific?

  **Refined for the Seminar:**
  "If the 1277 condemnation forces us to admit that 'possibility' is not a fixed logical space but a boundary drawn by authority, does the Stone Paradox fail because it treats 'omnipotence' as a property of a being, when it is actually a claim about who owns the definition of the possible?"
