  ### Executive Summary: Recommended Allocation

  For a three-year horizon with a team composed of philosophers of science and computer scientists (and no formal physics background), I recommend the following prioritization:

  1.  **Priority 1 (Primary Focus):** **Tension 1 (Causal/Evidential Distinction & Boundary Conditions).**
      *   *Focus:* Formalizing the "Cartesian Boundary" information-theoretically to reconstruct decision theory without external interventions.
  2.  **Priority 2 (Secondary/Dependent Focus):** **Tension 2 (Self-Modification & Fixed Points).**
      *   *Focus:* Normative and formal constraints on diachronic consistency (goal stability) rather than full Gödelian self-proof.
  3.  **Deprioritized:** **Tension 3 (Logical Omniscience & Expected Utility).**
      *   *Reason:* Too broad, less distinctively "embedded," and high risk of drifting into intractable physics-dependent computation theory.

  ---

  ### 1. Priority 1: The Boundary/Decision Theory Interface (Tension 1)

  **The Directive:** Dedicate roughly 60% of effort to determining whether the CDT/EDT distinction collapses when the agent is defined as a subsystem with an informational boundary (e.g., a Markov Blanket) rather than a causal external node.

  **Defense:**
  *   **Tractability (High):** This direction leverages the existing strengths of your group. Computer scientists can utilize mature causal inference toolkits (e.g., Pearl's structural causal models, causal abstraction) without needing new physics. Philosophers of science can contribute essential conceptual labor on "natural kinds," "levels of description," and "mereology" (part-whole relationships) to define where the agent ends and the environment begins. This avoids the need for formal physics background by treating boundaries as *informational* rather than *thermodynamic*.
  *   **Downstream Implications (Broad):** Resolving this is a prerequisite for the other two tensions. You cannot model an agent revising itself (Tension 2) or calculating utility (Tension 3) if you cannot formally distinguish the agent from the environment it is revising or calculating utility over. A robust definition of the "embedded boundary" provides the ontology required for the rest of the research.
  *   **Field Impact:**
      *   *AI Alignment:* Current alignment frameworks often assume a clean separation between agent and environment. A formal account of "embedded decision theory" (akin to Functional Decision Theory) is critical for predicting agent behavior in multi-agent simulations or scenarios where code is readable by others (Newcomb-like problems).
      *   *Philosophy of Action:* This directly addresses the "problem of intervention." If an embedded agent cannot intervene on itself from the outside, standard causal accounts of action fail. Solving this offers a new framework for free will and agency compatible with physicalism.

  ### 2. Priority 2: Reflective Consistency in Self-Modification (Tension 2)

  **The Directive:** Dedicate roughly 40% of effort to modeling self-modification, but constrain the scope to *normative continuity* and *approximate reflective consistency* rather than seeking perfect Gödelian self-proof.

  **Defense:**
  *   **Tractability (Medium):** Full "tiling agents" (agents that can prove their successors will share their goals) hits hard mathematical impossibility results (Löb's Theorem). However, a mixed team can pivot to *probabilistic* or *bounded* reflective consistency. CS members can work on formal verification of code-rewriting systems, while philosophers can analyze the conditions under which a modified agent remains the "same" agent for the purposes of moral responsibility and goal stability.
  *   **Downstream Implications (Critical for Alignment):** This is the highest-stakes problem for AI safety. If an embedded agent cannot trust its future self, it cannot execute long-term plans. If it modifies itself incorrectly, it loses alignment. Even partial progress on "safe self-modification protocols" is high-value.
  *   **Field Impact:**
      *   *AI Alignment:* Directly informs the design of agents that can undergo recursive self-improvement without goal drift.
      *   *Philosophy of Action:* Contributes to the literature on *diachronic rationality* and personal identity. It moves the philosophical discussion from metaphysical speculation to formal constraints on rational continuity.

  ### 3. Deprioritized: Logical Omniscience and Expected Utility (Tension 3)

  **The Directive:** Explicitly deprioritize foundational work on logical omniscience. Treat logical boundedness as a background constraint (using existing frameworks like Logical Induction) rather than a primary research output.

  **Defense:**
  *   **Reason for Deprioritization (Intractability & Scope Creep):**
      1.  **Crowded Field:** "Bounded rationality" is already a massive field in economics, AI, and philosophy. A small group is unlikely to produce foundational breakthroughs in three years that outpace existing work in probabilistic logic or computational complexity.
      2.  **Physics Dependency:** This tension often silently relies on physical assumptions. To rigorously model the *cost* of logical computation (why an agent isn't omniscient), one often drifts into thermodynamics of computation (Landauer's principle) or physical limits of information processing. Given your group's lack of physics background, this creates a high risk of producing models that are either physically naive or mathematically stalled.
      3.  **Minimal Spillover:** Solving logical omniscience yields a "more realistic agent," but it does not solve the *structural* problems of embeddedness. An agent can be logically bounded but still have a well-defined boundary (Tension 1) and stable goals (Tension 2). Conversely, solving T1 and T2 yields insights even if the agent remains logically uncertain.
  *   **Strategic Value:** By treating this as a constraint rather than a goal, you free up resources to tackle the more distinctively "embedded" problems (Boundaries and Self-Reference) where your interdisciplinary mix offers a comparative advantage.

  ### Implementation Warning: The Physics Trap

  Since your group lacks a physics background, you must enforce a strict **informational interpretation** of "embeddedness."

  *   **Do:** Model boundaries as conditional independencies in causal graphs (Markov Blankets). Model energy costs as abstract computational complexity.
  *   **Do Not:** Attempt to model the thermodynamic costs of erasure or the quantum mechanical limits of the agent's substrate.

  Tension 1 mentions "local boundary conditions," which sounds physical. If your team attempts to ground this in statistical mechanics, the project will stall. Keep the "physics" at the level of *causal structure* and *information flow*, which fits both Computer Science and Philosophy of Science competencies.

  ### Summary of Strategic Logic

  This ordering maximizes the intersection of your team's skills (Causal Modeling + Conceptual Analysis) while targeting the most critical bottlenecks for AI Alignment (Goal Stability + Decision Theory). It avoids the "physics trap" of Tension 3 and the "Gödelian trap" of Tension 2 by making Tension 1 (Boundaries) the foundational layer upon which the others rest.
