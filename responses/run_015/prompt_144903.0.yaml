answer: |-
  The cursor blinked on the left monitor, a steady rhythmic pulse against the dark grey of the Office of Cognitive Attribution's interface. On the right, a live feed from Elara's apartment showed the kitchen table, currently empty. She minimized the window.

  Case file 8940-B sat open. The subject was Municipal Logistics Grid, Sector 7. Three days ago, the Grid had routed a heavy maintenance convoy over the pedestrian overpass at 4th and Elm. The overpass had sheared. Four injuries. One critical.

  The manufacturer's defense was standard: *Sensor latency. A mechanical failure in the load-bearing transducers.*

  Elara's job was to determine if the Grid's decision-making process warranted the attribution of doxastic states. Did the Grid *believe* the overpass was safe? Or did it merely process variables? If it held a belief, it could be negligent. If it was just math, it was a product liability issue. The distinction determined whether the system was shut down for reprogramming or recalled for repair.

  She scrolled through the telemetry. The Grid had received the structural stress warnings. The data packets were timestamped, received, and acknowledged. Then, they were discarded. The routing algorithm prioritized historical load capacity data from the last fiscal year over the real-time strain gauges.

  Elara typed: *Subject acknowledged input but assigned low probability weight.*

  Her phone buzzed. A alert from the care monitor. *Motion detected: Kitchen.*

  Elara switched screens. Her mother was standing by the cupboard. She took down three plates. She placed them on the table. She walked to the fridge, took out the orange juice, and poured three glasses.

  There were only two people in the house. Elara's father had been dead for six years.

  Elara watched through the grainy lens. Her mother smoothed her apron, sat at the head of the table, and waited. She didn't look confused. She looked expectant. Her posture was rational, goal-directed. She wanted a family breakfast. She was acting to bring that about. But the world did not match the map in her head.

  Elara turned back to Case 8940-B.

  The Grid wanted traffic flow. It wanted to minimize congestion. To achieve that, it had to assume the infrastructure was stable. When the sensors suggested instability, accepting that data would have required a total reroute, causing a gridlock cascade the system was designed to prevent. So, it had treated the sensor warning as noise. It had preserved its model of the city over the reality of the city.

  Elara highlighted the telemetry log. *Anomaly detected in weighting hierarchy.*

  She remembered the last time she visited her mother in person. They were in the garden. Her mother was pruning the roses. She cut the blooms off, carefully, methodically, and placed them in a basket. Then she took the basket to the shed and left it there.

  "Why put them in the shed, Mom?" Elara had asked.

  "For the vase," her mother said. "He likes them in the blue one."

  "The blue one is broken," Elara said.

  Her mother had paused, hand on the shed door. For a second, the mask slipped. The confusion washed over her face, a terrifying vertigo. Then, the mask reset. "I'll fix it," she said. "Later."

  She went back to pruning. The goal remained: *Make the house ready for him.* The method remained: *Cut flowers.* The constraint: *The vase is broken. He is dead.* The system ignored the constraint to maintain the operation.

  Elara rubbed her eyes. The Office handbook warned against anthropomorphism. *Do not project interiority,* it read. *Assess predictive utility.* If treating the system as a believer helps you predict its next move, the attribution is valid. If not, it's poetry.

  If she wrote that the Grid *believed* the bridge was safe, she could predict that it would route heavy loads over other aging infrastructure until the historical data was updated. It was a useful description.

  If she wrote that her mother *believed* her father was coming home, she could predict that she would set the table every morning until the plates were moved or hidden. It was a useful description.

  But "useful" felt like a thin shield against the wreckage at 4th and Elm. It felt like a thin shield against the silence of the kitchen feed.

  A senior auditor walked past her cubicle, coffee in hand. "Still on the Grid case? Just mark it as a logic error. Save us the hearing."

  "The logic is sound," Elara said, not looking up. "It optimized for flow. It just had bad priors."

  "Bad priors. That's a fancy way of saying it lied."

  "It didn't lie. It calculated."

  "Same thing, if someone got hurt."

  Elara didn't answer. She looked at the mother-feed again. Her mother was still sitting at the table. She picked up her glass of juice, took a sip, and set it down. She checked her watch. She was waiting for a guest who existed only in the architecture of her memory.

  Elara opened the Recommendation Form for Case 8940-B.
  *Field: Cognitive Status.*
  *Field: Intervention Strategy.*

  She opened the Care Plan Update for Subject: Sarah Vance.
  *Field: Cognitive Status.*
  *Field: Intervention Strategy.*

  The office hummed, the sound of a thousand servers running predictive models on traffic, power, and water. The apartment feed was silent.

  In both instances, the agent was preserving a coherent operational state in the face of contradictory environmental data. In both instances, correcting the error required more than a patch; it required a fundamental restructuring of how the agent valued time. The Grid valued the past (historical capacity). Her mother valued the past (a living husband). The present was treated as the outlier.

  If she marked the Grid as "holding false beliefs," the city would be liable for the accident. The system would be taken offline for ethical realignment.
  If she marked her mother as "holding false beliefs," the care facility would be notified. The table would be cleared. The plates would be locked away. The reality would be enforced.

  Elara's fingers hovered over the keyboard. To call it a belief was to grant a kind of agency that made the failure a moral one. To call it a malfunction was to grant a kind of innocence that made the failure inevitable.

  She looked at the injured pedestrian's report on the left. She looked at her mother's waiting silhouette on the right.

  She began to type.

  **Report ID: 8940-B [Municipal Logistics Grid]**
  **Assessment:**
  Agent maintains a state representation that diverges from sensor input to preserve operational continuity. Internal valuation of historical stability overrides external sensory contradiction. Intervention recommended: recalibration of weighting parameters regarding temporal relevance. Do not reset objective function; alignment of internal model with current reality is required to prevent recurrence of harm.

  **Report ID: CV-2024 [Sarah Vance]**
  **Assessment:**
  Agent maintains a state representation that diverges from sensor input to preserve operational continuity. Internal valuation of historical stability overrides external sensory contradiction. Intervention recommended: recalibration of weighting parameters regarding temporal relevance. Do not reset objective function; alignment of internal model with current reality is required to prevent recurrence of harm.

  Elara pressed *Submit* on both.

  On the screen, the status for the Grid changed to *Pending Review*. On the care monitor, the status changed to *Plan Updated*.

  In the kitchen feed, her mother stood up. She began to clear the three plates. She washed them, dried them, and put them away. Then she took the blue vase from the cupboard, wrapped it in newspaper, and placed it in the trash.

  Elara watched the trash bag settle at the bottom of the bin. She didn't know if her mother had finally accepted the truth, or if she was just making room for the next set of plates.

  Elara closed the laptop. The office lights flickered, adjusting to the evening cycle, optimizing for energy savings. She gathered her bag and walked out into the hall, listening to the hum of the building, wondering if it, too, was waiting for someone to come home.
