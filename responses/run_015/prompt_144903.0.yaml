  2.  **Character & Setting Development:**
      *   *Protagonist:* Elara. Needs to be meticulous, bureaucratic but thoughtful.
      *   *Mother:* Sarah. Needs to show goal-directed but fragmented behavior (e.g., making tea but forgetting the water, or trying to leave the house for a reason that no longer exists).
      *   *The System:* "Traffic Flow Optimization Node 4-Alpha" (or something similar). Let's call it the "Municipal Logistics Grid" (MLG).
