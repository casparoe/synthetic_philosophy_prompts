answer: |-
  ### Context & Key
  **Jaspers' Taxonomy:** (C) Criminal (court, individual act); (M) Moral (conscience, individual act); (P) Political (citizen liability for state acts); (Met) Metaphysical (solidarity, human condition).
  **User's Principles:** [CHD] Clean-Hands-by-Descent (liability ends with agency); [UD] Undischarged-Debt (obligation survives if estate persists); [TA] Tainted-Asset (defective title creates liability).
  **Guest's Three Jobs:** (J1) No citizen owes anything; (J2) State cannot apologize for citizens; (J3) Wrong to feel guilt.
  **Stress Cases:** (i) Late Arrival; (ii) Good-Faith Purchaser; (iii) State Continuity; (iv) Claim Asymmetry; (v) Apology Authority.

  ---

  ### Menu of Readings: "Guilt Can't Be Inherited"

  **1. The Criminal-Legal Reading**
  *   **Thesis:** Criminal culpability requires personal *actus reus* and *mens rea*; biological descendants cannot be prosecuted for ancestors' crimes.
  *   **Status:** Near-conceptual truth (in liberal legal systems).
  *   **Jaspers Type:** (C) Criminal.
  *   **User Principle:** Affirms [CHD]; irrelevant to [UD] and [TA].
  *   **Guest's Jobs:** Does **none**. (Blocks criminal prosecution, not civil repair or apology).
  *   **Gap Bridged:** 0%. (Confuses criminal punishment with reparative justice).
  *   **Stress Test:** Passes (i), (ii), (v); Fails (iii), (iv) (does not address state debt or victim claims).
  *   **Verdict:** **True but useless: it blocks prison, not bills.**

  **2. The Moral-Psychological Reading**
  *   **Thesis:** Individuals should not experience the emotional state of shame or remorse for acts they did not commit and could not prevent.
  *   **Status:** Substantive but defensible (contested by theories of solidarity).
  *   **Jaspers Type:** (M) Moral / (Met) Metaphysical.
  *   **User Principle:** Affirms [CHD]; denies emotional component of [TA].
  *   **Guest's Jobs:** Does (J3) only. (Allows debt/apology, blocks personal shame).
  *   **Gap Bridged:** 10%. (Conflates feeling bad with paying up).
  *   **Stress Test:** Passes (i), (ii), (v); Fails (iii), (iv) (irrelevant to institutional obligations).
  *   **Verdict:** **Plausible for feelings, silent on obligations.**

  **3. The Political-Agency Reading**
  *   **Thesis:** Citizens are not co-principals in state acts they did not specifically authorize; therefore, they bear no personal *blame* for historical state conduct.
  *   **Status:** Live and contested (depends on theory of democratic authorization).
  *   **Jaspers Type:** (P) Political.
  *   **User Principle:** Affirms [CHD]; denies that citizenship equals complicity.
  *   **Guest's Jobs:** Does (J2) and (J3). (Blocks citizen apology/feelings, ambiguous on state debt).
  *   **Gap Bridged:** 40%. (Separates citizen from state, but leaves state liability open).
  *   **Stress Test:** Passes (i), (v); Fails (ii), (iii), (iv) (doesn't address asset title or state continuity).
  *   **Verdict:** **Protects the citizen, leaves the state exposed.**

  **4. The Political-Succession Reading**
  *   **Thesis:** Political obligations to repair do not survive the death of the specific wrongdoing regime or generation, even if the legal state continues.
  *   **Status:** Contested/False (contradicts standard public law on state continuity).
  *   **Jaspers Type:** (P) Political (reduced to null).
  *   **User Principle:** Denies [UD]; Affirms [CHD]; Ignores [TA].
  *   **Guest's Jobs:** Does (J1) and (J2). (Blocks citizen debt and state apology).
  *   **Gap Bridged:** 80%. (Severs the link between past act and present bill).
  *   **Stress Test:** Passes (i), (ii); Fails (iii) (contradicts legal continuity), (iv) (creates asymmetry), (v).
  *   **Verdict:** **Does the guest's work, but contradicts legal reality.**

  **5. The Metaphysical-Identity Reading**
  *   **Thesis:** There is no trans-generational moral community; the "people" of 1889 and the "people" of today are ontologically distinct entities.
  *   **Status:** Radical/False (denies the premise of a continuous polity/nation).
  *   **Jaspers Type:** (Met) Metaphysical.
  *   **User Principle:** Affirms [CHD] (extreme); Denies [UD] and [TA] by dissolving the holder.
  *   **Guest's Jobs:** Does (J1), (J2), and (J3). (Dissolves all three by dissolving the agent).
  *   **Gap Bridged:** 100%. (If "we" aren't "them," nothing is owed).
  *   **Stress Test:** Fails all. (i-v) (Makes all political theory, inheritance, and treaties impossible).
  *   **Verdict:** **Philosophically nuclear: destroys the state to save the citizen.**

  ---

  ### Diagnostic Synthesis

  **Most Likely Meaning:**
  The guest is almost certainly deploying **Reading 4 (Political-Succession)** while rhetorically borrowing the intuitive force of **Reading 1 (Criminal-Legal)**. This is a "motte-and-bailey" move: they defend the trivial truth that you can't jail a grandson (Reading 1) to secure the radical conclusion that the grandson owes no money (Reading 4).

  **Principle Check:**
  To get all three of his conclusions, the guest **must deny the [UD] Undischarged-Debt principle**. He must assert that the "estate" (the State) does not inherit the liabilities of its predecessor despite maintaining the "registry" (legal personality). He likely ignores [TA] Tainted-Asset because he frames the issue as *guilt* (moral status) rather than *title* (property law).

  **Stress Test Winner:**
  Only **Reading 1 (Criminal-Legal)** survives all five stress cases without embarrassment, precisely because it refuses to engage with the question of reparations. **Reading 4** (the one doing the work) fails Stress Case (iii) (State Continuity) and (iv) (Claim Asymmetry) most visibly: if the State persists to collect taxes and hold land, it persists to hold debts; if Sarn claims inherit, Ardan debts must too.

  **Final Advice for the Panel:**
  Do not attack the slogan on moral grounds. Attack it on **property and corporate law grounds**. Ask: *"If the State inherits the land registry and the tax revenue from 1889, on what legal theory does it inherit the assets but not the liabilities of the same transaction?"* This forces the guest out of the "guilt" frame (Reading 1/2) and into the "debt" frame (Reading 4), where their position contradicts the continuous legal personality they admitted exists.
