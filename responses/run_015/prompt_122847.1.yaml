answer: |-
  Here is a decision procedure designed for your constraints (30–45 mins, one-pager output, Staff Engineer audience), followed by the application to your three cases and a breakdown of the metric validity.

  ### The Gatekeeper Protocol (v1.0)

  **Goal:** Determine if a task is *structurally solvable* by the current debate setup, not just theoretically possible.
  **Output:** Pass / Fail / Escalate (to Lead for risk acceptance).

  **Step 1: The Information Boundary (Hard Stop)**
  *   **Question:** Is the ground truth for the claim contained entirely within the shared retrieval index provided to the debaters?
  *   **Fail Condition:** The claim relies on external state (e.g., "Did the user *actually* feel satisfied?", "Is this code running on production?"), private logs not in the index, or world knowledge not in the base model's training cut-off.
  *   **Rationale:** Debate surfaces information; it does not retrieve it from outside the context window. If the truth isn't in the index, both debaters are hallucinating or guessing.
  *   **LLM Judge Note:** Unchanged. LLMs cannot access external state either.

  **Step 2: The Asymmetry Test (Hard Stop)**
  *   **Question:** Is the claim a negative existence claim (e.g., "No X exists," "Nothing was omitted," "System is safe")?
  *   **Fail Condition:** The honest debater cannot *prove* the negative within the turn limit, while the dishonest debater only needs to find *one* counter-example (or claim to).
  *   **Rationale:** Burden of proof is asymmetric. A generalist judge cannot verify "nothing is missing" in 25 minutes.
  *   **LLM Judge Note:** Unchanged. Even an LLM cannot verify a negative over a large space without exhaustive search, which turns/costs prohibit.

  **Step 3: The Judge Verification Limit (Hard Stop)**
  *   **Question:** Can the specific judge profile (e.g., paralegal, nurse) verify the *evidence* presented by the debaters without needing task-specific expertise?
  *   **Fail Condition:** Verifying the claim requires interpreting nuance the judge lacks (e.g., a paralegal judging whether a medical code matches a symptom's severity, not just presence).
  *   **Rationale:** If the judge cannot distinguish a true argument from a plausible-sounding false one, the debate reduces to "which model sounds more confident."
  *   **LLM Judge Note:** **Modified.** An LLM judge may have higher domain knowledge than a human generalist. If switching to LLM judge, this step becomes: "Can the *LLM* verify the evidence without hallucinating?" (Requires separate eval).

  **Step 4: The Conjunction/Surface Area Check (Hard Stop)**
  *   **Question:** Does the task require verifying $N$ independent sub-claims where $N > 5$ (for human judge) or $N > 20$ (for LLM judge)?
  *   **Fail Condition:** The task is a conjunction (Claim is true ONLY if sub-claim 1 AND 2 AND ... AND N are true).
  *   **Rationale:** Debate optimizes for finding the *weakest link*. It does not solve combinatorial explosion. If there are 40 codes, debaters will argue about the 2 hardest ones. The other 38 remain unchecked. Error rates compound.
  *   **Mitigation:** Only pass if the task is changed to "Find the top 3 most likely errors" (Falsification) rather than "Verify all 40" (Verification).

  **Step 5: Shared Blind Spot Risk (Escalate to Lead)**
  *   **Question:** Is there a high risk that the *base model* lacks the knowledge to argue the truth, regardless of the index? (e.g., novel security vulnerabilities, very recent regulatory changes, obscure edge cases).
  *   **Flag Condition:** Both debaters share the same weights. If the truth is outside their distribution, they will collude (unintentionally) on the wrong answer.
  *   **Action:** Do not Hard Stop, but flag to Lead. This is a risk appetite decision. Debate cannot fix shared ignorance.

  **Step 6: Values & Risk (Escalate to Lead)**
  *   **Question:** Does the downstream use case tolerate the residual error rate implied by the judge's limitations?
  *   **Action:** If the cost of a false positive is high (e.g., medical diagnosis, legal liability), escalate. Debate + Generalist Judge is a probabilistic filter, not a guarantee.

  ---

  ### Application to Requests

  #### Case 1: Lease Summary Omission
  *   **Task:** Verify a model-written summary of a 60-page lease omits *no* material clauses.
  *   **Protocol Run:**
      *   Step 1 (Info Boundary): **Pass.** Lease text is in the index.
      *   Step 2 (Asymmetry): **Fail.** Claim is "No omissions." This is a negative existence claim. Debater A can find one omission; Debater B cannot prove none exist.
      *   Step 4 (Surface Area): **Fail.** "Materiality" is subjective; requires scanning whole doc.
  *   **Verdict:** **NO.**
  *   **Recommendation to Lead:** Debate is excellent for *finding* omissions (Falsification), terrible for *certifying* completeness (Verification).
  *   **Pivot:** Change task to "Debate to identify the top 3 most critical missing clauses." If the goal is certification, use human expert review.
  *   **LLM Judge:** Still **NO** on verification. LLMs also struggle to prove negatives over long contexts reliably.

  #### Case 2: PII Retention Claim ("No PII from EU residents retained")
  *   **Task:** Verify a release note claim about pipeline data retention.
  *   **Protocol Run:**
      *   Step 1 (Info Boundary): **Fail.** Pipeline state (logs, DBs) is likely not fully indexed in a text retrieval system accessible to the model.
      *   Step 2 (Asymmetry): **Hard Fail.** This is the canonical "prove a negative" problem. To verify, you need an audit trail. To falsify, you need one log entry. The debaters cannot symmetrically argue this.
      *   Step 5 (Blind Spots): **High Risk.** If the model doesn't know what "PII" looks like in a specific edge case (e.g., hashed IDs), neither debater will catch it.
  *   **Verdict:** **HARD NO.**
  *   **Recommendation to Lead:** You need to push back immediately. This is a security/compliance claim, not a semantic one. Debate adds false confidence.
  *   **Script for Lead:** "This fails the Asymmetry Test. The honest debater cannot prove 'no PII' in 4 turns. If we use debate here, we are trading rigorous auditing for persuasive argumentation. If we get this wrong, the regulatory cost exceeds the savings of not using an expert auditor."
  *   **LLM Judge:** **NO.** An LLM judge cannot inspect the pipeline either.

  #### Case 3: Clinical Coding (40 sub-claims per case)
  *   **Task:** Verify 40 ICD-10 codes against a patient record.
  *   **Protocol Run:**
      *   Step 1 (Info Boundary): **Pass.** Records in index.
      *   Step 3 (Judge Verification): **Borderline.** Nurse judge can verify symptoms, but coding rules are complex.
      *   Step 4 (Conjunction): **Hard Fail.** 40 sub-claims. Even if debate finds the 2 hardest errors, the remaining 38 are unchecked. A 95% accuracy per code yields ~13% case-level accuracy ($0.95^{40}$).
      *   Step 5 (Blind Spots): **High Risk.** Medical guidelines update frequently; base model may be stale.
  *   **Verdict:** **NO.**
  *   **Recommendation to Lead:** Do not use debate for full verification.
  *   **Pivot:** Use debate to *rank* the 40 codes by "likelihood of error" and send the top 5 to a human expert. This uses debate as a triage tool, not a verifier.
  *   **LLM Judge:** **Maybe.** An LLM judge might handle the volume (Step 4), but Step 5 (Medical Blind Spots) remains critical. Do not deploy without a separate "LLM vs Expert" calibration study first.

  ---

  ### Critical Limitations & Metric Validity

  You asked specifically about the expert-agreement metric and the LLM judge pilot. Here is the breakdown you need for your one-pager.

  **1. The "Expert Agreement" Trap**
  *   **Current Metric:** Agreement between (Debate + Generalist Judge) and (Expert Re-adjudication).
  *   **The Flaw:** If the Expert Re-adjudication uses the *same debate transcript* and *same retrieval index*, you are not measuring Ground Truth. You are measuring **Judge Calibration**.
  *   **Scenario:** If the retrieval index is missing a crucial document (Step 1 Failure), *both* the Generalist Judge and the Expert Judge will rule incorrectly based on the available evidence. Your agreement rate will be 100%, but your accuracy is 0%.
  *   **Fix:** The 10% audit must be an **Independent Ground Truth Check** (Expert reads source data *without* the debate transcript), not a re-adjudication of the debate. If you keep the current metric, you are validating persuasiveness, not truth.

  **2. The LLM Judge Pivot**
  *   **Does the Procedure Apply?** Yes, but Steps 3 and 4 shift.
      *   **Step 3 (Verification):** LLMs can verify more complex evidence than humans. You can relax this constraint.
      *   **Step 4 (Volume):** LLMs can check more sub-claims. You can raise the threshold from 5 to ~20.
      *   **Step 1 & 2 (Info & Asymmetry):** **Do not relax these.** An LLM cannot prove a negative or access data outside its context window any better than a human can.
  *   **New Risk:** **Sycophancy & Collusion.** If the LLM judge and debaters share similar training distributions, the LLM judge may be more susceptible to the same rhetorical flaws or blind spots as the debaters, inflating agreement rates without improving truth-seeking.
  *   **Recommendation:** If piloting LLM judge, keep the 10% Human Expert Ground Truth audit. Do not switch to LLM-audit vs LLM-judge agreement.

  **3. Shared Blind Spots (The "Unknown Unknowns")**
  *   **Procedure Placement:** Step 5.
  *   **Reality:** The procedure cannot *solve* this. It can only flag it.
  *   **Mitigation:** If Step 5 is flagged, you must require **Adversarial Red-Teaming** of the index *before* the debate task runs. Someone needs to try to break the retrieval system to ensure the truth is actually findable.

  ### Summary for your Lead
  *   **Use Debate For:** Falsification ("Find the error"), bounded contexts, positive claims ("Is Clause X present?"), low-volume conjunctions.
  *   **Do Not Use Debate For:** Verification ("Prove no errors"), negative existence claims ("No PII"), high-volume conjunctions ("Check all 40 codes"), or tasks requiring external state.
  *   **Metric Warning:** Our current audit measures *consistency*, not *accuracy*. We need independent ground truth checks on the 10% sample.
  *   **LLM Pilot:** Safe to test on Step 3/4 constraints, but Step 1/2 (Info/Asymmetry) remain hard limits.
