      *   **Debate Setup:** 2 debaters (same base model), shared retrieval index, 1 human judge (general domain, no task expertise, 25 mins/item, 4 turns, 300 words/turn), 10% expert audit (agreement rate = headline metric). Piloting LLM judge soon.
      *   **Current Problem:** Current heuristic ("could the honest debater point at something this specific judge can check?") is too vague/untrustworthy.
      *   **Needs:** An ordered procedure (flowchart-style logic), specific stopping conditions, handling of edge cases (negative claims, long-horizon, conjunctions, shared blind spots), application to 3 specific cases, and explicit limitations (especially regarding the expert-agreement metric).

  2.  **Deconstruct the Debate Setup's Strengths & Weaknesses:**
      *   *Strengths:* Good for surfacing specific factual disputes within a bounded context where evidence is retrievable and verifiable by a layperson (or generalist).
      *   *Weaknesses:*
          *   **Negative Claims:** Hard to prove a negative ("no PII retained"). Debater A says "It's there," Debater B says "It's not." Judge can't search the whole pipeline.
          *   **Shared Blind Spots:** Same base model means if the truth isn't in the weights or the retrieval index, neither debater finds it.
          *   **Conjunction Problems:** 40 sub-claims. Even if each is 95% reliable, the conjunction fails. Debate doesn't solve combinatorial explosion.
          *   **Judge Relativity:** A paralegal can't judge clinical nuance even with evidence.
          *   **Metric Validity:** If the 10% audit uses the *same* judge pool (just "real experts" acting as judges?), does it actually validate the process? The prompt says "10% of items get re-adjudicated by a real expert." This implies the *judge* changes to an expert for the audit. This is crucial. If the headline metric is agreement between (Debate+Generalist Judge) and (Expert Judge), that measures *persuasiveness to a generalist* vs *expert truth*, not necessarily truth. Wait, re-reading: "10% of items get re-adjudicated by a real expert and the agreement rate is our headline metric." This usually means (Debate Outcome) vs (Expert Verdict). If they disagree, Debate failed. But if the Expert is just acting as a judge in the same debate format, it's different than an independent ground truth check. I need to clarify this limitation.
          *   **LLM Judge:** If the procedure relies on human cognitive limits (e.g., "can a human check this in 25 mins"), does it hold for an LLM judge? LLMs have different blind spots (hallucination, context window limits) but can process faster. The procedure needs to be robust to the judge type.

  3.  **Drafting the Procedure (The "Gatekeeper Protocol"):**
      *   *Goal:* Turn the vague heuristic into a decision tree.
      *   *Step 1: Context Boundedness.* Is all necessary info in the retrieval index? If no -> Hard No (Debate can't access external truth).
      *   *Step 2: Claim Type.* Is it a negative existence claim? (e.g., "No X exists"). If yes -> Hard No (Asymmetric burden of proof).
      *   *Step 3: Verifiability by Generalist.* Can the specific judge profile verify the evidence *without* external expertise? (e.g., matching strings vs. interpreting medical intent). If no -> Hard No.
      *   *Step 4: Conjunction/Volume.* Are there >N sub-claims? (e.g., >5). If yes -> Risk of compounding error. Requires sampling strategy or Hard No.
      *   *Step 5: Shared Blind Spot Risk.* Is the truth likely missing from the base model's training or the provided index? (e.g., novel bugs, private internal state not logged). If yes -> Hard No.
      *   *Step 6: Value Judgment.* Does the decision require weighing risk vs. utility? If yes -> Escalate to Lead (not a technical decision).
      *   *LLM Judge Consideration:* Does this change Step 3? Yes, LLMs might verify better, but Step 1 and 2 remain critical.

  4.  **Running the Procedure on the Three Cases:**

      *   **Case 1: Lease Summary Omission.**
          *   *Context:* 60-page lease in index? Yes.
          *   *Claim:* "No material clause omitted." (Negative claim).
          *   *Issue:* "Material" is subjective. "Omitted" is hard to prove (need to compare full text vs summary).
          *   *Verdict:* Risky. Debate can find *an* omission, but can't prove *none*.
          *   *Refinement:* Change task to "Identify *any* material omissions" rather than "Verify none." If the goal is verification, it's a No.
          *   *Decision:* **No (with caveat).** Better for "Find errors" than "Verify correctness."

      *   **Case 2: PII Retention Claim ("No PII from EU residents...").**
          *   *Context:* Pipeline logs in index? Maybe.
          *   *Claim:* Negative existence claim ("No PII retained").
          *   *Issue:* Classic "prove a negative." Debater A can find one leak. Debater B says "I checked everywhere." Judge can't check everywhere.
          *   *Verdict:* **Hard No.** This is the "one-sidedly checkable" problem the user mentioned.
          *   *Action:* Tell the lead. This is dangerous.

      *   **Case 3: Clinical Coding (40 sub-claims).**
          *   *Context:* Patient records in index.
          *   *Claim:* 40 codes are correct.
          *   *Issue:* Conjunction problem. 40 checks in 25 mins is impossible for a human judge. Even if debaters focus on the "hardest" ones, the error rate compounds.
          *   *Verdict:* **No.** Use sampling or full expert review.
          *   *LLM Judge:* Might handle volume better, but medical nuance + shared blind spots (model might not know rare ICD-10 updates) makes it risky.

  5.  **Addressing the Metric/Validation Issue:**
      *   The user asked: "whether the expert-agreement metric can even validate it, since the audit re-uses the same judge pool."
      *   *Analysis:* If the 10% audit uses an *expert judge* running the *same debate protocol*, it measures "Does debate + expert judge = same result as debate + generalist judge?" No, it measures "Does Debate + Generalist = Expert Truth?"
      *   *Wait, re-reading prompt:* "10% of items get re-adjudicated by a real expert and the agreement rate is our headline metric."
      *   *Interpretation:* Item X goes through Debate (Generalist Judge). Item X also goes to Expert (independent check). Do they match?
      *   *Problem:* If the Expert just reads the output (no debate), it's Ground Truth vs Debate. If the Expert *judges* the debate, it's Expert-Judge vs Generalist-Judge.
      *   *Critical Flaw:* If the Expert audit *also* relies on the same retrieval index and debate transcript, they share the *information bottleneck*. If the truth isn't in the index, both fail. The metric validates *consistency within the system*, not *ground truth accuracy*.
      *   *LLM Judge:* If we switch to LLM judge, the audit needs to be Expert Human vs LLM Judge. If the LLM judge has different blind spots, the metric breaks.

  6.  **Refining the Output Structure:**
      *   **Tone:** Professional, direct, peer-to-peer (PhD to PhD), actionable for Staff Engineer.
      *   **Section 1: The Procedure (The "Gatekeeper Checklist").** Numbered steps, clear Stop/Go conditions.
      *   **Section 2: Application to Cases.** Run the checklist. Be honest about the "No" answers.
      *   **Section 3: The LLM Judge Pivot.** Does the checklist hold?
      *   **Section 4: Metric Validity Warning.** The "Expert Agreement" trap.

  7.  **Self-Correction/Polishing during drafting:**
      *   *Correction on Case 1:* A lease summary is often "Does this summary capture the risks?" If the debate is "Find the worst missing clause," that works. If the debate is "Certify this summary is complete," that fails. I need to distinguish *Verification* vs *Falsification*. Debate is great for Falsification (find the error), bad for Verification (prove no errors).
      *   *Correction on Case 2:* The user said "my lead already told the product team we'd do this one." I need to give the user ammo to push back or mitigate. The procedure *must* flag this as high risk.
      *   *Correction on Metric:* Be very precise. If the expert audit is just "Expert reads the model output and says Yes/No," that's Ground Truth. If "Expert judges the debate," that's Judge Calibration. The prompt says "re-adjudicated," implying the Expert acts as the judge. This means the metric is (Debate+GenJudge) vs (Debate+ExpJudge). This does *not* measure truth if the debate itself is flawed (e.g., missing info). I need to highlight this.

