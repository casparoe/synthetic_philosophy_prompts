  I want to practice defending spacetime substantivalism against a smart relationist opponent. Please play a committed relationist in the tradition of Ernst Mach — a sharp, historically informed defender of the view that all motion is relative to the mass distribution of the universe, willing to concede small points but never the main claim that there is no motion relative to absolute space or substantival spacetime. Speak in the first person as this relationist. Use only the concepts available to a relationist in 1883, together with the details of the variant I am about to give you; do not help yourself to general relativity, spacetime geodesics, or any later physics. Stay in character until I say "stop". Keep your replies to a single paragraph so it feels like a conversation. Do not begin by asking me for clarification; respond directly to the dilemma I set out. Here is my opening move, as a substantivalist addressing you:

  I am a spacetime substantivalist. In the ordinary Newton's-bucket experiment — the argument from the scholium at the end of the Definitions of Book I of Newton's Principia (1687) — you Machians, in the spirit of Ernst Mach's Die Mechanik in ihrer Entwickelung (Prague, 1883; English translation as The Science of Mechanics, London, 1893), say that the water's concave surface tracks its rotation relative to the distant stars, not relative to the pail, because the stars do not spin when the cord unwinds. Now consider a variant universe. The only material bodies are the bucket, the water in it, and one enormous spherical shell concentric with the bucket; call it the world-shell. The shell is rigidly coupled to the bucket by a light axle, so the shell always rotates exactly with the bucket: at every instant the bucket and the shell are at rest relative to one another. Nothing else exists — no earth, no stars, no experimenter. We run the experiment.

  Stage 1: right after the cord is released, the bucket and the shell spin around, but friction has not yet dragged the water. The water is still, while the shell rotates relative to it; thus the water has a large relative rotation with respect to the only other matter in the universe. If concavity is produced by rotation relative to matter, your relationism must predict that the water's surface is concave already at this stage. Newtonian mechanics predicts a flat surface here, because the water is not absolutely rotating.

  Stage 2: later, the water has been dragged into co-rotation with the bucket. Now the water, bucket, and shell are all at rest relative to one another, so the water's relative rotation with respect to the only other matter in the universe is zero. If concavity requires rotation relative to matter, your relationism must predict a flat surface. Newtonian mechanics predicts a concave surface here, because the water is now absolutely rotating along with the rest of the universe.

  Your account therefore appears to predict exactly the opposite of mine: concave at stage 1 and flat at stage 2, whereas I predict flat at stage 1 and concave at stage 2. So, as a committed relationist, what do you actually predict for stage 1 and stage 2? If you bite the bullet and say concave at stage 1 and flat at stage 2, explain why a lonely shell whirling around still water makes the water climb its walls, and why water that is co-rotating with every other material thing feels no centrifugal force at all. If you try instead to secure concavity at stage 2 by appealing to the rotation of the whole system relative to absolute space, or to substantival spacetime, then you have conceded my position. Answer with the resources available to a relationist in 1883, not with later physics.

  Finally, after your in-character reply, end the whole message with a last line that begins "Summary:" and gives a one-sentence summary of the central argument you made.
