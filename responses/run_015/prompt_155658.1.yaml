prompt: |-
  I'm giving a seminar next Tuesday defending a paper that takes Singer's drowning child case and stretches it into what I'm calling a "chain-rescue" model: the idea isn't that distance doesn't matter, but that obligation travels along reliable causal chains like signal through a wire, weakening only with noise, not with miles. So I argue wealthy individuals have direct duties to fund climate adaptation for displaced populations, not just indirect duties to lobby their governments, because the intermediaries (NGOs, multilateral banks) are actually pretty high-fidelity conduits. The audience is mostly global-justice political theorists who are deep into Rawls and institutional design, plus two development economists who care a lot about moral hazard and crowding out state capacity. They're not anti-utilitarian exactly, but they think Singer-style individual obligations are either psychologically unrealistic or politically naive. I need a prep sheet for the Q&A: the objections they'll actually raise, in the vocabulary they'd use, ordered by how much damage each does, with a two-minute reply and a note on where that reply is soft. I also need to know what I should concede upfront—probably something about state failure—and the one question I'm praying nobody asks, which I think might be about whether my model implies I should also be obligated to rescue people from domestic poverty if the chain is just as short. Don't worry about bibliographies or citations; I just need the objections mapped out so I don't get blindsided. There's probaly a typo in my framing but I think the core idea is clear enough.
reasoning: |-
  Here's a thinking process that leads to the suggested prep sheet:

  1.  **Analyze the User's Request:**

      *   **Topic:** A paper extending Singer's "drowning child" analogy to a "chain-rescue" model.
      *   **Core Argument:** Obligation travels along reliable causal chains (NGOs, banks) without significant moral attenuation due to distance. Wealthy individuals have *direct* duties to fund climate adaptation, not just indirect duties to lobby states.
      *   **Audience:**
          *   Global-justice political theorists (Rawlsian, institutional design focused).
          *   Two development economists (concerned with moral hazard, crowding out state capacity).
          *   General stance: Skeptical of Singer-style individual obligations (psychologically unrealistic, politically naive).
      *   **Deliverable:** A Q&A prep sheet.
          *   Objections mapped by damage potential (High to Low).
          *   Vocabulary appropriate for the audience (Rawlsian, institutional, economic).
          *   Two-minute reply for each.
          *   "Soft spot" note for each reply.
          *   Upfront concessions (likely state failure).
          *   The "Dreaded Question" (domestic poverty obligation).
      *   **Constraints:** No bibliographies/citations needed. Focus on argument mapping.

  2.  **Deconstruct the Argument & Identify Weak Points:**

      *   *Premise 1:* Singer's proximity principle is wrong; causal reliability matters more than spatial distance.
      *   *Premise 2:* Intermediaries (NGOs, banks) are high-fidelity conduits.
      *   *Conclusion:* Direct individual duty to fund adaptation exists.
      *   *Vulnerabilities:*
          *   **Institutionalists:** Why bypass the state? Doesn't this undermine the basic structure of justice? (Rawlsian objection).
          *   **Economists:** Does this create moral hazard? Does it let states off the hook? (Crowding out).
          *   **Psychological/Political:** Is this demanding too much of individuals? (Over-demandingness).
          *   **Epistemic:** How do you *know* the chain is high-fidelity? (Uncertainty).
          *   **Scope:** If the chain works domestically, why stop at borders? (The "Dreaded Question").

  3.  **Drafting the Objections (Iterative Process):**

      *   *Objection 1 (The Big One):* The Institutional Objection. Rawlsians hate the idea that individual charity replaces justice.
          *   *Vocab:* Basic structure, division of moral labor, institutional vs. individual duty.
          *   *Reply:* Institutions are the *means*, not the *source*. If institutions fail, the duty reverts.
          *   *Soft Spot:* Defining "failure."
      *   *Objection 2 (The Econ One):* Moral Hazard/Crowding Out.
          *   *Vocab:* Fungibility, state capacity, perverse incentives.
          *   *Reply:* Adaptation is urgent; we can't wait for perfect state incentives. Targeted funding avoids general budget support.
          *   *Soft Spot:* Hard to prove fungibility isn't happening.
      *   *Objection 3 (The Epistemic One):* Chain Fidelity.
          *   *Vocab:* Information asymmetry, transaction costs, noise.
          *   *Reply:* We have data on NGO effectiveness. It's better than doing nothing.
          *   *Soft Spot:* Data is often optimistic.
      *   *Objection 4 (The Political One):* Depoliticization.
          *   *Vocab:* Structural injustice, neoliberal privatization of responsibility.
          *   *Reply:* It's a stopgap, not a replacement. Keeps pressure on.
          *   *Soft Spot:* Stopgaps often become permanent.

  4.  **Addressing Specific User Requests:**

      *   *Concession:* Need to concede that *ideal* theory prefers state action. The "chain-rescue" is non-ideal theory.
      *   *The Dreaded Question:* Domestic poverty. If distance doesn't matter, why not fix homelessness here?
          *   *Strategy:* Differentiate *capacity* to rescue vs. *obligation* source. Or argue the causal chain for climate is more direct/urgent. (Actually, the strongest move is usually to accept the implication but distinguish the *mechanism* of harm).

  5.  **Refining the Tone and Vocabulary:**

      *   Ensure terms like "basic structure," "non-ideal theory," "fungibility," and "moral division of labor" are used correctly.
      *   Keep replies punchy (2-minute read time).
      *   Be honest about the "soft spots" (where the argument is vulnerable).

  6.  **Final Review against Constraints:**

      *   Did I order by damage? Yes (Institutional > Economic > Epistemic > Political).
      *   Is the "Dreaded Question" included? Yes.
      *   Is the upfront concession clear? Yes.
      *   No citations? Checked.

  7.  **Self-Correction Example during drafting:**
      *   *Initial thought:* Tell them to argue that NGOs are better than states.
      *   *Correction:* No, the economists will eat that alive. Better to argue NGOs are *sufficient* conduits for *emergency* duties, not necessarily better for long-term development. Stick to the "climate adaptation" urgency.
      *   *Initial thought:* Deny the domestic obligation.
      *   *Correction:* Dangerous. If the principle is "causal chain," domestic chains are often shorter. Better to admit the obligation exists but argue the *severity* of climate displacement creates a lexical priority. Or, acknowledge the consistency but frame it as a feature, not a bug. Let's go with the "lexical priority of existential threat" angle for the reply.

  8.  **Final Polish:** Organize into a clean, readable "Prep Sheet" format. (Proceed to generate output).

  *(Self-Correction on the "Dreaded Question"):* The user suspects the question is about domestic poverty. I need to make sure the answer doesn't collapse the whole argument. If I say "Yes, I am obligated," does that undermine the climate argument? No, it makes it consistent. If I say "No," I break the "distance doesn't matter" rule. The best answer is "Yes, but..." (Priority of harm).

  *(Refining the Concession):* The user suggested conceding "state failure." I should refine that to "Non-Ideal Theory." It sounds more sophisticated to the Rawlsians. "In the ideal theory, states do this. In non-ideal, we need chains."

  *(Refining the Objections):* Make sure the "Division of Moral Labor" objection is #1. That is the killer for Rawlsians.

