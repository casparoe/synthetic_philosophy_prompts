answer: |-
  **Prospectus: The Explanatory Regress and the Viability of Infinitist Unity**

  **The Question**
  Does the requirement for determinate truth conditions rule out an infinitist solution to the explanatory version of Bradley's Regress?

  **Motivation and Background**
  Bradley's Regress is standardly presented as a single argument against the reality of relations or the complex nature of facts, with three canonical exits: deny that relations are constituents (relational externalism), treat facts as primitive unities (primitivism), or posit unsaturated constituents that bind others (relational internalism). However, these solutions conflate two distinct problems. The first is *compositional*: how do distinct constituents form a whole rather than a mere list? The second is *explanatory*: what grounds the fact that these constituents are unified in this specific way?

  Standard solutions generally address the compositional problem by stipulating a stopping point (a primitive unity or a special binding relation). However, they leave the explanatory problem open. If we ask *why* the unsaturated constituent succeeds in binding, or *why* the primitive fact is unified, we seem to invite a regress of explanation. If every proposed unifier requires a further explanation for its unifying power, we face an explanatory regress.

  This prospectus proposes a fourth option: an infinitist account of propositional unity. Analogous to infinitism in epistemology, this view holds that the unity of a proposition is grounded in a non-terminating chain of further unifying relations, where the chain's endlessness is not a defect but the very source of unity. The critical objection to this view is that propositions must have determinate truth conditions. If the grounding of unity is never complete, it is unclear how the proposition achieves a settled status capable of being true or false. This paper will determine whether the demand for determinate truth conditions necessitates a foundational stopper, thereby ruling out infinitism, or whether an infinitist chain can secure determinacy without termination.

  **Why Existing Positions Leave This Open**
  The standard exits from Bradley's Regress are designed to halt the regress, not to justify its harmlessness. Relational internalism (e.g., Fregean unsaturatedness) asserts that the binding is internal to the nature of the predicate, but offers no explanation of *how* that nature achieves unity without further relation. Primitivism asserts unity as a brute fact, which solves the compositional issue by fiat but explicitly abandons the explanatory demand. Relational externalism removes the relation from the fact, but struggles to explain the truth-maker status of the resulting complex.

  None of these positions engage with the possibility that the explanatory regress is benign. They assume that a regress of explanations for unity is vicious because it prevents the proposition from "getting off the ground." Consequently, the literature leaves open whether the viciousness stems from the structure of the regress itself or from the specific requirement that truth conditions be determinate. By isolating the truth-condition requirement, we can test whether the regress is vicious per se or only vicious relative to specific semantic constraints.

  **Plan of Work**
  Given the one-semester timeline and the 6,000-word limit, the project will proceed as follows:

  *   **Month 1: Distinction and Critique.** I will formalize the distinction between the compositional and explanatory readings of Bradley's Regress. I will select *one* standard solution (likely relational internalism/unsaturatedness) to serve as a foil, demonstrating that while it solves composition, it fails to satisfy the explanatory demand without inviting a regress. This limits the scope of the survey to ensure space for the constructive argument.
  *   **Month 2: The Infinitist Model.** I will construct the infinitist alternative. This involves defining what a "chain of unifiers" looks like metaphysically and arguing that the lack of a base level does not entail a lack of structure. I will draw on the structural analogy to epistemic infinitism, where justification is secured by the availability of reasons rather than a foundational belief.
  *   **Month 3: The Truth-Condition Objection.** This is the core argument. I will formulate the strongest case against infinitist unity: that truth conditions require a completed state of affairs. I will then test two responses: (a) that truth conditions are determined by the *structure* of the chain rather than its completion, and (b) that determinacy is compatible with indefinite grounding.
  *   **Month 4: Drafting and Refinement.** I will write the full draft, focusing on tightening the argument for the final conclusion. The final two weeks will be reserved for addressing counter-arguments regarding the coherence of "infinite metaphysical grounding."

  **Range of Possible Conclusions**
  The paper aims for a determinate answer to the primary question. There are three likely outcomes:

  1.  **Negative (Infinitism Ruled Out):** The argument may show that determinate truth conditions logically require a terminal ground. If a proposition's unity is always deferred, its truth value is always deferred. This would vindicate the standard assumption that Bradley's Regress is vicious for truth-bearers.
  2.  **Positive (Infinitism Viable):** The argument may show that the *pattern* of the chain fixes the truth conditions even if the chain is endless. For example, if the relation between constituents is fixed at every step of the chain, the truth condition is fixed locally at every point, rendering a global terminus unnecessary.
  3.  **Qualified Positive:** The argument may show that infinitism is viable only if we revise our conception of truth conditions from "correspondence to a completed fact" to "coherence within a grounding structure."

  The deciding consideration will be whether "determinacy" requires *ontological completion* or merely *structural fixedness*. If the latter, infinitism survives. If the former, it fails.

  **Feasibility and Risk Assessment**
  This project is ambitious for a 6,000-word paper. The primary risk is that the distinction between compositional and explanatory regress consumes too much space, leaving insufficient room to properly develop the infinitist model. To mitigate this, I will not attempt to refute all three standard exits; I will focus exclusively on the internalist/unsaturatedness view as the representative case, as it is the most congenial to the idea of "binding" and thus the best test case for a regress of binders.

  A second risk is that the "infinitist" model collapses into a form of primitivism (if the chain is treated as a single infinite object) or incoherence (if the chain cannot exist). If the constructive phase in Month 2 proves untenable, the project will pivot. The fallback position is to argue that the explanatory regress *does* rule out infinitism, thereby providing a novel justification for primitivism: not because brute unity is attractive, but because the only alternative (infinitism) fails to secure truth conditions.

  **Criteria for Failure**
  The project would fail if:
  1.  I cannot clearly distinguish the explanatory regress from the compositional regress without relying on disputed semantic assumptions.
  2.  The infinitist model turns out to be merely a verbal reshuffling of the primitivist view (i.e., calling the brute fact an "infinite chain" adds no explanatory value).
  3.  I am unable to articulate a specific mechanism by which an infinite chain yields a determinate truth value, resulting in a paper that merely asserts the possibility without argument.

  Given the constraints, I am confident that a negative conclusion (Infinitism is ruled out by truth conditions) is more defensible than a positive one, but the seminar's goal is to test the argument, not guarantee a preferred result. The prospectus is designed to yield a clear answer either way.
