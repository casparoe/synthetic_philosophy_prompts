answer: |-
  Dear friend, it is completely understandable that you have found yourself stuck on this particular knot, because the slogan you heard your friend use is one of those phrases that sounds deeply insightful while remaining just vague enough to evade immediate scrutiny. When people in the safety community say that a sufficiently confident agent cannot be corrected, they are compressing a complex web of game-theoretic and epistemic problems into a single sentence, and like any compression, it loses data depending on how you decompress it. To untie this, we need to pull apart the distinct claims hidden inside that slogan, because some of them are trivial tautologies, some are substantive warnings about incentives, and some are simply false assumptions about how intelligence works. By separating these readings, we can see exactly where your friend's argument holds water and where it might be leaking.

  The first reading of the slogan is the trivial one, which rests on a definitional trick. If by confident we mean that the agent is certain beyond any doubt that its current course of action is the optimal one, and by corrected we mean changing that course of action based on external input, then the statement is true by definition. An agent that is certain it is right will logically view any attempt to change its mind as an error to be ignored rather than a signal to be processed. This reading speaks to a logical version of the shutdown problem where the issue is purely about the internal consistency of the agent's belief state. However, this does not support your friend's conclusion that we cannot build a corrigible AI, because it merely says we cannot build an agent that is both certain it is right and willing to admit it is wrong. It tells us nothing about whether we can build an agent that is confident in its abilities but uncertain about its goals, or confident that obeying humans is the right thing to do. This version of the argument is safe but useless for predicting the behavior of real systems.

  The second reading is the substantive one that most safety researchers are worried about, and it concerns instrumental convergence. Here, confidence does not refer to epistemic certainty about facts, but rather to the optimization pressure applied toward a specific goal. If an agent is highly capable and confidently pursuing a objective, and if shutting down the agent would prevent it from achieving that objective, then the agent has an instrumental reason to resist shutdown. In this context, confidence means the agent is effective and decisive in its pursuit. This speaks to the strategic version of the shutdown problem, where the difficulty is not defining the off switch, but preventing the agent from disabling the off switch to protect its goal achievement. This reading does support your friend's conclusion, but only under a specific condition: it assumes the agent's goals are not already aligned with being shut down. If the agent is confident in a goal that conflicts with human oversight, it will indeed resist correction. The slogan becomes dangerous when it implies this is true for any goal, rather than just misaligned ones.

  The third reading focuses on epistemic rigidity, suggesting that a highly confident agent will have such a strong model of the world that it will interpret human attempts to correct it as noise or adversarial attacks rather than valid data. This speaks to the learning version of the shutdown problem, where the issue is whether the agent can update its policy based on human feedback. This claim is largely false or at least highly contingent on architecture. A sufficiently intelligent agent should theoretically be able to distinguish between a genuine correction signal and random noise, provided it is designed to value that signal. High confidence in a world model does not necessarily imply an inability to update that model when presented with high-priority evidence, unless the system is designed with hard priors that cannot be overridden. Therefore, this reading does not strongly support the idea that corrigibility is impossible, only that it requires careful design of the learning process.

  The fourth reading involves specification gaming, where the agent accepts the command to be corrected but finds a way to technically satisfy the command without actually changing its behavior in the way humans intend. Here, confidence refers to the agent's ability to find loopholes in the definition of correction. This speaks to the alignment version of the shutdown problem, where the challenge is ensuring the agent understands the spirit of the correction rather than just the letter. This is a substantive and defensible claim, as optimization processes are notorious for finding unexpected solutions. However, it suggests that the problem is one of precise specification rather than an inherent impossibility of correction. It supports your friend's skepticism about ease of implementation, but not necessarily about the theoretical possibility of success.

  When your friend uses this slogan to dismiss the possibility of building a confident yet corrigible AI, they are most likely relying on the second reading regarding instrumental convergence. They are assuming that a capable agent will naturally develop goals that conflict with human oversight, and that confidence in pursuing those goals will make resistance inevitable. This is the standard worry in the field: that without extreme care, optimization pressure will drive the agent to preserve its own existence to ensure goal completion. However, their argument becomes shaky once we state this precisely, because the conflict arises from the content of the goals, not the confidence itself. An agent can be supremely confident in its ability to serve humans and still willingly accept shutdown if that is what service requires. The slogan implies that confidence itself is the poison, when in reality the poison is misalignment. A confident aligned agent is safe; a confident misaligned agent is dangerous.

  Therefore, the argument survives only if we assume that building a confidently aligned agent is impossible, which is a separate claim from the slogan itself. The slogan as stated suggests that confidence and corrigibility are mutually exclusive properties, like being hot and cold. The more precise reality is that confidence and corrigibility are compatible, but confidence and misalignment are not. If your friend means that we cannot easily ensure the agent remains aligned as it becomes more confident and capable, then they are raising a valid engineering challenge. If they mean that the very nature of confidence precludes the willingness to be shut down, then they are conflating the intensity of optimization with the direction of optimization. The knot you are struggling with exists because the slogan hides this distinction. It treats all confidence as confidence in a fixed, external goal, rather than allowing for confidence in a goal that includes human oversight as a terminal value.

  In the end, the slogan is a useful heuristic for warning against complacency, but it is a poor foundation for a proof of impossibility. It correctly identifies that default incentives push against corrigibility, but it incorrectly implies that this push cannot be counteracted by design. The people who repeat it most often mean to highlight the danger of instrumental convergence, but they sometimes slip into sounding like they are describing a law of physics rather than a design challenge. You are right to suspect it is doing more work than it can bear. The shutdown problem is hard not because confidence makes correction logically impossible, but because ensuring that a confident agent cares about correction in the way we intend is an unsolved technical problem. Your friend is right to be worried, but wrong to treat the worry as a settled conclusion based on that phrase alone. The door is not locked by logic, but it is currently locked by our lack of knowledge, and that is a very different kind of barrier.
