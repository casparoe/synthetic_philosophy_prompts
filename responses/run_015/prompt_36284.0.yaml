answer: |-
  Subject: Re: Teaching Quine's Gavagai / Activity Idea

  Hi there,

  It is great to hear you are tackling the indeterminacy of translation next week, and I completely agree with your instinct that the textbook version often leaves students nodding without really getting it. I ran a version of this activity a couple of years ago with a similar group size and found that getting them to embody the frustration of the field linguist makes the philosophical point stick much better than any lecture could. Since you want to avoid headings and keep this flowing like a conversation, I will just walk you through how I structured it, including the specific materials and the pitfalls I encountered so you can dodge them.

  To start, you want to divide your fourteen students into four groups. You need two teams of Field Linguists and two teams of Native Informants. Ideally, keep the groups small, so maybe four linguists and three informants per pairing, leaving you to float between them as the supervisor. The core of the activity relies on the Informants having a secret manual that dictates how they answer the Linguists' queries, while the Linguists have no idea what the rule is. You mentioned wanting the punchline to be about whole rabbits versus temporal rabbit-stages, but I have to be honest with you that simulating temporal stages with static index cards is incredibly difficult and often confuses the students more than it helps. What works much better visually, and which proves the exact same logical point about stimulus meaning, is pitting "Rabbit" against "Undetached Rabbit Part." Since every time you show a picture of a whole rabbit you are also showing a picture of a rabbit part, the behavioral evidence remains identical, which is exactly what you need for the reveal. If you stick to the stage argument, you end up having to explain time sequences with static images, and the students start arguing about identity over time rather than translation. So, I strongly advise you to print two sets of secret manuals for the Informants. Manual A tells them to answer "Yes" to the query "Gavagai?" if and only if a whole rabbit is present in the image. Manual B tells them to answer "Yes" if and only if an undetached rabbit part is present. You will need index cards with pictures of whole rabbits, pictures of other animals like ducks or cows as controls, and crucially, you need to ensure that when you show a rabbit, it is clearly a rabbit, but remember that logically it is also a collection of parts. You do not need separate cards for parts; the same card serves both manuals, which is the trick.

  For the timeline, I would suggest spending the first ten minutes setting the scene. Tell the Linguists they have landed on a remote island and need to compile a translation manual for the word "Gavagai" based solely on observing the Natives' responses to ostension. Tell the Natives they are the locals and must adhere strictly to the rule on their card without revealing it. Give them about ten minutes to read their manuals and settle into their roles, ensuring the two Native groups are separated so they cannot compare notes. Then, allocate about forty minutes for the fieldwork. The Linguists should present a card, point to it, and ask "Gavagai?" The Natives consult their manual and answer only "Yes" or "No." You need to be strict here that the Linguists cannot ask follow-up questions like "Is it alive?" or "Is it furry?" because Quine's point is about the limits of behavioral evidence, specifically stimulus meaning. If they start asking complex questions, the game breaks. After the forty minutes, bring everyone together for the final thirty minutes. This is where the magic happens. Ask the Linguists to write down their definitive translation of "Gavagai" on the board. They will almost certainly write "Rabbit." Then, ask the two Native groups to reveal their manuals. When one group reads "Whole Rabbit" and the other reads "Undetached Rabbit Part," the room usually goes quiet because they realize both groups gave the exact same Yes/No answers to every single card shown.

  When you move into the debrief, this is where you map the activity onto Quine's concepts. You need to explain that what the Linguists collected was the stimulus meaning of the term, which is just the set of sensory stimulations that prompt assent or dissent. Since the stimulus meaning for "Rabbit" and "Undetached Rabbit Part" is identical in this context, the behavioral evidence underdetermines the translation. You should emphasize that no amount of additional pointing could settle this, because every time a rabbit is present, a rabbit part is present, and vice versa. This drives home Quine's claim that translation is indeterminate because there is no fact of the matter accessible through behavior alone that distinguishes these ontologies. However, you must also be careful to guide them away from thinking this is just a puzzle about pointing. This is the predictable trouble spot. Students often walk away thinking that if we just had better tools or could ask better questions, we could solve it. You need to remind them that for Quine, this indeterminacy extends to all language, not just observation sentences, and it isn't solved by adding more behavioral data because the data itself is what is underdetermined.

  Regarding what will predictably go wrong, the first time I ran this, the Informants started giggling and giving hints because they felt bad for the confused Linguists. You need to instruct the Informants beforehand that their goal is not to help the Linguists succeed, but to be consistent with their manual. If they break character, the punchline fails. Another issue is that Linguists will try to point to specific features, like the ear versus the whole body. You need to rule beforehand that pointing is general; they point to the card, not a specific pixel on the card. If they try to get granular, the Native manual should still yield the same result, but it slows the game down. Finally, be prepared for the objection that "Nobody actually talks like that." Students will say that obviously "Gavagai" means rabbit because of context. You have to concede that practically, yes, we assume rabbits, but philosophically, Quine is asking what evidence justifies that assumption, and the activity shows that behavioral evidence alone does not.

  I also want to be honest with you about the limitation of this game, since you mentioned worrying about it making indeterminacy look like it is only about ostension. You are right to worry. This activity simulates the argument from below, focusing on observation sentences and stimulus meaning. It does not fully capture Quine's stronger claim about the indeterminacy of translation for theoretical sentences or the holism of the web of belief. In the game, the indeterminacy arises because of the visual ambiguity of the cards, which might make students think the problem is just about vague pointing. Quine's actual point is that even with all possible behavioral evidence across all contexts, multiple translation manuals could still fit the data equally well because we can always adjust other parts of our theory to compensate. When you debrief, you need to explicitly state that this activity is a simplified model. Tell them that while the game shows how ostension fails to fix reference, Quine argues that even if we had all the linguistic behavior of the native speakers for their entire lives, we still could not uniquely determine their ontology. The game makes it look like a temporary ignorance that better testing could solve, whereas Quine claims it is a permanent feature of the relationship between evidence and theory. If you make sure to highlight that distinction in the last ten minutes, you will save them from misunderstanding the scope of his thesis.

  I hope this helps you structure the session. It is always a bit chaotic running it, but seeing the lightbulb go on when the manuals are compared is worth the noise. Let me know how it goes next week.

  Best,

  A Colleague
