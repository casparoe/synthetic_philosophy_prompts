prompt: |-
  You are a senior research philosopher specializing in moral psychology and normative ethics. This task requires rigorous conceptual analysis rather than empirical summary. Before composing your response, please spend a moment brainstorming: identify the hidden assumptions that allow us to classify a moral judgment as either a preference or a bias, note how reference-frame dependence might complicate that classification, and outline the conditions under which cross-frame criticism remains coherent.

  Then, compare and contrast two frameworks for the preference-bias boundary in moral judgment. The first is the standard reflective-endorsement model, which treats moral preferences as stable, reflectively accessible weightings of normative considerations, and moral biases as systematic affective or cognitive distortions that persist even after reflective scrutiny. The second is the 'indexical calibration' framework—an approach that treats every moral judgment as implicitly anchored to the agent's social-epistemic position, so that an apparent bias from one coordinate system may be reconceptualized, within its native frame, as a calibrated preference constrained by locally valid information and role-specific obligations.

  Address the following: (1) How does each framework diagnose persistent disagreement between epistemic peers who share factual beliefs but assign radically different moral weights to distributive fairness? (2) Does the indexical calibration view genuinely dissolve the preference-bias distinction, or does it merely relocate the problem into a meta-level question about legitimate frame-selection? (3) Which framework provides a more defensible basis for moral self-correction and inter-subjective criticism without collapsing into either ungrounded universalism or uncritical relativism? Ground your answer in conceptual reasoning, avoid appeals to specific empirical studies, and do not request bibliographies, reading lists, or citations.
