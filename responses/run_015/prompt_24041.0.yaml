      2.  **The Method (15 mins):** Introduce heterophenomenology as the bridge.
      3.  **The Example (15 mins):** Apply it.
      4.  **Check & Close (10 mins).**

      **The Example:** *Dream Reporting*.
      *   **Needs:** High subjective certainty, zero objective verification.
      *   **Lacks:** Any way to confirm the dream content existed independently of the report.
      *   **Why:** It isolates the *report* from the *reality*. The datum is the utterance "I dreamed of flying," not the flying itself.

      **Misconceptions:**
      *   **"It's just introspection."** Defuse immediately after defining the term. Introspection is the subject's tool; heterophenomenology is the *researcher's stance*. We don't assume the subject is right; we assume their *belief* is a fact about them.
      *   **"It denies feelings."** Defuse during the Example. We aren't saying the dream didn't happen; we're saying science can only access the report.

      **Assessment Question:**
      "A patient claims intense pain, but nociceptors are silent. A heterophenomenologist records: (A) The patient is lying, (B) The pain is unreal, (C) The patient believes they are in pain." (Correct: C).

      **Explicit Omissions:**
      Tell them: "We are not solving the Hard Problem or denying qualia today." Dennett's metaphysics often overshadows his method. Keep it methodological. If you dive into eliminativism, they'll think it's just behaviorism.

