answer: |-
  **Sequence & Dependencies**
  1.  **The Privacy Problem (10 mins):** Elicit the **First-Person/Third-Person Gap**. Ask: "How do you know I'm conscious?" Students must feel the tension: science requires public data; consciousness seems private. Without this anxiety, heterophenomenology seems trivial.
  2.  **The Method (15 mins):** Introduce the term as the bridge.
  3.  **The Application (15 mins):** Apply to the example.
  4.  **Assessment (10 mins):** Test understanding.

  **Single Example: Dream Narratives**
  *   **Needs:** Vivid subjective certainty (the dream felt real).
  *   **Lacks:** External verification conditions (no camera in the brain).
  *   **Function:** Forces separation between the *phenomenon* (the dream) and the *text* (the report). The report is the only data available to science. It illustrates that the *belief* is the datum, not the dream content.

  **Misconceptions & Defusal**
  1.  **"This is just introspection."** Defuse at **Minute 25** (definition phase). Clarify: Introspection is the *subject's* act; heterophenomenology is the *scientist's stance* toward the resulting text. We bracket truth claims about the inner state.
  2.  **"It denies inner experience."** Defuse at **Minute 40** (example phase). Emphasize: We don't deny the experience; we deny *direct scientific access* to it. This prevents the "you're ignoring feelings" objection.

  **Assessment Question**
  "A subject says 'I saw red,' but physiology indicates green-processing. What is the heterophenomenological datum?"
  *   **Target Answer:** The subject's *belief* that they saw red, not the color itself.

  **Explicit Omissions**
  State clearly: **"We are not debating qualia eliminativism."** Dennett's metaphysics distracts from his method. If students think this is just behaviorism in disguise, you've lost them. Keep it methodological: *how* to study, not *what* exists. Say: "Today is about method, not metaphysics."
