  7.  **Final Polish:** Ensure the tone is appropriate for a 71-year-old expert talking to peers. Not condescending, but rigorous. (Self-Correction: Make sure not to accuse him of being a zombie-idealist, but point out the functionalist slip).

      *   *Wait, one nuance:* In (7), he says "Copy B is a perfectly good dashboard that just isn't plugged into anything." If the dashboard is a *display*, and nothing looks at it, is it on? In a computer, the frame buffer exists regardless of the monitor. But if consciousness is the *light* from the monitor...
      *   *Actually, the stronger point:* If consciousness is the *data structure* (2), Copy B has it. If consciousness is the *causal role* (7 implies this), Copy B lacks it. He needs to pick one. Given (4) and (3), Causal Role (Functionalism) fits his instrumentation background better than Pure Representationalism.

