answer: |-
  Your instincts are spot on. The guest on that podcast is presenting a specific, controversial philosophical position (largely associated with David Lewis and certain legal realists) as if it were settled consensus. While the summary captures one side of the debate accurately, it glosses over significant metaphysical and normative problems that most philosophers of causation take very seriously.

  Here is a breakdown of what a philosopher working on causation would accept, what they would push back on, and why the conclusion does not follow from the premises.

  ### 1. What Philosophers Would Accept
  **The Counterfactual Test Works for Omissions**
  The guest is correct that standard counterfactual theories of causation handle omissions easily. The "but-for" test (if $X$ had not occurred, $Y$ would not have occurred) applies to non-actions just as well as actions.
  *   *Example:* If the lifeguard *had* jumped in, the swimmer would not have died. Therefore, the lifeguard's *not* jumping in is a but-for cause of the death.
  *   **Verdict:** This is technically accurate. If you define causation purely via counterfactual dependence, omissions are causes.

  **The Law Often Treats Omissions as Causes**
  The guest is also right that the law recognizes causation by omission, but usually only when there is a pre-existing **duty of care**.
  *   **Verdict:** Accurate, but with a caveat. The law does not treat *all* omissions as causes (e.g., a random passerby usually isn't liable), only those where a specific duty exists. This hints that "causation" in law is doing normative work, not just metaphysical work.

  ### 2. What Philosophers Would Push Back On
  **The "Prejudice" Claim (The Metaphysical Objection)**
  The guest dismisses metaphysicians who resist omissions as causes as having a "prejudice" for physical events. This is a straw man. The objection is not about liking physics; it is about **ontological commitment** and **causal proliferation**.
  *   **The Problem of "Nothing":** Causation is typically understood as a relation between *events* or *facts* that exist. An omission is the absence of an event. How can "nothing" cause "something"? If we say absences are causes, causation is no longer a relation between existents.
  *   **The Proliferation Problem:** This is the biggest technical objection. If omissions are causes, then *everyone* who failed to save the drowning swimmer is a cause. The President didn't save the swimmer. I didn't save the swimmer. A person in Antarctica didn't save the swimmer. Counterfactually, if any of us had teleported there and saved them, the death wouldn't have happened.
      *   If we accept the guest's view, there are infinite causes for every death by omission. Most philosophers find this unacceptable. They argue we need a theory that explains why the *lifeguard's* omission is salient, while the *Antarctican's* omission is not. The counterfactual test alone cannot do this.

  **The Claim That There Is "No Real Difference"**
  The guest argues: *"Once you accept that omissions are causes, there's no real difference between causing harm by acting and causing harm by failing to act."*
  *   **Philosophical Pushback:** This is a non-sequitur. Even if both satisfy a definition of causation, there are structural differences.
      *   **Intervention:** An act introduces energy or a new chain of events. An omission allows an existing chain to proceed.
      *   **Default vs. Deviation:** Many philosophers (like Jonathan Schaffer) argue that causation relies on a contrast between what actually happened and a "default" expectation. Acts are deviations from the default; omissions are often the default. This structural difference matters for how we assign responsibility.

  ### 3. The Fatal Flaw: The Jump to Legal/Moral Equivalence
  The guest's conclusion is that because omissions are causes, the law is right to treat them the same as acts. This conflates **metaphysical causation** with **normative responsibility**.

  **The Act/Omission Distinction**
  Most moral and legal philosophers maintain that even if an omission *causes* a result, it is often less culpable than an act that causes the same result.
  *   **Example:** Turning off a ventilator (omission/allowing to die) vs. Injecting a lethal drug (act/killing).
  *   Even if both satisfy the counterfactual test (the patient dies in both cases; if you hadn't done X, they would live), most legal systems and moral intuitions treat them differently.
  *   **Why?** Because treating them the same creates an overly demanding moral system. If omissions are morally equivalent to acts, you are as guilty for not donating your kidney to a stranger as you are for stabbing someone. Most philosophers reject this conclusion (see: the "Demandingness Objection" in utilitarianism).

  **Normativity vs. Metaphysics**
  The lifeguard example works not because of metaphysics, but because of **norms**. We pick out the lifeguard's omission as *the* cause because the lifeguard *ought* to have acted.
  *   Philosophers like H.L.A. Hart and Tony Honoré argued that causation in the law is not purely physical; it is infused with normative expectations.
  *   The guest claims the law is right *because* the metaphysics supports it. A philosopher would argue the reverse: The law treats the lifeguard as a cause *because* of the duty, regardless of the metaphysics.

  ### 4. Summary Verdict
  If you showed this transcript to a philosopher of causation, here is how they would likely annotate it:

  1.  **"Philosophers have mostly come around..."**
      *   **False.** There is a deep split. "Causal Realists" (like Michael Moore) argue omissions are not causes because nothingness cannot cause anything. "Counterfactualists" (like David Lewis) say they are. It is not a settled consensus.
  2.  **"Only people who resist... think causes have to be physical events — but that's just a prejudice."**
      *   **Unfair.** It ignores the proliferation problem. It's not a prejudice; it's a worry about making causation trivial.
  3.  **"Once you accept that omissions are causes, there's no real difference..."**
      *   **Invalid Inference.** Causal status $\neq$ Moral/Legal weight. You can be a cause without being equally responsible.
  4.  **"...which is why the law is right to treat them the same way."**
      *   **Controversial.** The law actually *doesn't* treat them exactly the same way (e.g., murder vs. manslaughter, or the requirement of a duty of care for omissions). The guest is arguing for legal reform based on a contested metaphysical view.

  ### Conclusion
  Your skepticism is well-founded. The guest is advocating for a **Quasi-Lewisian Contextualist** view but presenting it as obvious fact. They are skipping over the hardest parts of the problem:
  1.  How to stop causal proliferation (why isn't everyone a cause?).
  2.  Why normative duties determine causal salience.
  3.  Why causal equivalence doesn't imply moral equivalence.

  A more accurate philosophical summary would be: *"The law treats omissions as causes when there is a duty. Counterfactual theories can explain this, but they struggle to explain why some omissions count and others don't without importing normative assumptions. Therefore, whether omissions are 'true' causes metaphysically is less important than understanding why we select them as causes for the purpose of assigning responsibility."*

  The guest's claim that there is "no real difference" between acting and omitting is the weakest link. Most philosophers agree there is a difference, even if both can be causal.
