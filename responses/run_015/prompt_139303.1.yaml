  I would bet on the Kalai–Smorodinsky rule, predicting an award of (6, 6) for the new case.

  Your identification of the two rules is correct: the first is the Nash bargaining solution, which maximises the product of the parties' gains over the disagreement point, and the second is the Kalai–Smorodinsky solution, which selects the unique feasible point lying on the line segment joining the disagreement point to the ideal point (the pair of maximal possible payoffs). No third standard rule fits the record equally well; for instance, the egalitarian rule (maximising the minimum gain) would have awarded (7.5, 7.5) in case 1, and a utilitarian rule (maximising the sum) would have awarded (0, 30). Both Nash and Kalai–Smorodinsky coincide on linear frontiers with symmetric disagreement points, and both select the kink in case 3 because the slope of the Nash indifference curve at (6, 12) lies between the slopes of the two frontier segments, while the Kalai–Smorodinsky ray from the origin passes exactly through that kink.

  To predict the award in the new case, we first define the feasible frontier. With a disagreement point of (0, 0), the frontier runs from (0, 10) to (4, 9) to (10, 0). The first segment has the equation $u_B = 10 - 0.25u_A$ for $0 \le u_A \le 4$, and the second has the equation $u_B = 15 - 1.5u_A$ for $4 \le u_A \le 10$.

  Under the **Nash rule**, we maximise the product $P = u_A u_B$. On the first segment, $P = 10u_A - 0.25u_A^2$, which increases throughout the domain (peak at $u_A = 20$), yielding a maximum at the kink (4, 9) with $P = 36$. On the second segment, $P = 15u_A - 1.5u_A^2$, which peaks where the derivative $15 - 3u_A = 0$, giving $u_A = 5$. At this point, $u_B = 15 - 7.5 = 7.5$, and $P = 37.5$. Since 37.5 exceeds 36, the Nash award is **(5, 7.5)**.

  Under the **Kalai–Smorodinsky rule**, we identify the ideal point $a$. The maximum possible payoff for A is 10, and for B is 10, so $a = (10, 10)$. The solution lies on the ray from (0, 0) to (10, 10), defined by $u_B = u_A$. Intersecting this with the first segment gives $u_A = 8$, which is outside the domain. Intersecting with the second segment gives $u_A = 15 - 1.5u_A \Rightarrow 2.5u_A = 15 \Rightarrow u_A = 6$. Thus, the Kalai–Smorodinsky award is **(6, 6)**.

  Regarding which rule to back, the tension lies between the note in case 1, which suggests Independence of Irrelevant Alternatives (a Nash axiom), and the lecture remark, which asserts Monotonicity (a Kalai–Smorodinsky axiom). While the case note hints at Nash, the observation that the option (9, 3) played no part is consistent with Kalai–Smorodinsky as well, since that option did not alter the ideal point. However, the lecture remark explicitly endorses Monotonicity, a principle the Nash rule violates. As a public commitment to a normative principle carries more weight than a specific justification that could be coincidental, I favour the rule that satisfies her stated principle.

