answer: |-
  ### Endorsed Metaphor: The Genetic Code as a *Translated Instruction Set*

  To settle the dispute between gene-centric accounts and Developmental Systems Theory (DST), the theory must endorse the metaphor of **Code**, explicitly rejecting **Blueprint**, **Template**, and **Law**.

  *   **Why Code?** A blueprint implies spatial isomorphism (the map looks like the building), which fails for linear DNA vs. 3D organism. A template implies direct physical copying (like a mold), which fails to distinguish DNA from prions. A law implies exceptionless necessity, which fails given biological noise and contingency.
  *   **Why Instruction Set?** Unlike a static dictionary, a code in biology functions to direct a process (translation) via an arbitrary mapping. This captures the *active* role of DNA without conceding to the DST claim that "information" is merely synonymous with "causal influence."

  To claim it is *literally* true that DNA carries information, the theory must demonstrate that DNA possesses **semantic properties** (reference, arbitrariness, combinatorial syntax) that are not reducible to its physical chemistry and are not equally possessed by the cellular environment.

  ---

  ### Desiderata for a Literal Theory of Genetic Information

  #### 1. The Arbitrariness Constraint (Non-negotiable)
  **Requirement:** The mapping between the signifier (codon) and the signified (amino acid/function) must not be determined solely by immediate physicochemical affinity. There must be a contingent, historical, or conventional link mediated by an interpreter (tRNA/synthetase).
  **Case Handled:** *Templating without coding (prions).* Prion propagation is driven by stereochemical fit; the shape *is* the cause. In DNA, the sequence does not chemically attract the amino acid; the ribosome/tRNA complex mediates the link. If the mapping were chemically necessary, it would be causation, not coding. This constraint excludes DST critics who equate causal influence with information; cytoplasmic gradients exert force, but they do not encode via arbitrary convention.
  **Justification:** Without arbitrariness, "information" collapses into "physical cause." To beat the parity argument, DNA must do something the cytoplasm does not: it must utilize a symbolic mapping.

  #### 2. The Digital Discreteness Constraint (Non-negotiable)
  **Requirement:** The information-bearing vehicle must consist of discrete, interchangeable units where the physical magnitude of the signal does not correlate with the magnitude of the semantic content.
  **Case Handled:** *Degenerate mapping.* Multiple codons map to one amino acid. If information were analog (like a hormone gradient), changing the signal strength would change the outcome proportionally. In DNA, swapping UUU for UUC changes the physical molecule but preserves the semantic content (Phenylalanine).
  **Justification:** This distinguishes genetic information from maternal cytoplasmic gradients (which are often analog concentration-dependent). It allows the theory to claim DNA carries *specific* instructions, while the cytoplasm provides *conditions*.

  #### 3. The Decoupling Constraint (Non-negotiable)
  **Requirement:** The theory must distinguish the *content* of the sequence from the *outcome* of the process. It must be possible for the message to be "read" correctly but the execution to fail, or for the message to be "silent."
  **Case Handled:** *Sequence vs. Outcome (misincorporation/frameshift) and Genome fraction.* Most mammalian DNA does not code for protein; some codes are silenced by imprinting. If information were defined by the phenotypic outcome, non-coding DNA would carry no information, and errors would constitute a "new message." Decoupling allows us to say the DNA *said* "Alanine" even if the ribosome inserted "Glycine."
  **Justification:** This is the only way to handle error. If the outcome defines the message, there is no such thing as noise. To treat DNA as an information carrier, the "message" must be identifiable independently of the "effect."

  #### 4. The Systematicity Constraint (Preference)
  **Requirement:** The mapping rules should form a coherent system that allows for local variations without collapsing the system itself.
  **Case Handled:** *Universality vs. Variants.* Mitochondrial reassignments and stop-codon recoding (Selenocysteine) are "dialects," not evidence that there is no language. A literal theory must accommodate variants as rule-governed exceptions rather than ad-hoc chaos.
  **Justification:** This is a preference because a theory could technically survive without it (positing distinct codes for every organelle), but it weakens the claim of a unified "Genetic Code." It is included to preserve the explanatory power of the standard model against claims that the code is too fragmented to be real.

  #### 5. The Context-Independence of the Vehicle (Preference)
  **Requirement:** The semantic value of a sequence should be intrinsic to the sequence, not wholly dependent on the external context for its definition.
  **Case Handled:** *Alternative splicing and imprinting.* A sequence can code for Protein A in one tissue and Protein B in another.
  **Justification:** This is a preference, not non-negotiable, because biology clearly violates it. However, the theory should strive to locate the "code" in the sequence+splice-site syntax, rather than conceding that the *meaning* resides entirely in the cellular context. If this requirement is dropped, the DST critics win: the information is in the cell, not the DNA.

  ---

  ### The Unsatisfiable Pair

  **Context-Independence of the Vehicle** vs. **Comprehensive Explanatory Power.**

  *   **The Tension:** To maintain that DNA *literally* carries information (beating the DST parity argument), you must argue that the semantic content resides in the DNA sequence (**Context-Independence**). However, to accurately describe biological development, you must acknowledge that the phenotypic effect is determined by the interaction of DNA with methylation, cytoplasm, and environment (**Explanatory Power**).
  *   **Why they conflict:** If you enforce Context-Independence strictly, you cannot explain why the same sequence yields different phenotypes (imprinting/splicing) without appealing to external factors, which suggests the "information" was never fully in the DNA. If you prioritize Explanatory Power and admit context determines meaning, you concede to DST that information is distributed, undermining the claim that DNA is the *specific* carrier.
  *   **Prediction:** This pair cannot be jointly satisfied without a category shift. You must either accept that DNA carries *partial* instructions (weakening the "Code" claim) or that Context is part of the Code (weakening the "DNA Specificity" claim).

  ### The Most Exclusionary Requirement

  **The Arbitrariness Constraint.**

  This requirement does the most work in excluding candidates.
  1.  **It excludes Pure Causal Accounts:** It rules out theories that define information simply as "that which makes a difference" (common in DST), because cytoplasmic gradients make a difference but lack arbitrary mapping.
  2.  **It excludes Stereochemical Theories:** It rules out hypotheses that claim codon assignments are physically necessary (chemical affinity between codon and amino acid), because if the mapping is necessary, it is not a code, it is chemistry.
  3.  **It excludes Prion Templating:** It distinguishes DNA from prions, as prion folding is physically determined by the template shape, not arbitrarily assigned.

  ---

  ### What Would Change My Mind

  To maintain intellectual honesty in the monograph, I must specify the empirical or theoretical findings that would force me to demote a non-negotiable requirement or abandon the unsatisfiable pair analysis.

  #### 1. Defeater for the Arbitrariness Constraint (Non-negotiable)
  **Finding:** Definitive proof of the **Stereochemical Hypothesis**.
  If it were demonstrated that specific codons *physically bind* their cognate amino acids with high specificity in the absence of synthetases (e.g., in prebiotic conditions), the claim of arbitrariness collapses.
  **Consequence:** I would have to demote Arbitrariness to a Preference. The "Code" would be reclassified as a chemically determined "Lock-and-Key" mechanism. This would weaken the distinction between DNA and prions, potentially conceding ground to DST critics who argue that "information" is just complex causation.

  #### 2. Defeater for the Unsatisfiable Pair Analysis
  **Finding:** A Formal **Context-Integrated Syntax**.
  If a mathematical formalism were developed that successfully encodes splicing rules, imprinting status, and methylation patterns *into the sequence itself* (e.g., proving that "junk" DNA contains a higher-order code that dictates the interpretation of the lower-order code), the tension dissolves.
  **Consequence:** This would satisfy **Context-Independence** (the meaning is in the full sequence) and **Explanatory Power** (the sequence predicts the context-dependent outcome). It would validate the "Program" metaphor over the "Code" metaphor and severely undermine the DST parity argument, as the "environmental" factors would be shown to be internally coded.

  #### 3. Defeater for the Decoupling Constraint (Non-negotiable)
  **Finding:** Error-Free, Deterministic Translation.
  If it were discovered that biological noise is non-existent at the molecular level (i.e., misincorporation is impossible, and frameshifts are always functional recoding events), the distinction between "message" and "outcome" vanishes.
  **Consequence:** I would have to drop the Decoupling Constraint. If the outcome *is* the message, then "information" becomes synonymous with "phenotypic effect." This would force a concession to DST: if the effect depends on the whole system, the information is in the whole system, not just the DNA.

  #### 4. Where the Reasoning on the Unsatisfiable Pair is Most Likely to Fail
  My analysis assumes that "Context" is external to the "Vehicle." This is the most vulnerable point.
  **Failure Mode:** If **Niche Construction** is shown to be genetically hardwired to the point where the organism constructs its own context reliably, the boundary between "DNA" and "Environment" blurs not because information is distributed, but because the DNA *codes for the context*.
  **Reasoning Flaw:** I am treating the cell as a static reader of DNA. If the DNA codes for the ribosome, the tRNA, and the methylation enzymes, then the "Context" is actually a downstream expression of the "Vehicle." If this recursive loop is formalized, the **Context-Independence** requirement is satisfied not by isolating DNA, but by expanding the definition of the "Genetic Program" to include the machinery it builds. This would resolve the tension but require shifting the metaphor from **Code** to **Generative Program**.
