  ### Structural Diagnostics

  **Collapsing Pairs:**
  The tree struggles to separate **Leaf 2 (Dual-Process Conflict)** and **Leaf 4 (Phenomenal Zombie)**. If a motor programme competes successfully against an intention (Leaf 2), the agent effectively runs on automatic pilot (Leaf 4). The distinction relies entirely on whether you prioritize the *presence* of the overridden intention (Leaf 2) or the *absence* of phenomenology (Leaf 4), which may be the same state described differently. Additionally, **Leaf 3** serves both branches because 'Monitoring Failure' (Intention Yes/Motor No) and 'Pure Habit' (Intention No/Auto No) both commit you to the view that subpersonal mechanisms do all the work.

  **Diagnosis: Intentional Action with Zero Consciousness**
  This combination is **conceptually tense but not incoherent**. It is unexplored only if you define 'intention' as essentially conscious (à la Anscombe). However, if you adopt a causal theory of action where intentions are subpersonal states that cause behavior, the combination is stable. The cost is accepting that the 'agent' is not identical to the 'conscious subject,' effectively splitting the self into a controller (unconscious) and a witness (conscious).
