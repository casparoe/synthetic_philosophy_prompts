          *   The feedback loop gain ($K_{feedback}$) drops to near zero or the sensor data is gated out (attentional blink).
          *   The system runs in open-loop (feedforward) mode based on a previous state estimate.
          *   The output $u(t)$ (steering/throttle) continues, maintaining lane position (stability), but the specific switching condition (Exit $x_A$) is not triggered.
      *   *The "Correction" Phase:*
          *   Sensor data ($x_{current}$) is re-engaged.
          *   Error signal $e(t) = r(t) - x_{current}$ spikes (large deviation from planned exit).
          *   Adaptive tuning occurs: New reference $r'(t)$ generated (Exit $x_B$ or U-turn).
          *   Control effort applied to minimize new error.

      *   *Mapping the Debate:*
