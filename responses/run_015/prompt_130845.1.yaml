  Let's walk through Maya's moral profile before we touch the healthcare case. We aren't just labeling her; we're reconstructing her constraint system.

  ### Step 1: Reconstructing Maya's Principles

  Looking at her five stated views, a specific shape emerges:

  1.  **The Person-Affecting Constraint:** Views 2, 4, and 5 are identical in structure. She rejects "leveling down." Making the rich worse off without helping the poor (burning art, income caps, fake algorithm scores) is vandalism. Benefits must land on someone. This rules out strict Telic Egalitarianism.
  2.  **Priority to the Worst-Off:** View 1 (yachts/malaria) explicitly accepts a loss in *aggregate* happiness to help the worse-off. View 3 (triage) prioritizes the single worst-off patient over three less-bad-off patients. This is the core of her view: severity trumps numbers, and it trumps total utility.
  3.  **Non-Aggregation Leanings:** View 3 is the strongest signal here. Saving 1 life over 3 "sick but not as bad off" suggests she doesn't simply weight utility; she treats the claims of the worst-off as lexically superior, or at least so heavily weighted that small numbers of competitors don't override them.

  **The Tension:** View 1 implies *weighted* utility (rich lose more than poor gain, but we do it anyway). View 3 implies *non-aggregation* (1 worst-off > 3 less bad-off). These are compatible if the weighting is steep enough, but they diverge when numbers get large. View 3 only tests her against the number 3.

  ### Step 2: Analyzing the New Case

  **The Setup:**
