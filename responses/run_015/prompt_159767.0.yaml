  Elias, a locksmith, determines the precise cut pattern for a master key by pressing a soft wax strip against the internal mechanism of a specific lock bolted to his shop's workbench, allowing the pin tumblers to physically mold the wax into the required inverse shape. He relies on this method for every complex job because the internal geometry is too intricate to calculate mentally, yet he never accepts the wax impression as final without visually cross-checking the ridge patterns against his theoretical understanding of the lock's schema. The lock is a permanent fixture owned by the shop that he cannot remove, and while he knows exactly how it works, he treats the wax output as an external measurement requiring verification before cutting the metal key.

  1. **Verdicts: (A) No, (B) Yes, (C) No.**
     (A) denies extension because Elias fails the "automatic endorsement" condition; he consciously verifies the wax impression against internal standards rather than treating it with the transparent trust characteristic of biological memory. (B) grants extension because the computation of the key shape is physically realized by the interaction between the wax and the lock's pin configuration; individuating this computational process requires citing the external lock as a vehicle, not just the brain. (C) denies extension because the lock and wax are extracranial resources with derived content that merely cause or scaffold the brain-bound cognitive state of knowing the key pattern.

  2. **Load-bearing feature: The agent's epistemic attitude toward the resource's output.**
     The case hinges on whether the agent treats the external deliverance as a trusted memory recall (automatic endorsement) or as data requiring conscious verification (explicit checking).

  3. **Toggling the variable: If Elias trusts the wax implicitly, (A) flips to Yes, collapsing the case into Otto's notebook.**
     If Elias stops cross-checking and accepts the wax impression automatically, the scenario satisfies (A)'s parity conditions, aligning (A) and (B) in favor of extension. This renders the case dialectically useless for this seminar, as it becomes a standard example of the extended mind thesis rather than a wedge separating parity-based extension from wide computationalism.

  4. **Strongest reply for (A): The verification step proves the resource is merely coupled input, not constituted cognition.**
     The (A) theorist argues that the act of cross-checking demonstrates the lock is an object of cognition rather than a part of it, preserving the boundary where automatic trust begins. This reply rescues (A) from counterexample by definition, but it merely relocates the real disagreement into the (B) versus (C) dispute over whether physical computational vehicles constitute mind independent of the agent's epistemic stance.

  5. **(B)'s verdict here is a cost for that view.**
     Counting a tool as part of the mind when the agent explicitly distrusts it severs the conceptual link between cognition and agency, risking an over-generation that makes the notion of "mind" too broad to be useful.
