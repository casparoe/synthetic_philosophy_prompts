answer: |-
  Okay, pull up a chair. Let's unpack this. You're hitting a wall that almost everyone hits when they first engage with Naive Realist Disjunctivism. It's a very natural friction point.

  You asked me to brainstorm first, so let's map out the dialectic as I see it, just to get the lay of the land before we fix the specific conceptual slip you've made.

  ### Brainstorming the Dialectic

  1.  **The Opponent's Move (Argument from Illusion):**
      *   Premise 1: A veridical perception of a red apple and a perfect hallucination of a red apple can be subjectively indistinguishable.
      *   Premise 2: If two states are subjectively indistinguishable, they must share a common mental constituent (a sense-datum, a qualia, or a representational content) that accounts for that phenomenology.
      *   Conclusion: Therefore, even in the veridical case, what I am directly aware of is this common mental constituent, not the world. Direct realism is dead.

  2.  **The Disjunctivist's Counter-Move:**
      *   Attack Premise 2. This is the *Common Kind Assumption* (CKA).
      *   Claim: Subjective indistinguishability does not entail ontological identity. Just because you can't tell the difference from the inside doesn't mean the underlying metaphysical nature of the states is the same.
      *   The Disjunction: Either (A) I am perceiving a mind-independent object (relational state), OR (B) I am hallucinating (a state that merely seems like perception). There is no common mental factor $C$ that exists in both.

  3.  **The Problem You're Stuck On:**
      *   You're thinking: "If there's no common factor, and the good case is a relation to an object, then the bad case must be... nothing? Or just a brain state with no phenomenology?"
      *   If the bad case has no phenomenology, then the hallucinator is lying when they say "I see red."
      *   If the hallucinator isn't lying, they must have phenomenology.
      *   If they have phenomenology, and the veridical perceiver has phenomenology, isn't that phenomenology the "common factor"?
      *   *Your conclusion:* Disjunctivism seems to deny the data (the feeling of experience) to save the theory.

  ***

  ### The Correction

  Okay, now let's look at where your understanding has slipped. You said:

  > *"my understanding is that disjunctivists claim that in a hallucination there's literally no mental state with experiential content—it's just a neural misfire that produces behaviour but no 'what it's like'"*

  **This is the error.** This is not the Disjunctivist position. If a Disjunctivist claimed hallucinations have no "what it's like," they would indeed be changing the subject and violating the phenomenological data. That view is closer to eliminativism or a very hard-line externalism that most Disjunctivists reject.

  Standard Disjunctivists (especially the Naive Realist strand you seem to be grappling with) **agree** that there is something it is like to hallucinate. The hallucinator is not lying. They are having a genuine experience.

  Here is the technical correction you need to make to get unstuck:

  **1. Phenomenology vs. Metaphysical Constitution**
  The Disjunctivist distinguishes between the *fact* that there is phenomenology and the *account* of what grounds that phenomenology.
  *   **The Argument from Illusion** assumes that if there is phenomenology in both cases, it must be grounded by the same *type* of mental particular (e.g., an internal representation or a sense-datum).
  *   **The Disjunctivist** says: The phenomenology in the good case is grounded by the actual presence of the object (the relation). The phenomenology in the bad case is *not* grounded by an object (since there isn't one), nor is it grounded by an internal proxy that mimics the object.

  **2. The Nature of the "Bad Case"**
  You asked how they account for the reports if there's no mental factor. They account for it by saying the hallucination is a **primitive, sui generis mental state** that is defined negatively.
  *   In the good case, the state is: *Perceiving X.*
  *   In the bad case, the state is: *A state that is introspectively indistinguishable from perceiving X, but is not perceiving X.*

  Notice what happened there? The Disjunctivist isn't saying there is *no* mental state in the hallucination. They are saying the mental state in the hallucination does not share the *essential nature* of the mental state in perception.

  **3. Why this isn't "Changing the Subject"**
  You worried that denying a common factor denies the shared phenomenology. The Disjunctivist reply is that "shared phenomenology" is ambiguous.
  *   **Epistemic Sense:** Yes, they share the property of "being indistinguishable from the inside." The subject cannot know which state they are in.
  *   **Ontological Sense:** No, they do not share a constituent.

  Think of it like this: A real diamond and a perfect cubic zirconia look identical to the naked eye. They share the property of "looking like a diamond." But it would be a mistake to say they share the constituent "diamond-ness." The real one has carbon lattice structure; the fake has zirconium dioxide.
  The Argument from Illusion says: "Since they look the same, they must share the same internal structure."
  The Disjunctivist says: "No. They look the same (epistemic indistinguishability), but their metaphysical constitution is fundamentally different (ontological disjunction)."

  **4. Addressing the "False Report" Worry**
  You asked: *"wouldn't they have to say those reports are just false behavioural outputs?"*
  No. When a hallucinator says, "I see a pink elephant," the Disjunctivist says this report is **veridical about the experience, but not about the world.**
  *   Is there an experience? Yes.
  *   Does it have a phenomenal character? Yes.
  *   Is that character constituted by a relation to a pink elephant? No.
  *   Is it constituted by an internal image of a pink elephant? Also No (that's the representationalist/sense-data view).
  *   So what is it? It is a state that has the *appearance* of a relational state without the relation.

  The Disjunctivist bite-the-bullet moment isn't denying the experience exists. It's denying that we can give a **positive characterization** of the hallucination's phenomenology that is independent of the veridical case. We can only describe the hallucination as "that state which is indistinguishable from seeing." This is often called the **causal explanation** of the bad case without granting it **metrical similarity** in terms of mental kinds.

  ### Where you should go from here

  You're stuck because you're treating "mental state" as a binary: either it's a relation to an object, or it's nothing. You need to introduce a third category in your ontology.

  1.  **Veridical Perception:** Relational state (Object + Subject). Phenomenology is constituted by the object.
  2.  **Hallucination:** Non-relational state. Phenomenology is *not* constituted by an object, but it is also *not* constituted by an internal surrogate (like a sense-datum). It is a brute mental occurrence that merely *matches* the profile of perception from the subject's perspective.

  The Argument from Illusion fails for the Disjunctivist not because they deny the hallucination has phenomenology, but because they deny that **phenomenal indistinguishability entails metaphysical commonality.**

  Does that loosen the knot? You don't have to deny the "what it's like" to deny the "common kind." You just have to insist that the "what it's like" is realized differently in the two cases, even if the subject can't tell the difference.
