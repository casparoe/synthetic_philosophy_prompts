answer: |-
  **SUBSTITUTE JUDGMENT PANEL: DECISION PROCEDURE v4.1**

  **Step 1: Dossier Construction (Admissibility)**
  *Input:* All available records, prior directives, witness statements.
  *Operation:* Classify evidence into three tiers. Tier 1: Written directives signed while competent. Tier 2: Contemporaneous statements to disinterested parties. Tier 3: Testimony from interested parties (heirs, caregivers) or retrospective accounts.
  *Rule:* Tier 3 evidence is inadmissible unless corroborated by Tier 1 or 2. If the dossier relies >50% on Tier 3, the record is "Thin."
  *Stop Rule:* If Record is "Thin," stop.
  *Accountability Point 1:* Panel must vote to accept a "Thin" record. This vote is recorded as "Dossier Exception" and requires a written justification of necessity.

  **Step 2: Factual Correction (Belief)**
  *Input:* Patient's stated reasons for refusal/consent.
  *Operation:* Isolate factual claims (e.g., "I will be a burden," "This will kill me"). Verify against medical evidence. Correct false beliefs.
  *Stop Rule:* If refusal persists after factual correction, proceed to Step 3. If refusal dissolves, recommend treatment.
  *Accountability Point 2:* Panel must record which specific beliefs were classified as "factual errors" versus "value judgments." Misclassifying a value as a fact is a reviewable error.

  **Step 3: Distortion Removal (Desire)**
  *Input:* Patient's values post-correction.
  *Operation:* Identify values potentially distorted by acute pathology (untreated depression, delirium, severe pain). Consult attending physician on treatability. If a value disappears upon treatment of the pathology, it is marked "Distorted."
  *Stop Rule:* If all refusing values are marked "Distorted," proceed to Step 4. If core values remain intact, proceed to Step 4.
  *Accountability Point 3:* Panel must record the specific pathology linked to the value. This is the primary override mechanism for conditions like depression or anorexia.

  **Step 4: Identity Continuity (The Cutoff)**
  *Input:* Idealized value set from Step 3.
  *Operation:* Compare idealized set to the patient's historical self-conception (e.g., religious, political, stoic commitments).
  *Rule:* If idealization strips a commitment held stable for >5 years, the idealized agent is "Non-Recognizable."
  *Stop Rule:* If agent is "Non-Recognizable," revert to Step 2 output (current will corrected for facts only).
  *Accountability Point 4:* Panel must define "Core Commitments." This is a subjective judgment call recorded as "Identity Finding."

  **Step 5: Repudiation Check (Meta-Preference)**
  *Input:* Evidence of patient's view on decision-making authority.
  *Operation:* Search dossier for statements valuing immediate autonomy over correct outcome (e.g., "My choice, even if wrong").
  *Stop Rule:* If evidence exists that patient prioritizes immediate autonomy, defer to current will.
  *Accountability Point 5:* Panel must record the specific evidence used to infer this meta-preference. Absence of evidence is not evidence of absence; default is to proceed.

  **Step 6: Stability & Final Judgment**
  *Input:* Recommendation derived from Steps 1–5.
  *Operation:* Vary the weight of Tier 2 evidence and the threshold for "Distortion" slightly.
  *Stop Rule:* If the recommendation flips based on minor parameter changes, the result is "Unstable."
  *Accountability Point 6:* If "Unstable," the Panel Chair must sign a "Judgment Override," accepting personal liability for the tie-break. If stable, the Panel signs the Advisory.

  ***

  **CASE APPLICATIONS**

  **Case 1: 78M, Hip Replacement, Dementia/Depression**
  *Step 1:* Dossier contains written letter (Tier 1) and clinician assessment (Tier 2). Record is Thick.
  *Step 2:* Belief: "I will be a burden." Medical evidence suggests rehab will restore independence. Belief corrected.
  *Step 3:* Value: "Had my innings." Clinicians attest untreated depression distorts valuation of future life. Value marked "Distorted."
  *Step 4:* Identity: Patient identifies as "stoic." Treating depression aligns with stoic self-reliance rather than stripping it. Agent remains Recognizable.
  *Step 5:* No evidence he valued immediate refusal over correct outcome.
  *Step 6:* Recommendation stable.
  *Outcome:* Advisory supports treatment pending depression management. **Step 3** did the work; the refusal was categorized as a symptom, not a value.

  **Case 2: 29F, Anorexia, Feeding**
  *Step 1:* Dossier contains months of consistent statements (Tier 2). Record is Thick.
  *Step 2:* Beliefs regarding nutrition are factually intact. She knows feeding saves life.
  *Step 3:* Value: "Thinness above life." Medical consensus defines anorexia as a pathology that distorts value hierarchy. Panel must decide if this counts as "Distortion" under Step 3. If Panel follows medical consensus, value is marked "Distorted."
  *Step 4:* Identity: She describes discipline as central achievement. If Panel marks value as Distorted, does this make her Non-Recognizable? If the Panel rules the illness *obscures* the identity rather than *constituting* it, she remains Recognizable.
  *Step 5:* No evidence of meta-preference for autonomy over life.
  *Step 6:* Recommendation stable.
  *Outcome:* Advisory supports feeding. **Step 3** overrides competent refusal by classifying the value hierarchy as a symptom of disease. This is the explicit override point you requested; the procedure does not defer to values generated by the pathology itself.

  **Case 3: 54M, Transfusion, Religion**
  *Step 1:* Dossier relies on Community Reps (Tier 2) vs. Estranged Son (Tier 3). Son's claim of ambivalence is inadmissible without corroboration. Record relies on Community.
  *Step 2:* Beliefs regarding salvation are theological, not factual. No correction applied.
  *Step 3:* Value: Religious prohibition. No acute pathology (depression/delirium) identified. Value not Distorted.
  *Step 4:* Identity: Prohibition held since adolescence (>5 years). Core Commitment confirmed. Agent Recognizable.
  *Step 5:* No evidence of meta-preference override.
  *Step 6:* Recommendation stable.
  *Outcome:* Advisory supports refusal. **Step 1** protected the decision by excluding interested party testimony; **Step 4** protected the decision by recognizing religious commitment as identity-constitutive.

  ***

  **LIMITATIONS**

  This procedure cannot justify the idealized-preference standard itself. It assumes the statute is moral. If the family argues that *current* wishes should trump *idealized* ones regardless of distortion, the procedure has no recourse other than to cite the statute. It operates within the cage; it does not build the cage.

  Second, it cannot settle who counts as the patient metaphysically. Step 4 (Identity Continuity) attempts to manage this practically, but the definition of "Core Commitments" is a judgment call (Accountability Point 4). If the Panel decides a religious conversion last month is "core" versus "delusional," the procedure records the finding but does not generate the truth. We are not determining who she *is*; we are determining what we can defend in a file.

  Third, several steps are judgment calls recorded as findings. Step 3 (Distortion) requires us to medicalize values. Step 6 (Stability) requires us to choose which parameters to vary. These are not algorithmic outputs; they are human decisions we have agreed to label as procedural steps to ensure consistency. The procedure does not eliminate discretion; it forces us to isolate it, name it, and sign for it. When the dossier is thin (Step 1) or the identity cutoff is borderline (Step 4), the procedure stops and hands the risk to us. That is the only honesty this office can afford.
