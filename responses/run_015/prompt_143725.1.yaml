          *   **Behavioral Econ:** Loss aversion (Prospect Theory) is a *major* driver (pain of realizing a loss). But it's not the *only* one.
          *   **Other Drivers:** Escalation of commitment, self-justification (cognitive dissonance), waste aversion (normative), emotional attachment.
          *   **Verdict:** Conflation/Overgeneralization. Loss aversion is a key mechanism, but not the sole explanation.

      *   *Claim 3: "The only exception... is reputation/signaling... but that's not honoring the sunk cost itself."*
          *   **Analysis:** This is actually a very sharp distinction. If I stay in a job because I invested 5 years, that's the fallacy. If I stay because leaving now makes me look flaky to *future* employers, that's a forward-looking strategic move. The *investment* created the context for the signal, but the *decision* is based on future utility.
