answer: |-
  Your skepticism is well-founded. Your roommate has a surprisingly sophisticated grasp of the *neoclassical* definition of sunk costs, but they are oversimplifying the *psychological* mechanisms and creating a semantic loophole to make their framework fit.

  Here is an audit of their claims against decision theory, behavioral economics, and game theory.

  ### 1. The Core Claim: "Rationality only looks forward."
  *   **Verdict:** **Accurate (Neoclassical Standard).**
  *   **The Theory:** In standard Expected Utility Theory, a cost is "sunk" if it cannot be recovered. Therefore, it should not influence marginal decision-making. Only future costs and future benefits matter.
  *   **The Nuance:** While technically true in a vacuum, this definition assumes a "closed system." In the real world, the past often contains *information* about the future (e.g., "I have failed at this three times, so I will likely fail again"). Your roommate is correct that a rational agent shouldn't weigh the *cost* itself, but they might weigh the *data* the cost represents.

  ### 2. The Psychological Claim: "It's mostly loss aversion."
  *   **Verdict:** **Conflation/Overgeneralization.**
  *   **The Issue:** Your roommate is conflating **Loss Aversion** with **Waste Aversion** and **Self-Justification**.
      *   **Loss Aversion (Prospect Theory):** This explains why people hold onto losing stocks. They don't want to "realize" the loss. This applies to assets.
      *   **Waste Aversion (Normative):** This explains why people finish a bad meal or watch a bad movie. It's not about "losing" money (the money is gone either way); it's about a moral heuristic against "wasting" resources.
      *   **Escalation of Commitment (Self-Justification):** This explains staying in a bad job. Admitting the project failed is an admission of personal error. People continue to protect their ego, not just to avoid financial loss.
  *   **Audit:** Saying loss aversion explains *all* sunk-cost behavior is incorrect. It explains investment behavior, but not necessarily consumption or commitment behavior.

  ### 3. The Signaling Exception: "Quitting sends a bad signal... that's forward-looking."
  *   **Verdict:** **Theoretically Sound, but Semantically Tricky.**
  *   **The Theory:** This is **Game Theory**, specifically **Reputation Modeling**. If I quit a project halfway, future partners may view me as unreliable. Therefore, finishing the project yields a *future benefit* (maintained reputation) that outweighs the *future cost* (misery of finishing).
  *   **The Roommate's Framing:** They argue this isn't "honoring the sunk cost" but rather "investing in reputation."
  *   **Audit:** They are logically correct. If the *reason* for staying is the future signal, the sunk cost is merely the *context*, not the *cause*. However, in practice, it is incredibly difficult for humans to disentangle "I am staying for my reputation" from "I have invested too much to quit." Your roommate is describing a **Second-Order Rationality**: It looks like the fallacy, but the calculus is different.

  ### 4. The "Relational Sunk Costs" Claim
  *   **Verdict:** **Non-Standard Terminology for a Real Concept.**
  *   **Is it real?** You won't find "Relational Sunk Costs" in a standard Microeconomics 101 textbook. However, your roommate is describing **Relationship-Specific Investment** (from Transaction Cost Economics) or **Common Ground** (from Linguistics/Psychology).
  *   **The Concept:** In artistic or deep collaborations, the value isn't just the output; it's the shared language, trust, and workflow built over time. If you quit, that "shared meaning" evaporates.
  *   **Why it matters:** This challenges the idea that the cost is truly "sunk." If the *relationship capital* degrades upon exit, then the cost of quitting is higher than the cost of staying.
  *   **Audit:** Your roommate is likely synthesizing concepts from organizational behavior or sociology of art. It's not a "fallacy" to stay if the *breakup cost* (loss of shared meaning) is a real, forward-looking negative utility. It fits under the "Signaling/Reputation" umbrella but is more specific: it's about **Asset Specificity**. The "asset" is the team dynamic, and it is non-transferable.

  ### 5. Coherence Check: "Always irrational except for signaling."
  *   **Verdict:** **Coherent, but Tautological.**
  *   **The Problem:** The framing is coherent only because it defines away the exception.
      *   *Definition:* "If there is a valid forward-looking reason (like signaling), it is not a sunk cost fallacy."
      *   *Result:* Therefore, the sunk cost fallacy is always irrational.
  *   **Critique:** This is a "No True Scotsman" argument. It makes the theory unfalsifiable. A more honest framing would be: *"Honoring sunk costs is irrational **unless** the past investment has created a forward-looking asset (like reputation or team cohesion)."*
  *   **Why it feels off:** It feels off because it ignores the **Learning Value**. Sometimes you honor a sunk cost not for signaling, but to gather data. (e.g., "I've spent $1M on this R&D; I will spend $100k more just to know *why* it failed so I don't fail next time.") That is a forward-looking reason (learning), but it still feels like honoring the past investment. Your roommate's binary (Fallacy vs. Signaling) misses the "Learning" category.

  ### Summary Audit

  | Roommate's Claim | Decision Theory Status | Notes |
  | :--- | :--- | :--- |
  | **"Rationality is forward-looking"** | **Correct** | Standard neoclassical definition. |
  | **"Loss aversion explains it all"** | **Incorrect** | Conflates loss aversion with waste aversion & ego protection. |
  | **"Signaling is an exception"** | **Correct** | But it's better described as a *strategic override*, not an exception to the rule. |
  | **"Relational Sunk Costs"** | **Valid Concept, Non-Standard Name** | Refers to *Relationship-Specific Assets* or *Social Capital*. |
  | **"Always irrational otherwise"** | **Coherent but Rigid** | Logically consistent, but ignores "Learning" as a valid forward-looking reason. |

  ### The Bottom Line
  Your roommate is smarter than the average person on this topic, but they are presenting a **normative model** (how people *should* think) as if it fully explains the **positive reality** (how people *do* think).

  *   **Where they are right:** If you stay *only* because "I spent money," that is irrational. If you stay because "Leaving hurts my reputation" or "Leaving destroys the team's unique chemistry," that is rational.
  *   **Where they are wrong:** They dismiss the psychological reality that "loss aversion" isn't the only driver, and they use a semantic trick to make the signaling exception sound like it doesn't violate the rule.

  **Advice:** Tell them their "Relational Sunk Cost" idea is actually **Asset Specificity**, and their "Signaling" point is **Reputation Capital**. If they reframe it that way, their argument becomes much stronger and less susceptible to the charge that they are just making up exceptions.
