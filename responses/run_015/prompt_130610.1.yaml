answer: |-
  When flesh is cut we name the feeling **pain**,
  We trade a heavy ring of gold for **money**,
  In hemp we tie a tight and stubborn **knot**,
  We watch the ocean rise and fall in **wave**,
  We run across the field to play the **game**,
  We breathe and eat and grow and call it **life**.

  A screen can simulate a digital **life**,
  A machine might scream and signal something **pain**,
  Two strangers click on screens starting **game**,
  A note inside a bank becomes our **money**,
  The air vibrates invisible as **wave**,
  In light alone we bind a shining **knot**.

  No rope is needed now to hold the **knot**,
  A virus hangs between the dead and **life**,
  Chance collapses in a rolling **wave**,
  No body burns yet still there reports **pain**,
  A shell upon the beach once served as **money**,
  The rules exist before we start the **game**.

  Chess counts as sport though no one runs the **game**,
  Pure shape defines the abstract **knot**,
  Numbers on screen replace the physical **money**,
  A fire consumes but does not grant us **life**,
  The limb is gone but still you feel the **pain**,
  Sound moves through air invisible as **wave**.

  Each crest is water moving in the **wave**,
  Each move is wood displaced within the **game**,
  Each flash is firing cells that make the **pain**,
  Each loop is fiber tension in the **knot**,
  Each beat is blood and breath sustaining **life**,
  Each purchase is an entry for the **money**.

  No single stuff defines the essence **money**,
  No single medium carries every **wave**,
  No single spark ignites all kinds of **life**,
  No single board contains the whole of **game**,
  No single strand constitutes the **knot**,
  No single state encompasses all **pain**.

  If matter shifts to settle **money** and the **wave**,
  What work remains for **life**, for **game**, to do?
  When matter ties the **knot** and feels the **pain**?
