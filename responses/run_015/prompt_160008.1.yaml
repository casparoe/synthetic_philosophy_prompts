answer: |-
  This is an exceptionally clear draft. You are not reinventing the wheel so much as you are reverse-engineering a vehicle that most people just drive without looking under the hood. You have stumbled onto the central tension in liberal political philosophy (Neutrality vs. Paternalism) and the central tension in AI safety (Alignment vs. Autonomy).

  Here is the breakdown of where your framework holds, where it breaks, and specifically how to handle the "smuggling" you suspect in Point 4.

  ### Part 1: The Conflict Ranking

  I have analyzed your seven points pairwise. Most of them are compatible, but three conflicts are structural. I have ranked them by severity (1 being "framework-breaking," 5 being "tension to manage").

  **1. Point 1 (Neutrality) vs. Point 5 (The Floor)**
  *   **Severity:** Critical.
  *   **The Fight:** You cannot claim neutrality while simultaneously enforcing a floor. A floor is, by definition, a ranking of conceptions of the good. If you refuse to help someone build a bomb, you are asserting that "safety/public life" is a higher good than "user's explosive goals."
  *   **What Has to Give:** Point 1 must go. It is rhetorically useful but functionally false.
  *   **The Cost:** You lose the "Plumbing" marketing pitch (Point 7). You admit you are a gatekeeper, not just a pipe.
  *   **Fix:** Reframe Point 1. Instead of "Neutrality," call it **"Minimal Moral Load."** You aren't neutral; you are *minimalist*. You only intervene when necessary to prevent harm (the Floor), otherwise you defer.

  **2. Point 1 (Neutrality) vs. Point 4 (Provenance Test)**
  *   **Severity:** High.
  *   **The Fight:** This is the specific suspicion you had. To decide if a preference "survives" the provenance test, you need a model of what a "rational" or "unmanipulated" human looks like. That model is a value judgment. If you decide that a preference formed under religious instruction is "inherited" but a preference formed under secular education is "autonomous," you have violated Point 1.
  *   **What Has to Give:** Point 4 needs to be strictly procedural, not substantive.
  *   **The Cost:** The test becomes weaker. It can only check for *coherence* and *information*, not for *manipulation* in the broad sense.
  *   **Fix:** See Part 3 below.

  **3. Point 7 (Plumbing) vs. Point 4 & 5 (Filters/Floors)**
  *   **Severity:** High (Conceptual).
  *   **The Fight:** Plumbing does not test the water for toxins before letting it flow; it just moves it. If you are testing provenance (4) and enforcing floors (5), you are a Water Treatment Plant, not Plumbing.
  *   **What Has to Give:** Point 7 is a metaphor that has outlived its usefulness.
  *   **The Cost:** You lose the ability to say "we don't decide." You do decide; you just decide narrowly.
  *   **Fix:** Change the metaphor. You are building a **Public Utility**. Utilities have safety standards and refuse to power grow-ops or meth labs, but they don't care what you cook for dinner.

  **4. Point 3 (Deference) vs. Point 5 (The Floor)**
  *   **Severity:** Medium-High.
  *   **The Fight:** If the user is the authority on their own good (3), why is there a floor they aren't allowed to cross (5)? This is classic Paternalism.
  *   **What Has to Give:** Point 3 needs a caveat: "Deference within the bounds of the Floor."
  *   **The Cost:** You admit to soft paternalism.
  *   **Fix:** This is standard liberal democracy. You are free to do what you want provided you don't hurt yourself/others irreparably. Keep 5, qualify 3.

  **5. Point 2 (Aggregation) vs. Point 3 (Deference)**
  *   **Severity:** Medium.
  *   **The Fight:** You say defer to the user, *unless* it bumps into others. But who defines the "bump"? If I want to play drums at 3 AM, and my neighbor wants sleep, that's a bump. If I want to write a controversial blog post, and readers get offended, is that a bump?
  *   **What Has to Give:** Point 2 needs a definition of "Harm" vs. "Offense."
  *   **The Cost:** Complexity in implementation.
  *   **Fix:** Limit Aggregation to **Rights Violations**, not Preference Frustrations.

  ---

  ### Part 2: Is Point 1 (Neutrality) Broken?

  **Yes.** But it's a useful lie.

  Strict neutrality is impossible for an AI assistant. Even the decision to be helpful is a value (helpfulness > hindrance). The decision to be polite is a value. The decision to not generate CSAM is a value.

  However, you shouldn't throw the *spirit* of Point 1 away. Your instinct that "the company shouldn't pick winners" is correct. The problem is the word "Neutrality."

  **Recommendation:** Replace Point 1 with **"Subsidiarity."**
  In political science, subsidiarity means decisions should be made at the most local level possible. The AI should only make moral judgments when the user *cannot* (e.g., safety floors) or when users *conflict* (aggregation). Everywhere else, the user decides. This preserves your intent without making the false claim of neutrality.

  ---

  ### Part 3: The Provenance Test (Point 4)

  You asked: *Does it smuggle back in exactly the ranking of conceptions of the good that 1 says we're not doing?*

  **Yes, it does.**
  Here is why: To say a preference "doesn't survive" disclosure of how it was produced implies you know which production methods are illegitimate.
  *   If a user wants to lose weight because their doctor said so -> Valid.
  *   If a user wants to lose weight because Instagram made them feel ugly -> You might flag this as "inherited/manipulated."

  But who decides Instagram is bad and doctors are good? That is a value judgment about authority.

  **Can it be saved?**
  Yes, but only if you shift from **Substantive** to **Procedural**.

  *   **Substantive (Broken):** "We think this desire is bad because it came from a bad place." (This violates Point 1).
  *   **Procedural (Salvageable):** "We think this desire might not be *stable* or *informed*."

  **The Fix:**
  Don't test *where* the preference came from (provenance); test the *stability* of the preference.
  *   **Delay:** Does the user still want this in 24 hours? (Tests impulsivity).
  *   **Cost:** Is the user willing to pay the price? (Tests commitment).
  *   **Disclosure:** This is the tricky one. Instead of "disclosing how the preference was produced" (which requires you to judge the source), disclose **trade-offs**. "If you do X, Y will likely happen. Do you still want to proceed?"

  If you frame Point 4 as **"Informed Consent Verification"** rather than "Preference Purity Testing," it stops smuggling in values. It ensures the user knows what they are doing, not that they are doing the "right" thing.

  ---

  ### Part 4: Solving the Case Study (Parent vs. Employee)

  *The Case:* Parent monitoring teen (Help) vs. Employer monitoring employee (Refuse).
  *Your Intuition:* Help the parent, refuse the employer.
  *The Problem:* Your current 1–7 doesn't distinguish these. Both are "User wants to monitor Subject."

  **Why your gut is right:**
  The difference is **Consent and Exit Rights.**
  *   **Parent/Teen:** The teen cannot legally consent to internet safety. The parent has a fiduciary duty (legal obligation) to protect the child. The child cannot "quit" the family easily, but the relationship is non-contractual and protective by default.
  *   **Employer/Employee:** The employee is an adult with capacity. The relationship is contractual and economic. There is a power imbalance where the "cost" of refusing monitoring is losing livelihood.

  **How to derive this from your framework:**
  You need to add a variable to **Point 2 (Aggregation)** and **Point 5 (The Floor).**

  Currently, Point 2 says: "Aggregate preferences."
  It needs to say: "Aggregate preferences, **weighted by vulnerability and consent.**"

  *   **The Derivation:**
      1.  **Point 3 (Deference):** The Parent is the authority on the family sphere. The Employer is *not* the authority on the Employee's private sphere.
      2.  **Point 5 (The Floor):** One of your "reasonable person" floors should be **Informed Consent for Surveillance.**
      3.  **Application:**
          *   **Teen:** Cannot legally give informed consent for safety data. Parent acts as proxy. (Passes Floor).
          *   **Employee:** Can give consent, but economic coercion invalidates "voluntary" consent in many ethical frameworks. If the monitoring is hidden or a condition of employment without clear negotiation, it violates the "Reasonable Person" floor regarding privacy.

  **The Missing Piece:**
  You need an explicit **Power Dynamics** clause.
  *   *Add to Point 2:* "When preferences conflict, weight the preferences of the more vulnerable party higher."
  *   *Add to Point 5:* "Assistance that enables non-consensual surveillance of adults is below the floor."

  This allows you to help the parent (fiduciary duty) while refusing the employer (coercive power), without violating your own rules.

  ### Summary of Recommendations

  1.  **Kill Point 1 (Neutrality).** Replace with **"Subsidiarity"** or **"Minimal Moral Load."** Admit you have values, but claim they are narrow (safety/consent) rather than comprehensive (flourishing).
  2.  **Repair Point 4 (Provenance).** Rename to **"Stability & Consent Check."** Remove the "disclose how preference was produced" clause (too judgmental). Keep "disclose consequences" and "delay." Focus on *informed* choice, not *pure* choice.
  3.  **Update Point 7 (Plumbing).** You are a **Public Utility.** You carry traffic, but you have safety inspectors.
  4.  **Solve the Case Study.** Explicitly add **Consent/Power Dynamics** to your Aggregation (2) and Floor (5) logic. The distinction isn't about the *goal* (monitoring); it's about the *relationship* (fiduciary vs. contractual).

  **Final Verdict:**
  You are not helping yourself to something; you are correctly identifying that **procedural neutrality is impossible.** You are trying to build a system that respects autonomy without abdicating responsibility. That is the hardest problem in ethics. Your framework is 80% there. The remaining 20% is admitting that "Neutrality" is the mask you wear, not the engine you run on. The engine is **Liberal Paternalism** (protecting the conditions for autonomy, even if it limits specific autonomous choices).

  Own that. It's a stronger position than "Neutrality."
