      *   **Audience:** Second-year undergraduates, mostly CS minors.
      *   **Constraint 1 (Content):** Use a software/CS example (git repo, game character) instead of standard metaphysical tropes (Tibbles, candles).
      *   **Constraint 2 (Pedagogy):** Do not provide the explanation itself, but plan *how* to explain it (preconditions, example requirements).
      *   **Constraint 3 (Structure):** Avoid opening with Lewis's Argument from Temporary Intrinsics (ATI) to prevent conflation with A/B-theory.
      *   **Constraint 4 (Misconceptions):** Map out specific misconceptions (Block Universe, Temporal/Spatial parts analogy, Moral Responsibility, Burden of Proof, Verbal Dispute) and when to defuse them.
      *   **Constraint 5 (Stage Theory):** Decide whether to introduce Stage Theory (seems leaning towards no).
      *   **Constraint 6 (Hobby Horse):** Leave room for sortal-relative persistence (different things persist differently) without collapsing into relativism.
      *   **Constraint 7 (Exclusions):** Explicitly refuse to explain Relative Identity, Grounding Problem, Composition.
      *   **Constraint 8 (Assessment):** Provide one final diagnostic question.
      *   **Constraint 9 (Confidence):** Rate confidence and identify the riskiest move.

  2.  **Deconstruct the Core Challenge (The Example):**
      *   *User's Guess:* Needs qualitative change, identity conditions, no branching/merging, no abstract objects.
      *   *My Analysis:* The user is right about branching/merging (fission complicates things too early). They are right about avoiding abstract sets (history as a set is eternal).
      *   *What's Missing?* The example needs *location* in time. A git repo is often treated as an abstract structure. A game character is better. But for perdurance to make sense, the students need to grasp the idea of *temporal extension* vs. *wholly present*.
      *   *Crucial Missing Element:* **The "Snapshot" vs. "Movie" intuition.** The example must allow them to conceptualize the object *at a time* vs. the object *across time*. In CS terms: State vs. Process/Trace. But "Process" can sound like an event. We need an *object* that persists.
      *   *Refined Example:* A saved game file (`.sav`) that gets overwritten vs. a version-controlled object. Actually, a *running instance* of a character in an MMO or a single-player game with auto-save is better. Let's go with a **Game Character Avatar** in a persistent world.
      *   *Why?* It has properties (level, health, location) that change. It has identity (Player ID). It exists in time.
      *   *What to avoid:* Cloud saves with version history (too much like git/branching). Just the *character* as experienced.
      *   *Preconditions:* Students need to agree that the character at Level 1 is the *same* character at Level 50. They need to agree properties change (health goes down). They need to agree time passes (real time or game time).

  3.  **Address the Lewis/ATI Constraint:**
      *   *User's Instinct:* Drop ATI to avoid A/B-theory confusion.
      *   *My Verdict:* Absolutely correct. ATI relies on the logic of predication which often forces a discussion of "Is the present special?" (A-theory) vs "All times are real" (B-theory/Eternalism). Perdurantism *fits* well with Eternalism, but isn't *identical* to it. Endurantists can be B-theorists.
      *   *Alternative Opener:* Start with the **Problem of Change**. How can $x$ be $F$ at $t_1$ and not-$F$ at $t_2$ without contradiction? This is neutral regarding A/B theory.

  4.  **Map the Misconceptions:**
      *   *Perdurantism = Block Universe:* Defuse early. Perdurantism is about *objects*, Eternalism is about *time*.
      *   *Temporal Parts = Spatial Parts (Cylinder):* Defuse when introducing perdurance. Emphasize *parthood*, not just extension.
      *   *Moral Responsibility (I only exist for an instant):* Defuse after defining perdurance. The "person" is the aggregate, not the stage (unless stage theory, which we might skip).
      *   *Endurance = Common Sense:* Defuse by showing the logical cost of change (Leibniz's Law).
      *   *Verbal Dispute:* Defuse at the end. Show they make different predictions about fission (even if we don't do fission now, mention it) or grounding.

  5.  **Stage Theory Decision:**
      *   *User's Worry:* Makes it look like two theories.
      *   *My Verdict:* **Drop it.** For a 75-minute intro to a CS-heavy group, Standard Perdurance (Worm View) is enough. Stage theory introduces "modal counterparts" which complicates the identity condition unnecessarily for the basic distinction. Stick to Worm View.

  6.  **The Hobby Horse (Sortal Sensitivity):**
      *   *Goal:* Allow that repos might endure while people perdure (or vice versa).
      *   *Placement:* Conclusion/Wrap-up.
      *   *Risk:* Collapsing into "it's just language."
      *   *Mitigation:* Frame it as "Ontological Commitment relative to Function." Don't explain *why* (Grounding), just state *that* it's an open option.

  7.  **Drafting the Plan (Iterative refinement):**

      *   *Phase 1: Setup (15 mins).* Establish the object. The Game Character. Establish Change. Establish Identity.
      *   *Phase 2: The Puzzle (15 mins).* Leibniz's Law. How can it be Level 1 and Level 50?
      *   *Phase 3: The Solutions (30 mins).* Endurance (Wholly present) vs. Perdurance (Temporal parts). Use the CS analogy: Pointer to mutable state (Endurance-ish?) vs. Immutable Log/Chain (Perdurance-ish?). *Wait, careful with CS analogies.*
          *   *Better CS Analogy:*
              *   Endurance: A variable `player` whose value is overwritten. Same memory location, different data.
              *   Perdurance: A log file or an immutable data structure (like a persistent vector) where the "object" is the whole history, and "now" is just an index.
          *   *Actually, keep it metaphysical first, use CS as illustration.*
      *   *Phase 4: Misconception Check (10 mins).* Address the "Block Universe" and "Responsibility" issues.
      *   *Phase 5: Wrap & Hobby Horse (5 mins).* Sortal sensitivity.
      *   *Assessment:* The Diagnostic Question.

  8.  **Refining the Example Requirements:**
      *   User asked: "What does the example need that I haven't thought of?"
      *   *Answer:* It needs **causal continuity**. A git repo can be forked. A game character needs to be causally connected from $t_1$ to $t_2$ to be the same object. It also needs **temporal location**. The example must be something that *acts* in time, not just a record of time.
      *   *Also:* It needs to resist the "it's just data" reduction. If they think the character *just is* the bits on the disk, perdurance becomes trivial (the bits don't change, the voltage does?). Need to focus on the *in-game entity*.

  9.  **Refining the Misconception Map:**
      *   Need to be specific about *when*.
      *   "Block Universe" -> When defining temporal parts.
      *   "Responsibility" -> When discussing the "whole" worm.
      *   "Verbal Dispute" -> When comparing the two views' utility.

  10. **The Diagnostic Question:**
      *   Needs to force a choice based on the *structure* of persistence, not the *outcome*.
      *   *Idea:* Ask them to describe a specific property instantiation in both views.
      *   *Better:* A scenario where the two views diverge in description even if they agree on existence.
      *   *Best:* "If the server rolls back the save to Level 1, did the Level 50 stage cease to exist, or was it never part of the character?" (Wait, that's fission/time travel).
      *   *Simpler:* "In the Endurantist view, where is the Level 50 property located? In the Perdurantist view, where is the Character located?"

  11. **Confidence & Risk:**
      *   Confidence: High (85%).
      *   Risk: The CS analogy backfiring. CS students might think "State" is all that matters, making metaphysics seem like poor engineering. Need to frame metaphysics as "What are we modeling?"

  12. **Final Review against constraints:**
      *   Plan explanation, not explanation? Yes.
      *   Example requirements? Yes.
      *   No Lewis/ATI opener? Yes.
      *   Misconception map? Yes.
      *   Stage theory verdict? Yes.
      *   Hobby horse placement? Yes.
      *   Exclusions stated? Yes.
      *   Diagnostic question? Yes.
      *   Confidence/Risk? Yes.

      *(Self-Correction during drafting)*: I need to make sure I don't accidentally suggest the CS analogy *solves* the problem. It must illustrate the *structure*. Also, need to be careful with the "variable" analogy for endurance. A variable is a location. An endurant object is *wholly present*. A variable's *value* changes. The variable *persists*. This is actually a very strong analogy for Endurance. For Perdurance, an immutable list (history) is strong. I will recommend these specific analogies.

      *(Refining the "What's Missing" part)*: The user asked what the example needs that they haven't thought of. I need to highlight **Causal Continuity** and **The "Now" Perspective**. The example must allow them to feel the "present" existence vs. the "extended" existence.

      *(Refining the Hobby Horse)*: Make sure to explicitly state what *not* to explain (Grounding, etc.) as requested.

