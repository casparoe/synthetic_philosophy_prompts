answer: |-
  Here is a structural plan for your 75-minute seminar, designed to leverage your audience's CS background while safeguarding against the specific conceptual pitfalls you identified.

  ### 1. The Example: Requirements & Preconditions
  You are correct that you need qualitative change and identity, and that you must avoid branching (fission) and abstract sets. However, there are three specific features your software example needs that you haven't explicitly listed. Without these, the metaphysical distinction collapses into a database schema discussion.

  1.  **Causal Continuity (The "Pointer" Constraint):** The example must imply that the state at $t_2$ depends on the state at $t_1$. A git commit hash is just a label; a *running process* or an *avatar instance* implies causal flow. If the example feels like a static list of records, perdurance looks like the only obvious choice (a log file *is* a worm). You need them to feel the pull of the "single thing acting now" (Endurance) before you offer the "sum of stages" (Perdurance).
  2.  **The "Dereference" Intuition:** The example must allow for the question: "When I interact with this object *now*, what am I touching?"
      *   *Endurance intuition:* I am touching the whole object (the variable).
      *   *Perdurance intuition:* I am touching a slice of the object (the current value/state).
  3.  **Resistance to "Just Data" Reduction:** CS students often reduce objects to their current memory state. You must stipulate that the *identity* of the object survives a total wipe-and-reload of properties (e.g., a respec of all skill points). If they think identity *is* the property set, endurance is impossible.

  **Recommendation:** Use a **Single-Player Game Avatar with Auto-Save**.
  *   *Why:* It avoids the branching/merging of Git. It avoids the "abstract history" of a repo (the character *plays*, it isn't just a record). It allows for total qualitative change (Level 1 Mage $\to$ Level 50 Warrior) while maintaining identity (Save File ID).
  *   *What to explicitly stipulate:* "We are talking about the Character, not the Save File on the disk. The Save File is the evidence; the Character is the entity in the game world."

  ### 2. Sequencing & The Lewis/ATI Decision
  **Verdict:** You are absolutely right to drop the Argument from Temporary Intrinsics (ATI) as the opener.
  **Why:** ATI forces a discussion on the logic of predication ("How can $x$ be $F$ and not-$F$?"). For second-years, this almost invariably triggers a debate on whether "past and future are real" (Eternalism) vs. "only now is real" (Presentism). They will conflate Perdurantism with Eternalism and Endurantism with Presentism. While correlated, they are distinct debates.
  **Alternative Opener:** Start with **The Problem of Change via Leibniz's Law**.
  1.  Character $C$ at $t_1$ has Property $P$ (Level 1).
  2.  Character $C$ at $t_2$ lacks Property $P$ (Level 50).
  3.  If $C$ at $t_1$ is identical to $C$ at $t_2$, then by Leibniz's Law, they must share all properties.
  4.  They don't. Contradiction.
  *This sets up the need for a solution without invoking the nature of time itself.*

  ### 3. The Misconception Map
  Here is where you insert the defusing moves in the 75-minute flow.

  | Time | Misconception | Defusing Move |
  | :--- | :--- | :--- |
  | **Min 15** (Defining Perdurance) | *"Perdurantism is the Block Universe / Eternalism."* | **Explicit Separation:** State clearly: "Eternalism is a theory about *time* (do past/future exist?). Perdurantism is a theory about *objects* (are they extended in time?). You can be a Presentist Perdurantist (though rare). Don't confuse the container with the content." |
  | **Min 30** (Temporal Parts) | *"Temporal parts are just spatial parts, so I'm a spacetime cylinder."* | **The Indexical Check:** Ask: "Can you point to your temporal parts?" (No). "Can you point to your spatial parts?" (Yes). Emphasize that temporal parthood is a metaphysical claim about *existence conditions*, not a visualizable shape. Use the CS analogy: A temporal part is like a *struct instance* in a log, not a physical slice of a hard drive. |
  | **Min 45** (Implications) | *"If I have temporal parts, I only exist for an instant and nobody is responsible for anything."* | **The Worm Aggregate:** Clarify that on the standard "Worm View" (which you are teaching), *You* are the whole worm, not the stage. The stage is a part of you. You are responsible because the *whole worm* committed the act, even if only a *part* of the worm was present at the time. |
  | **Min 60** (Comparing Views) | *"Endurantism is just naive common sense so the burden is all on the other side."* | **The Cost of Change:** Remind them that Endurance requires explaining away the contradiction in Leibniz's Law (usually via indexing properties to times). Perdurance dissolves the contradiction but costs ontological parsimony. Both pay a price. |
  | **Min 70** (Wrap Up) | *"The two views are really the same description in different language."* | **The Fission Tease:** Mention (without solving) that if the save file corrupts and splits into two valid continuations, the two views give different answers on which one is the *original* character. This proves they aren't just verbal variants. |

  ### 4. The Stage Theory Verdict
  **Verdict:** **Do not introduce Stage Theory.**
  **Reasoning:** You have 75 minutes. Standard Perdurantism (Worm Theory) is already a heavy lift. Stage Theory (Exdurantism) requires explaining "modal counterparts" to handle persistence, which introduces possible worlds semantics. This will fracture the room into "Wait, so I don't exist tomorrow?" debates. Stick to the Worm View (the object is the aggregate of stages) to keep the contrast with Endurance (the object is wholly present at each stage) clean.

  ### 5. The Hobby Horse (Sortal Sensitivity)
  **Placement:** The final 5 minutes (Post-Misconception Check).
  **Strategy:** Frame this as **"Ontological Pluralism regarding Persistence."**
  *   **Say:** "We've treated 'The Character' as one kind of thing. But consider the *Game World* itself vs. the *Character* vs. the *Quest Log*."
  *   **The Move:** Suggest that the *Quest Log* (a record) might perdure, while the *Character* (an agent) might endure.
  *   **The Refusal:** Explicitly state: "I am not going to explain *what grounds* this difference today. We are not doing **Grounding**, we are not doing **Relative Identity**, and we are not doing **Composition**. I am only claiming that the *question* is open. Your job is not to decide which theory is true for *everything*, but to know how to apply the distinction."
  *   **Why this works:** It satisfies your intellectual interest without burdening them with the machinery that usually breaks this claim (i.e., they don't need to know *how* to ground it, just that they *can* choose differently for different sorts).

  ### 6. The Diagnostic Question
  Do not ask "Define endurance." Ask them to apply the structure to a property instantiation.

  **The Question:**
  > "Consider the statement: *'The Character was Level 1 at 2:00 PM.'*
  >
  > 1.  If you are an **Endurantist**, what is the subject of this sentence (The Character) doing at 2:00 PM?
  > 2.  If you are a **Perdurantist**, what is the subject of this sentence (The Character) doing at 2:00 PM?
  > 3.  **Crucially:** In the Perdurantist answer, does the *whole* Character exist at 2:00 PM? Why or why not?"

  **Success Criteria:**
  *   **Fail:** They say "The character exists at 2pm" for both, or "The character is a worm" for both.
  *   **Pass:** They identify that for the Endurantist, the *whole* object is present and bears a relation to the time. For the Perdurantist, only a *temporal part* is present at 2pm, and the "Character" (the worm) is not wholly present at any single time.

  ### 7. Confidence & Risk Assessment
  **Confidence Level:** **85%**
  This plan respects the cognitive load of second-years while leveraging their specific domain knowledge (CS) without letting that knowledge hijack the metaphysics.

  **The Riskiest Move:** **The CS Analogy for Endurance.**
  *   **Why:** CS students are trained to think of objects as mutable state (variables). This maps *too well* to Endurance (the variable persists, the value changes). They may conclude Endurance is "obviously correct" because it matches their programming paradigm, dismissing Perdurance as "inefficient engineering" rather than a metaphysical stance.
  *   **Mitigation:** When you introduce the variable analogy for Endurance, immediately pair it with the **Immutable Log** analogy for Perdurance. You must frame the Immutable Log not as "better code," but as "a different way of modeling identity." Remind them that in the Immutable Log model, the "Object" is the *entire list*, not the current head. If they treat the "current head" as the object, they have misunderstood Perdurance. You must catch this specific error in the room.

  **Final Advice:** Keep the "Block Universe" warning visible on the board throughout the seminar. Write "OBJECTS $\neq$ TIME" in the corner. Every time a student asks about the reality of the future, point to the corner. This visual anchor will save you 15 minutes of digression.
