answer: |-
  **DRAFT JOINT STATEMENT ON THE SPECIES PROBLEM**
  **Adversarial Collaboration: Pluralist and General-Lineage Monist Positions**

  **1. Agreed Claims**

  1.  **Taxa versus Category:** We agree that a distinction must be drawn between species *taxa* (the particular groups of organisms in the world) and the species *category* (the rank assigned to those groups). We further agree that species taxa are mind-independent entities produced by evolutionary processes, whereas the status of the species category as a natural kind or a conventional cut is the primary locus of our ontological disagreement.
  2.  **Failure of Universal Criteria:** We agree that no single operational criterion (e.g. reciprocal monophyly, reproductive isolation, ecological niche distinctness, or fixed diagnostic characters) applies successfully to every group of organisms without exception or ad hoc modification.
  3.  **Epistemic Utility:** We agree that eliminating species talk from biology would result in unacceptable epistemic loss. Species designations facilitate induction, conservation prioritisation, and communication across sub-disciplines in a way that reference to unique lineage segments or individual organisms alone cannot.
  4.  **Lineage Reality:** We agree that evolution proceeds via the replication and modification of lineages. We disagree only on whether the term 'species' picks out a specific type of lineage segment universally, or whether it picks out different sorts of biological units depending on context.
  5.  **Detection versus Ontology:** We agree that there is a logical distinction between what a species *is* (its ontology) and how we *identify* it (its epistemology). We disagree on whether the multiplicity of identification methods implies a multiplicity of ontological kinds.
  6.  **Grades of Pluralism:** We agree to distinguish two grades of pluralism for the purpose of this statement. *Question-relative pluralism* holds that the correct species concept for a single group of organisms varies depending on the research question (e.g. conservation vs. phylogenetics). *Taxon-relative pluralism* holds that different parts of the tree of life (e.g. vertebrates vs. bacteria) demand fundamentally different species concepts due to divergent evolutionary dynamics.
  7.  **Historical Contingency:** We agree that the expectation of a single, universal species concept is partly a historical artefact of vertebrate zoology, where reproductive isolation and morphological distinctness often coincide neatly. We disagree on whether this coincidence is a lucky break for method or a clue to a deeper unity.
  8.  **Temporal Segments:** We agree that species are temporally bounded segments of genealogical history, not timeless classes. A species comes into existence and goes out of existence via speciation and extinction events.
  9.  **Hybridisation:** We agree that hybridisation and introgression are widespread phenomena that complicate boundary drawing but do not, in themselves, prove that species are unreal.
  10. **Systematic Stability:** We agree that taxonomic stability is a pragmatic virtue. Frequent renaming of taxa due to shifts in philosophical conception undermines the utility of biological nomenclature.
  11. **Gene Flow:** We agree that gene flow is a matter of degree and does not switch on or off instantaneously at the moment of speciation.
  12. **Realism:** We agree that this dispute is not between realists and nominalists. Both sides accept that there are objective facts about organismal relatedness and population structure. The dispute concerns how those facts map onto the term 'species'.

  **2. Table of Residual Disagreements**

  | Crux | Pluralist Formulation | Monist Formulation | Shared Evidence / Case | Predictions |
  | :--- | :--- | :--- | :--- | :--- |
  | **Asexual and Microbial Organisms** | **Taxon-relative pluralism applies.** In organisms where vertical descent is obscured by horizontal gene transfer (HGT) and clonality, the 'lineage' concept dissolves into a network. Here, a concept based on ecological cohesion or gene-flow clusters is ontologically distinct from the lineage concept used for mammals. One concept does not cover both. | **General lineage applies.** Even in microbes, there is a metapopulation lineage. HGT is noise within a broader signal of vertical inheritance of the core genome. Ecological distinctness is merely a criterion indicating where the lineage is maintaining cohesion against the entropic pressure of HGT. | *Prochlorococcus* ecotypes. These marine cyanobacteria show distinct ecological adaptations and genomic clusters despite high potential for recombination and lack of sexual reproduction. | **Pluralist:** Applying the Biological Species Concept here is category error; we must switch to an Ecological Concept. <br> **Monist:** The Ecological Concept is simply the best *detector* for the underlying lineage segment in this high-HGT environment. |
  | **Divergence with Gene Flow** | **Question-relative pluralism applies.** For a pair of diverging populations exchanging genes, whether they are 'one species' or 'two' depends on the query. For a conservationist, they are two units to be protected; for a population geneticist, they are one panmictic pool. Both answers are objectively correct relative to the aim. | **General lineage applies.** There is a fact of the matter regarding lineage separation. If cohesive forces (selection, mating preference) maintain distinctness despite gene flow, they are one lineage segment (one species). If cohesion breaks, they are two. The conservationist's 'unit' is a management construct, not a species. | *Ensatina* salamanders (or similar ring/parapatric complexes). Populations are distinguishable and locally adapted but connected by gene flow at the boundaries. | **Pluralist:** We should tolerate the contradiction: they are one species phylogenetically, two species ecologically. <br> **Monist:** They are one species until the chain of connectivity is broken; calling them two is a pragmatic shorthand, not a biological truth. |
  | **The Continuum (No Gaps)** | **The Category is Conventional.** If a continent-scale genomic survey reveals a continuum of pairwise divergence with no gaps (isolation-by-distance only), then the species rank is like 'mountain' or 'river'. We draw lines for utility, but nature provides no joints. Taxon-relative pluralism admits some groups simply lack species boundaries. | **The Lineage is Real.** Gaps in divergence are not required for lineage existence. A species is a causal system, not a statistical cluster. Even in a continuum, there are distinct metapopulation segments bound by common fate. The lack of gaps makes detection hard, not the ontology false. | Hypothetical continental genomic survey of a widespread terrestrial vertebrate showing isolation-by-distance with zero bimodality in genetic distance. | **Pluralist:** We must acknowledge there are no species here, only populations. Imposing species names is misleading. <br> **Monist:** There are still species (lineage segments), but our criteria (gap-detection) have failed. We must find better markers of cohesive fate. |
  | **Concept versus Criterion** | **Constitutive Pluralism.** The Monist claims criteria are merely detectors for one thing. I argue that in different contexts, the criteria *constitute* the kind. Reproductive isolation *makes* a species in sexual taxa; ecological distinctness *makes* a species in asexual taxa. There is no 'thing' behind the criteria other than the biological processes themselves. | **Absorption Strategy.** The Pluralist mistakes the mechanism of cohesion for the ontological unit. Interbreeding and ecological selection are both *causes* of lineage separation. The 'one thing' is the segregated evolutionary trajectory. All pluralist concepts are partial descriptions of the conditions required to maintain that single type of entity. | Theoretical analysis of speciation models. Models show that both selection and assortative mating can lead to the same topological outcome (distinct clusters). | **Pluralist:** The topological outcome is not enough; the *process* defining the cluster matters for theory. <br> **Monist:** The process matters for explaining *how* the species arose, not for defining *what* the species is. |

  **3. Assessment of Verbal Disputes and Falsification Conditions**

  **Merely Verbal Elements**
  We suspect a portion of our disagreement is verbal, centring on the word 'concept'. The Monist uses 'concept' to refer to an ontological definition (what a species *is*), whereas the Pluralist often uses 'concept' to refer to a theoretical framework that includes both ontology and preferred criteria for individuation. If the Monist concedes that different theoretical frameworks require different operational definitions, and the Pluralist concedes that all these frameworks aim to track evolutionary independence, the distance between us narrows. However, we do not believe the dispute is *entirely* verbal. The Pluralist maintains that the biological reality itself is fragmented (different kinds of units exist), while the Monist maintains that the biological reality is unified (one kind of unit exists), and only our access to it is fragmented.

  **Falsification Conditions**
  To move beyond this stalemate, each side specifies what evidence would compel them to abandon their position:

  *   **For the Pluralist:** I would abandon taxon-relative pluralism if it were demonstrated that a single operational criterion (e.g. a specific threshold of genomic divergence or a specific measure of reproductive isolation) could successfully delineate evolutionary units across bacteria, fungi, plants, and animals without requiring ad hoc adjustments for different groups. If the 'General Lineage' can be operationalised universally without losing predictive power, the motivation for pluralism collapses.
  *   **For the Monist:** I would abandon the General Lineage Conception if it were shown that 'lineage segmentation' is incoherent in the absence of reproductive isolation. Specifically, if asexual organisms are shown to evolve purely as transient genetic clusters with no persistent genealogical cohesion over time (i.e., if the 'core genome' is entirely fluid), then the claim that they constitute 'species' in the same sense as sexual vertebrates would be untenable. If the category 'species' must be defined so loosely to include such cases that it loses all explanatory power regarding biodiversity patterns, I would concede that the category is merely conventional.
