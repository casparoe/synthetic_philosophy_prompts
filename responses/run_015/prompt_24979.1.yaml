prompt: |-
  I'm presenting to my local effective altruism group next week on why moral trade deserves more than the dismissive shrug it usually gets. My thesis is that if you take moral uncertainty seriously — even just a little — then refusing to engage in moral trade with someone whose values differ from yours is often a mistake by your own lights, and that the standard objections (it's unverifiable, it's a gimmick, it requires treating values like preferences) don't hold up as well as people think.

  The audience is about twenty people, mostly committed utilitarians who have done the introductory EA fellowship and have strong views about cause prioritization. Several think the whole idea of moral trade is a distraction from figuring out what actually does the most good. A couple are longtermists who suspect moral trade is just a way for neartermists to get longtermist money. One or two are sympathetic but unconvinced.

  Draft my Q&A prep sheet: the eight or so objections I'll actually face, ordered by how likely and damaging they are, each phrased the way someone in this room would phrase it. For each objection, give me a two-minute reply and a candid note on where the reply is weakest. Include the question I'm hoping nobody asks.
reasoning: |-
  Here's a thinking process that leads to the suggested Q&A prep sheet:

  1.  **Analyze the Request:**
      *   **Topic:** Moral Trade (specifically, why it deserves more attention/less dismissal).
      *   **Thesis:** Moral uncertainty makes refusing trade a mistake by one's own lights; standard objections (unverifiable, gimmick, values $\neq$ preferences) are weak.
      *   **Audience:** ~20 local EA group members. Mostly committed utilitarians, EA Fellowship grads, strong views on cause prioritization. Some think it's a distraction. Some longtermists (suspicious of neartermist motives). Some sympathetic but unconvinced.
      *   **Deliverable:** Q&A Prep Sheet.
      *   **Requirements:** ~8 objections (ordered by likelihood/damage), phrased as the audience would say them, 2-minute reply for each, candid note on weakness, plus the "Question I hope nobody asks."

  2.  **Deconstruct the Audience & Context:**
      *   *Utilitarians:* They care about *actual* outcomes, not just procedural fairness. They might see trade as compromising on the *best* action for a sub-optimal compromise.
      *   *EA Fellowship Grads:* They know the jargon (cause neutrality, counterfactuals, expected value). They value rigor. They might be skeptical of "deals" that lack empirical verification.
      *   *Longtermists:* They worry about existential risk. They might view moral trade as a way to divert resources from AI safety to global health (or vice versa) based on a "deal" rather than truth.
      *   *General EA Vibe:* High standards for evidence, concern about "shilling," concern about distraction from high-impact work.

  3.  **Brainstorming Objections:**
      *   *Objection 1 (The Big One):* If I'm right, why compromise? (Truth vs. Compromise).
      *   *Objection 2 (Longtermist specific):* This diverts money from X-risk to animals/poverty.
      *   *Objection 3 (Epistemic):* How do we verify the trade worked? (Unverifiable).
      *   *Objection 4 (Motivation):* Isn't this just a way to feel good about donating less effectively?
      *   *Objection 5 (Values vs. Preferences):* Values aren't commodities.
      *   *Objection 6 (Coordination/Scale):* This doesn't scale; it's just a parlor trick for rich EAs.
      *   *Objection 7 (Moral Hazard):* Encourages supporting bad causes if someone pays you to.
      *   *Objection 8 (Opportunity Cost):* Time spent trading is time not spent earning/giving.

  4.  **Selecting and Ordering (Likelihood & Damage):**
      1.  *The "Truth Trumps Trade" Objection:* Most fundamental for utilitarians. If you believe X is best, doing Y is wrong. (High Likelihood, High Damage).
      2.  *The Longtermist Diversion:* Specific to this group's composition. (High Likelihood, High Damage).
      3.  *Verification/Enforcement:* How do we know they held up their end? (High Likelihood, Medium Damage).
      4.  *Distraction/Opportunity Cost:* EA is about impact, not deal-making. (Medium Likelihood, Medium Damage).
      5.  *Commodification of Values:* "Values aren't preferences." (Medium Likelihood, Medium Damage).
      6.  *Moral Uncertainty is an Excuse:* "Just figure out what's right instead of hedging." (Medium Likelihood, High Damage).
      7.  *Scalability:* "This works for 20 people, not a movement." (Low Likelihood, Medium Damage).
      8.  *Perverse Incentives:* "I'll support anything if you pay me." (Low Likelihood, High Damage).

      *Refining the Order:* Let's group the "Truth" and "Uncertainty" ones. Let's make sure the Longtermist one is prominent.
      1.  "If you think you're right, why compromise?" (The Utilitarian Core).
      2.  "This is just neartermists siphoning longtermist funds." (The Room's Dynamic).
      3.  "Moral uncertainty is lazy; just do the research." (Epistemic).
      4.  "How do you verify/enforce this?" (Practical).
      5.  "Values aren't preferences to be traded." (Philosophical).
      6.  "It's a distraction from earning/giving." (Opportunity Cost).
      7.  "It doesn't scale." (Movement Building).
      8.  "It creates perverse incentives." (Moral Hazard).

  5.  **Drafting the Replies (Iterative Process):**
      *   *Constraint:* 2-minute reply (approx. 250-300 words spoken at normal pace).
      *   *Tone:* Respectful, EA-aligned, rigorous, not defensive.
      *   *Weakness:* Must be candid.

      *Drafting Objection 1 (Truth vs. Trade):* Focus on moral uncertainty. Even if I'm 90% sure, the 10% matters. Expected value of trade > expected value of stubbornness.
      *Drafting Objection 2 (Longtermism):* Acknowledge the risk. Frame it as "insurance" or "coalition building." If longtermism is wrong, we want neartermist help.
      *Drafting Objection 3 (Verification):* Admit it's hard. Focus on reputation and repeated games.
      *Drafting Objection 4 (Distraction):* Compare to cause prioritization research. It *is* impact work.
      *Drafting Objection 5 (Values vs. Preferences):* Distinguish between terminal values and instrumental actions. We trade actions, not souls.
      *Drafting Objection 6 (Lazy Uncertainty):* Research has diminishing returns. Trade is a low-cost hedge.
      *Drafting Objection 7 (Scale):* Start small. Norm setting matters.
      *Drafting Objection 8 (Perverse Incentives):* Set boundaries. No trading on fundamental rights.

  6.  **Refining the "Question I Hope Nobody Asks":**
      *   Needs to be a "gotcha" that exposes a flaw in the thesis or the speaker's personal stance.
      *   *Idea:* "Would you trade with a Nazi?" (Too extreme).
      *   *Idea:* "Have *you* actually done a trade?" (Personal credibility).
      *   *Idea:* "Doesn't this imply moral realism is false?" (Too philosophical).
      *   *Selection:* "Have you personally engaged in a moral trade, and if not, why should we?" (Hits the "walk the walk" nerve).

  7.  **Review against Constraints:**
      *   8 objections? Yes.
      *   Ordered by likelihood/damage? Yes.
      *   Phrased as audience members? Yes (needs to sound like EA Fellowship grads).
      *   2-minute replies? (Need to keep word count in check).
      *   Candid weakness notes? Yes.
      *   "Hope nobody asks" question? Yes.

  8.  **Final Polish:**
      *   Ensure the tone matches an EA setting (references to EV, cause prioritization, longtermism).
      *   Make sure the "Weakness" sections are truly candid, not just strategic pivots.
      *   Check the "Longtermist" objection specifically, as the prompt highlighted it.

      *(Self-Correction during drafting)*: Make sure the replies don't sound like generic debate points but specifically address *moral trade* logic (e.g., citing the "My Moral Trade" paper concepts or similar logic without necessarily name-dropping unless it helps). Focus on *expected value* under uncertainty.

      *(Refining the "Truth" objection)*: A committed utilitarian might say "I maximize utility." If I trade, I might reduce utility according to my credence. The reply must lean heavily on the *uncertainty* aspect of the user's thesis.

      *(Refining the "Longtermist" objection)*: This is crucial. The reply needs to show why a longtermist should care. Answer: If there's a non-zero chance longtermism is wrong, they benefit from neartermist goodwill/coordination. Also, coalition stability.

      *(Final check on word count)*: A 2-minute spoken reply is roughly 250-300 words. I will aim for that density.

  9.  **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  # Q&A Prep Sheet: Moral Trade & Moral Uncertainty
  **Audience:** Local EA Group (Utilitarian-heavy, Fellowship grads, Longtermist/Neartermist mix)
  **Goal:** Defend moral trade as a rigorous tool under moral uncertainty, not a compromise of values.

  ---

  ### 1. "If I'm confident my cause is best, isn't trading just reducing expected value?"
  **Likelihood:** Very High | **Damage:** High
  **The Vibe:** The committed utilitarian who sees compromise as mathematical loss.

  **Reply:**
  "That's the right baseline assumption: if you were 100% certain of your moral framework, trade would indeed be irrational. But the thesis rests on *moral uncertainty*. Even if you're 90% confident that longtermism is the correct framework, there's a 10% credence you're wrong. If you're wrong, the 'neartermist' cause you're ignoring might be vastly more important than you think.

  Moral trade isn't about abandoning your highest-probability view; it's about maximizing expected value across your *credence distribution*. By agreeing to support a cause you rank second in exchange for someone else supporting a cause you rank first, you're effectively hedging against the risk that your primary moral intuition is mistaken. If you refuse to trade, you're implicitly claiming your moral certainty is high enough that the potential gains from hedging are zero. Given how hard moral philosophy is, that's a risky epistemic stance to take."

  **Candid Weakness:**
  This relies entirely on the audience accepting that moral uncertainty is substantive, not just a placeholder for 'I haven't thought enough yet.' If they believe moral truth is discoverable and they've essentially discovered it, the math doesn't work.

  ### 2. "Isn't this just a mechanism for neartermists to siphon off longtermist capital?"
  **Likelihood:** High | **Damage:** High
  **The Vibe:** The longtermist in the corner worried about AI safety funding getting diverted to deworming.

  **Reply:**
  "It can look that way if you view it as a zero-sum transfer. But consider the coalition value. If longtermists are perceived as unwilling to cooperate on shared nearterm goals, they risk political isolation. A trade isn't just money moving; it's a signal of goodwill.

  More importantly, apply the uncertainty argument again. If there is a non-trivial chance that existential risk estimates are overstated or that nearterm suffering is more tractable than we think, the longtermist benefits from having neartermist allies who are invested in their success. It's not about siphoning; it's about building a robust movement that doesn't fracture along cause-area lines. If you're a longtermist, do you want a world where neartermists are hostile to your project, or one where you have standing agreements of mutual support?"

  **Candid Weakness:**
  It's hard to prove this doesn't just result in net-negative funding flows for x-risk in the short term. It requires trusting that the "coalition value" outweighs the immediate opportunity cost of the dollars moved.

  ### 3. "How do you verify or enforce these trades? It seems unverifiable."
  **Likelihood:** High | **Damage:** Medium
  **The Vibe:** The empiricist who wants measurable impact and accountability.

  **Reply:**
  "You're right that you can't write a legal contract for this. But most high-trust EA coordination relies on reputation, not lawyers. We donate to recommended funds based on trust in their vetting; we share research based on trust in quality. Moral trade operates on the same repeated-game dynamics.

  If I agree to donate to your cause and you don't reciprocate, I don't sue you; I update my model of your trustworthiness and share that update with the community. The 'enforcement' is social capital. Also, many trades can be simultaneous or escrowed through a trusted third party. The barrier isn't verification; it's the willingness to treat promises as binding even without legal recourse."

  **Candid Weakness:**
  Social enforcement is weak against bad actors or one-off interactions. If the group scales beyond a tight-knit community, reputation mechanisms degrade quickly.

  ### 4. "Moral uncertainty is lazy. Shouldn't we just do more research to figure out what's actually right?"
  **Likelihood:** Medium | **Damage:** High
  **The Vibe:** The cause prioritization researcher who thinks trade is a shortcut around hard thinking.

  **Reply:**
  "Research is crucial, but it has diminishing returns. I could spend another ten years studying meta-ethics, or I could acknowledge that after a certain point, my confidence interval isn't narrowing much. Trade is a low-cost hedge against the remaining uncertainty.

  Think of it like portfolio theory. You don't put 100% of your retirement fund into the single asset you think is *most* likely to perform well, even if you've done deep research. You diversify. Moral trade is diversification. It acknowledges that while more research is good, acting on current uncertainty via trade is often higher expected value than waiting for perfect clarity that may never come."

  **Candid Weakness:**
  For some causes (like x-risk), diversification might be catastrophic if the risk is truly imminent. The "portfolio" analogy breaks down if one asset class is "prevent human extinction" and the other is "save chickens."

  ### 5. "Values aren't preferences. Treating them like commodities feels wrong."
  **Likelihood:** Medium | **Damage:** Medium
  **The Vibe:** The deontologist-leaning utilitarian who feels icky about "selling out."

  **Reply:**
  "I share that intuition, but we need to distinguish between terminal values and instrumental actions. We aren't trading our *values*; I'm not asking you to believe animal suffering doesn't matter. We are trading *actions* or *resources* in a world where we disagree on how those values map to outcomes.

  If we both value 'doing the most good' but disagree on what that is, trading resources to satisfy our respective credences is actually more respectful of our shared terminal value than stubbornly fighting over whose instrumental strategy wins. It treats the *goal* as sacred and the *path* as negotiable."

  **Candid Weakness:**
  It's hard to draw the line. If someone wants to trade support for a cause you find morally repugnant (not just less effective, but *bad*), the "instrumental action" defense collapses.

  ### 6. "Isn't this a distraction? Time spent negotiating deals is time not earning or giving."
  **Likelihood:** Medium | **Damage:** Medium
  **The Vibe:** The productivity-focused EA who hates overhead.

  **Reply:**
  "Fair point. If the transaction costs exceed the gains from trade, don't do it. But for large donors or organizations, the 'gains from trade' can be massive in terms of movement cohesion and risk hedging.

  Also, consider that cause prioritization *is* a major time sink for EAs. We spend hours debating longtermism vs. global health. Moral trade offers a framework to resolve that debate pragmatically without requiring consensus. It might actually *save* time by allowing us to stop arguing and start cooperating despite disagreement."

  **Candid Weakness:**
  In practice, negotiating these deals is emotionally and intellectually taxing. It often takes *more* time than just donating unilaterally, which kills the ROI for all but the largest players.

  ### 7. "This works for twenty people in a room. How does it scale to a movement?"
  **Likelihood:** Low | **Damage:** Medium
  **The Vibe:** The movement builder thinking about global coordination.

  **Reply:**
  "It starts as a norm, not a marketplace. We don't need a global exchange for moral trade to work. We just need key influencers and funds to be open to it. If GiveWell and FTX Future Fund (hypothetically) had norms of cooperation under uncertainty, that filters down.

  The goal isn't to have every individual trading with strangers. It's to shift the culture from 'my cause is the only cause' to 'we are partners under uncertainty.' That cultural shift scales even if the specific trades remain localized among high-trust clusters."

  **Candid Weakness:**
  Norms are fragile. Without institutional infrastructure, this remains a parlor trick for the intellectually inclined, which limits actual impact.

  ### 8. "Doesn't this create perverse incentives to support bad causes if the price is right?"
  **Likelihood:** Low | **Damage:** High
  **The Vibe:** The person worried about moral hazard and slippery slopes.

  **Reply:**
  "We need constraints. Moral trade shouldn't apply to actions that violate fundamental rights or cause direct harm, regardless of compensation. There's a 'no trade' zone.

  Within the zone of legitimate EA causes—where we disagree on *priority* but not on *basic morality*—the incentive isn't to support 'bad' causes, but to acknowledge that our ranking of 'good' causes is uncertain. The risk of perverse incentives is real, which is why transparency is key. Publicizing trades allows the community to vet whether a trade crosses a moral line."

  **Candid Weakness:**
  Defining the "no trade" zone is subjective. One person's "legitimate disagreement" is another's "fundamental rights violation."

  ---

  ### The Question I Hope Nobody Asks

  **"Have *you* personally engaged in a moral trade yet? If not, why should we take your advice?"**

  **Why I dread it:**
  Because the answer is "No." I haven't found a partner I trust enough, or the transaction costs felt too high for my donation size. Admitting this undermines the "practicality" argument.

  **Planned Pivot:**
  "I haven't executed one yet, which is part of why I'm presenting this. I'm looking for partners. The fact that it's hard to find trustworthy partners is exactly the coordination problem we need to solve. I'm advocating for the *norm* first, so the *practice* becomes viable."
