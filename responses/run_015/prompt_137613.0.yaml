              *   Individual vs. Collective: One agent vs. many agents acting similarly.
              *   Application: Hitchhiker is usually cited as *Indirect* Individual Self-Defeat for Self-Interest Theory (SIT). SIT says "Maximize your interest." In the standard case, SIT says "Get the disposition to pay" (because that gets the ride), but once in town, SIT says "Don't pay." So SIT tells you to make yourself someone who acts against SIT later.
