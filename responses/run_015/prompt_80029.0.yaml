  2.  **Deconstruct Jeffrey Conditionalization (JC) & Its Problems:**
      *   *The Rule:* $P_{new}(A) = \sum P_{old}(A | E_i) \cdot P_{new}(E_i)$.
      *   *The Input:* A partition $\{E_i\}$ and new probabilities $P_{new}(E_i)$.
      *   *The Problem (Partition Dependence):* If I choose a coarse partition $\{E, \neg E\}$ vs. a fine partition $\{E \land F, E \land \neg F, \neg E \land F, \neg E \land \neg F\}$, and I assign new probabilities to the cells, do I get the same $P_{new}(A)$? Generally, no, unless the input probabilities are constrained in specific ways (rigidity).
      *   *The Problem (Input Justification):* Where do the $P_{new}(E_i)$ come from? JC doesn't tell you how to get the input, only how to process it.
      *   *The Problem (Normativity):* If the output depends on an arbitrary choice of partition, how can it be a rational norm?

  3.  **Drafting the Questions (Iterative Process):**

      *   *Requirement 1 (Partition Sensitivity Toy Example):*
