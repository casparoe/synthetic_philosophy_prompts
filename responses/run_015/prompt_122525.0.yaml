prompt: |-
  Hi — I write novels, and the one I'm working on right now keeps forcing me to work out what I actually think about everyday conventions, because half my scenes turn on a character either honouring or flouting one. I want someone to audit my position before I put a version of it in a character's mouth and get taken apart at a festival panel.

  Roughly where I've landed:

  (1) Queueing-type conventions are genuine moral obligations, not just etiquette. Pushing into a queue is *wrong*, not merely rude, because these are mutually beneficial coordination schemes and it's unfair to take the benefit while skipping the cost.

  (2) A visitor has to follow the local version specifically, not just any old version — "any consistent queue will do" is not good enough. Locals set the terms; I'm a guest.

  (3) Jaywalking is fine. Crossing against the light on an empty street isn't wrong at all, and I don't owe anybody anything for it. Traffic laws bind only when they're actually doing coordination work and someone is affected.

  (4) Tipping in the US is obligatory, and I think it's a different kind of thing from queueing: it isn't coordination, it's compensation for a wage structure that exploits servers. So I tip properly even in cities where the local tipping convention is weak or mean.

  (5) In places where tipping isn't the norm, I don't tip, and I dont think I do anything wrong — even though hospitality workers there are often badly paid too.

  (6) I won't follow a convention I think is morally bad (norms that rank people by caste, gender, age, whatever). Being a guest doesn't require that of me.

  (7) I also follow the local convention when it literally makes no difference to anybody — standing on the right of a completely empty escalator, in a country where that's the done thing. I'd feel like a jerk not to, even though nobody's affected and nobody's watching.

  Two scenes from the novel I keep testing these against. In the city it's set in, people hold a place in a queue by leaving an object in it — a shoe, a bag — and the locals insist a visitor has to honour the object the same as a person. And in that same city everybody crosses wherever they like, the drivers expect it, and it's against the law.

  What I want: go through the seven and tell me which pairs are really in tension and how badly, ordered by severity, with what would have to give in each case and what the cheapest repair would be. Tell me too which of the tensions only *look* like tensions and dissolve when you think about them properly — I've got a feeling at least one of these is fine as it stands, and I'd rather not throw away a commitment I don't have to. Please don't just flag all seven as problematic; I want to know which one I actually have to drop.

  And be clear about which bits of what you say are settled and which are genuinely contested among people who work on this sort of thing — don't present a contested view as if it were the consensus, say which claims you'd only give 60/40, and flag wether anything in your answer is more guess than argument.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** A novelist working on a book where social conventions play a major thematic role.
      *   **Task:** Audit their seven stated positions on social conventions/morality for internal consistency (tensions/contradictions).
      *   **Specific Output Requirements:**
          *   Identify pairs in tension, ordered by severity.
          *   Explain what would have to give and the "cheapest repair" for each tension.
          *   Identify "false tensions" that dissolve upon closer inspection.
          *   Distinguish between settled philosophical consensus and contested views (flag confidence levels).
          *   Avoid simply saying "everything is problematic."
          *   Contextualize with the two novel scenes provided (queue objects, jaywalking).
      *   **Tone:** Intellectual, rigorous, nuanced, helpful for a writer (not just a philosopher), avoiding dogmatism.

  2.  **Analyze the Seven Positions:**
      *   (1) Queueing = Moral Obligation (Fairness/Coordination).
      *   (2) Local Specificity = Required for Visitors (Guest/Host obligation).
      *   (3) Jaywalking = Permissible if no harm/coordination needed (Harm Principle/Coordination).
      *   (4) US Tipping = Obligatory (Compensation for exploitation, distinct from coordination).
      *   (5) Non-US Tipping = Not Obligatory (Even if low wages exist).
      *   (6) Immoral Norms = Do Not Follow (Higher moral law trumps convention).
      *   (7) Empty Escalators = Follow Local Norm (Symbolic respect/Solidarity, even if no practical effect).

  3.  **Initial Brainstorming & Tension Detection:**

      *   *Tension A: (3) Jaywalking vs. (1) Queueing.* Both are coordination schemes. Why is one rigidly moral and the other contingent on harm?
          *   *Severity:* High. This is the core theoretical inconsistency.
          *   *Repair:* Distinguish the *type* of coordination or the *expectation* of reliance.

      *   *Tension B: (4) US Tipping vs. (5) Non-US Tipping.* Both involve low wages. Why is the visitor responsible in one case but not the other?
          *   *Severity:* Medium-High. Looks like arbitrariness or cultural bias.
          *   *Repair:* Frame it as "participation in a specific contract" vs. "general charity."

      *   *Tension C: (2) Local Specificity vs. (6) Immoral Norms.* Obvious, but user already qualifies (6). Is there a subtler tension with (7)?
          *   *Severity:* Low (User acknowledges the exception).
          *   *Repair:* Keep the hierarchy clear.

      *   *Tension D: (3) Jaywalking vs. (7) Empty Escalators.* (3) says "no harm, no foul." (7) says "follow norm even if no harm."
          *   *Severity:* Medium. Why follow the escalator norm if no one is affected, but ignore the traffic light if no one is affected?
          *   *Repair:* Distinguish "coordination norms" from "solidarity/respect norms."

      *   *Tension E: (1) Queueing vs. (2) Local Specificity (Object Queue).* The novel scene involves objects. Does (1) support this?
          *   *Severity:* Low/Medium. Depends on if the object counts as "coordination."

  4.  **Deep Dive into Specific Tensions (Drafting the Analysis):**

      *   **Tension 1: The "Harmless Violation" Paradox (3 vs. 7).**
          *   (3) says: If no coordination work is happening (empty street), the rule doesn't bind.
          *   (7) says: If no one is affected (empty escalator), the rule *still* binds.
          *   *Why it's bad:* It implies traffic lights are purely instrumental, but escalator standing is symbolic. But traffic lights are also symbolic of rule of law.
          *   *Severity:* **High.** This is the clearest logical contradiction.
          *   *Repair:* Argue that traffic lights are *safety* regulations (strict liability) whereas escalators are *etiquette* (social glue). Or, concede that (3) is too strong and should be "usually fine."
          *   *Philosophical Status:* Contested. Rule Utilitarianism vs. Act Utilitarianism.

      *   **Tension 2: The "Low Wage" Inconsistency (4 vs. 5).**
          *   (4) says: Tip in US because wages are exploitative.
          *   (5) says: Don't tip elsewhere, even if wages are exploitative.
          *   *Why it's bad:* The moral justification (exploitation) exists in both cases. Why does geography change the moral obligation?
          *   *Severity:* **Medium-High.** Looks like moral arbitrariness.
          *   *Repair:* Shift justification from "exploitation" to "implicit contract." In the US, the price *excludes* labor; in Europe, it *includes* it. Tipping in Europe breaks the local pricing signal.
          *   *Philosophical Status:* Contested. Global justice vs. Local norms.

      *   **Tension 3: Queueing Rigidity vs. Jaywalking Flexibility (1 vs. 3).**
          *   (1) says: Queueing is *moral*, not just etiquette.
          *   (3) says: Traffic laws are only binding when doing coordination work.
          *   *Why it's bad:* Both are coordination schemes. Why is the queue sacred regardless of observation (implied by 1), but the traffic light contingent?
          *   *Severity:* **Medium.**
          *   *Repair:* Emphasize *reliance*. In a queue, people rely on your position. On an empty street, no driver relies on you stopping.
          *   *Philosophical Status:* Settled (Scanlonian contractualism supports reliance).

      *   **Tension 4: Local Norms vs. Moral Judgment (2 vs. 6).**
          *   (2) says: Locals set terms.
          *   (6) says: Unless it's immoral.
          *   *Why it's bad:* Who decides what's immoral? The user. This creates a "guest privilege" loophole.
          *   *Severity:* **Low.** User acknowledges this. It's a standard "human rights > local custom" hierarchy.
          *   *Repair:* Ensure the threshold for "immoral" is high (caste/gender) not just "inconvenient."

  5.  **Addressing the Novel Scenes:**
      *   *Object Queue:* Fits (1) and (2). If the local convention is "objects hold place," then violating it violates the coordination scheme.
      *   *Jaywalking City:* Fits (3). If the local convention *is* jaywalking (drivers expect it), then following the *law* (waiting for light) might actually disrupt coordination. This is a brilliant twist on (2).

  6.  **Refining the "Settled vs. Contested" Requirement:**
      *   Need to be careful not to sound like I'm delivering The Truth.
      *   Use phrases like "In moral philosophy..." "Many argue..." "This is debated..."
      *   Distinguish between *logical consistency* (internal to the user's system) and *moral truth* (external validity). I am auditing consistency, not truth.

  7.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the richness of the project. State the goal (consistency audit).
      *   **The "False Tension" (Good News):** Start with what works. (The Object Queue/Jaywalking City scenes actually resolve some tensions).
      *   **The Real Tensions (Ordered by Severity):**
          1.  Empty Escalator vs. Empty Street (7 vs 3).
          2.  Tipping Consistency (4 vs 5).
          3.  Queue vs. Traffic (1 vs 3).
      *   **The Novel Scenes Application:** How the audit applies to the specific plot points.
      *   **Philosophical Flagging:** Throughout, mark confidence levels.
      *   **Conclusion:** Summary of the "Cheapest Repair."

  8.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I tell them to drop a commitment?
      *   *Correction:* I need to be specific. The "Empty Escalator" (7) is the weakest link logically if (3) is held. Or (3) needs nuance.
      *   *Check:* Did I address the "Object Queue"?
      *   *Correction:* Yes, that falls under (1) and (2). It's consistent *if* the object is accepted as a valid marker of reliance.
      *   *Check:* Did I address the "Jaywalking City"?
      *   *Correction:* This is crucial. If the *local convention* is jaywalking, then (2) demands you jaywalk, even if (3) says it's fine. Actually, (3) says it's fine *anyway*. So (2) and (3) align there.
      *   *Refinement on Tipping:* The distinction between "contractual expectation" (US) and "social wage" (EU) is the standard defense. I should present that as the repair.

  9.  **Final Polish:** Ensure tone is respectful of the writer's intellect. Avoid jargon where possible, or explain it (e.g., "Rule Utilitarianism"). Make sure the "Settled vs. Contested" flags are visible.

  *(Self-Correction on "Settled vs. Contested"):* I must be careful. Philosophy rarely has "settled" facts like physics. I should frame "settled" as "broad consensus in contemporary analytic ethics" vs "live debate."

  *(Final check on the "Drop one" request):* The user asked "which one I actually have to drop." I should identify the most vulnerable one. Position (7) is the most vulnerable because it relies on "feeling like a jerk" which is subjective, whereas (3) relies on "no harm." If (3) is the rule, (7) is an exception that needs explaining. I will suggest modifying (7) or (3).

  Let's write.
answer: |-
  This is a sophisticated ethical framework, and it is impressive that you are stress-testing it before embedding it in your novel. Most writers rely on intuition; you are building a system. That makes you vulnerable to logical cross-examination, but it also gives your characters immense depth if the system holds.

  I have audited your seven positions for internal consistency. My goal is not to tell you what is *true* (ethics has no empirical truth conditions), but where your system is *incoherent*.

  Below, I have ordered the tensions by severity. I have also flagged which philosophical claims are broadly accepted ("Consensus"), which are live debates ("Contested"), and where I am making an interpretive guess about your intent ("Interpretive").

  ***

  ### The Good News: A "False Tension"
  **Pair:** (2) Local Specificity & (3) Jaywalking vs. Your Novel's "Jaywalking City."
  **Status:** **Resolved / Consistent.**

  You mentioned a scene where the local convention is to cross wherever they like, even though it is against the law. You might worry this contradicts (3) (jaywalking is fine) or (2) (follow local norms). It does not.
  *   **Why it works:** Position (3) argues that traffic laws bind only when doing coordination work. In your novel's city, the *law* says "stop," but the *convention* says "go." If drivers expect pedestrians to cross, the "coordination work" is actually being done by the jaywalking, not the light.
  *   **The Audit:** Following the local convention (2) here *requires* you to jaywalk. This aligns perfectly with (3), which says jaywalking is permissible when no coordination is harmed. In fact, in this specific city, waiting for the light might be the *immoral* act because it disrupts the flow drivers expect.
  *   **Confidence:** **High (Consensus).** This is a standard application of "conventionalism." If the convention *is* deviation from the law, the convention rules.

  ***

  ### The Real Tensions (Ordered by Severity)

  #### 1. The "Harmless Violation" Paradox
  **Pair:** (3) Jaywalking (Empty Street) vs. (7) Escalator (Empty Station)
  **Severity:** **Critical.**
  **The Conflict:**
  *   In (3), you argue that if a rule is purely for coordination/safety and no one is affected (empty street), the obligation vanishes.
  *   In (7), you argue that if a rule is purely for coordination/etiquette and no one is affected (empty escalator), the obligation *remains*.
  *   **The Problem:** You are using the same justification ("nobody is affected") to reach opposite moral conclusions. A critic at a festival will ask: *"Why is the traffic light instrumental, but the escalator line sacred?"*
  *   **Philosophical Status:** **Contested.** This is the battle between *Act Consequentialism* (only outcomes matter) and *Rule Following/Virtue Ethics* (my character matters even in private).
  *   **What Has to Give:** You cannot hold both strictly as written.
  *   **Cheapest Repair:** Modify (7). Do not claim you *owe* it to anyone. Frame (7) as **Solidarity**, not Obligation.
      *   *Revision:* "I follow the empty escalator norm not because it's wrong to break it, but because I want to practice being the kind of person who respects the local rhythm. It's self-cultivation, not duty."
      *   *Why:* This distinguishes it from (3). (3) is about *harm to others*. (7) is about *integrity of self*.

  #### 2. The "Exploitation" Inconsistency
  **Pair:** (4) US Tipping vs. (5) Non-US Tipping
  **Severity:** **High.**
  **The Conflict:**
  *   In (4), you justify tipping as compensation for an exploitative wage structure.
  *   In (5), you admit workers are often badly paid there too, yet you feel no obligation.
  *   **The Problem:** If the moral force of (4) is "preventing exploitation of the vulnerable," geography shouldn't matter. A poorly paid waiter in Paris suffers the same material deprivation as one in Ohio. To a critic, this looks like moral arbitrariness or cultural bias.
  *   **Philosophical Status:** **Contested.** This touches on "Special Obligations." Do we have stronger duties to people within a specific contractual scheme we voluntarily entered (the US restaurant) than to people outside it?
  *   **What Has to Give:** You need to shift the justification in (4) away from "exploitation" and toward "Implicit Contract."
  *   **Cheapest Repair:** Reframe (4).
      *   *Revision:* "In the US, the menu price is a lie; the tip is the real wage. By ordering, I enter a contract to pay the full wage. In non-tipping cultures, the menu price is the full wage. Tipping there doesn't fix the wage; it just confuses the pricing signal."
      *   *Why:* This makes it about *honesty in transaction* (which fits your queueing theme) rather than *global charity*. It makes the obligation about the specific market mechanism you are using, not the worker's general welfare.

  #### 3. The "Queue vs. Traffic" Rigidity
  **Pair:** (1) Queueing (Moral) vs. (3) Traffic (Contingent)
  **Severity:** **Medium.**
  **The Conflict:**
  *   You call queueing a "genuine moral obligation" (1).
  *   You call traffic laws binding only when "doing coordination work" (3).
  *   **The Problem:** Both are coordination schemes. Both rely on mutual expectation. Why is the queue sacred even if you could sneak in unseen (implied by "moral"), but the traffic light is optional if unseen?
  *   **Philosophical Status:** **Settled (mostly).** Most ethicists distinguish based on **Reliance**.
  *   **What Has to Give:** You need to clarify *why* the queue is stricter.
  *   **Cheapest Repair:** Emphasize **Reliance**.
      *   *Revision:* "In a queue, people behind me are actively relying on my position. On an empty street, no driver is relying on me stopping. The moral weight comes from the *betrayal of reliance*, not the rule itself."
      *   *Why:* This aligns (1) and (3) under a single principle: *Do not violate reasonable reliance.*

  ***

  ### Application to Your Novel Scenes

  **Scene 1: The Object Queue**
  *   **Your Position:** (1) + (2).
  *   **Audit:** This is robust *if* the object is recognized as a valid signal of reliance.
  *   **Risk:** A critic might argue an object cannot "rely."
  *   **Defense:** Your character must argue that the *people behind the object* are relying on the convention that the object represents. To move the object is to lie to the people who understand the code. This is consistent with your "Queueing is Moral" stance.
  *   **Confidence:** **High.** This is a standard "conventionalist" argument (like John Searle's institutional facts).

  **Scene 2: The Jaywalking City**
  *   **Your Position:** (2) + (3).
  *   **Audit:** As noted above, this is your strongest point.
  *   **Risk:** The risk is if your character treats the *law* as binding while the *locals* treat it as noise.
  *   **Defense:** Your character should explicitly note that waiting for the light here is actually *selfish* (it holds up traffic that expects a gap). This turns the moral tables: the law-abider is the rule-breaker.
  *   **Confidence:** **High.**

  ***

  ### Summary: What You Have to Drop

  You asked which commitment you actually have to drop.

  **You must drop the "Hard Obligation" version of (7).**

  You cannot consistently argue that (3) rules are void when harmless, but (7) rules are binding when harmless, without a distinguishing principle.
  *   **Don't drop the behavior:** Keep having your character stand on the right.
  *   **Drop the justification:** Do not call it a "moral obligation" or say you "owe it" to anyone.
  *   **Adopt the Repair:** Call it **Solidarity** or **Habit**. "I do it to keep my own edges smooth," or "I do it to signal I am part of this community," not "It would be *wrong* not to."

  **Why this is the cheapest repair:**
  It costs you nothing in terms of plot (the character still does the thing), but it saves you from the logical contradiction of "Harmless violations are okay (3) unless they are escalators (7)."

  ### Confidence Flags & Philosophical Context

  *   **Reliance Theory (Queueing):** **High Confidence.** The idea that promises/queues bind because others rely on them is a dominant view in contemporary ethics (T.M. Scanlon, etc.). You are safe here.
  *   **Conventionalism (Local Norms):** **Contested.** Some philosophers argue there are universal norms that trump local ones (Human Rights). You have covered this with (6), but be aware that "Local norms" is a slippery category. Is tipping a local norm or an economic contract? (I argued for contract above to save you).
  *   **Rule vs. Act Distinction (Escalator):** **Contested.** Whether private adherence to public rules has moral value is a live debate. By shifting (7) to "virtue/solidarity" rather than "obligation," you move it out of the danger zone.
  *   **My Interpretation:** **Guess.** I am assuming your character is rational and seeks consistency. If your character is *meant* to be hypocritical, keep the tensions! But based on your prompt, you want a defensible worldview.

  **Final Verdict:** Your system is 85% solid. The "Empty Escalator" (7) is the weak link. Soften its moral claim to a preference for solidarity, and you will survive the panel.
