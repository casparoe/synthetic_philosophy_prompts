      Imagine a fleet of models initialized identically (common prior) trained to minimize log loss on the same distribution. If every model knows every other model's current calibrated output (common knowledge), and all are perfectly optimized (rational), their outputs must converge. Any divergence implies one model has access to features (private data) the others lack. Consequently, no model should bet against the consensus unless it possesses exclusive features. The market price is the optimal ensemble of all distributed features; trading volume implies either private features exist or some models are miscalibrated (irrational).

