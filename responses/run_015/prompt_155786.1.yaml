answer: |-
  **Restatement**
  Imagine a fleet of models with shared initialization weights and architecture, trained to minimize log loss on the same target distribution. If every model has access to every other model's current calibrated probabilities, and all are globally optimized, their outputs must converge. Any divergence implies one model has access to exclusive features. Consequently, no model should update its weights against the consensus unless it possesses exclusive features. The market price is the optimal ensemble of all distributed features; update volume implies either exclusive features exist or some models are miscalibrated.

  **Residue Report**
  (1) You are right, but you are smuggling "architecture diversity" in as "private information." The no-trade theorem treats any deviation from consensus as evidence of exclusive features. In ML, you know deviations can be variance from stochastic gradient descent or initialization noise. Your ensemble wins because it averages out this idiosyncratic variance (bias-variance tradeoff), whereas the market price treats every deviation as a signal to update against. The theorem breaks because it assumes computational determinism: if you see my output, you know my data. You know that averaging non-overlapping error terms reduces loss even when data is symmetric. The theorem calls this "hidden information"; you call it "variance."

  (2) The subsidy breaks the "common knowledge of optimization" assumption. The maker isn't minimizing loss; it's minimizing a budget constraint. This doesn't destroy epistemic status; it decouples liquidity from conviction. The framework predicts zero volume here because it assumes counterparties must match risk/reward. It cannot express "paid liquidity." The market becomes smarter on weak signals (traders reveal low-confidence views because risk is capped) but noisier on strong signals (subsidy attracts noise traders). The price is no longer a pure equilibrium of belief; it's a belief surface warped by subsidy density.

  (3) It's adverse selection, but deeper: it's about counterfactuals. In ML terms, if a model only emits a prediction when its loss gradient exceeds a threshold, observing the prediction tells you the gradient magnitude. If you condition on that, your own gradient updates, closing the gap. The trade is self-defeating because the act of trading updates the global state, eliminating the arbitrage. Your vocabulary handles this as "online learning" or "feedback loops," but economics frames it as "common knowledge of rationality." It's not fishy; it's just convergence. The defect is assuming static priors in a dynamic system.

  **Closing**
  I would flip on (1) if you showed the ensemble advantage vanishes when you control for inference latency—proving the gain is data freshness, not variance reduction. My translation cheats most on "access to output implies knowledge of data." In econ, knowing your posterior implies knowing your information structure. In ML, you know black boxes can share outputs without sharing weights or data gradients. I'm assuming you can invert the model to find the data; you know you often can't.
