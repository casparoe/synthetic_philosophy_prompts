  If my framing rests on a confused premise—for instance, if the distinction between logical and institutional self-reference renders the question incoherent, or if the scenario is too underspecified to support a determinate answer—please state that plainly instead of forcing a decomposition.

  Return the answer as a JSON object with exactly these fields: final_credence (float between 0 and 1), decomposition (array of objects, each with keys factor_name, probability, justification), least_confident_factor (string), shift_evidence (string), and premise_check (string noting any confusion or confirming coherence).
