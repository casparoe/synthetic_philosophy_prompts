  # Joint Statement on Consequentialist Cluelessness and Normative Authority

  **Prepared for:** Graduate Seminar on Long-Run Normative Ethics and Decision Theory
  **Parties:** Bounded-Consequentialist Camp (Camp A) and Structural-Skeptic Camp (Camp B)
  **Date:** [Current Date]

  ## A. Agreed Claims

  The undersigned parties affirm the following claims as a shared foundation for further dialectical engagement. These claims delineate the common ground regarding the formal structure of consequentialism, the limits of agency, and the nature of uncertainty.

  1.  **Consequentialist Metric:** Both camps accept that the fundamental normative criterion for right action is the maximization of expected moral value, defined as the sum of weighted outcomes across all affected moral patients.
  2.  **Epistemic Limitation:** Both camps agree that human agents lack access to complete causal models of the distant future, specifically regarding nonlinear tipping points, technological discontinuities, and value drift over centuries or millennia.
  3.  **Risk vs. Deep Uncertainty:** Both camps endorse the distinction between *risk* (contexts where outcome probabilities are known or estimable via frequency data) and *deep uncertainty* (contexts where probabilities are unknown, models are contested, or the outcome space itself is unrepresentable).
  4.  **Moral Patienthood:** Both camps affirm that moral patienthood is not restricted to presently existing beings; future persons and potential sentient entities possess moral status that must be included in the evaluation of outcomes.
  5.  **Non-Omniscience Requirement:** Both camps agree that a normative theory must be action-guiding for bounded agents; neither camp requires omniscience for an ethical framework to be valid, though they disagree on the minimum epistemic threshold required for prescription.
  6.  **Catastrophe Avoidance:** Both camps agree that, ceteris paribus, decision procedures should prioritize the avoidance of outcomes involving irreversible existential loss or extreme suffering over the pursuit of marginal gains in expected value.

  ## B. Disagreements Table

  | Crux ID | Issue in Neutral Wording | Formulation that Camp A (Bounded-Consequentialist) Accepts | Formulation that Camp B (Structural-Skeptic) Accepts | Verdict |
  | :--- | :--- | :--- | :--- | :--- |
  | **C1** | The normative authority of Expected Value (EV) under deep uncertainty. | EV reasoning retains normative authority under deep uncertainty when supplemented by robustness checks, epistemic discounting, and option value analysis. | EV reasoning loses normative authority under deep uncertainty because the structural incommensurability of outcomes prevents the construction of a valid weighting function. | Substantive |
  | **C2** | The ontological status of the barrier to comparison. | The barrier to comparing long-run outcomes is primarily epistemic; better models or data could theoretically resolve the uncertainty. | The barrier to comparing long-run outcomes is primarily structural/ontological; no amount of data can resolve the lack of a common metric across distinct causal domains. | Substantive |
  | **C3** | The definition of "Cluelessness." | Cluelessness refers to a state of high variance or low confidence in the estimated expected value of an action. | Cluelessness refers to a state where the expected value is undefined because the outcomes belong to incompatible ontological categories. | Verbal |

  ## C. Crux Tests for Substantive Disagreements

  ### Test for Crux C1 (Normative Authority of EV)

  *   **Sub-Question:** Does a decision procedure that maximizes robust satisficing criteria constitute a valid proxy for maximizing expected moral value when probability distributions are unknown?
  *   **Hypothetical Case:** *The Governance Intervention.* An agent must allocate a fixed resource budget. Option 1 yields a certain, measurable improvement in welfare for 10,000 present individuals. Option 2 involves reforming a global governance institution; models suggest this could either prevent a catastrophic collapse in 200 years (affecting billions) or inadvertently accelerate instability leading to earlier collapse. The probability distribution of Option 2's outcomes is unknown (deep uncertainty), and the magnitude of the stake is orders higher than Option 1.
  *   **Camp A Prediction:** This case demonstrates that Option 2 can be rationally chosen if it possesses high "option value" (preserving future flexibility) or satisfies robustness criteria (performing acceptably across multiple plausible models), thereby preserving EV normative authority.
  *   **Camp B Prediction:** This case demonstrates that Option 2 cannot be rationally compared to Option 1 because the utility scales (present welfare vs. existential trajectory) are structurally incommensurable; thus, EV maximization provides no prescription, and the choice is rationally underdetermined.

  ### Test for Crux C2 (Ontological Status of the Barrier)

  *   **Sub-Question:** Is the inability to weigh changes in population size against changes in average welfare quality a failure of data or a failure of the value framework?
  *   **Hypothetical Case:** *The Demographic Trajectory.* An agent chooses between Policy X and Policy Y. Policy X leads to a future population of 1 billion beings with very high welfare. Policy Y leads to a future population of 100 billion beings with moderate welfare. The causal chains are known, but the moral weighting function between "number of lives" and "quality of life" across these vastly different scales is contested and lacks a non-arbitrary grounding.
  *   **Camp A Prediction:** This case demonstrates an epistemic gap; we can construct a range of plausible weighting functions (e.g., total vs. average utilitarianism) and perform sensitivity analysis to find a robust choice, implying the barrier is remediable via better normative modeling.
  *   **Camp B Prediction:** This case demonstrates a structural gap; because "number of beings" and "quality of life" operate on different ontological scales in this context, no single weighting function exists to be discovered, implying the barrier is inherent to the evaluative framework.

  ## D. Diagnosis of Verbal Disagreement

  The parties identify **Crux C3** ("The definition of 'Cluelessness'") as a primarily verbal disagreement.

  *   **Divergent Terms:** Camp A uses "cluelessness" to denote *epistemic confidence intervals* (i.e., we know what matters but are unsure of the probabilities). Camp B uses "cluelessness" to denote *conceptual incommensurability* (i.e., we lack a coherent framework to compare the values at all).
  *   **Resolution Impact:** Resolving this terminological divergence clarifies the dialectic but does not eliminate the conflict.
  *   **Residual Substantive Dispute:** Even if both parties agree to distinguish "Epistemic Uncertainty" (Camp A's focus) from "Structural Incommensurability" (Camp B's focus), a substantive dispute remains regarding whether Structural Incommensurability actually obtains in real-world decision contexts. Camp A maintains that apparent incommensurability is always reducible to epistemic uncertainty via sufficiently rich modeling. Camp B maintains that some value conflicts are fundamentally irreducible. Thus, the verbal dispute masks the deeper substantive disagreement identified in Crux C2.

