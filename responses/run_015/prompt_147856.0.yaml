  # Joint Statement on Inside-View Reasoning and Outside-View Epistemic Modesty

  **Parties:** Camp One (Inside-View Mechanists) and Camp Two (Outside-View Modestists)
  **Date:** October 26, 2023
  **Subject:** Structural and Normative Disagreements regarding Forecasting Methodologies

  ## Part I: Agreed Claims

  Both camps affirm the following propositions as conceptually coherent and structurally necessary for this dialogue. These claims establish the shared logical space within which the disagreement operates, without resolving the conflict.

  1.  **Formal Decomposability:** Any quantitative or qualitative forecast can be formally decomposed into a *mechanistic component* (derived from a specific causal model of the target system) and a *reference-class component* (derived from the statistical frequency of outcomes in a set of comparable cases). Disagreement exists regarding the weighting of these components, not their distinct existence.
  2.  **Empirical Regularity of Overconfidence:** In domains characterized by long time horizons, complex variables, and delayed feedback, uncalibrated human forecasters exhibit a robust empirical tendency toward overconfidence. Both camps accept this as a baseline prior regarding unaided human cognition.
  3.  **Bayesian Consistency:** It is logically consistent within a Bayesian framework to update a prior belief upon learning one's membership in a specific reference class. Both camps agree that ignoring base-rate information entirely is formally indefensible, though they disagree on the magnitude of the update required.
  4.  **Existence of Scarcity Domains:** There exist domains of inquiry where direct historical analogues are genuinely scarce or non-existent due to structural novelty. Both camps agree that in such domains, the reference-class component must rely on either broad abstraction or be assigned high variance.
  5.  **Recursive Coherence:** It is conceptually coherent to ask whether the principle of epistemic modesty applies to itself. Both camps agree that a normative epistemological framework must account for the status of its own claims (i.e., whether the claim "one should be modest" is itself a modest claim).

  ***

  ## Part II: Disagreements Table

  | Issue | Inside-View Mechanist Formulation | Outside-View Modestist Formulation | Status & Crux |
  | :--- | :--- | :--- | :--- |
  | **1. Circularity of Self-Calibration** | A reasoner can apply calibration adjustments to their own argument without circularity, provided the adjustment protocol is explicit, rule-based, and justified by local causal mechanisms regarding their own cognitive limitations. | A reasoner cannot reliably apply calibration adjustments to their own argument without circularity, because the assessment of one's own calibration is itself an inside-view judgment subject to the same overconfidence biases it aims to correct. | **Substantive**<br><br>**Crux:** Can a cognitive system reliably measure its own error rate using its own reasoning tools without an external, independent anchor (e.g., a track record distinct from the current argument)? |
  | **2. Scarcity vs. Broadening** | The scarcity of direct historical analogues in a novel domain undermines the validity of reference-class forecasting; relying on a broadened class introduces noise that outweighs the signal, justifying dominance of the mechanistic model. | The scarcity of direct historical analogues does not undermine reference-class forecasting; it merely necessitates a shift to a broader, more abstract reference class (e.g., "novel predictions by experts" rather than "predictions about X") to maintain statistical validity. | **Partly Verbal / Substantive**<br><br>**Verbal Component:** Definition of "appropriate reference class."<br>**Substantive Crux:** At what point does a broadened reference class become so heterogeneous that its base rate ceases to be probabilistically informative for the specific case? |
  | **3. Recursive Modesty Normativity** | Epistemic modesty is a heuristic tool to be applied when evidence suggests bias; it does not demand recursive downgrading of its own application unless specific evidence of bias in the modesty principle itself is found. | Epistemic modesty is a universal normative constraint; if it demands downgrading inside-view confidence, it must also demand downgrading the confidence in the modesty principle itself, potentially leading to a regress or a fixed-point equilibrium. | **Substantive**<br><br>**Crux:** Does the principle of modesty defeat itself if applied universally, or does it converge on a stable epistemic equilibrium that permits first-person reasoning under specific constraints? |

  ***

  ## Part III: Cruxes and Predictive Tests

  For each substantive crux identified in Part II, the following scenarios and tests are proposed. Both camps agree these structures bear on the resolution of the disagreement.

  ### Test 1: The Circularity of Self-Calibration
  **Crux Addressed:** Can a cognitive system reliably measure its own error rate without an external anchor?

  *   **Designed Scenario:** A researcher constructs a novel causal model predicting a specific geopolitical outcome in a domain with no direct precedents. Simultaneously, the researcher possesses data regarding the historical failure rate of similarly novel models constructed by peers in a broad reference class (e.g., 90% failure rate). The researcher applies a "self-calibration protocol" where they explicitly reduce their confidence by 50% based on an inside-view assessment of their model's robustness compared to peers.
  *   **Camp Assessments:**
      *   **Mechanists:** Predict the researcher's calibrated forecast will outperform the raw base-rate forecast (90% failure) because the self-calibration successfully isolates the unique strength of the current mechanism.
      *   **Modestists:** Predict the researcher's calibrated forecast will perform no better than the raw base-rate forecast, because the "50% reduction" is an arbitrary inside-view number contaminated by the very overconfidence it seeks to correct.
  *   **Updating Condition:** Both sides agree that if a blind trial demonstrates the researcher's calibrated intervals match observed frequencies over multiple iterations *without* external correction, the Mechanist position is strengthened.
  *   **Meta-Prediction:**
      *   **Mechanists predict:** Modestists will dismiss positive results as statistical noise or "survivorship bias" unless the sample size is impractically large.
      *   **Modestists predict:** Mechanists will interpret negative results as evidence that the specific calibration protocol was flawed, not that self-calibration is impossible.

  ### Test 2: The Heterogeneity Threshold
  **Crux Addressed:** At what point does a broadened reference class become too heterogeneous to be informative?

  *   **Designed Scenario:** Consider a domain of "structural novelty" (e.g., the first deployment of a specific class of autonomous AI). Camp Two proposes a reference class of "all major technological deployments." Camp One proposes a reference class of "deployments of this specific architecture." A dataset is generated showing the failure rates of both classes.
  *   **Camp Assessments:**
      *   **Mechanists:** Predict the narrow class ("specific architecture") will show higher variance but higher predictive accuracy for this specific case, because the broad class includes irrelevant dissimilarities that dilute the signal.
      *   **Modestists:** Predict the broad class ("all major technological deployments") will yield better calibration, because the narrow class contains too few data points to support a stable frequency estimate, rendering its base rate statistically unstable.
  *   **Updating Condition:** Both sides agree that evidence showing the narrow class consistently yields better Brier scores than the broad class in high-novelty domains would force Modestists to narrow their classes. Conversely, evidence showing narrow classes are systematically overconfident compared to broad classes would force Mechanists to broaden theirs.
  *   **Meta-Prediction:**
      *   **Mechanists predict:** Modestists will argue that any success of the narrow class is due to "hidden broad features" shared by the narrow set, refusing to concede the principle of narrowing.
      *   **Modestists predict:** Mechanists will argue that any failure of the narrow class is due to "insufficient data" rather than heterogeneity, refusing to concede the principle of broadening.

  ### Test 3: The Modesty Equilibrium
  **Crux Addressed:** Does the principle of modesty defeat itself or converge on a stable equilibrium?

  *   **Designed Scenario:** An agent adopts a rule: "Downgrade all first-person confidence by factor *X*." The agent then applies this rule to the confidence they have in the rule itself. If the rule is true, confidence in the rule should also be downgraded, potentially weakening the justification for applying the rule.
  *   **Camp Assessments:**
      *   **Mechanists:** Predict that recursive application leads to an epistemic collapse (infinite regress) or paralysis. They argue the rule must be treated as a "fixed point" exempt from downgrading to function, which contradicts the universal claim of modesty.
      *   **Modestists:** Predict that recursive application converges on a stable fixed point where the agent is modest about their modesty, resulting in a finite, non-zero confidence level that permits action without claiming infallibility.
  *   **Updating Condition:** Both sides agree that a formal proof demonstrating whether the recursive function converges (Modestist view) or diverges/collapses (Mechanist view) would resolve the logical coherence of the normative claim.
  *   **Meta-Prediction:**
      *   **Mechanists predict:** Modestists will redefine "modesty" upon encountering divergence to avoid the collapse, effectively admitting that modesty cannot be universal.
      *   **Modestists predict:** Mechanists will conflate "paralysis" with "low confidence," failing to see that one can act on low-confidence probabilities without logical contradiction.
