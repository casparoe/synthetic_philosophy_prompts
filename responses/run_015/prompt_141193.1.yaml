prompt: |-
  I price risk for a small mutual that insures self-build and off-grid houses — about 400 policies, so half the classes I could pick are three claims and a hunch. Every house belongs to dozens of classes that all point at different numbers, and I keep catching myself choosing the one that gives the answer I want: either so broad it's meaningless or so narrow it's me and two sheds. I want a written procedure I can run on each new quote: how to choose the class, how far to narrow it before the data stops supporting it, what to do when two perfectly reasonable classes disagree wildly, when to say I definately can't produce a defensible number at all, and what to write down so a lay complaints panel can see I wasn't just picking a class to suit myself. Constraints: roughly twenty minuets per quote, the classes have to be pre-registered with the board each year so I can't invent them ad hoc, and the board has banned any class defined partly by postcode. Then run it on three: a straw-bale house, a house with a subsidence claim from the previous owner, and one where the only class with enough data in it is ruled out by the ban. Take a definite line on each rather than listing my options, and be straight about where the "procedure" is really just my judgement in a nice suit.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and application:

  1.  **Analyze the Request:**
      *   **User Role:** Pricer/Underwriter for a small mutual insurer (approx. 400 policies).
      *   **Niche:** Self-build and off-grid houses.
      *   **Problem:** Data sparsity (some classes have only 3 claims + a hunch), classification ambiguity (houses fit dozens of classes), selection bias (choosing classes to get desired answers), and governance constraints (pre-registered classes, no postcode-based classes, 20 mins per quote, lay complaints panel audit).
      *   **Deliverables:**
          1.  A written procedure (algorithm/heuristic) for class selection and pricing.
          2.  Application of this procedure to three specific scenarios (Straw-bale, Previous Subsidence, Postcode-banned class).
          3.  Tone: Direct, honest about where judgement overrides math ("judgement in a nice suit"), definitive lines (no "options").
      *   **Constraints:** 20 minutes per quote, pre-registered classes only, no postcode variables, audit-ready documentation.

  2.  **Deconstruct the Core Problem:**
      *   *Credibility:* With 400 policies, almost *nothing* has statistical credibility in the actuarial sense. Relying on "3 claims and a hunch" is the reality.
      *   *Bias:* The user admits to "cherry-picking" classes to match a desired price. This is the biggest risk for the complaints panel.
      *   *Governance:* The board restricts flexibility (no ad-hoc classes, no postcodes).
      *   *Time:* 20 minutes is tight for deep analysis, so the procedure must be a checklist, not a modeling exercise.

  3.  **Drafting the Procedure (The "Nice Suit"):**
      *   *Goal:* Create a defensible process that limits bias without pretending to have data that doesn't exist.
      *   *Step 1: Hierarchy of Classes.* Need a rule to pick between broad and narrow. *Idea:* Start broad, narrow only if credibility threshold is met. But with 400 policies, credibility is never met. *Correction:* Start with the "Base Class" (most general applicable) and only apply "Modifiers" (specific risk factors) if they are explicitly allowed and have *any* historical backing, even anecdotal.
      *   *Step 2: The "Three-Point" Rule.* If a class has fewer than X exposures, it's statistically void. Let's set a hard floor. If <10 exposures, merge up.
      *   *Step 3: Conflict Resolution.* When Class A says £500 and Class B says £5000. *Rule:* Use the weighted average? No, too much math for 20 mins. *Rule:* Use the higher estimate for risk, but cap at a commercial limit? Better: Use the "Base Class" rate and apply a fixed loading for the specific risk factor, rather than switching classes entirely. This keeps the baseline stable.
      *   *Step 4: The "Walk Away" Threshold.* When is it undefendable? When the risk is outside the mutual's risk appetite or the class definition is stretched so far it breaks the board's rules.
      *   *Step 5: Documentation.* What does the panel need to see? They need to see *why* you didn't pick the cheaper class. The "Audit Note" needs to be standardized.

      *Refining the Procedure for Honesty:* I need to admit that with 400 policies, "statistical significance" is a lie. The procedure must rely on *consistency* rather than *accuracy*. The "Nice Suit" is the consistent application of a heuristic, not the math itself.

  4.  **Developing the Three Scenarios:**

      *   *Scenario 1: Straw-bale house.*
          *   Issue: Niche construction. Likely very few data points.
          *   Constraint: Pre-registered classes. Is there a "Non-Standard Construction" class?
          *   Decision: Don't create a "Straw-bale" class. Use "Non-Standard Construction" + a fixed loading.
          *   Honesty: Admit the loading is judgement, not math.

      *   *Scenario 2: House with previous subsidence claim.*
          *   Issue: Past claim != future risk, but indicates soil/structural issues.
          *   Conflict: "General Residential" vs. "Subsidence History" class (if it exists).
          *   Decision: If the "Subsidence History" class has <10 lives, ignore it. Price on General Residential + Excess Loading.
          *   Honesty: Acknowledge we are pricing for uncertainty, not frequency.

      *   *Scenario 3: The Postcode Ban.*
          *   Issue: The only credible class is geographic (e.g., "Flood Zone A"), but postcodes/locations are banned.
          *   Constraint: Board ban.
          *   Decision: Must use the next best *physical* characteristic class (e.g., "River Proximity" or "Drainage Type") or default to Base.
          *   Honesty: This is where the procedure breaks. I must declare the price "Indicative Only" or apply a blanket contingency loading. Let's go with applying a "Geographic Uncertainty Loading" within a permitted class.

  5.  **Refining the Tone:**
      *   Avoid actuarial jargon that implies precision (e.g., "confidence intervals").
      *   Use plain English suitable for a lay panel.
      *   Be blunt about the "hunch" factor.
      *   Ensure the 20-minute limit is respected (checklist style).

  6.  **Drafting the Content (Iterative refinement):**
      *   *Procedure Name:* "The 20-Minute Consistency Protocol."
      *   *Step 1 (The Anchor):* Always start with the broadest applicable class.
      *   *Step 2 (The Narrowing Test):* Can only narrow if >10 exposures exist. (With 400 total, this might be too hard. Let's lower to 5 exposures or 3 years of data). Let's say: "Minimum 5 active policies in that class."
      *   *Step 3 (The Conflict Rule):* If two classes differ by >50%, default to the broader class and apply a specific risk loading.
      *   *Step 4 (The Walk Away):* If the risk requires a class that doesn't exist or is banned, decline or price at "Maximum Caution" rate.
      *   *Documentation:* The "Reasoning Box."

      *Self-Correction on Data:* 400 policies total. If there are dozens of classes, most classes have <10 policies. The "Minimum 5" rule might force everything into one giant bucket. That might actually be the point. The "Procedure" should force the user to admit data is too thin to segment.
      *Revised Strategy:* The procedure should prioritize *stability* over *segmentation*. If data is thin, don't segment.

      *Revised Procedure:*
      1.  Identify the "Base Class" (broadest fit).
      2.  Check "Specific Class" (narrow fit).
      3.  Credibility Check: Does Specific Class have >5 policies? If no, use Base.
      4.  Loading: If Specific Class is rejected due to data, apply a fixed % loading to Base instead of switching classes.
      5.  Audit Trail: Write down the "Rejected Class" and the "Reason (Data < 5)".

  7.  **Finalizing the Three Cases:**
      *   *Straw-bale:* No specific class has >5 policies. Use "Non-Standard Wall" Base Class. Apply 20% loading. Reason: Data too thin to segment further.
      *   *Subsidence:* "Previous Claim" class has <5 policies. Use "Standard Build" Base. Apply excess/loading. Reason: Past claim is individual risk, not class risk.
      *   *Postcode Ban:* The "Flood Class" is banned (defined by location). Use "Drainage/System" class. If none, use Base + Contingency Loading. Reason: Regulatory constraint prevents geographic pricing.

  8.  **Review against Constraints:**
      *   20 mins? Yes, checklist is fast.
      *   Pre-registered? Yes, works within existing list.
      *   No Postcode? Yes, explicitly handled.
      *   Lay Panel? Yes, language is simple.
      *   Honest about judgement? Yes, explicitly states where loadings are arbitrary.

  9.  **Final Polish:** Ensure the voice is professional but weary/realistic. "Judgement in a nice suit."

  *(Self-Correction during drafting)*: Make sure I don't sound *too* dismissive of the data. The mutual still needs to survive. The key is defensibility, not perfection. The "Walk Away" criteria needs to be sharp.

  *(Final check on the "Postcode" scenario)*: The prompt says "the only class with enough data in it is ruled out by the ban." This is a hard constraint. I cannot use that class. I must price using a class with *insufficient* data or a broader class. I will choose the broader class with a contingency loading. This highlights the tension between board rules and risk reality.

  10. **Writing the Response.** (Proceeding to generate output based on these thoughts).
answer: |-
  Here is the procedure and its application. It is designed to be completed in under twenty minutes, to satisfy a lay complaints panel, and to admit where the math ends and your gut begins.

  ### The "20-Minute Consistency Protocol"

  **Purpose:** To prevent selection bias when data is too thin for statistical credibility.
  **Rule of Thumb:** With 400 policies, no class is statistically credible. We are not pricing for accuracy; we are pricing for consistency and defensibility.

  **Step 1: Identify the "Anchor Class"**
  Select the *broadest* pre-registered class that the property legally fits (e.g., "Self-Build Residential" rather than "Timber Frame Self-Build").
  *   *Time limit:* 5 minutes.
  *   *Constraint:* You must document the Class Code.

  **Step 2: The "Five-Policy" Test**
  Identify any narrower class that fits better (e.g., "Off-Grid Timber"). Check the current active policy count for that narrower class.
  *   **If > 5 active policies:** You may use the narrower class rate.
  *   **If ≤ 5 active policies:** You **must** revert to the Anchor Class. You are forbidden from using the narrower class rate, even if it feels more accurate.
  *   *Reasoning:* Below five policies, the "rate" is just a hunch. Using it invites cherry-picking.

  **Step 3: The Conflict Loading**
  If you were forced to revert to the Anchor Class (because the narrow class failed the Five-Policy Test), you must apply a **Risk Loading**.
  *   Do not calculate this based on the narrow class's loss ratio (it's garbage data).
  *   Apply a fixed loading percentage pre-agreed with the Board for "Low Credibility Segments" (e.g., 15%).
  *   *Reasoning:* This acknowledges the specific risk without pretending you have data to support a specific class rate.

  **Step 4: The "Walk Away" Threshold**
  You must decline the quote or refer it to the Board if:
  1.  The Anchor Class rate + Maximum Allowed Loading exceeds the customer's budget by >50%.
  2.  The risk relies entirely on a variable banned by the Board (e.g., location) and no physical characteristic class exists to substitute it.
  3.  You find yourself writing more than three sentences justifying the class choice. If it takes that long to explain, you are trying to force a fit.

  **Step 5: The Audit Note (Mandatory)**
  For the complaints panel, you must paste the following template into the quote file. Do not deviate.
  > *"Pricing based on Anchor Class [Code]. Narrower Class [Code] considered but rejected due to active policy count < 5. Risk Loading of [X]% applied to account for specific hazard [Hazard Name]. Price is defensible based on portfolio consistency, not specific loss history."*

  ***

  ### Application to Your Three Quotes

  Here is how you run the protocol on the specific scenarios you provided. I am taking a definite line on each.

  #### 1. The Straw-Bale House
  **The Situation:** There is a "Non-Standard Construction" class (broad) and a "Natural Materials" class (narrow). The "Natural Materials" class has 4 policies and one claim from 2019. You feel the risk is higher than the broad class suggests.
  **The Decision:** **Use the "Non-Standard Construction" Anchor Class + 15% Loading.**
  **The Reasoning:** The "Natural Materials" class fails the Five-Policy Test (4 < 5). Using it would be pricing on a hunch, which the panel will tear apart if a claim occurs. You cannot prove straw-bale is riskier than standard non-standard with 4 policies.
  **The Audit Note:**
  > *"Pricing based on Anchor Class NSC-01. Narrower Class NAT-02 considered but rejected due to active policy count < 5. Risk Loading of 15% applied to account for specific hazard Straw-Bale Construction. Price is defensible based on portfolio consistency, not specific loss history."*
  **The "Nice Suit" Truth:** You know straw-bale is different. The procedure forces you to admit you don't have the data to prove *how* different, so you charge a penalty for uncertainty rather than a specific rate for the material.

  #### 2. The House with a Previous Subsidence Claim
  **The Situation:** The property fits "Standard Residential" (broad) and "Previous Claim History" (narrow). The "Previous Claim" class has 12 policies, but 8 of them are flood, not subsidence. The subsidence data is effectively zero.
  **The Decision:** **Use the "Standard Residential" Anchor Class + Excess Adjustment only. No Class Loading.**
  **The Reasoning:** Even though the "Previous Claim" class has >5 policies, the *relevant* data (subsidence) is <5. Mixing flood and subsidence in one class corrupts the rate. Do not pollute your "Previous Claim" class rate with unrelated hazards. Price the individual risk via the policy excess, not the class rate.
  **The Audit Note:**
  > *"Pricing based on Anchor Class STD-01. Narrower Class HIS-01 considered but rejected due to hazard mismatch (Flood vs Subsidence). Risk managed via Policy Excess adjustment. Price is defensible based on portfolio consistency, not specific loss history."*
  **The "Nice Suit" Truth:** You are worried about the ground movement. But pricing it in the class rate implies *all* houses in that class will subside. By pushing the cost to the excess, you protect the mutual's pool without discriminating against the class.

  #### 3. The Postcode-Banned Class
  **The Situation:** The only class with credible data is "Coastal Flood Zone A." The Board has banned postcode/location-defined classes. The remaining physical classes (e.g., "Drainage Type") have only 2 policies each.
  **The Decision:** **Decline the Quote.**
  **The Reasoning:** This hits the "Walk Away Threshold." The only defensible data is forbidden. The allowed data is statistically void (<5 policies). Pricing this using a broad "General" class would be underpricing the risk (suicide) or overpricing it (unfair). You cannot write a defensible Audit Note here because you would have to lie about why you picked the General class.
  **The Audit Note:**
  > *"Quote Declined. Primary credible risk class (Geo-Flood) prohibited by Board Constraint. Secondary physical characteristic classes failed Five-Policy Test. Unable to produce defensible number within 20-minute protocol."*
  **The "Nice Suit" Truth:** This is where the procedure protects *you*, not the customer. If you price this and a flood happens, the panel will ask why you didn't use the Flood class. You will have to say "The Board told me not to." That is a fight for the Board, not you. Walk away.

  ### Summary of the "Judgement in a Nice Suit"
  This procedure does not make your prices accurate. With 400 policies, accurate pricing is impossible.
  *   It stops you from picking the class that gives the cheapest price to win the business.
  *   It stops you from picking the class that gives the highest price to be "safe."
  *   It forces you to document exactly where the data runs out.

  When the complaints panel asks why you charged 15% more for the straw-bale house, you show them the "Five-Policy Test." You show them that you *wanted* to use the specific class, but the data didn't support it. That is the only defence you have.
