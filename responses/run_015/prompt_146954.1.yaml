          5.  **Scorecard:** Evaluate three models (Pure Inside-View Rationalism, Pure Outside-View Statistical-Deference, Two-Layer View) against the list.

  2.  **Drafting Section 1: Phenomena and Requirements:**

      *   *Phenomenon 1: Expert vs. Base-rate/Peer.* Case: A doctor diagnoses a rare disease (inside view) but knows base rates are low or peers disagree (outside view).
          *   *Requirement:* **The Integration Constraint.** The theory must specify a weighting function that doesn't simply override the inside view with the outside view but adjusts confidence based on the reliability of the specific reasoning process relative to the reference class.
      *   *Phenomenon 2: Deep Framework Disagreement.* Case: Two physicists disagreeing on string theory vs. loop quantum gravity where no neutral statistical baseline exists.
          *   *Requirement:* **The Framework Invariance Condition.** The theory must allow for modesty without requiring a "view from nowhere." It must permit holding a position while acknowledging the possibility of framework error without collapsing into agnosticism.
      *   *Phenomenon 3: Recognized Bias vs. Inside Reasons.* Case: I know I have confirmation bias (outside view on self), but the evidence *looks* compelling to me right now (inside view).
          *   *Requirement:* **The Transparency Preservation Principle.** The agent must not be required to believe propositions she cannot cognitively access or endorse from her first-person perspective, even when adjusting confidence.

  3.  **Drafting Section 2: Distinctions:**

      *   *Distinction 1: Object-level Belief vs. Meta-level Confidence.*
          *   *Case:* Believing $P$ is true vs. believing "I am 80% likely to be right about $P$."
          *   *Motivation:* Prevents self-undermining loops (e.g., "I believe P, but I believe I shouldn't").
      *   *Distinction 2: Local Expertise vs. Global Reasoning Failure.*
          *   *Case:* A chess grandmaster blundering a piece (local) vs. suffering from sleep deprivation affecting all cognition (global).
          *   *Motivation:* Modesty should target specific reliability deficits, not induce global skepticism.
      *   *Distinction 3: Genuine Peer Disagreement vs. Mere Noise.*
          *   *Case:* A rival expert offers a counter-argument (peer) vs. a random poll of non-experts (noise).
          *   *Motivation:* Prevents "false modesty" where one defers to statistically superior but epistemically irrelevant groups.

  4.  **Drafting Section 3: Tensions and Impossibility:**

      *   *The Core Tension:* **Determinate Revision vs. First-Personal Assessability.**
      *   *Explanation:* If the Outside View says "people like you are wrong 90% of the time," a strict algorithmic theory demands a 10% confidence. But if the Inside View says "I see the proof," adopting 10% confidence feels like lying or cognitive dissonance.
      *   *Flag:* The *Integration Constraint* and the *Transparency Preservation Principle* are in tension. You can't always mathematically integrate statistical defeat while maintaining rational endorsement of the belief.

  5.  **Drafting Section 4: Negotiability (Self-Governance vs. Accuracy):**

      *   *Goal: Rational Self-Governance.* Focus on agency, understanding, and integrity.
      *   *Goal: Predictive Accuracy.* Focus on being right, regardless of understanding.
      *   *Non-Negotiable (for Self-Governance):* Transparency Preservation (must understand what you believe), Framework Invariance (must be able to act within a framework).
      *   *Negotiable (for Self-Governance):* Integration Constraint (can be heuristic rather than algorithmic), Determinate Output (can be a range or suspension).
