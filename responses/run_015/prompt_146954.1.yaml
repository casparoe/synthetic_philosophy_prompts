answer: |-
  # Desiderata for a Theory of Calibrated Epistemic Modesty

  A theory of calibrated epistemic modesty must navigate the tension between the authority of the reasoning subject (the Inside View) and the authority of statistical reality (the Outside View). It must avoid the paralysis of global skepticism while preventing the arrogance of uncalibrated rationalism. The following desiderata outline the necessary conditions for such a theory.

  ## I. Phenomena and Corresponding Requirements

  ### 1. The Phenomenon of Expert/Base-Rate Conflict
  **Case:** A domain-specific expert (e.g., a clinician) forms a diagnosis based on detailed case evidence (Inside View) that conflicts with low base-rate statistics or a consensus of peers suggesting the diagnosis is unlikely (Outside View).
  **Requirement: The Integration Constraint.**
  The theory must provide a mechanism for weighting specific evidence against reference-class statistics without granting automatic lexical priority to either. It must specify conditions under which the Inside View can legitimately override the Outside View (e.g., when the agent possesses specific defeating evidence regarding the reference class) and vice versa.

  ### 2. The Phenomenon of Deep Framework Disagreement
  **Case:** Two agents operate within incompatible conceptual frameworks (e.g., conflicting macroeconomic models or metaphysical systems) where no neutral, shared statistical baseline exists to adjudicate reliability.
  **Requirement: The Framework Invariance Condition.**
  The theory must permit an agent to maintain epistemic commitments within a framework while acknowledging the possibility of framework-level error. It must forbid the requirement of a "view from nowhere"; modesty cannot demand suspension of judgment merely because a neutral arbiter is unavailable.

  ### 3. The Phenomenon of Recognized Bias vs. Inside Reasons
  **Case:** An agent has documented evidence of her own susceptibility to a specific cognitive bias (e.g., confirmation bias) regarding a topic, yet the first-personal evidence for her conclusion remains phenomenologically compelling and rationally evaluable.
  **Requirement: The Transparency Preservation Principle.**
  The theory must not require the agent to adopt a doxastic attitude she cannot cognitively endorse from her first-personal standpoint. An agent cannot be required to believe *not-P* (or suspend judgment) solely on statistical grounds if her first-personal access to evidence continues to compellingly support *P*, unless the theory provides a bridge to make that statistical defeat internally intelligible.

  ## II. Essential Distinctions

  ### 1. Object-Level Belief vs. Meta-Level Confidence
  **Motivating Case:** An agent believes a mathematical conjecture is true (Object-Level) but assigns a low probability to her own proof being error-free due to fatigue (Meta-Level).
  **Necessity:** The theory must distinguish between the content of the belief and the confidence in the reliability of the belief-forming process. Conflating the two leads to self-undermining loops (e.g., "I believe P, but I believe I am wrong about P"), which violates rational coherence. Modesty should adjust meta-confidence without necessarily evacuating object-level commitment.

  ### 2. Local Expertise vs. Global Reasoning Failure
  **Motivating Case:** A chess grandmaster makes a blunder due to a specific tactical oversight (Local) versus the same grandmaster making errors across all domains due to sleep deprivation or intoxication (Global).
  **Necessity:** The theory must restrict the scope of Outside View defeat. Statistical evidence of unreliability must be mapped to the relevant domain. Global skepticism is an invalid inference from local reliability failures; calibrated modesty must be granular.

  ### 3. Genuine Peer Disagreement vs. Mere Noise
  **Motivating Case:** A rival expert offers a counter-argument based on shared evidence (Peer) versus a poll of laypeople contradicting the expert's conclusion (Noise).
  **Necessity:** The theory must distinguish between epistemic peers (whose disagreement constitutes evidence) and statistical aggregates that lack epistemic access to the specific reasons at hand. Deferring to "noise" constitutes false modesty and abandons epistemic responsibility.

  ## III. Tensions and Impossibility Results

  **The Tension: Determinate Revision vs. First-Personal Assessability**
  There is a significant tension between the **Integration Constraint** (which demands a specific revision of confidence based on statistical inputs) and the **Transparency Preservation Principle** (which demands the agent understand and endorse the revision from the inside).

  *   **Conflict:** If the Outside View dictates a confidence level of 10% in a proposition that the Inside View makes appear certain, a strict algorithmic application of the Integration Constraint demands the agent adopt 10% confidence. However, if the agent cannot see *why* she should doubt the evidence (because the evidence still looks compelling), adopting 10% confidence violates Transparency Preservation. She would be holding a belief she cannot rationally assent to.
  *   **Flag:** It is suspected that **Determinate Belief-Revision Outputs** and **First-Personal Assessability** cannot be jointly satisfied in cases of radical Outside View defeat. A theory may have to choose between prescribing the "accurate" confidence level (which the agent cannot internally sustain) or allowing the agent to retain higher confidence (which is statistically inaccurate).

  ## IV. Negotiability: Self-Governance vs. Predictive Accuracy

  The status of the requirements shifts depending on whether the goal of the theory is **Rational Self-Governance** (maintaining agency and integrity) or **Predictive Accuracy** (maximizing truth-tracking).

  | Requirement | Status for Self-Governance | Status for Predictive Accuracy | Rationale |
  | :--- | :--- | :--- | :--- |
  | **Transparency Preservation** | **Non-Negotiable** | Negotiable | For self-governance, an agent cannot hold beliefs she cannot endorse. For accuracy, she should believe whatever the algorithm dictates, even if alienated. |
  | **Framework Invariance** | **Non-Negotiable** | Negotiable | An agent must be able to act within a framework to function as an agent. For accuracy, suspension of judgment until a neutral baseline is found is preferable. |
  | **Integration Constraint** | Negotiable | **Non-Negotiable** | For governance, heuristic integration is acceptable. For accuracy, precise statistical weighting is required to maximize truth-tracking. |
  | **Determinate Output** | Negotiable | **Non-Negotiable** | Self-governance allows for suspension or ranges. Accuracy demands a specific probability for calibration scoring. |

  ## V. Scorecard of Competing Models

  ### 1. Pure Inside-View Rationalism
  *   **Description:** Privileges first-personal reasoning; treats Outside View statistics as irrelevant unless internally derivable.
  *   **Meets:** Transparency Preservation, Framework Invariance, Object/Meta Distinction.
  *   **Sacrifices:** Integration Constraint (ignores base rates), Peer/Noise Distinction (often treats all disagreement as error by others).
  *   **Verdict:** Fails calibrated modesty; collapses into dogmatism. High self-governance, low accuracy in statistical environments.

  ### 2. Pure Outside-View Statistical-Deference
  *   **Description:** Privileges reference class data; treats first-personal reasoning as suspect unless validated by external reliability metrics.
  *   **Meets:** Integration Constraint, Peer/Noise Distinction, Local/Global Distinction.
  *   **Sacrifices:** Transparency Preservation (creates alienated belief), Framework Invariance (paralysis in deep disagreement).
  *   **Verdict:** Fails calibrated modesty; collapses into skepticism or alienated compliance. High accuracy (potentially), low self-governance.

  ### 3. Two-Layer View (Inside Step / Outside Framework)
  *   **Description:** Assigns Inside View authority to specific reasoning steps and evidence evaluation; assigns Outside View authority to framework selection and reliability calibration.
  *   **Meets:** Integration Constraint (partially), Framework Invariance, Local/Global Distinction, Transparency Preservation (mostly).
  *   **Sacrifices:** Determinate Output (often results in confidence ranges rather than point estimates); struggles with the Tension (still faces friction when layers conflict).
  *   **Verdict:** Best fit for **Rational Self-Governance**. It preserves agency by allowing the agent to reason through steps while using Outside View data to select *which* reasoning processes to trust. It sacrifices the precision demanded by pure accuracy models to maintain the integrity of the reasoning subject.
