answer: |-
  Good evening. I was told by my senior counselors that if I didn't start with a joke, there would be a coordinated marshmallow ambush. Given the inventory constraints we're working with this year, I cannot afford to lose any stock. So: I hope you all packed bug spray, because the mosquitoes out here are the only ones who got a full raise this summer.

  Okay. You know why I'm up here. And you know what we're talking about.

  For a long time, this camp had a rule about the canteen. If your family paid full tuition, you got twenty-five dollars on your card. If you were on a campership, you got nothing. Every afternoon, there was a line at the window. Some of you bought a slushie. Some of you stood there, watched, and walked away.

  This winter, the board looked at that line. We looked at the cost to give everyone those twenty-five dollars. It comes to about eighteen thousand dollars a summer. We don't have that money in the endowment. Not yet. So we had a choice: keep the line as it was, or remove the credit for everyone.

  We voted to remove it.

  I know what that feels like. If you're a camper whose parents paid tuition, you had something last summer that you don't have this summer. Your parents paid for it. It mattered. You lost something. If you're a camper on a campership, you didn't gain any money. You're standing in the same spot you stood last year.

  A seventh grader named Devin summed this up at a cabin meeting earlier this week. He said, "You're taking it from us and giving it to nobody."

  Devin is right.

  I'm not going to stand here and tell you that nobody lost anything. You lost the credit. I'm not going to tell you that this makes us all richer. It doesn't. Financially, this camp is worse off than it was last year. Some of you have less candy, and none of you have more.

  So why do it?

  It wasn't about the twenty-five dollars. It was about the window.

  For two weeks every summer, that canteen window was a border crossing. It was a place where, every single day, you were reminded of who belonged and who was visiting. We stopped reading the campership names at opening ceremony because we thought privacy was kindness. But privacy doesn't fix a daily reminder. You can hide the list, but you can't hide the line.

  We decided that keeping that visible line was too expensive for this community, even if the dollar cost was zero. We decided that a summer where everyone stands at the window with empty pockets is better than a summer where some stand with full ones and some stand with none.

  I know that sounds like a consolation prize. It is.

  I also need to say something to the parents and the board, and to the kids who are listening hard to make sure I don't slip up. Removing the credit doesn't fix the problem. It just stops making it visible. It levels the ground, but it doesn't build anything on it.

  I am not going to pretend this decision gets us off the hook. It doesn't. We still need to find the money to give those kids something next year. We still need to raise the eighteen thousand. This year was about stopping the bleeding. Next year has to be about healing. If we stop here, if we say "well, at least it's fair now," we haven't done enough. We have to find the funds to make sure that when you come back, the window is open to everyone, not just closed to everyone.

  I know some of you are angry. You should be. You liked your slushies. Your parents worked hard for that tuition. I respect that. I'm not asking you to be happy about losing something. I'm asking you to understand what we were trying to protect.

  We were protecting the idea that when you look across the circle at this fire, you shouldn't be able to tell who paid what. Not because money is bad, but because this circle is supposed to be the one place where that doesn't decide who you are.

  So here is what I want you to take home. Not the bug spray, keep that. But when you're back in school in September, and you're sitting in a cafeteria or standing in a line, and you see that border appear again—because it will, out there it always does—I want you to remember this fire.

  Remember that for two weeks, we decided the line mattered more than the slushie. Remember that we chose to have nothing together rather than have something apart.

  And remember Devin. Because he told the truth. And because next year, I promise you, we're going to work until we can tell him that we gave it to somebody.

  Thank you.
