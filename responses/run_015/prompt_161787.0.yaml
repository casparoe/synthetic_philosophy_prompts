      *   The "day to day" drift makes utilitarian summation non-invariant across states; check the math on $\sum b_i$ varying between policies.
      *   Harsanyi's equal weighting requires fixed zeros; the probe does not supply this normalization, so the theorem doesn't yield a unique decision procedure here.
      *   Review week three notes on measurability scales; distinguishing units from levels is essential for part (a).
