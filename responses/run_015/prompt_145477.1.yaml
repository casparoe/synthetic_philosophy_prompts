  2.  **Deconstruct Williams's Integrity Objection & "One Thought Too Many":**
      *   *Core Insight:* Utilitarianism (and impartial moral systems) demands that agents step back from their personal commitments ("ground projects") to evaluate actions from an impersonal standpoint. This alienates the agent from their own actions and life.
      *   *The Rescue Scenario:* A man (Williams uses a husband) finds his wife and a stranger in danger. He saves his wife.
      *   *The "One Thought Too Many":* If he justifies saving his wife by saying "she is my wife" (immediate impulse/commitment), that's fine. If he justifies it by calculating that saving his wife produces more overall utility (perhaps because he loves her, or generally spouses save spouses), he has had "one thought too many." He shouldn't need to appeal to the *general good* to justify a *personal commitment*.
      *   *Integrity:* Integrity involves maintaining the projects and attitudes that constitute one's identity. Forcing someone to abandon these for the "greater good" attacks their integrity.

  3.  **Analyze the Five Formulations:**

      *   **A. The Aggregate Calculator:** She assigns values, includes partner in aggregate, saves partner because weighted total > stranger. Treats commitment as a fungible input.
          *   *Analysis:* This is classic Act Utilitarianism. It explicitly invokes the "one thought too many" (calculating the total). It treats the relationship as just another variable. Williams hates this. It dissolves integrity by subsuming it into the aggregate.

      *   **B. The Direct Attacher:** She saves through direct attachment, no intermediate reasoning. Justification is post-hoc narrative.
          *   *Analysis:* This aligns perfectly with Williams's description of the *right* way to act (psychologically) to preserve integrity. The action flows from the ground project (love/commitment) directly, not from an impartial calculation. This captures the insight best.

      *   **C. The Self-Interested Calculator:** She estimates her own grief, maximizes personal expected utility. Stranger's welfare is indirect.
          *   *Analysis:* This is Egoism/Subjective Utilitarianism. While it results in saving the wife, the *structure* of reasoning is still calculative and consequentialist. It reduces the relationship to a source of personal utility (grief avoidance). Williams would likely see this as a corruption of the commitment, though less alienating than A because it focuses on the self. However, it still turns the relationship into a means to an end (utility).

      *   **D. The Lexical Constraint:** Integrity is a constraint. Overriding a ground project for aggregate welfare is impermissible.
          *   *Analysis:* This is a Deontological interpretation of Williams. It captures the *force* of integrity (it stops the calculation), but Williams wasn't necessarily proposing a rigid rule-based system. However, it respects the *priority* of ground projects over aggregate welfare. It's strong, but perhaps slightly more rigid/systematic than Williams's phenomenological point in B. Still, it captures the *objection* well.

      *   **E. The Relational Discount Factor:** Weights stranger at 1, partner at 1 + epsilon (irreplaceability). Selects highest weighted sum.
          *   *Analysis:* This is a "Rule Utilitarian" or "Modified Consequentialist" attempt to accommodate partiality. It tries to mathematize the "specialness" of the relationship. Williams would likely view this as the ultimate "one thought too many." It tries to buy integrity with a parameter. It turns the unique value of the person into a number ($1 + \epsilon$).

