answer: |-
  **Verdict and Precedent**
  I recommend a verdict of **exaptation**, though I anticipate my supervisor will rule **adaptation**. The closest precedent is 4 (feathers), which established that co-opted structures retain exaptation status unless specific refinements are proven to be selected for the new role. Here, the flange originates as a developmental consequence of the nasal capsule (a spandrel-like origin), and while a selective sweep exists, its timing relative to the ecological shift is unresolved. My supervisor will likely prioritize Precedent 6 (cichlid jaw), arguing that the selective sweep and trabecular alignment constitute the "repeated independent modification" and "derived state" required for adaptation. Precedent 4 is doing the heavy lifting in my recommendation, but it is weak ground: the feather ruling explicitly declined to resolve when refinements earn promotion. This case forces that resolution.

  **Candidate Rules**
  Three rules fit the track record sharply enough for application:
  1.  **The Independence Criterion:** A trait is an adaptation only if selection acts on loci that modify the trait independently of the source trait's primary function (low genetic correlation or independent sweep).
  2.  **The Optimization Criterion:** A trait is an adaptation if its internal architecture demonstrates design specific to the new load case, exceeding what physiological remodeling or developmental spillover predicts.
  3.  **The Origin Lock:** If a trait arises as a structural consequence of selection on a different trait, it remains an exaptation unless the genetic architecture decouples from the source trait.

  **Predictions and Divergence**
  Applied to *Fossoriscincus*, the **Independence Criterion** predicts **exaptation**. The genetic correlation between capsule volume and flange length is high ($r_g \approx 0.8$); the flange is largely a shadow of the capsule. The existence of two independent loci is insufficient to override the constraint. The **Optimization Criterion** predicts **adaptation**. The trabecular alignment matches principal strain directions, and the selective sweep suggests directional selection on projection, satisfying the "design" requirement seen in Precedent 6. The **Origin Lock** predicts **exaptation**, aligning with Precedents 1, 2, and 5; the flange exists *because* the capsule is large, not vice versa.

  The rules come apart on the weight of the selective sweep. Independence and Origin Lock treat the sweep as maintenance selection on a byproduct. Optimization treats it as evidence of redesign. The divergence turns on whether "selection on a byproduct" converts the byproduct into an adaptation, or merely maintains an exaptation. Precedent 5 (panda thumb) suggests the former requires evidence of refinement beyond "workmanlike" utility; the trabecular alignment here is that evidence, favoring Optimization.

  **Principles and Reopened Verdicts**
  If we adopt Optimization (Adaptation), we adopt the principle that secondary selection converts exaptations. This reopens Precedent 4 (feathers): the asymmetric vane and locking barbules must be ruled adaptations, resolving the earlier reservation. It does not threaten Precedent 3 (antlers), as the antlers lacked evidence of selection specific to combat shape independent of body size. If we adopt Origin Lock (Exaptation), we adopt the principle that developmental history constrains verdicts regardless of subsequent utility. This reinforces Precedent 7 (crystallins), where verdict attaches to use, but risks contradicting Precedent 6 if cichlid jaws are found to have developmental constraints we missed. The safer path is Adaptation, acknowledging the sweep as the "promotion" moment Precedent 4 avoided.

  **Decisive Finding**
  The single finding that would separate the rules is **phylogenetic timing of the selective sweep relative to the soil shift**. If the sweep predates the shift into compacted soils, selection was for the capsule (chemosensory), and the flange's utility is incidental (Exaptation). If the sweep postdates the shift, selection was for burrowing efficiency (Adaptation). This finding is superior to measuring bite force or survival margins because those metrics only establish utility (which Precedent 3 shows is insufficient). Only timing distinguishes whether selection shaped the trait *for* the function or merely maintained it *during* the function. This directly tests the Independence and Optimization criteria against the Origin Lock.
