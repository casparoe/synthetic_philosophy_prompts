  Imogen checks her credal set against the unanimity rule: she only accepts a bet if *every* probability function in the set finds it favorable. The function assigning 0.3 vetoes the purchase at $0.60, and the function assigning 0.7 vetoes the sale at $0.40$. She declines both. The bookie, flustered, insists that her refusal proves the odds are actually fair, and steps into her shoes to take both bets himself as a demonstration. He immediately realizes he has constructed a Dutch Book against his own singleton credence: he is now committed to buying high and selling low, locking in a sure loss of $0.20. Imogen walks away dry, noting that while her credences were imprecise, his grasp of the plumbing was precisely non-existent.
