answer: |-
  ### 1. Correspondence Table: Source (Family) to Target (State)

  | Source Domain (Family) | Target Domain (State) | Function in Argument |
  | :--- | :--- | :--- |
  | **Parent** | **State / Citizenry (Collective)** | The agent bearing the special obligation. |
  | **Child** | **Citizen** | The primary beneficiary of partiality. |
  | **Household Budget** | **Public Treasury / Tax Revenue** | The finite resource being allocated. |
  | **Outsider Child** | **Non-Citizen / Foreigner** | The moral equal who receives secondary priority. |
  | **Emotional/Biological Bond** | **National Identity / Legal Solidarity** | The purported ground for special obligation. |
  | **Parental Duty of Care** | **Social Welfare Entitlement** | The specific action justified by the bond. |
  | **Family Autonomy** | **State Sovereignty** | The right to manage resources without external interference. |

  ### 2. Audit of Disanalogies and Normative Threats

  The strength of the analogy depends on whether the justification for parental partiality is *associative* (based on the relationship itself) or *instrumental* (based on the outcomes of the relationship).

  *   **Emotional Thickness (High Threat):**
      *   *Disanalogy:* Parental partiality is grounded in intimate love and direct knowledge of the child's needs. Citizenship involves abstract solidarity among millions of strangers.
      *   *Normative Threat:* If partiality is justified by *love*, the state analogy collapses immediately. States cannot love. If partiality is justified by *role responsibility* (the parent is the designated caretaker), the analogy holds better. However, without emotional thickness, the *motivation* to prioritize compatriots weakens, potentially requiring coercion (taxation) where family support is often voluntary.
  *   **Scale and Anonymity (Medium Threat):**
      *   *Disanalogy:* A parent monitors a child's specific welfare; a state administers general rules.
      *   *Normative Threat:* This dilutes the "specialness" of the claim. In a family, resources are tailored to the specific child. In a state, resources are distributed via bureaucracy. This suggests compatriot priority is less about *care* and more about *insurance*, which weakens the moral urgency compared to a starving child abroad.
  *   **Arbitrariness of Boundaries (High Threat):**
      *   *Disanalogy:* Family boundaries are biological (mostly); state boundaries are historical artifacts of war, colonization, or accident.
      *   *Normative Threat:* This is the most damaging disanalogy. If I am a citizen of a rich nation only due to the "lottery of birth," prioritizing me over a starving foreigner looks like moral favoritism based on luck. Parental partiality is permitted *despite* the biological lottery because the duty is natural; state partiality looks like protecting unjust privilege.
  *   **Involuntariness and Exit (Low/Complex Threat):**
      *   *Disanalogy:* Critics often claim citizenship is voluntary (emigration); family is not. In reality, both are largely involuntary by birth.
      *   *Normative Threat:* Actually, this is a *symmetry* that helps the analogy. However, the *ease* of exit differs. A child cannot renounce parents; a citizen can (theoretically) naturalize elsewhere. If citizenship is more voluntary than family, it supports a *contractual* view rather than an *associative* view, shifting the justification from "who we are" to "what we agreed to."

  **Verdict:** The absence of emotional thickness and the arbitrariness of borders threaten the **associative** justification (we owe them because they are *ours*). They do not necessarily threaten an **instrumental** justification (we owe them because this system works best), but the family analogy is typically invoked to support the former.

  ### 3. Repairing the Analogy: Contract vs. Illustration

  If we repair the analogy by shifting from "Family" to "Voluntary Cooperative Scheme" (e.g., an insurance pool or mutual aid society), we address the "strangers" and "arbitrariness" issues. Citizens are co-participants in a shared project.

  *   **Does it preserve special claims?**
      It preserves a *weaker* claim. In a cooperative scheme, priority is based on reciprocity. We prioritize compatriots because they contribute to our scheme. This fails to account for compatriots who *cannot* reciprocate (the severely disabled, the very poor, future generations), whom the family analogy covers easily (parents owe children even if children give nothing back).
  *   **Was the analogy carrying the weight?**
      Yes. The family analogy was doing heavy normative lifting by smuggling in the **unconditional** nature of parental duty. By switching to a contract/cooperative model to fix the disanalogies, we reveal that the intuition behind compatriot priority was relying on the *familial* sense of unconditional obligation. The contract model justifies priority only insofar as it produces mutual advantage. If sending resources abroad produced more stability (and thus more advantage for us), the contractual priority would dissolve. Therefore, the family analogy was not merely illustrative; it was providing the *unconditional moral force* that the contractual repair cannot sustain.

  ### 4. A More Defensible Analogy and Its Awkward Commitment

  If the family analogy collapses under the weight of arbitrariness and lack of intimacy, a more defensible analogy for **moderate** compatriot priority is the **"Division of Moral Labor"** (or the **Regional Manager**) analogy.

  *   **The Analogy:** Imagine a global humanitarian organization (Humanity Inc.) that assigns specific employees to be responsible for specific geographic regions. You are the "Regional Manager" for your nation. You have a priority duty to your region not because you love them more, but because decentralized responsibility is the most efficient way to ensure *everyone* globally is cared for. You prioritize your region to prevent bureaucratic overlap and ensure accountability.
  *   **How it supports moderate priority:** It justifies prioritizing compatriots as an administrative efficiency necessary to fulfill global duties, rather than as an intrinsic good. It respects global equality (everyone is an employee of the same firm) while allowing local priority.
  *   **The Awkward Commitment:**
      This analogy commits us to the **provisionality of state sovereignty**. If the "Regional Manager" structure ceases to be the most efficient way to maximize global welfare (e.g., if open borders or direct global taxation would save more lives), the obligation to prioritize compatriots vanishes.
      *   *Why it is awkward:* It renders national identity and borders **morally arbitrary administrative lines**. It implies that patriotism is only virtuous insofar as the nation-state is the most efficient tool for global justice. If evidence showed that dissolving national priority would increase global well-being, this analogy demands we do so. This is deeply counter-intuitive to the very people who usually defend compatriot priority, as it strips the nation of intrinsic value and makes loyalty purely instrumental.
