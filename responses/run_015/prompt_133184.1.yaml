answer: |-
  This is a sophisticated dispute that cuts to the core of methodological nationalism, essentialism, and statistical reasoning in social science. Both Keisha and Tom are holding valid but incomplete positions. Keisha is stronger on ontology (what things *are*), while Tom is stronger on operationalism (how we *measure* things).

  Here is the adjudication move by move.

  ### 1. The Reference-Class Objection (Natural Kinds vs. Administrative Containers)
  **Verdict: Keisha is right on ontology; Tom is right on utility, but Keisha wins the theoretical point.**

  Keisha is correct that nations are not "natural kinds" like biological species. They are historically contingent, politically enforced administrative boundaries. However, her claim that the boundary is "arbitrary" is too strong. Borders are *contingent*, not random. They create real, causal institutional environments (legal systems, education curricula, media markets) that generate statistical clustering.

  Tom is correct that sociology must be able to study socially constructed categories (race, class, nation) even if they aren't biological. If we banned non-biological reference classes, sociology would cease to exist. His comparison to gender is slightly flawed (since gender is also socially constructed, distinct from biological sex), but his core point stands: valid statistical clusters can exist within constructed boundaries.

  **The Ruling:** The category "Japanese" is not a biological essence, but it is a valid *institutional field*. If the paper treats "Japanese" as a proxy for "people subject to specific Japanese institutional pressures," the reference class is valid. If it treats "Japanese" as a proxy for "ethnic soul," Keisha is right: it is essentialism.

  ### 2. The Ecological Fallacy
  **Verdict: Tom is technically right; Keisha is pragmatically right.**

  The ecological fallacy is a specific logical error: inferring individual-level correlations from group-level data (e.g., "Japan has high harmony scores, therefore Tanaka-san is harmonious").
  *   **Tom:** He is correct that stating a population mean ("Japanese people *tend* to...") is not itself the ecological fallacy. It is a descriptive statement about a distribution. Banning such descriptions does hinder analysis.
  *   **Keisha:** She is correct that in practice, these statements function as *permission structures* for readers to commit the ecological fallacy. When a paper authorizes a group generalization, readers often apply it to individuals.

  **The Ruling:** Tom is not committing the fallacy by describing the cluster. However, Keisha is right to flag the *risk of uptake*. In a sociology paper, you must explicitly inoculate the reader against this inference. If Tom writes the sentence without qualifying the variance, he is being methodologically sloppy, not just politically uncomfortable.

  ### 3. Principled Usage: Avoiding Harmful Generalization
  **Verdict: There is a principled way, but it requires shifting from "traits" to "mechanisms."**

  You can discuss population-level cultural patterns without essentialism if you adhere to three rules:
  1.  **Attribute the cause to institutions, not souls.** Do not say "Japanese people value harmony." Say "Japanese institutional structures incentivize conflict avoidance." This moves the locus from internal essence to external pressure.
  2.  **Report Variance, Not Just Means.** A claim about a "tendency" is scientifically hollow without an estimate of the spread. If 51% prioritize harmony and 49% don't, the "tendency" is statistically real but sociologically weak.
  3.  **Historicize the Cluster.** Acknowledge that the cluster is a product of specific historical conditions (e.g., post-war labor markets), not a timeless feature of the population.

  **The Ruling:** The sentence is permissible *only if* it is framed as an outcome of social structures, not an expression of national identity.

  ### 4. Is "National Character" Coherent Without Essentialism?
  **Verdict: No. Drop the term "National Character." Keep "National Culture" or "Institutional Logic."**

  "National Character" is historically toxic (associated with WWII-era anthropology that often justified racism) and theoretically incoherent. It implies a psychological uniformity that does not exist. Even if you treat nations as mere "administrative containers for statistical clusters," the term "character" suggests personality.

  However, the *phenomenon* Tom wants to describe is coherent. Nations act as "containers" for:
  *   Legal frameworks
  *   Educational socialization
  *   Media ecosystems
  *   Economic incentives

  These create **institutional isomorphism**. People within the border act similarly not because they are the same "kind" of human, but because they are navigating the same rules.

  **The Ruling:** "National Character" is essentialism with better PR, just as Keisha said. But "Nationally clustered behavioral norms driven by institutional homogeneity" is valid sociology, just as Tom wanted.

  ### Final Adjudication & Recommendation

  **Who wins?**
  *   **Keisha** wins on the warning against reification. You cannot treat "Japan" as a unitary actor with a psyche.
  *   **Tom** wins on the right to describe statistical reality. You cannot ban demographic generalizations without breaking social science.

  **How to write the sentence:**
  Tom's original sentence is too risky for a sociology paper because it invites essentialist reading. Keisha's prohibition is too absolute for empirical analysis.

  **Do not write:**
  > "Japanese people tend to prioritize group harmony over individual expression."
  *(This implies the trait resides inside the people.)*

  **Do write:**
  > "Survey data indicates that respondents in Japan report higher prioritization of group harmony relative to individual expression compared to [Comparison Group], likely reflecting institutional incentives within the Japanese labor and education systems."
  *(This locates the trait in the data and the cause in the institutions.)*

  **Summary for the Group:**
  Tom is allowed to describe the cluster, but Keisha is right that he must not reify it. The boundary is political, but the effects are real. The ecological fallacy isn't committed by the statement itself, but the author is responsible for preventing the reader from committing it. Drop "national character" entirely; use "institutional context."
