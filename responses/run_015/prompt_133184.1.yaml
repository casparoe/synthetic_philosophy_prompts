          *   *Analysis:* The ecological fallacy is specifically inferring individual-level correlation from group-level data. If Tom writes "Japanese people tend to...", he is making a statement about the population distribution. If he implies "Therefore, this Japanese person will...", that's the fallacy. Keisha worries about the *implication* readers will draw. Tom worries about the *prohibition* of the statement itself.
