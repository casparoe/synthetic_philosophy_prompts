answer: |-
  **METHOD NOTE: PRIORITISATION PANEL PROCEDURE V2.0**

  **Purpose**
  To establish a defensible ranking of capital schemes or, where logic forbids a strict order, to publish an honest partial ordering. This procedure replaces implicit judgment with explicit testing to prevent logical cycles and gaming.

  **Procedure Steps**

  **S1: Dimension Alignment (Type: Factual)**
  *Question:* Are the same evaluation dimensions applied consistently across all pairwise comparisons in the suspected cycle?
  *Sufficient Answer:* Yes, the panel confirms the criteria (e.g., cost, safety, carbon) are identical for every link in the chain.
  *On Failure:* Halt. The comparison is invalid. Return to promoters for re-submission on consistent criteria. Hand-off: Panel Chair.

  **S2: Threshold Declaration (Type: Value)**
  *Question:* For every judgment where a difference is deemed 'not worth mentioning', is the specific threshold value recorded?
  *Sufficient Answer:* Yes, the negligible amount (e.g., "£5k cost difference", "2 seconds travel time") is written into the minutes for every link.
  *On Failure:* Halt. Judgments cannot stand until thresholds are explicit. Hand-off: Chief Executive (to enforce administrative compliance).

  **S3: Aggregation Test (Type: Factual)**
  *Question:* Does the cycle persist when each dimension is evaluated separately without weighting?
  *Sufficient Answer:* No, the cycle disappears when dimensions are isolated, indicating a weighting artefact.
  *On Failure:* Proceed to S4. The cycle is intrinsic to value judgments, not mathematical weighting.

  **S4: Value Consistency (Type: Value)**
  *Question:* Can the panel revise any single link in the cycle to break it, now that thresholds are visible?
  *Sufficient Answer:* Yes, one member admits a threshold was misapplied and revises their vote.
  *On Failure:* Proceed to S5. The panel endorses the cycle as a genuine expression of conflicting values.

  **S5: Phasing Integrity (Type: Factual)**
  *Question:* If Scheme B is Phase 2 of Scheme A, does approving A then B yield a result the panel would reject if A and B were presented together?
  *Sufficient Answer:* No, the cumulative outcome is consistent with the panel's overall priorities.
  *On Failure:* Halt. The proposal is flagged as exploitative slicing. Hand-off: Chief Executive (to reject submission structure).

  **S6: Publication Rule (Type: Value)**
  *Question:* Given the unresolved cycle, can we publish a strict ranking?
  *Sufficient Answer:* No. If S4 failed, a strict ranking is logically false.
  *On Failure:* Publish a Partial Order. Group cyclic schemes into a 'Priority Cluster' with no internal ranking. List clusters sequentially.

  **Validation Results**
  The procedure was run on three test cases:
  1.  *Cycle Network/Junction/Bus:* Stopped at S3. Cycle vanished on single dimensions. **Result:** Reweight dimensions.
  2.  *Eight-Scheme Spectrum:* Stopped at S4. Thresholds accumulated visibly. **Result:** Publish Partial Order (Cluster).
  3.  *Flagship Dimension Shift:* Stopped at S1. Criteria shifted mid-chain. **Result:** Invalid ranking. Flagship cannot be ranked first until resubmitted.

  **Limitations**
  This procedure cannot resolve fundamental political disagreements about what counts as 'benefit'. It offers rigour in process, not truth in outcome. Step S3 assumes dimensions are independent; if they are correlated, the test may false-positive. Step S6 requires the Chief Executive to accept non-strict rankings publicly.

  **Sign-off**
  Chief Executive.

