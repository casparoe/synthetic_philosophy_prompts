answer: |-
  The standard way we talk about democratic backsliding is like a mechanic checking a car for broken parts. We look for smashed windows and cut brakes: Did they pack the court? Did they shut down the newspaper? Did they cancel the election? If the parts are still there and technically moving, we tend to say the car is running.

  But this misses how modern democracies actually die. They rarely die with a bang of abolished institutions. They die by suffocation. A better way to understand backsliding is not as institutional damage, but as the collapse of **epistemic redundancy**.

  Think of epistemic redundancy like the sensor system on an airplane. You don't rely on one altimeter; you rely on three independent ones. If one fails, the other two cross-check it, and the pilot knows there is a problem. Democracy is an information-processing system. It relies on multiple, independent channels—courts, local press, opposition parties, auditors, civil society—to verify what the government is doing. When these channels are independent, they provide redundancy. When they are co-opted, aligned, or silenced, the redundancy collapses. The plane is still flying, the instruments are still lit up, but they are all feeding the pilot the same false data.

  This framework explains why Hungary and Poland are considered backsliding democracies even though they still hold elections and their courts still issue rulings. In Hungary, the formal institutions of democracy remain. Parliament meets, judges wear robes, and ballots are cast. But the ecosystem of verification has withered. Through state advertising revenue and regulatory pressure, independent media outlets were not banned; they were simply bought out or starved until they aligned with the ruling party's narrative. When the government acts, there is no longer an independent sensor to report it differently. The courts still function, but if the public cannot access verified facts to bring cases, or if the legal culture has shifted to accept the executive's interpretation of reality as the default, the court becomes a rubber stamp rather than a cross-check.

  The same applies to Poland during its period of illiberal drift. The conflict wasn't just about who sat on the constitutional tribunal; it was about the state's ability to control the narrative surrounding the tribunal's decisions. When the state media becomes a megaphone for the government rather than a mirror for the public, the redundancy is gone. Citizens can still vote, but they are voting based on a single, curated version of reality. The institution of the election remains, but the epistemic condition required for that election to be meaningful—informed consent based on verifiable facts—has evaporated.

  This lens is crucial for understanding the United States, because it pushes back against the complacent idea that America cannot be backsliding because elections still happen and courts still rule. By the checklist definition, the US is fine. The brakes work, the windows are intact. But by the redundancy definition, the sensors are failing.

  In the US, we have seen a massive thinning of independent information channels. Local news deserts mean there is no one to cross-check city councils or state legislatures. National media has consolidated into partisan ecosystems where facts are filtered through ideological loyalty before reaching the citizen. When one half of the country consumes information from a system that verifies power and the other half consumes information from a system that distrusts it, there is no shared baseline for cross-checking.

  Furthermore, the sheer volume of noise acts as a form of censorship. You don't need to ban a report to make it ineffective; you just need to flood the zone with so much contradictory information that citizens give up on verifying anything. If the Department of Justice releases a report, and half the population is preconditioned to believe it is a deep-state fabrication while the other half believes it is gospel, the epistemic redundancy has failed. The institution issued a ruling, but it did not serve its function of verifying truth for the public. The sensors are giving different readings, not because of independent verification, but because the system has fractured into incompatible realities.

  Defining backsliding as the collapse of epistemic redundancy also rescues the concept from being a partisan stick. When we focus on court-packing or specific laws, it inevitably becomes a debate about policy preferences. One side says "judicial reform," the other says "authoritarian grab." It becomes a fight about outcomes.

  But focusing on redundancy is structural. It asks a mechanical question: Are there enough independent witnesses to power? It doesn't matter if you are on the left or the right; if the channels of verification are thinning, the system is becoming fragile. A conservative should worry about epistemic redundancy because when they are out of power, they will need independent courts and media to check a liberal overreach. A liberal should worry about it for the same reason.

  This definition shifts the focus from "Who is winning?" to "Is the system capable of self-correction?" A democracy with high epistemic redundancy can survive a bad leader because the sensors will trigger an alarm, the opposition will have the facts to challenge them, and the courts will have the credibility to rule. A democracy with low redundancy cannot self-correct. It flies blind until it crashes.

  If we stick to the checklist of institutional damage, we will always be arguing about whether the window is technically cracked or fully shattered. We will miss the fact that the pilot is flying into a mountain because the altimeters were tampered with months ago. By focusing on the thinning of independent information channels, we capture the structural reality of how democracies fail: not when the institutions stop working, but when they stop telling the truth to each other.
