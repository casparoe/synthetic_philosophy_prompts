      *   *The "Adversarial" vs. "Evidential" Tension:* Evidential reasoning says "My action is evidence." Adversarial twins break the link between "My action" and "Their action" *conditional on the setup*, but if the theory relies on raw correlation, it gets burned. If it relies on *structural* similarity, the bounded agent can't verify it.
