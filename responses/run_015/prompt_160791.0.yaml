answer: |-
  Here is the specification you asked for. I have structured it as a design document for a decision theory intended for a bounded agent in a large world. I have categorized requirements into **Core** (non-negotiable for the stated purpose of action-guidance) and **Contested** (where camps diverge on what counts as a bug vs. a feature).

  Following the spec, I have analyzed the internal tensions, identified the impossibility results, and provided the scorecard.

  ### The Specification: Evidential Cooperation in Large Worlds

  **Purpose:** To determine whether a bounded agent (no source-code access, real-time, unknown population) should treat its action as evidence for the actions of causally disconnected but structurally similar agents.

  #### 1. The Correlation Threshold (Core)
  *   **Requirement:** The theory must provide a formula where Cooperation is mandated if and only if $P(\text{Other Cooperates} | \text{I Cooperate}) - P(\text{Other Cooperates} | \text{I Defect}) > \frac{\text{Cost}}{\text{Benefit}}$.
  *   **Rationale:** Without a quantitative threshold tied to payoffs, the theory is just a vibe. It must explain why you cooperate in a high-stakes PD with a twin but defect in a low-stakes PD with a stranger, even if the "similarity" feels the same.
  *   **Status:** **Core.** Any theory that cannot map evidence to payoffs is not action-guiding.

  #### 2. The Mechanism Distinction (Contested)
  *   **Requirement:** The theory must distinguish between correlation caused by shared decision logic (logical correlation) and correlation caused by a common upstream trait (e.g., Smoking Lesion). It must count the former as actionable evidence and the latter as fixed background.
  *   **Rationale:** In the Smoking Lesion, conditioning on your action gives evidence about a fixed trait (cancer) that doesn't change based on your choice. In ECL, conditioning on your action gives evidence about a *computation* that is running elsewhere. If the theory treats these identically, it recommends smoking to avoid cancer or defecting against a twin because "we were both going to defect anyway."
  *   **Status:** **Contested.** Causalists argue this distinction is incoherent without causal arrows. Evidentialists argue the distinction is unnecessary; the expected utility calc handles it. For *your* purpose (bounded agent), this is the hardest hurdle: can you actually tell the difference without source code access?

  #### 3. The Graining/Reference Class Principle (Core)
  *   **Requirement:** The theory must define "similarity" without allowing the agent to manipulate the verdict by changing the description of the algorithm. It must prevent "gerrymandering" the reference class (e.g., defining the class as "agents who cooperate" to make cooperation certain).
  *   **Rationale:** If I can define my reference class as "people like me who cooperate," correlation is 100%. If I define it as "humans," it might be 10%. The theory needs an objective metric for algorithmic identity that isn't sensitive to linguistic framing.
  *   **Status:** **Core.** Without this, the theory is computationally trivial and exploitable by framing.

  #### 4. The Population Agnosticism (Core)
  *   **Requirement:** The theory must yield a verdict without requiring an exact count of similar agents ($N$). It must handle $N = \text{unknown}$, $N = \text{huge}$, or $N = \text{infinite}$.
  *   **Rationale:** In a large world, you never know $N$. A theory that requires $N=10^6$ to trigger cooperation is useless. It should likely rely on the *expected* impact per correlated agent or a prior over $N$.
  *   **Status:** **Core.** Essential for the "Large World" premise.

  #### 5. Graceful Degradation (Core)
  *   **Requirement:** The theory must handle partial correlation. If the other agent is 90% likely to run the same procedure, or if there is a 10% chance they are an anti-twin, the recommendation should scale continuously, not flip discontinuously.
  *   **Rationale:** Real-world similarity is noisy. A binary "same algorithm/different algorithm" switch is unrealistic for bounded agents estimating similarity.
  *   **Status:** **Core.** Necessary for real-time application.

  #### 6. Adversarial Robustness (Contested)
  *   **Requirement:** The theory must not recommend cooperation if the correlation is negative (e.g., an agent wired to do the opposite of you).
  *   **Rationale:** If I cooperate, and that is evidence the other agent defects, ECL should recommend defection. A theory that says "Cooperate because your action is *relevant*" regardless of the sign of the correlation is broken.
  *   **Status:** **Contested.** Most ECL proponents agree, but some "Superrational" intuitions imply a duty to cooperate regardless of the other's response (which violates the payoff threshold). I mark this Contested because some moralized versions of ECL ignore the sign.

  #### 7. Normative vs. Engineering Clarity (Core)
  *   **Requirement:** The theory must state whether it is prescribing what a *current* agent should do, or what an agent *should have been built* to do.
  *   **Rationale:** If it's engineering, ECL is trivial (build agents that cooperate). If it's normative for a current agent who didn't choose their architecture, the "why" matters. You specified "actual agent... decide in real time," so the theory must justify the action *now*, not just as a precommitment.
  *   **Status:** **Core.** Matches your stated purpose.

  #### 8. Non-Reduction to Act Consequentialism (Contested)
  *   **Requirement:** The theory must have a failure mode where it recommends *not* maximizing total expected utility in the large world.
  *   **Rationale:** If ECL always outputs "Maximize Total Utility," it is just Utilitarianism with extra steps. It needs to fail in cases where the evidential link is weak but the total utility impact is high (e.g., one agent vs. infinite uncorrelated agents).
  *   **Status:** **Contested.** Many proponents *want* it to reduce to Utilitarianism in large worlds. If your goal is to test ECL as a distinct *decision theory*, this is Core. If your goal is just "how to do good," this is irrelevant.

  ---

  ### The Impossibility Analysis

  You asked for the subsets that cannot be jointly satisfied. There is a fundamental tension in your spec, specifically regarding the **Bounded Agent** constraint versus the **Graining** and **Mechanism** requirements.

  **The Trilemma:**
  1.  **Boundedness:** The agent cannot inspect source code or know the exact causal structure (per your prompt).
  2.  **Graining:** The theory must prevent gerrymandering the reference class (Req 3).
  3.  **Mechanism:** The theory must distinguish logical correlation from common-cause correlation (Req 2).

  **The Conflict:**
  To satisfy **Graining** and **Mechanism**, the theory needs access to the *structure* of the decision procedure to verify that the correlation is due to logic, not a common cause, and to define the reference class objectively (e.g., "all agents running algorithm X").
  However, **Boundedness** explicitly denies the agent access to this structure. The agent only sees inputs and outputs (their own and estimated others).

  *   **If you prioritize Boundedness:** You are forced into **EDT (Evidential Decision Theory)**. You just condition on what you observe. But EDT fails **Mechanism** (it falls for the Smoking Lesion) and **Graining** (you can define the reference class however you like based on observed traits).
  *   **If you prioritize Mechanism/Graining:** You need **FDT/UDT (Functional/Updateless Decision Theory)**. But these require the agent to reason about their algorithm as an abstract object. If the agent *cannot* inspect their source code (per your prompt), they cannot run FDT. They can only approximate it.
  *   **The Impossibility:** There is no theory that guarantees **Mechanism** distinction and **Graining** precision for an agent who **cannot inspect their own source code**. You have to give up one. Either the agent is vulnerable to Smoking Lesion-style errors (because they can't verify the causal structure), or the theory is not action-guiding (because it requires computations the agent can't perform).

  **The Knockout Requirement:**
  **Requirement 3 (The Graining/Reference Class Principle).**
  This is the single hardest hurdle. Almost every candidate theory fails here.
  *   **EDT** fails because the agent can always condition on "I am an agent who cooperates."
  *   **CDT** fails because it sets the correlation to zero arbitrarily.
  *   **FDT/UDT** fails because there is no agreed-upon metric for "same algorithm." Is it source code identity? Behavioral identity? Functional output? If I rewrite my code in a different language, am I still in the reference class? If I add a comment? The "graining" of algorithmic identity is currently unsolved in a way that isn't gerrymanderable.

  **The "Taste" vs. "Real" Desiderata:**
  *   **Real Desiderata:** Threshold (1), Population Agnosticism (4), Degradation (5). If a theory doesn't have these, it doesn't work in the world you described.
  *   **Camp Bias (Taste):** Mechanism Distinction (2) and Non-Reduction (8).
      *   **Mechanism:** Causalists insist this is real; Evidentialists insist it's a confusion. For a *bounded* agent, this might be a distinction without a difference if they can't verify the mechanism.
      *   **Non-Reduction:** If ECL works perfectly in a large world, it *should* look like maximizing total utility. Demanding it *not* do so is demanding it be irrational for the sake of being distinct. This is often a philosophical turf war, not a practical requirement.

  ---

  ### Scorecard

  **1. Causal Decision Theory (CDT)**
  *   **Verdict:** Defect.
  *   **Performance:** Fails **Population Agnosticism** and **Threshold**. It treats the correlation as zero regardless of the world size. It satisfies **Mechanism** (by fiat) but fails the purpose of ECL entirely. It is safe from Smoking Lesion but leaves value on the table in large worlds.
  *   **Fit:** Poor. It denies the premise that evidential links can be actionable.

  **2. Evidential Decision Theory (EDT)**
  *   **Verdict:** Cooperate (usually).
  *   **Performance:** Passes **Threshold** and **Boundedness** (easy to compute). Fails **Mechanism** (falls for Smoking Lesion) and **Graining** (vulnerable to reference class manipulation). It recommends cooperation even when the correlation is due to a fixed trait that doesn't change with the decision.
  *   **Fit:** Moderate. It works for bounded agents but is theoretically unsound on the "why."

  **3. Functional/Updateless Decision Theory (FDT/UDT)**
  *   **Verdict:** Cooperate (if logical correlation is high).
  *   **Performance:** Passes **Mechanism** and **Threshold**. Struggles with **Boundedness**. It requires the agent to model itself as a computation. If the agent "can't inspect its own source code," FDT has no input to run on. It also lacks a solved **Graining** metric (when do two algorithms count as the same function?).
  *   **Fit:** High theoretically, Low practically (given your constraints).

  **4. Old-School Superrationality (Hofstadter)**
  *   **Verdict:** Cooperate.
  *   **Performance:** Passes **Population Agnosticism** (intuitively). Fails **Threshold** (often argues for cooperation regardless of payoffs) and **Degradation** (tends to be binary: rational agents cooperate or they don't). Lacks formal machinery for **Partial Similarity**.
  *   **Fit:** Low. It's a heuristic, not a decision theory spec.

  ### Summary for Your Argument

  If you want to settle the argument with your friend, focus on **Requirement 3 (Graining)** and the **Boundedness Constraint**.

  1.  **Ask your friend:** "How do I define the reference class without source code access?" If they say "by similarity," ask "Similar in what respect? Behavior? Code? Neurons?" If they can't define it without gerrymandering, their theory isn't action-guiding for a bounded agent.
  2.  **Ask yourself:** "Am I willing to accept Smoking Lesion vulnerabilities to get ECL?" If you use EDT to solve the boundedness problem, you become vulnerable to common-cause errors. If you use FDT to solve the mechanism problem, you violate the boundedness constraint.

  **The Hard Truth:** There is currently no decision theory that satisfies the **Mechanism**, **Graining**, and **Boundedness** requirements simultaneously. Your argument isn't about which theory wins; it's about which constraint you are willing to drop.
  *   Drop **Boundedness**? You get FDT (powerful, but requires god-like self-knowledge).
  *   Drop **Mechanism**? You get EDT (practical, but logically vulnerable).
  *   Drop **Graining**? You get hand-waving (uncheckable).

  For an *actual agent* (per your purpose), **EDT with a heuristic guardrail against obvious common causes** is the only implementable spec, even if it's theoretically "impure." FDT is the ideal, but it requires a level of self-transparency real agents don't have.
