answer: |-
  Your hypothesis is correct, but it requires a hierarchy. You have identified three distinct fault lines, but they are not co-equal. The stalemate persists not merely because these disagreements are traveling together, but because the Exclusion Argument functions as a *forced alignment* mechanism. It compels participants to adopt a specific configuration of these three views that many find metaphysically costly, yet they cannot abandon it without surrendering core commitments elsewhere in their philosophy.

  Here is the diagnosis of why the debate is stuck, an assessment of your test case, and a verdict on what constitutes progress.

  ### 1. Diagnosis: The Hierarchy of Disagreements

  Your threefold hypothesis is not a restatement of the problem; it is a map of the conceptual topology. However, one of these disagreements is doing the heavy lifting while the others act as reinforcing struts.

  **The Primary Engine: The Ontology of Causation (Axis 1)**
  The debate stalls primarily because the Exclusion Argument presupposes a univocal, worldly notion of causation (causation as a relation in nature, often cashed out as production or nomological sufficiency). If causation is a relation "out there" waiting to be counted, and the physical domain is complete, then there is literally no causal work left for the mental to do. This is the exclusionist's home turf.

  Most replies (grounding, interventionism, proportionality) attempt to shift the ontology of causation toward a feature of explanatory models or counterfactual structures. The stalemate occurs because the two sides are not arguing about the premises of the Exclusion Argument; they are arguing about the *category* of the conclusion. The exclusionist asks, "Is there a second causal *force*?" The non-reductive physicalist answers, "There is a second causal *explanation*." They talk past each other because the Exclusion Argument is framed to make the second answer look like an evasion of the first question.

  **The Reinforcing Struts: Completeness and Contribution (Axes 2 & 3)**
  The status of physical completeness (Axis 2) and the role of the mental (Axis 3) generally align to protect the primary ontological commitment.
  *   If you view causation as a worldly relation, you tend to view completeness as an empirical discovery (or a near-certain extrapolation) and the mental cause as needing to provide a distinct difference-making push.
  *   If you view causation as model-relative, you tend to view completeness as a methodological commitment (we *treat* physics as complete to do physics) and the mental cause as providing intelligibility or stability.

  The debate does not move because participants sense that conceding on Axis 1 (causation) requires surrendering their broader metaphysical project (e.g., robust realism or strict physicalism). Consequently, they dig in on Axes 2 and 3 to protect Axis 1. Your hypothesis is correct that these are distinct, but Axis 1 is the load-bearing wall. If you fix the ontology of causation, the other two largely fall into place.

  ### 2. Assessment: The Unstable Screener-Off Case

  Your "Unstable Screener-Off" case is coherent, and it cuts sharply against the standard Exclusionist position, provided one accepts an interventionist or pragmatist framework. However, it will not dissolve the stalemate on its own because it targets the *value* of causation rather than the *metaphysics* of causation.

  **Coherence**
  The case is a sophisticated variation on multiple realizability, but it improves on standard versions by focusing on *instability* rather than just heterogeneity. In neuroscience, this maps onto "degeneracy" or context-sensitive neural coding, where the same cognitive output is produced by different neural pathways depending on background conditions. It is empirically plausible.

  **Which Way It Cuts**
  This case drives a wedge between *causal sufficiency* and *causal specificity*.
  *   **For the Exclusionist:** The neural variable $N$ screens off $M$ in every token instance. Therefore, $N$ is the cause. The fact that $N$ varies across tokens is irrelevant to the token-causal claim. The Exclusionist can maintain that the "real" cause is the specific neural state at time $t$, and the mental state is merely a label we apply to a disjunction of these states.
  *   **For the Interventionist/Pragmatist:** Causation is about invariant generalizations useful for manipulation. If the neural realizer varies wildly ($N_1$ in context $A$, $N_2$ in context $B$), then citing $N$ offers no predictive or control power across contexts. Citing $M$ does. Therefore, $M$ is the *better* cause, even if $N$ is sufficient.

  **Does It Collapse?**
  The case collapses only if one strictly enforces a token-identity theory or insists that causal *oomph* must reside at the level of fundamental sufficiency. A hard exclusionist will argue that the "Unstable Screener" shows merely that mental properties are *epistemically* useful, not *ontologically* causal. They will concede that $M$ is a better *predictor*, but deny that this makes it a *cause* in the sense required by the Exclusion Argument (which demands ontological non-redundancy).

  Thus, the case successfully demonstrates that mental generalizations can be more *robust* than physical ones, but it fails to force the exclusionist to admit mental *causation* because the exclusionist defines causation as sufficiency, not robustness. It reinforces your diagnosis: the disagreement is about what causation *is* (Axis 1), not about the details of the scenario.

  ### 3. What Counts as Progress?

  Given this diagnosis, further iterations of the Exclusion Argument or new counter-examples (like the Unstable Screener) will not produce a verdict. The stalemate is a feature of the conceptual scheme, not a bug in the argumentation. Progress requires changing the question.

  **A Change of Question (Dissolution)**
  Progress would look like a widespread acceptance of *causal pluralism*. We must stop asking, "Do mental properties *really* cause physical effects?" and start asking, "In which explanatory contexts is the mental causal relation the appropriate tool?" If the seminar can move from seeking a verdict on the *existence* of mental causation to mapping the *conditions of adequacy* for causal claims at different levels, the exclusion problem dissolves. It becomes a category mistake to demand that mental causation satisfy the same criteria as particle collision.

  **An Empirical Finding (Grounding)**
  Alternatively, progress could come from empirical neuroscience validating the "Unstable Screener" scenario to such a degree that the "physical realizer" becomes scientifically useless. If it turns out that there is *no* stable neural level generalization for certain decisions, only mental-level ones, the methodological commitment to physical completeness (Axis 2) would come under immense pressure. If physics cannot provide a stable causal story for behavior, the demand that it "exclude" the mental loses its pragmatic force.

  **Why No Progress Should Be Expected**
  However, the most likely outcome is continued stalemate. This is because the Exclusion Argument serves a protective function for physicalism. To concede that mental causation is ontologically distinct (even if dependent) feels like a slide toward dualism for the physicalist. To concede that mental causation is merely explanatory feels like epiphenomenalism for the mentalist. Until one side is willing to bite a bullet that threatens their broader metaphysical identity, the debate will remain a standoff.

  **Recommendation for the Seminar**
  Stop trying to solve the Exclusion Argument. Instead, treat the Argument as a diagnostic tool. Have students identify which of your three axes their preferred solution modifies. If a student proposes a solution, ask: "Are you changing the definition of causation, the status of physics, or the role of the mental?" If they cannot specify which axis they are shifting, they are likely repeating the stalemate. If they can, they are making progress.
