      *   *Refining the Sentinel Issue:* Sentinels risk death. Kin selection explains this (Hamilton's rule). Colony selection also supports it (colonies with sentinels survive foxes better).

      *   *The Colleague's Mistake:* He is conflating the *level* (species vs colony vs kin) and the *mechanism* (effect vs cause). He is using "species" as a bucket for "everyone else around".

