  2.  **Deconstruct the Colleague's Claim:**
      *   Claim A: Sentinels are 'self-sacrificing for the good of the species'.
      *   Claim B: Smaller clutches 'evolved for the good of the species'.
      *   Justification: "that's just what natural selection does".

  3.  **Brainstorm Candidate Readings of "For the Good of the Species":**
      *   *Reading 1: Group Selection (Naive).* The trait exists because it benefits the species' survival, even if it costs the individual. (This is what the colleague seems to mean).
      *   *Reading 2: Kin Selection/Inclusive Fitness.* The trait benefits copies of the actor's genes in relatives. The "species" language is a loose shorthand for "kin group".
      *   *Reading 3: Multilevel Selection (Colony Level).* Selection acts between colonies. Colonies with sentinels/outbreeding controls survive longer than those without. The "species" is actually the "colony".
      *   *Reading 4: By-product/Spandrel.* The trait benefits the species, but didn't evolve *for* that reason. It evolved for individual/kin reasons, and the species benefit is a happy accident.
