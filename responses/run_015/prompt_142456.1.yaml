prompt: |-
  You're a professional philosopher of biology — someone who's actually followed the units-of-selection arguments rather than just skimmed a pop-science book — so please brainstorm a bit before you commit to anything, lay out all the candidate readings you can think of first and only then prune them, and write the whole thing in British English. Here's the situation. I write the text panels for a small natural-history museum, and I'm stuck on one about a colonial ground-nesting bird (I'll call it the sooty plover — the real species is under embargo till the paper's out, so please just take my numbers and facts as given; I'm not asking you to look anything up, and I don't want citations or a reading list, I can't get at any of that from here anyway). The behaviour: non-breeding birds act as sentinels, giving up roughly a fifth of their foraging time, they give loud alarm calls when a fox shows up, and a few of them do a broken-wing distraction display that pulls the predator towards themselves; on top of that, females in the denser colonies lay two eggs rather than three, even though three-egg clutches fledge more chicks. My colleague wants the panel to say the sentinels are 'self-sacrificing for the good of the species' and that the smaller clutches 'evolved for the good of the species' — and when I pushed back he ended the argument with something like 'look, everyone knows it's for the good of the species, that's just what natural selection does, nothing mysterious about it'. I'm pretty sure that little phrase is doing several different jobs at once and that at least one of them is false, but I can't get the seperate claims clear in my head. (Someone in my reading group muttered a bit about Hamilton's rule and about 'replicators' versus 'vehicles', which I didn't follow.)

  Some details I suspect matter for which version is actually on the table: colonies get founded by one or two pairs, so neighbours are fairly close kin — call it cousins-ish — though maybe one bird in ten each generation is an immigrant from another colony; colonies regularly get wiped out by storms or foxes and are re-founded by dispersers, average colony lifetime maybe eight years; and colonies where everyone lays three and nobody stands guard definately do crash — they strip out the food supply and the whole colony is gone within a couple of seasons, leaving no dispersers at all, so there really is something at the colony level that could be doing the selecting. On the other hand the population as a whole is forty-odd colonies across three river systems, the species has been around for ages, there are five species in the genus, only this one has sentinels, and it isn't obviously the most speciose or the longest-lived of them. What I want is a menu: spell out the different precise things 'for the good of the species' could be claiming here — something about which level the selection acts at, something about whose benefit the trait actually produces, something about what 'good' even means in this context (more chicks? lower extinction risk? a bigger population? lasting longer? keeping the food supply going?), something about whether the bird has to be aiming at or responding to any of that, and something about whether 'the species' is even the right-sized thing to be talking about rather than the colony or the local population — and for each reading tell me whether it's a platitude nobody would deny, whether it's substantive and defensible, whether it's actually false, and above all which ones would genuinely license my colleague's sentence and which ones would just mislead a nine-year-old reading a panel. Then, given all that, give me one or two sentences I could actually put on the panel that keep whatever is true in his slogan without the bit that's bullshit.
