  6.  **Drafting the Content (Iterative refinement):**

      *   *Reading 1: The 'Naive Group Selection' Reading.* Trait evolves because it helps species survive. *Verdict:* Generally false in modern theory unless specific conditions (like colony extinction) are met. Colleague likely means this. It's risky.
      *   *Reading 2: The 'Inclusive Fitness' Reading.* Trait helps copies of genes in relatives. "Species" is a misnomer for "kin". *Verdict:* Substantively defensible for sentinels (kinship), less so for clutch size (unless density-dependent).
      *   *Reading 3: The 'Colony-Level Selection' Reading.* Trait evolves because colonies with it outlast colonies without it. *Verdict:* Highly defensible given the "colonies crash" fact. But "species" is the wrong word; "colony" is the right unit.
