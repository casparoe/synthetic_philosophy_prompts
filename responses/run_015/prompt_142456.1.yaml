      *   **Colleague's Claim:** Sentinels are 'self-sacrificing for the good of the species' and smaller clutches 'evolved for the good of the species'. Justification: "everyone knows it's for the good of the species, that's just what natural selection does".
      *   **User's Suspicion:** The phrase is doing multiple jobs, some false. Needs clarification on levels of selection, benefit recipients, definition of 'good', intentionality, and the relevant unit (species vs. colony).
      *   **Key Details:** Colonies founded by 1-2 pairs (high kinship); some immigration (10%); colonies wiped out/re-founded (avg lifetime 8 years); 3-egg/no-guard colonies crash (local extinction); 40+ colonies total; genus has 5 species, only this one has sentinels.
      *   **Constraints:** British English, no citations/reading list, brainstorm first then prune, end with 1-2 sentences for the panel.
