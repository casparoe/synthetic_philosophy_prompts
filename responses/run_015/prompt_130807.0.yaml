  6.  **Final Review of the "Colleague's" position:** The colleague is essentially arguing for a *fictionalist* or *hard instrumentalist* reading of Dennett. Dennett explicitly argues against this in "Real Patterns." I need to make sure that distinction is sharp. The colleague thinks: Useful = Not Real. Dennett thinks: Useful + Robust + Projectible = Real.

      *(Self-Correction during drafting)*: Wait, does Dennett say beliefs *literally* exist? He says they exist as much as centers of gravity exist. They are abstract objects. The colleague says "only the physical stance describes what literally exists." This is the main point of contention. I must emphasize Dennett's rejection of "physicalism" that denies higher-level ontology.

      *(Refining the Thermostat point)*: The colleague says this shows the stance *cannot distinguish* genuine agents. Dennett would say: There is no metaphysical "genuine agent" substance to distinguish. There are just systems with more or less complex intentional patterns. The objection assumes a dualist or biological essentialist premise Dennett rejects.

      *(Refining the Reductionism point)*: The colleague asks if "complete physical computation eliminates the intentional pattern." This smuggles in the idea that the physical level is the *only* level of reality. Dennett's "non-competition" means the physical explanation doesn't *crowd out* the intentional explanation.

