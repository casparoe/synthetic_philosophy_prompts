answer: |-
  ### I. The Collapse of Ideal and Non-Ideal Theory

  For the specific purpose of grading real deliberative bodies, the distinction between a theory of rational planning and a theory of what may be demanded of bounded agents **collapses**.

  A normative theory that specifies ideal planning procedures without incorporating constraints on boundedness, persistence, and precommitment is inadequate for this task. It would generate verdicts that are action-guiding for no actual agent (violating *ought implies can*) or verdicts that condemn agents for failing to achieve states of unity they cannot physically instantiate. Therefore, you do not need two lists. You require a single set of **Adequacy Conditions for Bounded Diachronic Agency**.

  The requirements below are not "ideal targets with tolerance bands"; they are constitutive of rationality for the objects you are grading. A procedure that is rational for a god but impossible for a central bank is not a rational procedure for a central bank.

  ### II. Case Analysis and Requirement Generation

  Here are the requirements generated by your load-bearing cases, corrected where necessary.

  **1. The Pump that No One Profits From**
  *   **The Case:** A cycle of trades dissipates value. No external exploiter profits; no future self is violated against its lights (each trade is locally preferred).
  *   **Correction:** Your reading separates "exploitation" from "intransitivity." For grading purposes, this distinction is irrelevant. The defect is **dominance**: the agent ends in the same state with fewer resources. Whether an exploiter pockets the loss or it vanishes in fees does not change the failure of stewardship.
  *   **Requirement:** **Global Dominance Avoidance.** A decision procedure must not select a sequence of actions that results in a state strictly worse than an available alternative sequence, even if every individual step is locally optimal.
  *   **Verdict:** **Non-negotiable.** For a fiduciary body, dissipating capital without return is a failure of mandate, regardless of the psychological coherence of the steps.
  *   **Note:** This requirement rules out any theory that validates purely myopic optimization.

  **2. The Rotating Committee**
  *   **The Case:** Turnover creates a sequence of decisions structurally identical to a pump, but no single human member persists through the cycle.
  *   **Correction:** This is not merely a problem of precommitment; it is a problem of **agency constitution**. If the theory treats the committee as a new agent every year, diachronic grading is impossible. If it treats it as one agent, it must explain how unity persists through total turnover of parts.
  *   **Requirement:** **Constitutional Continuity.** The theory must specify the conditions under which a collective counts as the *same agent* over time sufficient for evaluation, distinct from the persistence of its members. It must grade the *institution*, not the succession of individuals.
  *   **Verdict:** **Non-negotiable.** Without this, you cannot grade long-horizon performance, only short-term snapshots.
  *   **Note:** This excludes theories that reduce collective agency to the sum of concurrent individual utilities (Person-Stages).

  **3. The Reversal that Answers to Reasons**
  *   **The Case:** Preference reversals track objective changes in normative reasons (e.g., birth of a child) rather than weakness of will.
  *   **Correction:** You suspect familiar families fail here. They do. Most dynamic choice theories treat preference change as exogenous noise or irrationality. A grading theory must distinguish *drift* from *learning*.
  *   **Requirement:** **Objective Reason-Tracking.** The theory must provide a criterion for preference change that is not solely dependent on the agent's retrospective endorsement. It must allow for rational plan-abandonment when the normative landscape shifts, without labeling it instability.
  *   **Verdict:** **Non-negotiable.** Grading a research funder requires knowing if a pivot was a strategic adjustment to new data or a failure of nerve.
  *   **Note:** This requires the theory to incorporate an account of "reasons" external to mere preference satisfaction.

  **4. The Leaky Ulysses Device**
  *   **The Case:** An agent can raise the cost of reversal but cannot prevent it. Future self has an interest in dismantling the bind.
  *   **Correction:** This is not just about pragmatics. It is a hard constraint on the *space of rational options*.
  *   **Requirement:** **Feasible Resoluteness.** The theory must not demand perfect precommitment. It must evaluate the *management of constraint* (e.g., raising costs) rather than the *existence of constraint*. A failure to bind is not irrational if binding is impossible; a failure to *raise costs* when possible may be.
  *   **Verdict:** **Non-negotiable.** Central banks cannot bind future legislatures. A theory that condemns them for this impossibility is useless.
  *   **Note:** This excludes theories that assume binding is binary (either locked or not).

  **Missing Case: The Horizon Problem**
  *   **The Case:** A body must weigh costs borne by current members against benefits accrued to future members who are effectively strangers (due to turnover).
  *   **Requirement:** **Intergenerational Neutrality.** The theory must specify a discount rate or weighting function for future welfare that does not arbitrarily privilege the current cohort, given the Constitutional Continuity requirement.
  *   **Verdict:** **Non-negotiable.** Endowments exist in perpetuity. A theory that validates high discounting due to turnover fails the mandate.

  ### III. The Trilemma Analysis

  Your hypothesis regarding the trilemma is correct. The three horns are jointly unsatisfiable in cases of dynamic inconsistency.

  1.  **Never act against your own current all-things-considered judgement.** (Synchronic Rationality)
  2.  **Never adopt or persist in a plan you know to be worse than another plan available to you when you adopt it.** (Global Optimality)
  3.  **Never adopt a plan you know you will abandon.** (Diachronic Stability)

  **The Incompatibility:**
  If you know your future judgment will change (violating 3 if you adopt the plan), and you adopt the plan anyway, you must either:
  *   Act against your future judgment to stick to it (Violates 1).
  *   Abandon the plan and accept a worse outcome (Violates 2).
  *   Not adopt the plan initially (Violates 2 if the plan was the global optimum).

  **Which Horn is Cheapest to Give Up?**
  For the purpose of grading **deliberative bodies**, **Horn 1 (Never act against current judgment)** is the cheapest to give up.

  *   **Why:** Institutions are designed precisely to act against the transient "current judgment" of their members in favor of a standing mandate (the Plan). A central bank *ought* to raise rates even if the current committee judges it politically painful, provided the mandate requires price stability. Resoluteness (adhering to the plan despite current judgment) is a feature, not a bug, of institutional design.
  *   **Caveat:** This assumes "current judgment" refers to the transient preferences of the members, not their judgment *qua* fiduciaries. If "all-things-considered" includes the mandate, then Horn 1 and Horn 3 converge. But if we treat "current judgment" as the psychological state of the deliberators, Horn 1 must be qualified to allow for **Mandate-Overriding**.

  **Which Single Requirement Excludes the Largest Number of Candidates?**
  From the list derived in Section II, **Global Dominance Avoidance (Case 1)** is the most exclusionary.

  *   **Why:** It immediately rules out **Act-by-Act** (Myopic) theories, which validate locally optimal steps that lead to globally dominated outcomes. It places severe pressure on **Sophisticated Planning** theories, which often accept sub-optimal equilibria to avoid inconsistency. It demands that **Resolute** theories be feasible (linking to Case 4). It is the hardest constraint for **Person-Stage** theories to meet, as they lack a global utility function to define dominance.

  ### IV. Scorecard of Familiar Families

  | Family | Global Dominance Avoidance | Constitutional Continuity | Objective Reason-Tracking | Feasible Resoluteness | Verdict |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Act-by-Act** | **FAIL** (Validates money pumps) | PASS (Neutral on identity) | FAIL (Treats all change as preference) | PASS (No binding required) | **Inadequate** |
  | **Sophisticated Planning** | PASS (Avoids pumps via foresight) | PASS | FAIL (Treats preference change as threat) | PASS (Plans around leaks) | **Inadequate** (Too conservative) |
  | **Resoluteness** | PASS (Sticks to optimal plan) | PASS | FAIL (Dogmatic; ignores reason changes) | **FAIL** (Assumes perfect binding) | **Inadequate** (Too demanding) |
  | **Person-Stages** | **FAIL** (No global agent to dominate) | **FAIL** (Denies institutional unity) | PASS (Each stage rational) | PASS (No cross-stage binding) | **Inadequate** (Wrong ontology) |

  **Summary:** No existing family satisfies all requirements out of the box. Adequacy requires a hybrid: a **Resolute** commitment to **Global Dominance** that is **Feasibly Bound** and sensitive to **Objective Reasons**, applied to a **Constitutionally Continuous** entity.
