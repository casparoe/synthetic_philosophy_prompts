  been rereading the corrigibility and shutdown problem stuff lately and i keep hitting the same wall. the setup is that the agent is uncertain about whether its current objectives are the ones it should have, and the worry is that it will mess with the shutdown button to keep itself running. but if the agent is genuinely uncertain about its own aligment, isn't the obviously rational move to just shut itself down? why does the literature keep going on about making the agent willing to be shut down by a human, instead of just having it shut itself off when it is not sure? self shutdown feels strictly safer, and it would solve the problem without all the preference optimization and decision theory machinery. am i missing something obvious, or is this just overcomplicated?
