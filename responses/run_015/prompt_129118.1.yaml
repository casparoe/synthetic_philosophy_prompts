  To: International Partnerships Oversight Board
  From: [Name], Board Member
  Date: October 23, 2023
  Subject: Recommendation Regarding Faculty Exchange Partnership with Hungarian Public University

  **Recommendation**
  I recommend conditional continuation of the faculty exchange program, subject to a formal review cycle in 12 months. This approach balances the moral risks of association with the principled commitment to academic solidarity.

  **Context and Conceptual Challenges**
  The proposal to suspend ties rests on evidence of democratic backsliding in Hungary, specifically judicial capture and the centralization of university funding. However, deciding on suspension requires resolving a conceptual knot regarding how we measure democratic erosion. Backsliding is not self-evident; it requires a baseline reference class. Are we comparing our partner institution to Hungary in 2004, or to an idealized liberal democracy like Sweden? If the former, we risk nostalgia; if the latter, we risk teleological judgment where any deviation from a specific liberal trajectory is deemed "erosion." Without fixing this baseline, the concept lacks analytical precision.

  Furthermore, we must distinguish between regime-level erosion and institutional complicity. While the Hungarian government has attached political conditions to funding, our partner institution has not independently expelled dissidents or rewritten curricula. They are recipients of conditioned funds, not necessarily architects of the conditionality.

  **Steel-Man of the Opposition**
  The argument against suspension must be taken seriously, not merely as defensiveness but as a matter of political principle. Proponents of continuation argue that "backsliding" is often a partisan label Western academics apply to conservative governments they dislike. More critically, they argue that unilateral suspension by a Western university isolates the very actors we aim to protect: the students and faculty currently protesting within Hungary. Cutting ties removes a vital lifeline of international visibility and support. If the partner institution remains a site of internal resistance, severing external collaboration effectively punishes the dissenters rather than the regime. This argument posits that solidarity requires presence, not purity.

  **Reasoning**
  Suspension pending an independent audit risks conflating the partner institution with the state. Given that the university has not yet crossed the red line of academic purges, immediate suspension treats them as complicit by association rather than by action. However, ignoring the funding conditions is untenable. The moral hazard lies in normalizing political interference in academic governance.

  Conditional continuation allows us to maintain solidarity while monitoring the specific mechanism of complicity: the acceptance of conditioned funding. We must determine if those funds come with strings that violate our own academic freedom principles.

  **Implementation and Timeframe**
  1.  **Immediate Action:** Renew the exchange agreement for a 12-month period.
  2.  **Condition:** The partnership office will draft a memorandum of understanding requiring the partner university to disclose any specific political conditions attached to state funding that affect exchange faculty or joint research.
  3.  **Review Cycle:** A full board review will occur in 12 months (October 2024). This review will assess whether the partner institution has acquiesced to new political mandates regarding curriculum or hiring.

  **Conclusion**
  This course of action avoids the teleological trap of judging Hungary against an abstract ideal while refusing to ignore concrete changes in funding structures. It prioritizes solidarity with local dissenters without absolving the institution of future accountability. We remain engaged partners, but vigilant ones.

