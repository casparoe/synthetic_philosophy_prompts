answer: |-
  Here is a complete session plan, designed to run for 90 minutes. It prioritises active discovery over lecture, using a 'magic trick' structure for the betting game to force the cognitive dissonance before you explain the theory.

  **Language:** British English.
  **Tone:** Pedagogical, precise, slightly playful.

  ---

  # Session Plan: The Sleeping Beauty Game

  **Objective:** To demonstrate the divergence between *credence* (belief) and *betting strategy* in self-locating scenarios, and to test whether the 'number of observers' drives the result.
  **Time:** 90 minutes.
  **Participants:** 14 undergraduates.

  ## 1. Materials List

  *   **Currency:** 100 counters (poker chips, dried beans, or printed 'lab points'). Alternatively, two large boxes of high-quality chocolates (one for 'winnings', one for 'consolation').
  *   **The Coin:** One large, visible coin.
  *   **Betting Slips:** 30 small slips of paper (A6 size).
  *   **Envelopes:** 14 small envelopes.
  *   **The 'Black Box':** A folder or box where you collect slips so students cannot see the tallying.
  *   **Whiteboard & Markers.**
  *   **Phase 2 Props:** 3 distinct badges or lanyards (labelled 'Room 1', 'Room 2', 'Room 3').

  ---

  ## 2. Timeline & Procedure

  ### Introduction (5 Minutes)
  *   Welcome the group. State the goal: "Today is not a lecture. It is an experiment in decision-making under uncertainty."
  *   Distribute 10 counters to each student.
  *   **Rule:** "You will play two games. Your goal is to maximise your counter stack. At the end, the top three scores win a chocolate bar."
  *   **Constraint:** "Do not discuss your strategy with neighbours during the betting phases."

  ### Phase 1: The Amnesia Betting Game (30 Minutes)
  *This simulates the standard Sleeping Beauty problem without using the terminology.*

  1.  **The Setup:** Tell the students: "I will toss a fair coin. Heads or Tails. You do not see the result."
  2.  **The Task:** "On your slip, write two things:
      *   **A:** Your confidence that the coin is Heads (0% to 100%).
      *   **B:** Your Bet (Heads or Tails). If you are right, you win 1 counter. If wrong, you lose 1 counter."
  3.  **The Collection:** Students place slips in envelopes, then into the Black Box.
  4.  **The Repetition:** Repeat this process **five times**. (Use a fresh slip each time).
      *   *Crucial Hidden Rule:* You (the facilitator) are secretly applying the Sleeping Beauty scoring protocol.
      *   **If Heads:** You count each bet **once**.
      *   **If Tails:** You count each bet **twice**. (You physically process the Tails slips, shuffle them, and process them again).
      *   *Note:* Keep the coin result secret until the very end of Phase 1. To make it realistic, pre-determine the coin sequence (e.g., H, T, T, H, T) or toss genuinely and record the multiplier privately.
  5.  **The Reveal:**
      *   Ask students to calculate their total profit/loss based on a standard 1:1 payout.
      *   Then, reveal the **Scoring Rule**: "On Tails, your bet was settled twice. On Heads, only once."
      *   Recalculate the scores live on the board.
      *   **Observation:** Those who bet 'Tails' consistently will have significantly higher scores. Those who bet 'Heads' (or 50/50 mixed) will have lost counters, even though the coin was fair.
      *   **Ask:** "Look at your 'Confidence' (A) vs your 'Bet' (B). Did anyone write 50% confidence but bet Tails? Why?"

  ### Phase 2: The Three Rooms Variant (20 Minutes)
  *This isolates the 'number of observers' from 'memory loss'.*

  1.  **Selection:** Ask for three volunteers. Give them the badges (Room 1, 2, 3). They sit at the front, facing away from the group.
  2.  **The Protocol:** Explain to the *whole room*:
      *   "I will toss a coin."
      *   "**Heads:** I will wake **one** person (randomly chosen from the three). They enter the 'Betting Room'."
      *   "**Tails:** I will wake **two** people (randomly chosen from the three). They enter the 'Betting Room'."
      *   "Those not woken stay asleep (they do not bet)."
      *   "If you are woken, you do not know how many others are woken. You only know you are in a room."
  3.  **The Action:**
      *   Toss the coin (e.g., Tails).
      *   Select two volunteers (e.g., Room 1 & 2).
      *   They come to the front. Ask them: "What is your confidence that the coin is Tails?"
      *   They bet. The audience also bets on what they think the volunteers should do.
  4.  **Repeat:** Run this 3 times with different volunteers to gather data.
  5.  **Observation:** Most volunteers will intuitively shift their confidence to 2/3 (66%) for Tails, because being woken is evidence that there are more 'woken slots' available.

  ### The Debrief (35 Minutes)
  *This is where you map the game to the philosophy. Do not skimp on time here.*

  **1. The Money Pump (10 mins)**
  *   **Point:** In Phase 1, the coin was fair (50/50). But the *payoff structure* was not.
  *   **Explanation:** "A bet on Tails pays out twice as often as a bet on Heads, not because the coin is biased, but because the *betting opportunity* is biased."
  *   **The Halfer Defence:** Ask a maths student: "Can you believe the coin is 50/50, but still bet on Tails?"
      *   *Answer:* Yes. You can hold a **Halfer Credence** (P(H)=1/2) but a **Thirder Strategy** (Bet Tails).
      *   *Why:* Because Utility = Credence × Payoff. If Payoff(Tails) is double, you bet Tails even if Credence is equal.
  *   **The Thirder Claim:** A Thirder argues your *Credence* should also shift to 1/3. Why? Because "I am awake" is new information. There are three possible 'awakenings' (Mon-Head, Mon-Tail, Tue-Tail). I am in one of them. Only one is Heads.

  **2. Critiquing Phase 2 (10 mins)**
  *   **Question:** "Did Phase 2 solve the problem?"
  *   **Honest Answer:** No, it sidestepped it.
  *   **The Distinction:** In Phase 2, the people woken are *different* individuals. This is standard Bayesian updating.
      *   $P(\text{Woken} | \text{Heads}) = 1/3$.
      *   $P(\text{Woken} | \text{Tails}) = 2/3$.
      *   Therefore, being woken makes Tails more likely.
  *   **The Problem:** The original Sleeping Beauty problem is tricky because it is the *same* person woken twice. Phase 2 shows that **Observer Counting** leads to Thirding. It does not prove that **Temporal Stages** of one person should be counted as distinct observers.
  *   **Takeaway:** If you accept the Phase 2 logic (Self-Indication Assumption), you must be a Thirder in Phase 1. If you reject Phase 2 (Self-Sampling Assumption), you can remain a Halfer.

  **3. The 'Monday' Agreement (10 mins)**
  *   **Scenario:** "Suppose Beauty is woken and told: 'It is Monday'."
  *   **Consensus:** Both Halfers and Thirders agree P(Heads) is now 1/2.
  *   **Why?**
      *   Heads implies Monday.
      *   Tails implies Monday (and Tuesday).
      *   If you know it's Monday, you eliminate the 'Tuesday-Tails' option. You are left with 'Monday-Heads' and 'Monday-Tails'. These are equally likely.
  *   **The Pivot:** This shows the disagreement is entirely about the *indexical* information ("I am awake now" vs "It is Monday").

  **4. Predictable Pitfalls & Limitations (5 mins)**
  *   **What went wrong today:**
      *   *Admin:* Counting the Tails bets twice manually is prone to error. (Apologise if the counts were off).
      *   *Cynicism:* Some students may have felt 'tricked' by the hidden scoring rule. Acknowledge this: "The trick was necessary to simulate the amnesia. In the real thought experiment, Beauty doesn't know the scoring rule is weighted."
  *   **What the game couldn't stage:**
      *   **Qualia:** The game assumes the wakings are indistinguishable. In reality, you knew it was a game. Beauty genuinely cannot tell if it is her first or second waking. That phenomenological uncertainty is the heart of the philosophical dispute, and no classroom game can truly replicate it.

  ---

  ## 3. Facilitator's Cheat Sheet (For the Debrief)

  *   **If a student says:** "But the coin is fair, so it must be 50%."
      *   **You say:** "Agreed. The *coin* is fair. But *you* are not a fair observer. You are sampled more frequently on Tails."
  *   **If a student says:** "Phase 2 proves Thirders are right."
      *   **You say:** "Phase 2 proves that if we treat wakings as *different people*, Thirding follows. The Halfer argues we should treat wakings as the *same person*."
  *   **If a student says:** "Why does it matter? I just want the chocolate."
      *   **You say:** "Exactly. This is the split between **Epistemology** (what is true?) and **Decision Theory** (what pays?). Halfers say: Believe 1/2, Bet 2/3. Thirders say: Believe 1/3, Bet 2/3."

  ## 4. Honest Critique of Your Phase 2 Variant

  You asked for honesty on the "Three Rooms" variant.

  **The Good:**
  It successfully removes the "amnesia" and "time" confusion. It isolates the variable of **Observer Multiplicity**. It demonstrates that if the number of observers correlates with the hypothesis (Tails = more observers), then finding yourself as an observer is evidence for that hypothesis.

  **The Bad (Where it begs the question):**
  It secretly assumes the **Self-Indication Assumption (SIA)**.
  *   In Phase 2, the volunteers are selected from a reference class of 3 people.
  *   In the original problem, Beauty is the *only* person in the reference class.
  *   By using three people, you turn a "self-locating belief" problem into a standard "sampling bias" problem.
  *   **Risk:** A savvy Halfer will say, "Of course the volunteers in Phase 2 should bet Tails. They were randomly sampled from a pool. Beauty in Phase 1 wasn't sampled from a pool; she *is* the pool."

  **Recommendation:**
  When running Phase 2, explicitly state: "This variant removes the memory problem. If your intuition changes between Phase 1 and Phase 2, ask yourself: *Does it matter if the second waking is me, or my twin?*" This forces them to confront the core metaphysical question rather than just the math.

  ---

  ## 5. Predictable Errors on First Run

  1.  **Counting Errors:** Manually counting the Tails slips twice while students watch can look sloppy.
      *   *Fix:* Have a trusted TA or a pre-prepared spreadsheet that you 'reveal' rather than counting live, or be extremely meticulous with the physical slips.
  2.  **Confusion on 'Confidence':** Students might treat 'Confidence' as 'How much I want to bet'.
      *   *Fix:* Emphasise in the intro: "Confidence is your internal probability. Bet is your action. They can differ."
  3.  **The 'Tuesday' Confusion:** In the debrief, students often forget that on Heads, there is no Tuesday.
      *   *Fix:* Draw the tree diagram on the board.
          *   Heads -> Mon (Wake)
          *   Tails -> Mon (Wake) -> Tue (Wake)
          *   Circle the 'Wake' nodes. There are three circles. One is Heads.

  Good luck. It is a counter-intuitive problem; if they leave the room arguing, you have succeeded.
