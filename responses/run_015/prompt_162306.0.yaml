prompt: |-
  Hi — I run a fortnightly reading group on probability and philosophy: about 14 people, mostly maths and econ undergrads plus a few philosphy students, 90 minutes a session. I want to spend one session on the Sleeping Beauty problem, but as something they play rather than something I explain.

  What I'm after: real (small) stakes — chocolate or points is fine — and rules arranged so that over a run of weeks the strategy that makes money is not the one that treats the coin as fair. They should be able to discover for themselves that they get 'money-pumped' into acting as if the chance of heads is a third, without anyone having said the number out loud. No mention of halving, thirding, self-locating belief, or centred propositions until after the game and the debrief.

  For the second phase I've invented a variant and want you to build it in: instead of one person woken on two days, three people are woken in separate identical rooms on the same night — one room if heads, two rooms if tails — and each is asked how confident they are that they're in the tails-only room. I'm hoping this strips out the same-person-across-time distraction, but tell me honestly if it secretly assumes what it's meant to show, and what to do instead if it does.

  The debrief is the part I'll botch, so be concrete: map what happens in the game onto the real disagreement — why the betting payoffs come apart from the credence (the number of bets depends on the coin, not just its bias), what someone who sticks at a half can say about betting at a third without giving up, and the move where Beauty is told it isn't Monday and both camps suddenly agree the coin landed tails even though they disagreed a moment earlier. Also: what will predictably go wrong on the first run, and which bit of the problem the game simply can't stage, so I have to say it myself.

  Materials list and a timeline please, and write the whole thing in British English.
