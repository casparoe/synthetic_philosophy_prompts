answer: |-
  # Q&A Prep Sheet: Psychiatric Epidemiology Seminar

  ## 1. Strategic Boundaries (First 5 Minutes)

  **What to Concede Immediately:**
  *   **Utility:** Concede that diagnostic categories are *useful*. Do not start by implying clinicians are "wrong" to use them. They work for treatment selection and billing.
  *   **Suffering:** Concede unequivocally that patient distress is real and independent of diagnosis. You are analyzing the *bucket*, not the *water*.
  *   **Rigor:** Concede that their measurement tools are statistically sound *for the purpose they were built*. You are not claiming their math is broken, but that the target is moving.

  **What to Absolutely Not Give Up:**
  *   **The Ontological Claim:** Do not retreat to "it's hard to measure." Hold the line that for interactive kinds, there is no "true prevalence" independent of the measurement practice.
  *   **The Normative Shift:** Do not let them frame "freezing the instrument" as a technical fix. It must remain a *policy decision* with trade-offs, not a discovery of truth.

  ## 2. The Single Point That Must Land
  **The Distinction Between Error and Constitution.**
  If the room interprets "looping" as "measurement error" or "bias," you lose. You need them to hear: *The measurement process is not capturing a static signal with noise; it is altering the signal.*
  *   **Phrase to use:** "This isn't noise around a stable mean. This is the mean moving because we measured it."
  *   **Why:** If it's noise, they can model it. If it's constitution, they have to acknowledge the limits of trend analysis.

  ## 3. The Dreaded Question
  **You suspect:** *"If there's no fact of the matter about the trend, are you saying the needs-assessment numbers my whole field produces are worthless?"*
  **The Reality:** That is the *economist's* fear. The **worse** question comes from the **intervention scientists**: *"If the target changes every time we measure it, how do we know if our interventions work?"*
  *   **Why it's worse:** It threatens the validity of RCTs and longitudinal studies, which is the core business of half the room.
  *   **Prep:** Be ready to say: "Interventions work on *presenting problems*, which are real. But generalizing efficacy across time periods requires assuming the condition is stable, which is exactly what I'm questioning."

  ---

  ## 4. The Seven Objections (Ordered by Damage)

  ### 1. The Measurement Invariance Objection
  **Who:** The Lead Quantitative Epidemiologist.
  **Phrasing:** "Isn't this just measurement non-invariance? We test for configural and metric invariance across time points. If the factor structure holds, we can compare means. Are you saying our invariance testing is failing, or that you're making a philosophical claim we can't test?"
  **Your Reply (2 mins):** "Invariance testing assumes there is a latent trait 'out there' that stays stable while our indicators might drift. My claim is that the latent trait *itself* is shifting because the indicators change the population. You can find metric invariance in the data, but if the people are adapting to the measure, the 'trait' you're measuring in 2024 isn't the same construct as 1994, even if the factor loadings match. You're measuring stability of the *tool*, I'm questioning stability of the *kind*."
  **Soft Spot:** You cannot empirically prove the trait has changed without relying on... more measurements. You have to lean on the theoretical mechanism (screening/apps) to make this plausible.

  ### 2. The Estimand Objection
  **Who:** The Senior Biostatistician.
  **Phrasing:** "Okay, but I need to run a model. What exactly is your estimand? If 'true prevalence' is undefined, what parameter are you proposing we estimate instead? If you don't have an alternative estimand, this is just criticism without a solution."
  **Your Reply (2 mins):** "The estimand is 'prevalence under a specific classification regime.' Not 'prevalence of ADHD,' but 'prevalence of ADHD *given DSM-5 criteria and current screening uptake*.' When you compare that to 1990, you aren't measuring disease trend; you're measuring the diffusion of a specific classification technology. The parameter is real, but it's relational, not absolute."
  **Soft Spot:** This complicates their meta-analyses. They will push back that this makes historical comparison impossible (which is your point, but they need to hear it as a feature, not a bug).

  ### 3. The Resource Allocation Objection
  **Who:** The Health Economist.
  **Phrasing:** "I use these trends to budget services for the next decade. If you tell me there's no fact of the matter about whether cases are rising, am I supposed to just guess? Are you saying my needs-assessment data is worthless?"
  **Your Reply (2 mins):** "Not worthless, but context-bound. Your data tells you the demand *generated by the current system*. That is exactly what you need to budget for services *today*. The risk is assuming that demand reflects a biological surge that requires a different kind of intervention. You can budget for the 'loop,' just don't mistake it for budgeting for a 'plague'."
  **Soft Spot:** They need stable long-term projections. Admitting the target moves makes long-term modeling very hard. You might have to concede that forecasting becomes scenario-planning, not extrapolation.

  ### 4. The Predictive Validity Objection
  **Who:** The Pragmatic Clinician-Researcher.
  **Phrasing:** "I don't care about the ontology. If my diagnosis predicts school failure, medication response, and adult outcomes, the category is valid. Why does it matter if the category co-evolves, as long as it predicts harm?"
  **Your Reply (2 mins):** "It matters because the prediction might be self-fulfilling. If the diagnosis triggers school accommodations that change the outcome, the validity is real but circular. If you treat the prediction as proof of a stable underlying disease, you might miss that the *label itself* is the active ingredient in the outcome you're predicting."
  **Soft Spot:** This can sound like you're saying "outcomes don't matter." Emphasize that outcomes matter *more* if we understand how the label produces them.

  ### 5. The Algorithmic Feedback Objection
  **Who:** The Data Scientist / ML Researcher.
  **Phrasing:** "This sounds like dataset shift or feedback loops in deployed prediction models. We handle that with retraining schedules and hold-out sets. Why do we need a philosophy of science lecture when we have engineering controls?"
  **Your Reply (2 mins):** "Engineering controls try to stabilize the model against a changing world. I'm saying the model *is part of the world* it's modeling. When you retrain on data your previous model influenced, you aren't correcting drift; you're accelerating the loop. The 'engineering fix' assumes a ground truth to return to. In psychiatry, the ground truth is what's being updated."
  **Soft Spot:** They will argue they can isolate "objective" variables (e.g., hospitalization) that are less susceptible to looping. You need to be ready to argue that even hospitalization is a social decision.

  ### 6. The "Real Suffering" Objection
  **Who:** The Senior Clinician (Protective).
  **Phrasing:** "I see kids who are struggling regardless of what the DSM says. Are you suggesting their distress is just a product of our screening tools? Because that feels like gaslighting."
  **Your Reply (2 mins):** "Absolutely not. The distress is real. The *sorting* of that distress into a specific medical category is what changes. A child struggled in 1950 and in 2024. But in 2024, that struggle triggers a specific pathway of medication, school policy, and identity. The looping affects the *trajectory* of the suffering, not the existence of it."
  **Soft Spot:** If you sound too abstract, you lose empathy. Keep the focus on the *pathway*, not the *pain*.

  ### 7. The "Freeze the Instrument" Objection
  **Who:** The Methodologist (Trying to find a fix).
  **Phrasing:** "You said the only way to compare is to freeze the instrument. So let's do that. We keep the criteria fixed. Problem solved, right? Why is that not a discovery of the true trend?"
  **Your Reply (2 mins):** "It solves comparability, but it creates obsolescence. If you freeze the tool while the world changes, you're measuring something less and less relevant to current clinical reality. It's not a discovery of truth; it's a decision to prioritize historical comparison over current validity. That's a normative trade-off, not a methodological victory."
  **Soft Spot:** They may decide they *prefer* obsolescence to incomparability. You can't prove them wrong, only clarify the cost.
