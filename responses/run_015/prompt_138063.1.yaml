answer: |-
  **MEMORANDUM**

  **TO:** All Enrolled Students
  **FROM:** Office of Pedagogical Surprise
  **SUBJECT:** Protocol 7.4.b: Administrative Resolution of Examination Timing

  **1. What is the definition of a "Surprise Examination"?**
  Per University Statute 99, the examination will occur on day $d$ of the assessment week. The condition for validity is as follows: At 21:00 hours on day $d-1$, no enrolled student possesses knowledge that the examination occurs on day $d$. Please note the critical distinction between *unannounced* (administrative silence) and *unpredictable* (student epistemic state). The Office manages the latter. Silence is insufficient; ignorance is mandatory.

  **2. How does this resolve the backwards-induction objection?**
  Students often argue that if the exam has not occurred by Thursday, Friday becomes known, violating the condition. The Office maintains that Clause 7.4.b creates an epistemic blindspot. The proposition "No student knows it is Friday" is such that anyone who came to know it was satisfied would thereby make it unsatisfied. Consequently, any student reasoning process that concludes "It must be Friday" is administratively void. You cannot know the condition is met, because knowing it unmeets it. Therefore, Friday remains a valid surprise vector. The logic holds because the University defines validity ex-post.

  **3. What if I simply guess the day with high confidence?**
  Knowledge is not equivalent to credence. You may hold a 98% subjective probability regarding the date without triggering a compliance violation. The Office maintains an Official Surprise Threshold (OST). Currently, the OST is set at 99.9% certainty coupled with adequate justification. Be advised: during the pilot program, several students achieved credence levels exceeding the OST via process of elimination. This was deemed embarrassing for all parties. Proctors were forced to invalidate exams because the students *knew* too much. Please maintain reasonable doubt for the dignity of the faculty.

  **4. What is the required doxastic state on Thursday evening?**
  At 21:00 on Thursday, enrolled students should experience uncertainty. If you feel certainty, you are in violation of the surprise clause. If you feel confusion, you are compliant. If you feel certain that you are confused, consult Academic Counseling. The Office cannot mandate feelings, but we mandate the absence of knowledge. Specifically, you must not be able to rule out Friday. If you find yourself thinking, "It hasn't happened yet, so it must be tomorrow," you must immediately interrupt this thought pattern to preserve the condition.

  **5. Why was the student betting market shut down?**
  The informal prediction market operated by the Student Union constituted a compliance violation. Market prices aggregated private information into common knowledge. When the Friday contract traded at parity, the student body collectively *knew* the date. By shutting down the market, the Office deleted the public record of this aggregation. Without the market data, students revert to prior ignorance. Thus, closing the market restores the surprise it destroyed. Information destruction is a valid pedagogical tool.

  **6. Does this apply to other University events?**
  Yes. Effective immediately, Clause 7.4.b extends to fire drills and faculty office hours. You will not know when the building is burning, nor when the professor is in. This ensures maximum pedagogical friction and aligns emergency safety with assessment protocols.

  **Signed,**

  **Dr. Aris Thorne**
  **Director, Office of Pedagogical Surprise**
