answer: |-
  Diagnosis: **Premise (7) is the failure point.**

  Here is the breakdown of why this step fails, why it initially looked sound, the role of the equivocation you suspected, and the price of the alternatives.

  ### 1. The Diagnosis: Why Premise (7) Fails
  **Premise (7):** *"If corruption is defined universally… applying the definition requires knowing which gains count as corrupting 'private' ones, which in turn requires knowing the local constitutive norms."*

  **Why it looks sound:**
  This premise relies on a strong hermeneutic intuition: meaning is context-dependent. If "corruption" means "subversion of purpose" (per Premise 1), and "purpose" is locally defined (per Premise 2), then it follows that you cannot identify corruption without deep local knowledge. It feels intellectually honest to admit that an outsider cannot judge an insider's normative world.

  **Why it fails:**
  Premise (7) asserts a **false necessity**. It claims that applying a universal standard *requires* full knowledge of local constitutive norms. This ignores the possibility of a **"thin" universalism** based on functional minima rather than thick normative alignment.

  You can identify corruption without resolving the entire local moral universe. For example, even in a clientelist society where kinship obligations are constitutive (preserving Premise 3), there is often a distinguishable line between *systemic reciprocity* (giving jobs to kin to maintain social order) and *predatory extraction* (stealing from the kin network for personal luxury). A universal standard can target the latter (predation) without needing to adjudicate the legitimacy of the former (reciprocity). Premise (7) falsely assumes that because *some* local knowledge is needed, *total* normative immersion is required to make *any* judgment.

  By rejecting (7), you block the slide into the dilemma in (8). You can argue that universal law operates like a "minimum floor": it does not need to define the *ideal* local bureaucracy (which varies), only the *threshold* of abuse that undermines state capacity regardless of local norms.

  ### 2. The Equivocation: "Private Interest" vs. "Private Loyalty"
  You asked if there is a hidden equivocation between **(1)** and **(6)**. **Yes, but it supports the error in (7) rather than causing the conclusion directly.**

  *   **In (1):** "Private interest" implies a separation between the *office* and the *self*. It suggests personal enrichment distinct from the role.
  *   **In (6):** "Private loyalty" is contrasted with "political loyalty." Here, "private" means "particularistic group" (kin) vs. "general public" (constituents).

  The argument slips between these meanings. In Western frameworks (5), serving a "particularistic group" (constituents) is "public" because the group is the sovereign. In clientelist frameworks (2), serving a "particularistic group" (kin) is "public" because the kin *are* the sovereign.
  Premise (7) exploits this slip. It assumes that because we can't agree on what counts as "public" (the equivocation), we can't identify "private" gain without local norms. Rejecting (7) allows you to bypass this semantic trap by focusing on **harm** rather than **loyalty**. You don't need to define "public" perfectly to identify when an official is looting the treasury to the point of state collapse.

  ### 3. Pricing the Alternatives
  You asked to weigh the costs of rejecting (2), (6), or (7). Here is the price list:

  **Option A: Reject Premise (2)**
  *   *The Move:* Assert that kin obligations *always* compete with, rather than constitute, the bureaucratic role.
  *   *The Cost:* **Sociological Blindness.** You save universalism by fiat, but you render your theory empirically false in many contexts. You effectively argue that any society where kinship matters is "failed" by definition. This makes your anti-corruption framework imperialistic, as it demands that other societies restructure their social ontology to match Western Weberian ideals before they can be judged "clean."
  *   *Verdict:* Too high a cost. It violates your constraint to preserve (3) and undermines the seminar's credibility.

  **Option B: Reject Premise (6)**
  *   *The Move:* Assert that Western frameworks *do* have a principled, non-circular criterion for distinguishing political loyalty from private loyalty.
  *   *The Cost:* **Intellectual Dishonesty.** As you noted in (5), Western politics relies on earmarking and patronage. Claiming there is a clean, non-parochial line between "constituent service" and "corruption" is easily debunked by comparative politics. Defending this requires begging the question (i.e., "It's not corruption because it's legal here").
  *   *Verdict:* Too high a cost. It violates your constraint to preserve (6) and weakens your philosophical position.

  **Option C: Reject Premise (7) (Recommended)**
  *   *The Move:* Assert that a universal definition can be applied using a **functional threshold** (e.g., "does this practice undermine the state's capacity to provide basic security/welfare?") without requiring full ethnographic knowledge of local constitutive norms.
  *   *The Cost:* **Theoretical Complexity.** You surrender the simplicity of a checklist approach. You must defend a "thin" theory of the state that works across cultures. You admit that universal law is not an algorithm but a **standard** (like "reasonableness" in tort law) that requires contextual judgment but is not relative.
  *   *Verdict:* **Lowest Cost.** This preserves your sociological insights (2 & 3) and your critique of Western hypocrisy (6), but it saves the coherence of global anti-corruption efforts by reframing them as setting a *minimum floor* rather than a *uniform ceiling*.

  ### 4. Recommendation for Revision
  To fix the argument while keeping your core insights, modify the transition from (7) to (8).

  **Replace (7) with:**
  *(7*) While applying a universal definition requires sensitivity to local norms, it does not require full normative alignment; functional thresholds (e.g., systemic predation vs. reciprocal obligation) can distinguish corruption across contexts.*

  **Replace (8) with:**
  *(8*) Therefore, universal application risks misclassification if it ignores local norms, but it avoids relativism if it targets practices that undermine the minimal functional capacity of the state.*

  **Resulting Conclusion (9*):**
  *(9*) Therefore, universal anti-corruption law is coherent only if it functions as a minimum threshold of state functionality rather than a mandate for Western-style impartiality.*

  This allows you to keep the critical bite of your seminar paper without dissolving the possibility of reform.
