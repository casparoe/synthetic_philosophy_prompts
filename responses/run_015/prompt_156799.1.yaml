answer: |-
  You have correctly identified that the standard "acts vs. omissions" or "killing vs. letting die" distinction is metaphysically porous. If you analyze causation strictly through counterfactual dependence (i.e., "but for the doctor's action/inaction, would the patient be alive?"), the distinction often collapses. In both cases, the doctor's behavior is a necessary condition for the death occurring at time *t*.

  However, the institutional practice isn't trying to map onto a pure metaphysics of causation. It is mapping onto a **metaphysics of intrusion and baseline restoration**, coupled with a **role-based deontology**.

  Here is the reconstruction of the implicit theory holding this protocol together, stripped of the usual bioethics euphemisms.

  ### 1. The Metaphysics of the Baseline (Counterfactual Dependence)
  The system does not treat all causes equally. It distinguishes between **interrupting a causal chain** and **initiating a causal chain**.

  *   **Withdrawing Treatment:** The implicit model views the disease as the primary causal agent of death. The ventilator or feeding tube is viewed as an *external intrusion* that temporarily blocks the disease's causal pathway. When the doctor withdraws treatment, they are not causing death; they are *ceasing to block* the pre-existing fatal cause. The counterfactual baseline is: "If the doctor had never shown up, the patient would be dead." Therefore, removing the intervention restores the world to its natural counterfactual state.
  *   **Active Euthanasia:** The injection is viewed as a *new intrusion*. The disease is no longer the sole sufficient cause; the toxin is. The counterfactual baseline is: "If the doctor had never shown up, the patient would (presumably) still be alive." Here, the doctor initiates a causal chain that did not exist prior to their intervention.

  **The Commitment:** The system presupposes that **omissions are morally neutral regarding the natural baseline, whereas actions are morally loaded regarding the introduction of new forces.** This is why negligence is punishable: negligence is a failure to uphold a *duty* to maintain the baseline of care, whereas withdrawing futile treatment is a recognition that the baseline (death) can no longer be blocked.

  ### 2. Causal Pathway Ownership
  You mentioned "causal pathway ownership," and this is actually the strongest explanatory variable. The medical institution is designed to manage **iatrogenic risk**.

  *   **Withdrawal:** The "ownership" of the death remains with the pathology. The death certificate lists the underlying disease (e.g., ALS, metastatic cancer). The doctor is a witness to the pathology running its course.
  *   **Injection:** The "ownership" of the death transfers to the physician. The death certificate must list the agent of death (e.g., barbiturate toxicity). The doctor becomes the proximate cause.

  **The Commitment:** The institution requires a clean separation between **healing agents** and **lethal agents**. If the same actor (the physician) is authorized to wield both healing and lethal causality within the same relational context, it creates an epistemic hazard for the patient. The patient must be able to model the doctor as *structurally incapable* of harming them intentionally. If the doctor can kill, the patient's trust calibration requires a constant, exhausting verification of intent. The prohibition on active euthanasia is a **pre-commitment strategy** to keep the doctor's causal power bounded to "life-supporting" interventions only.

  ### 3. The Telos of the Role (Social Ontology)
  This is the weirdest part, but the most functional. The practice presupposes that **moral permissions are attached to social roles, not just agents.**

  In a pure autonomy framework, the patient's will is sovereign. If they want X, and the doctor can do X, it should be permissible. But the medical system operates on a **role morality**. The "Doctor" is a fictional legal/social entity with specific boundaries.
  *   The "Doctor" entity is authorized to invade the body *only* to restore function or alleviate symptoms.
  *   The "Doctor" entity is *not* authorized to invade the body to terminate function, even if requested.

  **The Commitment:** The patient does not own the doctor's agency. They can refuse the doctor's agency (withdrawal), but they cannot commandeer the doctor's agency for purposes outside the role's definition (injection). This is why a patient can demand *no* ventilation, but cannot demand *a lethal injection*. One is a refusal of service; the other is a demand for a service that violates the vendor's charter.

  ### 4. What Breaks If You Switch to Pure Autonomy/Outcomes?
  If you replaced this implicit theory with a framework that cares only about autonomy and net suffering reduction, the following institutional mechanisms would fracture:

  **A. The Death Certificate and Epidemiology**
  Currently, death certificates track pathology. If active euthanasia is normalized as equivalent to withdrawal, cause-of-death data becomes noisy. Did the patient die of heart failure, or did they die because the protocol allowed termination at stage 3 heart failure? This corrupts the feedback loop medical systems use to evaluate treatment efficacy. You lose the ability to distinguish between *treatment failure* and *termination decision*.

  **B. The "Nothing More We Can Do" Script**
  Currently, end-of-life counseling relies on a specific narrative: "We are moving from curative intent to palliative intent." This allows the family to grieve the disease.
  If killing is equivalent to letting die, the script shifts to: "We are moving from curative intent to termination intent."
  This changes the **locus of guilt**. In the current model, the family consents to *let nature take its course*. In the autonomy model, the family consents to *execute the patient*. Even with consent, this imposes a heavier psychological burden on the surrogates, potentially increasing litigation and decisional regret. The current system offloads the moral weight of the death onto the disease; the autonomy model places it on the decision-makers.

  **C. Nursing and Palliative Protocols**
  Nursing documentation is built around the axis of *comfort vs. cure*.
  *   **Current:** Morphine is titrated for dyspnea (double effect). The intent is documented as symptom management.
  *   **New:** Morphine is titrated for cessation of breath. The intent is documented as termination.
  This requires a bifurcation in drug supply chains, documentation codes, and potentially the licensing of the staff administering the dose. You effectively create two classes of medical staff: Healers and Technicians of Death. Most hospital systems cannot sustain this duality without role confusion affecting standard care (e.g., will a nurse hesitate to push a necessary high-dose opioid for pain fearing it looks like euthanasia?).

  **D. The Schelling Point of Trust**
  The current distinction acts as a **Schelling Point** for trust. It is a bright line that is easy to verify. "Did the doctor inject a lethal substance?" is a binary, forensically verifiable fact. "Did the doctor withdraw the ventilator with the secret hope the patient would die?" is a mental state that is hard to prove.
  By banning the injection, the system removes the need to litigate the doctor's *internal intent* during withdrawal. As long as they don't inject, they are safe. If you allow injection, every withdrawal of life support becomes suspicious. *Why did you withdraw the vent on Tuesday instead of Friday? Were you trying to free up the bed? Were you trying to kill them?*
  The bright line protects the doctor from suspicion of motive in the gray areas of withdrawal.

  ### Summary of the Implicit Theory
  The practice is not philosophically coherent if you view morality as solely a function of **consequences** or **atomic causation**.

  However, it *is* coherent if you view it as a **system stability protocol**. It presupposes:
  1.  **Causal Baselines:** Restoring a fatal baseline is distinct from creating a new fatal cause.
  2.  **Role Boundaries:** Professional authority is limited by the *telos* of the profession, not just client consent.
  3.  **Epistemic Hygiene:** Keeping "killing" off the table protects the trust required for "healing" to function, and prevents the corruption of mortality data.
  4.  **Litigation Defense:** A bright line on *method* protects doctors from having their *intentions* scrutinized in every end-of-life case.

  The "weird commitment" you sensed is that the medical system values **categorical clarity of the physician's role** higher than **consistency in moral metaphysics**. It sacrifices philosophical purity to maintain a social technology (the trusted healer) that functions better when it is forbidden from becoming a social technology of death.
