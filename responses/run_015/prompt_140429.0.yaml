answer: |-
  You have described something real, subtle, and genuinely difficult to pin down. You are right to feel that the standard labels don't quite fit. Your intuition is sharper than the jargon usually allows for.

  The short answer is: **No, there is not one single common word for this.**

  However, there are two concepts that, when layered together, describe exactly what you are seeing. In economics and philosophy, this is called **Endogenous Preference Formation**. In sociology and science studies, the mechanism is called **Performativity**.

  If I were to give it the plain-English name you asked for, I would call it **"Constitutive Tracking."**

  Here is the breakdown of what that is, why it isn't the other things you mentioned, and where the line between "good" and "bad" actually sits.

  ### 1. What is it? (The Definition)

  **Constitutive Tracking** happens when a measure doesn't just *record* reality, but helps *build* the reality it is recording, by reshaping what the measurer values.

  *   **Standard View:** I want $X$. I measure $X$ with $Y$. $Y$ tracks $X$.
  *   **Goodhart's View:** I target $Y$. $Y$ stops tracking $X$. (The map breaks).
  *   **Your View:** I target $Y$. $Y$ still tracks $X$. But now, I want $Y$ more than I wanted $X$. (The territory moved to match the map).

  In your running example: The app (measure) didn't break. The miles (reality) are still miles. But the *value* you place on those miles shifted from "means to fitness/joy" to "completion of the metric." The metric didn't corrupt the data; it colonized your motivation.

  ### 2. How it differs from the neighbors

  You asked for the edges. Here is how Constitutive Tracking stops and the other concepts begin.

  **Vs. Goodhart's Law**
  *   **Goodhart:** The measure becomes useless. (e.g., A factory is measured by weight of nails produced. They produce one giant, useless nail. The number goes up, value goes down.)
  *   **Constitutive Tracking:** The measure remains useful. (e.g., You run the miles. They are still real miles. The fitness is still real fitness.)
  *   **The Edge:** Does the metric still correlate with the original goal? If yes, it's not Goodhart's.

  **Vs. Metric-Gaming (Cheating)**
  *   **Gaming:** You fake the input. (e.g., Shaking the phone to fake steps.)
  *   **Constitutive Tracking:** You do the work. (e.g., You actually run the four short runs.)
  *   **The Edge:** Is the effort real? If yes, it's not gaming.

  **Vs. Wireheading / Reward Tampering**
  *   **Wireheading:** You bypass the world to stimulate the reward signal directly. (e.g., An AI rewriting its own code to get maximum points without doing the task, or a rat stimulating its pleasure center.)
  *   **Constitutive Tracking:** You still engage with the world. You still feel the pavement, the wind, the fatigue.
  *   **The Edge:** Is the feedback loop from the real world intact? If yes, it's not wireheading.

  **Vs. Adaptive Preferences (Sour Grapes)**
  *   **Sour Grapes:** "I cannot have the grapes, so I decide they are sour." This is a defense mechanism against *impossibility*.
  *   **Constitutive Tracking:** "I *could* run the long run, but I no longer find it valuable compared to the metric." This is a shift in *valuation*, not a rationalization of failure.
  *   **The Edge:** Are you barred from the original goal? If you could do it but simply don't want to anymore because the metric changed your taste, it's not Sour Grapes.

  ### 3. Is it always bad? (The Normative Question)

  This is the most important part. Your piano example is the key.

  Constitutive Tracking is **neutral**. It is a mechanism of learning and socialization. It becomes "corruption" only when it reduces your **agency** or **resilience**.

  **The Good Version (Scaffolding):**
  The piano kid uses the sticker chart (metric) to build a habit. Eventually, the metric is removed, and they still play because they love the music. The metric acted as a scaffold; it built a structure that stands on its own.
  *   *Test:* If you take the app away, do you still run? If yes, the preference change was healthy internalization.

  **The Bad Version (Atrophy):**
  The teacher focuses on test scores. The metric remains. But if the tests were abolished tomorrow, she would feel lost and unable to teach. The metric didn't build a structure; it replaced the foundation.
  *   *Test:* If you take the app away, do you feel running is pointless? If yes, the preference change was a narrowing of vision.

  **The Difference:**
  The difference is **Reflective Endorsement**.
  *   **Healthy:** You look at the change and say, "I am glad the metric helped me see I prefer consistency over intensity."
  *   **Unhealthy:** You look at the change and say, "I don't know why I'm doing this, but I need to hit the number."

  ### 4. The Boundary Case (Starting with the Metric)

  You asked: *If I'd started running and tracking at the same time... is that still this phenomenon or is it just learning what I like?*

  This is the hardest edge case. Here is the line:

  **It is just "Learning" if the metric is transparent.**
  If you use the app purely as a diary ("How did I feel this week?"), and your preferences shift based on your bodily feedback, that is learning.

  **It is "Constitutive Tracking" if the metric dictates the shape.**
  If you structure your runs specifically to optimize the *graph* (e.g., "I won't run today because it would mess up my weekly average"), then it is Constitutive Tracking, even if you started both at the same time.

  **The Litmus Test:**
  Ask yourself: **"Am I training the algorithm, or is it training me?"**
  *   If you skip a run because your body hurts, you are training the algorithm (teaching it reality).
  *   If you run when your body hurts because you don't want to break a streak, the algorithm is training you.

  ### Summary

  You have identified a specific configuration where **the map changes the territory without becoming a bad map.**

  *   **Formal Name:** Endogenous Preference Formation via Metric Performativity.
  *   **Proposed Name:** Constitutive Tracking.
  *   **The Mechanism:** The metric shifts from being a *thermometer* (reading the temperature) to a *thermostat* (setting the temperature).
  *   **The Danger:** It is not lying (Goodhart's). It is not cheating (Gaming). It is **narrowing**. It is the risk that you will only value the parts of life that fit on the graph.

  Your friend the teacher is in the danger zone (her definition of "teaching" has narrowed to "testing"). You might be in the safe zone (you found a sustainable way to run), *provided* that if the app broke tomorrow, you'd still lace up your shoes.

  That is the edge. If the number goes to zero, does the value go to zero? If yes, you've been tracked. If no, you've just learned.
