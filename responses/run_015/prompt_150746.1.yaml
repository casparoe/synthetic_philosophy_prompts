answer: |-
  1. So, in ICU triage you've got mutually exclusive claims—Patient A gets the bed, Patient B doesn't. Logically, those can't both be true. How does the seven-fold predication (*saptabhaṅgī*) actually stop this from collapsing into straight contradiction when the stakes are life or death?

  2. Follow-up on that: if you say they're just speaking from different standpoints (*nayas*), what stops that being a cop-out? Like, at some point you have to pick one truth to act on, otherwise you're just describing the conflict rather than solving it.

  3. Take a case where a family insists on treatment the medical team says is harmful. If *anekāntavāda* says both views are partly true, does that just freeze action? How do you move from "both are valid" to "we're turning the machine off" without betraying the doctrine?

  4. A standard objection is that many-sidedness makes moral progress impossible. If every view is already partly correct, why bother changing laws or norms? What's the drive to improve if the old way was already "true" in some sense?

  5. Say your reply is that progress is just shifting emphasis among the sides. Isn't that just moving deckchairs? How do you show that one emphasis is *better* than another, not just different, without smuggling in a single-truth standard?

  6. Can the doctrine even accommodate a genuinely new ethical framework that hasn't been articulated before? Or is it just a fancy way of cataloguing perspectives we already have, meaning it's always playing catch-up?

  7. You've talked about understanding multiple sides, but clinicians need a decision mechanism. Does *anekāntavāda* give us an algorithm for who gets the ventilator, or does it just tell us to feel bad about whichever choice we make?

  8. Finally, does holding all these contradictory truths at once burn out the clinician? Or does acknowledging the partial truth of the losing side actually make the guilt easier to carry after a hard call?
