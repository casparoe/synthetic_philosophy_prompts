      *   *Benacerraf's Conclusion:* He did *not* argue math is invented/certain. He argued that if we want truth, we lose knowledge; if we want knowledge, we lose truth (or change the semantics). He leaned towards rejecting the existence of numbers as objects (structuralism/fictionalism), not necessarily "invention" in the sense of arbitrary rules.
