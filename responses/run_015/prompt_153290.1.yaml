answer: |-
  **Setting:** *A quiet corner of the convention center, away from the main hall of the Global Ethics Summit. Mara and Elias stand by a window overlooking the rain-slicked city.*

  **Mara:** Did you catch Ambassador Vance's press conference this morning? The way she chastised the Indonesian delegation for their new coal subsidies was striking. Not for its content, but for its audacity.

  **Elias:** Audacity, or necessity? She's under pressure to show her bloc is taking a hard line on carbon intensity.

  **Mara:** It's not hard line, Elias; it's structurally hypocritical. While she was speaking, her own government's development bank was finalizing a package of export financing for a gas pipeline project in East Africa. The architecture of her own state's economy is causally entangled in the very fossil fuel expansion she's condemning. How can she claim the standing to blame? Her moral address is compromised. She is speaking from inside the machinery of the harm.

  **Elias:** You're conflating the agent with the apparatus. Vance is personally innocent of the bank's ledger. But more importantly, you're treating standing as a function of moral purity. I see it as a function of causal authority and remedial capacity. Vance occupies a role that gives her the leverage to actually change the conditions she's discussing. If we deny her standing because her institution is complicit, we silence the only agents positioned to fix the structural problem.

  **Mara:** But standing isn't just about who has the keys to the lock. It's about the normative relationship between the blamer and the blamed. Blame is a demand for accountability that presupposes the blamer respects the norms they are invoking. When Vance ignores her own government's financing, she isn't invoking a shared norm; she's wielding power. She treats the developing nation as a moral agent subject to rules, while her own state operates as an exception. That disconnect collapses the distinction between personal and collective agency. She *is* the state in that room. To grant her standing is to accept a separation that doesn't exist in the causal architecture of the harm.

  **Elias:** I agree that the separation is porous, but I disagree that it collapses entirely. Consider the alternative. If we say Vance has no standing, the conversation stops. The coal subsidies remain, and the export financing remains. By distinguishing her institutional mandate—negotiating emissions reductions—from the bank's mandate—financing development—we allow for a division of labor. Her role inherits the complicity, yes, but that inheritance should shape the *content* of her blame, not cancel her *entitlement* to deliver it. She can say, "This coal is harmful," without first resolving the bank's portfolio.

  **Mara:** You're appealing to remedial capacity again. You're saying her ability to fix the problem outweighs the hypocrisy of her position. But consider the uptake. When the Indonesian delegation hears her, they don't hear a partner in mitigation. They hear a competitor protecting market share under the guise of morality. If the blame is perceived as strategic maneuvering rather than moral address, it fails to generate the obligation you hope it will. Efficacy isn't just about signing treaties; it's about sustaining the trust required to enforce them. If her standing is tainted, the treaty is built on sand.

  **Elias:** That's a fair point about trust. But you're assuming the taint is indelible. I'm arguing that causal entanglement doesn't disqualify the speaker; it obligates them to speak reflexively. If Vance acknowledges the bank's financing while condemning the coal, she bridges the gap. She admits the entanglement.

  **Mara:** If she does that, she's no longer blaming them for a wrong she is exempt from. She's engaging in mutual critique. But in the press conference, she didn't do that. She spoke as if her hands were clean.

  **Elias:** Precisely. And my claim is that she *had* the standing to speak, even if she exercised it poorly. The role confers the entitlement. The failure was in the rhetoric, not the authority. If we say she lacks standing, we imply she should have remained silent. I can't accept that. We need her voice, even if it comes from a compromised institution.

  **Mara:** I need to pause there. You're pressing me on the consequence of silence. If I insist that structural hypocrisy voids standing entirely, I am effectively arguing that agents embedded in harmful systems must remain silent until the system is purged. That seems to grant the structure total victory—it immunizes the system from internal critique by disqualifying its representatives.

  **Elias:** Exactly.

  **Mara:** So, I need to revise my view. It's not that standing is *voided* by structural complicity. Rather, standing is *conditional* on the mode of address. If Vance speaks as a pure outsider, her standing is indeed undermined because she denies the causal reality. But if she speaks as a implicated participant—acknowledging that her state finances fossil fuels while demanding the coal subsidies stop—she reclaims standing through honesty. The standing doesn't come from the role alone, nor from purity, but from the alignment of her speech with the causal truth.

  **Elias:** That moves us closer. But does it solve the problem of the institution? Even if Vance acknowledges the bank's financing, she cannot stop it unilaterally. She is still causally entangled. Does your revised view allow her to blame the developing nation while her own state continues the behavior, provided she admits it?

  **Mara:** It allows her to call for a mutual cessation. But if she continues to blame *them* specifically for a harm *we* are actively funding, the admission becomes a mere footnote to coercion. So, perhaps standing isn't binary. It's scalar. Her complicity reduces the weight her blame carries, requiring greater remedial action on her part to restore equilibrium.

  **Elias:** I can accept that scaling. It addresses my concern about silencing while respecting your concern about entanglement. However, I still worry that demanding this level of reflexive acknowledgment in every instance creates a paralysis of analysis. If every negotiator must preface every critique with a confession of their state's sins, the diplomatic function grinds to a halt.

  **Mara:** And if they don't, the diplomatic function becomes a tool of domination.

  **Elias:** So we are left with the tension. Vance has the capacity to act, which suggests standing. But she carries the weight of her state's carbon, which suggests compromise.

  **Mara:** Perhaps the standing exists, but it is "provisional." It holds only so long as the speaker works to disentangle the institution they represent. If the bank's financing continues indefinitely, her standing to blame coal elsewhere eventually evaporates, regardless of her acknowledgments.

  **Elias:** Provisional standing based on active remediation. That tracks with my view on capacity, but adds your temporal constraint. It doesn't tell us if Vance met that standard this morning, though.

  **Mara:** No. It only gives us the metric to judge her.

  **Elias:** *Looks out at the rain.* Then we agree on the metric, if not the measurement.

  **Mara:** For now. Though I suspect you weigh the capacity heavier than I do.

  **Elias:** And I suspect you weigh the integrity heavier than I do. But at least we aren't talking past each other anymore.

  **Mara:** No. We're just disagreeing about the price of speaking.

  **Elias:** Which is, presumably, the point of the summit.

  *They fall silent, watching the negotiators file back into the main hall below.*
