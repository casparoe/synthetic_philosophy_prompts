      *   **Specific Case:** A senior climate negotiator (wealthy nation) condemns a developing country's coal subsidies, while her own government provides comparable state-backed export financing for fossil fuels via its development bank.
      *   **Requirements:**
          *   Direct engagement (respond to actual points, not just talk past each other).
          *   Mara must address Elias's "remedial capacity" argument.
