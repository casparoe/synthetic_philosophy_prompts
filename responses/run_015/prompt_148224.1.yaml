      *   *Resolution:* Qualify (2). The standard applies *within* a framework. Or, qualify (4). Cultural differences are variations in *focus*, not incompatible logic.
      *   *Better Resolution:* Revise (6). If (6) allows too much disagreement, it kills (2). If (6) is limited to "minor" works or "borderline" cases, (2) holds for masterpieces.
      *   *Best Single Change:* **Revise (5).** Make the "objective status" conditional on *shared framework* or acknowledge that cross-cultural agreement is a discovery of *anthropological* fact, not *aesthetic* truth.
      *   *Wait, let's look closer at (2) vs (4).* Hume's standard relies on human nature being uniform. (4) challenges the uniformity of human nature regarding aesthetics.
