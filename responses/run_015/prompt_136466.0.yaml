prompt: |-
  I'm presenting a paper next Tuesday to a philosophy-of-technology seminar that's mostly Heideggerians and a couple Feenberg-style critical theorists, plus one computing historian who actually read von Neumann's automata lectures from the late forties. My thesis is a bit out there: I'm arguing that von Neumann's universal constructor shouldn't be treated as just a biological analogy, but as describing a seperate kind of technological persistence — I'm calling it "mechanical inheritance" — where self-replicating systems maintain a survival condition that is structurally independent of both human intent and evolutionary selection. Basically, technology can "survive" in a non-metaphorical sense once the replication loop closes, and I want to defend this without sounding like I'm just rebranding old determinism. I was discussing this with a friend over coffee and she said I'd get torn apart on anachronism and hidden normativity, so I need proper prep.

  Can you draft my Q&A prep sheet? I want the objections ordered by how much damage they'll do in this room, phrased exactly like that audience would phrase them — not generic AI-risk stuff, but the kind of thing a Heideggerian or a historian of computing would actually say, with their vocabulary intact. For each objection, give me a reply I can deliver in about two minutes and flag honestly where that reply is softest. Tell me what I should concede upfront so I don't look defensive, and include the one question I'm dreading — probably something about whether I'm smuggling technological determinism back in through a side door — with a strategy for not collapsing on the spot. Please write your answer in British English; I keep getting American spellings and it throws me off.
