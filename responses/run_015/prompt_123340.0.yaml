      *   *Groundhog Day Mechanics:* Time resets at 6:00 AM. Physical state resets. Neural state (Phil's brain) *seems* to retain memory (otherwise he wouldn't learn). So, the substrate *partially* persists (memory traces) but physically resets (injuries heal, skills practiced... wait, do skills persist? Yes, he plays piano the next day. So neural plasticity persists despite physical reset).
      *   *The Conflict:* Hofstadter says the self is an illusion generated by the substrate's complexity. In *Groundhog Day*, the substrate is wiped, but the "I" remains. This suggests the "I" is *more* real than the substrate, which contradicts Hofstadter's materialist monism. Or, it suggests the "I" is a ghost haunting a resetting machine.
      *   *Suicide:* If the body dies but the "I" wakes up, the "I" is decoupled from the specific physical instantiation. This looks like dualism, which Hofstadter fights against.
