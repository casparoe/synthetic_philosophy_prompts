      *   **Suicide and Causal Nullification:** Analyze the suicide montage (truck, cliff). Hofstadter: Self-preservation is a primary output of the self-symbol. If the self wills death, and death happens, causal closure holds. If the self wills death, and *reset* happens, causal closure is broken. The "I" becomes a spectator to its own body's destruction. This is the "Ghost in the Machine" problem Hofstadter tries to solve, re-introduced by the film.
      *   **Skills and the Phantom Substrate:** Piano and Ice Sculpting. He learns. This means neural pathways *do* persist across the reset (otherwise he couldn't play). So the substrate *is* accumulating changes, just invisibly. This is a "compressed" strange loop. The downward causation works (he decides to sculpt), but the social feedback (upward causation from others) is nullified until the final day. This creates a solipsistic loop.
