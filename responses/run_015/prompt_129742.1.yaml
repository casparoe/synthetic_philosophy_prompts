answer: |-
  **Mark: 14/20**

  **Margin Comments**

  *   **Para 1:** Good start. You correctly identify the task: distinguishing Q from V and determining the argument's scope. Accurate characterization of the anti-presentist position.
  *   **Para 2, Sentence 3:** *"Moral standards just are concepts."* This is the crux of your essay, but it's asserted rather than argued. Having the *concept* of 'slavery' (Q) is distinct from applying the *normative judgment* that slavery is wrong (V). You need to bridge this is/ought gap.
  *   **Para 2, Sentence 4:** *"Translation is itself a present act."* True, but does translation entail condemnation? I can translate a past agent's justification without endorsing it. You are conflating *understanding* via present concepts with *judging* via present norms.
  *   **Para 3, Sentence 2:** *"Withholding a verdict is itself a verdict."* This is a rhetorical slide. Even if silence has political effects (toleration), that doesn't mean the *methodological* attempt to bracket judgment is incoherent. You move from "it's hard to do" to "it's impossible/contradictory."
  *   **Para 3, Sentence 3:** *"Choice between 'colonised' and 'settled' already evaluates."* Strong point. This supports Q-presentism (language loads the dice) but doesn't necessarily prove V-presentism (that we are right to condemn them for it).
  *   **Para 4:** Excellent point on the indeterminacy of past standards. This is your strongest argument: if "their standards" are inaccessible or contradictory, the anti-presentist rule is indeed unactionable. This supports the conclusion that *we* must choose, though not necessarily that our choice must be *moral condemnation*.

  **General Verdict & Key Moves**

  This is a clear, well-structured essay that directly answers the prompt's administrative requirements (distinguishing Q and V). You write with confidence and identify a genuine problem for the anti-presentist (the indeterminacy of past norms). However, the mark is capped at 14 because your assessment of the argument's validity rests on a category error regarding moral standards.

  **1. The Conflation of Concepts and Norms (The Deduction)**
  You claim the argument works for V-presentism because "moral standards just are concepts." This is the weakest philosophical move in the paper. P1 establishes that we use present *epistemic* tools (concepts, evidence). The conclusion claims we must use present *moral* standards. You bridge this by saying concepts *are* standards.
  *   **Why this costs marks:** In philosophy of history, the distinction between *explaining* why an agent acted (using our concepts to understand their reasons) and *evaluating* whether they were right to act is fundamental. You can use the present concept "human rights" to describe a past agent's violation of them without necessarily claiming the past agent was *blameworthy* for not knowing that concept. You treat the inevitability of present concepts (Q) as proof of the inevitability of present blame (V). That inference is not valid without further argument about the nature of moral responsibility.

  **2. The "No Fallback" Move (The Pragmatic Claim)**
  You argue that because historians cannot be perfectly neutral (source selection implies evaluation), they *must* assess using present standards.
  *   **Why this costs marks:** This conflates *descriptive inevitability* with *normative coherence*. Even if it is psychologically impossible to be fully neutral, the anti-presentist claim is usually normative: we *ought not* to condemn, even if our language is loaded. Your argument shows that Q-presentism is unavoidable (we always write from now), but it doesn't prove V-presentism is *justified*, only that it is *unavoidable*. The prompt asks if the anti-presentist demand is *incoherent*. Showing it is *difficult* to practice is not the same as showing it is *incoherent*.

  **3. The Indeterminacy Point (The Strength)**
  Your final paragraph is the strongest part of the essay. Pointing out that "the standards of their own time" are often non-existent or contested undermines the anti-presentist's positive proposal.
  *   **Why this saves the grade:** This shows independent critical engagement. Even if your defense of V-presentism is shaky, your critique of the *alternative* is robust. It demonstrates you understand the practical constraints of historical research, which balances the theoretical overreach in the second paragraph.

  **Summary**
  You have written a persuasive polemic, but a slightly imprecise philosophical assessment. You successfully defend the argument's conclusion regarding Q-presentism and the impossibility of neutral description. You are less successful in proving that moral condemnation (V) follows logically from conceptual framework (Q). You treat a controversial meta-ethical claim ("standards are concepts") as a premise. For a 20-point short paper, this distinction is the difference between a 14 and an 18.
