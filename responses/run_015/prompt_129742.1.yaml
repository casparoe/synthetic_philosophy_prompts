      *   Student says: "Moral standards just are concepts."
      *   Critique: This is the weak point. I will penalize here.
      *   Mark: 13/20. It's a solid pass, good structure, but the core philosophical move is asserted rather than argued.

      *   *Self-Correction on Mark:* 13 might be too harsh if the seminar leans towards postmodernism where this distinction is blurred. But standard analytic philosophy of history usually distinguishes *understanding* from *judging*. Let's settle on 14/20. It acknowledges the strength of the writing and the source bias point, but penalizes the conceptual conflation.

  8.  **Formatting the Output:**
      *   Start with the Mark.
      *   Provide the "Margin Comments" (bullet points corresponding to paragraphs/claims).
      *   Provide the "General Verdict" (the 2-3 moves that matter).
