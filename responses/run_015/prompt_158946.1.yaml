answer: |-
  ### Phase 1: Brainstorming H.'s Implicit Rules

  Looking at the track record, H. is not running a single, monolithic algorithm. She is balancing competing constraints. Here are four candidate rules that could generate her specific pattern of verdicts:

  **Candidate 1: The "Institutional Viability" Rule.**
  *   *Principle:* A maxim fails if its universalization would make the relevant social practice or institution impossible to sustain.
  *   *Fits:* Case 1 (Promises die), Case 5 (Truth-telling dies), Case 3 & 4 (Human agency/community viability threatened).
  *   *Strain:* It struggles with Cases 8 & 9. If everyone bought exploitative goods or drove cars, the *environment* or *labor market* might collapse or become horrific, yet she rules them permissible. She seems to think individual causal impotence saves you in aggregative harms, but not in constitutive practices.

  **Candidate 2: The "Causal Individualism" Rule.**
  *   *Principle:* You are only responsible for the actual consequences your specific act causes. If your act changes nothing, it is permissible.
  *   *Fits:* Case 8 (Labor), Case 9 (Emissions), Case 6 (Polite lies cause no deception).
  *   *Strain:* It completely contradicts Cases 3 & 4. My single act of developing a talent or helping a person in need changes very little in the grand scheme, yet she calls them duties. It also contradicts Case 1; one false promise doesn't destroy the whole practice of promising, yet it fails.

  **Candidate 3: The "Deception and Consent" Boundary.**
  *   *Principle:* The core test is whether you are undermining someone's rational agency through deception or coercion.
  *   *Fits:* Case 1 (Deception), Case 5 (Deception), Case 6 (No deception = OK), Case 7 (No consent = OK).
  *   *Strain:* It doesn't explain Cases 3 & 4. You can be entirely honest about never developing your talents or never helping anyone. No one is deceived. Yet she rules them failures. This suggests duties exist beyond non-deception.

  **Candidate 4: The "No Tailoring" Prohibition.**
  *   *Principle:* You cannot save a maxim from failure by narrowing its scope based on the desired outcome or contingency.
  *   *Fits:* Case 10 (Paternalistic lying fails despite "good outcome" clause).
  *   *Strain:* It needs to be combined with another rule to explain *why* the base maxim fails. It acts as a constraint on how we formulate the test, not the test itself.

  ### Phase 2: Selecting the Rule

  I am going to stick my neck out. H. is running a hybrid of **Candidate 1 (Institutional Viability)** and **Candidate 4 (No Tailoring)**, with a specific carve-out for **Aggregative vs. Constitutive** harms.

  Here is the reconstruction: H. distinguishes between *constitutive practices* (promising, truth-telling, academic community) and *aggregative markets* (consumer goods, emissions).
  *   In **constitutive practices**, your participation is defined by your willingness to uphold the conditions of the practice. Causal impotence is irrelevant because the duty is to *will the end*, not just produce the effect (hence Cases 3 & 4).
  *   In **aggregative markets**, individual causal impact is the metric (hence Cases 8 & 9).
  *   Crucially, following Case 10, she refuses to allow "emergency escape clauses" in maxims. You cannot universalize a rule that says "I will follow the norm unless it becomes inconvenient or critical." That turns a duty into a hypothetical imperative.

  ### Phase 3: The Verdict on Your Maxim

  **Verdict: H. will rule that your maxim Fails.**

  Here is the breakdown of why, mapping your case to her precedents:

  **1. The "Causal Impotence" Defense (Cases 8 & 9 vs. 3 & 4)**
  You are relying on the logic of Cases 8 and 9: *My one purchase/ride changes nothing, so I am excused.* You are arguing that your extra service wouldn't change the department's outcome, so you are free to withhold it.
  H. will reject this. She treats Cases 8 and 9 as external market interactions where the harm is aggregative. She treats Cases 3 and 4 (Talents/Benevolence) as duties to support the conditions of rational agency. A department is not a market; it is a cooperative practice of agency. Like Cases 3 and 4, the duty is to *will the flourishing of the community*, not just to ensure it doesn't crash. The fact that your individual contribution is small is irrelevant to the duty of virtue. You must will the end (a functioning, thriving department), and willing the end requires willing the necessary means (contributing labor beyond the bare minimum).

  **2. The "Openness" Defense (Case 6)**
  You argue: *I'm entirely open about it.* You are hoping for the Case 6 verdict (Polite lies are OK because no one is deceived).
  H. will distinguish this. Case 6 involved social conventions where the "deception" was mutually understood as politeness. Departmental service is not a social convention; it is the infrastructure of your colleagues' agency. Being "open" about free-riding does not cure the contradiction. In Case 1 (False Promise), even if you were open about not intending to repay, the act would still fail because it treats the practice of promising as a mere tool. Similarly, treating the department as a resource you drain without replenishing treats your colleagues as mere means, regardless of your honesty.

  **3. The "Collapse Clause" (Case 10)**
  You add: *If the department ever got to the point where it genuinely couldn't function without me, I'd step in.*
  This is the fatal flaw. This is structurally identical to Case 10 (*"I'll lie whenever the truth would be devastating"*). H. explicitly ruled there that you cannot narrow a maxim to escape a duty based on outcomes. By adding this clause, you are admitting that the duty is contingent on the *consequences* of your non-action, rather than the *principle* of cooperation.
  If universalized, your maxim becomes: *"Everyone does the minimum and only steps in when collapse is imminent."*
  If everyone acts on this, the "extra labor" that prevents imminent collapse never happens. The collapse becomes inevitable. The clause renders the maxim self-defeating in universalization. H. will see this as a "trick" to avoid the Contradiction in Conception, which Case 10 forbids.

  **4. The Closest Analog**
  The closest analog is **Case 3 (Never developing talents)** combined with **Case 10**.
  Like Case 3, this is an imperfect duty (you have discretion on *how* to serve, but not *whether* to will the end). Like Case 10, you are trying to write an exception into the maxim that swallows the rule.
  It is *not* like Cases 8 & 9, because you are an internal member of the practice, not an external consumer.

  ### Phase 4: The Test Case

  To settle whether H. is truly running this "Constitutive vs. Aggregative" reconstruction, or if she is secretly a Causal Individualist (which would save your maxim), you need to present her with a case that isolates the "Conditional Rescue" clause in a public good context.

  **Proposed Maxim for H:**
  > "I will use the public park and enjoy its maintenance, but I will never pick up trash or report vandalism, because my individual effort makes no difference to the park's quality—unless the park is scheduled to be shut down due to disrepair, in which case I will volunteer to save it."

  **Why this settles it:**
  *   **If she says Permissible:** She is prioritizing Cases 8 & 9 (Causal Impotence). Your departmental maxim is likely safe.
  *   **If she says Fails:** She is prioritizing Cases 3 & 4 (Duty to Support Ends) and Case 10 (No Tailoring). Your departmental maxim is dead.

  **My Prediction:** She will say **Fails**.
  The "unless it shuts down" clause is the same "devastating truth" loophole from Case 10. It admits you are only willing the existence of the park (or department) conditionally, based on your personal utility, rather than as an end in itself.

  ### Summary of Commitments

  If I am right about H.'s reasoning, accepting her verdict commits you to the following principle: **Membership in a cooperative practice generates a duty to contribute to its flourishing that exceeds contractual minimums, and this duty cannot be negated by individual causal impotence or saved by conditional 'emergency' clauses.**

  If you want to argue against her, you cannot appeal to consequences (she ignores them in Case 5). You cannot appeal to honesty (she ignores it in Case 3). You must argue that the Department is *not* a constitutive practice of agency but a mere aggregative market of labor (like Case 8). Good luck with that.
