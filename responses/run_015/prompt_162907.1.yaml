answer: |-
  **1. Essay Question**

  Consider an economy where automation is total: machines build machines without direct production workers. Living labour is restricted to remote design, maintenance, and the education reproducing this workforce. Crucially, because automation spreads into machine-making sectors themselves, the unit value of the fixed capital stock falls even as its physical productivity and technical mass rise.

  Contrast Marx's diagnosis in the *Grundrisse* 'Fragment on Machines' with the tendency of the rate of profit to fall in *Capital* Volume III. In this specific economy, does automation squeeze profit *within* the value framework, or does it dissolve the measure of value itself? What happens to exploitation and the wage relation in each account? Evaluate the defence that the 'collective labourer' relocates value-creation to research and care rather than eliminating it. Dismiss the claim that the *Grundrisse* is merely an immature draft irrelevant to the mature theory. Finally, commit to which diagnosis explains the crisis tendencies of this economy better, and specify one observable economic pattern that would falsify your chosen diagnosis. Argue; do not summarize.

  ***

  **2. Model Answer**

  Marx offers two distinct logics of crisis regarding automation. In *Capital* Volume III, the threat is internal to the value form: the tendency of the rate of profit to fall (TRPF). In the *Grundrisse* 'Fragment on Machines', the threat is external to the value form: the dissolution of labour time as the measure of wealth. In the hypothetical economy described, distinguishing these logics is vital because the cheapening of constant capital affects them differently.

  Under the Volume III diagnosis, crisis arises from the rising organic composition of capital. Even if the unit value of machinery falls due to automation in machine-making sectors, the technical mass of constant capital grows faster than the variable capital deployed. The rate of profit falls because surplus value is extracted from a shrinking mass of living labour relative to the total capital advanced. Crucially, the value framework remains intact. Exploitation persists; indeed, it may intensify among the remaining design and maintenance workers to compensate for the falling rate. The wage relation holds because capital still requires living labour to valorize value, however small that labour force becomes. Crisis here is a squeeze on profitability, not the end of value production.

  Conversely, the *Grundrisse* diagnosis suggests that when machinery becomes the direct force of production, wealth creation depends on the general state of science and the social combination of knowledge, not immediate labour time. In this fully automated economy, direct labour time ceases to be the measure of wealth produced. If value is congealed labour time, and labour time is marginal to production, value itself becomes an inadequate category. Here, the crisis is not a falling rate of profit but the collapse of the basis for appropriation. Capitalism appropriates surplus labour; if surplus labour approaches zero, the wage relation dissolves not because workers are freed, but because capital can no longer function as capital. The contradiction is not between capital and labour within production, but between the productive forces (automation) and the relations of production (value).

  Defenders of the Volume III view often invoke the 'collective labourer'. They argue that value creation migrates to researchers, educators, and maintenance staff, preserving the total social labour input. This move technically rescues the labour theory of value but concedes the *Grundrisse* point politically. If value creation is relocated to a tiny fraction of the population while the majority are excluded from direct production, the link between work and income is severed socially, even if it holds mathematically. It relocates the difficulty from the production of value to the distribution of claims on wealth, anticipating the breakdown diagnosis. Furthermore, dismissing the *Grundrisse* as an immature draft is theoretically untenable. The 'Fragment' identifies the historical limit of the law of value that Volume III presupposes. Volume III calculates the movement of profit assuming value exists; the *Grundrisse* asks what happens when the substance of value evaporates. The draft status does not negate the logical priority of the value-form critique.

  I commit to the *Grundrisse* diagnosis as explaining the crisis tendencies of this specific economy better. The Volume III model assumes a continuum where labour remains essential; the described case posits a discontinuity where labour is marginal. The TRPF explains the transition to automation, but the 'Fragment' explains the terminal point where automation renders labour incidental.

  The observable pattern that would falsify this commitment is the sustained stability of profit rates correlated with capital mass rather than labour input. If, in this economy, we observe that prices and profits remain stable and positive despite near-zero direct labour input—implying value is being generated by machinery itself or purely through circulation—then the labour theory of value (and thus the *Grundrisse* critique) fails. If, however, we observe systemic deflation, the inability to realize prices, and the collapse of wage relations despite high physical output, the *Grundrisse* diagnosis is confirmed. The Volume III view would be falsified if profit rates rose despite a rising technical composition of capital without counteracting factors, but the *Grundrisse* view is falsified if value proves durable without labour.

  ***

  **3. Marking Scheme**

  **Total Marks: 25**

  **1. Distinction of Logics (5 marks)**
  *   **Must Hit:** Clearly distinguishes Volume III (internal squeeze/profit rate fall within value framework) from *Grundrisse* (dissolution of value measure/labour time ceases to be measure of wealth).
  *   **Common Error:** Treating both as simply "machines cause crisis" or conflating the falling rate of profit with the breakdown of value measurement.

  **2. Application to Case Constraints (5 marks)**
  *   **Must Hit:** Addresses the specific condition that constant capital cheapens (unit value falls) while technical mass rises, and explains how this impacts each diagnosis (counteracting factor in Vol III vs. evidence of value irrelevance in *Grundrisse*).
  *   **Common Error:** Ignoring the cheapening of constant capital or assuming it automatically solves the TRPF without argument.

  **3. Evaluation of 'Collective Labourer' (5 marks) — *A/B Separator***
  *   **Must Hit:** Argues that relocating labour to research/care saves the theory mathematically but concedes the political/structural breakdown (relocates the difficulty to distribution/exclusion).
  *   **Common Error:** Accepting the 'collective labourer' defence uncritically as a full rescue of the Volume III view, or dismissing it without explaining where the difficulty is relocated.

  **4. Handling 'Draft vs. Mature' Objection (5 marks)**
  *   **Must Hit:** Rejects the chronological dismissal by arguing for the theoretical validity of the *Grundrisse* regarding the limits of the value form (logical priority vs. chronological maturity).
  *   **Common Error:** Accepting the prompt's deflationary move or dismissing the *Grundrisse* solely based on its publication status rather than theoretical content.

  **5. Commitment and Falsification (5 marks)**
  *   **Must Hit:** Makes a definitive choice between the two diagnoses and specifies an observable economic pattern (e.g., stable profits without labour vs. deflation/realization crisis) that would prove the chosen diagnosis wrong.
  *   **Common Error:** Refusing to commit ("both are right") or offering a falsification condition that is not observable (e.g., "if Marx was wrong").

  **General Penalties for Theoretical Errors:**
  *   **Conflating Value and Price:** Answers that treat value fluctuations as identical to price fluctuations lose significant credit across all sections.
  *   **Empirical Misreading of TRPF:** Answers that treat the falling rate of profit as a simple empirical forecast of money profits declining, rather than a tendential law involving value categories, are marked down.
  *   **Ignoring the Case:** Answers that generalize about automation without referencing the specific "machines building machines" scenario provided in the question cannot score above 15 marks.
