      *   **The Community Impact:** Connect the newsroom rigor to the neighborly presence. "Showing up."
      *   **Closing:** A toast to the work, not the perfection. To the tools left behind.

  4.  **Refining the Tone:**

      *   Avoid academic detachment. Keep it grounded in the physical reality of a newsroom (ink, deadlines, the morgue).
      *   Ensure the newsroom folks feel seen (they know the grind) without alienating the neighbors (who just like the paper).
