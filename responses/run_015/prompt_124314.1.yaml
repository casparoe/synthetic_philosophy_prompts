  **DRAFT: Adversarial Collaboration on the Ontology of the Self**
  **To:** Mediator
  **From:** Camp 1 (Gravity-Only) & Camp 2 (Anchor)
  **Date:** [Redacted]
  **Status:** Preliminary consensus following ~2hr debate

  ### 1. Agreed Claims (Common Ground)

  Both parties sign onto the following propositions as the baseline for further dispute resolution:

  1.  **Explanatory Scope:** The "Center of Narrative Gravity" (CNG) model successfully explains behavioral coherence, the construction of autobiographical memory, and the specific phenomenon of confabulation in split-brain patients (where the left hemisphere constructs reasons for actions it did not initiate).
  2.  **Explanatory Gaps:** The CNG model does not obviously account for (a) phenomenal binding at a single moment (why disparate sensory inputs feel unified *now*) or (b) the resistance to false self-correction (narrative inertia) when explicit memory is unavailable.
  3.  **Predictive Processing:** Predictive processing mechanisms are actively involved in maintaining self-coherence; the dispute is whether these mechanisms *constitute* the self (Camp 1) or merely *serve* a pre-existing minimal self (Camp 2).
  4.  **AI Selfhood:** Regarding an artificial system with perfect narrative coherence but zero real-time sensory integration: Both sides agree that such a system would lack the embodied predictive loop humans possess. Camp 1 holds this might still suffice for a "self" (as fiction); Camp 2 holds this is impossible without experiential givenness. We agree the verdict depends entirely on resolving the anchor vs. gravity dispute.
  5.  **Narrative Inertia:** "Narrative inertia" is treated as a measurable cognitive feature (resistance to updating self-models) rather than merely a metaphorical description.

  ### 2. Disagreements Table

  | Topic | Camp 1 (Gravity-Only) | Camp 2 (Anchor) |
  | :--- | :--- | :--- |
  | **Ontological Status** | The self is a fictional locus, akin to a center of gravity. It is a useful abstraction generated by language and predictive modeling, with no corresponding physical or phenomenal "owner." | The self includes a real, minimal locus of experiential ownership (pre-reflective self-consciousness). The narrative organizes around this anchor; it does not create it ex nihilo. |
  | **Phenomenal Ownership** | The feeling of ownership is a post-hoc narrative attribution. There is no "feel" of self prior to the story being told by the brain. | There is a "first-person givenness" to experience that precedes narrative. Even without a story, experience feels like *someone's* experience. |
  | **Explanatory Sufficiency** | Narrative gravity is all there is. Adding a "minimal self" is an unnecessary homunculus that violates parsimony. | Narrative gravity is real but insufficient. Without an anchor, the narrative is free-floating text with no subject to whom the story matters. |

  ### 3. Cruxes and Predictions

  We identify two primary cruxes where empirical evidence could shift confidence.

  **Crux A: Phenomenal Binding vs. Narrative Integration**
  *   **The Question:** Does the unity of experience at a single moment (phenomenal binding) require a real subject, or is it just cross-modal narrative integration?
  *   **Agreed Test Case:** **Left-hemisphere confabulation in split-brain patients.** (Both agree this case bears directly on whether the "subject" is constructed or discovered).
  *   **Camp 1 Prediction:** If the narrative construction process is disrupted (e.g., via TMS or cognitive load) during the confabulation, the sense of agency and ownership will vanish immediately. The "I" is the story; break the story, break the self.
  *   **Camp 2 Prediction:** Even if the narrative confabulation is disrupted, the raw phenomenal feeling of ownership over the *current* experience (e.g., seeing the image, feeling the confusion) will persist in that hemisphere. The minimal self survives the narrative breakdown.

  **Crux B: Narrative Inertia vs. Self-Preservation**
  *   **The Question:** Is resistance to accurate but disruptive biographical corrections best explained by high-precision predictive priors (Camp 1) or by a real self pulling the story back toward coherence (Camp 2)?
  *   **Agreed Test Case:** **Patients with severe retrograde amnesia who still reject false narratives about themselves.** (Both agree this case tests whether the "anchor" survives memory loss).
  *   **Camp 1 Prediction:** Resistance is purely computational. The predictive model retains high-precision priors about "who I am" based on remaining semantic knowledge or personality traits, even without episodic memory. It is a model protecting its own integrity.
  *   **Camp 2 Prediction:** Resistance is ontological. The minimal self retains an implicit, non-narrative familiarity with certain truths about itself that contradicts the false narrative. The "anchor" recognizes the incongruence even when the "library" (memory) is burned.

  ### 4. Verbal Dispute Clarification

  We acknowledge a significant portion of the dispute may be verbal, specifically regarding the definition of "self."

  *   **Camp 1 Usage:** "Self" refers exclusively to the **Narrative Center**. If there is no story, there is no self.
  *   **Camp 2 Usage:** "Self" refers to the **Experiential Subject + Narrative Center**. The narrative is the *content*, but the subject is the *container*.

  **Why this is not *only* verbal:**
  If Camp 2 is correct, there is a phenomenological reality (the anchor) that exists independently of linguistic or narrative construction. This implies that interventions targeting narrative coherence (e.g., psychotherapy, AI alignment) might fail to address the root of suffering or agency if the minimal self is damaged or ignored. If Camp 1 is correct, fixing the narrative *is* fixing the self. The ontological commitment changes the intervention strategy.

  ***

  **Next Steps:** We need to operationalize "narrative inertia" into a measurable metric for Crux B and find a protocol for disrupting narrative construction without disrupting sensory processing for Crux A.
