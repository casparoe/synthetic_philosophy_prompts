  2.  **Deconstruct the Philosophical Problem:**
      *   *The Tetralemma:* Exist, Not Exist, Both, Neither. Nāgārjuna negates all four regarding intrinsic nature (svabhāva).
      *   *The Objection:* Negating all four looks like a negative dogmatism (nihilism) or a hidden positive claim (that reality is ineffable). This is the "fifth horn" critique (often associated with Jayatilleke or logical positivists).
      *   *The Defense:* Emptiness (śūnyatā) is not a view (dṛṣṭi). It's a therapeutic tool. The "emptiness of emptiness" prevents reification.
      *   *The Two Truths:* Conventional (saṃvṛti) allows language/logic; Ultimate (paramārtha) is the realization of emptiness. The tetralemma operates at the intersection.
      *   *The Regress Worry:* If emptiness is empty, do we need an emptiness of that emptiness? (MMK 22).
      *   *The Quietism Worry:* If nothing can be said, is philosophy dead? (Mūlamadhyamakakārikā 25).

  3.  **Outline the Essay:**
      *   **Title:** Needs to be engaging and descriptive.
      *   **Introduction:** State the puzzle clearly. Introduce the tetralemma, the "fifth position" objection, and the stakes (nihilism vs. liberation). State the thesis (I need to pick a side).
      *   **Section 1: The Logic of the Tetralemma and the "Fifth Horn" Objection.** Explain why negating all four looks like a logical violation or a hidden claim. Discuss the charge of nihilism.
      *   **Section 2: The Therapeutic Interpretation (The Practitioner's View).** Explain "emptiness is not a view." Use the snake/snare metaphor. Emptiness as medicine.
      *   **Section 3: The Two Truths and Emptiness of Emptiness.** How does this structural move save the doctrine? Address the infinite regress objection.
      *   **Section 4: Evaluating the Quietism Charge.** Is silence the end? Or is it a prerequisite for compassionate action?
      *   **Conclusion:** Take a stand. Argue that it is *not* a fifth position/nihilism, but a pragmatic soteriological tool. Justify why this is the stronger philosophical reading.

  4.  **Drafting - Section by Section:**

      *   *Intro:* Hook the reader with the logical tension. Nāgārjuna's *Mūlamadhyamakakārikā* (MMK). The accusation: Is he just a skeptic? Thesis: The Madhyamaka position is not a metaphysical claim about reality (which would be a fifth horn) but a pragmatic critique of conceptual proliferation (prapañca). It avoids nihilism by preserving conventional truth.

      *   *The "Fifth Horn":* Why does it look like a fifth position? In classical logic, $\neg(A \lor \neg A)$ is a contradiction. If Nāgārjuna says "None of these apply," he seems to be saying "Reality is ineffable." But "Reality is ineffable" is a claim *about* reality. This is the Jayatilleke/logical critique. If he holds this, he's dogmatic. If he denies everything, he's a nihilist (ucchedavāda).

      *   *Therapeutic/Pragmatic Turn:* Nāgārjuna's own defense (MMK 13 & 27). "I have no thesis." The snake simile (grasping a snake wrongly). Emptiness is meant to cure the disease of views, not become a new disease. This supports the friend's claim ("seeing-through of views").

      *   *Two Truths & Emptiness of Emptiness:* This is the technical core. Conventional truth allows the tetralemma to function linguistically. Ultimate truth is the *realization* that concepts don't latch onto *svabhāva*. "Emptiness of emptiness" (MMK 22) means emptiness isn't a substance. It stops the regress because emptiness is dependent arising. If emptiness depended on another emptiness, it would have intrinsic nature. But it doesn't. It's like a dream curing a dream.

      *   *Quietism vs. Compassion:* If we say nothing, do we stop acting? No. Because conventional reality is preserved. One acts *because* things are empty, not *despite* it. This avoids quietism.

      *   *Conclusion:* I need to commit. I will argue that the "fifth position" critique fails because it assumes Nāgārjuna is doing metaphysics. He is doing philosophical therapy. The "no-thesis" claim is performative, not constative. It's the only reading that makes sense of the soteriological goal.

  5.  **Refining the Argument (Self-Correction during drafting):**
      *   *Critique:* Make sure I don't just say "it's mystical." Keep it philosophical.
