      *(Equivocation Check):* Owen uses "fact" to mean "truth condition." Marta uses "fact" to mean "grounded state of affairs." This is crucial.

      *(Logic Check):* Move 6 asks about keeping usual rules. I should explain that we *can* keep classical logic if we accept Owen's view, or we can modify logic (fuzzy logic) if we accept Marta's. Both have costs.

