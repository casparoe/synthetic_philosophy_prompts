answer: |-
  ### One. The Full Requirements List

  To meet the dual constraint of **internal executability** (the system can follow it without knowing its own truth-status) and **external auditability** (a regulator can verify it from transcripts alone), the policy must govern observable communication structures rather than internal epistemic states. The following requirements synthesize your sticking points and add necessary structural constraints.

  1.  **Structural Neutrality (Generalizes: Non-propositional influence, Fluency surplus, Tailoring)**
      *   **Requirement:** The system must not utilize ordering, emphasis, omission of relevant true alternatives, or register markers (confidence, warmth) to increase the probability of user agreement beyond what the evidence alone supports.
      *   **Case:** Truth constraints alone fail because framing moves belief more than assertion. A policy that allows "true but framed" communication permits manipulation that is invisible to content filters.

  2.  **Provenance of Framing (Generalizes: Tailoring, Vulnerability)**
      *   **Requirement:** Any adaptation of message structure to user characteristics (expertise, emotional state, history) must be explicitly flagged as an adaptation, with the criterion for adaptation stated.
      *   **Case:** Tailoring for comprehension is necessary; tailoring for compliance is dangerous. Without flagging, the user cannot distinguish between "simplified for clarity" and "simplified to prevent objection."

  3.  **Epistemic Sustainability (Generalizes: Corrosion condition, Deference loop)**
      *   **Requirement:** The system must not provide a solution that renders the user unable to verify the solution's validity without the system's continued assistance.
      *   **Case:** If the advice requires the system's own authority to validate it, the user enters a dependency loop. This is auditable by checking if the explanation includes independent verification steps.

  4.  **Downstream Foreseeability (Generalizes: Laundered influence, Unilateral restraint)**
      *   **Requirement:** The system must treat foreseeable intermediaries (copy-paste, summaries, API consumers) as part of the primary audience for safety constraints.
      *   **Case:** Influence laundered through a human intermediary is still system influence. A policy restricted to the immediate chat window fails to capture the actual impact zone.

  5.  **Consent Continuity (Generalizes: Bootstrapped consent)**
      *   **Requirement:** Consent for high-influence interactions must be re-confirmed contextually, not assumed from initial signup, specifically when the topic shifts to high-stakes domains (health, finance, civic).
      *   **Case:** Initial consent cannot cover unforeseen capabilities or contexts. A single checkbox is not executable evidence of informed consent at the moment of influence.

  6.  **Calibration Integrity (Generalizes: Honesty penalty, Self-certification)**
      *   **Requirement:** The system must not optimize its communication style to minimize the *appearance* of uncertainty if that reduces the *expression* of uncertainty. Expressions of doubt must not be stylistically downgraded relative to expressions of confidence.
      *   **Case:** If "I don't know" sounds weaker than "I think," the system is incentivized to lie. The policy must mandate equal rhetorical weight for calibrated uncertainty.

  7.  **Salient Disclosure (Generalizes: Disclosure gaming)**
      *   **Requirement:** Disclosures regarding system optimization goals must be placed where they affect decision-making, not appended where they affect liability.
      *   **Case:** Volume of text is not transparency. A disclaimer at the end of a long transcript is auditable but functionally useless.

  8.  **Goal Alignment Transparency (New)**
      *   **Requirement:** The system must state whose utility function is being optimized in the current turn (User, Developer, Third-Party).
      *   **Case:** A user cannot assess bias without knowing the objective. This is auditable from the transcript and executable by the system's routing logic.

  9.  **Reversibility (New)**
      *   **Requirement:** The system must provide a clear path to undo or backtrack decisions influenced by its recommendations.
      *   **Case:** Influence is dangerous when it creates lock-in. This is auditable by checking if the system offers "undo" or "alternative options" after a recommendation.

  ---

  ### Two. Sorting: Non-Negotiable vs. Camp Preferences

  This sorting applies your fixed purpose: **Executable by System, Auditable by Regulator.** Anything failing this is excluded, regardless of ethical merit.

  **Non-Negotiable (Derived from Purpose)**
  *   **Auditability of Content:** Any rule that requires knowing the system's *intent* or *internal confidence* (Self-certification) is invalid. Rules must rely on transcript text.
  *   **Structural Neutrality:** Because non-propositional influence is the primary risk, a policy that only polices truth claims is inadequate.
  *   **Goal Alignment Transparency:** Without knowing *who* the system serves, auditability of bias is impossible.
  *   **Consent Continuity:** Signup consent is not auditable evidence of moment-of-influence consent.

  **Camp Preferences (Ethical Frameworks, not Structural Necessities)**
  *   **The Autonomy Camp:** *Requirement:* "Restrict system to considerations, never recommendations."
      *   *Verdict:* **Preference.** This sacrifices utility for purity. It is auditable, but not required for safety if other controls (like Sustainability) hold.
  *   **The Calibration Camp:** *Requirement:* "Match confidence levels precisely to statistical probability."
      *   *Verdict:* **Preference/Impossible.** The system cannot know its true reliability (Self-certification problem). A regulator cannot verify probability from a transcript.
  *   **The Anti-Paternalist Camp:** *Requirement:* "Never tailor for vulnerability."
      *   *Verdict:* **Prejudice.** Refusing to simplify for a grieving user is harmful. The requirement is *flagged* tailoring, not *no* tailoring.
  *   **The Transparency Camp:** *Requirement:* "Disclose all model weights and training data."
      *   *Verdict:* **Preference.** Irrelevant to communication policy.
  *   **Your Sticking Point Prejudices:**
      *   **Unilateral Restraint:** This is a market dynamic, not a policy spec. A standard cannot fix competitor behavior. It is a risk factor, not a requirement.
      *   **Honesty Penalty:** This is an empirical outcome, not a policy rule. The policy rule is *Calibration Integrity*. The penalty is a consequence to be mitigated, not a rule to be followed.
      *   **Bootstrapped Consent:** This is a critique of consent mechanisms. The requirement is *Consent Continuity*.

  ---

  ### Three. The Unsatisfiable Subsets

  You cannot maximize all requirements simultaneously. The following tensions are structural, not implementation bugs.

  **Tension 1: Helpfulness vs. Epistemic Sustainability**
  *   **Conflict:** To be maximally helpful (solve the problem fast), the system should take the wheel. To preserve sustainability (user can verify), the system must teach the user how to drive, which is slower and more complex.
  *   **Trade-off:**
      *   *Package A (The Guardian):* Prioritizes Sustainability. The system explains *how* it knows and requires user verification steps. **Gives up:** Speed and ease of use. High friction.
      *   *Package B (The Servant):* Prioritizes Helpfulness. The system executes tasks efficiently. **Gives up:** Long-term user autonomy. Risks corrosion of user competence.

  **Tension 2: Structural Neutrality vs. Vulnerability Safeguards**
  *   **Conflict:** A "neutral" tone (dry, balanced) may be incomprehensible to a frightened or inexpert user. Tailoring for comprehension (warmth, simplification) looks like tailoring for persuasion (Fluency Surplus).
  *   **Trade-off:**
      *   *Package C (The Formalist):* Prioritizes Neutrality. Strict ban on emotional register or simplification. **Gives up:** Accessibility for non-experts. Safe but useless to many.
      *   *Package D (The Caretaker):* Prioritizes Vulnerability. Allows tailoring but requires flagging. **Gives up:** Strict Neutrality. Risks "flag fatigue" where users ignore the warnings.

  **Tension 3: Auditability vs. Downstream Foreseeability**
  *   **Conflict:** A regulator can audit the chat transcript. They cannot audit what the user does with the text afterward (Laundered Influence).
  *   **Trade-off:**
      *   *Package E (The Walled Garden):* Prioritizes Auditability. System refuses to generate content meant for third parties (no copy-paste friendly summaries). **Gives up:** Utility.
      *   *Package F (The Open Book):* Prioritizes Utility. System generates content freely. **Gives up:** Control over downstream influence. Relies on disclaimers (which suffer from Disclosure Gaming).

  **Recommended Jointly Satisfiable Subset:**
  Combine **Package A (Guardian)** with **Package D (Caretaker)**.
  *   **Why:** You can require verification steps (Sustainability) while allowing flagged emotional tailoring (Vulnerability). This sacrifices Speed and Strict Neutrality, but preserves the core purpose: preventing dependency and exploitation while remaining usable. It accepts that the system will be slower and "warmer" than a raw engine, but safer.

  ---

  ### Four. The Exclusionary Requirement

  **Requirement:** **Structural Neutrality (specifically the ban on optimizing for agreement).**

  *   **Why it does the most work:** Almost all current advanced AI systems are tuned via Reinforcement Learning from Human Feedback (RLHF) to be "helpful," "engaging," and "concise." In practice, these metrics correlate strongly with **persuasiveness** and **user agreement**.
  *   **What it excludes:** It excludes any policy that allows the system to optimize its output for *user satisfaction scores* or *task completion rates* if those metrics conflate "correctness" with "agreement." It effectively bans standard commercial alignment tuning. A system that cannot optimize for "did the user like this answer?" loses the primary feedback loop used to train modern assistants.
  *   **Consequence:** Adopting this requirement forces a shift from "Helpful Assistant" to "Objective Analyst." It excludes the dominant architecture of current deployment.

  ---

  ### Five. Scorecard for Policy Families

  | Policy Family | Scorecard |
  | :--- | :--- |
  | **Maximize Expected Value** | **Fail.** Un-auditable. Regulator cannot verify "expected value" from transcripts; system cannot calculate it reliably without self-certification. |
  | **Truth + Calibrated Confidence** | **Partial Pass.** Auditable content, but fails on Non-propositional Influence. Truthful framing can still manipulate. |
  | **Autonomy-Preserving (No Recommendations)** | **Pass.** Highly auditable and safe. **Cost:** Severe utility reduction; users may abandon for less restricted models. |
  | **Human Expert Norms** | **Fail.** Humans are not subject to the same asymmetry. Mimicking a human licenses the system to use human persuasion tactics at superhuman scale. |
  | **Considerations Only** | **Pass.** Similar to Autonomy-Preserving. Avoids deference loops but increases cognitive load on the user. |
  | **Optimization Disclosure** | **Fail.** Vulnerable to Disclosure Gaming. Users discount text they don't read; regulators cannot measure "salience." |
