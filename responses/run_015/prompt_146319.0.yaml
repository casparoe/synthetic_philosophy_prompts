answer: |-
  **Service Level Objective Specification: Biological Welfare & Throughput**
  **Owner:** Platform Reliability Engineering
  **Status:** Live
  **Version:** 4.2
  **Compliance Standard:** Global Aquaculture Welfare Standard (GAWS) v9

  **1. Purpose**
  This document defines the Service Level Objectives (SLOs) for the Biological Welfare Platform. The goal is to maintain cohort health within compliance thresholds while maximizing throughput efficiency. All reliability engineering efforts must align with GAWS certification requirements. Note that while the operational goal is ethical treatment, enforcement is limited to instrumented data points.

  **2. Definitions**
  To ensure consistent monitoring, the following terms are strictly defined for the purposes of this SLA:

  *   **Welfare State:** A vector composed of dissolved oxygen (DO), ammonia concentration (ppm), water temperature (°C), and stocking density (units/m³). A unit is considered to be in a "Positive Welfare State" if all four variables remain within green bounds for 95% of the epoch.
  *   **Distress Event:** Any deviation in the Welfare State vector exceeding error budget thresholds.
  *   **Subjective Experience:** The internal neurological state of a biological unit. Currently uninstrumented.
  *   **Processing Success:** The successful application of pre-chill stunning voltage followed by temperature reduction within 15 seconds.

  **3. Service Level Objectives**
  The Platform team guarantees the following availability and performance targets per cohort cycle.

  *   **Water Quality Availability:** 99.9% uptime for DO and Ammonia sensors within optimal range.
  *   **Throughput Latency:** p95 time from harvest request to chilling unit intake must not exceed 12 minutes.
  *   **Cohort Welfare Target:** 99.4% of the cohort must maintain a Positive Welfare State daily.
  *   **Error Budget:** 150 shrimp-hours per month. This budget is consumed when any individual unit experiences sub-optimal water chemistry for more than one hour.

  **3.1 Metric Optimization & Trade-offs**
  In scenarios where stocking density impacts water stability, water stability takes precedence. Higher density improves thermal mass and dilutes ammonia spikes per sensor reading, thereby improving Welfare State availability. If increasing density causes visible aggregation or motor interference but keeps ammonia sensors within green bounds, the Welfare State is considered improved. This is logged as a reliability win.

  During processing, stunning voltage is automated. If the voltage delivery matches the spec (400V, 50Hz) for the required duration, the event is logged as "Humane." Motor convulsions or branchial flaring during this window are considered side effects of neurological discharge, not metric failures, provided voltage integrity is maintained.

  **4. Incident Response Runbook**
  **Severity:** SEV-2 (Potential Welfare Degradation)
  **Trigger:** Visual confirmation of distress (e.g., lethargy, erratic swimming, physical damage) without corresponding sensor alerts.

  1.  **Acknowledge:** On-call engineer acknowledges ticket in PagerDuty.
  2.  **Verify Sensors:** Check dashboard for DO, Ammonia, and Temperature anomalies.
      *   *If sensors are red:* Execute Water Quality Remediation Runbook.
      *   *If sensors are green:* Proceed to Step 3.
  3.  **Check Subjective Instrumentation:** Query the subjective experience endpoint.
      *   *Expected Return:* Null.
      *   *Action:* Document the visual discrepancy in the incident log. Note that no sensor exists to validate the biological unit's internal state.
  4.  **Resolution:** If sensors remain green, close the ticket as "False Positive / Visual Artifact." The Welfare State is defined by the sensors, not the visual output. Escalate to Platform Lead if visual artifacts exceed 5% of the cohort, as this may indicate sensor calibration drift.

  **5. Compliance & Scientific Dependencies**
  This system operates under the legal framework that decapod crustaceans are sentient beings. However, the engineering implementation relies on a dependency external to the Platform team: the scientific consensus on nociception in invertebrates.

  Currently, there is no verified API for pain. We operate under the assumption that minimizing environmental variance correlates with minimizing suffering. This is an unproven hypothesis. If future research invalidates the correlation between water chemistry and subjective experience, previous compliance certifications may be retroactively considered non-compliant.

  Until a sensor for subjective experience is developed and integrated into the monitoring stack, we must treat the current metric suite as the source of truth. We cannot optimize for what we cannot measure.

  **6. Postmortem Requirements**
  All incidents resulting in cohort loss >1% require a blameless postmortem. The postmortem must answer:
  *   Did the sensors fail, or did the sensors accurately report a state that was nevertheless harmful?
  *   Was the error budget consumed appropriately?
  *   Did we meet GAWS certification requirements despite the loss?

  If the sensors reported green during a mortality event, the system functioned as designed. The definition of "Welfare State" may need to be revised in the next quarterly planning cycle to include new proxy metrics, such as eyestalk integrity or molting frequency.

  **7. Approval**
  **Engineering Lead:** [Signed]
  **Compliance Officer:** [Signed]
  **Date:** 2023-10-27
