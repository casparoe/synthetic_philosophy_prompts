answer: |-
  ### Exam Question

  **Question 4 (90 Minutes)**

  Critically assess the claim that gross neuroanatomical quantities (such as cortical neuron count in biological systems or parameter count in artificial systems) are morally relevant. In your answer, you must address: (1) the problem of intraspecies variation (e.g., human infants vs. adults with advanced dementia), where psychological capacity varies widely despite anatomical similarity; and (2) the case of artificial systems, where anatomical analogues exist without a behavioral track record. Conclude by distinguishing whether such quantities serve as evidence of capacity or as constitutive grounds of standing, and explicitly consider whether this distinction shifts between moral patiency and moral agency.

  ***

  ### Model Answer

  The standard view in moral status literature holds that anatomy is only morally relevant insofar as it evidences psychological capacities, such as sentience or autonomy. Gross neuroanatomical quantities are typically rejected as constitutive grounds of standing; weighing brains is dismissed as fetishizing the substrate rather than the experience. However, two edge cases complicate the clean rejection of anatomical proxies: intraspecies variation and artificial systems.

  Consider first the intraspecies variation problem. A human infant and an adult with advanced dementia may possess nearly identical cortical neuron counts, yet their psychological capacities differ enormously. The infant possesses potential for autonomy; the dementia patient retains sentience but has lost autobiographical memory and executive function. If moral status tracks capacity, neuron count is a poor proxy here. It fails to discriminate between the specific capacities we typically value. However, if one argues that mere species-typical neuroanatomy constitutes standing (a view often associated with human dignity arguments), then the infant and the dementia patient retain equal status despite capacity loss. This suggests anatomical quantities might function as a constitutive rule for *membership* in a protected class, rather than evidence of current capacity. Yet, this move risks speciesism unless justified by a separate normative claim about the value of biological kinds, which remains a live dispute.

  Second, consider artificial systems. Large language models now exceed human brains in parameter count, an analogue to neuron number. Yet, they lack a behavioral track record of suffering or agency comparable to biological organisms. If we reject brain size in humans because it does not perfectly track capacity, consistency demands we reject parameter count in AI for the same reason. However, unlike biological brains, we lack independent access to AI phenomenology. We cannot calibrate the proxy against behavior or self-report in the same way. Here, anatomical (or architectural) quantity might become the *only* available evidence. If we wait for behavioral certainty regarding machine sentience, we risk moral catastrophe. Thus, in the AI case, parameter count might be provisionally treated as constitutive of a precautionary principle, even if it is not metaphysically constitutive of status.

  This leads to the distinction between evidence and constitution. In biological cases, anatomy is usually merely evidentiary. But relying solely on capacity relocates the arbitrariness rather than removing it. Deciding *which* capacities matter (sentience vs. rationality) is itself a contested normative judgment, not a factual discovery. There is no consensus that sentience is sufficient for equal consideration; some theories prioritize autonomy. Therefore, rejecting brain size in favor of capacity does not solve the problem of moral grounding; it merely shifts the debate from anatomy to psychology. A candidate who treats capacity criteria as settled fact fails to recognize this normative contingency.

  Finally, the relevance of anatomical proxies may shift between moral patiency and moral agency. For patiency (the right not to be harmed), sentience is the primary threshold. Anatomy is relevant only as a fallible indicator of sentience. For agency (responsibility and rights), the threshold is higher. Here, neuroanatomical integrity might be more directly relevant. A damaged brain may mitigate moral responsibility regardless of the agent's outward behavior. Thus, anatomy might be constitutive for excusing conditions in agency, even if it is only evidentiary for suffering in patiency.

  Furthermore, law and policy may legitimately rely on imperfect proxies. Even if neuron count is not metaphysically decisive, administrative bright lines are necessary for regulation. Whether policy may rely on known imperfect proxies is contested; some argue this entrenches error, while others argue it is a pragmatic necessity. A robust account must acknowledge that while anatomy may not ground moral truth, it may ground moral *procedure*.

  In conclusion, gross neuroanatomical quantities are rarely constitutive of moral status in a metaphysical sense. However, they function differently as evidentiary proxies in biological vs. artificial cases, and their utility shifts between patiency and agency. Rejecting them does not escape arbitrariness, as capacity criteria are equally contested.

  ***

  ### Marking Scheme (25 Marks)

  **1. Diagnosis of Intraspecies Variation (5 Marks)**
  *   **Full Marks:** Identifies that anatomy (neuron count) stays constant while capacity (autonomy/memory) varies in humans (infant vs. dementia), breaking the anatomy-capacity link.
  *   **Common Error:** Assumes dementia patients lose neuron counts proportionally to cognitive loss.

  **2. Diagnosis of the AI/Proxy Problem (5 Marks)**
  *   **Full Marks:** Notes that in AI, parameter count exists without independent verification of phenomenology, making the proxy uncalibratable compared to biological cases.
  *   **Common Error:** Treats AI parameter count as functionally identical to biological neuron count without noting the lack of behavioral track record.

  **3. Evidence vs. Constitution Distinction (5 Marks)**
  *   **Full Marks:** Clearly distinguishes between anatomy as a *sign* of capacity (evidence) vs. anatomy as the *source* of status (constitution).
  *   **Common Error:** Conflates the two, arguing that if anatomy evidences capacity, it therefore constitutes status.

  **4. Relocating Arbitrariness (A/B Boundary) (5 Marks)**
  *   **Full Marks:** Argues that rejecting anatomy for capacity does not solve the normativity problem because selecting *which* capacities count is itself contested/arbitrary.
  *   **Common Error:** Treats "psychological capacity" as an objective, uncontested solution to the problem of moral grounding.

  **5. Patiency vs. Agency Distinction (A/B Boundary) (5 Marks)**
  *   **Full Marks:** Distinguishes that anatomical proxies might be relevant for responsibility/agency (e.g., mitigation) even if irrelevant for suffering/patiency.
  *   **Common Error:** Applies a single standard of moral status to both rights (agency) and protection from harm (patiency).

  **General Penalty: Epistemic Flagging**
  *   **Deduction:** Candidates who present contested premises (e.g., "sentience is sufficient for equal consideration" or "policy may rely on imperfect proxies") as settled consensus will lose 1 mark per instance, even if reasoning from the premise is valid. The model answer flags these as "live disputes" or "contested."
