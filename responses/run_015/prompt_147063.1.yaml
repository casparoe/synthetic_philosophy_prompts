  ### FACILITATOR SCRIPT & MOVES

  **Permitted Sentences (Read Exactly):**
  1.  "Check your role. Row players sit left, Column players sit right."
  2.  "Open Page 1. You have 5 minutes to discuss within your role group, then submit one choice on an index card. Column players: keep coins in pockets."
  3.  (After collection) "Column scores are calculated by the worst-case row submitted. Row scores are calculated by a random draw from Column submissions."
  4.  (After revealing Stage 1 scores) "Column players: If you had been allowed to commit to a 50/50 coin flip between L and C instead of a pure choice, your worst-case score would have been 1.5. Record this on your sheet."
  5.  "Open Page 2. Strategy R is now illegal. Column players: You may now use coins. 5 minutes. Submit."
  6.  (After collection) "Row players: Look at your scores against the Column distribution. If you played M, compare your score to what U or D would have earned against the same Columns."
  7.  "Open Page 3. Strategy M is now illegal. 5 minutes. Submit."
  8.  "Stop. Keep your cards. We are moving to debrief."

  **Timeline (80 Minutes):**
  *   **00-05:** Distribution of roles, coins, Page 1. Seating.
  *   **05-15:** Stage 1 Play. (Rows will likely play U; Cols will play R).
  *   **15-25:** Scoring Stage 1. Publicly calculate Col scores. (R players get 1. L/C players get 0). Reveal the "Coin Flip" hypothetical score (1.5).
  *   **25-30:** Discussion/Reaction. (Allow murmurs, do not explain *why* yet).
  *   **30-35:** Distribute Page 2. Explain R is banned.
  *   **35-45:** Stage 2 Play. (Cols will mix or pick L/C; Rows will start abandoning M).
  *   **45-55:** Scoring Stage 2. Highlight that M players scored 1, while U/D players scored 2 (against 50/50 Cols).
  *   **55-60:** Distribute Page 3. Explain M is banned.
  *   **60-70:** Stage 3 Play. (Rows U/D; Cols L/C).
  *   **70-80:** Debrief.

  **Scoring Scheme:**
  *   Points are cumulative.
  *   Top 3 Row players and Top 3 Column players receive a chocolate bar.
  *   Tie-breaker: Fewest stages played to achieve score (encourages early optimization).

  ### DEBRIEF GUIDE

  **1. Map Moments to Claims:**
  *   **Claim 1 & 2 (Stage 1):** Ask Column players why they chose R. (Answer: It guaranteed 1; L/C guaranteed 0). Write R's payoffs (1,1,1) on board. Write 50/50 L/C payoffs (1.5, 1.5, 2). Ask: "Is 1.5 strictly greater than 1?" Yes. **Discovery:** A pure strategy (R) can be strictly dominated by a mixture, even if no pure strategy dominates it.
  *   **Claim 3 (Stage 1 Intervention):** Highlight that the mixture that dominates R is also the mixture that maximizes the security level (Maximin). **Discovery:** Randomization here wasn't risk; it was safety.
  *   **Claim 4 (Stage 2):** Ask Row players who played M how they scored. (Answer: 1). Ask U/D players. (Answer: 2). Why? Because R was gone. **Discovery:** M was safe against R (payoff 5), but vulnerable once R was deleted. Deletion unlocks domination.
  *   **Claim 5 (Stage 3):** Look at the final 2x2 ({U,D} vs {L,C}). Ask if L strictly dominates C. (No, 2=2 against D). Ask if L *weakly* dominates C. (Yes, 3>0 and 2=2). **Discovery:** The strict procedure stops here. Moving to (U,L) requires weak dominance, which is riskier.

  **2. The General Test (Best-Response-to-Beliefs):**
  *   Write on board: **A strategy is strictly dominated if and only if it is NEVER a best response to any belief.**
  *   Explain: In Stage 1, R was a best response to the belief "Row plays M" (1 vs 0) or "Row plays D" (1 vs 0/2? Wait, vs D, R=1, L=2. R is not BR to D).
  *   Correction for Board: R is a best response to belief "Row plays M" (1 vs 0) and "Row plays U" (1 vs 0/1? vs U, R=1, L=3. R not BR to U).
  *   Actually, simpler: R is a best response to the belief that Row plays M with probability 1. (Payoff 1 vs 0 for L/C).
  *   Wait, Claim 2 says R is strictly dominated. If it is strictly dominated, it cannot be a best response to *any* belief.
  *   Let's re-verify Claim 2 vs NBR theorem.
      *   Col Payoffs: L(3,0,2), C(0,3,2), R(1,1,1).
      *   Is R a Best Response to any belief $p = (p_U, p_M, p_D)$?
      *   Exp Payoff L: $3p_U + 0p_M + 2p_D$
      *   Exp Payoff C: $0p_U + 3p_M + 2p_D$
      *   Exp Payoff R: $1p_U + 1p_M + 1p_D = 1$
      *   Can R be > L and > C?
      *   Need $1 > 3p_U + 2p_D$ and $1 > 3p_M + 2p_D$.
      *   Sum: $2 > 3(p_U + p_M) + 4p_D$.
      *   Since $p_U + p_M = 1 - p_D$.
      *   $2 > 3(1-p_D) + 4p_D = 3 + p_D$.
      *   $2 > 3 + p_D \rightarrow -1 > p_D$. Impossible.
      *   So R is **never** a best response.
      *   **Instruction:** Tell students: "To check if a strategy is dominated by a mix, you don't need to hunt for the mix. You just check: Is there any probability distribution over the opponent's moves that makes this strategy my unique best choice? If no, it is dominated."

  **3. Limits of the Session:**
  *   **What we proved:** We found *one* path of elimination (R then M).
  *   **What I assert:** For *strict* dominance, the order does not matter. You would have found M dominated eventually anyway, even if we hadn't banned R first (though you couldn't see it until you realized R was irrational).
  *   **What is dangerous:** The final step (L weakly dominates C). If we delete C, we get (U,L). If we deleted L (irrational, but suppose), we'd get (D,C). Weak dominance order *does* matter. This session stops at the cliff edge of weak dominance.

  ### PREDICTABLE FAILURES & FIXES

  **1. The Early Spoiler:**
  *   **Scenario:** A student in Stage 1 says, "Why don't we just flip coins to get 1.5?"
  *   **Fix:** "Stage 1 rules specify pure strategies only. Coins stay in pockets. Save that insight for Stage 2." (Do not validate the math yet, just enforce the constraint).

  **2. The Ontological Objection:**
  *   **Scenario:** A student argues, "A coin flip isn't a strategy. It's a failure to decide."
  *   **Fix:** Acknowledge in debrief. "In this course, a strategy is a complete plan of action. A plan can contain instructions for a randomizing device. If the coin flip yields a higher guaranteed payoff than any deterministic plan, rationality requires you to use the coin."

  **3. Row Players Stick with M in Stage 2:**
  *   **Scenario:** Row players ignore the deletion of R and keep playing M hoping for a 5.
  *   **Fix:** During Stage 2 scoring, publicly calculate: "If Columns mixed 50/50, M earns 1. U earns 2. D earns 2." Show the points lost. The chocolate stake usually corrects this quickly.

  ### LIMITATIONS & ASSERTIONS

  **What This Session Cannot Reproduce:**
  *   **Order Independence of Strict Dominance:** The session forces a specific order (R then M). It does not demonstrate that deleting M first (if possible) would lead to the same set. You must assert the theorem: "In finite games, the set of strategies surviving IESDS is unique regardless of order."
  *   **Infinite Games:** You must assert that this uniqueness property relies on the game being finite.
  *   **The "Never Best Response" Equivalence:** The session shows dominance by *constructing* the dominating mixture. It does not prove the equivalence to "Never Best Response" formally. You must teach that equivalence in the debrief as the general test.

  **Uncertainty Note:**
  *   I am certain that for finite games, the order of *strict* dominance elimination does not change the surviving set. I am certain that for *weak* dominance, order *does* matter. I am not certain if you wish to explore infinite strategy spaces in this course; if so, you must supply the caveat that IESDS uniqueness can fail in infinite games, but this session assumes finiteness.
