  **Page 3: Stage 3 Rules (Distributed after Stage 2 Scoring)**

  **NEW CONSTRAINT:** Row strategy **M** is now **illegal**. You must choose U or D.
  **Column Constraint:** R remains illegal. Choose L or C.

