  The Security Coin: Participants will discover that randomization can strictly dominate certainty by raising the safety floor, and that eliminating an opponent's option can retroactively make your own previously safe options untenable.

  ### HANDOUT MATERIALS

  **Page 1: Instructions & Row Player Payoffs (Keep Face Down Until Told)**

  **Role:** You are either a ROW player or a COLUMN player. Check your card.
  **Stakes:** Points accumulated across stages convert to chocolate prizes for the top scorers in your role.
  **Submission:** Write your choice on an index card. Include your Name and Role.

  **ROW PLAYER PAYOFF TABLE**
  *Your payoff depends on your row and the Column player's choice.*

  | | **L** | **C** | **R** |
  | :--- | :---: | :---: | :---: |
  | **U** | 4 | 0 | 0 |
  | **M** | 1 | 1 | 5 |
  | **D** | 0 | 4 | 1 |

  **COLUMN PLAYER PAYOFF TABLE (STAGE 1 ONLY)**
  *Your payoff depends on your column and the Row player's choice.*

  | | **U** | **M** | **D** |
  | :--- | :---: | :---: | :---: |
  | **L** | 3 | 0 | 2 |
  | **C** | 0 | 3 | 2 |
  | **R** | 1 | 1 | 1 |

  **SCORING RULES (STAGE 1)**
  *   **Row Players:** Your score is the payoff you receive against a **randomly selected** Column choice from the cards submitted by the Column group.
  *   **Column Players:** Your score is the **minimum** payoff you would have received against **any** Row choice submitted by the Row group. (e.g., If you choose L, and Rows submitted U, M, and D, your score is 0).

  ---

  **Page 2: Stage 2 Rules (Distributed after Stage 1 Scoring)**

  **NEW CONSTRAINT:** Column strategy **R** is now **illegal**. You must choose L or C.
  **NEW TOOL:** Column players may use their coin to decide between L and C. If you use the coin, record the procedure (e.g., "Heads=L, Tails=C") on your card.

  **COLUMN PLAYER PAYOFF TABLE (STAGE 2)**
  *Same as Stage 1, but R is unavailable.*

  | | **U** | **M** | **D** |
  | :--- | :---: | :---: | :---: |
  | **L** | 3 | 0 | 2 |
  | **C** | 0 | 3 | 2 |

  **SCORING RULES (STAGE 2)**
  *   **Row Players:** Your score is the payoff you receive against a **randomly selected** Column choice from the cards submitted. (If a Column player used a coin, flip it now to determine their choice for your match).
  *   **Column Players:** Your score is the **minimum** payoff you would have received against **any** Row choice submitted. (If you used a coin, calculate your payoff for L and C, then take the minimum of those two numbers).

