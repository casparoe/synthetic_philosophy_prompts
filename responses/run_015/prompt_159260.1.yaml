answer: |-
  Here is the specification you asked for. This list is designed to function as a filter: any theory that cannot satisfy these conditions without ad-hoc adjustments fails to capture the phenomenology and logic of promising.

  ### The Desiderata for a Theory of Promissory Obligation

  **1. The Distinctiveness Requirement**
  *   **The Spec:** The theory must explain why breaking a promise is a *sui generis* wrong, distinct from lying, disappointing, or acting unreliably.
  *   **The Case:** If I tell you I *intend* to visit you, and I don't, I may be unreliable or deceptive. If I *promise* to visit, and I don't, I have violated a specific normative constraint created by the speech act itself. A theory that reduces promising to "inducing reliance" collapses the promise into the harm of disappointment.
  *   **Why it matters:** To meet your purpose, the theory must locate the wrong in the *violation of the commitment*, not just the *consequences of the breach*.

  **2. The Normative Independence Requirement (The Deathbed Case)**
  *   **The Spec:** The obligation must arise even if keeping the promise produces no net benefit and the promisee cannot verify compliance.
  *   **The Case:** The deathbed promise to look after a sister who will never know she is being looked after (and might not want it).
  *   **Why it matters:** This knocks out pure consequentialism and simple reliance theories. If the obligation depended on the sister's welfare or her reliance on you, there would be no obligation here. The binding force must come from the act of promising itself, not the outcome.

  **3. The Communicative Competence Requirement (The Language Case)**
  *   **The Spec:** The theory must explain why no obligation arises if the necessary normative uptake is impossible.
  *   **The Case:** A promise made in a language the promisee does not speak.
  *   **Why it matters:** Promising is not magic incantation; it is a communicative act. If the promisee cannot understand that an obligation is being undertaken, no obligation is transferred. This suggests the obligation is relational, not merely internal to the promisor.

  **4. The Non-Redundancy Requirement (The Pre-existing Duty Case)**
  *   **The Spec:** The theory must account for the normative difference between doing what you already owed and doing what you promised.
  *   **The Case:** Promising to pay a debt you already legally and morally owe.
  *   **Why it matters:** If you simply do what you already owed, you haven't broken a promise, but you haven't created a *new* specific obligation either. A theory must explain whether a promise can "re-bind" an existing duty or if it is void. (Most theories say you cannot promise what is already obligatory, or that the promise adds a *second* layer of obligation).

  **5. The Secrecy Requirement (The Secret Breach Case)**
  *   **The Spec:** The wrong must persist even if the breach is undetectable and damages no social institution.
  *   **The Case:** Breaking a promise nobody could ever find out about.
  *   **Why it matters:** This knocks out "Practice" or "Convention" accounts that ground the obligation in the maintenance of social trust. If nobody knows, social trust isn't damaged. If the theory says "it's okay then," it fails. The wrong must be local to the parties, not global to society.

  **6. The Power of Release (The Authority Case)**
  *   **The Spec:** The theory must explain why *only* the promisee has the normative power to waive the obligation, excluding the promisor and third parties.
  *   **The Case:** You cannot release yourself; your spouse cannot release you from a promise to your friend. Only the friend can.
  *   **Why it matters:** This is the hardest constraint. It implies the promisee holds a specific normative status (a right or authority) over the promisor's action. It distinguishes promising from general moral duties (which you can't waive) and from contracts (where third parties sometimes have standing).

  ***

  ### Critical Analysis: Real Constraints vs. Partisan Demands

  You asked to separate the core requirements from the ideological baggage, and to identify the tensions.

  **1. The Partisan Demand: "Binding Even When Useless"**
  *   **Verdict:** **Partisan.**
  *   **Analysis:** You suspected this. The demand that a promise binds *even if keeping it is slightly worse* than breaking it is a deontological stipulation. Consequentialist accounts (like Utilitarianism) will deny this; they argue if the harm of breaking is less than the harm of keeping, the obligation dissolves.
  *   **Advice:** Do not treat "absolute bindingness" as a neutral datum. Treat it as a conflict between *Fidelity* and *Beneficence*. A robust theory should explain *why* fidelity has weight, not just assert it is absolute.

  **2. The Tension: "Do What You Said" vs. "Wrong to Someone"**
  *   **Verdict:** **Genuine Incompatibility (unless carefully managed).**
  *   **Analysis:** You are right to feel these pull against each other.
      *   *Formalism:* "You must do what you said." This focuses on the **act**. It handles the Deathbed Case well (you said it, do it) but struggles with the "Wrong to Someone" intuition (if the promisee is dead/indifferent, who is wronged?).
      *   *Relational/Second-Personal:* "The wrong must be to the promisee." This handles the Release Power well (they own the right) but struggles with the Deathbed Case (if they don't know/care, are they wronged?).
  *   **Resolution:** To keep your preference ("wrong has to be to someone"), you must adopt a **Second-Personal** framework. You must argue that the promisee is wronged *objectively* by the violation of their authority, even if they never subjectively feel harmed. If you cannot accept that, you must concede that some deathbed promises create duties to the *dead* (as moral patients) or to *oneself* (integrity), rather than to the beneficiary.

  **3. The Killer Constraint: The Power of Release**
  *   **Verdict:** **The Single Most Damaging Requirement.**
  *   **Analysis:** This requirement does the most work in knocking out the usual candidates.
      *   *Reliance Theories:* If the obligation is based on harm caused by disappointment, why can the promisee waive it? I can't waive your duty not to assault me just because I'm okay with it (in many frameworks). The power of release implies the obligation is *for* the promisee, not just *about* them.
      *   *Convention Theories:* If the obligation is about upholding the social practice of promising, why can one individual opt-out? The practice belongs to society, not the promisee.
      *   *Simple Duty Theories:* If it's just a moral duty like "don't kill," I can't waive it.
  *   **Conclusion:** Any theory that cannot explain the **Normative Power of the Promisee** is dead in the water for your purposes.

  ***

  ### Brief Scorecard of Major Accounts

  **1. Practice / Convention Accounts (e.g., Rawls, Hume)**
  *   **Mechanism:** Promising binds because we participate in a social institution that requires it for utility.
  *   **Score:** **Fail.**
  *   **Why:** Fails the *Deathbed Case* (no practice involved) and the *Secret Breach Case* (no damage to institution). Crucially, fails the *Power of Release* (individuals cannot waive social rules).

  **2. Expectation and Trust Accounts (e.g., Scanlon, Sheffler)**
  *   **Mechanism:** Promising binds because it creates an expectation, and it is wrong to disappoint without justification (Principle of Fidelity).
  *   **Score:** **Mixed.**
  *   **Why:** Handles *Distinctiveness* well. Struggles with *Deathbed Case* (no expectation formed). Struggles with *Power of Release* (why can I waive the duty not to be disappointed?).

  **3. Plain Duty of Fidelity (e.g., Ross)**
  *   **Mechanism:** Promising creates a *prima facie* duty. It is a brute moral fact.
  *   **Score:** **Passable.**
  *   **Why:** Handles *Distinctiveness* and *Deathbed Case* well. Fails on *Explanation* (doesn't tell us *why* it's a duty). Struggles with *Power of Release* (why can the promisee cancel my moral duty?).

  **4. Authority / Second-Personal Accounts (e.g., Darwall, Shiffrin)**
  *   **Mechanism:** Promising transfers a limited authority over the promisor's will to the promisee. The promisee now has a right to the action.
  *   **Score:** **Best Fit.**
  *   **Why:** Handles *Power of Release* perfectly (you can waive your own rights). Handles *Distinctiveness* (it's a violation of authority, not just trust). Handles *Wrong to Someone* (the promisee is the authority holder).
  *   **Risk:** Must work hard to explain the *Deathbed Case* (how does a dead/ignorant person hold authority?).

  ### Summary for your Essay
  Focus your argument on the **Power of Release**. It is the lever that pries apart the theories. If you want to maintain that the wrong must be "to someone," you are committed to a **Second-Personal/Authority** view. Be prepared to defend the claim that a promisee can be "wronged" by a secret breach even if they never know about it (violation of their normative status vs. psychological harm). That is where your marks will be.
