prompt: |-
  Quick context: I share a house with three other guys, and for months we've had this recurring standoff where some chore needs doing (trash, dishes, whatever) and each of us individually decides whether to just do it or wait and hope someone else caves. Last month I read Hofstadter's Metamagical Themas stuff, the superrationality idea and the Luring Lottery experiment he ran in the magazine, and it honestly felt like it was written for me. The way I understand it: if you're in a symmetric dilemma with people who reason the way you do, you can treat your own decision as a sample of what everyone's deciding, so you should pick the move that's best when everyone like you picks it, instead of the game-theory move. So last week the kitchen was a disaster and I thought, the other three are basically facing the same situation I am and we all think roughly alike, so if I decide not to clean they'll decide not to clean too, and we're stuck in the defect-defect box. So I cleaned. Kitchen's clean. Felt like the system works.

  Here's where it gets personally urgent. Me and another guy at work both put in for the same promotion, and the decision on who gets extra training slots etc. lands next month. I've been trying to run it the superrational way: whatever I do (study nights and weekends for the cert, going to the boss directly, whatever), he'll do the same thing, so I should pick the strategy that's best for both of us when we both do it. But my coworker is not a copy of me — different background, he's got kids so no weekend studying, and honestly he's more cutthroat than I am. So my question is: what's the actual cutoff? Like, how much do two people have to be alike, in reasoning style or situation, before superrationality kicks in and becomes valid? Is it something you can estimate, like a similarity score, where above it I should reason as if we'll mirror eachother and below it I fall back to normal game theory? And in the promotion case, does it even apply, since only one of us can win — if superrational reasoning says we'd both pick the same strategy, does that mean we should both pick "go all out," or both pick "split the effort," or does the whole thing break when the game is zero-sum?

  I guess what I really want is a practical way to use this. If I could put even a rough number on the similarity threshold I could apply it to alot of stuff in my life — the chores, the promotion, even group buys with my roommates. Does anyone know if there's a worked-out version of this, like a sliding scale between fully rational and fully superrational? Or am I maybe drawing the line in the wrong place, and the question isn't similarity at all?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Query:**
      *   **Context:** The user lives with three other guys and has been applying Douglas Hofstadter's concept of "superrationality" (from *Metamagical Themas*) to household chores. It seemed to work (they cleaned, assuming others would too if they reasoned alike, avoiding the tragedy of the commons).
      *   **Current Problem:** A promotion competition at work with a specific coworker.
      *   **The Conflict:** The user wants to apply superrationality (SR) here, but realizes the coworker isn't a "copy" (different background, constraints, personality).
      *   **Core Questions:**
          1.  What is the "cutoff" for similarity? Is there a similarity score/threshold for SR to apply?
          2.  Does SR apply to zero-sum games (only one promotion)?
          3.  Is there a practical, sliding-scale version of SR?
          4.  Am I drawing the line in the wrong place (is similarity the wrong metric)?

  2.  **Deconstruct Superrationality (Hofstadter's Concept):**
      *   *Definition:* Superrationality assumes that in a symmetric game with rational players, all players will arrive at the *same* answer because they are using the *same* logic. Therefore, my decision *is* the decision of the others.
      *   *Key Assumption:* Symmetry of reasoning and situation.
      *   *Hofstadter's Luring Lottery:* Showed that people *don't* actually behave superrationally in practice.
      *   *Application to Prisoner's Dilemma:* SR suggests cooperation because if I cooperate, the other (being identical in reasoning) will too.
      *   *Application to Zero-Sum:* SR breaks down here. If the game is strictly zero-sum (one winner), and we reason identically, we arrive at a paradox. If we both "go all out," we waste resources. If we both "hold back," it's a tie (or random).

  3.  **Address the Specific Questions:**

      *   **Q1: The Similarity Cutoff/Threshold.**
          *   *Reality Check:* There is no mathematical "similarity score" in standard game theory or Hofstadter's original text. SR is a binary philosophical stance: either you assume the other is a logical clone, or you don't.
          *   *Nuance:* In reality, reasoning is correlated, not identical. This leads to *Evidential Decision Theory (EDT)* vs. *Causal Decision Theory (CDT)*.
          *   *Practical Answer:* You can't put a number on it. It depends on *correlation of action*, not just personality.

      *   **Q2: Zero-Sum Games (The Promotion).**
          *   *Crucial Point:* SR is designed for *non-zero-sum* dilemmas (like Prisoner's Dilemma or the Tragedy of the Commons/Chores).
          *   *The Promotion:* This is largely zero-sum (one gets the job). If both "go all out," the relative advantage might remain the same, but absolute cost increases (burnout).
          *   *SR Implication:* If we are superrational clones in a zero-sum game, we should flip a coin. Fighting is wasteful. But since they aren't clones, and the boss decides, "going all out" might actually be necessary to signal value.
          *   *Verdict:* SR is dangerous here. It might lead to under-preparing based on a false hope of coordination.

      *   **Q3: Practical Application/Sliding Scale.**
          *   *Concept:* "Quasi-superrationality" or correlated equilibrium.
          *   *Advice:* Don't look for a threshold. Look at *incentives* and *feedback loops*.
          *   *Chores vs. Promotion:* Chores are a coordination game (everyone wins if clean). Promotion is a competition (one wins). SR works for coordination; it fails for competition.

      *   **Q4: Drawing the Line in the Wrong Place.**
          *   *Insight:* The user is asking about *similarity of person*, but SR is about *similarity of situation and reasoning process regarding the specific decision*.
          *   *The Chores Success:* Why did it work? Probably not SR. Probably just that one person cleaning breaks the stalemate (focal point), or the user got lucky. The others didn't necessarily clean *because* the user cleaned; they might have cleaned because the kitchen was suddenly clean (social pressure).
          *   *The Work Risk:* Assuming the coworker mirrors you is risky.

  4.  **Drafting the Response (Iterative Process):**

      *   *Tone:* Empathetic, intellectually rigorous but practical, slightly cautionary.
      *   *Structure:*
          1.  Validate the intuition (Hofstadter is cool, chores make sense).
          2.  Address the "Similarity Threshold" (It doesn't exist formally, but correlation matters).
          3.  Address the Zero-Sum Problem (The Promotion is different from Chores).
          4.  Provide a Practical Framework (When to use SR vs. Standard Game Theory).
          5.  Specific Advice on the Promotion.

      *   *Refining the "Chores" Analysis:* I need to gently point out that the chore success might not have been SR. In a multi-player stalemate, one person acting often breaks the psychological barrier for others, regardless of their reasoning. It's a "focal point" or "leadership" dynamic, not necessarily logical mirroring.

      *   *Refining the "Promotion" Analysis:* This is the danger zone. If the user holds back because "he'll hold back too," and the coworker *doesn't*, the user loses. The coworker has different constraints (kids), so their utility function is different. SR requires symmetric utility functions.

      *   *Introducing "Correlated Equilibrium":* This is the game-theory term that bridges the gap. It allows for signals and correlation without assuming identical cloning.

      *   *Actionable Advice:*
          *   Chores: Keep doing what works (leadership/signaling).
          *   Promotion: Treat as asymmetric competition. Don't use SR.
          *   General Rule: Use SR for cooperative problems with shared outcomes. Use Standard Game Theory for competitive problems with winners/losers.

  5.  **Final Polish:**
      *   Make sure to explicitly answer the "cutoff" question (There isn't one, but here's how to judge).
      *   Clarify the Zero-Sum breakdown.
      *   Warn against the "Magical Thinking" trap of SR.

  6.  **Self-Correction/Safety Check:**
      *   *Did I dismiss Hofstadter too harshly?* No, acknowledge the philosophical value but highlight the practical limitations.
      *   *Is the advice safe?* Yes, advising caution in a career competition is safer than advising magical thinking.
      *   *Is the distinction between Chores and Promotion clear?* Yes, Common Good vs. Zero-Sum.

  7.  **Final Output Generation:** (This matches the detailed response provided previously.)
answer: |-
  This is a fascinating application of decision theory to real life. It is great that you are thinking critically about how you make decisions, but there is a significant danger in misapplying superrationality, specifically in the promotion scenario.

  Here is the breakdown of why your chore success happened, why the promotion is a different beast, and the answer to your question about a "similarity threshold."

  ### 1. The "Similarity Threshold" Does Not Exist
  You asked for a number or a sliding scale where superrationality kicks in. The hard truth is: **There is no formal metric for this.**

  Hofstadter's concept of superrationality relies on a very specific, almost magical premise: *I know that the other player is reasoning exactly as I am, therefore my decision causes theirs.*

  In standard Game Theory (Causal Decision Theory), your decision cannot *cause* the other person's decision. In Superrationality (closely related to Evidential Decision Theory), you treat your decision as *evidence* of what the other will do.

  **The Practical Cutoff:**
  Instead of a similarity score, look for **Symmetry of Incentives**.
  *   **High Symmetry:** You and the other person want the exact same outcome, face the exact same costs, and have the exact same information. (e.g., The Chores).
  *   **Low Symmetry:** You want different outcomes, or the costs/benefits differ wildly. (e.g., The Promotion).

  In your house, you all want a clean kitchen, and the cost of cleaning is roughly similar for all of you. That is high symmetry.
  At work, you want the promotion. He wants the promotion. **But:** He has kids (higher cost to weekend studying). He is "cutthroat" (different utility function regarding aggression). You are different people. **The symmetry is broken.**

  If you apply superrationality when symmetry is broken, you are essentially engaging in magical thinking. You are assuming he will mirror you, but his "algorithm" is running on different hardware with different constraints.

  ### 2. The Zero-Sum Problem (The Promotion)
  This is the most critical point. Superrationality is designed to solve **Prisoner's Dilemmas** (where mutual cooperation yields a better result than mutual defection). It is not designed for **Zero-Sum Competitions**.

  *   **The Chores (Non-Zero-Sum):** If we both clean, the kitchen is *very* clean (Good). If I clean and you don't, I'm annoyed but kitchen is clean (Okay). If neither clean, it's a disaster (Bad). Superrationality works here to push toward the "Both Clean" equilibrium.
  *   **The Promotion (Zero-Sum):** Only one person wins.
      *   If we are truly superrational clones in a zero-sum game, the logical move is to **flip a coin** and let the winner take it without expending resources. Fighting is wasteful for the "collective us."
      *   **However,** you are not clones, and the boss is the arbiter. If you decide "we should both hold back to save energy," and he decides "I need this money for my kids, I'm going all out," **you lose.**

  In a competition where only one can win, superrationality creates a paradox. If you assume he mirrors you, you might under-prepare. If he *doesn't* mirror you (because he isn't you), you are strategically disadvantaged.

  ### 3. Why the Chores Actually Worked (It wasn't Superrationality)
  You feel the system worked in the house, and I'm glad it did. But it likely wasn't because your roommates are superrational logicians mirroring your code.

  It was likely a **Focal Point (Schelling Point)** dynamic.
  In a stalemate, everyone is waiting for a signal. By cleaning, you didn't just "do the math"; you broke the psychological tension. You signaled that *this is the week we reset.* Your roommates likely cleaned (or stopped making messes) because of **reciprocity and social norms**, not because they logically deduced your decision process.

  They saw the clean kitchen and thought, "Oh, [User] is taking care of it, I should chip in so I don't look like a jerk." That is standard social game theory, not Hofstadterian superrationality.

  ### 4. A Practical Framework for Your Life
  You want a practical way to use this. Do not look for a similarity score. Instead, categorize the situation into one of three buckets:

  **Bucket A: Common Good / Coordination (Use Superrational Thinking)**
  *   *Examples:* Chores, group buys, holding the door, not cutting in line.
  *   *Logic:* We all win if we all do X. We all lose if we all do Y.
  *   *Strategy:* Act as if your action sets the norm. Lead by example. Assume that if you cooperate, it increases the probability others will cooperate (via social signaling, not magic).

  **Bucket B: Asymmetric Competition (Use Standard Game Theory)**
  *   *Examples:* Promotions, salary negotiations, sports, litigation.
  *   *Logic:* My gain is your loss (or partially so). Our constraints are different.
  *   *Strategy:* **Do not use superrationality.** Analyze his incentives specifically.
      *   *He has kids:* He might be more desperate for the money, OR he might be less willing to work weekends. You need to know which.
      *   *He is cutthroat:* He is likely playing standard Nash Equilibrium strategy (maximize self-interest regardless of you).
      *   *Your Move:* Maximize your own preparation. Do not assume he will match your effort level.

  **Bucket C: Repeated Games (Use "Tit-for-Tat")**
  *   *Examples:* Ongoing projects with the same team, long-term roommate dynamics.
  *   *Logic:* We will interact again.
  *   *Strategy:* Start cooperative. If he defects (slacks off), you defect (stop covering for him). If he cooperates, you continue. This is more robust than superrationality because it punishes those who *don't* mirror you.

  ### Summary Advice for the Promotion
  **Drop the superrationality for the promotion.**
  The risk profile is too high.
  1.  **Symmetry is low:** Different life constraints mean different "costs" of effort.
  2.  **Game is Zero-Sum:** If you both "go all out," you burn out, but one still wins. If you "hold back" hoping he does too, and he doesn't, you lose the promotion and the training.
  3.  **The Boss Factor:** The decision isn't made by you and him; it's made by a third party. Your effort signals value to the boss independently of what your coworker does.

  **The Verdict:**
  Keep using the "superrational" mindset for **cooperative** scenarios (chores, group gifts, community norms). It fosters a healthy mindset of leadership and responsibility.

  But for **competitive** scenarios (promotions, negotiations), revert to standard rationality. Assume the other player is optimizing for *their* benefit, not mirroring *your* logic. Prepare for the cert. Go to the boss. Don't leave your career to a philosophical gamble.

  There is no sliding scale number. The switch flips based on one question: **"Do we both win if we both do the right thing?"**
  *   If Yes (Chores): Act superrationally.
  *   If No (Promotion): Act strategically.
