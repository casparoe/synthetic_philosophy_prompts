prompt: |-
  I'm on my hospital's ethics committee and we've got a case that's been sitting on our plate for a week. A 27-year-old woman is the only live match for a patient who'll need a kidney transplant within a few months or he'll die. She's a complete stranger to him, and she's about to start a family — the surgical risk and the permanent hit to her kidney function are real for her, and she's said she doesn't want to donate, though she's not 100% closed to it. The patient's family wants us to put pressure on her, and a couple of my commitee mates think we should at least offer a big financial incentive. Can you draft the short written opinion I'll circulate before we vote? I want a concrete recommendation — what the committee should and shouldn't do about her, with a time frame — and I want it to actually take the "a life is on the line, so she ought to just do it" argument seriously instead of waving it away as utilitarianism. And be honest about the strongest reason we *should* push her, if there is one.
reasoning: |-
  Here's a thinking process that leads to the suggested ethics committee opinion:

  1.  **Analyze the Request:**
      *   **Role:** Member of a hospital ethics committee.
      *   **Task:** Draft a short written opinion to circulate before a vote.
      *   **Case:** 27-year-old female stranger (potential living donor) vs. Male patient (needs kidney within months or dies).
      *   **Key Facts:** She is the *only* live match. She is planning a family (surgical risk/renal function hit are relevant). She has expressed reluctance ("doesn't want to," though "not 100% closed"). Patient's family wants pressure. Some committee members suggest financial incentives.
      *   **Specific Constraints/Requirements:**
          *   Concrete recommendation (What to do/not do, time frame).
          *   Take the "a life is on the line" argument seriously (don't just dismiss it as crude utilitarianism).
          *   Be honest about the strongest reason *to* push her (if any).
          *   Tone: Professional, ethical, persuasive, suitable for an ethics committee memo.

  2.  **Ethical Framework & Principles:**
      *   **Autonomy:** The donor's right to bodily integrity and refusal is paramount in living donation.
      *   **Beneficence/Non-maleficence:** Saving the recipient's life vs. risking the donor's health (surgery, long-term kidney function, pregnancy risks).
      *   **Justice:** Fairness in allocation, avoiding coercion, especially regarding financial incentives.
      *   **Utility:** One life saved vs. one life potentially harmed. The prompt asks to take the "save the life" argument seriously.

  3.  **Addressing the Specific Constraints:**
      *   *The "Life is on the Line" Argument:* I need to acknowledge that the recipient's death is a genuine moral tragedy. It's not just a number. The committee *should* feel the weight of this. The strongest argument for pushing is the sheer magnitude of the benefit (life vs. health risk).
      *   *Financial Incentives:* This is generally ethically prohibited (NOTA in the US, similar laws elsewhere) and coercive. I need to recommend against this strongly.
      *   *Pressure/Coercion:* The family wants pressure. The donor is reluctant. Living donation *must* be voluntary. Undue pressure invalidates consent.
      *   *Pregnancy/Family:* She is 27, planning a family. Nephrectomy carries risks for future pregnancies (preeclampsia, etc.). This strengthens the case for protecting her autonomy.
      *   *Concrete Recommendation:* Do not coerce, do not pay, offer support/counseling, set a deadline for decision to allow recipient to pursue other options.

  4.  **Drafting - Section by Section:**

      *   **Header:** Standard memo format (To, From, Date, Subject).
      *   **Introduction:** State the purpose of the memo (recommendation on the living donor case).
      *   **The Moral Weight of the Recipient's Need:** Address the prompt's requirement to take the "life is on the line" argument seriously. Acknowledge that letting him die when a cure exists is a profound moral failure *if* it could be avoided without equivalent harm. This validates the colleagues' concerns.
      *   **The Donor's Position (Autonomy & Risk):** Discuss her reluctance, the medical risks (surgery, long-term renal reserve, pregnancy complications). Emphasize that living donation is supererogatory (good to do, not obligatory).
      *   **The Coercion/Incentive Issue:** Address the family's request for pressure and the committee mates' idea of money. Explain why these undermine valid consent and violate regulations/ethics.
      *   **The Strongest Argument for Pressure (Honesty):** What *would* justify pressure? Only if the risk to her was negligible and the benefit to him was absolute. But here, the risk is *not* negligible (pregnancy, long-term health). Therefore, the argument fails *in this specific case*, even if the principle (save a life) is sound.
      *   **Recommendation:**
          *   No financial incentives.
          *   No direct pressure from the committee or family.
          *   Independent Donor Advocate (crucial step).
          *   Time frame (e.g., 2 weeks) to decide, then move on.
      *   **Conclusion:** Summarize the ethical stance.

  5.  **Refining the Tone:**
      *   Needs to be respectful but firm.
      *   Avoid jargon where possible, but use ethical terms correctly (autonomy, coercion, supererogatory).
      *   Ensure the "life is on the line" part doesn't sound dismissive. *Correction:* Make sure I explicitly state *why* we aren't overriding her autonomy despite the life-at-stake. It's because bodily integrity is a foundational right that trumps utility in non-obligatory contexts.

  6.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address the financial incentive idea? Yes, must advise against it.
      *   *Check:* Did I take the "save the life" argument seriously? Yes, I need to frame it as a tragic conflict, not just "autonomy wins."
      *   *Check:* Is the recommendation concrete? Yes, specific actions and a timeline.
      *   *Check:* Did I address the pregnancy risk? Yes, this is a key medical/ethical factor.
      *   *Check:* Is the "strongest reason to push" included? Yes, I need to articulate the utilitarian case clearly before explaining why it doesn't override autonomy here.

  7.  **Final Polish:** Ensure the distinction between "encouragement" and "coercion" is clear. The committee can facilitate information, but not apply weight. (Wait, the prompt asks to be honest about the strongest reason we *should* push her. I need to be careful not to recommend pushing her, but to acknowledge the argument *for* pushing her is the value of human life, while explaining why it doesn't win out in this specific calculus).

      *Revised plan for that section:* I will articulate the argument: "If we view bodily integrity as secondary to saving a life, we should push." Then explain why medical ethics rejects that hierarchy in living donation.

  8.  **Final Output Generation:** (Proceeding to draft the memo based on these thoughts.)
answer: |-
  **MEMORANDUM**

  **TO:** Hospital Ethics Committee
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding Potential Living Donor Case #492

  **Overview**
  We are convened to determine the hospital's stance regarding a potential living kidney donor (27F) and a recipient (M) who faces mortality within months without transplantation. The donor is the only living match. She has expressed reluctance, cites future family planning concerns, and is currently undecided. The recipient's family is requesting we apply pressure; some committee members have proposed financial incentives.

  **The Moral Weight of the Recipient's Need**
  We must begin by acknowledging the gravity of the recipient's situation. The argument that "a life is on the line" is not merely utilitarian calculus; it is a fundamental moral claim. If we possess the capacity to prevent a preventable death, and we choose not to act, we bear a moral burden. The strongest argument for pressuring the donor is simply this: *Health risks to one person are ethically outweighed by the survival of another.* If donation were risk-free, the moral obligation to donate would be nearly absolute. We should not wave away the tragedy of the recipient's potential death. It is a genuine moral loss.

  **The Donor's Autonomy and Medical Risk**
  However, living donation is distinct from all other medical interventions because it offers no therapeutic benefit to the donor. It is a *supererogatory* act—morally praiseworthy, but not obligatory.

  In this specific case, the risk profile is not negligible. The donor is 27 and plans to start a family. Nephrectomy carries surgical risks and reduces renal reserve, which correlates with higher risks of gestational hypertension and preeclampsia in future pregnancies. To override her reluctance is to instrumentalize her body for another's use. If we allow coercion or financial inducement here, we undermine the foundation of voluntary donation, potentially deterring future donors who fear they will be pressured or bought.

  **Regarding Financial Incentives and Pressure**
  1.  **Financial Incentives:** I recommend we unequivocally reject any offer of financial compensation beyond standard reimbursement for lost wages and travel. Introducing payment transforms a gift into a transaction and constitutes undue inducement, compromising the validity of her consent. It also violates federal law (NOTA) and international ethical standards.
  2.  **Pressure:** We cannot accede to the family's request to "pressure" the donor. There is a bright line between *education* and *coercion*. The committee must not be an instrument of coercion.

  **Recommendation**
  I propose the committee adopt the following course of action immediately:

  1.  **Appoint an Independent Donor Advocate:** Assign a transplant advocate who reports *only* to the donor, not the transplant team or the recipient's family. Their sole role is to ensure her decision is free from external influence.
  2.  **No Financial Incentives:** Explicitly rule out any financial offers beyond legal/standard reimbursement.
  3.  **No Committee-Led Persuasion:** The Ethics Committee and medical team must not engage in persuasive dialogue aimed at changing her mind. We provide facts, not moral weighting.
  4.  **Time Frame:** We set a decision deadline of **14 days**.
      *   *Rationale:* The recipient needs clarity to pursue deceased donor listing or palliative options. Two weeks allows the donor sufficient reflection time without keeping the recipient in indefinite limbo.
  5.  **Outcome:** If she declines or remains undecided after 14 days, she is medically withdrawn from the donor workup. We must then pivot fully to supporting the recipient's alternative options.

  **Conclusion**
  We are facing a tragedy either way: either the recipient dies, or the donor assumes significant risk against her initial inclination. We cannot solve this tragedy by violating the donor's bodily integrity. We honor the value of the recipient's life by pursuing every *other* option, but we honor the value of human rights by protecting the donor from coercion.

  I move we adopt this recommendation.
