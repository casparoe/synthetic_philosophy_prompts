      *   The user suspects the slip is between "not empirically assessable" and "having no shared content." This is correct.
      *   **Step 3 is the primary target.** It assumes total incommensurability. Wittgenstein acknowledges "language-games" are distinct, but human forms of life overlap (pain, death, fear, hope).
      *   **Step 2 is the secondary target.** "Constituted by" implies closure. A better reading is "regulated by" or "given sense within."
      *   **Step 7 is also contestable.** Does W actually claim outsiders *genuinely* misunderstand in a way that implies shared content, or does he say they are simply playing a different game? (This is where the scholarship debate lies).

