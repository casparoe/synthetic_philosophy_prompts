prompt: |-
  I'm writing a master's dissertation on the Frege–Geach problem for expressivism, and I've reached the point where I can no longer tell whether the literature is advancing or running on the spot, so I want a diagnosis rather than another survey. The shape of the standoff as I see it: everyone agrees on the data — that "stealing is wrong" contributes the same thing in unembedded and embedded occurrences, that arguments like modus ponens over moral conditionals are valid, and that the antecedent of such a conditional is not asserted — and both camps agree that the expressivist owes some story about complex sentences. The quasi-realist wing keeps producing stories of that kind (higher-order attitudes toward attitudes, planning-states over hyperplan-type contents, commitment-based logics, and so on) and concludes that the original challenge was a technical problem with a technical solution, so nothing of philosophical substance is left for the realist to press. The critics keep replying that any such story either covertly assigns moral sentences truth-conditions and representational contents, in which case it has conceded the interesting claim, or explains only why speakers are disposed to reason in the valid pattern without explaining why the pattern is valid, which they say is a confusion of a psychological prediction with a logical one. Each side accuses the other of having quietly redefined the task, and nothing I've read changes anyone's mind.

  The particular place my group got stuck is what my supervisor has started calling the tower problem, and I'd like you to engage with it directly rather than with the standard one-level case. Take a construction in which a moral predicate sits inside an attitude report that is itself the subject of a further moral predication, and then iterate: from "stealing is wrong" to "Ben's believing that stealing is wrong is not itself wrong" to "Anna's believing that Ben's believing that stealing is wrong is not wrong is not wrong", and so on without bound. The two strategies I've seen for handling embedding seem to generalise very differently here. Call one attitude-inheritance: the complex sentence expresses an attitude of the same broad kind toward the attitudes expressed by its parts, so the tower is climbed by iterating that relation. Call the other content-inheritance: the embedded occurrence contributes a content that the whole sentence then takes some further attitude toward, so the tower is climbed by keeping the content fixed and composing attitudes around it. My sense is that attitude-inheritance makes the validity of deep inferences look like a lucky structural fact about the attitude hierarchy, while content-inheritance looks more and more like a truth-conditional semantics with the word "attitude" substituted for "truth", but I can't get either worry into a form the other side will grant.

  My working hypothesis, which I offer only as a hypothesis, is that the stalled part of this dispute is not really about whether the inferences can be validated — I think both sides can produce a procedure, and the tower only sharpens the question — but about what an answer to a challenge like Geach's is supposed to be: whether a compositional account of the states expressed by complex sentences discharges the explanatory burden, or whether the burden is precisely to give truth-conditions and nothing weaker counts as meeting it. If that's right, some of the dispute may be verbal, about "semantics", "representation", and "explanation", and some of it may be a genuine second-order disagreement about what a theory of meaning is for. I'd like you to tell me which parts are which, using what each side actually commits itself to, and to say honestly whether the tower problem raises anything that the ordinary Frege–Geach problem doesn't. I don't want a literature survey, a reading list, or a guide to who said what when; I want the structure of the disagreement, the reasons for your diagnosis, and — given it — a concrete account of what would count as progress: a formal result, a distinction, a change of question, or an argument that no progress should be expected. Please answer in British English.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** A Master's student writing a dissertation on the Frege-Geach (FG) problem for expressivism.
      *   **Current State:** Stuck. Feels the literature is stagnant ("running on the spot"). Wants a *diagnosis*, not a survey.
      *   **Specific Focus:** The "Tower Problem" (iterated embedding of moral predicates within attitude reports which are themselves morally evaluated).
      *   **Key Distinction:** Attitude-inheritance vs. Content-inheritance strategies.
      *   **Working Hypothesis:** The dispute isn't about *whether* inferences can be validated, but about *what counts* as an answer (explanatory burden: compositional account of states vs. truth-conditions).
      *   **Requirements:**
          *   Engage directly with the Tower Problem.
          *   Distinguish verbal disputes from genuine second-order disagreements.
          *   Use British English.
          *   No literature survey/reading list.
          *   Provide a concrete account of what counts as progress (formal result, distinction, etc.).
          *   Tone: Philosophical, rigorous, diagnostic, honest.

  2.  **Deconstruct the "Tower Problem":**
      *   *Base:* "Stealing is wrong" (Expressivism: Disapproval of stealing).
      *   *Level 1:* "Ben's believing that stealing is wrong is not itself wrong."
          *   Expressivist challenge: What attitude is expressed here? Disapproval of Ben's believing? Or something about the content of Ben's belief?
      *   *Level 2:* "Anna's believing that [Level 1] is not wrong."
      *   *Issue:*
          *   *Attitude-inheritance:* Expresses a higher-order attitude toward the lower-order attitude. Risk: Validity becomes contingent on the psychology of the hierarchy. Does disapproving of disapproving of disapproving logically entail X? It looks like a structural accident.
          *   *Content-inheritance:* The embedded part contributes a "content" (proposition-like). Risk: If the content is stable across embeddings, isn't it just a truth-condition? If "stealing is wrong" has the same content in the antecedent of a conditional or inside a belief report as it does standalone, haven't we conceded cognitivism?

  3.  **Evaluate the Working Hypothesis:**
      *   The user suspects the stalemate is about *explanatory burden* (what is a theory of meaning for?).
      *   *Assessment:* This is largely correct. The Realist says meaning *is* truth-conditions (or representation). The Expressivist says meaning is *use* (expression of non-cognitive state). The FG problem forces the Expressivist to mimic the Realist's structural advantages.
      *   *Verbal vs. Genuine:*
          *   *Verbal:* Arguments over labels ("truth", "proposition", "fact"). Quasi-realists (Blackburn, Gibbard) are happy to earn the right to these terms.
          *   *Genuine:* The nature of logical validity. Is validity preservation of truth (Realist) or consistency of attitudes (Expressivist)? If the latter, does it capture the *normativity* of logic?

  4.  **Drafting the Diagnosis (Section by Section):**

      *   **Introduction:** Acknowledge the sophistication of the query. Validate the feeling of stagnation. State the thesis: The Tower Problem exposes a fault line in the *metaphysics of logic*, not just semantics.
      *   **The Tower Problem Analysis:**
          *   Does it add anything to standard FG? Yes. Standard FG is about conditionals (A, If A then B, therefore B). Tower is about *iterative normativity* or *iterative attitude*.
          *   *Attitude-Inheritance:* Leads to an explosion of attitude types. To validate inferences across levels, you need a logic of attitudes. Is "disapproval of disapproval" a stable logical operator? It risks psychologism.
          *   *Content-Inheritance:* Leads to "propositionalism". If the content is invariant, why call it expressivism?
          *   *Diagnosis:* The Tower shows that *stability of content* is required for *iterative validity*. Expressivism struggles to explain stability without positing content.
      *   **Verbal vs. Genuine Disagreement:**
          *   *Verbal:* The use of "truth". Quasi-realists define truth expressivistically. Realists define it robustly. They talk past each other here.
          *   *Genuine:* The *source* of validity. Realist: Mind-independent relations between contents. Expressivist: Mind-dependent consistency of commitments. The Tower highlights this: Is the validity of the Level 2 inference grounded in the world or in the agent's planning state?
      *   **The Explanatory Burden (The Core):**
          *   The user's hypothesis is right. The Realist demands truth-conditions because they think only truth-conditions explain validity *normatively*. The Expressivist thinks explaining the *psychological possibility* of reasoning is enough.
          *   The Tower shows that psychological possibility isn't enough for *iterative* norms.
      *   **Pathways to Progress:**
          *   What would count?
          *   1. A formal proof that attitude-logics collapse into truth-conditional logics under iteration (The "Collapse Argument").
          *   2. A clear distinction between *logical validity* and *rational coherence* that both sides accept.
          *   3. Acceptance that the dispute is metaphysical (are there moral properties?) rather than semantic.

  5.  **Refining the Argument (Self-Correction/Nuance):**
      *   *Caution:* Don't just say "Expressivism fails." The prompt asks for a diagnosis of the *standoff*.
      *   *Nuance:* Gibbard's *Thinking How to Live* tries to handle this with hyperplans. Does the Tower break hyperplans? Hyperplans are functions from worlds to actions. Iterating them might work, but does it preserve the *expressive* core?
      *   *Key Insight:* The Tower Problem forces the Expressivist to admit that the *semantic value* of the embedded clause must be independent of the *force* of the main clause. Once you admit that, the distance to Cognitivism shrinks.
      *   *British English:* Ensure spelling (realise, programme, behaviour, etc.) and tone (slightly more reserved/academic).

  6.  **Finalizing the Structure:**
      1.  **Diagnosis of the Standoff:** Confirm the user's hypothesis about explanatory burden.
      2.  **The Tower Problem specifically:** Why it's harder than standard FG. (Iterative normativity).
      3.  **Attitude vs. Content Inheritance:** Analyze the user's distinction. Show why both lead to the same bottleneck.
      4.  **Verbal vs. Substantive:** Disentangle the terminology from the metaphysics.
      5.  **Criteria for Progress:** Concrete suggestions for the dissertation.

  7.  **Drafting the Content (incorporating British English):**
      *   *Check:* "realise" not "realize", "behaviour" not "behavior", "programme" (if used), "centre".
      *   *Tone:* Academic, direct, avoiding fluff.

      *(Self-Correction during drafting)*: I need to be careful not to simply repeat the standard FG problem. The Tower is about *embedding within attitude reports that are themselves morally evaluated*. This is meta-ethics about meta-ethics. It tests the *recursion* of the expressivist semantics.
      *   *Example:* "It is wrong to believe that stealing is wrong." (Error theory about moral belief?).
      *   *Example:* "It is not wrong to believe that stealing is wrong." (Toleration).
      *   If expressivism says "Stealing is wrong" = Boo Stealing.
      *   Then "Believing stealing is wrong" = Believing(Boo Stealing).
      *   Then "It is wrong to believe..." = Boo(Believing(Boo Stealing)).
      *   The Tower asks: What is the logical relation between Boo(Stealing) and Boo(Boo(Stealing))?
      *   If there is no logical relation (just psychological), validity is lost. If there is a logical relation, the "Boo" is acting like a truth-functional operator.

      *   *Conclusion on Progress:* The progress lies in admitting that the semantic value *must* be proposition-like to handle the Tower, forcing a choice: either accept a hybrid view or admit that 'expressivism' is a theory of *speech act* not *semantics*.

  8.  **Final Polish:** Check against constraints. No reading list. Direct engagement. British English.

      *(Final thought on the "Tower"):* The Tower Problem is essentially a recursion problem. If the semantic value of $P$ is an attitude $A$, and the semantic value of $Q(P)$ is an attitude $A'$ toward $A$, then to validate inferences involving $Q(P)$ and $P$, we need a logic of $A$. If we iterate, we need a logic of logics of $A$. This looks suspiciously like a logic of propositions. The diagnosis should highlight this structural pressure.

