answer: |-
  Your diagnosis of the stalemate is astute, and your working hypothesis is largely correct: the dispute has shifted from a first-order semantic problem to a second-order disagreement about the metaphysics of logic and the explanatory burden of a theory of meaning. However, the Tower Problem you describe does not merely sharpen the ordinary Frege–Geach problem; it exposes a structural vulnerability in expressivist semantics that the standard conditional cases can obscure.

  Here is a diagnosis of the standoff, an analysis of the Tower Problem's specific contribution, and a concrete account of what would constitute progress in your dissertation.

  ### 1. The Structure of the Disagreement

  You are right to suspect that the impasse is not about whether a formal system can be constructed. Both camps can produce a calculus. The realist employs classical truth-conditional semantics; the expressivist employs a logic of consistency among non-cognitive states (e.g., Gibbard's hyperplans or Blackburn's commitment logic). The disagreement is about what that calculus *models*.

  **The Verbal Dispute:**
  A significant portion of the noise is verbal, centreing on the terms 'truth', 'proposition', and 'fact'. Quasi-realists argue that once we have explained the logical behaviour of moral sentences, we have earned the right to call them 'true' or 'factual' in a deflationary sense. Realists insist that this is a bait-and-switch: if 'truth' does not involve robust correspondence or mind-independent correctness conditions, it is not the sort of truth that grounds logical validity.
  *   **Diagnosis:** This is largely verbal. If the expressivist grants that moral sentences behave *as if* they have truth-conditions for the purposes of logic, the realist's complaint that they lack *robust* truth-conditions becomes a metaphysical objection, not a semantic one.

  **The Genuine Disagreement:**
  The substantive core is the **source of normativity**.
  *   **The Realist:** Validity is the preservation of truth. Truth is a property of contents independent of the agent's attitudes. Therefore, logic is normative for thought because it tracks mind-independent relations.
  *   **The Expressivist:** Validity is the consistency of commitments. Logic is normative because inconsistency is a practical failure of planning or attitudinal coherence.
  *   **The Clash:** The Realist charges that the Expressivist reduces logical necessity to psychological contingency. If validity is just consistency of attitudes, what condemns a agent who is consistent in their error? The Expressivist replies that there is no 'error' outside of attitudinal inconsistency.

  ### 2. The Tower Problem: Does it Add Anything?

  The ordinary Frege–Geach problem concerns single-level embedding (e.g., conditionals). The Tower Problem concerns *iterated normative evaluation of attitudes*. This raises the stakes significantly.

  Let us formalise your tower slightly:
  1.  $P$: Stealing is wrong.
  2.  $Q(P)$: Believing $P$ is not wrong.
  3.  $R(Q(P))$: Believing $Q(P)$ is not wrong.

  **Attitude-Inheritance Strategy:**
  On this view, $P$ expresses attitude $A$. $Q(P)$ expresses a higher-order attitude $A^*$ toward having $A$. $R(Q(P))$ expresses $A^{**}$ toward having $A^*$.
  *   **The Problem:** To validate an inference from $P$ to $Q(P)$ (or vice versa, or through a conditional linking them), one requires a logical relation between $A$, $A^*$, and $A^{**}$.
  *   **The Diagnosis:** This makes validity look like a 'lucky structural fact', as you put it. Why *must* disapproving of stealing constrain one's attitude toward believing one disapproves of stealing? If the relation is internal to the psychology of the agent, it is contingent. If it is necessary, it looks like the attitudes are merely masking underlying propositional contents. The Tower shows that **attitude-inheritance requires a logic of attitudes that is isomorphic to a logic of propositions.** If the isomorphism is perfect, the 'attitude' label becomes otiose.

  **Content-Inheritance Strategy:**
  On this view, $P$ contributes a content $c$. $Q(P)$ takes an attitude toward $c$. $R(Q(P))$ takes an attitude toward the content of $Q(P)$.
  *   **The Problem:** If $c$ remains stable across all levels of the tower, it functions exactly like a truth-condition. It is the invariant semantic value that allows composition.
  *   **The Diagnosis:** This strategy saves logic by sacrificing the core expressivist claim. If the embedded clause contributes a content that is distinct from the force of the main clause, you have effectively adopted a hybrid view or a cognitivist view with an expressivist gloss on assertion.

  **Does the Tower raise anything new?**
  Yes. The standard Frege–Geach problem can be sidestepped by claiming that the 'content' is a *plan-state* (Gibbard) rather than a representation. The Tower Problem tests the **recursion** of these plan-states. Can a plan-state be the object of a moral evaluation without turning into a proposition?
  *   If I say "It is wrong to plan to steal", I am evaluating a plan.
  *   If I say "It is wrong to believe that it is wrong to plan to steal", I am evaluating a belief about a plan evaluation.
  *   The Tower demonstrates that **semantic values must be iterable**. Attitudes are typically not iterable in the required way without becoming proposition-like. One can believe that $p$, and believe that one believes that $p$. But can one 'disapprove' that one 'disapproves'? Usually, we disapprove of the *object* of the disapproval. To disapprove of the disapproval itself requires the disapproval to be reified as an object. Once reified, it behaves like a proposition.

  Therefore, the Tower Problem strengthens the Realist's claim that the explanatory burden cannot be met by attitudes alone. It suggests that **compositionality requires propositional contents**, regardless of whether those contents are ultimately 'truth-apt' in a robust sense.

  ### 3. Diagnosis of the Standoff

  Your hypothesis that the dispute is about the **explanatory burden** is correct, but it requires refinement. It is not merely about whether a compositional account discharges the burden, but about **what compositionality demands**.

  1.  **The Expressivist Concession:** To solve the Tower, the expressivist must admit that the semantic value of a moral sentence is distinct from the illocutionary force of asserting it. (This is the Content-Inheritance route).
  2.  **The Realist Concession:** To engage with the expressivist, the realist must admit that truth-conditions alone do not explain the *motivation* to reason morally. (This is why the expressivist started).

  The standoff persists because:
  *   The Expressivist insists that the semantic value can be non-representational (e.g., a set of hyperplans).
  *   The Realist insists that anything that plays the semantic role of a proposition (compositionality, iterability, logical invariance) *is* a representation.

  They are talking past each other on the definition of 'representation'. However, the Tower Problem forces a choice: **either the semantic value is proposition-like (and the expressivist loses their distinctiveness), or it is not (and the expressivist loses the logic).**

  ### 4. What Counts as Progress?

  Given this diagnosis, a literature survey will not help you. To advance the dissertation, you need to force the issue on one of the following three fronts. Any of these would constitute genuine progress.

  **A. The Collapse Argument (Formal Result)**
  You should investigate whether a formal proof exists (or construct one) showing that any expressivist semantics capable of handling the Tower Problem is **model-theoretically equivalent** to a truth-conditional semantics.
  *   *The Goal:* Show that if an expressivist logic validates the same inferences as classical logic over iterated embeddings, the 'attitude' operators are mathematically reducible to truth-functional operators.
  *   *Why this helps:* It moves the debate from "can we tell a story?" to "is the story distinct?". If the structures are isomorphic, the expressivist claim becomes a metaphysical claim about the nature of the values (plans vs. truths), not a semantic one. This clarifies that the dispute is metaphysical, not linguistic.

  **B. The Normativity Distinction (Conceptual Clarification)**
  Draw a sharp distinction between **Logical Validity** and **Rational Coherence**.
  *   *Proposal:* Argue that the Expressivist can only ever explain Rational Coherence (psychological consistency), whereas the Realist explains Logical Validity (truth preservation).
  *   *The Test:* Apply this to the Tower. In the Tower, does the inference hold because it is irrational to hold conflicting attitudes (Coherence), or because the conclusion *must* be the case if the premises are (Validity)?
  *   *Progress:* If you can show that the Tower inferences feel like Validity (mind-independent) rather than Coherence (agent-relative), you undermine the Expressivist solution. If you can show they are merely Coherence, you undermine the Realist claim that moral logic is 'logic' proper.

  **C. The Hybrid Compromise (Change of Question)**
  Propose that the solution lies in abandoning pure Expressivism.
  *   *Argument:* The Tower Problem shows that moral predicates function as propositional operators when embedded. Therefore, a **Hybrid Expressivism** (where moral sentences express both a belief and an attitude) is the only stable position.
  *   *Progress:* This dissolves the standoff by accepting the Realist's semantic demand (propositions are needed for the Tower) while retaining the Expressivist's psychological insight (attitudes are needed for motivation). Your dissertation could argue that the Frege–Geach problem is not a problem *for* expressivism, but an argument *for* hybridism.

  ### 5. Recommendation for the Dissertation

  Do not attempt to solve the Frege–Geach problem. Instead, use the Tower Problem to demonstrate that the **semantic** version of the problem has been solved at the cost of the **metaphysical** version.

  Your conclusion should be this: The literature is running on the spot because Expressivists are trying to solve a semantic problem (compositionality) with a metaphysical tool (non-cognitive attitudes). The Tower Problem proves that compositionality requires proposition-like contents. Therefore, the Expressivist must either:
  1.  Admit their theory is a theory of **speech acts**, not semantics (conceding the semantic ground to the Realist).
  2.  Admit their theory is a **Hybrid** view (conceding that pure expressivism is untenable).

  **Concrete Step:**
  In your chapter on the Tower, construct the iteration formally. Show that for the inference to be valid at level $n$, the semantic value at level $n-1$ must be invariant. Argue that **invariance under iteration is the definition of a proposition**. If the Expressivist accepts this, they are quasi-realists in name only. If they reject it, they cannot solve the Tower.

  This moves the debate from "Who has the better logic?" to "What is the price of having a logic?". That is a philosophical conclusion, not a survey, and it addresses the stagnation you have identified.
