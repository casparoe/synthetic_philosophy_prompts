      *   *Did I include Self-Ref?* Yes, Claim 4 is about market prices. Plus personal prediction sheet.
      *   *Did I include Arbitrage?* Yes, "Logic Police" rule.
      *   *British English?* Will ensure spellings and idioms are UK standard.
      *   *No citations?* Will avoid naming Garrabrant et al. explicitly in the handout, keep it conceptual.

  9.  **Final Polish:**
