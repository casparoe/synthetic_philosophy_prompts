answer: |-
  # The Deduction Exchange: A Run-Through

  Here is a complete package for your 90-minute session. It's designed to be printed out or projected, with you acting as the Governor of the Exchange.

  ## 1. Setup and Materials

  **Room:** You need a central space where everyone can see a whiteboard or projector. Arrange tables in a U-shape or clusters to encourage haggling.
  **Currency:** "Logic Points" (LP). Start everyone with 1,000 LP. No real money changes hands; the winner gets first pick of pizza or a bottle of wine at the next social.
  **Materials:**
  *   **Claim Cards:** 5 large cards (A4) taped to the wall/board. Each has a space for "Current Price" and "Volume".
  *   **Trading Slips:** Small pads of paper for recording trades (Buy/Sell, Price, Quantity, Signatures).
  *   **Personal Ledger:** A handout for each student to track their own portfolio and, crucially, their *expectations*.
  *   **Timer:** Visible countdown clock.
  *   **The "Gavel":** Something to signal settlement.

  ## 2. The Claims (The Gradient of Logical Depth)

  You need five claims. The truth value of 1–4 is fixed before the session starts. Claim 5 is introduced later.

  *   **Claim A (The Hand-Check):** "The 1,000th digit of $\pi$ is even."
      *   *Status:* Decidable by hand in 10 mins, or by phone in 10 seconds.
      *   *Settlement:* T + 30 mins.
  *   **Claim B (The Laptop-Check):** "The Ramsey number $R(4, 4)$ is less than 18." (It is 18, so this is False).
      *   *Status:* Decidable by a simple script in <1 min, but non-trivial to guess.
      *   *Settlement:* T + 60 mins.
  *   **Claim C (The Hard Nut):** "There exists a prime gap of size > 500 between 10,000 and 10,500."
      *   *Status:* Decidable, but tedious without a specific script. Likely won't be checked in room.
      *   *Settlement:* **Never.** (Final market price determines payout).
  *   **Claim D (The Mirror):** "The median market price of Claim A at T + 30 mins will be $\ge 0.70$."
      *   *Status:* Self-referential. Depends on the group's behaviour.
      *   *Settlement:* T + 75 mins.
  *   **Claim E (The Troll):** Introduced at T + 50 mins. "17 is a prime number."
      *   *Status:* Trivial.
      *   *Settlement:* T + 80 mins.

  ## 3. The Rules of Exchange

  **1. Trading:**
  Students trade "shares" in the claims. A share costs the Current Price (0.00 to 1.00). If the claim resolves TRUE, the share pays 1.00 LP. If FALSE, it pays 0.00 LP.
  *   To move the price: You must post a Bid or Ask on the Claim Card. If someone takes it, the price moves in the direction of the trade (e.g., if a Buy order clears, price ticks up by 0.05).
  *   *Liquidity Rule:* If no one trades a claim for 5 minutes, the Governor (you) forces a trade by buying or selling 10 shares at the current price to unfreeze the market.

  **2. The Arbitrage Clause (The Logic Police):**
  This is the core mechanic. At any time, any student can raise a hand and call "Dutch Book".
  *   **Condition 1:** If a student holds positions where $P(A) + P(\neg A) \neq 1$ (e.g., they are long on both A and Not-A such that they lose in all worlds).
  *   **Condition 2:** If the *Market Price* violates logical implication. (e.g., If Claim X implies Claim Y, but Price(X) > Price(Y)).
  *   **Penalty:** If the challenge is valid, the offender loses 50 LP to the challenger. The market price is forcibly corrected to coherence.
  *   *Note:* For Claim C (The Hard Nut), there is no "Not-C" card. Coherence is only checked against Claims A, B, D, E.

  **3. The Troll Protocol:**
  At T + 50 mins, you (the Governor) introduce Claim E. It is trivially true.
  *   *The Trap:* If the market opens Claim E at 0.50 because "we haven't checked yet", any student can buy unlimited shares at 0.50. This punishes the group for feigning ignorance on axioms.

  **4. Introspection (The Self-Prediction):**
  On their Personal Ledger, at T=0, every student must write:
  *   "I predict the price of Claim B will be ______ at T + 30 mins."
  *   "I predict my own confidence in Claim A will (Increase / Decrease / Stay Same) by T + 30 mins."
  *   Scoring: Accurate predictions of the market earn bonus LP. Accurate predictions of *self* earn double bonus. This rewards knowing your own reasoning process.

  ## 4. Run of Show (90 Minutes)

  *   **00–15: Briefing.** Explain the rules. Hand out ledgers. Have them write their T=0 predictions. Open markets at 0.50 for all claims.
  *   **15–35: Trading Phase I.** Focus on Claim A (Hand-Check). Watch for people pulling out phones vs. doing long division. Watch the price drift *before* settlement.
  *   **35–40: Settlement A.** Reveal the digit. Pay out Claim A. Settle Claim D's condition (record the median price reached).
  *   **40–60: Trading Phase II.** Focus on Claim B (Laptop). One or two CS students might run code. Watch how the info spreads to the philosophers. Does the price jump instantly or drift?
  *   **60–65: Settlement B.** Reveal result.
  *   **65–75: The Troll & The Mirror.** Introduce Claim E (17 is prime). If anyone prices it below 0.95, let the maths students arbitrage them into oblivion. Settle Claim D.
  *   **75–85: Final Freeze.** No more trading. Calculate final portfolios. For Claim C (Unresolved), payout = Final Market Price $\times$ Shares Held. (This simulates the logical induction limit: the price *is* the best guess).
  *   **85–90: Scoring & Debrief Intro.** Announce winners.

  ## 5. Scoring Scheme

  1.  **Trading Profit:** (Final LP - 1000 LP).
  2.  **Arbitrage Bonus:** LP gained from catching incoherent peers.
  3.  **Introspection Bonus:**
      *   50 LP for correctly predicting market direction on Claim B.
      *   100 LP for correctly predicting their own confidence update on Claim A.
  4.  **Penalty:** -100 LP if caught in a Dutch Book.

  ## 6. The Debrief (Mapping Mechanics to Theory)

  This is where you win the argument. Do not lecture; ask questions about what just happened.

  **1. The Gradient of Logical Depth**
  *   *Ask:* "Why did Claim A's price move at minute 20, but Claim C's price barely moved?"
  *   *Point:* Claim A was computationally cheap. The 'uncertainty' wasn't about the maths (which was fixed); it was about the *cost of computation*. Logical uncertainty is uncertainty about the output of a computation you haven't run yet.
  *   *Link:* This counters your mate's view. If probability was just 'ignorance', Claim A and C should look the same (both unknown). But they didn't. The market priced the *effort*, not just the truth.

  **2. Prices as Willingness to Bet, Not Chance**
  *   *Ask:* "When you bought Claim E (17 is prime) at 0.60, did you think there was a 60% chance 17 was prime?"
  *   *Point:* No. You knew it was 100%. You bought it because the *market* was wrong. The price wasn't a credence about the world; it was a measure of the market's computational lag.
  *   *Link:* This is the core of logical induction. Probabilities aren't frequencies; they're betting odds against a bounded reasoner.

  **3. Dutch-Booking by Logic**
  *   *Ask:* "Who lost points to the Logic Police? Why?"
  *   *Point:* You lost points not because the world surprised you, but because your book didn't add up. In standard probability, you get Dutch-booked by *events* (coin flips). Here, you got Dutch-booked by *implications*.
  *   *Link:* This shows that logical constraints act like physical constraints in a betting market. Incoherence is a loss of money, regardless of the truth value.

  **4. Anticipatory Drift vs. Collapse**
  *   *Ask:* "Look at the chart for Claim A. Did the price jump from 0.5 to 1.0 the second I revealed the digit? Or did it creep up?"
  *   *Point:* If your mate is right, the price should be 0.5 until the reveal, then 1.0. But you saw it drift. Why? Because people were doing the work.
  *   *Link:* A good reasoner's probabilities *must* drift before the proof is found. If they only collapse at the end, you aren't reasoning; you're just waiting for the answer key. That's the "mysticism" your mate accused you of—it's actually just tracking computational progress.

  ## 7. Predictable Failure Modes (And How to Handle Them)

  **1. Liquidity Drying Up**
  *   *Risk:* Everyone is shy. Prices stay at 0.50.
  *   *Fix:* You are the Market Maker of Last Resort. If a claim is quiet for 5 minutes, announce: "The Governor is buying 50 shares at 0.55." This forces the students to decide if that's a good price. It jumpstarts the blood in the water.

  **2. The "Whizzes" Cleaning Up**
  *   *Risk:* The two CS students run code for Claim B in minute 16, buy everything at 0.50, and win instantly. Everyone else feels useless.
  *   *Fix:* Cap individual holdings. "No one can hold more than 200 shares in a single claim." This forces the whizzes to trade *with* the philosophers, disseminating the information via price signals rather than just hoarding it.

  **3. Anchoring on 0.50**
  *   *Risk:* Students treat everything like a coin flip because they feel "ignorant".
  *   *Fix:* Use the Troll (Claim E). When you announce "17 is prime" and the price is 0.50, publicly allow the maths students to bankrupt the anchorers. It's painful but educational. It proves that $P(\text{True}) \neq 0.5$ just because you haven't checked.

  **4. Treating it like Football Betting**
  *   *Risk:* "I feel lucky about Claim C."
  *   *Fix:* In the debrief, hammer home that Claim C *has a truth value*. It's not a chance event. If they treated it like a coin toss, they violated the Arbitrage Clause if they also priced related claims differently.

  ## 8. What The Game Can't Reproduce (The "Frank" Bit)

  You must say this out loud in the last 5 minutes, or the CS students will pick the simulation apart.

  1.  **Proof vs. Price:** In the game, you get points for moving the price. In real maths, you get nothing until you have the proof. The game rewards *confidence*, but real logic rewards *justification*. A reasoner can have the right price for the wrong reason (Gettier problems for logic).
  2.  **Asymptotics vs. Tuesday:** Logical Induction says "no trader can exploit you *in the limit*". It doesn't promise you won't be wrong today. You can be Dutch-booked for years on a hard conjecture. The game compresses time; real logical uncertainty is a long, slow grind.
  3.  **The "Laptop" Problem:** In the game, one laptop solves Claim B. In reality, some claims (like Claim C) might be independent of the axioms (undecidable). The game assumes everything is decidable eventually. Real logical uncertainty includes the possibility that the answer *doesn't exist* in the system.
  4.  **Boundedness:** You are 14 humans with one laptop. A real Logical Inductor is a single algorithm managing all resources. You simulated a *market* of reasoners, which is actually a different model (Social Epistemology). A single bounded agent reasons differently than a crowd.

  ## 9. Facilitator's Cheat Sheet (For You)

  *   **If they ask:** "Is the probability of Claim C really 0.6?"
      *   **You say:** "No. The truth is 0 or 1. The 0.6 is the cost of insurance against being wrong before you can check."
  *   **If they ask:** "Why did I lose points on the Arbitrage rule? I didn't know that theorem."
      *   **You say:** "Exactly. Ignorance isn't an excuse for incoherence. If you price A high and B low, and A implies B, you're offering free money. The market doesn't care if you didn't see the implication."
  *   **If the Troll claim (17 is prime) is priced at 0.5:**
      *   **Action:** Don't intervene. Let the maths students destroy the philosophers. It's the most important lesson of the day.

  Good luck on Thursday. If you run this properly, your mate won't just hear your argument; he'll have lost LP to it.
