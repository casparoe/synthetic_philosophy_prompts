  3.  **Drafting the Mechanics (Iterative Process):**
      *   *Trading:* How do they trade? Order books are too complex for 90 mins with 14 people. Let's use a Market Maker model or a simple bilateral trade sheet. Actually, a "Prediction Market" style where they buy/sell from a central bank at current prices is easier to manage. *Correction:* The prompt asks for "order books" specifically. Okay, I need to simplify order books. Let's use a whiteboard for each claim. Students write bids/asks.
