  4.  **Refining the Scoring:**
      *   Need to reward *movement* towards truth before resolution.
      *   Standard Brier Score is good for final accuracy.
      *   To reward *anticipatory drift*, we need to track prices over time.
      *   *Idea:* Divide the game into "epochs". Score based on the price held at the epoch *before* resolution.
      *   *Simpler Idea for Class:* You hold shares. If the claim is True, shares pay £1. If False, £0. Your profit depends on buy/sell timing. This naturally rewards buying early if you think it's true.
      *   *Arbitrage Penalty:* If caught incoherent, you forfeit a % of holdings.

  5.  **Addressing the "British English" Constraint:**
      *   Use "maths", "programme", "centre", "whilst", "reckon", "proper", "mate" (in context), "uni".
