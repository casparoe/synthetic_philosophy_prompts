          *   *The "Then Self" vs. "Now Self" Conflict:* Does a change of mind *during* the process count as revocation? In medicine, if a patient with early dementia resists care mandated by an AD, it's a gray area. In the film, it's explicit.
          *   *Consensus Check:* Acknowledge that bioethicists disagree on whether "precedent autonomy" survives radical psychological change.

