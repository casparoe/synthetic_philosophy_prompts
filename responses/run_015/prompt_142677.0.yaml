      *   *Contested View:* What if the later self is *different*, not just diminished? (Parfit's reductionism). Does "transformative experience" (Paul) invalidate the earlier self's prediction of value? If the later self explicitly objects *in the moment*, does that override the AD? (The "Ulysses Contract" problem).
      *   *The Film's Twist:* It's not dementia (loss of capacity); it's memory erasure (active alteration). The "later" self is arguably *healthier* (less pain) but less *authentic* (less history).

