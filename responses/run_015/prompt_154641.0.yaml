      Actually, looking at the prompt: "Start with a numbered section of agreed claims... about what the ordinary phenomenon is." Okay, I can agree that the phenomenon *exists* without agreeing on the *label*.
      Wait, the prompt says "I want the document to say which is which [verbal vs real]." The Disagreements Table handles the verbal/substantive distinction.
      Okay, I will place the "Stuck" case primarily in the Cruxes as requested ("a case my group hatched... I think is a genuine crux"), but acknowledge the phenomenology in the Agreed Claims.

      *Refining the Empirical Crux:* The prompt suggests ESM with "tempting option isn't sooner at all, just more available or more cue-salient." I need to make sure the predictions are sharp.
      T says: If time is equal, discounting is equal. Choice reflects preference. If you choose the "bad" thing, you must prefer it *now*.
      A says: You can judge X better but choose Y because Y is salient, without preferring Y.
      This is a strong crux.

      *Drafter's Note:* Be honest. T might resist the idea that judgment doesn't flip. A might resist the idea that "preference" is the right metric at all.

  6.  **Final Polish:** Check formatting (Markdown tables, clear headings). Ensure the voice is neutral. (Proceed to generate output).

      *One last check on the "Stuck Akrasia" description:* "Agent hasn't changed her judgment, hasn't revised or abandoned her intention, and isn't pulled by anything temporally nearer — she just doesn't start... irrelevant trigger." I need to make sure this specific description makes it into the Crux section clearly.

      *One last check on the Empirical Design:* "Experience sampling during real temptation episodes... condition where the tempting option isn't sooner at all, just more available or more cue-salient." I will incorporate this specifically.

