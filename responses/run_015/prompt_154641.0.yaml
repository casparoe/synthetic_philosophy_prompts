answer: |-
  # ADVERSARIAL COLLABORATION: THE STRUCTURE OF WEAKNESS OF WILL

  **Date:** October 26, 2023
  **Parties:** The "Temporal" Position (T) & The "Agential" Position (A)
  **Facilitator:** Reading Group Host
  **Subject:** Clarifying the dispute regarding akrasia, discounting, and agency.

  ## 1. AGREED CLAIMS

  Both parties endorse the following claims as a baseline for further inquiry. Endorsement does not imply agreement on the *explanation* of these claims, only their existence or logical status.

  1.  **Phenomenological Reality:** The folk experience of "weakness of will," "loss of control," or "acting against one's better judgment" is a robust, recurring phenomenological datum. It is not merely an illusion caused by retrospective confabulation.
  2.  **Folk Vocabulary:** Ordinary language distinguishes between "changing one's mind" (revising a judgment) and "losing one's resolve" (failing to execute a standing judgment). Both parties agree this distinction marks *something*, though they disagree on whether it marks a unified natural kind.
  3.  **Discounting is Real:** Hyperbolic or quasi-hyperbolic discounting is a verified psychological mechanism. Agents systematically overweight immediate rewards relative to delayed rewards in a way that violates exponential discounting models.
  4.  **Limits of Discounting:** A discounting model alone cannot settle normative questions. Even if akrasia is fully explained by present-bias parameters, it remains an open question whether the $t_1$ (planning) self or the $t_2$ (acting) self has normative authority, or if a third standard applies.
  5.  **Commitment Devices:** Pre-commitment strategies (e.g., blocking websites, financial stakes) are effective behavioral interventions for many agents. However, their efficacy does not prove that the agent is literally "multiple selves"; it proves only that agents can manipulate their own future choice architectures.
  6.  **The "Stuck" Phenomenon:** Both parties acknowledge the existence of cases where an agent fails to act despite (a) maintaining a stable all-things-considered judgment that the action is best, (b) maintaining a standing intention to act, and (c) experiencing no competing desire for an alternative activity. (See Crux #1).
  7.  **Evidence Gap:** Laboratory data on delay discounting (e.g., monetary choice questionnaires) is evidence regarding intertemporal preference, but it is not conclusive evidence regarding the *moral psychology* of weakness of will. The leap from "choosing smaller-sooner money" to "failing to uphold a moral resolution" requires additional bridging premises.

  ## 2. DISAGREEMENTS TABLE

  | Claim / Topic | Temporal Formulation (T) | Agential Formulation (A) | Type |
  | :--- | :--- | :--- | :--- |
  | **1. Core Definition** | Weakness of will is fundamentally a **diachronic** failure: a conflict between time-slices where a later preference overrides an earlier plan due to shifting valuation curves. | Weakness of will is fundamentally a **synchronic** failure: a conflict at the moment of action where execution diverges from the agent's *current* best judgment. | **Substantive** |
  | **2. The Role of Judgment** | If an agent chooses B over A, their evaluative judgment *must* have shifted (even momentarily) to favor B. "Acting against judgment" is a description of the $t_1$ self observing the $t_2$ self. | An agent can choose B over A while their all-things-considered judgment *remains* fixed on A. The faculty of choice can be hijacked without the faculty of evaluation flipping. | **Substantive** |
  | **3. Explanation of "Stuck" Cases** | Inertia is a cost. The agent discounts the "effort cost" of initiation more heavily than the "benefit" of completion until an external trigger alters the cost/benefit ratio. | Inertia is a failure of *volitional initiation*, distinct from valuation. The agent values the action but lacks the "push" to begin; this is a deficit of agency, not a miscalculation of utility. | **Substantive** |
  | **4. Normative Authority** | Normative questions are best framed as conflicts between selves. Rationality involves maximizing the satisfaction of the $t_1$ self's preferences via commitment. | Normative questions apply to the *person* as a continuing entity. Rationality involves the alignment of action with current judgment, regardless of past preferences. | **Verbal / Normative** |
  | **5. "Willpower" as a Construct** | "Willpower" is a folk term for the deployment of commitment devices or the cognitive effort to reframe rewards to flatten the discount curve. | "Willpower" tracks a real, unified capacity for executive control that can be strengthened or depleted independently of preference ranking. | **Substantive** |

  ## 3. CRUXES

  The following are specific points of contention where resolution would significantly shift the debate. For each, we specify a concrete case or experiment and the divergent predictions.

  ### Crux 1: The "Stuck Akrasia" Case (Initiation Failure)
  **The Case:** An agent sits on a sofa. She judges she should wash the dishes *now*. She intends to wash the dishes *now*. She feels no stronger desire to remain seated than to stand up. She simply does not move. Ten minutes later, a housemate walks into the room (an irrelevant trigger), and she immediately stands and washes the dishes.
  **The Question:** Is this weakness of will, and what mechanism explains the delay?

  *   **Temporal Prediction:** This is a micro-preference reversal. At every second $t$ on the sofa, the agent implicitly valued "rest for one more second" > "starting dishes." The housemate's entry changed the payoff structure (e.g., social cost of laziness), flipping the preference.
  *   **Agential Prediction:** This is a failure of *executive ignition*. The preference remained "Dishes > Sofa" throughout. The mechanism is a breakdown in the translation of intention to motor command, bypassed by the external cue which served as a proxy for agency.
  *   **Move Condition:** If experience sampling shows the agent reports "I want to do dishes" consistently during the delay, **T** must concede that preference reversal is not necessary for akrasia. If the agent reports "I know I should, but I just want to sit for one more minute," **A** must concede that synchronic judgment is unstable.

  ### Crux 2: The Salience vs. Time Empirical Test (Designed Experiment)
  **The Design:** Experience Sampling Method (ESM) via smartphone app. Participants are prompted 5 times daily for 14 days.
  *   **Condition:** Participants report a current conflict between two options (e.g., Work vs. Social Media).
  *   **Manipulation:** In half the reported conflicts, both options are **temporally equidistant** (both available immediately). In the other half, the tempting option is **immediate** and the normative option is **delayed** (standard discounting setup).
  *   **Data:** Participants report (1) All-things-considered judgment ("Which is better?"), (2) Action taken, (3) Perceived salience/cue strength of each option.
  **The Question:** Does akrasia (Judgment A, Action B) occur when temporal discounting is neutralized?

  *   **Temporal Prediction:** In the **Equal-Time** condition, discounting cannot favor the temptation. Therefore, if the agent chooses the temptation, their judgment *must* report the temptation as "better" at that moment. Akrasia (Judgment A, Action B) will be rare or non-existent in Equal-Time trials.
  *   **Agential Prediction:** In the **Equal-Time** condition, akrasia will persist. High salience/cue strength of the temptation will drive Action B even while Judgment remains "Option A is better." Salience bypasses valuation.
  *   **Surprise Condition:**
      *   **Surprises T:** High rate of (Judgment A, Action B) in Equal-Time trials. This implies a mechanism other than time-preference drives the gap.
      *   **Surprises A:** Near-zero rate of (Judgment A, Action B) in Equal-Time trials. This implies that without temporal distortion, agency is perfectly aligned with judgment.

  ### Crux 3: The Normativity of Commitment
  **The Argument:** An agent at $t_1$ locks away their alcohol. At $t_2$, they desperately want a drink but cannot access it. They are grateful at $t_3$.
  **The Question:** Did the $t_1$ action constrain the $t_2$ agent's freedom, or enable the $t_1$ agent's autonomy?

  *   **Temporal Formulation:** The $t_2$ self is effectively a different stakeholder. The $t_1$ self's constraint is rational governance. The gratitude at $t_3$ confirms the $t_1$ self had normative authority.
  *   **Agential Formulation:** There is only one agent. The $t_2$ self's desire is real and current. The constraint is a form of self-coercion. Gratitude at $t_3$ is merely relief that a competing desire was suppressed, not proof that the $t_2$ desire was illegitimate.
  *   **Move Condition:** If we can identify cases where agents feel *regret* at $t_3$ that they were constrained (even if the constraint prevented harm), **T**'s model of unified $t_1$ authority weakens. If agents universally report that constraint *preserved* their identity, **A**'s model of continuous agency must accommodate "self-binding" as a core function of agency.

  ***

  ## DRAFTER'S NOTE

  **Confidence Assessment:**
  I am moderately confident (approx. 75%) that both parties can sign the **Agreed Claims**. These are phrased to acknowledge phenomena without committing to a specific ontology. The **Disagreements Table** is the most volatile section. I have attempted to phrase the "Temporal" position not as "reductionist" but as "diachronic," and the "Agential" position not as "mystical" but as "synchronic."

  **Highest Risk Formulation:**
  The formulation most likely to be rejected is in **Crux 2 (The Salience vs. Time Empirical Test)**, specifically the **Temporal Prediction**.
  *   *Reasoning:* A sophisticated Temporal theorist might argue that "salience" *just is* a modifier of the discount rate or immediate utility function. They may claim that if Salience makes B look better, then Judgment *should* flip to B, and if Judgment doesn't flip, the agent is misreporting.
  *   *Why it might bounce:* The Temporal member may refuse to accept that "Judgment" can be measured independently of "Choice." If they define judgment *by* revealed preference, the experiment becomes tautological for them. I have phrased it to rely on *reported* judgment, but T may object that reported judgment is unreliable data.

  **Recommendation:**
  Before signing, the Temporal member should clarify if they accept "reported all-things-considered judgment" as a valid data point distinct from "revealed preference." If they do not, Crux 2 cannot stand as written.

  **Signed:**
  _________________________ (Temporal)
  _________________________ (Agential)
  _________________________ (Facilitator)
