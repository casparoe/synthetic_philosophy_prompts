answer: |-
  # ADVERSARIAL COLLABORATION PROTOCOL
  **Subject:** Epistemic Status of Distant-Past Events Beyond the Testimonial Horizon
  **Parties:** Critical Reconstructionists (CR) vs. Testimonial Discontinuists (TD)
  **Date:** October 26, 2023

  ## I. AGREED CLAIMS
  *The undersigned parties affirm the following propositions as the common ground for this dispute. These claims define the scope of inquiry without resolving the central epistemic disagreement.*

  1.  **The Testimonial Horizon:** Both parties agree that a "Testimonial Horizon" exists for any historical event, defined as the temporal boundary beyond which no chain of direct or near-direct living testimony (oral or written) connects the present inquirer to the event. For events in the deep past (e.g., Bronze Age), this horizon was crossed centuries or millennia ago.
  2.  **Methodological Consensus:** Both parties agree that modern historiography employs source criticism, internal consistency checks, transmission-error modeling, and archaeological correlation. Both agree these methods successfully filter demonstrable falsehoods and identify anachronisms.
  3.  **Herodotus and Thucydides:** Both parties agree that Herodotus's *historiē* (inquiry) and Thucydides's method (autopsy, precise chronology, exclusion of the mythical) established the normative standards for evidence collection but did not, and could not, solve the problem of epistemic justification once the Testimonial Horizon was crossed.
  4.  **Narrative Utility:** Both parties agree that historical narratives constructed from fragmented traces possess immense explanatory, cultural, and heuristic value, regardless of their ontological status regarding specific singular events.
  5.  **The Nature of Traces:** Both parties agree that material traces (artifacts, strata, inscriptions) and textual traces (manuscripts, copies) are finite, fragmentary, and subject to degradation and bias prior to modern analysis.

  ***

  ## II. RECORD OF RESIDUAL DISAGREEMENTS
  *The following table records the divergent interpretations of the agreed-upon methods and traces. Each formulation is phrased to be acceptable to its respective camp.*

  | Topic | Critical Reconstructionist (CR) Formulation | Testimonial Discontinuist (TD) Formulation |
  | :--- | :--- | :--- |
  | **1. Epistemic Warrant Across the Horizon** | Convergent lines of evidence (textual coherence + archaeological correlation) generate sufficient epistemic warrant to justify specific factual beliefs (e.g., "Battle X occurred at Plain Y") even without testimonial continuity. | Convergent lines of evidence generate narrative probability and coherence, but cannot bridge the qualitative epistemic gap required for justified belief about specific singular events beyond the horizon. |
  | **2. The Function of Material Evidence** | Material evidence (e.g., weapon trauma, destruction layers) functions as a direct evidential bridge that anchors textual claims to physical reality, effectively bypassing the need for testimonial chains. | Material evidence functions as a constraint on narrative coherence; it confirms that *something* happened consistent with the trace, but cannot identify the specific event described in the text without testimonial linkage. |
  | **3. Definition of Historical Knowledge** | Historical knowledge is the robust, critically vetted consensus derived from the best available explanatory model of the traces; certainty is probabilistic but sufficient for the label "knowledge." | Historical knowledge requires a preserved chain of testimony or autopsy; beyond the horizon, we possess "well-ordered speculation" or "informed narrative," but not knowledge of the event-in-itself. |

  ***

  ## III. CRUXES, CASES, AND PREDICTIONS
  *The parties identify two fundamental cruxes driving the disagreement. For each, a case is selected that both agree bears on the issue. Each side records its prediction regarding the epistemic status of the case.*

  ### Crux A: Independent Trace-Coherence vs. Testimonial Inheritance
  **Question:** Can the coherence of independent traces (multiple textual traditions + material data) substitute for the loss of testimonial inheritance?

  *   **Case:** **The Battle of Qarqar (853 BCE).**
      *   *Evidence:* The Kurkh Monoliths (Assyrian) describe the battle; no direct enemy testimony survives; archaeological evidence of campaigning exists in the region but is not specific to the single day of battle.
      *   *Status:* The event is widely cited as historical fact in standard historiography.
  *   **CR Prediction:** The convergence of the Assyrian record with regional archaeological data and later chronological synchronisms warrants the claim: "We know the Battle of Qarqar occurred." The coherence *is* the inheritance.
  *   **TD Prediction:** The convergence warrants the claim: "The Assyrian narrative of Qarqar is the most coherent explanation of the available traces." We do not know the battle occurred as a specific singular event, only that the narrative fits the data better than alternatives.

  ### Crux B: Material Evidence as Direct Bridge vs. Narrative Corroboration
  **Question:** Can material/archaeological evidence function as a direct evidential bridge rather than merely corroborating narrative coherence?

  *   **Case:** **The Mass Graves at Himera (Sicily, 480 BCE).**
      *   *Evidence:* Archaeological discovery of mass graves with trauma consistent with warfare; isotopic analysis suggests non-local origins; location correlates with historical accounts of the Battle of Himera.
      *   *Status:* Often presented as physical proof of the specific historical battle.
  *   **CR Prediction:** The bones *are* the event. The physical trauma combined with dating creates a direct link to the specific historical claim, bridging the horizon. The material trace validates the specific textual event.
  *   **TD Prediction:** The bones prove *violence* occurred at that location and time. Linking them specifically to the "Battle of Himera" described by Herodotus/Diodorus requires an interpretive leap across the horizon. The material trace corroborates the *type* of event, not the specific *token* event in the narrative.

  ***

  ## IV. VERBAL-SUBSTANTIVE ASSESSMENT
  *The parties assess whether the dispute is merely terminological (verbal) or reflects a genuine divergence in reality (substantive).*

  **Assessment:** The dispute is **partially verbal but fundamentally substantive.**

  1.  **Verbal Component:** A significant portion of the disagreement rests on the definition of the word "knowledge." CR employs a coherentist/pragmatic definition (knowledge = best explanatory model), while TD employs a foundationalist/testimonial definition (knowledge = justified true belief via direct causal chain). If both parties agreed to use the term "warranted assertibility" for CR claims and "knowledge" only for TD claims, surface friction would decrease.
  2.  **Substantive Component:** The disagreement remains substantive because it dictates **risk assessment and inference.**
      *   *CR Implication:* Historians are justified in building further causal theories *on top* of these specific events (e.g., "Because Qarqar happened, Assyrian expansion halted"). If the event is treated as known, it becomes a load-bearing wall for future history.
      *   *TD Implication:* Historians must treat these events as probabilistic nodes. If the event is treated as narrative, it cannot serve as a certain foundation for subsequent causal claims without compounding uncertainty.
      *   *Conclusion:* Because the two camps differ on how much weight these claims can bear in subsequent reasoning, the dispute is not merely semantic; it alters the structure of historical explanation itself.
