answer: |-
  **Title:** The Lunchtime Lemma
  **Setting:** Outside the lecture hall, immediately after a session on Conditionalization.
  **Characters:** ELARA (a strict Bayesian) and MARK (an Adams-thesis sympathizer).

  **MARK:** I'm starving. Thai or Mexican? My prior is flat.

  **ELARA:** Let's do Thai. I just got a text from the host: "If we are open, we definitely have Pad Thai."

  **MARK:** (Stops walking) Okay, pause. You just conditionalized on a material implication.

  **ELARA:** I conditionalized on lunch.

  **MARK:** No, listen. You treated "If Open, then Pad Thai" as $\neg \text{Open} \lor \text{Pad Thai}$. That eliminates the world where they are Open but out of Pad Thai.

  **ELARA:** Which is good news.

  **MARK:** It's probabilistically catastrophic! Think about the partition. We have {Thai-Open-PadThai}, {Thai-Open-NoPadThai}, {Thai-Closed}, and {Mexican}. Your text eliminates {Thai-Open-NoPadThai}.

  **ELARA:** Right, because they have it.

  **MARK:** But the Mexican partition is untouched. The total probability mass of "Mexican" stays constant. The total probability mass of "Thai" shrinks because you deleted a sub-world of Thai. By strict Bayesian conditioning, hearing that they *have* the food makes it *less* likely we go there.

  **ELARA:** That's the Judy Benjamin intuition, Mark. We're supposed to hold the antecedent fixed. $P(\text{Thai})$ shouldn't drop just because I learned a constraint on the Thai worlds. That's why we use Adams conditionalization.

  **ELARA:** (Sighs) I refuse to engage in ad hoc probability preservation. If I learn a material conditional, I condition on the material conditional. I can't favor the antecedent just because it's the antecedent. That's causal decision theory creeping in.

  **MARK:** So you're saying good news about the Thai place makes you statistically obligated to avoid it?

  **ELARA:** I'm saying the likelihood ratio has shifted against the Thai hypothesis relative to the Mexican null. The Thai hypothesis now carries a burden of proof it didn't have before.

  **MARK:** (Points down the street) The Taco Stand doesn't have conditions. It just has tacos. Unconstrained probability mass.

  **ELARA:** Exactly. It's epistemically safer.

  **MARK:** So we're walking past the place that definitely has Pad Thai to go to a place that *might* be out of carnitas, because you can't handle the asymmetry of the material conditional?

  **ELARA:** (Starts walking toward the tacos) I'm not handling the conditional, Mark. I'm respecting the elimination of possible worlds.

  **MARK:** You know, van Fraassen would say you're just afraid to update your credence in the antecedent without evidence against it.

  **ELARA:** (Turns back, deadly serious) If I hear "If P then Q," and I don't lower my credence in P, I'm not doing Bayesian updating. I'm doing wishful thinking. Now come on, before I learn "If the Taco Stand is open, they have napkins" and we have to starve.
