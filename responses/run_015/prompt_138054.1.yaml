  **MERIDIAN PLATFORM SERVICES**
  **ONTOLOGY COMPLIANCE GROUP**
  **INTERNAL MEMORANDUM 994-O**

  **TO:** Board of Adjudication, Customer Restitution Committee
  **FROM:** Ontology Compliance Group (OCG)
  **DATE:** 4th Cycle, Quarter 3
  **SUBJECT:** Revised Schedule of Compensable Events (Realist Line Implementation)

  **1.0 DEFINITIONS**

  **1.1 Object-Instance:** A discrete computational entity persisted within the Meridian physics engine, possessing unique identity headers independent of visual rendering.
  **1.2 Perceptual Overlay:** The variable hardware-dependent rendering of an Object-Instance. Damage to the Overlay is non-compensable.
  **1.3 Continuity:** The unbroken causal history of an Object-Instance.

  **2.0 PREAMBLE**

  Following Directive 88-B, Meridian adopts the Realist Line to protect user labor. Users invest time in persistent entities, not transient experiences. Compensation must therefore reflect harm to the entity itself, regardless of user awareness. The following schedule standardizes valuation.

  **3.0 SCHEDULE OF COMPENSABLE EVENTS**

  **3.1 Unauthorized Instantiation (Theft vs. Duplication)**
  Since Object-Instances are unique computational entities, copying an object does not deprive the owner of the original. Therefore, "theft" is reclassified as *Unauthorized Instantiation*. Compensation covers the market value of the duplicate, not the original.
  *3.1.1 Restoration Protocol:* Restoring an object from a backup snapshot creates a new Object-Instance with identical properties but a new identity header. This is classified as **Replacement**, not Resurrection. Continuity is broken. Compensation for the original destruction is still owed; the backup is a courtesy, not restitution.

  **3.2 Unperceived Existence (The Orphaned Object)**
  Existence is defined by persistence in the physics engine, not user perception. Procedurally generated terrain deleted during maintenance constitutes destruction of property, even if unvisited.
  *3.2.1 Tariff:* Deletion of unvisited regions is classified as **Periodic Entropy Reclamation**. Compensation is calculated at 15% of standard terrain value, acknowledging the lack of perceptual utility while affirming ontological status.

  **3.3 Nested Simulations (Recursion)**
  Objects contained within a user-operated VR rig inside Meridian are computational entities persisted by Meridian hardware.
  *3.3.1 Depth Ruling:* Ontological status is binary (Exists/Does Not Exist). There is no ontological depth. Therefore, **no depth discount applies**. Destruction of a nested object is compensable at 100% of its internal market value, converted to Meridian Credits.

  **3.4 Object-Directed Harm (Offline Case)**
  Harm is incurred by the Object-Instance, not the user's experience.
  *3.4.1 Sleep Clause:* If an object is destroyed while the owner is offline/asleep, compensation is owed in full. The loss is to the entity's persistence, not the user's sensory engagement.
  *3.4.2 Avatar Integrity:* Harm to an avatar is compensable only if it alters the avatar's computational stats. User-reported physical pain is external to the Meridian ontology.

  **4.0 WORKED EXAMPLES**

  > **CASE A: The Duplication Glitch**
  > *Incident:* User A's sword is copied via exploit. Original remains.
  > *Ruling:* No theft occurred. User A retains the original Instance. User B is charged for Unauthorized Instantiation. No compensation paid to User A.
  >
  > **CASE B: The Server Wipe**
  > *Incident:* User C's house is deleted. Restored from backup next day.
  > *Ruling:* Original Instance destroyed. Backup is a Replacement Instance. User C receives compensation for destruction period plus Replacement fee waiver. Continuity break noted on title deed.

  **5.0 APPENDIX: EXTERNAL COLLISIONS**

  **5.1 Physical Injury Classification**
  Injuries sustained in physical reality (e.g., broken wrist striking a real table during immersion) are classified as **Type-External Collision Events**.
  *5.1.1 Liability:* As the real table is not a Meridian Object-Instance, no compensation is owed under the Realist Line. However, such events are logged to monitor haptic feedback intensity limits. The user is presumed to understand the boundary between Computational Mass and Physical Mass.

  ***

  **FOOTNOTE 1:** *Board Member K. dissenting on Clause 3.1.1. While agreeing that backup Instances are numerically distinct, the dissent argues that if identity is grounded in structural continuity rather than header IDs, Restoration should qualify as Resurrection. Reclassifying this as Replacement inflates the restitution ledger without ontological necessity.*

  **APPROVED:**
  *Ontology Compliance Group*
