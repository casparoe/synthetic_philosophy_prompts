      *   *Issue 2 (Orphans):* Ruling: Existence is independent of perception. Deletion is compensable. Name: "Systematic Culling."
      *   *Issue 3 (Recursion):* Ruling: Ontological depth is irrelevant. Existence is binary. No discount.
      *   *Issue 4 (Offline):* Ruling: Harm is to the object, not the experience. Compensation due even if owner asleep.
      *   *Appendix:* Physical wrist break. Classification: "External Collision Event." Not compensable under Meridian Object Policy, but noted for liability.

