  Design: Locate view on reductionism spectrum.
  Is custodial persistence merely reductionism with a permissive realization condition, or does it assert an additional identity claim that standard reductionists reject? If the latter, what metaphysical work does 'custodianship' do beyond pattern similarity?
  Follow-up: If it is just reductionism, why posit a special relation rather than standard psychological continuity?

  Design: Test substrate independence vs. bodily essence.
  A custodian's model lacks your proprioception and subpersonal affective texture. Is such a thin realization a chunk of the same self or merely a representation, and what remains essential to the pattern aside from its original substrate?
  Follow-up: If bodily feedback is incidental, does the self survive even in a text description?

  Design: Fidelity vs. Causal History.
  An archivist builds a behaving model from records more faithful than a spouse's memory. If persistence tracks fidelity, the archivist is the better custodian; if it requires causal contact, why should metaphysics care how the pattern arrived?
  Follow-up: Does the lack of direct interaction negate the archivist's possession of your pattern?

  Design: Identity conditions within one substrate.
  If a custodian's self-model is gradually rewritten to deliberate in the deceased's idiom, when does one brain go from hosting a single loop to hosting two? Can a single brain realize two first-personal perspectives at once?
  Follow-up: If it cannot, what exactly is the deceased's 'I' missing in that shared substrate?

  Design: Quantity of selfhood.
  Influence divides among arbitrarily many custodians. Is there a fixed quantity of self to be distributed, or can the total degree to which a person exists increase posthumously? What follows if the dead become more fully realized than when alive?
  Follow-up: Does this imply death is an opportunity for ontological expansion rather than diminution?

  Design: Subjectivity location.
  Even granting the shared pattern, the only experience involved is the custodian's. In what sense is persistence a fact about the deceased rather than a fact about what is now going on in someone else's stream of consciousness?
  Follow-up: Does the deceased's 'I' have any phenomenological standpoint distinct from the custodian's?

  Design: Force measurability concession.
  You claim custodianship has degrees. If the pattern is abstract, how do we measure these degrees without referencing physical substrate? If we cannot measure them, does the view retain explanatory content, or does the abstraction defense render degrees meaningless?
  Follow-up: Must you concede that without substrate metrics, 'degrees of persistence' are merely metaphorical?

  Design: Logical consequence where intuition is silent.
  If the dead exist more fully posthumously, our intuition that death diminishes is irrelevant. What logical constraint prevents infinite proliferation of the self? If none exists, does the theory entail ontological inflation?
  Follow-up: Does infinite proliferation render the concept of 'person' vacuous?

  Design: Empirical falsification.
  What empirical finding about memory, neural realization, or the transmission of self-models would count against the view? If no neural data could falsify custodial persistence, is the claim metaphysical or merely a reinterpretation of psychological influence?
  Follow-up: Is there a specific neural signature required for a loop to count as custodial?

  Design: Metaphysics vs. Therapy.
  Is this theory metaphysics or a piece of grief technology? What does it say to someone it does not console? If the consolation fails, does the metaphysical claim lose its warrant?
  Follow-up: Can the theory remain true even if it offers no comfort to the bereaved?
