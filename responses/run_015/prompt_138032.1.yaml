answer: |-
  TO: Standards Committee
  FROM: Committee Member
  RE: Recommendations on Pending Backsliding Files and Formula Definition

  **Recommendations**

  The Committee should adopt findings of democratic backsliding against Hungary, Poland, and Turkey. The record regarding the United States is insufficient for a finding. The Committee should reject the proposed fourth prong (Intent) as a standalone condition. The partisanship objection is answered by the formula's structural focus.

  **Application of the Formula**

  *Hungary:* Passes Formal-Legality (2010 election valid; procedures followed). Passes Ratchet (media, districts, courts, and cardinal laws reinforce incumbent advantage). Passes Lock-in (Cardinal laws require two-thirds to undo; bare majority insufficient). **Finding: Established.** The turning point is the Lock-in condition; cardinal laws permanently raise the cost of alternation.

  *Poland:* Passes Formal-Legality (2015 election valid). Passes Ratchet (media and judiciary controls compound to shift power). Passes Lock-in (Judicial reconstitution and media laws raise alternation costs beyond a single election cycle). **Finding: Established.** The turning point is the Ratchet condition; the combination of media and judicial control creates a synergistic barrier.

  *Turkey:* Passes Formal-Legality (Referendum formally valid; initial election contested). Passes Ratchet (Executive powers concentrate authority and decree powers). Passes Lock-in (Systemic shift to presidency not reversible by simple majority). **Finding: Established.** The turning point is the Formal-Legality condition; despite the emergency context, the measures were legally adopted, fitting the definition of retrogression rather than coup.

  *United States:* Passes Formal-Legality. Fails Ratchet (measures vary by state; no unified national shift toward federal incumbents). Fails Lock-in (State laws reversible by state legislatures; no national incumbent lock-in). **Finding: Record Insufficient.** The turning point is the Ratchet condition; fragmented subnational action does not constitute a member-state-level package shifting power to national incumbents.

  **The Mirror Test and Partisanship**

  Consider a government elected on reform abolishing an unelected upper chamber, introducing automatic voter registration, and banning a party it calls extremist.

  1.  *Abolishing Upper Chamber:* If done by simple majority and reversible, it fails Lock-in.
  2.  *Automatic Registration:* Expands access; fails Ratchet (does not shift power to incumbents).
  3.  *Banning Party:* If legally grounded and specific, passes Formal-Legality. If used broadly to exclude opposition, it triggers Ratchet/Lock-in.

  The formula flags entrenchment, not unpopularity. Reforms that facilitate alternation or are easily reversible do not trigger sanctions. This answers the partisipation objection: the test measures mechanical advantage, not policy preference. If the formula clears popular reforms that lower barriers to entry, it is not a tool for punishing political opponents.

  **Baseline for Ratchet**

  The baseline is the status quo immediately before the measures. Backsliding is retrogression, not static imperfection. A member state with pre-existing defects (e.g., malapportionment) is not in backsliding unless it worsens them. This protects states with historical flaws from being penalized for stagnation, focusing the Committee on dynamic erosion. However, this means the formula ignores background entrenchment that predates the episode.

  **Blind Spots**

  The formula cannot see:
  1.  Erosion by private actors (money, media ownership) without legislation.
  2.  Violence or intimidation not codified in law.
  3.  Subnational retrogression that does not aggregate to a national lock-in (see US file).
  4.  Slow drift lacking a legislative package.
  5.  Background entrenchment predating the episode.

  The Committee must acknowledge these gaps without stretching the formula to cover them. Where violence or private money drives erosion, the Committee lacks tools under this Clause.

  **Operational Decisions**

  1.  *Burden:* The Secretariat bears the burden of proof.
  2.  *Standard:* Clear and convincing evidence.
  3.  *Constitutional Court Validation:* Counts as evidence against a finding, but is not dispositive given potential capture.
  4.  *Subsequent Elections:* A win by incumbents under challenged rules does not defeat a finding; it may confirm the lock-in.
  5.  *Review:* Findings carry a mandatory review date twenty-four months after adoption.

  **Losing Arguments**

  *Hungary:* Proponents argue the 2010 supermajority constituted a constitutional moment with a mandate to rewrite the social contract. The two-thirds vote legitimized the cardinal laws.
  *Response:* Outweighed. A temporary electoral majority should not permanently bind future majorities via supermajority requirements on ordinary governance issues. The Lock-in condition specifically targets this dynamic.

  *United States:* Proponents argue federalism reserves election administration to states; diverse state laws reflect local preference, not national entrenchment.
  *Response:* Answered. While true, the lack of a unified national ratchet means the *member state* eligibility cannot be suspended under the current formula. The record is insufficient not because reforms are good, but because the mechanism is fragmented.

  **Intent Prong**

  Reject the subjective Intent condition. Purpose is inferred from effect. If a package satisfies Ratchet and Lock-in, the purpose is objectively entrenchment regardless of stated intent. Adding a subjective prong invites mind-reading and allows governments to mask entrenchment with benign rhetoric. The Lock-in condition sufficiently filters bona fide reformers.

  \answer{Hungary: established; Poland: established; Turkey: established; United States: record insufficient; Fourth prong: reject; Partisanship objection: answered}
