answer: |-
  ### 1. The Exam Question

  In 2148, the 'Meridian Trace' is discovered: a complete, authenticated record of a 2031 garrison withdrawal. Every file, log, and message is preserved with unbroken custody ('trace-completeness'). Two historians use it. One writes *The Meridian Decision* (a tragedy of honor); the other *Meridian: A Farce of Logistics* (bungling and vanity). They agree on every particular fact. A third publishes the raw chronology; it adds nothing to the Trace but is dismissed as 'not history'. A fourth notes both rivals assume the nation-state is the agent and a single week is the relevant timeframe.

  Given that the Trace excludes no fact yet determines no story, evaluate the status of historical objectivity here. Does the asymmetry between evidential constraint and narrative indeterminacy reduce history to fiction? Define at least three distinct construals of 'objectivity' (e.g., correspondence, procedural, relational) and show how each yields a different verdict on the Tragedy/Farce dispute. Must a defender of objectivity surrender the claim to a single true story, and must a sceptic surrender the claim that emplotment is arbitrary? (Note: Consider Ranke's aim to show the past 'as it essentially happened' only as a benchmark for correspondence, not as a required citation).

  ***

  ### 2. Model Answer

  The Meridian case dismantles the naive equation of objectivity with factual accuracy. Since both historians accept every particular in the Trace, a correspondence theory of truth—where statements match reality—renders both works equally objective. Yet they contradict each other in tone and meaning. This suggests that historical objectivity cannot reside solely in the relation between statement and fact (correspondence), but must involve the relation between fact and explanation. To resolve this, we must distinguish three construals of objectivity: correspondence, procedural, and relational.

  Under correspondence objectivity, the Tragedy and Farce are indistinguishable; both match the Trace perfectly. The verdict is that both are true, rendering the disagreement merely aesthetic. Under procedural objectivity, validity depends on method. Since both historians utilize the same authenticated data with rigorous custody, both are again equally objective. The chronology, however, fails here not because it is false, but because it lacks the procedure of selection required for historical intelligibility. It is data, not history. This confirms Carr's insight that facts become historical only when put to work. However, procedural objectivity still cannot adjudicate between Tragedy and Farce if both methods are rigorous.

  Relational objectivity, however, offers a different verdict. Here, objectivity is not a static mirror but a dialogue between the past (the Trace), the present (the historian's context), and the future (the utility of the account). If the Tragedy serves a contemporary need to understand moral obligation in command, while the Farce serves a need to understand systemic logistical failure, both are objectively valid relative to their interrogative frameworks. The Fourth Historian's critique reveals the limit here: both rivals share an unexamined framework (the nation-state). A truly relational objectivity would require making that framework explicit. Therefore, the verdict differs: correspondence and procedural views see no conflict; relational view sees competing validities based on explanatory scope.

  Is the Tragedy/Farce disagreement truth-apt? Yes, but not at the level of facts. It is truth-apt at the level of causal significance. If evidence exists within the Trace showing the commander prioritized honor over safety despite viable logistical options, the Tragedy is better supported. If evidence shows safety was never viable due to prior bungling, the Farce prevails. The Trace constrains emplotment: one cannot write a Romance of Triumph if the Trace records a withdrawal. Evidence excludes some stories while determining none.

  For this dispute to be more than verbal, concessions are required from both poles. A defender of traditional objectivity must give up the claim that the past possesses a single, inherent narrative structure waiting to be uncovered. They must accept that the Trace does not speak itself; it requires a question. Conversely, a White-style sceptic must give up the claim that emplotment is purely arbitrary or literary. They must acknowledge that the Trace exerts a negative constraint; it rules out emplotments incompatible with the data. Objectivity, therefore, survives not as the discovery of the one true story, but as the disciplined adherence to evidential constraints within an acknowledged framework. The residue of objectivity is not determination, but constraint.

  ***

  ### 3. Marking Scheme (20 Marks)

  **Move 1: Distinguish three construals of 'objectivity' (4 marks)**
  *   **First-class:** Defines three distinct types (e.g., correspondence, procedural, relational) and explicitly links each to the Meridian case (e.g., correspondence = matching the Trace).
  *   **Mediocre failure:** Lists definitions abstractly (e.g., "objectivity means being neutral") without applying them to the Trace or the historians' disagreement.

  **Move 2: Show verdict differs by construal (4 marks)**
  *   **First-class:** Demonstrates that correspondence/procedural views see no conflict between Tragedy/Farce, while relational/critical views allow for competing validities or framework critiques.
  *   **Mediocre failure:** Asserts one view is simply "right" without showing how the definition of objectivity changes the verdict on the specific texts.

  **Move 3: Address truth-aptitude of Tragedy/Farce (4 marks)**
  *   **First-class:** Argues that the disagreement is truth-apt at the level of causal significance/explanation, not particular fact, and identifies what evidence would settle it.
  *   **Mediocre failure:** Claims the disagreement is purely subjective/aesthetic because the facts are agreed, ignoring the level of explanatory claim.

  **Move 4: Name Objectivity Defender's concession (4 marks)**
  *   **First-class:** Identifies that the defender must surrender the claim to a single, inherent narrative or "one true story" contained in the past.
  *   **Mediocre failure:** Suggests the defender need only surrender "bias" or "forgery," missing the deeper philosophical concession regarding narrative structure.

  **Move 5: Name White-style Sceptic's concession (4 marks)**
  *   **First-class:** Identifies that the sceptic must surrender the claim that emplotment is arbitrary/unconstrained, acknowledging evidential negation.
  *   **Mediocre failure:** Suggests the sceptic must accept "facts matter" without explaining how this limits literary emplotment specifically (the asymmetry of constraint).
