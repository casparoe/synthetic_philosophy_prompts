answer: |-
  This is a sharp set of questions. You have correctly identified that the "Accuracy-First" program (often associated with Jim Joyce, Richard Pettigrew, and Hilary Greaves) is a piece of *formal epistemology*. It functions like a theorem: *If* you accept premises X, Y, and Z, *then* probabilism and conditionalization follow.

  Your suspicion is warranted. The elegance comes from the math, but the fragility lies in the mapping of that math to reality. Your lawyer partner is half-right: the core framework is a priori and insulated, but not entirely unfalsifiable. It is falsifiable *relative to its own premises*, but it often defends itself by retreating into the definition of those premises when data misbehaves.

  Here is the breakdown of defeaters, ranked from fatal to awkward, mapped to the specific components of the package you described.

  ### 1. The Indeterminacy of Scoring Rules (Fatal)
  **Target:** "Strictly proper scoring rules are the right way to measure accuracy."
  **Status:** **Conceded as a major open problem.**

  This is the single biggest internal threat to the view. The dominance arguments prove that *if* you measure accuracy using a Strictly Proper Scoring Rule (SPSR), you should be probabilistic. But there are infinitely many SPSRs (Brier, Log, Spherical, Ignorance, etc.).

  *   **The Problem:** These rules often disagree on which credence function is "more accurate." Agent A might beat Agent B on Brier score, while Agent B beats Agent A on Log Loss. If "Accuracy" is the *only* epistemic good, there must be a fact of the matter about who is more accurate. If the metric is arbitrary, the "good" is ill-defined.
  *   **Defender's Response:** Most accuracy-firsters (including Joyce in later work) admit this. They try to argue for a specific rule (usually Brier or Log) using additional constraints (like *additivity* or *truth-directedness*), but these constraints often sneak in pragmatic or non-epistemic assumptions.
  *   **Why it's Fatal:** If the norm (be probabilistic) depends on the metric, and the metric is underdetermined by "accuracy" alone, then "Accuracy" cannot be the *sole* foundation. You need a second principle to select the metric, which breaks the "accuracy-only" monism.
  *   **Connection to your ML work:** This is exactly why you use different losses. Log loss penalizes overconfidence heavily; Brier is more forgiving. In ML, you choose the loss based on the *cost of errors* (pragmatics). Accuracy-firsters want to choose the loss based on *truth* alone. If they can't uniquely identify which loss measures "truth," the project stalls.

  ### 2. Partition Sensitivity / State Space Relativity (Severe)
  **Target:** "The dominance argument for probabilism."
  **Status:** **Conceded, but often minimized.**

  The dominance proof holds over a specific set of "possible worlds" (a partition). If you change the granularity of the partition, the dominance relation can change.

  *   **The Problem:** Suppose I am uncertain about how to carve up possibility space itself (e.g., is the world "Red/Blue" or "Red/Not-Red"?). The accuracy-dominance argument assumes the agent has a fixed algebra of propositions. If the algebra is unstable, the dominance guarantee evaporates.
  *   **Defender's Response:** They typically stipulate that the argument applies relative to a fixed agenda of questions.
  *   **Why it's Severe:** In real forecasting (and backend engineering), the schema is never fixed. New edge cases emerge. If the norms of rationality shift depending on how you frame the question, they aren't very robust norms.
  *   **Empirical Check:** You could check this in tournament data. Do forecasters who maintain coherence across *shifting* question schemas perform differently than those who maintain coherence only within fixed schemas? The theory predicts coherence is always better; if schema-shifting incoherence wins, the "fixed algebra" premise is the weak link.

  ### 3. The "Incoherent Winner" Scenario (Severe)
  **Target:** "Accuracy is the only thing that matters epistemically" + Dominance Argument.
  **Status:** **Dismissed as "Changing the Subject" (Insulation).**

  You asked: *Imagine a tournament where incoherent forecasters (P(A)=0.7, P(~A)=0.7) beat every coherent forecaster on Brier score.*

  *   **The Math:** The dominance theorem states: For any incoherent set of credences $C$, there *exists* a coherent set $C^*$ such that $C^*$ is more accurate than $C$ in **every possible world**.
  *   **The Reality:** The theorem does **not** say that every coherent forecaster in a tournament will beat an incoherent one. It says a *better* coherent forecaster *could exist*. If the tournament participants are all bad coherent forecasters (e.g., they all predict 0.1 when the truth is 0.9), an incoherent forecaster predicting 0.7/0.7 might win.
  *   **The Insulation:** However, if you calculate the *optimal* coherent alternative post-hoc and the incoherent forecaster *still* beats it on the tournament's actual outcomes, the theory doesn't fold. It says: "The set of 'possible worlds' in the theorem did not match the distribution of questions in the tournament."
      *   The dominance argument assumes the "worlds" are logical possibilities.
      *   The tournament samples from a specific *distribution* of worlds.
      *   If the environment is adversarial or non-stationary, the "pointwise dominance" (better in *every* world) matters less than "expected dominance" (better on *average*).
  *   **Verdict:** This is where your lawyer partner is right. The theory defines rationality as avoiding dominance in *logical space*. If reality is structured such that avoiding logical dominance leads to losing in *empirical space*, the theory says, "Then reality is not the domain of epistemic rationality," or "You got lucky." It insulates itself by distinguishing *rationality* from *success*.
  *   **Is this a bug?** If a theory of rationality systematically recommends strategies that lose in the real world, it's not clear why we should care about it. But the accuracy-firster will say: "Rationality isn't about winning; it's about not being pointwise dominated." That is a defensible philosophical stance, but it limits the theory's practical relevance.

  ### 4. Pragmatic Encroachment / Cost of Inquiry (Awkward)
  **Target:** "Practical stakes... are irrelevant to what you ought to believe." (Purism)
  **Status:** **Dismissed as "Changing the Subject."**

  *   **The Objection:** In ML, we regularize models (L1/L2 penalty) to prevent overfitting. This is explicitly trading off "fit to truth" (training accuracy) for "robustness" (generalization). In life, investigating a claim costs money/time.
  *   **Defender's Response:** Accuracy-firsters distinguish *Epistemic Utility* (accuracy) from *Practical Utility* (stakes). They argue stakes determine *action* (e.g., how much evidence to gather before acting), but not the *credence* itself. Once you have the evidence, your credence should match the probability, regardless of stakes.
  *   **Why it's only Awkward:** It feels artificial. In your work, "loss functions" *are* the stakes. You don't optimize Log Loss because it's "true"; you optimize it because it yields good calibration for downstream decisions. If the "epistemic" norm is completely decoupled from the "practical" norm, it's hard to see why the epistemic norm binds us. But the theorist will simply say you are conflating *belief* with *action*.

  ### Addressing Your Two Specific Concerns

  #### 1. The ML Objection (Improper Losses)
  *   **Your Intuition:** If improper losses (label smoothing) beat proper ones, why think proper ones carve accuracy at the joints?
  *   **The Accuracy-First Reply:** This is a category error, but a revealing one.
      *   In ML, you do not have access to the *true* labels; you have noisy proxies. Label smoothing works because it assumes the *labels* are noisy, not that the *world* is fuzzy. It prevents the model from overfitting to label noise.
      *   Epistemology assumes the "world" delivers a truth value.
      *   **The Real Hit:** However, this points back to **Defeater #1 (Scoring Rules)**. If the "true" scoring rule of the universe is not Log Loss (which proper losses approximate), but something else, then optimizing Log Loss is suboptimal. The fact that "ugly hacks" win suggests the *assumed* metric of accuracy (Log Loss/Brier) might not match the *actual* structure of the data generating process. This undermines the claim that SPSRs are known a priori.

  #### 2. The Tournament Objection (Incoherent Winners)
  *   **Your Intuition:** If incoherent forecasters win, is the theory falsified?
  *   **The Accuracy-First Reply:** No, because the theory is about *dominance*, not *tournament ranking*.
      *   Dominance: Is there *any* coherent set of numbers that would have scored better than your numbers on *every* question? If yes, you are irrational.
      *   Tournament: Did you beat the other humans?
      *   You can be irrational (dominated) and still win the tournament (if the other humans were more irrational or just stupider coherent forecasters).
  *   **The Insulation:** If you show that the *dominating coherent alternative* (calculated post-hoc) would have lost to the incoherent forecaster on the actual data, the theorist says: "Then the actual data distribution was not one of the 'possible worlds' weighted in the dominance argument."
      *   **Is this unfalsifiable?** Yes, effectively. The theory operates in *modal space* (all possible worlds), not *sample space* (the tournament history). It is shielded from empirical data by design. It tells you how to structure your mind *given* a world, not which world you are in.

  ### Summary: Should You Worry?

  **Yes, but not for the reasons you might think.**

  1.  **Don't worry about the Tournament Data:** The theory is designed to survive empirical refutation. It's a normative claim about coherence, not a descriptive claim about winning. Finding incoherent winners is like finding a liar who got rich; it doesn't prove honesty isn't a virtue, just that it doesn't guarantee wealth.
  2.  **Do worry about the Scoring Rule Indeterminacy:** This is the internal crack. If you cannot justify *why* Brier score is the measure of accuracy rather than Log Loss without appealing to pragmatics (e.g., "Brier is more robust"), then the "Accuracy-Only" claim collapses into "Accuracy-Plus-Pragmatics."
  3.  **Do worry about the ML Connection:** Your intuition here is stronger than the philosophers'. The fact that "improper" methods generalize better suggests that **robustness** is an epistemic good distinct from **accuracy**. If you value robustness (calibration across distributions) over raw accuracy (fit to training data), then Accuracy-First is incomplete.

  **Final Verdict:** The package is elegant but likely false in its strongest form ("Accuracy is the *only* good"). It is best viewed as a compelling *partial* explanation: Accuracy is a *major* epistemic good, and coherence is instrumentally valuable for achieving it, but the choice of metric and the tolerance for error are inevitably shaped by the practical environment (the "loss function" of reality).

  If you want to keep the elegance without the dogma: Keep Probabilism and Conditionalization as "best practices for information processing," but drop the claim that they are derived *solely* from an a priori accuracy metric. Admit that the metric itself is chosen for its robustness in the kind of noisy, finite-sample world engineers actually inhabit.
