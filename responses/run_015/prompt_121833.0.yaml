answer: |-
  1. **The correspondence table**
  In this analogy, **Currency** is hedonic value itself—the single metric of goodness. **Denominations** are specific pleasure types (pizza vs. symphony), distinct in feel but convertible. **Exchange Rates** represent the quantitative trade-offs (how many slices equal one movement), supposedly fixed by intensity and duration. The **Central Bank/Mint** is the critical locus: it's whatever authority sets these rates. For the hedonist, this must be a natural fact about phenomenology, not just social convention. Without a Mint, the rates are arbitrary. Finally, **Counterfeiting** maps to false pleasures—experiences felt as good but lacking actual hedonic weight, akin to fake bills passing as real until scrutinized. This implies a truth condition for pleasure that is hard to define phenomenologically. The analogy aims to show that surface diversity doesn't preclude underlying uniformity, just as paper and coin both measure wealth. But this mapping relies on the Mint being real, not imagined.

  2. **Where the mapping breaks**
  Harmless breaks are superficial: money is public and physical; pleasure is private and phenomenal. We can ignore the tactile difference without damaging the logic. The fatal break lies in the **Mint**. Currency exchange rates are conventional, driven by markets and central banks. If pleasure exchange rates are similarly conventional, hedonism loses its normative bite—it becomes "whatever you trade off," which is preference satisfaction, not hedonism. For hedonism to work, the exchange rate between pizza and Beethoven must be a natural fact, not a choice. But there is no phenomenal Mint. No internal mechanism stamps "10 hedons" on an experience. Without a Mint, exchange rates are just retrospective judgments. If I say Beethoven is worth 100 slices, am I measuring a pre-existing value or creating it? If measuring, where is the scale? If creating, the currency analogy presupposes the uniformity it tries to prove. The analogy assumes a natural standard exists to ground the rates, but that standard is exactly what the heterogeneity objection denies. By treating rates as discoverable rather than stipulated, the analogy smuggles in the objectivity it needs to defend. Furthermore, money works because we agree to treat it as fungible. Pleasure lacks this social contract. If the "exchange rate" is just my current willingness to trade, it varies by context, mood, and framing. Real currency stabilizes; hedonic rates fluctuate wildly. This instability suggests there's no underlying substance being measured. The analogy holds only if you assume the conclusion: that there *is* a single substance. If heterogeneity is real, there is no Mint, only barter between incommensurable goods. The currency model collapses into a barter economy where exchange rates are makeshift, not foundational.

  3. **The smuggled premises**
  The analogy quietly imports **fungibility** and **authority**. Money is defined by its interchangeability; a dollar is always a dollar. By calling pleasure a "currency," the hedonist assumes interchangeability before proving it. This is circular. Money relies on an authority (the Mint) to guarantee value. Pleasure lacks this guarantor. The hedonist wants the objectivity of the Mint without the institution. Does the conclusion survive? Only if you ignore the mechanism. If exchange rates are just expressions of preference, the quantitative hedonist conclusion fails—it becomes qualitative preference satisfaction. The analogy does the heavy lifting by making diverse items look comparable through framing. It suggests that because we *can* trade off pizza for music, there *must* be a common metric. But trade-offs occur between incommensurables all the time (justice vs. mercy). The ability to choose doesn't prove a common scale. The quantitative conclusion is carried entirely by the analogy's structure, not by phenomenological evidence. Once you remove the financial framing, you're left with heterogeneous experiences and no reason to posit a hidden scalar dimension. The analogy isn't an argument; it's a picture that begs the question.

  4. **A better analogy, or an argument for why none works**
  Try **color saturation**. Bright red and blue share "brightness" but differ in hue. But brightness is separable from hue, while pleasure isn't separable from the activity. No analogy works because they reify pleasure into an object. The heterogeneity problem is a category mistake. Hedonism needs a metaphysical account, not a financial metaphor. The currency trick hides the lack of a common phenomenal substance behind market familiarity. Argue for adverbialism instead. Pleasure is a mode of experience, not a metric. The currency analogy is itself a category error. It solves nothing.
