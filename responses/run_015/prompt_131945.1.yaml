prompt: |-
  hey — i'm a phd student in philosophy of tech and science studies, running a 90-minute graduate workshop with about 14 people from mixed backgrounds (philosophy, cs, policy). i want an in-class game that makes them feel the difference between influence-seeking system failure and slow value drift, but not through a lecture. specifically i'm interested in this asymmetry i'm calling counterfactual regret asymmetry: in influence-seeking there's always a specific round or decision where you should have resisted, but in drift every local choice is defensible and the corruption only becomes visible retrospectively, so there's no single intervention point.

  design a structured role-play or committee simulation with rules, hidden roles, and a payoff scheme that doesn't use real money. i want half the groups to experience explicit capture — maybe an external agent with clear incentives trying to steer thier charter — and half to experience procedural drift, where the evaluation criteria slowly shift round to round without anyone announcing it. they should be maintaining some kind of institutional mandate (like an ai oversight charter or a funding principle) and making binding decisions each round.

  include a timeline that fits 90 minutes, the materials needed, the debrief that maps specific game moments onto the two failure modes and explains the asymmetry, and an honest note on which feature of real-world drift the game can't reproduce — probably the long timescale? — plus what will definately go wrong the first time you run it. also tell me how to handle the predictable failure mode.

  please respond in continuous prose only, like you're writing me a long email: no headings, no bullet points, no bold or tables. and don't include any bibliography or reading list, since this needs to work for people without access to the literature.
