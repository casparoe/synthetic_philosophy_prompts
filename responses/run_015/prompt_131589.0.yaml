prompt: |-
  I write novels — four out, fifth in copyedits — and at a dinner party last week I got into an argument with a friend of my husband's who does philosophy, and it's been rattling around my head ever since. He was arguing for the view that moral judgement has to depend on general principles, against the thing I'd have said I already believed: that there aren't really moral rules, because whether a feature of a situation counts in favour of an act depends on the rest of the situation, so the very same feature that's a reason one way in one case can be no reason at all, or a reason the other way, in another. He mentioned some names for all this that I've since forgotton. I believe the same thing about writing, which is maybe my whole problem.

  His argument, as near as I can reconstruct it:

  (1) People really do learn to judge new cases correctly. I can read a scene in a manuscript I've never seen and tell that it isn't working, and I aquired that by reading a lot of scenes and being corrected by editors. Likewise you can watch a kid learn that it's mean to exclude somebody from a game and then watch her apply it to a situation nothing like the one she learned it in.

  (2) If you get new cases right, it can't be luck. The new case has to be like the old ones in the respects that mattered, and your judgement has to be keyed to those respects.

  (3) But "the respects that matter" just is a general principle — something of the form: any case with features F is to be judged thus-and-so. If nothing general connects the old cases to the new one, then the old ones gave you no guidance at all and you were guessing and happened to be right.

  (4) So anyone who has the ability in (1) must have picked up general principles. Maybe ones they can't state, but principles all the same, because that's the difference between having learned something and having just been drilled.

  (5) Morality is no different in structure from craft. Someone who reliably judges that an act was cruel, or disloyal, or a betrayal, in situations she's never met before, has picked up general principles about cruelty, disloyalty, betrayal.

  (6) So my original view is false. There are moral principles, at least tacit ones, and the idea that reasons can flip valence from case to case with nothing general holding them together is incoherent.

  (7) At which point I said — and I thought I'd scored a hit, but he didn't look worried — that the exact same argument runs on craft. If (1) through (4) are right, then a line cook who knows by the sound when a sauce is about to break, a jazz bassist, me editing a paragraph: all of us are following tacit rules that could in principle be written down in advance, and if we can't produce them it's only because we haven't tried hard enough. Which is nuts. I've spent twenty years trying to write down what makes a scene work and what I actually have is a folder of examples and a shrug.

  (8) He says (7) is just the price of denying (6): if I want to say craft is real knowledge without rules, I have to say the same about morality, and then I owe everybody an account of how anyone learns it, or argues about it, or gets corrected, or improves.

  Every step from (1) to (4) looks like a truism to me and (5) looks fine, and yet (6) and (7) together are something I can't swallow. I keep going back and forth between thinking (3) is a bit of a scam and thinking (5) is where the sleight of hand is, and I can't settle it. If I have to choose I'd rather keep (1) and (7) than (6). So: which step do you give up, why did it look like a truism when it isn't, and what does giving it up actually cost me — does it commit me to saying I can never really explain to a student why her scene fails, or that two people disagreeing about something moral have nothing to reason with? I want to know what I'm paying, not just which line to cross out.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and the Problem:**
      *   **User:** A novelist (4 books published, 5th in copyedits). Intelligent, articulate, used to thinking about structure and nuance.
      *   **Context:** Argument at a dinner party with a philosopher friend of her husband.
      *   **Core Conflict:** Particularism (moral/craft reasons depend on context, can flip valence) vs. Generalism/Principlism (judgment requires tacit or explicit general principles).
      *   **The Philosopher's Argument:** A reconstructed syllogism (steps 1-8) arguing that reliable judgment implies underlying principles.
      *   **The User's Intuition:** Feels steps 1-4 are truisms, but rejects the conclusion (6 & 7). She feels craft (and morality) *doesn't* work by rules, even tacit ones. She's stuck between thinking (3) is a scam or (5) is sleight of hand.
      *   **Goal:** Identify which step to reject, explain *why* it looked like a truism but isn't, and clarify the *cost* of rejecting it (can we still teach/argue/improve?).

  2.  **Deconstruct the Philosopher's Argument:**
      *   (1) Learning happens (transfer of skill). *Hard to deny.*
      *   (2) Success isn't luck; it tracks relevant features. *Hard to deny.*
      *   (3) "Relevant features" = General Principle (Form: If F, then Judge J). *This is the crux.*
      *   (4) Therefore, learners possess principles (tacit or explicit).
      *   (5) Morality ~ Craft (structural identity).
      *   (6) Therefore, Moral Particularism is false.
      *   (7) Therefore, Craft Particularism is false (Expertise = Tacit Rules).
      *   (8) Challenge: If you deny (6)/(7), explain how learning/argument works.

  3.  **Identify the Philosophical Landscape:**
      *   The user describes **Moral Particularism** (associated with Jonathan Dancy, John McDowell, Aristotelian *phronesis*).
      *   The philosopher is arguing for **Moral Generalism** (Kantian, Utilitarian, or Rule Utilitarian vibes, but also cognitive science models of rule-based learning).
      *   The specific point of contention is the definition of "principle" in step (3).

  4.  **Evaluate Step (3): The Hidden Equivocation.**
      *   Step (3) claims: "the respects that matter" just *is* a general principle.
      *   *Why it looks like a truism:* If I judge X because of feature F, it seems I'm saying "F matters." If F matters here and there, isn't that a rule "F matters"?
      *   *Why it isn't:* A "principle" implies a *propositional codification* that holds across contexts. Particularism argues that the "matterings" are holistic. Feature F isn't a standalone variable that sums up to a judgment. It interacts with the whole.
      *   *The "Tacit Rule" Trap:* The philosopher argues the rules exist *tacitly*. This makes the claim unfalsifiable but also empty. If the rule is so complex it can't be stated, is it a rule or just a description of the neural network/pattern recognition?
      *   *Key Distinction:* **Regularity vs. Rule.** Just because there is a pattern (regularity) in how an expert judges doesn't mean the expert is *following* a principle (rule). The brain might be doing holistic pattern matching, not subsumption under a law.

  5.  **Evaluate Step (5): The Analogy.**
      *   Is Morality exactly like Craft? Most particularists say yes (Dancy explicitly uses aesthetic/craft analogies). So attacking (5) might not be the best move for the user, who believes the same thing about writing.
      *   The user wants to keep (1) and (7). (7) says "Craft is real knowledge without rules." The philosopher says (7) is "nuts." The user thinks (7) is true. So the user must attack the derivation of (7) from (1)-(4). This points back to (3) or (4).

  6.  **Formulate the Solution:**
      *   **The Weak Link:** Step (3). It conflates *consistency of judgment* with *governance by principle*.
      *   **The Concept:** **Holism of Reasons.** A feature (e.g., "it was a lie") is a reason in one context but neutral or opposite in another (e.g., "lying to protect a victim"). The "principle" would need infinite ceteris paribus clauses, rendering it useless as a principle.
      *   **The Alternative to Rules:** **Phronesis (Practical Wisdom) / Pattern Recognition.** We learn via exemplars, not axioms. We see the similarity between *this* scene and *that* scene without being able to articulate the algebraic formula connecting them.
      *   **Addressing the Cost (Step 8):** Can we teach/argue? Yes, but by *showing* (examples, analogies, "look at this") rather than *telling* (rules). We argue by refining perception, not appealing to statutes.

  7.  **Drafting the Response (Iterative refinement):**
      *   *Tone:* Respectful, intellectual, acknowledging her expertise as a writer. Use her metaphors (scenes, sauce, jazz).
      *   *Direct Answer:* Reject Step (3).
      *   *Explanation:* Distinguish between "there is a pattern" and "the agent is following a rule."
      *   *Philosophical Names:* Jonathan Dancy (Moral Particularism), John McDowell (Virtue Ethics/Perception), Hubert Dreyfus (Skill Acquisition/Phenomenology).
      *   *The "Tacit Rule" Rebuttal:* If a rule is too complex to state, calling it a "rule" adds nothing. It's just a metaphor for neural weighting.
      *   *The Cost:* It changes *how* we teach. Not "Here is the rule," but "Look at this example, now look at yours. Feel the difference?" It makes justification more about shared perception than logical deduction.

  8.  **Refining the Argument against (3):**
      *   The philosopher says: "Respects that matter" = Principle.
      *   Counter: "Respects that matter" = **Salience.** Salience is perceptual, not propositional.
      *   Example: A jazz bassist knows when to swing. Is there a rule? No. It's a feel based on thousands of hours of immersion. The "rule" would be infinitely complex (tempo, drummer's kick, harmony, room acoustics, mood).
      *   The philosopher's move is to say "Well, the brain computes the complex rule."
      *   Counter: That redefines "rule" to mean "any causal explanation of behavior." That's not a *normative* principle we can use for reasoning.

  9.  **Addressing the "Cost":**
      *   Does it stop explanation? No. We explain via **analogy** and **attention**. "You broke the tension too early, like in that movie we hated."
      *   Does it stop moral argument? No. We argue by highlighting features. "You're ignoring the harm caused." We are trying to align our perceptions, not our calculators.

  10. **Final Polish:** Ensure the distinction between *Regularity* (objective pattern) and *Rule* (subjective guide) is clear. This is the philosophical pivot point. (Dreyfus's critique of AI is relevant here too).

      *(Self-Correction during drafting)*: I should make sure not to get too bogged down in academic jargon. Keep it grounded in her experience as a writer. Use the "sauce breaking" analogy she provided.

      *Plan:*
      1. Validate her intuition (she's right, this is a classic debate).
      2. Identify Step (3) as the culprit.
      3. Explain the "Regularity vs. Rule" distinction.
      4. Bring in the "Holism of Reasons."
      5. Address the "Cost" (Teaching by exemplar, not axiom).
      6. Name-drop the philosophers (Dancy, McDowell, Dreyfus).
      7. Conclude with encouragement.

  11. **Final Review against constraints:** The user asked "Which step do you give up, why did it look like a truism when it isn't, and what does giving it up actually cost me?" I need to answer these specifically.

      *   Step: (3).
      *   Why truism: Confuses *description* of behavior with *guidance* of behavior.
      *   Cost: Changes pedagogy from rule-giving to attention-training. Doesn't eliminate reasoning, changes its form.

      Let's write it.cw
answer: |-
  This is a beautiful reconstruction of a classic philosophical stalemate. You have intuitively stumbled onto the debate between **Moral Generalism** (your husband's friend) and **Moral Particularism** (your position), with a side order of Hubert Dreyfus's phenomenology of skill.

  You are right to feel that steps (1) through (4) sound like truisms. They are designed to. They rely on a very specific, seductive equivocation in step (3).

  If you want to keep your intuition about writing (and morality) intact—that reasons can flip valence, that expertise is not reducible to code—you should **reject Step (3).**

  Here is why it looks like a truism, why it isn't, and what it costs you to cut that line.

  ### 1. The Trap in Step (3)
  **The Claim:** *"But 'the respects that matter' just is a general principle — something of the form: any case with features F is to be judged thus-and-so."*

  **Why it looks like a truism:**
  It conflates **Regularity** with **Rule**.
  If a line cook consistently pulls the sauce off the heat at the exact right moment, an observer can look back and say, "Ah, there is a pattern. The cook reacts to viscosity V and temperature T." The observer can write a formula: *If V and T, then Remove.*
  The philosopher argues that because there is a *pattern* in the behavior (Regularity), there must be a *principle* guiding the agent (Rule).

  **Why it isn't:**
  Just because your behavior *can be described* by a generalization doesn't mean you are *guided* by one.
  In AI and cognitive science, this is the difference between **symbolic processing** (following explicit or tacit rules) and **connectionist processing** (pattern matching via neural weights).
  When you edit a paragraph, you aren't checking it against a mental list of 50 principles ("Check subject-verb agreement," "Check rhythm," "Check tonal consistency"). You are looking at the whole thing and feeling a "click" or a "grind." The "respects that matter" are not discrete variables you sum up; they are holistic features of the gestalt.

  If the "principle" required to explain your judgment is so complex, so context-sensitive, and so laden with *ceteris paribus* clauses ("unless the tone is ironic," "unless the character is unreliable," "unless the rhythm demands a fragment") that it cannot be stated, **it ceases to function as a principle.** It becomes merely a post-hoc description of what your brain did. Calling it a "tacit rule" is an empty metaphor. It adds nothing to the explanation other than a comforting word ("rule") for a phenomenon ("pattern") that doesn't actually rely on rules.

  ### 2. The Holism of Reasons
  Your intuition about reasons flipping valence is the core of **Jonathan Dancy's Moral Particularism**.
  *   **Generalist:** "Lying is wrong." (Feature F = Negative Reason).
  *   **Particularist:** "Lying is usually wrong, but if I am lying to a murderer about where their victim is hiding, the fact that it is a lie counts *in favor* of the act." (Feature F = Positive Reason).

  If the valence of a feature depends on the context, you cannot write a principle that says "F always counts for X." You would need a principle that says "F counts for X, unless G, H, I, J..." ad infinitum.
  Your husband's friend wants to save the theory by saying those infinite conditions exist *tacitly* in your mind. But as you noted in (7), this is nuts. It implies your brain is storing a library of infinite rules. It is far more parsimonious to say your brain has developed a **sensitivity** (a perceptual skill) rather than a **database** (a legal code).

  ### 3. The Cost: What do you lose?
  Your husband's friend's challenge in (8) is the real worry: *If there are no rules, how do we learn, argue, or improve?*

  If you reject (3), you do not have to say that teaching or moral reasoning is impossible. You just have to admit that **teaching is not legislation.**

  **The Cost to Craft (Writing):**
  *   **Generalist View:** I can teach you to write by giving you the rules. If you fail, you broke a rule.
  *   **Particularist View:** I can only teach you to write by training your **perception**.
      *   *How we explain failure:* We don't say "You violated Rule 4." We say, "Look at this paragraph. Feel how the rhythm stumbles here? Compare it to this passage by Didion. See how she handles the transition?"
      *   *The mechanism:* We use **exemplars**, not axioms. We argue by analogy ("This scene is doing the same thing as the one you cut last week").
      *   *The limitation:* You cannot write a "How-To" book that guarantees success. You can only offer heuristics ("Try this") which are themselves context-sensitive. This is why writing books are often frustrating; they describe what good writing looks like, not how to manufacture it algorithmically.

  **The Cost to Morality:**
  *   **Generalist View:** To resolve a moral dispute, we find the shared principle and apply it.
  *   **Particularist View:** To resolve a moral dispute, we try to get the other person to **see** the situation differently.
      *   *How we argue:* We highlight features. "You're focusing on the lie, but you're ignoring the harm that telling the truth would cause." We are trying to align our moral vision, not our moral calculators.
      *   *The limitation:* Moral progress is harder. It requires empathy and imagination (the ability to see the case as the other sees it), not just logical consistency.

  ### 4. Who to Read (The Names You Forgot)
  Since you want to arm yourself for the next dinner party, here are the philosophical handles for your intuition:

  1.  **Jonathan Dancy:** The primary defender of Moral Particularism. He argues exactly what you argued: reasons are holistic and context-dependent.
  2.  **John McDowell:** Argues that moral knowledge is a kind of "perceptual capacity" (like knowing how to navigate a city) rather than knowledge of propositions.
  3.  **Hubert Dreyfus:** A phenomenologist who critiqued AI. He argued that expert skill (like the line cook or the jazz bassist) is **non-representational**. The expert doesn't think; they respond. The moment you try to codify their skill into rules, you turn them back into a novice.

  ### Summary
  Your husband's friend is arguing that because there is *order* in the universe (people learn, judgments are consistent), there must be *law* in the mind.
  You are arguing that the order comes from the **calibration of the agent to the world**, not the subsumption of the world under a law.

  **Give up Step (3).**
  It looks like a truism because we confuse "there is an explanation for why you did that" with "you followed a instruction to do that."
  **The Cost:** You commit to the view that wisdom is a cultivated sensitivity, not a mastered code. You cannot explain a scene's failure by pointing to a statute, only by pointing to the text and saying, "Look. Do you feel that?"
  That isn't a loss. That's just what it means to be an artist.
