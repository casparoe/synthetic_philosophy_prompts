answer: |-
  **The Causal Telos: Reconstructing Buddhist Ethics as Non-Aggregative Soteriological Consequentialism**

  The classification of Buddhist ethics within Western normative frameworks has long generated a productive friction. Traditional taxonomies oscillate between characterizing the tradition as a form of virtue ethics, focused on the cultivation of mental dispositions (*bhāvanā*), or a deontological system, anchored in the moral quality of intention (*cetanā*). However, both categorizations struggle to accommodate the soteriological urgency that permeates Buddhist praxis: the imperative to eliminate suffering (*duḥkha*). This tension creates what may be termed the "dual-teleology problem." On one side, the metaphysics of no-self (*anātman*) and dependent origination (*pratītyasamutpāda*) appear to dissolve the stable agent required for standard consequentialist calculation. On the other, the Mahāyāna Bodhisattva ideal commits the practitioner to the universal attenuation of suffering, a goal that is structurally outcome-oriented.

  To resolve this, one must look beyond the superficial dichotomy of agent-centered versus act-centered ethics. The central thesis of this analysis is that Buddhist ethics is best reconstructed not as virtue ethics or deontology, but as a *sui generis*, non-aggregative soteriological consequentialism. In this framework, the moral rightness of an action is determined by its causal efficacy in weakening karmic conditioning and advancing the trajectory toward liberation (*nirvāṇa*), rather than by maximizing quantifiable welfare or adhering to rigid rules. This reconstruction preserves the outcome-orientation of the Bodhisattva vow while respecting the ontological constraints of no-self, provided we redefine "consequence" not as a future state of affairs to be produced, but as a causal alignment with the structure of reality.

  **The Metaphysical Objection: No-Self and the Locus of Responsibility**

  The most formidable objection to a consequentialist reading of Buddhist ethics arises from the doctrine of *anātman*. Standard consequentialism presupposes a subject who bears the burden of calculation and an object (a recipient of welfare) who benefits from the action. If the person is merely a conceptual designation (*prajñapti*) over a stream of momentary psychophysical events (*dharmas*), who is the maximizer? Furthermore, if there is no enduring self, who suffers, and who is liberated? If the agent is illusory, the aggregative calculus of classical utilitarianism collapses, as there are no discrete units of welfare to sum.

  However, this objection relies on a substantialist conception of agency that Buddhist metaphysics explicitly rejects but functionally replaces with causal continuity. The Buddhist moral agent is not a static noun but a dynamic verb—a causal stream (*santāna*). While there is no ontological self, there is causal responsibility. The doctrine of *karma-phala* (the fruit of action) ensures that intentions have effects that ripple through the causal web, even in the absence of a permanent owner of those effects. Therefore, the lack of a substantial self does not negate the capacity for goal-directed action; it merely relocates the locus of agency from a metaphysical substance to a functional process.

  Consequently, the "maximizer" in Buddhist ethics is not a soul seeking happiness, but a causal stream seeking to alter its own trajectory. The ethical imperative is to intervene in the chain of dependent origination to halt the proliferation of suffering. This is compatible with a modified consequentialism where the "agent" is the provisional locus of decision-making within the causal web. The absence of a self does not prevent the evaluation of outcomes; it merely dictates that the outcomes are not owned by a self, but are properties of the causal system itself. Thus, the metaphysical objection fails to undermine consequentialism so long as the theory is adjusted to account for process-ontology rather than substance-ontology.

  **The Teleological Objection: The Nature of the Good**

  Even if we grant a functional agent, a second objection arises regarding the "good" being maximized. Classical consequentialism typically defines the good as a positive mental state (pleasure, preference satisfaction). Buddhist soteriology, however, defines the ultimate good negatively: as the cessation of craving (*taṇhā*) and the extinguishing of suffering (*nirodha*). Moreover, because *saṃsāra* is characterized by *duḥkha*, maximizing positive states within the world is ultimately futile. If the goal is the end of the system rather than the optimization of states within the system, can this be called consequentialism?

  This distinction necessitates the "non-aggregative" qualification. Buddhist ethics cannot be aggregative because *nirvāṇa* is not a quantity that can be summed across beings. One cannot add together the liberation of ten beings to equal a "greater" liberation than that of one being. Instead, the "good" is the reduction of *upādāna* (grasping) within the interdependent network. An action is right if it contributes to the weakening of grasping, either in the actor or in others.

  This shifts the framework from "maximizing utility" to "minimizing bondage." It remains consequentialist because the moral weight of an action is determined by its contribution to this end-state. The *Cetanā* (intention) is crucial here, but not as a deontological end in itself. In Buddhist psychology, intention is the seed of karmic consequence. A "good" intention is one that is aligned with the reality of impermanence and no-self, precisely because such an intention produces consequences that lead toward liberation rather than further entanglement. Thus, intention is evaluated instrumentally based on its causal potency to generate freedom. The teleology is preserved: the end (liberation) justifies and defines the means, provided the means do not reinforce the very grasping they seek to eliminate.

  **The Bodhisattva Vow and Skillful Means as Consequentialist Mechanisms**

  The strongest evidence for a consequentialist reconstruction lies in the Mahāyāna doctrines of the Bodhisattva vow and skillful means (*upāya-kauśalya*). The Bodhisattva vow is explicitly universalist and outcome-oriented: "Sentient beings are numberless; I vow to save them." This is a commitment to a specific state of affairs—the liberation of all beings—taking precedence over personal peace or adherence to precepts.

  The doctrine of *upāya* further cements this. It allows for the suspension of conventional moral precepts if doing so serves the ultimate soteriological goal. A classic example involves a Bodhisattva committing a violent act to prevent a murderer from incurring the karmic retribution of killing. In a deontological framework, killing is intrinsically wrong. In a virtue framework, violence corrupts character. But in the logic of *upāya*, the action is evaluated by its capacity to mitigate overall suffering and karmic burden. The moral calculus here is explicitly forward-looking. The Bodhisattva accepts personal karmic degradation to secure the spiritual welfare of another.

  Critics might argue that *upāya* is constrained by wisdom (*prajñā*) and compassion (*karuṇā*), making it a hybrid view. However, wisdom and compassion are not separate from the consequentialist aim; they are the epistemic and affective tools required to accurately assess consequences in a complex karmic web. Wisdom perceives the emptiness of the agent and the recipient, preventing the calculation from devolving into egoistic attachment. Compassion ensures the calculation prioritizes the alleviation of suffering. Together, they function as the regulatory mechanisms of a high-fidelity consequentialism that operates without the distortion of self-grasping. The vow functions as a regulative ideal, directing action toward systemic liberation rather than personal merit, which aligns perfectly with a universalist, non-aggregative consequentialist model.

  **Synthesis: Path-Dependent Karmic Consequentialism**

  To classify Buddhist ethics merely as "consequentialist" risks conflating it with utilitarianism. The distinction lies in the path-dependency and the ontological grounding. In utilitarianism, the end justifies the means regardless of the causal nature of the means, provided the utility is maximized. In Buddhist ethics, the means must be causally consistent with the end. One cannot achieve *nirvāṇa* (the cessation of conditioning) through actions that reinforce conditioning, even if those actions produce temporary happiness.

  Therefore, the system is path-dependent. The "consequence" is not merely a future temporal outcome, but the immediate karmic quality of the causal chain. An action is right if it aligns the causal stream with the truth of dependent origination. This is why the reconstruction must be termed "Soteriological Consequentialism." The "good" is ontological liberation, and the "right" is that which effectively navigates the causal web toward that liberation.

  This view resolves the dual-teleology problem. The metaphysics of no-self does not undermine the framework because the framework does not require a substantial agent, only a causal locus capable of intentional intervention. The soteriology of universal liberation does not contradict the metaphysics because liberation is not the satisfaction of a self, but the release of the causal stream from the compulsion of rebirth and suffering. The tension between the lack of an agent and the presence of a goal is dissolved when the goal is understood as the cessation of the illusion of the agent.

  **Conclusion**

  Buddhist ethics is best reconstructed as a non-aggregative, path-dependent soteriological consequentialism. This classification withstands the objection of no-self by grounding agency in causal continuity rather than substantial identity. It withstands the objection regarding the nature of the good by defining the "good" as the cessation of suffering and karmic conditioning rather than the accumulation of positive mental states. While elements of virtue (cultivation) and deontology (precepts) are present, they are subordinate to the overarching teleological aim of liberation. Precepts are training rules designed to produce beneficial karmic outcomes, and virtues are mental habits that increase the efficacy of those outcomes.

  Ultimately, the Bodhisattva vow serves as the definitive proof of this structure. It subordinates all other moral considerations to the outcome of universal liberation, utilizing skillful means to navigate the complexities of karma without reifying the self. By recognizing Buddhist ethics as a distinct form of consequentialism—one concerned with the topology of causal chains rather than the arithmetic of utility—we honor the internal coherence of the doctrine. It is a system where the rightness of an act is determined by its power to unravel the very conditions that make moral calculation necessary, aiming finally at a consequence that transcends the duality of agent and outcome.
