      *   *The Virtue/Deontological Challenge:* Emphasis on *cetanā* (intention) looks deontological. Emphasis on *bhāvanā* (cultivation) looks like virtue ethics. But do these capture the soteriological goal (Nirvāṇa/Liberation of all beings)?
      *   *The User's Hypothesis:* "Path-dependent, non-aggregative consequentialism." The "good" is the cessation of *duḥkha* via the weakening of karmic chains.
      *   *My Task:* Evaluate this hypothesis. Is it coherent? Does it hold up against the metaphysics of no-self?

  3.  **Outline the Essay:**
      *   **Title:** Needs to be academic and reflective of the core tension.
      *   **Introduction:**
          *   State the classification problem (Virtue/Deontology vs. Consequentialism).
          *   Introduce the "dual-teleology problem" (No-self vs. Universal Liberation).
          *   Thesis Statement: Buddhist ethics is best reconstructed as a *sui generis*, *soteriological consequentialism* that is non-aggregative and ontologically grounded in causal efficacy rather than agentive utility.
      *   **Section 1: The Metaphysical Objection (No-Self and the Agent).**
          *   Analyze *anātman*. If there is no agent, who maximizes?
          *   Counter: Consequentialism doesn't strictly require a *substantial* self, only a causal locus of decision. The "person" is a convenient designation (*prajñapti*) sufficient for karmic responsibility.
      *   **Section 2: The Teleological Objection (The Nature of the Good).**
          *   Standard consequentialism maximizes pleasure/preference satisfaction.
          *   Buddhist "good" is the cessation of craving (*nirodha*).
          *   Is this a "state of affairs"? Yes, but a negative one (absence of suffering).
          *   The problem of aggregation: You can't sum up Nirvāṇas. Hence, "non-aggregative."
      *   **Section 3: The Bodhisattva Vow as Regulative Ideal.**
          *   Mahāyāna context. The vow prioritizes others' liberation.
          *   This looks strongly consequentialist (outcome: all beings liberated).
          *   But the *method* is *upāya* (skillful means), which is context-sensitive (path-dependent).
      *   **Section 4: Synthesizing the View (Karmic Causal Efficacy).**
          *   Refine the definition. It's not about "results" in time, but about aligning with the causal structure of reality (*pratītyasamutpāda*).
          *   Right action is action that accelerates the cessation of suffering within the causal web.
      *   **Conclusion:**
          *   Reiterate thesis.
          *   Final justification: It avoids the pitfalls of rigid deontology (ignoring outcomes) and naive utilitarianism (ignoring ontology).
          *   Final label: "Ontological Consequentialism" or "Karmic Consequentialism." Let's stick closer to the prompt's suggestion but refine it: "Soteriological Consequentialism."

  4.  **Drafting - Section by Section (incorporating conceptual analysis):**

      *   *Intro:* Acknowledge the standard Damien Keown (Virtue Ethics) vs. Charles Goodman (Consequentialism) debate implicitly without citing them. Focus on the *conceptual* tension.
      *   *The Agent Problem:* If I am a stream of moments (*santāna*), can I be responsible? Yes, causal continuity is enough for karma. The "maximizer" is the causal stream aiming at its own cessation (paradoxical but coherent in Buddhism).
      *   *The Good:* The "Good" is *Nirvāṇa*. This is an outcome. But it's not a mental state *within* samsara. It's the end of the system. So, it's "systemic consequentialism."
      *   *Upāya:* This is the bridge. It allows breaking rules (deontology) for the sake of the outcome (liberation). This strongly supports consequentialism. But it's constrained by wisdom (*prajñā*), not just utility calculation.
      *   *Refining the Conclusion:* It is consequentialist, but the "consequence" is ontological liberation, not hedonic utility. It is non-aggregative because liberation is not quantifiable.

  5.  **Refining the Argument (Self-Correction during drafting):**
      *   *Critique:* Is calling it "consequentialism" just stretching the term?
