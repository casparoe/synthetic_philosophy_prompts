      *   *Decision:* I will argue for a **Non-Aggregative Soteriological Consequentialism**. This captures the outcome-orientation without requiring a substantial self or hedonic calculus.

  6.  **Final Review against Constraints:**
      *   Doctoral level tone? Yes.
