      *   *Reframing:* Move from "Can we know?" to "What kind of warrant does this claim require?"
      *   *Specific Move:* Adopt a **Stratified Epistemology**. Different claims require different standards. (e.g., "A battle occurred at X" vs. "The soldiers felt Y").

  7.  **Drafting the Response (Iterative refinement):**
