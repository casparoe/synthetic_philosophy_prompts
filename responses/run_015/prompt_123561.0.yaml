answer: |-
  ### Part 1: Translation into Distributional RL Vocabulary

  **The Independence Axiom as a Linearity Constraint on the Risk Functional**

  In your framework, an agent evaluates a policy $\pi$ by applying a risk functional $\rho$ to the return distribution $Z^\pi(s)$. In Expected Utility Theory (EUT), the Independence Axiom is usually stated as a constraint on preferences over lotteries. Translated into your machinery, it becomes a constraint on the algebraic properties of $\rho$ with respect to mixtures of distributions.

  Let $Z_1$ and $Z_2$ be return distributions corresponding to two policies (or actions), and let $Z_{mix}(\lambda)$ be the mixture distribution resulting from a policy that selects the trajectory of $Z_1$ with probability $\lambda$ and $Z_2$ with probability $1-\lambda$.

  The Independence Axiom asserts that your risk functional must be **linear in probability mixtures**:
  $$ \rho(Z_{mix}(\lambda)) = \lambda \rho(Z_1) + (1-\lambda) \rho(Z_2) $$

  If this holds for all $Z_1, Z_2, \lambda$, then $\rho$ is effectively an expectation operator (possibly affine-transformed). Any risk functional you likely use—CVaR, quantiles, spectral risk measures with non-linear weighting functions—violates this constraint. For example, if $\rho$ is the median (0.5-quantile), the median of a mixture is not the mixture of the medians.

  Therefore, in your dialect, **adhering to the Independence Axiom is equivalent to restricting your architecture to Expectation-based RL.** Adopting a distributional approach with a non-linear risk functional is, by definition, a violation of Independence.

  **The Allais Problems as Violations of Linearity**

  *   **Common-Consequence Pattern:**
      *   *Setup:* You compare a degenerate distribution $Z_A = \delta_{1M}$ against a spread $Z_B$ (mostly \$1M, some \$5M, some \$0). Then you compare $Z_C$ (low prob \$1M, rest \$0) against $Z_D$ (slightly lower prob \$5M, rest \$0).
      *   *Translation:* The "Allais Preference" is observing $\rho(Z_A) > \rho(Z_B)$ while simultaneously $\rho(Z_D) > \rho(Z_C)$.
      *   *Mechanism:* In EUT, $Z_A$ and $Z_B$ share an 89% chance of \$1M. Independence says you should ignore this common mass and compare the remaining 11%. Your framework handles this via the **distortion function** $w(p)$ in your risk measure. If $w(p)$ is non-linear (e.g., inverse-S shaped), the marginal value of moving from $p=0.89$ to $p=1.0$ is weighted differently than moving from $p=0.0$ to $p=0.11$. The violation is simply the statement that your chosen $\rho$ assigns higher value to the reduction of variance in the high-probability regime than the expectation operator does.

  *   **Common-Ratio Pattern:**
      *   *Setup:* Probabilities in one option are a scalar multiple of the other (e.g., $p$ vs $\alpha p$).
      *   *Translation:* This tests the homogeneity of your distortion weighting. If you prefer a sure thing over a gamble, but reverse that preference when both probabilities are scaled down by $\alpha$, your risk functional $\rho$ is sensitive to the absolute magnitude of probabilities, not just their ratios.
      *   *Mechanism:* In spectral risk measures, this implies the weighting function $w(p)$ is not linear. A linear $w(p)$ (Expectation) preserves preference orderings under common ratio scaling. A non-linear $w(p)$ (e.g., overweighting small probabilities) allows the ranking to flip as the mass shifts into a different region of the weighting curve.

  ---

  ### Part 2: The Residue Report

  Here is what survives the translation, what requires smuggling, and what evaporates.

  #### 1. Clean Translations vs. Smuggled Assumptions

  **What Translates Cleanly:**
  The bulk of the Allais phenomena translates cleanly into the language of **Distortion Risk Measures**. The common-consequence and common-ratio effects are direct consequences of applying a non-linear weighting function $w(p)$ to the cumulative distribution function (CDF) of returns.
  *   In your vocabulary, the "Certainty Effect" is simply **probability weighting**.
  *   The violation of Independence is the **non-linearity of $\rho$**.
  *   You do not need EUT to model this; you just need to specify a $\rho$ (like CVaR at $\alpha=0.9$ or a specific spectral measure) that fits the data.

  **What Requires Smuggling (The Degeneracy Problem):**
  You asked about the special status of the degenerate distribution ($p=1$).
  *   **The Gap:** Standard distortion risk measures (CVaR, continuous spectral measures) are continuous with respect to the probability measure. They do not inherently treat $p=1$ differently from $p=0.99$. A continuous weighting function $w(p)$ implies $w(1) - w(0.99) \approx w(0.11) - w(0.10)$ (locally).
  *   **The Smuggle:** To capture the specific Allais intuition where the "Sure Thing" jumps in value discontinuously, you must smuggle in a **discontinuity in the risk functional at variance zero**. You have to assume $\rho$ has a "degeneracy bonus" or that the weighting function $w(p)$ has a jump at $p=1$.
  *   **Verdict:** Your vocabulary supports this (you can define $\rho$ however you like), but it is not a *natural* property of standard distributional objectives like CVaR or Quantile Regression. It requires an explicit architectural bias that treats $\text{Var}(Z)=0$ as a distinct regime from $\text{Var}(Z) \approx 0$. Without this, your framework predicts that subjects should be roughly indifferent between $p=1$ and $p=0.99$ if the payoff difference is small, which contradicts the strong Allais effect.

  #### 2. What Has No Expression in Your Vocabulary

  **Normative vs. Descriptive:**
  *   **Status:** **No Expression.**
  *   **Analysis:** In RL, you are an engineer. You pick a $\rho$ to optimize a specific performance metric (e.g., "minimize ruin probability" or "maximize worst-case return"). The question "Is this rational?" is external to the math. EUT spends immense energy arguing that Independence is a *requirement* of rationality. Your framework treats it as a *hyperparameter choice*.
  *   **Gap:** You cannot express the claim "An agent *ought* to satisfy Independence." You can only say "An agent satisfying Independence optimizes the Mean." The normative force is lost because your framework is instrumental, not philosophical.

  **Money Pumps and Exploitability:**
  *   **Status:** **Collapsed / Redefined.**
  *   **Analysis:** In decision theory, violating Independence makes you susceptible to a "money pump" (a cycle of trades leaving you poorer with the same outcome). This relies on the assumption that Mean Wealth is the only true metric of success.
  *   **In Your Framework:** If an agent optimizes CVaR, it might reject a positive EV bet to reduce tail risk. An EUT observer calls this "exploitable" (you paid to avoid risk). A CVaR observer calls this "optimal."
  *   **Verdict:** The concept of "exploitable" collapses into **"suboptimal with respect to the evaluator's metric."** If the evaluator uses Mean Return, the risk-sensitive agent looks exploitable. If the evaluator uses the agent's $\rho$, the agent is consistent. Your vocabulary lacks a neutral, metric-independent definition of "exploitable." Consequently, the money-pump argument loses its bite; it becomes a warning that "If you optimize $\rho \neq \mathbb{E}$, you will underperform on $\mathbb{E}$," which is a tautology you already accept.

  #### 3. Direct Functional vs. Axiomatic Constraints

  **Does choosing $\rho$ directly lose something?**
  *   **Mathematically:** No. You gain expressivity. You can represent behaviors EUT cannot.
  *   **Conceptually:** Yes, you lose the **derivation**. EUT uses Independence to *derive* the Expectation form from qualitative axioms. It says, "If you agree with these simple logical constraints, you *must* use Expectation."
  *   **Your Approach:** You start with the functional. You bypass the "why."
  *   **Verdict:** The axiom was a roundabout way of pinning down the functional. By going direct, you acknowledge that the functional is a design choice, not a logical necessity. Nothing is lost in terms of modeling power, but you surrender the claim that your agent is "universally rational." You are building a *specialized* agent, not a *general* rational agent.

  ---

  ### Part 3: The Randomizer-Distrust Test

  You proposed the **Randomizer-Distrust Reading**: Subjects prefer the sure option not because of risk aversion, but because they treat the stated probabilities as unreliable (epistemic uncertainty), except for the sure option which requires no randomizer.

  **Is it a genuine rival?**
  **Yes.** It is a genuine rival mechanism that maps to a different part of your stack.

  **Where it maps in your vocabulary:**
  This is not Risk Sensitivity (Aleatoric Uncertainty); this is **Epistemic Uncertainty** and **Robust RL**.
  *   **Standard Allais (Risk):** The agent knows $P(s'|s,a)$ but evaluates returns using a non-linear $\rho$.
  *   **Randomizer-Distrust (Ambiguity):** The agent does *not* trust $P(s'|s,a)$. They believe the true transition kernel lies in a set $\mathcal{P}$.
  *   **Translation:** The "Sure" option ($p=1$) is viewed as robust to model error. The "Gamble" ($p < 1$) is viewed as sensitive to model error. The agent is optimizing a **Robust Risk Functional**:
      $$ \rho_{robust}(Z) = \min_{P \in \mathcal{P}} \mathbb{E}_{P}[Z] $$
      Or, in distributional terms, they are applying a penalty based on the **calibration error** of the reward model.

  **Does this change the Residue Report?**

  1.  **On the Degeneracy Smuggle:**
      *   If the Randomizer-Distrust reading is true, you **do not need to smuggle a discontinuity into $\rho$**.
      *   Instead, the discontinuity exists in the **Epistemic Uncertainty Estimate**.
      *   In your vocabulary: For the "Sure" action, the epistemic variance is 0 (no randomizer needed). For the "Gamble," epistemic variance is $>0$ (distrust of the device).
      *   This fits cleanly into **Offline Policy Evaluation (OPE) with Distribution Shift**. The "Sure" option is on-policy (trusted); the "Gamble" is off-policy (untrusted). You naturally down-weight off-policy returns via importance weighting or uncertainty penalties.
      *   **Result:** This explains the $p=1$ special status without breaking the continuity of your risk functional. It shifts the burden from the *objective* ($\rho$) to the *input model* ($Z$).

  2.  **On Exploitability:**
      *   If the behavior is driven by Epistemic Uncertainty, the agent is not "risk-averse," it is "ambiguity-averse."
      *   In RL terms, this agent is **Robust**. It is not exploitable in the real world if the randomizer *is* actually untrustworthy. It is only exploitable in the idealized lab setting where the experimenter guarantees fairness.
      *   This strengthens the argument that the "Money Pump" critique is environment-dependent. If the environment is non-stationary or the model is misspecified (which is the default in RL), the "irrational" ambiguity-averse agent outperforms the "rational" EUT agent.

  **Conclusion on the Test:**
  The Randomizer-Distrust reading is a superior fit for your vocabulary than the standard Risk-Sensitivity reading. It resolves the "Degeneracy Smuggle" by attributing the discontinuity to **model calibration** rather than **preference weighting**. It suggests that what decision theorists call the "Certainty Effect" might actually be a **prior over transition dynamics** (specifically, a prior that assigns high probability mass to "experimenter error" for any $p \notin \{0, 1\}$).

  If you adopt this reading, the Allais Paradox ceases to be a paradox about rationality and becomes a problem of **Reward Model Calibration** and **Epistemic Uncertainty Quantification**. Your framework handles this naturally; EUT does not.
