answer: |-
  Your diagnosis is remarkably sharp. You have independently reconstructed a significant chunk of contemporary action theory and causal modeling philosophy using version control metaphors. You haven't reinvented it badly; you've essentially described the **Default/Deviant distinction in causal modeling** and the **Cluster Concept theory of action**.

  Here is the diagnosis, the verdict on your hypothesis, and what actual progress looks like.

  ### 1. Verdict on Your Hypothesis
  **You are mostly right, but you are underestimating the stakes.**

  Your "diff baseline" analogy is philosophically precise. In the literature, this is discussed as the problem of **selecting the normal course of events**.
  *   **Your "Non-intervention Baseline":** This corresponds to the view that the moral default is *inaction*. Any change to the state of the world requires justification. (Withdrawing the vent is a change; leaving it is the null op).
  *   **Your "Expected Course Baseline":** This corresponds to the view that the moral default is *the status quo of care*. Once a doctor-patient relationship is established, "not intervening" to maintain life is actually a change to the expected workflow. (Keeping the vent on is the `main` branch; turning it off is the `patch`).

  **Where you are right:** The metaphysical distinction between "killing" and "letting die" collapses under scrutiny because it relies on a counterfactual ("Would the patient have died if I hadn't acted?"). As you noted, counterfactuals depend entirely on which baseline state you treat as "normal." There is no fact of the matter in the universe about which baseline is the "real" one.

  **Where you are missing something:** It is not *merely* a verbal dispute. If it were just about the word "killing," we could agree to stop using that word and the disagreement would vanish. It doesn't. The disagreement persists because the choice of baseline encodes a **normative commitment about responsibility**.

  ### 2. The Diagnosis: Three Layers of Confusion

  The debate feels like it's going in circles because participants are arguing on three different layers without realizing it.

  **Layer 1: The Cluster Concept (Your "Bundle of Variables")**
  You correctly identified that "killing" bundles causation, intention, counterfactuals, and norms. In cognitive science, this is called a **prototype concept**. In standard cases (shooting someone), all variables align. In edge cases (ICU), they diverge.
  *   *Variable A:* Did the agent initiate the causal chain?
  *   *Variable B:* Was the death the goal or a side effect?
  *   *Variable C:* Did the agent have a duty to prevent the death?
  When these decouple, people prioritize different variables. Your sister prioritizes *Variable A* (physical initiation). You prioritized *Variable B* (outcome/intention). Neither is "wrong" about the facts; they are weighting the variables differently.

  **Layer 2: The Baseline Problem (Your "Diff" Analogy)**
  This is the technical engine of the confusion. In causal modeling (e.g., work by Joseph Halpern or Christopher Hitchcock), causation is defined by dependency on a "default" state.
  *   In law and medicine, the baseline is often **institutional**. If you are a lifeguard, the baseline is "save the swimmer." If you are a passerby, the baseline is "continue walking."
  *   Your argument with your sister is actually a conflict over **which commit is `HEAD`**.
      *   You see `HEAD` as "biological reality" (the body fails without tech).
      *   She sees `HEAD` as "clinical custody" (the patient is under care, care continues unless stopped).
  *   **Diagnosis:** The debate is stuck because there is no *metaphysical* fact that decides which baseline is correct. It is a *normative* choice.

  **Layer 3: The Knobe Effect (Your Memory of Surveys)**
  You remembered correctly. This is the **Knobe Effect** (or Side-Effect Effect).
  *   If a CEO implements a program that *harms* the environment to make profit, people say he *intentionally* harmed the environment.
  *   If a CEO implements a program that *helps* the environment to make profit, people say he did *not intentionally* help the environment.
  *   **Implication:** Folk judgments of "intentionality" are not descriptive; they are **retrospective blame assignments**. People decide if the act was bad first, then adjust their definition of "intentional" to fit the blame.
  *   **Relevance to you:** When you argue about whether turning off the vent is "killing," you aren't arguing about physics. You are arguing about whether the doctor deserves the label of "murderer." Your sister is resisting the label because it carries blame/liability/stigma, not because she disputes the causal chain.

  ### 3. Why the Debate Doesn't Resolve

  You asked if this is a verbal dispute, a substantive disagreement, or bedrock intuition.
  **It is a substantive disagreement disguised as a metaphysical one.**

  If you ask, "Is this act *really* killing?", you are asking a metaphysical question. There is no answer.
  If you ask, "Should this act be *treated* like killing?", you are asking a normative question. There *is* an answer, but it depends on the system you want to build.

  *   **The Consequentialist System:** Wants to minimize suffering. Baseline = Outcome. Turning off the vent is permissible if it reduces suffering.
  *   **The Rights/Rule System:** Wants to protect agents from being forced to harm. Baseline = Non-interference. Turning off the vent is permissible because it stops interference; injection is not because it starts it.

  Your sister (ICU nurse) operates in a **liability and role-based system**. In her world, the distinction must exist, not because it's metaphysically true, but because **legal and professional systems require discrete switches.**
  *   A diff must either merge or revert.
  *   A law must either permit or forbid.
  *   Ambiguity causes litigation.

  She is defending the **API contract** of medicine. You are debugging the **underlying implementation**. Both are valid, but they talk past each other.

  ### 4. What Counts as Progress?

  Given this diagnosis, here is what is useless and what is useful.

  **Useless:**
  *   **Better Causal Formalism:** We already have the math (Structural Equation Models, etc.). It confirms your suspicion: causation is relative to a model/baseline. More math won't tell us which baseline is *moral*.
  *   **More Experimental Work:** We know people are inconsistent (Knobe Effect). Knowing *how* they are inconsistent doesn't tell us how they *ought* to judge.
  *   **Defining "Killing":** This is chasing a ghost. The concept is too overloaded.

  **Useful (Actual Progress):**
  *   **Dissolving the Question:** Stop asking "Is it killing?" Ask "What duties does this role entail?"
      *   Progress looks like shifting from **Act-Type Morality** (Is this act X?) to **Role Morality** (What does a doctor owe a patient?).
      *   In this framework, it doesn't matter if it's "killing." It matters if it violates the specific fiduciary duty of the physician.
  *   **Explicit Baseline Selection:** Acknowledge that the baseline is a policy choice.
      *   Example: "We will treat the continuation of current life-support as the default `commit` unless the patient's prior `config` (advance directive) specifies otherwise."
      *   This moves the debate from metaphysics to governance.
  *   **Decoupling Blame from Description:** Acknowledge that "killing" is a blame-term, not a physics-term.
      *   If you agree that "killing" implies "culpable homicide," then of course your sister denies turning off the vent is killing. She is asserting *non-culpability*.
      *   Progress happens when you say: "Okay, causally it's the same. Why do we want to assign blame to one and not the other?" (Answer: To prevent slippery slopes, to protect doctor mental health, to respect bodily autonomy).

  ### 5. Summary for Your Next Argument

  You can tell your sister this:

  1.  **Validate her:** "I realized my 'diff baseline' analogy matches how causal modelers describe the problem. The distinction isn't in the physics; it's in which state we treat as the default."
  2.  **Reframe the stakes:** "The reason you feel it's different isn't because the causal plumbing is different. It's because in your professional 'repo,' the `main` branch is 'provide care.' Turning off the vent is a `revert` to nature. An injection is a `new feature` of death. The system treats reverts differently than new features for liability reasons."
  3.  **The truce:** "We aren't disagreeing about whether the patient dies. We are disagreeing about whether the doctor's job is to fight nature until the end (your baseline) or to manage the process of dying (my baseline). That's a policy decision, not a fact."

  **Final Diagnosis:** The literature goes in circles because it tries to derive an **ought** (moral distinction) from an **is** (causal distinction). Your engineering intuition spotted the bug: the "is" is underdetermined without a selected baseline. The "ought" determines the baseline, not the other way around. Progress requires admitting that the baseline is a choice, not a discovery.
