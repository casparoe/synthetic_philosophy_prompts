      *Key Insight:* The impasse exists because Al-Ghazālī is solving a *theological* problem (miracles/omnipotence) using *metaphysical* tools, but he doesn't commit to a full *physics*. The participants are trying to extract a physics where he only intended a theology.

  8.  **Final Polish:** Ensure the distinctions are sharp. Use terms like "Causal Exclusion" vs. "Causal Overdetermination" vs. "Causal Subordination." Highlight the definition of *ḍarūra* (necessity).

      *(Refining the "Verbal" aspect)*: It's not *just* verbal. It's about the *locus* of contingency. Is the contingency in the *thing* or in the *connection*?

      *(Refining the "Underdetermination")*: If the text underdetermines, it's because Ghazali's goal was *apophatic* regarding secondary causes—he wanted to leave room for God, not define fire.

