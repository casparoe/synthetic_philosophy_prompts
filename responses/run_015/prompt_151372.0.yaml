prompt: |-
  Hi — I run the integrity/compliance function at a mid-sized INGO (health and cash transfer programmes, around 40 country offices). We have a whistleblowing line that staff and beneficiaries can text into, and we get maybe 200 reports a year, of which something like 60 are about money or favours rather than safeguarding or HR stuff. Right now triage is basically: whoever is on duty reads it, forms a view, and the country director decides. Unsuprisingly we are wildly inconsistent — one office dismissed someone for a $15 facilitation payment, another office treated a much bigger thing as "local custom" and closed it. Reports go to donors in aggregate and occasionally individually, and some end in dismissal or a police referral, so the inconsistency is starting to be a real problem for us.

  What I need from you is a written procedure my team can actually run. Constraints: triage is done by a two-person team (neither is a lawyer, both are from the region), they have maybe 30 minutes per report, the output has to be a short written record that a regional director can sign off on and that would survive being read aloud to (a) a donor and (b) the local staff whose practice it is. And it has to work in translation — most offices don't operate in English.

  Conceptually I think we keep conflating four questions and I want the procedure to keep them apart:
  (i) does the thing fit the definition of corruption at all;
  (ii) if it does, who is made worse off, and how identifiable are those people;
  (iii) is the person involved blameworthy given what their actual options were — I keep running into cases where refusing to pay isn't a real option, as opposed to cases where both sides are collaborating to get something they're not entitled to;
  (iv) what we do about it: sanction the individual, report it upward, change our own process so the payment stops being necessary, or leave it alone.
  I want the procedure to output both a classification and a response recommendation, and to be explicit that these can come apart — something can be corruption and still warrant no sanction.

  Two design requirements I care about, and please argue with me if you think either is wrong:

  - Currency neutrality. The transfer might be cash, but it might be a job for a nephew, school fees, a goat, an invitation to a wedding, a promise to turn up at a rally, or help getting a relative out of a police station. Our current practice treats cash as the serious case and the rest as "culture", which I'm fairly sure is just parochialism with a nicer name. I want the classification to come out the same if you swap the currency, and I want the procedure to say so out loud rather than leave it implicit.
  - Relationship-shaped cases. A lot of what reaches us isn't a single act, it's a pattern over years: the same intermediary connecting the same people across completely different domains — a small sub-contract here, help getting a kid into school there, a hospital bed, a police matter quietly sorted. Each act is defensible on its own; the thing that worries me is the relationship. So I want a branch that takes a pattern rather than an act as the unit of analysis, and a test for when a pile of individually fine acts adds up to something we should call clientelism. My guess at the test is something about convertibility (can credit earned in one domain be cashed in another?) and something about who else could have obtained the same thing, but please do better than my guess.

  Things I want flagged rather than smoothed over:

  - Cases where nobody personally profited. Quite often an office does something improper and the benefit accrues to the programme or to the community, not to any individual. Our rules — which are basically "use of a position for private gain" — fit these badly, and I'd rather the procedure tell me it doesn't know what to do with them than pretend they're just the easy case.
  - Where our own standard is the imported one. I'd like some kind of stress test that catches us applying a Western or northern intuition and calling it universal. But I also know that kind of test gets abused as a blanket excuse, so tell me where it misfires and what stops someone using it to wave anything through.
  - Where the collective-action version bites. Even where everyone agrees a practice is bad, one office that opts out on its own loses its licence, its shipments, its land, while the practice carries on regardless — which means our own rule creates pressure to not report rather than to not pay. I want the procedure to register this where it applies and to say how the record should note it.
  - Which decisions genuinely can't be made by procedure and have to go to a named person as a values call. I need to know which boxes those are and who signs.

  Deliverable: a one-page version I can hand to the team — ordered questions, what counts as a sufficient answer to each, where it stops with a no, where it hands off — plus a short appendix saying, for each step, which distinction is doing the work and which distinctions you deliberately dropped to make it usable, and where it will misfire. I definately don't need citations or a reading list, I can't check them and they'd be no use to me; just give me the reasoning.

  Then run it on three cases and show me the records you'd actually produce:

  1. Enumerators registering households for a cash programme are routinely given eggs or a chicken afterwards. The teams say refusing is an insult and head office has told them to accept. One enumerator later helped a household that had given her a chicken fill in their form "properly" so they'd qualify. Small stuff in itself, but it's dozens of times a week across a whole district, and the second bit feels different to me in a way I can't articulate — if the procedure can articulate it, that would be worth a lot.

  2. A logistics assistant pays the equivalent of about $12 to a customs clerk to release a consignment of therapeutic food that is already legally cleared and has been sitting for nine days after three weeks of written requests that went nowhere. He reports it himself the same day, he has the receipt, and he's the person who kept telling the regional office the shipment was stuck. Nobody was personally enriched and the food reached a feeding programme.

  3. A country office needed land for a distribution site and a chief provided it, essentially for free, because the office had a long relationship with his family. Later the office hired his daughter as a casual enumerator ahead of 40 applicants with better test scores. For two years the office has also routed small sub-contracts, staff medical referrals and a couple of school-fee advances through the same local fixer, who is also a youth organiser for the governing party. Staff say he is the only reason anything gets done in that district and that they owe him. Classify it, tell me who is harmed and how identifiable they are, and tell me what we do — because my instinct is that sanctioning anyone here would be insane and would cost us the programme, and I want to know whether the procedure agrees with me or whether it tells me I'm just protecting my own office.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and case analysis:

  1.  **Analyze the Request:**

      *   **User Role:** Head of Integrity/Compliance at a mid-sized INGO (health/cash, 40 countries).
      *   **Problem:** Inconsistent triage of whistleblowing reports (200/year, 60 financial/favor-based). Current process is ad-hoc (duty officer + Country Director).
      *   **Constraints:** 2-person triage team (non-lawyers, regional), 30 mins/report, output must be short/written/defensible (to donors & staff), must work in translation.
      *   **Core Conceptual Framework:** Separate four questions: (i) Definition of corruption, (ii) Harm/victims, (iii) Blame/agency, (iv) Response (sanction vs. process change).
      *   **Design Requirements:**
          *   Currency Neutrality (cash = favors/goods).
          *   Relationship-shaped cases (pattern vs. act, clientelism test).
      *   **Specific Flags to Address:**
          *   No personal profit (institutional/program benefit).
          *   Imported standards (Western vs. Universal).
          *   Collective Action Problem (opting out loses license).
          *   Values Calls (where procedure stops, human decides).
      *   **Deliverables:**
          1.  One-page Procedure (ordered questions, stop points, hand-offs).
          2.  Appendix (Reasoning, distinctions made/dropped, failure modes).
          3.  Three Case Studies (run through the procedure, producing the actual record).

  2.  **Deconstruct the Procedure (The "One-Pager"):**

      *   *Goal:* Needs to be actionable, logical, and enforce the separation of the four conceptual questions.
      *   *Structure:*
          *   Header (Case ID, Date, Triage Officers).
          *   Section 1: Classification (Is it corruption/misconduct?). Needs to handle currency neutrality.
          *   Section 2: Harm & Victims (Who loses?).
          *   Section 3: Agency & Blame (Coercion vs. Collaboration). Needs to handle collective action.
          *   Section 4: Pattern Check (Clientelism test).
          *   Section 5: Recommendation (Sanction vs. Systemic Fix).
          *   Section 6: Values Call (Where human judgment is explicitly required).
      *   *Language:* Simple, direct, translatable. Avoid legal jargon.

  3.  **Drafting the Procedure - Step-by-Step:**

      *   *Step 1 (Definition):* Move away from "private gain." Use "Undue Advantage." If value changes hands to influence an official act, it counts. *Constraint:* Must treat eggs same as cash.
      *   *Step 2 (Harm):* Who is worse off? Beneficiaries who didn't pay? Other applicants? The organization's reputation? If "No one," flag for "Institutional Benefit."
      *   *Step 3 (Agency):* Was there a choice? "Duress" vs. "Collusion." This addresses the collective action problem. If refusing means the program stops, that's duress.
      *   *Step 4 (Pattern):* The "Clientelism Test." Convertibility (can favor A buy outcome B?) and Exclusivity (could others get this?).
      *   *Step 5 (Response):* Split Sanction (person) from Remedy (system).
      *   *Step 6 (Sign-off):* Who signs what? Regional Director for sanctions, Integrity Head for systemic flags.

  4.  **Developing the Appendix (Reasoning & Trade-offs):**

      *   *Currency Neutrality:* Explicitly state value is value. Drop the "cash is king" bias.
      *   *Relationship/Clientelism:* Define the test clearly (Convertibility + Exclusivity).
      *   *Imported Standards:* Add a "Local Context" check but limit it (cannot override core safeguarding or legal compliance).
      *   *Collective Action:* Explicitly allow "Duress" as a mitigator without excusing the act entirely.
      *   *Failure Modes:* Where will this break? (e.g., subtle coercion, complex networks).

  5.  **Running the Case Studies:**

      *   *Case 1 (Eggs/Chicken + Form Filling):*
          *   *Classification:* Yes (Value for Influence).
          *   *Harm:* Other households (fairness).
          *   *Agency:* Mixed. Accepting gift = cultural pressure. Filling form "properly" (fraud) = active choice.
          *   *Pattern:* Systemic (dozens/week).
          *   *Outcome:* Sanction for fraud, Process change for gifts.
      *   *Case 2 (Customs Bribe for Therapeutic Food):*
          *   *Classification:* Yes (Facilitation payment).
          *   *Harm:* Institutional integrity, potential legal risk. No direct beneficiary harm (food arrived).
          *   *Agency:* Duress/Collective Action (shipment stuck 3 weeks, legal clearance held).
          *   *Outcome:* No sanction (Duress), Report to Donor (Transparency), Systemic Fix (Escalation path for customs).
      *   *Case 3 (Chief's Land + Daughter + Fixer):*
          *   *Classification:* Yes (Clientelism/Conflict of Interest).
          *   *Harm:* Other applicants (meritocracy), Political neutrality.
          *   *Agency:* Collusion (long-term relationship, hiring daughter).
          *   *Pattern:* High (Convertibility: Land -> Jobs -> Contracts).
          *   *Outcome:* High Risk. Sanction CD? Or Systemic Exit? This is the "Values Call." The procedure should flag the risk of program loss but demand a decision on whether the relationship compromises independence.

  6.  **Refining the Output:**

      *   *Tone:* Professional, pragmatic, direct. No fluff.
      *   *Format:* Clear headings, bullet points.
      *   *Check against constraints:* 30 mins? Yes, if questions are sharp. Translation? Yes, simple concepts. 2-person team? Yes, requires consensus.
      *   *Self-Correction on Case 3:* The user says sanctioning is "insane." The procedure shouldn't force insanity. It should highlight the *risk* and force the "Values Call." The recommendation might be "Managed Risk" rather than "Sanction," but it must be documented as a deviation from meritocracy.

  7.  **Final Polish:**

      *   Ensure the "Four Questions" are clearly mapped to the procedure steps.
      *   Ensure the "Clientelism Test" is specific (Convertibility/Exclusivity).
      *   Ensure the "Values Call" box is prominent.
      *   Check the Appendix for honesty about where the procedure fails.

  *(Self-Correction during drafting)*: I initially thought about putting the "Imported Standard" check early. Better to put it in the "Agency/Blame" section. If the rule itself is the problem, that's a systemic issue, not an individual blame issue.
  *(Refining the Clientelism Test)*: User suggested "convertibility." I will formalize this as "Cross-Domain Credit." Can a favor in hiring buy a favor in logistics? If yes, it's clientelism.
  *(Refining Case 1)*: The "filling form properly" bit is fraud. The "eggs" bit is cultural. The procedure needs to separate these. The eggs might be excusable; the fraud is not.

  8.  **Final Review against User Prompt:**
      *   One-page procedure? Yes.
      *   Appendix with reasoning/trade-offs? Yes.
      *   Three cases run with records? Yes.
      *   Currency neutrality included? Yes.
      *   Relationship-shaped cases included? Yes.
      *   Flags (no profit, imported standard, collective action, values call) included? Yes.

  Let's write it.cw
answer: |-
  # INTEGRITY TRIAGE PROCEDURE (v1.0)
  **For:** Regional Integrity Team (2-person triage)  
  **Time Limit:** 30 Minutes per report  
  **Output:** Triage Record (Max 1 page)

  ### PART A: CLASSIFICATION (The Act)
  **1. Value Exchange:** Did a transfer of value occur? (Cash, goods, favors, jobs, access, promises).  
  *   *Note: A chicken = $15. A job for a nephew = Salary value. Treat all value as equal.*  
  *   [ ] Yes [ ] No → *If No, close as non-financial.*

  **2. Intent:** Was the value given/received to influence an official act, decision, or priority?  
  *   *Note: "Gifts" given *after* a standard service are still value exchanges if they create expectation for next time.*  
  *   [ ] Yes [ ] No → *If No, close as cultural courtesy.*

  **3. Rule Breach:** Does this violate written policy or local law?  
  *   [ ] Yes [ ] No → *If No, but feels wrong, flag as "Policy Gap."*

  ### PART B: HARM & VICTIMS (The Impact)
  **4. Who is worse off?** Select all that apply.  
  *   [ ] Other beneficiaries (e.g., jumped queue, ineligible selected).  
  *   [ ] Other staff/applicants (e.g., lost job to less qualified candidate).  
  *   [ ] The Organisation (legal risk, reputation, donor trust).  
  *   [ ] No specific individual (Benefit accrued to Programme/Community).  
  *   [ ] Unclear.

  **5. Identifiability:** Can we name the losers?  
  *   [ ] Specific individuals named.  
  *   [ ] Class of people identifiable (e.g., "the 40 applicants").  
  *   [ ] Diffuse/Abstract (e.g., "Public Trust").

  ### PART C: AGENCY & BLAME (The Choice)
  **6. Duress Test:** Could the staff member have refused without catastrophic failure of the programme?  
  *   *Test: If refusing means shipments rot, land is revoked, or staff safety is compromised.*  
  *   [ ] Yes, refusal was possible.  
  *   [ ] No, refusal meant program stoppage (Collective Action Trap).  
  *   [ ] Mixed.

  **7. Imported Standard Check:** Is the rule being broken based on Northern HQ policy or Local Law/Custom?  
  *   *If Local Law allows it but HQ policy forbids it: Flag as "Policy Conflict."*  
  *   *If Local Law forbids it: Proceed as Breach.*

  ### PART D: PATTERN CHECK (The Relationship)
  **8. Clientelism Test:** Is this a single act or a web?  
  *   *Convertibility:* Can credit earned in one domain (e.g., land) be cashed in another (e.g., hiring)? [ ] Yes [ ] No  
  *   *Exclusivity:* Could a stranger have obtained the same result without this relationship? [ ] Yes [ ] No  
  *   *If Yes to both:* Classify as **Systemic Clientelism**.

  ### PART E: RECOMMENDATION & SIGN-OFF
  **9. Action Split:** (These can differ)  
  *   **Individual Sanction:** [ ] None [ ] Warning [ ] Dismissal [ ] Legal Referral  
  *   **Systemic Remedy:** [ ] Process Change [ ] Donor Notification [ ] Accept Risk [ ] Exit Country  

  **10. Values Call:** Does this decision require overriding a standard rule due to context?  
  *   [ ] No (Procedure is clear).  
  *   [ ] Yes (Requires Regional Director signature below).  
  *   *Reason for override:* _________________________________________________

  **Triage Officers:** ___________________ **Date:** __________  
  **Regional Director (if Values Call):** ___________________

  ***

  # APPENDIX: DESIGN LOGIC & FAILURE MODES

  **1. Currency Neutrality**
  *   **Distinction:** We treat *value* as the unit, not *currency*. A chicken is a bribe if it buys influence.
  *   **Drop:** We dropped the distinction between "personal enrichment" and "program benefit." Both are recorded in Part B.4.
  *   **Misfire:** Staff may argue a chicken is "too small to matter." The procedure forces them to count the *frequency* (Part D) rather than the unit value.

  **2. Relationship-Shaped Cases (Clientelism)**
  *   **Distinction:** We distinguish *transactions* from *relationships*. The test is **Convertibility** (can I spend favor A on outcome B?) and **Exclusivity** (is this channel open to others?).
  *   **Drop:** We dropped the requirement to prove "intent to corrupt" over time. The pattern itself is the risk.
  *   **Misfire:** Hard to prove convertibility without deep investigation. Triage relies on staff admission or obvious links (e.g., Chief gives land -> Chief's daughter gets job).

  **3. The "No Profit" & "Imported Standard" Flags**
  *   **Distinction:** We separate *Rule Breach* (Part A) from *Blame* (Part C). You can break a rule to save a program (Duress) or to help a community (No Profit).
  *   **Drop:** We dropped the idea that "Program Benefit" automatically excuses the act. It is recorded as "Harm to Organisation" instead of "Harm to Beneficiary."
  *   **Misfire:** "Program Benefit" can become a blanket excuse for inefficiency. Part C.6 (Duress) limits this: was refusal *actually* impossible, or just inconvenient?

  **4. Collective Action & Values Calls**
  *   **Distinction:** We acknowledge that sometimes following the rule breaks the mission. This is not a triage decision; it is a leadership decision (Part E.10).
  *   **Drop:** We dropped the expectation that Compliance can solve political problems. We flag them for the Regional Director.
  *   **Misfire:** Regional Directors may sign overrides routinely, normalizing the exception. Audit this box quarterly.

  ***

  # TRIAGE RECORDS: CASE RUN-THROUGHS

  ## CASE 1: The Eggs & The Forms
  **Part A: Classification**
  1. Value: Yes (Eggs/Chicken + Labor).
  2. Intent: Yes (Gifts to smooth registration; Labor to alter eligibility).
  3. Rule Breach: Yes (Fraud on forms; Policy on gifts).

  **Part B: Harm**
  4. Worse off: Other households (ineligible families qualify, eligible might be pushed out by quota).
  5. Identifiability: Class identifiable (Neighbors in same district).

  **Part C: Agency**
  6. Duress: Mixed. Accepting eggs = Social pressure (High). Filling form falsely = Choice (Low pressure).
  7. Imported Standard: Fraud is universal. Gift acceptance is cultural.

  **Part D: Pattern**
  8. Clientelism: Convertibility (Yes, gift buys administrative flexibility). Exclusivity (No, seems routine for all enumerators).
  *Classification:* **Systemic Fraud facilitated by Cultural Norms.**

  **Part E: Recommendation**
  *   **Individual Sanction:** Warning/Retraining for gift acceptance. **Dismissal** for form fraud (active falsification).
  *   **Systemic Remedy:** Process Change. Head Office instruction to "accept" gifts must be revoked. Verification audits increased.
  *   **Values Call:** No. Fraud is clear.

  **Reasoning:** The procedure separates the *gift* (cultural/duress) from the *fraud* (choice). The "filling in properly" is not cultural; it is eligibility fraud. The harm is to the integrity of the cash programme.

  ## CASE 2: The Customs Bribe
  **Part A: Classification**
  1. Value: Yes ($12 Cash).
  2. Intent: Yes (Release of goods).
  3. Rule Breach: Yes (Facilitation payment).

  **Part B: Harm**
  4. Worse off: The Organisation (Legal/Compliance risk). Beneficiaries (None, food arrived).
  5. Identifiability: Diffuse (Donor trust).

  **Part C: Agency**
  6. Duress: **Yes.** (Shipment stuck 3 weeks, therapeutic food, legal clearance held hostage). Refusal meant program failure.
  7. Imported Standard: Local law likely forbids bribery, but practice is endemic. HQ policy forbids strictly.

  **Part D: Pattern**
  8. Clientelism: Convertibility (No, one-off transaction). Exclusivity (No, likely standard rate for all).
  *Classification:* **Coerced Facilitation Payment.**

  **Part E: Recommendation**
  *   **Individual Sanction:** **None.** (Staff reported self, acted under duress to save programme).
  *   **Systemic Remedy:** Donor Notification (Transparency). Process Change (Regional Office to handle customs clearance, not field staff).
  *   **Values Call:** No. Duress test met.

  **Reasoning:** Currency neutrality holds ($12 is a bribe). However, Part C.6 (Duress) removes blame from the individual. The harm is institutional, not beneficiary-focused. The remedy is systemic (change who deals with customs), not punitive.

  ## CASE 3: The Chief, The Daughter & The Fixer
  **Part A: Classification**
  1. Value: Yes (Land, Job, Contracts, School Fees).
  2. Intent: Yes (Mutual support network).
  3. Rule Breach: Yes (Conflict of Interest, Nepotism, Political Neutrality).

  **Part B: Harm**
  4. Worse off: Other applicants (40 people), The Organisation (Political compromise).
  5. Identifiability: Specific (The 40 applicants).

  **Part C: Agency**
  6. Duress: **Mixed/Debatable.** Staff claim "only reason anything gets done."
  7. Imported Standard: Meritocratic hiring is HQ policy. Local custom is patronage.

  **Part D: Pattern**
  8. Clientelism: Convertibility (**Yes**, Land -> Job -> Contracts). Exclusivity (**Yes**, only the Chief's network gets this).
  *Classification:* **High-Risk Systemic Clientelism.**

  **Part E: Recommendation**
  *   **Individual Sanction:** **Values Call Required.** (Sanctioning CD may lose programme; Not sanctioning violates meritocracy).
  *   **Systemic Remedy:** Exit Strategy or Managed Risk. Cannot continue as is.
  *   **Values Call:** **YES.**
      *   *Reason:* The relationship compromises organisational independence. Continuing validates a political patronage network. Exiting harms beneficiaries.
      *   *Decision:* Regional Director must decide: Do we prioritize *Access* (stay and manage risk) or *Integrity* (exit or fire CD)?
      *   *Record:* "Programme dependency on single political actor exceeds risk threshold. Recommend phased withdrawal or complete restructuring of local partnerships within 6 months."

  **Reasoning:** This fails the Clientelism Test (Convertibility + Exclusivity). It is not a single act; it is a structure. The "Collective Action" flag is active (opting out loses land), but the "Imported Standard" flag is less relevant (nepotism is generally illegal locally too). The procedure forces the Regional Director to admit this is a strategic risk, not just a compliance tick-box. You cannot "fix" this with a warning.
