          3.  *Delegated vs. Basic:* True. Infra authority is always derived from a higher config. Moral authority is often claimed as intrinsic.
      *   *Blind Spot or Vagueness?*
          *   It's a blind spot in infra. We assume identity is discrete and static (a UUID). We don't model *temporal identity continuity* where the UUID's permissions might legitimately change based on internal state mutations that aren't "compromise."
          *   It's *not* vagueness in philosophy. The tension is real: Is a person a *narrative* (sum of all states) or a *project* (execution of an initial plan)? Infra assumes the latter (Config Management), but humans might be the former.

