prompt: |-
  hey — I'm an infra engineer, about twelve years in, mostly distributed systems and identity/access management. Fluent territory for me: PKI (CAs, key rotation, revocation lists, delegation certs, roots of trust), capability-based security, and conflict resolution in eventually-consistent stores — vector clocks, last-writer-wins, CRDTs, compare-and-swap, leases, runbook automations that fire later under conditions nobody could fully see at write time. Philosophy background is basically nil: I read the personal identity part of Parfit once and that's it, so please don't assume I know any of this literature.

  The situation, which is why I'm asking. My mother has early-stage Alzheimer's. While she was healthy she signed a fairly specific advance directive — no feeding tube, no antibiotics for pneumonia, no aggressive treatment generally — and she told us at the time "I don't want to be kept going as a vegetable." Now she's actually pretty content most days, she can't manage money or her meds, but she's still sharp about what she enjoys and she gives consistent, articulate reasons when asked: she says it isn't what she imagined, that she's glad to be here, that she wants everything done. And she wrote a line in her own handwriting at the bottom of the directive: "if I later say I've changed my mind, don't listen to me."

  What I want from you: restate the philosophical argument about this — the authority of the earlier self, precedent autonomy, whatever the standard moves are for and against treating the directive as binding — in the vocabulary I actually use. Concretely:

  - Give me the mapping first. As far as I can tell the directive is a pre-authorized conditional action signed by a key that has since been rotated; the earlier self and the current self are two replicas that have diverged; her request now is a write that conflicts with an earlier write; and the "revoke it" move looks like a revocation request coming from a possibly-degraded or possibly-compromised key holder. Tell me where that mapping is right and where I've already smuggled in a conclusion by choosing it.
  - Then translate the main positions one at a time — the one that says the earlier self's authority over her own later treatment is just the same authority you have over your own treatment next week, the one that says the current self wins because she's the one who's actually there and bears it, the middle view that distinguishes deep values from moment-to-moment desires and says only the first are hers, and whatever the fallback is when nobody trusts the directive (best interests, substituted judgment). For each: what carries over cleanly into infra terms, what you had to bend to make it fit, and what flatly cannot be said in my vocabulary.
  - Then the residue report, which is the part I care about. My guesses at the stuff with no counterpart: there's no CA above a root of trust, so nothing external can adjudicate which self is authoritative; "same person over time" has no analogue that isn't just "same key"; harm to a person isn't like damage to a service, because with a service there's an owner standing outside it who can say the outcome was bad, and here there isn't; and authority in my world is always *delegated* from some configuration someone set, whereas the earlier self's authority is supposed to be basic rather than derived. Tell me which of those are real and which are me misunderstanding, and then the harder question: is the leftover a blind spot in how distributed systems people think about identity and authorization, or is it a sign that the philosophers are arguing about something they haven't actually made clear?

  Two constraints. Don't tell me what the law says in any jurisdiction and don't hand me a reading list or names to look up — I'm not going to follow them, I want the machinery. And please actually take the handwriting clause seriously rather than treating it as a throwaway: in my terms it looks like a precommitment that tries to disable its own revocation while a condition holds, i.e. a lease the holder can't cancel while she's in the triggering state. Feed that clause to each of the views above and tell me what it does to them — especially given that she isn't just impulsively reversing herself, she's offering reasons and new information the earlier signer didn't have.
