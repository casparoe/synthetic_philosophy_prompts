prompt: |-
  I play this giant online game with like millions of people on the same server. There's a world event that only unlocks if a certain percantage of the server finishes a boring side quest. I could finish it, but obviously one person out of millions won't make or break the threshold. My friend says I should still do it because if I skip it, that probably means I'm the kind of person who skips these things, and if a lot of people are like that then the server probably won't hit the goal. I feel like that's not a real reason because my action can't change the actual number, but I also don't want to be the kind of person who skips stuff that helps the whole server get the reward. What do I do?
reasoning: |-
  Here's a thinking process that leads to the suggested advice:

  1.  **Analyze the User's Dilemma:**
      *   **Context:** A massive multiplayer online game (MMO) with millions of players on a single server.
      *   **Situation:** A world event unlocks only if a certain percentage of players complete a boring side quest.
      *   **Conflict:**
          *   *Logical View:* One person's contribution is statistically negligible (1 out of millions). Doing it won't change the outcome.
          *   *Social/Ethical View:* The friend argues that skipping it reflects a mindset ("free-riding") that, if universalized, leads to failure. The user doesn't want to be the "kind of person" who skips contributing to the collective good.
      *   **Goal:** Decide whether to do the quest or not, resolving the tension between logical futility and social responsibility/identity.

  2.  **Deconstruct the Arguments:**
      *   **The "Causal Impact" Argument (User's view):** In a system of millions, $N$ vs $N+1$ makes no practical difference. The probability of *my* specific action being the tipping point is near zero. This is the classic "Paradox of the Heap" or "Voter's Paradox."
      *   **The "Universalizability" Argument (Friend's view):** This is Kantian ethics (Categorical Imperative). "What if everyone did that?" If everyone skips, the event fails. Therefore, I should contribute.
      *   **The "Identity" Argument (User's internal conflict):** "I don't want to be the kind of person who skips stuff." This is about virtue ethics. Who do I want to be?

  3.  **Evaluate the Game Design Context:**
      *   Game developers set these thresholds knowing individual impact is low. They rely on the *aggregate* behavior.
      *   Usually, these thresholds are set *low enough* that a reasonable portion of active players will trigger it without 100% participation.
      *   However, if the threshold is high (e.g., 90%), individual participation matters more than if it's low (e.g., 10%).
      *   Is the quest *actually* boring? If it's fun, do it. If it's tedious, the cost/benefit analysis changes.

  4.  **Synthesize a Perspective:**
      *   Acknowledge the logic: The user is right mathematically.
      *   Acknowledge the ethics: The friend is right philosophically.
      *   Find the middle ground: It's not about the *number*, it's about the *community* and *self-image*.
      *   Consider the "Signaling" aspect: Doing it signals support for community events.
      *   Consider the "Fun" aspect: If it's truly miserable, maybe skip it without guilt. If it's just "meh," do it for the vibe.

  5.  **Drafting the Advice (Iterative Process):**

      *   *Validation:* Start by validating both sides. Yes, mathematically you don't matter. Yes, ethically your mindset matters.
      *   *The "Voter's Paradox" Analogy:* Compare it to voting. One vote rarely decides an election, but democracy fails if no one votes.
      *   *The "Threshold" Reality:* Explain how game devs design these. They usually expect drop-off.
      *   *The "Identity" Question:* Address the user's specific worry about being "that kind of person."
      *   *Actionable Advice:* Give a framework for deciding.
          *   How boring is it?
          *   How close is the server to the goal? (Check progress bars).
          *   Do you want the reward?
      *   *Conclusion:* It's okay to skip if it's truly painful, but doing it is a low-cost way to support the community vibe.

  6.  **Refining the Tone:**
      *   Keep it empathetic, not preachy.
      *   Use gaming terminology (server, world event, grind).
      *   Avoid saying "You must do it" or "You should skip it." Instead, offer a way to think about it.

  7.  **Key Insight to Highlight:**
      *   The friend's argument isn't about *causal impact* (your number changing the total); it's about *correlation* (your action predicts others' actions) and *identity* (building a habit of cooperation).
      *   However, in a game, *fun* is the primary metric. If it's not fun, it's a job.

  8.  **Final Polish (structuring the response):**
