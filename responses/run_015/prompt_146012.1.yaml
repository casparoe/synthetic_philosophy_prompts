prompt: |-
  Please argue either that luck egalitarianism can be rescued from, or that it necessarily collapses under, what we can call the recursive correction problem: in any institutional framework that compensates for circumstance-based disadvantage, the compensation itself becomes part of the agent's opportunity set, which means that subsequent choices made within that corrected set generate new inequalities that the framework must classify as either choice-based or circumstance-based. Because the correction mechanism is itself a circumstance for all future choice-evaluations, the theory cannot non-circularly distinguish the two categories after the first round of compensation. Take a definite position—either show that a non-circular distinction is available (specify exactly what it is and how it applies to a concrete case, such as educational subsidies that alter career-choice baselines) or concede the collapse and state what normative principle should govern distribution instead. Lead with your bottom line in the first sentence, then develop the reasoning, with no preamble and no restatement of the question. Be committed: choose one horn, defend it with explicit institutional examples, and do not present the alternatives as equally viable.
