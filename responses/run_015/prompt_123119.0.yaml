answer: |-
  ### The Desiderata List

  You want a theory that works for the bench scientist and the clinician, not just the armchair evolutionist. That means prioritizing utility over metaphysical purity. Here is the bill of goods you're actually asking for, filtered through the cases that break the standard models.

  1.  **The Malfunction Constraint**
      *   **Demand:** An account must distinguish *having* a function from *performing* it. A broken heart still has the function of pumping; a working heart that pumps blood but wasn't selected/organized to do so (e.g., a spasming lump) does not.
      *   **Case:** The congenitally malformed heart that has never pumped.
      *   **Status:** **Non-negotiable.** (Clinicians cannot diagnose pathology without this).

  2.  **The Ahistorical Access Constraint**
      *   **Demand:** Function ascription must be possible without phylogenetic data or knowledge of lineage history.
      *   **Case:** The *de novo* gene with no homologs; the molecular biologist characterizing a pathway on Day 1.
      *   **Status:** **Non-negotiable.** (Goal ii of your purpose).

  3.  **The Specificity Constraint**
      *   **Demand:** An account must distinguish functions from mere causal effects or byproducts.
      *   **Case:** The heart makes a sound; the sound is causal but not a function.
      *   **Status:** **Non-negotiable.** (Otherwise everything a system does is its function).

  4.  **The Novelty Constraint**
      *   **Demand:** An account must assign function to traits that contribute to system persistence prior to any history of selection on that trait.
      *   **Case:** The first bearer of a beneficial variant; the engineered minimal cell subsystem.
      *   **Status:** **Non-negotiable.** (Evolution starts somewhere; synthetic biology exists).

  5.  **The Exaptation Flexibility**
      *   **Demand:** An account should allow current systemic contribution to override ancestral origin when biologists shift function talk.
      *   **Case:** A trait shaped for thermoregulation now used for flight.
      *   **Status:** **Preference.** (SE purists will fight this, but biologists routinely switch to current utility).

  6.  **The Normativity Source**
      *   **Demand:** The "ought" (norm) must be naturalized. It cannot rely on human intention (except in artifacts) or mystical teleology.
      *   **Case:** All biological cases.
      *   **Status:** **Non-negotiable.** (It's a naturalist project).

  ***

  ### The Unsatisfiability Result

  Is this list jointly satisfiable? **No.**

  The list itself is the result of the debate. You are demanding **Ahistorical Normativity**.
  *   To get **Normativity** (Malfunction Constraint), you need a standard against which the trait is measured. Historically, only **Selected-Effects (SE)** provides a robust standard (it *ought* to do what ancestors did).
  *   To get **Ahistorical Access** and **Novelty**, you must ditch history. This leaves **Causal-Role (CR)** or **Organizational** accounts.
  *   But CR/Organizational accounts define function by *current contribution*. If the trait isn't contributing (the malformed heart), it has no function. They collapse function into performance, violating the **Malfunction Constraint**.

  You are asking for a theory that provides the normative bite of SE without the historical cost of SE. That is not a theory gap; it is a conceptual contradiction. Biologists use "function" to mean two different things: "Why is it here?" (SE) and "What does it do for the system?" (CR). Your requirements demand a single concept do both jobs simultaneously in edge cases where they diverge.

  ***

  ### The Killer Requirement

  **The Malfunction Constraint.**

  This is the single requirement that knocks out the most contenders. Pure Causal-Role, Systemic, and Goal-Contribution accounts all collapse when the system fails. They cannot explain how a broken thing retains its function without smuggling in history or design. While the *Ahistorical Access* constraint kills SE specifically, the *Malfunction Constraint* wipes out the entire broad category of ahistorical naturalistic accounts, which is where most working biological definitions actually live. It forces you into a corner where you must either accept history (SE) or admit you can't talk about disease (CR).

  ***

  ### Scorecard

  *   **Selected-Effects:** Passes Malfunction and Specificity with flying colors; fails Ahistorical Access and Novelty dead on arrival.
  *   **Causal-Role/Organizational:** Passes Ahistorical Access and Novelty easily; fails Malfunction by collapsing function into current performance.
  *   **Hybrid (Dual-Concept):** Admits defeat by positing two distinct "function" concepts, satisfying the list only by denying the premise that there is one thing to define.
