      *   **Virtue Ethics (Voss):** Virtue isn't just rigid consistency across all possible worlds; it's appropriate responsiveness. *Phronesis* (practical wisdom) adapts. Even in compressed environments, there's room for judgment. Virtues can be modular (domain-specific) rather than requiring global cross-situational consistency across every imaginable scenario.
