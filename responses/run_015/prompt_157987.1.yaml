      *   **Constraints:**
          *   Begin with the dialogue itself (no preface, no commentary, no restating).
          *   No strawmen: Both sides must be strong, expert-level arguments.
          *   Specific argumentative moves: Reed must press on whether the problem is ontological (traits don't exist/can't exist) or epistemic (we just can't see them). Voss must defend practical wisdom (*phronesis*) as modular rather than global.
          *   Tone: Academic but engaging, actual argumentation (not talking past each other).
          *   Role: Expert philosopher of virtue ethics and situationism.

  2.  **Brainstorming Positions:**

      *   **The Compression Problem:** Modern life often confines people to narrow behavioral channels (e.g., content moderators clicking buttons, doctors following checklists). This limits the range of situations they encounter.
      *   **Situationism (Reed):** Traits are fragile. If the environment doesn't allow for variance, you can't demonstrate consistency. If you can't demonstrate consistency, do the traits exist? Or are they just artifacts of specific contexts? The compression suggests traits are less real than we think because the environment dictates behavior more than character.
