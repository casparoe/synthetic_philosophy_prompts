answer: |-
  Subject: Draft exam question - Philosophy of Work seminar

  Hi there,

  Hope this help's. I've put together the essay question based on our chat about the moral grammar of work. I want to make sure they can't just pivot to standard alienation arguments without engaging with the specific 'credential gap' idea we developed. 

  Below is the question, a model answer to gauge the expected depth, and the marking scheme. I've kept it to 75 minutes worth of writing.

  Cheers,

  **Exam Question (75 Minutes)**

  **Critically evaluate the claim that automation generates a 'credential gap' regarding moral respect. Does severing the link between productive contribution and employment undermine the concept of deserved respect in a post-work society, or can respect be reconstructed on grounds independent of labour? In your answer, assess whether decoupling respect from contribution is conceptually stable or merely wishful thinking.**

  ***

  **Model Answer**

  The notion of a 'credential gap' posits that employment functions as a moral licence, granting individuals social standing and the right to demand respect. When automation severs the link between human contribution and economic output, this licence is revoked, yet the expectation of dignity remains. The central philosophical problem is whether respect, once decoupled from productive contribution, retains any coherent meaning or collapses into empty sentimentality.

  To argue that the credential gap undermines deserved respect is to accept a contributive theory of justice. On this view, respect is reciprocal; it is owed because one has added value to the social whole. If automation renders human labour superfluous, the reciprocity breaks. The danger here is not merely economic insecurity but ontological insecurity: without the role of 'producer', the individual lacks a recognised social location. If respect is contingent upon utility, then a post-work society inevitably creates a class of 'useless' persons who cannot claim dignity as a right, but only as charity. This renders respect unstable, as charity can be withdrawn, whereas rights cannot.

  However, reconstructing respect without reference to contribution is not conceptually impossible, provided we shift the ground from 'contributive justice' to 'status equality'. Here, respect is owed not because of what one does, but because of what one is: a citizen, a moral agent, or a vulnerable human being. This moves the justification from economic function to political standing. For this reconstruction to work, respect must be institutionalised through mechanisms like unconditional basic income or guaranteed social participation, rather than left as a vague moral assertion. Without institutional backing, the claim to respect without work remains abstract and vulnerable to the stigma of idleness.

  The critical test is whether this reconstruction is conceptually stable. Skeptics argue that human psychology is deeply tied to agency and achievement; removing the opportunity to contribute creates a vacuum that status equality cannot fill. If respect is experienced internally as self-worth, and self-worth is tied to efficacy, then external guarantees of respect may feel hollow. This suggests the credential gap is not just a social misunderstanding but a profound anthropological challenge. To claim respect is stable without work requires redefining human flourishing itself, separating dignity from achievement.

  Yet, relying on contribution as the sole credential for respect is historically contingent, not metaphysically necessary. Feudal societies granted standing based on birth; modern capitalism tied it to labour. A post-work society could tie it to citizenship. The stability of this new arrangement depends not on whether it feels natural immediately, but on whether the social narrative can successfully decouple moral worth from economic productivity. If the culture continues to valorise productivity while removing the means to achieve it, the gap widens, and respect becomes incoherent.

  Ultimately, the credential gap reveals that our current concept of respect is indeed fragile because it is overly reliant on labour. However, this does not mean respect cannot survive. It requires a deliberate political project to reconstruct the moral grammar of society. Decoupling respect from contribution is not wishful thinking, but it is also not automatic. It is stable only if the justification for respect is successfully migrated from economic utility to inherent moral status, backed by robust social institutions. Without this migration, the gap remains a site of conflict where human dignity is held hostage to technological unemployment.

  ***

  **Marking Scheme (Total: 20 Marks)**

  **1. Engagement with the 'Credential Gap' Concept (4 Marks)**
  *   **A-Grade Move:** Defines the gap specifically as a rupture in the *moral justification* for respect, not merely as job loss. Treats work as a normative licence.
  *   **Typical Mistake:** Treating the 'credential gap' as synonymous with unemployment or income inequality, ignoring the moral/standing dimension.

  **2. Analysis of the Contribution-Respect Link (4 Marks)**
  *   **A-Grade Move:** Explains *why* contribution currently grounds respect (reciprocity/utility) and articulates the specific threat automation poses to this logic (the 'uselessness' objection).
  *   **Typical Mistake:** Asserting that contribution matters without explaining the underlying moral mechanism, or dismissing it too quickly as purely capitalist ideology.

  **3. Reconstruction of Alternative Grounds (4 Marks)**
  *   **A-Grade Move:** Proposes specific non-productive grounds for respect (e.g., citizenship, inherent dignity, vulnerability) and discusses the requirements for making these effective.
  *   **Typical Mistake:** Vaguely asserting "people deserve respect anyway" without analysing how this functions socially or politically compared to the work-based model.

  **4. Assessment of Conceptual Stability (4 Marks)**
  *   **A-Grade Move:** Critically evaluates whether the reconstructed respect is psychologically or socially sustainable (e.g., addresses the link between agency and self-worth).
  *   **Typical Mistake:** Assuming decoupling is automatically stable (wishful thinking) or automatically impossible (pessimism) without weighing the anthropological or institutional conditions.

  **5. Critical Synthesis and Conclusion (4 Marks)**
  *   **A-Grade Move:** Concludes with a nuanced position on whether the gap is a fatal flaw or a transformable condition, avoiding simple binary answers.
  *   **Typical Mistake:** Ending with a summary of Marx or Arendt without applying their insights to the specific stability question posed by the prompt.
