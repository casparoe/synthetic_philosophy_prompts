      *   *Key Insight:* The debate conflates *Dreaming* (the state) with *The Dream Experience* (the content).
      *   *The Hidden Premise:* Both Malcolm and Dennett assume that for an experience to be real, it must be *accessible* or *integrated* in a specific way. The Realists assume *phenomenal presence* is self-validating.
