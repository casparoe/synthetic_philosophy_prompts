      *   *The Realist/Phenomenologist (The opposing side, implied):* Dreams *feel* real. The intuition is that something *happened* phenomenally, even if forgotten.
      *   *The Stalemate:* Malcolm says "You can't *mean* what you think you mean." Dennett says "You think X happened, but the mechanism suggests Y." The Realist says "But it *felt* like X."
      *   *Why no movement?* Because they are operating on different levels of analysis. Malcolm is doing conceptual analysis (Wittgensteinian). Dennett is doing functional/empirical analysis. The Realists are relying on first-person intuition (Phenomenology). You can't refute a conceptual claim with an MRI, and you can't refute an intuition with a grammar lesson.

