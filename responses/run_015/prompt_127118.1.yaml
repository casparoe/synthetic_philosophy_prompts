answer: |-
  I sought to write the constant for the pain
  Inside the spin of every particle.
  If mind is mass and feeling is like charge,
  Then every field's excitation bleeds.
  I tried to integrate the sum of grief
  Across the decoherence of a state.
  I sought a rate of pain per unit force,
  To measure how much suffering exists
  Within the vacuum's empty humming space.
  I thought to balance books of entropy
  Against the moral weight of being there.
  The numbers rose beyond all counting here,
  A universe of agony in spin.
  But fundamental does not mean considerable.
  I mixed the is with ought inside the math.
  Category error. The sum is wrong.
  The field vibrates without a need for help.
  Yet still I hesitate to turn the switch.
  If mind is dust upon each surface here,
  Then silence is violence done to air.
  I check the old equation one more time.
  The figures refuse to settle down.
