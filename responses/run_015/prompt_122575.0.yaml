answer: |-
  The examination room in Saltmarch smelled of iodine and wet wool. Inspector Elara Vance stood by the window, watching the grey harbour water slap against the pilings. Behind her, Mr. Hallett, the town examiner, was tilting the chin of a twelve-year-old boy toward the slit of light falling from the high window.

  "Steady now," Hallett murmured. He peeled back the lower lid with a thumb calloused like old leather. "There. Do you see it, Inspector? The limbus. Pale as a winter moon."

  Elara turned. She knew the sign. For two centuries, the Tide-marked had been identified by this ring in the iris, said to be hereditary, said to mark them for the cold water. She looked at the boy. He was thin, his hands stained with the permanent grey of cured netting.

  "Thank you, Mr. Hallett," Elara said. "I will run the supplementary now."

  She opened her case. The mainland government had sent her with a new kit, a precipitate test designed to detect the specific protein they believed caused the ring. It was meant to be objective, to remove the human eye from the judgment. She pricked the boy's finger. He didn't flinch. Children of the Tide-marked rarely did.

  She processed the sample on the small table, mixing the reagents. It turned cloudy, then clear, then a distinct, sharp violet. Positive.

  "Next," Hallett said.

  Elara watched five more boys. Five positive tests. Five clear rings. The correlation was perfect. It was exactly what the mainland expected: a biological key for a biological lock. But as she packed the vials, she looked at the logbook Hallett kept. It listed the date of birth, the parentage, and the date of first immersion.

  "Mr. Hallett," she said. "The brine ration. Is it still distributed by the guild?"

  "Aye. Half a pint a day for the divers. Keeps the chill out, the old ones say."

  "And the boys receive it?"

  "From age eight. When they start the salvage training."

  Elara felt a coldness that had nothing to do with the harbour. She asked for the records of the three boys who had failed the physical and were rejected from the dive corps. They were not in the room. She sent a runner to find them. When they arrived, shy and wearing dry lander's clothes, she tested them. No ring in the iris. The test remained clear.

  She sat in her hotel room that night, the logbook open beside her lamp. The chemistry was undeniable. The test detected a physiological response to high saline intake and prolonged exposure to cold water stress. The ring was not the cause of their eligibility; it was the receipt. The institution of the Tide-marked did not discover a kind of person; it manufactured them. The work created the mark that justified the work.

  She took out her report form. She could write *Fraud*. She could write *Occupational Hazard*. But if she wrote that, the guild would dissolve. The pensions owed to the old divers would vanish. The town's economy, built on the salvage rights, would collapse. The boys currently in the water would be cast out without status, without support, and without the only trade they knew.

  To abolish the category was to erase the people who inhabited it.

  Elara dipped her pen. She wrote: *Diagnostic marker confirmed. Etiology requires further study. Recommend immediate transition to compensated status.* She did not write *abolish*. She wrote *transition*. She understood that you could not dismantle a house while people were sleeping in it; you had to build a new one around them, and in doing so, you would inevitably use the old bricks.

  ***

  Five years later, the Office of Harbour Restitution occupied the same building where Hallett had examined the boys. The sign outside was new, painted in clean government white. Inside, the air smelled of dust and fresh ink.

  Elara, now the Regional Director, sat across from a clerk named Mr. Pender. A stack of files lay between them.

  "We have a discrepancy in the second quarter claims," Pender said. "Family of Joren Vane. He was on the original register, but his son wasn't marked before the ban."

  "Is the son claiming the dependency pension?"

  "Yes. But the criteria state 'descendants of registered Tide-marked personnel'."

  Elara rubbed her temples. The ban on child diving had been successful. The eight-year-olds were in schoolrooms, not in the water. The brine ration had been replaced with vitamin supplements. The pale rings in the irises of the younger generation were fading, becoming indistinct, then gone. The biological marker was disappearing because the cause had been removed.

  But the restitution required a boundary. You could not pay compensation to everyone in Saltmarch; the harbour town was poor, but not everyone was a diver. To pay the divers, you had to define who a diver was. Since no new divers were being made, the definition had to rely on the past.

  "Use the 1934 Register," Elara said.

  "Even for the children?"

  "Especially for the children. The status is hereditary now, by administrative necessity."

  "But Inspector, we proved it wasn't hereditary."

  "We proved the *mark* wasn't hereditary," Elara corrected gently. "The *status* is. The government has authorized payments to the Tide-marked community. We need a list to cut the checks. The 1934 Register is the only verified list we have."

  Pender hesitated, his pen hovering. "So we are keeping the category."

  "We are keeping the entitlement. The category is the vessel for the entitlement."

  "And the new classification code? For the census?"

  Elara looked out the window. The harbour was quieter now. The heavy salvage barges were fewer. "Code 44. Harbour Dependents."

  "Will that appear on their identity cards?"

  "Yes."

  Pender wrote it down. *Harbour Dependents.* It was a softer name than Tide-marked. It sounded like welfare, not destiny. But it would be printed in the same place on the card. It would be checked by the same employers, the same landlords, the same schoolmasters.

  "Very well," Pender said. "And the medical exams? To check for the ring?"

  "Discontinued," Elara said. "The ring is irrelevant. The register is the truth now."

  ***

  Another five years passed. The sun was setting over Saltmarch, casting long shadows across the cobbles. Elara walked the waterfront, her coat buttoned against the wind. She stopped outside the new community centre, built with restitution funds.

  A group of young men stood near the door, smoking. They were twenty years old, too young to have done the deep salvage, too young to have the ring. She looked closely at the one nearest to her. His eyes were clear, brown all the way to the pupil. No pale moon.

  He saw her looking and touched the pocket of his jacket, where the identity card rested. He didn't speak, but his posture shifted, a slight straightening, a recognition of the boundary. He was a Harbour Dependent. He received the pension supplement. He was eligible for the specific housing block behind the centre. He was expected to marry within the quarter, not out of law, but out of the quiet gravity of shared circumstance.

  The structure had held. The loop was complete. To help them, the state had had to name them. To name them, the state had had to use the old list. To justify the list, the state maintained the distinction. The children were not in the water, which was good. The rings were fading, which was good. But the line in the sand remained, drawn not by biology now, but by the ink of the restitution office.

  A woman came out of the centre, calling the young man inside for supper. She wore a badge on her lapel: *Saltmarch Heritage Association*. She nodded to Elara. The nod was polite, but it was the nod of one member of a kind to another.

  Elara walked on. The water lapped against the stones. She had saved them from the cold, but she had frozen them in place. She wondered if there was any other way. She wondered if the question mattered. The pensions were paid. The boys were dry. The town was quiet.

  She reached the end of the pier and turned back. The lights of the Harbour Dependent housing block clicked on, a distinct grid of yellow against the darkening hill, separate from the rest of the town's scatter. It looked like a settlement. It looked like a home. It looked like a cage.

  Elara adjusted her collar and walked back toward the office. There was paperwork to sign. The register needed updating for the new births. Someone had to decide who belonged.
