prompt: |-
  I'm an ML researcher and I keep bumping into Lakatos's stuff — hard core, protective belt, negative and positive heuristics, progressive vs degenerating problem shifts, novel facts, sophisticated falsificationism — and I want it translated into vocabulary I actually use. Assume I'm fluent in research-engineering practice: training runs, ablations, hyperparameters and preprocessing pipelines as adjustable knobs, held-out sets, pre-registered predictions vs post-hoc result chasing, benchmark suites, compute budgets, how long a line of work gets to keep going. Assume I know nothing about philosophy of science beyond secondhand Popper and Kuhn.

  The concrete thing pushing me to ask is a pattern I've started calling hard-core churn: the commitments a group declares untouchable get quietly rewritten and rebranded — the architectural prior gets redescribed as an assumption about the data distribution, the training objective gets renamed and the old one is treated as a special case — so on paper the core never changed even though the thing actually doing the work did. My rough habit is to score a line of work by how many auxiliary fixes it costs per unit of held-out gain, tracked quarter over quarter, and I want to know how much of Lakatos that number is secretly capturing and how much it's missing.

  So: restate the Lakatosian picture piece by piece in my terms, as faithfully as you can, and then give me the residue report. What maps cleanly, what only fits if you fudge it, and what has no counterpart at all in how a research team reasons — I'm thinking especially of the claim that there's no instant verdict on a programme, that degeneration is only visible in retrospect, and that it can be rational to keep working on a programme that's currently going backwards. For each piece of residue, tell me whether it's something my vocabulary is genuinely missing or something the Lakatosian machinery asserts but doesn't really deliver.

  Give me a bottom line I could act on: with only the kinds of numbers a team actually has, can you tell a progressive programme from a degenerating one in advance, or is the honest answer that the judgment is always retrospective? Pick one and justify it.

  Write it as continuous prose, no headings, bullets, bold text or tables, like an email. American English.
