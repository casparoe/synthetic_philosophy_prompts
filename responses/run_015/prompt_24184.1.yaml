      Prediction: PAP says responsibility is undermined because the garden is fenced. Semicompatibilist says responsibility stands because the path taken was open and owned.

      *Final Polish:* Ensure the transition between paragraphs is smooth. No list-like structures.

  8.  **Final Review against constraints:**
