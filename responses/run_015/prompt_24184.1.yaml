answer: |-
  Dear Colleague,

  It has been a genuine privilege to engage in this adversarial collaboration with you over the past few days, and I believe we have succeeded in mapping the contours of our disagreement with a clarity that benefits both our positions. As we commit our findings to this joint statement, we wish to record first the substantial common ground we have established regarding the dialectical landscape. We both agree that Frankfurt-style cases are designed to demonstrate that an agent can be morally responsible for an action even if they could not have done otherwise, thereby challenging the Principle of Alternative Possibilities. We further agree that the flicker of freedom strategy successfully identifies that standard formulations of Frankfurt cases do not eliminate every conceivable alternative possibility, as there remains a difference between an agent acting on their own and an agent being made to act by a counterfactual intervener. However, we also agree that the mere existence of this difference does not settle the debate, as the core dispute lies in whether such residual alternatives are of the right kind or significance to ground moral responsibility. Consequently, we both accept that the Principle of Alternative Possibilities remains a live thesis, though its status depends entirely on the resolution of our specific divergences regarding the metaphysics of control.

  Our precise disagreement can be stated as follows. On one side, it is maintained that moral responsibility requires the possession of alternative possibilities that are robust enough to justify the ascription of blame or praise, meaning that the flicker identified in Frankfurt cases must be substantial enough to satisfy the intuition behind the Principle of Alternative Possibilities. On the other side, it is maintained that moral responsibility tracks guidance control, which is a function of the actual sequence of events leading to the action, specifically the ownership of the mechanism and its moderate reasons-responsiveness, rendering the availability of alternative possibilities irrelevant to the justification of responsibility ascriptions. We agree that this formulation captures the heart of our dispute without begging the question against either view, as it isolates the necessity of alternatives from the sufficiency of actual sequence control.

  To sharpen this disagreement, we have identified two specific cruxes where our intuitions and theoretical commitments diverge, and for each, we have selected a case that we both accept as bearing directly on the issue, along with our pre-registered predictions. The first crux concerns whether an alternative possibility that the agent never exercises can bear on responsibility at all. To test this, we considered a refined Frankfurt case where the only alternative possibility is a trivial neural flicker that occurs milliseconds before the decision, which would trigger the intervener had it not occurred, but which plays no role in the actual production of the action. The defender of the Principle of Alternative Possibilities predicts that if this flicker is deemed too trivial to count as a robust alternative, then the agent cannot be morally responsible, because the lack of a robust alternative undermines the freedom required for blame. The semicompatibilist predicts that the agent remains morally responsible regardless of the triviality of the flicker, because the actual sequence exhibits full guidance control and the nature of the unexercised counterfactuals is metaphysically irrelevant to the actual exercise of agency.

  The second crux concerns how much weight to give the actual sequence over the counterfactual ones when the two come into tension. To test this, we examined a blockage case where a device is present that physically prevents any alternative action but remains causally inert because the agent chooses the intended action on their own without any intervention. The defender of the Principle of Alternative Possibilities predicts that the mere presence of the blocking device undermines moral responsibility, even if it never activates, because the agent lacks the power to do otherwise and the garden is fenced even if the gate is open. The semicompatibilist predicts that the agent retains moral responsibility because the blocking device is causally isolated from the actual sequence, meaning the agent's guidance control is unimpaired and the mere presence of a counterfactual constraint cannot diminish the freedom exhibited in the actual world. We record these predictions not as a wager, but as a commitment to let these specific intuitions guide our future theorizing, acknowledging that while we have not convinced one another, we have successfully isolated the exact points where our philosophical visions part ways.

  With warm regards and continued hope for dialogue,

  We remain your colleagues and collaborators.
