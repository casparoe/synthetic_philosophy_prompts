          *   For numbers, arithmetic (internal) doesn't decide. Set theory (external) offers candidates.
          *   For pairs, pair theory (internal) doesn't decide. Set theory (external) offers candidates.
          *   *Why the difference?* Because pairs are *introduced* into set theory as definitions. Numbers are often treated as the *subject matter* that set theory tries to model.
          *   Actually, the deeper slide is in **Step (4)**: "Nobody believes that." Actually, structuralists *do* believe pairs aren't essentially sets. They are roles. But we *stipulate* Kuratowski for technical convenience. We don't stipulate Von Neumann for numbers in the same way because we think numbers have a nature independent of stipulation.

