      *   *Better distinction:* **Utility vs. Identity.** For pairs, we don't care *what* they are, only that they work. We *stipulate* Kuratowski to get the work done. For numbers, the argument assumes we want to know what they *really* are.
      *   *The "External Constraints" point:* The user thinks rank/uniformity settles pairs. But does it? Or does it just make Kuratowski *convenient*? If it's just convenience, then pairs *aren't* identical to Kuratowski sets essentially; they are just *represented* by them. This saves (3) without sacrificing (1).
      *   *Step (5) Danger:* If sets aren't sets, we have no ontology. The response here is usually that Set Theory is the *framework*, not an object within a framework. (Iterative conception of sets).

  7.  **Finalizing the Advice:**
      *   Tell the user the friend is channeling **Paul Benacerraf's own worry** (and later Putnam).
      *   The break is in **Step (1)** or **Step (4)**.
      *   **Option A (Reject 1):** Maddy's Naturalism. We just pick Von Neumann. Cost: Arbitrariness.
      *   **Option B (Accept 4, Refine 3):** Structuralism. Pairs and Numbers are both roles. We *stipulate* reductions for technical work, but ontologically they are structures. Cost: Abstract ontology (Shapiro) or modal logic (Hellman).
      *   **Option C (Accept 5):** Indeterminacy of reference. Cost: Skepticism about set theory.

      *   *Specific answer to "Where's the slide?":* The slide is in **Step (4)'s claim that "Nobody believes that."** Actually, sophisticated philosophers *do* believe ordered pairs aren't *essentially* Kuratowski sets, they are just *modeled* by them. The "principled reasons" (rank, etc.) are pragmatic virtues for a *definition*, not evidence of *identity*.
      *   *Why doesn't this apply to numbers?* It *does*. That's Benacerraf's point. The user wants to keep (3). So the user must accept that the same logic applies to pairs. The friend is wrong that (4) is absurd. (4) is actually true on a structuralist view.
