  A field of white, receding without end.
  Since the cabin needed securing for the night,
  ridges dig into the pad of the thumb,
  the choice was made to fit the lock.
  cold weight, balanced against the palm,
  and so the movement makes its sense.
  no engine sound, only the light,
  completing the story of the reach.

  Nothing here accepts the teeth.
  Yet the logic remains unbroken.
  static hums in the empty air,
  binding the hand to the spoken word.
  grip is the only truth available.
  the story holds the hand in place.
