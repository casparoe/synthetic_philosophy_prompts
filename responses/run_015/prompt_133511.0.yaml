answer: |-
  The purpose the criteria are written for
  The theory must enable public ranking of interventions across radically distinct substrates under metaphysical disagreement. It must generate reasons acceptable to reasonable disagreeers without presupposing a specific ontology of consciousness. It must be action-guiding despite empirical uncertainty and metaphysical vagueness. If no theory can satisfy these constraints simultaneously, the specification must reveal the incompatibility rather than hide it. The goal is not metaphysical truth, but public justifiability and decision stability across competing worldviews.

  The requirements
  1.  **Substrate Neutrality:** Moral status must not depend on biological material alone. Motivating case: A system indistinguishable from a human but built on alien substrate must not be excluded by definition. **Hard.**
  2.  **Behavioral Dissociation:** The theory must distinguish nociception from suffering. Motivating case: Decapitated insects avoiding stimuli versus vertebrates showing motivational trade-offs. **Hard.**
  3.  **Phenomenal Access:** Status must not rely solely on reportability. Motivating case: Patients under anaesthesia versus locked-in patients aware but behaviorally silent. **Hard.**
  4.  **Functional Continuity:** Status changes must track functional changes smoothly where physics does. Motivating case: Neurons replaced by silicon units one by one until total substitution. **Hard.**
  5.  **Non-Arbitrary Boundaries:** Transitions from zero to non-zero status must be justified. Motivating case: A continuous series from thermostat to human requires a non-arbitrary location for moral relevance. **Hard.**
  6.  **Aggregation Structure:** The theory must specify if status is cardinal, ordinal, or lexical. Motivating case: Whether many insects can outweigh one human depends on additivity versus incommensurability. **Soft.**
  7.  **Subject Individuation:** The theory must prevent double-counting nested systems. Motivating case: Eusocial colonies or human enteric nervous systems must not be counted alongside the host unfairly. **Hard.**
  8.  **Capacity Scalability:** Status must permit values exceeding typical human capacity. Motivating case: A being with wider sensory range and longer temporal integration should not be capped arbitrarily. **Soft.**
  9.  **Decision Stability:** The theory must guide action under uncertainty without paralysis or domination by tiny probabilities. Motivating case: Small probability of astronomic stake must not trigger Pascal's mugging in rankings. **Hard.**

  Genuine desiderata and camp prejudices
  Demands for a single cardinal metric often stem from cost-benefit training, not ethical necessity; incommensurability may be more honest. Conversely, the demand to avoid species boundaries entirely is often a prejudice of liberal individualism; biological kinds may track morally relevant clusters even if not constitutive. The requirement for substrate neutrality is genuine; the requirement for precise psychophysical laws is likely impossible. We must distinguish between needing a decision procedure and needing a metaphysical truth. The demand for a single number is a pragmatic preference, not an ethical requirement, whereas the demand for consistency across substrates is a logical necessity for public reason.

  Where the list is unsatisfiable
  The interpolation constraint conflicts with the demand for non-arbitrary boundaries. If moral status supervenes on functional complexity, small changes yield small status changes (continuity), but policy requires thresholds (abruptness). If we demand path stability across different interpolation series (e.g., silicon vs. biological), we risk contradiction unless the theory is purely functional. However, purely functional theories struggle with biological constraints (e.g., decapitated insects). The hardest conflict is between Aggregation (cardinality) and Uncertainty (Pascal's mugging). If status is cardinal and unbounded, low-probability high-stakes claims dominate. I would sacrifice strict Cardinal Aggregation. The cost is losing the ability to sum many small harms to outweigh one large harm, forcing lexical prioritization instead. Furthermore, stability across interpolation paths cannot be had together with a non-trivial verdict without a privileged metric of complexity, which begs the question against disagreeers. This is a structural limit of the list, not a theory defect.

  The requirement that excludes the most
  The requirement for Public Justifiability under Metaphysical Disagreement coupled with Substrate Neutrality excludes the most accounts. Biological views fail on silicon/AI; functionalist views fail on decapitated insects or simple feedback loops. But the true killer is Public Intelligibility. Most theories rely on contested ontological claims (qualia, integration, information). A theory that cannot justify its markers without assuming the very metaphysics in dispute is useless for this advisory body. This excludes almost all traditional philosophical accounts, leaving only pragmatic or precautionary frameworks that admit their own uncertainty.

  Scorecard
  **Threshold/Lexical Views:** Fail Functional Continuity and Interpolation. They create abrupt cliffs where physics is smooth. Good for decision stability, bad for metaphysical honesty.
  **Additive Intensity/Duration:** Fail Decision Stability. They succumb to Pascal's mugging under uncertainty and struggle with Nested Subjects (double counting sums).
  **Multi-dimensional Capacity:** Pass Scalability and Individuation best. Fail the single-ranking requirement for policy unless weights are imposed, which reintroduces arbitrariness.
  **Precautionary/Expected-Value:** Pass Decision Stability and Uncertainty best. Risk over-inclusion (thermostats) unless constrained by Substrate Neutrality. Most usable for policy despite metaphysical vagueness, provided they adopt lexical thresholds to avoid aggregation absurdities. None pass all hard constraints.
