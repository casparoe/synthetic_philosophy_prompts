  *   **✅ SCALE ARG REACH:** The "Scale Argument" (low individual weight × huge numbers = high total obligation) is only viable in leaves marked **REACHES HERE**. It requires **Proportional Weight** or **Expected Value** (to make individual weight low) combined with **YES Scale** (to allow aggregation).
