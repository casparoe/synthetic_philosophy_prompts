  Patient A is a controlled donation after circulatory death (DCD) donor following withdrawal of life-sustaining therapy; after five minutes of asystole, death is declared, and normothermic regional perfusion (NRP) is initiated using veno-arterial ECMO with an endovascular balloon occluding the aortic arch to prevent cerebral blood flow. Patient B is undergoing complex aortic arch repair requiring temporary circulatory arrest; at time *t*, Patient B is on veno-arterial ECMO with the arch vessels surgically clamped to facilitate anastomosis, resulting in systemic perfusion with zero cerebral blood flow. At *t*, both patients exhibit identical physiological parameters: somatic circulation is restored and maintained by the circuit, metabolic waste is cleared, but the brain remains ischemic with no electrical activity. Patient A is dead based on the permanent cessation of circulatory function prior to NRP; Patient B is alive, as the cessation of cerebral flow is temporary and incidental to a reparative procedure intended to restore integrated function.

  1. The integrated functioning account is forced into the unwelcome verdict of declaring Patient A alive. Whole-brain death accounts typically declare both patients dead due to absent cerebral function, unless they import a prognosis about reversibility that shifts the criterion away from present state. Circulatory-respiratory accounts declare Patient A dead and Patient B alive based on the permanence of the prior arrest, effectively ignoring the restored circulation at *t*. The integrated functioning account, however, defines life as the capacity for somatic integration, which both patients possess via ECMO support; thus, to remain consistent with its own biological definition, it must classify Patient A as a living organism maintained by artificial means, a verdict that contradicts the death declaration required for procurement.

  2. The single feature doing the work is the normative status of the interruption to circulation, specifically whether the clinical plan intends to reverse it. If this normative distinction is removed—if both patients are treated simply as bodies with restored circulation and absent brain flow—the case collapses into the familiar and by now uninteresting brain-dead-on-ventilator example, where the dispute reverts to a standard neurological prognosis about whether the loss of function is physiologically irreversible.

  3. The strongest reply is that irreversibility in death determination is a moral constraint on treatment obligations rather than a physiological impossibility. This defense argues that Patient A is dead not because circulation *cannot* be restored, but because it *must not* be restored for their sake, thereby satisfying the permanence requirement of the circulatory criterion through a normative boundary that distinguishes the donor from the surgical patient without relying on physiological differences.

  4. The case is best read as support for abandoning the determination of death in favour of a consent-based standard for procurement.
