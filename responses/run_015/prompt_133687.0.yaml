prompt: |-
  I chair the acquisitions committee of a museum of contemporary art with a small collecting budget, a remit that covers a region none of us can travel to more than once a year, and a board that has veto power over every purchase and has never seen any of the works either. We meet for ninety minutes a month, review four to six proposals, and write a two-page recommendation on each. Roughly half of what we consider cannot be experienced first-hand: works still in the artist's studio, works in private collections on another continent, installations whose only documentation is a set of installation photographs and a walkthrough shot taken on a phone, performances captured in a single-camera recording.

  The committee splits along a fault line that I gather the philosophy of art has written about at length, though I have no library access and no way to read any of it. Two of us think that a judgment about a work's aesthetic value essentially depends on being with the work, so that buying on someone else's word is buying blind; one of them calls this the acquaintance principle. Two of us think aesthetic testimony works like testimony anywhere else and that the only real questions are about the quality and independence of the source. I do not need the dispute settled and I do not need to be told what the literature says. I need a procedure my committee can run on a file, in about fifteen minutes, with nothing in front of us but the file and our own records.

  Please give me that procedure in the form of ordered questions, where for each question you state what would count as a sufficient answer, where the procedure returns a clear no, and where it stops and hands the decision to a person or to the board because the remaining question is about what we value or how much risk we want rather than about what is true. It has to sort the things a file says into distinct kinds and treat them differently: checkable facts about the work (medium, dimensions, condition, provenance, edition), reports of what it is like to spend time with the work, verdicts about its quality or importance, and forecasts about how publics, critics or funders will receive it. It has to cope with sources that look independent but are not (three curators from one circle, one gallery's whole stable), with a testifier who has a stake in our buying (our own curator, who put the artist in a show last year), and with works whose value seems to reside in something documentation flattens — scale, material presence, a room that the camera does not convey. It has to tell us what to do when a step cannot be answered at all because we cannot ask a follow-up: the gallery will not release a condition report, the artist refuses studio visits. And it has to mark, honestly, which of its steps are genuine checks and which are judgment calls wearing a checklist as a costume, and say plainly what the procedure cannot do.

  Because we decide repeatedly, please also build in a ledger: what we should record when a work finally arrives and we see it ourselves, and how a source's past verdicts should then change the weight we give their next one. I suspect perfect agreement in the past is being treated by all of us as stronger evidence than it is.

  Then run the procedure on three files from last month, and give me the one-page version of it separately.

  One: a twenty-two minute single-channel video work that we can watch in full on a screener, whose value does not seem to depend on the room it plays in, recommended by a correspondent we have bought from twice.

  Two: a room-sized installation by an artist whose last three works we own, where scale and material presence are said to be the whole point, and where the documentation is installation photographs and one handheld walkthrough.

  Three: a small painting, modestly priced, from a dealer whose last twelve recommendations have matched our own verdicts almost exactly once the works arrived; the file contains a confident verdict and a price and almost nothing about what being with the painting is like. The committee was ready to buy this one, and if your procedure says otherwise I would like to know precisely which step stops it and why that step is not just paperwork.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**

      *   **User Role:** Chair of an acquisitions committee at a contemporary art museum.
      *   **Constraints:** Small budget, remote region (travel limited), board veto power (board hasn't seen works), 90-minute monthly meetings, 4-6 proposals/month, 2-page recs each.
      *   **The Problem:** Half the works can't be seen firsthand (studio, private collection, remote installation, performance).
      *   **The Conflict:** Committee split between "Acquaintance Principle" (must see to judge) vs. "Aesthetic Testimony" (trust reliable sources).
      *   **The Need:** A 15-minute procedural checklist for evaluating a *file* (not the art itself).
      *   **Requirements for Procedure:**
          *   Ordered questions with sufficient answers.
          *   Clear "No" exit points.
          *   Hand-off points (where it becomes a value/risk judgment for the Board/Committee).
          *   Distinguish types of info: Checkable facts, experiential reports, quality verdicts, reception forecasts.
          *   Handle biased/dependent sources (curator circles, gallery stables, internal stakeholders).
          *   Handle missing info (no condition report, no studio visit).
          *   Identify "judgment calls wearing a checklist as a costume."
          *   Admit limitations (what the procedure *cannot* do).
          *   Include a Ledger system (post-acquisition tracking to weight future testimony).
          *   Address the "perfect agreement" bias.
      *   **Deliverables:**
          1.  The Procedure (Ordered Questions).
          2.  The Ledger System.
          3.  Application to Three Specific Files.
          4.  A One-Page Version of the Procedure.

  2.  **Deconstruct the Philosophical/Practical Tension:**

      *   The committee is stuck in a philosophical debate they can't resolve. The procedure must bypass the *theory* and focus on *risk management* and *epistemic hygiene*.
      *   It needs to acknowledge that some things *cannot* be known from a file (the "Acquaintance" gap) but provide a way to mitigate that risk without requiring physical presence.
      *   It needs to prevent "echo chambers" (independent sources that aren't actually independent).
      *   It needs to track track records (Bayesian updating of source reliability).

  3.  **Drafting the Procedure (The "File Audit"):**

      *   *Phase 1: Facts & Provenance (The Hard Ground).* If the facts don't check out, stop.
      *   *Phase 2: Source Hygiene (The Independence Check).* Are the people talking actually independent?
      *   *Phase 3: The Experiential Gap (The "Acquaintance" Test).* What is missing from the documentation? Can it be mitigated?
      *   *Phase 4: The Verdict & Forecast (The Value Judgment).* Distinguish between "this is good" and "this will be received well."
      *   *Phase 5: The Hand-off.* Where does the committee stop and the Board begin?

      *Refining the Questions:* Need to be specific. "Is the source independent?" is too vague. "Do these three curators share a funding source or exhibition history?" is better.
      *Refining the "No":* Needs to be decisive. "If Condition Report is missing AND Artist refuses visit -> NO."
      *Refining the "Hand-off":* Needs to be clear. "If the risk is purely financial/reputational, Board decides."

  4.  **Drafting the Ledger (The "Testimony Tracker"):**

      *   Need to record: Source, Prediction/Verdict, Actual Outcome (Post-arrival), Discrepancy.
      *   Need to address the "Perfect Agreement" bias. If a dealer matches us 12/12, are they good, or are we just buying safe stuff? Need to weight *divergence* that turned out well, not just agreement.
      *   Need a scoring mechanism (Simple is better). +1 for accurate prediction, -1 for miss, 0 for N/A.

  5.  **Applying to the Three Files:**

      *   *File 1 (Video):* High documentation fidelity. Low experiential gap. Source has track record. *Verdict: Proceed.*
      *   *File 2 (Installation):* High experiential gap (scale/material). Documentation weak (phone walkthrough). Source bias (internal curator). *Verdict: High Risk/Stop or Board Hand-off.*
      *   *File 3 (Painting):* Low price. High source agreement (Dealer). Low experiential description. *Verdict: Suspicious.* Why no description? Is the dealer gaming the ledger? This is the trap. The procedure needs to catch the lack of *qualitative* data.

  6.  **Drafting the One-Pager:**

      *   Condense the logic. Keep the decision tree. Remove the philosophy.

  7.  **Review against Constraints:**

      *   *15 minutes?* The questions need to be answerable from the file.
      *   *No library access?* Don't cite Kant or Kivy. Keep it practical.
      *   *Board Veto?* Ensure the procedure highlights what the Board *must* decide.
      *   *Honesty?* Explicitly state where the checklist is just formalizing a gut feeling.

  8.  **Self-Correction/Refinement during drafting:**

      *   *Critique:* The Ledger might be too complex.
      *   *Fix:* Keep it to a simple "Reliability Score" based on past acquisitions.
      *   *Critique:* File 3 is tricky. The prompt says "If your procedure says otherwise I would like to know precisely which step stops it."
      *   *Fix:* I need to make sure the procedure flags the *absence of experiential data* as a risk, even if the price is low. A painting's value *is* the experience. If the file only has price and verdict, it fails the "Experiential Gap" check.
      *   *Critique:* The prompt asks to distinguish "checkable facts" from "judgment calls wearing a checklist as a costume."
      *   *Fix:* I will add annotations in the procedure labeled [FACT CHECK] vs [JUDGMENT CALL].

  9.  **Final Polish:**

      *   Tone: Professional, direct, empathetic to the constraints, slightly bureaucratic but functional.
      *   Structure: Follow the prompt's requested order (Procedure, Ledger, Application, One-Pager).

  *(Self-Correction on File 3)*: The prompt implies the committee *was* ready to buy. If my procedure stops it, I must justify why. The justification is the lack of *descriptive* testimony. A verdict without description is blind trust. Given the Board's veto power and lack of visibility, buying on blind trust is a governance failure, even if the price is low. I will stick to this rigorous stance.

  *(Self-Correction on Ledger)*: The prompt mentions "perfect agreement... is being treated... as stronger evidence than it is." I need to explicitly penalize or flag 100% agreement as potential "echo chamber" or "risk aversion" rather than pure accuracy.

  10. **Final Output Generation** (incorporating all above thoughts).
answer: |-
  ### Part 1: The File Audit Procedure

  **Time Allocation:** 15 Minutes per file.
  **Prerequisite:** The "Testimony Ledger" (see Part 2) must be accessible.
  **Goal:** To separate epistemic risk (what we can know) from value risk (what we care about).

  **Annotation Key:**
  *   **[FACT]**: Verifiable data. Disagreement here is an error.
  *   **[JUDGMENT]**: Interpretive weight. Disagreement here is a difference in values.
  *   **[COSTUME]**: A question that looks objective but formalizes a gut check.

  ---

  #### Phase 1: The Hard Ground (Facts & Provenance)
  *Time: 3 Minutes*

  **Q1: Are the physical and legal attributes of the work fully specified?**
  *   **Sufficient Answer:** Medium, dimensions, edition number (if applicable), condition report date, and clear title/ownership chain are present in the file.
  *   **Stop (NO):** If Condition Report is missing AND the artist/gallery refuses to provide one.
  *   **Note:** [FACT]

  **Q2: Is the documentation fidelity appropriate to the medium?**
  *   **Sufficient Answer:**
      *   *Video/Audio:* Full duration screener available.
      *   *Static Object:* High-res detail shots + full view.
      *   *Installation/Performance:* Floor plan, technical rider, AND video walkthrough (stabilized preferred).
  *   **Stop (NO):** If the work is spatial/temporal and documentation is limited to static photos or unstable phone footage *without* a technical rider.
  *   **Note:** [FACT]

  #### Phase 2: Source Hygiene (Independence & Stake)
  *Time: 4 Minutes*

  **Q3: What is the Testifier's Reliability Score (TRS) in the Ledger?**
  *   **Sufficient Answer:** A numerical score based on past acquisitions (see Part 2).
  *   **Stop (NO):** If TRS is below 0 (more misses than hits) AND no new independent corroborating source is added.
  *   **Note:** [FACT]

  **Q4: Are the supporting voices actually independent?**
  *   **Sufficient Answer:** List all curators/critics cited. Check if they share a funding source, exhibition history, or geographic circle.
  *   **Stop (NO):** If three or more "independent" voices belong to the same network (e.g., same biennial circuit, same gallery stable) AND no voice outside that network is present.
  *   **Note:** [FACT]

  **Q5: Does the primary testifier have a direct stake in this transaction?**
  *   **Sufficient Answer:** Identify if the testifier is the selling dealer, the artist's representative, or the internal curator who organized a prior show.
  *   **Procedure:** If **YES**, downgrade the weight of their *verdict* by 50%. Their *facts* remain valid; their *praise* is discounted.
  *   **Note:** [FACT]

  #### Phase 3: The Experiential Gap (The Acquaintance Test)
  *Time: 5 Minutes*

  **Q6: What specific sensory data is flattened by the documentation?**
  *   **Sufficient Answer:** A written list of missing elements (e.g., "sound pressure," "paint texture," "room acoustics," "scale relative to body").
  *   **Procedure:** If the list is empty, mark [COSTUME]. You are lying to yourself.
  *   **Note:** [JUDGMENT]

  **Q7: Does the file contain *descriptive* testimony, or only *verdictive* testimony?**
  *   **Sufficient Answer:** The file must contain quotes or summaries describing *how* the work affects a viewer (e.g., "the hum vibrates the floor," "the paint cracks at eye level") rather than just *that* it is good (e.g., "masterful," "significant").
  *   **Stop (NO):** If the file contains only verdicts ("Important work," "Great investment") with zero descriptive testimony of the experience.
  *   **Note:** [JUDGMENT] (This stops "blind trust" purchases).

  **Q8: Can the missing sensory data be mitigated by institutional capacity?**
  *   **Sufficient Answer:** "Yes, we can build the wall," or "No, we cannot replicate the light."
  *   **Procedure:** If **No**, the risk is transferred to the Board.
  *   **Note:** [JUDGMENT]

  #### Phase 4: The Hand-Off (Value & Risk)
  *Time: 3 Minutes*

  **Q9: Is the recommendation based on Aesthetic Value or Strategic Value?**
  *   **Sufficient Answer:** Explicitly state: "We believe this is good art" (Aesthetic) OR "We believe this will bring grants/visitors" (Strategic).
  *   **Procedure:** If Strategic, the Board must ratify the metric (e.g., "Will this actually bring visitors?").
  *   **Note:** [JUDGMENT]

  **Q10: What is the specific risk we are accepting?**
  *   **Sufficient Answer:** "We risk that the color is duller in person" OR "We risk that the artist's reputation fades."
  *   **Procedure:** This statement goes verbatim into the Board Memo.
  *   **Note:** [JUDGMENT]

  **Final Output:**
  *   If any **Stop (NO)** triggered: **Reject File.**
  *   If **Q8** or **Q10** identifies unmitigable risk: **Recommend to Board with "High Epistemic Risk" flag.**
  *   If all passed: **Approve for Acquisition.**

  ---

  ### Part 2: The Testimony Ledger

  **Purpose:** To track the accuracy of sources over time and correct for the "Perfect Agreement Bias."

  **The Problem:** If a dealer recommends 12 works and you buy all 12, and you all agree they are "good," the dealer's score is 12/12. This is useless. It proves you share a bias, not that the dealer has insight.

  **The Solution:** Track *Divergence* and *Post-Arrival Reality.*

  **Columns to Record:**
  1.  **Source Name:** (Dealer, Curator, Critic).
  2.  **Date:**
  3.  **The Claim:** (e.g., "This will define the genre," or "Condition is pristine").
  4.  **Committee Initial Verdict:** (Agree / Disagree / Unsure).
  5.  **Post-Arrival Verification:** (After install/viewing).
      *   *Did the work match the description?* (Yes/No/Partially)
      *   *Did the quality hold up?* (Yes/No/Partially)
  6.  **The Divergence Flag:** Did the Committee initially *disagree* with the Source, but later find the Source was right? (This is the only high-value data).

  **Scoring (Reliability Score - TRS):**
  *   Source says Good + We agree + Work is Good: **+0.5 points** (Low value; shared bias).
  *   Source says Good + We disagree + Work is Good: **+2.0 points** (High value; they saw something we didn't).
  *   Source says Good + We agree + Work is Bad: **-1.0 points** (Shared error).
  *   Source says Good + We disagree + Work is Bad: **+0.5 points** (We saved the budget).
  *   **Description Accuracy:** If the source described the *experience* accurately (verified post-arrival): **+1.0 point**. If they only gave a verdict: **0 points**.

  **Usage:**
  *   A source with a high score based on **Description Accuracy** is trusted on remote buys.
  *   A source with a high score based only on **Shared Bias** (Agree/Agree) is treated as a "Echo Chamber" source. Their testimony is downgraded in Phase 2, Q4.

  ---

  ### Part 3: Application to Last Month's Files

  #### File One: The 22-Minute Video
  *   **Phase 1:** Facts present. Documentation (full screener) matches medium. **Pass.**
  *   **Phase 2:** Correspondent TRS is positive (bought from twice). Independence check: Correspondent is external. **Pass.**
  *   **Phase 3:**
      *   Q6 (Gap): Minimal. Video on screener approximates gallery view closely enough for initial judgment.
      *   Q7 (Description): File contains notes on pacing and sound design. **Pass.**
  *   **Phase 4:** Risk is low.
  *   **Verdict:** **APPROVE.**
  *   **Reasoning:** The medium is reproducible. The documentation fidelity is high. The experiential gap is negligible.

  #### File Two: The Room-Sized Installation
  *   **Phase 1:** Facts present.
  *   **Phase 2:** Source is Internal Curator (Stakeholder). Downgrade verdict weight.
  *   **Phase 3:**
      *   Q6 (Gap): Massive. Scale and material presence are the point. Phone walkthrough is insufficient.
      *   Q2 (Documentation): **FAIL.** Stabilized video/technical rider missing.
      *   Q7 (Description): File relies on "you had to be there" rhetoric.
  *   **Phase 4:** Risk is High.
  *   **Verdict:** **STOP (NO).**
  *   **Reasoning:** Fails Phase 1, Q2. You cannot assess an installation on phone footage when the material presence is the primary claim. The Internal Curator's stake requires external corroboration which is absent.
  *   **Board Hand-off:** If the Committee overrides the Stop, the Board Memo must state: "We are buying a concept, not an object, based on one employee's memory."

  #### File Three: The Small Painting
  *   **Phase 1:** Facts present. Price modest.
  *   **Phase 2:** Dealer TRS is high (12/12 matches).
      *   *Ledger Check:* The 12/12 match is flagged as **Shared Bias**. The Dealer has never diverged from the Committee. This suggests the Dealer knows our taste, not necessarily the art's quality.
  *   **Phase 3:**
      *   Q6 (Gap): Paint texture, varnish, scale relative to body.
      *   Q7 (Description): **FAIL.** File contains verdict ("Confident") and Price. No description of the experience.
  *   **Phase 4:** Risk is Financial/Reputational.
  *   **Verdict:** **STOP (NO).**
  *   **Reasoning:** This is the critical test. The procedure stops this at Phase 3, Q7.
  *   **Why this step is not paperwork:** A verdict without description is a request for blind faith. Even if the price is low, buying without descriptive testimony validates a market dynamic where reputation replaces experience. It trains the Committee to ignore the "Acquaintance" requirement entirely. If the Dealer cannot describe *why* it is good, they are selling the *name*, not the *work*. Given the Board's veto power, you cannot recommend a work you cannot describe.
  *   **Correction:** Return file to Dealer. Request a 300-word description of the *viewing experience* (light, brushwork, physical reaction). If they refuse, walk away.

  ---

  ### Part 4: The One-Page Version (For the Meeting Table)

  **MUSEUM ACQUISITIONS: REMOTE FILE AUDIT (15 MIN)**

  **1. THE HARD GROUND (Facts)**
  *   [ ] **Condition:** Report present? If No + No Visit = **REJECT**.
  *   [ ] **Documentation:** Does the media match the work? (Video needs full play; Installation needs floor plan + stable video). If No = **REJECT**.

  **2. THE SOURCE (Hygiene)**
  *   [ ] **Ledger Score:** Check Testimony Ledger. Is TRS > 0?
  *   [ ] **Independence:** Are 3+ curators actually from different circles?
  *   [ ] **Stake:** Is the recommender selling the work or did they show the artist? If Yes = **Discount Verdict**.

  **3. THE GAP (Experience)**
  *   [ ] **The Lie Check:** Write down one thing the photos/video *hide* (e.g., smell, scale, texture). If you can't, you aren't looking.
  *   [ ] **Description vs. Verdict:** Does the file say *what it feels like* or just *that it's good*? If only Verdict = **REJECT**. (Crucial Step).

  **4. THE HAND-OFF (Risk)**
  *   [ ] **Value Type:** Are we buying Aesthetics or Strategy?
  *   [ ] **The Board Warning:** Complete this sentence: "We are risking that ____________ will be different in person."
  *   [ ] **Decision:**
      *   Any **REJECT** above = **NO BUY**.
      *   Unmitigable Risk in Step 4 = **BOARD VOTE REQUIRED**.
      *   All Clear = **COMMITTEE APPROVAL**.

  **WHAT THIS CANNOT DO:**
  *   It cannot guarantee the art is "good."
  *   It cannot replace seeing the work.
  *   It cannot stop the Board from vetoing a perfect file.
  *   *It ensures we know exactly why we might be wrong.*

  **LEDGER REMINDER:**
  *   Agreement = Low Value.
  *   Accurate Description = High Value.
  *   Record Post-Arrival Reality for every purchase.
