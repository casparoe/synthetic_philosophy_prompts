answer: |-
  **The Athenian Autopsy Protocol**
  **A Framework for Resolving the Dinner Table Dispute on Radical Democracy**

  **Signatories:** Camp A (Structural Defect), Camp B (Competent Aberration)
  **Witness:** The Host (who just wants to eat without a lecture)
  **Date:** [Tonight]

  ### Preamble
  We agree that shouting over wine is not historiography. We agree that Athens is the test case. We agree to stop using modern political theory as a cudgel and stick to the 5th century BCE. The following document structures our disagreement so we can actually tell who wins.

  ---

  ### Part I: Agreed Claims (The Truce Terms)
  *If you sign this, you cannot contradict these points later.*

  1.  **The Outcome:** Athens lost the Peloponnesian War and suffered two oligarchic coups (411, 404) before final defeat. The democratic system did not guarantee survival.
  2.  **The Institution:** The *Ekklesia* (Assembly) held final sovereignty over war, peace, and major strategic decisions. The *Dikasteria* (Juries) were selected by lot from the same citizen pool and operated under similar rhetorical norms.
  3.  **The Comparator:** We are benchmarking Athens against the best available alternative of the time (Spartan Gerousia, Syracusan tyranny/oligarchy, Boeotian federation), **not** against modern representative democracy, technocracy, or Plato's Republic.
  4.  **The Evidence:** The four critical episodes for this debate are:
      *   Mytilene (427 BCE)
      *   Arginusae (406 BCE)
      *   Sicilian Expedition (415–413 BCE)
      *   Trial of Socrates (399 BCE)
  5.  **The Data Limit:** We acknowledge that vote margins for Mytilene and Socrates are contested in the source tradition (Diodorus vs. Xenophon vs. Plato) and will not treat "close vote" claims as settled fact.

  ---

  ### Part II: The Disagreements Table
  *We apply the taxonomy and counterfactuals here. We must sign off on the "Prediction" column.*

  | Episode | Taxonomy (A vs. B) | Same-Voters Counterfactual | Camp A Prediction (Signable) | Camp B Prediction (Signable) | What Actually Moves Them |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Mytilene**<br>(427 BCE) | **A:** Procedure Error + Decision Error. The system incentivizes rage voting.<br>**B:** Decision Error (panic) + Bad Luck (ships nearly missed). | **A:** Yes. A cooler procedure (delay mandatory) yields different result.<br>**B:** Yes. Better intel on Mytilene's surrender timing yields different result. | "If you impose a 24h cooling-off period on all capital decrees, the first decree doesn't pass." | "The first decree was a credible deterrent signal that failed; the reversal proves the system self-corrected." | **A:** Show me a cooling-off period that *didn't* work.<br>**B:** Show me a contemporary state that didn't panic worse under blockade. |
  | **Arginusae**<br>(406 BCE) | **A:** Procedure Error. Illegal collective trial voted by Assembly.<br>**B:** Decision Error (war fever) + Procedural Hijacking (Theramenes/manipulation). | **A:** No. The Assembly *wanted* blood; procedure just enabled it.<br>**B:** Yes. If the Council (*Boule*) had refused to bring the illegal motion, the Assembly wouldn't have voted it. | "The Assembly consistently votes illegally when emotional. The structure permits tyranny of the majority." | "This was a one-off procedural breakdown prosecuted by demagogues; the prosecutors were later executed/exiled." | **A:** Another illegal mass trial.<br>**B:** Evidence that Spartan courts didn't execute losers more arbitrarily. |
  | **Sicily**<br>(415–413 BCE) | **A:** Decision Error driven by rhetorical inflation.<br>**B:** Decision Error (strategic gamble) + Bad Luck (execution/recall of Alcibiades). | **A:** No. The Assembly was prone to imperial overreach by design.<br>**B:** Yes. If Alcibiades isn't recalled or Nicias isn't given command, the expedition holds. | "A system without a strategic filter will eventually fund a Sicily-sized gamble." | "Oligarchies gamble too (see: Sparta at Leuctra). This was a risk calculation, not a structural flaw." | **A:** A pattern of 'Sicilies' (overreach) without a 'Pericles' (restraint).<br>**B:** A comparable oligarchic gamble that succeeded due to *structure*, not luck. |
  | **Socrates**<br>(399 BCE) | **A:** Procedure Error. Sortition + Rhetoric = persecution of dissent.<br>**B:** Bad Outcome by Luck (post-war trauma) + Decision Error (Socrates' defense). | **A:** No. The jury pool reflects the Assembly's intolerance.<br>**B:** Yes. A professional magistrate or different jury pool acquits; Socrates' provocation convicted. | "The cultural ecosystem of the courts makes philosophical dissent unsafe." | "This was a specific political trauma (the Thirty), not a democratic baseline. Also, not the Assembly." | **A:** Show me political trials under oligarchy that were *fairer*.<br>**B:** Show me Socrates surviving under the Thirty. (He didn't). |

  ---

  ### Part III: Pre-Registered Thresholds
  *Written before looking at the next piece of evidence. No moving the goalposts.*

  **Camp A's Concession Condition:**
  "I will concede these were contingencies rather than structural defects if:
  1.  We can identify **three** instances where the Assembly *refused* a popular, emotional war measure due to procedural safeguards (e.g., *graphe paranomon* successfully stopping a bad law).
  2.  AND the Comparator Clause shows Sparta or Syracuse made **more** strategic blunders of similar magnitude per decade of existence."

  **Camp B's Concession Condition:**
  "I will concede a regime-level defect if:
  1.  There is **one more Mytilene** (a capital decree reversed on procedural/ethical grounds due to mass panic) within a 10-year period.
  2.  OR if it is demonstrated that the *Boule* (Council) failed to filter bad motions to the Assembly in **more than 50%** of known crisis cases."

  ---

  ### Part IV: Semantic Minefields
  *We admit we are fighting about words here.*

  1.  **"Democracy" vs. "The Assembly":**
      *   *Camp A* uses "Democracy" to mean the cultural ecosystem (Assembly + Courts + Theater + Agora) that creates pressure for conformity.
      *   *Camp B* uses "Democracy" to mean the specific constitutional machinery. If the Assembly didn't vote on Socrates, Camp B says "Not Democracy's fault." Camp A says "Tomato, Tomahto."
      *   *Resolution:* We agree to distinguish *Ekklesia* (Assembly) acts from *Dikasterion* (Court) acts, but acknowledge they draw from the same demographic pool.

  2.  **"Failure" (Immorality vs. Imprudence):**
      *   *Camp A* counts the execution of Socrates as a failure of the system, even if the empire survived.
      *   *Camp B* counts survival as the primary metric. If the ship sinks, the system failed. If the ship sails but kills a philosopher, the system succeeded at its job (survival/imperial power).
      *   *Resolution:* We agree to score "Strategic Survival" and "Normative Justice" on separate scorecards.

  3.  **"Rationality":**
      *   *Camp A* defines "emotional heat" as a bug (irrationality).
      *   *Camp B* defines "emotional heat" as a feature (mobilization/civic passion).
      *   *Resolution:* We agree to judge outcomes, not the temperature of the room, unless the temperature directly caused the outcome (see: Mytilene).

  ---

  ### Part V: The "We Can't Know" Clause
  *Where this collaboration hits the wall.*

  **1. The Counterfactual Wall:**
  We cannot know if the "Same Voters" would have decided differently under a different procedure. We can't run the simulation. Camp A assumes they would have been calmer; Camp B assumes they would have been just as hawkish but slower. **Neither side can prove this.** We are inferring preference stability from fragmentary speeches.

  **2. The Comparator Data Gap:**
  We have way more evidence for Athens than for Sparta or Syracuse. Sparta's decision-making was secretive (*krypteia*, closed Gerousia). We often don't know *why* Sparta blundered, only that they did. **Camp B cannot definitively prove oligarchies were safer,** because oligarchic deliberation is hidden from history by design.

  **3. The Embarrassment Check:**
  *   **Should Camp A be embarrassed?** No. The Arginusae trial is a genuine black mark on the *Ekklesia's* procedural discipline that is hard to explain away as "bad luck."
  *   **Should Camp B be embarrassed?** No. The Socrates case is technically a Court case, not an Assembly case, and the Thirty Tyrants (oligarchs) killed more people faster. Holding democracy responsible for the Courts is a category error, even if the culture overlaps.
  *   **The Real Stalemate:** We cannot settle whether "procedural safeguards" (like the *graphe paranomon*) were a robust filter (Camp B) or a toothless formality (Camp A) because the evidence is survival-biased. We mostly hear about them when they failed.

  **Final Agreement:**
  If we finish dinner and haven't settled this, we blame the wine, not the Constitution.

  **Signed:**
  ____________________ (Camp A)
  ____________________ (Camp B)
  ____________________ (Host)
