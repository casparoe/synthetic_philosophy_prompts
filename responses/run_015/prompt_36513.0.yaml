answer: |-
  The section must present the Allais preference as a normative threat to the independence axiom rather than a mere descriptive embarrassment.

  **The Carrying Example**
  Use the **original certainty-versus-gamble pair (Common Consequence variant)** rather than the common-ratio variant.
  *   **What it must have:** A certainty option in the first pair (e.g., 100% chance of $1M) versus a high-probability gamble for a larger sum, and a corresponding shift in probabilities in the second pair where certainty is lost in both options. Use concrete monetary values ($1M, $5M) but explicitly stipulate that utility is linear over this range to isolate probability weighting from marginal utility of wealth.
  *   **What it must lack:** Real-world framing or context (e.g., "retirement fund," "medical trial") that invites wealth-effect objections or emotional framing. Keep it abstract enough to block the "stakes relative to lifetime wealth" objection at the source.
  *   **Why:** The common-ratio variant is mathematically cleaner but psychologically sterile; it fails to trigger the "certainty effect" that drives the intuition behind the paradox. The original pair forces students to feel the pull of certainty, making the subsequent violation of independence feel like a genuine conflict between intuition and axiom, which is necessary for the normative threat framing.

  **Sequence and Dependency Structure**
  1.  **Minutes 0–10: The Axiom as Cancellation.** Do not start with the formal vNM statement. Start with the intuition of "irrelevance of common consequences." Use a simple analogy (e.g., choosing between restaurants where both have the same dessert option) to establish that rational choice should depend only on differences. *Dependency:* Students cannot recognize the violation until they understand independence as a cancellation rule rather than a statistical property.
  2.  **Minutes 10–20: The Elicitation.** Present the Allais pairs. Take a show of hands for 1A vs 1B and 2A vs 2B. Expect the modal preference (1A and 2B). Do not yet reveal this violates independence. *Dependency:* Students must feel the intuitive pull of the choices before being told they are "wrong."
  3.  **Minutes 20–30: The Violation and Reformulation.** Show algebraically that the preferences contradict independence. Immediately follow this with the **two-stage lottery reformulation** (where the common consequence is represented as a branch that occurs in both lotteries). Show that choosing 1A/2B implies treating the common branch differently depending on what happens in the other branch. *Dependency:* The algebra shows *that* it violates; the reformulation shows *why* it violates (failure of consequentialism).
  4.  **Minutes 30–40: The Normative Defense.** Pivot to why we keep the axiom despite the violation. Introduce **dynamic consistency** (or resoluteness). Explain that if you treat the common consequence differently, you are vulnerable to a Dutch Book or sequential inconsistency. *Dependency:* This must come after the violation is established to show the cost of keeping the Allais preference.
  5.  **Minutes 40–50: Synthesis and Conclusion.** Summarize the trade-off: Keep Allais preferences and drop Independence (allowing regret/disappointment theories), or keep Independence and reject Allais preferences as irrational errors.

  **Misconception Management**
  *   **Independence conflated with Transitivity:** Head this off in **Minutes 0–10**. When defining the axiom, explicitly contrast it with transitivity. State: "Transitivity orders options; Independence tells you which features of options matter. You can be transitive and still violate Independence."
  *   **The Scale/Stakes Objection (Economist Colleague):** Head this off in **Minutes 10–20** during setup. Explicitly state: "We are assuming utility is linear in money for this example. If you think $1M is worth less than half of $5M to you, adjust the numbers until you are indifferent between the expected values, then check the preference." This prevents students from dismissing the paradox as a marginal utility artifact.
  *   **Allais Refutes EU Wholesale:** Head this off in **Minutes 30–40**. When showing the violation, distinguish between EU as a *descriptive* model (which Allais refutes) and EU as a *normative* theory (which is contested). Say: "This shows humans violate EU, not that EU is logically incoherent. The question is whether the axiom or the intuition should yield."
  *   **The Regret Defense (The "Rational" Student):** Head this off in **Minutes 40–50**. When discussing the trade-off, acknowledge regret theory. Say: "You can defend the Allais preference via regret, but you must admit you are rejecting Independence. You cannot have both." This validates the student's insight without letting them keep the axiom intact.

  **Exclusions**
  Refuse to cover **Prospect Theory**, as it is a descriptive psychological model that distracts from the normative axiomatic inquiry. Refuse to cover the **vNM proof machinery**, as it is unnecessary for understanding the axiom's intuitive demand. Refuse to distinguish deeply between the **Sure-Thing Principle and Independence**, treating them as functionally equivalent for this section to avoid terminological bogging.

  **Final Diagnostic Question**
  In the last five minutes, ask: **"If you insist that the Allais preference is rational, which specific normative principle must you explicitly sacrifice: Independence or Dynamic Consistency?"**
  This reveals whether they understand the trade-off (the dialectic) or merely remember that "Allais breaks Independence."
