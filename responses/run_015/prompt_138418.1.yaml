prompt: |-
  ok so I just had a two-hour argument with my friend about biological functions and I need a tiebreaker, but I also want to see where the actual disagreement is buried. Setup: she's convinced that what makes it true that "the function of the heart is to pump blood" is something about selection history — the trait is there because effects of that type were what got copies of it preserved. I kept pushing the other direction: function is just the causal contribution a part makes to some larger capacity of the system it sits in, no history required. Then we got to the weird cases and it stopped being clean, so I want a number with its guts showing.

  Here are the three cases we ended up stuck on. I made them up, so there's no received answer to recite:

  1. Swamp heart. A lightning strike and a lot of luck assemble, out of swamp goo, an organism that is cell-for-cell identical to an ordinary frog. No ancestry, no population, no selection, nothing. It hops around, its heart pumps blood, it keeps itself alive for months. Does that heart have the function of pumping blood?

  2. The crest that changed jobs. A burrowing lizard has a bony head crest that for two million years was selected for amplifying its mating call. About 200 generations ago part of the population moved into a silent cave system. In the cave the crest does something totally different: it condenses and channels water to the animal's mouth, and individuals whose crest is experimentally removed dehydrate and die. But 200 generations in a small population isn't much selection. History is entirely for call amplification; present causal contribution is entirely water collection; the contribution to survival right now is real. What is the crest's function?

  3. Benefit without variation. A deep-sea worm in which a mineral grinding spicule self-assembles by plain physics and chemistry in literally 100% of individuals, in every environment the species meets. There has never been heritable variation in whether it forms, so there has never been selection for it. It's also essential — worm without spicule starves. And a closely related species does fine without any such structure, so there's no story about the lineage out-competing others thanks to it. Does the spicule have a function?

  The headline question I want a number on: that the correct account of biological function — the one that gets all three of these right, and that captures what's going on in ordinary biology talk like "the function of the kidney is to filter blood" — is fundamentally etiological, in the sense that selection history is what makes function claims true and current causal contribution only matters by piggybacking on that history. Give me your credence in that, not "it depends on the theory."

  Then decompose it. Sub-questions I'd want numbers on, and add or replace any you think belong: does a function attribution have to explain why the trait is there (its presence or its maintenance), or can it just be a bookkeeping claim about what the part contributes? Is "function" one concept in biology or several that got run together? Is the no-variation-no-selection result in case 3 a real cost for the etiological side, given that function seems most obvious exactly where a trait is most essential? How much weight should pre-theoretic intuitions about swamp cases get at all — maybe they're just unreliable? Is there a stable hybrid (selection history for some function talk, current contribution for other function talk) or is that just changing the subject twice? And how much of this is verbal once you specify what the biology needs the term to do? One number and one line of justification each, then show how you combined them into the headline — product, weighted average, worst-case term, whatever, just say which.

  Then per case: what the etiological side says, what the causal-role side says, and your own credence that the structure in question genuinely has the function in question, on each of the three. Then tell me which single term in your decomposition you're least confident about and what argument or evidence would move it most, and finally: I'm sitting around 0.35 on the headline and she's around 0.7 — where does that gap most likely actually live, and which of the three cases would best flush it out?

  Give me the whole thing as a single JSON object, schema below, and keep the prose in the fields short — one or two sentences each, no essays.

