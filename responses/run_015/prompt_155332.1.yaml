answer: |-
  Right, let's have a proper look at this. You've got a very sharp eye for the fault lines in your own thinking, particularly that itch between "boring" and "funny." That inconsistency is the place where your current principle is most likely to snap under pressure.

  You're right that philosophers call this aesthetic testimony, and the debate usually splits between the pessimists (who say you can never know beauty second-hand) and the optimists (who say you can). You're somewhere in the middle, a contextual optimist, which is sensible. But your current distinction between "checkable properties" and "response properties" is where the wobble is. "Boring" is just as much a response as "funny." If you don't feel boredom, the film isn't boring *for you*, same as if you don't laugh, it isn't funny *for you*. The fact that you accept Dan's verdict on boredom but not the critic's on humour suggests you're treating "boring" as a technical fault (like pacing) when it comes from Dan, but as a visceral reaction when it comes from the critic.

  Here is a principle that tightens up your intuition, accounts for the algorithm distinction, and forces you to make a choice on the boring/funny paradox.

  ### The Principle of Calibrated Access

  You are entitled to claim aesthetic **knowledge** (rather than mere belief or prediction) via testimony if and only if three conditions are met:

  1.  **Sensibility Calibration:** For properties that depend on a subject's response (beauty, humour, boredom), you must have independent evidence that the testifier's sensibility aligns with yours *in that specific domain*.
  2.  **Perceptual Accessibility:** For properties that depend on technical competence (muddiness, pacing, structure), verified expertise in the testifier suffices, provided the features are in principle perceivable by you.
  3.  **Normative Independence:** The testimony must offer a judgement of the object's value, not merely a causal prediction of your psychological state.

  ***

  ### Why the clauses are there (using your cases)

  **Clause 1 (Sensibility Calibration)** handles **Dan vs. The Stranger vs. The Girlfriend.**
  *   **Dan:** You have twenty years of data. You agree four times in five. He is calibrated. You can say you *know* the film is gorgeous.
  *   **The Stranger:** No calibration. You can only say you've *heard* it's good.
  *   **The Girlfriend:** She is calibrated to Dan, not to you. Trust is not transitive in aesthetics. You haven't checked her against your own reactions. Clause 1 blocks you from claiming knowledge here.
  *   **The Boring/Funny Paradox:** This clause forces your hand. If Dan is calibrated enough for you to *know* a film is boring, he is calibrated enough for you to *know* a film is funny. You cannot have it both ways. If you accept "boring" as knowledge, you must accept "funny" from the same source. The difference you feel is likely that "boring" feels like a defect in the object (closer to Clause 2), whereas "funny" feels like a gift from the object. The principle demands you treat them consistently.

  **Clause 2 (Perceptual Accessibility)** handles **The Engineer vs. The Foreign Poem.**
  *   **The Engineer:** "Muddy low end" is technical. She has expertise; you have ears that could, with training, hear it. The feature is accessible. You can claim knowledge.
  *   **The Foreign Poem:** You cannot perceive the features (rhyme, meter, syntax) that ground the verdict. Even if the teller is trustworthy, the grounds are opaque to you. The principle says you cannot claim *knowledge*, only deference. You might feel OK saying it, but you're parroting, not knowing.

  **Clause 3 (Normative Independence)** handles **The Algorithm vs. The Critic.**
  *   **The Algorithm:** It predicts your enjoyment ("You will like this"). It does not judge the track's merit ("This is good"). You can know you'll like it (prediction), but you cannot know it's *good* (normative). This saves your intuition that the algorithm's success doesn't equal aesthetic truth.
  *   **The Primed Album:** This is the edge case. You were told it was a masterpiece, then you heard it, then you loved it. Because you have now had the experience, you satisfy Clause 1 and 2 retrospectively. The testimony primed the response, but the response is now yours. You can claim knowledge *now*, even if the origin was second-hand.

  ***

  ### Running the Undecided Cases

  **(a) The Gamelan Recording**
  *   *Case:* A friend whose judgement you trust completely on novels tells you a gamelan recording is the finest ever made. You know nothing about the tradition.
  *   *Verdict:* **No Knowledge.**
  *   *Reasoning:* This fails **Clause 1 (Sensibility Calibration)**. Calibration is domain-specific. Agreeing on the pacing of a Dickens novel does not calibrate you to the rhythmic structures of Indonesian percussion. It also brushes against **Clause 2 (Perceptual Accessibility)**; if you know nothing of the tradition, you lack the framework to perceive the features grounding the verdict. You can believe them, but you cannot claim to *know* it is the finest.

  **(b) Dan's Changing Taste**
  *   *Case:* Dan adored an album at nineteen; now he says it's rubbish. You can't tell which verdict is real.
  *   *Verdict:* **Suspend Judgement.**
  *   *Reasoning:* This fails **Clause 1 (Sensibility Calibration)**. Calibration requires a stable track record. Dan's sensibility has shifted. To claim knowledge, you need to know which Dan is calibrated to *you*. Is your taste aligned with nineteen-year-old Dan or present-day Dan? Until you test one of those verdicts against your own current reaction, the testimony is epistemically broken. You cannot inherit a verdict from a moving target.

  ***

  ### A Case of My Own: The Biased Brother

  *   *Case:* Dan tells you a film is gorgeous. You trust his taste. Later, you discover the director is his brother, whom he idolises personally.
  *   *Verdict:* **No Knowledge.**
  *   *Reasoning:* This bites on **Clause 3 (Normative Independence)** and **Clause 1**. The verdict is contaminated by non-aesthetic factors (familial loyalty). Even if Dan genuinely finds it beautiful, his judgement is no longer a reliable proxy for aesthetic value because the grounds are compromised. You cannot use him as an epistemic proxy here, because his response is partly constituted by facts you do not share (the relationship). The principle forces you to retract the knowledge claim, even if you still enjoy the film.

  ***

  ### The Casualties: What This Principle Cannot Save

  I need to be honest: to make this principle work, we have to sacrifice a couple of your intuitions.

  **1. The Foreign Poem**
  You said: *"Someone tells me a poem in a language I don't read is exquisite: I feel OK saying it."*
  My principle says: **You don't know it.**
  *Why:* If you can't defend it, and you can't perceive the grounds, it isn't knowledge. It's social deference. Saving this intuition requires diluting "knowledge" to mean "socially acceptable assertion." That isn't worth the mess. It's better to admit you're trusting the expert, not knowing the poem.

  **2. The Boring/Funny Split**
  You said: *"Dan says a film is boring... I say I know it's boring. Fine — which sits really badly with the funny one."*
  My principle says: **You must choose.**
  *Why:* Epistemically, boredom and humour are identical. They are both responses. If Dan is calibrated for one, he is calibrated for the other. You can keep the "Boring" verdict only if you concede you should also accept the "Funny" verdict from the same source. If you refuse the "Funny" verdict, you must admit you don't truly *know* it's boring either; you're just betting on it.

  **3. The Algorithm's "Goodness"**
  You said: *"I would not say I know it's good, even though it's basically never been wrong."*
  My principle says: **You are correct.**
  *Why:* This is the one I *can* save. The algorithm predicts pleasure; it does not judge merit. You can know you'll enjoy it, but "good" implies a value that exists independently of your consumption. The principle protects this distinction, which is crucial. If we let the algorithm dictate "goodness," we lose the ability to criticise our own tastes.

  ### Summary

  Your gut was mostly right, but it was trying to draw the line between "objective" and "subjective" properties. That line doesn't hold. The real line is between **calibrated proxies** and **opaque predictions**.

  If you adopt the **Principle of Calibrated Access**, you get a consistent framework. It stops you from claiming knowledge about Gamelan you don't understand, it stops you from trusting Dan's girlfriend without checking her taste, and it forces you to admit that if Dan can tell you what's boring, he can tell you what's funny.

  It'll do your head in less than the current arrangement, because at least the contradictions will be out in the open where you can see them.
