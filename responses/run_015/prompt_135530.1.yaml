  Student A's final objection raises a crucial epistemological challenge. She argues that without positive character, the claimed transformation is indistinguishable from psychological conditioning, lacking the epistemic authority required for liberative knowledge. If emptiness provides no cognitive content, *prajñā* collapses into behavioural modification. This forces B to account for how the elimination of error constitutes knowledge. A is right to demand an account of success; a therapeutic process must explain why it works. Without an epistemic grounding, the claim to liberation appears arbitrary. Her intervention ensures that Madhyamaka remains a philosophy of knowledge rather than merely a technique of mental hygiene.

  7. Adjudication of Student B's closing response
  Student B's closing response distinguishes conceptual inexpressibility from epistemic emptiness, appealing to non-conceptual direct perception. This aligns with the soteriological goal of removing obscuration rather than acquiring data. He correctly identifies that the authority of the path lies in eliminating *svabhāva-grāha*, the root of suffering, rather than asserting correct ontology. However, invoking *yogipratyakṣa* risks importing Yogācāra epistemology into a Madhyamaka framework, which typically suspends judgment on valid cognition itself. While this preserves the soteriological integrity of his position, it may concede too much to foundationalist epistemology. Nevertheless, he clarifies that liberation is defined by the absence of error, not the presence of truth.

  8. Synthesis: who is right about what, what crucial point both neglect, and who is more right overall
  Both students capture essential dimensions of Madhyamaka, yet both neglect the explicit doctrine of the two truths (*satyadvaya*) which bridges their positions. Student A is logically superior regarding the method of negation, ensuring no metaphysical residue remains. Student B is soteriologically superior regarding the purpose, ensuring emptiness serves liberation rather than debate. Crucially, both overlook how conventional truth validates the logical process while ultimate truth validates the silence. Overall, Student B is more right about the *purpose* of the tetralemma, as Nāgārjuna's aim is ultimately cessation of suffering, not logical victory. However, Student A is more right about the *method*, as without rigorous negation, B's 'transformation' risks becoming dogma. A complete reading requires A's logical rigour to secure B's soteriological aim.
