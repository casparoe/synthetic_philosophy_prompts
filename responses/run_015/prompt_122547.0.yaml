answer: |-
  # PREP SHEET: Discount Rate Decomposition Q&A
  **Context:** Finance Ministry Technical Consultation
  **Goal:** Survive the Q&A without conceding the core decomposition, while acknowledging administrative constraints.
  **Strategy:** Translate normative claims into operational trade-offs. Do not defend ethics; defend *accounting accuracy*.

  ---

  ### 1. The "Spreadsheet" Objection (Civil Servant, Cost-Benefit Unit)
  **The Objection:** "You've proposed a decomposition that requires three distinct parameters instead of one. My team writes the guidance that goes to line departments. If we tell them to estimate a 'survival hazard' for every regulatory impact analysis, we will get thirty different methodologies and thirty different discount rates for the same project. Audit will tear us apart. Practically: what number do I tell them to type into the cell for a 100-year project?"

  **The Reply:** "You are right that asking every department to estimate hazard is unworkable. The proposal isn't to decentralize the estimate, but to centralize the *schedule*. The Ministry should publish a standard hazard schedule based on statutory entrenchment, just as you currently publish a standard inflation forecast. For the spreadsheet: use a step-function. Years 0–20 use the market rate (opportunity cost dominates). Years 20–100 use a blended rate. Years 100+ use the near-zero pure rate. This preserves consistency across departments while acknowledging that a dollar of climate benefit in 2120 is not the same accounting object as a dollar of transport benefit in 2030."

  **Candid Note:** **Soft.** You are kicking the can to the Ministry to create the schedule you say is hard to estimate. If they ask *how* to build that central schedule, you have to admit there is no historical data for 100-year statutory entrenchment. You are trading administrative burden for black-box centralization.

  ### 2. The "Arbitrage" Objection (Macroeconomist, Advisory Council)
  **The Objection:** "You concede the opportunity cost of capital is high—say, 5%. But you argue the long-run discount rate should be near-zero. If the government can borrow at 2% and invest in projects yielding a social return of 1% (discounted at your low rate), but the private sector yields 5%, you are instructing the state to destroy wealth. You are starving present investment for hypothetical future benefits. That's not ethics; that's capital misallocation."

  **The Reply:** "The arbitrage charge holds only if the public investment competes directly with private capital for the same returns. It doesn't. A private firm cannot arbitrage climate stability; there is no market price for avoiding warming in 2150. The 'opportunity cost' term in my decomposition captures the crowd-out effect where it exists. The 'pure time' and 'hazard' terms adjust for the fact that the *benefit* is a public good that cannot be stored or invested privately. We aren't comparing a public bond to a private bond; we are comparing a public mitigation asset to a private consumption asset. They have different risk profiles."

  **Candid Note:** **Begs the Question.** You assume the public project *is* a distinct asset class. The macroeconomist will reply that capital is fungible. If the state pulls $1B out of the economy for a low-return project, that $1B isn't generating 5% elsewhere. You need to lean harder on market failure, but in a finance ministry, "market failure" can sound like "we know better than the market."

  ### 3. The "Audit Trail" Objection (Civil Servant, Cost-Benefit Unit)
  **The Objection:** "Consistency isn't just about the number; it's about defensibility in court or before an audit office. If we adopt a declining rate based on 'political entrenchment,' and then a new government reverses the policy in year 15, the audit office will ask why we counted benefits in year 50 that never arrived. How do we document a hazard rate that relies on predicting political stability?"

  **The Reply:** "Current guidance assumes 100% political stability over 100 years by using a constant low rate. That is empirically false and easier to attack. My proposal makes the risk explicit. If a policy is reversed, the audit trail shows we accounted for a probability of reversal, not a certainty of permanence. It is more defensible to say 'we estimated a 20% reversal risk' than to imply 'reversal is impossible.' We document the assumption, not the outcome."

  **Candid Note:** **Strong.** This is your best administrative argument. It frames your view as *more* realistic and *less* vulnerable to hindsight bias than the status quo. Stand firm here.

  ### 4. The "Garbage In" Objection (Environmental Economist, IAM Modeler)
  **The Objection:** "Integrated Assessment Models are sensitive to discounting, but they require exogenous parameters. You say hazard is front-loaded. What is the function? Is it exponential decay? Linear? If I plug in a hazard rate based on 'entrenchment,' I'm essentially calibrating the model to produce the policy conclusion I want. Do you have empirical estimates, or is this just a curve that fits your ethical intuition?"

  **The Reply:** "It is not an ethical curve; it's a survival curve. We have data on the survival rates of statutes, treaties, and infrastructure projects. Most failures happen early. A bridge doesn't collapse in year 80; it collapses in year 5 or never. A treaty isn't abandoned in year 90; it's abandoned at the first renegotiation window. Use historical survival rates of long-lived public assets to calibrate the hazard term. It's not fitting the conclusion; it's fitting the historical record of institutional durability."

  **Candid Note:** **Soft.** Historical data on 20th-century bridges doesn't necessarily predict 22nd-century climate treaties. The modeler knows this. You are claiming precision where there is deep uncertainty. Be prepared to concede the *shape* is illustrative, not precise.

  ### 5. The "Democratic Will" Objection (Macroeconomist / Civil Servant Hybrid)
  **The Objection:** "You call political reversal a 'hazard,' like an earthquake. But policy reversal is a democratic choice. If future voters choose to cancel your climate policy because they prefer consumption, that is their revealed time preference. By calling it a hazard, you are technically disguising a normative disagreement about what future people *should* want versus what they *will* want."

  **The Reply:** "There is a distinction between a change in *preference* and a change in *constraint*. If future people are richer and choose to spend on consumption, that's preference, captured by the elasticity of marginal utility. If a policy is reversed because of a lobbying shock or a constitutional crisis, that's a hazard. We shouldn't discount benefits just because future people might be fickle; we should discount them because the *mechanism* delivering the benefit might break. One is valuation; the other is delivery."

  **Candid Note:** **Very Soft.** This is the thinnest distinction. A democratic reversal *is* a revealed preference of the future polity. If you can't defend this, your decomposition collapses into "I think future people should value this more than they might." (See the "Hope Nobody Asks" section below for the deep dive).

  ### 6. The "Policy Sign" Objection (Environmental Economist, IAM Modeler)
  **The Objection:** "Let's talk about the bottom line. Does this decomposition change the sign of any major policy conclusion? If the Social Cost of Carbon goes from $100 to $150, that's a debate. If it goes from $100 to $10,000, that breaks the model. Does your near-zero long-run rate make every long-term project look cost-effective regardless of the upfront cost?"

  **The Reply:** "It shouldn't break the model if the opportunity cost term is kept high for near-term investment. The decomposition prevents the 'magic of compounding' problem where a tiny benefit in 300 years justifies massive spending today. By keeping the opportunity cost high for the first 20 years, we ensure the *investment* is efficient. The low long-run rate only ensures we don't ignore catastrophic risks that are certain to materialize if we survive. It changes the margin on adaptation vs. mitigation, not the viability of the economy."

  **Candid Note:** **Candid Concession.** You must admit that for very long horizons (200+ years), the present value will explode. You need to argue that *hazard* cuts that back down. If hazard is low, yes, the numbers get huge. You might have to concede that some projects become "too cheap" and require a separate budget constraint.

  ### 7. The "Non-Identity" Objection (Political Philosopher)
  **The Objection:** "I'm sympathetic, but you're still aggregating welfare across people who don't exist yet. If we adopt your policy, a different set of people will exist in 2100 than if we don't. You're talking about 'survival hazard' for benefits, but if the beneficiaries are different people, is it a hazard or a different outcome? Does your decomposition survive the fact that the 'future' isn't a fixed container we are filling?"

  **The Reply:** "That is a deep metaphysical problem, but for the purpose of regulatory guidance, we must act *as if* there is a continuous interest. The law treats corporations as continuous persons despite total turnover of staff and shareholders. We treat the state as a continuous agent. My hazard term acknowledges that the *institution* carrying the benefit might not survive, which is the operational version of the non-identity problem. We can't solve the metaphysics, but we can stop pretending the beneficiaries are guaranteed to be here to collect."

  **Candid Note:** **Concede.** You cannot solve non-identity in 2 minutes. The philosopher knows this. Your goal is to show that your framework is *less* vulnerable than the standard Ramsey model, which assumes a fixed population stream. Frame it as "operational necessity" rather than "metaphysical truth."

  ### 8. The "Scope Creep" Objection (Civil Servant, Cost-Benefit Unit)
  **The Objection:** "If we accept this for climate, do we apply it to nuclear waste? To pension liabilities? To infrastructure? If every department argues their project has 'low hazard' and 'zero pure time preference,' the guidance becomes a lobbying document. How do you limit the scope of this decomposition?"

  **The Reply:** "Limit it to intergenerational public goods where market prices are absent. Pensions are contractual liabilities; they have a market equivalent. Infrastructure has a depreciation schedule. Climate and nuclear waste are unique because the 'benefit' is the absence of a catastrophe that cannot be insured privately. The guidance should specify that this schedule applies only to externalities with horizons exceeding 50 years and no private market analogue."

  **Candid Note:** **Strong.** This is a manageable constraint. Defining the scope by "market failure + time horizon" is standard regulatory practice. Stick to this definition.

  ---

  ### THE ONE QUESTION YOU HOPE NOBODY ASKS

  **The Question:**
  "You argue that political reversal is a 'hazard' distinct from 'pure time preference.' But if the polity reverses a policy, isn't that simply the democratic revealed preference of that time? If future generations choose to consume rather than conserve, that *is* their time preference. By labeling it a 'hazard,' aren't you just cosmetically separating 'preferences I agree with' from 'preferences I disagree with'? If you accept their revealed preference, your hazard rate goes up, your discount rate goes up, and your decomposition collapses back into the standard descriptivist view."

  **How Bad Is It?**
  **Fatal.** This objection cuts the throat of the decomposition. It argues that your "hazard" term is just "pure time preference" disguised as risk. If the reason the benefit doesn't arrive is that future people *chose* not to value it, that is normatively equivalent to them discounting it. It undermines the claim that you are being "neutral" by removing pure time preference.

  **What Can You Say? (The Best Defense)**
  "There is a difference between *valuation* and *capacity*.
  1.  **Valuation:** Future people might value clean air less than we do (Preference).
  2.  **Capacity:** Future people might value clean air *more*, but lack the institutions to enforce it because our policy was reversed early (Hazard).

  My argument is that we should not discount the benefit simply because they *might* value it less (that's pure time preference, which I set to zero). We *should* discount it because the *institution* we built to deliver it might fail (that's hazard).
  However, if the institution fails *because* they chose to dismantle it, you are right: that is revealed preference.
  **Concession:** I must concede that 'political reversal' is a hybrid category. It is partly hazard (instability) and partly preference (democratic will). My proposal treats it as hazard to avoid paternalistically assuming future people *will* prefer consumption. But if the Ministry views democratic reversal as a preference signal, that component should move to the pure time preference term. The decomposition holds, but the bucket for 'political risk' needs to be split."

  **Candid Note:**
  This is the only place where you should visibly concede ground. Acknowledging the hybrid nature of political risk shows intellectual honesty. It saves the decomposition (by splitting the bucket) while admitting the boundary is porous. If you try to deny that democratic reversal is a preference, you will look dogmatic to the macroeconomist and the civil servants.

  **Strategic Advice:**
  If this question comes, **do not fight it.** Say: *"That is the precise tension in the decomposition. I am classifying institutional fragility as hazard to avoid penalizing future people for our current inability to entrench good policy. But if you view democratic turnover as a preference signal, that portion belongs in the time-preference term. The math remains the same; the labeling changes the normative justification."* This turns a "gotcha" into a technical clarification.
