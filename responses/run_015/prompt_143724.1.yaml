  **Replacements for Serious Problems**

  **Part (b) Conclusion:**
  *Original:* "Luminosity fails not merely somewhere along the series but at every point of it: there is no case in which a subject is in a position to know that she is in a condition she is in."
  *Replacement:* "Luminosity fails for the condition C: there is at least one case in the series where S is in C but not in a position to know that she is. This suffices to show C is not luminous."

  **Part (c) Bridge Premise:**
  *Original:* "The premise needed is the factivity of being in a position to know: necessarily, if S is in a position to know that q, then q is true."
  *Replacement:* "The premise needed is that knowledge requires being in a position to know: necessarily, if S knows that q, then S is in a position to know that q."

  **Part (d) Refutation Logic:**
  *Original:* "if she does not know that she is in C_δ, she does not know that she knows that p either."
  *Replacement:* "If KK_δ were true, S would know that she knows p. But knowing that she knows p requires a margin for error larger than δ, so even with margin δ for p, she cannot know that she knows p."

