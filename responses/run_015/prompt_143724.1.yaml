answer: |-
  **Part (a): 5 / 5**
  This mark is determined by the correct identification of the entailment direction and the clear distinction between factive knowledge and non-factive position-to-know.

  *   "KK says that knowledge iterates... The luminosity of the condition of knowing that p says something weaker..." — Credit for correctly characterizing the logical strength of the two claims.
  *   "First, being in a position to know is weaker than knowing." — Credit for identifying the modal difference.
  *   "KK entails that the condition of knowing that p is luminous; the converse fails..." — Credit for getting the entailment direction correct, relying on the implicit premise that knowledge entails being in a position to know.
  *   "So the anti-luminosity result... is stronger than a refutation of KK..." — Credit for correctly noting that refuting the entailed claim (luminosity) suffices to refute the entailing claim (KK).

  **Part (b): 5 / 7**
  This mark is borderline; it tips to 5 because the reconstruction of the series and margin premise is accurate, despite a significant error in the scope of the final conclusion.

  *   "Suppose for reductio that some non-trivial condition C is luminous... arrange a series of cases α0, …, αn..." — Credit for correctly setting up the reductio and the sorites-style series.
  *   "Now the key premise: being in a position to know requires a margin for error." — Credit for identifying the reliability/indiscriminability constraint.
  *   "So if S is in a position to know in αi that she is in C, then S is in C in every case sufficiently similar to αi... and in particular in α(i+1)." — Credit for correctly applying the margin for error principle to adjacent cases.
  *   "Luminosity fails not merely somewhere along the series but at every point of it: there is no case in which a subject is in a position to know that she is in a condition she is in." — **Fault:** Claim asserted with the wrong logical strength or scope. The argument establishes that luminosity is not universal ($\neg \forall \alpha (C\alpha \to \text{PosKnow} C\alpha)$), not that it never holds ($\forall \alpha (C\alpha \to \neg \text{PosKnow} C\alpha)$). This costs 2 marks.

  **Part (c): 2 / 4**
  This mark is determined by the recognition that a bridge premise is required, though the premise identified is incorrect and creates an internal tension with part (a).

  *   "The luminosity result does not by itself refute KK... one more premise is needed." — Credit for recognizing the logical gap between 'not in a position to know' and 'does not know'.
  *   "The premise needed is the factivity of being in a position to know: necessarily, if S is in a position to know that q, then q is true." — **Fault:** Premise described in a form that cannot do the work assigned to it. Factivity ($\text{PosKnow} \to \text{True}$) does not entail that knowledge requires being in a position to know ($K \to \text{PosKnow}$), which is what is needed to move from $\neg \text{PosKnow}$ to $\neg K$.
  *   "Given that premise, S's failure to be in a position to know... is a failure to know..." — **Fault:** Inference that would not go through even if the stated premises were granted. $\neg \text{PosKnow}$ does not imply $\neg K$ merely because $\text{PosKnow}$ is factive.
  *   "Could the defender of KK reject the premise? Not plausibly." — Credit for engaging with the dialectical situation, though based on the wrong premise.
  *   **Internal Tension:** In part (a), you correctly assumed knowledge entails being in a position to know; here you argue for factivity instead. This inconsistency costs credit.

  **Part (d): 2 / 4**
  This mark is borderline; it tips to 2 because while the verdicts are correct, the logical justification for the refutation is invalid.

  *   "Let C_δ be the condition of knowing that p with margin at least δ. C_δ is itself a non-trivial condition..." — Credit for correctly applying the non-triviality condition to the hedged case.
  *   "if she does not know that she is in C_δ, she does not know that she knows that p either." — **Fault:** Inference that would not go through even if the stated premises were granted. $\neg K(A \land B)$ does not entail $\neg K(A)$; one could know one knows $p$ without knowing one's margin is $\ge \delta$.
  *   "KK_δ therefore fails in the same way KK does..." — Credit for the correct verdict that the hedge does not save the principle.
  *   "the hedge buys nothing." — Credit for correctly answering the second question regarding the utility of the hedge (one cannot tell when the condition obtains).

