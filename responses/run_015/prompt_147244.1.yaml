      *   *My take:* This is good, but maybe "Conceptual Synthesis" is the missing third category. Calculus wasn't just deduction; it was new notation. Natural selection wasn't just observation; it was a unifying theory.
      *   *Better distinction:* "Inevitability of the Core Lemma" vs. "Contingency of the Implementation."

  10. **Final Output Structure:**
