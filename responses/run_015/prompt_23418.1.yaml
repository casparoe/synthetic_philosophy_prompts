              *   *Concept:* In standard classical logic, Reductio (Proof by Contradiction) works because contradictions are impossible. If $A \to (B \land \neg B)$, then $\neg A$.
              *   *Dialetheic Context:* If some contradictions are *true*, then deriving a contradiction from $A$ does *not* necessarily prove $\neg A$. It might just mean $A$ is a dialetheia (both true and false). Graham Priest specifically argues that *reductio* in its classical form is invalid for a dialetheist. You can't use contradiction as a *marker of falsity* if contradictions can be true.
              *   *Nuance:* Some paraconsistent logics retain a form of reductio, but the student's justification ("if assuming A lets you derive a contradiction you can still conclude not-A") implies the classical understanding of reductio, which is precisely what fails in a dialetheic framework. This undermines the dialetheic position they just described.
