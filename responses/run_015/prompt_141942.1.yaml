answer: |-
  Start by telling your students that *Arrival* promises a linguistic puzzle but delivers a metaphysical miracle. If you read the film through Quine, the tension isn't about whether language shapes thought, but whether meaning is determinate at all.

  Take the crisis point: the nations nearly go to war over whether the visitors are offering a weapon, a tool, or a gift. This is your Gavagai moment. The film treats this ambiguity as a temporary error caused by insufficient context. Once Louise gets more data—specifically, future knowledge—the meaning locks into place. Quine would say this is the cheat. For Quine, equally valid translation manuals can fit all possible behavioral evidence and still disagree on reference. You cannot solve indeterminacy by adding more data if the manuals are empirically equivalent. The film resolves the geopolitical conflict by assuming there is a single, true meaning waiting to be uncovered. This is load-bearing for the plot; if the meaning remained indeterminate, the general couldn't be convinced, and the war happens. The film needs linguistic realism to save the world, so it sacrifices indeterminacy.

  But the second issue is where the seminar should live. Heptapod B is written, non-linear, and detached from speech. There is no pointing, no ostension, no way to elicit assent or dissent to observation sentences. Quine's radical translation relies on that stimulus-response scaffolding to anchor reference. Without it, indeterminacy should be catastrophic. Louise has no way to correlate a logogram with a specific state of affairs in the present moment.

  Here, the film arguably exposes the thinness of Quine's behaviorism. If Louise can learn the language without stimulus-meaning, then meaning cannot be solely a matter of public behavioral dispositions. The film suggests a holistic grasp of the system is possible through pattern recognition and immersion, bypassing the need for atomic observation sentences. However, a strict Quinean would argue this makes translation impossible, not just harder. Without the ability to test hypotheses against immediate sensory prompts, Louise is spinning a web of belief with no anchor to the world.

  Finally, consider the proof of understanding. Louise doesn't just behave differently; she experiences time non-linearly. She takes this internal shift as confirmation that she has mastered Heptapod B. Quine would reject this evidence outright. For Quine, ontology is opaque; we cannot know if another speaker experiences time as a block universe or a flowing river, only that their speech dispositions match ours. Two manuals could account for her behavior—one positing linear time, one non-linear—and both would be valid. By validating Louise's private experience as the truth of the translation, the film defeats indeterminacy by appealing to the very inner states Quine excludes from science.

  So, where do you leave your students? The film genuinely dramatizes the horror of the unknown: the lack of shared biology, the absence of nouns or verbs, the terror of no ostension. It shows why we crave determinate meaning. But it resolves that horror by smuggling in metaphysical realism. It tells us that if we just try hard enough, we can know what the alien *really* means. Quine says we never can. The film offers comfort; Quine offers rigor. Use the film to show why we want to escape indeterminacy, and use Quine to show why we can't.
