      *   **User's Goal:** Wants a breakdown of the precise claims behind the "user illusion" slogan to prepare for Thursday's discussion. Needs to know which readings are trivial, substantive, false, or collapse into other theories. Needs to know if these readings solve the "relocated report problem." Needs to know if the "illusion presupposes experience" objection works. Needs to know if there's a criterion for "having an interface."
