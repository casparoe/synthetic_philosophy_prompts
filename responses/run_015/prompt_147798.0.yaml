answer: |-
  Here is the diagnosis, committed and specific.

  ### The Diagnosis: A Clash of Normative Authority, Not Just Metaphysics

  You are right that it is not merely a verbal dispute, but your hypothesis that it is "two questions under one word" (Compositional vs. Normative) is slightly too clean. It implies the two camps could simply split the bill and go home. They can't, because they disagree on **which question has authority over the other.**

  My diagnosis is this: This is a **substantive disagreement about the metaphysics of convention**, driven by a **clash of bedrock intuitions regarding the authority of soteriology over ontology.**

  Here is the friction point you are sensing but haven't quite named: Camp A (The Parfitians) and Camp B (The Two-Truths/Therapists) actually disagree on what "Conventional Truth" *is*.

  *   **Camp A (Constitutive Reductionism):** They believe the Conventional level is composed of the Ultimate level. A "person" is a convenient label, yes, but it *refers* to a specific causal/psychological structure (the aggregates). If you analyze the convention, you should find the reductionist base. For them, *anatta* means "The referent of 'self' is just the aggregates."
  *   **Camp B (Pragmatic Nominalism):** They believe the Conventional level *dissolves* under analysis. A "person" is not composed of aggregates; it is *imputed* onto them. If you analyze the convention looking for the person, you find nothing (emptiness), not even aggregates (since aggregates are also empty). For them, *anatta* means "The referent of 'self' is unfindable even conventionally, though the label is useful."

  **Why the argument stalls:**
  When Camp A asks, "What makes memory veridical?" they are asking for a reductionist ground (causal continuity). Camp B hears this as a category error. To Camp B, "memory" is a conventional fact that does not require an ultimate ground to function; demanding one is precisely the "clinging" that *anatta* is meant to cure. Camp A thinks Camp B is being obscurantist; Camp B thinks Camp A is reifying the aggregates (treating causality as a "further fact").

  **The Bedrock Intuition:**
  You nailed this in your prompt. The stalemate rests on whether **the anticipation of death is a datum to be explained or a symptom to be dissolved.**
  *   **Camp A** treats the intuition "I will experience my future" as a philosophical datum that any metaphysics must accommodate (hence Parfit's focus on "what matters in survival").
  *   **Camp B** treats that intuition as the *locus* of suffering. Their goal isn't to explain the intuition but to dismantle the cognitive architecture that produces it.

  ### Evaluation of Your "Thin/Thick" Distinction

  Be honest: **Your "Thin/Thick" distinction is doing less work than you think, specifically regarding Camp B.**

  *   **Thin No-Self (Identity doesn't matter):** This perfectly describes Camp A (Parfit). They are happy to accept this.
  *   **Thick No-Self (No diachronic unity even conventionally):** This *does not* describe Camp B. Camp B explicitly says, "at the conventional level the tradition is perfectly happy to talk about persons, memory, karma." They affirm conventional diachronic unity.

  **The Correction:**
  The distinction you need is not Thin vs. Thick No-Self. It is **Reductionism vs. Fictionalism.**
  *   **Camp A is Reductionist:** "Persons exist, but they are just aggregates."
  *   **Camp B is Fictionalist (specifically Prasaṅgika-style):** "Persons do not exist even conventionally in a findable way; they are merely designated."

  The fight happens because Camp A thinks Reductionism *is* the correct account of the Fiction. Camp B says Reductionism is still too ontologically committed (it reifies the "aggregates" and "causality" as ultimately real building blocks). Camp B's "Conventional" is more fragile than Camp A's "Conventional."

  ### What Would Count as Progress?

  **1. Empirical Data? No.**
  Drop this. Neuroscience, split-brain cases, and depersonalization disorders describe *mechanisms* of the sense of self. They cannot adjudicate between Reductionism and Fictionalism, nor can they address the normative claim about whether that sense *should* be dismantled. A split-brain patient still suffers; the metaphysical status of their unity doesn't change the soteriological imperative. Using empirical data here is a category error—it answers "how" the illusion works, not "whether" the illusion is the problem or the solution.

  **2. Conceptual Distinctions? Yes, but specific ones.**
  Your Compositional vs. Normative split is good, but it needs the **Two-Truths Stress Test**. Progress requires Camp A to admit that their "Reductionist Person" is an *Ultimate* claim masquerading as a Conventional one.
  *   *The Move:* Ask Camp A: "If you analyze your 'causal continuity' all the way down, do you find inherently existing moments of consciousness?" If they say yes, they are not Buddhist (they are Sarvāstivāda or Physicalist). If they say no, they must admit their "Conventional" person rests on empty ground.
  *   Ask Camp B: "If the person is merely designated, what constrains the designation?" (i.e., Why can't I say I am Napoleon?) If they say "Causal efficacy," they are smuggling Camp A's reductionism back in.

  **3. Soteriological Aims as Data? Yes. This is the lever.**
  This is the only thing that can break the deadlock. The group must agree that the *primary* truth condition of the doctrine is *dukkha*-cessation, not ontological precision.
  *   If Camp A admits this, they must accept that their metaphysical precision is secondary. If their view produces clinging (e.g., clinging to "causal continuity" as a new self), it is soteriologically faulty.
  *   If Camp B admits this, they must accept that their view must be coherent enough to guide practice. If "mere designation" makes karma unintelligible, it is soteriologically faulty.

  **Progress looks like this:** Both sides agree that *anatta* is a **normative constraint on metaphysics**, not a metaphysical constraint on norms. The metaphysics is subservient to the therapy. Camp A gets to keep their continuity for the sake of prudence; Camp B gets to keep their emptiness for the sake of non-clinging. They stop arguing about what *is* and start arguing about what *works*.

  ### Confidence and Retreat

  **Confidence Levels:**
  *   **90% Confidence:** That the dispute is a clash of **Soteriological Authority vs. Metaphysical Consistency**. The "talking past each other" is caused by Camp A treating the tradition as a philosophy system and Camp B treating it as a soteriological technology.
  *   **80% Confidence:** That **Empirical Data** is irrelevant to resolving this specific philosophical stalemate.
  *   **65% Confidence:** In my historical claim that Early Buddhist Texts prioritize the Normative (your question b) over the Compositional (your question a). This is philologically contentious; some scholars argue the early texts *are* making strong metaphysical claims about the nature of *dhammas*.

  **What I Would Drop First:**
  If pushed hard, I would drop the claim that **Camp B is purely Fictionalist.** Some Madhyamaka and Yogācāra interpretations argue that while persons are empty, the *flow of consciousness* (or *ālaya-vijñāna*) has a status that is more than merely designated. If Camp B contains members who hold this view, my "Fictionalist" label for them is too strong. They might be "Ontological Non-Realists" rather than Fictionalists. If that's the case, the dispute is even deeper: it's about whether *anything* has ontological weight, not just persons.

  **Final Verdict on Your Hypothesis:**
  Your intuition that there are "two different questions under one word" is correct, but the solution isn't just to distinguish them. It's to subordinate the Metaphysical question (a) to the Normative question (b). The tradition does not care if you are a Reductionist or a Fictionalist *unless* it impacts your suffering. The stalemate persists because your group is doing Academic Philosophy (where consistency is king) in a context derived from Soteriology (where efficacy is king). Until they agree on which god they are serving, they will keep sacrificing to different altars.
