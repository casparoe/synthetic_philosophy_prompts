  *   **NO** → Go to **Q3**

  **Q3: Did the *group* being measured change, or the *world* they are in?**
  *   **Group Changed** → **Leaf 2: Compositional Drift**
  *   **World Changed** → **Leaf 3: Transport Failure**

  **Q4: Did they know the exact formula for the score?**
  *   **NO (Secret)** → **Leaf 4: Cracking**
  *   **YES (Public)** → Go to **Q5**

  **Q5: Did the metric value go higher than ever seen in training/history?**
  *   **YES** → **Leaf 5: Extremal Goodhart**
  *   **NO** → Go to **Q6**

  **Q6: Does raising the score actively make the real goal *worse*?**
  *   **YES** → **Leaf 6: Perverse Instantiation**
  *   **NO** → Go to **Q7**

  **Q7: Does this failure happen only if *everyone* does it?**
  *   **YES** → **Leaf 7: Congestion Goodhart**
  *   **NO** → **Leaf 8: Decoupling**

  ***

  ### The Leaves (Write these in boxes at the ends)

  1.  **Regressional Goodhart**
      *   *Case:* **(d)** Surgical mortality rankings.
      *   *Awkward Commitment:* We must accept that the "best" performers are often just the luckiest ones, and punishing luck is unfair.
  2.  **Compositional Drift**
      *   *Case:* **(c)** Test scores/catchments.
      *   *Awkward Commitment:* The metric is accurate for the *new* people, but useless for comparing the *old* people to the new ones.
  3.  **Transport Failure**
      *   *Case:* **(i)** Hiring model across countries.
      *   *Awkward Commitment:* This isn't Goodhart's Law at all, it's just broken engineering; including it dilutes the definition.
  4.  **Cracking**
      *   *Case:* **(g)** Search ranking reverse-engineering.
      *   *Awkward Commitment:* Secrecy is a valid governance strategy, even if it creates an arms race.
  5.  **Extremal Goodhart**
      *   *Case:* **(a)** Nail factory; **(f)** RL boat race.
      *   *Awkward Commitment:* The "law" only applies when we succeed too hard; failure is a symptom of optimization power.
  6.  **Perverse Instantiation**
      *   *Case:* **(b)** Ambulances in car park; **(e)** Recidivism feedback loop.
      *   *Awkward Commitment:* The agents are rational; the *principals* (designers) are the ones who failed to specify constraints.
  7.  **Congestion Goodhart**
      *   *Case:* **(h)** Engagement surveys (if everyone coaches).
      *   *Awkward Commitment:* Individual rationality creates collective ruin; you cannot blame the manager for saving their own team.
  8.  **Decoupling**
      *   *Case:* **(h)** Engagement surveys (if one team coaches).
      *   *Awkward Commitment:* The metric is still "true" for everyone else, but the average is now lies; we must tolerate local corruption to keep the global signal.

  ***

  ### Empty / Incoherent Nodes (Put this in a corner)

  *   **"No Agent / Knows Formula"**: Incoherent. If no one is optimizing, no one needs to know the formula.
  *   **"Secret Formula / Extremal Value"**: Unattractive. If the formula is secret, agents rarely push values to historical extremes by accident; they usually stop at "good enough."
  *   **The "Extremal vs. Adversarial" Collapse**: Note that **Leaf 5** and **Leaf 8** often overlap. In case (a), the factory goes Extremal *to* Decouple. The tree forces a choice, but in reality, these are usually the same behavior viewed at different times. **Flag:** These two leaves are empirically hard to separate.

  ***

  ### Settled vs. Contested (The "Grill Defense" Note)

  *Write this clearly at the bottom. Mark confidence as requested.*

  **1. Is there a "True Target"? (Ontology)**
  *   **Settled:** In cases like (b) Ambulances, "patient health" is distinct from "wait times."
  *   **Contested:** In cases like (h) Surveys or (i) Hiring, is there a fact of the matter about "good management" or "best hire" independent of the metric?
  *   *My Confidence:* **Low.** This is where the Phil half will fight the ML half. ML assumes a loss function exists; Phil asks if the loss function is constitutive.

  **2. Is Adversarial Goodhart Inevitable? (The "Law" Status)**
  *   **Settled:** If the metric is public and incentives are high, *someone* will adapt (Leaf 4, 5, 6).
  *   **Contested:** Is this a fundamental law of social systems (inevitable) or an engineering failure (fixable with better design/rotation)?
  *   *My Confidence:* **Medium.** It feels inevitable in open systems, but "fixable" in closed/rotated ones. Goodhart's original phrasing was a tendency, not a physical constant.

  **3. Does Case (i) Belong Here?**
  *   **Verdict:** **Excluded by strict definition, Included by practice.**
  *   **Cost:** If you exclude it, you ignore the biggest failure mode in deployed ML (distribution shift). If you include it, you blur the line between "the world broke the metric" and "the metric broke the world."
  *   *My Confidence:* **High.** It is technically distribution shift, but functionally identical to Goodhart for the victim.

  **4. Where I'm Coining/Choosing Labels**
  *   **"Transport Failure"**: Standard term is "Covariate Shift," but that's ML jargon. I chose "Transport" to match the philosophical "external validity" language.
  *   **"Decoupling" vs "Extremal"**: I am treating these as distinct (Range vs. Intent), but many papers merge them. I did this to force the seminar to debate whether *range* matters or only *intent*.

  ***

  ### Instructor Tips for the Session

  *   **On Case (i):** If the ML students say "That's just overfitting," let them win the label but keep the case in Leaf 3. Ask the Phil students: "If the metric doesn't travel, was it ever measuring a *real* property?"
  *   **On Case (h):** Use this to split Leaf 7 and Leaf 8. Ask: "If only one manager coaches, is the survey broken? If all fifty do, is it broken?" This tests the **Scale** branch (Q7).
  *   **On The Collapse:** When you draw the line between Leaf 5 (Extremal) and Leaf 8 (Decoupling), explicitly draw a dotted line between them and write "Often the same case." This shows you aren't hiding the complexity.
  *   **On Vocabulary:** If a Phil student says "Reification," point to Leaf 6. If an ML student says "Reward Hacking," point to Leaf 5. Show them they are pointing at the same box.
