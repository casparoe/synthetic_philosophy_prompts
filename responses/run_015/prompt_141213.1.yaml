prompt: |-
  I write a column on science and ideas, and I've let myself be talked into running a hands-on session at a weekend ideas festival: about 30 adults, mixed backgrounds, no maths past school, 75 minutes, and Id like to avoid slides if I can. The situation I want them in is the Bongard-problem one — a handfull of figures on the left that share something, the same number on the right that don't, and you have to say what the rule is from those examples and nothing else.

  What I want them to run into is not that patterns are hard. It's that the examples never pin down a single rule: for any rule that fits, you can cook up a second, incompatible one that fits the same examples and disagrees with it somewhere further out, and whatever makes you go with the first one is coming from you, not from the data.

  Can you design it for me — a recipe for making the problems out of stuff I can draw on paper or hand out on cards (I don't want to go hunting for good ones), a structure that makes people commit to a rule in writing and then produce a second incompatible one, and some way (points, tokens, a show of hands with something riding on it) of getting them to stake something on which rule will handle cases they haven't seen yet. Two things I'd especially like built in. First, the turn from description to prediction: the moment where someone concedes that both rules fit everything in front of them and still has to pick which one to rely on. Second, a split where half the room sees the same examples in a different order and the halves then find out they've landed on different rules, so ordering does some visible work before I say a word about it.

  And then the debrief: what to draw out of it, what will predictably go wrong (my worry is one person shouts a rule in the first two minutes, the room locks onto it, and the whole thing becomes a puzzle hunt), and an honest note on the part of the worry the game can't stage and I'll just have to state out loud at the end.
reasoning: |-
  Here's a thinking process that leads to the suggested workshop design:

  1.  **Analyze the Request:**
      *   **Context:** Weekend ideas festival, 30 adults, mixed backgrounds, no math past school, 75 minutes.
      *   **Format:** Hands-on session, no slides (paper/cards/drawings).
      *   **Core Concept:** Bongard Problems (Left = Yes, Right = No, find the rule).
      *   **Philosophical Goal:** Demonstrate underdetermination of theory by data (multiple incompatible rules fit the same evidence; choice comes from the observer, not the data).
      *   **Specific Mechanics Required:**
          *   Recipe for creating problems (DIY).
          *   Structure for committing to a rule in writing.
          *   Mechanism for staking something on predictions (points/tokens/bets).
          *   *Feature 1:* The turn from description to prediction (conceding both fit, must pick one).
          *   *Feature 2:* Order effect (half the room sees examples in different orders $\rightarrow$ different rules).
          *   *Debrief:* What to draw out, pitfalls (early shouters), and the "honest note" (what the game can't stage).

  2.  **Deconstruct the Challenge:**
      *   *Time:* 75 minutes is tight for deep philosophical realization + gameplay + debrief. Needs tight facilitation.
      *   *Audience:* Non-mathematical. Avoid abstract symbols. Use shapes, colors, simple arrangements.
      *   *The "Trap":* Usually, Bongard problems have *one* intended solution. The goal here is to show there are *many*. This requires a shift in how Bongard problems are usually played.
      *   *The "Order Effect":* This is the trickiest part. How does order change the rule? Priming. If I see "Red circles" first, I look for color/shape. If I see "Things with 3 sides" first, I look for geometry.
      *   *The "Stake":* Needs to be low-stakes but engaging. Tokens or paper slips.

  3.  **Designing the Problems (The Recipe):**
      *   Need problems where at least two distinct rules are plausible.
      *   *Idea 1: Geometry vs. Counting.* Left: 3 triangles. Right: 4 squares. Rule A: Triangles. Rule B: Odd numbers.
      *   *Idea 2: Color vs. Position.* Left: Red dots on top. Right: Blue dots on bottom. Rule A: Red. Rule B: Top.
      *   *Idea 3: Containment vs. Connection.* Left: Dot inside circle. Right: Dot outside circle. Rule A: Inside. Rule B: Not touching.
      *   *Constraint:* Must be drawable on cards.
      *   *Selection:* I'll provide 3 specific "Underdetermined Bongard Sets" (UBS) that the facilitator can draw beforehand.

  4.  **Designing the Flow (75 Minutes):**
      *   0-10: Intro & Setup (No slides, explain the game).
      *   10-25: Round 1 (The Trap). Standard Bongard feel.
      *   25-40: Round 2 (The Split). Half room gets Order A, half gets Order B.
      *   40-55: The Bet (Prediction). New card revealed. Who wins?
      *   55-75: Debrief & Philosophy.

  5.  **Addressing Specific Requirements:**
      *   *Commit to Rule:* "Rule Cards" or slips of paper.
      *   *Stake:* "Prediction Tokens."
      *   *Turn from Description to Prediction:* This happens when the "Test Card" is revealed. Both rules fit the training data, but predict differently on the test card.
      *   *Order Effect:* Sequence the training cards. Group A sees Card 1, 2, 3. Group B sees Card 2, 1, 3 (or different subset). Actually, better: Group A sees examples that prime Rule X. Group B sees examples that prime Rule Y, but both sets are technically consistent with both rules until the Test Card.
      *   *Pitfall (Early Shouter):* Need a "Silent Phase" rule. No talking until writing is done.

  6.  **Refining the "Order Effect" Mechanism:**
      *   To make order matter, the examples need to be revealed sequentially, not all at once.
      *   *Scenario:*
          *   Rule 1: "Shapes are Red."
          *   Rule 2: "Shapes are Circles."
          *   Training Set: Red Circles (Left) vs Blue Squares (Right).
          *   If I show Red Circle, Red Circle, Red Circle first $\rightarrow$ People think "Red".
          *   If I show Circle, Circle, Circle (all red) first $\rightarrow$ People think "Circle".
          *   Wait, the Right side matters too.
          *   *Better approach:* Use a sequence of *pairs*.
          *   Set A (Priming Color): Pair 1 (Red Circle vs Blue Square), Pair 2 (Red Triangle vs Blue Square). Focus is on Color.
          *   Set B (Priming Shape): Pair 1 (Red Circle vs Red Square), Pair 2 (Blue Circle vs Blue Square). Focus is on Shape.
          *   *Wait, the prompt asks for the SAME examples in a different order.*
          *   Okay, let's try to stick to the prompt: "Half the room sees the same examples in a different order."
          *   *Challenge:* If the set is static, order shouldn't logically change the rule *unless* humans are biased by recency/primacy.
          *   *Solution:* Use a "Sequential Reveal."
          *   Examples: 3 Pairs of cards.
          *   Pair 1: Red Circle | Blue Square.
          *   Pair 2: Red Triangle | Blue Circle.
          *   Pair 3: Red Square | Blue Triangle.
          *   *Rule A:* Left is Red. *Rule B:* Left has more sides (maybe? No, Circle=1?). Let's simplify.
          *   *Rule A:* Left is Red. *Rule B:* Left is Convex? No.
          *   *Let's try:*
              *   Left: Closed Shapes. Right: Open Lines.
              *   Left: Black Ink. Right: Red Ink.
              *   If I show Black Closed vs Red Open.
              *   Order A: Emphasize Color first. Order B: Emphasize Closure first.
              *   *Actually, the most robust way to do this without complex prep:*
              *   Give Group A a packet where the first card is a "strong prime" for Rule 1.
              *   Give Group B a packet where the first card is a "strong prime" for Rule 2.
              *   The subsequent cards are ambiguous enough to fit both.
              *   *Prompt constraint:* "Same examples in a different order."
              *   Okay, I will design a set of 4 Example Pairs.
              *   Pair 1: Strong Color Prime.
              *   Pair 2: Strong Shape Prime.
              *   Pair 3 & 4: Ambiguous (fit both).
              *   Group A sees 1, 3, 4, 2. (Starts with Color).
              *   Group B sees 2, 3, 4, 1. (Starts with Shape).
              *   This satisfies the constraint.

  7.  **Drafting the Debrief:**
      *   Need to highlight "Underdetermination."
      *   Need to address the "Early Shouter" (Social proof locking in a hypothesis).
      *   The "Honest Note": The game implies *any* rule is as good as another. But in science, some are better (simplicity, mechanism). The game can't show *why* we prefer one, only that data doesn't force it.

  8.  **Review against Constraints:**
      *   30 adults? Yes, group work.
      *   No maths? Yes, visual.
      *   75 mins? Tight, need strict timing.
      *   No slides? All paper.
      *   Staking mechanism? Tokens.
      *   Order effect? Sequential card reveal.

  9.  **Final Polish:**
      *   Make the instructions for the facilitator very clear (script-like).
      *   Ensure the "Recipe" for making cards is simple (sharpies, index cards).
      *   Clarify the "Honest Note" (Induction problem vs. Pragmatism).

  *(Self-Correction during drafting)*: I need to make sure the "Order Effect" actually works. If I just shuffle cards, people might wait until they see all of them before deciding. I need to force them to hypothesize *after each card* or at least prime them heavily with the first one.
  *Decision:* I will instruct the facilitator to reveal cards one by one and ask for a "Working Hypothesis" after Card 1, then update. This locks in the bias.

  *Wait, one more thing:* The prompt asks for "a structure that makes people commit to a rule in writing and then produce a second incompatible one."
  *Adjustment:* I need a specific worksheet phase where they write Rule 1, then are forced to find Rule 2.

  *Revised Flow:*
  1. Intro.
  2. Round 1 (Simple): Get them hooked.
  3. Round 2 (The Core): The Split.
     - Reveal examples sequentially.
     - Write Rule 1.
     - Challenge: Find Rule 2 (that fits all seen data).
     - The Test Card (Prediction).
     - Bet on which rule the Test Card follows.
  4. Debrief.

  Let's flesh out the specific visual examples.
  *Set:*
  - Pair 1: Red Circle (L) / Blue Square (R)
  - Pair 2: Red Triangle (L) / Blue Circle (R)
  - Pair 3: Red Square (L) / Blue Triangle (R)
  *Rules:* "Left is Red" vs "Left has fewer sides" (Circle=1, Tri=3, Sq=4? No, Circle is 0 or 1).
  *Better Rules:* "Left is Red" vs "Left is Convex" (All are convex). Bad.
  *Better Rules:* "Left is Red" vs "Right is Blue". (Same thing essentially).
  *Let's try:*
  - Pair 1: Dot inside Circle (L) / Dot outside Circle (R).
  - Pair 2: Dot inside Square (L) / Dot outside Square (R).
  - Pair 3: Cross inside Circle (L) / Cross outside Circle (R).
  *Rule 1:* Inside.
  *Rule 2:* Containment. (Same).
  *Rule 2:* Left has 2 elements, Right has 2 elements. (No).
  *Rule 2:* Left is "Contained". Right is "Free".
  *Okay, let's go with Color vs Shape.*
  - Pair 1: Red Circle (L) / Red Square (R). (Primes Shape: Circle).
  - Pair 2: Red Circle (L) / Blue Circle (R). (Primes Color: Red).
  - Pair 3: Red Circle (L) / Blue Square (R). (Ambiguous).
  - Pair 4: Red Circle (L) / Blue Square (R). (Ambiguous).
  *Wait, if I use the SAME examples in different order:*
  - Set: {Red Circle/Red Square}, {Red Circle/Blue Circle}, {Red Circle/Blue Square}.
  - Order A: Starts with {Red Circle/Red Square}. Suggests "Circle".
  - Order B: Starts with {Red Circle/Blue Circle}. Suggests "Red".
  - Both sets end up with the same total evidence.
  - Test Card: Blue Square (L) / Red Circle (R).
  - Rule "Circle" says Left is No (Square).
  - Rule "Red" says Left is No (Blue).
  - Wait, I need the Test Card to *distinguish* the rules.
  - Test Card: Blue Circle (L) / Red Square (R).
  - Rule "Circle": Left is Yes.
  - Rule "Red": Left is No.
  - Perfect.

  10. **Finalizing the Output Structure:**
      *   Prep List.
      *   The Recipe (how to draw).
      *   The Run-of-Show (minute by minute).
      *   The Debrief (scripting the philosophy).
      *   The Honest Note.

