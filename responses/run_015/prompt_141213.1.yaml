answer: |-
  This is a brilliant brief. It moves the Bongard problem from a "puzzle with an answer" to a "demonstration of underdetermination." To pull this off in 75 minutes without slides, you need tight logistics and physical artifacts that force the cognitive shift.

  Here is the design for the session, titled **"The Rule Trap."**

  ### 1. Preparation & Materials
  You need to create three types of physical artifacts. Do not use a projector.

  **A. The Example Cards (30 sets)**
  You need 30 identical envelopes, but the *contents* are ordered differently for half the room.
  *   **The Deck:** 3 large index cards per envelope. On each card, draw a "Left" figure and a "Right" figure.
      *   *Card 1 (The Color Prime):* Left: **Red Circle**. Right: **Blue Circle**.
      *   *Card 2 (The Shape Prime):* Left: **Red Circle**. Right: **Red Square**.
      *   *Card 3 (The Ambiguous):* Left: **Red Circle**. Right: **Blue Square**.
  *   **The Split:**
      *   15 Envelopes (Group A): Contain cards in order 1, 2, 3.
      *   15 Envelopes (Group B): Contain cards in order 2, 1, 3.
  *   **Visuals:** Use thick markers. Red and Blue must be distinct. Shapes simple.

  **B. The Test Card (1 large master card)**
  *   Drawn on a large sheet of paper to hold up at the end.
  *   Left: **Blue Circle**. Right: **Red Square**.
  *   *Why:* This is the crucible.
      *   If Rule is "Left is Red" $\rightarrow$ Left is **No**.
      *   If Rule is "Left is Circle" $\rightarrow$ Left is **Yes**.

  **C. The Wager Slips & Tokens**
  *   **Slips:** Small pieces of paper. Two sections: "My Rule" and "My Prediction (Yes/No)."
  *   **Tokens:** Poker chips, coins, or even paper clips. 3 per person.

  ---

  ### 2. The Run-of-Show (75 Minutes)

  #### 0:00 – 0:10 | Introduction & The Silent Rule
  *   **Setup:** Seat participants in clusters of 4-5. Distribute envelopes (mixed so Group A and B are intermingled, or sit A on left, B on right—intermingled is better for the debrief).
  *   **Script:** "You are scientists. I have data. Your job is to find the law of nature governing this data. Left side obeys the law. Right side breaks it."
  *   **The Constraint:** "Rule 1: No talking until I say so. Rule 2: You must write your rule down. If you shout it out, you disqualify your group." (This prevents the 'early shouter' locking the room).
  *   **Action:** Have them open **Card 1** only. Give them 2 minutes to inspect. Ask them to write a "Working Hypothesis" on a scrap paper. Do not share yet.

  #### 0:10 – 0:25 | The Reveal & The First Commitment
  *   **Action:** Have them reveal **Card 2**, then **Card 3** (at 2-minute intervals).
  *   **Instruction:** "After each card, you may revise your hypothesis. But you must keep the old one. By the end of Card 3, you must select your **Champion Rule**. Write it clearly on the Wager Slip."
  *   **The Twist:** "Now, look at your Champion Rule. I want you to find a **Rival Rule**. It must fit all three cards you have seen perfectly, but it must be *different* from your Champion. Write it on the back of the slip."
  *   **Facilitator Note:** Walk around. If a group says "It's obviously Red," ask: "Does 'Circle' fit?" If they say "It's obviously Circles," ask: "Does 'Red' fit?" Force them to see the duality.

  #### 0:25 – 0:40 | The Prediction Turn
  *   **Script:** "You have two rules. Both fit the past data perfectly. Science is not about the past; it is about the future. I am going to show you a new case. Your rules will disagree on what happens next."
  *   **Action:** Reveal the **Test Card** (Blue Circle Left / Red Square Right).
  *   **The Stake:** "Look at the Left side of the Test Card. Does your Champion Rule say it belongs on the Left (Yes) or the Right (No)? Mark your prediction. Put your 3 tokens on the table. If you are confident your rule is the 'true' one, bet all 3. If you think it's a guess, bet 1."
  *   **The Reveal:** Flip the Test Card (or hold up a key that indicates the 'Truth').
      *   *Crucial Design Choice:* **There is no Truth.**
      *   **Script:** "I am not going to tell you which is right. Because there is no right. The data is finished. Anything I tell you now is just me imposing my authority, not data."
      *   **Action:** Ask for a show of hands. "Who predicted Yes? Who predicted No?" Then, "Who was Group A (Order 1-2-3)? Who was Group B (Order 2-1-3)?"

  #### 0:40 – 0:55 | The Collision
  *   **Activity:** Have Group A and Group B turn to face each other within their clusters.
  *   **Prompt:** "Compare your Champion Rules. Did Group A land on 'Red' more often? Did Group B land on 'Circle'?" (Statistically, priming suggests they will have skewed).
  *   **Discussion:** "You saw the same three cards. You have the same evidence. Why did you bet differently?"
  *   **Goal:** Get them to admit the *order* changed their *confidence*, even if the *logic* remained the same.

  #### 0:55 – 1:15 | The Debrief (The Philosophy)
  *   **Draw this out:**
      1.  **Underdetermination:** The data (Cards 1-3) did not force the rule. It only eliminated rules that were *wrong*. It left many rules *possible*.
      2.  **The Leap:** Moving from Description ("These were red") to Prediction ("The next one will be red") is not a logical step. It is a psychological one. It requires faith in uniformity.
      3.  **The Order Effect:** We like to think we are rational processors of total data. But we are story-builders. The first chapter sets the genre. Group A saw a story about Color. Group B saw a story about Shape.
      4.  **The Social Lock:** (Address the worry). "If one person had shouted 'It's Red!' at minute 2, what would have happened?" (Answer: The group would have stopped looking for Shape. Social consensus masquerades as data).

  ---

  ### 3. The Recipe for Making Your Own Problems
  If you want to swap out the Red/Circle example for something else, follow this recipe to ensure the "Underdetermination" works:

  1.  **Pick Two Independent Variables:** Color (Red/Blue) and Shape (Circle/Square).
  2.  **Create Three Pairs:**
      *   *Pair 1 (Prime Variable X):* Red Circle (L) vs Blue Circle (R). (Isolates Color).
      *   *Pair 2 (Prime Variable Y):* Red Circle (L) vs Red Square (R). (Isolates Shape).
      *   *Pair 3 (Conflate):* Red Circle (L) vs Blue Square (R). (Fits both rules).
  3.  **Create The Test Case:**
      *   Must break the symmetry. Blue Circle (L) vs Red Square (R).
      *   Variable X says Left is No. Variable Y says Left is Yes.
  4.  **Draw Simply:** Use thick markers. No shading. No complex geometry.

  ---

  ### 4. Anticipating Pitfalls

  **The "Early Shouter" (Social Proof)**
  *   *Risk:* One confident person says "It's the color!" and the table stops thinking.
  *   *Mitigation:* The "Silent Phase" (first 10 mins) is non-negotiable. Collect the first "Working Hypothesis" slips before allowing talk. This forces individual cognitive commitment before social negotiation.

  **The "Puzzle Hunt" Mindset**
  *   *Risk:* Participants treat this as a riddle where you (the facilitator) know the answer and they must please you.
  *   *Mitigation:* You must genuinely refuse to validate the Test Card. If they press you ("But what was it *really*?"), your answer is: "In the real world, nature doesn't give answer keys. You have to live with the bet you made."

  **The "It's Both" Escape**
  *   *Risk:* Participants say "The rule is Red AND Circle."
  *   *Mitigation:* This is actually a great teaching moment. Ask: "Why add the complexity? If 'Red' explains everything, why carry the baggage of 'Circle'?" (Introduces Occam's Razor as a preference, not a law).

  ---

  ### 5. The Honest Note (For the End)
  There is one thing this game cannot stage, which you must state aloud in the final 5 minutes.

  **Script:**
  >"This game makes it look like all rules are equal. That 'Red' is just as good as 'Circle.' In real science, that's not quite true.
  >
  >We didn't just pick randomly. We picked rules that were *simple*. We didn't pick a rule like 'Left side is Red, unless it's a Tuesday, or unless the marker smells like mint.'
  >
  >The game shows that data doesn't force a single theory. But it doesn't show *why* we prefer some theories over others. We prefer the ones that are simpler, or fit with other things we know, or let us build machines.
  >
  >The data didn't make you choose 'Red.' Your brain's preference for simplicity did. That's not a bug; it's how we survive. But don't mistake that preference for a law of the universe."

  ### Summary Checklist for You
  1.  **Draw 90 cards** (30 sets of 3). Mark envelopes A or B.
  2.  **Print 30 Wager Slips** (Rule / Rival / Prediction / Bet Amount).
  3.  **Gather 90 Tokens.**
  4.  **Draw 1 Large Test Card.**
  5.  **Practice the "No Answer" stance.** It will feel uncomfortable. Let it. That discomfort is the lesson.
