  ## **Terminal Leaves**

  **Leaf 1:** [Unoccupied] **Diagnosis:** Incoherent; denies freedom's value while affirming human capacity without offering a alternative good.
  **Leaf 2:** [Unoccupied] **Diagnosis:** Unattractive; denies welfare-based authority despite acknowledging human incapacity and freedom's lack of value.
  **Leaf 3:** [Unoccupied] **Diagnosis:** Unattractive; affirms freedom's lack of value and human capacity yet accepts manufactured consent.
  **Leaf 4:** [Unoccupied] **Diagnosis:** Incoherent; affirms freedom's intrinsic value but accepts manufactured consent despite human weakness.
  **Leaf 5:** [Unoccupied] **Diagnosis:** Incoherent; affirms welfare-based authority but denies the diagnosis of weakness required to justify it.
  **Leaf 6:** **The Grand Inquisitor's Paternalism** (Freedom is valueless; humans are weak; welfare justifies manufactured consent; diagnosis is correct.)
  **Leaf 7:** **Contemporary Liberal Autonomy** (Freedom is valuable; humans are capable; consent is required; diagnosis of weakness is exaggerated.)
  **Leaf 8:** **Ivan's Rebellious Affirmation** (Freedom is valuable; humans are capable; consent is required; diagnosis of weakness is accepted but freedom demanded anyway.)
  **Leaf 9:** **Christ's Silence** (Freedom is valuable; humans are weak; consent is required; diagnosis of weakness is rejected in favor of divine strength.)
  **Leaf 10:** **Alyosha's Silent Acquiescence** (Freedom is valuable; humans are weak; consent is required; diagnosis of weakness is accepted but met with love.)

