answer: |-
  **Project Title:** Beyond Causality: Classifying Metric Failures by Intervention and Calibration
  **Applicant:** [Your Name], Emeritus Field Ecologist
  **Fellowship Period:** Six Months, Part-Time

  **1. Statement of the Research Question**
  The literature on Goodhart's law and specification gaming typically classifies failures by their causal mechanism: is the breakdown due to adversarial gaming, extremal model pressure, or a causal misunderstanding of the proxy? This project asks two determinate questions. First, does sorting these failures by the *remedies available to the practitioner* cut the cases up differently than sorting them by cause, and if so, is the remedial classification more useful for policy design? Second, to what extent does the existing literature assume the target variable is well-defined and independent of the proxy (e.g., a real population size), versus cases where the target is partly constituted by the measure (e.g., research quality defined by citations)? I hypothesize that a significant portion of what is labeled "specification gaming" is actually optimization pressure pushing a system outside the *calibration range* of the proxy—a region where the measure was never validated against the target—rather than active corruption or causal breakdown.

  **2. Why Existing Positions Leave This Open**
  Current philosophical and technical taxonomies focus on *why* the measure broke. They distinguish between cases where agents actively cheat (adversarial) and cases where the relationship simply breaks down at extremes (extremal). While analytically precise, this distinction often collapses at the level of intervention. Two failures with different causes may require the same fix (e.g., abandoning the metric), while two failures with the same cause may require different fixes depending on cost and feasibility. Furthermore, much of the literature assumes a "real" target exists independently of the measurement process. This ignores cases common in social science and policy where the target is constitutive. If "research quality" is partly defined by citation counts, pushing the proxy changes the target itself. Existing frameworks rarely distinguish between measurement error (the instrument is broken) and conceptual drift (the thing being measured has changed), leading to confused prescriptions for repair.

  **3. Methodology and Work Plan**
  This project requires no empirical data collection or machine learning training. It is a conceptual analysis grounded in case study comparison. The six-month timeline is divided into three phases:

  *   **Months 1–2: Mapping Taxonomies to Remedies.** I will review standard classifications of Goodhartian failures (described in recent philosophy of science and AI safety literature) and map them against practical interventions found in policy evaluation and management science. The goal is to construct a preliminary "remedial taxonomy." Does a "causal" failure always suggest a specific fix distinct from an "extremal" failure? I will test this against known examples.
  *   **Months 3–4: The Calibration Framework and Case Studies.** I will develop the "calibration range" analogy drawn from instrumentation ecology. In field biology, a calling count is only valid within the range of densities where it was checked against actual population counts. I will apply this framework to three non-AI case studies:
      1.  *Conservation:* Payment schemes based on verified nests, where landowners may move nests or protect only easy-to-find sites.
      2.  *Healthcare:* Hospital waiting-time targets, where patients are held in ambulances to stop the clock.
      3.  *Academia:* Hiring decisions based on citation counts and journal prestige.
      For each, I will analyze whether the failure looks like gaming or simply optimization outside the calibrated range, and whether the target is independent or constitutive.
  *   **Months 5–6: Drafting and Refinement.** I will synthesize the findings into a 6,000-word paper draft. The argument will be refined based on feedback from the philosophy reading group I currently attend. The final month will be dedicated to preparing the departmental talk, focusing on the practical implications for policy design.

  **4. Possible Conclusions**
  The project will likely support one of three conclusions. First, the remedial taxonomy may prove superior for practitioners, suggesting that policy literature should reorganize around fixability rather than causality. Second, the "calibration range" model may explain away many instances of alleged gaming; if practitioners understood proxies as valid only within specific bounds, they would not treat extrapolation errors as moral failures. Third, the distinction between independent and constitutive targets may prove critical: cases with constitutive targets cannot be "fixed" by better measurement alone, requiring a change in the social practice itself. The deciding consideration will be whether the remedial classification predicts successful interventions in the case studies better than the causal classification does.

  **5. Conditions for Failure**
  This project would fail if the proposed remedial taxonomy collapses back into the causal taxonomy—for instance, if every distinct remedy maps perfectly to a distinct cause, making the new classification redundant. It would also fail if the "calibration range" analogy proves too disanalogue when applied to social systems; unlike thermometers, social proxies often change the system they measure simply by existing. If I cannot clearly distinguish between measurement error and conceptual drift in the case studies, the central argument will lack traction. Finally, the project would fail if the scope expands too broadly into general philosophy of measurement without returning to the specific question of intervention.

  **6. Scope Check and Deliverables**
  The final deliverable is a 6,000-word paper suitable for a journal in philosophy of science or science policy. This length is realistic for a part-time, six-month project because it avoids empirical work. The risk lies in the literature review; the discussion of specification gaming spans economics, computer science, and philosophy. I will restrict the review to arguments regarding taxonomy and measurement validity, avoiding deep technical dives into machine learning alignment unless directly relevant to the conceptual framework. The three case studies are chosen because I have professional familiarity with the conservation example and sufficient background in the others to analyze them without new data collection. The talk will be a 45-minute presentation of the paper's core argument, designed to be accessible to both philosophers and practicing scientists.

  **7. Significance**
  By shifting the focus from *why* metrics break to *how* they can be fixed, this project bridges the gap between philosophical analysis and administrative practice. It leverages thirty years of field ecology experience to challenge abstract models of measurement failure, offering a framework that is robust enough for real-world policy design.
