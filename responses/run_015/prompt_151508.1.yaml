      *   *Awkward Defeaters:* Flow states (loss of self/endorsement), immediate sensory hits (pre-representational), masochism (endorsing pain?).
      *   *Concessions:* Proponents must admit that "endorsement" isn't just cognitive judgment. They must distinguish between *urges* and *enjoyment*.
      *   *Insulation Risk:* High. If "affective resonance" is defined purely by the presence of pleasure, it's circular.
      *   *Exposure Verdict:* The view is theoretically elegant but empirically vulnerable, specifically regarding the dissociation of motivation and affect.

