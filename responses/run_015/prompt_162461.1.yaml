answer: |-
  This is not a dud; it is a brilliant, physical way to expose the sleight of hand in standard pop-maths explanations. You are turning a set-theoretic paradox into a logistics nightmare, which is exactly where the philosophical friction lives.

  Here is a runnable plan for a 45-minute slot, designed for 25 adults, no projector, British English.

  ### 1. The Setup (5 minutes before start)
  **The Room:** Arrange 20 chairs in a single, long row (or two rows of 10 if the room is narrow), numbered 1 to 20 with large sticky notes or printed cards taped to the backs. Leave a wide aisle in front of them.
  **The Props:**
  *   20 numbered chairs (The Hotel).
  *   20 "Guest" badges (lanyards or sticky notes) for the seated participants.
  *   5 "Arrival" badges (a different colour) for standing participants.
  *   1 "Manager" badge (bright colour) for a volunteer.
  *   A whistle (for you).
  *   A stack of "Fuel Tokens" (poker chips or coloured paper squares), 10 per seated guest.
  *   A flipchart or whiteboard (for scoring only, no diagrams).

  **The People:**
  *   **20 Guests:** Seated in chairs 1–20. They are the "Full Hotel".
  *   **5 Arrivals:** Standing at the back. They need rooms.
  *   **1 Manager:** Standing at the front. Their job is to seat the Arrivals.
  *   **You (The Referee):** Enforcing the physics.

  ### 2. The Rules (Read this out, 2 minutes max)
  "Welcome to the Grand Hilbert. It is full, but the Manager claims there is always space. Your job is to test that claim.
  1.  **One Move at a Time:** I will blow the whistle. On each blow, exactly *one* person may stand, move, and sit again.
  2.  **Empty Seats Only:** You may only sit in a chair that is currently empty. You cannot swap places mid-air.
  3.  **Fuel Costs:** Every chair you move costs one Fuel Token. If you run out of tokens, you are stuck where you are.
  4.  **Winning:** The Manager wins if all 5 Arrivals are seated. The Arrivals win if you prove it cannot be done under these rules."

  ### 3. Round One: The Single Arrival (10 minutes)
  **The Scenario:** One new guest arrives. The classic solution is "Everyone moves up one room ($n \to n+1$), freeing Room 1."
  **The Instruction:** "Manager, house this single Arrival. Guests, obey the Manager's orders, but follow the Referee's whistle."
  **The Action:**
  *   The Manager will inevitably say, "Everyone move up one."
  *   You blow the whistle.
  *   Guest 1 stands. They cannot sit in Room 2 (occupied). They hover.
  *   You blow the whistle again. Guest 2 cannot move because Guest 1 is blocking the aisle or hasn't sat down yet.
  *   **The Wall:** They will quickly realise that to move Guest 1 into Room 2, Room 2 must be empty *first*. But to make Room 2 empty, Guest 2 must move. But Guest 2 needs Room 3 to be empty.
  *   **The Breakdown:** The chain of dependency cannot start. The first domino cannot fall because the second is standing.
  *   **Score:** Arrivals: 1 point. Manager: 0.

  ### 4. Round Two: The Infinite Bus (15 minutes)
  **The Scenario:** A bus with infinitely many new guests arrives. The classic solution is "Everyone doubles their room number ($n \to 2n$). All odd rooms free up."
  **The Instruction:** "Manager, house all 5 Arrivals (representing the infinite bus). Guests, you have 10 Fuel Tokens each. Spend them wisely."
  **The Action:**
  *   The Manager will suggest, "Guest in Room 1 goes to Room 2. Guest in Room 2 goes to Room 4..."
  *   **The Fuel Wall:** Guest 10 needs to move to Room 20 (cost 10 tokens). Guest 15 needs to move to Room 30 (which doesn't exist, but even if it did, cost is 15).
  *   Even within the 20 chairs, to free up enough odd rooms, people at the end of the row must move the furthest.
  *   Guest 10 moves to 20. Tokens: 0.
  *   Guest 9 moves to 18. Tokens: 1 left.
  *   The Arrivals (5 people) need 5 rooms. To free 5 odd rooms near the start, people further down must move.
  *   Eventually, the tokens run out. The "shift" requires an infinite budget of energy. You cannot complete the rearrangement in a finite universe.
  *   **Score:** Arrivals: +1 point. Manager: 0.

  ### 5. The Kicker: The Uncountable Bus (5 minutes)
  *Note: This is the Cantor diagonalisation, physicalised.*
  **The Setup:** Keep the 20 Guests seated. Hand 5 of them (Rooms 1–5) a Red or Blue card. Tell the audience: "Each Guest holds a card. This row of colours is a 'Number'. The Manager claims they have a room for *every possible combination* of Red and Blue cards."
  **The Instruction:** "Arrivals, create a combination that is not on this list."
  **The Action:**
  *   The Arrivals look at Guest 1's card. If it's Red, they demand Blue. If Blue, they demand Red. (This is the diagonal).
  *   They look at Guest 2's card. They flip that colour too.
  *   They construct a new 5-card pattern: "Flip 1, Flip 2, Flip 3..."
  *   **The Reveal:** Ask Guest 1: "Does this new pattern match your room?" No, it differs in the first card. Ask Guest 2: "Does it match yours?" No, it differs in the second card.
  *   **The Point:** This new pattern cannot belong to Guest 1, 2, 3, 4, or 5. It is a valid pattern that has no room.
  *   **Score:** Arrivals win the cup.

  ### 6. The Debrief (10 minutes)
  *Do not use the words 'bijection' or 'cardinality' until the very last sentence.*
  1.  **The Whistle (Time):** "In the storybooks, everyone moves at once. That is a 'completed' infinity. In this room, time exists. You had to move one by one. That is a 'potential' infinity. The Hotel works in the first, fails in the second."
  2.  **The Tokens (Energy):** "Maths allows free teleportation. Physics charges for distance. The 'doubling' strategy requires an infinite amount of walking. It is a valid map, but an impossible journey."
  3.  **The Cards (Size):** "The first two rounds showed us that *counting* infinity is tricky. The last round showed us that some infinities are simply *larger*. You can't list them all, even if you have infinite rooms."
  4.  **The Takeaway:** "Hilbert's Hotel isn't a building; it's a description of a finished state. It tells you what is possible if you ignore the process of getting there. Today, you felt the cost of the process."

  ### 7. Predictable Failures & Fixes
  *   **"Infinity isn't a real hotel, so this is silly."**
      *   *Fix:* "Agreed. That's why we're playing a game with rules. In the game, 'Infinity' means 'keep going until I say stop'. Did the rules allow you to keep going?"
  *   **"Why don't we just build an extension?"**
      *   *Fix:* "Zoning laws. In this game, the set of chairs is fixed. You can rearrange the furniture, not the walls. This mirrors the mathematical rule: we are testing the set, not expanding it."
  *   **"We can swap places simultaneously."**
      *   *Fix:* Blow the whistle sharply. "One. Move. At. A. Time. If two people stand, everyone sits back down. I am the clock."
  *   **The Kicker confuses them.**
      *   *Fix:* If faces glaze over during the card flip, cut it. Say: "There is a second kind of infinity that breaks the hotel entirely, but that's a story for the bar. Let's talk about why the first round stuck."

  ### 8. What The Game Can't Deliver (Be Honest)
  You must say this out loud in the debrief:
  "This game proves that *processes* involving infinity break down in a finite universe. It does not prove that actual infinities are mathematically impossible. In set theory, the 'simultaneous move' is allowed because time isn't a variable. You have felt the Finitist objection: that mathematics is describing a god's-eye view that no human can ever occupy."

  ### 9. The Steal
  "Infinity is a destination that exists on the map, but for which there is no road."
