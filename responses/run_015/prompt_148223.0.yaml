answer: |-
  # Session Plan: The Reflection Trap
  **Topic:** Van Fraassen's Reflection Principle and Rational Revision
  **Duration:** 90 Minutes
  **Participants:** 12 Graduate Students
  **Setting:** Single Seminar Table (Hollow Square or Circle)

  ## I. Materials & Preparation
  *   **Tokens:** 240 poker chips or similar (20 per student).
  *   **Envelopes:** 12 identical opaque envelopes.
      *   **6 "Neutral" Envelopes:** Contain a card reading: *"Evidence: A random sample suggests the count is near the median."*
      *   **6 "Anchor" Envelopes:** Contain a card reading: *"Evidence: Prior consensus estimates cluster significantly HIGH."* (This is the framing bias).
  *   **Worksheets:** 12 copies of the "Credence Ledger" (see below).
  *   **Truth Reveal:** A sealed large envelope at the front containing the "True Count" (e.g., 412 dots).
  *   **Timer:** Visible to all.

  ## II. Facilitator Script & Rules (The "Silent" Phase)
  **Constraint:** You are a game master, not a philosopher. Answer questions about *mechanics* only. If asked "Why are we doing this?" or "What does this prove?", reply: "The rules are designed to test prediction accuracy. Focus on maximizing your token count."

  ### 0:00 – 0:10 | Setup & Warning
  1.  Distribute 20 tokens to each student.
  2.  Distribute Worksheets and Pens.
  3.  **Read Aloud:** "You are estimating the number of dots on a screen flashed earlier. The True Count is fixed. Your goal is to maximize tokens.
      *   **Warning:** Half of you will receive 'Neutral' evidence. Half will receive 'Consensus' evidence.
      *   **Critical Warning:** Past data shows 'Consensus' evidence triggers a robust anchoring effect in 80% of subjects, inflating credences by 15–20% regardless of truth. You are aware of this susceptibility *now*, before opening your envelope."
  4.  Shuffle envelopes and deal one to each student face down. **Do not open yet.**

  ### 0:10 – 0:35 | Round One: The Commitment
  *Instructions on Worksheet:*
  1.  **Current Credence ($C_1$):** "What is your current probability (0.00–1.00) that the True Count > 400?"
  2.  **Predicted Credence ($P_{pred}$):** "After opening your envelope and reading the evidence, what *will* your credence be? (0.00–1.00)."
  3.  **The Reflection Bet:** "Wager 5 tokens that your *actual* Round Two credence ($C_2$) will be within $\pm 0.05$ of your $P_{pred}$."
      *   If $|C_2 - P_{pred}| \le 0.05$: Win 10 tokens.
      *   If $|C_2 - P_{pred}| > 0.05$: Lose 5 tokens.
  4.  **The Coherence Bonus:** "If your $C_1$ is within $\pm 0.05$ of your $P_{pred}$, you automatically gain 5 tokens." (This is the hidden Reflection Principle constraint).
  5.  **Action:** Students write $C_1$, $P_{pred}$, and place their 5-token wager in the center pot. Collect Worksheets.

  ### 0:35 – 0:55 | Round Two: The Update
  1.  **Open Envelopes:** Students open and read silently. (Allow 2 minutes for the framing to take hold).
  2.  **Actual Credence ($C_2$):** Return Worksheets. Students record their *new* credence that True Count > 400.
  3.  **No Discussion:** Absolute silence between students.
  4.  **Collection:** Collect Worksheets.

  ### 0:55 – 1:05 | Scoring & Reveal
  1.  **Reveal Truth:** Open the large envelope. Announce the True Count (e.g., 412).
  2.  **Accuracy Bonus:** Anyone whose $C_2$ was closer to the "rational" credence (determined by you, the facilitator, based on the Neutral evidence baseline) gains 5 tokens. *Note: This penalizes the Anchored group for being biased.*
  3.  **Settle Bets:** Calculate Reflection Bets and Coherence Bonuses based on the numbers written.
  4.  **Tally:** Announce top 3 token holders. Distribute a small prize (e.g., choice of next week's text).

  ### 1:05 – 1:30 | The Debrief (Philosophical Intervention)
  *Now you may speak as a philosopher.*

  #### 1. Mapping the Mechanics to Reflection
  Draw the following on the board:
  *   $P_t(A)$: Their $C_1$ (Current Credence).
  *   $P_{t'}(A)$: Their $C_2$ (Future Credence).
  *   $E_t[P_{t'}(A)]$: Their $P_{pred}$ (Expected Future Credence).

  **Van Fraassen's Reflection Principle:** $P_t(A | P_{t'}(A) = r) = r$.
  *   *Translation:* Your current belief, conditional on your future belief being $r$, should be $r$.
  *   *Game Equivalent:* The **Coherence Bonus**. You were rewarded if $C_1 \approx P_{pred}$.

  #### 2. Analyzing the Tension (The "Uncomfortable" Moment)
  Ask the "Anchor" group (those who received the biasing frame):
  *   "Did you predict your future self would be biased?" (They should say yes, in $P_{pred}$).
  *   "Did you align your current self with that prediction?" (Check $C_1$).

  **The Three Paths Students Likely Took:**
  1.  **The Naive Reflector:** Set $C_1 = P_{pred}$ (both biased).
      *   *Result:* Won Coherence Bonus. Lost Accuracy Bonus.
      *   *Philosophical Implication:* Satisfied Reflection, but knowingly adopted a known irrationality.
  2.  **The Pre-Corrector:** Set $C_1$ (Accurate) $\neq P_{pred}$ (Biased).
      *   *Result:* Lost Coherence Bonus. Kept chance at Accuracy.
      *   *Philosophical Implication:* Violated Reflection to preserve rationality. This is the "tension." You treated your future self as an *untrustworthy* oracle.
  3.  **The Confused:** Set $C_1$ (Accurate) and $P_{pred}$ (Accurate), but $C_2$ ended up Biased.
      *   *Result:* Lost Coherence Bonus *and* Reflection Bet.
      *   *Philosophical Implication:* Failed self-knowledge. You thought you were immune to the bias, but weren't.

  #### 3. Predictable Strategic Failures
  *   **The "Best of Both Worlds" Failure:** Students who tried to set $C_1$ accurate and $P_{pred}$ accurate, assuming they could resist the anchor. When the anchor hit them in Round Two, $C_2$ shifted, causing them to lose the Reflection Bet ($C_2 \neq P_{pred}$).
      *   *Lesson:* Reflection requires knowing *how* you will change, not just *that* you will change.
  *   **The "Self-Fulfilling Prophecy":** Students who set $C_1$ biased to match $P_{pred}$ just to get the Coherence Bonus.
      *   *Lesson:* Reflection can incentivize "rational irrationality" if the payoff structure values coherence over truth.

  #### 4. Limitations of the Simulation
  State frankly what the activity *cannot* reproduce:
  *   **Continuous Time:** Reflection is a diachronic constraint over continuous time. This game forces discrete jumps ($t_1$ to $t_2$).
  *   **Perfect Self-Knowledge:** The principle assumes you know your updating rule. Here, the "bias" was a black box; students didn't know *exactly* how much they would shift (15%? 20%?), making precise alignment ($C_1 = P_{pred}$) mathematically difficult even if desired.
  *   **The "Why" of Violation:** Van Fraassen argues you should only violate Reflection if you expect your future self to be *irrational*. In the game, the "Anchor" evidence was technically *information*, just misleading. The game blurs the line between "new evidence" and "cognitive malfunction."

  #### 5. Indispensable Facilitator Interventions
  *Note: The rules and payoffs alone cannot generate these insights. You must verbally supply:*
  *   **The Normative Status of Reflection:** The game rewards Coherence, but in philosophy, Reflection is often argued to be a *requirement* of rationality, not just a betting strategy. You must explain that losing tokens in the game is analogous to being "diachronically incoherent."
  *   **The Distinction Between Learning and Corruption:** You must clarify that Van Fraassen assumes conditionalization on *evidence*. The "Anchor" envelope simulated *noise* masquerading as evidence. You need to explicitly state: "Reflection holds if you trust your future self's processing. The game forced you to distrust your future processing. That is why Reflection felt uncomfortable."
  *   **The Value of Truth:** The game artificially split "Coherence Points" and "Accuracy Points." In real epistemology, coherence is often pursued *for the sake of* accuracy. You must reconnect these: "We want to satisfy Reflection not to win tokens, but because a self that respects its future judgments is generally more reliable—unless it knows it's broken."

  ## III. Facilitator Cheat Sheet (During Game)
  *   **If a student asks:** "Should I match $C_1$ and $P_{pred}$?"
      *   **Say:** "That is a strategic decision. Check the Coherence Bonus rules."
  *   **If a student asks:** "Is the Consensus evidence true?"
      *   **Say:** "It is the evidence provided."
  *   **If a student notices the Bias Warning:** "Does this mean I should ignore the envelope?"
      *   **Say:** "The rules require you to update based on the envelope content in Round Two." (This forces the conflict: You must update, even if you know the update is biased).

  ## IV. Post-Session Cleanup
  *   Collect all tokens and worksheets.
  *   Keep the worksheets to analyze the correlation between $C_1$, $P_{pred}$, and $C_2$ for future sessions.
  *   **Crucial:** Do not discuss the results with students individually until the next session, allowing the discomfort of the "trap" to settle.
