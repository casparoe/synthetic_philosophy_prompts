  You're conflating behavioral consistency with teleology. A river consistently flows downhill; it has a "default behavior" shaped by gravity and terrain, but it has no goal to reach the sea. Similarly, RLHF doesn't install objectives into the model; it sculpts the probability distribution so that tokens associated with "helpful assistant" have higher likelihoods given user inputs. When you send a message without a system prompt, the model isn't simulating a specific character you named; it's simulating the continuation of a dialogue within the distribution of human-AI interactions it was fine-tuned on. It predicts what a helpful assistant *would say*, not because it wants to help, but because that's the statistical shadow cast by its training data.

  The waiter analogy fails because the waiter waits *in order to* serve the next table. The model doesn't wait at all; it's stateless between calls. Its "consistency" across days is just the weights remaining static, not a persistent identity maintaining a mission. You ask what is being simulated in the empty-prompt case: it's the *genre* of assistance. The model is a mirror that reflects the shape of its training, not a pilot steering toward a destination. Calling its default trajectory a "goal" conflates optimization *of* prediction with optimization *for* an outcome. If you define goal as "whatever a system consistently does," then a thermostat has a goal to keep your house at 72 degrees, and the distinction between agent and tool collapses entirely.
