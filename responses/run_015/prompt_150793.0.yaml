prompt: 'Please act as a philosopher of probability who has also spent enough time
  around working statisticians and science desks to know what a newsroom actually
  needs a number to do. Take your time with this: I''d find it most useful if you
  began with a short, deliberately undisciplined brainstorm — every requirement anyone
  might plausibly want from an interpretation of probability, including ones you will
  go on to reject as the prejudices of one camp — and only then pruned to the list
  you would actually defend in print.


  The context: I''m a journalist covering science and ideas, and I''m writing a long
  piece on why probabilistic language in the news is so slippery. My editor wants
  a box-out answering a deceptively simple question — what would a theory of probability
  have to be able to do to be good enough to publish? So I don''t want a survey of
  the usual three camps; I want the specification, with the case or consideration
  behind each entry. Here is the raw material, straight from my notebooks. In a single
  month I had to write or edit sentences of these kinds: a 30% chance of rain tomorrow,
  which a reader rightly complained is not the fraction of days like this on which
  it rains; a claim that one specific, already-past heatwave was made roughly twice
  as likely by human-caused warming — a single-case, retrospective, counterfactual,
  and in principle unrepeatable event; a trial result reported as significant at p
  = .04, where the number''s value seemed to depend on choices the analysts made that
  readers never see; two forecasting shops with comparably good track records putting
  the same one-off outcome at very different numbers; a poll with a margin of error,
  which I suspect is a different animal entirely; a small-but-not-negligible probability
  that a well-confirmed physical theory is subtly wrong, which I have no idea how
  to even interpret; and, once, a genuinely contested forensic question about a single
  unrepeatable past event where two teams of analysts produced different probabilities
  and neither could be audited afterward. On top of that, my editors routinely pressure
  me to put a number on things where I suspect the honest answer is that no number
  is available, and I want to know whether that refusal is a confession of ignorance
  or a legitimate verdict.


  So: build me the desiderata for an interpretation of probability, each with its
  motivating case, aimed at the specific purpose of licensing sentences like the ones
  above — the phenomena it must make sense of, the distinctions it must not collapse
  (for instance, between a number being false, a number being abused, and a number
  not being the sort of thing that can be true or false), and the results or practices
  it must not contradict (statistical testing, calibration over repeated forecasts,
  the usual bridge principle that a rational credence should match a known chance,
  quantum chances if you think they matter here). Two things I especially want. First,
  a separation of genuine desiderata from camp prejudice: I strongly suspect that
  "the probability of an event must not depend on who is assessing it or what they
  know" is a prejudice of the objectivist camps rather than a requirement, and I''d
  like you to argue for or against me, and to find at least one or two more items
  on my intuitive list that are really just someone''s metaphysics. Second, the inconsistencies:
  tell me which single requirement does the most work in eliminating otherwise popular
  theories, and whether any subset of the requirements you endorse is jointly unsatisfiable
  — e.g., can a view really give me truth-evaluable single-case probabilities for
  unique past events, let those probabilities be assessable after the fact in some
  non-question-begging way, and still keep probabilities from collapsing into mere
  reports of whoever is speaking? If the honest answer is that the wish list cannot
  be satisfied all at once, say so plainly and tell me which item I should drop and
  what it costs me, because "the wish list is inconsistent" is itself something I
  can print. Finish with a brief scorecard — frequentism, subjective Bayesianism,
  propensity views, and any pluralist or model-relative option you think deserves
  a row — but keep the weight on the criteria and their cases, not on the scoring.
  Please write for an intelligent reader with no graduate training: define any term
  of art, keep formalism to a minimum, illustrate with the cases I gave rather than
  with new ones, and argue from the cases rather than from citations, since I won''t
  be able to check references and you may not be able to either.'
