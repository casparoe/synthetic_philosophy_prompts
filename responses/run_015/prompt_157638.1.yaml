  9.  *(Self-Correction during drafting)*: The user asked about "Present Truth vs Present Determinacy." I need to define these carefully. Present Truth = Proposition corresponds to future fact. Present Determinacy = Proposition can be derived from present data. The rejection is saying these are not the same.

