          *   Concept: "Latent Preferences." The human has a true reward function $R^*$. The choice $C$ is generated by $C = f(R^*, \text{Bias}, \text{Noise})$.
          *   IRL tries to invert $f$ to get $R^*$.
          *   Debiasing modifies $f$ or the input to policy to better match $R^*$.
