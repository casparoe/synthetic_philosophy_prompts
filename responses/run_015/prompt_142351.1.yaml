answer: |-
  Here is the lesson plan. It is designed for 60 minutes of active teaching time, whiteboard only, non-major audience.

  ### 1. The Order of Operations
  **Sequence:**
  1.  **Decouple the Questions** (Excuse vs. Commemoration)
  2.  **Define the Defence** (Cost vs. Conceptual Availability)
  3.  **Apply the Defence** (The Case Study)
  4.  **Stress Test the Defence** (The Symmetry Worry)

  **Argument for this ordering:**
  You must separate **Excuse vs. Commemoration** *before* you analyze the moral defence.
  *   **Why:** In the public sphere, the "man of his time" defence is almost always deployed as a shield for *statues and building names*. If you do not explicitly decouple these questions in the first 10 minutes, the "Cost vs. Concept" discussion will be hijacked. Students who want the statue down will argue the moral defence is weak *because* they want the statue down. Students who want the statue up will argue the moral defence is strong *because* they want the statue up.
  *   **The Move:** Tell them: *"For the next 50 minutes, we are forbidden from discussing statues, building names, or honours. We are only deciding one thing: Is the agent morally blameworthy? We will only discuss what to do about it in the last 5 minutes."* This lowers the temperature and allows the "Conceptual Availability" distinction to be analyzed on its merits, not its political utility.

  ### 2. The Single Case Study: Winston Churchill
  **Selection:** **Churchill** (specifically his views on empire and race, not his military leadership).
  **Reasoning:**
  *   **Why not Columbus:** As you guessed, it is too easy. The moral violation (genocide/slavery) is so visceral that students struggle to entertain the "Conceptual Availability" argument without feeling they are condoning atrocity. It shuts down nuance.
  *   **Why not Jefferson:** Too loaded for a general-ed room. The slavery debate in the US context often triggers immediate defensive posturing that bypasses the philosophical mechanism you want to teach.
  *   **Why Churchill:** He offers the cleanest test for the **Symmetry Worry**. He is universally admired for *something* (fighting fascism) and universally criticized for *something else* (imperial racism). This allows you to test if the defence works selectively.
  *   **Crucial Constraint:** You must stipulate the historical facts to avoid getting bogged down. Write on the board: *"Stipulations: 1. Churchill held views on race/empire standard for British elites of his class. 2. Dissenting voices against imperialism existed in his lifetime, but were marginal."* This prevents the "But actually..." history debates.

  ### 3. Misconceptions & Intervention Points
  Here are the three misconceptions that will surface, in order, and where you kill them.

  **Misconception 1: "This is just Moral Relativism."**
  *   **When:** Immediately after you introduce the "Conceptual Availability" distinction (Minute 15).
  *   **The Worry:** Students will think you are saying "Nothing is wrong if they didn't know it was wrong."
  *   **The Intervention:** Draw a line on the board. Label one side **"Universal Wrongs"** (Torture for fun, murder) and the other **"Contextual Wrongs"** (Specific social violations). Tell them: *"The 'Man of his Time' defence does not work for Universal Wrongs. It only arguably works for Contextual Wrongs where the moral category itself was disputed."* This stops the slide into "nothing is real."

  **Misconception 2: "Hindsight Bias."**
  *   **When:** During the application to Churchill (Minute 30).
  *   **The Worry:** "We know better now, so they should have known better then."
  *   **The Intervention:** Use the **Flatmate's Distinction** here (see Naming below). Ask: *"Was the information available, or was the **concept** available?"* If the concept of 'racial equality' existed but was rejected by 99% of their peers, is it a conceptual failure or a moral failure? Force them to choose.

  **Misconception 3: "The Statue is the History."**
  *   **When:** When you re-couple the questions at the end (Minute 55).
  *   **The Worry:** "If we excuse him, we must keep the statue. If we blame him, we must remove it."
  *   **The Intervention:** Remind them of the opening frame. *"We decided he is [X] blameworthy. Does that automatically mean [Y] for the building? Can we blame him and keep the building? Can we excuse him and remove the building?"* Show that the matrix has four quadrants, not two.

  ### 4. The Flatmate's Distinction: To Name or Not to Name?
  **Decision:** **Yes, give it a name.**
  **Name:** **"The Availability Condition."**
  **When:** Introduce it at Minute 15, when defining the defence.
  **Why:** Non-majors need hooks to hang ideas on. If you just describe it informally, they will revert to "It was hard to act differently" (Cost) during the discussion. If you write **"The Availability Condition"** on the board and define it as *"Could the agent literally conceive of this action as a moral wrong given the language and concepts of their society?"*, they can use it as a checklist item.
  **Board Work:**
  Draw two columns under "The Defence":
  1.  **Cost Condition:** (Danger, ruin, exclusion).
  2.  **Availability Condition:** (Conceptual blindness).
  *Tell them:* "Most people argue about Cost. Your flatmate—sorry, *philosophers*—argue Availability is the only one that actually excuses."

  ### 5. The One Thing to Flatly Refuse
  **Refusal:** **Adjudicating Disputed Historical Facts.**
  **Script:** *"I am an ethics TA, not a historian. If you say 'Churchill didn't actually say that' or 'The famine wasn't that bad,' I cannot resolve that in this room. We are running a thought experiment based on the stipulations on the board. If the premise is false, the ethics might change, but we are testing the **structure of the argument**, not the history."*
  **Why:** You have 60 minutes. If you let two students debate the Bengal Famine death toll, you lose the session.

  ### 6. The Exit Check (Assessment)
  **Do not** do a show of hands. Do not ask "Did you understand?"
  **Do this:** **The "1970s Doctor" Test.** (Last 5 minutes).
  **Task:** Write this on the board:
  > *Dr. Smith, 1975. A respected physician. Prescribes 'rest cures' for depressed female patients, believing women are emotionally fragile. Some feminist colleagues protest this view, but the majority of the medical board supports Dr. Smith.*

  **Instruction:** *"On a scrap of paper, apply the **Availability Condition** to Dr. Smith. 1. Was the concept of 'gender bias in medicine' available in 1975? 2. Does the Availability Condition excuse Dr. Smith? 3. Hand it in on your way out."*
  **Why this works:** It tests if they can separate Cost (professional ruin) from Concept (was the idea of sexism available?). It tests if they can apply the logic to a new case without your help. It prevents the "shrug" ending because they have to commit to a verdict on a fresh case.

  ### Summary Timeline (60 Minutes)
  *   **00-10:** **Decouple.** "We are judging blame, not statues." Write the two questions on the board.
  *   **10-25:** **Define.** Introduce "Cost Condition" vs. "Availability Condition." Name them.
  *   **25-40:** **Apply.** Churchill case. Use the stipulations. Force them to use the Availability Condition.
  *   **40-50:** **Symmetry.** "If this excuses his racism, does it erase credit for fighting Hitler?" (Resolve by noting: Fighting Hitler was a *Universal Wrong* context; Imperialism was a *Contextual* one. The defence is not a blanket eraser).
  *   **50-55:** **Re-couple.** Briefly touch on statues. Show the 4 quadrants (Blame/Keep, Blame/Remove, Excuse/Keep, Excuse/Remove).
  *   **55-60:** **Exit Check.** The 1970s Doctor Test.

  ### Final Note on the "Shrug" (Nihilism)
  To prevent the "nobody is ever blameworthy" ending during the Symmetry section:
  Emphasize that **Conceptual Availability expands over time.**
  *   **The Line:** *"The Availability Condition doesn't mean we are never blameworthy. It means we are blameworthy for failing to see what was **visible** at the time. Our grandchildren will judge us not for failing to solve problems we couldn't conceive of, but for ignoring the dissenters we have **right now**."*
  *   This places the burden on *listening to contemporary dissent*, which is an actionable ethical duty, rather than perfect moral vision.
