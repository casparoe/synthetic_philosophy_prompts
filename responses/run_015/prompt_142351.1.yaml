          *   *Wait, one more check:* The prompt asks for *one* example to carry the whole hour. Jefferson is the classic "Man of his Time" case. But the TA says "Jefferson is too loaded." I will advise **Churchill** but with a specific caveat: Focus on *Imperial attitudes*, not the Famine specifically (too historical dispute). Focus on his views on race/colonialism.
          *   *Actually, looking at the "Conceptual Availability" point:* This requires a case where we can plausibly say "They couldn't have known." For slavery, many contemporaries *did* know. For Churchill's racism, many contemporaries *did* dissent.
          *   *Let's go with **Columbus** but handled carefully?* No, TA says "too easy."
          *   *Okay, I'll stick with **Churchill**.* It allows the Symmetry Worry to shine (Hero of Freedom vs. Man of Empire).

      *   *Misconceptions:*
          1.  "Moral relativism" (Everything is relative).
          2.  "Statues = History" (Removing a statue erases history).
          3.  "Hindsight Bias" (We know better now).
          4.  "The Defence is a Get-Out-of-Jail-Free Card."

      *   *Refusal:* Do not adjudicate the historical facts (e.g., "Did Churchill *really* cause the famine?"). Stick to the ethical structure.

