          *   *Argument:* Do **Cost/Concept** first. Why? Because you need to establish *if* the defence works morally before you decide *what to do* with that verdict politically. If the defence fails morally, the commemoration question changes. If the defence succeeds morally, the commemoration question is still open. So Moral Logic -> Political Application.
          *   *Wait, the Prompter's worry:* "I genuinely can't tell whether the excuse-vs-commemoration split has to land before or after."
          *   *My advice:* **Before.** Why? Because the "Man of his Time" defence is often used *as* a shield against removing statues. If you don't decouple the questions, the students will treat the moral defence as a proxy for the statue debate. You need to say: "Today we are *only* deciding if he is blameworthy. We are *not* deciding on the statue." This lowers the temperature.
          *   *Okay, changing order:* 1. Decouple Questions. 2. Define Defence (Cost vs Concept). 3. Apply. 4. Symmetry.

      *   *Refining the Case:* I need to be careful. If I choose Churchill, I need to make sure I don't get bogged down in "But he saved Europe!" That's the Symmetry Worry. That's good.
      *   *Refining the Flatmate's Point:* Name it "The Conceptual Availability Test." Put it on the board.

      *   *Refining the Assessment:* Give them a new name. "Dr. X, 1950s Psychologist." Believed homosexuality was a mental illness (standard then). Treated patients accordingly. Some colleagues dissented. Apply the test.

  4.  **Finalizing the Details:**

      *   *Whiteboard Use:* Needs to be visual. Two columns.
      *   *Misconceptions:* Address "Moral Progress" early.
      *   *Refusal:* "I am not a historian."
      *   *Naming:* Yes, name it. "Conceptual Availability."

  5.  **Review against Constraints:**
      *   No reading list.
