          2.  *Excuse vs. Commemoration:* Judging moral blameworthiness is different from deciding whether to keep a statue/name on a building. Students conflate these; need to separate them.
          3.  *Symmetry Worry:* If the defence excuses bad beliefs, does it also erase credit for good beliefs? Does it excuse *us* today (moral progress illusion)? Need to avoid ending in "nobody is ever blameworthy."
      *   **Specific Deliverables:**
          1.  Order of ideas (argument for sequencing).
