      *   *Assessment:* A mini-case not discussed. Maybe a contemporary figure or a fictional one. Or apply the test to *us*.

  3.  **Drafting the Plan (Iterative Process):**

      *   *Time:* 60 minutes.
      *   *Structure:*
          1.  Hook/Setup (5 mins)
          2.  The Distinction (Cost vs. Concept) (15 mins)
