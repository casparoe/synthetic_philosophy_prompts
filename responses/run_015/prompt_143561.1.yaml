  7.  *(Final thought on the "Crux"):* The crux must be specific. Not "did institutions matter?" but "did the variance in institutional response correlate more strongly with mortality than the variance in temperature anomaly?"

  8.  *(Final thought on Suppressed Feature):* Debt is good, but maybe "logistical capacity of the state" is better? No, debt/credit is more structural and often ignored in climate histories which focus on harvest yields. Let's stick with the financialization of subsistence.

