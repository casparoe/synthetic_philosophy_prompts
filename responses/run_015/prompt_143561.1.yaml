prompt: |-
  Analyze the European subsistence crisis of 1816—the "Year Without a Summer" following the 1815 Tambora eruption—through the lens of volcanic climate forcing as a non-human historical actor, with explicit attention to the perils of environmental determinism. I want a disciplined, two-directional case analysis, not a generic climate-history narrative.

  First, construct the causal mapping in detail. Specify the biophysical mechanisms by which Tambora's stratospheric sulfate aerosols disrupted growing-season temperatures and precipitation patterns across northern Europe, and then trace how those disruptions propagated through grain markets, state granary policies, and poor-law administration in at least two contrasting institutional settings—say, the Swiss canton of Bern and the English county of Essex. Frame the volcanic winter as an adversarial agent with a "strategy": identify which phenological calendars it compressed, which harvest windows it eliminated, and which price-signal pathways it corrupted. Then specify exactly which human institutions it exploited, which it bypassed, and where local administrators made active choices that either amplified or dampened the shock.

  Second, evaluate the agency attribution rigorously. Where does treating the volcano as a strategic actor illuminate causal structures that a purely mechanistic account obscures? Where does the metaphor mislead—particularly by hiding the distributive choices of magistrates, merchants, and poor-law officers? Be precise about what would count as evidence for genuine explanatory agency versus mere causal efficacy, and apply that standard to this case.

  Third, take a committed position: does the 1816 crisis strengthen the program of attributing historical agency to climate and volcanic events, or does it undermine environmental determinism by showing that institutional architecture mediated the shock so thoroughly that the volcano's impact was contingent on prior human structures? Give explicit reasons and identify the crux—the specific sub-question—on which your verdict turns. Do not lay out options neutrally; defend one view.

  Fourth, isolate one feature that standard determinist narratives suppress—perhaps the differential resilience of communal grain reserves versus market-dependent supply chains, or the role of pre-existing debt instruments in shaping famine vulnerability rather than temperature anomalies alone—and explain why recognizing it forces a revision in how we assign causal weight to non-human actors.
