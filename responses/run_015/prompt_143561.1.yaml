      *   **Task 2 (Agency Attribution):** Evaluate the "volcano as actor" metaphor. Where does it illuminate? Where does it mislead (hiding distributive choices)? Define evidence for *explanatory agency* vs. *causal efficacy*. Apply standard.
      *   **Task 3 (Committed Position):** Does this strengthen climate agency or undermine determinism? Defend one view. Identify the *crux* (specific sub-question).
      *   **Task 4 (Suppressed Feature):** Isolate one feature standard narratives suppress (e.g., communal reserves vs. markets, debt instruments). Explain why recognizing it revises causal weight assignment.

  2.  **Initial Research & Fact-Checking (Mental Sandbox):**

      *   *Tambora:* April 1815 eruption. Stratospheric aerosols. Global cooling 1816.
      *   *Biophysics:* Sulfate aerosols reflect solar radiation. Cooling is most pronounced in summer growing seasons. Precipitation patterns shift (often wetter/colder in Northern Europe).
      *   *Phenology:* Grain needs heat units. Frost kills shoots. Rain rots hay/harvest.
      *   *Bern (Switzerland):* Highly regulated, communal granaries (*Kornhaus*), strong state interventionism, guild influence, subsistence ethic.
      *   *Essex (England):* Market-dependent, Speenhamland system (poor relief tied to bread prices), enclosures, shift towards capitalist agriculture, less direct state control of grain supply.
      *   *Agency Debate:* Latour (Actor-Network Theory), Dipesh Chakrabarty (Climate History), but need to avoid simple determinism.
      *   *Key Distinction:* Causal efficacy (A causes B) vs. Agency (A acts with intent/strategy/consequence). Volcanoes don't have intent, so "strategy" must be metaphorical/heuristic.

  3.  **Drafting - Section by Section:**

      *   **Introduction:** Set the stage. 1816. Tambora. Define the "non-human actor" lens. State the thesis early (to prepare for the committed position later).
      *   **Section 1: Causal Mapping (The Adversarial Strategy):**
          *   *Biophysics:* Sulfate veil $\rightarrow$ albedo increase $\rightarrow$ thermal deficit.
