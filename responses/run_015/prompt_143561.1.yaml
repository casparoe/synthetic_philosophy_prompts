              *   *Essex:* Exploited market integration. Price signals corrupted by speculation. Speenhamland amplified the shock by subsidizing demand without increasing supply (inflationary spiral).
          *   *The "Strategy":* Target the bottleneck (flowering/harvest). Corrupt the price signal (scarcity vs. hoarding).
      *   **Section 2: Agency Attribution (Metaphor vs. Mechanism):**
