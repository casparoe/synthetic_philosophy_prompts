answer: |-
  # The Assertibility Protocol v1.0

  **Purpose:** To regulate claims based on epistemic norms without stifling calibrated uncertainty. This procedure replaces the binary "true/false" check with a gradient of "warranted assertibility."

  ### Phase 1: Epistemic Standing (The Knowledge Norm Proxy)
  *Does the writer possess sufficient justification to claim knowledge?*
  1.  **Source Access:** Did you read the full paper/data, or only the abstract/press release?
      *   If only abstract/press release: **Kill** or **Hedge** heavily ("Researchers claim..."). **[AUTOMATIC]**
      *   If full data reviewed: Proceed.
  2.  **Expertise Gap:** Are you interpreting data outside your competency without expert review?
      *   Yes: **Hand to Editor**. **[VALUES JUDGMENT]** (Editor weighs risk of error vs. need for translation).
      *   No: Proceed.

  ### Phase 2: Claim Typology (The Truth Norm Filter)
  *Is the claim about a state of affairs or a future outcome?*
  1.  **Descriptive:** Is the claim about past or present data (e.g., "The protein folded")?
      *   Yes: Verify against source. If verified, **Assert**. **[AUTOMATIC]**
      *   No (it implies causality not in data): **Hedge** ("suggests," "correlates"). **[AUTOMATIC]**
  2.  **Predictive:** Is the claim about a future event or model output (e.g., "Temperatures will rise")?
      *   Yes: Proceed to Phase 3.
      *   No: **Hand to Editor** if causal language is strong but evidence is observational. **[VALUES JUDGMENT]**

  ### Phase 3: The Predictive Assertibility Filter (The Hybrid Norm)
  *Apply only if Phase 2 identified a Predictive Claim. This replaces "Knowledge" with "Reliability."*
  1.  **Calibration Check:** Is the model/method historically calibrated for this specific context?
      *   No (Novel method/Black Swan): **Kill** or **Hedge** ("Model suggests"). **[MISFIRE ZONE]** (Blocks novel breakthroughs that lack historical data).
      *   Yes (Established reliability): Proceed.
  2.  **Cost-of-Error Check:** If this prediction is wrong, what is the harm?
      *   High (Safety/Policy/Medical): **Hand to Editor**. **[VALUES JUDGMENT]** (Editor weighs public safety vs. information utility).
      *   Low (Curiosity/Theoretical): Proceed.
  3.  **Mode-Label Check:** Is the linguistic modality matched to the probability?
      *   Yes (e.g., "70% chance" matches model output): **Assert** (with the probability attached). **[AUTOMATIC]**
      *   No (e.g., "Will happen" vs "60% chance"): **Hedge** to match mode. **[AUTOMATIC]**

  ### Phase 4: Disposition
  *   **Assert:** Passes all checks, mode matches probability.
  *   **Hedge:** Fails Mode-Label or Source Access, but information is valuable.
  *   **Kill:** Fails Calibration or Epistemic Standing critically.
  *   **Hand to Editor:** Fails Cost-of-Error or Expertise Gap (requires values weighing).

  ---

  ### Case Applications

  **Case 1: The Storm Prediction**
  *Claim:* "The storm will hit Category 4."
  *Source:* Meteorological model.
  *   **Phase 1:** Writer read the model output. (Pass)
  *   **Phase 2:** Predictive. (Go to Phase 3)
  *   **Phase 3:**
      *   Calibration: Models are generally calibrated. (Pass)
      *   Cost-of-Error: High (Public safety/evacuation). **[VALUES JUDGMENT]** -> **Hand to Editor**.
      *   Mode-Label: "Will hit" is absolute; model says 60%. (Fail) -> **Hedge** ("Models project a high probability of Category 4").
  *   **Outcome:** The absolute assertion is blocked; the hedged version is cleared by editor.

  **Case 2: The Cancer Abstract**
  *Claim:* "This study proves cancer risk doubles."
  *Source:* Press release/Abstract only.
  *   **Phase 1:** Source Access failed (Abstract only). **[AUTOMATIC]** -> **Hedge** or **Kill**.
  *   **Phase 2:** Descriptive/Causal ("Proves").
  *   **Outcome:** Protocol forces a **Hedge** ("Study suggests risk may double") or **Kill** because "proves" violates the Knowledge Norm when full data isn't reviewed. The writer cannot assert certainty without epistemic standing.

  **Case 3: The Blocked Forecast**
  *Claim:* "Market will correct by Q3."
  *Source:* Well-calibrated economic model.
  *   **Phase 1:** Pass.
  *   **Phase 2:** Predictive.
  *   **Phase 3:**
      *   Calibration: Pass.
      *   Cost-of-Error: High (Financial loss for readers). **[VALUES JUDGMENT]** -> **Hand to Editor**.
      *   Mode-Label: Pass.
  *   **Conflict:** The checklist triggers a **Hand to Editor** due to Cost-of-Error. The Editor decides to **Assert** anyway because the newsletter's mission is high-risk insight.
  *   **Outcome:** The procedure flags the risk, but human override permits publication. This highlights that the protocol manages *liability*, not *truth*.

  ---

  ### Procedure Limitations
  This procedure cannot adjudicate on **novelty versus reliability**. It systematically disadvantages paradigm-shifting science (Phase 3, Calibration Check) because new truths lack historical calibration data. It also cannot resolve ethical conflicts where the "Cost-of-Error" is subjective (e.g., causing panic vs. saving lives); it only flags them for human review.

  \answer{The protocol's biggest blind spot is that it treats historical calibration as a proxy for truth, systematically silencing novel discoveries that lack precedent data.}
