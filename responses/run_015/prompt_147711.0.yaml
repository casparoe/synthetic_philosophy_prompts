prompt: |-
  You're a professional philosopher who's spent most of your career in the weeds of collective action problems — the inefficacy objection, expected-difference arguments, threshold effects, the whole mess. Like, the actual literature, not the TED-talk version. Please think carefully about this one and do a bit of brainstorming on the structure before you commit to anything; I'd much rather have you work out the shape of the thing first than hand me something smooth and useless.

  I sit on the grants committee of a small foundation that funds individual-behaviour-change campaigns — climate stuff mostly, some animal welfare. We recieve about a dozen proposals a quarter, we get 45 minutes per proposal, grants run £20k–£150k, and the rest of the committee is a GP, a retired accountant and a local councillor. Nobody has read any of this literature and they're not going to. We also publish a two-line rationale for every decision, so whatever we use has to be something I can defend in public.

  So: give me a decision procedure my committee can actually run, not an essay about why individual contributions matter. Specifically:

  - An ordered set of questions, with what counts as a *sufficient* answer to each, where the procedure stops with a no, and where it hands the decision to the full board because the issue is really a values call rather than a factual one.
  - It has to seperate three things that proposers constantly mush together: (a) the empirical claim that any one person's act makes no difference — no threshold crossed, or a replacement buyer/leakage effect, or the change is below the resolution of the supply chain; (b) the further step from "makes no difference" to "has no obligation", which is a normative move and not an empirical one; and (c) genuinely non-causal reasons people might still have — expressive or solidarity reasons, what kind of person you're being, fairness to other people who are doing their part, conditional obligations that only bite if enough others join in. I want the procedure to say explicitly which of these three our foundation is *allowed* to fund on, and to have a step whose job is to catch campaigns that dress up (c) in the language of (a) — pretend to be making an empirical impact claim when what they're really selling is meaning or belonging. Call that step whatever you like; I want it to be a real test, not a vibe check.
  - It needs a rule for pivotality arguments — the "tiny chance you're the one who tips it" move. When is that legitimate (i.e. there's an actual threshold mechanism you can point to and a probability you can defend) and when is it a shell game dressed up as expected-value reasoning? And what do we do when the 45 minutes run out and nobody can produce a number: what's the default, and who eats the cost of that default?
  - Each output should end in FUND / NO / BOARD CALL plus a publishable line, and you should flag honestly where the procedure will systematically misfire.

  Then run it on three real-ish proposals:

  1. A city-wide campaign to cut beef consumption. The supermarket chain wrote to us saying they only adjust orders in 500-case units, so individual people quitting just get absorbed unless they bunch up.
  2. A "delete your old emails and cloud photos" campaign to cut data-centre emissions. We funded something almost exactly like this two years ago and it's become a bit of an in-joke internally — if the procedure says stop, I want to see it say stop cleanly, and I want to know whether it stops because of the size of the effect, the absence of a threshold, or something else.
  3. A conditional pledge campaign: a heat-pump bulk-buy that only launches if 5,000 households pledge, with the discount kicking in at that number. Here pivotality looks real and the numbers look checkable — but I want you to work through what happens at 4,999 and at 5,001, because I don't think our committee has thought about that and I suspect it matters more than it looks.

  No reading lists, no citations, no "see so-and-so 1984" — I can't check them and neither can the rest of the committee, so please keep it self-contained.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **Role:** Professional philosopher specializing in collective action problems (inefficacy, thresholds, expected difference, etc.).
      *   **Task:** Create a practical decision procedure for a grants committee (small foundation, individual-behavior-change campaigns, climate/animal welfare).
      *   **Constraints:**
          *   Committee members: GP, accountant, councillor (no philosophy background).
          *   Time: 45 mins per proposal.
          *   Grants: £20k–£150k.
          *   Output: Two-line public rationale required.
          *   Structure: Ordered set of questions (stop rules), distinguish empirical vs. normative vs. expressive claims, handle pivotality arguments, end with FUND/NO/BOARD CALL + publishable line, flag systematic misfires.
          *   Test Cases: Beef consumption (supply chain threshold), Email deletion (negligible impact/in-joke), Heat-pump pledge (conditional threshold).
          *   Tone: Professional, rigorous but accessible, no citations/reading lists.

  2.  **Deconstruct the Philosophical Problems:**
      *   *The Inefficacy Objection:* One person's action doesn't change the outcome (e.g., buying one less chicken doesn't stop a factory farm).
      *   *The Normative Gap:* Even if it makes no difference, do I have an obligation? (Complicity, integrity, fairness).
      *   *The Expressive/Solidarity Move:* Doing it to signal virtue or join a community, not to cause change.
      *   *Pivotality/Thresholds:* The chance of being the *one* person who tips the scale. Expected value = Impact × Probability.
      *   *The "Mush":* Proposers often claim empirical impact when they mean expressive value, or rely on vague pivotality without numbers.

  3.  **Design the Decision Procedure (The "Filter"):**
      *   *Goal:* A flowchart-like set of questions that forces clarity without requiring a PhD.
      *   *Step 1: The Causal Claim (Empirical).* Does the campaign claim to reduce harm directly? If yes, is there a mechanism?
      *   *Step 2: The Threshold/Supply Chain Check.* Is there a specific point where behavior changes supply? (Addressing the beef/supermarket issue).
      *   *Step 3: The Pivotality Test.* If relying on "tiny chance of big impact," can they quantify the threshold and probability? If not, default to skepticism.
      *   *Step 4: The Non-Causal Justification (Normative/Expressive).* If causal impact is weak, are they arguing for integrity/solidarity? Is this within the foundation's mandate? (This addresses the "mush").
      *   *Step 5: The Board Call.* If the justification is purely values-based (e.g., "we fund symbolism"), kick it upstairs.
      *   *Step 6: The Verdict.* Fund/No/Board.

      *Refining the Steps for the User's Constraints:*
      *   Need to explicitly separate (a) Empirical, (b) Normative, (c) Expressive.
      *   Need a specific test for "dressing up (c) in language of (a)". Let's call this the "Counterfactual Swap Test".
      *   Need a rule for when numbers aren't produced in 45 mins. (Default to No, cost on proposer).
      *   Need publishable lines.

  4.  **Drafting the Procedure (Iterative Process):**

      *   *Question 1 (Mechanism):* What breaks if 1,000 people do this? If the answer is "nothing physically changes," move to Q4.
      *   *Question 2 (Thresholds):* Is there a specific number where supply changes? (Beef case). If yes, is the campaign designed to hit *that* number?
      *   *Question 3 (Pivotality):* If they claim "expected value," do they have a probability distribution? If no numbers in 45 mins -> NO. (Cost on proposer).
      *   *Question 4 (The Mask Test):* If they admit impact is low but say "it's about principle," is that fundable? This is the values call.
      *   *Question 5 (Board Call):* If the rationale is purely expressive/symbolic, does the foundation's charter allow that? If unclear -> BOARD CALL.

      *Wait, I need to make sure the "Mush" detection is robust.*
      *   Let's add a specific step: "The Substitution Test." If the outcome is the same but the action is different, does the claim hold?
      *   Actually, the prompt asks for a step to catch campaigns dressing up (c) in (a). Let's call it the "Causal Integrity Check."
      *   *Rule:* If the proposal claims *impact* (a) but cannot specify a *mechanism* where individual acts aggregate to a physical change, it fails unless they explicitly pivot to (c). If they stay in (a) without mechanism -> NO.

      *Refining the Pivotality Rule:*
      *   Standard Expected Utility: $EV = Impact \times Probability$.
      *   Problem: Probability is often vanishingly small.
      *   Rule: If the threshold is vague (e.g., "cultural shift"), pivotality is invalid. If threshold is hard (e.g., "5,000 pledges"), pivotality is valid *only* for the marginal unit near the threshold.
      *   Default: If no probability number is given, assume probability is negligible for funding purposes. Cost of uncertainty lies with the applicant.

  5.  **Developing the Test Cases:**

      *   *Case 1: Beef Campaign.*
          *   Issue: 500-case units. Individual acts absorbed.
          *   Analysis: Fails Q1/Q2 on individual impact. Succeeds only if it's a coordinated threshold campaign. If it's just "ask people to quit," it's (c) dressed as (a).
          *   Verdict: NO (unless they pivot to coordination).
      *   *Case 2: Email Deletion.*
          *   Issue: Negligible impact, previously funded (in-joke).
          *   Analysis: Data centers run on baseload. One email deletion doesn't turn off a server. No threshold. Purely expressive.
          *   Verdict: NO. Catch the "in-joke" aspect via precedent/consistency.
      *   *Case 3: Heat Pump Pledge.*
          *   Issue: Conditional pledge (5,000 households).
          *   Analysis: Hard threshold. Pivotality is real *at the margin*.
          *   Nuance: What about 4,999 vs 5,001? At 4,999, your pledge is pivotal. At 5,001, it's not (redundant). But the campaign sells the *aggregate*.
          *   Verdict: FUND (mechanism is clear), but note the redundancy risk.

  6.  **Refining the Output Format:**
      *   Introduction: Acknowledge the role and the constraint.
      *   The Procedure: Numbered steps, clear stop rules.
      *   The Pivotality Rule: Explicit handling of uncertainty.
      *   The Test Cases: Applied rigorously.
      *   Systematic Misfires: Honest assessment of where this tool fails (e.g., long-term cultural shifts).

  7.  **Self-Correction/Polishing during drafting:**
      *   *Critique:* Is the procedure too technical for a GP/Accountant?
      *   *Fix:* Use plain English labels for the philosophical concepts. Instead of "Expected Utility," use "The Odds Test." Instead of "Complicity," use "The Principle Test."
      *   *Critique:* Did I address the "publishable line"?
      *   *Fix:* Ensure every verdict has a specific 2-line rationale template.
      *   *Critique:* Did I handle the "Board Call" correctly?
      *   *Fix:* Make sure the Board Call is reserved for when the *mandate* is unclear, not just when the decision is hard.
      *   *Critique:* The prompt asks to separate (a), (b), and (c).
      *   *Fix:* Ensure the procedure forces the applicant to declare which one they are selling. If they sell (a) but prove (c), they fail the "Causal Integrity Check."

  8.  **Final Review against constraints:**
      *   Ordered set of questions? Yes.
      *   Sufficient answers defined? Yes.
      *   Stop rules? Yes.
      *   Separate (a), (b), (c)? Yes.
      *   Catch (c) dressed as (a)? Yes (The "Mechanism Mismatch" step).
      *   Pivotality rule? Yes.
      *   Default on missing numbers? Yes.
      *   Three test cases run? Yes.
      *   Publishable lines? Yes.
      *   Systematic misfires flagged? Yes.
      *   No citations? Yes.

      *One detail on the Heat Pump case:* The prompt specifically asks to work through 4,999 vs 5,001. I need to make sure the procedure handles the *marginal* value of the grant vs the *average* value. The grant funds the *campaign*, not the individual pledge. The campaign's value is creating the threshold. I need to be careful not to conflate the individual's pivotality with the campaign's efficacy. The campaign is pivotal if it gets the group over the line.
      *Correction:* The procedure evaluates the *campaign*. The campaign claims to get 5,000 pledges. If they get 4,999, did the money waste? Yes. This is a risk assessment. The procedure needs to account for "All-or-Nothing" thresholds.

      *Let's finalize the "Pivotality Rule" for the committee:*
      If the proposal relies on being the "tipping point," they must identify the threshold $T$ and the current baseline $B$. If $T - B$ is not reachable with the grant, it's a NO. If they can't define $T$, it's a NO.

      *Let's finalize the "Mask Test":*
      Ask: "If the physical outcome were identical but no one knew you did it, would the campaign still claim success?" If Yes -> Empirical (a). If No -> Expressive (c). If they claim (a) but answer No -> Fail.

      *Okay, ready to write.*
answer: |-
  Here is a decision procedure designed for your specific constraints. It translates the philosophical literature on collective action into an operational checklist. It forces proposers to declare whether they are selling *impact*, *obligation*, or *meaning*, and penalizes vagueness.

  ### The "Collective Action" Decision Procedure

  **Instructions for the Committee:**
  Proceed through these questions in order. If a proposal fails a "Stop Rule," the decision is **NO**. If a proposal passes all filters but relies on a values judgment outside the foundation's explicit mandate, the decision is **BOARD CALL**. If it passes all filters and fits the mandate, the decision is **FUND**.

  **Time Limit:** If the proposer cannot provide the required specific data (numbers, thresholds, mechanisms) within the 45-minute window, the default assumption is that the data does not exist. The cost of this uncertainty is borne by the applicant (Stop Rule applies).

  ---

  #### Step 1: The Mechanism Test (Separating Empirical from Expressive)
  **Question:** What specific physical chain of events occurs if the target number of people perform this action?
  *   **Sufficient Answer:** A clear description of how individual acts aggregate to change a supply chain, policy, or physical metric (e.g., "1,000 cancellations = 1 server rack decommissioned").
  *   **Stop Rule:** If the proposer cannot describe a mechanism where individual acts aggregate to a physical change, they are not making an empirical claim (a). Move to Step 4.
  *   **The Mask Test (Catching (c) dressed as (a)):** Ask: *"If the physical outcome were identical but no one knew these individuals participated, would you still claim this campaign succeeded?"*
      *   If **NO**: The claim is Expressive/Solidarity (c), not Empirical (a). They must justify funding under Step 4. If they continue to argue Empirical Impact (a) after answering NO here, **STOP → NO**. (Rationale: Misleading claims).

  #### Step 2: The Threshold & Supply Chain Check
  **Question:** Is there a specific numeric threshold where the system responds (e.g., supermarket order sizes, policy vote counts)?
  *   **Sufficient Answer:** A specific number $T$ (Threshold) and evidence that the supply chain/policy reacts at $T$.
  *   **Stop Rule:** If the supply chain absorbs individual changes without adjustment (e.g., "supermarkets order in bulk units larger than our target"), and the campaign does not have a mechanism to coordinate hits *at* that threshold, **STOP → NO**. (Rationale: Individual acts are absorbed by system inertia).

  #### Step 3: The Pivotality Rule (Handling Uncertainty)
  **Question:** If the campaign relies on a "tiny chance of huge impact" (expected value), can you provide the probability estimate?
  *   **Sufficient Answer:** A defensible estimate of the probability $P$ that this specific grant pushes the project over the threshold $T$.
  *   **The 45-Minute Rule:** If no probability or threshold number is produced in the meeting, assume $P \approx 0$ for funding purposes. **STOP → NO**. (Rationale: Public funds require quantifiable risk assessment; uncertainty costs lie with applicant).
  *   **The Redundancy Check:** If the threshold is already met (or clearly will be without this grant), the marginal impact is zero. **STOP → NO**.

  #### Step 4: The Normative/Expressive Justification (If Steps 1-3 Fail)
  **Question:** Since direct impact is unproven, is the goal to foster civic virtue, solidarity, or fairness (claims (b) or (c))?
  *   **Sufficient Answer:** An explicit admission that the primary value is normative (e.g., "building a community of practice") rather than empirical.
  *   **Board Call Rule:** If the foundation's charter does not explicitly allow funding for *symbolic* or *expressive* acts without proven physical impact, this is a **BOARD CALL**. (Rationale: This changes the foundation's mission from "impact" to "meaning").
  *   **Stop Rule:** If the foundation *does not* fund symbolic acts, and the proposal admits impact is negligible, **STOP → NO**.

  #### Step 5: Final Consistency Check
  **Question:** Is this rationale consistent with past funding decisions?
  *   **Stop Rule:** If we funded a similar low-impact campaign recently (e.g., an "in-joke" project), funding this would introduce arbitrariness. **STOP → NO** unless the distinction is clear and defensible.

  ---

  ### Application to Test Cases

  Here is how the procedure runs on your three scenarios.

  #### Case 1: City-wide Beef Reduction
  *   **Facts:** Supermarkets adjust orders in 500-case units. Individual quitting is absorbed. Campaign asks individuals to quit.
  *   **Step 1 (Mechanism):** Proposer claims individual quitting reduces supply.
      *   *Mask Test:* If no one knew people quit, would supply drop? No, not until 500 cases align.
      *   *Result:* They are claiming Empirical (a) but the mechanism requires coordination.
  *   **Step 2 (Threshold):** Threshold is 500 cases.
      *   *Analysis:* Does the campaign coordinate timing to hit 500 cases simultaneously? No, it's a general awareness campaign.
      *   *Result:* Individual acts are absorbed.
  *   **Verdict:** **NO**
  *   **Publishable Line:** "While the goal is urgent, the proposed mechanism does not align with supply-chain ordering units; individual actions will be absorbed without coordinated threshold targeting."
  *   **Philosophical Note:** This catches the "inefficacy objection" early. It doesn't say eating beef is fine; it says *this campaign* won't change the beef count.

  #### Case 2: Delete Old Emails (Data Centre Emissions)
  *   **Facts:** Data centres run on baseload. One deletion doesn't turn off a server. Previously funded (now an in-joke).
  *   **Step 1 (Mechanism):** Proposer claims deletion saves energy.
      *   *Mask Test:* If servers run the same regardless, is there impact? No.
      *   *Result:* Fails Empirical (a). Move to Step 4.
  *   **Step 4 (Normative/Expressive):** Proposer argues it's about "digital hygiene" and "awareness."
      *   *Analysis:* This is Expressive (c).
      *   *Board Call Check:* Does our charter fund awareness without physical impact? If yes, proceed to Step 5.
  *   **Step 5 (Consistency):** We funded this 2 years ago. It is now internally regarded as ineffective.
      *   *Analysis:* Funding again violates consistency/arbitrariness constraints.
  *   **Verdict:** **NO**
  *   **Publishable Line:** "The physical impact of individual data deletion is negligible at the server level, and repeat funding of awareness-only campaigns conflicts with our priority on measurable outcomes."
  *   **Why it stops:** It stops on Step 1 (no physical mechanism) and Step 5 (precedent). It avoids the "in-joke" trap by citing the physical reality, not the office gossip.

  #### Case 3: Heat-Pump Conditional Pledge (5,000 Households)
  *   **Facts:** Discount kicks in at 5,000 pledges. Grant funds the campaign to get pledges.
  *   **Step 1 (Mechanism):** Clear. 5,000 pledges = bulk buy = lower cost = more installs = less carbon.
  *   **Step 2 (Threshold):** Hard threshold at 5,000.
      *   *Analysis:* The campaign is designed to hit the threshold, not just ask individuals.
  *   **Step 3 (Pivotality):**
      *   *The 4,999 vs 5,001 Problem:*
          *   At 4,999 pledges, the *campaign's* next pledge is pivotal. The grant funds the *campaign*, so the grant is pivotal if it bridges the gap from 4,900 (current) to 5,000.
          *   At 5,001 pledges, the campaign has succeeded, but the marginal value of *one more* pledge is zero. However, the grant funds the *aggregate push*, not the marginal pledge.
      *   *Risk:* If they reach 4,999, the grant money is "wasted" in terms of outcome (all-or-nothing).
      *   *Procedure Check:* Can they estimate the probability of reaching 5,000? If they say "We're at 4,000, we need 1,000 more," and the grant gets them 500, is that enough?
      *   *Refinement:* The grant must be the *marginal push* that makes 5,000 probable. If they are at 1,000 pledges and need 4,000 more, the probability of success is too low (Step 3 Stop Rule). If they are at 4,500, the grant makes sense.
      *   *Assumption for Verdict:* Let's assume they are at 4,200 and the grant bridges the marketing gap to 5,000.
  *   **Verdict:** **FUND** (Conditional on current pledge count being near threshold).
  *   **Publishable Line:** "This proposal utilizes a verified threshold mechanism where collective action triggers a supply-side price reduction, creating a tangible causal link between pledges and emissions."
  *   **Philosophical Note:** This validates pivotality *only* because the threshold is hard, public, and the campaign is designed to aggregate to that specific number, not just "raise awareness."

  ---

  ### Systematic Misfires (Honesty Check)

  You asked where this procedure will systematically misfire. As a philosopher, I must flag three blind spots:

  1.  **The "Cultural Tipping Point" Blind Spot:** This procedure kills campaigns that aim for slow cultural shifts (e.g., "normalize veganism") because they cannot produce a hard threshold $T$ or a probability $P$ in 45 minutes. You will systematically underfund long-term norm entrepreneurship in favor of short-term mechanistic wins.
  2.  **The "First Mover" Problem:** Step 2 (Thresholds) penalizes campaigns trying to create *new* thresholds. If no supermarket has ever ordered in 100-case units, a campaign trying to force that change will fail the "evidence of threshold" test. You will fund optimization of existing systems, not innovation of new ones.
  3.  **The "Integrity" Gap:** By forcing a choice between Empirical (a) and Expressive (c), you may reject campaigns that are morally valuable for reasons of complicity (b) (e.g., "I won't fund this because it makes us complicit in harm, even if stopping it makes no difference"). The procedure treats complicity as a Board Call, which may slow down necessary moral distancing.

  ### Summary of Decision Logic

  | Step | Focus | Pass Condition | Fail Condition |
  | :--- | :--- | :--- | :--- |
  | **1** | **Mechanism** | Physical chain described. | Vague "awareness" claimed as impact. |
  | **2** | **Threshold** | Specific $T$ identified & matched. | Supply chain absorbs individual acts. |
  | **3** | **Pivotality** | Probability $P$ quantified. | No numbers in 45 mins ($P=0$). |
  | **4** | **Values** | Explicitly Expressive/Normative. | Implicitly Expressive, claimed as Empirical. |
  | **5** | **Consistency** | Matches past precedents. | Contradicts past precedents (arbitrary). |

  **Final Advice:** Print this. Put it in the briefing pack. Tell the GP and the Accountant that Step 3 (The 45-Minute Rule) is their shield: if the philosopher in the room starts talking about "infinite expected value," they just point to the clock and the rule.
