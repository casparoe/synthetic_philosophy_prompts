answer: |-
  **Welfare Impact Protocol (WIP-24)**
  **For Officer Use Only | Time Allocation: 3.5 Hours Max**

  **Purpose:** To determine the Net Welfare Effect (NWE) of habitat conversion on statutory species (vertebrates and decapods).
  **Outcomes:** *Positive* (Officer may approve), *Negative* (Officer may refuse), or *Indeterminate/Value-Contested* (Refer to Committee).
  **Note:** This protocol treats the prevention of a life worth living as a welfare loss, and the prevention of a life of net suffering as a welfare gain. Where evidence is absent, the Precautionary Presumption applies (see Q2).

  ---

  ### The Procedure

  **Q1: Scope and Density (Fact)**
  *Identify statutory species present. Estimate current density (low/med/high) based on habitat quality and survey data.*
  *   **Sufficient Answer:** List of species + density estimate.
  *   **Constraint:** Ignore invertebrates. Note this exclusion in the report as a 'Known Blind Spot'.
  *   **Stop Condition:** If no statutory species are present, NWE is Neutral. Proceed to Officer Decision.

  **Q2: Baseline Welfare Status (Value/Fact Hybrid)**
  *Is the current habitat supporting lives of net positive welfare?*
  *   **Sufficient Answer:** 'Yes' (Healthy population, no evidence of chronic starvation/disease), 'No' (Evidence of suffering exceeds pleasure), or 'Unknown'.
  *   **Protocol:** Apply **Precautionary Presumption**: Assume 'Yes' for wild populations unless there is specific evidence of net suffering (e.g., severe pollution, epidemic).
  *   **Committee Trigger:** If the answer is 'Unknown' and the developer contests the Presumption, refer to Committee. This is a value judgement on the worth of wild life.

  **Q3: Immediate Clearance Impact (Fact)**
  *Will construction cause direct mortality or displacement?*
  *   **Sufficient Answer:** Estimate % of current population killed vs. displaced.
  *   **Accounting:**
      *   **Killed:** 100% welfare loss for those individuals.
      *   **Displaced:** 50% welfare loss (assumed stress/competition in new territory), unless mitigation (translocation) is proven effective (rare).
  *   **Stop Condition:** If >10% of the population is killed and Baseline (Q2) is Positive, NWE is provisionally *Negative*.

  **Q4: Future Population & Horizon (Value/Method)**
  *Calculate welfare of prevented births vs. welfare in the proposed development.*
  *   **Accounting Horizon:** **30 Years.**
      *   *Justification:* Aligns with standard planning permission limits and prevents infinite compounding errors.
      *   *Committee Trigger:* If a stakeholder formally objects to the 30-year cap in favour of a multi-generational or perpetual horizon, refer to Committee. This is a policy choice, not a scientific one.
  *   **Prevented Births:** Estimate annual breeding output × 30 years.
      *   If Baseline (Q2) is Positive: Prevented births = Welfare Loss.
      *   If Baseline (Q2) is Negative: Prevented births = Welfare Gain.
  *   **New Habitat:** Does the proposed development (e.g., solar, housing) support *any* statutory species?
      *   If Yes: Add estimated welfare of new population over 30 years.
      *   If No (e.g., distribution sheds): Welfare = 0.

  **Q5: Aggregation and Uncertainty (Judgement)**
  *Compare Total Loss (Q3 + Prevented Births) vs. Total Gain (New Habitat).*
  *   **Sufficient Answer:** *Net Positive*, *Net Negative*, or *Indeterminate*.
  *   **Committee Trigger:**
      1.  If the magnitude of the loss is large but the Baseline (Q2) relies solely on the Precautionary Presumption without empirical data.
      2.  If the exclusion of invertebrates (Q1) is credibly argued to reverse the conclusion (e.g., massive insect biomass destruction).
      3.  If the trade-off involves comparing different species (e.g., killing many voles to save few badgers). This is a value weighting.

  ---

  ### Application to Current Proposals

  **1. Thirty Hectares Wet Grassland → Distribution Sheds**
  *   **Species:** Common toads, field voles (High density).
  *   **Q1 (Scope):** Statutory species present. High density. Invertebrates excluded.
  *   **Q2 (Baseline):** Presumption 'Yes' (healthy breeding population).
  *   **Q3 (Clearance):** Draining kills amphibians; clearance kills voles. Estimate 80% immediate mortality. **Major Loss.**
  *   **Q4 (Future):** Sheds support zero statutory wildlife. 30 years of prevented breeding calculated. **Major Loss.**
  *   **Q5 (Aggregation):** Massive negative welfare effect. No offsetting gain.
  *   **Verdict:** **Net Negative (Large Magnitude).**
  *   **Route:** Officer Level (Refusal recommended on welfare grounds). The facts are clear enough; no value conflict exists unless one argues wild lives are not worth living.

  **2. Ten Hectares Mature Scrub → Solar Farm**
  *   **Species:** Long-lived territorial bird (e.g., linnet or similar), stable, at carrying capacity.
  *   **Q1 (Scope):** Statutory species present. Low density (territorial).
  *   **Q2 (Baseline):** Presumption 'Yes'.
  *   **Q3 (Clearance):** Clearance kills some adults. **High Cost per Individual** (long-lived, established).
  *   **Q4 (Future):** Solar farms often allow some grassland management beneath panels. Carrying capacity may drop by 50% but not to zero. Prevented births calculated on the 50% reduction over 30 years.
  *   **Q5 (Aggregation):** Loss of adults is significant. Prevented births are significant. Some mitigation possible via management plan.
  *   **Verdict:** **Net Negative (Moderate Magnitude).**
  *   **Route:** Officer Level, *conditional*. If the developer offers a binding management plan that maintains carrying capacity, NWE moves to Neutral. If not, Refusal.
  *   **Caveat:** If the bird species is contested (e.g., pest vs. protected), refer to Committee.

  **3. Sixty Hectares Improved Pasture → Wet Woodland (Restoration)**
  *   **Species:** Pasture (grazing mammals/birds) → Woodland (broader vertebrate mix).
  *   **Q1 (Scope):** Statutory species present in both states.
  *   **Q2 (Baseline):** Pasture welfare is 'Low Positive' (limited cover, intensive management risks). Woodland welfare is 'High Positive' (complex niche, cover).
  *   **Q3 (Clearance):** Minimal. This is restoration, not clearance. Transitional disturbance only.
  *   **Q4 (Future):** Carrying capacity for vertebrates likely increases. Diversity increases. 30-year horizon shows compounding welfare gain.
  *   **Q5 (Aggregation):** Clear gain.
  *   **Verdict:** **Net Positive.**
  *   **Route:** Officer Level (Approval).
  *   **Honesty Check:** This relies on the judgement that woodland welfare > pasture welfare. For most vertebrates, this is robust. However, if the pasture supports a specific high-welfare specialist (e.g., specific grassland nesting bird) that the woodland excludes, this becomes a value trade-off. If such a specialist is identified, **Refer to Committee.**

  ---

  ### Limitations and Honesty Statement (For the Report)

  *This procedure is an administrative heuristic, not a scientific model. It contains three specific areas where judgement is dressed as method:*

  1.  **The 30-Year Horizon:** This is arbitrary. It is chosen to match planning cycles, not biological reality. Effects beyond 30 years are ignored to ensure calculability.
  2.  **The Precautionary Presumption:** We assume wild lives are worth living. If the Committee holds that wild suffering outweighs pleasure, all 'Negative' findings above become 'Positive'. This is a philosophical stance, not a fact.
  3.  **The Taxonomic Cut-off:** By excluding invertebrates, we ignore the majority of sentient biomass. We do this because counting them is impossible within 0.5 days. If an application turns on insect welfare (e.g., destroying a swarm site), the Officer cannot assess it; it must go to Committee.

  **Reporting Instruction:**
  Fill the two-page form. Page 1: Data from Q1–Q4. Page 2: Verdict from Q5 and the Limitations Statement above. If any Committee Trigger is hit, tick the 'Refer to Committee' box and cite the specific Trigger. Do not attempt to quantify welfare in 'utils'; use 'Low/Medium/High' magnitude only.
