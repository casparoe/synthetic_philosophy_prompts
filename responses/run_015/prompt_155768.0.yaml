prompt: |-
  I assess habitat-loss applications for a regional planning authority — around sixty a year, mostly conversion of rough grassland, scrub and wetland to housing, solar arrays and intensive agriculture. Most are decided at officer level, but any application with a contested animal-welfare assessment goes to committee. The remit was recently widened: alongside biodiversity, we must now record the expected effect of the loss on the animals themselves. I have half a day per application, a desk study plus one site visit, no population modelling, and two pages to fill in.

  Please write me a decision procedure my team can run on a proposal to determine whether the net welfare effect of the conversion is positive, negative, or genuinely indeterminate, and — where it is one or the other — roughly how large. Give the questions in the order I should ask them, what counts as a sufficient answer to each, where the procedure stops with a no, and where it hands the decision to the committee because the remaining question is one of values rather than facts. In particular it has to settle how I handle these:

  whether to count only the animals alive on the site when the decision is made, or also the animals whose births the conversion prevents, given that most of the welfare effect of habitat loss seems to run through births rather than deaths;
  what accounting horizon to close the books at, since effects on future population size compound without limit, together with whatever justifies that horizon rather than a longer or shorter one;
  whether the typical life of the animals concerned is one worth living or not, and what I do when the evidence does not settle this;
  the deaths caused by clearance itself and the fate of animals displaced into territories already occupied by others;
  which animals are in the account at all, given that my team counts vertebrates and decapods but not the invertebrates that often make up most of the animal biomass on a site.

  Then run it on three applications: draining thirty hectares of wet grassland supporting a large breeding population of common toads and field voles for distribution sheds; clearing ten hectares of mature scrub for a solar farm, where a small, stable population of a long-lived territorial bird is at carrying capacity and clearance will kill some adults; and a proposal to restore sixty hectares of improved pasture to wet woodland, which everyone in my team expects to approve. The procedure should tell me where it cannot produce a signed number at all, and be honest about which steps are judgement dressed up as method. Please write in British English.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User Role:** Planner assessing habitat-loss applications (approx. 60/year).
      *   **Context:** Regional planning authority. Conversions (grassland/scrub/wetland -> housing/solar/agriculture).
      *   **Constraint:** 0.5 days per application (desk study + 1 site visit), 2-page report limit. No population modelling.
      *   **New Remit:** Must assess *animal welfare* impact (not just biodiversity).
      *   **Trigger:** Contested welfare assessments go to committee.
      *   **Task:** Create a decision procedure (flowchart/questions) to determine Net Welfare Effect (Positive, Negative, Indeterminate) and magnitude.
      *   **Specific Issues to Address:**
          *   Current vs. Future animals (non-identity problem).
          *   Time horizon (compounding effects).
          *   Life worth living (positive/negative welfare baseline).
          *   Clearance deaths vs. displacement.
          *   Scope of animals (vertebrates/decapods vs. invertebrates).
      *   **Output Requirement:** Order of questions, sufficiency criteria, stop points, committee handover points (values vs. facts).
      *   **Test Cases:**
          1.  30ha wet grassland -> distribution sheds (toads/voles).
          2.  10ha mature scrub -> solar farm (territorial bird at carrying capacity).
          3.  60ha improved pasture -> wet woodland (restoration).
      *   **Tone/Style:** British English, honest about judgement vs. method, practical for a busy officer.

  2.  **Deconstruct the Ethical/Methodological Challenges:**
      *   *The Non-Identity Problem:* If we destroy habitat, future animals aren't born. Is preventing a life a harm? Only if the life would have been net negative. If net positive, preventing it is a loss of welfare. *Decision:* Must count prevented births, otherwise habitat loss looks welfare-neutral or positive (by reducing competition/suffering).
      *   *Time Horizon:* Infinite compounding is impossible to calculate. *Decision:* Cap at a standard planning horizon (e.g., 30 years or one generation of the longest-lived key species), acknowledging this is arbitrary but necessary for administrative feasibility.
      *   *Life Worth Living:* Wild animal welfare is debated. Some lives are net negative (suffering > pleasure). *Decision:* Default presumption for wild vertebrates/decapods is "net positive but precarious," unless evidence suggests otherwise (e.g., disease, starvation risk). Uncertainty = Committee.
      *   *Clearance/Displacement:* Immediate death vs. displacement stress/competition. *Decision:* Clearance deaths count as -100% remaining welfare for that individual. Displacement counts as reduced welfare probability.
      *   *Taxonomic Scope:* Invertebrates are too numerous for a 0.5-day assessment. *Decision:* Stick to the statutory remit (vertebrates/decapods) but note the limitation explicitly as a source of indeterminacy.

  3.  **Drafting the Procedure (The "Welfare Impact Protocol" - WIP):**
      *   Need to be efficient. 0.5 days means no complex maths. Needs heuristics.
      *   *Step 1: Scope.* Who counts? (Statutory list).
      *   *Step 2: Baseline.* Is the current life worth living? (Critical value judgement).
      *   *Step 3: The Event.* Clearance mortality vs. displacement.
      *   *Step 4: The Future.* Prevented births vs. new habitat welfare.
      *   *Step 5: Horizon.* Cut-off point.
      *   *Step 6: Aggregation & Uncertainty.* When to pass to committee.

  4.  **Refining the Specific Issues within the Procedure:**
      *   *Births:* Include them. If habitat supports life, removing it prevents that welfare.
      *   *Horizon:* 30 years (standard planning term). Justification: Aligns with planning permission limits and reduces speculative compounding.
      *   *Life Worth Living:* Presumption of positivity for healthy wild populations. If evidence is mixed/unknown -> Committee.
      *   *Clearance:* Count as immediate total welfare loss for those individuals.
      *   *Taxonomy:* Adhere to remit. Acknowledge the blind spot.

  5.  **Developing the Test Cases:**
      *   *Case 1 (Toads/Voles -> Sheds):* High density, short life, high turnover. Prevention of births is the main factor. Sheds offer zero habitat. Net Negative. Large magnitude.
      *   *Case 2 (Birds -> Solar):* Long-lived, territorial, carrying capacity. Clearance kills adults (high cost). Solar might allow some coexistence but reduces carrying capacity. Prevention of future chicks. Net Negative. Magnitude moderate/high due to adult death.
      *   *Case 3 (Pasture -> Woodland):* Restoration. Improved pasture usually low welfare (intensive ag). Woodland higher capacity/welfare. Net Positive. *Wait,* the prompt says "everyone expects to approve." I need to check if the procedure validates this or flags it. Pasture animals (livestock? or wild?) If wild animals in pasture, moving to woodland is usually positive. If livestock are removed, that's a different calculation. Assume wild animals in the context of "habitat-loss applications." Actually, "improved pasture" usually implies grazing. If it's wild animals living there, woodland is generally better. *Correction:* The prompt implies these are habitat-loss applications. Case 3 is *restoration*. So it's a gain. The procedure should confirm Positive.

  6.  **Addressing the "Honesty about Judgement" Requirement:**
      *   I need to explicitly state where the procedure relies on ethical assumptions (e.g., "preventing a happy life is a bad thing") rather than empirical facts.
      *   I need to highlight where the 0.5-day constraint forces simplifications that might be scientifically dubious but administratively necessary.

  7.  **Drafting the Content (Iterative refinement for British English and Tone):**
      *   Use terms like "Officer," "Committee," "Scheme," "Hectares."
      *   Ensure the tone is professional but candid about limitations.
      *   Structure: Introduction -> The Protocol (WIP-24) -> Application to Cases -> Limitations/Commentary.

  8.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is 30 years arbitrary? *Fix:* Admit it is, but justify via planning norms.
