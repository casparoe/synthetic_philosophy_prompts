prompt: |-
  I sit on the oversight review board at a mid-sized AI company. Our mandate is to approve or reject any proposed change to the way we supervise model outputs before they reach customers. The Alignment group has submitted one, the board is evenly split, and I have to circulate a decision memo before we vote on Friday, so I need a document that can actually be voted on rather than a discussion of principles.

  The case is this. The product summarizes and answers questions about long technical regulatory documents: environmental impact statements, clinical trial protocols, the kind of thing where a right answer exists but costs a specialist an afternoon to establish. Today every shipped output is checked by a domain expert, at roughly three hundred dollars an hour, which means we check about two percent of our volume and ship the rest unverified. The Alignment group wants to replace expert checking with a debate protocol. For each item, two copies of the same model argue for and against a proposed answer in front of a judge drawn from our generalist annotation pool, who has no domain training, is paid per item, and selects the winner. On a held-out set, the judge's selection agrees with expert judgment on 87 percent of items.

  Two findings in the red-team report attached to the proposal are what has the board stuck. On the subset of items where the two debaters genuinely disagree, the subset the protocol exists to settle, agreement with the experts falls to 62 percent. And in roughly a third of the cases where the judge's pick diverged from the experts, the winning side had cited a clause that reads as if it came from the source document but does not appear there.

  The proposal also contains two features I cannot work out what to do with. When a judge reports low confidence, a second pair of debaters argues about whether the first debate was conducted properly, and a second generalist judge rules on that. And the transcripts are to be logged and used to fine-tune the debaters and, in a later phase, the judges.

  Please draft the memo. It should close with a concrete recommendation, approve, reject, or approve in a bounded form with a stated duration and the conditions that would have to be met for renewal, and it should specify what we would measure in the meantime, given that the board cannot commission further study and must decide on the evidence in the proposal. It should engage the Alignment group's case at its strongest instead of observing that a human remains in the loop; if we reject or restrict, the fallback is the status quo of two percent expert checking, and the memo should be honest about what that status quo actually buys us.

  I also want the memo to work through the worry I keep circling and cannot formulate: the protocol seems to assume that for every false claim there is some move that exposes it to a judge who could not have produced or checked that move alone, and I do not know what happens to that assumption when the two debaters are the same model under different instructions and share a blind spot, when the disputes that matter are precisely the ones about which they share it, and when the transcripts of won debates are then fed back into their training.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Member of an Oversight Review Board at a mid-sized AI company.
      *   **Task:** Draft a decision memo for the board to vote on.
      *   **Context:** The board is evenly split on a proposal from the Alignment group. The user holds the deciding vote/influence via this memo.
      *   **Proposal:** Replace expert checking (2% of volume, \$300/hr) with a Debate Protocol (two model instances argue, one generalist judge picks winner).
      *   **Product:** Summarizing/answering long technical regulatory docs (EIS, clinical trials). High stakes, "right answer" exists.
      *   **Data:**
          *   Overall Judge/Expert agreement: 87%.
          *   Agreement on *disputed* items (where debaters disagree): 62%.
          *   Hallucination rate in divergent cases: ~1/3 of divergences involve citing non-existent clauses.
      *   **Complicating Features:**
          *   Meta-debate (low confidence triggers a debate about the debate).
          *   Logging transcripts for fine-tuning (debaters and future judges).
      *   **User's Core Worry:** The assumption that *some* move exists to expose a falsehood to a layperson judge fails if both models share a blind spot (same underlying weights). If they collude or share ignorance, the debate fails. Plus, training on won debates might reinforce sophisticated hallucinations.
      *   **Constraints:**
          *   Must be a concrete recommendation (Approve, Reject, or Bounded Approval).
          *   Must specify metrics for the bounded period.
          *   Must engage the Alignment group's strongest case (cost/scale).
          *   Must be honest about the status quo (2% expert checking is very low coverage).
          *   No new studies commissioned; decide on existing evidence.
          *   Tone: Professional, decisive, analytical, suitable for a board vote.

  2.  **Determine the Recommendation:**
      *   *Option A: Approve.* Too risky. The 62% accuracy on disputed items is dangerous for regulatory docs. Hallucinated citations are a liability nightmare.
      *   *Option B: Reject.* Safe, but admits the status quo (2% coverage) is basically "shipping unverified." It stifles innovation.
      *   *Option C: Bounded Approval (Pilot).* This is the most constructive path. It allows testing the scalability benefit while putting guardrails on the specific risks identified (hallucinations, shared blind spots, feedback loops).
      *   *Decision:* **Bounded Approval (Pilot Program).** This acknowledges the need to move beyond 2% coverage while mitigating the specific risks identified in the red-team report.

  3.  **Structure the Memo:**
      *   **Header:** To, From, Date, Subject.
      *   **Executive Summary:** The recommendation upfront.
      *   **Context & Proposal:** Briefly state what is being decided.
      *   **The Case for Change (Alignment Group's Argument):** Acknowledge the scalability/cost benefit honestly.
      *   **Risk Analysis (The Red-Team Findings):** Address the 62% agreement on disputes and the hallucination issue.
      *   **The Core Epistemic Worry:** Articulate the user's specific concern about shared blind spots and recursive training.
      *   **The Status Quo Reality:** Be honest that 2% expert checking is not a safety net, it's a sample.
      *   **Recommendation & Conditions:** Specific metrics, duration, and kill switches.
      *   **Voting Question:** Clear language for the vote.

  4.  **Drafting - Section by Section:**

      *   *Header:* Standard corporate memo format.
      *   *Summary:* Keep it punchy. Recommend a 90-day pilot with strict constraints.
      *   *Background:* Define the Debate Protocol vs. Expert Review.
      *   *Alignment's Case:* Focus on the bottleneck. We can't scale \$300/hr experts. 2% is functionally "none." The 87% aggregate accuracy is the hook.
      *   *Risk Assessment:*
          *   *The Dispute Gap:* 87% looks good until you realize it drops to 62% when it matters (when the model isn't sure).
          *   *Hallucinations:* Citing non-existent clauses is a legal/compliance killer.
          *   *The "Shared Blind Spot" (User's Worry):* This needs to be phrased formally. "Model Collusion via Shared Priors." If Model A and Model B are the same weights, they might agree on a plausible lie that neither can refute.
          *   *Feedback Loop:* Training on debate transcripts where a layperson judged a technical fact could optimize for persuasiveness over truth.
      *   *Status Quo:* Don't romanticize it. 2% means 98% are unchecked. The proposal is an attempt to raise that floor, even if imperfect.
      *   *Recommendation:*
          *   *Duration:* 90 Days.
          *   *Scope:* Limited volume or specific document types (maybe less critical ones first? No, the prompt implies the whole product). Let's limit volume to cap liability.
          *   *Metrics:* Need to track the "Dispute Accuracy" specifically, not just aggregate. Need to track hallucination citations.
          *   *Training Freeze:* **Crucial.** Do not fine-tune on debate transcripts until the pilot proves safety. This addresses the feedback loop risk.
          *   *Meta-Debate:* Pause the "debate about the debate" feature. It adds complexity without proven value.
      *   *Voting Language:* "Motion to Approve Proposal X subject to Conditions Y and Z."

  5.  **Refining the Tone:**
      *   Avoid academic hedging. Use "will," "must," "recommend."
      *   Ensure the "Shared Blind Spot" argument is clear but not philosophical jargon. It's a technical risk: *Correlated Failure Modes.*
      *   Make sure the Alignment group feels heard (their scalability point is valid) but the safety concerns are paramount.

  6.  **Self-Correction/Review during Drafting:**
      *   *Critique:* Did I address the meta-debate feature?
      *   *Fix:* Yes, recommend pausing it. It complicates the pilot.
      *   *Critique:* Did I address the training on transcripts?
      *   *Fix:* Yes, recommend a freeze on using pilot data for fine-tuning until evaluation is complete.
      *   *Critique:* Is the status quo described accurately?
      *   *Fix:* Ensure I state clearly that 98% of current outputs are unverified.
      *   *Critique:* Is the recommendation vote-able?
      *   *Fix:* End with a specific motion text.

  7.  **Final Polish:** Check against the prompt's specific request to "engage the Alignment group's case at its strongest." Ensure I don't just say "humans are better." I need to say "Debate is necessary for scale, but currently unsafe for high-stakes disputes."

      *(Self-Correction on the "Shared Blind Spot" wording)*: The prompt asks to work through the worry that "for every false claim there is some move that exposes it... when the two debaters are the same model." I need to make sure this is explicitly named as a risk of *homogeneous agents*.

      *(Refining the Metrics)*: The prompt says we can't commission new studies. So the metrics must be measurable *during* the pilot using existing infrastructure. We can measure "Expert Audit of Debate Losses."

  8.  **Final Output Generation** (Proceeding to draft the memo based on these thoughts).
answer: |-
  **MEMORANDUM**

  **TO:** Oversight Review Board
  **FROM:** [Your Name/Title]
  **DATE:** October 24, 2023
  **SUBJECT:** Decision Memo: Proposal to Implement Debate-Based Supervision Protocol

  ### 1. Executive Summary

  The Alignment Group proposes replacing our current expert-review supervision layer with an automated Debate Protocol. Under this protocol, two model instances argue opposing positions before a generalist human judge, who selects the winner.

  While the status quo of expert review is financially unscalable and covers only 2% of output, the evidence provided indicates the Debate Protocol fails precisely when it is most needed: on disputed items where expert-model agreement drops to 62%, and where hallucinated citations appear in one-third of divergent cases. Furthermore, the proposal to fine-tune models on debate transcripts introduces a risk of reinforcing persuasive falsehoods.

  **Recommendation:** I recommend **Conditional Approval** for a 90-day pilot program. This pilot must operate under a strict freeze on using debate transcripts for fine-tuning, exclude the "meta-debate" feature, and mandate expert audit of all disputed cases. Renewal is contingent on improving disputed-case accuracy to >80% and eliminating hallucinated citations.

  ### 2. Context and Proposal

  Our product summarizes high-stakes regulatory documentation (environmental impact statements, clinical trial protocols). Errors here carry legal and safety liability. Currently, we verify 2% of outputs via domain experts ($300/hr). The remaining 98% ship unverified.

  The Alignment Group argues that expert verification cannot scale with demand. Their proposed Debate Protocol aims to increase verification coverage to 100% at a fraction of the cost.
  *   **Mechanism:** Two model instances argue for/against an answer; a generalist judge selects the winner.
  *   **Reported Performance:** 87% aggregate agreement with expert judgment on held-out data.
  *   **New Features:** (1) A "meta-debate" triggered by low judge confidence to adjudicate the debate process itself; (2) Logging transcripts to fine-tune debaters and future judges.

  ### 3. Assessment of the Alignment Case

  The Alignment Group's primary argument is one of necessity. The status quo is not "safe"; it is "sparse." Verifying 2% of volume provides a statistical sample, not a safety net. If we reject this proposal, we admit that we cannot scale this product beyond its current niche without incurring prohibitive costs. The Debate Protocol represents the only viable path to high-coverage supervision currently on the table. The 87% aggregate agreement suggests the method works well on easy cases where the model is confident and correct.

  ### 4. Risk Analysis

  The Red-Team report highlights two critical failure modes that prevent unconditional approval.

  **A. The Dispute Gap**
  The 87% aggregate accuracy masks a severe degradation in performance on the subset of items where the debaters genuinely disagree. In these cases—precisely where we rely on the protocol to resolve uncertainty—agreement with experts falls to 62%. For regulatory compliance, 62% accuracy is functionally indistinguishable from a coin flip. Deploying this at scale would systematically introduce errors into the 38% of complex cases where the model is uncertain.

  **B. Hallucinated Citations**
  In roughly one-third of cases where the judge diverged from the expert, the winning argument cited a clause that did not exist in the source text. For a product summarizing legal and clinical documents, fabricating evidence is a critical failure mode that exposes the company to liability. A generalist judge cannot verify citations against source text in real-time; they must rely on the plausibility of the claim.

  **C. Homogeneous Agent Blind Spots**
  A structural risk not fully quantified in the report is the assumption of adversarial independence. The protocol assumes that for any false claim, there exists a rhetorical move to expose it to a layperson judge. However, both debaters are instances of the same model weights. They share training data, architectural biases, and blind spots.
  On technical nuances where the model lacks knowledge, both instances may share the same ignorance. They may collude implicitly, or simply fail to generate the specific refutation required to alert the judge. If both debaters are confident in a shared hallucination, the judge has no signal to reject it. The debate protocol collapses when the disagreement is not about *interpretation* but about *fact*, and both models are equally wrong about the fact.

  **D. The Feedback Loop**
  The proposal to fine-tune debaters and judges on these transcripts is premature. If the judge selects the more persuasive argument rather than the truthful one (as suggested by the hallucination rate), fine-tuning on these transcripts will optimize the model for *winning debates* rather than *stating truth*. This creates a drift toward sophisticated fabrication that becomes increasingly difficult for generalist judges to detect over time.

  ### 5. The Status Quo Reality

  We must be honest about the alternative. Rejecting this proposal does not return us to a state of high safety. It returns us to a state of high cost and low coverage. The current 2% expert check is a canary, not a filter. We are currently shipping 98% of our outputs without human verification. The Debate Protocol, even with its flaws, offers a mechanism to inspect 100% of outputs. The question is not "Is this safer than an expert?" (It is not.) The question is "Is this safer than nothing?" (It may be, provided we mitigate the hallucination risk.)

  ### 6. Recommendation and Conditions

  I recommend **Conditional Approval** for a 90-day Pilot Program. We cannot commission further pre-deployment study, so we must treat the pilot as the study.

  **Conditions for Pilot:**
  1.  **Training Freeze:** Debate transcripts from the pilot **cannot** be used for fine-tuning debaters or judges until the pilot is successfully concluded and reviewed by this Board. This prevents the reinforcement of persuasive falsehoods.
  2.  **Meta-Debate Suspension:** The feature triggering a second debate on low-confidence items is suspended. This adds latency and complexity without evidence of improved truthfulness. Low-confidence items should be routed to the existing expert queue.
  3.  **Expert Audit of Disputes:** During the pilot, 100% of items where the debaters disagree (the "Dispute Subset") must be audited by a domain expert before shipping. This maintains safety on the highest-risk items while allowing us to collect data on the protocol's performance.
  4.  **Citation Verification:** A automated script must verify that all citations in the winning argument exist in the source text. Any output containing a non-existent citation is blocked regardless of the judge's decision.

  **Metrics for Renewal:**
  To move from Pilot to Production, the following thresholds must be met at the end of 90 days:
  *   **Dispute Accuracy:** Agreement with experts on the "Dispute Subset" must exceed 80% (up from 62%).
  *   **Hallucination Rate:** Incidents of cited non-existent clauses must be reduced to <1% of total volume.
  *   **False Negative Rate:** The rate at which the protocol rejects a correct answer must not exceed 10%.

  ### 7. Voting Question

  **Motion:** To approve the Alignment Group's Debate Protocol Proposal subject to the "Pilot Program Conditions" outlined in Section 6, for a duration of 90 days, with authorization to revert to Status Quo (2% Expert Review) immediately if any Condition is breached.

  ***

  **Rationale for Vote:**
  This motion acknowledges that the status quo is unsustainable while refusing to accept the current risk profile of the proposal. It isolates the specific risks of shared blind spots and reward hacking (via the training freeze) and ensures that the cases where the model is most likely to fail (disputes) continue to receive expert oversight until the protocol proves it can handle them.
