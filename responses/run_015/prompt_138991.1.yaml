answer: |-
  ### The Brainstorm

  Before settling, let's clear the table of the usual suspects and look for something that actually bites.

  1.  **Mandatory Voting:** Devlin would love it (civic duty binds the nation); Hart might tolerate it (no direct harm in abstaining). But mandatory voting doesn't necessarily destroy the *good* of voting; a reluctant voter still counts. It's too institutional.
  2.  **Paid vs. Altruistic Blood Donation:** Classic Richard Titmuss territory. Paying crowds out altruism. But this is already well-trodden ground in socio-legal theory, and "harm" is tricky here (patients need blood).
  3.  **The Norm of Apology:** A society without apology is brittle. But the law rarely mandates apology directly, except in restorative justice contexts which are niche.
  4.  **The Practice of Uncompensated Familial Caregiving:** This is the one. It's the bedrock of the "moral fabric" in almost every culture, yet in a modern welfare state, the *absence* of it causes no tangible harm to the dependent.

  ### The Selection: The Norm of Uncompensated Familial Caregiving

  Here is the scenario: An aging parent requires daily assistance. In a traditional society, the adult children provide this. In a modern liberal state, the state provides a professional care service.

  **Why it fits the criteria:**

  *   **(a) The Devlin Condition:** Devlin argued that society is held together by a shared morality, and if that morality disintegrates, society collapses. The norm that "children care for their parents" is a prime candidate for this. It's not just about labor; it's about intergenerational reciprocity, gratitude, and the idea that the family is a unit of mutual obligation rather than a collection of individuals. If this norm decays, we risk a society of atomized strangers where the vulnerable are warehoused and the young feel no debt to the old. Social cohesion rots.
  *   **(b) The Hart Condition:** Hart, following Mill, asks: "Who is harmed?" If the state has a robust welfare system, the parent is fed, washed, and medically attended regardless of the child's choice. The child's decision to opt-out is a "victimless" moral choice. There is no secular, tangible harm to a non-consenting other. Hart's harm principle would shield the child from legal coercion.
  *   **(c) The Twist (The Crowding Out Effect):** This is where the trap springs. Suppose the state, fearing Devlin's "disintegration," passes a **Filial Responsibility Mandate**. It legally requires children to provide X hours of care or face penalties.
      *   **The Result:** The moment the care becomes a legal duty, it ceases to be an act of *filial piety*. It becomes labor compliance. The parent no longer feels loved; they feel like a regulatory burden. The child no longer feels virtue; they feel resentment at state coercion. The very good the law sought to protect—the bond of love and voluntary obligation—is destroyed by the legal enforcement of it. The "good" exists *only* in the freedom to withhold it.

  ### Why the Standard Framework Fails

  **Devlin's Misclassification:**
  Devlin treats morality like mortar: if you have enough of it, the wall stands. He assumes that enforcing the *external behavior* (caring for the parent) preserves the *internal value* (family cohesion). He fails to see that some moral goods are **constitutively voluntary**. You cannot legislate love or duty without transforming it into obedience. By focusing on the *act* rather than the *motivation*, Devlin's framework justifies a law that achieves the physical outcome (the parent is cared for) while incinerating the social good (the family bond). He mistakes compliance for cohesion.

  **Hart's Blind Spot:**
  Hart's harm principle is too thin. It looks for tangible setbacks to interests. In the welfare state scenario, Hart sees no harm: the parent is safe, the child is free. Hart's framework cannot register the **loss of social virtue**. It treats the decay of the caregiving norm as a matter of private morality, irrelevant to the law. But Hart misses that the *aggregate* of these private choices changes the character of the society. A society where no one cares for their parents unless paid or forced is a colder, more brittle place, even if no specific individual is "harmed" in the Millian sense. Hart protects the liberty to be selfish, but he has no vocabulary for the loss of the common good that isn't reducible to individual harm.

  ### The Third Position: The Enabling State

  A third position needs to navigate between Devlin's coercion and Hart's indifference. It must recognize that some goods are **fragile under legal scrutiny**.

  This position would argue for **State Support without State Mandate**. The law should not *require* the child to care for the parent (avoiding the crowding out of love), nor should it fully *replace* the child with state services (avoiding the atrophy of family bonds).

  Instead, the law should **subsidize the capacity to care**. Think tax credits for caregivers, flexible labor laws that allow time off for family care, or respite services that support the family unit rather than replacing it. The state creates the *conditions* under which the moral norm can flourish voluntarily, without turning the norm into a legal command.

  This approach acknowledges Devlin's insight (this norm matters for social health) but accepts Hart's constraint (coercion is dangerous). It adds a new category: **Legal Facilitation of Virtue.** The law's job isn't to command the good, but to remove the obstacles that make the good impossible, leaving the moral choice free enough to remain meaningful. It treats the family not as a private fiefdom (Hart) nor as a public utility (Devlin), but as a semi-autonomous moral sphere that the state must nourish but never occupy.
