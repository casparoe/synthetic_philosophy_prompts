  ### Decision Tree: Conceivability and Possibility

  **Starting Commitment:** You accept that there are *a posteriori* necessities (e.g., Water = H₂O is necessary), but you also accept that we can *conceive* of scenarios where these necessities fail (e.g., Water $\neq$ H₂O).

  ---

  #### **Node 1: The Modal Import**
  **Question:** When you conceive of a scenario like Water $\neq$ H₂O, does this mental act provide evidence for *any* kind of objective possibility (either epistemic or metaphysical), or is it merely a report on your own psychological state with no modal significance?

  *   **No modal significance:** Go to **Leaf A**.
  *   **Evidence for possibility:** Go to **Node 2**.

  #### **Node 2: The Modal Target**
  **Question:** Does the conceivability of Water $\neq$ H₂O indicate that such a world is *metaphysically possible* (a genuine way the world could be), or does it indicate only that the scenario is *epistemically possible* (consistent with everything we currently know)?

  *   **Only Epistemically Possible:** Go to **Leaf B**.
  *   **Metaphysically Possible (in some sense):** Go to **Node 3**.

  #### **Node 3: The Conceiver's Capacity**
  **Question:** For conceivability to guarantee metaphysical possibility, is it sufficient that *actual humans* find no contradiction (negative conceivability), or must the scenario be constructed by an *idealized reasoner* who forms a coherent positive model (positive conceivability)?

  *   **Actual Humans / No Contradiction:** Go to **Leaf C**.
  *   **Idealized Reasoner / Positive Model:** Go to **Node 4**.

  #### **Node 4: The Scope of the Link**
  **Question:** Does this idealized conceivability imply metaphysical possibility *only for a priori truths* (like math or logic), or does it extend even to *a posteriori truths* (like the identity of water)?

  *   **Only A Priori Truths:** Go to **Leaf D**.
  *   **Extends to A Posteriori Truths:** Go to **Node 5**.

  #### **Node 5: The Mechanism of Accommodation**
  **Question:** Since Water = H₂O is necessary, how do we explain that an ideal conceiver can still conceive Water $\neq$ H₂O as a metaphysical possibility? Is it because modal claims are *context-sensitive* (reference shifts), or because there are *two distinct dimensions* of meaning and possibility?

  *   **Context-Sensitive (Reference Shifts):** Go to **Leaf E**.
  *   **Two Distinct Dimensions:** Go to **Leaf F**.

  ---

  ### **The Leaves**

  **Leaf A: The Deflationary No-Link View**
  *   **Position:** Conceivability is psychologically arbitrary and not a guide to any kind of possibility.
  *   **Awkward Commitment:** You must bite the bullet that our strong intuition that zombies are possible is merely a cognitive illusion with no weight in ontological arguments.

  **Leaf B: The Kripkean View**
  *   **Position:** Conceivability tracks epistemic possibility only; a posteriori necessities block the path to metaphysical possibility.
  *   **Awkward Commitment:** You must accept that we can clearly conceive of impossible states of affairs (like Water $\neq$ H₂O) without accessing any genuine possible world.

  **Leaf C: The Naive Realist (Unnamed/Empty)**
  *   **Position:** Actual human negative conceivability tracks metaphysical possibility directly.
  *   **Status:** **Logical Space Empty.**
  *   **Reason:** This position is incoherent given the starting commitment; it forces you to deny that Water = H₂O is necessary, contradicting the seminar's baseline.

  **Leaf D: The Strict A Priori Rationalist**
  *   **Position:** The conceivability-possibility link is respectable but restricted to a priori conceivability only.
  *   **Awkward Commitment:** You must concede that conceivability arguments can never establish modal facts about the natural world, only about logic and mathematics.

  **Leaf E: The Lewisian Variant**
  *   **Position:** Conceivability tracks metaphysical possibility via counterpart theory and contextual semantics; "Water" refers to different substances in different contexts of evaluation.
  *   **Awkward Commitment:** You must accept that the sentence "Water might not have been H₂O" is true only if we change the context so that 'water' no longer refers to actual water.

  **Leaf F: The Chalmersian Two-Dimensional View**
  *   **Position:** Idealized positive conceivability tracks metaphysical possibility via a primary intension, distinct from the secondary intension that governs a posteriori necessity.
  *   **Awkward Commitment:** You must defend the existence of 'primary possibility' as a genuine modal category that is not captured by standard Kripkean metaphysical necessity.

  ---

  ### **Notes on Logical Space**

  **Indistinguishable Leaves:**
  *   There are no indistinguishable leaves in this tree; each represents a distinct commitment regarding the *source*, *scope*, or *mechanism* of the modal link. However, **Leaf D (Strict A Priori)** and **Leaf B (Kripkean)** are close neighbors. Both deny that conceivability of Water $\neq$ H₂O yields metaphysical possibility. They are separated here by whether conceivability retains *any* metaphysical force (Leaf D says yes, for a priori cases; Leaf B says no, it is purely epistemic).

  **Empty/Unexplored Space:**
  *   **Leaf C** is marked as empty. This corresponds to the position that *non-idealized negative conceivability implies metaphysical possibility*. This space is empty because the existence of a posteriori necessities (our starting commitment) logically falsifies this view: we can negatively conceive Water $\neq$ H₂O, but it is not metaphysically possible.
  *   **Unnamed Position (Idealized Negative):** There is a small logical space between Node 3 and Node 4 for a view that requires *Idealization* but relies on *Negative Conceivability* (absence of contradiction) rather than Positive Conceivability (coherent model). This is often occupied by traditional Rationalists (like Descartes or Leibniz) but is rarely defended in contemporary philosophy of mind because positive conceivability is thought to be a stronger guard against hidden a posteriori contradictions. I have routed this path toward **Leaf D** for simplicity, but it could be split if you wish to distinguish Cartesian Rationalism from modern Strict A Priori views.
