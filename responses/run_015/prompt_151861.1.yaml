answer: |-
  Section One: Agreed Claims

  1. Scientists sometimes increase confidence in a theory because it entails evidence already known to be true.
  2. The old-evidence puzzle is the difficulty formal models face in assigning positive confirmation to evidence that was certain before the theory arrived.
  3. We distinguish acquaintance with evidence from use of that evidence in constructing the theory.
  4. We distinguish cases where evidence had a prior explanation from cases where it did not.
  5. We agree that scientists plainly do get confidence boosts from entailing known anomalies in the planetary case described.
  6. Confirmation theory is in the business of describing changes in an agent's credal state rather than merely static relations between propositions.
  7. Learning a logical connection between a theory and acquainted evidence can constitute new information for the inquirer.
  8. Explanatory unification involves deriving anomalies without bolting on auxiliary devices specific to those anomalies.
  9. Neither acquaintance alone nor use alone settles whether confirmation occurs in every possible case.
  10. Progress requires distinguishing whether confirmation flows from the evidence itself, from replacement of prior commitments, or from the structural relation between theory and evidence.

  Section Two: Residual Disagreements

  | Crux | Party A Position | Party B Position | Bearing Case | Party A Prediction | Party B Prediction |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | Mechanism and Strength | Confirmation occurs via connection learning; strength equals novelty; tracked by posterior probability. | Confirmation occurs via unification; strength exceeds novelty; tracked by unification score. | Alpha: acquainted but unused and had no prior explanation. | Data will show probability update on connection. | Data will show high unification score. |
  | Mechanism and Strength | Confirmation occurs but is diminished; strength less than novelty; tracked by posterior probability. | Confirmation does not occur; use precludes confirmation; tracked by zero unification gain. | Beta: acquainted and used in construction. | Data will show diminished probability update. | Data will show no unification gain. |
  | Mechanism and Strength | Confirmation occurs via replacement; strength exceeds novelty; tracked by posterior probability. | Confirmation occurs via rivalry defeat; strength exceeds novelty; tracked by unification score. | Gamma: acquainted, unused, and already explained by a rival theory that the new theory also explains but with different commitments. | Data will show probability shift to new theory. | Data will show unification favors new theory over rival. |

  Section Three: Verbal and Genuine Disputes

  Much disagreement stems from Party A defining learning to include logical connections in enlarged languages, while Party B defines explanation to exclude probabilistic bolting. If connection is stipulated to carry probability, Party A wins by definition; if unification is stipulated to be non-probabilistic, Party B wins by definition. We flag these definitions as potential sources of verbal dispute rather than substantive divergence, noting that neither side may win by stipulation regarding the core mechanisms of confirmation.

  Both agree that a formal model capable of handling Case Gamma without ad hoc adjustments would move the debate. Specifically, demonstrating whether the confidence boost in Gamma derives from the falsification of the rival's auxiliary or the new theory's structural derivation would constitute genuine progress, even if neither expects the other to concede their primary framework. We commit to testing these predictions against the specified cases before the final review.
