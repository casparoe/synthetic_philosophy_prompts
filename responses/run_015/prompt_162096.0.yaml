answer: |-
  This is a magnificent problem to have. You are standing exactly where the most interesting constitutional theory happens: the collision between high moral principle and the gritty mechanics of legal text. Your father-in-law (FIL) and sister-in-law (SIL) are both capturing a piece of Douglass, but neither has the whole picture because they are trying to force him into boxes (Originalism vs. Living Constitutionalism) that didn't exist in his time.

  Douglass is not a modern Originalist, and he is not a modern Living Constitutionalist. He is something else entirely. I will argue that he is a **Natural Law Textualist**. He believes the text of the Constitution is fixed, but that it must be read through the lens of universal moral truth (Natural Law), not through the secret intentions of the men who wrote it or the bad habits of the society that inherited it.

  Here is the breakdown of how he would handle your three modern scenarios, followed by the "Conscription" debate, and finally, a ranking of what matters most.

  ### 1. The "History and Tradition" Test (Unenumerated Rights)
  *The Scenario:* Courts say a right only exists if it is "deeply rooted in the nation's history and tradition."
  *Douglass's Verdict:* **He would reject this utterly.**

  This is the easiest place to start. For Douglass, "history and tradition" is exactly the problem. The history of the United States includes slavery, the Fugitive Slave Act, and the Black Codes. If you ask "what is deeply rooted in American tradition," the answer is racial hierarchy.

  Douglass distinguishes sharply between the **practices of the people** and the **principles of the document**. He would argue that the 14th Amendment was a *break* from history and tradition, not a continuation of it. It was a "new departure." To use tradition to limit the rights granted by the 14th Amendment is to let the past (slavery) veto the future (liberty).

  *   **Speculation vs. Commitment:** It is a matter of record (commitment) that Douglass argued rights come from "nature" and "God," not from the government or history. It is speculation (though strong) that he would see the "history and tradition" test as a trap designed to preserve white supremacy under a neutral label.
  *   **Does this collapse into Living Constitutionalism?** No. A Living Constitutionalist says the meaning *changes* over time. Douglass would say the meaning was *always* liberty, but we were too blind to see it. He wouldn't say "rights evolve"; he would say "we are finally uncovering the rights that were always there."

  ### 2. Congressional Power vs. Modern Federal Overreach
  *The Scenario:* Douglass wanted strong federal power to protect freed people. Today, federal power is used for mass incarceration and surveillance. Does he still support strong federal power?
  *Douglass's Verdict:* **He would support the Power, but demand a Moral Audit of its Use.**

  Douglass was a nationalist regarding civil rights. He famously said, "I am a man, and I claim all that belongs to a man." He believed the federal government was the "natural guardian" of the freedmen because the states were the aggressors. He would not accept "States' Rights" arguments that clip Congress's power to enforce the 14th Amendment (like the *Civil Rights Cases* of 1883, which he hated).

  However, Douglass was not a statist. He didn't love government power for its own sake; he loved it as a shield for the vulnerable.

  *   **The Nuance:** If federal power is used to oppress (mass incarceration), Douglass would not say, "Well, we need to limit federal power." He would say, "We need to seize federal power and direct it toward justice." He would likely view the current use of federal power as a corruption of the Reconstruction mandate.
  *   **Speculation:** It is hard to know if he would support *procedural* limits on federal power (like "proportionality") if those limits stopped civil rights enforcement. My guess is no. He prioritized *substantive justice* over *procedural federalism*. If the federal government is doing bad things, the solution is democracy and moral pressure, not crippling the government's ability to do good things.

  ### 3. Knowing the Framers (Original Intent)
  *The Scenario:* Douglass knew the men who wrote the 14th Amendment. Does that make him an Original Intentionalist?
  *Douglass's Verdict:* **He would be deeply suspicious of "Intent."**

  This is the strongest evidence against your FIL's Originalism. Douglass explicitly argued that we should not look at the "secret motives" of the framers. In his great speech *The Constitution of the United States: Is It Pro-Slavery or Anti-Slavery?* (1860), he argues that the Constitution is a public document. It belongs to the people, not the drafters.

  He knew the framers compromised. He knew many of them were racist. But he argued that the *text* they produced, if read plainly without the pro-slavery gloss, pledged liberty. He would say asking "what did John Bingham intend?" is the wrong question. The right question is "what does the text promise to the citizen?"

  *   **Commitment:** Douglass wrote extensively that the Constitution must be interpreted according to the "rules of legal interpretation" which favor liberty. He explicitly rejected looking at the "spirit of the age" in which it was written if that spirit was unjust.
  *   **Verdict:** This kills the FIL's argument. Douglass cares about the *text*, but not the *intent*.

  ---

  ### (a) & (b) Discovery vs. Conscription
  This is the heart of your family debate.

  **Your FIL (Discovery):** Douglass looked harder and found the *real* original meaning.
  **You (Conscription):** Douglass seized the text strategically because he needed it on his side.

  **The Douglass Reality:** It is neither. It is **Reclamation.**

  Here is why "Conscription" is too cynical: Douglass genuinely believed that a document claiming to "secure the Blessings of Liberty" *could not* legally authorize slavery. He argued that slavery was a "state institution" and the federal Constitution only dealt with federal matters. He didn't just *say* this to win; he built a complex legal theory around it. If he thought it was a lie, he undermined his own moral authority. He needed the Constitution to be *actually* good, not just *usefully* good.

  Here is why "Discovery" is too naive: Douglass admitted that the Constitution had been "hijacked" by slaveholders for 60 years. He didn't think he was finding a meaning no one had ever seen; he thought he was *cleaning* the document of the dirt the slave power had thrown on it.

  **Would he accept "My side should be shameless"?**
  **No.** This is load-bearing for Douglass. He argues that the abolitionists must be more faithful to the Constitution than the slaveholders. He says, in effect, "They are violating the Constitution; we are upholding it." If he admits he is just twisting the text for power (Conscription), he admits the slaveholders were right that the text is flexible. He needs the text to be stable and on the side of Justice.

  **The Verdict on (a) & (b):**
  Your FIL is right that Douglass thought he was reading the text correctly (not changing it).
  You are right that it was a strategic move to capture the ground.
  But Douglass would say: "It is only a valid strategy *because* it is the truth." He would reject the idea that you can bend the text however you want. You must bend it toward Liberty, because Liberty is the only direction the text allows.

  ---

  ### Ranking the Considerations
  You asked to rank these from "Settles the Question" to "Merely Awkward."

  **1. LOAD BEARING: The Natural Law Premise.**
  Douglass believes rights exist *before* the Constitution. The Constitution recognizes them; it does not create them.
  *   *Why it settles it:* Modern Originalism often assumes the text creates the rights. Douglass assumes the text acknowledges pre-existing rights. This makes him incompatible with strict Originalism (which limits rights to what was understood in 1868) and incompatible with pure Living Constitutionalism (which suggests rights evolve). For Douglass, Rights are static and universal; our *recognition* of them evolves.
  *   *Impact:* This destroys the "History and Tradition" test (Q1). Tradition cannot override Natural Right.

  **2. LOAD BEARING: Rejection of "Secret Intent."**
  Douglass explicitly argues against looking at the private motives of the framers.
  *   *Why it settles it:* This directly contradicts your FIL's Originalism. If Douglass were alive, he would tell the Federalist Society: "Do not ask me what the framers thought in their hearts. Ask me what the words say on the page."
  *   *Impact:* This validates the SIL's suspicion that "Original Intent" is a retrofit, but validates the FIL's sense that Douglass cared deeply about the Text.

  **3. AWKWARD FOR FIL: The "Conscription" Element.**
  Douglass admitted his 1851 reversal was partly because the Garrisonian view (burn the Constitution) was a political dead end.
  *   *Why it's awkward:* It shows Douglass was a pragmatist. He chose the interpretation that *worked* for freedom. An Originalist claims to follow the meaning regardless of the outcome. Douglass followed the meaning that produced Liberty.
  *   *Impact:* It suggests Douglass's "Originalism" is results-oriented.

  **4. AWKWARD FOR SIL: The Fixed Text.**
  Douglass did not believe the Constitution's meaning *changed*. He believed our *application* of it improved.
  *   *Why it's awkward:* A Living Constitutionalist often argues the meaning shifts with the times. Douglass argued the meaning was always Liberty, we were just blind.
  *   *Impact:* He is more textualist than the SIL gives him credit for.

  ---

  ### How to Explain This to a 12-Year-Old
  You need to simplify the "Natural Law Textualist" concept without losing the truth. Here is the script:

  **The Setup:**
  "Imagine the Constitution is a Rulebook for a game.
  Grandpa (FIL) says: 'We have to play the game exactly like the guys who wrote the Rulebook played it in 1868. If they didn't think a move was allowed, we can't do it.'
  Auntie (SIL) says: 'The Rulebook is old. We have to change the rules to make sure the game is fair for everyone today.'
  Douglass says: 'The Rulebook was written perfectly. It says right on the cover: *This Game is for Liberty.* The problem is, for a long time, the players were cheating. They were using the Rulebook to hurt people. Douglass says we don't need to change the Rulebook (Auntie), and we don't need to play like the cheaters did (Grandpa). We just need to finally play the game the way the Rulebook actually says.'"

  **On the "History and Tradition" Question:**
  "If the Rulebook says 'Everyone gets to play,' but for 100 years we only let men play, Grandpa might say, 'Well, tradition says only men play.' Douglass would say, 'No! The Rulebook says *Everyone*. The tradition was wrong, the Rulebook is right.'"

  **On the "Conscription" Question:**
  "Did Douglass trick everyone? No. He realized that if he read the Rulebook out loud, clearly, it sounded like it supported freedom. He didn't change the words. He just stopped letting the bullies interpret them for him."

  ### Final Advice for Your Project
  Your FIL is technically closer on the *method* (Douglass looked at the text), but wrong on the *philosophy* (Douglass rejected original intent). Your SIL is closer on the *outcome* (Douglass wanted moral justice), but wrong on the *mechanism* (Douglass didn't think the text changed).

  If you have to take a side for the project: **Douglass is a Textualist who reads the text through the lens of Justice.**

  If your daughter asks, "Was he an Originalist?" The answer is: "He believed the Original Meaning was Liberty, but he didn't care what the Original Framers secretly thought." That distinction is the key. It allows her to show she understands the nuance without getting bogged down in the adult fighting.

  You are not in over your head; you are just in the deep end where the water is supposed to be. Douglass would tell you that wrestling with these questions is the price of citizenship.
