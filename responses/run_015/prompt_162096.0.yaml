      *   *Tone Check:* Keep it philosophical but accessible. Avoid legalese where possible.
      *   *Key Insight:* Douglass isn't a modern Originalist or a modern Living Constitutionalist. He is a *Natural Law Textualist*. He believes the text encodes universal moral truths.
      *   *Refining the "Conscription" point:* This is the hardest part. I need to be careful not to accuse Douglass of dishonesty. He was a pragmatist, but his pragmatism was rooted in moral conviction. The "Conscription" label is too cynical, but the "Discovery" label is too naive. It's "Reclamation."
