  7.  **Self-Correction during drafting:** I initially thought about saying Douglass is a Living Constitutionalist. But that implies the meaning *changes*. Douglass thought the meaning was *always* liberty, we just failed to see it. So he's closer to Original Public Meaning *if* "Public" includes moral context. I need to make sure I don't just side with the SIL. The FIL has a point about the text, but wrong about the *method*.
