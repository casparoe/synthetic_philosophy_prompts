answer: |-
  Here is a refined framework for archaeological inference, designed to handle the specific tensions in your verdicts, followed by the application to new cases and a critique of your original ten.

  ### The Principle of Non-Utilitarian Constraint

  To infer a belief (internalized norm/cosmology) or an institution (coordinated expectation), a material pattern $P$ must satisfy three conditions. This principle replaces your "Double-Difference" with **Functional Eliminability** and your "Friction" with **Costly Redundancy**.

  **Clause 1: Functional Eliminability**
  $P$ must be improbable under a null hypothesis of individual utility maximization or supply-chain efficiency.
  *   *Motivation:* **Case 1 vs. Case 2.** In Case 1 (grinding stones), the pattern is efficient for household subsistence; no social inference is needed. In Case 2 (seals), the pattern (empty rooms, specific motifs) serves no immediate caloric or storage utility; it is functionally redundant, licensing a social inference.
  *   *Motivation:* **Case 3 vs. Case 10.** In Case 3 (seeds), cooking is a plausible functional driver. In Case 10 (limbs), the lack of butchery marks and food value eliminates the functional driver, forcing a symbolic inference.

  **Clause 2: Costly Redundancy**
  $P$ must demonstrate an investment of labor, resources, or opportunity that is not recovered in material utility.
  *   *Motivation:* **Case 4 (Feasting).** Your friction clause failed here because feasting shows no enforcement. However, feasting is *expensive* and *coordinated*. The cost signals the institution.
  *   *Motivation:* **Case 5 (Foundations).** Sealing vessels under a floor is a permanent loss of assets. This cost, borne without audience, signals a normative commitment.

  **Clause 3: Locus of Constraint**
  The nature of the inference depends on the visibility and coordination required to sustain $P$.
  *   **Institution:** $P$ requires interpersonal synchronization (my action depends on your action).
      *   *Motivation:* **Case 2 (Quarters)** and **Case 4 (Feasting).** The seal motifs require agreement on what the motifs mean; the feasting requires guests and hosts to coordinate roles.
  *   **Belief/Norm:** $P$ is sustained even when unobserved or when coordination is impossible (intrapersonal constraint).
      *   *Motivation:* **Case 5 (Foundations).** The vessels are sealed; no one sees them. The constraint is internal/cosmological.
  *   **Status/Display (Suspension of Belief):** $P$ is public and costly, but could be driven by competition rather than shared rule.
      *   *Motivation:* **Case 6 (Graves).** Public uniformity can be mimicked by fashion or supply (potters' kits). Without evidence of *hidden* cost (like Case 5) or *coordination* (like Case 2), belief is suspended.

  **Clause 4: Causal Independence (for Convergence)**
  When multiple lines of evidence support $P$, they must be causally independent regarding potential sources of error.
  *   *Motivation:* **Case 8.** Convergence boosts confidence only if the lines (isotopes, faunal, etc.) do not share a hidden bias (e.g., all derived from the same depositional context).

  ---

  ### Belief vs. Institution: The Friction Replacement

  You asked if beliefs and institutions need different conditions. **Yes.**
  Your **Friction Clause** (enforcement/sanction) is too narrow. It assumes institutions are primarily coercive. However, institutions are also *constitutive* (e.g., feasting, marriage, currency).

  *   **Replacement:** The **Locus of Constraint** (Clause 3) does the work.
  *   **Institutions** are inferred when the cost is borne to solve a *coordination problem* (Case 2, 4).
  *   **Beliefs** are inferred when the cost is borne to satisfy an *internalized rule* despite a lack of audience or coordination benefit (Case 5).
  *   **Friction** (enforcement) is merely one *type* of evidence for an institution, not a necessary condition. Case 4 proves this: feasting establishes authority without visible sanction.

  ---

  ### Application to New Cases

  **1. Deliberate Breakage (River Deposition)**
  *   **Pattern:** Hundreds of metal objects, broken identically, deposited in a river over centuries. No other refuse.
  *   **Analysis:**
      *   *Functional Eliminability:* High. Metal is valuable; breaking and losing it is materially inefficient.
      *   *Costly Redundancy:* High. Destruction of wealth is a significant cost.
      *   *Locus of Constraint:* Hidden/Deposited. Once in the river, there is no audience. This is not status display. It requires synchronization over centuries (tradition).
  *   **Verdict:** **Infer a Ritual Norm/Belief.** This is a "votive" pattern. The cost is borne to satisfy a cosmological rule, not a social audience. It aligns with Case 5 (Foundations) but with higher material cost.

  **2. Discontinuity (Influx of Non-Locals)**
  *   **Pattern:** Pattern $P$ holds for Phases 1–2, disappears exactly at Phase 3 (isotopic influx).
  *   **Analysis:**
      *   *Functional Eliminability:* If $P$ were functional (e.g., storage), the new population would likely adopt it unless they brought superior tech. Its disappearance suggests it was cultural, not functional.
      *   *Locus of Constraint:* The correlation with population suggests $P$ was tied to *group identity* rather than environmental constraint.
  *   **Verdict:** **Infer $P$ was an Ethnic or Cultural Marker (Institution/Belief complex).** The discontinuity confirms $P$ was not an environmental adaptation (which would persist) but a social rule carried by the specific group that left.

  **3. Reflexive Case (Lawn Signs)**
  *   **Pattern:** Seasonal signs, recurring colors, door-knocking paraphernalia.
  *   **Analysis:**
      *   *Functional Eliminability:* Signs have no shelter/utility function.
      *   *Costly Redundancy:* Low cost, but coordinated.
      *   *Locus of Constraint:* Public and Interpersonal. The signs signal affiliation to neighbors and visitors.
  *   **Verdict:** **Infer a Competitive Electoral Institution.** However, a future archaeologist might misidentify the *parties* as *religions* (colors/rituals). The principle licenses "Institution," but warns that without textual context (Case 9), the *specific ontology* (politics vs. religion) is vulnerable to misclassification.

  ---

  ### Critique of Your Ten Verdicts

  **Which verdict does my principle not accommodate?**
  **Case 9 (Textual Analogy).**
  My principle is strictly materialist and structural. It evaluates the internal logic of the pattern $P$. Case 9 relies on *external corroboration* (a text from a millennium later). While logically sound as a Bayesian prior booster, it falls outside the *inference from remains* principle. My principle cannot calculate the weight of a textual analogy; it requires a separate hermeneutic rule regarding continuity and language drift.

  **Which verdict would I overturn first?**
  **Case 3 (The Seeds).**
  *   *Your Verdict:* Decline to infer shared belief/festival. Conformity/imitation/cooking could explain it.
  *   *My Overturn:* **Infer a Normative Rule (Recipe or Ritual).**
  *   *Reasoning:* You state the proportions are "very nearly the same, in nearly every house." Functional cooking *never* produces statistically identical proportions of four species across a whole settlement. That level of standardization implies a "Recipe." A Recipe is a Norm. Whether that norm is "how to cook" or "how to offer" is debatable, but refusing to infer *any* shared belief/norm is too skeptical. The regularity outruns individual utility maximization (Clause 1). If everyone cooks differently, you get variance. If everyone cooks the *same*, you have a rule.

  **Secondary Overturn Consideration (Case 6):**
  I would also challenge your refusal in Case 6 (Graves). If the *arrangement* is identical, a "potters' kit" explains the *vessels*, but not the *placement*. However, Case 3 is the stronger candidate for overturning because "cooking" is a weaker explanation for statistical uniformity than "mass production" is for grave goods.

  ### Summary of Changes to Your Framework
  1.  **Drop "Friction":** It excludes constitutive institutions (feasting). Replace with **Costly Redundancy**.
  2.  **Split "Double-Difference":** Separate **Functional Eliminability** (is it useful?) from **Locus of Constraint** (is it public or private?). This solves Case 5 vs. 6.
  3.  **Add "Causal Independence":** This formalizes why Case 8 works (convergence) without falling into correlated error.
