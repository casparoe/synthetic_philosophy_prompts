answer: |-
  **PHIL 340: Seminar on Well-Being and Value**
  **Final Examination**

  **Essay Prompt**

  The heterogeneity problem challenges hedonism by arguing that pleasures share no common phenomenological quality; the feeling of eating cake is too distinct from solving a math problem to constitute a single natural kind. Consider a sophisticated defender of hedonism who responds to this by arguing that all pleasures share not a felt quality, but a **sub-personal valuation stamp**. On this view, pleasure is a functional marker that tags experiences as "to-be-pursued" without being phenomenally accessible to the subject.

  Write an essay addressing the following:
  1.  Does this functionalist move save hedonism, or does it secretly collapse the theory into desire-satisfactionism?
  2.  Evaluate the objection that if the shared element of pleasure is not available to consciousness, hedonism abandons its intuitive appeal as a theory of *felt* well-being and becomes an externalist view.

  Conclude with a verdict on whether a hedonism reliant on sub-personal markers remains recognizable as hedonism.

  ***

  **Model Answer**

  The heterogeneity problem threatens hedonism by denying that pleasure is a uniform sensation. If pleasures share no common feel, it is unclear why they alone constitute well-being. The proposed defense—that pleasures share a sub-personal valuation stamp rather than a phenomenological quality—attempts to secure the unity of pleasure without relying on introspection. However, this move faces two fatal objections: it collapses hedonism into desire-satisfactionism and violates the internalist intuition central to hedonistic theories.

  First, defining pleasure via a functional marker tags experiences as "to-be-pursued." This description is functionally indistinguishable from the object of a pro-attitude. Desire-satisfactionism argues that well-being consists in satisfying desires regardless of the felt quality of the experience. If the "pleasure stamp" is simply a sub-personal signal indicating pursuit-worthiness, then having pleasure becomes equivalent to having a desire satisfied at a neurological level. The hedonist must argue that the stamp is distinct from the desire itself—perhaps that the stamp causes the desire, rather than being constituted by it. However, if the stamp is inaccessible to consciousness, the subject cannot distinguish between having the stamp and merely having a desire. Consequently, the theory loses its distinctive claim that *feeling* good is what matters, shifting instead to the functional status of the experience. This collapses the view into a hybrid desire theory, abandoning pure hedonism.

  Second, and more critically, this move sacrifices hedonism's primary intuitive advantage: its commitment to internalism. Hedonism is attractive because it aligns well-being with how life feels from the inside. The "resonance constraint" suggests that for something to benefit a person, it must resonate with their subjective experience. If the valuation stamp is sub-personal and phenomenally inaccessible, a subject could theoretically possess the "pleasure" stamp while feeling miserable or indifferent. For example, a depressed individual might have neural markers tagging experiences as "to-be-pursued" without feeling any enjoyment. Under this functionalist hedonism, such a person would be experiencing high well-being despite their suffering. This renders the theory externalist; well-being becomes a fact about the brain's functional architecture rather than the subject's conscious life. While this might solve the heterogeneity problem technically, it severs the link between well-being and experience that defines hedonism.

  Furthermore, if the marker is not felt, it cannot explain why we value pleasure. We value pleasure because it feels good. If the "goodness" is hidden in sub-personal processing, it is unclear why rational agents should care about maximizing it. A theory of well-being must explain why something is good *for the subject*. A sub-personal stamp is good for the organism's evolutionary fitness, perhaps, but not necessarily for the subject's welfare as experienced.

  In conclusion, the sub-personal valuation stamp saves the unity of pleasure only by sacrificing the soul of hedonism. It avoids the heterogeneity problem by redefining pleasure as a functional role, but this redefinition collapses the theory into desire-satisfactionism and violates the internalist constraint. A hedonism that denies pleasure is felt is no longer hedonism; it is a functionalist theory of value mislabeled. Therefore, this move fails to preserve hedonism as a viable theory of well-being.

  ***

  **Marking Scheme (20 Marks Total)**

  **1. Reconstruction of the Functional Marker Proposal (4 Marks)**
  *   **Criteria:** Clearly explains the shift from phenomenological unity to sub-personal functional tagging ("to-be-pursued").
  *   **A-to-B Drop Error:** Conflating the heterogeneity problem with the false-pleasure problem (e.g., discussing deception instead of qualitative diversity) or failing to define the "stamp" as non-phenomenal.

  **2. Analysis of the Desire-Satisfactionism Collapse (4 Marks)**
  *   **Criteria:** Argues that tagging experiences as "to-be-pursued" is functionally equivalent to satisfying a pro-attitude/desire.
  *   **A-to-B Drop Error:** Asserting that pleasure and desire are obviously distinct without addressing the functional overlap introduced by the "valuation stamp" framing.

  **3. Evaluation of the Phenomenological/Externalist Objection (4 Marks)**
  *   **Criteria:** Identifies that removing consciousness from the value-maker turns well-being into an externalist fact (brain state vs. felt experience).
  *   **A-to-B Drop Error:** Ignoring the internalist/externalist distinction or failing to explain why inaccessible states undermine *felt* well-being.

  **4. Application of the Resonance/Experience Constraint (4 Marks)**
  *   **Criteria:** Discusses why subjects value pleasure (because it feels good) and how sub-personal markers fail to resonate with the subject's perspective.
  *   **A-to-B Drop Error:** Accepting the functional-marker move without addressing why a subject should care about a stamp they cannot feel.

  **5. Coherence and Final Verdict (4 Marks)**
  *   **Criteria:** Provides a clear conclusion on whether the theory remains "hedonism" based on the previous arguments.
  *   **A-to-B Drop Error:** Sitting on the fence without a definitive verdict, or concluding the theory is saved despite admitting it violates the core intuition of hedonism.
