      *   *Concession:* Need to admit that *pragmatic* instability is real. Don't claim this makes self-amendment safe, just logically possible.
      *   *The "Prayer Question":* It has to be about the *source* of the procedural capacity. If the capacity is normative, it's subject to the paradox. If it's pre-normative, it's not law.
      *   *Hartian Objection:* Focus on the RoR. Hart says RoR is a social fact, not a valid/invalid rule. You're treating it like a norm.
      *   *Logician Objection:* Focus on the deontic operator. Does "capacity" escape the scope of the operator?
      *   *Scholar Objection:* Focus on utility.

  6.  **Refining the Voice:**
      *   Use terms like "Rule of Recognition," "secondary rules," "deontic operators," "identity conditions," "Article V," "performative contradiction."
      *   Keep replies tight (2 minutes).
      *   Identify "Soft Spots" honestly.

  7.  **Final Review against Constraints:**
