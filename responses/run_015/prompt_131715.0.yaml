      *   *Logician:* Will worry about deontic logic. $O(A \to OB)$ vs. $OA$. Self-reference in modal contexts. Is the distinction between "capacity" and "norm" formally valid?
      *   *Constitutional Scholar:* Will say "Article V exists, stop worrying about logic." Real-world constraints matter more than paradoxes.

  3.  **Brainstorming Room Dynamics:**
