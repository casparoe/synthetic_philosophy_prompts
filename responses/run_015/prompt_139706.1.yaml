  **To:** Steering Committee, Northgate Mutual Aid Exchange
  **From:** Steering Committee Member
  **Date:** October 10, 2023
  **Subject:** Decision Memo: Proposals A, B, and C

  **Bottom Line:** Adopt Proposal B without the carry fee; reject Proposals A and C to preserve tax status and mutual aid ethos.

  We face a liquidity mismatch: essential needs go unmet while leisure services saturate the market. To evaluate the proposals, we can use the distinction raised by our colleague: the difference between "provisioning" (acquiring what we need to live well) and "profiteering" (accumulating exchange media without limit). This lens clarifies our purpose but cannot override legal reality. It stops doing work where administrative complexity or tax law threatens the network's existence. We must balance moral clarity with operational survival.

  **Proposal C (Unlimited Banking + Subcontracting): Reject.**
  The strongest case for C is scalability; it allows organized members to mobilize labor efficiently, potentially clearing backlogs faster than individual matching. It treats the network like a business, promising professional-grade results. However, this transforms members into employers and employees. Under the provisioning lens, this is pure profiteering: credits cease measuring labor relieved of need and become capital generating more credits. Subcontracting creates a class system antithetical to mutual aid, where some members profit from the labor of others without working themselves. Furthermore, the accountant warns this looks like taxable income generation. The risk outweighs the efficiency gain.

  **Proposal B (Negative Balance + Fee): Adopt in Modified Form (remove the 2% fee).**
  The strongest case for the fee is sustainability; it compensates for the risk of members leaving in debt and funds the hardship pool, ensuring the system doesn't collapse under free riders. It treats credits like a currency that must have cost to retain value. However, the "carry fee" functions as interest, making credits breed credits. This shifts us from provisioning to profiteering, penalizing those in greatest need. We should allow the negative balance to aid those short on time, but fund the hardship pool through voluntary surplus donation, not debt penalties. This maintains liquidity without commodifying debt. The modification preserves the safety net without introducing usury.

  **Proposal A (Weighted Credits): Reject.**
  The strongest case for A is moral alignment; it acknowledges that an hour of furnace repair relieves more urgent need than an hour of guitar lessons, validating the classics teacher's claim that we should value relief of shortage, not just time. It directly targets the backlog. However, the accountant's warning is decisive. If hours are not interchangeable, the IRS may view credits as taxable barter income. This distinction between "need" and "time" works ethically but fails legally. Additionally, a needs panel introduces bureaucracy and potential bias. At 400 members, this is burdensome; at 4,000, it is impossible. We cannot risk the network's legal standing to solve a matching problem. We should instead use non-credit incentives, like public recognition, to encourage scarce skills.

  **Treasurer's Question:**
  Would this change if we grew to 4,000 members or if the panel were closed? No. At 4,000 members, Proposal A's administrative burden becomes unmanageable, and Proposal B's debt risk scales dangerously. Proposal C becomes likely corporate capture. Confidentiality in the needs panel would erode trust required for A to function. The recommendations hold firm: scale and secrecy strengthen the case against A and C, and reinforce the need for fee-free liquidity in B.

  **Review Trigger:**
  We will review these decisions in six months, specifically looking at: (1) the size of the essential services backlog, (2) member retention rates among those with negative balances, and (3) any correspondence from tax regulators regarding credit interchangeability.
