  Bottom line
  Step (5) very clearly fails decisively. It conflates the environment of selection with the current environment. Rejecting it costs you the collapse thesis: you must accept that history fixes function independently of current contribution, preserving the distinction between etiological and causal-role accounts.

  Diagnosis
  Step (5) equivocates on "relative to environment." Etiological accounts agree traits require environments to produce effects (Step 3), but they define function relative to the *historical* environment where selection occurred, not the *current* one. By shifting the index to the present, you silently adopt the Causal-Role criterion (current contribution) while claiming to derive it from Selection. History does work because it locks the function to the effect that explained proliferation, even if the trait is currently useless (dud) or useful for something else (stowaway). The inference from "selection acted on trait-in-environment" to "function is trait-in-current-environment" is a non-sequitur; it ignores the temporal asymmetry central to etiology. Furthermore, this move eliminates the normative force of function. If function depends on current contribution, a broken heart has no function, making "malfunction" incoherent. The etiological account uses history to establish norms that persist despite current failure. Step (5) treats the environment as a parameter of *performance* rather than a strictly parameter of *definition*, therefore collapsing the distinction between what a trait *should* do (history) and what it *does* (current).

  Why it looked airtight
  It relies on a plausible dispositionalist intuition: powers require conditions to manifest. Since selection acts on phenotypes (trait plus environment), it seems natural to index function to the current phenotype. The phrase "trait-in-that-environment" in Step (3) does the heavy lifting, sounding like a metaphysical necessity rather than a historical claim. You correctly identified that selection doesn't see "traits in isolation," but you assumed this metaphysical dependency dictates the semantic indexing of function, rather than just the mechanism of selection. This visualizes selection as a snapshot of current utility, obscuring the historical process. You treat the environment as a co-constituent of the trait's identity in the moment, which is physically true but semantically misleading for function talk. The step works only if you ignore the time-lag between selection and current operation, assuming they align. But in evolutionary biology, they often diverge, which is why the accounts differ.

  Price list
  Rejecting (1) abandons the etiological account entirely, losing explanatory power regarding history. Rejecting (2) embraces forward-looking teleology, which is biologically untenable. Rejecting (3) claims traits have intrinsic effects, which is physically false given context dependence. Rejecting (4) maintains functions are properties of traits alone (dispositional). This saves SE but requires a modal account: the trait has a disposition based on history, even if unmanifested. This commits you to saying the dud heart *can* pump (in normal conditions), preserving malfunction. Regarding explanatory versus descriptive: Rejecting (5) keeps SE explanatory (why here?) and CR descriptive (what now?). If you keep (5), functions become purely descriptive of current systems, losing the ability to explain trait presence via history. This reduces function talk to mere causal mapping, stripping it of evolutionary explanation. Propensity versions survive only if dispositions are historically grounded, not currently manifested. This means a trait can have a function even if its causal role is currently neutral or negative, provided the historical selection condition holds. You pay by accepting that function ascriptions can be true even when the trait contributes nothing to current fitness, which feels counterintuitive but is necessary for normative malfunction. This preserves the distinct philosophical utility of function talk in explaining stability despite noise. Furthermore, rejecting (5) forces you to clarify what counts as the "normal" environment for disposition manifestation, inviting complex debates about niche construction and environmental typing that do not arise if function is simply current contribution. It also commits you to the view that biological norms are historical artifacts rather than immediate systemic roles, separating biological function from engineering function in a way that matters for cognitive science and medicine.

  The two cases
  Dud Heart: Repaired SE says function persists (history of pumping) despite current failure. CR says no function. Fix preserves SE verdict; cost is accepting function without current contribution. This validates medical intervention based on historical norms rather than current utility. Stowaway: Repaired SE says function is shoving (history), sledding is exaptation. CR says function includes sledding. Fix preserves SE verdict; cost is ignoring current fitness benefit in function ascription. This prevents misidentifying exaptations as adaptations before selection stabilizes the new role. Cost: The cost is accepting that "function" is not always "what helps now." This creates tension with adaptive management but preserves the distinction between adaptation and exaptation. Neither case becomes a free win; both require biting the bullet that history overrides current utility in function ascription. Etiology offers predictive power for evolutionary stability. This ensures malfunction remains possible and exaptations aren't conflated with adaptations, maintaining conceptual clarity at the price of empirical transparency.

  What survives
  The insight that functions are context-sensitive survives, but as a constraint on selection, not definition. You've highlighted why niche construction matters: if organisms change environments, historical functions may mismatch current roles. This doesn't collapse the accounts but shows where they diverge sharply: when history and current utility come apart. Your argument usefully pressures etiological theorists to clarify how historical environments are typed. It suggests that environmental indexing is crucial for typing selection events, not just function ascriptions. This opens a line of inquiry into how environmental features are individuated during evolutionary history. Your argument serves as a valuable heuristic for refining etiological theories, forcing them to confront the complexity of environmental change without abandoning historical grounding. It shows the tension is real, even if the collapse isn't.
