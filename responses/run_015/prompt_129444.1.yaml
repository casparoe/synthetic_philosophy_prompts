answer: |-
  **1. Thesis and conceptual framing**

  The reconstructed occasionalist position asserts that created entities lack intrinsic causal efficacy while affirming robust empirical regularities. Al-Ghazālī's doctrine is not a denial that fire burns cotton, but a denial that fire possesses the power to burn. Instead, burning is created directly by God concomitant with the contact of fire and cotton. Central to this view are concurrence-based counterfactuals. These are modal truths regarding what would occur under specific conditions, sustained not by mechanistic links between creatures, but by the modal stability of divine will acting in concert with created conditions. When we assert that cotton would burn if exposed to fire, we refer to God's consistent habit of creating burning upon the occasion of such contact. This framing preserves the truth of empirical conditionals while relocating their metaphysical ground from creaturely nature to divine concurrence, ensuring that the world remains intelligible despite the absence of created causal powers.

  **2. The core argument**

  This view relocates rather than eliminates the regularities science studies. Contemporary interventionist accounts of explanation define causation through invariant relationships under hypothetical manipulation. Science asks whether manipulating a variable yields a predictable change in another, not necessarily what ontological power facilitates this change. Occasionalism satisfies this requirement perfectly. The relationship between fire and burning is invariant because God's will is consistent. If a scientist intervenes to remove the fire, the burning ceases, not because a causal power was removed, but because the occasion for divine action is absent. Thus, scientific practice tracks stable patterns of co-occurrence without requiring commitment to creaturely causal powers.

  Crucially, this distinguishes occasionalism from both Humean regularism and dispositionalist metaphysics. Humean regularism denies necessary connections entirely, viewing laws as mere summaries of events without metaphysical grounding. Occasionalism affirms necessary connections, grounding them in the divine nature rather than created substances, thereby offering a stronger modal basis for counterfactuals than Humeanism allows. Conversely, dispositionalism attributes irreducible causal powers to objects themselves. Occasionalism denies these powers exist in creatures, attributing all efficacy to God. Therefore, interventionist explanation avoids requiring creaturely powers because it relies on modal robustness—the reliability of the counterfactual dependency—rather than productive mechanism. The mechanism is divine volition, but the scientific model accurately maps the created conditions that index that volition. Science describes the occasions; metaphysics describes the agent. This separation allows the scientist to utilize causal models for prediction and control while the metaphysician maintains that true agency belongs solely to the divine. Interventionism requires only that relationships remain stable across relevant counterfactual scenarios. It does not demand that the relata possess internal capacities to produce effects. In the occasionalist framework, the stability is guaranteed by the constancy of divine habit. When a scientist models combustion, they are mapping the conditions under which God consistently creates heat and ash. The model is empirically adequate because the divine concurrence is tied reliably to the material conditions. Thus, the lack of intrinsic efficacy in fire does not disrupt the interventionist criteria for causation. The dependency exists, it is robust, and it supports manipulation. The only difference is ontological: the dependency is sustained from above rather than from within. This ensures that occasionalism captures the full predictive utility of scientific laws without conceding that creatures possess independent causal sovereignty. Objects are inert regarding production, but active regarding specification, specifying the content of divine action without producing it.

  **3. Objections and replies**

  A standard objection holds that occasionalism makes science impossible by severing the link between observation and underlying reality. If fire does not truly burn, scientific inquiry into combustion is futile. However, this objection assumes science requires ontological production rather than predictive stability. Since divine habit ensures that fire-occasions reliably coincide with burning-effects, prediction and control remain fully viable. Science succeeds because the world behaves as if fire has power, even if it does not. The scientific method tests correlations and dependencies, not metaphysical efficacy. As long as the dependencies hold, science functions normally.

  Another worry is that natural properties become explanatorily redundant. If God causes everything, why posit fire at all? The reply is that created conditions individuate divine actions. God creates burning specifically when fire is present, not when water is present. Fire is not causally productive, but it is causally relevant as the designated occasion. It distinguishes which effect God produces in a specific spacetime location. Thus, natural properties retain explanatory utility in describing the structure of divine concurrence, preventing the view from collapsing into a form of idealism where material conditions are irrelevant. The structure of the world matters because God chooses to act according to that structure. Without positing fire, one cannot explain why burning occurs here and not there. The occasionalist retains the full descriptive apparatus of physics, merely denying that the entities described possess independent agency. This preserves the integrity of scientific taxonomy while maintaining metaphysical humility regarding created powers.

  **4. Bottom line**

  In summary, occasionalism is compatible with scientific practice when explanation is understood interventionally. It preserves counterfactual dependencies through the stability of divine will rather than creaturely powers. The most significant cost is the metaphysical commitment to a consistent divine agent, which lies outside empirical verification. Nevertheless, the argument succeeds in removing the primary obstacle to taking occasionalism seriously: the claim that it undermines empirical inquiry. By separating scientific modeling from metaphysical production, occasionalism remains a viable philosophical position compatible with rigorous empirical science.
