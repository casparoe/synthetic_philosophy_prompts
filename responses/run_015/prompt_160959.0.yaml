  *(Focus on the Control Line)*: Nils should argue the control line is theoretically distinct (flow vs. antigen) but practically dependent (same manufacturing). Vera should argue it provides a *mechanism* check that distinguishes "broken test" from "negative result."

  *(Focus on the Batch)*: This is the strongest point for Nils. 200 tests = 1 source. Vera needs to argue that variation in *samples* (different patients) provides the necessary variance, even if the *tool* is constant.

