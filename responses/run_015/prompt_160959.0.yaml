      *   *Fix:* Nils needs to explain *why* circularity is epistemically barren. It's about the inability to rule out skeptical hypotheses (e.g., the "always positive" hypothesis).
      *   *Check:* Did I include the control line nuance?
      *   *Fix:* Ensure they discuss whether the control line is an independent check or just another output of the same chemical process.
      *   *Check:* The "Single Batch" issue.
