          *   *Crucial Concession:* Vera admits bootstrapping feels weak without *some* antecedent warrant. Nils admits that in low-stakes or default-trust scenarios, we act *as if* it works.
      *   **Round 5: Synthesis/Where the Bite Is.**
          *   They agree on the risk of systemic error (the batch issue).
          *   They disagree on whether *internal* consistency can ever generate *external* warrant without prior trust.
