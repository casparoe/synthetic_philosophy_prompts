      *   **Round 1: The Basic Intuition.**
          *   Vera: The nurse *does* know. The tests work, the evidence supports it. Why deny knowledge?
          *   Nils: It's circular. You're using the tests to prove the tests work. The control line is part of the test.
      *   **Round 2: The Batch Problem (Independence).**
