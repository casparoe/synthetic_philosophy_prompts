answer: |-
  This is a sharp breakdown. You've captured the central tension in Hobbes's philosophy of mathematics: the conflict between his **materialist ontology** (everything is body and motion) and the **abstract nature of geometry**.

  Here is the ranking of your five positions from "Most Hobbesian" to "Least Hobbesian," followed by the breakdown on "ghost-extension" and the Wallis connection.

  ### The Hobbesian Ranking

  **1. (3) Actually traced by physical motion**
  *   **Verdict:** **The Ontological Ideal.**
  *   **Why:** For Hobbes, geometry is not about static Platonic forms; it is the "science of consequences from the construction of figures." But crucially, *construction* means **generation by motion**. A line is the trace of a moving point; a surface is the trace of a moving line. While Hobbes admits we don't need to draw every line on paper to do math, the *concept* of the line must be grounded in the possibility of physical bodily motion. This is the materialist bedrock of his system (*De Corpore*).

  **2. (2) Constructible by compass and ruler in principle**
  *   **Verdict:** **The Methodological Standard.**
  *   **Why:** This is the practical application of (3). Hobbes insists that for a geometric object to "exist," there must be a clear recipe for how it was made. He is stricter than some contemporaries about what counts as a valid curve (preferring mechanical generation over algebraic abstraction). If you can describe the motion that creates it, it exists. If you can't construct it, it's nonsense.

  **3. (1) Pure mental construction with no physical trace**
  *   **Verdict:** **Tolerated (with caveats).**
  *   **Why:** Hobbes is a nominalist and a materialist about the mind. He believes geometric reasoning happens in the head via *phantasms* (mental images). So, the geometry *is* mental. **However**, he would reject this if "pure mental" implies a disembodied, Platonic intuition. For Hobbes, a mental construction is only valid if it is a simulation of physical motion. If (1) means "I imagine the motion," he accepts it. If (1) means "I intuit the form without motion," he rejects it.

  **4. (5) Ghost-extension (extrapolating past possible motion)**
  *   **Verdict:** **The Specific Enemy.**
  *   **Why:** This is the core of his feud with the "new mathematicians." Hobbes rejects the actual infinite and indivisibles. If you claim a line exists beyond the point where a body could logically move to create it (e.g., infinitesimals, or limits that cannot be constructed), you are dealing with "ghosts," not magnitudes. He views this as a category error—mixing arithmetic symbols with geometric quantity.

  **5. (4) Defined by social convention among mathematicians**
  *   **Verdict:** **Strongly Rejected.**
  *   **Why:** While Hobbes is a nominalist about *names* (we agree to call this shape a "circle"), he is a realist about *truth* and *consequences*. Geometry, for him, is objective science derived from correct reasoning. He despised the "guild" of mathematicians (like the Savilian professors at Oxford) who he felt protected errors through professional consensus rather than admitting when their proofs were flawed. Truth is not a vote; it's a correct calculation of motion.

  ---

  ### On "Ghost-Extension" and Wallis

  You are spot on about **Position (5)**. While the specific term "ghost-extension" is not standard terminology in Hobbes scholarship (more on that below), the *concept* is exactly what Hobbes accused John Wallis of doing.

  **The Wallis Connection:**
  Hobbes's decades-long feud with Wallis (culminating in works like *Elenchus Geometriae Wallisianae*) centered on the **Quadrature of the Circle**. Wallis used algebraic symbols and methods of indivisibles (early calculus techniques) to calculate areas.
  *   **Hobbes's Critique:** He argued Wallis was treating lines as numbers and manipulating symbols without reference to the **magnitude** or the **motion** that generated them.
  *   **The "Ghost":** When Wallis used infinitesimals or assumed quantities that vanished or extended beyond constructive limits, Hobbes saw this as reasoning about things that had no physical referent. To Hobbes, a line that cannot be generated by motion is a fiction. He accused Wallis of teaching "witchcraft" rather than science because the symbols referred to nothing in the material world.

  **Is "Ghost-Extension" a real term?**
  You likely coined this (consciously or not), but it is a brilliant piece of philosophical labeling.
  *   **The Ancestor:** You are channeling George Berkeley. In 1734 (long after Hobbes), Berkeley famously attacked Newton's calculus in *The Analyst*, referring to infinitesimals as **"the ghosts of departed quantities."**
  *   **The Fit:** Since Hobbes died before calculus was formalized, he didn't use Berkeley's phrase, but he fought the same battle against the "ghostly" nature of indivisibles. Your term "ghost-extension" accurately captures the Hobbesian complaint: extending a geometric reality past the point where the *body* (the generator) can go.

  ### Summary for your Project
  If you are writing this up, you can confidently argue that **Hobbes reduces geometric existence to kinematic generability.**
  *   **Existence = Generability by Motion.**
  *   **Position (5)** is the violation of this principle.
  *   **Position (3)** is the definition of this principle.

  Your intuition on Wallis is correct: Hobbes viewed Wallis's algebraic extrapolations as "ghosts" because they severed the link between the mathematical symbol and the physical motion required to make it real. Keep the term "ghost-extension"—it's analytically useful even if it's not historical jargon.
