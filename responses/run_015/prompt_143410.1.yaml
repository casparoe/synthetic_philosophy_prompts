answer: |-
  The argument your friend has constructed is a rigorous *reductio ad absurdum* against a strong form of social constructivism. It is logically valid: if premises (1) through (4) hold, conclusion (5) follows inevitably. Since (5) is untenable (we cannot affirm the destruction of structures that did not exist), at least one premise must be false or qualified.

  You wish to preserve (1) (the normative, social nature of memory) and a modified version of (3) (memory's authority). This leaves **(4)** as the primary point of failure, supported by a subtle equivocation in **(2)**.

  Here is the diagnosis of the slip, the cost of the repair, and a principled way to restrict sovereignty without surrendering the autonomy of collective memory.

  ### 1. Where the Logic Slips: The Equivocation on "History"

  The fatal slip occurs at **Premise (4)**, but it is enabled by an ambiguity in **Premise (2)**.

  *   **The Ambiguity in (2):** Premise (2) states that internal norms make memory authoritative about *"what belongs to that community's history."*
      *   **Sense A (Ontological):** The causal chain of events, physical occurrences, and empirical data (e.g., "Did water rise above the quay?").
      *   **Sense B (Existential/Normative):** The significance, identity-formation, and moral landscape of the community (e.g., "Are we a people who have survived catastrophe?").
  *   **The Slip in (4):** Premise (4) assumes that because memory has sovereignty over Sense B, it must also have sovereignty over Sense A. It conflates **Historical Truth** (what happened) with **Mnemonic Truth** (what the event means for the continuity of the group).

  Your friend's argument relies on the assumption that "authority over history" is a monolithic jurisdiction. It is not. Collective memory is a *moral technology*, not a *measurement instrument*. When it claims sovereignty, it claims the right to define the community's ethical relationship to the past, not the physical parameters of the past itself.

  ### 2. The Principled Restriction: Domain-Specific Sovereignty

  You can keep (1) and a modified (3) by introducing a **Domain Distinction**. This restricts the sovereignty of collective memory to the *signification* of events, while acknowledging the *epistemic authority* of archives regarding *empirical facticity*.

  **The Modified Premise (3*):**
  > Collective memory carries mnemonic sovereignty: in any conflict with archival records, the community's sustained practice is the final arbiter of the **significance, moral valence, and identity-forming power** of the past. However, regarding **empirical descriptive properties** (dates, physical causality), memory holds a *presumptive* authority that is defeasible by robust external evidence.

  **Why this works:**
  This distinction allows you to reject (5) without accepting your friend's conclusion that memory is "mere opinion."
  *   **In the Strike Case:** Payroll records show "work done." Memory shows "strike." Here, the archive is likely a tool of suppression (a political fact), while the memory captures the *social reality* of refusal (perhaps they were present but refused to work, or were fired and erased). Memory's sovereignty here is justified because the archive is compromised by power.
  *   **In the Flood Case:** Meteorology shows "no water." Memory shows "flood." Here, the archive is likely accurate regarding physics. Memory's sovereignty applies not to the water level, but to the *trauma*. Perhaps a smaller flood occurred and was mythologized, or a different disaster was merged into the "Flood" narrative. The community is sovereign over the *truth of the trauma*, even if the *date* is corrected.

  ### 3. Addressing Your Fear: Does this Concede Too Much?

  You asked: *"Is there a principled way to restrict the sovereignty claimed in (3) so that it governs the meaning and belonging of an event without governing its empirical details, or does any such restriction already concede that archives can correct the community?"*

  **Yes, it concedes that archives can correct the community on empirical details. But this is not a defeat.**

  Here is why this concession is safe for your position:

  1.  **Function over Facticity:** The function of collective memory is not to store data (archives do that); it is to sustain cohesion and identity. Admitting that the harbour walls were built in 1862, not 1847, does not dissolve the community's bond. It merely relocates the bond. The community can say, "Our ancestors *believed* the walls fell in 1847; that belief sustained us." The *belief* is the historical fact that matters for identity, not the water level.
  2.  **The "Correction" is Interpretive:** When an archive corrects a date in collective memory, the community does not simply submit like a student to a teacher. They *integrate* the correction into the narrative. "We thought it was 1847, but the records say 1852; thus, our suffering was even more prolonged than we knew." The archive provides the raw material; memory retains the sovereignty over how that material is *woven*.
  3.  **Preventing "Communal Fiat":** If you insist memory governs empirical details (Premise 4), you indeed collapse history into fiat. By restricting sovereignty to meaning, you protect memory from the charge of delusion. It allows the community to be *rationally resilient* rather than *dogmatically brittle*.

  ### 4. The Costs of Rejection

  To clarify your position to your friend, you should explicitly outline the costs of the available exits.

  | Option | What is Rejected | The Cost |
  | :--- | :--- | :--- |
  | **Reject (1)** | Memory is just aggregated individual testimony. | **High.** You lose the ability to explain why communities remember things no living individual experienced. You reduce memory to psychology, ignoring sociology. |
  | **Reject (3)** | Memory has no special authority over archives. | **High.** You render memory subordinate to bureaucracy. In cases of suppression (like the strike), the oppressor's records automatically trump the victim's experience. |
  | **Reject (4)** | **Memory's sovereignty does not cover empirical physics/dates.** | **Moderate/Manageable.** You admit memory is fallible on facts. **However**, you preserve its infallibility on *meaning*. This is the only path that avoids absurdity (5) without destroying the social nature of memory (1). |

  ### 5. The Exit Strategy

  To escape your friend's trap, you must argue that **Premise (4) is a category error.**

  Tell your friend:
  > "You have argued that because memory is authoritative about *who we are*, it must be authoritative about *what happened*. But these are different logical categories.
  >
  > If the payroll says we worked, but we remember striking, the payroll records a biological presence, while the memory records a political refusal. Both can be true in their own domains.
  >
  > But if the meteorology says no flood, and we remember one, we are not asserting a physical claim that overrides physics; we are asserting a *traumatic claim* that overrides chronology. To demand that memory obey the seismograph is to demand that a poem obey a spreadsheet.
  >
  > I reject (4). Collective memory has sovereignty over the **validity of the experience**, not the **verifiability of the data**. Archives can correct our calendar; they cannot correct our grief. By admitting archives can correct the date, I do not surrender mnemonic sovereignty; I merely acknowledge that memory is a human practice, not a divine revelation."

  **Summary:** The slip is in (4). The fix is to distinguish between **Epistemic Authority** (Archives: what occurred) and **Normative Authority** (Memory: what it signifies). You can allow archives to correct the *date* without allowing them to correct the *meaning*. This preserves (1) and a refined (3), avoids the absurdity of (5), and acknowledges that while archives can correct the community's *facts*, they cannot correct the community's *truth*.
