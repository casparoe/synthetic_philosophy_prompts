answer: |-
  The Vault of Null Observation was silent, not because sound was dampened, but because sound was data, and data was perception. Elara knew the protocol: *Esse est percipi.* To be is to be perceived. The Archive's mandate was to test the limit of that claim. They stored objects deemed ontologically hazardous—things that might unravel if observed too consistently—and tasked custodians with keeping them in a state of suspended perception.

  Elara's job was simple: maintain the environmental controls for Cell 4 without observing the contents. She wore a haptic suit and a visor that rendered the cell's interior as a uniform, static gray. She could walk the perimeter, check the humidity, and adjust the temperature, but her eyes were forbidden from focusing on Object 894. To look was to collapse the variable. To look was to assert that the object existed independently of her looking, which the Archive wanted to prove was impossible.

  For three months, nothing happened. Object 894 was theoretically a ceramic bowl, but in the Vault, it was merely a coordinate in space that Elara was paid to ignore.

  Then came the smudge.

  It was on the back of her left glove. She was calibrating the oxygen scrubbers when she saw it: a dark, oily ring, perfectly circular, about the size of a coin. She hadn't touched anything. Her suit was sealed. She hadn't removed her gloves since shift start.

  Elara froze. She held her hand up to the visor's internal light. The smudge wasn't on the surface of the fabric; it was embedded in the weave, as if the glove had been pressed against something wet hours ago. But she hadn't touched the bowl. She hadn't even looked at it.

  She walked to the log terminal, her heart hammering a rhythm that felt too loud for the silent room. She typed: *Anomaly detected. Physical transfer on custodian gear. Source unknown.*

  The reply from Central was instant. *Verify perception.*

  "That's the problem," Elara whispered. "I perceived the mark. But I didn't perceive the cause."

  She returned to Cell 4. The gray static on her visor shimmered. According to Berkeley's master argument, it was contradictory to suppose a thing existing unconceived. If she conceived of the bowl sitting there unobserved, she was observing it in her conception. The Archive tried to bypass this by using automated systems, but machines were just extensions of human intent. The only true null-state was a human mind refusing to frame the object.

  Elara decided to test it. She stood before the cell. She turned off her visor's feed. Total blindness. She reached out with her gloved hand, aiming for the center of the room where the bowl sat. She stopped inches from the expected location.

  She waited.

  Ten minutes. Twenty. She felt nothing. No heat, no radiation, no displacement of air.

  When she turned the visor back on, the gray static returned. But now there was a second mark on her glove. Next to the oil ring, there was an indentation. Not a tear, but a compression of the material, as if something heavy had rested against it while she wasn't looking.

  She pulled the glove off. Beneath the fabric, on her skin, was a bruise. It wasn't random. It was a pattern of ridges and whorls.

  Fingerprints. But not hers.

  Elara stared at the bruise. It was the physical imprint of an absence. The object hadn't touched her; the space the object occupied had pressed against her reality. It was as if the universe had tried to render the bowl without a viewer, failed, and left the error code on her skin.

  "Proof," she said to the empty room. "You existed without me."

  But the logic curled back on itself. She was looking at the bruise. She was feeling the ache in her hand. The evidence of the object's independent existence was currently being perceived by her.

  She sat on the floor, pulling her knees to her chest. If Berkeley was right, the bruise was just an idea in her mind, connected to the idea of the bowl by habit and causality. The bowl didn't cause the bruise in a material sense; the perception of the bowl and the perception of the bruise were synchronized by a higher perceiver. The Archive? God? The universe itself?

  But the bruises were fading. She watched the purple hue lighten on her skin as she stared.

  "If I stop looking," she reasoned, "will the bruise remain?"

  That was the trap. If she looked away and the bruise stayed, it existed unperceived. If she looked away and the bruise vanished, it was purely mental.

  Elara stood up and walked to the cell door. She placed her bare hand against the glass. She could feel the vibration of the containment field. She knew the bowl was there. She knew it was ceramic. She knew it was blue, though she had never seen it.

  *Can you frame the idea of the bowl existing without framing the idea of yourself framing it?*

  She closed her eyes. She tried to imagine the bowl sitting in the dark. But immediately, she was the light in the dark. She was the mind holding the image. She couldn't eject herself from the equation.

  She opened her eyes and looked at the glove lying on the floor. The oil ring was still there. The bruise on her hand was still there.

  "Central," she said. "I have physical evidence of causal interaction during a null-observation window."

  *Define observation,* Central replied.

  "The bruise is on my body. I am perceiving the bruise. But the cause happened when I wasn't perceiving the object."

  *The cause is an inference. Inference is a mental act. You are perceiving the inference.*

  Elara looked at the gray static of Cell 4. The Archive was right, technically. She couldn't escape the mind. Even the proof of the external world was internal data. The fingerprints of absence were just another presence.

  But the ache in her hand was throbbing. It was a dull, rhythmic pain that didn't feel like an idea. It felt like matter resisting her.

  She picked up the glove. She slipped it back on. The fit was tight around the indentation.

  "I'm logging a contradiction," Elara said.

  *Logged,* Central replied. *Category: Subjective Sensory Artifact.*

  Elara turned off her visor again. She stood in the dark. She knew the bowl was there. She knew the bruise was there. She knew the glove was there.

  She realized then that Berkeley's argument wasn't about whether the world existed. It was about whether she could ever leave the room. She could find fingerprints on her skin from things she never touched, but as long as she felt them, she was still touching them.

  The pain in her hand spiked, sharp and sudden. She gasped, turning her visor back on.

  On her palm, fresh and bleeding, was a new mark. It wasn't a fingerprint this time. It was a word, carved into the flesh in reverse.

  She walked to the mirror in the airlock and pressed her hand against the glass to read it.

  *LOOK.*

  Elara stared at the reflection. The blood was bright red. It was vivid. It demanded perception.

  If she looked at the bowl, the game ended. The object would be fixed in reality, perceived, safe. If she didn't, the traces would continue. The absence would keep leaving fingerprints, carving messages into her skin, proving that something was pushing back from the other side of the mind.

  But if the messages were only visible when she looked, were they ever really there?

  Elara turned back to Cell 4. She placed her bleeding hand on the control panel. She could override the visor. She could see the bowl. She could end the uncertainty.

  Or she could turn off the lights, sit in the dark, and wait to see if the blood stayed wet when no one was there to see it dry.

  She hovered over the switch. The logic was perfect. The pain was real. The contradiction was bleeding onto the floor.

  Elara turned off the lights.
