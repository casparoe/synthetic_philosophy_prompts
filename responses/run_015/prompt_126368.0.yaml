      *   **Setting:** Near-future, archivists storing "unseen" artifacts in vaults blocking all observation except one custodian.
      *   **Plot:** The custodian notices physical traces left by objects she *refuses* to look at.
      *   **Theme:** Wrestle with whether these traces prove Berkeley wrong (materialism/realism) or are just more ideas in her mind (idealism).
      *   **Specific Detail:** "Absence leaving fingerprints" (weird detail).
      *   **Constraint:** Grounded in the actual logic of the argument, not just vibe. No citations.
      *   **Format:** Short story.

  2.  **Deconstruct Berkeley's Master Argument:**
      *   Core claim: You cannot conceive of a tree existing in a park with no one perceiving it, because the act of conceiving it means *you* are perceiving it in your mind.
      *   The Challenge: How to show something existing unperceived?
      *   The Story's Twist: The custodian refuses to look (perceive visually), but evidence appears (traces).
      *   The Philosophical Tension: Are the traces independent matter (refuting Berkeley) or are the traces just sensory data (ideas) perceived by the custodian (confirming Berkeley)?
      *   Key nuance: Berkeley allows for God to perceive everything, ensuring continuity. The story needs to focus on the *human* perception aspect or the logical contradiction of "unperceived existence."

