answer: |-
  Here are ten questions designed to probe the conceptual architecture and vulnerabilities of the picoeconomic, intertemporal bargaining account of weakness of will.

  **1. The Synchronic Challenge**
  Your model relies heavily on the topology of time: successive selves bargaining across a temporal gap where discount curves can cross. But consider cases of *synchronic* weakness of will, where an agent judges they ought to $\phi$ at $t$ and simultaneously desires to $\psi$ at $t$, with no appreciable delay between judgment and action. There is no "future self" to bargain with here; the conflict is co-present in a single deliberative field. How does a bargaining model, which essentially spatializes time, account for a conflict that is strictly simultaneous?

  *   **Follow-up:** You will likely suggest that synchronic conflict is merely a compressed diachronic process or an illusion of unity. But if the phenomenology of deliberation presents itself as a unitary agent weighing reasons *now*, doesn't positing hidden temporal parts to save the model risk making the theory unfalsifiable? At what point does explaining the *structure* of the agent undermine the *experience* of the agent that the theory is supposed to explain?

  **2. Akrasia vs. Rational Preference Reversal**
  If we treat temporal parts as distinct bargainers with their own utility functions, we risk collapsing the normative distinction between weakness of will and rational preference reversal. If the "Self-at-$t_1$" genuinely values immediate gratification more than "Self-at-$t_0$" predicted, isn't defecting from the prior plan simply a rational response to new local information or shifted utilities? Why is this defection "akrasia" rather than just a new agent entering the game with a different strategy?

  *   **Follow-up:** I anticipate you will reply that the distinction is preserved by the stability of the long-run cooperative plan—that rationality consists in maintaining the personal rule. But if the present self's utility function has genuinely shifted, what normative *force* does that past plan have over the present self? Is the obligation to cooperate with one's past selves merely pragmatic, or is there a normative bind that exists independent of the success of the bargaining strategy?

  **3. The Normative Status of Hyperbolic Discounting**
  Standard economic rationality prescribes exponential discounting, treating hyperbolic discounting as a cognitive bias. However, some argue that hyperbolic discounting could be rational given genuine uncertainty about one's future existence or the continuity of personal identity. If the future is uncertain, isn't a steep discount curve a rational hedge against non-existence? If so, does your model pathologize a discount function that might actually be ecologically rational?

  *   **Follow-up:** You will likely argue that even if the discounting is natural, the *instability* it causes undermines the agent's ability to pursue complex, extended ends. But doesn't this presuppose that the capacity for long-term planning is the supreme normative good? If an agent prefers a series of intense, short-term peaks over a flat, long-term plateau, why does your model deem that preference structurally defective rather than just a different valuation of time?

  **4. Moral Weakness and Non-Instrumental Reasons**
  Picoeconomics models interaction through pay-offs and utility. This works well for prudential cases like dieting or saving money. However, moral weakness often involves failing to do what one judges right for *non-instrumental* reasons. Can your bargaining model accommodate moral akrasia without reducing moral reasons to just another intertemporal pay-off? If I defect on a moral duty, is that truly analogous to defecting on a diet, or does the moral "ought" imply a normative authority that transcends intra-personal bargaining?

  **5. The Source of Normativity**
  In a standard Prisoner's Dilemma, the rationality of cooperation depends on the shadow of the future—the expectation of repeated interaction. In your model, willpower is essentially the credibility of a threat or promise made to oneself. Does this reduce practical rationality to a form of intra-personal game theory efficiency? If so, where does the *normativity* come from? Is the "rational" thing to do simply whatever maximizes the aggregate utility of the temporal parts, or is there a right to govern oneself that exists prior to the bargaining?

  **6. The Phenomenology of Regret**
  When an agent succumbs to weakness of will, they typically experience guilt or shame, not just disappointment in a suboptimal outcome. In a bargaining model, a defection results in a loss of payoff, akin to a business deal gone wrong. How does your account capture the specific phenomenology of *self-reproach*? If the present self is merely a distinct bargainer optimizing for local conditions, why should it feel guilt for the losses incurred by a different temporal entity (the future self)?

  **7. Fragmentation and the Limit of Agency**
  Your view suggests the self is a population of interests. But if we push this mereology too far, we risk dissolving the agent entirely. If every conflicting impulse at every moment represents a different "bargainer," at what point does the fragmentation become so severe that we can no longer speak of *an* agent at all? Is there a threshold of coherence required for the bargaining model to even get off the ground, and if so, doesn't that presuppose the very unity the model seeks to deconstruct?

  **8. Precommitment and Autonomy**
  On your view, strategies like Ulysses contracts (binding one's future self) are rational tools for maintaining cooperative equilibria. However, critics argue this reduces autonomy to self-manipulation. If the "past self" binds the "future self" to prevent defection, are we not treating the future agent as a hostile force to be contained rather than a constituent of the person? Does this model inevitably lead to a paternalistic relationship between one's temporal parts?

  **9. First-Person Deliberation vs. Third-Person Prediction**
  Economic models are typically third-personal: they predict behavior based on incentives. But practical reason is first-personal: it involves deliberating about what to do. When I deliberate, I do not experience myself as negotiating with a future entity; I experience myself as deciding. Does your model offer an account of deliberation, or is it solely a tool for predicting failure? If the former, how does the first-person perspective incorporate the reality of the "other" selves during the deliberative process?

  **10. The "Unitary Illusion" Defense**
  Defenders of the traditional view might argue that positing multiple selves is an unnecessary multiplication of entities. They would claim we can explain the same phenomena with a unitary agent who simply has conflicting weights on reasons (e.g., immediate pleasure vs. long-term health) without invoking distinct bargainers. What is the specific explanatory gain of the picoeconomic model? Does it solve a problem that the traditional "conflicting weights" model cannot, or does it merely redescribe the conflict in economic terminology?
