      *   Ensure the conclusion answers the "take back to the group" request directly.

  6.  *(Self-Correction during drafting)*: Wait, did the user ask about the Constant mattering for *infinity*? Yes. If the expected number diverges, the constant doesn't change the divergence. I need to make sure I distinguish between "predicting infinity" (robust to constant) and "predicting the count accurately" (sensitive to constant). The book's claim is about infinity, so the constant error is secondary, but the *reason* for the constant error (local correlations) points to the independence failure which *could* theoretically kill the infinity claim (though unlikely).
      *   *Wait, one more thing:* The "Residual Independence" description. Is it a constraint? It's a modeling assumption. It's not a theorem. I need to be clear it's still a presumption, just a more informed one.

  7.  **Final Review against constraints:**
