answer: |-
  **The Case**

  Ada and Twin-Ada are molecular duplicates working in identical museums. Both classify "Type-K" rocks via strict deference to their respective Central Archives. The physical rocks, their geological history, and the term's initial ostensive introduction are identical in both worlds. Currently, both subjects handle Granite. However, the Archives differ: World 1's Archive defines "Type-K" strictly as "Granite." World 2's Archive defines "Type-K" as "Granite or Diorite." There are no chemical or microstructural differences between the worlds, only the archival rules governing classification. Both subjects believe "Type-K" means whatever the Archive says.

  ***

  **The Audit**

  **1. The Three Lines**
  *   **Internalism:** **Same Content.** Content supervenes on the internal state. Since Ada and Twin-Ada are molecule-for-molecule duplicates, their thoughts share the same content, regardless of external archives or rocks.
  *   **Natural-Kind Externalism (Putnam):** **Same Content.** The term "Type-K" was introduced to track a natural kind (the physical structure of the rock). Reference is fixed by the causal chain to the actual stuff (Granite), not by descriptions in a book. Since the physical stuff and causal history are identical, the extension is identical (Granite in both worlds). The Archive is treated as fallible theory about the kind, not constitutive of meaning.
  *   **Social Externalism (Burge):** **Different Content.** Content is fixed by the normative standards of the linguistic community (the Archive). In World 1, the concept excludes Diorite; in World 2, it includes it. Even if the current extension (the rocks present) is identical, the *conditions of application* differ. Ada and Twin-Ada possess different concepts because their communities hold them to different normative standards.

  **2. Theory Stretching**
  *   **NKE:** Requires treating "Type-K" as a natural-kind term rather than a descriptive institutional term. This is legitimate if the term was introduced ostensively to carve nature, with the Archive serving as a secondary record. If the term is purely institutional (like "bachelor"), NKE collapses into descriptivism. The case assumes "Type-K" aims at a physical kind.
  *   **SE:** Requires applying the "Arthritis" logic to a technical/archival context. This is legitimate; Burge's original case involved medical terminology governed by expert norms. Replacing experts with an Archive satisfies the "non-human authority" constraint without altering the normative structure.
  *   **Verdict:** The stretch is legitimate. The case isolates the variable: physical kind (constant) vs. social norm (variable).

  **3. The Single Feature**
  *   **Feature:** The divergent archival rule defining the term's conditions of application.
  *   **Collapse:** If the Archives are identical, Social Externalism yields "Same Content." All three theories then agree (Same, Same, Same). The disagreement vanishes, and the seminar question becomes unanswerable. The archival divergence is the sole engine driving the wedge between Putnam and Burge.

  **4. Best Defense for the Losing Line (NKE)**
  *   **Defense:** Putnam might argue the case begs the question by assuming the Archive is merely descriptive. If the community treats the Archive as *constitutive* (i.e., "Type-K" *just means* what the Book says), then the social norm *determines* the extension. In World 2, "Type-K" literally refers to the disjunction (Granite or Diorite). If so, the physical stuff doesn't fix reference; the social rule does.
  *   **Does it land?** Partially. It challenges the setup's assumption that "Type-K" is a natural-kind term. However, if the term was introduced ostensively ("This stuff is Type-K") before the Archive existed, the causal history anchors the reference to the stuff, making the Archive's later expansion an error, not a redefinition. The defense lands only if we deny the causal history priority.

  **5. Verdict Origin**
  *   **Do verdicts fall out of theories?** Yes. The pattern (Internalism=Same, NKE=Same, SE=Different) is not rigged but derives from the core commitments:
      *   Internalism looks inward (Brain).
      *   NKE looks outward (Physical Stuff).
      *   SE looks outward (Social Norms).
  *   Since the case holds Brain and Physical Stuff constant while varying Social Norms, the theories *must* diverge exactly as described. Social Externalism is doing work Natural-Kind Externalism is not: it detects semantic differences in the absence of physical differences.
