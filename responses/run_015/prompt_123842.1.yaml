      *   User thinks: Tradition must come before Nation.
      *   Analysis: Hobsbawm is concrete (kilts, ceremonies). Anderson is abstract (cognitive mapping of belonging). It makes sense to start with the tangible (Hobsbawm) to build confidence before moving to the abstract (Anderson).
      *   Dependency: Understand "constructedness" in small rituals -> Apply "constructedness" to large identities.
      *   Sequence: 1. Intuition check (what feels old?) -> 2. Hobsbawm (the mechanism of invention) -> 3. Anderson (the mechanism of belonging) -> 4. Synthesis (how invented traditions sustain imagined communities).

