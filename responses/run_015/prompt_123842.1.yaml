      *   **Anderson (Imagined Communities):** Nations are imagined because members will never know most of their fellow-members, yet feel a communion. Key point: "Imagined" doesn't mean "fake," but "mentally constructed." It's about the *mode* of belonging, not the truth value.
      *   **Intersection:** Both challenge the primordialist view (nations/traditions are ancient and natural). Both suggest modern construction. Hobsbawm focuses on ritual/symbol; Anderson focuses on cognition/communication (though the user wants to skip print-capitalism mechanics).

