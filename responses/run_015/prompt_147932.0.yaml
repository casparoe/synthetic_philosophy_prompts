  (1) Translation into Evo-Devo Vocabulary

  In this framework, a scientific theory functions as a developing organism, its logical structure encoded like a gene regulatory network (GRN). Thought experiments are environmental perturbations applied to this theoretical organism to test its canalization. When a researcher runs a mental simulation, they subject the theory's GRN to stress, observing whether the phenotypic output (prediction) remains stable or shifts.

  The Norton-style view translates to strict canalization: the thought experiment reveals existing attractor states inherent in the theory's regulatory logic. No new empirical material is introduced; the outcome is deducible from initial conditions, much like a phenotype determined by the genome without environmental induction of new genetic material. The "knowledge" gained is confirmation of the theory's developmental robustness. It maps the valleys of the Waddington landscape but does not carve new ones.

  Conversely, the claim that thought experiments generate new empirical knowledge posits extreme phenotypic plasticity. It suggests mental manipulation alone can access regions of morphospace previously unreachable, effectively finding new fitness peaks without new mutations (empirical data). The perturbation induces a developmental reorganization revealing hidden capacities within the theoretical lineage. Predictive success acts as the fitness landscape, where surviving the perturbation indicates high fitness, but the debate centers on whether the landscape itself was altered or merely explored. If the thought experiment yields new empirical facts, it implies the theoretical organism possesses latent potentiality transcending its current genetic (premises) configuration, accessing a higher fitness peak through plasticity alone. If it is merely conceptual housekeeping, the trajectory was fixed at the zygote stage of the theory's formulation, and the thought experiment is just a stress test of existing buffering mechanisms. In the Norton view, the thought experiment is a stabilizing selection event, pruning unstable variants of the theory without altering the genotype. In the opposing view, the thought experiment acts as an inducer, triggering a switch in the GRN that produces a novel phenotype indistinguishable from one caused by mutation. The crucial question becomes whether the mental simulation imports energy from outside the system or merely redistributes internal potential energy.

  (2) Residue Report: Canalized vs. Untranslatable

  The translation maps cleanly where logical consistency mirrors developmental stability. A theory resisting counterfactual perturbation is highly canalized; its conclusions are buffered against noise. Treating "intuition" as a plastic response fits if we view cognitive flexibility as a mechanism for exploring morphospace without genetic change. However, this distorts the phenomenological feel of "seeing" a truth versus the mechanistic process of developmental switching.

  The critical untranslatable residue is normativity. Evo-devo describes how systems develop, not whether they *ought* to be believed. The philosophical debate hinges on justification: does the thought experiment warrant belief in new facts? Biological vocabulary lacks an equivalent for epistemic warrant. We can describe a phenotype as fit, but not as "justified." Similarly, "empirical fact" in philosophy implies a connection to external reality, whereas in this model, everything remains internal to the theory-organism's morphospace. There is no mechanism here for contacting the external environment except through "mutation" (actual data collection).

  Revealing a latent attractor *is* a significant developmental event, even if the genetic code didn't change. But philosophically, this isn't "empirical." The residue suggests the philosophical disagreement relies on a dualism between mind and world that evo-devo dissolves. The inability to translate "justification" indicates that the philosophical debate is often about social licensing of claims, not the cognitive mechanism itself. The residue isn't a defect of the biological vocabulary; it exposes that the philosophical claim of "new empirical knowledge" from pure thought is a category error, conflating internal rearrangement with external contact. The "newness" is merely the uncovering of hidden depths in the current basin of attraction, not a leap to a new peak. Consequently, the biological model treats the "insight" as a physiological state change, rendering the philosophical distinction between discovery and clarification moot.

  (3) Verdict

  The untranslatable residue is not a defect of the biological vocabulary but evidence that the original philosophical disagreement is less substantive than it appears. The insistence that thought experiments generate "new empirical knowledge" relies on a normative category—justification—that has no purchase in naturalistic descriptions of cognitive development.

  The evo-devo translation demonstrates that "new empirical facts" cannot emerge from internal perturbations alone. Just as an organism cannot evolve a new functional morphology without genetic mutation or environmental selection pressure, a theory cannot access new empirical truths without new data. What philosophers call "new knowledge" is simply the theory navigating its existing fitness landscape to find a more stable attractor. The Norton view wins by default in this ontology: thought experiments are stress tests of canalization, not engines of empirical discovery.

  Therefore, the philosophical tension is largely verbal. It arises from mistaking the exploration of internal morphospace for contact with external reality. My biological vocabulary is not missing normative structure; it correctly identifies that normativity is an external overlay on a descriptive process. The debate persists only because philosophers treat theories as abstract propositions rather than developing systems. Once viewed as organisms, the "magic" of the thought experiment vanishes, leaving only the mechanics of developmental buffering.
