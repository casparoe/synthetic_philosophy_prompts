answer: |-
  **Mark: 17/20**
  **Grade: A-**

  **Comments:**

  This is a sophisticated piece of writing that engages deeply with the logic of the prompt. You have avoided the trap of treating "art" and "propaganda" as separate genres, and you have successfully integrated Du Bois's criteria of Beauty and Truth into the definition of propaganda itself rather than treating them as external moral constraints. However, there is a logical tension between your definition of propaganda in part (i) and your assessment of efficacy in parts (ii) and (iv).

  **Part (i) [5/5]**
  You answer the question precisely. You correctly identify that the shift Du Bois demands is from a binary choice (art *or* propaganda) to a qualitative choice (*which* propaganda). Your characterization of the person who wants to make "art not propaganda" is excellent: you show that on Du Bois's terms, this position is not a neutral escape but a political act that supports the status quo ("treating that arrangement as the settled background"). This captures the force of Du Bois's literal claim without needing outside context.

  **Part (ii) [4/5]**
  Your reading here is strong: you argue that Beauty and Truth are conditions of success for propaganda, not extra hurdles. This fits Du Bois's insistence that propaganda must "do its work." However, you make one claim that is logically vulnerable: *"A work that is ugly or false does not change how people see, and so does not do what propaganda is for."* This is an empirical claim about how influence works. You assert that falsehood *cannot* change vision. While this fits Du Bois's idealism, it sets up a contradiction for part (iv). You have defined the success of propaganda here as dependent on its ability to change vision, and you claim false work lacks this ability.

  **Part (iii) [6/6]**
  This section applies your reading from (ii) consistently. You prioritize the second novel because it meets the criteria of Beauty and Truth, arguing that these qualities are necessary for the propaganda to endure and actually shift vision. You acknowledge the risk (misreading) but argue that the clumsy novel fails *as propaganda* because it preaches only to the converted. This is a coherent application of your argument that propaganda is about *effective* vision-shaping, not just messaging.

  **Part (iv) [2/4]**
  This is where the tension in your argument becomes clear. The prompt describes a book that is false but *does* influence readers ("readers come away thinking slightly worse").
  *   **The Drift:** In part (i), you defined propaganda by its effect ("in virtue of what it does to its audience"). In part (ii), you claimed false work "does not change how people see." In part (iv), you are presented with a false work that *does* change how people see.
  *   **The Problem:** You call this "failed propaganda" because it is false. This is a valid moral judgment, but it conflicts with your earlier definition. If propaganda is defined by effect (part i), and the book has an effect (part iv), then by your own definition it has succeeded as propaganda, even if it is morally bad. To call it "failed," you have quietly shifted the definition of "success" from *influence* to *moral alignment with Truth*.
  *   **The Missed Opportunity:** The prompt asks if your answer to (ii) still looks right. You say "Yes," but you do not address the contradiction regarding efficacy. A stronger answer would acknowledge that the book *succeeds* as influence (propaganda in the sense of part i) but *fails* Du Bois's specific criteria for *good* propaganda (part ii). By insisting it is simply "failed propaganda," you gloss over the danger Du Bois is actually pointing at: that false art *can* work effectively, which is why Truth is a necessary check.

