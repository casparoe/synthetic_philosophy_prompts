  ### The Lathe Question: What Work Is Each Concept Doing?

  | Concept | Where it Starts | What Belongs (Extension) | When it Ends | Borrowed Answers |
  | :--- | :--- | :--- | :--- | :--- |
  | **Biological** | (Unanswered) | Interbreeding population | (Unanswered) | Borrows Start/End from Evolutionary (lineage split/extinction). |
  | **Skeptic** | (None) | (None) | (None) | Borrows nothing; treats all boundaries as arbitrary. |
  | **Phylogenetic** | Diagnostic mutation | Smallest diagnosable cluster | (Unanswered) | Borrows End from Extinction (disappearance of cluster). |
  | **Evolutionary** | Lineage separation | Ancestral-descendant chain | Lineage extinction | Answers all three; defines the "beam" itself. |
  | **Ecological** | Niche occupation | Organisms filling the role | Niche vacancy | Borrows Start/End from Ecological stability metrics. |
  | **Pluralism** | (Varies) | (Varies) | (Varies) | Borrows all from the concept chosen for the specific case. |

  ### Flags & Warnings

  **Indistinguishable Leaves:**
  *   **Evolutionary vs. Phylogenetic:** In practice, a "separate lineage" (EvSC) usually looks like a "diagnosable cluster" (PSC). Volunteers routing to either leaf will often end up counting the same things, though for different reasons. The tree separates them by *why* you count (history vs. diagnosis), not *what* you count.

  **Undefended Combinations:**
  *   **Sex Required + Hybrid Acceptance:** The tree structure prevents this (Q1=No leads away from Q3). Defending this would require arguing that sex defines species boundaries, but mixed ancestry doesn't violate them. This is rarely defended because it undermines the "isolation" mechanism of the Biological concept. Guess: **Incoherent**.
  *   **Skeptic + High Effort:** A volunteer routing to Skeptic but answering "No" to Saturday Morning applicability (wanting rigorous proof for an arbitrary category) is psychologically unstable. Guess: **Unattractive**.

  **Warning for the Committee:**
  *   **The Lichen Trap (Q4):** This question forces a choice between genetic lineage (Fungus) and functional unit (Lichen). Be aware that mycologists and ecologists in the room will answer differently by training, not just philosophy. This isn't a bug; it's the Pluralism leaf waiting to happen.
  *   **The Salamander Trap (Q2):** If volunteers answer "No" (One species) despite no interbreeding, they aren't necessarily Skeptics; they might be prioritizing *continuity* (Evolutionary). However, since they already demanded Sex in Q1, they lack the theoretical framework to justify continuity without interbreeding. They land in Skeptic by elimination.
