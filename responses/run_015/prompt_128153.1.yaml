      The attrition test proposes shifting focus from the killer's mind to the group's survival. Under this view, an episode counts as genocidal when its destructive footprint foreseeably cuts short the group's persistence as a distinguishable group. This measures the actual difference the conduct makes to the group's numbers and cohesion. However, this test introduces profound measurement problems. It requires courts to adjudicate counterfactuals: would this group have persisted for two more generations absent these policies? Such judgments are speculative and vulnerable to bias. Experts might disagree on what constitutes the life expectancy of a culture. Furthermore, this standard risks converting misfortune into crime. If a group dissolves due to economic assimilation, disease, or environmental ruin caused by non-malicious development, the attrition test might label these tragedies as atrocities. It blurs the line between criminal agency and historical change. A legal system cannot easily punish foreseeable outcomes without proving the actor aimed for them. If the label depends on consequences, then every policy that inadvertently thins a people becomes suspect. The attrition test captures the moral horror of disappearance but lacks the judicial tools to distinguish between murder and mortality. It demands a certainty about the future of human groups that no court can reliably produce. Administratively, it would overwhelm tribunals with demographic debates rather than evidence of guilt. It turns judges into sociologists predicting the lifespan of cultures, a task for which they have no training and no data. The test is morally intuitive but legally unworkable.

      (5) Two Cases
      Consider a state besieging a region inhabited by a distinct minority. The army claims it is targeting combatants, not the group, but the blockade causes mass starvation that dissolves the community. The intent standard misses this; there is no order to destroy the people. The attrition test catches it; the footprint eliminates the group. The survivors starve regardless of the general's state of mind. Now consider a second case. A globalized market floods a remote valley with cheap goods and digital media. The local tribe abandons its language and disperses to cities for work. The group ceases to exist as a distinguishable unit. The attrition test catches this too; the footprint is total dissolution. But this feels wrong. There is no criminal here, only the slow pressure of modernity. The first case reveals the blind spot of the intent rule: it lets indifferent killers off the hook. The second case reveals the overreach of the attrition rule: it criminalizes historical change. The intent standard fails the starving minority; the attrition standard fails the tribe facing modernization. One lets murder pass as war; the other calls evolution a crime. Both tests reveal that no single metric captures the full moral landscape of group destruction. We are left with a choice between a law that is too blind to see neglect and a law that is too blind to see context.

      (6) My Verdict
      The concept should keep its narrow, intent-centered shape for legal prosecution, but the public vocabulary must expand to carry the moral load. We cannot uncouple the label from the duty to act, but we must stop treating the legal definition as the ceiling of moral outrage. Prosecutors should continue to demand proof of specific intent to ensure fair trials and secure convictions. They must not dilute the charge to the point where it cannot be proven. However, newsroom editors and diplomats should not wait for a court to name the horror. They should use descriptive language that conveys the destructive footprint without risking legal overreach. When a group is foreseeably erased by neglect, editors should call it a crime against humanity or a campaign of terror, detailing the consequences without relying on the genocide label to trigger conscience. The split works like this: the courtroom protects the word's precision, while the public square uses multiple words to describe the full range of destruction. A prosecutor looks for the smoking gun of intent. An editor looks for the body count and the vanished villages. Both serve justice, but only if they stop expecting one word to do all the work. The law needs boundaries; morality needs breadth. On Monday morning, the prosecutor charges what can be proven, and the editor prints the truth of the suffering regardless of the charge. The headline should describe the ruin, not just the legal category. This preserves the law's integrity while honoring the victims' reality.

