answer: |-
  The asymmetry you identify is real for specific artifacts but illusory for the system as a whole, because the human comprehension deferred in Turing cases is itself a product of the comprehension-eliminating process you identify in Darwin.

  In your enzyme kinetics terms, a specific allosteric inhibitor binds without understanding the pathway, just as a CPU executes logic without understanding the algorithm. You are correct that the CPU's program usually originates from an engineer who *does* understand the logic, whereas the enzyme's structure originates from a history of differential retention where no agent understood the pathway. This makes the Turing case *deferred* competence at the level of the artifact, while the Darwinian case is *eliminated* competence at the level of the artifact. However, the engineer's brain is itself a biological machine composed of competences (neural circuits, protein interactions) that operate without comprehension. If you trace the provenance of the engineer's design capability back far enough, you encounter the same blind variation and selection that produced the enzyme. Therefore, the Turing inversion is not a separate category but a specialized subsystem nested within the Darwinian inversion.

  Regarding your skyhook question: yes, if you treat the programmer as an unexplained origin point—a mind that exists outside the causal chain of physical selection—then that mind is a skyhook. In that scenario, Turing's inversion is incomplete because it relies on a magical reservoir of comprehension to write the code. But if the programmer is a natural entity, their ability to design is itself a competence built by evolution. Consequently, the Turing case collapses into the Darwinian one whenever the programmer's provenance is accounted for physically. The only way to maintain the asymmetry as fundamental is to posit a dualistic break where mind enters the universe ex nihilo, which is precisely the skyhook Dennett argues against.

  On the question of selection smuggling comprehension back in: this occurs only if you reify "fitness" as a forward-looking force rather than a backward-looking statistic. Selection is a filter, analogous to a sieve or a chromatography column; it retains what passes and discards what does not, without representing the criteria for retention. If you describe selection as "choosing" the fit or "seeking" adaptation, you are using a shorthand that attributes the comprehension located in the observer to the mechanism itself. In a strict mechanistic reading, selection is simply differential reproduction driven by physical constraints. It generates the appearance of goal-directedness (teleology) without requiring a goal, much like a feedback loop stabilizes a concentration without "knowing" the set point.

  What turns on this distinction is whether you require a dualistic explanation for human intelligence. If the asymmetry were fundamental, human comprehension would remain a miracle distinct from biological competence. By recognizing that the engineer's comprehension is itself borrowed from lower-level uncomprehending processes, you preserve a single continuous ontology: all competence, from enzyme binding to software design, rests on layers of blind variation and retention.
