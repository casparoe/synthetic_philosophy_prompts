answer: |-
  ### Logical Space Analysis

  Before drawing the tree, we must map the independent dimensions of disagreement. Most anthropic views are combinations of answers to these five questions:

  1.  **Indexical Evidence:** Does the fact "I exist" (or "I am having this experience") update physical priors?
      *   *Yes:* SIA, FNC, Some Thirders.
      *   *No:* SSA, Halfers, "Just Physics".
  2.  **Observer Counting:** If a hypothesis creates more observers, is it *a priori* more likely to be true given my existence?
      *   *Yes:* SIA.
      *   *No:* SSA, "Just Physics".
  3.  **Reference Class:** (For SSA) Who counts as a potential "me"?
      *   *Narrow:* Only observers with identical evidence.
      *   *Broad:* All conscious beings, or all humans.
  4.  **Infinity Handling:** How to compare finite vs. infinite observer counts?
      *   *Dominance:* Infinite hypothesis goes to probability 1 (SIA standard).
      *   *Regularization:* Measure problem requires cutoffs; probabilities undefined or stay at prior.
  5.  **Metaphysics of Credence:** Is there a fact of the matter about "belief" distinct from "action"?
      *   *Yes:* Standard Epistemology.
      *   *No:* Decision-Theoretic approaches (UDT/ADT).

  **Unavailable Combinations:**
  *   **SIA + Doomsday Acceptance:** Incoherent. SIA boosts hypotheses with more observers; Doomsday requires penalizing them.
  *   **SSA + Presumptuous Philosopher Acceptance:** Incoherent. SSA penalizes large populations; Presumptuous Philosopher relies on boosting them.
  *   **Decision Theory + Specific Credence:** If you choose the DT leaf, you reject the premise that there is a "credence number" independent of the bet structure.

  ---

  ### The Decision Tree Handout

  **Instructions:** Start at **Node 1**. Answer the question based on your intuition about the case. Follow the arrow to the next Node or to a **Leaf**. Do not worry about technical names; just answer the case.

  *   **Node 1: The Black-Beard Incubator**
      A fair coin is flipped.
      *   **Heads:** A machine creates **one** observer with a black beard.
      *   **Tails:** A machine creates **two** observers, both with black beards.
      *   You wake up in a room. You look in a mirror: you have a black beard. You know the setup.
      *   **What is your credence the coin landed Heads?**
      *   (A) **1/2** (The coin is fair; my beard doesn't change that.) → Go to **Node 2**.
      *   (B) **1/3** (I'm more likely to be one of the two observers if Tails.) → Go to **Node 5**.
      *   (C) **I don't assign credences, only choose policies.** → Go to **Leaf 9**.

  *   **Node 2: The Doomsday Trade-Off**
      You answered 1/2 above. Now consider this pair:
      *   **Doomsday:** If humanity lasts longer, there are more total humans. Does your birth rank make early doom more likely?
      *   **Presumptuous Philosopher:** If Theory A predicts 1 trillion observers and Theory B predicts 100 trillion, should you be 100x more confident in B just because you exist?
      *   **Which bullet do you bite?**
      *   (A) **Accept Doomsday, Reject Presumptuous Philosopher.** → Go to **Node 3**.
      *   (B) **Reject Doomsday, Accept Presumptuous Philosopher.** → Go to **Leaf 7** (You are an SIA-Halfer hybrid; rare).
      *   (C) **Reject Both.** (My existence isn't data about population size.) → Go to **Leaf 4**.

  *   **Node 3: The Reference Class**
      You accept Doomsday (SSA path). Who counts as a "potential you" for the sampling?
      *   **Case:** You are a human physicist.
      *   (A) **Only observers with my exact evidence (black beard, physicist, etc.).** → Go to **Leaf 1**.
      *   (B) **All conscious observers (aliens, sims, etc. count).** → Go to **Leaf 2**.

  *   **Node 4: The Sleeping Beauty Check**
      You rejected Doomsday and Presumptuousness ("Just Physics"). One last check:
      *   **Case:** Coin flipped. Heads: Wake Monday. Tails: Wake Monday & Tuesday (memory wiped). You wake up.
      *   **Credence in Heads?**
      *   (A) **1/2.** → **Leaf 4** (Consistent No-Update).
      *   (B) **1/3.** → **Leaf 8** (Inconsistent: You act like a Thirder but reject the reasoning. "Beauty-Only Thirder").

  *   **Node 5: The Unborn Crowd**
      You answered 1/3 on the Incubator (SIA path).
      *   **Case:** Fair coin.
      *   **Heads:** You are created and woken once.
      *   **Tails:** You are created and woken once. **One year later**, 1,000 other observers just like you are created and woken once.
      *   You wake up. You don't know the year.
      *   **Credence in Heads?**
      *   (A) **~1/1000** (Tails is vastly more likely because more observers exist.) → Go to **Node 6**.
      *   (B) **1/2** (Future observers don't count for *my* current existence.) → Go to **Leaf 6**.

  *   **Node 6: The Endless Room**
      You weight by total observers.
      *   **Case:** Two hypotheses about the universe. Equal prior physical evidence.
      *   **Finite:** Contains $10^{100}$ observers.
      *   **Infinite:** Contains $\infty$ observers.
      *   **Does the Infinite hypothesis go to probability 1?**
      *   (A) **Yes.** (Infinity dominates.) → **Leaf 3**.
      *   (B) **No.** (Probabilities break/need regularization.) → **Leaf 5**.

  *   **Node 7: The Reasoning Check** (For the SIA path)
      *   **Why did you answer 1/3 on Node 1?**
      *   (A) **Because there are more observers in Tails.** → Go to **Node 6**.
      *   (B) **Because my specific evidence is more likely to be instantiated.** → Go to **Leaf 5** (FNC Path).

  ---

  ### The Leaves

  1.  **SSA (Narrow Reference Class)**
      *   *Commitment:* I am a random sample from observers with my exact evidence.
      *   *Awkward Commitment:* I must believe humanity is likely to go extinct soon (Doomsday).
  2.  **SSA (Broad Reference Class)**
      *   *Commitment:* I am a random sample from all conscious beings.
      *   *Awkward Commitment:* Alien simulations affect my credence about human physics.
  3.  **SIA (Standard)**
      *   *Commitment:* Hypotheses are weighted by the total number of observers they contain.
      *   *Awkward Commitment:* I must be certain the universe is infinite if that's an option (Presumptuous Philosopher).
  4.  **No-Anthropic-Update ("Just Physics")**
      *   *Commitment:* My existence is not data; only third-person physical evidence counts.
      *   *Awkward Commitment:* I cannot explain why I am surprised to win a lottery with 1-in-a-billion odds if I exist to observe it.
  5.  **Full Non-Indexical Conditioning (FNC)**
      *   *Commitment:* I condition on the fact that *someone* has my exact evidence, not just that *I* exist.
      *   *Awkward Commitment:* Mathematically often matches SIA, but breaks down differently on infinite cases.
  6.  **SIA (Future-Skeptic)**
      *   *Commitment:* Count observers, but only those causally accessible or simultaneous.
      *   *Awkward Commitment:* Arbitrary cutoff: why does a observer created in 1 hour count but 1 year not?
  7.  **SIA-Halfer Hybrid**
      *   *Commitment:* Weight by observers (SIA) but accept Doomsday constraints.
      *   *Awkward Commitment:* Logically unstable; usually collapses into SSA or SIA under pressure.
  8.  **Beauty-Only Thirder**
      *   *Commitment:* Update on awakenings, but not on existence alone.
      *   *Awkward Commitment:* Inconsistent treatment of "observer moments" across cases.
  9.  **Anthropic Decision Theory (ADT/UDT)**
      *   *Commitment:* There is no "credence"; there is only the optimal policy for agents like me.
      *   *Awkward Commitment:* Cannot answer "What do you believe?" without knowing the bet payouts.

