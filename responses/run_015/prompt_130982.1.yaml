  ### Where This Tree Is Most Likely Wrong

  **The Weakest Branch:** **Node 7 / Leaf 5 (FNC vs. SIA).**
  In the simple cases provided (Incubator, Unborn Crowd), Full Non-Indexical Conditioning (FNC) and the Self-Indication Assumption (SIA) often produce identical numerical answers. FNC argues you condition on "someone has my exact evidence," while SIA argues you weight by "number of observers." In cases where all observers have the *same* evidence (like the Black-Beard Incubator), these are mathematically equivalent.
  *   **What would change it:** If a student argues, "My answer is 1/3, and I don't care if you call that SIA or FNC," the tree forces a distinction that doesn't feel real to them. To truly separate them, you need a case where observer evidence *diverges* (e.g., "God's Coin Toss" where observers see different colors). If your group pushes back on Node 7, collapse Leaf 5 into Leaf 3 and note that FNC is a *justification* for SIA rather than a distinct *position* in this context.

  **Mapping Uncertainty:** **Leaf 7 (SIA-Halfer Hybrid).**
  This leaf captures people who answer 1/2 on the Incubator (SSA-like) but Reject Doomsday/Accept Presumptuous Philosopher (SIA-like). This is logically tense. In a room of grad students, you may find nobody actually stays here; they will realize the tension and migrate to Leaf 1 (SSA) or Leaf 3 (SIA). It is included to catch the "I want the benefits of both" intuition, but it may be an unstable equilibrium.

  **Unseparable Pair:** **SIA vs. FNC.**
  As noted above, without a "divergent evidence" case, these two views sit in the same box. If you want to force them apart, you must add a node where the number of observers differs from the number of observers *with my specific evidence*. (e.g., "100 observers see Red, 1 sees Blue. You see Blue." SIA and FNC might diverge on how to weight the '1' vs the '100' depending on formulation). For a 9-leaf handout, this nuance is likely too fine, so expect overlap.
