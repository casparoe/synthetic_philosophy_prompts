  **DRAFT // ADVERSARIAL COLLABORATION STATEMENT (v.3)**
  **Subject:** The Absent-Minded Driver (AMD) Case
  **Parties:** The Retentionist Camp (R) / The Dissociationist Camp (D)
  **Status:** Pending final wording on Crux 2. Do not circulate.

  **PREAMBLE**
  We are tired of the citation wars. We agree to isolate the exact mechanism of disagreement regarding agency during highway hypnosis. Below is the baseline we can both sign without crossing our fingers.

  **I. AGREED CLAIMS (THE COMMON GROUND)**
  1.  **Physical Continuity:** The vehicle remains in motion along a highway network regardless of the driver's conscious engagement. The motor systems (hands, feet, eyes) remain coupled to the machine.
  2.  **Phenomenological Gap:** There is a measurable period during which the driver reports no conscious experience of driving, followed by a "waking up" moment (usually triggered by a mismatch between expected and actual signage).
  3.  **Correction Frequency:** In a majority of observed cases, once the driver "wakes up," they successfully correct course to reach the original destination, even if significant distance was covered during the gap.
  4.  **No Amnesia:** The driver does not forget the destination *concept* (e.g., "I was going to Mom's house"), but loses the active, foregrounded plan of *how* to get there moment-to-moment.

  **II. DISAGREEMENTS TABLE (WORDING SPLITS)**
  *We cannot agree on a single sentence here. We list the divergent descriptions side-by-side.*

  | Feature | Retentionist Wording (R) | Dissociationist Wording (D) |
  | :--- | :--- | :--- |
  | **The Status of the Goal** | The goal remains active in a **standing intention** state, suppressed from consciousness but retaining causal power. | The goal is **latent information**, accessible but not currently driving the system; the system is running open-loop. |
  | **The "Shadow" Driver** | The motor system is an **instrument** of the hidden intention. | The motor system is a **proxy agent** operating on local cues only. |
  | **The "Waking Up"** | Re-integration of conscious oversight with a **persisting plan**. | Recruitment of high-level cognition to **repair a drift** caused by lack of oversight. |
  | **Agency** | Agency is **continuous** but sub-conscious. | Agency is **interrupted**; behavior is maintained by habit loops, not agency. |

  **III. THE THREE CRUXES**
  *Where the collaboration usually breaks down. We need to settle these to move forward.*

  **Crux 1: The U-Turn Mechanism**
  *Scenario:* The driver zones out, passes the exit, "wakes up," and immediately performs a U-turn to go back.
  *   **R Position:** The U-turn proves the intention never left. It was waiting in the wings. The moment consciousness flagged the error, the standing intention reclaimed control. The vector was always there.
  *   **D Position:** The U-turn is post-hoc repair, not evidence of prior guidance. The system drifted until a conflict signal (signage mismatch) triggered a generic "error correction" protocol. You don't need a standing intention to fix a mistake, you just need to notice the mistake.
  *   *Stalemate:* Does the correction imply the goal was holding the line, or just that the goal was recalled once the error was spotted?

  **Crux 2: Environmental Scaffolding**
  *Scenario:* Heavy signage, clear lane markings, low traffic. Driver zones out but stays in lane and follows curves perfectly.
  *   **R Position:** The environment supports the intention, but does not replace it. The driver is still "steering" via a hidden loop. Remove the intention, and the car drifts even with signs.
  *   **D Position:** The road drives the car. The signs and lane markings provide enough affordances that the motor system can navigate without *any* internal plan. The driver is just a biological component in the highway machine.
  *   *Stalemate:* How much of the navigation is internal vs. outsourced to the asphalt? (Note: we need to stop using the word "outsourced" it's too loaded).

  **Crux 3: The "Ghost Exit" Test Case**
  *Scenario:* Driver intends to take Exit 42. Misses it while zoned out. Exit 42 is actually closed (unknown to driver). However, there is an unmarked service road 200m past the exit that merges onto a back-route. This back-route *only* works if you navigate specific turns correctly to reach the original destination. The driver, still largely zoned out/unaware they missed the exit, takes this service road and navigates the back-route successfully.

  *   **R Prediction:** The driver will take the service road because the **standing intention** recalculates sub-consciously. The goal (Destination) is still active, so when the primary path (Exit 42) fails, the hidden planning system finds the secondary path without conscious input. She gets there *because* she intended to.
  *   **D Prediction:** The driver will likely miss the service road too, or take it by luck/habit. If she succeeds, it is because the **local cues** (signs on the service road) guided her turn-by-turn, not because she "knew" the destination. If the signs were removed, she would fail. She gets there *despite* lacking intention.
  *   *The Bet:* If we strip the signage on the back-route, R says she still finds the way (internal map). D says she gets lost (no internal map).

  **NEXT STEPS**
  We need to agree on whether "sub-conscious recalculation" is a coherent phrase or if it's just magic words for "habit."
  Also, check the typo in section 1 claim 4 (concept vs concpet? no looks ok).
  Let's meet Tuesday. Don't bring the 1998 draft again.
