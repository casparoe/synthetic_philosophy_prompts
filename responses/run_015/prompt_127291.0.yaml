prompt: |-
  I was arguing with my roommate about whether morality is objective and she sent me this summary she gotten from a philosophy podcast about WEIRD psychology and cross-cultural moral differences. She says Henrich and others showed that Western, educated populations score really high on care and fairness but basically near zero on loyalty, authority, and sanctity, while non-Western groups weight all five foundations more evenly with the binding ones usually dominating. Then she claims this disproves moral objectivism, because if there was one true morality every culture should rank these foundations identically, and since they don't, moral truth must be locally constructed rather than universal. She also brought up Shweder's autonomy, community, and divinity framework and said autonomy ethics are literally existant outside WEIRD societies, which explains why Westerners misread other cultures as lacking ethics altogether when they just organize around different values. There's this extra bit about the binding foundations being evolutionary older, shared with primate hierarchies, and Western individualism being a recent cultural overlay that suppresses them. I feel like there's a sleight of hand somewhere between describing differences and disproving universals, but I can't pin it down. Could you go through this and tell me which parts are accurate, which are overstatements or misreadings, and whether her conclusion that objectivism is empirically refuted actually follows from the research?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** The user is arguing with a roommate about moral objectivism vs. relativism/constructivism.
      *   **Roommate's Argument:** Uses Moral Foundations Theory (MFT - Haidt, Henrich, etc.) and Shweder's ethics (Autonomy, Community, Divinity).
      *   **Roommate's Claims:**
          1.  WEIRD (Western, Educated, Industrialized, Rich, Democratic) populations score high on Care/Fairness (Individualizing) but near zero on Loyalty/Authority/Sanctity (Binding).
          2.  Non-Western groups weight all five evenly, with Binding dominating.
          3.  This variation *disproves* moral objectivism (if objective, rankings should be identical).
          4.  Autonomy ethics are non-existent outside WEIRD societies.
          5.  Binding foundations are evolutionary older/primate-based; Western individualism is a recent overlay suppressing them.
      *   **User's Intuition:** Feels like a "sleight of hand" between describing differences and disproving universals.
      *   **Task:** Evaluate accuracy of claims, identify overstatements/misreadings, and assess whether the conclusion (objectivism is empirically refuted) follows from the research.

  2.  **Deconstruct the Roommate's Claims vs. Academic Consensus:**

      *   *Claim 1: WEIRD score near zero on Binding foundations.*
          *   **Fact Check:** This is an exaggeration. MFT research (Haidt, Graham, etc.) shows WEIRD populations score *lower* on Binding foundations compared to Non-WEIRD, but not "near zero." Conservatives in the West also score higher on Binding than Liberals. "Near zero" implies non-existence, which is false.
          *   **Verdict:** Overstatement/Exaggeration.

      *   *Claim 2: Non-Western groups weight all five evenly with Binding dominating.*
          *   **Fact Check:** Generally supported. Cross-cultural studies (e.g., in India, Brazil, East Asia) show a more balanced profile or a tilt toward Binding foundations compared to Western Liberals. However, "evenly" might be too strong; it varies by specific culture.
          *   **Verdict:** Mostly accurate, but nuanced.

      *   *Claim 3: Variation disproves moral objectivism (If objective, rankings should be identical).*
          *   **Fact Check:** This is the philosophical leap. Moral Objectivism (Realism) doesn't necessarily require universal *agreement* or identical *weighting* of intuitions. It requires that moral truths exist independently of belief. Disagreement implies error or different applications, not necessarily absence of truth (analogy: scientific disagreement doesn't disprove objective physical reality). Also, MFT describes *psychological intuitions*, not necessarily *moral truths*.
          *   **Verdict:** Non-sequitur/Philosophical Category Error.

      *   *Claim 4: Autonomy ethics are non-existent outside WEIRD societies.*
          *   **Fact Check:** Shweder's "Ethic of Autonomy" is dominant in the West, but elements exist elsewhere (e.g., urban elites, specific contexts). Saying they are "literally non-existent" is too strong. However, as a *dominant cultural framework*, it is largely WEIRD.
          *   **Verdict:** Overstatement.

      *   *Claim 5: Binding foundations are evolutionary older/primate; Individualism is a recent overlay.*
          *   **Fact Check:** Haidt argues this. Primate hierarchies show authority/loyalty behaviors. Individualism is historically recent (Enlightenment/Industrial).
          *   **Verdict:** Generally accurate within the framework of Evolutionary Psychology/MFT.

  3.  **Address the Core Philosophical Question (Objectivism vs. Empirical Variation):**
      *   The "Is-Ought" problem (Hume). Descriptive facts (how people *do* behave) do not automatically dictate normative truths (how people *should* behave).
      *   Moral Objectivism can accommodate disagreement (e.g., people disagree about math, but math is objective).
      *   MFT is a theory of *moral psychology* (descriptive), not *meta-ethics* (normative). Using it to settle meta-ethics is a category mistake.

