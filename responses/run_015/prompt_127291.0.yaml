answer: |-
  Your intuition is spot on. There is indeed a "sleight of hand" here, specifically a category error between **descriptive psychology** (how people *do* make moral judgments) and **normative meta-ethics** (whether moral truths *exist*).

  Your roommate has accurately summarized a significant chunk of contemporary moral psychology, but she is making a philosophical leap that the data does not support. Here is a breakdown of what is accurate, what is exaggerated, and why the conclusion doesn't follow.

  ### 1. The Empirical Claims (Psychology & Anthropology)

  **Claim:** *WEIRD populations score high on Care/Fairness but "near zero" on Loyalty/Authority/Sanctity.*
  *   **Verdict:** **Exaggeration.**
  *   **Analysis:** This is the weakest empirical link in her argument. Research by Jonathan Haidt and Jesse Graham shows that Western *liberals* score significantly lower on the "binding foundations" (Loyalty, Authority, Sanctity) than conservatives or non-Western populations. However, "near zero" is factually incorrect. Even Western liberals utilize these foundations (e.g., loyalty to a sports team, authority of a judge, sanctity of a corpse), they just weight them less heavily in *political* moral judgments. Furthermore, Western *conservatives* score highly on all five. Since "WEIRD" includes conservatives, saying the whole population scores near zero on binding foundations is false.

  **Claim:** *Non-Western groups weight all five foundations more evenly, with binding dominating.*
  *   **Verdict:** **Mostly Accurate.**
  *   **Analysis:** Cross-cultural studies (in India, Brazil, East Asia, etc.) generally support this. In many traditional societies, moral matrices are more "holistic," integrating individual rights with duties to the group, hierarchy, and sacred order. The "Individualizing" foundations (Care/Fairness) are not absent, but they are not the sole arbiters of morality as they often are in Western liberal discourse.

  **Claim:** *Autonomy ethics (Shweder) are literally non-existent outside WEIRD societies.*
  *   **Verdict:** **Overstatement.**
  *   **Analysis:** Richard Shweder's framework (Autonomy, Community, Divinity) is robust. It is true that the *Ethic of Autonomy* (morality based on individual rights and harm) is the dominant cultural script in the West. However, claiming it is "literally non-existent" elsewhere ignores urban elites, globalized sectors, and historical precedents in non-Western philosophy (e.g., certain schools of Buddhist or Confucian thought that value individual cultivation). It is *dominant* in the West, not *exclusive* to it.

  **Claim:** *Binding foundations are evolutionary older/primate; Individualism is a recent overlay.*
  *   **Verdict:** **Accurate (within the framework).**
  *   **Analysis:** This is standard Evolutionary Psychology. Primate hierarchies display clear markers of authority and loyalty (coalitions). The hyper-individualistic "autonomy" ethic is historically recent, gaining traction with the Enlightenment and industrialization. Henrich's book *The WEIRDest People in the World* argues specifically that the Western Church's marriage policies dismantled extended kin networks, forcing a psychological shift toward individualism.

  ### 2. The Philosophical Leap (The "Sleight of Hand")

  This is where your roommate's argument falls apart. She moves from **"People disagree about morality"** to **"There is no objective morality."**

  **The Category Error: Descriptive vs. Normative**
  Moral Foundations Theory (MFT) is a **descriptive** theory. It maps the psychological taste buds we use to *taste* morality. It does not tell us which tastes correspond to actual nutritional value (moral truth).
  *   **Analogy:** If you went around the world and measured what people *believe* causes disease (spirits, bad air, germs), you would find massive variation. In some cultures, "germ theory" scores near zero. Does this variation disprove the objective existence of viruses? No. It just proves that human intuition about disease is culturally variable and often wrong.
  *   **Application:** Similarly, variation in moral intuitions proves that moral *psychology* is variable. It does not prove that moral *truths* (if they exist) are variable. An objectivist would argue that cultures weighting "Authority" over "Care" might simply be **mistaken**, just as a culture believing the earth is flat is mistaken.

  **The "Universal Agreement" Fallacy**
  She claims: *"If there was one true morality every culture should rank these foundations identically."*
  *   **Verdict:** **False.**
  *   **Analysis:** Moral Objectivism (Realism) does not require universal consensus. It requires that moral propositions have truth values independent of belief.
      *   **Math/Science:** People disagree about math and science across cultures and history. Does that make math subjective? No.
      *   **Application:** Objectivists argue that moral progress is possible (e.g., abolishing slavery). If morality were purely locally constructed, "progress" would just mean "change." The fact that we can critique past cultural norms (like slavery or foot-binding) using cross-cultural standards suggests we are appealing to something beyond local custom.

  **MFT Was Not Designed to Refute Objectivism**
  Ironically, Jonathan Haidt (the primary creator of MFT) is not a moral relativist. He is a moral **pluralist**. He argues that there are multiple objective values (Care, Fairness, Liberty, Loyalty, Authority, Sanctity) and that different societies balance them differently. He explicitly argues against the idea that the Western "Care/Fairness" matrix is the *only* valid one, but he does not claim that *no* matrix is valid. He argues that ignoring the binding foundations leads to social dysfunction, implying there is an objective functional truth to social cohesion.

  ### 3. Does the Research Refute Objectivism?

  **No.** The research refutes **Moral Intuitionism** as a sole guide to truth, but not Objectivism itself.

  1.  **Intuitions are not Truths:** MFT shows that our moral *feelings* are culturally tuned. An objectivist can accept this. They would argue we need reason to override faulty intuitions (just as we use reason to override the intuition that the sun revolves around the earth).
  2.  **Convergent Evolution:** Some objectivists argue that despite surface differences, deep moral structures converge (e.g., all societies prohibit unprovoked murder within the in-group). The variation is often in the *scope* of the "in-group," not the fundamental principle of cooperation.
  3.  **The "Is-Ought" Problem:** You cannot derive an "ought" (morality is relative) from an "is" (cultures differ). To conclude relativism from diversity is a logical fallacy unless you add the premise "If cultures differ, no truth exists," which is easily disproven by looking at non-moral facts (e.g., cosmology).

  ### Summary for Your Argument

  You can tell your roommate she is right about the **sociology** but wrong about the **philosophy**.

  *   **Agree with her on:** WEIRD psychology is an outlier; Westerners over-index on Autonomy/Care; Binding foundations are evolutionarily older; Shweder's framework explains cross-cultural misunderstanding.
  *   **Push back on:**
      1.  **The "Near Zero" Claim:** Westerners (especially conservatives) still use binding foundations; they aren't zero.
      2.  **The Inference:** Disagreement does not equal non-existence of truth. (Use the disease/germ analogy).
      3.  **The Definition:** MFT measures psychological *inputs*, not moral *outputs*. Showing that people process data differently doesn't prove there is no correct answer to the equation.

  **The Bottom Line:** The research shows that **moral access** is culturally mediated. It does not show that **moral truth** is culturally constructed. Her argument proves that we are bad at *seeing* objective morality, not that it isn't there.
