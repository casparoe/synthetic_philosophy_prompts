  *Let's finalize the "Assume Breach" point.* If the *code* is the attacker, "Assume Breach" means "Assume the code will escape." If you assume the code will escape, you don't give it network access. The VP is saying "Assume the code will try to escape, so we will watch it." That's "Detect and Respond," not "Assume Breach." "Assume Breach" implies the controls *have failed*.

