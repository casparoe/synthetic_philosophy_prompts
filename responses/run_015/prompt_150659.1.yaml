  2.  **Medium:** (2) vs. (6). Claiming the law/accident distinction is pragmatic seems to clash with making science objective, though this is a standard debate within Humeanism.
  3.  **Low:** (1) vs. (6). Asserting a unique best compression risks ignoring ties, which could undermine the objectivity you claim in (6) if multiple systems fit equally well.

  The pair in (2) and (6) is only apparently in conflict because pragmatic selection criteria like simplicity can yield an objective winner when the mosaic data is sufficiently constraining.

  The cheapest single revision is to modify (5) to ground counterfactuals in the inference rules licensed by the Best System itself, rather than committing to the existence of other actual regions. This preserves the explanatory power of (4) without bloating your ontology or violating your actualist constraint in (3).
