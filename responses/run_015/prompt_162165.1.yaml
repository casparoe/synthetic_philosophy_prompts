      *   **The "Already-Mourned" Move:** Analyze this specific principle. Dismantle it. Louise's grief $\neq$ Hannah's pain. In fact, it adds to the total suffering count (Louise suffers pre-emptively + in the moment). The time loop doesn't erase the leukemia.
      *   **The Sentimental Smuggle:** The film argues love justifies pain. NU says no. Point to the ending montage. The film asks us to cheer for a decision that NU views as a moral failure (creating a victim).
      *   **Where the Film Resists/Adds:** The concept of *affirmation*. NU is about calculation; *Arrival* is about acceptance. The film suggests that to refuse the joy because of the pain is to refuse life itself. This is a non-utilitarian value (meaning/coherence over welfare).
