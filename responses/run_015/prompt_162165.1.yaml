  4.  **Evaluate the "Already-Mourned-Child Move" through the Lens:**
      *   *Does it hold up?* No. From a strict NU perspective, Louise's anticipatory grief is *additional* suffering. It doesn't cancel out Hannah's leukemia/death. It just means Louise enters the contract with open eyes.
      *   *Is it an excuse?* The time structure removes *ignorance*, not *consequence*. NU cares about the consequence (Hannah's pain), not the knowledge state of the parent (unless ignorance leads to more suffering).
      *   *Sentimentalism:* The film definitely argues that the *love* justifies the *loss*. NU argues that love cannot lexically outweigh the suffering of a child dying at 12.

  5.  **Identify Where the Film Resists/Adds to the Lens:**
      *   *Agency vs. Fatalism:* The film suggests that knowing the future doesn't mean you can (or should) change it. It treats time as a block universe. NU is usually consequentialist (act to minimize future suffering). If the future is fixed, is there moral agency? The film says "Yes, embrace it." NU says "If it's fixed, it's tragic; if it's not, prevent it."
      *   *The Value of Experience:* The film posits that the *experience* of the life (the joy) is valuable enough to warrant the *end* of the life (the pain). NU denies this trade-off.
      *   *What NU misses:* The phenomenology of commitment. The idea that a life is a whole, not a sum of pleasure/pain units. The film argues for the integrity of the narrative arc over the utility of the moments.

  6.  **Address the "Weapon" Ambiguity:**
      *   Is it a MacGuffin? In the film, the "weapon" is the language (gift of prophecy). China thinks it's a physical weapon to be used.
      *   Ethical relevance: The "weapon" is the ability to see time. This ability *causes* Louise's dilemma. If the weapon is dangerous (as China fears), giving it to humanity might cause global conflict (suffering). Louise prevents the war.
