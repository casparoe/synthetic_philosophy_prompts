      *   **Ethical Lens:** Suffering-focused ethics / Negative Utilitarianism (NU). Core tenet: Intense suffering matters more (lexically) than happiness. Creating a being destined to suffer/die young is a serious moral cost.
      *   **Specific Concept to Evaluate:** The "already-mourned-child move." Does Louise's pre-lived grief offset the moral cost of creating Hannah? Does it change the nature of the choice?
      *   **Key Questions:**
          *   Does Louise's choice reject NU?
          *   Does the time structure excuse her?
          *   Does the "already-mourned" principle hold up, or is it a confusion between anticipatory grief and actual suffering?
          *   Does the film smuggle in sentimentalism (parental love > child's pain)?
          *   Where does the film resist this lens? (Is it actually about grief/metaphor rather than procreation ethics?)
          *   What does the film add to ethics that NU misses? (Owe to futures, love vs. impersonal suffering).
          *   Where does it get ethics wrong/change the subject?
