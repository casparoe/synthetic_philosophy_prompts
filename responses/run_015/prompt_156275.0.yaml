  I'm giving my job-market paper at the philosophy of physics seminar next thursday — audience is mostly grad students plus two faculty members who are pretty hard-line substantivalists about spacetime structure, though one has written on Mach's principle. My thesis is a relationist interpretation of Newton's bucket, but not the usual distant-stars version. I claim the concavity of the rotating water is explained by local thermodynamic shear gradients at the water-bucket boundary, which generate an effective inertial potential without invoking absolute space or any refrence to distant matter. I call this the boundary-layer relationist model, and I know it risks sounding like I'm just smuggling absolute acceleration back in under a different name.

  Can you prep me for the objections they'll actually raise — in their vocabulary, things like diffeomorphism invariance, structural realism, or the hole argument? I want them ordered by how damaging they are, with a short reply for each and a note on where that reply is weakest. I also need to know what I should concede up front, what is the one reply that absolutely has to land, and the killer objection I'm praying nobody asks. Please write in British English, and also say how confident you are in your answer while flagging the specific point you're least sure about.
