answer: |-
  ### Desiderata for a Contractualist Resolution of the Aggregation Problem

  To evaluate any proposed solution to the aggregation problem within a Scanlonian framework, the following five specifications must be met. Each desideratum identifies a specific moral phenomenon, the conceptual distinction it protects, and its status relative to the core commitments of contractualism.

  **1. The Numerical Sensitivity Requirement**
  *   **Phenomenon:** The Standard Rescue Scenario (e.g., a choice between saving one identified individual or five identified individuals from equivalent harm).
  *   **Distinction:** Distinguishes between the *intrinsic weight* of a single individual's claim and the *decision-guiding force* generated when multiple individuals hold analogous claims.
  *   **Status:** **Negotiable Preference.** While strongly aligned with common-sense morality, strict contractualists (like Taurek) deny this is required. However, for contractualism to remain a plausible general theory of wrongness, it is highly desirable that it accommodates the intuition that numbers count in some capacity without abandoning individualism.

  **2. The Individualist Foundation Requirement**
  *   **Phenomenon:** The Standard Rescue Scenario and cases of Sacrificial Trade-offs (e.g., killing one to harvest organs for five).
  *   **Distinction:** Preserves the *Separateness of Persons*, ensuring that the moral force of a claim arises from the status of the individual holder, not from their contribution to a collective sum of value.
  *   **Status:** **Non-Negotiable.** This is the defining commitment of contractualism. Any solution that treats individuals as mere receptacles for value or allows a greater sum of benefits to automatically override a serious individual loss collapses into utilitarianism and abandons the contractualist project.

  **3. The Pairwise Structural Requirement**
  *   **Phenomenon:** Cases of Asymmetric Interdependence (e.g., risk imposition where the harm to A depends on the actions of B and C, or where harms are probabilistically distributed).
  *   **Distinction:** Maintains the distinction between *direct pairwise comparison* (comparing the burden to one person against the burden to another) and *indirect aggregation* (summing burdens across a group to compare against a single burden).
  *   **Status:** **Non-Negotiable.** Scanlon's formula relies on the idea that principles are justified to each person individually. Justification must be grounded in relations between specific agents and specific claimants (or representative positions), not in a global calculus of total welfare.

  **4. The Diachronic Compatibility Requirement**
  *   **Phenomenon:** Intergenerational Cases involving the Non-Identity Problem (e.g., policy choices that determine which future individuals come into existence, where those individuals cannot claim they were harmed by being brought into existence compared to non-existence).
  *   **Distinction:** Distinguishes between *person-affecting reasons* (claims based on harm to a specific existing individual) and *impersonal reasons* (claims based on the state of the world), ensuring the theory does not rely on direct pairwise comparison where no specific counterpart exists.
  *   **Status:** **Non-Negotiable.** A complete moral theory must address obligations to future persons. If the resolution of aggregation relies on strict identity-tracking pairwise comparison, it will fail in non-identity cases where the "five" and the "one" do not exist in both alternative scenarios.

  **5. The Burden Asymmetry Requirement**
  *   **Phenomenon:** Cases of Small Losses for Many vs. Catastrophic Loss for One (e.g., imposing a minor cost on a million people to save one person from death).
  *   **Distinction:** Differentiates between the *magnitude of the harm* suffered by an individual and the *number of individuals* suffering that harm.
  *   **Status:** **Non-Negotiable.** Contractualism is explicitly designed to handle cases where aggregation seems permissible (many small losses) versus impermissible (one life). A resolution to the aggregation problem must not render the theory insensitive to the qualitative difference between death and minor inconvenience, regardless of numbers.

  ***

  ### The Joint Unsatisfiability Tension

  There is a substantive tension between the **Numerical Sensitivity Requirement**, the **Individualist Foundation Requirement**, and the **Pairwise Structural Requirement**. Given Scanlon's commitment to pairwise justifiability, we face a trilemma. If we maintain strict **Pairwise Structure** and the **Individualist Foundation**, we are restricted to comparing the complaint of the single victim against the complaint of *one* of the five victims. In a standard rescue case where the harm is identical (death), the complaints are equal in weight. To satisfy **Numerical Sensitivity** (save the five), one must either (a) aggregate the complaints of the five, which violates the **Individualist Foundation** by treating them as a collective unit, or (b) argue that the presence of others changes the weight of the individual's complaint, which strains the **Pairwise Structural Requirement** by making the justification depend on facts external to the specific pair being compared. Consequently, a contractualist theory cannot simultaneously satisfy strict pairwise comparison, non-aggregative individualism, and the robust intuition that numbers always decide in standard rescue cases. One of these three elements must be relaxed or reinterpreted.

  ***

  ### Scorecard of Competing Approaches

  **Scanlon's Weighted Reasons View**
  Scanlon's later work attempts to satisfy Numerical Sensitivity without violating the Individualist Foundation by arguing that the presence of others makes a principle more "reasonable to reject" due to the cumulative burden of living under such a principle, rather than summing the harms themselves. This preserves the Pairwise Structural Requirement formally, as the comparison remains between a representative individual and the agent. However, it struggles with the Diachronic Compatibility Requirement; because it relies on the complaints of specific individuals, it has difficulty grounding obligations in Non-Identity cases where the specific individuals in the "five" group would not exist under the alternative principle. It successfully navigates Burden Asymmetry but leaves the mechanism for Numerical Sensitivity somewhat opaque, risking a covert collapse into aggregation.

  **Taurek's Non-Aggregation View**
  Taurek's position rigorously upholds the Individualist Foundation and the Pairwise Structural Requirement by denying the Numerical Sensitivity Requirement entirely. In standard rescue scenarios, Taurek argues for a coin toss, asserting that there is no "super-lose" to the group that outweighs the loss to the one. This approach is conceptually clean regarding the Separateness of Persons and avoids the tension of joint unsatisfiability by simply rejecting one horn of the trilemma. However, it fares poorly on the Burden Asymmetry Requirement in reverse; if numbers never count, it becomes difficult to explain why we should not save the one from death rather than the million from minor headaches, unless a threshold of harm is introduced, which Taurek resists. It is the most internally consistent but least intuitively plausible regarding rescue cases.

  **Threshold Contractualism**
  Threshold approaches attempt to satisfy Numerical Sensitivity and Burden Asymmetry by allowing aggregation only when individual stakes fall below a certain threshold of significance. This handles the Small Losses for Many case well and preserves the Individualist Foundation for serious harms (like death). However, this view faces significant friction with the Pairwise Structural Requirement. Establishing a threshold often requires a metric of value that is external to the pairwise comparison of reasons, effectively reintroducing a form of utilitarian calculus for low-stakes cases. Furthermore, like Scanlon's view, it struggles with the Diachronic Compatibility Requirement, as the threshold is typically applied to existing claimants, leaving obligations to future non-identical persons under-theorized. It offers the best practical fit for common sense but the weakest structural fit for strict contractualism.
