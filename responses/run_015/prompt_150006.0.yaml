prompt: |-
  I am currently in a graduate seminar on contemporary moral philosophy that focuses on T.M. Scanlon’s contractualist framework, and for the next unit we are examining the aggregation problem—specifically, whether the pairwise justification constraint at the heart of contractualism can accommodate the intuition that saving five lives generates stronger moral reasons than saving one, without collapsing into a form of utilitarian aggregation.

  Before I assess the competing responses—Scanlon’s own appeal to weighted reasons, the Taurek-style denial that numbers count, and more recent “threshold contractualist” proposals that try to make the force of a reason sensitive to how many others share an analogous claim—I want to establish the standard of evaluation itself.

  Please write the full specification of desiderata that any adequate contractualist resolution of the aggregation problem must satisfy. For each requirement, include: the phenomenon or case it is meant to cover (the standard rescue scenario, but also cases of asymmetric interdependence in which harms are not independently distributed across victims, and intergenerational cases in which the non-identity problem undermines direct pairwise comparison); the distinction it must preserve (for example, between the weight of a single reason and its aggregative force, or between direct and indirect pairwise relations); and whether you regard it as non-negotiable given contractualism’s core commitments or as a negotiable preference of a particular camp. Then identify any subset of these desiderata that appears jointly unsatisfiable in light of Scanlon’s commitment to pairwise justifiability, and briefly explain the tension. Finally, provide a concise scorecard—no more than a short paragraph for each—of how Scanlon’s own view, Taurek’s position, and a threshold-sensitive contractualist approach fare against your list, but keep the conceptual weight on the criteria rather than on the scoring. Do not provide a bibliography, reading list, or citations; I need this to be usable without external access to the literature.
