      *   *The "In Virtue Of" Chain:* Grounding is usually taken to be well-founded (no infinite chains). Broader dependence might not be.
      *   *Example:* Supervenience. The mental supervenes on the physical. But does the mental *ground* the physical? No. Does the physical ground the mental? Usually yes. But what if there's mutual dependence (grounding holism)?
      *   *Crucial Point:* The argument for a fundamental base usually relies on the structural features of *grounding* (asymmetry, irreflexivity, well-foundedness). If we confuse grounding with looser forms of dependence, the argument for a base might fail (e.g., if dependence allows circles, a base isn't needed).

