      *   **Grounding:** This is a specific species of metaphysical dependence. It's usually characterized as non-causal, explanatory, hyperintensional, and irreflexive/asymmetric/transitive (typically). It's the "in virtue of" relation par excellence.
      *   **The Fundamental Base:** The idea that chains of dependence must stop somewhere (fundamentalia). If they don't, we have infinite descent or circles.

  3.  **Identify the Core Distinction:**
