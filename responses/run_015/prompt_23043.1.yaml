  I have only recently begun working in the metaphysics of grounding, and one distinction in the literature has been giving me trouble. Could you explain the difference between grounding and the broader notion of metaphysical dependence, and say why that difference is supposed to matter for the question of whether reality has a base of fundamental facts in which everything else is ultimately grounded?
