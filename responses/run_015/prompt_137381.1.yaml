prompt: |-
  I spent most of last evening arguing with a friend who works in brand marketing about whether an expensive gesture is automatically a credible one. Her position was that a firm willing to burn real money on a promise has thereby proved it means the promise; mine was that the burn proves nothing unless it hurts a firm that does not intend to follow through more than it hurts one that does. We got as far as agreeing on that differential-cost point — she conceded that a deep-pocketed company can buy exactly the same display as a sincere one — and then stalled on three things I could not settle. First, whether the cost has to be wasted in order to count: her examples were all pure waste (a huge advertising buy, absurd packaging, a monument of a headquarters), and she thought money spent on something that also makes the pledger better at delivering was not a real signal at all. Second, whether a costly gesture that nobody outside the counterparty ever learns about can signal anything, or whether it collapses into an ordinary contract term. Third, a case she raised that I had no answer to: some expensive things a company builds are partly what enable it to keep the promise in the first place, so the gesture does not merely reveal a quality that was already there but helps produce it. I suspect the biology literature on costly signaling and the handicap principle has something precise to say about all three, but please state whatever the relevant conditions are in plain English and do not hand me a reading list or citations — I have no way to chase them down, and I need questions I can ask, not authors I can read.

  The reason I need it operationalized is my day job. I direct a four-person program staff at a regional foundation that makes outcome-linked grants to service providers; roughly sixty applications a year arrive with some kind of commitment attached — money placed in escrow, refunds promised if targets are missed, assets built or dedicated, public pledges with named deadlines. My staff have program and field backgrounds and no economics; each of us has about twenty-five minutes per application; every decision over two hundred fifty thousand dollars goes to a board that wants a single page of written rationale; and we are currently using an in-house scoring sheet whose largest single component is the headline dollar figure attached to the commitment, weighted more heavily than whether the commitment is even verifiable. I now think that weighting is close to backwards, and I want to replace it. So please write me a decision procedure my team can actually run: the questions in the order they should be asked, what counts as a sufficient answer to each, where the procedure stops with a no, where it hands the decision to a person because the question is one of values rather than facts, and what to write down when a number we need simply is not in the documents. It has to be usable by someone who has never heard the theory, it should say which distinctions genuinely have to survive that simplification and which can be dropped, and it should be honest about the places where its central estimate is guesswork dressed up as procedure.

  Then run it on three commitments of the kinds we actually see, telling me what verdict each gets and why. One: a large national provider places two million dollars of its own reserves with an independent trustee for three years, forfeited automatically if a named, independently verified service target is missed. These are my own favorite category, and I want to know whether the procedure endorses them or tells me that for a firm with that balance sheet the differential cost is close to zero. Two: a mid-sized provider spends about a million and a half building an internal data and case-tracking system it says is required to hit the target, on hardware and software it would keep and use elsewhere if the grant ended tomorrow. Three: a small nonprofit with very thin reserves offers, in a binding but confidential filing, to repay the entire grant plus twenty percent if the verified outcome is not met, and asks that the pledge never be publicized because it would alarm its own donors and clients. I want the third case to force the procedure to say what a costly but invisible pledge actually is, and whether a pledge that would bankrupt the pledger is worth anything given that there would be nothing left to collect. Please also tell me plainly what the procedure cannot tell us: which kinds of commitment it is simply the wrong instrument for, where the honest answer is that we do not know, and which of our existing categories should probably be retired rather than scored.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Profile:** Director of a 4-person program staff at a regional foundation. Makes outcome-linked grants.
      *   **Problem:** Current scoring system overweights the *headline dollar figure* of a commitment (e.g., escrow, penalties) without considering *credibility* or *differential cost*. Staff have no economics background, limited time (25 mins/app), and need a 1-page rationale for the board.
      *   **The Debate:** User argued with a brand marketing friend about "costly signaling." Friend says "burning money = credible." User says "burning money only matters if it hurts a faker more than a sincere actor" (differential cost). They agreed on differential cost but stalled on three specific theoretical points (waste vs. investment, privacy/visibility, dual-purpose assets).
      *   **The Ask:**
          1.  Explain the three stalled theoretical points in plain English (biology/handicap principle context) without citations/reading lists.
          2.  Create an *operational decision procedure* (checklist/flowchart style) for the staff to use. Needs to be simple, time-bound, distinguish fact vs. value, and admit uncertainty.
          3.  Run the procedure on three specific cases provided (Large National Provider Escrow, Mid-sized Provider IT System, Small Nonprofit Confidential Penalty).
          4.  Explain limitations (what the procedure *can't* do).

  2.  **Deconstruct the Theoretical Stalls (The "Biology" Part):**
      *   *Point 1: Waste vs. Investment.* The friend thinks only "wasted" money counts (handicap). The user suspects money spent on capability (investment) might also signal.
          *   *Theory:* In biology, a peacock's tail is a handicap (pure cost). But building a strong immune system is also costly and signals health, yet it *helps* survival.
          *   *Translation:* A signal works if it's *harder for a low-quality actor to afford* than a high-quality one. It doesn't have to be "waste." If building the capability is too expensive for a faker but affordable for a sincere actor, it signals sincerity *and* creates capacity. The key is *marginal cost relative to type*, not whether the money disappears.
      *   *Point 2: Visibility/Privacy.* Can a secret signal work?
          *   *Theory:* Signaling usually requires a receiver. If no one sees it, it's not a signal to the market, but it *is* a signal to the specific counterparty (the foundation). However, if it's confidential, it loses "reputational collateral."
          *   *Translation:* A secret pledge binds the pledger to *you*, but it doesn't bind them to the *public*. If they fail, they pay you, but their reputation stays intact. Public pledges add reputational risk, making the signal stronger. Secret pledges are just contracts.
      *   *Point 3: Dual Purpose (Enabling the Promise).* Does building the thing that makes the promise possible count as a signal?
          *   *Theory:* This is the "investment vs. signal" overlap. If the asset is specific to the promise, it's sunk cost. If it's reusable, it's less risky.
          *   *Translation:* If they build a system *only* for this grant, it's a strong signal (sunk cost). If they build a system they can use for *anything*, it's a weaker signal because they keep the value even if they fail. However, if the system is *necessary* to succeed, buying it shows commitment to the *method*, not just the outcome.

  3.  **Develop the Decision Procedure (The "Tool"):**
      *   *Constraints:* 25 minutes, non-economists, 1-page output.
      *   *Goal:* Shift from "How big is the number?" to "How painful is this number if they fail?"
      *   *Structure:*
          1.  **The Pain Test (Differential Cost):** Is this money hard for *them* to lose compared to a faker?
          2.  **The Sunk Test (Recoverability):** If they fail, do they lose the value, or keep it?
          3.  **The Audience Test (Visibility):** Who knows? Does reputation matter to them?
          4.  **The Bankruptcy Test (Collectability):** If they fail, is there actually money to collect?
      *   *Scoring:* Instead of adding dollars, assign "Credibility Weights" (High/Med/Low/None).
      *   *Stop Rules:* If "Collectability" is No, stop. If "Pain" is Low, downgrade heavily.

  4.  **Run the Procedure on the Three Cases:**
      *   *Case 1 (Large National, $2M Escrow):*
          *   Pain: Low (Deep pockets).
          *   Sunk: High (Forfeited).
          *   Audience: High (Independent trustee/verified).
          *   Bankruptcy: Low risk.
          *   *Verdict:* Strong mechanism, but weak signal *relative to size*. It's a contract, not a handicap. Don't overweight the $2M just because it's $2M.
      *   *Case 2 (Mid-sized, $1.5M IT System):*
          *   Pain: Medium (Significant spend).
          *   Sunk: Low (Reusable hardware/software).
          *   Audience: Low (Internal).
          *   Bankruptcy: N/A.
          *   *Verdict:* This is capacity building, not a penalty signal. Good for success probability, bad for "skin in the game" on failure. Score as "Capacity," not "Commitment."
      *   *Case 3 (Small Nonprofit, Confidential Repayment):*
          *   Pain: Extreme (Bankruptcy).
          *   Sunk: High (Cash).
          *   Audience: None (Confidential).
          *   Bankruptcy: High risk (If they fail, they bust, you get nothing).
          *   *Verdict:* Theoretically strong signal (desperation), practically weak (uncollectible). It's a "Hail Mary." High risk.

  5.  **Identify Limitations (The "Honesty" Part):**
      *   Can't predict future financial health.
      *   Can't measure reputational damage precisely.
      *   Can't distinguish between "bold confidence" and "delusional gambling."
      *   Retire the "Headline Dollar" metric entirely.

  6.  **Drafting the Response (Iterative Refinement):**
      *   *Tone:* Professional, direct, operational, respectful of the user's expertise.
      *   *Section 1: The Theory (Plain English).* Address the three stalls directly. Use the "Faker vs. Sincere" framing.
      *   *Section 2: The Procedure.* Make it a checklist. Use "Stop" commands. Define what to write on the 1-pager.
      *   *Section 3: The Cases.* Apply the checklist rigorously.
      *   *Section 4: Limitations.* Be blunt about what we can't know.

      *(Self-Correction during drafting)*: I need to make sure I don't just say "differential cost." I need to explain *how* a non-economist assesses that in 25 minutes. They can't run a financial model. They need proxies.
      *   *Proxy for Differential Cost:* "Is this sum material to their operating budget?"
      *   *Proxy for Waste vs. Investment:* "If they fail, do they keep the asset?"
      *   *Proxy for Visibility:* "Who finds out if they miss the target?"

      *(Refining Case 3)*: The user specifically asked about the "bankrupt the pledger" scenario. The procedure needs to flag that a penalty larger than ability to pay is *noise*, not signal. It's a "cheap talk" promise because it's unenforceable in reality.

      *(Refining the "Waste" argument)*: The friend thinks waste is required. The biology answer is: Waste is *one way* to ensure differential cost, but not the only way. Investment works if the investment is *specific* to the task. I need to make sure the procedure distinguishes "General Asset" vs. "Specific Asset."

  7.  **Final Review against Constraints:**
      *   No citations? Check.
      *   Plain English? Check.
      *   Operational procedure? Check.
      *   Three cases analyzed? Check.
      *   Limitations stated? Check.
      *   Time limit respected (procedure must be fast)? Check.

  8.  **Final Polish:** Ensure the distinction between "Signaling Success" (I can do it) and "Signaling Commitment" (I will pay if I don't) is clear. The foundation cares about outcomes, so both matter, but differently. The current scoring sheet conflates them. The new procedure must separate them. (Decided to focus heavily on the "Skin in the Game" aspect as per the prompt's focus on commitments/penalties).

      *Wait, one nuance:* The prompt asks about the biology literature specifically regarding the three stalls.
      1.  *Waste:* Handicap principle says the cost must be *net* cost. But "investment" can be a signal if it's *sunk* and *specific*.
      2.  *Privacy:* Signals need receivers. Private signals bind only the receiver.
      3.  *Dual Purpose:* If the trait helps survival *and* signals, it's still a signal if the cost is differential.
      *Okay, I will integrate this into the "Theory" section simply.*

      *Let's build the Procedure.*
      Step 1: Verify Existence (Is it real?)
      Step 2: Assess Pain (Materiality)
      Step 3: Assess Sunkness (Recoverability)
      Step 4: Assess Visibility (Reputation)
      Step 5: Assess Collectability (Solvency)
      *Stop rules included.*

      *Let's write the 1-page rationale guide.*
      *   "Commitment Quality Score" instead of "Dollar Amount."

      *Okay, ready to write.*
answer: |-
  ### Part 1: The Three Theoretical Stalls (In Plain English)

  You were right about the differential cost. In biology, a signal (like a peacock's tail) is credible only if it is too expensive for a "low quality" male to fake. Your friend was stuck on the idea that the cost must be *waste*. Here is how the biology resolves your three stalls:

  1.  **Waste vs. Investment:** The cost does **not** have to be waste. It has to be *sunk*. A peacock's tail is waste (it makes him easier to eat). But a strong immune system is an investment (it keeps him alive). Both signal quality because a sickly peacock cannot afford to build either.
      *   *For you:* Money spent on a system that helps them deliver is a valid signal **if** a faker wouldn't buy it. If the system is reusable for other clients, a faker might buy it anyway to look good, so it's a weak signal. If the system is useless without *this* grant, it's a strong signal because it's a sunk bet.
  2.  **Visibility (Public vs. Private):** A signal requires a receiver. A private pledge signals only to you. A public pledge signals to the market (donors, clients, peers).
      *   *For you:* A private pledge creates legal liability but no reputational liability. A public pledge creates both. A faker fears reputational ruin more than legal bills (which they can dodge via bankruptcy). Public commitments are stronger signals because they risk the firm's future ability to raise money.
  3.  **Dual Purpose (Enabling the Promise):** You asked if building the thing that *makes* the promise possible counts as a signal. Yes, but only if the cost is *specific*.
      *   *For you:* If they build a generic warehouse, they keep the warehouse if they fail. That's not skin in the game; that's asset accumulation. If they burn cash on a custom process that vanishes if the grant ends, that is skin in the game. The signal is strong when the money disappears upon failure.

  ***

  ### Part 2: The Decision Procedure (The "Skin-in-the-Game" Checklist)

  **Time Limit:** 25 Minutes
  **Goal:** Replace "Dollar Amount" with "Credibility Weight."
  **Output:** A 1-Page Rationale for the Board.

  **Instructions for Staff:** Do not add up the dollars. Answer these five questions in order. If you hit a **STOP**, the commitment gets a "Low" or "None" credibility score regardless of the dollar amount.

  #### Step 1: The Collectability Test (The "Bankruptcy" Check)
  *Question:* If the provider misses the target and owes the penalty, do they have the liquid assets to pay it *without* ceasing operations?
  *   **Look at:** Current cash reserves vs. penalty amount.
  *   **Pass:** Penalty is < 50% of unrestricted net assets.
  *   **Fail:** Penalty > 100% of unrestricted net assets (They go bust).
  *   **STOP RULE:** If **Fail**, mark Credibility = **None**. A promise to pay money they don't have is noise. Write: *"Penalty exceeds solvency threshold; uncollectible in failure scenario."*
  *   **If Pass:** Move to Step 2.

  #### Step 2: The Pain Test (The "Differential Cost" Check)
  *Question:* Is this money painful for *this specific organization* to lose?
  *   **Look at:** The penalty/escrow amount as a percentage of their annual operating budget.
  *   **High Pain:** > 10% of annual budget. (A faker wouldn't risk this).
  *   **Med Pain:** 2% – 10% of annual budget.
  *   **Low Pain:** < 2% of annual budget. (A deep-pocketed faker treats this as a fee).
  *   **Note:** If "Low Pain," do not score the dollar value. Score the *mechanism* only.
  *   **Move to Step 3.**

  #### Step 3: The Sunk Test (The "Waste vs. Asset" Check)
  *Question:* If they fail, do they lose the value of the commitment entirely, or do they keep an asset?
  *   **Option A (Sunk):** Cash escrow, forfeited funds, custom staff training, specialized equipment with no resale value. -> **Strong Signal.**
  *   **Option B (Recoverable):** General IT hardware, buildings, vehicles, staff they can redeploy. -> **Weak Signal.** (They keep the toy even if they break the promise).
  *   **Action:** If Option B, downgrade the commitment weight by half. It is capacity building, not a penalty.
  *   **Move to Step 4.**

  #### Step 4: The Audience Test (The "Reputation" Check)
  *Question:* Who knows about this pledge?
  *   **Public:** Named in annual report, press release, or public contract. -> **Strong Signal.** (Reputational collateral).
  *   **Private/Confidential:** Only the Foundation knows. -> **Weak Signal.** (Legal collateral only).
  *   **Action:** If Private, mark as "Contractual Only." Do not count it as reputational signaling.
  *   **Move to Step 5.**

  #### Step 5: The Verdict & Rationale
  *Assign a Credibility Weight:*
  *   **High:** Pass Step 1 + High Pain + Sunk + Public.
  *   **Medium:** Pass Step 1 + Med Pain OR (High Pain + Recoverable Asset).
  *   **Low:** Pass Step 1 + Low Pain OR (Private/Confidential).
  *   **None:** Fail Step 1.

  *Write the 1-Page Rationale:*
  1.  **State the Mechanism:** (e.g., "$2M Escrow").
  2.  **State the Weight:** (High/Med/Low/None).
  3.  **Justify the Weight (Not the Dollars):** "Although the dollar figure is high, it represents <2% of their budget (Low Pain). However, the funds are sunk and public (Strong Mechanism). Net Weight: Medium."
  4.  **Flag Uncertainty:** "Assumption: Their reserve figures are accurate as of [Date]."

  ***

  ### Part 3: Running the Procedure on Your Three Cases

  #### Case 1: Large National Provider ($2M Escrow, 3 Years)
  *   **Step 1 (Collectability):** Pass. (Large national provider, likely has reserves).
  *   **Step 2 (Pain):** **Low Pain.** For a "large national provider," $2M is likely <2% of operating budget. To them, this is a parking fee, not a threat.
  *   **Step 3 (Sunk):** **Sunk.** Cash forfeited to trustee.
  *   **Step 4 (Audience):** **Public.** (Implied by "independently verified service target").
  *   **Verdict:** **Medium Credibility.**
  *   **Why:** The mechanism is robust (cash is gone if they fail), but the *differential cost* is low. A competitor with bad intentions could afford to lose $2M just to win the contract.
  *   **Rationale to Board:** "Commitment is mechanically secure but financially immaterial to the provider. It guarantees administrative compliance but does not prove high conviction in outcomes. Score as a standard contract clause, not a high-stakes signal."

  #### Case 2: Mid-Sized Provider ($1.5M Internal Data System)
  *   **Step 1 (Collectability):** N/A (No cash penalty, it's an investment).
  *   **Step 2 (Pain):** **Med Pain.** $1.5M is significant for a mid-sized org.
  *   **Step 3 (Sunk):** **Recoverable.** Hardware/software kept if grant ends. This is an asset, not a penalty.
  *   **Step 4 (Audience):** **Private.** Internal system.
  *   **Verdict:** **Low Credibility (as a signal), High Value (as capacity).**
  *   **Why:** This fails the "Skin in the Game" test. If they fail the target, they keep the servers. They haven't risked loss; they've just bought tools. This should be scored under "Organizational Capacity," not "Commitment/Risk."
  *   **Rationale to Board:** "Applicant is investing in capacity, not posting collateral. This increases probability of success but offers no financial recourse if they fail. Do not count toward 'Commitment' score; count toward 'Readiness' score."

  #### Case 3: Small Nonprofit (Confidential Repayment + 20%)
  *   **Step 1 (Collectability):** **Fail.** "Thin reserves" + "Bankrupt the pledger." If they miss, they cease to exist. You cannot collect from a ghost.
  *   **Step 2 (Pain):** **Extreme.** (But irrelevant due to Step 1).
  *   **Step 3 (Sunk):** **Sunk.** (Cash).
  *   **Step 4 (Audience):** **Private.** (Confidential filing).
  *   **Verdict:** **None Credibility.**
  *   **Why:** This is the "Hail Mary." It signals desperation, not confidence. Because it is confidential, there is no reputational check. Because it triggers bankruptcy, there is no collectability. It is "cheap talk" dressed as a penalty.
  *   **Rationale to Board:** "Penalty exceeds solvency. In a failure scenario, the organization dissolves and funds are unrecoverable. The confidentiality clause removes reputational pressure. This commitment provides no actual security to the Foundation."

  ***

  ### Part 4: What This Procedure Cannot Tell You (Limitations)

  You need to be honest with your board about where this tool is blind.

  1.  **It Cannot Detect Delusion:** A CEO might genuinely believe they won't fail, so they sign a bankruptcy-inducing penalty (Case 3) thinking it's safe. The procedure marks this as "None" because the *math* says they can't pay, but it can't measure the *confidence*. Sometimes delusional confidence leads to breakthrough results. Sometimes it leads to waste. We don't know.
  2.  **It Cannot Value Reputation:** We treat "Public" as a binary (Yes/No). In reality, a scandal in a small niche community hurts more than a scandal in the national news. We are simplifying reputational risk because we can't measure it in 25 minutes.
  3.  **It Cannot Predict Financial Fraud:** The procedure relies on the financial documents they give you. If Case 1 hides their debt off-balance-sheet, the "Pain Test" is wrong. We assume the audited numbers are real.
  4.  **It Cannot Measure "Mission Alignment":** A commitment might be financially credible but ethically misaligned (e.g., they will hit the target by creaming the easiest clients). This procedure measures *financial* skin in the game, not *programmatic* integrity.

  ### Recommendations for Your Scoring Sheet

  1.  **Retire:** "Headline Dollar Figure of Commitment." It is actively misleading.
  2.  **Replace With:** "Commitment Credibility Weight" (High/Med/Low/None) based on the checklist above.
  3.  **Add Category:** "Capacity Investment." Move Case 2 type commitments here. They are good, but they are not *risk*.
  4.  **Board Instruction:** Tell the board that a "Low Credibility" commitment does not mean "Don't Fund." It means "Do not rely on this commitment as security." Fund based on the program merit, but acknowledge the financial risk is on the Foundation, not the provider.

  This procedure shifts your staff from asking "How big is the number?" to "How much does this actually hurt them if they fail?" That is the only question that separates a signal from a display.
