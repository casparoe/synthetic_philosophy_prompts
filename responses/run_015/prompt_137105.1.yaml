  **MEMORANDUM**

  **TO:** Campus Food and Wellness Committee
  **FROM:** Undergraduate Student Representative
  **DATE:** October 23
  **SUBJECT:** Recommendation on Verdant "Streak Prompt" Proposal

  **Recommendation**
  I recommend that the Committee **approve the "Streak Prompt" pilot for an eight-week term**, contingent on three binding conditions regarding data usage, future UX modifications, and opt-out permanence. We should schedule a mandatory review at Week 10 of the spring term to evaluate renewal or termination.

  **Context and Status Quo**
  We are not deciding whether to nudge students; we are deciding which nudge governs. Currently, 60% of transactions flow through Verdant's app, where fries and a regular soda are the one-tap default. This is a substantive nudge favoring specific caloric outcomes. Two Taps proposes interrupting a *pattern* of choices (five days running) with a neutral prompt asking students to confirm or switch. This does not prescribe a outcome (salad vs. fries), but it does prescribe a moment of reflection.

  **The Autonomy Argument**
  Two Taps and their faculty allies argue this proposal reduces paternalism. Their strongest point is that the status quo already substitutes judgment for the student by making the less healthy option the path of least resistance. The streak prompt differs from the rejected "salad default" because it does not swap the choice; it swaps the *mode* of choosing from habitual to reflective.

  Philosophically, this distinguishes between *substituting judgment* (classic paternalism) and *bypassing judgment* (manipulation). The salad default substitutes judgment by deciding for you. The streak prompt risks bypassing judgment by manufacturing doubt, but it leaves the final verdict to the user. If autonomy requires that choices align with our higher-order desires rather than mere habit, interrupting a non-reflective pattern can be autonomy-promoting. The "dismiss three times" clause further respects negative liberty—the right to be left alone.

  **The Manipulation and Washout Objections**
  However, Prof. Halvorsen's "washout objection" must be granted its full weight. If Verdant and Two Taps did not expect this prompt to improve health outcomes, they would not invest in building it. Claiming procedural neutrality is therefore partly fictional; there is a substantive hope behind the procedure. Furthermore, targeting a *pattern* rather than a single choice encodes a judgment that repeated choices are suspect—that a student eating fries five days in a row is acting out of habit rather than preference. For students who genuinely prefer fries, this manufactures friction where none was warranted.

  This risk is compounded by the coercive context of our dining system. On-campus residents are required to purchase meal plans, and off-campus options are logistically difficult (25-minute bus ride). For first-years and athletes on mandatory plans, the app is not a optional tool but a gateway to nutrition. When exit is blocked, the duty to protect against manipulation increases. A prompt that feels like a "check-in" to a voluntary user may feel like surveillance to a captive one.

  **The Verdant Precedent**
  The most critical risk is contractual. Verdant's condition for building this feature is a randomized rollout to measure efficacy for sale to other campuses. Their contract currently grants them control over app UX. If we validate the principle that interrupting habits is permissible for student wellness, we establish a precedent Verdant can invoke to interrupt habits for *profit*. They have already hinted at using similar streak logic to upsell desserts or premium smoothies. If we approve this pilot without fencing off the mechanism, we authorize Verdant to treat student attention as a resource they can mine, whether for health or margin.

  **Conditions for Approval**
  To reconcile the potential for autonomy promotion with the risks of manipulation and corporate overreach, approval must be conditional:

  1.  **Mechanism Lock:** The Committee must secure a contractual amendment stating that the "streak interrupt" logic cannot be used for commercial upselling (e.g., desserts, premium items) without explicit Committee review. This separates wellness infrastructure from marketing infrastructure.
  2.  **Data Transparency:** Verdant must report not only on swap rates (fries to salad) but on friction metrics (dismissal rates, support tickets, sentiment). If the prompt creates significant resentment among captive students, it is failing the autonomy test regardless of health outcomes.
  3.  **Hard Opt-Out:** The "dismiss three times" rule must be mirrored by a permanent toggle in the app settings. Students should not have to trigger the prompt three times to prove they want it stopped; they should be able to disable it proactively.

  **Conclusion**
  This proposal sits in the gap between single-choice intervention and pattern management. It is not purely neutral, but neither is the status quo. By approving this pilot with strict conditions, we test whether reflective friction can enhance agency without sliding into manipulation. We also establish a firewall against vendor exploitation. If the Week 10 report shows that students feel monitored rather than empowered, or if Verdant resists the UX restrictions, we terminate the pilot. If it shows that students welcome the chance to break autopilot, we have a model for autonomy-supportive design that respects both health and agency.

  I move we adopt this recommendation and draft the corresponding contractual language before Thursday's vote.
