  5.  **The "Hope Nobody Asks" Objection:**
      *   What kills this argument? If the user admits that *preventing simulation shutdown* is a longtermist goal. If keeping the simulation running requires longtermist actions (e.g., avoiding nuclear war so the sim doesn't end), then SA *supports* longtermism. This is the "Instrumental Convergence" counter.
