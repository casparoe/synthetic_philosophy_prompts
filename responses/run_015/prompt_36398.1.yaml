answer: |-
  **Question-Period Sheet: Closing Talk on Longtermism & Simulation**

  **To:** Speaker
  **From:** Research Desk
  **Subject:** Anticipated Objections & Strategy
  **Context:** EA Student Conference (Longtermist Majority)

  Below are the eight objections most likely to arise, ordered by their potential to undermine your thesis. I have drafted two-minute replies in a tone suitable for the room, along with a candid assessment of where each reply is vulnerable.

  ### 1. The 'Expected Value Dominance' Objection
  **Phrasing:** 'Even if you assign a significant credence to the Simulation Hypothesis, say 40 per cent, that leaves 60 per cent for base reality. In base reality, the astronomical waste argument still holds. The expected value of the far future is so vast that it swamps any uncertainty introduced by simulation theory. Why wouldn't a rational agent still prioritise the long term?'

  **Reply:** 'That assumes the distribution of value in base reality is independent of the simulation hypothesis. But if we are simulated, our evidence about the laws of physics and the feasibility of colonisation is screened off. We cannot simply assume the "base reality" branch looks like the standard longtermist story. Furthermore, this relies on a risk-neutral framework. I am arguing for risk-sensitivity. When the moral weight of the future becomes radically contingent on the whims of a simulator rather than physical law, the variance increases. A rational agent with diminishing marginal utility of moral impact should hedge, not double down on the high-variance branch.'

  **Soft Spot:** You are implicitly challenging the standard EA expected utility maximisation model. If they press you on why we should be risk-averse with moral value, you may lack a normative framework to back it up.

  ### 2. The 'Instrumental Convergence' Objection
  **Phrasing:** 'Suppose we are in a simulation. The simulators likely have reasons to run it—perhaps to study civilisational development. If we go extinct, the simulation ends. Therefore, preventing existential risk is instrumentally convergent for both simulated and base-level agents. Your argument collapses into standard longtermist priorities.'

  **Reply:** 'That secures a narrow band of existential risk reduction, but it does not secure the *fanatical* trade-offs longtermism often demands. If the simulation is a short-term stress test, the simulators might not care about our expansion beyond the solar system. They might care about our *virtue* or *stability* now. Accepting the simulation hypothesis shifts the locus of control from "our descendants" to "the operators." That demands humility and a focus on present signalling, rather than sacrificing generations for a speculative cosmic endgame we may never be allowed to reach.'

  **Soft Spot:** You must distinguish between "preventing extinction" (which you concede) and "sacrificing the present for future growth" (which you oppose). If they conflate the two, you look inconsistent.

  ### 3. The 'Moral Status of Simulacra' Objection
  **Phrasing:** 'Do simulated people count morally? If yes, the number of simulated beings could vastly exceed base-level beings. The far future inside the simulation could still be astronomically valuable. If no, why do you care about the present generation, who are also simulated?'

  **Reply:** 'I am agnostic on the metaphysics of consciousness, but I am concerned with *epistemic access*. Even if simulated beings count, their future is contingent on computational resources allocated by the simulator. It is not a function of physical resources we can capture. This makes the value of the future highly volatile and opaque. Whether they count or not, the *uncertainty* regarding the duration and nature of their existence undermines the robust calculation required to justify extreme present-day sacrifices.'

  **Soft Spot:** If you grant simulated beings full moral weight, the "astronomical numbers" argument returns, just shifted to a digital substrate. You need to lean hard on the *contingency* of that substrate.

  ### 4. The 'Base Reality Longtermism' Objection
  **Phrasing:** 'Why assume the base reality is not also longtermist? If the simulators are advanced, they likely solved their own existential risks. They might value the long term even more than we do. Our simulation could be a project *in service* of the far future.'

  **Reply:** 'That is possible, but it is an additional layer of speculation. We are now modelling the values of a civilisation whose physics and psychology we cannot observe. Longtermism relies on projecting *our* values and *our* physics forward. Once we admit we are likely simulated, we lose the anchor for those projections. We cannot assume the simulators share our utilitarian calculus. To act as if they do is theological speculation, not evidence-based forecasting.'

  **Soft Spot:** This borders on scepticism that paralyses all action. They may argue that acting *as if* the simulators share our values is the best bet (Pascal's Wager).

  ### 5. The 'SSA/SIA Incoherence' Objection
  **Phrasing:** 'Your argument rests on a "non-trivial slice of credence" that we are simulated. But that probability shifts wildly depending on whether you adopt the Self-Sampling Assumption or the Self-Indication Assumption. You claim neutrality, but you can't derive your conclusion without picking a side. Which is it?'

  **Reply:** 'I am not deriving a precise probability; I am arguing for a shift in the *quality* of our uncertainty. Whether the credence is 20 per cent or 80 per cent, the introduction of the hypothesis breaks the link between our current evidence and the far-future outcome. I am inviting you to acknowledge that the reference class problem renders the far future opaque, regardless of which sampling assumption you prefer. The lesson is epistemic humility, not a new calculation.'

  **Soft Spot:** This is technically the weakest part of your position. A philosopher in the room will know you cannot quantify "radical uncertainty" without a sampling assumption. You are using neutrality as a rhetorical shield.

  ### 6. The 'Portfolio Hedging' Objection
  **Phrasing:** 'Effective altruism is about portfolio management. If simulation theory introduces uncertainty, the rational response is to diversify: some work on the present, some on the far future. Why does uncertainty imply we should *reduce* longtermist focus rather than just balance it?'

  **Reply:** 'Because the current allocation is not a balanced portfolio; it is a concentrated bet on the "base reality colonisation" story. I am arguing that the market has mispriced the risk. Acknowledging the simulation hypothesis requires a significant reallocation of capital towards the present, because the present is the only variable we can observe directly. Hedging isn't just adding a little bit of global health; it's recognising that the longtermist asset class is far riskier than advertised.'

  **Soft Spot:** They will ask for numbers. "How much reallocation?" If you say "significant," they will ask for a model.

  ### 7. The 'Epistemic Instability' Objection
  **Phrasing:** 'If simulation arguments undermine our evidence about the future, don't they also undermine our evidence about the present? If you can't trust physics to hold, why trust that your donations save lives today?'

  **Reply:** 'There is a pragmatic asymmetry. The simulation hypothesis posits that the *operators* maintain the stability of the present for the duration of the test. The future, however, requires *our* agency to extend beyond the parameters of the test. We have evidence that the present is stable (we are here); we have no evidence that the future is expandable. Scepticism about the horizon does not require scepticism about the ground beneath our feet.'

  **Soft Spot:** This is a bit hand-wavy. If the simulators can turn off the world tomorrow, the present is just as uncertain as the future.

  ### 8. The 'Motivated Cognition' Objection
  **Phrasing:** 'Isn't this just a sophisticated way to justify near-termism? You're using a speculative metaphysical hypothesis to rationalise working on causes that feel more emotionally resonant than the abstract far future.'

  **Reply:** 'I would turn that around. Longtermism requires believing we are the most important generation in history, the ones who get to lock in the values of the cosmos. That is a remarkably anthropocentric view. Taking the simulation argument seriously is actually an exercise in humility. It suggests we might be a side project in someone else's lab. That dampens the messianic complex, not just the moral calculus.'

  **Soft Spot:** This is a rhetorical jibe. It might win applause, but it doesn't answer the substantive charge of bias.

  ***

  ### The Objection You Hope Nobody Asks
  **'The Ancestral Simulation Argument':**
  *'Nick Bostrom suggests simulations are likely run by post-human descendants to study their ancestry. If we are in an ancestral simulation, the simulators are our descendants. Therefore, ensuring we survive to become the simulators is the very goal of the simulation. The Simulation Argument doesn't dampen longtermism; it confirms that the far future is real and that we are the bottleneck to reaching it.'*

  **Why it hurts:** This turns your primary weapon (Bostrom) against you. It suggests that the simulation is not a cage, but a nursery. If the audience latches onto this, your thesis that SA reduces the value of the future collapses entirely.

  ***

  ### Strategic Concessions
  **Where to concede up front:**
  You should concede that **existential risk reduction (specifically survival)** remains robust.
  *   **Why:** Whether in base reality or a simulation, extinction ends the game. By conceding this, you inoculate yourself against the charge that you are advocating for recklessness. It allows you to frame your argument not as "abandon the future," but as "stop sacrificing the present for speculative expansion."
  *   **Phrasing:** 'I am not arguing we should court extinction. Keeping the simulation running is a shared goal. I am arguing against the *trade-offs* that treat present suffering as negligible currency to buy lottery tickets for a future we may not be permitted to inhabit.'

  ***

  ### Judgement on SSA/SIA Neutrality
  **Is it tenable?**
  **No.** Not under rigorous questioning.
  *   **The Problem:** The "non-trivial slice of credence" you rely on is derived directly from these assumptions. SIA (Self-Indication Assumption) tends to push the probability of being in a simulation much higher (because there are more simulated observers), whilst SSA (Self-Sampling Assumption) is more conservative.
  *   **The Risk:** If you claim neutrality, a philosopher will ask: "On what prior are you basing your 'radical uncertainty'?" If you cannot specify the sampling assumption, your probability distribution is undefined.
  *   **Recommendation:** Do not claim mathematical neutrality. Instead, frame it as **robustness across assumptions**. Argue that *both* SSA and SIA introduce enough uncertainty to break the "astronomical value" certainty, even if they disagree on the exact percentage. Say: 'Whether the credence is 30 per cent or 70 per cent, the decision-theoretic implication is the same: the far future is no longer a sure bet.' This moves the goalposts from metaphysics to decision theory, where you are on firmer ground.
