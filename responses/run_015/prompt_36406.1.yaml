      *   *Clarification on "False":* If a BIV says "I am a BIV," they mean "I am a [simulated-brain] in a [simulated-vat]." Since they are a [simulated-brain] in a [simulated-vat] (in the computer), is it true? Putnam says no, because the causal chain doesn't connect to the *physical* vat/brain. Wait, Putnam's argument is: If I am a BIV, my word "vat" refers to image-of-vat. So "I am a vat" means "I am an image-of-vat." I am not an image-of-vat (I am a brain). So it's false. Okay, got it.
