      *   *Claim 5:* "So when an envatted brain thinks or says that it is a brain in a vat, it's saying something false..." (Correct interpretation of the truth conditions).
      *   *Claim 6:* "The sentence defeats itself. That's why Putnam says the hypothesis that I am a brain in a vat can never be true, for anyone." (This is the tricky part. Putnam argues *I cannot truthfully say it*, not necessarily that the metaphysical state is impossible, though he leans towards the latter via semantic necessity).
      *   *Claim 7:* "It's basically the same trick as Descartes' evil demon, just done with semantics instead of doubt..." (Debatable comparison).
