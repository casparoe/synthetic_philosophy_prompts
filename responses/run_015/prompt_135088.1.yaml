      *Story:*
      The fog outside the Museum of Dead Type pressed against the glazing like wet wool, muffling the 22nd-century city beyond. Inside, the air smelled of ozone and oxidized lead. Mira adjusted the loupe over her left eye, her breath hitching in the silence. Speaking was forbidden on the floor; the acoustics were too sensitive, tuned to hear the settling dust of centuries.

      Before her lay a tray of recovered sortings from the Old Print Shops. Most were familiar: a Garamond 'g' with its looping ear, a Baskerville 'e' with its sharp crossbar. They were dead things, heavy with the weight of unused ink. But then there was the Specimen.

      It sat alone on a velvet cushion. It was an 'a', or so the catalog claimed. Cast in an alloy that refused to tarnish, it possessed no bowl, no counter, no tail. It was a single, continuous curve, rising and falling like a distant horizon. It looked like nothing. It looked like everything.

      Mira lifted it. It was heavier than lead, lighter than steel, warm despite the climate control. When the overhead lights hit the curve, there was no glare. The metal drank the light, holding it within the arc. She ran her calipers over it. No angles. No geometric logic that matched any known typeface database. By all rights, it should have been a scrap, a failed cast, a piece of wire.

      Yet, the visitor log told a different story.

      Because speech was banned, visitors submitted their identifications on slips of recycled pulp. A box near the pedestal overflowed with them. Mira sifted through the latest batch. A child from the Neo-Kyoto sector, who spoke only glyph-script, had drawn the curve. Below it, in shaky translation code: *a*. An elder from the Data-Wastes, who had never seen paper, had sketched the same arc. *a*.

      What unsettled Mira were the drawings themselves. On one card, the curve was steep, almost a peak. On another, it was flat, a gentle swell. Another drew it broken, yet still labeled it *a*. The visual input varied wildly, but the recognition was absolute. It wasn't that the metal forced a specific image into their minds; it was that the metal demanded a specific *name*.

      She held the specimen up to the light again. Was it a hidden frequency? A geometric truth embedded in the atomic lattice? Or was it something else? The museum taught that type was frozen speech, but this object felt like frozen agreement. It seemed to suggest that the shape didn't make the letter; the letter made the shape.

      Mira picked up a slip of pulp and a stylus. She meant to record her findings, to note the anomaly of the alloy. Instead, her hand moved without her permission. She drew a curve. Not the one in her hand, but the one in her head. It looked different from the metal, yet she knew, with a sudden cold certainty, that if she showed it to the fog outside, the world would call it *a*.

      She dropped the stylus. The silence rushed back in, heavier than the metal. The letter sat in her palm, indifferent to her confusion, perfectly complete in its incompleteness. It was not a thing to be measured. It was a thing to be agreed upon.

      *Analysis:*
      **On the choices**
      I stripped the letter of standard features (bowl, tail) to isolate the concept of recognition from stylistic markers. If an 'a' lacks its defining structural components yet remains an 'a', the essence must lie elsewhere. The unknown alloy suggests meaning might be physical or permanent, rather than purely cultural. The silent museum and the cards emphasize that recognition is internal and individual, yet the convergence on the same label despite different drawings highlights "collective agreement." The varying curves on the cards show that the mental concept of 'a' is flexible, while the label is rigid. This implies that letter spirit isn't about geometry, but about a shared human consensus that can somehow be anchored in an object.

