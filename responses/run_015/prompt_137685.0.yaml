  5.  **Drafting the Response (Iterative Process):**

      *   *Introduction:* Acknowledge the richness of the prompt. Validate the user's position against the co-teacher.
      *   *Section 1: Stress-Testing the Three Frameworks.* Go through Accretionism, Authority-Filtered, and Version-Relativity. Apply specific examples (Hauer, Voiceover, Glow, Interviews). Highlight where each "feels wrong."
      *   *Section 2: The Sub-Questions.* Tackle Late Statements (Post-hoc intention vs. textual ambiguity) and *2049* (Franchise accretion vs. Retroactive continuity).
      *   *Section 3: The Meta-Hunch.* Evaluate the "Authority over Verdict" theory. It's not too cute; it's the philosophical core. Connect VK test to Hermeneutics.
      *   *Section 4: Pedagogical Strategy.* What to show the 18-year-olds? How to handle the co-teacher? (Don't fight her, use her to define the stakes).

  6.  **Refining the Arguments (Self-Correction during drafting):**
      *   *Correction:* Make sure not to just say "Intentionalism is bad." The co-teacher is an *Actual* Intentionalist. I need to show where *her* view fails specifically with *Blade Runner*, not just generally.
      *   *Nuance:* On the "Eye Glow." Accretionism says it counts. Authority-Filtered says it's noise (Scott didn't intend it). But if Scott *retroactively accepts it*, does it become intended? This complicates Authority-Filtered.
      *   *Nuance:* On *2049*. If Deckard has a child, he must be human (mostly). Does this fix the original? No, it makes the original's ambiguity a *lie* or a *secret*. This supports Version-Relativity (1982 is one thing, 1982+2049 is another).
