answer: |-
  This is an exceptionally rich pedagogical situation. You have a text (*Blade Runner*) whose material history actively sabotages the theoretical framework your co-teacher wants to impose (Actual Intentionalism), while thematically dramatizing the very philosophical problem you are teaching (the authority of the verdict).

  Here is an analysis of your three proposed frameworks against the specific historical and textual data of *Blade Runner*, followed by an evaluation of your "hunch" and advice for handling the seminar and your co-teacher.

  ### Part 1: Stress-Testing the Three Frameworks

  Here is how your three options handle the specific friction points of the film's history.

  #### 1. Artifact Accretionism
  *The Thesis:* Whatever is on the screen constitutes meaning, regardless of source (studio, actor, accident). The author is one causal channel among many.

  *   **Where it works best:**
      *   **The Eye-Glow:** Harrison Ford claims the replicant eye-glow was a lab accident retained in the final print. Accretionism handles this perfectly: the glow is on the screen; therefore, it is a signifier of "non-human" regardless of whether Scott intended it at the time. It becomes part of the visual grammar of the work.
      *   **Hauer's "Tears in Rain":** Hauer improvised/edited the speech the night before shooting. Under Accretionism, Hauer is a co-author of that moment. The meaning (the poignancy of finite memory) is constituted by the actor's contribution, not just the screenwriter's script.
      *   **The Theatrical Ending:** The drive-into-the-sunshine footage was stock footage forced by the studio. Accretionism accepts this as part of the *Theatrical Version's* meaning: the film *means* "hope/survival" in that cut, even if it contradicts the noir tone.

  *   **Where it feels wrong:**
      *   **Noise vs. Signal:** If a projector lamp flickers during a screening, is that meaning? Accretionism struggles to distinguish between *constitutive features* and *damage*.
      *   **The Voiceover:** Ford's voiceover was recorded reluctantly and arguably undermines the film's ambiguity. If Accretionism says this counts equally with Scott's visual storytelling, it forces students to accept a "meaning" (explicit explanation of feelings) that actively degrades the aesthetic coherence of the rest of the text. It grants too much authority to interference.

  #### 2. Authority-Filtered Intentionalism
  *The Thesis:* Only the intentions of the holder of final creative authority count for a given version. Later commentary is criticism, not meaning-fixing.

  *   **Where it works best:**
      *   **Scott's Later Interviews:** This framework cleanly dismisses Scott's decades-later insistence that "Deckard is a Replicant." If that intention isn't encoded in the *Final Cut* artifact, it is external criticism (significance), not internal meaning. It protects the text from the "authoritative biography" fallacy.
      *   **Version Control:** It elegantly distinguishes the *Theatrical Cut* (Authority: Studio/Producers) from the *Final Cut* (Authority: Scott). It allows you to say the *meaning* changes because the *authority* changed.
      *   **Fancher vs. Scott:** It resolves the writer/director conflict by prioritizing the director as the final authority on the *film* (as opposed to the *script*).

  *   **Where it feels wrong:**
      *   **The "Undecidability" Problem:** In the *Final Cut*, Scott *did* have authority. He included the unicorn dream and the origami. But he also left the eye-glow (accident) and kept the ambiguity. If his later statement ("He is a replicant") is excluded, we are left with a text that *intentionally* refuses to settle the question. Authority-Filtered Intentionalism must admit that the Author's intention was *to be ambiguous*. If Scott later tries to remove that ambiguity, this framework correctly identifies it as a revision of history, but it leaves students wondering: "So what is the truth?"
      *   **Collaboration:** It erases Hauer's contribution. If Scott didn't explicitly authorize Hauer's rewrite before the camera rolled, Authority-Filtered Intentionalism must treat Hauer's genius as "noise" or attribute it to Scott's tacit approval. This feels reductive for a film so dependent on performance.

  #### 3. Version-Relativity
  *The Thesis:* Meaning is version-relative. Asking "What does *Blade Runner* mean?" is a category error; one must ask "What does *Blade Runner: The Final Cut* mean?"

  *   **Where it works best:**
      *   **The Happy Ending:** It dissolves the contradiction between the Theatrical (hopeful) and Director's (bleak/ambiguous) endings. They are simply different works with different titles, like different translations of a poem.
      *   **Deckard's Humanity:** In the Theatrical Cut (with voiceover), Deckard is likely human explaining his feelings. In the Final Cut (no voiceover, unicorn), he is likely a replicant. Version-Relativity says both are true *of their respective objects*.

  *   **Where it feels wrong:**
      *   **Pedagogical Dissolution:** As you noted, this dissolves the seminar question. If there is no single *Blade Runner*, there is no single debate.
      *   **Cultural Object:** Culturally, *Blade Runner* exists as a palimpsest. Audiences carry the voiceover into the Final Cut. Version-Relativity ignores the *reception history* which is part of how the film functions in the world. It is ontologically pure but phenomenologically false.

  ### Part 2: The Sub-Questions

  #### 1. Late Statements and Undecidability
  *Can a later intention collapse undecidability?*

  If the work is deliberately built to be undecidable (as the *Final Cut* arguably is), a later statement by the author does not collapse the undecidability *of the work*; it collapses the undecidability *of the author's mind*.

  *   **For the Actual Intentionalist (your co-teacher):** This is a crisis. If the author says "I meant it to be ambiguous" in 1982, but "He is a replicant" in 2007, which intention fixes the meaning? The one contemporaneous with the artifact, or the most recent? If the latter, meaning is unstable and changes every time the author gives an interview.
  *   **For the Hypothetical Intentionalist:** The "ideal audience" constructs meaning based on available evidence. If the interview is widely known, the ideal audience *must* factor it in. However, if the text *resists* that reading (i.e., the evidence in the film still supports Deckard as human), the Hypothetical Intentionalist must conclude the author *failed* to realize their intention in the work. The work means "ambiguous," even if the author meant "replicant."
  *   **The Verdict:** Late statements are acts of *significance* (Hirsch), not *meaning*. They change how we value the ambiguity, but they cannot retroactively insert a unicorn dream into a cut that lacks it.

  #### 2. The Sequel (*2049*) and Retroactive Fixing
  *Can a later film by a different director fix the meaning of an earlier one?*

  No, but it can change its *genre* and *significance*.

  *   **Ontological Status:** *2049* cannot change the textual evidence of 1982. If *2049* confirms Deckard is human (via the daughter), it renders the *Final Cut's* ambiguity a *deception* rather than an *open question*. It shifts the 1982 film from a philosophical inquiry ("What is human?") to a noir mystery ("Who is Deckard?").
  *   **Accretion on a Franchise Level:** This is Accretionism applied to a corpus. The "meaning" of the *Blade Runner Saga* is the sum of both. But the meaning of the 1982 artifact remains distinct.
  *   **The Intentionalist Trap:** If your co-teacher argues *2049* fixes 1982, she must argue that Villeneuve (director of *2049*) has authority over Scott's work, or that Scott endorsed *2049* enough to adopt its intentions. Since Scott was a producer on *2049*, an Actual Intentionalist might argue the "Author Function" of the franchise now includes Villeneuve. This is a slippery slope that usually leads to absurdity (does the next sequel override the previous one forever?).

  ### Part 3: Evaluating Your Hunch

  *The Hunch: The film is about authority over a verdict. The interpretive debate mirrors the in-world debate about humanity.*

  **Is it too cute?** No. It is structurally sound and thematically robust. In fact, it is the strongest way to teach this module because it moves from abstract theory to embodied experience.

  **The Parallel:**
  *   **The Voight-Kampff Test:** This is a hermeneutic device. It is a tool designed to extract "truth" (humanity) from a subject based on external signs (pupil dilation, blush).
  *   **The Intentionalist:** Believes the truth lies in the internal state of the subject (the Author's mind).
  *   **The Anti-Intentionalist:** Believes the truth lies in the external signs (the Text/Behavior).
  *   **The Film's Claim:** The VK test is fallible (Rachael doesn't know she's a replicant). The external signs are unreliable. The internal state is inaccessible. Therefore, **the verdict is an act of power, not discovery.**

  **Scenes to show the 18-year-olds:**
  1.  **The VK Test on Rachael:** Deckard asks questions; the machine measures response. Deckard delivers the verdict ("It's not a question of being..."). This is the critic delivering a verdict on the text. Ask the students: *Did Deckard find the truth, or did he impose a category?*
  2.  **Gaff's Origami:** Gaff leaves a unicorn. He doesn't speak. Deckard (and the audience) must interpret the sign. Did Gaff *mean* "I know your dream"? Or is it just trash? This is the "Intentional Fallacy" in miniature. If Deckard assumes intent, he changes his life (he runs away with Rachael). If he assumes it's noise, he stays. The *consequence* of interpretation is the point.
  3.  **Batty's Death:** Batty saves Deckard. He creates his own meaning ("Tears in Rain") in the face of institutional erasure (Tyrell Corp). This is the "Death of the Author" moment: the character creates meaning the author didn't script, in a way that overrides the "author's" plan for him (to be a villain).

  **Where the film resists this:**
  The film resists this reading if you lean too hard on the "Deckard is a Replicant" reveal. If Deckard *is* objectively a replicant, then the VK test was *right*, and the authority *was* valid. The film is only about the *failure* of authority if Deckard's status remains truly undecidable. If you accept Scott's later interviews as truth, the meta-commentary weakens: it becomes a story about a secret identity, not a story about the instability of identity. **To make your hunch work, you must privilege the Final Cut's ambiguity over Scott's interviews.**

  ### Part 4: Seminar Strategy & Handling the Co-Teacher

  **How to answer the Co-Teacher:**
  When she says, "All of this is just a long way of saying the director gets the last word," you should reply:

  > "In the case of *Blade Runner*, the director explicitly *did not* have the last word for fifteen years. The Theatrical Cut was the only accessible text for most of the film's critical life. If meaning is fixed by actual intention, but the actual intention (Scott's) was withheld from the artifact by the studio, then the 'meaning' of the film was inaccessible to everyone, including the audience and the critics, until 1992.
  >
  > Furthermore, if Scott's intention changed from 1982 to 2007, does the meaning of the film change? If yes, the work is unstable. If no, which Scott counts? The one who made the film, or the one who remembers it? *Blade Runner* demonstrates that the 'Director' is not a singular, stable locus of intention, but a site of conflict between writers, actors, studios, and time. To say the director gets the last word is to ignore that the director lost the first fifteen rounds."

  **Pedagogical Move:**
  Don't try to "win" against her. Use her position as a foil to highlight the film's complexity.
  1.  **Start with her view:** "Let's assume the Director's intention is the meaning. Scott says Deckard is a Replicant. Okay. Then why did he shoot it so we can't tell? Was he incompetent? Or did he intend *us* to be unsure?"
  2.  **Pivot to the Film:** "If he intended us to be unsure, then the 'Meaning' is *Uncertainty*. But if the Meaning is Uncertainty, then Scott's later comment ('He is a Replicant') actually *contradicts* the Meaning of the work. So the Actual Intentionalist must say Scott is wrong about his own film's meaning."
  3.  **Land the Plane:** "This suggests that once the film is released, the authority over the verdict shifts from the Maker to the Witness. Just like Deckard watching Rachael take the test. He can administer it, but he can't feel the result for her."

  **Conclusion:**
  Your hunch is not too cute; it is the philosophical payload of the text. *Blade Runner* is not just a case study for intentionalism; it is an argument *against* the possibility of definitive intentionalism. It argues that "humanity" (meaning) is not a fact to be discovered by authority (the test/the author), but a status granted through empathy and interpretation (Deckard saving Rachael/the Audience accepting the ambiguity).

  Use the **Origami Unicorn** as your central image. It is a sign without a confirmed sender. Deckard acts on it anyway. That is the act of interpretation. It is a leap of faith, not a decoding of authority. That is what you want your first-years to leave with.
