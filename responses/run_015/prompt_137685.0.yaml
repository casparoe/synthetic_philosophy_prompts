      *   *Scenes:* The VK test on Rachael (authority of the machine vs. subjective experience), Gaff's Origami (message without clear sender/intent), The "Tears in Rain" speech (meaning created by the dying subject, not the writer).
      *   *Resistance:* Does the film *actually* resist this? The "Love" theme in *2049* suggests ontology matters less than connection. The original film's noir tropes rely on a hard truth (who did it?).
