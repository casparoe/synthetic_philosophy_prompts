      *   **Co-teacher:** Hardline Actual Intentionalist (meaning = author's actual intent).
      *   **Goal:** Move beyond standard examples (Wimsatt/Beardsley/Hirsch) and use *Blade Runner*'s messy production history to pressure test three specific theoretical frameworks proposed by the user.
      *   **User's Proposed Frameworks:**
          1.  *Artifact Accretionism:* Everything on screen counts (accidents, studio notes, actor improvisation), author is just one cause.
          2.  *Authority-Filtered Intentionalism:* Only the final creative authority's intent counts for a specific version; later commentary is criticism, not meaning-fixing.
          3.  *Version-Relativity:* Meaning is relative to the specific cut/version; asking "what *Blade Runner* means" is a category error.
      *   **Specific Cases to Test:** Voiceover/Happy Ending, Hauer's "Tears in Rain," Unicorn/Origami, Deckard's photos/Rachael's question, Eye-glow (accident), Scott's later interviews, *Blade Runner 2049*.
      *   **Key Sub-questions:**
          1.  Late authorial statements (do they collapse undecidability?).
          2.  Sequels by different directors (retroactive meaning fixing?).
      *   **The "Hunch":** The film *itself* is about authority over verdicts (human vs. replicant) mirroring the interpretive authority debate (critic vs. author).
      *   **Desired Output:** A rigorous philosophical/cinematic analysis that validates/challenges the user's frameworks, addresses the sub-questions, evaluates the "hunch," and provides pedagogical advice for the seminar (specific scenes, how to handle the co-teacher).

  2.  **Deconstruct the Three Frameworks against the Evidence:**

      *   **Artifact Accretionism:**
          *   *Strengths:* Handles the "Eye Glow" (accident becomes meaning), Hauer's speech (actor becomes co-author), Studio Ending (contextualizes the work as a commodity).
          *   *Weaknesses:* Makes meaning chaotic. If the projector breaks, is that meaning? If the studio forces a bad ending, is that *the* meaning or a corruption? It struggles to distinguish between *signal* and *noise*.
          *   *Verdict:* Good for describing the *object*, bad for normative interpretation.

      *   **Authority-Filtered Intentionalism:**
          *   *Strengths:* Respects the "Final Cut" distinction. Handles Scott's later interviews (they are external criticism, not internal meaning). Distinguishes the Theatrical Cut (Studio authority) from the Final Cut (Scott authority).
          *   *Weaknesses:* Who is the authority? Scott? Fancher (writer)? Hauer (actor)? It creates a hierarchy that the film's production history actively dismantles. It also struggles with the "Undecidability" issue—if Scott says "Deckard is a Replicant" later, does that override the ambiguity *in* the Final Cut?
          *   *Verdict:* Strongest for maintaining critical distance, but vulnerable to the "Death of the Author" critique regarding collaboration.

      *   **Version-Relativity:**
          *   *Strengths:* Most accurate historically. Theatrical *Blade Runner* $\neq$ Final Cut *Blade Runner*. Solves the "Happy Ending" contradiction.
          *   *Weaknesses:* Pedagogically messy ("Which one are we watching?"). Can lead to nihilism ("Nothing means anything until you pick a cut"). Doesn't solve the *internal* ambiguity of the Final Cut (Scott says Replicant, Film says Maybe).
          *   *Verdict:* The most honest ontological claim, but potentially dissolves the seminar discussion too quickly.

  3.  **Address the Sub-Questions:**

      *   **Late Statements:** If the work is built to be undecidable, a later statement is an act of *closure* from the outside. It changes the *reception*, not necessarily the *work*. Hypothetical intentionalists struggle here: does the "ideal audience" know the interview? If yes, meaning shifts. If no, meaning stays ambiguous.
      *   **The Sequel (*2049*):** Villeneuve (director) + Hampton Fancher (original writer). Can *2049* fix *1982*? No, it can only add *significance* (Hirsch). It creates a new compound work. If *2049* confirms Deckard is human/replicant, it recontextualizes the original but doesn't change the original's textual evidence. This is accretion on a franchise level.

