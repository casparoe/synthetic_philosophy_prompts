      *   **Context:** First-year interdisciplinary module on rules, norms, and coordination.
      *   **Constraint 1:** Do not summarize the novel or the theory. Assume knowledge of both.
      *   **Constraint 2:** Focus on specific scenes/issues:
          1.  The Conch (Convention vs. Norm/Agreement/Device; two separable jobs).
          2.  The Signal Fire ("Beneficiary-blind" convention; fragility in Lewisian/signalling models).
          3.  Jack's Strategy ("Prominence-poisoning" vs. competing focal points; modelling salience as attackable).
          4.  The Unravelling (Collapse of higher-order expectations vs. change in first-order preferences).
      *   **Constraint 3:** Be honest about where the pairing fails (Preferences given vs. transformed; Imported habits vs. endogenous conventions; Mimesis/affect vs. reinforcement learning).
      *   **Constraint 4:** End with what the novel contributes to the philosophical debate that argumentative literature does not.
      *   **Style:** British English.
      *   **Length:** Around 1,200 words.
      *   **Tone:** Academic, critical, engaging for students (competing reading).

  2.  **Deconstruct the Arguments:**

      *   *The Conch:* Lewisian conventions are arbitrary solutions to coordination problems sustained by mutual expectations. Is the conch arbitrary? Not really, it's found. Is it sustained by expectations or sanctions? Ralph tries to make it a rule ("hold the conch to speak"), but Jack challenges it. It serves two functions: summoning (coordination) and speaking rights (norm). These might decouple.
      *   *The Signal Fire:* Lewisian conventions usually involve reciprocal benefits or observable signals. Here, the beneficiary (ships) is absent. It's a public good problem wrapped in a convention. Lewis might say if the expectation of rescue fades, the convention collapses. Signalling games require the signal to be received to maintain value. If no ship sees it, does the signal lose salience?
      *   *Jack's Strategy:* Lewis takes salience as given (Schelling focal points). Jack attacks the *salience* of the conch/fire. He makes them look ridiculous or irrelevant. This suggests salience is endogenous and manipulable, which Lewis doesn't fully account for.
      *   *The Unravelling:* Is it preference change (boys want to kill/hunt more than be rescued) or expectation collapse (boys think others won't show up)? The ending (hunt for Ralph) suggests preference transformation (savagery).
      *   *Failures:* Lewis assumes fixed preferences. Golding shows preference transformation (civilisation to savagery). Lewis assumes endogenous conventions; the boys start with exogenous imported norms (British schoolboy behaviour). Golding's mechanism is affective/mimetic (dance/chant), not just rational expectation updating.

  3.  **Drafting - Section by Section:**

      *   *Introduction:* Set the stage. The island as a laboratory. Lewis vs. Golding.
      *   *The Conch:* Analyze via Lewis. Is it a convention? It solves a coordination problem (who speaks). But it relies on authority, not just expectation. The decoupling of summoning vs. speaking.
      *   *The Signal Fire:* The "beneficiary-blind" aspect. Lewisian fragility. If the signal isn't acknowledged, does the convention hold? Golding shows it fails when immediate costs (hunt) outweigh abstract benefits.
      *   *Jack's Strategy:* Salience attack. Lewis vs. Golding on focal points. Jack makes the conch "poisonous" rather than offering a better coordination point initially.
      *   *The Unravelling & Preferences:* Expectation collapse vs. Preference change. The hunt for Ralph suggests the latter. Lewis can't explain preference change.
      *   *Failures/Limitations:* Imported norms vs. endogenous. Mimesis vs. Rationality.
      *   *Conclusion:* What Golding adds (affect, preference transformation).

  4.  **Refining and Checking Constraints:**

      *   *Word Count:* Need to monitor closely. 1,200 words is tight for this depth.
      *   *British English:* Check spelling (behaviour, analyse, programme, etc.) and idioms.
      *   *No Synopsis:* Jump straight into analysis.
      *   *Competing Reading:* Ensure it challenges the draft reading mentioned in the prompt, not just supports it.
      *   *Specific Scenes:* Ensure conch, fire, Jack's mockery, and the hunt are referenced specifically.

  5.  **Drafting - Step-by-Step (Mental or Scratchpad):**

      *   *Intro:* Start with the tension. Lewis offers a static snapshot; Golding offers a dynamic decay.
      *   *Conch:* It's not purely Lewisian. It's quasi-legal. The two functions (assembly vs. speech) decouple. Jack attends assemblies but ignores speech rights. This suggests conventions can fragment.
      *   *Fire:* Lewisian conventions need reciprocal expectation. The ship never signals back. It's a one-way signal. Golding shows this is unstable without immediate feedback. Lewis might predict collapse when confidence drops.
      *   *Jack:* Lewis treats salience as exogenous. Jack makes it endogenous. He doesn't offer a better focal point initially; he tarnishes the existing one. This is "salience sabotage."
      *   *Unravelling:* The prompt asks to test the claim that it's expectation collapse. I need to be critical. The hunt for Ralph suggests preference change. Lewis can't handle this.
      *   *Failures:* Imported norms (British school). Mimesis (the dance). Lewis is too rationalist.
      *   *Conclusion:* Golding shows the *affective* substrate of norms.

  6.  **Writing - Focusing on Flow and Tone:**

      *   *Self-Correction on Word Count:* I need to be concise. Avoid long introductions. Get straight to the conch.
      *   *Self-Correction on Argument:* Make sure I don't just agree with the prompt's draft reading. I need to offer a *competing* perspective or at least a critical stress-test. The prompt asks me to write a competing reading *that the instructor can set against* their draft. So I should challenge the Lewisian application where appropriate.
      *   *Key Challenge:* The prompt says "I would like you to write a competing one... rather than a summary." It also says "I would like to claim... but I am not confident... test that claim." So I need to be critical of the Lewisian fit.

  7.  **Final Polish:** Check British spelling. Check word count. Ensure all four specific points are addressed. Ensure the limitations section is robust.

      *(Self-Correction during drafting)*: I need to make sure I don't sound like I'm summarizing the plot. Use phrases like "When the fire lapses..." or "In the assembly scenes..." rather than "In chapter 4, Jack lets the fire go out."

      *(Refining the "Competing" aspect)*: The instructor's draft says the island is a laboratory for the rise and fall of conventions. My reading should argue that it's actually a laboratory for the *transformation of agency*, which Lewis ignores. Or that the Lewisian framework is too static. I will argue that Lewis explains the *maintenance* but Golding explains the *corrosion* via affect.

      *(Word Count Check)*: Aiming for ~1200. I will write densely.

  8.  **Final Review against constraints:**
      *   British English? Yes.
      *   No synopsis? Yes.
      *   Specific scenes (Conch, Fire, Jack, Unravelling)? Yes.
      *   Honest about failures? Yes.
      *   Ending on novel's contribution? Yes.

      *Let's write.*
answer: |-
  **Title:** The Corrosion of Salience: A Critique of Lewisian Conventions in *Lord of the Flies*

  David Lewis's account of convention offers a powerful static snapshot of how order emerges from chaos: arbitrary solutions to coordination problems, sustained by mutual expectations of conformity. However, setting Golding's *Lord of the Flies* against this framework reveals that Lewis's machinery is ill-equipped to handle the dynamic corrosion of normativity. Where your draft reading posits the island as a laboratory for the rise and fall of conventions, a closer examination suggests it is rather a laboratory for the transformation of the agents themselves. The Lewisian model assumes preferences are fixed and salience is exogenous; Golding demonstrates that both are vulnerable to strategic attack and affective contagion.

  Consider first the conch. A strict Lewisian reading classifies this as a convention: an arbitrary device solving the coordination problem of turn-taking, sustained because everyone expects everyone else to respect it. Yet the text resists this categorisation. The conch is not merely arbitrary; it is imbued with quasi-constitutional authority imported from the boys' prior socialisation. More critically, as you note, it performs two separable jobs: convening the assembly and regulating speech within it. These functions decouple precisely when Lewisian expectations should hold them together. Jack continues to attend assemblies (coordinating on the gathering) while systematically violating the speech rule (ignoring the turn-taking). If this were a pure convention, the collapse of one function should precipitate the collapse of the other, as the mutual expectation of conformity fractures. Instead, we see a hybrid state: the assembly persists as a focal point even as the norm of discourse degrades. This suggests the conch operates less as a Lewisian convention and more as a sanction-backed norm that loses its coercive power before it loses its focal salience. Lewis lacks the resources to explain why conformity to the gathering persists after conformity to the rule has vanished.

  The signal fire presents a steeper challenge. You describe this as a 'beneficiary-blind' convention, maintained for a party (passing ships) that provides no feedback. In signalling-game terms, this is a signal with no observable receiver. Lewisian conventions rely on the rationality of conformity: I conform because I expect you to conform, yielding a payoff. Here, the payoff (rescue) is never observed during the maintenance phase. Lewis's framework would predict extreme fragility here; without feedback loops to reinforce the expectation that the signal is effective, the rationality of maintaining the fire should decay rapidly against immediate costs (hunting, sleeping). Golding dramatises this not merely as a coordination failure, but as a discounting of the future. When Jack allows the fire to lapse, it is not because he doubts the others will tend it (an expectation failure), but because he values the hunt (immediate preference) over the rescue (abstract benefit). Lewis models coordination given preferences; he cannot explain why the preference for rescue is outbid by the preference for blood unless we admit that the 'payoff structure' itself is mutable.

  This leads to Jack's strategy, which your draft identifies as 'prominence-poisoning'. Lewis treats salience or prominence as an exogenous input—a Schelling focal point that agents simply recognise. Jack, however, treats salience as an endogenous variable to be manipulated. He rarely offers a competing focal point initially; instead, he mocks the assembly, ridicules the conch, and stages rival feasts. He does not solve a coordination problem; he dissolves the existing solution by making conformity appear weak or ridiculous. To model this within game theory, one would need to introduce a meta-game where agents invest resources to degrade the salience of existing equilibria. Golding supplies the resources for this model: the degradation of the conch's authority is achieved through affective performance (mockery, hunting chants) rather than rational argument. Lewis's rational agents update expectations based on behaviour; Golding's agents update expectations based on status and fear.

  Consequently, the claim that the unravelling is purely a collapse of higher-order expectations requires rigorous testing. It is tempting to argue that the boys drift away because they doubt others will turn up (a coordination collapse). However, the climax of the novel contradicts this. The hunt for Ralph is not a failure to coordinate; it is a terrifyingly successful coordination on a new, violent equilibrium. If the breakdown were merely expectation-based, the boys should revert to chaos or isolation. Instead, they coalesce around Jack's tribe with high conformity. This suggests a transformation of first-order preferences rather than a shift in expectations. The boys do not stop wanting rescue because they think others won't help; they stop wanting rescue because they now want to kill. Lewis's framework, which holds preferences constant, cannot account for this endogenous shift. To force the novel into Lewis's model is to commit a category mistake: treating a moral collapse as a coordination failure.

  We must be honest with students about where this pairing fails. First, Lewis assumes conventions are endogenous solutions to recurrent problems. The rules the boys begin with are not endogenous; they are imported habits of English school life. Their decay is not the natural entropy of a convention without enforcement, but the shedding of an exogenous cultural skin. Treating this as a coordination failure ignores the sociological reality that these were never truly *their* conventions to begin with.

  Second, the mechanism of new norm formation in the novel is mimetic and affective, not rational. The painted faces, the chant ('Kill the pig'), and the dance operate through what mimetic theory calls contagion, not reinforcement learning. In evolutionary game theory, strategies spread because they yield higher payoffs. In *Lord of the Flies*, the 'savagery' strategy spreads because it offers emotional release and group bonding, regardless of instrumental payoff. The boys do not join Jack because his tribe hunts more efficiently (though they do); they join because the dance absorbs them. Lewis's rational agents do not get swept up in chants; Golding's boys do. This places immense strain on the signalling-game framework, which assumes agents process signals cognitively rather than viscerally.

  Ultimately, the novel contributes something the argumentative literature cannot: a phenomenology of normativity. Lewis explains the logic of conventions; Golding explains the *feel* of them. He shows that norms are not just cognitive expectations but are anchored in affective states—shame, fear, excitement. The conch works not because it is a rational focal point, but because it commands awe. When the awe fades, the logic remains but the power vanishes. For your module, the value of pairing these texts lies not in their compatibility, but in their friction. Lewis provides the skeleton of social order; Golding provides the flesh and blood that makes it move, and the rot that makes it fall. Using them together teaches students that while rational choice models can map the structure of coordination, they often fail to capture the psychological substrate upon which all conventions ultimately rest.
