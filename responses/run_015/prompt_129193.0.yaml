answer: |-
  **Project Title:** Parameterizing the Divergence: A Logical Framework for Contrastive Explanation in Global History

  **Project Summary**
  This project proposes a conceptual analysis of the logical structure underpinning the "Great Divergence" and the "Needham Question." The central hypothesis is that the historiographical stalemate regarding why modern science and industrialization arose in Britain rather than China is not primarily a deficit of empirical data, but a failure of question-specification. The standard contrastive formulation ("Why Britain and not China?") conceals two hidden parameters: a *scale parameter* (the level of aggregation of the units compared) and a *bundling parameter* (the specific conjuncts of the outcome). Furthermore, the project addresses a third logical worry: whether the contrast class is a genuine comparator or merely a residue of non-occurrence. Over six months, this fellowship will develop a formal diagnostic framework to parameterize these questions, aiming to transform pseudo-disagreements into determinate empirical queries or identify them as ill-posed.

  **Intellectual Context and Problem Statement**
  Current debates in global history oscillate between institutional, cultural, and ecological explanations for the divergence. Philosophical accounts of historical explanation typically rely on contrastive models, positing that to explain an event is to explain why it occurred rather than some alternative. However, standard accounts assume the contrast class is fixed and the explanandum is unitary. They leave open the possibility that causal ordering is sensitive to the scale of analysis (e.g., comparing nation-states vs. river deltas) or that the outcome is a conjunction of distinct phenomena (e.g., mechanization vs. sustained growth) with independent causal histories.

  When historians disagree, they often talk past one another because they are implicitly answering different parameterized versions of the same question. Additionally, there is a risk that the contrast term ("China") is selected solely because it lacked the outcome, creating a "residue class." If the contrast class provides no independent constraint on the causal field beyond the absence of the outcome, the question collapses into a singular "Why Britain?" query, stripping the contrast of its explanatory power. Existing philosophical frameworks do not provide the tools to detect these specific structural ambiguities, and existing historiography lacks the logical vocabulary to resolve them without new empirical research.

  **Research Design and Methodology**
  This is a purely conceptual project requiring no archival work, quantitative analysis, or foreign language training. The method involves reconstructing the logical form of major historiographical arguments and testing them against the proposed parameterization framework.

  The project focuses on three specific logical tasks:
  1.  **Scale Invariance Testing:** Determine if candidate causal factors (e.g., coal, property rights) retain their explanatory ranking when the unit of analysis shifts from civilization-scale to region-scale. If the ranking flips, the unparameterized question is indeterminate.
  2.  **Bundling Decomposition:** Analyze whether the "Divergence" is treated as a single event or a package. If the package components (e.g., scientific mathematization and industrial mechanization) have divergent causal histories, a single contrastive explanation is logically impossible.
  3.  **The Informational Gain Condition:** To address the "residue class" worry, I will formulate a condition for genuine contrast. A contrast class is genuine only if specifying it narrows the set of admissible causal explanations more than specifying the singular fact alone. If the causal field remains identical whether asking "Why Britain?" or "Why Britain and not China?", the contrast is cosmetic.

  **Six-Month Timeline**
  *   **Month 1: Logical Formalization.** Define the scale and bundling parameters formally. Draft the "Informational Gain Condition" to distinguish genuine contrastive questions from singular questions in contrastive costume.
  *   **Month 2: Historiographical Mapping.** Select a representative sample of prominent divergence arguments (institutionalist, ecological, culturalist). Reconstruct their implicit assumptions regarding scale and outcome bundling without engaging in new empirical research.
  *   **Month 3: Stress-Testing Scale.** Apply the scale parameter to the mapped arguments. Identify which arguments fail when the aggregation level shifts (e.g., from empire to Yangzi Delta). Document cases of "scale-dependent causal reversal."
  *   **Month 4: Stress-Testing Bundling.** Apply the bundling parameter. Determine which arguments rely on the assumption that scientific and industrial outcomes share a single cause. Identify cases where the "package" assumption creates logical contradictions.
  *   **Month 5: Synthesis and Tool Development.** Integrate findings into a "Diagnostic Protocol." This will be a set of criteria for historians to test their own research questions for parameter sensitivity and contrastive validity.
  *   **Month 6: Final Drafting and Dissemination Strategy.** Write the final report and prepare a summary article for a philosophy of history journal. Refine the failure conditions based on the synthesis.

  **Significance and Alternatives**
  This approach is distinct from applying standard interventionist or counterfactual accounts of explanation "off the shelf." Standard accounts typically take the relata of the explanation as given; this project interrogates the construction of the relata themselves. It asks not just "what is the cause?" but "is the question well-formed?"

  The alternative to this repair project is abandonment. Some scholars argue the Great Divergence question is ideologically loaded or Eurocentric and should be discarded. While the ideological critique has merit, abandoning the question cedes the explanatory field to implicit, unexamined assumptions. This project offers a third way: retaining the question but rigorously constraining its logical form to prevent it from functioning as a vehicle for hidden normative assumptions. By making the parameters explicit, the framework exposes where ideological commitments may be masquerading as structural choices (e.g., choosing a civilizational scale that predetermines a cultural explanation).

  **Deliverables**
  The primary deliverable is a **Diagnostic Protocol for Contrastive History**. This will not be a philosophical treatise but a practical rubric usable by working historians. It will consist of a checklist for framing research questions:
  1.  Specify the aggregation level of the contrast units.
  2.  Decompose the outcome into independent conjuncts.
  3.  Verify that the contrast class constrains the causal field beyond the singular fact.

  Secondary deliverables include a working paper detailing the logical formalization of the "Informational Gain Condition" and a conference presentation targeting interdisciplinary audiences in history and philosophy of science.

  **Risk Assessment and Failure Conditions**
  The primary risk is that the proposed framework proves trivial. I address this by defining specific failure conditions.

  1.  **The "It Is Complicated" Failure:** The project fails if the parameterization apparatus turns out to be a technical redescription of the platitude that "history is complex." If the framework simply concludes that "different scales yield different factors" without providing a rule for *which* scale is explanatorily privileged in a given context, it offers no guidance. To avoid this, the deliverable must specify conditions under which a scale shift *invalidates* a causal claim, not merely modifies it.
  2.  **The Triviality Failure (Over-permissiveness):** The project fails if the "Informational Gain Condition" is too weak and certifies every contrastive question as well-posed. If the condition cannot distinguish between a residue class and a genuine comparator, it has no content.
  3.  **The Nihilism Failure (Over-restrictiveness):** Conversely, the project fails if the conditions are so strict that they condemn all macro-historical contrastive questions as ill-posed. This would validate the abandonment strategy rather than the repair strategy.

  Success is defined as a framework that discriminates: it must validate some existing historical questions as well-posed while identifying others as logically defective, providing a clear path for repairing the defective ones. If the final protocol cannot categorize a test set of standard divergence arguments into "well-posed," "ill-posed," or "requires re-parameterization," the project will not have achieved its aim. The fellowship will be considered unsuccessful if the final output amounts to a recommendation for further empirical study rather than a logical resolution of the question's structure.
