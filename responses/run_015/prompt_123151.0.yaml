  9.  **Final Polish:** Check against the prompt's specific constraints (EU/UK/Norway context, specific examples like live boiling, research grants). Ensure these are woven into the argument. (Self-correction: Ensure I mention the specific behavioral markers like ventilation and avoidance as requested).

