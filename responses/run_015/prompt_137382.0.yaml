prompt: |-
  You are a professional philosopher who specializes in metaphysics and mereology. Please brainstorm for a bit before answering, and think carefully — I'd rather have the real state of the debate then a polished textbook summary.

  So, the special composition question: when do some things add up to one further thing? My own answer is what I call the Grip Principle — some things compose something iff they're mutually stuck, each part held in place by the others, so the whole survives a good shake. That's why there's a table here and no such thing as my left shoe plus the Eiffel Tower: no grip, no object. And this isn't just a verbal quibble, right? We plainly know the shoe-Tower thing doesn't exist, so any theory that says every bunch of things composes something (universalism, I think it's called) is refuted by common sense, end of story. The Grip Principle looks like the obvious middle ground, so: (1) isn't this basically what the serious moderate views are groping toward, and why is it so hard for people to nail down the details? (2) why does anyone still defend the extreme answers? (3) and does the answer really have to be one single necessary and sufficient condition covering all cases — could there be one rule for organisms and a different one for artifacts? Everyone writes as if it has to be one rule, and I'v never seen that defended.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **Persona:** Professional philosopher specializing in metaphysics and mereology.
      *   **Task:** Brainstorm and answer three specific questions regarding the Special Composition Question (SCQ).
      *   **User's Position:** Proponent of the "Grip Principle" (a version of contact/fastening-based moderate restrictivism). Believes universalism is refuted by common sense. Suspects moderate views are groping toward this but struggle with details. Wonders why extremists (nihilists/universalists) persist. Questions the assumption of a *single* necessary and sufficient condition (uniformity).
      *   **Tone/Style:** "Real state of the debate," not a polished textbook summary. Careful thinking, brainstorming feel. Professional but engaging.

  2.  **Deconstruct the "Grip Principle":**
      *   *Definition:* Composition occurs iff parts are mutually stuck/held in place (survive a shake).
      *   *Intuition:* Explains tables (yes) vs. shoe+Eiffel Tower (no).
      *   *Classification:* This is a version of *Contact* or *Fastening* views, often categorized under *Moderate Restrictivism*.
      *   *Immediate Philosophical Problems:*
          *   Vagueness: How strong is the grip? (Glue vs. gravity vs. weak nuclear force).
          *   Sorites: Removing one atom at a time.
          *   Physics: Nothing is truly "stuck" at the fundamental level (fields, probabilities).
          *   Organisms: Do my cells "grip" each other? Or is it metabolic?
          *   Artifacts: A pile of sand vs. a sandcastle. Same grip, different ontology?

  3.  **Address Question (1): Isn't this what moderates are groping toward, and why is it hard to nail down?**
      *   *Yes, it's the intuitive sweet spot.* Most people are "folk mereologists" who believe in tables but not "trouts-turkeys" (objects composed of a trout and a turkey).
      *   *Why is it hard?*
          *   *The Vagueness Problem:* If composition is vague (sometimes yes, sometimes no), does that make existence vague? Lewis argued existence can't be vague.
          *   *The Physics Problem:* "Stuck" is macroscopic. At the micro level, it's forces. If forces count, everything interacts (gravity), leading back to universalism. If only *strong* forces count, where's the cutoff?
          *   *The Counterexamples:* What about a swarm of bees? They aren't "stuck" but might compose a swarm. What about a solar system? Gravity holds it, but is it an object?
          *   *The "Shake" Test:* Subjective. How hard is a "good shake"?

  4.  **Address Question (2): Why does anyone still defend the extreme answers (Nihilism/Universalism)?**
      *   *Universalism (Sider, Lewis):*
          *   *Motivation:* Avoids arbitrariness. If $A$ and $B$ compose $C$, why not $A$ and $D$?
          *   *Vagueness Argument:* If restrictivism is true, there must be a borderline case where composition is indeterminate. Lewis says indeterminate existence is nonsense. Therefore, composition must be unrestricted.
          *   *Theoretical Utility:* Good for physics (no privileged reference frames).
      *   *Nihilism (Van Inwagen, Merricks):*
          *   *Motivation:* Only simples exist. Avoids the "where does the object begin?" problem.
          *   *Van Inwagen's Move:* Only living organisms compose things (plus maybe simples). This avoids the artifact problem.
          *   *Error Theory:* We *talk* as if tables exist, but strictly speaking, they don't. It's a useful fiction.
      *   *Common Thread:* Both extremes avoid the "sharp cutoff" problem of moderates. They bite the bullet on counterintuitive results to save logical consistency.

  5.  **Address Question (3): Does it have to be one single rule (Uniformity)?**
      *   *The Assumption:* Most literature assumes a uniform answer (Monism about composition).
      *   *The Challenge:* Why not Pluralism? (Artifacts = function/intent; Organisms = life; Heaps = contact).
      *   *Defenses of Uniformity:*
          *   *Univocity of 'Exists':* 'Exists' should mean the same thing everywhere. If composition conditions vary, is 'existence' ambiguous?
          *   *Borderline Cases:* What about viruses? Crystals? Are they artifacts or organisms? Mixed cases break pluralist systems.
          *   *Sider's Argument:* If the quantifier ($\exists$) is fundamental, it can't vary.
      *   *Defenses of Pluralism:*
          *   *Conceptual Relativism:* Hirsch, Thomasson. Ontology depends on conceptual schemes.
          *   *Domain Specificity:* Maybe biology *does* work differently than carpentry.
      *   *Current State:* This is a hot topic. "Ontological Pluralism" is gaining traction but still controversial.

  6.  **Synthesize and Refine (The "Professional Philosopher" Voice):**
