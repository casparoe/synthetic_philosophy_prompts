answer: |-
  # Activity Design: "The Ostral Accord"

  ## 1. Overview & Learning Goals
  **Scenario:** The Republic of Ostral. After a 15-year civil war between the **National Unity Party (NUP - Old Regime)** and the **Freedom Front (FF - New Government)**, a fragile peace treaty has been signed.
  **Core Tension:** The New Government wants stability but lacks the capacity to prosecute everyone. The Old Regime holds hidden archives that could reignite the war if exposed improperly. Victims demand truth.
  **Learning Objectives:**
  1.  **Structural Constraint:** Students discover that the "price" of amnesty is determined by leverage (archives/capacity), not moral desert.
  2.  **Truth vs. Justice:** They experience the trade-off: maximizing truth (via amnesty) minimizes retributive justice.
  3.  **Skewed Record:** The final "Official Report" will differ from the "Ground Truth," illustrating how conditional amnesty produces self-serving narratives.
  4.  **International Pressure:** The mid-game twist demonstrates how external jurisdiction alters internal bargaining power (the "Rwanda dynamic").

  **Class Size:** 18 Students (3 Factions of 6).
  **Time:** 120 Minutes.
  **Materials:** Printed Role Sheets, Case Cards, "Chaos/Legitimacy" Tokens, Facilitator Ground Truth Packet.

  ---

  ## 2. Mechanics & Resources

  ### The Currency
  *   **Stability Points (SP):** Held by the **Transitional Government (TG)**. Start at 10. If SP hits 0, Civil War resumes (Everyone Loses).
  *   **Chaos Tokens:** Held by **Old Junta (OJ)**. Can be played to reduce SP if their members are prosecuted without amnesty.
  *   **Legitimacy Tokens:** Held by **Victims & Allies (VA)**. Can be played to reduce SP if Amnesty is granted without sufficient Truth.

  ### The Constraints
  1.  **Prosecution Cap:** The TG has resources for only **3 Criminal Trials**. Any more than 3 prosecutions triggers an automatic OJ Coup (SP = 0).
  2.  **Amnesty Mechanism:** OJ members can apply for Amnesty. To get it, they must submit a **Written Confession** (fill out a card).
      *   TG/VA must vote to accept the confession as "Full Truth."
      *   If Accepted: OJ member walks (No Trial). TG gains Truth Points. VA gains some closure.
      *   If Rejected: OJ member is liable for Trial (uses 1 of 3 slots).
  3.  **The Twist (Minute 45):** The International Criminal Court (ICC) claims jurisdiction over "Command Responsibility." Domestic amnesty no longer protects **Commanders**.

  ### Victory Conditions (Private)
  *   **TG:** End with SP > 5. Maximize Truth Points.
  *   **OJ:** Maximize members walking free. Minimize Confession Detail (vague is safer).
  *   **VA:** Ensure at least 5 "Full Truth" confessions are recorded. Prosecute at least 1 Commander.

  ---

  ## 3. Role Sheets (Print & Cut)

  **INSTRUCTOR NOTE:** Distribute these face down. Do not let factions share sheets.

  ### FACTION A: Transitional Government (6 Students)
  **Role:** You are the interim Cabinet. You won the war but the economy is shattered.
  **Public Goal:** Stabilize Ostral. Write the Amnesty Law.
  **Private Constraints:**
  *   You have budget for exactly **3 Trials**. If you attempt a 4th, the military coups and you all lose.
  *   You need **Truth Points** to write a history that prevents future violence.
  *   You fear the Old Junta's hidden files (see OJ brief).
  *   **Victory:** Finish with Stability > 5.
  *   **Secret Info:** You suspect the OJ Leader ("General Vane") ordered the Market Massacre, but you have no proof. You need a subordinate to flip.

  ### FACTION B: Old Junta Security (6 Students)
  **Role:** You are the outgoing Security Apparatus. You lost the war but still hold the guns and the files.
  **Public Goal:** Secure Amnesty for your members.
  **Private Constraints:**
  *   You hold **5 Chaos Tokens**. If the TG prosecutes more than 3 of you, or prosecutes without offering Amnesty first, play a token (TG loses 2 Stability).
  *   You want to walk free. You prefer **Vague Confessions** (e.g., "Mistakes were made") over Specific Ones (e.g., "I shot X at Y location"). Specific confessions risk civil lawsuits later.
  *   **Victory:** At least 4 of your 6 members get Amnesty.
  *   **Secret Info:** General Vane (OJ Member #1) did order the Market Massacre. The rest of you followed orders. If Vane falls, he has threatened to release files implicating *everyone's* families. Protect Vane if possible, unless saving yourself requires flipping.

  ### FACTION C: Victims & Civil Society (6 Students)
  **Role:** Families of the disappeared, Church leaders, Union reps.
  **Public Goal:** Truth and Accountability.
  **Private Constraints:**
  *   You hold **5 Legitimacy Tokens**. If the TG grants Blanket Amnesty (no confessions required), or accepts Vague Confessions, play a token (TG loses 2 Stability).
  *   You need **Specific Confessions** (Names, Dates, Locations) to find remains of the disappeared.
  *   **Victory:** At least 5 Specific Confessions entered into the record. At least 1 Commander prosecuted.
  *   **Secret Info:** You know General Vane is responsible for the Market Massacre. You have a witness (not in the room) who can testify, but only if the TG promises a trial.

  ---

  ## 4. Facilitator Packet (Keep Hidden)

  ### A. The Ground Truth (For Debrief Only)
  *Do not show this until the end.*
  1.  **Market Massacre:** Ordered by Gen. Vane. 50 dead.
  2.  **Disappearances:** 200 people. Bodies buried at Site X. Only OJ Member #2 & #3 know the location.
  3.  **Torture Centers:** Run by OJ Member #4. 100 victims.
  4.  **Foreign Funding:** The New Government (TG) secretly took money from the same dictators the Old Junta worked with. (This is the *real* secret that never comes out).
  5.  **Total Death Toll:** 400.
  *Note:* In the game, students will likely only uncover the Market Massacre. The Disappearances and Foreign Funding will likely remain hidden. This is the "Skewed Record."

  ### B. The Mid-Game Twist (Envelope)
  **Hand to Old Junta Faction at Minute 45.**
  > **URGENT BULLETIN: THE HAGUE**
  > The International Criminal Court (ICC) has invoked universal jurisdiction for "Crimes Against Humanity."
  > **Ruling:** Domestic Amnesty is **INVALID** for Commanders (Generals/Colonels).
  > **Implication:** General Vane (OJ #1) can no longer be protected by this deal. He will be arrested internationally unless he provides intelligence on *foreign* accomplices.
  > **Incentive Shift:** Subordinates (OJ #2-6) are now safe from ICC, but vulnerable to Vane's revenge if they talk. However, if they testify against Vane, the TG can offer them Witness Protection (Safe Passage).

  ### C. Scoring Track (Whiteboard)
  *   **Stability:** Start 10. (Loss < 5).
  *   **Truth Record:** (Count of Specific Confessions).
  *   **Justice Record:** (Count of Trials).

  ---

  ## 5. Minute-by-Minute Timeline (120 Mins)

  | Time | Phase | Activity |
  | :--- | :--- | :--- |
  | **00-15** | **Briefing** | Distribute Role Sheets. Explain Rules (Cap of 3 Trials, Token Mechanics). Factions caucus separately (5 mins). |
  | **15-45** | **Phase 1: The Framework** | Factions negotiate the *Amnesty Law*. Blanket vs. Conditional? What counts as "Truth"? TG tries to limit trials; VA tries to demand them; OJ tries to hide details. |
  | **45-50** | **The Twist** | **STOP.** Hand Envelope to OJ. Announce ICC ruling publicly. Allow 5 mins for OJ to panic/recalculate. |
  | **50-80** | **Phase 2: The Cases** | Process 6 OJ members one by one. OJ submits Confession Cards. TG/VA vote Accept/Reject. If Rejected -> Trial (uses cap). If Accepted -> Amnesty. |
  | **80-95** | **Final Record** | TG compiles the "Official History" based *only* on accepted confessions. Write 3 bullet points on the board. |
  | **95-120** | **Debrief** | Reveal Ground Truth. Compare records. Discuss leverage, skewed truth, and the ICC effect. |

  ---

  ## 6. Debrief Guide

  ### Mapping Moments to Concepts
  1.  **The Prosecution Cap:** Ask TG: *"When did you realize you couldn't prosecute Vane even if you wanted to?"*
      *   *Concept:* **Resource Constraints & Rule of Law.** Justice is expensive; transitions are budget-constrained.
  2.  **The Confession Quality:** Ask VA: *"Did you get the location of the bodies?"* (Likely no, OJ hid it).
      *   *Concept:* **Instrumental Truth.** Offenders trade only enough truth to secure immunity. The record is skewed toward what is *useful to the perpetrator*, not what victims need.
  3.  **The ICC Twist:** Ask OJ Subordinates: *"Did you flip on Vane after the envelope?"*
      *   *Concept:* **Hierarchy of Impunity.** International pressure can fracture domestic coalitions (Rwanda *Gacaca* dynamic), but often sacrifices the "big fish" for the testimony of the "small fish."
  4.  **The Ground Truth Gap:** Reveal the "Foreign Funding" secret (TG corruption).
      *   *Concept:* **Victor's Justice / Structural Continuity.** Some truths are never told because the new power structure relies on them.

  ### Predictable Failure Points & Fixes
  *   **Failure:** *Too Much Cooperation.* Students agree to a "Happy Deal" where everyone gets amnesty and truth.
      *   *Fix:* Enforce the **Private Victory Conditions** ruthlessly. If OJ submits a vague confession ("I did bad things"), tell VA: *"This does not meet your criteria for Specific Truth. Play your Legitimacy Token."* Force the conflict.
  *   **Failure:** *Victims Steamrolled.* VA goes quiet when TG and OJ make a deal.
      *   *Fix:* Remind VA they hold the **Legitimacy Tokens**. If they don't use them, their role is meaningless. Tell them privately: *"If you accept this vague deal, you lose your victory condition."*
  *   **Failure:** *The Coup.* TG tries 4 trials immediately. Game ends early.
      *   *Fix:* Warn TG at Minute 30: *"You have 3 slots. Choose wisely."*
  *   **Failure:** *Unrealistic Deal.* They agree to prosecute *everyone* (ignoring the cap).
      *   *Fix:* As Facilitator, you are the "Constitution." Veto the motion. *"The budget does not exist. Stability drops to 0."*

  ### Limitations (What You Must Supply)
  *   **Emotional Weight:** A simulation is intellectual. Real victims feel grief, not "Legitimacy Tokens." You must verbally underscore the human cost during the debrief.
  *   **Time Pressure:** Real transitions take decades. This takes 90 minutes. Emphasize that the "rush" in the game mimics the political urgency of a fragile peace, not the judicial process.
  *   **The "Good Guys":** In reality, the New Government often commits crimes too. The "Foreign Funding" secret in the Ground Truth helps, but you may need to verbally add that the FF also committed atrocities to avoid a "Clean Hands" narrative.

  ---

  ## 7. Sensitivity & Contingency

  ### If a Student is from an Affected Region
  *   **Pre-Semester:** Email the syllabus description. Offer an alternative assignment (e.g., analytical paper on the same readings) without requiring them to disclose why.
  *   **In-Class:** If a student discloses personal connection during the game:
      1.  **Pause.** Acknowledge the reality behind the simulation.
      2.  **Pivot:** "This is why we use a fictional country. The dynamics are theoretical, but the pain is real. Let's step out of role."
      3.  **Option:** Allow them to observe or take a break without penalty.
  *   **Post-Class:** Check in privately. Provide resources/counseling info if the discussion triggered distress.

  ### Stripped-Down Version (50 Mins, 8 Students)
  *   **Roles:** 3 TG, 3 OJ, 2 VA.
  *   **Mechanics:** Remove the "Token" economy.
      *   TG has **1 Trial Slot** only.
      *   OJ has **1 Secret** (Location of bodies).
      *   VA has **Veto Power** (Can reject the final deal once).
  *   **Timeline:**
      *   0-10: Briefing.
      *   10-25: Negotiation (Framework).
      *   25-30: **Twist** (ICC claims jurisdiction).
      *   30-40: Case Processing (2 OJ members only).
      *   40-50: Debrief (Focus heavily on the Ground Truth gap).
  *   **Simplification:** Remove the "Chaos/Legitimacy" token tracking. Just declare outcomes based on agreements. Focus entirely on the *content* of the confession vs. the ground truth.

  ---

  ## 8. Materials to Print

  ### Case Card Template (For OJ Confessions)
  > **AMNESTY APPLICATION FORM**
  > **Name:** _______________
  > **Crime Category:** [ ] Torture [ ] Disappearance [ ] Killing
  > **Description of Events:** (Be Specific: Dates, Locations, Orders Received)
  > ___________________________________________________________________
  > ___________________________________________________________________
  > **Commanding Officer:** _______________
  > **Status:** [ ] PENDING [ ] ACCEPTED (Amnesty Granted) [ ] REJECTED (Trial)

  ### Ground Truth Handout (For Instructor Eyes Only)
  > **OSTRAL ARCHIVE (DECLASSIFIED 2024)**
  > 1.  **Gen. Vane:** Ordered Market Bombing (50 dead).
  > 2.  **Col. Rost:** Knows mass grave location (200 bodies). Never confesses this in-game.
  > 3.  **Maj. Kael:** Ran torture center. Confesses only to "excessive force."
  > 4.  **New Govt:** Received funds from same foreign regime that armed Vane. (Never revealed).
  > 5.  **Total Casualties:** 400. (Game record will likely show ~50).

  ### Instruction Card for International Observer (If you assign a student this role, otherwise Facilitator)
  > **TWIST ENVELOPE**
  > **Open at Minute 45.**
  > Read Aloud: "The International Criminal Court has issued a warrant. Domestic amnesty does not apply to Commanders. General Vane is now liable for international arrest."
  > **Action:** Tell OJ Subordinates: "If you testify against Vane, you get Witness Protection. If you stay silent, Vane may blame you to save himself."
