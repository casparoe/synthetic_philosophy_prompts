answer: |-
  **Joint Statement of Understanding: Parfit's Hitchhiker & Rational Irrationality**
  **Date:** 14 October
  **From:** The "Disposition" Camp (Camp A) & The "Act-Based" Camp (Camp B)
  **Status:** Agreed Draft v3

  Look, we've spent enough evenings talking past one another. We reckon this document captures where we actually stand. We aren't resolving the debate here, but we are stopping the charade that we're arguing about the same thing in the same way. Below is the map of our agreement, our splits, and the specific tests we think would settle it.

  ### 1. Common Ground (What We Both Sign)

  *   **The Setup:** We agree on the mechanics. You are in the desert. A driver offers a ride to town on the condition you pay them £100 once you arrive. The driver is a perfect (or near-perfect) predictor of your behaviour. If they predict you won't pay, they leave you. If they predict you will, they drive.
  *   **The Outcome:** We both agree that the agent who *gets into the car and pays* ends up better off (alive minus £100) than the agent who *gets left in the desert*. We both want to be the agent who survives.
  *   **Real-World Precommitment:** We agree that in the actual world, physical precommitment devices exist and work. Contracts, reputation mechanisms, and Ulysses pacts (tying yourself to the mast) change incentives. We aren't arguing about whether you can hire a lawyer to enforce a promise; we are arguing about a case where *no external enforcement exists*.
  *   **Rationality Goal:** We both accept that rationality is broadly about maximising expected utility. We are not advocating for self-sabotage for its own sake. The disagreement is purely on *how* to calculate that utility.

  ### 2. The Precise Disagreements

  Here is where we diverge. We have phrased these so each side feels their core intuition is respected.

  **Camp A (Disposition/Policy View):**
  Rationality evaluates the *source code* of the agent, not just the individual output. It is rational to adopt a disposition to pay because that disposition is what causes the driver to pick you up. Refusing to pay once in town is a failure of rationality because it renders your prior decision (to be the kind of person who gets rides) incoherent. You can bind your future self by being the *type* of agent for whom the promise is binding.

  **Camp B (Act-Based/Causal View):**
  Rationality evaluates the *specific act* at the moment of choice based on its causal consequences. Once you are in the car, the driver's decision is fixed. Paying £100 now has no causal power to bring the car back if you defect. Therefore, paying is strictly dominated by defecting. Claiming you can "bind" yourself without a physical enforcement mechanism is wishful thinking; it conflates "it is useful to be believed to be rational" with "it is rational to do this specific act."

  ### 3. The Cruxes

  We identified two specific hinges the whole argument turns on.

  **Crux 1: Preference Stability Across Time**
  *   **The Issue:** Can a rational agent maintain a preference to perform an action (paying) when the local incentives for that action have flipped (you are now safe in town)?
  *   **Camp A Prediction:** Yes. Rational agents treat their future choices as logical outputs of their current policy. If you change your mind, you reveal you never had the policy to begin with.
  *   **Camp B Prediction:** No. Preferences should update based on available causal leverage. Once the leverage is gone, maintaining the preference is a sunk cost fallacy.
  *   **Test Case:** *The Transparent Precommitment.* Imagine you can take a pill in the desert that makes you physically ill if you don't pay later.
      *   **Camp A:** This is unnecessary clutter. A rational agent doesn't need the pill; their reasoning *is* the binding.
      *   **Camp B:** This proves our point. Without the pill (the causal mechanism), you defect. With the pill, you pay. Therefore, the "binding" was the pill, not the rationality.

  **Crux 2: Causal vs. Evidential/Logical Correlation**
  *   **The Issue:** Is the correlation between "deciding to pay" and "getting the ride" causal or merely evidential?
  *   **Camp A Prediction:** It is a logical/formal causation. Your decision *now* is the same algorithm the driver simulated *then*. You control the prediction by controlling your output.
  *   **Camp B Prediction:** It is purely evidential. Your decision is evidence of what you *would* have done, but it does not *cause* the past prediction to change. You cannot causally influence the past.
  *   **Test Case:** *The Genetic Marker.* Suppose the driver doesn't simulate you, but scans a gene that correlates 100% with paying.
      *   **Camp A:** You still pay. If you defect, you prove you have the 'defector gene', meaning you would have been left in the desert. (This pushes A towards FDT).
      *   **Camp B:** You definitely defect. The gene is already there. Paying £100 won't change your DNA or the driver's past action. (This is the classic smoking lesion problem).

  ### 4. The 80% Accuracy Variant

  We both looked at the variant where the driver is only 80% accurate (they get it wrong 1 in 5 times).

  **Camp A Position:**
  This weakens the argument slightly but doesn't break it. Even at 80%, the expected utility of being the *type* of agent who pays is higher than being the type who defects. You still pay. The logical link remains, it's just noisy. If you decide to defect, you are signalling to the algorithm that there is an 80% chance you were always going to defect.

  **Camp B Position:**
  This actually strengthens our position. With imperfect prediction, the evidential link is weaker, but the causal link remains zero. Since there is a 20% chance the driver got it wrong anyway, you might get a ride even if you're a defector. But regardless of the odds, once you are in the car, the prediction is a *fait accompli*. Paying costs you £100 with 0% causal return. We defect.

  **Do we think this changes anything?**
  *   **Camp A:** No. It just adds probability weights to the same decision theory.
  *   **Camp B:** Yes. It highlights that Camp A is treating a probabilistic correlation as a logical identity.

  ### 5. Is This Just a Verbal Dispute?

  We owe each other honesty here. We reckon about 40% of this fight is verbal.

  1.  **Definition of 'Rational':**
      *   Camp A is using 'rational' to mean **"winning"** (systematically achieving good outcomes).
      *   Camp B is using 'rational' to mean **"locally consistent"** (making the optimal move given the current state of the world).
      *   *Agreement:* If we define rationality as "winning," Camp A wins. If we define it as "causal optimisation at time T," Camp B wins. We need to decide which definition is more useful for our reading group before proceeding.

  2.  **Definition of 'Binding':**
      *   Camp B hears "binding" and thinks of **physical constraints** (locks, contracts, guns to the head).
      *   Camp A hears "binding" and thinks of **constitutive rules** (the rules that make you an agent rather than a randomiser).
      *   *Agreement:* Camp A admits they can't physically stop their future self without a pill. Camp B admits that Camp A's "disposition" functions *like* a binding in terms of outcomes, even if it's not mechanical.

  ### Next Steps

  We stop arguing about whether the Hitchhiker *should* pay. We accept that Camp A describes an agent that survives, and Camp B describes an agent that reasons correctly but dies. The remaining question is: **Do we want a theory of rationality that describes how to win, or one that describes how to reason correctly at the moment of action?**

  We'll vote on that next week.

  **Signed,**
  *Rep for Camp A (The Binders)*
  *Rep for Camp B (The Defectors)*
