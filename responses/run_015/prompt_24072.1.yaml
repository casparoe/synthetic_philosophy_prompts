      *   $P(E|H)$: Probability of having *this* experience given Heads. There is 1 awakening.
      *   $P(E|T)$: Probability of having *this* experience given Tails. There are 2 awakenings.
      *   If we assume SIA (Self-Indication Assumption), the probability of existing/being sampled is proportional to the number of observers.
      *   So, $P(E|H) \propto 1$, $P(E|T) \propto 2$.
