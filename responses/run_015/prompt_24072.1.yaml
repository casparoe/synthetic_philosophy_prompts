          *   If $E$ = "I am experiencing an awakening":
              *   Under H: 1 awakening exists. Probability *I am this one*?
              *   Under T: 2 awakenings exist. Probability *I am one of these*?
          *   Halfer View: $P(E|H) = 1$ and $P(E|T) = 1$. (Because Beauty wakes up in both scenarios). Therefore Likelihood Ratio = 1. Posterior = Prior = 1/2.
          *   Thirder View: $P(E|H) \propto 1$, $P(E|T) \propto 2$. (Because there are twice as many opportunities to be awake). Or, using conditional probability on the indexical "today".
          *   *Refining the Halfer Bayesian Claim:* The Halfer claims that the event "Beauty wakes up" is guaranteed in both branches. Therefore, it screens off no information.
          *   *Refining the Thirder Bayesian Claim:* The event "This specific awakening occurs" or "I am sampled from the set of awakenings" is twice as likely under Tails.
      *   *The Seam:* The definition of the Evidence $E$. Is it "Waking occurs" (Halfer) or "This waking occurs" (Thirder)? Or is it the *probability of the evidence* given the hypothesis regarding the *number of observers*?
      *   *Strict Bayesian Formulation:*
          *   $P(H|E) = \frac{P(E|H)P(H)}{P(E)}$.
          *   Halfer: $P(E|H) = 1, P(E|T) = 1$. (Evidence is "I am awake during the experiment").
          *   Thirder: $P(E|H) = 1/2, P(E|T) = 1$ (if E is "This is Monday")? No, that's the "Monday" argument.
          *   Let's stick to the standard "Awake" evidence.
          *   Thirder (SIA style): $P(E|H) \propto 1$, $P(E|T) \propto 2$.
