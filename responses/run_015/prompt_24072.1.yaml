answer: |-
  The one-liner "It's a fair coin, so the probability is 1/2" is indeed a rhetorical shibboleth. It functions as a conversation-stopper by conflating a physical fact about the coin with a normative claim about credence. In a debate, this sentence is rarely doing just one thing.

  Here is a menu of the distinct precise claims that sentence might be standing in for, classified by their logical status. Following the menu, I provide the exact Bayesian dissection you requested.

  ### The Menu of Claims

  **1. The Physical Propensity Claim**
  *   **The Claim:** The coin mechanism has a physical bias of 0.5 for Heads and 0.5 for Tails prior to the toss.
  *   **Status:** **Platitude.** No thirder disputes this. The disagreement is not about the coin's physics, but about how Beauty's credence relates to that physics after she wakes.
  *   **Debate Utility:** None. If the halfer means only this, they have not addressed the problem.

  **2. The Prior Credence Claim**
  *   **The Claim:** Beauty's credence in Heads on Sunday (before the experiment begins) is 1/2.
  *   **Status:** **Platitude.** Both halfers and thirders agree that $P(H) = 1/2$ on Sunday.
  *   **Debate Utility:** Low. The problem concerns $P(H | \text{Awake})$, not $P(H)$.

  **3. The "No New Information" Claim**
  *   **The Claim:** The event of waking up provides no new relevant evidence that distinguishes Heads from Tails, because Beauty knew in advance she would wake up in either scenario.
  *   **Status:** **Substantive and Defensible.** This is the core philosophical thesis of Halferism (specifically the Lewisian view). It asserts that logical certainty of an event ($P(E)=1$) precludes it from functioning as a Bayesian update.
  *   **Debate Utility:** **High.** This is the actual argument. If the halfer is invoking this, they are making a claim about information theory, not coin physics.

  **4. The Reference Class Invariance Claim**
  *   **The Claim:** The relevant reference class for probability is "coin tosses," not "awakenings." Since 50% of *tosses* are Heads, 50% of *credence* should be Heads.
  *   **Status:** **Substantive and Contested.** This is a methodological choice. Thirders argue the reference class must be "awakenings" because that is Beauty's epistemic situation.
  *   **Debate Utility:** **High.** This exposes the disagreement as one about sampling methodology.

  **5. The Likelihood Equivalence Claim (Bayesian)**
  *   **The Claim:** The likelihood of the evidence given Heads is identical to the likelihood of the evidence given Tails ($P(E|H) = P(E|T)$).
  *   **Status:** **Substantive and Contested.** This is the mathematical engine of the "No New Information" claim.
  *   **Debate Utility:** **Critical.** This is where the math breaks.

  **Most Likely Invocation:**
  When your opponent uses the line to shut down your argument, they are almost certainly invoking **Claim 3 (No New Information)** but disguising it as **Claim 1 (Physical Propensity)**. They are relying on the intuition that if the *cause* (the coin) is 50/50, the *effect* (the credence) must be 50/50, ignoring the filtering process (the awakenings) in between.

  ---

  ### The Exact Bayesian Reading

  You asked for the precise seam where the arguments diverge. It is not in the Prior ($P(H)$), which both sides agree is $1/2$. It is not in the Posterior formula itself. **The divergence is in the Likelihood Ratio.**

  To see this, we must define the Evidence ($E$) exactly.

  #### 1. The Variables
  *   $H$: The coin landed Heads.
  *   $T$: The coin landed Tails.
  *   $E$: The specific evidence Beauty possesses upon waking.

  #### 2. The Halfer's Bayesian Calculation
  The Halfer defines the evidence $E$ as **"An awakening is occurring."**
  *   **Likelihood under Heads:** If Heads, Beauty wakes up on Monday. Is an awakening occurring? Yes.
      $$P(E | H) = 1$$
  *   **Likelihood under Tails:** If Tails, Beauty wakes up on Monday and Tuesday. Is an awakening occurring? Yes.
      $$P(E | T) = 1$$
  *   **Likelihood Ratio:** $1 : 1$.
  *   **Result:** Since the likelihoods are equal, the evidence $E$ does not shift the prior.
      $$P(H | E) = P(H) = 1/2$$

  **The Halfer's Precise Claim:** "Waking up" is a binary state guaranteed by the experimental protocol in both branches of the probability tree. Therefore, it has no discriminatory power.

  #### 3. The Thirder's Bayesian Calculation
  The Thirder defines the evidence $E$ as **"I am experiencing *this* particular awakening."** (This invokes a Self-Sampling Assumption).
  *   **Likelihood under Heads:** If Heads, there is **1** possible awakening (Monday). The probability that *this* specific experience is the one occurring is proportional to 1.
      $$P(E | H) \propto 1$$
  *   **Likelihood under Tails:** If Tails, there are **2** possible awakenings (Monday, Tuesday). The probability that *this* specific experience is one of the ones occurring is proportional to 2.
      $$P(E | T) \propto 2$$
  *   **Likelihood Ratio:** $1 : 2$.
  *   **Result:** The evidence is twice as likely to be sampled under Tails.
      $$P(H | E) = \frac{1 \cdot (1/2)}{1 \cdot (1/2) + 2 \cdot (1/2)} = 1/3$$

  **The Thirder's Precise Claim:** "Waking up" is not just a binary state; it is a sampling event from the set of all awakenings. Because Tails produces twice as many sampling opportunities, finding yourself in *an* awakening is evidence favoring Tails.

  ### The Exact Seam

  The seam is **the definition of the sample space for the Likelihoods.**

  *   **The Halfer** treats the sample space as **Worlds**: {Heads-World, Tails-World}. In both worlds, the proposition "Beauty wakes" is true.
  *   **The Thirder** treats the sample space as **Centered Worlds (Observer-Moments)**: {Heads-Mon, Tails-Mon, Tails-Tue}. In this space, the proposition "I am awake now" selects one element from the set.

  **How to deploy this in debate:**
  Do not ask him "Why is it 1/2?" Ask him to define $E$.
  Say: *"We agree the prior is 1/2. We agree on Bayes' Theorem. So we must disagree on the Likelihoods. Do you claim that $P(\text{I am awake now} | \text{Heads})$ is equal to $P(\text{I am awake now} | \text{Tails})$? If yes, are you arguing that the number of awakenings is irrelevant to the probability of me experiencing one?"*

  This forces him to abandon the "fair coin" platitude and defend the substantive claim that **observer count does not affect likelihood.** That is the precise point of failure for his argument.
