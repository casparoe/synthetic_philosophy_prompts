      *   *Hidden assumptions:* No new information is gained upon waking; the indexical nature of "now" doesn't shift probabilities; the reference class is "coin tosses" not "awakenings."

  3.  **Drafting the Menu of Claims:**
      *   *Claim 1 (Physical):* The coin's bias is 0.5. (Platitude)
