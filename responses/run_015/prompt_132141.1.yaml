      *   *The Conceptual Distinction:* The difference between *Representation* (mimesis, substitution, alienation) and *Presence* (immediacy, transparency, reciprocity).

  3.  **Drafting the Conceptual Distinction (The "Instrument" Analogy):**
      *   Since the user likes laboratory instruments, I should frame the distinction in terms of signal transmission or measurement.
      *   *Theater:* Like a instrument that alters the sample it measures. It introduces a third term (the actor/representation) between the subject and the object (the moral truth/community). It creates a "feedback loop" of vanity.
