prompt: |-
  After a long career in the natural sciences, I have only recently begun studying philosophy systematically, and I find myself thinking about representational mediation in social institutions with the same care I once applied to instruments in the laboratory. Give an example of a conceptual issue arising inside Rousseau's critique of theater—particularly the tension between his rejection of mimetic spectacle as a source of moral corruption and artificial inequality, and his endorsement of open-air civic festivals that still organize citizens as collective spectators—where the problem turns on whether every shared visual experience introduces a distorting representational layer, or whether some public rituals avoid this corruption and preserve unmediated civic presence. Please do not cite particular editions, page numbers, or scholars; instead, articulate the conceptual distinction precisely, and explain why settling it matters for the consistency of Rousseau's broader argument about direct participation in public life.
reasoning: |-
