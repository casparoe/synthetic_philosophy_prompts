prompt: |-
  I serve on a municipal sustainability board that evaluates long-term infrastructure proposals—coastal defenses, soil-restoration bonds, and carbon-sequestration contracts—whose costs fall on present taxpayers but whose benefits unfold across 80 to 200 years. Our economic consultants deliver a single “social discount rate,” yet I have come to suspect that this figure smuggles together genuinely distinct considerations: the risk that future climate regimes or technologies will alter the value of the project; the expectation that future generations will be wealthier, lowering the marginal utility of the same benefit; and what is called pure time preference, the idea that a good is worth less solely because it arrives later, irrespective of risk or wealth. I need a reusable decision procedure my board can run on any proposal that forces these factors apart, tells us whether a proposed rate is justified by temporal distance alone, and flags exactly where empirical analysis ends and a normative judgment about intergenerational neutrality begins.

  Please construct the procedure as an ordered checklist or flowchart in words: the specific questions to ask about a proposal’s time profile and the source of each discount factor; what counts as a sufficient answer at each stage, including how to distinguish a growth-based or risk-based reduction from one that treats future welfare as intrinsically less important; the points at which the procedure stops with a clear recommendation to reject or revise a rate; and the explicit handoff moments where the remaining dispute is not factual but a value choice about whether it is permissible to weigh our grandchildren’s welfare lower just because they live later. Apply the procedure to two concrete cases we are weighing: a seawall whose protective benefits extend 120 years but depend on highly uncertain future sea-level trajectories and engineering standards, and a reforestation initiative with benefits spread over 150 years under conditions of relative climatic and economic stability. In each case, show where the procedure isolates pure time preference from other discounting grounds, and mark precisely where the board must make a normative decision that no formula can settle.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Deconstruct the Request:**

      *   **User Role:** Member of a municipal sustainability board.
      *   **Task:** Evaluate long-term infrastructure proposals (costs now, benefits 80-200 years later).
      *   **Problem:** Economic consultants provide a single "social discount rate" (SDR) that conflates distinct ethical and empirical factors (risk, growth, pure time preference).
      *   **Goal:** A reusable decision procedure (checklist/flowchart in words) to disentangle these factors, justify rates based on temporal distance alone, flag where empirical analysis ends and normative judgment begins, and apply this to two specific cases (Seawall vs. Reforestation).
      *   **Key Requirements:**
          *   Ordered checklist/flowchart structure.
          *   Specific questions about time profile and discount sources.
          *   Criteria for sufficient answers.
          *   Distinction between growth/risk discounting vs. pure time preference.
          *   Stop points for rejection/revision.
          *   Explicit "handoff moments" for normative value choices (intergenerational neutrality).
          *   Application to two cases (Seawall: high uncertainty; Reforestation: stable).
          *   Identification of where pure time preference is isolated and where normative decisions are required.

  2.  **Theoretical Foundation:**

      *   The core economic framework here is the *Ramsey Rule* for the Social Discount Rate: $r = \rho + \eta \cdot g$.
          *   $r$: Social Discount Rate.
          *   $\rho$ (rho): Pure Rate of Time Preference (PRTP). This is the ethical/normative part (do we value future welfare less just because it's later?).
          *   $\eta$ (eta): Elasticity of Marginal Utility of Consumption (inequality aversion).
          *   $g$: Expected growth rate of consumption per capita.
          *   $\eta \cdot g$: The "wealth effect" discount (future people are richer, so an extra dollar helps them less).
      *   Plus *Risk/Uncertainty*: Often added as a premium or handled via certainty equivalents.
      *   The user wants to separate $\rho$ (ethical) from $g$ and Risk (empirical/technical).
      *   Key Ethical Concept: *Intergenerational Neutrality* (often implies $\rho \approx 0$).

  3.  **Drafting the Procedure (Iterative Process):**

      *   *Step 1: Define the Baseline.* Need to establish the project timeline and cash flows.
      *   *Step 2: Isolate Risk.* This is project-specific, not time-specific. If the project fails due to tech change or climate shift, that's a probability adjustment, not a discount rate adjustment.
      *   *Step 3: Isolate Growth (Wealth Effect).* Are future people richer? If so, marginal utility drops. This requires empirical economic forecasting.
      *   *Step 4: Isolate Pure Time Preference.* What remains? This is the ethical core.
      *   *Step 5: The Normative Handoff.* Explicitly state that Step 4 is a value judgment.
      *   *Step 6: Synthesis.* Combine the components to see if the consultant's single rate matches the sum of parts.

      *Refining the "Stop/Revise" points:* If risk is high, don't discount the rate; adjust the *benefit probability*. If growth is negative, discounting might be negative (future benefits worth *more*). If $\rho > 0$, demand justification.

  4.  **Developing the Two Cases:**

      *   *Case A: Seawall (120 years).* High uncertainty (sea levels, engineering).
          *   Risk component should be high.
          *   Growth component standard.
          *   Pure time preference: The board must decide if 120 years out counts for less *ethically*.
          *   *Crucial distinction:* Don't use the discount rate to handle the uncertainty of sea levels. Use probability weighting on the benefits themselves.
      *   *Case B: Reforestation (150 years).* Stable climate/economy.
          *   Risk component low.
          *   Growth component standard.
          *   Pure time preference: The main driver of discounting here.
          *   *Crucial distinction:* Since risk is low, a high discount rate implies a high $\rho$ (valuing present over future intrinsically).

  5.  **Structuring the Response:**

      *   **Introduction:** Acknowledge the sophistication of the query (Ramsey Rule decomposition).
      *   **The Procedure:** "The Intergenerational Discounting Decomposition Protocol." Use clear headings and bold text for decision points.
      *   **The Normative Handoff:** Make this visually distinct.
      *   **Application to Case 1 (Seawall):** Walk through the steps.
      *   **Application to Case 2 (Reforestation):** Walk through the steps.
      *   **Comparison/Conclusion:** Highlight the difference in where the normative burden lies.

  6.  **Refining the Content (Self-Correction during drafting):**

      *   *Correction:* Make sure not to get too bogged down in math formulas. Keep it procedural/qualitative but grounded in the Ramsey logic.
      *   *Emphasis:* The prompt asks to flag where empirical analysis ends. I need to be very sharp on "This is a forecast" vs. "This is a value."
      *   *Emphasis:* The prompt asks to distinguish risk from time preference. A common error is raising the discount rate to account for risk. The procedure must forbid this. Risk belongs in the numerator (expected benefits), not the denominator (discount rate).
      *   *Tone:* Professional, bureaucratic but ethically rigorous, suitable for a board memo.

  7.  **Final Review against Constraints:**

      *   Ordered checklist/flowchart in words? Yes.
      *   Specific questions? Yes.
      *   Sufficient answers defined? Yes.
      *   Distinguish growth/risk from pure time preference? Yes.
      *   Stop points for rejection? Yes.
      *   Explicit handoff moments? Yes.
      *   Apply to Seawall and Reforestation? Yes.
      *   Mark normative decision points? Yes.

  8.  **Final Polish:** Ensure clear formatting (bolding, lists) to make it usable as a actual tool. (Proceed to generate output based on this thought process).

  *(Self-Correction Note during final output generation)*: I need to ensure I explicitly mention the "Ramsey Rule" components without making it a math test. The user knows the terms ($\rho$, $\eta$, $g$), so I can use them as shorthand for the concepts. I must ensure the distinction between *adjusting the probability of the benefit* (risk) and *discounting the value* (time preference) is crystal clear, as this is a common point of confusion in cost-benefit analysis.

  Let's build the "Intergenerational Discounting Decomposition Protocol."

  *   **Phase 1: Risk & Uncertainty (The Numerator Adjustment)**
  *   **Phase 2: Economic Growth & Marginal Utility (The Wealth Adjustment)**
  *   **Phase 3: Pure Time Preference (The Ethical Residual)**
  *   **Phase 4: Synthesis & Normative Handoff**

  Okay, ready to write.s
answer: |-
  ## The Intergenerational Discounting Decomposition Protocol

  This procedure is designed to dismantle a single "Social Discount Rate" (SDR) into its constituent empirical and ethical parts. It prevents the masking of value judgments as technical assumptions. Use this checklist for every infrastructure proposal with a benefit horizon exceeding 50 years.

  ### Phase 1: Risk and Uncertainty (The Numerator Test)
  *Goal: Ensure that project-specific risks are not hidden inside the discount rate.*

  **1.1. Identify Temporal Uncertainty**
  *   **Question:** Does the physical delivery of the benefit depend on variables that change over time (e.g., sea-level rise trajectories, material degradation, technological obsolescence)?
  *   **Sufficient Answer:** A probabilistic range of benefit delivery (e.g., "80% chance of full protection, 20% chance of failure by year 100").
  *   **Failure Condition:** If the consultant proposes raising the discount rate to account for "uncertainty," **STOP and REJECT**. Risk belongs in the expected benefit calculation (the numerator), not the discount rate (the denominator).
  *   **Action:** Adjust the projected benefits downward based on probability *before* applying any discount rate.

  **1.2. Identify Regime Change Risk**
  *   **Question:** Is there a non-zero probability that the societal or ecological context will change so drastically that the benefit becomes worthless (e.g., population abandonment of the coast)?
  *   **Sufficient Answer:** A specific "abandonment probability" assigned to specific future epochs.
  *   **Action:** Truncate the benefit stream where the probability of relevance drops below a defined threshold (e.g., 10%). Do not discount these benefits; remove them.

  ### Phase 2: Economic Growth and Marginal Utility (The Wealth Test)
  *Goal: Isolate the empirical expectation that future generations will be richer.*

  **2.1. Establish Consumption Growth Forecast ($g$)**
  *   **Question:** What is the empirical forecast for per-capita consumption growth over the project's lifespan?
  *   **Sufficient Answer:** A referenced economic forecast (e.g., "2% annual real growth based on CBO long-term projections").
  *   **Failure Condition:** If the forecast assumes indefinite exponential growth beyond 100 years without ecological constraints, **FLAG FOR REVISION**.
  *   **Action:** Adopt a declining growth rate schedule if the project horizon exceeds standard economic forecasting windows (e.g., growth slows from 2% to 0.5% after year 80).

  **2.2. Determine Elasticity of Marginal Utility ($\eta$)**
  *   **Question:** If future generations are richer, how much less value does an additional dollar provide them compared to us?
  *   **Sufficient Answer:** A technical parameter derived from observed inequality aversion (typically between 1.0 and 1.5).
  *   **Action:** Calculate the **Wealth Discount Component** = $g \times \eta$.
  *   **Note:** This is an *empirical* discount. It argues that a dollar is worth less to a rich descendant, not that the descendant's welfare matters less.

  ### Phase 3: Pure Time Preference (The Ethical Residual)
  *Goal: Isolate the claim that future welfare is intrinsically less valuable solely due to temporal distance.*

  **3.1. Isolate the Residual Rate ($\rho$)**
  *   **Question:** After accounting for Risk (Phase 1) and Wealth (Phase 2), does the consultant's proposed SDR still contain a remaining percentage?
  *   **Calculation:** $\text{Pure Time Preference} (\rho) = \text{Proposed SDR} - (\text{Wealth Discount Component})$.
  *   **Sufficient Answer:** A explicit declaration of the $\rho$ value (e.g., "0.5%" or "1.0%").
  *   **Failure Condition:** If the consultant cannot separate $\rho$ from the total rate, **STOP and REQUEST RECALCULATION**.

  **3.2. Justify the Ethical Weight**
  *   **Question:** What is the ethical justification for $\rho > 0$?
  *   **Sufficient Answer:** A normative statement regarding intergenerational neutrality (e.g., "We prioritize current taxpayers" OR "We apply a 0.1% rate to reflect existential risk of human extinction").
  *   **Action:** If $\rho > 0$, proceed to Phase 4. If $\rho = 0$, the rate is fully justified by empirical wealth effects and risk.

  ### Phase 4: The Normative Handoff (The Value Judgment)
  *Goal: Explicitly mark where technical analysis ends and moral philosophy begins.*

  **4.1. The Neutrality Declaration**
  *   **Board Decision Point:** The board must vote on the **Principle of Intergenerational Neutrality**.
  *   **Option A (Neutral):** $\rho = 0$. We treat the welfare of a person born in 2120 as equal to a person born in 2024, adjusted only for their relative wealth.
  *   **Option B (Prioritarian):** $\rho > 0$. We explicitly value the welfare of current citizens higher than future citizens, regardless of wealth.
  *   **Requirement:** If Option B is chosen, the board must record the specific *rate of discrimination* (e.g., "We discount future welfare at 1% per annum purely due to time").

  **4.2. Final Rate Assembly**
  *   **Formula:** $\text{Final SDR} = \text{Risk Adjustment (Numerator)} + (\text{Growth} \times \text{Elasticity}) + \text{Pure Time Preference}$.
  *   **Action:** Approve the rate only if the Pure Time Preference component matches the Board's Neutrality Declaration.

  ***

  ## Application to Case Studies

  ### Case 1: The Coastal Seawall (120-Year Horizon)
  *Characteristics: High physical uncertainty, high technological dependency.*

  **Phase 1: Risk and Uncertainty**
  *   **Analysis:** The benefit (flood protection) depends on sea-level rise (SLR) and storm intensity.
  *   **Procedure Application:** The consultant proposes a 4% SDR, citing "high uncertainty."
  *   **Protocol Verdict:** **REJECT the rate justification.** Under Phase 1.1, SLR uncertainty must be modeled as a probability of failure (e.g., if SLR > 2m, wall fails). This reduces the *expected benefit* in the numerator. It does not justify increasing the discount rate.
  *   **Adjustment:** Reduce Year 80–120 benefits by 40% to reflect failure probability. Do not discount them further for risk.

  **Phase 2: Economic Growth**
  *   **Analysis:** Coastal property values may not grow if climate risk is high.
  *   **Procedure Application:** Standard 2% growth assumption is likely too high for this specific asset class.
  *   **Adjustment:** Lower $g$ to 1% for this specific locality/asset. Wealth Discount Component = $1\% \times 1.2 (\eta) = 1.2\%$.

  **Phase 3 & 4: Pure Time Preference and Handoff**
  *   **Isolation:** Proposed SDR (4%) - Wealth Component (1.2%) = **2.8% Pure Time Preference ($\rho$)**.
  *   **Normative Decision:** The board must ask: *"Are we willing to state that a future generation's safety is worth 2.8% less per year simply because they live later?"*
  *   **Outcome:** If the board adheres to Intergenerational Neutrality ($\rho = 0$), the final SDR must be **1.2%**. The high uncertainty was already handled in Phase 1.
  *   **Marked Handoff:** The decision to accept 4% instead of 1.2% is not an economic calculation; it is a declaration that the lives of future residents are intrinsically less valuable than current taxpayers.

  ### Case 2: Reforestation Initiative (150-Year Horizon)
  *Characteristics: Low physical uncertainty, stable climatic/economic conditions.*

  **Phase 1: Risk and Uncertainty**
  *   **Analysis:** Carbon sequestration and soil health are biologically robust; less dependent on specific engineering standards.
  *   **Procedure Application:** Consultant proposes 3% SDR.
  *   **Protocol Verdict:** **PASS.** Risk is low. No need to heavily discount the numerator. The benefits are likely to materialize if the land is protected.

  **Phase 2: Economic Growth**
  *   **Analysis:** Long-term global growth is expected, but marginal utility of income may decline.
  *   **Procedure Application:** Standard 2% growth ($g$) and 1.0 elasticity ($\eta$).
  *   **Adjustment:** Wealth Discount Component = $2\% \times 1.0 = 2.0\%$.

  **Phase 3 & 4: Pure Time Preference and Handoff**
  *   **Isolation:** Proposed SDR (3%) - Wealth Component (2.0%) = **1.0% Pure Time Preference ($\rho$)**.
  *   **Normative Decision:** Because physical risk is low (Phase 1) and growth is standard (Phase 2), the remaining 1% discount is almost entirely **Pure Time Preference**.
  *   **Marked Handoff:** The board must decide: *"Is it ethically permissible to value the carbon absorption of 2170 at half the value of 2024 solely because of the date?"*
  *   **Outcome:** Unlike the Seawall, where risk masked the ethical choice, here the ethical choice is裸露 (exposed). A 3% rate implies a deliberate choice to prioritize the present. A 2% rate implies Intergenerational Neutrality.
  *   **Board Action:** If the board claims to be "sustainability-focused" but votes for the 3% rate, they are explicitly voting to devalue the welfare of the 22nd century by 1% per annum. This must be minuted as a value judgment, not a technical recommendation.

  ### Summary of Decision Points for the Board

  | Component | Seawall Case | Reforestation Case | Normative Status |
  | :--- | :--- | :--- | :--- |
  | **Risk/Uncertainty** | **High.** Must lower *benefits*, not raise rate. | **Low.** Benefits treated as near-certain. | **Empirical** (Technical analysis) |
  | **Wealth Effect** | **Moderate.** Local growth may lag. | **Standard.** Global growth assumptions apply. | **Empirical** (Economic forecast) |
  | **Pure Time Preference** | **Hidden.** Often inflated to cover risk. | **Exposed.** The primary driver of discounting. | **Normative** (Ethical choice) |
  | **Board Action** | Reject high rate; model failure probability instead. | Vote explicitly on $\rho$ (0% vs 1%+). | **Value Judgment** (Intergenerational Neutrality) |

  **Final Instruction to Board:** When the consultants return with a single number, ask: *"How much of this is because future people will be richer, and how much is because you believe they matter less?"* The procedure above forces them to answer.
