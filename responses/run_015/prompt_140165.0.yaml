  ...He says: yes, but I only bought it because I was born with a disposition that loves risk, and I did not choose that.

  The clerk pauses, puts the stamp down, and leans forward. "Okay. If you're not responsible for the risk, you're not responsible for the loss. But by that same logic, I'm not responsible for approving the claim—I was born with a disposition for bureaucracy. So you can't blame me for saying no." He slides the form back. "We're both just victims of our genetics here. Next."

  **Joke 2: The Sommelier's Claim**

  A man turns up demanding compensation for his habit of drinking only pre-phylloxera claret. "I know I trained myself to like it," he says, "but I only did that because I was born with a disposition for refinement."

  The clerk nods, stamps the form 'NATURAL ASSET', and hands him a tax bill. "Fine. If the disposition is unchosen, it's a natural resource. And natural resources are collectively owned. So we're leasing your palate back to you. The rent is due on Friday."
