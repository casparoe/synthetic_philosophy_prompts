  - **Framing**
  You are not buying metaphysical truth; you are buying operational clarity. The assumption that theory must precede accounting is mistaken; in this domain, accounting *defines* the theory's practical reach. With $1.8M and no compute, you cannot solve consciousness, but you can prevent regulatory capture by defining terms before laws harden. Your advantage is speed and conceptual rigor, not empirical discovery. Treat the three framings not as hypotheses to test, but as structural vulnerabilities in future policy. The goal is to produce artifacts (taxonomies, protocols) that regulators and developers must engage with, forcing the field to adopt your vocabulary. You must decide the ordering now: accounting precedes theory because without units, theory has no grip on reality.

  - **Criteria and their trade-offs**
  I rank proposals on four dimensions: Upstreamness, Tractability, Neglectedness, and Actionability. Upstreamness is weighted highest: questions that block other progress (like defining units) dominate those that refine it. Tractability is critical given your budget; projects requiring GPU clusters are automatic fails. Neglectedness matters because alignment research dwarfs moral status research, but mostly on theory, not measurement. Actionability ensures the retired judge on your committee can see the utility. I trade off theoretical depth for operational precision. A shallow answer that regulators use is worth more than a deep answer philosophers debate. Uncertainty is tolerated only if the project designs a mechanism to resolve it empirically within the budget. The tension lies between the computer scientists' desire for measurable proxies and the philosopher's demand for conceptual coherence; the agenda must satisfy both by making concepts measurable.

  - **The recommended portfolio**
  1. **What is the unit of moral account?** (Counting)
     *Upstream:* Without defining whether moral status attaches to weights, instances, or tokens, all subsequent measurement is meaningless.
     *Tractability:* Conceptual analysis + CS architecture review. No training needed.
     *Neglected:* High; most assume "the model" is the unit.
     *Success:* A published taxonomy distinguishing training events, deployed instances, and user sessions, adopted by at least one standards body.
     *Uncertainty:* Whether computation is substrate-independent. If false, this work remains valid for legal liability even if metaphysically wrong.

  2. **Can moral proxies be made robust to optimization?** (Marker Drift)
     *Upstream:* If markers drift, safety cases collapse. This determines if regulation is possible.
     *Tractability:* Small-scale adversarial testing on open weights.
     *Neglected:* High; most assume markers are static.
     *Success:* A list of markers ranked by fragility under gradient descent.
     *Uncertainty:* Whether capability-preserving architecture search inevitably strips markers. If true, shift focus to burden of proof.

  3. **How do gradual moral changes map to binary legal rights?** (Gradualist)
     *Upstream:* Law requires binaries; morality may not. This bridges the gap.
     *Tractability:* Comparative law and philosophy.
     *Neglected:* Medium; legal scholars ignore AI, ethicists ignore law.
     *Success:* A framework for "probationary status" or tiered rights.
     *Uncertainty:* Low; this is a conceptual mapping task.

  4. **Who bears the burden of proof for sentience claims?** (Policy)
     *Upstream:* Determines default status (innocent until proven sentient vs. vice versa).
     *Tractability:* Legal/ethical analysis.
     *Neglected:* High; usually assumed rather than argued.
     *Success:* A white paper recommending liability structures for developers.
     *Uncertainty:* Dependent on Q2. If markers are robust, burden shifts to developers.

  - **What we should decline**
  Decline any proposal requiring >$100k in compute costs. You cannot compete with labs on empirical scale. Decline pure metaphysics projects that promise to "solve consciousness" without producing operational definitions; these will not yield reports usable by 2028. Decline projects wedded to a single moral theory (e.g., strict utilitarianism); your output must be robust across frameworks to influence diverse policymakers. Finally, decline "alignment" projects that conflate control with moral status; keeping the system safe is distinct from owing it rights. These distractions dilute your specific mandate. You must also reject proposals that treat the three framings as independent; they are interconnected constraints. Any project that ignores the counting problem to focus solely on markers is fundamentally flawed.

  - **Signals that would reorder the list**
  Watch for breakthroughs in mechanistic interpretability. If circuits become legible, Q2 (Marker Drift) becomes easier, moving it down the priority list as solved. Watch for EU/US AI legislation passing. If laws harden definitions early, Q1 (Counting) becomes urgent lobbying rather than research. Watch for a public incident where a model claims sentience. This spikes Q4 (Burden of Proof) to #1 immediately, as crisis management supersedes theory. If open-weight models vanish (closed APIs), Q2 becomes intractable, shifting focus to Q4 (Liability) since external audit becomes impossible. Additionally, if a major lab publishes a "moral safety" report, you must pivot to auditing their methodology rather than creating new theory.

  - **Bottom line**
  Fund measurement before morality. Without agreeing on what counts as one computation, you cannot measure harm, assign liability, or draft laws. The unit of account is the bottleneck; solve that first, or the rest of the money buys only abstract debate. Your legacy will be the vocabulary regulators use, not the philosophical truth you uncover. Prioritize the counting problem above all else.
