answer: |-
  **Recommendation to TA:** 
  **Mark: 17/25 (High 2:1)**  
  **Band:** Upper Second Class.  
  **Rationale:** Your instinct is correct: this script is fluent and structurally sound, which masks significant technical errors in parts (b) and (c). It secures a 2:1 because it correctly identifies the *verdicts* of the view (e.g., in the scatter case) and defines lexical priority well in (a). However, it cannot be a First because it conflates commensurability with cardinality (contradicting the prompt's definition of KTNU) and makes an unjustified leap regarding interpersonal comparisons. It reads like a student who has memorised the "vibes" of suffering-focused ethics but hasn't fully grasped the formal machinery required to defend them.

  ***

  **Feedback for Student:**

  **General:** This is a confident, well-structured answer that demonstrates a strong intuitive grasp of lexical priority. You correctly identify the implications of the threshold in the "scatter" case and flag the vagueness of T. However, there are technical confusions in parts (b) and (c) regarding measurement and comparison that prevent this from reaching the highest band. You often assert conclusions about the *requirements* of the view without showing the work of *why* the view entails them.

  **Part (a): Lexical Dominance**  
  *   **Right:** *"Lexical dominance just means: two tiers, and no trade between them."* This is a precise definition. You also correctly distinguish this from a "large finite weighting" (*"with a huge-but-finite weight the pile eventually wins"*).
  *   **Right:** Your application to the hour at T vs. million headaches is correct, as is the nuance that lexical priority doesn't dictate preventing T *"come what may"* if doing so causes more T-suffering elsewhere.
  *   **To improve:** You might have explicitly noted that lexical views still require a *maximising* principle within the top tier (i.e., if both options contain T-suffering, we minimise the amount of it), though your final sentence gestures at this.

  **Part (b): Commensurability vs. Cardinality**  
  *   **Wrong:** *"KTNU does not require a common cardinal scale... and so escapes the familiar worry that suffering-focused views need implausibly precise cardinal measurement."* This contradicts the definition of KTNU given in the prompt. Clause (ii) posits a *"fixed, Archimedean exchange rate"* below T. An exchange rate *is* a cardinal measure. To apply clause (ii), you must be able to measure units of pain and pleasure cardinally to calculate the rate. You have conflated *commensurability* (can they be traded?) with *cardinality* (can they be measured precisely?).
  *   **Under-argued:** *"If pleasure and pain were commensurable there would have to be determinate exchange rates... and no one has ever produced one."* This is an epistemic claim (we don't know the rate) used to support a metaphysical claim (there is no rate). A first-class answer would distinguish whether the lack of a known rate proves incommensurability, or merely ignorance.
  *   **Right:** You are correct that KTNU treats pain and pleasure as incommensurable *above* the threshold.

  **Part (c): The Scatter Case & Interpersonal Comparisons**  
  *   **Right:** The verdict on the scatter case is correct: on KTNU, one person at T is worse than a million at 0.9T.
  *   **Wrong:** *"KTNU... does not need interpersonal comparisons of suffering at all: the only comparison that ever does any work is between the tiers within a given sufferer's experience."* This does not follow. To choose between Outcome A (Person X at T) and Outcome B (1M People at 0.9T), you must verify that Person X's suffering is indeed intensity T and the others' is 0.9T. This requires comparing intensities *across* persons. Lexical priority structures the *value* function, but it does not remove the epistemic need for interpersonal comparisons to apply that function.
  *   **Debatable:** *"Clause (ii) is very nearly idle in practice. In almost any real decision there is somebody, somewhere, above T."* This is empirically contentious. In many policy decisions (e.g., traffic regulation, tax policy), it is unlikely any single individual suffers at intensity T (defined as "unacceptable at any price"). If T is high, clause (ii) will do *most* of the work, not clause (i). Dismissing (ii) as idle risks turning KTNU into simple Lexical NU, missing the point of the "kink."
  *   **Good:** Flagging the vagueness of T (*"sorites problem"*) is an excellent critical observation that shows independent engagement.

  **Summary:** You have a strong handle on the *implications* of the view but need to be more rigorous about its *preconditions* (measurement and comparison). Be careful not to assume that a lexical structure solves epistemic problems about comparison.

  ***

  **Note on the Question (for TA eyes only):**  
  The question is well-posed. Part (b) specifically asks them to distinguish commensurability from cardinality, which acts as a trap for students who conflate the two (as this student did). Part (c)'s question on interpersonal comparisons is standard in population ethics; the student's "No" answer is a common but defensible misconception that allows you to penalize the reasoning while rewarding the correct verdict on the scatter case. You don't need to adjust the question.
