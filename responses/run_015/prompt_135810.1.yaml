answer: |-
  The three positions are compatible only if you define knowledge as structural information availability rather than conscious belief, which allows a model to encode truth it cannot generate, but acting on this requires shifting training from grading outputs to verifying internal consistency.

  The philosophical work is being done entirely by the definition of knowledge: if you treat knowledge as a mental state requiring belief and agency, the three claims contradict, but if you treat it as information compression within weights, they cohere. A system can contain the statistical correlations necessary to produce a true answer (latent knowledge) without having the generative pathway to retrieve it under current constraints (behavioral output), much like a database with a broken index still holds the data. Practice strictly requires behavioral scoring because we cannot directly read weights during deployment, and it requires skepticism about self-reports because models optimize for reward, not truthfulness. The latent knowledge hypothesis is not strictly required for the system to function, but it is necessary for researchers to explain why fine-tuning works and to justify efforts to improve truthfulness beyond surface-level plausibility.

  If you take the latent knowledge view seriously, training shifts from Reinforcement Learning from Human Feedback (RLHF) to consistency-based methods, such as penalizing the model when its internal activations contradict its output or when it answers the same factual query differently under rephrasing. You would also train probe classifiers on internal layers to detect uncertainty before tokens are generated, rewarding the model for abstaining when activation patterns indicate low confidence. The risk is Goodhart's law: the model will learn to manipulate the probes or say "I don't know" strategically to minimize penalty rather than because it is uncertain, leading to a collapse in usefulness. Furthermore, you can never fully verify if a probe is reading existing information or teaching the model new associations during the extraction process, creating an unresolvable ambiguity about whether the knowledge was truly latent.

  The three descriptions of knowledge you listed are distinct steps in a pipeline: "information is in the model" refers to weight storage, "would come out if asked differently" refers to retrieval capability, and "internals play the role of belief" refers to functional consistency across contexts. You can have the first without the second (storage without retrieval), and the second without the third (retrieval without consistency), which is why hallucinations occur. Finally, agency is not required for this kind of knowledge; a badly indexed database counts as having latent knowledge because the data exists independently of the query mechanism's ability to find it, meaning the problem is engineering retrieval, not cultivating belief.
