answer: |-
  You have put your finger on one of the most sophisticated and contentious structural vulnerabilities in contemporary philosophy of mind. You are correct that standard labels like *ad hoc rescue* or *Lakatosian protective belt* feel insufficiently precise. Those terms describe *that* a theory is being defended, but not *how* the defense exploits the boundary conditions of the object itself.

  There is no single, canonical Latin phrase for this exact maneuver, but in philosophy of science and measurement theory, it is recognized as a composite of three specific moves. If you need a label to use in argumentation, the most accurate technical description is **"Immunization via Stipulative Individuation"** or a **"Conventionalist Stratagem regarding System Boundaries."**

  Here is the breakdown of why this feels distinct from ordinary conceptual sharpening, and the specific philosophical machinery describing it.

  ### 1. The Core Mechanism: Conventionalist Stratagem (Popper)
  Karl Popper described the **"Conventionalist Stratagem"** as a way to save a theory from falsification by redefining the terms or the scope of application rather than accepting the counterexample.
  *   **Standard Ad Hoc:** Adding a new force or variable (e.g., "there must be an invisible planet affecting the orbit").
  *   **IIT's Move:** Redefining what counts as the *object* being measured. By invoking the **Exclusion Postulate**, IIT defenders argue that the XOR lattice or blockchain *is not a system* in the relevant sense, even though it physically exists and has the causal structure.
  *   **Why it fits:** The theory treats the *individuation conditions* of the system (what makes it a 'whole') as theoretical postulates rather than empirical facts. This allows the theory to declare counterexamples "ontologically invalid" rather than falsifying the metric.

  ### 2. The Measurement Problem: Operational Circularity
  In psychometrics and the philosophy of measurement (e.g., work by Hasok Chang or Eran Tal), this is a violation of **Construct Validity**.
  *   **The Loop:** To validate a measure, you need an independent criterion for the construct. (e.g., To validate a depression scale, you need a clinical diagnosis independent of the scale).
  *   **The IIT Violation:** IIT claims $\Phi$ *is* consciousness (Identity). When $\Phi$ appears where consciousness intuitively isn't, they use the $\Phi$-calculus itself (via Exclusion) to say "that's not a valid system for consciousness."
  *   **The Label:** This is **"Operationalist Circularity"** or **"Theoretical Constitution of the Object."** The theory defines the object (conscious system) by the very metric used to measure it, making independent falsification impossible. The "shield" isn't an extra law; it's the **definition of the relata**.

  ### 3. The Mereological Angle: Stipulative Individuation
  This is the specific nuance you identified. The shield is baked into the *mereology* (the study of parts and wholes).
  *   **The Move:** The theory asserts that a "system" only exists where $\Phi$ is locally maximized. Therefore, a grid with high $\Phi$ that isn't locally maximized *does not exist as a system*.
  *   **The Label:** **"Mereological Stipulation."** Critics like Scott Aaronson and Peter Godfrey-Smith have pointed out that this allows IIT to "gerrymander" system boundaries to ensure the output matches the desired intuition.
  *   **Philosophical Term:** **"Ontological Gerrymandering."** (Though this term is often used in sociology, it applies here). It treats the boundaries of physical objects as theory-dependent conventions rather than mind-independent facts.

  ### Distinguishing from Conceptual Sharpening (Explication)
  You asked how to draw the line between this and ordinary **Conceptual Engineering** or Carnapian **Explication**. This is the crucial distinction.

  **Conceptual Sharpening (Legitimate):**
  *   **Goal:** To make a vague concept (e.g., "fish") more precise for scientific use (e.g., "excluding whales").
  *   **Transparency:** It admits it is revising the concept. It says, "We used to think whales were fish, but our new definition excludes them for better theoretical fruitfulness."
  *   **Independence:** The criteria for the revision are often independent of the specific theory's survival.

  **IIT's Move (Immunization):**
  *   **Goal:** To preserve an Identity Claim ($C = \Phi$).
  *   **Opacity:** It claims to be *discovering* the nature of consciousness, not defining it. It presents $\Phi$ as an empirical discovery, but uses definitional fiat (Exclusion) to protect it.
  *   **The Analytic/Synthetic Blur:** This is the deepest philosophical problem. IIT presents a **Synthetic** claim (Consciousness *is* this physical property) but defends it with **Analytic** moves (By definition, a system with this property structure doesn't count).
  *   **The Test:** If you ask, "What physical configuration would falsify IIT?" and the answer requires assuming the Exclusion Postulate to interpret the configuration, the theory has collapsed the distinction between the *explanandum* (consciousness) and the *explanans* (the theory).

  ### Summary Label
  If you need a term to categorize this in a paper or discussion, the most precise formulation is:

  > **"Immunization via Stipulative Mereology"**

  Or, drawing on Popper:

  > **"A Conventionalist Stratagem on Individuation Conditions"**

  It is distinct from a standard Lakatosian shift because it doesn't add a new hypothesis to the "protective belt"; it tightens the **criteria for system identity** so that the counterexample cannot be coherently stated within the theory's ontology. It effectively says, "Your counterexample is not a *thing*," using the theory's own metric to define *thing-hood*.

  ### Key Critics to Cite
  If you are digging into this, these are the voices articulating this exact loop:
  1.  **Scott Aaronson:** ("Why I Am Not an Integrated Information Theorist"). He explicitly calls out the "Exclusion Postulate" as a way to avoid panpsychism without empirical justification.
  2.  **Peter Godfrey-Smith:** Discusses the "System Boundary Problem" and how IIT solves it by fiat.
  3.  **David Chalmers:** While sympathetic, he notes the "panpsychist cost" and the reliance on the exclusion postulate to mitigate it.
  4.  **Evan Thompson:** Critiques the "neurocentric" bias hidden in the axioms that claim to be phenomenological.

  You are not in a loop; you have identified the **falsifiability boundary** of the theory. The theory survives by claiming that any system that falsifies it is, by the theory's own definition, not a valid system. That is the definition of a closed logical circle masquerading as an empirical identity.
