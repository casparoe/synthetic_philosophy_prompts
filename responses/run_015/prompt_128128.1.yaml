answer: |-
  Great question, and I am glad you asked this over coffee rather than in a thread, because the thread format is part of what encourages the sloppy sloganizing you are running into. You are right to sense that the person you encountered is holding two incompatible thoughts in their head at once, but that doesn't mean the slogan itself is useless. It just means it is doing different work depending on which philosophical engine is driving it. To give you the messy menu you asked for, we need to disentangle at least four or five distinct claims that get bundled under the label you cannot compare apples and oranges, and we need to be honest about which ones survive scrutiny and which ones are basically rhetorical shields.

  Let us start with the easiest distinction, which is between an epistemic claim and a metaphysical one. When your interlocutor says there is no common currency, they might simply mean that we lack the knowledge to construct a reliable exchange rate between saving a life from malaria and reducing existential risk from AI. This is an epistemic humility claim. It says there is a fact of the matter about which is better, or at least a rational preference ordering, but our access to it is too noisy to justify the precision of a number like 100 times more effective. This reading is trivial in the sense that everyone should agree we are uncertain, but it is substantive and defensible as a warning against false precision. However, it does not license refusing to put the careers on one scale entirely. It only licenses putting very wide error bars on the scale. If this were the only claim being made, it would not contradict the later comment that everything is a tradeoff. You can admit tradeoffs exist while admitting you are bad at calculating the exchange rate. The problem is that this reading rarely satisfies the people using the slogan, who often seem to imply that the calculation is impossible in principle, not just in practice.

  That pushes us toward the metaphysical readings, and here is where the technical vocabulary matters, even if the people using the slogan do not know the terms. There is a distinction between incommensurability and incomparability. Incommensurability strictly means there is no common unit of measurement. You cannot measure length in liters. In value theory, this means there is no single metric like utility utils that captures all value. This claim is widely accepted among value theorists. Most philosophers agree that value is pluralistic. Saving a life, creating art, and knowing the truth might be different kinds of good. However, incommensurability in this technical sense does not entail incomparability. You can compare things without a common unit. I can say I prefer this apple to that orange even if I cannot state the preference in terms of a third substance called fruitiness. So if the slogan means only that there is no single natural unit of value, it is defensible and probably true, but it does not support the conclusion that you cannot rank the careers. You can still have an all-things-considered judgment without a common currency. This is a point where the popular usage diverges from the technical one, and if you point this out, you often find the slogan collapses.

  The stronger claim is metaphysical incomparability. This says that for two options A and B, neither is better than the other, nor are they equally good. There is simply no value relation that holds between them. This is a much heavier lift. If this were true, it would license refusing to put them on one scale, because there is no scale that covers both. But this view faces a devastating objection known as the small improvement argument. Suppose you say AI safety work and malaria work are incomparable. Now imagine we improve the AI safety option slightly, perhaps by making it marginally more likely to succeed. Call this A-plus. A-plus is clearly better than A. If A was incomparable to B, is A-plus still incomparable to B? If you say yes, then you can keep improving A indefinitely without it ever becoming better than B, which seems irrational. It suggests you could refuse to take a massive upgrade for no reason. If you say no, and admit that at some point A-plus becomes better than B, then there must be a threshold where they become comparable, which undermines the claim that they are fundamentally incomparable. This argument is standard in the literature and is considered a strong reason to reject strict incomparability. Most professional value theorists think strict incomparability is false or at least extremely rare, confined to very specific cases. So if your interlocutor is relying on this, they are on weak ground philosophically, and this reading definitely does not survive the transitivity and money-pump style problems you mentioned. A rational agent who treats incomparable options as immune to small improvements is vulnerable to being pumped for money or dominated in their choices.

  There is a third metaphysical reading that tries to dodge the small improvement argument, which is the claim of lexical priority. This says that one value trumps the other regardless of magnitude, at least within some range. For example, one might claim that preventing human extinction is lexically prior to saving existing lives, so no number of malaria deaths outweighs a small reduction in existential risk. This is a comparison, just a non-linear one. It says the exchange rate is infinite, not undefined. This reading is substantive and defensible; people like Nozick or Ross have defended side-constraints or lexical orders. However, it directly contradicts your interlocutor's later comment that everything is a tradeoff. If there is lexical priority, there are no tradeoffs below the threshold. You cannot sacrifice the higher good for any amount of the lower good. So if they admit tradeoffs exist, they cannot be asserting lexical priority. Furthermore, lexical priorities often collapse under pressure. If you say extinction prevention is lexical, but you admit you would accept a tiny increase in extinction risk to save a billion lives from malaria, then the priority is not actually lexical. It is just a very steep exchange rate. When pressed, most people admit the exchange rate is finite, which brings us back to comparability. So this reading is self-undermining in the context you described.

  A fourth option, which is live and contested in current value theory, is the idea of a fourth value relation. Philosophers like Ruth Chang argue that besides better, worse, and equally good, there is a relation called on a par. Two items are on a par when they are comparable but neither is better than the other nor are they equal. They belong to the same neighborhood of value, but the choice between them is hard because the values are different in kind. This allows for rational choice without one option being objectively better. You choose by committing yourself to one set of reasons over the other. This view survives the small improvement argument because a small improvement to one option might not flip the relation from on a par to better than immediately; there is a zone of parity. This is not settled consensus. Many philosophers reject the fourth relation and try to reduce it to imprecise comparability. But if this view is correct, it licenses refusing to put the careers on a single precise scale while still allowing rational choice. It says the choice is not determined by the values alone; your will plays a role. However, this still does not support the claim that there is no fact of the matter about rational choice. It just says the fact of the matter includes your agency. So even here, the slogan you cannot compare is misleading. You can compare, but the comparison does not yield a unique maximum.

  Now, regarding your question about whether you can choose rationally without comparing at all. If by compare you mean calculating a single number, then yes, you can choose rationally without that. You can use lexicographic rules, or satisficing, or commitment-based reasoning. But if by compare you mean holding the options up against your values and determining which fits better, then no, you cannot choose rationally without comparing. Choice implies preference, and preference implies a comparative judgment, even if it is not quantitative. To choose A over B is to judge A preferable to B in this context. If you deny any comparative judgment, you are left with arbitrary selection, which is hard to square with rationality unless you adopt a voluntarist view where the will creates the reason. That is a niche position. So for most practical purposes, rational choice requires some form of comparison, even if it is not cardinal measurement.

  This brings us to your pet hypothesis, which I think is insightful but needs careful framing. You suggest that even if single pairs of options are incomparable, aggregation over a budget or a lifetime might generate marginal conversion rates that wash out the incomparability. This is not cheating, but it is a shift from foundational comparability to functional comparability. In economics, this is related to revealed preference. If you make a series of choices between AI safety and malaria funding, your behavior reveals an exchange rate, regardless of whether you believe one exists metaphysically. If you are consistent, you are acting as if they are comparable. The question is whether this consistency is required by rationality. If you accept the small improvement argument, then yes, rationality requires you to behave as if there is a comparability relation, otherwise you are vulnerable to pumps. So aggregation does not necessarily prove that the values were comparable all along, but it proves that you cannot act rationally over time without treating them as comparable. This rescues comparability for the purpose of practical reason, which is usually what we care about.

  Does it matter that the two careers are one person's whole life rather than a split between two strangers? Yes, it matters for the integrity objection. Bernard Williams argued that utilitarian calculation can alienate a person from their projects and commitments. If you treat your life as a budget to be optimized, you might violate the integrity of your personal commitments. However, in the context of cause prioritization, the question is usually about impersonal value. If the goal is to do the most good impartially, then the fact that it is one life should not matter morally, though it matters psychologically. The aggregation argument works better for a budget allocator than for a single life choice because a budget allocator makes marginal adjustments constantly. A person choosing a career makes a lumpier choice. But even in a life choice, you make small tradeoffs daily. Do I work an extra hour on safety or donate to malaria? If you make these marginal choices consistently, you establish a rate. So the incomparability might be real at the level of grand narratives but虚幻 at the level of marginal resource allocation. I suspect the incomparability intuition persists because people are thinking about the grand narratives. They feel that saving a life is a different kind of act than preventing a future catastrophe. But when reduced to dollars and hours, the differences often compress.

  I should flag where I am guessing versus where there is consensus. It is consensus among value theorists that strict incomparability is vulnerable to the small improvement argument. It is consensus that incommensurability no common unit does not entail incomparability. It is not consensus whether the fourth relation on a par exists; that is a live debate between people like Chang and those who prefer imprecise comparability models like Broome. It is also not consensus whether lexical priorities can be made coherent without collapsing into steep tradeoffs. My own view, which I am marking as contestable, is that the aggregation argument solves the practical problem even if it leaves the metaphysical one open. We can act as if there is a common currency because rationality demands consistency, and consistency implies a rate. Whether that rate reflects a deep moral truth or is just a requirement of coherent agency is less important for the person trying to decide where to work.

  So to return to your interlocutor, what was their slogan really doing? Given that they admitted tradeoffs later, they were likely not asserting metaphysical incomparability. They were probably asserting epistemic humility wrapped in metaphysical language to protect a value from being diminished. It is a rhetorical move to say you cannot compare because comparing feels like reducing the sacred to the profane. But philosophically, it does not hold up. If you accept tradeoffs, you accept comparability. If you accept comparability, you accept that numbers, however uncertain, are not fake precision but necessary approximations for rational action. The only way to save their position is to adopt the fourth relation view and say the choices are on a par, but even then, you must choose, and choosing implies a preference, which undermines the idea that there is nothing to rank. There is always something to rank, even if the rank is tied or parity-held. The refusal to rank is itself a ranking of the process over the outcome.

  In sum, the slogan is almost always a lie if taken literally, but it points to a real discomfort with quantification. The discomfort is valid epistemically and perhaps axiologically regarding the nature of value, but it does not license inaction or the refusal to prioritize. Your hypothesis about aggregation is the best way to bridge the gap. It shows that even if the values are distinct, the rational agent must construct a bridge to navigate between them, and that construction is what we mean by practical reason. So tell your friend that they can keep their apples and oranges, but if they want to eat, they have to decide which one to bite first, and that decision reveals which they value more in that moment, however much they protest otherwise.
