prompt: |-
  hey, looking for something practical here. I'm on the grants committee of a very small foundation that funds speculative high-upside stuff — about $1.2M a year, four trustees, no staff economist, and one two-hour meeting a month where we recieve something like forty proposals, so call it ten minutes each including the argument. Most of the inbox is junk, but last month we nearly funded something one trustee called "basically Pascal's mugging with a budget line": a guy wanted $5,000 to prevent 10^28 years of suffering inside a simulation he said he controlled. Instead of laughing we spent forty minutes arguing about why we were laughing, and not one of us could state the actual rule in a single sentence. A friend I was complaining to about this said the reason we flailed is that our objections came from three different places and we kept switching between them, which sounds right but doesn't help me write it down.

  So: I want a screening procedure we can run in ten minutes on a proposal. Roughly the shape I have in mind, but fix it if there's a better one — an ordered list of questions, what counts as a good enough answer to each one, the points where the procedure just stops with a NO (plus a one-line rationale I can paste into the minutes), and the points where it stops and hands the decision to a human because the question is one of values rather than facts. Constraints: no maths beyond what we can do on a phone, no writing back to applicants for more data (they never reply anyway), and it has to be defensible to a trustee who isn't a utilitarian and thinks expected-value reasoning is a cult. For each test, say in a clause which kind of answer to the mugging problem it's really implementing — the bounded-utility kind, the epistemic/process kind, the budget-relative kind, whatever — and say plainly which of those families you've decided against and why. Be honest about which steps are genuine checks and which are judgment calls in a lab coat.

  The cases that broke our discussion, and that the procedure has to actually handle:

  - The ordinary mugger: the payoff is astronomical and the person who picked the number is the person who benefits. My vague instinct is that the test should be something like — take the claim at size N, then ask what probability you'd give the *identical* claim with six more zeroes on the end, and if your number hasn't dropped by at least six orders of magnitude then you were never tracking the claim, you were tracking your mood. Also, a claim of size N seems to have vastly more ways of going wrong than ways of going right: the arithmetic, the model, plain dishonesty, self-deception, one soft step in a long chain of reasoning. I have no idea how to turn that into a line on a form; either make it one or tell me it can't be one.
  - The mirror: same person says give me $5,000 or I *cause* the 10^28 years of suffering. Whatever our rule is, it ought to give the same verdict to both, so tell me whether yours does and whether that symmetry is a feature or a trap.
  - The queue: even if one such proposal is fundable, we don't have infinite money, and if we say yes we should expect ten thousand more next month, all mutually compatible. Does the procedure say anything about the collective version, or is the collective version a different decision that we should stop and be humans about?
  - The black box: an applicant whose case is itself an expected-value calculation living in someone else's spreadsheet — "our model gives a 1-in-10^9 chance of saving 10^24 lives" — and who won't or can't decompose it. Is "we cannot audit this" itself a stopping rule, or does that just punish anyone with a private model?
  - The legitimate long shot that looks like a mugger on paper: a $60,000 pilot of an ultra-cheap water treatment in a district of roughly two million people, where the effect size comes from published dose-response data and not from the applicant, and where the pilot would tell us something either way. One trustee keeps insisting the real difference is that a grant buys information and a mugging doesn't. I think he's grabbed something true and can't let go of it; if it belongs in the procedure, put it in and say exactly where.

  Then run the finished thing on three proposals and show the work: (1) the simulation guy; (2) the $60,000 water pilot; (3) our own flagship program — $250,000 a year to a two-person group doing technical work on a speculative global threat, where our own in-house model says there's something like a 1-in-3,000 chance their work ends up pivotal for a catastrophe affecting ~10^10 future lives. Case 3 is the one I'm nervous about, because the numbers come from us rather than from a beneficiary but the shape is otherwise the same as case 1, and I'd much rather be told our procedure kills our own program than be handed a procedure that quietly exempts whatever we already happened to like. If it doesn't kill it, state the difference precisely enough that I could apply it to a stranger's proposal without playing favorites. And finish by telling me what the procedure is simply not for — which kinds of proposals it will systematically misclassify, and when we should stop consulting it and just argue.
reasoning: |-
  Here's a thinking process that leads to the suggested screening procedure:

  1.  **Analyze the Request:**
      *   **Context:** Small foundation ($1.2M/year, 4 trustees, no staff, 1 meeting/month).
      *   **Problem:** 40 proposals/month, ~10 mins each. Struggling with "Pascal's Mugging" type proposals (astronomical stakes, tiny probabilities, hard to verify).
      *   **Goal:** A 10-minute screening procedure (ordered list of questions, pass/fail criteria, stop rules).
      *   **Constraints:** No complex math (phone calc only), no contacting applicants, defensible to non-utilitarian trustees, must distinguish between "muggings" and "legitimate long shots."
      *   **Specific Cases to Handle:**
          1.  Ordinary Mugger (astronomical payoff, self-selected numbers).
          2.  The Mirror (threat vs. promise).
          3.  The Queue (scalability/floodgates).
          4.  The Black Box (unauditable models).
          5.  Legitimate Long Shot (water pilot, buys information).
          6.  Internal Flagship (similar EV shape to mugging but internal).
      *   **Requirements:** Annotate which philosophical objection each step addresses (bounded utility, epistemic, budget-relative, etc.), state which families of objections are rejected, distinguish checks vs. judgment calls, run the procedure on the 3 test cases, and state limitations.

  2.  **Deconstruct the Philosophical Landscape:**
      *   *Pascal's Mugging:* Tiny probability $\times$ Huge Utility > Moderate Probability $\times$ Moderate Utility.
      *   *Objection Families:*
          1.  **Epistemic/Process:** The probability estimate is unjustified/garbage. (The "Levers of Power" test).
          2.  **Bounded Utility:** Utility functions shouldn't be linear at extreme scales. (Hard to encode in a 10-min checklist without getting philosophical).
          3.  **Budget/Scalability:** If we fund this, we must fund all similar claims, which breaks the budget. (The "Queue" problem).
          4.  **Information Value:** Does this purchase *knowledge* or just *lottery tickets*? (The Trustee's intuition).
          5.  **Symmetry:** Threat vs. Promise. (Extortion protection).

      *   *Decision:* I need to prioritize Epistemic/Process and Information Value. Bounded Utility is too abstract for a checklist. Budget/Scalability is crucial for a foundation. Symmetry is a safety check.

  3.  **Drafting the Procedure (Iterative Process):**

      *   *Attempt 1 (Mental):* Ask "Is the probability real?" -> Too vague. Ask "Can you prove it?" -> They can't.
      *   *Attempt 2 (Mental):* Ask "Is the EV > cost?" -> That's exactly the problem, the EV is huge.
      *   *Attempt 3 (Structured):* Need a "Kill Switch" early.
      *   *Step 1: The Levers of Power (Epistemic).* Does the money *change* the outcome? If I don't pay, does the suffering happen? If I do, does it stop? For the mugger, the link is magical. For the water pilot, the link is physical.
      *   *Step 2: The Audit Trail (Black Box).* Can we see the math? If it's a spreadsheet we can't open, it's a no.
      *   *Step 3: The Scalability Test (Queue).* If 100 people asked for this, could we pay? If yes, we can't pay one.
      *   *Step 4: The Information Value (Legitimate Long Shot).* Do we learn something even if it fails?
      *   *Step 5: The Symmetry Check (Mirror).* Would we pay them to *stop* a threat? If yes, are we open to extortion?

      *   *Refining for the "10-minute" constraint:* Needs to be sharper.
      *   *Refining for the "Internal Flagship" constraint:* The procedure must not kill the internal program if it's legitimate, but must be rigorous enough that it *could* kill it if it were a mugger. The key difference is usually *external validation* or *mechanism transparency*.

      *   *Philosophical Alignment:*
          *   Reject *Pure Expected Value Maximization* (the "cult" the trustee hates).
          *   Adopt *Epistemic Humility* + *Budget Constraints* + *Information Value*.
          *   Address the "Six Zeroes" intuition: This is about *sensitivity to evidence*. If the claim scales by $10^6$ but the evidence stays the same, the probability should drop by $10^6$.

  4.  **Developing the "10-Minute Triage Protocol" (The Artifact):**

      *   *Name:* The "Leverage & Liability" Screen.
      *   *Structure:* 5 Gates. Fail any = No. Pass all = Human Decision.
      *   *Gate 1: Causal Mechanism (Epistemic).* Is the link between \$ and Outcome physical/verifiable vs. logical/magical?
      *   *Gate 2: Probability Sensitivity (Epistemic/Bounded).* If the stakes double, does the required evidence double? (Operationalized: The "Zeroes Test").
      *   *Gate 3: Extortion Symmetry (Liability).* Does this work as a threat?
      *   *Gate 4: Scalability (Budget).* The "Floodgate" test.
      *   *Gate 5: Information Residual (Value).* If it fails, do we know more?

      *   *Wait, I need to address the "Internal Flagship" issue.* The internal program has a model (1 in 3000). The Mugger has a model (1 in 10^X). The difference is *provenance* and *mechanism*. The internal program is likely doing *work* (research), not just *paying a ransom*.
      *   *Adjustment:* Gate 1 needs to distinguish "Paying for an Action" vs "Paying for a State of Affairs."
      *   *Adjustment:* Gate 2 needs to be the "Six Zeroes" test explicitly.
      *   *Adjustment:* Gate 5 is the Trustee's "Information" point.

  5.  **Addressing Specific Constraints & Cases:**

      *   *The Mugger:* Fails Gate 1 (Mechanism), Gate 2 (Sensitivity), Gate 3 (Extortion).
      *   *The Mirror:* Fails Gate 3 (Extortion).
      *   *The Queue:* Fails Gate 4 (Scalability).
      *   *The Black Box:* Fails Gate 1 (Auditability).
      *   *The Water Pilot:* Passes Gate 1 (Physical), Gate 5 (Info).
      *   *The Flagship:* This is the hard one. It passes Gate 1 (Work is done), Gate 2 (Model is internal/scrutinized), Gate 5 (Info gained). It *might* fail Gate 4 if scaled, but as a unique program, it passes.
      *   *Philosophical Families:*
          *   *Implementing:* Epistemic Process (Can we check it?), Budget Relative (Can we afford many?), Information Value (Do we learn?).
          *   *Rejecting:* Pure Bounded Utility (Too abstract for a form), Pure EV Maximization (The enemy).
          *   *Honesty:* Gate 2 is a judgment call in a lab coat. Gate 4 is a hard constraint.

  6.  **Writing the Procedure:**
      *   Keep it tight.
      *   Add the "Rationale for Minutes" line for each rejection.
      *   Add the "Philosophical Tag" for each step.
      *   Ensure the "Stop/Go" logic is clear.

  7.  **Running the Test Cases:**
      *   *Simulation Guy:* Fails early.
      *   *Water Pilot:* Passes to human decision (likely Yes).
      *   *Flagship:* Passes to human decision (likely Yes), but highlight *why* it didn't fail like the Mugger (Mechanism + Info).

  8.  **Final Review against Constraints:**
      *   10 minutes? Yes, 5 binary questions.
      *   No math? Yes, qualitative mostly, one order-of-magnitude check.
      *   Defensible to non-utilitarian? Yes, focuses on process and budget, not just "greatest good."
      *   Honest about judgment calls? Yes, will label them.
      *   Limitations section? Required.

  9.  **Refining the "Six Zeroes" Test:**
      *   How to make this a checklist item? "If the claimed impact increased by 1,000,000x, would the evidence required increase by 1,000,000x?" If the applicant says "No, the logic holds," that's a fail. It tests *elasticity of belief*.

  10. **Refining the "Mirror" Test:**
      *   "If this applicant returned tomorrow demanding the same sum to *prevent* the harm they claim they can *cause*, would we pay?" If Yes -> Extortion risk -> No.

  11. **Refining the "Flagship" Distinction:**
      *   The Flagship is funding *labor* to *reduce risk*, not funding a *ransom* to a *simulator*. The mechanism is "Research -> Policy/Tech -> Safety." The Mugger is "Money -> Magic -> Safety." The checklist must catch "Magic."

  12. **Final Polish:** Tone should be professional, slightly weary (matching the user), and precise. (Self-Correction: Make sure the "Rationale for Minutes" is copy-pasteable as requested).

  13. **Structure of Output:**
      *   Preamble (Philosophical Stance).
      *   The Protocol (The 5 Gates).
      *   The Test Runs (3 Cases).
      *   Limitations (What this doesn't do).

  *(Self-Correction during drafting)*: I need to make sure I don't accidentally ban the Flagship. The Flagship has a 1/3000 chance. The Mugger has a 1/10^X chance. The difference isn't just the number, it's the *derivation*. The Flagship's number comes from a model the trustees can inspect (in-house). The Mugger's comes from assertion. I need a gate about "Auditability of the Probability."

  *Revised Gate 2:* "Probability Provenance." Can we trace the number to data or is it a parameter?
  *Revised Gate 1:* "Causal Mechanism." Is the link physical or logical?

  Let's stick to the user's "Six Zeroes" intuition. It's stronger. I'll make that Gate 2.
  Let's make Gate 1 about "Mechanism vs. Assertion."
  Let's make Gate 3 about "Extortion."
  Let's make Gate 4 about "Scalability."
  Let's make Gate 5 about "Information Value."

  Okay, ready to write.
answer: |-
  Here is a screening procedure designed for your constraints. It is not a formula for finding truth; it is a filter for filtering out noise that looks like truth. It prioritizes **process integrity** and **budget solvency** over **expected value maximization**.

  ### The Philosophical Stance
  *   **Implemented:**
      *   **Epistemic/Process:** We fund claims we can audit, not claims we must take on faith.
      *   **Budget-Relative:** We fund what fits the portfolio, not what fits the math.
      *   **Information Value:** We fund experiments, not lottery tickets.
  *   **Rejected:**
      *   **Pure Bounded Utility:** We are not defining a utility function today. We are defining a workflow.
      *   **Pure EV Maximization:** Explicitly rejected as a "cult" metric for this screen.
  *   **Honesty:** Steps 1 and 2 are genuine checks. Steps 3, 4, and 5 are judgment calls in a lab coat—they require trustee intuition, but they force that intuition into a specific shape.

  ---

  ### The 10-Minute "Leverage & Liability" Screen

  **Instructions:** Read the proposal summary. Answer the five gates in order. If any gate returns **NO**, stop immediately. Record the "Rationale for Minutes." If all five return **YES**, the proposal proceeds to the Human Decision phase (discussion/vote).

  #### Gate 1: The Mechanism Test (Epistemic/Process)
  **Question:** Is the link between the *spending of funds* and the *claimed outcome* physical/verifiable (e.g., buying filters, hiring researchers) or logical/assertive (e.g., preventing a simulation, averting a metaphysical threat)?
  *   **PASS:** Money buys specific actions/objects with known causal properties.
  *   **FAIL:** Money buys a "state of affairs" or relies on the applicant's unique authority to toggle a outcome.
  *   **Rationale for Minutes:** "Proposal relies on unverifiable causal mechanisms; funds purchase assertion rather than action."
  *   **Philosophical Implementation:** This kills the **Ordinary Mugger**. It distinguishes *doing work* from *paying a ransom*.

  #### Gate 2: The Sensitivity Test (Epistemic/Bounded)
  **Question:** Apply the "Six Zeroes" rule: If the applicant claimed the impact was 1,000,000 times larger (or smaller), would the evidence required to prove it increase (or decrease) proportionally?
  *   **PASS:** Yes. The applicant admits that bigger claims need bigger proof, and their current proof matches the current claim.
  *   **FAIL:** No. The logic holds regardless of scale, or the evidence provided is static while the claim is astronomical.
  *   **Rationale for Minutes:** "Claimed impact is insensitive to evidentiary burden; probability estimate does not scale with magnitude."
  *   **Philosophical Implementation:** This implements your **Six Zeroes intuition**. It forces the probability to track the evidence. It is a judgment call, but a binary one.

  #### Gate 3: The Symmetry Test (Liability/Extortion)
  **Question:** If this applicant returned tomorrow demanding the same sum to *prevent* the harm they claim they can *cause* (or control), would we be logically compelled to pay?
  *   **PASS:** No. The proposal is strictly about creating good, not averting a threat controlled by the applicant.
  *   **FAIL:** Yes. The proposal structure works equally well as a threat.
  *   **Rationale for Minutes:** "Proposal structure creates extortion liability; logic is symmetric between promise and threat."
  *   **Philosophical Implementation:** This kills **The Mirror**. It prevents the foundation from being held hostage by its own altruism.

  #### Gate 4: The Floodgate Test (Budget-Relative)
  **Question:** If 100 qualified applicants submitted identical proposals next month, could we fund them all without bankrupting the foundation?
  *   **PASS:** Yes. (Rare for large grants, common for pilots). OR: No, but there is a hard, objective cap on how many such applicants can exist (e.g., "only one research group works on this specific isotope").
  *   **FAIL:** No, and there is no objective cap on the number of applicants (e.g., anyone can claim to control a simulation).
  *   **Rationale for Minutes:** "Proposal is not scalable; funding one creates an unfundable queue of identical claims."
  *   **Philosophical Implementation:** This kills **The Queue**. It acknowledges budget constraints override EV math.

  #### Gate 5: The Residual Value Test (Information Value)
  **Question:** If the project fails completely to achieve its primary goal, do we still learn something verifiable that helps future decisions?
  *   **PASS:** Yes. (e.g., We learn the water treatment doesn't work at this scale; we learn the research path is a dead end).
  *   **FAIL:** No. (e.g., We just lost the money and the simulation continues).
  *   **Rationale for Minutes:** "Project purchases only outcome, not information; failure yields zero learning."
  *   **Philosophical Implementation:** This saves **The Legitimate Long Shot**. It validates your trustee's intuition that buying information is different than buying a miracle.

  ---

  ### Test Runs

  #### Case 1: The Simulation Guy ($5,000 for 10^28 years)
  *   **Gate 1 (Mechanism):** **NO.** Money does not physically alter a simulation he claims to control. It purchases his "compliance."
  *   **Stop.**
  *   **Rationale:** "Proposal relies on unverifiable causal mechanisms; funds purchase assertion rather than action."
  *   **Comment:** Dies immediately. It fails the definition of a grant (funding action) and looks like a transaction (funding compliance).

  #### Case 2: The Water Pilot ($60,000 for 2M people)
  *   **Gate 1 (Mechanism):** **YES.** Money buys filters/chemicals and distribution. Causal chain is physical.
  *   **Gate 2 (Sensitivity):** **YES.** If they claimed 2 billion people, they'd need more data. The dose-response data scales.
  *   **Gate 3 (Symmetry):** **YES.** They cannot threaten to poison the water if you don't pay.
  *   **Gate 4 (Floodgate):** **YES/Maybe.** There are limited districts of 2M people. We couldn't fund *all* districts, but we can fund *some*, and the pool of applicants is naturally capped by geography.
  *   **Gate 5 (Residual):** **YES.** If the pilot fails, we know the treatment doesn't work in this context. Valuable negative data.
  *   **Result:** **Passes to Human Decision.** (Likely Fund).

  #### Case 3: The Internal Flagship ($250,000/yr, 1/3,000 chance, 10^10 lives)
  *   **Gate 1 (Mechanism):** **YES.** Money buys researcher salaries and technical work. They are *doing* something, not holding a state of affairs hostage.
  *   **Gate 2 (Sensitivity):** **YES.** This is the critical distinction from the Mugger. Our in-house model is not static. If they claimed 1/300 chance, we would demand different metrics. If they claimed 10^20 lives, we would demand a different model. The probability is *elastic* to the evidence, whereas the Mugger's probability is *magic*.
  *   **Gate 3 (Symmetry):** **YES.** The researchers cannot threaten to *cause* the catastrophe if we defund them. They are mitigating an external risk.
  *   **Gate 4 (Floodgate):** **PASS (with caveat).** We cannot fund 100 such groups. However, there is an objective cap: there are not 100 groups capable of doing this specific technical work. The scarcity is real, not artificial.
  *   **Gate 5 (Residual):** **YES.** Even if they don't solve the threat, their technical work publishes data that clarifies the risk landscape.
  *   **Result:** **Passes to Human Decision.** (Likely Fund).
  *   **Why it didn't die like the Mugger:** The Mugger sells a *result* (no suffering) based on *authority*. The Flagship sells *work* (research) based on *method*. The Mugger's probability is a parameter; the Flagship's probability is an output of a model we can inspect.

  ---

  ### Limitations: What This Procedure Is Not For

  1.  **It will not solve "Low-Probability, High-Value" debates among trustees.** If two proposals pass all five gates (e.g., two different water pilots, or two different research groups), this screen offers no help on which to choose. It only filters out the pathological cases.
  2.  **It systematically misclassifies "Visionary Lunatics who happen to be right."** If someone actually *did* control a simulation and asked for money, this screen rejects them. You must accept this. You are optimizing for *not being scammed*, not for *catching every miracle*.
  3.  **It cannot audit a "Black Box" that looks like a "White Box."** If an applicant presents a spreadsheet that *looks* auditable but is actually gibberish, Gate 1 might pass it. This screen assumes basic competence in reading the proposed mechanism.
  4.  **When to stop consulting it:** If a proposal passes all five gates but still feels wrong, **stop using the screen.** That is the moment for the "Human Decision." The screen is a shield against nonsense, not a substitute for judgment. If you are arguing about values (e.g., "Is saving 10^10 future lives more important than saving 2M current lives?"), the screen has done its job. Put it away and argue.

  ### Summary for your Trustee Friend
  The reason you flailed last month is that you were trying to solve an **epistemic** problem (is this true?) with a **mathematical** tool (expected value). The math breaks when the inputs are magical. This procedure forces the epistemic problem into the open: *Can we check the mechanism? Does the evidence scale? Do we learn if it fails?* If the answer is no, the math doesn't matter.
