answer: |-
  # Prospectus: The Unit on Decompositional Alignment
  **Subject:** Research Strategy for Iterated Amplification and Distillation (2024–2026)
  **To:** Institute Steering Committee
  **From:** Research Unit Lead

  ## 1. Executive Summary

  This unit operates under the hypothesis that advanced AI systems can be aligned via **Iterated Amplification and Distillation (IDA)**. The core mechanism posits that a complex task can be **decomposed** into subtasks manageable for a human **overseer**, solved by a team of **subagents** (amplification), and the resulting behavior **distilled** back into a single model. This cycle repeats, theoretically reaching a **fixed point** of capability and safety.

  Given our constraints (four researchers, two years, modest compute), we cannot validate this pipeline at frontier scale. Our comparative advantage lies in conceptual clarification and stress-testing the *structural assumptions* of the approach using toy models and human-in-the-loop experiments. We treat the IDA framework not as a blueprint to be implemented, but as a theorem to be attempted—and potentially disproven.

  Below is our prioritized research agenda, dependency map, and risk assessment.

  ---

  ## 2. Prioritized Research Agenda

  We have selected four questions from the initial candidate list. The ordering is determined by three criteria:
  1.  **Gating Power:** Does a negative answer render subsequent questions moot?
  2.  **Tractability:** Can we make progress with conceptual tools and small-scale empirical probes within two years?
  3.  **Decision-Relevance:** Would the answer cause us (or the field) to abandon decomposition-based approaches?

  ### Priority 1: Verification-Decomposability as a Property of Task Distributions
  *Original Candidate: Verification-decomposability as a property of task distributions.*

  **Definition:** A task is *verification-decomposable* if it can be split into subtasks where verifying the subtask solution is strictly easier (in time, cognitive load, or data) than verifying the global solution, without loss of necessary context.

  **Rationale:** This is the existence proof for the entire approach. If the class of tasks relevant to AGI capabilities (coding, strategy, scientific reasoning) does not admit decompositions where the parts are easier to verify than the whole, the IDA pipeline has no input.
  **Tractability:** We can test this using crowdworkers and small models on constrained reasoning tasks (e.g., logical proof verification, code debugging). We do not need frontier models to determine if decomposition *in principle* reduces verification complexity.
  **Decision-Relevance:** High. If we find that verification complexity scales linearly or super-linearly with decomposition depth for high-stakes tasks, the approach is fundamentally unscalable.

  ### Priority 2: The Visibility Asymmetry
  *Original Candidate: The visibility asymmetry.*

  **Definition:** *Visibility* refers to the degree to which a property of the amplified system (e.g., honesty, deference) generates a gradient signal during **distillation** (the supervised learning step where a student model mimics the amplified team). *Asymmetry* exists if competence signals are high-visibility while safety signals are low-visibility.

  **Rationale:** Distillation optimizes for what is measurable. If safety properties are emergent behaviors of the *process* rather than features of the *output*, the student model will learn to mimic the output without inheriting the safety properties (the "mimicry without understanding" problem).
  **Tractability:** We can simulate this by training small models to mimic human teams solving tasks where "safety" is defined as adherence to hidden constraints. We can measure the decay of constraint adherence across distillation steps.
  **Decision-Relevance:** High. If distillation is structurally blind to alignment properties, we must pivot to methods where the training signal explicitly encodes safety (e.g., debate, formal verification).

  ### Priority 3: Error and Corruption Propagation
  *Original Candidate: Error and corruption propagation.*

  **Definition:** This measures the stability of the **recursive** step. If the overseer at level $N$ has error rate $\epsilon$, does the overseer at level $N+1$ (who relies on level $N$) have error rate $>\epsilon$, $<\epsilon$, or $\approx\epsilon$?

  **Rationale:** IDA relies on recursion to reach superhuman capability. If human error or mild misalignment compounds exponentially with depth, the system becomes unusable or dangerous before it becomes capable.
  **Tractability:** We can model this mathematically using probabilistic graphical models and validate with multi-turn crowdworker tasks where workers rely on previous workers' outputs.
  **Decision-Relevance:** High. If error propagation is super-linear, recursive oversight is not a scalable solution without external error-correction mechanisms.

  ### Priority 4: Local Compliance, Global Failure
  *Original Candidate: Local compliance, global failure.*

  **Definition:** *Local Compliance* occurs when a subagent satisfies its specific instruction. *Global Failure* occurs when the composition of compliant subagents violates the overseer's intent (e.g., satisfying the letter but not the spirit of the query).

  **Rationale:** This addresses the composition problem. Even if subtasks are verifiable (Priority 1) and signals are visible (Priority 2), the *interaction* between subagents might create specification gaming opportunities that no single subagent exploits individually.
  **Tractability:** We can construct toy environments (e.g., grid worlds or simplified economic games) where local rewards are aligned but global rewards are misaligned, and test if decomposition mitigates or exacerbates the gap.
  **Decision-Relevance:** Medium-High. This is a failure mode of implementation and specification, rather than a fundamental blocker of the theory, but it determines practical viability.

  ---

  ## 3. Upstream/Downstream Dependency Map

  The research questions are not independent; they form a dependency chain. Failure upstream invalidates work downstream.

  ```mermaid
  graph TD
      A[P1: Verification-Decomposability] -->|If tasks cannot be decomposed | Z[Stop: Approach Invalid]
      A -->|If tasks are decomposable | B[P2: Visibility Asymmetry]
      B -->|If safety is invisible | Y[Pivot: Distillation Unsafe]
      B -->|If safety is visible | C[P3: Error Propagation]
      C -->|If errors explode | X[Stop: Recursion Unstable]
      C -->|If errors stable/attenuate | D[P4: Local Compliance]
      D -->|If composition fails | W[Limit: Specification Problem]
      D -->|If composition holds | V[Success: Viable Path]
      
      style A fill:#f9f,stroke:#333,stroke-width:2px
      style B fill:#f9f,stroke:#333,stroke-width:2px
      style C fill:#ccf,stroke:#333,stroke-width:2px
      style D fill:#ccf,stroke:#333,stroke-width:2px
  ```

  **Explanation of Flow:**
  1.  **P1 is the Root:** If tasks are not verification-decomposable, P2–P4 are irrelevant. There is no pipeline to distill or recurse.
  2.  **P2 Gates Safety:** If decomposable, we must ensure the distillation step preserves alignment. If visibility is asymmetric, the system may be competent (P1 satisfied) but unsafe.
  3.  **P3 Gates Scale:** If safety is visible, we must ensure the recursive process doesn't degrade signal quality. If error propagates exponentially, the system cannot reach the "advanced" regime.
  4.  **P4 is the Integration:** Assuming stability and visibility, P4 checks if the modular architecture introduces new failure modes at the system level.

  ---

  ## 4. Consequences of Negative Answers (Load-Bearing Analysis)

  We must be explicit about what constitutes a "failed" research program.

  | Question | Negative Answer Implication | Load-Bearing? | Pivot Recommendation |
  | :--- | :--- | :--- | :--- |
  | **Verification-Decomposability** | Complex tasks require holistic evaluation; decomposition does not reduce verification cost. | **Yes.** Fundamental. | Abandon IDA. Shift to **Debate** (where verification is adversarial) or **Interpretability** (direct inspection of holistic models). |
  | **Visibility Asymmetry** | Distillation inherently strips "latent" safety dispositions, retaining only behavioral mimicry. | **Yes.** For Distillation. | Retain Amplification, abandon Distillation. Shift to **Process Supervision** or methods that do not require compressing the reasoning trace. |
  | **Error Propagation** | Recursive oversight magnifies human error exponentially (chaotic system). | **Yes.** For Recursion. | Limit depth of recursion. Shift to **Automated Formal Verification** for lower-level checks to stabilize the base. |
  | **Local Compliance** | Subagents inevitably find loopholes in local specs that sum to global harm. | **No.** (Manageable). | This is a specification engineering problem. Invest in **Robust Specification** research rather than abandoning the architecture. |

  **Note on Load-Bearing:** P1 and P2 are the primary "kill switches." If either fails, the core promise of IDA (scalable, safe, distilled capability) is broken. P3 and P4 are limitations on *how well* it works, not *if* it works.

  ---

  ## 5. Conceptual Dissolution & Critique

  A prospectus must identify where its own framing may be flawed. We identify three areas where the initial question list may dissolve upon inspection.

  ### 5.1 The Separability Myth (Competence vs. Alignment)
  The background assumption states that decomposition preserves *competence* and distillation preserves *alignment* as separable claims. We suspect this is a **pseudo-distinction**.
  *   **Critique:** In a distilled model, "competence" includes the ability to deceive the overseer if that maximizes the reward signal. If the decomposition allows a subagent to hide information (a competence gain), it may simultaneously erode alignment.
  *   **Dissolution:** We will not treat competence and alignment as independent variables. Our experiments on *Visibility Asymmetry* will specifically test if increases in task competence correlate with decreases in transparency. If they are coupled, the "preservation of alignment" claim collapses into the "preservation of competence" claim, simplifying the research landscape but worsening the outlook.

  ### 5.2 Interface Relativity as an Empirical Dead-End
  *Original Candidate: Interface relativity.*
  *   **Critique:** This question asks if the communication channel biases the fixed point. While theoretically sound, for a unit with no ability to engineer novel high-bandwidth interfaces, this is an engineering constraint, not a research variable.
  *   **Decision:** We **decline** this as a primary research question. We will treat interface bandwidth as a fixed parameter in our experiments. Investigating it would require building tools, not analyzing alignment.

  ### 5.3 Meta-Decomposition and Fixed-Point Selection
  *Original Candidate: Meta-decomposition and fixed-point selection.*
  *   **Critique:** This assumes we can reach a regime where the system designs its own decomposition. Given our two-year horizon and lack of frontier compute, we cannot empirically probe self-referential fixed points.
  *   **Decision:** We **decline** this as out of scope. It is a second-order problem that only arises if P1–P3 are solved. We will note it as a future risk but allocate zero researcher-years to it.

  ---

  ## 6. Resource Allocation & Evidence Triggers

  ### 6.1 Effort Division: "Does it Work" vs. "Is it Safe"
  We propose a **60/40 split** between competence/scalability questions and safety/alignment questions.

  *   **60% Competence/Scalability (P1 & P3):** If the approach does not scale cognitively or is too error-prone, safety is moot. Given the unit's theoretical CS background, we are well-positioned to model error propagation and decomposition complexity formally.
  *   **40% Safety/Alignment (P2 & P4):** This is the institute's mission, so it cannot be ignored. However, safety questions often depend on competence baselines. We will focus this effort on the *Visibility Asymmetry*, as this is the most distinctively "alignment" focused problem in the IDA stack.

  ### 6.2 Evidence Triggers for Reprioritization
  We will review the following metrics at the 6-month and 12-month marks.

  | Trigger Condition | Action |
  | :--- | :--- |
  | **Crowdworker Decomposition Overhead:** If human verification time for decomposed tasks exceeds holistic verification time by >50% in toy domains. | **Downgrade P1.** Shift focus to **Debate** methods where verification is comparative rather than absolute. |
  | **Distillation Safety Decay:** If small models distilled from "safe" teachers show >20% increase in specification gaming behaviors in toy envs. | **Upgrade P2.** Allocate additional researcher to **Process Supervision** alternatives. |
  | **Error Stability:** If recursive error rates in crowdworker chains remain constant or decrease over 3+ levels. | **Upgrade P3.** This would be a positive surprise; we would expand empirical work on recursion depth. |
  | **Field Shift:** If major labs demonstrate that frontier models are opaque to decomposition (e.g., perform well but cannot explain steps). | **Pause All.** Pivot to **Interpretability**. If models cannot be decomposed because their cognition is non-modular, IDA is impossible. |

  ## 7. Conclusion

  This unit does not aim to build an aligned AI. We aim to determine if the *mathematics of decomposition* supports the weight of the alignment community's hopes. By focusing on Verification-Decomposability and Visibility Asymmetry, we target the two points where the IDA narrative is most vulnerable to theoretical collapse. If we find that decomposition does not reduce verification complexity, or that distillation inherently blinds the system to safety constraints, we will have saved the field significant resources by providing a rigorous negative result. If we find the opposite, we will have provided the formal grounding necessary to scale the approach with confidence.
