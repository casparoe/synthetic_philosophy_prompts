          1.  Verification-Decomposability (The "Can we do it?" question).
          2.  Visibility Asymmetry (The "Does it stay safe?" question).
          3.  Error and Corruption Propagation (The "Does it scale?" question).
          4.  Local Compliance, Global Failure (The "Composition" question).
          *Wait, I need to check the "dissolution" requirement.* I should explicitly argue that some questions might collapse.
