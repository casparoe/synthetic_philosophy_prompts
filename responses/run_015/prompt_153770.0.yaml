  "Which is scientifically correct?" the father asked.

  "It's architectural," the counselor replied, toggling a dropdown menu labeled *Normative Weighting*. "Protocol One runs on Procreative Beneficence, where child welfare is an overriding duty. Protocol Two runs on Liberal Eugenics, where parental autonomy is a side constraint."

  "So which setting do we choose?"

  "You already did," she said, highlighting a checkbox on their digital intake contract. "You signed the Autonomy License. It hardcodes parental values as a constraint on selection. To activate the Beneficence protocol, you'd be in breach of contract."

  The mother blinked. "So our moral dilemma is just a configuration error?"

  "Exactly," said the counselor. "You're trying to execute an overriding duty on a system designed for side constraints. No wonder you're throwing ethical exceptions."
