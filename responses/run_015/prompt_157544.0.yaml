      *   *Dunkirk:* The user calls it a "survival myth that hides defeat behind deliverance." This is accurate. It was a military disaster (abandoned equipment, retreat) spun as a miracle of salvation ("We shall fight on the beaches").
      *   *Martyrdom Claim:* The user argues Dunkirk lacks martyrdom. This is the weak point. Dunkirk *does* lack mass death *at the site* (most were evacuated), whereas Masada (mass suicide) and Kosovo (Prince Lazar's martyrdom) are defined by death. So the claim holds, *but* the conclusion ("less useful for nationalist mobilization") needs nuance. Dunkirk *was* used for mobilization (Blitz spirit), just differently (resilience vs. sacrificial vengeance).
      *   *Kosovo:* 1389 Battle. Prince Lazar chooses the "Heavenly Kingdom." Serbs lost to Ottomans. Became central to Serbian nationalism (19th century revival, 1989 Milosevic speech). The user describes it as a "hybrid" with "sacred covenant" and "territorial claims." This is historically accurate.

