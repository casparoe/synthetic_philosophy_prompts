      *   **Core Argument:** Masada and Confederate Lost Cause reframe defeat as moral purity. Dunkirk is a survival/deliverance myth (hides defeat). Kosovo is a hybrid (defeat $\rightarrow$ sacred covenant $\rightarrow$ territorial claims + martyrdom).
