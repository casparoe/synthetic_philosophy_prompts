      *   *Strategy C: Character-Agency Focused.* Map consent to the character's internal state vs. external pressure. Free action = valid consent. Motivated action (by external force) = invalid. Load-bearing lie covers deception.

  3.  **Selecting the Best Strategy:**
      *   Strategy A is too mechanical. Consent isn't just plot logic.
      *   Strategy B is strong on deception but weak on coercion (threats).
      *   Strategy C (Agency-focused) seems most faithful to both philosophy (autonomy) and fiction (character drive). However, a hybrid of A and B is probably needed to capture the nuance of "capacity."
      *   *Decision:* I'll combine Structural and Epistemic. I need to show how the *scene* constructs the validity, not just the character's mind. Let's refine:
          1.  *Mapping 1 (Mechanical):* Consent as plot permission. (Too dry).
          2.  *Mapping 2 (Psychological):* Consent as internal desire. (Ignores external coercion).
          3.  *Mapping 3 (Dramatic/Contextual):* Consent as a function of the scene's constraints and information. (Best fit).
      *   *Actually, looking at the prompt:* I need to brainstorm the *setup* of the mapping, then commit.
      *   *Idea 1:* Map philosophical categories directly to craft terms (Deception -> Lie, Threats -> Options).
      *   *Idea 2:* Map the *outcome* of the debate (Valid/Invalid) to the *reader's experience* (Trusted-Yes vs. Dramatic Irony).
      *   *Idea 3:* Map the *conditions* of consent to the *construction of the scene* (Capacity -> Free Action, Coercion -> Blocked Options).
      *   *Selection:* Idea 3 is the most robust for translation. It treats consent as a dramatic property of the scene, not just a moral label.

