      Your toolkit is missing something real, but the philosophy isn't muddled. Philosophy tracks rights and boundaries; fiction tracks truth and agency. A character can freely, truthfully consent to something that remains morally void (e.g., self-destruction or structural oppression). Your tools detect authenticity, not validity. The gap isn't a flaw in your craft, but a difference in aim. You are building a coherent world; your friend is policing boundaries.

