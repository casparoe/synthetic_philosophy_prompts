answer: |-
  **The Specter of the Glue: Dissolving Bradley's Regress and the Unity of the Proposition**

  F.H. Bradley's regress argument stands as one of the most enduring challenges in metaphysics. Originally formulated to attack the reality of relations, it strikes most deeply at the problem of the unity of the proposition. If a proposition is to be truth-apt, its constituents must form a unified whole rather than a mere list; similarly, for a relational fact to obtain, the relation must genuinely tie the relata together. Bradley argues that any attempt to explain this unity via relations generates an infinite regress that renders the initial fact unintelligible. The central question for contemporary metaphysics is whether this regress constitutes a genuine threat to the coherence of relational facts or whether it dissolves once we properly analyze ontological dependence. While the distinction between vicious and benign regresses provides a useful diagnostic tool, it is ultimately insufficient on its own. The regress is not a genuine threat because it relies on a category mistake regarding instantiation. By adopting a primitivist account of relations and recognizing instantiation as a non-relational mode of composition, the demand for further unifiers is revealed as illegitimate, and Bradley's challenge dissolves.

  To understand the threat, one must grasp the mechanics of the regress as applied to propositional unity. Consider the proposition "Socrates is wise." This consists of a particular (Socrates) and a property (wisdom). For this to be a proposition capable of being true, these elements must be united. If we posit a relation of instantiation ($I$) to unite them, we are left with the complex $I(S, w)$. But what unites $I$ to $S$ and $w$? If another relation ($I'$) is required, we launch an infinite regress: $I'(I, S)$, $I''(I', I)$, and so on. Bradley contends that because the unity is perpetually deferred, it is never achieved. The constituents remain a "heap" rather than a "whole." If this reasoning holds, relational facts are incoherent, and by extension, propositions lack the unity required for truth conditions. Realism about objective facts would collapse into monism or linguistic conventionalism.

  The first line of defense often invokes the distinction between vicious and benign regresses. A regress is benign if the initial step is ontologically secure and the subsequent infinite series is merely a surplus of entities that does not undermine the initial truth. For example, if every truth requires a truthmaker, and truthmakers require truthmakers, one might argue this is acceptable provided the first level does the work. However, in the context of Bradley's regress, this distinction is difficult to apply favorably to the realist. The regress appears vicious because the initial condition—the unity of the fact—is precisely what is in question. If $I$ cannot unite $S$ and $w$ without help, then the first step fails, and the infinite series represents an infinite deferral of explanation, not an infinite expansion of being. Therefore, simply labeling the regress "benign" is unpersuasive unless one can explain *how* the first relation succeeds without the second. The distinction highlights the problem but does not solve it; it merely asks us to locate the failure.

  To locate the failure, we must weigh the specific metaphysical responses designed to stop the regress. The first is the theory of internal relations. This view suggests that relations are grounded in the intrinsic natures of the relata. If Socrates is essentially such that he instantiates wisdom, no external "glue" is needed. While this halts the regress by making the connection necessary, it comes at a prohibitive cost. It undermines the contingency of facts. If relations are internal, Socrates could not exist without being wise, and the proposition "Socrates is wise" becomes a necessary truth about his essence. This contradicts the robust intuition that facts are contingent and that objects can exist without specific properties. Consequently, while the internal-relation reply avoids the regress, it does so by sacrificing the very phenomenon it seeks to explain: the contingent unity of distinct entities.

  A more sophisticated approach is the adverbial or recombinationist account. Proponents of this view argue that instantiation is not a relation *between* objects but a mode of being. On this view, we do not have $S$, $w$, and $I$; rather, we have $S$ existing "wisely." By treating instantiation as an adverbial modification of the particular, the theory avoids positing a relational constituent that itself needs tying. This effectively blocks the regress by changing the category of the unifier. However, this account faces challenges in explaining polyadic relations (e.g., "Romeo loves Juliet"). It is difficult to parse "Romeo loves-Julietly" without implicitly reintroducing a relational structure. While adverbialism successfully diagnoses the category mistake, it struggles to provide a general syntax for complex facts without smuggling relations back in.

  The most robust solution, and the one that justifies the conclusion that Bradley's threat is illusory, is relational primitivism. This view asserts that relations are fundamental ontological categories that do not require further explanation to function. When $a$ stands in relation $R$ to $b$, there is no further entity "instantiation" required to bind them. The fact $aRb$ is a sui generis unity. The regress arises only if one assumes that the relation $R$ is just another object in the list, requiring a further relation to connect it to the relata. But a relation is not an object; it is essentially predicative or "unsaturated," to use Fregean terminology. It has a nature that is inherently unifying.

  The primitivist argues that Bradley's regress commits a reification error. It treats the "unity" of the fact as if it were a constituent *within* the fact, rather than the *form* of the fact. To ask "what unites the relation to the relata?" is to treat instantiation as a relation. But instantiation is the condition for there being facts at all; it cannot itself be a component within a fact without circularity. If we accept that relations are primitive powers of combination, the regress never begins. The demand for a "unifier of the unifier" is not a deep metaphysical insight but a grammatical confusion. We do not need a relation to relate a relation to its terms, just as we do not need a light to illuminate the sun. The relation *is* the relating.

  Critics might argue that primitivism is an admission of defeat—a "brute fact" stopgap. However, this objection misunderstands the nature of foundational metaphysics. Every explanatory chain must end somewhere. If we deny primitivism, we must either accept the vicious regress (and deny facts) or accept internal relations (and deny contingency). Primitivism is the only option that preserves both the reality of relations and the contingency of the world. The charge of arbitrariness fails because the stoppage is not ad hoc; it is motivated by the recognition that the regress stems from a category mistake. Once we recognize that relations are not inert objects waiting to be glued, the motivation for the regress evaporates.

  Therefore, Bradley's regress is not a genuine threat to the coherence of relational facts. The distinction between vicious and benign regresses is helpful in diagnosing why the infinite series is problematic if it were to occur, but it is the primitivist account that prevents the series from arising in the first place. The regress relies on the false premise that unity requires a further entity to achieve it. By understanding relations as inherently unifying and instantiation as a non-relational mode of composition, we see that the unity of the proposition is not something to be achieved by further machinery, but the fundamental precondition of factual reality. Bradley's argument, while a powerful logical check, ultimately dissolves under the weight of its own category error. The realist is justified in maintaining that the world is composed of unified relational facts, and that the "glue" Bradley sought is nothing other than the relational nature of reality itself.
