  # Seminar Handout: A Taxonomy of the Deontological Paradox

  **Note:** This decision tree is designed to map the logical space of responses to the paradox of deontology without relying on standard trolley-case intuitions. Answer the questions in order.

  ### The Decision Tree

  **1. Is the rule violated as a direct means to save others, or only as a foreseen side-effect?**
  *   **Side-effect:** → Go to *Leaf A* (Paradox Dissolver).
      *(Rationale: If the violation is merely incidental, the dissolver argues the strict constraint does not engage in the same way.)*
  *   **Direct Means:** → Go to Question 2.

  **2. Is breaking the constraint ever the right thing to do?**
  *   **No (Never):** → Go to *Leaf B* (Hard Absolutism).
  *   **Yes (Sometimes):** → Go to Question 3.

  **3. Is the harm you're trying to prevent one catastrophic event or an aggregated pile of smaller harms?**
  *   **Aggregated (Numbers):** → Go to *Leaf C* (Threshold Deontology).
  *   **Catastrophic (Qualitative):** → Go to Question 4.

  **4. Does breaking the constraint leave moral residue (guilt, agent-regret) even when it was clearly the right thing to do?**
  *   **No (Clean hands):** → Go to *Leaf D* (Lexical-Rights View).
  *   **Yes (Dirty hands):** → Go to *Leaf E* (Unnamed Hybrid).

  ---

  ### The Leaves

  **Leaf A: The Paradox Dissolver**
  *   **Commitment:** Must convince us our intense feeling of moral conflict is merely a philosophical illusion caused by misdescribing the context.

  **Leaf B: Hard Absolutism**
  *   **Commitment:** Must allow the world to burn rather than dirty one's hands, even if the cost is everyone else's life.

  **Leaf C: Threshold Deontology**
  *   **Commitment:** Must defend the magic number where murder becomes permissible without explaining why one life less makes it wrong.

  **Leaf D: Lexical-Rights Side-Constraint**
  *   **Commitment:** Must explain how a right can be absolute yet somehow vanish when things get bad enough.

  **Leaf E: Unnamed Hybrid**
  *   **Commitment:** Must justify why you did the right thing yet still owe a moral debt or apology.

  ---

  ### Logical Space & Empty Branches

  **1. The Absolutism / Lexical Collapse**
  There is a strong suspicion that **Leaf B (Hard Absolutism)** and **Leaf D (Lexical-Rights)** are not actually seperate positions. If the 'catastrophe' required to override a lexical right is sufficiently extreme (e.g., total human extinction), the view functions identically to absolutism in all real-world cases. The distinction may be theoretical only.

  **2. Empty Branch: Side-Effect + Absolutism**
  Combining 'Side-effect' (Q1) with 'Never permissible' (Q2) creates an unattractive branch. While logically possible (a strict absolutist who forbids even foreseen side-effects), most deontologists find this incoherent because it collapses the distinction between doing and allowing entirely. It is largely unexplored in contemporary literature.

  **3. The Means/Side-Effect Distinction**
  Using the means/side-effect question (Q1) fails to seperate **Threshold** and **Lexical** views effectively, as both typically permit side-effects but diverge on means. This taxonomy forces them apart at Q1 for clarity, but note that the real action happens at Q3 and Q4.

  **4. Unexplored: Residue + Aggregation**
  There is no leaf for a view that accepts moral residue but allows breaking the constraint for *aggregated* harms (rather than catastrophe). This position—accepting guilt for saving many lives via means-violation—is logically possible but rarely defended, perhaps because it combines the awkwardness of the Hybrid with the arbitrariness of the Threshold. It remains an open space for neccessary future work.
