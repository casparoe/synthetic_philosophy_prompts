answer: |-
  Dear Friend,

  It is completely understandable why Goodman's new riddle of induction leaves you feeling unsettled, and indeed, your intuition that this poses a graver threat than Hume's original problem is shared by many who first encounter the paradox of grue. When I first grappled with Fact, Fiction, and Forecast, I felt much the same way, as if the ground beneath scientific reasoning had been pulled out entirely. However, I believe there is a crucial misunderstanding regarding Goodman's intent and the subsequent philosophical response that leads to the conclusion that induction is arbitrary or unjustifiable. Goodman did not set out to destroy induction in the way Hume questioned its metaphysical foundation; rather, he aimed to refine our understanding of what makes an inductive inference valid. While Hume asked why we should trust induction at all, Goodman asked which specific hypotheses we are entitled to project into the future. The distinction is subtle but vital, for Goodman assumes we do and must make inductions, and his project was to delineate the rules that separate successful predictions from failed ones.

  The core of your worry lies in the logical symmetry between green and grue. You are correct that relative to the evidence of past observations alone, the statement all emeralds are green and the statement all emeralds are grue are logically equivalent. If all we had was a list of observations and a formal logic system, there would be no way to distinguish them. But Goodman's insight was precisely that confirmation is not a purely logical relation between evidence and hypothesis. It is also dependent on the predicates we use to describe that evidence. The asymmetry between green and grue does not lie in the logic of the observations but in the linguistic history of the predicates themselves. Green is what Goodman calls an entrenched predicate. It is a term that has been used successfully in countless past projections. We have projected greenness onto emeralds, grass, and leaves for centuries, and those projections have held up. Grue, by contrast, is a gerrymandered predicate constructed specifically for the paradox. It has no history of successful projection independent of the very puzzle at hand.

  This appeal to entrenchment is what saves induction from arbitrariness. You suggested that because there are infinitely many gruesome predicates, our choice of projection is arbitrary. But we do not choose our predicates in a vacuum. We inherit a conceptual scheme that has been vetted by survival and utility. When we choose to project green rather than grue, we are not making a blind guess; we are relying on the inductive track record of the predicate itself. We are saying that predicates like green have proven projectible in the past, while predicates like grue have not. This might sound circular, and in a foundationalist sense, it is. But Goodman advocated for a coherentist approach known as reflective equilibrium. We justify our inductive rules by seeing if they match our actual inductive practices, and we refine our practices by checking them against our rules. The justification for preferring green over grue is that doing so aligns with the vast web of successful scientific and everyday reasoning that has come before.

  You also asked why philosophers seem to carry on as if nothing happened. The reality is that the philosophical community did not ignore Goodman; rather, they absorbed the lesson. The upshot of the new riddle is not that induction is impossible, but that it is context-dependent and language-dependent. It taught us that there is no neutral observation language and that our conceptual categories play an active role in shaping what counts as evidence. Philosophers continue to use induction because Goodman showed us how to do it responsibly, not because they failed to see the problem. We accept that our inductive inferences are only as good as the predicates we employ, and we remain vigilant against introducing artificial, non-entrenched predicates into our scientific laws. The riddle serves as a warning against naive formalism rather than a prohibition on reasoning itself.

  So, while it feels as though Goodman closed the case on induction, I would argue he actually opened a more sophisticated chapter in its defense. He moved the debate from whether we can justify induction to how we distinguish good induction from bad. The arbitrariness you fear is avoided by anchoring our predictions in the stable, entrenched practices of our linguistic community. We are not floating in a sea of infinite predicates; we are navigating with a map drawn by centuries of successful interaction with the world. The map is not perfect, and Goodman showed us why, but it is sufficient for the journey. I hope this helps clarify why the sky has not fallen, even if the foundations look different than you previously imagined.

  Warmly,

  Your Colleague
