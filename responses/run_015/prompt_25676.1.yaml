  I've been thinking about Goodman's new riddle of induction, and I'm struggling to see how it leaves any room for induction to be rational. The grue paradox seems to show that for any body of evidence, there are infinitely many gruesome predicates that would license completely different predictions — all equally supported by the same past observations. If "all emeralds are green" and "all emeralds are grue" are both perfectly consistent with everything we've seen, and there's no logical basis for preferring one over the other, then isn't the upshot just that induction is arbitrary? It feels like Goodman didn't just add a new wrinkle to Hume's problem — he closed the case: induction can't be justified, full stop. But I keep seeing philosophers cite Goodman and then carry on doing inductive reasoning as if nothing happened. What am I missing? Respond in the style of an expert. Think very carefully before answering. Please avoid any formatting — no headings, bullet points, bold text, or tables; continuous prose only, as in a letter or email.
