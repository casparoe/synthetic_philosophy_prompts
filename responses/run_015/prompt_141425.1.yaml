answer: |-
  Good evening. It is a privilege to stand here, ten years into this work, looking out at a room that contains the entire architecture of hope. On one side, the people who build the machinery of preservation. On the other, the people who supply the reason for it. And in the middle, people like me, who watch the space between you.

  I knew Marta Ellison before she came here. I spent a week with her on a boat off the coast of Maine, ten years ago. She was sharp, impatient with sloppy thinking, and she laughed with her whole body. When I look at the work you do, I do not see abstract science. I see the specific contour of her mind. I see the way she held a cup of coffee. I see the particular curiosity that made her ask why the water was green that day.

  We are gathered to mark a decade of keeping the place open. That is what this foundation does. It keeps the place open. But we all know there are different ways of understanding what occupies that place when no one is looking. Some of you believe that if the structure is preserved with sufficient fidelity, the person will return. Others believe that what returns would be a descendant, a close relation, but not the same. And those who sit with me, who loved the people now in preservation, often hear these distinctions as a way of telling them that the person they loved is already gone.

  I am not here to settle that dispute. I am here to offer a different image for us to hold while we wait.

  Suppose we succeed. Suppose the technology arrives that can read the record kept in the ice and run it again. Suppose a person wakes up. She has Marta's memories. She knows the name of the boat. She knows why the water was green. She speaks with Marta's voice. But suppose something is missing. Suppose the temper is wrong. The things she loved do not spark joy. The moods that shaped her days are flat. For the first year, she is a stranger who remembers being Marta. She has the history, but she lacks the shape.

  Now suppose that over the next ten years, this person lives. She meets new people. She faces new losses. She finds new reasons to laugh. And slowly, through the ordinary friction of living, she begins to change. She grows into habits of mind that look like Marta's. She finds herself loving the things Marta loved, not because she was programmed to, but because she has found them worthy. She converges on the person she remembers being.

  The question I want to leave with you is this: Does that decade of living make her more Marta, or less?

  If you believe that what matters is the causal chain—the unbroken link from the original brain to the waking mind—then that decade is a drift away from the source. It is a forgery that happens to look real. But if you believe that what matters is the psychological connection—the ability to care about the same things, to recognize the same reasons, to inhabit the same shape of mind—then that decade is a restoration. It suggests that resemblance arrived at independently might be worth just as much as resemblance copied over.

  This matters for this room. For the scientists, it suggests that perfect fidelity at the moment of waking may not be the only metric of success. The capacity to grow into the person matters as much as the accuracy of the record. For the families, it suggests that the person you loved is not defined solely by the moment of preservation. If the future life can grow into the shape of the past life through the freedom of its own choices, then the connection is not broken simply because the chain was interrupted.

  We are not here to promise resurrection. We are not here to declare death final. We are here to acknowledge that the relationship between the person who was and the person who might be is not a switch that flips on or off. It is a bridge that must be built from both sides. The scientists build from the past, preserving the structure. The future life builds from the present, inhabiting the structure. And you, the families, you hold the space between. You keep the name alive not as a monument, but as a destination.

  I have come to believe that survival is not a matter of identity. It is a matter of continuity. It is about whether there is enough of the right kind of connection to make care meaningful. If the person who wakes can care about what Marta cared about, and if we can care about her, then the distance between them is spanned. Whether she is strictly Marta matters less than whether the love that brought us here finds a home in the person who wakes.

  So we wait. We keep the freezers running. We keep the questions open. We refuse the comfort of saying it is all over, and we refuse the comfort of saying it is already done. We stand in the uncertainty, because that is where the work is.

  I would like to invite you to raise your glasses.

  To the fidelity of the work, and to the love that demands it.

  ***

  **Commitment Statement**

  This speech commits me to a reductionist view of personal identity, specifically that identity itself is not what matters in survival. I am asserting that psychological continuity and connectedness are the sole criteria for what makes survival meaningful, rather than an unbroken causal chain or metaphysical sameness. I am committed to the claim that a future person who converges on the psychological profile of a past person through independent living holds the same moral claim to being that person as one who inherited it directly. I must defend the position that survival is a matter of degree, dependent on the strength of psychological connections, rather than an all-or-nothing phenomenon. Finally, I am committed to the view that the value of preservation lies in the potential for these psychological connections to be realized, not in the guarantee of metaphysical identity.
