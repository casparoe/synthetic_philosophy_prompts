prompt: |-
  In debates about defining life, a common analogy compares living organisms to whirlpools in a stream: the water molecules constantly turn over, yet the shape persists because of continuous flow and boundary conditions. This is used—especially by proponents of organizational, substrate-independent accounts—to argue that carbon, discrete cells, and even genetic material are inessential to life, which licenses counting synthetic protocells with non-carbon backbones, self-sustaining autocatalytic chemical networks in hydrothermal systems, and metabolically active viral factories that lack independent ribosomes as genuinely alive if they maintain the right dynamics. Critics reply that whirlpools are physically inevitable given flow conditions, whereas life involves historical contingency, functional normativity, and evolutionary selection. Audit this analogy: lay out an explicit correspondence table mapping whirlpool features to biological counterparts and rating the fit; then identify the disanalogies that specifically undermine the substrate-independence claim and the borderline-case conclusions, separating those that matter for the argument from merely decorative differences; assess whether the analogy smuggles in a false equivalence between physical self-maintenance and functional or evolutionary self-maintenance; and state whether the conclusion—that substrate and containment are irrelevant to being alive—survives once the mapping is corrected, or whether the analogy was carrying the weight. If a different analogy captures the organizational view without these liabilities, suggest one briefly. After your analysis, provide a structured summary as a JSON object with exactly these fields: correspondence_table (array of objects with keys whirlpool_feature, biological_counterpart, fit_rating), disanalogies_that_matter (array of strings), decorative_disanalogies (array of strings), conclusion_survives (boolean), justification_for_conclusion (string, one sentence), analogy_carrying_weight (boolean), better_analogy_if_any (string or null).
