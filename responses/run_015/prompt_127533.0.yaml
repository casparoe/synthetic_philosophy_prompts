          *   The "Underdetermination": The EU claims Swiss-style subsidiarity but practices German-style functionalism.
      *   *Section 4: Policy Implications (The "What If" Scenario).*
          *   *Pure Epistemic/Competitive:* Abolish equalization. Let cantons fail or thrive. (Libertarian/Tiebout).
          *   *Pure Solidaristic/Unitary:* Harmonize everything. Abolish cantonal tax autonomy. (Jacobin).
          *   *Current Swiss Model:* A stable hybrid that admits a tension: "We are one people, but we govern ourselves in many ways."
      *   *Section 5: Addressing the Advisor's Terms.*
          *   Confirm they are real distinctions.
          *   Epistemic = Knowledge/efficiency.
          *   Solidaristic = Obligation/redistribution.
