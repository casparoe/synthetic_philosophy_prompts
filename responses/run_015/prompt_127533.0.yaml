answer: |-
  This is a sharp observation, and you have correctly identified the "federalism gap" that often plagues institutional design: the divergence between the *normative rhetoric* of subsidiarity (local autonomy as a good in itself) and the *operational reality* of solidarity (central redistribution as a necessity). Your advisor's terms are not projections; they map onto genuine distinctions in the literature on multi-level governance, though they are often conflated in practice.

  Here is a reconstruction of the implicit philosophies behind the Swiss and EU models, an analysis of their consistency, and a breakdown of what a "pure" version of each would look like.

  ### 1. The Swiss Model: Solidaristic Federalism with Derivative Standing

  You asked whether cantons have intrinsic moral standing or are purely instrumental. The Swiss system suggests a third category: **Derivative Constitutive Standing.**

  **The Logic of the Institution:**
  In the Swiss design, the canton is not treated as a pre-political sovereign entity (which would imply intrinsic standing akin to a state in a confederation), nor is it a mere administrative district (purely instrumental). Instead, the canton is viewed as the **primary site of democratic will-formation.**

  *   **Why Autonomy?** The justification is not just "local knowledge" (epistemic); it is *political agency*. The assumption is that citizens exercise freedom more robustly in smaller, linguistically/culturally coherent units. This is an **Input Legitimacy** argument.
  *   **Why Equalization?** If cantons were truly independent competitors (the Tiebout model of competitive federalism), wealth disparities would lead to unequal rights depending on one's zip code. The existence of *Finanzausgleich* (fiscal equalization) signals that the Federation presupposes a **single community of fate**. The moral claim of the citizen to equal public services trumps the moral claim of the canton to keep its revenue.
  *   **The Tension Resolved:** The system does not view the tension between autonomy and solidarity as a contradiction, but as a **dialectic**. Cantonal autonomy is protected *only insofar as* it does not undermine the equal status of citizens across the federation.

  **Implicit Philosophy:**
  This presupposes a **Republican Federalism**. The value of the local unit is that it sustains a specific type of citizenship (active, proximate). However, the *boundary conditions* of that citizenship are set centrally to ensure equivalence.
  *   **Moral Standing:** Cantons have standing as *cultural-political vessels*, but not as *economic sovereigns*. They have a right to exist and govern, but not a right to distinct fiscal capacities that would fracture national equality.
  *   **Consistency:** It is internally consistent if you accept that **democratic diversity requires fiscal uniformity.** You cannot have meaningful local choice if local choice is constrained by poverty.

  ### 2. The EU Model: Functional Subsidiarity and Output Legitimacy

  The EU's application of Article 5 TEU (Subsidiarity) reveals a fundamentally different implicit philosophy, despite using similar vocabulary.

  **The Logic of the Institution:**
  In the EU, subsidiarity is primarily a **competence check**, not a **sovereignty protection**.
  *   **The Procedure:** The "Yellow Card" system (where national parliaments object) is procedural. It asks: "Can this objective be better achieved at Union level?" It does not ask: "Does this infringe on the intrinsic right of the member state to decide?"
  *   **The Failure of Objections:** The fact that objections rarely succeed indicates that the threshold for "better achieved" is interpreted through **efficiency and market coherence**, not democratic proximity.
  *   **Implicit Philosophy:** This is **Technocratic Functionalism**. The member state is treated as an administrative unit that retains authority only until the central unit can demonstrate greater efficacy.

  **Implicit Philosophy:**
  This presupposes an **Output Legitimacy** framework. Legitimacy is derived from problem-solving (market integration, climate targets, border security) rather than the locus of decision-making.
  *   **Moral Standing:** Member states have **residual standing**. They hold authority by default, but that authority is contingent on performance. There is no "solidaristic federalism" in the Swiss sense because there is no single *demos* to justify the redistribution of authority based on democratic will. There is only a treaty organization optimizing outcomes.

  ### 3. Epistemic Subsidiarity vs. Solidaristic Federalism

  Your advisor's distinction is real and crucial for your chapter.

  *   **Epistemic Subsidiarity:** This argues that authority should reside locally because local actors possess **information** that central actors lack (Hayekian knowledge problems, Ostrom's polycentricity).
      *   *Policy Goal:* Efficiency and accuracy of regulation.
      *   *Limit:* If the central government gets better data or technology, the justification for local authority vanishes.
  *   **Solidaristic Federalism:** This argues that authority should reside locally because it fosters **solidarity and identity**, but central authority must redistribute resources to ensure those local communities remain viable and equal.
      *   *Policy Goal:* Equality of status and social cohesion.
      *   *Limit:* Local autonomy is curtailed if it threatens national minimum standards.

  **The Diagnosis:**
  *   **Switzerland** blends both. It uses *epistemic subsidiarity* to justify cantonal control over schooling (local culture matters), but *solidaristic federalism* to justify equalization (a child in Uri deserves the same opportunities as a child in Zurich).
  *   **The EU** claims *epistemic subsidiarity* (decisions taken as closely as possible to the citizen) but practices *centralized functionalism* (decisions taken where the market is most efficient). The "boilerplate" justifications you noticed are the result of trying to dress functionalist centralization in epistemic subsidiarity clothing.

  ### 4. What Would "Pure" Versions Look Like?

  To clarify the philosophical underdetermination in your chapter, you can contrast the current hybrid systems with "pure" types. This highlights what the current systems are suppressing.

  **A. Policy Built Purely on Epistemic/Competitive Federalism (The Libertarian/Tiebout Model):**
  *   **Change:** Abolish fiscal equalization.
  *   **Result:** Rich cantons/states lower taxes to attract capital; poor ones raise taxes or cut services.
  *   **Philosophy:** Cantons are instrumental service providers. Citizens "vote with their feet."
  *   **Why Switzerland rejects this:** It violates the constitutional guarantee of equal rights regardless of residence. It treats citizenship as a commodity.

  **B. Policy Built Purely on Solidaristic/Unitary Federalism (The Jacobin Model):**
  *   **Change:** Harmonize all education and policing standards; abolish cantonal tax autonomy.
  *   **Result:** Uniformity across the territory. No "postcode lottery."
  *   **Philosophy:** The Federation is the only moral community; sub-units are administrative deconcentration.
  *   **Why Switzerland rejects this:** It destroys the *input legitimacy* derived from linguistic and cultural self-determination. It assumes a homogeneity that doesn't exist.

  **C. Policy Built Purely on EU-Style Functional Subsidiarity:**
  *   **Change:** Remove the "national parliamentary objection" mechanism entirely; decide competence solely based on impact assessments.
  *   **Result:** Faster legislation, higher market efficiency, lower democratic friction.
  *   **Philosophy:** Legitimacy is purely outcome-based.
  *   **Why the EU keeps the mechanism:** It needs the *appearance* of respecting state sovereignty to maintain member state compliance, even if the *reality* is centralization.

  ### 5. Conclusion for Your Chapter

  The tension you are stuck on is not a bug; it is the feature.

  The Swiss system presupposes that **territorial authority is morally significant only when it is fiscally equalized.** It assumes cantons have intrinsic value as *cultural communities*, but instrumental value as *governing units*. The "killing" of competitive federalism is intentional: it prevents the intrinsic value of the community from being held hostage by economic geography.

  The EU system, by contrast, presupposes that **territorial authority is instrumentally significant only when it is efficient.** It treats member states as administrative hurdles to be cleared by the subsidiarity test, not as moral communities to be protected.

  **The Philosophical Hook:**
  Your chapter can argue that the Swiss model successfully resolves the tension by admitting that **solidarity is the precondition for autonomy.** You cannot have meaningful self-government if you are too poor to govern. The EU model fails to resolve the tension because it attempts to apply a logic of *efficiency* (epistemic subsidiarity) to a problem of *legitimacy* (political sovereignty).

  When Brussels invokes subsidiarity, it is asking "Who can do this job better?" When Bern invokes federalism, it is asking "Who has the right to live this life?" That is the fundamental philosophical divergence. Your advisor's distinction maps exactly onto this: Epistemic subsidiarity answers the "Who can do it?" question; Solidaristic federalism answers the "Who has the right?" question. Switzerland answers both; the EU mostly answers the first while pretending to answer the second.
