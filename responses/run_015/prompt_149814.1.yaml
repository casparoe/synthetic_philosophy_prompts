answer: |-
  Hi everyone. Thanks for coming.

  For those who don't know me, I'm a software engineer. I work on distributed systems, which is a polite way of saying I spend most of my time writing documentation for things I barely understand. So, standing up here to open a room full of historians and people who actually know where the bodies are buried… I'm aware of the irony.

  But I was asked to kick things off because I think I represent a specific kind of hazard this workshop is trying to avoid. I represent the practitioner's bias.

  In my world, the past is usually just "technical debt." It's the legacy code we have to refactor so we can ship the new feature. History, for a dev, is often just a ladder. We look at the rungs below us and assume they were placed there specifically so we could climb to where we are now. If a project didn't make it to the top of the ladder, we tend to label it a failure. A mistake. A naive attempt at what we do perfectly today.

  There's a name for this temptation. It's called Whig history.

  It's the idea that history is a straight march of progress toward the present moment. It's viewing the past exclusively from the victory lap of the present. And it's incredibly seductive. It comforts us. It makes our current tools feel inevitable. It makes the dead ends look like stepping stones.

  But if we do that today, we're going to miss the point of this workshop.

  If we look at a 1970s symbolic AI project and call it "naive but necessary," we're telling a lie. We're saying it existed *for* us. We're saying its only value was to teach us what not to do so modern machine learning could exist. That flattens everything. It erases the people who worked on it. They weren't trying to build PyTorch with worse hardware. They were building something else entirely. They had a different vision of what computing could be. They believed in a future that didn't happen.

  To the historians in the room: I know you know this. You've seen how much context gets stripped away when a technology becomes "standard."

  And to the devs in the room: I know why we do it. We need to ship. We need to know what works. But today, we're not here to ship. We're here to mourn, or at least to understand, the futures that didn't arrive.

  Some of you in this room lived through these failures. You were there when these projects were alive, when they weren't "failed futures" but just… the future. So I want to make a promise about how we talk today.

  Let's try not to treat these projects as prehistory. Let's not treat them as the clumsy childhood of our current tools. When we discuss a system that died, let's try to understand why it made sense at the time. What problems was it solving? What values did it hold? Who did it help, and who did it leave out?

  Because if we only look at the past as a draft of the present, we lose the alternatives. We lose the idea that things could have been different. And if we can't see that the past was contingent—that it could have gone otherwise—we won't be able to see that our current future is contingent too.

  We're here to look at the road not taken, not to explain why the road we're on is the only one that matters.

  So, if you catch yourself saying "this failed because…" try adding "…according to the winners." If you catch yourself thinking "this was just a version of…", stop. Let it be its own thing.

  I'm going to stop talking now before I accrue too much technical debt of my own. Thank you for being here, and I'm really looking forward to hearing what you have to say.
