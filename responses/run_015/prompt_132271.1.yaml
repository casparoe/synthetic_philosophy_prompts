  I was arguing with my roommate over coffee about origin essentialism — the idea that you definately couldn't have come from a different sperm and egg. She thinks it's obviously wrong because if her parents had used a different egg she imagines she'd still be 'her', just with different DNA, kind of like dyeing your hair doesn't change who you are. I tried explaining that origin essentialism isn't about genes but about the actual zygote being essential to you, so a different egg means literally not you existant.

  But then she threw identical twins at me: same sperm, same egg, but clearly two different people. If origin essentialism says your origin is essential, and twins share that origin, shouldn't they be the same person? I said maybe the split counts as part of the origin story, but she said that sounds like cheating. Then she brought up cloning — if you clone someone using a donor egg with the nucleus swapped, the clone has a different egg origin. So by origin essentialism the clone can't be you. But wait, what if you clone one twin but not the other? Does that mean the clone is closer to being the original twin than the other twin is? I'm probably mixing up genetic continuity with personal identity but I can't figure out where the mistake is. Can you straighten out whether twins actually refute origin essentialism, and what cloning does to the argument?
