      *   *Claim 4: "Concepts are fluid... slippage... creativity."* -> **Accurate.** This is the "fluid analogy" part.
      *   *Claim 5: "Concepts really do have essences — deep, stable cores that survive when you strip away the surface."* -> **Highly Problematic.** This is the biggest distortion. H&S are constructionists regarding essence. Essence is *context-dependent*. There is no "deep stable core" independent of the situation. The essence *emerges* from the analogy, it doesn't pre-exist it waiting to be stripped down.
