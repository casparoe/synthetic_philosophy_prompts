prompt: |-
  I was chatting with a friend over coffee — she works in behavorial econ — and she kept describing self-deception like a corporation running internal PR: there's a marketing team that spins bad quarterly numbers so the CEO (your conscious self) never has to face them. She uses this to argue that self-deception is basically rational, even adaptive; if knowing the truth would paralyze the CEO, why shouldn't the PR department filter it? I'm writing a feature on whether self-deception is even coherent, and I want to audit that analogy properly rather than just repeating it.

  Can you act like a professional philosopher of psychology and think through this carefully? Start with some brainstorming, then give me the full correspondance table — PR team, CEO, board of directors, quarterly reports, shareholders, maybe the auditors — and then show me exactly where the mapping breaks. Is the CEO really in authority? Does the brain actually have modular separation like corporate departments, or is the analogy smuggling in a Cartesian theater? And if we swap the corporate image for something closer to predictive processing — say, one hierarchical system that suppresses precision on self-threatening prediction errors — does the "rationality defense" survive, or does it fall apart?

  I also need you to separate the disanalgies that matter for her conclusion from the ones that don't, and tell me whether the idea that self-deception is rational was being carried by the analogy all along. Don't cite papers or books — I'm working offline and just need the conceptual map. If there's a better analogy that avoids these problems, suggest it; if not, say so. Take your time.
