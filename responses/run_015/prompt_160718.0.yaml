answer: |-
  # Session Plan: The Sleeping Beauty Simulation

  ## 1. Rules and Materials

  **Materials Needed:**
  *   **Coin:** One large, visible coin (or a digital randomizer projected on screen).
  *   **Slips:** 3 sets of 16 slips per set (48 total), pre-printed and sealed in envelopes.
      *   *Set A (Stage 1):* 16 slips. 1 says "AWAKE", 15 say "ASLEEP". (For Heads)
      *   *Set B (Stage 1):* 16 slips. 2 say "AWAKE", 14 say "ASLEEP". (For Tails)
      *   *Set C (Stage 2):* Same as above, but the two "AWAKE" slips in the Tails set are marked "1st" and "2nd".
  *   **Answer Cards:** Small cards for students to write guesses (H/T) and probabilities (0–100%).
  *   **Tokens:** Poker chips or candy (approx. 20 per student).
  *   **Lab Assistant Badge:** A lanyard or distinct marker for one student.
  *   **Scoreboard:** Whiteboard space to track cumulative tokens.

  **The Protocol (Stage 1):**
  1.  **Coin Flip:** You flip the coin privately (or behind a screen).
  2.  **Distribution:**
      *   If **Heads**: Distribute Set A (1 Awake, 15 Asleep).
      *   If **Tails**: Distribute Set B (2 Awake, 14 Asleep).
  3.  **Secrecy:** Students open envelopes under desks. No showing slips.
  4.  **Action:**
      *   **Asleep:** Write "Decoy" on the card. (This ensures rustling/writing time is identical).
      *   **Awake:** Write a guess (H or T) AND a credence number (0–100% for Heads). Seal card face down.
  5.  **Collection:** Collect all 16 cards.
  6.  **Scoring:** Open only the "Awake" cards. Award 1 token for a correct guess. (Decoys are discarded unopened).
  7.  **Reset:** Return slips to envelopes. Repeat.

  **The Protocol (Stage 2):**
  *   Same as above, using Set C.
  *   **New Rule:** Announce *before* distribution: "This round, only slips marked '1st' will be scored. If you hold a '2nd' slip, you are effectively Asleep for scoring purposes."
  *   (Note: On Heads, the single slip is '1st'. On Tails, one is '1st', one is '2nd'.)

  ---

  ## 2. Payoff Arithmetic & Round Count

  **Stage 1 Expectations:**
  *   **Probability:** $P(\text{Heads} | \text{Awake}) = 1/3$. $P(\text{Tails} | \text{Awake}) = 2/3$.
  *   **Strategy "Always Tails":**
      *   Wins on all Tails rounds (2 awake students).
      *   Loses on all Heads rounds (1 awake student).
      *   Expected Win Rate per *Awake Instance*: $2/3$.
      *   Expected Tokens per Round (Class Aggregate): $1.5 \text{ awake students} \times 2/3 \text{ win rate} = 1.0$ token/round.
      *   *Correction:* Simpler view: In 100 rounds, 50 H (50 awake), 50 T (100 awake). Total 150 awake instances. Tails is true in 100 of them. Accuracy = 100/150 = 66.7%.
  *   **Strategy "Always Heads":**
      *   Accuracy = 50/150 = 33.3%.
  *   **Strategy "Flip Coin" (50/50):**
      *   Accuracy = 50%.

  **Rounds Required:**
  With 16 students, you expect ~1.5 awake students per round.
  *   **12 Rounds:** ~18 data points. Expected T-wins: 12. Expected H-wins: 6.
      *   *Risk:* Binomial variance is high. A run of 4 Heads in a row (prob ~1%) could make Heads look viable.
      *   *Recommendation:* **18 Rounds.**
      *   Expected Awake Instances: $18 \times 1.5 = 27$.
      *   Expected T-wins: 18. Expected H-wins: 9.
      *   Gap: 9 tokens. This is visually distinct on a scoreboard.
      *   Time cost: 2 mins/round $\times$ 18 = 36 minutes.

  **Scoring Rule (Optional but Recommended for Credence):**
  Use a **Brier Score** payout to incentivize honest probability reporting.
  *   Payoff = $1 - (p - \text{outcome})^2$, where $p$ is stated prob of Tails, outcome is 1 (T) or 0 (H).
  *   **Thirder ($p=2/3$):**
      *   If T (2/3 freq): $1 - (2/3 - 1)^2 = 8/9 \approx 0.89$.
      *   If H (1/3 freq): $1 - (2/3 - 0)^2 = 5/9 \approx 0.56$.
      *   Exp Score: $(2/3 \times 0.89) + (1/3 \times 0.56) = 0.78$.
  *   **Halfer ($p=1/2$):**
      *   If T: $1 - (1/2 - 1)^2 = 0.75$.
      *   If H: $1 - (1/2 - 0)^2 = 0.75$.
      *   Exp Score: $0.75$.
  *   **Gap:** 0.03 points per round. Over 18 rounds, Thirder gains ~0.5 tokens more than Halfer.
  *   *Verdict:* The Brier gap is too small for a 90-minute class. **Stick to flat tokens for correct guesses** for Stage 1 to make the "Tails Wins" message visceral. Use the written probability numbers only for the debrief discussion.

  ---

  ## 3. Minute-by-Minute Timeline (90 Minutes)

  | Time | Activity | Notes |
  | :--- | :--- | :--- |
  | **00–05** | **Intro & Setup** | Explain rules. Emphasize silence. Distribute envelopes. |
  | **05–41** | **Stage 1: The Game** | **18 Rounds.** (2 mins/round). Flip, Distribute, Write, Collect, Tally. Update scoreboard publicly. |
  | **41–50** | **Stage 1 Debrief** | Reveal the ratio. Ask: "Why did Tails win?" Elicit: "More of us were awake on Tails." |
  | **50–70** | **Stage 2: The Filter** | **10 Rounds.** Introduce "1st Slip Only" rule. Run game. Tally. |
  | **70–75** | **Stage 2 Debrief** | Reveal the ratio (should be ~50/50). Ask: "What changed?" |
  | **75–80** | **Lab Assistant** | One student (Assistant) reveals they knew the "Day" (Slip #). They guessed 50/50 and broke even. |
  | **80–90** | **Final Critique** | Connect game to Sleeping Beauty. Address the "Sampling vs. Amnesia" objection. |

  ---

  ## 4. Stage 2 Arithmetic & Position Mapping

  **The Arithmetic:**
  *   **Heads:** 1 Awake Slip (Marked "1st").
  *   **Tails:** 2 Awake Slips (Marked "1st", "2nd").
  *   **Rule:** Only "1st" slips are scored.
  *   **Effective Sample Space:**
      *   Heads: 1 Scored Slip.
      *   Tails: 1 Scored Slip (The "1st" one).
  *   **Result:** $P(\text{Heads} | \text{Scored}) = 1/2$.

  **Position Predictions:**

  | Position | Stage 1 Credence (H) | Stage 1 Bet | Stage 2 Credence (H) | Stage 2 Bet |
  | :--- | :--- | :--- | :--- | :--- |
  | **Standard Halfer** | 1/2 | Tails (Pragmatic) | 1/2 | Random (50/50) |
  | **Standard Thirder** | 1/3 | Tails (Epistemic) | 1/2 | Random (50/50) |
  | **"Double" Halfer** | 1/2 | Heads | 1/2 | Random (50/50) |

  *Correction on Prompt's "2/3 After":* No standard position predicts 2/3 Heads after learning it is the "First Awakening." That would imply the "First" label makes Heads *more* likely, which contradicts the setup (Heads and Tails both produce exactly one "First" awakening). If a student argues this, they are likely confusing "First" with "Unique."

  **Discrimination:**
  *   **Stage 1** discriminates between **Thirders** (who bet Tails based on credence) and **Double Halfers** (who bet Heads). Standard Halfers will bet Tails but claim it's for utility, not truth.
  *   **Stage 2** discriminates between **Halfers** and **Thirders** based on their *explanation* of the change.
      *   Halfer: "I told you it was always 1/2. The Stage 1 bias was just a betting quirk."
      *   Thirder: "It *was* 1/3. The new information (that I am the First) updated me to 1/2."
  *   **Tied:** Both agree on the Stage 2 bet (Random/50/50). The activity cannot force a concession on Stage 1 credence, only on the *structure* of the evidence.

  ---

  ## 5. Stage 3: The Critique & Lab Assistant

  **The Lab Assistant Role:**
  *   **Selection:** Choose one student before class. Give them a "Lab Assistant" badge.
  *   **Knowledge:** They are **always awake**. They are told the Coin Result *or* the Day (Monday/Tuesday).
      *   *Better Design:* They are told the **Day**.
      *   If told **Monday**: They know $P(H) = 1/2$.
      *   If told **Tuesday**: They know $P(H) = 0$ (Tails only).
  *   **Task:** They submit a guess every round.
  *   **Outcome:** Over Stage 1, the Assistant (knowing the Day) will outperform the "Awake" students if they bet 1/2 on Monday and Tails on Tuesday.
      *   *Wait:* To make the point about *ignorance*, the Assistant should know it is **Monday** every time they are asked.
      *   If Assistant knows "It is Monday": They guess 50/50.
      *   Awake Students (who don't know the day): Guess Tails (1/3).
      *   **Conclusion:** The difference in performance comes from the **information about the day**, not the coin.

  **Sequencing the Objection:**
  1.  **Run Stage 1 & 2 first.** Do not allow the "This isn't SBP" objection to stop the game.
  2.  **If raised early (Min 15):** "Write that objection on your card. We will test it in Stage 3. For now, play the game."
  3.  **In Debrief (Min 80):** Ask: "In this game, being awake was news. You might have been asleep. In SBP, Beauty is *guaranteed* to be awake. Does that kill the Thirder argument?"
  4.  **The Assistant Reveal:** "The Assistant knew it was Monday. Beauty does not. The Assistant's 1/2 credence comes from knowing the day. Beauty's 1/3 credence comes from *not* knowing the day. The game simulates the *information structure*, not the amnesia."

  ---

  ## 6. Debrief Map (Connecting Game to Theory)

  | Game Moment | SBP Feature | Philosophical Lesson |
  | :--- | :--- | :--- |
  | **Stage 1 Tails Win** | Multiple Awakenings | Tails creates more "observer moments." If you sample an observer moment, Tails is more likely. |
  | **Stage 2 50/50 Tie** | "It is Monday" Info | Learning *which* awakening you are in restores the 1/2 probability. |
  | **Decoy Writing** | Indistinguishability | Ensures "Awake" students can't tell if they are the only one or one of two (simulates amnesia). |
  | **Lab Assistant** | External Observer | An observer with more info (Day) has different credence. Disagreement is possible between rational agents with different self-locating info. |

  ---

  ## 7. What Will Predictably Go Wrong

  1.  **The "Rustle" Tell:** Students holding "Asleep" slips might not write seriously, creating noise differences.
      *   *Fix:* Enforce the "Decoy" rule strictly. Collect *all* cards. If an Asleep card is blank, penalize the whole class 1 token.
  2.  **Statistical Noise:** You might flip 12 Heads in a row.
      *   *Fix:* If H comes up 5 times in a row, acknowledge it. "This is variance. The expected value is what matters." Do not rig the coin; it undermines trust.
  3.  **The Early Objection:** A student says, "I know I'm not Sleeping Beauty because I can look around and see others awake."
      *   *Fix:* "You are not simulating Beauty's mind; you are simulating the *probability structure*. Play the math."
  4.  **Token Fever:** Students care more about winning candy than the epistemology.
      *   *Fix:* Frame the tokens as "Accuracy Points." The winner is the one whose *credence* matched the frequency, not just the lucky guesser.
  5.  **Stage 2 Confusion:** Students forget the "1st Slip Only" rule.
      *   *Fix:* Write the rule on the board in large letters during Stage 2.
  6.  **The "Halfer" Dig-In:** Halfers will argue Stage 1 was just a betting puzzle, not a credence puzzle.
      *   *Fix:* Accept this. The goal isn't to convert them, but to show *why* Thirders bet Tails. "Okay, you say credence is 1/2 but bet Tails. Why? Because the payoff structure matches the Thirder credence. You are acting like a Thirder."

  ---

  ## 8. Limitations: What This Activity Cannot Reproduce

  **Honest Note for the Instructor:**
  No classroom surrogate can give students the experience of **genuine self-locating ignorance**.
  *   **In the Game:** Students know they are distinct entities (Alice, Bob, Charlie). They know they were sampled from a pool.
  *   **In SBP:** Beauty is one entity experiencing temporal duplication. She doesn't wonder "Am I Alice or Bob?"; she wonders "Is this Monday or Tuesday?"

  **How to Handle the Last 10 Minutes:**
  Do not try to claim the game *is* SBP. Use the game as a **bridge**.
  *   **Script:** "In this game, you were 1/3 because you might have been asleep. Beauty is never asleep. So why does the math hold? Because 'Being Awake' divides the Tails world into two indistinguishable experiences, just like our two slips. The game proves that *if* you treat awakenings as sampling events, 1/3 follows. The debate is whether Beauty *should* treat them that way. The game doesn't answer that. It just shows you what the Thirder sees."

  **Final Verdict:**
  This activity will not solve the Sleeping Beauty problem. It will, however, force the Halfers to admit that the Thirder's betting strategy is mathematically optimal in a branching world, and force the Thirders to admit that their credence depends on treating awakenings as random samples. That tension is where the actual philosophy lives.
