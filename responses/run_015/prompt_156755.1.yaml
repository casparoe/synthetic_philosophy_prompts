  # Research Proposal: Process, Potential, and Persistence – A Four-Dimensional Approach to the Statue and the Clay

  **Project Duration:** Twelve Weeks
  **Target Word Count:** 5,000 words (Final Essay)
  **Proposal Author:** [Your Name]
  **Date:** October 2023

  ## 1. Abstract

  The metaphysical problem of material constitution, classically illustrated by the case of the statue and the clay, has traditionally been framed as a puzzle of co-location and identity. Standard debates ask whether two distinct objects can occupy the same spatial region at the same time, or whether the statue is simply identical to the clay despite differing modal properties. This proposal outlines a project that seeks to bypass this static dichotomy. Instead of treating the clay as a three-dimensional lump coinciding with a statue, I propose analysing the clay as a four-dimensional process-object—a 'worm' extending through time that includes its own modal potential for reshaping. On this view, the statue is not a separate object but a temporal-modal slice of a larger entity. The central research question is whether this process-based framing dissolves the coincidence problem or merely displaces the contradiction into the ontology of processes themselves. To test this, the project will employ a comparative methodology, analysing the logic of artistic conservation, where material replacement challenges identity conditions. This proposal details the philosophical background, the specific critique of standard views, the methodological plan for the semester, and the criteria for evaluating the success of the process-ontological hypothesis.

  ## 2. Introduction: The Coincidence Problem and the Static Bias

  The puzzle of material constitution is a staple of contemporary analytic metaphysics. It arises when we consider an object, such as a statue, made from a specific quantity of matter, such as a lump of clay. Intuitively, the statue and the clay appear to be distinct. The clay existed before the statue was sculpted, and the clay could survive being squashed into a ball, whereas the statue could not. By Leibniz's Law, if they have different properties, they cannot be identical. Yet, they appear to occupy the exact same spatial location at the same time. This generates the 'coincidence problem': how can two material objects be in the same place at the same time without being identical?

  The standard literature has largely treated this as a problem of static ontology. The dominant frameworks—whether they defend co-location, constitution, or identity—tend to conceptualise the objects involved as three-dimensional entities that endure through time. They are treated as 'wholes' present at every moment of their existence. My tutor has rightly pointed out that this static bias limits the scope of possible solutions. If we assume the clay is a static lump, we are forced into a corner where we must either accept 'spooky' co-location or deny intuitive modal differences.

  However, there is an alternative intuition, one that arose during a discussion with a peer studying sculpture. She remarked that a statue is merely "potential clay realised differently." While philosophically imprecise, this comment points towards a dynamic understanding of the material. It suggests that the clay is not a static substrate waiting to be shaped, but a field of potentiality that is actualised in the form of the statue. The problem with her formulation is that it relies on an Aristotelian notion of potentiality that is often viewed as obscure in modern metaphysics. It lacks a rigorous account of *how* that potential is stored in the object's identity conditions.

  This project proposes to formalise that intuition using the resources of four-dimensionalism (perdurantism) and process ontology. In a four-dimensional framework, objects are not wholly present at each moment; rather, they are extended in time just as they are in space. They are 'spacetime worms'. If we apply this to the clay, the clay is not just the lump at time *t*; it is the entire history of that matter, including its future possibilities. The statue, then, is not a separate object sitting on top of the clay. It is a specific temporal segment or 'slice' of the clay-worm, defined by a specific structural configuration.

  The core ambition of this project is to determine if this shift in perspective solves the metaphysical tension. If the statue is just a phase of the clay-process, we avoid co-location because there is only one object (the process) with different parts at different times. However, this raises a new difficulty. If the statue is just a slice, what defines the boundaries of that slice? If the clay is a process defined by its potential to be reshaped, does the process cease when the statue is destroyed, or does it continue as 'squashed clay'? If it continues, are the statue and the squashed clay the same object? If they are the same object, we return to the modal problem (the object both can and cannot survive squashing). If they are different objects, we must explain what individuates the processes.

  Therefore, the precise research question for this semester-long project is: **Does framing the clay as a four-dimensional process-object with inherent modal potential dissolve the coincidence problem, or does it merely push the contradiction into the ontology of processes themselves?**

  To answer this, I will not rely solely on armchair intuition. I will integrate a case study from art conservation. Conservators frequently face the practical equivalent of the Ship of Theseus paradox. When a painting is restored, material parts are replaced, yet the institution and the public regard it as "the same painting." By comparing the metaphysical logic of the process-view with the practical logic of conservation, I aim to test whether the process-ontology holds up under the pressure of material change.

  ## 3. The Standard Landscape: Why Current Solutions Leave the Angle Open

  To justify the need for a process-based approach, one must first demonstrate why the existing solutions are insufficient for this specific line of inquiry. The literature is vast, but three main positions dominate the field: the Identity View, the Constitution View, and Mereological Essentialism. Each of these treats the relationship between the statue and the clay as a static relation between two things in the same place at one time.

  ### 3.1 The Constitution View (Lynne Baker)

  Lynne Baker's constitution view is perhaps the most sophisticated defence of the idea that the statue and the clay are distinct but intimately related. She argues that the clay *constitutes* the statue without being *identical* to it. They share the same matter and location, but they have different persistence conditions. The clay is constituted by the atoms arranged clay-wise; the statue is constituted by the clay arranged statue-wise.

  Baker's view relies heavily on the notion of 'primary kind' properties. To be a statue is to have the property of being a statue essentially. To be a lump of clay is to have the property of being a lump of clay essentially. Because these properties differ, the objects differ. This allows her to avoid the contradiction of one object having conflicting modal properties.

  However, Baker's view leaves the process angle open for two reasons. First, it accepts co-location as a brute fact. She argues that two things can be in the same place at the same time provided they are of different kinds. For many metaphysicians, this is a high cost to pay. It multiplies entities beyond necessity. My project asks whether we can avoid this multiplication by viewing the 'two things' as temporal parts of one process.

  Second, and more critically, Baker's view is synchronic. It focuses on the relationship at a specific time *t*. It does not adequately account for the *history* of the material as part of its identity. When my flatmate said the statue is "potential clay realised," she was implying that the history and future of the clay are relevant to what the statue *is*. Baker's constitution view treats the clay as a substrate that could be swapped out (in principle) provided the functional role is maintained. It does not treat the clay's specific material trajectory as constitutive of the statue's identity in a processual sense. By shifting to a four-dimensional view, we can ask whether the 'constitution' relation is actually a 'parthood' relation between temporal slices.

  ### 3.2 Mereological Essentialism (Chisholm)

  Mereological essentialism takes the opposite tack. It argues that an object is identical to the sum of its parts. If you remove a single atom from the statue, it is no longer that statue. This view preserves Leibniz's Law rigorously but at the cost of common sense. It implies that statues (and people) go out of existence constantly as they gain and lose matter.

  This view is relevant to my project because it treats objects as rigid sums. However, it is fundamentally static. It does not allow for the 'modal potential' that my flatmate mentioned. For a mereological essentialist, the clay has no potential to be reshaped; if it is reshaped, it is a new sum of parts. This fails to capture the intuition that the *same stuff* persists through the change. A process ontology can accommodate change without abandoning identity, by viewing the change as part of the process's extension in time. The essentialist says the object ends; the process theorist says the object enters a new phase. My project will investigate whether this 'phase' distinction is metaphysically robust or merely linguistic.

  ### 3.3 The Identity View and Sortal Relativism

  Some philosophers argue that the statue and the clay are identical, and the apparent difference in modal properties is due to sortal relativism. 'Statue' and 'Clay' are just different concepts we apply to the same underlying reality. This dissolves the coincidence problem by denying there are two objects.

  However, this view struggles with the intuition that the clay survives the destruction of the statue. If they are identical, and the statue is destroyed, the clay must be destroyed. Proponents argue the clay survives only in a different form, but this requires a nuanced account of what 'survival' means. A process view offers a clearer mechanism for this: the process continues, but the 'statue-phase' terminates. The identity view often lacks the temporal machinery to explain *how* the object transitions from being statue-constituted to non-statue-constituted without contradiction.

  ### 3.4 The Gap

  The common thread across these standard replies is that they treat the objects as 3D entities enduring through time. They ask, "What is the relation between Object A and Object B at time *t*?" My proposal shifts the question to: "What is the relation between Phase A and Phase B of Process P across time *t1* to *t2*?"

  The standard views leave this angle open because they do not incorporate the modal potential of the material into the identity conditions of the object *during* its existence. They treat potentiality as a matter of counterfactuals (what *would* happen if...), rather than as an ontological feature of the object's temporal extension. By treating the clay as a 4D worm that includes its possible reshaping as part of its modal profile, we might find that the 'coincidence' is an illusion created by slicing a 4D object at a single temporal coordinate. However, this introduces the risk of a new problem: if the process includes all its potential reshaping, does the 'statue' slice have any independent ontological status? This is the tension I intend to explore.

  ## 4. The Process-Ontological Hypothesis: 4D Worms and Modal Slices

  The core of this project rests on a specific metaphysical hypothesis: that material objects are best understood as four-dimensional processes. This section outlines the theoretical framework I will employ in the final essay.

  ### 4.1 Perdurantism and Temporal Parts

  Perdurantism, or four-dimensionalism, holds that objects persist by having different temporal parts at different times, much like a road has different spatial parts at different locations. A person, on this view, is a 'spacetime worm' composed of person-stages.

  Applying this to the statue and the clay:
  1.  **The Clay-Worm:** This entity begins when the clay is mined or mixed. It extends through the sculpting process, the existence of the statue, and potentially through the squashing of the clay into a ball.
  2.  **The Statue-Worm:** This entity begins when the sculpting is complete. It ends when the statue is destroyed (e.g., squashed).

  In the standard 3D view, the Clay-Worm and the Statue-Worm coincide entirely during the time the statue exists. This looks like co-location. But in the 4D view, we can say that the Statue-Worm is a *proper temporal part* of the Clay-Worm. Just as my hand is a part of me, the statue-phase is a part of the clay-history.

  ### 4.2 Integrating Modal Potential

  The user's specific intuition involves the "modal potential for reshaping." Standard 4Dism deals with actual temporal parts. To incorporate the flatmate's intuition, I will utilise a modalised version of perdurantism. This suggests that the identity of the process-object is not just determined by its actual history, but by its 'modal neighbourhood'—the set of possible histories it could have undergone.

  The clay is not just the actual worm; it is a worm with a certain 'flexibility'. The statue is a 'constrained' slice of that worm. The sculpting process restricts the modal potential of the clay. Before sculpting, the clay could become a pot, a brick, or a statue. After sculpting, that specific portion of the clay-worm is locked into the 'statue' trajectory.

  This framing allows us to say that the statue and the clay are not two competing substances. They are the same substance under different modal constraints. The 'coincidence' is simply the overlap of the constrained phase (statue) with the unconstrained phase (clay).

  ### 4.3 The Risk of Displacement

  The critical question, as noted in the research question, is whether this solves the problem or moves it.
  *   **Dissolution:** If the statue is just a part of the clay, there is no co-location. There is only one object (the clay-process) exhibiting different properties at different temporal segments. The modal difference is explained by the fact that the 'statue segment' has different persistence conditions than the 'whole worm'.
  *   **Displacement:** The contradiction might re-emerge when we ask about the identity of the process itself. If the clay-process includes the potential to be squashed, but the statue-process does not, are they really the same process? If I say "The clay survived," I am referring to the whole worm. If I say "The statue perished," I am referring to the segment. But if the segment is part of the worm, and the segment perishes, does a part of the worm perish while the worm survives? This is coherent (my hand can be amputated while I survive). But does it capture the intuition that the *statue* is the primary object of interest?

  Furthermore, defining the boundaries of the process becomes difficult. When does the clay-process begin? At the mining? At the mixing? When does it end? If the process is defined by its modal potential, and that potential changes during sculpting, do we have one process or two? If we have two, we are back to coincidence. If we have one, we must explain why we talk about them as two. This is where the ontology of processes faces its stiffest test.

  ## 5. The Conservation Analogy: Material Continuity vs. Identity

  To prevent this project from becoming purely abstract, I will ground the metaphysical analysis in the practices of art conservation. This serves as an empirical test case for the logic of identity through material change.

  ### 5.1 The Conservator's Dilemma

  Art conservators operate under a set of ethical and practical guidelines (such as those from the International Council of Museums) that implicitly commit to a theory of identity. When a painting is restored, the goal is often to preserve the "aesthetic integrity" of the work while stabilising the material.

  Consider a case of heavy restoration:
  1.  **Inpainting:** Missing paint is filled in with new pigment.
  2.  **Relining:** The canvas is attached to a new support fabric.
  3.  **Structural Replacement:** Rotten wood in a panel painting is replaced with new wood.

  In extreme cases, a significant percentage of the original material is replaced. Yet, the museum catalogues list it as the same object (e.g., "Rembrandt, *The Night Watch*").

  ### 5.2 Mapping Conservation to Metaphysics

  This scenario parallels the statue and the clay, but with a focus on *part replacement* rather than *reshaping*.
  *   **The Standard View:** A constitution theorist might say the painting is constituted by the canvas and paint, but is not identical to them. As parts are replaced, the constitution relation holds with new matter.
  *   **The Process View:** A process ontologist would view the painting as a continuous history of maintenance. The 'object' is the trajectory of care and preservation. The material is merely the current 'slice' of that trajectory.

  This analogy is useful for my project because conservators often distinguish between the 'material object' and the 'cultural object'. The material object degrades; the cultural object persists. This distinction maps neatly onto the Clay/Statue distinction. The 'Clay' is the material object (subject to physical decay and reshaping); the 'Statue' is the cultural object (defined by form and intent).

  ### 5.3 Testing the Hypothesis

  I will use this analogy to test the process-based framing.
  *   **Test 1: Continuity.** Does the process view explain why we accept the restored painting as the 'same'? Yes, if identity is based on the continuity of the process (the history of preservation) rather than the continuity of the atoms.
  *   **Test 2: Limits.** Is there a point where restoration becomes replacement? If I replace every plank of a wooden statue, is it the same statue? Conservators debate this. If the process view says "yes, provided the causal history is continuous," does that align with our intuitions?
  *   **Test 3: The Flatmate's Intuition.** The conservator might say the painting is "potential pigment realised as an image." If the pigment is replaced, is the potential realised again? This helps clarify whether 'potential' is a property of the matter or the form.

  By integrating this case study, the project moves beyond the abstract 'lump and statue' example, which is often criticised for being too artificial. Conservation provides real-world stakes for identity conditions. If the process ontology cannot account for why a restored painting is insured as the original, it fails to capture the practical logic of identity.

  ## 6. Research Methodology and Weekly Schedule

  The project will be conducted over twelve weeks. The methodology is primarily conceptual analysis, supported by the comparative case study of art conservation. I will not be conducting empirical interviews with conservators, but rather analysing published conservation charters and philosophical literature on art ontology.

  The work is divided into four phases: Foundation, Application, Synthesis, and Refinement.

  ### Phase 1: Foundation (Weeks 1-3)
  **Goal:** Establish the metaphysical framework and critique the standard views.

  *   **Week 1: Literature Review and Problem Definition.**
