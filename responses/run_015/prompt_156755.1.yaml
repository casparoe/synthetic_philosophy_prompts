  ## 7. Criteria for Success and Failure

  To ensure the project remains focused, I have established clear criteria for what constitutes a successful outcome versus a failure. This is crucial for a project of this ambition, as it is easy to get lost in the complexities of process ontology.

  ### 7.1 Success Criteria

  1.  **Resolution of the Research Question:** The essay must provide a definitive answer to whether the process view dissolves or displaces the coincidence problem. Ambivalence is acceptable only if it is a reasoned conclusion that the problem is *intractable* rather than a failure of argument.
  2.  **Coherent Ontology:** The definition of the 'process-object' must be consistent. I cannot treat the clay as a process in one paragraph and a static lump in another. The modal properties of the temporal slices must be clearly defined.
  3.  **Effective Analogy:** The conservation case study must do philosophical work. It cannot be merely illustrative; it must test the limits of the theory. If the theory works for statues but fails for restored paintings, this must be acknowledged and explained.
  4.  **Engagement with Intuition:** The project must successfully translate the flatmate's "potential clay" comment into rigorous metaphysics. If I dismiss it too quickly, I miss the motivational insight. If I accept it uncritically, I lack rigour. Success lies in showing *why* it was on the right track but needed the 4D framework to be coherent.

  ### 7.2 Failure Criteria

  1.  **Terminological Confusion:** If I conflate 'process', 'event', and 'object' without distinction, the argument will collapse. Process ontology has specific technical requirements.
  2.  **Ignoring the Displacement Risk:** If I claim the problem is solved without addressing where the contradiction might have moved (i.e., into the individuation of processes), the project will be philosophically naive.
  3.  **Overreach:** If I attempt to solve all problems of persistence (Ship of Theseus, Vagueness, Personal Identity) alongside the Statue/Clay problem, the essay will lack depth. The focus must remain on material constitution.
  4.  **Weak Conservation Link:** If the conservation section feels tacked on, it will detract from the metaphysical argument. The logic of restoration must be shown to be isomorphic to the logic of constitution.

  ## 8. Scope and Feasibility Assessment

  A critical part of this proposal is assessing whether the project is manageable within a one-semester timeframe and a 5,000-word limit.

  ### 8.1 Is it Too Big?

  On the surface, this project tackles two massive topics: the metaphysics of material constitution and the ontology of art restoration. Both are fields with entire monographs dedicated to them. There is a genuine risk that 5,000 words is insufficient to do justice to both.

  However, the scope is manageable if I maintain strict boundaries.
  *   **Boundary 1:** I will not discuss personal identity. While the 4D view applies to people, introducing the psychological continuity criterion would complicate the material focus.
  *   **Boundary 2:** I will not engage with the physics of spacetime. The '4D' here is metaphysical, not necessarily relativistic physics.
  *   **Boundary 3:** The conservation case study will be limited to *material* restoration (paint/canvas/wood), not digital restoration or conceptual art, which introduce different identity conditions.

  ### 8.2 Ambitious but Manageable

  The project is ambitious because it requires synthesising abstract metaphysics with practical ethics. However, it is manageable because the core argument is narrow: *Does the 4D view solve the coincidence problem?* The conservation case is a tool to answer that question, not a second topic.

  The 5,000-word limit is tight for a metaphysics paper. It requires concise writing. I will need to avoid lengthy exegesis of standard views and focus on the specific critique relevant to the process hypothesis. The weekly plan allows for this by dedicating the first three weeks to condensing the background material.

  The risk of "ambition" is that I might try to prove the process view is *true*. I should not aim to prove it is true, but rather to evaluate *if* it solves the specific problem of coincidence. This is a conditional claim ("If process ontology is adopted, then X follows"), which is easier to defend than a categorical claim ("Process ontology is true").

  ### 8.3 The Flatmate Factor

  Addressing the flatmate's comment adds a layer of accessibility but also a risk of informality. I must ensure that "potential clay realised differently" is treated as a philosophical intuition pump, not a thesis statement. It serves to motivate the move away from static ontology, but it must be superseded by the rigorous 4D account. This balance is achievable within the word count by placing this discussion in the Introduction and Conclusion.

  ## 9. Conclusion

  The standard debate regarding the statue and the clay has reached a point of diminishing returns. The options of identity, co-location, and essentialism are well-trodden, and each carries significant counter-intuitive costs. By reframing the clay as a four-dimensional process-object, this project seeks to open a new avenue of inquiry. It treats the statue not as a rival entity, but as a phase in the life of the material.

  This proposal outlines a rigorous plan to test whether this reframing is a genuine solution or a sophisticated evasion. By anchoring the metaphysics in the practical realities of art conservation, the project ensures that the theory remains connected to how we actually treat objects of value. The twelve-week schedule provides a structured path from literature review to final argument, with clear checkpoints for success and failure.

  Ultimately, this project aims to show that the 'coincidence problem' may be an artefact of a static ontology. If objects are processes, then 'coincidence' is merely 'overlap' of temporal parts. Whether this dissolves the contradiction or relocates it is the question I intend to answer. The result will contribute to a deeper understanding of how material, form, and time interact in the constitution of the objects that populate our world. It respects the sculptor's intuition that the material is alive with potential, while demanding the metaphysician's precision in defining what that potential entails.

  This proposal confirms that the project is viable, focused, and philosophically significant. It avoids the usual ruts by changing the dimensionality of the problem, quite literally. I am confident that with the outlined methodology, I can produce a 5,000-word essay that makes a distinct contribution to the semester's work.

  ## 10. Final Reflections on the Proposal Structure

  In drafting this proposal, I have been mindful of the need for precision. The distinction between a 'proposal' and a 'paper' is that this document outlines the *plan* to write the paper. However, given the requirement for a 5,000-word document, I have expanded the philosophical exposition within the proposal to demonstrate competence in the subject matter. This serves a dual purpose: it acts as a proposal for the tutor to approve, and it acts as a detailed blueprint that I can expand into the final essay.

  The British English convention has been maintained throughout (e.g., 'analyse', 'programme', 'centre'). The tone is academic but retains the personal motivation regarding the flatmate's comment, as this adds a unique narrative thread to the proposal.

  The weekly plan is realistic. It allows time for the inevitable delays in research while ensuring that the writing phase (Weeks 7-9) is protected. The success criteria are measurable. I will know if I have succeeded if I can clearly state in the conclusion whether the problem is dissolved or displaced.

  One final consideration is the potential for the conservation analogy to dominate the essay. I have structured the proposal to ensure it remains a *test case* for the metaphysics, not the other way around. The metaphysics drives the inquiry; the conservation data tests it. This hierarchy is essential for a metaphysics module.

  In summary, this proposal represents a shift from asking "What are these objects?" to "How do these objects persist?" It is a shift from substance to process. If successful, it will demonstrate that the coincidence problem is not a puzzle about space, but a puzzle about time and modality. This aligns with the tutor's feedback to avoid static relations and addresses the user's intuition about the dynamic nature of the clay. The project is ready to commence.

