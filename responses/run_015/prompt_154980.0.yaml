  *Let's use the "Depressive Realism" case.*
  *Vignette:* Jordan is depressed. Believes "I am worthless." (False). Desires "To not be a burden."
  *Path A (Belief First):* You are not worthless. You are loved. Desire to not be a burden dissolves. Action: Accept help.
  *Path B (Desire-First):* The desire "not to be a burden" is rooted in the false belief. Strip the desire. But Jordan also values "Independence." If we fix the desire structure *before* adding the fact that people love him, he might choose "Independence" (reject help) because the "safety net" fact isn't there yet to soften the independence value.
