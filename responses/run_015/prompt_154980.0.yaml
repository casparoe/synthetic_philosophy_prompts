  *Final check on "Estrangement":* The Ideal Advisor must recommend something the Actual Agent finds repugnant.
  *Example:* Ideal Advisor says "Give away all your money." Actual Agent loves their family's security.
  *Why?* Because Ideal Advisor knows money doesn't buy happiness.
  *This is classic Parfit/Williams.* I will build this into the "Extent of Idealization" part of the instructions. One consultant goes "Full Info," the other goes "Local Info."

