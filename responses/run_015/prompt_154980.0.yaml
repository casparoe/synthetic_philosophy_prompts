prompt: |-
  I teach an upper-level undergraduate seminar on reasons and motivation: 14 students, one 90-minute session. They have already met the standard indirect-normativity family of views — roughly, that what an agent has reason to do is fixed by what a better-informed, more vividly imaginative, less irrational counterpart of that agent would want or advise, rather than by her actual desires. I want a structured role-play that makes them run into, rather than hear about, two features of idealizing in this way, and I don't want to open with a lecture or name either problem until the debrief.

  The first is estrangement: as the counterpart's information and imagination improve, her verdicts can drift free of anything the actual agent cares about, so that it stops being obvious why the advice binds her. The second is that the counterpart is not yet well defined: whether you correct the agent's factual beliefs first and then let her desires settle, or strip out desires that depend on false beliefs before supplying the information, seems to change the answer, and there is no further ideal-level resource that settles which order is the right one.

  My idea is to give each student a deliberately thin vignette — a decision, a few circumstances, almost nothing about the agent's motives, so they have to fill in the rest themselves — and to have each agent advised by two consultants working under different written instructions about the order and extent of idealization. Each consultant must attach to every recommendation a note of which feature of the actual agent's concerns it traces back to. Each agent then commits in writing, in front of the room, to which recommendation she would act on.

  Please give me the roles and rules, the vignette, the two instruction sheets, a minute-by-minute timeline, and a debrief that maps the moments students will actually hit onto the two problems and onto what the view needs in order to survive them: a uniqueness claim about the idealization procedure, or an account of why inheritance from the actual agent fails. Tell me what will predictably go wrong the first time — consultants quietly importing their own values, agents treating the exercise as prediction rather than advice — and be frank about which part of the problem the role-play cannot stage and I will have to argue for myself. If the set-up as I have described it manufactures the divergence rather than exposing it, or if the thing only works after the lecture I said I didn't want, say so plainly rather than handing me a polite design.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Context:** Upper-level undergraduate seminar (Reasons & Motivation).
      *   **Class Size/Time:** 14 students, 90 minutes.
      *   **Prior Knowledge:** Students know the "indirect-normativity family" (Ideal Advisor/Full Information views).
      *   **Goal:** A structured role-play to *experience* two specific problems with idealization without prior lecture on them.
      *   **Problem 1 (Estrangement):** The ideal self's advice drifts so far from actual concerns it loses normative grip.
      *   **Problem 2 (Ordering/Definition):** The order of idealization (beliefs first vs. desires first) changes the outcome, with no meta-rule to fix it.
      *   **Constraints:** No opening lecture naming the problems. Structured role-play. Specific roles/rules/vignettes/instructions. Minute-by-minute timeline. Debrief mapping experience to theory. Honesty about limitations/predictable failures.
      *   **Tone:** Direct, frank, pedagogical, not polite if the design is flawed.

  2.  **Evaluate the User's Proposed Design:**
      *   *User's Idea:* Thin vignettes, agents advised by two consultants with different instructions on order/extent of idealization. Consultants must trace recommendations to actual concerns. Agents commit publicly.
      *   *Critique:* This is actually quite strong. It forces the "black box" of idealization to be opened up by the students themselves. However, "thin vignettes" risk students just projecting their own values (the "consultants importing their own values" problem the user identified). To make the *ordering* problem visible, the vignette needs specific tension points where belief correction changes desire formation. To make *estrangement* visible, the idealization needs to push far enough that the agent doesn't recognize themselves.
      *   *Potential Pitfall:* If the vignette is *too* thin, students won't see the divergence. If it's *too* thick, it dictates the answer. The instructions to consultants need to be rigid enough to force divergence but open enough to require interpretation.
      *   *Feasibility:* 14 students is a great number for this. 7 pairs or 7 trios? Let's go with trios (1 Agent, 2 Consultants) = roughly 4-5 groups, leaving 1-2 students as observers or rotating. Actually, 14 students fits perfectly into 7 pairs (1 Agent, 1 Consultant) but we need *two* consultants per agent to show divergence. So, 4 groups of 3 (12 students) + 2 observers/moderators? Or 7 pairs where they switch roles?
      *   *Better Grouping:* 4 Groups of 3 (Agent, Consultant A, Consultant B) = 12 students. 2 Students as "Scribes/Timekeepers" who record the divergences on the board. This ensures everyone has a role.
      *   *The "Ordering" Problem:* This is hard to simulate in real-time without explicit rules. The consultants need *different algorithms*.
      *   *The "Estrangement" Problem:* This requires the "Full Information" part to radically alter the scenario.

  3.  **Refining the Design (Addressing the "Manufactures Divergence" Worry):**
      *   *Risk:* If I tell Consultant A to do X and Consultant B to do Y, I am *telling* them there is a problem, not letting them find it.
      *   *Fix:* The instructions must seem like reasonable interpretations of "Ideal Advisor." One instruction emphasizes *Correcting Beliefs First* (then desires follow). The other emphasizes *Purging Irrational Desires First* (then information is added).
      *   *Vignette Choice:* Needs to be something where factual beliefs and deep desires are entangled. A career choice? A relationship? A moral dilemma?
      *   *Selection:* A "Life Path" decision works best for estrangement. Let's use a specific case: "The Burnt-Out Artist." Someone who wants to paint but believes they will starve.
      *   *Wait, one vignette for everyone?* No, that gets boring. Two vignettes, distributed among groups.
      *   *Actually, for a 90-minute seminar, one shared vignette is better for debrief.* Let's use one specific, slightly complex case.
      *   *Case:* "Alex." Alex wants to be a musician. Alex believes (falsely) that their family will disown them if they quit law school. Alex also has a latent desire for stability rooted in childhood poverty (which might be irrational or rational).
      *   *Consultant A (Belief-First):* Fix all factual errors first. (Family won't disown). Then see what Alex wants.
      *   *Consultant B (Desire-First):* Fix irrational desires first (e.g., fear of poverty is exaggerated/irrational given safety nets). Then add information.
      *   *Wait, does this create divergence?*
          *   Belief-First: Family supports me -> I can be a musician.
          *   Desire-First: Fear of poverty is irrational -> I don't need stability -> I can be a musician.
          *   *Result:* Convergence. Bad for the exercise.
      *   *Need Divergence:*
          *   Case: "The Happy Ignorant." Alex is happy in a relationship but believes (falsely) their partner is faithful. Partner is actually cheating.
          *   Consultant A (Truth-First): Reveal cheating. Alex leaves.
          *   Consultant B (Psychological-Coherence-First): Alex values loyalty above all. If Alex knew, they would be devastated. But wait, idealization usually implies knowing truth.
          *   *Let's try the "Repugnant Conclusion" angle or "Experience Machine".*
          *   *Better:* "The Religious Vocation." Alex wants to join a monastery. Alex believes God exists (false, let's assume for the case). Alex values spiritual fulfillment over material wealth.
          *   Consultant A (Fact-First): God doesn't exist. Monastery is just a job. Alex might prefer secular charity.
          *   Consultant B (Value-First): Alex values "submission to higher purpose." Even knowing God doesn't exist, the *structure* fulfills the desire.
          *   *This is getting too philosophical.* Let's stick to the prompt's requirement: *Order of operations.*
          *   *Scenario:* "The Risky Surgery."
          *   Agent: Wants to avoid pain. Believes surgery has 90% success (False: 10%).
          *   Consultant A (Info-First): Tell truth (10%). Agent refuses surgery.
          *   Consultant B (Desire-First): Agent's desire to avoid pain is based on fear (irrational). Correct the fear (pain is manageable). Then tell truth. Agent accepts surgery.
          *   *Divergence:* Refuse vs. Accept.
          *   *Estrangement:* Consultant B's "Corrected Agent" feels no fear. Actual Agent is terrified. Why listen to B?

  4.  **Developing the Materials:**
      *   **Vignette:** Needs to be printed.
      *   **Instruction Sheets:** Need to be distinct enough to cause friction but plausible enough to seem like "Ideal Advisor" theories.
      *   **Timeline:** 90 mins is tight.
          *   Setup: 5 min.
          *   Group Work: 30 min.
          *   Presentations/Commitments: 25 min.
          *   Debrief: 30 min.
      *   **Debrief:** Must connect the *feeling* of the agent ("That's not me!") to Estrangement, and the *confusion* of the consultants ("Which rule first?") to the Ordering Problem.

  5.  **Addressing the "Frankness" Requirement:**
      *   I need to explicitly state where this simulation fails.
      *   *Failure 1:* Students treat it as "What would I do?" rather than "What does the theory say?"
      *   *Failure 2:* The "Ordering" problem is often resolved by students just compromising, hiding the theoretical incommensurability.
      *   *Failure 3:* Estrangement is hard to feel in 15 minutes. You need to *be* Alex for a while.
      *   *Failure 4:* The simulation *stipulates* the ordering rules. In real theory, the problem is that the theory *doesn't* specify the rules. The simulation solves the problem by giving rules, then shows the rules diverge. This is close, but I need to make sure they realize the *theory* didn't tell them which rule sheet to use.

  6.  **Drafting the Content (Iterative refinement):**
      *   *Grouping:* 4 Groups of 3 (12 students) + 2 Scribes.
      *   *Vignette:* "Jordan." High-stakes career/life choice. Entangled beliefs and desires.
      *   *Consultant Sheets:*
          *   Sheet 1 (The Truth-First Protocol): Correct all factual beliefs. *Then* assess desires.
          *   Sheet 2 (The Coherence-First Protocol): Remove desires based on cognitive errors/fears. *Then* assess facts.
      *   *Agent Task:* Choose which advice to follow. Write a "Binding Statement."
      *   *Debrief:* Focus on the moment the Agent felt alienated. Focus on the moment Consultants realized they couldn't agree on *how* to idealize.

  7.  **Final Review against Constraints:**
      *   No lecture on problems at start? Check.
      *   Role play? Check.
      *   14 students, 90 mins? Check.
      *   Addresses Estrangement & Ordering? Check.
      *   Frank about limitations? Check.

  8.  **Constructing the Output:** (Self-Correction during drafting)
      *   *Correction:* Make sure the "Ordering" problem isn't just "different opinions." It needs to be procedural. The instructions must read like *algorithms*.
      *   *Correction:* Ensure the "Estrangement" isn't just "bad advice." It needs to be advice that is *rationally perfect* but *psychologically alien*.
      *   *Timeline:* Be precise. 90 minutes flies.
      *   *Debrief:* Script the questions to lead them to the philosophical concepts without naming them immediately.

  9.  **Final Polish:** Check tone. Be authoritative but collaborative. Ensure the "Frank Assessment" section is distinct and critical.

  *(Self-Correction on the "Ordering" Problem)*: The user noted: "whether you correct the agent's factual beliefs first and then let her desires settle, or strip out desires that depend on false beliefs before supplying the information."
  I need to make sure the vignette supports this specific distinction.
  *Vignette:* Jordan wants to be a pilot. Jordan believes pilots are always happy (False). Jordan desires happiness.
  *Path A (Belief First):* Tell Jordan pilots are often depressed. Jordan's desire for happiness leads to "Don't be a pilot."
  *Path B (Desire First):* Jordan's desire "Be a pilot" is based on the false belief. Strip that desire. What's left? Jordan loves mechanics. "Be a mechanic."
  *Wait, that converges on "Don't be a pilot."*
  *Need Divergence:*
  *Vignette:* Jordan wants to invest in Company X. Jordan believes X is ethical (False). Jordan desires ethical investment.
  *Path A (Belief First):* X is unethical. Don't invest. (Result: Keep money in bank).
  *Path B (Desire First):* The desire to invest is based on false belief. Remove it. Jordan also has a desire for *growth*. If we remove the ethical constraint (because it was based on error?), no...
  *Let's try the "Phobia" case.*
  *Vignette:* Jordan wants to visit family. Jordan believes flying is dangerous (False). Jordan desires safety.
  *Path A (Belief First):* Flying is safe. Fly. (Result: Visit family).
  *Path B (Desire-First):* Jordan's fear is irrational. Correct the *desire* for safety (it's too high). But wait, if we correct the desire, do we still need the fact?
