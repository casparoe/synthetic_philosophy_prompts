  4. Concealed formal commitments regarding the necessary conditions for consciousness are doing the heavy lifting, causing each camp to apply different evidential standards to the same behavioral data. One side treats independent motor control as proof of separate subjects, while the other views it as modular output within a single agent.
  5. Progress requires a sharper conceptual distinction that dissolves the binary choice by treating unity as a graded, multidimensional property rather than an all-or-nothing ontological status. We must reframe the question away from counting subjects and toward mapping the specific degrees of integration across phenomenal, access, and agential domains.
