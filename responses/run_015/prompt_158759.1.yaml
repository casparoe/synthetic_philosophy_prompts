answer: |-
  This is a remarkably precise phenomenological description of an ethical-aesthetic problem. You have already done most of the philosophical heavy lifting: you have isolated the variable (interpersonal stance), ruled out the standard confounders (consequentialism, aesthetic flaw, genetic fallacy), and identified the mechanism (the breakdown of a specific mode of address).

  Here is the analysis of where this sits in the literature, a proposed conceptual label for the gap you've found, and the boundary testing you requested.

  ### 1. Is there an established concept?

  **Confidence Level:** **Low** that there is a single, canonical term for this *exact* configuration. **High** that the components exist in adjacent literature.

  There is no standard phrase in the philosophical canon (e.g., "The Kantian Ban" or "The Gaut Principle") that captures *specifically* the refusal of interpersonal uptake independent of aesthetic judgment or consequentialist harm. However, your pattern sits at the intersection of three established debates:

  1.  **Ethical Criticism (Ethicism vs. Autonomism):** The debate over whether ethical flaws in an artist or artwork constitute aesthetic flaws. (You have explicitly ruled this out: you agree the record is still good).
  2.  **Complicity/Endorsement Accounts:** The debate over whether consuming art makes one complicit in the artist's harm. (You have ruled this out: no money, no signaling, artists dead).
  3.  **The Second-Personal Standpoint:** A concept from moral philosophy (primarily **Stephen Darwall**) regarding obligations that arise from the relationship between persons (claims, demands, address).

  **The Nearest Neighbor:**
  The closest existing framework is **"Moderate Moralism"** (Noël Carroll) or **"Contextualism"** (Kendall Walton), but these usually focus on how moral knowledge changes our *interpretation* of the work. You are describing something prior to interpretation: a refusal of the *invitation* to interpret.

  The specific mechanism you describe—where the work is treated as a communicative act that fails due to the speaker's lack of moral standing—is best described using Speech Act Theory applied to aesthetics. The record is not just an object; it is an **illocutionary act** (an act of addressing, confiding, or charming). When the artist commits abuse, they do not necessarily damage the *locution* (the sound), but they forfeit the **felicity conditions** required for that specific type of address to be accepted.

  ### 2. Coining the Concept: "The Condition of Second-Personal Uptake"

  Since no single term exists, I propose we classify this as a **Loss of Aesthetic Standing** regarding **Second-Personal Uptake**.

  **Definition:**
  A work suffers a *Loss of Aesthetic Standing* when the moral history of its maker voids the **felicity conditions** required for the specific mode of address the work employs. This is distinct from the work's quality (aesthetic value) and distinct from the consequences of consumption (ethical impact). It tracks solely whether the listener can, in good conscience, accept the *interpersonal stance* the work demands.

  **How it is carved off from the neighbors:**
  *   **Vs. Ethical Criticism:** Ethical criticism says, "This song is bad because the singer was bad." Your view says, "This song is good, but I cannot accept it as a *gift* or *confidence* from him."
  *   **Vs. Complicity:** Complicity says, "Listening helps him." Your view says, "Listening puts *me* in a relationship with him that I no longer endorse."
  *   **Vs. Genetic Fallacy:** The Genetic Fallacy warns against judging the *truth/quality* of a claim by its source. Your view does not judge the claim (the music); it judges the *right of the source to make that specific claim* (intimacy) to you.

  **Why this explains your two artists:**
  *   **The Singer (Dropped):** His work relies on **Second-Personal Intimacy**. He sings *to* you, asking for trust, warmth, or shared vulnerability. The abuse proves he is untrustworthy in exactly the domain the art requires (human intimacy). The "felicity condition" of trust is broken.
  *   **The Bandleader (Kept):** His work relies on **Third-Personal Observation** or **Ensemble Function**. You listen to the *sound*, the arrangement, the groove. The address is not "I trust you," but "Here is a pattern." The moral standing of the conductor is less relevant to the uptake of an abstract pattern than the moral standing of a confessor is to the uptake of a secret.

  ### 3. Classifying the Boundary Cases

  Using the **Condition of Second-Personal Uptake**, here is how we classify your test cases:

  **A. A performance where warmth belongs to a character, not the performer.**
  *   **Verdict:** **Permitted.**
  *   **Reasoning:** The interpersonal address is diegetic (within the fiction). The actor is not saying, "I, the performer, love you." They are saying, "This character loves this other character." The Second-Personal Uptake is directed at the *persona*, which is distinct from the biographical agent. The "felicity condition" attaches to the fictional speaker, who has no moral history.

  **B. A track heard as documentary evidence rather than as a record.**
  *   **Verdict:** **Permitted.** (This matches your documentary clip observation).
  *   **Reasoning:** This changes the **Illocutionary Force**. The clip is no longer functioning as an *invitation to intimacy*; it is functioning as *evidence*. The stance required of the listener is "witness" or "analyst," not "confidant" or "fan." The Condition of Second-Personal Uptake is not triggered because the work is not addressing you personally.

  **C. An artist whose wrongdoing was unknown when made and who died before it was known.**
  *   **Verdict:** **Blocked (if intimacy is required).**
  *   **Reasoning:** Your intuition that "nothing about the recording changed" is key. The block is not about the artist's *intent* (they didn't know they'd be caught); it is about the *listener's capacity to receive*. Even if the artist is dead, the *current* listener cannot extend warmth to a person now known to be abusive. The "standing" is retroactively voided for the current listener. The past innocence of the artist does not cure the present inability of the listener to trust.

  **D. A listener who has never learned the performer's name.**
  *   **Verdict:** **Permitted.**
  *   **Reasoning:** The Condition of Second-Personal Uptake requires a recognized *addresser*. If the listener does not know who is speaking, they cannot evaluate the speaker's standing. They are responding to the *sound*, not the *source*. This confirms your view is not about the work's intrinsic properties (which remain the same) but about the *relational context*.

  **E. A work made collaboratively, where the invitation comes from a group.**
  *   **Verdict:** **Context-Dependent (Diluted).**
  *   **Reasoning:** If the "voice" is an ensemble (like your bandleader), the interpersonal address is diffuse. If one member is abusive, does the whole group lose standing?
      *   *If the work is heard as a collective voice:* The standing is compromised but perhaps not voided (the "trust" is distributed).
      *   *If the work is heard as a soloist with backing:* The soloist's standing dominates.
      *   *Adjustment:* This suggests the "Standing" is proportional to the **identifiability of the addresser**. The more the work focuses attention on a specific individual's charisma, the higher the risk of Standing Loss.

  ### 4. Confidence and Falsification

  **Confidence Calibration:**
  *   **High Confidence:** That your distinction (Interpersonal Stance vs. Aesthetic Value vs. Consequentialism) is philosophically sound and distinct from the three views you rejected. You have correctly identified a gap in the standard "Separate the Art from the Artist" debate.
  *   **Medium Confidence:** That "Loss of Aesthetic Standing" is the best label. It borrows from legal/moral philosophy ("standing to sue," "moral standing") and applies it to aesthetics. It fits, but it is a construction, not a quote from a textbook.
  *   **Low Confidence:** That this explains *all* such refusals. Some refusals may indeed be disguised disgust (Ethicism) or disguised social signaling (Complicity), even if the refuser doesn't feel that way.

  **What would change my verdict (Falsification Conditions):**

  1.  **If the "Intimacy" variable proves to be a proxy for "Disgust":**
      *   *Test:* If you play the "intimate" singer's music but attribute it to a morally neutral fictional name, and the residents *still* feel uneasy once they know the truth, my theory holds. If, however, the residents say, "I can't hear that voice without thinking of violence," then the *sound itself* has become contaminated (Aesthetic Flaw/Ethicism).
      *   *Your Evidence:* You noted the clip in the documentary bothered no one. This supports your theory (the frame changed, the sound didn't). If the sound itself had become "toxic," the clip would have been unbearable.

  2.  **If the "Dead Artist" distinction collapses:**
      *   *Test:* If you found out the bandleader (who you kept) had committed *exactly* the same acts as the singer (who you dropped), but the bandleader's music was *more* intimate (e.g., spoken word poetry vs. instrumental), would you drop him?
      *   *Prediction:* If you drop the bandleader in this scenario, then "Genre/Intimacy" is the true variable, not the specific artist. If you keep him because "he's dead and it's instrumental," then "Consequentialism/Signaling" might be creeping back in (i.e., you feel less responsible for signaling approval of a dead instrumentalist).

  3.  **If the "Interpersonal Uptake" is actually "Self-Protection":**
      *   *Test:* Is the refusal about the *artist's standing* or the *listener's vulnerability*?
      *   *Adjustment:* If the residents say, "Listening to him makes *me* feel unsafe," that is a psychological safety claim, not a philosophical standing claim.
      *   *Your Evidence:* You say they "don't want it played" because of "what listening to it puts them in." This aligns with my "Uptake" theory. They are refusing a *role* (the confidant), not fleeing a *threat*.

  **Conclusion:**
  You are not reasoning illegitimately. You are identifying a **relational constraint on aesthetic consumption**. You are treating the record not as a commodity or a text, but as a **speech act**. When the speaker forfeits the moral standing to speak intimately, the speech act becomes infelicitous—not false, not ugly, but *void*.

  The difference between the singer and the bandleader is not the severity of their sins, but the **degree of intimacy their art demands**. The singer asks for your heart; the bandleader asks for your foot. You can tap your foot for a sinner; you cannot safely give your heart to one. That is not guilt by association; it is boundary maintenance.
