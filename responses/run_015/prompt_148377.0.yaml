      *   *Decision:* It's too complex. It introduces a split between Affective Quality and Motivational Force. For a 35-min intro, keep it binary: Sensory vs. Affective. I will advise *against* using it as a primary driver, but maybe as a "stress test" at the end *if* simplified. Actually, better to advise dropping it to preserve clarity. The "Textbook Asymbolic" is stronger.
