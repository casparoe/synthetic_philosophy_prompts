      *   *Misconceptions:* Address them as they arise.
      *   *Conclusion:* Clinical application.

  6.  **Addressing Misconceptions:**
      *   *1. "Weaker Pain":* Address immediately after the Asymbolia case. They will think "Oh, they just don't feel it as much." Need to emphasize the *sensory* intactness.
