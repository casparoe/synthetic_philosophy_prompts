      *   *Self-Correction on Inference 3:* This is the "Lewontin's Fallacy." High heritability within groups says nothing about causes of differences between groups. If Islanders have better training (environment) than Mainlanders, the gap could be 100% environmental even if heritability is 0.8 within the Island. Since Mira was adopted away, if the Island has a unique environmental trigger for tide-sense (e.g., hearing the ocean in utero), the gap could be environmental. The geneticist should clarify that heritability doesn't explain the *gap*.

      *   *Dialogue Strategy:* The geneticist needs to clarify that the number describes the *population*, not Mira, and doesn't explain the *gap*.
      *   *Drafting the dialogue:* "It tells us about the crowd, Mira, not the person. And it tells us about this crowd, in this place, not the difference between crowds." Something like that.

      *   *Refining the Prose:* Ensure no formatting violations. No bold text. No lists. Just paragraphs.

      *   *Wait, one nuance on Inference 1:* The user says "at most 20% on how much training... could ever have moved her." This implies "reaction norm." While you can't say 80% of her trait is genetic, you *can* say that in *that specific environment*, genetic differences account for 80% of the variance. But you can't say her *individual* potential is capped at 20% environmental influence. If she was raised in a drastically different environment (e.g., sensory deprivation), the trait might not express at all. Heritability is local to the environmental range studied. So the "hard ceiling" idea is also risky.

      *   *Plan:*
          1.  Start by validating the definition line (it's the strongest part).
          2.  Address the individual attribution error (Inference 1).
