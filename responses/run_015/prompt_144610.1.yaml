      *   **Bad news:** Inference 1 (Individual attribution) is the biggest error. You can't partition an individual's trait into % gene/% environment.
      *   **Bad news:** Inference 2 (Identical conditions) is backwards. Standardizing environment increases heritability.
      *   **Bad news:** Inference 3 (Group differences) is a major fallacy. High within-group heritability does not explain between-group differences.
      *   **Bad news:** Heritability is not a constant; it's specific to the population and environment at that time.

  4.  **Drafting the Response (adhering to constraints):**
      *   **Constraint Check:** No bold, no headings, no bullet points, no tables. Continuous prose. Email style.
      *   **Tone:** Friendly, expert but accessible, helpful to a novelist.
