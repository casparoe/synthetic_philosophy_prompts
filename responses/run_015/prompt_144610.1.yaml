      *   **Setup:** Protagonist Mira adopted at birth (island to inland). Trait "tide-sense" has heritability ($h^2$) of 0.8 in the island population. Modeled on height (~0.8).
      *   **Current Understanding (User's Draft):**
          1.  Definition: "the share of the differences between people in a population that comes down to genetic differences." (User is confident here).
          2.  Inference 1: 80% of Mira's *own* tide-sense is caused by genes, 20% by environment. Hard ceiling on training/upbringing.
          3.  Inference 2: If raised in identical conditions, heritability would drop (maybe near zero) because no environmental variation.
