  # The Logical Space of Truthfulness

  Before mapping the positions, we must define the parameters that constitute the logical space. A position on truthfulness is defined by how it answers four structural questions. Note that not all choices are independent; some determine the relevance of others.

  1.  **The Locus of the Wrong:** Is the primary violation located in the **Proposition Asserted** (saying what is false), the **Belief Induced** (causing a false belief), or the **Relationship Sustained** (violating trust or role)?
      *   *Dependency:* If one chooses *Proposition*, the *Success Condition* (below) becomes irrelevant, as the act is complete upon utterance.
  2.  **The Role of Convention:** Do social conventions fix the **Semantic Content** (what is literally said) or only the **Pragmatic Inference** (what is reasonably implied)?
      *   *Dependency:* If conventions fix *Content*, the *Phatic Exchange* ceases to be a candidate for lying.
  3.  **The Success Condition:** Must the hearer **Actually Believe** the falsehood for deception to occur, or is the **Intent to Deceive** sufficient?
      *   *Dependency:* This choice only matters if the *Locus* is *Belief* or *Relationship*.
  4.  **The Normative Source:** Is the prohibition grounded in **Duty** (intrinsic wrong), **Outcome** (consequences), or **Character/Role** (virtue or fit)?
      *   *Dependency:* This determines how conflicts (e.g., the Harmful Inquirer) are resolved.

  **Collapses:** A view that locates the wrong in the *Proposition* cannot consistently hold that *Success* (hearer belief) is required; the lie exists even if disbelieved. A view that holds conventions fix *Content* cannot treat polite falsehoods as lies, regardless of *Normative Source*.

  ***

