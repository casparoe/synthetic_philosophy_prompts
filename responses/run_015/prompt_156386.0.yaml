  # Leaf Analysis

  Each position is defined by its path through the tree. Below are the specific commitments, verdicts on the cross-regime case, and sensitivities required by each leaf.

  ### 1. The Conventionalist
  *   **Awkward Commitment:** Must accept that "I promise" spoken by an actor on stage is not a promise, even if the audience feels bound by it.
  *   **Cross-Regime Verdict:** **Speaker Blameless.** Since conventions fix content, the speaker asserted nothing false relative to their regime; the mismatch is the hearer's interpretive error. The view accepts mismatch is possible.
  *   **Beneficiary Sensitivity:** **Indifferent.** The truth-value is fixed by convention, not by who benefits.

  ### 2. The Rigorist
  *   **Awkward Commitment:** Must allow a murderer to find their victim rather than assert a falsehood, though withholding the location is permitted.
  *   **Cross-Regime Verdict:** **Speaker Blamed.** The speaker asserted a literal falsehood; differing conventions do not excuse the violation of the assertion norm. The view accepts mismatch is possible.
  *   **Beneficiary Sensitivity:** **Indifferent.** Duty binds regardless of whether the lie helps the hearer, speaker, or interaction.

  ### 3. The Assertionist
  *   **Awkward Commitment:** May deliberately construct sentences to induce false beliefs so long as the literal proposition remains true.
  *   **Cross-Regime Verdict:** **Speaker Blameless.** No false assertion was made; the hearer drew an unwarranted inference. The view accepts mismatch is possible.
  *   **Beneficiary Sensitivity:** **Indifferent.** The boundary of lying is syntactic, not consequential.

  ### 4. The Autonomy View
  *   **Awkward Commitment:** Must treat a failed lie to a skeptic as morally equivalent to a successful lie, risking the condemnation of harmless jokes.
  *   **Cross-Regime Verdict:** **Speaker Blamed.** The speaker intended to induce a belief and failed to calibrate to the hearer's interpretive framework, violating the hearer's deliberative agency. The view accepts mismatch is possible.
  *   **Beneficiary Sensitivity:** **Indifferent.** Violating autonomy is wrong even if the hearer benefits from the deception.

  ### 5. The Consequentialist
  *   **Awkward Commitment:** Must lie whenever the calculation of utility favors it, even in trivial matters where truth is expected.
  *   **Cross-Regime Verdict:** **Blame Depends on Outcome.** If the mismatch causes harm, the speaker is blamed; if it smooths interaction, it is permitted. The view accepts mismatch is possible.
  *   **Beneficiary Sensitivity:** **Highly Sensitive.** Verdict flips entirely based on whether the benefit accrues to the hearer, speaker, or smoothness.

  ### 6. The Trust-Erosion View
  *   **Awkward Commitment:** Must tell the truth even when it causes immediate catastrophe, to preserve the abstract stock of social trust.
  *   **Cross-Regime Verdict:** **Speaker Blamed.** Any contribution to communicative noise erodes the shared stock of trust, regardless of intent. The view accepts mismatch is possible.
  *   **Beneficiary Sensitivity:** **Indifferent.** Systemic trust is harmed by deception regardless of who benefits locally.

  ### 7. The Vice-Ethics View
  *   **Awkward Commitment:** Must condemn a well-meaning lie as a corruption of the agent's character, even if no one is harmed.
  *   **Cross-Regime Verdict:** **Speaker Blamed.** The speaker displayed indifference to the reality of the hearer's interpretive framework. The view accepts mismatch is possible.
  *   **Beneficiary Sensitivity:** **Indifferent.** The vice lies in the agent's relationship to truth, not the outcome for the beneficiary.

  ### 8. The Relational View
  *   **Awkward Commitment:** Must admit that truthfulness to a stranger differs in kind from truthfulness to a spouse, denying a universal norm.
  *   **Cross-Regime Verdict:** **Shared Blame.** Truth is co-constituted by the relationship; a mismatch indicates a failure of both parties to establish common ground. The view accepts mismatch is possible.
  *   **Beneficiary Sensitivity:** **Sensitive.** Verdict depends on whether the deception fits the expectations and needs of the specific relationship.

