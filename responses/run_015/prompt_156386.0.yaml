  # Diagnostic Sections

  ### Unoccupied Answer-Combinations
  The logical space permits combinations that no major position occupies.

  1.  **Conventionalist + Consequentialist:**
      *   *Combination:* Conventions fix content (so no lie is spoken in phatic exchange), but outcomes determine rightness.
      *   *Status:* **Incoherent.** If conventions fix content, the act is not a lie. If it is not a lie, a consequentialist calculus on "lying" has no object. One becomes a consequentialist about *implicature*, which collapses into the Autonomy or Relational view.
  2.  **Rigorist + Relational:**
      *   *Combination:* No false assertion is ever permitted, but truthfulness is defined by fit to relation.
      *   *Status:* **Unattractive.** The Rigorist demand is universalist (applies to all assertions), while the Relational view is particularist (applies to roles). Holding both creates a conflict where the universal duty overrides the relational fit, rendering the relational component inert.
  3.  **Trust-Erosion + Skeptic-Success:**
      *   *Combination:* Deception erodes trust, but only if the hearer actually believes the falsehood.
      *   *Status:* **Unexplored.** Trust-erosion views typically focus on the *ecology* of communication (the act of introducing noise), not the *uptake*. Limiting it to successful deception makes it indistinguishable from a harm-based consequentialist view.

  ### Indistinguishable Leaves
  **The Consequentialist (Leaf 5) and The Trust-Erosion View (Leaf 6)** are difficult to separate in low-stakes cases. Both might forbid a white lie if the long-term cost outweighs the short-term gain.

  *   **Separating Question:** *The Catastrophe Case.* "If telling the truth will certainly cause immediate, irreversible death, but lying preserves a global norm of truthfulness, what must you do?"
  *   **Differentiation:** The **Consequentialist** must lie (specific outcome dominates). The **Trust-Erosion** theorist may forbid it (systemic norm dominates). If a theorist answers that the systemic norm *always* outweighs specific death, they are Trust-Erosion. If they admit a threshold where specific harm outweighs systemic trust, they are Consequentialist.
