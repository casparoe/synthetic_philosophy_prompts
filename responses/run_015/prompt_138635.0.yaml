          *   Overall verdict: Who has the better argument?
          *   Critique: What are both parties missing?
      *   **Context:** Regional flood-risk committee, 400-year horizon, storm-surge barrier.
      *   **Core Issue:** Pure Time Preference (PTP) in intergenerational cost-benefit analysis (CBA).

  2.  **Deconstruct the Arguments:**

      *   **Move 1 (Philosopher):** PTP must be zero. Discounting future welfare based on time is "temporal discrimination." Only extinction risk and opportunity cost of capital are valid.
