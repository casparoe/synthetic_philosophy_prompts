      *   *Move 3:* Philosopher. Mirror test/Reciprocity. *Rating:* Clearly Right. *Why:* Logically consistent. If we demand investment from the past, we owe it to the future. Undercuts the Economist's political excuse.
      *   *Move 4:* Economist. Fiduciary duty to current constituents. *Rating:* Partly Right. *Why:* Legally true for a regional committee, but morally insufficient for existential risk (flood barrier). The "parent/child" analogy fails if the parent's negligence kills the child.

