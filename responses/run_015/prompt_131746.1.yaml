      *   **Requirements:**
          1.  Clear bottom line (approve/reject/conditional) with timeline.
          2.  Operational tests for approval (measure performance without scaffolding, ensure representational tools are left behind).
          3.  Address the strongest counter-argument (equity: gains for lowest quartile, reduced anxiety, increased participation).
          4.  Close with an empirical finding that would trigger reversal.
      *   **Pre-drafting:** Think through the cognitive/moral difference between loop competence vs. learner competence, error prevention vs. correction, district aims, and scaffolding nuances (rote vs. reasoning). *Note: The prompt asks me to do this thinking but not turn it in.*
      *   **Tone:** Professional, accessible (translate philosophy to criteria), decisive, nuanced.

  2.  **Pre-Drafting Reflection (Internal Monologue):**
      *   *Competence in Loop vs. Learner:* If the software holds the cognitive load (tracking progress, deciding difficulty, timing hints), the student doesn't develop metacognition. They become responsive to cues they don't understand. Moral issue: Autonomy. We want students to own their thinking, not just react.
      *   *Error Prevention vs. Correction:* Preventing error reduces anxiety (good), but correcting error builds resilience and understanding of *why* something failed (Popperian). If you never fail, you never learn to troubleshoot.
      *   *District Aim:* Is it just test scores (Skinnerian) or educated citizens (Gregorian/Popperian)? Presumably the latter, but pressure is on the former.
      *   *Scaffolding Nuance:* For multiplication tables? Skinnerian is fine. For quadratic equations? Need Gregorian tools (notation, steps) and Popperian testing.
      *   *Equity:* This is the hard part. The kids who benefit most are those currently getting *nothing*. Silence vs. Bad Feedback is the real choice for some. Denying them the platform because it's not "philosophically pure" is elitist. Need to balance access with long-term growth.
      *   *Translation:* Don't use "Skinnerian/Popperian/Gregorian" in the memo. Use "reaction," "hypothesis-testing," "cultural tools." Or explain them simply if needed, but better to use operational language.
      *   *Bottom Line:* Conditional Approval. Don't throw away the gains, but mitigate the risks.
      *   *Tests:* "Cold" assessments (no hints), artifact creation (notes/formulas).
      *   *Reversal Trigger:* If gains disappear when scaffolding is removed.

  3.  **Drafting the Memo:**
      *   *Header:* To, From, Date, Subject.
      *   *Opening:* Acknowledge the pilot success (validate the equity argument).
      *   *The Concern:* Translate the "loop" argument. Competence shouldn't depend on the crutch.
      *   *Recommendation:* Conditional Approval (1-year pilot instead of 3, or conditional renewal). Let's say Approve with Conditions for Year 1, review for 2 & 3.
      *   *Conditions:*
          1.  Independent Assessment (scaffolding off).
          2.  Tool Internalization (students must produce notes/methods).
      *   *Equity:* Acknowledge the minority objection is strong regarding the lowest quartile. Silence is worse than imperfect feedback.
      *   *Closing:* The reversal trigger.

  4.  **Refining and Editing (Checking Constraints):**
      *   *Word Count:* Keep under 800.
      *   *Tone:* Respectful but firm on cognitive principles.
      *   *Framework:* Ensure the Dennett taxonomy informs the logic without jargon overload.
      *   *Specifics:* Grades 6-10 Math.
      *   *Timeline:* Vote in 9 days. Recommendation needs to fit that.

  5.  **Drafting - Section by Section:**
      *   *Subject:* Recommendation on Adaptive Math Platform License.
      *   *Intro:* The pilot data is compelling. Reduced anxiety, increased participation, gains for struggling students. This is significant.
      *   *The Pivot:* However, there is a risk. The system creates a "partnership" where the software does the thinking about *how* to think. We need students who can think alone.
      *   *The Distinction:* There is a difference between getting the right answer with help and knowing how to find it without help. One is performance; the other is learning.
      *   *Recommendation:* Approve for Year 1 only. Renewal for Years 2-3 contingent on specific evidence.
      *   *Conditions:*
          1.  "Unassisted Competency": Periodic tests where hints/adaptivity are disabled. Compare scores.
          2.  "Tool Transfer": Students must maintain math notebooks/logs. Assess the quality of their personal reference tools, not just answers.
      *   *Equity:* The objection regarding the lowest quartile is vital. For students currently experiencing silence, this platform is a lifeline. We cannot deny them immediate support in the name of idealized learning. But we must ensure the lifeline doesn't become a cage.
      *   *Reversal:* If unassisted scores don't match assisted scores.

  6.  **Review against Constraints:**
      *   *Translate Framework:* Instead of "Skinnerian," use "response to feedback." Instead of "Gregorian," use "internalized tools." Instead of "Popperian," use "testing ideas."
      *   *Word Count Check:* Need to be concise.
      *   *Bottom Line:* Clear.
      *   *Operational Tests:* Clear.
      *   *Equity:* Addressed fully.
      *   *Reversal Trigger:* Clear.

  7.  **Final Polish:** Ensure the voice sounds like an advisor—expert but collaborative. Make sure the distinction between "loop competence" and "learner competence" is clear without being abstract.

