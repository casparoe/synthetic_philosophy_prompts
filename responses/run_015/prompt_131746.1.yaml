answer: |-
  **MEMORANDUM**

  **TO:** Instructional Materials and Technology Committee
  **FROM:** External Advisor, Cognitive Science & Education
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation on Adaptive Math Platform License (Grades 6–10)

  **Recommendation**
  I recommend **approving a one-year license** rather than the proposed three-year contract, contingent on meeting specific cognitive independence benchmarks before renewal. This timeline allows us to capture the immediate benefits observed in the pilot while safeguarding against long-term dependency.

  **The Cognitive Stakes**
  The pilot data is undeniable: standardized scores are up, math anxiety is down, and participation is up, particularly among students in the lowest quartile. However, we must distinguish between *performance* and *competence*. The platform creates a feedback loop where the software anticipates errors and intervenes before a student struggles. This produces excellent results while the system is active. The risk is that competence resides in the "student-plus-software" loop rather than in the student.

  Our goal is not merely to produce students who can answer questions when prompted, but students who can generate solutions when alone. There is a critical difference between learning through reinforced responses (reacting to hints) and learning through hypothesis testing (making errors, analyzing them, and correcting them). If the software prevents all errors, it denies students the opportunity to build the resilience and diagnostic skills required for independent problem-solving. We risk creating learners who are highly responsive to cues but unable to initiate action without them.

  **Operational Conditions for Renewal**
  To renew for Years 2 and 3, the district must verify that learning transfers beyond the interface. I propose two mandatory assessments:

  1.  **The "Scaffolding-Off" Test:** Each semester, a random sample of students must complete standardized assessments with the adaptive hints and difficulty adjustments disabled. Renewal is contingent on these scores matching at least 85% of the assisted scores. This ensures the competence is internal, not distributed across the network.
  2.  **The "Tool Transfer" Requirement:** Each unit must require students to produce a physical or digital artifact—a summary sheet, a procedure log, or a diagrammatic guide—that they create themselves. These artifacts must be graded for utility. This ensures students are internalizing cultural tools (notations, methods) rather than just reinforcing dispositions. They must leave the unit holding a tool they can use on paper, without the software.

  **The Equity Imperative**
  I recognize that imposing these conditions risks slowing adoption of a tool that serves our most vulnerable students. The strongest argument for the three-year license is equity. For students in the lowest quartile, the alternative to this platform is not "ideal independent struggle"; it is often silence, confusion, and no feedback at all. The platform provides a lifeline that reduces anxiety and invites participation where there was previously withdrawal. To reject this tool on philosophical grounds would be to privilege the learning styles of the already-advantaged. We cannot deny students immediate support in the name of idealized cognitive development. A one-year approval honors this equity case by getting the tool into students' hands immediately, while the conditions ensure it serves as a bridge to independence rather than a permanent crutch.

  **Reversal Trigger**
  This recommendation should be reversed immediately if mid-year data shows that students using the platform demonstrate *lower* growth in unassisted problem-solving compared to a control group using traditional methods. If the "Scaffolding-Off" scores diverge significantly from assisted scores by more than 15%, the license should be terminated regardless of standardized test gains.

  We must buy tools that build minds, not just tools that boost metrics. A one-year term with strict independence clauses balances the urgent need for equity with the enduring obligation to cultivate independent thinkers.
