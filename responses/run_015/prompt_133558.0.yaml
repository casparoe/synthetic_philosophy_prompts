  3. Lange proposes a central board performing fixed-point iteration on price vectors while managers execute local gradient descent, which translates cleanly computationally but bends by assuming the objective function stays static, leaving no expression for the penalty function enforcing honest gradient reporting.
  4. The residue regarding who eats the loss is not a computational blind spot but a boundary condition on error propagation, revealing that economists are sneaking in a moral claim about property rights disguised as a stability condition.
  5. Running at finite temperature prevents freezing into local minima but relocates Mises's objection by ensuring the shadow prices never converge to equilibrium values, meaning the system optimizes for a drifting target rather than a stable state.
