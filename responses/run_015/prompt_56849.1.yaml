      *   *Best Candidate:* The decoupling of speech from accountability/authorship. Milton cared about the "good book" carrying the "lifeblood of a good mind." Algorithmic feeds disconnect the speaker from the speech.
      *   *Selection:* The algorithmic intermediary that optimizes for engagement rather than truth, coupled with the anonymity/disconnect of authorship. Let's pick the *algorithmic curation* itself—the idea that a non-human agent decides what you see based on profit, not truth or state security.

  7.  **Drafting - Reviewing against Constraints:**
      *   *Commit to answers:* Avoid "He might say..." Use "He would..."
