  8.  **Refining the "Uptake Capture" Analysis:**
      *   If the community supplies the frame, is that an "echo chamber"? The prompt defines echo chamber as "actively taught to distrust." Uptake capture is "read but inverted."
      *   Milton thinks reason is internal. If a community overrides internal reason, that's a form of coercion/idolatry. But would he call it a structural failure? No, he'd call it sin.
      *   *Decision:* He collapses it into individual moral failure. He trusts the "reason but left free." If reason fails, it's the reader's fault, not the environment's.

  9.  **Refining the Demotion/Removal Analysis:**
      *   Milton distinguished between pre-publication licensing (bad) and post-publication punishment (okay for certain crimes).
