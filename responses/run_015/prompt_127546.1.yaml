answer: |-
  **1. Opening positions**

  **Liam:** Look, I get the appeal of consequentialism, but the demandingness objection just sticks. If the right act is the one that maximises good, then I'm morally required to give away my money until I'm barely better off than the people I'm helping. That leaves no room for a life. It turns morality into a full-time job that pays in guilt.

  **Sarah:** I see why it feels that way, but I reckon you're assuming your personal projects have a special weight that consequentialism denies. If a stranger's life is worth more than your holiday, why shouldn't you save them? The theory isn't asking too much; it's just asking you to stop privileging yourself.

  **Liam:** It's not just privileging myself, it's about integrity. If I can't pursue my own goals without checking a moral calculator first, I'm alienated from my own actions. It's crushing.

  **Sarah:** But is it crushing because the theory is wrong, or because we're weirdly attached to the idea that our money is ours to spend? Maybe the objection relies on some hidden assumptions about how moral costs work.

  **2. The budget-model and wellbeing back-and-forth**

  **Liam:** Hidden assumptions? Like what?

  **Sarah:** Like the 'budget model' of moral costs. You're treating obligations like debts that accumulate against your personal wellbeing. Every pound you spend on yourself is a deficit in your moral account. But that only feels crushing if you think wellbeing is just about satisfying your existing preferences.

  **Liam:** Well, isn't it? If I prefer to buy coffee instead of donating to malaria nets, and I don't buy the coffee, I've lost out on wellbeing. That's a cost.

  **Sarah:** Only on a preference-satisfaction view. But suppose wellbeing is objective—about flourishing or virtue. If giving away the money actually makes you flourish more than drinking the coffee, then the 'cost' isn't real. The demandingness objection smuggles in a subjective theory of wellbeing to make consequentialism look expensive.

  **Liam:** That feels like gaslighting. Just because I *should* prefer helping doesn't mean I *do*. The psychological burden is still there. Even if flourishing is objective, it hurts to give up what you want.

  **Sarah:** Fair, but then the problem isn't the theory, it's our psychology. The objection claims consequentialism is too demanding *in principle*. But if you change the theory of wellbeing, the principle changes. If moral action constitutes wellbeing, you aren't losing anything. You're just trading a lower good for a higher one.

  **Liam:** So you're saying the objection only works if we accept that morality is external to wellbeing?

  **Sarah:** Exactly. If morality is part of what makes life go well, the budget doesn't balance the way you think. You're assuming a split between 'what's good for me' and 'what's moral' that a consequentialist might reject.

  **Liam:** But that split feels intuitive. If I have to sacrifice my happiness for the greater good, I'm losing something.

  **Sarah:** You're losing preference satisfaction, sure. But are you losing *wellbeing*? That's the question. The objection pretends it's neutral, but it's loaded.

  **3. Where they land**

  **Liam:** I suppose I can't deny that. If wellbeing isn't about getting what you want, then the 'cost' of morality looks different. But even if I grant that, the psychological weight remains. I might be flourishing, but I'll still feel tired.

  **Sarah:** I'll take that win. If the objection relies on our current psychological limitations rather than a logical flaw in consequentialism, it's not a knockout argument. It's more of a warning about implementation.

  **Liam:** Yeah, alright. So maybe it's not that consequentialism is false, but that it's hard for humans wired for self-interest. I can live with that. It's not a refutation, just a really hard sell.

  **Sarah:** Exactly. And honestly, if the theory saves more lives, maybe a hard sell is worth it. We've moved from 'it's wrong' to 'it's difficult'. That's progress.

  **Liam:** Cheers for that. Still keeping my holiday money though.

  **Sarah:** figured as much.
