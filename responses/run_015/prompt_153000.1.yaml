          *   Creates an asymmetric moral framework.
          *   Locals (insiders/descendants) owe the myth "hermeneutic charity."
          *   Visitors (outsiders) bear only a negative obligation (don't ridicule in commemorative spaces).
          *   Grounded in collective identity, not historical truth (to avoid relativism).
      *   **Essay's Critique:**
          *   This collapses into moral relativism (any harmful ideology could claim protection).
          *   Conclusion: Commemorative ethics and historical denial are inseparable.
      *   **Task:** Perform an "accuracy audit" on three specific points before the user writes a scene:
          1.  Does the view restrict obligations to insiders, or extend a thinner duty to outsiders?
          2.  Is the relativism objection a faithful engagement or a misreading?
          3.  Does the summary conflate the psychological mechanism of the myth with the normative argument about treatment?

  2.  **Deconstruct the Historian's Theory ("Counterfactual Loyalty"):**
      *   *Premise:* Value lies in the *potential* future (the "ethical world that victory would have realized"), not the actual past.
      *   *Implication:* This is inherently subjective and identity-based. It relies on the *descendants'* connection to that potential future.
      *   *Normative Claim:* How should people behave regarding these myths?
      *   *Asymmetry:* The prompt states the essay summarizes the view as "locals owe... visitors bear only a negative obligation."
      *   *Audit Point 1 (Obligations):* If the obligation is grounded in *collective identity* (as the prompt says), then logically, the primary duty falls on those who share that identity. Outsiders don't share the identity, so they can't owe the positive duty of "honor." However, do they owe *nothing*? The summary says "negative obligation not to ridicule." This implies a thinner duty exists for outsiders (respectful silence vs. active endorsement).
      *   *Audit Point 2 (Relativism):* The historian claims grounding in identity *avoids* relativism (presumably because identity is a factual social bond, whereas truth claims are contestable). The critic says this *is* relativism because it shields harmful ideologies based on identity rather than moral content. This is a classic "internal vs. external" critique. Is it a misreading? It depends on whether the historian's theory includes a moral constraint on *which* identities count (e.g., can a genocidal ideology claim "counterfactual loyalty"?). If the theory allows *any* lost cause (including the Confederacy, as listed), the critic has a strong point that it opens the door to moral relativism regarding the *content* of the cause, even if the *structure* is identity-based.
      *   *Audit Point 3 (Mechanism vs. Norm):* The theory explains *why* myths persist (psychological/sociological mechanism: honoring the counterfactual). It also prescribes *how to treat* them (normative: hermeneutic charity). The essay's summary seems to blend these. It says the view "holds that this loyalty generates an asymmetric moral framework." Does the *existence* of the loyalty generate the *obligation*? That's an Is-Ought problem. The critique concludes "commemorative ethics and historical denial are inseparable." This suggests the essay treats the *explanation* of the myth as an *endorsement* of the denial.

  3.  **Drafting the Audit (Iterative Process):**

      *   *Point 1: Obligations (Insiders vs. Outsiders).*
          *   The prompt says the essay summarizes the view as "locals owe... visitors bear only a negative obligation."
          *   *Analysis:* If the ground is "collective identity," outsiders *cannot* owe the positive duty (hermeneutic charity) because they aren't part of the collective. So, the restriction to insiders for the *positive* duty is logical. However, the "negative obligation" for visitors is a *thinner duty to outsiders*. So the answer isn't binary. It's a tiered system.
          *   *Verdict:* The view extends a thinner duty (non-interference/respect) to outsiders, while reserving the thick duty (active interpretation/charity) for insiders. The essay's summary captures this ("negative obligation"), but the user needs to know if this is consistent with the "identity" grounding. Yes, it is. Identity grounds the positive; shared humanity/civility grounds the negative.

      *   *Point 2: Relativism Objection.*
