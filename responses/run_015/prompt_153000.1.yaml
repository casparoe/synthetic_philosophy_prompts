          *   *Analysis:* The historian is talking about *epistemic* relativism (truth claims). The critic is talking about *moral* relativism (value judgments). The critic is engaging faithfully with the *consequences* of the theory, not necessarily misreading the *intent*. However, if the historian argues that identity *limits* the scope (only *legitimate* identities count), the critic ignores that. But given the examples (Confederacy), the historian seems to include morally fraught causes.
