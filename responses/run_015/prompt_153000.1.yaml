      *   *Logic Check:* If obligation is grounded in *collective identity*, outsiders *cannot* have the positive obligation. So the restriction is logical. But do they have *any* obligation? A "negative obligation" (do not harm/ridicule) is usually grounded in universal respect, not collective identity. So the historian's theory might need a secondary ground (universal civility) to account for the outsider duty. If she relies *only* on collective identity, outsiders owe *nothing*. If the essay says she posits a negative obligation, the essay is attributing a hybrid view to her. I need to point this out.

