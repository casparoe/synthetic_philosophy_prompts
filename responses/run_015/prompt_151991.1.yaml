answer: |-
  The solvent smelled like bitter almonds and old dust. Marla leaned over the panel, the magnifying loupe pressed to her eye, watching the grime dissolve into the cotton swab. Beneath the yellowed varnish, the canal water turned from mud to ice. And there, in the lower right corner, uncovered by her scalpel an hour ago: the fragment of a signature. *H. Oost...*

  It wasn't Schaft. It hadn't been Schaft for four decades.

  She sat back, rubbing her neck. The lab was quiet, save for the rhythmic drip of the roof leak into a bucket near the sink. On the table beside her lay a manila folder Ezra had slipped under her door three days ago. Inside were letters between dealers dated 1920, an inventory list from a private collection in Utrecht, a bill of sale. All pristine. All fake. She knew the paper stock was wrong; she knew the ink hadn't oxidized correctly. She also knew Ezra had been right. The brushwork under the overpaint was unmistakably Oosterling.

  Ezra had been right about the art, and wrong about everything else.

  Her phone buzzed. Simon. The Registrar.

  "Have you looked at the provenance files?" Simon asked when she picked up. He didn't say hello.

  "I'm looking at them."

  "And?"

  "And they're impossible, Simon. The letterhead on the dealer correspondence wasn't used until nineteen twenty-four. The sale is dated nineteen twenty-two."

  Silence on the line. Simon knew numbers better than he knew people. "Ezra sent them to the Board yesterday. They're excited. Oosterling at auction is seven figures. Maybe eight. We could fix the roof. We could hire you an assistant."

  "The documents are forged, Simon."

  "We know Ezra has a grudge. He was fired in '98. But what if he's right about the painting? What if the papers are just... supportive?"

  "They're the foundation. Without them, the attribution is just my opinion. With them, it's fact. But they're lies."

  "A painting whose paper trail has been faked is damaged, Marla," Simon said. His voice was flat, tired. "It doesn't matter if the paint is real. If the history is poisoned, the object is toxic. We can't exhibit a lie. We can't sell a lie. If we publish this attribution based on Ezra's paperwork, we lose accreditation. We become the museum that sells forgery."

  "So we call it a Schaft."

  "Then we're hiding a masterpiece in a stairwell."

  "It's not a masterpiece if nobody sees it."

  "That's not your call."

  Marla hung up. She looked at the painting. For forty years, it had hung in the north stairwell. It was the background to a thousand conversations, the thing Arthur the security guard leaned against while eating his sandwich, the thing her father had pointed out to her when she was six because the ice looked like it might crack. It belonged to the city because nobody wanted it.

  She grabbed her coat. She needed to talk to Ezra.

  His shop smelled of glue and sawdust. He was framing a mirror, his hands moving with the precision of a surgeon. He didn't look up when the bell chimed.

  "You knew the dates were wrong," Marla said.

  Ezra set the frame down. He was seventy, his hands spotted with age and chemical burns. "I knew the painting was Oosterling. I saw it in '98, before they kicked me out. I told them. They told me to stick to molding."

  "So you made the papers."

  "I made the path," Ezra said. He wiped his hands on a rag. "The painting was already there. I just built the bridge so someone would walk across it."

  "You burned the bridge behind you, Ezra. Simon says the provenance is toxic. If we use your documents, the museum becomes a joke. If we don't, nobody believes me about the paint."

  "Then don't use the documents."

  "I have to justify the re-attribution. Technical analysis alone isn't enough for Oosterling. He's too big. The market needs a story."

  "The market," Ezra spat. "You think I did this for the market? I did it so they'd have to say my name. So they'd have to say, 'Ezra was right.' Now you're telling me the truth costs too much?"

  "The truth costs the painting," Marla said. "If it's an Oosterling, it goes into climate control. Then it goes on loan to the National. Then the Trustees sell it to pay for the new wing. It leaves the stairwell. It leaves the city."

  Ezra looked at the mirror. "That's not my problem."

  "It's mine."

  Marla left him there. She walked back to the museum, entering through the service door. She took the stairs up to the third floor. Arthur was at his post, polishing the glass of the fire case. He nodded to her.

  "Cold today," he said.

  "Freezing."

  He gestured to the panel hanging on the wall behind him. The gloomy canal, the grey sky. "My grandson likes this one. Says the skater looks like he's about to fall."

  "He might be."

  "Hope he doesn't. We'd miss him." Arthur leaned closer, lowering his voice. "Heard rumors. People in suits looking at it. You making it fancy?"

  "Maybe."

  Arthur frowned. He touched the frame, not the glass. "My wife, she used to work upstairs. She said when they put the Monet in the vault, the light changed in the gallery. Got quieter. Like the room was holding its breath. Don't let them put this one in the dark, Marla. It's been here longer than I have."

  "I know."

  She went to her office and locked the door. On her desk lay the technical report. *Pigment analysis consistent with mid-17th century Dutch palette. Underdrawing style matches Oosterling.* It was true. It was solid.

  Next to it lay Ezra's folder. *Bill of Sale. Correspondence.* It was false. It was solid.

  If she filed the technical report and attached Ezra's documents, the attribution would hold. The value would spike. The painting would be insured, crated, and shipped within the year. The roof would be fixed. The museum would survive. The painting would be safe, preserved in argon gas, seen by experts, owned by a private collector in Zurich.

  If she filed the technical report without the provenance, the attribution would be challenged. It would be labeled "Attributed to Oosterling, disputed." The value would rise, but not enough to trigger the sale clause in the trust. It would stay in the stairwell, but it would be roped off. Climate monitors would be installed. It would become a specimen, not a neighbor.

  If she filed the report as "Willem Schaft," nothing changed. The roof would keep leaking. She would keep working alone. Arthur would keep leaning against the wall. The painting would breathe the same damp air it had breathed for forty years. It would remain theirs.

  She opened the cataloging software. The cursor blinked in the *Artist* field.

  Simon knocked on the door. She didn't answer. He opened it anyway, holding a copy of the draft press release.

  "Marla. The Board meets tomorrow. I need the final attribution for the minutes."

  He saw the open files. He saw the technical report. He saw Ezra's folder.

  "If you file that," Simon said, pointing to the technical report, "without the provenance, we open ourselves to litigation. The estate of Oosterling could claim we're suppressing value. Ezra could sue for recognition."

  "And if I file the provenance?"

  "Then we're complicit in fraud. We know the papers are fake. If we publish them, we're liars. The integrity of the collection is the only thing we have. If we lose that, we're just a gift shop with a lobby."

  "So the record matters more than the object."

  "The record *is* the object," Simon said. "The paint is just chemistry. The history is why it matters. If you let Ezra's lie become the history, you destroy the painting just as much as if you burned it."

  He put the press release on the desk. "Think about what you're conserving, Marla. The wood? Or the truth?"

  He left the door open.

  Marla sat for a long time. The drip from the roof bucket seemed louder now. She thought about Arthur's grandson. She thought about the light changing in the gallery. She thought about Ezra, alone in his shop, waiting for a vindication that would turn to ash in his hands.

  She thought about the definition of her job. *Conservator.* One who preserves.

  She highlighted the text in the *Artist* field. *Willem Schaft.*

  She deleted it.

  She typed: *Hendrik Oosterling.*

  Her fingers hovered over the keyboard. She opened the *Provenance* field. She could attach Ezra's files. She could mark them as "Verified." It would be easy. The market wouldn't check. The Board wouldn't check. Only she would know.

  She opened a new document instead. A confidential memo.

  *To: Director of Collections.*
  *From: Marla Vance, Chief Conservator.*
  *Re: Attribution of Accession 94.02.*

  She typed quickly. *Technical analysis confirms hand of Hendrik Oosterling. Provenance documentation submitted by third party contains anachronisms inconsistent with historical record. Documents are deemed inauthentic.*

  She paused. This would kill the value. Without the papers, the auction houses would hesitate. The Trustees would hesitate. It might stay. But it would be tainted. It would be the Oosterling with the fake papers. It would be a scandal waiting to happen.

  She deleted the second paragraph.

  She typed: *Provenance documentation is inconclusive. Attribution based solely on stylistic and technical analysis.*

  It was a lie. The papers weren't inconclusive; they were fake. But she wasn't publishing the papers. She was burying them.

  She looked at the *Access Status* field. *Public Display.*

  If she marked it *Oosterling*, Insurance would flag it. Climate control would be mandatory.

  She looked at the *Artist* field again. *Hendrik Oosterling.*

  She backspaced.

  She typed: *Circle of Hendrik Oosterling.*

  It was a compromise. It acknowledged the quality without guaranteeing the hand. It lowered the value enough to keep it off the auction block, but high enough to warrant care. It was a technical truth that functioned as a lie.

  No. That was cowardice. That was trying to have both.

  She looked at the photo of the painting on her screen. The grey ice. The lonely skater.

  She deleted *Circle of Hendrik Oosterling.*

  She typed: *Willem Schaft.*

  She saved the file.

  She picked up the technical report and the forged documents. She walked to the shredder in the corner of the lab. She fed the papers in one by one. The machine groaned, chewing the history, chewing the truth, chewing the seven figures that could fix the roof.

  When the bin was full, she emptied it into the black trash bag destined for the municipal incinerator.

  She walked back to her desk and opened the cataloging software. She confirmed the save. *Artist: Willem Schaft.*

  She picked up the phone and called Simon.

  "It's filed," she said.

  "As Oosterling?"

  "As Schaft."

  "Marla, don't do this. You're throwing away—"

  "I'm keeping it here," she said. "The roof will leak. We'll be short-staffed. But Arthur gets to keep his friend."

  "You're damaging the record. You're damaging the art."

  "I'm conserving the object," Marla said. "It's not art if it's in a vault. It's inventory."

  "You're no better than Ezra."

  "No," Marla said. "He wanted to be right. I just want it to stay."

  She hung up. She walked out of the lab, down the hall, and took the stairs to the third floor. The air was colder here, damp with the smell of wet plaster. Arthur was still there. He looked at her, sensing the shift in the air.

  "All done?" he asked.

  Marla looked at the painting. It was just a panel of wood with oil on it. It was a lie now. It was a Schaft. It was safe.

  "All done," she said.

  She reached out and touched the frame, right where Arthur had touched it. The wood was cold. She left her hand there for a moment, feeling the vibration of the building, the traffic outside, the people walking up and down the stairs who would never know what hung above them.

  "Looks like rain," Arthur said.

  "Yeah," Marla said. "Better check the bucket."

  She turned and walked down the stairs, leaving the painting in the gloom, where it belonged.
