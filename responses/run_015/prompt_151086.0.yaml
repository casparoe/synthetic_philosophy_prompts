  I'm doing a 25-minute slot at my hackerspace next week on tangled hierarchies — the Escher Drawing Hands thing, where each hand is drawing the other, and the bit I actually care about: that a tangle like that still has a level that stays unviolated, that not everything gets swept into the loop. Dont explain the idea to me, plan how I explain it. The room will be maybe fifteen self-taught programmers who all know recursion and two of whom have written quines, so I expect them to file this instantly as mutual recursion and miss the point entirely.

  Give me exactly five numbered items, one or two sentences each, no intro and no wrap-up: 1 the idea that has to land first and why the rest depends on it, 2 the single example that should carry the whole thing and what it has to have and lack (I'm tempted by Drawing Hands itself but suspect its too rich to start with), 3 the misconceptions in the order they'll actually form and the exact moment in the sequence to head each off, 4 one question to end on that tells me whether they got the unviolated level or just enjoyed the loop, 5 what I should openly refuse to get into at this level. Per item, mark which bits are uncontroversial about how these structures work and which are your own reading that people who know this material would push back on — don't dress up the contested stuff as settled.
