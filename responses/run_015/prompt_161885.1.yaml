      *   **Context:** The user is arguing with a roommate about Genome Language Models (LLMs for DNA).
      *   **Roommate's Argument:** "DNA is a code" $\rightarrow$ Codons map to amino acids via a lookup table $\rightarrow$ Lookup tables are codes $\rightarrow$ Sequences have meaning like source code $\rightarrow$ Models trained on sequence recover *content/meaning*, not just statistics.
      *   **User's Counter-Argument:** Context matters (e.g., reassigning stop codons). The mapping depends on the cellular machinery, not just the sequence.
      *   **Roommate's Counter-Counter:** That arbitrariness *proves* it's a code (like ASCII), not a law of nature.
      *   **User's Goal:** A "menu" of precise claims hidden behind the slogan "DNA is a code," sorted by where "meaning" lives.
      *   **Specific Questions to Address:**
          1.  Does a code need an interpreter *not* written in the code? (The circularity of DNA encoding its own readers).
          2.  Does arbitrariness separate "code" from "law of nature"?
