prompt: |-
  My roommate does ML and keeps saying "DNA is a code" whenever we argue about genome language models. His move is always the same: codons map onto amino acids by a lookup table, a lookup table is a code, therefore nucelotide sequences have meanings the way a source file has meanings, therefore a model trained on raw sequence isn't just doing statistics, it's recovering content. He also slides between "code", "instructions", and "blueprint" as if they were interchangeable. It feels like the slogan is doing all the work in his argument but I can't say where.

  I tried pushign back with a case: take some stretch of sequence and drop it into a cell where a stop codon has been reassigned to a non-standard amino acid (I think people actually do this?), so the same stretch now gets read as a longer protein. I said this shows the mapping isn't sitting in the sequence at all — it depends on whatever machinery is doing the reading. He said that's exactly what makes it a code: the mapping is arbitrary and conventional, like ASCII rather than like a law of nature, so if anything it proves his point. Now we're stuck and I suspect we're using "code" to mean different things.

  Can you lay out, as a menu, the different precise claims "DNA is a code" could be making — the ones that are trivial or platitudinous, the ones that are substantive and defensible, the ones that are just false — and say for each whether it would actually get him his conclusion about the model? I'd especially like them sorted by where the "meaning" is supposed to live: in the sequence itself, in the sequence plus whatever does the reading, or in whoever designed or selected it. Two things I want specifically addressed: whether a code needs an interpreter that isn't itself written in the code (as far as I can tell the stuff that reads DNA is encoded in DNA, which feels circular but I can't make it bite), and whether the arbitrariness point really separates "code" from "law of nature", or whether he's just helping himself to it. And tell me which reading he's probably actually reaching for when he says it.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

