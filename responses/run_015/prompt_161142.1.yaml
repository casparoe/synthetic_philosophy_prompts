  ### 3. The Discriminating Test Case

  To cleanly tell Rule A (Constraint) from Rule B (Surplus) apart, you need a scenario where the **Kelly Optimal** is *below* the **Safety Limit**. In the current case, Kelly (40%) is *above* the Safety Limit (30%), so both rules might look similar if he just "cuts to the limit." We need to see if he cuts to the *limit* or cuts to the *formula*.

  **The Test:**
  Offer him the exact same setup ($200k liquid, $140k hard floor), but change the bet odds to **55% chance to win** at even money.

  *   **Kelly Fraction:** $0.55 - 0.45 = 0.10$ (10%).
  *   **Safety Limit:** Still 30% ($60k loss max).

  **The Predictions:**
  *   **Rule A (Constraint Maximizer):** He calculates Kelly (10%), sees it is safe (below the 30% wall), and bets the Kelly amount.
      *   **Bet:** **$20,000 (10%)**.
      *   *Why:* He maximizes growth within the safe zone. The wall doesn't bind, so he follows the formula.
  *   **Rule B (Surplus Kelly):** He calculates Kelly (10%) but applies it to his *Surplus* ($60k).
      *   **Bet:** **$6,000 (3% of total)**.
      *   *Why:* He never treats the $140k as riskable capital.

  **Why this discriminates:**
  If he bets $20k, he treats the $140k as a *floor he must not cross*, but the money above it as a single pool. If he bets $6k, he treats the $140k as *dead money* that is psychologically and mathematically segregated from his bankroll. Given his "whole liquid net worth is the bankroll" history in Case 1, I expect him to bet the $20k, but this is the only way to be sure.

  ### Summary
  *   **Competing Rules:** Constrained Global Optimization vs. Surplus-Only Kelly.
  *   **Current Prediction:** 30% ($60k).
  *   **Discriminator:** Lower edge to 55%. If he bets 10% of total, he's a Constrained Optimizer. If he bets 10% of surplus, he's a Surplus Kelly bettor.
