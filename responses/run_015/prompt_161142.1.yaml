  **Rule A: The "Constrained Log-Wealth" Maximizer (The Hard Boundary)**
  *   **The Logic:** Tomas maximizes Expected Log Wealth ($E[\ln(W)]$), consistent with his "geometric mean" dogma. However, the house deposit creates a hard solvency constraint: $W_{final} \ge 140k$. Falling below this is utility $-\infty$ (collapse).
  *   **The Math:** Standard Kelly on a 70% even-money bet is $f^* = p - q = 0.7 - 0.3 = 0.4$ (40%). On $200k, that's an $80k bet.
  *   **The Constraint:** If he bets $80k and loses, he has $120k. This violates the $140k floor.
  *   **The Adjustment:** He cannot bet more than the amount that keeps him solvent in the worst-case scenario. Max Loss = $200k - 140k = 60k$.
  *   **The Precedent:** This aligns with **Case 4** (capped downside). When the structure limited his loss to 5%, he bet the *maximum the structure allowed*. He didn't shrink the bet below the cap; he leveraged up to the edge of the cliff.
  *   **Prediction:** He stakes the maximum safe amount.
      *   **Bet:** $60,000
      *   **Fraction:** **30%**

  **Rule B: The "Subsistence Level" Kelly Bettor (The Surplus Rule)**
  *   **The Logic:** Tomas treats the $140k not just as a boundary, but as a *subsistence level* ($S$). His utility function is effectively $\ln(W - S)$. This is the theoretically consistent way to handle fixed obligations in Kelly theory (often called "Kelly with a floor"). He mentally segments the bankroll into "Risk-Free Capital" ($140k) and "Risk Capital" ($60k).
  *   **The Math:** He applies the Kelly fraction (40%) only to the *surplus* bankroll ($200k - 140k = 60k$).
  *   **The Precedent:** This aligns with **Case 5** (background risk). When external factors threatened his total utility, he "cut the size below what the formula spat out." Treating the deposit as a liability is a form of background risk adjustment.
  *   **Prediction:** He stakes 40% of the surplus.
      *   **Bet:** $24,000 (40% of $60k)
      *   **Fraction:** **12%** (of total liquid)

