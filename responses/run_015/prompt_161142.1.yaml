  3.  **Ideological Purity:** Tomas is "hardcore." The "Surplus" method (Rule B) requires admitting that some money is "too sacred to bet." A pure geometric growth maximizer views all liquid net worth as fuel for the engine, provided the engine doesn't explode. As long as the engine doesn't explode (i.e., he stays above $140k), he pours in the fuel.
  4.  **The One-Shot Nuance:** While Kelly is asymptotic, Tomas's belief that "geometric mean is the only mean" suggests he applies Log Utility even to single shots. For a Log Utility maximizer, if the marginal expected utility is positive at the constraint boundary, you bet up to the boundary.
