prompt: |-
  hey — so I'm a 3rd-year PhD student (ML, mostly preference learning and RLHF-adjacent stuff; my advisor is more theory than empirics) and I've somehow ended up as the token technical person on the advisory board of a small funder. They've got around $2M to spend over three years, and they've decided to spend it on the *conceptual* side of inferring what people want from what they do — IRL, reward inference, preference learning, whatever you want to call it. Explicitly not more benchmarks, not more scaling, and they can't fund compute, so anything that needs a cluster is off the table. Realistically it's about five or six postdoc-years, maybe a couple of senior people part-time, and they want to be able to say at the end that they changed what people think is worth working on, not that they produced twelve papers.

  What I keep going in circles on is what to actually put in the call. Some candidates I've been kicking around:

  - the identifiability stuff. If behavior is generated by something roughly like a boundedly rational agent, the reward is pretty badly underdetermined: lots of rewards fit the same behavior, and whole families of transformations of a reward give identical predictions. So what exactly is the estimand? Is "the human's reward function" even a coherent target, or should we be estimating something else — what they'd choose with better information, what they'd endorse on reflection, some counterfactual-choice target? And how do you decide between those without already knowing the answer?

  - what I've started calling the inference-aware demonstrator problem: once people know their behavior is being used to train a system (labelers, users who've read one news article about algorithms), the behavior starts encoding their *theory of the learner*, not just their preferences. Clicks get partly strategic, partly performed. Is this a real problem for the whole framework, or a measurement annoyance you can design around?

  - whose behavior counts. The machinery is built for a single agent, but deployed systems act for a population, and the people generating the data usually aren't the ones the system's actions land on.

  - misspecification. If the human isn't rational in the way the model assumes, you get a confident, wrong reward, and I don't think anyone has a good story for telling that apart from success.

  I defintely don't want a survey and I really don't want a reading list — I want a defended agenda. Which of these (or something I'm not seeing) should they prioritize, in what order, and on what criteria: how upstream is it of the rest, is it tractable in three years by theorists and philosophers with no compute, is it neglected, and how much downstream practice would actually change if it got answered? Which are overrated, or don't really follow from the setup at all? What evidence over the next couple of years should move things up or down the list? And I'd also like to hear what you'd tell them is a flat-out waste of the money, with the reasoning for killing it.
reasoning: |-
  Here's a thinking process that leads to the suggested agenda:

  1.  **Analyze the User and Context:**
      *   **User:** 3rd-year PhD student in ML (Preference Learning/RLHF). Advisor is theory-heavy.
      *   **Role:** Token technical person on an advisory board for a small funder ($2M over 3 years).
      *   **Funder's Goal:** Conceptual side of inferring wants from behavior (IRL, reward inference, preference learning). *Not* benchmarks, scaling, or compute-heavy.
      *   **Budget/Capacity:** ~5-6 postdoc-years, maybe some senior part-time.
      *   **Success Metric:** Change what people think is worth working on (paradigm shift), *not* paper count.
      *   **User's Request:** A defended agenda. Prioritize topics, order them, define criteria (upstreamness, tractability, neglectedness, downstream impact), identify evidence to watch, and identify what *not* to fund.
      *   **User's Candidates:** Identifiability, Inference-Aware Demonstrator (Goodhart/Strategic behavior), Aggregation/Whose Behavior, Misspecification.

  2.  **Evaluate the Constraints & Opportunities:**
      *   **$2M / 3 years:** This is actually quite lean for "changing the field." It's not enough to spin up a new institute. It's enough for a focused working group or a few very high-leverage fellowships.
      *   **No Compute:** This rules out empirical RLHF papers, large-scale human data collection, or training big models. It forces the work into theory, formalism, philosophy, and small-scale human studies (psych/behavioral econ style).
      *   **"Change what people think":** This implies foundational critique or reframing. It needs to be conceptual leverage.
      *   **Theory/Philosophy Focus:** The team will likely be theorists, philosophers, cognitive scientists.

  3.  **Critique the User's Candidates:**

      *   *Identifiability:* Classic IRL problem. Ng & Russell (2000). Lots of work already. Is there new ground? Yes, specifically regarding *normative* targets (what *should* we infer?). But pure identifiability theory is mathematically dense and might not shift the broader ML community's practice unless tied to a concrete alternative target.
      *   *Inference-Aware Demonstrator (Goodhart/Strategic):* Very relevant. As models get smarter, humans game them. This is "Performative Prediction" meets "Reward Modeling." High leverage, but requires careful framing to avoid just being "robustness."
      *   *Whose Behavior (Aggregation/Politics):* Crucial for deployment. Currently ignored in most IRL papers (assumes single agent). High neglectedness. High downstream impact. Hard to solve formally without social choice theory.
      *   *Misspecification:* The "Realism" problem. Humans aren't Boltzmann rational. If the model is wrong, the inference is garbage. This is arguably the most fundamental technical blocker.

  4.  **Develop the Defended Agenda (The "Core Thesis"):**
      *   *Thesis:* The field is stuck trying to infer a static, individual "reward function" from behavior that is neither static, individual, nor purely preference-driven. The agenda should pivot from "Better Inference of $R$" to "Defining the Object of Inference."
      *   *Priority 1: Misspecification & The Object of Inference (The "What").* If we are inferring the wrong thing (because the model of rationality is wrong), nothing else matters. This subsumes Identifiability.
      *   *Priority 2: Strategic/Inference-Aware Behavior (The "How").* If the data source is corrupted by the existence of the inference mechanism, standard IRL breaks.
      *   *Priority 3: Aggregation/Whose Behavior (The "Who").* Essential for deployment, but relies on 1 & 2 being settled.

  5.  **Drafting the Recommendations (Iterative Refinement):**

      *   *Refining Priority 1 (Misspecification/Target):* Don't just call it "misspecification." Call it "Normative Grounding." The problem isn't just that humans aren't rational; it's that "reward" might not be the right latent variable. Maybe it's "values," "policies," or "commitments." This fits the "conceptual" mandate.
      *   *Refining Priority 2 (Strategic):* Connect this to Mechanism Design. If humans know they are being modeled, we are in a game, not a supervision setting. This is a paradigm shift from "learning from" to "learning with."
      *   *Refining Priority 3 (Aggregation):* Connect to Social Choice. How do we aggregate non-stationary, strategic preferences?
      *   *What to Kill:* Empirical RLHF tuning (no compute), Benchmark creation (explicitly forbidden), Pure Identifiability Math (unless tied to the normative question).

  6.  **Structuring the Response:**
      *   **Executive Summary:** The core pivot.
      *   **The Agenda (Ranked):** 1. Normative Target (Misspecification+Identifiability), 2. Strategic Data (Inference-Aware), 3. Aggregation (Whose Behavior).
      *   **Criteria for Evaluation:** Upstreamness, Tractability (Theory/Phil), Neglectedness, Downstream Impact.
      *   **Evidence to Watch:** What signals success/failure?
      *   **The "Kill List":** What not to fund.
      *   **Tone:** Peer-to-peer, technical but strategic, acknowledging the constraints.

  7.  **Self-Correction/Edge Case Check:**
      *   *Is $2M enough?* It's tight. I need to emphasize *fellowships* or *working groups* rather than full labs.
      *   *Is "Philosophy" too soft?* No, the prompt explicitly says "conceptual side" and the advisor is theory. But it needs to be *formal* philosophy/philosophy of science, not just hand-waving.
      *   *Did I address Identifiability?* Yes, folded into Priority 1. Pure identifiability is solved mathematically; the open question is *which* solution to pick.
      *   *Did I address the "Change minds" goal?* Yes, by framing the agenda as moving from "Inverse Reinforcement Learning" to "Inverse *Normative* Modeling."

  8.  **Final Polish:** Ensure the distinction between "technical misspecification" and "conceptual misspecification" is clear. Emphasize that without compute, the value add is *clarity*, not *performance*. (Self-correction: Make sure to explicitly mention the "Inference-Aware Demonstrator" as a specific mechanism design problem).

  9.  **Final Output Generation:** (Matches the detailed response provided previously.)
answer: |-
  This is a high-leverage position. $2M over three years is not enough to compete with Big Tech on empirical RLHF, but it is exactly enough to fund a "Manhattan Project for Clarity" if you restrict the scope to formal theory, philosophy of agency, and behavioral econ-style experiments.

  If the goal is to **change what people think is worth working on**, you cannot fund incremental improvements to IRL algorithms. You have to fund a critique of the object of inference itself.

  Here is the defended agenda, ranked by upstream leverage and tractability for a theory/philosophy-heavy team with no compute.

  ### The Core Thesis
  **Shift the field from "Inferring the True Reward" to "Defining the Coherent Target."**
  Current RLHF/IRL assumes there is a static, latent $R^*$ that generates behavior, and our job is to recover it despite noise. This is likely false. Humans are non-stationary, context-dependent, and often incoherent. Funding should prioritize work that formalizes *what* we should be inferring if $R^*$ doesn't exist, rather than better ways to infer $R^*$.

  ---

  ### Priority 1: Normative Misspecification (The "What")
  **Merge your "Identifiability" and "Misspecification" points.**
  Pure identifiability (many $R$ explain same $\pi$) is a solved mathematical problem (Ng & Russell, 2000). The open conceptual problem is **Normative Selection**: Given the set of compatible rewards, which one *ought* we to optimize?

  *   **The Problem:** If the human is misspecified (e.g., they are time-inconsistent, have biased beliefs, or are acting under duress), IRL recovers a "reward" that encodes their errors as preferences. Optimizing this harms them.
  *   **The Agenda:** Fund work that treats the human as a *noisy optimizer of a latent normative structure*, not a Boltzmann rational agent. This requires collaboration between ML theorists and philosophers of action/ethics.
      *   *Specific Question:* Can we distinguish "preferences" from "beliefs" and "biases" without assuming perfect rationality? (See: Armstrong & Mindermann's "Occam's Razor" paper, but go deeper).
      *   *Specific Question:* Is the target the "current self's" revealed preference or the "reflective self's" endorsement? How do we formalize "reflection" without infinite regress?
  *   **Why First?** It is maximally upstream. If the target is ill-defined, algorithmic efficiency is irrelevant.
  *   **Tractability:** High for theorists/philosophers. Requires formalism, not GPUs.
  *   **Downstream Impact:** If successful, this kills the standard "RLHF as preference extraction" narrative and forces a shift toward "RLHF as preference *construction* or *coherence*."

  ### Priority 2: The Inference-Aware Demonstrator (The "How")
  **Your "Inference-Aware" point.**
  This is the most time-sensitive and neglected technical problem. As models become ubiquitous, human data becomes strategic.

  *   **The Problem:** Standard IRL assumes the demonstrator's policy $\pi_H$ is independent of the learner's model $M$. In reality, $\pi_H(M)$ is a function of the human's theory of $M$. This creates a feedback loop (Performative Prediction).
  *   **The Agenda:** Frame this as a **Mechanism Design** problem, not a learning problem.
      *   *Specific Question:* Under what conditions does the learning process induce *better* or *worse* human behavior? (e.g., does knowing an AI is watching make me more virtuous or more performative?)
      *   *Specific Question:* Can we design inference procedures that are "strategy-proof" or incentivize honest revelation of preferences?
  *   **Why Second?** It relies on Priority 1 (you need to know what "honest revelation" means), but it is more concrete. It bridges theory and real-world deployment risks.
  *   **Tractability:** Medium. Requires game theory and behavioral experiments (cheap, no clusters).
  *   **Downstream Impact:** Changes how we collect data. Moves the field from "scrape everything" to "design interactions that elicit robust signals."

  ### Priority 3: Aggregation and Whose Behavior (The "Who")
  **Your "Whose Behavior" point.**
  This is social choice theory applied to RLHF.

  *   **The Problem:** IRL assumes a single agent. Deployed systems serve populations. Aggregating preferences is not just averaging reward functions (impossible due to identifiability + Arrow's Impossibility).
  *   **The Agenda:** Formalize "Population Reward Inference."
      *   *Specific Question:* How do we infer a collective objective when subgroups have incommensurable preferences and different levels of power/visibility in the dataset?
      *   *Specific Question:* How do we handle "externalities"? (The data comes from users, the harm lands on non-users).
  *   **Why Third?** It is downstream of 1 and 2. You can't aggregate rewards if you don't know what a reward is (Priority 1) or if the data is strategic (Priority 2).
  *   **Tractability:** Low/Medium. Social choice is hard. But highly neglected in ML.
  *   **Downstream Impact:** Essential for policy and governance. Less likely to change core ML training loops immediately, but critical for the "conceptual change" goal regarding safety/deployment.

  ---

  ### Criteria for Evaluation
  Use this rubric to evaluate proposals:

  1.  **Upstreamness:** Does this question invalidate current assumptions if answered? (Priority 1 is highest).
  2.  **Compute-Independence:** Can this be done with whiteboards, Python scripts, and Mechanical Turk? (If they ask for A100s, reject).
  3.  **Interdisciplinary Rigor:** Does this actually engage with the philosophy/psych/econ literature, or is it ML people reinventing wheels? (Look for citations of Sen, Binmore, Davidson, not just Sutton & Barto).
  4.  **Falsifiability:** Can we tell if they are wrong? (Avoid purely semantic debates).

  ### Evidence to Watch (Success/Failure Signals)
  Over the next 2-3 years, track these signals to adjust the portfolio:

  *   **Move Up Priority 1 if:** Major labs start publicly admitting RLHF is "hacking preferences" rather than "aligning values." (This is already happening; lean in).
  *   **Move Up Priority 2 if:** We see public incidents of "model-induced behavior change" (e.g., users changing how they write prompts specifically to game the classifier).
  *   **Move Down Priority 3 if:** The field consolidates around "constitutional AI" or rule-based filtering that bypasses the need for preference aggregation (though this is unlikely to solve the whole problem).
  *   **Kill Switch:** If the funded theorists produce only "impossibility results" without proposing alternative frameworks. We need constructive critique, not just nihilism.

  ---

  ### The "Kill List" (What not to fund)
  Be ruthless here. $2M burns fast if you fund standard ML research.

  1.  **Standard Benchmarking:** "A new dataset for preference learning."
      *   *Reasoning:* Explicitly against funder goals. Also, datasets without compute are useless for training, and small datasets don't generalize.
  2.  **Algorithmic Tweaks:** "A more sample-efficient PPO variant for human feedback."
      *   *Reasoning:* This is engineering, not conceptual. It requires compute to validate. It doesn't change how people *think*, just how they code.
  3.  **Pure Identifiability Math:** "Proving tighter bounds on reward ambiguity for MDPs."
      *   *Reasoning:* Unless tied to the *Normative* question (Priority 1), this is just math gymnastics. We know rewards are unidentifiable. We need to know what to do about it.
  4.  **"Explainable Reward Models":** "Visualizing what the reward function learned."
      *   *Reasoning:* If the reward function is misspecified (Priority 1), explaining it just helps you understand the error better. It doesn't fix the target.

  ### Summary Recommendation for the Board
  **Fund a "Working Group on the Foundations of Preference Inference."**
  Don't just hand out fellowships. Create a structured cohort of 3 postdocs (1 ML Theory, 1 Formal Philosophy, 1 Behavioral Econ) + 2 Senior PIs. Mandate that they co-author. Force the ML person to read Davidson on action theory; force the Philosopher to read about partial observability.

  **The Pitch:** "We are currently building skyscrapers on swampy ground. We don't need better cranes (compute/algorithms); we need to know if the ground can hold the weight (conceptual foundations). This fund will produce the maps that tell the rest of the field where the solid ground is."

  This approach respects the budget, leverages the "no compute" constraint as a feature (forcing theory), and aims directly at the "change minds" metric.
