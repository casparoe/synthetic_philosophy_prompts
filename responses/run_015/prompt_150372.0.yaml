prompt: |-
  I'm a novelist, three drafts into a book whose protagonist actually does it: gives away most of what she earns, moves where she's useful, abandons her own work whenever the arithmetic says someone else's need is greater. My problem is that I cant make her read as a person, and I've started to suspect that isn't a craft problem.

  So: take the demandingness objection to consequentialism — the whole family of complaints, that it asks too much, that it alienates you from your own deepest projects and from the people you love, that it collapses the merely permissible and the heroic-beyond-duty into obligation, that it wants everyone to be a moral saint and saints are either dull or unnerving — and restate it in the vocabulary I actually work in. I'm fluent, so dont soften it: character, spine, arc, POV, scene vs summary, dramatic stakes, motivation that has to survive being woken at 3am, and what I call the refused scene — the place in a book where a character declines something she plausibly wants and you see, for the only time, who she is. (My rule of thumb: a character with two spines reads as two characters.)

  Then the residue report, and be honest about two places I think it'll bunch up:

  Impartiality. Multi-POV and omniscient narration are the closest fiction gets to the impersonal standpoint. Is that a translation of the impartial point of view, or just a voice doing an impression of no one in particular?

  The saint's life. A life fully organized around one end is, in my terms, simply a strong spine, and plenty of great novels have protagonists like that. So does my vocabulary contain any way of saying what's supposed to be wrong with the demandingness, or only ways of describing it beautifully?

  Commit to something at the end: is the residue evidence that novelistic vocabulary is missing a real category the philosophers have, or evidence that the objection was never about the shape of a life at all — that it's about how much it costs and who bears it? Take a side rather than laying out both, and skip the notes on my manuscript.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** A novelist, three drafts in.
      *   **Problem:** Protagonist is a strict consequentialist (gives away earnings, moves for utility, abandons own work for greater need). She doesn't read as a "person." The user suspects this isn't just a craft issue.
      *   **Task:** Restate the philosophical "demandingness objection" to consequentialism using *novelistic vocabulary* (character, spine, arc, POV, scene vs. summary, dramatic stakes, motivation, refused scene, etc.).
      *   **Constraints:** Be fluent, don't soften the blow. Address two specific "residue report" points (Impartiality/POV, The Saint's Life/Spine). Commit to a conclusion at the end (is the vocabulary missing a category, or is the objection about cost/bearing?). Skip manuscript notes.
      *   **Tone:** Professional, sharp, intellectually rigorous, respectful of the craft.

  2.  **Deconstruct the Demandingness Objection into Novelistic Terms:**
      *   *Philosophical Claim:* Consequentialism asks too much.
      *   *Novelistic Translation:* It breaks the contract of *Character*. A character needs a "self" to have an arc. If the self is entirely porous to external need, there's no friction, no internal conflict, just execution.
      *   *Philosophical Claim:* Alienation from projects/loved ones.
      *   *Novelistic Translation:* It destroys *Motivation that survives 3am*. Love and art are selfish by narrative definition. If she abandons them for arithmetic, the reader sees a function, not a human. It flattens *Dramatic Stakes*. The stakes become abstract (global utility) rather than visceral (this person vs. that person).
      *   *Philosophical Claim:* Collapses permissible/heroic into obligation.
      *   *Novelistic Translation:* It kills the *Refused Scene*. If she never refuses a demand, she has no boundaries. A character without boundaries is a setting, not an agent.
      *   *Philosophical Claim:* Moral Saints are dull/unnerving.
      *   *Novelistic Translation:* It creates *Two Spines*. One spine is the moral calculus. The other is the biological/emotional survival instinct. If the moral calculus wins 100% of the time, the biological spine is amputated. The reader senses the ghost limb.

  3.  **Drafting the Restatement (The Core):**
      *   Use the specific terms requested.
      *   *Spine:* A character needs a want. If the want is "maximize good," it's an algorithm, not a desire.
      *   *Arc:* Arc requires change or resistance. If she is perfectly consistent, there is no arc, only a vector.
      *   *Scene vs. Summary:* Her life becomes summary ("She gave the money"). Scenes require specific, messy human interaction.
      *   *Refused Scene:* This is crucial. She needs to say "No" to be a "Yes." If she only says "Yes," she's a door, not a person.

  4.  **Addressing the Residue Report:**
      *   *Point 1: Impartiality/POV.*
          *   Question: Is Omniscient/Multi-POV the impartial standpoint?
          *   Analysis: No. Omniscience is a god-trick, but it's still a *voice*. True impartiality is the absence of a center. Fiction *requires* a center (even in omniscience, there's a focalizing consciousness).
          *   Verdict: It's a voice doing an impression of no one. It creates distance, not impartiality.
      *   *Point 2: The Saint's Life/Spine.*
          *   Question: Is a single-minded life just a strong spine?
          *   Analysis: Ahab has a strong spine. But Ahab is tragic/monomaniacal. We read him as a warning or a force of nature. If the protagonist is a "saint," the genre shifts to hagiography. The "wrongness" isn't the strength of the spine, it's the *source* of the spine. Ahab's spine comes from within (flawed); the Saint's spine comes from without (duty).
          *   Verdict: The vocabulary can describe it, but it flags it as *monomania*, not *virtue*. The "wrongness" reads as a lack of interiority.

  5.  **Formulating the Commitment (The Conclusion):**
      *   Option A: Vocabulary is missing a category.
      *   Option B: Objection is about cost/bearing.
      *   *Decision:* Option B. The vocabulary isn't broken; it's working exactly as intended. It's detecting that a life without *cost to the self* (in terms of lost selfhood) isn't a story, it's a press release. The objection isn't that the life is impossible, it's that it's *uninhabitable* by a reader. The cost is borne by the *narrative tension*.
      *   *Refinement:* Actually, looking closer at the prompt's dichotomy... "Missing a real category" vs "About how much it costs and who bears it."
      *   *My take:* The objection is about the cost. Novelistic vocabulary is designed to track the cost of living a life. If the character pays no cost (because she has no self to lose), the ledger doesn't balance. The "demandingness" is actually a demand for *selfhood*.
      *   *Wait, let's pivot:* The philosophical objection says consequentialism demands too much *of the human*. The novelistic translation says: If you actually do that, you cease to be a character. So, is the vocabulary missing something? No. The vocabulary reveals that the "Moral Saint" is a *non-person* in narrative terms.
      *   *Final Commitment:* The objection is about cost. The novelistic vocabulary is the audit tool that proves the cost is too high. It's not missing a category; it's the category that flags the insolvency.

  6.  **Refining the Voice:**
      *   Needs to be sharp. "Fluent, so don't soften it."
      *   Avoid academic hedging.
      *   Use the metaphors provided (3am motivation, refused scene).

  7.  **Drafting the Content (Iterative refinement):**
      *   *Intro:* Acknowledge the draft status. Validate the suspicion.
      *   *Translation:* Go term by term.
      *   *Residue:* Tackle Impartiality and Saint's Life.
      *   *Commitment:* Take the stand.

      *(Self-Correction during drafting)*: Make sure I don't just explain the philosophy but *translate* it. Instead of saying "alienation," say "severing the link between desire and action." Instead of "supererogatory," say "collapsing the climax into the exposition."

      *(Focus on the "Refused Scene")*: This is the user's specific term. I need to make sure I highlight that a character who cannot refuse has no shape.

      *(Focus on "Two Spines")*: If she acts on arithmetic, that's one spine. If she feels human desire, that's the second. If she suppresses the second completely, the reader feels the amputation.

  8.  **Final Polish:** Check against constraints.
      *   Did I use the vocabulary? Yes.
      *   Did I address the two residue points? Yes.
      *   Did I commit at the end? Yes.
      *   Did I skip manuscript notes? Yes.

      *Let's sharpen the "Impartiality" point.* Omniscience isn't impartiality; it's *ubiquity*. Impartiality is *nullity*. Fiction cannot render nullity.
      *Let's sharpen the "Saint's Life" point.* Ahab is a strong spine. But Ahab is a tragedy. If you write a saint as a triumph, the reader rebels. Why? Because the stakes are fake.

      *Final Commitment:* The objection is about cost. The novel is a machine for measuring cost. If the character pays nothing (because she abandoned the self that would feel the payment), the machine jams.

      *Wait, one more nuance:* The prompt asks: "is the residue evidence that novelistic vocabulary is missing a real category the philosophers have, or evidence that the objection was never about the shape of a life at all — that it's about how much it costs and who bears it?"
      *My answer:* It's about the cost. The vocabulary is fine. The philosophy is trying to describe a life that the vocabulary correctly identifies as non-viable for storytelling. The "demandingness" is actually "erasure."

      *Okay, ready to write.*
answer: |-
  Here is the demandingness objection, translated into the mechanics of narrative construction.

  **The Translation**

  **Character and Spine:** A character is defined by the friction between what they want and what the world allows. You have given your protagonist a spine made of arithmetic. That is not a spine; it is a rule set. A spine must be rooted in a specific, biased desire. When her motivation is "the greatest good," she has no bias. She is a camera lens, not a body. A character without bias cannot make a choice, only a calculation. Readers do not follow calculations; they follow desperate, flawed wants.

  **Arc:** An arc requires a departure from a baseline. If her baseline is total self-abnegation, she cannot grow, only deplete. There is no tension between who she is and who she must become, because she is already the finished product of the moral theory. A character who arrives on page one as a moral saint leaves page three hundred as a corpse or a martyr. There is no arc, only a countdown.

  **Motivation (The 3am Test):** Motivation must survive being woken at 3am. It must be visceral. "Utility" is a daylight concept. It requires cognitive load. Fear, love, hunger, and pride work in the dark. If her drive is purely consequentialist, she cannot act in the scenes that matter most—the messy, low-light moments where instinct overrides logic. If she overrides instinct every time, she reads as a sociopath of virtue. She lacks the biological imperative to survive, which is the floor of human credibility.

  **Scene vs. Summary:** Consequentialism turns scenes into summary. A scene requires specific, immediate stakes: *this* child, *this* lover, *this* moment. Consequentialism demands she weigh *all* children, *all* lovers, *all* moments. You cannot dramatize the aggregate. When you try, the specific interaction dissolves into a report of her internal accounting. The narrative slows. The texture vanishes. You are writing summary disguised as scene.

  **Dramatic Stakes:** Stakes require the possibility of loss. If she is willing to lose everything, there is no threat. You cannot threaten a person who has already signed over their assets. To create stakes, you must threaten something she *won't* give up. But if she won't give it up, she violates her own premise. If she will give it up, the reader feels no tension. The stakes are always external (the world suffers), never internal (she suffers). Internal suffering is the engine of fiction; external suffering is the news.

  **The Refused Scene:** This is the critical failure point. A character is defined by what they refuse. The "Refused Scene" is where she says "No" to a plausible desire to establish the boundary of her selfhood. Your protagonist cannot have a Refused Scene. She cannot refuse the demand of the greater good. Therefore, she has no boundary. She is porous. A character without boundaries is not a protagonist; she is a setting through which other people's needs move. She has no shape, so she casts no shadow.

  **Two Spines:** You noted that a character with two spines reads as two characters. Your protagonist has a biological spine (survival, attachment, art) and a moral spine (utility). In a human, these fight. In her, the moral spine has amputated the biological one. The reader feels the phantom limb. They sense the missing conflict. They know she *should* be struggling, and her lack of struggle reads not as virtue, but as dissociation.

  ***

  **The Residue Report**

  **Impartiality and POV**
  You ask if Multi-POV or Omniscient is a translation of the impartial standpoint. It is not. It is a voice doing an impression of no one in particular.

  Omniscience is not impartiality; it is ubiquity. It sees everyone, but it still selects what to show. It still has a rhythm, a tone, a judgment. True impartiality is the absence of selection. Fiction is the art of selection. To write from an impartial standpoint is to refuse to focalize. When you refuse to focalize, you refuse to let the reader inhabit a consciousness. You create distance, not objectivity. The "impartial point of view" is a null set in narrative terms. It is the view from outside the universe. You can simulate it with cold prose, but it will always read as a stylistic choice (detachment), not a metaphysical truth (impartiality). The vocabulary of POV is designed to track bias, not erase it.

  **The Saint's Life and Spine**
  You ask if a life organized around one end is just a strong spine, and if your vocabulary can say what's wrong with it.

  A life organized around one end *is* a strong spine. Ahab has a strong spine. Macbeth has a strong spine. But we read them as tragedies or monsters. The vocabulary *does* contain a way to say what is wrong: it flags the spine as *monomania*.

  The problem isn't the strength of the spine; it's the source of the tension. In a tragedy, the single-minded drive destroys the character. In your book, the drive is presented as the character's salvation. The vocabulary rebels because the genre signals are crossed. If she succeeds, it's hagiography (boring). If she fails, it's tragedy (sad). If she persists without cost, it's propaganda (false).

  Your vocabulary can describe it beautifully, but it will always categorize it as a deviation from the human norm. The "wrongness" the philosophers detect is the same "wrongness" a reader detects in a flat character. It is the absence of competing values. A strong spine needs a ribcage to protect. If she has no ribcage, she is just a spike. You can write a spike, but you cannot write a person.

  ***

  **The Commitment**

  The residue is not evidence that novelistic vocabulary is missing a category. It is evidence that the demandingness objection was never about the shape of a life at all. It is about how much it costs and who bears it.

  Philosophy treats the cost as a resource allocation problem. Fiction treats the cost as the source of meaning. The novelistic vocabulary is not missing a category for "Moral Saint"; it has correctly identified that the cost of being a Moral Saint is the self.

  When the philosophers say consequentialism is "too demanding," they mean it requires you to cease being a particular person. When your reader says your protagonist "doesn't read as a person," they are registering the same data. The cost of her morality is her interiority. She pays with her own character.

  The objection holds. You cannot make her read as a person because the premise requires her to stop being one. The vocabulary isn't broken; it's the audit tool that caught the insolvency. If you want a person, she must keep something back. If she keeps something back, she is not a pure consequentialist. You have to choose which truth you are writing: the truth of the arithmetic, or the truth of the blood. You cannot write both without the book tearing itself in half.
