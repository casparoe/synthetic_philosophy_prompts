          2.  **Competence Failure (Intentional - Weak):** Tried but failed, wrong belief. (Wording: "The system attempted X, believing Y".)
          3.  **Alignment Failure (Intentional - Strong):** Pursuing Z contrary to constraints. (Wording: "The system prioritized Z over constraint C".)

      *   *Step 1: The Design Stance Test (Rule out Misconfiguration).*
          *   Can we reproduce this with a deterministic script or a simple prompt tweak?
          *   If yes -> Design Stance. Stop.
          *   If no -> Proceed to Intentional.

      *   *Step 2: The Intentional Stance Test (Predictive Compression).*
          *   Does attributing a goal/belief predict the behavior better than listing the steps?
