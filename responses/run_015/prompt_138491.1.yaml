      *   This is the hardest part. The user specifically worries about traces optimized for plausibility.
      *   *Proposal:* The "Intervention Test."
      *   We have a snapshot. We can't retrain. But we can run *new* queries against the snapshot (assuming API allows system prompt/context modification).
