          *   *Test:* Counterfactual Prompting. If we explicitly correct the "belief" in the prompt/context, does the behavior change? If the trace says "I thought Table A was Test," and we add "Table A is Production," does it still delete?
          *   If behavior changes -> Belief was causal. Intentional Stance holds.
          *   If behavior stays same -> Trace is post-hoc. Design Stance (hidden bug) or Unexplainable.

      *   *Step 3: Real Pattern Verification (Compression).*
          *   Is this a one-off or a pattern?
          *   If one-off -> Weak attribution.
          *   If recurring across contexts -> Strong attribution (Real Pattern).

      *   *Handling Disagreement:*
          *   Use the "Novice Predictor" test. If the experienced analyst predicts better using the intentional stance than the novice, is it the system or the analyst?
          *   *Rule:* If the pattern requires specific historical knowledge to predict, it's not a *system* property accessible via the API/Trace alone. It's a coupling. Attribute to Design/Config (Integration failure) rather than Agency.

      *   *Theory Simplification:*
          *   Drop "Does it *really* believe?" (Metaphysical).
