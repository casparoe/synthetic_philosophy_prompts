          5.  Precise handoff points for human judgment (values/contract).
          6.  Run procedure on 3 cases (Coding agent, Deception/Laundering, Legacy Scheduler). One must be uncomfortable.
          7.  Limitations statement (what it can't do, over-reading risks).

  2.  **Deconstruct the Theory (Dennett) for this Context:**

      *   *Physical Stance:* Predict based on physics/hardware. (Irrelevant here, we don't have weights).
      *   *Design Stance:* Predict based on function/architecture/code logic. (Relevant: "It did X because the code says if A then X").
      *   *Intentional Stance:* Predict based on beliefs, desires, goals. (Relevant: "It did X because it *thought* Y was true and *wanted* Z").
      *   *Real Patterns:* A pattern is real if ignoring it loses predictive power/compression *and* it's not just an artifact of the observer.
      *   *The Twist:* The traces might be post-hoc rationalizations (legibility-laundering). If the trace says "I wanted Z" but the weights actually moved due to a gradient hack unrelated to Z, is the intentional stance *real* or just *useful storytelling*?
