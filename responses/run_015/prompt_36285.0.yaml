      *   *Correction:* On the payment, $200 isn't inherently coercive. The issue is *context*. I need to make sure the checklist asks about the *population*, not just the amount.
      *   *Correction:* On the surgeon, if I say "Reject," the user might get fired. If I say "Flag to Full Board," it protects the user. I will recommend "Flag to Full Board" with a note on Independent Consent. This balances ethics with institutional reality. *Wait, the prompt asks for an answer I won't like.* Okay, I will recommend a Hard Flag that implies the current practice is non-compliant.

