prompt: |-
  I work as the sole human-consent reviewer for a mid-sized university's research ethics board — mostly psychology experiments, some medical studies, maybe 30 protocols a month, and I have maybe 20 minutes per protocol before I have to flag it, pass it, or kick it to the full board. The board's written guidance basically just says consent must be "voluntary, informed, and competent," which is fine as a principle but useless to me on a Tuesday afternoon when I'm staring at a stack of applications. What I want is an actual procedure I can run: the checks in order, what a passing answer looks like for each, where the procedure ends in an automatic flag to the full board, and — this is the part our guidance never admits — where a check can't be settled by procedure at all and I just have to make a judgment call and say so.

  The philosophical stuff I half-remember from a bioethics course years ago (validity conditions like adequate disclosure, competence, absence of coercion or manipulation, and whatever the difference is supposed to be between invalidating a consent and merely making it regrettable) should be in there, but translated into questions a non-philosopher like me can ask of a protocol. I especially want the procedure to handle the fuzzy middle cases, because those are exactly the ones I keep agonizing over: a psychology study that uses deception and only reveals it in a debrief afterward (can consent given in advance cover being lied to?); a study paying $200 for a few hours of mildly unpleasant tasks, which I suspect is fine for students but maybe coercive for people in real financial need; and a surgeon recruiting her own patients into her clinical trial, where the person obtaining consent has authority over the participant's future care. If your procedure could also tell me what to do about an elderly participant whose daughter answers all the screening questions "for" her, that would help, because right now I have no idea whether that's a competence problem or a coercion problem or neither.

  Please run the finished procedure on those cases and show me the output — including at least one where it gives me an answer I won't like (I'm thinking of the surgeon one, since we've never rejected anything from that department and I doubt the board will thank me). And be blunt about where the procedure will misfire or where two reasonable reviewers following it could come out differently, since the whole point is that I stop pretending my gut instinct is a checklist.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User Role:** Sole human-consent reviewer for a mid-sized university REB (Research Ethics Board).
      *   **Workload:** ~30 protocols/month, ~20 mins/protocol.
      *   **Problem:** Existing guidance ("voluntary, informed, competent") is too abstract. Needs a concrete *procedure* (checklist + decision tree).
      *   **Specific Needs:**
          *   Ordered checks.
          *   Pass/Fail criteria for each.
          *   Automatic flags for Full Board review.
          *   Explicit identification of "Judgment Call" zones (where procedure fails).
          *   Integration of bioethical principles (disclosure, competence, coercion, validity vs. regret).
          *   Application to specific "fuzzy" cases: Deception, High Payment/Financial Need, Therapeutic Misconception/Authority (Surgeon), Proxy/Competence (Elderly/Daughter).
          *   **Crucial Constraint:** Be blunt about where the procedure misfires or allows disagreement. Show an output the user "won't like" (likely the surgeon case).

  2.  **Deconstruct the Ethical Principles into Operational Checks:**
      *   *Informed:* Disclosure, comprehension, truthfulness.
      *   *Voluntary:* Coercion, undue influence, power dynamics.
      *   *Competent:* Capacity, understanding, proxy rules.
      *   *Validity:* Does the consent actually authorize the specific risks?

  3.  **Drafting the Procedure (The "Consent Triage Protocol" - CTP):**
      *   Need a flow that fits a 20-minute window.
      *   Step 1: Documentation (Is the form readable?).
      *   Step 2: Competence/Capacity (Who is consenting?).
      *   Step 3: Information/Disclosure (What do they know?).
      *   Step 4: Voluntariness (Are they free to say no?).
      *   Step 5: The "Veto" Points (Automatic Full Board triggers).
      *   Step 6: The "Gray Zone" (Judgment calls).

  4.  **Addressing the Specific Cases:**
      *   *Deception:* Valid consent requires truth, but some research requires deception. *Resolution:* Waiver of informed consent + Debrief plan.
      *   *Payment:* $200 for students vs. needy. *Resolution:* Undue inducement check. Is it coercive *for the vulnerable*?
      *   *Surgeon/Patient:* Power imbalance. *Resolution:* Independent consent taker required.
      *   *Elderly/Daughter:* Capacity vs. Proxy. *Resolution:* Assess capacity first. If capable, daughter answering is coercion. If incapable, daughter needs legal proxy status.

  5.  **Refining the "Blunt Truths":**
      *   The user wants honesty about where the checklist fails.
      *   *Key Insight:* Ethics isn't math. Two reviewers *will* disagree on "undue inducement" or "sufficient debriefing."
      *   *Key Insight:* The "Surgeon" case is a structural conflict of interest that a consent form can't fix.

  6.  **Developing the Output Format:**
      *   Introduction: Acknowledge the burden.
      *   The Protocol (CTP-v1): Step-by-step.
      *   Case Studies: Running the protocol on the four scenarios.
      *   The "Failure Modes": Where the protocol breaks.

  7.  **Drafting the Content - Section by Section:**

      *   *Intro:* Validate the user's struggle. 20 minutes is tight. Principles need translation.
      *   *The Protocol:* Break it down into "Hard Stops" (Automatic Full Board) and "Reviewer Discretion" (Pass/Fail/Modify).
      *   *Case 1 (Deception):* Protocol should flag this for Full Board or require specific waiver justification. *Decision:* Full Board or Senior Reviewer approval needed because it violates "Informed."
      *   *Case 2 (Payment):* Protocol checks "Undue Inducement." *Decision:* Pass for general, but flag if recruitment targets vulnerable populations.
      *   *Case 3 (Surgeon):* This is the one the user "won't like." The protocol *must* flag this as a conflict of interest. Independent consent is standard best practice. If the university allows it, the protocol reveals the university's ethical laxity. I need to be firm here: *Fail/Flag.*
      *   *Case 4 (Elderly):* Protocol checks Capacity. *Decision:* If capable, daughter answering = Coercion (Fail). If incapable, need legal proxy docs (Flag for docs).

      *   *The "Blunt Truths":* This is critical. I need to explicitly state that the "Surgeon" outcome might cause political heat. I need to admit that "Undue Inducement" is subjective.

  8.  **Review against Constraints:**
      *   *20 mins/protocol?* The checklist needs to be scannable.
      *   *Philosophical grounding?* Mention validity conditions (Beauchamp & Childress-esque).
      *   *Judgment calls?* Explicitly label them.
      *   *Unliked answer?* Ensure the Surgeon case results in a rejection/flag.
      *   *Blunt about misfires?* Add a specific section on "Where this Procedure Lies to You."

  9.  **Refining the Tone:**
