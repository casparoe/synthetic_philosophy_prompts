      *   *Rejecting (3):* Deny that functions induce orderings. (Mathematically false).
      *   *Rejecting (4):* Distinguish *conservative bias* from *value specification*. (This is the user's preferred route). Cost: Admitting it's not "value-neutral," just "value-light."
