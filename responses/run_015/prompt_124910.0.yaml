      *   **The User's Position:** Wants to know if the argument is clever or slippery. Suspects step (3) to (4) is the weak point (distance vs. value). Willing to concede (5) (that it encodes *some* value) rather than (1).
      *   **User's Counter-Proposal:** "Undo-cost" (penalize work required to restore the status quo).
