  2.  **Deconstruct the Flatmate's Argument:**
      *   (1) Impact penalty must distinguish task vs. side-effect.
      *   (2) Implementable measures are functions from trajectories to reals.
      *   (3) Real-valued function = utility function = total ordering.
      *   (4) Ordering states by disvalue = specification of value.
      *   (5) If it specifies value, it's just aligned AI (redundant).
      *   (6) If it doesn't specify value, it penalizes all change (paralysis).
      *   (7) Generalization to ethics.

      *   *Critique:* The core sleight of hand is in (3) and (4). A metric (distance) is not a utility function. A utility function ranks outcomes based on *preference*. A distance metric ranks outcomes based on *deviation from a baseline*. While mathematically both map to $\mathbb{R}$, semantically and functionally they differ. However, the flatmate argues that *using* it in an objective function turns it into a utility function. This is technically true (the *overall* objective is a utility function), but the claim that the *impact measure itself* constitutes a "complete theory of value" is the leap. It encodes a *conservative bias*, not a full axiology.

  3.  **Drafting Section 1: "Where it breaks"**
