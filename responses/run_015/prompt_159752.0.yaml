  **DISTRICT MEMORANDUM 66.4.P**
  **TO:** Building Principals
  **FROM:** Dr. Aris Thorne, Assistant Superintendent for Student Experience
  **SUBJECT:** Implementation of Phenomenal Non-Realism Protocol (PNRP)

  **I. MEMORANDUM**
  Effective immediately, District policy classifies introspective reports of phenomenal properties (e.g., "qualia," "what it is like") as introspective misrepresentations of functional states. Staff must acknowledge the functional output (withdrawal, vocalization, avoidance) without validating the intrinsic quality. Pain retains its sensory-discriminative and motivational roles; students may still complain and require nursing care. However, the "hurtfulness" is categorized as a cognitive error regarding the state's nature, not the state itself. The Public Explanation Subcommittee (Budget Line 88-Q) has been funded to produce a deliverable explaining why students persist in reporting phenomenality despite its ontological absence.^1 Compliance is mandatory on district grounds, transportation, and sponsored events.

  **II. OFFICIAL REPORTING CATEGORIES**
  1.  **Functional Indicator:** Observable behavior (crying, grimacing). Valid for nurse referral and accommodation.
  2.  **Phenomenal Claim:** Student assertion of private experience (e.g., "It hurts"). Recorded as data, bracketed as truth-apt.
  3.  **Introspective Discrepancy:** Conflict between Functional Indicator and Phenomenal Claim.
  4.  **Inverted Spectrum Incident:** Dispute regarding qualitative character (e.g., Student A claims red looks like Student B's green). Resolved as data-entry error; no qualitative characters exist to compare.

  **III. STUDENT-FACING FAQ**
  **Q: Does this mean I don't feel pain?**
  A: You exhibit pain behaviors. The "feeling" is a cognitive misdescription of those behaviors.
  **Q: Does the policy apply on the bus?**
  A: Yes. District transportation is extended jurisdiction.
  **Q: What about the walk home?**
  A: PNRP applies only within district jurisdiction.
  **Q: Do I get my consciousness back at the property line?**
  A: The District takes no position on extra-jurisdictional ontology. Reports of phenomenality resuming at home are accepted as consistent with neighborhood norms.
  **Q: What about weekends?**
  A: Policy suspends Friday 3:01 PM to Monday 6:59 AM. Please avoid intense introspection during transport.
  **Q: If I think about pain at home, does it hurt more here?**
  A: Intensity ratings are localized. Do not import external phenomenal claims.
  **Q: Can I report that it seems like I see red?**
  A: You may report that you classify wavelengths as red. "Seems" implies a phenomenal property. Use "classify."

  **IV. REPORT OF INTROSPECTIVE DISCREPANCY (FORM 66.4.P-R)**
  **Student Name:** ____________________ **ID:** ___________
  **Location of Incident:** [ ] Classroom [ ] Bus [ ] Field Trip
  **Description:** I ~~feel~~ ^2 ~~appear to~~ ^3 assert that a state exists.
  **Nature of Misrepresentation:** [ ] Visual [ ] Somatic [ ] Emotional
  **Reported Intensity of Null Property (1–10):** _______
  **Functional Output Observed:** ____________________
  **Student Signature:** ____________________ **Date:** ___________
  **Parent/Guardian Signature:** ____________________
  *By signing, Guardian acknowledges that the student's introspective mechanism is functioning as predicted by generating false models of internal states.*

  ^1 *Public Explanation Subcommittee Note: Deliverable delayed due to difficulty explaining why the explanation itself isn't experienced.*
  ^2 *Compliance Office Edit: "Feel" implies phenomenal property.*
  ^3 *Compliance Office Edit: "Appear" implies phenomenal property.*
