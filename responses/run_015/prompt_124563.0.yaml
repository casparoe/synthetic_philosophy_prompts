answer: |-
  ### Brainstorming and Concept Mapping

  You are identifying a friction point between **Functional Decision Theory (FDT)** / **Updateless Decision Theory (UDT)** and **Anthropic Reasoning**. Let's map your two cases against the standard landscape.

  1.  **Standard Counterfactual Mugging (CFM):**
      *   **Structure:** Predictor simulates you. If Sim-You pays, Real-You gets reward (or avoids torture). If Sim-You refuses, Real-You gets nothing (or gets tortured).
      *   **Ontology:** There is one "Real" you. The other version is a counterfactual simulation that never instantiates if you comply.
      *   **Calculus:** You pay to make the harmful branch *unrealized*. Total suffering decreases if you pay.

  2.  **Your Case 1 (Correlated Coin):**
      *   **Structure:** Two simulations exist (A and B). A coin flip (correlated with your algorithm) selects which one is tortured.
      *   **Ontology:** Both simulations are ontologically "real" (or at least, both are instantiated before the coin resolves).
      *   **Calculus:** This is closer to **Newcomb's Problem** with a penalty. If the coin is logically correlated with your decision (e.g., pseudo-random seed based on your source code), FDT says "Pay" to influence the logical outcome. If it's a physical coin independent of you, CDT says "Don't Pay."

  3.  **Your Case 2 (Indexical Swap):**
      *   **Structure:** Pay $\to$ You survive, Copy suffers. Refuse $\to$ You suffer, Copy survives (or vanishes).
      *   **Ontology:** This is pure **Anthropic Uncertainty**. "Which copy am I?"
      *   **Calculus:** Here is the divergence. In standard CFM, paying reduces *total* torture (1 $\to$ 0). In your Case 2, paying shifts *indexical* torture (Me $\to$ Other). Total torture remains constant (1 unit).

  **The Core Tension:**
  Standard decision theory assumes a stable "I." Your scenarios destabilize the "I." This moves the problem from **Decision Theory** (how to choose) to **Population Ethics/Identity** (who is choosing and who suffers). In the literature surrounding MIRI, LessWrong, and academic philosophy (Parfit, Bostrom), this specific XOR structure usually appears in discussions of **"Teleportation Problems,"** **"Splitting Cases,"** or **"Anthropic Mugging."**

  ### Is There an Established Name?

  **Confidence: 90%**
  There is **no single, canonical textbook name** for this exact "XOR-flavored blackmail" pattern. It is not "Counterfactual Mugging" (because the harm is realized in *some* branch regardless). It is not "Newcomb's Problem" (because the payoff structure involves identity swapping).

  It is most commonly discussed under the umbrella of **"Anthropic Mugging"** or **"Indexical Blackmail."** However, those terms are often used loosely to describe any mugging involving copies. Your specific constraint—that the harm is *mutually exclusive across copies* and the decision *selects the victim*—is a distinct sub-case.

  **Proposed Label:**
  Given the lack of a standard term, I propose **"Indexical XOR Blackmail."**
  *   **Boundary Conditions:**
      1.  **Multiplicity:** There must be $\ge$ 2 instantiations of the agent (copies/simulations).
      2.  **Exclusivity:** The negative outcome (torture) applies to exactly one instantiation (XOR logic).
      3.  **Selection:** The agent's decision algorithm determines *which* instantiation suffers, not *whether* suffering occurs (in the total sum).
      4.  **Correlation:** The selection mechanism correlates with the decision (via prediction or logical dependency).

  ### Does It Change the Decision Calculus?

  **Confidence: 85%**
  Yes, but **only depending on the Utility Function**, not necessarily the Decision Algorithm. This is the critical distinction.

  1.  **Total Utilitarianism (World-Centered):**
      *   **Calculus:** No change from standard mugging.
      *   **Reasoning:** If you value total welfare, Case 2 is identical to standard mugging. One unit of torture exists either way. The only variable is the 1000 utils cost. If 1000 < Torture, you pay. The fact that "You" vs. "Copy" suffers is irrelevant metadata.
      *   **UDT View:** An Updateless agent optimizes the policy across all branches. If the branches are symmetric, UDT sums the utility. It treats "Me" and "Copy" as instances of the same algorithm.

  2.  **Indexical Selfishness (Self-Centered):**
      *   **Calculus:** **Massive Divergence.**
      *   **Reasoning:** In standard CFM, paying saves *you* from a counterfactual threat. In Indexical XOR Blackmail (Case 2), paying saves *you* by sacrificing *your copy*.
      *   **The Trap:** A purely indexical egoist (who only cares about their current subjective stream of consciousness) might refuse to pay in Case 2, reasoning "If I pay, *I* survive, but if I don't pay, *I* suffer." Wait—if I don't pay, *I* suffer. If I pay, *I* survive. So a selfish agent *should* pay to save themselves, regardless of the copy.
      *   **Correction:** Actually, look closer at Case 2. "Paying makes you vanish and the other copy takes the hit." If paying makes *you* vanish, do you survive? If "vanish" means death, then Pay = Death (for you) + Copy Tortured. Refuse = You Tortured + Copy Survives. A selfish agent prefers "You Tortured" over "You Dead."
      *   **Refined Case 2:** If Pay = You Live (Copy Tortured) vs. Refuse = You Tortured (Copy Lives). A selfish agent pays.
      *   **The Real Divergence:** The divergence arises if the agent uses **Self-Sampling Assumption (SSA)** vs. **Self-Indication Assumption (SIA)**.
          *   If I refuse, am I the copy that gets tortured? If the setup implies "If you refuse, you *are* the torture victim," then the indexical uncertainty is resolved by the action.
          *   The calculus changes if the agent believes their decision *updates* the probability of which copy they are. (e.g., "If I decide to pay, I am more likely to be the copy that pays.")

  **Conclusion on Calculus:** For a standard UDT agent with a world-centered utility function, this is **decorative framing**. The algorithm optimizes the source code output; it doesn't care which physical instance bears the cost. For an agent with an indexical utility function (caring about "this specific body"), the calculus shifts from "Minimize Total Pain" to "Minimize *My* Pain," which can lead to different choices if the "I" is ambiguous.

  ### Confidence and Uncertainty

  **Overall Confidence:** High that this is a recognized *type* of problem in niche decision theory circles (anthropics + FDT), but high that it lacks a standardized name like "Prisoner's Dilemma."

  **The Point I Am Least Sure Of (Confidence: 60%):**
  Whether **UDT technically collapses this distinction entirely.**

  Here is the nuance: Proponents of UDT often argue that "indexical utility" is incoherent or should be compiled into "world utility" plus a weighting of copies. If UDT mandates that you treat all copies of your algorithm as equally "you," then Indexical XOR Blackmail is mathematically identical to Standard Mugging (1 unit of pain vs. 0 units).

  However, there is an ongoing debate (e.g., in the "Sleeping Beauty" literature) about whether a rational agent *should* care about their indexical location. If there is a legitimate formalism for **Self-Interested UDT** (where I care more about *this* instance than *that* instance), then your XOR pattern creates a genuine technical divergence in the decision equation, not just a preference shift. I am least sure whether the consensus in formal decision theory treats indexical selfishness as a valid utility function or a cognitive bias to be corrected by the decision theory itself.

  **Summary:** You have carved out something real. It is **Indexical XOR Blackmail**. It is distinct from Counterfactual Mugging because the harm is *distributed* rather than *avoided*. It changes the calculus **if and only if** the agent's utility function is indexical (self-locating) rather than totalizing. If the agent is a total utilitarian UDT bot, it is indeed just decorative framing.
